<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1220 640" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1220" height="640" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="1200.0" height="620.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="600.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конфлікт числових UID/GID у томах (Bind Mounts) та User Namespaces</text>
<rect x="30.0" y="60.0" width="350.0" height="530.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="205.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Хост: Файлова система (Ext4/XFS)</text>
<rect x="45.0" y="110.0" width="320.0" height="60.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.1"/><text x="205.0" y="129.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Інод /data/app.db на диску:</tspan><tspan x="205.0" dy="14.3">Числові ідентифікатори: UID = 1000, GID = 1000</tspan><tspan x="205.0" dy="14.3">Права доступу: 0600 (-rw-------)</tspan></text>
<rect x="45.0" y="190.0" width="320.0" height="100.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.1"/><text x="205.0" y="213.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Перевірка прав у ядрі:</tspan><tspan x="205.0" dy="15.6">Ядро не знає імен («developer», «app»).</tspan><tspan x="205.0" dy="15.6">Функція generic_permission() порівнює:</tspan><tspan x="205.0" dy="15.6">• inode-&gt;i_uid (1000 на диску)</tspan><tspan x="205.0" dy="15.6">• current_fsuid() процесу, що робить open()</tspan></text>
<rect x="45.0" y="310.0" width="320.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="205.0" y="340.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Файли, створені root у контейнері:</tspan><tspan x="205.0" dy="14.3">Якщо процес у контейнері має UID = 0 (default),</tspan><tspan x="205.0" dy="14.3">нові файли на хості отримують UID = 0 (root).</tspan><tspan x="205.0" dy="14.3">Звичайний користувач хоста не може їх</tspan><tspan x="205.0" dy="14.3">редагувати або видалити без sudo.</tspan></text>
<rect x="45.0" y="440.0" width="320.0" height="120.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.1"/><text x="205.0" y="473.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Файл /etc/subuid на хості:</tspan><tspan x="205.0" dy="15.6">Формат: user:subuid_start:count</tspan><tspan x="205.0" dy="15.6">developer:100000:65536</tspan><tspan x="205.0" dy="15.6">Виділяє діапазон підпорядкованих UID</tspan><tspan x="205.0" dy="15.6">для використання в User Namespace.</tspan></text>
<rect x="410.0" y="60.0" width="360.0" height="530.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="590.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Сценарій А: Звичайний Bind Mount (Без мапінгу)</text>
<rect x="425.0" y="110.0" width="330.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.1"/><text x="590.0" y="131.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Команда запуску:</tspan><tspan x="590.0" dy="15.6">docker run -v /data:/app/data -u 1001 my-app</tspan><tspan x="590.0" dy="15.6">Процес працює від UID 1001 (USER app).</tspan></text>
<rect x="425.0" y="195.0" width="330.0" height="130.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.3"/><text x="590.0" y="233.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Кроки перевірки VFS:</tspan><tspan x="590.0" dy="11.7">1. Контейнерний процес викликає open('/app/data/app.db')</tspan><tspan x="590.0" dy="11.7">2. current_fsuid() = 1001</tspan><tspan x="590.0" dy="11.7">3. inode-&gt;i_uid = 1000 (хостовий власник)</tspan><tspan x="590.0" dy="11.7">4. 1001 != 1000, біти 'other' = 000 (заборона)</tspan><tspan x="590.0" dy="11.7">5. Результат: EACCES (Permission Denied)!</tspan></text>
<rect x="425.0" y="345.0" width="330.0" height="215.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.1"/><text x="590.0" y="426.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="590.0" dy="0.0">Чому це ламає середовище:</tspan><tspan x="590.0" dy="11.7">• Образ створено під фіксованого USER (UID 1000),</tspan><tspan x="590.0" dy="11.7">  а на сервері хостовий каталог належить UID 1005.</tspan><tspan x="590.0" dy="11.7">• Спроби обійти через chmod 777 відкривають діру в безпеці.</tspan><tspan x="590.0" dy="11.7">• Ручне вирівнювання через --user $(id -u):$(id -g)</tspan><tspan x="590.0" dy="11.7">  вимагає синхронізації між усіма вузлами.</tspan></text>
<rect x="800.0" y="60.0" width="370.0" height="530.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="985.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Сценарій Б: User Namespaces та ID-mapping</text>
<rect x="815.0" y="110.0" width="340.0" height="75.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.1"/><text x="985.0" y="128.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="985.0" dy="0.0">Мапінг UID (/proc/[pid]/uid_map):</tspan><tspan x="985.0" dy="15.6">Podman Rootless / userns-remap:</tspan><tspan x="985.0" dy="15.6">0 (всередині)  &lt;---&gt;  1000 (на хості)</tspan><tspan x="985.0" dy="15.6">1..65535      &lt;---&gt;  100000..165534</tspan></text>
<rect x="815.0" y="205.0" width="340.0" height="140.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.3"/><text x="985.0" y="248.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="985.0" dy="0.0">Трансляція в ядрі (make_kuid / from_kuid):</tspan><tspan x="985.0" dy="11.7">1. Процес у контейнері бачить себе як root (UID 0)</tspan><tspan x="985.0" dy="11.7">2. Ядро транслює UID 0 -&gt; KUID 1000 на хості</tspan><tspan x="985.0" dy="11.7">3. open('/data/app.db') виконується з current_fsuid = 1000</tspan><tspan x="985.0" dy="11.7">4. 1000 == 1000 -&gt; Доступ надано (OK)!</tspan><tspan x="985.0" dy="11.7">5. Нові файли створюються з UID 1000 на хості.</tspan></text>
<rect x="815.0" y="365.0" width="340.0" height="195.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.1"/><text x="985.0" y="433.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="985.0" dy="0.0">ID-mapped mounts (Linux 5.12+):</tspan><tspan x="985.0" dy="13.0">• mount_setattr() прив'язує struct user_namespace</tspan><tspan x="985.0" dy="13.0">  безпосередньо до точки монтування.</tspan><tspan x="985.0" dy="13.0">• Трансляція відбувається на льоту у VFS без</tspan><tspan x="985.0" dy="13.0">  переписування файлів на диску (без chown).</tspan><tspan x="985.0" dy="13.0">• Безпечний спільний доступ між різними контейнерами.</tspan></text>
</svg>