<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1220 660" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1220" height="660" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="0.0" y="0.0" width="1200.0" height="640.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/>
<text x="600.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Мережева ізоляція та розпізнавання імен: Default Bridge проти Custom Network</text>
<rect x="30.0" y="60.0" width="550.0" height="550.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="305.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Дефолтний міст: docker0 (172.17.0.0/16)</text>
<rect x="50.0" y="110.0" width="510.0" height="65.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.1"/><text x="305.0" y="131.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Конфігурація DNS (/etc/resolv.conf у контейнері):</tspan><tspan x="305.0" dy="15.6">Копіює хостовий resolv.conf (наприклад, nameserver 8.8.8.8 або 1.1.1.1).</tspan><tspan x="305.0" dy="15.6">Немає вбудованого DNS-сервера Docker.</tspan></text>
<rect x="50.0" y="190.0" width="510.0" height="130.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="305.0" y="220.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Спроба з'єднання за іменем:</tspan><tspan x="305.0" dy="15.6">1. Контейнер web (172.17.0.2) викликає getaddrinfo('db')</tspan><tspan x="305.0" dy="15.6">2. Запит надсилається на 8.8.8.8 (зовнішній DNS)</tspan><tspan x="305.0" dy="15.6">3. 8.8.8.8 нічого не знає про локальний контейнер 'db'</tspan><tspan x="305.0" dy="15.6">4. Відповідь: NXDOMAIN (Name or service not known)</tspan><tspan x="305.0" dy="15.6">5. Помилка: З'єднання неможливе без жорстких IP або застарілого --link.</tspan></text>
<rect x="50.0" y="340.0" width="510.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.1"/><text x="305.0" y="379.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Пастка 127.0.0.53 (systemd-resolved на хості):</tspan><tspan x="305.0" dy="13.0">Якщо на хості працює systemd-resolved, хостовий resolv.conf містить 127.0.0.53.</tspan><tspan x="305.0" dy="13.0">Docker не копіює loopback-адресу, бо всередині netns це адреса самого контейнера,</tspan><tspan x="305.0" dy="13.0">і підставляє Google DNS (8.8.8.8) — локальні DNS-імена хоста стають недоступними.</tspan></text>
<rect x="50.0" y="470.0" width="510.0" height="120.0" rx="6" fill="#fff6e5" stroke="#6b7280" stroke-width="1.1"/><text x="305.0" y="512.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="305.0" dy="0.0">Чому так зроблено:</tspan><tspan x="305.0" dy="14.3">Дефолтна мережа docker0 створена для зворотної сумісності.</tspan><tspan x="305.0" dy="14.3">Docker свідомо не вмикає автоматичне виявлення сервісів</tspan><tspan x="305.0" dy="14.3">у дефолтному мості, щоб запобігти витоку імен між непов'язаними контейнерами.</tspan></text>
<rect x="620.0" y="60.0" width="550.0" height="550.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="895.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Користувацька мережа: my-net (172.20.0.0/16)</text>
<rect x="640.0" y="110.0" width="510.0" height="65.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.1"/><text x="895.0" y="131.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="895.0" dy="0.0">Конфігурація DNS (/etc/resolv.conf у контейнері):</tspan><tspan x="895.0" dy="15.6">nameserver 127.0.0.11</tspan><tspan x="895.0" dy="15.6">options ndots:0</tspan></text>
<rect x="640.0" y="190.0" width="510.0" height="130.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.2"/><text x="895.0" y="223.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="895.0" dy="0.0">Магія 127.0.0.11 та перехоплення iptables:</tspan><tspan x="895.0" dy="14.3">1. Запит getaddrinfo('db') надсилається на 127.0.0.11:53 (UDP)</tspan><tspan x="895.0" dy="14.3">2. Правило iptables (ланок OUTPUT/PREROUTING) у netns контейнера</tspan><tspan x="895.0" dy="14.3">   перенаправляє пакет на випадковий внутрішній порт dockerd embedded DNS</tspan><tspan x="895.0" dy="14.3">3. Embedded DNS резолвить 'db' -&gt; 172.20.0.3 через внутрішній реєстр</tspan><tspan x="895.0" dy="14.3">4. Зовнішні запити (api.github.com) пересилаються на upstream DNS хоста.</tspan></text>
<rect x="640.0" y="340.0" width="510.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.1"/><text x="895.0" y="375.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="895.0" dy="0.0">Мережевий міст br-xxxx та ізоляція:</tspan><tspan x="895.0" dy="15.6">Кожна створена мережа дістає окремий Linux Bridge.</tspan><tspan x="895.0" dy="15.6">Таблиці iptables містять правила DOCKER-ISOLATION-STAGE-1/2,</tspan><tspan x="895.0" dy="15.6">які забороняють прямий маршрутизований трафік між різними мостами.</tspan></text>
<rect x="640.0" y="470.0" width="510.0" height="120.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.1"/><text x="895.0" y="510.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="895.0" dy="0.0">Діагностика збоїв DNS у контейнерах:</tspan><tspan x="895.0" dy="15.6">• Перевірка зсередини: dig @127.0.0.11 db або nslookup db</tspan><tspan x="895.0" dy="15.6">• Перевірка iptables: iptables-save -t nat | grep 127.0.0.11</tspan><tspan x="895.0" dy="15.6">• Перевірка блокування зв'язку: iptables -L FORWARD -n -v</tspan></text>
</svg>