<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Парсинг аргументів POSIX vs GNU</text>
<rect x="20.0" y="16.0" width="900.0" height="36.0" rx="6" fill="#eef2f8" stroke="#2457d6" stroke-width="1.5"/><text x="470.0" y="46.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Парсинг аргументів: зупинка за POSIX проти пермутації у GNU</tspan></text>
<rect x="40.0" y="66.0" width="860.0" height="50.0" rx="8" fill="#fbfdff" stroke="#aab4c0" stroke-width="1.5"/>
<text x="470.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Команда із перемішаними прапорцями та аргументами:</text>
<text x="470.0" y="106.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">grep   &quot;error&quot;   -i   -n   /var/log/syslog</text>
<rect x="40.0" y="130.0" width="410.0" height="275.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.6"/>
<rect x="55.0" y="142.0" width="380.0" height="30.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="245.0" y="160.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="245.0" dy="0.0">Стандартний POSIX getopt() (BSD / macOS / POSIXLY_CORRECT)</tspan></text>
<text x="65.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Токен 'grep':</text>
<text x="210.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">назва програми (argv[0])</text>
<text x="65.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Токен 'error':</text>
<text x="210.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">перший позиційний аргумент (шаблон)</text>
<text x="65.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">3. Зупинка сканування:</text>
<text x="210.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">getopt() зупиняється на першому не-прапорці!</text>
<text x="65.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">4. Токени '-i', '-n':</text>
<text x="210.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">інтерпретуються як імена файлів, а не прапорці!</text>
<text x="65.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">5. Результат:</text>
<text x="210.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">пошук 'error' у файлах '-i', '-n' та '/var/log/syslog'</text>
<rect x="490.0" y="130.0" width="410.0" height="275.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/>
<rect x="505.0" y="142.0" width="380.0" height="30.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="695.0" y="160.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="695.0" dy="0.0">GNU getopt_long() за замовчуванням (GNU/Linux / glibc)</tspan></text>
<text x="515.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">1. Токен 'grep':</text>
<text x="660.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">назва програми (argv[0])</text>
<text x="515.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">2. Токен 'error':</text>
<text x="660.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">відкладено у внутрішній список аргументів</text>
<text x="515.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">3. Пермутація argv:</text>
<text x="660.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">сканує рядок до кінця, витягуючи всі прапорці</text>
<text x="515.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">4. Прапорці '-i', '-n':</text>
<text x="660.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">успішно активують ігнорування регістру й нумерацію</text>
<text x="515.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">5. Результат:</text>
<text x="660.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">виконується: grep -i -n &quot;error&quot; /var/log/syslog</text>
<line x1="450.0" y1="260.0" x2="490.0" y2="260.0" stroke="#e08a1e" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="420.0" width="860.0" height="60.0" rx="6" fill="#fff6e6" stroke="#e08a1e" stroke-width="1.5"/><text x="470.0" y="446.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Практичний висновок: за стандартом POSIX усі прапорці обов'язково мають передувати позиційним аргументам.</tspan><tspan x="470.0" dy="15.0">Якщо поставити аргумент перед прапорцем на macOS чи BSD, скрипт зламається.</tspan></text>
</svg>