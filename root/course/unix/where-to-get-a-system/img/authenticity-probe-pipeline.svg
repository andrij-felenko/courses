<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Діагностичне дерево: критерії автентичності ядра та середовища</text>
<rect x="30.0" y="56.0" width="380.0" height="380.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="220.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Анатомічні ознаки живого ядра Linux</text>
<text x="220.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Тести на рівні процесора, пам'яті та структур VFS</text>
<rect x="45.0" y="118.0" width="350.0" height="56.0" rx="5" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.1"/>
<text x="55.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">1. Інструкція SYSCALL (Ring 0)</text>
<text x="55.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="55.0" dy="0.0">Прямий апаратний виклик переводить процесор у режим ядра,</tspan><tspan x="55.0" dy="11.2">змінюючи регістри RSP -&gt; TSS.RSP0 без посередництва Win32.</tspan></text>
<rect x="45.0" y="181.0" width="350.0" height="56.0" rx="5" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.1"/>
<text x="55.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">2. Псевдофайлова система /proc</text>
<text x="55.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="55.0" dy="0.0">Генерація вузлів у пам'яті на льоту: /proc/self/maps,</tspan><tspan x="55.0" dy="11.2">/proc/version, /proc/cpuinfo, таблиці файлових дескрипторів.</tspan></text>
<rect x="45.0" y="244.0" width="350.0" height="56.0" rx="5" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.1"/>
<text x="55.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">3. Файлова підсистема /sys (sysfs)</text>
<text x="55.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="55.0" dy="0.0">Дерево пристроїв, шин та драйверів kobject/kset:</tspan><tspan x="55.0" dy="11.2">/sys/class, /sys/devices, інтерфейси cgroup v2.</tspan></text>
<rect x="45.0" y="307.0" width="350.0" height="56.0" rx="5" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.1"/>
<text x="55.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">4. Семантика POSIX unlink()</text>
<text x="55.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="55.0" dy="0.0">Видалення відкритого файлу негайно прибирає dentry,</tspan><tspan x="55.0" dy="11.2">але inode живе до закриття останнього дескриптора.</tspan></text>
<rect x="45.0" y="370.0" width="350.0" height="56.0" rx="5" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.1"/>
<text x="55.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">5. Дескриптори в сокетах AF_UNIX</text>
<text x="55.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="55.0" dy="0.0">Передача дескрипторів через SCM_RIGHTS та нативна</tspan><tspan x="55.0" dy="11.2">підсистема epoll з дескрипторними чергами очікування.</tspan></text>
<rect x="450.0" y="56.0" width="380.0" height="380.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<text x="640.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Ідентифікація типу виконання</text>
<text x="640.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Маркери середовища у віртуальних таблицях і DMI</text>
<rect x="465.0" y="118.0" width="350.0" height="56.0" rx="5" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.1"/>
<text x="475.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">Bare Metal (Фізична машина)</text>
<text x="475.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="475.0" dy="0.0">CPUID Hypervisor bit = 0; DMI містить виробника плати;</tspan><tspan x="475.0" dy="11.2">всі апаратні ядра доступні без VMCS-виходів.</tspan></text>
<rect x="465.0" y="181.0" width="350.0" height="56.0" rx="5" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.1"/>
<text x="475.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">KVM / QEMU / Cloud VPS</text>
<text x="475.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="475.0" dy="0.0">CPUID Hypervisor bit = 1; підпис 'KVMKVMKVM';</tspan><tspan x="475.0" dy="11.2">пристрої virtio-blk/virtio-net у /sys/bus/virtio.</tspan></text>
<rect x="465.0" y="244.0" width="350.0" height="56.0" rx="5" fill="#fefce8" stroke="#ca8a04" stroke-width="1.1"/>
<text x="475.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ca8a04" text-anchor="start" font-weight="700">WSL2 (Windows Hyper-V)</text>
<text x="475.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="475.0" dy="0.0">Рядок 'microsoft-standard-WSL2' у /proc/version;</tspan><tspan x="475.0" dy="11.2">наявність драйвера /dev/dxg (DirectX GPU) та 9P-FS.</tspan></text>
<rect x="465.0" y="307.0" width="350.0" height="56.0" rx="5" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.1"/>
<text x="475.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">Docker / Podman Контейнер</text>
<text x="475.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="475.0" dy="0.0">Файл /.dockerenv або маркер 'container=' у /proc/1/environ;</tspan><tspan x="475.0" dy="11.2">ізольований простір імен PID 1 та обмежені cgroups.</tspan></text>
<rect x="465.0" y="370.0" width="350.0" height="56.0" rx="5" fill="#fef2f2" stroke="#c0392b" stroke-width="1.1"/>
<text x="475.0" y="386.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Cygwin / MSYS2 (Емуляція)</text>
<text x="475.0" y="401.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start"><tspan x="475.0" dy="0.0">Відсутнє ядро Linux; uname повідомляє MINGW/CYGWIN;</tspan><tspan x="475.0" dy="11.2">/proc є статичною структурою DLL-бібліотеки.</tspan></text>
</svg>