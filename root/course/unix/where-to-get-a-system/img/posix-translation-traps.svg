<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пастки емуляції: чому трансляція API ламається на низькому рівні</text>
<rect x="24.0" y="52.0" width="260.0" height="380.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<rect x="24.0" y="52.0" width="260.0" height="36.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="154.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">1. Семантика видалення файлів (unlink)</text>
<text x="36.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">Справжнє ядро POSIX / Linux:</text>
<text x="36.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Процес тримає дескриптор через open().</text>
<text x="36.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Інший виклик робить unlink('file.txt').</text>
<text x="36.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Запис у каталозі зникає негайно.</text>
<text x="36.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Inode і дані на диску лишаються,</text>
<text x="36.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  доки останній процес не викличе close().</text>
<text x="36.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">Емуляція на Windows NT (WSL1/Cygwin):</text>
<text x="36.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Windows NT блокує видалення відкритого файлу.</text>
<text x="36.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Виклик повертає ERROR_SHARING_VIOLATION.</text>
<text x="36.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Робота баз даних (SQLite/Git) аварійно ламається.</text>
<rect x="300.0" y="52.0" width="260.0" height="380.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<rect x="300.0" y="52.0" width="260.0" height="36.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="430.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">2. Клонування процесу (fork vs NT)</text>
<text x="312.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">Справжнє ядро POSIX / Linux:</text>
<text x="312.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• fork() дублює адресний простір миттєво</text>
<text x="312.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  через апаратний Copy-on-Write (MMU).</text>
<text x="312.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Усі дескриптори та сокети зберігаються.</text>
<text x="312.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Дочірній процес готовий за мікросекунди.</text>
<text x="312.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">Емуляція на Windows NT (WSL1/Cygwin):</text>
<text x="312.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Ядро NT не має примітива fork() для процесів.</text>
<text x="312.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Cygwin змушений створювати CreateProcess,</text>
<text x="312.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  зупиняти його та вручну копіювати пам'ять.</text>
<text x="312.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Швидкість запуску падає в десятки разів.</text>
<rect x="576.0" y="52.0" width="260.0" height="380.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.4"/>
<rect x="576.0" y="52.0" width="260.0" height="36.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="706.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">3. Події та передача дескрипторів</text>
<text x="588.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">Справжнє ядро POSIX / Linux:</text>
<text x="588.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• epoll очікує на сотні тисяч дескрипторів у ядрі.</text>
<text x="588.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• AF_UNIX передає відкриті дескриптори файлів</text>
<text x="588.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">  між процесами через керування SCM_RIGHTS.</text>
<text x="588.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Ядро оновлює лічильник посилань struct file.</text>
<text x="588.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">Емуляція на Windows NT (WSL1/Cygwin):</text>
<text x="588.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• У Winsock відсутня семантика передачі файлів.</text>
<text x="588.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• epoll емулюється через повільний select().</text>
<text x="588.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">• Служби systemd, dbus, wayland не працюють.</text>
</svg>