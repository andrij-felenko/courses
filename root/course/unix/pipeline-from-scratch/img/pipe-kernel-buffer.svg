<text x="480.0" y="280.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7e22ce" text-anchor="middle">tail (позиція читання) ────► сторінка 0</text>
<rect x="320.0" y="310.0" width="320.0" height="115.0" rx="6" fill="#ffffff" stroke="#2563eb" stroke-width="1.0"/>
<text x="480.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle" font-weight="700">Черги очікування синхронізації (Wait Queues):</text>
<text x="480.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle">• wr_wait: розбудити виробника, коли звільниться місце</text>
<text x="480.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle">• rd_wait: розбудити споживача, коли з'являться дані</text>
<text x="480.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">• fcntl(F_SETPIPE_SZ): зміна розміру від 4 KB до 1 MB+</text>
<line x1="655.0" y1="230.0" x2="695.0" y2="230.0" stroke="#7e22ce" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="700.0" y="65.0" width="230.0" height="380.0" rx="8" fill="#faf5ff" stroke="#7e22ce" stroke-width="1.5"/>
<rect x="734.3" y="71.2" width="161.4" height="47.6" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="815.0" y="91.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="815.0" dy="0.0">Споживач (Consumer)</tspan><tspan x="815.0" dy="15.6">awk '{print $1}'</tspan></text>
<text x="715.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">1. Очікує дані з пайпу</text>
<text x="715.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start" font-weight="700">2. read(fd, buf, count)</text>
<text x="715.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#e08a1e" text-anchor="start">3. Якщо буфер порожній:</text>
<text x="715.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#e08a1e" text-anchor="start">   → потік блокується</text>
<text x="715.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">   → очікує в pipe-&gt;rd_wait</text>
<text x="715.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">4. Якщо виробник закрив FD:</text>
<text x="715.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start" font-weight="700">   → read повертає 0 (EOF)</text>
<text x="715.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">   → нормальне завершення</text>
<rect x="715.0" y="360.0" width="200.0" height="65.0" rx="6" fill="#ffffff" stroke="#7e22ce" stroke-width="1.0"/>
<text x="815.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7e22ce" text-anchor="middle" font-weight="700">Дескриптор FD 0 (stdin)</text>
<text x="815.0" y="402.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="middle">Читання з дескриптора каналу</text>
<rect x="30.0" y="452.0" width="900.0" height="20.0" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="480.0" y="466.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle">Механізм Backpressure гарантує: швидкий процес не переповнює оперативну пам'ять системи</text>
</svg>