<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Фізика каналу в ядрі: кільцевий буфер pipe_inode_info та Backpressure</text>
<rect x="30.0" y="65.0" width="230.0" height="380.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<rect x="64.3" y="71.2" width="161.4" height="47.6" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="145.0" y="91.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="145.0" dy="0.0">Виробник (Producer)</tspan><tspan x="145.0" dy="15.6">grep ' 500 '</tspan></text>
<text x="45.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">1. Генерує потік даних</text>
<text x="45.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start" font-weight="700">2. write(fd, buf, count)</text>
<text x="45.0" y="197.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">3. Перевіряє вільне місце</text>
<text x="45.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="start">4. Якщо буфер повний (64 KB):</text>
<text x="45.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="start" font-weight="700">   → потік блокується</text>
<text x="45.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">   → стан TASK_INTERRUPTIBLE</text>
<text x="45.0" y="301.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">   → очікує в pipe-&gt;wr_wait</text>
