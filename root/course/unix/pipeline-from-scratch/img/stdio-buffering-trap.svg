<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Анатомія буферизації: чому зависає конвеєр у реальному часі</text>
<rect x="30.0" y="65.0" width="430.0" height="390.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<rect x="78.1" y="71.8" width="333.7" height="46.5" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="245.0" y="91.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="245.0" dy="0.0">Сценарій А: Вивід у термінал (isatty = true)</tspan><tspan x="245.0" dy="15.0">tail -f app.log | grep 'ERROR'</tspan></text>
<rect x="50.0" y="140.0" width="390.0" height="85.0" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.0"/>
<text x="245.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="middle" font-weight="700">Простір користувача: Бібліотека C (libc stdio)</text>
<text x="245.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle" font-weight="700">Режим: _IOLBF (Line Buffered / Порядкова буферизація)</text>
<text x="245.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#4b5563" text-anchor="middle">Буфер скидається при кожному '\n' (символі нового рядка)</text>
<line x1="245.0" y1="225.0" x2="245.0" y2="255.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="255.0" width="390.0" height="65.0" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.0"/>
<text x="245.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">Дисципліна ліній TTY ядра (Terminal Driver)</text>
<text x="245.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#4b5563" text-anchor="middle">Миттєва передача рядка в емулятор термінала</text>
<line x1="245.0" y1="320.0" x2="245.0" y2="350.0" stroke="#16a34a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="350.0" width="390.0" height="85.0" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.2"/>
<text x="245.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">Результат: НУЛЬОВА ЗАТРИМКА (Real-time)</text>
<text x="245.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle">Кожен рядок логу з'являється на екрані негайно</text>
<text x="245.0" y="420.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Затримка = ~0 мілісекунд</text>
<rect x="500.0" y="65.0" width="430.0" height="390.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<rect x="537.4" y="71.8" width="355.1" height="46.5" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="715.0" y="91.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="715.0" dy="0.0">Сценарій Б: Вивід у пайп (isatty = false)</tspan><tspan x="715.0" dy="15.0">tail -f app.log | grep 'ERR' | awk '{print $1}'</tspan></text>
<rect x="520.0" y="140.0" width="390.0" height="85.0" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.0"/>
<text x="715.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="middle" font-weight="700">Простір користувача: Бібліотека C (libc stdio)</text>
<text x="715.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="700">Режим: _IOFBF (Fully Buffered / Блокова буферизація 4096 B)</text>
<text x="715.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#4b5563" text-anchor="middle">write() викликається ЛИШЕ коли накопичиться 4 KB!</text>
<line x1="715.0" y1="225.0" x2="715.0" y2="255.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="520.0" y="255.0" width="390.0" height="65.0" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.0"/>
<text x="715.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e293b" text-anchor="middle" font-weight="700">Кільцевий буфер каналу в ядрі (Pipe Buffer)</text>
<text x="715.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#4b5563" text-anchor="middle">Дані взагалі не потрапляють у ядро, поки заповнюється 4 KB</text>
<line x1="715.0" y1="320.0" x2="715.0" y2="350.0" stroke="#dc2626" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="520.0" y="350.0" width="390.0" height="85.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.2"/>
<text x="715.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">Результат: ІЛЮЗІЯ ЗАВИСАННЯ (Stall / Latency)</text>
<text x="715.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#991b1b" text-anchor="middle">Рідкісні події (1 рядок/хв) затримуються на десятки хвилин!</text>
<text x="715.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2563eb" text-anchor="middle" font-weight="700">Лікування: stdbuf -oL або grep --line-buffered</text>
</svg>