<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">ТОПОЛОГІЯ ТЕРМІНАЛЬНОГО СЕАНСУ ТА ГРУП ПРОЦЕСІВ</text>
<rect x="30.0" y="60.0" width="260.0" height="480.0" rx="8" fill="#fbfcff" stroke="#6b7280" stroke-width="1.5"/>
<text x="160.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">ПРОСТІР КОРИСТУВАЧА</text>
<text x="160.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Емулятор термінала</text>
<rect x="50.0" y="125.0" width="220.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="160.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Процес GUI (Alacritty / GNOME)</text>
<text x="160.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">PID = 4120</tspan><tspan x="160.0" dy="14.3">Тримає master_fd = 3</tspan><tspan x="160.0" dy="14.3">Читає клавіші, малює вікно</tspan></text>
<rect x="50.0" y="245.0" width="220.0" height="100.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="160.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Подія закриття вікна</text>
<text x="160.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="160.0" dy="0.0">Клік [X] або розрив TCP</tspan><tspan x="160.0" dy="14.3">close(master_fd)</tspan><tspan x="160.0" dy="14.3">Вихід процесу GUI</tspan></text>
<rect x="50.0" y="365.0" width="220.0" height="155.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/>
<text x="160.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Керівний сокет / X11</text>
<text x="160.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle"><tspan x="160.0" dy="0.0">Wayland / X11 з'єднання</tspan><tspan x="160.0" dy="14.3">або мережевий сокет SSH</tspan><tspan x="160.0" dy="14.3">Втрата дескриптора</tspan><tspan x="160.0" dy="14.3">ініціює ланцюг ядра</tspan></text>
<rect x="320.0" y="60.0" width="300.0" height="480.0" rx="8" fill="#f8f9fa" stroke="#495057" stroke-width="1.5"/>
<text x="470.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#495057" text-anchor="middle" font-weight="700">ПРОСТІР ЯДРА (KERNEL SPACE)</text>
<text x="470.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Драйвер псевдотермінала (PTY)</text>
<rect x="340.0" y="130.0" width="260.0" height="90.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="470.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">PTY Master (/dev/ptmx)</text>
<text x="470.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Дескриптор у процесі емулятора</tspan><tspan x="470.0" dy="14.3">Лічильник відкриттів: refcount</tspan><tspan x="470.0" dy="14.3">Буфери вводу / виводу</tspan></text>
<line x1="470.0" y1="220.0" x2="470.0" y2="260.0" stroke="#6b7280" stroke-width="2.0" stroke-dasharray="4,4"/>
<text x="470.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Лінійна дисципліна N_TTY</text>
<rect x="340.0" y="260.0" width="260.0" height="110.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="470.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">PTY Slave (/dev/pts/3)</text>
<text x="470.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Керівний TTY сеансу (SID 5001)</tspan><tspan x="470.0" dy="14.3">Дескриптори 0, 1, 2 процесів</tspan><tspan x="470.0" dy="14.3">Передній PGID: tcsetpgrp()</tspan><tspan x="470.0" dy="14.3">Стан: активний або hung up</tspan></text>
<rect x="340.0" y="390.0" width="260.0" height="130.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="470.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Маршрутизатор сигналів ядра</text>
<text x="470.0" y="438.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">pty_close() -&gt; tty_vhangup()</tspan><tspan x="470.0" dy="14.3">Генерація SIGHUP -&gt; SID 5001</tspan><tspan x="470.0" dy="14.3">SIGCONT для зупинених груп</tspan><tspan x="470.0" dy="14.3">Скидання session-&gt;tty = NULL</tspan></text>
<rect x="650.0" y="60.0" width="320.0" height="480.0" rx="8" fill="#fbfcff" stroke="#6b7280" stroke-width="1.5"/>
<text x="810.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">СЕАНС КОРИСТУВАЧА (SID = 5001)</text>
<text x="810.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія процесів сеансу</text>
<rect x="670.0" y="125.0" width="280.0" height="100.0" rx="6" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.5"/>
<text x="810.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8e44ad" text-anchor="middle" font-weight="700">Лідер сеансу (Session Leader)</text>
<text x="810.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">Оболонка Bash (PID=5001, PGID=5001)</tspan><tspan x="810.0" dy="14.3">Керує таблицею завдань (Jobs)</tspan><tspan x="810.0" dy="14.3">Отримує SIGHUP першим від ядра</tspan></text>
<rect x="670.0" y="245.0" width="280.0" height="125.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="810.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Група переднього плану (Foreground)</text>
<text x="810.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">Текстовий редактор Neovim</tspan><tspan x="810.0" dy="14.3">PID = 5210, PGID = 5210</tspan><tspan x="810.0" dy="14.3">Володіє терміналом (tcgetpgrp = 5210)</tspan><tspan x="810.0" dy="14.3">Отримує ввід з PTY Slave</tspan></text>
<rect x="670.0" y="390.0" width="280.0" height="130.0" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.5"/>
<text x="810.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d4ac0d" text-anchor="middle" font-weight="700">Фонові групи (Background Jobs)</text>
<text x="810.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="810.0" dy="0.0">Компіляція: make -j4 (PGID=5300)</tspan><tspan x="810.0" dy="14.3">Зупинений процес: sleep (PGID=5400)</tspan><tspan x="810.0" dy="14.3">У таблиці завдань оболонки</tspan><tspan x="810.0" dy="14.3">Отримують SIGHUP від Bash</tspan></text>
<line x1="270.0" y1="175.0" x2="340.0" y2="175.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="340.0" y1="315.0" x2="270.0" y2="315.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="600.0" y1="315.0" x2="670.0" y2="175.0" stroke="#8e44ad" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="600.0" y1="315.0" x2="670.0" y2="305.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="600.0" y1="455.0" x2="670.0" y2="455.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>