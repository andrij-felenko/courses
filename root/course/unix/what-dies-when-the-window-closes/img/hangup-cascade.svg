<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">ХРОНОЛОГІЯ КАСКАДУ РОЗРИВУ ЗВ'ЯЗКУ (HANGUP CASCADE)</text>
<rect x="60.0" y="70.0" width="420.0" height="115.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="80.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">1. Закриття дескриптора</text>
<text x="80.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">GUI емулятор / SSH завершується</text>
<rect x="80.0" y="130.0" width="380.0" height="24.0" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="90.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">close(master_fd)</text>
<text x="80.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">refcount майстра падає до 0</text>
<line x1="270.0" y1="185.0" x2="270.0" y2="215.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="215.0" width="420.0" height="115.0" rx="8" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.8"/>
<text x="80.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d4ac0d" text-anchor="start" font-weight="700">2. Фіксація розриву ядром</text>
<text x="80.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Драйвер PTY переводить slave у hung up</text>
<rect x="80.0" y="275.0" width="380.0" height="24.0" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="90.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">tty_vhangup() / pty_close()</text>
<text x="80.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">read -&gt; EOF (0), write -&gt; EIO</text>
<line x1="270.0" y1="330.0" x2="270.0" y2="360.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="360.0" width="420.0" height="115.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="80.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">3. Сигнал лідеру сесії</text>
<text x="80.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Ядро знаходить лідера сесії за SID</text>
<rect x="80.0" y="420.0" width="380.0" height="24.0" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="90.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">kill(SID, SIGHUP)</text>
<text x="80.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Оболонка Bash отримує сигнал 1</text>
<line x1="480.0" y1="417.0" x2="560.0" y2="127.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="500.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Перехід</text>
<rect x="560.0" y="70.0" width="420.0" height="115.0" rx="8" fill="#f4ecf7" stroke="#8e44ad" stroke-width="1.8"/>
<text x="580.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8e44ad" text-anchor="start" font-weight="700">4. Поширення таблицею завдань</text>
<text x="580.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Оболонка обходить jobs table</text>
<rect x="580.0" y="130.0" width="380.0" height="24.0" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="590.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">kill(-pgid, SIGHUP)</text>
<text x="580.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Розсилка фоновим групам процесу</text>
<line x1="770.0" y1="185.0" x2="770.0" y2="215.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="560.0" y="215.0" width="420.0" height="115.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<text x="580.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">5. Пробудження зупинених</text>
<text x="580.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Зупинені процеси розбуджуються</text>
<rect x="580.0" y="275.0" width="380.0" height="24.0" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="590.0" y="291.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">kill(-pgid, SIGCONT)</text>
<text x="580.0" y="317.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Обробка SIGHUP у розбуджених</text>
<line x1="770.0" y1="330.0" x2="770.0" y2="360.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="560.0" y="360.0" width="420.0" height="115.0" rx="8" fill="#fbfcff" stroke="#6b7280" stroke-width="1.8"/>
<text x="580.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">6. Від'єднання термінала</text>
<text x="580.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">Ядро очищає керівний термінал</text>
<rect x="580.0" y="420.0" width="380.0" height="24.0" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/>
<text x="590.0" y="436.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">session-&gt;tty = NULL</text>
<text x="580.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">Доступ до /dev/tty дає ENXIO</text>
</svg>