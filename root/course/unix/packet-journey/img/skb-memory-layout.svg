<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 670" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="670" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Анатомія struct sk_buff: керування заголовками без копіювання пам'яті</text>
<rect x="60.0" y="65.0" width="1120.0" height="180.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="620.0" y="95.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Метаструктура struct sk_buff (керівні покажчики та службові поля)</text>
<rect x="80.0" y="115.0" width="250.0" height="110.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.2"/><text x="205.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Покажчики меж буфера:</tspan><tspan x="205.0" dy="15.6">• sk_buff_data_t head</tspan><tspan x="205.0" dy="15.6">• sk_buff_data_t data</tspan><tspan x="205.0" dy="15.6">• sk_buff_data_t tail</tspan><tspan x="205.0" dy="15.6">• sk_buff_data_t end</tspan></text>
<rect x="350.0" y="115.0" width="260.0" height="110.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.2"/><text x="480.0" y="149.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Розміри та довжини:</tspan><tspan x="480.0" dy="11.7">• unsigned int len (повна довжина)</tspan><tspan x="480.0" dy="11.7">• unsigned int data_len (розмір у фргаментах)</tspan><tspan x="480.0" dy="11.7">• unsigned int truesize (виділена RAM)</tspan><tspan x="480.0" dy="11.7">• unsigned int hdr_len</tspan></text>
<rect x="630.0" y="115.0" width="260.0" height="110.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.2"/><text x="760.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="760.0" dy="0.0">Мережевий контекст:</tspan><tspan x="760.0" dy="15.6">• struct net_device *dev</tspan><tspan x="760.0" dy="15.6">• struct sock *sk</tspan><tspan x="760.0" dy="15.6">• struct dst_entry *_skb_refdst</tspan><tspan x="760.0" dy="15.6">• __be16 protocol (0x0800, 0x86dd)</tspan></text>
<rect x="910.0" y="115.0" width="250.0" height="110.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="1035.0" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="1035.0" dy="0.0">Зсуви рівнів (Offsets):</tspan><tspan x="1035.0" dy="15.6">• __u16 mac_header</tspan><tspan x="1035.0" dy="15.6">• __u16 network_header</tspan><tspan x="1035.0" dy="15.6">• __u16 transport_header</tspan><tspan x="1035.0" dy="15.6">• __u8 cb[48] (Control Block)</tspan></text>
<rect x="60.0" y="275.0" width="1120.0" height="175.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<text x="620.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Неперервний лінійний буфер даних (Allocated Memory Block)</text>
<rect x="90.0" y="330.0" width="160.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="170.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Запас нагорі (Headroom)</text>
<text x="170.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">skb_reserve() / skb_push()</text>
<rect x="250.0" y="330.0" width="180.0" height="75.0" rx="6" fill="#fff6e5" stroke="#333333" stroke-width="1.2"/>
<text x="340.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">L2 Ethernet Заголовок</text>
<text x="340.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">14 байтів (MAC Src/Dst, Type)</text>
<rect x="430.0" y="330.0" width="180.0" height="75.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.2"/>
<text x="520.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">L3 IP Заголовок</text>
<text x="520.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">20 байтів (IP Src/Dst, TTL)</text>
<rect x="610.0" y="330.0" width="180.0" height="75.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.2"/>
<text x="700.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">L4 TCP/UDP Заголовок</text>
<text x="700.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">20+ байтів (Ports, Seq, Ack)</text>
<rect x="790.0" y="330.0" width="200.0" height="75.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="890.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Корисні дані (Payload)</text>
<text x="890.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">HTTP, RPC, файл тощо</text>
<rect x="990.0" y="330.0" width="160.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="1070.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Запас унизу (Tailroom)</text>
<text x="1070.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">skb_put() для дозапису</text>
<text x="90.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">▲ head</text>
<text x="250.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">▲ data (поточний шар)</text>
<text x="990.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">▲ tail</text>
<text x="1150.0" y="425.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">▲ end</text>
<rect x="60.0" y="470.0" width="1120.0" height="165.0" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<rect x="80.0" y="490.0" width="520.0" height="125.0" rx="6" fill="#eaf6ef" stroke="#27ae60" stroke-width="1.2"/><text x="340.0" y="525.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="340.0" dy="0.0">Механізм «Зняття заголовків» (skb_pull):</tspan><tspan x="340.0" dy="15.6">• L2 обробка: data вказує на початок Ethernet-кадру</tspan><tspan x="340.0" dy="15.6">• Зняття L2: skb_pull(skb, 14) -&gt; покажчик data зсувається вперед на 14 B</tspan><tspan x="340.0" dy="15.6">• L3 обробка: data вказує на початок IP-пакета (без копіювання пам'яті!)</tspan><tspan x="340.0" dy="15.6">• Зняття L3: skb_pull(skb, iph_len) -&gt; data вказує на TCP-заголовок</tspan></text>
<rect x="640.0" y="490.0" width="520.0" height="125.0" rx="6" fill="#eaf0fd" stroke="#333333" stroke-width="1.2"/><text x="900.0" y="525.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="900.0" dy="0.0">Нелінійні фрагменти сторінок (skb_shared_info):</tspan><tspan x="900.0" dy="15.6">• Розміщується в кінці виділеного блоку за покажчиком end</tspan><tspan x="900.0" dy="15.6">• skb_shinfo(skb)-&gt;nr_frags (кількість сторінок skb_frag_t)</tspan><tspan x="900.0" dy="15.6">• Дозволяє приймати Jumbo-кадри та TCP Superpackets (GRO/GSO)</tspan><tspan x="900.0" dy="15.6">• Нульове копіювання при передачі великих файлів (Zero-Copy Sendfile)</tspan></text>
</svg>