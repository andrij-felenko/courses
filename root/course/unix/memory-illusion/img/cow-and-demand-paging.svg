<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння Demand Paging та Copy-on-Write</text>
<text x="520.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два механізми лінивої пам'яті: Demand Paging та Copy-on-Write</text>
<rect x="35.0" y="60.0" width="470.0" height="470.0" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.4"/>
<rect x="50.0" y="72.0" width="440.0" height="36.0" rx="4" fill="#eff6ff" stroke="#333333" stroke-width="1.5"/><text x="270.0" y="94.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">1. Видача за вимогою (Demand Paging)</tspan></text>
<rect x="60.0" y="120.0" width="420.0" height="60.0" rx="4" fill="#f8f9fa" stroke="#cbd5e1" stroke-width="1.5"/><text x="270.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Крок 1: mmap() або malloc()</tspan><tspan x="270.0" dy="15.6">Ядро створює VMA (обіцянку на 1 ГіБ).</tspan><tspan x="270.0" dy="15.6">Фізичних кадрів виділено: 0 байтів!</tspan></text>
<line x1="270.0" y1="180.0" x2="270.0" y2="205.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="60.0" y="205.0" width="420.0" height="65.0" rx="4" fill="#fef9e7" stroke="#fcd34d" stroke-width="1.5"/><text x="270.0" y="226.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Крок 2: Перший запис: ptr[0] = 10</tspan><tspan x="270.0" dy="15.6">MMU бачить порожній PTE (P = 0) → #PF.</tspan><tspan x="270.0" dy="15.6">Ядро бачить законний анонімний VMA.</tspan></text>
<line x1="270.0" y1="270.0" x2="270.0" y2="295.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="60.0" y="295.0" width="420.0" height="75.0" rx="4" fill="#eafaf0" stroke="#86efac" stroke-width="1.5"/><text x="270.0" y="321.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Крок 3: Ядро бере 1 вільний кадр (4 КіБ),</tspan><tspan x="270.0" dy="15.6">занулює його (zero-fill), записує PFN у PTE,</tspan><tspan x="270.0" dy="15.6">ставить біти Present=1, Writable=1.</tspan></text>
<line x1="270.0" y1="370.0" x2="270.0" y2="395.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="60.0" y="395.0" width="420.0" height="110.0" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="270.0" y="430.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Результат:</tspan><tspan x="270.0" dy="15.6">• Резидентна пам'ять (RSS) зросла рівно на 4 КіБ.</tspan><tspan x="270.0" dy="15.6">• Решта 1048572 КіБ лишаються порожніми обіцянками.</tspan><tspan x="270.0" dy="15.6">• Час реакції ядра: ~1–2 мікросекунди (Minor Fault).</tspan></text>
<rect x="535.0" y="60.0" width="470.0" height="470.0" rx="8" fill="#ffffff" stroke="#059669" stroke-width="1.4"/>
<rect x="550.0" y="72.0" width="440.0" height="36.0" rx="4" fill="#ecfdf5" stroke="#333333" stroke-width="1.5"/><text x="770.0" y="94.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#065f46" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">2. Копіювання при записі (Copy-on-Write)</tspan></text>
<rect x="560.0" y="120.0" width="420.0" height="60.0" rx="4" fill="#f8f9fa" stroke="#cbd5e1" stroke-width="1.5"/><text x="770.0" y="138.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Крок 1: fork() народжує процес-дитину</tspan><tspan x="770.0" dy="15.6">Таблиці сторінок продубльовано,</tspan><tspan x="770.0" dy="15.6">усі PTE батька й дитини помічено як Read-Only (W = 0).</tspan></text>
<line x1="770.0" y1="180.0" x2="770.0" y2="205.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="560.0" y="205.0" width="420.0" height="65.0" rx="4" fill="#fef9e7" stroke="#fcd34d" stroke-width="1.5"/><text x="770.0" y="226.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Крок 2: Батько пише: data[42] = 99</tspan><tspan x="770.0" dy="15.6">MMU ловить порушення захисту (W = 0) → #PF.</tspan><tspan x="770.0" dy="15.6">Ядро бачить: VMA дозволяє запис (COW-пастка).</tspan></text>
<line x1="770.0" y1="270.0" x2="770.0" y2="295.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="560.0" y="295.0" width="420.0" height="75.0" rx="4" fill="#eafaf0" stroke="#86efac" stroke-width="1.5"/><text x="770.0" y="322.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Крок 3: do_wp_page():</tspan><tspan x="770.0" dy="14.3">• Якщо власників &gt; 1 → виділити новий кадр і скопіювати 4 КіБ</tspan><tspan x="770.0" dy="14.3">• Якщо власник 1 → повернути W=1 без копіювання!</tspan></text>
<line x1="770.0" y1="370.0" x2="770.0" y2="395.0" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="560.0" y="395.0" width="420.0" height="110.0" rx="4" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="770.0" y="434.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Результат:</tspan><tspan x="770.0" dy="13.0">• Батько й дитина мають роздільні дані без клонування гігабайтів.</tspan><tspan x="770.0" dy="13.0">• Якщо дитина одразу робить execve(), копіювання = 0 байтів.</tspan><tspan x="770.0" dy="13.0">• Збій є малим (minflt), без походу на диск.</tspan></text>
</svg>