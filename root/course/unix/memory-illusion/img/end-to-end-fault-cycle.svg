<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1090 850" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1090" height="850" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Повний шлях однієї інструкції крізь MMU, сторінковий збій і ядро</text>
<text x="540.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="20" fill="#1a1a1a" text-anchor="middle" font-weight="700">Повний шлях однієї інструкції: від CPU до пам'яті через збій</text>
<rect x="30.0" y="60.0" width="490.0" height="750.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<rect x="45.0" y="72.0" width="460.0" height="36.0" rx="4" fill="#e2e8f0" stroke="#333333" stroke-width="1.5"/><text x="275.0" y="94.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1e293b" text-anchor="middle" font-weight="700"><tspan x="275.0" dy="0.0">Апаратний рівень (CPU / MMU / TLB) — наносекунди</tspan></text>
<rect x="560.0" y="60.0" width="490.0" height="750.0" rx="8" fill="#fefdf8" stroke="#d97706" stroke-width="1.2"/>
<rect x="575.0" y="72.0" width="460.0" height="36.0" rx="4" fill="#fef3c7" stroke="#333333" stroke-width="1.5"/><text x="805.0" y="94.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#92400e" text-anchor="middle" font-weight="700"><tspan x="805.0" dy="0.0">Простір ядра (Обробник #PF) — мікросекунди / мілісекунди</tspan></text>
<rect x="60.0" y="125.0" width="430.0" height="48.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="275.0" y="145.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="275.0" dy="0.0">1. Інструкція звертається за адресою:</tspan><tspan x="275.0" dy="16.9">mov [0x7f9a1000], 0x42</tspan></text>
<line x1="275.0" y1="173.0" x2="275.0" y2="200.0" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="200.0" width="430.0" height="52.0" rx="6" fill="#f2f6fd" stroke="#93c5fd" stroke-width="1.5"/><text x="275.0" y="222.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle"><tspan x="275.0" dy="0.0">2. Пошук у кеші трансляцій (TLB):</tspan><tspan x="275.0" dy="16.9">чи є готова пара VA → PA?</tspan></text>
<line x1="100.0" y1="252.0" x2="100.0" y2="715.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="108.0" y="480.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="start" font-weight="700">TLB Hit (99%+ випадків)
Миттєвий доступ до DRAM</text>
<line x1="340.0" y1="252.0" x2="340.0" y2="290.0" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="348.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="start">TLB Miss</text>
<rect x="180.0" y="290.0" width="310.0" height="58.0" rx="6" fill="#f2f6fd" stroke="#93c5fd" stroke-width="1.5"/><text x="335.0" y="315.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="335.0" dy="0.0">3. MMU Page Table Walker:</tspan><tspan x="335.0" dy="15.6">обхід CR3 → PGD → P4D → PUD → PMD → PTE</tspan></text>
<line x1="335.0" y1="348.0" x2="335.0" y2="385.0" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="180.0" y="385.0" width="310.0" height="56.0" rx="6" fill="#fdeeec" stroke="#fca5a5" stroke-width="1.5"/><text x="335.0" y="409.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="335.0" dy="0.0">4. Перевірка бітів PTE:</tspan><tspan x="335.0" dy="15.6">P = 0 (відсутня) або W = 0 (заборона)</tspan></text>
<line x1="490.0" y1="413.0" x2="590.0" y2="413.0" stroke="#dc2626" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="540.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">Виняток #PF
(Вектор 14)</text>
<rect x="590.0" y="130.0" width="430.0" height="56.0" rx="6" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/><text x="805.0" y="154.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="805.0" dy="0.0">5. Регістри винятку в ядрі:</tspan><tspan x="805.0" dy="15.6">CR2 = 0x7f9a1000 (адреса збою), error_code</tspan></text>
<line x1="805.0" y1="186.0" x2="805.0" y2="215.0" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="590.0" y="215.0" width="430.0" height="54.0" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/><text x="805.0" y="238.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">6. Пошук VMA (mm_struct):</tspan><tspan x="805.0" dy="15.6">чи законна ця адреса і тип доступу?</tspan></text>
<line x1="805.0" y1="269.0" x2="805.0" y2="305.0" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="590.0" y="305.0" width="430.0" height="72.0" rx="6" fill="#fef9e7" stroke="#f59e0b" stroke-width="1.5"/><text x="805.0" y="321.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">7. Тип збою й виділення пам'яті:</tspan><tspan x="805.0" dy="15.6">• Demand zero: виділити чистий 4 КіБ кадр</tspan><tspan x="805.0" dy="15.6">• COW: продублювати кадр / зробити приватним</tspan><tspan x="805.0" dy="15.6">• Major: черга вводу-виводу (диск / swap)</tspan></text>
<line x1="805.0" y1="377.0" x2="805.0" y2="415.0" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="590.0" y="415.0" width="430.0" height="60.0" rx="6" fill="#eafaf0" stroke="#86efac" stroke-width="1.5"/><text x="805.0" y="441.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">8. Оновлення запису таблиці сторінок:</tspan><tspan x="805.0" dy="15.6">PTE = [Фізичний PFN | Present=1 | Writable=1]</tspan></text>
<line x1="805.0" y1="475.0" x2="805.0" y2="515.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="590.0" y="515.0" width="430.0" height="56.0" rx="6" fill="#eafaf0" stroke="#86efac" stroke-width="1.5"/><text x="805.0" y="539.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="805.0" dy="0.0">9. Інвалідація старого кешу (invlpg) та</tspan><tspan x="805.0" dy="15.6">повернення з переривання інструкцією iret</tspan></text>
<line x1="590.0" y1="543.0" x2="390.0" y2="600.0" stroke="#16a34a" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="495.0" y="553.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">Повтор інструкції
(Instruction Retry)</text>
<rect x="60.0" y="600.0" width="330.0" height="65.0" rx="6" fill="#eafaf0" stroke="#86efac" stroke-width="1.5"/><text x="225.0" y="621.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">10. Процесор знову виконує:</tspan><tspan x="225.0" dy="15.6">mov [0x7f9a1000], 0x42</tspan><tspan x="225.0" dy="15.6">Тепер PTE є чинним!</tspan></text>
<line x1="225.0" y1="665.0" x2="225.0" y2="715.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="60.0" y="715.0" width="430.0" height="56.0" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/><text x="275.0" y="739.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="275.0" dy="0.0">11. Запис значення 0x42 у фізичний кад DRAM.</tspan><tspan x="275.0" dy="16.9">Програма не помітила паузи в ядрі.</tspan></text>
</svg>