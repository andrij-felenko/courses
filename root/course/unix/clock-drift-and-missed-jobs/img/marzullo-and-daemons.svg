<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">Демони синхронізації: простота SNTP проти стійкості алгоритму Марцулло</text>
<rect x="30.0" y="50.0" width="435.0" height="410.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="121.7" y="64.0" width="250.6" height="32.0" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/><text x="247.0" y="84.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="247.0" dy="0.0">systemd-timesyncd (SNTP-клієнт)</tspan></text>
<text x="50.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e293b" text-anchor="start" font-weight="700">Принцип дії: простий SNTP (RFC 4330)</text>
<text x="50.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">• Підключається лише до одного сервера за раз</text>
<text x="50.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">• Не має фільтрації викидів та статистичного аналізу</text>
<text x="50.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">• Зберігає позначку на диск (/var/lib/systemd/timesync/clock)</text>
<text x="50.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e293b" text-anchor="start" font-weight="700">Поведінка під час розбіжності:</text>
<text x="50.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">• При зміщенні &lt; 0.4 с: викликає adjtimex (slew)</text>
<text x="50.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="start">• При зміщенні &gt; 0.4 с: робить різкий STEP (clock_settime)</text>
<text x="50.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#dc2626" text-anchor="start">• Сліпо довіряє єдиному обраному серверу</text>
<text x="50.0" y="299.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e293b" text-anchor="start" font-weight="700">Сфера застосування: десктопи, вбудовані системи</text>
<rect x="495.0" y="50.0" width="435.0" height="410.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="538.3" y="64.0" width="347.4" height="32.0" rx="6" fill="#e6fffa" stroke="#0d9488" stroke-width="1.5"/><text x="712.0" y="84.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="712.0" dy="0.0">chrony / ntpd (Повний NTP + фільтр Марцулло)</tspan></text>
<rect x="515.0" y="105.0" width="395.0" height="115.0" rx="5" fill="#ffffff" stroke="#0d9488" stroke-width="1.0"/>
<text x="712.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0d9488" text-anchor="middle" font-weight="700">Алгоритм перетину інтервалів довіри (Marzullo)</text>
<line x1="535.0" y1="142.0" x2="675.0" y2="142.0" stroke="#2563eb" stroke-width="3.0"/>
<text x="530.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2563eb" text-anchor="end" font-weight="700">A</text>
<line x1="570.0" y1="158.0" x2="710.0" y2="158.0" stroke="#2563eb" stroke-width="3.0"/>
<text x="530.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2563eb" text-anchor="end" font-weight="700">B</text>
<line x1="605.0" y1="174.0" x2="745.0" y2="174.0" stroke="#2563eb" stroke-width="3.0"/>
<text x="530.0" y="177.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2563eb" text-anchor="end" font-weight="700">C</text>
<line x1="785.0" y1="158.0" x2="895.0" y2="158.0" stroke="#dc2626" stroke-width="3.0"/>
<text x="780.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="end" font-weight="700">D (збій)</text>
<rect x="605.0" y="134.0" width="70.0" height="48.0" rx="3" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/>
<text x="640.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="middle" font-weight="700">Перетин більшості (Truechimers)</text>
<text x="515.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e293b" text-anchor="start" font-weight="700">Переваги chrony:</text>
<text x="515.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">• Опитує пул із 3–7 джерел, відсікає фальшиві (falsetickers)</text>
<text x="515.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">• Зберігає коефіцієнт дрейфу в driftfile між перезавантаженнями</text>
<text x="515.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="start">• Компенсує асиметрію мережі та термодрейф процесора</text>
<text x="515.0" y="327.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#16a34a" text-anchor="start">• Може тримати точність у субмілісекундному діапазоні</text>
<text x="515.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e293b" text-anchor="start" font-weight="700">Сфера: сервери баз даних, високонавантажені кластери</text>
</svg>