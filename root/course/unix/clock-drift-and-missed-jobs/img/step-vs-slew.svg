<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">Стрибок часу (Step) проти плавного підстроювання частоти (Slew)</text>
<rect x="30.0" y="50.0" width="435.0" height="400.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="62.3" y="64.2" width="369.4" height="31.5" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="247.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="247.0" dy="0.0">Стрибок часу (Step: clock_settime / settimeofday)</tspan></text>
<line x1="70.0" y1="220.0" x2="420.0" y2="220.0" stroke="#94a3b8" stroke-width="1.2"/>
<line x1="70.0" y1="220.0" x2="70.0" y2="110.0" stroke="#94a3b8" stroke-width="1.2"/>
<text x="420.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="end">Реальний час t</text>
<text x="65.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="end">Системний час</text>
<line x1="70.0" y1="200.0" x2="220.0" y2="140.0" stroke="#dc2626" stroke-width="2.5"/>
<line x1="220.0" y1="140.0" x2="220.0" y2="180.0" stroke="#dc2626" stroke-width="2.0" stroke-dasharray="4,3"/>
<line x1="220.0" y1="180.0" x2="390.0" y2="120.0" stroke="#dc2626" stroke-width="2.5"/>
<circle cx="220.0" cy="140.0" r="4.0" fill="#dc2626" stroke="#333333" stroke-width="1.5"/>
<circle cx="220.0" cy="180.0" r="4.0" fill="#ffffff" stroke="#dc2626" stroke-width="2.0"/>
<text x="230.0" y="174.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="start" font-weight="700">Стрибок назад (Δt &lt; 0)</text>
<text x="50.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="start" font-weight="700">Наслідки різкого стрибка:</text>
<text x="50.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">• Порушення монотонності: t₂ &lt; t₁ у логах</text>
<text x="50.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">• cron: пропускає хвилини (якщо вперед) або запускає двічі (якщо назад)</text>
<text x="50.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">• Безпека: падіння сесій TLS, інвалідація JWT/Kerberos</text>
<text x="50.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">• Бази даних: колізії версій LWW (Cassandra), порушення лідерства Raft</text>
<rect x="495.0" y="50.0" width="435.0" height="400.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="548.7" y="64.2" width="326.6" height="31.5" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="712.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="712.0" dy="0.0">Плавний зсув (Slew: adjtimex / ntp_adjtime)</tspan></text>
<line x1="535.0" y1="220.0" x2="885.0" y2="220.0" stroke="#94a3b8" stroke-width="1.2"/>
<line x1="535.0" y1="220.0" x2="535.0" y2="110.0" stroke="#94a3b8" stroke-width="1.2"/>
<text x="885.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="end">Реальний час t</text>
<text x="530.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="end">Системний час</text>
<line x1="535.0" y1="190.0" x2="645.0" y2="150.0" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
<line x1="535.0" y1="190.0" x2="650.0" y2="155.0" stroke="#16a34a" stroke-width="2.5"/>
<line x1="650.0" y1="155.0" x2="780.0" y2="130.0" stroke="#16a34a" stroke-width="2.5"/>
<line x1="780.0" y1="130.0" x2="865.0" y2="115.0" stroke="#16a34a" stroke-width="2.5"/>
<text x="690.0" y="131.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="start" font-weight="700">Плавне гальмування/прискорення (±500 ppm)</text>
<text x="515.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#16a34a" text-anchor="start" font-weight="700">Переваги плавного регулювання:</text>
<text x="515.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="start">• Сувора монотонність: d(час)/dt &gt; 0 завжди</text>
<text x="515.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="start">• cron: жодна хвилина не втрачається й не дублюється</text>
<text x="515.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="start">• Таймери: epoll, timerfd, nanosleep не зависають і не спрацьовують раніше</text>
<text x="515.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="start">• Обмеження ядра: макс. зсув 0.5 мс/с (1 с різниці компенсується 2000 с)</text>
</svg>