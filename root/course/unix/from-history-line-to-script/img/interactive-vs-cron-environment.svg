<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Анатомія середовища: інтерактивна сесія користувача проти cron / демона</text>
<rect x="40.0" y="65.0" width="435.0" height="425.0" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="1.5"/>
<rect x="97.9" y="78.5" width="318.2" height="33.0" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="257.0" y="99.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="257.0" dy="0.0">Інтерактивна сесія (Користувач у TTY)</tspan></text>
<text x="60.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="start" font-weight="700">1. Керівний термінал (TTY):</text>
<text x="60.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="start">stdin, stdout, stderr підключені до /dev/pts/X; доступне ручне введення.</text>
<text x="60.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="start" font-weight="700">2. Змінні середовища сеансу:</text>
<text x="60.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="start">Зчитано ~/.bashrc, ~/.profile; PATH містить /usr/local/bin, ~/bin.</text>
<text x="60.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="start" font-weight="700">3. Інтерактивні аліаси й функції:</text>
<text x="60.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="start">Активні безпечні аліаси: alias cp='cp -i', alias rm='rm -i'.</text>
<text x="60.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="start" font-weight="700">4. Робочий каталог ($PWD):</text>
<text x="60.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="start">Поточна тека проєкту або репозиторію; відносні шляхи валідні.</text>
<text x="60.0" y="359.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="start" font-weight="700">5. Реакція на збої та запити:</text>
<text x="60.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="start">Людина бачить помилку в реальному часі й може підтвердити дію.</text>
<text x="60.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="start" font-weight="700">6. Буферизація виводу:</text>
<text x="60.0" y="433.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#475569" text-anchor="start">Порядкова буферизація (Line buffering) — повідомлення видно негайно.</text>
<rect x="525.0" y="65.0" width="435.0" height="425.0" rx="8" fill="#fdfbf7" stroke="#dc2626" stroke-width="1.5"/>
<rect x="574.8" y="78.5" width="334.3" height="33.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="742.0" y="99.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="742.0" dy="0.0">Автоматизований запуск (cron / systemd)</tspan></text>
<text x="545.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="start" font-weight="700">1. Відсутність TTY (No controlling terminal):</text>
<text x="545.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#78350f" text-anchor="start">stdin закритий або з /dev/null; інтерактивний запит зависає або падає.</text>
<text x="545.0" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="start" font-weight="700">2. Мінімальний системний PATH:</text>
<text x="545.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#78350f" text-anchor="start">Лише /usr/bin:/bin; сторонні бінарники (aws, docker) не знайдено.</text>
<text x="545.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="start" font-weight="700">3. Неінтерактивна оболонка:</text>
<text x="545.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#78350f" text-anchor="start">~/.bashrc НЕ завантажується; аліаси та кастомні функції відсутні.</text>
<text x="545.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="start" font-weight="700">4. Непередбачуваний $PWD:</text>
<text x="545.0" y="321.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#78350f" text-anchor="start">За замовчуванням $HOME або /; відносні шляхи вказують у нікуди.</text>
<text x="545.0" y="359.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="start" font-weight="700">5. Мовчазне виконання збоїв:</text>
<text x="545.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#78350f" text-anchor="start">Ніхто не читає stdout; помилка посеред ланцюжка ігнорується.</text>
<text x="545.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#78350f" text-anchor="start" font-weight="700">6. Повна буферизація блоками:</text>
<text x="545.0" y="433.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#78350f" text-anchor="start">Буферизація по 4 КіБ — логи не з'являються у файлі до змиву.</text>
<line x1="478.0" y1="275.0" x2="520.0" y2="275.0" stroke="#e08a1e" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="498.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b45309" text-anchor="middle" font-weight="700">Прірва</text>
</svg>