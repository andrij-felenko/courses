<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Керування тимчасовими ресурсами: mktemp, пастка trap та атомарна заміна</text>
<rect x="30.0" y="65.0" width="215.0" height="360.0" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="1.3"/>
<rect x="52.1" y="76.2" width="169.7" height="31.5" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="137.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="137.0" dy="0.0">1. Створення каталогу</tspan></text>
<text x="45.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2563eb" text-anchor="start" font-weight="700">mktemp -d</text>
<text x="45.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">• Генерує унікальне ім'я</text>
<text x="45.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#64748b" text-anchor="start">  /tmp/job.XXXXXX</text>
<text x="45.0" y="195.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="start" font-weight="700">• Маска прав 0700</text>
<text x="45.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="start">  (лише для власника)</text>
<text x="45.0" y="245.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start" font-weight="700">• Захист від Symlink Race</text>
<text x="45.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#64748b" text-anchor="start">  і підміни TOCTOU.</text>
<rect x="275.0" y="65.0" width="215.0" height="360.0" rx="8" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.3"/>
<rect x="315.0" y="76.2" width="134.1" height="31.5" rx="6" fill="#ede9fe" stroke="#7e22ce" stroke-width="1.5"/><text x="382.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="382.0" dy="0.0">2. Пастка (trap)</tspan></text>
<text x="290.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7e22ce" text-anchor="start" font-weight="700">trap cleanup EXIT INT TERM</text>
<text x="290.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#581c87" text-anchor="start" font-weight="700">cleanup() {</text>
<text x="305.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#581c87" text-anchor="start">rm -rf &quot;$tmp_dir&quot;</text>
<text x="290.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#581c87" text-anchor="start" font-weight="700">}</text>
<text x="290.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#3b0764" text-anchor="start">• EXIT: будь-який вихід</text>
<text x="290.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#3b0764" text-anchor="start">• INT: переривання Ctrl+C</text>
<text x="290.0" y="271.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#3b0764" text-anchor="start">• TERM: сигнал kill/systemd</text>
<text x="290.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#16a34a" text-anchor="start" font-weight="700">Гарантія: немає сміття!</text>
<rect x="520.0" y="65.0" width="215.0" height="360.0" rx="8" fill="#fdfbf7" stroke="#e08a1e" stroke-width="1.3"/>
<rect x="545.7" y="76.2" width="162.6" height="31.5" rx="6" fill="#fff6e5" stroke="#e08a1e" stroke-width="1.5"/><text x="627.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="627.0" dy="0.0">3. Ізольована робота</tspan></text>
<text x="535.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#92400e" text-anchor="start" font-weight="700">Робота всередині $tmp_dir</text>
<text x="535.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#78350f" text-anchor="start">• Генерація чернеток</text>
<text x="535.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#78350f" text-anchor="start">• Стиснення архіву</text>
<text x="535.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#78350f" text-anchor="start">• Обчислення sha256sum</text>
<text x="535.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="start" font-weight="700">Якщо стається збій:</text>
<text x="535.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#78350f" text-anchor="start">Цільовий файл не чіпали.</text>
<text x="535.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#78350f" text-anchor="start">Чернетку видалить trap.</text>
<rect x="765.0" y="65.0" width="205.0" height="360.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.3"/>
<rect x="792.8" y="76.2" width="148.3" height="31.5" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="867.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="867.0" dy="0.0">4. Атомарний коміт</tspan></text>
<text x="780.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="start" font-weight="700">mv target.tmp target</text>
<text x="780.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="start">• Системний виклик</text>
<text x="795.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="start" font-weight="700">rename() у VFS ядра</text>
<text x="780.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="start">• Підміна вказівника іноди</text>
<text x="780.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="start">• Немає напівзаписаного</text>
<text x="795.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="start" font-weight="700">пошкодженого стану!</text>
<text x="780.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="start">Паралельні процеси</text>
<text x="780.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="start">бачать лише 100% файл.</text>
<line x1="245.0" y1="230.0" x2="275.0" y2="230.0" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="490.0" y1="230.0" x2="520.0" y2="230.0" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="735.0" y1="230.0" x2="765.0" y2="230.0" stroke="#94a3b8" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="219.1" y="434.2" width="561.9" height="31.5" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="500.0" y="454.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Повний життєвий цикл: жодних витоків файлових дескрипторів і сміття на диску</tspan></text>
</svg>