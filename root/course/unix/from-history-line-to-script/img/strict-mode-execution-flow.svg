<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Поведінка сценарію при збоях: звичайний режим проти set -euo pipefail</text>
<rect x="40.0" y="65.0" width="435.0" height="405.0" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
<rect x="130.8" y="78.8" width="252.5" height="32.5" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="257.0" y="99.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="257.0" dy="0.0">Звичайний режим (Замовчування)</tspan></text>
<rect x="60.0" y="130.0" width="395.0" height="45.0" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.0"/>
<text x="75.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="start" font-weight="700">1. cd /var/backups/db (помилка: каталогу немає)</text>
<text x="75.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7f1d1d" text-anchor="start">Код виходу 1. Оболонка ігнорує збій і йде далі!</text>
<rect x="60.0" y="190.0" width="395.0" height="45.0" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.0"/>
<text x="75.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="start" font-weight="700">2. rm -rf &quot;$TARGET_DIR/*&quot; (змінна не оголошена)</text>
<text x="75.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7f1d1d" text-anchor="start">Розкривається в 'rm -rf /*'! Спроба очистити корінь ОС.</text>
<rect x="60.0" y="250.0" width="395.0" height="45.0" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.0"/>
<text x="75.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="start" font-weight="700">3. mysqldump db | gzip &gt; backup.sql.gz</text>
<text x="75.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7f1d1d" text-anchor="start">mysqldump впав з помилкою, але gzip повернув 0. $? = 0!</text>
<rect x="60.0" y="310.0" width="395.0" height="45.0" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.0"/>
<text x="75.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#dc2626" text-anchor="start" font-weight="700">4. echo &quot;Резервна копія успішна!&quot;</text>
<text x="75.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7f1d1d" text-anchor="start">Скрипт звітує про успіх, зберігши порожній стиснений файл.</text>
<rect x="93.6" y="399.5" width="326.9" height="31.0" rx="6" fill="#fecaca" stroke="#dc2626" stroke-width="1.5"/><text x="257.0" y="418.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700"><tspan x="257.0" dy="0.0">Результат: Знищення даних або фальшивий успіх</tspan></text>
<rect x="525.0" y="65.0" width="435.0" height="405.0" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
<rect x="604.1" y="78.8" width="275.8" height="32.5" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="742.0" y="99.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="742.0" dy="0.0">Суворий режим (set -euo pipefail)</tspan></text>
<rect x="545.0" y="130.0" width="395.0" height="45.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.0"/>
<text x="560.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="start" font-weight="700">1. cd /var/backups/db (помилка: каталогу немає)</text>
<text x="560.0" y="166.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#14532d" text-anchor="start" font-weight="700">set -e (errexit): миттєва зупинка сценарію. Код 1.</text>
<rect x="545.0" y="190.0" width="395.0" height="45.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.0"/>
<text x="560.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="start" font-weight="700">2. rm -rf &quot;$TARGET_DIR/*&quot; (змінна не оголошена)</text>
<text x="560.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#14532d" text-anchor="start" font-weight="700">set -u (nounset): аварійне завершення: 'unbound variable'.</text>
<rect x="545.0" y="250.0" width="395.0" height="45.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.0"/>
<text x="560.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="start" font-weight="700">3. mysqldump db | gzip &gt; backup.sql.gz</text>
<text x="560.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#14532d" text-anchor="start" font-weight="700">pipefail: конвеєр повертає код виходу mysqldump (!= 0).</text>
<rect x="545.0" y="310.0" width="395.0" height="45.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.0"/>
<text x="560.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="start" font-weight="700">4. IFS=$'\n\t' — безпечне розбиття слів</text>
<text x="560.0" y="346.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#14532d" text-anchor="start">Шляхи з пробілами не розпадаються на окремі аргументи.</text>
<rect x="558.1" y="399.5" width="367.8" height="31.0" rx="6" fill="#bbf7d0" stroke="#16a34a" stroke-width="1.5"/><text x="742.0" y="418.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#14532d" text-anchor="middle" font-weight="700"><tspan x="742.0" dy="0.0">Результат: Детермінована зупинка та безпека системи</tspan></text>
</svg>