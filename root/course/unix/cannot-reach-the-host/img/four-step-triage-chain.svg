<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="200.0" y="14.0" width="600.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/><text x="500.0" y="36.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Чотириланковий ланцюг мережевої діагностики (4-Step Triage Chain)</tspan></text>
<text x="500.0" y="66.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Послідовне звуження простору відмови: від доменного імені до криптографічного ключа</text>
<rect x="35.0" y="90.0" width="215.0" height="40.0" rx="6" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/><text x="142.5" y="114.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="142.5" dy="0.0">Крок 1</tspan></text>
<rect x="35.0" y="134.0" width="215.0" height="336.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="142.5" y="264.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="142.5" dy="0.0">1. Ім'я (Name Resolution)</tspan><tspan x="142.5" dy="11.7"></tspan><tspan x="142.5" dy="11.7">Розпізнавання імені в IP:</tspan><tspan x="142.5" dy="11.7">• /etc/nsswitch.conf, /etc/hosts</tspan><tspan x="142.5" dy="11.7">• systemd-resolved (127.0.0.53)</tspan><tspan x="142.5" dy="11.7">• getent ahosts, resolvectl, dig</tspan><tspan x="142.5" dy="11.7"></tspan><tspan x="142.5" dy="11.7">Типові збої: NXDOMAIN, SERVFAIL, DNS таймаут</tspan></text>
<line x1="254.0" y1="280.0" x2="271.0" y2="280.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="275.0" y="90.0" width="215.0" height="40.0" rx="6" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/><text x="382.5" y="114.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="382.5" dy="0.0">Крок 2</tspan></text>
<rect x="275.0" y="134.0" width="215.0" height="336.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="382.5" y="264.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="382.5" dy="0.0">2. Маршрут (Kernel Route &amp; L2)</tspan><tspan x="382.5" dy="11.7"></tspan><tspan x="382.5" dy="11.7">Шлях у ядрі та сусіди:</tspan><tspan x="382.5" dy="11.7">• FIB таблиця: ip route get &lt;IP&gt;</tspan><tspan x="382.5" dy="11.7">• Default gateway &amp; metrics</tspan><tspan x="382.5" dy="11.7">• ARP/NDP стан: ip neigh (REACHABLE/FAILED)</tspan><tspan x="382.5" dy="11.7"></tspan><tspan x="382.5" dy="11.7">Типові збої: Network unreachable, No route to host</tspan></text>
<line x1="494.0" y1="280.0" x2="511.0" y2="280.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="515.0" y="90.0" width="215.0" height="40.0" rx="6" fill="#d4ac0d" stroke="#d4ac0d" stroke-width="1.5"/><text x="622.5" y="114.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="622.5" dy="0.0">Крок 3</tspan></text>
<rect x="515.0" y="134.0" width="215.0" height="336.0" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.5"/><text x="622.5" y="264.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="622.5" dy="0.0">3. Порт (L4 Transport &amp; Firewall)</tspan><tspan x="622.5" dy="11.7"></tspan><tspan x="622.5" dy="11.7">Транспортна зв'язність TCP:</tspan><tspan x="622.5" dy="11.7">• Тристороннє рукостискання SYN/ACK</tspan><tspan x="622.5" dy="11.7">• Стан сокетів на сервері: ss -tlpn</tspan><tspan x="622.5" dy="11.7">• Зондування: nc -zv, curl telnet://</tspan><tspan x="622.5" dy="11.7"></tspan><tspan x="622.5" dy="11.7">Типові збої: Connection refused (RST) / timed out (DROP)</tspan></text>
<line x1="734.0" y1="280.0" x2="751.0" y2="280.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="755.0" y="90.0" width="215.0" height="40.0" rx="6" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/><text x="862.5" y="114.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700"><tspan x="862.5" dy="0.0">Крок 4</tspan></text>
<rect x="755.0" y="134.0" width="215.0" height="336.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="862.5" y="264.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="862.5" dy="0.0">4. Ключ (SSH Auth &amp; Protocol)</tspan><tspan x="862.5" dy="11.7"></tspan><tspan x="862.5" dy="11.7">Прикладна автентифікація:</tspan><tspan x="862.5" dy="11.7">• Трасування клієнта: ssh -vvv</tspan><tspan x="862.5" dy="11.7">• Права: ~/.ssh (0700), authorized_keys (0600)</tspan><tspan x="862.5" dy="11.7">• Конфлікт known_hosts, перебір MaxAuthTries</tspan><tspan x="862.5" dy="11.7"></tspan><tspan x="862.5" dy="11.7">Типові збої: Host key mismatch, Permission denied</tspan></text>
</svg>