<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 690" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="690" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="960.0" height="660.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="490.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">КАРТА СТАДІЙ ЗАВАНТАЖЕННЯ LINUX ТА ХАРАКТЕРНІ ТОЧКИ ВІДМОВ</text>
<rect x="25.0" y="55.0" width="930.0" height="125.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="490.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-weight="700">1. АПАРАТНА ПРОШИВКА ТА ІНІЦІАЛІЗАЦІЯ (UEFI / NVRAM)</text>
<rect x="40.0" y="86.0" width="280.0" height="82.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="180.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Апаратний POST -&gt; Зчитування NVRAM</tspan><tspan x="180.0" dy="13.0">Вибір завантажувального запису BootXXXX</tspan><tspan x="180.0" dy="13.0">Монтування ESP (FAT32) -&gt; запуск grubx64.efi</tspan><tspan x="180.0" dy="13.0">Перевірка Secure Boot підписів shim</tspan></text>
<rect x="340.0" y="86.0" width="280.0" height="82.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="480.0" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Нормальний стан:</tspan><tspan x="480.0" dy="13.0">Завантажувач Grub успішно</tspan><tspan x="480.0" dy="13.0">знаходить свій розділ /boot</tspan><tspan x="480.0" dy="13.0">та зчитує grub.cfg</tspan></text>
<rect x="640.0" y="86.0" width="295.0" height="82.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="787.5" y="111.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="700"><tspan x="787.5" dy="0.0">ТОЧКА ВІДМОВИ: Застрягання в grub rescue&gt;</tspan><tspan x="787.5" dy="13.0">Симптом: error: no such partition / unknown fs</tspan><tspan x="787.5" dy="13.0">Причина: Зміщення номерів розділів GPT,</tspan><tspan x="787.5" dy="13.0">втрата UUID /boot або пошкодження ESP</tspan></text>
<line x1="490.0" y1="180.0" x2="490.0" y2="205.0" stroke="#0284c7" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="25.0" y="205.0" width="930.0" height="125.0" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="490.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">2. ЗАВАНТАЖУВАЧ GRUB: ЗАВАНТАЖЕННЯ ЯДРА ТА INITRAMFS</text>
<rect x="40.0" y="236.0" width="280.0" height="82.0" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="180.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Зчитування ядра vmlinuz у пам'ять</tspan><tspan x="180.0" dy="13.0">Зчитування образу initramfs / initrd.img</tspan><tspan x="180.0" dy="13.0">Формування рядка kernel cmdline:</tspan><tspan x="180.0" dy="13.0">(root=UUID=... ro quiet splash mitigations=...)</tspan></text>
<rect x="340.0" y="236.0" width="280.0" height="82.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="480.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Нормальний стан:</tspan><tspan x="480.0" dy="13.0">Передача керування точці входу ядра</tspan><tspan x="480.0" dy="13.0">Розпакування initramfs у ramfs/tmpfs</tspan><tspan x="480.0" dy="13.0">Старт раннього простору /init</tspan></text>
<rect x="640.0" y="236.0" width="295.0" height="82.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="787.5" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="700"><tspan x="787.5" dy="0.0">ТОЧКА ВІДМОВИ: Kernel Panic / Bad Magic</tspan><tspan x="787.5" dy="13.0">Симптом: Kernel panic - not syncing: VFS...</tspan><tspan x="787.5" dy="13.0">Причина: Пошкоджено vmlinuz або initrd,</tspan><tspan x="787.5" dy="13.0">несумісні параметри cmdline</tspan></text>
<line x1="490.0" y1="330.0" x2="490.0" y2="355.0" stroke="#1e40af" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="25.0" y="355.0" width="930.0" height="135.0" rx="8" fill="#fefce8" stroke="#fde047" stroke-width="1.5"/>
<text x="490.0" y="374.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#854d0e" text-anchor="middle" font-weight="700">3. РАННІЙ ПРОСТІР КОРИСТУВАЧА: ДРАЙВЕРИ, LUKS, LVM ТА ПІДКЛЮЧЕННЯ КОРЕНЯ</text>
<rect x="40.0" y="386.0" width="280.0" height="92.0" rx="6" fill="#ffffff" stroke="#eab308" stroke-width="1.5"/><text x="180.0" y="411.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">Завантаження модулів сховища (nvme, ahci)</tspan><tspan x="180.0" dy="11.7">uudevd перелічує диски та формує /dev/disk/by-uuid</tspan><tspan x="180.0" dy="11.7">Розблокування LUKS (cryptsetup) та LVM (vgchange)</tspan><tspan x="180.0" dy="11.7">Монтування справжнього кореня /sysroot</tspan><tspan x="180.0" dy="11.7">Виклик switch_root або pivot_root</tspan></text>
<rect x="340.0" y="386.0" width="280.0" height="92.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="480.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Нормальний стан:</tspan><tspan x="480.0" dy="13.0">Коренева ФС змонтована в /sysroot</tspan><tspan x="480.0" dy="13.0">Керування передається /sbin/init</tspan><tspan x="480.0" dy="13.0">(systemd як PID 1 справжнього кореня)</tspan></text>
<rect x="640.0" y="386.0" width="295.0" height="92.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="787.5" y="409.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="700"><tspan x="787.5" dy="0.0">ТОЧКА ВІДМОВИ: Застрягання в (initramfs) shell</tspan><tspan x="787.5" dy="13.0">Симптом: Gave up waiting for root device</tspan><tspan x="787.5" dy="13.0">Причина: Невідповідність root=UUID=...,</tspan><tspan x="787.5" dy="13.0">відсутній драйвер дискового контролера,</tspan><tspan x="787.5" dy="13.0">не відкрився криптоконтейнер LUKS</tspan></text>
<line x1="490.0" y1="490.0" x2="490.0" y2="515.0" stroke="#854d0e" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="25.0" y="515.0" width="930.0" height="135.0" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
<text x="490.0" y="534.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b21a8" text-anchor="middle" font-weight="700">4. СИСТЕМНИЙ МЕНЕДЖЕР SYSTEMD: ТАБЛИЦЯ FSTAB ТА ДЕРЕВО ЮНІТІВ</text>
<rect x="40.0" y="546.0" width="280.0" height="92.0" rx="6" fill="#ffffff" stroke="#a855f7" stroke-width="1.5"/><text x="180.0" y="569.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="180.0" dy="0.0">systemd-fstab-generator генерує *.mount юніти</tspan><tspan x="180.0" dy="13.0">Підключення local-fs.target та sysinit.target</tspan><tspan x="180.0" dy="13.0">Запуск системних служб basic.target</tspan><tspan x="180.0" dy="13.0">Досягнення цільового стану default.target</tspan><tspan x="180.0" dy="13.0">(multi-user.target або graphical.target)</tspan></text>
<rect x="340.0" y="546.0" width="280.0" height="92.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="480.0" y="576.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">Нормальний стан:</tspan><tspan x="480.0" dy="13.0">Усі юніти та розділи змонтовані</tspan><tspan x="480.0" dy="13.0">Служби запущені без критичних помилок</tspan><tspan x="480.0" dy="13.0">Запрошення входу login: на TTY</tspan></text>
<rect x="640.0" y="546.0" width="295.0" height="92.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="787.5" y="571.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b91c1c" text-anchor="middle" font-weight="700"><tspan x="787.5" dy="0.0">ТОЧКА ВІДМОВИ: Падіння в emergency.target</tspan><tspan x="787.5" dy="11.7">Симптом: You are in emergency mode. Press Enter...</tspan><tspan x="787.5" dy="11.7">Причина: Помилка монтування запису в /etc/fstab</tspan><tspan x="787.5" dy="11.7">без опції nofail, збій fsck другорядного диска,</tspan><tspan x="787.5" dy="11.7">жорстка циклічна залежність юнітів</tspan></text>
</svg>