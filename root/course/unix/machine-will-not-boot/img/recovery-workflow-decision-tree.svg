<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="960.0" height="620.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="490.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">ДІАГНОСТИЧНИЙ АЛГОРИТМ: ВІД СИМПТОМУ ВІДМОВИ ДО ВІДНОВЛЕННЯ СИСТЕМИ</text>
<rect x="340.0" y="55.0" width="300.0" height="48.0" rx="6" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/><text x="490.0" y="75.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">СИМПТОМ НА СИСТЕМНІЙ КОНСОЛІ:</tspan><tspan x="490.0" dy="14.3">Яка підсистема зупинила завантаження?</tspan></text>
<line x1="400.0" y1="103.0" x2="160.0" y2="140.0" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="490.0" y1="103.0" x2="490.0" y2="140.0" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="580.0" y1="103.0" x2="820.0" y2="140.0" stroke="#475569" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="25.0" y="140.0" width="275.0" height="470.0" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="162.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">КОНСОЛЬ GRUB RESCUE</text>
<rect x="35.0" y="175.0" width="255.0" height="60.0" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="162.5" y="196.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="162.5" dy="0.0">Симптом: grub rescue&gt;</tspan><tspan x="162.5" dy="11.7">Повідомлення: no such device / unknown fs</tspan><tspan x="162.5" dy="11.7">Втрачено зв'язок із каталогом /boot/grub</tspan></text>
<rect x="35.0" y="245.0" width="255.0" height="100.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="162.5" y="268.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="162.5" dy="0.0">Діагностика на місці:</tspan><tspan x="162.5" dy="11.7">ls -&gt; список розділів (hd0,gpt1)...</tspan><tspan x="162.5" dy="11.7">ls (hd0,gpt2)/boot/grub</tspan><tspan x="162.5" dy="11.7">set root=(hd0,gpt2)</tspan><tspan x="162.5" dy="11.7">set prefix=(hd0,gpt2)/boot/grub</tspan><tspan x="162.5" dy="11.7">insmod normal; normal</tspan></text>
<rect x="35.0" y="355.0" width="255.0" height="110.0" rx="6" fill="#fefce8" stroke="#eab308" stroke-width="1.5"/><text x="162.5" y="383.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#854d0e" text-anchor="middle" font-weight="700"><tspan x="162.5" dy="0.0">Капітальний ремонт:</tspan><tspan x="162.5" dy="11.7">1. Завантаження з LiveCD</tspan><tspan x="162.5" dy="11.7">2. Монтування /mnt та /mnt/boot/efi</tspan><tspan x="162.5" dy="11.7">3. rbind псевдо-ФС та вхід у chroot</tspan><tspan x="162.5" dy="11.7">4. grub-install --target=x86_64-efi</tspan><tspan x="162.5" dy="11.7">5. update-grub (grub-mkconfig)</tspan></text>
<rect x="35.0" y="475.0" width="255.0" height="120.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="162.5" y="520.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="162.5" dy="0.0">Фінальний результат:</tspan><tspan x="162.5" dy="11.7">Відновлено bootloader у ESP,</tspan><tspan x="162.5" dy="11.7">оновлено змінні NVRAM efibootmgr,</tspan><tspan x="162.5" dy="11.7">система стартує штатно</tspan></text>
<rect x="345.0" y="140.0" width="290.0" height="470.0" rx="8" fill="#fefce8" stroke="#fde047" stroke-width="1.5"/>
<text x="490.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#854d0e" text-anchor="middle" font-weight="700">АВАРІЙНИЙ SHELL INITRAMFS</text>
<rect x="355.0" y="175.0" width="270.0" height="60.0" rx="6" fill="#ffffff" stroke="#eab308" stroke-width="1.5"/><text x="490.0" y="196.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Симптом: (initramfs) prompt</tspan><tspan x="490.0" dy="11.7">Повідомлення: Gave up waiting for root device</tspan><tspan x="490.0" dy="11.7">Не вдалося змонтувати кореневий розділ</tspan></text>
<rect x="355.0" y="245.0" width="270.0" height="100.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="490.0" y="268.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="490.0" dy="0.0">Діагностика в BusyBox:</tspan><tspan x="490.0" dy="11.7">cat /proc/cmdline -&gt; перевірка root=UUID</tspan><tspan x="490.0" dy="11.7">blkid -&gt; реальні UUID дисків</tspan><tspan x="490.0" dy="11.7">ls /dev/mapper -&gt; стан LUKS / LVM</tspan><tspan x="490.0" dy="11.7">cryptsetup luksOpen ... -&gt; ручний тест</tspan><tspan x="490.0" dy="11.7">exit -&gt; продовження спроби</tspan></text>
<rect x="355.0" y="355.0" width="270.0" height="110.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="490.0" y="383.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e40af" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">Капітальний ремонт у chroot:</tspan><tspan x="490.0" dy="11.7">1. Виправлення UUID у /etc/fstab</tspan><tspan x="490.0" dy="11.7">2. Оновлення /etc/crypttab для LUKS</tspan><tspan x="490.0" dy="11.7">3. dracut -f / update-initramfs -u -k all</tspan><tspan x="490.0" dy="11.7">(включення модулів nvme/dm-crypt)</tspan><tspan x="490.0" dy="11.7">4. Оновлення grub.cfg</tspan></text>
<rect x="355.0" y="475.0" width="270.0" height="120.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="490.0" y="520.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="490.0" dy="0.0">Фінальний результат:</tspan><tspan x="490.0" dy="11.7">Новий initramfs містить потрібні</tspan><tspan x="490.0" dy="11.7">драйвери та конфігурацію, корінь</tspan><tspan x="490.0" dy="11.7">успішно монтується у /sysroot</tspan></text>
<rect x="675.0" y="140.0" width="280.0" height="470.0" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
<text x="815.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b21a8" text-anchor="middle" font-weight="700">EMERGENCY / RESCUE TARGET</text>
<rect x="685.0" y="175.0" width="260.0" height="60.0" rx="6" fill="#ffffff" stroke="#a855f7" stroke-width="1.5"/><text x="815.0" y="196.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">Симптом: Emergency mode консоль</tspan><tspan x="815.0" dy="11.7">Повідомлення: Failed to mount /data...</tspan><tspan x="815.0" dy="11.7">Dependency failed for Local File Systems</tspan></text>
<rect x="685.0" y="245.0" width="260.0" height="100.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/><text x="815.0" y="274.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="815.0" dy="0.0">Діагностика в Emergency Shell:</tspan><tspan x="815.0" dy="11.7">journalctl -xb | grep -i mount</tspan><tspan x="815.0" dy="11.7">systemctl --failed -&gt; збійний юніт</tspan><tspan x="815.0" dy="11.7">cat /etc/fstab -&gt; перевірка записів</tspan><tspan x="815.0" dy="11.7">blkid -&gt; звірка UUID дисків</tspan></text>
<rect x="685.0" y="355.0" width="260.0" height="110.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="815.0" y="383.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e40af" text-anchor="middle" font-weight="700"><tspan x="815.0" dy="0.0">Ремонт на місці (без LiveCD):</tspan><tspan x="815.0" dy="11.7">1. mount -o remount,rw /</tspan><tspan x="815.0" dy="11.7">2. nano /etc/fstab -&gt; додати nofail</tspan><tspan x="815.0" dy="11.7">до необов'язкових дисків або виправити UUID</tspan><tspan x="815.0" dy="11.7">3. systemctl daemon-reload</tspan><tspan x="815.0" dy="11.7">4. systemctl default</tspan></text>
<rect x="685.0" y="475.0" width="260.0" height="120.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="815.0" y="520.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="815.0" dy="0.0">Фінальний результат:</tspan><tspan x="815.0" dy="11.7">systemd успішно підключає</tspan><tspan x="815.0" dy="11.7">local-fs.target та піднімає всі</tspan><tspan x="815.0" dy="11.7">сервіси до default.target</tspan></text>
</svg>