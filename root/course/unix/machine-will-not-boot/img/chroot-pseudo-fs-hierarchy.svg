<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="960.0" height="560.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="490.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">АРХІТЕКТУРА ЗВ'ЯЗУВАННЯ ПСЕВДО-ФС ДЛЯ РЕМОНТНОГО ОТОЧЕННЯ CHROOT</text>
<rect x="30.0" y="60.0" width="425.0" height="485.0" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
<text x="242.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e293b" text-anchor="middle" font-weight="700">СЕРЕДОВИЩЕ НОСІЯ ВІДНОВЛЕННЯ (LIVECD HOST)</text>
<rect x="45.0" y="105.0" width="395.0" height="45.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="242.5" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="242.5" dy="0.0">Ядро Linux хоста (Active Running Kernel)</tspan><tspan x="242.5" dy="13.0">Підтримує таблиці процесів, драйвери пристроїв та IPC</tspan></text>
<rect x="45.0" y="165.0" width="395.0" height="75.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="242.5" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="242.5" dy="0.0">/proc (procfs) — Таблиця процесів ядра, /proc/cmdline,</tspan><tspan x="242.5" dy="13.0">/proc/mounts, /proc/cpuinfo, /proc/meminfo</tspan><tspan x="242.5" dy="13.0">(Потрібно для утиліт пакунків, ps, grub-probe)</tspan></text>
<rect x="45.0" y="255.0" width="395.0" height="75.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="242.5" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="242.5" dy="0.0">/sys (sysfs) — Дерево пристроїв, шини PCI/NVMe,</tspan><tspan x="242.5" dy="13.0">/sys/firmware/efi/efivars (Змінні NVRAM)</tspan><tspan x="242.5" dy="13.0">(Потрібно для grub-install, dracut, udev)</tspan></text>
<rect x="45.0" y="345.0" width="395.0" height="75.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="242.5" y="373.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="242.5" dy="0.0">/dev (devtmpfs) — Спеціальні файли символьних/блокових носіїв:</tspan><tspan x="242.5" dy="13.0">/dev/nvme*, /dev/null, /dev/urandom, /dev/pts/*</tspan><tspan x="242.5" dy="13.0">(Потрібно для доступу до дисків та терміналів)</tspan></text>
<rect x="45.0" y="435.0" width="395.0" height="95.0" rx="6" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/><text x="242.5" y="466.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="242.5" dy="0.0">/run (tmpfs) — Тимчасовий стан підсистем:</tspan><tspan x="242.5" dy="13.0">/run/udev (База пристроїв), /run/cryptsetup,</tspan><tspan x="242.5" dy="13.0">/run/lvm (Блокування томів та сокети)</tspan><tspan x="242.5" dy="13.0">(Потрібно для коректної роботи LVM та cryptsetup)</tspan></text>
<line x1="440.0" y1="202.0" x2="505.0" y2="202.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="440.0" y1="292.0" x2="505.0" y2="292.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="440.0" y1="382.0" x2="505.0" y2="382.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="440.0" y1="482.0" x2="505.0" y2="482.0" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="520.0" y="60.0" width="430.0" height="485.0" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="1.8"/>
<text x="735.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#581c87" text-anchor="middle" font-weight="700">ЗЛАМАНА СИСТЕМА У ТОЧЦІ МОНТУВАННЯ /mnt</text>
<rect x="535.0" y="105.0" width="400.0" height="45.0" rx="6" fill="#ffffff" stroke="#a855f7" stroke-width="1.5"/><text x="735.0" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="735.0" dy="0.0">Кореневий розділ цільової ОС (Змонтовано у /mnt)</tspan><tspan x="735.0" dy="13.0">Містить /mnt/etc, /mnt/usr, /mnt/boot, /mnt/var</tspan></text>
<rect x="535.0" y="165.0" width="400.0" height="75.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="735.0" y="193.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="735.0" dy="0.0">mount -t proc proc /mnt/proc</tspan><tspan x="735.0" dy="13.0">Пряме монтування procfs у простір цільового кореня</tspan><tspan x="735.0" dy="13.0">-&gt; Відкриває процеси та системну статистику</tspan></text>
<rect x="535.0" y="255.0" width="400.0" height="75.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="735.0" y="283.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="735.0" dy="0.0">mount --rbind /sys /mnt/sys &amp;&amp; mount --make-rslave /mnt/sys</tspan><tspan x="735.0" dy="13.0">Рекурсивне прив'язування дерева sysfs + ізоляція rslave</tspan><tspan x="735.0" dy="13.0">-&gt; Доступ до EFI змінних без ризику для хоста</tspan></text>
<rect x="535.0" y="345.0" width="400.0" height="75.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="735.0" y="373.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="735.0" dy="0.0">mount --rbind /dev /mnt/dev &amp;&amp; mount --make-rslave /mnt/dev</tspan><tspan x="735.0" dy="13.0">Рекурсивне прив'язування devtmpfs + pts + shm</tspan><tspan x="735.0" dy="13.0">-&gt; Усі носії та псевдотермінали доступні у chroot</tspan></text>
<rect x="535.0" y="435.0" width="400.0" height="95.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="735.0" y="466.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="735.0" dy="0.0">mount --rbind /run /mnt/run &amp;&amp; mount --make-rslave /mnt/run</tspan><tspan x="735.0" dy="13.0">Рекурсивне прив'язування /run (udev database + lvm locks)</tspan><tspan x="735.0" dy="13.0">+ cp /etc/resolv.conf /mnt/etc/resolv.conf</tspan><tspan x="735.0" dy="13.0">-&gt; Повна працездатність пакетних менеджерів та утиліт</tspan></text>
</svg>