<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="940.0" height="500.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="480.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">МЕХАНІЗМ ПЕРЕМИКАННЯ КОРЕНЯ: ВІД INITRAMFS ДО СПРАВЖНЬОЇ СИСТЕМИ</text>
<rect x="30.0" y="60.0" width="425.0" height="430.0" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="242.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="700">1. РАННІЙ ПРОСТІР (INITRAMFS / TMPFS)</text>
<rect x="50.0" y="105.0" width="385.0" height="45.0" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="242.5" y="124.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="242.5" dy="0.0">Корінь у RAM (rootfs / tmpfs)</tspan><tspan x="242.5" dy="13.0">Містить мінімальний набір: /init, udevd, cryptsetup</tspan></text>
<rect x="50.0" y="160.0" width="385.0" height="55.0" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="242.5" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="242.5" dy="0.0">Монтування віртуальних API-ФС:</tspan><tspan x="242.5" dy="13.0">/dev (devtmpfs) -&gt; виявлення блокових пристроїв</tspan><tspan x="242.5" dy="13.0">/proc, /sys, /run -&gt; взаємодія з ядром</tspan></text>
<rect x="50.0" y="225.0" width="385.0" height="60.0" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="242.5" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="242.5" dy="0.0">Підготовка цільового сховища:</tspan><tspan x="242.5" dy="13.0">1. Завантаження драйверів nvme.ko / ahci.ko</tspan><tspan x="242.5" dy="13.0">2. Дешифрування LUKS -&gt; /dev/mapper/root</tspan><tspan x="242.5" dy="13.0">3. Збирання LVM тома /dev/vg0/root</tspan></text>
<rect x="50.0" y="295.0" width="385.0" height="55.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="242.5" y="313.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e3a8a" text-anchor="middle" font-weight="700"><tspan x="242.5" dy="0.0">Монтування реального диска:</tspan><tspan x="242.5" dy="13.0">mount -t ext4 -o ro /dev/mapper/root /sysroot</tspan><tspan x="242.5" dy="13.0">Файлове дерево диска стає доступним у /sysroot</tspan></text>
<rect x="50.0" y="360.0" width="385.0" height="115.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="242.5" y="397.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#991b1b" text-anchor="middle"><tspan x="242.5" dy="0.0">Чому chroot недостатньо:</tspan><tspan x="242.5" dy="11.7">- Залишає старий tmpfs змонтованим у RAM (витік пам'яті)</tspan><tspan x="242.5" dy="11.7">- Старі відкриті дескриптори блокують розмонтування</tspan><tspan x="242.5" dy="11.7">- Процес /init залишається предком, а не стає PID 1</tspan><tspan x="242.5" dy="11.7">Потрібна спеціальна системна утиліта: switch_root</tspan></text>
<line x1="460.0" y1="270.0" x2="495.0" y2="270.0" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="480.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1d4ed8" text-anchor="middle" font-weight="700">switch_root</text>
<rect x="500.0" y="60.0" width="430.0" height="430.0" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="715.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#166534" text-anchor="middle" font-weight="700">2. ПОСТІЙНА СИСТЕМА (РЕАЛЬНИЙ ROOTFS)</text>
<rect x="520.0" y="105.0" width="390.0" height="65.0" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/><text x="715.0" y="117.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Крок 1: Перенесення точок монтування</tspan><tspan x="715.0" dy="11.7">mount --move /dev /sysroot/dev</tspan><tspan x="715.0" dy="11.7">mount --move /proc /sysroot/proc</tspan><tspan x="715.0" dy="11.7">mount --move /sys /sysroot/sys</tspan><tspan x="715.0" dy="11.7">mount --move /run /sysroot/run</tspan></text>
<rect x="520.0" y="180.0" width="390.0" height="65.0" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/><text x="715.0" y="198.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Крок 2: Рекурсивне очищення RAM</tspan><tspan x="715.0" dy="11.7">Видалення всіх файлів і каталогів з tmpfs initramfs</tspan><tspan x="715.0" dy="11.7">Звільнення оперативної пам'яті ядра</tspan><tspan x="715.0" dy="11.7">(пам'ять initramfs повністю повертається системі)</tspan></text>
<rect x="520.0" y="255.0" width="390.0" height="65.0" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/><text x="715.0" y="273.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Крок 3: Зміна кореневого каталогу</tspan><tspan x="715.0" dy="11.7">chroot('/sysroot') та chdir('/')</tspan><tspan x="715.0" dy="11.7">Коренем процесу стає фізичний накопичувач</tspan><tspan x="715.0" dy="11.7">Точка /sysroot стає новим глобальним '/'</tspan></text>
<rect x="520.0" y="330.0" width="390.0" height="75.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="715.0" y="353.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#14532d" text-anchor="middle" font-weight="700"><tspan x="715.0" dy="0.0">Крок 4: Передача керування PID 1</tspan><tspan x="715.0" dy="11.7">execve('/sbin/init', ['/sbin/init'], envp)</tspan><tspan x="715.0" dy="11.7">PID 1 (колишній скрипт /init) замінює свій двійковий код</tspan><tspan x="715.0" dy="11.7">на справжній менеджер /lib/systemd/systemd</tspan></text>
<rect x="520.0" y="415.0" width="390.0" height="60.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="715.0" y="435.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="715.0" dy="0.0">Результат:</tspan><tspan x="715.0" dy="13.0">Повноцінне середовище дистрибутиву готове до роботи,</tspan><tspan x="715.0" dy="13.0">жодного сліду initramfs у пам'яті не залишається.</tspan></text>
</svg>