<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 700" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="700" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="960.0" height="670.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="25.0" y="25.0" width="930.0" height="95.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="490.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle" font-weight="700">1. АПАРАТНЕ ВКЛЮЧЕННЯ ТА ПРОШИВКА (FIRMWARE: UEFI / BIOS)</text>
<rect x="40.0" y="58.0" width="260.0" height="50.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="170.0" y="73.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Апаратне скидання CPU</tspan><tspan x="170.0" dy="13.0">POWER_GOOD -&gt; Reset Vector</tspan><tspan x="170.0" dy="13.0">(0xFFFFFFF0 / 16-bit real mode)</tspan></text>
<rect x="320.0" y="58.0" width="310.0" height="50.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="475.0" y="73.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="475.0" dy="0.0">Фази UEFI (SEC -&gt; PEI -&gt; DXE)</tspan><tspan x="475.0" dy="13.0">Ініціалізація DRAM, шини PCIe</tspan><tspan x="475.0" dy="13.0">Завантаження драйверів дисків</tspan></text>
<rect x="650.0" y="58.0" width="290.0" height="50.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="795.0" y="73.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="700"><tspan x="795.0" dy="0.0">Менеджер BDS &amp; Secure Boot</tspan><tspan x="795.0" dy="13.0">Перевірка підпису (PK, KEK, db)</tspan><tspan x="795.0" dy="13.0">Запуск завантажувача з ESP FAT32</tspan></text>
<line x1="490.0" y1="120.0" x2="490.0" y2="150.0" stroke="#475569" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="505.0" y="124.0" width="250.0" height="22.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="630.0" y="138.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#475569" text-anchor="middle"><tspan x="630.0" dy="0.0">UEFI передає PE-двійник у RAM</tspan></text>
<rect x="25.0" y="150.0" width="930.0" height="95.0" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="490.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1e40af" text-anchor="middle" font-weight="700">2. ЗАВАНТАЖУВАЧ СИСТЕМИ (BOOTLOADER: GRUB2 / SYSTEMD-BOOT / UKI)</text>
<rect x="40.0" y="183.0" width="270.0" height="50.0" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="175.0" y="198.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">Зчитування конфігурації</tspan><tspan x="175.0" dy="13.0">grub.cfg / loader.conf / UKI</tspan><tspan x="175.0" dy="13.0">Вибір ядра та опцій запуску</tspan></text>
<rect x="330.0" y="183.0" width="290.0" height="50.0" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="475.0" y="198.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="475.0" dy="0.0">Завантаження компонентів у RAM</tspan><tspan x="475.0" dy="13.0">vmlinuz + initramfs (AllocatePages)</tspan><tspan x="475.0" dy="13.0">Підготовка структури boot_params</tspan></text>
<rect x="640.0" y="183.0" width="300.0" height="50.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="790.0" y="198.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e3a8a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">Передача керування ядру</tspan><tspan x="790.0" dy="13.0">Формування cmdline (root=UUID=...)</tspan><tspan x="790.0" dy="13.0">Виклик ExitBootServices() -&gt; startup_64</tspan></text>
<line x1="490.0" y1="245.0" x2="490.0" y2="275.0" stroke="#1e40af" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="505.0" y="249.0" width="290.0" height="22.0" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="650.0" y="263.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1e40af" text-anchor="middle"><tspan x="650.0" dy="0.0">Стрибок у 64-бітний режим (Long Mode)</tspan></text>
<rect x="25.0" y="275.0" width="930.0" height="105.0" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="490.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#166534" text-anchor="middle" font-weight="700">3. ІНІЦІАЛІЗАЦІЯ ЯДРА ТА РАННІЙ ПРОСТІР (KERNEL &amp; INITRAMFS)</text>
<rect x="40.0" y="308.0" width="270.0" height="60.0" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/><text x="175.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">Декомпресія та start_kernel()</tspan><tspan x="175.0" dy="13.0">MMU, Buddy Allocator, ACPI</tspan><tspan x="175.0" dy="13.0">do_initcalls() -&gt; драйвери заліза</tspan><tspan x="175.0" dy="13.0">Запуск kthreadd (PID 2)</tspan></text>
<rect x="330.0" y="308.0" width="290.0" height="60.0" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/><text x="475.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="475.0" dy="0.0">Розгортання initramfs (tmpfs)</tspan><tspan x="475.0" dy="13.0">Запуск /init, ранній udevd</tspan><tspan x="475.0" dy="13.0">Завантаження модулів сховищ</tspan><tspan x="475.0" dy="13.0">LUKS дешифрування, LVM/mdadm</tspan></text>
<rect x="640.0" y="308.0" width="300.0" height="60.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="790.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#14532d" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">Монтування /sysroot &amp; switch_root</tspan><tspan x="790.0" dy="13.0">Монтування справжнього кореня (ro)</tspan><tspan x="790.0" dy="13.0">Перенесення /dev, /proc, /sys, /run</tspan><tspan x="790.0" dy="13.0">execve('/sbin/init') -&gt; заміна PID 1</tspan></text>
<line x1="490.0" y1="380.0" x2="490.0" y2="410.0" stroke="#166534" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="505.0" y="384.0" width="270.0" height="22.0" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="640.0" y="398.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="middle"><tspan x="640.0" dy="0.0">PID 1 стає повноцінним менеджером</tspan></text>
<rect x="25.0" y="410.0" width="930.0" height="115.0" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
<text x="490.0" y="431.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b21a8" text-anchor="middle" font-weight="700">4. СИСТЕМНИЙ МЕНЕДЖЕР SYSTEMD (PID 1: ГРАФ ЦІЛЕЙ ТА СЛУЖБ)</text>
<rect x="40.0" y="443.0" width="270.0" height="70.0" rx="6" fill="#ffffff" stroke="#a855f7" stroke-width="1.5"/><text x="175.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">Генератори та cgroups v2</tspan><tspan x="175.0" dy="13.0">Монтування /sys/fs/cgroup</tspan><tspan x="175.0" dy="13.0">systemd-fstab-generator (/etc/fstab)</tspan><tspan x="175.0" dy="13.0">Запуск systemd-journald</tspan></text>
<rect x="330.0" y="443.0" width="290.0" height="70.0" rx="6" fill="#ffffff" stroke="#a855f7" stroke-width="1.5"/><text x="475.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="475.0" dy="0.0">Базові бар'єри синхронізації</tspan><tspan x="475.0" dy="13.0">sysinit.target (диски, udev, sysctl)</tspan><tspan x="475.0" dy="13.0">basic.target (сокети, таймери, D-Bus)</tspan><tspan x="475.0" dy="13.0">Паралельний старт за сокетом</tspan></text>
<rect x="640.0" y="443.0" width="300.0" height="70.0" rx="6" fill="#f3e8ff" stroke="#9333ea" stroke-width="1.5"/><text x="790.0" y="462.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#581c87" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">Фінальні цілі завантаження</tspan><tspan x="790.0" dy="13.0">multi-user.target (мережі, sshd, cron)</tspan><tspan x="790.0" dy="13.0">graphical.target (DM: gdm/sddm)</tspan><tspan x="790.0" dy="13.0">Активація getty.target на консолях</tspan></text>
<line x1="490.0" y1="525.0" x2="490.0" y2="555.0" stroke="#6b21a8" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="505.0" y="529.0" width="290.0" height="22.0" rx="6" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/><text x="650.0" y="543.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b21a8" text-anchor="middle"><tspan x="650.0" dy="0.0">Spawn agetty / Display Manager</tspan></text>
<rect x="25.0" y="555.0" width="930.0" height="105.0" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
<text x="490.0" y="576.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#9a3412" text-anchor="middle" font-weight="700">5. ШЛЮЗ АВТЕНТИФІКАЦІЇ ТА СЕАНС КОРИСТУВАЧА (LOGIN &amp; USER SHELL)</text>
<rect x="40.0" y="588.0" width="270.0" height="60.0" rx="6" fill="#ffffff" stroke="#f97316" stroke-width="1.5"/><text x="175.0" y="602.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">Відкриття віртуальної TTY</tspan><tspan x="175.0" dy="13.0">agetty відкриває /dev/tty1</tspan><tspan x="175.0" dy="13.0">Налаштування termios (ECHO, ICRNL)</tspan><tspan x="175.0" dy="13.0">Вивід /etc/issue та 'login: '</tspan></text>
<rect x="330.0" y="588.0" width="290.0" height="60.0" rx="6" fill="#ffffff" stroke="#f97316" stroke-width="1.5"/><text x="475.0" y="602.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="475.0" dy="0.0">Автентифікація через PAM</tspan><tspan x="475.0" dy="13.0">/etc/pam.d/login (pam_unix.so)</tspan><tspan x="475.0" dy="13.0">Перевірка хешу в /etc/shadow</tspan><tspan x="475.0" dy="13.0">pam_systemd -&gt; реєстрація сесії</tspan></text>
<rect x="640.0" y="588.0" width="300.0" height="60.0" rx="6" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/><text x="790.0" y="602.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#7c2d12" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">Запуск оболонки користувача</tspan><tspan x="790.0" dy="13.0">systemd-logind: user-1000.slice</tspan><tspan x="790.0" dy="13.0">setuid/setgid, змінні оточення</tspan><tspan x="790.0" dy="13.0">execve('/bin/bash', ['-bash'], ...)</tspan></text>
</svg>