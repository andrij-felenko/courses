<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 540" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="540" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Синхронізація історії команд між термінальними вікнами</text>
<rect x="40.0" y="20.0" width="460.0" height="115.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="270.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">Поведінка за замовчуванням (Втрата команд):</tspan><tspan x="270.0" dy="13.0">1. Кожне вікно тримає свій буфер у пам'яті (HISTSIZE).</tspan><tspan x="270.0" dy="13.0">2. При закритті сеансу буфер ПЕРЕЗАПИСУЄ ~/.bash_history.</tspan><tspan x="270.0" dy="13.0">3. Вікно, закрите останнім, безповоротно затирає історію</tspan><tspan x="270.0" dy="13.0">   усіх інших терміналів, відкритих паралельно!</tspan></text>
<rect x="560.0" y="20.0" width="460.0" height="115.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="790.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">Оптимізована синхронізація в реальному часі:</tspan><tspan x="790.0" dy="13.0">1. shopt -s histappend (дописування замість перезапису).</tspan><tspan x="790.0" dy="13.0">2. PROMPT_COMMAND=&quot;history -a; history -c; history -r; ...&quot;</tspan><tspan x="790.0" dy="13.0">3. Кожна команда негайно скидається на диск і стає</tspan><tspan x="790.0" dy="13.0">   доступною у сусідніх вікнах вже на наступному натисканні Enter!</tspan></text>
<rect x="40.0" y="165.0" width="290.0" height="80.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="185.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="185.0" dy="0.0">Термінал 1 (Процес Bash A)</tspan><tspan x="185.0" dy="13.0">Користувач виконав команду:</tspan><tspan x="185.0" dy="13.0">$ make build</tspan><tspan x="185.0" dy="13.0">Буфер A містить новий запис</tspan></text>
<line x1="330.0" y1="205.0" x2="410.0" y2="205.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="410.0" y="165.0" width="240.0" height="155.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="2.0"/><text x="530.0" y="207.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Дисковий файл</tspan><tspan x="530.0" dy="13.0">~/.bash_history</tspan><tspan x="530.0" dy="13.0">(HISTFILESIZE=100000)</tspan><tspan x="530.0" dy="13.0"></tspan><tspan x="530.0" dy="13.0">Спільне сховище всіх сеансів.</tspan><tspan x="530.0" dy="13.0">Захищене від дублікатів</tspan><tspan x="530.0" dy="13.0">через erasedups</tspan></text>
<line x1="650.0" y1="205.0" x2="730.0" y2="205.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="730.0" y="165.0" width="290.0" height="80.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="875.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="875.0" dy="0.0">Термінал 2 (Процес Bash B)</tspan><tspan x="875.0" dy="13.0">Користувач натискає Enter перед вводом.</tspan><tspan x="875.0" dy="13.0">Спрацьовує PROMPT_COMMAND</tspan><tspan x="875.0" dy="13.0">Буфер B оновлюється з диска</tspan></text>
<rect x="40.0" y="345.0" width="310.0" height="145.0" rx="6" fill="#fff" stroke="#2457d6" stroke-width="1.2"/><text x="195.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="195.0" dy="0.0">1. history -a (Append)</tspan><tspan x="195.0" dy="13.0">Скидає лише нові, ще не записані рядки</tspan><tspan x="195.0" dy="13.0">з оперативної пам'яті поточного процесу</tspan><tspan x="195.0" dy="13.0">в кінець файлу ~/.bash_history на диску.</tspan><tspan x="195.0" dy="13.0">Не перезаписує старі записи.</tspan></text>
<rect x="375.0" y="345.0" width="310.0" height="145.0" rx="6" fill="#fff" stroke="#333333" stroke-width="1.2"/><text x="530.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">2. history -c (Clear)</tspan><tspan x="530.0" dy="13.0">Повністю очищає внутрішній список</tspan><tspan x="530.0" dy="13.0">історії в пам'яті процесу оболонки.</tspan><tspan x="530.0" dy="13.0">Звільняє вказівники буфера перед</tspan><tspan x="530.0" dy="13.0">повторним завантаженням з диска.</tspan></text>
<rect x="710.0" y="345.0" width="310.0" height="145.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.2"/><text x="865.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="865.0" dy="0.0">3. history -r (Read)</tspan><tspan x="865.0" dy="13.0">Зчитує актуальний стан дискового файлу</tspan><tspan x="865.0" dy="13.0">і заповнює буфер пам'яті.</tspan><tspan x="865.0" dy="13.0">У результаті стрілка 'Вгору' одразу бачить</tspan><tspan x="865.0" dy="13.0">команду, щойно виконану в іншому терміналі.</tspan></text>
</svg>