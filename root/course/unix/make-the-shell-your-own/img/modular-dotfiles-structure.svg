<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 550" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="550" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Модульна архітектура конфігурації оболонки (Dotfiles)</text>
<rect x="320.0" y="20.0" width="420.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><text x="530.0" y="41.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Головний файл: ~/.bashrc</tspan><tspan x="530.0" dy="15.6">Мінімальний захищений цикл завантаження модулів</tspan></text>
<line x1="530.0" y1="70.0" x2="530.0" y2="105.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="105.0" width="980.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="530.0" y="129.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Каталог модулів: ~/.config/bash/*.bash (виконуються в алфавітно-числовому порядку)</tspan></text>
<rect x="40.0" y="160.0" width="185.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="132.5" y="179.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="132.5" dy="0.0">00-env.bash</tspan></text>
<rect x="40.0" y="196.0" width="185.0" height="110.0" rx="6" fill="#fff" stroke="#333333" stroke-width="1.2"/><text x="132.5" y="235.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="132.5" dy="0.0">Базове середовище</tspan><tspan x="132.5" dy="12.3">• PATH, EDITOR, PAGER</tspan><tspan x="132.5" dy="12.3">• XDG-директорії</tspan><tspan x="132.5" dy="12.3">• Локаль та кодування</tspan></text>
<rect x="240.0" y="160.0" width="185.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="332.5" y="179.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="332.5" dy="0.0">10-history.bash</tspan></text>
<rect x="240.0" y="196.0" width="185.0" height="110.0" rx="6" fill="#fff" stroke="#333333" stroke-width="1.2"/><text x="332.5" y="235.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="332.5" dy="0.0">Історія команд</tspan><tspan x="332.5" dy="12.3">• HISTSIZE, HISTFILESIZE</tspan><tspan x="332.5" dy="12.3">• HISTCONTROL=erasedups</tspan><tspan x="332.5" dy="12.3">• history -a sync-хук</tspan></text>
<rect x="440.0" y="160.0" width="185.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="532.5" y="179.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="532.5" dy="0.0">20-readline.bash</tspan></text>
<rect x="440.0" y="196.0" width="185.0" height="110.0" rx="6" fill="#fff" stroke="#333333" stroke-width="1.2"/><text x="532.5" y="235.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="532.5" dy="0.0">Ввід і клавіші</tspan><tspan x="532.5" dy="12.3">• bind для пошуку історії</tspan><tspan x="532.5" dy="12.3">• Режим vi / emacs</tspan><tspan x="532.5" dy="12.3">• Підключення .inputrc</tspan></text>
<rect x="640.0" y="160.0" width="185.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="732.5" y="179.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="732.5" dy="0.0">30-prompt.bash</tspan></text>
<rect x="640.0" y="196.0" width="185.0" height="110.0" rx="6" fill="#fff" stroke="#333333" stroke-width="1.2"/><text x="732.5" y="235.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="732.5" dy="0.0">Рядок підказки</tspan><tspan x="732.5" dy="12.3">• Кольоровий $PS1 з \[\]</tspan><tspan x="732.5" dy="12.3">• Інтеграція Starship</tspan><tspan x="732.5" dy="12.3">• Git-статус гілки</tspan></text>
<rect x="840.0" y="160.0" width="180.0" height="32.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="930.0" y="179.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="930.0" dy="0.0">40-aliases.bash</tspan></text>
<rect x="840.0" y="196.0" width="180.0" height="110.0" rx="6" fill="#fff" stroke="#333333" stroke-width="1.2"/><text x="930.0" y="235.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="930.0" dy="0.0">Аліаси та функції</tspan><tspan x="930.0" dy="12.3">• ls, grep кольори</tspan><tspan x="930.0" dy="12.3">• Безпечні cp/mv/rm</tspan><tspan x="930.0" dy="12.3">• mkcd(), up(), extract()</tspan></text>
<line x1="530.0" y1="315.0" x2="530.0" y2="345.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="345.0" width="980.0" height="55.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="530.0" y="362.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">99-local.bash (Локальні машинні налаштування, секрети, токени)</tspan><tspan x="530.0" dy="13.7">⚠️ Додано у .gitignore! Не публікується у відкритому Git-репозиторії.</tspan><tspan x="530.0" dy="13.7">Містить специфічні для конкретного сервера або ноутбука шляхи та змінні.</tspan></text>
<rect x="40.0" y="420.0" width="980.0" height="95.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="530.0" y="445.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Керування та версіонування через Git Bare Repository:</tspan><tspan x="530.0" dy="13.0">$ git init --bare $HOME/.dotfiles</tspan><tspan x="530.0" dy="13.0">$ alias dotfiles='git --git-dir=$HOME/.dotfiles --work-tree=$HOME'</tspan><tspan x="530.0" dy="13.0">$ dotfiles config --local status.showUntrackedFiles no</tspan><tspan x="530.0" dy="13.0">Перевага: Домашній каталог не засмічується окремими симлінками, dotfiles версіонуються як рідні файли.</tspan></text>
</svg>