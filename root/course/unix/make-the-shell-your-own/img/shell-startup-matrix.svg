<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Карта завантаження конфігураційних файлів оболонки</text>
<rect x="280.0" y="20.0" width="500.0" height="42.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><text x="530.0" y="45.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Подія запуску оболонки: системний виклик execve(2)</tspan></text>
<line x1="400.0" y1="62.0" x2="260.0" y2="100.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="660.0" y1="62.0" x2="800.0" y2="100.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="40.0" y="100.0" width="460.0" height="50.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="270.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">1. Стартова оболонка сеансу (Login Shell)</tspan><tspan x="270.0" dy="13.7">Ознака: argv[0][0] == '-' (наприклад, «-bash») або ключ --login / -l</tspan><tspan x="270.0" dy="13.7">(Консольний логін, SSH-сесія, su - user, логін на macOS)</tspan></text>
<line x1="270.0" y1="150.0" x2="270.0" y2="180.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="180.0" width="460.0" height="45.0" rx="6" fill="#fff" stroke="#2457d6" stroke-width="1.2"/><text x="270.0" y="199.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Глобальний системний профіль: /etc/profile</tspan><tspan x="270.0" dy="13.7">(і скрипти з теки /etc/profile.d/*.sh)</tspan></text>
<line x1="270.0" y1="225.0" x2="270.0" y2="255.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="255.0" width="460.0" height="55.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="270.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="270.0" dy="0.0">Перший знайдений користувацький файл (пошук до першого збігу):</tspan><tspan x="270.0" dy="13.0">1. ~/.bash_profile  →  2. ~/.bash_login  →  3. ~/.profile</tspan><tspan x="270.0" dy="13.0">⚠️ Читається лише ОДИН із них! Зазвичай підключає ~/.bashrc</tspan></text>
<line x1="270.0" y1="310.0" x2="270.0" y2="340.0" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="40.0" y="340.0" width="460.0" height="60.0" rx="6" fill="#fff" stroke="#333333" stroke-width="1.2"/><text x="270.0" y="360.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Завершення сеансу (Login Shell Exit):</tspan><tspan x="270.0" dy="13.0">Виконуються файли очищення термінала й сеансу:</tspan><tspan x="270.0" dy="13.0">~/.bash_logout  та  /etc/bash.bash_logout</tspan></text>
<rect x="560.0" y="100.0" width="460.0" height="50.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="790.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">2. Інтерактивна вторинна оболонка (Non-Login Interactive)</tspan><tspan x="790.0" dy="13.7">Ознака: argv[0][0] != '-', термінал підключено (isatty(0) == 1)</tspan><tspan x="790.0" dy="13.7">(Нова вкладка GNOME Terminal / Alacritty, вікно tmux, запуск bash)</tspan></text>
<line x1="790.0" y1="150.0" x2="790.0" y2="180.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="560.0" y="180.0" width="460.0" height="45.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.2"/><text x="790.0" y="199.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Глобальний системний RC: /etc/bash.bashrc</tspan><tspan x="790.0" dy="13.7">(у дистрибутивах Debian, Ubuntu та похідних)</tspan></text>
<line x1="790.0" y1="225.0" x2="790.0" y2="255.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="560.0" y="255.0" width="460.0" height="55.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.5"/><text x="790.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="790.0" dy="0.0">Головний користувацький конфіг: ~/.bashrc</tspan><tspan x="790.0" dy="13.0">Читається при КОЖНОМУ відкритті нового термінального вікна.</tspan><tspan x="790.0" dy="13.0">Містить аліаси, функції, промпт $PS1, налаштування історії</tspan></text>
<line x1="790.0" y1="310.0" x2="790.0" y2="340.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="560.0" y="340.0" width="460.0" height="60.0" rx="6" fill="#fff" stroke="#333333" stroke-width="1.2"/><text x="790.0" y="360.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Неінтерактивний запуск сценаріїв (Non-Interactive Script):</tspan><tspan x="790.0" dy="13.0">Не читає profile і bashrc! Якщо задано змінну $BASH_ENV,</tspan><tspan x="790.0" dy="13.0">оболонка виконує файл, вказаний у ній, перед запуском коду.</tspan></text>
<rect x="40.0" y="430.0" width="460.0" height="140.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="270.0" y="471.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="270.0" dy="0.0">Що класти у Profile (~/.profile, ~/.bash_profile):</tspan><tspan x="270.0" dy="13.0">• Змінні середовища: export PATH, export EDITOR, export LANG</tspan><tspan x="270.0" dy="13.0">• Одноразова ініціалізація сеансу (umask, ssh-agent)</tspan><tspan x="270.0" dy="13.0"></tspan><tspan x="270.0" dy="13.0">Чому: Змінні успадковуються всіма дочірніми процесами через environ.</tspan><tspan x="270.0" dy="13.0">Їх непотрібно повторно обчислювати при відкритті кожного вікна!</tspan></text>
<rect x="560.0" y="430.0" width="460.0" height="140.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="790.0" y="464.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="790.0" dy="0.0">Що класти у RC (~/.bashrc):</tspan><tspan x="790.0" dy="13.0">• Аліаси: alias ll='ls -la'</tspan><tspan x="790.0" dy="13.0">• Функції оболонки та автодоповнення (bash-completion)</tspan><tspan x="790.0" dy="13.0">• Рядок підказки: PS1, інтеграція Starship, хуки PROMPT_COMMAND</tspan><tspan x="790.0" dy="13.0"></tspan><tspan x="790.0" dy="13.0">Чому: Аліаси та функції НЕ передаються через execve(2) іншим процесам,</tspan><tspan x="790.0" dy="13.0">тому кожен новий процес інтерактивної оболонки мусить визначити їх заново.</tspan></text>
</svg>