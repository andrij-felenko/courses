<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="30.0" y="30.0" width="360.0" height="410.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="50.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">ПРОСТІР КОРИСТУВАЧА (Стек і пам'ять програми)</text>
<rect x="50.0" y="75.0" width="320.0" height="130.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="210.0" y="100.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Регістри процесу перед інструкцією syscall</tspan><tspan x="210.0" dy="14.3">RAX = 1              (номер виклику write)</tspan><tspan x="210.0" dy="14.3">RDI = 1              (дескриптор stdout)</tspan><tspan x="210.0" dy="14.3">RSI = 0x7ffdb84a1010 (вказівник на буфер)</tspan><tspan x="210.0" dy="14.3">RDX = 6              (розмір у байтах)</tspan><tspan x="210.0" dy="14.3">RSP = 0x7ffdb84a0f80 (стек програми)</tspan><tspan x="210.0" dy="14.3">RIP = 0x7f3b8a120400 (адреса syscall)</tspan></text>
<rect x="50.0" y="240.0" width="320.0" height="80.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="210.0" y="262.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Буфер у віртуальній пам'яті процесу</tspan><tspan x="210.0" dy="14.3">Адреса: 0x7ffdb84a1010 .. 0x7ffdb84a1016</tspan><tspan x="210.0" dy="14.3">Вміст: ['h', 'e', 'l', 'l', 'o', '\n']</tspan><tspan x="210.0" dy="14.3">Доступ: доступний для читання програмі</tspan></text>
<rect x="50.0" y="350.0" width="320.0" height="70.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="210.0" y="367.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="210.0" dy="0.0">Повернення після sysretq</tspan><tspan x="210.0" dy="14.3">RAX = 6 (успіх) або -1 (якщо помилка, errno)</tspan><tspan x="210.0" dy="14.3">RIP відновлено з RCX, RFLAGS з R11</tspan><tspan x="210.0" dy="14.3">Продовження виконання в Ring 3</tspan></text>
<line x1="370.0" y1="140.0" x2="470.0" y2="140.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="420.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">syscall</text>
<line x1="470.0" y1="385.0" x2="370.0" y2="385.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="420.0" y="373.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">sysretq</text>
<rect x="470.0" y="30.0" width="360.0" height="410.0" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="490.0" y="55.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">ПРОСТІР ЯДРА (Ядерний стек потоку)</text>
<rect x="490.0" y="75.0" width="320.0" height="150.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="650.0" y="114.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">struct pt_regs на ядерному стеку</tspan><tspan x="650.0" dy="13.0">pt_regs-&gt;di = 1, pt_regs-&gt;si = 0x7ffdb84a1010</tspan><tspan x="650.0" dy="13.0">pt_regs-&gt;dx = 6, pt_regs-&gt;ax = 1</tspan><tspan x="650.0" dy="13.0">pt_regs-&gt;cx = 0x7f3b8a120402 (адреса ret)</tspan><tspan x="650.0" dy="13.0">pt_regs-&gt;r11 = RFLAGS (прапорці процесора)</tspan><tspan x="650.0" dy="13.0">pt_regs-&gt;sp = 0x7ffdb84a0f80 (стек користувача)</tspan><tspan x="650.0" dy="13.0">pt_regs-&gt;ip = 0x7f3b8a120400</tspan></text>
<rect x="490.0" y="240.0" width="320.0" height="95.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="650.0" y="262.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="650.0" dy="0.0">copy_from_user(kbuf, ubuf, 6)</tspan><tspan x="650.0" dy="14.3">1. access_ok(ubuf, 6) — перевірка діапазону</tspan><tspan x="650.0" dy="14.3">2. stac — зняття апаратної заборони SMAP</tspan><tspan x="650.0" dy="14.3">3. Копіювання 6 байтів у буфер ядра kbuf</tspan><tspan x="650.0" dy="14.3">4. clac — відновлення захисту SMAP</tspan></text>
<line x1="490.0" y1="285.0" x2="370.0" y2="285.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="430.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">читання kbuf</text>
</svg>