<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Дві філософії створення процесу: монолітний API проти ортогонального вікна</text>
<rect x="30.0" y="60.0" width="430.0" height="405.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="71.3" y="74.0" width="347.4" height="32.0" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="245.0" y="94.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="245.0" dy="0.0">Монолітний підхід: один універсальний виклик</tspan></text>
<rect x="56.0" y="129.8" width="378.1" height="30.5" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="245.0" y="148.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="245.0" dy="0.0">CreateProcess() / spawn(файл, аргументи, оточення, ...)</tspan></text>
<rect x="50.0" y="180.0" width="390.0" height="165.0" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.2"/>
<text x="245.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#dc2626" text-anchor="middle" font-weight="700">Величезна структура конфігурації (STARTUPINFOEX / алокації)</text>
<text x="65.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">• Масив перепризначення дескрипторів (std_in, std_out, err)</text>
<text x="65.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">• Прапорці успадкування дескрипторів та сокетів</text>
<text x="65.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">• Ідентифікатори прав (UID/GID, маркери безпеки)</text>
<text x="65.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">• Маска блокування сигналів і пріоритети планування</text>
<text x="65.0" y="306.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">• Робочий каталог, ліміти ресурсів, групи процесів</text>
<text x="65.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">• Нова властивість ядра? → Потрібно оновлювати весь API!</text>
<line x1="245.0" y1="345.0" x2="245.0" y2="370.0" stroke="#dc2626" stroke-width="1.5"/>
<rect x="79.4" y="387.9" width="331.2" height="44.1" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="245.0" y="406.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Ядро: монструозний парсер сотень прапорців</tspan><tspan x="245.0" dy="13.7">(комбінаторний вибух та залежності в одному виклику)</tspan></text>
<rect x="500.0" y="60.0" width="430.0" height="405.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<rect x="537.6" y="74.0" width="354.8" height="32.0" rx="6" fill="#e9f7ef" stroke="#16a34a" stroke-width="1.5"/><text x="715.0" y="94.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="715.0" dy="0.0">Ортогональна модель Unix: fork + вікно + exec</tspan></text>
<rect x="558.4" y="124.5" width="313.3" height="31.0" rx="6" fill="#eaf0fd" stroke="#2563eb" stroke-width="1.5"/><text x="715.0" y="143.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="715.0" dy="0.0">1. fork(): народжується точна копія процесу</tspan></text>
<line x1="715.0" y1="162.0" x2="715.0" y2="185.0" stroke="#16a34a" stroke-width="1.5"/>
<rect x="520.0" y="185.0" width="390.0" height="160.0" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.2"/>
<text x="715.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#16a34a" text-anchor="middle" font-weight="700">2. Вікно налаштування: виконання звичайних системних викликів</text>
<text x="535.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">• dup2() / close() → перенаправлення потоків та каналів</text>
<text x="535.0" y="247.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">• chdir() → перехід у потрібний каталог</text>
<text x="535.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">• setuid() / capset() → скидання зайвих привілеїв</text>
<text x="535.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">• sigprocmask() → налаштування маски сигналів</text>
<text x="535.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">• unshare() / setns() → перехід у простори імен (namespaces)</text>
<text x="535.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="start">• Нова властивість ядра? → Вже доступна, API запуску не міняється!</text>
<line x1="715.0" y1="345.0" x2="715.0" y2="370.0" stroke="#16a34a" stroke-width="1.5"/>
<rect x="526.0" y="387.9" width="378.1" height="44.1" rx="6" fill="#f3e8ff" stroke="#7e22ce" stroke-width="1.5"/><text x="715.0" y="406.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="715.0" dy="0.0">3. execve(): заміна образу пам'яті новою програмою</tspan><tspan x="715.0" dy="13.7">(всі налаштовані властивості ядра безшовно успадковано)</tspan></text>
</svg>