<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1250 710" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1250" height="710" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="620.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ешелонована оборона (Defense in Depth) привілеїв у Linux</text>
<rect x="60.0" y="75.0" width="1120.0" height="108.0" rx="8" fill="#eaf0fd" stroke="#27ae60" stroke-width="1.8"/>
<text x="85.0" y="103.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Рівень 1: Дискреційний контроль (DAC) та скидання ідентичності</text>
<rect x="85.0" y="113.0" width="1070.0" height="62.0" rx="6" fill="#eaf0fd" stroke="none" stroke-width="1.5"/><text x="620.0" y="132.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">UID / GID / Groups (setresuid, setresgid, setgroups)</tspan><tspan x="620.0" dy="15.6">Процес відмовляється від всемогутнього UID 0. Створюється виділений системний користувач (наприклад, _nginx, nobody).</tspan><tspan x="620.0" dy="15.6">Помилка в коді не дає автоматичного доступу до чужих файлів у VFS за межами прав непривілейованого користувача.</tspan></text>
<rect x="60.0" y="197.0" width="1120.0" height="108.0" rx="8" fill="#eaf6ef" stroke="#2457d6" stroke-width="1.8"/>
<text x="85.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Рівень 2: Декомпозиція прав суперкористувача (Linux Capabilities)</text>
<rect x="85.0" y="235.0" width="1070.0" height="62.0" rx="6" fill="#eaf6ef" stroke="none" stroke-width="1.5"/><text x="620.0" y="254.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">POSIX 1003.1e / Linux Capabilities (CAP_NET_BIND_SERVICE, CAP_SYS_TIME, CAP_CHOWN...)</tspan><tspan x="620.0" dy="15.6">Замість монолітного root процес утримує лише атомарні бітові дозволи. Скидання Bounding Set та Ambient-маски</tspan><tspan x="620.0" dy="15.6">гарантує, що процес не зможе завантажувати модулі ядра (CAP_SYS_MODULE) чи обходити DAC (CAP_DAC_OVERRIDE).</tspan></text>
<rect x="60.0" y="319.0" width="1120.0" height="108.0" rx="8" fill="#fff6e5" stroke="#c0392b" stroke-width="1.8"/>
<text x="85.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Рівень 3: Звуження інтерфейсу ядра (Seccomp-BPF)</text>
<rect x="85.0" y="357.0" width="1070.0" height="62.0" rx="6" fill="#fff6e5" stroke="none" stroke-width="1.5"/><text x="620.0" y="376.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Фільтрація системних викликів (PR_SET_NO_NEW_PRIVS + seccomp-bpf)</tspan><tspan x="620.0" dy="15.6">Блокування доступу до небезпечних системних викликів (ptrace, bpf, io_uring_setup, unshare, mount).</tspan><tspan x="620.0" dy="15.6">Навіть якщо зловмисник захопив потік виконання (ROP/shellcode), він не може експлуатувати 0-day вразливості ядра.</tspan></text>
<rect x="60.0" y="441.0" width="1120.0" height="108.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="85.0" y="469.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Рівень 4: Мандатний контроль доступу (MAC: AppArmor / SELinux)</text>
<rect x="85.0" y="479.0" width="1070.0" height="62.0" rx="6" fill="#fdecea" stroke="none" stroke-width="1.5"/><text x="620.0" y="498.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Політики безпеки на рівні ОС (Type Enforcement, Path confinement)</tspan><tspan x="620.0" dy="15.6">Примусове обмеження операцій над ресурсами навіть для привілейованих процесів. Якщо демон скомпрометовано,</tspan><tspan x="620.0" dy="15.6">політика забороняє читання /etc/shadow, зміну бінарників та запуск командних оболонок (/bin/sh).</tspan></text>
<rect x="60.0" y="563.0" width="1120.0" height="108.0" rx="8" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/>
<text x="85.0" y="591.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="start" font-weight="700">Рівень 5: Просторова ізоляція та Landlock (Namespaces &amp; Sandboxing)</text>
<rect x="85.0" y="601.0" width="1070.0" height="62.0" rx="6" fill="#f4f6f8" stroke="none" stroke-width="1.5"/><text x="620.0" y="628.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="620.0" dy="0.0">Простори імен (Mount, PID, Net) та обмеження VFS у просторі користувача (Landlock LSM)</tspan><tspan x="620.0" dy="15.6">Повна невидимість чужих процесів, ізольований мережевий стек, приватне дерево /tmp та доступ лише до дозволених папок.</tspan></text>
</svg>