<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1270 650" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1270" height="650" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="630.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектурний патерн розподілу привілеїв (Privilege Separation)</text>
<rect x="50.0" y="75.0" width="480.0" height="525.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<rect x="50.0" y="75.0" width="480.0" height="48.0" rx="10" fill="#fff6e5" stroke="#6b7280" stroke-width="1.5"/>
<text x="290.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#c0392b" text-anchor="middle" font-weight="700">Привілейований процес (Master / Monitor)</text>
<rect x="65.0" y="140.0" width="450.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/><text x="290.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">Запускається від root (UID 0) або з вузьким набором Capabilities</tspan></text>
<rect x="65.0" y="204.0" width="450.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/><text x="290.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">НЕ читає дані з неперевіреної мережі напряму</tspan></text>
<rect x="65.0" y="268.0" width="450.0" height="76.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/><text x="290.0" y="280.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">Виконує критичні привілейовані операції за запитом воркера:</tspan><tspan x="290.0" dy="15.0">  • Відкриття файлів сертифікатів SSL/TLS (/etc/ssl/private)</tspan><tspan x="290.0" dy="15.0">  • Прив'язка до нових мережевих портів (bind &lt; 1024)</tspan><tspan x="290.0" dy="15.0">  • Перезавантаження конфігурації (SIGHUP)</tspan><tspan x="290.0" dy="15.0">  • Аутентифікація користувачів (PAM, /etc/shadow)</tspan></text>
<rect x="65.0" y="354.0" width="450.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/><text x="290.0" y="385.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">Мінімальна поверхня коду: проста логіка валідації команд</tspan></text>
<rect x="65.0" y="418.0" width="450.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/><text x="290.0" y="449.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="290.0" dy="0.0">Контролює життєвий цикл воркерів (fork, waitpid, restart при збої)</tspan></text>
<rect x="730.0" y="75.0" width="480.0" height="525.0" rx="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<rect x="730.0" y="75.0" width="480.0" height="48.0" rx="10" fill="#eaf6ef" stroke="#6b7280" stroke-width="1.5"/>
<text x="970.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#27ae60" text-anchor="middle" font-weight="700">Непривілейований процес (Worker / Engine)</text>
<rect x="745.0" y="140.0" width="450.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/><text x="970.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">Працює від непривілейованого користувача (UID 65534 / nobody)</tspan></text>
<rect x="745.0" y="204.0" width="450.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/><text x="970.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">Обробляє небезпечний вхідний мережевий потік (HTTP, DNS, SSH)</tspan></text>
<rect x="745.0" y="268.0" width="450.0" height="82.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/><text x="970.0" y="283.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">Повна пісочниця (Multi-layer Sandbox):</tspan><tspan x="970.0" dy="15.0">  • Caps: 0 (усі capabilities скинуто)</tspan><tspan x="970.0" dy="15.0">  • Seccomp-BPF: дозволено лише read, write, epoll_wait, futex</tspan><tspan x="970.0" dy="15.0">  • Namespaces / chroot: пустий каталог /var/empty</tspan><tspan x="970.0" dy="15.0">  • PR_SET_NO_NEW_PRIVS: блокування підвищення прав</tspan></text>
<rect x="745.0" y="360.0" width="450.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/><text x="970.0" y="391.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">При збої / ROP-атаці зловмисник не має системних прав</tspan></text>
<rect x="745.0" y="424.0" width="450.0" height="54.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.0"/><text x="970.0" y="455.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="970.0" dy="0.0">Спілкується з Master виключно через локальний socketpair</tspan></text>
<line x1="540.0" y1="220.0" x2="720.0" y2="220.0" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arrow)"/>
<line x1="720.0" y1="420.0" x2="540.0" y2="420.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="534.8" y="150.2" width="190.5" height="59.6" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="169.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">Unix Domain Socket</tspan><tspan x="630.0" dy="14.3">(socketpair / SCM_RIGHTS)</tspan><tspan x="630.0" dy="14.3">Передача дескрипторів FD</tspan></text>
<rect x="524.5" y="437.4" width="211.0" height="45.3" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.5"/><text x="630.0" y="456.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="630.0" dy="0.0">Запити на відкриття ресурсів</tspan><tspan x="630.0" dy="14.3">та валідовані команди</tspan></text>
</svg>