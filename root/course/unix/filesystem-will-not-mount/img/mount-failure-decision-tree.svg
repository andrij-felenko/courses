<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 610" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="610" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="940.0" height="580.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="480.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">ДІАГНОСТИЧНА МАТРИЦЯ РОЗБОРУ ТИПОВИХ ВІДМОВ MOUNT(8)</text>
<rect x="340.0" y="55.0" width="280.0" height="36.0" rx="6" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/><text x="480.0" y="69.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700"><tspan x="480.0" dy="0.0">ЗБІЙ ВИКЛИКУ MOUNT(8)</tspan><tspan x="480.0" dy="14.3">Код повернення != 0</tspan></text>
<line x1="380.0" y1="91.0" x2="140.0" y2="120.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="430.0" y1="91.0" x2="370.0" y2="120.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="530.0" y1="91.0" x2="590.0" y2="120.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="580.0" y1="91.0" x2="820.0" y2="120.0" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="25.0" y="120.0" width="215.0" height="430.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="35.0" y="128.0" width="195.0" height="36.0" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="132.5" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="132.5" dy="0.0">«unknown filesystem type»</tspan><tspan x="132.5" dy="13.0">Помилка: ENODEV</tspan></text>
<rect x="35.0" y="170.0" width="195.0" height="75.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="132.5" y="187.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="132.5" dy="0.0">Джерело збою:</tspan><tspan x="132.5" dy="11.7">Ядро не знає типу ФС.</tspan><tspan x="132.5" dy="11.7">Модуль не завантажено або</tspan><tspan x="132.5" dy="11.7">відсутній у збірці ядра чи</tspan><tspan x="132.5" dy="11.7">врізаному initramfs.</tspan></text>
<rect x="35.0" y="252.0" width="195.0" height="80.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="132.5" y="271.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="132.5" dy="0.0">Діагностика:</tspan><tspan x="132.5" dy="11.7">$ cat /proc/filesystems</tspan><tspan x="132.5" dy="11.7">$ lsmod | grep &lt;fs&gt;</tspan><tspan x="132.5" dy="11.7">$ modinfo &lt;fs_name&gt;</tspan><tspan x="132.5" dy="11.7">$ ls /lib/modules/$(uname -r)</tspan></text>
<rect x="35.0" y="340.0" width="195.0" height="100.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="132.5" y="363.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="132.5" dy="0.0">Усунення:</tspan><tspan x="132.5" dy="11.7">1. $ modprobe &lt;fs_name&gt;</tspan><tspan x="132.5" dy="11.7">2. В initramfs: оновити конфіг</tspan><tspan x="132.5" dy="11.7">та перегенерувати образ:</tspan><tspan x="132.5" dy="11.7">$ dracut -f</tspan><tspan x="132.5" dy="11.7">або $ update-initramfs -u</tspan></text>
<rect x="35.0" y="448.0" width="195.0" height="90.0" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/><text x="132.5" y="472.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#991b1b" text-anchor="middle"><tspan x="132.5" dy="0.0">Пастка:</tspan><tspan x="132.5" dy="11.7">Оновлення ядра без ребуту:</tspan><tspan x="132.5" dy="11.7">старі модулі видалено з диска,</tspan><tspan x="132.5" dy="11.7">modprobe не знайде шляху</tspan><tspan x="132.5" dy="11.7">доки вузол не перезавантажено.</tspan></text>
<rect x="250.0" y="120.0" width="225.0" height="430.0" rx="8" fill="#fefce8" stroke="#fde047" stroke-width="1.5"/>
<rect x="260.0" y="128.0" width="205.0" height="36.0" rx="6" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/><text x="362.5" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#854d0e" text-anchor="middle" font-weight="700"><tspan x="362.5" dy="0.0">«bad superblock / wrong fs»</tspan><tspan x="362.5" dy="13.0">Помилка: EINVAL</tspan></text>
<rect x="260.0" y="170.0" width="205.0" height="75.0" rx="6" fill="#ffffff" stroke="#fef08a" stroke-width="1.5"/><text x="362.5" y="187.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="362.5" dy="0.0">Джерело збою:</tspan><tspan x="362.5" dy="11.7">Пошкоджено магічне число,</tspan><tspan x="362.5" dy="11.7">розмір блоку чи контрольні</tspan><tspan x="362.5" dy="11.7">суми; хибна опція mount; або</tspan><tspan x="362.5" dy="11.7">зсув таблиці розділів.</tspan></text>
<rect x="260.0" y="252.0" width="205.0" height="80.0" rx="6" fill="#ffffff" stroke="#fef08a" stroke-width="1.5"/><text x="362.5" y="271.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="362.5" dy="0.0">Діагностика:</tspan><tspan x="362.5" dy="11.7">$ dmesg | tail -n 20</tspan><tspan x="362.5" dy="11.7">$ blkid /dev/sdX</tspan><tspan x="362.5" dy="11.7">$ file -s /dev/sdX</tspan><tspan x="362.5" dy="11.7">$ dumpe2fs -h /dev/sdX</tspan></text>
<rect x="260.0" y="340.0" width="205.0" height="100.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="362.5" y="363.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="362.5" dy="0.0">Усунення:</tspan><tspan x="362.5" dy="11.7">1. Прибрати хибні опції -o</tspan><tspan x="362.5" dy="11.7">2. Знайти резервний SB:</tspan><tspan x="362.5" dy="11.7">$ mke2fs -n -b 4096 /dev/sdX</tspan><tspan x="362.5" dy="11.7">3. Відновити суперблок:</tspan><tspan x="362.5" dy="11.7">$ e2fsck -b 32768 /dev/sdX</tspan></text>
<rect x="260.0" y="448.0" width="205.0" height="90.0" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/><text x="362.5" y="472.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#991b1b" text-anchor="middle"><tspan x="362.5" dy="0.0">Пастка:</tspan><tspan x="362.5" dy="11.7">Запуск fsck на живій ФС</tspan><tspan x="362.5" dy="11.7">гарантовано руйнує дані!</tspan><tspan x="362.5" dy="11.7">Завжди перевіряти статус:</tspan><tspan x="362.5" dy="11.7">$ findmnt /dev/sdX</tspan></text>
<rect x="485.0" y="120.0" width="225.0" height="430.0" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<rect x="495.0" y="128.0" width="205.0" height="36.0" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/><text x="597.5" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle" font-weight="700"><tspan x="597.5" dy="0.0">«target is busy / EBUSY»</tspan><tspan x="597.5" dy="13.0">Помилка: EBUSY</tspan></text>
<rect x="495.0" y="170.0" width="205.0" height="75.0" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/><text x="597.5" y="187.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="597.5" dy="0.0">Джерело збою:</tspan><tspan x="597.5" dy="11.7">1. Відкриті дескриптори в точці.</tspan><tspan x="597.5" dy="11.7">2. Вкладене активне монтування.</tspan><tspan x="597.5" dy="11.7">3. Блоковий пристрій захоплено</tspan><tspan x="597.5" dy="11.7">LVM, LUKS, RAID чи multipath.</tspan></text>
<rect x="495.0" y="252.0" width="205.0" height="80.0" rx="6" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/><text x="597.5" y="271.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="597.5" dy="0.0">Діагностика:</tspan><tspan x="597.5" dy="11.7">$ fuser -vm /mnt/point</tspan><tspan x="597.5" dy="11.7">$ lsof +f -- /mnt/point</tspan><tspan x="597.5" dy="11.7">$ lsblk -f</tspan><tspan x="597.5" dy="11.7">$ ls -l /sys/class/block/*/holders</tspan></text>
<rect x="495.0" y="340.0" width="205.0" height="100.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="597.5" y="363.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="597.5" dy="0.0">Усунення:</tspan><tspan x="597.5" dy="11.7">1. Завершити процеси (fuser -k)</tspan><tspan x="597.5" dy="11.7">2. Монтувати розшифрований</tspan><tspan x="597.5" dy="11.7">/dev/mapper/xxx замість сирого</tspan><tspan x="597.5" dy="11.7">3. Зупинити конфліктний VG:</tspan><tspan x="597.5" dy="11.7">$ vgchange -an &lt;vg_name&gt;</tspan></text>
<rect x="495.0" y="448.0" width="205.0" height="90.0" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/><text x="597.5" y="472.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#991b1b" text-anchor="middle"><tspan x="597.5" dy="0.0">Пастка:</tspan><tspan x="597.5" dy="11.7">Ледаче відмонтування (umount -l)</tspan><tspan x="597.5" dy="11.7">ховає точку з VFS, але пристрій</tspan><tspan x="597.5" dy="11.7">залишається зайнятим у ядрі</tspan><tspan x="597.5" dy="11.7">поки процеси тримають fd!</tspan></text>
<rect x="720.0" y="120.0" width="215.0" height="430.0" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
<rect x="730.0" y="128.0" width="195.0" height="36.0" rx="6" fill="#f3e8ff" stroke="#a855f7" stroke-width="1.5"/><text x="827.5" y="143.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b21a8" text-anchor="middle" font-weight="700"><tspan x="827.5" dy="0.0">«Emergency Mode / fstab»</tspan><tspan x="827.5" dy="13.0">Збій завантаження systemd</tspan></text>
<rect x="730.0" y="170.0" width="195.0" height="75.0" rx="6" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.5"/><text x="827.5" y="187.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="827.5" dy="0.0">Джерело збою:</tspan><tspan x="827.5" dy="11.7">Відсутній диск з /etc/fstab,</tspan><tspan x="827.5" dy="11.7">змінився UUID після клонування,</tspan><tspan x="827.5" dy="11.7">або мережевий диск монтується</tspan><tspan x="827.5" dy="11.7">до ініціалізації мережі.</tspan></text>
<rect x="730.0" y="252.0" width="195.0" height="80.0" rx="6" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.5"/><text x="827.5" y="271.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="827.5" dy="0.0">Діагностика:</tspan><tspan x="827.5" dy="11.7">$ journalctl -xb</tspan><tspan x="827.5" dy="11.7">$ systemctl --failed</tspan><tspan x="827.5" dy="11.7">$ blkid</tspan><tspan x="827.5" dy="11.7">$ cat /etc/fstab</tspan></text>
<rect x="730.0" y="340.0" width="195.0" height="100.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="827.5" y="363.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="827.5" dy="0.0">Усунення:</tspan><tspan x="827.5" dy="11.7">1. Додати опцію `nofail`</tspan><tspan x="827.5" dy="11.7">2. Для NFS/iSCSI: `_netdev`</tspan><tspan x="827.5" dy="11.7">3. Оновити UUID у /etc/fstab:</tspan><tspan x="827.5" dy="11.7">UUID=xxx /data ext4 defaults,nofail 0 2</tspan><tspan x="827.5" dy="11.7">4. $ systemctl daemon-reload</tspan></text>
<rect x="730.0" y="448.0" width="195.0" height="90.0" rx="6" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/><text x="827.5" y="472.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#991b1b" text-anchor="middle"><tspan x="827.5" dy="0.0">Пастка:</tspan><tspan x="827.5" dy="11.7">Забутий `nofail` на некритичному</tspan><tspan x="827.5" dy="11.7">диску зупиняє завантаження всього</tspan><tspan x="827.5" dy="11.7">сервера на 90-секундному таймауті</tspan><tspan x="827.5" dy="11.7">з падінням в emergency.target!</tspan></text>
</svg>