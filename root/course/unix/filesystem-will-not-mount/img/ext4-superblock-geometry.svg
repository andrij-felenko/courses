<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="940.0" height="500.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="480.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">ГЕОМЕТРІЯ ГРУП БЛОКІВ EXT4 ТА РОЗТАШУВАННЯ РЕЗЕРВНИХ СУПЕРБЛОКІВ</text>
<rect x="30.0" y="55.0" width="900.0" height="48.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="480.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Файлова система Ext4 розбивається на Block Groups (типово 32 768 блоків по 4 КіБ = 128 МіБ на групу).</tspan><tspan x="480.0" dy="13.0">Основний суперблок розташований у Групі 0. Завдяки прапорцю sparse_super резервні суперблоки зберігаються лише у вибраних групах.</tspan></text>
<rect x="30.0" y="120.0" width="210.0" height="240.0" rx="8" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
<rect x="40.0" y="128.0" width="190.0" height="26.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/><text x="135.0" y="144.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1e40af" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">Група блоків 0 (LBA 0..128M)</tspan></text>
<rect x="40.0" y="160.0" width="190.0" height="36.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="135.0" y="175.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="135.0" dy="0.0">Зміщення 0..1023 байти:</tspan><tspan x="135.0" dy="11.7">x86 Boot / MBR Padding</tspan></text>
<rect x="40.0" y="202.0" width="190.0" height="52.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="135.0" y="219.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">ОСНОВНИЙ СУПЕРБЛОК</tspan><tspan x="135.0" dy="11.7">Блок 0 (1K) або Блок 0..1 (4K)</tspan><tspan x="135.0" dy="11.7">Magic: 0xEF53 (Offset 1024B)</tspan></text>
<rect x="40.0" y="260.0" width="190.0" height="32.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="135.0" y="279.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="135.0" dy="0.0">Group Descriptors (GDT)</tspan></text>
<rect x="40.0" y="298.0" width="190.0" height="52.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="135.0" y="315.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="135.0" dy="0.0">Block / Inode Bitmaps</tspan><tspan x="135.0" dy="11.7">Таблиця Inode (Inode Table)</tspan><tspan x="135.0" dy="11.7">Блоки даних користувача</tspan></text>
<rect x="260.0" y="120.0" width="210.0" height="240.0" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
<rect x="270.0" y="128.0" width="190.0" height="26.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="365.0" y="144.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="365.0" dy="0.0">Група блоків 1 (3¹)</tspan></text>
<rect x="270.0" y="160.0" width="190.0" height="48.0" rx="6" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/><text x="365.0" y="175.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#854d0e" text-anchor="middle" font-weight="700"><tspan x="365.0" dy="0.0">РЕЗЕРВНИЙ СУПЕРБЛОК #1</tspan><tspan x="365.0" dy="11.7">Блок 32768 (для блоку 4 КіБ)</tspan><tspan x="365.0" dy="11.7">Точна копія суперблоку</tspan></text>
<rect x="270.0" y="214.0" width="190.0" height="34.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="365.0" y="234.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="365.0" dy="0.0">Резервна таблиця GDT</tspan></text>
<rect x="270.0" y="254.0" width="190.0" height="96.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="365.0" y="275.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="365.0" dy="0.0">Block / Inode Bitmaps</tspan><tspan x="365.0" dy="11.7">Таблиця Inode</tspan><tspan x="365.0" dy="11.7">Блоки даних користувача</tspan><tspan x="365.0" dy="11.7"></tspan><tspan x="365.0" dy="11.7">(Використовується для</tspan><tspan x="365.0" dy="11.7">e2fsck -b 32768)</tspan></text>
<rect x="490.0" y="120.0" width="210.0" height="240.0" rx="8" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.8"/>
<rect x="500.0" y="128.0" width="190.0" height="26.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="595.0" y="144.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="595.0" dy="0.0">Група блоків 3 (3¹)</tspan></text>
<rect x="500.0" y="160.0" width="190.0" height="48.0" rx="6" fill="#fef9c3" stroke="#eab308" stroke-width="1.5"/><text x="595.0" y="175.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#854d0e" text-anchor="middle" font-weight="700"><tspan x="595.0" dy="0.0">РЕЗЕРВНИЙ СУПЕРБЛОК #2</tspan><tspan x="595.0" dy="11.7">Блок 98304 (для блоку 4 КіБ)</tspan><tspan x="595.0" dy="11.7">(3 × 32768)</tspan></text>
<rect x="500.0" y="214.0" width="190.0" height="34.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="595.0" y="234.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">Резервна таблиця GDT</tspan></text>
<rect x="500.0" y="254.0" width="190.0" height="96.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="595.0" y="275.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="595.0" dy="0.0">Block / Inode Bitmaps</tspan><tspan x="595.0" dy="11.7">Таблиця Inode</tspan><tspan x="595.0" dy="11.7">Блоки даних користувача</tspan><tspan x="595.0" dy="11.7"></tspan><tspan x="595.0" dy="11.7">(Використовується для</tspan><tspan x="595.0" dy="11.7">e2fsck -b 98304)</tspan></text>
<rect x="720.0" y="120.0" width="210.0" height="240.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<rect x="730.0" y="128.0" width="190.0" height="26.0" rx="6" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/><text x="825.0" y="144.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#334155" text-anchor="middle" font-weight="700"><tspan x="825.0" dy="0.0">Решта груп (sparse_super)</tspan></text>
<rect x="730.0" y="160.0" width="190.0" height="68.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="825.0" y="167.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="825.0" dy="0.0">Групи 2, 4, 6, 8...:</tspan><tspan x="825.0" dy="11.7">НЕ МІСТЯТЬ копій суперблоку!</tspan><tspan x="825.0" dy="11.7">(економія місця на диску)</tspan><tspan x="825.0" dy="11.7"></tspan><tspan x="825.0" dy="11.7">Групи 5 (163840), 7 (229376),</tspan><tspan x="825.0" dy="11.7">9 (294912) МІСТЯТЬ копії (степені 3, 5, 7)</tspan></text>
<rect x="730.0" y="234.0" width="190.0" height="116.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="825.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#991b1b" text-anchor="middle"><tspan x="825.0" dy="0.0">Степені 3, 5, 7:</tspan><tspan x="825.0" dy="11.7">• 3⁰=1, 3¹=3, 3²=9, 3³=27</tspan><tspan x="825.0" dy="11.7">• 5¹=5, 5²=25, 5³=125</tspan><tspan x="825.0" dy="11.7">• 7¹=7, 7²=49, 7³=343</tspan><tspan x="825.0" dy="11.7"></tspan><tspan x="825.0" dy="11.7">Команда розрахунку:</tspan><tspan x="825.0" dy="11.7">mke2fs -n -b 4096 /dev/sdX</tspan></text>
<rect x="30.0" y="380.0" width="900.0" height="105.0" rx="8" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
<text x="480.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700">ПРАКТИЧНИЙ АЛГОРИТМ ВІДНОВЛЕННЯ ПРИ ПОШКОДЖЕННІ ГОЛОВНОГО СУПЕРБЛОКУ</text>
<rect x="45.0" y="415.0" width="415.0" height="60.0" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/><text x="252.5" y="435.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="252.5" dy="0.0">1. Зчитування геометрії без запису (Dry-Run):</tspan><tspan x="252.5" dy="13.0">$ dumpe2fs /dev/sdX | grep -i superblock</tspan><tspan x="252.5" dy="13.0">або $ mke2fs -n -b 4096 /dev/sdX</tspan></text>
<rect x="475.0" y="415.0" width="440.0" height="60.0" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/><text x="695.0" y="435.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="695.0" dy="0.0">2. Відновлення з резервної копії:</tspan><tspan x="695.0" dy="13.0">$ e2fsck -b 32768 -y /dev/sdX</tspan><tspan x="695.0" dy="13.0">(e2fsck копіює валідний резервний суперблок у Групу 0)</tspan></text>
</svg>