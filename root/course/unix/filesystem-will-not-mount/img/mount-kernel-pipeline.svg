<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 630" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="630" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="940.0" height="600.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="480.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">ВНУТРІШНІЙ ПАЙПЛАЙН ЯДРА: ВІД СИСТЕМНОГО ВИКЛИКУ MOUNT(2) ДО РЕЄСТРАЦІЇ VFS</text>
<rect x="25.0" y="55.0" width="910.0" height="80.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="480.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#334155" text-anchor="middle" font-weight="700">1. ПРОСТІР КОРИСТУВАЧА ТА ВХІДНИЙ СИСТЕМНИЙ ВИКЛИК</text>
<rect x="40.0" y="82.0" width="275.0" height="42.0" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/><text x="177.5" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="177.5" dy="0.0">mount(dev, dir, type, flags, data)</tspan><tspan x="177.5" dy="13.0">або fsopen() + fsconfig() + fsmount()</tspan></text>
<rect x="335.0" y="82.0" width="280.0" height="42.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/><text x="475.0" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="475.0" dy="0.0">Копіювання шляхів у простір ядра:</tspan><tspan x="475.0" dy="13.0">getname() / user_path_at()</tspan></text>
<rect x="635.0" y="82.0" width="285.0" height="42.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="777.5" y="100.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="700"><tspan x="777.5" dy="0.0">Помилки валідації шляхів / прав:</tspan><tspan x="777.5" dy="13.0">ENOENT (нема точки) | EPERM (CAP_SYS_ADMIN)</tspan></text>
<line x1="480.0" y1="135.0" x2="480.0" y2="160.0" stroke="#0284c7" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="25.0" y="160.0" width="910.0" height="85.0" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="480.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1e40af" text-anchor="middle" font-weight="700">2. РІВЕНЬ VFS: ПОШУК ДРАЙВЕРА ТА ЗАХОПЛЕННЯ БЛОКОВОГО ПРИСТРОЮ</text>
<rect x="40.0" y="190.0" width="275.0" height="44.0" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="177.5" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="177.5" dy="0.0">get_fs_type(fstype)</tspan><tspan x="177.5" dy="13.0">Пошук у списку file_systems</tspan></text>
<rect x="335.0" y="190.0" width="280.0" height="44.0" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.5"/><text x="475.0" y="209.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="475.0" dy="0.0">blkdev_get_by_path(FMODE_EXCL)</tspan><tspan x="475.0" dy="13.0">Ексклюзивне захоплення носія</tspan></text>
<rect x="635.0" y="190.0" width="285.0" height="44.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="777.5" y="202.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="700"><tspan x="777.5" dy="0.0">Точки відмови:</tspan><tspan x="777.5" dy="13.0">ENODEV (модуль не завантажено)</tspan><tspan x="777.5" dy="13.0">EBUSY (пристрій зайнятий LVM/холдером)</tspan></text>
<line x1="480.0" y1="245.0" x2="480.0" y2="270.0" stroke="#1e40af" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="25.0" y="270.0" width="910.0" height="95.0" rx="8" fill="#fefce8" stroke="#fde047" stroke-width="1.5"/>
<text x="480.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#854d0e" text-anchor="middle" font-weight="700">3. ДРАЙВЕР ФС: ЗЧИТУВАННЯ ТА ВАЛІДАЦІЯ СТРУКТУРИ SUPER_BLOCK</text>
<rect x="40.0" y="300.0" width="275.0" height="54.0" rx="6" fill="#ffffff" stroke="#eab308" stroke-width="1.5"/><text x="177.5" y="317.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="177.5" dy="0.0">Зчитування суперблоку з диска:</tspan><tspan x="177.5" dy="13.0">sb_bread(sb, offset)</tspan><tspan x="177.5" dy="13.0">(1024B ext4, 0B xfs, 64KiB btrfs)</tspan></text>
<rect x="335.0" y="300.0" width="280.0" height="54.0" rx="6" fill="#ffffff" stroke="#eab308" stroke-width="1.5"/><text x="475.0" y="311.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="475.0" dy="0.0">Перевірка валідності:</tspan><tspan x="475.0" dy="13.0">Magic number (0xEF53 / XFSB)</tspan><tspan x="475.0" dy="13.0">Сумісність Incompat Flags</tspan><tspan x="475.0" dy="13.0">Контрольна сума CRC32C</tspan></text>
<rect x="635.0" y="300.0" width="285.0" height="54.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="777.5" y="317.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="700"><tspan x="777.5" dy="0.0">Помилка валідації (EINVAL):</tspan><tspan x="777.5" dy="13.0">«wrong fs type, bad option, bad superblock»</tspan><tspan x="777.5" dy="13.0">Пошкоджено сектор або несумісні прапорці</tspan></text>
<line x1="480.0" y1="365.0" x2="480.0" y2="390.0" stroke="#854d0e" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="25.0" y="390.0" width="910.0" height="85.0" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="480.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle" font-weight="700">4. ТРАНЗАКЦІЙНИЙ ЖУРНАЛ: JOURNAL REPLAY ТА УЗГОДЖЕНІСТЬ МЕТАДАНИХ</text>
<rect x="40.0" y="420.0" width="275.0" height="44.0" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/><text x="177.5" y="432.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="177.5" dy="0.0">Перевірка прапорця відновлення:</tspan><tspan x="177.5" dy="13.0">EXT4_FEATURE_INCOMPAT_RECOVER</tspan><tspan x="177.5" dy="13.0">або XFS log dirty check</tspan></text>
<rect x="335.0" y="420.0" width="280.0" height="44.0" rx="6" fill="#ffffff" stroke="#22c55e" stroke-width="1.5"/><text x="475.0" y="432.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="475.0" dy="0.0">Відтворення журналу (Journal Replay):</tspan><tspan x="475.0" dy="13.0">Програвання committed транзакцій</tspan><tspan x="475.0" dy="13.0">Оновлення метаданих на диску</tspan></text>
<rect x="635.0" y="420.0" width="285.0" height="44.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="777.5" y="432.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#b91c1c" text-anchor="middle" font-weight="700"><tspan x="777.5" dy="0.0">Помилка відновлення (EIO / EROFS):</tspan><tspan x="777.5" dy="13.0">Пошкоджений журнал блокує монтування</tspan><tspan x="777.5" dy="13.0">(потрібен fsck або -o ro,noload)</tspan></text>
<line x1="480.0" y1="475.0" x2="480.0" y2="500.0" stroke="#166534" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="25.0" y="500.0" width="910.0" height="95.0" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
<text x="480.0" y="518.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b21a8" text-anchor="middle" font-weight="700">5. ФІКСАЦІЯ ТОЧКИ МОНТУВАННЯ ТА СТВОРЕННЯ STRUCT VFSMOUNT</text>
<rect x="40.0" y="530.0" width="275.0" height="54.0" rx="6" fill="#ffffff" stroke="#a855f7" stroke-width="1.5"/><text x="177.5" y="547.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="177.5" dy="0.0">Створення struct vfsmount</tspan><tspan x="177.5" dy="13.0">Ініціалізація кореневого dentry:</tspan><tspan x="177.5" dy="13.0">sb-&gt;s_root (inode 2 для ext4)</tspan></text>
<rect x="335.0" y="530.0" width="280.0" height="54.0" rx="6" fill="#ffffff" stroke="#a855f7" stroke-width="1.5"/><text x="475.0" y="547.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="475.0" dy="0.0">Прикріплення до дерева простору:</tspan><tspan x="475.0" dy="13.0">attach_recursive_mnt()</tspan><tspan x="475.0" dy="13.0">Оновлення /proc/mounts</tspan></text>
<rect x="635.0" y="530.0" width="285.0" height="54.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="777.5" y="547.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="777.5" dy="0.0">Успіх операції:</tspan><tspan x="777.5" dy="13.0">Код повернення 0</tspan><tspan x="777.5" dy="13.0">ФС готова до операцій вводу-виводу</tspan></text>
</svg>