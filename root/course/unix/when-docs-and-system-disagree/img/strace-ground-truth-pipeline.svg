<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 850 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="850" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="420.0" y="24.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перехоплення системних викликів через strace: викриття реального стану</text>
<rect x="20.0" y="55.0" width="230.0" height="290.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<rect x="20.0" y="55.0" width="230.0" height="32.0" rx="6" fill="#64748b" stroke="#64748b" stroke-width="1.0"/>
<text x="135.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">Простір користувача</text>
<rect x="70.4" y="102.3" width="129.1" height="45.3" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="135.0" y="121.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="135.0" dy="0.0">Виконуваний файл</tspan><tspan x="135.0" dy="14.3">/usr/bin/my-app</tspan></text>
<rect x="45.2" y="183.5" width="179.6" height="43.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="135.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="135.0" dy="0.0">Запит відкриття файлу:</tspan><tspan x="135.0" dy="13.0">openat(AT_FDCWD, &quot;app.conf&quot;)</tspan></text>
<rect x="68.0" y="268.5" width="134.0" height="43.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="135.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="135.0" dy="0.0">Читання конфігурації</tspan><tspan x="135.0" dy="13.0">або вихід з помилкою</tspan></text>
<rect x="275.0" y="55.0" width="240.0" height="290.0" rx="6" fill="#fff5f5" stroke="#c0392b" stroke-width="1.5"/>
<rect x="275.0" y="55.0" width="240.0" height="32.0" rx="6" fill="#c0392b" stroke="#c0392b" stroke-width="1.0"/>
<text x="395.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">Ядро Linux (Механізм ptrace)</text>
<rect x="319.4" y="97.0" width="151.1" height="56.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="395.0" y="115.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="395.0" dy="0.0">1. Перехоплення входу:</tspan><tspan x="395.0" dy="13.0">PTRACE_SYSCALL_ENTRY</tspan><tspan x="395.0" dy="13.0">(зчитування аргументів)</tspan></text>
<rect x="305.2" y="177.0" width="179.6" height="56.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="395.0" y="195.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="395.0" dy="0.0">2. Реальне виконання VFS:</tspan><tspan x="395.0" dy="13.0">Пошук /etc/app.conf → ENOENT</tspan><tspan x="395.0" dy="13.0">Пошук ~/.config/... → OK</tspan></text>
<rect x="302.4" y="262.0" width="185.3" height="56.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="395.0" y="280.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="395.0" dy="0.0">3. Перехоплення виходу:</tspan><tspan x="395.0" dy="13.0">PTRACE_SYSCALL_EXIT</tspan><tspan x="395.0" dy="13.0">(перевірка коду return/errno)</tspan></text>
<rect x="540.0" y="55.0" width="280.0" height="290.0" rx="6" fill="#f0fbf4" stroke="#27ae60" stroke-width="1.5"/>
<rect x="540.0" y="55.0" width="280.0" height="32.0" rx="6" fill="#27ae60" stroke="#27ae60" stroke-width="1.0"/>
<text x="680.0" y="76.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700">Фактичний журнал strace</text>
<rect x="550.0" y="95.0" width="260.0" height="235.0" rx="4" fill="#1e293b" stroke="#0f172a" stroke-width="1.0"/>
<text x="558.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="start" font-weight="700">execve(&quot;/usr/bin/my-app&quot;, ...)</text>
<text x="558.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="start" font-weight="700">openat(AT_FDCWD, &quot;/etc/app.conf&quot;,</text>
<text x="558.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#f87171" text-anchor="start" font-weight="700">       O_RDONLY) = -1 ENOENT</text>
<text x="558.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="start" font-weight="700">openat(AT_FDCWD, &quot;/usr/share/app/def.conf&quot;,</text>
<text x="558.0" y="214.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#4ade80" text-anchor="start" font-weight="700">       O_RDONLY) = 3</text>
<text x="558.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="start" font-weight="700">fstat(3, {st_size=1024, ...}) = 0</text>
<text x="558.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#4ade80" text-anchor="start" font-weight="700">read(3, &quot;mode=fallback\n&quot;, 1024) = 14</text>
<text x="558.0" y="292.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#94a3b8" text-anchor="start" font-weight="700">close(3) = 0</text>
<line x1="220.0" y1="205.0" x2="275.0" y2="205.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="515.0" y1="205.0" x2="545.0" y2="205.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
