<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 480" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="480" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="940.0" height="450.0" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="480.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700">МЕХАНІКА АПАРАТНИХ БАР'ЄРІВ: FLUSH CACHE ПРОТИ FUA</text>
<rect x="25.0" y="60.0" width="440.0" height="385.0" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="245.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#991b1b" text-anchor="middle" font-weight="700">КОМАНДА FLUSH CACHE (СКИДАННЯ ВСЬОГО КЕШУ)</text>
<rect x="45.0" y="105.0" width="400.0" height="50.0" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/><text x="245.0" y="126.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Черга накопичувача (DRAM Cache):</tspan><tspan x="245.0" dy="14.3">[Запис 1] [Запис 2] [Запис 3] [Запис 4]</tspan></text>
<line x1="245.0" y1="155.0" x2="245.0" y2="180.0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="45.0" y="180.0" width="400.0" height="50.0" rx="6" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/><text x="245.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="700"><tspan x="245.0" dy="0.0">Надходить команда: SYNCHRONIZE CACHE / Flush (0x00)</tspan><tspan x="245.0" dy="13.0">Контролер блокує обробку нових команд!</tspan></text>
<line x1="245.0" y1="230.0" x2="245.0" y2="255.0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="45.0" y="255.0" width="400.0" height="55.0" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/><text x="245.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Примусовий запис УСІХ буферів у флеш:</tspan><tspan x="245.0" dy="13.0">Контролер записує 1, 2, 3, 4 у комірки NAND</tspan><tspan x="245.0" dy="13.0">Затримка сплеску: 2.0 – 15.0 мс</tspan></text>
<line x1="245.0" y1="310.0" x2="245.0" y2="335.0" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="45.0" y="335.0" width="400.0" height="95.0" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="1.5"/><text x="245.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">Особливості Flush:</tspan><tspan x="245.0" dy="13.0">• Скидає весь кеш, навіть чужі сторонні записи</tspan><tspan x="245.0" dy="13.0">• Створює високий хвіст затримок (P99/P99.9 latency spikes)</tspan><tspan x="245.0" dy="13.0">• Повна гарантія стійкості для всього накопичувача</tspan><tspan x="245.0" dy="13.0">• Стандартний шлях для системних викликів fsync()</tspan></text>
<rect x="495.0" y="60.0" width="440.0" height="385.0" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="715.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#166534" text-anchor="middle" font-weight="700">FUA: ПРАПОРЕЦЬ FORCE UNIT ACCESS ДЛЯ БЛОКА</text>
<rect x="515.0" y="105.0" width="400.0" height="50.0" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="715.0" y="126.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Черга накопичувача (DRAM Cache):</tspan><tspan x="715.0" dy="14.3">[Запис 1] [Запис 2] [Запис 3 (FUA = 1)]</tspan></text>
<line x1="715.0" y1="155.0" x2="715.0" y2="180.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="515.0" y="180.0" width="400.0" height="50.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/><text x="715.0" y="202.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle" font-weight="700"><tspan x="715.0" dy="0.0">Контролер обробляє біт FUA в дескрипторі NVMe:</tspan><tspan x="715.0" dy="13.0">Записи 1 і 2 лишаються в DRAM без скидання!</tspan></text>
<line x1="715.0" y1="230.0" x2="715.0" y2="255.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="515.0" y="255.0" width="400.0" height="55.0" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="715.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Запис на носій ЛИШЕ блока 3:</tspan><tspan x="715.0" dy="13.0">Запис 3 скеровується прямо у флеш (SLC/TLC)</tspan><tspan x="715.0" dy="13.0">Затримка операції: 0.15 – 0.40 мс</tspan></text>
<line x1="715.0" y1="310.0" x2="715.0" y2="335.0" stroke="#16a34a" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="515.0" y="335.0" width="400.0" height="95.0" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/><text x="715.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="715.0" dy="0.0">Особливості FUA:</tspan><tspan x="715.0" dy="13.0">• Не скидає чужі фонові записи з DRAM-кешу</tspan><tspan x="715.0" dy="13.0">• Не паралізує конвеєр команд контролера</tspan><tspan x="715.0" dy="13.0">• Дає стабільні низькі затримки коміту транзакцій</tspan><tspan x="715.0" dy="13.0">• Використовується в RWF_DSYNC та блокових чергах blk-mq</tspan></text>
</svg>