<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="900.0" height="400.0" rx="8" fill="#fafbfc" stroke="#d1d5db" stroke-width="1.5"/>
<text x="460.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм розв'язання компіляційних та лінкових залежностей через pkg-config</text>
<rect x="30.0" y="65.0" width="270.0" height="320.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="165.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Вихідний код програми</text>
<line x1="45.0" y1="104.0" x2="285.0" y2="104.0" stroke="#2457d6" stroke-width="1.0" stroke-dasharray="3,3"/>
<rect x="45.0" y="115.0" width="240.0" height="52.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="165.0" y="130.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">#include &lt;openssl/ssl.h&gt;</tspan><tspan x="165.0" dy="14.3">SSL_CTX_new(TLS_method());</tspan><tspan x="165.0" dy="14.3">Потребує API та символів бібліотеки</tspan></text>
<rect x="45.0" y="180.0" width="240.0" height="60.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="165.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="165.0" dy="0.0">Запит системи збірки:</tspan><tspan x="165.0" dy="13.0">pkg-config --cflags openssl</tspan><tspan x="165.0" dy="13.0">pkg-config --libs openssl</tspan><tspan x="165.0" dy="13.0">pkg-config --modversion openssl</tspan></text>
<rect x="45.0" y="255.0" width="240.0" height="115.0" rx="4" fill="#dbeafe" stroke="#2457d6" stroke-width="1.0"/>
<text x="165.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Каталоги пошуку .pc:</text>
<text x="55.0" y="295.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1. $PKG_CONFIG_PATH</text>
<text x="55.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2. /usr/lib/x86_64-linux-gnu/pkgconfig</text>
<text x="55.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">3. /usr/share/pkgconfig</text>
<text x="55.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">4. /usr/local/lib/pkgconfig</text>
<line x1="300.0" y1="220.0" x2="340.0" y2="220.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="350.0" y="65.0" width="250.0" height="320.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="475.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">Метадані: openssl.pc</text>
<line x1="365.0" y1="104.0" x2="585.0" y2="104.0" stroke="#d97706" stroke-width="1.0" stroke-dasharray="3,3"/>
<rect x="365.0" y="115.0" width="220.0" height="190.0" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/><text x="475.0" y="160.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="475.0" dy="0.0">prefix=/usr</tspan><tspan x="475.0" dy="11.7">exec_prefix=${prefix}</tspan><tspan x="475.0" dy="11.7">libdir=${exec_prefix}/lib/x86_64-linux-gnu</tspan><tspan x="475.0" dy="11.7">includedir=${prefix}/include</tspan><tspan x="475.0" dy="11.7"></tspan><tspan x="475.0" dy="11.7">Name: OpenSSL</tspan><tspan x="475.0" dy="11.7">Version: 3.0.13</tspan><tspan x="475.0" dy="11.7">Requires.private: libssl libcrypto</tspan><tspan x="475.0" dy="11.7">Cflags: -I${includedir}</tspan><tspan x="475.0" dy="11.7">Libs: -L${libdir} -lssl -lcrypto</tspan></text>
<rect x="365.0" y="315.0" width="220.0" height="55.0" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.0"/>
<text x="475.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="middle" font-weight="700">Постачальник .pc файлу:</text>
<text x="475.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Пакунок libssl-dev / openssl-devel</text>
<line x1="600.0" y1="220.0" x2="640.0" y2="220.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="650.0" y="65.0" width="240.0" height="320.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="770.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Ін'єкція прапорців</text>
<line x1="665.0" y1="104.0" x2="875.0" y2="104.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="3,3"/>
<rect x="665.0" y="115.0" width="210.0" height="75.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="770.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Фаза компіляції (gcc -c)</tspan><tspan x="770.0" dy="13.0">Cflags: -I/usr/include</tspan><tspan x="770.0" dy="13.0">-&gt; Знаходить openssl/ssl.h</tspan><tspan x="770.0" dy="13.0">(запобігає fatal error:</tspan><tspan x="770.0" dy="13.0">missing header)</tspan></text>
<rect x="665.0" y="200.0" width="210.0" height="80.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="770.0" y="219.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="770.0" dy="0.0">Фаза лінкування (gcc -o)</tspan><tspan x="770.0" dy="11.7">Libs: -L/usr/lib/... -lssl -lcrypto</tspan><tspan x="770.0" dy="11.7">-&gt; Розв'язує SSL_CTX_new</tspan><tspan x="770.0" dy="11.7">та додає DT_NEEDED</tspan><tspan x="770.0" dy="11.7">(запобігає undefined reference)</tspan></text>
<rect x="665.0" y="290.0" width="210.0" height="80.0" rx="4" fill="#dcfce7" stroke="#27ae60" stroke-width="1.0"/>
<text x="770.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Результат:</text>
<text x="770.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Бінарник зібрано успішно,</text>
<text x="770.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">динамічні лінки зафіксовано</text>
</svg>