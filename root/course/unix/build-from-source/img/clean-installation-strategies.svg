<text x="360.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Кілька паралельних версій</text>
<circle cx="350.0" cy="253.0" r="3.0" fill="#d97706" stroke="#d97706" stroke-width="1.5"/>
<text x="360.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Потребує налаштування PATH</text>
<rect x="340.0" y="320.0" width="240.0" height="45.0" rx="4" fill="#ffffff" stroke="#d97706" stroke-width="1.2"/>
<text x="460.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">Чистота / Автономність</text>
<rect x="620.0" y="65.0" width="270.0" height="320.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="755.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">3. Пакування через DESTDIR</text>
<text x="755.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">checkinstall або fpm -&gt; DEB/RPM</text>
<line x1="635.0" y1="120.0" x2="875.0" y2="120.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="3,3"/>
<circle cx="645.0" cy="141.0" r="3.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="655.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">make install DESTDIR=/tmp/stage</text>
<circle cx="645.0" cy="169.0" r="3.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="655.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">fpm генерує нативний *.deb / *.rpm</text>
<circle cx="645.0" cy="197.0" r="3.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="655.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Інсталяція через dpkg / rpm</text>
<circle cx="645.0" cy="225.0" r="3.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="655.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Повний облік у менеджері пакетів</text>
<circle cx="645.0" cy="253.0" r="3.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<text x="655.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Чисте видалення: apt remove</text>
<rect x="635.0" y="320.0" width="240.0" height="45.0" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="755.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Максимальна керованість</text>
