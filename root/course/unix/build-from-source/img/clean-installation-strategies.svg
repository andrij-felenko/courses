<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="900.0" height="400.0" rx="8" fill="#fafbfc" stroke="#d1d5db" stroke-width="1.5"/>
<text x="460.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порівняння стратегій встановлення скомпільованого ПЗ у Linux</text>
<rect x="30.0" y="65.0" width="270.0" height="320.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="165.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">1. Прямий make install</text>
<text x="165.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Небезпечний підхід</text>
<line x1="45.0" y1="120.0" x2="285.0" y2="120.0" stroke="#c0392b" stroke-width="1.0" stroke-dasharray="3,3"/>
<circle cx="55.0" cy="141.0" r="3.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="65.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Копіює у спільний /usr/local</text>
<circle cx="55.0" cy="169.0" r="3.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="65.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Змішує файли різних версій</text>
<circle cx="55.0" cy="197.0" r="3.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="65.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Немає реєстру встановленого</text>
<circle cx="55.0" cy="225.0" r="3.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="65.0" y="229.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">make uninstall часто відсутній</text>
<circle cx="55.0" cy="253.0" r="3.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="65.0" y="257.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Ризик зламати системні ліби</text>
<rect x="45.0" y="320.0" width="240.0" height="45.0" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="165.0" y="347.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Засмічення ОС / Високий ризик</text>
<rect x="325.0" y="65.0" width="270.0" height="320.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="460.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">2. Ізольований префікс</text>
<text x="460.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">--prefix=/opt/&lt;app&gt;</text>
<line x1="340.0" y1="120.0" x2="580.0" y2="120.0" stroke="#d97706" stroke-width="1.0" stroke-dasharray="3,3"/>
