<text x="360.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Всі файли в одній теці /opt/app</text>
<circle cx="350.0" cy="169.0" r="3.0" fill="#d97706" stroke="#d97706" stroke-width="1.5"/>
<text x="360.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">RUNPATH = $ORIGIN/../lib</text>
<circle cx="350.0" cy="197.0" r="3.0" fill="#d97706" stroke="#d97706" stroke-width="1.5"/>
<text x="360.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Видалення: rm -rf /opt/app</text>
