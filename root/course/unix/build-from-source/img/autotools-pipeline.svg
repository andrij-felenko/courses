<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 950 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="950" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="10.0" y="10.0" width="920.0" height="460.0" rx="8" fill="#fafbfc" stroke="#d1d5db" stroke-width="1.5"/>
<text x="470.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Конвеєр конфігурації, компіляції та інсталяції GNU Autotools</text>
<rect x="30.0" y="65.0" width="265.0" height="375.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="162.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">1. Вхідні дані релізу</text>
<text x="162.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Релізний архів (Tarball)</text>
<line x1="45.0" y1="122.0" x2="280.0" y2="122.0" stroke="#2457d6" stroke-width="1.0" stroke-dasharray="3,3"/>
<rect x="45.0" y="135.0" width="235.0" height="42.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="162.5" y="152.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="162.5" dy="0.0">configure (шел-скрипт)</tspan><tspan x="162.5" dy="14.3">Готовий зондувальник середовища</tspan></text>
<rect x="45.0" y="185.0" width="235.0" height="42.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="162.5" y="202.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="162.5" dy="0.0">Makefile.in / config.h.in</tspan><tspan x="162.5" dy="14.3">Шаблони правил та макросів</tspan></text>
<rect x="45.0" y="235.0" width="235.0" height="42.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="162.5" y="252.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="162.5" dy="0.0">Вихідний код (*.c, *.h)</tspan><tspan x="162.5" dy="14.3">Незмінні джерела програми</tspan></text>
<rect x="45.0" y="290.0" width="235.0" height="135.0" rx="4" fill="#dbeafe" stroke="#2457d6" stroke-width="1.0"/>
<text x="162.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Параметри запуску:</text>
<text x="55.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• --prefix=/opt/app (ціль FHS)</text>
<text x="55.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• --enable-feature / --with-lib</text>
<text x="55.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• CFLAGS='-O3 -march=native'</text>
<text x="55.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• PKG_CONFIG_PATH=/custom/lib</text>
<line x1="295.0" y1="220.0" x2="335.0" y2="220.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="315.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">./configure</text>
<rect x="345.0" y="65.0" width="265.0" height="375.0" rx="6" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
<text x="477.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#d97706" text-anchor="middle" font-weight="700">2. Зондування системи</text>
<text x="477.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Перевірка заголовків і компілятора</text>
<line x1="360.0" y1="122.0" x2="595.0" y2="122.0" stroke="#d97706" stroke-width="1.0" stroke-dasharray="3,3"/>
<rect x="360.0" y="135.0" width="235.0" height="52.0" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/><text x="477.5" y="151.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="477.5" dy="0.0">Зондування Toolchain</tspan><tspan x="477.5" dy="13.0">CC/CXX, прапорці, архітектура CPU,</tspan><tspan x="477.5" dy="13.0">наявність бібліотек через pkg-config</tspan></text>
<rect x="360.0" y="195.0" width="235.0" height="42.0" rx="6" fill="#ffffff" stroke="#fcd34d" stroke-width="1.5"/><text x="477.5" y="212.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="477.5" dy="0.0">Перевірка API та заголовків</tspan><tspan x="477.5" dy="14.3">sys/epoll.h, pthread, statx()</tspan></text>
<rect x="360.0" y="250.0" width="235.0" height="175.0" rx="4" fill="#fef3c7" stroke="#d97706" stroke-width="1.0"/>
<text x="477.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">Згенеровані артефакти:</text>
<rect x="370.0" y="282.0" width="215.0" height="38.0" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/><text x="477.5" y="297.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="477.5" dy="0.0">config.h</tspan><tspan x="477.5" dy="14.3">#define HAVE_SYS_EPOLL_H 1</tspan></text>
<rect x="370.0" y="326.0" width="215.0" height="38.0" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/><text x="477.5" y="341.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="477.5" dy="0.0">Makefile</tspan><tspan x="477.5" dy="14.3">Підставлені CC, CFLAGS, PREFIX</tspan></text>
<rect x="370.0" y="370.0" width="215.0" height="42.0" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/><text x="477.5" y="388.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="477.5" dy="0.0">config.log</tspan><tspan x="477.5" dy="13.0">Повний лог для діагностики помилок</tspan></text>
<line x1="610.0" y1="220.0" x2="650.0" y2="220.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="630.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">make</text>
<rect x="660.0" y="65.0" width="250.0" height="375.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="785.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">3. Збірка та розкладка</text>
<text x="785.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">make -j$(nproc) та make install</text>
<line x1="675.0" y1="122.0" x2="895.0" y2="122.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="3,3"/>
<rect x="675.0" y="135.0" width="220.0" height="48.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="785.0" y="148.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">make -j$(nproc)</tspan><tspan x="785.0" dy="14.3">Компіляція *.c -&gt; *.o</tspan><tspan x="785.0" dy="14.3">Лінкування в ELF бінарник</tspan></text>
<rect x="675.0" y="192.0" width="220.0" height="42.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="785.0" y="209.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="785.0" dy="0.0">Тестування (make check)</tspan><tspan x="785.0" dy="14.3">Прогін локальних тестів</tspan></text>
<rect x="675.0" y="245.0" width="220.0" height="180.0" rx="4" fill="#dcfce7" stroke="#27ae60" stroke-width="1.0"/>
<text x="785.0" y="265.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Розкладка за FHS:</text>
<text x="685.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• $PREFIX/bin (виконувані файли)</text>
<text x="685.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• $PREFIX/lib (*.so, *.a бібліотеки)</text>
<text x="685.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• $PREFIX/include (*.h заголовки)</text>
<text x="685.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• $PREFIX/share/man (довідка)</text>
<line x1="685.0" y1="360.0" x2="885.0" y2="360.0" stroke="#27ae60" stroke-width="1.0" stroke-dasharray="2,2"/>
<text x="785.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Пакетна ізоляція:</text>
<text x="685.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">make install DESTDIR=/tmp/stage</text>
<text x="685.0" y="414.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">-&gt; безпечне створення DEB/RPM</text>
<line x1="50.0" y1="455.0" x2="890.0" y2="455.0" stroke="#333333" stroke-width="1.2"/>
<line x1="870.0" y1="455.0" x2="895.0" y2="455.0" stroke="#333333" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="470.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#333333" text-anchor="middle" font-weight="700">Послідовність виконання: Конфігурація -&gt; Паралельна компіляція -&gt; Інсталяція за FHS</text>
</svg>