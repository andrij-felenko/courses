<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чотири концентричні шари ізоляції та обмежень служби systemd</text>
<rect x="35.0" y="65.0" width="230.0" height="310.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.4"/><text x="150.0" y="188.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="150.0" dy="0.0">1. Ідентичність та облікові записи</tspan><tspan x="150.0" dy="14.3">User=, Group=</tspan><tspan x="150.0" dy="14.3">DynamicUser=yes</tspan><tspan x="150.0" dy="14.3">SupplementaryGroups=</tspan><tspan x="150.0" dy="14.3">UID/GID з пулу 61184..65519</tspan><tspan x="150.0" dy="14.3">Повна втрата доступу до /home/user</tspan></text>
<rect x="285.0" y="65.0" width="235.0" height="310.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.4"/><text x="402.5" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="402.5" dy="0.0">2. Простори назв файлової системи</tspan><tspan x="402.5" dy="13.0">PrivateTmp=yes (ізольований /tmp)</tspan><tspan x="402.5" dy="13.0">ProtectSystem=strict (/usr, /etc - RO)</tspan><tspan x="402.5" dy="13.0">ProtectHome=yes (/home недоступний)</tspan><tspan x="402.5" dy="13.0">ReadOnlyPaths=, ReadWritePaths=</tspan><tspan x="402.5" dy="13.0">Захист від несанкціонованого запису</tspan></text>
<rect x="540.0" y="65.0" width="235.0" height="310.0" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.4"/><text x="657.5" y="191.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="657.5" dy="0.0">3. Ресурсні обмеження та cgroups</tspan><tspan x="657.5" dy="13.0">LimitNOFILE=65535 (дескриптори)</tspan><tspan x="657.5" dy="13.0">LimitNPROC= (кількість потоків)</tspan><tspan x="657.5" dy="13.0">MemoryMax= (жорсткий OOM-поріг)</tspan><tspan x="657.5" dy="13.0">CPUQuota= (ліміт процесорного часу)</tspan><tspan x="657.5" dy="13.0">TasksMax= (захист від fork-бомб)</tspan></text>
<rect x="795.0" y="65.0" width="230.0" height="310.0" rx="6" fill="#f5eef8" stroke="#8e44ad" stroke-width="1.4"/><text x="910.0" y="193.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">4. Фільтрація викликів та привілеїв</tspan><tspan x="910.0" dy="11.7">NoNewPrivileges=yes (блокування SUID)</tspan><tspan x="910.0" dy="11.7">CapabilityBoundingSet= (зняття CAP_*)</tspan><tspan x="910.0" dy="11.7">SystemCallFilter=@system-service</tspan><tspan x="910.0" dy="11.7">ProtectKernelTunables=yes (/proc, /sys)</tspan><tspan x="910.0" dy="11.7">RestrictAddressFamilies=AF_UNIX AF_INET</tspan></text>
<line x1="265.0" y1="220.0" x2="285.0" y2="220.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="520.0" y1="220.0" x2="540.0" y2="220.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="775.0" y1="220.0" x2="795.0" y2="220.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="35.0" y="390.0" width="990.0" height="50.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="530.0" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ядро Linux застосовує всі конфігурації пісочниці під час fork() перед виконанням execve().</text>
<text x="530.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Будь-яка невідповідність коду вимогам пісочниці спричиняє негайну помилку EPERM, EACCES або EROFS.</text>
</svg>