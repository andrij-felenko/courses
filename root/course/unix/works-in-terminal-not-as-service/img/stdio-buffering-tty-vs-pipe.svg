<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 440" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="440" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Режими буферизації стандартної бібліотеки C (glibc stdio)</text>
<rect x="30.0" y="55.0" width="455.0" height="345.0" rx="8" fill="#eef7f0" stroke="#27ae60" stroke-width="1.6"/>
<text x="257.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Термінал (isatty(1) == 1): _IOLBF</text>
<text x="257.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Рядкова буферизація (Line Buffered)</text>
<rect x="50.0" y="125.0" width="415.0" height="60.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="257.5" y="151.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="257.5" dy="0.0">printf(&quot;Starting server...\n&quot;);</tspan><tspan x="257.5" dy="14.3">Зустрінуто символ перенесення рядка '\n'</tspan></text>
<line x1="257.0" y1="190.0" x2="257.0" y2="215.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="220.0" width="415.0" height="65.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="257.5" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="257.5" dy="0.0">glibc stdio негайно виконує системний виклик:</tspan><tspan x="257.5" dy="14.3">write(1, &quot;Starting server...\n&quot;, 19)</tspan><tspan x="257.5" dy="14.3">Буфер очищається після кожного рядка</tspan></text>
<line x1="257.0" y1="290.0" x2="257.0" y2="315.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="50.0" y="320.0" width="415.0" height="60.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.4"/><text x="257.5" y="346.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="257.5" dy="0.0">Результат: Рядок миттєво з'являється</tspan><tspan x="257.5" dy="14.3">на екрані користувача в емуляторі термінала</tspan></text>
<rect x="515.0" y="55.0" width="455.0" height="345.0" rx="8" fill="#fdeeec" stroke="#c0392b" stroke-width="1.6"/>
<text x="742.0" y="85.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Служба systemd (isatty(1) == 0): _IOFBF</text>
<text x="742.0" y="107.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-style="italic">Повна блокова буферизація (Block Buffered, 4096 байтів)</text>
<rect x="535.0" y="125.0" width="415.0" height="60.0" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.2"/><text x="742.5" y="151.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="742.5" dy="0.0">printf(&quot;Starting server...\n&quot;);</tspan><tspan x="742.5" dy="14.3">Символ '\n' ігнорується, байти осідають у буфері</tspan></text>
<line x1="742.0" y1="190.0" x2="742.0" y2="215.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="535.0" y="220.0" width="415.0" height="65.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/><text x="742.5" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="742.5" dy="0.0">glibc НЕ робить системний виклик write(1, ...)</tspan><tspan x="742.5" dy="14.3">Повідомлення затримуються в пам'яті процесу,</tspan><tspan x="742.5" dy="14.3">доки обсяг даних не досягне 4096 байтів</tspan></text>
<line x1="742.0" y1="290.0" x2="742.0" y2="315.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="535.0" y="320.0" width="415.0" height="60.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.4"/><text x="742.5" y="346.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="742.5" dy="0.0">Пастка: якщо процес падає (SIGSEGV/OOM/abort),</tspan><tspan x="742.5" dy="14.3">нескинуті логи втрачаються назавжди без запису в journald</tspan></text>
</svg>