<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Контекст виконання процесу: Інтерактивний термінал проти фонової служби systemd</text>
<rect x="30.0" y="50.0" width="470.0" height="440.0" rx="8" fill="#fcfdfe" stroke="#2457d6" stroke-width="1.8"/>
<text x="265.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Інтерактивний сеанс (Bash / Zsh у TTY)</text>
<rect x="50.0" y="98.0" width="430.0" height="80.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.2"/><text x="265.0" y="120.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">1. Змінні оточення (envp)</tspan><tspan x="265.0" dy="14.3">• Повний набір (80+ змінних з ~/.bashrc)</tspan><tspan x="265.0" dy="14.3">• $PATH: містить ~/.cargo/bin, venv, nvm</tspan><tspan x="265.0" dy="14.3">• $HOME, $USER, $DISPLAY, $XDG_RUNTIME_DIR</tspan></text>
<rect x="50.0" y="192.0" width="430.0" height="80.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.2"/><text x="265.0" y="214.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">2. Робочий каталог (CWD)</tspan><tspan x="265.0" dy="14.3">• task_struct-&gt;fs-&gt;pwd = поточна тека проєкту</tspan><tspan x="265.0" dy="14.3">• Відносні шляхи (./config.yaml) знаходять файл</tspan><tspan x="265.0" dy="14.3">• Права запису у поточний каталог користувача</tspan></text>
<rect x="50.0" y="286.0" width="430.0" height="80.0" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.2"/><text x="265.0" y="308.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">3. Стандартні потоки вводу / виводу</tspan><tspan x="265.0" dy="14.3">• FDs 0, 1, 2 прив'язані до TTY (/dev/pts/X)</tspan><tspan x="265.0" dy="14.3">• isatty(0) == 1 (доступний ввід пароля)</tspan><tspan x="265.0" dy="14.3">• stdout: рядкова буферизація (_IOLBF, скидання по \n)</tspan></text>
<rect x="50.0" y="380.0" width="430.0" height="80.0" rx="6" fill="#f5eef8" stroke="#8e44ad" stroke-width="1.2"/><text x="265.0" y="402.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="265.0" dy="0.0">4. Привілеї та обмеження</tspan><tspan x="265.0" dy="14.3">• Користувач UID 1000 (повний доступ до свого $HOME)</tspan><tspan x="265.0" dy="14.3">• Загальний простір імен /tmp разом із десктопом</tspan><tspan x="265.0" dy="14.3">• Дефолтні ліміти сеансу (дескриптори, пам'ять)</tspan></text>
<rect x="540.0" y="50.0" width="470.0" height="440.0" rx="8" fill="#fffbfb" stroke="#c0392b" stroke-width="1.8"/>
<text x="775.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Фонова служба (systemd PID 1)</text>
<rect x="560.0" y="98.0" width="430.0" height="80.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.2"/><text x="775.0" y="120.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">1. Змінні оточення (envp)</tspan><tspan x="775.0" dy="14.3">• Стерильне середовище (немає .bashrc)</tspan><tspan x="775.0" dy="14.3">• Мінімальний $PATH (/usr/bin:/bin)</tspan><tspan x="775.0" dy="14.3">• $HOME, $USER, $DISPLAY ВІДСУТНІ</tspan></text>
<rect x="560.0" y="192.0" width="430.0" height="80.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.2"/><text x="775.0" y="214.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">2. Робочий каталог (CWD)</tspan><tspan x="775.0" dy="14.3">• task_struct-&gt;fs-&gt;pwd = / (корінь)</tspan><tspan x="775.0" dy="14.3">• Відносні шляхи шукають /config.yaml -&gt; ENOENT</tspan><tspan x="775.0" dy="14.3">• Потрібна директива WorkingDirectory=</tspan></text>
<rect x="560.0" y="286.0" width="430.0" height="80.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.2"/><text x="775.0" y="308.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">3. Стандартні потоки вводу / виводу</tspan><tspan x="775.0" dy="14.3">• FD 0 -&gt; /dev/null, FDs 1, 2 -&gt; journald socket</tspan><tspan x="775.0" dy="14.3">• isatty(0) == 0 (інтерактивні запити зависають)</tspan><tspan x="775.0" dy="14.3">• stdout: блокова буферизація (_IOFBF, 4096 байтів)</tspan></text>
<rect x="560.0" y="380.0" width="430.0" height="80.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.2"/><text x="775.0" y="402.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="775.0" dy="0.0">4. Привілеї та пісочниця</tspan><tspan x="775.0" dy="14.3">• DynamicUser= / User=app (немає доступу до /home)</tspan><tspan x="775.0" dy="14.3">• PrivateTmp=yes (ізольований простір імен /tmp)</tspan><tspan x="775.0" dy="14.3">• ProtectSystem=strict, жорсткі cgroup-ліміти</tspan></text>
</svg>