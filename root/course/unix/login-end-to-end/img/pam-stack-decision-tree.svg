<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 910 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="910" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Логіка обчислення результатів у модульному стеку PAM</text>
<rect x="30.0" y="60.0" width="410.0" height="130.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="45.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">Прапорець: required (Обов'язковий)</text>
<line x1="45.0" y1="96.0" x2="425.0" y2="96.0" stroke="#c0392b" stroke-width="1.0"/>
<text x="45.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="45.0" dy="0.0">У разі помилки: позначає стек як невдалий,</tspan><tspan x="45.0" dy="14.9">але ПРОДОВЖУЄ виконання наступних модулів.</tspan><tspan x="45.0" dy="14.9">Приховує від зловмисника точку відмови.</tspan></text>
<rect x="470.0" y="60.0" width="410.0" height="130.0" rx="6" fill="#fbeee6" stroke="#e67e22" stroke-width="1.5"/>
<text x="485.0" y="86.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#e67e22" text-anchor="start" font-weight="700">Прапорець: requisite (Критичний)</text>
<line x1="485.0" y1="96.0" x2="865.0" y2="96.0" stroke="#e67e22" stroke-width="1.0"/>
<text x="485.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="485.0" dy="0.0">У разі помилки: НЕГАЙНО перериває стек</tspan><tspan x="485.0" dy="14.9">і повертає помилку застосунку.</tspan><tspan x="485.0" dy="14.9">Швидкий вихід без зайвих перевірок.</tspan></text>
<rect x="30.0" y="210.0" width="410.0" height="130.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="45.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">Прапорець: sufficient (Достатній)</text>
<line x1="45.0" y1="246.0" x2="425.0" y2="246.0" stroke="#27ae60" stroke-width="1.0"/>
<text x="45.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="45.0" dy="0.0">У разі успіху: якщо попередні required успішні,</tspan><tspan x="45.0" dy="14.9">НЕГАЙНО завершує фазу з успіхом.</tspan><tspan x="45.0" dy="14.9">Дозволяє альтернативні гілки входу.</tspan></text>
<rect x="470.0" y="210.0" width="410.0" height="130.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="485.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">Прапорець: optional (Опціональний)</text>
<line x1="485.0" y1="246.0" x2="865.0" y2="246.0" stroke="#2457d6" stroke-width="1.0"/>
<text x="485.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start"><tspan x="485.0" dy="0.0">Результат враховується ЛИШЕ тоді, коли в фазі</tspan><tspan x="485.0" dy="14.9">немає інших модулів (required/sufficient).</tspan><tspan x="485.0" dy="14.9">Використовується для додаткових дій.</tspan></text>
<rect x="30.0" y="350.0" width="840.0" height="72.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/>
<text x="45.0" y="372.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">Розширений синтаксис дій: [success=N new_authtok_reqd=ok default=bad]</text>
<text x="45.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Дозволяє стрибки через N рядків (jump), скидання накопиченого статусу (reset) та явне ігнорування (ignore).</text>
<text x="45.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Механізми include та substack забезпечують модульну композицію політик з /etc/pam.d/common-* та system-auth.</text>
</svg>