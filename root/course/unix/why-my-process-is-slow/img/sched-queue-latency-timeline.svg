<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1070 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1070" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="530.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Шкала виконання задачі та місця виникнення затримок</text>
<rect x="40.0" y="20.0" width="980.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="530.0" y="42.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="530.0" dy="0.0">Життєвий цикл операції на часовій шкалі ядра: де виникає затримка</tspan></text>
<line x1="60.0" y1="140.0" x2="1010.0" y2="140.0" stroke="#333333" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="1010.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end" font-weight="700">Час (Wall-clock)</text>
<rect x="80.0" y="80.0" width="140.0" height="48.0" rx="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.3"/>
<text x="150.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Off-CPU: Сон (S)
(чекає сокета)</text>
<circle cx="220.0" cy="140.0" r="5.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<line x1="220.0" y1="140.0" x2="220.0" y2="195.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="220.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Подія пробудження
(пакет у сокеті)</text>
<rect x="220.0" y="80.0" width="180.0" height="48.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="310.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Затримка в черзі</text>
<text x="310.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">(Runqueue Latency)</text>
<circle cx="400.0" cy="140.0" r="5.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<line x1="400.0" y1="140.0" x2="400.0" y2="195.0" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="400.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Context switch:
початок на ядрі</text>
<rect x="400.0" y="80.0" width="160.0" height="48.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="480.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">On-CPU: User (%usr)</text>
<text x="480.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Обробка запиту</text>
<circle cx="560.0" cy="140.0" r="5.0" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
<line x1="560.0" y1="140.0" x2="560.0" y2="195.0" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="560.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Системний виклик
(read / fsync)</text>
<rect x="560.0" y="80.0" width="140.0" height="48.0" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="630.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">On-CPU: System (%sys)</text>
<text x="630.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">VFS / драйвер</text>
<circle cx="700.0" cy="140.0" r="5.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<line x1="700.0" y1="140.0" x2="700.0" y2="195.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="700.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Добровільне перемикання
(TASK_UNINTERRUPTIBLE)</text>
<rect x="700.0" y="80.0" width="170.0" height="48.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="785.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Off-CPU: I/O Wait (D)</text>
<text x="785.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">Очікування диска</text>
<circle cx="870.0" cy="140.0" r="5.0" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
<line x1="870.0" y1="140.0" x2="870.0" y2="195.0" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3 3"/>
<text x="870.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Переривання DMA:
дані готові</text>
<rect x="870.0" y="80.0" width="110.0" height="48.0" rx="4" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/>
<text x="925.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">On-CPU</text>
<text x="925.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">Відповідь</text>
<rect x="40.0" y="260.0" width="980.0" height="230.0" rx="6" fill="#fbfcff" stroke="#6b7280" stroke-width="1.3"/><text x="530.0" y="328.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="530.0" dy="0.0">КЛЮЧОВІ ВИСНОВКИ ДЛЯ АНАЛІЗУ ЗАТРИМОК:</tspan><tspan x="530.0" dy="14.3"></tspan><tspan x="530.0" dy="14.3">• Загальний час операції = Час_на_CPU + Час_у_черзі + Час_очікування_I/O + Час_блокувань.</tspan><tspan x="530.0" dy="14.3">• Стандартні утиліти (top) показують лише On-CPU (%usr, %sys). Якщо операція триває 1000 мс, а CPU спожито лише 20 мс,</tspan><tspan x="530.0" dy="14.3">  98% затримки знаходиться в Off-CPU фазах, які звичайний CPU-профайлер взагалі не фіксує.</tspan><tspan x="530.0" dy="14.3">• Затримка в черзі (Runqueue Latency) — це симптом черги планувальника: задача повністю готова бігти, але процесор зайнятий.</tspan><tspan x="530.0" dy="14.3">• Добровільні перемикання (voluntary_ctxt_switches) свідчать про те, що задача сама поступилася процесором через I/O або м'ютекс.</tspan><tspan x="530.0" dy="14.3">• Примусові перемикання (nonvoluntary_ctxt_switches) показують, що задачу витіснив таймер ядра або важливіший процес.</tspan></text>
</svg>