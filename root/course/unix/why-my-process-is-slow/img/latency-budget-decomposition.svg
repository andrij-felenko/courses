<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1050 590" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1050" height="590" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="520.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Декомпозиція часу виконання процесу</text>
<rect x="280.0" y="24.0" width="480.0" height="44.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.0"/><text x="520.0" y="50.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="520.0" dy="0.0">Астрономічний час операції (Wall-Clock Time)</tspan></text>
<line x1="520.0" y1="68.0" x2="250.0" y2="110.0" stroke="#333333" stroke-width="1.8"/>
<rect x="70.0" y="110.0" width="360.0" height="48.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="250.0" y="130.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="250.0" dy="0.0">On-CPU: задача на ядрі</tspan><tspan x="250.0" dy="15.6">(виконує інструкції, стан TASK_RUNNING)</tspan></text>
<line x1="250.0" y1="158.0" x2="150.0" y2="195.0" stroke="#27ae60" stroke-width="1.4"/>
<line x1="250.0" y1="158.0" x2="350.0" y2="195.0" stroke="#27ae60" stroke-width="1.4"/>
<rect x="40.0" y="195.0" width="200.0" height="100.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.4"/><text x="140.0" y="213.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">User Time (%usr)</tspan><tspan x="140.0" dy="14.3"></tspan><tspan x="140.0" dy="14.3">• Код застосунку</tspan><tspan x="140.0" dy="14.3">• Бібліотеки, парсинг</tspan><tspan x="140.0" dy="14.3">• Алгоритмічні цикли</tspan><tspan x="140.0" dy="14.3">• Промахи кеша L1/L3</tspan></text>
<rect x="260.0" y="195.0" width="200.0" height="100.0" rx="6" fill="#fff" stroke="#27ae60" stroke-width="1.4"/><text x="360.0" y="213.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="360.0" dy="0.0">System Time (%sys)</tspan><tspan x="360.0" dy="14.3"></tspan><tspan x="360.0" dy="14.3">• Системні виклики</tspan><tspan x="360.0" dy="14.3">• Менеджмент пам'яті</tspan><tspan x="360.0" dy="14.3">• Page faults (minflt)</tspan><tspan x="360.0" dy="14.3">• Обробка мережі/VFS</tspan></text>
<line x1="520.0" y1="68.0" x2="770.0" y2="110.0" stroke="#333333" stroke-width="1.8"/>
<rect x="590.0" y="110.0" width="360.0" height="48.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="770.0" y="130.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="770.0" dy="0.0">Off-CPU: задача не на процесорі</tspan><tspan x="770.0" dy="15.6">(чекає ядра або зовнішньої події)</tspan></text>
<line x1="770.0" y1="158.0" x2="550.0" y2="195.0" stroke="#c0392b" stroke-width="1.4"/>
<line x1="770.0" y1="158.0" x2="710.0" y2="195.0" stroke="#c0392b" stroke-width="1.4"/>
<line x1="770.0" y1="158.0" x2="870.0" y2="195.0" stroke="#c0392b" stroke-width="1.4"/>
<rect x="480.0" y="195.0" width="150.0" height="150.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.3"/><text x="555.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="555.0" dy="0.0">Черга планувальника</tspan><tspan x="555.0" dy="13.0">(Runqueue Latency)</tspan><tspan x="555.0" dy="13.0"></tspan><tspan x="555.0" dy="13.0">• Готова до роботи</tspan><tspan x="555.0" dy="13.0">• Але ядра зайняті</tspan><tspan x="555.0" dy="13.0">• Брак квантів часу</tspan><tspan x="555.0" dy="13.0">• Перевантаження CPU</tspan><tspan x="555.0" dy="13.0">• schedstat[1]</tspan></text>
<rect x="645.0" y="195.0" width="160.0" height="150.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.3"/><text x="725.0" y="228.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">Очікування I/O та пам'яті</tspan><tspan x="725.0" dy="13.0">(TASK_UNINTERRUPTIBLE)</tspan><tspan x="725.0" dy="13.0"></tspan><tspan x="725.0" dy="13.0">• Читання/запис диска</tspan><tspan x="725.0" dy="13.0">• Major page faults</tspan><tspan x="725.0" dy="13.0">• Очікування сокетів</tspan><tspan x="725.0" dy="13.0">• Буфери драйверів</tspan><tspan x="725.0" dy="13.0">• Свопінг сторінок</tspan></text>
<rect x="820.0" y="195.0" width="180.0" height="150.0" rx="6" fill="#fff" stroke="#c0392b" stroke-width="1.3"/><text x="910.0" y="232.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="910.0" dy="0.0">Синхронізація й квоти</tspan><tspan x="910.0" dy="11.7">(TASK_INTERRUPTIBLE)</tspan><tspan x="910.0" dy="11.7"></tspan><tspan x="910.0" dy="11.7">• Блокування м'ютексів</tspan><tspan x="910.0" dy="11.7">• Очікування futex / каналів</tspan><tspan x="910.0" dy="11.7">• Замороження cgroups (cpu.max)</tspan><tspan x="910.0" dy="11.7">• sleep() / таймери</tspan><tspan x="910.0" dy="11.7">• Добровільні перемикання</tspan></text>
<rect x="40.0" y="375.0" width="960.0" height="175.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/><text x="520.0" y="430.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="520.0" dy="0.0">МАТРИЦЯ ДІАГНОСТИКИ СТАНІВ:</tspan><tspan x="520.0" dy="14.3"></tspan><tspan x="520.0" dy="14.3">1. On-CPU (високий %CPU): діагностуємо профілювальником стека (perf record -g, perf top) або лічильником викликів (strace -c).</tspan><tspan x="520.0" dy="14.3">2. Runqueue Latency (%CPU низький, r у vmstat &gt; кількості ядер): брак обчислювальної потужності або занижений пріоритет (pidstat -w, schedstat).</tspan><tspan x="520.0" dy="14.3">3. I/O Wait (задача в D, %iowait високий): затримка сховища, брак пропускної здатності диска чи мережі (iostat -xz 1, pidstat -d).</tspan><tspan x="520.0" dy="14.3">4. Sync / Locks / Sleep (задача в S, %CPU біля нуля): блокування всередині коду чи викликів сервісів (offcputime, pstack, perf sched).</tspan></text>
</svg>