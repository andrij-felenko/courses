<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1190 790" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1190" height="790" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="590.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія субреперів та перепідпорядкування сиріт</text>
<text x="590.0" y="38.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Ієрархія перепідпорядкування сиріт та механізм subreaper</text>
<text x="280.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Класична схема: перепідпорядкування на PID 1</text>
<rect x="80.0" y="110.0" width="400.0" height="80.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.6"/><text x="280.0" y="146.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">PID 1 (init / systemd)</tspan><tspan x="280.0" dy="16.2">Головний процес системи, глобальний прибирач</tspan></text>
<rect x="80.0" y="250.0" width="400.0" height="80.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.6"/><text x="280.0" y="286.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Процес-Батько (PID 1050)</tspan><tspan x="280.0" dy="16.2">Створює дочірній процес і раптово завершується</tspan></text>
<rect x="80.0" y="400.0" width="400.0" height="80.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.6"/><text x="280.0" y="436.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Процес-Сирота (PID 1051)</tspan><tspan x="280.0" dy="16.2">Працює у фоні; батька 1050 вже не існує</tspan></text>
<line x1="280.0" y1="190.0" x2="280.0" y2="250.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="280.0" y1="330.0" x2="280.0" y2="400.0" stroke="#333333" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="80.0" y1="290.0" x2="40.0" y2="290.0" stroke="#c0392b" stroke-width="1.8"/>
<line x1="40.0" y1="290.0" x2="40.0" y2="150.0" stroke="#c0392b" stroke-width="1.8"/>
<line x1="40.0" y1="150.0" x2="80.0" y2="150.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="60.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">reparent</text>
<text x="880.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Сучасна схема: перехоплення субрепером</text>
<rect x="680.0" y="110.0" width="400.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#c8ced6" stroke-width="1.3"/><text x="880.0" y="141.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">PID 1 (system systemd)</tspan><tspan x="880.0" dy="15.6">Глобальний прибирач (не навантажується сиротами сесій)</tspan></text>
<rect x="680.0" y="220.0" width="400.0" height="90.0" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.6"/><text x="880.0" y="253.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">Субрепер (systemd --user / container runtime / tmux)</tspan><tspan x="880.0" dy="15.6">Оголосив себе через prctl(PR_SET_CHILD_SUBREAPER, 1)</tspan><tspan x="880.0" dy="15.6">Збирає всіх сиріт у межах власного дерева</tspan></text>
<rect x="680.0" y="350.0" width="400.0" height="70.0" rx="6" fill="#fdeeec" stroke="#c0392b" stroke-width="1.5"/><text x="880.0" y="381.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">Проміжний процес / воркер (PID 2400)</tspan><tspan x="880.0" dy="15.6">Створює дитину й завершується</tspan></text>
<rect x="680.0" y="460.0" width="400.0" height="70.0" rx="6" fill="#eef3fb" stroke="#2457d6" stroke-width="1.5"/><text x="880.0" y="491.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="880.0" dy="0.0">Дочірня сирота (PID 2401)</tspan><tspan x="880.0" dy="15.6">Перепідпорядковується найближчому субреперу</tspan></text>
<line x1="880.0" y1="180.0" x2="880.0" y2="220.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="880.0" y1="310.0" x2="880.0" y2="350.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="880.0" y1="420.0" x2="880.0" y2="460.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="680.0" y1="495.0" x2="630.0" y2="495.0" stroke="#d4ac0d" stroke-width="1.8"/>
<line x1="630.0" y1="495.0" x2="630.0" y2="265.0" stroke="#d4ac0d" stroke-width="1.8"/>
<line x1="630.0" y1="265.0" x2="680.0" y2="265.0" stroke="#d4ac0d" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="650.0" y="380.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d4ac0d" text-anchor="middle">reparent</text>
<rect x="80.0" y="570.0" width="1000.0" height="170.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="580.0" y="618.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="580.0" dy="0.0">ЯК СУБРЕПЕР ПРИБИРАЄ СИРІТ:</tspan><tspan x="580.0" dy="16.2"></tspan><tspan x="580.0" dy="16.2">1. Сирота перепідпорядковується найближчому живому предку з прапорцем is_child_subreaper.</tspan><tspan x="580.0" dy="16.2">2. Коли сирота помирає, субрепер отримує сигнал SIGCHLD.</tspan><tspan x="580.0" dy="16.2">3. Головний цикл подій субрепера (наприклад, epoll у systemd) викликає waitpid(-1, &amp;st, WNOHANG) у циклі.</tspan><tspan x="580.0" dy="16.2">4. Зомбі миттєво знищується, ізоляція сесії/контейнера не порушується, PID 1 не перевантажується.</tspan></text>
</svg>