<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="940.0" height="520.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="490.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">ДВА ШЛЯХИ ОБЛІКУ ДИСКОВОГО ПРОСТОРУ: СУПЕРБЛОК ПРОТИ ДЕРЕВА КАТАЛОГІВ</text>
<rect x="40.0" y="75.0" width="430.0" height="445.0" rx="6" fill="#ffffff" stroke="#3b82f6" stroke-width="1.6"/>
<text x="255.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1d4ed8" text-anchor="middle" font-weight="700">УТИЛІТА df (Disk Free)</text>
<text x="255.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-style="italic">Системний виклик statvfs() / statfs()</text>
<rect x="55.0" y="138.0" width="400.0" height="60.0" rx="6" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/><text x="255.0" y="157.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">Запит до ядра VFS:</tspan><tspan x="255.0" dy="14.3">vfs_statfs() ──&gt; sb-&gt;s_op-&gt;statfs()</tspan><tspan x="255.0" dy="14.3">Миттєве опитування структури суперблока</tspan></text>
<line x1="255.0" y1="198.0" x2="255.0" y2="222.0" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="55.0" y="222.0" width="400.0" height="80.0" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/><text x="255.0" y="245.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">Суперблок файлової системи (struct super_block)</tspan><tspan x="255.0" dy="13.7">• Глобальна бітова карта виділення блоків</tspan><tspan x="255.0" dy="13.7">• Лічильники: s_free_blocks_count, s_free_inodes_count</tspan><tspan x="255.0" dy="13.7">• Облік резерву суперкористувача (s_r_blocks_count)</tspan></text>
<line x1="255.0" y1="302.0" x2="255.0" y2="326.0" stroke="#3b82f6" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="55.0" y="326.0" width="400.0" height="85.0" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="255.0" y="344.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle"><tspan x="255.0" dy="0.0">Що бачить df:</tspan><tspan x="255.0" dy="13.7">[+] Усі зайняті блоки носія (100% заповнення)</tspan><tspan x="255.0" dy="13.7">[+] Відкриті видалені файли ((deleted) втримують блоки)</tspan><tspan x="255.0" dy="13.7">[+] Приховані дані під точками монтування</tspan><tspan x="255.0" dy="13.7">[+] Резерв 5% root (f_bavail &lt; f_bfree)</tspan></text>
<rect x="55.0" y="420.0" width="400.0" height="85.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="255.0" y="453.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle"><tspan x="255.0" dy="0.0">Швидкість та межі:</tspan><tspan x="255.0" dy="12.3">• Час виконання: O(1) (миттєво для будь-якого терабайтного диска)</tspan><tspan x="255.0" dy="12.3">• Сліпа зона: не знає, які саме файли чи каталоги зайняли місце</tspan></text>
<rect x="510.0" y="75.0" width="430.0" height="445.0" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.6"/>
<text x="725.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#b45309" text-anchor="middle" font-weight="700">УТИЛІТА du (Disk Usage)</text>
<text x="725.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#64748b" text-anchor="middle" font-style="italic">Системні виклики readdir() + fstatat() / stat()</text>
<rect x="525.0" y="138.0" width="400.0" height="60.0" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/><text x="725.0" y="157.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">Рекурсивний обхід дерева каталогів:</tspan><tspan x="725.0" dy="14.3">openat() ──&gt; getdents64() ──&gt; newfstatat()</tspan><tspan x="725.0" dy="14.3">Послідовне сканування кожного видимого запису dirent</tspan></text>
<line x1="725.0" y1="198.0" x2="725.0" y2="222.0" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="525.0" y="222.0" width="400.0" height="80.0" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/><text x="725.0" y="245.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">Атрибути кожного знайденого файлу (struct stat)</tspan><tspan x="725.0" dy="13.7">• st_blocks: кількість виділених секторів по 512 байтів</tspan><tspan x="725.0" dy="13.7">• Хеш-таблиця перевірки inode/dev (щоб не дублювати hardlinks)</tspan><tspan x="725.0" dy="13.7">• Підсумовування: загальний розмір = ∑ (st_blocks × 512)</tspan></text>
<line x1="725.0" y1="302.0" x2="725.0" y2="326.0" stroke="#f59e0b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="525.0" y="326.0" width="400.0" height="85.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="725.0" y="347.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#991b1b" text-anchor="middle"><tspan x="725.0" dy="0.0">Що бачить du:</tspan><tspan x="725.0" dy="12.3">[−] Сліпа до видалених відкритих файлів (немає запису в каталозі)</tspan><tspan x="725.0" dy="12.3">[−] Сліпа до даних, закритих поверх іншим монтуванням</tspan><tspan x="725.0" dy="12.3">[−] Не знає про резервні блоки root</tspan><tspan x="725.0" dy="12.3">[=] Показує лише 12 ГБ із 200 ГБ зайнятого простору!</tspan></text>
<rect x="525.0" y="420.0" width="400.0" height="85.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="725.0" y="453.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#334155" text-anchor="middle"><tspan x="725.0" dy="0.0">Швидкість та межі:</tspan><tspan x="725.0" dy="11.7">• Час виконання: O(N) (залежить від мільйонів файлів та I/O навантаження)</tspan><tspan x="725.0" dy="11.7">• Перевага: показує точні шляхи до видимих великих файлів</tspan></text>
</svg>