<rect x="55.0" y="120.0" width="240.0" height="70.0" rx="6" fill="#faf5ff" stroke="#c084fc" stroke-width="1.5"/><text x="175.0" y="138.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">Процес-демон (PID: 28411)</tspan><tspan x="175.0" dy="13.7">• Виконує активний запис у лог</tspan><tspan x="175.0" dy="13.7">• Відкрив файл через open()</tspan><tspan x="175.0" dy="13.7">• Таблиця FD процесу</tspan></text>
