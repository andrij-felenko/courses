<rect x="55.0" y="320.0" width="240.0" height="145.0" rx="6" fill="#f8fafc" stroke="#a855f7" stroke-width="1.5"/><text x="175.0" y="352.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="175.0" dy="0.0">Діагностика через lsof:</tspan><tspan x="175.0" dy="12.3">$ lsof +L1</tspan><tspan x="175.0" dy="12.3">COMMAND: java</tspan><tspan x="175.0" dy="12.3">PID: 28411</tspan><tspan x="175.0" dy="12.3">FD: 3w</tspan><tspan x="175.0" dy="12.3">NLINK: 0 (немає імен!)</tspan><tspan x="175.0" dy="12.3">SIZE: 180 ГБ</tspan><tspan x="175.0" dy="12.3">NAME: /var/log/app.log (deleted)</tspan></text>
