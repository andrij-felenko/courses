<rect x="360.0" y="120.0" width="260.0" height="70.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="490.0" y="139.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle"><tspan x="490.0" dy="0.0">Каталог /var/log/</tspan><tspan x="490.0" dy="13.0">Після виклику unlink('app.log'):</tspan><tspan x="490.0" dy="13.0">Запис (dirent) ПОВНІСТЮ ВИДАЛЕНО</tspan><tspan x="490.0" dy="13.0">du більше не знаходить файл!</tspan></text>
