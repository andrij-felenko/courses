<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="940.0" height="460.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="490.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">ПРИХОВУВАННЯ ДАНИХ ПІД ТОЧКОЮ МОНТУВАННЯ (OVER-MOUNTING)</text>
<rect x="40.0" y="75.0" width="430.0" height="385.0" rx="6" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="255.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#334155" text-anchor="middle" font-weight="700">1. СТАН ДО МОНТУВАННЯ ДИСКА</text>
<rect x="55.0" y="120.0" width="400.0" height="80.0" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="255.0" y="143.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">Коренева файлова система /dev/nvme0n1p2 (/)</tspan><tspan x="255.0" dy="13.7">Каталог: /mnt/storage/</tspan><tspan x="255.0" dy="13.7">У каталог записано великий архів: backup.tar (60 ГБ)</tspan><tspan x="255.0" dy="13.7">Інод #521902 належить кореневій ФС</tspan></text>
<rect x="55.0" y="215.0" width="400.0" height="105.0" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/><text x="255.0" y="243.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle"><tspan x="255.0" dy="0.0">Показники утиліт до монтування:</tspan><tspan x="255.0" dy="13.7">• df -h / ──&gt; Зайнято: 90 ГБ (включно з 60 ГБ backup.tar)</tspan><tspan x="255.0" dy="13.7">• du -sh /mnt/storage ──&gt; 60 ГБ</tspan><tspan x="255.0" dy="13.7"></tspan><tspan x="255.0" dy="13.7">Усе узгоджено: du та df показують однакові числа!</tspan></text>
<rect x="55.0" y="335.0" width="400.0" height="105.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="255.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">Фізичний стан блоків:</tspan><tspan x="255.0" dy="13.0">Блоки файлу backup.tar фізично записані у секторах /dev/nvme0n1p2.</tspan><tspan x="255.0" dy="13.0">Каталоговий запис існує в dentry кореневої системи.</tspan></text>
<rect x="510.0" y="75.0" width="430.0" height="385.0" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="1.6"/>
<text x="725.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#b91c1c" text-anchor="middle" font-weight="700">2. ПІСЛЯ mount /dev/sdb1 /mnt/storage</text>
<rect x="525.0" y="120.0" width="400.0" height="80.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="725.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="700"><tspan x="725.0" dy="0.0">Нова файлова система /dev/sdb1 змонтована поверх!</tspan><tspan x="725.0" dy="13.7">VFS перенаправляє шлях /mnt/storage на корінь нового диска.</tspan><tspan x="725.0" dy="13.7">Попередній вміст каталогу /mnt/storage/ СТАЄ НЕВИДИМИМ!</tspan></text>
<rect x="525.0" y="215.0" width="400.0" height="105.0" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="725.0" y="253.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#92400e" text-anchor="middle"><tspan x="725.0" dy="0.0">Ілюзія зникнення 60 Гігабайтів:</tspan><tspan x="725.0" dy="11.7">• df -h / ──&gt; Зайнято: 90 ГБ (60 ГБ НЕ звільнилися з кореня!)</tspan><tspan x="725.0" dy="11.7">• du -sh /mnt/storage ──&gt; 2 МБ (бачить лише новий порожній диск /dev/sdb1)</tspan><tspan x="725.0" dy="11.7">• du -sh /* ──&gt; 30 ГБ (не знаходить 60 ГБ прихованих даних!)</tspan></text>
<rect x="525.0" y="335.0" width="400.0" height="105.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="725.0" y="367.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#15803d" text-anchor="middle" font-weight="700"><tspan x="725.0" dy="0.0">Як побачити й очистити приховане:</tspan><tspan x="725.0" dy="11.7">1. Тимчасовий bind-mount кореня:</tspan><tspan x="725.0" dy="11.7">   # mount --bind / /mnt/inspect_root</tspan><tspan x="725.0" dy="11.7">2. Сканування без перекриття: du -sh /mnt/inspect_root/mnt/storage</tspan><tspan x="725.0" dy="11.7">3. Видалення прихованого файлу через /mnt/inspect_root/...</tspan></text>
</svg>