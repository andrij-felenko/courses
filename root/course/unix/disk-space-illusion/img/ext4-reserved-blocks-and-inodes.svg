<svg xmlns="http://www.w3.org/2000/svg" viewBox="-40.75 -10 1020.75 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-40.75" y="-10" width="1020.75" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="940.0" height="460.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="490.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#0f172a" text-anchor="middle" font-weight="700">ВИЧЕРПАННЯ ІНОДІВ ТА ПАСТКА РЕЗЕРВНИХ БЛОКІВ EXT4</text>
<rect x="40.0" y="75.0" width="430.0" height="385.0" rx="6" fill="#ffffff" stroke="#ea580c" stroke-width="1.6"/>
<text x="255.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c2410c" text-anchor="middle" font-weight="700">ВИЧЕРПАННЯ ІНОДІВ (df -i)</text>
<rect x="55.0" y="120.0" width="400.0" height="75.0" rx="6" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/><text x="255.0" y="154.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">Фіксована таблиця інодів (Ext4):</tspan><tspan x="255.0" dy="11.7">Під час форматування mkfs.ext4 виділяється фіксована кількість інодів (наприклад, 1 інод на 16 КБ диска). Всього: 6 553 600 шт.</tspan></text>
<rect x="55.0" y="205.0" width="400.0" height="115.0" rx="6" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/><text x="255.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#991b1b" text-anchor="middle" font-weight="700"><tspan x="255.0" dy="0.0">Сценарій катастрофи: мільйони дрібних файлів</tspan><tspan x="255.0" dy="13.0">• 6.5 млн сесій PHP (/var/lib/php/sessions)</tspan><tspan x="255.0" dy="13.0">• Поштова черга postfix або кеш дрібних іконок по 100 байтів</tspan><tspan x="255.0" dy="13.0">• Використано дискового простору: лише 4 ГБ із 100 ГБ (4%!)</tspan><tspan x="255.0" dy="13.0">• Використано інодів: 6 553 600 / 6 553 600 (100%)</tspan></text>
<rect x="55.0" y="330.0" width="400.0" height="115.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="255.0" y="366.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="255.0" dy="0.0">Наслідок та розв'язання:</tspan><tspan x="255.0" dy="12.3">$ touch test.txt ──&gt; touch: cannot touch: No space left on device</tspan><tspan x="255.0" dy="12.3">df -h: 96 ГБ ВІЛЬНО! | df -i: IUse% = 100% (ВІЛЬНИХ ІНОДІВ 0)</tspan><tspan x="255.0" dy="12.3">Пошук винуватця:</tspan><tspan x="255.0" dy="12.3">$ find / -xdev -printf '%h\n' | sort | uniq -c | sort -nr | head -n 10</tspan></text>
<rect x="510.0" y="75.0" width="430.0" height="385.0" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.6"/>
<text x="725.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0369a1" text-anchor="middle" font-weight="700">РЕЗЕРВНІ БЛОКИ ROOT (tune2fs -m)</text>
<rect x="525.0" y="120.0" width="400.0" height="75.0" rx="6" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.5"/><text x="725.0" y="140.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="725.0" dy="0.0">Структура дискового простору Ext4:</tspan><tspan x="725.0" dy="13.7">┌────────────────────────────┬──────────────┐</tspan><tspan x="725.0" dy="13.7">│ Доступно користувачам (95%)│ Резерв root (5%)│</tspan><tspan x="725.0" dy="13.7">└────────────────────────────┴──────────────┘</tspan></text>
<rect x="525.0" y="205.0" width="400.0" height="115.0" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/><text x="725.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#92400e" text-anchor="middle" font-weight="700"><tspan x="725.0" dy="0.0">Чому 95% = 100% для звичайного процесу:</tspan><tspan x="725.0" dy="13.0">• f_bfree (фізично вільні блоки): 5 ГБ (5%)</tspan><tspan x="725.0" dy="13.0">• f_bavail (доступно не-root користувачам): 0 ГБ (0%)</tspan><tspan x="725.0" dy="13.0">• Процес застосунку падає з ENOSPC при 95% заповнення диска!</tspan><tspan x="725.0" dy="13.0">• root може увійти через sshd і відредагувати конфіги.</tspan></text>
<rect x="525.0" y="330.0" width="400.0" height="115.0" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/><text x="725.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#15803d" text-anchor="middle" font-weight="700"><tspan x="725.0" dy="0.0">Оптимізація для терабайтних накопичувачів:</tspan><tspan x="725.0" dy="13.0">На диску 16 ТБ резерв 5% марнує 800 Гігабайтів!</tspan><tspan x="725.0" dy="13.0">Зменшення резерву до 1% або 0% для розділів даних:</tspan><tspan x="725.0" dy="13.0"># tune2fs -m 1 /dev/sdb1    (1% замість 5%)</tspan><tspan x="725.0" dy="13.0"># tune2fs -m 0 /dev/sdc1    (для чистого data-диска)</tspan></text>
</svg>