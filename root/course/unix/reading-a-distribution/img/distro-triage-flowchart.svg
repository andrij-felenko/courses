<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Послідовний протокол обстеження дистрибутива</text>
<rect x="20.0" y="16.0" width="900.0" height="34.0" rx="6" fill="#eef2f8" stroke="#2457d6" stroke-width="1.5"/><text x="470.0" y="45.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="470.0" dy="0.0">Послідовний протокол обстеження невідомого оточення</tspan></text>
<rect x="40.0" y="70.0" width="410.0" height="68.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<rect x="48.0" y="76.0" width="394.0" height="22.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="245.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="245.0" dy="0.0">Крок 1. Метадані та версія ядра</tspan></text>
<rect x="48.0" y="100.0" width="394.0" height="32.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="245.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">cat /etc/os-release  ||  uname -mrs  ||  cat /proc/version</tspan><tspan x="245.0" dy="13.0">-&gt; Визначає назву дистрибутива, версію ядра та архітектуру ЦП</tspan></text>
<rect x="490.0" y="70.0" width="410.0" height="68.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<rect x="498.0" y="76.0" width="394.0" height="22.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="695.0" y="91.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="695.0" dy="0.0">Крок 2. Хто керує системою (PID 1)</tspan></text>
<rect x="498.0" y="100.0" width="394.0" height="32.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="695.0" y="113.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">readlink -f /proc/1/exe  ||  cat /proc/1/comm</tspan><tspan x="695.0" dy="13.0">-&gt; systemd (systemctl) / OpenRC (rc-service) / runit / контейнер</tspan></text>
<rect x="40.0" y="165.0" width="410.0" height="68.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
<rect x="48.0" y="171.0" width="394.0" height="22.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="245.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="245.0" dy="0.0">Крок 3. Системна бібліотека C (libc)</tspan></text>
<rect x="48.0" y="195.0" width="394.0" height="32.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="245.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">readelf -l /bin/sh | grep interpreter  ||  ldd /bin/sh</tspan><tspan x="245.0" dy="13.0">-&gt; glibc (ld-linux.so) чи musl (ld-musl.so) чи статичний BusyBox</tspan></text>
<rect x="490.0" y="165.0" width="410.0" height="68.0" rx="6" fill="#ffffff" stroke="#e08a1e" stroke-width="1.5"/>
<rect x="498.0" y="171.0" width="394.0" height="22.0" rx="6" fill="#fdf0dc" stroke="#e08a1e" stroke-width="1.5"/><text x="695.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="695.0" dy="0.0">Крок 4. Файлова система та монтування</tspan></text>
<rect x="498.0" y="195.0" width="394.0" height="32.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="695.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">mount | grep ' on / '  &amp;&amp;  ls -ld /bin /sbin /lib</tspan><tspan x="695.0" dy="13.0">-&gt; Виявляє UsrMerge (/usr/bin), read-only корінь та OverlayFS</tspan></text>
<rect x="40.0" y="260.0" width="410.0" height="68.0" rx="6" fill="#ffffff" stroke="#8e44ad" stroke-width="1.5"/>
<rect x="48.0" y="266.0" width="394.0" height="22.0" rx="6" fill="#f3e8fd" stroke="#8e44ad" stroke-width="1.5"/><text x="245.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="245.0" dy="0.0">Крок 5. Пакетний менеджер і сховища</tspan></text>
<rect x="48.0" y="290.0" width="394.0" height="32.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="245.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="245.0" dy="0.0">ls /var/lib/dpkg /var/lib/rpm /lib/apk /var/lib/pacman /nix</tspan><tspan x="245.0" dy="13.0">-&gt; dpkg (apt) / rpm (dnf) / apk / pacman / nix / відсутній</tspan></text>
<rect x="490.0" y="260.0" width="410.0" height="68.0" rx="6" fill="#ffffff" stroke="#16a085" stroke-width="1.5"/>
<rect x="498.0" y="266.0" width="394.0" height="22.0" rx="6" fill="#e8f8f5" stroke="#16a085" stroke-width="1.5"/><text x="695.0" y="281.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="695.0" dy="0.0">Крок 6. Базові утиліти та оболонка</tspan></text>
<rect x="498.0" y="290.0" width="394.0" height="32.0" rx="6" fill="#ffffff" stroke="none" stroke-width="1.5"/><text x="695.0" y="303.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">ls --version 2&gt;&amp;1 | head -n 1  &amp;&amp;  ls -l /bin/sh</tspan><tspan x="695.0" dy="13.0">-&gt; GNU coreutils vs BusyBox, оболонка bash vs dash vs ash</tspan></text>
