<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 570" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="570" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="15.0" y="15.0" width="850.0" height="530.0" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="440.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">КАРТА СТАНІВ ПРОЦЕСУ В ЯДРІ LINUX (task_struct.__state)</text>
<rect x="300.0" y="65.0" width="280.0" height="85.0" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="440.0" y="91.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">TASK_RUNNING (R)</tspan><tspan x="440.0" dy="13.0">• Виконується на CPU або стоїть у runqueue</tspan><tspan x="440.0" dy="13.0">• Активно обробляє інструкції користувача</tspan><tspan x="440.0" dy="13.0">• Перемикання контексту: schedule()</tspan></text>
<rect x="35.0" y="195.0" width="250.0" height="95.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/><text x="160.0" y="222.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">TASK_INTERRUPTIBLE (S)</tspan><tspan x="160.0" dy="11.7">• Перервний сон на черзі wait_queue_head_t</tspan><tspan x="160.0" dy="11.7">• Очікування сокета, пайпа, futex, таймера</tspan><tspan x="160.0" dy="11.7">• Пробудження: подія АБО будь-який сигнал</tspan><tspan x="160.0" dy="11.7">• Реакція на SIGINT / SIGTERM / SIGKILL</tspan></text>
<rect x="595.0" y="195.0" width="255.0" height="95.0" rx="6" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/><text x="722.5" y="222.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="722.5" dy="0.0">TASK_UNINTERRUPTIBLE (D)</tspan><tspan x="722.5" dy="11.7">• Неперервний сон під час операцій ядра</tspan><tspan x="722.5" dy="11.7">• Очікування дискового I/O, блокування NFS</tspan><tspan x="722.5" dy="11.7">• Сигнали ігноруються планувальником!</tspan><tspan x="722.5" dy="11.7">• kill -9 безсилий до завершення I/O</tspan></text>
<rect x="595.0" y="335.0" width="255.0" height="85.0" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/><text x="722.5" y="357.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="722.5" dy="0.0">TASK_KILLABLE</tspan><tspan x="722.5" dy="11.7">• Гібридний стан сну (D + WAKEKILL)</tspan><tspan x="722.5" dy="11.7">• Спить на очікуванні критичного ресурсу</tspan><tspan x="722.5" dy="11.7">• Пробуджується ЛИШЕ на фатальні сигнали</tspan><tspan x="722.5" dy="11.7">• Дозволяє kill -9 для завислих NFS/I/O</tspan></text>
<rect x="35.0" y="335.0" width="250.0" height="85.0" rx="6" fill="#fdf4ff" stroke="#e879f9" stroke-width="1.5"/><text x="160.0" y="357.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="160.0" dy="0.0">TASK_STOPPED / TRACED (T / t)</tspan><tspan x="160.0" dy="11.7">• Зупинено сигналом SIGSTOP / SIGTSTP</tspan><tspan x="160.0" dy="11.7">• АБО заморожено під ptrace (GDB, strace)</tspan><tspan x="160.0" dy="11.7">• tracer інспектує регістри та пам'ять</tspan><tspan x="160.0" dy="11.7">• Продовження: SIGCONT чи ptrace-detach</tspan></text>
<rect x="315.0" y="455.0" width="250.0" height="75.0" rx="6" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/><text x="440.0" y="478.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">EXIT_ZOMBIE / DEAD (Z / X)</tspan><tspan x="440.0" dy="11.7">• Виконання завершено (exit_group)</tspan><tspan x="440.0" dy="11.7">• Ресурси звільнено, дескриптор task_struct збережено</tspan><tspan x="440.0" dy="11.7">• Очікує виклику waitpid() від батьківського процесу</tspan></text>
<line x1="360.0" y1="150.0" x2="200.0" y2="195.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="250.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="700">wait_event() / read()</text>
<line x1="220.0" y1="195.0" x2="390.0" y2="150.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="345.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">wake_up() / сигнал</text>
<line x1="520.0" y1="150.0" x2="680.0" y2="195.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="630.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">io_schedule() / NFS RPC</text>
<line x1="660.0" y1="195.0" x2="490.0" y2="150.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="540.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">DMA I/O завершено</text>
<line x1="320.0" y1="150.0" x2="160.0" y2="335.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="190.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="700">SIGSTOP / ptrace</text>
<line x1="180.0" y1="335.0" x2="340.0" y2="150.0" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="275.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">SIGCONT / continue</text>
<line x1="722.0" y1="290.0" x2="722.0" y2="335.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="440.0" y1="150.0" x2="440.0" y2="455.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="440.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">exit(0) / SIGKILL</text>
</svg>