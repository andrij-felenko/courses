<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="260.0" height="480.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="150.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">/proc/[PID]/wchan</text>
<rect x="35.0" y="65.0" width="230.0" height="80.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="150.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Символічна назва очікування:</tspan><tspan x="150.0" dy="13.0">• Функція ядра, де спить процес</tspan><tspan x="150.0" dy="13.0">• Обчислюється get_wchan(task)</tspan><tspan x="150.0" dy="13.0">• Розмотування до межі schedule()</tspan></text>
<rect x="35.0" y="155.0" width="230.0" height="140.0" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="150.0" y="181.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Типові значення wchan:</tspan><tspan x="150.0" dy="11.7">• futex_wait_queue_me</tspan><tspan x="150.0" dy="11.7">  -&gt; блокування на м'ютексі</tspan><tspan x="150.0" dy="11.7">• sk_wait_data / inet_csk_accept</tspan><tspan x="150.0" dy="11.7">  -&gt; сокет чекає на байти</tspan><tspan x="150.0" dy="11.7">• epoll_wait / do_sys_poll</tspan><tspan x="150.0" dy="11.7">  -&gt; цикл очікування подій</tspan><tspan x="150.0" dy="11.7">• pipe_read / nfs_wait_bit_killable</tspan><tspan x="150.0" dy="11.7">  -&gt; ввід-вивід пайпа або NFS</tspan></text>
<rect x="35.0" y="305.0" width="230.0" height="85.0" rx="6" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/><text x="150.0" y="327.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Обмеження wchan:</tspan><tspan x="150.0" dy="11.7">• kptr_restrict = 2 може ховати</tspan><tspan x="150.0" dy="11.7">  символи ядра і повертати '0'</tspan><tspan x="150.0" dy="11.7">• Показує лише один кадр ядра,</tspan><tspan x="150.0" dy="11.7">  без контексту викликів</tspan></text>
<rect x="35.0" y="400.0" width="230.0" height="85.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="150.0" y="428.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Швидкий огляд:</tspan><tspan x="150.0" dy="11.7">cat /proc/14920/wchan</tspan><tspan x="150.0" dy="11.7">ps -o pid,stat,wchan:20,comm</tspan><tspan x="150.0" dy="11.7">-&gt; Нульовий оверхед читання</tspan></text>
<rect x="310.0" y="20.0" width="260.0" height="480.0" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="440.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">/proc/[PID]/stack</text>
<rect x="325.0" y="65.0" width="230.0" height="60.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="440.0" y="86.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Ядерний бектрейс (Kernel Call Stack):</tspan><tspan x="440.0" dy="11.7">• Повний ланцюг викликів у ядрі</tspan><tspan x="440.0" dy="11.7">• Від входу syscall до розкладу</tspan></text>
<rect x="325.0" y="135.0" width="230.0" height="220.0" rx="6" fill="#f8fafc" stroke="#86efac" stroke-width="1.5"/><text x="440.0" y="201.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Приклад ядерного стека (#0..#7):</tspan><tspan x="440.0" dy="11.7">[&lt;0&gt;] __schedule+0x3ee/0x890</tspan><tspan x="440.0" dy="11.7">[&lt;0&gt;] schedule+0x4e/0xb0</tspan><tspan x="440.0" dy="11.7">[&lt;0&gt;] futex_wait_queue_me+0xc2/0x120</tspan><tspan x="440.0" dy="11.7">[&lt;0&gt;] futex_wait+0x139/0x240</tspan><tspan x="440.0" dy="11.7">[&lt;0&gt;] do_futex+0x12c/0x190</tspan><tspan x="440.0" dy="11.7">[&lt;0&gt;] __x64_sys_futex+0x125/0x180</tspan><tspan x="440.0" dy="11.7">[&lt;0&gt;] do_syscall_64+0x5c/0x90</tspan><tspan x="440.0" dy="11.7">[&lt;0&gt;] entry_SYSCALL_64_after_hwframe</tspan></text>
<rect x="325.0" y="365.0" width="230.0" height="120.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="440.0" y="404.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Діагностична цінність:</tspan><tspan x="440.0" dy="11.7">• Точна точка зупинки в ядрі</tspan><tspan x="440.0" dy="11.7">• Видно, чи це драйвер диска,</tspan><tspan x="440.0" dy="11.7">  мережевий стек або lock ядра</tspan><tspan x="440.0" dy="11.7">• Потребує CAP_SYS_PTRACE / root</tspan></text>
<rect x="600.0" y="20.0" width="260.0" height="480.0" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="730.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">/proc/[PID]/syscall &amp; fd/</text>
<rect x="615.0" y="65.0" width="230.0" height="100.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="730.0" y="94.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">Формат /proc/[pid]/syscall:</tspan><tspan x="730.0" dy="11.7">NR arg0 arg1 arg2 arg3 arg4 arg5 sp pc</tspan><tspan x="730.0" dy="11.7">Приклад блокування:</tspan><tspan x="730.0" dy="11.7">202 0x7f0a40 0x80 0x2 0x0 0x0 0x0 ...</tspan><tspan x="730.0" dy="11.7">-&gt; NR 202 = SYS_futex (x86_64)</tspan></text>
<rect x="615.0" y="175.0" width="230.0" height="140.0" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/><text x="730.0" y="213.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">Зв'язок із дескриптором (fd):</tspan><tspan x="730.0" dy="11.7">Якщо NR = 0 (read) чи 45 (recvfrom):</tspan><tspan x="730.0" dy="11.7">• arg0 = номер дескриптора (fd=3)</tspan><tspan x="730.0" dy="11.7">• ls -l /proc/[pid]/fd/3</tspan><tspan x="730.0" dy="11.7">  -&gt; socket:[491029]</tspan><tspan x="730.0" dy="11.7">• ss -tulpne | grep 491029</tspan><tspan x="730.0" dy="11.7">  -&gt; 10.0.1.5:8080 &lt;-&gt; 10.0.2.9:443</tspan></text>
<rect x="615.0" y="325.0" width="230.0" height="160.0" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/><text x="730.0" y="378.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">Деталі у fdinfo/[fd]:</tspan><tspan x="730.0" dy="11.7">• pos: поточне зміщення у файлі</tspan><tspan x="730.0" dy="11.7">• flags: 02 (O_RDWR, блокуючий)</tspan><tspan x="730.0" dy="11.7">• mnt_id: ідентифікатор точки монтування</tspan><tspan x="730.0" dy="11.7">• eventfd-count / epoll-tfd:</tspan><tspan x="730.0" dy="11.7">  внутрішні лічильники примітивів</tspan></text>
</svg>