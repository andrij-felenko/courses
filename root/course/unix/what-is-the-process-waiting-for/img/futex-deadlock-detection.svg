<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="260.0" height="480.0" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="150.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ПОТІК 1 (TID 101)</text>
<rect x="35.0" y="65.0" width="230.0" height="85.0" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/><text x="150.0" y="93.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Крок 1: Захопив М'ютекс A</tspan><tspan x="150.0" dy="11.7">pthread_mutex_lock(&amp;mutex_A)</tspan><tspan x="150.0" dy="11.7">-&gt; Успіх! mutex_A.__owner = 101</tspan><tspan x="150.0" dy="11.7">-&gt; Працює в просторі користувача</tspan></text>
<line x1="150.0" y1="150.0" x2="150.0" y2="180.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="35.0" y="180.0" width="230.0" height="115.0" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/><text x="150.0" y="211.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Крок 2: Запитує М'ютекс B</tspan><tspan x="150.0" dy="11.7">pthread_mutex_lock(&amp;mutex_B)</tspan><tspan x="150.0" dy="11.7">-&gt; mutex_B.__owner == 102 (зайнято!)</tspan><tspan x="150.0" dy="11.7">-&gt; Виклик syscall(SYS_futex, &amp;mutex_B,</tspan><tspan x="150.0" dy="11.7">   FUTEX_WAIT_BITSET, 2)</tspan><tspan x="150.0" dy="11.7">-&gt; Потік переходить у стан S (Sleep)</tspan></text>
<rect x="35.0" y="310.0" width="230.0" height="95.0" rx="6" fill="#f8fafc" stroke="#fca5a5" stroke-width="1.5"/><text x="150.0" y="343.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Стан у системі:</tspan><tspan x="150.0" dy="11.7">• wchan: futex_wait_queue_me</tspan><tspan x="150.0" dy="11.7">• stack: futex_wait -&gt; schedule</tspan><tspan x="150.0" dy="11.7">• Очікує пробудження від TID 102</tspan></text>
<rect x="35.0" y="415.0" width="230.0" height="70.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="150.0" y="441.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="150.0" dy="0.0">Висновки GDB:</tspan><tspan x="150.0" dy="11.7">Thread 1 тримає 0x7fff8010 (A)</tspan><tspan x="150.0" dy="11.7">і заблокований на 0x7fff8030 (B)</tspan></text>
<rect x="310.0" y="20.0" width="260.0" height="480.0" rx="8" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
<text x="440.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">ЯДРО: FUTEX HASH BUCKET</text>
<rect x="325.0" y="65.0" width="230.0" height="95.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="440.0" y="92.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Хеш-кошик ядра (&amp;mutex_A):</tspan><tspan x="440.0" dy="11.7">• Ключ: {mm, uaddr=0x7fff8010}</tspan><tspan x="440.0" dy="11.7">• Власник: TID 101</tspan><tspan x="440.0" dy="11.7">• Черга очікування: [TID 102 спить]</tspan><tspan x="440.0" dy="11.7">-&gt; futex_q чекає wake_up від 101</tspan></text>
<rect x="325.0" y="175.0" width="230.0" height="95.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="440.0" y="202.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Хеш-кошик ядра (&amp;mutex_B):</tspan><tspan x="440.0" dy="11.7">• Ключ: {mm, uaddr=0x7fff8030}</tspan><tspan x="440.0" dy="11.7">• Власник: TID 102</tspan><tspan x="440.0" dy="11.7">• Черга очікування: [TID 101 спить]</tspan><tspan x="440.0" dy="11.7">-&gt; futex_q чекає wake_up від 102</tspan></text>
<rect x="325.0" y="285.0" width="230.0" height="115.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="2.0"/>
<text x="440.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">ЦИКЛ DEADLOCK (ABBA)</text>
<text x="440.0" y="335.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">TID 101  ---&gt;  Чекає Mutex B</text>
<text x="440.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">^                      |</text>
<text x="440.0" y="375.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Тримає Mutex A  &lt;---  TID 102</text>
<rect x="325.0" y="415.0" width="230.0" height="70.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/><text x="440.0" y="441.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Результат: Навантаження CPU = 0%</tspan><tspan x="440.0" dy="11.7">Обидва потоки сплять назавжди,</tspan><tspan x="440.0" dy="11.7">жоден не викличе FUTEX_WAKE</tspan></text>
<rect x="600.0" y="20.0" width="260.0" height="480.0" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="730.0" y="46.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">ПОТІК 2 (TID 102)</text>
<rect x="615.0" y="65.0" width="230.0" height="85.0" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/><text x="730.0" y="93.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">Крок 1: Захопив М'ютекс B</tspan><tspan x="730.0" dy="11.7">pthread_mutex_lock(&amp;mutex_B)</tspan><tspan x="730.0" dy="11.7">-&gt; Успіх! mutex_B.__owner = 102</tspan><tspan x="730.0" dy="11.7">-&gt; Працює в просторі користувача</tspan></text>
<line x1="730.0" y1="150.0" x2="730.0" y2="180.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="615.0" y="180.0" width="230.0" height="115.0" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/><text x="730.0" y="211.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">Крок 2: Запитує М'ютекс A</tspan><tspan x="730.0" dy="11.7">pthread_mutex_lock(&amp;mutex_A)</tspan><tspan x="730.0" dy="11.7">-&gt; mutex_A.__owner == 101 (зайнято!)</tspan><tspan x="730.0" dy="11.7">-&gt; Виклик syscall(SYS_futex, &amp;mutex_A,</tspan><tspan x="730.0" dy="11.7">   FUTEX_WAIT_BITSET, 2)</tspan><tspan x="730.0" dy="11.7">-&gt; Потік переходить у стан S (Sleep)</tspan></text>
<rect x="615.0" y="310.0" width="230.0" height="95.0" rx="6" fill="#f8fafc" stroke="#fca5a5" stroke-width="1.5"/><text x="730.0" y="343.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">Стан у системі:</tspan><tspan x="730.0" dy="11.7">• wchan: futex_wait_queue_me</tspan><tspan x="730.0" dy="11.7">• stack: futex_wait -&gt; schedule</tspan><tspan x="730.0" dy="11.7">• Очікує пробудження від TID 101</tspan></text>
<rect x="615.0" y="415.0" width="230.0" height="70.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/><text x="730.0" y="441.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">Висновки GDB:</tspan><tspan x="730.0" dy="11.7">Thread 2 тримає 0x7fff8030 (B)</tspan><tspan x="730.0" dy="11.7">і заблокований на 0x7fff8010 (A)</tspan></text>
