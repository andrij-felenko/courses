<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="200.0" y="15.0" width="600.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/><text x="500.0" y="37.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Шлях аварійного сигналу: від апаратного винятку до ELF Core Dump</tspan></text>
<text x="500.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Механізм взаємодії апаратного забезпечення MMU/CPU, ядра Linux та простору користувача</text>
<rect x="40.0" y="100.0" width="260.0" height="220.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="170.0" y="175.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="170.0" dy="0.0">Апаратний шар (CPU / MMU)</tspan><tspan x="170.0" dy="15.6"></tspan><tspan x="170.0" dy="15.6">• Page Fault (#PF, CR2 = адреса)</tspan><tspan x="170.0" dy="15.6">• Division by Zero (#DE)</tspan><tspan x="170.0" dy="15.6">• General Protection (#GP)</tspan><tspan x="170.0" dy="15.6">• Alignment Check (#AC)</tspan></text>
<rect x="370.0" y="100.0" width="260.0" height="220.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="500.0" y="178.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Простір ядра (Linux Kernel)</tspan><tspan x="500.0" dy="14.3"></tspan><tspan x="500.0" dy="14.3">• Обробник винятків (do_page_fault)</tspan><tspan x="500.0" dy="14.3">• Перевірка дерева VMA процесу</tspan><tspan x="500.0" dy="14.3">• Генерація сигналу (force_sig_info)</tspan><tspan x="500.0" dy="14.3">• do_coredump() вивантажує стан</tspan></text>
<rect x="700.0" y="100.0" width="260.0" height="220.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="830.0" y="175.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="830.0" dy="0.0">Служби простору користувача</tspan><tspan x="830.0" dy="15.6"></tspan><tspan x="830.0" dy="15.6">• /proc/sys/kernel/core_pattern</tspan><tspan x="830.0" dy="15.6">• Служба systemd-coredump</tspan><tspan x="830.0" dy="15.6">• Збереження стисненого ELF Core</tspan><tspan x="830.0" dy="15.6">• База аварій coredumpctl</tspan></text>
<line x1="300.0" y1="180.0" x2="370.0" y2="180.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="335.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">IDT Trap</text>
<line x1="300.0" y1="240.0" x2="370.0" y2="240.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="335.0" y="230.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">SIGSEGV</text>
<line x1="630.0" y1="210.0" x2="700.0" y2="210.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="665.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Pipe Core</text>
<rect x="40.0" y="350.0" width="920.0" height="65.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.4"/><text x="500.0" y="378.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Результат аварії: процес завершується з кодом (128 + Signal), ядро генерує повний знімок</tspan><tspan x="500.0" dy="15.6">віртуальної пам'яті (ELF Core), доступний для аналізу в GDB без повторного відтворення збою.</tspan></text>
</svg>