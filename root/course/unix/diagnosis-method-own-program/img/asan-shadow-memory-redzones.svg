<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="200.0" y="15.0" width="600.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/><text x="500.0" y="38.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Архітектура AddressSanitizer: тіньова пам'ять і червоні зони</tspan></text>
<text x="500.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Пряме відображення 8 байтів пам'яті застосунку в 1 байт Shadow Memory: (Addr &gt;&gt; 3) + Offset</text>
<rect x="50.0" y="100.0" width="900.0" height="110.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/><text x="500.0" y="143.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Пам'ять застосунку (Application Virtual Memory):</tspan><tspan x="500.0" dy="15.6">[ Redzone: 16 байтів (0xFA) ] [ Буфер: malloc(24) - 24 байти адресні ] [ Redzone: 16 байтів (0xFA) ]</tspan><tspan x="500.0" dy="15.6">Помилка Out-of-Bounds: запис за індексом 25 потрапляє в отруєну червону зону (Heap Redzone).</tspan></text>
<line x1="500.0" y1="210.0" x2="500.0" y2="255.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="350.0" y="222.0" width="300.0" height="24.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.2"/><text x="500.0" y="255.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Тіньове стиснення 8:1:  Shadow = (Addr &gt;&gt; 3) + Offset</tspan></text>
<rect x="50.0" y="260.0" width="900.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/><text x="500.0" y="298.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Тіньова пам'ять (Shadow Memory):</tspan><tspan x="500.0" dy="15.6">[ 0xFA 0xFA ] (отруєно)  │  [ 0x00 0x00 0x00 ] (8+8+8 = 24 байти валідні)  │  [ 0xFA 0xFA ] (отруєно)</tspan><tspan x="500.0" dy="15.6">Байт 0x00 = усі 8 байтів вільні  •  0x01..0x07 = перші k байтів  •  0xFD = Heap UAF  •  0xF2 = Stack RZ</tspan></text>
<rect x="50.0" y="380.0" width="900.0" height="65.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.6"/><text x="500.0" y="408.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Швидка компіляторна перевірка перед кожним доступом до пам'яті:</tspan><tspan x="500.0" dy="15.6">char *shadow = (addr &gt;&gt; 3) + 0x7fff8000;  if (*shadow &amp;&amp; *shadow &lt;= (addr &amp; 7)) __asan_report_error();</tspan></text>
</svg>