<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1010 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1010" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="200.0" y="15.0" width="600.0" height="36.0" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.8"/><text x="500.0" y="38.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Інженерний конвеєр діагностики падінь (Crash Triage Workflow)</tspan></text>
<text x="500.0" y="68.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-style="italic">Послідовний перехід від перехоплення сигналу до точної локалізації дефекту в коді</text>
<rect x="30.0" y="95.0" width="172.0" height="240.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/><text x="116.0" y="175.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="116.0" dy="0.0">1. Сигнал ядра</tspan><tspan x="116.0" dy="14.3"></tspan><tspan x="116.0" dy="14.3">Перехоплення збою:</tspan><tspan x="116.0" dy="14.3">• SIGSEGV (0x0 / VMA)</tspan><tspan x="116.0" dy="14.3">• SIGBUS (mmap/align)</tspan><tspan x="116.0" dy="14.3">• SIGABRT (assert/heap)</tspan><tspan x="116.0" dy="14.3">• SIGFPE (div by zero)</tspan></text>
<line x1="202.0" y1="215.0" x2="222.0" y2="215.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="222.0" y="95.0" width="172.0" height="240.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/><text x="308.0" y="175.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="308.0" dy="0.0">2. Core Dump</tspan><tspan x="308.0" dy="14.3"></tspan><tspan x="308.0" dy="14.3">Фіксація пам'яті:</tspan><tspan x="308.0" dy="14.3">• ulimit -c unlimited</tspan><tspan x="308.0" dy="14.3">• /proc/.../core_pattern</tspan><tspan x="308.0" dy="14.3">• systemd-coredump</tspan><tspan x="308.0" dy="14.3">• coredumpctl list/info</tspan></text>
<line x1="394.0" y1="215.0" x2="414.0" y2="215.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="414.0" y="95.0" width="172.0" height="240.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.8"/><text x="500.0" y="183.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">3. Розбір у GDB</tspan><tspan x="500.0" dy="11.7"></tspan><tspan x="500.0" dy="11.7">Посмертний аналіз:</tspan><tspan x="500.0" dy="11.7">• bt full (стек і кадри)</tspan><tspan x="500.0" dy="11.7">• info registers ($rip, $rsp)</tspan><tspan x="500.0" dy="11.7">• x/16gx (пам'ять стека)</tspan><tspan x="500.0" dy="11.7">• DWARF addr2line</tspan></text>
<line x1="586.0" y1="215.0" x2="606.0" y2="215.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="606.0" y="95.0" width="172.0" height="240.0" rx="6" fill="#eafaf0" stroke="#27ae60" stroke-width="1.8"/><text x="692.0" y="175.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="692.0" dy="0.0">4. Санітайзери</tspan><tspan x="692.0" dy="14.3"></tspan><tspan x="692.0" dy="14.3">Інструментація збірки:</tspan><tspan x="692.0" dy="14.3">• -fsanitize=address</tspan><tspan x="692.0" dy="14.3">• -fsanitize=undefined</tspan><tspan x="692.0" dy="14.3">• Тіньова пам'ять (ASan)</tspan><tspan x="692.0" dy="14.3">• Лов use-after-free/OOB</tspan></text>
<line x1="778.0" y1="215.0" x2="798.0" y2="215.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="798.0" y="95.0" width="172.0" height="240.0" rx="6" fill="#fef9e7" stroke="#d4ac0d" stroke-width="1.8"/><text x="884.0" y="183.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="884.0" dy="0.0">5. Емуляція</tspan><tspan x="884.0" dy="11.7"></tspan><tspan x="884.0" dy="11.7">Динамічний аудит:</tspan><tspan x="884.0" dy="11.7">• Valgrind Memcheck</tspan><tspan x="884.0" dy="11.7">• Пошук неініціалізованих</tspan><tspan x="884.0" dy="11.7">• Аналіз закритих бінарників</tspan><tspan x="884.0" dy="11.7">• Точний звіт витоків</tspan></text>
<rect x="30.0" y="365.0" width="940.0" height="70.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="500.0" y="396.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="500.0" dy="0.0">Виробниче середовище (Production):  Core Dumps + systemd-coredump + GDB (нульовий оверхед до краху)</tspan><tspan x="500.0" dy="15.6">Розробка та тестування (CI / Debug):  ASan + UBSan (швидкі тести) або Valgrind (чорні скриньки)</tspan></text>
</svg>