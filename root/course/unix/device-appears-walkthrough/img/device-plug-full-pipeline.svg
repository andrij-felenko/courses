<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 930 850" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="930" height="850" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<rect x="20.0" y="20.0" width="880.0" height="100.0" rx="8" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
<text x="40.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">1. АПАРАТНИЙ РІВЕНЬ (Hardware / USB PHY / Контролер шини)</text>
<rect x="20.0" y="130.0" width="880.0" height="360.0" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
<text x="40.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">2. ПРОСТІР ЯДРА (Kernel Space / Драйвери / sysfs / Netlink)</text>
<rect x="20.0" y="500.0" width="880.0" height="210.0" rx="8" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
<text x="40.0" y="534.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">3. ПРОСТІР КОРИСТУВАЧА (User Space / systemd-udevd / Правила)</text>
<rect x="20.0" y="720.0" width="880.0" height="100.0" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="40.0" y="749.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">4. ДОСТУП ЗАСТОСУНКУ (Application / devtmpfs / /dev Nodes)</text>
<rect x="40.0" y="55.0" width="400.0" height="55.0" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/><text x="240.0" y="79.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">Замикання контактів: VBUS/GND та D+/D-</tspan><tspan x="240.0" dy="14.3">Підтяжка pull-up 1.5 кОм змінює диференційну напругу</tspan></text>
<line x1="450.0" y1="82.0" x2="490.0" y2="82.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="490.0" y="55.0" width="390.0" height="55.0" rx="6" fill="#ffffff" stroke="#fca5a5" stroke-width="1.5"/><text x="685.0" y="79.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="685.0" dy="0.0">Хост-контролер xHCI генерує переривання IRQ</tspan><tspan x="685.0" dy="14.3">CPU перемикається на обробник ISR ядра</tspan></text>
<line x1="685.0" y1="110.0" x2="685.0" y2="165.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="490.0" y="165.0" width="390.0" height="60.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="685.0" y="184.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="685.0" dy="0.0">Робоча черга ядра: hub_event()</tspan><tspan x="685.0" dy="14.3">Скидання лінії (Reset) -&gt; Читання дескрипторів EP0</tspan><tspan x="685.0" dy="14.3">Отримання VID/PID та конфігурацій інтерфейсів</tspan></text>
<line x1="490.0" y1="195.0" x2="430.0" y2="195.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="165.0" width="390.0" height="60.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="235.0" y="184.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">Створення struct device та kobject</tspan><tspan x="235.0" dy="14.3">Реєстрація у дереві /sys/devices/pci.../usb...</tspan><tspan x="235.0" dy="14.3">Створення атрибутів kernfs (idVendor, idProduct)</tspan></text>
<line x1="235.0" y1="225.0" x2="235.0" y2="260.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="260.0" width="390.0" height="65.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="235.0" y="282.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">Виклик kobject_uevent(&amp;dev-&gt;kobj, KOBJ_ADD)</tspan><tspan x="235.0" dy="14.3">Формування рядків: ACTION=add, DEVPATH=...,</tspan><tspan x="235.0" dy="14.3">SUBSYSTEM=usb, MODALIAS=usb:v...p...</tspan></text>
<line x1="430.0" y1="292.0" x2="490.0" y2="292.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="490.0" y="260.0" width="390.0" height="65.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="685.0" y="282.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="685.0" dy="0.0">Широкомовна розсилка через Netlink</tspan><tspan x="685.0" dy="14.3">Сокет NETLINK_KOBJECT_UEVENT (multicast group 1)</tspan><tspan x="685.0" dy="14.3">Пакет потрапляє в чергу сокета простору користувача</tspan></text>
<line x1="685.0" y1="325.0" x2="685.0" y2="375.0" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="490.0" y="375.0" width="390.0" height="75.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="685.0" y="396.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="685.0" dy="0.0">Автозавантаження модуля &amp; probe():</tspan><tspan x="685.0" dy="13.0">Ядро або udevd завантажує .ko (наприклад cdc_acm / ftdi_sio)</tspan><tspan x="685.0" dy="13.0">Драйвер зв'язується з пристроєм: usb_register_driver()</tspan><tspan x="685.0" dy="13.0">Викликається driver-&gt;probe(), ініціалізація буферів</tspan></text>
<line x1="490.0" y1="412.0" x2="430.0" y2="412.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="375.0" width="390.0" height="75.0" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/><text x="235.0" y="402.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="235.0" dy="0.0">devtmpfs: реєстрація ноди пристрою</tspan><tspan x="235.0" dy="14.3">Драйвер викликає device_create() з major:minor</tspan><tspan x="235.0" dy="14.3">devtmpfs_create_node() створює сирий файл у /dev</tspan></text>
<line x1="235.0" y1="450.0" x2="235.0" y2="535.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="535.0" width="400.0" height="65.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="240.0" y="557.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">systemd-udevd отримує Netlink-повідомлення</tspan><tspan x="240.0" dy="14.3">Парсить змінні оточення (ACTION, DEVPATH, SUBSYSTEM)</tspan><tspan x="240.0" dy="14.3">Виділяє робочий потік udev worker для обробки події</tspan></text>
<line x1="440.0" y1="567.0" x2="490.0" y2="567.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="490.0" y="535.0" width="390.0" height="65.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="685.0" y="557.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="685.0" dy="0.0">Оцінка правил: /usr/lib/udev/rules.d/</tspan><tspan x="685.0" dy="14.3">Зіставлення ATTR, запуск IMPORT{builtin} = 'usb_id'</tspan><tspan x="685.0" dy="14.3">Формування властивостей ID_VENDOR_ID, ID_MODEL_ID</tspan></text>
<line x1="685.0" y1="600.0" x2="685.0" y2="630.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="490.0" y="630.0" width="390.0" height="65.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="685.0" y="653.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="685.0" dy="0.0">Призначення прав та стабільних симлінків</tspan><tspan x="685.0" dy="13.0">Встановлення GROUP=&quot;dialout&quot;, MODE=&quot;0660&quot;</tspan><tspan x="685.0" dy="13.0">Створення /dev/serial/by-id/usb-FTDI... -&gt; /dev/ttyUSB0</tspan></text>
<line x1="490.0" y1="662.0" x2="440.0" y2="662.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="630.0" width="400.0" height="65.0" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/><text x="240.0" y="653.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">Оновлення бази udev (/run/udev/data/+subsystem:dev)</tspan><tspan x="240.0" dy="13.0">Сповіщення systemd через sd_notify / D-Bus (TAG+=&quot;systemd&quot;)</tspan><tspan x="240.0" dy="13.0">Пристрій переходить у стан готового до роботи</tspan></text>
<line x1="235.0" y1="695.0" x2="235.0" y2="750.0" stroke="#6b7280" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="750.0" width="400.0" height="55.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="240.0" y="767.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="240.0" dy="0.0">Застосунок відкриває стабільний симлінк</tspan><tspan x="240.0" dy="14.3">open(&quot;/dev/serial/by-id/usb-FTDI...&quot;, O_RDWR)</tspan><tspan x="240.0" dy="14.3">VFS перенаправляє запит на cdev_open() драйвера</tspan></text>
<line x1="440.0" y1="777.0" x2="490.0" y2="777.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="490.0" y="750.0" width="390.0" height="55.0" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/><text x="685.0" y="774.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="685.0" dy="0.0">Прямий ввід-вивід із залізом встановлено</tspan><tspan x="685.0" dy="14.3">Потік read()/write() передає пакети через USB URB</tspan></text>
</svg>