<line x1="420.0" y1="127.0" x2="420.0" y2="160.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3,2"/>
<rect x="365.0" y="165.0" width="110.0" height="68.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="420.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="420.0" dy="0.0">Спроба 3</tspan><tspan x="420.0" dy="13.0">t = 1.0s</tspan><tspan x="420.0" dy="13.0">exit 1</tspan><tspan x="420.0" dy="13.0">RestartSec=100ms</tspan></text>
<circle cx="560.0" cy="120.0" r="7.0" fill="#c0392b" stroke="#333333" stroke-width="1.5"/>
<line x1="560.0" y1="127.0" x2="560.0" y2="160.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3,2"/>
<rect x="505.0" y="165.0" width="110.0" height="68.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="560.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">Спроба 4</tspan><tspan x="560.0" dy="13.0">t = 1.5s</tspan><tspan x="560.0" dy="13.0">exit 1</tspan><tspan x="560.0" dy="13.0">RestartSec=100ms</tspan></text>
<circle cx="700.0" cy="120.0" r="7.0" fill="#c0392b" stroke="#333333" stroke-width="1.5"/>
<line x1="700.0" y1="127.0" x2="700.0" y2="160.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3,2"/>
<rect x="645.0" y="165.0" width="110.0" height="68.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="700.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Спроба 5</tspan><tspan x="700.0" dy="13.0">t = 2.0s</tspan><tspan x="700.0" dy="13.0">exit 1</tspan><tspan x="700.0" dy="13.0">RestartSec=100ms</tspan></text>
<circle cx="850.0" cy="120.0" r="9.0" fill="#7b1113" stroke="#333333" stroke-width="2.0"/>
<line x1="850.0" y1="129.0" x2="850.0" y2="160.0" stroke="#7b1113" stroke-width="1.8"/>
<rect x="770.0" y="165.0" width="160.0" height="75.0" rx="6" fill="#fdecea" stroke="#7b1113" stroke-width="1.5"/><text x="862.0" y="188.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7b1113" text-anchor="middle" font-weight="700"><tspan x="862.0" dy="0.0">Спроба 6 (Блокування)</tspan><tspan x="862.0" dy="11.7">start-limit-hit!</tspan><tspan x="862.0" dy="11.7">Ліміт 5 вичерпано у межах 10с</tspan><tspan x="862.0" dy="11.7">Службу заблоковано</tspan></text>
<rect x="60.0" y="270.0" width="450.0" height="220.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="285.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">НАСЛІДКИ НЕКОНТРОЛЬОВАНОГО CRASHLOOP</text>
<text x="285.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="285.0" dy="0.0">1. Безконтрольний випал CPU на fork() та execve()</tspan><tspan x="285.0" dy="14.9">2. Засмічення дискового журналу journald тисячами записів</tspan><tspan x="285.0" dy="14.9">3. Перевантаження D-Bus та системного диспетчера PID 1</tspan><tspan x="285.0" dy="14.9">4. Вичерпання доступних PID у системній таблиці ядер</tspan><tspan x="285.0" dy="14.9">5. Зависання залежних служб у черзі очікування</tspan></text>
<rect x="540.0" y="270.0" width="480.0" height="220.0" rx="8" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/>
<text x="780.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">ПРАВИЛЬНИЙ АЛГОРИТМ ВИХОДУ З ПЕТЛІ</text>
<text x="780.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">1. Зупинити спроби: systemctl stop unit.service</tspan><tspan x="780.0" dy="14.9">2. Прочитати точний лог падіння: journalctl -u unit.service -e -b</tspan><tspan x="780.0" dy="14.9">3. Виправити першопричину (конфіг, права, файл, порт)</tspan><tspan x="780.0" dy="14.9">4. Скинути блокуючий лічильник помилок:</tspan><tspan x="780.0" dy="14.9">   systemctl reset-failed unit.service</tspan><tspan x="780.0" dy="14.9">5. Виконати чистий запуск: systemctl start unit.service</tspan></text>
</svg>