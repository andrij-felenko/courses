<text x="1040.0" y="125.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">t (сек)</text>
<rect x="100.0" y="70.0" width="720.0" height="180.0" rx="8" fill="none" stroke="#c0392b" stroke-width="1.5"/>
<text x="460.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Вікно лімітера: StartLimitIntervalSec = 10s (ліміт: StartLimitBurst = 5)</text>
<circle cx="140.0" cy="120.0" r="7.0" fill="#c0392b" stroke="#333333" stroke-width="1.5"/>
<line x1="140.0" y1="127.0" x2="140.0" y2="160.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3,2"/>
<rect x="85.0" y="165.0" width="110.0" height="68.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="140.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">Спроба 1</tspan><tspan x="140.0" dy="13.0">t = 0.0s</tspan><tspan x="140.0" dy="13.0">exit 1</tspan><tspan x="140.0" dy="13.0">RestartSec=100ms</tspan></text>
