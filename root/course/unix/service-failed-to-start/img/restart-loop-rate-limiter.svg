<rect x="225.0" y="165.0" width="110.0" height="68.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="280.0" y="183.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="280.0" dy="0.0">Спроба 2</tspan><tspan x="280.0" dy="13.0">t = 0.5s</tspan><tspan x="280.0" dy="13.0">exit 1</tspan><tspan x="280.0" dy="13.0">RestartSec=100ms</tspan></text>
