<text x="540.0" y="36.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">РЕСТАРТ-ПЕТЛЯ (CRASHLOOP) ТА ОБМЕЖУВАЧ STARTLIMITBURST</text>
<line x1="60.0" y1="120.0" x2="1020.0" y2="120.0" stroke="#333333" stroke-width="2.5"/>
