<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 460" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="460" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">«Гірше — це краще»: еволюційний вибір простоти над повнотою</text>
<rect x="30.0" y="55.0" width="160.0" height="40.0" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
<text x="110.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Критерій</text>
<rect x="200.0" y="55.0" width="320.0" height="40.0" rx="4" fill="#fef2f2" stroke="#f87171" stroke-width="1.5"/>
<text x="360.0" y="73.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">«Правильний шлях» (MIT / Multics)</text>
<text x="360.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Теоретична досконалість і чистота</text>
<rect x="530.0" y="55.0" width="320.0" height="40.0" rx="4" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
<text x="690.0" y="73.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">«Гірше — це краще» (Unix / New Jersey)</text>
<text x="690.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">Простота реалізації та виживання</text>
<rect x="30.0" y="102.0" width="160.0" height="70.0" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="110.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">Простота</tspan><tspan x="110.0" dy="14.3">(Simplicity)</tspan></text>
<rect x="200.0" y="102.0" width="320.0" height="70.0" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
<text x="212.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="212.0" dy="0.0">Інтерфейс мусить бути простим для</tspan><tspan x="212.0" dy="13.7">користувача, навіть якщо реалізація</tspan><tspan x="212.0" dy="13.7">всередині ядра буде надскладною.</tspan></text>
<rect x="530.0" y="102.0" width="320.0" height="70.0" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
<text x="542.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="542.0" dy="0.0">Простота РЕАЛІЗАЦІЇ ядра — понад усе.</tspan><tspan x="542.0" dy="13.7">Інтерфейс може бути грубим, а роботу</tspan><tspan x="542.0" dy="13.7">(повтор циклу, перевірки) перекладено нагору.</tspan></text>
<rect x="30.0" y="178.0" width="160.0" height="70.0" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="110.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">Коректність</tspan><tspan x="110.0" dy="14.3">(Correctness)</tspan></text>
<rect x="200.0" y="178.0" width="320.0" height="70.0" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
<text x="212.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="212.0" dy="0.0">Абсолютна в усіх аспектах. Некоректність</tspan><tspan x="212.0" dy="13.7">чи часткове виконання категорично</tspan><tspan x="212.0" dy="13.7">заборонені архітектурою.</tspan></text>
<rect x="530.0" y="178.0" width="320.0" height="70.0" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
<text x="542.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="542.0" dy="0.0">Коректність бажана, але простота важливіша.</tspan><tspan x="542.0" dy="13.7">Ядро може повернути помилку або частину</tspan><tspan x="542.0" dy="13.7">байтів (short read), знявши із себе клопіт.</tspan></text>
<rect x="30.0" y="254.0" width="160.0" height="70.0" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="110.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">Узгодженість</tspan><tspan x="110.0" dy="14.3">(Consistency)</tspan></text>
<rect x="200.0" y="254.0" width="320.0" height="70.0" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
<text x="212.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="212.0" dy="0.0">Повна однорідність концепцій. Жодних</tspan><tspan x="212.0" dy="13.7">винятків чи аварійних виходів; уся</tspan><tspan x="212.0" dy="13.7">система розмовляє однією мовою.</tspan></text>
<rect x="530.0" y="254.0" width="320.0" height="70.0" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
<text x="542.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="542.0" dy="0.0">Добра, але допускаються компроміси.</tspan><tspan x="542.0" dy="13.7">Якщо уніфікація ускладнює ядро — додають</tspan><tspan x="542.0" dy="13.7">ioctl або простий прапорець.</tspan></text>
<rect x="30.0" y="330.0" width="160.0" height="70.0" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
<text x="110.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="110.0" dy="0.0">Повнота</tspan><tspan x="110.0" dy="14.3">(Completeness)</tspan></text>
<rect x="200.0" y="330.0" width="320.0" height="70.0" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.2"/>
<text x="212.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="212.0" dy="0.0">Система мусить покривати 100% відомих</tspan><tspan x="212.0" dy="13.7">і можливих крайових ситуацій наперед.</tspan></text>
<rect x="530.0" y="330.0" width="320.0" height="70.0" rx="4" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
<text x="542.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="542.0" dy="0.0">Покрити ~80% типових випадків просто.</tspan><tspan x="542.0" dy="13.7">Рідкісні крайові випадки віддають на відкуп</tspan><tspan x="542.0" dy="13.7">користувацькому простору.</tspan></text>
<rect x="30.0" y="408.0" width="820.0" height="32.0" rx="4" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2"/>
<text x="430.0" y="428.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#0f172a" text-anchor="middle" font-weight="700">Результат: «Правильний шхід» гине від складності та ваги; «Гірше — це краще» легко портується і захоплює світ.</text>
</svg>