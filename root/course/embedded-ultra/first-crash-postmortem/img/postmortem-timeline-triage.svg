<circle cx="640.0" cy="240.0" r="6.0" fill="#c0392b" stroke="#ffffff" stroke-width="2.0"/>
<line x1="640.0" y1="220.0" x2="640.0" y2="280.0" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="3,3"/>
<text x="640.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">T_saturation</text>
<circle cx="880.0" cy="240.0" r="6.0" fill="#1a1a1a" stroke="#ffffff" stroke-width="2.0"/>
<line x1="880.0" y1="220.0" x2="880.0" y2="280.0" stroke="#1a1a1a" stroke-width="1.8" stroke-dasharray="3,3"/>
<text x="880.0" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">T_crash</text>
<rect x="180.0" y="320.0" width="740.0" height="90.0" rx="8" fill="#eef3fb" stroke="#2457d6" stroke-width="1.8"/>
<text x="550.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">МЕТОДИКА РОЗСЛІДУВАННЯ: РУХ НАЗАД У ЧАСІ (ТВОРЧИЙ ТРІАЖ)</text>
<line x1="850.0" y1="375.0" x2="220.0" y2="375.0" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="550.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крок 1 (T_crash: фіксація удару) ──► Крок 2 (T_sat: перевірка мікшера) ──► Крок 3 (T_trigger: першопричина)</text>
