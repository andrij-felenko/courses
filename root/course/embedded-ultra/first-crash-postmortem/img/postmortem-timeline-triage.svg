<text x="950.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#fca5a5" text-anchor="middle">G-удар акселерометра</text>
<text x="950.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#fca5a5" text-anchor="middle">Піковий стрибок струму</text>
<text x="950.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#ffffff" text-anchor="middle">Аварійний Disarm / обрив</text>
