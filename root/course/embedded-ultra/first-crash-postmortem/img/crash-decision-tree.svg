<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 1110 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="1110" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="550.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дерево рішень постмортему: покрокова локалізація причини аварії за Blackbox</text>
<rect x="404.5" y="51.8" width="290.9" height="46.5" rx="6" fill="#eef3fb" stroke="#1a1a1a" stroke-width="1.5"/><text x="550.0" y="71.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">1. Чи завершився лог коректно?</tspan><tspan x="550.0" dy="15.0">(Перевірка прапорця Disarm та напруги)</tspan></text>
<line x1="453.0" y1="98.2" x2="220.0" y2="160.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="326.5" y="129.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">НІ (обрив)</text>
<rect x="102.3" y="154.3" width="235.5" height="71.4" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="173.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">ЖИВЛЕННЯ: BROWNOUT RESET</tspan><tspan x="220.0" dy="13.7">Лог обірвано mid-air без Disarm.</tspan><tspan x="220.0" dy="13.7">Причина: просідання Vbat, дефект BEC</tspan><tspan x="220.0" dy="13.7">або коротке замикання силової шини.</tspan></text>
<line x1="647.0" y1="98.2" x2="750.0" y2="160.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="708.5" y="122.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">ТАК (є Disarm)</text>
<rect x="590.0" y="167.3" width="320.1" height="45.3" rx="6" fill="#fdfbf7" stroke="#27ae60" stroke-width="1.5"/><text x="750.0" y="186.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="750.0" dy="0.0">2. Чи є розбіжність між бажаним і кутом?</tspan><tspan x="750.0" dy="14.3">(Помилка стеження e(t) &gt; 30° триває &gt; 50 мс)</tspan></text>
<line x1="856.7" y1="212.7" x2="950.0" y2="290.0" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="910.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">НІ (e ≈ 0)</text>
<rect x="845.1" y="287.5" width="209.8" height="65.0" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="950.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="950.0" dy="0.0">ПЕРЕШКОДА / ПІЛОТ / FAILSAFE</tspan><tspan x="950.0" dy="13.0">Апарат ідеально виконував команди</tspan><tspan x="950.0" dy="13.0">до фізичного контакту із землею.</tspan><tspan x="950.0" dy="13.0">Перевірити: радіолінк та Failsafe.</tspan></text>
<line x1="670.0" y1="212.7" x2="550.0" y2="290.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="625.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">ТАК (зрив)</text>
<rect x="393.4" y="297.4" width="313.3" height="45.3" rx="6" fill="#fdfbf7" stroke="#c0392b" stroke-width="1.5"/><text x="550.0" y="316.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="550.0" dy="0.0">3. Чи завис один із моторів на 100%?</tspan><tspan x="550.0" dy="14.3">(Сатурація мікшера: M_x = 100%, M_opp = 0%)</tspan></text>
<line x1="471.7" y1="342.6" x2="380.0" y2="415.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="410.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">ТАК (1 мотор 100%)</text>
<rect x="247.5" y="413.7" width="265.1" height="62.6" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="380.0" y="429.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">ДЕСИНХРОН ESC / ВТРАТА ГВИНТА</tspan><tspan x="380.0" dy="12.3">Мотор на 100%, але кутове прискорення нульове.</tspan><tspan x="380.0" dy="12.3">Розрізнення: струм зріс → десинхрон;</tspan><tspan x="380.0" dy="12.3">струм впав → відкрутився пропелер.</tspan></text>
<line x1="628.3" y1="342.6" x2="720.0" y2="415.0" stroke="#8e44ad" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="690.0" y="355.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#8e44ad" text-anchor="middle" font-weight="700">НІ (дикий дзвін усіх)</text>
<rect x="592.9" y="413.7" width="254.3" height="62.6" rx="6" fill="#fff2e6" stroke="#8e44ad" stroke-width="1.5"/><text x="720.0" y="429.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="720.0" dy="0.0">РЕЗОНАНС РАМИ / ПЕРЕРЕГУЛЮВАННЯ D</tspan><tspan x="720.0" dy="12.3">Мотори синхронно пиляють на високій частоті.</tspan><tspan x="720.0" dy="12.3">Причина: розхитаний промінь, шум гіроскопа,</tspan><tspan x="720.0" dy="12.3">завеликий D-терм або пізні фільтри.</tspan></text>
</svg>