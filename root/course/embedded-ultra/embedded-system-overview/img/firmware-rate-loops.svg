<rect x="40.0" y="270.0" width="680.0" height="55.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/>
<text x="60.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="start" font-weight="700">10 Гц (кожні 100 ms)</text>
<text x="240.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Фоновий моніторинг: напруга батареї, надсилання пакетів телеметрії, світлодіоди</text>
