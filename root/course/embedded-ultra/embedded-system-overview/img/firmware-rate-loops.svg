<text x="60.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">2 кГц (кожні 500 µs)</text>
<text x="240.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Контур кутів: злиття вимірів акселерометра й гіроскопа (фільтр Махоні / Калмана)</text>
<line x1="120.0" y1="175.0" x2="120.0" y2="195.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="130.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">поділ частоти ÷ 40</text>
<rect x="40.0" y="195.0" width="680.0" height="55.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/>
<text x="60.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="start" font-weight="700">50 Гц (кожні 20 ms)</text>
<text x="240.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">Контур висоти та позиції: опитування барометра й GNSS, утримання координати</text>
