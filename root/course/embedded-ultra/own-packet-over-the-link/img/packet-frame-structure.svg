<text x="514.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#db2777" text-anchor="middle" font-weight="700">Покриття CRC-16: байти заголовка (MSG_ID, SEQ, LEN) + корисне навантаження PAYLOAD</text>
<rect x="40.0" y="205.0" width="270.0" height="195.0" rx="6" fill="#f8fafc" stroke="#c0392b" stroke-width="1.4"/>
<rect x="40.0" y="205.0" width="270.0" height="32.0" rx="6" fill="#c0392b" stroke="#c0392b" stroke-width="1.4"/>
<text x="175.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Синхронізація (0xAA55)</text>
<text x="56.0" y="249.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="56.0" dy="0.0">2 байти з чергуванням бітів (10101010 01010101). Захищає від зсуву фази UART та випадкового шуму лінії.</tspan></text>
<text x="56.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Ймовірність хибного шуму:</text>
<text x="56.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">P = 1 / 65536 ≈ 0.0015%</text>
<rect x="325.0" y="205.0" width="290.0" height="195.0" rx="6" fill="#f8fafc" stroke="#0284c7" stroke-width="1.4"/>
<rect x="325.0" y="205.0" width="290.0" height="32.0" rx="6" fill="#0284c7" stroke="#0284c7" stroke-width="1.4"/>
<text x="470.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Заголовок і довжина</text>
<text x="341.0" y="273.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="341.0" dy="0.0">MSG_ID визначає структуру даних, SEQ відстежує втрату пакетів у каналі, LEN обмежує кадр у статичний буфер.</tspan></text>
<text x="341.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Статичний максимум буфера:</text>
<text x="341.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0284c7" text-anchor="start" font-weight="700">MAX_PAYLOAD = 64 байти</text>
<rect x="630.0" y="205.0" width="290.0" height="195.0" rx="6" fill="#f8fafc" stroke="#db2777" stroke-width="1.4"/>
<rect x="630.0" y="205.0" width="290.0" height="32.0" rx="6" fill="#db2777" stroke="#db2777" stroke-width="1.4"/>
<text x="775.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700">Контроль цілісності (CRC-16)</text>
<text x="646.0" y="261.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start"><tspan x="646.0" dy="0.0">Поліном 0x1021 (CCITT), ініціалізація 0xFFFF. Гарантує виявлення 100% пакетних завад довжиною до 16 бітів.</tspan></text>
<text x="646.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">Невловлені багатобітові завади:</text>
<text x="646.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#db2777" text-anchor="start" font-weight="700">P_undetected &lt; 1.5 · 10^(-5)</text>
