<text x="55.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">2. Наївний парсер читає байти 0xAA 0x55 наступного кадру як шматок PAYLOAD першого кадру!</text>
<text x="55.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">3. Наслідок: битий перший пакет + ВТРАТА всіх наступних пакетів до повного переповнення буфера.</text>
