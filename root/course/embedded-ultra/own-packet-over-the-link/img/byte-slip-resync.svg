<text x="55.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Крок 1: Втрата байта порушує довжину першого кадру -&gt; обчислена CRC-16 не зійшлася.</text>
<text x="55.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Крок 2: FSM фіксує помилку контрольної суми, ігнорує пошкоджений кадр і МИТТЄВО повертається у стан WAIT_SYNC1.</text>
<text x="55.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">Крок 3: Наступні байти 0xAA 0x55 точно розпізнаються як преамбула свіжого кадру №2.</text>
<text x="55.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">Результат: втрачено лише 1 пошкоджений пакет. Усі наступні кадри декодуються без жодної затримки!</text>
