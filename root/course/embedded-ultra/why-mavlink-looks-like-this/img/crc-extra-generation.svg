<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 990 490" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="990" height="490" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="490.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Генерація та верифікація CRC_EXTRA в MAVLink</text>
<text x="490.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм CRC_EXTRA: перевірка цілісності каналу та несумісності схем в одній контрольній сумі</text>
<rect x="40.0" y="65.0" width="260.0" height="150.0" rx="6" fill="#f8fafc" stroke="#2457d6" stroke-width="1.5"/>
<text x="170.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">1. XML визначення (ATTITUDE)</text>
<text x="55.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">&lt;message id=&quot;30&quot; name=&quot;ATTITUDE&quot;&gt;</text>
<text x="55.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">  &lt;field type=&quot;uint32_t&quot; name=&quot;time_boot_ms&quot;/&gt;</text>
<text x="55.0" y="151.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">  &lt;field type=&quot;float&quot; name=&quot;roll&quot;/&gt;</text>
<text x="55.0" y="169.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">  &lt;field type=&quot;float&quot; name=&quot;pitch&quot;/&gt;</text>
<text x="55.0" y="187.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">  &lt;field type=&quot;float&quot; name=&quot;yaw&quot;/&gt;</text>
<text x="55.0" y="203.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">&lt;/message&gt;</text>
<line x1="300.0" y1="140.0" x2="350.0" y2="140.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="325.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">mavgen</text>
<rect x="355.0" y="90.0" width="200.0" height="100.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="455.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">2. CRC_EXTRA (1 байт)</text>
<text x="455.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">CRC_EXTRA = 39 (0x27)</text>
<text x="455.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Обчислено зі списку типів та імен</text>
<rect x="600.0" y="65.0" width="340.0" height="150.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.5"/>
<text x="770.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">3. Обчислення фінального CRC-16</text>
<text x="620.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">crc = crc_calculate(Header + Payload)</text>
<text x="620.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="start" font-weight="700">crc_accumulate(CRC_EXTRA, &amp;crc);</text>
<text x="620.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">-&gt; Фінальний CRC (2 байти) записується в кінець кадру</text>
<text x="620.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">⚠️ CRC_EXTRA НЕ передається в радіоканал!</text>
<line x1="555.0" y1="140.0" x2="600.0" y2="140.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="245.0" width="900.0" height="215.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="490.0" y="269.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що відбувається під час прийому повідомлення на наземній станції (GCS)</text>
<rect x="60.0" y="290.0" width="405.0" height="150.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="262.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Сценарій А: Однаковий діалект (CRC_EXTRA = 39)</text>
<text x="80.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1. Отримано байти кадру з ефіру.</text>
<text x="80.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2. Приймач обчислює CRC над даними та додає свій CRC_EXTRA (39).</text>
<text x="80.0" y="387.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">3. Обчислена CRC == Отримана CRC у пакеті.</text>
<text x="80.0" y="413.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start">✓ Пакет валідний. Кути орієнтації відображаються коректно.</text>
<rect x="515.0" y="290.0" width="405.0" height="150.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="717.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Сценарій Б: Несумісна схема (CRC_EXTRA = 184)</text>
<text x="535.0" y="343.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1. На дроні нова прошивка (додано поле sensor_id).</text>
<text x="535.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2. GCS має старий XML: її CRC_EXTRA = 39 != 184.</text>
<text x="535.0" y="387.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">3. Обчислена CRC != Отримана CRC у пакеті!</text>
<text x="535.0" y="413.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">❌ Пакет мовчки відкинуто. Захист від зсуву полів і аварії.</text>
</svg>