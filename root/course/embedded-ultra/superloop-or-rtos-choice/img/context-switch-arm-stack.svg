<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Перемикання контексту в ARM Cortex-M: апаратний та програмний стек</text>
<rect x="90.0" y="65.0" width="220.0" height="370.0" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
<text x="200.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Стек Задачі A (PSP_A)</text>
<rect x="105.0" y="115.0" width="190.0" height="140.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="200.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Апаратне збереження</text>
<text x="115.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">xPSR</text>
<text x="115.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">PC (Return Address)</text>
<text x="115.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">LR (R14)</text>
<text x="115.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">R12, R3, R2, R1, R0</text>
<rect x="105.0" y="265.0" width="190.0" height="140.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="200.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Програмне збереження (PendSV)</text>
<text x="115.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">R11, R10, R9, R8</text>
<text x="115.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">R7, R6, R5, R4</text>
<text x="115.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">stmdb r0!, {r4-r11}</text>
<text x="115.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Вершина стека SP -&gt; TCB_A</text>
<rect x="360.0" y="130.0" width="170.0" height="240.0" rx="8" fill="#fdf0e6" stroke="#c0392b" stroke-width="2.0"/>
<text x="445.0" y="155.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Планувальник (PendSV)</text>
<text x="372.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">1. Зберегти PSP_A</text>
<text x="372.0" y="211.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">2. current_tcb = next</text>
<text x="372.0" y="237.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">3. Відновити PSP_B</text>
<text x="372.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">4. ldmia r0!, {r4-r11}</text>
<text x="372.0" y="289.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">5. bx EXC_RETURN</text>
<text x="372.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">   (0xFFFFFFFD)</text>
<line x1="310.0" y1="370.0" x2="360.0" y2="230.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="530.0" y1="250.0" x2="570.0" y2="370.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="570.0" y="65.0" width="220.0" height="370.0" rx="8" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
<text x="680.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Стек Задачі B (PSP_B)</text>
<rect x="585.0" y="115.0" width="190.0" height="140.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="680.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">Апаратне відновлення</text>
<text x="595.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">xPSR</text>
<text x="595.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">PC (Return Address)</text>
<text x="595.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">LR (R14)</text>
<text x="595.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">R12, R3, R2, R1, R0</text>
<rect x="585.0" y="265.0" width="190.0" height="140.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.6"/>
<text x="680.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">Програмне відновлення</text>
<text x="595.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">ldmia r0!, {r4-r11}</text>
<text x="595.0" y="332.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Відновлює R4-R11</text>
<text x="595.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">msr psp, r0</text>
<text x="595.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="start">Апарат розгортає решту</text>
<rect x="182.1" y="466.5" width="515.9" height="43.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="485.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">ARM Cortex-M ділить перемикання на дві фази: апарат зберігає R0-R3, R12, LR, PC, xPSR,</tspan><tspan x="440.0" dy="13.0">а обробник PendSV зберігає R4-R11 й перемикає покажчик у блоці керування задачею (TCB).</tspan></text>
</svg>