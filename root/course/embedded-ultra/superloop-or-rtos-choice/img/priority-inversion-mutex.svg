<rect x="178.2" y="424.9" width="523.6" height="54.2" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="443.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Інверсія пріоритетів: низька задача тримає м'ютекс, середня витісняє її,</tspan><tspan x="440.0" dy="12.3">а критична висока задача безпорадно чекає. Лікування: протокол успадкування пріоритету (PIP),</tspan><tspan x="440.0" dy="12.3">який тимчасово піднімає пріоритет задачі Flash до рівня задачі Гіроскопа.</tspan></text>
