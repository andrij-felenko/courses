<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Джерела магнітних спотворень на борту</text>
<text x="480.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Магнітні збурення на борту: Hard-Iron, Soft-Iron та струми силових ліній</text>
<rect x="40.0" y="60.0" width="275.0" height="375.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="177.5" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Hard-Iron (Тверде залізо)</text>
<text x="177.5" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Постійне зміщення центру сфери</text>
<circle cx="177.5" cy="200.0" r="55" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3,3"/>
<circle cx="201.5" cy="182.0" r="55.0" fill="#fee2e2" stroke="#c0392b" stroke-width="2.0"/>
<line x1="177.5" y1="200.0" x2="201.5" y2="182.0" stroke="#c0392b" stroke-width="2.0"/>
<circle cx="201.5" cy="182.0" r="3.0" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
<text x="209.5" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">V_bias</text>
<rect x="52.0" y="285.0" width="251.0" height="135.0" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="60.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Джерело:</text>
<text x="60.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Постійні магніти моторів</text>
<text x="60.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Намагнічені сталеві гвинти</text>
<text x="60.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Зумер / динамік</text>
<text x="60.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">Математична корекція:</text>
<text x="60.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">B_cal = B_raw - V_bias</text>
<rect x="342.0" y="60.0" width="275.0" height="375.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="479.5" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Soft-Iron (М'яке залізо)</text>
<text x="479.5" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Деформація сфери в еліпсоїд</text>
<circle cx="479.5" cy="200.0" r="55" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="3,3"/>
<ellipse cx="479.5" cy="200.0" rx="68" ry="38" transform="rotate(-30 479.5 200.0)" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<circle cx="479.5" cy="200.0" r="3.0" fill="#d97706" stroke="#d97706" stroke-width="1.5"/>
<rect x="354.0" y="285.0" width="251.0" height="135.0" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.0"/>
<text x="362.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">Джерело:</text>
<text x="362.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Феромагнітні деталі рами</text>
<text x="362.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Нікелеві виводи акумулятора</text>
<text x="362.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">• Екрани роз'ємів і плат</text>
<text x="362.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">Математична корекція:</text>
<text x="362.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">B_cal = W_matrix · (B_raw - V)</text>
<rect x="644.0" y="60.0" width="275.0" height="375.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="2.0"/>
<text x="781.5" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">Динамічний струм (ESC / Мотори)</text>
<text x="781.5" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Поле струму перекриває геомагнітне</text>
<circle cx="746.5" cy="200.0" r="14.0" fill="#fee2e2" stroke="#c0392b" stroke-width="2.0"/>
<text x="746.5" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">I</text>
<text x="746.5" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">40–100 А</text>
<circle cx="746.5" cy="200.0" r="40" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
<line x1="786.5" y1="195.0" x2="786.5" y2="215.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="806.5" y="185.0" width="45.0" height="30.0" rx="3" fill="#e2e8f0" stroke="#333333" stroke-width="1.2"/>
<text x="828.5" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">Mag</text>
<line x1="828.5" y1="215.0" x2="828.5" y2="248.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="836.5" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="start" font-weight="700">B_I = 160 мкТл</text>
<line x1="828.5" y1="185.0" x2="828.5" y2="162.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="836.5" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="start" font-weight="700">B_землі = 45 мкТл</text>
<rect x="656.0" y="285.0" width="251.0" height="135.0" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1.0"/>
<text x="664.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">Наслідок для польоту:</text>
<text x="664.0" y="323.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">• B_струму в 3–5 разів &gt; B_землі</text>
<text x="664.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">• При дачі газу курс стрибає на 90°</text>
<text x="664.0" y="357.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start">• Автопілот входить у розкачку курсу</text>
<text x="664.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">Рішення: виніс на щоглу / EKF</text>
<text x="664.0" y="398.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">та динамічна компенсація I·k</text>
</svg>