<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 510" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="510" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура орієнтаційного фільтра IMU</text>
<text x="480.0" y="42.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура орієнтаційного фільтра IMU: замкнений контур злиття Махоні / EKF</text>
<rect x="40.0" y="65.0" width="160.0" height="400.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="120.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Первинні давачі</text>
<rect x="50.0" y="105.0" width="140.0" height="80.0" rx="5" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
<text x="120.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="700">Гіроскоп (ω)</text>
<text x="120.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">3-осьова кутова швидкість [рад/с]</text>
<rect x="50.0" y="197.0" width="140.0" height="80.0" rx="5" fill="#e0f2fe" stroke="#2457d6" stroke-width="1.2"/>
<text x="120.0" y="219.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Акселерометр (a)</text>
<text x="120.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">3-осьова питома сила [g / м/с²]</text>
<rect x="50.0" y="289.0" width="140.0" height="80.0" rx="5" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
<text x="120.0" y="311.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">Магнітометр (m)</text>
<text x="120.0" y="331.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">3-осьовий вектор поля [мкТл]</text>
<rect x="50.0" y="381.0" width="140.0" height="65.0" rx="5" fill="#f1f5f9" stroke="#6b7280" stroke-width="1.2"/>
<text x="120.0" y="403.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">Барометр / GNSS</text>
<text x="120.0" y="423.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">Висота й позиція (для EKF)</text>
<rect x="240.0" y="65.0" width="460.0" height="400.0" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="470.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Орієнтаційний фільтр (Mahony Attitude Observer)</text>
<rect x="260.0" y="110.0" width="420.0" height="75.0" rx="6" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.2"/>
<text x="470.0" y="133.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">1. Розрахунок вектора просторової похибки e</text>
<text x="470.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">e = (a_meas × v_gravity_body) + (m_meas × v_mag_body)</text>
<text x="470.0" y="171.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Векторний добуток виміряного та очікованого векторів</text>
<rect x="260.0" y="200.0" width="420.0" height="80.0" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.2"/>
<text x="470.0" y="223.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7c3aed" text-anchor="middle" font-weight="700">2. ПІ-компенсація зміщення гіроскопа (Bias Tracking)</text>
<text x="470.0" y="243.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">b_gyro += Ki · e · dt   (інтегратор накопичує дрейф нуля)</text>
<text x="470.0" y="263.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">ω_corr = ω_raw - b_gyro + Kp · e   (виправлена кутова швидкість)</text>
<rect x="260.0" y="295.0" width="420.0" height="80.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.2"/>
<text x="470.0" y="318.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">3. Чисельне інтегрування кватерніона орієнтації</text>
<text x="470.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">q_dot = 0.5 · q ⊗ [0, ω_corr]   →   q_new = q + q_dot · dt</text>
<text x="470.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">q = q / ||q||   (обов'язкова унітарна нормалізація)</text>
<rect x="260.0" y="390.0" width="420.0" height="60.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.2"/>
<text x="470.0" y="413.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">4. Розрахунок очікуваних векторів у системі апарата</text>
<text x="470.0" y="433.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">v_gravity_body = R(q)^T · [0, 0, 1]^T  →  передається у блок 1</text>
<line x1="190.0" y1="140.0" x2="260.0" y2="240.0" stroke="#7c3aed" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="190.0" y1="230.0" x2="260.0" y2="145.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="190.0" y1="320.0" x2="260.0" y2="160.0" stroke="#d97706" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="740.0" y="65.0" width="180.0" height="400.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="2.0"/>
<text x="830.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Оцінений стан (State)</text>
<rect x="750.0" y="110.0" width="160.0" height="60.0" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
<text x="830.0" y="130.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Кватерніон q</text>
<text x="830.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">[q0, q1, q2, q3]</text>
<text x="830.0" y="162.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Без Gimbal Lock</text>
<rect x="750.0" y="180.0" width="160.0" height="60.0" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="830.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Кути Ейлера</text>
<text x="830.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Roll, Pitch, Yaw</text>
<text x="830.0" y="232.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">(для телеметрії)</text>
<rect x="750.0" y="250.0" width="160.0" height="65.0" rx="5" fill="#ffffff" stroke="#7c3aed" stroke-width="1.2"/>
<text x="830.0" y="270.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#7c3aed" text-anchor="middle" font-weight="700">Кутова швидкість</text>
<text x="830.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">ω_corr (чиста від bias)</text>
<text x="830.0" y="302.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">для ПІД-регулятора</text>
<rect x="750.0" y="325.0" width="160.0" height="65.0" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
<text x="830.0" y="345.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Оцінене зміщення</text>
<text x="830.0" y="363.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">b_gyro (компенсований</text>
<text x="830.0" y="377.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">дрейф нуля)</text>
<line x1="680.0" y1="335.0" x2="750.0" y2="140.0" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="680.0" y1="240.0" x2="750.0" y2="280.0" stroke="#7c3aed" stroke-width="2.0" marker-end="url(#arrow)"/>
</svg>