<text x="590.0" y="362.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Якщо переплутано виводи M1 та M2 або реверсовано гіроскоп,</text>
