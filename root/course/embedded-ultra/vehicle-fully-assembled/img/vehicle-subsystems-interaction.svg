<text x="510.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Барометр MS5611 / BMP280</text>
<text x="510.0" y="360.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">захист поролоном від світла й тиску гвинтів</text>
<rect x="380.0" y="375.0" width="300.0" height="65.0" rx="4" fill="#edf7ed" stroke="#27ae60" stroke-width="1.5"/>
<text x="510.0" y="395.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Модуль перевірок Pre-Arm &amp; EKF</text>
<text x="510.0" y="413.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">перевірка сенсорів, живлення, RC, EKF</text>
<text x="510.0" y="429.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">блокування активації вихідних ШІМ-таймерів</text>
<rect x="40.0" y="310.0" width="290.0" height="150.0" rx="8" fill="#fafbfc" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="185.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Безпека та оператор</text>
<text x="60.0" y="365.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• RC-радіолінк: стік газу в нулі</text>
<text x="60.0" y="390.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Фізичний перемикач Safety Switch</text>
<text x="60.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• GNSS антена: 3D Fix + HDOP &lt; 1.4</text>
<text x="60.0" y="440.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Телеметрія MAVLink до наземної GCS</text>
