<text x="875.0" y="84.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Механіка та приводи</text>
<text x="750.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• 4 безколекторні мотори (BLDC)</text>
<text x="750.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Пропелери: дисбаланс мас m_imb</text>
<text x="750.0" y="165.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Акустичні й структурні вібрації 100–500 Гц</text>
<text x="750.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Центр мас CoG відносно центру тяги</text>
<text x="750.0" y="215.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">• Жорсткість променів та рами</text>
<rect x="360.0" y="180.0" width="340.0" height="280.0" rx="10" fill="#f9fbfd" stroke="#27ae60" stroke-width="2.0"/>
<text x="530.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">Польотний контролер (FCU)</text>
