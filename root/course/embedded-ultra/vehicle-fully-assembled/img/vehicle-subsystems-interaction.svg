<text x="510.0" y="260.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">демпфування силіконом, низькочастотні LPF</text>
<rect x="380.0" y="275.0" width="300.0" height="42.0" rx="4" fill="#ffffff" stroke="#333333" stroke-width="1.2"/>
<text x="510.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Магнітометр (компас)</text>
<text x="510.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">винос на щоглу, компенсація струму</text>
