<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 830 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="830" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Каскадний ланцюг виникнення та поширення відмов у безпілотному апараті</text>
<rect x="20.0" y="15.0" width="780.0" height="40.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="410.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">ДОМЕНИ ПЕРВИННИХ ВІДМОВ ТА ЛАНЦЮГ КАСКАДНОЇ КАТАСТРОФИ</text>
<rect x="30.0" y="70.0" width="180.0" height="100.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="120.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Механічний домен</text>
<text x="120.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">Зрив лопаті, дебаланс,</tspan><tspan x="120.0" dy="12.3">перегрів підшипника,</tspan><tspan x="120.0" dy="12.3">руйнування кріплення</tspan></text>
<line x1="120.0" y1="170.0" x2="120.0" y2="205.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="225.0" y="70.0" width="180.0" height="100.0" rx="6" fill="#fffaf0" stroke="#d97706" stroke-width="1.8"/>
<text x="315.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="middle" font-weight="700">Електричний домен</text>
<text x="315.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="315.0" dy="0.0">Просідання батареї,</tspan><tspan x="315.0" dy="12.3">BOD-скидання MCU,</tspan><tspan x="315.0" dy="12.3">індуктивний викид ESC</tspan></text>
<line x1="315.0" y1="170.0" x2="315.0" y2="205.0" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="420.0" y="70.0" width="180.0" height="100.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
<text x="510.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Сенсорний домен</text>
<text x="510.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="510.0" dy="0.0">Кліпінг MEMS IMU,</tspan><tspan x="510.0" dy="12.3">завади компаса від струмів,</tspan><tspan x="510.0" dy="12.3">девіація барометра</tspan></text>
<line x1="510.0" y1="170.0" x2="510.0" y2="205.0" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="615.0" y="70.0" width="180.0" height="100.0" rx="6" fill="#f4fbf6" stroke="#27ae60" stroke-width="1.8"/>
<text x="705.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Програмний домен</text>
<text x="705.0" y="115.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="705.0" dy="0.0">Зависання шини I2C,</tspan><tspan x="705.0" dy="12.3">інверсія пріоритетів RTOS,</tspan><tspan x="705.0" dy="12.3">переповнення буфера</tspan></text>
<line x1="705.0" y1="170.0" x2="705.0" y2="205.0" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arrow)"/>
<rect x="30.0" y="205.0" width="760.0" height="80.0" rx="8" fill="#ffffff" stroke="#333333" stroke-width="2.0"/>
<text x="410.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">ЕТАП КАСКАДНОГО ПОШИРЕННЯ ТА ВТРАТИ КЕРОВАНОСТІ</text>
<rect x="45.0" y="238.0" width="220.0" height="38.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="155.0" y="254.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="155.0" dy="0.0">1. Насичення інтегратора PID</tspan><tspan x="155.0" dy="12.3">та перекос тяги двигунів</tspan></text>
<line x1="265.0" y1="257.0" x2="295.0" y2="257.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="295.0" y="238.0" width="225.0" height="38.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="407.5" y="254.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="407.5" dy="0.0">2. Стрибок струму на здорових плечах</tspan><tspan x="407.5" dy="12.3">та просідання живлення шини</tspan></text>
<line x1="520.0" y1="257.0" x2="550.0" y2="257.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="550.0" y="238.0" width="225.0" height="38.0" rx="6" fill="#f8fafc" stroke="#6b7280" stroke-width="1.5"/><text x="662.5" y="254.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="662.5" dy="0.0">3. Зрив оцінки просторового стану</tspan><tspan x="662.5" dy="12.3">(EKF divergence / IMU lock)</tspan></text>
<line x1="250.0" y1="285.0" x2="200.0" y2="325.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="180.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-weight="700">Без Failsafe</text>
<line x1="570.0" y1="285.0" x2="620.0" y2="325.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="640.0" y="305.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="start" font-weight="700">З активним Failsafe</text>
<rect x="30.0" y="325.0" width="360.0" height="75.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="210.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">КАТАСТРОФІЧНА ВІДМОВА (CRASH)</text>
<text x="210.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Неконтрольоване обертання, Brownout-скид,</tspan><tspan x="210.0" dy="12.3">падіння на повній швидкості без захисту</tspan></text>
<rect x="430.0" y="325.0" width="360.0" height="75.0" rx="6" fill="#f4fbf6" stroke="#27ae60" stroke-width="2.0"/>
<text x="610.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">КЕРОВАНА ДЕГРАДАЦІЯ ТА СПАСІННЯ</text>
<text x="610.0" y="368.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="610.0" dy="0.0">Десатурація PID, вимикання битого мотора,</tspan><tspan x="610.0" dy="12.3">аварійна посадка або викид парашута</tspan></text>
</svg>