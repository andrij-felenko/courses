<rect x="500.0" y="95.0" width="275.0" height="85.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="637.5" y="122.3" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="637.5" dy="0.0">Блокування:</tspan><tspan x="637.5" dy="12.3">Після перезавантаження MCU бачить SDA=0,</tspan><tspan x="637.5" dy="12.3">вважає шину зайнятою іншим Master</tspan><tspan x="637.5" dy="12.3">і зависає у нескінченному while-циклі!</tspan></text>
