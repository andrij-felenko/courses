<text x="410.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Механізм апаратного зависання I2C та процедура скидання 9 тактами</text>
<rect x="20.0" y="15.0" width="780.0" height="40.0" rx="6" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="410.0" y="40.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">МЕХАНІЗМ ЗАХОПЛЕННЯ ШИНИ I2C ТА ПРОЦЕДУРА АПАРАТНОГО РОЗБЛОКУВАННЯ</text>
<rect x="30.0" y="70.0" width="760.0" height="125.0" rx="6" fill="#fffaf0" stroke="#d97706" stroke-width="1.8"/>
<text x="50.0" y="92.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#d97706" text-anchor="start" font-weight="700">1. Фаза збою: ведучий (MCU) скидається, коли ведений (Slave) тримає SDA = 0</text>
<text x="50.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start" font-weight="700">SCL (Master)</text>
