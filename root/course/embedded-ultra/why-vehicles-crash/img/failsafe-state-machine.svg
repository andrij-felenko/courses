<text x="680.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">Втрата зв'язку RC &gt; 1.5 с</tspan><tspan x="680.0" dy="10.8">Набір безпечної висоти</tspan><tspan x="680.0" dy="10.8">Автоповернення на базу</tspan></text>
