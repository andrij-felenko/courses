<text x="390.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="middle" font-weight="700">2. SENSOR DEGRADED</text>
<text x="390.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Перемикання EKF lane</tspan><tspan x="390.0" dy="10.8">Фільтрація завад компаса</tspan><tspan x="390.0" dy="10.8">Заморозка I-терма PID</tspan></text>
