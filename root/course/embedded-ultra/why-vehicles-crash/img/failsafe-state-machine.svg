<text x="120.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">1. NORMAL</text>
<text x="120.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="120.0" dy="0.0">Усі давачі валідні</tspan><tspan x="120.0" dy="10.8">Радіозв'язок стабільний</tspan><tspan x="120.0" dy="10.8">Напруга в нормі</tspan></text>
