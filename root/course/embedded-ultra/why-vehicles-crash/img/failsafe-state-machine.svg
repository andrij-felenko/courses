<line x1="490.0" y1="292.0" x2="580.0" y2="292.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="535.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">Перекидання</text>
