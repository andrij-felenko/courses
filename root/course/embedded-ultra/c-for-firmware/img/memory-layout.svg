<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="19.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розподіл пам'яті прошивки між Flash та SRAM</text>
<text x="480.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розподіл пам'яті мікроконтролера: Flash (енергонезалежна) та SRAM (оперативна)</text>
<rect x="80.0" y="70.0" width="360.0" height="410.0" rx="8" fill="#f8fafc" stroke="#27ae60" stroke-width="2.0"/>
<text x="260.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">FLASH ROM (0x08000000)</text>
<text x="260.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Енергонезалежна пам'ять програм і сталих даних</text>
<rect x="96.0" y="128.0" width="328.0" height="50.0" rx="6" fill="#eaf2ec" stroke="#27ae60" stroke-width="1.5"/>
<text x="110.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">.vector_table</text>
<text x="110.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Вектори скидання та переривань (MSP, Reset, HardFault, ISR)</text>
<rect x="96.0" y="186.0" width="328.0" height="120.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="110.0" y="208.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">.text</text>
<text x="110.0" y="226.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Машинний код функцій та інструкцій процесора</text>
<rect x="96.0" y="314.0" width="328.0" height="60.0" rx="6" fill="#eaf2ec" stroke="#27ae60" stroke-width="1.5"/>
<text x="110.0" y="336.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">.rodata</text>
<text x="110.0" y="354.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Константи, рядкові літерали, статичні таблиці</text>
<rect x="96.0" y="382.0" width="328.0" height="60.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="110.0" y="404.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#d97706" text-anchor="start" font-weight="700">.data (образ)</text>
<text x="110.0" y="422.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Початкові значення ініціалізованих змінних</text>
<rect x="520.0" y="70.0" width="360.0" height="410.0" rx="8" fill="#f8fafc" stroke="#2457d6" stroke-width="2.0"/>
<text x="700.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">SRAM (0x20000000)</text>
<text x="700.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Швидка оперативна пам'ять змінного стану</text>
<rect x="536.0" y="128.0" width="328.0" height="52.0" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
<text x="550.0" y="148.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#d97706" text-anchor="start" font-weight="700">.data (активна)</text>
<text x="550.0" y="164.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Глобальні змінні з початковим значенням (копія з Flash)</text>
<rect x="536.0" y="186.0" width="328.0" height="52.0" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
<text x="550.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0284c7" text-anchor="start" font-weight="700">.bss (обнулена)</text>
<text x="550.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Неініціалізовані глобальні та статичні змінні (zeroed)</text>
<rect x="536.0" y="244.0" width="328.0" height="54.0" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.5"/>
<text x="550.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="start" font-weight="700">Heap (Купа)</text>
<text x="550.0" y="298.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Динамічна пам'ять (malloc/free) — табу у критичних прошивках</text>
<rect x="536.0" y="304.0" width="328.0" height="48.0" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
<text x="550.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#94a3b8" text-anchor="start" font-weight="700">Вільний простір</text>
<text x="550.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Зазор безпеки між купою та стеком (запобігає накладанню)</text>
<rect x="536.0" y="358.0" width="328.0" height="70.0" rx="6" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
<text x="550.0" y="378.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#7c3aed" text-anchor="start" font-weight="700">Stack (Стек)</text>
<text x="550.0" y="394.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Кадри функцій, локальні змінні, регістри ISR (росте вниз)</text>
<line x1="424.0" y1="408.0" x2="536.0" y2="154.0" stroke="#d97706" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="480.0" y="255.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#d97706" text-anchor="middle" font-weight="700">startup копіює .data</text>
<line x1="844.0" y1="265.0" x2="844.0" y2="305.0" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="838.0" y="285.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="end">↑ ріст</text>
<line x1="844.0" y1="450.0" x2="844.0" y2="410.0" stroke="#7c3aed" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="838.0" y="423.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7c3aed" text-anchor="end">↓ ріст</text>
</svg>