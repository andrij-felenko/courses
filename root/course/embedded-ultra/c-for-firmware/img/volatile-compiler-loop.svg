<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 450" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="450" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Генерація асемблера для опитування регістрів з volatile та без</text>
<text x="480.0" y="44.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Компіляція циклу опитування апаратного регістра: без volatile проти volatile</text>
<rect x="50.0" y="60.0" width="410.0" height="350.0" rx="8" fill="#fef2f2" stroke="#c0392b" stroke-width="2.0"/>
<text x="255.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">БЕЗ volatile — Фатальна оптимізація</text>
<rect x="70.0" y="106.0" width="370.0" height="60.0" rx="4" fill="#ffffff" stroke="#fca5a5" stroke-width="1.2"/>
<text x="82.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">// C-код опитування апаратного прапорця</text>
<text x="82.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">while (!(UART_SR &amp; RXNE_FLAG));</text>
<rect x="70.0" y="178.0" width="370.0" height="78.0" rx="4" fill="#fff5f5" stroke="#c0392b" stroke-width="1.0"/>
<text x="82.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="start" font-weight="700">Оптимізатор GCC -O2 міркує:</text>
<text x="82.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1. Змінна UART_SR не змінюється всередині циклу.</text>
<text x="82.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2. Читаю регістр один раз у R0 ДО початку циклу.</text>
<rect x="70.0" y="268.0" width="370.0" height="120.0" rx="4" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
<text x="82.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#38bdf8" text-anchor="start">LDR   R0, [R1]      ; прочитав UART_SR один раз</text>
<text x="82.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#38bdf8" text-anchor="start">TST   R0, #0x20     ; перевірив прапорець</text>
<text x="82.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#f87171" text-anchor="start" font-weight="700">loop:               ; зациклення на старій копії</text>
<text x="82.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#f87171" text-anchor="start" font-weight="700">BEQ   loop          ; зависання назавжди!</text>
<rect x="500.0" y="60.0" width="410.0" height="350.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="2.0"/>
<text x="705.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">З volatile — Коректне апаратне опитування</text>
<rect x="520.0" y="106.0" width="370.0" height="60.0" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1.2"/>
<text x="532.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">// C-код із коректним модифікатором</text>
<text x="532.0" y="150.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="start" font-weight="700">while (!(*(volatile uint32_t *)SR &amp; RXNE));</text>
<rect x="520.0" y="178.0" width="370.0" height="78.0" rx="4" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.0"/>
<text x="532.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="start" font-weight="700">Оптимізатор GCC -O2 виконує контракт:</text>
<text x="532.0" y="218.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">1. volatile забороняє кешувати пам'ять у регістрі.</text>
<text x="532.0" y="236.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">2. Кожна ітерація генерує реальну інструкцію LDR.</text>
<rect x="520.0" y="268.0" width="370.0" height="120.0" rx="4" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
<text x="532.0" y="290.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#4ade80" text-anchor="start" font-weight="700">loop:               ; початок ітерації</text>
<text x="532.0" y="312.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#4ade80" text-anchor="start" font-weight="700">LDR   R0, [R1]      ; щоразу читає шину заліза!</text>
<text x="532.0" y="334.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#38bdf8" text-anchor="start">TST   R0, #0x20     ; перевіряє свіжий біт</text>
<text x="532.0" y="356.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#38bdf8" text-anchor="start">BEQ   loop          ; виходить, щойно байт прибув</text>
</svg>