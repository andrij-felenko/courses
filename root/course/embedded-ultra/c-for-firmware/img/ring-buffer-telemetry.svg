<text x="451.9" y="343.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">0xFF</text>
<circle cx="360.0" cy="370.0" r="30.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
<text x="360.0" y="364.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="700">[4]</text>
<text x="360.0" y="382.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">[вільно]</text>
<circle cx="268.1" cy="331.9" r="30.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
<text x="268.1" y="325.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="700">[5]</text>
<text x="268.1" y="343.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">[вільно]</text>
<circle cx="230.0" cy="240.0" r="30.0" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8"/>
<text x="230.0" y="234.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-weight="700">[6]</text>
<text x="230.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">[вільно]</text>
