<rect x="35.0" y="95.2" width="220.0" height="59.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="114.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">1-бітний суматор (ADD)</tspan><tspan x="145.0" dy="14.3">Sum = A ⊕ B ⊕ Cin</tspan><tspan x="145.0" dy="14.3">Cout = (A∧B) ∨ (Cin∧(A⊕B))</tspan></text>
<rect x="35.0" y="175.2" width="220.0" height="59.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="194.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Побітові логічні вентилі</tspan><tspan x="145.0" dy="14.3">AND, OR, XOR, NOT</tspan><tspan x="145.0" dy="14.3">(паралельно для всіх бітів)</tspan></text>
<rect x="31.5" y="255.2" width="226.9" height="59.6" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="274.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Схема віднімання / інверсії</tspan><tspan x="145.0" dy="14.3">B_inv = B ⊕ Sub_mode</tspan><tspan x="145.0" dy="14.3">Cin = Sub_mode (доповняльний код)</tspan></text>
<rect x="35.0" y="332.4" width="220.0" height="45.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="145.0" y="351.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="145.0" dy="0.0">Зсувач (Barrel Shifter)</tspan><tspan x="145.0" dy="14.3">Логічний/арифметичний зсув</tspan></text>
