<text x="440.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Інтеграція процесорного ядра, пам'яті, шин та периферії в єдиний кристал</text>
