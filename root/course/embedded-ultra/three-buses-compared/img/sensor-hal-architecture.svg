<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 530" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="530" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="18" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура уніфікованого шару абстракції датчиків (HAL)</text>
<text x="440.0" y="48.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Ізоляція алгоритмів стабілізації від конкретної фізичної шини та контролера</text>
<rect x="60.0" y="75.0" width="760.0" height="60.0" rx="6" fill="#ebf5fb" stroke="#2980b9" stroke-width="1.8"/><text x="440.0" y="101.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Рівень застосунку: Оцінка стану (EKF) та Контур стабілізації (PID 1–8 кГц)</tspan><tspan x="440.0" dy="16.9">Отримує стандартизовані структури: imu_data_t (рад/с, м/с²), baro_data_t (Па, °C)</tspan></text>
<line x1="440.0" y1="135.0" x2="440.0" y2="160.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="165.0" width="760.0" height="100.0" rx="6" fill="#fdfefe" stroke="#7f8c8d" stroke-width="1.5"/>
<text x="180.0" y="185.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Драйвери конкретних чипів (Sensor Drivers)</text>
<rect x="80.0" y="195.0" width="220.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="190.0" y="219.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Драйвер ICM-42688-P</tspan><tspan x="190.0" dy="11.7">Конфігурація ODR, FIFO, зчитування 14B</tspan></text>
<rect x="330.0" y="195.0" width="220.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="440.0" y="219.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Драйвер MS5611 / BMP388</tspan><tspan x="440.0" dy="13.0">Команди перетворення, компенсація</tspan></text>
<rect x="580.0" y="195.0" width="220.0" height="55.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="690.0" y="219.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Драйвер IST8310</tspan><tspan x="690.0" dy="11.7">Калібрування поля, періодичне опитування</tspan></text>
<line x1="190.0" y1="265.0" x2="190.0" y2="290.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="440.0" y1="265.0" x2="440.0" y2="290.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="690.0" y1="265.0" x2="690.0" y2="290.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="60.0" y="295.0" width="760.0" height="80.0" rx="6" fill="#fef9e7" stroke="#d35400" stroke-width="2.0"/><text x="440.0" y="322.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="440.0" dy="0.0">Уніфікований інтерфейс шини (Bus Device Interface / C++ Concept)</tspan><tspan x="440.0" dy="16.9">transfer(tx_buf, tx_len, rx_buf, rx_len) • write_reg() • read_reg() • read_burst()</tspan><tspan x="440.0" dy="16.9">Автоматичне керування Chip Select (RAII), транзакціями та повторними спробами</tspan></text>
<line x1="200.0" y1="375.0" x2="200.0" y2="400.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="440.0" y1="375.0" x2="440.0" y2="400.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="680.0" y1="375.0" x2="680.0" y2="400.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="80.0" y="405.0" width="220.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#16a085" stroke-width="1.5"/><text x="190.0" y="431.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="190.0" dy="0.0">Реалізація SPI HAL</tspan><tspan x="190.0" dy="15.6">Керування лінією CS,</tspan><tspan x="190.0" dy="15.6">Prescaler, DMA Burst потік</tspan></text>
<rect x="330.0" y="405.0" width="220.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#2980b9" stroke-width="1.5"/><text x="440.0" y="432.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Реалізація I²C HAL</tspan><tspan x="440.0" dy="14.3">Адресація, ACK перевірка,</tspan><tspan x="440.0" dy="14.3">Bus Recovery авторозблокування</tspan></text>
<rect x="580.0" y="405.0" width="220.0" height="75.0" rx="6" fill="#f4f6f8" stroke="#8e44ad" stroke-width="1.5"/><text x="690.0" y="432.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="690.0" dy="0.0">Реалізація UART HAL</tspan><tspan x="690.0" dy="14.3">Кільцевий буфер (Ring Buffer),</tspan><tspan x="690.0" dy="14.3">IDLE Interrupt + DMA RX</tspan></text>
</svg>