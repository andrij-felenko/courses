<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Неатомарний Read-Modify-Write проти атомарного запису в BSRR / W1TS</text>
<rect x="20.0" y="50.0" width="820.0" height="125.0" rx="6" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/>
<text x="430.0" y="72.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#be123c" text-anchor="middle" font-weight="700">1. Неатомарна операція: PORT-&gt;ODR |= (1 &lt;&lt; 5)  [Read-Modify-Write: стан гонки]</text>
<rect x="35.0" y="88.0" width="220.0" height="72.0" rx="4" fill="#ffffff" stroke="#fda4af" stroke-width="1.0"/>
<text x="145.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Крок 1 (Main thread)</text>
<text x="145.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#0f172a" text-anchor="middle">LDR r0, [ODR]  (r0 = 0x00)</text>
<text x="145.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">ORR r0, #0x20  (хочемо Pin 5)</text>
<line x1="255.0" y1="124.0" x2="290.0" y2="124.0" stroke="#e11d48" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="290.0" y="84.0" width="260.0" height="80.0" rx="4" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/>
<text x="420.0" y="102.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9f1239" text-anchor="middle" font-weight="700">ПЕРЕРИВАННЯ (ISR) вклинилося!</text>
<text x="420.0" y="122.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">LDR r1, [ODR]; ORR r1, #0x80</text>
<text x="420.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">STR r1, [ODR] -&gt; Pin 7 = 1 у залізі</text>
<text x="420.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">ODR у залізі тепер = 0x80</text>
<line x1="550.0" y1="124.0" x2="585.0" y2="124.0" stroke="#e11d48" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="585.0" y="88.0" width="240.0" height="72.0" rx="4" fill="#ffffff" stroke="#fda4af" stroke-width="1.0"/>
<text x="705.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#9f1239" text-anchor="middle" font-weight="700">Крок 3 (Main thread повертається)</text>
<text x="705.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#be123c" text-anchor="middle" font-weight="700">STR r0, [ODR] (записує 0x20)</text>
<text x="705.0" y="146.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">ПОМИЛКА: Pin 7 стерто в 0!</text>
<rect x="20.0" y="190.0" width="820.0" height="120.0" rx="6" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5"/>
<text x="430.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#15803d" text-anchor="middle" font-weight="700">2. Атомарний бітовий запис: PORT-&gt;BSRR = (1 &lt;&lt; 5)  [Write-Only, без RMW]</text>
<rect x="35.0" y="228.0" width="230.0" height="68.0" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1.0"/>
<text x="150.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">Головний потік (Main thread)</text>
<text x="150.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle" font-weight="700">STR 0x0020, [BSRR]</text>
<text x="150.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Тільки 1 інструкція запису</text>
<line x1="265.0" y1="262.0" x2="305.0" y2="262.0" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="305.0" y="228.0" width="230.0" height="68.0" rx="4" fill="#dcfce7" stroke="#16a34a" stroke-width="1.0"/>
<text x="420.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#14532d" text-anchor="middle" font-weight="700">Апаратна логіка на чипі</text>
<text x="420.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">Set-імпульс лише на тригер 5</text>
<text x="420.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Інші біти не чіпаються</text>
<line x1="535.0" y1="262.0" x2="575.0" y2="262.0" stroke="#16a34a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="575.0" y="228.0" width="250.0" height="68.0" rx="4" fill="#ffffff" stroke="#86efac" stroke-width="1.0"/>
<text x="700.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#15803d" text-anchor="middle" font-weight="700">Результат у залізі</text>
<text x="700.0" y="266.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#166534" text-anchor="middle" font-weight="700">Pin 5 = 1, Pin 7 лишився = 1</text>
<text x="700.0" y="284.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">Жодних гонок і блокувань</text>
</svg>