<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 870 280" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="870" height="280" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="430.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Відображення C-структури на 32-бітний адресний простір периферійного модуля</text>
<rect x="25.0" y="50.0" width="360.0" height="200.0" rx="6" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
<text x="205.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">Оголошення структури в C (CMSIS)</text>
<rect x="37.0" y="88.0" width="336.0" height="150.0" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1.0"/>
<text x="50" y="106" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#f8fafc">typedef struct {</text>
<text x="50" y="121" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#38bdf8">  volatile uint32_t MODER;   // +0x00</text>
<text x="50" y="136" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#38bdf8">  volatile uint32_t OTYPER;  // +0x04</text>
<text x="50" y="151" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#38bdf8">  volatile uint32_t OSPEEDR; // +0x08</text>
<text x="50" y="166" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#38bdf8">  volatile uint32_t PUPDR;   // +0x0C</text>
<text x="50" y="181" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#38bdf8">  volatile uint32_t IDR;     // +0x10</text>
<text x="50" y="196" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#38bdf8">  volatile uint32_t ODR;     // +0x14</text>
<text x="50" y="211" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#f43f5e">  volatile uint32_t BSRR;    // +0x18</text>
<text x="50" y="226" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#f8fafc">} GPIO_TypeDef;</text>
<line x1="390.0" y1="150.0" x2="440.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="415.0" y="138.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">32-біт</text>
<text x="415.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Offset</text>
<rect x="445.0" y="50.0" width="390.0" height="200.0" rx="6" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
<text x="640.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#0369a1" text-anchor="middle" font-weight="700">Апаратна карта регістрів (GPIOA: 0x40020000)</text>
<rect x="457.0" y="92.0" width="366.0" height="19.0" rx="2" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="498.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="middle" font-weight="700">0x40020000</text>
<text x="545.0" y="105.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">+0x00</text>
<text x="570" y="105" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a">MODER (Режим виводів: In/Out/Alt/Analog)</text>
<rect x="457.0" y="113.0" width="366.0" height="19.0" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="498.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="middle" font-weight="700">0x40020004</text>
<text x="545.0" y="126.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">+0x04</text>
<text x="570" y="126" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a">OTYPER (Тип виходу: Push-Pull / Open-Drain)</text>
<rect x="457.0" y="134.0" width="366.0" height="19.0" rx="2" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="498.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="middle" font-weight="700">0x40020008</text>
<text x="545.0" y="147.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">+0x08</text>
<text x="570" y="147" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a">OSPEEDR (Швидкість наростання фронту)</text>
<rect x="457.0" y="155.0" width="366.0" height="19.0" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="498.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="middle" font-weight="700">0x4002000C</text>
<text x="545.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">+0x0C</text>
<text x="570" y="168" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a">PUPDR (Внутрішні підтяжки Pull-Up/Down)</text>
<rect x="457.0" y="176.0" width="366.0" height="19.0" rx="2" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="498.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="middle" font-weight="700">0x40020010</text>
<text x="545.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">+0x10</text>
<text x="570" y="189" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a">IDR (Вхідні дані з фізичних пінів, RO)</text>
<rect x="457.0" y="197.0" width="366.0" height="19.0" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="498.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="middle" font-weight="700">0x40020014</text>
<text x="545.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">+0x14</text>
<text x="570" y="210" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a">ODR (Вихідні засувки даних, RW)</text>
<rect x="457.0" y="218.0" width="366.0" height="19.0" rx="2" fill="#fee2e2" stroke="#cbd5e1" stroke-width="1.0"/>
<text x="498.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#0f172a" text-anchor="middle" font-weight="700">0x40020018</text>
<text x="545.0" y="231.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">+0x18</text>
<text x="570" y="231" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a">BSRR (Атомарне встановлення/скидання, WO)</text>
</svg>