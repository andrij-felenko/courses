<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 390" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="390" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Архітектура обчислення вектора стану апарата в реальному часі</text>
<rect x="30.0" y="65.0" width="220.0" height="290.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="140.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Первинні виміри</text>
<rect x="42.0" y="107.0" width="196.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="140.0" y="134.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">IMU Гіроскоп (p, q, r)</tspan><tspan x="140.0" dy="14.3">1000 Гц, кутова швидкість</tspan></text>
<rect x="42.0" y="183.0" width="196.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="140.0" y="210.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">IMU Акселерометр (a_B)</tspan><tspan x="140.0" dy="14.3">1000 Гц, питома сила</tspan></text>
<rect x="42.0" y="259.0" width="196.0" height="62.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="140.0" y="287.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="140.0" dy="0.0">GNSS / Барометр</tspan><tspan x="140.0" dy="13.0">10-50 Гц, координати й висота</tspan></text>
<line x1="250.0" y1="138.0" x2="295.0" y2="138.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="250.0" y1="214.0" x2="295.0" y2="214.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="250.0" y1="290.0" x2="295.0" y2="290.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="295.0" y="65.0" width="290.0" height="290.0" rx="8" fill="#eff6ff" stroke="#2457d6" stroke-width="1.8"/>
<text x="440.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">Оцінювач стану (EKF / Кватерніон)</text>
<rect x="307.0" y="107.0" width="266.0" height="68.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.0"/><text x="440.0" y="130.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Кінематика орієнтації (500 Гц):</tspan><tspan x="440.0" dy="14.3">q(t + Δt) = q + 0.5·q ⊗ ω·Δt</tspan><tspan x="440.0" dy="14.3">Нормалізація: |q| = 1</tspan></text>
<rect x="307.0" y="183.0" width="266.0" height="68.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.0"/><text x="440.0" y="213.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Обертання прискорення:</tspan><tspan x="440.0" dy="14.3">a_N = q ⊗ a_B ⊗ q* - g_N</tspan></text>
<rect x="307.0" y="259.0" width="266.0" height="68.0" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.0"/><text x="440.0" y="289.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="440.0" dy="0.0">Інтегрування швидкості й позиції:</tspan><tspan x="440.0" dy="14.3">v_N += a_N·Δt,  p_N += v_N·Δt</tspan></text>
<line x1="585.0" y1="217.0" x2="630.0" y2="217.0" stroke="#333333" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="630.0" y="65.0" width="220.0" height="290.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="740.0" y="89.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">Вектор стану X(t)</text>
<rect x="642.0" y="107.0" width="196.0" height="95.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="740.0" y="140.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="740.0" dy="0.0">Позиція: p = [N, E, D]^T</tspan><tspan x="740.0" dy="11.7">Швидкість: v = [vN, vE, vD]^T</tspan><tspan x="740.0" dy="11.7">Кватерніон: q = [qw, qx, qy, qz]</tspan><tspan x="740.0" dy="11.7">Кутова швидкість: ω = [p, q, r]</tspan></text>
<rect x="642.0" y="215.0" width="196.0" height="110.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.0"/><text x="740.0" y="255.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="740.0" dy="0.0">Споживачі стану:</tspan><tspan x="740.0" dy="11.7">• ПІД-регулятори кутів і кутових швидкостей</tspan><tspan x="740.0" dy="11.7">• Навігація за точками</tspan><tspan x="740.0" dy="11.7">• Телеметрія MAVLink</tspan></text>
</svg>