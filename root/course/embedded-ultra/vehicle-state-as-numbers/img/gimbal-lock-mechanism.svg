<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 890 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="890" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="440.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Геометрична природа шарнірного замка (Gimbal Lock) при тангажі θ = ±90°</text>
<rect x="30.0" y="55.0" width="390.0" height="345.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="225.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Нормальний політ (тангаж θ = 0°)</text>
<circle cx="225.0" cy="205.0" r="70.0" fill="none" stroke="#c0392b" stroke-width="2.5"/>
<text x="225.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Кільце курсу (Yaw / ψ) — вісь Z</text>
<ellipse cx="225.0" cy="205.0" rx="50.0" ry="30.0" fill="none" stroke="#27ae60" stroke-width="2.5"/>
<text x="225.0" y="160.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Кільце тангажу (Pitch / θ) — вісь Y</text>
<line x1="185.0" y1="205.0" x2="265.0" y2="205.0" stroke="#2457d6" stroke-width="3.0"/>
<text x="225.0" y="225.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Вісь крену (Roll / φ) — вісь X</text>
<rect x="50.0" y="345.0" width="350.0" height="36.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/><text x="225.0" y="366.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="225.0" dy="0.0">3 незалежні осі обертання (3 ступені вільності)</tspan></text>
<rect x="460.0" y="55.0" width="390.0" height="345.0" rx="8" fill="#f8fafc" stroke="#333333" stroke-width="1.5"/>
<text x="655.0" y="82.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Шарнірний замок (тангаж θ = +90°)</text>
<circle cx="655.0" cy="205.0" r="70.0" fill="none" stroke="#c0392b" stroke-width="2.5"/>
<text x="655.0" y="127.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Вісь курсу (Yaw / ψ) — вісь Z</text>
<ellipse cx="655.0" cy="205.0" rx="18.0" ry="60.0" fill="none" stroke="#27ae60" stroke-width="2.0"/>
<text x="727.0" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">Pitch θ = +90°</text>
<line x1="655.0" y1="140.0" x2="655.0" y2="270.0" stroke="#2457d6" stroke-width="3.0"/>
<text x="580.0" y="235.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Вісь крену (Roll / φ)</text>
<line x1="643.0" y1="160.0" x2="643.0" y2="250.0" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="480.0" y="305.0" width="350.0" height="32.0" rx="6" fill="#fee2e2" stroke="#c0392b" stroke-width="1.2"/><text x="655.0" y="324.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">Осі Roll та Yaw стали КОЛІНЕАРНИМИ!</tspan></text>
<rect x="480.0" y="345.0" width="350.0" height="36.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.0"/><text x="655.0" y="366.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="655.0" dy="0.0">1 / cos(θ) → ∞  |  Втрата 1 ступеня вільності</tspan></text>
</svg>