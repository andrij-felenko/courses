<text x="495.0" y="297.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">M3 = Throttle + Roll + Pitch − Yaw</text>
<text x="495.0" y="315.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Піднімає лівий борт, піднімає хвіст, крутить ніс вліво</text>
