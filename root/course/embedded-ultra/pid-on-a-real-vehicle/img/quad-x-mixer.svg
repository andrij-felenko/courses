<text x="495.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">M1 = Throttle − Roll + Pitch + Yaw</text>
<text x="495.0" y="163.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Зменшує крен праворуч, піднімає хвіст, крутить ніс вправо</text>
