<text x="495.0" y="239.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Зменшує крен праворуч, опускає ніс, крутить ніс вліво</text>
