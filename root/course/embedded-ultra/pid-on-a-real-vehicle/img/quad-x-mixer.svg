<text x="495.0" y="353.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start" font-weight="700">Мотор 4 (Front-Left, CW)</text>
<text x="495.0" y="373.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="start" font-weight="700">M4 = Throttle + Roll − Pitch + Yaw</text>
<text x="495.0" y="391.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start">Піднімає лівий борт, опускає ніс, крутить ніс вправо</text>
<rect x="480.0" y="414.0" width="430.0" height="65.0" rx="6" fill="#eff6ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="695.0" y="435.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Air Mode &amp; Dynamic Range Scaling</text>
<text x="695.0" y="454.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="695.0" dy="0.0">Якщо M_max &gt; 1.0 або M_min &lt; 0.0, загальний Throttle зсувається,</tspan><tspan x="695.0" dy="12.3">щоб зберегти 100% керівних моментів стабілізації.</tspan></text>
