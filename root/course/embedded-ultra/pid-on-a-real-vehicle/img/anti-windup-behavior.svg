<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10 -10 970 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect x="-10" y="-10" width="970" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="28.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Насичення інтегратора (Windup) та динамічне відновлення керування</text>
<rect x="30.0" y="55.0" width="430.0" height="415.0" rx="8" fill="#fef2f2" stroke="#c0392b" stroke-width="1.8"/>
<text x="245.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">БЕЗ Anti-Windup: Накопичення помилки</text>
<text x="245.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Дрон заблоковано рукою або в траві під час зльоту</text>
<line x1="60.0" y1="240.0" x2="430.0" y2="240.0" stroke="#333333" stroke-width="1.2"/>
<line x1="60.0" y1="360.0" x2="60.0" y2="120.0" stroke="#333333" stroke-width="1.2"/>
<line x1="60.0" y1="150.0" x2="430.0" y2="150.0" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="420.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="end">U_max (100% газу)</text>
<line x1="60.0" y1="240.0" x2="140.0" y2="240.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="140.0" y1="240.0" x2="260.0" y2="115.0" stroke="#c0392b" stroke-width="2.5"/>
<line x1="260.0" y1="115.0" x2="340.0" y2="170.0" stroke="#c0392b" stroke-width="2.0"/>
<line x1="340.0" y1="170.0" x2="420.0" y2="240.0" stroke="#c0392b" stroke-width="2.0"/>
<text x="230.0" y="121.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">Намотаний інтеграл I &gt;&gt; U_max</text>
<rect x="140.0" y="150.0" width="120.0" height="190.0" rx="6" fill="#fee2e2" stroke="none" stroke-width="1.5"/>
<text x="200.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle"><tspan x="200.0" dy="0.0">Апарат утримується</tspan><tspan x="200.0" dy="13.0">(похибка не зникає)</tspan></text>
<rect x="260.0" y="150.0" width="80.0" height="190.0" rx="6" fill="#fef3c7" stroke="none" stroke-width="1.5"/>
<text x="300.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#b45309" text-anchor="middle"><tspan x="300.0" dy="0.0">Затримка розряду</tspan><tspan x="300.0" dy="12.3">(Overshoot)</tspan></text>
<rect x="45.0" y="375.0" width="400.0" height="80.0" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/><text x="245.0" y="411.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700"><tspan x="245.0" dy="0.0">Наслідок: після звільнення дрон робить різкий кульбіт</tspan><tspan x="245.0" dy="13.7">і врізається в землю через гігантський накопичений I.</tspan></text>
<rect x="490.0" y="55.0" width="440.0" height="415.0" rx="8" fill="#f0fdf4" stroke="#27ae60" stroke-width="1.8"/>
<text x="710.0" y="80.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">З Anti-Windup: Затискання та миттєва реакція</text>
<text x="710.0" y="98.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">Інтегратор заморожується на межі насичення мотора</text>
<line x1="520.0" y1="240.0" x2="890.0" y2="240.0" stroke="#333333" stroke-width="1.2"/>
<line x1="520.0" y1="360.0" x2="520.0" y2="120.0" stroke="#333333" stroke-width="1.2"/>
<line x1="520.0" y1="150.0" x2="890.0" y2="150.0" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="880.0" y="142.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="end">U_max (100% газу)</text>
<line x1="520.0" y1="240.0" x2="600.0" y2="240.0" stroke="#27ae60" stroke-width="2.0"/>
<line x1="600.0" y1="240.0" x2="660.0" y2="150.0" stroke="#27ae60" stroke-width="2.5"/>
<line x1="660.0" y1="150.0" x2="720.0" y2="150.0" stroke="#27ae60" stroke-width="2.5"/>
<line x1="720.0" y1="150.0" x2="770.0" y2="240.0" stroke="#27ae60" stroke-width="2.5"/>
<line x1="770.0" y1="240.0" x2="880.0" y2="240.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="690.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">I_term затиснуто (Clamped)</text>
<rect x="600.0" y="150.0" width="120.0" height="190.0" rx="6" fill="#e0f2fe" stroke="none" stroke-width="1.5"/>
<text x="660.0" y="275.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle"><tspan x="660.0" dy="0.0">Апарат утримується</tspan><tspan x="660.0" dy="13.0">(I не росте вище ліміту)</tspan></text>
<line x1="720.0" y1="120.0" x2="720.0" y2="340.0" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="2,2"/>
<text x="765.0" y="310.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="765.0" dy="0.0">Миттєве відновлення</tspan><tspan x="765.0" dy="12.3">(без кульбіту)</tspan></text>
<rect x="505.0" y="375.0" width="410.0" height="80.0" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/><text x="710.0" y="411.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="710.0" dy="0.0">Механізм: якщо вихід регулятора досяг ліміту,</tspan><tspan x="710.0" dy="13.7">інтегрування похибки цього знаку примусово зупиняється.</tspan></text>
</svg>