<rect x="91.3" y="471.1" width="277.4" height="57.8" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="230.0" y="490.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="230.0" dy="0.0">«Фізичний 3» і «GPIO 2» — ОДИН штирок.</tspan><tspan x="230.0" dy="13.7">Число всередині = місце на гребінці (1…40).</tspan><tspan x="230.0" dy="13.7">GPIO N = ім'я лінії в чипі (для коду).</tspan></text>
<rect x="574.2" y="471.1" width="211.5" height="57.8" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="680.0" y="490.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="680.0" dy="0.0">libgpiod хоче BCM-зсув (offset),</tspan><tspan x="680.0" dy="13.7">а не фізичний номер!</tspan><tspan x="680.0" dy="13.7">GPIO 17 → offset 17, а не «11».</tspan></text>
