<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-left" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-blue-left" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-red-left" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="530" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма шини DVP та DMA-передачі в ESP32-CAM</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Паузи бланкування (t_blank) та шинні затримки DMA обмежують граничний FPS камери</text>

  <!-- SECTION 1: DVP BUS TIMING DIAGRAM -->
  <rect x="25" y="75" width="910" height="215" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="40" y="93" font-size="13" font-weight="bold" fill="#1a1a1a">1. Таймінги шини DVP (Digital Video Port)</text>

  <!-- Frame Timing Measurements -->
  <text x="150" y="108" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">t_vblank</text>
  <line x1="120" y1="114" x2="180" y2="114" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-red-left)" marker-end="url(#arr-red)"/>

  <text x="470" y="108" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">t_active (Активний кадр)</text>
  <line x1="180" y1="114" x2="760" y2="114" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue-left)" marker-end="url(#arr-blue)"/>

  <!-- Timing Boundary Vertical Grid Lines -->
  <line x1="180" y1="118" x2="180" y2="262" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="760" y1="118" x2="760" y2="262" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Signal Labels -->
  <text x="40" y="138" font-size="13" font-weight="bold" fill="#1a1a1a">VSYNC</text>
  <text x="40" y="174" font-size="13" font-weight="bold" fill="#1a1a1a">HREF</text>
  <text x="40" y="210" font-size="13" font-weight="bold" fill="#1a1a1a">PCLK</text>
  <text x="40" y="248" font-size="13" font-weight="bold" fill="#1a1a1a">D[7:0]</text>

  <!-- VSYNC Waveform -->
  <path d="M 120,124 L 180,124 L 180,144 L 760,144 L 760,124 L 910,124" stroke="#2457d6" stroke-width="2" fill="none"/>

  <!-- Line Timing Measurements -->
  <text x="275" y="152" font-size="12" fill="#2457d6" text-anchor="middle">t_line_active</text>
  <line x1="200" y1="157" x2="350" y2="157" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue-left)" marker-end="url(#arr-blue)"/>

  <text x="370" y="152" font-size="12" fill="#c0392b" text-anchor="middle">t_hblank</text>
  <line x1="350" y1="157" x2="390" y2="157" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-red-left)" marker-end="url(#arr-red)"/>

  <!-- HREF Waveform -->
  <path d="M 120,180 L 200,180 L 200,163 L 350,163 L 350,180 L 390,180 L 390,163 L 540,163 L 540,180 L 580,180" stroke="#2457d6" stroke-width="2" fill="none"/>
  <text x="595" y="174" font-size="13" font-weight="bold" fill="#6b7280" text-anchor="middle">...</text>
  <path d="M 610,180 L 610,163 L 740,163 L 740,180 L 910,180" stroke="#2457d6" stroke-width="2" fill="none"/>

  <!-- PCLK Waveform -->
  <path d="M 120,215 L 200,215 M 350,215 L 390,215 M 540,215 L 580,215 M 740,215 L 910,215" stroke="#2457d6" stroke-width="1.5" fill="none"/>
  <!-- Line 1 PCLK Pulses (x=200..350) -->
  <path d="M 200,215 L 200,198 L 208,198 L 208,215 L 216,215 L 216,198 L 224,198 L 224,215 L 232,215 L 232,198 L 240,198 L 240,215 L 248,215 L 248,198 L 256,198 L 256,215 L 264,215 L 264,198 L 272,198 L 272,215 L 280,215 L 280,198 L 288,198 L 288,215 L 296,215 L 296,198 L 304,198 L 304,215 L 312,215 L 312,198 L 320,198 L 320,215 L 328,215 L 328,198 L 336,198 L 336,215 L 344,215 L 344,198 L 350,198 L 350,215" stroke="#2457d6" stroke-width="1.5" fill="none"/>
  <!-- Line 2 PCLK Pulses (x=390..540) -->
  <path d="M 390,215 L 390,198 L 398,198 L 398,215 L 406,215 L 406,198 L 414,198 L 414,215 L 422,215 L 422,198 L 430,198 L 430,215 L 438,215 L 438,198 L 446,198 L 446,215 L 454,215 L 454,198 L 462,198 L 462,215 L 470,215 L 470,198 L 478,198 L 478,215 L 486,215 L 486,198 L 494,198 L 494,215 L 502,215 L 502,198 L 510,198 L 510,215 L 518,215 L 518,198 L 526,198 L 526,215 L 534,215 L 534,198 L 540,198 L 540,215" stroke="#2457d6" stroke-width="1.5" fill="none"/>
  <!-- Line N PCLK Pulses (x=610..740) -->
  <path d="M 610,215 L 610,198 L 618,198 L 618,215 L 626,215 L 626,198 L 634,198 L 634,215 L 642,215 L 642,198 L 650,198 L 650,215 L 658,215 L 658,198 L 666,198 L 666,215 L 674,215 L 674,198 L 682,198 L 682,215 L 690,215 L 690,198 L 698,198 L 698,215 L 706,215 L 706,198 L 714,198 L 714,215 L 722,215 L 722,198 L 730,198 L 730,215 L 738,215 L 738,198 L 740,198 L 740,215" stroke="#2457d6" stroke-width="1.5" fill="none"/>

  <!-- Data Bus D[7:0] Idle lines -->
  <line x1="120" y1="245" x2="200" y2="245" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="328" y1="245" x2="390" y2="245" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="486" y1="245" x2="610" y2="245" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="690" y1="245" x2="910" y2="245" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Data Bus Byte Hexagons / Cells -->
  <!-- Line 1 Bytes -->
  <path d="M 200,245 L 204,235 L 228,235 L 232,245 L 228,255 L 204,255 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="216" y="249" font-size="12" text-anchor="middle" fill="#1a1a1a">B0</text>

  <path d="M 232,245 L 236,235 L 260,235 L 264,245 L 260,255 L 236,255 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="248" y="249" font-size="12" text-anchor="middle" fill="#1a1a1a">B1</text>

  <path d="M 264,245 L 268,235 L 292,235 L 296,245 L 292,255 L 268,255 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="280" y="249" font-size="12" text-anchor="middle" fill="#1a1a1a">B2</text>

  <path d="M 296,245 L 300,235 L 324,235 L 328,245 L 324,255 L 300,255 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="312" y="249" font-size="12" text-anchor="middle" fill="#1a1a1a">B3</text>

  <!-- Line 2 Bytes -->
  <path d="M 390,245 L 394,235 L 418,235 L 422,245 L 418,255 L 394,255 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="406" y="249" font-size="12" text-anchor="middle" fill="#1a1a1a">B4</text>

  <path d="M 422,245 L 426,235 L 450,235 L 454,245 L 450,255 L 426,255 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="438" y="249" font-size="12" text-anchor="middle" fill="#1a1a1a">B5</text>

  <path d="M 454,245 L 458,235 L 482,235 L 486,245 L 482,255 L 458,255 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="470" y="249" font-size="12" text-anchor="middle" fill="#1a1a1a">B6</text>

  <!-- Line N Bytes -->
  <path d="M 610,245 L 614,235 L 646,235 L 650,245 L 646,255 L 614,255 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="630" y="249" font-size="12" text-anchor="middle" fill="#1a1a1a">Bn-1</text>

  <path d="M 650,245 L 654,235 L 686,235 L 690,245 L 686,255 L 654,255 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="670" y="249" font-size="12" text-anchor="middle" fill="#1a1a1a">Bn</text>

  <!-- Pixel Sampling Bracket -->
  <line x1="200" y1="264" x2="264" y2="264" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-left)" marker-end="url(#arr)"/>
  <text x="232" y="278" font-size="12" fill="#1a1a1a" text-anchor="middle">2 PCLK = 1 Pixel (RGB565 / YUV422)</text>


  <!-- SECTION 2: DMA PIPELINE & MEMORY ROUTING -->
  <rect x="25" y="305" width="910" height="205" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="40" y="326" font-size="13" font-weight="bold" fill="#1a1a1a">2. Конвеєр DMA та маршрутизація буферів пам'яті ESP32-CAM</text>

  <!-- Block 1: Camera Sensor -->
  <rect x="45" y="348" width="130" height="65" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="110" y="373" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Сенсор OV2640</text>
  <text x="110" y="393" font-size="12" fill="#6b7280" text-anchor="middle">8-біт DVP + PCLK</text>

  <line x1="175" y1="380.5" x2="215" y2="380.5" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Block 2: I2S/CAM FIFO -->
  <rect x="215" y="348" width="140" height="65" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="285" y="373" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">I2S/CAM FIFO</text>
  <text x="285" y="393" font-size="12" fill="#6b7280" text-anchor="middle">Апаратний буфер</text>

  <line x1="355" y1="380.5" x2="395" y2="380.5" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Block 3: DMA Controller -->
  <rect x="395" y="348" width="150" height="65" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="470" y="373" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">DMA контролер</text>
  <text x="470" y="393" font-size="12" fill="#6b7280" text-anchor="middle">Ring Descriptors</text>

  <!-- Branch A: Internal SRAM -->
  <line x1="545" y1="363" x2="625" y2="363" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="585" y="354" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Прямий DMA</text>

  <rect x="625" y="342" width="290" height="55" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="770" y="363" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Внутрішня SRAM (DRAM)</text>
  <text x="770" y="383" font-size="12" fill="#1a1a1a" text-anchor="middle">Швидкий доступ | Обмежена ємність (JPEG)</text>

  <!-- Branch B: External PSRAM -->
  <path d="M 545,395 L 585,395 L 585,445 L 625,445" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="548" y="426" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">SPI шина (Δt_DMA)</text>

  <rect x="625" y="418" width="290" height="55" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="770" y="439" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Зовнішня PSRAM (4 МБ)</text>
  <text x="770" y="459" font-size="12" fill="#1a1a1a" text-anchor="middle">Великий обсяг (RGB565/YUV422) | Затримки шини</text>

  <!-- Summary Formula Box -->
  <rect x="45" y="430" width="500" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="295" y="452" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Формула граничної частоти кадрів (FPS):</text>
  <text x="295" y="474" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">FPS_max = f_PCLK / (2 · N_pixels + N_blank + N_DMA_delay)</text>
</svg>
