<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Схема керування живленням камери OV2640 та пробудження ESP32 від PIR-датчика</text>
  <text x="480" y="56" font-size="13" text-anchor="middle" fill="#6b7280">P-MOSFET вимикає камери у глибокому сні, а RTC GPIO приймає сигнал руху з споживанням &lt; 60 µA</text>

  <!-- PANEL 1: PIR SENSOR -->
  <rect x="25" y="80" width="185" height="385" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="117" y="105" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">PIR-датчик руху</text>
  <text x="117" y="122" font-size="12" text-anchor="middle" fill="#6b7280">(HC-SR501 / AM312)</text>

  <rect x="35" y="138" width="165" height="110" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="117" y="160" font-size="13" font-weight="bold" text-anchor="middle" fill="#2457d6">Піроелектричний сенсор</text>
  <text x="117" y="180" font-size="12" text-anchor="middle" fill="#1a1a1a">Виявлення ІЧ-випромінювання</text>

  <rect x="42" y="200" width="151" height="36" fill="white" stroke="#d0d7de" rx="4"/>
  <text x="50" y="222" font-size="12" font-weight="bold" fill="#c0392b">VCC (3.3V)</text>
  <text x="117" y="222" font-size="12" font-weight="bold" text-anchor="middle" fill="#6b7280">GND</text>
  <text x="187" y="222" font-size="12" font-weight="bold" text-anchor="end" fill="#27ae60">OUT</text>

  <rect x="35" y="265" width="165" height="85" fill="white" stroke="#d0d7de" rx="6"/>
  <text x="117" y="287" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Режим очікування:</text>
  <text x="117" y="307" font-size="12" text-anchor="middle" fill="#6b7280">Споживання: ~15–40 µA</text>
  <text x="117" y="327" font-size="12" text-anchor="middle" fill="#27ae60">При русі: OUT = HIGH</text>

  <rect x="35" y="362" width="165" height="90" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="6"/>
  <text x="117" y="384" font-size="12" font-weight="bold" text-anchor="middle" fill="#1e7e34">Сигнал тривоги</text>
  <text x="117" y="404" font-size="12" text-anchor="middle" fill="#1a1a1a">Подача імпульсу 3.3V</text>
  <text x="117" y="422" font-size="12" text-anchor="middle" fill="#1a1a1a">для пробудження ядра</text>

  <!-- PANEL 2: ESP32 MICROCONTROLLER -->
  <rect x="285" y="80" width="360" height="385" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="465" y="105" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Мікроконтролер ESP32 (ESP32-CAM)</text>

  <rect x="298" y="125" width="334" height="150" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="465" y="147" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e7e34">RTC Домен (Завжди активний у Deep Sleep)</text>
  <text x="465" y="167" font-size="12" text-anchor="middle" fill="#6b7280">Власне споживання RTC-контролера: ~5 µA</text>

  <rect x="310" y="180" width="310" height="80" fill="white" stroke="#27ae60" rx="4"/>
  <text x="320" y="202" font-size="12" font-weight="bold" fill="#27ae60">RTC_GPIO33 (Вхід ext0 Wakeup)</text>
  <text x="320" y="224" font-size="12" fill="#1a1a1a">Конфігурація: esp_sleep_enable_ext0_wakeup</text>
  <text x="320" y="244" font-size="12" fill="#1e7e34">Поріг спрацьовування: HIGH level (3.3V)</text>

  <rect x="298" y="295" width="334" height="155" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <text x="465" y="317" font-size="13" font-weight="bold" text-anchor="middle" fill="#c0392b">Основне ядро та Digital Core (Знеструмлені у сні)</text>

  <rect x="310" y="330" width="310" height="105" fill="white" stroke="#c0392b" rx="4"/>
  <text x="320" y="352" font-size="12" font-weight="bold" fill="#c0392b">CAM_PWR_CTRL / GPIO32 (Вихід керування)</text>
  <text x="320" y="374" font-size="12" fill="#1a1a1a">У Deep Sleep: High-Z (високоімпледансний стан)</text>
  <text x="320" y="394" font-size="12" fill="#c0392b">Ключ Q1 закритий через зовнішній R_pu</text>
  <text x="320" y="416" font-size="12" fill="#27ae60">При роботі: LOW (0V) — вмикає живлення камери</text>

  <!-- PANEL 3: POWER GATING & CAMERA -->
  <rect x="675" y="80" width="260" height="385" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="805" y="105" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Керування живленням та камера</text>

  <rect x="688" y="125" width="234" height="185" fill="white" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="805" y="145" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Схема ключа (Power Gate)</text>

  <!-- +3.3V Rail -->
  <line x1="695" y1="165" x2="800" y2="165" stroke="#c0392b" stroke-width="2"/>
  <text x="700" y="158" font-size="12" font-weight="bold" fill="#c0392b">+3.3V_SYS</text>

  <!-- Pull-up resistor R_pu -->
  <line x1="720" y1="165" x2="720" y2="180" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="713" y="180" width="14" height="26" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="732" y="197" font-size="12" fill="#1a1a1a">R_pu 10k</text>
  <line x1="720" y1="206" x2="720" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- MOSFET Q1 -->
  <line x1="755" y1="210" x2="755" y2="240" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="762" y1="210" x2="762" y2="218" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="762" y1="221" x2="762" y2="229" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="762" y1="232" x2="762" y2="240" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="720" y1="225" x2="755" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Source (top) -->
  <line x1="762" y1="214" x2="790" y2="214" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="790" y1="165" x2="790" y2="214" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Drain (bottom) -->
  <line x1="762" y1="236" x2="762" y2="365" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <text x="798" y="205" font-size="12" font-weight="bold" fill="#1a1a1a">Q1 P-MOSFET</text>
  <text x="798" y="220" font-size="12" fill="#6b7280">(AO3401)</text>

  <!-- Explanation box inside Power Gate (right side) -->
  <rect x="778" y="250" width="135" height="50" fill="#eaf0fd" stroke="#2457d6" rx="4"/>
  <text x="845" y="268" font-size="12" text-anchor="middle" fill="#1a1a1a">Sleep: Q1 Вимкнено</text>
  <text x="845" y="288" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">Active: Q1 Увімкнено</text>

  <!-- OV2640 Camera Block -->
  <rect x="688" y="335" width="234" height="120" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="805" y="355" font-size="13" font-weight="bold" text-anchor="middle" fill="#2457d6">Сенсор камери OV2640</text>

  <rect x="698" y="365" width="214" height="75" fill="white" stroke="#2457d6" rx="4"/>
  <text x="708" y="385" font-size="12" font-weight="bold" fill="#2457d6">Вхід живлення VDD_CAM</text>
  <text x="708" y="407" font-size="12" fill="#c0392b">У глибокому сні: 0V (Струм = 0 µA)</text>
  <text x="708" y="427" font-size="12" fill="#27ae60">При зйомці: 3.3V (Струм ~140 mA)</text>

  <!-- CONNECTIONS -->
  <!-- Wire 1: PIR OUT to ESP32 RTC_GPIO33 -->
  <line x1="193" y1="218" x2="298" y2="218" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="245" y="206" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">TRIG</text>

  <!-- Pull-down resistor R_pd -->
  <line x1="250" y1="218" x2="250" y2="238" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="243" y="238" width="14" height="24" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="238" y="254" font-size="12" text-anchor="end" fill="#1a1a1a">R_pd 10k</text>
  <line x1="250" y1="262" x2="250" y2="272" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="243" y1="272" x2="257" y2="272" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="246" y1="276" x2="254" y2="276" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="248" y1="280" x2="252" y2="280" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Wire 2: ESP32 CAM_PWR_CTRL (645, 365) -> (720, 365) -> (720, 225) -->
  <polyline points="645,365 720,365 720,225" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Junction dots -->
  <circle cx="720" cy="225" r="3" fill="#1a1a1a"/>
  <circle cx="250" cy="218" r="3" fill="#27ae60"/>

  <!-- BOTTOM SUMMARY PANEL -->
  <rect x="25" y="480" width="910" height="42" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="480" y="506" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e7e34">Підсумок: Знеструмлення камери ключем Q1 знижує струм сну з ~15 mA до &lt; 60 µA (автономність до 1 року)</text>
</svg>
