<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Потік даних відеокадри в ESP32-CAM: DVP FIFO, DMA та PSRAM</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Буферизація піксельного потоку через FIFO та DMA-дескриптори в SRAM перед записом у PSRAM</text>

  <!-- Block 1: OV2640 / DVP Interface -->
  <g>
    <rect x="30" y="100" width="190" height="260" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="125" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">OV2640 / DVP шина</text>

    <!-- Sub-box 1.1 -->
    <rect x="42" y="142" width="166" height="65" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
    <text x="50" y="160" font-size="11" font-weight="bold" fill="#1a1a1a">Сигнали DVP:</text>
    <text x="50" y="177" font-size="11" fill="#6b7280">• PCLK, VSYNC, HREF</text>
    <text x="50" y="194" font-size="11" fill="#6b7280">• Паралельні дані D0–D7</text>

    <!-- Sub-box 1.2 -->
    <rect x="42" y="215" width="166" height="65" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
    <text x="50" y="233" font-size="11" font-weight="bold" fill="#1a1a1a">Формати кадру:</text>
    <text x="50" y="250" font-size="11" fill="#6b7280">• JPEG / YUV422</text>
    <text x="50" y="267" font-size="11" fill="#6b7280">• RGB565 / Grayscale</text>

    <!-- Sub-box 1.3 -->
    <rect x="42" y="288" width="166" height="55" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
    <text x="50" y="306" font-size="11" font-weight="bold" fill="#1a1a1a">Піксельний такт:</text>
    <text x="50" y="323" font-size="11" fill="#6b7280">• PCLK = 10–20 МГц</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g>
    <line x1="220" y1="230" x2="255" y2="230" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
    <text x="237" y="220" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">DVP Data</text>
  </g>

  <!-- Block 2: Hardware DVP FIFO -->
  <g>
    <rect x="255" y="100" width="200" height="260" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="355" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Апаратний DVP FIFO</text>

    <!-- Sub-box 2.1 -->
    <rect x="267" y="142" width="176" height="65" rx="4" fill="white" stroke="#2457d6" stroke-width="1"/>
    <text x="275" y="160" font-size="11" font-weight="bold" fill="#2457d6">Периферійний буфер:</text>
    <text x="275" y="177" font-size="11" fill="#1a1a1a">• Апаратний FIFO I2S0</text>
    <text x="275" y="194" font-size="11" fill="#6b7280">• Ємність 512 Б – 4 КБ</text>

    <!-- Sub-box 2.2 -->
    <rect x="267" y="215" width="176" height="65" rx="4" fill="white" stroke="#2457d6" stroke-width="1"/>
    <text x="275" y="233" font-size="11" font-weight="bold" fill="#2457d6">Призначення:</text>
    <text x="275" y="250" font-size="11" fill="#1a1a1a">• Згладжує джитер PCLK</text>
    <text x="275" y="267" font-size="11" fill="#6b7280">• Запобігає втраті даних</text>

    <!-- Sub-box 2.3 -->
    <rect x="267" y="288" width="176" height="55" rx="4" fill="white" stroke="#2457d6" stroke-width="1"/>
    <text x="275" y="306" font-size="11" font-weight="bold" fill="#2457d6">Гасіння кадру:</text>
    <text x="275" y="323" font-size="11" fill="#6b7280">• VSYNC / HREF паузи</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g>
    <line x1="455" y1="230" x2="490" y2="230" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
    <text x="472" y="220" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">DMA Burst</text>
  </g>

  <!-- Block 3: DMA & Internal SRAM -->
  <g>
    <rect x="490" y="100" width="210" height="260" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="595" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">DMA &amp; Внутрішня SRAM</text>

    <!-- Sub-box 3.1 -->
    <rect x="502" y="142" width="186" height="65" rx="4" fill="white" stroke="#2457d6" stroke-width="1"/>
    <text x="510" y="160" font-size="11" font-weight="bold" fill="#2457d6">DMA-дескриптори:</text>
    <text x="510" y="177" font-size="11" fill="#1a1a1a">• Зв'язаний список lldesc_t</text>
    <text x="510" y="194" font-size="11" fill="#6b7280">• Буфери у внутрішній RAM</text>

    <!-- Sub-box 3.2 -->
    <rect x="502" y="215" width="186" height="65" rx="4" fill="white" stroke="#2457d6" stroke-width="1"/>
    <text x="510" y="233" font-size="11" font-weight="bold" fill="#2457d6">Режим передачі:</text>
    <text x="510" y="250" font-size="11" fill="#1a1a1a">• Ping-Pong / Кільцевий</text>
    <text x="510" y="267" font-size="11" fill="#6b7280">• Без залучення CPU</text>

    <!-- Sub-box 3.3 -->
    <rect x="502" y="288" width="186" height="55" rx="4" fill="white" stroke="#2457d6" stroke-width="1"/>
    <text x="510" y="306" font-size="11" font-weight="bold" fill="#2457d6">Обробка подій:</text>
    <text x="510" y="323" font-size="11" fill="#6b7280">• Переривання EOF кадру</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <g>
    <line x1="700" y1="230" x2="735" y2="230" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
    <text x="717" y="220" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">SPI Write</text>
  </g>

  <!-- Block 4: External PSRAM Frame Buffer -->
  <g>
    <rect x="735" y="100" width="195" height="260" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
    <text x="832" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Зовнішня PSRAM</text>

    <!-- Sub-box 4.1 -->
    <rect x="747" y="142" width="171" height="65" rx="4" fill="white" stroke="#27ae60" stroke-width="1"/>
    <text x="755" y="160" font-size="11" font-weight="bold" fill="#27ae60">Шина PSRAM:</text>
    <text x="755" y="177" font-size="11" fill="#1a1a1a">• Quad-SPI (80 МГц)</text>
    <text x="755" y="194" font-size="11" fill="#6b7280">• Ємність 4 МБ / 8 МБ</text>

    <!-- Sub-box 4.2 -->
    <rect x="747" y="215" width="171" height="65" rx="4" fill="white" stroke="#27ae60" stroke-width="1"/>
    <text x="755" y="233" font-size="11" font-weight="bold" fill="#27ae60">Кадрові буфери:</text>
    <text x="755" y="250" font-size="11" fill="#1a1a1a">• Подвійна / Потрійна</text>
    <text x="755" y="267" font-size="11" fill="#6b7280">• Роздільність до UXGA</text>

    <!-- Sub-box 4.3 -->
    <rect x="747" y="288" width="171" height="55" rx="4" fill="white" stroke="#27ae60" stroke-width="1"/>
    <text x="755" y="306" font-size="11" font-weight="bold" fill="#27ae60">Вихідний потік:</text>
    <text x="755" y="323" font-size="11" fill="#6b7280">• HTTP / RTSP стримінг</text>
  </g>

  <!-- Bottom Summary Box -->
  <g>
    <rect x="30" y="385" width="900" height="55" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="480" y="407" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Принцип безперервної буферизації:</text>
    <text x="480" y="426" text-anchor="middle" font-size="12" fill="#6b7280">DVP FIFO згладжує піки PCLK • DMA наповнює кільцеві буфери в SRAM • Пакетний запис у PSRAM через SPI без участі CPU</text>
  </g>
</svg>
