<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Еволюція апаратної архітектури ESP32-CAM</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Від дефіциту внутрішньої SRAM з OV7670 до буферизації кадрів з OV2640 (JPEG + PSRAM)</text>

  <!-- LEFT PANEL: Early approach -->
  <rect x="30" y="85" width="435" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  
  <rect x="45" y="100" width="405" height="36" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="247" y="123" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">1. Пряме зчитування в SRAM (OV7670)</text>

  <!-- Left Sensor -->
  <rect x="55" y="155" width="145" height="135" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="127" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Сенсор OV7670</text>
  <rect x="67" y="195" width="121" height="40" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="127" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Без кодека</text>
  <text x="127" y="227" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">RAW / YUV</text>
  <text x="127" y="254" text-anchor="middle" font-size="11" fill="#6b7280">Великий розмір</text>
  <text x="127" y="270" text-anchor="middle" font-size="11" fill="#6b7280">кожного кадру</text>

  <!-- Left Arrow -->
  <path d="M 200 222 L 235 222" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="217" y="212" text-anchor="middle" font-size="11" fill="#1a1a1a">DVP 8-bit</text>

  <!-- Left Controller -->
  <rect x="240" y="155" width="210" height="135" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="345" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">ESP32 SoC (без PSRAM)</text>
  
  <rect x="252" y="190" width="186" height="88" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="345" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Внутрішня SRAM</text>
  <text x="345" y="228" text-anchor="middle" font-size="11" fill="#1a1a1a">Доступно лише ~512 КБ</text>
  <text x="345" y="246" text-anchor="middle" font-size="11" fill="#6b7280">Буфер кадру &lt; 150 КБ</text>
  <text x="345" y="264" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Немає місця під VGA</text>

  <!-- Left Description Box -->
  <rect x="45" y="305" width="405" height="115" rx="6" fill="#ffffff" stroke="#c0392b" stroke-dasharray="4,4" stroke-width="1.5"/>
  <text x="60" y="328" font-size="13" font-weight="bold" fill="#c0392b">Критичне вузьке місце пам'яті:</text>
  <text x="60" y="350" font-size="12" fill="#1a1a1a">• Нестиснений кадр VGA (640×480 RGB) = 614 КБ</text>
  <text x="60" y="370" font-size="12" fill="#1a1a1a">• Кадровий буфер перевищує вільну SRAM чипа</text>
  <text x="60" y="395" font-size="12" font-weight="bold" fill="#c0392b">➔ Обмеження: тільки QQVGA/QVGA без покрокового відео</text>

  <!-- RIGHT PANEL: ESP32-CAM approach -->
  <rect x="495" y="85" width="435" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  
  <rect x="510" y="100" width="405" height="36" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="712" y="123" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">2. Схема DVP + OV2640 (JPEG + PSRAM)</text>

  <!-- Right Sensor -->
  <rect x="510" y="155" width="150" height="135" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="585" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Сенсор OV2640</text>
  <rect x="522" y="192" width="126" height="40" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="585" y="209" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Апаратний кодек</text>
  <text x="585" y="225" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">JPEG Engine</text>
  <text x="585" y="252" text-anchor="middle" font-size="11" fill="#6b7280">Стиснення кадру</text>
  <text x="585" y="268" text-anchor="middle" font-size="11" fill="#6b7280">в 10–20 разів</text>

  <!-- Right Arrow -->
  <path d="M 660 222 L 695 222" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="677" y="212" text-anchor="middle" font-size="11" fill="#1a1a1a">JPEG DVP</text>

  <!-- Right Controller -->
  <rect x="700" y="155" width="215" height="135" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="807" y="178" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Модуль ESP32-CAM</text>
  
  <rect x="712" y="190" width="191" height="35" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="807" y="212" text-anchor="middle" font-size="11" fill="#1a1a1a">SRAM: DMA транзит кадрів</text>
  
  <rect x="712" y="233" width="191" height="45" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="807" y="251" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Зовнішня PSRAM (4–8 МБ)</text>
  <text x="807" y="269" text-anchor="middle" font-size="11" fill="#6b7280">Повноцінний кадровий буфер</text>

  <!-- Right Description Box -->
  <rect x="510" y="305" width="405" height="115" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="525" y="328" font-size="13" font-weight="bold" fill="#27ae60">Апаратний прорив буферизації:</text>
  <text x="525" y="350" font-size="12" fill="#1a1a1a">• JPEG зменшує розмір кадру UXGA до ~50–150 КБ</text>
  <text x="525" y="370" font-size="12" fill="#1a1a1a">• PSRAM вміщує серію високих роздільностей (2 МП)</text>
  <text x="525" y="395" font-size="12" font-weight="bold" fill="#27ae60">➔ Досягнуто: стрімінг MJPEG UXGA (1600×1200) в IoT</text>
</svg>
