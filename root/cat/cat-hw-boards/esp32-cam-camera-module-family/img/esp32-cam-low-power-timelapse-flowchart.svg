<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Алгоритм енергоефективного таймлапсу на ESP32-CAM</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Часова послідовність ініціалізації периферії, зйомки, деініціалізації та переходу в Deep Sleep</text>

  <!-- КОЛОНКА 1: Пробудження та ініціалізація -->
  <rect x="24" y="70" width="288" height="422" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="36" y="82" width="264" height="32" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="168" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#2457d6">1. ПРОБУДЖЕННЯ ТА ІНІЦІАЛІЗАЦІЯ</text>

  <!-- Крок 1.1 -->
  <rect x="36" y="128" width="264" height="60" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
  <text x="48" y="146" text-anchor="start" font-size="12" font-weight="700" fill="#2457d6">1.1. Пробудження контролера</text>
  <text x="48" y="163" text-anchor="start" font-size="12" fill="#1a1a1a">• RTC Timer (інтервал таймлапсу)</text>
  <text x="48" y="179" text-anchor="start" font-size="12" fill="#6b7280">• або PIR-датчик (EXT0/EXT1 GPIO)</text>

  <line x1="168" y1="188" x2="168" y2="214" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Крок 1.2 -->
  <rect x="36" y="216" width="264" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="48" y="234" text-anchor="start" font-size="12" font-weight="700" fill="#1a1a1a">1.2. Живлення сенсора камери</text>
  <text x="48" y="251" text-anchor="start" font-size="12" fill="#1a1a1a">• PWDN pin → LOW (активація LDO)</text>
  <text x="48" y="267" text-anchor="start" font-size="12" fill="#6b7280">• Подача VCC 2.8V / 1.2V на OV2640</text>

  <line x1="168" y1="276" x2="168" y2="302" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Крок 1.3 -->
  <rect x="36" y="304" width="264" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="48" y="322" text-anchor="start" font-size="12" font-weight="700" fill="#1a1a1a">1.3. Моунтинг microSD (SDMMC/SPI)</text>
  <text x="48" y="339" text-anchor="start" font-size="12" fill="#1a1a1a">• esp_vfs_fat_sdmmc_mount()</text>
  <text x="48" y="355" text-anchor="start" font-size="12" fill="#6b7280">• Перевірка FAT32 та моунтинг FS</text>

  <line x1="168" y1="364" x2="168" y2="390" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Крок 1.4 -->
  <rect x="36" y="392" width="264" height="60" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="48" y="410" text-anchor="start" font-size="12" font-weight="700" fill="#2457d6">1.4. Ініціалізація камери</text>
  <text x="48" y="427" text-anchor="start" font-size="12" fill="#1a1a1a">• esp_camera_init(&amp;camera_config)</text>
  <text x="48" y="443" text-anchor="start" font-size="12" fill="#2457d6">• Конфігурація DVP, XCLK та PSRAM</text>

  <!-- З'єднувач 1 -> 2 -->
  <path d="M300,422 L324,422 L324,158 L348,158" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- КОЛОНКА 2: Зйомка та збереження -->
  <rect x="336" y="70" width="288" height="422" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="348" y="82" width="264" height="32" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="480" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#2457d6">2. ЗЙОМКА ТА ЗБЕРЕЖЕННЯ</text>

  <!-- Крок 2.1 -->
  <rect x="348" y="128" width="264" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="360" y="146" text-anchor="start" font-size="12" font-weight="700" fill="#1a1a1a">2.1. Стабілізація сенсора камери</text>
  <text x="360" y="163" text-anchor="start" font-size="12" fill="#1a1a1a">• Пауза 100–200 мс на авто-експозицію</text>
  <text x="360" y="179" text-anchor="start" font-size="12" fill="#6b7280">• Стабілізація AEC/AGC і балансу білого</text>

  <line x1="480" y1="188" x2="480" y2="214" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Крок 2.2 -->
  <rect x="348" y="216" width="264" height="60" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="360" y="234" text-anchor="start" font-size="12" font-weight="700" fill="#2457d6">2.2. Захват кадру (Framebuffer)</text>
  <text x="360" y="251" text-anchor="start" font-size="12" fill="#1a1a1a">• fb = esp_camera_fb_get()</text>
  <text x="360" y="267" text-anchor="start" font-size="12" fill="#2457d6">• Перевірка вдалого зчитування (fb != NULL)</text>

  <line x1="480" y1="276" x2="480" y2="302" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Крок 2.3 -->
  <rect x="348" y="304" width="264" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="360" y="322" text-anchor="start" font-size="12" font-weight="700" fill="#1a1a1a">2.3. Запис JPEG на microSD</text>
  <text x="360" y="339" text-anchor="start" font-size="12" fill="#1a1a1a">• fopen("/sdcard/img_XXXX.jpg", "w")</text>
  <text x="360" y="355" text-anchor="start" font-size="12" fill="#6b7280">• fwrite(fb-&gt;buf, 1, fb-&gt;len, f) + fclose()</text>

  <line x1="480" y1="364" x2="480" y2="390" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Крок 2.4 -->
  <rect x="348" y="392" width="264" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="360" y="410" text-anchor="start" font-size="12" font-weight="700" fill="#1a1a1a">2.4. Звільнення буфера пам'яті</text>
  <text x="360" y="427" text-anchor="start" font-size="12" fill="#1a1a1a">• esp_camera_fb_return(fb)</text>
  <text x="360" y="443" text-anchor="start" font-size="12" fill="#6b7280">• Очищення оперативної пам'яті (PSRAM)</text>

  <!-- З'єднувач 2 -> 3 -->
  <path d="M612,422 L636,422 L636,158 L660,158" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- КОЛОНКА 3: Деініціалізація та сон -->
  <rect x="648" y="70" width="288" height="422" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="660" y="82" width="264" height="32" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="792" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="#27ae60">3. ДЕІНІЦІАЛІЗАЦІЯ ТА СОН</text>

  <!-- Крок 3.1 -->
  <rect x="660" y="128" width="264" height="60" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="672" y="146" text-anchor="start" font-size="12" font-weight="700" fill="#27ae60">3.1. Розмонтування microSD</text>
  <text x="672" y="163" text-anchor="start" font-size="12" fill="#1a1a1a">• esp_vfs_fat_sdmmc_unmount()</text>
  <text x="672" y="179" text-anchor="start" font-size="12" fill="#27ae60">• Захист FAT32 від пошкодження даних!</text>

  <line x1="792" y1="188" x2="792" y2="214" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Крок 3.2 -->
  <rect x="660" y="216" width="264" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="672" y="234" text-anchor="start" font-size="12" font-weight="700" fill="#1a1a1a">3.2. Вимкнення камери (Power Down)</text>
  <text x="672" y="251" text-anchor="start" font-size="12" fill="#1a1a1a">• esp_camera_deinit()</text>
  <text x="672" y="267" text-anchor="start" font-size="12" fill="#6b7280">• PWDN pin → HIGH (відключення LDO)</text>

  <line x1="792" y1="276" x2="792" y2="302" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Крок 3.3 -->
  <rect x="660" y="304" width="264" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="672" y="322" text-anchor="start" font-size="12" font-weight="700" fill="#1a1a1a">3.3. Налаштування пробудження</text>
  <text x="672" y="339" text-anchor="start" font-size="12" fill="#1a1a1a">• esp_sleep_enable_timer_wakeup(T)</text>
  <text x="672" y="355" text-anchor="start" font-size="12" fill="#6b7280">• або esp_sleep_enable_ext0_wakeup(PIR)</text>

  <line x1="792" y1="364" x2="792" y2="390" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Крок 3.4 -->
  <rect x="660" y="392" width="264" height="60" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="672" y="410" text-anchor="start" font-size="12" font-weight="700" fill="#2457d6">3.4. Перехід у глибокий сон</text>
  <text x="672" y="427" text-anchor="start" font-size="12" fill="#1a1a1a">• esp_deep_sleep_start()</text>
  <text x="672" y="443" text-anchor="start" font-size="12" fill="#2457d6">• Зниження струму до ~20–50 мкА</text>

  <!-- Нижній підпис циклу сну -->
  <text x="480" y="518" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Пауза в режимі Deep Sleep (~20–50 мкА) до наступного спрацьовування RTC-таймера або PIR-датчика</text>

  <!-- Лінія циклу розмежована, щоб не перетинати текст -->
  <path d="M792,452 L792,534 L14,534 L14,158 L36,158" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr-blue)"/>

</svg>
