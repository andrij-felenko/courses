<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часові діаграми паралельної шини DVP камери OV2640</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Співвідношення сигналів VSYNC, HREF, PCLK та даних D[7:0] з інтервалами гасіння (Blanking)</text>

  <!-- Region Background Blocks -->
  <rect x="180" y="85" width="120" height="250" fill="#fdecea" rx="4"/>
  <text x="240" y="102" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Vertical Blanking</text>

  <rect x="300" y="85" width="200" height="250" fill="#e9f7ef" rx="4"/>
  <text x="400" y="102" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Активний рядок 1</text>

  <rect x="500" y="85" width="100" height="250" fill="#fdecea" rx="4"/>
  <text x="550" y="102" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">H-Blanking</text>

  <rect x="600" y="85" width="200" height="250" fill="#e9f7ef" rx="4"/>
  <text x="700" y="102" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Активний рядок 2</text>

  <rect x="800" y="85" width="120" height="250" fill="#fdecea" rx="4"/>
  <text x="860" y="102" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">End of Frame</text>

  <!-- Signal Labels (Left) -->
  <text x="160" y="125" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="end">VSYNC (Кадр)</text>
  <text x="160" y="180" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="end">HREF (Рядок)</text>
  <text x="160" y="245" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">PCLK (Такти)</text>
  <text x="160" y="310" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">D[7:0] (Дані)</text>

  <!-- Waveform 1: VSYNC -->
  <path d="M 180,118 L 295,118 L 300,138 L 805,138 L 810,118 L 920,118" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Waveform 2: HREF -->
  <path d="M 180,190 L 295,190 L 300,165 L 495,165 L 500,190 L 595,190 L 600,165 L 795,165 L 800,190 L 920,190" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Waveform 3: PCLK -->
  <path d="M 180,250 L 190,250 L 190,230 L 200,230 L 200,250 L 210,250 L 210,230 L 220,230 L 220,250 L 230,250 L 230,230 L 240,230 L 240,250 L 250,250 L 250,230 L 260,230 L 260,250 L 270,250 L 270,230 L 280,230 L 280,250 L 290,250 L 290,230 L 300,230 L 300,250 L 310,250 L 310,230 L 320,230 L 320,250 L 330,250 L 330,230 L 340,230 L 340,250 L 350,250 L 350,230 L 360,230 L 360,250 L 370,250 L 370,230 L 380,230 L 380,250 L 390,250 L 390,230 L 400,230 L 400,250 L 410,250 L 410,230 L 420,230 L 420,250 L 430,250 L 430,230 L 440,230 L 440,250 L 450,250 L 450,230 L 460,230 L 460,250 L 470,250 L 470,230 L 480,230 L 480,250 L 490,250 L 490,230 L 500,230 L 500,250 L 510,250 L 510,230 L 520,230 L 520,250 L 530,250 L 530,230 L 540,230 L 540,250 L 550,250 L 550,230 L 560,230 L 560,250 L 570,250 L 570,230 L 580,230 L 580,250 L 590,250 L 590,230 L 600,230 L 600,250 L 610,250 L 610,230 L 620,230 L 620,250 L 630,250 L 630,230 L 640,230 L 640,250 L 650,250 L 650,230 L 660,230 L 660,250 L 670,250 L 670,230 L 680,230 L 680,250 L 690,250 L 690,230 L 700,230 L 700,250 L 710,250 L 710,230 L 720,230 L 720,250 L 730,250 L 730,230 L 740,230 L 740,250 L 750,250 L 750,230 L 760,230 L 760,250 L 770,250 L 770,230 L 780,230 L 780,250 L 790,250 L 790,230 L 800,230 L 800,250 L 810,250 L 810,230 L 820,230 L 820,250 L 830,250 L 830,230 L 840,230 L 840,250 L 850,250 L 850,230 L 860,230 L 860,250 L 870,250 L 870,230 L 880,230 L 880,250 L 890,250 L 890,230 L 900,230 L 900,250 L 910,250 L 910,230 L 920,230" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Waveform 4: D[7:0] Data Bus -->
  <rect x="185" y="292" width="110" height="28" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="240" y="310" font-size="12" fill="#c0392b" text-anchor="middle">Гасіння (Blank)</text>

  <!-- Active Line 1 Data Packets -->
  <polygon points="305,306 312,292 345,292 352,306 345,320 312,320" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="328" y="310" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Y0</text>

  <polygon points="355,306 362,292 395,292 402,306 395,320 362,320" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="378" y="310" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">U0</text>

  <polygon points="405,306 412,292 445,292 452,306 445,320 412,320" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="428" y="310" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Y1</text>

  <polygon points="455,306 462,292 495,292 502,306 495,320 462,320" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="478" y="310" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">V0</text>

  <!-- H-Blanking -->
  <rect x="505" y="292" width="90" height="28" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="550" y="310" font-size="12" fill="#c0392b" text-anchor="middle">H-Blank</text>

  <!-- Active Line 2 Data Packets -->
  <polygon points="605,306 612,292 645,292 652,306 645,320 612,320" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="628" y="310" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Y2</text>

  <polygon points="655,306 662,292 695,292 702,306 695,320 662,320" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="678" y="310" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">U2</text>

  <polygon points="705,306 712,292 745,292 752,306 745,320 712,320" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="728" y="310" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Y3</text>

  <polygon points="755,306 762,292 795,292 802,306 795,320 762,320" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="778" y="310" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">V2</text>

  <!-- End of Frame -->
  <rect x="805" y="292" width="110" height="28" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="860" y="310" font-size="12" fill="#c0392b" text-anchor="middle">Blanking</text>

  <!-- Timing Brackets -->
  <path d="M 180,342 L 180,352 M 180,347 L 300,347 M 300,342 L 300,352" stroke="#c0392b" stroke-width="1.5"/>
  <text x="240" y="365" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">t_v_blanking</text>

  <path d="M 300,342 L 300,352 M 300,347 L 500,347 M 500,342 L 500,352" stroke="#27ae60" stroke-width="1.5"/>
  <text x="400" y="365" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">t_line_active (W_active пікселів)</text>

  <path d="M 500,342 L 500,352 M 500,347 L 600,347 M 600,342 L 600,352" stroke="#c0392b" stroke-width="1.5"/>
  <text x="550" y="365" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">t_h_blanking</text>

  <path d="M 600,342 L 600,352 M 600,347 L 800,347 M 800,342 L 800,352" stroke="#27ae60" stroke-width="1.5"/>
  <text x="700" y="365" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Рядок 2 (Payload)</text>

  <path d="M 180,388 L 180,400 M 180,395 L 920,395 M 920,388 L 920,400" stroke="#2457d6" stroke-width="1.5"/>
  <text x="550" y="412" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Повний період кадру T_frame = 1 / FPS = t_active_frame + t_v_blanking</text>

  <!-- Bottom Summary / Math Box -->
  <rect x="40" y="428" width="880" height="75" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="449" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Формула кадрової частоти (FPS) з урахуванням інтервалів гасіння DVP</text>
  <text x="480" y="470" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">FPS = PCLK / [ (W_active + H_blank) × (H_active + V_blank) × bpp ]</text>
  <text x="480" y="490" font-size="12" fill="#6b7280" text-anchor="middle">Для YUV422 (bpp = 2 байти/піксель): PCLK = 24 МГц забезпечує ~30 FPS при роздільності SVGA (800×600).</text>
</svg>
