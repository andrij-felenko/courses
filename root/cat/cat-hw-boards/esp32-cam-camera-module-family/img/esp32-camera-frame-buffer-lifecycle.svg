<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="580" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Життєвий цикл кадрового буфера camera_fb_t в ESP32</text>
  <text x="480" y="48" font-size="13" text-anchor="middle" fill="#6b7280">Асинхронна буферизація DVP-DMA та керування кадровими буферами в PSRAM</text>

  <!-- Panel 1: DVP-DMA Hardware Layer -->
  <rect x="20" y="68" width="180" height="395" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="110" y="90" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Апаратне захоплення DVP</text>

  <!-- Sub-block 1.1: Camera Sensor -->
  <rect x="30" y="105" width="160" height="52" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="5"/>
  <text x="110" y="124" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Сенсор відеокамери</text>
  <text x="110" y="144" font-size="12" text-anchor="middle" fill="#6b7280">Потік DVP (PCLK, D0–D7)</text>

  <!-- Sub-block 1.2: DMA Controller -->
  <rect x="30" y="169" width="160" height="54" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="5"/>
  <text x="110" y="189" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">I2S / DVP DMA</text>
  <text x="110" y="209" font-size="12" text-anchor="middle" fill="#6b7280">Заповнення буферів PSRAM</text>

  <!-- Sub-block 1.3: Driver Config -->
  <rect x="30" y="235" width="160" height="215" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="5"/>
  <text x="110" y="255" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Конфігурація драйвера</text>
  <text x="110" y="278" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">fb_count = 2</text>
  <text x="110" y="298" font-size="12" text-anchor="middle" fill="#6b7280">(Двохбуферний режим)</text>
  <text x="110" y="320" font-size="12" text-anchor="middle" fill="#6b7280">fb_location = PSRAM</text>
  <text x="110" y="342" font-size="12" text-anchor="middle" fill="#6b7280">pixel_format = JPEG</text>
  <text x="110" y="364" font-size="12" text-anchor="middle" fill="#6b7280">grab_mode = LATEST</text>
  <text x="110" y="402" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">Безперервний DMA-цикл</text>

  <!-- Panel 2: PSRAM Buffer Pool -->
  <rect x="265" y="68" width="370" height="150" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="450" y="88" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Двоелементний пул буферів у PSRAM (fb_count = 2)</text>

  <!-- Buffer 0 Labels above Buffer Pool -->
  <text x="275" y="104" font-size="12" font-weight="bold" text-anchor="start" fill="#2457d6">Запис DMA</text>
  <text x="350" y="104" font-size="12" font-weight="bold" text-anchor="start" fill="#27ae60">Повернення в пул</text>

  <!-- Buffer 0 -->
  <rect x="275" y="112" width="170" height="100" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="5"/>
  <text x="360" y="131" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Буфер 0 (camera_fb_t)</text>
  <text x="360" y="151" font-size="12" text-anchor="middle" fill="#6b7280">Пам'ять: [fb->buf, len]</text>
  <text x="360" y="173" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Стан: ВІЛЬНИЙ</text>
  <text x="360" y="193" font-size="12" text-anchor="middle" fill="#27ae60">(Готовий для DMA)</text>

  <!-- Buffer 1 -->
  <rect x="460" y="112" width="170" height="100" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="5"/>
  <text x="545" y="131" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">Буфер 1 (camera_fb_t)</text>
  <text x="545" y="151" font-size="12" text-anchor="middle" fill="#6b7280">Готовий кадр JPEG</text>
  <text x="545" y="173" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">Стан: ЗАХОПЛЕНО</text>
  <text x="545" y="193" font-size="12" text-anchor="middle" fill="#2457d6">(У користувача)</text>

  <!-- Panel 3: Application Processing Layer -->
  <rect x="265" y="233" width="370" height="230" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="275" y="251" font-size="14" font-weight="bold" text-anchor="start" fill="#1a1a1a">Обробка в прошивці користувача</text>
  <text x="535" y="232" font-size="12" font-weight="bold" text-anchor="end" fill="#2457d6">esp_camera_fb_get()</text>

  <!-- Step 1: Get -->
  <rect x="275" y="266" width="350" height="52" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="5"/>
  <text x="450" y="285" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">1. Захоплення кадру з черги</text>
  <text x="450" y="305" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">camera_fb_t *fb = esp_camera_fb_get();</text>

  <!-- Step 2: Use -->
  <rect x="275" y="330" width="350" height="118" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="5"/>
  <text x="450" y="350" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">2. Використання даних кадру</text>
  <text x="450" y="371" font-size="12" text-anchor="middle" fill="#6b7280">Трансляція HTTP MJPEG / Збереження SD / AI</text>
  <text x="450" y="392" font-size="12" text-anchor="middle" fill="#6b7280">Читання: fb->buf, fb->len, fb->width</text>
  <text x="450" y="424" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">(Буфер заблокований для DMA на час обробки)</text>

  <!-- Flow Labels in Gap 2 -->
  <text x="715" y="190" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Успіх</text>
  <text x="663" y="365" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">Пропуск</text>

  <!-- Panel 4A: Success Return Path -->
  <rect x="740" y="68" width="200" height="175" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="8"/>
  <text x="840" y="90" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">3A. Обов'язкове повернення</text>

  <rect x="750" y="102" width="180" height="50" fill="#ffffff" stroke="#27ae60" stroke-width="1.5" rx="5"/>
  <text x="840" y="121" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">esp_camera_fb_return(fb);</text>
  <text x="840" y="140" font-size="12" font-weight="bold" text-anchor="middle" fill="#6b7280">fb = NULL;</text>

  <text x="840" y="170" font-size="12" text-anchor="middle" fill="#1a1a1a">Буфер повертається в пул</text>
  <text x="840" y="190" font-size="12" text-anchor="middle" fill="#1a1a1a">для нових DMA-кадрів</text>
  <text x="840" y="218" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Стійка робота без витоків!</text>

  <!-- Panel 4B: Memory Leak Hazard -->
  <rect x="740" y="258" width="200" height="205" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="8"/>
  <text x="840" y="280" font-size="13" font-weight="bold" text-anchor="middle" fill="#c0392b">3B. КРИТИЧНА ПОМИЛКА</text>

  <rect x="750" y="292" width="180" height="50" fill="#ffffff" stroke="#c0392b" stroke-width="1.5" rx="5"/>
  <text x="840" y="311" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">Пропущено fb_return(fb)</text>
  <text x="840" y="330" font-size="12" text-anchor="middle" fill="#c0392b">Неповернений дескриптор</text>

  <text x="840" y="360" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">Вичерпання пулу (fb_count=0)</text>
  <text x="840" y="380" font-size="12" text-anchor="middle" fill="#1a1a1a">esp_camera_fb_get() -> NULL</text>
  <text x="840" y="402" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">Зависання відеопотоку</text>
  <text x="840" y="422" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">або паніка ядра ESP32</text>

  <!-- Arrows & Connections -->
  <!-- DMA Fill: Panel 1 -> Panel 2 Buffer 0 -->
  <path d="M 190,192 L 230,192 L 230,170 L 267,170" stroke="#2457d6" stroke-width="2" fill="none" marker-end="url(#arr-blue)"/>

  <!-- Get Call: Panel 2 Buffer 1 -> Panel 3 Step 1 -->
  <line x1="545" y1="212" x2="545" y2="258" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Step 1 -> Step 2 inside Panel 3 -->
  <line x1="450" y1="318" x2="450" y2="323" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Step 2 -> Success Return: Panel 3 -> Panel 4A -->
  <path d="M 625,385 L 690,385 L 690,127 L 742,127" stroke="#27ae60" stroke-width="2.5" fill="none" marker-end="url(#arr-green)"/>

  <!-- Return -> Pool: Panel 4A -> Panel 2 Buffer 0 -->
  <path d="M 840,68 L 840,56 L 250,56 L 250,145 L 267,145" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>

  <!-- Warning Leak Path: Panel 3 Step 2 -> Panel 4B -->
  <path d="M 625,412 L 690,412 L 690,317 L 742,317" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3" fill="none" marker-end="url(#arr-red)"/>

  <!-- Panel 5: Rules / Best Practices Banner -->
  <rect x="20" y="480" width="920" height="75" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="480" y="500" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Правила безпечної роботи з пулом буферів esp_camera:</text>

  <line x1="35" y1="530" x2="65" y2="530" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="75" y="534" font-size="12" font-weight="bold" fill="#27ae60">Кожен esp_camera_fb_get() ЗАВЖДИ має парний esp_camera_fb_return()</text>

  <line x1="535" y1="530" x2="565" y2="530" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <text x="575" y="534" font-size="12" font-weight="bold" fill="#c0392b">Пропуск fb_return() викликає вичерпання пулу та відмову</text>
</svg>
