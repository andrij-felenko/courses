<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Життєвий цикл кадрового буфера camera_fb_t в ESP32</text>
  <text x="480" y="50" font-size="13" text-anchor="middle" fill="#6b7280">Асинхронна буферизація DVP-DMA, захоплення через esp_camera_fb_get() та повернення в пул PSRAM</text>

  <!-- Panel 1: DVP-DMA Hardware Layer -->
  <rect x="30" y="70" width="220" height="370" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="140" y="95" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Апаратне захоплення DVP</text>

  <rect x="45" y="115" width="190" height="55" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="5"/>
  <text x="140" y="137" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Сенсор відеокамери</text>
  <text x="140" y="155" font-size="11" text-anchor="middle" fill="#6b7280">Потік DVP (PCLK, D0–D7)</text>

  <rect x="45" y="185" width="190" height="60" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="5"/>
  <text x="140" y="207" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">I2S / DVP DMA</text>
  <text x="140" y="225" font-size="11" text-anchor="middle" fill="#6b7280">Заповнення кадрів у PSRAM</text>

  <rect x="45" y="260" width="190" height="165" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="5"/>
  <text x="140" y="282" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Параметри драйвера</text>
  <text x="140" y="305" font-size="11" text-anchor="middle" fill="#1a1a1a">fb_count = 2 (Двохбуферний)</text>
  <text x="140" y="325" font-size="11" text-anchor="middle" fill="#6b7280">fb_location = CAMERA_FB_IN_PSRAM</text>
  <text x="140" y="345" font-size="11" text-anchor="middle" fill="#6b7280">pixel_format = PIXFORMAT_JPEG</text>
  <text x="140" y="365" font-size="11" text-anchor="middle" fill="#6b7280">grab_mode = CAMERA_GRAB_LATEST</text>
  <text x="140" y="405" font-size="11" font-weight="bold" text-anchor="middle" fill="#2457d6">Безперервний DMA-цикл</text>

  <!-- Panel 2: PSRAM Buffer Pool (Double Buffering) -->
  <rect x="280" y="70" width="390" height="145" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="475" y="93" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Двоелементний пул буферів у PSRAM (fb_count = 2)</text>

  <!-- Buffer 0 -->
  <rect x="295" y="110" width="170" height="85" fill="#ffffff" stroke="#27ae60" stroke-width="1.5" rx="5"/>
  <text x="380" y="132" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Буфер 0 (camera_fb_t)</text>
  <text x="380" y="150" font-size="11" text-anchor="middle" fill="#6b7280">Масив [fb->buf, len]</text>
  <text x="380" y="172" font-size="11" font-weight="bold" text-anchor="middle" fill="#27ae60">Стан: ВІЛЬНИЙ (для DMA)</text>

  <!-- Buffer 1 -->
  <rect x="485" y="110" width="170" height="85" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="5"/>
  <text x="570" y="132" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">Буфер 1 (camera_fb_t)</text>
  <text x="570" y="150" font-size="11" text-anchor="middle" fill="#6b7280">Готовий кадр JPEG</text>
  <text x="570" y="172" font-size="11" font-weight="bold" text-anchor="middle" fill="#2457d6">Стан: ЗАХОПЛЕНО (App)</text>

  <!-- Panel 3: Application Processing Layer -->
  <rect x="280" y="235" width="390" height="205" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="475" y="258" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Обробка в користувацькій прошивці</text>

  <!-- Step 1: Get -->
  <rect x="295" y="272" width="360" height="55" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="5"/>
  <text x="475" y="293" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">1. Захоплення кадру з черги</text>
  <text x="475" y="313" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">camera_fb_t *fb = esp_camera_fb_get();</text>

  <!-- Step 2: Use -->
  <rect x="295" y="340" width="360" height="85" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="5"/>
  <text x="475" y="360" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">2. Використання даних кадру</text>
  <text x="475" y="380" font-size="11" text-anchor="middle" fill="#6b7280">Трансляція HTTP MJPEG: httpd_resp_send_chunk()</text>
  <text x="475" y="398" font-size="11" text-anchor="middle" fill="#6b7280">або збереження на MicroSD / Обробка нейромережею</text>
  <text x="475" y="415" font-size="11" font-weight="bold" text-anchor="middle" fill="#2457d6">Читання: fb->buf, fb->len, fb->width, fb->format</text>

  <!-- Panel 4 Top: Success Release Path -->
  <rect x="700" y="70" width="230" height="175" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="8"/>
  <text x="815" y="93" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">3. Обов'язкове повернення</text>

  <rect x="715" y="108" width="200" height="55" fill="#ffffff" stroke="#27ae60" stroke-width="1.5" rx="5"/>
  <text x="815" y="128" font-size="11" font-weight="bold" text-anchor="middle" fill="#27ae60">esp_camera_fb_return(fb);</text>
  <text x="815" y="148" font-size="11" font-weight="bold" text-anchor="middle" fill="#6b7280">fb = NULL;</text>

  <text x="815" y="180" font-size="11" text-anchor="middle" fill="#1a1a1a">Буфер повертається у двоелементний</text>
  <text x="815" y="196" font-size="11" text-anchor="middle" fill="#1a1a1a">пул PSRAM для нових кадрів</text>
  <text x="815" y="225" font-size="11" font-weight="bold" text-anchor="middle" fill="#27ae60">Стійка робота без витоків!</text>

  <!-- Panel 4 Bottom: Memory Leak Hazard -->
  <rect x="700" y="260" width="230" height="180" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="8"/>
  <text x="815" y="283" font-size="13" font-weight="bold" text-anchor="middle" fill="#c0392b">КРИТИЧНА ПОМИЛКА</text>

  <rect x="715" y="298" width="200" height="50" fill="#ffffff" stroke="#c0392b" stroke-width="1.5" rx="5"/>
  <text x="815" y="318" font-size="11" font-weight="bold" text-anchor="middle" fill="#c0392b">Пропущено fb_return(fb)</text>
  <text x="815" y="336" font-size="11" text-anchor="middle" fill="#c0392b">Неповернений дескриптор</text>

  <text x="815" y="367" font-size="11" font-weight="bold" text-anchor="middle" fill="#c0392b">Вичерпання пулу (fb_count=0)</text>
  <text x="815" y="387" font-size="11" text-anchor="middle" fill="#1a1a1a">esp_camera_fb_get() -> NULL</text>
  <text x="815" y="405" font-size="11" font-weight="bold" text-anchor="middle" fill="#c0392b">Зависання відеопотоку / Паніка</text>

  <!-- Arrows & Connections -->
  <!-- DMA Fill: Panel 1 -> Panel 2 -->
  <path d="M 235,215 L 265,215 L 265,152.5 L 295,152.5" stroke="#2457d6" stroke-width="2" fill="none" marker-end="url(#arr-blue)"/>
  <text x="265" y="140" font-size="11" font-weight="bold" text-anchor="middle" fill="#2457d6">Запис DMA</text>

  <!-- Get Call: Panel 2 -> Panel 3 Step 1 -->
  <line x1="570" y1="195" x2="570" y2="272" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="595" y="235" font-size="11" font-weight="bold" text-anchor="middle" fill="#2457d6">fb_get()</text>

  <!-- Step 1 -> Step 2 -->
  <line x1="475" y1="327" x2="475" y2="340" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Step 2 -> Success Return: Panel 3 -> Panel 4 Top -->
  <path d="M 655,382.5 L 685,382.5 L 685,135.5 L 715,135.5" stroke="#27ae60" stroke-width="2.5" fill="none" marker-end="url(#arr-green)"/>
  <text x="685" y="250" font-size="11" font-weight="bold" text-anchor="middle" fill="#27ae60">Виклики</text>

  <!-- Return -> Pool: Panel 4 Top -> Panel 2 -->
  <path d="M 815,70 L 815,55 L 380,55 L 380,110" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>
  <text x="597.5" y="48" font-size="11" font-weight="bold" text-anchor="middle" fill="#27ae60">Повернення буфера в пул (Очищення)</text>

  <!-- Warning Leak Path: Panel 3 -> Panel 4 Bottom -->
  <path d="M 655,382.5 L 675,382.5 L 675,323 L 715,323" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3" fill="none" marker-end="url(#arr-red)"/>

  <!-- Panel 5: Legend / Rules Panel -->
  <rect x="30" y="460" width="900" height="75" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="480" y="480" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Правила безпечної роботи з двоелементним пулом буферів esp_camera:</text>

  <line x1="50" y1="505" x2="80" y2="505" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="90" y="509" font-size="11" font-weight="bold" fill="#27ae60">Успішний цикл: кожен esp_camera_fb_get() ЗАВЖДИ має парний esp_camera_fb_return()</text>

  <line x1="560" y1="505" x2="590" y2="505" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <text x="600" y="509" font-size="11" font-weight="bold" fill="#c0392b">Витік пам'яті: випромінює вичерпання fb_count та відмову драйвера</text>
</svg>
