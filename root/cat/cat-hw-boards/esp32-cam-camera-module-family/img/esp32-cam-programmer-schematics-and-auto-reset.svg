<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема підключення ESP32-CAM з автоскидом DTR/RTS та фільтрацією живлення</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Транзистори Q1/Q2 автоматично комутують RESET і GPIO0, а конденсатори C1/C2 стабілізують лінію 5V</text>

  <!-- Block 1: USB-UART Converter -->
  <rect x="40" y="80" width="190" height="450" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="8"/>
  <text x="135" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">USB-UART Конвертер</text>
  <text x="135" y="123" text-anchor="middle" font-size="12" fill="#6b7280">(FT232RL / CP2102)</text>

  <!-- USB-UART Pins & Labels -->
  <text x="215" y="144" text-anchor="end" font-size="13" font-weight="bold" fill="#c0392b">5V</text>
  <circle cx="230" cy="150" r="4" fill="#c0392b"/>

  <text x="215" y="204" text-anchor="end" font-size="13" font-weight="bold" fill="#1a1a1a">GND</text>
  <circle cx="230" cy="210" r="4" fill="#1a1a1a"/>

  <text x="215" y="264" text-anchor="end" font-size="13" font-weight="bold" fill="#2457d6">TXD</text>
  <circle cx="230" cy="270" r="4" fill="#2457d6"/>

  <text x="215" y="314" text-anchor="end" font-size="13" font-weight="bold" fill="#27ae60">RXD</text>
  <circle cx="230" cy="320" r="4" fill="#27ae60"/>

  <text x="215" y="394" text-anchor="end" font-size="13" font-weight="bold" fill="#1a1a1a">DTR</text>
  <circle cx="230" cy="400" r="4" fill="#1a1a1a"/>

  <text x="215" y="454" text-anchor="end" font-size="13" font-weight="bold" fill="#1a1a1a">RTS</text>
  <circle cx="230" cy="460" r="4" fill="#1a1a1a"/>

  <!-- Block 2: Power Decoupling -->
  <rect x="260" y="80" width="440" height="160" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="8"/>
  <text x="480" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Фізична розв'язка живлення (5V / 2A)</text>

  <!-- Power Lines -->
  <line x1="230" y1="150" x2="730" y2="150" stroke="#c0392b" stroke-width="3"/>
  <line x1="230" y1="210" x2="730" y2="210" stroke="#1a1a1a" stroke-width="3"/>

  <!-- C1 (Electrolytic Capacitor) -->
  <line x1="340" y1="150" x2="340" y2="173" stroke="#c0392b" stroke-width="2"/>
  <rect x="325" y="173" width="30" height="4" fill="#c0392b"/>
  <rect x="325" y="183" width="30" height="4" fill="#1a1a1a"/>
  <line x1="340" y1="187" x2="340" y2="210" stroke="#1a1a1a" stroke-width="2"/>
  <text x="365" y="182" text-anchor="start" font-size="11" fill="#6b7280">C1 (100–470 µF)</text>

  <!-- C2 (Ceramic Capacitor) -->
  <line x1="520" y1="150" x2="520" y2="173" stroke="#c0392b" stroke-width="2"/>
  <rect x="505" y="173" width="30" height="4" fill="#2457d6"/>
  <rect x="505" y="183" width="30" height="4" fill="#1a1a1a"/>
  <line x1="520" y1="187" x2="520" y2="210" stroke="#1a1a1a" stroke-width="2"/>
  <text x="545" y="182" text-anchor="start" font-size="11" fill="#6b7280">C2 (0.1 µF кераміка)</text>

  <!-- TX/RX Signal Lines -->
  <line x1="230" y1="270" x2="720" y2="270" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="480" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">TXD (USB) → U0R (RX)</text>

  <line x1="730" y1="320" x2="240" y2="320" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="480" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">RXD (USB) ← U0T (TX)</text>

  <!-- Block 3: Auto-Reset & Control Circuit -->
  <rect x="260" y="360" width="440" height="170" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="8"/>
  <text x="480" y="382" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Апаратний автоперехід DTR/RTS та кнопки керування</text>

  <!-- Lines from DTR/RTS to Circuit -->
  <line x1="230" y1="400" x2="280" y2="400" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="230" y1="460" x2="280" y2="460" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Transistor Sub-box -->
  <rect x="280" y="398" width="180" height="115" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="370" y="416" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Вузол Q1 / Q2 (S8050)</text>
  <text x="370" y="438" text-anchor="middle" font-size="11" fill="#6b7280">DTR=0, RTS=1 ⇒ RESET</text>
  <text x="370" y="460" text-anchor="middle" font-size="11" fill="#6b7280">DTR=1, RTS=0 ⇒ GPIO0</text>
  <text x="370" y="482" text-anchor="middle" font-size="11" fill="#27ae60">Авто-скид у розробці</text>

  <!-- Button Sub-boxes -->
  <rect x="500" y="398" width="180" height="52" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="4"/>
  <text x="590" y="420" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Кнопка RESET (EN)</text>
  <text x="590" y="438" text-anchor="middle" font-size="11" fill="#6b7280">Замикає EN на GND</text>

  <rect x="500" y="461" width="180" height="52" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="4"/>
  <text x="590" y="483" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Кнопка GPIO0 (BOOT)</text>
  <text x="590" y="501" text-anchor="middle" font-size="11" fill="#6b7280">Замикає GPIO0 на GND</text>

  <!-- Output Lines from Block 3 to ESP32-CAM -->
  <line x1="680" y1="424" x2="730" y2="410" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="680" y1="487" x2="730" y2="470" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Block 4: ESP32-CAM Board -->
  <rect x="730" y="80" width="190" height="450" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="8"/>
  <text x="825" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Плата ESP32-CAM</text>
  <text x="825" y="123" text-anchor="middle" font-size="12" fill="#6b7280">(AI-Thinker)</text>

  <!-- ESP32-CAM Pins & Labels -->
  <circle cx="730" cy="150" r="4" fill="#c0392b"/>
  <text x="745" y="144" text-anchor="start" font-size="13" font-weight="bold" fill="#c0392b">5V</text>

  <circle cx="730" cy="210" r="4" fill="#1a1a1a"/>
  <text x="745" y="204" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">GND</text>

  <circle cx="730" cy="270" r="4" fill="#2457d6"/>
  <text x="745" y="264" text-anchor="start" font-size="13" font-weight="bold" fill="#2457d6">U0R (RX)</text>

  <circle cx="730" cy="320" r="4" fill="#27ae60"/>
  <text x="745" y="314" text-anchor="start" font-size="13" font-weight="bold" fill="#27ae60">U0T (TX)</text>

  <circle cx="730" cy="410" r="4" fill="#1a1a1a"/>
  <text x="745" y="404" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">EN / RST</text>

  <circle cx="730" cy="470" r="4" fill="#1a1a1a"/>
  <text x="745" y="464" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">GPIO0</text>
</svg>
