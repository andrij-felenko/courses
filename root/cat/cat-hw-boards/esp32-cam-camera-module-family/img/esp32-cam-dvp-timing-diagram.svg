<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма сигналів DVP (XCLK, PCLK, VSYNC, HREF)</text>
  <text x="480" y="55" font-size="13" fill="#6b7280" text-anchor="middle">Співвідношення між опорним XCLK, піксельним PCLK, кадровим VSYNC, рядковим HREF та лініями даних D0–D7</text>

  <!-- Панель діаграми -->
  <rect x="20" y="75" width="920" height="320" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Колонки областей діаграми -->
  <rect x="180" y="95" width="100" height="290" fill="#fdecea" rx="4" opacity="0.5"/>
  <text x="230" y="92" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">HBLANK (Пауза)</text>

  <rect x="280" y="95" width="300" height="290" fill="#e9f7ef" rx="4" opacity="0.4"/>
  <text x="430" y="92" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Активна частина рядка N (Валідні пікселі)</text>

  <rect x="580" y="95" width="100" height="290" fill="#fdecea" rx="4" opacity="0.5"/>
  <text x="630" y="92" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">HBLANK</text>

  <rect x="680" y="95" width="230" height="290" fill="#e9f7ef" rx="4" opacity="0.4"/>
  <text x="795" y="92" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Активна частина рядка N+1</text>

  <!-- Ліва колонка позначок сигналів -->
  <!-- 1. XCLK -->
  <rect x="35" y="102" width="130" height="40" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="100" y="118" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">XCLK</text>
  <text x="100" y="133" font-size="11" fill="#6b7280" text-anchor="middle">Вхідний (ESP32)</text>

  <!-- 2. VSYNC -->
  <rect x="35" y="162" width="130" height="40" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="100" y="178" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">VSYNC</text>
  <text x="100" y="193" font-size="11" fill="#6b7280" text-anchor="middle">Кадровий строб</text>

  <!-- 3. HREF -->
  <rect x="35" y="222" width="130" height="40" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="100" y="238" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">HREF</text>
  <text x="100" y="253" font-size="11" fill="#6b7280" text-anchor="middle">Рядковий строб</text>

  <!-- 4. PCLK -->
  <rect x="35" y="282" width="130" height="40" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="100" y="298" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">PCLK</text>
  <text x="100" y="313" font-size="11" fill="#6b7280" text-anchor="middle">Піксельний строб</text>

  <!-- 5. D0-D7 -->
  <rect x="35" y="342" width="130" height="40" rx="4" fill="#f3e8fd" stroke="#8e44ad" stroke-width="1"/>
  <text x="100" y="358" font-size="13" font-weight="bold" fill="#8e44ad" text-anchor="middle">D0 – D7</text>
  <text x="100" y="373" font-size="11" fill="#6b7280" text-anchor="middle">Шина даних (8 біт)</text>

  <!-- Сигнальні хвилі -->
  <!-- 1. XCLK хвиля -->
  <path d="M 180,132 L 185,132 L 185,112 L 195,112 L 195,132 L 205,132 L 205,112 L 215,112 L 215,132 L 225,132 L 225,112 L 235,112 L 235,132 L 245,132 L 245,112 L 255,112 L 255,132 L 265,132 L 265,112 L 275,112 L 275,132 L 285,132 L 285,112 L 295,112 L 295,132 L 305,132 L 305,112 L 315,112 L 315,132 L 325,132 L 325,112 L 335,112 L 335,132 L 345,132 L 345,112 L 355,112 L 355,132 L 365,132 L 365,112 L 375,112 L 375,132 L 385,132 L 385,112 L 395,112 L 395,132 L 405,132 L 405,112 L 415,112 L 415,132 L 425,132 L 425,112 L 435,112 L 435,132 L 445,132 L 445,112 L 455,112 L 455,132 L 465,132 L 465,112 L 475,112 L 475,132 L 485,132 L 485,112 L 495,112 L 495,132 L 505,132 L 505,112 L 515,112 L 515,132 L 525,132 L 525,112 L 535,112 L 535,132 L 545,132 L 545,112 L 555,112 L 555,132 L 565,132 L 565,112 L 575,112 L 575,132 L 585,132 L 585,112 L 595,112 L 595,132 L 605,132 L 605,112 L 615,112 L 615,132 L 625,132 L 625,112 L 635,112 L 635,132 L 645,132 L 645,112 L 655,112 L 655,132 L 665,132 L 665,112 L 675,112 L 675,132 L 685,132 L 685,112 L 695,112 L 695,132 L 705,132 L 705,112 L 715,112 L 715,132 L 725,132 L 725,112 L 735,112 L 735,132 L 745,132 L 745,112 L 755,112 L 755,132 L 765,132 L 765,112 L 775,112 L 775,132 L 785,132 L 785,112 L 795,112 L 795,132 L 805,132 L 805,112 L 815,112 L 815,132 L 825,132 L 825,112 L 835,112 L 835,132 L 845,132 L 845,112 L 855,112 L 855,132 L 865,132 L 865,112 L 875,112 L 875,132 L 885,132 L 885,112 L 895,112 L 895,132 L 910,132" fill="none" stroke="#2457d6" stroke-width="1.8"/>

  <!-- 2. VSYNC хвиля -->
  <path d="M 180,192 L 910,192" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="895" y="185" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="end">VSYNC = LOW (Активний кадр)</text>

  <!-- 3. HREF хвиля -->
  <path d="M 180,252 L 280,252 L 280,232 L 580,232 L 580,252 L 680,252 L 680,232 L 910,232" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <text x="430" y="224" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">HREF = HIGH (Передача рядка)</text>
  <text x="230" y="246" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">HREF = LOW</text>

  <!-- 4. PCLK хвиля -->
  <!-- HBLANK: тиша або низький рівень -->
  <line x1="180" y1="312" x2="280" y2="312" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- Active Line N: тактові імпульси PCLK -->
  <path d="M 280,312 L 285,312 L 285,292 L 300,292 L 300,312 L 315,312 L 315,292 L 330,292 L 330,312 L 345,312 L 345,292 L 360,292 L 360,312 L 375,312 L 375,292 L 390,292 L 390,312 L 405,312 L 405,292 L 420,292 L 420,312 L 435,312 L 435,292 L 450,292 L 450,312 L 465,312 L 465,292 L 480,292 L 480,312 L 495,312 L 495,292 L 510,292 L 510,312 L 525,312 L 525,292 L 540,292 L 540,312 L 555,312 L 555,292 L 570,292 L 570,312 L 580,312" fill="none" stroke="#2457d6" stroke-width="2"/>
  <!-- HBLANK: тиша -->
  <line x1="580" y1="312" x2="680" y2="312" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- Active Line N+1: тактові імпульси PCLK -->
  <path d="M 680,312 L 685,312 L 685,292 L 700,292 L 700,312 L 715,312 L 715,292 L 730,292 L 730,312 L 745,312 L 745,292 L 760,292 L 760,312 L 775,312 L 775,292 L 790,292 L 790,312 L 805,312 L 805,292 L 820,292 L 820,312 L 835,312 L 835,292 L 850,292 L 850,312 L 865,312 L 865,292 L 880,292 L 880,312 L 895,312 L 895,292 L 910,292" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- 5. D0-D7 Шина даних -->
  <!-- HBLANK 1: High-Z / Невалідні дані -->
  <line x1="180" y1="362" x2="280" y2="362" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="230" y="356" font-size="11" fill="#6b7280" text-anchor="middle">High-Z</text>

  <!-- Active Line N: Шестикутники байтів -->
  <!-- Пакет 1 -->
  <polygon points="280,362 290,347 335,347 345,362 335,377 290,377" fill="#f3e8fd" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="312.5" y="366" font-size="11" font-weight="bold" fill="#8e44ad" text-anchor="middle">Байт 1</text>

  <!-- Пакет 2 -->
  <polygon points="345,362 355,347 400,347 410,362 400,377 355,377" fill="#f3e8fd" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="377.5" y="366" font-size="11" font-weight="bold" fill="#8e44ad" text-anchor="middle">Байт 2</text>

  <!-- Пакет 3 -->
  <polygon points="410,362 420,347 465,347 475,362 465,377 420,377" fill="#f3e8fd" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="442.5" y="366" font-size="11" font-weight="bold" fill="#8e44ad" text-anchor="middle">Байт 3</text>

  <!-- Пакет 4 -->
  <polygon points="475,362 485,347 530,347 540,362 530,377 485,377" fill="#f3e8fd" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="507.5" y="366" font-size="11" font-weight="bold" fill="#8e44ad" text-anchor="middle">Байт 4</text>

  <!-- Пакет 5 (...) -->
  <polygon points="540,362 548,347 572,347 580,362 572,377 548,377" fill="#f3e8fd" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="560" y="366" font-size="11" font-weight="bold" fill="#8e44ad" text-anchor="middle">...</text>

  <!-- HBLANK 2: High-Z -->
  <line x1="580" y1="362" x2="680" y2="362" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="630" y="356" font-size="11" fill="#6b7280" text-anchor="middle">High-Z</text>

  <!-- Active Line N+1: Шестикутники байтів -->
  <!-- Пакет N+1 1 -->
  <polygon points="680,362 690,347 735,347 745,362 735,377 690,377" fill="#f3e8fd" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="712.5" y="366" font-size="11" font-weight="bold" fill="#8e44ad" text-anchor="middle">Байт 1</text>

  <!-- Пакет N+1 2 -->
  <polygon points="745,362 755,347 800,347 810,362 800,377 755,377" fill="#f3e8fd" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="777.5" y="366" font-size="11" font-weight="bold" fill="#8e44ad" text-anchor="middle">Байт 2</text>

  <!-- Пакет N+1 3 -->
  <polygon points="810,362 820,347 865,347 875,362 865,377 820,377" fill="#f3e8fd" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="842.5" y="366" font-size="11" font-weight="bold" fill="#8e44ad" text-anchor="middle">Байт 3</text>

  <!-- Пакет N+1 4 (...) -->
  <polygon points="875,362 882,347 902,347 910,362 902,377 882,377" fill="#f3e8fd" stroke="#8e44ad" stroke-width="1.5"/>
  <text x="892" y="366" font-size="11" font-weight="bold" fill="#8e44ad" text-anchor="middle">...</text>

  <!-- Нижня підсумкова панель приміток -->
  <rect x="20" y="408" width="920" height="38" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <circle cx="50" cy="427" r="4" fill="#2457d6"/>
  <text x="60" y="431" font-size="12" fill="#1a1a1a">1 імпульс PCLK = 1 байт на D0–D7</text>

  <circle cx="340" cy="427" r="4" fill="#27ae60"/>
  <text x="350" y="431" font-size="12" fill="#1a1a1a">RGB565 / YUV422 = 2 байти на піксель (2 такти PCLK)</text>

  <circle cx="710" cy="427" r="4" fill="#c0392b"/>
  <text x="720" y="431" font-size="12" fill="#1a1a1a">HREF регулює вибірку DMA</text>
</svg>
