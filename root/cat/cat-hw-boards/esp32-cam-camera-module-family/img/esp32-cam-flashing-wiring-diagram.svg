<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2c3e50"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Header Section -->
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема підключення ESP32-CAM до USB-UART для прошивання</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Подача живлення 5V, перехресне з'єднання TX/RX та замикання GPIO0 на GND для режиму завантаження</text>

  <!-- Left Panel: USB-UART Adapter -->
  <rect x="80" y="90" width="260" height="355" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="8"/>
  <rect x="80" y="90" width="260" height="42" fill="#2457d6" rx="8"/>
  <rect x="80" y="124" width="260" height="8" fill="#2457d6"/>
  <text x="210" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Адаптер USB-UART</text>
  <text x="210" y="132" text-anchor="middle" font-size="11" fill="#eaf0fd">(FT232 / CP2102 / CH340)</text>

  <!-- Left Panel USB Connector Illustration -->
  <rect x="150" y="390" width="120" height="40" fill="#d0d7de" stroke="#6b7280" stroke-width="1.5" rx="4"/>
  <text x="210" y="414" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Роз'єм USB</text>

  <!-- Left Panel Pin Dots & Labels -->
  <circle cx="320" cy="170" r="6" fill="#c0392b"/>
  <text x="305" y="174" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">5V (VCC)</text>

  <circle cx="320" cy="230" r="6" fill="#2457d6"/>
  <text x="305" y="234" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">TXD (TX)</text>

  <circle cx="320" cy="290" r="6" fill="#27ae60"/>
  <text x="305" y="294" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">RXD (RX)</text>

  <circle cx="320" cy="350" r="6" fill="#2c3e50"/>
  <text x="305" y="354" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">GND</text>


  <!-- Right Panel: ESP32-CAM Board -->
  <rect x="620" y="90" width="260" height="355" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="8"/>
  <rect x="620" y="90" width="260" height="42" fill="#1a1a1a" rx="8"/>
  <rect x="620" y="124" width="260" height="8" fill="#1a1a1a"/>
  <text x="750" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Плата ESP32-CAM</text>
  <text x="750" y="132" text-anchor="middle" font-size="11" fill="#9ca3af">(Модуль AI-Thinker)</text>

  <!-- Right Panel Pin Dots & Labels -->
  <circle cx="640" cy="170" r="6" fill="#c0392b"/>
  <text x="655" y="174" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">5V</text>

  <circle cx="640" cy="230" r="6" fill="#2457d6"/>
  <text x="655" y="234" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">U0R (RX)</text>

  <circle cx="640" cy="290" r="6" fill="#27ae60"/>
  <text x="655" y="294" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">U0T (TX)</text>

  <circle cx="640" cy="350" r="6" fill="#2c3e50"/>
  <text x="655" y="354" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">GND</text>

  <circle cx="640" cy="410" r="6" fill="#c0392b"/>
  <text x="655" y="414" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">GPIO0</text>

  <!-- Flash Mode Jumper Box on ESP32-CAM -->
  <rect x="720" y="340" width="145" height="90" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <text x="792" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Flash Mode</text>
  <text x="792" y="382" text-anchor="middle" font-size="11" fill="#1a1a1a">Замикання</text>
  <text x="792" y="398" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">GPIO0 ➔ GND</text>
  <text x="792" y="418" text-anchor="middle" font-size="10" fill="#6b7280">(для завантаження)</text>

  <!-- Jumper Cable (GPIO0 to GND) -->
  <path d="M 640,410 C 600,410 600,350 640,350" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="5,3"/>


  <!-- Inter-Module Connection Lines & Labels -->

  <!-- 1. 5V Power Line -->
  <text x="480" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Живлення 5V (Вхід)</text>
  <line x1="326" y1="170" x2="634" y2="170" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-red)"/>

  <!-- 2. TXD -> U0R Line -->
  <text x="480" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Сигнал TXD ➔ U0R (RX)</text>
  <line x1="326" y1="230" x2="634" y2="230" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>

  <!-- 3. RXD <- U0T Line -->
  <text x="480" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Сигнал RXD ⇽ U0T (TX)</text>
  <line x1="634" y1="290" x2="326" y2="290" stroke="#27ae60" stroke-width="3" marker-end="url(#arr-green)"/>

  <!-- 4. GND Ground Line -->
  <text x="480" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#2c3e50">Спільна земля (GND)</text>
  <line x1="326" y1="350" x2="634" y2="350" stroke="#2c3e50" stroke-width="3" marker-end="url(#arr-dark)"/>


  <!-- Bottom Action Steps Banner -->
  <rect x="80" y="465" width="800" height="40" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="480" y="490" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Порядок дій: 1. З'єднати GPIO0 з GND  ➔  2. Подати 5V  ➔  3. Прошити  ➔  4. Зняти перемичку  ➔  5. Скинути живлення</text>
</svg>
