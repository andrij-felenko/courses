<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <defs>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема триканального живлення сенсора OV2640 на платі ESP32-CAM</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Незалежні LDO 2.8 В (AVDD) і 1.2 В (DVDD) та фільтрація зменшують завади у відеосигналі</text>

  <!-- Left Panel: Input Power Supply -->
  <rect x="30" y="80" width="140" height="430" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="100" y="108" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вхідне живлення</text>
  <text x="100" y="128" font-size="12" fill="#6b7280" text-anchor="middle">Системна плата</text>

  <!-- Main 3.3V Power Bus -->
  <text x="100" y="155" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">+3.3V VCC</text>
  <line x1="100" y1="165" x2="100" y2="440" stroke="#2457d6" stroke-width="3"/>

  <!-- Junction Dots on Main Bus -->
  <circle cx="100" cy="175" r="4" fill="#2457d6"/>
  <circle cx="100" cy="305" r="4" fill="#2457d6"/>
  <circle cx="100" cy="435" r="4" fill="#2457d6"/>

  <!-- Main System LDO Note Box -->
  <rect x="40" y="455" width="120" height="42" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="100" y="472" font-size="12" fill="#6b7280" text-anchor="middle">AMS1117 3.3V</text>
  <text x="100" y="488" font-size="12" fill="#6b7280" text-anchor="middle">(головний LDO)</text>

  <!-- Channel 1: Analog Power AVDD 2.8V -->
  <rect x="200" y="80" width="480" height="135" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="215" y="104" font-size="13" font-weight="bold" fill="#27ae60">Канал 1: Аналогове живлення AVDD (2.8 В)</text>
  <text x="215" y="122" font-size="12" fill="#6b7280">Живлення фотоматриці та АЦП (мінімізація завад)</text>

  <!-- Channel 1 Wiring & Components -->
  <line x1="100" y1="175" x2="240" y2="175" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- LDO 2.8V Box -->
  <rect x="240" y="150" width="105" height="50" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="292" y="171" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">LDO 2.8V</text>
  <text x="292" y="189" font-size="12" fill="#6b7280" text-anchor="middle">XC6206 / RT9193</text>

  <!-- Output wire 2.8V -->
  <line x1="345" y1="175" x2="680" y2="175" stroke="#27ae60" stroke-width="2"/>

  <!-- Capacitor C1 (10 uF) -->
  <circle cx="375" cy="175" r="3" fill="#27ae60"/>
  <line x1="375" y1="175" x2="375" y2="185" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="365" y1="185" x2="385" y2="185" stroke="#27ae60" stroke-width="2"/>
  <line x1="365" y1="189" x2="385" y2="189" stroke="#27ae60" stroke-width="2"/>
  <line x1="375" y1="189" x2="375" y2="196" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="368" y1="196" x2="382" y2="196" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="371" y1="199" x2="379" y2="199" stroke="#27ae60" stroke-width="1"/>
  <text x="375" y="211" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">C1 (10 мкФ)</text>

  <!-- Capacitor C2 (100 nF) -->
  <circle cx="470" cy="175" r="3" fill="#27ae60"/>
  <line x1="470" y1="175" x2="470" y2="185" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="460" y1="185" x2="480" y2="185" stroke="#27ae60" stroke-width="2"/>
  <line x1="460" y1="189" x2="480" y2="189" stroke="#27ae60" stroke-width="2"/>
  <line x1="470" y1="189" x2="470" y2="196" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="463" y1="196" x2="477" y2="196" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="466" y1="199" x2="474" y2="199" stroke="#27ae60" stroke-width="1"/>
  <text x="470" y="211" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">C2 (100 нФ)</text>

  <!-- AVDD Line Label -->
  <text x="560" y="148" font-size="12" font-weight="bold" fill="#27ae60">AVDD = 2.8 В</text>
  <text x="560" y="164" font-size="12" fill="#27ae60">(чиста напруга)</text>

  <!-- Channel 2: Digital Core Power DVDD 1.2V -->
  <rect x="200" y="230" width="480" height="135" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="215" y="254" font-size="13" font-weight="bold" fill="#2457d6">Канал 2: Цифрове ядро DVDD (1.2 В)</text>
  <text x="215" y="272" font-size="12" fill="#6b7280">Живлення внутрішнього DSP та цифрової логіки</text>

  <!-- Channel 2 Wiring & Components -->
  <line x1="100" y1="305" x2="240" y2="305" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- LDO 1.2V Box -->
  <rect x="240" y="280" width="105" height="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="292" y="301" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">LDO 1.2V</text>
  <text x="292" y="319" font-size="12" fill="#6b7280" text-anchor="middle">XC6206 / RT9193</text>

  <!-- Output wire 1.2V -->
  <line x1="345" y1="305" x2="680" y2="305" stroke="#2457d6" stroke-width="2"/>

  <!-- Capacitor C3 (10 uF) -->
  <circle cx="375" cy="305" r="3" fill="#2457d6"/>
  <line x1="375" y1="305" x2="375" y2="315" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="365" y1="315" x2="385" y2="315" stroke="#2457d6" stroke-width="2"/>
  <line x1="365" y1="319" x2="385" y2="319" stroke="#2457d6" stroke-width="2"/>
  <line x1="375" y1="319" x2="375" y2="326" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="368" y1="326" x2="382" y2="326" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="371" y1="329" x2="379" y2="329" stroke="#2457d6" stroke-width="1"/>
  <text x="375" y="341" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">C3 (10 мкФ)</text>

  <!-- Capacitor C4 (100 nF) -->
  <circle cx="470" cy="305" r="3" fill="#2457d6"/>
  <line x1="470" y1="305" x2="470" y2="315" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="460" y1="315" x2="480" y2="315" stroke="#2457d6" stroke-width="2"/>
  <line x1="460" y1="319" x2="480" y2="319" stroke="#2457d6" stroke-width="2"/>
  <line x1="470" y1="319" x2="470" y2="326" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="463" y1="326" x2="477" y2="326" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="466" y1="329" x2="474" y2="329" stroke="#2457d6" stroke-width="1"/>
  <text x="470" y="341" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">C4 (100 нФ)</text>

  <!-- DVDD Line Label -->
  <text x="560" y="278" font-size="12" font-weight="bold" fill="#2457d6">DVDD = 1.2 В</text>
  <text x="560" y="294" font-size="12" fill="#6b7280">(ядро сенсора)</text>

  <!-- Channel 3: I/O Buffers DOVDD 3.3V -->
  <rect x="200" y="380" width="480" height="135" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="215" y="404" font-size="13" font-weight="bold" fill="#1a1a1a">Канал 3: Буфери введення-виведення DOVDD (3.3 В)</text>
  <text x="215" y="422" font-size="12" fill="#6b7280">Пряме живлення буферів DVP (узгодження рівнів з ESP32)</text>

  <!-- Channel 3 Wiring & Components -->
  <polyline points="100,435 100,455 240,455" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Direct Bus Box -->
  <rect x="240" y="430" width="105" height="50" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="292" y="451" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Шина 3.3 В</text>
  <text x="292" y="469" font-size="12" fill="#6b7280" text-anchor="middle">(без LDO)</text>

  <!-- Output wire 3.3V -->
  <line x1="345" y1="455" x2="680" y2="455" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Capacitor C5 (100 nF) -->
  <circle cx="420" cy="455" r="3" fill="#1a1a1a"/>
  <line x1="420" y1="455" x2="420" y2="465" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="410" y1="465" x2="430" y2="465" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="410" y1="469" x2="430" y2="469" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="420" y1="469" x2="420" y2="476" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="413" y1="476" x2="427" y2="476" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="416" y1="479" x2="424" y2="479" stroke="#1a1a1a" stroke-width="1"/>
  <text x="420" y="491" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">C5 (100 нФ)</text>

  <!-- DOVDD Line Label -->
  <text x="560" y="428" font-size="12" font-weight="bold" fill="#1a1a1a">DOVDD = 3.3 В</text>
  <text x="560" y="444" font-size="12" fill="#6b7280">(буфери I/O)</text>

  <!-- Right Panel: OV2640 Sensor Connector -->
  <rect x="710" y="80" width="220" height="430" fill="#ffffff" stroke="#2457d6" stroke-width="2" rx="8"/>
  <text x="820" y="108" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Сенсор OV2640</text>
  <text x="820" y="126" font-size="12" fill="#6b7280" text-anchor="middle">Роз'єм FPC 24-pin</text>

  <!-- Pin 15 Box -->
  <line x1="680" y1="175" x2="725" y2="175" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="725" y="150" width="190" height="50" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="735" y="171" font-size="13" font-weight="bold" fill="#27ae60">AVDD — Pin 15</text>
  <text x="735" y="189" font-size="12" fill="#1a1a1a">2.8 В (Аналогова матриця)</text>

  <!-- Pin 17 Box -->
  <line x1="680" y1="305" x2="725" y2="305" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="725" y="280" width="190" height="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="735" y="301" font-size="13" font-weight="bold" fill="#2457d6">DVDD — Pin 17</text>
  <text x="735" y="319" font-size="12" fill="#1a1a1a">1.2 В (Цифрове ядро)</text>

  <!-- Pin 19 Box -->
  <line x1="680" y1="455" x2="725" y2="455" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>
  <rect x="725" y="430" width="190" height="50" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="735" y="451" font-size="13" font-weight="bold" fill="#1a1a1a">DOVDD — Pin 19</text>
  <text x="735" y="469" font-size="12" fill="#1a1a1a">3.3 В (Буфери I/O DVP)</text>

  <!-- Common Ground Info Box -->
  <rect x="725" y="488" width="190" height="20" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="820" y="502" font-size="12" fill="#6b7280" text-anchor="middle">AGND / DGND — Земля</text>
</svg>
