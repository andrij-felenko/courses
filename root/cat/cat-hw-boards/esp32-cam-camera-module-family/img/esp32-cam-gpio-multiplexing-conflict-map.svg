<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Карта апаратних конфліктів GPIO у модулях ESP32-CAM</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Мультиплексування ліній DVP, слота MicroSD, спалаху та завантажувальних контактів</text>

  <!-- Top Panel: Camera DVP Monopolization -->
  <rect x="40" y="70" width="880" height="60" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="55" y="92" font-size="13" font-weight="bold" fill="#2457d6">Шина камери DVP (OV2640): 16 виводів GPIO повністю заблоковані</text>
  <text x="55" y="114" font-size="12" fill="#1a1a1a">Дані: D0–D7 (GPIO 34, 35, 36, 39, 19, 21, 5, 18)  |  Синхронізація: PCLK(22), VSYNC(25), HREF(23)  |  I2C/SCCB: SIOD(27), SIOC(26)</text>

  <!-- Card 1: GPIO 4 Conflict -->
  <rect x="40" y="145" width="425" height="180" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <text x="55" y="168" font-size="13" font-weight="bold" fill="#c0392b">1. GPIO 4: Спалах LED vs MicroSD (DAT1)</text>
  
  <rect x="55" y="182" width="160" height="44" fill="#ffffff" stroke="#c0392b" rx="4"/>
  <text x="135" y="199" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Flash LED (Спалах)</text>
  <text x="135" y="215" font-size="11" fill="#6b7280" text-anchor="middle">Керування драйвером</text>

  <rect x="285" y="182" width="160" height="44" fill="#ffffff" stroke="#c0392b" rx="4"/>
  <text x="365" y="199" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">MicroSD (SDMMC)</text>
  <text x="365" y="215" font-size="11" fill="#6b7280" text-anchor="middle">Лінія даних DAT1</text>

  <line x1="135" y1="226" x2="210" y2="238" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="365" y1="226" x2="290" y2="238" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <rect x="195" y="238" width="110" height="26" fill="#c0392b" rx="4"/>
  <text x="250" y="255" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Шина GPIO 4</text>

  <text x="55" y="283" font-size="11" font-weight="bold" fill="#c0392b">Проблема:</text>
  <text x="118" y="283" font-size="11" fill="#1a1a1a">Світлодіод спалахує при читанні/записі файлів.</text>
  <text x="55" y="303" font-size="11" font-weight="bold" fill="#27ae60">Обхід:</text>
  <text x="98" y="303" font-size="11" fill="#1a1a1a">1-бітний режим SDMMC (DAT0) без використання DAT1.</text>

  <!-- Card 2: GPIO 0 Conflict -->
  <rect x="495" y="145" width="425" height="180" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <text x="510" y="168" font-size="13" font-weight="bold" fill="#c0392b">2. GPIO 0: Камера XCLK vs Strapping Pin Boot</text>

  <rect x="510" y="182" width="160" height="44" fill="#ffffff" stroke="#c0392b" rx="4"/>
  <text x="590" y="199" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">OV2640 XCLK</text>
  <text x="590" y="215" font-size="11" fill="#6b7280" text-anchor="middle">Вхід тактування 20 МГц</text>

  <rect x="740" y="182" width="160" height="44" fill="#ffffff" stroke="#c0392b" rx="4"/>
  <text x="820" y="199" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Режим завантаження</text>
  <text x="820" y="215" font-size="11" fill="#6b7280" text-anchor="middle">GND = Flash / High = Boot</text>

  <line x1="590" y1="226" x2="665" y2="238" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="820" y1="226" x2="745" y2="238" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <rect x="650" y="238" width="110" height="26" fill="#c0392b" rx="4"/>
  <text x="705" y="255" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Шина GPIO 0</text>

  <text x="510" y="283" font-size="11" font-weight="bold" fill="#c0392b">Проблема:</text>
  <text x="573" y="283" font-size="11" fill="#1a1a1a">Генерація XCLK при старті блокує звичайний Boot.</text>
  <text x="510" y="303" font-size="11" font-weight="bold" fill="#27ae60">Обхід:</text>
  <text x="553" y="303" font-size="11" fill="#1a1a1a">Підтяжка High під час старту; GND лише для прошивки.</text>

  <!-- Card 3: GPIO 12 Conflict -->
  <rect x="40" y="345" width="425" height="180" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <text x="55" y="368" font-size="13" font-weight="bold" fill="#c0392b">3. GPIO 12: MicroSD (DAT2) vs Напруга SPI Flash</text>

  <rect x="55" y="382" width="160" height="44" fill="#ffffff" stroke="#c0392b" rx="4"/>
  <text x="135" y="399" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">MicroSD DAT2</text>
  <text x="135" y="415" font-size="11" fill="#6b7280" text-anchor="middle">Підтяжка PULL-UP 10 кОм</text>

  <rect x="285" y="382" width="160" height="44" fill="#ffffff" stroke="#c0392b" rx="4"/>
  <text x="365" y="399" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Strapping MTDI</text>
  <text x="365" y="415" font-size="11" fill="#6b7280" text-anchor="middle">Вибір напруги 3.3V / 1.8V</text>

  <line x1="135" y1="426" x2="210" y2="438" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="365" y1="426" x2="290" y2="438" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <rect x="195" y="438" width="110" height="26" fill="#c0392b" rx="4"/>
  <text x="250" y="455" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Шина GPIO 12</text>

  <text x="55" y="483" font-size="11" font-weight="bold" fill="#c0392b">Проблема:</text>
  <text x="118" y="483" font-size="11" fill="#1a1a1a">High на GPIO12 ставить 1.8V для Flash -> збій зчитування.</text>
  <text x="55" y="503" font-size="11" font-weight="bold" fill="#27ae60">Обхід:</text>
  <text x="98" y="503" font-size="11" fill="#1a1a1a">Використання 1-бітного режиму SDMMC (вивільняє DAT2).</text>

  <!-- Card 4: Free & Reserved GPIOs -->
  <rect x="495" y="345" width="425" height="180" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="510" y="368" font-size="13" font-weight="bold" fill="#27ae60">4. Вільні та резервовані GPIO (UART / PSRAM)</text>

  <rect x="510" y="382" width="160" height="44" fill="#ffffff" stroke="#d0d7de" rx="4"/>
  <text x="590" y="399" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GPIO 1 (TX) / 3 (RX)</text>
  <text x="590" y="415" font-size="11" fill="#6b7280" text-anchor="middle">Логи та прошивка UART0</text>

  <rect x="740" y="382" width="160" height="44" fill="#ffffff" stroke="#d0d7de" rx="4"/>
  <text x="820" y="399" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GPIO 16 / 17</text>
  <text x="820" y="415" font-size="11" fill="#6b7280" text-anchor="middle">Зайняті PSRAM (CS / CLK)</text>

  <line x1="590" y1="426" x2="665" y2="438" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="820" y1="426" x2="745" y2="438" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <rect x="635" y="438" width="140" height="26" fill="#27ae60" rx="4"/>
  <text x="705" y="455" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Доступно: GPIO 13, 14, 15</text>

  <text x="510" y="483" font-size="11" font-weight="bold" fill="#2457d6">Особливість:</text>
  <text x="590" y="483" font-size="11" fill="#1a1a1a">GPIO16/17 заблоковані за наявності чипа PSRAM.</text>
  <text x="510" y="503" font-size="11" font-weight="bold" fill="#27ae60">Рекомендація:</text>
  <text x="596" y="503" font-size="11" fill="#1a1a1a">Для зовнішніх датчиків: GPIO 13 (при 1-bit SD mode).</text>
</svg>
