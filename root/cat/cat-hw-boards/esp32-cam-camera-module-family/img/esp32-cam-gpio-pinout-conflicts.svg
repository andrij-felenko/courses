<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема та карта апаратних конфліктів GPIO у модулі ESP32-CAM</text>
  <text x="480" y="48" text-anchor="middle" font-size="13" fill="#6b7280">Сумісне використання виводів між шинами камери DVP, SDMMC картки пам'яті, PSRAM та світлодіодом спалаху</text>

  <!-- LEFT PANEL: Pin Allocation -->
  <rect x="35" y="80" width="315" height="340" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="192" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">ESP32-CAM: Внутрішній розподіл GPIO</text>

  <!-- Row 1: GPIO4 -->
  <rect x="45" y="125" width="295" height="40" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="55" y="145" font-size="12" font-weight="bold" fill="#c0392b">GPIO4</text>
  <text x="110" y="145" font-size="12" fill="#1a1a1a">LED Спалах + SDMMC D1</text>
  <text x="110" y="160" font-size="10" fill="#6b7280">[Критичний конфлікт: спалах блимає при SD]</text>

  <!-- Row 2: GPIO0 -->
  <rect x="45" y="175" width="295" height="40" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="55" y="195" font-size="12" font-weight="bold" fill="#c0392b">GPIO0</text>
  <text x="110" y="195" font-size="12" fill="#1a1a1a">XCLK камери + Кнопка BOOT</text>
  <text x="110" y="210" font-size="10" fill="#6b7280">[Стропувальний вивід режиму прошивки]</text>

  <!-- Row 3: GPIO16/17 -->
  <rect x="45" y="225" width="295" height="40" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="55" y="245" font-size="12" font-weight="bold" fill="#c0392b">GPIO16/17</text>
  <text x="125" y="245" font-size="12" fill="#1a1a1a">Шина PSRAM (4 МБ)</text>
  <text x="125" y="260" font-size="10" fill="#6b7280">[Заблоковано для системної пам'яті]</text>

  <!-- Row 4: GPIO12..15 -->
  <rect x="45" y="275" width="295" height="40" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="55" y="295" font-size="12" font-weight="bold" fill="#2457d6">GPIO12..15</text>
  <text x="135" y="295" font-size="12" fill="#1a1a1a">Шина MicroSD (SDMMC)</text>
  <text x="135" y="310" font-size="10" fill="#6b7280">[Вільні при 1-бітовому режимі SD]</text>

  <!-- Row 5: DVP Bus -->
  <rect x="45" y="325" width="295" height="40" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="55" y="345" font-size="12" font-weight="bold" fill="#27ae60">DVP ШИНА</text>
  <text x="130" y="345" font-size="12" fill="#1a1a1a">Лінії камери OV2640</text>
  <text x="130" y="360" font-size="10" fill="#6b7280">[PCLK, VSYNC, HREF, SIOC, SIOD, Y2..Y9]</text>

  <!-- Row 6: GPIO33 -->
  <rect x="45" y="375" width="295" height="35" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="396" font-size="12" font-weight="bold" fill="#1a1a1a">GPIO33</text>
  <text x="110" y="396" font-size="12" fill="#1a1a1a">Вбудований червоний LED (Active Low)</text>

  <!-- RIGHT PANEL: Conflict Resolution -->
  <rect x="370" y="80" width="555" height="340" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="647" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Схеми розв'язання конфліктів та оптимізація виводів</text>

  <!-- Conflict Box 1: GPIO4 -->
  <rect x="385" y="125" width="525" height="90" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="398" y="145" font-size="13" font-weight="bold" fill="#c0392b">1. Конфлікт GPIO4 (Яскравий спалах LED + SD-картка)</text>

  <rect x="398" y="155" width="240" height="50" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="518" y="174" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">4-бітовий режим SDMMC</text>
  <text x="518" y="191" text-anchor="middle" font-size="10" fill="#1a1a1a">GPIO4 спалахує при кожному запису SD</text>

  <line x1="643" y1="180" x2="663" y2="180" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <rect x="668" y="155" width="232" height="50" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="784" y="174" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">1-бітовий режим (1-bit Mode)</text>
  <text x="784" y="191" text-anchor="middle" font-size="10" fill="#1a1a1a">SD_MMC.begin("/sdcard", true)</text>

  <!-- Conflict Box 2: GPIO0 -->
  <rect x="385" y="225" width="525" height="90" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="398" y="245" font-size="13" font-weight="bold" fill="#c0392b">2. Конфлікт GPIO0 (Режим прошивки BOOT vs Тактування XCLK)</text>

  <rect x="398" y="255" width="240" height="50" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="518" y="274" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">GPIO0 = LOW при скиданні</text>
  <text x="518" y="291" text-anchor="middle" font-size="10" fill="#1a1a1a">Вхід у режим ROM Bootloader (Прошивка)</text>

  <line x1="643" y1="280" x2="663" y2="280" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <rect x="668" y="255" width="232" height="50" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="784" y="274" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">GPIO0 = HIGH (10k Pull-up)</text>
  <text x="784" y="291" text-anchor="middle" font-size="10" fill="#1a1a1a">Нормальний запуск коду та тактування XCLK</text>

  <!-- Recommendations Box -->
  <rect x="385" y="325" width="525" height="85" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="398" y="344" font-size="12" font-weight="bold" fill="#2457d6">Рекомендації щодо використання виводів під зовнішню периферію:</text>
  <text x="398" y="363" font-size="11" fill="#1a1a1a">• В 1-бітовому режимі SDMMC вивільняються виводи: GPIO12, GPIO13, GPIO15</text>
  <text x="398" y="380" font-size="11" fill="#1a1a1a">• Виводи GPIO34, GPIO35, GPIO36, GPIO39 працюють ЛИШЕ на вхід (Input Only, без Pull-up/down)</text>
  <text x="398" y="397" font-size="11" fill="#1a1a1a">• Не використовуйте GPIO16, GPIO17 (PSRAM) та GPIO1, GPIO3 (UART лог / завантаження)</text>
</svg>
