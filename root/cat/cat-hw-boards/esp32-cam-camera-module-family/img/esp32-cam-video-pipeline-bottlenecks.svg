<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Пляшкові шийки відеоконвеєра ESP32-CAM та їх подолання</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Порівняння обробки відеопотоку у внутрішній пам'яті SRAM та через розширену архітектуру DMA й PSRAM</text>

  <!-- Left Container: Problem / SRAM Limitations -->
  <rect x="30" y="75" width="435" height="360" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="8"/>
  <text x="247" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">Обробка у внутрішній SRAM (Без PSRAM)</text>

  <!-- Left Block 1: Camera Sensor -->
  <rect x="50" y="120" width="395" height="55" fill="#ffffff" stroke="#c0392b" stroke-width="1" rx="6"/>
  <text x="247" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Сенсор зображення (OV2640)</text>
  <text x="247" y="158" text-anchor="middle" font-size="11" fill="#6b7280">Нестиснений кадр / висока роздільність (UXGA 1600×1200)</text>

  <!-- Left Arrow 1 -->
  <line x1="247" y1="175" x2="247" y2="200" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="260" y="192" text-anchor="start" font-size="11" fill="#c0392b">Нестача пам'яті</text>

  <!-- Left Block 2: Internal SRAM Bottleneck -->
  <rect x="50" y="200" width="395" height="110" fill="#ffffff" stroke="#c0392b" stroke-width="1" rx="6"/>
  <text x="65" y="222" text-anchor="start" font-size="13" font-weight="bold" fill="#c0392b">Внутрішня SRAM ESP32 (Всього ~520 КБ)</text>
  <text x="65" y="242" text-anchor="start" font-size="11" fill="#1a1a1a">• Доступна DRAM для Heap: ~280-320 КБ</text>
  <text x="65" y="262" text-anchor="start" font-size="11" font-weight="bold" fill="#c0392b">• UXGA Framebuffer (RGB565): ~3.84 МБ — Переповнення!</text>
  <text x="65" y="282" text-anchor="start" font-size="11" fill="#6b7280">• Фрагментація Heap при частій алокації кадрів</text>

  <!-- Left Arrow 2 -->
  <line x1="247" y1="310" x2="247" y2="335" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="260" y="327" text-anchor="start" font-size="11" fill="#c0392b">Деградація</text>

  <!-- Left Block 3: Consequences -->
  <rect x="50" y="335" width="395" height="85" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="6"/>
  <text x="65" y="355" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">Наслідки для відеоконвеєра:</text>
  <text x="65" y="373" text-anchor="start" font-size="11" fill="#1a1a1a">❌ Обмеження роздільності до QVGA (320×240) / CIF</text>
  <text x="65" y="391" text-anchor="start" font-size="11" fill="#1a1a1a">❌ Низький FPS (&lt; 5-8 кадр/с) та пропуски кадрів</text>
  <text x="65" y="409" text-anchor="start" font-size="11" fill="#1a1a1a">❌ Помилка ESP_ERR_NO_MEM / Спрацювання Brownout</text>

  <!-- Right Container: Solution / DMA + PSRAM Architecture -->
  <rect x="495" y="75" width="435" height="360" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="8"/>
  <text x="712" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#27ae60">Розширена архітектура (DMA + PSRAM)</text>

  <!-- Right Block 1: Sensor + DMA -->
  <rect x="515" y="120" width="395" height="55" fill="#ffffff" stroke="#27ae60" stroke-width="1" rx="6"/>
  <text x="712" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Сенсор (OV2640) + I2S/DVP з DMA</text>
  <text x="712" y="158" text-anchor="middle" font-size="11" fill="#6b7280">Пряма передача даних без участі CPU (Zero-CPU overhead)</text>

  <!-- Right Arrow 1 -->
  <line x1="712" y1="175" x2="712" y2="200" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="725" y="192" text-anchor="start" font-size="11" fill="#27ae60">Шина Quad SPI</text>

  <!-- Right Block 2: External PSRAM Solution -->
  <rect x="515" y="200" width="395" height="110" fill="#ffffff" stroke="#27ae60" stroke-width="1" rx="6"/>
  <text x="530" y="222" text-anchor="start" font-size="13" font-weight="bold" fill="#27ae60">Зовнішня пам'ять PSRAM (4 МБ / 8 МБ)</text>
  <text x="530" y="242" text-anchor="start" font-size="11" fill="#1a1a1a">• Маповування в простір CPU через Flash/PSRAM MMU</text>
  <text x="530" y="262" text-anchor="start" font-size="11" font-weight="bold" fill="#27ae60">• Подвійна буферизація (Double Buffering: FB1 &amp; FB2)</text>
  <text x="530" y="282" text-anchor="start" font-size="11" fill="#6b7280">• Виділення буфера прямо в PSRAM (alloc_caps)</text>

  <!-- Right Arrow 2 -->
  <line x1="712" y1="310" x2="712" y2="335" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="725" y="327" text-anchor="start" font-size="11" fill="#27ae60">Потік без блокувань</text>

  <!-- Right Block 3: Advantages -->
  <rect x="515" y="335" width="395" height="85" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="6"/>
  <text x="530" y="355" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">Переваги розширеного конвеєра:</text>
  <text x="530" y="373" text-anchor="start" font-size="11" fill="#1a1a1a">✓ Висока роздільність (UXGA 1600×1200 / SVGA)</text>
  <text x="530" y="391" text-anchor="start" font-size="11" fill="#1a1a1a">✓ Плавне потокове відео (20-30 FPS u MJPEG)</text>
  <text x="530" y="409" text-anchor="start" font-size="11" fill="#1a1a1a">✓ Стабільна робота вебсервера та Edge AI моделей</text>
</svg>
