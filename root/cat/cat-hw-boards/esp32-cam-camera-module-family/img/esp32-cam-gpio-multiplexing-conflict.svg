<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Мультиплексування та конфлікти GPIO на платі ESP32-CAM</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Сумісне використання виводів між камерою DVP, microSD та LED спалахом спричиняє збої boot-режимів</text>

  <!-- LEFT COLUMN: Peripherals -->
  <!-- Camera Box -->
  <rect x="30" y="95" width="250" height="105" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="155" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Сенсор камери OV2640</text>
  <text x="45" y="142" font-size="12" fill="#1a1a1a">• XCLK (Master Clock)</text>
  <text x="45" y="162" font-size="12" fill="#1a1a1a">• DVP Data Y2 (GPIO 12)</text>
  <text x="45" y="182" font-size="12" fill="#6b7280">• DVP Data Y3..Y5 (GPIO 13..15)</text>

  <!-- microSD Box -->
  <rect x="30" y="220" width="250" height="110" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="155" y="243" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Слот картки microSD</text>
  <text x="45" y="267" font-size="12" fill="#1a1a1a">• HS2_DATA1 (GPIO 4)</text>
  <text x="45" y="287" font-size="12" fill="#1a1a1a">• HS2_DATA2 (GPIO 12)</text>
  <text x="45" y="307" font-size="12" fill="#6b7280">• HS2_CMD/CLK (GPIO 13..15)</text>

  <!-- Flash LED Box -->
  <rect x="30" y="350" width="250" height="85" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="155" y="373" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Яркий LED Спалах</text>
  <text x="45" y="397" font-size="12" fill="#1a1a1a">• Силовий транзистор LED</text>
  <text x="45" y="417" font-size="12" fill="#c0392b">• Керування з GPIO 4</text>

  <!-- CENTER COLUMN: ESP32 SoC -->
  <rect x="345" y="95" width="270" height="340" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Мікроконтролер ESP32</text>

  <!-- Pin 1: GPIO 0 -->
  <rect x="360" y="135" width="240" height="60" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="372" y="156" font-size="13" font-weight="bold" fill="#c0392b">GPIO 0 [Strapping: BOOT]</text>
  <text x="372" y="177" font-size="12" fill="#1a1a1a">Спільний з Camera XCLK</text>

  <!-- Pin 2: GPIO 4 -->
  <rect x="360" y="210" width="240" height="60" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="372" y="231" font-size="13" font-weight="bold" fill="#c0392b">GPIO 4 [Силовий вивод]</text>
  <text x="372" y="252" font-size="12" fill="#1a1a1a">Спільний: LED &amp; SD_DATA1</text>

  <!-- Pin 3: GPIO 12 -->
  <rect x="360" y="285" width="240" height="60" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="372" y="306" font-size="13" font-weight="bold" fill="#c0392b">GPIO 12 [Strapping: VDD_SDIO]</text>
  <text x="372" y="327" font-size="12" fill="#1a1a1a">Спільний: SD_DATA2 &amp; Camera Y2</text>

  <!-- Pin 4: GPIO 13..15 -->
  <rect x="360" y="360" width="240" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="372" y="381" font-size="13" font-weight="bold" fill="#1a1a1a">GPIO 13, 14, 15 [DVP / SD]</text>
  <text x="372" y="402" font-size="12" fill="#6b7280">Спільні: DVP Y3..Y5 &amp; SD Bus</text>

  <!-- RIGHT COLUMN: Impact & Conflicts -->
  <!-- Conflict 1 -->
  <rect x="680" y="135" width="250" height="60" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="692" y="156" font-size="12" font-weight="bold" fill="#c0392b">Неможливість старту</text>
  <text x="692" y="177" font-size="12" fill="#1a1a1a">XCLK зависає в ROM Bootloader</text>

  <!-- Conflict 2 -->
  <rect x="680" y="210" width="250" height="60" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="692" y="231" font-size="12" font-weight="bold" fill="#c0392b">Спалах при записі SD</text>
  <text x="692" y="252" font-size="12" fill="#1a1a1a">Падіння напруги та збій SD</text>

  <!-- Conflict 3 -->
  <rect x="680" y="285" width="250" height="60" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="692" y="306" font-size="12" font-weight="bold" fill="#c0392b">Аварійний Bootloop</text>
  <text x="692" y="327" font-size="12" fill="#1a1a1a">Перемикання Flash на 1.8V</text>

  <!-- Solution Box -->
  <rect x="680" y="360" width="250" height="60" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="692" y="381" font-size="12" font-weight="bold" fill="#27ae60">Апаратні рішення:</text>
  <text x="692" y="402" font-size="12" fill="#1a1a1a">1-bit SD mode, HS2_DATA2 high-Z</text>

  <!-- CONNECTIONS: Left -> Center -->
  <line x1="280" y1="140" x2="360" y2="165" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="280" y1="250" x2="360" y2="240" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="280" y1="290" x2="360" y2="315" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <path d="M280,392 C315,392 325,255 360,255" fill="none" stroke="#c0392b" stroke-dasharray="4,3" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- CONNECTIONS: Center -> Right -->
  <line x1="600" y1="165" x2="680" y2="165" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="600" y1="240" x2="680" y2="240" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="600" y1="315" x2="680" y2="315" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="600" y1="390" x2="680" y2="390" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- BOTTOM CALLOUT -->
  <rect x="30" y="475" width="900" height="50" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="480" y="496" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">КРИТИЧНА ПАСТКА: GPIO 12 та GPIO 0 є Strapping-виводами конфігурації завантаження чипа</text>
  <text x="480" y="516" text-anchor="middle" font-size="12" fill="#1a1a1a">Зміщення потенціалу на них під час увімкнення блокує Flash-пам'ять або переводить ESP32 у режим прошивки</text>
</svg>
