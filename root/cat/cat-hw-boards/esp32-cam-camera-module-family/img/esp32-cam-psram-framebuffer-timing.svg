<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Подвійна кадрова буферизація в PSRAM та часові інтервали DMA</text>
  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Захоплення кадру камери через DMA у внутрішню SRAM та почергова передача у FB0/FB1 PSRAM усуває розриви зображення</text>

  <!-- TOP PANEL: Dataflow Architecture -->
  <rect x="30" y="70" width="900" height="215" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="45" y="90" font-size="13" font-weight="bold" fill="#1a1a1a">Архітектура конвеєра даних камери ESP32-CAM</text>

  <!-- Camera Sensor Block -->
  <rect x="45" y="105" width="220" height="165" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="155" y="127" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Сенсор камери (OV2640)</text>
  <rect x="60" y="140" width="190" height="30" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="155" y="159" text-anchor="middle" font-size="12" fill="#1a1a1a">DVP паралельні дані D[0:7]</text>
  <rect x="60" y="176" width="190" height="30" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="155" y="195" text-anchor="middle" font-size="12" fill="#1a1a1a">Синхронізація VSYNC / HREF</text>
  <rect x="60" y="212" width="190" height="30" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="155" y="231" text-anchor="middle" font-size="12" fill="#1a1a1a">Тактування PCLK / XCLK</text>

  <!-- Flow Arrows: Camera -> ESP32 DMA -->
  <line x1="265" y1="155" x2="340" y2="155" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="302" y="148" text-anchor="middle" font-size="11" fill="#2457d6">DVP Stream</text>

  <line x1="265" y1="210" x2="340" y2="210" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-gray)"/>
  <text x="302" y="203" text-anchor="middle" font-size="11" fill="#6b7280">Такти / Синхро</text>

  <!-- ESP32 Internal SRAM / DMA Block -->
  <rect x="345" y="105" width="250" height="165" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="470" y="127" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">ESP32: DMA контролер &amp; SRAM</text>

  <rect x="360" y="140" width="220" height="36" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="470" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">DMA Буфер A (внутрішня SRAM)</text>

  <rect x="360" y="183" width="220" height="36" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="470" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">DMA Буфер B (внутрішня SRAM)</text>

  <text x="470" y="244" text-anchor="middle" font-size="11" fill="#6b7280">Пакетна передача через SPI без участі CPU</text>

  <!-- Flow Arrows: ESP32 -> PSRAM -->
  <line x1="595" y1="183" x2="660" y2="183" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="627" y="175" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">SPI DMA</text>

  <!-- External PSRAM Block -->
  <rect x="665" y="105" width="245" height="165" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/>
  <text x="787" y="127" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Зовнішня PSRAM (4–8 МБ)</text>

  <rect x="680" y="140" width="215" height="48" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="787" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">FB0 (Кадр N — запис DMA)</text>
  <text x="787" y="177" text-anchor="middle" font-size="11" fill="#6b7280">Буфер прийому поточного кадру</text>

  <rect x="680" y="196" width="215" height="48" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="787" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">FB1 (Кадр N-1 — обробка)</text>
  <text x="787" y="233" text-anchor="middle" font-size="11" fill="#6b7280">Готовий для Wi-Fi / HTTP стримінгу</text>

  <!-- BOTTOM PANEL: Timing Diagram -->
  <rect x="30" y="300" width="900" height="240" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="45" y="320" font-size="13" font-weight="bold" fill="#1a1a1a">Часова діаграма передачі кадрів та синхронізації (Timing Diagram)</text>

  <!-- Signal Labels (Left Axis) -->
  <text x="45" y="352" font-size="12" font-weight="bold" fill="#1a1a1a">VSYNC (Кадр)</text>
  <text x="45" y="392" font-size="12" font-weight="bold" fill="#1a1a1a">HREF (Рядки)</text>
  <text x="45" y="432" font-size="12" font-weight="bold" fill="#1a1a1a">SRAM (DMA)</text>
  <text x="45" y="472" font-size="12" font-weight="bold" fill="#1a1a1a">PSRAM FB0/FB1</text>
  <text x="45" y="512" font-size="12" font-weight="bold" fill="#1a1a1a">Обробка / Стрим</text>

  <!-- Axis Separator Line -->
  <line x1="175" y1="330" x2="175" y2="525" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Vertical Timing Guidelines -->
  <line x1="220" y1="330" x2="220" y2="525" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="540" y1="330" x2="540" y2="525" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="540" y="325" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Перемикання FB0 ↔ FB1</text>

  <!-- Signal 1: VSYNC Waveform -->
  <path d="M 175,342 L 200,342 L 200,356 L 220,356 L 220,342 L 525,342 L 525,356 L 545,356 L 545,342 L 910,342" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="210" y="338" text-anchor="middle" font-size="11" fill="#c0392b">Pulse N</text>
  <text x="535" y="338" text-anchor="middle" font-size="11" fill="#c0392b">Pulse N+1</text>

  <!-- Signal 2: HREF Waveform -->
  <path d="M 175,396 L 225,396 L 225,382 L 255,382 L 255,396 L 270,396 L 270,382 L 300,382 L 300,396 L 315,396 L 315,382 L 345,382 L 345,396 L 360,396 L 360,382 L 390,382 L 390,396 L 405,396 L 405,382 L 435,382 L 435,396 L 450,396 L 450,382 L 480,382 L 480,396 L 495,396 L 495,382 L 520,382 L 520,396 L 550,396 L 550,382 L 580,382 L 580,396 L 595,396 L 595,382 L 625,382 L 625,396 L 640,396 L 640,382 L 670,382 L 670,396 L 685,396 L 685,382 L 715,382 L 715,396 L 730,396 L 730,382 L 760,382 L 760,396 L 775,396 L 775,382 L 805,382 L 805,396 L 820,396 L 820,382 L 850,382 L 850,396 L 910,396" fill="none" stroke="#2457d6" stroke-width="1.8"/>
  <text x="372" y="378" text-anchor="middle" font-size="11" fill="#2457d6">Активні рядки каду (HREF High)</text>

  <!-- Signal 3: SRAM Ping-Pong Buffer Fills -->
  <rect x="225" y="418" width="65" height="20" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="2"/>
  <text x="257" y="432" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Buf A</text>

  <rect x="295" y="418" width="65" height="20" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="2"/>
  <text x="327" y="432" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Buf B</text>

  <rect x="365" y="418" width="65" height="20" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="2"/>
  <text x="397" y="432" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Buf A</text>

  <rect x="435" y="418" width="65" height="20" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="2"/>
  <text x="467" y="432" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Buf B</text>

  <rect x="550" y="418" width="65" height="20" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="2"/>
  <text x="582" y="432" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Buf A</text>

  <rect x="620" y="418" width="65" height="20" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="2"/>
  <text x="652" y="432" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Buf B</text>

  <rect x="690" y="418" width="65" height="20" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="2"/>
  <text x="722" y="432" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Buf A</text>

  <rect x="760" y="418" width="65" height="20" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="2"/>
  <text x="792" y="432" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Buf B</text>

  <!-- Signal 4: PSRAM Write Stream -->
  <rect x="225" y="458" width="295" height="22" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="372" y="473" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Запис кадру N у PSRAM FB0</text>

  <rect x="550" y="458" width="350" height="22" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="725" y="473" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Запис кадру N+1 у PSRAM FB1</text>

  <!-- Signal 5: CPU Stream Reading -->
  <rect x="225" y="498" width="295" height="22" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="372" y="513" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Зчитування/Стрим кадру N-1 з FB1</text>

  <rect x="550" y="498" width="350" height="22" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="725" y="513" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Зчитування/Стрим кадру N з FB0</text>
</svg>
