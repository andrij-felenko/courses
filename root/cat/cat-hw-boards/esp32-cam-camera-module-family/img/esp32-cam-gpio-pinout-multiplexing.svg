<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Маркери стрілок -->
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Карта розподілу виводів GPIO ESP32-CAM</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">Усі GPIO розподілені між DVP, MicroSD та PSRAM: вільні виводи доступні лише з обмеженнями</text>

  <!-- КОЛОНКА 1: DVP Camera Bus -->
  <rect x="20" y="88" width="285" height="280" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="32" y="98" width="261" height="26" rx="4" fill="#2457d6"/>
  <text x="162" y="115" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Шина камери DVP (15 GPIO)</text>

  <rect x="32" y="132" width="261" height="66" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="42" y="148" font-size="12" font-weight="bold" fill="#2457d6">Дані D0–D7 (8 lines):</text>
  <text x="42" y="165" font-size="11" fill="#1a1a1a">D0..D3: GPIO 5, 18, 19, 21</text>
  <text x="42" y="181" font-size="11" fill="#c0392b">D4..D7: GPIO 36, 39, 34, 35 (Input Only)</text>

  <rect x="32" y="206" width="261" height="66" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="42" y="222" font-size="12" font-weight="bold" fill="#2457d6">Синхронізація (4 lines):</text>
  <text x="42" y="239" font-size="11" fill="#1a1a1a">XCLK: GPIO 0  |  PCLK: GPIO 22</text>
  <text x="42" y="255" font-size="11" fill="#1a1a1a">VSYNC: GPIO 25 | HREF: GPIO 23</text>

  <rect x="32" y="280" width="261" height="74" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="42" y="296" font-size="12" font-weight="bold" fill="#2457d6">SCCB та Живлення (3 lines):</text>
  <text x="42" y="313" font-size="11" fill="#1a1a1a">SIOD (SDA): GPIO 26 | SIOC (SCL): GPIO 27</text>
  <text x="42" y="329" font-size="11" fill="#1a1a1a">PWDN (Power Down): GPIO 32</text>
  <text x="42" y="345" font-size="10" fill="#6b7280">• Повністю зайнятий відеопотоком</text>

  <!-- КОЛОНКА 2: MicroSD, Flash LED & PSRAM -->
  <rect x="325" y="88" width="310" height="280" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="337" y="98" width="286" height="26" rx="4" fill="#c0392b"/>
  <text x="480" y="115" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">MicroSD, LED спалах та PSRAM</text>

  <rect x="337" y="132" width="286" height="82" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="347" y="148" font-size="12" font-weight="bold" fill="#c0392b">Інтерфейс SDMMC (6 GPIO):</text>
  <text x="347" y="165" font-size="11" fill="#1a1a1a">CLK: GPIO 14  |  CMD: GPIO 15</text>
  <text x="347" y="181" font-size="11" fill="#1a1a1a">D0: GPIO 2  |  D2: GPIO 12  |  D3: GPIO 13</text>
  <text x="347" y="197" font-size="11" font-weight="bold" fill="#c0392b">D1: GPIO 4 ⚡ (Спільний з Flash LED!)</text>

  <rect x="337" y="222" width="286" height="58" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="347" y="238" font-size="12" font-weight="bold" fill="#c0392b">Світлодіоди модуля (2 GPIO):</text>
  <text x="347" y="254" font-size="11" fill="#1a1a1a">GPIO 4 — Яскравий спалах (N-MOSFET)</text>
  <text x="347" y="269" font-size="11" fill="#1a1a1a">GPIO 33 — Індикаторний LED на звороті</text>

  <rect x="337" y="288" width="286" height="66" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="347" y="304" font-size="12" font-weight="bold" fill="#6b7280">Внутрішня пам'ять (7 GPIO):</text>
  <text x="347" y="320" font-size="11" fill="#6b7280">GPIO 6..11 — SPI Flash (Заблоковані)</text>
  <text x="347" y="336" font-size="11" fill="#c0392b">GPIO 16 — PSRAM CS (Зайнятий пам'яттю)</text>

  <!-- КОЛОНКА 3: Header Pinout -->
  <rect x="655" y="88" width="285" height="280" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="667" y="98" width="261" height="26" rx="4" fill="#27ae60"/>
  <text x="797" y="115" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Зовнішні виводи (Header 16-pin)</text>

  <rect x="667" y="132" width="261" height="222" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="797" y="147" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Карта 16 виводів зовнішньої гребінки:</text>

  <!-- Row 1 -->
  <rect x="675" y="158" width="120" height="19" rx="3" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="680" y="171" font-size="11" font-weight="bold" fill="#1a1a1a">5V / GND</text>
  <text x="790" y="171" font-size="10" fill="#6b7280" text-anchor="end">Живлення</text>

  <rect x="800" y="158" width="120" height="19" rx="3" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="805" y="171" font-size="11" font-weight="bold" fill="#1a1a1a">3.3V</text>
  <text x="915" y="171" font-size="10" fill="#6b7280" text-anchor="end">VCC</text>

  <!-- Row 2 -->
  <rect x="675" y="181" width="120" height="19" rx="3" fill="#fdecea" stroke="#c0392b"/>
  <text x="680" y="194" font-size="11" font-weight="bold" fill="#c0392b">GPIO 12</text>
  <text x="790" y="194" font-size="10" fill="#6b7280" text-anchor="end">SD_D2</text>

  <rect x="800" y="181" width="120" height="19" rx="3" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="805" y="194" font-size="11" font-weight="bold" fill="#2457d6">GPIO 0</text>
  <text x="915" y="194" font-size="10" fill="#2457d6" text-anchor="end">CAM_XCLK</text>

  <!-- Row 3 -->
  <rect x="675" y="204" width="120" height="19" rx="3" fill="#fdecea" stroke="#c0392b"/>
  <text x="680" y="217" font-size="11" font-weight="bold" fill="#c0392b">GPIO 13</text>
  <text x="790" y="217" font-size="10" fill="#6b7280" text-anchor="end">SD_D3</text>

  <rect x="800" y="204" width="120" height="19" rx="3" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="805" y="217" font-size="11" font-weight="bold" fill="#27ae60">GPIO 1</text>
  <text x="915" y="217" font-size="10" fill="#27ae60" text-anchor="end">U0TXD</text>

  <!-- Row 4 -->
  <rect x="675" y="227" width="120" height="19" rx="3" fill="#fdecea" stroke="#c0392b"/>
  <text x="680" y="240" font-size="11" font-weight="bold" fill="#c0392b">GPIO 15</text>
  <text x="790" y="240" font-size="10" fill="#6b7280" text-anchor="end">SD_CMD</text>

  <rect x="800" y="227" width="120" height="19" rx="3" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="805" y="240" font-size="11" font-weight="bold" fill="#27ae60">GPIO 3</text>
  <text x="915" y="240" font-size="10" fill="#27ae60" text-anchor="end">U0RXD</text>

  <!-- Row 5 -->
  <rect x="675" y="250" width="120" height="19" rx="3" fill="#fdecea" stroke="#c0392b"/>
  <text x="680" y="263" font-size="11" font-weight="bold" fill="#c0392b">GPIO 14</text>
  <text x="790" y="263" font-size="10" fill="#6b7280" text-anchor="end">SD_CLK</text>

  <rect x="800" y="250" width="120" height="19" rx="3" fill="#f4f6f8" stroke="#6b7280"/>
  <text x="805" y="263" font-size="11" font-weight="bold" fill="#6b7280">GPIO 16</text>
  <text x="915" y="263" font-size="10" fill="#c0392b" text-anchor="end">PSRAM ⛔</text>

  <!-- Row 6 -->
  <rect x="675" y="273" width="120" height="19" rx="3" fill="#fdecea" stroke="#c0392b"/>
  <text x="680" y="286" font-size="11" font-weight="bold" fill="#c0392b">GPIO 2</text>
  <text x="790" y="286" font-size="10" fill="#6b7280" text-anchor="end">SD_D0</text>

  <rect x="800" y="273" width="120" height="19" rx="3" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="805" y="286" font-size="11" font-weight="bold" fill="#1a1a1a">RST</text>
  <text x="915" y="286" font-size="10" fill="#6b7280" text-anchor="end">Reset</text>

  <!-- Row 7 -->
  <rect x="675" y="296" width="120" height="19" rx="3" fill="#fdecea" stroke="#c0392b"/>
  <text x="680" y="309" font-size="11" font-weight="bold" fill="#c0392b">GPIO 4</text>
  <text x="790" y="309" font-size="10" fill="#c0392b" text-anchor="end">Flash/D1</text>

  <rect x="800" y="296" width="120" height="19" rx="3" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="805" y="309" font-size="11" font-weight="bold" fill="#1a1a1a">VCC</text>
  <text x="915" y="309" font-size="10" fill="#6b7280" text-anchor="end">5V In</text>

  <!-- Row 8 -->
  <rect x="675" y="319" width="120" height="19" rx="3" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="680" y="332" font-size="11" font-weight="bold" fill="#1a1a1a">GND</text>
  <text x="790" y="332" font-size="10" fill="#6b7280" text-anchor="end">Земля</text>

  <rect x="800" y="319" width="120" height="19" rx="3" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="805" y="332" font-size="11" font-weight="bold" fill="#1a1a1a">GND</text>
  <text x="915" y="332" font-size="10" fill="#6b7280" text-anchor="end">Земля</text>

  <!-- НИЖНЯ ПАНЕЛЬ: Аналіз доступності GPIO -->
  <rect x="20" y="382" width="920" height="156" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="403" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Правила використання та доступність GPIO для розширення периферії</text>

  <!-- Картка 1 -->
  <rect x="32" y="416" width="212" height="108" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="138" y="433" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Вільні без обмежень</text>
  <text x="40" y="451" font-size="11" font-weight="bold" fill="#1a1a1a">GPIO 1 (TX) &amp; GPIO 3 (RX)</text>
  <text x="40" y="468" font-size="11" fill="#1a1a1a">• Використовуються для UART0</text>
  <text x="40" y="485" font-size="11" fill="#1a1a1a">• Вільні після прошивки, якщо</text>
  <text x="40" y="502" font-size="11" fill="#27ae60">• вимкнути логування в коді</text>

  <!-- Картка 2 -->
  <rect x="258" y="416" width="212" height="108" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="364" y="433" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вільні без MicroSD</text>
  <text x="266" y="451" font-size="11" font-weight="bold" fill="#1a1a1a">GPIO 12, 13, 14, 15, 2, 4</text>
  <text x="266" y="468" font-size="11" fill="#1a1a1a">• Звільняються без SD-карти</text>
  <text x="266" y="485" font-size="11" fill="#1a1a1a">• Підходять для I2C / SPI / GPIO</text>
  <text x="266" y="502" font-size="11" fill="#2457d6">• У 1-bit SD вільні GPIO 12, 13</text>

  <!-- Картка 3 -->
  <rect x="484" y="416" width="212" height="108" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="590" y="433" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Strapping-застереження</text>
  <text x="492" y="451" font-size="11" font-weight="bold" fill="#c0392b">GPIO 0, 2, 12, 15</text>
  <text x="492" y="468" font-size="11" fill="#1a1a1a">• GPIO 0: LOW для завантаження</text>
  <text x="492" y="485" font-size="11" fill="#1a1a1a">• GPIO 2: LOW при старті ядра</text>
  <text x="492" y="502" font-size="11" fill="#c0392b">• GPIO 12: Задає напругу Flash</text>

  <!-- Картка 4 -->
  <rect x="710" y="416" width="212" height="108" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1"/>
  <text x="816" y="433" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Заблоковані виводи</text>
  <text x="718" y="451" font-size="11" font-weight="bold" fill="#6b7280">GPIO 6..11, 16 &amp; DVP pins</text>
  <text x="718" y="468" font-size="11" fill="#1a1a1a">• GPIO 6..11: Шина SPI Flash</text>
  <text x="718" y="485" font-size="11" fill="#1a1a1a">• GPIO 16: Використаний PSRAM</text>
  <text x="718" y="502" font-size="11" fill="#6b7280">• DVP pins: Не чіпати при камері</text>
</svg>
