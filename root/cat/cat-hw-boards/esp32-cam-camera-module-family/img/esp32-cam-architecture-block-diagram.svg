<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Архітектура сигнального тракту модуля AI-Thinker ESP32-CAM</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Пряме захоплення відео з сенсора OV2640 через DVP й контролер DMA у PSRAM без зовнішнього FIFO-буфера</text>

  <!-- Marker Definitions -->
  <defs>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Left Box: OV2640 Camera Module -->
  <rect x="30" y="75" width="225" height="340" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="142" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Сенсор OV2640 (2 МП)</text>

  <!-- JPEG Engine inside Camera -->
  <rect x="40" y="115" width="205" height="55" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="142" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Вбудований JPEG-кодер</text>
  <text x="142" y="154" text-anchor="middle" font-size="12" fill="#6b7280">Стиснення кадрів на льоту</text>

  <!-- DVP Bus Interface -->
  <rect x="40" y="180" width="205" height="225" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="142" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Паралельний інтерфейс DVP</text>
  <text x="142" y="222" text-anchor="middle" font-size="12" fill="#1a1a1a">Дані: Y2..Y9 (8-біт)</text>
  <text x="142" y="242" text-anchor="middle" font-size="12" fill="#1a1a1a">Тактування: PCLK, VSYNC, HREF</text>
  <text x="142" y="262" text-anchor="middle" font-size="12" fill="#1a1a1a">Вхід тактування: XCLK (LEDC)</text>
  <text x="142" y="282" text-anchor="middle" font-size="12" fill="#6b7280">Керування: SCCB (SIOC/SIOD)</text>
  <text x="142" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Прямий вихід на шину ESP32</text>
  <text x="142" y="330" text-anchor="middle" font-size="12" fill="#6b7280">Без мікросхеми AL422B FIFO</text>
  <text x="142" y="350" text-anchor="middle" font-size="12" fill="#6b7280">Низька собівартість модуля</text>
  <text x="142" y="378" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Передача через DMA</text>

  <!-- Middle Box: ESP32 SoC -->
  <rect x="315" y="75" width="320" height="340" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="475" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Чип ESP32 (Двоядерний SoC)</text>

  <!-- Direct DMA Pipeline Callout -->
  <rect x="325" y="115" width="300" height="75" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="475" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Пряме захоплення через DMA</text>
  <text x="475" y="154" text-anchor="middle" font-size="12" fill="#1a1a1a">Інтерфейс I2S/DVP → DMA → PSRAM</text>
  <text x="475" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Без проміжної AL422B FIFO</text>

  <!-- ESP32 Internal Modules Sub-box -->
  <rect x="325" y="200" width="300" height="205" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="475" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Внутрішні модулі ESP32</text>

  <!-- CPU Cores -->
  <rect x="335" y="228" width="135" height="50" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="402" y="247" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">2× Xtensa LX6</text>
  <text x="402" y="265" text-anchor="middle" font-size="12" fill="#6b7280">240 МГц CPU</text>

  <!-- Internal SRAM -->
  <rect x="480" y="228" width="135" height="50" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="548" y="247" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Внутрішня SRAM</text>
  <text x="548" y="265" text-anchor="middle" font-size="12" fill="#6b7280">512 КБ (DRAM)</text>

  <!-- PSRAM/Flash SPI Controller -->
  <rect x="335" y="288" width="280" height="46" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="475" y="306" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Контролер шини PSRAM / Flash (SPI/QSPI)</text>
  <text x="475" y="324" text-anchor="middle" font-size="12" fill="#6b7280">Пряма адресація через кеш та MMU</text>

  <!-- No FIFO Optimization Warning -->
  <rect x="335" y="342" width="280" height="50" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="475" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Застосовано прямий обмін DMA</text>
  <text x="475" y="378" text-anchor="middle" font-size="12" fill="#c0392b">Без додаткового буфера FIFO</text>

  <!-- Right Box: External Memory -->
  <rect x="695" y="75" width="235" height="340" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="813" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Зовнішня пам'ять</text>

  <!-- External PSRAM -->
  <rect x="707" y="115" width="211" height="125" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="813" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Зовнішня PSRAM (4 МБ)</text>
  <text x="813" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Головний Frame Buffer</text>
  <text x="813" y="174" text-anchor="middle" font-size="12" fill="#1a1a1a">Буферизація кадрів UXGA/SVGA</text>
  <text x="813" y="193" text-anchor="middle" font-size="12" fill="#1a1a1a">Подвійна буферизація</text>
  <text x="813" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Запис DMA від камери</text>

  <!-- SPI Flash -->
  <rect x="707" y="250" width="211" height="75" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="813" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">SPI Flash (4 МБ)</text>
  <text x="813" y="289" text-anchor="middle" font-size="12" fill="#6b7280">Прошивка, Bootloader</text>
  <text x="813" y="308" text-anchor="middle" font-size="12" fill="#6b7280">Файлова система Web</text>

  <!-- MicroSD Card Slot -->
  <rect x="707" y="335" width="211" height="65" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="813" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="#d97706">Слот MicroSD (SDMMC)</text>
  <text x="813" y="375" text-anchor="middle" font-size="12" fill="#1a1a1a">Збереження фото (GPIO Shared)</text>

  <!-- Connection Arrows & Stream Labels -->
  <!-- DVP to DMA arrow -->
  <path d="M 255 210 H 285 V 152 H 317" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="285" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Потік DVP</text>

  <!-- DMA to PSRAM arrow -->
  <path d="M 625 152 L 699 152" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="665" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Канал DMA</text>

  <!-- Bottom Legend Panel -->
  <rect x="30" y="430" width="900" height="55" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="463" font-size="12" font-weight="bold" fill="#1a1a1a">Позначення:</text>

  <rect x="140" y="449" width="16" height="16" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="164" y="463" font-size="12" fill="#1a1a1a">Прямий канал DMA → PSRAM (без затримок)</text>

  <rect x="450" y="449" width="16" height="16" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="474" y="463" font-size="12" fill="#1a1a1a">Відсутність FIFO (Оптимізація вартості)</text>

  <rect x="740" y="449" width="16" height="16" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="764" y="463" font-size="12" fill="#1a1a1a">Спільні GPIO (SDMMC / Camera)</text>
</svg>
