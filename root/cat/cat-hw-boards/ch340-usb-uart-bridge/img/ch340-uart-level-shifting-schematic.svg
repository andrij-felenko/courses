<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Схема узгодження рівнів сигналів CH340 (5 В) та МК (3.3 В)</text>
  <text x="480" y="52" font-size="13" text-anchor="middle" fill="#6b7280">Дільник напруги на лінії TXD, пряме підключення RXD та транзисторне узгодження DTR/RTS</text>

  <!-- Left Box: CH340 -->
  <rect x="30" y="75" width="200" height="445" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="130" y="105" font-size="16" font-weight="bold" text-anchor="middle" fill="#2457d6">CH340 (VCC = 5 В)</text>
  <text x="130" y="125" font-size="12" text-anchor="middle" fill="#6b7280">USB-UART міст</text>

  <!-- CH340 Pins -->
  <rect x="140" y="150" width="90" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="185" y="170" font-size="13" font-weight="bold" text-anchor="middle" fill="#2457d6">TXD (5V)</text>

  <rect x="140" y="270" width="90" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="185" y="290" font-size="13" font-weight="bold" text-anchor="middle" fill="#2457d6">RXD (In)</text>

  <rect x="140" y="385" width="90" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="185" y="405" font-size="13" font-weight="bold" text-anchor="middle" fill="#2457d6">RTS (5V)</text>

  <rect x="140" y="435" width="90" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="185" y="465" font-size="13" font-weight="bold" text-anchor="middle" fill="#2457d6">DTR (5V)</text>

  <!-- Right Box: MCU -->
  <rect x="730" y="75" width="200" height="445" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="830" y="105" font-size="16" font-weight="bold" text-anchor="middle" fill="#27ae60">Мікроконтролер</text>
  <text x="830" y="125" font-size="12" text-anchor="middle" fill="#6b7280">Логіка 3.3 В (ESP32/STM32)</text>

  <!-- MCU Pins -->
  <rect x="730" y="150" width="90" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="775" y="170" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">RXD (3.3V)</text>

  <rect x="730" y="270" width="90" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="775" y="290" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">TXD (3.3V)</text>

  <rect x="730" y="385" width="90" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="775" y="405" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">EN / RESET</text>

  <rect x="730" y="435" width="90" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="775" y="455" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">IO0 / BOOT</text>

  <!-- SECTION 1: TXD Voltage Divider -->
  <!-- Wire from CH340 TXD to R1 -->
  <line x1="230" y1="165" x2="305" y2="165" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Resistor R1 -->
  <rect x="310" y="155" width="60" height="20" fill="white" stroke="#2457d6" stroke-width="2" rx="2"/>
  <text x="340" y="146" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">R1 = 1 кОм</text>

  <!-- Wire from R1 to Node -->
  <line x1="370" y1="165" x2="430" y2="165" stroke="#2457d6" stroke-width="2"/>
  <circle cx="430" cy="165" r="4" fill="#2457d6"/>

  <!-- Wire from Node to MCU RXD -->
  <line x1="430" y1="165" x2="725" y2="165" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="575" y="152" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">V_out = 3.33 В (Безпечний рівень)</text>

  <!-- Vertical wire from Node to R2 -->
  <line x1="430" y1="165" x2="430" y2="188" stroke="#2457d6" stroke-width="2"/>

  <!-- Resistor R2 -->
  <rect x="420" y="190" width="20" height="40" fill="white" stroke="#2457d6" stroke-width="2" rx="2"/>
  <text x="448" y="214" font-size="12" font-weight="bold" text-anchor="start" fill="#2457d6">R2 = 2 кОм</text>

  <!-- Wire from R2 to GND -->
  <line x1="430" y1="230" x2="430" y2="242" stroke="#2457d6" stroke-width="2"/>
  <!-- GND Symbol -->
  <line x1="418" y1="242" x2="442" y2="242" stroke="#2457d6" stroke-width="2"/>
  <line x1="422" y1="246" x2="438" y2="246" stroke="#2457d6" stroke-width="2"/>
  <line x1="426" y1="250" x2="434" y2="250" stroke="#2457d6" stroke-width="2"/>

  <!-- Calculation Box -->
  <rect x="500" y="178" width="210" height="72" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="510" y="197" font-size="12" font-weight="bold" fill="#2457d6">Розрахунок дільника:</text>
  <text x="510" y="215" font-size="12" fill="#1a1a1a">V_out = 5V × R2 / (R1 + R2)</text>
  <text x="510" y="233" font-size="12" font-weight="bold" fill="#2457d6">= 5V × 2k / (1k + 2k) = 3.33 В</text>

  <!-- SECTION 2: MCU TXD -> CH340 RXD Direct Line -->
  <line x1="730" y1="285" x2="235" y2="285" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Direct Line Explanation Box -->
  <rect x="250" y="305" width="460" height="46" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="480" y="323" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Пряме підключення MCU TXD (3.3V) → CH340 RXD:</text>
  <text x="480" y="341" font-size="12" text-anchor="middle" fill="#1a1a1a">V_OH(MCU) = 3.3 В перевищує поріг V_IH(CH340) = 2.0 В — рівень 1 фіксується надійно</text>

  <!-- SECTION 3: Auto-Reset Transistor Circuit -->
  <rect x="250" y="365" width="460" height="145" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="383" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Схема автоматичного скидання (DTR / RTS) на NPN-транзисторах</text>

  <!-- Transistor RTS Wire -->
  <line x1="230" y1="400" x2="300" y2="400" stroke="#2457d6" stroke-width="2"/>
  <rect x="300" y="393" width="40" height="14" fill="white" stroke="#2457d6" stroke-width="1" rx="2"/>
  <text x="320" y="404" font-size="12" text-anchor="middle" fill="#2457d6">10k</text>
  <line x1="340" y1="400" x2="370" y2="400" stroke="#2457d6" stroke-width="2"/>

  <!-- Transistor Q1 Box/Symbol -->
  <circle cx="385" cy="400" r="12" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="385" y="404" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">Q1</text>
  <line x1="397" y1="400" x2="725" y2="400" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Transistor DTR Wire -->
  <line x1="230" y1="450" x2="300" y2="450" stroke="#2457d6" stroke-width="2"/>
  <rect x="300" y="443" width="40" height="14" fill="white" stroke="#2457d6" stroke-width="1" rx="2"/>
  <text x="320" y="454" font-size="12" text-anchor="middle" fill="#2457d6">10k</text>
  <line x1="340" y1="450" x2="370" y2="450" stroke="#2457d6" stroke-width="2"/>

  <!-- Transistor Q2 Box/Symbol -->
  <circle cx="385" cy="450" r="12" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="385" y="454" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">Q2</text>
  <line x1="397" y1="450" x2="725" y2="450" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Pull-up resistor notes near MCU side -->
  <line x1="640" y1="400" x2="640" y2="415" stroke="#27ae60" stroke-width="1.5"/>
  <text x="640" y="427" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Підтяжка +3.3V (10k)</text>

  <!-- Explanatory note at bottom of panel 3 -->
  <text x="480" y="484" font-size="12" text-anchor="middle" fill="#6b7280">Ключі NPN ізолюють 5V-сигнали CH340: виводи EN та IO0 підтягнуті до 3.3 В</text>
  <text x="480" y="500" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">Захищає 3.3V МК від 5V та забезпечує чіткий таймінг скидання в bootloader</text>
</svg>
