<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схемотехніка живлення CH340: варіанти 5 В та 3.3 В</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">При живленні 5 В вивід V3 потребує конденсатора 100 нФ; при 3.3 В виводи V3 та VCC об'єднуються</text>

  <!-- PANEL 1: 5V MODE (LEFT) -->
  <rect x="35" y="80" width="430" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="45" y="90" width="410" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="250" y="111" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Режим живлення 5 В (VCC = 5 В)</text>

  <!-- CH340 IC 1 -->
  <rect x="65" y="140" width="165" height="205" rx="6" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="147.5" y="165" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">CH340G / CH340C</text>

  <!-- Pins inside IC 1 -->
  <text x="220" y="194" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">VCC (16)</text>
  <text x="220" y="254" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">V3 (4)</text>
  <text x="220" y="314" font-size="12" fill="#6b7280" text-anchor="end">GND (9)</text>

  <!-- Internal LDO Block IC 1 -->
  <rect x="75" y="220" width="95" height="45" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="122.5" y="238" font-size="12" fill="#6b7280" text-anchor="middle">Внутрішній LDO</text>
  <text x="122.5" y="254" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">5 В → 3.3 В</text>

  <!-- 5V Rail & Connections Panel 1 -->
  <line x1="310" y1="160" x2="430" y2="160" stroke="#c0392b" stroke-width="2"/>
  <text x="370" y="152" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+5V (USB)</text>
  <line x1="230" y1="190" x2="310" y2="190" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="310" y1="160" x2="310" y2="190" stroke="#c0392b" stroke-width="1.5"/>

  <!-- C1 Decoupling (Panel 1) -->
  <line x1="320" y1="160" x2="320" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="305" y="200" width="30" height="18" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="342" y="214" font-size="12" fill="#1a1a1a" text-anchor="start">C1 100nF</text>
  <line x1="320" y1="218" x2="320" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- V3 Connection & C2 Filter (Panel 1) -->
  <line x1="230" y1="250" x2="390" y2="250" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="390" y1="250" x2="390" y2="270" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="375" y="270" width="30" height="18" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="410" y="283" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">C2 100nF</text>
  <line x1="390" y1="288" x2="390" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- GND Rail Panel 1 -->
  <line x1="230" y1="320" x2="430" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="230" y1="310" x2="230" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="260" y="336" font-size="12" fill="#6b7280" text-anchor="middle">GND</text>

  <!-- Note Box Panel 1 -->
  <rect x="50" y="355" width="400" height="60" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="250" y="376" font-size="12" fill="#1a1a1a" text-anchor="middle">• V3 — вихід регулятора LDO (3.3 В)</text>
  <text x="250" y="396" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">• C2 (100 нФ) обов'язковий для стабілізації</text>


  <!-- PANEL 2: 3.3V MODE (RIGHT) -->
  <rect x="495" y="80" width="430" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="505" y="90" width="410" height="32" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="710" y="111" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Режим живлення 3.3 В (VCC = 3.3 В)</text>

  <!-- CH340 IC 2 -->
  <rect x="525" y="140" width="165" height="205" rx="6" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="607.5" y="165" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">CH340G / CH340C</text>

  <!-- Pins inside IC 2 -->
  <text x="680" y="194" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">VCC (16)</text>
  <text x="680" y="254" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">V3 (4)</text>
  <text x="680" y="314" font-size="12" fill="#6b7280" text-anchor="end">GND (9)</text>

  <!-- Internal LDO Status IC 2 -->
  <rect x="535" y="220" width="95" height="45" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="582.5" y="238" font-size="12" fill="#6b7280" text-anchor="middle">LDO вимкнений</text>
  <text x="582.5" y="254" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Обхід (Bypass)</text>

  <!-- 3.3V Rail & Connections Panel 2 -->
  <line x1="770" y1="160" x2="890" y2="160" stroke="#27ae60" stroke-width="2"/>
  <text x="830" y="152" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">+3.3V Rail</text>
  <line x1="690" y1="190" x2="730" y2="190" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="730" y1="160" x2="730" y2="190" stroke="#27ae60" stroke-width="1.5"/>

  <!-- V3 Tied directly to VCC (Panel 2) -->
  <line x1="690" y1="250" x2="730" y2="250" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="730" y1="190" x2="730" y2="250" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="730" cy="190" r="4" fill="#27ae60"/>
  <text x="742" y="225" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">V3 + VCC об'єднано!</text>

  <!-- C1 Decoupling (Panel 2) -->
  <line x1="830" y1="160" x2="830" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="815" y="200" width="30" height="18" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="852" y="214" font-size="12" fill="#1a1a1a" text-anchor="start">C1 100nF</text>
  <line x1="830" y1="218" x2="830" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- GND Rail Panel 2 -->
  <line x1="690" y1="320" x2="890" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="690" y1="310" x2="690" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="720" y="336" font-size="12" fill="#6b7280" text-anchor="middle">GND</text>

  <!-- Note Box Panel 2 -->
  <rect x="510" y="355" width="400" height="60" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="710" y="376" font-size="12" fill="#1a1a1a" text-anchor="middle">• V3 з'єднується напряму з VCC (3.3 В)</text>
  <text x="710" y="396" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">• Живить трансивер USB безпосередньо з шини</text>
</svg>
