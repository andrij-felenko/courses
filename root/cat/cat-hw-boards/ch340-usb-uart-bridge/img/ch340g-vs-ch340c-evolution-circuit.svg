<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Еволюція обв'язки USB-UART мостів: CH340G проти CH340C</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Відмова від зовнішнього кварцового резонатора 12 МГц та конденсаторів завдяки вбудованому RC-генератору</text>

  <!-- ==================== LEFT PANEL: CH340G (LEGACY) ==================== -->
  <rect x="30" y="75" width="435" height="445" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  
  <rect x="45" y="90" width="405" height="32" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="247.5" y="111" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">CH340G (Потрібен зовнішній кварц 12 МГц)</text>

  <!-- IC CH340G Box -->
  <rect x="230" y="145" width="200" height="210" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="330" y="170" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">CH340G (IC)</text>
  <text x="330" y="188" font-size="12" fill="#6b7280" text-anchor="middle">SOP-16 (Кварцева ревізія)</text>

  <!-- Pins XI (7) & XO (8) -->
  <circle cx="230" cy="225" r="3.5" fill="#c0392b"/>
  <text x="240" y="220" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">XI (pin 7)</text>

  <circle cx="230" cy="285" r="3.5" fill="#c0392b"/>
  <text x="240" y="280" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">XO (pin 8)</text>

  <!-- Quartz Resonator Y1 (12 MHz) Circuit -->
  <line x1="230" y1="225" x2="135" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="135" y1="225" x2="135" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>

  <line x1="230" y1="285" x2="135" y2="285" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="135" y1="285" x2="135" y2="270" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Quartz Symbol -->
  <line x1="120" y1="240" x2="150" y2="240" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="125" y="244" width="20" height="22" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="120" y1="270" x2="150" y2="270" stroke="#1a1a1a" stroke-width="2"/>
  <text x="110" y="258" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">Y1 (12 МГц)</text>

  <!-- Load Capacitors C1 & C2 -->
  <!-- C1 on XI -->
  <line x1="175" y1="225" x2="175" y2="300" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="175" cy="225" r="3" fill="#1a1a1a"/>
  <line x1="165" y1="300" x2="185" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="165" y1="310" x2="185" y2="310" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="175" y1="310" x2="175" y2="330" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="160" y="308" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="end">C1 (22 pF)</text>

  <!-- C2 on XO -->
  <line x1="135" y1="285" x2="135" y2="300" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="135" cy="285" r="3" fill="#1a1a1a"/>
  <line x1="125" y1="300" x2="145" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="125" y1="310" x2="145" y2="310" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="135" y1="310" x2="135" y2="330" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="120" y="308" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="end">C2 (22 pF)</text>

  <!-- Ground Connection for Caps -->
  <line x1="135" y1="330" x2="175" y2="330" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="155" y1="330" x2="155" y2="338" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="147" y1="338" x2="163" y2="338" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="150" y1="342" x2="160" y2="342" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="153" y1="346" x2="157" y2="346" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="155" y="360" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">GND</text>

  <!-- Left Panel Callout Box -->
  <rect x="45" y="375" width="405" height="130" rx="6" fill="#fdecea" stroke="#c0392b" stroke-dasharray="4 4"/>
  <text x="247.5" y="396" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Недоліки зовнішнього тактування (CH340G):</text>
  <text x="60" y="418" font-size="12" fill="#1a1a1a" text-anchor="start">• Вимагає зовнішній кварцовий резонатор 12 МГц (Y1)</text>
  <text x="60" y="440" font-size="12" fill="#1a1a1a" text-anchor="start">• Потрібні 2 керамічні конденсатори обв'язки (C1, C2)</text>
  <text x="60" y="462" font-size="12" fill="#1a1a1a" text-anchor="start">• Збільшує площу плати та вартість монтажу (BOM)</text>
  <text x="60" y="488" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">✖ Ризик зриву генерації при механічних вібраціях</text>

  <!-- ==================== RIGHT PANEL: CH340C (INTEGRATED) ==================== -->
  <rect x="495" y="75" width="435" height="445" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  
  <rect x="510" y="90" width="405" height="32" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="712.5" y="111" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">CH340C (Вбудований RC-генератор)</text>

  <!-- IC CH340C Box -->
  <rect x="695" y="145" width="200" height="210" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
  <text x="795" y="170" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">CH340C (IC)</text>
  <text x="795" y="188" font-size="12" fill="#6b7280" text-anchor="middle">SOP-16 (Pin-to-Pin сумісна)</text>

  <!-- Internal RC Generator Box Inside IC -->
  <rect x="710" y="205" width="170" height="135" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="795" y="228" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Внутрішній RC-генератор</text>
  <text x="795" y="248" font-size="12" fill="#1a1a1a" text-anchor="middle">• Частота: 12 МГц</text>
  <text x="795" y="268" font-size="12" fill="#1a1a1a" text-anchor="middle">• Точність: ±0.25%</text>
  <text x="795" y="288" font-size="12" fill="#1a1a1a" text-anchor="middle">• Без зовнішніх деталей</text>
  <text x="795" y="316" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">✔ Зовнішня обв'язка 0%</text>

  <!-- Pins XI & XO NC -->
  <circle cx="695" cy="225" r="3.5" fill="#27ae60"/>
  <text x="685" y="220" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="end">XI (pin 7)</text>
  <line x1="695" y1="225" x2="615" y2="225" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3 3"/>

  <circle cx="695" cy="285" r="3.5" fill="#27ae60"/>
  <text x="685" y="280" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="end">XO (pin 8)</text>
  <line x1="695" y1="285" x2="615" y2="285" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- NC Badge Left of IC -->
  <rect x="515" y="240" width="100" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="565" y="259" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">NC (Вільні)</text>

  <!-- Right Panel Callout Box -->
  <rect x="510" y="375" width="405" height="130" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-dasharray="4 4"/>
  <text x="712.5" y="396" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Переваги вбудованого осцилятора (CH340C):</text>
  <text x="525" y="418" font-size="12" fill="#1a1a1a" text-anchor="start">• Повна відмова від зовнішнього кварцового резонатора</text>
  <text x="525" y="440" font-size="12" fill="#1a1a1a" text-anchor="start">• Економія 3 компонентів на платі (1 кварц + 2 конденсатори)</text>
  <text x="525" y="462" font-size="12" fill="#1a1a1a" text-anchor="start">• Пряма заміна CH340G (Pin-to-Pin) без зміни топології</text>
  <text x="525" y="488" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">✔ Максимальне здешевлення та мінімізація площі плат</text>
</svg>
