<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-blue-start" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-gray-start" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принцип роботи USB-UART моста CH340</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">CH340 перетворює диференціальні пакети USB на кадри послідовного інтерфейсу UART</text>

  <!-- Панель 1: Комп'ютер (USB Host) -->
  <rect x="40" y="80" width="240" height="340" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="160" y="105" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Комп'ютер (USB Host)</text>
  <text x="160" y="125" font-size="12" fill="#6b7280" text-anchor="middle">Інтерфейс USB 2.0</text>

  <!-- Внутрішня зона USB сигналів -->
  <rect x="55" y="140" width="210" height="265" fill="white" stroke="#d0d7de" rx="6"/>
  <text x="160" y="162" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Диференціальний сигнал</text>

  <text x="65" y="200" font-size="12" font-weight="bold" fill="#2457d6">D+</text>
  <path d="M 95,200 L 115,200 L 115,185 L 145,185 L 145,200 L 175,200 L 175,185 L 205,185 L 205,200 L 245,200" fill="none" stroke="#2457d6" stroke-width="2"/>

  <text x="65" y="240" font-size="12" font-weight="bold" fill="#6b7280">D-</text>
  <path d="M 95,225 L 115,225 L 115,240 L 145,240 L 145,225 L 175,225 L 175,240 L 205,240 L 205,225 L 245,225" fill="none" stroke="#6b7280" stroke-width="2"/>

  <!-- Блок опису пакета USB -->
  <rect x="65" y="265" width="190" height="125" fill="#eaf0fd" stroke="#2457d6" rx="6"/>
  <text x="160" y="287" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Пакети даних USB</text>
  <text x="160" y="310" font-size="12" fill="#1a1a1a" text-anchor="middle">• Кадри високої швидкості</text>
  <text x="160" y="332" font-size="12" fill="#1a1a1a" text-anchor="middle">• Напруга шини: 5 В (VBUS)</text>
  <text x="160" y="354" font-size="12" fill="#1a1a1a" text-anchor="middle">• Сигнали: D+ / D- (3.3 В)</text>
  <text x="160" y="376" font-size="12" fill="#6b7280" text-anchor="middle">Потрібен драйвер CH340</text>


  <!-- Зв'язки між ПК та CH340 -->
  <line x1="280" y1="150" x2="360" y2="150" stroke="#2457d6" stroke-width="2" marker-start="url(#arr-blue-start)" marker-end="url(#arr-blue)"/>
  <text x="320" y="142" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">D+</text>

  <line x1="280" y1="178" x2="360" y2="178" stroke="#6b7280" stroke-width="2" marker-start="url(#arr-gray-start)" marker-end="url(#arr-gray)"/>
  <text x="320" y="170" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">D-</text>

  <line x1="280" y1="345" x2="360" y2="345" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arr-red)"/>
  <text x="320" y="337" font-size="12" fill="#c0392b" text-anchor="middle">VBUS (5V)</text>

  <line x1="280" y1="385" x2="360" y2="385" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="320" y="377" font-size="12" fill="#1a1a1a" text-anchor="middle">GND</text>


  <!-- Панель 2: Мікросхема CH340 -->
  <rect x="360" y="80" width="240" height="340" fill="#f4f6f8" stroke="#2457d6" stroke-width="2" rx="8"/>
  <text x="480" y="105" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">Мікросхема CH340</text>
  <text x="480" y="123" font-size="12" fill="#6b7280" text-anchor="middle">Апаратний мостовий чип</text>

  <!-- Внутрішні вузли CH340 -->
  <rect x="375" y="138" width="210" height="72" fill="white" stroke="#2457d6" stroke-width="1" rx="6"/>
  <text x="480" y="160" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">USB Controller &amp; PHY</text>
  <text x="480" y="180" font-size="12" fill="#6b7280" text-anchor="middle">Прийом/передача D+ / D-</text>
  <text x="480" y="197" font-size="12" fill="#2457d6" text-anchor="middle">Вбудований осцилятор</text>

  <line x1="480" y1="210" x2="480" y2="226" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="375" y="228" width="210" height="72" fill="white" stroke="#2457d6" stroke-width="1" rx="6"/>
  <text x="480" y="250" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Конвертер та Буфер</text>
  <text x="480" y="270" font-size="12" fill="#6b7280" text-anchor="middle">FIFO буфери TXD / RXD</text>
  <text x="480" y="287" font-size="12" fill="#2457d6" text-anchor="middle">Перерахунок швидкостей</text>

  <line x1="480" y1="300" x2="480" y2="316" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="375" y="318" width="210" height="87" fill="white" stroke="#2457d6" stroke-width="1" rx="6"/>
  <text x="480" y="338" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">UART Engine &amp; LDO</text>
  <text x="480" y="357" font-size="12" fill="#6b7280" text-anchor="middle">Формування послідовних кадрів</text>
  <text x="480" y="375" font-size="12" fill="#2457d6" text-anchor="middle">Регулятор 3.3 В (V3)</text>
  <text x="480" y="393" font-size="12" fill="#1a1a1a" text-anchor="middle">Сигнали: TXD, RXD, DTR, RTS</text>


  <!-- Зв'язки між CH340 та MCU -->
  <line x1="600" y1="150" x2="680" y2="150" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="640" y="142" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">TXD → RXD</text>

  <line x1="680" y1="178" x2="600" y2="178" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="640" y="170" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">RXD ← TXD</text>

  <line x1="600" y1="345" x2="680" y2="345" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-blue)"/>
  <text x="640" y="337" font-size="12" fill="#2457d6" text-anchor="middle">DTR / RTS</text>

  <line x1="600" y1="385" x2="680" y2="385" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="640" y="377" font-size="12" fill="#1a1a1a" text-anchor="middle">Спільний GND</text>


  <!-- Панель 3: Мікроконтролер (MCU) -->
  <rect x="680" y="80" width="240" height="340" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="800" y="105" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мікроконтролер (MCU)</text>
  <text x="800" y="125" font-size="12" fill="#6b7280" text-anchor="middle">Периферія UART / USART</text>

  <!-- Внутрішня зона UART сигналів -->
  <rect x="695" y="140" width="210" height="265" fill="white" stroke="#d0d7de" rx="6"/>
  <text x="800" y="162" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Послідовна шина UART</text>

  <text x="705" y="200" font-size="12" font-weight="bold" fill="#27ae60">RXD</text>
  <path d="M 735,200 L 755,200 L 755,185 L 775,185 L 775,200 L 805,200 L 805,185 L 835,185 L 835,200 L 885,200" fill="none" stroke="#27ae60" stroke-width="2"/>

  <text x="705" y="240" font-size="12" font-weight="bold" fill="#c0392b">TXD</text>
  <path d="M 735,225 L 765,225 L 765,240 L 785,240 L 785,225 L 815,225 L 815,240 L 845,240 L 845,225 L 885,225" fill="none" stroke="#c0392b" stroke-width="2"/>

  <!-- Блок опису кадру UART -->
  <rect x="705" y="265" width="190" height="125" fill="#e9f7ef" stroke="#27ae60" rx="6"/>
  <text x="800" y="287" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Кадр даних UART</text>
  <text x="800" y="310" font-size="12" fill="#1a1a1a" text-anchor="middle">• 1 Старт-біт (Low)</text>
  <text x="800" y="332" font-size="12" fill="#1a1a1a" text-anchor="middle">• 8 біт даних (LSB first)</text>
  <text x="800" y="354" font-size="12" fill="#1a1a1a" text-anchor="middle">• 1-2 Стоп-біти (High)</text>
  <text x="800" y="376" font-size="12" fill="#6b7280" text-anchor="middle">Логіка: 0 В / 3.3 В або 5 В</text>
</svg>
