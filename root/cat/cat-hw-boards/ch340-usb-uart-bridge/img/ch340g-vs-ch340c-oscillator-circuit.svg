<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Порівняння схем тактування CH340G та CH340C</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">CH340C зі вбудованим генератором усуває потребу у зовнішньому кварці 12 МГц та конденсаторах</text>

  <!-- ================= LEFT PANEL: CH340G ================= -->
  <rect x="30" y="75" width="435" height="375" rx="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Panel 1 Header Badge -->
  <rect x="45" y="90" width="405" height="36" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="247" y="113" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">CH340G — Зовнішній кварцовий резонатор</text>

  <!-- CH340G Chip Box -->
  <rect x="55" y="150" width="160" height="230" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="135" y="178" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">CH340G</text>
  <text x="135" y="198" font-size="12" fill="#6b7280" text-anchor="middle">(Корпус SOP-16)</text>

  <!-- Chip Pins XI / XO -->
  <text x="205" y="220" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">XI (13)</text>
  <circle cx="215" cy="215" r="3" fill="#2457d6"/>

  <text x="205" y="340" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">XO (14)</text>
  <circle cx="215" cy="335" r="3" fill="#2457d6"/>

  <!-- XI line (top rail) -->
  <polyline points="215,215 370,215" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- XO line (bottom rail) -->
  <polyline points="215,335 370,335" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Connection from XI rail to Y1 -->
  <polyline points="290,215 290,245" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Connection from XO rail to Y1 -->
  <polyline points="290,335 290,305" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Crystal Y1 Symbol -->
  <rect x="278" y="245" width="24" height="60" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="284" y="252" width="12" height="46" fill="#2457d6"/>
  <!-- Crystal Labels (placed on the left of Y1) -->
  <text x="268" y="270" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Y1</text>
  <text x="268" y="288" font-size="12" fill="#6b7280" text-anchor="end">12 МГц</text>

  <!-- Capacitor C1 (connected to XI rail at x=370) -->
  <polyline points="370,215 370,240" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- C1 plates -->
  <line x1="358" y1="240" x2="382" y2="240" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="358" y1="248" x2="382" y2="248" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="370" y1="248" x2="370" y2="275" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- C1 Labels (placed on the right of C1) -->
  <text x="392" y="240" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">C1</text>
  <text x="392" y="256" font-size="12" fill="#6b7280" text-anchor="start">22 pF</text>

  <!-- Capacitor C2 (connected to XO rail at x=370) -->
  <polyline points="370,335 370,310" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- C2 plates -->
  <line x1="358" y1="310" x2="382" y2="310" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="358" y1="302" x2="382" y2="302" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="370" y1="302" x2="370" y2="275" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- C2 Labels (placed on the right of C2) -->
  <text x="392" y="304" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">C2</text>
  <text x="392" y="320" font-size="12" fill="#6b7280" text-anchor="start">22 pF</text>

  <!-- Common GND for C1/C2 -->
  <circle cx="370" cy="275" r="3" fill="#1a1a1a"/>
  <!-- Wire right to Ground Symbol -->
  <line x1="370" y1="275" x2="400" y2="275" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Ground Symbol -->
  <line x1="400" y1="267" x2="400" y2="283" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="404" y1="271" x2="404" y2="279" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="408" y1="273" x2="408" y2="277" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="415" y="279" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="start">GND</text>

  <!-- Panel 1 Bottom Notice -->
  <rect x="45" y="402" width="405" height="36" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="247" y="424" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Вимагає 3 додаткові компоненти (Y1, C1, C2)</text>

  <!-- ================= RIGHT PANEL: CH340C ================= -->
  <rect x="495" y="75" width="435" height="375" rx="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Panel 2 Header Badge -->
  <rect x="510" y="90" width="405" height="36" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712" y="113" font-size="15" font-weight="bold" fill="#27ae60" text-anchor="middle">CH340C — Вбудований RC-генератор</text>

  <!-- CH340C Chip Box -->
  <rect x="515" y="150" width="225" height="230" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="627" y="178" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">CH340C</text>
  <text x="627" y="198" font-size="12" fill="#6b7280" text-anchor="middle">(Корпус SOP-16 / SOP-8)</text>

  <!-- Internal RC Oscillator Block inside CH340C -->
  <rect x="535" y="215" width="185" height="145" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="627" y="240" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Вбудований RC-генератор</text>
  <text x="627" y="262" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">12 МГц ±0.5%</text>

  <!-- Status badge inside internal generator -->
  <rect x="552" y="277" width="150" height="24" rx="4" fill="#27ae60"/>
  <text x="627" y="293" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">АКТИВНИЙ</text>
  <text x="627" y="322" font-size="12" fill="#6b7280" text-anchor="middle">(Заводське калібрування)</text>
  <text x="627" y="344" font-size="12" fill="#6b7280" text-anchor="middle">Без зовнішнього кварцу</text>

  <!-- Pin XI NC Line & Label -->
  <line x1="740" y1="215" x2="775" y2="215" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="770" y1="210" x2="780" y2="220" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="770" y1="220" x2="780" y2="210" stroke="#c0392b" stroke-width="1.5"/>
  <text x="790" y="219" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="start">XI: NC</text>

  <!-- Pin XO NC Line & Label -->
  <line x1="740" y1="335" x2="775" y2="335" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="770" y1="330" x2="780" y2="340" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="770" y1="340" x2="780" y2="330" stroke="#c0392b" stroke-width="1.5"/>
  <text x="790" y="339" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="start">XO: NC</text>

  <!-- Note on Right side -->
  <rect x="785" y="250" width="135" height="55" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="852" y="272" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Виводи XI / XO</text>
  <text x="852" y="291" font-size="12" fill="#1a1a1a" text-anchor="middle">не підключаються</text>

  <!-- Panel 2 Bottom Notice -->
  <rect x="510" y="402" width="405" height="36" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712" y="424" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Економія площі плати та спрощення схеми</text>
</svg>
