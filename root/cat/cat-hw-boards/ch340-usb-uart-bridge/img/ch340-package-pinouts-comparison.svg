  <line x1="405" y1="140" x2="423" y2="140" stroke="#7f8c8d" stroke-width="3"/>
  <text x="429" y="144" text-anchor="start" font-size="12" fill="#1a1a1a">16: VCC</text>

  <line x1="405" y1="168" x2="423" y2="168" stroke="#7f8c8d" stroke-width="3"/>
  <text x="429" y="172" text-anchor="start" font-size="12" fill="#1a1a1a">15: R232</text>

  <line x1="405" y1="196" x2="423" y2="196" stroke="#7f8c8d" stroke-width="3"/>
  <text x="429" y="200" text-anchor="start" font-size="12" fill="#1a1a1a">14: RTS</text>

  <line x1="405" y1="224" x2="423" y2="224" stroke="#7f8c8d" stroke-width="3"/>
  <text x="429" y="228" text-anchor="start" font-size="12" fill="#1a1a1a">13: DTR</text>

  <line x1="405" y1="252" x2="423" y2="252" stroke="#7f8c8d" stroke-width="3"/>
  <text x="429" y="256" text-anchor="start" font-size="12" fill="#1a1a1a">12: DCD</text>

  <line x1="405" y1="280" x2="423" y2="280" stroke="#7f8c8d" stroke-width="3"/>
  <text x="429" y="284" text-anchor="start" font-size="12" fill="#1a1a1a">11: RI</text>

  <line x1="405" y1="308" x2="423" y2="308" stroke="#7f8c8d" stroke-width="3"/>
  <text x="429" y="312" text-anchor="start" font-size="12" fill="#1a1a1a">10: DSR</text>

  <line x1="405" y1="336" x2="423" y2="336" stroke="#7f8c8d" stroke-width="3"/>
  <text x="429" y="340" text-anchor="start" font-size="12" fill="#1a1a1a">9: CTS</text>

  <!-- Summary Card 2 -->
  <rect x="260" y="390" width="215" height="145" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="367" y="412" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">CH340C (Без кварцу)</text>
  <text x="272" y="435" font-size="12" fill="#1a1a1a">• Вбудований генератор 12 МГц</text>
  <text x="272" y="455" font-size="12" fill="#1a1a1a">• Виводи 7 та 8 вільні (NC)</text>
  <text x="272" y="475" font-size="12" fill="#1a1a1a">• Повна сумісність із CH340G</text>
  <text x="272" y="497" font-size="12" font-weight="bold" fill="#27ae60">Застосування: бюджетні плати</text>


  <!-- COLUMN 3: CH340E (MSOP-10) -->
  <text x="597" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">CH340E</text>
  <text x="597" y="108" text-anchor="middle" font-size="12" fill="#6b7280">MSOP-10 (Компактний)</text>

  <!-- IC Body -->
  <rect x="560" y="165" width="75" height="160" rx="4" fill="#2c3e50" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="575" cy="177" r="3" fill="#ffffff"/>

  <!-- Left Pins (1..5) -->
  <line x1="542" y1="185" x2="560" y2="185" stroke="#7f8c8d" stroke-width="3"/>
  <text x="536" y="189" text-anchor="end" font-size="12" fill="#1a1a1a">1: UD+</text>

  <line x1="542" y1="215" x2="560" y2="215" stroke="#7f8c8d" stroke-width="3"/>
  <text x="536" y="219" text-anchor="end" font-size="12" fill="#1a1a1a">2: UD-</text>

  <line x1="542" y1="245" x2="560" y2="245" stroke="#7f8c8d" stroke-width="3"/>
  <text x="536" y="249" text-anchor="end" font-size="12" fill="#1a1a1a">3: GND</text>

  <line x1="542" y1="275" x2="560" y2="275" stroke="#7f8c8d" stroke-width="3"/>
  <text x="536" y="279" text-anchor="end" font-size="12" fill="#1a1a1a">4: RTS</text>

  <line x1="542" y1="305" x2="560" y2="305" stroke="#7f8c8d" stroke-width="3"/>
