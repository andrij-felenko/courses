  <!-- Right Pins (6..10) -->
  <line x1="635" y1="185" x2="653" y2="185" stroke="#7f8c8d" stroke-width="3"/>
  <text x="659" y="189" text-anchor="start" font-size="12" fill="#1a1a1a">10: DTR</text>

  <line x1="635" y1="215" x2="653" y2="215" stroke="#7f8c8d" stroke-width="3"/>
  <text x="659" y="219" text-anchor="start" font-size="12" fill="#1a1a1a">9: TNOW</text>

  <line x1="635" y1="245" x2="653" y2="245" stroke="#7f8c8d" stroke-width="3"/>
  <text x="659" y="249" text-anchor="start" font-size="12" fill="#1a1a1a">8: VCC</text>

  <line x1="635" y1="275" x2="653" y2="275" stroke="#7f8c8d" stroke-width="3"/>
  <text x="659" y="279" text-anchor="start" font-size="12" fill="#1a1a1a">7: RXD</text>

  <line x1="635" y1="305" x2="653" y2="305" stroke="#7f8c8d" stroke-width="3"/>
  <text x="659" y="309" text-anchor="start" font-size="12" fill="#1a1a1a">6: TXD</text>

  <!-- Summary Card 3 -->
  <rect x="490" y="390" width="215" height="145" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="597" y="412" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">CH340E (Мікро-корпус)</text>
  <text x="502" y="435" font-size="12" fill="#1a1a1a">• Компактний корпус MSOP-10</text>
  <text x="502" y="455" font-size="12" fill="#1a1a1a">• Вбудований генератор 12 МГц</text>
  <text x="502" y="475" font-size="12" fill="#1a1a1a">• Сигнали DTR, RTS та TNOW</text>
  <text x="502" y="497" font-size="12" font-weight="bold" fill="#2457d6">Застосування: компактні модулі</text>


  <!-- COLUMN 4: CH340N (SOP-8) -->
  <text x="827" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">CH340N</text>
  <text x="827" y="108" text-anchor="middle" font-size="12" fill="#6b7280">SOP-8 (Мінімальний)</text>

  <!-- IC Body -->
  <rect x="790" y="180" width="75" height="130" rx="4" fill="#2c3e50" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="805" cy="192" r="3" fill="#ffffff"/>

  <!-- Left Pins (1..4) -->
  <line x1="772" y1="198" x2="790" y2="198" stroke="#7f8c8d" stroke-width="3"/>
  <text x="766" y="202" text-anchor="end" font-size="12" fill="#1a1a1a">1: UD+</text>

  <line x1="772" y1="228" x2="790" y2="228" stroke="#7f8c8d" stroke-width="3"/>
  <text x="766" y="232" text-anchor="end" font-size="12" fill="#1a1a1a">2: UD-</text>

  <line x1="772" y1="258" x2="790" y2="258" stroke="#7f8c8d" stroke-width="3"/>
  <text x="766" y="262" text-anchor="end" font-size="12" fill="#1a1a1a">3: GND</text>

  <line x1="772" y1="288" x2="790" y2="288" stroke="#7f8c8d" stroke-width="3"/>
  <text x="766" y="292" text-anchor="end" font-size="12" fill="#1a1a1a">4: RTS</text>

  <!-- Right Pins (5..8) -->
  <line x1="865" y1="198" x2="883" y2="198" stroke="#7f8c8d" stroke-width="3"/>
  <text x="889" y="202" text-anchor="start" font-size="12" fill="#1a1a1a">8: VCC</text>

  <line x1="865" y1="228" x2="883" y2="228" stroke="#7f8c8d" stroke-width="3"/>
  <text x="889" y="232" text-anchor="start" font-size="12" fill="#1a1a1a">7: RXD</text>

  <line x1="865" y1="258" x2="883" y2="258" stroke="#7f8c8d" stroke-width="3"/>
  <text x="889" y="262" text-anchor="start" font-size="12" fill="#1a1a1a">6: TXD</text>

  <line x1="865" y1="288" x2="883" y2="288" stroke="#7f8c8d" stroke-width="3"/>
  <text x="889" y="292" text-anchor="start" font-size="12" fill="#1a1a1a">5: V3</text>

  <!-- Summary Card 4 -->
  <rect x="720" y="390" width="215" height="145" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="827" y="412" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">CH340N (Мінімальний)</text>
  <text x="732" y="435" font-size="12" fill="#1a1a1a">• Найменший корпус SOP-8</text>
  <text x="732" y="455" font-size="12" fill="#1a1a1a">• Лише лінії RXD, TXD та RTS</text>
  <text x="732" y="475" font-size="12" fill="#c0392b">• Без DTR (без автоскидання)</text>
  <text x="732" y="497" font-size="12" font-weight="bold" fill="#c0392b">Застосування: тільки UART RX/TX</text>
</svg>
