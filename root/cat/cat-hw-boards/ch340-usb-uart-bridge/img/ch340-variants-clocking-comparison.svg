<svg xmlns=http://www.w3.org/2000/svg viewBox=0 0 960 500 width=960 height=500 font-family=Segoe UI, Roboto, Helvetica, Arial, sans-serif>
  <defs>
    <marker id=arr markerWidth=9 markerHeight=9 refX=7.5 refY=4 orient=auto markerUnits=userSpaceOnUse>
      <path d=M0,0 L8,4 L0,8 Z fill=#1a1a1a/>
    </marker>
    <marker id=arr-green markerWidth=9 markerHeight=9 refX=7.5 refY=4 orient=auto markerUnits=userSpaceOnUse>
      <path d=M0,0 L8,4 L0,8 Z fill=#27ae60/>
    </marker>
    <marker id=arr-blue markerWidth=9 markerHeight=9 refX=7.5 refY=4 orient=auto markerUnits=userSpaceOnUse>
      <path d=M0,0 L8,4 L0,8 Z fill=#2457d6/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x=0 y=0 width=960 height=500 fill=white/>

  <!-- Main Title & Subtitle -->
  <text x=480 y=38 font-size=18 font-weight=bold fill=#1a1a1a text-anchor=middle>Порівняння тактування ревізій CH340G та CH340C</text>
  <text x=480 y=60 font-size=13 fill=#6b7280 text-anchor=middle>CH340G потребує зовнішнього кварцу 12 МГц, а CH340C має вбудований генератор</text>

  <!-- LEFT PANEL: CH340G -->
  <g id=panel-ch340g>
    <!-- Panel Container -->
    <rect x=25 y=80 width=440 height=395 rx=8 fill=#f4f6f8 stroke=#d0d7de stroke-width=1.5/>

    <!-- Header Banner -->
    <rect x=25 y=80 width=440 height=40 rx=8 fill=#eaf0fd stroke=#2457d6 stroke-width=1.5/>
    <rect x=25 y=110 width=440 height=10 fill=#eaf0fd/>
    <line x1=25 y1=120 x2=465 y2=120 stroke=#2457d6 stroke-width=1.5/>
    <text x=245 y=105 font-size=15 font-weight=bold fill=#2457d6 text-anchor=middle>CH340G — Зовнішнє тактування</text>

    <!-- Highlight Box Header -->
    <text x=352.5 y=193 font-size=12 font-weight=bold fill=#2457d6 text-anchor=middle>Зовнішнє коло тактування</text>

    <!-- Highlight Box around External Clock Circuit -->
    <rect x=248 y=200 width=210 height=190 rx=6 fill=#eaf0fd fill-opacity=0.3 stroke=#2457d6 stroke-width=1.5 stroke-dasharray=4,4/>

    <!-- IC Box CH340G -->
    <rect x=85 y=140 width=150 height=250 rx=6 fill=#ffffff stroke=#1a1a1a stroke-width=2/>
    <text x=160 y=167 font-size=16 font-weight=bold fill=#1a1a1a text-anchor=middle>CH340G</text>
    <text x=160 y=185 font-size=12 fill=#6b7280 text-anchor=middle>SOP-16</text>

    <!-- Pins Left side (VCC, V3, USB, GND) -->
    <!-- VCC (Pin 16) -->
    <line x1=55 y1=225 x2=85 y2=225 stroke=#1a1a1a stroke-width=1.5/>
    <text x=50 y=229 font-size=12 fill=#6b7280 text-anchor=end>VCC</text>
    <text x=91 y=229 font-size=12 fill=#9ca3af text-anchor=start>16</text>

    <!-- V3 (Pin 4) -->
    <line x1=55 y1=265 x2=85 y2=265 stroke=#1a1a1a stroke-width=1.5/>
    <text x=50 y=269 font-size=12 fill=#6b7280 text-anchor=end>V3</text>
    <text x=91 y=269 font-size=12 fill=#9ca3af text-anchor=start>4</text>

    <!-- USB D+/D- (Pins 5, 6) -->
    <line x1=55 y1=305 x2=85 y2=305 stroke=#1a1a1a stroke-width=1.5/>
    <text x=50 y=309 font-size=12 fill=#6b7280 text-anchor=end>USB</text>
    <text x=91 y=309 font-size=12 fill=#9ca3af text-anchor=start>5,6</text>

    <!-- GND (Pin 1) -->
    <line x1=55 y1=345 x2=85 y2=345 stroke=#1a1a1a stroke-width=1.5/>
    <text x=50 y=349 font-size=12 fill=#6b7280 text-anchor=end>GND</text>
    <text x=91 y=349 font-size=12 fill=#9ca3af text-anchor=start>1</text>

    <!-- Pins Right side (XI, XO) -->
    <!-- XI (Pin 7) -->
    <line x1=235 y1=230 x2=305 y2=230 stroke=#2457d6 stroke-width=1.5/>
    <text x=229 y=234 font-size=12 fill=#1a1a1a text-anchor=end>XI (7)</text>

    <!-- XO (Pin 8) -->
    <line x1=235 y1=340 x2=305 y2=340 stroke=#2457d6 stroke-width=1.5/>
    <text x=229 y=344 font-size=12 fill=#1a1a1a text-anchor=end>XO (8)</text>

    <!-- Crystal Y1 Connection -->
    <line x1=305 y1=230 x2=305 y2=265 stroke=#2457d6 stroke-width=1.5/>
    <line x1=305 y1=340 x2=305 y2=305 stroke=#2457d6 stroke-width=1.5/>

    <!-- Crystal Y1 Symbol -->
    <line x1=295 y1=265 x2=315 y2=265 stroke=#2457d6 stroke-width=2/>
    <line x1=295 y1=305 x2=315 y2=305 stroke=#2457d6 stroke-width=2/>
    <rect x=298 y=272 width=14 height=26 fill=#ffffff stroke=#2457d6 stroke-width=1.5/>

    <!-- Crystal Labels -->
    <text x=290 y=281 font-size=12 font-weight=bold fill=#2457d6 text-anchor=end>Y1</text>
    <text x=290 y=297 font-size=12 fill=#6b7280 text-anchor=end>12 МГц</text>

    <!-- Capacitor C1 Branch -->
    <line x1=305 y1=230 x2=370 y2=230 stroke=#2457d6 stroke-width=1.5/>
    <line x1=370 y1=230 x2=370 y2=255 stroke=#2457d6 stroke-width=1.5/>
    <circle cx=305 cy=230 r=3 fill=#2457d6/>

    <!-- C1 Symbol -->
    <line x1=360 y1=255 x2=380 y2=255 stroke=#2457d6 stroke-width=2/>
    <line x1=360 y1=270 x2=380 y2=270 stroke=#2457d6 stroke-width=2/>
    <text x=387 y=267 font-size=12 fill=#1a1a1a text-anchor=start>C1 (22 pF)</text>

    <!-- Capacitor C2 Branch -->
    <line x1=305 y1=340 x2=370 y2=340 stroke=#2457d6 stroke-width=1.5/>
    <line x1=370 y1=340 x2=370 y2=315 stroke=#2457d6 stroke-width=1.5/>
    <circle cx=305 cy=340 r=3 fill=#2457d6/>

    <!-- C2 Symbol -->
    <line x1=360 y1=300 x2=380 y2=300 stroke=#2457d6 stroke-width=2/>
    <line x1=360 y1=315 x2=380 y2=315 stroke=#2457d6 stroke-width=2/>
    <text x=387 y=312 font-size=12 fill=#1a1a1a text-anchor=start>C2 (22 pF)</text>

    <!-- GND Bus for Capacitors -->
    <line x1=370 y1=270 x2=370 y2=300 stroke=#2457d6 stroke-width=1.5/>
    <line x1=370 y1=315 x2=370 y2=355 stroke=#2457d6 stroke-width=1.5/>

    <!-- GND Symbol -->
    <line x1=360 y1=355 x2=380 y2=355 stroke=#2457d6 stroke-width=2/>
    <line x1=364 y1=359 x2=376 y2=359 stroke=#2457d6 stroke-width=1.5/>
    <line x1=368 y1=363 x2=372 y2=363 stroke=#2457d6 stroke-width=1.5/>
    <text x=370 y=377 font-size=12 fill=#6b7280 text-anchor=middle>GND</text>

    <!-- Summary Box CH340G -->
    <rect x=40 y=405 width=410 height=60 rx=6 fill=#fdecea stroke=#c0392b stroke-width=1.5/>
    <text x=245 y=427 font-size=13 font-weight=bold fill=#c0392b text-anchor=middle>Необхідні зовнішні компоненти</text>
    <text x=245 y=449 font-size=12 fill=#1a1a1a text-anchor=middle>Кварц 12 МГц + 2×C (22 pF) на платі</text>
  </g>

  <!-- RIGHT PANEL: CH340C -->
  <g id=panel-ch340c>
    <!-- Panel Container -->
    <rect x=495 y=80 width=440 height=395 rx=8 fill=#f4f6f8 stroke=#d0d7de stroke-width=1.5/>

    <!-- Header Banner -->
    <rect x=495 y=80 width=440 height=40 rx=8 fill=#e9f7ef stroke=#27ae60 stroke-width=1.5/>
    <rect x=495 y=110 width=440 height=10 fill=#e9f7ef/>
    <line x1=495 y1=120 x2=935 y2=120 stroke=#27ae60 stroke-width=1.5/>
    <text x=715 y=105 font-size=15 font-weight=bold fill=#27ae60 text-anchor=middle>CH340C — Вбудоване тактування</text>

    <!-- Highlight Box Header -->
    <text x=823 y=193 font-size=12 font-weight=bold fill=#27ae60 text-anchor=middle>Зовнішня обв'язка</text>

    <!-- Highlight Box around External Clock Area -->
    <rect x=718 y=200 width=210 height=190 rx=6 fill=#e9f7ef fill-opacity=0.3 stroke=#27ae60 stroke-width=1.5 stroke-dasharray=4,4/>

    <!-- IC Box CH340C -->
    <rect x=555 y=140 width=150 height=250 rx=6 fill=#ffffff stroke=#1a1a1a stroke-width=2/>
    <text x=630 y=167 font-size=16 font-weight=bold fill=#1a1a1a text-anchor=middle>CH340C</text>
    <text x=630 y=185 font-size=12 fill=#6b7280 text-anchor=middle>SOP-16</text>

    <!-- Internal Oscillator Box inside CH340C -->
    <rect x=595 y=246 width=70 height=78 rx=6 fill=#e9f7ef stroke=#27ae60 stroke-width=1.5/>
    <text x=630 y=263 font-size=12 font-weight=bold fill=#27ae60 text-anchor=middle>Внутрішній</text>
    <text x=630 y=279 font-size=12 font-weight=bold fill=#27ae60 text-anchor=middle>генератор</text>
    <text x=630 y=295 font-size=12 fill=#1a1a1a text-anchor=middle>12 МГц</text>
    <text x=630 y=311 font-size=12 font-weight=bold fill=#27ae60 text-anchor=middle>✓ Активний</text>

    <!-- Pins Left side (VCC, V3, USB, GND) -->
    <!-- VCC (Pin 16) -->
    <line x1=525 y1=225 x2=555 y2=225 stroke=#1a1a1a stroke-width=1.5/>
    <text x=520 y=229 font-size=12 fill=#6b7280 text-anchor=end>VCC</text>
    <text x=561 y=229 font-size=12 fill=#9ca3af text-anchor=start>16</text>

    <!-- V3 (Pin 4) -->
    <line x1=525 y1=265 x2=555 y2=265 stroke=#1a1a1a stroke-width=1.5/>
    <text x=520 y=269 font-size=12 fill=#6b7280 text-anchor=end>V3</text>
    <text x=561 y=269 font-size=12 fill=#9ca3af text-anchor=start>4</text>

    <!-- USB D+/D- (Pins 5, 6) -->
    <line x1=525 y1=305 x2=555 y2=305 stroke=#1a1a1a stroke-width=1.5/>
    <text x=520 y=309 font-size=12 fill=#6b7280 text-anchor=end>USB</text>
    <text x=561 y=309 font-size=12 fill=#9ca3af text-anchor=start>5,6</text>

    <!-- GND (Pin 1) -->
    <line x1=525 y1=345 x2=555 y2=345 stroke=#1a1a1a stroke-width=1.5/>
    <text x=520 y=349 font-size=12 fill=#6b7280 text-anchor=end>GND</text>
    <text x=561 y=349 font-size=12 fill=#9ca3af text-anchor=start>1</text>

    <!-- Pins Right side (XI, XO - NC) -->
    <!-- XI (Pin 7) -->
    <line x1=705 y1=230 x2=760 y2=230 stroke=#6b7280 stroke-width=1.5 stroke-dasharray=3,3/>
    <text x=699 y=234 font-size=12 fill=#6b7280 text-anchor=end>XI (7)</text>
    <circle cx=760 cy=230 r=3.5 fill=#ffffff stroke=#6b7280 stroke-width=1.5/>
    <text x=772 y=234 font-size=12 fill=#6b7280 text-anchor=start>NC (не задіяно)</text>

    <!-- XO (Pin 8) -->
    <line x1=705 y1=340 x2=760 y2=340 stroke=#6b7280 stroke-width=1.5 stroke-dasharray=3,3/>
    <text x=699 y=344 font-size=12 fill=#6b7280 text-anchor=end>XO (8)</text>
    <circle cx=760 cy=340 r=3.5 fill=#ffffff stroke=#6b7280 stroke-width=1.5/>
    <text x=772 y=344 font-size=12 fill=#6b7280 text-anchor=start>NC (не задіяно)</text>

    <!-- Highlight Box Explanation Text -->
    <text x=823 y=278 font-size=13 font-weight=bold fill=#27ae60 text-anchor=middle>КВАРЦ НЕ ПОТРІБЕН</text>
    <text x=823 y=296 font-size=12 fill=#27ae60 text-anchor=middle>Генератор інтегровано в чип</text>

    <!-- Summary Box CH340C -->
    <rect x=510 y=405 width=410 height=60 rx=6 fill=#e9f7ef stroke=#27ae60 stroke-width=1.5/>
    <text x=715 y=427 font-size=13 font-weight=bold fill=#27ae60 text-anchor=middle>Переваги ревізії CH340C</text>
    <text x=715 y=449 font-size=12 fill=#1a1a1a text-anchor=middle>Зменшення площі PCB та -3 компоненти в BOM</text>
  </g>
</svg>
