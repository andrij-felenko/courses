<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Markers -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схеми живлення CH340: варіанти 5 В та 3.3 В з узгодженням рівня TXD</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">При 5 В вивід V3 шунтується ємністю 100 нФ до GND, при 3.3 В — з'єднується з VCC; TXD узгоджується дільником напруги.</text>

  <!-- PANEL 1: 5V Mode -->
  <rect x="20" y="75" width="450" height="345" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="245" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Режим живлення 5 В (VCC = 5V)</text>
  <text x="245" y="118" text-anchor="middle" font-size="12" fill="#6b7280">Внутрішній LDO активний (V3 -&gt; 100 нФ -&gt; GND)</text>

  <!-- CH340 Chip Panel 1 -->
  <rect x="150" y="145" width="120" height="210" fill="#ffffff" stroke="#2457d6" stroke-width="2" rx="6"/>
  <text x="210" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">CH340C / G</text>

  <!-- CH340 Pins Left Panel 1 -->
  <!-- VCC Pin -->
  <line x1="110" y1="195" x2="150" y2="195" stroke="#1a1a1a" stroke-width="2"/>
  <text x="155" y="199" font-size="12" font-weight="bold" fill="#1a1a1a">VCC</text>
  <!-- V3 Pin -->
  <line x1="110" y1="250" x2="150" y2="250" stroke="#27ae60" stroke-width="2"/>
  <text x="155" y="254" font-size="12" font-weight="bold" fill="#27ae60">V3</text>
  <!-- GND Pin -->
  <line x1="150" y1="310" x2="170" y2="310" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="170" y1="310" x2="170" y2="330" stroke="#1a1a1a" stroke-width="2"/>
  <text x="155" y="306" font-size="12" fill="#6b7280">GND</text>

  <!-- CH340 Pins Right Panel 1 -->
  <!-- TXD Pin -->
  <line x1="270" y1="210" x2="280" y2="210" stroke="#2457d6" stroke-width="2"/>
  <text x="265" y="214" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">TXD</text>
  <!-- RXD Pin -->
  <line x1="270" y1="280" x2="370" y2="280" stroke="#1a1a1a" stroke-width="2"/>
  <text x="265" y="284" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">RXD</text>

  <!-- VCC 5V Supply Rail Panel 1 -->
  <line x1="45" y1="145" x2="110" y2="145" stroke="#c0392b" stroke-width="2"/>
  <line x1="110" y1="145" x2="110" y2="195" stroke="#c0392b" stroke-width="2"/>
  <circle cx="45" cy="145" r="4" fill="#c0392b"/>
  <text x="45" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">+5V (VBUS)</text>

  <!-- Decoupling Cap C_vcc Panel 1 -->
  <line x1="60" y1="145" x2="60" y2="168" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="60" cy="145" r="3" fill="#1a1a1a"/>
  <!-- Capacitor C_vcc symbol -->
  <line x1="50" y1="168" x2="70" y2="168" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="50" y1="174" x2="70" y2="174" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="60" y1="174" x2="60" y2="330" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="48" y="165" text-anchor="end" font-size="12" fill="#6b7280">C_vcc</text>
  <text x="48" y="181" text-anchor="end" font-size="12" fill="#6b7280">100 нФ</text>

  <!-- V3 Capacitor C_v3 Panel 1 (Highlighted) -->
  <line x1="110" y1="250" x2="110" y2="265" stroke="#27ae60" stroke-width="2"/>
  <!-- Capacitor C_v3 symbol -->
  <line x1="100" y1="265" x2="120" y2="265" stroke="#27ae60" stroke-width="2"/>
  <line x1="100" y1="271" x2="120" y2="271" stroke="#27ae60" stroke-width="2"/>
  <line x1="110" y1="271" x2="110" y2="330" stroke="#27ae60" stroke-width="2"/>

  <!-- C_v3 Labels positioned cleanly in 50px gap between x=60 and x=110 -->
  <text x="85" y="263" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">C_v3</text>
  <text x="85" y="277" text-anchor="middle" font-size="12" fill="#27ae60">100 нФ</text>

  <!-- Common GND Line Panel 1 -->
  <line x1="60" y1="330" x2="170" y2="330" stroke="#1a1a1a" stroke-width="2"/>
  <!-- GND Symbol 1 -->
  <line x1="170" y1="330" x2="170" y2="335" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="160" y1="335" x2="180" y2="335" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="164" y1="339" x2="176" y2="339" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="167" y1="343" x2="173" y2="343" stroke="#1a1a1a" stroke-width="1"/>

  <!-- MCU Box Panel 1 -->
  <rect x="370" y="145" width="85" height="210" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="412" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">MCU (3.3V)</text>
  <text x="375" y="214" font-size="12" font-weight="bold" fill="#2457d6">RXD</text>
  <text x="375" y="284" font-size="12" font-weight="bold" fill="#1a1a1a">TXD</text>

  <!-- Voltage Divider TXD (Panel 1) -->
  <!-- R1 Resistor -->
  <rect x="280" y="202" width="28" height="16" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="294" y="194" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">R1 1kΩ</text>
  <line x1="308" y1="210" x2="370" y2="210" stroke="#2457d6" stroke-width="2"/>
  <circle cx="325" cy="210" r="3" fill="#2457d6"/>

  <!-- R2 Resistor to GND -->
  <line x1="325" y1="210" x2="325" y2="236" stroke="#2457d6" stroke-width="2"/>
  <rect x="317" y="236" width="16" height="24" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="310" y="252" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">R2 2kΩ</text>
  <line x1="325" y1="260" x2="325" y2="268" stroke="#2457d6" stroke-width="2"/>
  <!-- GND for R2 -->
  <line x1="315" y1="268" x2="335" y2="268" stroke="#2457d6" stroke-width="2"/>
  <line x1="319" y1="272" x2="331" y2="272" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="322" y1="276" x2="328" y2="276" stroke="#2457d6" stroke-width="1"/>

  <!-- RXD Direct Line Label (Panel 1) -->
  <text x="320" y="296" text-anchor="middle" font-size="12" fill="#6b7280">Пряме RXD</text>

  <!-- Badge for Divider -->
  <rect x="280" y="370" width="175" height="36" fill="#eaf0fd" stroke="#2457d6" rx="4"/>
  <text x="367" y="385" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Дільник напруги TXD</text>
  <text x="367" y="399" text-anchor="middle" font-size="12" fill="#2457d6">5V TXD -&gt; 3.33V MCU RXD</text>

  <!-- PANEL 2: 3.3V Mode -->
  <rect x="490" y="75" width="450" height="345" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="715" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Режим живлення 3.3 В (VCC = 3.3V)</text>
  <text x="715" y="118" text-anchor="middle" font-size="12" fill="#6b7280">Внутрішній LDO вимкнений (V3 з'єднано з VCC)</text>

  <!-- CH340 Chip Panel 2 -->
  <rect x="630" y="145" width="120" height="210" fill="#ffffff" stroke="#2457d6" stroke-width="2" rx="6"/>
  <text x="690" y="170" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">CH340C / G</text>

  <!-- CH340 Pins Left Panel 2 -->
  <!-- VCC Pin -->
  <line x1="600" y1="195" x2="630" y2="195" stroke="#1a1a1a" stroke-width="2"/>
  <text x="635" y="199" font-size="12" font-weight="bold" fill="#1a1a1a">VCC</text>
  <!-- V3 Pin -->
  <line x1="600" y1="250" x2="630" y2="250" stroke="#27ae60" stroke-width="2"/>
  <text x="635" y="254" font-size="12" font-weight="bold" fill="#27ae60">V3</text>
  <!-- GND Pin -->
  <line x1="630" y1="310" x2="650" y2="310" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="650" y1="310" x2="650" y2="330" stroke="#1a1a1a" stroke-width="2"/>
  <text x="635" y="306" font-size="12" fill="#6b7280">GND</text>

  <!-- CH340 Pins Right Panel 2 -->
  <!-- TXD Pin -->
  <line x1="750" y1="210" x2="840" y2="210" stroke="#27ae60" stroke-width="2"/>
  <text x="745" y="214" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">TXD</text>
  <!-- RXD Pin -->
  <line x1="750" y1="280" x2="840" y2="280" stroke="#1a1a1a" stroke-width="2"/>
  <text x="745" y="284" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">RXD</text>

  <!-- VCC 3.3V Supply Rail Panel 2 -->
  <line x1="510" y1="145" x2="600" y2="145" stroke="#27ae60" stroke-width="2"/>
  <line x1="600" y1="145" x2="600" y2="195" stroke="#27ae60" stroke-width="2"/>
  <circle cx="510" cy="145" r="4" fill="#27ae60"/>
  <text x="510" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">+3.3V</text>

  <!-- Decoupling Cap C_vcc Panel 2 -->
  <line x1="530" y1="145" x2="530" y2="168" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="530" cy="145" r="3" fill="#1a1a1a"/>
  <!-- Capacitor C_vcc symbol -->
  <line x1="520" y1="168" x2="540" y2="168" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="520" y1="174" x2="540" y2="174" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="530" y1="174" x2="530" y2="330" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="518" y="165" text-anchor="end" font-size="12" fill="#6b7280">C_vcc</text>
  <text x="518" y="181" text-anchor="end" font-size="12" fill="#6b7280">100 нФ</text>

  <!-- V3 Connected Directly to VCC (Panel 2 Highlighted) -->
  <line x1="600" y1="195" x2="600" y2="250" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="600" cy="195" r="3.5" fill="#27ae60"/>
  <circle cx="600" cy="250" r="3.5" fill="#27ae60"/>

  <rect x="538" y="208" width="54" height="38" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="565" y="223" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">V3 = VCC</text>
  <text x="565" y="237" text-anchor="middle" font-size="12" fill="#27ae60">напряму</text>

  <!-- Common GND Line Panel 2 -->
  <line x1="530" y1="330" x2="650" y2="330" stroke="#1a1a1a" stroke-width="2"/>
  <!-- GND Symbol 2 -->
  <line x1="650" y1="330" x2="650" y2="335" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="640" y1="335" x2="660" y2="335" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="644" y1="339" x2="656" y2="339" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="647" y1="343" x2="653" y2="343" stroke="#1a1a1a" stroke-width="1"/>

  <!-- MCU Box Panel 2 -->
  <rect x="840" y="145" width="85" height="210" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="882" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">MCU (3.3V)</text>
  <text x="845" y="214" font-size="12" font-weight="bold" fill="#27ae60">RXD</text>
  <text x="845" y="284" font-size="12" font-weight="bold" fill="#1a1a1a">TXD</text>

  <!-- Direct Connection Labels Panel 2 -->
  <text x="795" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Пряме TXD</text>
  <text x="795" y="296" text-anchor="middle" font-size="12" fill="#6b7280">Пряме RXD</text>

  <!-- Badge for 3.3V Mode -->
  <rect x="750" y="370" width="175" height="36" fill="#e9f7ef" stroke="#27ae60" rx="4"/>
  <text x="837" y="385" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Однорідні рівні 3.3V</text>
  <text x="837" y="399" text-anchor="middle" font-size="12" fill="#27ae60">Дільники не потрібні</text>

  <!-- BOTTOM SUMMARY PANEL -->
  <rect x="20" y="435" width="920" height="85" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="35" y="458" font-size="13" font-weight="bold" fill="#1a1a1a">Ключові правила виводу V3 та узгодження ліній:</text>
  <text x="35" y="480" font-size="12" fill="#1a1a1a">• Режим 5 В: V3 підключається до GND через ємність 100 нФ (вихід внутрішнього LDO 3.3 В); TXD вимагає дільника (1 кОм / 2 кОм).</text>
  <text x="35" y="500" font-size="12" fill="#1a1a1a">• Режим 3.3 В: V3 з'єднується безпосередньо з виводом VCC (+3.3 В) (LDO обходиться); усі сигнальні лінії підключаються напряму.</text>
</svg>
