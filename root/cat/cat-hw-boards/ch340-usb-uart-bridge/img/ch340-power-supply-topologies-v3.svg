<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Топології живлення USB-UART перетворювача CH340</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">У режимі 5 В вивід V3 фільтрується конденсатором, а при 3,3 В — об'єднується з VCC</text>

  <!-- ЛІВА ПАНЕЛЬ: Режим 5 В -->
  <rect x="30" y="80" width="435" height="380" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  
  <rect x="45" y="95" width="405" height="32" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="247.5" y="116" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Режим живлення 5 В (VCC = +5V)</text>

  <rect x="230" y="150" width="200" height="235" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" rx="6"/>
  <text x="330" y="174" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">CH340 (IC)</text>

  <rect x="285" y="195" width="130" height="90" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" stroke-dasharray="4 3" rx="4"/>
  <text x="350" y="218" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Внутрішній LDO</text>
  <text x="350" y="236" font-size="12" fill="#2457d6" text-anchor="middle">(5V ➔ 3.3V)</text>
  <text x="350" y="265" font-size="12" fill="#2457d6" text-anchor="middle">Вихід 3,3 В</text>

  <path d="M 230,215 L 285,215" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M 350,285 L 350,315 L 230,315" stroke="#2457d6" stroke-width="1.5" fill="none" marker-end="url(#arr-blue)"/>

  <text x="238" y="207" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">VCC</text>
  <text x="238" y="307" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">V3</text>
  <text x="238" y="357" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">GND</text>

  <text x="55" y="200" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="start">+5V (VBUS)</text>
  <line x1="55" y1="215" x2="230" y2="215" stroke="#1a1a1a" stroke-width="2"/>

  <circle cx="100" cy="215" r="3" fill="#1a1a1a"/>
  <line x1="100" y1="215" x2="100" y2="255" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="90" y1="255" x2="110" y2="255" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="90" y1="265" x2="110" y2="265" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="100" y1="265" x2="100" y2="365" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="100" cy="365" r="3" fill="#1a1a1a"/>

  <text x="85" y="255" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">C1</text>
  <text x="85" y="270" font-size="12" fill="#6b7280" text-anchor="end">100 нФ</text>

  <line x1="175" y1="315" x2="230" y2="315" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="175" cy="315" r="3" fill="#1a1a1a"/>
  <line x1="175" y1="315" x2="175" y2="330" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="165" y1="330" x2="185" y2="330" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="165" y1="340" x2="185" y2="340" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="175" y1="340" x2="175" y2="365" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="175" cy="365" r="3" fill="#1a1a1a"/>

  <text x="160" y="332" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">C2 (V3)</text>
  <text x="160" y="347" font-size="12" fill="#6b7280" text-anchor="end">100 нФ</text>

  <text x="55" y="357" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">GND</text>
  <line x1="55" y1="365" x2="230" y2="365" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="55" y1="365" x2="55" y2="373" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="47" y1="373" x2="63" y2="373" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="50" y1="377" x2="60" y2="377" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="53" y1="381" x2="57" y2="381" stroke="#1a1a1a" stroke-width="1.5"/>

  <rect x="45" y="405" width="405" height="42" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="247.5" y="422" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">✔ V3 — тільки фільтруючий C = 100 нФ</text>
  <text x="247.5" y="438" font-size="12" fill="#1a1a1a" text-anchor="middle">Внутрішній LDO формує 3,3 В для ядра</text>

  <!-- ПРАВА ПАНЕЛЬ: Режим 3,3 В -->
  <rect x="495" y="80" width="435" height="380" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>

  <rect x="510" y="95" width="405" height="32" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="712.5" y="116" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Режим живлення 3,3 В (VCC = +3.3V)</text>

  <rect x="695" y="150" width="200" height="235" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" rx="6"/>
  <text x="795" y="174" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">CH340 (IC)</text>

  <rect x="750" y="195" width="130" height="90" fill="#f4f6f8" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 3" rx="4"/>
  <text x="815" y="218" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Внутрішній LDO</text>
  <text x="815" y="236" font-size="12" fill="#6b7280" text-anchor="middle">вимкнено / обхід</text>
  <text x="815" y="265" font-size="12" fill="#6b7280" text-anchor="middle">(3,3 В ззовні)</text>

  <text x="703" y="207" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">VCC</text>
  <text x="703" y="307" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">V3</text>
  <text x="703" y="357" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">GND</text>

  <text x="520" y="200" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="start">+3.3V</text>
  <line x1="520" y1="215" x2="695" y2="215" stroke="#1a1a1a" stroke-width="2"/>

  <circle cx="565" cy="215" r="3" fill="#1a1a1a"/>
  <line x1="565" y1="215" x2="565" y2="255" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="555" y1="255" x2="575" y2="255" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="555" y1="265" x2="575" y2="265" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="565" y1="265" x2="565" y2="365" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="565" cy="365" r="3" fill="#1a1a1a"/>

  <text x="550" y="255" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">C1</text>
  <text x="550" y="270" font-size="12" fill="#6b7280" text-anchor="end">100 нФ</text>

  <circle cx="665" cy="215" r="4" fill="#2457d6"/>
  <line x1="665" y1="215" x2="665" y2="315" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="665" y1="315" x2="695" y2="315" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="665" cy="315" r="4" fill="#2457d6"/>

  <text x="620" y="255" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Об'єднання</text>
  <text x="620" y="270" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">VCC та V3</text>

  <text x="520" y="357" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">GND</text>
  <line x1="520" y1="365" x2="695" y2="365" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="520" y1="365" x2="520" y2="373" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="512" y1="373" x2="528" y2="373" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="515" y1="377" x2="525" y2="377" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="518" y1="381" x2="522" y2="381" stroke="#1a1a1a" stroke-width="1.5"/>

  <rect x="510" y="405" width="405" height="42" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="712.5" y="422" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">✔ V3 з'єднано з VCC і джерелом +3,3 В</text>
  <text x="712.5" y="438" font-size="12" fill="#1a1a1a" text-anchor="middle">Внутрішній LDO вимкнено</text>
</svg>
