<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схемотехніка автоскидання ESP32 / ESP8266 на мості CH340</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Двотранзисторний вузол DTR/RTS для автоматичного переведення в режим прошивки (Bootloader)</text>

  <!-- ==================== PANEL 1: CH340 BRIDGE ==================== -->
  <rect x="35" y="80" width="220" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="145" y="105" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Мост CH340</text>

  <!-- CH340 IC Box -->
  <rect x="50" y="140" width="130" height="230" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="115" y="165" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">CH340G / CH340C</text>
  <text x="115" y="182" font-size="12" fill="#6b7280" text-anchor="middle">(USB-UART)</text>

  <!-- Signals -->
  <!-- DTR# -->
  <circle cx="180" cy="210" r="3.5" fill="#2457d6"/>
  <text x="170" y="214" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">DTR#</text>

  <!-- RTS# -->
  <circle cx="180" cy="270" r="3.5" fill="#2457d6"/>
  <text x="170" y="274" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">RTS#</text>

  <!-- TXD -->
  <circle cx="180" cy="320" r="3.5" fill="#27ae60"/>
  <text x="170" y="324" font-size="12" fill="#1a1a1a" text-anchor="end">TXD</text>

  <!-- RXD -->
  <circle cx="180" cy="350" r="3.5" fill="#27ae60"/>
  <text x="170" y="354" font-size="12" fill="#1a1a1a" text-anchor="end">RXD</text>

  <!-- Panel 1 Callout Box -->
  <rect x="50" y="390" width="190" height="105" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-dasharray="4,4"/>
  <text x="145" y="410" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Сигнали CH340:</text>
  <text x="60" y="432" font-size="12" fill="#1a1a1a">• DTR# (Data Term. Ready)</text>
  <text x="60" y="454" font-size="12" fill="#1a1a1a">• RTS# (Request To Send)</text>
  <text x="60" y="480" font-size="12" font-weight="bold" fill="#c0392b">Активні в LOW (0V)</text>

  <!-- ==================== PANEL 2: AUTO-RESET CIRCUIT ==================== -->
  <rect x="275" y="80" width="370" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="460" y="105" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">2. Вузол автоскидання (VT1/VT2)</text>

  <!-- Signal Wires from Panel 1 into Panel 2 -->
  <!-- DTR# Line (210) -->
  <line x1="180" y1="210" x2="300" y2="210" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="285" cy="210" r="3" fill="#2457d6"/>

  <!-- RTS# Line (270) -->
  <line x1="180" y1="270" x2="450" y2="270" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="285" cy="270" r="3" fill="#2457d6"/>

  <!-- DTR# branch down to VT2 Emitter (330) -->
  <line x1="285" y1="210" x2="285" y2="330" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="285" y1="330" x2="450" y2="330" stroke="#2457d6" stroke-width="1.5"/>

  <!-- RTS# branch down to R2 (300) -->
  <line x1="285" y1="270" x2="285" y2="300" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="285" y1="300" x2="300" y2="300" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Resistor R1 (10k) on DTR to VT1 Base -->
  <rect x="300" y="200" width="45" height="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="322.5" y="193" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">R1 10k</text>
  <line x1="345" y1="210" x2="380" y2="210" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Resistor R2 (10k) on RTS to VT2 Base -->
  <rect x="300" y="290" width="45" height="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="322.5" y="325" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">R2 10k</text>
  <line x1="345" y1="300" x2="380" y2="300" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Transistor VT1 (NPN S8050) -->
  <text x="420" y="165" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">VT1 (NPN S8050)</text>
  <text x="420" y="180" font-size="12" fill="#6b7280" text-anchor="middle">Формує EN</text>
  <!-- VT1 Base, Bar, Collector, Emitter -->
  <line x1="400" y1="190" x2="400" y2="230" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="380" y1="210" x2="400" y2="210" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="400" y1="200" x2="430" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="430" y1="180" x2="450" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="400" y1="220" x2="430" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="425,232 432,242 420,240" fill="#1a1a1a"/>
  <line x1="430" y1="240" x2="450" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- VT1 Emitter to RTS# Line (240 to 270) -->
  <line x1="450" y1="240" x2="450" y2="270" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="450" cy="270" r="3" fill="#1a1a1a"/>

  <!-- Transistor VT2 (NPN S8050) -->
  <text x="420" y="350" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">VT2 (NPN S8050)</text>
  <text x="420" y="365" font-size="12" fill="#6b7280" text-anchor="middle">Формує GPIO0</text>
  <!-- VT2 Base, Bar, Collector, Emitter -->
  <line x1="400" y1="280" x2="400" y2="320" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="380" y1="300" x2="400" y2="300" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="400" y1="290" x2="430" y2="270" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="430" y1="270" x2="450" y2="270" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="400" y1="310" x2="430" y2="330" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="425,322 432,332 420,330" fill="#1a1a1a"/>
  <line x1="430" y1="330" x2="450" y2="330" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Collector Outputs from VT1/VT2 into Panel 3 -->
  <!-- EN Output from VT1 Collector (180) -->
  <line x1="450" y1="180" x2="520" y2="180" stroke="#2457d6" stroke-width="2"/>
  <line x1="520" y1="180" x2="520" y2="210" stroke="#2457d6" stroke-width="2"/>
  <line x1="520" y1="210" x2="665" y2="210" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- GPIO0 Output from VT2 Collector (270) -->
  <line x1="450" y1="270" x2="665" y2="270" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Panel 2 Truth Table Box -->
  <rect x="290" y="385" width="340" height="110" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-dasharray="4,4"/>
  <text x="460" y="405" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Логіка переключення сигналів DTR / RTS:</text>
  <text x="300" y="427" font-size="12" fill="#1a1a1a">• DTR=1, RTS=0  ⇒  EN=0 (Reset), GPIO0=1 (Пауза)</text>
  <text x="300" y="450" font-size="12" fill="#c0392b" font-weight="bold">• DTR=0, RTS=1  ⇒  EN=1 (Старт), GPIO0=0 (Boot!)</text>
  <text x="300" y="473" font-size="12" fill="#27ae60" font-weight="bold">✓ Вхід у Bootloader без натискання кнопок руками</text>

  <!-- ==================== PANEL 3: TARGET ESP32 ==================== -->
  <rect x="665" y="80" width="260" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="795" y="105" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">3. Мікроконтролер ESP32</text>

  <!-- +3.3V Power Rail inside Panel 3 -->
  <line x1="680" y1="125" x2="900" y2="125" stroke="#27ae60" stroke-width="2"/>
  <text x="680" y="118" font-size="12" font-weight="bold" fill="#27ae60">+3.3V</text>

  <!-- R3 Pull-up 10k on EN Pin -->
  <line x1="710" y1="125" x2="710" y2="145" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="700" y="145" width="20" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="692" y="168" font-size="12" fill="#6b7280" text-anchor="end">R3 10k</text>
  <line x1="710" y1="185" x2="710" y2="210" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="710" cy="210" r="3" fill="#1a1a1a"/>

  <!-- C1 Filter Capacitor (100nF) on EN Pin -->
  <line x1="740" y1="210" x2="740" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="740" cy="210" r="3" fill="#1a1a1a"/>
  <line x1="730" y1="230" x2="750" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="730" y1="236" x2="750" y2="236" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="740" y1="236" x2="740" y2="248" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- C1 Ground -->
  <line x1="732" y1="248" x2="748" y2="248" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="736" y1="252" x2="744" y2="252" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="738" y1="256" x2="742" y2="256" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="758" y="235" font-size="12" fill="#6b7280">C1 100nF</text>

  <!-- R4 Pull-up 10k on GPIO0 Pin -->
  <line x1="710" y1="210" x2="710" y2="280" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="700" y="280" width="20" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="692" y="303" font-size="12" fill="#6b7280" text-anchor="end">R4 10k</text>
  <line x1="710" y1="320" x2="710" y2="270" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="710" cy="270" r="3" fill="#1a1a1a"/>

  <!-- Target ESP32 IC Box -->
  <rect x="780" y="140" width="130" height="230" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="845" y="165" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">ESP32 / ESP8266</text>
  <text x="845" y="182" font-size="12" fill="#6b7280" text-anchor="middle">(Target MCU)</text>

  <!-- Target Pins -->
  <circle cx="780" cy="210" r="3.5" fill="#2457d6"/>
  <text x="790" y="214" font-size="12" font-weight="bold" fill="#1a1a1a">EN (RST)</text>

  <circle cx="780" cy="270" r="3.5" fill="#c0392b"/>
  <text x="790" y="274" font-size="12" font-weight="bold" fill="#c0392b">GPIO0</text>

  <circle cx="780" cy="320" r="3.5" fill="#27ae60"/>
  <text x="790" y="324" font-size="12" fill="#1a1a1a">RXD0</text>

  <circle cx="780" cy="350" r="3.5" fill="#27ae60"/>
  <text x="790" y="354" font-size="12" fill="#1a1a1a">TXD0</text>

  <!-- Panel 3 Callout Box -->
  <rect x="680" y="385" width="230" height="110" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-dasharray="4,4"/>
  <text x="795" y="405" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Захист та підтяжка:</text>
  <text x="690" y="427" font-size="12" fill="#1a1a1a">• R3/R4 утримують HIGH</text>
  <text x="690" y="450" font-size="12" fill="#1a1a1a">• C1 гасить імпульсні завади</text>
  <text x="690" y="473" font-size="12" font-weight="bold" fill="#27ae60">✓ Надійний запуск MCU</text>
</svg>
