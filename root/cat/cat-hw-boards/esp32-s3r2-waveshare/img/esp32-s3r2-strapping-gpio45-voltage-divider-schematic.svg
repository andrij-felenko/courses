<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Header -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схемотехніка дільника напруги та підтяжки виводу GPIO45</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Фіксування логічного нуля (V_GPIO45 &lt; V_IL) під час скидання виключає збій напруги VDD_SPI</text>

  <!-- Left Panel: External Circuit -->
  <rect x="40" y="85" width="270" height="355" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="175" y="110" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Зовнішнє коло підтяжки</text>

  <!-- VDD33 Node -->
  <circle cx="175" cy="140" r="4" fill="#2457d6"/>
  <text x="175" y="136" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">VDD33 (3.3 В)</text>
  <line x1="175" y1="140" x2="175" y2="165" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Resistor R_ext -->
  <rect x="162" y="165" width="26" height="50" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="152" y="193" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="end">R_ext (10 кОм)</text>
  <line x1="175" y1="215" x2="175" y2="250" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Node Junction GPIO45 -->
  <circle cx="175" cy="250" r="4" fill="#2457d6"/>
  <text x="163" y="246" font-size="10" font-weight="bold" fill="#1a1a1a" text-anchor="end">Вузол GPIO45</text>

  <!-- Line to Capacitor branch -->
  <line x1="175" y1="250" x2="247" y2="250" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="247" y1="250" x2="247" y2="265" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Capacitor C_filter -->
  <rect x="235" y="265" width="24" height="40" rx="2" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="270" y="288" font-size="10" fill="#6b7280" text-anchor="start">C_filter (100 нФ)</text>
  <line x1="247" y1="305" x2="247" y2="385" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="175" y1="250" x2="175" y2="385" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="175" y1="385" x2="247" y2="385" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Ground Node -->
  <line x1="196" y1="385" x2="226" y2="385" stroke="#6b7280" stroke-width="2"/>
  <line x1="203" y1="390" x2="219" y2="390" stroke="#6b7280" stroke-width="2"/>
  <line x1="208" y1="395" x2="214" y2="395" stroke="#6b7280" stroke-width="2"/>
  <text x="175" y="410" font-size="10" fill="#6b7280" text-anchor="middle">GND (0 В)</text>

  <!-- Connection Line: Left -> Center -->
  <line x1="175" y1="250" x2="338" y2="250" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="325" y="242" font-size="10" fill="#2457d6" text-anchor="middle">Вхід GPIO45</text>

  <!-- Center Panel: ESP32-S3 Microcontroller -->
  <rect x="345" y="85" width="280" height="355" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="485" y="110" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">Мікроконтролер ESP32-S3</text>

  <!-- Sub-block 1: Input Stage -->
  <rect x="360" y="130" width="250" height="65" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="485" y="148" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вхідний каскад GPIO45</text>
  <text x="485" y="165" font-size="10" fill="#6b7280" text-anchor="middle">Внутрішній R_int (30–60 кОм) до GND</text>
  <text x="485" y="180" font-size="10" fill="#6b7280" text-anchor="middle">Струм витоку I_leak ≤ 10 мкА</text>

  <!-- Sub-block 2: Threshold Detector -->
  <rect x="360" y="210" width="250" height="65" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="485" y="228" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Детектор порогу V_IL / V_IH</text>
  <text x="485" y="245" font-size="10" fill="#2457d6" text-anchor="middle">Поріг лог. 0: V_IL = 0.25 × VDD (0.825 В)</text>
  <text x="485" y="260" font-size="10" fill="#27ae60" text-anchor="middle">Дійсний V_GPIO45 ≤ 0.1 В (&lt; V_IL)</text>

  <!-- Sub-block 3: LDO Controller -->
  <rect x="360" y="290" width="250" height="65" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="485" y="308" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Контролер регулятора VDD_SPI</text>
  <text x="485" y="325" font-size="10" fill="#27ae60" text-anchor="middle">При V_GPIO45 &lt; V_IL -&gt; VDD_SPI = 3.3 В</text>
  <text x="485" y="340" font-size="10" fill="#c0392b" text-anchor="middle">При V_GPIO45 &gt; V_IH -&gt; VDD_SPI = 1.8 В</text>

  <!-- Sub-block 4: Status Mode -->
  <rect x="360" y="370" width="250" height="48" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="485" y="388" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Режим 3.3 В активтовано</text>
  <text x="485" y="405" font-size="10" fill="#6b7280" text-anchor="middle">Безпечна робота Flash та PSRAM</text>

  <!-- Connection Line: Center -> Right -->
  <line x1="610" y1="322" x2="653" y2="322" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="637" y="314" font-size="10" fill="#27ae60" text-anchor="middle">VDD_SPI</text>

  <!-- Right Panel: Memory Domain -->
  <rect x="660" y="85" width="260" height="355" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="790" y="110" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Живлення пам'яті VDD_SPI</text>

  <!-- Flash Block -->
  <rect x="675" y="140" width="230" height="75" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="790" y="162" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">16 МБ NOR Flash-пам'ять</text>
  <text x="790" y="180" font-size="11" fill="#27ae60" text-anchor="middle">Робоча напруга: 3.3 В</text>
  <text x="790" y="196" font-size="10" fill="#6b7280" text-anchor="middle">Нормальне читання та прошивка</text>

  <!-- PSRAM Block -->
  <rect x="675" y="235" width="230" height="75" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="790" y="257" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2 МБ Quad SPI PSRAM</text>
  <text x="790" y="275" font-size="11" fill="#27ae60" text-anchor="middle">Робоча напруга: 3.3 В</text>
  <text x="790" y="291" font-size="10" fill="#6b7280" text-anchor="middle">Буферизація кадрів на 80 МГц</text>

  <!-- Safety Status Box -->
  <rect x="675" y="330" width="230" height="90" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="790" y="350" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Статус завадостійкості: OK</text>
  <text x="790" y="368" font-size="10" fill="#6b7280" text-anchor="middle">Запас по напрузі: ΔV = 0.725 В</text>
  <text x="790" y="384" font-size="10" fill="#6b7280" text-anchor="middle">R_ext ≤ 46.2 кОм (з 20% запасом)</text>
  <text x="790" y="400" font-size="10" fill="#27ae60" text-anchor="middle">Втрату Flash усунуто</text>
</svg>
