<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Header -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Архітектура шин пам'яті та трансляції адрес у чипі ESP32-S3R2</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Маршрутизація звернень ядер Xtensa LX7 через MMU та L1 Cache до 16 МБ Flash (Quad SPI) та 2 МБ PSRAM (Octal SPI)</text>

  <!-- Panel 1: Processor Cores & Internal SRAM -->
  <rect x="40" y="90" width="200" height="370" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="40" y="90" width="200" height="40" rx="8" ry="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <rect x="40" y="118" width="200" height="12" fill="#eaf0fd"/>
  <text x="140" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Ядра Xtensa LX7</text>

  <!-- Core 0 -->
  <rect x="55" y="150" width="170" height="80" rx="4" fill="white" stroke="#2457d6"/>
  <text x="140" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Core 0 (PRO CPU)</text>
  <text x="140" y="195" text-anchor="middle" font-size="12" fill="#6b7280">240 МГц · 32 біти</text>
  <text x="140" y="213" text-anchor="middle" font-size="12" fill="#6b7280">Інструкції I-Bus</text>

  <!-- Core 1 -->
  <rect x="55" y="250" width="170" height="80" rx="4" fill="white" stroke="#2457d6"/>
  <text x="140" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Core 1 (APP CPU)</text>
  <text x="140" y="295" text-anchor="middle" font-size="12" fill="#6b7280">240 МГц · 32 біти</text>
  <text x="140" y="313" text-anchor="middle" font-size="12" fill="#6b7280">Дані D-Bus</text>

  <!-- Internal SRAM -->
  <rect x="55" y="350" width="170" height="95" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="140" y="375" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Внутрішня SRAM</text>
  <text x="140" y="395" text-anchor="middle" font-size="12" fill="#1a1a1a">520 КБ (SRAM0/1/2)</text>
  <text x="140" y="413" text-anchor="middle" font-size="12" fill="#6b7280">Прямий шинний доступ</text>

  <!-- Interconnect Lines: Cores to Cache/MMU -->
  <line x1="225" y1="185" x2="280" y2="185" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="225" y1="290" x2="280" y2="290" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Panel 2: Cache Controller & MMU -->
  <rect x="280" y="90" width="340" height="370" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="280" y="90" width="340" height="40" rx="8" ry="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <rect x="280" y="118" width="340" height="12" fill="#eaf0fd"/>
  <text x="450" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Підсистема кЕШу та MMU</text>

  <!-- L1 Cache -->
  <rect x="295" y="145" width="310" height="75" rx="4" fill="white" stroke="#2457d6"/>
  <text x="450" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">L1 Cache (32 КБ I-Cache / 32 КБ D-Cache)</text>
  <text x="450" y="188" text-anchor="middle" font-size="12" fill="#6b7280">Кешування рядків по 64 байти · Тактування 240 МГц</text>
  <text x="450" y="206" text-anchor="middle" font-size="12" fill="#6b7280">Зменшення затримок вибірки при промахах</text>

  <!-- MMU Module -->
  <rect x="295" y="235" width="310" height="115" rx="4" fill="white" stroke="#1a1a1a"/>
  <text x="450" y="258" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Модуль MMU (Трансляція адрес)</text>
  <rect x="310" y="270" width="280" height="68" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="450" y="289" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Розмір сторінки адресації: 64 КБ</text>
  <text x="450" y="307" text-anchor="middle" font-size="12" fill="#6b7280">0x42000000 → Зовнішня Flash (I/D Bus)</text>
  <text x="450" y="325" text-anchor="middle" font-size="12" fill="#6b7280">0x3D000000 → Зовнішня PSRAM (D-Bus)</text>

  <!-- SPI Controller Arbiter -->
  <rect x="295" y="365" width="310" height="80" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-dasharray="4,4"/>
  <text x="450" y="388" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Арбітр та контролер шини MSPI</text>
  <text x="450" y="408" text-anchor="middle" font-size="12" fill="#1a1a1a">Керування часовими фазами та тактуванням</text>
  <text x="450" y="426" text-anchor="middle" font-size="12" fill="#6b7280">Синхронізація каналів Flash та PSRAM</text>

  <!-- Interconnect Lines: MMU/MSPI to External Memory -->
  <!-- QSPI Line -->
  <line x1="620" y1="210" x2="628" y2="210" stroke="#2457d6" stroke-width="2"/>
  <line x1="656" y1="210" x2="665" y2="210" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="628" y="196" width="28" height="28" rx="3" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="642" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">QSPI</text>

  <!-- OSPI Line -->
  <line x1="620" y1="372" x2="628" y2="372" stroke="#27ae60" stroke-width="3"/>
  <line x1="656" y1="372" x2="665" y2="372" stroke="#27ae60" stroke-width="3" marker-end="url(#arr-green)"/>
  <rect x="628" y="358" width="28" height="28" rx="3" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="642" y="376" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">OSPI</text>

  <!-- Panel 3: External Physical Memories -->
  <rect x="660" y="90" width="260" height="370" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="660" y="90" width="260" height="40" rx="8" ry="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <rect x="660" y="118" width="260" height="12" fill="#eaf0fd"/>
  <text x="790" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Чипи пам'яті ESP32-S3R2</text>

  <!-- 16 MB NOR Flash -->
  <rect x="675" y="150" width="230" height="120" rx="4" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="660" cy="210" r="5" fill="#2457d6"/>
  <text x="790" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">16 МБ NOR Flash</text>
  <text x="790" y="197" text-anchor="middle" font-size="12" fill="#1a1a1a">Шина: Quad SPI (QSPI)</text>
  <text x="790" y="217" text-anchor="middle" font-size="12" fill="#6b7280">4 лінії даних (SDR) · 80 МГц</text>
  <text x="790" y="237" text-anchor="middle" font-size="12" fill="#6b7280">Код програми та прошивка</text>

  <!-- 2 MB PSRAM (SiP) -->
  <rect x="675" y="300" width="230" height="145" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="660" cy="372" r="5" fill="#27ae60"/>
  <text x="790" y="325" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">2 МБ PSRAM (SiP)</text>
  <text x="790" y="347" text-anchor="middle" font-size="12" fill="#1a1a1a">Шина: Octal SPI (OSPI DDR)</text>
  <text x="790" y="367" text-anchor="middle" font-size="12" fill="#6b7280">8 ліній даних (DDR) · 80 МГц</text>
  <text x="790" y="387" text-anchor="middle" font-size="12" fill="#27ae60">Внутрішнє SiP-розварювання</text>
  <text x="790" y="407" text-anchor="middle" font-size="12" fill="#6b7280">Кадрові буфери та нейромережі</text>

  <!-- Bottom Legend / Banner -->
  <rect x="40" y="480" width="880" height="30" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="55" y="499" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">Адресна маршрутизація:</text>
  <text x="215" y="499" text-anchor="start" font-size="12" fill="#6b7280">MMU прозоро транслює 64 КБ сторінки у фізичну Flash (до 16 МБ) та SiP PSRAM (2 МБ на швидкості 160 МБ/с)</text>
</svg>
