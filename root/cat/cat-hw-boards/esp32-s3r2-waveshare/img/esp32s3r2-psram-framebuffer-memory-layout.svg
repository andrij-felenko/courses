<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs>
<marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
</marker>
</defs>
<rect x="0" y="0" width="960" height="480" fill="white"/>
<text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розподіл пам'яті PSRAM під кадрові буфери</text>
<text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Структура розміщення піксельних даних та вирівнювання</text>

<!-- Single Buffer -->
<rect x="180" y="120" width="280" height="260" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
<text x="320" y="150" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Одиночний буфер</text>

<rect x="200" y="180" width="240" height="60" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
<text x="320" y="215" font-size="13" fill="#1a1a1a" text-anchor="middle">Frame Buffer (RGB565)</text>

<rect x="200" y="260" width="240" height="60" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="320" y="295" font-size="13" fill="#1a1a1a" text-anchor="middle">Вирівнювання (Padding)</text>


<!-- Double Buffer -->
<rect x="500" y="120" width="280" height="260" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
<text x="640" y="150" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Подвійний буфер</text>

<rect x="520" y="180" width="240" height="60" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
<text x="640" y="215" font-size="13" fill="#1a1a1a" text-anchor="middle">Front Buffer (RGB888)</text>

<rect x="520" y="260" width="240" height="60" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
<text x="640" y="295" font-size="13" fill="#1a1a1a" text-anchor="middle">Back Buffer (RGB888)</text>

</svg>