<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="480" fill="white"/>
  
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Підсистема живлення LDO 3.3 В та роз'єму USB Type-C плати ESP32-S3R2</text>
  <text x="480" y="50" font-size="13" text-anchor="middle" fill="#6b7280">Схемотехніка LDO-стабілізатора 5V→3.3V, підтяжки CC1/CC2 (5.1 kΩ) та нативного USB (GPIO19/GPIO20)</text>

  <!-- Block 1: USB Type-C Connector (x: 30..250) -->
  <rect x="30" y="70" width="220" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="30" y="70" width="220" height="32" rx="8" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="140" y="91" font-size="14" font-weight="bold" text-anchor="middle" fill="#2457d6">USB Type-C Connector</text>

  <!-- USB Pins Labels (placed at y-10 above lines) -->
  <text x="45" y="122" font-size="12" font-weight="bold" fill="#c0392b">VBUS (5V)</text>
  <text x="45" y="192" font-size="12" fill="#1a1a1a">CC1 (A5)</text>
  <text x="45" y="252" font-size="12" fill="#1a1a1a">CC2 (B5)</text>
  <text x="45" y="312" font-size="12" fill="#2457d6">D- (DN / A7)</text>
  <text x="45" y="352" font-size="12" fill="#2457d6">D+ (DP / A6)</text>

  <!-- CC Pull-Down Resistors (line at x=170) -->
  <!-- CC1 Trace & R1 -->
  <line x1="110" y1="200" x2="170" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="170" y1="200" x2="170" y2="210" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="160" y="210" width="20" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="188" y="226" font-size="12" fill="#1a1a1a">R1 5.1k</text>
  <line x1="170" y1="234" x2="170" y2="420" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- CC2 Trace & R2 -->
  <line x1="110" y1="260" x2="170" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="170" y1="260" x2="170" y2="270" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="160" y="270" width="20" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="188" y="286" font-size="12" fill="#1a1a1a">R2 5.1k</text>
  <line x1="170" y1="294" x2="170" y2="420" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Block 2: Power & LDO 3.3V Subsystem (x: 270..670) -->
  <rect x="270" y="70" width="400" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="270" y="70" width="400" height="32" rx="8" fill="#e9f7ef" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="470" y="91" font-size="14" font-weight="bold" text-anchor="middle" fill="#27ae60">Підсистема живлення (LDO 3.3 В Regulator)</text>

  <!-- VBUS Input & SS14 Diode -->
  <line x1="120" y1="130" x2="285" y2="130" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <rect x="290" y="118" width="46" height="24" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="313" y="134" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">SS14</text>
  <line x1="336" y1="130" x2="350" y2="130" stroke="#c0392b" stroke-width="2.5"/>

  <!-- VBUS Node & Input Capacitors C1, C2 at x=350 -->
  <line x1="350" y1="130" x2="440" y2="130" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <line x1="350" y1="130" x2="350" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  
  <rect x="340" y="160" width="20" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="330" y="176" font-size="12" text-anchor="end" fill="#1a1a1a">C1 10µF</text>
  
  <line x1="350" y1="184" x2="350" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="340" y="230" width="20" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="330" y="246" font-size="12" text-anchor="end" fill="#1a1a1a">C2 0.1µF</text>
  <line x1="350" y1="254" x2="350" y2="420" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- LDO IC Box (ME6211) (x: 440..540) -->
  <rect x="440" y="115" width="100" height="90" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
  <text x="490" y="136" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">LDO REG</text>
  <text x="490" y="153" font-size="12" text-anchor="middle" fill="#6b7280">ME6211 3.3V</text>

  <!-- LDO Pins -->
  <text x="448" y="134" font-size="12" font-weight="bold" fill="#c0392b">VIN</text>
  <line x1="410" y1="130" x2="410" y2="175" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="410" y1="175" x2="440" y2="175" stroke="#c0392b" stroke-width="1.5"/>
  <text x="448" y="179" font-size="12" fill="#c0392b">EN</text>

  <text x="532" y="134" font-size="12" font-weight="bold" text-anchor="end" fill="#27ae60">VOUT</text>
  <text x="490" y="195" font-size="12" text-anchor="middle" fill="#6b7280">GND</text>
  <line x1="490" y1="205" x2="490" y2="420" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Output 3.3V Line & Capacitors C3, C4 at x=590 -->
  <line x1="540" y1="130" x2="590" y2="130" stroke="#27ae60" stroke-width="2.5"/>
  <line x1="590" y1="130" x2="690" y2="130" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  
  <line x1="590" y1="130" x2="590" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="580" y="160" width="20" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="605" y="176" font-size="12" text-anchor="start" fill="#1a1a1a">C3 10µF</text>

  <line x1="590" y1="184" x2="590" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="580" y="230" width="20" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="605" y="246" font-size="12" text-anchor="start" fill="#1a1a1a">C4 0.1µF</text>
  <line x1="590" y1="254" x2="590" y2="420" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Data Lines (D- / D+) Routing across Middle Panel -->
  <line x1="120" y1="320" x2="690" y2="320" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="470" y="310" font-size="12" text-anchor="middle" fill="#2457d6">USB D- Signal (USB CDC / JTAG)</text>

  <line x1="120" y1="360" x2="690" y2="360" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="470" y="378" font-size="12" text-anchor="middle" fill="#2457d6">USB D+ Signal (USB CDC / JTAG)</text>

  <!-- Block 3: ESP32-S3 Microcontroller (x: 690..930) -->
  <rect x="690" y="70" width="240" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="690" y="70" width="240" height="32" rx="8" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="810" y="91" font-size="14" font-weight="bold" text-anchor="middle" fill="#2457d6">ESP32-S3 MCU / Module</text>

  <!-- MCU Pin Connections -->
  <text x="705" y="122" font-size="12" font-weight="bold" fill="#27ae60">VDD33 (3.3V)</text>

  <!-- Reset Circuit on EN Pin -->
  <line x1="650" y1="130" x2="650" y2="200" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="650" y1="200" x2="810" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
  
  <!-- R3 Pull-up to 3.3V -->
  <rect x="800" y="150" width="20" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="825" y="166" font-size="12" text-anchor="start" fill="#1a1a1a">R3 10k</text>
  <line x1="810" y1="130" x2="810" y2="150" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="810" y1="174" x2="810" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
  
  <!-- EN Pin Label -->
  <text x="705" y="192" font-size="12" font-weight="bold" fill="#1a1a1a">EN / CHIP_PU</text>

  <!-- C5 Capacitor to GND -->
  <line x1="810" y1="200" x2="810" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="800" y="230" width="20" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="825" y="246" font-size="12" text-anchor="start" fill="#1a1a1a">C5 1µF</text>
  <line x1="810" y1="254" x2="810" y2="420" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- GPIO Pins -->
  <text x="705" y="312" font-size="12" font-weight="bold" fill="#2457d6">GPIO19 (USB D-)</text>
  <text x="705" y="352" font-size="12" font-weight="bold" fill="#2457d6">GPIO20 (USB D+)</text>
  <text x="705" y="402" font-size="12" font-weight="bold" fill="#6b7280">GND</text>

  <!-- Common GND Rail -->
  <line x1="50" y1="420" x2="910" y2="420" stroke="#6b7280" stroke-width="2.5"/>
  <text x="480" y="442" font-size="12" font-weight="bold" text-anchor="middle" fill="#6b7280">Спільна шина заземлення (GND Rail)</text>

  <!-- Connection Nodes / Junction Circles -->
  <circle cx="350" cy="130" r="3.5" fill="#c0392b"/>
  <circle cx="410" cy="130" r="3.5" fill="#c0392b"/>
  <circle cx="590" cy="130" r="3.5" fill="#27ae60"/>
  <circle cx="650" cy="130" r="3.5" fill="#27ae60"/>
  <circle cx="810" cy="130" r="3.5" fill="#27ae60"/>
  <circle cx="810" cy="200" r="3.5" fill="#1a1a1a"/>

  <circle cx="170" cy="420" r="3.5" fill="#6b7280"/>
  <circle cx="350" cy="420" r="3.5" fill="#6b7280"/>
  <circle cx="490" cy="420" r="3.5" fill="#6b7280"/>
  <circle cx="590" cy="420" r="3.5" fill="#6b7280"/>
  <circle cx="810" cy="420" r="3.5" fill="#6b7280"/>
</svg>
