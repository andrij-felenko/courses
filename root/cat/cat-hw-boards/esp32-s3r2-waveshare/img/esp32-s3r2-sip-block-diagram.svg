<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background canvas -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Компонування SiP-корпусу ESP32-S3R2</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Інтеграція 2 МБ PSRAM та 16 МБ Flash у корпусі SiP зі зв'язком через шини QSPI/Octal SPI</text>

  <!-- Outer SiP Container Panel -->
  <rect x="30" y="80" width="900" height="415" rx="12" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="50" y="108" font-size="15" font-weight="bold" fill="#2457d6">Схема внутрішнього SiP-корпусу ESP32-S3R2</text>

  <!-- SoC Die Panel -->
  <rect x="50" y="125" width="460" height="355" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="280" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Кристал ESP32-S3 MCU (SoC Die)</text>

  <!-- CPU Box -->
  <rect x="70" y="170" width="200" height="95" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="170" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Двоядерний CPU</text>
  <text x="170" y="218" text-anchor="middle" font-size="12" fill="#1a1a1a">Xtensa 32-bit LX7</text>
  <text x="170" y="240" text-anchor="middle" font-size="12" fill="#6b7280">до 240 МГц + Vector</text>

  <!-- Cache / SRAM Box -->
  <rect x="290" y="170" width="200" height="95" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="390" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Кеш та SRAM</text>
  <text x="390" y="218" text-anchor="middle" font-size="12" fill="#1a1a1a">32 KB I/D-Cache</text>
  <text x="390" y="240" text-anchor="middle" font-size="12" fill="#6b7280">512 KB Internal SRAM</text>

  <!-- Internal Bus Connections to Memory Controller -->
  <path d="M170,265 L170,285" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <path d="M390,265 L390,285" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- Ext Memory Controller & MMU Box -->
  <rect x="70" y="285" width="420" height="85" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="280" y="310" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Контролер пам'яті MMU &amp; Cache</text>
  <text x="280" y="332" text-anchor="middle" font-size="12" fill="#27ae60">Трансляція адрес heap_caps / SPI DMA</text>
  <text x="280" y="352" text-anchor="middle" font-size="12" fill="#6b7280">Управління шинами SPI0 / SPI1</text>

  <!-- Peripherals & I/O Box -->
  <rect x="70" y="388" width="420" height="78" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="280" y="412" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Периферія та GPIO</text>
  <text x="280" y="434" text-anchor="middle" font-size="12" fill="#1a1a1a">USB CDC/JTAG · DVP / LCD_CAM</text>
  <text x="280" y="454" text-anchor="middle" font-size="12" fill="#6b7280">Strapping Pins (GPIO0, GPIO45)</text>

  <!-- PSRAM Die Box -->
  <rect x="580" y="135" width="330" height="145" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="745" y="162" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Кристал PSRAM (2 МБ)</text>
  <text x="745" y="186" text-anchor="middle" font-size="12" fill="#1a1a1a">Внутрішньокорпусна PSRAM</text>
  <text x="745" y="208" text-anchor="middle" font-size="12" fill="#2457d6">Шина QSPI (Quad SPI 3.3V)</text>
  <text x="745" y="230" text-anchor="middle" font-size="12" fill="#6b7280">Кадрові буфери та Edge AI</text>
  <text x="745" y="252" text-anchor="middle" font-size="12" fill="#6b7280">Сигнальний вивід CS (GPIO6)</text>

  <!-- Flash Die Box -->
  <rect x="580" y="305" width="330" height="145" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="745" y="332" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Кристал Flash (16 МБ)</text>
  <text x="745" y="356" text-anchor="middle" font-size="12" fill="#1a1a1a">Зовнішня флеш-пам'ять QSPI</text>
  <text x="745" y="378" text-anchor="middle" font-size="12" fill="#27ae60">Високошвидкісний доступ QSPI</text>
  <text x="745" y="400" text-anchor="middle" font-size="12" fill="#6b7280">Прошивка, NVS та файлова система</text>
  <text x="745" y="422" text-anchor="middle" font-size="12" fill="#6b7280">Лінії SPI_CS0, SPI_CLK, SPI_D0..D3</text>

  <!-- Buses interconnecting SoC and Memory Dies -->
  <!-- PSRAM Bus -->
  <path d="M490,315 L545,315 L545,208 L580,208" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="545" y="195" text-anchor="middle" font-size="12" fill="#2457d6">Шина QSPI PSRAM</text>

  <!-- Flash Bus -->
  <path d="M490,340 L545,340 L545,378 L580,378" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="545" y="398" text-anchor="middle" font-size="12" fill="#27ae60">Шина QSPI Flash</text>

</svg>
