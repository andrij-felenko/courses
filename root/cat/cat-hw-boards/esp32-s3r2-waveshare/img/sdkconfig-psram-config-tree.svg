<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs>
<marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
</marker>
</defs>
<rect x="0" y="0" width="960" height="480" fill="white"/>
<text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Конфігураційне дерево sdkconfig для PSRAM</text>
<text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Вибір 4-бітного режиму Quad SPI на частоті 80 МГц та стратегії розподілу зовнішньої купи</text>

<!-- Main Node -->
<rect x="360" y="100" width="240" height="40" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
<text x="480" y="125" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Component config</text>
<path d="M 480 140 L 480 170" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

<!-- Sub Node -->
<rect x="360" y="170" width="240" height="40" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
<text x="480" y="195" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">ESP32-specific</text>
<path d="M 480 210 L 480 240" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

<!-- Enable PSRAM -->
<rect x="360" y="240" width="240" height="40" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
<text x="480" y="265" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Support for external, SPI-connected RAM</text>
<path d="M 480 280 L 480 310" fill="none" stroke="#1a1a1a" stroke-width="2"/>

<!-- Branches -->
<path d="M 240 310 L 720 310" fill="none" stroke="#1a1a1a" stroke-width="2"/>

<!-- Branch 1 -->
<path d="M 240 310 L 240 340" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
<rect x="140" y="340" width="200" height="60" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="240" y="365" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">SPI RAM config</text>
<text x="240" y="385" font-size="12" fill="#6b7280" text-anchor="middle">Mode: Quad SPI (4-bit)</text>

<!-- Branch 2 -->
<path d="M 480 310 L 480 340" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
<rect x="380" y="340" width="200" height="60" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
<text x="480" y="365" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Set RAM clock speed</text>
<text x="480" y="385" font-size="12" fill="#6b7280" text-anchor="middle">Frequency: 80 MHz</text>

<!-- Branch 3 -->
<path d="M 720 310 L 720 340" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
<rect x="620" y="340" width="200" height="60" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
<text x="720" y="365" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Memory allocation</text>
<text x="720" y="385" font-size="12" fill="#6b7280" text-anchor="middle">Make RAM allocatable</text>

</svg>