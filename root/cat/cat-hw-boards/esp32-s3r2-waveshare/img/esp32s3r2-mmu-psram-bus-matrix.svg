<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Шинна матриця та блок MMU в ESP32-S3R2</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Відображення 16 МБ Flash та 2 МБ Quad SPI PSRAM у загальний адресовий простір ядер Xtensa LX7</text>

  <!-- Row 1: CPU Cores -->
  <!-- Core 0 (PRO CPU) -->
  <rect x="160" y="90" width="280" height="65" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="6"/>
  <text x="300" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Процесорне ядро Core 0 (PRO)</text>
  <text x="300" y="136" text-anchor="middle" font-size="12" fill="#1a1a1a">Xtensa LX7 (32-bit, 240 МГц)</text>

  <!-- Core 1 (APP CPU) -->
  <rect x="520" y="90" width="280" height="65" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="6"/>
  <text x="660" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Процесорне ядро Core 1 (APP)</text>
  <text x="660" y="136" text-anchor="middle" font-size="12" fill="#1a1a1a">Xtensa LX7 (32-bit, 240 МГц)</text>

  <!-- Bus Lines from CPU to Bus Matrix -->
  <line x1="300" y1="155" x2="300" y2="183" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="245" y="172" text-anchor="end" font-size="12" fill="#6b7280">IBus / DBus</text>

  <line x1="660" y1="155" x2="660" y2="183" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="715" y="172" text-anchor="start" font-size="12" fill="#6b7280">IBus / DBus</text>

  <!-- Row 2: Bus Matrix & MMU Container Subsystem -->
  <rect x="60" y="185" width="840" height="160" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="8"/>
  <text x="80" y="208" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">Внутрішня шинна матриця та підсистема пам'яті (Bus Matrix &amp; MMU)</text>

  <!-- Sub-block 1: Internal SRAM -->
  <rect x="85" y="225" width="220" height="105" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="195" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Внутрішня SRAM</text>
  <text x="195" y="270" text-anchor="middle" font-size="12" fill="#6b7280">512 КБ (SRAM0, 1, 2)</text>
  <text x="195" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Швидкий доступ (1 такт)</text>
  <text x="195" y="310" text-anchor="middle" font-size="12" fill="#1a1a1a">Стек, IRAM / DRAM</text>

  <!-- Connection SRAM to MMU -->
  <line x1="305" y1="277" x2="328" y2="277" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Sub-block 2: MMU Controller -->
  <rect x="330" y="225" width="300" height="105" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="480" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Контролер MMU та кєш-пам'яті</text>
  <text x="480" y="270" text-anchor="middle" font-size="12" fill="#1a1a1a">Відображення сторінок (64 КБ)</text>
  <text x="480" y="290" text-anchor="middle" font-size="12" fill="#1a1a1a">Адреси Flash: 0x4200_0000</text>
  <text x="480" y="310" text-anchor="middle" font-size="12" fill="#1a1a1a">Адреси PSRAM: 0x3D00_0000</text>

  <!-- Connection MMU to Cache -->
  <line x1="630" y1="277" x2="653" y2="277" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Sub-block 3: Cache Controller -->
  <rect x="655" y="225" width="220" height="105" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="765" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">L1 Cache (32 КБ)</text>
  <text x="765" y="270" text-anchor="middle" font-size="12" fill="#6b7280">Буферизація читання/запису</text>
  <text x="765" y="290" text-anchor="middle" font-size="12" fill="#1a1a1a">Арбітраж шини SPI0/1</text>
  <text x="765" y="310" text-anchor="middle" font-size="12" fill="#2457d6">Автоматична підкачка</text>

  <!-- Bus Lines from MMU to External Memories -->
  <line x1="310" y1="345" x2="310" y2="383" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="290" y="368" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">Quad/Octal SPI</text>

  <line x1="650" y1="345" x2="650" y2="383" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="670" y="368" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">Quad SPI (80 МГц)</text>

  <!-- Row 3: External Memories -->
  <!-- 16 MB Flash -->
  <rect x="160" y="385" width="300" height="95" fill="#ffffff" stroke="#d0d7de" stroke-width="2" rx="6"/>
  <text x="310" y="408" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Зовнішня 16 МБ NOR Flash</text>
  <text x="310" y="428" text-anchor="middle" font-size="12" fill="#6b7280">Інтерфейс Quad SPI / Octal SPI</text>
  <text x="310" y="448" text-anchor="middle" font-size="12" fill="#1a1a1a">Збереження прошивки, NVS, FATFS</text>
  <text x="310" y="466" text-anchor="middle" font-size="12" fill="#6b7280">Читання через MMU кєш-пам'ять</text>

  <!-- 2 MB PSRAM (SiP) -->
  <rect x="500" y="385" width="300" height="95" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="6"/>
  <text x="650" y="408" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Зовнішня 2 МБ PSRAM (SiP)</text>
  <text x="650" y="428" text-anchor="middle" font-size="12" fill="#1a1a1a">Вбудований чип у корпус ESP32-S3R2</text>
  <text x="650" y="448" text-anchor="middle" font-size="12" fill="#1a1a1a">Кадрові буфери (FB), Edge AI, heap</text>
  <text x="650" y="466" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Виділення через heap_caps_malloc</text>

  <!-- Footer Note -->
  <text x="480" y="505" text-anchor="middle" font-size="12" fill="#6b7280">MMU транслює 64 КБ сторінки фізичної PSRAM та Flash у простір віртуальних адрес CPU без залучення процесів обробки</text>
</svg>
