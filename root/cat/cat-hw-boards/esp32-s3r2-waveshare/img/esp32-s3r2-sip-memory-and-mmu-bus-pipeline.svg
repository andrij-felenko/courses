<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-orange" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d35400"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Архітектура SiP-пам'яті та конвеєр адресації ESP32-S3R2</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Зв'язок ядер Xtensa LX7, L1-кешу та MMU з кристалами Flash і PSRAM усередині SiP-корпусу QFN-56</text>

  <!-- STAGE 1: CPU & Virtual Space -->
  <rect x="25" y="75" width="190" height="385" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="120" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Процесорне ядро</text>
  <text x="120" y="116" text-anchor="middle" font-size="12" fill="#6b7280">Xtensa LX7 (240 МГц)</text>

  <!-- Core Box -->
  <rect x="40" y="130" width="160" height="60" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="120" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Шина D-bus / I-bus</text>
  <text x="120" y="174" text-anchor="middle" font-size="12" fill="#6b7280">32-бітні адреси</text>

  <!-- Virtual Address Space Box -->
  <rect x="40" y="205" width="160" height="240" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="120" y="225" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Віртуальний простір</text>

  <rect x="48" y="238" width="144" height="42" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="120" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">SRAM (512 КБ)</text>
  <text x="120" y="271" text-anchor="middle" font-size="12" fill="#6b7280">0x3FC00000 (0 затримок)</text>

  <rect x="48" y="292" width="144" height="42" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="120" y="309" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">PSRAM Вікно</text>
  <text x="120" y="325" text-anchor="middle" font-size="12" fill="#6b7280">0x3F800000 (2 МБ)</text>

  <rect x="48" y="346" width="144" height="88" fill="#fef9e7" stroke="#f39c12" stroke-width="1" rx="4"/>
  <text x="120" y="366" text-anchor="middle" font-size="12" font-weight="bold" fill="#d35400">Flash Вікно</text>
  <text x="120" y="384" text-anchor="middle" font-size="12" fill="#6b7280">0x42000000 (16 МБ)</text>
  <text x="120" y="402" text-anchor="middle" font-size="12" fill="#6b7280">Код та константи</text>
  <text x="120" y="420" text-anchor="middle" font-size="12" fill="#6b7280">Мапування сторінок</text>

  <!-- STAGE 2: L1 Cache & MMU -->
  <rect x="235" y="75" width="245" height="385" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="357" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Кеш L1 та арбітр MMU</text>
  <text x="357" y="116" text-anchor="middle" font-size="12" fill="#6b7280">Апаратна адресація</text>

  <!-- L1 Cache -->
  <rect x="250" y="130" width="215" height="110" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="357" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Кеш L1 Даних (32 КБ)</text>
  <text x="357" y="172" text-anchor="middle" font-size="12" fill="#1a1a1a">Hit: 1–2 такти | Miss: refill 32 B</text>
  <text x="357" y="192" text-anchor="middle" font-size="12" fill="#c0392b">Write-back dirty lines</text>
  <text x="357" y="212" text-anchor="middle" font-size="12" fill="#6b7280">Буферизація затримок SPI</text>

  <!-- MMU Block -->
  <rect x="250" y="255" width="215" height="190" fill="#ffffff" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="357" y="277" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Блок трансляції MMU</text>
  <text x="357" y="295" text-anchor="middle" font-size="12" fill="#1a1a1a">Таблиця 64 КБ сторінок</text>

  <rect x="260" y="308" width="195" height="36" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="357" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Вірт. сторінка → PSRAM</text>
  <text x="357" y="338" text-anchor="middle" font-size="12" fill="#6b7280">Фізичний блок 2 МБ</text>

  <rect x="260" y="352" width="195" height="36" fill="#fef9e7" stroke="#f39c12" stroke-width="1" rx="4"/>
  <text x="357" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#d35400">Вірт. сторінка → Flash</text>
  <text x="357" y="382" text-anchor="middle" font-size="12" fill="#6b7280">Фізичний блок 16 МБ</text>

  <text x="357" y="412" text-anchor="middle" font-size="12" fill="#6b7280">Прозора генерація шинних адрес</text>
  <text x="357" y="430" text-anchor="middle" font-size="12" fill="#6b7280">Трансляція в реальному часі</text>

  <!-- STAGE 3: SPI Controller & Bonding Info -->
  <rect x="500" y="75" width="200" height="385" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="600" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Контролер шин</text>
  <text x="600" y="116" text-anchor="middle" font-size="12" fill="#6b7280">Тактування й арбітраж</text>

  <rect x="515" y="130" width="170" height="120" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="600" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Контролер SPI1 / SPI0</text>
  <text x="600" y="172" text-anchor="middle" font-size="12" fill="#27ae60">Octal DDR 80/120 МГц</text>
  <text x="600" y="192" text-anchor="middle" font-size="12" fill="#1a1a1a">8-біт шина (PSRAM)</text>
  <text x="600" y="212" text-anchor="middle" font-size="12" fill="#d35400">4-біт Quad SPI (Flash)</text>
  <text x="600" y="232" text-anchor="middle" font-size="12" fill="#6b7280">Арбітраж пріоритетів</text>

  <rect x="515" y="265" width="170" height="180" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="6"/>
  <text x="600" y="287" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">SiP Wire Bonding</text>
  <text x="600" y="307" text-anchor="middle" font-size="12" fill="#1a1a1a">Золоті мікродроти</text>
  <text x="600" y="327" text-anchor="middle" font-size="12" fill="#27ae60">Довжина: 1–2 мм</text>
  <text x="600" y="347" text-anchor="middle" font-size="12" fill="#27ae60">Ємність: &lt; 1 пФ</text>
  <text x="600" y="367" text-anchor="middle" font-size="12" fill="#1a1a1a">Без зсуву фаз</text>
  <text x="600" y="387" text-anchor="middle" font-size="12" fill="#27ae60">Вільні лінії GPIO</text>
  <text x="600" y="407" text-anchor="middle" font-size="12" fill="#6b7280">Термостійке розварювання</text>

  <!-- STAGE 4: Physical SiP Package QFN-56 -->
  <rect x="720" y="75" width="215" height="385" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="827" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Корпус QFN-56 (SiP)</text>
  <text x="827" y="116" text-anchor="middle" font-size="12" fill="#6b7280">Кристали в 1 упаковці</text>

  <!-- SoC Die -->
  <rect x="735" y="130" width="185" height="85" fill="#ffffff" stroke="#2457d6" stroke-width="2" rx="6"/>
  <text x="827" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Кристал ESP32-S3 SoC</text>
  <text x="827" y="175" text-anchor="middle" font-size="12" fill="#1a1a1a">Ядра + L1-кеш + MMU</text>
  <text x="827" y="195" text-anchor="middle" font-size="12" fill="#6b7280">Кремнієва підкладка</text>

  <!-- PSRAM Die -->
  <rect x="735" y="235" width="185" height="90" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="827" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Кристал PSRAM (2 МБ)</text>
  <text x="827" y="280" text-anchor="middle" font-size="12" fill="#1a1a1a">Окремий чип пам'яті</text>
  <text x="827" y="300" text-anchor="middle" font-size="12" fill="#27ae60">Octal SPI (8-біт)</text>

  <!-- Flash Die -->
  <rect x="735" y="345" width="185" height="100" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5" rx="6"/>
  <text x="827" y="370" text-anchor="middle" font-size="13" font-weight="bold" fill="#d35400">Кристал Flash (16 МБ)</text>
  <text x="827" y="390" text-anchor="middle" font-size="12" fill="#1a1a1a">Енергонезалежна пам'ять</text>
  <text x="827" y="410" text-anchor="middle" font-size="12" fill="#d35400">Quad SPI (4-біт)</text>
  <text x="827" y="430" text-anchor="middle" font-size="12" fill="#6b7280">Збереження образу прошивки</text>

  <!-- ARROWS & CONNECTORS -->
  <!-- CPU to L1 Cache -->
  <line x1="200" y1="160" x2="250" y2="160" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- L1 Cache to MMU -->
  <line x1="357" y1="240" x2="357" y2="255" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- MMU to SPI Controller -->
  <line x1="465" y1="320" x2="515" y2="190" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- SPI Controller to PSRAM Die -->
  <line x1="685" y1="180" x2="735" y2="270" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- SPI Controller to Flash Die -->
  <line x1="685" y1="210" x2="735" y2="380" stroke="#d35400" stroke-width="2" marker-end="url(#arr-orange)"/>

  <!-- Bottom Banner / Conclusion -->
  <rect x="25" y="472" width="910" height="36" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="6"/>
  <text x="480" y="494" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Результат: Інтеграція кристалів у SiP скоротила зв'язки до 1–2 мм, усунула фазовий зсув на 120 МГц та вивільнила виводи GPIO</text>

</svg>
