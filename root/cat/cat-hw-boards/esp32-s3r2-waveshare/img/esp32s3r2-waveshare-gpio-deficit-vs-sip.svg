<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Canvas background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subheader -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Порівняння розведення PSRAM: Дискретні шини vs SiP-компонування ESP32-S3R2</text>
  <text x="480" y="62" text-anchor="middle" font-size="13" fill="#6b7280">Інтеграція 2 МБ PSRAM безпосередньо у корпус SiP усуває дефіцит GPIO та звільняє виводи для периферії</text>

  <!-- LEFT PANEL: Problem (Discrete PSRAM) -->
  <rect x="40" y="95" width="425" height="290" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="252" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">Класичне дискретне підключення PSRAM</text>

  <!-- MCU Discrete Box -->
  <rect x="55" y="140" width="150" height="225" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="130" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">ESP32-S3 SoC</text>
  <text x="130" y="185" text-anchor="middle" font-size="11" fill="#6b7280">Ядра Xtensa LX7</text>
  <text x="130" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Контролер SPI</text>
  <line x1="65" y1="217" x2="195" y2="217" stroke="#e5e7eb" stroke-width="1"/>
  <text x="130" y="235" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">GPIO33–GPIO37</text>
  <text x="130" y="253" text-anchor="middle" font-size="10" fill="#c0392b">Зайняті шиною PSRAM</text>
  <text x="130" y="275" text-anchor="middle" font-size="11" fill="#6b7280">GPIO27–GPIO32</text>
  <text x="130" y="293" text-anchor="middle" font-size="10" fill="#6b7280">Зайняті шиною Flash</text>
  <line x1="65" y1="307" x2="195" y2="307" stroke="#e5e7eb" stroke-width="1"/>
  <text x="130" y="325" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Вільні GPIO: ДЕФІЦИТ</text>
  <text x="130" y="345" text-anchor="middle" font-size="10" fill="#6b7280">Брак ніжок периферії</text>

  <!-- Arrow MCU to External PSRAM -->
  <path d="M205,185 L278,185" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="242" y="172" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">Шина SPI</text>
  <text x="242" y="202" text-anchor="middle" font-size="10" fill="#6b7280">6 ліній</text>

  <!-- External PSRAM Chip Box -->
  <rect x="280" y="140" width="170" height="95" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="365" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Зовнішня PSRAM</text>
  <text x="365" y="188" text-anchor="middle" font-size="11" fill="#6b7280">Дискретний чип RAM</text>
  <text x="365" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Займає 6 виводів GPIO</text>

  <!-- Problem Warning Box -->
  <rect x="280" y="250" width="170" height="115" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="365" y="275" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Конфлікт виводів!</text>
  <text x="365" y="297" text-anchor="middle" font-size="11" fill="#1a1a1a">Неможливо підключити</text>
  <text x="365" y="317" text-anchor="middle" font-size="11" fill="#1a1a1a">камеру та дисплей</text>
  <text x="365" y="342" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">через дефіцит GPIO</text>

  <!-- RIGHT PANEL: Solution (SiP ESP32-S3R2) -->
  <rect x="495" y="95" width="425" height="290" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="707" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">SiP-корпус чипа ESP32-S3R2 (Waveshare)</text>

  <!-- Single SiP Package Box -->
  <rect x="510" y="140" width="225" height="225" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="622" y="165" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Корпус SiP ESP32-S3R2</text>

  <!-- Sub-box 1: SoC Die -->
  <rect x="525" y="180" width="195" height="55" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="622" y="202" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Кристал ESP32-S3 SoC</text>
  <text x="622" y="222" text-anchor="middle" font-size="10" fill="#6b7280">Ядра LX7 + Контролер RAM</text>

  <!-- Interposer connection line inside SiP -->
  <path d="M622,235 L622,258" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="630" y="252" text-anchor="start" font-size="10" font-weight="bold" fill="#27ae60">Інтерпозер</text>

  <!-- Sub-box 2: PSRAM Die -->
  <rect x="525" y="260" width="195" height="55" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="622" y="282" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Кристал 2 МБ PSRAM</text>
  <text x="622" y="302" text-anchor="middle" font-size="10" fill="#6b7280">З'єднано всередині SiP</text>

  <text x="622" y="345" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Жодних зовнішніх шин на GPIO!</text>

  <!-- Arrow SiP Package to Free GPIOs -->
  <path d="M735,250 L748,250" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Free GPIOs Box -->
  <rect x="750" y="140" width="155" height="225" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="827" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Вільні GPIO плати</text>
  <text x="827" y="188" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">GPIO33–GPIO37</text>
  <text x="827" y="208" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">ПОВНІСТЮ ВІЛЬНІ!</text>
  <line x1="765" y1="220" x2="890" y2="220" stroke="#e5e7eb" stroke-width="1"/>
  <text x="827" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Можливості плати:</text>
  <text x="827" y="262" text-anchor="middle" font-size="11" fill="#1a1a1a">• Камера DVP (OV2640)</text>
  <text x="827" y="282" text-anchor="middle" font-size="11" fill="#1a1a1a">• Дисплей ST7789</text>
  <text x="827" y="302" text-anchor="middle" font-size="11" fill="#1a1a1a">• SD-карта &amp; I2C</text>
  <text x="827" y="338" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Повний ресурс GPIO!</text>

  <!-- Bottom Summary Panel -->
  <rect x="40" y="402" width="880" height="36" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="424" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Висновок: SiP-технологія в ESP32-S3R2 вивільняє лінії GPIO33–GPIO37, дозволяючи одночасно підключати PSRAM, камеру та дисплей</text>
</svg>
