<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs>
<marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
</marker>
</defs>
<rect x="0" y="0" width="960" height="480" fill="white"/>
<text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Карта розпіновки плати Waveshare ESP32-S3R2</text>
<text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Виділення виводів шини Quad SPI та вільних GPIO</text>

<rect x="360" y="100" width="240" height="300" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
<text x="480" y="130" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ESP32-S3R2 SiP</text>

<rect x="380" y="160" width="200" height="80" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
<text x="480" y="195" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Внутрішня Quad SPI</text>
<text x="480" y="215" font-size="12" fill="#6b7280" text-anchor="middle">Flash та PSRAM (Приховані)</text>

<rect x="380" y="260" width="200" height="120" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
<text x="480" y="295" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вільні GPIO</text>
<text x="480" y="315" font-size="12" fill="#6b7280" text-anchor="middle">Доступні на контактах</text>
<text x="480" y="335" font-size="12" fill="#1a1a1a" text-anchor="middle">GPIO1 - GPIO21</text>
<text x="480" y="355" font-size="12" fill="#1a1a1a" text-anchor="middle">GPIO35 - GPIO48</text>

<!-- Left Pins -->
<path d="M 360 280 L 300 280" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr)"/>
<text x="240" y="285" font-size="13" fill="#1a1a1a" text-anchor="middle">GPIO (Лівий ряд)</text>

<!-- Right Pins -->
<path d="M 600 280 L 660 280" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr)"/>
<text x="720" y="285" font-size="13" fill="#1a1a1a" text-anchor="middle">GPIO (Правий ряд)</text>

</svg>