<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Header -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Архітектура шин Quad SPI та Octal SPI у складі ESP32-S3R2 SiP</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Розподіл сигнальних ліній між внутрішнім контролером пам'яті, Flash (16 МБ) та PSRAM (2 МБ)</text>

  <!-- Outer SiP Boundary Panel -->
  <rect x="40" y="75" width="880" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="60" y="100" font-size="13" font-weight="bold" fill="#6b7280">Корпус ESP32-S3R2 (System-in-Package / SiP)</text>

  <!-- Memory Controller Subsystem (Left Panel) -->
  <rect x="70" y="120" width="240" height="290" rx="6" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="70" y="120" width="240" height="35" fill="#eaf0fd"/>
  <text x="190" y="143" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Контролер пам'яті SPI0 / SPI1</text>

  <!-- CPU Sub-block -->
  <rect x="85" y="170" width="210" height="60" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="190" y="193" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Xtensa LX7 (Двоядерний ЦПУ)</text>
  <text x="190" y="213" text-anchor="middle" font-size="12" fill="#6b7280">ICache (32 КБ) + DCache (32 КБ)</text>

  <!-- Arbiter Sub-block -->
  <rect x="85" y="245" width="210" height="75" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="190" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Шинний арбітр SPI / DMA</text>
  <text x="190" y="288" text-anchor="middle" font-size="12" fill="#6b7280">Управління транзакціями MMU</text>
  <text x="190" y="306" text-anchor="middle" font-size="12" fill="#2457d6">Шина живлення VDD_SPI (3.3 В)</text>

  <!-- Strapping Note Sub-block -->
  <rect x="85" y="335" width="210" height="60" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="190" y="358" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Конфігурація VDD_SPI</text>
  <text x="190" y="378" text-anchor="middle" font-size="12" fill="#1a1a1a">GPIO45 = 0 → Режим 3.3 В Flash/PSRAM</text>

  <!-- Quad SPI Bus Line to Flash -->
  <path d="M 310 160 L 640 160" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>
  <rect x="360" y="135" width="230" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="475" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Шина Quad SPI (4 біти даних)</text>
  <text x="475" y="169" text-anchor="middle" font-size="11" fill="#1a1a1a">CS0#, SCLK, SD0, SD1, SD2, SD3</text>

  <!-- VDD_SPI Protection Warning Box -->
  <rect x="375" y="200" width="200" height="75" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="475" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Захист VDD_SPI (3.3 В)</text>
  <text x="475" y="238" text-anchor="middle" font-size="11" fill="#1a1a1a">Не допускати підтяжки GPIO45 до 1</text>
  <text x="475" y="255" text-anchor="middle" font-size="11" fill="#6b7280">Небезпека зниження VDD до 1.8 В!</text>

  <!-- Octal SPI Bus Line to PSRAM -->
  <path d="M 310 325 L 640 325" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>
  <rect x="360" y="300" width="230" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="475" y="317" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Шина Octal SPI (8 біт даних)</text>
  <text x="475" y="334" text-anchor="middle" font-size="11" fill="#1a1a1a">CS1#, SPICLK, D0–D7, DQS</text>

  <!-- 16 MB Flash Memory Panel (Top Right) -->
  <rect x="640" y="120" width="250" height="125" rx="6" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="640" y="120" width="250" height="32" fill="#eaf0fd"/>
  <text x="765" y="141" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Зовнішня Flash-пам'ять 16 МБ</text>

  <text x="655" y="175" font-size="12" font-weight="bold" fill="#1a1a1a">Інтерфейс:</text>
  <text x="730" y="175" font-size="12" fill="#6b7280">Quad SPI (4-бітна шина)</text>

  <text x="655" y="197" font-size="12" font-weight="bold" fill="#1a1a1a">Сигнали:</text>
  <text x="730" y="197" font-size="12" fill="#6b7280">CS0#, SCLK, SD0–SD3</text>

  <text x="655" y="219" font-size="12" font-weight="bold" fill="#1a1a1a">Макс. частота:</text>
  <text x="755" y="219" font-size="12" fill="#27ae60">80 МГц (Quad I/O)</text>

  <!-- 2 MB PSRAM Panel (Bottom Right) -->
  <rect x="640" y="285" width="250" height="125" rx="6" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="640" y="285" width="250" height="32" fill="#eaf0fd"/>
  <text x="765" y="306" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Інтегрована PSRAM 2 МБ (SiP)</text>

  <text x="655" y="340" font-size="12" font-weight="bold" fill="#1a1a1a">Інтерфейс:</text>
  <text x="730" y="340" font-size="12" fill="#6b7280">Octal SPI / OPI (8-бітна шина)</text>

  <text x="655" y="362" font-size="12" font-weight="bold" fill="#1a1a1a">Сигнали:</text>
  <text x="730" y="362" font-size="12" fill="#6b7280">CS1#, SPICLK, D0–D7, DQS</text>

  <text x="655" y="384" font-size="12" font-weight="bold" fill="#1a1a1a">Пропускність:</text>
  <text x="755" y="384" font-size="12" fill="#27ae60">до 80 МГц DDR (Octal)</text>
</svg>
