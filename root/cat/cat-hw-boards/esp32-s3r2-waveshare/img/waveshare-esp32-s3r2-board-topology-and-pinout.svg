<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Топологія плати Waveshare ESP32-S3R2 та розводка периферії</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">SiP-компонування з інтегрованою 2 МБ PSRAM вивільняє виводи GPIO та мінімізує паразитивні наведення</text>

  <!-- Left Panel: Features -->
  <rect x="30" y="75" width="260" height="415" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="8"/>
  <text x="160" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Особливості SiP ESP32-S3R2</text>

  <rect x="45" y="130" width="230" height="55" fill="#ffffff" stroke="#d0d7de" rx="6"/>
  <text x="160" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">2 МБ PSRAM в SiP</text>
  <text x="160" y="171" text-anchor="middle" font-size="12" fill="#6b7280">Вбудовано в QFN56</text>

  <rect x="45" y="195" width="230" height="55" fill="#ffffff" stroke="#d0d7de" rx="6"/>
  <text x="160" y="217" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Вільні виводи GPIO</text>
  <text x="160" y="236" text-anchor="middle" font-size="12" fill="#6b7280">GPIO33-37 без обмежень</text>

  <rect x="45" y="260" width="230" height="55" fill="#ffffff" stroke="#d0d7de" rx="6"/>
  <text x="160" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Без трас Octal SPI</text>
  <text x="160" y="301" text-anchor="middle" font-size="12" fill="#6b7280">Виключено паразитну ємність</text>

  <rect x="45" y="325" width="230" height="55" fill="#ffffff" stroke="#d0d7de" rx="6"/>
  <text x="160" y="347" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Висока завадостійкість</text>
  <text x="160" y="366" text-anchor="middle" font-size="12" fill="#6b7280">Компактний PCB монтаж</text>

  <rect x="45" y="390" width="230" height="75" fill="#ffffff" stroke="#d0d7de" rx="6"/>
  <text x="160" y="412" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">16 МБ External Flash</text>
  <text x="160" y="431" text-anchor="middle" font-size="12" fill="#6b7280">Quad SPI підключення</text>
  <text x="160" y="450" text-anchor="middle" font-size="12" fill="#6b7280">Висока швидкість читання</text>

  <!-- Center: Board Representation -->
  <rect x="315" y="75" width="330" height="415" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="10"/>
  <text x="480" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Waveshare ESP32-S3R2 Board</text>

  <!-- Top USB -->
  <rect x="420" y="112" width="120" height="28" fill="#e2e8f0" stroke="#64748b" rx="4"/>
  <text x="480" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">USB Type-C</text>

  <!-- LDO & Flash -->
  <rect x="330" y="152" width="135" height="50" fill="#ffffff" stroke="#94a3b8" rx="5"/>
  <text x="397" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">LDO 3.3V Reg</text>
  <text x="397" y="190" text-anchor="middle" font-size="12" fill="#6b7280">500 mA Output</text>

  <rect x="495" y="152" width="135" height="50" fill="#ffffff" stroke="#94a3b8" rx="5"/>
  <text x="562" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">16 МБ Flash</text>
  <text x="562" y="190" text-anchor="middle" font-size="12" fill="#6b7280">Quad SPI</text>

  <!-- SiP MCU Chip -->
  <rect x="350" y="215" width="260" height="165" fill="#1e293b" stroke="#0f172a" rx="8"/>
  <text x="480" y="240" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">ESP32-S3R2 (SiP QFN56)</text>
  <text x="480" y="258" text-anchor="middle" font-size="12" fill="#94a3b8">Xtensa Dual-Core LX7 @ 240 MHz</text>

  <!-- Embedded PSRAM -->
  <rect x="370" y="270" width="220" height="52" fill="#27ae60" rx="6"/>
  <text x="480" y="291" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2 МБ Embedded PSRAM</text>
  <text x="480" y="310" text-anchor="middle" font-size="12" fill="#e9f7ef">Інтегровано всередині корпусу SiP</text>

  <text x="480" y="342" text-anchor="middle" font-size="12" fill="#cbd5e1">2.4 GHz Wi-Fi (802.11 b/g/n) + BLE 5.0</text>
  <text x="480" y="362" text-anchor="middle" font-size="12" fill="#cbd5e1">Internal High-Speed Bus</text>

  <!-- Buttons & Antenna -->
  <rect x="330" y="398" width="135" height="48" fill="#ffffff" stroke="#94a3b8" rx="5"/>
  <text x="397" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">RST / BOOT</text>
  <text x="397" y="436" text-anchor="middle" font-size="12" fill="#6b7280">Тактові кнопки</text>

  <rect x="495" y="398" width="135" height="48" fill="#e2e8f0" stroke="#94a3b8" rx="5"/>
  <text x="562" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Antenna</text>
  <text x="562" y="436" text-anchor="middle" font-size="12" fill="#6b7280">2.4 GHz RF</text>

  <text x="480" y="472" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Компактний формфактор Waveshare</text>

  <!-- Connecting Lines -->
  <line x1="275" y1="157" x2="342" y2="280" stroke="#2457d6" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr-blue)"/>
  <line x1="610" y1="280" x2="677" y2="157" stroke="#27ae60" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr-green)"/>

  <!-- Right Panel: Pinout -->
  <rect x="670" y="75" width="260" height="415" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="8"/>
  <text x="800" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Розподіл периферії</text>

  <rect x="685" y="130" width="230" height="55" fill="#ffffff" stroke="#d0d7de" rx="6"/>
  <text x="800" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Сигнальні лінії GPIO</text>
  <text x="800" y="171" text-anchor="middle" font-size="12" fill="#6b7280">GPIO0-21, GPIO38-48</text>

  <rect x="685" y="195" width="230" height="55" fill="#ffffff" stroke="#d0d7de" rx="6"/>
  <text x="800" y="217" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Послідовні шини</text>
  <text x="800" y="236" text-anchor="middle" font-size="12" fill="#6b7280">I2C, SPI, UART, I2S</text>

  <rect x="685" y="260" width="230" height="55" fill="#ffffff" stroke="#d0d7de" rx="6"/>
  <text x="800" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">USB OTG / Serial</text>
  <text x="800" y="301" text-anchor="middle" font-size="12" fill="#6b7280">Пряме підключення D+ D-</text>

  <rect x="685" y="325" width="230" height="55" fill="#ffffff" stroke="#d0d7de" rx="6"/>
  <text x="800" y="347" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Аналогові входи</text>
  <text x="800" y="366" text-anchor="middle" font-size="12" fill="#6b7280">ADC1 та ADC2 канали</text>

  <rect x="685" y="390" width="230" height="75" fill="#ffffff" stroke="#d0d7de" rx="6"/>
  <text x="800" y="412" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Живлення плати</text>
  <text x="800" y="431" text-anchor="middle" font-size="12" fill="#6b7280">Вхід 5V USB / VBUS</text>
  <text x="800" y="450" text-anchor="middle" font-size="12" fill="#6b7280">Стабілізований вихід 3.3V</text>
</svg>
