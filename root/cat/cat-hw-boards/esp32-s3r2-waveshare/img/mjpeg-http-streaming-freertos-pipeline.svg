<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>

  <!-- Title & Subtitle -->
  <text x="480" y="35" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма FreeRTOS-конвеєра MJPEG HTTP-трансляції</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Паралельна обробка кадрів у подвійному буфері PSRAM та асинхронна відправка пакетів без блокування DVP</text>

  <!-- Top Panel: Timing Tracks Diagram -->
  <rect x="30" y="90" width="900" height="260" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="480" y="115" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма виконання задач у часі (Ping-Pong Buffer Pipeline)</text>

  <!-- Dotted Time Grid Lines -->
  <line x1="250" y1="130" x2="250" y2="325" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="370" y1="130" x2="370" y2="325" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="490" y1="130" x2="490" y2="325" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="610" y1="130" x2="610" y2="325" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="730" y1="130" x2="730" y2="325" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="850" y1="130" x2="850" y2="325" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Time Axis Line -->
  <line x1="220" y1="325" x2="880" y2="325" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <text x="895" y="329" font-size="12" font-weight="bold" fill="#1a1a1a">Час (t)</text>

  <!-- Track 1: DVP DMA Capture -->
  <text x="40" y="157" font-size="12" font-weight="bold" fill="#2457d6">DVP Camera DMA</text>

  <rect x="250" y="140" width="120" height="25" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="310" y="157" font-size="12" fill="#2457d6" text-anchor="middle">Захоплення Кадру 0</text>

  <rect x="370" y="140" width="120" height="25" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="430" y="157" font-size="12" fill="#27ae60" text-anchor="middle">Захоплення Кадру 1</text>

  <rect x="490" y="140" width="120" height="25" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="550" y="157" font-size="12" fill="#2457d6" text-anchor="middle">Захоплення Кадру 2</text>

  <rect x="610" y="140" width="120" height="25" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="670" y="157" font-size="12" fill="#27ae60" text-anchor="middle">Захоплення Кадру 3</text>

  <!-- Track 2: PSRAM Double Buffer State -->
  <text x="40" y="207" font-size="12" font-weight="bold" fill="#1a1a1a">Буфери PSRAM</text>

  <rect x="250" y="190" width="120" height="25" fill="#ffffff" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="310" y="207" font-size="12" fill="#2457d6" text-anchor="middle">FB0: Запис DMA</text>

  <rect x="370" y="190" width="120" height="25" fill="#ffffff" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="430" y="207" font-size="12" fill="#27ae60" text-anchor="middle">FB1: Запис DMA</text>

  <rect x="490" y="190" width="120" height="25" fill="#ffffff" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="550" y="207" font-size="12" fill="#2457d6" text-anchor="middle">FB0: Запис DMA</text>

  <rect x="610" y="190" width="120" height="25" fill="#ffffff" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="670" y="207" font-size="12" fill="#27ae60" text-anchor="middle">FB1: Запис DMA</text>

  <!-- Track 3: FreeRTOS HTTP Task -->
  <text x="40" y="257" font-size="12" font-weight="bold" fill="#27ae60">HTTP Task (Core 1)</text>

  <text x="310" y="257" font-size="12" fill="#6b7280" text-anchor="middle">Очікування кадру...</text>

  <rect x="370" y="240" width="120" height="25" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="430" y="257" font-size="12" fill="#2457d6" text-anchor="middle">HTTP Push Кадр 0</text>

  <rect x="490" y="240" width="120" height="25" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="550" y="257" font-size="12" fill="#27ae60" text-anchor="middle">HTTP Push Кадр 1</text>

  <rect x="610" y="240" width="120" height="25" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="670" y="257" font-size="12" fill="#2457d6" text-anchor="middle">HTTP Push Кадр 2</text>

  <!-- Bottom Panel: Zero-Copy Data Pipeline Architecture -->
  <rect x="30" y="370" width="900" height="150" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="480" y="393" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Апаратний конвеєр передачі даних без подвійного копіювання (Zero-Copy)</text>

  <!-- Step 1: Camera Sensor -->
  <rect x="50" y="415" width="170" height="85" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="135" y="438" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Сенсор OV2640 / DVP</text>
  <text x="60" y="460" font-size="12" fill="#6b7280">Тактування PCLK/VSYNC</text>
  <text x="60" y="482" font-size="12" fill="#2457d6">Прямий DMA-канал</text>

  <line x1="220" y1="457" x2="260" y2="457" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Step 2: PSRAM Double Buffer -->
  <rect x="260" y="415" width="190" height="85" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="355" y="438" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Подвійний буфер PSRAM</text>
  <text x="270" y="460" font-size="12" fill="#1a1a1a">FB0 / FB1 в OPI PSRAM</text>
  <text x="270" y="482" font-size="12" fill="#27ae60">heap_caps_malloc()</text>

  <line x1="450" y1="457" x2="490" y2="457" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Step 3: FreeRTOS Queue -->
  <rect x="490" y="415" width="190" height="85" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="585" y="438" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Черга FreeRTOS</text>
  <text x="500" y="460" font-size="12" fill="#1a1a1a">Передача вказівників</text>
  <text x="500" y="482" font-size="12" fill="#27ae60">xQueueSend / Receive</text>

  <line x1="680" y1="457" x2="720" y2="457" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Step 4: HTTP MJPEG Streaming Server -->
  <rect x="720" y="415" width="190" height="85" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="815" y="438" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">HTTP MJPEG Сервер</text>
  <text x="730" y="460" font-size="12" fill="#1a1a1a">Multipart/x-mixed-replace</text>
  <text x="730" y="482" font-size="12" fill="#2457d6">Wi-Fi TCP Сокет</text>
</svg>
