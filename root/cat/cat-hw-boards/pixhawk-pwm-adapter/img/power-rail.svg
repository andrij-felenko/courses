<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Пастка живлення «+» рейки: коптеру не треба, літаку/роверу — обов'язково</text>
<rect x="50.0" y="66.0" width="400.0" height="320.0" rx="12" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="250.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Мультикоптер: рейку живити НЕ треба</text>
<text x="250.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">навантаження — лише ESC моторів</text>
<rect x="90.0" y="146.0" width="120.0" height="180.0" rx="8" fill="#fff8e6" stroke="#b8860b" stroke-width="1.8"/>
<text x="150.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a6d00" text-anchor="middle" font-weight="700">адаптер</text>
<text x="120.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">S</text>
<text x="146.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="172.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<rect x="280.0" y="162.0" width="140.0" height="66.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.6"/>
<text x="350.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">ESC</text>
<text x="350.0" y="206.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">живиться від</text>
<text x="350.0" y="220.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">батареї сам</text>
<line x1="210.0" y1="194.0" x2="280.0" y2="194.0" stroke="#6b7280" stroke-width="1.6"/>
<text x="245.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">сигнал + земля</text>
<text x="250.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">«+» рейка може лишатися ненапоєною —</text>
<text x="250.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">ESC бере струм з батареї, не з рейки</text>
<rect x="490.0" y="66.0" width="400.0" height="320.0" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="690.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Літак / ровер: рейку живити ТРЕБА</text>
<text x="690.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">серва тягнуть струм саме з «+» рейки</text>
<rect x="530.0" y="146.0" width="120.0" height="180.0" rx="8" fill="#fff8e6" stroke="#b8860b" stroke-width="1.8"/>
<text x="590.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8a6d00" text-anchor="middle" font-weight="700">адаптер</text>
<text x="560.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">S</text>
<text x="586.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="612.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<rect x="720.0" y="150.0" width="140.0" height="58.0" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.6"/>
<text x="790.0" y="176.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">серво</text>
<text x="790.0" y="194.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">їсть з рейки</text>
<line x1="650.0" y1="179.0" x2="720.0" y2="179.0" stroke="#2457d6" stroke-width="1.6"/>
<rect x="720.0" y="242.0" width="140.0" height="66.0" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="790.0" y="268.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">BEC / ESC-BEC</text>
<text x="790.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle">5 В на «+» і «−»</text>
<text x="790.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">(або 2S)</text>
<line x1="720.0" y1="275.0" x2="650.0" y2="275.0" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arrow)"/>
<text x="690.0" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">без окремого BEC серва не ворухнуться:</text>
<text x="690.0" y="376.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle">автопілот сигнал дає, а СИЛУ на «+» — ні</text>
<rect x="166.5" y="414.5" width="607.1" height="43.0" rx="6" fill="#fdf0e6" stroke="#c0392b" stroke-width="1.5"/><text x="470.0" y="433.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">золоте правило: автопілот кладе на «+» рейку лише слабку логічну напругу — керувати нею серва НЕ можна.</tspan><tspan x="470.0" dy="13.0">Коптеру байдуже (ESC силові самі), а от серва літака/ровера мовчатимуть, поки «+» рейку не напоїть BEC.</tspan></text>
</svg>