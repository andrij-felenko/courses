<text x="470.0" y="120.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">мова = C++ · середовище (IDE) · бібліотеки: digitalWrite(), analogRead(), Serial</text>
