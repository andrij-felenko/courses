<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 540" width="1020" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="1020" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="510" y="32" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Архітектура захоплення кадрів та кільцевих DMA-буферів esp_camera</text>
  <text x="510" y="54" font-size="13" text-anchor="middle" fill="#6b7280">Конфігурація camera_config_t розгортає кільцеві буфери в PSRAM для безперервного DMA-захоплення з OV3640</text>

  <!-- Panel 1: OV3640 -->
  <rect x="30" y="75" width="220" height="435" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="140" y="100" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1a1a">Сенсор OV3640 (2 МП)</text>

  <rect x="42" y="120" width="196" height="75" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="140" y="143" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">Матриця зображення</text>
  <text x="140" y="163" font-size="12" text-anchor="middle" fill="#6b7280">Обробка ISP / UXGA (2 МП)</text>
  <text x="140" y="181" font-size="12" text-anchor="middle" fill="#6b7280">Бінування, AEC, AGC, AWB</text>

  <rect x="42" y="208" width="196" height="92" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="140" y="230" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">Регістри sensor_t</text>
  <text x="140" y="249" font-size="12" text-anchor="middle" fill="#6b7280">Налаштування сенсора:</text>
  <text x="140" y="267" font-size="12" text-anchor="middle" fill="#6b7280">яскравість, контраст, гама,</text>
  <text x="140" y="285" font-size="12" text-anchor="middle" fill="#6b7280">експозиція та підсилення</text>

  <rect x="42" y="312" width="196" height="182" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="140" y="333" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">Інтерфейсні порти</text>

  <rect x="50" y="346" width="180" height="34" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="140" y="368" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">SCCB (SIOC, SIOD)</text>

  <rect x="50" y="390" width="180" height="34" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="140" y="412" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">XCLK Вхід</text>

  <rect x="50" y="434" width="180" height="48" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="140" y="453" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">DVP Паралельний вихід</text>
  <text x="140" y="471" font-size="12" text-anchor="middle" fill="#6b7280">PCLK, VSYNC, HREF, D[0..7]</text>

  <!-- Panel 2: ESP32 -->
  <rect x="280" y="75" width="360" height="435" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="460" y="100" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1a1a">Периферія та контролер ESP32</text>

  <rect x="292" y="120" width="336" height="85" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="460" y="140" font-size="13" font-weight="700" text-anchor="middle" fill="#2457d6">Конфігурація camera_config_t</text>
  <text x="306" y="159" font-size="12" fill="#1a1a1a">pixel_format = PIXFORMAT_JPEG | RGB565</text>
  <text x="306" y="176" font-size="12" fill="#1a1a1a">frame_size = FRAMESIZE_UXGA | xclk_freq_hz = 20MHz</text>
  <text x="306" y="193" font-size="12" fill="#1a1a1a">fb_count = 2 | fb_location = CAMERA_FB_IN_PSRAM</text>

  <rect x="292" y="235" width="156" height="68" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="370" y="255" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Контролер SCCB (I2C)</text>
  <text x="370" y="273" font-size="12" text-anchor="middle" fill="#6b7280">Читання / запис</text>
  <text x="370" y="290" font-size="12" text-anchor="middle" fill="#6b7280">регістрів sensor_t</text>

  <rect x="472" y="235" width="156" height="68" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="550" y="255" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Генератор XCLK (LEDC)</text>
  <text x="550" y="273" font-size="12" text-anchor="middle" fill="#6b7280">Тактування сенсора</text>
  <text x="550" y="290" font-size="12" text-anchor="middle" fill="#6b7280">10 / 20 МГц</text>

  <rect x="292" y="315" width="336" height="175" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="460" y="337" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">Інтерфейс I2S-CAM та DMA engine</text>

  <rect x="300" y="348" width="320" height="65" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="460" y="367" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Описувачі DMA (dma_descriptor_t)</text>
  <text x="460" y="385" font-size="12" text-anchor="middle" fill="#6b7280">Автоматична розбивка кадру на пакети</text>
  <text x="460" y="402" font-size="12" text-anchor="middle" fill="#6b7280">Перемикання ping-pong буферів</text>

  <rect x="300" y="423" width="320" height="57" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="460" y="443" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">Пряма передача даних у PSRAM</text>
  <text x="460" y="463" font-size="12" text-anchor="middle" fill="#6b7280">Перенесення кадрів без навантаження CPU</text>

  <!-- Panel 3: PSRAM -->
  <rect x="720" y="75" width="250" height="435" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="845" y="100" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1a1a">Зовнішня пам'ять PSRAM</text>

  <rect x="730" y="120" width="230" height="255" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="845" y="140" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">Кільцевий пул (fb_count = 2)</text>

  <rect x="738" y="152" width="214" height="62" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="845" y="172" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">FB 0: Запис DMA (Active)</text>
  <text x="845" y="190" font-size="12" text-anchor="middle" fill="#6b7280">camera_fb_t (заповнення)</text>
  <text x="845" y="206" font-size="12" text-anchor="middle" fill="#6b7280">buf, len, format, width, height</text>

  <rect x="738" y="222" width="214" height="62" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="845" y="242" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">FB 1: Готовий кадр (Ready)</text>
  <text x="845" y="260" font-size="12" text-anchor="middle" fill="#6b7280">Очікує esp_camera_fb_get()</text>
  <text x="845" y="276" font-size="12" text-anchor="middle" fill="#6b7280">Заблокований до повернення</text>

  <rect x="738" y="292" width="214" height="73" rx="5" fill="#f4f6f8" stroke="#d0d7de" stroke-dasharray="3 3"/>
  <text x="845" y="312" font-size="12" font-weight="700" text-anchor="middle" fill="#6b7280">FB 2: Вільний буфер</text>
  <text x="845" y="330" font-size="12" text-anchor="middle" fill="#6b7280">Повертається в пул через</text>
  <text x="845" y="348" font-size="12" text-anchor="middle" fill="#6b7280">esp_camera_fb_return()</text>

  <rect x="730" y="385" width="230" height="105" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="845" y="405" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Керування буферами в API</text>

  <rect x="738" y="415" width="214" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="845" y="435" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">esp_camera_fb_get()</text>

  <rect x="738" y="452" width="214" height="30" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="845" y="472" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">esp_camera_fb_return(fb)</text>

  <!-- Connections -->
  <path d="M 292,268 L 265,268 L 265,363 L 230,363" fill="none" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="277" y="258" font-size="11" fill="#6b7280" text-anchor="middle">SCCB</text>

  <path d="M 550,235 L 550,218 L 270,218 L 270,407 L 230,407" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-gray)"/>
  <text x="410" y="212" font-size="11" fill="#6b7280" text-anchor="middle">XCLK такт (20 МГц)</text>

  <path d="M 230,458 L 292,458" fill="none" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="261" y="446" font-size="11" font-weight="700" fill="#2457d6" text-anchor="middle">DVP Дані</text>

  <path d="M 640,452 L 665,452 L 665,183 L 738,183" fill="none" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="702" y="173" font-size="11" font-weight="700" fill="#2457d6" text-anchor="end">DMA потік</text>

  <path d="M 952,253 L 975,253 L 975,430 L 952,430" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="1005" y="340" font-size="11" font-weight="700" fill="#27ae60" text-anchor="end">fb_get()</text>

  <path d="M 738,467 L 695,467 L 695,328 L 738,328" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-gray)"/>
  <text x="688" y="395" font-size="11" fill="#6b7280" text-anchor="end">fb_return()</text>
</svg>
