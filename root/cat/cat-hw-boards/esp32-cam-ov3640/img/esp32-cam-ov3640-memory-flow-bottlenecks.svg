<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Рух кадрових даних та вузькі місця пам'яті ESP32-CAM з OV3640</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Обмеження пропускної здатності шин DVP та PSRAM призводять до переповнення FIFO і втрати кадрів</text>

  <!-- Block 1: OV3640 Sensor -->
  <rect x="35" y="95" width="195" height="180" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="132" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Сенсор OV3640</text>
  <text x="50" y="148" font-size="12" fill="#1a1a1a">• Матриця: 2048×1536</text>
  <text x="50" y="172" font-size="12" fill="#1a1a1a">• Режими: JPEG, RGB, YUV</text>
  <text x="50" y="196" font-size="12" fill="#1a1a1a">• Інтерфейс: DVP 8-bit</text>
  <text x="50" y="220" font-size="12" fill="#1a1a1a">• Тактування: XCLK</text>
  <text x="50" y="244" font-size="12" fill="#6b7280">• Потік: до 80 МБ/с</text>

  <!-- Connection 1 -> 2 -->
  <line x1="230" y1="185" x2="260" y2="185" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="245" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">DVP</text>

  <!-- Block 2: DVP & FIFO -->
  <rect x="265" y="95" width="195" height="180" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="362" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Шина DVP &amp; FIFO</text>
  <text x="280" y="148" font-size="12" fill="#1a1a1a">• Лінії даних: D0–D7</text>
  <text x="280" y="172" font-size="12" fill="#1a1a1a">• Строби: VSYNC, HREF</text>
  <text x="280" y="196" font-size="12" fill="#1a1a1a">• Тактер: PCLK</text>
  <text x="280" y="220" font-size="12" fill="#1a1a1a">• Буфер: Апаратний FIFO</text>
  <text x="280" y="244" font-size="12" fill="#6b7280">• Керування: SCCB (I2C)</text>

  <!-- Connection 2 -> 3 -->
  <line x1="460" y1="185" x2="490" y2="185" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="475" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">FIFO</text>

  <!-- Block 3: DMA Controller -->
  <rect x="495" y="95" width="195" height="180" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="592" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Контролер DMA</text>
  <text x="510" y="148" font-size="12" fill="#1a1a1a">• Модуль: LCD_CAM / I2S</text>
  <text x="510" y="172" font-size="12" fill="#1a1a1a">• Кольцеві дескриптори</text>
  <text x="510" y="196" font-size="12" fill="#1a1a1a">• Пряма передача в RAM</text>
  <text x="510" y="220" font-size="12" fill="#1a1a1a">• Черга буферів: fb_count</text>
  <text x="510" y="244" font-size="12" fill="#6b7280">• Без залучення CPU</text>

  <!-- Connection 3 -> 4 -->
  <line x1="690" y1="185" x2="725" y2="185" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="707" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">DMA</text>

  <!-- Block 4: Memory PSRAM/SRAM -->
  <rect x="730" y="95" width="195" height="180" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="827" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Пам'ять PSRAM / SRAM</text>
  <text x="745" y="148" font-size="12" fill="#1a1a1a">• SRAM: ~512 КБ (мало)</text>
  <text x="745" y="172" font-size="12" fill="#1a1a1a">• PSRAM: 2–8 МБ (зовн.)</text>
  <text x="745" y="196" font-size="12" fill="#1a1a1a">• Шина: SPI (40/80 МГц)</text>
  <text x="745" y="220" font-size="12" fill="#1a1a1a">• Структура: camera_fb_t</text>
  <text x="745" y="244" font-size="12" fill="#6b7280">• Масиви: buf, len, fmt</text>

  <!-- Dashed Bottleneck Indicators -->
  <line x1="245" y1="275" x2="245" y2="335" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arr-red)"/>
  <line x1="592" y1="275" x2="592" y2="335" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arr-red)"/>
  <line x1="827" y1="275" x2="827" y2="335" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arr-red)"/>

  <!-- Bottleneck 1 -->
  <rect x="35" y="340" width="280" height="185" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="8"/>
  <text x="175" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Вузьке місце 1: Схлопування FIFO / DVP</text>
  <text x="50" y="392" font-size="12" fill="#1a1a1a">• Неузгоджена частота тактування XCLK</text>
  <text x="50" y="416" font-size="12" fill="#1a1a1a">• Перешкоди на сигнальних лініях DVP</text>
  <text x="50" y="440" font-size="12" fill="#1a1a1a">• Втрата стробів синхронізації VSYNC</text>
  <text x="50" y="464" font-size="12" font-weight="bold" fill="#c0392b">• Наслідок: Помилка ESP_ERR_TIMEOUT</text>
  <text x="62" y="488" font-size="12" fill="#1a1a1a">та пошкодження структури кадру.</text>

  <!-- Bottleneck 2 -->
  <rect x="340" y="340" width="280" height="185" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="8"/>
  <text x="480" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Вузьке місце 2: Затор дескрипторів DMA</text>
  <text x="355" y="392" font-size="12" fill="#1a1a1a">• Затримка виклику esp_camera_fb_return</text>
  <text x="355" y="416" font-size="12" fill="#1a1a1a">• Переповнення кадрової черги fb_count</text>
  <text x="355" y="440" font-size="12" fill="#1a1a1a">• Блокування нових потоків від DMA</text>
  <text x="355" y="464" font-size="12" font-weight="bold" fill="#c0392b">• Наслідок: Зависання відеопотоку</text>
  <text x="367" y="488" font-size="12" fill="#1a1a1a">та суттєвий витік пам'яті PSRAM.</text>

  <!-- Bottleneck 3 -->
  <rect x="645" y="340" width="280" height="185" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="8"/>
  <text x="785" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Вузьке місце 3: Пропускна здатність PSRAM</text>
  <text x="660" y="392" font-size="12" fill="#1a1a1a">• Низька швидкість шини SPI для RGB565</text>
  <text x="660" y="416" font-size="12" fill="#1a1a1a">• Дефіцит пам'яті для кадрів QXGA (3MP)</text>
  <text x="660" y="440" font-size="12" font-weight="bold" fill="#27ae60">• Розв'язок: Режим PIXFORMAT_JPEG</text>
  <text x="672" y="464" font-size="12" fill="#1a1a1a">з апаратним стисненням на сенсорі</text>
  <text x="672" y="488" font-size="12" fill="#1a1a1a">та виділенням fb_location в PSRAM.</text>
</svg>
