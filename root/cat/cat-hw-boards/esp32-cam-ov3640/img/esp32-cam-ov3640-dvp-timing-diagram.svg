<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма сигналів паралельного цифрового відеоінтерфейсу DVP</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Синхронізація VSYNC, HREF, PCLK та тактування 8-бітної шини даних Y2–Y9 при передачі кадру сенсором OV3640</text>

  <!-- SIGNAL LABELS (LEFT COLUMN) -->
  <text x="145" y="114" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="end">VSYNC</text>
  <text x="145" y="128" font-size="10" fill="#6b7280" text-anchor="end">Кадрова синхр.</text>

  <text x="145" y="194" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="end">HREF</text>
  <text x="145" y="208" font-size="10" fill="#6b7280" text-anchor="end">Рядкова синхр.</text>

  <text x="145" y="274" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="end">PCLK</text>
  <text x="145" y="288" font-size="10" fill="#6b7280" text-anchor="end">Тактування пікселів</text>

  <text x="145" y="354" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="end">Y2–Y9</text>
  <text x="145" y="368" font-size="10" fill="#6b7280" text-anchor="end">8-біт дані D[7:0]</text>

  <!-- BACKGROUND GRID LINES FOR SIGNALS -->
  <line x1="160" y1="110" x2="920" y2="110" stroke="#f4f6f8" stroke-width="30"/>
  <line x1="160" y1="190" x2="920" y2="190" stroke="#f4f6f8" stroke-width="30"/>
  <line x1="160" y1="270" x2="920" y2="270" stroke="#f4f6f8" stroke-width="30"/>
  <line x1="160" y1="350" x2="920" y2="350" stroke="#f4f6f8" stroke-width="30"/>

  <!-- PHASE / TIMING REGION SHADING -->
  <!-- VSYNC Pulse Region -->
  <rect x="160" y="80" width="90" height="300" fill="#eaf0fd" fill-opacity="0.4"/>
  <text x="205" y="75" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Кадровий імпульс VSYNC</text>

  <!-- Active Line 1 Region -->
  <rect x="300" y="80" width="270" height="300" fill="#e9f7ef" fill-opacity="0.3"/>
  <text x="435" y="75" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Активний рядок 1 (HREF High)</text>

  <!-- Active Line 2 Region -->
  <rect x="640" y="80" width="270" height="300" fill="#e9f7ef" fill-opacity="0.3"/>
  <text x="775" y="75" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Активний рядок 2 (HREF High)</text>

  <!-- WAVEFORM 1: VSYNC -->
  <path d="M 160,95 L 250,95 L 250,125 L 920,125" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- WAVEFORM 2: HREF -->
  <path d="M 160,205 L 300,205 L 300,175 L 570,175 L 570,205 L 640,205 L 640,175 L 910,175 L 910,205 L 920,205" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <text x="605" y="198" font-size="10" fill="#6b7280" text-anchor="middle">H-Blank</text>

  <!-- WAVEFORM 3: PCLK (Square wave continuous clock) -->
  <path d="M 160,285 L 175,285 L 175,255 L 190,255 L 190,285 L 205,285 L 205,255 L 220,255 L 220,285 L 235,285 L 235,255 L 250,255 L 250,285 L 265,285 L 265,255 L 280,255 L 280,285 L 295,285 L 295,255 L 310,255 L 310,285 L 325,285 L 325,255 L 340,255 L 340,285 L 355,285 L 355,255 L 370,255 L 370,285 L 385,285 L 385,255 L 400,255 L 400,285 L 415,285 L 415,255 L 430,255 L 430,285 L 445,285 L 445,255 L 460,255 L 460,285 L 475,285 L 475,255 L 490,255 L 490,285 L 505,285 L 505,255 L 520,255 L 520,285 L 535,285 L 535,255 L 550,255 L 550,285 L 565,285 L 565,255 L 580,255 L 580,285 L 595,285 L 595,255 L 610,255 L 610,285 L 625,285 L 625,255 L 640,255 L 640,285 L 655,285 L 655,255 L 670,255 L 670,285 L 685,285 L 685,255 L 700,255 L 700,285 L 715,285 L 715,255 L 730,255 L 730,285 L 745,285 L 745,255 L 760,255 L 760,285 L 775,285 L 775,255 L 790,255 L 790,285 L 805,285 L 805,255 L 820,255 L 820,285 L 835,285 L 835,255 L 850,255 L 850,285 L 865,285 L 865,255 L 880,255 L 880,285 L 895,285 L 895,255 L 910,255 L 910,285 L 920,285" fill="none" stroke="#2457d6" stroke-width="1.8"/>

  <!-- PCLK Rising Edge Indicators -->
  <line x1="325" y1="248" x2="325" y2="330" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>
  <polygon points="325,248 322,254 328,254" fill="#2457d6"/>

  <line x1="370" y1="248" x2="370" y2="330" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>
  <polygon points="370,248 367,254 373,254" fill="#2457d6"/>

  <line x1="415" y1="248" x2="415" y2="330" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>
  <polygon points="415,248 412,254 418,254" fill="#2457d6"/>

  <!-- WAVEFORM 4: Y2–Y9 DATA BUS -->
  <!-- Blanking 1: Tristate Line -->
  <line x1="160" y1="350" x2="300" y2="350" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="230" y="344" font-size="10" fill="#6b7280" text-anchor="middle">Z-стан / Пауза</text>

  <!-- Line 1 Hexagonal Bus Cells -->
  <path d="M 300,350 L 306,335 L 339,335 L 345,350 L 339,365 L 306,365 Z" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.8"/>
  <text x="322.5" y="354" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">B0</text>

  <path d="M 345,350 L 351,335 L 384,335 L 390,350 L 384,365 L 351,365 Z" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.8"/>
  <text x="367.5" y="354" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">B1</text>

  <path d="M 390,350 L 396,335 L 429,335 L 435,350 L 429,365 L 396,365 Z" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.8"/>
  <text x="412.5" y="354" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">B2</text>

  <path d="M 435,350 L 441,335 L 474,335 L 480,350 L 474,365 L 441,365 Z" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.8"/>
  <text x="457.5" y="354" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">B3</text>

  <path d="M 480,350 L 486,335 L 519,335 L 525,350 L 519,365 L 486,365 Z" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.8"/>
  <text x="502.5" y="354" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">B4</text>

  <path d="M 525,350 L 531,335 L 564,335 L 570,350 L 564,365 L 531,365 Z" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.8"/>
  <text x="547.5" y="354" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">B5</text>

  <!-- H-Blank Data Tristate Line -->
  <line x1="570" y1="350" x2="640" y2="350" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="605" y="344" font-size="10" fill="#6b7280" text-anchor="middle">Z-стан</text>

  <!-- Line 2 Hexagonal Bus Cells -->
  <path d="M 640,350 L 646,335 L 679,335 L 685,350 L 679,365 L 646,365 Z" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.8"/>
  <text x="662.5" y="354" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">B0</text>

  <path d="M 685,350 L 691,335 L 724,335 L 730,350 L 724,365 L 691,365 Z" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.8"/>
  <text x="707.5" y="354" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">B1</text>

  <path d="M 730,350 L 736,335 L 769,335 L 775,350 L 769,365 L 736,365 Z" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.8"/>
  <text x="752.5" y="354" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">B2</text>

  <path d="M 775,350 L 781,335 L 814,335 L 820,350 L 814,365 L 781,365 Z" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.8"/>
  <text x="797.5" y="354" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">B3</text>

  <path d="M 820,350 L 826,335 L 859,335 L 865,350 L 859,365 L 826,365 Z" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.8"/>
  <text x="842.5" y="354" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">B4</text>

  <path d="M 865,350 L 871,335 L 904,335 L 910,350 L 904,365 L 871,365 Z" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.8"/>
  <text x="887.5" y="354" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">B5</text>

  <!-- Blanking 2 End Line -->
  <line x1="910" y1="350" x2="920" y2="350" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- BOTTOM SUMMARY / TIMING RULES PANEL -->
  <rect x="40" y="395" width="880" height="70" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="60" y="417" font-size="12" font-weight="bold" fill="#1a1a1a">Правила тактування та зчитування даних DVP інтерфейсу:</text>
  <text x="60" y="437" font-size="11" fill="#2457d6">1. Зчитування 8-бітного значення шини Y2–Y9 здійснюється за наростаючим фронтом тактового сигналу PCLK.</text>
  <text x="60" y="455" font-size="11" fill="#27ae60">2. Дані є валідними лише при високому рівні строба HREF (стробування рядка) та низькому рівні VSYNC (стробування кадру).</text>
</svg>
