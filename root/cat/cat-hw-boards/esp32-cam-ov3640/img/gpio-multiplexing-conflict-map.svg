<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мультиплексування та розв'язання конфліктів GPIO ESP32-CAM</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Перехід SDMMC у 1-бітовий режим ізолює GPIO4 спалаху та усуває накладання сигналів</text>

  <!-- Panel 1: DVP & Camera Bus -->
  <rect x="30" y="85" width="270" height="345" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="6" ry="6"/>
  <text x="165" y="110" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Шина камери OV3640</text>
  <text x="165" y="128" font-size="12" fill="#6b7280" text-anchor="middle">Виділені DVP та SCCB лінії</text>

  <rect x="45" y="148" width="240" height="120" fill="#ffffff" stroke="#2457d6" stroke-width="1" rx="4" ry="4"/>
  <text x="165" y="172" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">DVP 8-bit Data &amp; Clocks</text>
  <text x="165" y="195" font-size="12" fill="#6b7280" text-anchor="middle">GPIO35, 34, 39, 36, 21, 19, 18, 5</text>
  <text x="165" y="220" font-size="12" fill="#1a1a1a" text-anchor="middle">PCLK: GPIO32 | XCLK: GPIO0</text>
  <text x="165" y="245" font-size="12" fill="#1a1a1a" text-anchor="middle">VSYNC: GPIO25 | HREF: GPIO23</text>

  <rect x="45" y="280" width="240" height="130" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4" ry="4"/>
  <text x="165" y="305" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">SCCB Control (I2C)</text>
  <text x="165" y="330" font-size="12" fill="#1a1a1a" text-anchor="middle">SIOD (SDA): GPIO26</text>
  <text x="165" y="355" font-size="12" fill="#1a1a1a" text-anchor="middle">SIOC (SCL): GPIO27</text>
  <text x="165" y="385" font-size="12" fill="#27ae60" text-anchor="middle">Ізольовані від MicroSD</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="300" y1="208" x2="322" y2="208" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Panel 2: Conflict Pin Map -->
  <rect x="330" y="85" width="300" height="345" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6" ry="6"/>
  <text x="480" y="110" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Карта підключення GPIO</text>
  <text x="480" y="128" font-size="12" fill="#6b7280" text-anchor="middle">Спільне використання ніжок</text>

  <rect x="345" y="148" width="270" height="80" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="4" ry="4"/>
  <text x="480" y="170" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">GPIO4: Спалах LED / SD D1</text>
  <text x="480" y="193" font-size="12" fill="#1a1a1a" text-anchor="middle">4-bit SD викликає блимання LED</text>
  <text x="480" y="213" font-size="12" fill="#c0392b" text-anchor="middle">і високий струм при зверненні</text>

  <rect x="345" y="240" width="270" height="80" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="4" ry="4"/>
  <text x="480" y="262" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">GPIO12: Strapping Pin / SD D2</text>
  <text x="480" y="285" font-size="12" fill="#1a1a1a" text-anchor="middle">Підтяжка при старті блокує завантаження</text>
  <text x="480" y="305" font-size="12" fill="#c0392b" text-anchor="middle">напруги VDD_SDIO (1.8V / 3.3V)</text>

  <rect x="345" y="330" width="270" height="85" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4" ry="4"/>
  <text x="480" y="352" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Стандартні лінії SDMMC</text>
  <text x="480" y="375" font-size="12" fill="#6b7280" text-anchor="middle">GPIO14 (CLK) | GPIO15 (CMD)</text>
  <text x="480" y="398" font-size="12" fill="#6b7280" text-anchor="middle">GPIO2 (DATA0) | GPIO13 (DATA3)</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="630" y1="208" x2="652" y2="208" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Panel 3: 1-Bit Mode Solution -->
  <rect x="660" y="85" width="270" height="345" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="6" ry="6"/>
  <text x="795" y="110" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Розв'язок: 1-бітовий SDMMC</text>
  <text x="795" y="128" font-size="12" fill="#6b7280" text-anchor="middle">Режим mode1bit = true</text>

  <rect x="675" y="148" width="240" height="120" fill="#ffffff" stroke="#27ae60" stroke-width="1" rx="4" ry="4"/>
  <text x="795" y="172" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Активні лінії MicroSD</text>
  <text x="795" y="195" font-size="12" fill="#1a1a1a" text-anchor="middle">GPIO14 — SD CLK</text>
  <text x="795" y="220" font-size="12" fill="#1a1a1a" text-anchor="middle">GPIO15 — SD CMD</text>
  <text x="795" y="245" font-size="12" fill="#1a1a1a" text-anchor="middle">GPIO2 — SD DATA0</text>

  <rect x="675" y="280" width="240" height="130" fill="#ffffff" stroke="#27ae60" stroke-width="1" rx="4" ry="4"/>
  <text x="795" y="305" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Звільнені периферійні виводи</text>
  <text x="795" y="330" font-size="12" fill="#1a1a1a" text-anchor="middle">GPIO4: Незалежне керування LED</text>
  <text x="795" y="355" font-size="12" fill="#1a1a1a" text-anchor="middle">GPIO12, GPIO13: Вільні</text>
  <text x="795" y="385" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Стабільна робота FOTA / SD</text>
</svg>
