<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Defs for arrow markers -->
  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кадровий буфер у драйвері esp_camera: життєвий цикл</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Захоплення кадрів через DMA в PSRAM та їх повернення після обробки у застосунку</text>

  <!-- Panel 1: Sensor OV3640 -->
  <rect x="30" y="90" width="180" height="210" fill="#f4f6f8" stroke="#d0d7de" rx="6"/>
  <text x="120" y="115" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Сенсор OV3640</text>
  <text x="120" y="134" font-size="12" fill="#6b7280" text-anchor="middle">2 MP Optical Sensor</text>

  <rect x="42" y="150" width="156" height="135" fill="#eaf0fd" stroke="#2457d6" rx="4"/>
  <text x="120" y="172" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">DVP Інтерфейс</text>
  <text x="120" y="196" font-size="12" fill="#1a1a1a" text-anchor="middle">Паралельна 8-біт шина</text>
  <text x="120" y="218" font-size="12" fill="#6b7280" text-anchor="middle">PCLK, VSYNC, HREF</text>
  <text x="120" y="242" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Апаратний JPEG</text>
  <text x="120" y="264" font-size="12" fill="#6b7280" text-anchor="middle">Стиснений потік</text>

  <!-- Panel 2: ESP32 GDMA / I2S -->
  <rect x="235" y="90" width="185" height="210" fill="#f4f6f8" stroke="#d0d7de" rx="6"/>
  <text x="327" y="115" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GDMA / I2S ESP32</text>
  <text x="327" y="134" font-size="12" fill="#6b7280" text-anchor="middle">Апаратне захоплення</text>

  <rect x="247" y="150" width="161" height="135" fill="white" stroke="#d0d7de" rx="4"/>
  <text x="327" y="172" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">DMA Descriptors</text>
  <text x="327" y="196" font-size="12" fill="#6b7280" text-anchor="middle">Ping-Pong SRAM</text>
  <text x="327" y="218" font-size="12" fill="#6b7280" text-anchor="middle">Прямий запис без CPU</text>
  <text x="327" y="242" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Переривання VSYNC</text>
  <text x="327" y="264" font-size="12" fill="#6b7280" text-anchor="middle">Сигнал завершення</text>

  <!-- Panel 3: esp_camera Driver Ring (PSRAM) -->
  <rect x="445" y="90" width="245" height="400" fill="#f4f6f8" stroke="#d0d7de" rx="6"/>
  <text x="567" y="115" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">esp_camera Driver</text>
  <text x="567" y="134" font-size="12" fill="#6b7280" text-anchor="middle">Пул кадрових буферів у PSRAM (fb_count=3)</text>

  <rect x="460" y="150" width="215" height="85" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="567" y="172" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">camera_fb_t #0 [DMA Target]</text>
  <text x="567" y="194" font-size="12" fill="#1a1a1a" text-anchor="middle">Активний запис кадру з DMA</text>
  <text x="567" y="216" font-size="12" fill="#6b7280" text-anchor="middle">Стан: WRITING (Заповнення)</text>

  <rect x="460" y="250" width="215" height="85" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="567" y="272" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">camera_fb_t #1 [Ready Queue]</text>
  <text x="567" y="294" font-size="12" fill="#1a1a1a" text-anchor="middle">Готовий кадр у черзі видачі</text>
  <text x="567" y="316" font-size="12" fill="#27ae60" text-anchor="middle">Чекає на esp_camera_fb_get()</text>

  <rect x="460" y="350" width="215" height="85" fill="white" stroke="#d0d7de" stroke-dasharray="4 3" rx="4"/>
  <text x="567" y="372" font-size="13" font-weight="bold" fill="#6b7280" text-anchor="middle">camera_fb_t #2 [Free List]</text>
  <text x="567" y="394" font-size="12" fill="#1a1a1a" text-anchor="middle">Вільний резервний буфер</text>
  <text x="567" y="416" font-size="12" fill="#6b7280" text-anchor="middle">Готовий до наступного DMA</text>

  <text x="567" y="468" font-size="12" fill="#6b7280" text-anchor="middle">Виділення пам'яті в PSRAM (32-bit aligned)</text>

  <!-- Panel 4: Application -->
  <rect x="715" y="90" width="215" height="400" fill="#f4f6f8" stroke="#d0d7de" rx="6"/>
  <text x="822" y="115" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Застосунок (App)</text>
  <text x="822" y="134" font-size="12" fill="#6b7280" text-anchor="middle">Цикл обробки та передачі</text>

  <rect x="730" y="150" width="185" height="75" fill="#eaf0fd" stroke="#2457d6" rx="4"/>
  <text x="822" y="174" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">1. esp_camera_fb_get()</text>
  <text x="822" y="196" font-size="12" fill="#1a1a1a" text-anchor="middle">Отримання fb-&gt;buf</text>
  <text x="822" y="214" font-size="12" fill="#6b7280" text-anchor="middle">Захоплення буфера</text>

  <rect x="730" y="240" width="185" height="75" fill="white" stroke="#d0d7de" rx="4"/>
  <text x="822" y="264" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Stream / Save</text>
  <text x="822" y="286" font-size="12" fill="#1a1a1a" text-anchor="middle">Передача в HTTP/SD</text>
  <text x="822" y="304" font-size="12" fill="#6b7280" text-anchor="middle">Читання fb-&gt;len байт</text>

  <rect x="730" y="330" width="185" height="75" fill="#e9f7ef" stroke="#27ae60" rx="4"/>
  <text x="822" y="354" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">3. esp_camera_fb_return(fb)</text>
  <text x="822" y="376" font-size="12" fill="#27ae60" text-anchor="middle">Повернення в Free List!</text>
  <text x="822" y="394" font-size="12" fill="#6b7280" text-anchor="middle">Звільнення для DMA</text>

  <rect x="730" y="420" width="185" height="55" fill="#fdecea" stroke="#c0392b" rx="4"/>
  <text x="822" y="440" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">⚠️ Затримка fb_return():</text>
  <text x="822" y="460" font-size="12" fill="#c0392b" text-anchor="middle">Вичерпання пулу та Drop FPS</text>

  <!-- Panel 5: Key Aspects / Safety -->
  <rect x="30" y="320" width="390" height="170" fill="#fdecea" stroke="#c0392b" rx="6"/>
  <text x="225" y="344" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">⚠️ Запобігання витокам та помилкам</text>
  <text x="45" y="370" font-size="12" fill="#1a1a1a">1. JPEG стиснення: зменшує кадр з 3.8 МБ до ~100 КБ</text>
  <text x="45" y="394" font-size="12" fill="#1a1a1a">2. fb_count &gt;= 2: забезпечує неблокуючий кадровій потік</text>
  <text x="45" y="418" font-size="12" fill="#1a1a1a">3. fb-&gt;buf недійсний після esp_camera_fb_return(fb)</text>
  <text x="45" y="442" font-size="12" font-weight="bold" fill="#c0392b">4. Пропуск fb_return(): блокує кільце й зупиняє DMA!</text>
  <text x="45" y="466" font-size="12" fill="#6b7280">5. Вирівнювання PSRAM: вимагає 32-бітної адресації DMA</text>

  <!-- Connectors -->
  <!-- DVP Stream -->
  <path d="M 210,217 L 235,217" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="222" y="207" font-size="12" fill="#2457d6" text-anchor="middle">DVP</text>

  <!-- DMA Direct -->
  <path d="M 420,192 L 460,192" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="440" y="182" font-size="12" fill="#2457d6" text-anchor="middle">DMA</text>

  <!-- fb_get() flow -->
  <path d="M 675,292 L 700,292 L 700,187 L 730,187" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="700" y="172" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">fb_get()</text>

  <!-- fb_return() flow -->
  <path d="M 730,367 L 700,367 L 700,392 L 675,392" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arr-green)"/>
  <text x="700" y="412" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">fb_return()</text>

  <!-- App internal steps -->
  <path d="M 822,225 L 822,240" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-main)"/>
  <path d="M 822,315 L 822,330" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-main)"/>
</svg>
