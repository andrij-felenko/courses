<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема апаратної розв'язки живлення ESP32-CAM та OV3640</text>
  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Розділення аналогових (AVDD) та цифрових (DVDD/DOVDD) шин живлення через LDO, феритові намистини та фільтри</text>

  <!-- Left Panel: Power Sources & Regulators -->
  <rect x="30" y="75" width="200" height="435" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="130" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Джерела живлення</text>

  <!-- 5V Input Box -->
  <rect x="45" y="115" width="170" height="45" fill="white" stroke="#d0d7de" stroke-width="1" rx="5"/>
  <text x="130" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Вхід 5V (USB / VBUS)</text>
  <text x="130" y="152" text-anchor="middle" font-size="12" fill="#6b7280">Піковий струм до 500 мА</text>

  <!-- LDO1 (3.3V Digital) -->
  <rect x="45" y="180" width="170" height="80" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="5"/>
  <text x="130" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">LDO1 (3.3V Цифровий)</text>
  <text x="130" y="222" text-anchor="middle" font-size="12" fill="#1a1a1a">ME6211 / AMS1117</text>
  <text x="130" y="242" text-anchor="middle" font-size="12" fill="#6b7280">Живлення ESP32 &amp; DOVDD</text>

  <!-- LDO2 (2.8V Analog) -->
  <rect x="45" y="310" width="170" height="80" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="5"/>
  <text x="130" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">LDO2 (2.8V Аналоговий)</text>
  <text x="130" y="352" text-anchor="middle" font-size="12" fill="#1a1a1a">Низькошумний LDO</text>
  <text x="130" y="372" text-anchor="middle" font-size="12" fill="#6b7280">Чисте живлення AVDD</text>

  <!-- Star Ground Box -->
  <rect x="45" y="415" width="170" height="80" fill="white" stroke="#d0d7de" stroke-width="1" rx="5"/>
  <text x="130" y="438" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Зіркова земля (Star GND)</text>
  <text x="130" y="458" text-anchor="middle" font-size="12" fill="#6b7280">AGND і DGND з'єднані</text>
  <text x="130" y="478" text-anchor="middle" font-size="12" fill="#6b7280">в одній точці під LDO</text>

  <!-- Center Panel: Decoupling Networks -->
  <rect x="250" y="75" width="450" height="435" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="475" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Кола фільтрації та розв'язки завад</text>

  <!-- Bus 1 (DOVDD 3.3V IO) -->
  <rect x="265" y="115" width="420" height="105" fill="white" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="275" y="135" text-anchor="start" font-size="13" font-weight="bold" fill="#2457d6">Шина DOVDD (3.3V Периферія / IO)</text>

  <rect x="280" y="145" width="110" height="60" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="4"/>
  <text x="335" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">C1: 100 μF</text>
  <text x="335" y="188" text-anchor="middle" font-size="12" fill="#6b7280">Тантал Low-ESR</text>

  <rect x="405" y="145" width="120" height="60" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="465" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">C2: 10 μF</text>
  <text x="465" y="188" text-anchor="middle" font-size="12" fill="#6b7280">Кераміка SMD</text>

  <rect x="540" y="145" width="130" height="60" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="605" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">C3: 0.1 μF</text>
  <text x="605" y="188" text-anchor="middle" font-size="12" fill="#6b7280">ВЧ розв'язка</text>

  <!-- Bus 2 (DVDD 1.8V Core) -->
  <rect x="265" y="240" width="420" height="100" fill="white" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="275" y="260" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">Шина DVDD (1.8V Цифрове ядро)</text>

  <rect x="280" y="270" width="180" height="55" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="370" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">C4: 10 μF (НЧ)</text>
  <text x="370" y="312" text-anchor="middle" font-size="12" fill="#6b7280">Фільтр вбудованого LDO</text>

  <rect x="480" y="270" width="190" height="55" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="575" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">C5: 0.1 μF (ВЧ)</text>
  <text x="575" y="312" text-anchor="middle" font-size="12" fill="#6b7280">Блокування завад ядра</text>

  <!-- Bus 3 (AVDD 2.8V Analog) -->
  <rect x="265" y="360" width="420" height="135" fill="white" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="275" y="380" text-anchor="start" font-size="13" font-weight="bold" fill="#27ae60">Шина AVDD (2.8V Аналогова матриця)</text>

  <rect x="280" y="390" width="120" height="90" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="340" y="415" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">FB1 (Ферит)</text>
  <text x="340" y="435" text-anchor="middle" font-size="12" fill="#1a1a1a">600 Ω @ 100MHz</text>
  <text x="340" y="455" text-anchor="middle" font-size="12" fill="#6b7280">Ізоляція шуму</text>

  <rect x="415" y="390" width="255" height="90" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="542" y="415" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">C6: 10 μF + C7: 0.1 μF + C8: 10 nF</text>
  <text x="542" y="440" text-anchor="middle" font-size="12" fill="#1a1a1a">Багатоступеневий фільтр завад</text>
  <text x="542" y="460" text-anchor="middle" font-size="12" fill="#6b7280">Захист від білого шуму в кадрах</text>

  <!-- Right Panel: OV3640 Sensor -->
  <rect x="720" y="75" width="210" height="435" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="8"/>
  <text x="825" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Сенсор OV3640</text>

  <!-- DOVDD Pin -->
  <rect x="735" y="125" width="180" height="70" fill="white" stroke="#2457d6" stroke-width="1.5" rx="5"/>
  <text x="825" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Пін DOVDD</text>
  <text x="825" y="172" text-anchor="middle" font-size="12" fill="#6b7280">3.3V IO портів DVP</text>

  <!-- DVDD Pin -->
  <rect x="735" y="250" width="180" height="70" fill="white" stroke="#d0d7de" stroke-width="1.5" rx="5"/>
  <text x="825" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Пін DVDD</text>
  <text x="825" y="297" text-anchor="middle" font-size="12" fill="#6b7280">1.8V Цифрове ядро</text>

  <!-- AVDD Pin -->
  <rect x="735" y="375" width="180" height="70" fill="white" stroke="#27ae60" stroke-width="1.5" rx="5"/>
  <text x="825" y="400" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Пін AVDD</text>
  <text x="825" y="422" text-anchor="middle" font-size="12" fill="#6b7280">2.8V Аналогова матриця</text>

  <text x="825" y="485" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">AGND / DGND земля</text>

  <!-- Connection Lines & Arrows -->
  <line x1="130" y1="160" x2="130" y2="178" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="215" y1="220" x2="263" y2="165" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="215" y1="350" x2="263" y2="425" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <line x1="685" y1="165" x2="733" y2="160" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="685" y1="290" x2="733" y2="285" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="685" y1="435" x2="733" y2="410" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
</svg>
