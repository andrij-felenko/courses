<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Мапування полів структури camera_config_t на апаратні ресурси ESP32</text>
  <text x="480" y="54" font-size="13" text-anchor="middle" fill="#6b7280">Прив'язка DVP-пінів, частоти XCLK, режимів fb_count та pixformat до PSRAM</text>

  <!-- Panel 1: Configuration Structure -->
  <rect x="30" y="80" width="270" height="445" fill="#f4f6f8" stroke="#d0d7de" rx="8"/>
  <text x="165" y="105" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Конфігурація (camera_config_t)</text>

  <!-- Block 1.1 -->
  <rect x="45" y="120" width="240" height="85" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="6"/>
  <text x="55" y="142" font-size="13" font-weight="bold" fill="#2457d6">.pin_d0 .. .pin_d7, .pin_xclk</text>
  <text x="55" y="164" font-size="12" fill="#1a1a1a">.pin_pclk, .pin_vsync, .pin_href</text>
  <text x="55" y="186" font-size="12" fill="#1a1a1a">.pin_sscb_sda, .pin_sscb_scl</text>

  <!-- Block 1.2 -->
  <rect x="45" y="220" width="240" height="65" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="55" y="244" font-size="13" font-weight="bold" fill="#1a1a1a">.xclk_freq_hz = 20000000</text>
  <text x="55" y="266" font-size="12" fill="#6b7280">Тактування камери XCLK (20 МГц)</text>

  <!-- Block 1.3 -->
  <rect x="45" y="300" width="240" height="85" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="55" y="322" font-size="13" font-weight="bold" fill="#1a1a1a">.frame_size = FRAMESIZE_UXGA</text>
  <text x="55" y="344" font-size="12" fill="#1a1a1a">.pixformat = PIXFORMAT_JPEG</text>
  <text x="55" y="366" font-size="12" fill="#6b7280">Формат стиснення та роздільність</text>

  <!-- Block 1.4 -->
  <rect x="45" y="400" width="240" height="105" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="6"/>
  <text x="55" y="422" font-size="13" font-weight="bold" fill="#27ae60">.fb_count = 2</text>
  <text x="55" y="444" font-size="12" fill="#1a1a1a">.fb_location = CAMERA_FB_IN_PSRAM</text>
  <text x="55" y="466" font-size="12" fill="#1a1a1a">.grab_mode = CAMERA_GRAB_LATEST</text>
  <text x="55" y="488" font-size="12" fill="#6b7280">Подвійна буферизація у PSRAM</text>

  <!-- Panel 2: Hardware Resources -->
  <rect x="345" y="80" width="270" height="445" fill="#f4f6f8" stroke="#d0d7de" rx="8"/>
  <text x="480" y="105" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Апаратні ресурси ESP32</text>

  <!-- Block 2.1 -->
  <rect x="360" y="120" width="240" height="85" fill="#ffffff" stroke="#d0d7de" rx="6"/>
  <text x="370" y="142" font-size="13" font-weight="bold" fill="#1a1a1a">Сенсор OV3640 &amp; DVP Шина</text>
  <text x="370" y="164" font-size="12" fill="#6b7280">Лінії D0..D7, PCLK, VSYNC, HREF</text>
  <text x="370" y="186" font-size="12" fill="#6b7280">SCCB (I2C) шина керування</text>

  <!-- Block 2.2 -->
  <rect x="360" y="220" width="240" height="65" fill="#ffffff" stroke="#d0d7de" rx="6"/>
  <text x="370" y="244" font-size="13" font-weight="bold" fill="#1a1a1a">Периферія LEDC / PWM</text>
  <text x="370" y="266" font-size="12" fill="#6b7280">Генерує опорну частоту XCLK</text>

  <!-- Block 2.3 -->
  <rect x="360" y="300" width="240" height="85" fill="#eaf0fd" stroke="#2457d6" rx="6"/>
  <text x="370" y="322" font-size="13" font-weight="bold" fill="#2457d6">I2S DVP Контролер + DMA</text>
  <text x="370" y="344" font-size="12" fill="#1a1a1a">Паралельне захоплення байтів</text>
  <text x="370" y="366" font-size="12" fill="#6b7280">Формування JPEG кадру</text>

  <!-- Block 2.4 -->
  <rect x="360" y="400" width="240" height="105" fill="#ffffff" stroke="#d0d7de" rx="6"/>
  <text x="370" y="422" font-size="13" font-weight="bold" fill="#1a1a1a">Драйвер esp_camera</text>
  <text x="370" y="444" font-size="12" fill="#1a1a1a">esp_camera_init(&amp;config)</text>
  <text x="370" y="466" font-size="12" fill="#1a1a1a">esp_camera_fb_get() / return()</text>
  <text x="370" y="488" font-size="12" fill="#6b7280">Керування чергою буферів</text>

  <!-- Panel 3: Memory Allocation -->
  <rect x="660" y="80" width="270" height="445" fill="#f4f6f8" stroke="#d0d7de" rx="8"/>
  <text x="795" y="105" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Розподіл Пам'яті</text>

  <!-- Block 3.1 -->
  <rect x="675" y="120" width="240" height="100" fill="#fdecea" stroke="#c0392b" rx="6"/>
  <text x="685" y="142" font-size="13" font-weight="bold" fill="#c0392b">Внутрішня SRAM (~512 КБ)</text>
  <text x="685" y="164" font-size="12" fill="#1a1a1a">DMA дескриптори та структури</text>
  <text x="685" y="186" font-size="12" fill="#c0392b">Без PSRAM: лише 1 буфер (fb=1)</text>
  <text x="685" y="208" font-size="12" fill="#c0392b">Обмеження роздільності (QVGA)</text>

  <!-- Block 3.2 -->
  <rect x="675" y="235" width="240" height="270" fill="#e9f7ef" stroke="#27ae60" rx="6"/>
  <text x="685" y="256" font-size="13" font-weight="bold" fill="#27ae60">Зовнішня PSRAM (4/8 МБ)</text>
  <text x="685" y="276" font-size="12" fill="#1a1a1a">Розміщення кадрових буферів FB</text>

  <!-- Inner FB 0 -->
  <rect x="685" y="290" width="220" height="85" fill="#ffffff" stroke="#27ae60" stroke-dasharray="4,3" rx="4"/>
  <text x="695" y="310" font-size="12" font-weight="bold" fill="#27ae60">FB #0: UXGA JPEG (~150-300 КБ)</text>
  <text x="695" y="332" font-size="12" fill="#1a1a1a">Заповнення DMA під час зйомки</text>
  <text x="695" y="354" font-size="12" fill="#6b7280">Отримання: esp_camera_fb_get()</text>

  <!-- Inner FB 1 -->
  <rect x="685" y="385" width="220" height="85" fill="#ffffff" stroke="#27ae60" stroke-dasharray="4,3" rx="4"/>
  <text x="695" y="405" font-size="12" font-weight="bold" fill="#27ae60">FB #1: UXGA JPEG (~150-300 КБ)</text>
  <text x="695" y="427" font-size="12" fill="#1a1a1a">Обробка / передача по HTTP</text>
  <text x="695" y="449" font-size="12" fill="#6b7280">fb_return(): вивільнення FB</text>

  <text x="685" y="490" font-size="12" font-weight="bold" fill="#27ae60">fb_count = 2: безпропускне відео</text>

  <!-- Arrows Left to Middle -->
  <path d="M285,162 L360,162" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="322.5" y="154" font-size="12" text-anchor="middle" fill="#2457d6">GPIO</text>

  <path d="M285,252 L360,252" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="322.5" y="244" font-size="12" text-anchor="middle" fill="#1a1a1a">XCLK</text>

  <path d="M285,342 L360,342" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="322.5" y="334" font-size="12" text-anchor="middle" fill="#1a1a1a">JPEG</text>

  <path d="M285,452 L360,452" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="322.5" y="444" font-size="12" text-anchor="middle" fill="#27ae60">PSRAM</text>

  <!-- Arrows Middle to Right -->
  <path d="M600,162 L675,162" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="637.5" y="154" font-size="12" text-anchor="middle" fill="#c0392b">SRAM</text>

  <path d="M600,372 L675,372" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="637.5" y="364" font-size="12" text-anchor="middle" fill="#27ae60">DMA FB</text>
</svg>
