<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Архітектура паралельної обробки MJPEG-стрімінгу та таймлапс-запису</text>
  <text x="480" y="54" font-size="13" text-anchor="middle" fill="#6b7280">Розподіл буферів PSRAM між HTTP-сервером та SDMMC-записом для усунення конфліктів I/O</text>

  <!-- Panel 1: Frame Grabber -->
  <rect x="30" y="80" width="250" height="445" fill="#f4f6f8" stroke="#d0d7de" rx="8"/>
  <text x="155" y="105" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">1. Апаратне захоплення</text>

  <rect x="45" y="125" width="220" height="85" fill="#ffffff" stroke="#d0d7de" rx="6"/>
  <text x="55" y="147" font-size="13" font-weight="bold" fill="#1a1a1a">Сенсор OV3640 (2 МП)</text>
  <text x="55" y="169" font-size="12" fill="#1a1a1a">Режим: UXGA (1600x1200)</text>
  <text x="55" y="189" font-size="12" fill="#6b7280">Апаратне стиснення JPEG</text>

  <rect x="45" y="225" width="220" height="85" fill="#eaf0fd" stroke="#2457d6" rx="6"/>
  <text x="55" y="247" font-size="13" font-weight="bold" fill="#2457d6">I2S DVP + DMA Контролер</text>
  <text x="55" y="269" font-size="12" fill="#1a1a1a">Пакетний запис у PSRAM</text>
  <text x="55" y="289" font-size="12" fill="#6b7280">Переривання по VSYNC</text>

  <rect x="45" y="325" width="220" height="180" fill="#ffffff" stroke="#d0d7de" rx="6"/>
  <text x="55" y="347" font-size="13" font-weight="bold" fill="#1a1a1a">Драйвер esp_camera</text>
  <text x="55" y="369" font-size="12" fill="#1a1a1a">Черга активних буферів</text>
  <text x="55" y="389" font-size="12" fill="#27ae60">fb_count = 2 (PSRAM)</text>
  <text x="55" y="409" font-size="12" fill="#1a1a1a">grab_mode = LATEST</text>
  <text x="55" y="429" font-size="12" fill="#6b7280">Синхронізація семафором</text>
  <text x="55" y="449" font-size="12" fill="#6b7280">esp_camera_fb_get()</text>
  <text x="55" y="469" font-size="12" fill="#6b7280">esp_camera_fb_return()</text>
  <text x="55" y="489" font-size="12" fill="#27ae60">Ротація без затримок</text>

  <!-- Panel 2: PSRAM Buffering -->
  <rect x="310" y="80" width="310" height="445" fill="#e9f7ef" stroke="#27ae60" rx="8"/>
  <text x="465" y="105" font-size="14" font-weight="bold" text-anchor="middle" fill="#27ae60">2. Буферизація в PSRAM</text>

  <rect x="325" y="125" width="280" height="110" fill="#ffffff" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="335" y="147" font-size="13" font-weight="bold" fill="#27ae60">Буфер кадру FB #0 (camera_fb_t)</text>
  <text x="335" y="169" font-size="12" fill="#1a1a1a">Адреса: PSRAM 0x3F800000</text>
  <text x="335" y="189" font-size="12" fill="#2457d6">Призначено: MJPEG Стрімер</text>
  <text x="335" y="209" font-size="12" fill="#1a1a1a">Стан: Читання для HTTP-потоку</text>
  <text x="335" y="225" font-size="12" fill="#6b7280">Розмір: ~180 КБ (UXGA JPEG)</text>

  <rect x="325" y="250" width="280" height="110" fill="#ffffff" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="335" y="272" font-size="13" font-weight="bold" fill="#27ae60">Буфер кадру FB #1 (camera_fb_t)</text>
  <text x="335" y="294" font-size="12" fill="#1a1a1a">Адреса: PSRAM 0x3F830000</text>
  <text x="335" y="314" font-size="12" fill="#1a1a1a">Призначено: Timelapse SD MMC</text>
  <text x="335" y="334" font-size="12" fill="#27ae60">Стан: Запис на microSD / FATFS</text>
  <text x="335" y="350" font-size="12" fill="#6b7280">Незалежний паралельний доступ</text>

  <rect x="325" y="375" width="280" height="130" fill="#e9f7ef" stroke="#27ae60" rx="6"/>
  <text x="335" y="397" font-size="13" font-weight="bold" fill="#27ae60">Арбітраж &amp; М'ютекс доступу</text>
  <text x="335" y="419" font-size="12" fill="#1a1a1a">xSemaphoreTake(fb_mutex)</text>
  <text x="335" y="439" font-size="12" fill="#1a1a1a">Усунення конфліктів шини PSRAM</text>
  <text x="335" y="459" font-size="12" fill="#27ae60">Запобігання розриву кадрів</text>
  <text x="335" y="479" font-size="12" fill="#6b7280">Стабільні 15 fps без drops</text>

  <!-- Panel 3: MJPEG Streamer Task -->
  <rect x="650" y="80" width="280" height="215" fill="#eaf0fd" stroke="#2457d6" rx="8"/>
  <text x="790" y="105" font-size="14" font-weight="bold" text-anchor="middle" fill="#2457d6">3. MJPEG HTTP-Стрімер</text>

  <rect x="662" y="120" width="256" height="75" fill="#ffffff" stroke="#2457d6" rx="6"/>
  <text x="672" y="140" font-size="13" font-weight="bold" fill="#2457d6">Асинхронний HTTP Сервер</text>
  <text x="672" y="160" font-size="12" fill="#1a1a1a">Multipart/x-mixed-replace</text>
  <text x="672" y="180" font-size="12" fill="#6b7280">Заголовки Boundary JPEG</text>

  <rect x="662" y="205" width="256" height="75" fill="#ffffff" stroke="#2457d6" rx="6"/>
  <text x="672" y="225" font-size="13" font-weight="bold" fill="#1a1a1a">Wi-Fi TCP/IP Сокет</text>
  <text x="672" y="245" font-size="12" fill="#1a1a1a">Трансляція кадру по мережі</text>
  <text x="672" y="265" font-size="12" fill="#6b7280">Низька затримка потоку</text>

  <!-- Panel 4: Timelapse & microSD Task -->
  <rect x="650" y="310" width="280" height="215" fill="#f4f6f8" stroke="#d0d7de" rx="8"/>
  <text x="790" y="332" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">4. Timelapse &amp; microSD</text>

  <rect x="662" y="345" width="256" height="80" fill="#ffffff" stroke="#d0d7de" rx="6"/>
  <text x="672" y="365" font-size="13" font-weight="bold" fill="#1a1a1a">Шина SDMMC (1/4 біт)</text>
  <text x="672" y="385" font-size="12" fill="#1a1a1a">Запис: /sdcard/img_N.jpg</text>
  <text x="672" y="405" font-size="12" fill="#6b7280">Пакетна скидка у FATFS</text>

  <rect x="662" y="435" width="256" height="75" fill="#ffffff" stroke="#d0d7de" rx="6"/>
  <text x="672" y="455" font-size="13" font-weight="bold" fill="#1a1a1a">RTC Таймер &amp; Deep Sleep</text>
  <text x="672" y="475" font-size="12" fill="#1a1a1a">Періодичне пробудження</text>
  <text x="672" y="495" font-size="12" fill="#6b7280">Енергозбереження</text>

  <!-- Connecting Arrows -->
  <path d="M265,180 L325,180" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="295" y="172" font-size="12" text-anchor="middle" fill="#2457d6">DMA</text>

  <path d="M265,305 L325,305" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="295" y="297" font-size="12" text-anchor="middle" fill="#27ae60">DMA</text>

  <path d="M605,160 L662,160" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="633.5" y="152" font-size="12" text-anchor="middle" fill="#2457d6">FB0</text>

  <path d="M605,305 L633,305 L633,385 L662,385" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="633" y="297" font-size="12" text-anchor="middle" fill="#27ae60">FB1</text>
</svg>
