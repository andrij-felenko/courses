<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Буферизація кадрів OV3640 через DMA у зовнішню PSRAM</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Прямий доступ DVP-даних до пам'яті через DMA в подвійний кільцевий буфер PSRAM</text>

  <!-- Panel 1: OV3640 Sensor (DVP Interface) -->
  <rect x="40" y="90" width="220" height="320" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="150" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Сенсор OV3640 (DVP)</text>
  <text x="150" y="136" text-anchor="middle" font-size="12" fill="#6b7280">Паралельний вихід</text>

  <rect x="55" y="155" width="190" height="40" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="150" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">DVP Data [D0..D7]</text>

  <rect x="55" y="205" width="190" height="30" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="150" y="225" text-anchor="middle" font-size="12" fill="#1a1a1a">PCLK (Тактування)</text>

  <rect x="55" y="245" width="190" height="30" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="150" y="265" text-anchor="middle" font-size="12" fill="#1a1a1a">VSYNC (Кадрова синхр.)</text>

  <rect x="55" y="285" width="190" height="30" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="150" y="305" text-anchor="middle" font-size="12" fill="#1a1a1a">HREF (Рядкова синхр.)</text>

  <rect x="55" y="330" width="190" height="60" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="150" y="352" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Формат: JPEG / YUV</text>
  <text x="150" y="374" text-anchor="middle" font-size="12" fill="#2457d6">Кадр 2 МП (1600x1200)</text>

  <!-- Flow Arrow 1: DVP Stream to ESP32 -->
  <line x1="265" y1="210" x2="330" y2="210" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>
  <text x="297" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">DVP Потік</text>

  <!-- Panel 2: ESP32 Controller & DMA -->
  <rect x="340" y="90" width="240" height="320" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="460" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Контролер ESP32</text>
  <text x="460" y="136" text-anchor="middle" font-size="12" fill="#6b7280">Апаратна передача</text>

  <rect x="355" y="155" width="210" height="65" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="460" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Периферія I2S / CAM</text>
  <text x="460" y="202" text-anchor="middle" font-size="12" fill="#6b7280">Захоплення байтів DVP</text>

  <line x1="460" y1="222" x2="460" y2="243" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="355" y="250" width="210" height="75" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="460" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">DMA Контролер</text>
  <text x="460" y="295" text-anchor="middle" font-size="12" fill="#2457d6">Дескриптори та FIFO</text>
  <text x="460" y="312" text-anchor="middle" font-size="12" fill="#6b7280">Без навантаження CPU</text>

  <rect x="355" y="340" width="210" height="50" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="460" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Ядра CPU (Core 0/1)</text>
  <text x="460" y="380" text-anchor="middle" font-size="12" fill="#27ae60">Вільні для обробки / Wi-Fi</text>

  <!-- Flow Arrow 2: DMA Engine to PSRAM -->
  <line x1="585" y1="287" x2="650" y2="287" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>
  <text x="617" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Шина PSRAM</text>

  <!-- Panel 3: External PSRAM & Buffers -->
  <rect x="660" y="90" width="260" height="320" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="790" y="116" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Зовнішня PSRAM (4/8 МБ)</text>
  <text x="790" y="136" text-anchor="middle" font-size="12" fill="#6b7280">Організація кадрових буферів</text>

  <!-- FB0 Box -->
  <rect x="675" y="155" width="230" height="70" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="685" y="165" width="95" height="22" rx="3" fill="#2457d6"/>
  <text x="732" y="180" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">DMA Запис</text>
  <text x="835" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">FB[0]: Кадр N</text>
  <text x="790" y="210" text-anchor="middle" font-size="12" fill="#2457d6">Наповнення даними з OV3640</text>

  <!-- FB1 Box -->
  <rect x="675" y="235" width="230" height="70" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="685" y="245" width="95" height="22" rx="3" fill="#27ae60"/>
  <text x="732" y="260" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">CPU Читання</text>
  <text x="835" y="260" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">FB[1]: Кадр N-1</text>
  <text x="790" y="290" text-anchor="middle" font-size="12" fill="#27ae60">Передача по HTTP / RTSP</text>

  <!-- Memory Management Note Box -->
  <rect x="675" y="315" width="230" height="75" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="790" y="336" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Почергове перемикання (Ping-Pong)</text>
  <text x="790" y="356" text-anchor="middle" font-size="12" fill="#6b7280">Запобігає розриву зображення</text>
  <text x="790" y="374" text-anchor="middle" font-size="12" fill="#6b7280">Виділення кадру через esp_camera</text>
</svg>
