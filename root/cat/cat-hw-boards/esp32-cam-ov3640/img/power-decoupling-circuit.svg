<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr_blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr_red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr_green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема розв'язки живлення ESP32-CAM з сенсором OV3640 та MicroSD</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Локалізація пікових струмів згладжувальними конденсаторами запобігає просіданню напруги та Brownout Reset</text>

  <!-- Main Topology Panel -->
  <rect x="30" y="78" width="900" height="275" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="50" y="102" font-size="14" font-weight="bold" fill="#1a1a1a">Апаратна схема розв'язки шини живлення 3.3V (Power Decoupling Topology)</text>

  <!-- Block 1: Power Source & LDO -->
  <rect x="50" y="118" width="170" height="215" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="135" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Джерело 5V / LDO</text>
  <text x="135" y="160" text-anchor="middle" font-size="11" fill="#1a1a1a">V_IN (5V Li-Po / USB)</text>

  <rect x="65" y="172" width="140" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="135" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">LDO Reg 3.3V</text>
  <text x="135" y="205" text-anchor="middle" font-size="11" fill="#6b7280">AP2112K / AMS1117</text>

  <rect x="75" y="222" width="120" height="42" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="135" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">C_IN = 10 µF</text>
  <text x="135" y="255" text-anchor="middle" font-size="11" fill="#6b7280">Вхідний буфер</text>

  <text x="135" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">V_OUT = 3.3V</text>
  <text x="135" y="302" text-anchor="middle" font-size="11" fill="#6b7280">I_max ≥ 600 mA</text>

  <!-- Power Bus Lines -->
  <line x1="220" y1="155" x2="880" y2="155" stroke="#2457d6" stroke-width="3"/>
  <text x="450" y="145" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Загальна шина живлення V_DD (3.3V)</text>

  <line x1="220" y1="310" x2="880" y2="310" stroke="#6b7280" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="450" y="325" text-anchor="middle" font-size="11" fill="#6b7280">Спільна шина заземлення (GND)</text>

  <!-- Connections from Bus to Modules -->
  <line x1="350" y1="155" x2="350" y2="173" stroke="#2457d6" stroke-width="2" marker-end="url(#arr_blue)"/>
  <line x1="565" y1="155" x2="565" y2="173" stroke="#2457d6" stroke-width="2" marker-end="url(#arr_blue)"/>
  <line x1="800" y1="155" x2="800" y2="173" stroke="#2457d6" stroke-width="2" marker-end="url(#arr_blue)"/>

  <line x1="350" y1="300" x2="350" y2="310" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="565" y1="300" x2="565" y2="310" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="800" y1="300" x2="800" y2="310" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Block 2: ESP32 MCU Module -->
  <rect x="260" y="175" width="180" height="125" rx="6" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="350" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">ESP32 Microcontroller</text>
  <text x="350" y="211" text-anchor="middle" font-size="11" fill="#c0392b">Wi-Fi TX Peak: ~240 mA</text>

  <rect x="272" y="220" width="156" height="72" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="350" y="237" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">C1 = 100 µF (Тантал)</text>
  <text x="350" y="253" text-anchor="middle" font-size="11" fill="#1a1a1a">C2 = 0.1 µF (Кераміка)</text>
  <text x="350" y="271" text-anchor="middle" font-size="11" fill="#6b7280">НЧ буфер + ВЧ фільтр</text>
  <text x="350" y="285" text-anchor="middle" font-size="11" fill="#6b7280">біля виводів VDD_ESP32</text>

  <!-- Block 3: OV3640 Camera Sensor -->
  <rect x="470" y="175" width="190" height="125" rx="6" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="565" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Камера OV3640 (2 МП)</text>
  <text x="565" y="211" text-anchor="middle" font-size="11" fill="#c0392b">Зйомка UXGA: ~160 mA</text>

  <rect x="482" y="220" width="166" height="72" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="565" y="237" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">C3 = 10 µF (Аналог AVDD)</text>
  <text x="565" y="253" text-anchor="middle" font-size="11" fill="#1a1a1a">C4 = 0.1 µF (Цифра DVDD)</text>
  <text x="565" y="271" text-anchor="middle" font-size="11" fill="#6b7280">Пригнічення шуму матриці</text>
  <text x="565" y="285" text-anchor="middle" font-size="11" fill="#6b7280">та імпульсів DVP шини</text>

  <!-- Block 4: MicroSD Card Module -->
  <rect x="690" y="175" width="220" height="125" rx="6" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="800" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Карта пам'яті MicroSD</text>
  <text x="800" y="211" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Запис JPEG: I_peak ≥ 200 mA</text>

  <rect x="702" y="220" width="196" height="72" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="800" y="237" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">C5 = 47...100 µF (Буфер запису)</text>
  <text x="800" y="253" text-anchor="middle" font-size="11" fill="#1a1a1a">C6 = 0.1 µF (Шина SDMMC CLK)</text>
  <text x="800" y="271" text-anchor="middle" font-size="11" fill="#6b7280">Компенсація просідання ΔV</text>
  <text x="800" y="285" text-anchor="middle" font-size="11" fill="#6b7280">безпосередньо на слоті SD</text>

  <!-- Bottom Comparison Cards -->
  <!-- Card Left: PROBLEM -->
  <rect x="30" y="370" width="435" height="165" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="247" y="393" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">1. ПРОБЛЕМА: Без розв'язувальних ємностей C5/C1</text>
  <text x="50" y="418" font-size="11" fill="#1a1a1a">• Сумарний пік струму: I_peak = I_WiFi + I_SD &gt; 450 mA</text>
  <text x="50" y="438" font-size="11" fill="#c0392b">• Опір доріжок викликає просідання напруги V_DD &lt; 2.8V</text>
  <text x="50" y="458" font-size="11" fill="#1a1a1a">• Спрацьовує вбудований детектор Brownout в ESP32</text>

  <rect x="50" y="473" width="395" height="45" rx="4" fill="white" stroke="#c0392b" stroke-width="1.5"/>
  <text x="247" y="493" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">НАСЛІДОК: Раптове перезавантаження ESP32</text>
  <text x="247" y="508" text-anchor="middle" font-size="11" fill="#c0392b">та пошкодження файлової системи MicroSD!</text>

  <!-- Card Right: SOLUTION -->
  <rect x="495" y="370" width="435" height="165" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="712" y="393" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">2. РОЗВ'ЯЗОК: Згладжувальне коло C1...C6</text>
  <text x="515" y="418" font-size="11" fill="#1a1a1a">• C5 (47–100 µF) миттєво віддає заряд при записі SDMMC</text>
  <text x="515" y="438" font-size="11" fill="#27ae60">• C1/C3 гасять НЧ сплески, C2/C4/C6 — високочастотні завади</text>
  <text x="515" y="458" font-size="11" fill="#1a1a1a">• Напруга шини стабільна: ΔV_DD &lt; 0.1V при зйомці UXGA</text>

  <rect x="515" y="473" width="395" height="45" rx="4" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <text x="712" y="493" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">РЕЗУЛЬТАТ: Надійна зйомка кадрів UXGA (1600×1200)</text>
  <text x="712" y="508" text-anchor="middle" font-size="11" fill="#27ae60">і безпомилковий запис JPEG в автономному режимі</text>
</svg>
