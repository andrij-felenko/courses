<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr_blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr_red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr_green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Структура HTTP MJPEG-відеопотоку (multipart/x-mixed-replace)</text>
  <text x="480" y="55" text-anchor="middle" font-size="13" fill="#6b7280">Безперервна передача кадрів JPEG у єдиному HTTP-з'єднанні з межею-розділювачем boundary</text>

  <!-- Panel 1: Initial HTTP Response -->
  <rect x="30" y="80" width="280" height="370" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="170" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">1. HTTP-відповідь сервера</text>
  <text x="170" y="128" text-anchor="middle" font-size="12" fill="#6b7280">Початкові заголовки з'єднання</text>

  <!-- Inner Code Card Panel 1 -->
  <rect x="45" y="145" width="250" height="285" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  
  <text x="60" y="170" font-size="12" font-weight="bold" fill="#27ae60">HTTP/1.1 200 OK</text>
  <text x="60" y="195" font-size="12" font-weight="bold" fill="#2457d6">Content-Type:</text>
  <text x="75" y="215" font-size="12" fill="#2457d6">multipart/x-mixed-replace;</text>
  <text x="75" y="235" font-size="12" font-weight="bold" fill="#c0392b">boundary=123456789</text>
  <text x="60" y="260" font-size="12" fill="#1a1a1a">Transfer-Encoding: chunked</text>
  <text x="60" y="280" font-size="12" fill="#1a1a1a">Access-Control-Allow-Origin: *</text>
  <text x="60" y="300" font-size="12" fill="#1a1a1a">Connection: keep-alive</text>

  <line x1="55" y1="315" x2="285" y2="315" stroke="#d0d7de" stroke-width="1"/>

  <text x="170" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Особливість multipart:</text>
  <text x="170" y="355" text-anchor="middle" font-size="12" fill="#6b7280">Сервер утримує сокет,</text>
  <text x="170" y="375" text-anchor="middle" font-size="12" fill="#6b7280">браузер оновлює кадр</text>
  <text x="170" y="395" text-anchor="middle" font-size="12" fill="#6b7280">при кожній новій межі</text>
  <text x="170" y="415" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">без перезавантаження</text>

  <!-- Connection Arrow Panel 1 to Panel 2 -->
  <line x1="310" y1="260" x2="332" y2="260" stroke="#2457d6" stroke-width="2" marker-end="url(#arr_blue)"/>

  <!-- Panel 2: Video Stream Payload -->
  <rect x="340" y="80" width="590" height="370" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="635" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">2. Послідовність кадрів у відеопотоці (Data Stream)</text>
  <text x="635" y="128" text-anchor="middle" font-size="12" fill="#6b7280">Потік складається з заголовка межі boundary та бінарного JPEG-кадру</text>

  <!-- Column 1: Boundary Header N -->
  <rect x="355" y="145" width="165" height="285" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="437" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Межа boundary</text>
  <text x="437" y="190" text-anchor="middle" font-size="12" fill="#6b7280">Заголовок кадру №N</text>

  <text x="365" y="220" font-size="12" font-weight="bold" fill="#c0392b">--123456789</text>
  <text x="365" y="245" font-size="12" fill="#1a1a1a">Content-Type:</text>
  <text x="375" y="265" font-size="12" font-weight="bold" fill="#2457d6">image/jpeg</text>
  <text x="365" y="290" font-size="12" fill="#1a1a1a">Content-Length:</text>
  <text x="375" y="310" font-size="12" font-weight="bold" fill="#1a1a1a">34820</text>

  <line x1="365" y1="325" x2="510" y2="325" stroke="#d0d7de" stroke-width="1"/>

  <text x="437" y="345" text-anchor="middle" font-size="12" fill="#6b7280">\r\n\r\n (порожній</text>
  <text x="437" y="365" text-anchor="middle" font-size="12" fill="#6b7280">рядок перед</text>
  <text x="437" y="385" text-anchor="middle" font-size="12" fill="#6b7280">бінарним кадром)</text>
  <text x="437" y="415" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Старт розбору</text>

  <!-- Arrow Col 1 to Col 2 -->
  <line x1="520" y1="280" x2="529" y2="280" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr_blue)"/>

  <!-- Column 2: JPEG Frame N Payload -->
  <rect x="535" y="145" width="175" height="285" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="622" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Тіло кадру №N</text>
  <text x="622" y="190" text-anchor="middle" font-size="12" fill="#6b7280">Стиснене зображення</text>

  <!-- Inner JPEG Container -->
  <rect x="545" y="205" width="155" height="105" rx="4" fill="white" stroke="#27ae60" stroke-width="1"/>
  <text x="622" y="225" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">SOI: 0xFFD8</text>
  <text x="622" y="248" text-anchor="middle" font-size="12" fill="#1a1a1a">Бінарний JPEG</text>
  <text x="622" y="268" text-anchor="middle" font-size="12" fill="#6b7280">(з PSRAM буфера)</text>
  <text x="622" y="293" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">EOI: 0xFFD9</text>

  <text x="622" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">OV3640 / esp_camera</text>
  <text x="622" y="350" text-anchor="middle" font-size="12" fill="#6b7280">Формат: JPEG</text>
  <text x="622" y="370" text-anchor="middle" font-size="12" fill="#6b7280">\r\n в кінці даних</text>
  <text x="622" y="395" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Відображення на &lt;img&gt;</text>
  <text x="622" y="415" text-anchor="middle" font-size="12" fill="#6b7280">у веббраузері</text>

  <!-- Arrow Col 2 to Col 3 -->
  <line x1="710" y1="280" x2="719" y2="280" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr_blue)"/>

  <!-- Column 3: Boundary Header N+1 -->
  <rect x="725" y="145" width="165" height="285" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="807" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Наступна межа</text>
  <text x="807" y="190" text-anchor="middle" font-size="12" fill="#6b7280">Заголовок кадру №N+1</text>

  <text x="735" y="220" font-size="12" font-weight="bold" fill="#c0392b">--123456789</text>
  <text x="735" y="245" font-size="12" fill="#1a1a1a">Content-Type:</text>
  <text x="745" y="265" font-size="12" font-weight="bold" fill="#2457d6">image/jpeg</text>
  <text x="735" y="290" font-size="12" fill="#1a1a1a">Content-Length:</text>
  <text x="745" y="310" font-size="12" font-weight="bold" fill="#1a1a1a">35110</text>

  <line x1="735" y1="325" x2="880" y2="325" stroke="#d0d7de" stroke-width="1"/>

  <text x="807" y="345" text-anchor="middle" font-size="12" fill="#6b7280">\r\n\r\n (початок</text>
  <text x="807" y="365" text-anchor="middle" font-size="12" fill="#6b7280">наступного кадру</text>
  <text x="807" y="385" text-anchor="middle" font-size="12" fill="#6b7280">у відеопотоці)</text>
  <text x="807" y="415" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Заміна кадру №N</text>

  <!-- Continuation indicator -->
  <text x="907" y="285" text-anchor="middle" font-size="16" font-weight="bold" fill="#6b7280">...</text>
</svg>
