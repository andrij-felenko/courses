<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#374151"/>
    </marker>
  </defs>

  <!-- Canvas White Background -->
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>

  <!-- Header & Subtitle -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема тридоменного живлення та розв'язання сенсора OV3640</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Роздільні LDO-регулятори 2.8В/1.5В та розв'язувальні фільтри захищають відеотракт від перешкод</text>

  <!-- PANEL 0: INPUT POWER (Left Block) -->
  <rect x="25" y="85" width="160" height="450" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="105" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Вхідне живлення</text>
  <text x="105" y="125" text-anchor="middle" font-size="12" fill="#6b7280">від плати ESP32</text>

  <!-- VCC Input Box -->
  <rect x="40" y="150" width="130" height="40" fill="#ffffff" stroke="#c0392b" stroke-width="1.5" rx="4"/>
  <text x="105" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">VCC (+5V / +3.3V)</text>

  <!-- Specifications Badge -->
  <rect x="35" y="265" width="140" height="125" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="105" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Вимоги до ДЖ:</text>
  <text x="105" y="305" text-anchor="middle" font-size="11" fill="#6b7280">Пульсації &lt; 10 мВ</text>
  <text x="105" y="323" text-anchor="middle" font-size="11" fill="#6b7280">Струм пік &gt; 300 мА</text>
  <text x="105" y="341" text-anchor="middle" font-size="11" fill="#6b7280">PSRR LDO &gt; 60 дБ</text>
  <text x="105" y="359" text-anchor="middle" font-size="11" fill="#6b7280">f_ripple = 100 кГц</text>
  <text x="105" y="377" text-anchor="middle" font-size="11" fill="#27ae60">Низький шум LDO</text>

  <!-- GND Input Box -->
  <rect x="40" y="475" width="130" height="40" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="105" y="499" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">GND (Спільна)</text>


  <!-- PANEL 1: AVDD DOMAIN (Top Middle Block) -->
  <rect x="205" y="85" width="490" height="135" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="8"/>
  <text x="220" y="107" font-size="13" font-weight="bold" fill="#27ae60">Аналоговий домен AVDD = 2.8 В (Матриця, АЦП, PLL)</text>

  <!-- LDO1 -->
  <rect x="220" y="120" width="95" height="65" fill="#ffffff" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="267" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">LDO1 2.8V</text>
  <text x="267" y="163" text-anchor="middle" font-size="11" fill="#6b7280">(Low Noise)</text>

  <!-- FB1 (Ferrite Bead) -->
  <rect x="355" y="140" width="45" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" rx="3"/>
  <text x="377" y="133" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">FB1</text>
  <text x="377" y="177" text-anchor="middle" font-size="11" fill="#6b7280">100 Ом @ 100МГц</text>

  <!-- AVDD Rail & Capacitors -->
  <line x1="315" y1="152" x2="355" y2="152" stroke="#27ae60" stroke-width="2"/>
  <line x1="400" y1="152" x2="685" y2="152" stroke="#27ae60" stroke-width="2"/>
  <line x1="420" y1="200" x2="660" y2="200" stroke="#2457d6" stroke-width="2"/>

  <!-- C1 (10 uF Bulk) -->
  <line x1="435" y1="152" x2="435" y2="169" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="427" y1="169" x2="443" y2="169" stroke="#27ae60" stroke-width="2"/>
  <line x1="427" y1="175" x2="443" y2="175" stroke="#27ae60" stroke-width="2"/>
  <line x1="435" y1="175" x2="435" y2="200" stroke="#2457d6" stroke-width="1.5"/>
  <text x="445" y="176" font-size="11" fill="#1a1a1a">C1 10мкФ</text>

  <!-- C2 (0.1 uF HF) -->
  <line x1="520" y1="152" x2="520" y2="169" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="512" y1="169" x2="528" y2="169" stroke="#27ae60" stroke-width="2"/>
  <line x1="512" y1="175" x2="528" y2="175" stroke="#27ae60" stroke-width="2"/>
  <line x1="520" y1="175" x2="520" y2="200" stroke="#2457d6" stroke-width="1.5"/>
  <text x="530" y="176" font-size="11" fill="#1a1a1a">C2 0.1мкФ</text>

  <!-- C3 (10 nF VHF) -->
  <line x1="605" y1="152" x2="605" y2="169" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="597" y1="169" x2="613" y2="169" stroke="#27ae60" stroke-width="2"/>
  <line x1="597" y1="175" x2="613" y2="175" stroke="#27ae60" stroke-width="2"/>
  <line x1="605" y1="175" x2="605" y2="200" stroke="#2457d6" stroke-width="1.5"/>
  <text x="615" y="176" font-size="11" fill="#1a1a1a">C3 10нФ</text>

  <!-- Ground Symbol AVDD -->
  <line x1="660" y1="200" x2="660" y2="206" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="653" y1="206" x2="667" y2="206" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="656" y1="209" x2="664" y2="209" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="658" y1="212" x2="662" y2="212" stroke="#2457d6" stroke-width="1.5"/>


  <!-- PANEL 2: DOVDD DOMAIN (Middle Block) -->
  <rect x="205" y="242" width="490" height="135" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="8"/>
  <text x="220" y="264" font-size="13" font-weight="bold" fill="#2457d6">Інтерфейсний домен DOVDD = 2.8 В (DVP Y2-Y9, SCCB, XCLK, PCLK)</text>

  <!-- LDO2 -->
  <rect x="220" y="277" width="95" height="65" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="267" y="302" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">LDO2 2.8V</text>
  <text x="267" y="320" text-anchor="middle" font-size="11" fill="#6b7280">(I/O Buffer)</text>

  <!-- DOVDD Rail & Capacitors -->
  <line x1="315" y1="309" x2="685" y2="309" stroke="#2457d6" stroke-width="2"/>
  <line x1="420" y1="357" x2="660" y2="357" stroke="#2457d6" stroke-width="2"/>

  <!-- C4 (10 uF Bulk) -->
  <line x1="435" y1="309" x2="435" y2="326" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="427" y1="326" x2="443" y2="326" stroke="#2457d6" stroke-width="2"/>
  <line x1="427" y1="332" x2="443" y2="332" stroke="#2457d6" stroke-width="2"/>
  <line x1="435" y1="332" x2="435" y2="357" stroke="#2457d6" stroke-width="1.5"/>
  <text x="445" y="333" font-size="11" fill="#1a1a1a">C4 10мкФ</text>

  <!-- C5 (0.1 uF HF) -->
  <line x1="545" y1="309" x2="545" y2="326" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="537" y1="326" x2="553" y2="326" stroke="#2457d6" stroke-width="2"/>
  <line x1="537" y1="332" x2="553" y2="332" stroke="#2457d6" stroke-width="2"/>
  <line x1="545" y1="332" x2="545" y2="357" stroke="#2457d6" stroke-width="1.5"/>
  <text x="555" y="333" font-size="11" fill="#1a1a1a">C5 0.1мкФ</text>

  <!-- Ground Symbol DOVDD -->
  <line x1="660" y1="357" x2="660" y2="363" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="653" y1="363" x2="667" y2="363" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="656" y1="366" x2="664" y2="366" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="658" y1="369" x2="662" y2="369" stroke="#2457d6" stroke-width="1.5"/>


  <!-- PANEL 3: DVDD DOMAIN (Bottom Block) -->
  <rect x="205" y="400" width="490" height="135" fill="#f4f6f8" stroke="#4b5563" stroke-width="1.5" rx="8"/>
  <text x="220" y="422" font-size="13" font-weight="bold" fill="#374151">Домен цифрового ядра DVDD = 1.5 В (Внутрішній DSP та логіка)</text>

  <!-- LDO3 -->
  <rect x="220" y="435" width="95" height="65" fill="#ffffff" stroke="#4b5563" stroke-width="1.5" rx="4"/>
  <text x="267" y="460" text-anchor="middle" font-size="12" font-weight="bold" fill="#374151">LDO3 1.5V</text>
  <text x="267" y="478" text-anchor="middle" font-size="11" fill="#6b7280">(Core Power)</text>

  <!-- DVDD Rail & Capacitors -->
  <line x1="315" y1="467" x2="685" y2="467" stroke="#374151" stroke-width="2"/>
  <line x1="420" y1="515" x2="660" y2="515" stroke="#2457d6" stroke-width="2"/>

  <!-- C6 (4.7 uF Bulk) -->
  <line x1="435" y1="467" x2="435" y2="484" stroke="#374151" stroke-width="1.5"/>
  <line x1="427" y1="484" x2="443" y2="484" stroke="#374151" stroke-width="2"/>
  <line x1="427" y1="490" x2="443" y2="490" stroke="#374151" stroke-width="2"/>
  <line x1="435" y1="490" x2="435" y2="515" stroke="#2457d6" stroke-width="1.5"/>
  <text x="445" y="491" font-size="11" fill="#1a1a1a">C6 4.7мкФ</text>

  <!-- C7 (0.1 uF HF) -->
  <line x1="545" y1="467" x2="545" y2="484" stroke="#374151" stroke-width="1.5"/>
  <line x1="537" y1="484" x2="553" y2="484" stroke="#374151" stroke-width="2"/>
  <line x1="537" y1="490" x2="553" y2="490" stroke="#374151" stroke-width="2"/>
  <line x1="545" y1="490" x2="545" y2="515" stroke="#2457d6" stroke-width="1.5"/>
  <text x="555" y="491" font-size="11" fill="#1a1a1a">C7 0.1мкФ</text>

  <!-- Ground Symbol DVDD -->
  <line x1="660" y1="515" x2="660" y2="521" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="653" y1="521" x2="667" y2="521" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="656" y1="524" x2="664" y2="524" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="658" y1="527" x2="662" y2="527" stroke="#2457d6" stroke-width="1.5"/>


  <!-- INTER-BLOCK WIRING -->
  <!-- VCC Trunk Line -->
  <path d="M 170,170 L 192,170 L 192,467 L 220,467" fill="none" stroke="#c0392b" stroke-width="2"/>
  <path d="M 192,152 L 220,152" fill="none" stroke="#c0392b" stroke-width="2"/>
  <path d="M 192,309 L 220,309" fill="none" stroke="#c0392b" stroke-width="2"/>

  <!-- Junction Dots on VCC Trunk -->
  <circle cx="192" cy="152" r="3.5" fill="#c0392b"/>
  <circle cx="192" cy="309" r="3.5" fill="#c0392b"/>

  <!-- GND Line from Panel 0 -->
  <path d="M 170,495 L 192,495" fill="none" stroke="#2457d6" stroke-width="2"/>
  <circle cx="192" cy="495" r="3.5" fill="#2457d6"/>

  <!-- Connections from Domain Rails to Target Module Pins -->
  <path d="M 685,152 L 705,152 L 705,165 L 730,165" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <path d="M 685,309 L 705,309 L 705,322 L 730,322" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <path d="M 685,467 L 705,467 L 705,480 L 730,480" fill="none" stroke="#374151" stroke-width="2" marker-end="url(#arr-gray)"/>


  <!-- PANEL 4: OV3640 TARGET SENSOR MODULE (Right Block) -->
  <rect x="715" y="85" width="220" height="450" fill="#f4f6f8" stroke="#2457d6" stroke-width="2" rx="8"/>
  <path d="M 715,120 L 715,93 Q 715,85 723,85 L 927,85 Q 935,85 935,93 L 935,120 Z" fill="#2457d6"/>
  <text x="825" y="107" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Сенсор OV3640 / 24-pin FPC</text>

  <!-- Pin 1: AVDD Target Terminal -->
  <rect x="730" y="135" width="190" height="60" fill="#ffffff" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="740" y="157" font-size="12" font-weight="bold" fill="#27ae60">AVDD (2.8В) — Аналог</text>
  <text x="740" y="175" font-size="11" fill="#6b7280">Сенсорна матриця, АЦП</text>

  <!-- Star Ground Note Box -->
  <rect x="730" y="210" width="190" height="65" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="825" y="228" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Земля: AGND + DGND</text>
  <text x="825" y="246" text-anchor="middle" font-size="11" fill="#6b7280">З'єднані в одній точці</text>
  <text x="825" y="262" text-anchor="middle" font-size="11" fill="#27ae60">(Star Ground під чипом)</text>

  <!-- Pin 2: DOVDD Target Terminal -->
  <rect x="730" y="292" width="190" height="60" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="740" y="314" font-size="12" font-weight="bold" fill="#2457d6">DOVDD (2.8В) — I/O</text>
  <text x="740" y="332" font-size="11" fill="#6b7280">DVP (Y2-Y9), SCCB, Clks</text>

  <!-- Pin 3: DVDD Target Terminal -->
  <rect x="730" y="450" width="190" height="60" fill="#ffffff" stroke="#374151" stroke-width="1.5" rx="4"/>
  <text x="740" y="472" font-size="12" font-weight="bold" fill="#374151">DVDD (1.5В) — Ядро</text>
  <text x="740" y="490" font-size="11" fill="#6b7280">Внутрішній DSP, ядро</text>

</svg>
