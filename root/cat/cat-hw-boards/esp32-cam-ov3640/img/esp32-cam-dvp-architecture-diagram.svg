<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0,1 L 8,4.5 L 0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-blue-thick" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0,1.5 L 10,5.5 L 0,9.5 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0,1 L 8,4.5 L 0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0,1 L 8,4.5 L 0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-green-start" markerWidth="9" markerHeight="9" refX="1.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 8,1 L 0,4.5 L 8,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Архітектура підключення сенсора OV3640 до ESP32 через шину DVP</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Розділення шин керування SCCB, тактування, кадрової синхронізації та 8-бітного DMA-потоку даних</text>

  <!-- Left Block: OV3640 Sensor Module -->
  <rect x="40" y="80" width="220" height="370" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <path d="M 40,88 A 8,8 0 0 1 48,80 L 252,80 A 8,8 0 0 1 260,80 L 260,120 L 40,120 Z" fill="#2457d6"/>
  <text x="150" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Сенсор OV3640 (2 МП)</text>

  <!-- Features card inside OV3640 -->
  <rect x="50" y="135" width="145" height="135" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="122" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Параметри сенсора</text>
  <text x="60" y="175" font-size="11" fill="#1a1a1a">• 2 МП (2048×1536)</text>
  <text x="60" y="195" font-size="11" fill="#1a1a1a">• RAW / YUV / JPEG</text>
  <text x="60" y="215" font-size="11" fill="#1a1a1a">• Вбудований ISP</text>
  <text x="60" y="235" font-size="11" fill="#1a1a1a">• Живлення 1.8В/2.8В</text>
  <text x="60" y="255" font-size="11" fill="#1a1a1a">• DVP + SCCB</text>

  <!-- OV3640 Pin Labels -->
  <text x="254" y="162" text-anchor="end" font-size="11" font-weight="bold" fill="#1a1a1a">XCLK</text>
  <text x="254" y="186" text-anchor="end" font-size="11" font-weight="bold" fill="#1a1a1a">PCLK</text>
  <text x="254" y="228" text-anchor="end" font-size="11" font-weight="bold" fill="#1a1a1a">VSYNC</text>
  <text x="254" y="252" text-anchor="end" font-size="11" font-weight="bold" fill="#1a1a1a">HREF</text>
  <text x="254" y="316" text-anchor="end" font-size="11" font-weight="bold" fill="#1a1a1a">D0–D7</text>
  <text x="254" y="402" text-anchor="end" font-size="11" font-weight="bold" fill="#1a1a1a">SIOC</text>
  <text x="254" y="428" text-anchor="end" font-size="11" font-weight="bold" fill="#1a1a1a">SIOD</text>

  <!-- Right Block: ESP32 SoC Controller -->
  <rect x="700" y="80" width="220" height="370" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <path d="M 700,88 A 8,8 0 0 1 708,80 L 912,80 A 8,8 0 0 1 920,80 L 920,120 L 700,120 Z" fill="#2457d6"/>
  <text x="810" y="105" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">Мікроконтролер ESP32</text>

  <!-- ESP32 Internal Sub-Blocks -->
  <rect x="760" y="138" width="150" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="835" y="152" text-anchor="middle" font-size="10" font-weight="bold" fill="#2457d6">Генератор XCLK</text>
  <text x="835" y="164" text-anchor="middle" font-size="10" fill="#6b7280">(LEDC)</text>

  <rect x="760" y="176" width="150" height="175" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="835" y="194" text-anchor="middle" font-size="10" font-weight="bold" fill="#2457d6">Контролер I2S / DVP</text>

  <rect x="768" y="295" width="134" height="46" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="835" y="312" text-anchor="middle" font-size="10" font-weight="bold" fill="#1a1a1a">DMA Буфер</text>
  <text x="835" y="328" text-anchor="middle" font-size="10" fill="#6b7280">(у PSRAM)</text>

  <rect x="760" y="375" width="150" height="58" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="835" y="395" text-anchor="middle" font-size="10" font-weight="bold" fill="#27ae60">Інтерфейс I2C (SCCB)</text>
  <text x="835" y="415" text-anchor="middle" font-size="10" fill="#1a1a1a">Регістри камери</text>

  <!-- ESP32 Pin Labels -->
  <text x="705" y="162" font-size="10" font-weight="bold" fill="#2457d6">GPIO0</text>
  <text x="705" y="186" font-size="10" font-weight="bold" fill="#2457d6">PCLK_IN</text>
  <text x="705" y="228" font-size="10" font-weight="bold" fill="#1a1a1a">VSYNC</text>
  <text x="705" y="252" font-size="10" font-weight="bold" fill="#1a1a1a">HREF</text>
  <text x="705" y="316" font-size="10" font-weight="bold" fill="#2457d6">Y2..Y9</text>
  <text x="705" y="402" font-size="10" font-weight="bold" fill="#27ae60">SIOC</text>
  <text x="705" y="428" font-size="10" font-weight="bold" fill="#27ae60">SIOD</text>

  <!-- ZONE 1: Clocking -->
  <rect x="275" y="130" width="410" height="60" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="480" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b7280">ТАКТУВАННЯ (CLOCKING)</text>
  <line x1="700" y1="158" x2="268" y2="158" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="480" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">XCLK (Системна частота 10–24 МГц)</text>
  <line x1="260" y1="182" x2="692" y2="182" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="480" y="174" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">PCLK (Тактова частота пікселів)</text>

  <!-- ZONE 2: Frame Sync -->
  <rect x="275" y="195" width="410" height="65" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="480" y="207" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b7280">СИНХРОНІЗАЦІЯ КАДРУ (FRAME SYNC)</text>
  <line x1="260" y1="224" x2="692" y2="224" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>
  <text x="480" y="216" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">VSYNC (Кадрова синхронізація)</text>
  <line x1="260" y1="248" x2="692" y2="248" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>
  <text x="480" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">HREF / HSYNC (Рядкова синхронізація)</text>

  <!-- ZONE 3: 8-bit Data Bus -->
  <rect x="275" y="270" width="410" height="85" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="285" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">8-БІТНА ПАРАЛЕЛЬНА ШИНА ДАНИХ DVP</text>
  <line x1="260" y1="312" x2="692" y2="312" stroke="#2457d6" stroke-width="6" marker-end="url(#arr-blue-thick)"/>
  <text x="480" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">D0, D1, D2, D3, D4, D5, D6, D7 [8-bit Data]</text>
  <text x="480" y="338" text-anchor="middle" font-size="11" fill="#1a1a1a">Паралельний потік пікселів в I2S DMA кадровий буфер</text>

  <!-- ZONE 4: SCCB Register Control -->
  <rect x="275" y="365" width="410" height="70" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="379" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">ШИНА КЕРУВАННЯ SCCB (I2C СУМІСНА)</text>
  <line x1="700" y1="398" x2="268" y2="398" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="480" y="390" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">SIOC / SCL (Тактування шини SCCB)</text>
  <line x1="268" y1="424" x2="692" y2="424" stroke="#27ae60" stroke-width="2" marker-start="url(#arr-green-start)" marker-end="url(#arr-green)"/>
  <text x="480" y="416" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">SIOD / SDA (Двоспрямовані дані конфігурації)</text>
</svg>
