<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Структура HTTP multipart/x-mixed-replace для MJPEG-потоку</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Передача послідовних кадрів JPEG у єдиному HTTP-з'єднанні з межовими розділювачами (boundary)</text>

  <!-- Секція 1: Огляд потоку в часі -->
  <rect x="30" y="90" width="900" height="90" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="112" font-size="13" font-weight="bold" fill="#1a1a1a">Послідовність передачі кадрових пакетів у часі:</text>

  <!-- Блоки потоку -->
  <rect x="45" y="125" width="160" height="40" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="125" y="150" font-size="12" fill="#6b7280" text-anchor="middle">HTTP 200 OK Header</text>

  <line x1="205" y1="145" x2="218" y2="145" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="220" y="125" width="200" height="40" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="320" y="150" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Кадр N (Boundary + JPEG)</text>

  <line x1="420" y1="145" x2="433" y2="145" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="435" y="125" width="200" height="40" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="535" y="150" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Кадр N+1 (Boundary + JPEG)</text>

  <line x1="635" y1="145" x2="648" y2="145" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="650" y="125" width="200" height="40" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="750" y="150" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Кадр N+2...</text>

  <text x="870" y="150" font-size="14" fill="#6b7280">...</text>

  <!-- Секція 2: Анатомія кадрового пакета -->
  <rect x="30" y="195" width="900" height="265" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="218" font-size="14" font-weight="bold" fill="#1a1a1a">Детальна структура одного кадрового пакета (Frame Packet):</text>

  <!-- Байтовий потік пакета -->
  <rect x="45" y="232" width="195" height="44" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="142" y="250" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">--boundary</text>
  <text x="142" y="266" font-size="12" fill="#c0392b" text-anchor="middle">\r\n (CRLF)</text>

  <rect x="255" y="232" width="230" height="44" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="370" y="250" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Content-Type &amp; Length</text>
  <text x="370" y="266" font-size="12" fill="#2457d6" text-anchor="middle">\r\n\r\n (Headers End)</text>

  <rect x="500" y="232" width="280" height="44" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="640" y="250" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">JPEG Binary Payload</text>
  <text x="640" y="266" font-size="12" fill="#27ae60" text-anchor="middle">0xFFD8 ... 0xFFD9</text>

  <rect x="795" y="232" width="120" height="44" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
  <text x="855" y="250" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">CRLF</text>
  <text x="855" y="266" font-size="12" fill="#6b7280" text-anchor="middle">\r\n</text>

  <!-- Пунктирні з'єднання між лінійкою та картками -->
  <line x1="142" y1="276" x2="142" y2="292" stroke="#c0392b" stroke-dasharray="3,3"/>
  <line x1="370" y1="276" x2="370" y2="292" stroke="#2457d6" stroke-dasharray="3,3"/>
  <line x1="640" y1="276" x2="640" y2="292" stroke="#27ae60" stroke-dasharray="3,3"/>
  <line x1="855" y1="276" x2="855" y2="292" stroke="#6b7280" stroke-dasharray="3,3"/>

  <!-- Деталізовані картки опису -->
  <!-- Картка 1: Boundary -->
  <rect x="45" y="292" width="195" height="152" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="55" y="312" font-size="12" font-weight="bold" fill="#c0392b">1. Розділювач кадрів</text>
  <text x="55" y="332" font-size="12" fill="#c0392b">--123456789...</text>
  <text x="55" y="350" font-size="12" fill="#c0392b">\r\n (CRLF)</text>
  <text x="55" y="376" font-size="12" fill="#6b7280">Межа (boundary)</text>
  <text x="55" y="394" font-size="12" fill="#6b7280">з початкового</text>
  <text x="55" y="412" font-size="12" fill="#6b7280">HTTP-заголовка.</text>

  <!-- Картка 2: Заголовки -->
  <rect x="255" y="292" width="230" height="152" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="265" y="312" font-size="12" font-weight="bold" fill="#2457d6">2. Заголовки частини</text>
  <text x="265" y="332" font-size="12" fill="#1a1a1a">Content-Type: image/jpeg</text>
  <text x="265" y="350" font-size="12" fill="#1a1a1a">Content-Length: 24580</text>
  <text x="265" y="368" font-size="12" fill="#2457d6">\r\n (порожній рядок)</text>
  <text x="265" y="394" font-size="12" fill="#6b7280">Задає MIME-тип кадру</text>
  <text x="265" y="412" font-size="12" fill="#6b7280">та довжину у байтах.</text>

  <!-- Картка 3: JPEG payload -->
  <rect x="500" y="292" width="280" height="152" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="510" y="312" font-size="12" font-weight="bold" fill="#27ae60">3. Дані кадру (JPEG)</text>
  <text x="510" y="332" font-size="12" fill="#1a1a1a">0xFFD8 (SOI marker)</text>
  <text x="510" y="350" font-size="12" fill="#1a1a1a">[ ... бінарний JPEG ... ]</text>
  <text x="510" y="368" font-size="12" fill="#1a1a1a">0xFFD9 (EOI marker)</text>
  <text x="510" y="394" font-size="12" fill="#6b7280">Зображення з OV3640,</text>
  <text x="510" y="412" font-size="12" fill="#6b7280">збережене в PSRAM.</text>

  <!-- Картка 4: CRLF -->
  <rect x="795" y="292" width="120" height="152" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1"/>
  <text x="805" y="312" font-size="12" font-weight="bold" fill="#1a1a1a">4. Завершення</text>
  <text x="805" y="332" font-size="12" fill="#6b7280">\r\n (CRLF)</text>
  <text x="805" y="365" font-size="12" fill="#6b7280">Перехід</text>
  <text x="805" y="383" font-size="12" fill="#6b7280">рядка після</text>
  <text x="805" y="401" font-size="12" fill="#6b7280">кадру.</text>
</svg>
