<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма сигналів DVP та конвеєр апаратного кодування JPEG в OV3640</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Синхронізація PCLK/VSYNC/HREF та апаратне стиснення піксельного потоку перед передачею в DMA ESP32</text>

  <!-- ПАНЕЛЬ 1: Часова діаграма сигналів DVP -->
  <rect x="20" y="70" width="920" height="230" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="40" y="94" font-size="14" font-weight="bold" fill="#1a1a1a">1. Часова діаграма сигналів DVP (PCLK, VSYNC, HREF, D[7:0])</text>

  <!-- Назви сигналів -->
  <text x="40" y="132" font-size="13" font-weight="bold" fill="#1a1a1a">VSYNC</text>
  <text x="85" y="132" font-size="12" fill="#6b7280">(Кадр)</text>

  <text x="40" y="177" font-size="13" font-weight="bold" fill="#1a1a1a">HREF</text>
  <text x="80" y="177" font-size="12" fill="#6b7280">(Рядок)</text>

  <text x="40" y="222" font-size="13" font-weight="bold" fill="#1a1a1a">PCLK</text>
  <text x="80" y="222" font-size="12" fill="#6b7280">(Такти)</text>

  <text x="40" y="267" font-size="13" font-weight="bold" fill="#1a1a1a">D[7:0]</text>
  <text x="90" y="267" font-size="12" fill="#6b7280">(Байти)</text>

  <!-- VSYNC хвиля -->
  <path d="M 160,118 L 220,118 L 220,138 L 860,138 L 860,118 L 910,118" stroke="#c0392b" stroke-width="2.5" fill="none"/>
  <text x="190" y="110" font-size="12" fill="#c0392b" text-anchor="middle">V_blank</text>
  <text x="540" y="156" font-size="12" fill="#27ae60" text-anchor="middle">Активний кадр (VSYNC = 0)</text>

  <!-- HREF хвиля -->
  <path d="M 160,183 L 240,183 L 240,163 L 480,163 L 480,183 L 540,183 L 540,163 L 780,163 L 780,183 L 910,183" stroke="#2457d6" stroke-width="2.5" fill="none"/>
  <text x="360" y="155" font-size="12" fill="#2457d6" text-anchor="middle">Рядок 1 (HREF = 1)</text>
  <text x="510" y="198" font-size="12" fill="#6b7280" text-anchor="middle">H_blank</text>
  <text x="660" y="155" font-size="12" fill="#2457d6" text-anchor="middle">Рядок 2 (HREF = 1)</text>

  <!-- PCLK хвиля -->
  <path d="M 160,226 L 168,226 L 168,210 L 176,210 L 176,226 L 184,226 L 184,210 L 192,210 L 192,226 L 200,226 L 200,210 L 208,210 L 208,226 L 216,226 L 216,210 L 224,210 L 224,226 L 232,226 L 232,210 L 240,210 L 240,226 L 248,226 L 248,210 L 256,210 L 256,226 L 264,226 L 264,210 L 272,210 L 272,226 L 280,226 L 280,210 L 288,210 L 288,226 L 296,226 L 296,210 L 304,210 L 304,226 L 312,226 L 312,210 L 320,210 L 320,226 L 328,226 L 328,210 L 336,210 L 336,226 L 344,226 L 344,210 L 352,210 L 352,226 L 360,226 L 360,210 L 368,210 L 368,226 L 376,226 L 376,210 L 384,210 L 384,226 L 392,226 L 392,210 L 400,210 L 400,226 L 408,226 L 408,210 L 416,210 L 416,226 L 424,226 L 424,210 L 432,210 L 432,226 L 440,226 L 440,210 L 448,210 L 448,226 L 456,226 L 456,210 L 464,210 L 464,226 L 472,226 L 472,210 L 480,210 L 480,226 L 488,226 L 488,210 L 496,210 L 496,226 L 504,226 L 504,210 L 512,210 L 512,226 L 520,226 L 520,210 L 528,210 L 528,226 L 536,226 L 536,210 L 544,210 L 544,226 L 552,226 L 552,210 L 560,210 L 560,226 L 568,226 L 568,210 L 576,210 L 576,226 L 584,226 L 584,210 L 592,210 L 592,226 L 600,226 L 600,210 L 608,210 L 608,226 L 616,226 L 616,210 L 624,210 L 624,226 L 632,226 L 632,210 L 640,210 L 640,226 L 648,226 L 648,210 L 656,210 L 656,226 L 664,226 L 664,210 L 672,210 L 672,226 L 680,226 L 680,210 L 688,210 L 688,226 L 696,226 L 696,210 L 704,210 L 704,226 L 712,226 L 712,210 L 720,210 L 720,226 L 728,226 L 728,210 L 736,210 L 736,226 L 744,226 L 744,210 L 752,210 L 752,226 L 760,226 L 760,210 L 768,210 L 768,226 L 776,226 L 776,210 L 784,210 L 784,226 L 792,226 L 792,210 L 800,210 L 800,226 L 808,226 L 808,210 L 816,210 L 816,226 L 824,226 L 824,210 L 832,210 L 832,226 L 840,226 L 840,210 L 848,210 L 848,226 L 856,226 L 856,210 L 864,210 L 864,226 L 872,226 L 872,210 L 880,210 L 880,226 L 888,226 L 888,210 L 896,210 L 896,226 L 904,226 L 904,210 L 910,210" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>

  <!-- D[7:0] Байти даних -->
  <line x1="160" y1="265" x2="240" y2="265" stroke="#6b7280" stroke-dasharray="3,3" stroke-width="1.5"/>
  <text x="200" y="247" font-size="12" fill="#6b7280" text-anchor="middle">Неактивний стан</text>

  <!-- Line 1 Data Bytes -->
  <g stroke="#2457d6" stroke-width="1.5">
    <polygon points="240,265 245,250 285,250 290,265 285,280 245,280" fill="#eaf0fd"/>
    <text x="265" y="269" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Байт 0</text>

    <polygon points="290,265 295,250 335,250 340,265 335,280 295,280" fill="#eaf0fd"/>
    <text x="315" y="269" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Байт 1</text>

    <text x="365" y="269" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">...</text>

    <polygon points="390,265 395,250 430,250 435,265 430,280 395,280" fill="#eaf0fd"/>
    <text x="412.5" y="269" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Байт k</text>

    <polygon points="435,265 440,250 475,250 480,265 475,280 440,280" fill="#eaf0fd"/>
    <text x="457.5" y="269" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Байт N</text>
  </g>

  <line x1="480" y1="265" x2="540" y2="265" stroke="#6b7280" stroke-dasharray="3,3" stroke-width="1.5"/>
  <text x="510" y="247" font-size="12" fill="#6b7280" text-anchor="middle">Пауза</text>

  <!-- Line 2 JPEG Payload Bytes -->
  <g stroke="#27ae60" stroke-width="1.5">
    <polygon points="540,265 545,250 590,250 595,265 590,280 545,280" fill="#e9f7ef"/>
    <text x="567.5" y="269" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">0xFF</text>

    <polygon points="595,265 600,250 645,250 650,265 645,280 600,280" fill="#e9f7ef"/>
    <text x="622.5" y="262" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">0xD8</text>
    <text x="622.5" y="276" font-size="11" fill="#27ae60" text-anchor="middle">SOI</text>

    <polygon points="650,265 655,250 700,250 705,265 700,280 655,280" fill="#e9f7ef"/>
    <text x="677.5" y="262" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">0xFF</text>
    <text x="677.5" y="276" font-size="11" fill="#27ae60" text-anchor="middle">E0</text>

    <text x="722.5" y="269" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">...</text>

    <polygon points="740,265 745,250 785,250 790,265 785,280 745,280" fill="#e9f7ef"/>
    <text x="765" y="262" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">0xD9</text>
    <text x="765" y="276" font-size="11" fill="#27ae60" text-anchor="middle">EOI</text>
  </g>

  <line x1="790" y1="265" x2="910" y2="265" stroke="#6b7280" stroke-dasharray="3,3" stroke-width="1.5"/>

  <!-- ПАНЕЛЬ 2: Конвеєр апаратного стиснення JPEG -->
  <rect x="20" y="315" width="920" height="205" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="40" y="339" font-size="14" font-weight="bold" fill="#1a1a1a">2. Апаратний конвеєр обробки та стиснення JPEG в матриці OV3640</text>

  <!-- Блок 1: Матриця OV3640 -->
  <rect x="35" y="360" width="170" height="135" rx="6" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="120" y="382" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Оптична матриця</text>
  <text x="120" y="402" font-size="12" fill="#1a1a1a" text-anchor="middle">Масив пікселів UXGA</text>
  <text x="120" y="420" font-size="12" fill="#6b7280" text-anchor="middle">1600 × 1200 / 10-біт</text>
  <rect x="47" y="435" width="146" height="35" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="120" y="456" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Формат YUV422 / RAW</text>

  <!-- Стрілка 1 -> 2 -->
  <line x1="205" y1="427.5" x2="255" y2="427.5" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="230" y="418" font-size="12" fill="#2457d6" text-anchor="middle">YUV/RAW</text>

  <!-- Блок 2: DCT та Q-шкала -->
  <rect x="255" y="360" width="185" height="135" rx="6" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="347.5" y="382" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Апаратне DCT та Q-шкала</text>
  <text x="347.5" y="402" font-size="12" fill="#6b7280" text-anchor="middle">Обробка блоків 8 × 8</text>
  <rect x="265" y="412" width="165" height="40" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="347.5" y="428" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Таблиця квантування Q</text>
  <text x="347.5" y="444" font-size="12" fill="#6b7280" text-anchor="middle">(Якість jpeg_quality)</text>
  <text x="347.5" y="475" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Стиснення 10:1 ... 12:1</text>

  <!-- Стрілка 2 -> 3 -->
  <line x1="440" y1="427.5" x2="495" y2="427.5" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="467.5" y="418" font-size="12" fill="#2457d6" text-anchor="middle">Потік DCT</text>

  <!-- Блок 3: Ентропійний кодер -->
  <rect x="495" y="360" width="190" height="135" rx="6" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <text x="590" y="382" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Ентропійний кодер</text>
  <text x="590" y="402" font-size="12" fill="#1a1a1a" text-anchor="middle">Упаковка RLE / Huffman</text>
  <rect x="505" y="412" width="170" height="35" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="590" y="434" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Формування маркерів JPEG</text>
  <text x="590" y="464" font-size="12" fill="#6b7280" text-anchor="middle">Заголовки SOI (0xFFD8)</text>
  <text x="590" y="482" font-size="12" fill="#6b7280" text-anchor="middle">та маркери EOI (0xFFD9)</text>

  <!-- Стрілка 3 -> 4 -->
  <line x1="685" y1="427.5" x2="740" y2="427.5" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="712.5" y="418" font-size="12" fill="#27ae60" text-anchor="middle">JPEG</text>

  <!-- Блок 4: DVP FIFO & DMA ESP32 -->
  <rect x="740" y="360" width="185" height="135" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="832.5" y="382" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">DVP FIFO &amp; DMA ESP32</text>
  <text x="832.5" y="402" font-size="12" fill="#1a1a1a" text-anchor="middle">Стробування по PCLK</text>
  <rect x="748" y="412" width="169" height="40" rx="4" fill="white" stroke="#27ae60" stroke-width="1"/>
  <text x="832.5" y="428" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Подвійна буферизація</text>
  <text x="832.5" y="444" font-size="12" fill="#6b7280" text-anchor="middle">у зовнішній PSRAM</text>
  <text x="832.5" y="475" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Швидкість ≤ 20 МБ/с</text>
</svg>
