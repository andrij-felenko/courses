<svg viewBox="0 0 960 560" width="960" height="560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Архітектура ядра Tensilica Xtensa L106 в ESP8266</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Структура 5-ступеневого конвеєра, регістрового файлу, системи переривань та режимів 80 / 160 МГц</text>

  <!-- Left Panel: Instruction Pipeline -->
  <rect x="30" y="75" width="440" height="455" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="50" y="100" font-size="14" font-weight="bold" fill="#2457d6">1. 5-ступеневий конвеєр інструкцій Xtensa L106</text>

  <!-- Stage 1: IF -->
  <rect x="50" y="115" width="400" height="55" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="65" y="136" font-size="13" font-weight="bold" fill="#1a1a1a">1. Fetch (IF) — Вибірка інструкцій</text>
  <text x="65" y="157" font-size="12" fill="#6b7280">Зчитування з IRAM (0x40100000) або iCache Flash (0x40200000)</text>

  <line x1="250" y1="170" x2="250" y2="183" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Stage 2: ID -->
  <rect x="50" y="185" width="400" height="55" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="65" y="206" font-size="13" font-weight="bold" fill="#2457d6">2. Decode (ID) — Декодування коду</text>
  <text x="65" y="227" font-size="12" fill="#1a1a1a">Розкодування 16-біт і 24-біт команд (Xtensa Density Option)</text>

  <line x1="250" y1="240" x2="250" y2="253" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Stage 3: EX -->
  <rect x="50" y="255" width="400" height="55" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="65" y="276" font-size="13" font-weight="bold" fill="#27ae60">3. Execute (EX) — Виконання команд</text>
  <text x="65" y="297" font-size="12" fill="#1a1a1a">32-бітне АЛУ (ALU) та апаратний множник чисел</text>

  <line x1="250" y1="310" x2="250" y2="323" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Stage 4: MEM -->
  <rect x="50" y="325" width="400" height="55" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="65" y="346" font-size="13" font-weight="bold" fill="#1a1a1a">4. Memory (MEM) — Доступ до пам'яті</text>
  <text x="65" y="367" font-size="12" fill="#6b7280">Шина даних зчитування/запису в DRAM (0x3FFE8000)</text>

  <line x1="250" y1="380" x2="250" y2="393" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Stage 5: WB -->
  <rect x="50" y="395" width="400" height="55" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="65" y="416" font-size="13" font-weight="bold" fill="#1a1a1a">5. Writeback (WB) — Запис результату</text>
  <text x="65" y="437" font-size="12" fill="#6b7280">Оновлення регістрів a0–a15 та системного прапорця PS</text>

  <!-- Right Top Panel: Registers & Interrupts -->
  <rect x="490" y="75" width="440" height="215" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="510" y="100" font-size="14" font-weight="bold" fill="#2457d6">2. Регістри та контролер переривань</text>

  <rect x="510" y="115" width="400" height="75" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="525" y="136" font-size="13" font-weight="bold" fill="#1a1a1a">Регістровий файл ядра</text>
  <text x="525" y="157" font-size="12" fill="#6b7280">Основні регістри: a0 (return addr), a1 (stack sp), a2–a15</text>
  <text x="525" y="177" font-size="12" fill="#2457d6">Системні: CCOUNT (лічильник циклів), COMPARE, EPC1–EPC3, PS</text>

  <rect x="510" y="200" width="400" height="75" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="525" y="221" font-size="13" font-weight="bold" fill="#2457d6">Контролер переривань (Interrupt Controller)</text>
  <text x="525" y="242" font-size="12" fill="#1a1a1a">15 рівневих векторів переривань (Level 1..3) + NMI</text>
  <text x="525" y="262" font-size="12" fill="#6b7280">Апаратно обробляє події Wi-Fi MAC, WDT, GPIO та таймерів</text>

  <!-- Right Bottom Panel: Clocking & Frequencies -->
  <rect x="490" y="305" width="440" height="225" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="510" y="330" font-size="14" font-weight="bold" fill="#2457d6">3. Режими тактування CPU (PLL 520 МГц)</text>

  <rect x="510" y="345" width="400" height="75" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="525" y="366" font-size="13" font-weight="bold" fill="#1a1a1a">Стандартний режим: 80 МГц (DIV 6.5)</text>
  <text x="525" y="387" font-size="12" fill="#6b7280">Тривалість 1 циклу: τ = 12.5 нс (80 млн інструкцій/с)</text>
  <text x="525" y="407" font-size="12" fill="#6b7280">Низьке енергоспоживання (~70 мА), фоновий Wi-Fi</text>

  <rect x="510" y="430" width="400" height="85" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="525" y="451" font-size="13" font-weight="bold" fill="#27ae60">Форсований режим: 160 МГц (DIV 3.25)</text>
  <text x="525" y="472" font-size="12" fill="#1a1a1a">Тривалість 1 циклу: τ = 6.25 нс (160 млн інструкцій/с)</text>
  <text x="525" y="492" font-size="12" fill="#27ae60">Подвоєна швидкодія для криптографії та обчислень</text>

  <!-- Connection Lines -->
  <line x1="450" y1="422" x2="508" y2="152" stroke="#2457d6" stroke-dasharray="4" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <line x1="510" y1="472" x2="452" y2="282" stroke="#27ae60" stroke-dasharray="4" stroke-width="1.2" marker-end="url(#arr-green)"/>
</svg>
