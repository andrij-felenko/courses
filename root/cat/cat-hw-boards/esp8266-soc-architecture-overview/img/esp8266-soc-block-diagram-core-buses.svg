<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Системна архітектура та шини SoC ESP8266</text>
  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Взаємодія ядра Tensilica L106, IRAM/DRAM, арбітра DMA та периферії через шини AHB і APB</text>

  <!-- Зовнішній контейнер кристалу SoC ESP8266 -->
  <rect x="40" y="70" width="880" height="465" rx="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="60" y="95" font-size="14" font-weight="bold" fill="#6b7280">Кристал SoC ESP8266 (Silicon Die)</text>

  <!-- ВЕРХНІЙ БЛОК: Ядро, Пам'ять, SPI Flash Controller -->
  <!-- Ядро CPU -->
  <rect x="60" y="115" width="250" height="110" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="185" y="145" text-anchor="middle" font-size="15" font-weight="bold" fill="#2457d6">Ядро Tensilica L106</text>
  <text x="185" y="170" text-anchor="middle" font-size="12" fill="#1a1a1a">32-бітний RISC, 80 / 160 МГц</text>
  <text x="185" y="195" text-anchor="middle" font-size="12" fill="#6b7280">Кеш інструкцій та переривання</text>

  <!-- Внутрішнє ОЗП (SRAM) -->
  <rect x="330" y="115" width="280" height="110" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="470" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">Внутрішня статична пам'ять SRAM</text>
  
  <rect x="345" y="148" width="115" height="62" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="402" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">IRAM</text>
  <text x="402" y="194" text-anchor="middle" font-size="11" fill="#1a1a1a">32 КБ пам'ять</text>

  <rect x="480" y="148" width="115" height="62" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="537" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">DRAM</text>
  <text x="537" y="194" text-anchor="middle" font-size="11" fill="#1a1a1a">80 КБ даних</text>

  <!-- Контролер SPI Flash -->
  <rect x="630" y="115" width="270" height="110" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="765" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Контролер SPI Flash</text>
  <text x="765" y="170" text-anchor="middle" font-size="12" fill="#6b7280">Мапування кешу та шифрування</text>
  <text x="765" y="195" text-anchor="middle" font-size="12" fill="#2457d6">Зовнішня Flash (до 16 МБ)</text>

  <!-- СМУГА СИСТЕМНОЇ ШИНИ AHB -->
  <rect x="60" y="255" width="840" height="35" rx="6" fill="#2457d6" stroke="#1a1a1a" stroke-width="1"/>
  <text x="480" y="278" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Високошвидкісна системна шина AHB (Advanced High-performance Bus)</text>

  <!-- АРБІТР DMA (на шині AHB) -->
  <rect x="350" y="305" width="260" height="40" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Апаратний арбітр DMA</text>

  <!-- ЗВ'ЯЗКИ ВЕРХНІХ БЛОКІВ З ШИНОЮ AHB -->
  <line x1="185" y1="225" x2="185" y2="255" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="470" y1="225" x2="470" y2="255" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-dark)"/>
  <line x1="765" y1="225" x2="765" y2="255" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>

  <!-- НИЖНІЙ БЛОК: Wi-Fi, APB & Периферія, Живлення/Strapping -->
  <!-- Wi-Fi підсистема -->
  <rect x="60" y="365" width="280" height="140" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="200" y="392" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Підсистема Wi-Fi 802.11 b/g/n</text>
  <text x="200" y="417" text-anchor="middle" font-size="12" fill="#2457d6">MAC / Baseband / RF Transceiver</text>
  <text x="200" y="442" text-anchor="middle" font-size="12" fill="#6b7280">Апаратне шифрування WEP/WPA2</text>
  <text x="200" y="475" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Пріоритетний DMA-доступ до шини</text>

  <!-- APB Bus Bridge -->
  <rect x="360" y="365" width="240" height="30" rx="4" fill="#6b7280"/>
  <text x="480" y="385" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Шина периферії APB (Bridge)</text>

  <!-- Периферійні модулі -->
  <rect x="360" y="405" width="240" height="100" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="480" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Периферійні модулі (APB)</text>
  <text x="480" y="455" text-anchor="middle" font-size="12" fill="#6b7280">UART0/1, SPI, I2C, Timers, ADC</text>
  <text x="480" y="480" text-anchor="middle" font-size="12" fill="#1a1a1a">IO MUX &amp; GPIO Matrix</text>

  <!-- Конфігурація та живлення -->
  <rect x="620" y="365" width="280" height="140" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="760" y="392" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">Конфігурація та живлення</text>
  <text x="760" y="417" text-anchor="middle" font-size="12" fill="#1a1a1a">Strapping Pins: GPIO0, 2, 15</text>
  <text x="760" y="442" text-anchor="middle" font-size="12" fill="#6b7280">Режими: Boot / Flash / SDIO</text>
  <text x="760" y="475" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Живлення: 3.3 В (піки до 500 мА)</text>

  <!-- ЗВ'ЯЗКИ НИЖНІХ БЛОКІВ З ШИНОЮ AHB Та АРБІТРОМ DMA -->
  <line x1="200" y1="365" x2="200" y2="290" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="480" y1="345" x2="480" y2="365" stroke="#6b7280" stroke-width="2" marker-end="url(#arr-dark)"/>
  <line x1="760" y1="365" x2="760" y2="290" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>
</svg>
