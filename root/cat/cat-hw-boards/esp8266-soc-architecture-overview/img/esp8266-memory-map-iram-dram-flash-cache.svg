<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- White Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Карта пам'яті та механізм кешування Flash-пам'яті в ESP8266</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Ядро Xtensa L106 звертається до IRAM та DRAM напряму, а код з IROM1 читається через 32 КБ Cache-контролер SPI Flash</text>

  <!-- Left Panel: CPU & System Buses -->
  <rect x="25" y="80" width="220" height="435" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="135" y="108" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Процесорне ядро</text>

  <rect x="40" y="125" width="190" height="110" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="135" y="150" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Tensilica Xtensa L106</text>
  <text x="135" y="170" font-size="12" fill="#1a1a1a" text-anchor="middle">32-біт RISC / 80-160 МГц</text>
  <text x="135" y="192" font-size="12" fill="#6b7280" text-anchor="middle">I-Bus (Вибірка інструкцій)</text>
  <text x="135" y="212" font-size="12" fill="#6b7280" text-anchor="middle">D-Bus (Читання/Запис даних)</text>

  <!-- Bus Flow Indicators -->
  <rect x="40" y="260" width="190" height="235" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="135" y="285" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Маршрутизація шин</text>

  <line x1="55" y1="310" x2="230" y2="310" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="60" y="303" font-size="12" font-weight="bold" fill="#2457d6">Шина інструкцій (I-Bus)</text>
  <text x="60" y="328" font-size="12" fill="#6b7280">Доступ до IRAM та IROM0</text>

  <line x1="55" y1="370" x2="230" y2="370" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="60" y="363" font-size="12" font-weight="bold" fill="#27ae60">Шина даних (D-Bus)</text>
  <text x="60" y="388" font-size="12" fill="#6b7280">Доступ до DRAM та регістрів</text>

  <line x1="55" y1="430" x2="230" y2="430" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="60" y="423" font-size="12" font-weight="bold" fill="#1a1a1a">Арбітр DMA</text>
  <text x="60" y="448" font-size="12" fill="#6b7280">Прямий доступ Wi-Fi/HSPI</text>

  <!-- Middle Panel: Memory Map Address Space -->
  <rect x="265" y="80" width="415" height="435" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="472" y="108" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Адресний простір CPU (Memory Map)</text>

  <!-- Memory Blocks in Address Space -->
  <!-- 1. ROM Bootloader -->
  <rect x="280" y="125" width="385" height="52" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="295" y="146" font-size="12" font-weight="bold" fill="#1a1a1a">ROM Bootloader (48 КБ)</text>
  <text x="295" y="165" font-size="12" fill="#6b7280">Первинне завантаження та ROM-функції</text>
  <rect x="535" y="133" width="120" height="34" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="595" y="154" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0x40000000</text>

  <!-- 2. IRAM -->
  <rect x="280" y="187" width="385" height="56" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="295" y="208" font-size="12" font-weight="bold" fill="#2457d6">IRAM (Instruction RAM, 32 КБ)</text>
  <text x="295" y="227" font-size="12" fill="#1a1a1a">Швидкі обробники переривань та Wi-Fi ISR</text>
  <rect x="535" y="198" width="120" height="34" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="595" y="219" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">0x40100000</text>

  <!-- 3. IROM0 (Flash Cache Mapping Window) -->
  <rect x="280" y="253" width="385" height="64" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="295" y="274" font-size="12" font-weight="bold" fill="#27ae60">IROM0 (Вікно кешування SPI Flash, 1 МБ)</text>
  <text x="295" y="293" font-size="12" fill="#1a1a1a">Основний код прошивки (.irom0.text)</text>
  <text x="295" y="309" font-size="12" fill="#6b7280">Вибірка інструкцій через 32 КБ Cache</text>
  <rect x="535" y="268" width="120" height="34" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="595" y="289" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">0x40200000</text>

  <!-- 4. DRAM -->
  <rect x="280" y="327" width="385" height="56" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="295" y="348" font-size="12" font-weight="bold" fill="#2457d6">DRAM (Data RAM, 80 КБ)</text>
  <text x="295" y="367" font-size="12" fill="#1a1a1a">Статичні змінні (.data, .bss) та Купа (Heap)</text>
  <rect x="535" y="338" width="120" height="34" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="595" y="359" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">0x3FFE8000</text>

  <!-- 5. Peripheral Registers -->
  <rect x="280" y="393" width="385" height="52" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="295" y="414" font-size="12" font-weight="bold" fill="#1a1a1a">Регістри периферії (Peripherals)</text>
  <text x="295" y="433" font-size="12" fill="#6b7280">Управління GPIO, SPI, UART, Timers, WDT</text>
  <rect x="535" y="402" width="120" height="34" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="595" y="423" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0x60000000</text>

  <!-- Note Footer inside Middle Panel -->
  <rect x="280" y="453" width="385" height="48" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="472" y="472" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розділення пам'яті за призначенням:</text>
  <text x="472" y="490" font-size="12" fill="#6b7280" text-anchor="middle">IRAM — критичний швидкий код, DRAM — дані, IROM — масив коду</text>

  <!-- Right Panel: Flash Cache & External SPI Flash -->
  <rect x="700" y="80" width="235" height="435" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="817" y="108" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Підсистема SPI Flash</text>

  <!-- Cache Controller Box -->
  <rect x="715" y="125" width="205" height="150" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="817" y="148" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Контролер Flash-кешу</text>
  <text x="817" y="168" font-size="12" fill="#1a1a1a" text-anchor="middle">Обсяг кешу: 32 КБ SRAM</text>
  <text x="817" y="186" font-size="12" fill="#6b7280" text-anchor="middle">Розмір блоку: 64 байти</text>

  <!-- Cache Status Badges -->
  <rect x="730" y="200" width="175" height="28" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="817" y="218" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Cache Hit: 1-2 такти CPU</text>

  <rect x="730" y="235" width="175" height="28" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="817" y="253" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Cache Miss: Підтяжка з SPI</text>

  <!-- Arrow from Cache Controller to External Flash -->
  <line x1="817" y1="275" x2="817" y2="315" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="825" y="298" font-size="12" font-weight="bold" fill="#27ae60">Шина SPI</text>

  <!-- External SPI Flash Box -->
  <rect x="715" y="315" width="205" height="185" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="817" y="338" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Зовнішня SPI Flash</text>
  <text x="817" y="358" font-size="12" fill="#6b7280" text-anchor="middle">Розмір: 1 МБ – 16 МБ</text>

  <!-- Memory Segments in Flash -->
  <rect x="730" y="370" width="175" height="32" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="817" y="390" font-size="12" fill="#1a1a1a" text-anchor="middle">0x00000: Bootloader / Header</text>

  <rect x="730" y="408" width="175" height="32" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="817" y="428" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">0x10000: .irom0.text (Код)</text>

  <rect x="730" y="446" width="175" height="42" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="817" y="464" font-size="12" fill="#1a1a1a" text-anchor="middle">Файлова система SPIFFS /</text>
  <text x="817" y="480" font-size="12" fill="#6b7280" text-anchor="middle">Параметри SDK &amp; RF</text>
</svg>
