<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="4.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="4.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Структурна блок-схема системи на кристалі ESP8266EX</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Взаємозв'язок ядра Tensilica Xtensa L106, пам'яті IRAM/DRAM, системних шин AHB/APB, Wi-Fi радіомодуля та периферії</text>

  <!-- Outer SoC Frame -->
  <rect x="30" y="75" width="900" height="425" rx="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="50" y="98" font-size="13" font-weight="bold" fill="#1a1a1a">ESP8266EX SoC (System on Chip)</text>

  <!-- Panel 1: CPU & Memory Subsystem -->
  <rect x="50" y="115" width="410" height="175" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="65" y="135" font-size="12" font-weight="bold" fill="#1a1a1a">Процесорне ядро та підсистема пам'яті</text>

  <!-- Xtensa L106 Block -->
  <rect x="65" y="147" width="180" height="60" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="155" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Tensilica Xtensa L106</text>
  <text x="155" y="190" text-anchor="middle" font-size="11" fill="#6b7280">32-bit RISC @ 80 / 160 MHz</text>

  <!-- ICache Block -->
  <rect x="65" y="217" width="180" height="60" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="155" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">ICache (32 KB)</text>
  <text x="155" y="258" text-anchor="middle" font-size="11" fill="#6b7280">Вікно MMU SPI Flash</text>

  <!-- SRAM (IRAM / DRAM) -->
  <rect x="265" y="147" width="180" height="130" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="355" y="168" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Внутрішня SRAM (96 KB)</text>
  <text x="355" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">IRAM: 32 KB</text>
  <text x="355" y="208" text-anchor="middle" font-size="11" fill="#6b7280">(Код обробників і системний)</text>
  <text x="355" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">DRAM: ~52 KB</text>
  <text x="355" y="250" text-anchor="middle" font-size="11" fill="#6b7280">(Дані, стек та купа)</text>

  <!-- Panel 2: Wi-Fi Subsystem -->
  <rect x="480" y="115" width="430" height="175" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="495" y="135" font-size="12" font-weight="bold" fill="#1a1a1a">Підсистема Wi-Fi (IEEE 802.11 b/g/n)</text>

  <!-- RF Front-End -->
  <rect x="495" y="147" width="125" height="130" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="557" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">RF Front-End</text>
  <text x="557" y="192" text-anchor="middle" font-size="11" fill="#6b7280">PA / LNA підсилювачі</text>
  <text x="557" y="210" text-anchor="middle" font-size="11" fill="#6b7280">T/R антенний ключ</text>
  <text x="557" y="228" text-anchor="middle" font-size="11" fill="#6b7280">Вбудований Balun</text>
  <text x="557" y="250" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Вивід 2.4 GHz RF</text>

  <!-- Wi-Fi Baseband & MAC -->
  <rect x="635" y="147" width="130" height="130" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="700" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Wi-Fi Baseband</text>
  <text x="700" y="192" text-anchor="middle" font-size="11" fill="#6b7280">OFDM / CCK демодулятор</text>
  <text x="700" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Hardware MAC</text>
  <text x="700" y="238" text-anchor="middle" font-size="11" fill="#6b7280">Апаратний шифратор</text>
  <text x="700" y="254" text-anchor="middle" font-size="11" fill="#6b7280">(WEP / WPA / WPA2)</text>

  <!-- Wi-Fi DMA Controller -->
  <rect x="780" y="147" width="115" height="130" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="837" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Wi-Fi DMA</text>
  <text x="837" y="202" text-anchor="middle" font-size="11" fill="#1a1a1a">Прямий доступ</text>
  <text x="837" y="220" text-anchor="middle" font-size="11" fill="#1a1a1a">до пам'яті SRAM</text>
  <text x="837" y="244" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Без залучення CPU</text>

  <!-- System Bus (AHB / APB Bridge) -->
  <rect x="50" y="305" width="860" height="26" rx="4" fill="#2457d6" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Системна шина AHB (Advanced High-performance Bus) / Мост шини APB</text>

  <!-- Interconnect Lines (Top to System Bus) -->
  <line x1="155" y1="277" x2="155" y2="305" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="355" y1="277" x2="355" y2="305" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="700" y1="277" x2="700" y2="305" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="837" y1="277" x2="837" y2="305" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Panel 3: Peripherals & Interfaces -->
  <rect x="50" y="345" width="860" height="145" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="65" y="363" font-size="12" font-weight="bold" fill="#1a1a1a">Периферійні блоки та інтерфейси введення/виведення</text>

  <!-- Internal APB Bus Line & Interconnect from System Bus -->
  <line x1="65" y1="373" x2="895" y2="373" stroke="#2457d6" stroke-width="2"/>
  <text x="890" y="368" text-anchor="end" font-size="11" font-weight="bold" fill="#2457d6">Шина APB</text>
  <line x1="562.5" y1="331" x2="562.5" y2="373" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Interconnect Stubs (APB Bus to Peripheral Blocks) -->
  <line x1="140" y1="373" x2="140" y2="385" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="310" y1="373" x2="310" y2="385" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="480" y1="373" x2="480" y2="385" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="650" y1="373" x2="650" y2="385" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="820" y1="373" x2="820" y2="385" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Block 1: GPIO -->
  <rect x="65" y="385" width="150" height="98" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="140" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">GPIO &amp; PIN MUX</text>
  <text x="140" y="423" text-anchor="middle" font-size="11" fill="#6b7280">17 базісних виводів</text>
  <text x="140" y="441" text-anchor="middle" font-size="11" fill="#6b7280">3.3V CMOS рівні</text>
  <text x="140" y="461" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Контролер переривань</text>

  <!-- Block 2: SPI / HSPI -->
  <rect x="230" y="385" width="160" height="98" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="310" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">SPI / HSPI Controller</text>
  <text x="310" y="423" text-anchor="middle" font-size="11" fill="#1a1a1a">Зовнішня SPI Flash</text>
  <text x="310" y="441" text-anchor="middle" font-size="11" fill="#6b7280">Quad-SPI (QIO / DIO)</text>
  <text x="310" y="461" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Шина вибірки коду</text>

  <!-- Block 3: UART & I2C / I2S -->
  <rect x="405" y="385" width="150" height="98" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="480" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">UART0 / UART1</text>
  <text x="480" y="423" text-anchor="middle" font-size="11" fill="#6b7280">TXD / RXD / CTS / RTS</text>
  <text x="480" y="441" text-anchor="middle" font-size="11" fill="#1a1a1a">I2C / I2S інтерфейси</text>
  <text x="480" y="461" text-anchor="middle" font-size="11" fill="#6b7280">Сенсори та периферія</text>

  <!-- Block 4: Timers & WDT -->
  <rect x="570" y="385" width="160" height="98" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="650" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Timers &amp; WDT</text>
  <text x="650" y="423" text-anchor="middle" font-size="11" fill="#6b7280">2× Апаратні таймери</text>
  <text x="650" y="441" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Watchdog Timer (WDT)</text>
  <text x="650" y="461" text-anchor="middle" font-size="11" fill="#6b7280">Програмний ШІМ (PWM)</text>

  <!-- Block 5: ADC / TOUT & Power -->
  <rect x="745" y="385" width="150" height="98" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="820" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">10-bit ADC (TOUT)</text>
  <text x="820" y="423" text-anchor="middle" font-size="11" fill="#6b7280">Вхід 0 .. 1.0V (TOUT)</text>
  <text x="820" y="441" text-anchor="middle" font-size="11" fill="#1a1a1a">RTC &amp; Power Mgmt</text>
  <text x="820" y="461" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Deep-Sleep контролер</text>
</svg>
