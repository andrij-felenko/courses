<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Апаратна структура каскаду GPIO та мультиплексора IOMUX в ESP8266</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Принципова схема контактного майданчика з ESD-захистом, драйверами та підтяжками</text>

  <!-- Panel 1: Left - IOMUX & GPIO Controller -->
  <rect x="30" y="80" width="220" height="420" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="140" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">IOMUX та контролер GPIO</text>

  <!-- Sub-block A: IOMUX -->
  <rect x="42" y="125" width="196" height="150" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="140" y="145" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">IOMUX (Мультиплексор)</text>
  <text x="52" y="168" font-size="12" fill="#6b7280">・ Вибір функції (FUNC_SEL)</text>
  <text x="52" y="190" font-size="12" fill="#6b7280">・ Первинна периферія (UART/SPI)</text>
  <text x="52" y="212" font-size="12" fill="#6b7280">・ Вторинна периферія (PWM/I2C)</text>
  <text x="52" y="234" font-size="12" fill="#6b7280">・ Керування підтяжками (PU/PD)</text>
  <text x="52" y="256" font-size="12" fill="#6b7280">・ Керування драйверами</text>

  <!-- Sub-block B: GPIO Registers -->
  <rect x="42" y="290" width="196" height="195" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="140" y="310" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Регістри GPIO</text>
  <text x="52" y="335" font-size="12" fill="#6b7280">・ GPIO_OUT (вихідне значення)</text>
  <text x="52" y="360" font-size="12" fill="#6b7280">・ GPIO_ENABLE (дозвіл виходу)</text>
  <text x="52" y="385" font-size="12" fill="#6b7280">・ GPIO_IN (читання стану)</text>
  <text x="52" y="410" font-size="12" fill="#6b7280">・ GPIO_PINx (конфігурація)</text>
  <text x="52" y="435" font-size="12" fill="#6b7280">・ GPIO16_RTC (домен RTC)</text>
  <text x="52" y="460" font-size="12" fill="#6b7280">・ GPIO_STATUS (переривання)</text>

  <!-- Panel 2: Center - GPIO Pad Hardware Circuitry -->
  <rect x="280" y="80" width="480" height="420" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="520" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вхідно-вихідний каскад (GPIO Pad Circuit)</text>

  <!-- Power Rails inside Panel 2 -->
  <line x1="300" y1="130" x2="740" y2="130" stroke="#2457d6" stroke-width="2.5"/>
  <text x="520" y="123" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Шина живлення VDD33 (+3.3 В)</text>

  <line x1="300" y1="460" x2="740" y2="460" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="520" y="478" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Шина землі GND (0 В)</text>

  <!-- Main Internal Pad Line -->
  <line x1="350" y1="295" x2="805" y2="295" stroke="#2457d6" stroke-width="3"/>
  <text x="755" y="285" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Лінія PAD</text>

  <!-- Nodes on Main Pad Line -->
  <circle cx="350" cy="295" r="4" fill="#2457d6"/>
  <circle cx="470" cy="295" r="4" fill="#2457d6"/>
  <circle cx="600" cy="295" r="4" fill="#2457d6"/>
  <circle cx="695" cy="295" r="4" fill="#2457d6"/>

  <!-- Nodes on Power Rails -->
  <circle cx="350" cy="130" r="4" fill="#2457d6"/>
  <circle cx="470" cy="130" r="4" fill="#2457d6"/>
  <circle cx="600" cy="130" r="4" fill="#2457d6"/>

  <circle cx="350" cy="460" r="4" fill="#1a1a1a"/>
  <circle cx="470" cy="460" r="4" fill="#1a1a1a"/>
  <circle cx="600" cy="460" r="4" fill="#1a1a1a"/>

  <!-- Branch 1: ESD Diodes (x = 350) -->
  <line x1="350" y1="130" x2="350" y2="295" stroke="#c0392b" stroke-width="1.5"/>
  <path d="M 350,195 L 340,215 L 360,215 Z" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="338" y1="195" x2="362" y2="195" stroke="#c0392b" stroke-width="2.5"/>
  <text x="365" y="205" font-size="12" fill="#c0392b" text-anchor="start">D1 (ESD Clamp)</text>

  <line x1="350" y1="295" x2="350" y2="460" stroke="#c0392b" stroke-width="1.5"/>
  <path d="M 350,365 L 340,385 L 360,385 Z" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="338" y1="365" x2="362" y2="365" stroke="#c0392b" stroke-width="2.5"/>
  <text x="365" y="385" font-size="12" fill="#c0392b" text-anchor="start">D2 (ESD Clamp)</text>

  <!-- Branch 2: Pull-Up / Pull-Down Resistors (x = 470) -->
  <!-- Upper Pull-Up -->
  <line x1="470" y1="130" x2="470" y2="150" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="455" y="150" width="30" height="24" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="470" y="166" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">SW</text>

  <line x1="470" y1="174" x2="470" y2="195" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="458" y="195" width="24" height="45" rx="3" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="462" y1="205" x2="478" y2="205" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="462" y1="217" x2="478" y2="217" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="462" y1="230" x2="478" y2="230" stroke="#1a1a1a" stroke-width="1"/>
  <text x="492" y="222" font-size="12" fill="#1a1a1a" text-anchor="start">R_PU (~45 кОм)</text>
  <line x1="470" y1="240" x2="470" y2="295" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Lower Pull-Down -->
  <line x1="470" y1="295" x2="470" y2="350" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="458" y="350" width="24" height="45" rx="3" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="462" y1="360" x2="478" y2="360" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="462" y1="372" x2="478" y2="372" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="462" y1="385" x2="478" y2="385" stroke="#1a1a1a" stroke-width="1"/>
  <text x="492" y="377" font-size="12" fill="#1a1a1a" text-anchor="start">R_PD (~45 кОм)</text>
  <line x1="470" y1="395" x2="470" y2="405" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="455" y="405" width="30" height="24" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="470" y="421" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">SW</text>
  <line x1="470" y1="429" x2="470" y2="460" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Branch 3: CMOS Output Drivers (Push-Pull P-FET & N-FET, x = 600) -->
  <!-- Upper P-FET -->
  <line x1="600" y1="130" x2="600" y2="185" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="580" y="185" width="40" height="45" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="600" y="212" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">P-FET</text>
  <text x="628" y="212" font-size="12" fill="#2457d6" text-anchor="start">Вихід High</text>
  <line x1="600" y1="230" x2="600" y2="295" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Lower N-FET -->
  <line x1="600" y1="295" x2="600" y2="355" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="580" y="355" width="40" height="45" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="600" y="382" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">N-FET</text>
  <text x="628" y="382" font-size="12" fill="#2457d6" text-anchor="start">Вихід Low</text>
  <line x1="600" y1="400" x2="600" y2="460" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Branch 4: Schmitt Trigger Input Buffer (x = 695) -->
  <rect x="680" y="275" width="45" height="40" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="702.5" y="300" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">ST</text>
  <text x="702.5" y="263" font-size="12" fill="#27ae60" text-anchor="middle">Вхідний буфер</text>

  <!-- Interconnect Signals (Left Panel to Center Panel) -->
  <!-- PU_EN -->
  <line x1="230" y1="162" x2="455" y2="162" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="340" y="154" font-size="12" fill="#2457d6" text-anchor="middle">PU_EN</text>

  <!-- DRV_HIGH -->
  <line x1="230" y1="207" x2="580" y2="207" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="340" y="199" font-size="12" fill="#2457d6" text-anchor="middle">DRV_HIGH</text>

  <!-- GPIO_IN / PERI_IN (Return line, green) -->
  <line x1="680" y1="315" x2="230" y2="315" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="340" y="307" font-size="12" fill="#27ae60" text-anchor="middle">GPIO_IN / PERI_IN</text>

  <!-- DRV_LOW -->
  <line x1="230" y1="377" x2="580" y2="377" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="340" y="369" font-size="12" fill="#2457d6" text-anchor="middle">DRV_LOW</text>

  <!-- PD_EN -->
  <line x1="230" y1="417" x2="455" y2="417" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="340" y="409" font-size="12" fill="#2457d6" text-anchor="middle">PD_EN</text>

  <!-- Panel 3: Right - Physical PAD / Pin -->
  <rect x="790" y="80" width="140" height="420" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="860" y="105" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Фізичний вивід</text>

  <!-- Main Physical PAD Block -->
  <rect x="805" y="245" width="110" height="100" rx="8" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="860" y="280" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">PAD</text>
  <text x="860" y="302" font-size="12" fill="#eaf0fd" text-anchor="middle">(Pin GPIO)</text>

  <!-- Line connecting PAD Box to External output arrow -->
  <line x1="915" y1="295" x2="925" y2="295" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <text x="860" y="375" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Зовнішнє коло</text>
  <text x="860" y="395" font-size="12" fill="#6b7280" text-anchor="middle">(0 В ... 3.3 В)</text>

  <!-- Red Caution/Specs Box -->
  <rect x="802" y="425" width="116" height="60" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="860" y="445" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Струм: до 12 мА</text>
  <text x="860" y="465" font-size="12" fill="#c0392b" text-anchor="middle">Не 5V-tolerant!</text>
</svg>
