<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Canvas background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="36" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Архітектура системи на кристалі (SoC) ESP8266</text>
  <text x="480" y="58" font-size="13" text-anchor="middle" fill="#6b7280">Автономне ядро Tensilica L106 та Wi-Fi MAC розділяють шину AHB через арбітр із DMA</text>

  <!-- Outer SoC Chip Container -->
  <rect x="30" y="75" width="900" height="425" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="10"/>
  <text x="45" y="94" font-size="12" font-weight="bold" fill="#6b7280">Кристал ESP8266 (SoC)</text>

  <!-- 1. CPU Core -->
  <rect x="45" y="105" width="230" height="120" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="160" y="127" font-size="14" font-weight="bold" text-anchor="middle" fill="#2457d6">Процесорне ядро</text>
  <text x="160" y="148" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Tensilica Xtensa L106</text>
  <text x="160" y="168" font-size="12" text-anchor="middle" fill="#6b7280">32-bit RISC • 80 / 160 MHz</text>
  <rect x="60" y="184" width="200" height="28" fill="#ffffff" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="160" y="202" font-size="12" text-anchor="middle" fill="#1a1a1a">Контролер переривань &amp; WDT</text>

  <!-- 2. Memory Subsystem & MMU -->
  <rect x="290" y="105" width="360" height="120" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="470" y="126" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Підсистема пам'яті &amp; MMU</text>
  <rect x="305" y="136" width="155" height="42" fill="#f4f6f8" stroke="#d0d7de" rx="4"/>
  <text x="382" y="153" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">IRAM (32–64 KB)</text>
  <text x="382" y="169" font-size="12" text-anchor="middle" fill="#6b7280">Пам'ять інструкцій</text>
  <rect x="480" y="136" width="155" height="42" fill="#f4f6f8" stroke="#d0d7de" rx="4"/>
  <text x="557" y="153" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">DRAM (~80 KB)</text>
  <text x="557" y="169" font-size="12" text-anchor="middle" fill="#6b7280">Дані та купа</text>
  <rect x="305" y="184" width="330" height="28" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="470" y="202" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">SPI Flash Cache MMU (відображення коду)</text>

  <!-- 3. External SPI Flash -->
  <rect x="665" y="105" width="250" height="120" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="5 4" rx="6"/>
  <text x="790" y="127" font-size="13" font-weight="bold" text-anchor="middle" fill="#2457d6">Зовнішня Flash-пам'ять</text>
  <rect x="680" y="138" width="220" height="74" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="790" y="157" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">SPI Flash (512KB – 16MB)</text>
  <text x="790" y="176" font-size="12" text-anchor="middle" fill="#6b7280">Прошивка, FlashFS, OTA</text>
  <text x="790" y="195" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">Інтерфейс HSPI / SPI</text>

  <!-- Connection: Flash MMU <-> External Flash -->
  <line x1="635" y1="198" x2="672" y2="198" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- 4. High-Performance AHB Bus -->
  <rect x="45" y="245" width="870" height="55" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.5" rx="6"/>
  <text x="480" y="267" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Високошвидкісна системна шина AHB (Advanced High-performance Bus)</text>
  <text x="480" y="287" font-size="12" text-anchor="middle" fill="#eaf0fd">Апаратний арбітр шини з пріоритетним DMA-доступом для Wi-Fi MAC</text>

  <!-- Bus connections from Top Row to AHB -->
  <!-- CPU -> AHB -->
  <line x1="160" y1="225" x2="160" y2="237" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <!-- IRAM -> AHB -->
  <line x1="382" y1="225" x2="382" y2="237" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <!-- DRAM -> AHB -->
  <line x1="557" y1="225" x2="557" y2="237" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- 5. Wi-Fi Subsystem -->
  <rect x="45" y="320" width="310" height="155" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="55" y="338" font-size="13" font-weight="bold" fill="#27ae60">Wi-Fi підсистема (MAC / BB / RF)</text>

  <rect x="60" y="348" width="280" height="46" fill="#ffffff" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="200" y="366" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Wi-Fi MAC-контролер</text>
  <text x="200" y="383" font-size="12" text-anchor="middle" fill="#27ae60">Прямий доступ до пам'яті (DMA)</text>

  <rect x="60" y="404" width="280" height="58" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="200" y="422" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Baseband &amp; RF Transceiver</text>
  <text x="200" y="439" font-size="12" text-anchor="middle" fill="#6b7280">2.4 GHz PA (+20dBm) / LNA</text>
  <text x="200" y="454" font-size="12" text-anchor="middle" fill="#6b7280">802.11 b/g/n PHY</text>

  <!-- Wi-Fi MAC DMA <-> AHB Bus (line positioned at x=305 outside title text) -->
  <line x1="305" y1="348" x2="305" y2="308" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- 6. Async Bridge -->
  <rect x="375" y="320" width="140" height="50" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="4"/>
  <text x="445" y="341" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Асинхронний міст</text>
  <text x="445" y="358" font-size="12" text-anchor="middle" fill="#6b7280">AHB ↔ APB Ізоляція</text>

  <!-- Connections to Async Bridge -->
  <line x1="445" y1="300" x2="445" y2="312" stroke="#6b7280" stroke-width="2" marker-end="url(#arr-gray)"/>
  <line x1="515" y1="345" x2="527" y2="345" stroke="#6b7280" stroke-width="2" marker-end="url(#arr-gray)"/>

  <!-- 7. APB Bus -->
  <rect x="535" y="320" width="380" height="50" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="4"/>
  <text x="725" y="341" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Периферійна шина APB (Advanced Peripheral Bus)</text>
  <text x="725" y="358" font-size="12" text-anchor="middle" fill="#6b7280">Низькошвидкісний доступ до MMIO-регістрів</text>

  <!-- 8. SoC Peripherals -->
  <rect x="535" y="385" width="380" height="90" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6"/>

  <rect x="545" y="395" width="110" height="70" fill="#f4f6f8" stroke="#d0d7de" rx="4"/>
  <text x="600" y="416" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">IOMUX &amp; GPIO</text>
  <text x="600" y="433" font-size="12" text-anchor="middle" fill="#6b7280">16× GPIO lines</text>
  <text x="600" y="450" font-size="12" text-anchor="middle" fill="#6b7280">MMIO регістри</text>

  <rect x="670" y="395" width="110" height="70" fill="#f4f6f8" stroke="#d0d7de" rx="4"/>
  <text x="725" y="416" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Інтерфейси</text>
  <text x="725" y="433" font-size="12" text-anchor="middle" fill="#6b7280">2× UART, SPI</text>
  <text x="725" y="450" font-size="12" text-anchor="middle" fill="#6b7280">I2C, I2S, PWM</text>

  <rect x="795" y="395" width="110" height="70" fill="#f4f6f8" stroke="#d0d7de" rx="4"/>
  <text x="850" y="416" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">АЦП &amp; Таймери</text>
  <text x="850" y="433" font-size="12" text-anchor="middle" fill="#6b7280">10-bit SAR ADC</text>
  <text x="850" y="450" font-size="12" text-anchor="middle" fill="#6b7280">FRC1/2, WDT</text>

  <!-- APB to Peripherals connections -->
  <line x1="600" y1="370" x2="600" y2="387" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="725" y1="370" x2="725" y2="387" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="850" y1="370" x2="850" y2="387" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>

</svg>
