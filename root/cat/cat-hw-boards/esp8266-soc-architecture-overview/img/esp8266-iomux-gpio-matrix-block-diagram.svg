<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrow-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arrow-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мультиплексування виводів IO MUX та GPIO-матриця в ESP8266</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Маршрутизація периферійних сигналів та КМОН-драйверів фізичних виводів</text>

  <!-- Column 1: Peripherals -->
  <rect x="30" y="80" width="190" height="450" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="125" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Периферія SoC</text>

  <rect x="45" y="125" width="160" height="45" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="125" y="145" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">UART / SPI / I2S</text>
  <text x="125" y="161" font-size="11" fill="#6b7280" text-anchor="middle">Периферійні сигнали</text>

  <rect x="45" y="190" width="160" height="45" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="125" y="210" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">GPIO_OUT / IN</text>
  <text x="125" y="226" font-size="11" fill="#6b7280" text-anchor="middle">Прямий доступ CPU</text>

  <rect x="45" y="255" width="160" height="60" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="125" y="275" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Strapping-виводи</text>
  <text x="125" y="292" font-size="11" fill="#c0392b" text-anchor="middle">GPIO0, GPIO2, GPIO15</text>
  <text x="125" y="306" font-size="10" fill="#6b7280" text-anchor="middle">Режим завантаження</text>

  <rect x="45" y="330" width="160" height="185" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="125" y="350" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Електричні межі</text>
  <text x="55" y="372" font-size="11" fill="#1a1a1a">• VDD = 3.3 В (±10%)</text>
  <text x="55" y="392" font-size="11" fill="#1a1a1a">• I_max = 12 мА</text>
  <text x="55" y="412" font-size="11" font-weight="bold" fill="#c0392b">• Без 5V Tolerant!</text>
  <text x="55" y="432" font-size="11" fill="#1a1a1a">• V_IH min = 0.75×VDD</text>
  <text x="55" y="452" font-size="11" fill="#1a1a1a">• V_IL max = 0.25×VDD</text>
  <text x="55" y="472" font-size="11" fill="#6b7280">• Шунтування ESD</text>

  <!-- Column 2: GPIO Matrix & IO MUX Regs -->
  <rect x="255" y="80" width="220" height="450" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="365" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GPIO-матриця та IO MUX</text>

  <rect x="270" y="125" width="190" height="170" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="365" y="145" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GPIO Matrix (Матриця)</text>
  <text x="280" y="168" font-size="11" fill="#6b7280">Маршрутизатор сигналів:</text>
  <text x="280" y="188" font-size="11" fill="#1a1a1a">• Сигнали периферії</text>
  <text x="280" y="208" font-size="11" fill="#1a1a1a">• Мапування на GPIO</text>
  <text x="280" y="228" font-size="11" fill="#1a1a1a">• Інверсія сигналів</text>
  <text x="280" y="248" font-size="11" fill="#1a1a1a">• Сигнали переривань</text>
  <text x="280" y="268" font-size="11" fill="#1a1a1a">• Керування OE (Output)</text>

  <rect x="270" y="310" width="190" height="205" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="365" y="330" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Регістри PERIPHS_IO_MUX</text>
  <text x="280" y="352" font-size="11" fill="#6b7280">Налаштування виводу:</text>
  <text x="280" y="372" font-size="11" font-weight="bold" fill="#2457d6">• MCU_SEL (3 біти func)</text>
  <text x="280" y="392" font-size="11" fill="#1a1a1a">• PULLUP (підтяжка 3.3V)</text>
  <text x="280" y="412" font-size="11" fill="#1a1a1a">• PULLDOWN (підтяжка GND)</text>
  <text x="280" y="432" font-size="11" fill="#1a1a1a">• SLEEP_OE / SLEEP_SEL</text>
  <text x="280" y="452" font-size="11" fill="#1a1a1a">• DRIVE_STRENGTH (струм)</text>
  <text x="280" y="472" font-size="11" fill="#1a1a1a">• FUN_IE (Input Enable)</text>

  <!-- Column 3: MUX & Logic -->
  <rect x="510" y="80" width="190" height="450" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="605" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мультиплексор MUX</text>

  <rect x="525" y="125" width="160" height="250" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="605" y="148" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Селектор MUX 4:1</text>
  <text x="605" y="165" font-size="11" fill="#6b7280" text-anchor="middle">(Вибір функції виводу)</text>

  <rect x="535" y="182" width="140" height="30" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="605" y="201" font-size="11" fill="#1a1a1a" text-anchor="middle">Func 0: Основна периферія</text>

  <rect x="535" y="222" width="140" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="605" y="241" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Func 1: Режим GPIO</text>

  <rect x="535" y="262" width="140" height="30" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="605" y="281" font-size="11" fill="#1a1a1a" text-anchor="middle">Func 2: Вторинна периферія</text>

  <rect x="535" y="302" width="140" height="30" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="605" y="321" font-size="11" fill="#1a1a1a" text-anchor="middle">Func 3: Спеціальний режим</text>

  <text x="605" y="355" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Керування від MCU_SEL</text>

  <rect x="525" y="390" width="160" height="125" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="605" y="410" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Логіка керування Pad</text>
  <text x="535" y="432" font-size="11" fill="#1a1a1a">• Output Enable (OE)</text>
  <text x="535" y="452" font-size="11" fill="#1a1a1a">• Input Enable (IE)</text>
  <text x="535" y="472" font-size="11" fill="#1a1a1a">• Pull Up / Down Sw</text>
  <text x="535" y="492" font-size="11" fill="#1a1a1a">• Open Drain Enable</text>

  <!-- Column 4: CMOS Pad & Pin -->
  <rect x="735" y="80" width="195" height="450" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="832" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Фізичний КМОН-каскад</text>

  <rect x="750" y="125" width="165" height="250" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="832" y="148" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">КМОН-драйвер Pad</text>

  <rect x="805" y="168" width="55" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="832" y="187" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">P-CH</text>

  <rect x="805" y="235" width="55" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="832" y="254" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">N-CH</text>

  <line x1="832" y1="155" x2="832" y2="168" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="832" y="163" font-size="10" fill="#6b7280" text-anchor="end">VDD 3.3V </text>

  <line x1="832" y1="198" x2="832" y2="235" stroke="#1a1a1a" stroke-width="1.5"/>

  <line x1="832" y1="265" x2="832" y2="285" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="832" y="295" font-size="10" fill="#6b7280" text-anchor="end">GND </text>

  <text x="832" y="312" font-size="11" fill="#6b7280" text-anchor="middle">• ESD діоди VDD/GND</text>
  <text x="832" y="332" font-size="11" fill="#6b7280" text-anchor="middle">• PullUp ~40kΩ</text>
  <text x="832" y="355" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Увага: НЕ є 5V Tolerant!</text>

  <rect x="750" y="390" width="165" height="125" rx="6" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="832" y="415" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Фізичний вивід Pin</text>
  <text x="832" y="438" font-size="12" font-weight="bold" fill="white" text-anchor="middle">GPIOx / Pad</text>
  <text x="832" y="460" font-size="11" fill="white" text-anchor="middle">Рівень: 0 ... 3.3 В</text>
  <text x="832" y="480" font-size="11" fill="white" text-anchor="middle">Струм: до 12 мА</text>
  <text x="832" y="498" font-size="10" fill="#eaf0fd" text-anchor="middle">(Двонапрямний)</text>

  <!-- Connectors & Arrows -->
  <text x="237" y="138" font-size="10" fill="#2457d6" text-anchor="middle">Периферія</text>
  <line x1="205" y1="147" x2="262" y2="147" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <text x="237" y="203" font-size="10" fill="#2457d6" text-anchor="middle">GPIO_OUT</text>
  <line x1="205" y1="212" x2="262" y2="212" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <text x="237" y="275" font-size="10" fill="#c0392b" text-anchor="middle">Strapping</text>
  <path d="M205,282 L237,282 L237,340 L262,340" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <text x="492" y="201" font-size="10" fill="#27ae60" text-anchor="middle">Маршрутизація</text>
  <line x1="460" y1="210" x2="517" y2="210" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <text x="492" y="403" font-size="10" fill="#1a1a1a" text-anchor="middle">MCU_SEL/Cfg</text>
  <line x1="460" y1="412" x2="517" y2="412" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text x="717" y="236" font-size="10" fill="#27ae60" text-anchor="middle">Вибраний вихід</text>
  <line x1="685" y1="245" x2="742" y2="245" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <text x="717" y="443" font-size="10" fill="#1a1a1a" text-anchor="middle">OE / IE / Pull</text>
  <line x1="685" y1="452" x2="742" y2="452" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="832" y1="375" x2="832" y2="382" stroke="#2457d6" stroke-width="2" marker-end="url(#arrow-blue)"/>
</svg>
