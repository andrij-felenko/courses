<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Топологія шини AXI та ієрархія пам'яті ESP32-P4</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Конкуренція мультимедійних DMA-потоків та L1/L2 кешу за пропускну здатність PSRAM</text>

  <!-- ЛІВА ЧАСТИНА: Джерела (Masters) -->

  <!-- Панель CPU Cores & L1/L2 Cache -->
  <rect x="40" y="85" width="220" height="110" fill="#f4f6f8" stroke="#d0d7de" rx="6"/>
  <text x="150" y="112" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">HP RISC-V Cores (CPU)</text>
  <text x="150" y="138" font-size="12" fill="#1a1a1a" text-anchor="middle">L1 I-Cache &amp; D-Cache</text>
  <text x="150" y="165" font-size="12" fill="#6b7280" text-anchor="middle">Спільний L2 Cache (SRAM)</text>

  <!-- Панель Мультимедіа DMA -->
  <rect x="40" y="210" width="220" height="260" fill="#f4f6f8" stroke="#d0d7de" rx="6"/>
  <text x="150" y="234" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Джерела DMA / Мультимедіа</text>

  <!-- Блок 1: MIPI-CSI -->
  <rect x="55" y="250" width="190" height="60" fill="#eaf0fd" stroke="#2457d6" rx="4"/>
  <text x="150" y="273" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">MIPI-CSI (Камера DMA)</text>
  <text x="150" y="294" font-size="12" fill="#6b7280" text-anchor="middle">Вхідний відеопотік (Rx)</text>

  <!-- Блок 2: PPA -->
  <rect x="55" y="322" width="190" height="60" fill="#eaf0fd" stroke="#2457d6" rx="4"/>
  <text x="150" y="345" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">PPA 2D-Engine DMA</text>
  <text x="150" y="366" font-size="12" fill="#6b7280" text-anchor="middle">Рендеринг / Blit / Blend</text>

  <!-- Блок 3: LCD -->
  <rect x="55" y="394" width="190" height="60" fill="#eaf0fd" stroke="#2457d6" rx="4"/>
  <text x="150" y="417" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">LCD / DSI Display DMA</text>
  <text x="150" y="438" font-size="12" fill="#6b7280" text-anchor="middle">Вихідний сканоут кадрів (Tx)</text>

  <!-- ЦЕНТРАЛЬНА ЧАСТИНА: AXI Bus Matrix -->
  <rect x="300" y="85" width="330" height="385" fill="#f4f6f8" stroke="#2457d6" stroke-width="2" rx="6"/>
  <text x="465" y="108" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Багатошарова матриця шини AXI</text>
  <text x="465" y="126" font-size="12" fill="#6b7280" text-anchor="middle">Паралельна комутація Master/Slave портів</text>

  <!-- Позначки портів ліворуч -->
  <text x="312" y="149" font-size="12" font-weight="bold" fill="#1a1a1a">S0: CPU / L2</text>
  <text x="312" y="273" font-size="12" font-weight="bold" fill="#2457d6">S1: CSI DMA</text>
  <text x="312" y="345" font-size="12" font-weight="bold" fill="#2457d6">S2: PPA DMA</text>
  <text x="312" y="417" font-size="12" font-weight="bold" fill="#2457d6">S3: LCD DMA</text>

  <!-- Зона конкуренції шини -->
  <rect x="415" y="215" width="200" height="240" fill="#fdecea" stroke="#c0392b" stroke-dasharray="4,4" rx="6"/>
  <text x="515" y="238" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Зона конкуренції шини</text>
  <text x="515" y="260" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">B_req = B_CSI + B_PPA + B_LCD</text>
  <text x="515" y="283" font-size="12" fill="#1a1a1a" text-anchor="middle">Одночасний доступ DMA</text>
  <text x="515" y="303" font-size="12" fill="#6b7280" text-anchor="middle">Арбітраж AXI та затримки</text>

  <!-- Позначки портів праворуч -->
  <text x="618" y="149" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">M0: SRAM</text>
  <text x="618" y="340" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">M1: PSRAM Ctrl</text>

  <!-- ПРАВА ЧАСТИНА: Пам'ять (Slaves) -->

  <!-- Панель Internal SRAM -->
  <rect x="670" y="85" width="250" height="110" fill="#e9f7ef" stroke="#27ae60" rx="6"/>
  <text x="795" y="115" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Внутрішній L2 SRAM</text>
  <text x="795" y="140" font-size="12" fill="#1a1a1a" text-anchor="middle">Низька затримка (High Speed)</text>
  <text x="795" y="163" font-size="12" fill="#6b7280" text-anchor="middle">Прямий доступ CPU / Коду</text>

  <!-- Панель External PSRAM Subsystem -->
  <rect x="670" y="210" width="250" height="260" fill="#f4f6f8" stroke="#d0d7de" rx="6"/>
  <text x="795" y="234" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Підсистема зовн. пам'яті</text>

  <!-- Контролер PSRAM -->
  <rect x="685" y="250" width="220" height="90" fill="#fdecea" stroke="#c0392b" rx="4"/>
  <text x="795" y="274" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Контролер PSRAM (MSPI)</text>
  <text x="795" y="297" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Вузьке місце: B_PSRAM,max</text>
  <text x="795" y="320" font-size="12" fill="#6b7280" text-anchor="middle">Обмеження шини обміну</text>

  <!-- Зовнішня PSRAM -->
  <rect x="685" y="355" width="220" height="100" fill="#eaf0fd" stroke="#2457d6" rx="4"/>
  <text x="795" y="380" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Зовнішня High-Speed PSRAM</text>
  <text x="795" y="403" font-size="12" fill="#1a1a1a" text-anchor="middle">Кадрові буфери (RGB565/888)</text>
  <text x="795" y="426" font-size="12" fill="#6b7280" text-anchor="middle">Потрійна буферизація HMI</text>

  <!-- ЛІНІЇ СВЯЗУ (Стрілки та потоки) -->

  <!-- CPU to AXI -->
  <line x1="260" y1="140" x2="292" y2="140" stroke="#6b7280" stroke-width="2" marker-end="url(#arr-gray)"/>

  <!-- MIPI-CSI to AXI -->
  <line x1="245" y1="280" x2="292" y2="280" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- PPA to AXI -->
  <line x1="245" y1="352" x2="292" y2="352" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- LCD to AXI -->
  <line x1="245" y1="424" x2="292" y2="424" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Inside AXI: S0 to M0 -->
  <line x1="300" y1="140" x2="622" y2="140" stroke="#27ae60" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Inside AXI: S1, S2, S3 to Contention Zone -->
  <line x1="300" y1="280" x2="407" y2="280" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="300" y1="352" x2="407" y2="352" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="300" y1="424" x2="407" y2="424" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Contention Zone out to M1 -->
  <line x1="615" y1="330" x2="622" y2="330" stroke="#c0392b" stroke-width="2"/>

  <!-- AXI to Internal SRAM -->
  <line x1="630" y1="140" x2="662" y2="140" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- AXI to PSRAM Controller -->
  <line x1="630" y1="330" x2="662" y2="295" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- PSRAM Controller to Ext PSRAM -->
  <line x1="795" y1="340" x2="795" y2="347" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

</svg>
