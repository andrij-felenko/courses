<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Маркери стрілок -->
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Вирівнювання кадрових буферів у PSRAM для DMA-транзакцій ESP32-P4</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Вирівнювання за межами кеш-ліній (64/128 B) гарантує Zero-Copy та запобігає зіпсуванню даних</text>

  <!-- ЛІВА ПАНЕЛЬ: НЕПРАВИЛЬНО -->
  <rect x="30" y="85" width="435" height="430" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="45" y="100" width="405" height="32" rx="4" fill="#c0392b"/>
  <text x="247" y="121" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">ПОРУШЕННЯ ВИРІВНЯННЯ (НЕПРАВИЛЬНО)</text>

  <!-- Кеш-лінії ліва панель -->
  <rect x="55" y="160" width="90" height="55" fill="#ffffff" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="100" y="180" font-size="12" fill="#c0392b" text-anchor="middle">Line 0</text>
  <text x="100" y="200" font-size="12" fill="#6b7280" text-anchor="middle">0x00..0x3F</text>

  <rect x="153" y="160" width="90" height="55" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="198" y="180" font-size="12" fill="#1a1a1a" text-anchor="middle">Line 1</text>
  <text x="198" y="200" font-size="12" fill="#6b7280" text-anchor="middle">0x40..0x7F</text>

  <rect x="251" y="160" width="90" height="55" fill="#ffffff" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="296" y="180" font-size="12" fill="#c0392b" text-anchor="middle">Line 2</text>
  <text x="296" y="200" font-size="12" fill="#6b7280" text-anchor="middle">0x80..0xBF</text>

  <rect x="349" y="160" width="90" height="55" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="394" y="180" font-size="12" fill="#1a1a1a" text-anchor="middle">Line 3</text>
  <text x="394" y="200" font-size="12" fill="#6b7280" text-anchor="middle">0xC0..0xFF</text>

  <!-- Зсув адреси та лінійний покажчик -->
  <line x1="55" y1="220" x2="55" y2="285" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="80" y1="220" x2="80" y2="232" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="95" y="228" font-size="12" font-weight="700" fill="#c0392b">Зсув +24 B ❌</text>

  <!-- Невирівняний кадровий буфер -->
  <rect x="80" y="235" width="230" height="40" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="195" y="260" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Буфер (0x18 .. 0x98)</text>

  <!-- Текстовий блок опису проблем -->
  <rect x="55" y="300" width="385" height="200" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="70" y="325" font-size="12" font-weight="700" fill="#c0392b">⚠️ Проблема невирівняного буфера в PSRAM:</text>
  <text x="70" y="350" font-size="12" fill="#1a1a1a">1. Адреса 0x18 зміщена відносно межі кеш-лінії</text>
  <text x="70" y="375" font-size="12" fill="#1a1a1a">2. DMA записує кадр напряму в PSRAM</text>
  <text x="70" y="400" font-size="12" font-weight="700" fill="#c0392b">3. Скидання кешу CPU (Writeback) перезаписує</text>
  <text x="88" y="420" font-size="12" font-weight="700" fill="#c0392b">суміжні дані в Line 0 та Line 2!</text>
  <text x="70" y="445" font-size="12" fill="#6b7280">4. Потрібне повільне копіювання через CPU</text>
  <text x="70" y="470" font-size="12" fill="#6b7280">5. Виникають спотворення та падіння FPS</text>


  <!-- ПРАВА ПАНЕЛЬ: ПРАВИЛЬНО -->
  <rect x="495" y="85" width="435" height="430" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="510" y="100" width="405" height="32" rx="4" fill="#27ae60"/>
  <text x="712" y="121" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">ВИРІВНЯНИЙ ZERO-COPY (ПРАВИЛЬНО)</text>

  <!-- Кеш-лінії права панель -->
  <rect x="520" y="160" width="90" height="55" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="565" y="180" font-size="12" fill="#1a1a1a" text-anchor="middle">Line 0</text>
  <text x="565" y="200" font-size="12" fill="#6b7280" text-anchor="middle">0x00..0x3F</text>

  <rect x="618" y="160" width="90" height="55" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="663" y="180" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Line 1</text>
  <text x="663" y="200" font-size="12" fill="#27ae60" text-anchor="middle">0x40..0x7F</text>

  <rect x="716" y="160" width="90" height="55" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="761" y="180" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Line 2</text>
  <text x="761" y="200" font-size="12" fill="#27ae60" text-anchor="middle">0x80..0xBF</text>

  <rect x="814" y="160" width="90" height="55" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="859" y="180" font-size="12" fill="#1a1a1a" text-anchor="middle">Line 3</text>
  <text x="859" y="200" font-size="12" fill="#6b7280" text-anchor="middle">0xC0..0xFF</text>

  <!-- Точна межа вирівнювання -->
  <line x1="618" y1="220" x2="618" y2="232" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="630" y="228" font-size="12" font-weight="700" fill="#27ae60">Вирівняно (64 B) ✓</text>

  <!-- Вирівняний кадровий буфер -->
  <rect x="618" y="235" width="188" height="40" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
  <text x="712" y="260" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Буфер (0x40 .. 0xC0)</text>

  <!-- Текстовий блок опису переваг -->
  <rect x="520" y="300" width="385" height="200" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="535" y="325" font-size="12" font-weight="700" fill="#27ae60">✓ Переваги вирівнювання за кеш-лініями:</text>
  <text x="535" y="350" font-size="12" fill="#1a1a1a">1. Виділення: heap_caps_aligned_alloc(64, size, ...)</text>
  <text x="535" y="375" font-size="12" fill="#1a1a1a">2. Прапори: MALLOC_CAP_SPIRAM | MALLOC_CAP_DMA</text>
  <text x="535" y="400" font-size="12" font-weight="700" fill="#27ae60">3. Нульове копіювання (Zero-Copy) між блоками</text>
  <text x="535" y="425" font-size="12" font-weight="700" fill="#2457d6">4. Апаратний конвеєр: CSI ➔ ISP ➔ PPA ➔ DSI</text>
  <text x="535" y="450" font-size="12" fill="#6b7280">5. Безпечна інвалідація: esp_cache_msync()</text>
  <text x="535" y="475" font-size="12" fill="#6b7280">6. Максимальний FPS при 0% навантаження CPU</text>
</svg>
