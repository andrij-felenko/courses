<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Апаратний конвеєр ISP у мікроконтролері ESP32-P4</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Послідовність апаратної обробки RAW-сигналу камери до формування кадрового буфера в PSRAM</text>

  <!-- Panel 1: Input Sensor Stage -->
  <rect x="24" y="90" width="146" height="330" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="97" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">MIPI-CSI / Сенсор</text>

  <rect x="36" y="132" width="122" height="65" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="97" y="156" text-anchor="middle" font-size="13" font-weight="700" fill="#2457d6">RAW-сенсор</text>
  <text x="97" y="176" text-anchor="middle" font-size="12" fill="#6b7280">Bayer RGBG</text>

  <rect x="36" y="212" width="122" height="192" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="97" y="236" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">Сирий потік</text>
  <text x="97" y="260" text-anchor="middle" font-size="12" fill="#1a1a1a">• Шум матриці</text>
  <text x="97" y="282" text-anchor="middle" font-size="12" fill="#1a1a1a">• Зсув білого</text>
  <text x="97" y="304" text-anchor="middle" font-size="12" fill="#1a1a1a">• Нестабільна AE</text>
  <text x="97" y="326" text-anchor="middle" font-size="12" fill="#1a1a1a">• 1 канал/пікс</text>
  <text x="97" y="348" text-anchor="middle" font-size="12" fill="#1a1a1a">• Хроматизм</text>
  <text x="97" y="380" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">[Потребує ISP]</text>

  <!-- Connection: Input to ISP Core -->
  <line x1="170" y1="164.5" x2="188" y2="164.5" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Panel 2: ISP Hardware Pipeline Core -->
  <rect x="190" y="90" width="560" height="330" fill="#f4f6f8" stroke="#2457d6" stroke-width="2" rx="8"/>
  <text x="470" y="116" text-anchor="middle" font-size="15" font-weight="700" fill="#2457d6">Апаратний процесор зображень (ESP32-P4 ISP Core)</text>

  <!-- ISP Block 1: Denoise -->
  <rect x="204" y="132" width="122" height="158" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="6"/>
  <text x="265" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#2457d6">1. Фільтрація</text>
  <text x="265" y="173" text-anchor="middle" font-size="13" font-weight="700" fill="#2457d6">шуму (BFM)</text>
  <text x="265" y="200" text-anchor="middle" font-size="12" fill="#1a1a1a">Придушення</text>
  <text x="265" y="218" text-anchor="middle" font-size="12" fill="#1a1a1a">просторового</text>
  <text x="265" y="236" text-anchor="middle" font-size="12" fill="#1a1a1a">шуму Bayer</text>
  <text x="265" y="270" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280">[BFM Denoise]</text>

  <line x1="326" y1="211" x2="340" y2="211" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ISP Block 2: Auto Exposure -->
  <rect x="342" y="132" width="122" height="158" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="6"/>
  <text x="403" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#2457d6">2. Авто-</text>
  <text x="403" y="173" text-anchor="middle" font-size="13" font-weight="700" fill="#2457d6">експозиція</text>
  <text x="403" y="200" text-anchor="middle" font-size="12" fill="#1a1a1a">Оцінка</text>
  <text x="403" y="218" text-anchor="middle" font-size="12" fill="#1a1a1a">яскравості &amp;</text>
  <text x="403" y="236" text-anchor="middle" font-size="12" fill="#1a1a1a">гістограми</text>
  <text x="403" y="270" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280">[AE Stats]</text>

  <line x1="464" y1="211" x2="478" y2="211" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ISP Block 3: Auto White Balance -->
  <rect x="480" y="132" width="122" height="158" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="6"/>
  <text x="541" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#2457d6">3. Автобаланс</text>
  <text x="541" y="173" text-anchor="middle" font-size="13" font-weight="700" fill="#2457d6">білого (AWB)</text>
  <text x="541" y="200" text-anchor="middle" font-size="12" fill="#1a1a1a">Корекція під-</text>
  <text x="541" y="218" text-anchor="middle" font-size="12" fill="#1a1a1a">силення R/G/B</text>
  <text x="541" y="236" text-anchor="middle" font-size="12" fill="#1a1a1a">температури</text>
  <text x="541" y="270" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280">[AWB Gain]</text>

  <line x1="602" y1="211" x2="616" y2="211" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ISP Block 4: Demosaicing -->
  <rect x="618" y="132" width="122" height="158" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="6"/>
  <text x="679" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#2457d6">4. Дебаєризація</text>
  <text x="679" y="173" text-anchor="middle" font-size="13" font-weight="700" fill="#2457d6">(Demosaic)</text>
  <text x="679" y="200" text-anchor="middle" font-size="12" fill="#1a1a1a">Інтерполяція</text>
  <text x="679" y="218" text-anchor="middle" font-size="12" fill="#1a1a1a">RAW Bayer →</text>
  <text x="679" y="236" text-anchor="middle" font-size="12" fill="#1a1a1a">повний RGB</text>
  <text x="679" y="270" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280">[Bayer to RGB]</text>

  <!-- Sub-panel: Post-processing & Statistics feedback -->
  <rect x="204" y="304" width="536" height="100" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6" stroke-dasharray="4 4"/>
  <text x="470" y="328" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Модулі колірної корекції (CCM/Gamma) та зворотного зв'язку</text>
  <text x="470" y="350" text-anchor="middle" font-size="12" fill="#6b7280">Апаратний аналіз гістограм та автоматичне регулювання витримки сенсора</text>
  <text x="470" y="384" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">Сформований потік: Очищений, збалансований RGB / YUV422</text>

  <!-- Connection: ISP to Output -->
  <line x1="750" y1="164.5" x2="768" y2="164.5" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Panel 3: Output Memory Stage -->
  <rect x="770" y="90" width="166" height="330" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="853" y="116" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Пам'ять &amp; PPA</text>

  <rect x="782" y="132" width="142" height="65" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="853" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">DMA Контролер</text>
  <text x="853" y="176" text-anchor="middle" font-size="12" fill="#6b7280">Zero-copy передача</text>

  <line x1="853" y1="197" x2="853" y2="210" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="782" y="212" width="142" height="90" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="853" y="236" text-anchor="middle" font-size="13" font-weight="700" fill="#27ae60">Кадровий буфер</text>
  <text x="853" y="256" text-anchor="middle" font-size="13" font-weight="700" fill="#27ae60">у PSRAM</text>
  <text x="853" y="284" text-anchor="middle" font-size="12" fill="#1a1a1a">Готовий відеокадр</text>

  <line x1="853" y1="302" x2="853" y2="315" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="782" y="317" width="142" height="87" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="853" y="340" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">PPA / MIPI-DSI</text>
  <text x="853" y="362" text-anchor="middle" font-size="12" fill="#1a1a1a">2D-блендинг &amp;</text>
  <text x="853" y="382" text-anchor="middle" font-size="12" fill="#1a1a1a">вивід на дисплей</text>
</svg>
