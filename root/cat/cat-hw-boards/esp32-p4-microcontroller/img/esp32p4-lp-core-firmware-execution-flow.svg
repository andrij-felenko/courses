<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Header -->
  <text x="480" y="34" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Ініціалізація та автономне виконання прошивки LP-Core в ESP32-P4</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Завантаження бінарного образу в LP SRAM з HP-ядра та автономний цикл опитування периферії</text>

  <!-- Panel 1: HP Domain -->
  <rect x="30" y="80" width="280" height="435" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="42" y="92" width="256" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="170" y="111" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">1. HP-домен: Ініціалізація LP</text>

  <!-- Block 1.1 -->
  <rect x="45" y="132" width="250" height="52" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="170" y="152" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Конфігурація esp_lp_core_config_t</text>
  <text x="170" y="170" font-size="11" fill="#6b7280" text-anchor="middle">Налаштування джерела тактування й точок входу</text>

  <line x1="170" y1="184" x2="170" y2="199" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Block 1.2 -->
  <rect x="45" y="201" width="250" height="56" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="170" y="221" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">esp_lp_core_load_binary()</text>
  <text x="170" y="239" font-size="11" fill="#1a1a1a" text-anchor="middle">Копіювання ELF/bin образу в LP SRAM</text>

  <line x1="170" y1="257" x2="170" y2="272" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Block 1.3 -->
  <rect x="45" y="274" width="250" height="52" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="170" y="294" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">esp_lp_core_run()</text>
  <text x="170" y="312" font-size="11" fill="#2457d6" text-anchor="middle">Скинути скидання (reset) &amp; запуск LP-Core</text>

  <line x1="170" y1="326" x2="170" y2="341" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Block 1.4 -->
  <rect x="45" y="343" width="250" height="56" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="170" y="363" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Перехід HP в Light / Deep Sleep</text>
  <text x="170" y="381" font-size="11" fill="#1a1a1a" text-anchor="middle">HP-ядра знеструмлені, шина HP вимкнена</text>

  <!-- Info Box 1 -->
  <rect x="45" y="414" width="250" height="86" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4"/>
  <text x="170" y="434" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="middle">Особливості HP-домену</text>
  <text x="170" y="452" font-size="11" fill="#6b7280" text-anchor="middle">• Завантаження виконується 1 раз при старті</text>
  <text x="170" y="470" font-size="11" fill="#6b7280" text-anchor="middle">• HP керує живленням та джерелами сну</text>
  <text x="170" y="488" font-size="11" fill="#6b7280" text-anchor="middle">• Вивільняє HP-ядра для знеструмлення</text>

  <!-- Panel 2: LP SRAM -->
  <rect x="340" y="80" width="280" height="435" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="352" y="92" width="256" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="111" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">2. Пам'ять LP SRAM (Fast RTC)</text>

  <!-- Block 2.1 -->
  <rect x="355" y="132" width="250" height="60" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="152" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Вектори переривань &amp; Код (.text)</text>
  <text x="480" y="170" font-size="11" fill="#1a1a1a" text-anchor="middle">LP RISC-V інструкції та прошивка</text>
  <text x="480" y="184" font-size="11" fill="#6b7280" text-anchor="middle">Адреса входу: LP_RAM_BASE</text>

  <line x1="480" y1="192" x2="480" y2="204" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Block 2.2 -->
  <rect x="355" y="206" width="250" height="56" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="226" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Оперативні дані та Стек (.data / stack)</text>
  <text x="480" y="244" font-size="11" fill="#6b7280" text-anchor="middle">Локальні змінні та стек LP-Core</text>

  <line x1="480" y1="262" x2="480" y2="274" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Block 2.3 -->
  <rect x="355" y="276" width="250" height="64" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="296" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Спільний буфер IPC &amp; Семафори</text>
  <text x="480" y="314" font-size="11" fill="#1a1a1a" text-anchor="middle">Обмін даними між HP та LP доменами</text>
  <text x="480" y="330" font-size="11" fill="#27ae60" text-anchor="middle">Прапорці готовності, лічильники, телеметрія</text>

  <!-- Info Box 2 -->
  <rect x="355" y="355" width="250" height="145" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4"/>
  <text x="480" y="375" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="middle">Властивості LP SRAM в ESP32-P4</text>
  <text x="480" y="395" font-size="11" fill="#6b7280" text-anchor="middle">• Зберігає стан під час Deep Sleep</text>
  <text x="480" y="413" font-size="11" fill="#6b7280" text-anchor="middle">• Двопортовий доступ (HP Bus &amp; LP Bus)</text>
  <text x="480" y="431" font-size="11" fill="#6b7280" text-anchor="middle">• Апаратні семафори запобігають race condition</text>
  <text x="480" y="449" font-size="11" fill="#6b7280" text-anchor="middle">• Атомні операції читання/запису</text>
  <text x="480" y="467" font-size="11" fill="#6b7280" text-anchor="middle">• Обсяг 32 KB / 16 KB залежно від конфігурації</text>

  <!-- Panel 3: LP Domain -->
  <rect x="650" y="80" width="280" height="435" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="662" y="92" width="256" height="28" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="790" y="111" font-size="13" font-weight="700" fill="#27ae60" text-anchor="middle">3. LP-домен: Автономний цикл</text>

  <!-- Block 3.1 -->
  <rect x="665" y="132" width="250" height="52" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="790" y="152" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Старт LP RISC-V з Vector Table</text>
  <text x="790" y="170" font-size="11" fill="#27ae60" text-anchor="middle">Ініціалізація LP I2C / LP GPIO / RTC Timer</text>

  <line x1="790" y1="184" x2="790" y2="199" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Block 3.2 -->
  <rect x="665" y="201" width="250" height="56" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="790" y="221" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Опитування сенсорів (LP I2C / GPIO)</text>
  <text x="790" y="239" font-size="11" fill="#1a1a1a" text-anchor="middle">Автономне вимірювання без HP-ядер</text>

  <line x1="790" y1="257" x2="790" y2="272" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Block 3.3 -->
  <rect x="665" y="274" width="250" height="54" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="790" y="294" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Перевірка умови / порогу показів</text>
  <text x="790" y="312" font-size="11" fill="#6b7280" text-anchor="middle">Норма → Короткий сон / Чекати таймер</text>

  <line x1="790" y1="328" x2="790" y2="343" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Block 3.4 -->
  <rect x="665" y="345" width="250" height="56" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="790" y="365" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Подія → Генерація переривання HP</text>
  <text x="790" y="383" font-size="11" fill="#1a1a1a" text-anchor="middle">Сигнал PMU Wakeup для пробудження HP</text>

  <!-- Info Box 3 -->
  <rect x="665" y="414" width="250" height="86" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1" stroke-dasharray="4"/>
  <text x="790" y="434" font-size="11" font-weight="700" fill="#27ae60" text-anchor="middle">Переваги автономності LP-Core</text>
  <text x="790" y="452" font-size="11" fill="#6b7280" text-anchor="middle">• Скарбниця енергозбереження (мікроампери)</text>
  <text x="790" y="470" font-size="11" fill="#6b7280" text-anchor="middle">• HP-ядра пробуджуються лише за потреби</text>
  <text x="790" y="488" font-size="11" fill="#6b7280" text-anchor="middle">• Повна незалежність обробки периферії</text>

  <!-- Inter-panel Connection 1: Load binary (Block 1.2 -> Block 2.1) -->
  <path d="M 295,229 L 325,229 L 325,162 L 353,162" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Inter-panel Connection 2: Run core (Block 1.3 -> Block 3.1) -->
  <path d="M 295,300 L 325,300 L 325,125 L 640,125 L 640,158 L 663,158" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Inter-panel Connection 3: IPC Access (Block 3.2 -> Block 2.3) -->
  <path d="M 665,229 L 635,229 L 635,308 L 607,308" fill="none" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Inter-panel Connection 4: Wakeup Signal (Block 3.4 -> Block 1.4) -->
  <path d="M 665,373 L 635,373 L 635,510 L 310,510 L 310,371 L 297,371" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
</svg>
