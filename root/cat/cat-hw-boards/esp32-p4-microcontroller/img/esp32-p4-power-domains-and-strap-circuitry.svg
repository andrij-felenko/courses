<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Домени живлення та обв'язка Strap-виводів ESP32-P4</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Послідовність живлення VDD_LP → VDD_HP/SDIO/MIPI, фільтрація та логіка скидання</text>

  <!-- PANEL 1: Power Domains & Filtering Network -->
  <rect x="30" y="75" width="420" height="440" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="50" y="100" font-size="14" font-weight="bold" fill="#1a1a1a">Домени живлення та фільтрація</text>

  <!-- Domain 1: VDD_LP -->
  <rect x="45" y="112" width="390" height="78" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="6"/>
  <text x="60" y="132" font-size="13" font-weight="bold" fill="#2457d6">1. VDD_LP (3.3 В) — Домен низького споживання</text>
  <text x="60" y="152" font-size="12" fill="#1a1a1a">Живиться першим. Запускає PMU та RTC систему.</text>
  <text x="60" y="172" font-size="12" fill="#6b7280">Фільтрація: C_bulk = 10 мкФ + C_filter = 100 нФ</text>

  <!-- Sequence Arrow -->
  <path d="M 240 190 L 240 203" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="252" y="200" font-size="12" fill="#2457d6">VDD_LP OK → старт основних джерел</text>

  <!-- Domain 2: VDD_HP -->
  <rect x="45" y="208" width="390" height="78" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="60" y="228" font-size="13" font-weight="bold" fill="#1a1a1a">2. VDD_HP (1.1 В / 3.3 В) — Основне ядро та кеш</text>
  <text x="60" y="248" font-size="12" fill="#1a1a1a">Ядра HP RISC-V (400 МГц), L1/L2 кеш, 2D-DMA</text>
  <text x="60" y="268" font-size="12" fill="#6b7280">Фільтрація: 10 мкФ + кераміка 100 нФ біля Pin-пар</text>

  <!-- Domain 3: VDD_SDIO & VDD_MIPI -->
  <rect x="45" y="296" width="390" height="78" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="60" y="316" font-size="13" font-weight="bold" fill="#1a1a1a">3. VDD_SDIO (1.8/3.3 В) та VDD_MIPI (1.1/2.5 В)</text>
  <text x="60" y="336" font-size="12" fill="#1a1a1a">Живлення зовнішньої Flash/PSRAM та камери/екрана</text>
  <text x="60" y="356" font-size="12" fill="#6b7280">Фільтрація: 10 мкФ + 100 нФ окремо для кожної шини</text>

  <!-- Recommendations / Guidelines -->
  <rect x="45" y="384" width="390" height="116" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="6"/>
  <text x="60" y="406" font-size="13" font-weight="bold" fill="#27ae60">Рекомендації з розводки плати (PCB Layout):</text>
  <text x="60" y="428" font-size="12" fill="#1a1a1a">• Конденсатори 100 нФ розміщувати біля виводів живлення</text>
  <text x="60" y="448" font-size="12" fill="#1a1a1a">• Короткі широкі доріжки від конденсаторів до суцільного GND</text>
  <text x="60" y="468" font-size="12" fill="#1a1a1a">• Роздільні фільтри заважають імпульсним наводкам SDIO/MIPI</text>

  <!-- PANEL 2: RC Circuit & CHIP_PU Power-On Reset -->
  <rect x="470" y="75" width="460" height="210" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="490" y="100" font-size="14" font-weight="bold" fill="#1a1a1a">Ланцюг скидання CHIP_PU (EN) та RC-затримка</text>

  <rect x="485" y="112" width="430" height="158" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>

  <!-- RC Circuit Schematics Diagram -->
  <!-- Wire VDD_LP to R_EN -->
  <text x="500" y="132" font-size="12" font-weight="bold" fill="#2457d6">VDD_LP (3.3V)</text>
  <path d="M 580 128 L 600 128" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- Resistor R_EN -->
  <rect x="600" y="120" width="45" height="16" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="622" y="132" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">10 kΩ</text>
  
  <!-- Wire to Node -->
  <path d="M 645 128 L 680 128" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="680" cy="128" r="3" fill="#1a1a1a"/>

  <!-- Wire to CHIP_PU Pin -->
  <path d="M 680 128 L 740 128" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>
  <rect x="745" y="116" width="155" height="24" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="822" y="132" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">CHIP_PU (Reset Pin)</text>

  <!-- Wire down to C_EN -->
  <path d="M 680 128 L 680 155" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Capacitor C_EN -->
  <line x1="668" y1="155" x2="692" y2="155" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="668" y1="160" x2="692" y2="160" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 680 160 L 680 172" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Ground symbol -->
  <line x1="672" y1="172" x2="688" y2="172" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="675" y1="175" x2="685" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="678" y1="178" x2="682" y2="178" stroke="#1a1a1a" stroke-width="1"/>
  <text x="700" y="162" font-size="12" fill="#1a1a1a">C_EN = 1 мкФ</text>

  <!-- Reset Button Branch -->
  <path d="M 680 140 L 800 140 M 800 140 L 800 155" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="810" y="155" font-size="12" fill="#6b7280">Кнопка RESET (до GND)</text>

  <!-- RC Requirements -->
  <text x="500" y="205" font-size="12" fill="#c0392b">• Вимога часового таймінгу: CHIP_PU наростає ПІСЛЯ стабілізації VDD_LP</text>
  <text x="500" y="225" font-size="12" fill="#27ae60">• Стала часу τ = R × C ≈ 10 мс забезпечує чистий Power-On Reset</text>
  <text x="500" y="245" font-size="12" fill="#1a1a1a">• Запобігає помилковим збоям процесора при повільному підйомі живлення</text>

  <!-- PANEL 3: Strap Pins & Boot Configuration -->
  <rect x="470" y="295" width="460" height="220" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="490" y="320" font-size="14" font-weight="bold" fill="#1a1a1a">Конфігурація завантаження (Strap Pins)</text>

  <rect x="485" y="332" width="430" height="168" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="500" y="352" font-size="12" fill="#1a1a1a">Логічні рівні Strap-виводів зчитуються за фронтом CHIP_PU:</text>

  <!-- Row 1: SPI Flash Boot -->
  <rect x="500" y="362" width="400" height="34" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="515" y="383" font-size="12" font-weight="bold" fill="#27ae60">[1 1] SPI Flash Boot</text>
  <text x="680" y="383" font-size="12" fill="#1a1a1a">Штатне завантаження з Flash</text>

  <!-- Row 2: Joint Download Mode -->
  <rect x="500" y="402" width="400" height="34" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="515" y="423" font-size="12" font-weight="bold" fill="#2457d6">[0 1] Download Mode</text>
  <text x="680" y="423" font-size="12" fill="#1a1a1a">Прошивка через USB / UART</text>

  <!-- Row 3: Reserved / Invalid -->
  <rect x="500" y="442" width="400" height="46" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="515" y="460" font-size="12" font-weight="bold" fill="#c0392b">[0 0] / Інші стани</text>
  <text x="515" y="478" font-size="12" fill="#1a1a1a">Режими тестування; не залишати Strap-виводи підвішеними</text>

</svg>
