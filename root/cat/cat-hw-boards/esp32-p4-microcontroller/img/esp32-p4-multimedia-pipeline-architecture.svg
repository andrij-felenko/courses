<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-success" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="530" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Мультимедійний конвеєр ESP32-P4</text>
  <text x="480" y="54" font-size="13" text-anchor="middle" fill="#6b7280">Апаратні блоки обробляють та виводять відеопотік через DMA без залучення ядер HP CPU</text>

  <!-- 1. Джерело відео (Камера) -->
  <rect x="25" y="130" width="115" height="180" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="82" y="165" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a1a">Камера</text>
  <text x="82" y="185" font-size="12" text-anchor="middle" fill="#6b7280">(MIPI-CSI)</text>
  <text x="82" y="220" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">Відеопотік</text>
  <text x="82" y="240" font-size="12" text-anchor="middle" fill="#6b7280">Raw Sensor</text>
  <text x="82" y="260" font-size="12" text-anchor="middle" fill="#6b7280">2-lane CSI</text>

  <!-- Лінія MIPI-CSI Вхід -->
  <line x1="140" y1="220" x2="180" y2="220" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-accent)"/>
  <text x="160" y="205" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">MIPI-CSI</text>

  <!-- 2. Корпус чипа ESP32-P4 -->
  <rect x="180" y="80" width="600" height="430" rx="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="200" y="105" font-size="14" font-weight="700" fill="#1a1a1a">Мікроконтролер ESP32-P4 (HP мультимедійна підсистема)</text>

  <!-- 2.1 Апаратний конвеєр відеообробки -->
  <rect x="200" y="120" width="560" height="195" rx="8" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="215" y="142" font-size="13" font-weight="700" fill="#2457d6">Апаратний мультимедійний конвеєр (Zero CPU Load)</text>

  <!-- Блок 1: MIPI-CSI & ISP -->
  <rect x="215" y="155" width="120" height="145" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="275" y="178" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">MIPI-CSI &amp; ISP</text>
  <text x="275" y="200" font-size="12" text-anchor="middle" fill="#6b7280">Приймач CSI</text>
  <text x="275" y="220" font-size="12" text-anchor="middle" fill="#6b7280">Обробка сигналу</text>
  <text x="275" y="240" font-size="12" text-anchor="middle" fill="#1a1a1a">Bayer → RGB/YUV</text>
  <text x="275" y="260" font-size="12" text-anchor="middle" fill="#6b7280">AWB, AE, Denoise</text>

  <!-- Стрілка Блок 1 -> Блок 2 -->
  <line x1="335" y1="227" x2="355" y2="227" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>

  <!-- Блок 2: 2D PPA Прискорювач -->
  <rect x="355" y="155" width="125" height="145" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="417" y="178" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">2D PPA</text>
  <text x="417" y="200" font-size="12" text-anchor="middle" fill="#6b7280">2D Графіка</text>
  <text x="417" y="220" font-size="12" text-anchor="middle" fill="#1a1a1a">Масштабування</text>
  <text x="417" y="240" font-size="12" text-anchor="middle" fill="#1a1a1a">Поворот кадрів</text>
  <text x="417" y="260" font-size="12" text-anchor="middle" fill="#6b7280">Альфа-блендинг</text>

  <!-- Розгалуження від 2D PPA до Кодера та Дисплея -->
  <line x1="480" y1="188" x2="500" y2="188" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <line x1="480" y1="269" x2="500" y2="269" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>

  <!-- Блок 3: H.264 / JPEG Кодер -->
  <rect x="500" y="155" width="120" height="67" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="560" y="176" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">H.264 / JPEG</text>
  <text x="560" y="195" font-size="12" text-anchor="middle" fill="#6b7280">Відеокодер</text>
  <text x="560" y="211" font-size="12" text-anchor="middle" fill="#1a1a1a">Стиснення</text>

  <!-- Блок 4: MIPI-DSI Host -->
  <rect x="500" y="236" width="120" height="67" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="560" y="257" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">MIPI-DSI Host</text>
  <text x="560" y="276" font-size="12" text-anchor="middle" fill="#6b7280">Дисплейний контролер</text>
  <text x="560" y="292" font-size="12" text-anchor="middle" fill="#1a1a1a">2-lane DSI</text>

  <!-- 2.2 Шина даних AXI та пам'ять -->
  <rect x="200" y="330" width="560" height="65" rx="8" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="215" y="354" font-size="13" font-weight="700" fill="#1a1a1a">Шина AXI / Апаратний DMA-конвеєр</text>
  <text x="215" y="374" font-size="12" fill="#6b7280">Прямий доступ до пам'яті без участі CPU</text>

  <!-- Блок Пам'яті (PSRAM) -->
  <rect x="520" y="338" width="225" height="48" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="632" y="357" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Кадрові буфери (Frame Buffers)</text>
  <text x="632" y="374" font-size="12" text-anchor="middle" fill="#6b7280">L2 Cache / Зовнішня PSRAM</text>

  <!-- DMA зв'язки між конвеєром та шиною AXI -->
  <line x1="275" y1="300" x2="275" y2="330" stroke="#2457d6" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr-accent)"/>
  <text x="295" y="318" font-size="12" font-weight="700" fill="#2457d6">DMA</text>

  <line x1="417" y1="300" x2="417" y2="330" stroke="#2457d6" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr-accent)"/>
  <text x="437" y="318" font-size="12" font-weight="700" fill="#2457d6">DMA</text>

  <!-- 2.3 Двоядерний HP CPU -->
  <rect x="200" y="410" width="560" height="85" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="215" y="434" font-size="13" font-weight="700" fill="#1a1a1a">Двоядерний HP CPU (RISC-V з AI/Vector розширеннями)</text>
  <text x="215" y="456" font-size="12" fill="#6b7280">Управління: лише первинне налаштування дескрипторів DMA</text>
  <text x="215" y="476" font-size="12" fill="#1a1a1a">Ядра повністю вільні від попіксельної обробки відеокадрів</text>

  <!-- Плашка статусу CPU -->
  <rect x="540" y="422" width="205" height="60" rx="6" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <text x="642" y="445" font-size="13" font-weight="700" text-anchor="middle" fill="#27ae60">0% CPU Load на відео</text>
  <text x="642" y="466" font-size="12" text-anchor="middle" fill="#6b7280">Ресурс для TinyML / AI</text>

  <!-- Лінія контролю від CPU -->
  <line x1="310" y1="410" x2="310" y2="395" stroke="#27ae60" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arr-success)"/>
  <text x="322" y="405" font-size="12" fill="#27ae60">Дескриптори</text>

  <!-- 3. Дисплей (MIPI-DSI Output) -->
  <rect x="820" y="130" width="115" height="180" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="877" y="165" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a1a">Дисплей</text>
  <text x="877" y="185" font-size="12" text-anchor="middle" fill="#6b7280">(MIPI-DSI)</text>
  <text x="877" y="220" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">Відображення</text>
  <text x="877" y="240" font-size="12" text-anchor="middle" fill="#6b7280">HMI Панель</text>
  <text x="877" y="260" font-size="12" text-anchor="middle" fill="#6b7280">1080p / 720p</text>

  <!-- Лінія MIPI-DSI Вихід -->
  <line x1="620" y1="269" x2="820" y2="269" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-success)"/>
  <text x="700" y="255" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">MIPI-DSI</text>

</svg>
