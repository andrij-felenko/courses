<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Canvas background -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Header -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Архітектура графічного пайплайну ESP32-P4 з MIPI-DSI та PSRAM</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Автономна передача фреймбуфера з PSRAM на дисплей через DMA без навантаження CPU</text>

  <!-- CONTAINER 1: Processing -->
  <rect x="25" y="80" width="200" height="395" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="125" y="105" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Обробка графіки</text>

  <!-- Block 1A: CPU -->
  <rect x="35" y="120" width="180" height="110" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="125" y="142" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">HP CPU (Dual RISC-V)</text>
  <text x="125" y="164" font-size="12" fill="#6b7280" text-anchor="middle">Логіка UI &amp; LVGL</text>
  <text x="125" y="184" font-size="12" fill="#1a1a1a" text-anchor="middle">Конфігурація PPA/DMA</text>
  <text x="125" y="208" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">✓ Вільний під час DMA</text>

  <!-- Block 1B: PPA -->
  <rect x="35" y="250" width="180" height="210" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="125" y="272" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">2D PPA Прискорювач</text>
  <text x="125" y="292" font-size="12" fill="#6b7280" text-anchor="middle">Pixel Processing Accel.</text>
  <text x="125" y="320" font-size="12" fill="#1a1a1a" text-anchor="middle">• Alpha-blending шарів</text>
  <text x="125" y="342" font-size="12" fill="#1a1a1a" text-anchor="middle">• Поворот (0° / 90° / 180°)</text>
  <text x="125" y="364" font-size="12" fill="#1a1a1a" text-anchor="middle">• Масштабування растру</text>
  <text x="125" y="386" font-size="12" fill="#1a1a1a" text-anchor="middle">• Конверсія RGB565/888</text>
  <text x="125" y="415" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">✓ Апаратний рендеринг</text>

  <!-- CONTAINER 2: PSRAM -->
  <rect x="255" y="80" width="210" height="395" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="360" y="105" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Зовнішня пам'ять PSRAM</text>
  <text x="360" y="126" font-size="12" fill="#6b7280" text-anchor="middle">High-Speed MSPI Bus</text>

  <!-- Block 2A: FB1 -->
  <rect x="265" y="145" width="190" height="135" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="4"/>
  <text x="360" y="170" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Frame Buffer 1 (FB1)</text>
  <text x="360" y="192" font-size="12" fill="#6b7280" text-anchor="middle">Буфер малювання LVGL</text>
  <text x="360" y="218" font-size="12" fill="#1a1a1a" text-anchor="middle">Отримує готові кадрові</text>
  <text x="360" y="238" font-size="12" fill="#1a1a1a" text-anchor="middle">дані від PPA прискорювача</text>
  <text x="360" y="263" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Статус: Рендеринг PPA</text>

  <!-- Block 2B: FB2 -->
  <rect x="265" y="300" width="190" height="160" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="4"/>
  <text x="360" y="325" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">Frame Buffer 2 (FB2)</text>
  <text x="360" y="347" font-size="12" fill="#6b7280" text-anchor="middle">Активний відеокадр</text>
  <text x="360" y="373" font-size="12" fill="#1a1a1a" text-anchor="middle">Пряма передача в DSI</text>
  <text x="360" y="393" font-size="12" fill="#1a1a1a" text-anchor="middle">через 2D DMA конвеєр</text>
  <text x="360" y="420" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">✓ Передача без CPU</text>

  <!-- CONTAINER 3: MIPI-DSI -->
  <rect x="495" y="80" width="210" height="395" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="600" y="105" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Контролер MIPI-DSI</text>

  <!-- Block 3A: DMA -->
  <rect x="505" y="125" width="190" height="100" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="600" y="148" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">2D DMA Controller</text>
  <text x="600" y="170" font-size="12" fill="#6b7280" text-anchor="middle">Пряме вичитування PSRAM</text>
  <text x="600" y="192" font-size="12" fill="#1a1a1a" text-anchor="middle">Автономна вибірка кадрів</text>
  <text x="600" y="212" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">0% навантаження CPU</text>

  <!-- Block 3B: Host -->
  <rect x="505" y="240" width="190" height="95" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="4"/>
  <text x="600" y="263" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">MIPI-DSI Host</text>
  <text x="600" y="285" font-size="12" fill="#6b7280" text-anchor="middle">Протокольний контролер</text>
  <text x="600" y="307" font-size="12" fill="#1a1a1a" text-anchor="middle">Формування DSI пакетів</text>
  <text x="600" y="325" font-size="12" fill="#1a1a1a" text-anchor="middle">DPI / Video Mode</text>

  <!-- Block 3C: PHY -->
  <rect x="505" y="350" width="190" height="110" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="600" y="373" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">MIPI D-PHY (PHY Layer)</text>
  <text x="600" y="395" font-size="12" fill="#6b7280" text-anchor="middle">Високошвидкісні лінії</text>
  <text x="600" y="417" font-size="12" fill="#1a1a1a" text-anchor="middle">2 × Data Lanes (1.5 Gbps)</text>
  <text x="600" y="437" font-size="12" fill="#1a1a1a" text-anchor="middle">1 × Clock Lane</text>

  <!-- CONTAINER 4: Display -->
  <rect x="735" y="80" width="200" height="395" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="835" y="105" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Дисплейний модуль</text>

  <!-- Block 4A: LCD Panel -->
  <rect x="745" y="125" width="180" height="225" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" rx="6"/>
  <text x="835" y="145" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">MIPI-DSI LCD Panel</text>
  <rect x="755" y="155" width="160" height="150" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="3"/>
  <text x="835" y="195" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">1024 × 600 @ 60 Hz</text>
  <text x="835" y="220" font-size="12" fill="#1a1a1a" text-anchor="middle">Відображення кадру</text>
  <text x="835" y="240" font-size="12" fill="#1a1a1a" text-anchor="middle">Плавна анімація UI</text>
  <text x="835" y="270" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Без розривів (Tear-free)</text>

  <!-- Block 4B: TE/VSYNC -->
  <rect x="745" y="365" width="180" height="95" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="835" y="388" font-size="13" font-weight="700" fill="#27ae60" text-anchor="middle">TE / VSYNC Sync</text>
  <text x="835" y="408" font-size="12" fill="#6b7280" text-anchor="middle">Кадрова синхронізація</text>
  <text x="835" y="428" font-size="12" fill="#1a1a1a" text-anchor="middle">Перемикання FB1/FB2</text>

  <!-- FLOW PIPELINE ARROWS -->
  <!-- 1. CPU -> PPA control -->
  <path d="M 125,230 L 125,250" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-gray)"/>

  <!-- 2. PPA -> FB1 (Render output) -->
  <path d="M 215,355 L 240,355 L 240,210 L 265,210" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>

  <!-- 3. FB2 -> 2D DMA (Direct Memory Access) -->
  <path d="M 455,380 L 480,380 L 480,175 L 505,175" stroke="#2457d6" stroke-width="2.5" fill="none" marker-end="url(#arr-blue)"/>

  <!-- 4. DMA -> MIPI-DSI Host -->
  <path d="M 600,225 L 600,240" stroke="#2457d6" stroke-width="2" fill="none" marker-end="url(#arr-blue)"/>

  <!-- 5. MIPI-DSI Host -> PHY -->
  <path d="M 600,335 L 600,350" stroke="#2457d6" stroke-width="2" fill="none" marker-end="url(#arr-blue)"/>

  <!-- 6. PHY -> LCD Panel -->
  <path d="M 695,405 L 720,405 L 720,230 L 745,230" stroke="#2457d6" stroke-width="2.5" fill="none" marker-end="url(#arr-blue)"/>

  <!-- 7. TE/VSYNC feedback -> FB swap sync -->
  <path d="M 745,412 L 725,412 L 725,465 L 480,465 L 480,440 L 455,440" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arr-green)"/>
</svg>
