<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow marker for blue signal flows -->
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <!-- Arrow marker for default dark lines -->
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- 1. White Canvas Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- 2. Diagram Title and Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Схема узгодження GPIO ESP8266 з 5В модулем силового реле</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Оптопара та транзисторний ключ узгоджують рівні 3.3В/5В і блокують реле під час завантаження МК</text>

  <!-- 3. Three Main Panels -->
  <!-- Panel 1: ESP8266 Microcontroller -->
  <rect x="30" y="70" width="260" height="385" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="45" y="82" width="230" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="160" y="101" text-anchor="middle" font-size="13" font-weight="700" fill="#2457d6">1. МК ESP8266 (Логіка 3.3 В)</text>

  <!-- Panel 2: Level Shifter & Isolation -->
  <rect x="320" y="70" width="320" height="385" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="330" y="82" width="300" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="101" text-anchor="middle" font-size="13" font-weight="700" fill="#2457d6">2. Вузол разв'язки та узгодження</text>

  <!-- Panel 3: Relay & Load -->
  <rect x="670" y="70" width="260" height="385" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="680" y="82" width="240" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="800" y="101" text-anchor="middle" font-size="13" font-weight="700" fill="#2457d6">3. Модуль реле 5 В і навантаження</text>

  <!-- 4. Power & Ground Rails -->
  <!-- 3.3V Power Rail -->
  <line x1="45" y1="130" x2="370" y2="130" stroke="#2457d6" stroke-width="2"/>
  <text x="70" y="122" text-anchor="start" font-size="12" font-weight="700" fill="#2457d6">VCC = +3.3 В</text>

  <!-- 5.0V Power Rail -->
  <line x1="450" y1="130" x2="915" y2="130" stroke="#27ae60" stroke-width="2"/>
  <text x="500" y="122" text-anchor="start" font-size="12" font-weight="700" fill="#27ae60">VCC_RELAY = +5.0 В</text>

  <!-- 3.3V Ground Rail & Symbol -->
  <line x1="45" y1="420" x2="370" y2="420" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="102" y1="420" x2="102" y2="428" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="94" y1="428" x2="110" y2="428" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="97" y1="432" x2="107" y2="432" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="100" y1="436" x2="104" y2="436" stroke="#1a1a1a" stroke-width="1"/>
  <text x="120" y="442" text-anchor="start" font-size="12" font-weight="700" fill="#6b7280">GND (3.3В)</text>

  <!-- 5.0V Ground Rail & Symbol -->
  <line x1="450" y1="420" x2="915" y2="420" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="600" y1="420" x2="600" y2="428" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="592" y1="428" x2="608" y2="428" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="595" y1="432" x2="605" y2="432" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="598" y1="436" x2="602" y2="436" stroke="#1a1a1a" stroke-width="1"/>
  <text x="615" y="442" text-anchor="start" font-size="12" font-weight="700" fill="#6b7280">GND_RELAY (5В)</text>

  <!-- Galvanic Isolation Line -->
  <line x1="410" y1="115" x2="410" y2="435" stroke="#6b7280" stroke-dasharray="6,4" stroke-width="1.5"/>
  <text x="410" y="448" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280">Гальванічна ізоляція</text>

  <!-- 5. Panel 1 Components & Wiring -->
  <!-- ESP8266 MCU Box -->
  <rect x="45" y="160" width="115" height="110" rx="6" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="102" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">ESP8266EX</text>
  <text x="102" y="202" text-anchor="middle" font-size="12" fill="#6b7280">Мікроконтролер</text>

  <!-- ESP8266 VCC Wire (102, 160) -> (102, 130) -->
  <line x1="102" y1="160" x2="102" y2="130" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="102" cy="130" r="3" fill="#2457d6"/>

  <!-- ESP8266 GND Wire (102, 270) -> (102, 420) -->
  <line x1="102" y1="270" x2="102" y2="420" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="102" cy="420" r="3" fill="#1a1a1a"/>

  <!-- ESP8266 GPIO5 Pin & Text -->
  <line x1="140" y1="240" x2="160" y2="240" stroke="#2457d6" stroke-width="2"/>
  <text x="155" y="235" text-anchor="end" font-size="12" font-weight="700" fill="#2457d6">GPIO5</text>

  <!-- Pull-up Resistor R1 -->
  <line x1="200" y1="130" x2="200" y2="165" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="200" cy="130" r="3" fill="#1a1a1a"/>
  <rect x="191" y="165" width="18" height="40" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="200" y1="205" x2="200" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="200" cy="240" r="3" fill="#1a1a1a"/>
  <text x="215" y="180" text-anchor="start" font-size="12" font-weight="700" fill="#1a1a1a">R₁ = 10 кОм</text>
  <text x="215" y="196" text-anchor="start" font-size="12" fill="#6b7280">(підтяжка)</text>

  <!-- GPIO Output Signal Wire: (160, 240) -> (345, 240) -->
  <line x1="160" y1="240" x2="345" y2="240" stroke="#2457d6" stroke-width="2"/>
  <text x="215" y="232" text-anchor="start" font-size="12" font-weight="700" fill="#2457d6">Сигнал</text>

  <!-- AT Command Callout Box -->
  <rect x="45" y="300" width="230" height="95" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="160" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">AT+SYSGPIOWR=5,0</text>
  <text x="160" y="342" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">LOW (0 В) → Реле УВІМК</text>
  <text x="160" y="360" text-anchor="middle" font-size="12" fill="#c0392b">HIGH (3.3 В) → Реле ВИМК</text>
  <text x="160" y="378" text-anchor="middle" font-size="12" fill="#6b7280">Стан при BOOT: ВИМК</text>

  <!-- 6. Panel 2 Components & Wiring -->
  <!-- Optocoupler U1 Box -->
  <rect x="345" y="195" width="130" height="110" rx="6" fill="white" stroke="#2457d6" stroke-dasharray="4,3" stroke-width="1.5"/>
  <text x="410" y="186" text-anchor="middle" font-size="13" font-weight="700" fill="#2457d6">Оптопара U₁ (PC817)</text>

  <!-- R2 Resistor & Optocoupler Anode Wire -->
  <line x1="365" y1="130" x2="365" y2="145" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="365" cy="130" r="3" fill="#1a1a1a"/>
  <rect x="356" y="145" width="18" height="40" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="365" y1="185" x2="365" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="365" y1="220" x2="370" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="380" y="160" text-anchor="start" font-size="12" font-weight="700" fill="#1a1a1a">R₂ = 1 кОм</text>
  <text x="380" y="176" text-anchor="start" font-size="12" fill="#6b7280">(струм LED)</text>

  <!-- Optocoupler Internal LED -->
  <polygon points="360,225 380,225 370,245" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="360" y1="245" x2="380" y2="245" stroke="#2457d6" stroke-width="2"/>
  <line x1="370" y1="245" x2="370" y2="270" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="370" y1="270" x2="345" y2="270" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Optocoupler Cathode Wire to GPIO5 Line -->
  <line x1="345" y1="240" x2="345" y2="270" stroke="#2457d6" stroke-width="2"/>

  <!-- Light emission arrows inside Optocoupler -->
  <line x1="378" y1="232" x2="392" y2="240" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="378" y1="242" x2="392" y2="250" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Control Current Flow Indicator -->
  <text x="330" y="258" text-anchor="end" font-size="12" font-weight="700" fill="#2457d6">I_ctrl</text>

  <!-- Optocoupler Phototransistor -->
  <line x1="435" y1="225" x2="435" y2="255" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="465" y1="215" x2="450" y2="215" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="450" y1="215" x2="435" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="465" y1="265" x2="450" y2="265" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="450" y1="265" x2="435" y2="250" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="435,250 443,255 444,246" fill="#1a1a1a"/>

  <!-- Phototransistor Collector Wire to 5V Rail -->
  <line x1="465" y1="215" x2="465" y2="130" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="465" cy="130" r="3" fill="#27ae60"/>

  <!-- Phototransistor Emitter Wire to R3 and R4 -->
  <line x1="465" y1="265" x2="465" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="465" cy="320" r="3" fill="#1a1a1a"/>

  <!-- Base Resistor R3 -->
  <line x1="465" y1="320" x2="475" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="475" y="311" width="40" height="18" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="515" y1="320" x2="540" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="495" y="303" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">R₃ = 1 кОм</text>

  <!-- Pull-down Resistor R4 -->
  <line x1="465" y1="320" x2="465" y2="345" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="456" y="345" width="18" height="40" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="465" y1="385" x2="465" y2="420" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="465" cy="420" r="3" fill="#1a1a1a"/>
  <text x="445" y="360" text-anchor="end" font-size="12" font-weight="700" fill="#1a1a1a">R₄ = 10 кОм</text>
  <text x="445" y="376" text-anchor="end" font-size="12" fill="#6b7280">(витік)</text>

  <!-- NPN Transistor VT1 -->
  <circle cx="560" cy="320" r="20" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="550" y1="308" x2="550" y2="332" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="540" y1="320" x2="550" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="550" y1="314" x2="565" y2="300" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="565" y1="300" x2="565" y2="280" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="550" y1="326" x2="565" y2="340" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="565,340 556,336 560,330" fill="#1a1a1a"/>
  <line x1="565" y1="340" x2="565" y2="420" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="565" cy="420" r="3" fill="#1a1a1a"/>

  <text x="585" y="316" text-anchor="start" font-size="12" font-weight="700" fill="#1a1a1a">VT₁ NPN</text>
  <text x="585" y="332" text-anchor="start" font-size="12" fill="#6b7280">(2N2222)</text>

  <!-- 7. Panel 3 Components & Wiring -->
  <!-- Relay Coil K1 -->
  <text x="692" y="215" text-anchor="end" font-size="12" font-weight="700" fill="#1a1a1a">K₁</text>
  <text x="692" y="231" text-anchor="end" font-size="12" fill="#6b7280">(5 В)</text>
  <rect x="700" y="190" width="40" height="60" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="700" y1="190" x2="740" y2="250" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Coil Wiring: 5V Rail -> Coil -> VT1 Collector -->
  <line x1="720" y1="130" x2="720" y2="190" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="720" cy="130" r="3" fill="#27ae60"/>

  <line x1="720" y1="250" x2="720" y2="280" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="720" y1="280" x2="565" y2="280" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Flyback Protection Diode VD1 -->
  <line x1="720" y1="160" x2="770" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="720" cy="160" r="3" fill="#1a1a1a"/>
  <line x1="770" y1="160" x2="770" y2="205" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="770,205 760,225 780,225" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="760" y1="205" x2="780" y2="205" stroke="#c0392b" stroke-width="2"/>
  <line x1="770" y1="225" x2="770" y2="280" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="720" cy="280" r="3" fill="#1a1a1a"/>

  <!-- Diode Callout Box -->
  <rect x="795" y="192" width="125" height="56" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="857" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">VD₁ (1N4007)</text>
  <text x="857" y="226" text-anchor="middle" font-size="12" fill="#c0392b">Захисний діод</text>
  <text x="857" y="241" text-anchor="middle" font-size="12" fill="#6b7280">Гасить ЕРС</text>

  <!-- Mechanical Linkage -->
  <line x1="740" y1="220" x2="740" y2="335" stroke="#6b7280" stroke-dasharray="3,3" stroke-width="1.5"/>

  <!-- Relay Contacts -->
  <text x="710" y="344" text-anchor="end" font-size="12" font-weight="700" fill="#1a1a1a">COM</text>
  <circle cx="720" cy="340" r="4" fill="#1a1a1a"/>

  <line x1="720" y1="340" x2="765" y2="328" stroke="#1a1a1a" stroke-width="2"/>

  <circle cx="770" cy="325" r="4" fill="#1a1a1a"/>
  <text x="780" y="322" text-anchor="start" font-size="12" font-weight="700" fill="#27ae60">NO</text>

  <circle cx="770" cy="355" r="4" fill="#1a1a1a"/>
  <text x="780" y="360" text-anchor="start" font-size="12" font-weight="700" fill="#6b7280">NC</text>

  <!-- Load Block & AC Power -->
  <line x1="770" y1="325" x2="805" y2="325" stroke="#27ae60" stroke-width="2"/>

  <line x1="720" y1="340" x2="720" y2="395" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="720" y1="395" x2="862" y2="395" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="862" y1="395" x2="862" y2="370" stroke="#1a1a1a" stroke-width="1.5"/>

  <rect x="805" y="315" width="115" height="55" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="862" y="335" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">Навантаження</text>
  <text x="862" y="352" text-anchor="middle" font-size="12" fill="#1a1a1a">~230 В AC</text>
  <text x="862" y="366" text-anchor="middle" font-size="12" fill="#6b7280">(до 10 А)</text>

  <text x="862" y="412" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280">Мережа ~220-230 В</text>

</svg>
