<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Діаграма станів FSM хост-драйвера AT-команд GPIO ESP8266</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Неблокуюча передача команд, парсинг відповідей OK/ERROR, таймаути та асинхронна обробка URC</text>

  <!-- Node 4: URC Handling (Top) -->
  <rect x="270" y="80" width="440" height="75" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="8"/>
  <text x="490" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">STATE_URC_PROCESS</text>
  <text x="490" y="133" text-anchor="middle" font-size="11" fill="#6b7280">Парсинг +GPIOINDB: &lt;pin&gt;,&lt;val&gt; (Подія від датчика/кнопки)</text>

  <!-- Node 1: STATE_IDLE (Middle Left) -->
  <rect x="40" y="220" width="170" height="80" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="8"/>
  <text x="125" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">STATE_IDLE</text>
  <text x="125" y="275" text-anchor="middle" font-size="11" fill="#6b7280">Очікування задачі / URC</text>

  <!-- Node 2: STATE_SEND_CMD (Middle Center) -->
  <rect x="270" y="220" width="190" height="80" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="8"/>
  <text x="365" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">STATE_SEND_CMD</text>
  <text x="365" y="275" text-anchor="middle" font-size="11" fill="#6b7280">AT+SYSGPIODIR / WR / RD</text>

  <!-- Node 3: STATE_WAIT_RESP (Middle Right) -->
  <rect x="520" y="220" width="190" height="80" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="8"/>
  <text x="615" y="250" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">STATE_WAIT_RESP</text>
  <text x="615" y="275" text-anchor="middle" font-size="11" fill="#6b7280">Парсинг OK / ERROR</text>

  <!-- Node 6: STATE_SUCCESS (Bottom Center) -->
  <rect x="270" y="380" width="190" height="80" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="8"/>
  <text x="365" y="410" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">STATE_SUCCESS</text>
  <text x="365" y="435" text-anchor="middle" font-size="11" fill="#6b7280">Оновлення стану / Даних</text>

  <!-- Node 5: STATE_ERROR (Bottom Right) -->
  <rect x="520" y="380" width="190" height="80" fill="#fdecea" stroke="#c0392b" stroke-width="2" rx="8"/>
  <text x="615" y="410" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">STATE_ERROR</text>
  <text x="615" y="435" text-anchor="middle" font-size="11" fill="#c0392b">Таймаут (t &gt; 100мс) / ERROR</text>

  <!-- Transition 1: IDLE -> SEND_CMD -->
  <line x1="210" y1="260" x2="265" y2="260" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="238" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Нова задача</text>

  <!-- Transition 2: SEND_CMD -> WAIT_RESP -->
  <line x1="460" y1="260" x2="515" y2="260" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-black)"/>
  <text x="487" y="248" text-anchor="middle" font-size="11" fill="#6b7280">Команда в UART</text>

  <!-- Transition 3: WAIT_RESP -> SUCCESS -->
  <path d="M 550 300 L 550 340 L 440 340 L 440 375" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="495" y="330" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Отримано 'OK'</text>

  <!-- Transition 4: WAIT_RESP -> ERROR -->
  <line x1="670" y1="300" x2="670" y2="375" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="660" y="342" text-anchor="end" font-size="11" font-weight="bold" fill="#c0392b">Таймаут / ERROR</text>

  <!-- Transition 5: SUCCESS -> IDLE -->
  <path d="M 270 420 L 125 420 L 125 305" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arr-black)"/>
  <text x="197" y="410" text-anchor="middle" font-size="11" fill="#6b7280">Готово → IDLE</text>

  <!-- Transition 6: ERROR -> IDLE -->
  <path d="M 615 460 L 615 510 L 80 510 L 80 305" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="347" y="500" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Скидання в IDLE після помилки</text>

  <!-- Transition 7: IDLE -> URC_PROCESS -->
  <path d="M 125 220 L 125 117 L 265 117" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="135" y="170" text-anchor="start" font-size="11" font-weight="bold" fill="#27ae60">Вхідне сповіщення +GPIOINDB</text>

  <!-- Transition 8: URC_PROCESS -> IDLE -->
  <path d="M 710 117 L 770 117 L 770 185 L 170 185 L 170 215" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arr-black)"/>
  <text x="470" y="175" text-anchor="middle" font-size="11" fill="#6b7280">URC оброблено</text>
</svg>
