<svg viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема обміну AT-командами для керування GPIO на ESP8266</text>
  <text x="480" y="55" text-anchor="middle" font-size="13" fill="#6b7280">Послідовність конфігурації напрямку, запису логічного рівня та читання стану через UART</text>

  <!-- Left Box: Host MCU -->
  <rect x="40" y="80" width="220" height="450" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <rect x="55" y="95" width="190" height="45" rx="6" fill="#ffffff" stroke="#2457d6"/>
  <text x="150" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Хост-контролер</text>
  <text x="150" y="132" text-anchor="middle" font-size="12" fill="#6b7280">(MCU / PC / ПК)</text>

  <rect x="55" y="160" width="190" height="95" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="150" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">1. Налаштування</text>
  <text x="150" y="202" text-anchor="middle" font-size="12" fill="#1a1a1a">Конфігурація напрямку</text>
  <text x="150" y="222" text-anchor="middle" font-size="12" fill="#6b7280">GPIO12 як вихід (OUTPUT)</text>

  <rect x="55" y="275" width="190" height="95" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="150" y="295" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">2. Запис рівня</text>
  <text x="150" y="317" text-anchor="middle" font-size="12" fill="#1a1a1a">Встановлення стану</text>
  <text x="150" y="337" text-anchor="middle" font-size="12" fill="#6b7280">GPIO12 = 1 (HIGH, 3.3V)</text>

  <rect x="55" y="390" width="190" height="120" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="150" y="410" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">3. Читання станів</text>
  <text x="150" y="432" text-anchor="middle" font-size="12" fill="#1a1a1a">Запит стану входу</text>
  <text x="150" y="452" text-anchor="middle" font-size="12" fill="#6b7280">Отримання підтвердження</text>
  <text x="150" y="472" text-anchor="middle" font-size="12" fill="#27ae60">Статус: OK (+SYSGPIOREAD)</text>

  <!-- Center Sequence Flow -->
  <!-- Transaction 1 -->
  <line x1="260" y1="185" x2="690" y2="185" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="360" y="163" width="230" height="20" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="475" y="177" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">AT+SYSGPIODIR=12,1</text>

  <line x1="690" y1="225" x2="260" y2="225" stroke="#27ae60" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr-green)"/>
  <rect x="420" y="210" width="110" height="20" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="475" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">OK</text>

  <!-- Transaction 2 -->
  <line x1="260" y1="300" x2="690" y2="300" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="350" y="278" width="250" height="20" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="475" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">AT+SYSGPIOWRITE=12,1</text>

  <line x1="690" y1="340" x2="260" y2="340" stroke="#27ae60" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr-green)"/>
  <rect x="420" y="325" width="110" height="20" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="475" y="339" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">OK</text>

  <!-- Transaction 3 -->
  <line x1="260" y1="415" x2="690" y2="415" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="365" y="393" width="220" height="20" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="475" y="407" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">AT+SYSGPIOREAD=12</text>

  <line x1="690" y1="465" x2="260" y2="465" stroke="#27ae60" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr-green)"/>
  <rect x="330" y="445" width="290" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="475" y="461" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">+SYSGPIOREAD:12,1  OK</text>

  <!-- Right Box: ESP8266 SoC -->
  <rect x="700" y="80" width="220" height="450" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <rect x="715" y="95" width="190" height="45" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="810" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">ESP8266 SoC</text>
  <text x="810" y="132" text-anchor="middle" font-size="12" fill="#6b7280">(AT-прошивка + GPIO)</text>

  <rect x="715" y="160" width="190" height="95" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="810" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Парсер AT-команд</text>
  <text x="810" y="202" text-anchor="middle" font-size="12" fill="#1a1a1a">Декодування синтаксису</text>
  <text x="810" y="222" text-anchor="middle" font-size="12" fill="#6b7280">Регістр: PIN_DIR = 1</text>

  <rect x="715" y="275" width="190" height="95" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="810" y="295" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Вивід GPIO 12</text>
  <text x="810" y="317" text-anchor="middle" font-size="12" fill="#1a1a1a">Фізичний вихід: HIGH</text>
  <text x="810" y="337" text-anchor="middle" font-size="12" fill="#27ae60">Напруга: 3.3 В (LED ON)</text>

  <rect x="715" y="390" width="190" height="120" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="810" y="410" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Апаратний статус</text>
  <text x="810" y="432" text-anchor="middle" font-size="12" fill="#1a1a1a">Зчитування регістра</text>
  <text x="810" y="452" text-anchor="middle" font-size="12" fill="#6b7280">Формування відповіді</text>
  <text x="810" y="472" text-anchor="middle" font-size="12" fill="#2457d6">Передача OK у UART</text>
</svg>
