<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Titles -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Асинхронний FSM хост-контролера та сопряження з ESP8266</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Розділення станів парсингу UART-відповідей та гальванічна розв'язка силового навантаження</text>

  <!-- Panel 1: Host Controller FSM -->
  <rect x="25" y="70" width="435" height="390" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="40" y="94" font-size="15" font-weight="bold" fill="#2457d6">Асинхронний FSM Хост-мікроконтролера</text>

  <!-- State 1: IDLE / SEND_CMD -->
  <rect x="45" y="120" width="180" height="60" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="135" y="143" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. IDLE / SEND_CMD</text>
  <text x="135" y="163" font-size="12" fill="#2457d6" text-anchor="middle">Надсилання AT-команди</text>

  <!-- Arrow State 1 -> 2 -->
  <path d="M 135 180 L 135 215" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="145" y="202" font-size="12" fill="#6b7280">TX UART</text>

  <!-- State 2: WAIT_UART_RX -->
  <rect x="45" y="215" width="180" height="65" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="135" y="240" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. WAIT_UART_RX</text>
  <text x="135" y="260" font-size="12" fill="#6b7280" text-anchor="middle">Очікування буфера / таймаут</text>

  <!-- Arrow State 2 -> 3a (OK) -->
  <path d="M 225 248 L 292.5 248 L 292.5 320" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="302" y="278" font-size="12" font-weight="bold" fill="#27ae60">Парсинг "OK"</text>

  <!-- Arrow State 2 -> 3b (ERROR/Timeout) -->
  <path d="M 70 280 L 70 360" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <text x="78" y="320" font-size="12" font-weight="bold" fill="#c0392b">ERROR / Таймаут</text>

  <!-- State 3a: PARSE_OK -->
  <rect x="210" y="320" width="165" height="60" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="292.5" y="343" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3a. PARSE_OK</text>
  <text x="292.5" y="363" font-size="12" fill="#27ae60" text-anchor="middle">Оновлення стану FSM</text>

  <!-- State 3b: RETRY / ERR -->
  <rect x="45" y="360" width="140" height="55" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="115" y="381" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">3b. RETRY / ERR</text>
  <text x="115" y="398" font-size="12" fill="#6b7280" text-anchor="middle">Обробка помилки</text>

  <!-- Loopback State 3a -> 1 -->
  <path d="M 375 350 L 388 350 L 388 150 L 225 150" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr-green)"/>
  <text x="375" y="245" font-size="12" fill="#27ae60" text-anchor="end">Наступний стан</text>

  <!-- Host UART Sub-box -->
  <rect x="250" y="115" width="190" height="85" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="345" y="135" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">UART периферія</text>
  <text x="260" y="158" font-size="12" font-weight="bold" fill="#2457d6">TXD (Host)</text>
  <text x="260" y="182" font-size="12" font-weight="bold" fill="#27ae60">RXD (Host)</text>

  <!-- Internal lines State 1 <-> Host UART -->
  <path d="M 225 150 L 250 150" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M 250 180 L 235 180 L 235 230 L 225 230" fill="none" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Panel 2: ESP8266 Module -->
  <rect x="495" y="70" width="440" height="150" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="510" y="94" font-size="15" font-weight="bold" fill="#2457d6">Модуль ESP8266 (AT-прошивка)</text>

  <!-- AT Parser Box -->
  <rect x="515" y="115" width="170" height="85" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="600" y="135" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">AT-інтерпретатор</text>
  <text x="600" y="155" font-size="12" fill="#6b7280" text-anchor="middle">Парсинг AT+GPIOWRITE</text>
  <text x="600" y="175" font-size="12" fill="#2457d6" text-anchor="middle">Формування OK/ERROR</text>

  <!-- UART Lines Host <-> ESP8266 -->
  <path d="M 440 150 L 515 150" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="477.5" y="140" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">AT-команда</text>

  <path d="M 515 180 L 440 180" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="477.5" y="196" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">OK / ERROR</text>

  <!-- GPIO Controller Box -->
  <rect x="715" y="115" width="205" height="85" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="817.5" y="135" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Контролер GPIO</text>
  <text x="817.5" y="155" font-size="12" fill="#2457d6" text-anchor="middle">Вивід GPIO4 / GPIO5</text>
  <text x="817.5" y="175" font-size="12" fill="#6b7280" text-anchor="middle">Логічний рівень (0/3.3V)</text>

  <!-- Line AT Parser -> GPIO Controller -->
  <path d="M 685 157.5 L 715 157.5" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Panel 3: Optocoupler Isolation & Power Switch -->
  <rect x="495" y="235" width="440" height="225" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="510" y="258" font-size="15" font-weight="bold" fill="#27ae60">Схема ключа та гальванічної розв'язки</text>

  <!-- Signal Line from ESP8266 GPIO to Optocoupler -->
  <path d="M 817.5 200 L 817.5 275 L 525 275 L 525 305" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="670" y="267" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Сигнал GPIO (3.3V)</text>

  <!-- Optocoupler Box (PC817) -->
  <rect x="515" y="305" width="165" height="140" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="597.5" y="325" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Оптопара (PC817)</text>

  <rect x="525" y="340" width="60" height="50" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="555" y="361" font-size="12" fill="#2457d6" text-anchor="middle">Світло-</text>
  <text x="555" y="377" font-size="12" fill="#2457d6" text-anchor="middle">діод</text>

  <rect x="610" y="340" width="60" height="50" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="640" y="361" font-size="12" fill="#27ae60" text-anchor="middle">Фото-</text>
  <text x="640" y="377" font-size="12" fill="#27ae60" text-anchor="middle">транз.</text>

  <path d="M 585 365 L 610 365" stroke="#27ae60" stroke-width="2" stroke-dasharray="2,2"/>
  <text x="597.5" y="425" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Гальванічна розв'язка</text>

  <!-- Power Switch & Load Box -->
  <rect x="710" y="305" width="210" height="140" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="815" y="325" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Силовий ключ та навантаження</text>

  <rect x="720" y="340" width="85" height="50" rx="4" fill="#f4f6f8" stroke="#1a1a1a"/>
  <text x="762.5" y="360" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Транзистор</text>
  <text x="762.5" y="378" font-size="12" fill="#6b7280" text-anchor="middle">NPN/MOSFET</text>

  <rect x="825" y="340" width="85" height="50" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="867.5" y="360" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Навантаження</text>
  <text x="867.5" y="378" font-size="12" fill="#c0392b" text-anchor="middle">+ Діод 1N4007</text>

  <path d="M 680 365 L 710 365" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <path d="M 805 365 L 825 365" stroke="#1a1a1a" stroke-width="2"/>

  <text x="815" y="425" font-size="12" fill="#6b7280" text-anchor="middle">Окреме живлення V_LOAD (12V/24V)</text>
</svg>
