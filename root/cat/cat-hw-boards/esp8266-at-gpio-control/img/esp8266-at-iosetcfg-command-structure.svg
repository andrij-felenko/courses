<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Definitions for Markers -->
  <defs>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Структура та синтаксис AT-команди AT+IOSETCFG</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Порядок упаковки параметрів номера виводу, режиму роботи та підтягувальних резисторів</text>

  <!-- Main Command Container Panel -->
  <rect x="60" y="92" width="840" height="84" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Token 1: Command Prefix -->
  <rect x="85" y="111" width="175" height="46" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="172" y="140" text-anchor="middle" font-size="16" font-weight="bold" fill="#2457d6">AT+IOSETCFG=</text>

  <!-- Token 2: Parameter <pin> -->
  <rect x="275" y="111" width="130" height="46" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="340" y="140" text-anchor="middle" font-size="16" font-weight="bold" fill="#27ae60">&lt;pin&gt;</text>

  <!-- Separator 1 -->
  <text x="412" y="140" text-anchor="middle" font-size="18" font-weight="bold" fill="#6b7280">,</text>

  <!-- Token 3: Parameter <mode> -->
  <rect x="425" y="111" width="140" height="46" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="495" y="140" text-anchor="middle" font-size="16" font-weight="bold" fill="#2457d6">&lt;mode&gt;</text>

  <!-- Separator 2 -->
  <text x="572" y="140" text-anchor="middle" font-size="18" font-weight="bold" fill="#6b7280">,</text>

  <!-- Token 4: Parameter <pull> -->
  <rect x="585" y="111" width="140" height="46" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="655" y="140" text-anchor="middle" font-size="16" font-weight="bold" fill="#d97706">&lt;pull&gt;</text>

  <!-- Token 5: CRLF Terminator -->
  <rect x="740" y="111" width="135" height="46" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="807" y="140" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b7280">\r\n (CRLF)</text>

  <!-- Connecting Arrows from Tokens to Cards -->
  <path d="M 340 157 L 340 182 L 192 182 L 192 208" fill="none" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <path d="M 495 157 L 495 208" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M 655 157 L 655 182 L 767 182 L 767 208" fill="none" stroke="#d97706" stroke-width="1.5" marker-end="url(#arr-amber)"/>

  <!-- Card 1: <pin> Parameter Details -->
  <rect x="60" y="210" width="265" height="220" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <path d="M 60 218 A 8 8 0 0 1 68 210 L 317 210 A 8 8 0 0 1 325 218 L 325 244 L 60 244 Z" fill="#e9f7ef"/>
  <text x="192" y="233" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Параметр &lt;pin&gt; (Номер GPIO)</text>
  <text x="75" y="268" font-size="13" fill="#1a1a1a">• Номер виводу GPIO (0..15)</text>
  <text x="75" y="292" font-size="12" fill="#6b7280">• Приклади: 0, 2, 4, 5, 12..15</text>
  <text x="75" y="322" font-size="12" font-weight="bold" fill="#c0392b">• Службові піни завантаження:</text>
  <text x="87" y="344" font-size="12" fill="#c0392b">  GPIO0, GPIO2, GPIO15</text>
  <text x="87" y="366" font-size="12" fill="#c0392b">  (невірний рівень змінює</text>
  <text x="87" y="388" font-size="12" fill="#c0392b">   режим старту ESP8266)</text>

  <!-- Card 2: <mode> Parameter Details -->
  <rect x="347" y="210" width="266" height="220" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M 347 218 A 8 8 0 0 1 355 210 L 605 210 A 8 8 0 0 1 613 210 L 613 244 L 347 244 Z" fill="#eaf0fd"/>
  <text x="480" y="233" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Параметр &lt;mode&gt; (Режим роботи)</text>
  <text x="362" y="268" font-size="13" fill="#1a1a1a">0 : Вхід без інверсії (Input)</text>
  <text x="362" y="292" font-size="13" fill="#1a1a1a">1 : Вихід Push-Pull (Output)</text>
  <text x="362" y="316" font-size="13" fill="#1a1a1a">2 : ШІМ вихід (PWM Output)</text>
  <text x="362" y="340" font-size="13" fill="#1a1a1a">3 : Відкритий колектор (Open-Drain)</text>
  <text x="362" y="372" font-size="12" fill="#6b7280">• Налаштовує регістри IOMUX</text>
  <text x="362" y="394" font-size="12" fill="#6b7280">  та драйвери вихідного каскаду</text>

  <!-- Card 3: <pull> Parameter Details -->
  <rect x="635" y="210" width="265" height="220" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="1.5"/>
  <path d="M 635 218 A 8 8 0 0 1 643 210 L 892 210 A 8 8 0 0 1 900 218 L 900 244 L 635 244 Z" fill="#fef3c7"/>
  <text x="767" y="233" text-anchor="middle" font-size="14" font-weight="bold" fill="#d97706">Параметр &lt;pull&gt; (Підтяжка)</text>
  <text x="650" y="268" font-size="13" fill="#1a1a1a">0 : Підтяжка вимкнена (Float)</text>
  <text x="650" y="292" font-size="13" fill="#1a1a1a">1 : Підтяжка до VCC (Pull-Up)</text>
  <text x="650" y="316" font-size="13" fill="#1a1a1a">2 : Підтяжка до GND (Pull-Down)</text>
  <text x="650" y="350" font-size="12" fill="#6b7280">• Внутрішній опір: 30–50 кОм</text>
  <text x="650" y="374" font-size="12" fill="#6b7280">• Запобігає плаванню рівня</text>
  <text x="650" y="398" font-size="12" fill="#6b7280">  непідключеного входу</text>
</svg>
