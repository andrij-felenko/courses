<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Алгоритм роботи текстового парсера AT-команд ESP8266 для GPIO</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Етапи асинхронного розбору ASCII-фреймів, перевірки параметрів та виклику HAL</text>

  <!-- Left Panel: Context & Specifications -->
  <rect x="30" y="82" width="250" height="455" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="155" y="107" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Контекст обробки GPIO</text>

  <!-- Card 1: Commands -->
  <rect x="45" y="125" width="220" height="105" rx="5" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="55" y="145" font-size="12" font-weight="bold" fill="#2457d6">Формат AT-команд GPIO:</text>
  <text x="55" y="167" font-size="11" fill="#1a1a1a">• AT+SYSGPIODIR=&lt;p&gt;,&lt;d&gt;</text>
  <text x="55" y="187" font-size="11" fill="#1a1a1a">• AT+SYSGPIOWRITE=&lt;p&gt;,&lt;v&gt;</text>
  <text x="55" y="207" font-size="11" fill="#1a1a1a">• AT+SYSGPIOREAD=&lt;p&gt;</text>

  <!-- Card 2: Hardware Constraints -->
  <rect x="45" y="245" width="220" height="120" rx="5" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="55" y="265" font-size="12" font-weight="bold" fill="#c0392b">Апаратні обмеження:</text>
  <text x="55" y="287" font-size="11" fill="#1a1a1a">• GPIO6..11: Заблоковано</text>
  <text x="67" y="303" font-size="11" fill="#6b7280">(підключено SPI Flash)</text>
  <text x="55" y="325" font-size="11" fill="#1a1a1a">• GPIO0,2,15: Захист станів</text>
  <text x="67" y="341" font-size="11" fill="#6b7280">(boot strapping pins)</text>

  <!-- Card 3: Timing -->
  <rect x="45" y="380" width="220" height="142" rx="5" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="55" y="400" font-size="12" font-weight="bold" fill="#1a1a1a">Швидкодія та затримки:</text>
  <text x="55" y="422" font-size="11" fill="#6b7280">• AT-парсер: 1..5 мс</text>
  <text x="55" y="442" font-size="11" fill="#6b7280">• UART (115200): ~1 мс/фрейм</text>
  <text x="55" y="464" font-size="11" font-weight="bold" fill="#27ae60">• Прямий MMIO: &lt; 100 нс</text>
  <text x="67" y="480" font-size="11" fill="#6b7280">(запис в GPIO_OUT_W1TS)</text>
  <text x="55" y="502" font-size="11" fill="#1a1a1a">• Інтерпретатор: завадостійкий</text>

  <!-- Center Main Flow Nodes -->
  <!-- Node 1 -->
  <rect x="330" y="82" width="320" height="55" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="490" y="104" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Накопичення кадру в UART Rx FIFO</text>
  <text x="490" y="124" font-size="12" fill="#6b7280" text-anchor="middle">Отримання байт байтом у кільцевий буфер</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="490" y1="137" x2="490" y2="158" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Node 2 -->
  <rect x="330" y="160" width="320" height="55" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="490" y="182" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Перевірка термінатора кадру (\r\n / CRLF)</text>
  <text x="490" y="202" font-size="12" fill="#6b7280" text-anchor="middle">Виділення повного текстового рядка для обробки</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="490" y1="215" x2="490" y2="236" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Node 3 -->
  <rect x="330" y="238" width="320" height="55" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="490" y="260" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3. Синтаксичний розбір префікса AT+</text>
  <text x="490" y="280" font-size="12" fill="#6b7280" text-anchor="middle">Пошук підстроки SYSGPIO / IO в таблиці команд</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="490" y1="293" x2="490" y2="314" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="498" y="308" font-size="10" font-weight="bold" fill="#27ae60">Так (Знайдено)</text>

  <!-- Node 4 -->
  <rect x="320" y="316" width="340" height="65" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="490" y="338" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">4. Валідація аргументів та маски безпеки</text>
  <text x="490" y="356" font-size="12" fill="#1a1a1a" text-anchor="middle">Перевірка PIN (0..15), типів та заборона</text>
  <text x="490" y="372" font-size="12" fill="#6b7280" text-anchor="middle">доступів до системної SPI Flash (GPIO6..11)</text>

  <!-- Arrow 4 -> 5 -->
  <line x1="490" y1="381" x2="490" y2="402" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="498" y="396" font-size="10" font-weight="bold" fill="#27ae60">Валідація OK</text>

  <!-- Node 5 -->
  <rect x="330" y="404" width="320" height="55" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="490" y="426" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">5. Запис у регістри MMIO GPIO</text>
  <text x="490" y="446" font-size="12" fill="#1a1a1a" text-anchor="middle">Запис у GPIO_OUT_W1TS / GPIO_ENABLE_W1TS</text>

  <!-- Arrow 5 -> 6 -->
  <line x1="490" y1="459" x2="490" y2="480" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Node 6 -->
  <rect x="340" y="482" width="300" height="48" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="490" y="502" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Відповідь: OK / +SYSGPIOREAD: &lt;val&gt;</text>
  <text x="490" y="520" font-size="11" fill="#27ae60" text-anchor="middle">Формування та відправка відповіді в UART</text>

  <!-- Right Panel: Error Handling -->
  <rect x="700" y="238" width="230" height="230" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="815" y="263" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Обробка помилок (Error Handler)</text>
  <text x="715" y="288" font-size="12" font-weight="bold" fill="#c0392b">Вихідна відповідь:</text>
  <text x="715" y="308" font-size="12" font-weight="bold" fill="#c0392b">  ERROR\r\n</text>

  <line x1="715" y1="322" x2="915" y2="322" stroke="#c0392b" stroke-opacity="0.3" stroke-width="1"/>

  <text x="715" y="342" font-size="12" font-weight="bold" fill="#1a1a1a">Причини відхилення:</text>
  <text x="715" y="362" font-size="11" fill="#1a1a1a">1. Відсутній префікс AT+</text>
  <text x="715" y="382" font-size="11" fill="#1a1a1a">2. Помилка синтаксису =</text>
  <text x="715" y="402" font-size="11" fill="#1a1a1a">3. PIN поза межами 0..15</text>
  <text x="715" y="422" font-size="11" fill="#1a1a1a">4. Спроба зміни GPIO6..11</text>
  <text x="715" y="442" font-size="11" fill="#1a1a1a">5. Некоректний рівень (≠0/1)</text>

  <!-- Arrow Node 3 -> Error Panel -->
  <line x1="650" y1="265" x2="692" y2="265" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="671" y="258" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">Ні</text>

  <!-- Arrow Node 4 -> Error Panel -->
  <line x1="660" y1="348" x2="692" y2="348" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="678" y="341" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">Помилка</text>
</svg>
