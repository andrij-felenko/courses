<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розподіл Flash-пам'яті та процес прошивки DAPLink (STM32F103)</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Комбінування завантажувача (0x08000000) та інтерфейсної прошивки (0x0800C000) при записі</text>

  <!-- ==================== LEFT PANEL: MEMORY MAP ==================== -->
  <rect x="30" y="65" width="310" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="185" y="88" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Карта Flash-пам'яті STM32</text>

  <!-- Sector 3: Shared Config / NVRAM -->
  <rect x="50" y="110" width="270" height="65" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="185" y="133" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Shared Config / NVRAM (4 KB)</text>
  <text x="185" y="153" font-size="12" fill="#6b7280" text-anchor="middle">Адреса: 0x0801 F000 – 0x0802 0000</text>

  <!-- Sector 2: Interface Firmware -->
  <rect x="50" y="190" width="270" height="135" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="185" y="215" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Interface Firmware (76 KB)</text>
  <text x="185" y="235" font-size="12" fill="#6b7280" text-anchor="middle">Адреса: 0x0800 C000 – 0x0801 F000</text>
  <text x="185" y="260" font-size="12" fill="#1a1a1a" text-anchor="middle">CMSIS-DAP v1/v2 + CDC UART</text>
  <text x="185" y="280" font-size="12" fill="#1a1a1a" text-anchor="middle">+ USB Mass Storage (MSD)</text>
  <text x="185" y="305" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Основна робоча прошивка</text>

  <!-- Sector 1: DAPLink Bootloader -->
  <rect x="50" y="340" width="270" height="80" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="185" y="365" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">DAPLink Bootloader (48 KB)</text>
  <text x="185" y="385" font-size="12" fill="#6b7280" text-anchor="middle">Адреса: 0x0800 0000 – 0x0800 BFFF</text>
  <text x="185" y="405" font-size="12" fill="#2457d6" text-anchor="middle">Режим підготовки / Drag-and-Drop</text>

  <!-- ==================== RIGHT PANEL: BUILD & FLASH FLOW ==================== -->
  <rect x="360" y="65" width="570" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="645" y="88" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Етапи складання та запису прошивки (Build &amp; Flash)</text>

  <!-- Step 1: Compilation -->
  <rect x="385" y="105" width="520" height="70" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="400" y="127" font-size="12" font-weight="bold" fill="#2457d6">Крок 1: Компіляція вихідних сирців Arm (Mbed OS / GCC)</text>
  <text x="400" y="147" font-size="12" fill="#1a1a1a">• Генерація двійкових файлів: bootloader.bin та stm32f103xb_if.bin</text>
  <text x="400" y="163" font-size="12" fill="#6b7280">• Комбінування в єдиний монолітний файл або окремий запис за офсетами</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="645" y1="175" x2="645" y2="189" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Step 2: Initial Bootloader Flash -->
  <rect x="385" y="190" width="520" height="70" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="400" y="212" font-size="12" font-weight="bold" fill="#1a1a1a">Крок 2: Первинний запис Bootloader (0x0800 0000)</text>
  <text x="400" y="232" font-size="12" fill="#1a1a1a">• Використання утиліти stm32flash (UART) або зовнішнього SWD-програматора</text>
  <text x="400" y="248" font-size="12" fill="#6b7280">• Запис завантажувача розблоковує режим оновлення через USB</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="645" y1="260" x2="645" y2="274" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Step 3: Interface Firmware Flash -->
  <rect x="385" y="275" width="520" height="70" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="400" y="297" font-size="12" font-weight="bold" fill="#27ae60">Крок 3: Запис Interface Firmware (0x0800 C000)</text>
  <text x="400" y="317" font-size="12" fill="#1a1a1a">• Спосіб А: Запис через віртуальний диск USB MSD (Drag-and-Drop .bin)</text>
  <text x="400" y="333" font-size="12" fill="#1a1a1a">• Спосіб Б: Прямий запис повного образу (Bootloader + Interface)</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="645" y1="345" x2="645" y2="359" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Step 4: Verification & Execution -->
  <rect x="385" y="360" width="520" height="75" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="400" y="382" font-size="12" font-weight="bold" fill="#27ae60">Крок 4: Запуск та автоматична передача керування</text>
  <text x="400" y="402" font-size="12" fill="#1a1a1a">• Bootloader перевіряє хеш і передає вектор на 0x0800 C000</text>
  <text x="400" y="420" font-size="12" font-weight="bold" fill="#27ae60">✓ Готово: Пристрій ініціалізує CMSIS-DAP + CDC UART + MSD</text>
</svg>
