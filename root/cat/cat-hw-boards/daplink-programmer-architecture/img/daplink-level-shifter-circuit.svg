<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Definitions -->
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема узгодження рівнів напруги (Level Shifter) 3.3V / 5V у DAPLink</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Двонаправлений MOSFET-транзисторний конвертер ліній SWDIO, SWCLK та nRESET із ESD-захистом</text>

  <!-- LEFT PANEL: Schematic Diagram -->
  <rect x="20" y="65" width="450" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="245" y="88" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принципова схема MOSFET Level Shifter (SWDIO)</text>

  <!-- Power Rails -->
  <!-- VCC_MCU Rail (3.3V) Left -->
  <line x1="50" y1="120" x2="235" y2="120" stroke="#c0392b" stroke-width="2"/>
  <text x="115" y="110" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">VCC_MCU (3.3V)</text>

  <!-- VCC_TARGET Rail (1.8V - 5V) Right -->
  <line x1="330" y1="120" x2="435" y2="120" stroke="#27ae60" stroke-width="2"/>
  <text x="382" y="110" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">VCC_TARGET (1.8V - 5V)</text>

  <!-- DAPLink MCU Block (Left) -->
  <rect x="35" y="140" width="75" height="190" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="72.5" y="162" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">DAPLink</text>
  <text x="72.5" y="178" font-size="12" fill="#6b7280" text-anchor="middle">MCU 3.3V</text>
  <line x1="35" y1="205" x2="110" y2="205" stroke="#eaf0fd" stroke-width="1"/>
  <text x="72.5" y="222" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">SWDIO</text>

  <!-- SWDIO Wire from MCU to Q1 Source -->
  <line x1="110" y1="230" x2="225" y2="230" stroke="#2457d6" stroke-width="2"/>
  <circle cx="160" cy="230" r="3" fill="#2457d6"/>

  <!-- Pull-Up Resistor R1 (3.3V Side) -->
  <line x1="160" y1="120" x2="160" y2="145" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="153" y="145" width="14" height="26" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="160" y1="171" x2="160" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="175" y="162" font-size="12" fill="#1a1a1a" text-anchor="start">R1 10k</text>

  <!-- N-Channel MOSFET Q1 (BSS138) -->
  <!-- Gate Connection to VCC_MCU -->
  <line x1="235" y1="120" x2="235" y2="215" stroke="#c0392b" stroke-width="1.5"/>
  <text x="225" y="185" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="end">G (3.3V)</text>

  <!-- MOSFET Body & Terminals -->
  <circle cx="245" cy="230" r="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Gate Bar -->
  <line x1="235" y1="218" x2="235" y2="242" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Channel Segments -->
  <line x1="240" y1="218" x2="240" y2="224" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="240" y1="227" x2="240" y2="233" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="240" y1="236" x2="240" y2="242" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Source/Drain Leads -->
  <line x1="225" y1="230" x2="240" y2="230" stroke="#2457d6" stroke-width="2"/>
  <line x1="240" y1="218" x2="265" y2="218" stroke="#27ae60" stroke-width="2"/>
  <line x1="265" y1="218" x2="265" y2="230" stroke="#27ae60" stroke-width="2"/>
  <!-- Body Diode Representation -->
  <line x1="253" y1="222" x2="253" y2="238" stroke="#6b7280" stroke-width="1"/>
  <polygon points="253,222 249,230 257,230" fill="#6b7280"/>
  <text x="245" y="268" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Q1 BSS138</text>
  <text x="245" y="283" font-size="11" fill="#6b7280" text-anchor="middle">Body Diode</text>

  <!-- SWDIO_TARGET Wire from Q1 Drain to Target Board -->
  <line x1="265" y1="230" x2="395" y2="230" stroke="#27ae60" stroke-width="2"/>
  <circle cx="330" cy="230" r="3" fill="#27ae60"/>
  <circle cx="365" cy="230" r="3" fill="#c0392b"/>

  <!-- Pull-Up Resistor R2 (Target VCC Side) -->
  <line x1="330" y1="120" x2="330" y2="145" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="323" y="145" width="14" height="26" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="330" y1="171" x2="330" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="343" y="162" font-size="12" fill="#1a1a1a" text-anchor="start">R2 10k</text>

  <!-- TVS Protection Diode D1 -->
  <line x1="365" y1="230" x2="365" y2="250" stroke="#c0392b" stroke-width="1.5"/>
  <polygon points="365,260 359,250 371,250" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="357" y1="260" x2="373" y2="260" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="365" y1="260" x2="365" y2="275" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- GND Symbol -->
  <line x1="355" y1="275" x2="375" y2="275" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="360" y1="280" x2="370" y2="280" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="363" y1="285" x2="367" y2="285" stroke="#1a1a1a" stroke-width="1"/>
  <text x="355" y="265" font-size="11" fill="#c0392b" text-anchor="end">D1 TVS (ESD)</text>

  <!-- Target Board Block (Right) -->
  <rect x="395" y="140" width="60" height="190" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
  <text x="425" y="162" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Target</text>
  <text x="425" y="178" font-size="12" fill="#6b7280" text-anchor="middle">MCU</text>
  <line x1="395" y1="205" x2="455" y2="205" stroke="#e9f7ef" stroke-width="1"/>
  <text x="425" y="222" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">SWDIO</text>

  <!-- Bottom Circuit Notes Box inside Left Panel -->
  <rect x="35" y="345" width="420" height="130" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="366" font-size="12" font-weight="bold" fill="#1a1a1a">Фізичні стани сигнальної лінії SWDIO:</text>
  <text x="45" y="388" font-size="11" fill="#1a1a1a">1) HIGH (інактивний): Q1 OFF, R1/R2 підтягують лінію до VCC.</text>
  <text x="45" y="410" font-size="11" fill="#1a1a1a">2) DAPLink = 0V: Vgs = 3.3V &gt; Vth ⇒ Q1 ON, притискає Target до 0V.</text>
  <text x="45" y="432" font-size="11" fill="#1a1a1a">3) Target = 0V: Body diode відкривається ⇒ Vgs зростає ⇒ Q1 ON.</text>
  <text x="45" y="454" font-size="11" font-weight="bold" fill="#2457d6">Захищає 3.3V MCU від прямого впливу напруги 5V цільової плати!</text>

  <!-- RIGHT PANEL: Operating Modes & Signal Matrix -->
  <rect x="490" y="65" width="450" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Sub-panel A: Truth / Operating Modes Table -->
  <text x="715" y="88" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Режими роботи та рівні напруг</text>

  <rect x="505" y="98" width="420" height="155" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Header Row -->
  <rect x="505" y="98" width="420" height="26" fill="#eaf0fd" rx="4"/>
  <line x1="505" y1="124" x2="925" y2="124" stroke="#d0d7de" stroke-width="1"/>
  <text x="547.5" y="115" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Напрямок</text>
  <text x="635" y="115" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">DAPLink (3.3V)</text>
  <text x="720" y="115" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">MOSFET Q1</text>
  <text x="802.5" y="115" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Target (VCC_T)</text>
  <text x="885" y="115" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Стан</text>

  <!-- Column Dividers -->
  <line x1="590" y1="98" x2="590" y2="253" stroke="#d0d7de" stroke-width="1"/>
  <line x1="680" y1="98" x2="680" y2="253" stroke="#d0d7de" stroke-width="1"/>
  <line x1="760" y1="98" x2="760" y2="253" stroke="#d0d7de" stroke-width="1"/>
  <line x1="845" y1="98" x2="845" y2="253" stroke="#d0d7de" stroke-width="1"/>

  <!-- Row Dividers -->
  <line x1="505" y1="156" x2="925" y2="156" stroke="#d0d7de" stroke-width="1"/>
  <line x1="505" y1="188" x2="925" y2="188" stroke="#d0d7de" stroke-width="1"/>
  <line x1="505" y1="220" x2="925" y2="220" stroke="#d0d7de" stroke-width="1"/>

  <!-- Row 1: Standby -->
  <text x="547.5" y="141" font-size="11" fill="#1a1a1a" text-anchor="middle">Standby</text>
  <text x="635" y="141" font-size="11" fill="#1a1a1a" text-anchor="middle">3.3V (HIGH)</text>
  <text x="720" y="141" font-size="11" fill="#6b7280" text-anchor="middle">OFF (0V)</text>
  <text x="802.5" y="141" font-size="11" fill="#1a1a1a" text-anchor="middle">VCC_T (HIGH)</text>
  <text x="885" y="141" font-size="11" fill="#27ae60" text-anchor="middle">Пасивний</text>

  <!-- Row 2: MCU -> Target -->
  <rect x="506" y="157" width="418" height="30" fill="#eaf0fd" opacity="0.5"/>
  <text x="547.5" y="174" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">MCU ➔ Target</text>
  <text x="635" y="174" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">0V (LOW)</text>
  <text x="720" y="174" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">ON (3.3V)</text>
  <text x="802.5" y="174" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">0V (LOW)</text>
  <text x="885" y="174" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Запис 0V</text>

  <!-- Row 3: Target -> MCU -->
  <rect x="506" y="189" width="418" height="30" fill="#e9f7ef" opacity="0.5"/>
  <text x="547.5" y="206" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Target ➔ MCU</text>
  <text x="635" y="206" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">0V (LOW)</text>
  <text x="720" y="206" font-size="11" fill="#27ae60" text-anchor="middle">ON (Diode)</text>
  <text x="802.5" y="206" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">0V (LOW)</text>
  <text x="885" y="206" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Зчитування</text>

  <!-- Row 4: Power Off -->
  <text x="547.5" y="238" font-size="11" fill="#6b7280" text-anchor="middle">Без VCC_T</text>
  <text x="635" y="238" font-size="11" fill="#1a1a1a" text-anchor="middle">3.3V</text>
  <text x="720" y="238" font-size="11" fill="#6b7280" text-anchor="middle">OFF</text>
  <text x="802.5" y="238" font-size="11" fill="#6b7280" text-anchor="middle">0V</text>
  <text x="885" y="238" font-size="11" fill="#6b7280" text-anchor="middle">Захищено</text>

  <!-- Sub-panel B: Interface Signals Table -->
  <text x="715" y="282" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Сигнали зневадження DAPLink та тип узгодження</text>

  <rect x="505" y="292" width="420" height="185" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Signal 1: SWCLK -->
  <text x="515" y="316" font-size="12" font-weight="bold" fill="#2457d6">SWCLK:</text>
  <text x="585" y="316" font-size="11.5" fill="#1a1a1a">Однонаправлений вихід (MCU ➔ Target)</text>
  <text x="585" y="332" font-size="11" fill="#6b7280">Буфер з узгодженням напруги (74LVC1T45)</text>

  <line x1="515" y1="342" x2="915" y2="342" stroke="#eaf0fd" stroke-width="1"/>

  <!-- Signal 2: SWDIO -->
  <text x="515" y="356" font-size="12" font-weight="bold" fill="#27ae60">SWDIO:</text>
  <text x="585" y="356" font-size="11.5" fill="#1a1a1a">Двонаправлена лінія даних (MCU ⇄ Target)</text>
  <text x="585" y="372" font-size="11" fill="#6b7280">Двонаправлений MOSFET Shifter + TVS захист</text>

  <line x1="515" y1="382" x2="915" y2="382" stroke="#eaf0fd" stroke-width="1"/>

  <!-- Signal 3: nRESET -->
  <text x="515" y="396" font-size="12" font-weight="bold" fill="#c0392b">nRESET:</text>
  <text x="585" y="396" font-size="11.5" fill="#1a1a1a">Сигнал скидання з відкритим стоком (Open-Drain)</text>
  <text x="585" y="412" font-size="11" fill="#6b7280">Підтяжка R2 до VCC_TARGET, подвійний пуск</text>

  <line x1="515" y1="422" x2="915" y2="422" stroke="#eaf0fd" stroke-width="1"/>

  <!-- Signal 4: SWO / RX -->
  <text x="515" y="436" font-size="12" font-weight="bold" fill="#1a1a1a">SWO / RX:</text>
  <text x="585" y="436" font-size="11.5" fill="#1a1a1a">Вхід Трасування / Послідовного порту</text>
  <text x="585" y="452" font-size="11" fill="#6b7280">Захисний резистор 100 Ом + Schottky діод</text>

  <!-- BOTTOM SUMMARY PANEL -->
  <rect x="20" y="500" width="920" height="48" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="519" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Принцип MOSFET Level Shifter: Затвором Q1 є VCC_MCU (3.3V). Будь-яка сторона притискає лінію до 0V,</text>
  <text x="480" y="536" font-size="11.5" fill="#1a1a1a" text-anchor="middle">що забезпечує безпечну двонаправлену передачу SWDIO між 3.3V MCU та 1.8V-5.0V цільовою платою.</text>
</svg>
