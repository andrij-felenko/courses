<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="510" fill="white"/>

  <!-- Definitions for Markers -->
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-blue-start" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-green-start" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Двоканальна архітектура підключення DAPLink до Cortex-M MCU</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Паралельна робота CMSIS-DAP (SWD зневадження) та CDC (UART логування) через єдиний USB-кабель</text>

  <!-- Panel 1: Host PC -->
  <rect x="30" y="90" width="250" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="155" y="115" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Робоча станція (ПК)</text>

  <!-- Sub-block 1.1: Debugging Software -->
  <rect x="45" y="135" width="220" height="110" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="155" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">pyOCD / OpenOCD + GDB</text>
  <text x="155" y="180" text-anchor="middle" font-size="12" fill="#1a1a1a">• Контроль виконання (GDB)</text>
  <text x="155" y="200" text-anchor="middle" font-size="12" fill="#1a1a1a">• Читання регістрів і пам'яті</text>
  <text x="155" y="220" text-anchor="middle" font-size="12" fill="#1a1a1a">• Прошивання Flash-пам'яті</text>

  <!-- Sub-block 1.2: Logging Terminal -->
  <rect x="45" y="260" width="220" height="90" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="155" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Термінал / VS Code</text>
  <text x="155" y="305" text-anchor="middle" font-size="12" fill="#1a1a1a">• COM-порт (CDC Serial)</text>
  <text x="155" y="325" text-anchor="middle" font-size="12" fill="#1a1a1a">• Прийом stdout / printf</text>

  <!-- Sub-block 1.3: USB Driver -->
  <rect x="45" y="365" width="220" height="65" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="155" y="387" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">USB Composite Driver</text>
  <text x="155" y="410" text-anchor="middle" font-size="12" fill="#6b7280">WinUSB / CMSIS-DAP + CDC</text>

  <!-- Panel 2: DAPLink Programmer -->
  <rect x="355" y="90" width="250" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="480" y="115" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Програматор DAPLink</text>

  <!-- Sub-block 2.1: CMSIS-DAP Engine -->
  <rect x="370" y="135" width="220" height="110" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Модуль CMSIS-DAP</text>
  <text x="480" y="180" text-anchor="middle" font-size="12" fill="#1a1a1a">• Обробка команд SWD</text>
  <text x="480" y="200" text-anchor="middle" font-size="12" fill="#1a1a1a">• Керування лінією NRST</text>
  <text x="480" y="220" text-anchor="middle" font-size="12" fill="#1a1a1a">• Генерація тактів SWCLK</text>

  <!-- Sub-block 2.2: CDC Bridge -->
  <rect x="370" y="260" width="220" height="90" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Віртуальний COM-порт</text>
  <text x="480" y="305" text-anchor="middle" font-size="12" fill="#1a1a1a">• Міст USB &lt;-&gt; UART</text>
  <text x="480" y="325" text-anchor="middle" font-size="12" fill="#1a1a1a">• Буферизація RX / TX</text>

  <!-- Sub-block 2.3: DAPLink MCU -->
  <rect x="370" y="365" width="220" height="65" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="387" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Мікроконтролер DAPLink</text>
  <text x="480" y="410" text-anchor="middle" font-size="12" fill="#6b7280">(STM32 / LPC11U35 / K20)</text>

  <!-- Panel 3: Target Cortex-M MCU -->
  <rect x="680" y="90" width="250" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="805" y="115" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Цільовий Cortex-M MCU</text>

  <!-- Sub-block 3.1: Debug Core -->
  <rect x="695" y="135" width="220" height="110" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="805" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Ядро Cortex-M (Debug)</text>
  <text x="805" y="180" text-anchor="middle" font-size="12" fill="#1a1a1a">• SW-DP / DAP контролер</text>
  <text x="805" y="200" text-anchor="middle" font-size="12" fill="#1a1a1a">• Доступ до RAM, Flash, CPU</text>
  <text x="805" y="220" text-anchor="middle" font-size="12" fill="#1a1a1a">• Точки зупинки (Hardware BP)</text>

  <!-- Sub-block 3.2: UART Peripheral -->
  <rect x="695" y="260" width="220" height="90" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="805" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Периферія UART</text>
  <text x="805" y="305" text-anchor="middle" font-size="12" fill="#1a1a1a">• Вивід логів (printf)</text>
  <text x="805" y="325" text-anchor="middle" font-size="12" fill="#1a1a1a">• Регістри DR, SR, BRR</text>

  <!-- Sub-block 3.3: Power/Reset -->
  <rect x="695" y="365" width="220" height="65" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="805" y="387" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Система живлення і RESET</text>
  <text x="805" y="410" text-anchor="middle" font-size="12" fill="#6b7280">Лінія NRST / VCC (3.3V)</text>

  <!-- USB Cable Section (PC to DAPLink) -->
  <rect x="272" y="135" width="76" height="205" rx="6" fill="none" stroke="#6b7280" stroke-dasharray="4,4" stroke-width="1"/>
  <text x="310" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">USB-інтерфейс</text>

  <!-- USB Connection 1: Debug (Blue) -->
  <line x1="265" y1="190" x2="370" y2="190" stroke="#2457d6" stroke-width="2" marker-start="url(#arr-blue-start)" marker-end="url(#arr-blue)"/>
  <text x="310" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">USB HID / WinUSB</text>
  <text x="310" y="209" text-anchor="middle" font-size="12" fill="#6b7280">(CMSIS-DAP)</text>

  <!-- USB Connection 2: CDC UART (Green) -->
  <line x1="265" y1="305" x2="370" y2="305" stroke="#27ae60" stroke-width="2" marker-start="url(#arr-green-start)" marker-end="url(#arr-green)"/>
  <text x="310" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">USB CDC ACM</text>
  <text x="310" y="324" text-anchor="middle" font-size="12" fill="#6b7280">(Virtual COM)</text>

  <!-- Physical SWD & UART Connections (DAPLink to Target MCU) -->
  <!-- Line 1: SWCLK (Blue) -->
  <line x1="590" y1="160" x2="695" y2="160" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="642" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">SWCLK</text>

  <!-- Line 2: SWDIO (Blue, Bidirectional) -->
  <line x1="590" y1="190" x2="695" y2="190" stroke="#2457d6" stroke-width="2" marker-start="url(#arr-blue-start)" marker-end="url(#arr-blue)"/>
  <text x="642" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">SWDIO (Data)</text>

  <!-- Line 3: NRST (Blue) -->
  <line x1="590" y1="220" x2="695" y2="220" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="642" y="208" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">nRESET</text>

  <!-- Line 4: UART TX -> RX (Green, Target to DAPLink) -->
  <line x1="695" y1="285" x2="590" y2="285" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="642" y="273" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">TX → RX (Логи)</text>

  <!-- Line 5: UART RX <- TX (Green, DAPLink to Target) -->
  <line x1="590" y1="320" x2="695" y2="320" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="642" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">RX ← TX (Ввід)</text>

  <!-- Legend Box at Bottom -->
  <rect x="150" y="460" width="660" height="28" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="175" y="468" width="12" height="12" rx="2" fill="#2457d6"/>
  <text x="193" y="479" font-size="12" fill="#1a1a1a">Канал зневадження (SWD / CMSIS-DAP)</text>
  <rect x="495" y="468" width="12" height="12" rx="2" fill="#27ae60"/>
  <text x="513" y="479" font-size="12" fill="#1a1a1a">Канал логування (CDC / UART Console)</text>
</svg>
