<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Карта Flash-пам'яті DAPLink та механізм двокомпонентного оновлення</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Ізоляція Bootloader у початкових секторах гарантує збереження функції оновлення при пошкодженні Interface</text>

  <!-- Markers -->
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Left Panel: Flash Memory Map -->
  <rect x="30" y="80" width="440" height="435" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="250" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Розподіл Flash-пам'яті мікроконтролера</text>

  <!-- Address Labels (Left of memory blocks) -->
  <text x="115" y="138" text-anchor="end" font-size="12" font-weight="bold" fill="#6b7280">0x00000000</text>
  <text x="115" y="238" text-anchor="end" font-size="12" font-weight="bold" fill="#6b7280">0x00008000</text>
  <text x="115" y="292" text-anchor="end" font-size="12" font-weight="bold" fill="#6b7280">0x0000A000</text>
  <text x="115" y="485" text-anchor="end" font-size="12" font-weight="bold" fill="#6b7280">0x00040000</text>

  <!-- Block 1: Bootloader Region -->
  <rect x="125" y="125" width="330" height="105" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="290" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Bootloader (Завантажувач)</text>
  <text x="138" y="170" font-size="12" fill="#1a1a1a">• Вектори переривань (Vector Table)</text>
  <text x="138" y="190" font-size="12" fill="#1a1a1a">• Драйвер USB MSC (Диск MAINTENANCE)</text>
  <text x="138" y="210" font-size="12" fill="#6b7280">• Перевірка цілісності та флешер</text>

  <!-- Block 2: Config Sector -->
  <rect x="125" y="240" width="330" height="42" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="290" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">Конфігураційний сектор (Config Data)</text>
  <text x="290" y="274" text-anchor="middle" font-size="12" fill="#6b7280">Board ID, ключі та прапори стану</text>

  <!-- Block 3: Interface Firmware Region -->
  <rect x="125" y="292" width="330" height="210" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="290" y="315" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Interface Firmware (Робоча прошивка)</text>
  <text x="138" y="338" font-size="12" fill="#1a1a1a">• Стек CMSIS-DAP (SWD / JTAG зневадження)</text>
  <text x="138" y="358" font-size="12" fill="#1a1a1a">• Віртуальний COM-порт (CDC UART)</text>
  <text x="138" y="378" font-size="12" fill="#1a1a1a">• Drag-and-Drop флешер цільового чипа</text>
  <text x="138" y="398" font-size="12" fill="#1a1a1a">• Інтерфейси WebUSB / WinUSB Bulk</text>

  <!-- Sub-box inside Block 3 -->
  <rect x="138" y="418" width="304" height="72" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="290" y="438" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Оновлювана область Flash-пам'яті</text>
  <text x="290" y="458" text-anchor="middle" font-size="12" fill="#6b7280">Перезаписується завантажувачем</text>
  <text x="290" y="476" text-anchor="middle" font-size="12" fill="#6b7280">без ризику пошкодження Bootloader</text>

  <!-- Right Panel: Execution Logic & Recovery -->
  <rect x="490" y="80" width="440" height="435" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="710" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Логіка запуску та стабільності системи</text>

  <!-- Mode 1: Normal Run -->
  <rect x="505" y="125" width="410" height="160" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="520" y="148" font-size="13" font-weight="bold" fill="#27ae60">1. Нормальний запуск (Interface Mode)</text>

  <rect x="730" y="132" width="170" height="24" rx="4" fill="#27ae60"/>
  <text x="815" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">RESET не затиснуто</text>

  <text x="520" y="175" font-size="12" fill="#1a1a1a">• Bootloader перевіряє КС прошивки Interface.</text>
  <text x="520" y="197" font-size="12" fill="#1a1a1a">• Передає керування на вектор 0x0000A000.</text>
  <text x="520" y="219" font-size="12" fill="#1a1a1a">• Запускає CMSIS-DAP, CDC UART та USB MSC.</text>
  <text x="520" y="242" font-size="12" font-weight="bold" fill="#27ae60">Результат: Активний режим зневадження та прошивки</text>
  <text x="520" y="264" font-size="12" fill="#6b7280">Пристроєм виконуються регулярні робочі задачі</text>

  <!-- Connecting Line 1 (Bootloader to Normal Run) -->
  <line x1="455" y1="175" x2="497" y2="175" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Mode 2: Recovery / Maintenance Mode -->
  <rect x="505" y="300" width="410" height="200" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="520" y="323" font-size="13" font-weight="bold" fill="#c0392b">2. Режим оновлення (Maintenance Mode)</text>

  <rect x="725" y="307" width="175" height="24" rx="4" fill="#c0392b"/>
  <text x="812" y="323" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">RESET затиснуто / Збій</text>

  <text x="520" y="350" font-size="12" fill="#1a1a1a">• Завантажувач утримує керування у Bootloader.</text>
  <text x="520" y="370" font-size="12" fill="#1a1a1a">• Монтується USB-диск з ім'ям MAINTENANCE.</text>
  <text x="520" y="390" font-size="12" fill="#1a1a1a">• Перетягування interface.bin оновлює прошивку.</text>

  <rect x="520" y="408" width="380" height="78" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="710" y="428" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Захист від апаратного блокування (Brick Protection)</text>
  <text x="710" y="448" text-anchor="middle" font-size="12" fill="#6b7280">Збій живлення під час оновлення не пошкоджує</text>
  <text x="710" y="466" text-anchor="middle" font-size="12" fill="#6b7280">сектор Bootloader і дозволяє повторну прошивку</text>

  <!-- Connecting Line 2 (Bootloader to Maintenance Mode) -->
  <path d="M 455,195 L 480,195 L 480,350 L 497,350" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arr-red)"/>
</svg>
