<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="#ffffff"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Апаратна схема з'єднання DAPLink та цільового мікроконтролера</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Передача сигналів SWD/SWO, nRESET та вимірювання опорної напруги Target VCC через буфери узгодження рівнів</text>

  <!-- ================= LEFT BOX: DAPLINK DEBUGGER ================= -->
  <rect x="30" y="75" width="240" height="375" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

  <!-- DAPLink Header Badge -->
  <rect x="45" y="90" width="210" height="36" rx="6" fill="#2457d6"/>
  <text x="150" y="113" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Програматор DAPLink</text>

  <!-- MCU & USB Module Block inside DAPLink -->
  <rect x="45" y="140" width="140" height="285" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="115" y="170" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Головний МК</text>
  <text x="115" y="190" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">DAPLink</text>
  <text x="115" y="212" font-size="11" fill="#6b7280" text-anchor="middle">(CMSIS-DAP)</text>
  
  <line x1="55" y1="235" x2="175" y2="235" stroke="#d0d7de" stroke-width="1"/>
  
  <text x="115" y="265" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">USB-інтерфейс</text>
  <text x="115" y="285" font-size="11" fill="#6b7280" text-anchor="middle">(ПК-хост)</text>
  <text x="115" y="315" font-size="11" fill="#6b7280" text-anchor="middle">Канал CDC/UART</text>
  <text x="115" y="335" font-size="11" fill="#6b7280" text-anchor="middle">Накопичувач MSC</text>

  <!-- Pin Labels inside DAPLink right margin -->
  <text x="255" y="149" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="end">VCC</text>
  <text x="255" y="204" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="end">SWCLK</text>
  <text x="255" y="259" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="end">SWDIO</text>
  <text x="255" y="314" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="end">SWO</text>
  <text x="255" y="369" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="end">nRESET</text>
  <text x="255" y="419" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="end">GND</text>

  <!-- Pin Connection Dots on DAPLink -->
  <circle cx="270" cy="145" r="4" fill="#c0392b"/>
  <circle cx="270" cy="200" r="4" fill="#2457d6"/>
  <circle cx="270" cy="255" r="4" fill="#2457d6"/>
  <circle cx="270" cy="310" r="4" fill="#27ae60"/>
  <circle cx="270" cy="365" r="4" fill="#c0392b"/>
  <circle cx="270" cy="415" r="4" fill="#1a1a1a"/>

  <!-- ================= MIDDLE BOX: LEVEL SHIFTER & SIGNAL LINES ================= -->
  <rect x="310" y="75" width="340" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Level Shifter Header -->
  <rect x="325" y="85" width="310" height="28" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="104" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Буфери узгодження рівнів (1.8 V – 3.3 V)</text>

  <!-- Line 1: Target VCC (Sense) -->
  <text x="480" y="127" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">VCC Sense (Опорна напруга цілі)</text>
  <line x1="690" y1="145" x2="276" y2="145" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <rect x="460" y="133" width="40" height="24" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="480" y="149" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">VCC</text>

  <!-- Line 2: SWCLK -->
  <text x="480" y="182" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">SWCLK (Тактування)</text>
  <line x1="270" y1="200" x2="684" y2="200" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <polygon points="465,190 495,200 465,210" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Line 3: SWDIO -->
  <text x="480" y="237" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">SWDIO (Двонапрямлені дані)</text>
  <line x1="276" y1="255" x2="684" y2="255" stroke="#2457d6" stroke-width="2" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
  <polygon points="455,247 470,255 455,263" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <polygon points="505,247 490,255 505,263" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Line 4: SWO -->
  <text x="480" y="292" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">SWO / TRACESWO (Трасування)</text>
  <line x1="690" y1="310" x2="276" y2="310" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <polygon points="495,300 465,310 495,320" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Line 5: nRESET -->
  <text x="480" y="347" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">nRESET / NRST (Скидання)</text>
  <line x1="270" y1="365" x2="684" y2="365" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <rect x="465" y="353" width="30" height="24" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="480" y="369" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">OD</text>

  <!-- Line 6: GND -->
  <text x="480" y="402" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GND (Спільна земля)</text>
  <line x1="270" y1="415" x2="690" y2="415" stroke="#1a1a1a" stroke-width="2"/>

  <!-- ================= RIGHT BOX: TARGET MCU ================= -->
  <rect x="690" y="75" width="240" height="375" rx="10" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Target Header Badge -->
  <rect x="705" y="90" width="210" height="36" rx="6" fill="#27ae60"/>
  <text x="810" y="113" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">Цільовий МК (Cortex-M)</text>

  <!-- CoreSight Debug Port Block inside Target MCU -->
  <rect x="775" y="140" width="140" height="150" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="845" y="168" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">CoreSight</text>
  <text x="845" y="188" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Debug Port</text>
  <text x="845" y="210" font-size="11" fill="#6b7280" text-anchor="middle">(SW-DP / ITM)</text>
  <text x="845" y="240" font-size="11" fill="#6b7280" text-anchor="middle">Модуль трасування</text>
  <text x="845" y="260" font-size="11" fill="#6b7280" text-anchor="middle">та зневадження</text>

  <!-- Power & Reset Block inside Target MCU -->
  <rect x="775" y="305" width="140" height="120" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="845" y="333" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Живлення</text>
  <text x="845" y="351" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">та скидання</text>
  <text x="845" y="376" font-size="11" fill="#6b7280" text-anchor="middle">(VCC 1.8–3.3V)</text>
  <text x="845" y="396" font-size="11" fill="#6b7280" text-anchor="middle">(Лінія NRST)</text>

  <!-- Pin Labels inside Target MCU left margin -->
  <text x="705" y="149" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="start">VCC</text>
  <text x="705" y="204" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="start">SWCLK</text>
  <text x="705" y="259" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="start">SWDIO</text>
  <text x="705" y="314" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="start">TRACESWO</text>
  <text x="705" y="369" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="start">NRST</text>
  <text x="705" y="419" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="start">GND</text>

  <!-- Pin Connection Dots on Target MCU -->
  <circle cx="690" cy="145" r="4" fill="#c0392b"/>
  <circle cx="690" cy="200" r="4" fill="#2457d6"/>
  <circle cx="690" cy="255" r="4" fill="#2457d6"/>
  <circle cx="690" cy="310" r="4" fill="#27ae60"/>
  <circle cx="690" cy="365" r="4" fill="#c0392b"/>
  <circle cx="690" cy="415" r="4" fill="#1a1a1a"/>
</svg>
