<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Маркери стрілок -->
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Структура пакетів запиту та відповіді DAP_Transfer</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Формат бінарного пакета команд CMSIS-DAP, вирівнювання байтів та статуси підтвердження ACK</text>

  <!-- БЛОК 1: ЗАПИТ ХОСТА -->
  <rect x="40" y="80" width="880" height="195" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="55" y="105" font-size="14" font-weight="700" fill="#2457d6">1. Пакет запиту хоста (Host Request Packet — 0x05)</text>

  <!-- Байтові поля запиту -->
  <!-- Byte 0 -->
  <rect x="55" y="125" width="125" height="50" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="117" y="145" font-size="11" fill="#6b7280" text-anchor="middle">Byte 0</text>
  <text x="117" y="163" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">0x05 (ID)</text>

  <!-- Byte 1 -->
  <rect x="190" y="125" width="125" height="50" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="252" y="145" font-size="11" fill="#6b7280" text-anchor="middle">Byte 1</text>
  <text x="252" y="163" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">DAP Index (0x00)</text>

  <!-- Byte 2 -->
  <rect x="325" y="125" width="145" height="50" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="397" y="145" font-size="11" fill="#6b7280" text-anchor="middle">Byte 2</text>
  <text x="397" y="163" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Transfer Count (N)</text>

  <!-- Byte 3..M -->
  <rect x="480" y="125" width="425" height="50" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="692" y="145" font-size="11" fill="#2457d6" text-anchor="middle">Bytes 3 ... M</text>
  <text x="692" y="163" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Послідовність транзакцій: Transfer Request [0..N-1] + Data</text>

  <!-- Деталізація байта Transfer Request -->
  <rect x="55" y="190" width="850" height="70" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="70" y="210" font-size="12" font-weight="700" fill="#1a1a1a">Деталізація 1 байта Transfer Request:</text>

  <rect x="70" y="220" width="165" height="28" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="152" y="238" font-size="11" fill="#1a1a1a" text-anchor="middle">Bit 0: APnDP (0=DP, 1=AP)</text>

  <rect x="245" y="220" width="175" height="28" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="332" y="238" font-size="11" fill="#1a1a1a" text-anchor="middle">Bit 1: RnW (0=Write, 1=Read)</text>

  <rect x="430" y="220" width="165" height="28" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="512" y="238" font-size="11" fill="#1a1a1a" text-anchor="middle">Bits 2..3: A[3:2] (Адреса)</text>

  <rect x="605" y="220" width="285" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="747" y="238" font-size="11" font-weight="700" fill="#2457d6" text-anchor="middle">Якщо Write: +4 байти Write Data (uint32_t)</text>


  <!-- БЛОК 2: ВІДПОВІДЬ DAPLINK -->
  <rect x="40" y="290" width="880" height="195" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="55" y="315" font-size="14" font-weight="700" fill="#27ae60">2. Пакет відповіді програматора (Response Packet)</text>

  <!-- Байтові поля відповіді -->
  <!-- Byte 0 -->
  <rect x="55" y="335" width="125" height="50" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="117" y="355" font-size="11" fill="#6b7280" text-anchor="middle">Byte 0</text>
  <text x="117" y="373" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">0x05 (ID)</text>

  <!-- Byte 1 -->
  <rect x="190" y="335" width="145" height="50" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="262" y="355" font-size="11" fill="#6b7280" text-anchor="middle">Byte 1</text>
  <text x="262" y="373" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Transfer Count (M)</text>

  <!-- Byte 2 -->
  <rect x="345" y="335" width="165" height="50" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="427" y="355" font-size="11" fill="#6b7280" text-anchor="middle">Byte 2</text>
  <text x="427" y="373" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">ACK Response Status</text>

  <!-- Byte 3..L -->
  <rect x="520" y="335" width="385" height="50" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="712" y="355" font-size="11" fill="#2457d6" text-anchor="middle">Bytes 3 ... 3 + 4×R</text>
  <text x="712" y="373" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Read Data (uint32_t × R зчитаних регістрів)</text>

  <!-- Статуси ACK -->
  <rect x="55" y="400" width="850" height="70" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="70" y="420" font-size="12" font-weight="700" fill="#1a1a1a">Розшифровка статусу відповіді ACK (Byte 2):</text>

  <rect x="70" y="430" width="145" height="28" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="142" y="448" font-size="11" font-weight="700" fill="#27ae60" text-anchor="middle">0x01: OK (успішно)</text>

  <rect x="225" y="430" width="165" height="28" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="307" y="448" font-size="11" fill="#6b7280" text-anchor="middle">0x02: WAIT (очікування)</text>

  <rect x="400" y="430" width="155" height="28" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="477" y="448" font-size="11" font-weight="700" fill="#c0392b" text-anchor="middle">0x04: FAULT (помилка)</text>

  <rect x="565" y="430" width="185" height="28" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="657" y="448" font-size="11" font-weight="700" fill="#c0392b" text-anchor="middle">0x08: NO_ACK (немає відповіді)</text>

  <text x="760" y="448" font-size="11" fill="#6b7280">M — кількість успішних транзакцій</text>


  <!-- БАНЕР ВИРІВНЮВАННЯ ВНИЗУ -->
  <rect x="40" y="498" width="880" height="38" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="522" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Формат байтів: Усі 32-бітні значення (Write Data та Read Data) вирівняні по 4 байти та передаються в Little-Endian</text>
</svg>
