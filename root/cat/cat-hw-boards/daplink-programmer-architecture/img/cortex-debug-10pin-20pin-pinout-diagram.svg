<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Цокольовка роз'ємів Cortex Debug (10-pin та 20-pin)</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Призначення сигнальних ліній SWD (SWCLK, SWDIO, SWO, nRESET, VREF) та заземлення</text>

  <!-- Panel 1: 10-pin Cortex Debug Header -->
  <rect x="30" y="75" width="420" height="440" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="98" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="start">1. Роз'єм Cortex Debug 10-pin (1.27 мм)</text>

  <!-- Panel 1 Pinout Housing Diagram -->
  <rect x="140" y="115" width="200" height="95" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="225" y="115" width="30" height="8" rx="1" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="240" y="133" font-size="12" fill="#6b7280" text-anchor="middle">Ключ (Key)</text>

  <!-- Panel 1 Pin Circles -->
  <!-- Row 1: Pin 1, 2 -->
  <circle cx="180" cy="145" r="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="300" cy="145" r="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <!-- Row 2: Pin 3, 4 -->
  <circle cx="180" cy="160" r="5" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="300" cy="160" r="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <!-- Row 3: Pin 5, 6 -->
  <circle cx="180" cy="175" r="5" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="300" cy="175" r="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <!-- Row 4: Pin 7, 8 -->
  <circle cx="180" cy="190" r="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="300" cy="190" r="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <!-- Row 5: Pin 9, 10 -->
  <circle cx="180" cy="202" r="5" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="300" cy="202" r="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Panel 1 Table -->
  <rect x="45" y="225" width="390" height="25" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="60" y="242" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="start">Pin</text>
  <text x="100" y="242" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="start">Сигнал</text>
  <text x="220" y="242" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="start">Призначення лінії</text>

  <!-- Row 1: Pin 1 -->
  <rect x="45" y="252" width="390" height="24" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="60" y="268" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">1</text>
  <text x="100" y="268" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">VCC / VREF</text>
  <text x="220" y="268" font-size="12" fill="#1a1a1a" text-anchor="start">Опорна напруга (1.8-3.3V)</text>

  <!-- Row 2: Pin 2 -->
  <rect x="45" y="278" width="390" height="24" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="60" y="294" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">2</text>
  <text x="100" y="294" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">SWDIO / TMS</text>
  <text x="220" y="294" font-size="12" fill="#1a1a1a" text-anchor="start">Двонаправлені дані SWD</text>

  <!-- Row 3: Pin 3 -->
  <rect x="45" y="304" width="390" height="24" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="60" y="320" font-size="12" fill="#6b7280" text-anchor="start">3</text>
  <text x="100" y="320" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="start">GND</text>
  <text x="220" y="320" font-size="12" fill="#6b7280" text-anchor="start">Заземлення</text>

  <!-- Row 4: Pin 4 -->
  <rect x="45" y="330" width="390" height="24" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="60" y="346" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">4</text>
  <text x="100" y="346" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">SWCLK / TCK</text>
  <text x="220" y="346" font-size="12" fill="#1a1a1a" text-anchor="start">Тактовий сигнал SWD</text>

  <!-- Row 5: Pin 5 -->
  <rect x="45" y="356" width="390" height="24" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="60" y="372" font-size="12" fill="#6b7280" text-anchor="start">5</text>
  <text x="100" y="372" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="start">GND</text>
  <text x="220" y="372" font-size="12" fill="#6b7280" text-anchor="start">Заземлення</text>

  <!-- Row 6: Pin 6 -->
  <rect x="45" y="382" width="390" height="24" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="60" y="398" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">6</text>
  <text x="100" y="398" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">SWO / TDO</text>
  <text x="220" y="398" font-size="12" fill="#1a1a1a" text-anchor="start">Трасування (Trace)</text>

  <!-- Row 7: Pin 7 -->
  <rect x="45" y="408" width="390" height="24" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="60" y="424" font-size="12" fill="#6b7280" text-anchor="start">7</text>
  <text x="100" y="424" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="start">KEY / NC</text>
  <text x="220" y="424" font-size="12" fill="#6b7280" text-anchor="start">Ключ роз'єму</text>

  <!-- Row 8: Pin 8 -->
  <rect x="45" y="434" width="390" height="24" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="60" y="450" font-size="12" fill="#6b7280" text-anchor="start">8</text>
  <text x="100" y="450" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="start">NC / TDI</text>
  <text x="220" y="450" font-size="12" fill="#6b7280" text-anchor="start">Не використовується</text>

  <!-- Row 9: Pin 9 -->
  <rect x="45" y="460" width="390" height="24" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="60" y="476" font-size="12" fill="#6b7280" text-anchor="start">9</text>
  <text x="100" y="476" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="start">GNDDetect</text>
  <text x="220" y="476" font-size="12" fill="#6b7280" text-anchor="start">Детекція кабелю</text>

  <!-- Row 10: Pin 10 -->
  <rect x="45" y="486" width="390" height="24" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="60" y="502" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">10</text>
  <text x="100" y="502" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">nRESET</text>
  <text x="220" y="502" font-size="12" fill="#1a1a1a" text-anchor="start">Скидання мікроконтролера</text>

  <!-- Panel 2: 20-pin ARM Debug Header -->
  <rect x="480" y="75" width="450" height="440" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="495" y="98" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="start">2. Роз'єм ARM JTAG / Cortex 20-pin (2.54 мм)</text>

  <!-- Panel 2 Pinout Housing Diagram -->
  <rect x="580" y="115" width="250" height="95" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="690" y="115" width="30" height="8" rx="1" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="705" y="133" font-size="12" fill="#6b7280" text-anchor="middle">Ключ (Key)</text>

  <!-- Panel 2 Pin Circles (10 rows x 2 cols) -->
  <circle cx="620" cy="140" r="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="790" cy="140" r="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>

  <circle cx="620" cy="147" r="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="790" cy="147" r="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>

  <circle cx="620" cy="154" r="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="790" cy="154" r="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>

  <circle cx="620" cy="161" r="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="790" cy="161" r="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>

  <circle cx="620" cy="168" r="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="790" cy="168" r="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>

  <circle cx="620" cy="175" r="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="790" cy="175" r="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>

  <circle cx="620" cy="182" r="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="790" cy="182" r="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>

  <circle cx="620" cy="189" r="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="790" cy="189" r="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>

  <circle cx="620" cy="196" r="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="790" cy="196" r="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>

  <circle cx="620" cy="203" r="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="790" cy="203" r="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Panel 2 Table Headers -->
  <rect x="495" y="225" width="205" height="25" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="505" y="242" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">Непарні піни (Сигнали)</text>

  <rect x="712" y="225" width="203" height="25" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="722" y="242" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="start">Парні піни (Заземлення)</text>

  <!-- Panel 2 Table Rows (10 Pin Pairs) -->
  <!-- Pair 1 -->
  <rect x="495" y="252" width="205" height="24" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="505" y="268" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">1: VREF (1.8-3.3V)</text>
  <rect x="712" y="252" width="203" height="24" rx="3" fill="#f4f6f8" stroke="#6b7280" stroke-width="1"/>
  <text x="722" y="268" font-size="12" fill="#6b7280" text-anchor="start">2: VCC / GND</text>

  <!-- Pair 2 -->
  <rect x="495" y="278" width="205" height="24" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="505" y="294" font-size="12" fill="#1a1a1a" text-anchor="start">3: nTRST (JTAG Reset)</text>
  <rect x="712" y="278" width="203" height="24" rx="3" fill="#f4f6f8" stroke="#6b7280" stroke-width="1"/>
  <text x="722" y="294" font-size="12" fill="#6b7280" text-anchor="start">4: GND</text>

  <!-- Pair 3 -->
  <rect x="495" y="304" width="205" height="24" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="505" y="320" font-size="12" fill="#1a1a1a" text-anchor="start">5: TDI (JTAG Data In)</text>
  <rect x="712" y="304" width="203" height="24" rx="3" fill="#f4f6f8" stroke="#6b7280" stroke-width="1"/>
  <text x="722" y="320" font-size="12" fill="#6b7280" text-anchor="start">6: GND</text>

  <!-- Pair 4 -->
  <rect x="495" y="330" width="205" height="24" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="505" y="346" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">7: SWDIO / TMS</text>
  <rect x="712" y="330" width="203" height="24" rx="3" fill="#f4f6f8" stroke="#6b7280" stroke-width="1"/>
  <text x="722" y="346" font-size="12" fill="#6b7280" text-anchor="start">8: GND</text>

  <!-- Pair 5 -->
  <rect x="495" y="356" width="205" height="24" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="505" y="372" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">9: SWCLK / TCK</text>
  <rect x="712" y="356" width="203" height="24" rx="3" fill="#f4f6f8" stroke="#6b7280" stroke-width="1"/>
  <text x="722" y="372" font-size="12" fill="#6b7280" text-anchor="start">10: GND</text>

  <!-- Pair 6 -->
  <rect x="495" y="382" width="205" height="24" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="505" y="398" font-size="12" fill="#1a1a1a" text-anchor="start">11: RTCK / NC</text>
  <rect x="712" y="382" width="203" height="24" rx="3" fill="#f4f6f8" stroke="#6b7280" stroke-width="1"/>
  <text x="722" y="398" font-size="12" fill="#6b7280" text-anchor="start">12: GND</text>

  <!-- Pair 7 -->
  <rect x="495" y="408" width="205" height="24" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="505" y="424" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">13: SWO / TDO</text>
  <rect x="712" y="408" width="203" height="24" rx="3" fill="#f4f6f8" stroke="#6b7280" stroke-width="1"/>
  <text x="722" y="424" font-size="12" fill="#6b7280" text-anchor="start">14: GND</text>

  <!-- Pair 8 -->
  <rect x="495" y="434" width="205" height="24" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="505" y="450" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">15: nRESET</text>
  <rect x="712" y="434" width="203" height="24" rx="3" fill="#f4f6f8" stroke="#6b7280" stroke-width="1"/>
  <text x="722" y="450" font-size="12" fill="#6b7280" text-anchor="start">16: GND</text>

  <!-- Pair 9 -->
  <rect x="495" y="460" width="205" height="24" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="505" y="476" font-size="12" fill="#1a1a1a" text-anchor="start">17: NC / DBGRQ</text>
  <rect x="712" y="460" width="203" height="24" rx="3" fill="#f4f6f8" stroke="#6b7280" stroke-width="1"/>
  <text x="722" y="476" font-size="12" fill="#6b7280" text-anchor="start">18: GND</text>

  <!-- Pair 10 -->
  <rect x="495" y="486" width="205" height="24" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="505" y="502" font-size="12" fill="#1a1a1a" text-anchor="start">19: NC / DBGACK</text>
  <rect x="712" y="486" width="203" height="24" rx="3" fill="#f4f6f8" stroke="#6b7280" stroke-width="1"/>
  <text x="722" y="502" font-size="12" fill="#6b7280" text-anchor="start">20: GND</text>
</svg>
