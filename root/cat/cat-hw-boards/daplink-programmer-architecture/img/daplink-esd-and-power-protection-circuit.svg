<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White background -->
  <rect x="0" y="0" width="960" height="530" fill="white"/>

  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="480" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема захисту сигнальних ліній та кіл живлення DAPLink</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Комплексний захист від перевантаження струмом (PPTC), статичного розряду (TVS) та зворотного струму (Шотткі)</text>

  <!-- Panel 1: USB Input -->
  <rect x="25" y="78" width="155" height="185" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="102" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Джерело USB</text>
  
  <rect x="35" y="133" width="135" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="102" y="149" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">VBUS (+5.0V)</text>

  <rect x="35" y="208" width="135" height="24" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
  <text x="102" y="224" text-anchor="middle" font-size="12" fill="#1a1a1a">GND (0V)</text>

  <!-- Panel 2: Power Protection Node -->
  <rect x="205" y="78" width="460" height="185" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="435" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Вузол Захисту Живлення (PPTC + TVS + Schottky + LDO)</text>

  <!-- Power Line (Green) -->
  <line x1="170" y1="145" x2="225" y2="145" stroke="#27ae60" stroke-width="2.5"/>
  
  <!-- PPTC Fuse -->
  <text x="255" y="122" text-anchor="middle" font-size="12" fill="#1a1a1a">500 mA</text>
  <rect x="225" y="131" width="60" height="28" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="255" y="149" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">PPTC</text>
  
  <line x1="285" y1="145" x2="335" y2="145" stroke="#27ae60" stroke-width="2.5"/>

  <!-- TVS Power Protection -->
  <circle cx="335" cy="145" r="3" fill="#27ae60"/>
  <line x1="335" y1="145" x2="335" y2="170" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="315" y="170" width="40" height="30" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="335" y="189" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">TVS</text>
  <line x1="335" y1="200" x2="335" y2="220" stroke="#6b7280" stroke-width="1.5"/>
  <text x="385" y="189" font-size="12" fill="#c0392b">5.6V ESD</text>

  <line x1="335" y1="145" x2="395" y2="145" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Schottky Diode -->
  <text x="425" y="122" text-anchor="middle" font-size="12" fill="#1a1a1a">Діод Шотткі</text>
  <rect x="395" y="131" width="60" height="28" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <polygon points="415,137 415,153 435,145" fill="#27ae60"/>
  <line x1="435" y1="137" x2="435" y2="153" stroke="#27ae60" stroke-width="2"/>
  <text x="425" y="175" text-anchor="middle" font-size="12" fill="#6b7280">BAT54C</text>

  <line x1="455" y1="145" x2="515" y2="145" stroke="#27ae60" stroke-width="2.5"/>

  <!-- LDO 3.3V -->
  <rect x="515" y="123" width="70" height="44" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="550" y="144" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">LDO</text>
  <text x="550" y="159" text-anchor="middle" font-size="12" fill="#6b7280">3.3V Reg</text>

  <line x1="585" y1="145" x2="705" y2="145" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <!-- Ground Line -->
  <line x1="170" y1="220" x2="705" y2="220" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,4"/>
  <circle cx="335" cy="220" r="3" fill="#6b7280"/>
  <circle cx="550" cy="220" r="3" fill="#6b7280"/>
  <line x1="550" y1="167" x2="550" y2="220" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Panel 3: MCU Core Lines -->
  <rect x="25" y="275" width="155" height="230" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="102" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">MCU DAPLink</text>

  <rect x="35" y="313" width="135" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="102" y="329" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">SWCLK</text>

  <rect x="35" y="353" width="135" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="102" y="369" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">SWDIO</text>

  <rect x="35" y="393" width="135" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="102" y="409" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">nRESET</text>

  <rect x="35" y="433" width="135" height="24" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="102" y="449" text-anchor="middle" font-size="12" fill="#1a1a1a">UART_TX</text>

  <rect x="35" y="473" width="135" height="24" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="102" y="489" text-anchor="middle" font-size="12" fill="#1a1a1a">UART_RX</text>

  <!-- Panel 4: Signal Protection Node -->
  <rect x="205" y="275" width="460" height="230" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="435" y="294" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Вузол Захисту Сигнальних Ліній (TVS + R_s + Buffer)</text>

  <!-- Resistors Header Label -->
  <text x="255" y="311" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">R_s (33 Ом)</text>

  <!-- Lines from MCU into Protection Panel -->
  <line x1="170" y1="325" x2="235" y2="325" stroke="#2457d6" stroke-width="2"/>
  <line x1="170" y1="365" x2="235" y2="365" stroke="#2457d6" stroke-width="2"/>
  <line x1="170" y1="405" x2="235" y2="405" stroke="#c0392b" stroke-width="2"/>
  <line x1="170" y1="445" x2="235" y2="445" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="170" y1="485" x2="235" y2="485" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Series Resistors R_s (x=235..275) -->
  <rect x="235" y="318" width="40" height="14" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
  <rect x="235" y="358" width="40" height="14" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
  <rect x="235" y="398" width="40" height="14" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
  <rect x="235" y="438" width="40" height="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <rect x="235" y="478" width="40" height="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>

  <!-- Lines from Resistors to TVS Array -->
  <line x1="275" y1="325" x2="340" y2="325" stroke="#2457d6" stroke-width="2"/>
  <line x1="275" y1="365" x2="340" y2="365" stroke="#2457d6" stroke-width="2"/>
  <line x1="275" y1="405" x2="340" y2="405" stroke="#c0392b" stroke-width="2"/>
  <line x1="275" y1="445" x2="340" y2="445" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="275" y1="485" x2="340" y2="485" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- TVS Array Module (x=340..450, y=310..495) -->
  <rect x="340" y="310" width="110" height="185" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="395" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">TVS Масив</text>
  <text x="395" y="344" text-anchor="middle" font-size="12" fill="#c0392b">USBLC6-2SC6</text>

  <!-- TVS internal indicators -->
  <circle cx="370" cy="365" r="3" fill="#c0392b"/>
  <circle cx="370" cy="405" r="3" fill="#c0392b"/>
  <text x="395" y="430" text-anchor="middle" font-size="12" fill="#1a1a1a">Захист ESD</text>
  <text x="395" y="448" text-anchor="middle" font-size="12" fill="#6b7280">(8 кВ contact)</text>

  <!-- Ground connection for TVS array -->
  <line x1="395" y1="495" x2="395" y2="505" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="380" y1="505" x2="410" y2="505" stroke="#6b7280" stroke-width="2"/>
  <line x1="387" y1="508" x2="403" y2="508" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="392" y1="511" x2="398" y2="511" stroke="#6b7280" stroke-width="1"/>

  <!-- Lines from TVS Array to Level Shifter Buffer -->
  <line x1="450" y1="325" x2="505" y2="325" stroke="#2457d6" stroke-width="2"/>
  <line x1="450" y1="365" x2="505" y2="365" stroke="#2457d6" stroke-width="2"/>
  <line x1="450" y1="405" x2="505" y2="405" stroke="#c0392b" stroke-width="2"/>
  <line x1="450" y1="445" x2="505" y2="445" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="450" y1="485" x2="505" y2="485" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Buffer / Level Shifter Module (x=505..625, y=310..495) -->
  <rect x="505" y="310" width="120" height="185" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="565" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Буфер рівнів</text>
  <text x="565" y="344" text-anchor="middle" font-size="12" fill="#6b7280">74LVC1T45</text>

  <text x="565" y="410" text-anchor="middle" font-size="12" fill="#1a1a1a">Узгодження</text>
  <text x="565" y="428" text-anchor="middle" font-size="12" fill="#27ae60">1.8V – 5.0V</text>
  <text x="565" y="468" text-anchor="middle" font-size="12" fill="#6b7280">Двонаправлений</text>

  <!-- Lines from Buffer to Target Header -->
  <line x1="625" y1="325" x2="705" y2="325" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="625" y1="365" x2="705" y2="365" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="625" y1="405" x2="705" y2="405" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="625" y1="445" x2="705" y2="445" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <line x1="625" y1="485" x2="705" y2="485" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>

  <!-- Panel 5: Target Debug Connector -->
  <rect x="690" y="78" width="245" height="427" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="812" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Роз'єм Cortex Debug</text>
  <text x="812" y="116" text-anchor="middle" font-size="12" fill="#6b7280">(10-pin / 20-pin Connector)</text>

  <rect x="705" y="133" width="215" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="812" y="149" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">VCC_TARGET (3.3V / 5V)</text>

  <rect x="705" y="208" width="215" height="24" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
  <text x="812" y="224" text-anchor="middle" font-size="12" fill="#1a1a1a">GND (Спільний мінус)</text>

  <rect x="705" y="313" width="215" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="812" y="329" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">SWCLK (Тактування)</text>

  <rect x="705" y="353" width="215" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="812" y="369" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">SWDIO (Дані SWD)</text>

  <rect x="705" y="393" width="215" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="812" y="409" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">nRESET (Скидання)</text>

  <rect x="705" y="433" width="215" height="24" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="812" y="449" text-anchor="middle" font-size="12" fill="#1a1a1a">UART_TX (Вихід TX)</text>

  <rect x="705" y="473" width="215" height="24" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="812" y="489" text-anchor="middle" font-size="12" fill="#1a1a1a">UART_RX (Вхід RX)</text>
</svg>
