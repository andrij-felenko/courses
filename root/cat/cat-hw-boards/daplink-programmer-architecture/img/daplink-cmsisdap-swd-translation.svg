<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Header -->
  <text x="480" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Трансляція пакетів CMSIS-DAP у фізичні сигнали протоколу SWD</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Драйвер DAPLink декодує байт-команди з RAM-буфера та генерує імпульси SWCLK і дані SWDIO</text>

  <!-- Markers -->
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Section 1: USB RAM Buffer & Decoder -->
  <rect x="40" y="80" width="880" height="90" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="60" y="102" font-size="13" font-weight="bold" fill="#1a1a1a">1. Прийом пакета CMSIS-DAP у буфер RAM (USB HID / Bulk Report)</text>

  <!-- RAM Buffer Bytes -->
  <rect x="60" y="115" width="105" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="112" y="132" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">CMD: 0x05</text>
  <text x="112" y="147" text-anchor="middle" font-size="10" fill="#6b7280">(DAP_Transfer)</text>

  <rect x="175" y="115" width="100" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="225" y="132" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">DAP_Index: 0</text>
  <text x="225" y="147" text-anchor="middle" font-size="10" fill="#6b7280">(SWD Port 0)</text>

  <rect x="285" y="115" width="115" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="342" y="132" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Transfer_Cnt: 1</text>
  <text x="342" y="147" text-anchor="middle" font-size="10" fill="#6b7280">(1 операція)</text>

  <rect x="410" y="115" width="130" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="475" y="132" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Request: 0x02</text>
  <text x="475" y="147" text-anchor="middle" font-size="10" fill="#6b7280">(Read DP IDCODE)</text>

  <!-- Arrow from RAM Buffer to Engine -->
  <line x1="550" y1="136" x2="595" y2="136" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- SWD Engine Decoder Box -->
  <rect x="605" y="115" width="295" height="42" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="752" y="132" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">DAPLink SWD Engine (FSM)</text>
  <text x="752" y="147" text-anchor="middle" font-size="10" fill="#6b7280">Формування бітової послідовності SWD</text>

  <!-- Section 2: SWD Physical Oscillogram -->
  <rect x="40" y="185" width="880" height="245" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="60" y="207" font-size="13" font-weight="bold" fill="#1a1a1a">2. Фізичні сигнали шини SWD (Serial Wire Debug Sequence)</text>

  <!-- Phase Banners -->
  <rect x="160" y="218" width="320" height="18" fill="#eaf0fd" rx="3"/>
  <text x="320" y="231" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Запит Host → Target (8 бітів)</text>

  <rect x="480" y="218" width="40" height="18" fill="#f4f6f8" stroke="#d0d7de" rx="3"/>
  <text x="500" y="231" text-anchor="middle" font-size="10" font-weight="bold" fill="#6b7280">Trn</text>

  <rect x="520" y="218" width="120" height="18" fill="#e9f7ef" rx="3"/>
  <text x="580" y="231" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">ACK = OK (3 біти)</text>

  <rect x="640" y="218" width="240" height="18" fill="#e9f7ef" rx="3"/>
  <text x="760" y="231" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Дані Target → Host (32 біти Data + Parity)</text>

  <!-- Signal Y-Labels -->
  <text x="150" y="258" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">SWCLK (Clock)</text>
  <text x="150" y="348" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">SWDIO (Data)</text>
  <text x="150" y="333" text-anchor="end" font-size="10" fill="#6b7280">3.3 В (1)</text>
  <text x="150" y="383" text-anchor="end" font-size="10" fill="#6b7280">0.0 В (0)</text>

  <!-- Reference Voltage Lines -->
  <line x1="160" y1="330" x2="880" y2="330" stroke="#d0d7de" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="160" y1="380" x2="880" y2="380" stroke="#d0d7de" opacity="0.5"/>

  <!-- SWCLK Trace (Square wave) -->
  <path d="M 160,270 L 170,270 L 170,245 L 190,245 L 190,270 L 210,270 L 210,245 L 230,245 L 230,270 L 250,270 L 250,245 L 270,245 L 270,270 L 290,270 L 290,245 L 310,245 L 310,270 L 330,270 L 330,245 L 350,245 L 350,270 L 370,270 L 370,245 L 390,245 L 390,270 L 410,270 L 410,245 L 430,245 L 430,270 L 450,270 L 450,245 L 470,245 L 470,270 L 490,270 L 490,245 L 510,245 L 510,270 L 530,270 L 530,245 L 550,245 L 550,270 L 570,270 L 570,245 L 590,245 L 590,270 L 610,270 L 610,245 L 630,245 L 630,270 L 650,270 L 650,245 L 670,245 L 670,270 L 690,270 L 690,245 L 710,245 L 710,270 L 730,270 L 730,245 L 750,245 L 750,270 L 770,270 L 770,245 L 790,245 L 790,270 L 810,270 L 810,245 L 830,245 L 830,270 L 850,270 L 850,245 L 870,245 L 870,270 L 880,270" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- SWDIO Header Trace (Driven by Host) -->
  <path d="M 160,330 L 200,330 L 200,380 L 240,380 L 240,330 L 280,330 L 280,380 L 360,380 L 360,330 L 400,330 L 400,380 L 440,380 L 440,330 L 480,330" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- SWDIO Turnaround (Float Z) -->
  <path d="M 480,330 L 485,355 L 515,355 L 520,330" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- SWDIO ACK Trace (Driven by Target) -->
  <path d="M 520,330 L 560,330 L 560,380 L 640,380" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- SWDIO Data Payload Trace (Driven by Target) -->
  <path d="M 640,380 L 660,380 L 660,330 L 700,330 L 700,380 L 730,380 L 730,330 L 780,330 L 780,380 L 810,380 L 810,330 L 850,330 L 850,380 L 880,380" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Bit Value Labels below SWDIO Trace -->
  <text x="180" y="402" text-anchor="middle" font-size="10" font-weight="bold" fill="#2457d6">S:1</text>
  <text x="220" y="402" text-anchor="middle" font-size="10" fill="#2457d6">AP:0</text>
  <text x="260" y="402" text-anchor="middle" font-size="10" fill="#2457d6">RW:1</text>
  <text x="300" y="402" text-anchor="middle" font-size="10" fill="#2457d6">A2:0</text>
  <text x="340" y="402" text-anchor="middle" font-size="10" fill="#2457d6">A3:0</text>
  <text x="380" y="402" text-anchor="middle" font-size="10" fill="#2457d6">Par:1</text>
  <text x="420" y="402" text-anchor="middle" font-size="10" fill="#2457d6">Stp:0</text>
  <text x="460" y="402" text-anchor="middle" font-size="10" fill="#2457d6">Prk:1</text>

  <text x="540" y="402" text-anchor="middle" font-size="10" font-weight="bold" fill="#27ae60">ACK:1</text>
  <text x="580" y="402" text-anchor="middle" font-size="10" fill="#27ae60">ACK:0</text>
  <text x="620" y="402" text-anchor="middle" font-size="10" fill="#27ae60">ACK:0</text>
  <text x="760" y="402" text-anchor="middle" font-size="10" font-weight="bold" fill="#27ae60">Data Payload [0..31] + Parity</text>

  <!-- Section 3: Summary Cards -->
  <!-- Card 1: RAM Translation -->
  <rect x="40" y="445" width="430" height="75" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="60" y="465" font-size="13" font-weight="bold" fill="#2457d6">Трансляція в пам'яті RAM</text>
  <text x="60" y="483" font-size="12" fill="#1a1a1a">Пакет команд USB розбирається програмним движком DAPLink.</text>
  <text x="60" y="501" font-size="11" fill="#6b7280">Кожен байт транслюється в послідовність імпульсів SWCLK.</text>

  <!-- Card 2: Bi-directional SWDIO -->
  <rect x="490" y="445" width="430" height="75" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="510" y="465" font-size="13" font-weight="bold" fill="#27ae60">Двонаправлений протокол SWDIO</text>
  <text x="510" y="483" font-size="12" fill="#1a1a1a">Лінія SWDIO змінює напрямок у фазі Turnaround (Trn).</text>
  <text x="510" y="501" font-size="11" fill="#6b7280">Цільовий чип повертає ACK=OK та передає значення даних.</text>
</svg>
