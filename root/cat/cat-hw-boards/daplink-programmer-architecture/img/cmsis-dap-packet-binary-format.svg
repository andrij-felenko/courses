<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Бінарний формат пакетів запиту та відповіді команди DAP_Transfer</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Структура байтів у кадрі CMSIS-DAP для передачі операцій читання/запису регістрів DP та AP архітектури CoreSight</text>

  <!-- ==================== PANEL 1: REQUEST PACKET ==================== -->
  <rect x="40" y="85" width="880" height="165" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Request Header Badge -->
  <rect x="55" y="98" width="850" height="28" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="117" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Запит розробника (DAP_Transfer Request: Host → DAPLink)</text>

  <!-- Byte 0: Command ID -->
  <rect x="55" y="135" width="150" height="55" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="130" y="153" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Байт 0: Command ID</text>
  <text x="130" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">0x05 (DAP_Transfer)</text>

  <!-- Byte 1: DAP Index -->
  <rect x="215" y="135" width="140" height="55" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="285" y="153" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Байт 1: DAP Index</text>
  <text x="285" y="173" text-anchor="middle" font-size="12" fill="#6b7280">Індекс цілі (0x00)</text>

  <!-- Byte 2: Transfer Count -->
  <rect x="365" y="135" width="160" height="55" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="445" y="153" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Байт 2: Transfer Count</text>
  <text x="445" y="173" text-anchor="middle" font-size="12" fill="#6b7280">Кількість транзакцій (N)</text>

  <!-- Bytes 3..M: Request Payload -->
  <rect x="535" y="135" width="370" height="55" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="720" y="153" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Байти 3..M: Опис транзакцій та дані</text>
  <text x="720" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">[Request Bitmask] + [Write Data 32-bit]</text>

  <!-- Request Bitmask Details Note -->
  <text x="480" y="222" text-anchor="middle" font-size="12" fill="#1a1a1a">Request Bitmask (1 байт): [0] APnDP (0=DP, 1=AP) | [1] RnW (0=Write, 1=Read) | [2:3] Register Address A[2:3]</text>


  <!-- ==================== PANEL 2: RESPONSE PACKET ==================== -->
  <rect x="40" y="265" width="880" height="170" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Response Header Badge -->
  <rect x="55" y="278" width="850" height="28" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="480" y="297" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Відповідь програматора (DAP_Transfer Response: DAPLink → Host)</text>

  <!-- Byte 0: Command ID -->
  <rect x="55" y="315" width="150" height="55" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="130" y="333" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Байт 0: Command ID</text>
  <text x="130" y="353" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">0x05 (DAP_Transfer)</text>

  <!-- Byte 1: Executed Transfer Count -->
  <rect x="215" y="315" width="170" height="55" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="300" y="333" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Байт 1: Transfer Count</text>
  <text x="300" y="353" text-anchor="middle" font-size="12" fill="#6b7280">Успішно виконано (N)</text>

  <!-- Byte 2: ACK Status -->
  <rect x="395" y="315" width="200" height="55" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="495" y="333" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Байт 2: ACK Response</text>
  <text x="495" y="353" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">[0:2] OK=1, WAIT=2, FAULT=4</text>

  <!-- Bytes 3..K: Read Data Payload -->
  <rect x="605" y="315" width="300" height="55" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="755" y="333" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Байти 3..K: Прочитані дані</text>
  <text x="755" y="353" text-anchor="middle" font-size="12" fill="#6b7280">[Read Data 0] ... [Read Data N-1]</text>

  <!-- Response Details Notes -->
  <text x="480" y="398" text-anchor="middle" font-size="12" fill="#1a1a1a">Статус ACK: 0x01 (OK — успішно) | 0x02 (WAIT — шина зайнята) | 0x04 (FAULT — помилка доступу до AP/DP)</text>
  <text x="480" y="418" text-anchor="middle" font-size="12" fill="#6b7280">Прочитані дані (32 біти на транзакцію LSB first) додаються лише для операцій читання (RnW = 1)</text>
</svg>
