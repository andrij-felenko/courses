<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Діагностика перехресного замикання F-DI тестовими імпульсами</text>
  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Зсув тестових імпульсів трьох каналів дозволяє виявити витік струму та коротке замикання</text>

  <!-- ЛІВА ПАНЕЛЬ: Схема каналів та перехресне замикання -->
  <rect x="40" y="70" width="430" height="460" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="60" y="95" font-size="14" font-weight="bold" fill="#1a1a1a">Схема каналів F-DI з тестовими джерелами</text>

  <!-- Вихід VS1 -->
  <rect x="60" y="125" width="130" height="45" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="125" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Вихід VS1</text>
  <text x="125" y="162" text-anchor="middle" font-size="11" fill="#6b7280">Тест-імпульс T1</text>

  <!-- Вихід VS2 -->
  <rect x="60" y="245" width="130" height="45" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="125" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Вихід VS2</text>
  <text x="125" y="282" text-anchor="middle" font-size="11" fill="#6b7280">Тест-імпульс T2</text>

  <!-- Вихід VS3 -->
  <rect x="60" y="365" width="130" height="45" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="125" y="385" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Вихід VS3</text>
  <text x="125" y="402" text-anchor="middle" font-size="11" fill="#6b7280">Тест-імпульс T3</text>

  <!-- Вхід DI1 -->
  <rect x="320" y="125" width="130" height="45" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="385" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Вхід DI1 (Канал 1)</text>

  <!-- Вхід DI2 (Зони збою) -->
  <rect x="320" y="245" width="130" height="45" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="385" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Вхід DI2 (Канал 2)</text>
  <text x="385" y="282" text-anchor="middle" font-size="11" fill="#c0392b">Помилка замикання!</text>

  <!-- Вхід DI3 -->
  <rect x="320" y="365" width="130" height="45" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="385" y="392" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Вхід DI3 (Канал 3)</text>

  <!-- Лінії зв'язку між виходами та входами -->
  <line x1="190" y1="147" x2="320" y2="147" stroke="#2457d6" stroke-width="2"/>
  <line x1="190" y1="267" x2="320" y2="267" stroke="#27ae60" stroke-width="2"/>
  <line x1="190" y1="387" x2="320" y2="387" stroke="#2457d6" stroke-width="2"/>

  <!-- Перехресне замикання (пунктирна червона лінія аварії) -->
  <line x1="250" y1="147" x2="250" y2="267" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="250" cy="147" r="4" fill="#c0392b"/>
  <circle cx="250" cy="267" r="4" fill="#c0392b"/>
  <text x="255" y="210" font-size="11" font-weight="bold" fill="#c0392b">Коротке замикання</text>

  <!-- Блок пояснення на лівій панелі -->
  <rect x="60" y="445" width="390" height="65" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="75" y="468" font-size="12" font-weight="bold" fill="#1a1a1a">Принцип виявлення:</text>
  <text x="75" y="492" font-size="12" fill="#6b7280">Імпульс T1 виточує у Канал 2 в момент провалу T2</text>

  <!-- ПРАВА ПАНЕЛЬ: Осцилограма часових діаграм -->
  <rect x="490" y="70" width="430" height="460" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="510" y="95" font-size="14" font-weight="bold" fill="#1a1a1a">Осцилограма виходів VS1..VS3 та входу DI2</text>

  <!-- Сигнальні осі та сітка -->
  <line x1="560" y1="125" x2="560" y2="410" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="560" y1="410" x2="890" y2="410" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="895" y="414" font-size="11" fill="#6b7280">t</text>

  <!-- Вертикальні пунктири часових інтервалів T1, T2, T3 -->
  <line x1="650" y1="125" x2="650" y2="410" stroke="#d0d7de" stroke-dasharray="2,2"/>
  <line x1="690" y1="125" x2="690" y2="410" stroke="#d0d7de" stroke-dasharray="2,2"/>

  <line x1="730" y1="125" x2="730" y2="410" stroke="#d0d7de" stroke-dasharray="2,2"/>
  <line x1="770" y1="125" x2="770" y2="410" stroke="#d0d7de" stroke-dasharray="2,2"/>

  <line x1="810" y1="125" x2="810" y2="410" stroke="#d0d7de" stroke-dasharray="2,2"/>
  <line x1="850" y1="125" x2="850" y2="410" stroke="#d0d7de" stroke-dasharray="2,2"/>

  <!-- СИГНАЛ 1: VS1 (Тестовий вихід 1) -->
  <text x="505" y="165" font-size="12" font-weight="bold" fill="#2457d6">VS1</text>
  <polyline points="560,150 650,150 650,180 690,180 690,150 890,150" fill="none" stroke="#2457d6" stroke-width="2"/>
  <text x="670" y="140" text-anchor="middle" font-size="11" fill="#2457d6">Тест T1</text>

  <!-- СИГНАЛ 2: VS2 (Тестовий вихід 2) -->
  <text x="505" y="235" font-size="12" font-weight="bold" fill="#27ae60">VS2</text>
  <polyline points="560,220 730,220 730,250 770,250 770,220 890,220" fill="none" stroke="#27ae60" stroke-width="2"/>
  <text x="750" y="210" text-anchor="middle" font-size="11" fill="#27ae60">Тест T2</text>

  <!-- СИГНАЛ 3: VS3 (Тестовий вихід 3) -->
  <text x="505" y="305" font-size="12" font-weight="bold" fill="#2457d6">VS3</text>
  <polyline points="560,290 810,290 810,320 850,320 850,290 890,290" fill="none" stroke="#2457d6" stroke-width="2"/>
  <text x="830" y="280" text-anchor="middle" font-size="11" fill="#2457d6">Тест T3</text>

  <!-- СИГНАЛ 4: DI2 (Виміряний сигнал з КЗ від VS1) -->
  <text x="505" y="375" font-size="12" font-weight="bold" fill="#c0392b">DI2</text>
  
  <!-- Пляма підсвічування небезпечної зони відсутності провалу на T2 -->
  <rect x="730" y="355" width="40" height="40" fill="#fdecea" stroke="#c0392b" stroke-dasharray="3,3"/>
  
  <!-- Крива DI2 з короткою підтяжкою до VS1 -->
  <polyline points="560,360 650,360 650,390 690,390 690,360 890,360" fill="none" stroke="#c0392b" stroke-width="2"/>
  
  <!-- Підписи аномалій на сигналу DI2 -->
  <text x="670" y="420" text-anchor="middle" font-size="11" fill="#c0392b">Хибний провал T1</text>
  <text x="770" y="420" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Провал T2 відсутній!</text>

  <!-- Блок підсумку на правій панелі -->
  <rect x="510" y="445" width="390" height="65" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="525" y="468" font-size="12" font-weight="bold" fill="#c0392b">Реакція модуля безпеки F-DI:</text>
  <text x="525" y="492" font-size="12" fill="#1a1a1a">Виявлено КЗ -&gt; Аварійне знеструмлення (Fail-Safe)</text>
</svg>
