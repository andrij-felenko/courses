<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Автомат станів контролю часу розбіжності (Discrepancy Time) та пасивації F-DI</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">При асинхронності сигналів CH1/CH2 запускається таймер; перевищення t_disc переводить канал у стан пасивації</text>

  <!-- Top Synchronization Loop Line (Node 2 -> Node 1) -->
  <path d="M 480 135 L 480 88 L 165 88 L 165 125" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="322" y="78" text-anchor="middle" font-size="12" fill="#27ae60">Синхронізація (t ≤ t_disc) → Скидання t = 0</text>

  <!-- Node 1: Normal State -->
  <rect x="50" y="135" width="230" height="115" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="165" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">1. Нормальний стан</text>
  <text x="165" y="181" text-anchor="middle" font-size="12" fill="#6b7280">Канали: CH1 == CH2</text>
  <text x="165" y="201" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Статус: OK (Активний)</text>
  <text x="165" y="221" text-anchor="middle" font-size="12" fill="#6b7280">Таймер розбіжності: t = 0</text>

  <!-- Arrow 1 -> 2 (Discrepancy signal) -->
  <path d="M 280 192.5 L 355 192.5" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="322.5" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">CH1 ≠ CH2</text>

  <!-- Node 2: Discrepancy Monitoring -->
  <rect x="365" y="135" width="230" height="115" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="480" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">2. Контроль розбіжності</text>
  <text x="480" y="181" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Розбіжність: CH1 ≠ CH2</text>
  <text x="480" y="201" text-anchor="middle" font-size="12" fill="#1a1a1a">Таймер відліку: t ≤ t_disc</text>
  <text x="480" y="221" text-anchor="middle" font-size="12" fill="#6b7280">Очікування синхронізації</text>

  <!-- Arrow 2 -> 3 (Timeout) -->
  <path d="M 595 192.5 L 670 192.5" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="637.5" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">t &gt; t_disc</text>

  <!-- Node 3: Passivation State -->
  <rect x="680" y="135" width="230" height="115" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="795" y="160" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">3. Стан пасивації</text>
  <text x="795" y="181" text-anchor="middle" font-size="12" fill="#1a1a1a">Таймаут: t &gt; t_disc</text>
  <text x="795" y="201" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Вихід = 0 V (Safe State)</text>
  <text x="795" y="221" text-anchor="middle" font-size="12" fill="#6b7280">Прапор пасивації = 1</text>

  <!-- Arrow 3 -> 4 (Fault repair) -->
  <path d="M 795 250 L 795 372.5 L 648 372.5" fill="none" stroke="#6b7280" stroke-width="2" marker-end="url(#arr-gray)"/>
  <text x="808" y="305" text-anchor="start" font-size="12" fill="#6b7280">Усунення збою</text>

  <!-- Node 4: Reintegration & Reset -->
  <rect x="320" y="315" width="320" height="115" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="480" y="340" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">4. Відновлення та квитування</text>
  <text x="480" y="361" text-anchor="middle" font-size="12" fill="#6b7280">1. Усунення апаратної несправності</text>
  <text x="480" y="381" text-anchor="middle" font-size="12" fill="#6b7280">2. Повернення сигналів CH1 == CH2</text>
  <text x="480" y="401" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">3. Команда Reintegration (Safety PLC)</text>

  <!-- Arrow 4 -> 1 (Reset passivation) -->
  <path d="M 320 372.5 L 165 372.5 L 165 258" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="242" y="360" text-anchor="middle" font-size="12" fill="#27ae60">Скидання пасивації</text>

  <!-- Bottom Information Panel -->
  <rect x="50" y="465" width="860" height="70" rx="6" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="70" y="490" font-size="13" font-weight="bold" fill="#1a1a1a">Ключові поняття диференціальної діагностики F-DI:</text>
  <text x="70" y="514" font-size="12" fill="#6b7280">• Discrepancy Time (t_disc): часове вікно допускання асинхронності контактів (10…500 ms).</text>
  <text x="70" y="529" font-size="12" fill="#6b7280">• Passivation: примусове переведення сигналу каналу у безпечний стан 0 V при розбіжності.</text>
</svg>
