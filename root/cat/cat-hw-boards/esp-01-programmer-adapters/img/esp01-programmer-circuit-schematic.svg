<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схемотехніка адаптера програматора ESP-01 / ESP-01S</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Організація LDO-живлення 3.3V, дільника напруги RX (5V→3.3V) та підтяжок виводів завантаження</text>

  <!-- Global Power Rails -->
  <!-- Top +3.3V Rail -->
  <line x1="260" y1="120" x2="910" y2="120" stroke="#27ae60" stroke-width="2.5"/>
  <text x="275" y="113" font-size="12" font-weight="bold" fill="#27ae60">+3.3V Rail</text>

  <!-- Bottom GND Rail -->
  <line x1="40" y1="508" x2="925" y2="508" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="50" y="500" font-size="12" font-weight="bold" fill="#1a1a1a">GND Rail</text>

  <!-- ==================== PANEL 1: POWER SUPPLY (LDO 3.3V) ==================== -->
  <rect x="30" y="70" width="270" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="165" y="93" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">1. LDO-живлення 3.3V</text>

  <!-- USB 5V Header -->
  <rect x="45" y="140" width="60" height="50" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="75" y="166" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">USB 5V</text>
  <circle cx="105" cy="165" r="3.5" fill="#c0392b"/>

  <!-- 5V Wire -->
  <line x1="105" y1="165" x2="155" y2="165" stroke="#c0392b" stroke-width="2"/>
  <text x="130" y="153" font-size="12" fill="#c0392b" text-anchor="middle">VBUS 5V</text>

  <!-- Input Capacitor C1 (10uF) -->
  <line x1="125" y1="165" x2="125" y2="212" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="115" y1="212" x2="135" y2="212" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="115" y1="218" x2="135" y2="218" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="125" y1="218" x2="125" y2="275" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="110" y="218" font-size="12" fill="#6b7280" text-anchor="end">C1 10µF</text>

  <!-- LDO AMS1117-3.3 -->
  <rect x="155" y="140" width="75" height="80" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="192.5" y="163" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">AMS1117</text>
  <text x="192.5" y="179" font-size="12" fill="#6b7280" text-anchor="middle">3.3V</text>
  <text x="160" y="198" font-size="12" fill="#6b7280" text-anchor="start">IN</text>
  <text x="225" y="198" font-size="12" fill="#6b7280" text-anchor="end">OUT</text>
  <text x="192.5" y="214" font-size="12" fill="#6b7280" text-anchor="middle">GND</text>

  <!-- LDO GND Line -->
  <line x1="192.5" y1="220" x2="192.5" y2="275" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- LDO Output 3.3V Wire -->
  <line x1="230" y1="165" x2="260" y2="165" stroke="#27ae60" stroke-width="2"/>
  <line x1="260" y1="165" x2="260" y2="120" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <circle cx="260" cy="165" r="3.5" fill="#27ae60"/>

  <!-- Output Capacitor C2 (10uF) -->
  <line x1="260" y1="165" x2="260" y2="212" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="250" y1="212" x2="270" y2="212" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="250" y1="218" x2="270" y2="218" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="260" y1="218" x2="260" y2="275" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="255" y="198" font-size="12" fill="#6b7280" text-anchor="end">C2 10µF</text>

  <!-- Panel 1 GND Line & Ground Symbol -->
  <line x1="125" y1="275" x2="260" y2="275" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="192.5" y1="275" x2="192.5" y2="284" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="180" y1="284" x2="205" y2="284" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="186" y1="289" x2="199" y2="289" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="191" y1="294" x2="194" y2="294" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="192.5" y="310" font-size="12" fill="#6b7280" text-anchor="middle">GND</text>

  <!-- Panel 1 Callout Box -->
  <rect x="42" y="325" width="246" height="155" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-dasharray="4,4"/>
  <text x="165" y="345" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вимоги до живлення:</text>
  <text x="52" y="367" font-size="12" fill="#1a1a1a">• ESP8266 споживає до 300 mA</text>
  <text x="52" y="387" font-size="12" fill="#1a1a1a">  під час піків Wi-Fi TX.</text>
  <text x="52" y="410" font-size="12" fill="#1a1a1a">• Вбудований LDO CH340</text>
  <text x="52" y="430" font-size="12" fill="#1a1a1a">  видає лише ~25-50 mA.</text>
  <text x="52" y="457" font-size="12" font-weight="bold" fill="#27ae60">✓ Потрібен окремий LDO 3.3V</text>

  <!-- ==================== PANEL 2: UART LEVEL SHIFTER ==================== -->
  <rect x="315" y="70" width="310" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="470" y="93" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">2. Дільник рівнів UART</text>

  <!-- USB-UART Interface Header -->
  <rect x="330" y="140" width="80" height="130" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="370" y="162" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">USB-UART</text>
  <text x="370" y="178" font-size="12" fill="#6b7280" text-anchor="middle">(5V TTL)</text>
  <text x="395" y="209" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">TXD</text>
  <text x="395" y="254" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">RXD</text>
  <circle cx="405" cy="205" r="3.5" fill="#c0392b"/>
  <circle cx="405" cy="250" r="3.5" fill="#27ae60"/>

  <!-- TXD 5V -> Level Divider Wire -->
  <line x1="405" y1="205" x2="430" y2="205" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Resistor R1 (1k) -->
  <rect x="430" y="198" width="45" height="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="452.5" y="191" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">R1 1kΩ</text>

  <!-- Wire from R1 to Node A -->
  <line x1="475" y1="205" x2="515" y2="205" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="515" cy="205" r="3.5" fill="#1a1a1a"/>
  <text x="515" y="191" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">= 3.33V</text>

  <!-- Wire from Node A to ESP-01 RXD -->
  <line x1="515" y1="205" x2="640" y2="205" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Resistor R2 (2k) down to GND -->
  <line x1="515" y1="205" x2="515" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="506" y="225" width="18" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="533" y="252" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">R2 2kΩ</text>
  <line x1="515" y1="265" x2="515" y2="300" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Ground Symbol for Panel 2 -->
  <line x1="502" y1="300" x2="528" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="507" y1="305" x2="523" y2="305" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="512" y1="310" x2="518" y2="310" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="515" y="325" font-size="12" fill="#6b7280" text-anchor="middle">GND</text>

  <!-- TXD Direct Connection (ESP TX -> USB RX) -->
  <line x1="640" y1="250" x2="405" y2="250" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="470" y="272" font-size="12" fill="#27ae60" text-anchor="middle">Пряме підключення (3.3V &gt; 2.0V TTL HIGH)</text>

  <!-- Panel 2 Formula Box -->
  <rect x="330" y="330" width="280" height="155" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-dasharray="4,4"/>
  <text x="470" y="352" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Розрахунок дільника напруги:</text>
  <text x="470" y="376" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">V_OUT = V_IN × R2 / (R1 + R2)</text>
  <text x="470" y="398" font-size="12" fill="#1a1a1a" text-anchor="middle">V_OUT = 5В × 2kΩ / (1kΩ + 2kΩ)</text>
  <text x="470" y="422" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">V_OUT = 3.33В</text>
  <text x="470" y="448" font-size="12" fill="#c0392b" text-anchor="middle">(Без дільника 5V пошкоджує вхід ESP8266!)</text>

  <!-- ==================== PANEL 3: ESP-01 PINS & BOOT ==================== -->
  <rect x="640" y="70" width="295" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="787.5" y="93" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">3. Розводка ESP-01 та Boot</text>

  <!-- ESP-01 Header Module Box -->
  <rect x="815" y="140" width="110" height="270" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="870" y="162" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ESP-01 / ESP-01S</text>
  <text x="870" y="178" font-size="12" fill="#6b7280" text-anchor="middle">(Роз'єм 2x4)</text>

  <!-- Pin 1: VCC -->
  <circle cx="815" cy="200" r="3.5" fill="#27ae60"/>
  <text x="823" y="204" font-size="12" font-weight="bold" fill="#27ae60">VCC</text>
  <line x1="815" y1="200" x2="802" y2="200" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="802" y1="200" x2="802" y2="120" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Pin 2: CH_PD -->
  <circle cx="815" cy="230" r="3.5" fill="#1a1a1a"/>
  <text x="823" y="234" font-size="12" fill="#1a1a1a">CH_PD</text>
  <line x1="815" y1="230" x2="750" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- R3 Pull-up 10k -->
  <rect x="741" y="150" width="18" height="35" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="750" y1="120" x2="750" y2="150" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="750" y1="185" x2="750" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="762" y="163" font-size="12" fill="#6b7280">R3</text>
  <text x="762" y="177" font-size="12" fill="#6b7280">10k</text>

  <!-- Pin 3: RST -->
  <circle cx="815" cy="260" r="3.5" fill="#1a1a1a"/>
  <text x="823" y="264" font-size="12" fill="#1a1a1a">RST</text>
  <line x1="815" y1="260" x2="715" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- R4 Pull-up 10k -->
  <rect x="706" y="150" width="18" height="35" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="715" y1="120" x2="715" y2="150" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="715" y1="185" x2="715" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="727" y="163" font-size="12" fill="#6b7280">R4</text>
  <text x="727" y="177" font-size="12" fill="#6b7280">10k</text>
  <!-- SW1 Reset Button -->
  <line x1="715" y1="260" x2="715" y2="375" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="705" y1="380" x2="725" y2="375" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="715" y1="380" x2="715" y2="415" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="700" y="372" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">SW1</text>
  <text x="700" y="386" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">RST</text>

  <!-- Pin 4: GPIO0 -->
  <circle cx="815" cy="290" r="3.5" fill="#c0392b"/>
  <text x="823" y="294" font-size="12" font-weight="bold" fill="#c0392b">GPIO0</text>
  <line x1="815" y1="290" x2="675" y2="290" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- R5 Pull-up 10k -->
  <rect x="666" y="150" width="18" height="35" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="675" y1="120" x2="675" y2="150" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="675" y1="185" x2="675" y2="290" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="687" y="163" font-size="12" fill="#6b7280">R5</text>
  <text x="687" y="177" font-size="12" fill="#6b7280">10k</text>
  <!-- SW2 Flash Button -->
  <line x1="675" y1="290" x2="675" y2="375" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="665" y1="380" x2="685" y2="375" stroke="#c0392b" stroke-width="2"/>
  <line x1="675" y1="380" x2="675" y2="415" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="660" y="372" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">SW2</text>
  <text x="660" y="386" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">PROG</text>

  <!-- SW1 & SW2 Ground Connection -->
  <line x1="675" y1="415" x2="715" y2="415" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="695" y1="415" x2="695" y2="508" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Pin 5: GPIO2 -->
  <circle cx="815" cy="320" r="3.5" fill="#1a1a1a"/>
  <text x="823" y="324" font-size="12" fill="#1a1a1a">GPIO2</text>
  <line x1="815" y1="320" x2="785" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- R6 Pull-up 10k -->
  <rect x="776" y="150" width="18" height="35" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="785" y1="120" x2="785" y2="150" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="785" y1="185" x2="785" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="797" y="163" font-size="12" fill="#6b7280">R6</text>
  <text x="797" y="177" font-size="12" fill="#6b7280">10k</text>

  <!-- Pin 6: RXD -->
  <circle cx="815" cy="350" r="3.5" fill="#27ae60"/>
  <text x="823" y="354" font-size="12" fill="#1a1a1a">RXD</text>

  <!-- Pin 7: TXD -->
  <circle cx="815" cy="376" r="3.5" fill="#27ae60"/>
  <text x="823" y="380" font-size="12" fill="#1a1a1a">TXD</text>

  <!-- Pin 8: GND -->
  <circle cx="815" cy="396" r="3.5" fill="#6b7280"/>
  <text x="823" y="400" font-size="12" fill="#6b7280">GND</text>
  <line x1="815" y1="396" x2="800" y2="396" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="800" y1="396" x2="800" y2="508" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Boot Mode Summary Table in Panel 3 -->
  <rect x="655" y="425" width="270" height="60" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="790" y="442" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Режими завантаження (Boot):</text>
  <text x="665" y="460" font-size="12" font-weight="bold" fill="#c0392b">PROG (Flash): GPIO0 = 0 (SW2 ON)</text>
  <text x="665" y="476" font-size="12" font-weight="bold" fill="#27ae60">RUN (Робота): GPIO0 = 1 (SW2 OFF)</text>
</svg>
