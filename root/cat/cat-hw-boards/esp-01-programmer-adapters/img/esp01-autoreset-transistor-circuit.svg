<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Definitions for Markers -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Двотранзисторний вузол автоскидання ESP-01</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Принципова схема керування DTR/RTS та часові діаграми сигналів RST і GPIO0</text>

  <!-- Panel 1: Schematic Diagram -->
  <rect x="30" y="80" width="445" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="252.5" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Принципова схема автоскидання</text>

  <!-- 3.3V Power Rail Top -->
  <line x1="360" y1="125" x2="445" y2="125" stroke="#c0392b" stroke-width="2"/>
  <text x="352" y="129" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">+3.3V</text>

  <!-- Pullup Resistor R3 (RST) -->
  <line x1="390" y1="125" x2="390" y2="140" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="365" y="140" width="50" height="22" rx="3" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="390" y="155" text-anchor="middle" font-size="12" fill="#1a1a1a">R3 10k</text>
  <line x1="390" y1="162" x2="390" y2="190" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Pullup Resistor R4 (GPIO0) -->
  <line x1="440" y1="125" x2="440" y2="300" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="415" y="300" width="50" height="22" rx="3" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="440" y="315" text-anchor="middle" font-size="12" fill="#1a1a1a">R4 10k</text>
  <line x1="440" y1="322" x2="440" y2="360" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Inputs: DTR & RTS -->
  <rect x="45" y="165" width="65" height="50" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="77.5" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">DTR</text>
  <text x="77.5" y="205" text-anchor="middle" font-size="12" fill="#6b7280">Вхід 1</text>

  <rect x="45" y="335" width="65" height="50" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="77.5" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">RTS</text>
  <text x="77.5" y="375" text-anchor="middle" font-size="12" fill="#6b7280">Вхід 2</text>

  <!-- Base Resistors R1 & R2 -->
  <rect x="135" y="179" width="50" height="22" rx="3" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="160" y="194" text-anchor="middle" font-size="12" fill="#1a1a1a">R1 10k</text>

  <rect x="135" y="349" width="50" height="22" rx="3" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="160" y="364" text-anchor="middle" font-size="12" fill="#1a1a1a">R2 10k</text>

  <!-- Transistors Q1 & Q2 -->
  <rect x="215" y="160" width="110" height="60" rx="6" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="270" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Q1 (NPN)</text>
  <text x="270" y="206" text-anchor="middle" font-size="12" fill="#6b7280">S8050 / BSS138</text>

  <rect x="215" y="330" width="110" height="60" rx="6" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="270" y="355" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Q2 (NPN)</text>
  <text x="270" y="376" text-anchor="middle" font-size="12" fill="#6b7280">S8050 / BSS138</text>

  <!-- Outputs: RST & GPIO0 -->
  <rect x="350" y="170" width="110" height="40" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="405" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">RST (ESP-01)</text>

  <rect x="350" y="340" width="110" height="40" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="405" y="365" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">GPIO0 (ESP-01)</text>

  <!-- Wires for Schematic -->
  <line x1="110" y1="190" x2="135" y2="190" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="185" y1="190" x2="215" y2="190" stroke="#1a1a1a" stroke-width="1.5"/>

  <line x1="110" y1="360" x2="135" y2="360" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="185" y1="360" x2="215" y2="360" stroke="#1a1a1a" stroke-width="1.5"/>

  <line x1="325" y1="190" x2="350" y2="190" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="325" y1="360" x2="350" y2="360" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Cross Coupling Control Lines -->
  <circle cx="120" cy="190" r="3" fill="#2457d6"/>
  <path d="M 120,190 L 120,265 L 270,265 L 270,330" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3"/>

  <circle cx="120" cy="360" r="3" fill="#2457d6"/>
  <path d="M 120,360 L 120,285 L 270,285 L 270,220" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Explanatory Box Panel 1 -->
  <rect x="80" y="430" width="345" height="60" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="252.5" y="450" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Логіка автоскидання:</text>
  <text x="252.5" y="467" text-anchor="middle" font-size="12" fill="#1a1a1a">DTR=1, RTS=0 → Q2 притягує GPIO0 до 0</text>
  <text x="252.5" y="482" text-anchor="middle" font-size="12" fill="#1a1a1a">DTR=0, RTS=1 → Q1 притягує RST до 0 (скидання)</text>

  <!-- Panel 2: Timing Diagrams -->
  <rect x="495" y="80" width="435" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="712.5" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Часові діаграми сигналів</text>

  <!-- Phase Headers -->
  <text x="590" y="130" text-anchor="middle" font-size="12" fill="#6b7280">Idle</text>
  <text x="675" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">GPIO0 = 0</text>
  <text x="765" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Reset імпульс</text>
  <text x="850" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Flash Mode</text>

  <!-- Vertical Phase Grid Lines -->
  <line x1="630" y1="138" x2="630" y2="435" stroke="#d0d7de" stroke-dasharray="3,3"/>
  <line x1="720" y1="138" x2="720" y2="435" stroke="#d0d7de" stroke-dasharray="3,3"/>
  <line x1="810" y1="138" x2="810" y2="435" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="880" y1="138" x2="880" y2="435" stroke="#d0d7de" stroke-dasharray="3,3"/>

  <!-- Waveform 1: DTR -->
  <text x="510" y="165" font-size="12" font-weight="bold" fill="#1a1a1a">DTR</text>
  <path d="M 550,150 L 630,150 L 630,180 L 810,180 L 810,150 L 910,150" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Waveform 2: RTS -->
  <text x="510" y="235" font-size="12" font-weight="bold" fill="#1a1a1a">RTS</text>
  <path d="M 550,220 L 720,220 L 720,250 L 880,250 L 880,220 L 910,220" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Waveform 3: GPIO0 -->
  <text x="510" y="305" font-size="12" font-weight="bold" fill="#2457d6">GPIO0</text>
  <path d="M 550,290 L 630,290 L 630,320 L 880,320 L 880,290 L 910,290" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Waveform 4: RST -->
  <text x="510" y="375" font-size="12" font-weight="bold" fill="#27ae60">RST</text>
  <path d="M 550,360 L 720,360 L 720,390 L 810,390 L 810,360 L 910,360" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Rising Edge Sampling Event -->
  <circle cx="810" cy="360" r="5" fill="#27ae60"/>
  <line x1="810" y1="365" x2="810" y2="435" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Annotation Box Panel 2 -->
  <rect x="525" y="445" width="375" height="50" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="712.5" y="465" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Замір GPIO0=0 при піднятті RST (t = 810 ms)</text>
  <text x="712.5" y="483" text-anchor="middle" font-size="12" fill="#1a1a1a">ESP8266 фіксує 0 на GPIO0 → Вхід у UART Download Mode</text>
</svg>
