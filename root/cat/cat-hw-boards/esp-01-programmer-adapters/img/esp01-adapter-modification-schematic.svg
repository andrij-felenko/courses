<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Доопрацювання USB-адаптера CH340G для ESP-01</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Схема підключення кнопок Flash/Reset, підтяжки CH_PD та конденсатора 3.3В</text>

  <!-- Main Panel Container -->
  <rect x="30" y="75" width="900" height="460" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Left Panel: Base Adapter Schematics -->
  <rect x="50" y="95" width="370" height="425" rx="6" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="235" y="120" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Схема роз'єму ESP-01</text>
  <text x="235" y="138" font-size="12" fill="#6b7280" text-anchor="middle">Розпайка 8-pin та шини живлення</text>

  <!-- 3.3V Power Rail -->
  <text x="90" y="165" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+3.3V</text>
  <line x1="90" y1="175" x2="90" y2="490" stroke="#c0392b" stroke-width="3"/>

  <!-- GND Power Rail -->
  <text x="390" y="165" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GND (0В)</text>
  <line x1="390" y1="175" x2="390" y2="490" stroke="#1a1a1a" stroke-width="3"/>

  <!-- ESP-01 Header Box -->
  <rect x="170" y="175" width="140" height="315" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="240" y="195" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ESP-01 Header</text>

  <!-- Header Pins & Labels -->
  <!-- Row 1: RX / VCC -->
  <circle cx="175" cy="230" r="4" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="188" y="234" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">RX</text>

  <circle cx="305" cy="230" r="4" fill="#c0392b" stroke="#c0392b" stroke-width="2"/>
  <text x="292" y="234" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">VCC</text>

  <!-- Row 2: GPIO0 / RST -->
  <circle cx="175" cy="295" r="4" fill="#2457d6" stroke="#2457d6" stroke-width="2"/>
  <text x="188" y="299" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">GPIO0</text>

  <circle cx="305" cy="295" r="4" fill="#c0392b" stroke="#c0392b" stroke-width="2"/>
  <text x="292" y="299" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">RST</text>

  <!-- Row 3: CH_PD / GPIO2 -->
  <circle cx="175" cy="360" r="4" fill="#27ae60" stroke="#27ae60" stroke-width="2"/>
  <text x="188" y="364" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">CH_PD</text>

  <circle cx="305" cy="360" r="4" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="292" y="364" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">GPIO2</text>

  <!-- Row 4: GND / TX -->
  <circle cx="175" cy="425" r="4" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/>
  <text x="188" y="429" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">GND</text>

  <circle cx="305" cy="425" r="4" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="292" y="429" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">TX</text>

  <!-- Wire Connections inside Left Panel -->
  <!-- VCC to +3.3V Rail -->
  <path d="M 305 230 L 340 230 L 340 180 L 90 180" fill="none" stroke="#c0392b" stroke-width="2"/>
  <circle cx="90" cy="180" r="4" fill="#c0392b"/>

  <!-- GND Pin to GND Rail -->
  <path d="M 175 425 L 140 425 L 140 445 L 390 445" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="390" cy="445" r="4" fill="#1a1a1a"/>

  <!-- Right Panel: Modifications -->
  <rect x="440" y="95" width="470" height="425" rx="6" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <text x="675" y="120" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Компоненти модифікації адаптера</text>
  <text x="675" y="138" font-size="12" fill="#6b7280" text-anchor="middle">4 доопрацювання для стабільності та прошивки</text>

  <!-- Card 1: Pull-up R1 for CH_PD -->
  <rect x="455" y="155" width="440" height="75" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="468" y="173" font-size="13" font-weight="bold" fill="#1e7e34">1. Підтяжка CH_PD: Резистор R1 = 10 кОм</text>
  <text x="468" y="191" font-size="12" fill="#1a1a1a">З'єднання: CH_PD → R1 (10 кОм) → +3.3V</text>
  <text x="468" y="209" font-size="12" fill="#6b7280">Призначення: Фіксує EN для запуску чипа</text>

  <!-- R1 Symbol -->
  <text x="830" y="176" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">R1 10k</text>
  <line x1="770" y1="192" x2="810" y2="192" stroke="#27ae60" stroke-width="2"/>
  <rect x="810" y="184" width="40" height="16" rx="2" fill="white" stroke="#27ae60" stroke-width="2"/>
  <line x1="850" y1="192" x2="880" y2="192" stroke="#c0392b" stroke-width="2"/>

  <!-- Card 2: Flash Button SW1 -->
  <rect x="455" y="242" width="440" height="75" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="468" y="260" font-size="13" font-weight="bold" fill="#1e7e34">2. Кнопка Flash (SW1): Режим прошивки</text>
  <text x="468" y="278" font-size="12" fill="#1a1a1a">З'єднання: GPIO0 → SW1 (Flash) → GND</text>
  <text x="468" y="296" font-size="12" fill="#6b7280">Призначення: Затиснути при скиді для Boot</text>

  <!-- SW1 Symbol -->
  <text x="830" y="254" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">SW1 Flash</text>
  <line x1="770" y1="278" x2="810" y2="278" stroke="#27ae60" stroke-width="2"/>
  <circle cx="810" cy="278" r="3" fill="white" stroke="#27ae60" stroke-width="2"/>
  <circle cx="850" cy="278" r="3" fill="white" stroke="#27ae60" stroke-width="2"/>
  <line x1="810" y1="275" x2="840" y2="262" stroke="#27ae60" stroke-width="2.5"/>
  <line x1="825" y1="258" x2="825" y2="265" stroke="#27ae60" stroke-width="2"/>
  <line x1="850" y1="278" x2="880" y2="278" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Card 3: Reset Button SW2 -->
  <rect x="455" y="329" width="440" height="75" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="468" y="347" font-size="13" font-weight="bold" fill="#1e7e34">3. Кнопка Reset (SW2): Апаратний скид</text>
  <text x="468" y="365" font-size="12" fill="#1a1a1a">З'єднання: RST → SW2 (Reset) → GND</text>
  <text x="468" y="383" font-size="12" fill="#6b7280">Призначення: Замикання RST на GND для скиду</text>

  <!-- SW2 Symbol -->
  <text x="830" y="341" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">SW2 Reset</text>
  <line x1="770" y1="365" x2="810" y2="365" stroke="#27ae60" stroke-width="2"/>
  <circle cx="810" cy="365" r="3" fill="white" stroke="#27ae60" stroke-width="2"/>
  <circle cx="850" cy="365" r="3" fill="white" stroke="#27ae60" stroke-width="2"/>
  <line x1="810" y1="362" x2="840" y2="349" stroke="#27ae60" stroke-width="2.5"/>
  <line x1="825" y1="345" x2="825" y2="352" stroke="#27ae60" stroke-width="2"/>
  <line x1="850" y1="365" x2="880" y2="365" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Card 4: Capacitor C1 -->
  <rect x="455" y="416" width="440" height="90" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="468" y="434" font-size="13" font-weight="bold" fill="#1e7e34">4. Конденсатор C1: 470 мкФ / 10 В</text>
  <text x="468" y="452" font-size="12" fill="#1a1a1a">З'єднання: + до шини +3.3V, - до шини GND</text>
  <text x="468" y="470" font-size="12" fill="#6b7280">Призначення: Згладжує піки струму Wi-Fi</text>
  <text x="468" y="488" font-size="12" fill="#6b7280">Запобігає перезавантаженням модуля</text>

  <!-- C1 Symbol -->
  <text x="827" y="442" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">C1 470µF</text>
  <line x1="770" y1="460" x2="822" y2="460" stroke="#c0392b" stroke-width="2"/>
  <line x1="822" y1="448" x2="822" y2="472" stroke="#c0392b" stroke-width="3"/>
  <text x="814" y="454" font-size="12" font-weight="bold" fill="#c0392b">+</text>
  <line x1="832" y1="448" x2="832" y2="472" stroke="#1a1a1a" stroke-width="3"/>
  <text x="838" y="454" font-size="12" font-weight="bold" fill="#1a1a1a">-</text>
  <line x1="832" y1="460" x2="880" y2="460" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Inter-Panel Signal Wires -->
  <!-- CH_PD to Card 1 Line (at y=152) -->
  <path d="M 175 360 L 120 360 L 120 152 L 455 152" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>

  <!-- GPIO0 to Card 2 Line (at y=255) -->
  <path d="M 175 295 L 135 295 L 135 255 L 455 255" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>

  <!-- RST to Card 3 Line (at y=322) -->
  <path d="M 305 295 L 345 295 L 345 322 L 455 322" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>

  <!-- Power Rails to Card 4 (3.3V at y=475, GND at y=460) -->
  <path d="M 90 475 L 455 475" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <circle cx="90" cy="475" r="4" fill="#c0392b"/>

  <path d="M 390 460 L 455 460" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <circle cx="390" cy="460" r="4" fill="#1a1a1a"/>
</svg>
