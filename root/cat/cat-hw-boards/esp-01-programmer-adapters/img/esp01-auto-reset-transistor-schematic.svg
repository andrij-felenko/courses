<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="510" fill="white"/>

  <!-- Header -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принципова схема автоскидання ESP-01 на NPN-транзисторах</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Формування сигналів RESET (EN) та GPIO0 через комбінацію ліній DTR та RTS</text>

  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0,0 L 8,4 L 0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0,0 L 8,4 L 0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Left Block: USB-UART Bridge -->
  <rect x="30" y="75" width="160" height="235" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="110" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">USB-UART мост</text>
  <text x="110" y="116" font-size="12" fill="#6b7280" text-anchor="middle">(CH340G / CP2102)</text>

  <!-- Pin Output Labels inside Left Box -->
  <text x="175" y="154" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">DTR</text>
  <text x="175" y="194" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">RTS</text>
  <text x="175" y="238" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">TXD</text>
  <text x="175" y="272" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">RXD</text>

  <!-- Right Block: ESP-01 Module -->
  <rect x="740" y="75" width="190" height="235" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="835" y="98" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Модуль ESP-01</text>
  <text x="835" y="116" font-size="12" fill="#6b7280" text-anchor="middle">(SoC ESP8266)</text>

  <!-- Pin Input Labels inside Right Box -->
  <text x="752" y="154" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">RST (EN)</text>
  <text x="752" y="194" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">GPIO0</text>
  <text x="752" y="238" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">RXD</text>
  <text x="752" y="272" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">TXD</text>

  <!-- Internal ESP-01 Pull-ups Note -->
  <rect x="750" y="282" width="170" height="22" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="835" y="297" font-size="11" fill="#6b7280" text-anchor="middle">CH_PD = 3.3V | GPIO2 = 3.3V</text>

  <!-- SCHEMATIC WIRES & COMPONENTS -->

  <!-- DTR Line from (190, 150) -->
  <path d="M 190,150 L 220,150" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  <circle cx="220" cy="150" r="3.5" fill="#1a1a1a"/>
  <!-- DTR branch to R2 (Base Q2) -->
  <path d="M 220,150 L 220,210 L 265,210" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  <!-- DTR branch to Q1 Emitter (line at y=110) -->
  <path d="M 220,150 L 220,110 L 365,110 L 365,138" stroke="#1a1a1a" stroke-width="2" fill="none"/>

  <!-- RTS Line from (190, 190) -->
  <path d="M 190,190 L 240,190" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  <circle cx="240" cy="190" r="3.5" fill="#1a1a1a"/>
  <!-- RTS branch to R1 (Base Q1) -->
  <path d="M 240,190 L 240,150 L 265,150" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  <!-- RTS branch to Q2 Emitter (line at y=248) -->
  <path d="M 240,190 L 240,248 L 365,248 L 365,222" stroke="#1a1a1a" stroke-width="2" fill="none"/>

  <!-- Resistor R1 (10 kΩ) on Q1 Base -->
  <rect x="265" y="141" width="40" height="18" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="285" y="132" font-size="12" fill="#1a1a1a" text-anchor="middle">R1 10k</text>
  <path d="M 305,150 L 332,150" stroke="#1a1a1a" stroke-width="2" fill="none"/>

  <!-- Resistor R2 (10 kΩ) on Q2 Base -->
  <rect x="265" y="201" width="40" height="18" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="285" y="232" font-size="12" fill="#1a1a1a" text-anchor="middle">R2 10k</text>
  <path d="M 305,210 L 332,210" stroke="#1a1a1a" stroke-width="2" fill="none"/>

  <!-- Transistor Q1 (S8050 NPN) -->
  <circle cx="350" cy="150" r="18" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <!-- Base bar -->
  <line x1="342" y1="140" x2="342" y2="160" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- Emitter lead (top) -->
  <line x1="342" y1="144" x2="365" y2="138" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Emitter arrow pointing OUT -->
  <polygon points="363,136 355,140 359,146" fill="#1a1a1a"/>
  <!-- Collector lead (bottom) -->
  <line x1="342" y1="156" x2="365" y2="162" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Transistor Q1 Label -->
  <text x="350" y="95" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Q1 (S8050 NPN)</text>

  <!-- Transistor Q2 (S8050 NPN) -->
  <circle cx="350" cy="210" r="18" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <!-- Base bar -->
  <line x1="342" y1="200" x2="342" y2="220" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- Collector lead (top) -->
  <line x1="342" y1="204" x2="365" y2="198" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Emitter lead (bottom) -->
  <line x1="342" y1="216" x2="365" y2="222" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Emitter arrow pointing OUT -->
  <polygon points="363,224 355,220 359,214" fill="#1a1a1a"/>
  <!-- Transistor Q2 Label -->
  <text x="350" y="268" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Q2 (S8050 NPN)</text>

  <!-- OUTPUT NETS -->

  <!-- RESET / EN Net (Q1 Collector -> ESP-01 RST) -->
  <path d="M 365,162 L 410,162 L 410,150 L 740,150" stroke="#1a1a1a" stroke-width="2" fill="none" marker-end="url(#arr-black)"/>

  <!-- Pull-up Resistor R3 (10 kΩ) on RESET Net -->
  <circle cx="490" cy="150" r="3.5" fill="#1a1a1a"/>
  <path d="M 490,150 L 490,125" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
  <rect x="481" y="95" width="18" height="30" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="506" y="114" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">R3 10k</text>
  <path d="M 490,95 L 490,85" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
  <circle cx="490" cy="85" r="3" fill="#c0392b"/>
  <text x="490" y="74" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+3.3V</text>

  <!-- Filter Capacitor C1 (100 nF) on RESET Net -->
  <circle cx="600" cy="150" r="3.5" fill="#1a1a1a"/>
  <path d="M 600,150 L 600,170" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
  <line x1="590" y1="170" x2="610" y2="170" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="590" y1="176" x2="610" y2="176" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 600,176 L 600,192" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
  <!-- GND Symbol -->
  <line x1="592" y1="192" x2="608" y2="192" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="595" y1="195" x2="605" y2="195" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="598" y1="198" x2="602" y2="198" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="618" y="176" font-size="12" fill="#6b7280" text-anchor="start">C1 100nF</text>

  <!-- GPIO0 Net (Q2 Collector -> ESP-01 GPIO0) -->
  <path d="M 365,198 L 410,198 L 410,190 L 740,190" stroke="#1a1a1a" stroke-width="2" fill="none" marker-end="url(#arr-black)"/>

  <!-- Pull-up Resistor R4 (10 kΩ) on GPIO0 Net -->
  <circle cx="540" cy="190" r="3.5" fill="#1a1a1a"/>
  <path d="M 540,190 L 540,165" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
  <rect x="531" y="135" width="18" height="30" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="556" y="180" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">R4 10k</text>
  <path d="M 540,135 L 540,85" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
  <!-- Connect to +3.3V rail -->
  <path d="M 490,85 L 540,85" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>

  <!-- TXD and RXD Data Lines -->
  <!-- TXD -> Resistor R5 -> RXD -->
  <path d="M 190,238 L 430,238" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
  <rect x="430" y="229" width="40" height="18" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="450" y="221" font-size="12" fill="#1a1a1a" text-anchor="middle">R5 470Ω</text>
  <path d="M 470,238 L 740,238" stroke="#1a1a1a" stroke-width="1.5" fill="none" marker-end="url(#arr-black)"/>

  <!-- RXD <- Resistor R6 <- TXD -->
  <path d="M 740,272 L 470,272" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
  <rect x="430" y="263" width="40" height="18" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="450" y="294" font-size="12" fill="#1a1a1a" text-anchor="middle">R6 470Ω</text>
  <path d="M 430,272 L 190,272" stroke="#1a1a1a" stroke-width="1.5" fill="none" marker-end="url(#arr-black)"/>

  <!-- BOTTOM PANEL: TRUTH TABLE -->
  <rect x="30" y="325" width="900" height="175" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="346" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Таблиця логічних станів транзисторного автомата скидання</text>

  <!-- Table Header Bar -->
  <rect x="40" y="356" width="880" height="24" rx="4" fill="#eaf0fd"/>
  <text x="140" y="372" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Сигнали USB-UART (DTR / RTS)</text>
  <text x="350" y="372" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Стан транзисторів (Q1 / Q2)</text>
  <text x="570" y="372" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Сигнали ESP-01 (RESET / GPIO0)</text>
  <text x="790" y="372" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Режим роботи мікроконтролера</text>

  <!-- Row 1: Normal Boot -->
  <rect x="40" y="382" width="880" height="24" fill="white"/>
  <text x="140" y="398" font-size="12" fill="#1a1a1a" text-anchor="middle">DTR = 0 (3.3V) , RTS = 0 (3.3V)</text>
  <text x="350" y="398" font-size="12" fill="#1a1a1a" text-anchor="middle">Q1: OFF , Q2: OFF</text>
  <text x="570" y="398" font-size="12" fill="#1a1a1a" text-anchor="middle">RESET = 1 (3.3V) , GPIO0 = 1 (3.3V)</text>
  <text x="790" y="398" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Звичайний запуск (Flash Boot)</text>

  <!-- Row 2: Bootloader Prep -->
  <rect x="40" y="408" width="880" height="24" fill="#e9f7ef"/>
  <text x="140" y="424" font-size="12" fill="#1a1a1a" text-anchor="middle">DTR = 0 (3.3V) , RTS = 1 (0V)</text>
  <text x="350" y="424" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Q1: OFF , Q2: ON</text>
  <text x="570" y="424" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">RESET = 1 (3.3V) , GPIO0 = 0 (0V)</text>
  <text x="790" y="424" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Підготовка режиму завантажувача</text>

  <!-- Row 3: Reset Pulse -->
  <rect x="40" y="434" width="880" height="24" fill="#eaf0fd"/>
  <text x="140" y="450" font-size="12" fill="#1a1a1a" text-anchor="middle">DTR = 1 (0V) , RTS = 0 (3.3V)</text>
  <text x="350" y="450" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Q1: ON , Q2: OFF</text>
  <text x="570" y="450" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">RESET = 0 (0V) , GPIO0 = 1 (3.3V)</text>
  <text x="790" y="450" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Імпульс апаратного скидання (Reset)</text>

  <!-- Row 4: Anti-lockout -->
  <rect x="40" y="460" width="880" height="24" fill="white"/>
  <text x="140" y="476" font-size="12" fill="#1a1a1a" text-anchor="middle">DTR = 1 (0V) , RTS = 1 (0V)</text>
  <text x="350" y="476" font-size="12" fill="#6b7280" text-anchor="middle">Q1: OFF , Q2: OFF</text>
  <text x="570" y="476" font-size="12" fill="#6b7280" text-anchor="middle">RESET = 1 (3.3V) , GPIO0 = 1 (3.3V)</text>
  <text x="790" y="476" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Захист від заклинювання (Anti-lockout)</text>

</svg>
