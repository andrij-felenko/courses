<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Послідовність сигналів та потік даних для прошивки ESP-01</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">GPIO0 повинен залишатися в LOW під час відпускання RESET для входу в режим UART Bootloader</text>

  <!-- PANEL 1: Timing Diagram -->
  <rect x="30" y="80" width="900" height="230" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="105" font-size="14" font-weight="bold" fill="#2457d6">1. Часова діаграма сигналів входу в режим прошивки (UART Download Mode)</text>

  <!-- Phase Grid Lines & Labels -->
  <line x1="330" y1="138" x2="330" y2="265" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="470" y1="138" x2="470" y2="265" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="600" y1="138" x2="600" y2="265" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="740" y1="138" x2="740" y2="265" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="265" y="130" text-anchor="middle" font-size="12" fill="#6b7280">1. Норма</text>
  <text x="400" y="130" text-anchor="middle" font-size="12" fill="#6b7280">2. GPIO0 = 0V</text>
  <text x="535" y="130" text-anchor="middle" font-size="12" fill="#6b7280">3. RESET = 0V</text>
  <text x="670" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">4. Вхід у Boot</text>
  <text x="815" y="130" text-anchor="middle" font-size="12" fill="#6b7280">5. Передача</text>

  <!-- RESET Signal Line -->
  <text x="50" y="176" font-size="13" font-weight="bold" fill="#1a1a1a">RESET (RST)</text>
  <text x="190" y="164" text-anchor="end" font-size="11" fill="#6b7280">3.3V</text>
  <text x="190" y="194" text-anchor="end" font-size="11" fill="#6b7280">0V</text>
  <path d="M 200,160 L 470,160 L 470,190 L 600,190 L 600,160 L 890,160" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- GPIO0 Signal Line -->
  <text x="50" y="236" font-size="13" font-weight="bold" fill="#1a1a1a">GPIO0 (FLASH)</text>
  <text x="190" y="224" text-anchor="end" font-size="11" fill="#6b7280">3.3V</text>
  <text x="190" y="254" text-anchor="end" font-size="11" fill="#6b7280">0V</text>
  <path d="M 200,220 L 330,220 L 330,250 L 740,250 L 740,220 L 890,220" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Sampling Highlight & Callout -->
  <rect x="588" y="148" width="24" height="114" fill="#e9f7ef" stroke="#27ae60" stroke-dasharray="3,3" opacity="0.6" rx="3"/>
  <rect x="550" y="272" width="200" height="24" rx="4" fill="#27ae60"/>
  <text x="650" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Вибірка Boot: GPIO0 = 0V</text>

  <!-- PANEL 2: Data Flow & Hardware Diagram -->
  <rect x="30" y="325" width="900" height="215" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="350" font-size="14" font-weight="bold" fill="#2457d6">2. Апаратна схема та потік даних під час прошивки</text>

  <!-- Block 1: PC / IDE -->
  <rect x="50" y="365" width="170" height="150" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="135" y="388" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">ПК / ПО розробки</text>
  <text x="135" y="408" text-anchor="middle" font-size="12" fill="#6b7280">esptool.py (CLI)</text>
  <text x="135" y="426" text-anchor="middle" font-size="12" fill="#6b7280">Arduino IDE / PlatformIO</text>
  <rect x="62" y="438" width="146" height="65" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="135" y="456" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">COM-порт (USB)</text>
  <text x="135" y="474" text-anchor="middle" font-size="12" fill="#1a1a1a">74880 baud (логи)</text>
  <text x="135" y="492" text-anchor="middle" font-size="12" fill="#1a1a1a">115200 baud (код)</text>

  <!-- Connection 1: USB -->
  <line x1="220" y1="440" x2="265" y2="440" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="242" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">USB</text>

  <!-- Block 2: USB-UART Adapter -->
  <rect x="265" y="365" width="185" height="150" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="357" y="388" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">USB-UART Адаптер</text>
  <text x="357" y="408" text-anchor="middle" font-size="12" fill="#6b7280">CH340G / CP2102 / FTDI</text>
  <rect x="275" y="420" width="165" height="83" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="357" y="438" text-anchor="middle" font-size="12" fill="#1a1a1a">TXD ──► RXD (Дані)</text>
  <text x="357" y="456" text-anchor="middle" font-size="12" fill="#1a1a1a">RXD ◄── TXD (Логи)</text>
  <text x="357" y="474" text-anchor="middle" font-size="12" fill="#c0392b">GPIO0 ──► GND (Boot)</text>
  <text x="357" y="492" text-anchor="middle" font-size="12" fill="#c0392b">RST ──► GND (Reset)</text>

  <!-- Connection 2: UART -->
  <line x1="450" y1="440" x2="495" y2="440" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="472" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">UART</text>
  <text x="472" y="456" text-anchor="middle" font-size="11" fill="#6b7280">TX / RX</text>

  <!-- Block 3: ESP-01 / ESP8266 -->
  <rect x="495" y="365" width="200" height="150" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="595" y="388" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Модуль ESP-01 (ESP8266)</text>
  <rect x="507" y="400" width="176" height="103" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="595" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">ROM Bootloader</text>
  <text x="595" y="436" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">UART Download Mode</text>
  <text x="595" y="454" text-anchor="middle" font-size="11" fill="#6b7280">GPIO0=0 | GPIO2=1 | GPIO15=0</text>
  <text x="595" y="474" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Очищення (Chip Erase)</text>
  <text x="595" y="492" text-anchor="middle" font-size="11" fill="#1a1a1a">Живлення 3.3V (до 300mA)</text>

  <!-- Connection 3: SPI -->
  <line x1="695" y1="440" x2="740" y2="440" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="717" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">SPI</text>
  <text x="717" y="456" text-anchor="middle" font-size="11" fill="#6b7280">DOUT/DIO</text>

  <!-- Block 4: Flash Memory -->
  <rect x="740" y="365" width="175" height="150" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="827" y="388" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Flash-пам'ять</text>
  <text x="827" y="408" text-anchor="middle" font-size="12" fill="#6b7280">SPI Flash (25Q40/25Q80)</text>
  <rect x="752" y="420" width="151" height="83" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="827" y="442" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Режим Flash:</text>
  <text x="827" y="460" text-anchor="middle" font-size="12" fill="#2457d6">DOUT (ESP-01/S)</text>
  <text x="827" y="478" text-anchor="middle" font-size="12" fill="#2457d6">DIO (універсальний)</text>
  <text x="827" y="496" text-anchor="middle" font-size="11" fill="#6b7280">Запис бінарного коду</text>
</svg>
