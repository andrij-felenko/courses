<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Markers -->
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Розводка 8-контактного роз'єму 2×4 адаптера ESP-01</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Призначення виводів, схеми підтяжки 10 кОм до 3.3 В / GND та комутаційні логічні рівні</text>

  <!-- LEFT PANEL: Power Supply Node -->
  <rect x="30" y="80" width="220" height="435" rx="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="30" y="80" width="220" height="36" rx="10" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="30" y="106" width="220" height="10" fill="#eaf0fd"/>
  <text x="140" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Живлення та фільтрація</text>

  <!-- 5V Input Box -->
  <rect x="45" y="130" width="190" height="50" rx="6" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="140" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Вхід VBUS (5 В USB)</text>
  <text x="140" y="169" text-anchor="middle" font-size="12" fill="#6b7280">Джерело живлення шини</text>

  <line x1="140" y1="180" x2="140" y2="207" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- LDO Regulator Box -->
  <rect x="45" y="215" width="190" height="60" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="140" y="238" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">LDO 3.3 В (AMS1117)</text>
  <text x="140" y="258" text-anchor="middle" font-size="12" fill="#1a1a1a">I_peak ≤ 350 мА, U_out = 3.3 В</text>

  <line x1="140" y1="275" x2="140" y2="302" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Filter Capacitors Box -->
  <rect x="45" y="310" width="190" height="90" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="140" y="332" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Конденсатори фільтрації</text>
  <text x="140" y="352" text-anchor="middle" font-size="12" fill="#2457d6">C1 = 100 нФ (ВЧ кераміка)</text>
  <text x="140" y="370" text-anchor="middle" font-size="12" fill="#27ae60">C2 = 10–100 мкФ (Low ESR)</text>
  <text x="140" y="388" text-anchor="middle" font-size="12" fill="#6b7280">Пригнічення сплесків Wi-Fi</text>

  <!-- Power Rail Summary -->
  <rect x="45" y="415" width="190" height="85" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="140" y="438" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Шина VCC (+3.3 В)</text>
  <text x="140" y="458" text-anchor="middle" font-size="12" fill="#1a1a1a">Живить VCC (Pin 8)</text>
  <text x="140" y="476" text-anchor="middle" font-size="12" fill="#1a1a1a">та підтяжки 10 кОм</text>

  <!-- CENTER PANEL: 2x4 Header Layout -->
  <rect x="270" y="80" width="420" height="435" rx="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="270" y="80" width="420" height="36" rx="10" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="270" y="106" width="420" height="10" fill="#eaf0fd"/>
  <text x="480" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Конфігурація роз'єму 2×4 (ESP-01 Pinout)</text>

  <!-- Header Outer Socket Box -->
  <rect x="330" y="130" width="300" height="365" rx="10" fill="#2c3e50" stroke="#1a1a1a" stroke-width="2"/>
  <text x="480" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Вигляд гнізда роз'єму 2×4 (Крок 2.54 мм)</text>

  <!-- Row 1: Pin 1 (GND) & Pin 2 (TXD) -->
  <!-- Pin 1 -->
  <rect x="350" y="170" width="120" height="65" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="370" cy="202" r="14" fill="#c0392b"/>
  <text x="370" y="207" text-anchor="middle" font-size="13" font-weight="bold" fill="white">1</text>
  <text x="420" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">GND</text>
  <text x="420" y="214" text-anchor="middle" font-size="12" fill="#1a1a1a">0 В (Земля)</text>

  <!-- Pin 2 -->
  <rect x="490" y="170" width="120" height="65" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="510" cy="202" r="14" fill="#2457d6"/>
  <text x="510" y="207" text-anchor="middle" font-size="13" font-weight="bold" fill="white">2</text>
  <text x="560" y="196" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">TXD</text>
  <text x="560" y="214" text-anchor="middle" font-size="12" fill="#1a1a1a">UART TX 3.3V</text>

  <!-- Row 2: Pin 3 (GPIO2) & Pin 4 (CH_PD) -->
  <!-- Pin 3 -->
  <rect x="350" y="250" width="120" height="65" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="370" cy="282" r="14" fill="#27ae60"/>
  <text x="370" y="287" text-anchor="middle" font-size="13" font-weight="bold" fill="white">3</text>
  <text x="420" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">GPIO2</text>
  <text x="420" y="294" text-anchor="middle" font-size="12" fill="#1a1a1a">10кΩ до VCC</text>

  <!-- Pin 4 -->
  <rect x="490" y="250" width="120" height="65" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="510" cy="282" r="14" fill="#27ae60"/>
  <text x="510" y="287" text-anchor="middle" font-size="13" font-weight="bold" fill="white">4</text>
  <text x="560" y="276" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">CH_PD</text>
  <text x="560" y="294" text-anchor="middle" font-size="12" fill="#1a1a1a">10кΩ до VCC</text>

  <!-- Row 3: Pin 5 (GPIO0) & Pin 6 (RST) -->
  <!-- Pin 5 -->
  <rect x="350" y="330" width="120" height="65" rx="6" fill="#fff8e7" stroke="#d35400" stroke-width="1.5"/>
  <circle cx="370" cy="362" r="14" fill="#d35400"/>
  <text x="370" y="367" text-anchor="middle" font-size="13" font-weight="bold" fill="white">5</text>
  <text x="420" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#d35400">GPIO0</text>
  <text x="420" y="374" text-anchor="middle" font-size="12" fill="#1a1a1a">Boot/Flash key</text>

  <!-- Pin 6 -->
  <rect x="490" y="330" width="120" height="65" rx="6" fill="#fff8e7" stroke="#d35400" stroke-width="1.5"/>
  <circle cx="510" cy="362" r="14" fill="#d35400"/>
  <text x="510" y="367" text-anchor="middle" font-size="13" font-weight="bold" fill="white">6</text>
  <text x="560" y="356" text-anchor="middle" font-size="13" font-weight="bold" fill="#d35400">RST</text>
  <text x="560" y="374" text-anchor="middle" font-size="12" fill="#1a1a1a">Reset (NPN Q1)</text>

  <!-- Row 4: Pin 7 (RXD) & Pin 8 (VCC) -->
  <!-- Pin 7 -->
  <rect x="350" y="410" width="120" height="65" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="370" cy="442" r="14" fill="#2457d6"/>
  <text x="370" y="447" text-anchor="middle" font-size="13" font-weight="bold" fill="white">7</text>
  <text x="420" y="436" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">RXD</text>
  <text x="420" y="454" text-anchor="middle" font-size="12" fill="#1a1a1a">UART RX 3.3V</text>

  <!-- Pin 8 -->
  <rect x="490" y="410" width="120" height="65" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="510" cy="442" r="14" fill="#27ae60"/>
  <text x="510" y="447" text-anchor="middle" font-size="13" font-weight="bold" fill="white">8</text>
  <text x="560" y="436" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">VCC</text>
  <text x="560" y="454" text-anchor="middle" font-size="12" fill="#1a1a1a">+3.3 В Живлення</text>

  <!-- RIGHT PANEL: Modes & Pin Functions -->
  <rect x="710" y="80" width="220" height="435" rx="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="710" y="80" width="220" height="36" rx="10" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="710" y="106" width="220" height="10" fill="#eaf0fd"/>
  <text x="820" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Логічні режими завантаження</text>

  <!-- Mode 1: Normal Boot -->
  <rect x="725" y="130" width="190" height="105" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="820" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Normal Boot (Виконання)</text>
  <text x="740" y="174" font-size="12" fill="#1a1a1a">• GPIO0 = 1 (підтяжка 10кΩ)</text>
  <text x="740" y="192" font-size="12" fill="#1a1a1a">• GPIO2 = 1 (підтяжка 10кΩ)</text>
  <text x="740" y="210" font-size="12" fill="#1a1a1a">• CH_PD = 1 (активація чипа)</text>
  <text x="740" y="226" font-size="12" fill="#6b7280">Старт програми з Flash</text>

  <!-- Mode 2: UART Download -->
  <rect x="725" y="248" width="190" height="105" rx="6" fill="#fff8e7" stroke="#d35400" stroke-width="1.5"/>
  <text x="820" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#d35400">UART Download (Прошивка)</text>
  <text x="740" y="292" font-size="12" fill="#1a1a1a">• GPIO0 = 0 (GND / DTR key)</text>
  <text x="740" y="310" font-size="12" fill="#1a1a1a">• GPIO2 = 1 (підтяжка 10кΩ)</text>
  <text x="740" y="328" font-size="12" fill="#1a1a1a">• RST = 0 → 1 (імпульс NPN)</text>
  <text x="740" y="344" font-size="12" fill="#6b7280">Завантажник приймає код</text>

  <!-- Auto-reset transistor logic note -->
  <rect x="725" y="366" width="190" height="134" rx="6" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="820" y="388" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Вузол автоскиду (DTR/RTS)</text>
  <text x="740" y="410" font-size="12" fill="#1a1a1a">• DTR=0, RTS=1 → GPIO0=0</text>
  <text x="740" y="428" font-size="12" fill="#1a1a1a">• DTR=1, RTS=0 → RST=0</text>
  <text x="740" y="446" font-size="12" fill="#1a1a1a">• DTR=0, RTS=0 → блокування</text>
  <text x="740" y="464" font-size="12" fill="#27ae60">Захист від випадкового</text>
  <text x="740" y="482" font-size="12" fill="#27ae60">скидання при відкритті VCP</text>
</svg>
