<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розводка та призначення виводів роз'єму 2×4 адаптера ESP-01 / ESP-01S</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Напрямок сигналів, логічні рівні та електричні режими для прошивки й нормальної роботи</text>

  <!-- ЛІВА ПАНЕЛЬ: Схема роз'єму 2x4 та режими завантаження -->
  <rect x="30" y="75" width="430" height="465" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="245" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема роз'єму 2×4 адаптера ESP-01</text>

  <!-- Верхній ряд виносних блоків (Входи / Живлення / Керування) -->
  <!-- RX Callout -->
  <rect x="45" y="120" width="90" height="44" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="90" y="138" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">RX (Вхід)</text>
  <text x="90" y="154" font-size="11" fill="#1a1a1a" text-anchor="middle">3.3V UART In</text>

  <!-- VCC Callout -->
  <rect x="147" y="120" width="90" height="44" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="192" y="138" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">VCC (+3.3V)</text>
  <text x="192" y="154" font-size="11" fill="#1a1a1a" text-anchor="middle">Живлення</text>

  <!-- GPIO0 Callout -->
  <rect x="253" y="120" width="90" height="44" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="298" y="138" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">GPIO0</text>
  <text x="298" y="154" font-size="11" fill="#1a1a1a" text-anchor="middle">Flash / Run</text>

  <!-- RST Callout -->
  <rect x="355" y="120" width="90" height="44" rx="6" fill="#fff5e6" stroke="#e67e22" stroke-width="1.2"/>
  <text x="400" y="138" font-size="12" font-weight="bold" fill="#d35400" text-anchor="middle">RST (Reset)</text>
  <text x="400" y="154" font-size="11" fill="#1a1a1a" text-anchor="middle">Активний 0</text>

  <!-- Корпус сокета 2x4 -->
  <rect x="130" y="190" width="230" height="115" rx="8" fill="#2c3e50" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Заголовок у корпусі сокета -->
  <text x="245" y="208" font-size="11" font-weight="bold" fill="#ecf0f1" text-anchor="middle">ESP-01</text>
  <text x="245" y="222" font-size="11" fill="#94a3b8" text-anchor="middle">Top View</text>

  <!-- Контакти 2x4 Header -->
  <!-- Top Row: RX, VCC, GPIO0, RST -->
  <circle cx="155" cy="245" r="14" fill="#2457d6"/>
  <text x="155" y="249" font-size="11" font-weight="bold" fill="white" text-anchor="middle">RX</text>

  <circle cx="210" cy="245" r="14" fill="#c0392b"/>
  <text x="210" y="249" font-size="11" font-weight="bold" fill="white" text-anchor="middle">VCC</text>

  <circle cx="280" cy="245" r="14" fill="#27ae60"/>
  <text x="280" y="249" font-size="11" font-weight="bold" fill="white" text-anchor="middle">GP0</text>

  <circle cx="335" cy="245" r="14" fill="#e67e22"/>
  <text x="335" y="249" font-size="11" font-weight="bold" fill="white" text-anchor="middle">RST</text>

  <!-- Bottom Row: GND, CH_PD, GPIO2, TX -->
  <circle cx="155" cy="285" r="14" fill="#34495e"/>
  <text x="155" y="289" font-size="11" font-weight="bold" fill="white" text-anchor="middle">GND</text>

  <circle cx="210" cy="285" r="14" fill="#e67e22"/>
  <text x="210" y="289" font-size="11" font-weight="bold" fill="white" text-anchor="middle">EN</text>

  <circle cx="280" cy="285" r="14" fill="#27ae60"/>
  <text x="280" y="289" font-size="11" font-weight="bold" fill="white" text-anchor="middle">GP2</text>

  <circle cx="335" cy="285" r="14" fill="#2457d6"/>
  <text x="335" y="289" font-size="11" font-weight="bold" fill="white" text-anchor="middle">TX</text>

  <!-- З'єднувальні лінії зверху до контактів -->
  <path d="M 90,164 L 155,231" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-blue)"/>
  <path d="M 192,164 L 210,231" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
  <path d="M 298,164 L 280,231" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3"/>
  <path d="M 400,164 L 335,231" fill="none" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Нижній ряд виносних блоків -->
  <!-- GND Callout -->
  <rect x="45" y="325" width="90" height="44" rx="6" fill="#f4f6f8" stroke="#34495e" stroke-width="1.2"/>
  <text x="90" y="343" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GND (Земля)</text>
  <text x="90" y="359" font-size="11" fill="#6b7280" text-anchor="middle">0V Спільний</text>

  <!-- CH_PD Callout -->
  <rect x="147" y="325" width="90" height="44" rx="6" fill="#fff5e6" stroke="#e67e22" stroke-width="1.2"/>
  <text x="192" y="343" font-size="12" font-weight="bold" fill="#d35400" text-anchor="middle">CH_PD (EN)</text>
  <text x="192" y="359" font-size="11" fill="#1a1a1a" text-anchor="middle">Увімкнення</text>

  <!-- GPIO2 Callout -->
  <rect x="253" y="325" width="90" height="44" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="298" y="343" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">GPIO2</text>
  <text x="298" y="359" font-size="11" fill="#1a1a1a" text-anchor="middle">HIGH старт</text>

  <!-- TX Callout -->
  <rect x="355" y="325" width="90" height="44" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="400" y="343" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">TX (Вихід)</text>
  <text x="400" y="359" font-size="11" fill="#1a1a1a" text-anchor="middle">3.3V UART Out</text>

  <!-- З'єднувальні лінії знизу від контактів -->
  <path d="M 155,299 L 90,325" fill="none" stroke="#34495e" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr)"/>
  <path d="M 210,299 L 192,325" fill="none" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="3,3"/>
  <path d="M 280,299 L 298,325" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3"/>
  <path d="M 335,299 L 400,325" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-blue)"/>

  <!-- Таблиця режимів завантаження внизу лівої панелі -->
  <rect x="45" y="385" width="400" height="140" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <rect x="45" y="385" width="400" height="26" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="245" y="402" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Логіка конфігурації завантаження (Boot Modes)</text>

  <text x="55" y="424" font-size="11" font-weight="bold" fill="#c0392b">Режим прошивки (Flash):</text>
  <text x="195" y="424" font-size="11" fill="#1a1a1a">GPIO0 = LOW, GPIO2 = 3.3V, RST = 3.3V</text>

  <text x="55" y="445" font-size="11" font-weight="bold" fill="#27ae60">Робочий режим (Run):</text>
  <text x="195" y="445" font-size="11" fill="#1a1a1a">GPIO0 = HIGH, GPIO2 = 3.3V, RST = 3.3V</text>

  <text x="55" y="466" font-size="11" font-weight="bold" fill="#2457d6">Активація чипа:</text>
  <text x="195" y="466" font-size="11" fill="#1a1a1a">CH_PD (EN) підтягнуто до +3.3V (HIGH)</text>

  <text x="55" y="487" font-size="11" font-weight="bold" fill="#e67e22">Скидання (Reset):</text>
  <text x="195" y="487" font-size="11" fill="#1a1a1a">Короткий імпульс LOW (0V) на контакт RST</text>

  <text x="55" y="508" font-size="11" font-weight="bold" fill="#6b7280">Авто-прошивка:</text>
  <text x="195" y="508" font-size="11" fill="#1a1a1a">DTR ➔ GPIO0, RTS ➔ RST (автоматично)</text>

  <!-- ПРАВА ПАНЕЛЬ: 3 детальні карти вимог та інтерфейсів -->

  <!-- Картка 1: Живлення VCC / GND -->
  <rect x="480" y="75" width="450" height="135" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="480" y="75" width="450" height="28" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="495" y="94" font-size="13" font-weight="bold" fill="#c0392b">1. Електричне живлення: VCC (+3.3V) та GND (0V)</text>

  <text x="495" y="118" font-size="12" font-weight="bold" fill="#1a1a1a">• Напруга VCC:</text>
  <text x="592" y="118" font-size="12" fill="#c0392b">суворо 3.0 В – 3.6 В (3.3V). ⛔ 5 В спалить чип!</text>

  <text x="495" y="140" font-size="12" font-weight="bold" fill="#1a1a1a">• Струм споживання:</text>
  <text x="625" y="140" font-size="12" fill="#1a1a1a">до 300–500 мА у піках (потрібен LDO-регулятор)</text>

  <text x="495" y="162" font-size="12" font-weight="bold" fill="#1a1a1a">• Фільтрація:</text>
  <text x="585" y="162" font-size="12" fill="#1a1a1a">0.1 мкФ (кераміка) + 10–100 мкФ біля VCC</text>

  <text x="495" y="184" font-size="12" font-weight="bold" fill="#1a1a1a">• Спільна земля:</text>
  <text x="605" y="184" font-size="12" fill="#1a1a1a">GND адаптера та USB-UART мають бути з'єднані</text>

  <!-- Картка 2: Послідовний інтерфейс UART -->
  <rect x="480" y="225" width="450" height="140" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="480" y="225" width="450" height="28" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="495" y="244" font-size="13" font-weight="bold" fill="#2457d6">2. Послідовний інтерфейс UART (TXD / RXD)</text>

  <text x="495" y="268" font-size="12" font-weight="bold" fill="#1a1a1a">• Підключення:</text>
  <text x="600" y="268" font-size="12" fill="#2457d6">TX (ESP) ➔ RX (USB), RX (ESP)  TX (USB)</text>

  <text x="495" y="290" font-size="12" font-weight="bold" fill="#1a1a1a">• Логічний рівень:</text>
  <text x="612" y="290" font-size="12" fill="#1a1a1a">3.3V TTL (HIGH = 3.3 В, LOW = 0 В)</text>

  <text x="495" y="312" font-size="12" font-weight="bold" fill="#1a1a1a">• Узгодження рівня 5V:</text>
  <text x="645" y="312" font-size="12" fill="#c0392b">дільник напруги (1kΩ / 2kΩ) на RX ESP</text>

  <text x="495" y="334" font-size="12" font-weight="bold" fill="#1a1a1a">• Швидкість обміну:</text>
  <text x="625" y="334" font-size="12" fill="#1a1a1a">115200 бод (лог завантажника: 74880 бод)</text>

  <!-- Картка 3: Сигнали керування та автопрошивки -->
  <rect x="480" y="380" width="450" height="160" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="480" y="380" width="450" height="28" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="495" y="399" font-size="13" font-weight="bold" fill="#27ae60">3. Управління та автопрошивка (CH_PD, RST, GPIO0, GPIO2)</text>

  <text x="495" y="423" font-size="12" font-weight="bold" fill="#1a1a1a">• CH_PD (EN):</text>
  <text x="585" y="423" font-size="12" fill="#1a1a1a">підтяжка 10 кОм до VCC (LOW вимикає чип)</text>

  <text x="495" y="445" font-size="12" font-weight="bold" fill="#1a1a1a">• RST (Reset):</text>
  <text x="592" y="445" font-size="12" fill="#1a1a1a">підтяжка 10 кОм до VCC; активний LOW</text>

  <text x="495" y="467" font-size="12" font-weight="bold" fill="#1a1a1a">• GPIO0:</text>
  <text x="555" y="467" font-size="12" fill="#1a1a1a">підтяжка 10 кОм до VCC; 0V при старті = прошивка</text>

  <text x="495" y="489" font-size="12" font-weight="bold" fill="#1a1a1a">• GPIO2:</text>
  <text x="555" y="489" font-size="12" fill="#1a1a1a">підтяжка 10 кОм до VCC; під час старту має бути HIGH</text>

  <text x="495" y="511" font-size="12" font-weight="bold" fill="#1a1a1a">• Автоматизація:</text>
  <text x="605" y="511" font-size="12" fill="#2457d6">DTR/RTS через 2 NPN-транзистори (esptool reset)</text>
</svg>
