<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Diagram Title and Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Еволюція схем переведення ESP-01 у режим прошивання (Auto-Reset)</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Перехід від ручного натискання кнопок до автоматичного керування через сигнали DTR/RTS</text>

  <!-- PANEL 1: Manual Reset Circuit (Left) -->
  <rect x="40" y="80" width="420" height="410" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <rect x="40" y="80" width="420" height="36" fill="#c0392b"/>
  <text x="250" y="103" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Ручне керування (Кнопки FLASH та RESET)</text>

  <!-- USB-UART Block (Manual) -->
  <rect x="55" y="135" width="110" height="200" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="110" y="155" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">USB-UART</text>
  <text x="110" y="185" font-size="12" fill="#1a1a1a" text-anchor="middle">TXD → RXD</text>
  <text x="110" y="215" font-size="12" fill="#1a1a1a" text-anchor="middle">RXD ← TXD</text>
  <text x="110" y="245" font-size="12" fill="#c0392b" text-anchor="middle">3.3V (VCC)</text>
  <text x="110" y="275" font-size="12" fill="#1a1a1a" text-anchor="middle">GND (0В)</text>
  <text x="110" y="310" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Без DTR / RTS</text>

  <!-- Manual Buttons Stage -->
  <rect x="180" y="135" width="125" height="200" rx="6" fill="white" stroke="#c0392b" stroke-width="1.5"/>
  <text x="242" y="155" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вузол кнопок</text>

  <rect x="190" y="175" width="105" height="60" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="242" y="195" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Кнопка RESET</text>
  <text x="242" y="215" font-size="12" fill="#1a1a1a" text-anchor="middle">RST → GND</text>

  <rect x="190" y="250" width="105" height="60" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="242" y="270" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Кнопка FLASH</text>
  <text x="242" y="290" font-size="12" fill="#1a1a1a" text-anchor="middle">GPIO0 → GND</text>

  <!-- ESP-01 Target (Manual) -->
  <rect x="320" y="135" width="125" height="200" rx="6" fill="white" stroke="#c0392b" stroke-width="1.5"/>
  <text x="382" y="155" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ESP-01</text>
  <text x="382" y="195" font-size="12" fill="#1a1a1a" text-anchor="middle">RST (Pin 7)</text>
  <text x="382" y="270" font-size="12" fill="#1a1a1a" text-anchor="middle">GPIO0 (Pin 3)</text>

  <!-- Connecting lines inside Manual Panel -->
  <line x1="295" y1="205" x2="320" y2="195" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="295" y1="280" x2="320" y2="270" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Manual Bottom Description Panel -->
  <rect x="55" y="350" width="390" height="125" rx="6" fill="white" stroke="#c0392b" stroke-width="1.5"/>
  <text x="65" y="370" font-size="12" font-weight="bold" fill="#c0392b">Алгоритм ручного прошивання:</text>
  <text x="75" y="392" font-size="12" fill="#1a1a1a">1. Затиснути кнопку FLASH (GPIO0 = 0)</text>
  <text x="75" y="412" font-size="12" fill="#1a1a1a">2. Натиснути та відпустити RESET (RST = 0)</text>
  <text x="75" y="432" font-size="12" fill="#1a1a1a">3. Відпустити FLASH після старту завантаження</text>
  <text x="75" y="457" font-size="12" font-weight="bold" fill="#c0392b">⛔ Ручна процедура, ризик помилок таймінгу</text>

  <!-- PANEL 2: Auto-Reset Transistor Circuit (Right) -->
  <rect x="500" y="80" width="420" height="410" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <rect x="500" y="80" width="420" height="36" fill="#27ae60"/>
  <text x="710" y="103" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Автомат Auto-Reset (DTR / RTS + 2×NPN)</text>

  <!-- USB-UART Block (Auto-Reset) -->
  <rect x="515" y="135" width="95" height="200" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="562" y="155" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">USB-UART</text>
  <text x="562" y="195" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">DTR</text>
  <text x="562" y="270" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">RTS</text>
  <text x="562" y="310" font-size="12" fill="#6b7280" text-anchor="middle">Керування</text>

  <!-- Transistors Stage -->
  <rect x="625" y="135" width="145" height="200" rx="6" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <text x="697" y="155" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Автомат автоскиду</text>

  <rect x="635" y="170" width="125" height="65" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="697" y="188" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Транзистор Q1</text>
  <text x="697" y="206" font-size="12" fill="#6b7280" text-anchor="middle">NPN (S8050)</text>
  <text x="697" y="224" font-size="12" fill="#1a1a1a" text-anchor="middle">Керує RST</text>

  <rect x="635" y="250" width="125" height="65" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="697" y="268" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Транзистор Q2</text>
  <text x="697" y="286" font-size="12" fill="#6b7280" text-anchor="middle">NPN (S8050)</text>
  <text x="697" y="304" font-size="12" fill="#1a1a1a" text-anchor="middle">Керує GPIO0</text>

  <!-- ESP-01 Target (Auto-Reset) -->
  <rect x="785" y="135" width="120" height="200" rx="6" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <text x="845" y="155" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ESP-01</text>
  <text x="845" y="198" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">RST</text>
  <text x="845" y="278" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">GPIO0</text>

  <!-- Connecting lines inside Auto-Reset Panel -->
  <line x1="610" y1="195" x2="635" y2="195" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="610" y1="270" x2="635" y2="270" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="760" y1="198" x2="785" y2="198" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="760" y1="278" x2="785" y2="278" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Auto-Reset Bottom Logic Panel -->
  <rect x="515" y="350" width="390" height="125" rx="6" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <text x="525" y="370" font-size="12" font-weight="bold" fill="#27ae60">Автоматичні стани сигналів DTR / RTS:</text>
  <text x="535" y="392" font-size="12" fill="#1a1a1a">• DTR=0, RTS=1 ⇒ Q1=ON (RST = 0)  [Скидання]</text>
  <text x="535" y="412" font-size="12" fill="#1a1a1a">• DTR=1, RTS=0 ⇒ Q2=ON (IO0 = 0)  [Затискання]</text>
  <text x="535" y="432" font-size="12" fill="#1a1a1a">• DTR=1, RTS=1 ⇒ Q1=OFF, Q2=OFF  [Робочий старт]</text>
  <text x="535" y="457" font-size="12" font-weight="bold" fill="#27ae60">✓ Автоматична прошивка з esptool / Arduino IDE</text>

  <!-- Summary Legend Bar at bottom -->
  <rect x="160" y="492" width="640" height="22" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="507" font-size="12" fill="#1a1a1a" text-anchor="middle">Червоний: Ручне керування  |  Зелений: Автоматичний Auto-Reset  |  Синій: Сигнали DTR/RTS</text>
</svg>
