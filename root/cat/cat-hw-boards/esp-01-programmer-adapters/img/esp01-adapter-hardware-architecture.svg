<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Апаратна архітектура USB-адаптера для ESP-01</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Стабілізація живлення 3,3 В, конвертація USB-UART та кола підтяжки EN, RST, GPIO0, GPIO2</text>

  <!-- БЛОК 1: USB Type-A -->
  <rect x="30" y="90" width="130" height="310" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="95" y="115" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">USB Type-A</text>
  <text x="95" y="132" font-size="12" fill="#6b7280" text-anchor="middle">(вхід ПК)</text>

  <text x="150" y="170" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">+5V</text>
  <line x1="160" y1="175" x2="220" y2="175" stroke="#c0392b" stroke-width="2"/>

  <text x="150" y="290" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">D-</text>
  <line x1="160" y1="295" x2="220" y2="295" stroke="#2457d6" stroke-width="1.5"/>

  <text x="150" y="310" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">D+</text>
  <line x1="160" y1="315" x2="220" y2="315" stroke="#2457d6" stroke-width="1.5"/>

  <text x="150" y="370" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">GND</text>
  <line x1="160" y1="390" x2="220" y2="390" stroke="#1a1a1a" stroke-width="2"/>

  <!-- БЛОК 2: LDO-стабілятор 3.3 В -->
  <rect x="220" y="90" width="160" height="130" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="300" y="112" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">LDO-стабілятор</text>
  <text x="300" y="128" font-size="12" fill="#2457d6" text-anchor="middle">AMS1117-3.3</text>

  <text x="228" y="170" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">VIN</text>
  <text x="372" y="170" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">VOUT</text>
  <text x="300" y="212" font-size="12" fill="#6b7280" text-anchor="middle">GND</text>

  <!-- Заземлення LDO обведене навколо блоку USB-UART -->
  <line x1="300" y1="220" x2="300" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="300" y1="240" x2="205" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="205" y1="240" x2="205" y2="390" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="205" cy="390" r="3" fill="#1a1a1a"/>

  <!-- Фільтруючий конденсатор C1 (Вхід 5 В) -->
  <circle cx="190" cy="175" r="3" fill="#c0392b"/>
  <line x1="190" y1="175" x2="190" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="180" y1="200" x2="200" y2="200" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="180" y1="210" x2="200" y2="210" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="190" y1="210" x2="190" y2="390" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="190" cy="390" r="3" fill="#1a1a1a"/>

  <text x="175" y="202" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">C1</text>
  <text x="175" y="217" font-size="12" fill="#6b7280" text-anchor="end">10 мкФ</text>

  <!-- Фільтруючий конденсатор C2 (Вихід 3.3 В) -->
  <circle cx="410" cy="175" r="3" fill="#27ae60"/>
  <line x1="410" y1="175" x2="410" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="400" y1="200" x2="420" y2="200" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="400" y1="210" x2="420" y2="210" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="410" y1="210" x2="410" y2="390" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="410" cy="390" r="3" fill="#1a1a1a"/>

  <text x="430" y="202" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">C2</text>
  <text x="430" y="217" font-size="12" fill="#6b7280" text-anchor="start">10 мкФ</text>

  <!-- Шина +3.3V -->
  <line x1="380" y1="175" x2="720" y2="175" stroke="#27ae60" stroke-width="2.5"/>

  <!-- БЛОК 3: USB-UART Мост -->
  <rect x="220" y="260" width="160" height="130" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5" rx="6"/>
  <text x="300" y="285" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">USB-UART мост</text>
  <text x="300" y="302" font-size="12" fill="#6b7280" text-anchor="middle">CH340G / CP2102</text>

  <text x="228" y="290" font-size="12" fill="#2457d6" text-anchor="start">D-</text>
  <text x="228" y="310" font-size="12" fill="#2457d6" text-anchor="start">D+</text>

  <text x="372" y="320" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">TXD</text>
  <text x="372" y="350" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">RXD</text>
  <text x="300" y="375" font-size="12" fill="#6b7280" text-anchor="middle">GND</text>
  <circle cx="300" cy="390" r="3" fill="#1a1a1a"/>

  <!-- Сигнали UART TX/RX -->
  <path d="M 380,325 L 450,325 L 450,350 L 720,350" stroke="#2457d6" stroke-width="1.5" fill="none" marker-end="url(#arr-blue)"/>
  <path d="M 720,370 L 440,370 L 440,355 L 380,355" stroke="#2457d6" stroke-width="1.5" fill="none" marker-end="url(#arr-blue)"/>

  <!-- Підтяжки R1, R2, R3, R4 -->
  <!-- R1 10k (EN) -->
  <circle cx="480" cy="175" r="3" fill="#27ae60"/>
  <line x1="480" y1="175" x2="480" y2="195" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="472" y="195" width="16" height="30" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="468" y="213" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">R1 10k</text>
  <line x1="480" y1="225" x2="480" y2="235" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="480" y1="235" x2="720" y2="235" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="480" cy="235" r="3" fill="#1a1a1a"/>

  <!-- R2 10k (RST) -->
  <circle cx="540" cy="175" r="3" fill="#27ae60"/>
  <line x1="540" y1="175" x2="540" y2="195" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="532" y="195" width="16" height="30" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="528" y="213" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">R2 10k</text>
  <line x1="540" y1="225" x2="540" y2="265" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="540" y1="265" x2="720" y2="265" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="540" cy="265" r="3" fill="#1a1a1a"/>

  <!-- R3 10k (GPIO0) та кнопка FLASH -->
  <circle cx="600" cy="175" r="3" fill="#27ae60"/>
  <line x1="600" y1="175" x2="600" y2="195" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="592" y="195" width="16" height="30" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="588" y="213" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">R3 10k</text>
  <line x1="600" y1="225" x2="600" y2="295" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="600" y1="295" x2="720" y2="295" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="600" cy="295" r="3" fill="#2457d6"/>

  <!-- Кнопка FLASH (PROG) до GND -->
  <line x1="600" y1="295" x2="600" y2="320" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="600" cy="320" r="3" fill="#2457d6"/>
  <line x1="592" y1="328" x2="608" y2="328" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="600" y1="328" x2="600" y2="335" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="600" y1="335" x2="600" y2="390" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="600" cy="390" r="3" fill="#1a1a1a"/>
  <text x="588" y="342" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">FLASH (PROG)</text>

  <!-- R4 10k (GPIO2) -->
  <circle cx="660" cy="175" r="3" fill="#27ae60"/>
  <line x1="660" y1="175" x2="660" y2="195" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="652" y="195" width="16" height="30" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="648" y="213" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">R4 10k</text>
  <line x1="660" y1="225" x2="660" y2="325" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="660" y1="325" x2="720" y2="325" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="660" cy="325" r="3" fill="#1a1a1a"/>

  <!-- Загальна шина GND -->
  <line x1="160" y1="390" x2="720" y2="390" stroke="#1a1a1a" stroke-width="2"/>

  <!-- БЛОК 5: Роз'єм 2x4 ESP-01 -->
  <rect x="720" y="90" width="210" height="310" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="8"/>
  <text x="825" y="115" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Роз'єм 2x4 (ESP-01)</text>
  <text x="825" y="132" font-size="12" fill="#1a1a1a" text-anchor="middle">Модуль ESP8266</text>

  <text x="735" y="170" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">1. 3.3V (VCC)</text>
  <text x="735" y="230" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">2. EN (CH_PD)</text>
  <text x="735" y="260" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">3. RST</text>
  <text x="735" y="290" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">4. GPIO0</text>
  <text x="735" y="320" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">5. GPIO2</text>
  <text x="735" y="345" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">6. RXD (← TXD)</text>
  <text x="735" y="365" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">7. TXD (→ RXD)</text>
  <text x="735" y="385" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">8. GND</text>

  <!-- Нижня примітка -->
  <rect x="30" y="415" width="900" height="42" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="480" y="432" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">✔ Стабільне живлення 3,3 В (LDO) + резистивні підтяжки (EN, RST, GPIO0, GPIO2) забезпечують надійну роботу</text>
  <text x="480" y="448" font-size="12" fill="#1a1a1a" text-anchor="middle">Для переходу в режим прошивки (Flash mode) вивід GPIO0 замикається на GND під час скидання (Reset)</text>
</svg>
