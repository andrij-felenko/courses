<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема автоскидання ESP-01 на двох NPN-транзисторах</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Сигнали DTR та RTS почергово переводять GPIO0 в LOW та формують імпульс скидання RST</text>

  <!-- Panel 1: USB-UART -->
  <rect x="30" y="75" width="170" height="245" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="115" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">USB-UART міст</text>
  <text x="115" y="116" font-size="12" fill="#6b7280" text-anchor="middle">(CH340 / CP2102)</text>
  <rect x="50" y="135" width="130" height="135" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="115" y="195" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">USB-UART</text>
  <text x="115" y="215" font-size="12" fill="#6b7280" text-anchor="middle">Контролер</text>
  <text x="172" y="156" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">DTR</text>
  <text x="172" y="236" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">RTS</text>

  <!-- Signal Lines from USB-UART -->
  <line x1="180" y1="160" x2="230" y2="160" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="180" y1="240" x2="230" y2="240" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Panel 2: Transistor Circuit -->
  <rect x="230" y="75" width="460" height="245" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="460" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Транзисторний вузол автоскидання</text>

  <!-- Line Labels in Panel 2 -->
  <text x="238" y="152" font-size="12" font-weight="bold" fill="#2457d6">DTR</text>
  <text x="238" y="232" font-size="12" font-weight="bold" fill="#2457d6">RTS</text>

  <!-- DTR internal wiring -->
  <line x1="230" y1="160" x2="432" y2="160" stroke="#2457d6" stroke-width="2"/>
  <circle cx="310" cy="160" r="3.5" fill="#2457d6"/>
  <line x1="310" y1="160" x2="310" y2="230" stroke="#2457d6" stroke-width="2"/>
  <rect x="302" y="230" width="16" height="30" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="2"/>
  <text x="325" y="248" font-size="12" fill="#1a1a1a">R2 10k</text>
  <line x1="310" y1="260" x2="370" y2="260" stroke="#2457d6" stroke-width="2"/>

  <!-- RTS internal wiring -->
  <line x1="230" y1="240" x2="432" y2="240" stroke="#2457d6" stroke-width="2"/>
  <circle cx="310" cy="240" r="3.5" fill="#2457d6"/>
  <line x1="310" y1="240" x2="310" y2="170" stroke="#2457d6" stroke-width="2"/>
  <rect x="302" y="140" width="16" height="30" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="2"/>
  <text x="325" y="158" font-size="12" fill="#1a1a1a">R1 10k</text>
  <line x1="310" y1="140" x2="370" y2="140" stroke="#2457d6" stroke-width="2"/>

  <!-- Transistor Q1 (Top, NPN) -->
  <circle cx="420" cy="140" r="22" fill="none" stroke="#d0d7de" stroke-dasharray="3,3"/>
  <line x1="408" y1="128" x2="408" y2="152" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="370" y1="140" x2="408" y2="140" stroke="#2457d6" stroke-width="2"/>
  <line x1="408" y1="133" x2="432" y2="115" stroke="#c0392b" stroke-width="2"/>
  <line x1="408" y1="147" x2="432" y2="160" stroke="#2457d6" stroke-width="2"/>
  <polygon points="424,152 432,160 422,160" fill="#2457d6"/>
  <text x="445" y="144" font-size="12" font-weight="bold" fill="#1a1a1a">Q1 (NPN)</text>

  <!-- Transistor Q2 (Bottom, NPN) -->
  <circle cx="420" cy="260" r="22" fill="none" stroke="#d0d7de" stroke-dasharray="3,3"/>
  <line x1="408" y1="248" x2="408" y2="272" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="370" y1="260" x2="408" y2="260" stroke="#2457d6" stroke-width="2"/>
  <line x1="408" y1="253" x2="432" y2="240" stroke="#2457d6" stroke-width="2"/>
  <polygon points="422,240 432,240 424,248" fill="#2457d6"/>
  <line x1="408" y1="267" x2="432" y2="285" stroke="#27ae60" stroke-width="2"/>
  <text x="445" y="264" font-size="12" font-weight="bold" fill="#1a1a1a">Q2 (NPN)</text>

  <!-- Outputs from Panel 2 to Panel 3 -->
  <line x1="432" y1="115" x2="685" y2="115" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="590" y="107" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">RST (Reset)</text>

  <line x1="432" y1="285" x2="685" y2="285" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="590" y="277" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">GPIO0 (Boot Mode)</text>

  <!-- Panel 3: ESP-01 Module -->
  <rect x="710" y="75" width="220" height="245" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="820" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Модуль ESP-01 / ESP-01S</text>

  <!-- RST pin inside ESP-01 -->
  <line x1="685" y1="115" x2="765" y2="115" stroke="#c0392b" stroke-width="2"/>
  <text x="720" y="108" font-size="12" font-weight="bold" fill="#c0392b">RST</text>
  <circle cx="765" cy="115" r="3.5" fill="#c0392b"/>
  <path d="M765,115 L800,115 L800,155 L825,155" fill="none" stroke="#c0392b" stroke-width="1.5"/>

  <!-- RST pull-up resistor -->
  <line x1="765" y1="115" x2="765" y2="130" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="757" y="130" width="16" height="30" fill="#ffffff" stroke="#c0392b" stroke-width="1.5" rx="2"/>
  <text x="778" y="150" font-size="12" fill="#6b7280">10k</text>
  <line x1="765" y1="160" x2="765" y2="185" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Power node +3.3V -->
  <text x="765" y="200" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">+3.3V</text>

  <!-- GPIO0 pull-up resistor -->
  <line x1="765" y1="205" x2="765" y2="230" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="757" y="230" width="16" height="30" fill="#ffffff" stroke="#27ae60" stroke-width="1.5" rx="2"/>
  <text x="778" y="250" font-size="12" fill="#6b7280">10k</text>
  <line x1="765" y1="260" x2="765" y2="285" stroke="#27ae60" stroke-width="1.5"/>

  <!-- GPIO0 pin inside ESP-01 -->
  <line x1="685" y1="285" x2="765" y2="285" stroke="#27ae60" stroke-width="2"/>
  <text x="720" y="278" font-size="12" font-weight="bold" fill="#27ae60">GPIO0</text>
  <circle cx="765" cy="285" r="3.5" fill="#27ae60"/>
  <path d="M765,285 L800,285 L800,245 L825,245" fill="none" stroke="#27ae60" stroke-width="1.5"/>

  <!-- MCU Core box inside ESP-01 -->
  <rect x="825" y="135" width="90" height="165" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="870" y="195" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ESP8266EX</text>
  <text x="870" y="215" font-size="12" fill="#6b7280" text-anchor="middle">MCU Core</text>

  <!-- Panel 4: Timing sequence & logic states -->
  <rect x="30" y="335" width="900" height="165" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="358" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Послідовність сигналів для входу в режим прошивки (Bootloader)</text>

  <!-- Card 1 -->
  <rect x="45" y="372" width="205" height="115" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="147.5" y="392" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Очікування</text>
  <text x="60" y="414" font-size="12" fill="#6b7280">DTR=1 (HIGH) | RTS=1</text>
  <text x="60" y="432" font-size="12" fill="#6b7280">Q1: OFF | Q2: OFF</text>
  <rect x="60" y="446" width="175" height="24" rx="3" fill="#eaf0fd"/>
  <text x="147.5" y="462" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">RST=1, GPIO0=1 (Run)</text>

  <!-- Card 2 -->
  <rect x="265" y="372" width="205" height="115" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="367.5" y="392" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Готовність Boot</text>
  <text x="280" y="414" font-size="12" fill="#6b7280">DTR=1 (HIGH) | RTS=0</text>
  <text x="280" y="432" font-size="12" fill="#6b7280">Q1: OFF | Q2: ON</text>
  <rect x="280" y="446" width="175" height="24" rx="3" fill="#e9f7ef"/>
  <text x="367.5" y="462" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">GPIO0 -&gt; 0V (LOW)</text>

  <!-- Card 3 -->
  <rect x="485" y="372" width="205" height="115" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="587.5" y="392" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3. Скидання (Reset)</text>
  <text x="500" y="414" font-size="12" fill="#6b7280">DTR=0 (LOW) | RTS=1</text>
  <text x="500" y="432" font-size="12" fill="#6b7280">Q1: ON | Q2: OFF</text>
  <rect x="500" y="446" width="175" height="24" rx="3" fill="#fdecea"/>
  <text x="587.5" y="462" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">RST -&gt; 0V (Reset Pulse)</text>

  <!-- Card 4 -->
  <rect x="705" y="372" width="205" height="115" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="807.5" y="392" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">4. Вхід у Flash</text>
  <text x="720" y="414" font-size="12" fill="#6b7280">DTR=0 (LOW) | RTS=0</text>
  <text x="720" y="432" font-size="12" fill="#6b7280">Q1: OFF | Q2: OFF</text>
  <rect x="720" y="446" width="175" height="24" rx="3" fill="#e9f7ef"/>
  <text x="807.5" y="462" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">BOOTLOADER MODE</text>
</svg>
