<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Маркери стрілок -->
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема доопрацювання USB-адаптера ESP-01 під автоматичне скидання</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Точки підключення NPN-транзисторів Q1/Q2, кнопок Reset/Flash та керамічного шунта 0.1 мкФ</text>

  <!-- Блок 1: МІКРОСХЕМА CH340G -->
  <rect x="35" y="80" width="250" height="450" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <rect x="35" y="80" width="250" height="36" rx="8" fill="#eaf0fd"/>
  <text x="160" y="103" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Мікросхема CH340G</text>

  <!-- Корпус чипа SOP-16 -->
  <rect x="85" y="135" width="135" height="370" rx="4" fill="#2d3748" stroke="#1a202c" stroke-width="2"/>
  <!-- Виїмка першого виводу -->
  <circle cx="105" cy="155" r="5" fill="#a0aec0"/>
  <text x="152.5" y="165" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">CH340G (SOP-16)</text>

  <!-- Виводи CH340G -->
  <!-- Pin 13: DTR -->
  <rect x="220" y="200" width="25" height="14" fill="#cbd5e0"/>
  <text x="210" y="211" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="end">DTR (13)</text>

  <!-- Pin 14: RTS -->
  <rect x="220" y="260" width="25" height="14" fill="#cbd5e0"/>
  <text x="210" y="271" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="end">RTS (14)</text>

  <!-- Pin 15: TXD -->
  <rect x="220" y="320" width="25" height="14" fill="#cbd5e0"/>
  <text x="210" y="331" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="end">TXD (15)</text>

  <!-- Pin 16: RXD -->
  <rect x="220" y="380" width="25" height="14" fill="#cbd5e0"/>
  <text x="210" y="391" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="end">RXD (16)</text>

  <!-- Pin 4: V3 LDO cap -->
  <rect x="60" y="440" width="25" height="14" fill="#cbd5e0"/>
  <text x="95" y="451" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="start">V3 (4)</text>
  <path d="M 60 447 L 50 447 L 50 480" stroke="#6b7280" stroke-width="2" fill="none"/>
  <rect x="40" y="480" width="40" height="24" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="60" y="496" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">100nF</text>
  <text x="60" y="516" font-size="11" fill="#6b7280" text-anchor="middle">до GND</text>

  <!-- Блок 2: СХЕМА МОДИФІКАЦІЇ (AUTO-RESET & BUTTONS) -->
  <rect x="315" y="80" width="330" height="450" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <rect x="315" y="80" width="330" height="36" rx="8" fill="#e9f7ef"/>
  <text x="480" y="103" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Вузол автоскидання та кнопок</text>

  <!-- Транзистор Q1 (Auto-Reset RST) -->
  <rect x="330" y="135" width="140" height="70" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
  <text x="400" y="155" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Q1 (NPN S8050)</text>
  <text x="400" y="173" font-size="11" fill="#1a1a1a" text-anchor="middle">База: RTS (10 кОм)</text>
  <text x="400" y="191" font-size="11" fill="#6b7280" text-anchor="middle">Колектор -&gt; RST</text>

  <!-- Кнопка SW1 (RESET) -->
  <rect x="490" y="135" width="140" height="70" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="560" y="155" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Кнопка RESET</text>
  <text x="560" y="173" font-size="11" fill="#1a1a1a" text-anchor="middle">Тактова (SW1)</text>
  <text x="560" y="191" font-size="11" fill="#6b7280" text-anchor="middle">Замикає RST на GND</text>

  <!-- Транзистор Q2 (Auto-Reset IO0) -->
  <rect x="330" y="225" width="140" height="70" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
  <text x="400" y="245" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Q2 (NPN S8050)</text>
  <text x="400" y="263" font-size="11" fill="#1a1a1a" text-anchor="middle">База: DTR (10 кОм)</text>
  <text x="400" y="281" font-size="11" fill="#6b7280" text-anchor="middle">Колектор -&gt; IO0</text>

  <!-- Кнопка SW2 (FLASH / BOOT) -->
  <rect x="490" y="225" width="140" height="70" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="560" y="245" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Кнопка FLASH</text>
  <text x="560" y="263" font-size="11" fill="#1a1a1a" text-anchor="middle">Тактова (SW2)</text>
  <text x="560" y="281" font-size="11" fill="#6b7280" text-anchor="middle">Замикає IO0 на GND</text>

  <!-- Конденсатор C1 (Шунтувальний конденсатор 0.1 мкФ) -->
  <rect x="330" y="315" width="300" height="65" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
  <text x="480" y="338" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Шунтувальний конденсатор C1 (0.1 мкФ MLCC)</text>
  <text x="480" y="360" font-size="11" fill="#6b7280" text-anchor="middle">Впаюється між штирями 3V3 та GND роз'єму</text>

  <!-- Пояснювальний блок знизу -->
  <rect x="330" y="400" width="300" height="110" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="422" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Режими скидання та прошивання:</text>
  <text x="480" y="444" font-size="11" fill="#1a1a1a" text-anchor="middle">• Автоскид: DTR / RTS керують ключами Q1 та Q2</text>
  <text x="480" y="464" font-size="11" fill="#1a1a1a" text-anchor="middle">• Ручний режим: кнопки SW1 (RST) та SW2 (IO0)</text>
  <text x="480" y="484" font-size="11" fill="#6b7280" text-anchor="middle">• Живлення: шунт C1 усуває просідання напруги</text>

  <!-- Блок 3: РОЗ'ЄМ ESP-01 -->
  <rect x="675" y="80" width="250" height="450" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <rect x="675" y="80" width="250" height="36" rx="8" fill="#eaf0fd"/>
  <text x="800" y="103" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Роз'єм плашки ESP-01</text>

  <!-- Pin 1: 3V3 -->
  <rect x="690" y="130" width="220" height="36" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="710" cy="148" r="6" fill="#c0392b"/>
  <text x="725" y="152" font-size="12" font-weight="bold" fill="#1a1a1a">Pin 1: 3V3 (Живлення 3.3В)</text>

  <!-- Pin 2: RST -->
  <rect x="690" y="175" width="220" height="36" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="710" cy="193" r="6" fill="#27ae60"/>
  <text x="725" y="197" font-size="12" font-weight="bold" fill="#1a1a1a">Pin 2: RST (Скидання)</text>

  <!-- Pin 3: EN / CH_PD -->
  <rect x="690" y="220" width="220" height="36" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="710" cy="238" r="6" fill="#2457d6"/>
  <text x="725" y="242" font-size="12" font-weight="bold" fill="#1a1a1a">Pin 3: EN / CH_PD (3.3В)</text>

  <!-- Pin 4: TXD -->
  <rect x="690" y="265" width="220" height="36" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="710" cy="283" r="6" fill="#6b7280"/>
  <text x="725" y="287" font-size="12" font-weight="bold" fill="#1a1a1a">Pin 4: TXD (Передача UART)</text>

  <!-- Pin 5: RXD -->
  <rect x="690" y="310" width="220" height="36" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="710" cy="328" r="6" fill="#6b7280"/>
  <text x="725" y="332" font-size="12" font-weight="bold" fill="#1a1a1a">Pin 5: RXD (Прийом UART)</text>

  <!-- Pin 6: IO0 -->
  <rect x="690" y="355" width="220" height="36" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="710" cy="373" r="6" fill="#27ae60"/>
  <text x="725" y="377" font-size="12" font-weight="bold" fill="#1a1a1a">Pin 6: IO0 (Режим Boot)</text>

  <!-- Pin 7: IO2 -->
  <rect x="690" y="400" width="220" height="36" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="710" cy="418" r="6" fill="#6b7280"/>
  <text x="725" y="422" font-size="12" font-weight="bold" fill="#1a1a1a">Pin 7: IO2 (старт з High)</text>

  <!-- Pin 8: GND -->
  <rect x="690" y="445" width="220" height="36" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="710" cy="463" r="6" fill="#1a1a1a"/>
  <text x="725" y="467" font-size="12" font-weight="bold" fill="#1a1a1a">Pin 8: GND (Спільна земля)</text>

  <!-- З'ЄДНУВАЛЬНІ ЛІНІЇ (ПРОДРІТИ) -->
  <!-- DTR від CH340 до Q2 -->
  <path d="M 245 207 L 298 207 L 298 260 L 330 260" stroke="#2457d6" stroke-width="2" fill="none" marker-end="url(#arr-blue)"/>

  <!-- RTS від CH340 до Q1 -->
  <path d="M 245 267 L 290 267 L 290 170 L 330 170" stroke="#2457d6" stroke-width="2" fill="none" marker-end="url(#arr-blue)"/>

  <!-- RST від Q1/SW1 до Pin 2 ESP-01 -->
  <path d="M 470 170 L 490 170" stroke="#27ae60" stroke-width="2" fill="none"/>
  <path d="M 630 170 L 652 170 L 652 193 L 690 193" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>

  <!-- IO0 від Q2/SW2 до Pin 6 ESP-01 -->
  <path d="M 470 260 L 490 260" stroke="#27ae60" stroke-width="2" fill="none"/>
  <path d="M 630 260 L 670 260 L 670 373 L 690 373" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>

  <!-- TXD від CH340 до Pin 5 RXD ESP-01 -->
  <path d="M 245 327 L 275 327 L 275 302 L 658 302 L 658 328 L 690 328" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arr-dark)"/>

  <!-- RXD від CH340 до Pin 4 TXD ESP-01 -->
  <path d="M 245 387 L 282 387 L 282 390 L 664 390 L 664 283 L 690 283" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3" fill="none" marker-end="url(#arr-dark)"/>
</svg>
