<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="580" fill="white"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема автоматичного скидання та прошивання ESP-01</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Сигнали DTR/RTS керують транзисторними ключами Q1/Q2 для автоматичного вибору режиму Bootloader</text>

  <!-- USB-UART Block (Left) -->
  <rect x="30" y="85" width="130" height="380" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="30" y="85" width="130" height="30" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="95" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">USB-UART міст</text>

  <!-- USB Pins -->
  <text x="148" y="134" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">5V</text>
  <circle cx="160" cy="130" r="3.5" fill="#c0392b"/>

  <text x="148" y="174" text-anchor="end" font-size="12" fill="#1a1a1a">GND</text>
  <circle cx="160" cy="170" r="3.5" fill="#1a1a1a"/>

  <text x="148" y="254" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">DTR</text>
  <circle cx="160" cy="250" r="3.5" fill="#2457d6"/>

  <text x="148" y="334" text-anchor="end" font-size="12" font-weight="bold" fill="#8e44ad">RTS</text>
  <circle cx="160" cy="330" r="3.5" fill="#8e44ad"/>

  <text x="148" y="394" text-anchor="end" font-size="12" fill="#1a1a1a">TXD</text>
  <circle cx="160" cy="390" r="3.5" fill="#1a1a1a"/>

  <text x="148" y="434" text-anchor="end" font-size="12" fill="#1a1a1a">RXD</text>
  <circle cx="160" cy="430" r="3.5" fill="#1a1a1a"/>

  <!-- LDO Regulator (Top Middle) -->
  <rect x="200" y="85" width="120" height="70" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="260" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">LDO 3.3V</text>
  <text x="260" y="122" text-anchor="middle" font-size="12" fill="#6b7280">AMS1117-3.3</text>
  
  <!-- LDO Pins -->
  <text x="210" y="148" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">VIN</text>
  <text x="310" y="148" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">VOUT</text>
  <text x="260" y="148" text-anchor="middle" font-size="12" fill="#1a1a1a">GND</text>

  <!-- 5V Wire to LDO -->
  <path d="M 160 130 L 200 130" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="180" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">+5V</text>

  <!-- 3.3V Power Bus -->
  <path d="M 320 130 L 660 130" stroke="#27ae60" stroke-width="2.5"/>
  <text x="490" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Шина живлення +3.3V DC</text>
  <circle cx="320" cy="130" r="3.5" fill="#27ae60"/>

  <!-- Decoupling Capacitors C1 & C2 -->
  <!-- C1 10uF -->
  <line x1="350" y1="130" x2="350" y2="145" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="342" y1="145" x2="358" y2="145" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="342" y1="150" x2="358" y2="150" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="350" y1="150" x2="350" y2="170" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="362" y="152" font-size="12" fill="#6b7280" text-anchor="start">C1 10µF</text>
  <circle cx="350" cy="130" r="3" fill="#27ae60"/>

  <!-- C2 100nF -->
  <line x1="430" y1="130" x2="430" y2="145" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="422" y1="145" x2="438" y2="145" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="422" y1="150" x2="438" y2="150" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="430" y1="150" x2="430" y2="170" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="442" y="152" font-size="12" fill="#6b7280" text-anchor="start">C2 100nF</text>
  <circle cx="430" cy="130" r="3" fill="#27ae60"/>

  <!-- Top GND Line for LDO & Capacitors -->
  <path d="M 260 152 L 260 170 L 430 170" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 260 170 L 180 170 L 180 495" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="260" cy="170" r="3" fill="#1a1a1a"/>
  <circle cx="350" cy="170" r="3" fill="#1a1a1a"/>
  <circle cx="430" cy="170" r="3" fill="#1a1a1a"/>

  <!-- Auto-Reset Subsystem Box (Center) -->
  <rect x="195" y="190" width="440" height="250" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="195" y="190" width="440" height="28" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="415" y="209" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Вузол автоматичного скидання (Auto-Reset Circuit)</text>

  <!-- Power Bus Entry into Auto-Reset Box -->
  <line x1="520" y1="130" x2="520" y2="230" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="520" cy="130" r="3" fill="#27ae60"/>
  <line x1="450" y1="230" x2="590" y2="230" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Pull-Up Resistors R_PU1, R_PU2, R_PU3 -->
  <!-- R_PU1 (RST) at x=450 -->
  <line x1="450" y1="230" x2="450" y2="242" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="444" y="242" width="12" height="28" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="450" y1="270" x2="450" y2="285" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="444" y="258" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">R_PU1 10k</text>
  <circle cx="450" cy="230" r="3" fill="#27ae60"/>
  <circle cx="450" cy="285" r="3" fill="#c0392b"/>

  <!-- R_PU2 (GPIO0) at x=520 -->
  <line x1="520" y1="230" x2="520" y2="242" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="514" y="242" width="12" height="28" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="520" y1="270" x2="520" y2="360" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="514" y="258" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">R_PU2 10k</text>
  <circle cx="520" cy="230" r="3" fill="#27ae60"/>
  <circle cx="520" cy="360" r="3" fill="#2457d6"/>

  <!-- R_PU3 (CH_PD) at x=590 -->
  <line x1="590" y1="230" x2="590" y2="242" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="584" y="242" width="12" height="28" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="590" y1="270" x2="590" y2="285" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="590" y1="285" x2="660" y2="285" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="584" y="258" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">R_PU3 10k</text>
  <circle cx="590" cy="230" r="3" fill="#27ae60"/>

  <!-- DTR & RTS Wires from USB-UART -->
  <!-- DTR Wire (Blue) -->
  <path d="M 160 250 L 210 250" stroke="#2457d6" stroke-width="2"/>
  <circle cx="210" cy="250" r="3.5" fill="#2457d6"/>
  <path d="M 210 250 L 210 315 L 325 315" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M 210 250 L 210 375 L 235 375" stroke="#2457d6" stroke-width="1.5"/>

  <!-- RTS Wire (Purple) -->
  <path d="M 160 330 L 205 330" stroke="#8e44ad" stroke-width="2"/>
  <circle cx="205" cy="330" r="3.5" fill="#8e44ad"/>
  <path d="M 205 330 L 205 300 L 235 300" stroke="#8e44ad" stroke-width="1.5"/>
  <path d="M 205 330 L 205 390 L 325 390" stroke="#8e44ad" stroke-width="1.5"/>

  <!-- Q1 Circuitry (Top Transistor NPN) -->
  <rect x="235" y="294" width="36" height="12" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="253" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">R1 10k</text>
  <line x1="271" y1="300" x2="310" y2="300" stroke="#1a1a1a" stroke-width="1.5"/>

  <circle cx="325" cy="300" r="18" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <line x1="315" y1="288" x2="315" y2="312" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="315" y1="294" x2="335" y2="285" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="315" y1="306" x2="335" y2="315" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="329,309 335,315 326,314" fill="#1a1a1a"/>
  <text x="325" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Q1 (NPN S8050)</text>

  <!-- Q1 Collector to RST Line -->
  <line x1="335" y1="285" x2="660" y2="285" stroke="#c0392b" stroke-width="2"/>
  <text x="370" y="278" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Лінія RST</text>

  <!-- Q2 Circuitry (Bottom Transistor NPN) -->
  <rect x="235" y="369" width="36" height="12" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="253" y="363" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">R2 10k</text>
  <line x1="271" y1="375" x2="310" y2="375" stroke="#1a1a1a" stroke-width="1.5"/>

  <circle cx="325" cy="375" r="18" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <line x1="315" y1="363" x2="315" y2="387" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="315" y1="369" x2="335" y2="360" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="315" y1="381" x2="335" y2="390" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="329,384 335,390 326,389" fill="#1a1a1a"/>
  <text x="325" y="412" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Q2 (NPN S8050)</text>

  <!-- Q2 Collector to GPIO0 Line -->
  <line x1="335" y1="360" x2="660" y2="360" stroke="#2457d6" stroke-width="2"/>
  <text x="370" y="353" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Лінія GPIO0</text>

  <!-- Manual Buttons (SW1 Flash & SW2 Reset) -->
  <!-- SW2 Reset Button (To GND) -->
  <line x1="450" y1="285" x2="450" y2="305" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="450" cy="305" r="2.5" fill="#1a1a1a"/>
  <circle cx="450" cy="325" r="2.5" fill="#1a1a1a"/>
  <line x1="444" y1="303" x2="456" y2="297" stroke="#6b7280" stroke-width="2"/>
  <rect x="446" y="290" width="10" height="5" fill="#6b7280"/>
  <line x1="450" y1="325" x2="450" y2="425" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="462" y="318" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="start">SW2 (Reset)</text>

  <!-- SW1 Flash Button (To GND) -->
  <line x1="520" y1="360" x2="520" y2="380" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="520" cy="380" r="2.5" fill="#1a1a1a"/>
  <circle cx="520" cy="400" r="2.5" fill="#1a1a1a"/>
  <line x1="514" y1="378" x2="526" y2="372" stroke="#2457d6" stroke-width="2"/>
  <rect x="516" y="365" width="10" height="5" fill="#2457d6"/>
  <line x1="520" y1="400" x2="520" y2="425" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="532" y="393" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">SW1 (Flash)</text>

  <!-- Subsystem GND Line inside Auto-Reset Box -->
  <line x1="205" y1="425" x2="625" y2="425" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 415 425 L 415 495" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- TXD & RXD Routed Below Auto-Reset Box -->
  <!-- TXD Line (dashed) -->
  <path d="M 160 390 L 170 390 L 170 452 L 645 452 L 645 415 L 660 415" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="310" y="447" font-size="12" fill="#6b7280" text-anchor="middle">TXD (пряме з'єднання)</text>

  <!-- RXD Line (dashed) -->
  <path d="M 160 430 L 170 430 L 170 467 L 652 467 L 652 390 L 660 390" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="310" y="479" font-size="12" fill="#6b7280" text-anchor="middle">RXD (пряме з'єднання)</text>

  <!-- Common GND Line at Bottom -->
  <line x1="180" y1="495" x2="635" y2="495" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 635 495 L 650 495 L 650 440 L 660 440" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- GND Symbols -->
  <line x1="415" y1="495" x2="415" y2="510" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="403" y1="510" x2="427" y2="510" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="408" y1="515" x2="422" y2="515" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="412" y1="520" x2="418" y2="520" stroke="#1a1a1a" stroke-width="1"/>
  <text x="415" y="534" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Спільна шина заземлення (GND)</text>

  <!-- ESP-01 Module Box (Right) -->
  <rect x="660" y="85" width="270" height="365" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <rect x="660" y="85" width="270" height="34" rx="8" fill="#27ae60"/>
  <text x="795" y="107" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Модуль ESP-01 (ESP8266)</text>
  <text x="795" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Розпіновка роз'єму Header 2x4</text>

  <!-- ESP-01 Pins -->
  <circle cx="660" cy="155" r="3.5" fill="#27ae60"/>
  <text x="672" y="159" font-size="12" font-weight="bold" fill="#27ae60">1: VCC (+3.3V)</text>

  <circle cx="660" cy="245" r="3.5" fill="#1a1a1a"/>
  <text x="672" y="249" font-size="12" font-weight="bold" fill="#1a1a1a">2: CH_PD / EN (High)</text>

  <circle cx="660" cy="285" r="3.5" fill="#c0392b"/>
  <text x="672" y="289" font-size="12" font-weight="bold" fill="#c0392b">3: RST (Скидання)</text>

  <text x="672" y="324" font-size="12" fill="#6b7280">5: GPIO2 (High при старті)</text>

  <circle cx="660" cy="360" r="3.5" fill="#2457d6"/>
  <text x="672" y="364" font-size="12" font-weight="bold" fill="#2457d6">4: GPIO0 (Режим Boot)</text>

  <circle cx="660" cy="390" r="3.5" fill="#6b7280"/>
  <text x="672" y="394" font-size="12" fill="#1a1a1a">7: RXD (до TXD USB)</text>

  <circle cx="660" cy="415" r="3.5" fill="#6b7280"/>
  <text x="672" y="419" font-size="12" fill="#1a1a1a">8: TXD (до RXD USB)</text>

  <circle cx="660" cy="440" r="3.5" fill="#1a1a1a"/>
  <text x="672" y="444" font-size="12" font-weight="bold" fill="#1a1a1a">6: GND (Земля)</text>

  <!-- Mode Logic / Truth Table Panel (Bottom Right) -->
  <rect x="660" y="468" width="270" height="100" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="795" y="485" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Логіка режимів DTR / RTS</text>
  <line x1="670" y1="491" x2="920" y2="491" stroke="#d0d7de" stroke-width="1"/>

  <text x="672" y="507" font-size="12" fill="#1a1a1a">DTR=1, RTS=1 → RST=1, GPIO0=1 (Робота)</text>
  <text x="672" y="524" font-size="12" fill="#c0392b">DTR=0, RTS=1 → RST=0, GPIO0=1 (Reset)</text>
  <text x="672" y="541" font-size="12" fill="#2457d6">DTR=1, RTS=0 → RST=1, GPIO0=0 (Flash)</text>
  <text x="672" y="558" font-size="12" fill="#6b7280">DTR=0, RTS=0 → RST=1, GPIO0=1 (Пасив)</text>
</svg>
