<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Header -->
  <text x="480" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Осцилограма живлення 3.3 В та сигналів UART при роботі з некоректним USB-адаптером</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Піковий струм Wi-Fi провалює VCC &lt; 2.8 В, а 5 В TTL виходить за межі допустимих 3.3 В на вході RX</text>

  <!-- Definitions -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Outer Scope Container Box -->
  <rect x="40" y="80" width="880" height="340" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Plot Area Background -->
  <rect x="160" y="90" width="740" height="320" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Wi-Fi TX Burst Highlight Region -->
  <rect x="360" y="90" width="220" height="320" fill="#fdecea" opacity="0.45"/>
  <line x1="360" y1="90" x2="360" y2="410" stroke="#c0392b" stroke-dasharray="4,4" stroke-width="1.5"/>
  <line x1="580" y1="90" x2="580" y2="410" stroke="#c0392b" stroke-dasharray="4,4" stroke-width="1.5"/>
  <text x="470" y="107" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Спалах струму Wi-Fi (до 350-500 мА)</text>

  <!-- Reference Voltage Lines -->
  <!-- VCC 3.3V Nominal line -->
  <line x1="160" y1="120" x2="900" y2="120" stroke="#27ae60" stroke-dasharray="4,4" opacity="0.6"/>
  <!-- VCC 2.8V Brownout limit -->
  <line x1="160" y1="160" x2="900" y2="160" stroke="#c0392b" stroke-dasharray="4,4" stroke-width="1.2"/>
  <!-- RX 5.0V Level line -->
  <line x1="160" y1="230" x2="900" y2="230" stroke="#c0392b" stroke-dasharray="3,3" opacity="0.5"/>
  <!-- RX 3.3V Max safe line -->
  <line x1="160" y1="265" x2="900" y2="265" stroke="#27ae60" stroke-dasharray="3,3" opacity="0.5"/>
  <!-- RX 0V Baseline -->
  <line x1="160" y1="300" x2="900" y2="300" stroke="#d0d7de" stroke-width="1"/>
  <!-- TX 3.3V Nominal line -->
  <line x1="160" y1="350" x2="900" y2="350" stroke="#2457d6" stroke-dasharray="3,3" opacity="0.4"/>
  <!-- TX 0V Baseline -->
  <line x1="160" y1="400" x2="900" y2="400" stroke="#d0d7de" stroke-width="1"/>

  <!-- Y-Axis Signal Labels (Left of plot area) -->
  <!-- Channel 1: VCC -->
  <text x="152" y="105" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">VCC (Живлення)</text>
  <text x="152" y="124" text-anchor="end" font-size="11" fill="#27ae60">3.3 В (ном.)</text>
  <text x="152" y="164" text-anchor="end" font-size="11" fill="#c0392b">2.8 В (поріг)</text>

  <!-- Channel 2: UART RX -->
  <text x="152" y="222" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">UART RX (ESP-01)</text>
  <text x="152" y="235" text-anchor="end" font-size="11" fill="#c0392b">5.0 В (адаптер)</text>
  <text x="152" y="269" text-anchor="end" font-size="11" fill="#27ae60">3.3 В (макс.)</text>

  <!-- Channel 3: UART TX -->
  <text x="152" y="345" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">UART TX (ESP-01)</text>
  <text x="152" y="360" text-anchor="end" font-size="11" fill="#2457d6">3.3 В (лог. 1)</text>

  <!-- Trace 1: VCC Voltage Waveform -->
  <path d="M 160,120 L 360,120 L 375,185 L 390,178 L 410,186 L 430,175 L 450,188 L 470,180 L 490,187 L 510,178 L 530,185 L 560,180 L 585,120 L 900,120" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <!-- Normal segments highlighted in green -->
  <path d="M 160,120 L 360,120" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <path d="M 585,120 L 900,120" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- VCC Warning Badge -->
  <rect x="375" y="145" width="190" height="24" rx="4" fill="#c0392b"/>
  <text x="470" y="161" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Просідання VCC = 2.4 В &lt; 2.8 В!</text>

  <!-- Trace 2: UART RX Signals (5V pulses) -->
  <path d="M 160,300 L 180,300 L 180,230 L 220,230 L 220,300 L 250,300 L 250,230 L 310,230 L 310,300 L 340,300 L 340,230 L 400,230 L 400,300 L 440,300 L 440,230 L 520,230 L 520,300 L 550,300 L 550,230 L 620,230 L 620,300 L 670,300 L 670,230 L 730,230 L 730,300 L 760,300 L 760,230 L 840,230 L 840,300 L 900,300" fill="none" stroke="#c0392b" stroke-width="2"/>

  <!-- RX Warning Badge -->
  <rect x="230" y="208" width="130" height="20" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="295" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Перевищення 5.0 В!</text>

  <!-- Trace 3: UART TX Signals (3.3V pulses with drop during reset) -->
  <path d="M 160,400 L 190,400 L 190,350 L 230,350 L 230,400 L 270,400 L 270,350 L 320,350 L 320,400 L 360,400 L 590,400 L 610,400 L 610,350 L 625,350 L 625,400 L 660,400 L 660,350 L 670,350 L 670,400 L 740,400 L 740,350 L 755,350 L 755,400 L 900,400" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- TX Freeze Warning Badge -->
  <rect x="390" y="365" width="160" height="20" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="470" y="379" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Збій зв'язку (Reset / Freeze)</text>

  <!-- Bottom Summary Cards -->
  <!-- Card 1: Power Sag Problem -->
  <rect x="40" y="435" width="430" height="85" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="60" y="457" font-size="13" font-weight="bold" fill="#c0392b">Просідання напруги VCC &lt; 2.8 В (Brownout Reset)</text>
  <text x="60" y="477" font-size="12" fill="#1a1a1a">Піковий струм Wi-Fi (300–500 мА) перевантажує слабкий LDO 3.3В.</text>
  <text x="60" y="496" font-size="12" fill="#6b7280">Наслідок: скидання SoC і помилка «Timed out waiting for packet».</text>

  <!-- Card 2: RX Voltage Mismatch -->
  <rect x="490" y="435" width="430" height="85" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="510" y="457" font-size="13" font-weight="bold" fill="#c0392b">Невідповідність рівнів UART RX (5.0 В TTL)</text>
  <text x="510" y="477" font-size="12" fill="#1a1a1a">Дешеві адаптери подають 5 В на вхід RX (GPIO3) без подільника.</text>
  <text x="510" y="496" font-size="12" fill="#6b7280">Наслідок: паразитне живлення та деградація кристала ESP8266.</text>
</svg>
