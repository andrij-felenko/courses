<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма ініціалізації режиму прошивки ESP-01</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Автоматичний вхід у Bootloader за допомогою сигналів DTR/RTS (схема NodeMCU)</text>

  <!-- Main Diagram Panel -->
  <rect x="40" y="75" width="880" height="425" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>

  <!-- Vertical Divider Line -->
  <line x1="185" y1="85" x2="185" y2="490" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Time Labels Header -->
  <text x="220" y="96" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">t0</text>
  <text x="355" y="96" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">t1</text>
  <text x="490" y="96" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">t2</text>
  <text x="625" y="96" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">t3</text>
  <text x="760" y="96" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">t4</text>

  <!-- Vertical Time Grid Lines -->
  <line x1="355" y1="105" x2="355" y2="415" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="490" y1="105" x2="490" y2="415" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="625" y1="105" x2="625" y2="415" stroke="#27ae60" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="760" y1="105" x2="760" y2="415" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Channel 1: DTR -->
  <text x="60" y="118" font-size="13" font-weight="bold" fill="#1a1a1a">DTR</text>
  <text x="60" y="133" font-size="12" fill="#6b7280">(USB UART)</text>
  <text x="180" y="116" font-size="12" fill="#6b7280" text-anchor="end">3.3V</text>
  <text x="180" y="146" font-size="12" fill="#6b7280" text-anchor="end">0V</text>

  <line x1="200" y1="112" x2="880" y2="112" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="200" y1="142" x2="880" y2="142" stroke="#e5e7eb" stroke-width="1"/>
  <path d="M 200 112 L 490 112 L 490 142 L 625 142 L 625 112 L 880 112" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <text x="277" y="104" font-size="12" fill="#6b7280" text-anchor="middle">HIGH (3.3V)</text>
  <text x="557" y="158" font-size="12" fill="#2457d6" text-anchor="middle">LOW (0V)</text>

  <!-- Channel 2: RTS -->
  <text x="60" y="183" font-size="13" font-weight="bold" fill="#1a1a1a">RTS</text>
  <text x="60" y="198" font-size="12" fill="#6b7280">(USB UART)</text>
  <text x="180" y="181" font-size="12" fill="#6b7280" text-anchor="end">3.3V</text>
  <text x="180" y="211" font-size="12" fill="#6b7280" text-anchor="end">0V</text>

  <line x1="200" y1="177" x2="880" y2="177" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="200" y1="207" x2="880" y2="207" stroke="#e5e7eb" stroke-width="1"/>
  <path d="M 200 177 L 355 177 L 355 207 L 760 207 L 760 177 L 880 177" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <text x="277" y="169" font-size="12" fill="#6b7280" text-anchor="middle">HIGH (3.3V)</text>
  <text x="557" y="223" font-size="12" fill="#2457d6" text-anchor="middle">LOW (0V)</text>

  <!-- Channel 3: GPIO0 -->
  <text x="60" y="248" font-size="13" font-weight="bold" fill="#1a1a1a">GPIO0</text>
  <text x="60" y="263" font-size="12" fill="#6b7280">(Режим запуск)</text>
  <text x="180" y="246" font-size="12" fill="#6b7280" text-anchor="end">3.3V</text>
  <text x="180" y="276" font-size="12" fill="#6b7280" text-anchor="end">0V</text>

  <rect x="355" y="235" width="405" height="45" fill="#e9f7ef" opacity="0.4"/>
  <line x1="200" y1="242" x2="880" y2="242" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="200" y1="272" x2="880" y2="272" stroke="#e5e7eb" stroke-width="1"/>
  <path d="M 200 242 L 355 242 L 355 272 L 760 272 L 760 242 L 880 242" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <text x="277" y="234" font-size="12" fill="#6b7280" text-anchor="middle">HIGH</text>
  <text x="557" y="288" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">GPIO0 = 0 (LOW)</text>

  <!-- Channel 4: RST -->
  <text x="60" y="313" font-size="13" font-weight="bold" fill="#1a1a1a">RST</text>
  <text x="60" y="328" font-size="12" fill="#6b7280">(Скидання)</text>
  <text x="180" y="311" font-size="12" fill="#6b7280" text-anchor="end">3.3V</text>
  <text x="180" y="341" font-size="12" fill="#6b7280" text-anchor="end">0V</text>

  <rect x="490" y="300" width="135" height="45" fill="#fdecea" opacity="0.4"/>
  <line x1="200" y1="307" x2="880" y2="307" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="200" y1="337" x2="880" y2="337" stroke="#e5e7eb" stroke-width="1"/>
  <path d="M 200 307 L 490 307 L 490 337 L 625 337 L 625 307 L 880 307" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="277" y="299" font-size="12" fill="#6b7280" text-anchor="middle">HIGH</text>
  <text x="557" y="353" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">RST = 0 (RESET)</text>

  <!-- Latch Moment Point Highlight at t3 -->
  <circle cx="625" cy="307" r="5" fill="#27ae60" stroke="white" stroke-width="1.5"/>

  <!-- Channel 5: State Bar -->
  <text x="60" y="383" font-size="13" font-weight="bold" fill="#1a1a1a">Режим ESP</text>
  <text x="60" y="398" font-size="12" fill="#6b7280">(Стан чипа)</text>

  <rect x="200" y="375" width="155" height="30" fill="#e5e7eb" rx="4"/>
  <text x="277" y="395" font-size="12" fill="#6b7280" text-anchor="middle">Робочий режим</text>

  <rect x="355" y="375" width="135" height="30" fill="#eaf0fd" rx="4"/>
  <text x="422" y="395" font-size="12" fill="#2457d6" text-anchor="middle">Готовність</text>

  <rect x="490" y="375" width="135" height="30" fill="#fdecea" rx="4"/>
  <text x="557" y="395" font-size="12" fill="#c0392b" text-anchor="middle">Скидання</text>

  <rect x="625" y="375" width="255" height="30" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="752" y="395" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Вхід у UART Bootloader (Прошивка)</text>

  <!-- Callout Arrow from t3 to Card 3 -->
  <path d="M 625 315 L 625 365 Q 625 410 655 420" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arr-green)"/>

  <!-- Phase Explanation Cards -->
  <rect x="200" y="422" width="215" height="56" fill="white" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="212" y="440" font-size="12" font-weight="bold" fill="#2457d6">1. Установка GPIO0 = 0</text>
  <text x="212" y="460" font-size="12" fill="#6b7280">RTS=0 через Q2 притягує GPIO0</text>

  <rect x="427" y="422" width="196" height="56" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="6"/>
  <text x="437" y="440" font-size="12" font-weight="bold" fill="#c0392b">2. Перезавантаження</text>
  <text x="437" y="460" font-size="12" fill="#6b7280">DTR=0 змушує RST=0</text>

  <rect x="635" y="422" width="245" height="56" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="645" y="440" font-size="12" font-weight="bold" fill="#27ae60">3. Фіксація Bootloader (t3)</text>
  <text x="645" y="460" font-size="12" fill="#1a1a1a">Зчитування GPIO0=0 при підйомі RST</text>
</svg>
