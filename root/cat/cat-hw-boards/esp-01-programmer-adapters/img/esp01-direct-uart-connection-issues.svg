<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Пряме підключення ESP-01 до USB-UART: основні апаратні проблеми</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Пряме з'єднання без LDO та кнопок керування унеможливлює стабільне програмування</text>

  <!-- Schematic Panel Background -->
  <rect x="25" y="75" width="910" height="230" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="8"/>

  <!-- Left Box: USB-UART Adapter -->
  <rect x="40" y="85" width="230" height="210" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="155" y="108" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">USB-UART Адаптер</text>
  <text x="155" y="126" font-size="12" fill="#6b7280" text-anchor="middle">(простий конвертер)</text>

  <!-- USB Graphic -->
  <rect x="52" y="142" width="44" height="136" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="74" y="214" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">USB</text>

  <!-- Adapter Pin Terminals -->
  <text x="255" y="154" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">3.3V (VCC)</text>
  <circle cx="270" cy="150" r="4" fill="#c0392b"/>

  <text x="255" y="189" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">TXD</text>
  <circle cx="270" cy="185" r="4" fill="#2457d6"/>

  <text x="255" y="224" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">RXD</text>
  <circle cx="270" cy="220" r="4" fill="#2457d6"/>

  <text x="255" y="259" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">GND</text>
  <circle cx="270" cy="255" r="4" fill="#1a1a1a"/>

  <!-- Right Box: ESP-01 Module -->
  <rect x="690" y="85" width="230" height="210" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="805" y="108" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Модуль ESP-01</text>
  <text x="805" y="126" font-size="12" fill="#6b7280" text-anchor="middle">(ESP8266 Wi-Fi)</text>

  <!-- ESP-01 Connected Pins -->
  <circle cx="690" cy="150" r="4" fill="#c0392b"/>
  <text x="705" y="154" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">3V3</text>

  <circle cx="690" cy="185" r="4" fill="#2457d6"/>
  <text x="705" y="189" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">RX</text>

  <circle cx="690" cy="220" r="4" fill="#2457d6"/>
  <text x="705" y="224" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">TX</text>

  <circle cx="690" cy="255" r="4" fill="#1a1a1a"/>
  <text x="705" y="259" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">GND</text>

  <!-- Unconnected Pins Panel inside ESP-01 Box -->
  <rect x="760" y="142" width="145" height="136" fill="#fdecea" stroke="#c0392b" stroke-dasharray="3,3" stroke-width="1" rx="4"/>
  <text x="832" y="158" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Вільні виводи:</text>
  <text x="770" y="182" font-size="12" fill="#c0392b" text-anchor="start">• RST: висить</text>
  <text x="770" y="204" font-size="12" fill="#c0392b" text-anchor="start">• GPIO0: висить</text>
  <text x="770" y="226" font-size="12" fill="#6b7280" text-anchor="start">• CH_PD: висить</text>
  <text x="770" y="248" font-size="12" fill="#6b7280" text-anchor="start">• GPIO2: висить</text>

  <!-- Center Wiring & Signals -->

  <!-- Wire 1: 3.3V Line with warning box -->
  <line x1="270" y1="150" x2="360" y2="150" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6,4"/>
  <rect x="360" y="134" width="240" height="32" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="480" y="154" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">⚡ 3.3V (струм обмежено ~50мА!)</text>
  <line x1="600" y1="150" x2="690" y2="150" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arr-red)"/>

  <!-- Wire 2: TXD -> RX -->
  <line x1="270" y1="185" x2="690" y2="185" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="480" y="178" font-size="12" fill="#2457d6" text-anchor="middle">Лінія передачі: TXD → RX</text>

  <!-- Wire 3: RXD <- TX -->
  <line x1="690" y1="220" x2="270" y2="220" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="480" y="213" font-size="12" fill="#2457d6" text-anchor="middle">Лінія прийому: RXD ← TX</text>

  <!-- Wire 4: GND -->
  <line x1="270" y1="255" x2="690" y2="255" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>
  <text x="480" y="273" font-size="12" fill="#1a1a1a" text-anchor="middle">Спільний дріт: GND — GND</text>

  <!-- Lower Section: 3 Problem Cards -->

  <!-- Card 1: Power Problem -->
  <rect x="40" y="320" width="280" height="195" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="8"/>
  <rect x="52" y="332" width="256" height="26" fill="#c0392b" rx="4"/>
  <text x="180" y="349" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">1. Проблема живлення 3.3V</text>

  <text x="54" y="376" font-size="12" fill="#1a1a1a" text-anchor="start">• CH340 / FT232 видає лише ~50 мА</text>
  <text x="54" y="396" font-size="12" fill="#1a1a1a" text-anchor="start">• ESP8266 споживає до 300–400 мА</text>
  <text x="54" y="416" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">• Виникає просідання напруги</text>
  <text x="54" y="436" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">  і циклічний Brownout Reset</text>

  <rect x="52" y="458" width="256" height="44" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="180" y="475" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">💡 Розв'язок:</text>
  <text x="180" y="493" font-size="12" fill="#1a1a1a" text-anchor="middle">Зовнішній LDO 3.3V (1A) + 100мкФ</text>

  <!-- Card 2: Reset Problem -->
  <rect x="340" y="320" width="280" height="195" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="8"/>
  <rect x="352" y="332" width="256" height="26" fill="#c0392b" rx="4"/>
  <text x="480" y="349" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">2. Брак лінії скидання (RST)</text>

  <text x="354" y="376" font-size="12" fill="#1a1a1a" text-anchor="start">• Сигнали DTR / RTS відсутні</text>
  <text x="354" y="396" font-size="12" fill="#1a1a1a" text-anchor="start">• Вивід RST висить у повітрі</text>
  <text x="354" y="416" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">• Автоматичне перезавантаження</text>
  <text x="354" y="436" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">  у режим bootloader неможливе</text>

  <rect x="352" y="458" width="256" height="44" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="480" y="475" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">💡 Розв'язок:</text>
  <text x="480" y="493" font-size="12" fill="#1a1a1a" text-anchor="middle">Кнопка Reset або авто-схема DTR/RTS</text>

  <!-- Card 3: GPIO0 Problem -->
  <rect x="640" y="320" width="280" height="195" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="8"/>
  <rect x="652" y="332" width="256" height="26" fill="#c0392b" rx="4"/>
  <text x="780" y="349" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">3. GPIO0 не заземлений</text>

  <text x="654" y="376" font-size="12" fill="#1a1a1a" text-anchor="start">• Вивід GPIO0 не підключений</text>
  <text x="654" y="396" font-size="12" fill="#1a1a1a" text-anchor="start">• Вивід висить у повітрі (HIGH)</text>
  <text x="654" y="416" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">• Завантажувач стартує в Flash</text>
  <text x="654" y="436" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">  режимі замість UART Download</text>

  <rect x="652" y="458" width="256" height="44" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="780" y="475" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">💡 Розв'язок:</text>
  <text x="780" y="493" font-size="12" fill="#1a1a1a" text-anchor="middle">Кнопка Flash (стяжка GPIO0 до GND)</text>
</svg>
