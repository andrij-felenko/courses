<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="580" fill="white"/>

  <!-- Header -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема цокольовки та шин живлення плати WeAct STM32G431CBU6</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Призначення виводів, розподіл шин живлення 5V/3V3/VBAT/VREF+ та толерантність до напруги</text>

  <!-- LEFT PANEL: Power & Boot -->
  <rect x="30" y="75" width="240" height="480" rx="6" ry="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="150" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Шини живлення та BOOT0</text>

  <!-- Card 1: 5V -->
  <rect x="42" y="112" width="216" height="74" rx="4" ry="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="54" y="132" font-size="13" font-weight="bold" fill="#2457d6">5V (VIN / VBUS)</text>
  <text x="54" y="152" font-size="12" fill="#1a1a1a">Вхід живлення від USB або</text>
  <text x="54" y="170" font-size="12" fill="#1a1a1a">зовнішнього джерела 4.5-5.5V</text>

  <!-- Card 2: 3V3 -->
  <rect x="42" y="198" width="216" height="74" rx="4" ry="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="54" y="218" font-size="13" font-weight="bold" fill="#27ae60">3V3 (Основна шина VDD)</text>
  <text x="54" y="238" font-size="12" fill="#1a1a1a">Вихід LDO регулятора 3.3V</text>
  <text x="54" y="256" font-size="12" fill="#1a1a1a">Живлення ядра MCU та I/O</text>

  <!-- Card 3: VBAT -->
  <rect x="42" y="284" width="216" height="74" rx="4" ry="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="54" y="304" font-size="13" font-weight="bold" fill="#1a1a1a">VBAT (Резервне живлення)</text>
  <text x="54" y="324" font-size="12" fill="#1a1a1a">Живлення RTC і бекап-пам'яті</text>
  <text x="54" y="342" font-size="12" fill="#6b7280">Діапазон напруги: 1.55V - 3.6V</text>

  <!-- Card 4: VREF+ -->
  <rect x="42" y="370" width="216" height="74" rx="4" ry="4" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="54" y="390" font-size="13" font-weight="bold" fill="#c2410c">VREF+ (Опорна напруга)</text>
  <text x="54" y="410" font-size="12" fill="#1a1a1a">Опора для ADC / DAC / OPAMP</text>
  <text x="54" y="428" font-size="12" fill="#6b7280">Підключено до 3V3 через VDDA</text>

  <!-- Card 5: BOOT0 -->
  <rect x="42" y="456" width="216" height="86" rx="4" ry="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="54" y="475" font-size="13" font-weight="bold" fill="#c0392b">Вибір режиму BOOT0</text>
  <text x="54" y="493" font-size="12" fill="#1a1a1a">GND (0) = Запуск із Flash</text>
  <text x="54" y="511" font-size="12" fill="#1a1a1a">3V3 (1) = Завантажувач DFU</text>
  <text x="54" y="529" font-size="12" fill="#6b7280">Кнопка BOOT на платі</text>

  <!-- MIDDLE PANEL: WeAct Board & Pinout -->
  <rect x="290" y="75" width="380" height="480" rx="6" ry="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Розпіновка плати WeAct (UFQFPN48)</text>

  <!-- PCB Board -->
  <rect x="360" y="112" width="240" height="430" rx="8" ry="8" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>

  <!-- USB-C Connector -->
  <rect x="425" y="124" width="110" height="28" rx="4" ry="4" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
  <text x="480" y="143" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f172a">USB-C (5V)</text>

  <!-- Buttons -->
  <rect x="375" y="164" width="46" height="22" rx="3" ry="3" fill="#64748b"/>
  <text x="398" y="179" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">NRST</text>

  <rect x="539" y="164" width="46" height="22" rx="3" ry="3" fill="#64748b"/>
  <text x="562" y="179" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">BOOT</text>

  <!-- MCU Chip -->
  <rect x="425" y="260" width="110" height="110" rx="4" ry="4" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
  <text x="480" y="295" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">STM32G431</text>
  <text x="480" y="318" text-anchor="middle" font-size="13" font-weight="bold" fill="#38bdf8">CBU6</text>
  <text x="480" y="341" text-anchor="middle" font-size="12" fill="#94a3b8">UFQFPN48</text>

  <!-- SWD Bottom Header -->
  <rect x="368" y="504" width="224" height="26" rx="3" ry="3" fill="#334155"/>
  <text x="480" y="521" text-anchor="middle" font-size="12" font-weight="bold" fill="#f8fafc">SWD: 3V3 | SWCLK | SWDIO | GND</text>

  <!-- Left Header Pins (J1) -->
