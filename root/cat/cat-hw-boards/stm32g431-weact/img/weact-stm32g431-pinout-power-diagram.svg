  <!-- Pin 9: PF1 -->
  <line x1="354" y1="372" x2="364" y2="372" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="364" y="368" width="8" height="8" fill="#f59e0b"/>
  <rect x="296" y="365" width="58" height="15" rx="3" ry="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
