  <line x1="354" y1="156" x2="364" y2="156" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="364" y="152" width="8" height="8" fill="#f59e0b"/>
  <rect x="296" y="149" width="58" height="15" rx="3" ry="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="325" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">3V3</text>

  <!-- Pin 2: GND -->
  <line x1="354" y1="183" x2="364" y2="183" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="364" y="179" width="8" height="8" fill="#f59e0b"/>
  <rect x="296" y="176" width="58" height="15" rx="3" ry="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="325" y="187" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">GND</text>

  <!-- Pin 3: 5V -->
  <line x1="354" y1="210" x2="364" y2="210" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="364" y="206" width="8" height="8" fill="#f59e0b"/>
  <rect x="296" y="203" width="58" height="15" rx="3" ry="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="325" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">5V</text>

  <!-- Pin 4: VBAT -->
  <line x1="354" y1="237" x2="364" y2="237" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="364" y="233" width="8" height="8" fill="#f59e0b"/>
  <rect x="296" y="230" width="58" height="15" rx="3" ry="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="325" y="241" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">VBAT</text>

  <!-- Pin 5: PC13 -->
  <line x1="354" y1="264" x2="364" y2="264" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="364" y="260" width="8" height="8" fill="#f59e0b"/>
  <rect x="296" y="257" width="58" height="15" rx="3" ry="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="325" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">PC13</text>

  <!-- Pin 6: PC14 -->
  <line x1="354" y1="291" x2="364" y2="291" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="364" y="287" width="8" height="8" fill="#f59e0b"/>
  <rect x="296" y="284" width="58" height="15" rx="3" ry="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="325" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">PC14</text>

  <!-- Pin 7: PC15 -->
  <line x1="354" y1="318" x2="364" y2="318" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="364" y="314" width="8" height="8" fill="#f59e0b"/>
  <rect x="296" y="311" width="58" height="15" rx="3" ry="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="325" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">PC15</text>

