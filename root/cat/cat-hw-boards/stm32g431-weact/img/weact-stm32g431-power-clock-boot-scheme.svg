<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="36" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Апаратні підсистеми плати WeAct STM32G431CBU6</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Організація живлення 3.3V, тактування HSE/LSE, конфігурації BOOT0 та інтерфейсу SWD</text>

  <!-- Блок 1: Система живлення (Power) -->
  <rect x="30" y="90" width="295" height="190" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="45" y="114" font-size="14" font-weight="700" fill="#1a1a1a">1. Система живлення (Power)</text>
  
  <!-- USB Type-C -->
  <rect x="45" y="130" width="90" height="40" fill="white" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="90" y="147" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">USB Type-C</text>
  <text x="90" y="163" font-size="12" fill="#6b7280" text-anchor="middle">VBUS (5V)</text>
  
  <!-- LDO Regulator -->
  <rect x="175" y="130" width="135" height="40" fill="white" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="242" y="147" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">LDO Regulator</text>
  <text x="242" y="163" font-size="12" fill="#1a1a1a" text-anchor="middle">ME6211 (5V → 3.3V)</text>
  
  <!-- Лінія 5V -->
  <line x1="135" y1="150" x2="175" y2="150" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="155" y="141" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">5V</text>

  <!-- Блок фільтрації -->
  <rect x="175" y="195" width="135" height="65" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="242" y="213" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Фільтрація живлення</text>
  <text x="242" y="230" font-size="12" fill="#1a1a1a" text-anchor="middle">C_dec = 100nF × N</text>
  <text x="242" y="247" font-size="12" fill="#6b7280" text-anchor="middle">C_bulk = 4.7µF (VDDA)</text>
  
  <!-- Лінія LDO до Фільтрації -->
  <line x1="242" y1="170" x2="242" y2="195" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Блок 2: Відлагодження SWD / ST-LINK -->
  <rect x="30" y="305" width="295" height="175" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="45" y="329" font-size="14" font-weight="700" fill="#1a1a1a">2. Відлагодження SWD / ST-LINK</text>

  <!-- ST-LINK/V2 -->
  <rect x="45" y="345" width="110" height="115" fill="white" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="100" y="365" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">ST-LINK / V2</text>
  <text x="100" y="383" font-size="12" fill="#6b7280" text-anchor="middle">Апаратний дебагер</text>
  <text x="100" y="407" font-size="12" fill="#1a1a1a" text-anchor="middle">1: Target 3.3V</text>
  <text x="100" y="424" font-size="12" fill="#1a1a1a" text-anchor="middle">2: SWDIO | 3: SWCLK</text>
  <text x="100" y="441" font-size="12" fill="#1a1a1a" text-anchor="middle">4: GND | NRST pin</text>

  <!-- SWD Роз'єм -->
  <rect x="185" y="345" width="125" height="115" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="247" y="365" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Роз'єм SWD (4-pin)</text>
  <text x="247" y="388" font-size="12" fill="#2457d6" text-anchor="middle">PA13 ↔ SWDIO</text>
  <text x="247" y="406" font-size="12" fill="#2457d6" text-anchor="middle">PA14 ↔ SWCLK</text>
  <text x="247" y="424" font-size="12" fill="#6b7280" text-anchor="middle">NRST (Скидання)</text>
  <text x="247" y="442" font-size="12" fill="#6b7280" text-anchor="middle">GND / 3.3V Target</text>

  <!-- Лінія між ST-LINK та Роз'ємом -->
  <line x1="155" y1="400" x2="185" y2="400" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="170" y="391" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">SWD</text>

  <!-- Блок 3: Джерела тактування (Clock) -->
  <rect x="635" y="90" width="295" height="190" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="650" y="114" font-size="14" font-weight="700" fill="#1a1a1a">3. Джерела тактування (Clock)</text>

  <!-- HSE -->
  <rect x="650" y="130" width="265" height="65" fill="white" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="660" y="149" font-size="12" font-weight="700" fill="#2457d6">HSE (High-Speed External)</text>
  <text x="660" y="167" font-size="12" fill="#1a1a1a">Кварц 8 МГц / 24 МГц + C_L (20 pF)</text>
  <text x="660" y="184" font-size="12" fill="#6b7280">Тактування PLL до 170 МГц CPU</text>

  <!-- LSE -->
  <rect x="650" y="205" width="265" height="65" fill="white" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="660" y="224" font-size="12" font-weight="700" fill="#2457d6">LSE (Low-Speed External)</text>
  <text x="660" y="242" font-size="12" fill="#1a1a1a">Кварц 32.768 кГц + C_L (12 pF)</text>
  <text x="660" y="259" font-size="12" fill="#6b7280">Тактування годинника RTC / LPTIM</text>

  <!-- Блок 4: Селектор завантаження BOOT0 -->
  <rect x="635" y="305" width="295" height="175" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="650" y="329" font-size="14" font-weight="700" fill="#1a1a1a">4. Селектор завантаження BOOT0</text>

  <!-- BOOT0 = 0 -->
  <rect x="650" y="345" width="265" height="55" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="660" y="364" font-size="12" font-weight="700" fill="#27ae60">BOOT0 = 0 (Pull-Down 10 kΩ → GND)</text>
  <text x="660" y="382" font-size="12" fill="#1a1a1a">Основний режим: запуск з Flash (0x08000000)</text>

  <!-- BOOT0 = 1 -->
  <rect x="650" y="410" width="265" height="55" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="660" y="429" font-size="12" font-weight="700" fill="#c0392b">BOOT0 = 1 (Джампер / Кнопка → 3.3V)</text>
  <text x="660" y="447" font-size="12" fill="#1a1a1a">Програмування: System Memory (DFU / UART)</text>

  <!-- Центральний блок: STM32G431CBU6 -->
  <rect x="360" y="90" width="230" height="390" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="8"/>
  <text x="475" y="118" font-size="16" font-weight="700" fill="#2457d6" text-anchor="middle">STM32G431CBU6</text>
  <text x="475" y="136" font-size="12" fill="#6b7280" text-anchor="middle">Arm® Cortex®-M4F (170 MHz)</text>

  <!-- Піни ліворуч -->
  <!-- VDD/VDDA Pin -->
  <rect x="365" y="172" width="85" height="26" fill="white" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="407" y="189" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">VDD / VDDA</text>

  <!-- NRST Pin -->
  <rect x="365" y="282" width="85" height="26" fill="white" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="407" y="299" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">NRST</text>

  <!-- SWD Pins -->
  <rect x="365" y="372" width="100" height="42" fill="white" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="415" y="389" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">SWDIO (PA13)</text>
  <text x="415" y="407" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">SWCLK (PA14)</text>

  <!-- Піни праворуч -->
  <!-- HSE Pins -->
  <rect x="485" y="172" width="100" height="42" fill="white" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="535" y="189" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">OSC_IN (PF0)</text>
  <text x="535" y="207" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">OSC_OUT (PF1)</text>

  <!-- LSE Pins -->
  <rect x="485" y="282" width="100" height="42" fill="white" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="535" y="299" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">OSC32_IN (PC14)</text>
  <text x="535" y="317" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">OSC32_OUT (PC15)</text>

  <!-- BOOT0 Pin -->
  <rect x="485" y="382" width="100" height="26" fill="white" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="535" y="399" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">BOOT0 (PB8)</text>

  <!-- Внутрішні мати/периферійні блоки MCU -->
  <rect x="405" y="228" width="140" height="44" fill="white" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="475" y="246" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">CORDIC / FMAC</text>
  <text x="475" y="263" font-size="12" fill="#6b7280" text-anchor="middle">Math Accelerators</text>

  <rect x="405" y="428" width="140" height="42" fill="white" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="475" y="445" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">OPAMP / COMP / ADC</text>
  <text x="475" y="462" font-size="12" fill="#6b7280" text-anchor="middle">HRTIM / FOC Motor</text>

  <!-- Міжблочні зв'язки (лінії) -->

  <!-- Живлення 3.3V (з блоку 1 до MCU) -->
  <line x1="325" y1="185" x2="365" y2="185" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="342.5" y="176" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">3.3V</text>

  <!-- SWD лінія (з роз'єму 2 до MCU) -->
  <line x1="325" y1="390" x2="365" y2="390" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="342.5" y="381" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">SWD</text>

  <!-- NRST лінія (з роз'єму 2 до MCU NRST) -->
  <path d="M 310,430 L 320,430 L 320,295 L 365,295" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3" fill="none" marker-end="url(#arr)"/>
  <text x="342.5" y="286" font-size="12" fill="#6b7280" text-anchor="middle">NRST</text>

  <!-- HSE лінія (з блоку 3 до MCU) -->
  <line x1="635" y1="193" x2="585" y2="193" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="610" y="184" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">HSE</text>

  <!-- LSE лінія (з блоку 3 до MCU) -->
  <line x1="635" y1="303" x2="585" y2="303" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="610" y="294" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">LSE</text>

  <!-- BOOT0 лінія (з блоку 4 до MCU) -->
  <line x1="635" y1="395" x2="585" y2="395" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="610" y="386" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">BOOT0</text>
</svg>
