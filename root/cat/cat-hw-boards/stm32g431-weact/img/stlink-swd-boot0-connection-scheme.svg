<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Підключення ST-LINK/V2 (SWD) та конфігурація BOOT0</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Для прошивки з'єднують SWDIO, SWCLK, GND, 3V3, а режим завантаження обирають підтяжкою BOOT0</text>

  <!-- Панель 1: Програматор ST-LINK/V2 -->
  <rect x="35" y="80" width="220" height="400" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="145" y="108" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">ST-LINK / V2</text>
  <text x="145" y="126" font-size="12" fill="#6b7280" text-anchor="middle">(Програматор SWD)</text>

  <!-- Роз'єм SWD на програматорі -->
  <rect x="135" y="150" width="115" height="230" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="192" y="170" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">SWD Port</text>

  <!-- Виводи програматора -->
  <text x="150" y="204" font-size="12" font-weight="700" fill="#c0392b" text-anchor="start">3V3</text>
  <circle cx="240" cy="200" r="5" fill="#c0392b"/>

  <text x="150" y="254" font-size="12" font-weight="700" fill="#2457d6" text-anchor="start">SWDIO</text>
  <circle cx="240" cy="250" r="5" fill="#2457d6"/>

  <text x="150" y="304" font-size="12" font-weight="700" fill="#2457d6" text-anchor="start">SWCLK</text>
  <circle cx="240" cy="300" r="5" fill="#2457d6"/>

  <text x="150" y="354" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="start">GND</text>
  <circle cx="240" cy="350" r="5" fill="#1a1a1a"/>

  <!-- З'єднувальні лінії SWD -->
  <!-- 3V3 Line -->
  <text x="350" y="184" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">3V3 (Живлення)</text>
  <line x1="240" y1="200" x2="460" y2="200" stroke="#c0392b" stroke-width="2.5"/>

  <!-- SWDIO Line -->
  <text x="350" y="234" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">SWDIO (Дані)</text>
  <line x1="240" y1="250" x2="460" y2="250" stroke="#2457d6" stroke-width="2.5"/>

  <!-- SWCLK Line -->
  <text x="350" y="284" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">SWCLK (Тактування)</text>
  <line x1="240" y1="300" x2="460" y2="300" stroke="#2457d6" stroke-width="2.5"/>

  <!-- GND Line -->
  <text x="350" y="334" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">GND (Спільний мінус)</text>
  <line x1="240" y1="350" x2="460" y2="350" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- Панель 2: Плата WeAct STM32G431CBU6 -->
  <rect x="460" y="80" width="465" height="400" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="692" y="108" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">Плата WeAct STM32G431CBU6</text>

  <!-- Точки підключення SWD на платі -->
  <circle cx="460" cy="200" r="5" fill="#c0392b"/>
  <circle cx="460" cy="250" r="5" fill="#2457d6"/>
  <circle cx="460" cy="300" r="5" fill="#2457d6"/>
  <circle cx="460" cy="350" r="5" fill="#1a1a1a"/>

  <!-- Лінії від роз'єму до МК -->
  <line x1="460" y1="200" x2="495" y2="200" stroke="#c0392b" stroke-width="2"/>
  <line x1="460" y1="250" x2="495" y2="250" stroke="#2457d6" stroke-width="2"/>
  <line x1="460" y1="300" x2="495" y2="300" stroke="#2457d6" stroke-width="2"/>
  <line x1="460" y1="350" x2="495" y2="350" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Корпус Мікроконтролера -->
  <rect x="495" y="150" width="165" height="230" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="577" y="175" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">STM32G431CBU6</text>
  <text x="577" y="193" font-size="12" fill="#6b7280" text-anchor="middle">UFQFPN48</text>

  <!-- Позначення виводів МК -->
  <text x="503" y="204" font-size="12" font-weight="700" fill="#c0392b">VDD (3V3)</text>
  <text x="503" y="254" font-size="12" font-weight="700" fill="#2457d6">PA13 (SWDIO)</text>
  <text x="503" y="304" font-size="12" font-weight="700" fill="#2457d6">PA14 (SWCLK)</text>
  <text x="503" y="354" font-size="12" font-weight="700" fill="#1a1a1a">VSS (GND)</text>

  <!-- Підсистема BOOT0 -->
  <rect x="680" y="150" width="230" height="315" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="795" y="172" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">Конфігурація BOOT0</text>

  <!-- Вивід PB8/BOOT0 з МК -->
  <line x1="660" y1="230" x2="740" y2="230" stroke="#2457d6" stroke-width="2"/>
  <text x="700" y="222" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">PB8/BOOT0</text>
  <circle cx="740" cy="230" r="4" fill="#2457d6"/>

  <!-- Пліч 1: Pull-down Резистор R_pd -->
  <line x1="740" y1="230" x2="740" y2="260" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="730" y="260" width="20" height="36" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="758" y="282" font-size="12" fill="#1a1a1a">R = 10 kΩ</text>

  <line x1="740" y1="296" x2="740" y2="315" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Земля GND -->
  <line x1="730" y1="315" x2="750" y2="315" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="734" y1="320" x2="746" y2="320" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="738" y1="325" x2="742" y2="325" stroke="#1a1a1a" stroke-width="2"/>
  <text x="740" y="340" font-size="12" fill="#6b7280" text-anchor="middle">GND (0V)</text>

  <!-- Пліч 2: Кнопка до 3V3 -->
  <line x1="740" y1="230" x2="740" y2="200" stroke="#2457d6" stroke-width="2"/>
  <circle cx="740" cy="200" r="3" fill="#2457d6"/>
  <circle cx="780" cy="200" r="3" fill="#2457d6"/>
  <line x1="740" y1="200" x2="775" y2="190" stroke="#2457d6" stroke-width="2"/>
  <text x="760" y="182" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Кнопка BOOT0</text>

  <line x1="780" y1="200" x2="830" y2="200" stroke="#c0392b" stroke-width="2"/>
  <circle cx="830" cy="200" r="4" fill="#c0392b"/>
  <text x="838" y="204" font-size="12" font-weight="700" fill="#c0392b">3V3</text>

  <!-- Блоки режимів завантаження -->
  <!-- Режим 0: Flash -->
  <rect x="692" y="356" width="206" height="42" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="795" y="373" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Відпущена: BOOT0 = 0 (GND)</text>
  <text x="795" y="389" font-size="12" fill="#1a1a1a" text-anchor="middle">Запуск з Flash (Main Flash)</text>

  <!-- Режим 1: Bootloader -->
  <rect x="692" y="408" width="206" height="42" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="795" y="425" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Натиснута: BOOT0 = 1 (3V3)</text>
  <text x="795" y="441" font-size="12" fill="#1a1a1a" text-anchor="middle">System Bootloader (UART/USB)</text>
</svg>
