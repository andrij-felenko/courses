<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="960" height="490" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="490" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Часова діаграма вибірки струму FOC у STM32G431</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Запуск ADC (TIM1_TRGO2) у середній точці провідності нижніх ключів (CNT = 0) мінімізує завади ШІМ</text>

  <!-- Main Panel -->
  <rect x="25" y="68" width="910" height="348" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Vertical Divider -->
  <line x1="230" y1="78" x2="230" y2="406" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Top Badge for CNT = 0 -->
  <rect x="440" y="74" width="270" height="22" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="575" y="89" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">CNT = 0: Точна середина провідності U_L</text>

  <!-- Channel 1: TIM1_CNT -->
  <text x="42" y="110" font-size="13" font-weight="700" fill="#1a1a1a">TIM1_CNT</text>
  <text x="42" y="127" font-size="12" fill="#6b7280">Лічильник (Center-aligned)</text>

  <line x1="245" y1="95" x2="915" y2="95" stroke="#b0b7c0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="245" y1="140" x2="915" y2="140" stroke="#b0b7c0" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="240" y="99" font-size="12" fill="#6b7280" text-anchor="end">ARR</text>
  <text x="240" y="144" font-size="12" fill="#6b7280" text-anchor="end">0</text>
  <path d="M 245,117.5 L 360,95 L 575,140 L 790,95 L 915,121" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Channel 2: TIM1_CH1 (U_H) -->
  <text x="42" y="168" font-size="13" font-weight="700" fill="#2457d6">TIM1_CH1 (U_H)</text>
  <text x="42" y="185" font-size="12" fill="#6b7280">Верхній ключ фази A</text>

  <!-- Dead Time Highlights -->
  <rect x="425" y="152" width="18" height="90" fill="#fdecea" opacity="0.6"/>
  <rect x="707" y="152" width="18" height="90" fill="#fdecea" opacity="0.6"/>
  <text x="434" y="148" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">t_dead</text>
  <text x="716" y="148" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">t_dead</text>

  <path d="M 245,190 L 295,190 L 295,155 L 425,155 L 425,190 L 725,190 L 725,155 L 855,155 L 855,190 L 915,190" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Channel 3: TIM1_CH1N (U_L) -->
  <text x="42" y="218" font-size="13" font-weight="700" fill="#2457d6">TIM1_CH1N (U_L)</text>
  <text x="42" y="235" font-size="12" fill="#6b7280">Нижній ключ фази A</text>
  <path d="M 245,210 L 277,210 L 277,240 L 443,240 L 443,210 L 707,210 L 707,240 L 873,240 L 873,210 L 915,210" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Channel 4: OPAMP_OUT -->
  <text x="42" y="268" font-size="13" font-weight="700" fill="#1a1a1a">OPAMP_OUT</text>
  <text x="42" y="285" font-size="12" fill="#6b7280">Сигнал струму з шунта</text>

  <!-- Noise and Clean badges -->
  <rect x="445" y="248" width="95" height="18" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="492.5" y="261" font-size="12" fill="#c0392b" text-anchor="middle">Завади ШІМ</text>

  <rect x="543" y="248" width="105" height="18" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="595.5" y="261" font-size="12" fill="#27ae60" text-anchor="middle">Чистий сигнал</text>

  <path d="M 245,290 L 443,290 L 448,268 L 454,300 L 460,270 L 468,295 L 478,272 L 490,278 L 500,275 L 707,275 L 712,295 L 720,290 L 915,290" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>

  <!-- Channel 5: TIM1_TRGO2 -->
  <text x="42" y="323" font-size="13" font-weight="700" fill="#27ae60">TIM1_TRGO2</text>
  <text x="42" y="340" font-size="12" fill="#6b7280">Подія Update (CNT = 0)</text>
  <path d="M 245,340 L 567,340 L 567,310 L 583,310 L 583,340 L 915,340" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Channel 6: ADC1 / ADC2 -->
  <text x="42" y="373" font-size="13" font-weight="700" fill="#27ae60">ADC1 / ADC2</text>
  <text x="42" y="390" font-size="12" fill="#6b7280">Вимірювання струмів I_A, I_B</text>

  <rect x="575" y="362" width="55" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="602.5" y="381" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">t_sample</text>

  <rect x="630" y="362" width="75" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="667.5" y="381" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">t_conv</text>

  <!-- Synchronization vertical line -->
  <line x1="575" y1="74" x2="575" y2="406" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Bottom Cards -->
  <rect x="25" y="426" width="290" height="52" rx="6" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="40" y="445" font-size="12" font-weight="700" fill="#c0392b">1. Мертвий час (t_dead)</text>
  <text x="40" y="463" font-size="12" fill="#6b7280">Запобігає короткому замиканню стойки</text>

  <rect x="335" y="426" width="290" height="52" rx="6" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="350" y="445" font-size="12" font-weight="700" fill="#27ae60">2. Середина провідності U_L</text>
  <text x="350" y="463" font-size="12" fill="#1a1a1a">Мінімум комутаційних завад ключа</text>

  <rect x="645" y="426" width="290" height="52" rx="6" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="660" y="445" font-size="12" font-weight="700" fill="#2457d6">3. Апаратний тригер TIM1_TRGO2</text>
  <text x="660" y="449" font-size="12" stroke="none" fill="none"></text>
  <text x="660" y="463" font-size="12" fill="#1a1a1a">Запуск ADC без затримок ядра CPU</text>
</svg>
