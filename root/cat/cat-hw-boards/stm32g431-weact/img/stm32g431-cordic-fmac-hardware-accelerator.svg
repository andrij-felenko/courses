<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Конвеєр обробки даних у блоках CORDIC та FMAC</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Паралельний розрахунок тригонометрії та фільтрація через DMA без навантаження CPU</text>

  <!-- Колонка 1: Вхідні джерела -->
  <rect x="25" y="90" width="170" height="360" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="110" y="115" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вхідні джерела</text>

  <rect x="35" y="135" width="150" height="120" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="110" y="160" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кут ротора</text>
  <text x="110" y="182" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">θ (рад / град)</text>
  <text x="110" y="204" font-size="12" fill="#6b7280" text-anchor="middle">Таймер TIM1/TIM2</text>
  <text x="110" y="226" font-size="12" fill="#6b7280" text-anchor="middle">Вхід для CORDIC</text>

  <rect x="35" y="295" width="150" height="120" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="110" y="320" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Семпли струмів</text>
  <text x="110" y="342" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">I_A, I_B (ADC1/2)</text>
  <text x="110" y="364" font-size="12" fill="#6b7280" text-anchor="middle">Датчики фаз FOC</text>
  <text x="110" y="386" font-size="12" fill="#6b7280" text-anchor="middle">Вхід для FMAC</text>

  <!-- Зв'язки Між Колонкою 1 і Колонкою 2 -->
  <line x1="185" y1="195" x2="275" y2="195" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="230" y="186" font-size="11" fill="#2457d6" text-anchor="middle">Кут θ</text>

  <line x1="185" y1="355" x2="275" y2="355" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="230" y="346" font-size="11" fill="#2457d6" text-anchor="middle">Дані ADC</text>

  <!-- Колонка 2: Апаратні прискорювачі STM32G4 -->
  <rect x="265" y="90" width="430" height="360" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="115" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Апаратні прискорювачі STM32G4</text>

  <!-- Контейнер CORDIC -->
  <rect x="275" y="130" width="410" height="145" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="287" y="150" font-size="13" font-weight="bold" fill="#2457d6">Прискорювач CORDIC (Тригонометрія &amp; FOC)</text>

  <rect x="287" y="165" width="100" height="95" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="337" y="186" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вхід WDATA</text>
  <text x="337" y="208" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ARG1 = θ</text>
  <text x="337" y="230" font-size="11" fill="#6b7280" text-anchor="middle">ARG2 = Mod</text>
  <text x="337" y="248" font-size="11" fill="#6b7280" text-anchor="middle">Q1.31 / Q1.15</text>

  <line x1="387" y1="212" x2="427" y2="212" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="430" y="165" width="100" height="95" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="480" y="186" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Ядро CORDIC</text>
  <text x="480" y="206" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">24 мікрооберти</text>
  <text x="480" y="226" font-size="11" fill="#6b7280" text-anchor="middle">Shift-Add ядро</text>
  <text x="480" y="246" font-size="11" fill="#6b7280" text-anchor="middle">sin, cos, atan2</text>

  <line x1="530" y1="212" x2="570" y2="212" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="573" y="165" width="102" height="95" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="624" y="186" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вихід RDATA</text>
  <text x="624" y="208" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">RES1 = sin θ</text>
  <text x="624" y="230" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">RES2 = cos θ</text>
  <text x="624" y="248" font-size="11" fill="#6b7280" text-anchor="middle">Прапор RDY</text>

  <!-- Контейнер FMAC -->
  <rect x="275" y="290" width="410" height="145" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="287" y="310" font-size="13" font-weight="bold" fill="#2457d6">Прискорювач FMAC (Цифрова фільтрація FIR / IIR)</text>

  <rect x="287" y="325" width="100" height="95" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="337" y="346" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Буфери X1/X2</text>
  <text x="337" y="368" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Семпли x[n]</text>
  <text x="337" y="390" font-size="11" fill="#6b7280" text-anchor="middle">Коефіцієнти b_k</text>
  <text x="337" y="408" font-size="11" fill="#6b7280" text-anchor="middle">Внутрішній SRAM</text>

  <line x1="387" y1="372" x2="427" y2="372" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="430" y="325" width="100" height="95" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="480" y="346" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Ядро FMAC</text>
  <text x="480" y="366" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">16×16 MAC unit</text>
  <text x="480" y="386" font-size="11" fill="#6b7280" text-anchor="middle">Обчисли MAC</text>
  <text x="480" y="406" font-size="11" fill="#6b7280" text-anchor="middle">Σ b_k · x[n-k]</text>

  <line x1="530" y1="372" x2="570" y2="372" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="573" y="325" width="102" height="95" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="624" y="346" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Буфер Y (SRAM)</text>
  <text x="624" y="368" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вихід y[n]</text>
  <text x="624" y="390" font-size="11" fill="#6b7280" text-anchor="middle">Фільтрований y</text>
  <text x="624" y="408" font-size="11" fill="#6b7280" text-anchor="middle">Запит DMA / ІПР</text>

  <!-- Зв'язки Між Колонкою 2 і Колонкою 3 -->
  <line x1="675" y1="212" x2="765" y2="212" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="720" y="203" font-size="11" fill="#2457d6" text-anchor="middle">Триг-дані</text>

  <line x1="675" y1="372" x2="765" y2="372" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="720" y="363" font-size="11" fill="#27ae60" text-anchor="middle">Фільтр y[n]</text>

  <!-- Колонка 3: Приймачі & DMA -->
  <rect x="765" y="90" width="170" height="360" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="850" y="115" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Приймачі &amp; DMA</text>

  <rect x="775" y="135" width="150" height="120" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="850" y="160" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Контролер DMA</text>
  <text x="850" y="182" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">DMA1 / DMA2</text>
  <text x="850" y="204" font-size="12" fill="#6b7280" text-anchor="middle">Прямий транзит</text>
  <text x="850" y="226" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">0% навантаження CPU</text>

  <line x1="850" y1="255" x2="850" y2="295" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>
  <text x="858" y="279" font-size="11" fill="#27ae60">Автопотік</text>

  <rect x="775" y="295" width="150" height="120" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="850" y="320" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ШІМ &amp; FOC Керування</text>
  <text x="850" y="342" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">HRTIM / TIM1</text>
  <text x="850" y="364" font-size="12" fill="#6b7280" text-anchor="middle">Векторний розрахунок</text>
  <text x="850" y="386" font-size="12" fill="#6b7280" text-anchor="middle">Силові MOSFET/IGBT</text>
</svg>
