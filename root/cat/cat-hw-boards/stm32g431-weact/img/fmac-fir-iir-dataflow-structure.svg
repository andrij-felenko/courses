<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>
  <defs>
    <!-- Arrow Markers -->
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Структура даних та потік обчислень FMAC для КІХ і ІІХ фільтрів</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Кільцеві буфери SRAM накопичують x[n] та y[n], забезпечуючи згортку з коефіцієнтами в MAC-ядри</text>

  <!-- Main Peripheral Container -->
  <rect x="25" y="65" width="910" height="480" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="45" y="85" font-size="14" font-weight="bold" fill="#1a1a1a">Модуль FMAC (Filter Math Accelerator)</text>

  <!-- Top Bus Line: DMA Input to Buffer X1 -->
  <path d="M 700 185 L 675 185 L 675 98 L 94 98 L 94 145" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="515" y="92" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Запис вхідних відліків x[n] через DMA / ADC</text>

  <!-- PANEL 1: SRAM Memory -->
  <rect x="45" y="110" width="300" height="420" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="130" y="130" font-size="14" font-weight="bold" fill="#2457d6">Пам'ять SRAM (Dual-Port)</text>

  <!-- Sub-buffer 1.1: Buffer X1 -->
  <rect x="58" y="145" width="274" height="110" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="70" y="163" font-size="12" font-weight="bold" fill="#1a1a1a">Буфер X1: Вхідні відліки x[n]</text>

  <rect x="70" y="175" width="48" height="30" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="94" y="195" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">x[n]</text>

  <rect x="122" y="175" width="48" height="30" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="146" y="195" font-size="12" fill="#1a1a1a" text-anchor="middle">x[n-1]</text>

  <rect x="174" y="175" width="48" height="30" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="198" y="195" font-size="12" fill="#1a1a1a" text-anchor="middle">x[n-2]</text>

  <rect x="226" y="175" width="48" height="30" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="250" y="195" font-size="12" fill="#6b7280" text-anchor="middle">...</text>

  <rect x="278" y="175" width="48" height="30" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="302" y="195" font-size="12" fill="#1a1a1a" text-anchor="middle">x[n-N]</text>

  <text x="70" y="222" font-size="12" fill="#2457d6">▲ WP (Write)</text>
  <text x="210" y="222" font-size="12" fill="#6b7280">▲ RP (Read)</text>
  <text x="70" y="242" font-size="12" fill="#6b7280">Розмір: X1_SIZE (до 256 слів)</text>

  <!-- Sub-buffer 1.2: Coefficients -->
  <rect x="58" y="270" width="274" height="110" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="70" y="288" font-size="12" font-weight="bold" fill="#1a1a1a">Буфер коефіцієнтів (B / A)</text>

  <rect x="70" y="298" width="48" height="30" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="94" y="318" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">b₀</text>

  <rect x="122" y="298" width="48" height="30" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="146" y="318" font-size="12" fill="#1a1a1a" text-anchor="middle">b₁</text>

  <rect x="174" y="298" width="48" height="30" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="198" y="318" font-size="12" fill="#1a1a1a" text-anchor="middle">b₂</text>

  <rect x="226" y="298" width="48" height="30" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="250" y="318" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">a₁</text>

  <rect x="278" y="298" width="48" height="30" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="302" y="318" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">a₂</text>

  <text x="70" y="347" font-size="12" fill="#27ae60">bₖ: Коефіцієнти КІХ (FIR)</text>
  <text x="70" y="365" font-size="12" fill="#c0392b">aₘ: Коефіцієнти ІІХ (IIR)</text>

  <!-- Sub-buffer 1.3: Buffer X2 / Y -->
  <rect x="58" y="395" width="274" height="110" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="70" y="413" font-size="12" font-weight="bold" fill="#1a1a1a">Буфер X2 / Y: Стан IIR та вихід</text>

  <rect x="70" y="423" width="60" height="30" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="100" y="443" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">y[n-1]</text>

  <rect x="136" y="423" width="60" height="30" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="166" y="443" font-size="12" fill="#c0392b" text-anchor="middle">y[n-2]</text>

  <rect x="202" y="423" width="60" height="30" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="232" y="443" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">y[n]</text>

  <rect x="268" y="423" width="58" height="30" rx="3" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="297" y="443" font-size="12" fill="#6b7280" text-anchor="middle">y[n+1]</text>

  <text x="70" y="473" font-size="12" fill="#c0392b">Буфер X2: Історія стан-змінних ІІХ</text>
  <text x="70" y="491" font-size="12" fill="#27ae60">Буфер Y: Запис готового відліку</text>

  <!-- PANEL 2: MAC Execution Core -->
  <rect x="365" y="110" width="300" height="420" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="380" y="130" font-size="14" font-weight="bold" fill="#2457d6">Обчислювальне ядро MAC</text>

  <!-- Block 2.1: Multiplier -->
  <rect x="380" y="145" width="270" height="85" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="515" y="167" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Апаратний Множник (16×16 / 32×32)</text>
  <text x="515" y="187" font-size="12" fill="#2457d6" text-anchor="middle">КІХ (FIR):  Pₖ = x[n-k] · bₖ</text>
  <text x="515" y="207" font-size="12" fill="#c0392b" text-anchor="middle">ІІХ (IIR):  Pₘ = y[n-m] · aₘ</text>

  <!-- Arrow Multiplier to Accumulator -->
  <path d="M 515 230 L 515 260" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="525" y="249" font-size="12" fill="#2457d6">Добутки Pₖ / Pₘ</text>

  <!-- Block 2.2: Accumulator -->
  <rect x="380" y="260" width="270" height="95" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="515" y="280" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">43-бітний Накопичувач (ACC)</text>
  <text x="515" y="302" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ACC = ∑ (bₖ · x[n-k]) + ∑ (aₘ · y[n-m])</text>
  <text x="515" y="322" font-size="12" fill="#6b7280" text-anchor="middle">Захист від переповнення (7 guard бітів)</text>
  <text x="515" y="340" font-size="12" fill="#6b7280" text-anchor="middle">Сумування N відліків КІХ + M відліків ІІХ</text>

  <!-- Arrow Accumulator to Scaling -->
  <path d="M 515 355 L 515 385" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="525" y="374" font-size="12" fill="#27ae60">43-бітний ACC</text>

  <!-- Block 2.3: Scaling & Saturation -->
  <rect x="380" y="385" width="270" height="70" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="515" y="405" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Масштабування та Насичення</text>
  <text x="515" y="425" font-size="12" fill="#27ae60" text-anchor="middle">Правий зсув: RSHIFT (0..7 біт)</text>
  <text x="515" y="443" font-size="12" fill="#6b7280" text-anchor="middle">Кліпінг до Q15 [-1, +1) або Q31</text>

  <!-- Arrow Scaling to Out Register -->
  <path d="M 515 455 L 515 470" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Block 2.4: Out Register -->
  <rect x="420" y="470" width="190" height="45" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="515" y="490" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Регістр виходу FMAC_RDAT</text>
  <text x="515" y="506" font-size="12" fill="#1a1a1a" text-anchor="middle">Готовий відлік y[n] (Q15 / Q31)</text>

  <!-- PANEL 3: Control & Bus Interface -->
  <rect x="685" y="110" width="230" height="420" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="700" y="130" font-size="14" font-weight="bold" fill="#1a1a1a">Інтерфейс та Керування</text>

  <!-- Module 3.1: DMA Input Source -->
  <rect x="700" y="145" width="200" height="85" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="800" y="167" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Джерело Даних (x[n])</text>
  <text x="800" y="187" font-size="12" fill="#2457d6" text-anchor="middle">DMA1 / ADC1, ADC2, ADC3</text>
  <text x="800" y="207" font-size="12" fill="#6b7280" text-anchor="middle">Автозапис у FMAC_WDATA</text>

  <!-- Module 3.2: FMAC Registers -->
  <rect x="700" y="255" width="200" height="150" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="800" y="275" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Регістри FMAC</text>
  <text x="715" y="296" font-size="12" font-weight="bold" fill="#2457d6">FMAC_PARAM:</text>
  <text x="715" y="312" font-size="12" fill="#6b7280">• N (КІХ), M (стан ІІХ)</text>
  <text x="715" y="328" font-size="12" fill="#6b7280">• RSHIFT, START біт</text>
  <text x="715" y="350" font-size="12" font-weight="bold" fill="#2457d6">FMAC_CR / FMAC_SR:</text>
  <text x="715" y="366" font-size="12" fill="#6b7280">• DMAREN, DMAWEN</text>
  <text x="715" y="382" font-size="12" fill="#6b7280">• YEMPTY, X1FULL прапори</text>

  <!-- Module 3.3: Output Receiver -->
  <rect x="700" y="430" width="200" height="85" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="800" y="452" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Приймач Результату</text>
  <text x="800" y="472" font-size="12" fill="#27ae60" text-anchor="middle">DMA2 / DAC1,2 / CPU</text>
  <text x="800" y="490" font-size="12" fill="#6b7280" text-anchor="middle">Зчитування з FMAC_RDAT</text>

  <!-- Dataflow Connections -->
  <!-- Connection 2: Buffer X1 to Multiplier -->
  <path d="M 332 195 L 380 195" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="356" y="187" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">x[n-k]</text>

  <!-- Connection 3: Buffer Coeffs to Multiplier -->
  <path d="M 332 315 L 350 315 L 350 205 L 380 205" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="344" y="260" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">bₖ / aₘ</text>

  <!-- Connection 4: Buffer X2 (IIR Feedback State) to Multiplier -->
  <path d="M 332 440 L 360 440 L 360 215 L 380 215" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="346" y="432" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">y[n-m]</text>

  <!-- Connection 5 Output Branch 1: Out Register to Buffer Y -->
  <path d="M 515 515 L 515 532 L 232 532 L 232 505" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="373" y="526" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Запис y[n] у Буфер Y</text>

  <!-- Connection 5 Output Branch 2: Out Register to DMA Output -->
  <path d="M 515 515 L 515 532 L 800 532 L 800 515" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="657" y="526" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Потік даних ➔ DMA / DAC</text>
</svg>
