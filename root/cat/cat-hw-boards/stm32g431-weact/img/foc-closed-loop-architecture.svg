<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="580" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Замкнена архітектура векторного керування (FOC) на STM32G431</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Синхронне зчитування струмів (OPAMP+ADC), обчислення CORDIC та ШІМ з мертвим часом (TIM1)</text>

  <!-- Основні контейнери -->
  <!-- Панель МК -->
  <rect x="25" y="78" width="770" height="480" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="40" y="98" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="start">Мікроконтролер STM32G431CBU6</text>

  <!-- Панель Силової частини та двигуна -->
  <rect x="805" y="78" width="135" height="480" fill="#ffffff" stroke="#d0d7de" stroke-dasharray="4 4" stroke-width="1.5" rx="8"/>
  <text x="815" y="98" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">Силова частина</text>

  <!-- БЛОКИ ПРЯМОГО ПОТОКУ (ROW 1) -->

  <!-- 1. Вхідний сигнал omega_ref та Суматор швидкості Sigma Speed -->
  <line x1="25" y1="160" x2="46" y2="160" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="30" y="142" font-size="11" fill="#1a1a1a" text-anchor="start">ω_ref</text>

  <circle cx="62" cy="160" r="14" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="62" y="161" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Σ</text>
  <text x="51" y="157" font-size="10" font-weight="bold" fill="#27ae60">+</text>
  <text x="62" y="173" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">-</text>

  <!-- 2. PI регулятор швидкості -->
  <line x1="76" y1="160" x2="113" y2="160" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="94.5" y="142" font-size="11" fill="#6b7280" text-anchor="middle">e_ω</text>

  <rect x="115" y="135" width="65" height="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="147.5" y="154" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">PI</text>
  <text x="147.5" y="170" font-size="12" fill="#1a1a1a" text-anchor="middle">швидкості</text>

  <!-- 3. Суматори струму Sigma Q & Sigma D -->
  <!-- Sigma Q -->
  <line x1="180" y1="160" x2="224" y2="160" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="202" y="142" font-size="11" fill="#1a1a1a" text-anchor="middle">i_q,ref</text>

  <circle cx="240" cy="160" r="14" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="240" y="161" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Σ</text>
  <text x="229" y="157" font-size="10" font-weight="bold" fill="#27ae60">+</text>
  <text x="240" y="173" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">-</text>

  <!-- Sigma D -->
  <line x1="140" y1="240" x2="224" y2="240" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="145" y="224" font-size="11" fill="#1a1a1a" text-anchor="start">i_d,ref=0</text>

  <circle cx="240" cy="240" r="14" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="240" y="241" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Σ</text>
  <text x="229" y="237" font-size="10" font-weight="bold" fill="#27ae60">+</text>
  <text x="240" y="253" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">-</text>

  <!-- 4. PI регулятори струму (q-ось & d-ось) -->
  <line x1="254" y1="160" x2="278" y2="160" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="280" y="135" width="70" height="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="315" y="154" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">PI струму</text>
  <text x="315" y="170" font-size="11" fill="#6b7280" text-anchor="middle">(q-ось)</text>

  <line x1="254" y1="240" x2="278" y2="240" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="280" y="215" width="70" height="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="315" y="234" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">PI струму</text>
  <text x="315" y="250" font-size="11" fill="#6b7280" text-anchor="middle">(d-ось)</text>

  <!-- 5. Обернений Парк CORDIC -->
  <line x1="350" y1="160" x2="393" y2="160" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="371.5" y="142" font-size="11" fill="#1a1a1a" text-anchor="middle">v_q</text>

  <line x1="350" y1="240" x2="393" y2="240" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="371.5" y="222" font-size="11" fill="#1a1a1a" text-anchor="middle">v_d</text>

  <rect x="395" y="125" width="125" height="150" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="6"/>
  <text x="457.5" y="147" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Обернений Парк</text>
  <text x="457.5" y="163" font-size="11" fill="#6b7280" text-anchor="middle">( Inv. Park )</text>
  <text x="457.5" y="183" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">[ CORDIC ]</text>
  <text x="457.5" y="203" font-size="11" fill="#1a1a1a" text-anchor="middle">vd,vq,θ → vα,vβ</text>
  <text x="457.5" y="223" font-size="11" fill="#6b7280" text-anchor="middle">апаратне коло</text>

  <!-- 6. Просторово-векторна модуляція SVPWM -->
  <line x1="520" y1="200" x2="578" y2="200" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="549" y="180" font-size="11" fill="#1a1a1a" text-anchor="middle">v_α,v_β</text>

  <rect x="580" y="135" width="80" height="130" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="620" y="165" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">SVPWM</text>
  <text x="620" y="185" font-size="12" fill="#1a1a1a" text-anchor="middle">Модуляція</text>
  <text x="620" y="205" font-size="11" fill="#6b7280" text-anchor="middle">da, db, dc</text>

  <!-- 7. Периферійний таймер TIM1 (PWM) -->
  <line x1="660" y1="200" x2="703" y2="200" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="681.5" y="180" font-size="11" fill="#1a1a1a" text-anchor="middle">d_a,b,c</text>

  <rect x="705" y="125" width="75" height="150" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="6"/>
  <text x="742.5" y="147" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">TIM1 (PWM)</text>
  <text x="742.5" y="167" font-size="11" fill="#1a1a1a" text-anchor="middle">3-фазний ШІМ</text>
  <text x="742.5" y="187" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">+ Dead-Time</text>
  <text x="742.5" y="207" font-size="11" fill="#1a1a1a" text-anchor="middle">6 комплем.</text>
  <text x="742.5" y="223" font-size="11" fill="#1a1a1a" text-anchor="middle">виходів</text>

  <!-- 8. Силовий інвертор (MOSFET Bridge + Shunts) -->
  <line x1="780" y1="200" x2="813" y2="200" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="815" y="135" width="60" height="130" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="845" y="120" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">6x PWM</text>
  <text x="845" y="160" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Інвертор</text>
  <text x="845" y="178" font-size="11" fill="#1a1a1a" text-anchor="middle">3-фазний</text>
  <text x="845" y="196" font-size="11" fill="#6b7280" text-anchor="middle">MOSFET</text>
  <text x="845" y="216" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">+ шунти</text>

  <!-- 9. BLDC Двигун -->
  <line x1="875" y1="200" x2="900" y2="200" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="889" y="180" font-size="10" fill="#1a1a1a" text-anchor="middle">U,V,W</text>

  <circle cx="920" cy="200" r="18" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="920" y="197" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="middle">BLDC</text>
  <text x="920" y="209" font-size="10" fill="#1a1a1a" text-anchor="middle">Двигун</text>

  <!-- БЛОКИ ЗВОРОТНОГО ЗВ'ЯЗКУ (ROW 2) -->

  <!-- 10. Датчик / Енкодер положення -->
  <rect x="840" y="355" width="85" height="70" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="882.5" y="378" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Датчик /</text>
  <text x="882.5" y="394" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Енкодер</text>
  <text x="882.5" y="412" font-size="11" fill="#6b7280" text-anchor="middle">θ, ω</text>

  <!-- Механічний вал від двигуна до датчика -->
  <line x1="920" y1="218" x2="920" y2="353" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arr)"/>
  <text x="923" y="290" font-size="10" fill="#6b7280" text-anchor="start">вал</text>

  <!-- 11. Вбудовані операційні підсилювачі OPAMP1..3 -->
  <rect x="670" y="355" width="80" height="70" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="6"/>
  <text x="710" y="378" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">OPAMP1..3</text>
  <text x="710" y="396" font-size="11" fill="#1a1a1a" text-anchor="middle">Підсилення</text>
  <text x="710" y="414" font-size="11" fill="#1a1a1a" text-anchor="middle">сигналів</text>

  <!-- Лінія заміру струмів від шунтів інвертора до OPAMP -->
  <polyline points="845,265 845,390 752,390" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="760" y="375" font-size="11" fill="#1a1a1a" text-anchor="start">V_sh</text>

  <!-- 12. Аналогово-цифровий перетворювач ADC1 / ADC2 -->
  <rect x="540" y="355" width="85" height="70" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="6"/>
  <text x="582.5" y="378" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ADC1 / ADC2</text>
  <text x="582.5" y="396" font-size="11" fill="#1a1a1a" text-anchor="middle">Синхронний</text>
  <text x="582.5" y="414" font-size="11" fill="#1a1a1a" text-anchor="middle">замір</text>

  <!-- З'єднання OPAMP -> ADC -->
  <line x1="670" y1="390" x2="627" y2="390" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="648.5" y="375" font-size="11" fill="#6b7280" text-anchor="middle">V_amp</text>

  <!-- 13. Перетворення Кларка (Clarke) -->
  <rect x="395" y="355" width="100" height="70" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="445" y="376" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кларк (Clarke)</text>
  <text x="445" y="394" font-size="11" fill="#6b7280" text-anchor="middle">ia,ib → iα,iβ</text>
  <text x="445" y="412" font-size="11" fill="#1a1a1a" text-anchor="middle">перетворення</text>

  <!-- З'єднання ADC -> Clarke -->
  <line x1="540" y1="390" x2="497" y2="390" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="518.5" y="375" font-size="11" fill="#1a1a1a" text-anchor="middle">ia,ib</text>

  <!-- 14. Прямий Парк CORDIC -->
  <rect x="225" y="325" width="120" height="130" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="6"/>
  <text x="285" y="345" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Прямий Парк</text>
  <text x="285" y="362" font-size="11" fill="#6b7280" text-anchor="middle">( Park Trans. )</text>
  <text x="285" y="380" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">[ CORDIC ]</text>
  <text x="285" y="398" font-size="11" fill="#1a1a1a" text-anchor="middle">iα,iβ,θ → id,iq</text>
  <text x="285" y="416" font-size="11" fill="#6b7280" text-anchor="middle">апаратне коло</text>

  <!-- З'єднання Clarke -> Park CORDIC -->
  <line x1="395" y1="390" x2="347" y2="390" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="367" y="375" font-size="11" fill="#1a1a1a" text-anchor="middle">i_α,i_β</text>

  <!-- ТРАСУВАННЯ ЛІНІЙ ЗВОРОТНОГО ЗВ'ЯЗКУ -->

  <!-- Кут ротора theta (від Датчика до CORDIC блоків) -->
  <polyline points="840,390 770,390 770,480 390,480 390,290 457.5,290 457.5,277" fill="none" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <polyline points="390,480 285,480 285,457" fill="none" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="550" y="472" font-size="11" fill="#27ae60" text-anchor="middle">θ (кут ротора)</text>

  <!-- Швидкість omega (від Датчика до Sigma Speed) -->
  <polyline points="840,410 780,410 780,520 62,520 62,176" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="430" y="512" font-size="11" fill="#2457d6" text-anchor="middle">ω (виміряна швидкість)</text>

  <!-- Струм i_q від Park CORDIC до Sigma Q -->
  <polyline points="225,360 210,360 210,174 238,174" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="204" y="300" font-size="11" fill="#2457d6" text-anchor="end">i_q</text>

  <!-- Струм i_d від Park CORDIC до Sigma D -->
  <polyline points="225,420 120,420 120,254 238,254" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="114" y="330" font-size="11" fill="#2457d6" text-anchor="end">i_d</text>

</svg>
