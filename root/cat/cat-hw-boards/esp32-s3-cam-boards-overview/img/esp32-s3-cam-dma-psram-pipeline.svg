<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Конвеєр захоплення відео та DMA-буферизації в ESP32-S3</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Прямий доступ DMA до PSRAM вивільняє ядро Xtensa LX7 для векторного інференсу AI-моделей</text>

  <!-- Stage 1 Panel: DVP Camera -->
  <rect x="25" y="80" width="185" height="335" fill="#f4f6f8" stroke="#d0d7de" rx="8"/>
  <rect x="25" y="80" width="185" height="36" fill="#eaf0fd" stroke="#d0d7de" rx="8"/>
  <text x="117" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="#2457d6">1. DVP-камера</text>

  <rect x="37" y="130" width="161" height="70" fill="white" stroke="#d0d7de" rx="6"/>
  <text x="117" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Сенсор OV2640</text>
  <text x="117" y="177" text-anchor="middle" font-size="12" fill="#6b7280">8-bit DVP / PCLK</text>

  <rect x="37" y="215" width="161" height="100" fill="white" stroke="#d0d7de" rx="6"/>
  <text x="47" y="237" text-anchor="start" font-size="12" font-weight="700" fill="#1a1a1a">Сигнали шини:</text>
  <text x="47" y="257" text-anchor="start" font-size="12" fill="#1a1a1a">• D0–D7 (Дані)</text>
  <text x="47" y="275" text-anchor="start" font-size="12" fill="#1a1a1a">• VSYNC / HREF</text>
  <text x="47" y="293" text-anchor="start" font-size="12" fill="#1a1a1a">• PCLK (Такти)</text>

  <rect x="37" y="330" width="161" height="70" fill="#eaf0fd" stroke="#2457d6" rx="6"/>
  <text x="117" y="355" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Потік пікселів</text>
  <text x="117" y="375" text-anchor="middle" font-size="12" fill="#2457d6">RGB565 / YUV422</text>

  <!-- Stage 2 Panel: CAM/DMA Controller -->
  <rect x="265" y="80" width="185" height="335" fill="#f4f6f8" stroke="#d0d7de" rx="8"/>
  <rect x="265" y="80" width="185" height="36" fill="#eaf0fd" stroke="#d0d7de" rx="8"/>
  <text x="357" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="#2457d6">2. CAM/DMA Контролер</text>

  <rect x="277" y="130" width="161" height="70" fill="white" stroke="#d0d7de" rx="6"/>
  <text x="357" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Периферія CAM</text>
  <text x="357" y="177" text-anchor="middle" font-size="12" fill="#6b7280">Апаратне захоплення</text>

  <rect x="277" y="215" width="161" height="100" fill="white" stroke="#d0d7de" rx="6"/>
  <text x="287" y="237" text-anchor="start" font-size="12" font-weight="700" fill="#1a1a1a">Контролер GDMA:</text>
  <text x="287" y="257" text-anchor="start" font-size="12" fill="#1a1a1a">• Ping-Pong арбітр</text>
  <text x="287" y="275" text-anchor="start" font-size="12" font-weight="700" fill="#27ae60">• Авто-перемикання</text>
  <text x="287" y="293" text-anchor="start" font-size="12" fill="#1a1a1a">• Переривання EOF</text>

  <rect x="277" y="330" width="161" height="70" fill="#e9f7ef" stroke="#27ae60" rx="6"/>
  <text x="357" y="355" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">Нуль навантаження</text>
  <text x="357" y="375" text-anchor="middle" font-size="12" fill="#27ae60">на CPU при передачі</text>

  <!-- Stage 3 Panel: Octal PSRAM -->
  <rect x="505" y="80" width="185" height="335" fill="#f4f6f8" stroke="#d0d7de" rx="8"/>
  <rect x="505" y="80" width="185" height="36" fill="#eaf0fd" stroke="#d0d7de" rx="8"/>
  <text x="597" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="#2457d6">3. Octal PSRAM</text>

  <rect x="517" y="130" width="161" height="80" fill="#eaf0fd" stroke="#2457d6" rx="6"/>
  <text x="597" y="153" text-anchor="middle" font-size="13" font-weight="700" fill="#2457d6">Буфер A (Кадр N)</text>
  <text x="597" y="173" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">DMA прийом...</text>
  <text x="597" y="193" text-anchor="middle" font-size="12" fill="#6b7280">[ Заповнення ]</text>

  <rect x="517" y="225" width="161" height="80" fill="#e9f7ef" stroke="#27ae60" rx="6"/>
  <text x="597" y="248" text-anchor="middle" font-size="13" font-weight="700" fill="#27ae60">Буфер B (Кадр N-1)</text>
  <text x="597" y="268" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">Готовий кадр</text>
  <text x="597" y="288" text-anchor="middle" font-size="12" fill="#27ae60">[ Читання CPU ]</text>

  <rect x="517" y="320" width="161" height="80" fill="white" stroke="#d0d7de" rx="6"/>
  <text x="597" y="343" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Подвійна буферизація</text>
  <text x="597" y="363" text-anchor="middle" font-size="12" fill="#6b7280">Без розривів кадрів</text>
  <text x="597" y="383" text-anchor="middle" font-size="12" fill="#6b7280">(No frame tearing)</text>

  <!-- Stage 4 Panel: Xtensa LX7 Core -->
  <rect x="745" y="80" width="185" height="335" fill="#f4f6f8" stroke="#d0d7de" rx="8"/>
  <rect x="745" y="80" width="185" height="36" fill="#eaf0fd" stroke="#d0d7de" rx="8"/>
  <text x="837" y="103" text-anchor="middle" font-size="14" font-weight="700" fill="#2457d6">4. Xtensa LX7 Core</text>

  <rect x="757" y="130" width="161" height="70" fill="white" stroke="#d0d7de" rx="6"/>
  <text x="837" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Vector Extension</text>
  <text x="837" y="177" text-anchor="middle" font-size="12" fill="#6b7280">128-bit SIMD (S390)</text>

  <rect x="757" y="215" width="161" height="100" fill="white" stroke="#d0d7de" rx="6"/>
  <text x="767" y="237" text-anchor="start" font-size="12" font-weight="700" fill="#1a1a1a">Інференс AI:</text>
  <text x="767" y="257" text-anchor="start" font-size="12" fill="#1a1a1a">• ESP-WHO / TFLite</text>
  <text x="767" y="275" text-anchor="start" font-size="12" fill="#1a1a1a">• Квантування INT8</text>
  <text x="767" y="293" text-anchor="start" font-size="12" font-weight="700" fill="#2457d6">• Детекція облич</text>

  <rect x="757" y="330" width="161" height="70" fill="#eaf0fd" stroke="#2457d6" rx="6"/>
  <text x="837" y="355" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Прискорення AI</text>
  <text x="837" y="375" text-anchor="middle" font-size="12" fill="#2457d6">до 4–10x (Vector SIMD)</text>

  <!-- Connectors & Labels -->
  <!-- 1 -> 2: DVP bus -->
  <line x1="210" y1="165" x2="260" y2="165" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="235" y="153" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">DVP</text>

  <!-- 2 -> 3: DMA to Buffer A -->
  <line x1="450" y1="165" x2="500" y2="165" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="477" y="153" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">DMA</text>

  <!-- 3 -> 4: Buffer B to CPU -->
  <line x1="690" y1="265" x2="740" y2="265" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="717" y="253" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">Frame</text>

  <!-- Bottom Legend / Summary -->
  <rect x="25" y="430" width="905" height="36" fill="#f4f6f8" stroke="#d0d7de" rx="6"/>
  <text x="477" y="453" text-anchor="middle" font-size="12" fill="#1a1a1a">Кадр N приймається по DMA в Buffer A, поки ядро Xtensa LX7 обробляє готовий Кадр N-1 з Buffer B</text>
</svg>
