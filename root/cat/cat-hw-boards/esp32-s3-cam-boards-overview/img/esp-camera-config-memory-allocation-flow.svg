<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="35" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Взаємозв'язок полів camera_config_t та розподілу ОЗП камери</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Роздільна здатність, піксельний формат і fb_count визначають розмір буферів та їхнє розміщення в SRAM або PSRAM</text>

  <!-- Panel 1: Configuration -->
  <rect x="24" y="80" width="276" height="436" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="162" y="106" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Параметри camera_config_t</text>

  <!-- Card 1.1 -->
  <rect x="40" y="124" width="244" height="88" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="52" y="145" font-size="13" font-weight="700" fill="#2457d6">frame_size</text>
  <text x="52" y="165" font-size="12" fill="#1a1a1a">FRAMESIZE_VGA (640 × 480)</text>
  <text x="52" y="185" font-size="12" fill="#6b7280">Визначає кількість пікселів (N)</text>

  <!-- Card 1.2 -->
  <rect x="40" y="228" width="244" height="104" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="52" y="249" font-size="13" font-weight="700" fill="#2457d6">pixel_format</text>
  <text x="52" y="269" font-size="12" fill="#1a1a1a">PIXFORMAT_RGB565 (2 B/пікс)</text>
  <text x="52" y="289" font-size="12" fill="#1a1a1a">PIXFORMAT_JPEG (стиснення)</text>
  <text x="52" y="309" font-size="12" fill="#6b7280">Визначає розмір пікселя (Bpp)</text>

  <!-- Card 1.3 -->
  <rect x="40" y="348" width="244" height="152" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="52" y="369" font-size="13" font-weight="700" fill="#2457d6">fb_count &amp; fb_location</text>
  <text x="52" y="389" font-size="12" fill="#1a1a1a">fb_count: 1 або 2 (Double Buffer)</text>
  <text x="52" y="409" font-size="12" fill="#1a1a1a">CAMERA_FB_IN_PSRAM</text>
  <text x="52" y="429" font-size="12" fill="#1a1a1a">CAMERA_FB_IN_DRAM</text>
  <text x="52" y="457" font-size="12" fill="#6b7280">Задає кількість і локацію кадрів</text>
  <text x="52" y="477" font-size="12" fill="#6b7280">в пам'яті системи</text>

  <!-- Panel 2: Logic & Calculation -->
  <rect x="324" y="80" width="312" height="436" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="106" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Розрахунок пам'яті та ініціалізація</text>

  <!-- Box 2.1 -->
  <rect x="340" y="124" width="280" height="116" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="146" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">Розрахунок розміру кадрового буфера</text>
  <text x="352" y="168" font-size="12" fill="#1a1a1a">Розмір 1 кадру = W × H × Bpp</text>
  <text x="352" y="188" font-size="12" fill="#1a1a1a">RGB565 VGA: 640×480×2 = 614.4 КБ</text>
  <text x="352" y="208" font-size="12" fill="#1a1a1a">JPEG VGA: ~30..80 КБ (динамічний)</text>
  <text x="352" y="228" font-size="12" font-weight="700" fill="#2457d6">Загалом = Розмір × fb_count</text>

  <!-- Box 2.2 -->
  <rect x="340" y="256" width="280" height="100" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="277" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">esp_camera_init(&amp;config)</text>
  <text x="352" y="297" font-size="12" fill="#1a1a1a">1. Перевірка наявності PSRAM</text>
  <text x="352" y="317" font-size="12" fill="#1a1a1a">2. Налаштування DMA камери</text>
  <text x="352" y="337" font-size="12" fill="#1a1a1a">3. Виділення пам'яті під буфери</text>

  <!-- Box 2.3 -->
  <rect x="340" y="372" width="280" height="128" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="393" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Перевірка вимог до пам'яті</text>
  <text x="352" y="415" font-size="12" fill="#c0392b" font-weight="700">Якщо нестиснений кадр або &gt;300 КБ:</text>
  <text x="352" y="433" font-size="12" fill="#1a1a1a">Потрібен PSRAM (heap_caps_malloc)</text>
  <text x="352" y="457" font-size="12" fill="#27ae60" font-weight="700">Якщо малий кадр (JPEG QVGA) &lt;100 КБ:</text>
  <text x="352" y="475" font-size="12" fill="#1a1a1a">Можливо вмістити у внутрішню SRAM</text>

  <!-- Panel 3: Hardware RAM -->
  <rect x="660" y="80" width="276" height="436" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="798" y="106" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Фізична пам'ять ESP32-S3</text>

  <!-- Card 3.1 -->
  <rect x="676" y="124" width="244" height="168" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="688" y="146" font-size="13" font-weight="700" fill="#c0392b">Внутрішня SRAM (~512 КБ)</text>
  <text x="688" y="166" font-size="12" font-weight="700" fill="#1a1a1a">Доступно для кадру: ~200-300 КБ</text>
  <text x="688" y="186" font-size="12" fill="#1a1a1a">• Дескриптори DMA (обв'язка)</text>
  <text x="688" y="206" font-size="12" fill="#1a1a1a">• Драйвер SCCB / I2C / структури</text>
  <text x="688" y="226" font-size="12" fill="#1a1a1a">• Тільки малі буфери JPEG</text>
  <rect x="686" y="238" width="224" height="44" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="694" y="255" font-size="12" fill="#c0392b" font-weight="700">⚠️ Переповнення при RGB565 / VGA!</text>
  <text x="694" y="273" font-size="12" fill="#6b7280">Нестача DRAM викликає crash</text>

  <!-- Card 3.2 -->
  <rect x="676" y="308" width="244" height="192" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="688" y="330" font-size="13" font-weight="700" fill="#27ae60">Зовнішня PSRAM (8 / 16 МБ)</text>
  <text x="688" y="350" font-size="12" font-weight="700" fill="#1a1a1a">Основне сховище кадрових буферів</text>
  <text x="688" y="370" font-size="12" fill="#1a1a1a">• camera_fb_t (буфери кадру)</text>
  <text x="688" y="390" font-size="12" fill="#1a1a1a">• Подвійна буферизація (fb_count=2)</text>
  <text x="688" y="410" font-size="12" fill="#1a1a1a">• Великі формати (VGA, UXGA, RGB)</text>
  <rect x="686" y="422" width="224" height="68" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="694" y="439" font-size="12" fill="#27ae60" font-weight="700">✓ Рекомендовано для ESP32-S3-CAM</text>
  <text x="694" y="457" font-size="12" fill="#1a1a1a">Забезпечує високу роздільну здатність</text>
  <text x="694" y="475" font-size="12" fill="#6b7280">та стабільний FPS без витоків пам'яті</text>

  <!-- Connecting Lines -->
  <!-- Col 1 Card 1.1 -> Col 2 Box 2.1 -->
  <path d="M284,168 L332,168" stroke="#2457d6" stroke-width="2" fill="none" marker-end="url(#arr-blue)"/>

  <!-- Col 2 Box 2.1 -> Box 2.2 -->
  <path d="M480,240 L480,248" stroke="#2457d6" stroke-width="2" fill="none" marker-end="url(#arr-blue)"/>

  <!-- Col 2 Box 2.2 -> Box 2.3 -->
  <path d="M480,356 L480,364" stroke="#1a1a1a" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- Col 2 Box 2.3 Branch A -> Col 3 Card 3.1 -->
  <path d="M620,424 L644,424 L644,208 L668,208" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 3" fill="none" marker-end="url(#arr-red)"/>

  <!-- Col 2 Box 2.3 Branch B -> Col 3 Card 3.2 -->
  <path d="M620,456 L648,456 L648,404 L668,404" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>
</svg>
