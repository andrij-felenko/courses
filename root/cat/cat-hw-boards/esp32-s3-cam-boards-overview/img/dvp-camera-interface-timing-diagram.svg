<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="30" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Часова діаграма сигналів паралельного DVP-інтерфейсу</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Синхронізація сигналів VSYNC, HREF, PCLK і шини D0–D7 при захопленні відеокадру GDMA ESP32-S3</text>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Головна панель діаграми -->
  <rect x="20" y="68" width="920" height="392" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>

  <!-- Ліва колонка: Назви сигналів -->
  <!-- VSYNC -->
  <rect x="35" y="80" width="155" height="54" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="112" y="101" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">VSYNC</text>
  <text x="112" y="120" font-size="12" fill="#6b7280" text-anchor="middle">Кадрова синхронізація</text>

  <!-- HREF -->
  <rect x="35" y="150" width="155" height="54" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="112" y="171" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">HREF</text>
  <text x="112" y="190" font-size="12" fill="#6b7280" text-anchor="middle">Рядкова синхронізація</text>

  <!-- PCLK -->
  <rect x="35" y="220" width="155" height="54" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="112" y="241" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">PCLK</text>
  <text x="112" y="260" font-size="12" fill="#6b7280" text-anchor="middle">Тактування пікселів</text>

  <!-- D0-D7 -->
  <rect x="35" y="290" width="155" height="54" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="112" y="311" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">D0–D7</text>
  <text x="112" y="330" font-size="12" fill="#6b7280" text-anchor="middle">Паралельна шина даних</text>

  <!-- GDMA -->
  <rect x="35" y="370" width="155" height="74" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="112" y="392" font-size="13" font-weight="700" fill="#27ae60" text-anchor="middle">GDMA (ESP32-S3)</text>
  <text x="112" y="411" font-size="12" fill="#1a1a1a" text-anchor="middle">Захоплення даних</text>
  <text x="112" y="429" font-size="12" fill="#1a1a1a" text-anchor="middle">у RAM / PSRAM</text>

  <!-- Пунктирні лінії розділення фаз -->
  <line x1="310" y1="75" x2="310" y2="452" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="630" y1="75" x2="630" y2="452" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="730" y1="75" x2="730" y2="452" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Подзаголовки фаз вгорі діаграми -->
  <text x="257" y="91" font-size="12" font-weight="700" fill="#6b7280" text-anchor="middle">t_VSYNC (Кадрове гасіння)</text>
  <text x="470" y="91" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Передача активного рядка 1</text>
  <text x="680" y="91" font-size="12" font-weight="700" fill="#6b7280" text-anchor="middle">t_HREF</text>
  <text x="827" y="91" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Передача рядка 2</text>

  <!-- Сигнал VSYNC -->
  <path d="M205,105 L310,105 L310,128 L925,128" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <text x="250" y="120" font-size="12" fill="#c0392b" text-anchor="middle">VSYNC = 1 (Пауза)</text>
  <text x="470" y="120" font-size="12" fill="#27ae60" text-anchor="middle">VSYNC = 0 (Активний кадр)</text>

  <!-- Сигнал HREF -->
  <path d="M205,192 L330,192 L330,168 L630,168 L630,192 L730,192 L730,168 L925,168" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <text x="265" y="184" font-size="12" fill="#6b7280" text-anchor="middle">HREF = 0</text>
  <text x="480" y="160" font-size="12" fill="#2457d6" text-anchor="middle">HREF = 1 (Рядок 1)</text>
  <text x="680" y="184" font-size="12" fill="#6b7280" text-anchor="middle">t_HREF</text>
  <text x="827" y="160" font-size="12" fill="#2457d6" text-anchor="middle">HREF = 1 (Рядок 2)</text>

  <!-- Сигнал PCLK -->
  <path d="M205,256 L217,256 L217,232 L229,232 L229,256 L241,256 L241,232 L253,232 L253,256 L265,256 L265,232 L277,232 L277,256 L289,256 L289,232 L301,232 L301,256 L313,256 L313,232 L325,232 L325,256 L337,256 L337,232 L349,232 L349,256 L361,256 L361,232 L373,232 L373,256 L385,256 L385,232 L397,232 L397,256 L409,256 L409,232 L421,232 L421,256 L433,256 L433,232 L445,232 L445,256 L457,256 L457,232 L469,232 L469,256 L481,256 L481,232 L493,232 L493,256 L505,256 L505,232 L517,232 L517,256 L529,256 L529,232 L541,232 L541,256 L553,256 L553,232 L565,232 L565,256 L577,256 L577,232 L589,232 L589,256 L601,256 L601,232 L613,232 L613,256 L625,256 L625,232 L637,232 L637,256 L649,256 L649,232 L661,232 L661,256 L673,256 L673,232 L685,232 L685,256 L697,256 L697,232 L709,232 L709,256 L721,256 L721,232 L733,232 L733,256 L745,256 L745,232 L757,232 L757,256 L769,256 L769,232 L781,232 L781,256 L793,256 L793,232 L805,232 L805,256 L817,256 L817,232 L829,232 L829,256 L841,256 L841,232 L853,232 L853,256 L865,256 L865,232 L877,232 L877,256 L889,256 L889,232 L901,232 L901,256 L913,256 L913,232 L925,232" fill="none" stroke="#2457d6" stroke-width="1.8"/>
  <text x="257" y="224" font-size="12" fill="#6b7280" text-anchor="middle">Безперервний тактовий сигнал PCLK</text>

  <!-- Шина даних D0-D7 -->
  <!-- Неактивний стан High-Z до Рядка 1 -->
  <line x1="205" y1="319" x2="330" y2="319" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="267" y="313" font-size="12" fill="#6b7280" text-anchor="middle">High-Z</text>

  <!-- Байти Рядка 1 -->
  <polygon points="330,319 336,304 372,304 378,319 372,334 336,334" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="354" y="323" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Байт 0</text>

  <polygon points="378,319 384,304 420,304 426,319 420,334 384,334" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="402" y="323" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Байт 1</text>

  <polygon points="426,319 432,304 468,304 474,319 468,334 432,334" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="450" y="323" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Байт 2</text>

  <polygon points="474,319 480,304 516,304 522,319 516,334 480,334" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="498" y="323" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Байт 3</text>

  <polygon points="522,319 528,304 576,304 582,319 576,334 528,334" fill="#f4f6f8" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="552" y="323" font-size="12" font-weight="700" fill="#6b7280" text-anchor="middle">• • •</text>

  <polygon points="582,319 588,304 624,304 630,319 624,334 588,334" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="606" y="323" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Байт N</text>

  <!-- High-Z між рядками -->
  <line x1="630" y1="319" x2="730" y2="319" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="680" y="313" font-size="12" fill="#6b7280" text-anchor="middle">High-Z</text>

  <!-- Байти Рядка 2 -->
  <polygon points="730,319 736,304 772,304 778,319 772,334 736,334" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="754" y="323" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Байт 0</text>

  <polygon points="778,319 784,304 820,304 826,319 820,334 784,334" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="802" y="323" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Байт 1</text>

  <polygon points="826,319 832,304 868,304 874,319 868,334 832,334" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="850" y="323" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Байт 2</text>

  <polygon points="874,319 880,304 920,304 925,319 920,334 880,334" fill="#f4f6f8" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="899" y="323" font-size="12" font-weight="700" fill="#6b7280" text-anchor="middle">• • •</text>

  <!-- Стрілки захоплення GDMA -->
  <line x1="354" y1="340" x2="354" y2="366" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="402" y1="340" x2="402" y2="366" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="450" y1="340" x2="450" y2="366" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="498" y1="340" x2="498" y2="366" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Інформаційні блоки GDMA внизу -->
  <rect x="310" y="372" width="320" height="72" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="470" y="392" font-size="13" font-weight="700" fill="#27ae60" text-anchor="middle">Строб захоплення GDMA (ESP32-S3)</text>
  <text x="470" y="411" font-size="12" fill="#1a1a1a" text-anchor="middle">Фіксація байта даних за зростаючим фронтом PCLK</text>
  <text x="470" y="429" font-size="12" fill="#1a1a1a" text-anchor="middle">Автоматична передача в буфер кадру PSRAM через DMA</text>

  <rect x="636" y="372" width="88" height="72" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="680" y="401" font-size="12" fill="#6b7280" text-anchor="middle">Пауза DMA</text>
  <text x="680" y="420" font-size="12" fill="#6b7280" text-anchor="middle">(HREF = 0)</text>

  <rect x="730" y="372" width="195" height="72" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="827" y="392" font-size="13" font-weight="700" fill="#27ae60" text-anchor="middle">Продовження захоплення</text>
  <text x="827" y="411" font-size="12" fill="#1a1a1a" text-anchor="middle">Буферизація байтів</text>
  <text x="827" y="429" font-size="12" fill="#1a1a1a" text-anchor="middle">наступного рядка</text>
</svg>
