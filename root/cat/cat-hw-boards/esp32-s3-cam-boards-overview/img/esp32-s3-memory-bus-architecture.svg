<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Markers for arrows -->
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Архітектура шин і пам'яті ESP32-S3</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">DMA-контролер та Octal SPI шина забезпечують буферизацію кадру без залучення ядер CPU</text>

  <!-- ==================== LEFT COLUMN: CPU & DVP/DMA ==================== -->
  <!-- Top Panel: Xtensa Dual-Core CPU -->
  <rect x="30" y="85" width="230" height="175" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="145" y="107" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Xtensa® 32-bit LX7 Dual-Core</text>

  <!-- Core 0 & Core 1 -->
  <rect x="42" y="120" width="98" height="46" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="91" y="147" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Core 0 (CPU)</text>

  <rect x="148" y="120" width="98" height="46" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="197" y="147" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Core 1 (CPU)</text>

  <!-- Vector Accelerator -->
  <rect x="42" y="180" width="204" height="66" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="144" y="205" font-size="13" font-weight="700" fill="#1e7e34" text-anchor="middle">Векторний прискорювач</text>
  <text x="144" y="223" font-size="12" fill="#27ae60" text-anchor="middle">Xtensa Vector Extension (AI)</text>

  <!-- Bottom Panel: DVP Camera & GDMA -->
  <rect x="30" y="280" width="230" height="200" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="145" y="302" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">Периферія відеозахоплення</text>

  <!-- DVP Camera -->
  <rect x="42" y="315" width="206" height="60" fill="#ffffff" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="145" y="338" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Інтерфейс камери (DVP)</text>
  <text x="145" y="356" font-size="12" fill="#6b7280" text-anchor="middle">PCLK, VSYNC, HREF, D0-D7</text>

  <!-- GDMA Controller -->
  <rect x="42" y="395" width="206" height="70" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="145" y="422" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">GDMA Controller</text>
  <text x="145" y="442" font-size="12" fill="#2457d6" text-anchor="middle">Прямий потік кадрів у пам'ять</text>

  <!-- Connection: DVP to GDMA -->
  <line x1="145" y1="375" x2="145" y2="395" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>


  <!-- ==================== CENTER COLUMN: BUS MATRIX & SRAM ==================== -->
  <rect x="350" y="85" width="270" height="395" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="485" y="107" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Матриця шин (AHB Bus Matrix)</text>

  <!-- Sub-block: L1 Cache Controller -->
  <rect x="363" y="122" width="244" height="70" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="485" y="147" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">L1 Cache / Кеш-контролер</text>
  <text x="485" y="167" font-size="12" fill="#6b7280" text-anchor="middle">MMU трансляція адресної пам'яті</text>

  <!-- Sub-block: High-Speed AHB Bus Matrix -->
  <rect x="363" y="212" width="244" height="135" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="485" y="237" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Внутрішня шина (AHB Matrix)</text>

  <!-- Inner box showing DMA direct bypass route -->
  <rect x="375" y="250" width="220" height="82" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" stroke-dasharray="4 3" rx="4"/>
  <text x="485" y="273" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Прямий маршрут DMA ↔ RAM</text>
  <text x="485" y="293" font-size="12" fill="#2457d6" text-anchor="middle">Арбітраж каналів без затримок</text>
  <text x="485" y="313" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Обхід процесорних ядер CPU</text>

  <!-- Sub-block: Internal SRAM -->
  <rect x="363" y="365" width="244" height="100" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="485" y="390" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Внутрішня пам'ять SRAM</text>
  <text x="485" y="412" font-size="12" fill="#6b7280" text-anchor="middle">512 KB SRAM0/1/2 + RTC SRAM</text>
  <text x="485" y="432" font-size="12" fill="#6b7280" text-anchor="middle">Первинні DMA-буфери кадрів</text>


  <!-- ==================== RIGHT COLUMN: EXTERNAL MEMORY ==================== -->
  <rect x="700" y="85" width="230" height="395" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="815" y="107" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Зовнішня пам'ять (MSPI / OPI)</text>

  <!-- SPI Controller -->
  <rect x="712" y="122" width="206" height="70" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="815" y="147" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Octal SPI Controller</text>
  <text x="815" y="167" font-size="12" fill="#6b7280" text-anchor="middle">Підтримка OPI / QSPI режиму</text>

  <!-- High-Speed Octal SPI Bus -->
  <rect x="712" y="212" width="206" height="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="815" y="234" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Octal SPI Bus (8 ліній)</text>
  <text x="815" y="250" font-size="12" fill="#2457d6" text-anchor="middle">Пропускна здатність 80 MB/s</text>

  <!-- External PSRAM -->
  <rect x="712" y="280" width="206" height="95" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="815" y="305" font-size="13" font-weight="700" fill="#1e7e34" text-anchor="middle">Зовнішня PSRAM</text>
  <text x="815" y="327" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">8 MB Octal PSRAM (OPI)</text>
  <text x="815" y="347" font-size="12" fill="#27ae60" text-anchor="middle">Буферизація HD-кадрів (FB)</text>

  <!-- External Flash -->
  <rect x="712" y="390" width="206" height="75" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="815" y="415" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Зовнішня NOR Flash</text>
  <text x="815" y="437" font-size="12" fill="#6b7280" text-anchor="middle">8 MB / 16 MB (Код прошивки)</text>


  <!-- ==================== BUS CONNECTIONS & LABELS ==================== -->

  <!-- 1. CPU Cores -> L1 Cache -->
  <path d="M 260 143 L 363 143" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)" fill="none"/>
  <text x="305" y="132" font-size="12" fill="#1a1a1a" text-anchor="middle">Шина CPU</text>

  <!-- 2. Vector Accelerator -> Bus Matrix (Edge AI access) -->
  <path d="M 246 213 L 363 235" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)" fill="none"/>
  <text x="305" y="200" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Векторні дані</text>

  <!-- 3. GDMA -> AHB Matrix (Direct Video Stream) -->
  <path d="M 248 430 L 305 430 L 305 285 L 363 285" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)" fill="none"/>
  <text x="282" y="418" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">DMA-потік</text>

  <!-- 4. L1 Cache -> AHB Matrix -->
  <path d="M 485 192 L 485 212" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)" fill="none"/>

  <!-- 5. AHB Matrix -> Internal SRAM -->
  <path d="M 485 347 L 485 365" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)" fill="none"/>

  <!-- 6. AHB Matrix -> Octal SPI Controller -->
  <path d="M 607 235 L 660 235 L 660 157 L 712 157" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)" fill="none"/>
  <text x="660" y="142" font-size="12" fill="#1a1a1a" text-anchor="middle">Шина MSPI</text>

  <!-- 7. SPI Controller -> Octal SPI Bus -->
  <path d="M 815 192 L 815 212" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)" fill="none"/>

  <!-- 8. Octal SPI Bus -> External PSRAM -->
  <path d="M 815 262 L 815 280" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)" fill="none"/>

</svg>
