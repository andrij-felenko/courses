<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Підкладка полотна -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Оптимізація RAM-футпринту mbedTLS за допомогою розширення MFLN</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Скорочення обсягу буферів прийому й передачі TLS-записів у heap з 34 КБ до 2.5 КБ</text>

  <!-- Панель 1: Стандартна конфігурація (Проблема) -->
  <rect x="30" y="85" width="420" height="375" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Шапка Панелі 1 -->
  <rect x="45" y="100" width="390" height="46" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="240" y="119" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Стандартна конфігурація (без MFLN)</text>
  <text x="240" y="136" font-size="11" fill="#6b7280" text-anchor="middle">Стандартний розмір фрагмента TLS: 16 КБ (16384 B)</text>

  <!-- Буфер прийому Панелі 1 -->
  <rect x="45" y="158" width="390" height="78" rx="4" fill="white" stroke="#c0392b" stroke-width="1.5"/>
  <text x="240" y="177" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Буфер прийому (RX Buffer): ~17 КБ</text>
  <text x="240" y="196" font-size="11" fill="#1a1a1a" text-anchor="middle">16 КБ payload + ~1 КБ overhead (MAC, IV, padding)</text>
  <text x="240" y="215" font-size="11" fill="#6b7280" text-anchor="middle">MBEDTLS_SSL_IN_BUFFER_LEN = 16896 B</text>

  <!-- Буфер передачі Панелі 1 -->
  <rect x="45" y="248" width="390" height="78" rx="4" fill="white" stroke="#c0392b" stroke-width="1.5"/>
  <text x="240" y="267" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Буфер передачі (TX Buffer): ~17 КБ</text>
  <text x="240" y="286" font-size="11" fill="#1a1a1a" text-anchor="middle">16 КБ payload + ~1 КБ overhead (MAC, IV, padding)</text>
  <text x="240" y="305" font-size="11" fill="#6b7280" text-anchor="middle">MBEDTLS_SSL_OUT_BUFFER_LEN = 16896 B</text>

  <!-- Підсумок Панелі 1 -->
  <rect x="45" y="338" width="390" height="106" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="240" y="359" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Загальне використання RAM буферами: ~34 КБ</text>
  <text x="240" y="380" font-size="11" fill="#1a1a1a" text-anchor="middle">Займає &gt;75% вільної купи (heap) ESP8266</text>
  <text x="240" y="400" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Високий ризик помилки OOM (Out of Memory)</text>
  <text x="240" y="420" font-size="11" fill="#6b7280" text-anchor="middle">Нестабільна робота інших системних задач</text>

  <!-- Центральний блок переходу -->
  <rect x="456" y="172" width="48" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="189" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">MFLN</text>
  <text x="480" y="205" font-size="11" fill="#2457d6" text-anchor="middle">RFC 6066</text>

  <line x1="458" y1="230" x2="502" y2="230" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="456" y="248" width="48" height="42" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="480" y="265" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">-92.6%</text>
  <text x="480" y="281" font-size="11" fill="#27ae60" text-anchor="middle">RAM</text>

  <!-- Панель 2: Оптимізована конфігурація з MFLN (Рішення) -->
  <rect x="510" y="85" width="420" height="375" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Шапка Панелі 2 -->
  <rect x="525" y="100" width="390" height="46" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="720" y="119" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Оптимізована конфігурація (MFLN)</text>
  <text x="720" y="136" font-size="11" fill="#6b7280" text-anchor="middle">Узгоджений розмір фрагмента TLS: 512 B (0.5 КБ)</text>

  <!-- Буфер прийому Панелі 2 -->
  <rect x="525" y="158" width="390" height="78" rx="4" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <text x="720" y="177" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Буфер прийому (RX Buffer): ~1.25 КБ</text>
  <text x="720" y="196" font-size="11" fill="#1a1a1a" text-anchor="middle">512 B payload + ~768 B overhead (MAC, IV, padding)</text>
  <text x="720" y="215" font-size="11" fill="#6b7280" text-anchor="middle">MBEDTLS_SSL_IN_BUFFER_LEN = 1280 B</text>

  <!-- Буфер передачі Панелі 2 -->
  <rect x="525" y="248" width="390" height="78" rx="4" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <text x="720" y="267" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Буфер передачі (TX Buffer): ~1.25 КБ</text>
  <text x="720" y="286" font-size="11" fill="#1a1a1a" text-anchor="middle">512 B payload + ~768 B overhead (MAC, IV, padding)</text>
  <text x="720" y="305" font-size="11" fill="#6b7280" text-anchor="middle">MBEDTLS_SSL_OUT_BUFFER_LEN = 1280 B</text>

  <!-- Підсумок Панелі 2 -->
  <rect x="525" y="338" width="390" height="106" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="720" y="359" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Загальне використання RAM буферами: ~2.5 КБ</text>
  <text x="720" y="380" font-size="11" fill="#1a1a1a" text-anchor="middle">Заощадження динамічної пам'яті: ~31.5 КБ (-92.6%)</text>
  <text x="720" y="400" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Гарантований запас RAM для крипто-контекстів</text>
  <text x="720" y="420" font-size="11" fill="#6b7280" text-anchor="middle">Виключення ризику OOM під час рукостискання</text>
</svg>
