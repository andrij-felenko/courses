<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Динаміка живлення та домени енергозбереження ESP32-S3</text>
  <text x="480" y="53" text-anchor="middle" font-size="13" fill="#6b7280">Реакція на Wi-Fi струмові сплески (Brownout Detector) та розмежування доменів CPU і RTC у Deep Sleep</text>

  <!-- ПАНЕЛЬ 1: Wi-Fi Сплески та Brownout Detector (Зліва) -->
  <rect x="30" y="75" width="435" height="465" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="45" y="100" font-size="13" font-weight="bold" fill="#1a1a1a">Падіння напруги при Wi-Fi сплесках та Brownout Detector</text>

  <!-- Область часової діаграми -->
  <rect x="50" y="115" width="395" height="260" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Осі координат -->
  <line x1="85" y1="135" x2="85" y2="345" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="85" y1="345" x2="425" y2="345" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="85" y="128" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b7280">V, I</text>
  <text x="432" y="349" font-size="11" font-weight="bold" fill="#6b7280">t</text>

  <!-- Номінальна напруга 3.3 В -->
  <line x1="85" y1="150" x2="420" y2="150" stroke="#27ae60" stroke-width="1.5"/>
  <text x="95" y="140" font-size="11" font-weight="bold" fill="#27ae60">Номінальна напруга V_DD = 3.3 В</text>

  <!-- Крива напруги з конденсатором (Стабільна) -->
  <path d="M 85,150 L 140,150 C 170,150 200,180 260,150 L 420,150" fill="none" stroke="#27ae60" stroke-width="2"/>
  <text x="200" y="170" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">З фільтром V_DD &gt; 3.0 В (Стабільно)</text>

  <!-- Поріг Brownout Detector (2.8 В) -->
  <line x1="85" y1="220" x2="420" y2="220" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="415" y="205" text-anchor="end" font-size="11" font-weight="bold" fill="#c0392b">Поріг Brownout Detector (2.8 В)</text>

  <!-- Крива струму I_DD (Wi-Fi TX burst) -->
  <path d="M 85,330 L 100,330 L 110,270 L 290,270 L 300,330 L 420,330" fill="none" stroke="#2457d6" stroke-width="2"/>
  <text x="200" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Сплеск Wi-Fi (350 мА)</text>

  <!-- Крива падіння напруги без конденсатора (Аварійна) -->
  <path d="M 85,150 L 120,150 C 150,150 170,305 200,305 C 230,305 250,150 280,150 L 420,150" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="200" y="328" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Скид (Brownout Reset &lt; 2.8 В)</text>

  <!-- Блок проблеми (Без ємності) -->
  <rect x="50" y="390" width="190" height="135" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="145" y="412" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Без належної ємності</text>
  <text x="145" y="432" text-anchor="middle" font-size="11" fill="#1a1a1a">Сплеск струму 350 мА</text>
  <text x="145" y="450" text-anchor="middle" font-size="11" fill="#1a1a1a">Просідання V_DD &lt; 2.8 В</text>
  <text x="145" y="472" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Brownout Reset</text>
  <text x="145" y="492" text-anchor="middle" font-size="11" fill="#6b7280">Перезавантаження MCU</text>

  <!-- Блок розв'язку (З конденсатором) -->
  <rect x="255" y="390" width="190" height="135" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="350" y="412" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">З ємнісним фільтром</text>
  <text x="350" y="432" text-anchor="middle" font-size="11" fill="#1a1a1a">Конденсатор 10–47 мкФ</text>
  <text x="350" y="450" text-anchor="middle" font-size="11" fill="#1a1a1a">Компенсує імпульс струму</text>
  <text x="350" y="472" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">V_DD тримається &gt; 3.0 В</text>
  <text x="350" y="492" text-anchor="middle" font-size="11" fill="#6b7280">Безперервна робота Wi-Fi</text>


  <!-- ПАНЕЛЬ 2: Домени живлення в Deep Sleep (Справа) -->
  <rect x="495" y="75" width="435" height="465" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="510" y="100" font-size="13" font-weight="bold" fill="#1a1a1a">Домени живлення та стан у режимі Deep Sleep</text>

  <!-- Домен 1: Головний CPU Домен (HP Domain - Знеструмлено) -->
  <rect x="515" y="120" width="395" height="175" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="530" y="143" font-size="13" font-weight="bold" fill="#c0392b">Головний домен (CPU HP Domain)</text>
  <rect x="765" y="128" width="130" height="24" rx="4" fill="#c0392b"/>
  <text x="830" y="144" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">ВІДКЛЮЧЕНО (0 В)</text>

  <!-- Підблоки HP Domain -->
  <rect x="530" y="160" width="180" height="60" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="620" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">ЦП Xtensa LX7 (Core 0/1)</text>
  <text x="620" y="200" text-anchor="middle" font-size="11" fill="#6b7280">Основна SRAM (512 КБ) &amp; Кеш</text>

  <rect x="720" y="160" width="175" height="60" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="807" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Радіомодуль &amp; Периферія</text>
  <text x="807" y="200" text-anchor="middle" font-size="11" fill="#6b7280">Wi-Fi, BT, USB, GPIO Matrix</text>

  <text x="712" y="245" text-anchor="middle" font-size="11" font-style="italic" fill="#c0392b">Вміст основної SRAM втрачається; струм = 0 мА</text>
  <text x="712" y="265" text-anchor="middle" font-size="11" fill="#6b7280">Живлення повністю відсікається ключами LDO</text>


  <!-- Домен 2: RTC Домен (LP Domain - Активний) -->
  <rect x="515" y="330" width="395" height="195" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="530" y="353" font-size="13" font-weight="bold" fill="#27ae60">RTC домен живлення (LP Domain)</text>
  <rect x="765" y="338" width="130" height="24" rx="4" fill="#27ae60"/>
  <text x="830" y="354" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">АКТИВНИЙ (3.3 В)</text>

  <!-- Підблоки LP Domain -->
  <rect x="530" y="370" width="180" height="60" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="620" y="390" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">RTC Таймери &amp; Контролер</text>
  <text x="620" y="410" text-anchor="middle" font-size="11" fill="#6b7280">ULP співпроцесор (RISC-V)</text>

  <rect x="720" y="370" width="175" height="60" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="807" y="390" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Пам'ять RTC SRAM</text>
  <text x="807" y="410" text-anchor="middle" font-size="11" fill="#1a1a1a">8 КБ Fast + 8 КБ Slow SRAM</text>

  <text x="712" y="455" text-anchor="middle" font-size="11" font-style="italic" fill="#27ae60">Зберігає дані та змінні в Deep Sleep (струм споживання ~7–8 мкА)</text>
  <text x="712" y="475" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Джерела пробудження: RTC Timer, RTC GPIO, ULP переривання</text>

  <!-- Лінія пробудження від RTC до CPU -->
  <line x1="712" y1="330" x2="712" y2="303" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  <text x="730" y="321" font-size="11" font-weight="bold" fill="#2457d6">Сигнал пробудження (Wakeup Event)</text>
</svg>
