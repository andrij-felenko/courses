<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-up" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="580" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Мікроархітектура двоядерного чипа ESP32-S3</text>
  <text x="480" y="53" text-anchor="middle" font-size="13" fill="#6b7280">Взаємодія ядер Xtensa LX7 (з розширеннями PIE), L1 кешу, шинної матриці, MMU та периферії</text>

  <!-- Загальний контейнер кристала SoC -->
  <rect x="30" y="70" width="900" height="485" rx="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="50" y="95" font-size="14" font-weight="bold" fill="#1a1a1a">Кристал мікроконтролера ESP32-S3 (System-on-Chip)</text>

  <!-- СЕКЦІЯ A: Обчислювальний комплекс (CPU) -->
  <rect x="50" y="115" width="410" height="190" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="65" y="138" font-size="13" font-weight="bold" fill="#2457d6">Обчислювальний комплекс (Dual-Core CPU)</text>

  <!-- Ядро 0 -->
  <rect x="65" y="150" width="180" height="90" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="155" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Ядро 0: Xtensa LX7</text>
  <text x="155" y="188" text-anchor="middle" font-size="12" fill="#6b7280">240 МГц · 32-біт</text>
  <rect x="75" y="200" width="160" height="30" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="155" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Векторне розширення PIE</text>

  <!-- Ядро 1 -->
  <rect x="265" y="150" width="180" height="90" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="355" y="170" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Ядро 1: Xtensa LX7</text>
  <text x="355" y="188" text-anchor="middle" font-size="12" fill="#6b7280">240 МГц · 32-біт</text>
  <rect x="275" y="200" width="160" height="30" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="355" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Векторне розширення PIE</text>

  <!-- Двоканальний L1 кеш -->
  <rect x="65" y="250" width="380" height="40" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="255" y="275" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Двоканальний кеш L1 (Instruction &amp; Data Cache)</text>

  <!-- СЕКЦІЯ B: Підсистема пам'яті та MMU -->
  <rect x="480" y="115" width="430" height="190" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="495" y="138" font-size="13" font-weight="bold" fill="#1a1a1a">Підсистема пам'яті та трансляції адрес</text>

  <!-- Внутрішня пам'ять -->
  <rect x="495" y="150" width="190" height="70" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="590" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Внутрішня пам'ять</text>
  <text x="590" y="193" text-anchor="middle" font-size="12" fill="#6b7280">SRAM (512КБ) + ROM (384КБ)</text>

  <!-- Блок MMU -->
  <rect x="700" y="150" width="195" height="70" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="797" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Блок управління MMU</text>
  <text x="797" y="193" text-anchor="middle" font-size="12" fill="#1a1a1a">Трансляція віртуальних адрес</text>

  <!-- Контролер зовнішньої пам'яті SPI -->
  <rect x="495" y="235" width="400" height="55" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <text x="695" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Контролер зовн. пам'яті (Quad SPI / Octal SPI DDR)</text>
  <text x="695" y="276" text-anchor="middle" font-size="12" fill="#6b7280">Адресація зовнішньої Flash та Octal PSRAM</text>

  <!-- СЕКЦІЯ C: Комутаційна матриця шин (Interconnect) -->
  <rect x="50" y="325" width="860" height="45" rx="6" fill="#2457d6" stroke="#1a1a1a" stroke-width="1"/>
  <text x="480" y="352" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Багатоканальна комутаційна матриця шин (System Bus Matrix / AHB Matrix)</text>

  <!-- СЕКЦІЯ D: Периферійні та системні контролери -->
  <rect x="50" y="390" width="860" height="150" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="65" y="410" font-size="12" font-weight="bold" fill="#1a1a1a">Периферійні та системні контролери</text>

  <!-- Нативний USB -->
  <rect x="65" y="435" width="260" height="95" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="195" y="455" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Нативний USB-контролер</text>
  <text x="195" y="473" text-anchor="middle" font-size="12" fill="#1a1a1a">USB Serial / JTAG Debugger</text>
  <text x="195" y="491" text-anchor="middle" font-size="12" fill="#1a1a1a">Контролер USB OTG (Full-Speed)</text>
  <text x="195" y="509" text-anchor="middle" font-size="11" font-style="italic" fill="#6b7280">Виводи GPIO19 (D-) та GPIO20 (D+)</text>

  <!-- Радіомодуль -->
  <rect x="340" y="435" width="260" height="95" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="470" y="455" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Радіомодуль (Wi-Fi &amp; BT)</text>
  <text x="470" y="473" text-anchor="middle" font-size="12" fill="#1a1a1a">Wi-Fi 802.11 b/g/n (2.4 ГГц)</text>
  <text x="470" y="491" text-anchor="middle" font-size="12" fill="#1a1a1a">Bluetooth 5 (LE) + Mesh</text>
  <text x="470" y="509" text-anchor="middle" font-size="11" fill="#6b7280">Пікові струми до 350 мА</text>

  <!-- GPIO Matrix & System Control -->
  <rect x="615" y="435" width="280" height="95" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="755" y="455" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">GPIO Matrix &amp; System Control</text>
  <text x="755" y="473" text-anchor="middle" font-size="12" fill="#1a1a1a">Матриця GPIO та IO MUX Bypass</text>
  <text x="755" y="491" text-anchor="middle" font-size="11" fill="#1a1a1a">Strapping Pins &amp; Brownout Detector</text>
  <text x="755" y="509" text-anchor="middle" font-size="11" fill="#6b7280">RTC контролер &amp; Deep Sleep</text>

  <!-- Зв'язувальні лінії (Interconnect buses) -->
  <!-- CPU <-> Bus Matrix -->
  <line x1="255" y1="290" x2="255" y2="320" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr-up)"/>

  <!-- Memory Controller <-> Bus Matrix -->
  <line x1="695" y1="290" x2="695" y2="320" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr-up)"/>

  <!-- Bus Matrix <-> Native USB (дропнуто праворуч від заголовка секції на x=310) -->
  <line x1="310" y1="370" x2="310" y2="430" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr-up)"/>

  <!-- Bus Matrix <-> Wireless RF -->
  <line x1="470" y1="370" x2="470" y2="430" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr-up)"/>

  <!-- Bus Matrix <-> GPIO Matrix -->
  <line x1="755" y1="370" x2="755" y2="430" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)" marker-start="url(#arr-up)"/>
</svg>
