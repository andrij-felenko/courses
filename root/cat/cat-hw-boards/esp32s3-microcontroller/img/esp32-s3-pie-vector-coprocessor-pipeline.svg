<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Конвеєр векторного співпроцесора PIE у процесорі ESP32-S3</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Паралельне завантаження EE.VLD.128, 128-бітні SIMD-регістри Q0–Q7 та обробка в блоках MAC</text>

  <!-- Section 1: Memory & Load Unit -->
  <rect x="40" y="85" width="230" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="155" y="112" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Шина пам'яті та Load Unit</text>

  <!-- Memory Block -->
  <rect x="60" y="130" width="190" height="75" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="155" y="155" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Внутрішня SRAM / PSRAM</text>
  <text x="155" y="177" font-size="12" fill="#6b7280" text-anchor="middle">128-бітна вибірка даних</text>

  <!-- Arrow Memory -> Load Unit -->
  <line x1="155" y1="205" x2="155" y2="233" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Load Unit EE.VLD.128 -->
  <rect x="60" y="235" width="190" height="90" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="155" y="260" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Інструкція EE.VLD.128</text>
  <text x="155" y="282" font-size="12" fill="#1a1a1a" text-anchor="middle">128-бітне векторне зчитання</text>
  <text x="155" y="302" font-size="12" fill="#6b7280" text-anchor="middle">За 1 такт завантажує 16 байт</text>

  <!-- Arrow Load Unit -> Vector Format -->
  <line x1="155" y1="325" x2="155" y2="348" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Vector Format Sub-block -->
  <rect x="60" y="350" width="190" height="115" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="155" y="370" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Формат 128-бітного вектора</text>
  
  <rect x="68" y="385" width="40" height="28" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="3"/>
  <text x="88" y="403" font-size="11" fill="#1a1a1a" text-anchor="middle">E0</text>
  
  <rect x="112" y="385" width="40" height="28" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="3"/>
  <text x="132" y="403" font-size="11" fill="#1a1a1a" text-anchor="middle">E1</text>
  
  <rect x="156" y="385" width="40" height="28" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="3"/>
  <text x="176" y="403" font-size="11" fill="#1a1a1a" text-anchor="middle">E2</text>
  
  <rect x="200" y="385" width="40" height="28" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="3"/>
  <text x="220" y="403" font-size="11" fill="#1a1a1a" text-anchor="middle">E3</text>
  
  <text x="155" y="435" font-size="12" fill="#6b7280" text-anchor="middle">4×32-біт / 8×16-біт / 16×8-біт</text>

  <!-- Arrow Section 1 -> Section 2 -->
  <line x1="250" y1="280" x2="303" y2="280" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="276" y="270" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">128 біт</text>

  <!-- Section 2: SIMD Register File -->
  <rect x="310" y="85" width="310" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="465" y="112" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Регістровий файл SIMD (8 × 128 біт)</text>

  <!-- Q0 Register -->
  <rect x="330" y="130" width="270" height="34" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="345" y="152" font-size="12" font-weight="bold" fill="#2457d6">Q0</text>
  <rect x="375" y="136" width="50" height="22" fill="#eaf0fd" stroke="#2457d6" rx="2"/>
  <text x="400" y="151" font-size="11" fill="#1a1a1a" text-anchor="middle">lane 0</text>
  <rect x="430" y="136" width="50" height="22" fill="#eaf0fd" stroke="#2457d6" rx="2"/>
  <text x="455" y="151" font-size="11" fill="#1a1a1a" text-anchor="middle">lane 1</text>
  <rect x="485" y="136" width="50" height="22" fill="#eaf0fd" stroke="#2457d6" rx="2"/>
  <text x="510" y="151" font-size="11" fill="#1a1a1a" text-anchor="middle">lane 2</text>
  <rect x="540" y="136" width="50" height="22" fill="#eaf0fd" stroke="#2457d6" rx="2"/>
  <text x="565" y="151" font-size="11" fill="#1a1a1a" text-anchor="middle">lane 3</text>

  <!-- Q1 Register -->
  <rect x="330" y="172" width="270" height="34" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="345" y="194" font-size="12" font-weight="bold" fill="#1a1a1a">Q1</text>
  <rect x="375" y="178" width="50" height="22" fill="#f4f6f8" stroke="#d0d7de" rx="2"/>
  <text x="400" y="193" font-size="11" fill="#6b7280" text-anchor="middle">elem 0</text>
  <rect x="430" y="178" width="50" height="22" fill="#f4f6f8" stroke="#d0d7de" rx="2"/>
  <text x="455" y="193" font-size="11" fill="#6b7280" text-anchor="middle">elem 1</text>
  <rect x="485" y="178" width="50" height="22" fill="#f4f6f8" stroke="#d0d7de" rx="2"/>
  <text x="510" y="193" font-size="11" fill="#6b7280" text-anchor="middle">elem 2</text>
  <rect x="540" y="178" width="50" height="22" fill="#f4f6f8" stroke="#d0d7de" rx="2"/>
  <text x="565" y="193" font-size="11" fill="#6b7280" text-anchor="middle">elem 3</text>

  <!-- Q2 Register -->
  <rect x="330" y="214" width="270" height="34" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="345" y="236" font-size="12" font-weight="bold" fill="#1a1a1a">Q2</text>
  <rect x="375" y="220" width="215" height="22" fill="#f4f6f8" stroke="#d0d7de" rx="2"/>
  <text x="482" y="235" font-size="11" fill="#6b7280" text-anchor="middle">128-бітний вектор операндів</text>

  <!-- Q3 Register -->
  <rect x="330" y="256" width="270" height="34" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="345" y="278" font-size="12" font-weight="bold" fill="#2457d6">Q3</text>
  <rect x="375" y="262" width="215" height="22" fill="#eaf0fd" stroke="#2457d6" rx="2"/>
  <text x="482" y="277" font-size="11" fill="#2457d6" text-anchor="middle">128-бітний вектор коефіцієнтів</text>

  <!-- Q4-Q6 Ellipsis Row -->
  <rect x="330" y="298" width="270" height="28" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-dasharray="3,3"/>
  <text x="465" y="316" font-size="12" fill="#6b7280" text-anchor="middle">• • •  Регістри Q4, Q5, Q6  • • •</text>

  <!-- Q7 Register -->
  <rect x="330" y="334" width="270" height="34" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="345" y="356" font-size="12" font-weight="bold" fill="#1a1a1a">Q7</text>
  <rect x="375" y="340" width="215" height="22" fill="#f4f6f8" stroke="#d0d7de" rx="2"/>
  <text x="482" y="355" font-size="11" fill="#6b7280" text-anchor="middle">128-бітний вектор результату</text>

  <!-- Accumulators ACC0-ACC3 -->
  <rect x="330" y="380" width="270" height="85" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="465" y="400" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Акумулятори ACC0 – ACC3</text>
  <text x="465" y="422" font-size="12" fill="#1a1a1a" text-anchor="middle">4 × 40-бітні регістри підвищеної точності</text>
  <text x="465" y="442" font-size="12" fill="#6b7280" text-anchor="middle">Збереження результатів підсумовування MAC</text>

  <!-- Arrows Section 2 -> Section 3 -->
  <line x1="600" y1="160" x2="653" y2="160" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="600" y1="235" x2="653" y2="235" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="600" y1="310" x2="653" y2="310" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="627" y="148" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Q0, Q3</text>

  <!-- Section 3: Parallel MAC / ALU Units -->
  <rect x="660" y="85" width="260" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="790" y="112" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Паралельні блоки MAC / ALU</text>

  <!-- MAC Unit 0 -->
  <rect x="680" y="130" width="220" height="62" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="790" y="152" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Векторний MAC 0 / ALU 0</text>
  <text x="790" y="174" font-size="12" fill="#1a1a1a" text-anchor="middle">Множення та додавання (INT8/16)</text>

  <!-- MAC Unit 1 -->
  <rect x="680" y="205" width="220" height="62" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="790" y="227" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Векторний MAC 1 / ALU 1</text>
  <text x="790" y="249" font-size="12" fill="#1a1a1a" text-anchor="middle">Паралельна 16/32-бітна обробка</text>

  <!-- MAC Unit 2, 3 -->
  <rect x="680" y="280" width="220" height="62" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="790" y="302" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Векторний MAC 2, 3 / ALU</text>
  <text x="790" y="324" font-size="12" fill="#1a1a1a" text-anchor="middle">Обчислення згортки та матриць</text>

  <!-- Arrow MAC -> Saturation WB -->
  <line x1="790" y1="342" x2="790" y2="357" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Saturation & Writeback Block -->
  <rect x="680" y="360" width="220" height="105" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="790" y="382" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Насичення та запис результату</text>
  <text x="790" y="404" font-size="12" fill="#1a1a1a" text-anchor="middle">Нормалізація та округлення</text>
  <text x="790" y="424" font-size="12" fill="#6b7280" text-anchor="middle">Запис у Q0–Q7 або ACC0–ACC3</text>

  <!-- Feedback Line WB -> Accumulators/Registers -->
  <path d="M 680,422 L 608,422" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>
  <text x="644" y="414" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Запис</text>

  <!-- Footer note -->
  <text x="480" y="502" font-size="12" fill="#6b7280" text-anchor="middle">Апаратне розширення Xtensa LX7 PIE забезпечує прискорення обчислень згорткових шарів та FFT до 4–8 разів</text>
</svg>
