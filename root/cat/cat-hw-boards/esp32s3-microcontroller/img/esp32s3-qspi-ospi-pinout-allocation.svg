<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Розподіл виводів шини пам'яті ESP32-S3: Quad SPI проти Octal SPI</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Перехід на 8-бітну шину Octal SPI вилучає виводи GPIO33–GPIO37 з загального користування</text>

  <!-- Left Container: Quad SPI -->
  <rect x="40" y="72" width="425" height="388" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  
  <!-- Left Panel Header Badge -->
  <rect x="55" y="86" width="395" height="32" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="252" y="107" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Режим Quad SPI (4-бітне стикування)</text>

  <!-- Left Desc Box -->
  <rect x="55" y="126" width="395" height="40" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="252" y="142" text-anchor="middle" font-size="12" fill="#1a1a1a">Використовується 6 ліній SPI для Flash / PSRAM</text>
  <text x="252" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Виводи GPIO33–GPIO37 повністю вільні</text>

  <!-- Left QSPI Bus Box -->
  <rect x="55" y="174" width="395" height="124" rx="4" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="65" y="182" width="375" height="22" rx="3" fill="#eaf0fd"/>
  <text x="75" y="197" font-size="12" font-weight="bold" fill="#2457d6">Шина пам'яті Quad SPI (Зайнято 6 виводів)</text>
  <text x="75" y="220" font-size="12" fill="#1a1a1a">SPICLK (GPIO30) · SPICS0 (GPIO29) · D0 (GPIO28)</text>
  <text x="75" y="242" font-size="12" fill="#1a1a1a">D1 / SPIQ (GPIO31) · D2 / WP (GPIO32) · D3 / HD (GPIO27)</text>
  <text x="75" y="274" font-size="12" fill="#6b7280">Ширина шини: 4 біти даних на кожен такт</text>

  <!-- Left Free GPIO Box -->
  <rect x="55" y="306" width="395" height="142" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="65" y="314" width="375" height="22" rx="3" fill="#27ae60"/>
  <text x="75" y="329" font-size="12" font-weight="bold" fill="white">Доступні для периферії користувача (GPIO)</text>
  <text x="75" y="354" font-size="12" fill="#1a1a1a">GPIO33 — ВІЛЬНИЙ (ADC / Touch / General IO)</text>
  <text x="75" y="376" font-size="12" fill="#1a1a1a">GPIO34 — ВІЛЬНИЙ · GPIO35 — ВІЛЬНИЙ</text>
  <text x="75" y="398" font-size="12" fill="#1a1a1a">GPIO36 — ВІЛЬНИЙ · GPIO37 — ВІЛЬНИЙ</text>
  <text x="75" y="424" font-size="12" font-weight="bold" fill="#27ae60">Статус: Доступні на розпіновці плати</text>

  <!-- Right Container: Octal SPI -->
  <rect x="495" y="72" width="425" height="388" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>

  <!-- Right Panel Header Badge -->
  <rect x="510" y="86" width="395" height="32" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="707" y="107" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">Режим Octal SPI (8-бітне стикування)</text>

  <!-- Right Desc Box -->
  <rect x="510" y="126" width="395" height="40" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="707" y="142" text-anchor="middle" font-size="12" fill="#1a1a1a">Використовується 11 ліній SPI для OPI Flash / PSRAM</text>
  <text x="707" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Виводи GPIO33–GPIO37 вилучено з периферії</text>

  <!-- Right QSPI Bus Box -->
  <rect x="510" y="174" width="395" height="124" rx="4" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="520" y="182" width="375" height="22" rx="3" fill="#eaf0fd"/>
  <text x="530" y="197" font-size="12" font-weight="bold" fill="#2457d6">Базова частина шини Octal SPI (6 виводів)</text>
  <text x="530" y="220" font-size="12" fill="#1a1a1a">SPICLK (GPIO30) · SPICS0 (GPIO29) · D0 (GPIO28)</text>
  <text x="530" y="242" font-size="12" fill="#1a1a1a">D1 / SPIQ (GPIO31) · D2 / WP (GPIO32) · D3 / HD (GPIO27)</text>
  <text x="530" y="274" font-size="12" fill="#6b7280">Передача молодших 4 біт даних та тактування</text>

  <!-- Right Blocked GPIO Box -->
  <rect x="510" y="306" width="395" height="142" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="520" y="314" width="375" height="22" rx="3" fill="#c0392b"/>
  <text x="530" y="329" font-size="12" font-weight="bold" fill="white">ЗАБЛОКОВАНО: Використовується Octal SPI</text>
  <text x="530" y="354" font-size="12" fill="#1a1a1a">GPIO33 (SPI_D4) · GPIO34 (SPI_D5) — ШИНА</text>
  <text x="530" y="376" font-size="12" fill="#1a1a1a">GPIO35 (SPI_D6) · GPIO36 (SPI_D7) — ШИНА</text>
  <text x="530" y="398" font-size="12" fill="#1a1a1a">GPIO37 (SPI_DQS) — СТРОБ ДАНИХ (DQS)</text>
  <text x="530" y="424" font-size="12" font-weight="bold" fill="#c0392b">Статус: НЕ МОЖНА використовувати в схемі</text>

  <!-- Bottom Note Bar -->
  <rect x="40" y="472" width="880" height="24" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="480" y="488" text-anchor="middle" font-size="12" fill="#6b7280">У модулях ESP32-S3 з Octal PSRAM/Flash виводи GPIO33–GPIO37 розведені всередині модуля</text>
</svg>
