<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>

  <!-- Title & Subtitle -->
  <text x="480" y="35" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Двобуферний конвеєр захоплення DVP та TinyML-інференсу в ESP32-S3</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Безблокувальне захоплення кадрів через DMA в PSRAM з паралельною обробкою прискорювачем PIE</text>

  <!-- Panel 1: DVP Camera Hardware (Left Column) -->
  <rect x="30" y="90" width="200" height="430" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="130" y="118" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Камера DVP (OV2640)</text>

  <rect x="45" y="140" width="170" height="160" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="130" y="165" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Сигнали шини DVP</text>
  <text x="55" y="190" font-size="12" fill="#1a1a1a">Y2..Y9 (8-бітний потік)</text>
  <text x="55" y="214" font-size="12" fill="#2457d6">PCLK (Тактування пікселів)</text>
  <text x="55" y="238" font-size="12" fill="#1a1a1a">VSYNC (Строб кадру)</text>
  <text x="55" y="262" font-size="12" fill="#1a1a1a">HREF (Строб рядка)</text>
  <text x="55" y="286" font-size="12" fill="#6b7280">XCLK (Вхідний 20 МГц)</text>

  <rect x="45" y="320" width="170" height="180" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="130" y="345" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Драйвер камери</text>
  <text x="55" y="370" font-size="12" fill="#1a1a1a">esp_camera driver</text>
  <text x="55" y="394" font-size="12" fill="#1a1a1a">Автобаланс білого та AEC</text>
  <text x="55" y="418" font-size="12" fill="#2457d6">Формат: RGB565 / JPEG</text>
  <text x="55" y="442" font-size="12" fill="#27ae60">Роздільність: 320x240 (QVGA)</text>
  <text x="55" y="466" font-size="12" fill="#6b7280">Пряма вибірка без CPU</text>

  <!-- Panel 2: ESP32-S3 DMA Controller & SRAM Descriptors (Middle-Left Column) -->
  <rect x="250" y="90" width="220" height="430" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="8"/>
  <text x="360" y="118" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">DMA Контролер (SRAM)</text>

  <rect x="265" y="140" width="190" height="160" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="360" y="165" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Дескриптори DMA (SRAM)</text>
  <text x="275" y="190" font-size="12" fill="#1a1a1a">32-бітне вирівнювання</text>
  <text x="275" y="214" font-size="12" fill="#2457d6">Кільцевий список розряду</text>
  <text x="275" y="238" font-size="12" fill="#27ae60">Пряма передача по PCLK</text>
  <text x="275" y="262" font-size="12" fill="#6b7280">Без участі процесора CPU</text>

  <rect x="265" y="320" width="190" height="180" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="360" y="345" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Керування конвеєром</text>
  <text x="275" y="370" font-size="12" fill="#1a1a1a">Сигнали переривання ISR</text>
  <text x="275" y="394" font-size="12" fill="#27ae60">xQueueSendFromISR()</text>
  <text x="275" y="418" font-size="12" fill="#1a1a1a">Захист від переповнення</text>
  <text x="275" y="442" font-size="12" fill="#6b7280">Синхронізація Ping-Pong</text>

  <!-- Panel 3: External Octal PSRAM Double Buffer (Middle-Right Column) -->
  <rect x="490" y="90" width="220" height="430" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="8"/>
  <text x="600" y="118" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Подвійний буфер PSRAM</text>

  <rect x="505" y="140" width="190" height="160" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="600" y="165" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Буфер FB0 (1.8V OPI)</text>
  <text x="515" y="190" font-size="12" fill="#2457d6">Стан: Запис DMA (Захоплення)</text>
  <text x="515" y="214" font-size="12" fill="#1a1a1a">Розмір: 153.6 кБ (RGB565)</text>
  <text x="515" y="238" font-size="12" fill="#27ae60">Пряма адресативність 120 МГц</text>
  <text x="515" y="262" font-size="12" fill="#6b7280">heap_caps_malloc(SPIRAM)</text>

  <rect x="505" y="320" width="190" height="180" fill="#ffffff" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="600" y="345" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Буфер FB1 (1.8V OPI)</text>
  <text x="515" y="370" font-size="12" fill="#27ae60">Стан: Читання TinyML (Інференс)</text>
  <text x="515" y="394" font-size="12" fill="#1a1a1a">Вхідні дані нейромережі</text>
  <text x="515" y="418" font-size="12" fill="#2457d6">Паралельний доступ без затримок</text>
  <text x="515" y="442" font-size="12" fill="#6b7280">Обробка ядрами Xtensa LX7</text>

  <!-- Panel 4: TinyML & PIE Acceleration Engine (Right Column) -->
  <rect x="730" y="90" width="200" height="430" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="8"/>
  <text x="830" y="118" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">TinyML &amp; PIE Engine</text>

  <rect x="745" y="140" width="170" height="180" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="830" y="165" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Прискорювач PIE (SIMD)</text>
  <text x="755" y="190" font-size="12" fill="#1a1a1a">128-бітний векторний блок</text>
  <text x="755" y="214" font-size="12" fill="#27ae60">16× INT8 MAC за 1 такт</text>
  <text x="755" y="238" font-size="12" fill="#2457d6">Ядро ESP-NN згортки</text>
  <text x="755" y="262" font-size="12" fill="#1a1a1a">Квантовані ваги INT8</text>
  <text x="755" y="286" font-size="12" fill="#6b7280">Розпізнавання облич</text>

  <rect x="745" y="340" width="170" height="160" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="830" y="365" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Результати обробки</text>
  <text x="755" y="390" font-size="12" fill="#1a1a1a">Координати Bounding Box</text>
  <text x="755" y="414" font-size="12" fill="#27ae60">Частота: 30+ FPS</text>
  <text x="755" y="438" font-size="12" fill="#1a1a1a">Без втрати відеокадрів</text>

  <!-- Connecting Inter-module Pipeline Arrows -->
  <!-- DVP Camera -> SRAM DMA Descriptors -->
  <line x1="215" y1="220" x2="265" y2="220" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- SRAM DMA Descriptors -> PSRAM FB0 -->
  <line x1="455" y1="220" x2="505" y2="220" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- PSRAM FB1 -> TinyML PIE Engine -->
  <path d="M 695 410 L 715 410 L 715 220 L 745 220" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
</svg>
