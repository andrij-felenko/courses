<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Xtensa LX6 (скалярне) vs Xtensa LX7 PIE (128-бітне SIMD)</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">Векторні інструкції PIE обробляють 16x8-біт або 4x32-біт даних за 1 такт замість послідовних циклів</text>

  <!-- Left Panel: Xtensa LX6 (Problem / Red) -->
  <rect x="35" y="85" width="425" height="355" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="247.5" y="112" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">Xtensa LX6 (ESP32) — Скалярна архітектура</text>
  <text x="247.5" y="130" font-size="12" fill="#6b7280" text-anchor="middle">Послідовна обробка елементів (4 такти на 4x32-біт)</text>

  <!-- Left Box 1: Registers -->
  <rect x="55" y="148" width="385" height="78" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="70" y="168" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">Скалярні регістри AR (32 біти)</text>

  <rect x="70" y="180" width="80" height="34" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="110" y="202" font-size="12" fill="#c0392b" text-anchor="middle">a[0] (32b)</text>

  <rect x="160" y="180" width="80" height="34" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="200" y="202" font-size="12" fill="#c0392b" text-anchor="middle">a[1] (32b)</text>

  <rect x="250" y="180" width="80" height="34" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="290" y="202" font-size="12" fill="#c0392b" text-anchor="middle">a[2] (32b)</text>

  <rect x="340" y="180" width="80" height="34" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="380" y="202" font-size="12" fill="#c0392b" text-anchor="middle">a[3] (32b)</text>

  <!-- Left Arrow 1 -->
  <line x1="247.5" y1="226" x2="247.5" y2="254" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="260" y="244" font-size="12" fill="#c0392b" text-anchor="start">4 послідовні інструкції</text>

  <!-- Left Box 2: Scalar ALU -->
  <rect x="105" y="258" width="285" height="58" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="247.5" y="282" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">32-бітна Скалярна АЛУ (ALU)</text>
  <text x="247.5" y="302" font-size="12" fill="#6b7280" text-anchor="middle">1 операція за такт</text>

  <!-- Left Arrow 2 -->
  <line x1="247.5" y1="316" x2="247.5" y2="338" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Left Box 3: Result -->
  <rect x="55" y="342" width="385" height="42" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="247.5" y="368" font-size="12" fill="#1a1a1a" text-anchor="middle">Результат: a[0]+b[0], a[1]+b[1], ... (4 такти)</text>

  <!-- Left Callout -->
  <rect x="55" y="394" width="385" height="32" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="247.5" y="415" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Низька швидкість у матричних обчисленнях ШІ</text>

  <!-- Right Panel: Xtensa LX7 PIE (Solution / Green) -->
  <rect x="500" y="85" width="425" height="355" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="712.5" y="112" font-size="15" font-weight="bold" fill="#27ae60" text-anchor="middle">Xtensa LX7 (ESP32-S3) — Векторне розширення PIE</text>
  <text x="712.5" y="130" font-size="12" fill="#6b7280" text-anchor="middle">Паралельна SIMD-обробка (1 такт на 128-біт вектор)</text>

  <!-- Right Box 1: Vector Registers -->
  <rect x="520" y="148" width="385" height="78" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="535" y="168" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">128-бітні векторні регістри Q0..Q7 (PIE)</text>

  <rect x="535" y="180" width="80" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="575" y="202" font-size="12" fill="#27ae60" text-anchor="middle">v[0] (32b)</text>

  <rect x="625" y="180" width="80" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="665" y="202" font-size="12" fill="#27ae60" text-anchor="middle">v[1] (32b)</text>

  <rect x="715" y="180" width="80" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="755" y="202" font-size="12" fill="#27ae60" text-anchor="middle">v[2] (32b)</text>

  <rect x="805" y="180" width="80" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="845" y="202" font-size="12" fill="#27ae60" text-anchor="middle">v[3] (32b)</text>

  <!-- Right Parallel Arrows -->
  <line x1="575" y1="226" x2="575" y2="254" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="665" y1="226" x2="665" y2="254" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="755" y1="226" x2="755" y2="254" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="845" y1="226" x2="845" y2="254" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Right Box 2: SIMD ALU -->
  <rect x="520" y="258" width="385" height="58" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="712.5" y="282" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">128-бітна Векторна SIMD-АЛУ (PIE Unit)</text>
  <text x="712.5" y="302" font-size="12" fill="#6b7280" text-anchor="middle">4x32-біт або 16x8-біт операцій за 1 такт</text>

  <!-- Right Arrow 2 -->
  <line x1="712.5" y1="316" x2="712.5" y2="338" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Right Box 3: Vector Result -->
  <rect x="520" y="342" width="385" height="42" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="712.5" y="368" font-size="12" fill="#1a1a1a" text-anchor="middle">Результат: [v0+w0, v1+w1, v2+w2, v3+w3] (1 такт)</text>

  <!-- Right Callout -->
  <rect x="520" y="394" width="385" height="32" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712.5" y="415" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Прискорення ШІ-обчислень (ESP-NN) у 4–8 разів</text>
</svg>
