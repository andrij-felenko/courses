<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Топологія пам'яті, MMU та системних шин ESP32-S3</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Трансляція віртуальних адрес, ієрархія кешу L1 та підключення внутрішньої SRAM й зовнішньої Flash/PSRAM</text>

  <!-- Layer 1: CPU Cores -->
  <rect x="35" y="85" width="890" height="80" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="102" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Процесорні ядра Xtensa LX7 (Dual-Core 240 МГц)</text>

  <rect x="70" y="112" width="380" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="260" y="138" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">PRO CPU (Core 0) + PIE SIMD Vector Ext.</text>

  <rect x="510" y="112" width="380" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="700" y="138" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">APP CPU (Core 1) + PIE SIMD Vector Ext.</text>

  <!-- Vertical Bus Lines 1 -> 2 -->
  <line x1="260" y1="154" x2="260" y2="190" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="245" y="177" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="end">I-Bus / D-Bus</text>

  <line x1="700" y1="154" x2="700" y2="190" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="715" y="177" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="start">I-Bus / D-Bus</text>

  <!-- Layer 2: L1 Cache & MMU -->
  <rect x="35" y="190" width="890" height="95" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="210" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Блок кешування та трансляції адрес (L1 Cache &amp; MMU)</text>

  <rect x="70" y="220" width="380" height="55" rx="4" fill="white" stroke="#2457d6" stroke-width="1"/>
  <text x="260" y="242" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Двоканальний кеш L1 (32 / 64 КБ)</text>
  <text x="260" y="260" font-size="11" fill="#6b7280" text-anchor="middle">I-Cache + D-Cache (SRAM 0 allocation)</text>

  <rect x="510" y="220" width="380" height="55" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="700" y="242" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Апаратний MMU (Memory Management Unit)</text>
  <text x="700" y="260" font-size="11" fill="#1a1a1a" text-anchor="middle">Віртуальна трансляція сторінок по 64 КБ</text>

  <!-- Vertical Bus Lines 2 -> 3 -->
  <line x1="260" y1="275" x2="260" y2="320" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="245" y="303" font-size="11" fill="#6b7280" text-anchor="end">Внутрішні шини</text>

  <line x1="700" y1="275" x2="700" y2="320" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="715" y="303" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="start">Шина MSPI (Cache/MMU)</text>

  <!-- Layer 3 Left: Internal Memory -->
  <rect x="35" y="320" width="435" height="100" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="252" y="338" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Внутрішня пам'ять SoC (512 КБ SRAM + ROM)</text>

  <rect x="50" y="348" width="190" height="60" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="145" y="372" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">SRAM 0 / 1 / 2</text>
  <text x="145" y="390" font-size="11" fill="#6b7280" text-anchor="middle">512 КБ IRAM / DRAM</text>

  <rect x="260" y="348" width="190" height="60" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="355" y="372" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Internal ROM &amp; RTC</text>
  <text x="355" y="390" font-size="11" fill="#6b7280" text-anchor="middle">384 КБ ROM + RTC SRAM</text>

  <!-- Layer 3 Right: External Memory -->
  <rect x="490" y="320" width="435" height="100" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="707" y="338" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Зовнішній інтерфейс пам'яті (MSPI / OPI)</text>

  <rect x="505" y="348" width="190" height="60" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="600" y="372" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Octal / Quad PSRAM</text>
  <text x="600" y="390" font-size="11" fill="#6b7280" text-anchor="middle">до 32 МБ (OPI 8-bit DDR)</text>

  <rect x="715" y="348" width="190" height="60" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="810" y="372" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">External NOR Flash</text>
  <text x="810" y="390" font-size="11" fill="#6b7280" text-anchor="middle">до 16 МБ (Quad / Octal)</text>

  <!-- Bottom Summary Panel -->
  <rect x="35" y="435" width="890" height="60" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="457" font-size="12" font-weight="bold" fill="#2457d6">Ключова особливість трансляції пам'яті:</text>
  <text x="50" y="477" font-size="11" fill="#1a1a1a">MMU прозоро мапує зовнішню Octal PSRAM та Flash у віртуальний адресний простір CPU через кеш L1, забезпечуючи високу швидкість для Edge AI.</text>
</svg>
