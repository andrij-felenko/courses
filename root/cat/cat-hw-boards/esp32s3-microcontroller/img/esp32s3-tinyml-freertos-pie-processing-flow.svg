<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>

  <!-- Title & Subtitle -->
  <text x="480" y="35" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма асинхронного конвеєра TinyML на двох ядрах ESP32-S3</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Паралельна робота DVP DMA захоплення та векторизованого інференсу ESP-NN (PIE) без блокування ядер</text>

  <!-- Top Panel: Dual Core & PIE Execution Tracks -->
  <rect x="30" y="90" width="900" height="250" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="480" y="115" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Паралельне виконання задач у часі (Core 0 vs Core 1 + PIE)</text>

  <!-- Dotted Time Grid Lines -->
  <line x1="250" y1="130" x2="250" y2="315" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="380" y1="130" x2="380" y2="315" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="510" y1="130" x2="510" y2="315" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="640" y1="130" x2="640" y2="315" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="770" y1="130" x2="770" y2="315" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Time Axis Line -->
  <line x1="220" y1="315" x2="880" y2="315" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <text x="895" y="319" font-size="12" font-weight="bold" fill="#1a1a1a">Час (t)</text>

  <!-- Track 1: DVP Camera DMA -->
  <text x="40" y="157" font-size="12" font-weight="bold" fill="#2457d6">DVP Camera DMA</text>

  <rect x="250" y="140" width="130" height="25" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="315" y="157" font-size="12" fill="#2457d6" text-anchor="middle">Захоплення Кадру 0</text>

  <rect x="380" y="140" width="130" height="25" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="445" y="157" font-size="12" fill="#27ae60" text-anchor="middle">Захоплення Кадру 1</text>

  <rect x="510" y="140" width="130" height="25" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="575" y="157" font-size="12" fill="#2457d6" text-anchor="middle">Захоплення Кадру 2</text>

  <rect x="640" y="140" width="130" height="25" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="705" y="157" font-size="12" fill="#27ae60" text-anchor="middle">Захоплення Кадру 3</text>

  <!-- Track 2: Core 0 (PRO_CPU Task Dispatch) -->
  <text x="40" y="202" font-size="12" font-weight="bold" fill="#1a1a1a">Core 0 (PRO_CPU)</text>

  <rect x="250" y="185" width="130" height="25" fill="#ffffff" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="315" y="202" font-size="12" fill="#1a1a1a" text-anchor="middle">Обробка Кадру 0</text>

  <rect x="380" y="185" width="130" height="25" fill="#ffffff" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="445" y="202" font-size="12" fill="#1a1a1a" text-anchor="middle">Обробка Кадру 1</text>

  <rect x="510" y="185" width="130" height="25" fill="#ffffff" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="575" y="202" font-size="12" fill="#1a1a1a" text-anchor="middle">Обробка Кадру 2</text>

  <rect x="640" y="185" width="130" height="25" fill="#ffffff" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="705" y="202" font-size="12" fill="#1a1a1a" text-anchor="middle">Обробка Кадру 3</text>

  <!-- Track 3: Core 1 + PIE Accelerator (APP_CPU SIMD) -->
  <text x="40" y="247" font-size="12" font-weight="bold" fill="#27ae60">Core 1 + PIE (APP)</text>

  <text x="315" y="247" font-size="12" fill="#6b7280" text-anchor="middle">Очікування черги...</text>

  <rect x="380" y="230" width="130" height="25" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="445" y="247" font-size="12" fill="#2457d6" text-anchor="middle">ESP-NN Інференс K0</text>

  <rect x="510" y="230" width="130" height="25" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="575" y="247" font-size="12" fill="#27ae60" text-anchor="middle">ESP-NN Інференс K1</text>

  <rect x="640" y="230" width="130" height="25" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="705" y="247" font-size="12" fill="#2457d6" text-anchor="middle">ESP-NN Інференс K2</text>

  <!-- Track 4: FreeRTOS Synchronization Sync Markers -->
  <text x="40" y="287" font-size="12" font-weight="bold" fill="#1a1a1a">FreeRTOS Queue</text>
  <text x="380" y="287" font-size="12" fill="#2457d6" text-anchor="middle">↑ QueueSend(FB0)</text>
  <text x="510" y="287" font-size="12" fill="#27ae60" text-anchor="middle">↑ QueueSend(FB1)</text>
  <text x="640" y="287" font-size="12" fill="#2457d6" text-anchor="middle">↑ QueueSend(FB0)</text>

  <!-- Bottom Section: Architectural Mechanism Cards (3 Columns) -->

  <!-- Card 1: Core 0 PRO_CPU -->
  <rect x="30" y="360" width="280" height="160" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="8"/>
  <text x="170" y="385" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">PRO_CPU (Ядро 0)</text>
  <text x="45" y="410" font-size="12" fill="#1a1a1a">• Драйвер DVP камери (esp_camera)</text>
  <text x="45" y="434" font-size="12" fill="#1a1a1a">• Обробка ISR переривань VSYNC</text>
  <text x="45" y="458" font-size="12" fill="#2457d6">• Робота з DMA дескрипторами SRAM</text>
  <text x="45" y="482" font-size="12" fill="#6b7280">• Нормалізація та вирівнювання RGB</text>

  <!-- Card 2: FreeRTOS Inter-core Sync -->
  <rect x="340" y="360" width="280" height="160" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="8"/>
  <text x="480" y="385" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">FreeRTOS Асинхронність</text>
  <text x="355" y="410" font-size="12" fill="#1a1a1a">• Передача вказівників буферів PSRAM</text>
  <text x="355" y="434" font-size="12" fill="#27ae60">• xQueueSend() без копіювання даних</text>
  <text x="355" y="458" font-size="12" fill="#1a1a1a">• Запобігання Watchdog Timeout</text>
  <text x="355" y="482" font-size="12" fill="#6b7280">• Стабільний FPS без висікання кадрів</text>

  <!-- Card 3: Core 1 APP_CPU + PIE -->
  <rect x="650" y="360" width="280" height="160" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="8"/>
  <text x="790" y="385" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">APP_CPU + PIE (Ядро 1)</text>
  <text x="665" y="410" font-size="12" fill="#1a1a1a">• Згортки ESP-NN (128-бітний SIMD)</text>
  <text x="665" y="434" font-size="12" fill="#27ae60">• 16× INT8 MAC за 1 такт процесора</text>
  <text x="665" y="458" font-size="12" fill="#2457d6">• Двоканальний L1 кеш контролера</text>
  <text x="665" y="482" font-size="12" fill="#6b7280">• Результат: Bounding Box Person Detect</text>
</svg>
