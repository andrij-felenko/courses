<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Арбітраж системної матриці шин та прямого доступу DMA в ESP32-S3</text>
  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Паралельна обробка DVP-кадрів і виведення на дисплей із запобіганням конфліктам у DRAM</text>

  <!-- Panel 1: Peripherals (Left) -->
  <rect x="25" y="75" width="210" height="420" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="130" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Периферія вводу-виводу</text>

  <!-- Camera Block -->
  <rect x="40" y="120" width="180" height="160" rx="6" ry="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="130" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Камера DVP</text>
  <text x="130" y="165" text-anchor="middle" font-size="11" fill="#1a1a1a">• Лінії D0–D7 (8 біт)</text>
  <text x="130" y="185" text-anchor="middle" font-size="11" fill="#1a1a1a">• Тактування PCLK</text>
  <text x="130" y="205" text-anchor="middle" font-size="11" fill="#1a1a1a">• Кадрова VSYNC / HREF</text>
  <rect x="50" y="225" width="160" height="40" rx="4" ry="4" fill="#ffffff" stroke="#2457d6"/>
  <text x="130" y="249" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Вхідний відеопотік</text>

  <!-- Display Block -->
  <rect x="40" y="305" width="180" height="175" rx="6" ry="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="130" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Панель дисплея</text>
  <text x="130" y="350" text-anchor="middle" font-size="11" fill="#1a1a1a">• Інтерфейс RGB / 8080</text>
  <text x="130" y="370" text-anchor="middle" font-size="11" fill="#1a1a1a">• Тактова частота PCLK</text>
  <text x="130" y="390" text-anchor="middle" font-size="11" fill="#1a1a1a">• Безнеперервний рефреш</text>
  <rect x="50" y="415" width="160" height="50" rx="4" ry="4" fill="#ffffff" stroke="#27ae60"/>
  <text x="130" y="436" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Вихідне зображення</text>
  <text x="130" y="454" text-anchor="middle" font-size="11" fill="#6b7280">Без мерехтіння</text>

  <!-- Panel 2: Bus Matrix & GDMA Controller (Center) -->
  <rect x="255" y="75" width="420" height="420" rx="8" ry="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="2"/>
  <text x="465" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Системна матриця шин та GDMA ESP32-S3</text>

  <!-- GDMA Rx Channel (DVP) -->
  <rect x="270" y="120" width="185" height="160" rx="6" ry="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="362" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">GDMA Канал Rx (DVP)</text>
  <rect x="280" y="155" width="165" height="50" rx="4" ry="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="362" y="175" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Кільцеві дескриптори Rx</text>
  <text x="362" y="193" text-anchor="middle" font-size="11" fill="#6b7280">Связний список (Linked List)</text>
  <text x="362" y="225" text-anchor="middle" font-size="11" fill="#1a1a1a">• FIFO-буфер прийому</text>
  <text x="362" y="245" text-anchor="middle" font-size="11" fill="#1a1a1a">• Прямий запис у RAM</text>

  <!-- GDMA Tx Channel (LCD) -->
  <rect x="270" y="305" width="185" height="175" rx="6" ry="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="362" y="327" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">GDMA Канал Tx (LCD)</text>
  <rect x="280" y="340" width="165" height="50" rx="4" ry="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="362" y="360" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Кільцеві дескриптори Tx</text>
  <text x="362" y="378" text-anchor="middle" font-size="11" fill="#6b7280">Автоінкремент адреси</text>
  <text x="362" y="410" text-anchor="middle" font-size="11" fill="#1a1a1a">• FIFO-буфер видачі</text>
  <text x="362" y="430" text-anchor="middle" font-size="11" fill="#1a1a1a">• Зчитування кадрів</text>

  <!-- Bus Arbiter Box -->
  <rect x="475" y="120" width="185" height="360" rx="6" ry="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="567" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Арбітр шини DRAM</text>
  <text x="567" y="165" text-anchor="middle" font-size="11" fill="#6b7280">Bus Matrix Arbiter</text>

  <rect x="488" y="185" width="159" height="70" rx="4" ry="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="567" y="208" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Арбітраж квантів</text>
  <text x="567" y="226" text-anchor="middle" font-size="11" fill="#1a1a1a">Розподіл шинного часу</text>
  <text x="567" y="244" text-anchor="middle" font-size="11" fill="#6b7280">між Rx, Tx та CPU</text>

  <rect x="488" y="270" width="159" height="70" rx="4" ry="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="567" y="293" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Запобігання конфліктам</text>
  <text x="567" y="311" text-anchor="middle" font-size="11" fill="#1a1a1a">Розділені шинні канали</text>
  <text x="567" y="329" text-anchor="middle" font-size="11" fill="#6b7280">SRAM банок (Banked)</text>

  <rect x="488" y="355" width="159" height="110" rx="4" ry="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="567" y="378" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Пріоритети шини:</text>
  <text x="567" y="400" text-anchor="middle" font-size="11" fill="#2457d6">1. DVP Rx DMA (High)</text>
  <text x="567" y="420" text-anchor="middle" font-size="11" fill="#27ae60">2. LCD Tx DMA (High)</text>
  <text x="567" y="440" text-anchor="middle" font-size="11" fill="#6b7280">3. CPU Core (Normal)</text>

  <!-- Panel 3: Memory Subsystem (Right) -->
  <rect x="695" y="75" width="240" height="420" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="815" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Підсистема пам'яті</text>

  <!-- Internal SRAM -->
  <rect x="710" y="120" width="210" height="170" rx="6" ry="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="815" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Внутрішня DRAM (512 КБ)</text>
  <rect x="720" y="155" width="190" height="55" rx="4" ry="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="815" y="177" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Ping-Pong Буфери</text>
  <text x="815" y="195" text-anchor="middle" font-size="11" fill="#6b7280">Буфер А / Буфер Б (DMA)</text>
  <text x="815" y="230" text-anchor="middle" font-size="11" fill="#1a1a1a">• Дескриптори черги DMA</text>
  <text x="815" y="250" text-anchor="middle" font-size="11" fill="#1a1a1a">• Висока швидкість SRAM</text>
  <text x="815" y="270" text-anchor="middle" font-size="11" fill="#27ae60">• Нуль затримок шини</text>

  <!-- External PSRAM -->
  <rect x="710" y="305" width="210" height="175" rx="6" ry="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="815" y="327" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Зовнішня Octal PSRAM</text>
  <rect x="720" y="340" width="190" height="55" rx="4" ry="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="815" y="362" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Кадровий буфер (FB)</text>
  <text x="815" y="380" text-anchor="middle" font-size="11" fill="#6b7280">Зберігання повних кадрів</text>
  <text x="815" y="415" text-anchor="middle" font-size="11" fill="#1a1a1a">• Шина Octal SPI (80 МГц)</text>
  <text x="815" y="435" text-anchor="middle" font-size="11" fill="#1a1a1a">• Режим DDR + DQS</text>
  <text x="815" y="455" text-anchor="middle" font-size="11" fill="#6b7280">• Пропускна здатність 80 МБ/с</text>

  <!-- Connectors / Arrows -->
  <!-- DVP -> GDMA Rx -->
  <path d="M 220 200 L 270 200" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <!-- GDMA Rx -> Bus Arbiter -->
  <path d="M 455 200 L 475 200" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Bus Arbiter -> SRAM -->
  <path d="M 660 200 L 710 200" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- GDMA Tx -> Bus Arbiter -->
  <path d="M 455 390 L 475 390" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Bus Arbiter -> PSRAM -->
  <path d="M 660 390 L 710 390" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- GDMA Tx -> Display -->
  <path d="M 270 390 L 220 390" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

</svg>
