<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Відображення віртуальних адрес MMU та L1-кешування PSRAM</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Шлях транзакції зчитування через L1 Cache та 8-бітну шину Octal SPI DDR у чипі ESP32-S3</text>

  <!-- Main Container 1: Xtensa LX7 CPU Core -->
  <rect x="40" y="90" width="160" height="380" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="120" y="118" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Ядро Xtensa LX7</text>

  <rect x="52" y="135" width="136" height="70" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="120" y="153" font-size="12" fill="#6b7280" text-anchor="middle">Адресний простір:</text>
  <text x="120" y="172" font-size="12" fill="#1a1a1a" text-anchor="middle">0x3C000000 -</text>
  <text x="120" y="190" font-size="12" fill="#1a1a1a" text-anchor="middle">0x3DFFFFFF</text>

  <rect x="52" y="220" width="136" height="60" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="120" y="242" font-size="12" fill="#6b7280" text-anchor="middle">Запит зчитування:</text>
  <text x="120" y="263" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">vaddr_read()</text>

  <rect x="52" y="315" width="136" height="85" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="120" y="338" font-size="12" fill="#1a1a1a" text-anchor="middle">Конвеєр Xtensa:</text>
  <text x="120" y="360" font-size="12" fill="#1a1a1a" text-anchor="middle">Очікування даних</text>
  <text x="120" y="382" font-size="12" fill="#6b7280" text-anchor="middle">(Stall при Miss)</text>

  <!-- Connection: Core to MMU Panel -->
  <line x1="200" y1="250" x2="230" y2="250" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Main Container 2: MMU & L1 Cache Panel -->
  <rect x="230" y="90" width="400" height="380" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="430" y="118" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Блок MMU та 2-канальний L1 Cache (32 КБ)</text>

  <!-- Sub-box: MMU Page Table -->
  <rect x="250" y="135" width="360" height="80" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="430" y="157" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Таблиця сторінок MMU (64 КБ)</text>
  <text x="430" y="179" font-size="12" fill="#1a1a1a" text-anchor="middle">Віртуальна адреса ↦ Фізична адреса</text>
  <text x="430" y="199" font-size="12" fill="#2457d6" text-anchor="middle">Затримка трансляції: 4 такти ядра</text>

  <!-- Line MMU to Cache lookup -->
  <line x1="430" y1="215" x2="430" y2="230" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Sub-box: L1 Cache Lookup -->
  <rect x="250" y="230" width="360" height="225" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="430" y="252" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Перевірка наявності даних у L1 Cache</text>

  <!-- Path A: Hit Box -->
  <rect x="265" y="270" width="155" height="170" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="342" y="295" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">L1 Cache HIT</text>
  <text x="342" y="325" font-size="12" fill="#1a1a1a" text-anchor="middle">Влучання в кеш</text>
  <text x="342" y="350" font-size="12" fill="#1a1a1a" text-anchor="middle">Рядок є в L1</text>
  <text x="342" y="385" font-size="12" fill="#1a1a1a" text-anchor="middle">Затримка:</text>
  <text x="342" y="410" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">1 такт ядра</text>

  <!-- Path B: Miss Box -->
  <rect x="435" y="270" width="160" height="170" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="515" y="295" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">L1 Cache MISS</text>
  <text x="515" y="325" font-size="12" fill="#c0392b" text-anchor="middle">1. Write-Back 'брудного'</text>
  <text x="515" y="350" font-size="12" fill="#1a1a1a" text-anchor="middle">2. Запит рядка (32 B)</text>
  <text x="515" y="375" font-size="12" fill="#1a1a1a" text-anchor="middle">3. Арбітраж AXI шини</text>
  <text x="515" y="410" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">100–300 тактів</text>

  <!-- Connection: Miss to Octal SPI -->
  <line x1="595" y1="355" x2="660" y2="355" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Connection: Hit back to Core -->
  <path d="M 342,440 L 342,460 L 120,460 L 120,400" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>

  <!-- Main Container 3: Octal SPI & PSRAM Subsystem -->
  <rect x="660" y="90" width="260" height="380" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="790" y="118" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Шина Octal SPI та PSRAM</text>

  <!-- Sub-box: Octal SPI Controller -->
  <rect x="680" y="135" width="220" height="120" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="790" y="158" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Контролер Octal SPI</text>
  <text x="790" y="182" font-size="12" fill="#1a1a1a" text-anchor="middle">8-бітна шина даних</text>
  <text x="790" y="205" font-size="12" fill="#1a1a1a" text-anchor="middle">Режим DDR (80 МГц)</text>
  <text x="790" y="228" font-size="12" fill="#6b7280" text-anchor="middle">2 слова за 1 такт шини</text>

  <!-- Connection: Controller to PSRAM Chip -->
  <line x1="790" y1="255" x2="790" y2="275" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Sub-box: Physical External PSRAM -->
  <rect x="680" y="275" width="220" height="180" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="790" y="298" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Зовнішня PSRAM (2–16 МБ)</text>
  <text x="790" y="325" font-size="12" fill="#1a1a1a" text-anchor="middle">Вибірка блоку 32 байти</text>
  <text x="790" y="350" font-size="12" fill="#1a1a1a" text-anchor="middle">Затримка команди/адреси</text>
  <text x="790" y="375" font-size="12" fill="#6b7280" text-anchor="middle">Такти очікування (Dummy)</text>
  <text x="790" y="400" font-size="12" fill="#2457d6" text-anchor="middle">Передача даних (Fill Line)</text>
  <text x="790" y="425" font-size="12" fill="#6b7280" text-anchor="middle">Регенерація комірок DRAM</text>

  <!-- Legend Section at Bottom -->
  <rect x="60" y="500" width="20" height="20" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="90" y="515" font-size="12" fill="#1a1a1a">L1 Cache Hit: доступ 1 такт</text>

  <rect x="310" y="500" width="20" height="20" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="340" y="515" font-size="12" fill="#1a1a1a">L1 Cache Miss: затримка 100–300 тактів</text>

  <rect x="630" y="500" width="20" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="660" y="515" font-size="12" fill="#1a1a1a">Octal SPI DDR: 8-бітна вибірка</text>
</svg>
