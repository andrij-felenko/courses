<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схемотехніка Strapping Pins та домену живлення VDD_SPI</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Фіксація засувки стартових рівнів при скиданні t_latch, підтяжка резисторів та вибір напруги 1.8 В / 3.3 В</text>

  <!-- Left Main Panel: Strapping Pins -->
  <rect x="30" y="75" width="430" height="440" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="45" y="98" font-size="14" font-weight="bold" fill="#1a1a1a">Конфігураційні виводи Strapping Pins</text>

  <!-- Subpanel A: Timing Latch Window -->
  <rect x="50" y="115" width="390" height="150" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="65" y="136" font-size="13" font-weight="bold" fill="#2457d6">Часове вікно засувки t_latch при скиданні</text>

  <text x="65" y="165" font-size="12" fill="#1a1a1a">CHIP_PU</text>
  <path d="M 125,165 L 180,165 L 195,150 L 420,150" fill="none" stroke="#2457d6" stroke-width="2"/>

  <rect x="195" y="145" width="90" height="60" fill="#eaf0fd" stroke="#2457d6" stroke-dasharray="3 3"/>
  <text x="240" y="172" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вікно t_latch</text>
  <text x="240" y="190" font-size="12" fill="#6b7280" text-anchor="middle">~1.0 мс</text>

  <rect x="300" y="145" width="125" height="60" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="362" y="168" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Засувка eFuse</text>
  <text x="362" y="188" font-size="12" fill="#1a1a1a" text-anchor="middle">Фіксація режимів</text>

  <rect x="65" y="215" width="360" height="40" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="75" y="232" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">GPIO0:</tspan> 1=SPI Boot, 0=Download | <tspan font-weight="bold">GPIO45:</tspan> 0=3.3V, 1=1.8V</text>
  <text x="75" y="248" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">GPIO46:</tspan> 0=ROM Log увімкнено, 1=ROM Log вимкнено</text>

  <!-- Subpanel B: Pull-up & Protection -->
  <rect x="50" y="280" width="390" height="220" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="65" y="301" font-size="13" font-weight="bold" fill="#1a1a1a">Схема підтяжки та захисту від зворотного струму</text>

  <line x1="120" y1="320" x2="200" y2="320" stroke="#2457d6" stroke-width="2"/>
  <text x="160" y="315" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">VDD33 (3.3 В)</text>

  <line x1="160" y1="320" x2="160" y2="335" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="145" y="335" width="30" height="45" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="190" y="360" font-size="12" fill="#1a1a1a">R_pull = 10 кОм</text>
  <line x1="160" y1="380" x2="160" y2="400" stroke="#1a1a1a" stroke-width="1.5"/>

  <circle cx="160" cy="400" r="4" fill="#2457d6"/>
  <text x="175" y="404" font-size="12" font-weight="bold" fill="#2457d6">Вузол Strapping Pin</text>

  <line x1="160" y1="400" x2="160" y2="420" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="135" y="420" width="50" height="30" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="160" y="439" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">D_prot</text>
  <line x1="160" y1="450" x2="160" y2="465" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="130" y1="465" x2="190" y2="465" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="200" y="440" font-size="12" fill="#27ae60">Захист від зворотного струму</text>

  <text x="65" y="488" font-size="12" fill="#6b7280">Захищає вхід від витоку з периферії під час фіксації</text>

  <!-- Right Main Panel: VDD_SPI Power Domain -->
  <rect x="480" y="75" width="450" height="440" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="495" y="98" font-size="14" font-weight="bold" fill="#1a1a1a">Домен живлення VDD_SPI та регулятор LDO</text>

  <!-- Subpanel A: Internal LDO & Switching -->
  <rect x="500" y="115" width="410" height="175" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="515" y="136" font-size="13" font-weight="bold" fill="#2457d6">Внутрішній перемикальний LDO-регулятор VDD_SPI</text>

  <rect x="515" y="150" width="115" height="50" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="572" y="172" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">VDD33_MAIN</text>
  <text x="572" y="190" font-size="12" fill="#1a1a1a" text-anchor="middle">Вхід 3.3 В</text>

  <line x1="630" y1="175" x2="665" y2="175" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="670" y="150" width="125" height="75" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="732" y="172" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Внутрішній LDO</text>
  <text x="732" y="192" font-size="12" fill="#27ae60" text-anchor="middle">1.8 В або 3.3 В</text>
  <text x="732" y="212" font-size="12" fill="#6b7280" text-anchor="middle">Керування eFuse</text>

  <line x1="795" y1="187" x2="830" y2="187" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <rect x="835" y="160" width="65" height="55" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="867" y="182" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">VDD_SPI</text>
  <text x="867" y="202" font-size="12" fill="#1a1a1a" text-anchor="middle">Вихід</text>

  <rect x="515" y="235" width="380" height="42" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="525" y="252" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">Режим 3.3 В:</tspan> Стандартна Quad SPI Flash &amp; Quad PSRAM</text>
  <text x="525" y="268" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">Режим 1.8 В:</tspan> Octal SPI PSRAM (120 МГц DDR)</text>

  <!-- Subpanel B: Load & Warning Circuit -->
  <rect x="500" y="300" width="410" height="200" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="515" y="321" font-size="13" font-weight="bold" fill="#1a1a1a">Зовнішнє навантаження Flash / PSRAM та захист</text>

  <rect x="515" y="335" width="180" height="65" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="605" y="357" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мікросхеми Flash &amp; PSRAM</text>
  <text x="605" y="377" font-size="12" fill="#6b7280" text-anchor="middle">Шини Quad SPI / Octal SPI</text>

  <rect x="715" y="335" width="180" height="65" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="805" y="357" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Блокувальні конденсатори</text>
  <text x="805" y="377" font-size="12" fill="#6b7280" text-anchor="middle">C1 = 100 нФ, C2 = 1.0 мкФ</text>

  <rect x="515" y="412" width="380" height="75" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="525" y="432" font-size="12" font-weight="bold" fill="#c0392b">Застереження схемотехніки VDD_SPI:</text>
  <text x="525" y="450" font-size="12" fill="#1a1a1a">Не подавайте зовнішнє живлення 3.3 В на вивід VDD_SPI,</text>
  <text x="525" y="468" font-size="12" fill="#1a1a1a">якщо внутрішній LDO налаштовано на 1.8 В (конфлікт LDO).</text>

</svg>
