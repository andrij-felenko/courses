<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue-start" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green-start" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Топологія шини Octal SPI та з'єднання з PSRAM у ESP32-S3</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Синхронізація 8-бітного обміну даних через строб DQS та компенсацію затримок контуром DLL</text>

  <!-- Left Main Container: ESP32-S3 SoC -->
  <rect x="30" y="80" width="380" height="390" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="45" y="104" font-size="14" font-weight="bold" fill="#1a1a1a">ESP32-S3 (Внутрішній домен SoC)</text>

  <!-- Sub-block 1: Xtensa LX7 Cores -->
  <rect x="50" y="120" width="165" height="70" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2" rx="5"/>
  <text x="132" y="140" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Xtensa LX7 Cores</text>
  <text x="132" y="156" font-size="12" fill="#1a1a1a" text-anchor="middle">(CPU0 &amp; CPU1)</text>
  <text x="132" y="172" font-size="12" fill="#6b7280" text-anchor="middle">Внутрішня шина AXI</text>

  <!-- Sub-block 2: MMU & Cache -->
  <rect x="230" y="120" width="165" height="70" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2" rx="5"/>
  <text x="312" y="140" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">MMU &amp; Cache</text>
  <text x="312" y="156" font-size="12" fill="#1a1a1a" text-anchor="middle">(ICache &amp; DCache)</text>
  <text x="312" y="172" font-size="12" fill="#6b7280" text-anchor="middle">Мапування пам'яті</text>

  <!-- Internal Arrow CPU -> MMU -->
  <path d="M215,155 L230,155" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-gray)"/>

  <!-- Sub-block 3: Octal SPI Master Controller -->
  <rect x="50" y="205" width="345" height="155" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="65" y="225" font-size="13" font-weight="bold" fill="#2457d6">Octal SPI Master Controller (SPI0/SPI1)</text>

  <!-- Internal Arrow MMU -> Octal SPI Controller -->
  <path d="M312,190 L312,205" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- Sub-block 3a: DLL Auto-Tuning -->
  <rect x="65" y="235" width="155" height="110" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2" rx="4"/>
  <text x="142" y="253" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">DLL (Delay-Locked)</text>
  <text x="142" y="270" font-size="12" fill="#1a1a1a" text-anchor="middle">Автоналаштування фази</text>
  <text x="142" y="287" font-size="12" fill="#6b7280" text-anchor="middle">Компенсація T_co</text>
  <text x="142" y="304" font-size="12" fill="#6b7280" text-anchor="middle">для частот 120 МГц</text>

  <!-- Sub-block 3b: DQS Sampler -->
  <rect x="235" y="235" width="145" height="110" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2" rx="4"/>
  <text x="307" y="253" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">DQS Strobe Sampler</text>
  <text x="307" y="270" font-size="12" fill="#1a1a1a" text-anchor="middle">Стробування входів</text>
  <text x="307" y="287" font-size="12" fill="#6b7280" text-anchor="middle">Захоплення по DQS</text>
  <text x="307" y="304" font-size="12" fill="#6b7280" text-anchor="middle">Центрування фронтів</text>

  <!-- Internal Connection DLL -> DQS Sampler -->
  <path d="M220,290 L235,290" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Sub-block 4: GPIO Matrix / IO Pads -->
  <rect x="50" y="375" width="345" height="80" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2" rx="5"/>
  <text x="65" y="395" font-size="12" font-weight="bold" fill="#1a1a1a">Захищені виводи Octal SPI (GPIO33 - GPIO37)</text>
  <text x="65" y="413" font-size="12" fill="#6b7280">Апаратні буфери IO, підтяжки та матриця виводів</text>
  <text x="65" y="433" font-size="12" font-weight="bold" fill="#2457d6">Сигнали: DQ[0:7], SPI_CLK, CE#, DQS</text>

  <!-- Internal Arrow Controller -> GPIO Pads -->
  <path d="M222,360 L222,375" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- Center Channel: Bus Signals Interconnect -->
  <!-- Signal 1: DQ[0:7] Data Bus -->
  <path d="M415,155 L585,155" stroke="#2457d6" stroke-width="3" marker-start="url(#arr-blue-start)" marker-end="url(#arr-blue)"/>
  <text x="500" y="145" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">DQ[0:7] (8-біт дані)</text>

  <!-- Signal 2: SPI_CLK -->
  <path d="M415,245 L585,245" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>
  <text x="500" y="235" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">SPI_CLK (Такти 120 МГц)</text>

  <!-- Signal 3: CE# -->
  <path d="M415,325 L585,325" stroke="#6b7280" stroke-width="2" marker-end="url(#arr-gray)"/>
  <text x="500" y="315" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">CE# (Вибір чипа)</text>

  <!-- Signal 4: DQS Strobe -->
  <path d="M585,405 L415,405" stroke="#27ae60" stroke-width="2.5" marker-start="url(#arr-green-start)" marker-end="url(#arr-green)"/>
  <text x="500" y="395" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">DQS (Строб читання PSRAM)</text>

  <!-- Right Main Container: External Octal PSRAM -->
  <rect x="590" y="80" width="340" height="390" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="605" y="104" font-size="14" font-weight="bold" fill="#1a1a1a">Зовнішня PSRAM (Octal SPI RAM)</text>

  <!-- PSRAM Sub-block 1: OPI Interface Engine -->
  <rect x="605" y="120" width="310" height="70" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2" rx="5"/>
  <text x="760" y="140" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Octal SPI Interface Engine</text>
  <text x="760" y="160" font-size="12" fill="#1a1a1a" text-anchor="middle">Декодер команд, адреси та даних OPI</text>

  <!-- PSRAM Sub-block 2: DQS Strobe Generator -->
  <rect x="605" y="205" width="310" height="110" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2" rx="5"/>
  <text x="760" y="225" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Генератор стробу DQS</text>
  <text x="760" y="245" font-size="12" fill="#1a1a1a" text-anchor="middle">Формування DQS при зчитуванні даних</text>
  <text x="760" y="265" font-size="12" fill="#6b7280" text-anchor="middle">Синхронізація фронтів DQS із даними DQ[7:0]</text>
  <text x="760" y="285" font-size="12" fill="#6b7280" text-anchor="middle">Точна передача на частоті 120 МГц</text>

  <!-- Internal Arrow OPI Engine -> DQS Generator -->
  <path d="M760,190 L760,205" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- PSRAM Sub-block 3: Memory Array & Self-Refresh -->
  <rect x="605" y="330" width="310" height="125" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2" rx="5"/>
  <text x="760" y="350" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Матриця пам'яті PSRAM (8 МБ / 16 МБ)</text>
  <text x="760" y="370" font-size="12" fill="#1a1a1a" text-anchor="middle">Комірки DRAM з внутрішньою саморегенерацією</text>
  <text x="760" y="390" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Пропускна здатність до 240 МБ/с (DDR)</text>
  <text x="760" y="410" font-size="12" fill="#6b7280" text-anchor="middle">Внутрішній таймер регенерації заряду</text>

  <!-- Internal Arrow DQS Generator -> Memory Array -->
  <path d="M760,315 L760,330" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arr-green)"/>

  <!-- Legend / Summary Panel at Bottom -->
  <rect x="30" y="485" width="900" height="60" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2" rx="6"/>
  <text x="45" y="508" font-size="12" fill="#1a1a1a">• 8-бітна шина DQ[0:7] у режимі Octal SPI подвоює швидкість порівняно з Quad SPI, досягаючи пропускної здатності до 240 МБ/с.</text>
  <text x="45" y="530" font-size="12" fill="#1a1a1a">• Диференційний строб DQS подається разом із даними від PSRAM, а контур DLL в ESP32-S3 компенсаторно коригує фазовий зсув.</text>
</svg>
