<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="500" fill="#ffffff"/>

  <!-- Main Title and Subtitle -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Структурна схема відеотракту LCD_CAM та контролера GDMA</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Автономне захоплення відеокадрів у подвійний буфер PSRAM без навантаження ЦПУ</text>

  <!-- Block 1: Camera Module (DVP Interface) -->
  <rect x="40" y="80" width="180" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="130" y="103" font-size="14" font-weight="bold" fill="#334155" text-anchor="middle">Модуль камери (DVP)</text>

  <!-- Camera Sub-box 1: Data Lines -->
  <rect x="50" y="125" width="160" height="70" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="130" y="152" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Шина даних D[0:7]</text>
  <text x="130" y="174" font-size="12" fill="#64748b" text-anchor="middle">Паралельний 8-біт вихід</text>

  <!-- Camera Sub-box 2: Sync Lines -->
  <rect x="50" y="210" width="160" height="85" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="130" y="235" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Сигнали синхронізації</text>
  <text x="130" y="258" font-size="12" fill="#64748b" text-anchor="middle">PCLK (Тактування)</text>
  <text x="130" y="278" font-size="12" fill="#64748b" text-anchor="middle">VSYNC / HREF (Синхро)</text>

  <!-- Camera Sub-box 3: Frame Formats -->
  <rect x="50" y="310" width="160" height="145" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="130" y="338" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Режими кадру</text>
  <text x="130" y="365" font-size="12" fill="#64748b" text-anchor="middle">VGA (640×480)</text>
  <text x="130" y="390" font-size="12" fill="#64748b" text-anchor="middle">QVGA (320×240)</text>
  <text x="130" y="415" font-size="12" fill="#64748b" text-anchor="middle">RGB565 / YUV422</text>

  <!-- Block 2: LCD_CAM Peripheral Unit -->
  <rect x="260" y="80" width="210" height="395" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="365" y="103" font-size="14" font-weight="bold" fill="#1e40af" text-anchor="middle">Модуль LCD_CAM</text>

  <rect x="275" y="125" width="180" height="100" rx="6" fill="#ffffff" stroke="#2457d6"/>
  <text x="365" y="150" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Вхідна RX FIFO камери</text>
  <text x="365" y="173" font-size="12" fill="#2563eb" text-anchor="middle">Буферизація пікселів</text>
  <text x="365" y="196" font-size="12" fill="#64748b" text-anchor="middle">Апаратний розбір кадру</text>

  <rect x="275" y="240" width="180" height="100" rx="6" fill="#ffffff" stroke="#2457d6"/>
  <text x="365" y="265" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Декодер синхросигналів</text>
  <text x="365" y="288" font-size="12" fill="#2563eb" text-anchor="middle">Фіксація VSYNC / HREF</text>
  <text x="365" y="311" font-size="12" fill="#64748b" text-anchor="middle">Фільтрація завад PCLK</text>

  <rect x="275" y="355" width="180" height="100" rx="6" fill="#ffffff" stroke="#2457d6"/>
  <text x="365" y="380" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Формувач транзакцій</text>
  <text x="365" y="403" font-size="12" fill="#2563eb" text-anchor="middle">Узгодження розрядності</text>
  <text x="365" y="426" font-size="12" fill="#64748b" text-anchor="middle">Запит до каналу GDMA</text>

  <!-- Block 3: GDMA Controller -->
  <rect x="490" y="80" width="210" height="395" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="595" y="103" font-size="14" font-weight="bold" fill="#1e40af" text-anchor="middle">Контролер GDMA</text>

  <rect x="505" y="125" width="180" height="95" rx="6" fill="#ffffff" stroke="#2457d6"/>
  <text x="595" y="150" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Канал прийому (GDMA RX)</text>
  <text x="595" y="173" font-size="12" fill="#2563eb" text-anchor="middle">Пряме підкачування байтів</text>
  <text x="595" y="196" font-size="12" fill="#64748b" text-anchor="middle">Автоматичний адресант</text>

  <rect x="505" y="235" width="180" height="120" rx="6" fill="#ffffff" stroke="#2457d6"/>
  <text x="595" y="258" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Дескриптори Ping-Pong</text>
  <text x="595" y="283" font-size="12" fill="#1d4ed8" text-anchor="middle">Дескриптор 0 -> Буфер A</text>
  <text x="595" y="306" font-size="12" fill="#1d4ed8" text-anchor="middle">Дескриптор 1 -> Буфер B</text>
  <text x="595" y="331" font-size="11" fill="#64748b" text-anchor="middle">Автоперемикач на EOF</text>

  <rect x="505" y="370" width="180" height="85" rx="6" fill="#ffffff" stroke="#2457d6"/>
  <text x="595" y="395" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">Канал передачі (GDMA TX)</text>
  <text x="595" y="420" font-size="12" fill="#64748b" text-anchor="middle">Виведення на дисплей / LCD</text>

  <!-- Block 4: PSRAM Memory Double Buffers -->
  <rect x="730" y="80" width="190" height="395" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="825" y="103" font-size="14" font-weight="bold" fill="#14532d" text-anchor="middle">Зовнішня PSRAM</text>

  <rect x="745" y="130" width="160" height="150" rx="6" fill="#ffffff" stroke="#27ae60"/>
  <text x="825" y="158" font-size="13" font-weight="bold" fill="#15803d" text-anchor="middle">Кадровий буфер A</text>
  <text x="825" y="185" font-size="12" fill="#27ae60" text-anchor="middle">Запис поточного кадру</text>
  <text x="825" y="210" font-size="12" fill="#64748b" text-anchor="middle">(Заповнення GDMA)</text>
  <rect x="760" y="235" width="130" height="28" rx="4" fill="#e9f7ef"/>
  <text x="825" y="254" font-size="11" font-weight="bold" fill="#15803d" text-anchor="middle">Статус: ЗАПИСУЄТЬСЯ</text>

  <rect x="745" y="295" width="160" height="160" rx="6" fill="#ffffff" stroke="#27ae60"/>
  <text x="825" y="323" font-size="13" font-weight="bold" fill="#15803d" text-anchor="middle">Кадровий буфер B</text>
  <text x="825" y="350" font-size="12" fill="#27ae60" text-anchor="middle">Обробка / Рендеринг</text>
  <text x="825" y="375" font-size="12" fill="#64748b" text-anchor="middle">(Готовий кадр)</text>
  <rect x="760" y="400" width="130" height="28" rx="4" fill="#e9f7ef"/>
  <text x="825" y="419" font-size="11" font-weight="bold" fill="#15803d" text-anchor="middle">Статус: ОБРОБЛЯЄТЬСЯ</text>

  <!-- Flow Arrows -->
  <!-- Camera D[0:7] -> LCD_CAM RX FIFO -->
  <path d="M 210 160 L 275 160" stroke="#475569" stroke-width="2" marker-end="url(#arr-dark)"/>

  <!-- Camera Sync -> LCD_CAM Sync -->
  <path d="M 210 252 L 275 252" stroke="#475569" stroke-width="2" marker-end="url(#arr-dark)"/>

  <!-- LCD_CAM -> GDMA RX -->
  <path d="M 455 172 L 505 172" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- GDMA RX -> PSRAM Buffer A -->
  <path d="M 685 172 C 715 172 715 205 745 205" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- GDMA RX -> PSRAM Buffer B (Switching) -->
  <path d="M 685 190 C 710 190 710 375 745 375" stroke="#27ae60" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr-green)"/>
</svg>
