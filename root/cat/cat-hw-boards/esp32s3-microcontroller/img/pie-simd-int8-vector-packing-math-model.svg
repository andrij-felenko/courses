<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>

  <!-- Title & Subtitle -->
  <text x="480" y="35" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Математична модель 128-бітного SIMD-прискорення PIE в ESP32-S3</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Паралельне виконання 16 операцій INT8 MAC за один процесорний такт замість 16 скалярних тактів</text>

  <!-- Panel 1: 128-bit Vector Register Packing & Parallel MAC (Top Area) -->
  <rect x="30" y="90" width="900" height="250" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="8"/>
  <text x="480" y="115" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Векторний режим PIE (128-бітний SIMD, 16× INT8 MAC за 1 такт)</text>

  <!-- Vector Register A (Q0, 128-bit) -->
  <text x="50" y="138" font-size="12" font-weight="bold" fill="#2457d6">Векторний регістр A (Q0, 128 біт): 16 елементів INT8</text>
  <rect x="50" y="145" width="860" height="35" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>

  <!-- Cell dividers for Reg A -->
  <line x1="103.75" y1="145" x2="103.75" y2="180" stroke="#2457d6" stroke-width="1"/>
  <line x1="157.50" y1="145" x2="157.50" y2="180" stroke="#2457d6" stroke-width="1"/>
  <line x1="211.25" y1="145" x2="211.25" y2="180" stroke="#2457d6" stroke-width="1"/>
  <line x1="265.00" y1="145" x2="265.00" y2="180" stroke="#2457d6" stroke-width="1"/>
  <line x1="318.75" y1="145" x2="318.75" y2="180" stroke="#2457d6" stroke-width="1"/>
  <line x1="372.50" y1="145" x2="372.50" y2="180" stroke="#2457d6" stroke-width="1"/>
  <line x1="426.25" y1="145" x2="426.25" y2="180" stroke="#2457d6" stroke-width="1"/>
  <line x1="480.00" y1="145" x2="480.00" y2="180" stroke="#2457d6" stroke-width="1"/>
  <line x1="533.75" y1="145" x2="533.75" y2="180" stroke="#2457d6" stroke-width="1"/>
  <line x1="587.50" y1="145" x2="587.50" y2="180" stroke="#2457d6" stroke-width="1"/>
  <line x1="641.25" y1="145" x2="641.25" y2="180" stroke="#2457d6" stroke-width="1"/>
  <line x1="695.00" y1="145" x2="695.00" y2="180" stroke="#2457d6" stroke-width="1"/>
  <line x1="748.75" y1="145" x2="748.75" y2="180" stroke="#2457d6" stroke-width="1"/>
  <line x1="802.50" y1="145" x2="802.50" y2="180" stroke="#2457d6" stroke-width="1"/>
  <line x1="856.25" y1="145" x2="856.25" y2="180" stroke="#2457d6" stroke-width="1"/>

  <!-- Reg A Text Labels -->
  <text x="76.87" y="167" font-size="12" fill="#2457d6" text-anchor="middle">a₀</text>
  <text x="130.62" y="167" font-size="12" fill="#2457d6" text-anchor="middle">a₁</text>
  <text x="184.37" y="167" font-size="12" fill="#2457d6" text-anchor="middle">a₂</text>
  <text x="238.12" y="167" font-size="12" fill="#2457d6" text-anchor="middle">a₃</text>
  <text x="291.87" y="167" font-size="12" fill="#2457d6" text-anchor="middle">a₄</text>
  <text x="345.62" y="167" font-size="12" fill="#2457d6" text-anchor="middle">a₅</text>
  <text x="399.37" y="167" font-size="12" fill="#2457d6" text-anchor="middle">a₆</text>
  <text x="453.12" y="167" font-size="12" fill="#2457d6" text-anchor="middle">a₇</text>
  <text x="506.87" y="167" font-size="12" fill="#2457d6" text-anchor="middle">a₈</text>
  <text x="560.62" y="167" font-size="12" fill="#2457d6" text-anchor="middle">a₉</text>
  <text x="614.37" y="167" font-size="12" fill="#2457d6" text-anchor="middle">a₁₀</text>
  <text x="668.12" y="167" font-size="12" fill="#2457d6" text-anchor="middle">a₁₁</text>
  <text x="721.87" y="167" font-size="12" fill="#2457d6" text-anchor="middle">a₁₂</text>
  <text x="775.62" y="167" font-size="12" fill="#2457d6" text-anchor="middle">a₁₃</text>
  <text x="829.37" y="167" font-size="12" fill="#2457d6" text-anchor="middle">a₁₄</text>
  <text x="883.12" y="167" font-size="12" fill="#2457d6" text-anchor="middle">a₁₅</text>

  <!-- Vector Register B (Q1, 128-bit) -->
  <text x="50" y="208" font-size="12" font-weight="bold" fill="#27ae60">Векторний регістр B (Q1, 128 біт): 16 елементів INT8</text>
  <rect x="50" y="215" width="860" height="35" fill="#ffffff" stroke="#27ae60" stroke-width="1.5" rx="4"/>

  <!-- Cell dividers for Reg B -->
  <line x1="103.75" y1="215" x2="103.75" y2="250" stroke="#27ae60" stroke-width="1"/>
  <line x1="157.50" y1="215" x2="157.50" y2="250" stroke="#27ae60" stroke-width="1"/>
  <line x1="211.25" y1="215" x2="211.25" y2="250" stroke="#27ae60" stroke-width="1"/>
  <line x1="265.00" y1="215" x2="265.00" y2="250" stroke="#27ae60" stroke-width="1"/>
  <line x1="318.75" y1="215" x2="318.75" y2="250" stroke="#27ae60" stroke-width="1"/>
  <line x1="372.50" y1="215" x2="372.50" y2="250" stroke="#27ae60" stroke-width="1"/>
  <line x1="426.25" y1="215" x2="426.25" y2="250" stroke="#27ae60" stroke-width="1"/>
  <line x1="480.00" y1="215" x2="480.00" y2="250" stroke="#27ae60" stroke-width="1"/>
  <line x1="533.75" y1="215" x2="533.75" y2="250" stroke="#27ae60" stroke-width="1"/>
  <line x1="587.50" y1="215" x2="587.50" y2="250" stroke="#27ae60" stroke-width="1"/>
  <line x1="641.25" y1="215" x2="641.25" y2="250" stroke="#27ae60" stroke-width="1"/>
  <line x1="695.00" y1="215" x2="695.00" y2="250" stroke="#27ae60" stroke-width="1"/>
  <line x1="748.75" y1="215" x2="748.75" y2="250" stroke="#27ae60" stroke-width="1"/>
  <line x1="802.50" y1="215" x2="802.50" y2="250" stroke="#27ae60" stroke-width="1"/>
  <line x1="856.25" y1="215" x2="856.25" y2="250" stroke="#27ae60" stroke-width="1"/>

  <!-- Reg B Text Labels -->
  <text x="76.87" y="237" font-size="12" fill="#27ae60" text-anchor="middle">b₀</text>
  <text x="130.62" y="237" font-size="12" fill="#27ae60" text-anchor="middle">b₁</text>
  <text x="184.37" y="237" font-size="12" fill="#27ae60" text-anchor="middle">b₂</text>
  <text x="238.12" y="237" font-size="12" fill="#27ae60" text-anchor="middle">b₃</text>
  <text x="291.87" y="237" font-size="12" fill="#27ae60" text-anchor="middle">b₄</text>
  <text x="345.62" y="237" font-size="12" fill="#27ae60" text-anchor="middle">b₅</text>
  <text x="399.37" y="237" font-size="12" fill="#27ae60" text-anchor="middle">b₆</text>
  <text x="453.12" y="237" font-size="12" fill="#27ae60" text-anchor="middle">b₇</text>
  <text x="506.87" y="237" font-size="12" fill="#27ae60" text-anchor="middle">b₈</text>
  <text x="560.62" y="237" font-size="12" fill="#27ae60" text-anchor="middle">b₉</text>
  <text x="614.37" y="237" font-size="12" fill="#27ae60" text-anchor="middle">b₁₀</text>
  <text x="668.12" y="237" font-size="12" fill="#27ae60" text-anchor="middle">b₁₁</text>
  <text x="721.87" y="237" font-size="12" fill="#27ae60" text-anchor="middle">b₁₂</text>
  <text x="775.62" y="237" font-size="12" fill="#27ae60" text-anchor="middle">b₁₃</text>
  <text x="829.37" y="237" font-size="12" fill="#27ae60" text-anchor="middle">b₁₄</text>
  <text x="883.12" y="237" font-size="12" fill="#27ae60" text-anchor="middle">b₁₅</text>

  <!-- MAC Multiply-Accumulate Operator Label -->
  <text x="480" y="275" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Паралельне множення: C = ∑ (A[i] × B[i]) для i = 0..15 за 1 такт CPU</text>

  <!-- Performance Summary Box inside Top Panel -->
  <rect x="50" y="287" width="860" height="38" fill="#ffffff" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="480" y="311" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Продуктивність при 240 МГц: 16 MAC/такт × 240 МГц = 3.84 GOPS (3840 MOPS)</text>

  <!-- Panel 2: Scalar vs Vector Comparison (Bottom Area) -->
  <rect x="30" y="360" width="900" height="160" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="480" y="385" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Порівняння ефективності: Скалярне vs Векторне PIE виконання</text>

  <!-- Scalar Execution (Left Box - Red) -->
  <rect x="50" y="400" width="410" height="105" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <text x="255" y="423" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Скалярний режим (Без PIE)</text>
  <text x="65" y="445" font-size="12" fill="#1a1a1a">Послідовні ітерації циклу: for (int i=0; i&lt;16; i++)</text>
  <text x="65" y="468" font-size="12" font-weight="bold" fill="#c0392b">Час виконання 16 MAC: 16 тактів CPU</text>
  <text x="65" y="490" font-size="12" fill="#6b7280">Продуктивність при 240 МГц: 0.24 GOPS (240 MOPS)</text>

  <!-- Vector Execution (Right Box - Green) -->
  <rect x="480" y="400" width="430" height="105" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="695" y="423" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Векторний режим (PIE SIMD)</text>
  <text x="495" y="445" font-size="12" fill="#1a1a1a">Одна SIMD-інструкція: EE.VADDS.S8 / EE.VMUL.S8</text>
  <text x="495" y="468" font-size="12" font-weight="bold" fill="#27ae60">Час виконання 16 MAC: 1 такт CPU (Прискорення 16x!)</text>
  <text x="495" y="490" font-size="12" fill="#2457d6">Утилізація 128-бітної шини даних SRAM</text>
</svg>
