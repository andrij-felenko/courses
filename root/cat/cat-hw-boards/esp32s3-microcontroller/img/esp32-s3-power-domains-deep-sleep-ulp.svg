<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Домени живлення ESP32-S3 та режим глибокого сну Deep Sleep</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Відключення основних систем при збереженні стану в RTC RAM та моніторингу через ULP</text>

  <!-- Left Panel: HP Power Domain (Disabled in Deep Sleep) -->
  <rect x="35" y="90" width="435" height="330" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="252" y="112" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Домен основного процесора (HP Domain — ВИМКНЕНО)</text>

  <rect x="55" y="125" width="395" height="55" rx="4" fill="white" stroke="#c0392b" stroke-width="1"/>
  <text x="252" y="147" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Ядра Xtensa LX7 (PRO &amp; APP CPU)</text>
  <text x="252" y="165" font-size="11" fill="#6b7280" text-anchor="middle">Векторний прискорювач PIE, кеш L1 (ВИМКНЕНО)</text>

  <rect x="55" y="190" width="395" height="55" rx="4" fill="white" stroke="#c0392b" stroke-width="1"/>
  <text x="252" y="212" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Внутрішня пам'ять SRAM (512 КБ)</text>
  <text x="252" y="230" font-size="11" fill="#6b7280" text-anchor="middle">Дані втрачаються без подачі живлення</text>

  <rect x="55" y="255" width="395" height="55" rx="4" fill="white" stroke="#c0392b" stroke-width="1"/>
  <text x="252" y="277" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Цифрова периферія (Peripherals)</text>
  <text x="252" y="295" font-size="11" fill="#6b7280" text-anchor="middle">DMA, Wi-Fi, Bluetooth, USB OTG, DVP</text>

  <rect x="55" y="330" width="395" height="40" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="252" y="354" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Споживання струму: 0 мкА (знеструмлено)</text>

  <!-- Right Panel: RTC / LP Power Domain (Active in Deep Sleep) -->
  <rect x="490" y="90" width="435" height="330" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="707" y="112" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Домен зверхнизького споживання (RTC / LP Domain — АКТИВНО)</text>

  <rect x="510" y="125" width="395" height="55" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="707" y="147" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Співпроцесор ULP (RISC-V / FSM)</text>
  <text x="707" y="165" font-size="11" fill="#1a1a1a" text-anchor="middle">Автономне виконання коду при вимкненому CPU</text>

  <rect x="510" y="190" width="395" height="55" rx="4" fill="white" stroke="#27ae60" stroke-width="1"/>
  <text x="707" y="212" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Пам'ять RTC SRAM (16 КБ Fast/Slow)</text>
  <text x="707" y="230" font-size="11" fill="#6b7280" text-anchor="middle">Збереження контексту та даних під час сну</text>

  <rect x="510" y="255" width="395" height="55" rx="4" fill="white" stroke="#27ae60" stroke-width="1"/>
  <text x="707" y="277" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Контролери пробудження (Wakeup PMU)</text>
  <text x="707" y="295" font-size="11" fill="#6b7280" text-anchor="middle">RTC Timer, Touch Sensor, ULP ADC, RTC GPIO</text>

  <rect x="510" y="330" width="395" height="40" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="707" y="354" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Споживання: ~7–10 мкА (режим Deep Sleep)</text>

  <!-- Central Wakeup Arrow -->
  <line x1="510" y1="390" x2="450" y2="390" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="480" y="380" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Пробудження (Wakeup Event)</text>

  <!-- Bottom Summary Panel -->
  <rect x="35" y="440" width="890" height="60" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="462" font-size="12" font-weight="bold" fill="#2457d6">Принцип енергозбереження Deep Sleep:</text>
  <text x="50" y="482" font-size="11" fill="#1a1a1a">Ядра CPU та SRAM 512 КБ знеструмлюються; співпроцесор ULP продовжує опитувати сенсори в RTC RAM та пробуджує систему при події.</text>
</svg>
