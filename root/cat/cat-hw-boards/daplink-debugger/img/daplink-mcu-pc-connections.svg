<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-blue-rev" markerWidth="9" markerHeight="9" refX="1.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема підключення DAPLink: зневадження pyOCD та моніторинг UART</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">Фізичне розділення сигналів керування (SWD/nRESET) та послідовних даних логування (UART)</text>

  <!-- ПАНЕЛЬ 1: Хост ПК -->
  <rect x="35" y="90" width="250" height="375" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="160" y="118" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Персональний комп'ютер</text>
  <text x="160" y="136" font-size="12" fill="#6b7280" text-anchor="middle">Консольний інструментарій</text>

  <!-- pyOCD Block -->
  <rect x="50" y="155" width="220" height="135" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="160" y="180" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">pyOCD (CLI Tool)</text>
  <text x="65" y="208" font-size="12" fill="#1a1a1a">• Консольне зневадження</text>
  <text x="65" y="230" font-size="12" fill="#1a1a1a">• Стирання та прошивка</text>
  <text x="65" y="252" font-size="12" fill="#1a1a1a">• Завантаження HEX/BIN</text>
  <text x="65" y="274" font-size="12" fill="#1a1a1a">• Апаратний скид (RESET)</text>

  <!-- Log Terminal Block -->
  <rect x="50" y="305" width="220" height="140" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="160" y="330" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Термінал логів (UART)</text>
  <text x="65" y="358" font-size="12" fill="#1a1a1a">• Монітор послідовного порту</text>
  <text x="65" y="380" font-size="12" fill="#1a1a1a">• PuTTY / picocom / minicom</text>
  <text x="65" y="402" font-size="12" fill="#1a1a1a">• Аналіз текстового потоку</text>
  <text x="65" y="424" font-size="12" fill="#1a1a1a">• Конфігурація Baud Rate</text>

  <!-- ПАНЕЛЬ 2: DAPLink Debugger -->
  <rect x="355" y="90" width="250" height="375" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="480" y="118" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Зневаджувач DAPLink</text>
  <text x="480" y="136" font-size="12" fill="#6b7280" text-anchor="middle">WeAct Mini / CMSIS-DAP</text>

  <!-- USB Composite Block -->
  <rect x="370" y="155" width="220" height="55" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="480" y="177" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">USB Composite Device</text>
  <text x="480" y="196" font-size="12" fill="#6b7280" text-anchor="middle">CMSIS-DAP + CDC VCP</text>

  <!-- CMSIS-DAP Module Block -->
  <rect x="370" y="225" width="220" height="90" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="480" y="250" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">CMSIS-DAP Модуль</text>
  <text x="480" y="272" font-size="12" fill="#1a1a1a" text-anchor="middle">Керування SWD та nRESET</text>
  <text x="480" y="294" font-size="12" fill="#6b7280" text-anchor="middle">Шина зневадження МК</text>

  <!-- USB-to-UART Bridge Block -->
  <rect x="370" y="330" width="220" height="115" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="480" y="355" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">USB-to-UART Міст</text>
  <text x="480" y="377" font-size="12" fill="#1a1a1a" text-anchor="middle">Віртуальний COM-порт</text>
  <text x="480" y="399" font-size="12" fill="#1a1a1a" text-anchor="middle">Трансляція TXD / RXD</text>
  <text x="480" y="421" font-size="12" fill="#6b7280" text-anchor="middle">Передача текстових логів</text>

  <!-- ПАНЕЛЬ 3: Цільовий МК -->
  <rect x="675" y="90" width="250" height="375" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="800" y="118" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Цільовий МК (Target)</text>
  <text x="800" y="136" font-size="12" fill="#6b7280" text-anchor="middle">ARM Cortex-M (напр. STM32)</text>

  <!-- SWD / Reset Interface Block -->
  <rect x="690" y="155" width="220" height="135" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="800" y="180" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Інтерфейс SWD / Reset</text>
  <text x="705" y="208" font-size="12" fill="#1a1a1a">• SWCLK (Сигнал тактування)</text>
  <text x="705" y="230" font-size="12" fill="#1a1a1a">• SWDIO (Двонаправлені дані)</text>
  <text x="705" y="252" font-size="12" fill="#1a1a1a">• nRESET (Скидання МК)</text>
  <text x="705" y="274" font-size="12" fill="#1a1a1a">• Прямий доступ до Flash/RAM</text>

  <!-- USART / UART Peripheral Block -->
  <rect x="690" y="305" width="220" height="140" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="800" y="330" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Периферія USART / UART</text>
  <text x="705" y="358" font-size="12" fill="#1a1a1a">• MCU TX (Вивід логів)</text>
  <text x="705" y="380" font-size="12" fill="#1a1a1a">• MCU RX (Вхід команд)</text>
  <text x="705" y="402" font-size="12" fill="#1a1a1a">• Виведення printf / log</text>
  <text x="705" y="424" font-size="12" fill="#1a1a1a">• Незалежно від SWD</text>

  <!-- ЗВ'ЯЗКИ МІЖ ПК ТА DAPLINK -->
  <!-- pyOCD to USB Interface -->
  <line x1="270" y1="182.5" x2="370" y2="182.5" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="320" y="174" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">CMSIS-DAP</text>

  <!-- Log Terminal to UART Bridge -->
  <line x1="270" y1="378" x2="370" y2="378" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="320" y="370" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">CDC VCP</text>
  <line x1="370" y1="396" x2="270" y2="396" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="320" y="411" font-size="12" fill="#6b7280" text-anchor="middle">(COM-порт)</text>

  <!-- ЗВ'ЯЗКИ МІЖ DAPLINK ТА ЦІЛЬОВИМ МК -->
  <!-- SWCLK -->
  <line x1="590" y1="240" x2="690" y2="240" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="640" y="232" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">SWCLK →</text>

  <!-- SWDIO -->
  <line x1="590" y1="265" x2="690" y2="265" stroke="#2457d6" stroke-width="2" marker-start="url(#arr-blue-rev)" marker-end="url(#arr-blue)"/>
  <text x="640" y="257" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">SWDIO</text>

  <!-- nRESET -->
  <line x1="590" y1="290" x2="690" y2="290" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="640" y="282" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">nRESET →</text>

  <!-- TXD to RXD -->
  <line x1="590" y1="365" x2="690" y2="365" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="640" y="357" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">TXD → RXD</text>

  <!-- RXD from TXD (Logs) -->
  <line x1="690" y1="410" x2="590" y2="410" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="640" y="402" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">RXD ← TXD</text>
  <text x="640" y="427" font-size="12" fill="#6b7280" text-anchor="middle">(Логи)</text>
</svg>
