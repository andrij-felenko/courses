<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Right arrow markers -->
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <!-- Left arrow markers -->
    <marker id="arr-left-red" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-left-green" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-left-blue" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="510" fill="white"/>

  <!-- Header Title and Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Спотворення сигналів SWD під впливом RC-параметрів лінії</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Паразитна ємність затягує фронти (t_rise), звужує вікно вибірки та викликає помилки Setup/Hold</text>

  <!-- Main Diagram Panel -->
  <rect x="30" y="80" width="900" height="260" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Left Column Labels -->
  <text x="45" y="124" font-size="13" font-weight="bold" fill="#1a1a1a">SWCLK (Ідеальний)</text>
  <text x="45" y="140" font-size="12" fill="#6b7280">Меандр без затримок</text>

  <text x="45" y="178" font-size="13" font-weight="bold" fill="#c0392b">SWCLK (Реальний RC)</text>
  <text x="45" y="194" font-size="12" fill="#6b7280">Затягнутий фронт t_rise</text>

  <text x="45" y="250" font-size="13" font-weight="bold" fill="#2457d6">SWDIO (Дані)</text>
  <text x="45" y="266" font-size="12" fill="#6b7280">Зсув фази та затримка</text>

  <text x="45" y="300" font-size="13" font-weight="bold" fill="#1a1a1a">Стробування</text>
  <text x="45" y="316" font-size="12" fill="#6b7280">Зчитування MCU</text>

  <!-- Sampling Zone Label (Positioned clearly above waveform lines) -->
  <text x="690" y="98" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Фронт зчитування</text>

  <!-- Sampling Zone Background Highlight & Line -->
  <rect x="670" y="104" width="40" height="226" fill="#2457d6" fill-opacity="0.08"/>
  <line x1="690" y1="104" x2="690" y2="330" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="5 3"/>

  <!-- Voltage Threshold Lines and Labels -->
  <line x1="210" y1="170" x2="790" y2="170" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="210" y1="188" x2="790" y2="188" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="800" y="174" font-size="12" fill="#6b7280" text-anchor="start">V_IH = 0.7 V_DD</text>
  <text x="800" y="192" font-size="12" fill="#6b7280" text-anchor="start">V_IL = 0.3 V_DD</text>

  <!-- Waveform 1: SWCLK Ideal -->
  <path d="M 210,144 L 240,144 L 240,116 L 420,116 L 420,144 L 600,144 L 600,116 L 780,116 L 780,144 L 870,144" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3" fill="none"/>

  <!-- Waveform 2: SWCLK Real RC -->
  <path d="M 210,198 L 240,198 C 270,198 300,160 380,160 L 420,160 C 450,160 480,198 560,198 L 600,198 C 630,198 660,160 740,160 L 780,160 C 810,160 840,198 870,198" stroke="#c0392b" stroke-width="2.2" fill="none"/>

  <!-- t_rise Annotation -->
  <line x1="260" y1="188" x2="260" y2="210" stroke="#c0392b" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="345" y1="166" x2="345" y2="210" stroke="#c0392b" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="260" y1="210" x2="345" y2="210" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-left-red)" marker-end="url(#arr-red)"/>
  <text x="302.5" y="230" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">t_rise (RC)</text>

  <!-- Waveform 3: SWDIO Normal Data Signal -->
  <path d="M 210,270 L 470,270 C 500,270 520,242 560,242 L 720,242 C 745,242 765,270 790,270 L 870,270" stroke="#2457d6" stroke-width="2.2" fill="none"/>

  <!-- Waveform 4: SWDIO High Capacitance Signal (Distorted) -->
  <path d="M 470,270 C 530,270 620,266 690,262 C 730,260 760,250 790,242" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4 3" fill="none"/>
  <circle cx="690" cy="262" r="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="690" y="266" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">✕</text>
  <text x="710" y="224" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">C_line &gt; C_max (Помилка)</text>

  <!-- t_setup Annotation -->
  <line x1="560" y1="242" x2="560" y2="290" stroke="#27ae60" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="560" y1="290" x2="690" y2="290" stroke="#27ae60" stroke-width="1.5" marker-start="url(#arr-left-green)" marker-end="url(#arr-green)"/>
  <text x="625" y="308" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">t_setup (Норма)</text>

  <!-- t_hold Annotation -->
  <line x1="720" y1="242" x2="720" y2="315" stroke="#2457d6" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="690" y1="315" x2="720" y2="315" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-left-blue)" marker-end="url(#arr-blue)"/>
  <text x="726" y="332" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">t_hold (Норма)</text>

  <!-- Bottom Panel Left: Solution / Normal -->
  <rect x="30" y="355" width="435" height="135" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="45" y="377" font-size="13" font-weight="bold" fill="#27ae60">Низька ємність (C_line &lt; C_max) — Нормальний режим</text>
  <text x="45" y="399" font-size="12" fill="#1a1a1a">• t_rise ≪ T_SWCLK / 2: фронти чіткі, V_IH досягається швидко</text>
  <text x="45" y="419" font-size="12" fill="#1a1a1a">• Запаси t_setup і t_hold перевищують мінімальні вимоги MCU</text>
  <text x="45" y="439" font-size="12" fill="#1a1a1a">• Гранична частота: f_SWCLK ≤ 1 / (2π · R_line · C_line)</text>
  <text x="45" y="459" font-size="12" fill="#27ae60" font-weight="bold">✔ Передача даних стабільна, відсутні втрати пакетів</text>

  <!-- Bottom Panel Right: Problem / Error -->
  <rect x="495" y="355" width="435" height="135" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="510" y="377" font-size="13" font-weight="bold" fill="#c0392b">Велика ємність (C_line &gt; C_max) — Збій зв'язку</text>
  <text x="510" y="399" font-size="12" fill="#1a1a1a">• t_rise порівняний із півперіодом: сигнал згладжується</text>
  <text x="510" y="419" font-size="12" fill="#1a1a1a">• Порушення t_setup / t_hold: рівень V_IH не досягається вчасно</text>
  <text x="510" y="439" font-size="12" fill="#1a1a1a">• Похибка зчитування бітів при стробуванні (Sampling Error)</text>
  <text x="510" y="459" font-size="12" fill="#c0392b" font-weight="bold">✖ Таймаут SWD, помилка Protocol Error, обрив сесії</text>
</svg>
