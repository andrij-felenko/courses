<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="960" height="490" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="490" fill="white"/>

  <!-- Marker Definitions -->
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Еволюція екосистеми ESP8266 та інструментів розробки</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Ключові віхи від виходу чипа ESP8266EX у 2014 році до формування сучасних стандартів esptool та Arduino Core</text>

  <!-- MAIN TIMELINE AXIS -->
  <line x1="30" y1="240" x2="925" y2="240" stroke="#2457d6" stroke-width="4" marker-end="url(#arr-blue)"/>

  <!-- STAGE 1: 08.2014 - ESP8266 (Top) -->
  <line x1="110" y1="205" x2="110" y2="240" stroke="#2457d6" stroke-width="2"/>
  <circle cx="110" cy="240" r="8" fill="white" stroke="#2457d6" stroke-width="3"/>
  <circle cx="110" cy="240" r="3.5" fill="#2457d6"/>

  <rect x="42" y="80" width="136" height="125" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="48" y="88" width="124" height="22" rx="4" fill="#2457d6"/>
  <text x="110" y="103" font-size="12" font-weight="bold" fill="white" text-anchor="middle">08.2014: ESP8266</text>
  <text x="50" y="125" font-size="12" font-weight="bold" fill="#1a1a1a">Анонс SoC</text>
  <text x="50" y="142" font-size="12" fill="#6b7280">Tensilica L106</text>
  <text x="50" y="159" font-size="12" fill="#6b7280">Wi-Fi 802.11 b/g/n</text>
  <text x="50" y="176" font-size="12" font-weight="bold" fill="#2457d6">Non-OS SDK (AT)</text>

  <!-- STAGE 2: 09.2014 - ESP-01 (Bottom) -->
  <line x1="260" y1="240" x2="260" y2="275" stroke="#4b5563" stroke-width="2"/>
  <circle cx="260" cy="240" r="8" fill="white" stroke="#4b5563" stroke-width="3"/>
  <circle cx="260" cy="240" r="3.5" fill="#4b5563"/>

  <rect x="192" y="275" width="136" height="125" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="198" y="283" width="124" height="22" rx="4" fill="#4b5563"/>
  <text x="260" y="298" font-size="12" font-weight="bold" fill="white" text-anchor="middle">09.2014: ESP-01</text>
  <text x="200" y="320" font-size="12" font-weight="bold" fill="#1a1a1a">Плата AI-Thinker</text>
  <text x="200" y="337" font-size="12" fill="#6b7280">512 KB SPI Flash</text>
  <text x="200" y="354" font-size="12" fill="#6b7280">Ціна $1.5 за шт.</text>
  <text x="200" y="371" font-size="12" font-weight="bold" fill="#27ae60">Масовий вихід</text>

  <!-- STAGE 3: 10.2014 - esptool (Top) -->
  <line x1="410" y1="205" x2="410" y2="240" stroke="#27ae60" stroke-width="2"/>
  <circle cx="410" cy="240" r="8" fill="white" stroke="#27ae60" stroke-width="3"/>
  <circle cx="410" cy="240" r="3.5" fill="#27ae60"/>

  <rect x="342" y="80" width="136" height="125" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="348" y="88" width="124" height="22" rx="4" fill="#27ae60"/>
  <text x="410" y="103" font-size="12" font-weight="bold" fill="white" text-anchor="middle">10.2014: esptool</text>
  <text x="350" y="125" font-size="12" font-weight="bold" fill="#1a1a1a">esptool.py CLI</text>
  <text x="350" y="142" font-size="12" fill="#6b7280">Утиліта прошивки</text>
  <text x="350" y="159" font-size="12" fill="#6b7280">UART ROM Boot</text>
  <text x="350" y="176" font-size="12" font-weight="bold" fill="#27ae60">Open Source</text>

  <!-- STAGE 4: 11.2014 - NodeMCU (Bottom) -->
  <line x1="560" y1="240" x2="560" y2="275" stroke="#d97706" stroke-width="2"/>
  <circle cx="560" cy="240" r="8" fill="white" stroke="#d97706" stroke-width="3"/>
  <circle cx="560" cy="240" r="3.5" fill="#d97706"/>

  <rect x="492" y="275" width="136" height="125" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <rect x="498" y="283" width="124" height="22" rx="4" fill="#d97706"/>
  <text x="560" y="298" font-size="12" font-weight="bold" fill="white" text-anchor="middle">11.2014: NodeMCU</text>
  <text x="500" y="320" font-size="12" font-weight="bold" fill="#1a1a1a">Прошивка NodeMCU</text>
  <text x="500" y="337" font-size="12" fill="#6b7280">Мова скриптів Lua</text>
  <text x="500" y="354" font-size="12" fill="#6b7280">Автономний МК</text>
  <text x="500" y="371" font-size="12" font-weight="bold" fill="#d97706">Відмова від AT</text>

  <!-- STAGE 5: 05.2015 - Arduino (Top) -->
  <line x1="710" y1="205" x2="710" y2="240" stroke="#2457d6" stroke-width="2"/>
  <circle cx="710" cy="240" r="8" fill="white" stroke="#2457d6" stroke-width="3"/>
  <circle cx="710" cy="240" r="3.5" fill="#2457d6"/>

  <rect x="642" y="80" width="136" height="125" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="648" y="88" width="124" height="22" rx="4" fill="#2457d6"/>
  <text x="710" y="103" font-size="12" font-weight="bold" fill="white" text-anchor="middle">05.2015: Arduino</text>
  <text x="650" y="125" font-size="12" font-weight="bold" fill="#1a1a1a">Arduino Core</text>
  <text x="650" y="142" font-size="12" fill="#6b7280">Підтримка C/C++</text>
  <text x="650" y="159" font-size="12" fill="#6b7280">Бібліотеки IDE</text>
  <text x="650" y="176" font-size="12" font-weight="bold" fill="#2457d6">Вибух популярності</text>

  <!-- STAGE 6: 2016+ - RTOS & FOTA (Bottom) -->
  <line x1="860" y1="240" x2="860" y2="275" stroke="#27ae60" stroke-width="2"/>
  <circle cx="860" cy="240" r="8" fill="white" stroke="#27ae60" stroke-width="3"/>
  <circle cx="860" cy="240" r="3.5" fill="#27ae60"/>

  <rect x="792" y="275" width="136" height="125" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="798" y="283" width="124" height="22" rx="4" fill="#27ae60"/>
  <text x="860" y="298" font-size="12" font-weight="bold" fill="white" text-anchor="middle">2016+: RTOS &amp; FOTA</text>
  <text x="800" y="320" font-size="12" font-weight="bold" fill="#1a1a1a">ESP8266 RTOS SDK</text>
  <text x="800" y="337" font-size="12" fill="#6b7280">Flash 1MB - 4MB</text>
  <text x="800" y="354" font-size="12" fill="#6b7280">FOTA оновлення</text>
  <text x="800" y="371" font-size="12" font-weight="bold" fill="#27ae60">Стандарт розробки</text>

  <!-- BOTTOM LEGEND PANEL -->
  <rect x="30" y="420" width="900" height="55" rx="6" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="480" y="438" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Трансформація ролі ESP8266:</text>
  <text x="480" y="456" font-size="12" fill="#6b7280" text-anchor="middle">Від звичайного AT-модема для Arduino до автономної 32-бітної платформи з підтримкою C++, Lua, Python та FOTA</text>
</svg>
