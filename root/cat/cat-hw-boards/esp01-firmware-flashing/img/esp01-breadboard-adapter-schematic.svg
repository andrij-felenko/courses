<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Header -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Принципова схема макетного адаптера для ESP-01</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Стабілізація живлення 3.3 В, дільник рівнів 5 В→3.3 В, підтяжки 10 кОм та кнопки Flash/Reset</text>

  <!-- Power Bus Lines -->
  <!-- 3.3V VCC Bus (Red) -->
  <line x1="190" y1="90" x2="910" y2="90" stroke="#c0392b" stroke-width="2.5"/>
  <text x="195" y="82" font-size="12" font-weight="bold" fill="#c0392b">Шина +3.3 В (VCC)</text>

  <!-- GND Bus (Dark Slate) -->
  <line x1="80" y1="395" x2="910" y2="395" stroke="#475569" stroke-width="2.5"/>
  <text x="85" y="415" font-size="12" font-weight="bold" fill="#475569">Шина 0 В (GND)</text>

  <!-- USB-UART Module Box -->
  <rect x="30" y="110" width="90" height="270" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="75" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">USB-UART</text>
  <text x="75" y="148" text-anchor="middle" font-size="12" fill="#6b7280">(5V / TTL)</text>

  <!-- USB Pins Labels -->
  <text x="110" y="174" text-anchor="end" font-size="12" font-weight="bold" fill="#d97706">5V</text>
  <text x="110" y="289" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">TX</text>
  <text x="110" y="349" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">RX</text>
  <text x="110" y="379" text-anchor="end" font-size="12" font-weight="bold" fill="#475569">GND</text>

  <!-- 5V Input Line -->
  <line x1="120" y1="170" x2="150" y2="170" stroke="#d97706" stroke-width="2"/>
  <text x="135" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#d97706">+5V</text>

  <!-- USB GND Connection -->
  <line x1="120" y1="375" x2="120" y2="395" stroke="#475569" stroke-width="1.5"/>

  <!-- AMS1117-3.3 LDO Regulator Box -->
  <rect x="150" y="140" width="80" height="55" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="190" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">AMS1117</text>
  <text x="190" y="178" text-anchor="middle" font-size="11" fill="#2457d6">3.3V LDO</text>

  <!-- LDO Connections -->
  <line x1="190" y1="140" x2="190" y2="90" stroke="#c0392b" stroke-width="2"/>
  <line x1="190" y1="195" x2="190" y2="395" stroke="#475569" stroke-width="1.5"/>

  <!-- Capacitor C1 (10 uF Electrolytic) -->
  <line x1="250" y1="90" x2="250" y2="395" stroke="#475569" stroke-width="1.5"/>
  <line x1="240" y1="220" x2="260" y2="220" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="240" y1="228" x2="260" y2="228" stroke="#1a1a1a" stroke-width="2"/>
  <text x="250" y="213" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">+</text>
  <text x="262" y="228" font-size="12" fill="#1a1a1a">C1 10 мкФ</text>

  <!-- Capacitor C2 (100 nF Ceramic) -->
  <line x1="320" y1="90" x2="320" y2="395" stroke="#475569" stroke-width="1.5"/>
  <line x1="310" y1="220" x2="330" y2="220" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="310" y1="228" x2="330" y2="228" stroke="#1a1a1a" stroke-width="2"/>
  <text x="332" y="228" font-size="12" fill="#1a1a1a">C2 100 нФ</text>

  <!-- Voltage Divider for RXD Line (USB TX 5V -> ESP RXD 3.3V) -->
  <line x1="120" y1="285" x2="135" y2="285" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Resistor R_DIV1 (1 kOhm) -->
  <rect x="135" y="276" width="36" height="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="153" y="270" text-anchor="middle" font-size="11" fill="#1a1a1a">R_DIV1 1k</text>

  <!-- Wire after R_DIV1 to ESP RXD -->
  <line x1="171" y1="285" x2="390" y2="285" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Resistor R_DIV2 (2 kOhm) to GND -->
  <circle cx="200" cy="285" r="3" fill="#2457d6"/>
  <line x1="200" y1="285" x2="200" y2="315" stroke="#475569" stroke-width="1.5"/>
  <rect x="191" y="315" width="18" height="36" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="185" y="338" text-anchor="end" font-size="11" fill="#1a1a1a">R_DIV2 2k</text>
  <line x1="200" y1="351" x2="200" y2="395" stroke="#475569" stroke-width="1.5"/>

  <!-- Direct TXD Line (ESP TXD -> USB RX) -->
  <line x1="390" y1="345" x2="120" y2="345" stroke="#27ae60" stroke-width="1.5"/>
  <text x="355" y="337" text-anchor="middle" font-size="11" fill="#27ae60">TXD (3.3V)</text>

  <!-- ESP-01 Module Box -->
  <rect x="390" y="110" width="190" height="260" rx="8" fill="#f8fafc" stroke="#2457d6" stroke-width="2"/>
  <text x="485" y="132" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Модуль ESP-01</text>

  <!-- Antenna Pattern -->
  <path d="M435,142 L445,142 L445,152 L455,152 L455,142 L465,142 L465,152 L475,152 L475,142 L485,142" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <!-- ESP-01 Left Side Connections -->
  <!-- VCC Pin -->
  <line x1="360" y1="90" x2="360" y2="160" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="360" y1="160" x2="390" y2="160" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="390" cy="160" r="3" fill="#c0392b"/>
  <text x="398" y="164" font-size="12" font-weight="bold" fill="#c0392b">VCC (3.3V)</text>

  <!-- RXD Pin -->
  <circle cx="390" cy="285" r="3" fill="#2457d6"/>
  <text x="398" y="289" font-size="12" font-weight="bold" fill="#2457d6">RXD</text>

  <!-- TXD Pin -->
  <circle cx="390" cy="345" r="3" fill="#27ae60"/>
  <text x="398" y="349" font-size="12" font-weight="bold" fill="#27ae60">TXD</text>

  <!-- ESP-01 Bottom GND Pin Connection -->
  <circle cx="485" cy="370" r="3" fill="#475569"/>
  <text x="485" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">GND</text>
  <line x1="485" y1="370" x2="485" y2="395" stroke="#475569" stroke-width="1.5"/>

  <!-- ESP-01 Right Side Connections & Controls -->
  <!-- CH_PD Pin -->
  <circle cx="580" cy="160" r="3" fill="#1a1a1a"/>
  <text x="572" y="164" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">CH_PD</text>

  <!-- CH_PD Pull-up (R1 10k) -->
  <line x1="580" y1="160" x2="635" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="635" cy="160" r="3" fill="#1a1a1a"/>
  <line x1="635" y1="90" x2="635" y2="115" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="626" y="115" width="18" height="30" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="635" y1="145" x2="635" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="648" y="133" font-size="11" fill="#1a1a1a">R1 10k</text>

  <!-- GPIO2 Pin -->
  <circle cx="580" cy="210" r="3" fill="#1a1a1a"/>
  <text x="572" y="214" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">GPIO2</text>

  <!-- GPIO2 Pull-up (R2 10k) -->
  <line x1="580" y1="210" x2="685" y2="210" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="685" cy="210" r="3" fill="#1a1a1a"/>
  <line x1="685" y1="90" x2="685" y2="115" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="676" y="115" width="18" height="30" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="685" y1="145" x2="685" y2="210" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="696" y="133" font-size="11" fill="#1a1a1a">R2 10k</text>

  <!-- RST Pin -->
  <circle cx="580" cy="275" r="3" fill="#c0392b"/>
  <text x="572" y="279" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">RST</text>

  <!-- RST Line & R3 (10k Pull-up) + SW1 (Reset Button) -->
  <line x1="580" y1="275" x2="735" y2="275" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="735" cy="275" r="3" fill="#c0392b"/>
  <line x1="735" y1="90" x2="735" y2="115" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="726" y="115" width="18" height="30" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="735" y1="145" x2="735" y2="275" stroke="#c0392b" stroke-width="1.5"/>
  <text x="746" y="133" font-size="11" fill="#1a1a1a">R3 10k</text>

  <!-- SW1 Reset Button -->
  <line x1="735" y1="275" x2="735" y2="315" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="735" cy="315" r="3" fill="#c0392b"/>
  <circle cx="735" cy="345" r="3" fill="#475569"/>
  <line x1="735" y1="345" x2="725" y2="318" stroke="#c0392b" stroke-width="2"/>
  <line x1="735" y1="345" x2="735" y2="395" stroke="#475569" stroke-width="1.5"/>
  <text x="723" y="333" text-anchor="end" font-size="11" font-weight="bold" fill="#c0392b">SW1 (Reset)</text>

  <!-- C3 Debounce Capacitor (100 nF) for RST -->
  <line x1="735" y1="275" x2="785" y2="275" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="785" cy="275" r="3" fill="#c0392b"/>
  <line x1="785" y1="275" x2="785" y2="315" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="775" y1="315" x2="795" y2="315" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="775" y1="323" x2="795" y2="323" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="785" y1="323" x2="785" y2="395" stroke="#475569" stroke-width="1.5"/>
  <text x="797" y="323" font-size="11" fill="#6b7280">C3 100 нФ</text>

  <!-- GPIO0 Pin -->
  <circle cx="580" cy="345" r="3" fill="#27ae60"/>
  <text x="572" y="349" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">GPIO0</text>

  <!-- GPIO0 Line & R4 (10k Pull-up) + SW2 (Flash Button) -->
  <line x1="580" y1="345" x2="855" y2="345" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="855" cy="345" r="3" fill="#27ae60"/>
  <line x1="855" y1="90" x2="855" y2="115" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="846" y="115" width="18" height="30" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="855" y1="145" x2="855" y2="345" stroke="#27ae60" stroke-width="1.5"/>
  <text x="838" y="133" text-anchor="end" font-size="11" fill="#1a1a1a">R4 10k</text>

  <!-- SW2 Flash Button -->
  <line x1="855" y1="345" x2="855" y2="355" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="855" cy="355" r="3" fill="#27ae60"/>
  <circle cx="855" cy="375" r="3" fill="#475569"/>
  <line x1="855" y1="375" x2="845" y2="358" stroke="#27ae60" stroke-width="2"/>
  <line x1="855" y1="375" x2="855" y2="395" stroke="#475569" stroke-width="1.5"/>
  <text x="867" y="370" font-size="11" font-weight="bold" fill="#27ae60">SW2 (Flash)</text>

  <!-- Node Dots on Buses -->
  <!-- 3.3V Bus Dots -->
  <circle cx="190" cy="90" r="3.5" fill="#c0392b"/>
  <circle cx="250" cy="90" r="3.5" fill="#c0392b"/>
  <circle cx="320" cy="90" r="3.5" fill="#c0392b"/>
  <circle cx="360" cy="90" r="3.5" fill="#c0392b"/>
  <circle cx="635" cy="90" r="3.5" fill="#c0392b"/>
  <circle cx="685" cy="90" r="3.5" fill="#c0392b"/>
  <circle cx="735" cy="90" r="3.5" fill="#c0392b"/>
  <circle cx="855" cy="90" r="3.5" fill="#c0392b"/>

  <!-- GND Bus Dots -->
  <circle cx="120" cy="395" r="3.5" fill="#475569"/>
  <circle cx="190" cy="395" r="3.5" fill="#475569"/>
  <circle cx="200" cy="395" r="3.5" fill="#475569"/>
  <circle cx="250" cy="395" r="3.5" fill="#475569"/>
  <circle cx="320" cy="395" r="3.5" fill="#475569"/>
  <circle cx="485" cy="395" r="3.5" fill="#475569"/>
  <circle cx="735" cy="395" r="3.5" fill="#475569"/>
  <circle cx="785" cy="395" r="3.5" fill="#475569"/>
  <circle cx="855" cy="395" r="3.5" fill="#475569"/>

  <!-- Bottom Panel: Boot Mode Sequence -->
  <rect x="30" y="435" width="900" height="85" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="45" y="458" font-size="13" font-weight="bold" fill="#1a1a1a">Алгоритм переведення режимів завантаження ESP8266:</text>
  <text x="45" y="478" font-size="12" fill="#6b7280">• CH_PD та GPIO2 повинні бути постійно підтягнуті до +3.3 В</text>
  <text x="45" y="498" font-size="12" fill="#6b7280">• Дільник R_DIV1/R_DIV2 знижує 5V TX від USB-UART до 3.3V для RXD</text>

  <!-- PROG Mode Sub-box -->
  <rect x="505" y="447" width="195" height="63" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="515" y="465" font-size="12" font-weight="bold" fill="#27ae60">Режим прошивки (PROG):</text>
  <text x="515" y="482" font-size="12" fill="#1a1a1a">1. Затиснути SW2 (GPIO0 = 0 В)</text>
  <text x="515" y="498" font-size="12" fill="#1a1a1a">2. Натиснути SW1 (Reset)</text>

  <!-- RUN Mode Sub-box -->
  <rect x="715" y="447" width="195" height="63" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="725" y="465" font-size="12" font-weight="bold" fill="#2457d6">Робочий режим (RUN):</text>
  <text x="725" y="482" font-size="12" fill="#1a1a1a">SW2 відпущено (GPIO0 = 3.3 В)</text>
  <text x="725" y="498" font-size="12" fill="#1a1a1a">Натиснути SW1 → запуск Flash</text>
</svg>
