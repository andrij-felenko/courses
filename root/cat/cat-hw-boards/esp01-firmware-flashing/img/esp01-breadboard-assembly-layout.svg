<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Монтажна схема прошивання ESP-01 на безпайковій макетній платі (Breadboard)</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Розміщення компонентів, стабілізатора 3.3 В, підтяжок, кнопок Reset/Flash та перемичок</text>

  <!-- Left Panel: USB-UART Adapter -->
  <rect x="25" y="90" width="130" height="430" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="25" y="90" width="130" height="30" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="90" y="110" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">USB-UART адаптер</text>

  <text x="140" y="154" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">+5V</text>
  <circle cx="155" cy="150" r="4" fill="#c0392b"/>

  <text x="140" y="214" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">GND</text>
  <circle cx="155" cy="210" r="4" fill="#1a1a1a"/>

  <text x="140" y="344" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">TXD</text>
  <circle cx="155" cy="340" r="4" fill="#2457d6"/>

  <text x="140" y="434" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">RXD</text>
  <circle cx="155" cy="430" r="4" fill="#27ae60"/>

  <!-- Breadboard Canvas Body -->
  <rect x="180" y="90" width="570" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>

  <!-- Top Power Rails (+3.3V & GND) -->
  <text x="195" y="104" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">Шина +3.3V</text>
  <text x="335" y="104" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Шина GND</text>
  <line x1="190" y1="110" x2="735" y2="110" stroke="#c0392b" stroke-width="2"/>
  <line x1="190" y1="126" x2="735" y2="126" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Bottom Power Rails (+3.3V & GND) -->
  <text x="195" y="484" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">Шина +3.3V</text>
  <text x="320" y="484" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Шина GND</text>
  <line x1="190" y1="490" x2="735" y2="490" stroke="#c0392b" stroke-width="2"/>
  <line x1="190" y1="506" x2="735" y2="506" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Center Divider Trough -->
  <line x1="180" y1="300" x2="750" y2="300" stroke="#d0d7de" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- LDO 3.3V Power Module -->
  <rect x="215" y="150" width="100" height="85" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="215" y="150" width="100" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="265" y="166" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">LDO 3.3V</text>
  <text x="265" y="190" font-size="12" fill="#6b7280" text-anchor="middle">AMS1117</text>
  <text x="235" y="222" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">VIN</text>
  <text x="265" y="222" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GND</text>
  <text x="295" y="222" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">VOUT</text>

  <!-- Wires for LDO -->
  <line x1="155" y1="150" x2="215" y2="150" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="188" y="141" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">+5V</text>

  <line x1="265" y1="150" x2="265" y2="126" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="265" cy="126" r="3.5" fill="#1a1a1a"/>

  <line x1="295" y1="150" x2="295" y2="110" stroke="#27ae60" stroke-width="2"/>
  <circle cx="295" cy="110" r="3.5" fill="#c0392b"/>

  <!-- Decoupling Capacitors C1 & C2 -->
  <line x1="340" y1="110" x2="340" y2="168" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="340" cy="110" r="3.5" fill="#c0392b"/>
  <line x1="332" y1="168" x2="348" y2="168" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="332" y1="174" x2="348" y2="174" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="340" y1="174" x2="340" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="352" y="174" font-size="12" fill="#6b7280" text-anchor="start">C1 (10 µF)</text>

  <line x1="332" y1="225" x2="348" y2="225" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="332" y1="231" x2="348" y2="231" stroke="#1a1a1a" stroke-width="2"/>
  <text x="352" y="231" font-size="12" fill="#6b7280" text-anchor="start">C2 (100 nF)</text>

  <line x1="340" y1="231" x2="340" y2="255" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="340" y1="255" x2="325" y2="255" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="325" y1="255" x2="325" y2="126" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="325" cy="126" r="3.5" fill="#1a1a1a"/>

  <!-- Buttons: SW2 (Reset) & SW1 (Flash) -->
  <!-- SW2 Reset Button -->
  <rect x="430" y="150" width="55" height="35" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="457.5" cy="167.5" r="5" fill="#6b7280"/>
  <text x="490" y="171" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="start">SW2 (Reset)</text>

  <path d="M 430 167.5 L 415 167.5 L 415 279 L 590 279" stroke="#c0392b" stroke-width="1.5" fill="none"/>

  <line x1="457.5" y1="150" x2="457.5" y2="126" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="457.5" cy="126" r="3.5" fill="#1a1a1a"/>

  <!-- SW1 Flash Button -->
  <rect x="430" y="240" width="55" height="35" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="457.5" cy="257.5" r="5" fill="#2457d6"/>
  <text x="490" y="261" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">SW1 (Flash)</text>

  <path d="M 430 257.5 L 405 257.5 L 405 309 L 590 309" stroke="#2457d6" stroke-width="1.5" fill="none"/>

  <line x1="457.5" y1="275" x2="457.5" y2="490" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="457.5" cy="490" r="3.5" fill="#1a1a1a"/>

  <!-- Level Divider (R1 1k & R2 2k) -->
  <line x1="155" y1="340" x2="340" y2="340" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="340" y="331" width="45" height="18" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="362.5" y="325" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">R1 1kΩ</text>

  <path d="M 385 340 L 410 340 L 410 369 L 590 369" stroke="#2457d6" stroke-width="2" fill="none"/>

  <line x1="410" y1="340" x2="410" y2="365" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="401" y="365" width="18" height="45" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="424" y="391" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">R2 2kΩ</text>
  <line x1="410" y1="410" x2="410" y2="506" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="410" cy="506" r="3.5" fill="#1a1a1a"/>
  <circle cx="410" cy="340" r="3.5" fill="#2457d6"/>

  <!-- TXD Direct Wire -->
  <path d="M 590 399 L 350 399 L 350 430 L 155 430" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>
  <text x="250" y="422" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">TXD -&gt; RXD (3.3V)</text>

  <!-- ESP-01 Module Box (Right) -->
  <rect x="590" y="150" width="155" height="310" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <rect x="590" y="150" width="155" height="30" rx="8" fill="#27ae60"/>
  <text x="667" y="170" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Модуль ESP-01</text>

  <!-- ESP-01 Pins -->
  <circle cx="590" cy="204" r="3.5" fill="#c0392b"/>
  <text x="602" y="208" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">VCC (+3.3V)</text>
  <path d="M 590 204 L 583 204 L 583 110" stroke="#c0392b" stroke-width="1.5" fill="none"/>
  <circle cx="583" cy="110" r="3.5" fill="#c0392b"/>

  <circle cx="590" cy="234" r="3.5" fill="#27ae60"/>
  <text x="602" y="238" font-size="12" fill="#1a1a1a" text-anchor="start">CH_PD (EN)</text>
  <path d="M 590 234 L 575 234 L 575 110" stroke="#27ae60" stroke-width="1.5" fill="none"/>
  <circle cx="575" cy="110" r="3.5" fill="#27ae60"/>

  <circle cx="590" cy="279" r="3.5" fill="#c0392b"/>
  <text x="602" y="283" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">RST (Reset)</text>

  <circle cx="590" cy="309" r="3.5" fill="#2457d6"/>
  <text x="602" y="313" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">GPIO0 (PROG)</text>

  <text x="602" y="339" font-size="12" fill="#6b7280" text-anchor="start">GPIO2 (High)</text>

  <circle cx="590" cy="369" r="3.5" fill="#2457d6"/>
  <text x="602" y="373" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">RXD (3.3V)</text>

  <circle cx="590" cy="399" r="3.5" fill="#27ae60"/>
  <text x="602" y="403" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">TXD (прямий)</text>

  <circle cx="590" cy="444" r="3.5" fill="#1a1a1a"/>
  <text x="602" y="448" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">GND (Земля)</text>
  <path d="M 590 444 L 568 444 L 568 506" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
  <circle cx="568" cy="506" r="3.5" fill="#1a1a1a"/>

  <!-- Right Panel: Assembly Guide -->
  <rect x="765" y="90" width="170" height="430" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="765" y="90" width="170" height="30" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="850" y="110" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Порядок складання</text>

  <text x="775" y="145" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">1. Живлення:</text>
  <text x="775" y="163" font-size="12" fill="#6b7280" text-anchor="start">5V USB -&gt; LDO 3.3V</text>

  <text x="775" y="205" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">2. Фільтрація:</text>
  <text x="775" y="223" font-size="12" fill="#6b7280" text-anchor="start">C1(10µF) + C2(100nF)</text>

  <text x="775" y="265" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">3. Підтяжки 10k:</text>
  <text x="775" y="283" font-size="12" fill="#6b7280" text-anchor="start">CH_PD, RST, GPIO0/2</text>

  <text x="775" y="325" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">4. Дільник RX:</text>
  <text x="775" y="343" font-size="12" fill="#6b7280" text-anchor="start">5V TX -&gt; R1/R2 -&gt; RXD</text>

  <text x="775" y="385" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">5. Режим прошивки:</text>
  <text x="775" y="403" font-size="12" fill="#1a1a1a" text-anchor="start">SW1(Flash) -&gt; GND</text>
  <text x="775" y="421" font-size="12" fill="#1a1a1a" text-anchor="start">Імпульс SW2(Reset)</text>
</svg>
