<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Definitions for Markers -->
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема підключення ESP-01 для прошивання через USB-UART</text>
  <text x="480" y="52" text-anchor="middle" font-size="12" fill="#6b7280">Узгодження логічних рівнів 5В/3.3В, фіксація режимів завантаження та фільтрація живлення</text>

  <!-- Left Panel: USB-UART Adapter -->
  <rect x="40" y="75" width="170" height="390" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <path d="M 40,110 L 40,83 A 8,8 0 0 1 48,75 L 202,75 A 8,8 0 0 1 210,83 L 210,110 Z" fill="#2457d6"/>
  <text x="125" y="97" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">USB-UART Адаптер</text>

  <!-- Left Panel Pin Labels -->
  <text x="195" y="137" text-anchor="end" font-size="12" fill="#1a1a1a">5V VCC</text>
  <text x="195" y="333" text-anchor="end" font-size="12" fill="#1a1a1a">TXD (Out 5V)</text>
  <text x="195" y="403" text-anchor="end" font-size="12" fill="#1a1a1a">RXD (In 3.3V)</text>
  <text x="195" y="452" text-anchor="end" font-size="12" fill="#1a1a1a">GND</text>

  <!-- Right Panel: ESP-01 Module -->
  <rect x="750" y="75" width="170" height="390" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <path d="M 750,110 L 750,83 A 8,8 0 0 1 758,75 L 912,75 A 8,8 0 0 1 920,83 L 920,110 Z" fill="#27ae60"/>
  <text x="835" y="97" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Модуль ESP-01</text>

  <!-- Right Panel Pin Labels -->
  <text x="765" y="137" text-anchor="start" font-size="12" fill="#1a1a1a">VCC (3.3V)</text>
  <text x="765" y="175" text-anchor="start" font-size="12" fill="#1a1a1a">CH_PD (EN)</text>
  <text x="765" y="235" text-anchor="start" font-size="12" fill="#1a1a1a">RST</text>
  <text x="765" y="295" text-anchor="start" font-size="12" fill="#1a1a1a">GPIO0</text>
  <text x="765" y="335" text-anchor="start" font-size="12" fill="#1a1a1a">RXD</text>
  <text x="765" y="405" text-anchor="start" font-size="12" fill="#1a1a1a">TXD</text>
  <text x="765" y="452" text-anchor="start" font-size="12" fill="#1a1a1a">GND</text>

  <!-- POWER SUPPLY CIRCUIT -->

  <!-- 5V Wire from USB-UART to LDO -->
  <line x1="210" y1="130" x2="310" y2="130" stroke="#c0392b" stroke-width="2"/>

  <!-- C1 Label ABOVE 5V Rail -->
  <text x="250" y="115" text-anchor="middle" font-size="11" fill="#6b7280">C1: 10 µF</text>

  <!-- C1 Branch (10uF) at x=250 -->
  <circle cx="250" cy="130" r="4" fill="#c0392b"/>
  <line x1="250" y1="130" x2="250" y2="150" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="238" y1="150" x2="262" y2="150" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="238" y1="156" x2="262" y2="156" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="250" y1="156" x2="250" y2="170" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="250" y1="170" x2="430" y2="170" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- LDO AMS1117-3.3 Block -->
  <rect x="310" y="105" width="90" height="50" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="355" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">AMS1117</text>
  <text x="355" y="142" text-anchor="middle" font-size="11" fill="#6b7280">5V → 3.3V</text>
  <line x1="355" y1="155" x2="355" y2="170" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- 3.3V Power Rail from LDO output to ESP-01 VCC -->
  <line x1="400" y1="130" x2="750" y2="130" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="430" cy="130" r="4" fill="#2457d6"/>
  <circle cx="510" cy="130" r="4" fill="#2457d6"/>
  <circle cx="620" cy="130" r="4" fill="#2457d6"/>
  <circle cx="705" cy="130" r="4" fill="#2457d6"/>

  <!-- C2 Branch & LDO GND Line at x=430 -->
  <line x1="430" y1="130" x2="430" y2="150" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="418" y1="150" x2="442" y2="150" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="418" y1="156" x2="442" y2="156" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="430" y1="156" x2="430" y2="460" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="430" cy="170" r="4" fill="#1a1a1a"/>
  <circle cx="430" cy="460" r="4" fill="#1a1a1a"/>

  <!-- C2 Label -->
  <text x="445" y="148" text-anchor="start" font-size="11" fill="#6b7280">C2: 100 µF</text>
  <text x="445" y="162" text-anchor="start" font-size="11" fill="#6b7280">+ 0.1 µF</text>

  <!-- PULL-UP & CONTROL LINES -->

  <!-- CH_PD (EN) Line & R3 (x=705, y=180) -->
  <line x1="750" y1="180" x2="705" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="705" y1="130" x2="705" y2="138" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="699" y="138" width="12" height="30" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="705" y1="168" x2="705" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="705" cy="180" r="4" fill="#1a1a1a"/>
  <text x="691" y="156" text-anchor="end" font-size="11" fill="#1a1a1a">R3: 10 kΩ</text>

  <!-- RST Line & R4 / S1 (x=620, y=240) -->
  <line x1="750" y1="240" x2="620" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="620" y1="130" x2="620" y2="165" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="614" y="165" width="12" height="30" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="620" y1="195" x2="620" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="620" cy="240" r="4" fill="#1a1a1a"/>
  <text x="632" y="183" text-anchor="start" font-size="11" fill="#1a1a1a">R4: 10 kΩ</text>

  <!-- Push Button S1 (Reset to GND) -->
  <line x1="620" y1="240" x2="620" y2="265" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="620" cy="265" r="3" fill="#2457d6"/>
  <circle cx="620" cy="285" r="3" fill="#2457d6"/>
  <line x1="612" y1="261" x2="612" y2="289" stroke="#2457d6" stroke-width="2"/>
  <line x1="602" y1="275" x2="612" y2="275" stroke="#2457d6" stroke-width="2"/>
  <line x1="620" y1="285" x2="620" y2="460" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="620" cy="460" r="4" fill="#1a1a1a"/>
  <text x="632" y="278" text-anchor="start" font-size="11" font-weight="bold" fill="#2457d6">S1: Скид (RST)</text>

  <!-- GPIO0 Line & R5 / S2 (x=510, y=300) -->
  <line x1="750" y1="300" x2="510" y2="300" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="510" y1="130" x2="510" y2="200" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="504" y="200" width="12" height="30" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="510" y1="230" x2="510" y2="300" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="510" cy="300" r="4" fill="#1a1a1a"/>
  <text x="522" y="218" text-anchor="start" font-size="11" fill="#1a1a1a">R5: 10 kΩ</text>

  <!-- Push Button S2 (PROG to GND) -->
  <line x1="510" y1="300" x2="510" y2="325" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="510" cy="325" r="3" fill="#c0392b"/>
  <circle cx="510" cy="345" r="3" fill="#c0392b"/>
  <line x1="502" y1="321" x2="502" y2="349" stroke="#c0392b" stroke-width="2"/>
  <line x1="492" y1="335" x2="502" y2="335" stroke="#c0392b" stroke-width="2"/>
  <line x1="510" y1="345" x2="510" y2="460" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="510" cy="460" r="4" fill="#1a1a1a"/>
  <text x="522" y="338" text-anchor="start" font-size="11" font-weight="bold" fill="#c0392b">S2: PROG (GND)</text>

  <!-- UART LINES & VOLTAGE DIVIDER -->

  <!-- Adapter TXD (5V) line to R1 -->
  <line x1="210" y1="340" x2="265" y2="340" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Resistor R1 (1k) horizontally -->
  <rect x="265" y="334" width="40" height="12" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="285" y="326" text-anchor="middle" font-size="11" fill="#1a1a1a">R1: 1 kΩ</text>
  <line x1="305" y1="340" x2="360" y2="340" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Divider Node (360, 340) to ESP-01 RXD -->
  <line x1="360" y1="340" x2="750" y2="340" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <circle cx="360" cy="340" r="4" fill="#2457d6"/>

  <!-- Resistor R2 (2k) vertically from Node (360,340) to GND -->
  <line x1="360" y1="340" x2="360" y2="375" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="354" y="375" width="12" height="30" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="360" y1="405" x2="360" y2="460" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="360" cy="460" r="4" fill="#1a1a1a"/>
  <text x="372" y="393" text-anchor="start" font-size="11" fill="#1a1a1a">R2: 2 kΩ</text>

  <!-- Voltage Divider Badge Box -->
  <rect x="235" y="365" width="110" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="290" y="382" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Дільник 5V→3.3V</text>
  <text x="290" y="398" text-anchor="middle" font-size="11" fill="#6b7280">U_out = 3.33В</text>

  <!-- ESP-01 TXD (3.3V) Direct Line to Adapter RXD -->
  <line x1="750" y1="410" x2="210" y2="410" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="480" y="402" text-anchor="middle" font-size="11" fill="#27ae60">Пряма лінія TXD → RXD (3.3V)</text>

  <!-- MAIN GND BUS -->
  <line x1="210" y1="460" x2="750" y2="460" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="210" cy="460" r="4" fill="#1a1a1a"/>
  <circle cx="750" cy="460" r="4" fill="#1a1a1a"/>

  <!-- LEGEND / FOOTER PANEL -->
  <rect x="40" y="485" width="880" height="38" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="508" text-anchor="middle" font-size="12" fill="#1a1a1a">Bootloader (прошивання): S2 затиснута (GPIO0 = GND) + імпульс S1 (Reset) | Робочий режим: S2 відпущена (GPIO0 = 3.3V)</text>
</svg>
