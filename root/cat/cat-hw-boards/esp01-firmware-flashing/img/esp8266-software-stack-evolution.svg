<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="470" fill="white"/>

  <!-- Header -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Еволюція стеків програмного забезпечення ESP8266</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Шлях від простецького бездротового модему до нативного виконання коду C++ у мікроконтролері</text>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Flow Arrows between Cards -->
  <path d="M 237,200 L 257,200" stroke="#2457d6" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <path d="M 467,200 L 487,200" stroke="#2457d6" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <path d="M 697,200 L 717,200" stroke="#2457d6" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <!-- CARD 1: AT-firmware (2014) -->
  <rect x="30" y="75" width="205" height="265" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="132" y="98" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">1. AT-прошивка</text>
  <text x="132" y="115" font-size="11" fill="#6b7280" text-anchor="middle">(2014 · Espressif SDK)</text>

  <!-- Stack Box 1 -->
  <rect x="42" y="128" width="181" height="112" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <rect x="48" y="134" width="169" height="30" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="132" y="153" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">AT-команди UART</text>
  <rect x="48" y="169" width="169" height="30" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="132" y="188" font-size="10" fill="#1a1a1a" text-anchor="middle">Espressif Non-OS SDK</text>
  <rect x="48" y="204" width="169" height="30" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="132" y="223" font-size="10" fill="#6b7280" text-anchor="middle">ESP8266 як модем</text>

  <!-- Features 1 -->
  <text x="44" y="260" font-size="11" fill="#1a1a1a">• Зовнішнє керування</text>
  <text x="44" y="280" font-size="11" fill="#1a1a1a">• Потрібен додатковий МК</text>
  <text x="44" y="300" font-size="11" fill="#c0392b">• Обмежена швидкість</text>
  <text x="44" y="324" font-size="10" font-weight="bold" fill="#c0392b">Режим: Модем</text>

  <!-- CARD 2: NodeMCU Lua (2014-2015) -->
  <rect x="260" y="75" width="205" height="265" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="362" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. NodeMCU (Lua)</text>
  <text x="362" y="115" font-size="11" fill="#6b7280" text-anchor="middle">(2014–2015 · eLua Engine)</text>

  <!-- Stack Box 2 -->
  <rect x="272" y="128" width="181" height="112" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="278" y="134" width="169" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="362" y="153" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Скрипти мовою Lua</text>
  <rect x="278" y="169" width="169" height="30" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="362" y="188" font-size="10" fill="#1a1a1a" text-anchor="middle">Інтерпретатор Lua</text>
  <rect x="278" y="204" width="169" height="30" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="362" y="223" font-size="10" fill="#6b7280" text-anchor="middle">Espressif SDK / RTOS</text>

  <!-- Features 2 -->
  <text x="274" y="260" font-size="11" fill="#1a1a1a">• Скриптове керування</text>
  <text x="274" y="280" font-size="11" fill="#1a1a1a">• Подієва архітектура</text>
  <text x="274" y="300" font-size="11" fill="#1a1a1a">• Без компіляції коду</text>
  <text x="274" y="324" font-size="10" font-weight="bold" fill="#2457d6">Режим: Інтерпретатор</text>

  <!-- CARD 3: MicroPython (2015-2016) -->
  <rect x="490" y="75" width="205" height="265" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="592" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3. MicroPython</text>
  <text x="592" y="115" font-size="11" fill="#6b7280" text-anchor="middle">(2015–2016 · Python 3)</text>

  <!-- Stack Box 3 -->
  <rect x="502" y="128" width="181" height="112" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="508" y="134" width="169" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="592" y="153" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Код Python 3</text>
  <rect x="508" y="169" width="169" height="30" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="592" y="188" font-size="10" fill="#1a1a1a" text-anchor="middle">Віртуальна машина REPL</text>
  <rect x="508" y="204" width="169" height="30" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="592" y="223" font-size="10" fill="#6b7280" text-anchor="middle">MicroPython Core / HAL</text>

  <!-- Features 3 -->
  <text x="504" y="260" font-size="11" fill="#1a1a1a">• Інтерактивна консоль</text>
  <text x="504" y="280" font-size="11" fill="#1a1a1a">• Багата бібліотека</text>
  <text x="504" y="300" font-size="11" fill="#6b7280">• Накладні витрати RAM</text>
  <text x="504" y="324" font-size="10" font-weight="bold" fill="#2457d6">Режим: VM / REPL</text>

  <!-- CARD 4: Arduino Core (2015+) -->
  <rect x="720" y="75" width="210" height="265" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="825" y="98" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">4. Arduino Core</text>
  <text x="825" y="115" font-size="11" fill="#6b7280" text-anchor="middle">(2015+ · C/C++ Native)</text>

  <!-- Stack Box 4 -->
  <rect x="732" y="128" width="186" height="112" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <rect x="738" y="134" width="174" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="825" y="153" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Нативний C++ код</text>
  <rect x="738" y="169" width="174" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="825" y="188" font-size="10" fill="#1a1a1a" text-anchor="middle">GCC (xtensa-lx106-elf)</text>
  <rect x="738" y="204" width="174" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="825" y="223" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">Машинний код SoC</text>

  <!-- Features 4 -->
  <text x="734" y="260" font-size="11" fill="#1a1a1a">• Повний доступ до SoC</text>
  <text x="734" y="280" font-size="11" font-weight="bold" fill="#27ae60">• Найвища швидкість</text>
  <text x="734" y="300" font-size="11" font-weight="bold" fill="#27ae60">• Мінімум витрат RAM</text>
  <text x="734" y="324" font-size="10" font-weight="bold" fill="#27ae60">Режим: Нативний МК</text>

  <!-- BOTTOM COMPARISON PANEL -->
  <rect x="30" y="360" width="900" height="95" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="382" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Архітектурна еволюція: від Wi-Fi модему до автономного мікроконтролера</text>
  <text x="480" y="405" font-size="12" fill="#1a1a1a" text-anchor="middle">ESP8266 перетворився із зовнішнього копроцесора AT-команд на самостійну 32-бітну обчислювальну платформу Tensilica Xtensa L106.</text>
  <text x="480" y="427" font-size="11" fill="#6b7280" text-anchor="middle">Завдяки Arduino Core компіляція C++ виконується нативно без витрат ресурсів на інтерпретатори чи проміжні протоколи.</text>

</svg>
