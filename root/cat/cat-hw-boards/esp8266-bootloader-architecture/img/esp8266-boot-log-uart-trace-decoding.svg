<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="510" fill="white"/>

  <!-- Header Titles -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Декодування системного логу завантаження ESP8266 (74880 бод)</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Структура рядка ets_main.c: rst cause вказує на джерело скидання, boot mode — на strapping pins</text>

  <!-- MAIN TERMINAL WINDOW -->
  <rect x="30" y="75" width="900" height="180" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="30" y="75" width="900" height="30" rx="8" fill="#d0d7de"/>
  <text x="45" y="95" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">Лог первинного ROM-завантажувача (ets_main.c @ 74880 baud)</text>

  <!-- Terminal Output Lines (Left Side) -->
  <text x="50" y="128" font-size="13" fill="#1a1a1a" font-family="Consolas, Courier New, monospace">ets Jan  8 2013, rst cause:2, boot mode:(3,6)</text>
  <text x="50" y="154" font-size="13" fill="#1a1a1a" font-family="Consolas, Courier New, monospace">load 0x40100000, len 24080, room 16</text>
  <text x="50" y="180" font-size="13" fill="#1a1a1a" font-family="Consolas, Courier New, monospace">tail 0, chksum 0x4e</text>
  <text x="50" y="206" font-size="13" fill="#1a1a1a" font-family="Consolas, Courier New, monospace">csum 0x4e, boot mode:(3,6)</text>
  <text x="50" y="232" font-size="13" font-weight="bold" fill="#27ae60" font-family="Consolas, Courier New, monospace">ready</text>

  <!-- Field Explanation Badges inside Terminal Window (Right Side) -->
  <rect x="475" y="112" width="440" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="487" y="132" font-size="12" font-weight="bold" fill="#2457d6">[1] rst cause:2</text>
  <text x="590" y="132" font-size="12" fill="#1a1a1a">→ Причина скидання (External Reset / RST)</text>

  <rect x="475" y="155" width="440" height="32" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="487" y="175" font-size="12" font-weight="bold" fill="#27ae60">[2] boot mode:(3,6)</text>
  <text x="625" y="175" font-size="12" fill="#1a1a1a">→ Flash Boot (GPIO15=0, GPIO0=1, GPIO2=1)</text>

  <rect x="475" y="198" width="440" height="32" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="487" y="218" font-size="12" font-weight="bold" fill="#c0392b">[3] chksum 0x4e</text>
  <text x="600" y="218" font-size="12" fill="#1a1a1a">→ Контрольна сума коду в SPI Flash (XOR)</text>

  <!-- Vertical Connectors between Terminal and Analytical Cards -->
  <line x1="172.5" y1="255" x2="172.5" y2="280" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="479.5" y1="255" x2="479.5" y2="280" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="787.5" y1="255" x2="787.5" y2="280" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- CARD 1: RST CAUSE -->
  <rect x="30" y="280" width="285" height="205" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="30" y="280" width="285" height="30" rx="6" fill="#2457d6"/>
  <text x="172.5" y="300" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">rst cause: Джерело скидання</text>

  <text x="42" y="328" font-size="12" fill="#1a1a1a">• 0: Power-on reset (живлення)</text>
  <text x="42" y="350" font-size="12" fill="#1a1a1a">• 1: Hardware WDT (апаратний WDT)</text>
  <text x="42" y="372" font-size="12" fill="#2457d6" font-weight="bold">• 2: External Reset (пін RST)</text>
  <text x="42" y="394" font-size="12" fill="#c0392b" font-weight="bold">• 3: Software WDT (програмний WDT)</text>
  <text x="42" y="416" font-size="12" fill="#1a1a1a">• 4: Software restart (програмний)</text>
  <text x="42" y="438" font-size="12" fill="#27ae60">• 5: Deep-sleep wake-up (сон)</text>
  <text x="42" y="460" font-size="12" fill="#6b7280">• 6: External reset (зовнішнє)</text>

  <!-- CARD 2: BOOT MODE -->
  <rect x="337" y="280" width="285" height="205" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="337" y="280" width="285" height="30" rx="6" fill="#27ae60"/>
  <text x="479.5" y="300" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">boot mode:(x,y) Strapping pins</text>

  <text x="349" y="328" font-size="12" font-weight="bold" fill="#1a1a1a">• x: бітова маска (GPIO15, 0, 2)</text>
  <text x="349" y="350" font-size="12" fill="#27ae60" font-weight="bold">• (0,1,1) = 3: Flash Boot (штатно)</text>
  <text x="349" y="372" font-size="12" fill="#2457d6">• (0,0,1) = 1: UART Download</text>
  <text x="349" y="394" font-size="12" fill="#c0392b">• (1,x,x) = 5..7: SDIO Boot</text>
  <text x="349" y="416" font-size="12" font-weight="bold" fill="#1a1a1a">• y: опції живлення флешпам'яті</text>
  <text x="349" y="438" font-size="12" fill="#6b7280">• y=6: 3.3V Flash / SPI 40 MHz</text>
  <text x="349" y="460" font-size="12" fill="#6b7280">• y=7: 3.3V Flash / SPI 80 MHz</text>

  <!-- CARD 3: SEGMENT & CHECKSUM -->
  <rect x="645" y="280" width="285" height="205" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="645" y="280" width="285" height="30" rx="6" fill="#c0392b"/>
  <text x="787.5" y="300" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Сегменти та контрольна сума</text>

  <text x="657" y="328" font-size="12" fill="#1a1a1a">• load 0x40100000: адреса в IRAM</text>
  <text x="657" y="350" font-size="12" fill="#1a1a1a">• len 24080: довжина сегмента</text>
  <text x="657" y="372" font-size="12" fill="#1a1a1a">• room 16: буфер вирівнювання</text>
  <text x="657" y="394" font-size="12" fill="#27ae60">• chksum: XOR контрольна сума</text>
  <text x="657" y="420" font-size="12" font-weight="bold" fill="#c0392b">• csum err: помилка цілісності</text>
  <text x="657" y="440" font-size="12" fill="#c0392b">  - пошкодження образу Flash</text>
  <text x="657" y="460" font-size="12" fill="#c0392b">  - невідповідність частоти SPI</text>
</svg>
