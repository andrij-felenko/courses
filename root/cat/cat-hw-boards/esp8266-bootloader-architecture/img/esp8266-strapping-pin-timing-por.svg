<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Стробування виводів GPIO0, GPIO2, GPIO15 під час Power-On Reset</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Фіксація станів strapping-виводів відбувається за зростаючим фронтом RST у вікні t_latch</text>

  <!-- Main Timing Panel -->
  <rect x="40" y="68" width="880" height="374" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>

  <!-- Markers in Defs -->
  <defs>
    <marker id="arr-left" markerWidth="9" markerHeight="9" refX="1" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M9,0 L0,4.5 L9,9 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-right" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Latch Window Highlight Rect -->
  <rect x="470" y="78" width="80" height="298" fill="#eaf0fd" opacity="0.65" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,3" rx="4"/>
  <text x="510" y="96" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вікно t_latch</text>

  <!-- Vertical Event Lines -->
  <!-- Power-On Start (x=220) -->
  <line x1="220" y1="78" x2="220" y2="376" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="220" y="422" font-size="12" fill="#6b7280" text-anchor="middle">Старт V_DD</text>

  <!-- V_DD Stable / 3.3V (x=360) -->
  <line x1="360" y1="78" x2="360" y2="376" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="360" y="422" font-size="12" fill="#6b7280" text-anchor="middle">V_DD стабільна</text>

  <!-- RST Strobe / Rising Edge (x=510) -->
  <line x1="510" y1="104" x2="510" y2="376" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="510" y="422" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Фронт RST (Строб)</text>

  <!-- Signal Row 1: V_DD -->
  <text x="180" y="110" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">V_DD (3.3V)</text>
  <line x1="190" y1="108" x2="620" y2="108" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="560" y="104" font-size="12" fill="#6b7280" text-anchor="start">V_th (2.475V)</text>
  <path d="M190,125 L220,125 L360,100 L620,100" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Signal Row 2: RST -->
  <text x="180" y="150" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">RST (Reset)</text>
  <path d="M190,155 L510,155 L522,135 L620,135" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Signal Row 3: GPIO15 -->
  <text x="180" y="195" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">GPIO15</text>
  <text x="180" y="210" font-size="12" fill="#6b7280" text-anchor="end">(Pull-Down)</text>
  <path d="M190,198 L620,198" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Signal Row 4: GPIO0 -->
  <text x="180" y="265" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">GPIO0</text>
  <text x="180" y="280" font-size="12" fill="#6b7280" text-anchor="end">(Pull-Up / Down)</text>
  <!-- HIGH for SPI Flash Boot -->
  <path d="M190,298 L220,298 L360,248 L620,248" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <!-- LOW for UART Download -->
  <path d="M190,298 L620,298" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Signal Row 5: GPIO2 -->
  <text x="180" y="345" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">GPIO2</text>
  <text x="180" y="360" font-size="12" fill="#6b7280" text-anchor="end">(Pull-Up)</text>
  <path d="M190,370 L220,370 L360,348 L620,348" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Right Side Container for Mode & Status Badges -->
  <rect x="635" y="78" width="270" height="304" fill="white" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="770" y="100" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вимоги до станів для завантаження</text>

  <!-- Badge 1: GPIO15 Status (y: 180..216) -->
  <rect x="645" y="180" width="250" height="36" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="770" y="195" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Обов'язково LOW (0)</text>
  <text x="770" y="209" font-size="12" fill="#27ae60" text-anchor="middle">Режим завантаження з SPI / UART</text>

  <!-- Badge 2: GPIO0 HIGH Flash Boot (y: 230..266, gap from Badge 1 = 14px) -->
  <rect x="645" y="230" width="250" height="36" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="770" y="245" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">HIGH (1) = SPI Flash Boot (Норма)</text>
  <text x="770" y="259" font-size="12" fill="#2457d6" text-anchor="middle">Робочий режим виконання коду</text>

  <!-- Badge 3: GPIO0 LOW UART Download (y: 280..316, gap from Badge 2 = 14px) -->
  <rect x="645" y="280" width="250" height="36" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="770" y="295" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">LOW (0) = UART Download Mode</text>
  <text x="770" y="309" font-size="12" fill="#6b7280" text-anchor="middle">Режим запису прошивки</text>

  <!-- Badge 4: GPIO2 Status (y: 330..366, gap from Badge 3 = 14px) -->
  <rect x="645" y="330" width="250" height="36" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="770" y="345" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Обов'язково HIGH (1)</text>
  <text x="770" y="359" font-size="12" fill="#27ae60" text-anchor="middle">Необхідно для запуску ROM</text>

  <!-- Dimension Arrow for t_POR -->
  <text x="365" y="386" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Затримка скидання t_POR (RC-коло)</text>
  <line x1="220" y1="392" x2="510" y2="392" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-left)" marker-end="url(#arr-right)"/>
</svg>
