<svg width="960" height="560" viewBox="0 0 960 560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="960" height="560" fill="white"/>
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
  </defs>
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема апаратного скидання та підтяжки виводів ESP8266</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Правильні номінали RC-кіл та рівнів Strapping-пинів гарантують надійний запуск із SPI Flash</text>
  <rect x="25" y="70" width="485" height="230" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="40" y="92" font-size="13" font-weight="bold" fill="#2457d6">1. RC-кола скидання (CHIP_PU / RST) та автопрограмувач</text>
  <line x1="60" y1="115" x2="280" y2="115" stroke="#c0392b" stroke-width="2"/>
  <text x="60" y="110" font-size="12" font-weight="bold" fill="#c0392b">+3.3V (VCC)</text>
