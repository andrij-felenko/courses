  <rect x="102" y="130" width="16" height="28" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="125" y="148" font-size="12" fill="#1a1a1a">R1: 10 кОм</text>
  <line x1="110" y1="158" x2="110" y2="180" stroke="#334155" stroke-width="1.5"/>
  <circle cx="110" cy="180" r="3" fill="#1a1a1a"/>
