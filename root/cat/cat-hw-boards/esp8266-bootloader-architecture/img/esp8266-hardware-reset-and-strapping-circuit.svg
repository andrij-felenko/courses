  <line x1="102" y1="201" x2="118" y2="201" stroke="#1a1a1a" stroke-width="2"/>
  <text x="125" y="202" font-size="12" fill="#1a1a1a">C1: 100 нФ</text>
  <line x1="110" y1="201" x2="110" y2="215" stroke="#334155" stroke-width="1.5"/>
  <line x1="100" y1="215" x2="120" y2="215" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="104" y1="219" x2="116" y2="219" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="108" y1="223" x2="112" y2="223" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="110" y1="180" x2="535" y2="180" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="250" y1="115" x2="250" y2="130" stroke="#334155" stroke-width="1.5"/>
  <rect x="242" y="130" width="16" height="28" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="265" y="148" font-size="12" fill="#1a1a1a">R_RST: 10 кОм</text>
  <line x1="250" y1="158" x2="250" y2="220" stroke="#334155" stroke-width="1.5"/>
  <circle cx="250" cy="220" r="3" fill="#1a1a1a"/>
  <line x1="250" y1="220" x2="250" y2="232" stroke="#334155" stroke-width="1.5"/>
  <line x1="242" y1="232" x2="258" y2="232" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="242" y1="238" x2="258" y2="238" stroke="#1a1a1a" stroke-width="2"/>
  <text x="265" y="239" font-size="12" fill="#1a1a1a">C_RST: 100 нФ</text>
  <line x1="250" y1="238" x2="250" y2="250" stroke="#334155" stroke-width="1.5"/>
  <line x1="240" y1="250" x2="260" y2="250" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="244" y1="254" x2="256" y2="254" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="248" y1="258" x2="252" y2="258" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="250" y1="220" x2="350" y2="220" stroke="#334155" stroke-width="1.5"/>
  <circle cx="350" cy="220" r="2.5" fill="#1a1a1a"/>
  <circle cx="380" cy="220" r="2.5" fill="#1a1a1a"/>
  <line x1="346" y1="212" x2="384" y2="212" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="365" y1="202" x2="365" y2="212" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="365" y="196" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">SW1 (RESET)</text>
  <line x1="380" y1="220" x2="380" y2="235" stroke="#334155" stroke-width="1.5"/>
  <line x1="372" y1="235" x2="388" y2="235" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="375" y1="239" x2="385" y2="239" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="378" y1="243" x2="382" y2="243" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="40" y="215" font-size="12" font-weight="bold" fill="#2457d6">Авто-RST (DTR/RTS)</text>
  <line x1="40" y1="220" x2="250" y2="220" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="250" y1="220" x2="535" y2="220" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="40" y="265" width="455" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="267" y="281" font-size="12" fill="#2457d6" text-anchor="middle">RC-ланцюг затримує зростання напруги на ~1 мс для стабілізації VCC</text>
  <rect x="25" y="312" width="485" height="230" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="40" y="333" font-size="13" font-weight="bold" fill="#1a1a1a">2. Конфігураційні виводи завантажувача (Strapping Pins)</text>
  <line x1="110" y1="330" x2="110" y2="346" stroke="#334155" stroke-width="1.5"/>
  <text x="110" y="327" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+3.3V</text>
  <rect x="102" y="346" width="16" height="28" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="125" y="364" font-size="12" fill="#1a1a1a">R2: 10 кОм</text>
  <line x1="110" y1="374" x2="110" y2="390" stroke="#334155" stroke-width="1.5"/>
  <circle cx="110" cy="390" r="3" fill="#1a1a1a"/>
  <line x1="40" y1="390" x2="535" y2="390" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="40" y="382" font-size="12" font-weight="bold" fill="#2457d6">DTR (Auto-Flash)</text>
  <circle cx="215" cy="390" r="3" fill="#1a1a1a"/>
  <line x1="215" y1="390" x2="255" y2="390" stroke="#334155" stroke-width="1.5"/>
  <circle cx="255" cy="390" r="2.5" fill="#1a1a1a"/>
  <circle cx="285" cy="390" r="2.5" fill="#1a1a1a"/>
  <line x1="251" y1="382" x2="289" y2="382" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="270" y1="372" x2="270" y2="382" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="270" y="366" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">SW2 (FLASH)</text>
  <line x1="285" y1="390" x2="285" y2="402" stroke="#334155" stroke-width="1.5"/>
  <line x1="277" y1="402" x2="293" y2="402" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="280" y1="406" x2="290" y2="406" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="283" y1="410" x2="287" y2="410" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="325" y="354" width="175" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="412" y="370" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">HIGH: Flash / LOW: UART</text>
  <line x1="110" y1="415" x2="110" y2="431" stroke="#334155" stroke-width="1.5"/>
  <text x="110" y="412" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+3.3V</text>
  <rect x="102" y="431" width="16" height="28" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="125" y="449" font-size="12" fill="#1a1a1a">R3: 10 кОм</text>
  <line x1="110" y1="459" x2="110" y2="465" stroke="#334155" stroke-width="1.5"/>
  <circle cx="110" cy="465" r="3" fill="#1a1a1a"/>
  <line x1="110" y1="465" x2="535" y2="465" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="325" y="432" width="175" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="412" y="448" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Обов&#39;язково HIGH (&gt;2.7V)</text>
  <circle cx="110" cy="515" r="3" fill="#1a1a1a"/>
  <line x1="110" y1="515" x2="110" y2="523" stroke="#334155" stroke-width="1.5"/>
  <rect x="102" y="523" width="16" height="14" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="125" y="534" font-size="12" fill="#1a1a1a">R4: 10 кОм (Pull-down)</text>
  <line x1="110" y1="515" x2="535" y2="515" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="325" y="482" width="175" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="412" y="498" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Обов&#39;язково LOW (&lt;0.8V)</text>
  <rect x="535" y="70" width="400" height="472" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="535" y="70" width="400" height="40" rx="8" fill="#1a1a1a"/>
  <text x="735" y="95" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Модуль ESP8266 (ESP-12F / SoC)</text>
  <text x="525" y="176" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">CHIP_PU (EN)</text>
  <text x="525" y="216" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">EXT_RSTB (RST)</text>
  <text x="525" y="386" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">GPIO0</text>
  <text x="525" y="461" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">GPIO2</text>
  <text x="525" y="511" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">GPIO15</text>
  <rect x="535" y="172" width="10" height="16" fill="#2457d6"/>
  <rect x="535" y="212" width="10" height="16" fill="#2457d6"/>
  <rect x="535" y="382" width="10" height="16" fill="#2457d6"/>
  <rect x="535" y="457" width="10" height="16" fill="#2457d6"/>
  <rect x="535" y="507" width="10" height="16" fill="#2457d6"/>
  <text x="735" y="125" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Таблиця режимів завантаження ROM</text>
  <rect x="550" y="138" width="372" height="62" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="575" y="162" font-size="12" font-weight="bold" fill="#27ae60">GPIO15: 0</text>
  <text x="645" y="162" font-size="12" font-weight="bold" fill="#27ae60">GPIO0: 1</text>
  <text x="710" y="162" font-size="12" font-weight="bold" fill="#27ae60">GPIO2: 1</text>
  <text x="775" y="162" font-size="12" font-weight="bold" fill="#27ae60">SPI Flash Boot [ОК]</text>
  <text x="565" y="187" font-size="12" fill="#1a1a1a">Стандартний робочий режим запуску прошивки</text>
  <rect x="550" y="206" width="372" height="62" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="575" y="230" font-size="12" font-weight="bold" fill="#2457d6">GPIO15: 0</text>
  <text x="645" y="230" font-size="12" font-weight="bold" fill="#2457d6">GPIO0: 0</text>
  <text x="710" y="230" font-size="12" font-weight="bold" fill="#2457d6">GPIO2: 1</text>
  <text x="775" y="230" font-size="12" font-weight="bold" fill="#2457d6">UART Boot [Флеш]</text>
  <text x="565" y="255" font-size="12" fill="#1a1a1a">Очікування завантаження бінарника з UART0</text>
  <rect x="550" y="274" width="372" height="62" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="575" y="298" font-size="12" font-weight="bold" fill="#c0392b">GPIO15: 1</text>
  <text x="645" y="298" font-size="12" font-weight="bold" fill="#c0392b">GPIO0: X</text>
  <text x="710" y="298" font-size="12" font-weight="bold" fill="#c0392b">GPIO2: X</text>
  <text x="775" y="298" font-size="12" font-weight="bold" fill="#c0392b">SDIO Boot [Помилка!]</text>
  <text x="565" y="323" font-size="12" fill="#c0392b">Зависання SoC через підтяжку GPIO15 до VCC</text>
  <rect x="550" y="345" width="372" height="183" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="565" y="365" font-size="12" font-weight="bold" fill="#1a1a1a">Первинна діагностика ROM (UART 74880 бод):</text>
  <text x="565" y="387" font-size="12" fill="#6b7280">• Сигнатура логу при старті:</text>
  <text x="580" y="407" font-size="12" font-family="Courier New, monospace" font-weight="bold" fill="#2457d6">ets Jan  8 2013, rst cause:1, boot mode:(3,7)</text>
  <text x="565" y="429" font-size="12" fill="#6b7280">• Значення поля boot mode:(m, n):</text>
  <text x="580" y="449" font-size="12" fill="#1a1a1a">m = біти b2 b1 b0 (GPIO15, GPIO0, GPIO2)</text>
  <text x="580" y="469" font-size="12" font-weight="bold" fill="#27ae60">mode (3,7) -&gt; bin 011 -&gt; SPI Flash Boot [ОК]</text>
  <text x="580" y="489" font-size="12" font-weight="bold" fill="#2457d6">mode (1,7) -&gt; bin 001 -&gt; UART Download [ОК]</text>
  <text x="580" y="509" font-size="12" font-weight="bold" fill="#c0392b">mode (7,7) -&gt; bin 111 -&gt; SDIO Boot [ПОМИЛКА]</text>
</svg>
