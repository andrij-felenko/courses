<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="540" fill="white"/>
  
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Послідовність етапів завантаження ESP8266</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Від опитування страпінг-виводів у ROM Bootloader до копіювання коду в IRAM та мапування IROM</text>

  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Stage 1 -->
  <g>
    <rect x="30" y="80" width="205" height="420" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="30" y="80" width="205" height="42" rx="8" ry="8" fill="#2457d6"/>
    <rect x="30" y="110" width="205" height="12" fill="#2457d6"/>
    <text x="132" y="106" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1. Апаратний скид</text>

    <rect x="40" y="135" width="185" height="70" rx="4" fill="#ffffff" stroke="#d0d7de"/>
    <text x="50" y="157" font-size="12" font-weight="bold" fill="#1a1a1a">Сигнали старту:</text>
    <text x="50" y="177" font-size="12" fill="#6b7280">• VDD33 = 3.3 В</text>
    <text x="50" y="193" font-size="12" fill="#6b7280">• CH_PD = High, RST = High</text>

    <rect x="40" y="218" width="185" height="85" rx="4" fill="#ffffff" stroke="#d0d7de"/>
    <text x="50" y="240" font-size="12" font-weight="bold" fill="#1a1a1a">Старт ROM Code:</text>
    <text x="50" y="260" font-size="12" fill="#6b7280">• Ініціалізація UART0</text>
    <text x="50" y="276" font-size="12" fill="#6b7280">• Вивід логу (74880 бод)</text>
    <text x="50" y="292" font-size="12" fill="#6b7280">• Читання rst cause</text>

    <rect x="40" y="315" width="185" height="170" rx="4" fill="#ffffff" stroke="#d0d7de"/>
    <text x="50" y="337" font-size="12" font-weight="bold" fill="#1a1a1a">Коди rst cause:</text>
    <text x="50" y="357" font-size="12" fill="#1a1a1a">1: POR <tspan fill="#6b7280">(Power-On Reset)</tspan></text>
    <text x="50" y="375" font-size="12" fill="#1a1a1a">2: RST <tspan fill="#6b7280">(Зняття скидання)</tspan></text>
    <text x="50" y="393" font-size="12" fill="#1a1a1a">4: WDT <tspan fill="#6b7280">(Hardware WDT)</tspan></text>
    <text x="50" y="411" font-size="12" fill="#1a1a1a">5: Soft WDT <tspan fill="#6b7280">(Програмний)</tspan></text>
    <text x="50" y="429" font-size="12" fill="#1a1a1a">6: Deep-sleep <tspan fill="#6b7280">(Сон)</tspan></text>
    <text x="50" y="447" font-size="12" fill="#1a1a1a">7: Brownout <tspan fill="#6b7280">(Просідання)</tspan></text>
  </g>

  <!-- Stage 2 -->
  <g>
    <rect x="265" y="80" width="225" height="420" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="265" y="80" width="225" height="42" rx="8" ry="8" fill="#2457d6"/>
    <rect x="265" y="110" width="225" height="12" fill="#2457d6"/>
    <text x="377" y="106" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2. Опитування страпінгу</text>

    <rect x="275" y="135" width="205" height="65" rx="4" fill="#ffffff" stroke="#d0d7de"/>
    <text x="285" y="157" font-size="12" font-weight="bold" fill="#1a1a1a">Защепкування виводів:</text>
    <text x="285" y="177" font-size="12" fill="#6b7280">• Замір при зростанні RST</text>
    <text x="285" y="193" font-size="12" fill="#6b7280">• Виводи: GPIO15, GPIO0, GPIO2</text>

    <rect x="275" y="210" width="205" height="85" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
    <text x="285" y="230" font-size="12" font-weight="bold" fill="#27ae60">boot mode:(3, x) — SPI Flash</text>
    <text x="285" y="250" font-size="12" fill="#1a1a1a">• GPIO15 = Low (0)</text>
    <text x="285" y="266" font-size="12" fill="#1a1a1a">• GPIO0  = High (1)</text>
    <text x="285" y="282" font-size="12" fill="#1a1a1a">• GPIO2  = High (1)</text>

    <rect x="275" y="305" width="205" height="85" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="285" y="325" font-size="12" font-weight="bold" fill="#2457d6">boot mode:(1, x) — UART Flash</text>
    <text x="285" y="345" font-size="12" fill="#1a1a1a">• GPIO15 = Low (0)</text>
    <text x="285" y="361" font-size="12" fill="#1a1a1a">• GPIO0  = Low (0)</text>
    <text x="285" y="377" font-size="12" fill="#1a1a1a">• GPIO2  = High (1)</text>

    <rect x="275" y="400" width="205" height="85" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="285" y="420" font-size="12" font-weight="bold" fill="#c0392b">boot mode:(7, x) — Помилка</text>
    <text x="285" y="440" font-size="12" fill="#1a1a1a">• GPIO15 = High (1) [помилка]</text>
    <text x="285" y="456" font-size="12" fill="#1a1a1a">• Перехід в режим SDIO</text>
    <text x="285" y="472" font-size="12" fill="#c0392b">• Старт блокується!</text>
  </g>

  <!-- Stage 3 -->
  <g>
    <rect x="520" y="80" width="210" height="420" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="520" y="80" width="210" height="42" rx="8" ry="8" fill="#2457d6"/>
    <rect x="520" y="110" width="210" height="12" fill="#2457d6"/>
    <text x="625" y="106" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3. 2nd Stage / IRAM</text>

    <rect x="530" y="135" width="190" height="65" rx="4" fill="#ffffff" stroke="#d0d7de"/>
    <text x="540" y="157" font-size="12" font-weight="bold" fill="#1a1a1a">Читання SPI Flash:</text>
    <text x="540" y="177" font-size="12" fill="#6b7280">• Читання заголовка</text>
    <text x="540" y="193" font-size="12" fill="#6b7280">• Валідація MD5 / XOR</text>

    <rect x="530" y="210" width="190" height="115" rx="4" fill="#ffffff" stroke="#d0d7de"/>
    <text x="540" y="230" font-size="12" font-weight="bold" fill="#1a1a1a">Завантаження IRAM:</text>
    <text x="540" y="250" font-size="12" fill="#2457d6">• База: 0x40100000</text>
    <text x="540" y="268" font-size="12" fill="#1a1a1a">• Секція .text (код)</text>
    <text x="540" y="286" font-size="12" fill="#6b7280">• Вектори переривань</text>
    <text x="540" y="304" font-size="12" fill="#6b7280">• Обсяг: до 32 КБ</text>

    <rect x="530" y="335" width="190" height="115" rx="4" fill="#ffffff" stroke="#d0d7de"/>
    <text x="540" y="355" font-size="12" font-weight="bold" fill="#1a1a1a">Завантаження DRAM:</text>
    <text x="540" y="375" font-size="12" fill="#2457d6">• База: 0x3FFE8000</text>
    <text x="540" y="393" font-size="12" fill="#1a1a1a">• Секції .data / .bss</text>
    <text x="540" y="411" font-size="12" fill="#6b7280">• Глобальні змінні</text>
    <text x="540" y="429" font-size="12" fill="#6b7280">• Стеки та купа DRAM</text>

    <text x="540" y="475" font-size="12" fill="#27ae60" font-weight="bold">✓ Пам'ять RAM готова</text>
  </g>

  <!-- Stage 4 -->
  <g>
    <rect x="760" y="80" width="170" height="420" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="760" y="80" width="170" height="42" rx="8" ry="8" fill="#2457d6"/>
    <rect x="760" y="110" width="170" height="12" fill="#2457d6"/>
    <text x="845" y="106" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">4. Виконання коду</text>

    <rect x="770" y="135" width="150" height="85" rx="4" fill="#ffffff" stroke="#d0d7de"/>
    <text x="780" y="157" font-size="12" font-weight="bold" fill="#1a1a1a">Перехід (Entry):</text>
    <text x="780" y="177" font-size="12" fill="#2457d6">• call_user_start()</text>
    <text x="780" y="195" font-size="12" fill="#1a1a1a">• Старт SDK</text>
    <text x="780" y="211" font-size="12" fill="#6b7280">• user_init()</text>

    <rect x="770" y="230" width="150" height="110" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="780" y="250" font-size="12" font-weight="bold" fill="#2457d6">Кеш IROM0:</text>
    <text x="780" y="270" font-size="12" fill="#1a1a1a">• 0x40200000</text>
    <text x="780" y="288" font-size="12" fill="#1a1a1a">• .irom0.text</text>
    <text x="780" y="306" font-size="12" fill="#6b7280">• Мапування з Flash</text>
    <text x="780" y="324" font-size="12" fill="#6b7280">  через MMU</text>

    <rect x="770" y="350" width="150" height="135" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
    <text x="780" y="372" font-size="12" font-weight="bold" fill="#27ae60">Програма користувача:</text>
    <text x="780" y="394" font-size="12" fill="#1a1a1a">• Arduino loop() /</text>
    <text x="780" y="412" font-size="12" fill="#1a1a1a">  FreeRTOS tasks</text>
    <text x="780" y="430" font-size="12" fill="#6b7280">• Стеки Wi-Fi/IP</text>
    <text x="780" y="460" font-size="12" fill="#27ae60" font-weight="bold">✓ Успішний старт</text>
  </g>

  <!-- Connectors -->
  <path d="M 235 252 L 265 252" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <path d="M 480 252 L 520 252" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <path d="M 730 252 L 760 252" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
</svg>
