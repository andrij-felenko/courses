<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Алгоритм вибору слота та верифікації прошивки в eBoot FOTA</text>
  <text x="480" y="48" text-anchor="middle" font-size="13" fill="#6b7280">Послідовність перевірки заголовка, верифікації контрольних сум та відкочування (fallback) на резервний банк</text>

  <!-- Top Flow: Step 1 -->
  <rect x="30" y="85" width="190" height="120" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="125" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">1. Старт ROM Boot</text>
  <text x="125" y="130" text-anchor="middle" font-size="12" fill="#1a1a1a">Опитування GPIO0/2/15</text>
  <text x="125" y="150" text-anchor="middle" font-size="12" fill="#1a1a1a">Зчитування eboot_config</text>
  <text x="125" y="172" text-anchor="middle" font-size="12" fill="#6b7280">Визначення активного слота</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="220" y1="145" x2="255" y2="145" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Top Flow: Step 2 -->
  <rect x="255" y="85" width="210" height="120" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="360" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">2. Перевірка заголовка</text>
  <text x="360" y="130" text-anchor="middle" font-size="12" fill="#1a1a1a">Пошук Magic Byte (0xE9/0xEA)</text>
  <text x="360" y="150" text-anchor="middle" font-size="12" fill="#1a1a1a">Зчитування N_seg та Entry</text>
  <text x="360" y="172" text-anchor="middle" font-size="12" fill="#6b7280">Перевірка конфігурації SPI</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="465" y1="145" x2="500" y2="145" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Top Flow: Step 3 -->
  <rect x="500" y="85" width="210" height="120" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="605" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">3. Розрахунок XOR / CRC32</text>
  <text x="605" y="130" text-anchor="middle" font-size="12" fill="#1a1a1a">Побайтовий XOR (CS_0=0xEF)</text>
  <text x="605" y="150" text-anchor="middle" font-size="12" fill="#1a1a1a">Перевірка полінома CRC32</text>
  <text x="605" y="172" text-anchor="middle" font-size="12" fill="#6b7280">Зіставлення з байтом CS_final</text>

  <!-- Arrow 3 -> 4 (Success) -->
  <line x1="710" y1="145" x2="745" y2="145" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="727" y="135" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Сума OK</text>

  <!-- Top Flow: Step 4 (Success App Launch) -->
  <rect x="745" y="85" width="185" height="120" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="837" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">4. Запуск прошивки</text>
  <text x="837" y="130" text-anchor="middle" font-size="12" fill="#1a1a1a">Мапування IRAM / DRAM</text>
  <text x="837" y="150" text-anchor="middle" font-size="12" fill="#1a1a1a">Скидання прапорів FOTA</text>
  <text x="837" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Перехід на Entry_addr</text>

  <!-- Failure Arrow 1 (from Header check) -->
  <path d="M360,205 L360,250 L175,250 L175,340" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="365" y="230" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">Збій Magic</text>

  <!-- Failure Arrow 2 (from Checksum check) -->
  <path d="M605,205 L605,280 L175,280 L175,340" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="610" y="230" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">Збій CRC/XOR</text>

  <!-- Bottom Panel: Fallback Scenario -->
  <rect x="30" y="340" width="900" height="145" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="50" y="362" text-anchor="start" font-size="13" font-weight="bold" fill="#c0392b">Аварійний сценарій: Пошкодження образу або збій верифікації (Fallback Flow)</text>

  <!-- Step A: Failure Detection -->
  <rect x="50" y="375" width="250" height="95" rx="6" fill="white" stroke="#c0392b" stroke-width="1.5"/>
  <text x="175" y="395" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Помилка Magic Byte / CRC</text>
  <text x="175" y="415" text-anchor="middle" font-size="12" fill="#1a1a1a">Виявлено невалідні байти або</text>
  <text x="175" y="433" text-anchor="middle" font-size="12" fill="#1a1a1a">невідповідність контрольної суми</text>
  <text x="175" y="452" text-anchor="middle" font-size="12" fill="#6b7280">Фіксація помилки у секторі/RTC</text>

  <!-- Arrow A -> B -->
  <line x1="300" y1="422" x2="335" y2="422" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Step B: Slot Switch -->
  <rect x="335" y="375" width="270" height="95" rx="6" fill="white" stroke="#c0392b" stroke-width="1.5"/>
  <text x="470" y="395" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Авто-перемикання на резерв</text>
  <text x="470" y="415" text-anchor="middle" font-size="12" fill="#1a1a1a">Зміна активного слота в eBoot config</text>
  <text x="470" y="433" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Перехід: Slot 1 ➔ Slot 0 (Recovery)</text>
  <text x="470" y="452" text-anchor="middle" font-size="12" fill="#6b7280">Збільшення лічильника спроб</text>

  <!-- Arrow B -> C -->
  <line x1="605" y1="422" x2="640" y2="422" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Step C: Recovery Execution -->
  <rect x="640" y="375" width="270" height="95" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="775" y="395" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Запуск стабільного образу</text>
  <text x="775" y="415" text-anchor="middle" font-size="12" fill="#1a1a1a">Повторна перевірка Slot 0</text>
  <text x="775" y="433" text-anchor="middle" font-size="12" fill="#1a1a1a">Відновлення працездатності пристрою</text>
  <text x="775" y="452" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Надсилання сповіщення відкочування</text>
</svg>
