<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue-left" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M7,1 L1,4 L7,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-blue-right" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L7,4 L1,7 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма защепкування strapping-виводів ESP8266</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Фіксація логічного вектора (GPIO15, GPIO0, GPIO2) за фронтом сигналу RST у вікні latching</text>

  <!-- PANEL 1: Timing Diagram (Left Side) -->
  <rect x="40" y="85" width="580" height="430" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="60" y="112" font-size="14" font-weight="bold" fill="#1a1a1a">Часова діаграма сигналів защепкування</text>

  <!-- Latching Window Shading Zone -->
  <rect x="250" y="140" width="140" height="270" fill="#eaf0fd" fill-opacity="0.7" stroke="#2457d6" stroke-dasharray="3 3" stroke-width="1.5"/>
  <text x="320" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Вікно Latch Window</text>

  <!-- Sampling Point Vertical Line -->
  <line x1="320" y1="140" x2="320" y2="410" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 2"/>
  <circle cx="320" cy="185" r="4" fill="#c0392b"/>
  <text x="330" y="188" font-size="12" font-weight="bold" fill="#c0392b">Фронт зчитування (RST = 1)</text>

  <!-- Signal Labels (Left Axis) -->
  <text x="60" y="215" font-size="12" font-weight="bold" fill="#c0392b">RST / EN</text>
  <text x="60" y="265" font-size="12" font-weight="bold" fill="#2457d6">GPIO0</text>
  <text x="60" y="315" font-size="12" font-weight="bold" fill="#27ae60">GPIO2</text>
  <text x="60" y="365" font-size="12" font-weight="bold" fill="#1a1a1a">GPIO15</text>

  <!-- Axis Reference Grid Lines -->
  <line x1="140" y1="215" x2="590" y2="215" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="140" y1="265" x2="590" y2="265" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="140" y1="315" x2="590" y2="315" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="140" y1="365" x2="590" y2="365" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Waveforms -->
  <!-- RST Signal Waveform -->
  <path d="M 140,215 L 310,215 L 330,190 L 590,190" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="150" y="232" font-size="12" font-weight="bold" fill="#c0392b">RESET (0V)</text>
  <text x="510" y="182" font-size="12" font-weight="bold" fill="#27ae60">RUN (3.3V)</text>

  <!-- GPIO0 Signal Waveform (Stable HIGH for Flash Boot) -->
  <path d="M 140,265 L 590,265" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <text x="420" y="257" font-size="12" font-weight="bold" fill="#2457d6">'1' (Pull-up 3.3V)</text>

  <!-- GPIO2 Signal Waveform (Stable HIGH) -->
  <path d="M 140,315 L 590,315" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <text x="420" y="307" font-size="12" font-weight="bold" fill="#27ae60">'1' (Pull-up 3.3V)</text>

  <!-- GPIO15 Signal Waveform (Stable LOW) -->
  <path d="M 140,365 L 590,365" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="420" y="357" font-size="12" font-weight="bold" fill="#1a1a1a">'0' (Pull-down GND)</text>

  <!-- Time Interval Markers (t_setup, t_hold) -->
  <line x1="250" y1="410" x2="250" y2="465" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="320" y1="410" x2="320" y2="465" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="390" y1="410" x2="390" y2="465" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- t_setup: 250..320 -->
  <line x1="250" y1="435" x2="320" y2="435" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue-left)" marker-end="url(#arr-blue-right)"/>
  <text x="285" y="427" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">t_setup</text>
  <text x="280" y="450" text-anchor="middle" font-size="12" fill="#6b7280">Встановлення</text>

  <!-- t_hold: 320..390 -->
  <line x1="320" y1="435" x2="390" y2="435" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue-left)" marker-end="url(#arr-blue-right)"/>
  <text x="355" y="427" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">t_hold</text>
  <text x="360" y="450" text-anchor="middle" font-size="12" fill="#6b7280">Утримання</text>

  <!-- PANEL 2: Vector Status & Notes (Right Side) -->
  <rect x="640" y="85" width="280" height="430" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="655" y="112" font-size="14" font-weight="bold" fill="#1a1a1a">Результат фіксації вектора</text>

  <!-- Card 1: Readout Vector Status -->
  <rect x="655" y="125" width="250" height="105" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="670" y="148" font-size="12" font-weight="bold" fill="#27ae60">Защепнутий режим старту:</text>
  <text x="670" y="170" font-size="14" font-weight="bold" fill="#1a1a1a">boot mode: (3, 7)</text>
  <text x="670" y="190" font-size="12" fill="#6b7280">[GPIO15, GPIO0, GPIO2] = [0, 1, 1]</text>
  <text x="670" y="212" font-size="12" font-weight="bold" fill="#27ae60">→ Запуск з Flash (Flash Boot)</text>

  <!-- Card 2: Pin Level Requirements -->
  <rect x="655" y="242" width="250" height="255" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="670" y="265" font-size="13" font-weight="bold" fill="#2457d6">Вимоги до рівнів виводів:</text>

  <text x="670" y="290" font-size="12" font-weight="bold" fill="#1a1a1a">• GPIO15 (MTDO): LOW (0V)</text>
  <text x="682" y="308" font-size="12" fill="#6b7280">Обов'язковий Pull-down 10k</text>
  <text x="682" y="326" font-size="12" font-weight="bold" fill="#c0392b">HIGH блокує запуск чипа!</text>

  <text x="670" y="352" font-size="12" font-weight="bold" fill="#1a1a1a">• GPIO0: HIGH (3.3V) / LOW (0V)</text>
  <text x="682" y="370" font-size="12" fill="#6b7280">HIGH → SPI Flash Boot</text>
  <text x="682" y="388" font-size="12" fill="#6b7280">LOW → UART Download</text>

  <text x="670" y="414" font-size="12" font-weight="bold" fill="#1a1a1a">• GPIO2 (TXD1): HIGH (3.3V)</text>
  <text x="682" y="432" font-size="12" fill="#6b7280">Обов'язковий Pull-up 10k</text>

  <line x1="670" y1="455" x2="890" y2="455" stroke="#e0e0e0" stroke-width="1"/>
  <text x="670" y="475" font-size="12" font-style="italic" fill="#6b7280">Зчитування 1 раз при RST=1</text>
</svg>
