<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Markers -->
  <defs>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принципова схема автоматичного програматора (Auto-Reset Circuit)</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Двотранзисторний каскад Q1/Q2 на сигналах DTR/RTS з підтяжками R1-R4 та фільтром C1</text>

  <!-- PANEL 1: Schematic (Left Side) -->
  <rect x="30" y="75" width="580" height="415" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="100" font-size="14" font-weight="bold" fill="#1a1a1a">Схемотехнічне рішення двотранзисторного автоскиду</text>

  <!-- USB-UART Module Block -->
  <rect x="50" y="125" width="100" height="320" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="100" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">USB-UART</text>
  <text x="100" y="166" text-anchor="middle" font-size="11" fill="#6b7280">CP2102 / CH340</text>

  <!-- DTR & RTS Terminals -->
  <circle cx="150" cy="220" r="4" fill="#2457d6"/>
  <text x="100" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">DTR</text>

  <circle cx="150" cy="350" r="4" fill="#2457d6"/>
  <text x="100" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">RTS</text>

  <!-- ESP8266 MCU Block -->
  <rect x="475" y="125" width="120" height="320" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="535" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">ESP8266</text>

  <!-- RST & GPIO0 Terminals -->
  <circle cx="475" cy="220" r="4" fill="#c0392b"/>
  <text x="490" y="215" font-size="12" font-weight="bold" fill="#c0392b">RST</text>
  <text x="490" y="232" font-size="11" fill="#6b7280">(Reset)</text>

  <circle cx="475" cy="350" r="4" fill="#27ae60"/>
  <text x="490" y="345" font-size="12" font-weight="bold" fill="#27ae60">GPIO0</text>
  <text x="490" y="362" font-size="11" fill="#6b7280">(Boot Mode)</text>

  <!-- Transistor Q1 (RST) -->
  <line x1="290" y1="208" x2="290" y2="232" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="290" y1="212" x2="315" y2="192" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="290" y1="228" x2="315" y2="248" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="307,241 315,248 305,249" fill="#1a1a1a"/>
  <line x1="255" y1="220" x2="290" y2="220" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="300" cy="220" r="22" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="330" y="195" font-size="12" font-weight="bold" fill="#1a1a1a">Q1 (NPN)</text>
  <text x="330" y="210" font-size="11" fill="#6b7280">S8050 / 1AM</text>

  <!-- Transistor Q2 (GPIO0) -->
  <line x1="290" y1="338" x2="290" y2="362" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="290" y1="342" x2="315" y2="322" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="290" y1="358" x2="315" y2="378" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="307,371 315,378 305,379" fill="#1a1a1a"/>
  <line x1="255" y1="350" x2="290" y2="350" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="300" cy="350" r="22" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="3 2"/>
  <text x="330" y="325" font-size="12" font-weight="bold" fill="#1a1a1a">Q2 (NPN)</text>
  <text x="330" y="340" font-size="11" fill="#6b7280">S8050 / 1AM</text>

  <!-- Resistors R1 & R2 -->
  <rect x="210" y="211" width="45" height="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="232.5" y="204" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">R1 10k</text>

  <rect x="210" y="341" width="45" height="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="232.5" y="334" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">R2 10k</text>

  <!-- VCC 3.3V Power Rail at top -->
  <line x1="419" y1="110" x2="475" y2="110" stroke="#c0392b" stroke-width="2"/>
  <circle cx="419" cy="110" r="3" fill="#c0392b"/>
  <text x="447" y="105" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">+3.3V VCC</text>

  <!-- Pull-up R3 for RST -->
  <line x1="419" y1="110" x2="419" y2="140" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="410" y="140" width="18" height="35" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="402" y="162" text-anchor="end" font-size="11" font-weight="bold" fill="#1a1a1a">R3 10k</text>
  <line x1="419" y1="175" x2="419" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="419" cy="220" r="3.5" fill="#c0392b"/>

  <!-- Debounce Capacitor C1 for RST -->
  <line x1="455" y1="220" x2="455" y2="238" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="445" y1="238" x2="465" y2="238" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="445" y1="244" x2="465" y2="244" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="455" y1="244" x2="455" y2="265" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- GND symbol -->
  <line x1="447" y1="265" x2="463" y2="265" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="451" y1="269" x2="459" y2="269" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="455" cy="220" r="3.5" fill="#c0392b"/>
  <text x="470" y="246" font-size="11" font-weight="bold" fill="#1a1a1a">C1 100nF</text>

  <!-- Pull-up R4 for GPIO0 -->
  <line x1="419" y1="220" x2="419" y2="280" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="410" y="280" width="18" height="35" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="402" y="302" text-anchor="end" font-size="11" font-weight="bold" fill="#1a1a1a">R4 10k</text>
  <line x1="419" y1="315" x2="419" y2="350" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="419" cy="350" r="3.5" fill="#27ae60"/>

  <!-- Wiring Connections -->

  <!-- DTR Line -->
  <line x1="150" y1="220" x2="190" y2="220" stroke="#2457d6" stroke-width="2"/>
  <circle cx="190" cy="220" r="3.5" fill="#2457d6"/>
  <line x1="190" y1="220" x2="210" y2="220" stroke="#2457d6" stroke-width="2"/>
  <path d="M 190,220 L 190,378 L 315,378" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- RTS Line -->
  <line x1="150" y1="350" x2="170" y2="350" stroke="#2457d6" stroke-width="2"/>
  <circle cx="170" cy="350" r="3.5" fill="#2457d6"/>
  <line x1="170" y1="350" x2="210" y2="350" stroke="#2457d6" stroke-width="2"/>
  <path d="M 170,350 L 170,248 L 315,248" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Collector Q1 -> RST Line -->
  <path d="M 315,192 L 315,175 L 475,175 L 475,220" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Collector Q2 -> GPIO0 Line -->
  <path d="M 315,322 L 315,305 L 475,305 L 475,350" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>


  <!-- PANEL 2: Specifications & Truth Table (Right Side) -->
  <rect x="635" y="75" width="295" height="415" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="650" y="100" font-size="14" font-weight="bold" fill="#1a1a1a">Параметри елементів та стани</text>

  <!-- Truth Table Header -->
  <text x="650" y="125" font-size="12" font-weight="bold" fill="#2457d6">Таблиця логічних станів DTR/RTS:</text>

  <rect x="648" y="138" width="268" height="26" fill="#2457d6" rx="4"/>
  <text x="668" y="155" text-anchor="middle" font-size="11" font-weight="bold" fill="white">DTR</text>
  <text x="702" y="155" text-anchor="middle" font-size="11" font-weight="bold" fill="white">RTS</text>
  <text x="738" y="155" text-anchor="middle" font-size="11" font-weight="bold" fill="white">RST</text>
  <text x="782" y="155" text-anchor="middle" font-size="11" font-weight="bold" fill="white">GPIO0</text>
  <text x="860" y="155" text-anchor="middle" font-size="11" font-weight="bold" fill="white">Режим роботи</text>

  <!-- Row 1: Idle -->
  <rect x="648" y="167" width="268" height="26" fill="#ffffff" stroke="#d0d7de" rx="3"/>
  <text x="668" y="184" text-anchor="middle" font-size="11" fill="#1a1a1a">1</text>
  <text x="702" y="184" text-anchor="middle" font-size="11" fill="#1a1a1a">1</text>
  <text x="738" y="184" text-anchor="middle" font-size="11" fill="#1a1a1a">1</text>
  <text x="782" y="184" text-anchor="middle" font-size="11" fill="#1a1a1a">1</text>
  <text x="860" y="184" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Робочий (Run)</text>

  <!-- Row 2: Reset -->
  <rect x="648" y="196" width="268" height="26" fill="#fdecea" stroke="#c0392b" stroke-width="1.2" rx="3"/>
  <text x="668" y="213" text-anchor="middle" font-size="11" fill="#1a1a1a">1</text>
  <text x="702" y="213" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">0</text>
  <text x="738" y="213" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">0</text>
  <text x="782" y="213" text-anchor="middle" font-size="11" fill="#1a1a1a">1</text>
  <text x="860" y="213" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Скидання (Reset)</text>

  <!-- Row 3: Download -->
  <rect x="648" y="225" width="268" height="26" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2" rx="3"/>
  <text x="668" y="242" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">0</text>
  <text x="702" y="242" text-anchor="middle" font-size="11" fill="#1a1a1a">1</text>
  <text x="738" y="242" text-anchor="middle" font-size="11" fill="#1a1a1a">1</text>
  <text x="782" y="242" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">0</text>
  <text x="860" y="242" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Прошивка (Boot)</text>

  <!-- Row 4: Both 0 -->
  <rect x="648" y="254" width="268" height="26" fill="#ffffff" stroke="#d0d7de" rx="3"/>
  <text x="668" y="271" text-anchor="middle" font-size="11" fill="#1a1a1a">0</text>
  <text x="702" y="271" text-anchor="middle" font-size="11" fill="#1a1a1a">0</text>
  <text x="738" y="271" text-anchor="middle" font-size="11" fill="#1a1a1a">1</text>
  <text x="782" y="271" text-anchor="middle" font-size="11" fill="#1a1a1a">1</text>
  <text x="860" y="271" text-anchor="middle" font-size="11" fill="#6b7280">Блокування</text>


  <!-- Card 2: Component Specs -->
  <rect x="648" y="295" width="268" height="175" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="662" y="316" font-size="12" font-weight="bold" fill="#2457d6">Схемотехнічні вимоги:</text>

  <text x="662" y="337" font-size="11" font-weight="bold" fill="#1a1a1a">• Q1, Q2: NPN транзистори (S8050 / 1AM)</text>
  <text x="662" y="358" font-size="11" fill="#1a1a1a">• R1, R2: 10 kΩ (базові струмообмежувачі)</text>
  <text x="662" y="379" font-size="11" fill="#1a1a1a">• R3, R4: 10 kΩ (внешні pull-up до 3.3V)</text>
  <text x="662" y="400" font-size="11" fill="#1a1a1a">• C1: 100 nF (фільтр завад на ліній RST)</text>

  <text x="662" y="432" font-size="11" font-weight="bold" fill="#27ae60">✓ Захист від блокування:</text>
  <text x="662" y="450" font-size="11" fill="#6b7280">DTR=0, RTS=0 унеможливлює зависання</text>
</svg>
