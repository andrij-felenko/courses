<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Header and Subtitle -->
  <text x="480" y="36" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Послідовність виконання операцій ESP eFuse API (Read / Write)</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Перевірка масок захисту, буферизація та апаратне випалювання бітів у регістрах eFuse</text>

  <!-- Markers -->
  <defs>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-danger" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Top Panel: Field Definition -->
  <rect x="200" y="80" width="560" height="65" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="104" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Оголошення полів eFuse (esp_efuse_table.h)</text>
  <text x="480" y="126" font-size="12" fill="#6b7280" text-anchor="middle">Опис масиву esp_efuse_desc_t: прив'язка назви поля до EFUSE_BLKx, зміщення та довжини бітів</text>

  <!-- Flow Lines from Top Panel -->
  <line x1="480" y1="145" x2="480" y2="162" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="247" y1="162" x2="712" y2="162" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="247" y1="162" x2="247" y2="180" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <line x1="712" y1="162" x2="712" y2="180" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>

  <!-- Left Panel: Read Flow -->
  <rect x="30" y="180" width="435" height="225" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247" y="202" font-size="14" font-weight="700" fill="#2457d6" text-anchor="middle">Зчитування даних: esp_efuse_read_field_blob()</text>

  <!-- Left Sub-box 1: Read Protect Check -->
  <rect x="45" y="215" width="405" height="80" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="60" y="235" font-size="12" font-weight="700" fill="#1a1a1a">Етап 1: Перевірка маски зчитування (Read Protect)</text>
  <text x="60" y="255" font-size="12" fill="#c0392b">• Заблоковано (RD_DIS=1): ESP_ERR_EFUSE_READ_RESTRICTED</text>
  <text x="60" y="275" font-size="12" fill="#27ae60">• Дозволено (RD_DIS=0): перехід до читання теневих регістрів</text>

  <!-- Left Inner Arrow -->
  <line x1="247" y1="295" x2="247" y2="312" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>

  <!-- Left Sub-box 2: Read Execution -->
  <rect x="45" y="312" width="405" height="80" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="60" y="332" font-size="12" font-weight="700" fill="#1a1a1a">Етап 2: Зчитування та маскування даних</text>
  <text x="60" y="352" font-size="12" fill="#1a1a1a">• Пряме зчитування з дзеркала RAM (EFUSE_MEM_BASE)</text>
  <text x="60" y="372" font-size="12" fill="#6b7280">• Зсув, вирівнювання бітів та копіювання у dst_buffer</text>

  <!-- Right Panel: Write Flow -->
  <rect x="495" y="180" width="435" height="225" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="712" y="202" font-size="14" font-weight="700" fill="#c0392b" text-anchor="middle">Запис даних: esp_efuse_write_field_blob()</text>

  <!-- Right Sub-box 1: Write Protect Check -->
  <rect x="510" y="215" width="405" height="80" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="525" y="235" font-size="12" font-weight="700" fill="#1a1a1a">Етап 1: Перевірка маски запису (Write Protect)</text>
  <text x="525" y="255" font-size="12" fill="#c0392b">• Заблоковано (WR_DIS=1): ESP_ERR_EFUSE_WRITE_RESTRICTED</text>
  <text x="525" y="275" font-size="12" fill="#27ae60">• Дозволено (WR_DIS=0): перехід до буферизації змін</text>

  <!-- Right Inner Arrow -->
  <line x1="712" y1="295" x2="712" y2="312" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-danger)"/>

  <!-- Right Sub-box 2: Write Execution -->
  <rect x="510" y="312" width="405" height="80" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="525" y="332" font-size="12" font-weight="700" fill="#1a1a1a">Етап 2: Буферизація та одноразове випалювання</text>
  <text x="525" y="352" font-size="12" fill="#1a1a1a">• Накопичення змін: esp_efuse_batch_write_begin()</text>
  <text x="525" y="372" font-size="12" fill="#c0392b">• Фіксація бітів (Burn): esp_efuse_batch_write_commit()</text>

  <!-- Arrows to Hardware Layer -->
  <line x1="247" y1="405" x2="247" y2="430" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <line x1="712" y1="405" x2="712" y2="430" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-danger)"/>

  <!-- Bottom Panel: Hardware Layer -->
  <rect x="30" y="430" width="900" height="110" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="452" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Апаратний рівень eFuse контролера (ESP32-S3 Hardware)</text>

  <!-- Hardware Sub-box 1: Shadow RAM -->
  <rect x="45" y="465" width="425" height="60" rx="6" fill="white" stroke="#2457d6" stroke-width="1"/>
  <text x="257" y="486" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">Теневі регістри RAM (EFUSE_MEM_BASE)</text>
  <text x="257" y="508" font-size="12" fill="#6b7280" text-anchor="middle">Автоматично завантажуються з OTP при скиданні (Reset)</text>

  <!-- Hardware Sub-box 2: OTP EFUSE Blocks -->
  <rect x="490" y="465" width="425" height="60" rx="6" fill="white" stroke="#c0392b" stroke-width="1"/>
  <text x="702" y="486" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle">Фізичні блоки eFuse OTP (EFUSE_BLK0 ... EFUSE_BLK10)</text>
  <text x="702" y="508" font-size="12" fill="#6b7280" text-anchor="middle">Одноразово випалювані перемички (VDDQ імпульс, незворотній запис)</text>
</svg>
