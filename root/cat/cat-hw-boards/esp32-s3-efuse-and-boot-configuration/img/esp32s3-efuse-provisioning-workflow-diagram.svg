<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Процес апаратного прувіжнінгу eFuse ESP32-S3</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Від профілювання та моделювання (--dry-run) до незворотного запікання ключів</text>

  <rect x="100" y="70" width="300" height="40" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="250" y="95" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Робоча станція (espefuse.py)</text>
  
  <rect x="560" y="70" width="300" height="40" rx="4" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
  <text x="710" y="95" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мікроконтролер ESP32-S3</text>

  <line x1="250" y1="110" x2="250" y2="530" stroke="#d0d7de" stroke-width="2" stroke-dasharray="6,6"/>
  <line x1="710" y1="110" x2="710" y2="530" stroke="#d0d7de" stroke-width="2" stroke-dasharray="6,6"/>

  <rect x="20" y="130" width="220" height="30" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="130" y="150" font-size="13" fill="#1a1a1a" text-anchor="middle">1. espefuse.py summary</text>

  <line x1="250" y1="145" x2="695" y2="145" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-black)"/>
  <text x="480" y="135" font-size="13" fill="#1a1a1a" text-anchor="middle">Запит поточного стану регістрів</text>

  <line x1="710" y1="175" x2="265" y2="175" stroke="#6b7280" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arr-gray)"/>
  <text x="480" y="170" font-size="13" fill="#6b7280" text-anchor="middle">Дамп даних (BLK0 - BLK10)</text>

  <rect x="20" y="215" width="220" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="130" y="235" font-size="13" fill="#27ae60" text-anchor="middle">2. --dry-run burn_key</text>

  <line x1="250" y1="230" x2="695" y2="230" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="480" y="220" font-size="13" fill="#27ae60" text-anchor="middle">Моделювання запікання ключів (безпечно)</text>

  <rect x="600" y="245" width="220" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="710" y="265" font-size="13" fill="#27ae60" text-anchor="middle">Валідація без фізичних змін</text>
  
  <line x1="710" y1="295" x2="265" y2="295" stroke="#27ae60" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arr-green)"/>
  <text x="480" y="285" font-size="13" fill="#27ae60" text-anchor="middle">Звіт про можливі конфлікти бітів</text>

  <rect x="20" y="335" width="220" height="30" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="130" y="355" font-size="13" fill="#c0392b" text-anchor="middle">3. burn_key (Виконання)</text>

  <line x1="250" y1="350" x2="695" y2="350" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="480" y="340" font-size="13" fill="#c0392b" text-anchor="middle">Передача даних ключа до eFuse</text>

  <rect x="600" y="365" width="220" height="30" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="710" y="385" font-size="13" fill="#c0392b" text-anchor="middle">Незворотне випалювання (0→1)</text>

  <rect x="20" y="415" width="220" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="130" y="435" font-size="13" fill="#2457d6" text-anchor="middle">4. burn_efuse RD_DIS / WR_DIS</text>

  <line x1="250" y1="430" x2="695" y2="430" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="480" y="420" font-size="13" fill="#2457d6" text-anchor="middle">Блокування читання/запису регістрів</text>

  <rect x="600" y="445" width="220" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="710" y="465" font-size="13" fill="#2457d6" text-anchor="middle">Захист ключів апаратно</text>

  <rect x="20" y="495" width="220" height="30" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="130" y="515" font-size="13" fill="#1a1a1a" text-anchor="middle">5. espefuse.py summary</text>

  <line x1="250" y1="510" x2="695" y2="510" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-black)"/>
  <text x="480" y="500" font-size="13" fill="#1a1a1a" text-anchor="middle">Верифікація встановлених ключів і блокувань</text>
</svg>
