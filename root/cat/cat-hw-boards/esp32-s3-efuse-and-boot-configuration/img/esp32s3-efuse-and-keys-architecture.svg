<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Архітектура eFuse та розподіл ключів ESP32-S3</text>
  <text x="480" y="54" font-size="13" text-anchor="middle" fill="#6b7280">Апаратна ізоляція ключів RSA-3072 та AES-256 від шини CPU через RD_DIS та KEY_PURPOSE</text>

  <!-- Панель 1: Масив eFuse -->
  <rect x="25" y="75" width="320" height="460" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="185" y="100" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a1a">Масив електронних запобіжників (eFuse)</text>

  <rect x="38" y="115" width="294" height="85" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="50" y="134" font-size="13" font-weight="700" fill="#2457d6">BLOCK0: Системна конфігурація &amp; Захист</text>
  <text x="50" y="153" font-size="12" fill="#1a1a1a">• RD_DIS: Блокування читання KEY0..KEY5</text>
  <text x="50" y="170" font-size="12" fill="#1a1a1a">• WR_DIS: Фіксація запису (eFuse Burning)</text>
  <text x="50" y="187" font-size="12" fill="#1a1a1a">• KEY_PURPOSE_0..5: Призначення ключів</text>

  <rect x="38" y="210" width="294" height="45" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="50" y="228" font-size="12" font-weight="700" fill="#6b7280">BLOCK1 – BLOCK3: SYS_DATA / USER_DATA</text>
  <text x="50" y="244" font-size="12" fill="#6b7280">MAC-адреса, калібрування ADC, параметри</text>

  <rect x="38" y="265" width="294" height="55" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="50" y="285" font-size="13" font-weight="700" fill="#27ae60">BLOCK4 (KEY0): SECURE_BOOT_DIGEST0</text>
  <text x="50" y="304" font-size="12" fill="#1a1a1a">Хеш публічного ключа RSA-3072 (256 біт)</text>

  <rect x="38" y="330" width="294" height="55" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="50" y="350" font-size="13" font-weight="700" fill="#27ae60">BLOCK5 (KEY1): FLASH_ENCRYPTION</text>
  <text x="50" y="369" font-size="12" fill="#1a1a1a">Апаратний ключ шифрування AES-256</text>

  <rect x="38" y="395" width="294" height="48" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="50" y="414" font-size="12" font-weight="700" fill="#1a1a1a">BLOCK6 (KEY2): SECURE_BOOT_DIGEST1</text>
  <text x="50" y="431" font-size="12" fill="#6b7280">Резервний хеш RSA-3072 ключа</text>

  <rect x="38" y="453" width="294" height="68" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="50" y="472" font-size="12" font-weight="700" fill="#1a1a1a">BLOCK7 – BLOCK10 (KEY3 – KEY6)</text>
  <text x="50" y="489" font-size="12" fill="#6b7280">HMAC_KEY, DS_KEY (Digital Signature),</text>
  <text x="50" y="506" font-size="12" fill="#6b7280">SECURE_BOOT_DIGEST2, RESERVED</text>

  <!-- Панель 2: Логіка контролера eFuse -->
  <rect x="365" y="75" width="230" height="460" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="480" y="100" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a1a">Логіка контролера eFuse</text>

  <rect x="375" y="115" width="190" height="110" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="470" y="135" font-size="13" font-weight="700" text-anchor="middle" fill="#2457d6">Контролер захисту eFuse</text>
  <text x="470" y="155" font-size="12" text-anchor="middle" fill="#1a1a1a">Маршрутизація ключів</text>
  <text x="470" y="172" font-size="12" text-anchor="middle" fill="#1a1a1a">згідно з KEY_PURPOSE</text>
  <text x="470" y="192" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">RD_DIS = 1 (Active Lock)</text>
  <text x="470" y="210" font-size="12" text-anchor="middle" fill="#6b7280">Апаратне блокування</text>

  <rect x="375" y="240" width="190" height="135" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="470" y="260" font-size="13" font-weight="700" text-anchor="middle" fill="#27ae60">Пряма апаратна шина</text>
  <text x="470" y="280" font-size="12" text-anchor="middle" fill="#1a1a1a">Шина читання ключів</text>
  <text x="470" y="297" font-size="12" text-anchor="middle" fill="#1a1a1a">для периферії (HW Bus)</text>
  <text x="470" y="320" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">🟢 Доступ ДОЗВОЛЕНО</text>
  <text x="470" y="339" font-size="12" text-anchor="middle" fill="#1a1a1a">Лише криптоприскорювачам</text>
  <text x="470" y="356" font-size="12" text-anchor="middle" fill="#6b7280">(RSA та AES модулям)</text>

  <rect x="375" y="390" width="190" height="130" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <text x="470" y="410" font-size="13" font-weight="700" text-anchor="middle" fill="#c0392b">Ізоляція системної шини</text>
  <text x="470" y="430" font-size="12" text-anchor="middle" fill="#1a1a1a">Захист RD_DIS від CPU</text>
  <text x="470" y="452" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">⛔ Доступ ЗАБЛОКОВАНО</text>
  <text x="470" y="472" font-size="12" text-anchor="middle" fill="#1a1a1a">Зчитування через шину</text>
  <text x="470" y="489" font-size="12" text-anchor="middle" fill="#1a1a1a">повертає лише 0x0</text>
  <text x="470" y="506" font-size="12" text-anchor="middle" fill="#6b7280">(Приховано від зчитування)</text>

  <!-- Панель 3: Криптопериферія та шина SoC -->
  <rect x="615" y="75" width="320" height="460" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="775" y="100" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a1a">Криптопериферія та шина SoC</text>

  <rect x="628" y="115" width="294" height="120" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="640" y="135" font-size="13" font-weight="700" fill="#27ae60">Secure Boot V2 Hardware Engine</text>
  <text x="640" y="155" font-size="12" fill="#1a1a1a">• Апаратний блок перевірки RSA-3072</text>
  <text x="640" y="173" font-size="12" fill="#1a1a1a">• Отримує SECURE_BOOT_DIGEST0 напряму</text>
  <text x="640" y="191" font-size="12" fill="#1a1a1a">• Верифікує підпис Bootloader / App</text>
  <text x="640" y="209" font-size="12" fill="#27ae60">✓ Дозволяє запуск лише валідного коду</text>

  <rect x="628" y="250" width="294" height="120" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="640" y="270" font-size="13" font-weight="700" fill="#27ae60">Flash Encryption Hardware Engine</text>
  <text x="640" y="290" font-size="12" fill="#1a1a1a">• Прискорювач XTS-AES-256 (або 128)</text>
  <text x="640" y="308" font-size="12" fill="#1a1a1a">• Отримує ключ з BLOCK5 нальоту</text>
  <text x="640" y="326" font-size="12" fill="#1a1a1a">• Прозоре розшифрування даних з Flash</text>
  <text x="640" y="344" font-size="12" fill="#27ae60">✓ Вміст Flash захищено від дампа</text>

  <rect x="628" y="385" width="294" height="135" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <text x="640" y="405" font-size="13" font-weight="700" fill="#c0392b">Системна шина SoC (CPU / JTAG / DMA)</text>
  <text x="640" y="425" font-size="12" fill="#1a1a1a">• Доступ ядра Xtensa CPU та JTAG</text>
  <text x="640" y="443" font-size="12" fill="#1a1a1a">• Зчитування eFuse регістрів ключів</text>
  <text x="640" y="461" font-size="12" font-weight="700" fill="#c0392b">⛔ Заблоковано: Ключі невидимі</text>
  <text x="640" y="479" font-size="12" fill="#1a1a1a">Криптоматеріал повністю ізольовано</text>
  <text x="640" y="497" font-size="12" fill="#6b7280">від читання будь-яким софтом чи JTAG</text>

  <!-- Зв'язки та стрілки -->
  <!-- Синя лінія від BLOCK0 до Контролера eFuse -->
  <line x1="332" y1="157" x2="367" y2="157" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Синя пунктирна лінія блокування RD_DIS від Контролера до Ізоляції системної шини -->
  <path d="M565,170 L580,170 L580,455 L573,455" fill="none" stroke="#2457d6" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>

  <!-- Зелені лінії від ключів BLOCK4 та BLOCK5 до Прямої апаратної шини -->
  <line x1="332" y1="292" x2="367" y2="292" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="332" y1="357" x2="367" y2="357" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Зелені лінії від Прямої апаратної шини до Crypto Engines -->
  <path d="M565,275 L600,275 L600,175 L620,175" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="565" y1="310" x2="620" y2="310" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Червона лінія блокування від Ізоляції системної шини до Системної шини SoC -->
  <line x1="565" y1="452" x2="620" y2="452" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
</svg>
