<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="500" fill="#ffffff"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Блокування відлагоджувальних каналів та ключів ESP32-S3 бітами eFuse</text>
  <text x="480" y="54" font-size="13" text-anchor="middle" fill="#6b7280">Випалювання eFuse незворотно вимикає апаратний JTAG/USB і надає доступ до ключів лише Crypto Engine</text>

  <!-- ПАНЕЛЬ 1: Конфігурація eFuse -->
  <rect x="30" y="75" width="260" height="405" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <rect x="42" y="87" width="236" height="34" fill="#2457d6" rx="5"/>
  <text x="160" y="109" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Параметри eFuse (EFUSE_BLK0)</text>

  <!-- Поле 1.1 -->
  <rect x="42" y="132" width="236" height="66" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="5"/>
  <text x="160" y="154" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">DIS_PAD_JTAG / HARD_DIS_JTAG</text>
  <text x="160" y="178" font-size="12" text-anchor="middle" fill="#c0392b">Випалено (1) → Блок JTAG</text>

  <!-- Поле 1.2 -->
  <rect x="42" y="210" width="236" height="66" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="5"/>
  <text x="160" y="232" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">DIS_USB_JTAG / DIS_USB_SERIAL</text>
  <text x="160" y="256" font-size="12" text-anchor="middle" fill="#c0392b">Випалено (1) → Вимкнення USB</text>

  <!-- Поле 1.3 -->
  <rect x="42" y="288" width="236" height="66" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="5"/>
  <text x="160" y="310" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">ENABLE_SECURITY_DOWNLOAD</text>
  <text x="160" y="334" font-size="12" text-anchor="middle" fill="#c0392b">Випалено (1) → Захист ROM Boot</text>

  <!-- Поле 1.4 -->
  <rect x="42" y="366" width="236" height="96" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="5"/>
  <text x="160" y="388" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">RD_DIS_KEY0..5 (Блок RD_DIS)</text>
  <text x="160" y="412" font-size="12" text-anchor="middle" fill="#1a1a1a">Захист ключів BLK4–BLK9</text>
  <text x="160" y="436" font-size="12" text-anchor="middle" fill="#c0392b">Випалено (1) → Заборона читання</text>

  <!-- ПАНЕЛЬ 2: Апаратні вимикачі -->
  <rect x="330" y="75" width="300" height="405" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <rect x="342" y="87" width="276" height="34" fill="#f4f6f8" stroke="#d0d7de" rx="5"/>
  <text x="480" y="109" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">Апаратні ключі розриву (Breakers)</text>

  <!-- Вимикач 2.1 -->
  <rect x="342" y="132" width="276" height="66" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <text x="480" y="154" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">Розрив лінії JTAG (Pad JTAG)</text>
  <text x="480" y="178" font-size="12" text-anchor="middle" fill="#c0392b">Фізично розімкнено від CPU</text>

  <!-- Вимикач 2.2 -->
  <rect x="342" y="210" width="276" height="66" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <text x="480" y="232" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">Розрив USB Serial / JTAG Controller</text>
  <text x="480" y="256" font-size="12" text-anchor="middle" fill="#c0392b">Драйвер USB JTAG вимкнено</text>

  <!-- Вимикач 2.3 -->
  <rect x="342" y="288" width="276" height="66" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <text x="480" y="310" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">Обмеження ROM Download Mode</text>
  <text x="480" y="334" font-size="12" text-anchor="middle" fill="#c0392b">Завантаження через UART/USB вимкнено</text>

  <!-- Вимикач 2.4 -->
  <rect x="342" y="366" width="276" height="96" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <text x="480" y="388" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Розділення доступу до eFuse Ключів</text>
  <text x="480" y="412" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">Читання шиною CPU / JTAG: 0x0</text>
  <text x="480" y="436" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">Прямий доступ Crypto Engine: OK</text>

  <!-- ПАНЕЛЬ 3: Апаратні модулі -->
  <rect x="670" y="75" width="260" height="405" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <rect x="682" y="87" width="236" height="34" fill="#2457d6" rx="5"/>
  <text x="800" y="109" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">Модулі ESP32-S3</text>

  <!-- Модуль 3.1 -->
  <rect x="682" y="132" width="236" height="66" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <text x="800" y="154" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Ядро CPU &amp; JTAG Debug</text>
  <text x="800" y="178" font-size="12" text-anchor="middle" fill="#c0392b">Налагодження заблоковано</text>

  <!-- Модуль 3.2 -->
  <rect x="682" y="210" width="236" height="66" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <text x="800" y="232" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">USB Serial / JTAG</text>
  <text x="800" y="256" font-size="12" text-anchor="middle" fill="#c0392b">Інтерфейс деактивовано</text>

  <!-- Модуль 3.3 -->
  <rect x="682" y="288" width="236" height="66" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <text x="800" y="310" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">ROM Bootloader</text>
  <text x="800" y="334" font-size="12" text-anchor="middle" fill="#c0392b">Тільки старт з Flash</text>

  <!-- Модуль 3.4a -->
  <rect x="682" y="366" width="236" height="44" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="5"/>
  <text x="800" y="384" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Шина зчитування CPU</text>
  <text x="800" y="400" font-size="12" text-anchor="middle" fill="#c0392b">Повертає 0x00000000</text>

  <!-- Модуль 3.4b -->
  <rect x="682" y="418" width="236" height="44" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="5"/>
  <text x="800" y="436" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">HW Crypto (AES/SHA)</text>
  <text x="800" y="452" font-size="12" text-anchor="middle" fill="#27ae60">Ключі доступні для HW</text>

  <!-- З'ЄДНУВАЛЬНІ ЛІНІЇ (Зліва в центр) -->
  <line x1="278" y1="165" x2="342" y2="165" stroke="#2457d6" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <line x1="278" y1="243" x2="342" y2="243" stroke="#2457d6" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <line x1="278" y1="321" x2="342" y2="321" stroke="#2457d6" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <line x1="278" y1="414" x2="342" y2="414" stroke="#2457d6" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>

  <!-- З'ЄДНУВАЛЬНІ ЛІНІЇ (З центра вправо) -->
  <line x1="618" y1="165" x2="682" y2="165" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <line x1="618" y1="243" x2="682" y2="243" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <line x1="618" y1="321" x2="682" y2="321" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <line x1="618" y1="388" x2="682" y2="388" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <line x1="618" y1="440" x2="682" y2="440" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
</svg>
