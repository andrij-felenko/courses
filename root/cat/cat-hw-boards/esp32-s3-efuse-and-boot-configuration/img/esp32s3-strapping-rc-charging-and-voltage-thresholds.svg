<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">RC-коло Strapping-лінії та час встановлення рівня</text>
  <text x="480" y="65" text-anchor="middle" font-size="13" fill="#6b7280">Вплив паразитних ємностей та підтяжки на надійність фіксації режимів завантаження</text>

  <rect x="480" y="177.5" width="380" height="115" fill="#fdecea"/>
  <text x="850" y="240" text-anchor="end" font-size="12" fill="#c0392b">Зона невизначеності</text>

  <text x="200" y="90" text-anchor="middle" font-size="12" fill="#1a1a1a">VDD (3.3V)</text>
  <path d="M200,95 L200,125" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M200,125 l-10,5 l20,10 l-20,10 l20,10 l-20,10 l20,10 l-10,5 L200,220" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  <text x="180" y="175" text-anchor="end" font-size="13" fill="#1a1a1a">R_pull</text>

  <circle cx="200" cy="220" r="4" fill="#1a1a1a"/>
  
  <path d="M200,220 L300,220" stroke="#1a1a1a" stroke-width="2"/>

  <path d="M200,220 L200,260 M180,260 L220,260 M180,270 L220,270 M200,270 L200,320" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  <text x="180" y="270" text-anchor="end" font-size="13" fill="#1a1a1a">C_parasitic</text>

  <circle cx="200" cy="320" r="4" fill="#1a1a1a"/>

  <path d="M200,320 L200,330 M180,330 L220,330 M190,338 L210,338 M195,346 L205,346" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  
  <rect x="300" y="160" width="130" height="120" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="365" y="195" text-anchor="middle" font-weight="bold" font-size="14" fill="#1a1a1a">ESP32-S3</text>
  <text x="365" y="225" text-anchor="middle" font-size="12" fill="#1a1a1a">Strapping-пін</text>
  <text x="365" y="245" text-anchor="middle" font-size="12" fill="#6b7280">(GPIO0, 45, 46)</text>

  <text x="230" y="400" text-anchor="middle" font-size="13" fill="#1a1a1a">Часова константа: τ = R_pull × C_parasitic</text>
  <text x="230" y="420" text-anchor="middle" font-size="13" fill="#1a1a1a">V(t) = VDD × (1 − e^(-t/τ))</text>

  <path d="M480,350 L480,100" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="470" y="90" text-anchor="end" font-size="13" fill="#1a1a1a">V(t)</text>
  
  <path d="M480,350 L880,350" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="870" y="370" text-anchor="end" font-size="13" fill="#1a1a1a">t</text>

  <line x1="480" y1="120" x2="860" y2="120" stroke="#6b7280" stroke-dasharray="4,4"/>
  <text x="470" y="124" text-anchor="end" font-size="12" fill="#1a1a1a">VDD</text>

  <line x1="480" y1="177.5" x2="860" y2="177.5" stroke="#6b7280" stroke-dasharray="2,2"/>
  <text x="470" y="181.5" text-anchor="end" font-size="12" fill="#1a1a1a">V_IH (min)</text>

  <line x1="480" y1="292.5" x2="860" y2="292.5" stroke="#6b7280" stroke-dasharray="2,2"/>
  <text x="470" y="296.5" text-anchor="end" font-size="12" fill="#1a1a1a">V_IL (max)</text>

  <path d="M480,420 L860,420" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M480,420 L500,420 L500,390 L860,390" stroke="#2457d6" stroke-width="2" fill="none"/>
  <text x="870" y="394" text-anchor="start" font-size="12" fill="#1a1a1a">CHIP_PU</text>

  <line x1="500" y1="120" x2="500" y2="420" stroke="#d0d7de" stroke-dasharray="4,4"/>
  <text x="500" y="440" text-anchor="middle" font-size="12" fill="#6b7280">t=0</text>

  <line x1="580" y1="90" x2="580" y2="350" stroke="#6b7280" stroke-dasharray="4,2"/>
  <text x="580" y="80" text-anchor="middle" font-size="12" fill="#6b7280">Семплювання (ROM)</text>

  <polyline points="500,350 505.75,292.5 510,259.5 520,204.6 527.5,177.5 540,151 560,131.5 580,124 600,121.5 650,120 860,120" stroke="#27ae60" stroke-width="2" fill="none"/>
  <text x="630" y="112" font-size="12" fill="#27ae60">Мале τ (швидкий фронт)</text>
  <circle cx="580" cy="124" r="4" fill="#27ae60"/>
  <text x="590" y="115" font-size="12" fill="#27ae60">1 (ОК)</text>

  <polyline points="500,350 528.7,292.5 550,259.5 575,228.6 580,223.3 600,204.6 625,185.8 638,177.5 650,171.3 700,151 750,138.9 800,131.5 850,126.9 860,126" stroke="#c0392b" stroke-width="2" fill="none"/>
  <text x="730" y="165" font-size="12" fill="#c0392b">Велике τ (повільний фронт)</text>
  <circle cx="580" cy="223.3" r="4" fill="#c0392b"/>
  <text x="590" y="235" font-size="12" fill="#c0392b">Невизначений стан!</text>
</svg>
