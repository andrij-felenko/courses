<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Апаратна верифікація та розшифрування прошивки ESP32-S3</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Ланцюжок довіри Root of Trust: від eFuse (BLK4–BLK9) через AES/RSA акселератори до запуску в RAM</text>

  <!-- ПАНЕЛЬ 1: eFuse Пам'ять -->
  <rect x="25" y="75" width="200" height="415" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="125" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">eFuse Пам'ять</text>
  <text x="125" y="116" font-size="12" fill="#6b7280" text-anchor="middle">Одноразові біти (OTP)</text>

  <!-- Блок 1.1: Системні біти -->
  <rect x="37" y="130" width="176" height="85" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="125" y="148" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">EFUSE_BLK0</text>
  <text x="45" y="168" font-size="12" fill="#2457d6">• SECURE_BOOT_EN</text>
  <text x="45" y="186" font-size="12" fill="#2457d6">• FLASH_CRYPT_CNT</text>
  <text x="45" y="204" font-size="12" fill="#6b7280">• RD_DIS / WR_DIS</text>

  <!-- Блок 1.2: Digest ключа SB -->
  <rect x="37" y="230" width="176" height="105" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="125" y="248" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">EFUSE_BLK4–BLK8</text>
  <text x="125" y="266" font-size="12" fill="#1a1a1a" text-anchor="middle">Secure Boot V2 Key</text>
  <text x="125" y="284" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">SHA-256 Digest</text>
  <text x="125" y="302" font-size="11" fill="#6b7280" text-anchor="middle">(32 байти хеш-суми)</text>
  <text x="125" y="320" font-size="11" fill="#6b7280" text-anchor="middle">KEY_PURPOSE: SB_DIGEST</text>

  <!-- Блок 1.3: Ключ шифрування -->
  <rect x="37" y="350" width="176" height="120" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="125" y="368" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">EFUSE_BLK4–BLK9</text>
  <text x="125" y="386" font-size="12" fill="#1a1a1a" text-anchor="middle">Flash Encryption Key</text>
  <text x="125" y="404" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">XTS-AES-256 / 128</text>
  <text x="125" y="422" font-size="11" fill="#6b7280" text-anchor="middle">(Апаратно захищений)</text>
  <text x="125" y="440" font-size="11" fill="#6b7280" text-anchor="middle">KEY_PURPOSE: XTS_AES</text>
  <text x="125" y="458" font-size="11" fill="#c0392b" text-anchor="middle">Захист від зчитування</text>

  <!-- ПАНЕЛЬ 2: SPI Flash -->
  <rect x="245" y="75" width="200" height="415" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="345" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Зовнішня SPI Flash</text>
  <text x="345" y="116" font-size="12" fill="#6b7280" text-anchor="middle">Зашифрований вміст</text>

  <!-- Блок 2.1: Таблиця розділів -->
  <rect x="257" y="130" width="176" height="75" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="345" y="150" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Partition Table</text>
  <text x="345" y="170" font-size="12" fill="#6b7280" text-anchor="middle">Адреса 0x8000</text>
  <text x="345" y="188" font-size="11" fill="#2457d6" text-anchor="middle">Зашифровано AES-XTS</text>

  <!-- Блок 2.2: Зашифрований Bootloader -->
  <rect x="257" y="220" width="176" height="110" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="345" y="240" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2nd Stage Bootloader</text>
  <text x="345" y="258" font-size="12" fill="#6b7280" text-anchor="middle">Адреса 0x0000</text>
  <text x="345" y="276" font-size="12" fill="#2457d6" text-anchor="middle">Шифрований бінарник</text>
  <text x="345" y="294" font-size="11" fill="#6b7280" text-anchor="middle">(AES-XTS зашифровано)</text>
  <text x="345" y="312" font-size="11" fill="#6b7280" text-anchor="middle">Включає Payload</text>

  <!-- Блок 2.3: Блок підпису -->
  <rect x="257" y="345" width="176" height="125" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="345" y="365" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Signature Block V2</text>
  <text x="345" y="383" font-size="11" fill="#6b7280" text-anchor="middle">(в кінці образа 4 KB)</text>
  <text x="345" y="403" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Публічний ключ</text>
  <text x="345" y="421" font-size="11" fill="#6b7280" text-anchor="middle">(RSA-3072 / ECC)</text>
  <text x="345" y="441" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Цифровий підпис</text>
  <text x="345" y="459" font-size="11" fill="#6b7280" text-anchor="middle">(RSA-PSS / ECDSA)</text>

  <!-- ПАНЕЛЬ 3: ROM Bootloader & Акселератори -->
  <rect x="465" y="75" width="250" height="415" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="590" y="98" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Апаратний ROM Bootloader</text>
  <text x="590" y="116" font-size="12" fill="#6b7280" text-anchor="middle">Перевірка цілісності та дешифрація</text>

  <!-- Блок 3.1: Перевірка Digest -->
  <rect x="477" y="130" width="226" height="90" fill="#ffffff" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="590" y="148" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Крок 1: Верифікація Digest</text>
  <text x="590" y="168" font-size="12" fill="#1a1a1a" text-anchor="middle">SHA-256(PubKeys Flash)</text>
  <text x="590" y="186" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Звірка з eFuse BLK4–8</text>
  <text x="590" y="204" font-size="11" fill="#6b7280" text-anchor="middle">Збіг = Публічний ключ валідний</text>

  <!-- Блок 3.2: RSA / SHA Акселератор -->
  <rect x="477" y="230" width="226" height="100" fill="#ffffff" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="590" y="248" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Крок 2: Верифікація підпису</text>
  <text x="590" y="268" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">RSA-3072 / ECC Engine</text>
  <text x="590" y="286" font-size="12" fill="#1a1a1a" text-anchor="middle">Обчислення SHA-256 образа</text>
  <text x="590" y="304" font-size="12" fill="#1a1a1a" text-anchor="middle">Перевірка підпису Signature Block</text>
  <text x="590" y="320" font-size="11" fill="#27ae60" text-anchor="middle">Успіх = Прошивка автентична</text>

  <!-- Блок 3.3: AES-XTS Акселератор -->
  <rect x="477" y="345" width="226" height="125" fill="#ffffff" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="590" y="365" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Крок 3: Дешифрування Flash</text>
  <text x="590" y="385" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">AES-XTS Cryptographic Engine</text>
  <text x="590" y="403" font-size="12" fill="#1a1a1a" text-anchor="middle">Зчитування eFuse XTS Key</text>
  <text x="590" y="421" font-size="12" fill="#2457d6" text-anchor="middle">Прозоре розшифрування блоків</text>
  <text x="590" y="439" font-size="11" fill="#6b7280" text-anchor="middle">Кеш / MMU прямого доступу</text>
  <text x="590" y="457" font-size="11" fill="#27ae60" text-anchor="middle">Запис у внутрішню пам'ять</text>

  <!-- ПАНЕЛЬ 4: IRAM / DRAM Execution -->
  <rect x="735" y="75" width="200" height="415" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="835" y="98" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Внутрішня IRAM / DRAM</text>
  <text x="835" y="116" font-size="12" fill="#6b7280" text-anchor="middle">Безпечне виконання</text>

  <!-- Блок 4.1: Дешифрований завантажник -->
  <rect x="747" y="130" width="176" height="125" fill="#ffffff" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="835" y="150" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Decrypted IRAM Image</text>
  <text x="835" y="168" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2nd Stage Bootloader</text>
  <text x="835" y="186" font-size="12" fill="#1a1a1a" text-anchor="middle">Відкритий бінарний код</text>
  <text x="835" y="204" font-size="12" fill="#27ae60" text-anchor="middle">Готовий до виконання</text>
  <text x="835" y="222" font-size="11" fill="#6b7280" text-anchor="middle">Захищено від зчитування</text>
  <text x="835" y="240" font-size="11" fill="#c0392b" text-anchor="middle">JTAG заблоковано eFuse</text>

  <!-- Блок 4.2: Передача контролю -->
  <rect x="747" y="275" width="176" height="100" fill="#ffffff" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="835" y="295" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Передача контролю</text>
  <text x="835" y="315" font-size="12" fill="#2457d6" text-anchor="middle">ROM Bootloader -&gt; 2nd BL</text>
  <text x="835" y="335" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Запуск Application (app)</text>
  <text x="835" y="355" font-size="11" fill="#27ae60" text-anchor="middle">Ланцюжок довіри OK!</text>

  <!-- Блок 4.3: Обробка помилок -->
  <rect x="747" y="395" width="176" height="75" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="835" y="415" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Помилка верифікації</text>
  <text x="835" y="433" font-size="11" fill="#c0392b" text-anchor="middle">Невідповідність підпису</text>
  <text x="835" y="453" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Блокування запуску (Halt)</text>

  <!-- ЗВ'ЯЗКИ ТА СТРІЛКИ (ПІДКЛЮЧЕННЯ) -->
  <!-- 1. eFuse Digest -&gt; ROM Step 1 (SHA-256 Digest Check) через міжблоковий канал y=212 -->
  <path d="M 213,283 L 235,283 L 235,212 L 455,212 L 455,175 L 477,175" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- 2. SPI Flash Signature Block -&gt; ROM Step 1 &amp; Step 2 -->
  <path d="M 433,403 L 455,403 L 455,280 L 477,280" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- 3. eFuse Flash Encryption Key -&gt; ROM Step 3 (AES-XTS Accelerator) -->
  <path d="M 213,410 L 235,410 L 235,475 L 455,475 L 455,407 L 477,407" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- 4. SPI Flash Encrypted Bootloader -&gt; ROM Step 3 (AES-XTS) -->
  <path d="M 433,275 L 450,275 L 450,390 L 477,390" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- 5. ROM Step 3 (AES-XTS) -&gt; IRAM Image -->
  <path d="M 703,425 L 725,425 L 725,190 L 747,190" fill="none" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- 6. IRAM Image -&gt; Передача контролю -->
  <path d="M 835,255 L 835,275" fill="none" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- 7. ROM Step 2 -&gt; Error Halt (Червона пунктирна стрілка помилки) -->
  <path d="M 703,280 L 725,280 L 725,432 L 747,432" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
</svg>
