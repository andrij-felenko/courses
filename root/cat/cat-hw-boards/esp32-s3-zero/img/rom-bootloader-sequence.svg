<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Послідовність сигналів для входу в режим ROM Bootloader (ESP32-S3)</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Утримання BOOT під час скидання через RST гарантує зчитування GPIO0=0 та запуск завантажника</text>

  <!-- Основна панель часової діаграми -->
  <rect x="30" y="80" width="900" height="255" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="103" font-size="13" font-weight="bold" fill="#1a1a1a">Часова діаграма сигналів (Timing Diagram):</text>

  <!-- Вертикальні сітки часових інтервалів (проходять крізь просвіти між блоками) -->
  <line x1="326" y1="115" x2="326" y2="280" stroke="#9ca3af" stroke-dasharray="3,3"/>
  <line x1="448" y1="115" x2="448" y2="280" stroke="#9ca3af" stroke-dasharray="3,3"/>
  <line x1="570" y1="115" x2="570" y2="280" stroke="#2457d6" stroke-dasharray="4,4" stroke-width="1.5"/>
  <line x1="707" y1="115" x2="707" y2="280" stroke="#9ca3af" stroke-dasharray="3,3"/>

  <!-- Рядок 1: BOOT (GPIO0) -->
  <rect x="50" y="118" width="130" height="34" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="115" y="139" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">BOOT (GPIO0)</text>

  <path d="M 200,125 L 326,125 L 326,150 L 707,150 L 707,125 L 910,125" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <text x="263" y="120" font-size="11" fill="#6b7280" text-anchor="middle">HIGH (3.3V)</text>
  <text x="387" y="145" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">LOW (0V)</text>
  <text x="509" y="145" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">BOOT затиснуто</text>
  <text x="638" y="145" font-size="11" fill="#2457d6" text-anchor="middle">Утримання 0 В</text>
  <text x="808" y="120" font-size="11" fill="#6b7280" text-anchor="middle">HIGH (3.3V)</text>

  <!-- Рядок 2: RST (CHIP_PU) -->
  <rect x="50" y="172" width="130" height="34" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="115" y="193" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">RST (CHIP_PU)</text>

  <path d="M 200,179 L 448,179 L 448,204 L 570,204 L 570,179 L 910,179" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="260" y="174" font-size="11" fill="#6b7280" text-anchor="middle">HIGH (3.3V)</text>
  <text x="387" y="174" font-size="11" fill="#6b7280" text-anchor="middle">HIGH (3.3V)</text>
  <text x="509" y="199" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Імпульс RST</text>
  <text x="638" y="174" font-size="11" fill="#6b7280" text-anchor="middle">HIGH (3.3V)</text>
  <text x="808" y="174" font-size="11" fill="#6b7280" text-anchor="middle">HIGH (3.3V)</text>

  <!-- Рядок 3: Режим МК -->
  <rect x="50" y="226" width="130" height="34" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="115" y="247" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Режим МК</text>

  <rect x="200" y="226" width="120" height="34" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="260" y="247" font-size="12" fill="#1a1a1a" text-anchor="middle">Нормальна робота</text>

  <rect x="332" y="226" width="110" height="34" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="387" y="247" font-size="12" fill="#2457d6" text-anchor="middle">Готовність RST</text>

  <rect x="454" y="226" width="110" height="34" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="509" y="247" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Скидання МК</text>

  <rect x="576" y="226" width="125" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="638" y="247" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Запуск Bootloader</text>

  <rect x="713" y="226" width="197" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="811" y="247" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">ROM Bootloader (USB CDC)</text>

  <!-- Рядок 4: Подія / Дія -->
  <rect x="50" y="280" width="130" height="34" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="115" y="301" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Подія / Дія</text>

  <rect x="260" y="280" width="130" height="34" rx="17" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="325" y="301" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Затиснути BOOT</text>

  <rect x="405" y="280" width="110" height="34" rx="17" fill="#fdecea" stroke="#c0392b"/>
  <text x="460" y="301" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">2. Натиснути RST</text>

  <rect x="530" y="280" width="130" height="34" rx="17" fill="#2457d6" stroke="#2457d6"/>
  <text x="595" y="293" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">3. Відпустити RST</text>
  <text x="595" y="307" font-size="11" fill="#ffffff" text-anchor="middle">МК фіксує GPIO0=0</text>

  <rect x="675" y="280" width="130" height="34" rx="17" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="740" y="301" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">4. Відпустити BOOT</text>

  <!-- Нижня панель: Кроки дій користувача -->
  <rect x="40" y="355" width="190" height="120" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="85" y="367" width="100" height="24" rx="12" fill="#2457d6"/>
  <text x="135" y="383" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">КРОК 1</text>
  <text x="135" y="410" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Затиснути BOOT</text>
  <text x="135" y="432" font-size="12" fill="#6b7280" text-anchor="middle">Подати 0 В на GPIO0</text>
  <text x="135" y="452" font-size="12" fill="#6b7280" text-anchor="middle">і утримувати</text>

  <line x1="236" y1="415" x2="264" y2="415" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="270" y="355" width="190" height="120" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="315" y="367" width="100" height="24" rx="12" fill="#c0392b"/>
  <text x="365" y="383" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">КРОК 2</text>
  <text x="365" y="410" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Коротко RST</text>
  <text x="365" y="432" font-size="12" fill="#6b7280" text-anchor="middle">Імпульс скидання МК</text>
  <text x="365" y="452" font-size="12" fill="#6b7280" text-anchor="middle">(BOOT утримується)</text>

  <line x1="466" y1="415" x2="494" y2="415" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="500" y="355" width="190" height="120" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="545" y="367" width="100" height="24" rx="12" fill="#2457d6"/>
  <text x="595" y="383" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">КРОК 3</text>
  <text x="595" y="410" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Відпустити RST</text>
  <text x="595" y="432" font-size="12" fill="#6b7280" text-anchor="middle">МК фіксує GPIO0 = 0</text>
  <text x="595" y="452" font-size="12" fill="#6b7280" text-anchor="middle">при запуску ROM</text>

  <line x1="696" y1="415" x2="724" y2="415" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

  <rect x="730" y="355" width="190" height="120" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <rect x="775" y="367" width="100" height="24" rx="12" fill="#27ae60"/>
  <text x="825" y="383" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">КРОК 4</text>
  <text x="825" y="410" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Відпустити BOOT</text>
  <text x="825" y="432" font-size="12" fill="#27ae60" text-anchor="middle">Плата готова до</text>
  <text x="825" y="452" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">прошивки (USB CDC)!</text>
</svg>
