<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Потік даних бездротового мосту ESP32-S3-Zero</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">Прийом телеметрії з ефіру, обробка мостом, RMT-індикація та вивід у USB CDC</text>

  <!-- Box 1: Wireless Air / Source -->
  <rect x="25" y="90" width="180" height="380" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="115" y="118" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Бездротовий ефір</text>
  <text x="115" y="136" font-size="12" fill="#6b7280" text-anchor="middle">(Wi-Fi / BLE джерело)</text>

  <!-- Sub-box 1.1: Sensor / Client -->
  <rect x="35" y="155" width="160" height="110" fill="#ffffff" stroke="#2457d6" stroke-width="1" rx="6"/>
  <text x="115" y="180" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">BLE / Wi-Fi Клієнт</text>
  <text x="115" y="205" font-size="12" fill="#1a1a1a" text-anchor="middle">Датчик телеметрії</text>
  <text x="115" y="228" font-size="12" fill="#6b7280" text-anchor="middle">Пакет: Data Payload</text>
  <text x="115" y="250" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">[ Періодична TX ]</text>

  <!-- Flow 1.1 -> 1.2 -->
  <line x1="115" y1="265" x2="115" y2="292" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3" marker-end="url(#arr-blue)"/>
  <text x="123" y="283" font-size="12" fill="#6b7280" text-anchor="start">TX пакети</text>

  <!-- Sub-box 1.2: Radio Channel -->
  <rect x="35" y="300" width="160" height="150" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" stroke-dasharray="4" rx="6"/>
  <text x="115" y="325" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Радіоканал 2.4 ГГц</text>
  <text x="115" y="350" font-size="12" fill="#1a1a1a" text-anchor="middle">Wi-Fi 802.11 b/g/n</text>
  <text x="115" y="372" font-size="12" fill="#1a1a1a" text-anchor="middle">або BLE 5.0 (Mesh)</text>
  <text x="115" y="394" font-size="12" fill="#6b7280" text-anchor="middle">Бездротове середовище</text>
  <text x="115" y="425" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">[ Ефірний пакет ]</text>

  <!-- Flow Air -> MCU -->
  <line x1="195" y1="375" x2="257" y2="375" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="226" y="362" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">RF-кадри</text>

  <!-- Box 2: ESP32-S3-Zero Microcontroller -->
  <rect x="245" y="90" width="460" height="380" fill="#ffffff" stroke="#2457d6" stroke-width="2" rx="10"/>
  <text x="475" y="118" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">Плата ESP32-S3-Zero (MCU)</text>
  <text x="475" y="136" font-size="12" fill="#6b7280" text-anchor="middle">Двоядерний LX7 + Нативний USB + RMT периферія</text>

  <!-- Sub-box 2.1: Wi-Fi / BLE Subsystem -->
  <rect x="265" y="155" width="190" height="110" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="360" y="180" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Wi-Fi / BLE Модуль</text>
  <text x="360" y="205" font-size="12" fill="#1a1a1a" text-anchor="middle">Апаратний RF стек</text>
  <text x="360" y="228" font-size="12" fill="#6b7280" text-anchor="middle">Прийом радіокадрів</text>
  <text x="360" y="250" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Демаршалізація</text>

  <!-- Flow Wi-Fi -> Bridge Core -->
  <line x1="455" y1="210" x2="487" y2="210" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="471" y="198" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">RAW</text>

  <!-- Sub-box 2.2: Bridge Core Logic -->
  <rect x="495" y="155" width="190" height="110" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="590" y="180" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Обробник мосту (Core)</text>
  <text x="590" y="205" font-size="12" fill="#1a1a1a" text-anchor="middle">Маршрутизація даних</text>
  <text x="590" y="228" font-size="12" fill="#1a1a1a" text-anchor="middle">Формування пакетів</text>
  <text x="590" y="250" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Тригер RMT статусу</text>

  <!-- Flow Bridge Core -> RMT -->
  <path d="M 540,265 L 540,285 L 435,285 L 435,292" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="487.5" y="273" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">RMT Сигнал</text>

  <!-- Flow Bridge Core -> USB CDC -->
  <line x1="635" y1="265" x2="635" y2="292" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="643" y="283" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">CDC Data</text>

  <!-- Sub-box 2.3: RMT Controller & RGB LED -->
  <rect x="265" y="300" width="190" height="150" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="360" y="325" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">RMT та RGB Індикація</text>
  <text x="360" y="350" font-size="12" fill="#1a1a1a" text-anchor="middle">RMT генератор імпульсів</text>
  <text x="360" y="372" font-size="12" fill="#1a1a1a" text-anchor="middle">Протокол WS2812 (800 kHz)</text>
  <text x="360" y="394" font-size="12" fill="#6b7280" text-anchor="middle">Точні часові інтервали</text>
  <text x="360" y="425" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">[ RGB LED: Блимання ]</text>

  <!-- Sub-box 2.4: Native USB CDC Stack -->
  <rect x="495" y="300" width="190" height="150" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="590" y="325" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Нативний USB CDC</text>
  <text x="590" y="350" font-size="12" fill="#1a1a1a" text-anchor="middle">USB Serial / JTAG</text>
  <text x="590" y="372" font-size="12" fill="#1a1a1a" text-anchor="middle">CDC Віртуальний COM</text>
  <text x="590" y="394" font-size="12" fill="#6b7280" text-anchor="middle">Без зовнішніх перетворювачів</text>
  <text x="590" y="425" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">[ Апаратний USB OTG ]</text>

  <!-- Flow MCU -> Host PC -->
  <line x1="685" y1="375" x2="762" y2="375" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="723.5" y="362" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">USB Type-C</text>

  <!-- Box 3: Host PC -->
  <rect x="755" y="90" width="180" height="380" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="845" y="118" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Хост-комп'ютер</text>
  <text x="845" y="136" font-size="12" fill="#6b7280" text-anchor="middle">(USB Host / ПК)</text>

  <!-- Sub-box 3.1: CDC Driver -->
  <rect x="770" y="155" width="150" height="110" fill="#ffffff" stroke="#2457d6" stroke-width="1" rx="6"/>
  <text x="845" y="180" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">USB CDC Драйвер</text>
  <text x="845" y="205" font-size="12" fill="#1a1a1a" text-anchor="middle">Порт: /dev/ttyACM0</text>
  <text x="845" y="228" font-size="12" fill="#6b7280" text-anchor="middle">або COM-порт (Win)</text>
  <text x="845" y="250" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">[ Потік символів ]</text>

  <!-- Flow 3.1 -> 3.2 -->
  <line x1="845" y1="265" x2="845" y2="292" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3" marker-end="url(#arr-blue)"/>
  <text x="853" y="283" font-size="12" fill="#6b7280" text-anchor="start">VCP потік</text>

  <!-- Sub-box 3.2: Application -->
  <rect x="770" y="300" width="150" height="150" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="6"/>
  <text x="845" y="325" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Прикладна програма</text>
  <text x="845" y="350" font-size="12" fill="#1a1a1a" text-anchor="middle">Монітор телеметрії</text>
  <text x="845" y="372" font-size="12" fill="#1a1a1a" text-anchor="middle">Запис логів / БД</text>
  <text x="845" y="394" font-size="12" fill="#6b7280" text-anchor="middle">Консоль чи GUI додаток</text>
  <text x="845" y="425" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">[ Обробка даних ]</text>
</svg>
