  <line x1="400" y1="160" x2="464" y2="160" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="400" y1="440" x2="464" y2="440" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="452" y1="160" x2="452" y2="440" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-start)" marker-end="url(#arr)"/>
  <text x="458" y="305" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">H = 23.50 мм</text>

  <!-- Panel 1: Central Keepout Area -->
  <rect x="228" y="325" width="104" height="70" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="280" y="345" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Зона заборони</text>
  <text x="280" y="362" font-size="12" fill="#c0392b" text-anchor="middle">Без міді й трас</text>
  <text x="280" y="379" font-size="12" fill="#6b7280" text-anchor="middle">(Keepout Area)</text>

  <!-- Panel 1: Bottom Pads (5 pins) -->
  <rect x="198" y="424" width="12" height="32" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M 199,440 A 5,5 0 0,0 209,440 Z" fill="#f4f6f8" stroke="#2457d6" stroke-width="1"/>
  <text x="204" y="416" font-size="12" fill="#6b7280" text-anchor="middle">GND</text>

  <rect x="236" y="424" width="12" height="32" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M 237,440 A 5,5 0 0,0 247,440 Z" fill="#f4f6f8" stroke="#2457d6" stroke-width="1"/>
  <text x="242" y="416" font-size="12" fill="#6b7280" text-anchor="middle">IO12</text>

  <rect x="274" y="424" width="12" height="32" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M 275,440 A 5,5 0 0,0 285,440 Z" fill="#f4f6f8" stroke="#2457d6" stroke-width="1"/>
  <text x="280" y="416" font-size="12" fill="#6b7280" text-anchor="middle">IO13</text>

  <rect x="312" y="424" width="12" height="32" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M 313,440 A 5,5 0 0,0 323,440 Z" fill="#f4f6f8" stroke="#2457d6" stroke-width="1"/>
  <text x="318" y="416" font-size="12" fill="#6b7280" text-anchor="middle">IO14</text>

  <rect x="350" y="424" width="12" height="32" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M 351,440 A 5,5 0 0,0 361,440 Z" fill="#f4f6f8" stroke="#2457d6" stroke-width="1"/>
  <text x="356" y="416" font-size="12" fill="#6b7280" text-anchor="middle">3V3</text>

  <!-- PANEL 2: Detailed Pad Geometry -->
  <rect x="570" y="80" width="360" height="420" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="590" y="100" font-size="14" font-weight="bold" fill="#1a1a1a">Параметри контактного майданчика</text>

  <!-- Panel 2: Board Edge Line Label -->
  <text x="710" y="122" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Край плати-модуля</text>

  <!-- Panel 2: Length Dimension L = 2.40 mm -->
  <text x="710" y="144" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">L = 2.40 мм (Довжина)</text>
  <line x1="630" y1="150" x2="630" y2="198" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="790" y1="150" x2="790" y2="198" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="630" y1="156" x2="790" y2="156" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-start)" marker-end="url(#arr)"/>

  <!-- Panel 2: Board Edge Dashed Line Segments (Clear of all text/lines) -->
  <line x1="710" y1="162" x2="710" y2="198" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Panel 2: Solder Mask Opening (Clearance +0.05 mm) -->
  <rect x="624" y="204" width="172" height="62" rx="4" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Panel 2: SMD Copper Pad -->
  <rect x="630" y="210" width="160" height="50" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>

  <!-- Panel 2: Castellated Hole on Module Edge -->
  <path d="M 710,205 A 30,30 0 0,0 710,265 Z" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <path d="M 710,210 A 25,25 0 0,0 710,260" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Panel 2: Paste Stencil Opening (1:1 window) -->
  <rect x="635" y="215" width="150" height="40" rx="2" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Panel 2: Board Edge Dashed Line Lower Segment -->
  <line x1="710" y1="270" x2="710" y2="282" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Panel 2: Pad Extension E = 0.60 mm Dimension (Bottom) -->
  <line x1="710" y1="260" x2="710" y2="288" stroke="#2457d6" stroke-width="1"/>
  <line x1="790" y1="260" x2="790" y2="288" stroke="#2457d6" stroke-width="1"/>
  <line x1="710" y1="288" x2="790" y2="288" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue-start)" marker-end="url(#arr-blue)"/>
  <text x="750" y="306" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">E = 0.60 мм (Винос)</text>

  <!-- Panel 2: Pad Width W = 1.00 mm Dimension (Right) -->
  <line x1="790" y1="210" x2="842" y2="210" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="790" y1="260" x2="842" y2="260" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="836" y1="210" x2="836" y2="260" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-start)" marker-end="url(#arr)"/>
  <text x="844" y="239" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">W = 1.00 мм</text>

  <!-- Panel 2: Divider Line -->
  <line x1="590" y1="335" x2="910" y2="335" stroke="#d0d7de" stroke-width="1"/>

  <!-- Panel 2: Legend / Specs List -->
  <rect x="590" y="348" width="14" height="14" rx="2" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="612" y="360" font-size="12" fill="#1a1a1a">Масковий зазор: +0.05 мм (Clearance)</text>

  <rect x="590" y="373" width="14" height="14" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="612" y="385" font-size="12" fill="#1a1a1a">Вікно пасти: 1:1 (або 90% площі)</text>

  <rect x="590" y="398" width="14" height="14" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="612" y="410" font-size="12" fill="#1a1a1a">Майданчик материнки (SMD Pad)</text>

  <text x="590" y="436" font-size="12" font-weight="bold" fill="#1a1a1a">Напів-отвір плати: Ø 0.80–0.90 мм</text>
  <text x="590" y="456" font-size="12" fill="#6b7280">Радіус скруглення кутів: R = 0.20 мм</text>
  <text x="590" y="476" font-size="12" fill="#6b7280">Рекомендована товщина трафарету: 0.12 мм</text>
</svg>
