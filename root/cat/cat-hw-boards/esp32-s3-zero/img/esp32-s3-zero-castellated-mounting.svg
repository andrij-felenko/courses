<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-accent-start" markerWidth="9" markerHeight="9" refX="1.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Header -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Монтаж ESP32-S3-Zero через castellated holes і зона відчуження антени</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Вимоги до геометрії паяльного шва та заборони міді (Keepout Zone) під керамічною антеною</text>

  <!-- Left Panel: Solder Joint Geometry (Cross-Section) -->
  <rect x="30" y="85" width="435" height="275" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="50" y="112" font-size="14" font-weight="bold" fill="#1a1a1a">1. Геометрія паяльного шва (Castellated Solder Joint)</text>

  <!-- Base Carrier PCB -->
  <rect x="50" y="270" width="395" height="30" rx="2" fill="#2d6a4f" stroke="#1b4332" stroke-width="1.5"/>
  <text x="60" y="290" font-size="12" font-weight="bold" fill="#ffffff">Материнська плата (Carrier)</text>

  <!-- Extended Copper Pad on Carrier PCB -->
  <rect x="180" y="262" width="170" height="8" rx="1" fill="#d4af37" stroke="#b8860b" stroke-width="1"/>

  <!-- Module PCB -->
  <rect x="50" y="225" width="215" height="37" rx="2" fill="#1e3d59" stroke="#17252a" stroke-width="1.5"/>
  <text x="60" y="247" font-size="12" font-weight="bold" fill="#ffffff">Плата ESP32-S3-Zero</text>

  <!-- Module Top Pad Ring -->
  <rect x="240" y="217" width="25" height="8" rx="1" fill="#d4af37" stroke="#b8860b" stroke-width="1"/>

  <!-- Plated Castellated Hole Barrel -->
  <path d="M 265 217 L 245 217 C 235 240 235 250 245 262 L 265 262" fill="none" stroke="#d4af37" stroke-width="3"/>

  <!-- Solder Fillet -->
  <path d="M 240 217 L 265 217 C 248 238 248 252 265 262 L 335 262 C 310 255 275 240 255 217 Z" fill="#95a5a6" stroke="#7f8c8d" stroke-width="1.5"/>

  <!-- Dimension line for Pad Extension -->
  <line x1="265" y1="320" x2="335" y2="320" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-accent-start)" marker-end="url(#arr-accent)"/>
  <line x1="265" y1="262" x2="265" y2="325" stroke="#2457d6" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="335" y1="262" x2="335" y2="325" stroke="#2457d6" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="300" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Виліт: 0.8–1.0 мм</text>

  <!-- Callouts on Left Panel -->
  <line x1="150" y1="164" x2="240" y2="212" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-main)"/>
  <rect x="65" y="142" width="155" height="22" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="142.5" y="157" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Крайовий напівшар</text>

  <line x1="350" y1="164" x2="292" y2="242" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-main)"/>
  <rect x="300" y="142" width="135" height="22" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="367.5" y="157" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Галтель припою</text>

  <!-- Right Panel: Antenna Keepout Zone (Top View) -->
  <rect x="495" y="85" width="435" height="275" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="515" y="112" font-size="14" font-weight="bold" fill="#1a1a1a">2. Зона відчуження під антеною (Keepout Zone)</text>

  <!-- Carrier PCB Top View -->
  <rect x="515" y="130" width="395" height="215" rx="6" fill="#e8ecef" stroke="#b0bec5" stroke-width="1.5"/>
  <text x="525" y="148" font-size="12" fill="#6b7280">Материнська плата (Carrier PCB)</text>

  <!-- Keepout Zone Overlay -->
  <rect x="525" y="160" width="95" height="160" rx="4" fill="#fdecea" fill-opacity="0.75" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Labels for Keepout Zone -->
  <rect x="530" y="170" width="85" height="30" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="572.5" y="183" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Зона відчуження</text>
  <text x="572.5" y="195" text-anchor="middle" font-size="11" fill="#c0392b">No Copper</text>

  <rect x="530" y="275" width="85" height="30" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="572.5" y="288" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Без міді / GND</text>
  <text x="572.5" y="300" text-anchor="middle" font-size="11" fill="#c0392b">на всіх шарах</text>

  <!-- ESP32-S3-Zero Module Outline -->
  <rect x="635" y="160" width="260" height="160" rx="4" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
  <text x="770" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">ESP32-S3-Zero</text>
  <text x="770" y="253" text-anchor="middle" font-size="12" fill="#94a3b8">4 МБ Flash / Type-C</text>

  <!-- Ceramic Antenna -->
  <rect x="638" y="195" width="28" height="90" rx="3" fill="#d97706" stroke="#92400e" stroke-width="1.5"/>
  <text x="652" y="244" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">ANT</text>

  <!-- Castellated Pads on Top & Bottom edges of Module -->
  <!-- Top Edge Pads -->
  <rect x="685" y="160" width="16" height="14" rx="2" fill="#d4af37" stroke="#b8860b" stroke-width="1"/>
  <rect x="713" y="160" width="16" height="14" rx="2" fill="#d4af37" stroke="#b8860b" stroke-width="1"/>
  <rect x="741" y="160" width="16" height="14" rx="2" fill="#d4af37" stroke="#b8860b" stroke-width="1"/>
  <rect x="769" y="160" width="16" height="14" rx="2" fill="#d4af37" stroke="#b8860b" stroke-width="1"/>
  <rect x="797" y="160" width="16" height="14" rx="2" fill="#d4af37" stroke="#b8860b" stroke-width="1"/>
  <rect x="825" y="160" width="16" height="14" rx="2" fill="#d4af37" stroke="#b8860b" stroke-width="1"/>
  <rect x="853" y="160" width="16" height="14" rx="2" fill="#d4af37" stroke="#b8860b" stroke-width="1"/>

  <!-- Bottom Edge Pads -->
  <rect x="685" y="306" width="16" height="14" rx="2" fill="#d4af37" stroke="#b8860b" stroke-width="1"/>
  <rect x="713" y="306" width="16" height="14" rx="2" fill="#d4af37" stroke="#b8860b" stroke-width="1"/>
  <rect x="741" y="306" width="16" height="14" rx="2" fill="#d4af37" stroke="#b8860b" stroke-width="1"/>
  <rect x="769" y="306" width="16" height="14" rx="2" fill="#d4af37" stroke="#b8860b" stroke-width="1"/>
  <rect x="797" y="306" width="16" height="14" rx="2" fill="#d4af37" stroke="#b8860b" stroke-width="1"/>
  <rect x="825" y="306" width="16" height="14" rx="2" fill="#d4af37" stroke="#b8860b" stroke-width="1"/>
  <rect x="853" y="306" width="16" height="14" rx="2" fill="#d4af37" stroke="#b8860b" stroke-width="1"/>

  <!-- Bottom Panel Left: Wrong Implementation -->
  <rect x="30" y="375" width="435" height="160" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <path d="M 30 383 a 8 8 0 0 1 8 -8 h 419 a 8 8 0 0 1 8 8 v 24 h -435 z" fill="#c0392b"/>
  <text x="247.5" y="398" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">⛔ Помилка: Мідь під антеною та короткі майданчики</text>

  <text x="45" y="428" font-size="12" font-weight="bold" fill="#c0392b">1. Наявність полігону GND чи трас під антеною</text>
  <text x="60" y="446" font-size="12" fill="#1a1a1a">Спричиняє розстройку (детюнінг) та падіння рівня RF-сигналу.</text>

  <text x="45" y="475" font-size="12" font-weight="bold" fill="#c0392b">2. Майданчики несучої плати без вилету назовні</text>
  <text x="60" y="493" font-size="12" fill="#1a1a1a">Не дозволяють сформувати галтель і перевірити якість пайки.</text>

  <!-- Bottom Panel Right: Correct Implementation -->
  <rect x="495" y="375" width="435" height="160" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <path d="M 495 383 a 8 8 0 0 1 8 -8 h 419 a 8 8 0 0 1 8 8 v 24 h -435 z" fill="#27ae60"/>
  <text x="712.5" y="398" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">✓ Норма: Зона відчуження міді та виліт майданчиків</text>

  <text x="510" y="428" font-size="12" font-weight="bold" fill="#27ae60">1. Повне вилучення міді (Keepout) на всіх шарах</text>
  <text x="525" y="446" font-size="12" fill="#1a1a1a">Забезпечує максимальну дальність зв'язку Wi-Fi / Bluetooth.</text>

  <text x="510" y="475" font-size="12" font-weight="bold" fill="#27ae60">2. Винесення майданчиків на 0.8–1.0 мм за край</text>
  <text x="525" y="493" font-size="12" fill="#1a1a1a">Гарантує капілярне всмоктування припою та надійний шов.</text>
</svg>
