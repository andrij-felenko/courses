<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-start-red" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-start-green" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-start-blue" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Порівняння режимів шини SPI Flash (QIO, QOUT, DIO, DOUT)</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Режим DIO є стандартом для ESP32-CAM, оскільки лінії IO2 та IO3 задіяні для PSRAM</text>

  <!-- CARD 1: QIO -->
  <g id="card-qio">
    <rect x="35" y="75" width="430" height="195" rx="8" fill="#fdecea" stroke="#f5c6cb" stroke-width="1.5"/>
    <path d="M 35,83 A 8,8 0 0 1 43,75 L 457,75 A 8,8 0 0 1 465,83 L 465,107 L 35,107 Z" fill="#f8d7da"/>
    <line x1="35" y1="107" x2="465" y2="107" stroke="#f5c6cb" stroke-width="1"/>
    <text x="50" y="96" font-size="14" font-weight="bold" fill="#c0392b">QIO (Quad I/O)</text>
    <rect x="285" y="81" width="165" height="20" rx="4" fill="#c0392b"/>
    <text x="367" y="95" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">❌ Не для ESP32-CAM</text>

    <line x1="235" y1="115" x2="235" y2="260" stroke="#f5c6cb" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Mini wiring -->
    <rect x="45" y="130" width="55" height="110" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
    <text x="72.5" y="190" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ESP32</text>

    <rect x="170" y="130" width="55" height="110" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
    <text x="197.5" y="190" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">FLASH</text>

    <line x1="100" y1="145" x2="170" y2="145" stroke="#c0392b" stroke-width="2" marker-start="url(#arr-start-red)" marker-end="url(#arr-red)"/>
    <text x="135" y="140" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">IO0</text>

    <line x1="100" y1="170" x2="170" y2="170" stroke="#c0392b" stroke-width="2" marker-start="url(#arr-start-red)" marker-end="url(#arr-red)"/>
    <text x="135" y="165" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">IO1</text>

    <line x1="100" y1="195" x2="170" y2="195" stroke="#c0392b" stroke-width="2" marker-start="url(#arr-start-red)" marker-end="url(#arr-red)"/>
    <text x="135" y="190" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">IO2</text>

    <line x1="100" y1="220" x2="170" y2="220" stroke="#c0392b" stroke-width="2" marker-start="url(#arr-start-red)" marker-end="url(#arr-red)"/>
    <text x="135" y="215" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">IO3</text>

    <text x="135" y="254" font-size="12" fill="#6b7280" text-anchor="middle">4 лінії даних (Quad)</text>

    <!-- Spec list -->
    <text x="245" y="130" font-size="12" font-weight="bold" fill="#1a1a1a">• Адресація:</text>
    <text x="335" y="130" font-size="12" fill="#1a1a1a">4 біти / такт</text>

    <text x="245" y="155" font-size="12" font-weight="bold" fill="#1a1a1a">• Передача даних:</text>
    <text x="362" y="155" font-size="12" fill="#1a1a1a">4 біти / такт</text>

    <text x="245" y="180" font-size="12" font-weight="bold" fill="#1a1a1a">• Швидкість:</text>
    <text x="330" y="180" font-size="12" fill="#1a1a1a">Максимальна (100%)</text>

    <text x="245" y="205" font-size="12" font-weight="bold" fill="#c0392b">• Причина відмови:</text>
    <text x="255" y="225" font-size="12" fill="#c0392b">IO2/IO3 задіяні PSRAM</text>
    <text x="255" y="243" font-size="12" fill="#c0392b">і не виведені на Flash</text>
  </g>

  <!-- CARD 2: DIO -->
  <g id="card-dio">
    <rect x="495" y="75" width="430" height="195" rx="8" fill="#e9f7ef" stroke="#a3e4d7" stroke-width="2"/>
    <path d="M 495,83 A 8,8 0 0 1 503,75 L 917,75 A 8,8 0 0 1 925,83 L 925,107 L 495,107 Z" fill="#d4efdf"/>
    <line x1="495" y1="107" x2="925" y2="107" stroke="#a3e4d7" stroke-width="1"/>
    <text x="510" y="96" font-size="14" font-weight="bold" fill="#27ae60">DIO (Dual I/O)</text>
    <rect x="715" y="81" width="200" height="20" rx="4" fill="#27ae60"/>
    <text x="815" y="95" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">✅ СТАНДАРТ ESP32-CAM</text>

    <line x1="695" y1="115" x2="695" y2="260" stroke="#a3e4d7" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Mini wiring -->
    <rect x="505" y="130" width="55" height="110" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
    <text x="532.5" y="190" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ESP32</text>

    <rect x="630" y="130" width="55" height="110" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
    <text x="657.5" y="190" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">FLASH</text>

    <line x1="560" y1="145" x2="630" y2="145" stroke="#27ae60" stroke-width="2.5" marker-start="url(#arr-start-green)" marker-end="url(#arr-green)"/>
    <text x="595" y="140" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">IO0</text>

    <line x1="560" y1="170" x2="630" y2="170" stroke="#27ae60" stroke-width="2.5" marker-start="url(#arr-start-green)" marker-end="url(#arr-green)"/>
    <text x="595" y="165" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">IO1</text>

    <line x1="560" y1="195" x2="630" y2="195" stroke="#95a5a6" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="595" y="190" font-size="12" fill="#7f8c8d" text-anchor="middle">IO2 (PSRAM)</text>

    <line x1="560" y1="220" x2="630" y2="220" stroke="#95a5a6" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="595" y="215" font-size="12" fill="#7f8c8d" text-anchor="middle">IO3 (PSRAM)</text>

    <text x="595" y="254" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">2 лінії даних (Dual)</text>

    <!-- Spec list -->
    <text x="705" y="130" font-size="12" font-weight="bold" fill="#1a1a1a">• Адресація:</text>
    <text x="795" y="130" font-size="12" fill="#1a1a1a">2 біти / такт (IO0-1)</text>

    <text x="705" y="155" font-size="12" font-weight="bold" fill="#1a1a1a">• Передача даних:</text>
    <text x="822" y="155" font-size="12" fill="#1a1a1a">2 біти / такт</text>

    <text x="705" y="180" font-size="12" font-weight="bold" fill="#1a1a1a">• Швидкість:</text>
    <text x="790" y="180" font-size="12" fill="#1a1a1a">Висока (~85% QIO)</text>

    <text x="705" y="205" font-size="12" font-weight="bold" fill="#27ae60">• Прапор esptool:</text>
    <text x="715" y="225" font-size="12" font-weight="bold" fill="#2457d6">--flash_mode dio</text>
    <text x="715" y="243" font-size="12" fill="#27ae60">Вільні IO2/IO3 для PSRAM</text>
  </g>

  <!-- CARD 3: QOUT -->
  <g id="card-qout">
    <rect x="35" y="285" width="430" height="195" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <path d="M 35,293 A 8,8 0 0 1 43,285 L 457,285 A 8,8 0 0 1 465,293 L 465,317 L 35,317 Z" fill="#e5e7eb"/>
    <line x1="35" y1="317" x2="465" y2="317" stroke="#d0d7de" stroke-width="1"/>
    <text x="50" y="306" font-size="14" font-weight="bold" fill="#1a1a1a">QOUT (Quad Output)</text>
    <rect x="285" y="291" width="165" height="20" rx="4" fill="#6b7280"/>
    <text x="367" y="305" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">❌ Потрібні IO2/IO3</text>

    <line x1="235" y1="325" x2="235" y2="470" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Mini wiring -->
    <rect x="45" y="340" width="55" height="110" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
    <text x="72.5" y="400" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ESP32</text>

    <rect x="170" y="340" width="55" height="110" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
    <text x="197.5" y="400" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">FLASH</text>

    <line x1="100" y1="355" x2="170" y2="355" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
    <text x="135" y="350" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">IO0 (Cmd/Addr)</text>

    <line x1="100" y1="380" x2="170" y2="380" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
    <text x="135" y="375" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">IO1 (Data)</text>

    <line x1="100" y1="405" x2="170" y2="405" stroke="#6b7280" stroke-width="2" marker-end="url(#arr-gray)"/>
    <text x="135" y="400" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">IO2 (Data)</text>

    <line x1="100" y1="430" x2="170" y2="430" stroke="#6b7280" stroke-width="2" marker-end="url(#arr-gray)"/>
    <text x="135" y="425" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">IO3 (Data)</text>

    <text x="135" y="464" font-size="12" fill="#6b7280" text-anchor="middle">1 біт адреса / 4 дані</text>

    <!-- Spec list -->
    <text x="245" y="340" font-size="12" font-weight="bold" fill="#1a1a1a">• Адресація:</text>
    <text x="335" y="340" font-size="12" fill="#1a1a1a">1 біт / такт (IO0)</text>

    <text x="245" y="365" font-size="12" font-weight="bold" fill="#1a1a1a">• Передача даних:</text>
    <text x="362" y="365" font-size="12" fill="#1a1a1a">4 біти / такт</text>

    <text x="245" y="390" font-size="12" font-weight="bold" fill="#1a1a1a">• Швидкість:</text>
    <text x="330" y="390" font-size="12" fill="#1a1a1a">Висока (~90% QIO)</text>

    <text x="245" y="415" font-size="12" font-weight="bold" fill="#6b7280">• Причина відмови:</text>
    <text x="255" y="435" font-size="12" fill="#c0392b">Вимагає ліній IO2 та IO3</text>
    <text x="255" y="453" font-size="12" fill="#c0392b">які зайняті в ESP32-CAM</text>
  </g>

  <!-- CARD 4: DOUT -->
  <g id="card-dout">
    <rect x="495" y="285" width="430" height="195" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <path d="M 495,293 A 8,8 0 0 1 503,285 L 917,285 A 8,8 0 0 1 925,293 L 925,317 L 495,317 Z" fill="#e5e7eb"/>
    <line x1="495" y1="317" x2="925" y2="317" stroke="#d0d7de" stroke-width="1"/>
    <text x="510" y="306" font-size="14" font-weight="bold" fill="#1a1a1a">DOUT (Dual Output)</text>
    <rect x="715" y="291" width="200" height="20" rx="4" fill="#d35400"/>
    <text x="815" y="305" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">⚠️ СУМІСНИЙ (РЕЗЕРВНИЙ)</text>

    <line x1="695" y1="325" x2="695" y2="470" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Mini wiring -->
    <rect x="505" y="340" width="55" height="110" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
    <text x="532.5" y="400" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ESP32</text>

    <rect x="630" y="340" width="55" height="110" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
    <text x="657.5" y="400" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">FLASH</text>

    <line x1="560" y1="355" x2="630" y2="355" stroke="#2457d6" stroke-width="2" marker-start="url(#arr-start-blue)" marker-end="url(#arr-blue)"/>
    <text x="595" y="350" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">IO0 (Cmd/Addr)</text>

    <line x1="560" y1="380" x2="630" y2="380" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
    <text x="595" y="375" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">IO1 (Data)</text>

    <line x1="560" y1="405" x2="630" y2="405" stroke="#95a5a6" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="595" y="400" font-size="12" fill="#7f8c8d" text-anchor="middle">IO2 (Н/З)</text>

    <line x1="560" y1="430" x2="630" y2="430" stroke="#95a5a6" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="595" y="425" font-size="12" fill="#7f8c8d" text-anchor="middle">IO3 (Н/З)</text>

    <text x="595" y="464" font-size="12" fill="#6b7280" text-anchor="middle">1 біт адреса / 2 дані</text>

    <!-- Spec list -->
    <text x="705" y="340" font-size="12" font-weight="bold" fill="#1a1a1a">• Адресація:</text>
    <text x="795" y="340" font-size="12" fill="#1a1a1a">1 біт / такт (IO0)</text>

    <text x="705" y="365" font-size="12" font-weight="bold" fill="#1a1a1a">• Передача даних:</text>
    <text x="822" y="365" font-size="12" fill="#1a1a1a">2 біти / такт</text>

    <text x="705" y="390" font-size="12" font-weight="bold" fill="#1a1a1a">• Швидкість:</text>
    <text x="790" y="390" font-size="12" fill="#1a1a1a">Базова (~70% QIO)</text>

    <text x="705" y="415" font-size="12" font-weight="bold" fill="#d35400">• Прапор esptool:</text>
    <text x="715" y="435" font-size="12" font-weight="bold" fill="#2457d6">--flash_mode dout</text>
    <text x="715" y="453" font-size="12" fill="#d35400">Працює, але повільніше DIO</text>
  </g>

  <!-- BOTTOM SUMMARY PANEL -->
  <g id="bottom-summary">
    <rect x="35" y="495" width="890" height="50" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="50" y="525" font-size="14" font-weight="bold" fill="#2457d6">💡 Ключовий висновок для розробника:</text>
    <text x="335" y="517" font-size="12" font-weight="bold" fill="#1a1a1a">Для ESP32-CAM ЗАВЖДИ вказуйте параметр <tspan fill="#2457d6">--flash_mode dio</tspan> в esptool.</text>
    <text x="335" y="535" font-size="12" fill="#6b7280">Режими QIO/QOUT викликають Bootloop через конфлікт ліній IO2/IO3 з мікросхемою PSRAM.</text>
  </g>
</svg>
