<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-red-start" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Header -->
  <text x="480" y="35" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма автоскидання ESP32-CAM (DTR / RTS)</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Послідовність сигналів для автоматичного завантаження в режим ROM Bootloader</text>

  <!-- Main Panel -->
  <rect x="30" y="85" width="900" height="435" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="10"/>

  <!-- Phase Headers -->
  <text x="270" y="108" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">1. Спокій</text>
  <text x="390" y="108" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">2. Вибір Boot</text>
  <text x="515" y="108" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">3. Скидання EN</text>
  <text x="650" y="108" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">4. Фіксація Boot</text>
  <text x="795" y="108" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">5. Прошивання</text>

  <!-- Vertical Phase Dividers -->
  <line x1="210" y1="115" x2="210" y2="412" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="330" y1="115" x2="330" y2="412" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="450" y1="115" x2="450" y2="412" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="580" y1="115" x2="580" y2="412" stroke="#27ae60" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="720" y1="115" x2="720" y2="412" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="870" y1="115" x2="870" y2="412" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Left Column Labels -->
  <!-- DTR -->
  <text x="45" y="150" font-size="14" font-weight="bold" fill="#1a1a1a">DTR</text>
  <text x="45" y="166" font-size="12" fill="#6b7280">(сигнал UART)</text>

  <!-- RTS -->
  <text x="45" y="225" font-size="14" font-weight="bold" fill="#1a1a1a">RTS</text>
  <text x="45" y="241" font-size="12" fill="#6b7280">(сигнал UART)</text>

  <!-- EN -->
  <text x="45" y="300" font-size="14" font-weight="bold" fill="#2457d6">EN</text>
  <text x="45" y="316" font-size="12" fill="#6b7280">(Reset / Chip Enable)</text>

  <!-- GPIO0 -->
  <text x="45" y="375" font-size="14" font-weight="bold" fill="#27ae60">GPIO0</text>
  <text x="45" y="391" font-size="12" fill="#6b7280">(Boot Select)</text>

  <!-- Logic State Markers (0 / 1) -->
  <text x="198" y="139" font-size="12" fill="#6b7280" text-anchor="end">1</text>
  <text x="198" y="174" font-size="12" fill="#6b7280" text-anchor="end">0</text>

  <text x="198" y="214" font-size="12" fill="#6b7280" text-anchor="end">1</text>
  <text x="198" y="249" font-size="12" fill="#6b7280" text-anchor="end">0</text>

  <text x="198" y="289" font-size="12" fill="#6b7280" text-anchor="end">1</text>
  <text x="198" y="324" font-size="12" fill="#6b7280" text-anchor="end">0</text>

  <text x="198" y="369" font-size="12" fill="#6b7280" text-anchor="end">1</text>
  <text x="198" y="404" font-size="12" fill="#6b7280" text-anchor="end">0</text>

  <!-- Waveforms -->
  <!-- DTR Signal -->
  <path d="M 210,170 L 330,170 L 330,135 L 450,135 L 450,170 L 580,170 L 580,135 L 720,135 L 720,170 L 870,170" fill="none" stroke="#4b5563" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- RTS Signal -->
  <path d="M 210,245 L 450,245 L 450,210 L 580,210 L 580,245 L 870,245" fill="none" stroke="#4b5563" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- EN Signal (Reset) -->
  <path d="M 210,285 L 450,285 L 450,320 L 580,320 L 580,285 L 870,285" fill="none" stroke="#2457d6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- GPIO0 Signal (Boot Select) -->
  <path d="M 210,365 L 330,365 L 330,400 L 450,400 L 450,365 L 580,365 L 580,400 L 720,400 L 720,365 L 870,365" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Annotations on Waveforms -->
  <!-- Phase 2: GPIO0 prepared LOW -->
  <text x="390" y="385" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">GPIO0 = 0</text>

  <!-- Phase 3: RESET Pulse -->
  <line x1="465" y1="338" x2="565" y2="338" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-red-start)" marker-end="url(#arr-red)"/>
  <text x="515" y="354" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Скидання (EN = 0)</text>

  <!-- Critical Highlight at T3 -->
  <circle cx="580" cy="285" r="6" fill="#27ae60" stroke="white" stroke-width="2"/>
  <circle cx="580" cy="400" r="6" fill="#27ae60" stroke="white" stroke-width="2"/>

  <!-- Time Axis Labels -->
  <text x="210" y="423" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">t₀</text>
  <text x="330" y="423" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">t₁</text>
  <text x="450" y="423" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">t₂</text>
  <text x="580" y="423" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">t₃</text>
  <text x="720" y="423" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">t₄</text>
  <text x="870" y="423" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">t₅</text>

  <!-- Bottom Informational Cards -->
  <!-- Left Card: Logic Formulas -->
  <rect x="45" y="438" width="300" height="67" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="55" y="456" font-size="13" font-weight="bold" fill="#1d4ed8">Схема автоскидання:</text>
  <text x="55" y="474" font-size="12" fill="#1a1a1a">EN = !(RTS &amp; !DTR)  [активний LOW]</text>
  <text x="55" y="492" font-size="12" fill="#1a1a1a">GPIO0 = !(DTR &amp; !RTS) [активний LOW]</text>

  <!-- Right Card: Key Concept Callout -->
  <rect x="360" y="438" width="525" height="67" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="375" y="456" font-size="13" font-weight="bold" fill="#1e7e34">Ключовий момент (вхід у Bootloader):</text>
  <text x="375" y="474" font-size="12" fill="#1a1a1a">При t = t₃ зростаючий фронт EN (0 → 1) зчитує стан GPIO0 = 0</text>
  <text x="375" y="492" font-size="12" fill="#1a1a1a">ESP32 фіксує режим завантаження ROM Bootloader (UART Download)</text>
</svg>
