<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Definitions -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розпіновка та периферія плати WeAct ESP32-C6-Mini</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Призначення виводів, ADC-канали, інтерфейси та застереження для страпінг-пінів</text>

  <!-- Legend Panel -->
  <rect x="60" y="66" width="840" height="38" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  
  <rect x="75" y="78" width="14" height="14" rx="2" fill="#c0392b"/>
  <text x="95" y="90" font-size="12" fill="#1a1a1a">Живлення / Земля</text>

  <rect x="235" y="78" width="14" height="14" rx="2" fill="#27ae60"/>
  <text x="255" y="90" font-size="12" fill="#1a1a1a">ADC1 (Аналогові)</text>

  <rect x="390" y="78" width="14" height="14" rx="2" fill="#2457d6"/>
  <text x="410" y="90" font-size="12" fill="#1a1a1a">I2C / UART / USB</text>

  <rect x="545" y="78" width="14" height="14" rx="2" fill="#d97706"/>
  <text x="565" y="90" font-size="12" fill="#1a1a1a">Strapping (GPIO8/9/15)</text>

  <!-- PCB Body -->
  <rect x="410" y="118" width="140" height="344" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  
  <!-- PCB Silkscreen & Logo -->
  <text x="480" y="142" font-size="12" font-weight="bold" fill="#e2e8f0" text-anchor="middle">WeAct ESP32-C6</text>
  <text x="480" y="156" font-size="10" fill="#94a3b8" text-anchor="middle">MINI-1 Board</text>

  <!-- ESP32-C6 Module -->
  <rect x="435" y="172" width="90" height="90" rx="4" fill="#334155" stroke="#475569" stroke-width="1.5"/>
  <path d="M 445 172 L 445 180 L 515 180 L 515 172 Z" fill="#475569"/>
  <text x="480" y="215" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">ESP32-C6</text>
  <text x="480" y="233" font-size="11" fill="#94a3b8" text-anchor="middle">FH4 / 4MB</text>
  <text x="480" y="248" font-size="10" fill="#64748b" text-anchor="middle">Wi-Fi 6 / BLE 5</text>

  <!-- Onboard Components -->
  <!-- RGB LED -->
  <rect x="470" y="335" width="20" height="16" rx="3" fill="#22c55e" stroke="#16a34a" stroke-width="1"/>
  <text x="480" y="347" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">RGB</text>

  <!-- BOOT & RST Buttons -->
  <rect x="424" y="370" width="34" height="20" rx="3" fill="#475569" stroke="#64748b" stroke-width="1"/>
  <text x="441" y="384" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">BOOT</text>

  <rect x="502" y="370" width="34" height="20" rx="3" fill="#475569" stroke="#64748b" stroke-width="1"/>
  <text x="519" y="384" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">RST</text>

  <!-- USB-C Connector -->
  <rect x="445" y="415" width="70" height="32" rx="4" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
  <rect x="455" y="423" width="50" height="16" rx="3" fill="#475569"/>
  <text x="480" y="435" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">USB-C</text>

  <!-- Left Header Pins & Lines -->
  <!-- Pin 1: 5V -->
  <line x1="375" y1="160" x2="415" y2="160" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="415" y="155" width="10" height="10" rx="2" fill="#eab308"/>
  <rect x="315" y="150" width="60" height="20" rx="3" fill="#c0392b"/>
  <text x="345" y="164" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">5V</text>
  <text x="300" y="164" font-size="12" fill="#1a1a1a" text-anchor="end">Вхід живлення VBUS (5.0V)</text>

  <!-- Pin 2: GND -->
  <line x1="375" y1="186" x2="415" y2="186" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="415" y="181" width="10" height="10" rx="2" fill="#eab308"/>
  <rect x="315" y="176" width="60" height="20" rx="3" fill="#1a1a1a"/>
  <text x="345" y="190" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">GND</text>
  <text x="300" y="190" font-size="12" fill="#1a1a1a" text-anchor="end">Спільна земля (0V Ground)</text>

  <!-- Pin 3: 3V3 -->
  <line x1="375" y1="212" x2="415" y2="212" stroke="#d97706" stroke-width="1.5"/>
  <rect x="415" y="207" width="10" height="10" rx="2" fill="#eab308"/>
  <rect x="315" y="202" width="60" height="20" rx="3" fill="#d97706"/>
  <text x="345" y="216" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3V3</text>
  <text x="300" y="216" font-size="12" fill="#1a1a1a" text-anchor="end">Вихід LDO 3.3V (Живлення)</text>

  <!-- Pin 4: GPIO0 -->
  <line x1="375" y1="238" x2="415" y2="238" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="415" y="233" width="10" height="10" rx="2" fill="#eab308"/>
  <rect x="315" y="228" width="60" height="20" rx="3" fill="#27ae60"/>
  <text x="345" y="242" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">GPIO0</text>
  <text x="300" y="242" font-size="12" fill="#1a1a1a" text-anchor="end">ADC1_CH0 / LP_GPIO0</text>

  <!-- Pin 5: GPIO1 -->
  <line x1="375" y1="264" x2="415" y2="264" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="415" y="259" width="10" height="10" rx="2" fill="#eab308"/>
  <rect x="315" y="254" width="60" height="20" rx="3" fill="#27ae60"/>
  <text x="345" y="268" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">GPIO1</text>
  <text x="300" y="268" font-size="12" fill="#1a1a1a" text-anchor="end">ADC1_CH1 / LP_GPIO1</text>

  <!-- Pin 6: GPIO2 -->
  <line x1="375" y1="290" x2="415" y2="290" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="415" y="285" width="10" height="10" rx="2" fill="#eab308"/>
  <rect x="315" y="280" width="60" height="20" rx="3" fill="#27ae60"/>
  <text x="345" y="294" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">GPIO2</text>
  <text x="300" y="294" font-size="12" fill="#1a1a1a" text-anchor="end">ADC1_CH2 / FSPIQ</text>

  <!-- Pin 7: GPIO3 -->
  <line x1="375" y1="316" x2="415" y2="316" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="415" y="311" width="10" height="10" rx="2" fill="#eab308"/>
  <rect x="315" y="306" width="60" height="20" rx="3" fill="#27ae60"/>
  <text x="345" y="320" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">GPIO3</text>
  <text x="300" y="320" font-size="12" fill="#1a1a1a" text-anchor="end">ADC1_CH3 / FSPID</text>

  <!-- Pin 8: GPIO4 -->
  <line x1="375" y1="342" x2="415" y2="342" stroke="#d97706" stroke-width="1.5"/>
  <rect x="415" y="337" width="10" height="10" rx="2" fill="#eab308"/>
  <rect x="315" y="332" width="60" height="20" rx="3" fill="#d97706"/>
  <text x="345" y="346" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">GPIO4</text>
  <text x="300" y="346" font-size="12" fill="#1a1a1a" text-anchor="end">ADC1_CH4 / MTMS (Strap)</text>

  <!-- Pin 9: GPIO5 -->
  <line x1="375" y1="368" x2="415" y2="368" stroke="#d97706" stroke-width="1.5"/>
  <rect x="415" y="363" width="10" height="10" rx="2" fill="#eab308"/>
  <rect x="315" y="358" width="60" height="20" rx="3" fill="#d97706"/>
  <text x="345" y="372" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">GPIO5</text>
  <text x="300" y="372" font-size="12" fill="#1a1a1a" text-anchor="end">ADC1_CH5 / MTDI (Strap)</text>

  <!-- Pin 10: GPIO6 -->
  <line x1="375" y1="394" x2="415" y2="394" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="415" y="389" width="10" height="10" rx="2" fill="#eab308"/>
  <rect x="315" y="384" width="60" height="20" rx="3" fill="#2457d6"/>
  <text x="345" y="398" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">GPIO6</text>
  <text x="300" y="398" font-size="12" fill="#1a1a1a" text-anchor="end">LP_GPIO6 / FSPICLK</text>

  <!-- Pin 11: GPIO7 -->
  <line x1="375" y1="420" x2="415" y2="420" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="415" y="415" width="10" height="10" rx="2" fill="#eab308"/>
  <rect x="315" y="410" width="60" height="20" rx="3" fill="#2457d6"/>
  <text x="345" y="424" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">GPIO7</text>
  <text x="300" y="424" font-size="12" fill="#1a1a1a" text-anchor="end">LP_GPIO7 / FSPICS0</text>


  <!-- Right Header Pins & Lines -->
  <!-- Pin 1: EN -->
  <line x1="535" y1="160" x2="585" y2="160" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="535" y="155" width="10" height="10" rx="2" fill="#eab308"/>
  <rect x="585" y="150" width="60" height="20" rx="3" fill="#c0392b"/>
  <text x="615" y="164" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">EN</text>
  <text x="655" y="164" font-size="12" fill="#1a1a1a" text-anchor="start">CHIP_PU (Reset, Active LOW)</text>

  <!-- Pin 2: GPIO8 -->
  <line x1="535" y1="186" x2="585" y2="186" stroke="#d97706" stroke-width="1.5"/>
  <rect x="535" y="181" width="10" height="10" rx="2" fill="#eab308"/>
  <rect x="585" y="176" width="60" height="20" rx="3" fill="#d97706"/>
  <text x="615" y="190" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">GPIO8</text>
  <text x="655" y="190" font-size="12" fill="#1a1a1a" text-anchor="start">RGB LED / Strapping (ROM)</text>

  <!-- Pin 3: GPIO9 -->
  <line x1="535" y1="212" x2="585" y2="212" stroke="#d97706" stroke-width="1.5"/>
  <rect x="535" y="207" width="10" height="10" rx="2" fill="#eab308"/>
  <rect x="585" y="202" width="60" height="20" rx="3" fill="#d97706"/>
  <text x="615" y="216" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">GPIO9</text>
  <text x="655" y="216" font-size="12" fill="#1a1a1a" text-anchor="start">BOOT Button / Strapping</text>

  <!-- Pin 4: GPIO10 -->
  <line x1="535" y1="238" x2="585" y2="238" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="535" y="233" width="10" height="10" rx="2" fill="#eab308"/>
  <rect x="585" y="228" width="60" height="20" rx="3" fill="#2457d6"/>
  <text x="615" y="242" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">GPIO10</text>
  <text x="655" y="242" font-size="12" fill="#1a1a1a" text-anchor="start">I2C SDA / LP_GPIO10</text>

  <!-- Pin 5: GPIO11 -->
  <line x1="535" y1="264" x2="585" y2="264" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="535" y="259" width="10" height="10" rx="2" fill="#eab308"/>
  <rect x="585" y="254" width="60" height="20" rx="3" fill="#2457d6"/>
  <text x="615" y="268" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">GPIO11</text>
  <text x="655" y="268" font-size="12" fill="#1a1a1a" text-anchor="start">I2C SCL / LP_GPIO11</text>

  <!-- Pin 6: GPIO12 -->
  <line x1="535" y1="290" x2="585" y2="290" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="535" y="285" width="10" height="10" rx="2" fill="#eab308"/>
  <rect x="585" y="280" width="60" height="20" rx="3" fill="#2457d6"/>
  <text x="615" y="294" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">GPIO12</text>
  <text x="655" y="294" font-size="12" fill="#1a1a1a" text-anchor="start">USB D- (Native USB/JTAG)</text>

  <!-- Pin 7: GPIO13 -->
  <line x1="535" y1="316" x2="585" y2="316" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="535" y="311" width="10" height="10" rx="2" fill="#eab308"/>
  <rect x="585" y="306" width="60" height="20" rx="3" fill="#2457d6"/>
  <text x="615" y="320" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">GPIO13</text>
  <text x="655" y="320" font-size="12" fill="#1a1a1a" text-anchor="start">USB D+ (Native USB/JTAG)</text>

  <!-- Pin 8: GPIO15 -->
  <line x1="535" y1="342" x2="585" y2="342" stroke="#d97706" stroke-width="1.5"/>
  <rect x="535" y="337" width="10" height="10" rx="2" fill="#eab308"/>
  <rect x="585" y="332" width="60" height="20" rx="3" fill="#d97706"/>
  <text x="615" y="346" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">GPIO15</text>
  <text x="655" y="346" font-size="12" fill="#1a1a1a" text-anchor="start">Strapping (JTAG Source)</text>

  <!-- Pin 9: GPIO16 -->
  <line x1="535" y1="368" x2="585" y2="368" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="535" y="363" width="10" height="10" rx="2" fill="#eab308"/>
  <rect x="585" y="358" width="60" height="20" rx="3" fill="#2457d6"/>
  <text x="615" y="372" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">GPIO16</text>
  <text x="655" y="372" font-size="12" fill="#1a1a1a" text-anchor="start">UART0 RXD / LP_UART</text>

  <!-- Pin 10: GPIO17 -->
  <line x1="535" y1="394" x2="585" y2="394" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="535" y="389" width="10" height="10" rx="2" fill="#eab308"/>
  <rect x="585" y="384" width="60" height="20" rx="3" fill="#2457d6"/>
  <text x="615" y="398" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">GPIO17</text>
  <text x="655" y="398" font-size="12" fill="#1a1a1a" text-anchor="start">UART0 TXD / LP_UART</text>

  <!-- Pin 11: GND -->
  <line x1="535" y1="420" x2="585" y2="420" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="535" y="415" width="10" height="10" rx="2" fill="#eab308"/>
  <rect x="585" y="410" width="60" height="20" rx="3" fill="#1a1a1a"/>
  <text x="615" y="424" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">GND</text>
  <text x="655" y="424" font-size="12" fill="#1a1a1a" text-anchor="start">Спільна земля (0V Ground)</text>

  <!-- Bottom Warning / Notes Panel -->
  <rect x="60" y="475" width="840" height="70" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="75" y="495" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">ОСОБЛИВОСТІ ТА СТРАПІНГ-ПІНИ (Boot Pins):</text>
  <text x="75" y="513" font-size="12" fill="#1a1a1a" text-anchor="start">• GPIO9 (BOOT): при скиданні LOW вмикає ROM-завантажувач. Має внутрішнє підтягування до 3.3V.</text>
  <text x="75" y="531" font-size="12" fill="#1a1a1a" text-anchor="start">• GPIO8 &amp; GPIO15: страпінг-виводи логування/JTAG. GPIO8 також підключено до вбудованого RGB LED.</text>
</svg>
