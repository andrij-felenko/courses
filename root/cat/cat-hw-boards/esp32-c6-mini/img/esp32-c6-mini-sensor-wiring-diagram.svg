<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема підключення WeAct ESP32-C6-Mini з ключем живлення периферії</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Використання P-MOSFET вимикає живлення датчика у Deep Sleep для нульового струму витоку</text>

  <!-- Block 1: Battery -->
  <rect x="25" y="85" width="135" height="260" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <path d="M25 93 a8 8 0 0 1 8 -8 h119 a8 8 0 0 1 8 8 v22 h-135 z" fill="#d0d7de"/>
  <text x="92.5" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Акумулятор</text>

  <!-- Battery Graphic -->
  <rect x="38" y="130" width="85" height="125" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="70.5" y="122" width="20" height="8" rx="2" fill="#6b7280"/>
  <text x="80.5" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Li-Ion / LiPo</text>
  <text x="80.5" y="178" text-anchor="middle" font-size="12" fill="#6b7280">3.7V / 3.0V</text>
  <text x="80.5" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">1500 mAh</text>
  <text x="80.5" y="222" text-anchor="middle" font-size="12" fill="#6b7280">Джерело 3.7V</text>

  <!-- Battery Pin Labels (Inside Panel 1) -->
  <text x="152" y="150" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">BAT+</text>
  <text x="152" y="240" text-anchor="end" font-size="12" fill="#1a1a1a">GND</text>

  <!-- Block 2: WeAct ESP32-C6-Mini -->
  <rect x="185" y="85" width="215" height="260" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M185 93 a8 8 0 0 1 8 -8 h199 a8 8 0 0 1 8 8 v22 h-215 z" fill="#2457d6"/>
  <text x="292.5" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">WeAct ESP32-C6-Mini</text>

  <!-- MCU Chip -->
  <rect x="222" y="128" width="141" height="75" rx="6" fill="#1a1a1a"/>
  <text x="292.5" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">ESP32-C6</text>
  <text x="292.5" y="170" text-anchor="middle" font-size="11" fill="#d0d7de">Thread / Zigbee / BLE</text>
  <text x="292.5" y="187" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">RISC-V 160MHz</text>

  <!-- ESP32-C6 Pins -->
  <!-- Left Side -->
  <text x="190" y="150" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">VBAT</text>
  <text x="190" y="240" text-anchor="start" font-size="12" fill="#1a1a1a">GND</text>
  <!-- Right Side -->
  <text x="395" y="150" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">3V3</text>
  <text x="395" y="195" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">GPIO4</text>
  <text x="395" y="240" text-anchor="end" font-size="12" fill="#1a1a1a">GND</text>
  <text x="395" y="285" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">GPIO6</text>
  <text x="395" y="325" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">GPIO7</text>

  <!-- Block 3: MOSFET Power Switch Circuit -->
  <rect x="465" y="85" width="250" height="260" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M465 93 a8 8 0 0 1 8 -8 h234 a8 8 0 0 1 8 8 v22 h-250 z" fill="#2457d6"/>
  <text x="590" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Ключ живлення (P-MOSFET)</text>

  <!-- Q1 Transistor Graphic -->
  <circle cx="585" cy="150" r="20" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="585" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Q1 (P-MOSFET)</text>
  <!-- Pins S, D, G -->
  <text x="552" y="145" font-size="11" font-weight="bold" fill="#1a1a1a">S</text>
  <text x="615" y="145" font-size="11" font-weight="bold" fill="#1a1a1a">D</text>
  <text x="593" y="182" font-size="11" font-weight="bold" fill="#1a1a1a">G</text>

  <!-- Q1 Internal Schematic Lines -->
  <line x1="565" y1="150" x2="580" y2="150" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="590" y1="150" x2="605" y2="150" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="580" y1="140" x2="580" y2="160" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="575" y1="142" x2="575" y2="158" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="575" y1="150" x2="585" y2="170" stroke="#2457d6" stroke-width="1.5"/>

  <!-- R1 Resistor (Pull-Up 100k) -->
  <rect x="497" y="160" width="16" height="26" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="518" y="173" font-size="11" font-weight="bold" fill="#1a1a1a">R1: 100kΩ</text>
  <text x="518" y="187" font-size="10" fill="#6b7280">Pull-Up</text>
  <!-- Wiring for R1 -->
  <line x1="505" y1="150" x2="505" y2="160" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="505" y1="186" x2="505" y2="195" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="505" cy="150" r="3" fill="#c0392b"/>
  <circle cx="505" cy="195" r="3" fill="#2457d6"/>

  <!-- R2, R3 Resistors (I2C Pull-ups 10k to VCC_SENS) -->
  <rect x="642" y="190" width="16" height="40" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="664" y="204" font-size="11" font-weight="bold" fill="#27ae60">R2, R3: 10kΩ</text>
  <text x="664" y="218" font-size="10" fill="#6b7280">Pull-Up до VCC_SENS</text>
  <!-- Wiring for R2/R3 -->
  <line x1="650" y1="150" x2="650" y2="190" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="650" y1="230" x2="650" y2="325" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="650" cy="150" r="3" fill="#c0392b"/>
  <circle cx="650" cy="285" r="3" fill="#27ae60"/>
  <circle cx="650" cy="325" r="3" fill="#27ae60"/>

  <!-- Block 4: Sensor (BME280) -->
  <rect x="775" y="85" width="160" height="260" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <path d="M775 93 a8 8 0 0 1 8 -8 h144 a8 8 0 0 1 8 8 v22 h-160 z" fill="#27ae60"/>
  <text x="855" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Датчик (BME280)</text>

  <!-- Sensor Module Body -->
  <rect x="805" y="130" width="110" height="85" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="860" y="154" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">I2C Sensor</text>
  <text x="860" y="174" text-anchor="middle" font-size="11" fill="#6b7280">Temp / Humidity</text>
  <text x="860" y="193" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">I2C Addr: 0x76</text>

  <!-- Sensor Pins -->
  <text x="780" y="150" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">VCC</text>
  <text x="780" y="240" text-anchor="start" font-size="12" fill="#1a1a1a">GND</text>
  <text x="780" y="285" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">SDA</text>
  <text x="780" y="325" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">SCL</text>

  <!-- ================= WIRING CONNECTIONS ================= -->

  <!-- Battery to ESP32-C6 -->
  <!-- VBAT Line (Red) -->
  <line x1="160" y1="150" x2="185" y2="150" stroke="#c0392b" stroke-width="2"/>
  <text x="172.5" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">VBAT</text>

  <!-- Battery GND (Black) -->
  <line x1="160" y1="240" x2="185" y2="240" stroke="#1a1a1a" stroke-width="2"/>

  <!-- ESP32-C6 to MOSFET Block -->
  <!-- 3V3 (Red) -->
  <line x1="400" y1="150" x2="465" y2="150" stroke="#c0392b" stroke-width="2"/>
  <text x="432.5" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">3.3V</text>

  <!-- PWR_CTRL (Blue) -->
  <line x1="400" y1="195" x2="585" y2="195" stroke="#2457d6" stroke-width="2"/>
  <line x1="585" y1="195" x2="585" y2="170" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <text x="432.5" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">PWR_CTRL</text>

  <!-- GND Bus (Black) -->
  <line x1="400" y1="240" x2="775" y2="240" stroke="#1a1a1a" stroke-width="2"/>
  <text x="432.5" y="230" text-anchor="middle" font-size="12" fill="#1a1a1a">GND</text>

  <!-- SDA (Green) -->
  <line x1="400" y1="285" x2="775" y2="285" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="432.5" y="275" text-anchor="middle" font-size="12" fill="#27ae60">SDA</text>

  <!-- SCL (Green) -->
  <line x1="400" y1="325" x2="775" y2="325" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="432.5" y="315" text-anchor="middle" font-size="12" fill="#27ae60">SCL</text>

  <!-- MOSFET Drain to Sensor VCC -->
  <!-- VCC_SENS (Red) -->
  <line x1="605" y1="150" x2="775" y2="150" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="745" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">VCC_SENS</text>

  <!-- ================= BOTTOM CARDS (MODES) ================= -->

  <!-- Card 1: Active Mode -->
  <rect x="25" y="365" width="440" height="170" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <path d="M25 373 a8 8 0 0 1 8 -8 h424 a8 8 0 0 1 8 8 v22 h-440 z" fill="#27ae60"/>
  <text x="245" y="385" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">1. Активний режим (Опитування датчика &amp; Thread/Zigbee)</text>

  <text x="45" y="415" font-size="12" fill="#1a1a1a">• GPIO4 (PWR_CTRL) = 0V (LOW) → MOSFET Q1 відкритий</text>
  <text x="45" y="440" font-size="12" fill="#1a1a1a">• VCC_SENS = 3.3V → Датчик отримує живлення та вимірює</text>
  <text x="45" y="465" font-size="12" fill="#1a1a1a">• МК зчитує дані по I2C та відправляє в Home Assistant</text>
  <text x="45" y="490" font-size="12" font-weight="bold" fill="#27ae60">• Струм споживання: ~40–150 мА (короткий робочий імпульс)</text>

  <!-- Card 2: Deep Sleep Mode -->
  <rect x="495" y="365" width="440" height="170" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M495 373 a8 8 0 0 1 8 -8 h424 a8 8 0 0 1 8 8 v22 h-440 z" fill="#2457d6"/>
  <text x="715" y="385" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">2. Глибокий сон (Deep Sleep — тривала автономність)</text>

  <text x="515" y="415" font-size="12" fill="#1a1a1a">• GPIO4 = High-Z (R1 підтягує Gate до 3.3V) → Q1 закритий</text>
  <text x="515" y="440" font-size="12" fill="#1a1a1a">• VCC_SENS = 0V → Датчик повністю знеструмлений</text>
  <text x="515" y="465" font-size="12" fill="#1a1a1a">• Нульовий струм витоку через pull-up резистори R2, R3</text>
  <text x="515" y="490" font-size="12" font-weight="bold" fill="#2457d6">• Струм сну вузла: &lt; 7 мкА (понад 2–3 роки від батареї)</text>

</svg>
