<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue-right" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-blue-left" markerWidth="9" markerHeight="9" refX="1.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M9,0 L1,4 L9,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- White background layer -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Часовий цикл та профіль струму вузла ESP32-C6 (Thread/Zigbee)</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Більшість часу вузол перебуває у Deep Sleep (7–10 µA), спалахи струму до 130 мА виникають під час TX/RX 802.15.4</text>

  <!-- Main Graph Background Panel -->
  <rect x="30" y="75" width="900" height="275" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Phase Vertical Color Bands -->
  <!-- Phase 1: Boot (160 to 290) -->
  <rect x="160" y="95" width="130" height="195" fill="#eaf0fd" opacity="0.7"/>
  <!-- Phase 2: Sensor (290 to 420) -->
  <rect x="290" y="95" width="130" height="195" fill="#e9f7ef" opacity="0.7"/>
  <!-- Phase 3: RF Stack (420 to 570) -->
  <rect x="420" y="95" width="150" height="195" fill="#fef3c7" opacity="0.7"/>
  <!-- Phase 4: TX/RX (570 to 750) -->
  <rect x="570" y="95" width="180" height="195" fill="#fdecea" opacity="0.7"/>
  <!-- Phase 5: Sleep Prep (750 to 830) -->
  <rect x="750" y="95" width="80" height="195" fill="#f3e8ff" opacity="0.7"/>

  <!-- Grid Lines & Y-Ticks -->
  <line x1="110" y1="110" x2="900" y2="110" stroke="#d0d7de" stroke-dasharray="3 3"/>
  <text x="102" y="114" text-anchor="end" font-size="12" fill="#6b7280">150 мА</text>

  <line x1="110" y1="170" x2="900" y2="170" stroke="#d0d7de" stroke-dasharray="3 3"/>
  <text x="102" y="174" text-anchor="end" font-size="12" fill="#6b7280">100 мА</text>

  <line x1="110" y1="230" x2="900" y2="230" stroke="#d0d7de" stroke-dasharray="3 3"/>
  <text x="102" y="234" text-anchor="end" font-size="12" fill="#6b7280">50 мА</text>

  <text x="102" y="294" text-anchor="end" font-size="12" fill="#6b7280">0 мА (10 µA)</text>

  <!-- Y-Axis Title -->
  <text x="40" y="94" font-size="12" font-weight="bold" fill="#1a1a1a">Струм I (мА)</text>

  <!-- Phase Separator Lines (Dashed) -->
  <line x1="160" y1="95" x2="160" y2="290" stroke="#d0d7de" stroke-dasharray="2 2"/>
  <line x1="290" y1="95" x2="290" y2="290" stroke="#d0d7de" stroke-dasharray="2 2"/>
  <line x1="420" y1="95" x2="420" y2="290" stroke="#d0d7de" stroke-dasharray="2 2"/>
  <line x1="570" y1="95" x2="570" y2="290" stroke="#d0d7de" stroke-dasharray="2 2"/>
  <line x1="750" y1="95" x2="750" y2="290" stroke="#d0d7de" stroke-dasharray="2 2"/>
  <line x1="830" y1="95" x2="830" y2="290" stroke="#d0d7de" stroke-dasharray="2 2"/>

  <!-- Waveform Shaded Fill Under Curve -->
  <polygon points="110,289 160,289 160,254 290,254 290,272 420,272 420,236 570,236 570,134 670,134 670,194 750,194 750,266 830,266 830,289 900,289 900,290 110,290" fill="#2457d6" opacity="0.15"/>

  <!-- Waveform Outline Line -->
  <path d="M 110,289 L 160,289 L 160,254 L 290,254 L 290,272 L 420,272 L 420,236 L 570,236 L 570,134 L 670,134 L 670,194 L 750,194 L 750,266 L 830,266 L 830,289 L 900,289" fill="none" stroke="#2457d6" stroke-width="3" stroke-linejoin="round"/>

  <!-- Axes Lines -->
  <line x1="110" y1="295" x2="110" y2="95" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="105" y1="290" x2="910" y2="290" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- X-Axis Title -->
  <text x="915" y="310" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">Час t (мс)</text>

  <!-- Phase Header Labels -->
  <text x="225" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">1. Boot ESP32-C6</text>
  <text x="355" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">2. Опитування I2C</text>
  <text x="495" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#d97706">3. Ініціалізація RF</text>
  <text x="660" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">4. Передача 802.15.4</text>
  <text x="790" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#7c3aed">5. Вхід у сон</text>

  <!-- Phase Values & Callouts -->
  <text x="225" y="246" text-anchor="middle" font-size="12" fill="#1a1a1a">~30 мА (15 мс)</text>
  <text x="355" y="258" text-anchor="middle" font-size="12" fill="#1a1a1a">~15 мА (10 мс)</text>
  <text x="495" y="222" text-anchor="middle" font-size="12" fill="#1a1a1a">~45 мА (20 мс)</text>

  <!-- TX Peak Callouts (Inside TX sub-phase 570..670, y=152 and y=166) -->
  <text x="620" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">TX: ~130 мА</text>
  <text x="620" y="166" text-anchor="middle" font-size="12" fill="#c0392b">(10 мс)</text>

  <!-- RX ACK Callouts (Inside RX sub-phase 670..750, below curve at y=212 and y=226) -->
  <text x="710" y="212" text-anchor="middle" font-size="12" fill="#c0392b">RX: ~80 мА</text>
  <text x="710" y="226" text-anchor="middle" font-size="12" fill="#c0392b">(5 мс)</text>

  <text x="790" y="252" text-anchor="middle" font-size="12" fill="#1a1a1a">~20 мА (5 мс)</text>

  <!-- Deep Sleep Annotations -->
  <text x="135" y="258" text-anchor="middle" font-size="12" fill="#6b7280">Deep</text>
  <text x="135" y="272" text-anchor="middle" font-size="12" fill="#6b7280">Sleep</text>

  <text x="870" y="244" text-anchor="middle" font-size="12" fill="#6b7280">Deep Sleep</text>
  <text x="870" y="260" text-anchor="middle" font-size="12" fill="#6b7280">(~10 µA)</text>
  <text x="870" y="276" text-anchor="middle" font-size="12" fill="#6b7280">Період: 60 с</text>

  <!-- Active Phase Duration Bracket -->
  <line x1="160" y1="328" x2="830" y2="328" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue-left)" marker-end="url(#arr-blue-right)"/>
  <text x="495" y="323" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Загальний час активної фази T_active ≈ 65 мс</text>

  <!-- Bottom Information Cards -->
  <!-- Card 1: Phase Structure -->
  <rect x="30" y="365" width="285" height="135" rx="6" ry="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="388" font-size="13" font-weight="bold" fill="#1a1a1a">1. Тривалість фаз циклу:</text>
  <text x="45" y="410" font-size="12" fill="#1a1a1a">• T_active = 65 мс (зчитування + RF)</text>
  <text x="45" y="430" font-size="12" fill="#1a1a1a">• T_sleep = 60 с (режим Deep Sleep)</text>
  <text x="45" y="450" font-size="12" fill="#1a1a1a">• Скважність D = T_act/T_cyc ≈ 0.1%</text>
  <text x="45" y="470" font-size="12" fill="#1a1a1a">• Таймер пробудження: RTC Timer</text>

  <!-- Card 2: Energy Balance -->
  <rect x="330" y="365" width="300" height="135" rx="6" ry="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="345" y="388" font-size="13" font-weight="bold" fill="#2457d6">2. Енергетичний баланс:</text>
  <text x="345" y="410" font-size="12" fill="#1a1a1a">• Струм сну: I_sleep ≈ 10 µA</text>
  <text x="345" y="430" font-size="12" fill="#1a1a1a">• Середній струм роботи: I_act ≈ 45 мА</text>
  <text x="345" y="450" font-size="12" fill="#1a1a1a">• I_avg = I_sleep + D × I_act ≈ 55 µA</text>
  <text x="345" y="470" font-size="12" fill="#1a1a1a">• Піковий струм TX (+9 dBm): 130 мА</text>

  <!-- Card 3: Optimization -->
  <rect x="645" y="365" width="285" height="135" rx="6" ry="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="660" y="388" font-size="13" font-weight="bold" fill="#27ae60">3. Оптимізація автономності:</text>
  <text x="660" y="410" font-size="12" fill="#1a1a1a">• Sleepy End Device (SED) Thread/Zigbee</text>
  <text x="660" y="430" font-size="12" fill="#1a1a1a">• Керування живленням Vext через GPIO</text>
  <text x="660" y="450" font-size="12" fill="#1a1a1a">• Оптимізація сесії без перепідключення</text>
  <text x="660" y="470" font-size="12" fill="#1a1a1a">• Автономність від CR2032: &gt; 2–3 роки</text>
</svg>
