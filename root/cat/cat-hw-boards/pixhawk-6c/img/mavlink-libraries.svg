<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="920" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="460.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два шляхи до тієї самої плати: готові дії проти сирих пакетів</text>
<rect x="60.0" y="66.0" width="370.0" height="300.0" rx="12" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="245.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">MAVSDK (C++)</text>
<text x="245.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">високий рівень: думаєш діями</text>
<text x="82.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">action.arm();</text>
<text x="82.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">action.takeoff();</text>
<text x="82.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="start">telemetry.subscribe_position(...)</text>
<text x="82.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">— бібліотека сама шле пакети,</text>
<text x="82.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-style="italic">   чекає COMMAND_ACK, повторює</text>
<text x="245.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-style="italic">менше коду, менше контролю над байтами</text>
<rect x="490.0" y="66.0" width="370.0" height="300.0" rx="12" fill="#eef6ef" stroke="#27ae60" stroke-width="2.0"/>
<text x="675.0" y="94.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">pymavlink (Python)</text>
<text x="675.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-style="italic">низький рівень: думаєш пакетами</text>
<text x="512.0" y="152.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">m.mav.command_long_send(</text>
<text x="512.0" y="182.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">     MAV_CMD_COMPONENT_ARM_DISARM, …)</text>
<text x="512.0" y="212.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">m.recv_match('ATTITUDE', blocking=True)</text>
<text x="512.0" y="242.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">— сам будуєш кожне повідомлення,</text>
<text x="512.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start" font-style="italic">   сам ловиш і читаєш відповідь</text>
<text x="675.0" y="350.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-style="italic">бачиш кожен байт, платиш ручною роботою</text>
<rect x="110.9" y="404.5" width="698.3" height="43.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="460.0" y="423.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">обидві говорять тим самим MAVLink і з тією самою платою. MAVSDK ховає пакети за готовими діями (arm/takeoff) —</tspan><tspan x="460.0" dy="13.0">швидко для звичайних сценаріїв; pymavlink віддає сирі повідомлення — коли треба нестандартне чи зазирнути в кожен байт.</tspan></text>
</svg>