<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="640" height="720" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="320.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Порядок керування Pixhawk по MAVLink: кроки не міняються місцями</text>
<rect x="70.0" y="70.0" width="500.0" height="78.0" rx="10" fill="#ffffff" stroke="#2457d6" stroke-width="2.0"/>
<text x="88.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="start" font-weight="700">1. Відкрити порт</text>
<text x="88.0" y="118.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">serial://COM3:921600   або   udp://:14540</text>
<text x="88.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start" font-style="italic">→ з'єднання ще німе</text>
<line x1="320.0" y1="148.0" x2="320.0" y2="174.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="70.0" y="174.0" width="500.0" height="78.0" rx="10" fill="#ffffff" stroke="#27ae60" stroke-width="2.0"/>
<text x="88.0" y="200.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="start" font-weight="700">2. Дочекатися heartbeat</text>
<text x="88.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">wait_heartbeat() → знаємо sysid / compid</text>
<text x="88.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start" font-style="italic">→ лінія жива</text>
<line x1="320.0" y1="252.0" x2="320.0" y2="278.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="70.0" y="278.0" width="500.0" height="78.0" rx="10" fill="#ffffff" stroke="#8e44ad" stroke-width="2.0"/>
<text x="88.0" y="304.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#8e44ad" text-anchor="start" font-weight="700">3. Задати режим</text>
<text x="88.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">GUIDED (ArduPilot)  /  SET_MODE+custom (PX4)</text>
<text x="88.0" y="344.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start" font-style="italic">→ апарат слухає команди</text>
<line x1="320.0" y1="356.0" x2="320.0" y2="382.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="70.0" y="382.0" width="500.0" height="78.0" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="88.0" y="408.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">4. Зброїти</text>
<text x="88.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">MAV_CMD_COMPONENT_ARM_DISARM, param1 = 1</text>
<text x="88.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start" font-style="italic">→ мотори під напругою</text>
<line x1="320.0" y1="460.0" x2="320.0" y2="486.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="70.0" y="486.0" width="500.0" height="78.0" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="2.0"/>
<text x="88.0" y="512.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="start" font-weight="700">5. Злетіти / дати команду</text>
<text x="88.0" y="534.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">MAV_CMD_NAV_TAKEOFF   або   action.takeoff()</text>
<text x="88.0" y="552.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start" font-style="italic">→ апарат у повітрі</text>
<line x1="320.0" y1="564.0" x2="320.0" y2="590.0" stroke="#1a1a1a" stroke-width="2.2" marker-end="url(#arrow)"/>
<rect x="70.0" y="590.0" width="500.0" height="78.0" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="88.0" y="616.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">6. Читати стан</text>
<text x="88.0" y="638.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">recv_match('ATTITUDE' / 'GLOBAL_POSITION_INT')</text>
<text x="88.0" y="656.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="start" font-style="italic">→ телеметрія тече назад</text>
<rect x="13.6" y="664.5" width="612.8" height="43.0" rx="6" fill="#fdf0e6" stroke="#c0392b" stroke-width="1.5"/><text x="320.0" y="683.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="320.0" dy="0.0">кожен крок відкриває наступний: без heartbeat не знаєш адреси; поза потрібним режимом команду відкинуть;</tspan><tspan x="320.0" dy="13.0">не зброївши — не злетиш. А зброєння впаде, поки не знято кнопку-запобіжник.</tspan></text>
</svg>