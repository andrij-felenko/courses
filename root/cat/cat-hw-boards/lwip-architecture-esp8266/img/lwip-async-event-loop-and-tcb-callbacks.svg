<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="480" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Асинхронний подієвий цикл lwIP та TCB-зворотні виклики в ESP8266</text>
  <text x="480" y="54" font-size="13" text-anchor="middle" fill="#6b7280">Обробка мережевих подій та виклик callback-функцій виконуються в єдиному системному потоці без блокування</text>

  <!-- Panel 1: Event Sources -->
  <rect x="25" y="75" width="190" height="380" rx="6" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="120" y="98" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">Джерела подій</text>

  <rect x="35" y="115" width="170" height="85" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="120" y="138" font-size="13" font-weight="700" text-anchor="middle" fill="#2457d6">Wi-Fi MAC / ISR</text>
  <text x="120" y="158" font-size="12" text-anchor="middle" fill="#1a1a1a">Кадр прибув (RX)</text>
  <text x="120" y="176" font-size="12" text-anchor="middle" fill="#6b7280">Буферизовано в pbuf</text>

  <rect x="35" y="225" width="170" height="85" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="120" y="248" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">Таймери lwIP</text>
  <text x="120" y="268" font-size="12" text-anchor="middle" fill="#6b7280">sys_check_timeouts</text>
  <text x="120" y="286" font-size="12" text-anchor="middle" fill="#6b7280">TCP Poll / Retransmit</text>

  <rect x="35" y="335" width="170" height="85" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="120" y="358" font-size="13" font-weight="700" text-anchor="middle" fill="#27ae60">TX / ACK сигнал</text>
  <text x="120" y="378" font-size="12" text-anchor="middle" fill="#1a1a1a">Отримано ACK</text>
  <text x="120" y="396" font-size="12" text-anchor="middle" fill="#6b7280">Пакет підтверджено</text>

  <!-- Panel 2: System Thread & lwIP Core -->
  <rect x="240" y="75" width="410" height="380" rx="6" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="445" y="98" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a1a">Єдиний системний потік (System Thread)</text>

  <!-- Event Loop Sub-block -->
  <rect x="255" y="115" width="380" height="75" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="445" y="138" font-size="13" font-weight="700" text-anchor="middle" fill="#2457d6">Асинхронний подієвий цикл lwIP Core Loop</text>
  <text x="445" y="158" font-size="12" text-anchor="middle" fill="#1a1a1a">Обробка черги пакетів netif-&gt;input() та диспетчеризація</text>
  <text x="445" y="176" font-size="12" text-anchor="middle" fill="#6b7280">Визначення протоколу та відповідного TCB</text>

  <!-- Vertical connector line inside Column 2 -->
  <line x1="445" y1="190" x2="445" y2="197" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- TCB Sub-block -->
  <rect x="255" y="205" width="380" height="235" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="445" y="227" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">Блок керування з'єднанням (TCP TCB / PCB)</text>
  <line x1="265" y1="236" x2="625" y2="236" stroke="#d0d7de" stroke-width="1"/>

  <text x="275" y="254" font-size="12" fill="#1a1a1a"><tspan font-weight="700">Стан:</tspan> ESTABLISHED</text>
  <text x="475" y="254" font-size="12" fill="#1a1a1a"><tspan font-weight="700">Вікно:</tspan> TCP_WND (буфер прийому)</text>
  <text x="275" y="272" font-size="12" fill="#6b7280">Сокет: local_ip:port &lt;--&gt; remote_ip:port | seqno/ackno</text>

  <!-- Callback Table inside TCB -->
  <rect x="265" y="285" width="360" height="145" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="445" y="304" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">Таблиця вказівників на користувацькі callbacks</text>
  <line x1="275" y1="312" x2="615" y2="312" stroke="#d0d7de" stroke-width="1"/>

  <!-- Row 1: tcp_err_fn -->
  <rect x="275" y="320" width="330" height="30" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="285" y="340" font-size="12" font-weight="700" fill="#c0392b">tcp_err_fn</text>
  <text x="375" y="340" font-size="12" fill="#6b7280">──► Вказівник на обробник помилок/RST</text>

  <!-- Row 2: tcp_recv_fn -->
  <rect x="275" y="356" width="330" height="30" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="285" y="376" font-size="12" font-weight="700" fill="#2457d6">tcp_recv_fn</text>
  <text x="375" y="376" font-size="12" fill="#6b7280">──► Вказівник на прийом даних (pbuf)</text>

  <!-- Row 3: tcp_sent_fn -->
  <rect x="275" y="392" width="330" height="30" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="285" y="412" font-size="12" font-weight="700" fill="#27ae60">tcp_sent_fn</text>
  <text x="375" y="412" font-size="12" fill="#6b7280">──► Вказівник на підтвердження (ACK)</text>

  <!-- Panel 3: Application Callbacks -->
  <rect x="675" y="75" width="260" height="380" rx="6" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="805" y="98" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">Користувацькі Callbacks</text>

  <!-- Information Box in Panel 3 -->
  <rect x="685" y="115" width="240" height="175" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="805" y="136" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Принципи виконання</text>
  <line x1="695" y1="145" x2="915" y2="145" stroke="#d0d7de" stroke-width="1"/>
  <text x="698" y="166" font-size="12" fill="#1a1a1a">1. Виконуються неблокувально</text>
  <text x="710" y="186" font-size="12" fill="#6b7280">у контексті Core Loop</text>
  <text x="698" y="210" font-size="12" fill="#1a1a1a">2. Без тривалих затримок</text>
  <text x="710" y="230" font-size="12" fill="#6b7280">щоб не блокувати стек</text>
  <text x="698" y="254" font-size="12" fill="#1a1a1a">3. Повертають керування</text>

  <!-- Callback Function Blocks -->
  <rect x="685" y="315" width="240" height="40" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="805" y="332" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">err_cb(arg, err)</text>
  <text x="805" y="348" font-size="12" text-anchor="middle" fill="#6b7280">Скидання / обрив з'єднання</text>

  <rect x="685" y="360" width="240" height="40" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="805" y="377" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">recv_cb(arg, pcb, p, err)</text>
  <text x="805" y="393" font-size="12" text-anchor="middle" fill="#6b7280">Читання pbuf &amp; tcp_recved()</text>

  <rect x="685" y="405" width="240" height="40" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="805" y="422" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">sent_cb(arg, pcb, len)</text>
  <text x="805" y="438" font-size="12" text-anchor="middle" fill="#6b7280">Звільнення буферів відправника</text>

  <!-- Inter-panel Flow Arrows -->
  <line x1="205" y1="152" x2="246" y2="152" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="205" y1="267" x2="246" y2="267" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="205" y1="378" x2="246" y2="378" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <line x1="605" y1="335" x2="676" y2="335" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="605" y1="371" x2="676" y2="371" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="605" y1="407" x2="676" y2="407" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
</svg>
