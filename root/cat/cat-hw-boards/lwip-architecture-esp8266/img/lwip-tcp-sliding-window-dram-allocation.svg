<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="540" fill="white"/>
  
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Ковзне вікно TCP (TCP_WND) та розподіл буферів DRAM у lwIP</text>
  <text x="480" y="56" font-size="13" text-anchor="middle" fill="#6b7280">Розмір RCV_WND регулює потік даних і запобігає переповненню буферного пулу pbuf у DRAM ESP8266</text>

  <!-- Panel 1: TCP Sequence & Window Space -->
  <rect x="30" y="75" width="900" height="195" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="48" y="98" font-size="14" font-weight="700" fill="#1a1a1a">1. Послідовність байтів TCP та стан ковзного вікна</text>

  <!-- Window Size Indicator Bracket -->
  <text x="450" y="112" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">Ширина вікна TCP_WND (наприклад, 2860 байт = 2 × MSS)</text>
  <line x1="242" y1="120" x2="660" y2="120" stroke="#2457d6" stroke-width="2" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>

  <!-- Sequence Blocks -->
  <rect x="50" y="128" width="180" height="48" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="140" y="148" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">Підтверджено (ACKed)</text>
  <text x="140" y="164" font-size="12" text-anchor="middle" fill="#6b7280">&lt; SND_UNA</text>

  <rect x="242" y="128" width="198" height="48" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="341" y="148" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">Надіслано (In-Flight)</text>
  <text x="341" y="164" font-size="12" text-anchor="middle" fill="#2457d6">SND_UNA .. SND_NXT</text>

  <rect x="452" y="128" width="208" height="48" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="556" y="148" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">Дозволено для передачі</text>
  <text x="556" y="164" font-size="12" text-anchor="middle" fill="#6b7280">В межах RCV_WND</text>

  <rect x="672" y="128" width="238" height="48" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="791" y="148" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">Заблоковано передачу</text>
  <text x="791" y="164" font-size="12" text-anchor="middle" fill="#c0392b">Поза межами TCP_WND</text>

  <!-- Pointers -->
  <line x1="242" y1="205" x2="242" y2="182" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <text x="242" y="220" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">SND_UNA</text>
  <text x="242" y="235" font-size="12" text-anchor="middle" fill="#6b7280">Старший непідтверджений байт</text>

  <line x1="452" y1="205" x2="452" y2="182" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="452" y="220" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">SND_NXT</text>
  <text x="452" y="235" font-size="12" text-anchor="middle" fill="#6b7280">Наступний байт до відправки</text>

  <line x1="660" y1="205" x2="660" y2="182" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="660" y="220" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">SND_UNA + TCP_WND</text>
  <text x="660" y="235" font-size="12" text-anchor="middle" fill="#6b7280">Правий край приймального вікна</text>

  <!-- Inter-panel connecting arrows -->
  <line x1="280" y1="270" x2="280" y2="288" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="720" y1="270" x2="720" y2="288" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Panel 2: DRAM Allocation & Flow Control -->
  <rect x="30" y="290" width="900" height="230" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="48" y="313" font-size="14" font-weight="700" fill="#1a1a1a">2. Розподіл буферів pbuf у DRAM ESP8266 та зворотний зв'язок (Flow Control)</text>

  <!-- Sub-box A (Left - DRAM Pool) -->
  <rect x="50" y="325" width="460" height="180" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="65" y="347" font-size="13" font-weight="700" fill="#1a1a1a">Пул буферів lwIP у DRAM (PBUF_POOL)</text>

  <rect x="65" y="360" width="95" height="52" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="112" y="380" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">pbuf_1</text>
  <text x="112" y="396" font-size="12" text-anchor="middle" fill="#6b7280">Зайнято (TCP)</text>

  <rect x="172" y="360" width="95" height="52" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="219" y="380" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">pbuf_2</text>
  <text x="219" y="396" font-size="12" text-anchor="middle" fill="#6b7280">Зайнято (TCP)</text>

  <rect x="279" y="360" width="95" height="52" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="326" y="380" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">pbuf_3</text>
  <text x="326" y="396" font-size="12" text-anchor="middle" fill="#27ae60">Вільний (RAM)</text>

  <rect x="386" y="360" width="95" height="52" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="433" y="380" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">pbuf_4</text>
  <text x="433" y="396" font-size="12" text-anchor="middle" fill="#27ae60">Вільний (RAM)</text>

  <rect x="65" y="425" width="416" height="68" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="77" y="443" font-size="12" font-weight="700" fill="#1a1a1a">Динамічне обчислення доступного вікна RCV_WND:</text>
  <text x="77" y="461" font-size="12" fill="#2457d6">RCV_WND = Кількість вільних pbuf × PBUF_POOL_BUFSIZE</text>
  <text x="77" y="479" font-size="12" fill="#6b7280">Обмежена DRAM ESP8266 (~80 KB) потребує точного TCP_WND</text>

  <!-- Sub-box B (Right - Flow Control Scenarios) -->
  <rect x="530" y="325" width="380" height="180" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="545" y="347" font-size="13" font-weight="700" fill="#1a1a1a">Захист від переповнення буфера прийому</text>

  <rect x="545" y="360" width="350" height="58" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="557" y="378" font-size="12" font-weight="700" fill="#27ae60">RCV_WND &gt; 0 — Нормальний потік даних</text>
  <text x="557" y="396" font-size="12" fill="#1a1a1a">Приймач має вільні pbuf та підтверджує сегменти (ACK)</text>

  <rect x="545" y="430" width="350" height="63" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="557" y="448" font-size="12" font-weight="700" fill="#c0392b">RCV_WND = 0 — Зупинка передачі (Zero Window)</text>
  <text x="557" y="465" font-size="12" fill="#c0392b">Пул pbuf вичерпано. Передавач блокується,</text>
  <text x="557" y="480" font-size="12" fill="#c0392b">запобігаючи втраті пакетів та витоку DRAM</text>
</svg>
