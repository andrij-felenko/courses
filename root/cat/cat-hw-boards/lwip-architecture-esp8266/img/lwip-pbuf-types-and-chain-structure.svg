<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Header -->
  <text x="480" y="28" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Структура буферів pbuf та їхнє зчеплення у стек lwIP</text>
  <text x="480" y="48" font-size="13" text-anchor="middle" fill="#6b7280">Типи буферів (RAM, POOL, ROM, REF) та формування ланцюжка буферів (pbuf-chain)</text>

  <!-- PANEL 1: pbuf types -->
  <rect x="20" y="65" width="920" height="205" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="35" y="85" font-size="14" font-weight="700" fill="#2457d6">1. Типи буферів pbuf за джерелом пам'яті (pbuf_type)</text>

  <!-- Card 1: PBUF_RAM -->
  <rect x="35" y="98" width="212" height="160" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="141" y="116" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">PBUF_RAM</text>
  <text x="141" y="132" font-size="12" text-anchor="middle" fill="#6b7280">Динамічна купа (DRAM)</text>
  <rect x="47" y="145" width="188" height="55" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="125" y1="145" x2="125" y2="200" stroke="#2457d6" stroke-dasharray="3,3" stroke-width="1.5"/>
  <text x="86" y="176" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">struct pbuf</text>
  <text x="165" y="176" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">Payload</text>
  <text x="141" y="220" font-size="12" text-anchor="middle" fill="#1a1a1a">Єдиний блок у купі</text>
  <text x="141" y="238" font-size="12" text-anchor="middle" fill="#6b7280">Заголовок + дані разом</text>

  <!-- Card 2: PBUF_POOL -->
  <rect x="261" y="98" width="212" height="160" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="367" y="116" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">PBUF_POOL</text>
  <text x="367" y="132" font-size="12" text-anchor="middle" fill="#6b7280">Статичний пул (memp)</text>
  <rect x="273" y="145" width="188" height="55" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="351" y1="145" x2="351" y2="200" stroke="#27ae60" stroke-dasharray="3,3" stroke-width="1.5"/>
  <text x="312" y="176" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">struct pbuf</text>
  <text x="391" y="176" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">Fixed Buffer</text>
  <text x="367" y="220" font-size="12" text-anchor="middle" fill="#1a1a1a">Фіксовані блоки пулу</text>
  <text x="367" y="238" font-size="12" text-anchor="middle" fill="#6b7280">Швидке виділення (RX)</text>

  <!-- Card 3: PBUF_ROM -->
  <rect x="487" y="98" width="212" height="160" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="593" y="116" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">PBUF_ROM</text>
  <text x="593" y="132" font-size="12" text-anchor="middle" fill="#6b7280">Постійна пам'ять (Flash)</text>
  <rect x="497" y="145" width="82" height="55" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="538" y="176" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">pbuf</text>
  <path d="M579,172 L597,172" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <rect x="601" y="145" width="88" height="55" rx="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
  <text x="645" y="176" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Flash/ROM</text>
  <text x="593" y="220" font-size="12" text-anchor="middle" fill="#1a1a1a">Дані у флеш-пам'яті</text>
  <text x="593" y="238" font-size="12" text-anchor="middle" fill="#6b7280">Zero-copy (статичний веб)</text>

  <!-- Card 4: PBUF_REF -->
  <rect x="713" y="98" width="212" height="160" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="819" y="116" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">PBUF_REF</text>
  <text x="819" y="132" font-size="12" text-anchor="middle" fill="#6b7280">Зовнішній буфер (RAM)</text>
  <rect x="723" y="145" width="82" height="55" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="764" y="176" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">pbuf</text>
  <path d="M805,172 L823,172" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <rect x="827" y="145" width="88" height="55" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="871" y="176" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">App RAM</text>
  <text x="819" y="220" font-size="12" text-anchor="middle" fill="#1a1a1a">Зовнішній буфер в DRAM</text>
  <text x="819" y="238" font-size="12" text-anchor="middle" fill="#6b7280">Zero-copy (посилання)</text>

  <!-- PANEL 2: pbuf chain -->
  <rect x="20" y="280" width="920" height="265" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="35" y="302" font-size="14" font-weight="700" fill="#2457d6">2. Принцип зчеплення pbuf у ланцюжок (pbuf-chain) та вказівники payload</text>

  <!-- Left Column: pbuf[1] -->
  <rect x="45" y="318" width="375" height="102" rx="6" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="45" y="318" width="375" height="26" rx="5" fill="#eaf0fd"/>
  <text x="232.5" y="336" font-size="13" font-weight="700" text-anchor="middle" fill="#2457d6">struct pbuf [1] (Заголовок пакета)</text>
  
  <text x="58" y="358" font-size="12" fill="#6b7280">next:</text>
  <text x="96" y="358" font-size="12" font-weight="700" fill="#2457d6">&amp;pbuf[2]</text>
  <text x="210" y="358" font-size="12" fill="#6b7280">len / tot_len:</text>
  <text x="300" y="358" font-size="12" font-weight="700" fill="#1a1a1a">54 / 1054 B</text>
  
  <text x="58" y="382" font-size="12" fill="#6b7280">payload:</text>
  <text x="115" y="382" font-size="12" font-weight="700" fill="#27ae60">&amp;headers_data</text>
  <text x="250" y="382" font-size="12" fill="#6b7280">type:</text>
  <text x="285" y="382" font-size="12" font-weight="700" fill="#1a1a1a">PBUF_RAM</text>
  
  <text x="58" y="406" font-size="12" fill="#6b7280">flags:</text>
  <text x="98" y="406" font-size="12" fill="#1a1a1a">0</text>
  <text x="250" y="406" font-size="12" fill="#6b7280">ref count:</text>
  <text x="315" y="406" font-size="12" fill="#1a1a1a">1</text>

  <!-- Arrow pbuf[1] -> pbuf[2] -->
  <path d="M420,354 L532,354" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <text x="480" y="346" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">pbuf[1]->next</text>

  <!-- Arrow pbuf[1] -> Header Payload -->
  <path d="M150,420 L150,447" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="160" y="438" font-size="12" font-weight="700" fill="#27ae60">payload</text>

  <!-- Header Payload Memory Block -->
  <rect x="45" y="455" width="375" height="52" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="232.5" y="475" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">Буфер заголовків у DRAM (54 B)</text>
  <text x="232.5" y="494" font-size="12" text-anchor="middle" fill="#1a1a1a">Ethernet Header (14B) + IP Header (20B) + TCP Header (20B)</text>

  <!-- Right Column: pbuf[2] -->
  <rect x="540" y="318" width="375" height="102" rx="6" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="540" y="318" width="375" height="26" rx="5" fill="#eaf0fd"/>
  <text x="727.5" y="336" font-size="13" font-weight="700" text-anchor="middle" fill="#2457d6">struct pbuf [2] (Дані пакета)</text>
  
  <text x="553" y="358" font-size="12" fill="#6b7280">next:</text>
  <text x="591" y="358" font-size="12" font-weight="700" fill="#6b7280">NULL (кінець)</text>
  <text x="705" y="358" font-size="12" fill="#6b7280">len / tot_len:</text>
  <text x="795" y="358" font-size="12" font-weight="700" fill="#1a1a1a">1000 / 1000 B</text>
  
  <text x="553" y="382" font-size="12" fill="#6b7280">payload:</text>
  <text x="610" y="382" font-size="12" font-weight="700" fill="#27ae60">&amp;rom_data</text>
  <text x="745" y="382" font-size="12" fill="#6b7280">type:</text>
  <text x="780" y="382" font-size="12" font-weight="700" fill="#1a1a1a">PBUF_ROM</text>
  
  <text x="553" y="406" font-size="12" fill="#6b7280">flags:</text>
  <text x="593" y="406" font-size="12" fill="#1a1a1a">0</text>
  <text x="745" y="406" font-size="12" fill="#6b7280">ref count:</text>
  <text x="810" y="406" font-size="12" fill="#1a1a1a">1</text>

  <!-- Arrow pbuf[2] -> Data Payload -->
  <path d="M645,420 L645,447" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="655" y="438" font-size="12" font-weight="700" fill="#27ae60">payload</text>

  <!-- Data Payload Memory Block -->
  <rect x="540" y="455" width="375" height="52" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="727.5" y="475" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">Буфер корисних даних у Flash / ROM (1000 B)</text>
  <text x="727.5" y="494" font-size="12" text-anchor="middle" fill="#1a1a1a">HTTP HTML/JSON контент (без копіювання в RAM / Zero-copy)</text>

  <!-- Summary Line -->
  <text x="480" y="528" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Загальна довжина пакета у головному буфері: tot_len = pbuf[1].len (54 B) + pbuf[2].len (1000 B) = 1054 B</text>
</svg>
