<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="760" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="380.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Що вирішує GPIO0 у мить скидання</text>
<rect x="70.0" y="70.0" width="300.0" height="210.0" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
<text x="220.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Прошивка (bootloader)</text>
<text x="220.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">у момент RST↓:</tspan><tspan x="220.0" dy="14.3">GPIO0 = 0</tspan><tspan x="220.0" dy="14.3">CH_PD = 1  ·  GPIO2 = 1</tspan></text>
<text x="220.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">GPIO0 на землю ПЕРЕД</tspan><tspan x="220.0" dy="14.3">скиданням → чип чекає</tspan><tspan x="220.0" dy="14.3">нову прошивку по UART</tspan></text>
<rect x="410.0" y="70.0" width="300.0" height="210.0" rx="10" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/>
<text x="560.0" y="96.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Звичайний старт</text>
<text x="560.0" y="128.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">у момент RST↓:</tspan><tspan x="560.0" dy="14.3">GPIO0 = 1 (вільно)</tspan><tspan x="560.0" dy="14.3">CH_PD = 1  ·  GPIO2 = 1</tspan></text>
<text x="560.0" y="210.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="560.0" dy="0.0">GPIO0 не чіпаємо (підтяжка</tspan><tspan x="560.0" dy="14.3">12К тримає 1) → чип біжить</tspan><tspan x="560.0" dy="14.3">вашу прошивку з флеші</tspan></text>
<rect x="230.0" y="296.0" width="300.0" height="34.0" rx="6" fill="#fff8e1" stroke="#f0b429" stroke-width="1.2"/><text x="380.0" y="316.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="380.0" dy="0.0">GPIO2 має лишатися 1 в обох режимах</tspan></text>
</svg>