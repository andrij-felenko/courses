<svg viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Markers -->
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема автоматичного скидання та вибору режиму (Auto-Reset Circuit)</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Транзисторний вузол на Q1 та Q2 перетворює сигнали DTR/RTS на імпульси скидання RST та фіксації GPIO0</text>

  <!-- Left Panel: Schematic -->
  <rect x="30" y="70" width="440" height="440" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="250" y="94" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принципова схема вузла автопрограматора</text>

  <!-- USB-UART Box -->
  <rect x="50" y="140" width="80" height="220" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="90" y="165" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">USB-UART</text>
  <text x="90" y="182" font-size="11" fill="#6b7280" text-anchor="middle">(CP2102/CH340)</text>

  <text x="122" y="214" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">DTR</text>
  <circle cx="130" cy="210" r="3" fill="#2457d6"/>

  <text x="122" y="314" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">RTS</text>
  <circle cx="130" cy="310" r="3" fill="#2457d6"/>

  <!-- ESP8266 Box -->
  <rect x="370" y="140" width="85" height="220" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="412" y="165" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">ESP8266</text>
  <text x="412" y="182" font-size="11" fill="#6b7280" text-anchor="middle">(SoC / Module)</text>

  <text x="378" y="214" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">RST</text>
  <circle cx="370" cy="210" r="3" fill="#27ae60"/>

  <text x="378" y="314" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">GPIO0</text>
  <circle cx="370" cy="310" r="3" fill="#27ae60"/>

  <!-- Signal Lines & Routing -->

  <!-- DTR Line (Blue) -->
  <path d="M 130 210 L 140 210" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="140" cy="210" r="3" fill="#2457d6"/>
  <!-- DTR to Q1 Emitter (top route) -->
  <path d="M 140 210 L 140 160 L 255 160 L 255 185" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <!-- DTR to R2 (Base Q2) -->
  <path d="M 140 210 L 140 295 L 165 295" fill="none" stroke="#2457d6" stroke-width="1.5"/>

  <!-- RTS Line (Blue) -->
  <path d="M 130 310 L 150 310" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="150" cy="310" r="3" fill="#2457d6"/>
  <!-- RTS to R1 (Base Q1) -->
  <path d="M 150 310 L 150 205 L 165 205" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <!-- RTS to Q2 Emitter (bottom route) -->
  <path d="M 150 310 L 150 350 L 255 350 L 255 325" fill="none" stroke="#2457d6" stroke-width="1.5"/>

  <!-- R1 (RTS to Base Q1) -->
  <text x="185" y="188" font-size="11" fill="#1a1a1a" text-anchor="middle">R1 10k</text>
  <rect x="165" y="196" width="40" height="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <path d="M 205 205 L 230 205" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Q1 (NPN) Transistor Box -->
  <rect x="230" y="185" width="50" height="40" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="255" y="202" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Q1</text>
  <text x="255" y="217" font-size="11" fill="#6b7280" text-anchor="middle">NPN</text>

  <!-- Q1 Collector to RST Line -->
  <path d="M 280 210 L 370 210" fill="none" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="320" cy="210" r="3" fill="#27ae60"/>

  <!-- Pull-up R3 to VCC for RST -->
  <text x="320" y="118" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">VCC (3.3V)</text>
  <path d="M 320 122 L 320 145" fill="none" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="310" y="145" width="20" height="30" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
  <text x="340" y="163" font-size="11" fill="#1a1a1a" text-anchor="start">R3 10k</text>
  <path d="M 320 175 L 320 210" fill="none" stroke="#27ae60" stroke-width="1.5"/>

  <!-- R2 (DTR to Base Q2) -->
  <text x="185" y="278" font-size="11" fill="#1a1a1a" text-anchor="middle">R2 10k</text>
  <rect x="165" y="286" width="40" height="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <path d="M 205 295 L 230 295" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Q2 (NPN) Transistor Box -->
  <rect x="230" y="285" width="50" height="40" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="255" y="302" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Q2</text>
  <text x="255" y="317" font-size="11" fill="#6b7280" text-anchor="middle">NPN</text>

  <!-- Q2 Collector to GPIO0 Line -->
  <path d="M 280 310 L 370 310" fill="none" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="345" cy="310" r="3" fill="#27ae60"/>

  <!-- Pull-up R4 to VCC for GPIO0 -->
  <text x="345" y="233" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">VCC (3.3V)</text>
  <path d="M 345 237 L 345 250" fill="none" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="335" y="250" width="20" height="30" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
  <text x="362" y="268" font-size="11" fill="#1a1a1a" text-anchor="start">R4 10k</text>
  <path d="M 345 280 L 345 310" fill="none" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Table of Logic States -->
  <rect x="45" y="385" width="410" height="110" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="250" y="403" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Таблиця істинності керування виводами</text>

  <!-- Table Header -->
  <line x1="45" y1="411" x2="455" y2="411" stroke="#d0d7de" stroke-width="1"/>
  <text x="85" y="425" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">DTR</text>
  <text x="145" y="425" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">RTS</text>
  <text x="205" y="425" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">RST</text>
  <text x="265" y="425" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">GPIO0</text>
  <text x="365" y="425" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Режим / Стан</text>
  <line x1="45" y1="431" x2="455" y2="431" stroke="#d0d7de" stroke-width="1"/>

  <!-- Row 1 -->
  <text x="85" y="444" font-size="11" fill="#1a1a1a" text-anchor="middle">1 (HIGH)</text>
  <text x="145" y="444" font-size="11" fill="#1a1a1a" text-anchor="middle">1 (HIGH)</text>
  <text x="205" y="444" font-size="11" fill="#1a1a1a" text-anchor="middle">1</text>
  <text x="265" y="444" font-size="11" fill="#1a1a1a" text-anchor="middle">1</text>
  <text x="365" y="444" font-size="11" fill="#6b7280" text-anchor="middle">Нормальна робота</text>

  <!-- Row 2 -->
  <text x="85" y="462" font-size="11" fill="#1a1a1a" text-anchor="middle">1 (HIGH)</text>
  <text x="145" y="462" font-size="11" fill="#1a1a1a" text-anchor="middle">0 (LOW)</text>
  <text x="205" y="462" font-size="11" fill="#1a1a1a" text-anchor="middle">1</text>
  <text x="265" y="462" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">0</text>
  <text x="365" y="462" font-size="11" fill="#c0392b" text-anchor="middle">Підготовка Bootloader</text>

  <!-- Row 3 -->
  <text x="85" y="480" font-size="11" fill="#1a1a1a" text-anchor="middle">0 (LOW)</text>
  <text x="145" y="480" font-size="11" fill="#1a1a1a" text-anchor="middle">1 (HIGH)</text>
  <text x="205" y="480" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">0</text>
  <text x="265" y="480" font-size="11" fill="#1a1a1a" text-anchor="middle">1</text>
  <text x="365" y="480" font-size="11" fill="#c0392b" text-anchor="middle">Імпульс Скидання (RST)</text>

  <!-- Right Panel: Timing Diagram -->
  <rect x="490" y="70" width="440" height="440" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="710" y="94" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма сигналів прошивання</text>

  <!-- Vertical Phase dividers -->
  <line x1="580" y1="120" x2="580" y2="430" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="670" y1="120" x2="670" y2="430" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="770" y1="120" x2="770" y2="430" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="860" y1="120" x2="860" y2="430" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Phase Headers -->
  <text x="625" y="135" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="middle">Фаза 1</text>
  <text x="625" y="148" font-size="10" fill="#6b7280" text-anchor="middle">GPIO0=0</text>

  <text x="720" y="135" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Фаза 2</text>
  <text x="720" y="148" font-size="10" fill="#c0392b" text-anchor="middle">RST Pulse</text>

  <text x="815" y="135" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Фаза 3</text>
  <text x="815" y="148" font-size="10" fill="#27ae60" text-anchor="middle">Latch Boot</text>

  <text x="890" y="135" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="middle">Фаза 4</text>
  <text x="890" y="148" font-size="10" fill="#6b7280" text-anchor="middle">UART Run</text>

  <!-- Waveform 1: DTR -->
  <text x="565" y="185" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">DTR</text>
  <line x1="570" y1="195" x2="920" y2="195" stroke="#e0e0e0" stroke-width="1"/>
  <path d="M 570 175 L 670 175 L 670 205 L 770 205 L 770 175 L 920 175" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Waveform 2: RTS -->
  <text x="565" y="245" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">RTS</text>
  <line x1="570" y1="255" x2="920" y2="255" stroke="#e0e0e0" stroke-width="1"/>
  <path d="M 570 235 L 580 235 L 580 265 L 670 265 L 670 235 L 920 235" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Waveform 3: RST -->
  <text x="565" y="315" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">RST</text>
  <line x1="570" y1="325" x2="920" y2="325" stroke="#e0e0e0" stroke-width="1"/>
  <path d="M 570 305 L 670 305 L 670 335 L 770 335 L 770 305 L 920 305" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Waveform 4: GPIO0 -->
  <text x="565" y="385" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">GPIO0</text>
  <line x1="570" y1="395" x2="920" y2="395" stroke="#e0e0e0" stroke-width="1"/>
  <path d="M 570 375 L 580 375 L 580 405 L 860 405 L 860 375 L 920 375" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Highlight Box: Latch-in Window on RST rising edge -->
  <rect x="762" y="295" width="16" height="115" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" stroke-dasharray="2 2" opacity="0.8"/>
  <path d="M 770 410 L 770 445" fill="none" stroke="#27ae60" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <rect x="620" y="445" width="280" height="32" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="760" y="465" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Вікно фіксації (Latch-in): GPIO0 = 0</text>
</svg>
