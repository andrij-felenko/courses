<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="35" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Еквівалентна схема входу GPIO ESP8266 та пороги тригера Шмітта</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Дільник R_pull та R_leak визначає напругу V_GPIO, яка має бути вище V_IH (2.48V) для надійного High</text>

  <!-- Main Container Panel -->
  <rect x="30" y="75" width="900" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- LEFT PANEL: EQUIVALENT CIRCUIT SCHEMATIC -->
  <rect x="50" y="90" width="415" height="395" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="257" y="115" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Еквівалентна електрична схема входу GPIO</text>

  <!-- VDD Power Rail -->
  <line x1="120" y1="140" x2="220" y2="140" stroke="#2457d6" stroke-width="2.5"/>
  <text x="170" y="132" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">VDD = 3.3V</text>
  <line x1="170" y1="140" x2="170" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Pull-Up Resistor (R_pull) -->
  <rect x="158" y="160" width="24" height="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="2"/>
  <text x="195" y="185" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="start">R_pull (10 кОм)</text>
  <text x="195" y="200" font-size="11" fill="#6b7280" text-anchor="start">Резистор підтяжки</text>
  <line x1="170" y1="210" x2="170" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- GPIO Node (V_GPIO) -->
  <circle cx="170" cy="240" r="4.5" fill="#1a1a1a"/>
  <text x="155" y="244" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">V_GPIO</text>

  <!-- Branch to Leakage (R_leak) & Ground -->
  <line x1="170" y1="240" x2="170" y2="270" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="142" y1="248" x2="142" y2="278" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="134" y="266" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="end">I_leak</text>

  <rect x="158" y="270" width="24" height="50" fill="#fdecea" stroke="#c0392b" stroke-width="2" rx="2"/>
  <text x="195" y="295" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="start">R_leak</text>
  <text x="195" y="310" font-size="11" fill="#6b7280" text-anchor="start">Витік (ESD / CMOS)</text>

  <!-- Ground Connection -->
  <line x1="170" y1="320" x2="170" y2="340" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="152" y1="340" x2="188" y2="340" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="158" y1="345" x2="182" y2="345" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="164" y1="350" x2="176" y2="350" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="170" y="366" font-size="11" fill="#6b7280" text-anchor="middle">GND (0V)</text>

  <!-- Branch to Schmitt Trigger -->
  <line x1="170" y1="240" x2="330" y2="240" stroke="#2457d6" stroke-width="2"/>
  <polygon points="330,210 390,240 330,270" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <!-- Schmitt Hysteresis Symbol -->
  <path d="M 345 233 L 357 233 L 357 247 M 357 247 L 345 247" stroke="#2457d6" stroke-width="1.8" fill="none"/>
  <line x1="390" y1="240" x2="415" y2="240" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="360" y="200" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Тригер Шмітта</text>
  <text x="425" y="244" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">до ROM</text>

  <!-- Bottom Voltage Divider Equation Box -->
  <rect x="65" y="385" width="385" height="85" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="257" y="405" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Формула дільника напруги на вході GPIO:</text>
  <text x="257" y="428" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">V_GPIO = VDD × R_leak / (R_pull + R_leak) &gt; V_IH</text>
  <text x="257" y="452" font-size="11" fill="#6b7280" text-anchor="middle">Для надійного High рівень V_GPIO має перевищувати поріг V_IH</text>

  <!-- RIGHT PANEL: SCHMITT TRIGGER THRESHOLDS & HYSTERESIS -->
  <rect x="495" y="90" width="415" height="395" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="702" y="115" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Пороги спрацьовування тригера Шмітта ESP8266</text>

  <!-- Voltage Scale Bar Ruler -->
  <line x1="580" y1="140" x2="580" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Ruler Ticks & Labels -->
  <line x1="573" y1="140" x2="580" y2="140" stroke="#2457d6" stroke-width="1.5"/>
  <text x="570" y="144" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="end">3.3V (VDD)</text>

  <line x1="573" y1="180" x2="580" y2="180" stroke="#27ae60" stroke-width="1.5"/>
  <text x="570" y="184" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="end">V_IH ≈ 2.48V</text>

  <line x1="573" y1="250" x2="580" y2="250" stroke="#2457d6" stroke-width="1.5"/>
  <text x="570" y="254" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="end">V_IL ≈ 0.83V</text>

  <line x1="573" y1="320" x2="580" y2="320" stroke="#6b7280" stroke-width="1.5"/>
  <text x="570" y="324" font-size="11" fill="#6b7280" text-anchor="end">0V (GND)</text>

  <!-- Voltage Scale Zones (Bar x=590..680) -->
  <!-- High Zone -->
  <rect x="590" y="140" width="90" height="40" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="635" y="164" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Логічна 1 (High)</text>

  <!-- Undefined / Hysteresis Zone -->
  <rect x="590" y="180" width="90" height="70" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="635" y="210" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Невизначена зона</text>
  <text x="635" y="226" font-size="11" fill="#c0392b" text-anchor="middle">(Гістерезис ΔV)</text>

  <!-- Low Zone -->
  <rect x="590" y="250" width="90" height="70" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="635" y="289" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Логічний 0 (Low)</text>

  <!-- Spec Cards Beside Scale Bar -->
  <!-- High Card -->
  <rect x="695" y="140" width="190" height="50" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="705" y="158" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="start">V_IH = 0.75 × VDD</text>
  <text x="705" y="175" font-size="11" fill="#1a1a1a" text-anchor="start">Мінімум для фіксації High</text>
  <line x1="680" y1="180" x2="695" y2="165" stroke="#27ae60" stroke-dasharray="3,3" stroke-width="1"/>

  <!-- Undefined Card -->
  <rect x="695" y="200" width="190" height="55" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="705" y="218" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="start">Заборонений діапазон!</text>
  <text x="705" y="235" font-size="11" fill="#1a1a1a" text-anchor="start">Невпевнений старт ROM</text>
  <text x="705" y="248" font-size="11" fill="#c0392b" text-anchor="start">Ризик збою boot mode</text>
  <line x1="680" y1="215" x2="695" y2="225" stroke="#c0392b" stroke-dasharray="3,3" stroke-width="1"/>

  <!-- Low Card -->
  <rect x="695" y="265" width="190" height="50" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="705" y="283" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="start">V_IL = 0.25 × VDD</text>
  <text x="705" y="300" font-size="11" fill="#1a1a1a" text-anchor="start">Максимум для фіксації Low</text>
  <line x1="680" y1="250" x2="695" y2="290" stroke="#2457d6" stroke-dasharray="3,3" stroke-width="1"/>

  <!-- Bottom Rules Card on Right Panel -->
  <rect x="510" y="335" width="385" height="135" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="702" y="357" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Правила та рекомендації розрахунку R_pull:</text>
  <text x="525" y="380" font-size="11" fill="#1a1a1a" text-anchor="start">• Верхнє обмеження: R_pull &lt; (VDD - V_IH) / I_leak_max</text>
  <text x="525" y="402" font-size="11" fill="#1a1a1a" text-anchor="start">• Нижнє обмеження: R_pull &gt; VDD / I_out_max (захист драйвера)</text>
  <text x="525" y="424" font-size="11" fill="#1a1a1a" text-anchor="start">• Оптимальний номінал для ESP8266: 10 кОм (діапазон 4.7–12 кОм)</text>
  <text x="525" y="450" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="start">Висновок: 10 кОм надає 5-кратний запас завадостійкості</text>
</svg>
