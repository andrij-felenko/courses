<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Матриця режимів завантаження ESP8266 за рівнями Strapping Pins</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Схема зовнішніх підтяжок та апаратна таблиця вибору режиму старту при знятті сигналу RST</text>

  <!-- Left Panel: Schematic -->
  <rect x="20" y="75" width="420" height="385" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="230" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Схема схемотехнічної обв'язки виводів</text>

  <!-- ESP8266 Chip Box -->
  <rect x="285" y="115" width="140" height="325" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="355" y="142" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">ESP8266EX</text>
  <text x="355" y="162" text-anchor="middle" font-size="12" fill="#6b7280">ROM Bootloader</text>

  <!-- GPIO15 Pin & Wiring -->
  <text x="35" y="187" font-size="12" font-weight="bold" fill="#c0392b">Pull-Down (GPIO15)</text>
  <text x="35" y="213" font-size="12" fill="#6b7280">10 kΩ до GND</text>

  <line x1="35" y1="195" x2="285" y2="195" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="285" cy="195" r="3.5" fill="#2457d6"/>
  <text x="293" y="199" font-size="12" font-weight="bold" fill="#1a1a1a">GPIO15</text>

  <!-- Resistor R_pd to GND -->
  <circle cx="180" cy="195" r="2.5" fill="#1a1a1a"/>
  <line x1="180" y1="195" x2="180" y2="210" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="172" y="210" width="16" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="194" y="226" font-size="11" fill="#6b7280">10 kΩ</text>
  <line x1="180" y1="234" x2="180" y2="246" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- GND symbol -->
  <line x1="170" y1="246" x2="190" y2="246" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="174" y1="250" x2="186" y2="250" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="178" y1="254" x2="182" y2="254" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- GPIO0 Pin & Wiring -->
  <text x="35" y="278" font-size="12" font-weight="bold" fill="#27ae60">Pull-Up (GPIO0)</text>
  <text x="35" y="294" font-size="12" fill="#6b7280">10 kΩ до 3.3V</text>
  <text x="35" y="310" font-size="12" fill="#2457d6">Кнопка Flash</text>

  <line x1="35" y1="290" x2="285" y2="290" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="285" cy="290" r="3.5" fill="#2457d6"/>
  <text x="293" y="294" font-size="12" font-weight="bold" fill="#1a1a1a">GPIO0</text>

  <!-- Resistor R_pu0 to 3.3V (Branch at x=160) -->
  <circle cx="160" cy="290" r="2.5" fill="#1a1a1a"/>
  <line x1="160" y1="290" x2="160" y2="274" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="152" y="250" width="16" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="132" y="266" text-anchor="end" font-size="11" fill="#6b7280">10 kΩ</text>
  <line x1="160" y1="250" x2="160" y2="238" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="160" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">3.3V</text>

  <!-- Flash Button to GND (Branch at x=220) -->
  <circle cx="220" cy="290" r="2.5" fill="#1a1a1a"/>
  <line x1="220" y1="290" x2="220" y2="304" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="220" cy="304" r="2.5" fill="#1a1a1a"/>
  <line x1="220" y1="304" x2="232" y2="296" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="220" cy="316" r="2.5" fill="#1a1a1a"/>
  <line x1="220" y1="316" x2="220" y2="328" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="236" y="314" font-size="11" fill="#2457d6">Flash SW</text>
  <!-- Button GND -->
  <line x1="210" y1="328" x2="230" y2="328" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="214" y1="332" x2="226" y2="332" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="218" y1="336" x2="222" y2="336" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- GPIO2 Pin & Wiring -->
  <text x="35" y="377" font-size="12" font-weight="bold" fill="#27ae60">Pull-Up (GPIO2)</text>
  <text x="35" y="395" font-size="12" fill="#6b7280">10 kΩ до 3.3V</text>

  <line x1="35" y1="385" x2="285" y2="385" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="285" cy="385" r="3.5" fill="#2457d6"/>
  <text x="293" y="389" font-size="12" font-weight="bold" fill="#1a1a1a">GPIO2</text>

  <!-- Resistor R_pu2 to 3.3V (Branch at x=160) -->
  <circle cx="160" cy="385" r="2.5" fill="#1a1a1a"/>
  <line x1="160" y1="385" x2="160" y2="369" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="152" y="345" width="16" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="174" y="361" font-size="11" fill="#6b7280">10 kΩ</text>
  <line x1="160" y1="345" x2="160" y2="333" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="160" y="329" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">3.3V</text>

  <!-- Right Panel: Matrix Table -->
  <rect x="455" y="75" width="485" height="385" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="697" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Логічна таблиця режимів завантаження</text>

  <!-- Table Header Box -->
  <rect x="465" y="115" width="465" height="32" rx="4" fill="#eaf0fd" stroke="#d0d7de"/>
  <text x="492" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">GPIO15</text>
  <text x="547" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">GPIO0</text>
  <text x="602" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">GPIO2</text>
  <text x="692" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Режим завантаження</text>
  <text x="842" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Опис та джерело коду</text>

  <!-- Row 1: SPI Flash Boot -->
  <rect x="465" y="155" width="465" height="85" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="492" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">0 (GND)</text>
  <text x="547" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">1 (3.3V)</text>
  <text x="602" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">1 (3.3V)</text>
  <text x="692" y="190" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">SPI Flash Boot</text>
  <text x="692" y="210" text-anchor="middle" font-size="11" fill="#6b7280">(Flash пам'ять)</text>
  <text x="760" y="182" font-size="12" fill="#1a1a1a">Основний режим програми.</text>
  <text x="760" y="200" font-size="12" fill="#1a1a1a">Запуск коду із зовнішньої</text>
  <text x="760" y="218" font-size="12" fill="#1a1a1a">пам'яті SPI Flash.</text>

  <!-- Row 2: UART Download -->
  <rect x="465" y="250" width="465" height="85" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="492" y="297" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">0 (GND)</text>
  <text x="547" y="297" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">0 (GND)</text>
  <text x="602" y="297" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">1 (3.3V)</text>
  <text x="692" y="285" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">UART Download</text>
  <text x="692" y="305" text-anchor="middle" font-size="11" fill="#6b7280">(Режим прошивки)</text>
  <text x="760" y="277" font-size="12" fill="#1a1a1a">Завантаження прошивки.</text>
  <text x="760" y="295" font-size="12" fill="#1a1a1a">Прийом бінарного коду</text>
  <text x="760" y="313" font-size="12" fill="#1a1a1a">через послідовний UART0.</text>

  <!-- Row 3: SDIO Boot -->
  <rect x="465" y="345" width="465" height="85" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="492" y="392" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">1 (3.3V)</text>
  <text x="547" y="392" text-anchor="middle" font-size="12" fill="#6b7280">x (X)</text>
  <text x="602" y="392" text-anchor="middle" font-size="12" fill="#6b7280">x (X)</text>
  <text x="692" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">SDIO Boot</text>
  <text x="692" y="400" text-anchor="middle" font-size="11" fill="#6b7280">(Помилка/SDIO)</text>
  <text x="760" y="372" font-size="12" fill="#1a1a1a">Запуск через шину SDIO.</text>
  <text x="760" y="390" font-size="12" fill="#1a1a1a">Спричиняє відмову старту</text>
  <text x="760" y="408" font-size="12" fill="#1a1a1a">без pull-down на GPIO15.</text>
</svg>
