<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Протокол SLIP та handshake-обмін утиліти esptool з ROM ESP8266</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">Синхронізація (0x08), байт-стаффінг спецсимволів (0xC0 -&gt; 0xDB 0xDC) та відповіді завантажувача</text>

  <!-- Main Panel -->
  <rect x="35" y="85" width="890" height="355" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Left Side: Sequence Diagram -->
  <!-- Lifelines -->
  <line x1="120" y1="136" x2="120" y2="315" stroke="#2457d6" stroke-dasharray="4,4" stroke-width="1.5"/>
  <line x1="420" y1="136" x2="420" y2="315" stroke="#27ae60" stroke-dasharray="4,4" stroke-width="1.5"/>

  <!-- Lifeline Header Boxes -->
  <rect x="65" y="100" width="110" height="36" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="120" y="123" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">ПК / esptool</text>

  <rect x="365" y="100" width="110" height="36" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="420" y="123" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">ESP8266 ROM</text>

  <!-- Message 1: SYNC Req -->
  <line x1="120" y1="160" x2="420" y2="160" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="270" y="152" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">1. SYNC Req (0x08, payload: 0x55...)</text>

  <!-- Message 2: SYNC Resp -->
  <line x1="420" y1="195" x2="120" y2="195" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="270" y="187" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">2. SYNC Resp (ACK: 0x00 0x00)</text>

  <!-- Message 3: FLASH_BEGIN -->
  <line x1="120" y1="230" x2="420" y2="230" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="270" y="222" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">3. FLASH_BEGIN (0x02, addr, size)</text>

  <!-- Message 4: FLASH_BEGIN Resp -->
  <line x1="420" y1="265" x2="120" y2="265" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="270" y="257" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">4. FLASH_BEGIN Resp (ACK)</text>

  <!-- Message 5: FLASH_DATA -->
  <line x1="120" y1="300" x2="420" y2="300" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="270" y="292" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">5. FLASH_DATA (0x03, block 1K)</text>

  <!-- Bottom Left Note Card -->
  <rect x="55" y="325" width="435" height="100" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="70" y="347" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">Статуси та відповіді завантажувача:</text>
  <text x="70" y="369" font-size="12" fill="#6b7280" text-anchor="start">• ACK відповідь: Status=0x00 0x00 (Success)</text>
  <text x="70" y="389" font-size="12" fill="#6b7280" text-anchor="start">• NACK відповідь: Status=0x05 0x0X (Bad Checksum)</text>
  <text x="70" y="410" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">Помилка CRC призводить до повторної відправки</text>

  <!-- Right Side: Cards -->
  <!-- Right Card 1: SLIP Frame Structure -->
  <rect x="510" y="100" width="385" height="155" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="525" y="122" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">Структура SLIP-пакета (UART Protocol):</text>

  <!-- SLIP Fields Diagram -->
  <rect x="525" y="135" width="65" height="35" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="557" y="157" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">0xC0</text>

  <rect x="595" y="135" width="80" height="35" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="635" y="157" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Header</text>

  <rect x="680" y="135" width="135" height="35" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="747" y="157" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Data (0..1024B)</text>

  <rect x="820" y="135" width="60" height="35" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="850" y="157" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">0xC0</text>

  <!-- SLIP Field Descriptions -->
  <text x="525" y="195" font-size="12" fill="#6b7280" text-anchor="start">• Header: [Dir(1B) | Cmd(1B) | Size(2B) | Checksum(4B)]</text>
  <text x="525" y="215" font-size="12" fill="#6b7280" text-anchor="start">• Checksum: XOR усіх байтів payload (для даних)</text>
  <text x="525" y="235" font-size="12" fill="#6b7280" text-anchor="start">• Обмежувачі кадру: маркер 0xC0 (SLIP_END)</text>

  <!-- Right Card 2: Byte Stuffing -->
  <rect x="510" y="265" width="385" height="160" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="525" y="287" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="start">Правила байт-стаффінгу (Escape Sequences):</text>
  <text x="525" y="310" font-size="12" fill="#1a1a1a" text-anchor="start">• Символ 0xC0 (END) =&gt; замінюється на [0xDB, 0xDC]</text>
  <text x="525" y="332" font-size="12" fill="#1a1a1a" text-anchor="start">• Символ 0xDB (ESC) =&gt; замінюється на [0xDB, 0xDD]</text>
  <text x="525" y="354" font-size="12" fill="#6b7280" text-anchor="start">Запобігає хибному виявленню кінця пакета</text>
  <text x="525" y="380" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">Швидкість UART: 74880 бод (log) / 115200+ (SLIP)</text>
  <text x="525" y="405" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">Висновок: SLIP забезпечує кадрування у порті</text>
</svg>
