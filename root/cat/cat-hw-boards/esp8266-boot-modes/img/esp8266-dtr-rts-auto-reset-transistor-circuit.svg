<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема автозавантаження ESP8266 на транзисторній парі NPN</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Керування лініями RST та GPIO0 через перехресні транзистори від сигналів DTR і RTS</text>

  <!-- Left Panel: USB-UART Adapter -->
  <rect x="40" y="95" width="180" height="355" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="130" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">USB-UART адаптер</text>
  <text x="130" y="142" text-anchor="middle" font-size="12" fill="#6b7280">(CP2102 / CH340)</text>

  <!-- DTR Signal Out -->
  <rect x="170" y="186" width="50" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="195" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">DTR</text>

  <!-- RTS Signal Out -->
  <rect x="170" y="326" width="50" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="195" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">RTS</text>

  <!-- Middle Panel: Auto-Reset Transistor Circuit -->
  <rect x="245" y="95" width="450" height="355" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="470" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Вузол автозавантаження (Auto-Reset)</text>

  <!-- 3.3V Power Rail Top -->
  <line x1="320" y1="140" x2="650" y2="140" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="320" cy="140" r="3" fill="#27ae60"/>
  <circle cx="650" cy="140" r="3" fill="#27ae60"/>
  <text x="485" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Шина живлення +3.3 В</text>

  <!-- DTR Main Line (y=200) -->
  <line x1="220" y1="200" x2="430" y2="200" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="280" cy="200" r="4" fill="#2457d6"/>

  <!-- RTS Main Line (y=340) -->
  <line x1="220" y1="340" x2="550" y2="340" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="300" cy="340" r="4" fill="#2457d6"/>

  <!-- Resistor R1 Branch (from RTS y=340 to Q1 Base y=230) -->
  <line x1="300" y1="340" x2="300" y2="230" stroke="#2457d6" stroke-width="2"/>
  <line x1="300" y1="230" x2="325" y2="230" stroke="#2457d6" stroke-width="2"/>
  <rect x="325" y="222" width="40" height="16" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="2"/>
  <text x="345" y="217" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">R1 12к</text>
  <line x1="365" y1="230" x2="390" y2="230" stroke="#2457d6" stroke-width="2"/>

  <!-- Transistor Q1 (NPN for RST) -->
  <!-- Base Bar -->
  <line x1="390" y1="215" x2="390" y2="245" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Collector Lead to y=160 -->
  <line x1="390" y1="220" x2="430" y2="160" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Emitter Lead to DTR line (y=200) -->
  <line x1="390" y1="240" x2="430" y2="200" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Emitter Arrow pointing outwards -->
  <polygon points="415,225 430,200 422,212" fill="#1a1a1a"/>
  <!-- Q1 Label -->
  <text x="445" y="220" font-size="12" font-weight="bold" fill="#1a1a1a">Q1 (NPN)</text>

  <!-- RST Line (y=160) -->
  <line x1="430" y1="160" x2="715" y2="160" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="560" y="152" font-size="12" font-weight="bold" fill="#2457d6">Сигнал RST</text>

  <!-- R_pull1 (10k) for RST -->
  <line x1="490" y1="140" x2="490" y2="148" stroke="#27ae60" stroke-width="2"/>
  <rect x="482" y="148" width="16" height="30" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="2"/>
  <text x="508" y="167" font-size="11" font-weight="bold" fill="#27ae60">R_pull 10к</text>
  <line x1="490" y1="178" x2="490" y2="160" stroke="#27ae60" stroke-width="2"/>
  <circle cx="490" cy="160" r="4" fill="#27ae60"/>

  <!-- Resistor R2 Branch (from DTR y=200 to Q2 Base y=300) -->
  <line x1="280" y1="200" x2="280" y2="300" stroke="#2457d6" stroke-width="2"/>
  <line x1="280" y1="300" x2="325" y2="300" stroke="#2457d6" stroke-width="2"/>
  <rect x="325" y="292" width="40" height="16" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="2"/>
  <text x="345" y="287" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">R2 12к</text>
  <line x1="365" y1="300" x2="510" y2="300" stroke="#2457d6" stroke-width="2"/>

  <!-- Transistor Q2 (NPN for GPIO0) -->
  <!-- Base Bar -->
  <line x1="510" y1="285" x2="510" y2="315" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Collector Lead to GPIO0 line y=280 -->
  <line x1="510" y1="290" x2="550" y2="280" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Emitter Lead to RTS line y=340 -->
  <line x1="510" y1="310" x2="550" y2="340" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Emitter Arrow pointing outwards -->
  <polygon points="535,329 550,340 542,327" fill="#1a1a1a"/>
  <!-- Q2 Label -->
  <text x="565" y="315" font-size="12" font-weight="bold" fill="#1a1a1a">Q2 (NPN)</text>

  <!-- GPIO0 Line (y=280) -->
  <line x1="550" y1="280" x2="715" y2="280" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="635" y="272" font-size="12" font-weight="bold" fill="#2457d6">Сигнал GPIO0</text>

  <!-- R_pull2 (10k) for GPIO0 -->
  <line x1="610" y1="140" x2="610" y2="265" stroke="#27ae60" stroke-width="2"/>
  <rect x="602" y="195" width="16" height="30" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="2"/>
  <text x="628" y="214" font-size="11" font-weight="bold" fill="#27ae60">R_pull 10к</text>
  <line x1="610" y1="265" x2="610" y2="280" stroke="#27ae60" stroke-width="2"/>
  <circle cx="610" cy="280" r="4" fill="#27ae60"/>

  <!-- Right Panel: ESP8266 Module / Mode Truth Table -->
  <rect x="715" y="95" width="205" height="355" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="817" y="120" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">ESP8266 / NodeMCU</text>

  <!-- RST Pin Box -->
  <rect x="725" y="146" width="55" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="752" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">RST</text>

  <!-- GPIO0 Pin Box -->
  <rect x="725" y="266" width="55" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="752" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">GPIO0</text>

  <!-- Logic Truth Table Box -->
  <rect x="723" y="315" width="189" height="120" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="817" y="332" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Логіка роботи сигналів</text>
  <text x="730" y="352" font-size="11" font-weight="bold" fill="#c0392b">DTR=0, RTS=1 → RST=0 (Скидання)</text>
  <text x="730" y="372" font-size="11" font-weight="bold" fill="#2457d6">DTR=1, RTS=0 → GPIO0=0 (UART Boot)</text>
  <text x="730" y="392" font-size="11" fill="#27ae60">DTR=1, RTS=1 → RST=1, GPIO0=1</text>
  <text x="730" y="412" font-size="11" fill="#6b7280">DTR=0, RTS=0 → Обидва вимкнені</text>
</svg>
