<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Markers -->
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Дерево прийняття рішень ROM-завантажувача ESP8266</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Вибір режиму завантаження за станами strapping-виводів GPIO15, GPIO0 та GPIO2 при скиданні</text>

  <!-- Start Node (Level 0) -->
  <rect x="320" y="75" width="320" height="45" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="6"/>
  <text x="480" y="93" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Скидання / Подача живлення (RST / POR)</text>
  <text x="480" y="110" font-size="12" fill="#6b7280" text-anchor="middle">Зчитування логічних рівнів засувок</text>

  <!-- Arrow L0 -> L1 -->
  <line x1="480" y1="120" x2="480" y2="139" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Decision Node 1 (Level 1: GPIO15) -->
  <rect x="320" y="145" width="320" height="50" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="480" y="165" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Перевірка GPIO15 (MTDO)</text>
  <text x="480" y="182" font-size="12" fill="#6b7280" text-anchor="middle">Чи дорівнює GPIO15 = 0 (GND)?</text>

  <!-- Arrow L1 -> SDIO Error (Right) -->
  <line x1="640" y1="170" x2="677" y2="170" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="658" y="162" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">1 (VCC)</text>

  <!-- SDIO Error Box -->
  <rect x="685" y="140" width="240" height="60" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <text x="805" y="160" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">⛔ SDIO Boot / Помилка</text>
  <text x="805" y="177" font-size="12" fill="#1a1a1a" text-anchor="middle">Некоректний запуск (SDIO Slave)</text>
  <text x="805" y="192" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Вимагає підтяжки до GND!</text>

  <!-- Arrow L1 -> L2 (Down) -->
  <line x1="480" y1="195" x2="480" y2="234" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="492" y="219" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">0 (GND) [ОК]</text>

  <!-- Decision Node 2 (Level 2: GPIO0) -->
  <rect x="320" y="240" width="320" height="50" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="480" y="260" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Перевірка GPIO0</text>
  <text x="480" y="277" font-size="12" fill="#6b7280" text-anchor="middle">Вибір типу: Flash чи UART</text>

  <!-- Branch L2 -> L3 Left (UART Path) -->
  <path d="M 320 265 L 220 265 L 220 319" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="270" y="255" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">0 (GND) / Flash кнопка</text>

  <!-- Branch L2 -> L3 Right (Flash Path) -->
  <path d="M 640 265 L 740 265 L 740 319" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="690" y="255" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">1 (VCC) / Підтяжка</text>

  <!-- Decision Node 3A (Level 3 Left: GPIO2) -->
  <rect x="130" y="325" width="180" height="50" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="220" y="345" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Перевірка GPIO2</text>
  <text x="220" y="362" font-size="12" fill="#6b7280" text-anchor="middle">Вхідний рівень GPIO2</text>

  <!-- Decision Node 3B (Level 3 Right: GPIO2) -->
  <rect x="650" y="325" width="180" height="50" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="740" y="345" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Перевірка GPIO2</text>
  <text x="740" y="362" font-size="12" fill="#6b7280" text-anchor="middle">Вхідний рівень GPIO2</text>

  <!-- Branch L3A -> Final Left (Error) -->
  <path d="M 220 375 L 120 375 L 120 409" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="165" y="368" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">0 (GND)</text>

  <!-- Branch L3A -> Final Right (UART Download) -->
  <path d="M 220 375 L 320 375 L 320 409" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="275" y="368" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">1 (VCC)</text>

  <!-- Branch L3B -> Final Left (Error) -->
  <path d="M 740 375 L 620 375 L 620 409" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="675" y="368" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">0 (GND)</text>

  <!-- Branch L3B -> Final Right (SPI Flash Boot) -->
  <path d="M 740 375 L 820 375 L 820 409" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="775" y="368" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">1 (VCC)</text>

  <!-- Final Outcome 1 (Left Error Box) -->
  <rect x="45" y="415" width="150" height="70" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <text x="120" y="435" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">⛔ Заблоковано</text>
  <text x="120" y="453" font-size="12" fill="#1a1a1a" text-anchor="middle">GPIO2 = 0 (GND)</text>
  <text x="120" y="470" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Заборонений стан</text>

  <!-- Final Outcome 2 (UART Download Box) -->
  <rect x="225" y="415" width="190" height="70" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="6"/>
  <text x="320" y="435" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">⚙️ UART Download</text>
  <text x="320" y="453" font-size="12" fill="#1a1a1a" text-anchor="middle">Режим прошивання</text>
  <text x="320" y="470" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">GPIO15=0, GPIO0=0, GPIO2=1</text>

  <!-- Final Outcome 3 (Right Error Box) -->
  <rect x="545" y="415" width="150" height="70" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <text x="620" y="435" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">⛔ Заблоковано</text>
  <text x="620" y="453" font-size="12" fill="#1a1a1a" text-anchor="middle">GPIO2 = 0 (GND)</text>
  <text x="620" y="470" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Заборонений стан</text>

  <!-- Final Outcome 4 (SPI Flash Boot Box) -->
  <rect x="725" y="415" width="190" height="70" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="6"/>
  <text x="820" y="435" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">🚀 SPI Flash Boot</text>
  <text x="820" y="453" font-size="12" fill="#1a1a1a" text-anchor="middle">Нормальний запуск коду</text>
  <text x="820" y="470" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">GPIO15=0, GPIO0=1, GPIO2=1</text>

  <!-- Summary Panel -->
  <rect x="40" y="502" width="880" height="46" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="480" y="521" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">УМОВА ШТАНОГО ЗАПУСКУ ESP8266 З SPI FLASH:</text>
  <text x="480" y="538" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">GPIO15 = LOW (0 / GND),  GPIO0 = HIGH (1 / VCC),  GPIO2 = HIGH (1 / VCC)</text>
</svg>
