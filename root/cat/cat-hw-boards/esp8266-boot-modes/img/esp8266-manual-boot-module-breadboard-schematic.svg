<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="35" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принципова схема макетного модуля ручного керування завантаженням ESP8266</text>
  <text x="480" y="55" font-size="13" fill="#6b7280" text-anchor="middle">Кнопки Reset і Flash оснащені підтягувальними резисторами 10 кОм та RC-фільтрами для придушення контактного брязкіту</text>

  <!-- Main Container Panel -->
  <rect x="30" y="70" width="900" height="445" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- LEFT BOX: RESET CHANNEL (RST) -->
  <rect x="45" y="85" width="420" height="415" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="255" y="110" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Канал скидання (RST &amp; CH_PD)</text>

  <!-- VDD Power Rail (Reset) -->
  <line x1="125" y1="135" x2="245" y2="135" stroke="#2457d6" stroke-width="2.5"/>
  <text x="185" y="128" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">VDD = 3.3V</text>
  <line x1="185" y1="135" x2="185" y2="150" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- R1 Pull-Up Resistor -->
  <rect x="173" y="150" width="24" height="45" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="2"/>
  <text x="165" y="172" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">R1 = 10 кОм</text>
  <text x="165" y="187" font-size="12" fill="#6b7280" text-anchor="end">Pull-Up RST</text>
  <line x1="185" y1="195" x2="185" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Node RST -->
  <circle cx="185" cy="230" r="4.5" fill="#1a1a1a"/>
  <text x="165" y="234" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">RST#</text>
  <line x1="185" y1="230" x2="435" y2="230" stroke="#c0392b" stroke-width="2"/>
  <text x="365" y="222" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">до піна RST ESP8266</text>

  <!-- SW1 Push Button (Reset) -->
  <line x1="185" y1="230" x2="185" y2="255" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="185" cy="255" r="3" fill="#1a1a1a"/>
  <circle cx="185" cy="305" r="3" fill="#1a1a1a"/>
  <line x1="175" y1="250" x2="200" y2="240" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="190" y1="245" x2="190" y2="233" stroke="#c0392b" stroke-dasharray="2,2" stroke-width="1.5"/>
  <text x="165" y="275" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">SW1 (Reset)</text>
  <text x="165" y="292" font-size="12" fill="#6b7280" text-anchor="end">Кнопка скидання</text>

  <!-- C1 Anti-bounce Capacitor -->
  <line x1="185" y1="230" x2="325" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="325" y1="230" x2="325" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="310" y1="260" x2="340" y2="260" stroke="#27ae60" stroke-width="2.5"/>
  <line x1="310" y1="268" x2="340" y2="268" stroke="#27ae60" stroke-width="2.5"/>
  <text x="348" y="260" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">C1 = 100 нФ</text>
  <text x="348" y="277" font-size="12" fill="#6b7280" text-anchor="start">RC антибрязкіт</text>

  <!-- Left Ground Connection -->
  <line x1="185" y1="305" x2="185" y2="335" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="325" y1="268" x2="325" y2="335" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="155" y1="335" x2="345" y2="335" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="250" y1="335" x2="250" y2="345" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="235" y1="345" x2="265" y2="345" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="240" y1="350" x2="260" y2="350" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="245" y1="355" x2="255" y2="355" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="250" y="372" font-size="12" fill="#6b7280" text-anchor="middle">GND (0V)</text>

  <!-- Left Explanatory Card -->
  <rect x="65" y="390" width="380" height="90" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="255" y="410" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Параметри RC-фільтра скидання RST:</text>
  <text x="255" y="432" font-size="12" fill="#1a1a1a" text-anchor="middle">• Константа часу: τ = R1 × C1 = 10 кОм × 100 нФ = 1.0 мс</text>
  <text x="255" y="454" font-size="12" fill="#c0392b" text-anchor="middle">• Усуває імпульсний брязкіт контактів SW1 при натисканні</text>


  <!-- RIGHT BOX: BOOT MODE CHANNEL (GPIO0 / SW2) -->
  <rect x="495" y="85" width="420" height="415" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="705" y="110" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Канал режимів завантаження (GPIO0 / SW2)</text>

  <!-- VDD Power Rail (Boot Mode) -->
  <line x1="585" y1="135" x2="705" y2="135" stroke="#2457d6" stroke-width="2.5"/>
  <text x="645" y="128" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">VDD = 3.3V</text>
  <line x1="645" y1="135" x2="645" y2="150" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- R2 Pull-Up Resistor -->
  <rect x="633" y="150" width="24" height="45" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="2"/>
  <text x="625" y="172" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">R2 = 10 кОм</text>
  <text x="625" y="187" font-size="12" fill="#6b7280" text-anchor="end">Pull-Up GPIO0</text>
  <line x1="645" y1="195" x2="645" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Node GPIO0 -->
  <circle cx="645" cy="230" r="4.5" fill="#1a1a1a"/>
  <text x="625" y="234" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">GPIO0</text>
  <line x1="645" y1="230" x2="885" y2="230" stroke="#27ae60" stroke-width="2"/>
  <text x="825" y="222" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">до піна GPIO0 ESP8266</text>

  <!-- SW2 Push Button (Flash / Boot) -->
  <line x1="645" y1="230" x2="645" y2="255" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="645" cy="255" r="3" fill="#1a1a1a"/>
  <circle cx="645" cy="305" r="3" fill="#1a1a1a"/>
  <line x1="635" y1="250" x2="660" y2="240" stroke="#27ae60" stroke-width="2.5"/>
  <line x1="650" y1="245" x2="650" y2="233" stroke="#27ae60" stroke-dasharray="2,2" stroke-width="1.5"/>
  <text x="625" y="275" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">SW2 (Flash)</text>
  <text x="625" y="292" font-size="12" fill="#6b7280" text-anchor="end">Кнопка завантаження</text>

  <!-- C2 Anti-bounce Capacitor -->
  <line x1="645" y1="230" x2="785" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="785" y1="230" x2="785" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="770" y1="260" x2="800" y2="260" stroke="#27ae60" stroke-width="2.5"/>
  <line x1="770" y1="268" x2="800" y2="268" stroke="#27ae60" stroke-width="2.5"/>
  <text x="808" y="260" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">C2 = 100 нФ</text>
  <text x="808" y="277" font-size="12" fill="#6b7280" text-anchor="start">RC антибрязкіт</text>

  <!-- Right Ground Connection -->
  <line x1="645" y1="305" x2="645" y2="335" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="785" y1="268" x2="785" y2="335" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="615" y1="335" x2="805" y2="335" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="710" y1="335" x2="710" y2="345" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="695" y1="345" x2="725" y2="345" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="700" y1="350" x2="720" y2="350" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="705" y1="355" x2="715" y2="355" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="710" y="372" font-size="12" fill="#6b7280" text-anchor="middle">GND (0V)</text>

  <!-- Right Explanatory Card / Algorithm -->
  <rect x="515" y="390" width="380" height="90" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="705" y="410" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Порядок ручного переключення в режим Flash Boot:</text>
  <text x="705" y="432" font-size="12" fill="#1a1a1a" text-anchor="middle">1. Затиснути SW2 (GPIO0=0) → 2. Імпульс SW1 (RST) → 3. Відпустити SW2</text>
  <text x="705" y="454" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Результат: Завантажувач ESP8266 фіксує режим UART Download</text>
</svg>
