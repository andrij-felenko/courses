<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Header -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма стробування strapping-виводів ESP8266</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Фіксація рівнів GPIO15, GPIO0 та GPIO2 виконується у вікні latch-in window при підйомі сигналу RST</text>

  <!-- Latch-in Window Shading (t_latch) -->
  <rect x="460" y="70" width="130" height="315" fill="#eaf0fd" fill-opacity="0.6" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="525" y="85" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вікно защепкування</text>
  <text x="525" y="100" font-size="12" fill="#2457d6" text-anchor="middle">t_latch (1–3 мс)</text>

  <!-- Signal Labels (Left Column) -->
  <text x="180" y="142" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">RST (Скидання)</text>
  <text x="180" y="220" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">GPIO15 (MTDO)</text>
  <text x="180" y="290" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">GPIO0 (Boot Mode)</text>
  <text x="180" y="360" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">GPIO2 (UART1 TX)</text>

  <!-- Threshold Voltages for RST Signal -->
  <line x1="280" y1="115" x2="910" y2="115" stroke="#d0d7de" stroke-width="1"/>
  <line x1="280" y1="130" x2="910" y2="130" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="280" y1="150" x2="910" y2="150" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="280" y1="165" x2="910" y2="165" stroke="#d0d7de" stroke-width="1"/>

  <text x="260" y="117" font-size="11" fill="#6b7280" text-anchor="end">V_CC (3.3В)</text>
  <text x="260" y="132" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="end">V_IH (2.5В)</text>
  <text x="260" y="152" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="end">V_IL (0.8В)</text>
  <text x="260" y="167" font-size="11" fill="#6b7280" text-anchor="end">0 В (GND)</text>

  <!-- RST Waveform Curve -->
  <path d="M 280 165 L 310 165 C 350 165, 390 150, 460 137 C 500 127, 540 115, 580 115 L 910 115" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Intersection Points on RST Ramp -->
  <circle cx="370" cy="150" r="4" fill="#2457d6"/>
  <circle cx="490" cy="130" r="4.5" fill="#2457d6"/>

  <!-- GPIO15 Waveform (LOW / GND) -->
  <line x1="280" y1="220" x2="910" y2="220" stroke="#1a1a1a" stroke-width="2"/>
  <text x="285" y="205" font-size="12" fill="#6b7280">Рівень &lt; V_IL (Низький)</text>
  <circle cx="525" cy="220" r="4.5" fill="#27ae60"/>
  <rect x="620" y="185" width="80" height="24" fill="#e9f7ef" stroke="#27ae60" rx="4"/>
  <text x="660" y="201" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">0 (GND)</text>

  <!-- GPIO0 Waveform (HIGH / VCC) -->
  <line x1="280" y1="290" x2="910" y2="290" stroke="#1a1a1a" stroke-width="2"/>
  <text x="285" y="275" font-size="12" fill="#6b7280">Рівень &gt; V_IH (Високий)</text>
  <circle cx="525" cy="290" r="4.5" fill="#27ae60"/>
  <rect x="620" y="255" width="80" height="24" fill="#e9f7ef" stroke="#27ae60" rx="4"/>
  <text x="660" y="271" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">1 (VCC)</text>

  <!-- GPIO2 Waveform (HIGH / VCC) -->
  <line x1="280" y1="360" x2="910" y2="360" stroke="#1a1a1a" stroke-width="2"/>
  <text x="285" y="345" font-size="12" fill="#6b7280">Рівень &gt; V_IH (Високий)</text>
  <circle cx="525" cy="360" r="4.5" fill="#27ae60"/>
  <rect x="620" y="325" width="80" height="24" fill="#e9f7ef" stroke="#27ae60" rx="4"/>
  <text x="660" y="341" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">1 (VCC)</text>

  <!-- ROM Bootloader Internal State Timeline -->
  <rect x="200" y="395" width="246" height="35" fill="#f4f6f8" stroke="#d0d7de" rx="4"/>
  <text x="323" y="417" font-size="12" fill="#6b7280" text-anchor="middle">Скидання (POR / RST)</text>

  <rect x="460" y="395" width="130" height="35" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="525" y="417" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Зчитування (Latch)</text>

  <rect x="604" y="395" width="306" height="35" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="757" y="417" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Запуск SPI Flash Boot (Нормальний режим)</text>

  <!-- Bottom Summary Result Panel -->
  <rect x="30" y="445" width="900" height="75" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="50" y="468" font-size="13" font-weight="bold" fill="#1a1a1a">Зафіксований стан завантаження:</text>
  
  <rect x="285" y="452" width="200" height="24" fill="#e9f7ef" stroke="#27ae60" rx="4"/>
  <text x="385" y="468" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">SPI Flash Boot (0, 1, 1)</text>

  <text x="50" y="491" font-size="12" fill="#1a1a1a">• Для стабільного запуску з SPI Flash рівень GPIO15 має бути &lt; V_IL (GND), а GPIO0 і GPIO2 — &gt; V_IH (VCC).</text>
  <text x="50" y="508" font-size="12" fill="#6b7280">• Будь-які імпульсні завади чи плаваючі потенціали під час t_latch призводять до вибору неправильного режиму старту.</text>
</svg>
