<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Підтяжка strapping-виводів ESP8266 та усунення витоків струму</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Захист від витоку через внутрішні ESD-діоди та усунення плаваючих потенціалів при стартовому скиданні</text>

  <!-- LEFT PANEL: Problem / Incorrect -->
  <rect x="25" y="72" width="445" height="445" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="247" y="97" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">Неправильно: Витік струму через ESD-діод та Boot Loop</text>

  <!-- MCU Box Left -->
  <rect x="45" y="115" width="150" height="255" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="120" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">ESP8266</text>

  <!-- Power rail internal -->
  <line x1="55" y1="160" x2="185" y2="160" stroke="#6b7280" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="60" y="153" font-size="11" font-weight="bold" fill="#6b7280">Шина VDD_IO (3.3V)</text>

  <!-- Pin GPIO0 Left -->
  <line x1="155" y1="210" x2="205" y2="210" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="205" cy="210" r="3" fill="#c0392b"/>
  <text x="105" y="214" font-size="12" font-weight="bold" fill="#1a1a1a">GPIO0</text>

  <!-- Pin GND Left -->
  <line x1="55" y1="340" x2="185" y2="340" stroke="#6b7280" stroke-width="1.5"/>
  <text x="60" y="333" font-size="11" fill="#6b7280">GND</text>

  <!-- Internal ESD Diode representation Left -->
  <line x1="155" y1="210" x2="155" y2="160" stroke="#c0392b" stroke-width="1.5"/>
  <polygon points="148,190 162,190 155,175" fill="#c0392b"/>
  <line x1="148" y1="175" x2="162" y2="175" stroke="#c0392b" stroke-width="2"/>
  <text x="165" y="188" font-size="11" font-weight="bold" fill="#c0392b">ESD-діод</text>

  <!-- External Peripheral Box Left -->
  <rect x="325" y="170" width="125" height="80" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="387" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Периферія</text>
  <text x="387" y="220" text-anchor="middle" font-size="11" fill="#6b7280">(живлення 5V / 3.3V)</text>

  <!-- Direct Wire from Peripheral to GPIO0 -->
  <line x1="325" y1="210" x2="205" y2="210" stroke="#c0392b" stroke-width="2"/>

  <!-- Parasitic Leakage Current Path (Red Arrow) -->
  <path d="M 320,205 L 210,205 L 155,205 L 155,165" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <text x="265" y="195" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Струм витоку I_leak</text>

  <!-- Floating Pin warning -->
  <rect x="215" y="240" width="100" height="36" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="265" y="255" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Плаваючий</text>
  <text x="265" y="269" text-anchor="middle" font-size="11" fill="#c0392b">рівень ~1.5V</text>

  <!-- Left Bottom Note Panel -->
  <rect x="40" y="385" width="415" height="115" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="55" y="407" font-size="12" font-weight="bold" fill="#c0392b">Проблеми невірного підключення:</text>
  <text x="55" y="427" font-size="12" fill="#1a1a1a">1. Струм I_leak через ESD-діод паразитно живить чип ESP8266.</text>
  <text x="55" y="447" font-size="12" fill="#1a1a1a">2. Відсутність підтяжки створює неопределений рівень на GPIO0.</text>
  <text x="55" y="467" font-size="12" fill="#1a1a1a">3. При скиданні ROM Bootloader бачить помилковий режим завантаження.</text>
  <text x="55" y="487" font-size="12" fill="#1a1a1a">4. Виникає хаотичне циклічне перезавантаження (Boot Loop).</text>

  <!-- RIGHT PANEL: Solution / Correct -->
  <rect x="490" y="72" width="445" height="445" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="712" y="97" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Правильно: Розв'язка діодом D1 та фіксована підтяжка 10 кОм</text>

  <!-- MCU Box Right -->
  <rect x="505" y="115" width="145" height="255" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="577" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">ESP8266</text>

  <!-- Pins on Right MCU -->
  <!-- GPIO0 -->
  <line x1="610" y1="180" x2="670" y2="180" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="670" cy="180" r="3" fill="#27ae60"/>
  <text x="560" y="184" font-size="12" font-weight="bold" fill="#1a1a1a">GPIO0</text>

  <!-- GPIO2 -->
  <line x1="610" y1="240" x2="670" y2="240" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="670" cy="240" r="3" fill="#27ae60"/>
  <text x="560" y="244" font-size="12" font-weight="bold" fill="#1a1a1a">GPIO2</text>

  <!-- GPIO15 -->
  <line x1="610" y1="300" x2="670" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="670" cy="300" r="3" fill="#27ae60"/>
  <text x="560" y="304" font-size="12" font-weight="bold" fill="#1a1a1a">GPIO15</text>

  <!-- Resistor R_pull1 (GPIO0 -> +3.3V) -->
  <line x1="670" y1="180" x2="670" y2="135" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="662" y="145" width="16" height="20" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <!-- VDD rail top -->
  <line x1="658" y1="135" x2="682" y2="135" stroke="#27ae60" stroke-width="2"/>
  <text x="688" y="139" font-size="11" font-weight="bold" fill="#27ae60">+3.3V (R_up 10k)</text>

  <!-- Resistor R_pull2 (GPIO2 -> 3.3V) -->
  <line x1="670" y1="240" x2="705" y2="240" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="705" y="232" width="20" height="16" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="725" y1="240" x2="740" y2="240" stroke="#27ae60" stroke-width="1.5"/>
  <text x="695" y="224" font-size="11" font-weight="bold" fill="#27ae60">10k -> 3.3V (HIGH)</text>

  <!-- Resistor R_pull3 (GPIO15 -> GND) -->
  <line x1="670" y1="300" x2="705" y2="300" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="705" y="292" width="20" height="16" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="725" y1="300" x2="740" y2="300" stroke="#27ae60" stroke-width="1.5"/>
  <!-- GND symbol -->
  <line x1="740" y1="292" x2="740" y2="308" stroke="#27ae60" stroke-width="2"/>
  <text x="695" y="324" font-size="11" font-weight="bold" fill="#27ae60">10k -> GND (LOW)</text>

  <!-- Decoupling Diode D1 on GPIO0 external line -->
  <line x1="670" y1="180" x2="730" y2="180" stroke="#27ae60" stroke-width="2"/>

  <!-- Diode Symbol D1 -->
  <polygon points="745,172 745,188 730,180" fill="#27ae60"/>
  <line x1="730" y1="172" x2="730" y2="188" stroke="#27ae60" stroke-width="2"/>
  <text x="738" y="162" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">D1 Schottky</text>

  <line x1="745" y1="180" x2="820" y2="180" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- External Peripheral Box Right -->
  <rect x="820" y="150" width="105" height="60" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="872" y="177" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Периферія</text>
  <text x="872" y="195" text-anchor="middle" font-size="11" fill="#6b7280">сигнал RX/TX</text>

  <!-- Blocked Leakage Callout Box (isolated from wires) -->
  <rect x="735" y="196" width="130" height="24" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <circle cx="747" cy="208" r="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <line x1="743" y1="204" x2="751" y2="212" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="751" y1="204" x2="743" y2="212" stroke="#c0392b" stroke-width="1.5"/>
  <text x="803" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">I_leak заблоковано</text>

  <!-- Right Bottom Note Panel -->
  <rect x="505" y="385" width="415" height="115" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="520" y="407" font-size="12" font-weight="bold" fill="#27ae60">Правила надійного проектування:</text>
  <text x="520" y="427" font-size="12" fill="#1a1a1a">1. Діод Шотткі D1 блокує паразитний струм з периферії у VDD.</text>
  <text x="520" y="447" font-size="12" fill="#1a1a1a">2. Резистори 10 кОм гарантують рівні під час скидання (RST=0).</text>
  <text x="520" y="467" font-size="12" fill="#1a1a1a">3. Фіксація: GPIO0=HIGH, GPIO2=HIGH, GPIO15=LOW.</text>
  <text x="520" y="487" font-size="12" fill="#1a1a1a">4. Беззбійний запуск штатного режиму SPI Flash Boot.</text>
</svg>
