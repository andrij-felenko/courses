<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Структура стартового логу ROM-завантажувача ESP8266 (74880 baud)</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Декодування rst cause, boot device та розкладання бітів boot mode:(b2, b1, b0) за strapping-виводами</text>

  <!-- Panel 1: Log Output -->
  <rect x="30" y="70" width="900" height="115" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="45" y="80" width="210" height="24" rx="4" fill="#2457d6"/>
  <text x="150" y="96" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">UART0 Boot Log (74880 bps)</text>

  <!-- Line 1 -->
  <text x="50" y="125" font-size="13" font-weight="bold" fill="#1a1a1a">ets Jan  8 2013,</text>
  <rect x="170" y="109" width="105" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="222.5" y="125" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">rst cause:1</text>
  <text x="280" y="125" font-size="13" font-weight="bold" fill="#1a1a1a">,</text>
  <rect x="295" y="109" width="145" height="22" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="367.5" y="125" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">boot mode:(3,6)</text>

  <!-- Line 2 -->
  <text x="50" y="148" font-size="13" fill="#6b7280">load 0x40100000, len 25984, room 16 | tail 0 | chksum 0xef</text>

  <!-- Line 3 -->
  <text x="50" y="170" font-size="13" fill="#6b7280">csum 0xef | csum err |</text>
  <rect x="205" y="154" width="125" height="22" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="267.5" y="170" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">boot device:1</text>

  <!-- Straight Vertical Connecting Arrows (Outside text area) -->
  <line x1="165" y1="185" x2="165" y2="222" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="490" y1="185" x2="490" y2="222" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="805" y1="185" x2="805" y2="222" stroke="#6b7280" stroke-width="2" marker-end="url(#arr-gray)"/>

  <!-- Column 1: rst cause -->
  <rect x="30" y="230" width="270" height="308" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="40" y="240" width="250" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="165" y="259" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">rst cause: Код причини скидання</text>

  <rect x="42" y="278" width="246" height="32" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="52" y="298" font-size="12" fill="#1a1a1a">0 — Невідомо / первинний старт</text>

  <rect x="42" y="318" width="246" height="46" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="52" y="337" font-size="12" font-weight="bold" fill="#2457d6">1 — Power-on Reset (POR) [У логу]</text>
  <text x="52" y="354" font-size="12" fill="#6b7280">Подача живлення VDD 3.3V</text>

  <rect x="42" y="372" width="246" height="46" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="52" y="391" font-size="12" font-weight="bold" fill="#1a1a1a">2 — External Reset (EXT_RST)</text>
  <text x="52" y="408" font-size="12" fill="#6b7280">Низький рівень імпульсу на RST</text>

  <rect x="42" y="426" width="246" height="46" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="52" y="445" font-size="12" font-weight="bold" fill="#1a1a1a">4 — Hardware WDT Reset</text>
  <text x="52" y="462" font-size="12" fill="#6b7280">Спрацював апаратний вачдог</text>

  <rect x="42" y="480" width="246" height="46" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="52" y="499" font-size="12" font-weight="bold" fill="#1a1a1a">6 — Software Reset</text>
  <text x="52" y="516" font-size="12" fill="#6b7280">Програмне перезавантаження</text>

  <!-- Column 2: boot mode -->
  <rect x="320" y="230" width="340" height="308" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="330" y="240" width="320" height="28" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="490" y="259" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">boot mode:(3,x) — Двійкове розкладання</text>

  <rect x="330" y="276" width="320" height="104" rx="4" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Bit 2 -->
  <rect x="340" y="284" width="94" height="88" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="387" y="301" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">b2: GPIO15</text>
  <text x="387" y="326" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">0</text>
  <text x="387" y="345" font-size="12" fill="#6b7280" text-anchor="middle">Pull-down</text>
  <text x="387" y="363" font-size="12" fill="#27ae60" text-anchor="middle">Обов'язково 0</text>

  <!-- Bit 1 -->
  <rect x="443" y="284" width="94" height="88" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="490" y="301" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">b1: GPIO0</text>
  <text x="490" y="326" font-size="16" font-weight="bold" fill="#27ae60" text-anchor="middle">1</text>
  <text x="490" y="345" font-size="12" fill="#6b7280" text-anchor="middle">Pull-up</text>
  <text x="490" y="363" font-size="12" fill="#2457d6" text-anchor="middle">1=Flash, 0=UART</text>

  <!-- Bit 0 -->
  <rect x="546" y="284" width="94" height="88" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="593" y="301" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">b0: GPIO2</text>
  <text x="593" y="326" font-size="16" font-weight="bold" fill="#27ae60" text-anchor="middle">1</text>
  <text x="593" y="345" font-size="12" fill="#6b7280" text-anchor="middle">Pull-up</text>
  <text x="593" y="363" font-size="12" fill="#27ae60" text-anchor="middle">Обов'язково 1</text>

  <!-- Modes Table -->
  <rect x="330" y="388" width="320" height="44" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="340" y="406" font-size="12" font-weight="bold" fill="#27ae60">(3,x) [011] — Flash Boot (Штатний режим)</text>
  <text x="340" y="423" font-size="12" fill="#1a1a1a">Виконання користувацької прошивки</text>

  <rect x="330" y="437" width="320" height="44" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="340" y="455" font-size="12" font-weight="bold" fill="#2457d6">(1,x) [001] — UART Download (Прошивка)</text>
  <text x="340" y="472" font-size="12" fill="#1a1a1a">Завантаження коду в RAM через esptool</text>

  <rect x="330" y="486" width="320" height="44" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="340" y="504" font-size="12" font-weight="bold" fill="#c0392b">(0,x) / (7,x) — Помилка підтяжки / SDIO</text>
  <text x="340" y="521" font-size="12" fill="#6b7280">Невірна комбінація рівнів strapping-виводів</text>

  <!-- Column 3: boot device -->
  <rect x="680" y="230" width="250" height="308" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="690" y="240" width="230" height="28" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
  <text x="805" y="259" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">boot device: Джерело коду</text>

  <rect x="690" y="276" width="230" height="46" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="700" y="295" font-size="12" font-weight="bold" fill="#27ae60">1 — SPI Flash Memory</text>
  <text x="700" y="312" font-size="12" fill="#6b7280">Шина SPI Flash (CS0 / GPIO6-11)</text>

  <rect x="690" y="328" width="230" height="46" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="700" y="347" font-size="12" font-weight="bold" fill="#1a1a1a">3 — SDIO Slave Interface</text>
  <text x="700" y="364" font-size="12" fill="#6b7280">Завантаження з зовнішнього хоста</text>

  <rect x="690" y="382" width="230" height="148" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="805" y="401" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Діагностичне правило:</text>
  <line x1="705" y1="408" x2="905" y2="408" stroke="#2457d6" stroke-width="0.75" stroke-dasharray="2,2"/>
  <text x="702" y="427" font-size="12" fill="#1a1a1a">• Якщо <tspan font-weight="bold" fill="#c0392b">boot mode:(0,x)</tspan>:</text>
  <text x="714" y="443" font-size="12" fill="#6b7280">GPIO15 має підтяжку до 3.3V</text>
  <text x="702" y="463" font-size="12" fill="#1a1a1a">• Якщо <tspan font-weight="bold" fill="#2457d6">boot mode:(1,x)</tspan>:</text>
  <text x="714" y="479" font-size="12" fill="#6b7280">GPIO0 затягнуто до GND</text>
  <text x="702" y="499" font-size="12" fill="#1a1a1a">• Якщо <tspan font-weight="bold" fill="#27ae60">boot mode:(3,x)</tspan>:</text>
  <text x="714" y="515" font-size="12" fill="#27ae60">Штатний запуск з Flash</text>
</svg>
