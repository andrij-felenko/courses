<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">FSM-автомат асинхронного парсера +IPD у UART-потоку ESP-01</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Попотокова розбірка префікса +IPD, ідентифікатора сокета, довжини та вилучення корисного навантаження</text>

  <!-- FSM STATE NODES -->

  <!-- Node 1: IDLE -->
  <rect x="40" y="110" width="140" height="90" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <path d="M 40,118 A 8,8 0 0,1 48,110 L 172,110 A 8,8 0 0,1 180,118 L 180,136 L 40,136 Z" fill="#d0d7de"/>
  <text x="110" y="128" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">IDLE</text>
  <text x="110" y="156" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Пошук префікса</text>
  <text x="110" y="178" font-size="11" fill="#6b7280" text-anchor="middle">Очікування "+IPD"</text>

  <!-- Node 2: PARSE_ID -->
  <rect x="235" y="110" width="140" height="90" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <path d="M 235,118 A 8,8 0 0,1 243,110 L 367,110 A 8,8 0 0,1 375,118 L 375,136 L 235,136 Z" fill="#2457d6"/>
  <text x="305" y="128" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">PARSE_ID</text>
  <text x="305" y="156" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Читання ID</text>
  <text x="305" y="178" font-size="11" fill="#2457d6" text-anchor="middle">Сокет 0..4</text>

  <!-- Node 3: PARSE_LEN -->
  <rect x="430" y="110" width="140" height="90" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <path d="M 430,118 A 8,8 0 0,1 438,110 L 562,110 A 8,8 0 0,1 570,118 L 570,136 L 430,136 Z" fill="#2457d6"/>
  <text x="500" y="128" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">PARSE_LEN</text>
  <text x="500" y="156" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Читання LEN</text>
  <text x="500" y="178" font-size="11" fill="#2457d6" text-anchor="middle">Довжина до ':'</text>

  <!-- Node 4: READ_PAYLOAD -->
  <rect x="625" y="110" width="145" height="90" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <path d="M 625,118 A 8,8 0 0,1 633,110 L 762,110 A 8,8 0 0,1 770,118 L 770,136 L 625,136 Z" fill="#2457d6"/>
  <text x="697" y="128" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">READ_PAYLOAD</text>
  <text x="697" y="156" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Прийом даних</text>
  <text x="697" y="178" font-size="11" fill="#2457d6" text-anchor="middle">Зчитування LEN байт</text>

  <!-- Node 5: DISPATCH -->
  <rect x="815" y="110" width="110" height="90" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <path d="M 815,118 A 8,8 0 0,1 823,110 L 917,110 A 8,8 0 0,1 925,110 L 925,136 L 815,136 Z" fill="#27ae60"/>
  <text x="870" y="128" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">DISPATCH</text>
  <text x="870" y="156" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Пакет готовий</text>
  <text x="870" y="178" font-size="11" fill="#1a1a1a" text-anchor="middle">Передача сокету</text>

  <!-- FORWARD TRANSITION ARROWS -->

  <!-- IDLE -> PARSE_ID -->
  <line x1="180" y1="155" x2="235" y2="155" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="207" y="145" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">"+IPD,"</text>

  <!-- PARSE_ID -> PARSE_LEN -->
  <line x1="375" y1="155" x2="430" y2="155" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="402" y="145" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">','</text>

  <!-- PARSE_LEN -> READ_PAYLOAD -->
  <line x1="570" y1="155" x2="625" y2="155" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="597" y="145" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">':'</text>

  <!-- READ_PAYLOAD -> DISPATCH -->
  <line x1="770" y1="155" x2="815" y2="155" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="792" y="145" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">N == LEN</text>

  <!-- Self-Loop READ_PAYLOAD -->
  <path d="M 665,110 C 665,75 730,75 730,105" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="697" y="69" font-size="11" fill="#2457d6" text-anchor="middle">Байт &lt; LEN</text>

  <!-- RETURN LOOPBACK (DISPATCH -> IDLE) -->
  <path d="M 870,200 L 870,225 L 110,225 L 110,205" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arr-green)"/>
  <text x="690" y="218" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Очищення буфера та повернення в IDLE</text>

  <!-- ERROR / RESET STATE NODE -->
  <rect x="360" y="260" width="240" height="55" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="480" y="281" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">ПОМИЛКА / ТАЙМАУТ</text>
  <text x="480" y="301" font-size="11" fill="#6b7280" text-anchor="middle">Скидання стану та кадру пакета</text>

  <!-- Error Arrows -->
  <!-- From PARSE_ID to ERROR -->
  <path d="M 305,200 L 305,287 L 360,287" fill="none" stroke="#c0392b" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
  <text x="295" y="245" font-size="11" fill="#c0392b" text-anchor="end">Невідомий символ</text>

  <!-- From PARSE_LEN to ERROR -->
  <path d="M 500,200 L 500,260" fill="none" stroke="#c0392b" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
  <text x="512" y="245" font-size="11" fill="#c0392b" text-anchor="start">Помилка формату / Overflow</text>

  <!-- From ERROR to IDLE -->
  <path d="M 360,295 L 110,295 L 110,205" fill="none" stroke="#c0392b" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
  <text x="235" y="287" font-size="11" fill="#c0392b" text-anchor="middle">Скидання в IDLE</text>

  <!-- STREAM BREAKDOWN PANEL -->
  <rect x="40" y="340" width="885" height="165" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="60" y="364" font-size="13" font-weight="bold" fill="#1a1a1a">Структура вхідного потоку UART та відповідність станам FSM:</text>

  <!-- Stream Blocks -->
  <!-- Block 1: Prefix -->
  <rect x="60" y="380" width="110" height="38" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="115" y="404" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">+ I P D ,</text>
  <text x="115" y="435" font-size="11" fill="#6b7280" text-anchor="middle">Префікс (IDLE)</text>

  <!-- Block 2: ID -->
  <rect x="185" y="380" width="55" height="38" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="212" y="404" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">0</text>
  <text x="212" y="435" font-size="11" fill="#2457d6" text-anchor="middle">ID сокета</text>

  <!-- Block 3: Separator 1 -->
  <rect x="250" y="380" width="35" height="38" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="267" y="404" font-size="14" font-weight="bold" fill="#6b7280" text-anchor="middle">,</text>
  <text x="267" y="435" font-size="11" fill="#6b7280" text-anchor="middle">Кома</text>

  <!-- Block 4: Length -->
  <rect x="295" y="380" width="65" height="38" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="327" y="404" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">1 2</text>
  <text x="327" y="435" font-size="11" fill="#2457d6" text-anchor="middle">Довжина LEN</text>

  <!-- Block 5: Separator 2 -->
  <rect x="370" y="380" width="35" height="38" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="387" y="404" font-size="14" font-weight="bold" fill="#6b7280" text-anchor="middle">:</text>
  <text x="387" y="435" font-size="11" fill="#6b7280" text-anchor="middle">Двокрапка</text>

  <!-- Block 6: Payload Data -->
  <rect x="415" y="380" width="490" height="38" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="660" y="404" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">D a t a [ 0 ]   D a t a [ 1 ]   . . .   D a t a [ 1 1 ]</text>
  <text x="660" y="435" font-size="11" fill="#27ae60" text-anchor="middle">Тіло пакета (READ_PAYLOAD: зчитування прямо у кольбек-буфер)</text>

  <!-- Note -->
  <text x="60" y="485" font-size="11" fill="#6b7280">Примітка: в одиночному режимі (AT+CIPMUX=0) поле ID сокета та наступна кома відсутні (+IPD,12:...).</text>
</svg>
