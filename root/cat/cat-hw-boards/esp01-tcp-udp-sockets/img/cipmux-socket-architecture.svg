<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Main Title -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розподіл пам'яті SRAM та буферів LwIP у режимах CIPMUX</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Одиночний режим надає максимальний буфер і прозорий міст, мультиплексний — ділить Heap між 5 сокетами</text>

  <!-- Marker Defs for Arrows -->
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- ================= LEFT PANEL: CIPMUX = 0 ================= -->
  <rect x="40" y="75" width="420" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="55" y="90" width="390" height="32" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="250" y="111" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">CIPMUX = 0 (Одиночне підключення)</text>

  <!-- Description note -->
  <text x="55" y="140" font-size="12" fill="#6b7280">Лише 1 сокет (Link 0) · Підтримка прозорого моста CIPMODE=1</text>

  <!-- Memory Bar for CIPMUX=0 -->
  <!-- Outer SRAM Frame -->
  <rect x="55" y="155" width="160" height="260" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="135" y="172" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вільна Heap SRAM</text>
  <text x="135" y="186" font-size="11" fill="#6b7280" text-anchor="middle">~48 кБ загалом</text>

  <!-- Sub-block: Free Heap -->
  <rect x="63" y="195" width="144" height="110" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="135" y="242" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Вільна Heap</text>
  <text x="135" y="260" font-size="12" fill="#27ae60" text-anchor="middle">~36 кБ</text>

  <!-- Sub-block: Link 0 Buffers -->
  <rect x="63" y="310" width="144" height="60" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="135" y="332" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Сокет Link 0 + LwIP</text>
  <text x="135" y="348" font-size="11" fill="#2457d6" text-anchor="middle">Буфери TCP/UDP (~10 кБ)</text>

  <!-- Sub-block: System Reserved -->
  <rect x="63" y="375" width="144" height="32" rx="3" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>
  <text x="135" y="395" font-size="11" fill="#4b5563" text-anchor="middle">Системний стек ESP</text>

  <!-- Detail boxes for CIPMUX=0 on the right side of panel -->
  <rect x="230" y="160" width="215" height="75" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="240" y="180" font-size="12" font-weight="bold" fill="#1a1a1a">Буфер сокета Link 0:</text>
  <text x="240" y="198" font-size="12" fill="#4b5563">• TCP_WND: 5840 байт (Rx)</text>
  <text x="240" y="216" font-size="12" fill="#4b5563">• TCP_SND_BUF: 2920 байт (Tx)</text>

  <rect x="230" y="245" width="215" height="75" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="240" y="265" font-size="12" font-weight="bold" fill="#27ae60">Режим CIPMODE = 1:</text>
  <text x="240" y="283" font-size="12" fill="#15803d">• Прямий UART-to-TCP міст</text>
  <text x="240" y="301" font-size="12" fill="#15803d">• Без оверхеду +IPD кадрів</text>

  <rect x="230" y="330" width="215" height="75" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="240" y="350" font-size="12" font-weight="bold" fill="#1a1a1a">Характеристики:</text>
  <text x="240" y="368" font-size="12" fill="#27ae60">✓ Максимальна смуга (20 кБ/с)</text>
  <text x="240" y="386" font-size="12" fill="#27ae60">✓ Стабільна робота прошивки</text>

  <!-- ================= RIGHT PANEL: CIPMUX = 1 ================= -->
  <rect x="500" y="75" width="420" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="515" y="90" width="390" height="32" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="710" y="111" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">CIPMUX = 1 (Мультиплексований режим)</text>

  <!-- Description note -->
  <text x="515" y="140" font-size="12" fill="#6b7280">До 5 паралельних сокетів (Link 0–4) · CIPMODE=1 заборонено</text>

  <!-- Memory Bar for CIPMUX=1 -->
  <!-- Outer SRAM Frame -->
  <rect x="515" y="155" width="160" height="260" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="595" y="172" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вільна Heap SRAM</text>
  <text x="595" y="186" font-size="11" fill="#6b7280" text-anchor="middle">~48 кБ загалом</text>

  <!-- Sub-block: Reduced Free Heap -->
  <rect x="523" y="195" width="144" height="45" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="595" y="215" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Зменшена Heap</text>
  <text x="595" y="231" font-size="11" fill="#c0392b" text-anchor="middle">~14 кБ вільних</text>

  <!-- Sub-block: 5 Sockets LwIP Buffers -->
  <rect x="523" y="245" width="144" height="125" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="595" y="260" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">5 сокетів LwIP PCBs:</text>
  
  <rect x="529" y="267" width="132" height="18" rx="2" fill="#ffffff" stroke="#2457d6" stroke-width="0.75"/>
  <text x="595" y="280" font-size="10" fill="#1a1a1a" text-anchor="middle">Link 0 Buffer (~6 кБ)</text>

  <rect x="529" y="288" width="132" height="18" rx="2" fill="#ffffff" stroke="#2457d6" stroke-width="0.75"/>
  <text x="595" y="301" font-size="10" fill="#1a1a1a" text-anchor="middle">Link 1 Buffer (~6 кБ)</text>

  <rect x="529" y="309" width="132" height="18" rx="2" fill="#ffffff" stroke="#2457d6" stroke-width="0.75"/>
  <text x="595" y="322" font-size="10" fill="#1a1a1a" text-anchor="middle">Link 2 Buffer (~6 кБ)</text>

  <rect x="529" y="330" width="132" height="35" rx="2" fill="#f4f6f8" stroke="#9ca3af" stroke-width="0.75" stroke-dasharray="3 2"/>
  <text x="595" y="351" font-size="10" fill="#6b7280" text-anchor="middle">Link 3, 4 (резерв/пул)</text>

  <!-- Sub-block: System Reserved -->
  <rect x="523" y="375" width="144" height="32" rx="3" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>
  <text x="595" y="395" font-size="11" fill="#4b5563" text-anchor="middle">Системний стек ESP</text>

  <!-- Detail boxes for CIPMUX=1 on the right side of panel -->
  <rect x="690" y="160" width="215" height="75" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="180" font-size="12" font-weight="bold" fill="#1a1a1a">Розподіл на 5 сокетів:</text>
  <text x="700" y="198" font-size="12" fill="#4b5563">• Зменшений TCP_WND (2800)</text>
  <text x="700" y="216" font-size="12" fill="#4b5563">• Окремий PCB для кожного link</text>

  <rect x="690" y="245" width="215" height="75" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="700" y="265" font-size="12" font-weight="bold" fill="#c0392b">Формат кадрів +IPD:</text>
  <text x="700" y="283" font-size="12" fill="#991b1b">• +IPD,link_id,len:data</text>
  <text x="700" y="301" font-size="12" fill="#991b1b">• Парсинг створює накладний час</text>

  <rect x="690" y="330" width="215" height="75" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="350" font-size="12" font-weight="bold" fill="#1a1a1a">Ризики й обмеження:</text>
  <text x="700" y="368" font-size="12" fill="#c0392b">⚠ Ризик вичерпання Heap</text>
  <text x="700" y="386" font-size="12" fill="#c0392b">⚠ Переповнення UART бувера</text>

</svg>
