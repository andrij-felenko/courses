<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Послідовність AT-команд TCP-сесії між хостом та ESP-01</text>
  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Синхронне квитування команд OK/ERROR, асинхронний потік +IPD та виділення ресурсів FSM</text>

  <!-- Шапки колонок (Lifeline Headers) -->
  <rect x="90" y="68" width="180" height="34" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="180" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Хост-мікроконтролер</text>

  <rect x="390" y="68" width="180" height="34" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#2457d6">Модуль ESP-01</text>

  <rect x="690" y="68" width="180" height="34" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="780" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">TCP-сервер / Мережа</text>

  <!-- Лінії життєвого циклу (Lifelines) -->
  <line x1="180" y1="102" x2="180" y2="445" stroke="#d0d7de" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="480" y1="102" x2="480" y2="445" stroke="#d0d7de" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="780" y1="102" x2="780" y2="445" stroke="#d0d7de" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- 1. Ініціалізація з'єднання -->
  <text x="330" y="119" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">AT+CIPSTART="TCP","192.168.1.50",80</text>
  <line x1="180" y1="126" x2="471" y2="126" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <text x="630" y="141" text-anchor="middle" font-size="12" fill="#6b7280">TCP SYN / Handshake</text>
  <line x1="480" y1="148" x2="771" y2="148" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>

  <text x="630" y="163" text-anchor="middle" font-size="12" fill="#6b7280">TCP SYN-ACK</text>
  <line x1="780" y1="170" x2="489" y2="170" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>

  <text x="330" y="185" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">CONNECT  OK</text>
  <line x1="480" y1="192" x2="189" y2="192" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- 2. Передача даних -->
  <text x="330" y="213" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">AT+CIPSEND=12</text>
  <line x1="180" y1="220" x2="471" y2="220" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <text x="330" y="235" text-anchor="middle" font-size="12" fill="#2457d6">Запит даних: &gt;</text>
  <line x1="480" y1="242" x2="189" y2="242" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <text x="330" y="257" text-anchor="middle" font-size="12" fill="#1a1a1a">Буфер даних: "Hello World!"</text>
  <line x1="180" y1="264" x2="471" y2="264" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <text x="630" y="279" text-anchor="middle" font-size="12" fill="#6b7280">Пакет TCP (12 B)</text>
  <line x1="480" y1="286" x2="771" y2="286" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>

  <text x="330" y="301" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">Recv ACK  SEND OK</text>
  <line x1="480" y1="308" x2="189" y2="308" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- 3. Прийом +IPD -->
  <text x="630" y="327" text-anchor="middle" font-size="12" fill="#6b7280">Вхідні дані мережі (14 B)</text>
  <line x1="780" y1="334" x2="489" y2="334" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>

  <text x="330" y="349" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Потік: +IPD,14:Data from Server</text>
  <line x1="480" y1="356" x2="189" y2="356" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- 4. Закриття з'єднання -->
  <text x="330" y="377" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">AT+CIPCLOSE</text>
  <line x1="180" y1="384" x2="471" y2="384" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <text x="630" y="399" text-anchor="middle" font-size="12" fill="#6b7280">TCP FIN</text>
  <line x1="480" y1="406" x2="771" y2="406" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>

  <text x="330" y="421" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">CLOSED  OK</text>
  <line x1="480" y1="428" x2="189" y2="428" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Нижні аналітичні блоки -->
  <rect x="50" y="462" width="410" height="78" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="65" y="481" font-size="12" font-weight="700" fill="#c0392b">Таймаут та обробка помилок FSM:</text>
  <text x="65" y="499" font-size="12" fill="#1a1a1a">· Очікування підтвердження OK / SEND OK за таймаутом (5–10 с).</text>
  <text x="65" y="517" font-size="12" fill="#1a1a1a">· При виникненні ERROR FSM скидає сокет або повторює AT-команду.</text>

  <rect x="500" y="462" width="410" height="78" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="515" y="481" font-size="12" font-weight="700" fill="#2457d6">Буферизація LwIP та парсинг +IPD:</text>
  <text x="515" y="499" font-size="12" fill="#1a1a1a">· Дані мережі зберігаються в DRAM LwIP до передачі через UART.</text>
  <text x="515" y="517" font-size="12" fill="#1a1a1a">· FSM хоста читає байтовий лічильник з префікса +IPD,&lt;len&gt;:...</text>
</svg>
