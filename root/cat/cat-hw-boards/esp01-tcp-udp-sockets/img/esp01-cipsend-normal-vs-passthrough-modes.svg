<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr_blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr_green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr_red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr_gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Режими передачі AT+CIPSEND в ESP-01: звичайний та passthrough</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Звичайний режим фіксує довжину та очікує SEND OK, а passthrough забезпечує потік даних з виходом через +++</text>

  <!-- Panel 1: Normal Mode -->
  <rect x="30" y="75" width="435" height="460" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="45" y="87" width="405" height="32" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="247" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Звичайний режим (CIPMODE=0)</text>

  <!-- Panel 1 Lifelines & Actors -->
  <rect x="50" y="130" width="60" height="26" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="80" y="147" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Host MCU</text>

  <rect x="217" y="130" width="60" height="26" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="247" y="147" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">ESP-01</text>

  <rect x="385" y="130" width="60" height="26" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="415" y="147" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Сервер</text>

  <line x1="80" y1="156" x2="80" y2="380" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="247" y1="156" x2="247" y2="380" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="415" y1="156" x2="415" y2="380" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Panel 1 Sequence -->
  <line x1="80" y1="180" x2="247" y2="180" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="163" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">AT+CIPSEND=L</text>

  <line x1="247" y1="215" x2="80" y2="215" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr_blue)"/>
  <text x="163" y="209" text-anchor="middle" font-size="12" fill="#2457d6">Запит даних: &gt;</text>

  <line x1="80" y1="250" x2="247" y2="250" stroke="#2457d6" stroke-width="2" marker-end="url(#arr_blue)"/>
  <text x="163" y="244" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Дані (L байт)</text>

  <line x1="247" y1="285" x2="415" y2="285" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="331" y="279" text-anchor="middle" font-size="12" fill="#1a1a1a">TCP/UDP пакет</text>

  <line x1="415" y1="320" x2="247" y2="320" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr_gray)"/>
  <text x="331" y="314" text-anchor="middle" font-size="12" fill="#6b7280">TCP ACK</text>

  <line x1="247" y1="355" x2="80" y2="355" stroke="#27ae60" stroke-width="2" marker-end="url(#arr_green)"/>
  <text x="163" y="349" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">SEND OK</text>

  <!-- Panel 1 Note Box -->
  <rect x="45" y="395" width="405" height="120" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="60" y="415" font-size="12" font-weight="bold" fill="#27ae60">Особливості звичайного режиму:</text>
  <text x="60" y="437" font-size="11" fill="#1a1a1a">• Обов'язкова довжина L перед кожною відправкою</text>
  <text x="60" y="457" font-size="11" fill="#1a1a1a">• Відповідь SEND OK після обробки L байт</text>
  <text x="60" y="477" font-size="11" fill="#1a1a1a">• Новий пакет вимагає повторного AT+CIPSEND</text>
  <text x="60" y="497" font-size="11" fill="#1a1a1a">• Контроль буферів LwIP PCB у пам'яті DRAM</text>

  <!-- Panel 2: Passthrough Mode -->
  <rect x="495" y="75" width="435" height="460" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="510" y="87" width="405" height="32" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="712" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Наскрізний режим Passthrough (CIPMODE=1)</text>

  <!-- Panel 2 Lifelines & Actors -->
  <rect x="515" y="130" width="60" height="26" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="545" y="147" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Host MCU</text>

  <rect x="682" y="130" width="60" height="26" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="712" y="147" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">ESP-01</text>

  <rect x="850" y="130" width="60" height="26" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="880" y="147" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Сервер</text>

  <line x1="545" y1="156" x2="545" y2="380" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="712" y1="156" x2="712" y2="380" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="880" y1="156" x2="880" y2="380" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Panel 2 Sequence -->
  <line x1="545" y1="175" x2="712" y2="175" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="628" y="169" text-anchor="middle" font-size="12" fill="#1a1a1a">AT+CIPMODE=1</text>

  <line x1="712" y1="195" x2="545" y2="195" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr_green)"/>
  <text x="628" y="189" text-anchor="middle" font-size="12" fill="#27ae60">OK</text>

  <line x1="545" y1="220" x2="712" y2="220" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="628" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">AT+CIPSEND</text>

  <line x1="712" y1="240" x2="545" y2="240" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr_blue)"/>
  <text x="628" y="234" text-anchor="middle" font-size="12" fill="#2457d6">Вхід у passthrough: &gt;</text>

  <!-- Stream Box -->
  <rect x="525" y="252" width="370" height="48" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="628" y="268" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Безперервний потік даних (raw stream)</text>
  <line x1="545" y1="282" x2="712" y2="282" stroke="#2457d6" stroke-width="2" marker-end="url(#arr_blue)"/>
  <line x1="712" y1="282" x2="880" y2="282" stroke="#2457d6" stroke-width="2" marker-end="url(#arr_blue)"/>
  <text x="796" y="295" text-anchor="middle" font-size="10" fill="#2457d6">Трансляція без SEND OK</text>

  <!-- Exit Sequence -->
  <text x="628" y="320" text-anchor="middle" font-size="11" fill="#c0392b">Пауза тиші ≥ 1000 мс</text>
  <line x1="545" y1="338" x2="712" y2="338" stroke="#c0392b" stroke-width="2" marker-end="url(#arr_red)"/>
  <text x="628" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">+++ (без \r\n!)</text>
  <text x="628" y="355" text-anchor="middle" font-size="11" fill="#c0392b">Пауза тиші ≥ 1000 мс → вихід в AT</text>

  <line x1="545" y1="372" x2="712" y2="372" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="628" y="366" text-anchor="middle" font-size="11" fill="#1a1a1a">AT+CIPMODE=0</text>

  <line x1="712" y1="388" x2="545" y2="388" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr_green)"/>
  <text x="628" y="384" text-anchor="middle" font-size="11" fill="#27ae60">OK</text>

  <!-- Panel 2 Note Box -->
  <rect x="510" y="395" width="405" height="120" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="525" y="415" font-size="12" font-weight="bold" fill="#c0392b">Особливості passthrough режиму:</text>
  <text x="525" y="437" font-size="11" fill="#1a1a1a">• Пряме наскрізне з'єднання без вказування довжини</text>
  <text x="525" y="457" font-size="11" fill="#1a1a1a">• Висока швидкість, відсутність оверхеду AT-команд</text>
  <text x="525" y="477" font-size="11" fill="#1a1a1a">• Немає підтверджень SEND OK на рівні AT-інтерпретатора</text>
  <text x="525" y="497" font-size="11" fill="#1a1a1a">• Завершення передачі лише через +++ з паузами 1 с</text>
</svg>
