<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Гонка ресурсів та переповнення UART при спонтанних пакетах +IPD</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Спонтанне надходження +IPD під час обробки AT-команд спричиняє розсинхронізацію FSM хоста й втрату кадрів</text>

  <!-- СЕКЦІЯ 1: Компоненти системи та асинхронні канали -->
  <rect x="30" y="85" width="900" height="115" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Блок 1: Хост-MCU -->
  <rect x="50" y="102" width="220" height="80" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="160" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Хост-мікроконтролер</text>
  <text x="160" y="158" text-anchor="middle" font-size="12" fill="#2457d6">FSM парсер AT-відповідей</text>

  <!-- Зв'язок UART -->
  <line x1="270" y1="142" x2="340" y2="142" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="305" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">UART</text>

  <!-- Блок 2: Модуль ESP-01 -->
  <rect x="340" y="102" width="300" height="80" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="490" y="120" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Модуль ESP-01 (ESP8266)</text>
  
  <rect x="350" y="129" width="130" height="45" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="415" y="147" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">AT-інтерпретатор</text>
  <text x="415" y="162" text-anchor="middle" font-size="10" fill="#6b7280">Буфер UART RX/TX</text>

  <rect x="495" y="129" width="135" height="45" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="562" y="147" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a1a">Стек LwIP (DRAM)</text>
  <text x="562" y="162" text-anchor="middle" font-size="10" fill="#6b7280">TCP/UDP PCB буфери</text>

  <!-- Зв'язок Wi-Fi -->
  <line x1="640" y1="142" x2="710" y2="142" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="675" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Wi-Fi</text>

  <!-- Блок 3: Мережа -->
  <rect x="710" y="102" width="200" height="80" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="810" y="136" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Зовнішня мережа</text>
  <text x="810" y="158" text-anchor="middle" font-size="12" fill="#2457d6">Пакет TCP/UDP</text>

  <!-- СЕКЦІЯ 2: Часова діаграма (Sequence Flow) -->
  <rect x="30" y="215" width="900" height="305" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <text x="50" y="240" font-size="14" font-weight="700" fill="#1a1a1a">Часова послідовність виникнення Race Condition</text>

  <!-- Лінії життєвого циклу (Lifelines) -->
  <rect x="95" y="255" width="130" height="28" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="160" y="274" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Хост-MCU</text>
  <line x1="160" y1="283" x2="160" y2="495" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,4"/>

  <rect x="420" y="255" width="140" height="28" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="490" y="274" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">AT-інтерпретатор</text>
  <line x1="490" y1="283" x2="490" y2="495" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,4"/>

  <rect x="740" y="255" width="140" height="28" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="810" y="274" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Стек LwIP / Wi-Fi</text>
  <line x1="810" y1="283" x2="810" y2="495" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Події часової діаграми -->
  <!-- t1: Host надсилає AT+CIPSEND -->
  <line x1="160" y1="315" x2="490" y2="315" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="325" y="304" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">1. Надсилання AT+CIPSEND=0,5</text>

  <!-- t2: Прихід TCP пакета з мережі -->
  <line x1="890" y1="335" x2="810" y2="335" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="850" y="324" text-anchor="middle" font-size="11" font-weight="700" fill="#2457d6">2. Вхідний TCP-пакет</text>

  <!-- t3: Коллбек LwIP до AT -->
  <line x1="810" y1="360" x2="490" y2="360" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="650" y="349" text-anchor="middle" font-size="11" fill="#6b7280">3. Передача даних з LwIP у FIFO AT</text>

  <!-- t4: Спонтанний вивід +IPD в UART (Конфлікт!) -->
  <line x1="490" y1="395" x2="160" y2="395" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arr-red)"/>
  <text x="325" y="384" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">4. Спонтанний кадр +IPD,0,5:hello (UART RX)</text>

  <!-- t5: Відповідь OK виводиться з запізненням -->
  <line x1="490" y1="425" x2="160" y2="425" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="325" y="414" text-anchor="middle" font-size="11" fill="#6b7280">5. Відповідь &gt; або OK (із запізненням)</text>

  <!-- Підсумкові блоки наслідків -->
  <rect x="65" y="445" width="190" height="46" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="160" y="463" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">Збій FSM хост-MCU</text>
  <text x="160" y="478" text-anchor="middle" font-size="10" fill="#c0392b">Переповнення FIFO UART / Таймаут</text>

  <rect x="420" y="445" width="460" height="46" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="650" y="463" text-anchor="middle" font-size="11" font-weight="700" fill="#c0392b">Причина: Спонтанний +IPD перериває очікування відповіді OK</text>
  <text x="650" y="478" text-anchor="middle" font-size="10" fill="#1a1a1a">Наслідок: Втрата кадрів даних, рассинхронізація командного каналу</text>
</svg>
