<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Header -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Порівняння режимів сокетного обміну ESP8266: AT+CIPMUX=0 та AT+CIPMUX=1</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Одиночне з'єднання підтримує прозорий тунель, а мультисокетний режим надає 5 паралельних слотів LwIP (ID 0..4)</text>

  <!-- Left Panel: Single Channel Mode -->
  <rect x="30" y="80" width="435" height="410" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#2457d6">Одиночний режим (AT+CIPMUX=0)</text>
  <text x="247" y="128" text-anchor="middle" font-size="12" fill="#6b7280">Лише 1 активний сокет TCP або UDP</text>

  <!-- Left: Host MCU & Connection Slot -->
  <rect x="50" y="150" width="130" height="70" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="115" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Хост-MCU</text>
  <text x="115" y="200" text-anchor="middle" font-size="12" fill="#6b7280">UART Rx/Tx</text>

  <line x1="180" y1="185" x2="250" y1="185" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="250" y="150" width="195" height="70" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="347" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Слот з'єднання</text>
  <text x="347" y="195" text-anchor="middle" font-size="12" fill="#6b7280">Єдиний PCB LwIP (ID відсутній)</text>

  <!-- Left: Passthrough Feature Box -->
  <rect x="50" y="240" width="395" height="110" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="65" y="265" font-size="13" font-weight="bold" fill="#27ae60">Підтримка режиму прозорого тунелю (Passthrough)</text>
  <text x="65" y="290" font-size="12" fill="#1a1a1a">• Активація через AT+CIPMODE=1 та AT+CIPSEND</text>
  <text x="65" y="312" font-size="12" fill="#1a1a1a">• Дані передаються без префікса +IPD (прямий потік)</text>
  <text x="65" y="334" font-size="12" fill="#1a1a1a">• Вихід із тунелю: послідовність +++ із паузою 1 сек</text>

  <!-- Left: Limitations & Usage -->
  <rect x="50" y="365" width="395" height="105" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="65" y="390" font-size="12" fill="#1a1a1a">• Витрати пам'яті DRAM: мінімальні (~2-4 кБ)</text>
  <text x="65" y="412" font-size="12" fill="#c0392b">• Неможливо запустити TCP-сервер</text>
  <text x="65" y="434" font-size="12" fill="#c0392b">• Одночасні клієнтські запити: заблоковані</text>
  <text x="65" y="456" font-size="12" fill="#6b7280">• Використання: прості датчики, тунелювання RAW TCP</text>

  <!-- Right Panel: Multi-Socket Mode -->
  <rect x="495" y="80" width="435" height="410" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="712" y="108" text-anchor="middle" font-size="15" font-weight="bold" fill="#2457d6">Мультисокетний режим (AT+CIPMUX=1)</text>
  <text x="712" y="128" text-anchor="middle" font-size="12" fill="#6b7280">До 5 паралельних слотів LwIP (ID 0, 1, 2, 3, 4)</text>

  <!-- Right: 5 Sockets Stack -->
  <rect x="515" y="150" width="200" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="525" y="170" font-size="12" font-weight="bold" fill="#2457d6">Слот ID 0: Active TCP/UDP</text>

  <rect x="515" y="186" width="200" height="30" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="525" y="206" font-size="12" fill="#1a1a1a">Слот ID 1: Active TCP Client</text>

  <rect x="515" y="222" width="200" height="30" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="525" y="242" font-size="12" fill="#1a1a1a">Слот ID 2: Active UDP Socket</text>

  <rect x="515" y="258" width="200" height="30" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="525" y="278" font-size="12" fill="#6b7280">Слот ID 3: Free / Idle PCB</text>

  <rect x="515" y="294" width="200" height="30" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="525" y="314" font-size="12" fill="#6b7280">Слот ID 4: Free / Idle PCB</text>

  <!-- Right: Framing & +IPD Details -->
  <rect x="730" y="150" width="185" height="174" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="740" y="172" font-size="13" font-weight="bold" fill="#1a1a1a">Кадрування даних</text>
  <text x="740" y="194" font-size="12" font-weight="bold" fill="#2457d6">Формат префікса +IPD:</text>
  <text x="740" y="216" font-size="12" font-weight="bold" fill="#1a1a1a">+IPD,&lt;link_id&gt;,&lt;len&gt;:</text>
  <text x="740" y="242" font-size="12" fill="#6b7280">
    <tspan x="740" dy="0">Обов'язкове вказування</tspan>
    <tspan x="740" dy="18">ID слота (0..4) для</tspan>
    <tspan x="740" dy="18">сегрегації потоків</tspan>
    <tspan x="740" dy="18">на хост-контролері</tspan>
  </text>

  <!-- Right: Features & Limitations -->
  <rect x="515" y="340" width="400" height="130" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="530" y="365" font-size="12" fill="#27ae60">• Можливість запуску TCP-сервера: AT+CIPSERVER=1,port</text>
  <text x="530" y="388" font-size="12" fill="#c0392b">• Прозорий тунель Passthrough: НЕ підтримується</text>
  <text x="530" y="411" font-size="12" fill="#c0392b">• Витрати DRAM: високі (~10-15 кБ) під буфери pbuf</text>
  <text x="530" y="434" font-size="12" fill="#1a1a1a">• Необхідність AT+CIPSTO для закриття завислих сокетів</text>
  <text x="530" y="457" font-size="12" fill="#6b7280">• Використання: Web-сервери, мульти-клієнтські IoT-вузли</text>
</svg>
