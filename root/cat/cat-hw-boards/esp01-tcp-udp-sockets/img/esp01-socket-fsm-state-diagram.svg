<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Діаграма станів кінцевого автомата сокета ESP-01</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Алгоритм керування з'єднанням, потоковим розбором +IPD та автовідновленням при збоях мережі</text>

  <!-- STATE 1: INIT -->
  <rect x="35" y="140" width="150" height="70" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="110" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">STATE_INIT</text>
  <text x="110" y="188" text-anchor="middle" font-size="11" fill="#1a1a1a">AT+CWJAP / MUX</text>

  <!-- STATE 2: CONNECTING -->
  <rect x="245" y="140" width="150" height="70" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="320" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">STATE_CONNECT</text>
  <text x="320" y="188" text-anchor="middle" font-size="11" fill="#6b7280">AT+CIPSTART</text>

  <!-- STATE 3: CONNECTED -->
  <rect x="455" y="140" width="170" height="70" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="540" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">STATE_CONNECTED</text>
  <text x="540" y="188" text-anchor="middle" font-size="11" fill="#1a1a1a">Готовий до обміну</text>

  <!-- STATE 4: CIPSEND -->
  <rect x="735" y="140" width="165" height="70" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="817" y="167" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">STATE_CIPSEND</text>
  <text x="817" y="188" text-anchor="middle" font-size="11" fill="#6b7280">Чекаємо '>' -> Дані</text>

  <!-- STATE 5: PARSING IPD -->
  <rect x="455" y="300" width="170" height="70" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="540" y="327" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">STATE_PARSING_IPD</text>
  <text x="540" y="348" text-anchor="middle" font-size="11" fill="#1a1a1a">+IPD,link_id,len:data</text>

  <!-- STATE 6: RECOVERY -->
  <rect x="245" y="300" width="160" height="70" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="325" y="327" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">STATE_RECOVERY</text>
  <text x="325" y="348" text-anchor="middle" font-size="11" fill="#1a1a1a">WIFI DISCONNECT</text>

  <!-- TRANSITION LINES & LABELS -->

  <!-- 1. INIT -> CONNECT -->
  <line x1="185" y1="175" x2="245" y2="175" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="215" y="162" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Wi-Fi OK</text>

  <!-- 2. CONNECT -> CONNECTED -->
  <line x1="395" y1="175" x2="455" y2="175" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="425" y="162" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">CONNECT OK</text>

  <!-- 3. CONNECTED -> CIPSEND -->
  <line x1="625" y1="158" x2="735" y2="158" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="680" y="146" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">send_async()</text>

  <!-- 4. CIPSEND -> CONNECTED -->
  <line x1="735" y1="192" x2="625" y2="192" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="680" y="208" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b7280">SEND OK / Timeout</text>

  <!-- 5. CONNECTED -> PARSING IPD -->
  <line x1="565" y1="210" x2="565" y2="300" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="573" y="258" font-size="11" font-weight="bold" fill="#2457d6">Вхідний '+IPD'</text>

  <!-- 6. PARSING IPD -> CONNECTED -->
  <line x1="515" y1="300" x2="515" y2="210" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="507" y="258" text-anchor="end" font-size="11" font-weight="bold" fill="#27ae60">Розбір завершено</text>

  <!-- 7. CONNECTED -> RECOVERY -->
  <path d="M 455,195 L 360,300" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <text x="390" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">CLOSED / Zboji</text>

  <!-- 8. RECOVERY -> INIT -->
  <path d="M 245,335 L 110,335 L 110,210" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="175" y="325" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Скидання &amp; Автовідновлення</text>

  <!-- BOTTOM CALLOUT PANEL -->
  <rect x="35" y="415" width="890" height="95" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="437" font-size="12" font-weight="bold" fill="#2457d6">Принципи побудови асинхронного кінцевого автомата ESP-01:</text>
  <text x="50" y="457" font-size="12" fill="#1a1a1a">1. Неблокувальне опитування UART-буфера через esp01_socket_poll() без затримання виконання процесора.</text>
  <text x="50" y="477" font-size="12" fill="#1a1a1a">2. Двох-етапне відправлення AT+CIPSEND зі станом очікування квитанції готовності '> '.</text>
  <text x="50" y="497" font-size="12" fill="#1a1a1a">3. Потоковий розбір +IPD кадрів з виявленням обривів зв'язку та автовідновленням через STATE_RECOVERY.</text>
</svg>
