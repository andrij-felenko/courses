<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Header -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Обробка паралельних TCP-підключень на модулі ESP-01</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Розподіл сокетних дескрипторів lwIP (ID 0..3) та кільцевих буферів pbuf у пам'яті DRAM</text>

  <!-- Left Panel: External Clients -->
  <rect x="30" y="80" width="170" height="420" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="115" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Зовнішні клієнти</text>

  <!-- Client 0 -->
  <rect x="45" y="125" width="140" height="65" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="115" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Клієнт 0 (ID 0)</text>
  <text x="115" y="170" text-anchor="middle" font-size="12" fill="#6b7280">192.168.1.50:50101</text>

  <!-- Client 1 -->
  <rect x="45" y="210" width="140" height="65" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="115" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Клієнт 1 (ID 1)</text>
  <text x="115" y="255" text-anchor="middle" font-size="12" fill="#6b7280">192.168.1.51:50102</text>

  <!-- Client 2 -->
  <rect x="45" y="295" width="140" height="65" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="115" y="320" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Клієнт 2 (ID 2)</text>
  <text x="115" y="340" text-anchor="middle" font-size="12" fill="#6b7280">192.168.1.52:50103</text>

  <!-- Client 3 -->
  <rect x="45" y="380" width="140" height="65" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="115" y="405" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Клієнт 3 (ID 3)</text>
  <text x="115" y="425" text-anchor="middle" font-size="12" fill="#6b7280">192.168.1.53:50104</text>

  <text x="115" y="475" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Макс. 4 сокети (CIPMUX=1)</text>

  <!-- Center Panel 1: lwIP Stack & TCP PCBs -->
  <rect x="235" y="80" width="235" height="420" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="352" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Стек lwIP (TCP PCB)</text>

  <!-- Listen PCB -->
  <rect x="250" y="120" width="205" height="40" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="5"/>
  <text x="352" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Слухаючий сокет: Port 80</text>

  <!-- PCB 0 -->
  <rect x="250" y="175" width="205" height="60" fill="white" stroke="#d0d7de" stroke-width="1" rx="5"/>
  <text x="260" y="198" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">tcp_pcb [0]</text>
  <text x="445" y="198" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">ESTABLISHED</text>
  <text x="260" y="220" text-anchor="start" font-size="12" fill="#6b7280">S_pcb = 160 B | WND = 2048 B</text>

  <!-- PCB 1 -->
  <rect x="250" y="250" width="205" height="60" fill="white" stroke="#d0d7de" stroke-width="1" rx="5"/>
  <text x="260" y="273" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">tcp_pcb [1]</text>
  <text x="445" y="273" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">ESTABLISHED</text>
  <text x="260" y="295" text-anchor="start" font-size="12" fill="#6b7280">S_pcb = 160 B | WND = 2048 B</text>

  <!-- PCB 2 -->
  <rect x="250" y="325" width="205" height="60" fill="white" stroke="#d0d7de" stroke-width="1" rx="5"/>
  <text x="260" y="348" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">tcp_pcb [2]</text>
  <text x="445" y="348" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">ESTABLISHED</text>
  <text x="260" y="370" text-anchor="start" font-size="12" fill="#6b7280">S_pcb = 160 B | WND = 2048 B</text>

  <!-- PCB 3 -->
  <rect x="250" y="400" width="205" height="60" fill="white" stroke="#d0d7de" stroke-width="1" rx="5"/>
  <text x="260" y="423" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">tcp_pcb [3]</text>
  <text x="445" y="423" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">ESTABLISHED</text>
  <text x="260" y="445" text-anchor="start" font-size="12" fill="#6b7280">S_pcb = 160 B | WND = 2048 B</text>

  <text x="352" y="485" text-anchor="middle" font-size="12" fill="#6b7280">Загалом PCB: 4 × 160 B = 640 B</text>

  <!-- Center Panel 2: DRAM Buffers & pbufs -->
  <rect x="505" y="80" width="235" height="420" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="622" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Буфери pbuf у DRAM</text>

  <!-- Heap Status Bar -->
  <rect x="520" y="120" width="205" height="40" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="5"/>
  <text x="622" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Вільна купа (Heap): ~24 KB</text>

  <!-- Ring Buffer 0 -->
  <rect x="520" y="175" width="205" height="60" fill="white" stroke="#d0d7de" stroke-width="1" rx="5"/>
  <text x="530" y="198" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">Кільцевий буфер #0</text>
  <text x="715" y="198" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">pbuf Rx/Tx</text>
  <text x="530" y="220" text-anchor="start" font-size="12" fill="#6b7280">Виділено: 2048 B (1460 B MSS)</text>

  <!-- Ring Buffer 1 -->
  <rect x="520" y="250" width="205" height="60" fill="white" stroke="#d0d7de" stroke-width="1" rx="5"/>
  <text x="530" y="273" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">Кільцевий буфер #1</text>
  <text x="715" y="273" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">pbuf Rx/Tx</text>
  <text x="530" y="295" text-anchor="start" font-size="12" fill="#6b7280">Виділено: 2048 B (1460 B MSS)</text>

  <!-- Ring Buffer 2 -->
  <rect x="520" y="325" width="205" height="60" fill="white" stroke="#d0d7de" stroke-width="1" rx="5"/>
  <text x="530" y="348" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">Кільцевий буфер #2</text>
  <text x="715" y="348" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">pbuf Rx/Tx</text>
  <text x="530" y="370" text-anchor="start" font-size="12" fill="#6b7280">Виділено: 2048 B (1460 B MSS)</text>

  <!-- Ring Buffer 3 -->
  <rect x="520" y="400" width="205" height="60" fill="white" stroke="#d0d7de" stroke-width="1" rx="5"/>
  <text x="530" y="423" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">Кільцевий буфер #3</text>
  <text x="715" y="423" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">pbuf Rx/Tx</text>
  <text x="530" y="445" text-anchor="start" font-size="12" fill="#6b7280">Виділено: 2048 B (1460 B MSS)</text>

  <text x="622" y="485" text-anchor="middle" font-size="12" fill="#6b7280">Сумарно pbuf: 4 × 2 KB = 8 KB</text>

  <!-- Right Panel: Application Level & AT Demuxer -->
  <rect x="775" y="80" width="155" height="420" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="852" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Прикладний рівень</text>

  <!-- Demuxer Box -->
  <rect x="790" y="120" width="125" height="220" fill="white" stroke="#2457d6" stroke-width="1.5" rx="5"/>
  <text x="852" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Мультиплексор</text>
  <text x="852" y="165" text-anchor="middle" font-size="12" fill="#1a1a1a">AT-команд / API</text>
  <text x="852" y="200" text-anchor="middle" font-size="12" fill="#6b7280">+IPD,0,&lt;len&gt;:</text>
  <text x="852" y="235" text-anchor="middle" font-size="12" fill="#6b7280">+IPD,1,&lt;len&gt;:</text>
  <text x="852" y="270" text-anchor="middle" font-size="12" fill="#6b7280">+IPD,2,&lt;len&gt;:</text>
  <text x="852" y="305" text-anchor="middle" font-size="12" fill="#6b7280">+IPD,3,&lt;len&gt;:</text>

  <!-- UART Box -->
  <rect x="790" y="360" width="125" height="100" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="5"/>
  <text x="852" y="390" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">UART / MCU</text>
  <text x="852" y="415" text-anchor="middle" font-size="12" fill="#1a1a1a">TXD0 / RXD0</text>
  <text x="852" y="435" text-anchor="middle" font-size="12" fill="#6b7280">115200 бод</text>

  <!-- Connectors (Arrows) -->
  <!-- Client -> PCB -->
  <line x1="185" y1="157" x2="248" y2="190" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="185" y1="242" x2="248" y2="265" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="185" y1="327" x2="248" y2="340" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="185" y1="412" x2="248" y2="415" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- PCB -> PBUF -->
  <line x1="455" y1="205" x2="518" y2="205" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="455" y1="280" x2="518" y2="280" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="455" y1="355" x2="518" y2="355" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="455" y1="430" x2="518" y2="430" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- PBUF -> Demuxer -->
  <line x1="725" y1="205" x2="788" y2="200" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="725" y1="280" x2="788" y2="235" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="725" y1="355" x2="788" y2="270" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="725" y1="430" x2="788" y2="305" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Demuxer -> UART -->
  <line x1="852" y1="340" x2="852" y2="358" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
</svg>
