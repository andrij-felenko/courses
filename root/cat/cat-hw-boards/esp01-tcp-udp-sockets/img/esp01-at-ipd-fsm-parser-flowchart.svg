<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr_blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr_green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr_gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Асинхронний парсер подій +IPD на боці хост-мікроконтролера</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Побайтова обробка UART RX через скінченний автомат (FSM) виключає блокування MCU під час прийому сокетних даних</text>

  <!-- Panel 1: Timing Diagram -->
  <rect x="30" y="70" width="900" height="195" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">1. Часова діаграма потоку UART RX від ESP-01 до Host MCU</text>

  <!-- Track label -->
  <text x="45" y="139" font-size="12" font-weight="bold" fill="#1a1a1a">UART RX (ESP-01 → MCU)</text>

  <!-- Byte Stream Blocks (y=118..152, text y=139) -->
  <rect x="205" y="118" width="55" height="34" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="232" y="139" text-anchor="middle" font-size="12" fill="#6b7280">...\r\n</text>

  <rect x="272" y="118" width="100" height="34" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="322" y="139" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">+IPD,</text>

  <rect x="384" y="118" width="60" height="34" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="414" y="139" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">0,</text>

  <rect x="456" y="118" width="60" height="34" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="486" y="139" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">5:</text>

  <rect x="528" y="118" width="220" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="638" y="139" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Дані сокета (5 байт: "Hello")</text>

  <rect x="760" y="118" width="140" height="34" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="830" y="139" text-anchor="middle" font-size="12" fill="#6b7280">OK / далі...</text>

  <!-- Markers & Arrows from timeline (downward) -->
  <line x1="322" y1="152" x2="322" y2="175" stroke="#2457d6" stroke-width="1" marker-end="url(#arr_blue)"/>
  <text x="322" y="195" text-anchor="middle" font-size="12" fill="#2457d6">Старт префіксу</text>

  <line x1="414" y1="152" x2="414" y2="175" stroke="#2457d6" stroke-width="1" marker-end="url(#arr_blue)"/>
  <text x="414" y="195" text-anchor="middle" font-size="12" fill="#2457d6">ID сокета</text>

  <line x1="486" y1="152" x2="486" y2="175" stroke="#2457d6" stroke-width="1" marker-end="url(#arr_blue)"/>
  <text x="486" y="195" text-anchor="middle" font-size="12" fill="#2457d6">Довжина len=5</text>

  <line x1="638" y1="152" x2="638" y2="175" stroke="#27ae60" stroke-width="1" marker-end="url(#arr_green)"/>
  <text x="638" y="195" text-anchor="middle" font-size="12" fill="#27ae60">Читання 5 байт у буфер</text>

  <!-- Summary line in Panel 1 -->
  <text x="480" y="220" text-anchor="middle" font-size="12" fill="#6b7280">Події UART ISR обробляються побайтно без блокування основного циклу MCU</text>
  <rect x="230" y="230" width="500" height="24" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="480" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Потік: rx_buffer[] (колектор UART) → FSM State Machine</text>


  <!-- Panel 2: FSM Flowchart -->
  <rect x="30" y="280" width="900" height="255" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="304" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">2. Блок-схема та стани скінченного автомата (FSM) асинхронного парсера</text>

  <!-- State 0: SEARCH_PREFIX -->
  <rect x="45" y="325" width="145" height="80" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="117" y="347" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">SEARCH_PREFIX</text>
  <text x="117" y="367" text-anchor="middle" font-size="12" fill="#1a1a1a">Пошук "+IPD,"</text>
  <text x="117" y="387" text-anchor="middle" font-size="12" fill="#6b7280">байтами з ISR</text>

  <!-- Arrow 0 -> 1 -->
  <line x1="190" y1="365" x2="223" y2="365" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr_blue)"/>
  <text x="207" y="354" text-anchor="middle" font-size="12" fill="#2457d6">"+IPD,"</text>

  <!-- State 1: PARSE_ID -->
  <rect x="225" y="325" width="145" height="80" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="297" y="347" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">PARSE_ID</text>
  <text x="297" y="367" text-anchor="middle" font-size="12" fill="#1a1a1a">Зчитування link_id</text>
  <text x="297" y="387" text-anchor="middle" font-size="12" fill="#6b7280">до коми ','</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="370" y1="365" x2="403" y2="365" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr_blue)"/>
  <text x="387" y="354" text-anchor="middle" font-size="12" fill="#2457d6">','</text>

  <!-- State 2: PARSE_LEN -->
  <rect x="405" y="325" width="145" height="80" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="477" y="347" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">PARSE_LEN</text>
  <text x="477" y="367" text-anchor="middle" font-size="12" fill="#1a1a1a">Зчитування len</text>
  <text x="477" y="387" text-anchor="middle" font-size="12" fill="#6b7280">до двокрапки ':'</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="550" y1="365" x2="583" y2="365" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr_blue)"/>
  <text x="567" y="354" text-anchor="middle" font-size="12" fill="#2457d6">':'</text>

  <!-- State 3: READ_PAYLOAD -->
  <rect x="585" y="325" width="155" height="80" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="662" y="347" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">READ_PAYLOAD</text>
  <text x="662" y="367" text-anchor="middle" font-size="12" fill="#1a1a1a">Запис len байт</text>
  <text x="662" y="387" text-anchor="middle" font-size="12" fill="#6b7280">в буфер сокета</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="740" y1="365" x2="768" y2="365" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr_green)"/>
  <text x="754" y="354" text-anchor="middle" font-size="12" fill="#27ae60">len==0</text>

  <!-- State 4: DISPATCH -->
  <rect x="770" y="325" width="145" height="80" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="842" y="347" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">DISPATCH</text>
  <text x="842" y="367" text-anchor="middle" font-size="12" fill="#1a1a1a">Виклик rx_cb()</text>
  <text x="842" y="387" text-anchor="middle" font-size="12" fill="#6b7280">Обробка пакета</text>

  <!-- Loopback / Reset path -->
  <path d="M 842 405 L 842 422 L 117 422 L 117 413" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr_gray)"/>
  <text x="480" y="440" text-anchor="middle" font-size="12" fill="#6b7280">Автоматичне скидання стану в SEARCH_PREFIX після завершення пакета або таймауту</text>

  <!-- Result Banner -->
  <rect x="45" y="458" width="870" height="58" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="480" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Результат: асинхронний FSM-парсер гарантує детермінований прийом без втрат даних</text>
  <text x="480" y="500" text-anchor="middle" font-size="12" fill="#6b7280">Запобігає блокуванню процесора під час розриву зв'язку або затримок сокета LwIP</text>

</svg>
