<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Діаграма станів та життєвий цикл сокета в AT-прошивці ESP8266</text>
  <text x="480" y="48" text-anchor="middle" font-size="13" fill="#6b7280">Переходи між станами від конфігурації (AT+CIPMUX) до закриття з'єднання (AT+CIPCLOSE) з відповідями прошивки</text>

  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Start Arrow -->
  <text x="125" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Старт / Конфігурація</text>
  <line x1="125" y1="132" x2="125" y2="171" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Top Return Path (AT+CIPCLOSE) -->
  <path d="M 370 180 L 370 135 L 855 135 L 855 171" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arr-gray)"/>
  <text x="612" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">AT+CIPCLOSE (або закриття сервером)</text>
  <text x="612" y="148" text-anchor="middle" font-size="11" fill="#c0392b">ВІДПОВІДЬ: CLOSED / OK</text>

  <!-- Bottom Return Path (Reset to Unconnected) -->
  <path d="M 855 260 L 855 305 L 125 305 L 125 269" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arr-gray)"/>
  <text x="490" y="323" text-anchor="middle" font-size="12" fill="#6b7280">Готовність до відкриття нових сокетів (повернення в початковий стан)</text>

  <!-- State Boxes -->
  <!-- State 1: UNCONNECTED -->
  <rect x="40" y="180" width="170" height="80" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="125" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">UNCONNECTED</text>
  <text x="125" y="232" text-anchor="middle" font-size="12" fill="#6b7280">Сокет не відкрито</text>
  <text x="125" y="248" text-anchor="middle" font-size="11" fill="#2457d6">AT+CIPMUX=0 / 1</text>

  <!-- Transition 1 -> 2 -->
  <text x="245" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">AT+CIPSTART</text>
  <text x="245" y="222" text-anchor="middle" font-size="11" fill="#27ae60">CONNECT / OK</text>
  <line x1="210" y1="205" x2="271" y2="205" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- State 2: CONNECTED -->
  <rect x="280" y="180" width="180" height="80" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="370" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">CONNECTED</text>
  <text x="370" y="232" text-anchor="middle" font-size="12" fill="#6b7280">З'єднання відкрито</text>
  <text x="370" y="248" text-anchor="middle" font-size="11" fill="#6b7280">(TCP або UDP сокет)</text>

  <!-- Transition 2 -> 3 -->
  <text x="500" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">AT+CIPSEND</text>
  <text x="500" y="222" text-anchor="middle" font-size="11" fill="#27ae60">&gt; prompt</text>
  <line x1="460" y1="205" x2="531" y2="205" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Transition 3 -> 2 (Return after send) -->
  <line x1="540" y1="240" x2="469" y2="240" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="500" y="256" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">SEND OK / +IPD</text>

  <!-- State 3: TRANSMITTING -->
  <rect x="540" y="180" width="180" height="80" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="630" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">TRANSMITTING</text>
  <text x="630" y="232" text-anchor="middle" font-size="12" fill="#6b7280">Передача даних</text>
  <text x="630" y="248" text-anchor="middle" font-size="11" fill="#27ae60">Введення потоку байтів</text>

  <!-- State 4: CLOSED -->
  <rect x="780" y="180" width="150" height="80" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="855" y="210" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">CLOSED</text>
  <text x="855" y="232" text-anchor="middle" font-size="12" fill="#6b7280">З'єднання закрито</text>
  <text x="855" y="248" text-anchor="middle" font-size="11" fill="#c0392b">Сокет звільнено</text>

  <!-- Bottom Panel: AT Command Responses & Async Notifications -->
  <rect x="40" y="350" width="890" height="110" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="60" y="372" font-size="13" font-weight="bold" fill="#1a1a1a">Коди відповідей та асинхронні сповіщення AT-прошивками ESP8266:</text>

  <!-- Column 1 -->
  <text x="60" y="396" font-size="12" font-weight="bold" fill="#27ae60">+IPD,&lt;len&gt;:&lt;data&gt;</text>
  <text x="210" y="396" font-size="12" fill="#6b7280">— Асинхронний прийом даних (CIPMUX=0)</text>
  <text x="60" y="418" font-size="12" font-weight="bold" fill="#27ae60">+IPD,&lt;id&gt;,&lt;len&gt;:&lt;data&gt;</text>
  <text x="235" y="418" font-size="12" fill="#6b7280">— Прийом із зазначенням ID (CIPMUX=1)</text>
  <text x="60" y="440" font-size="12" font-weight="bold" fill="#2457d6">AT+CIPSTO=&lt;time&gt;</text>
  <text x="210" y="440" font-size="12" fill="#6b7280">— Налаштування тайм-ауту серверного сокета</text>

  <!-- Column 2 -->
  <text x="560" y="396" font-size="12" font-weight="bold" fill="#27ae60">SEND OK</text>
  <text x="645" y="396" font-size="12" fill="#6b7280">— Пакети успішно відправлено хосту</text>
  <text x="560" y="418" font-size="12" font-weight="bold" fill="#c0392b">SEND FAIL</text>
  <text x="645" y="418" font-size="12" fill="#6b7280">— Помилка передачі або тайм-аут</text>
  <text x="560" y="440" font-size="12" font-weight="bold" fill="#c0392b">CLOSED</text>
  <text x="645" y="440" font-size="12" fill="#6b7280">— Обрив з'єднання віддаленою стороною</text>
</svg>
