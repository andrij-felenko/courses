<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-grey" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Послідовність обміну AT-командами та асинхронний прийом +IPD</text>
  <text x="480" y="50" font-size="13" text-anchor="middle" fill="#6b7280">Вхідні дані +IPD надходять асинхронно незалежно від виконання команд надсилання CIPSEND</text>

  <!-- Lifelines -->
  <line x1="160" y1="106" x2="160" y2="525" stroke="#d0d7de" stroke-dasharray="4 4" stroke-width="1.5"/>
  <line x1="480" y1="106" x2="480" y2="525" stroke="#2457d6" stroke-dasharray="4 4" stroke-width="1.5"/>
  <line x1="800" y1="106" x2="800" y2="525" stroke="#d0d7de" stroke-dasharray="4 4" stroke-width="1.5"/>

  <!-- Actor Headers -->
  <rect x="70" y="70" width="180" height="36" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="160" y="93" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Мікроконтролер (MCU)</text>

  <rect x="390" y="70" width="180" height="36" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="93" font-size="14" font-weight="bold" text-anchor="middle" fill="#2457d6">Модуль ESP-01 (AT)</text>

  <rect x="710" y="70" width="180" height="36" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="800" y="93" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Віддалений сервер</text>

  <!-- Step 1: CIPMUX -->
  <text x="320" y="125" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">AT+CIPMUX=1</text>
  <line x1="160" y1="135" x2="480" y2="135" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="320" y="150" font-size="12" text-anchor="middle" fill="#6b7280">OK</text>
  <line x1="480" y1="160" x2="160" y2="160" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-grey)"/>

  <!-- Step 2: CIPSTART -->
  <text x="320" y="185" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">AT+CIPSTART=0,"TCP","192.168.1.50",8080</text>
  <line x1="160" y1="195" x2="480" y2="195" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="640" y="205" font-size="12" text-anchor="middle" fill="#6b7280">TCP SYN / SYN-ACK</text>
  <line x1="480" y1="215" x2="800" y2="215" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-grey)"/>

  <text x="320" y="230" font-size="12" text-anchor="middle" fill="#6b7280">0,CONNECT  OK</text>
  <line x1="480" y1="240" x2="160" y2="240" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-grey)"/>

  <!-- Step 3: CIPSEND -->
  <text x="320" y="265" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">AT+CIPSEND=0,5</text>
  <line x1="160" y1="275" x2="480" y2="275" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="320" y="285" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">&gt; (символ запрошення)</text>
  <line x1="480" y1="295" x2="160" y2="295" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <text x="320" y="308" font-size="12" text-anchor="middle" fill="#1a1a1a">HELLO (5 байт даних)</text>
  <line x1="160" y1="318" x2="480" y2="318" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="640" y="328" font-size="12" text-anchor="middle" fill="#1a1a1a">TCP Data (HELLO)</text>
  <line x1="480" y1="338" x2="800" y2="338" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="320" y="350" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">SEND OK</text>
  <line x1="480" y1="360" x2="160" y2="360" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Step 4: Async +IPD (Highlighted Panel) -->
  <rect x="40" y="380" width="880" height="68" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="52" y="396" font-size="11" font-weight="bold" fill="#2457d6">Асинхронний прийом</text>

  <text x="640" y="395" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">TCP Data (RESPONSE)</text>
  <line x1="800" y1="405" x2="480" y2="405" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <text x="320" y="422" font-size="13" font-weight="bold" text-anchor="middle" fill="#2457d6">+IPD,0,8:RESPONSE</text>
  <line x1="480" y1="432" x2="160" y2="432" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Step 5: CIPCLOSE -->
  <text x="320" y="460" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">AT+CIPCLOSE=0</text>
  <line x1="160" y1="470" x2="480" y2="470" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="640" y="480" font-size="12" text-anchor="middle" fill="#6b7280">TCP FIN / ACK</text>
  <line x1="480" y1="490" x2="800" y2="490" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-grey)"/>

  <text x="320" y="502" font-size="12" text-anchor="middle" fill="#6b7280">0,CLOSED  OK</text>
  <line x1="480" y1="512" x2="160" y2="512" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-grey)"/>
</svg>
