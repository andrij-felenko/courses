<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Структура кадру асинхронного повідомлення +IPD в ESP8266</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Розділення службового заголовка AT-інтерпретатора та сирого потоку даних</text>

  <!-- Vertical Divider Line between Header and Payload worlds -->
  <line x1="574" y1="72" x2="574" y2="480" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- Zone Header 1: AT Header -->
  <rect x="40" y="80" width="525" height="35" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="302.5" y="102" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Службовий заголовок AT-інтерпретатора</text>

  <!-- Zone Header 2: Data Payload -->
  <rect x="583" y="80" width="337" height="35" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="751.5" y="102" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Сирі дані (Payload)</text>

  <!-- Main Frame Bar (y = 135 to 205) -->
  <!-- Block 1: +IPD -->
  <rect x="40" y="135" width="75" height="70" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="4"/>
  <text x="77.5" y="162" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">+IPD</text>
  <text x="77.5" y="186" font-size="12" fill="#6b7280" text-anchor="middle">Префікс</text>

  <!-- Comma 1 -->
  <text x="122" y="172" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">,</text>

  <!-- Block 2: <link_id> -->
  <rect x="129" y="135" width="95" height="70" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="4"/>
  <text x="176.5" y="162" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">&lt;link_id&gt;</text>
  <text x="176.5" y="186" font-size="12" fill="#6b7280" text-anchor="middle">ID сокета</text>

  <!-- Comma 2 -->
  <text x="231" y="172" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">,</text>

  <!-- Block 3: <len> -->
  <rect x="238" y="135" width="85" height="70" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="4"/>
  <text x="280.5" y="162" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">&lt;len&gt;</text>
  <text x="280.5" y="186" font-size="12" fill="#6b7280" text-anchor="middle">Довжина</text>

  <!-- Comma 3 -->
  <text x="330" y="172" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">,</text>

  <!-- Block 4: <IP>,<port> -->
  <rect x="337" y="135" width="159" height="70" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="4"/>
  <text x="416.5" y="162" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">&lt;IP&gt;,&lt;port&gt;</text>
  <text x="416.5" y="186" font-size="12" fill="#6b7280" text-anchor="middle">IP та порт джерела</text>

  <!-- Comma 4 -->
  <text x="503" y="172" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">,</text>

  <!-- Block 5: Header Boundary Delimiter (:) -->
  <rect x="510" y="135" width="55" height="70" fill="#fdecea" stroke="#c0392b" stroke-width="2" rx="4"/>
  <text x="537.5" y="162" font-size="18" font-weight="bold" fill="#c0392b" text-anchor="middle">:</text>
  <text x="537.5" y="186" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Границя</text>

  <!-- Block 6: <data> Payload -->
  <rect x="583" y="135" width="337" height="70" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="4"/>
  <text x="751.5" y="162" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">&lt;data&gt;</text>
  <text x="751.5" y="186" font-size="12" fill="#6b7280" text-anchor="middle">Сирі байти даних (розміром &lt;len&gt; байт)</text>

  <!-- Connecting Dashed Arrows to Lower Detail Cards -->
  <line x1="181.5" y1="205" x2="181.5" y2="235" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <line x1="537.5" y1="205" x2="451" y2="235" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <line x1="751.5" y1="205" x2="751.5" y2="235" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>

  <!-- LOWER DETAIL CARDS (y = 235 to 480) -->

  <!-- CARD 1: AT Modes (x = 40..323) -->
  <rect x="40" y="235" width="283" height="30" fill="#eaf0fd" stroke="#2457d6" rx="4"/>
  <text x="181.5" y="255" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Режими залежно від AT-налаштувань</text>

  <rect x="40" y="265" width="283" height="215" fill="#ffffff" stroke="#d0d7de" rx="4"/>

  <text x="55" y="290" font-size="12" font-weight="bold" fill="#1a1a1a">1. CIPMUX=0, CIPDINFO=0</text>
  <text x="55" y="306" font-size="12" font-weight="bold" fill="#2457d6">+IPD,&lt;len&gt;:&lt;data&gt;</text>

  <text x="55" y="334" font-size="12" font-weight="bold" fill="#1a1a1a">2. CIPMUX=1, CIPDINFO=0</text>
  <text x="55" y="350" font-size="12" font-weight="bold" fill="#2457d6">+IPD,&lt;link_id&gt;,&lt;len&gt;:&lt;data&gt;</text>

  <text x="55" y="378" font-size="12" font-weight="bold" fill="#1a1a1a">3. CIPMUX=1, CIPDINFO=1</text>
  <text x="55" y="394" font-size="12" font-weight="bold" fill="#2457d6">+IPD,&lt;id&gt;,&lt;len&gt;,&lt;IP&gt;,&lt;port&gt;:&lt;data&gt;</text>

  <rect x="50" y="414" width="263" height="54" fill="#f4f6f8" stroke="#d0d7de" rx="3"/>
  <text x="60" y="434" font-size="12" fill="#6b7280">Поля &lt;link_id&gt; та &lt;IP&gt;,&lt;port&gt;</text>
  <text x="60" y="452" font-size="12" fill="#6b7280">є опційними відповідно до режимів</text>


  <!-- CARD 2: Two-stage Parsing & Boundary (x = 337..565) -->
  <rect x="337" y="235" width="228" height="30" fill="#fdecea" stroke="#c0392b" rx="4"/>
  <text x="451" y="255" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Границя «Заголовок / Дані»</text>

  <rect x="337" y="265" width="228" height="215" fill="#ffffff" stroke="#d0d7de" rx="4"/>

  <!-- Step 1 Box -->
  <rect x="347" y="277" width="208" height="76" fill="#eaf0fd" stroke="#2457d6" rx="3"/>
  <text x="357" y="295" font-size="12" font-weight="bold" fill="#2457d6">Етап 1: Текстовий режим</text>
  <text x="357" y="313" font-size="12" fill="#1a1a1a">• Читання символів до ':'</text>
  <text x="357" y="331" font-size="12" fill="#1a1a1a">• Витяг значення &lt;len&gt;</text>
  <text x="357" y="347" font-size="12" fill="#6b7280">• Встановлення лічильника байт</text>

  <!-- Down arrow between Step 1 and Step 2 -->
  <line x1="451" y1="354" x2="451" y2="363" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Step 2 Box -->
  <rect x="347" y="365" width="208" height="105" fill="#e9f7ef" stroke="#27ae60" rx="3"/>
  <text x="357" y="383" font-size="12" font-weight="bold" fill="#27ae60">Етап 2: Бінарний режим</text>
  <text x="357" y="401" font-size="12" fill="#1a1a1a">• Читання ровно &lt;len&gt; байт</text>
  <text x="357" y="419" font-size="12" fill="#1a1a1a">• Без розбору \r\n у байтах</text>
  <text x="357" y="437" font-size="12" fill="#1a1a1a">• Захист від нуль-байтів 0x00</text>
  <text x="357" y="455" font-size="12" fill="#27ae60">• Перехід до очікування +IPD</text>


  <!-- CARD 3: Host FSM Parser (x = 583..920) -->
  <rect x="583" y="235" width="337" height="30" fill="#e9f7ef" stroke="#27ae60" rx="4"/>
  <text x="751.5" y="255" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Скінченний автомат (FSM) host-мікроконтролера</text>

  <rect x="583" y="265" width="337" height="215" fill="#ffffff" stroke="#d0d7de" rx="4"/>

  <!-- FSM State 1 -->
  <rect x="598" y="277" width="307" height="58" fill="#f4f6f8" stroke="#d0d7de" rx="3"/>
  <text x="608" y="295" font-size="12" font-weight="bold" fill="#1a1a1a">1. SEARCH_PREFIX</text>
  <text x="608" y="313" font-size="12" fill="#6b7280">Виявлення підрядка "+IPD," у потоці UART</text>
  <text x="608" y="327" font-size="12" fill="#2457d6">Перехід до розбору заголовка при збігу</text>

  <!-- FSM State 2 -->
  <rect x="598" y="343" width="307" height="58" fill="#eaf0fd" stroke="#2457d6" rx="3"/>
  <text x="608" y="361" font-size="12" font-weight="bold" fill="#2457d6">2. PARSE_HEADER</text>
  <text x="608" y="379" font-size="12" fill="#6b7280">Парсинг полів до ':', збереження &lt;len&gt;</text>
  <text x="608" y="393" font-size="12" fill="#2457d6">Ініціалізація лічильника байт навантаження</text>

  <!-- FSM State 3 -->
  <rect x="598" y="409" width="307" height="63" fill="#e9f7ef" stroke="#27ae60" rx="3"/>
  <text x="608" y="427" font-size="12" font-weight="bold" fill="#27ae60">3. READ_PAYLOAD</text>
  <text x="608" y="445" font-size="12" fill="#6b7280">Пряме збереження &lt;len&gt; байт у буфер DRAM</text>
  <text x="608" y="461" font-size="12" fill="#27ae60">Повідомлення додатка та повернення до 1</text>

</svg>
