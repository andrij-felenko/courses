<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-sec" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Часова діаграма AT+CIPSEND та асинхронного парсингу +IPD</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Послідовність квитування команд, запрошення '>', передачі payload та префіксного розбору +IPD</text>

  <!-- Time Axis -->
  <line x1="40" y1="125" x2="40" y2="475" stroke="#6b7280" stroke-width="2" marker-end="url(#arr-sec)"/>
  <text x="40" y="115" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">Час (t)</text>

  <!-- Lifelines -->
  <line x1="170" y1="125" x2="170" y2="475" stroke="#d0d7de" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="480" y1="125" x2="480" y2="475" stroke="#d0d7de" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="790" y1="125" x2="790" y2="475" stroke="#d0d7de" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Participant Headers -->
  <!-- Host MCU -->
  <rect x="80" y="80" width="180" height="42" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="170" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Host MCU (FSM)</text>

  <!-- ESP-01 -->
  <rect x="390" y="80" width="180" height="42" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="480" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">ESP-01 (UART / AT)</text>

  <!-- Remote Server -->
  <rect x="700" y="80" width="180" height="42" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="790" y="106" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Remote Server (TCP)</text>

  <!-- Step 1: AT+CIPSEND -->
  <line x1="170" y1="160" x2="471" y2="160" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="325" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">1. AT+CIPSEND=0,5</text>
  <text x="325" y="177" text-anchor="middle" font-size="11" fill="#6b7280">(ініціалізація відправки 5 байт у сокет 0)</text>

  <!-- Step 2: OK and '>' -->
  <line x1="480" y1="215" x2="179" y2="215" stroke="#6b7280" stroke-width="2" marker-end="url(#arr-gray)"/>
  <text x="325" y="207" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">2. OK \r\n &gt;</text>
  <text x="325" y="232" text-anchor="middle" font-size="11" fill="#6b7280">(підтвердження та запрошення вводу payload)</text>

  <!-- Step 3: Raw payload -->
  <line x1="170" y1="265" x2="471" y2="265" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="325" y="257" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">3. "Hello" (5 байт бінарного payload)</text>

  <!-- Step 4: TCP Segment to Server -->
  <line x1="480" y1="315" x2="781" y2="315" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="635" y="307" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">4. TCP Segment: "Hello"</text>

  <!-- Step 5: SEND OK -->
  <line x1="480" y1="355" x2="179" y2="355" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="325" y="347" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">5. SEND OK</text>

  <!-- Step 6: Server Data -->
  <line x1="790" y1="405" x2="489" y2="405" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="635" y="397" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">6. TCP Data (8 байт: "RESPONSE")</text>

  <!-- Step 7: +IPD notification -->
  <line x1="480" y1="455" x2="179" y2="455" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="325" y="447" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">7. +IPD,0,8:RESPONSE</text>
  <text x="325" y="470" text-anchor="middle" font-size="11" fill="#6b7280">(асинхронний префіксний кадр із точним розміром len=8)</text>

  <!-- Step 8: FSM Status box -->
  <rect x="65" y="478" width="210" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="170" y="499" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Точний відлік 8 байт payload без помилок</text>
</svg>
