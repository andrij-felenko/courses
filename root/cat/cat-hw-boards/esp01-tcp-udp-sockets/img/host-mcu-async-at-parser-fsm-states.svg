<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="42" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">FSM асинхронного AT-парсера та потокових даних +IPD на хост-МК</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">Пряма передача байтів +IPD,&lt;len&gt;: у буфер додатка запобігає блокуванню UART</text>

  <!-- Переходи верхнього ряду -->
  <!-- IDLE -> PARSE_IPD_HDR -->
  <line x1="280" y1="195" x2="360" y2="195" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="320" y="175" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">+IPD,</text>

  <!-- PARSE_IPD_HDR -> READ_IPD_BODY -->
  <line x1="600" y1="195" x2="680" y2="195" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="640" y="175" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Розділювач ":"</text>

  <!-- READ_IPD_BODY -> IDLE (Loop back on complete) -->
  <path d="M 800,130 L 800,90 L 160,90 L 160,130" fill="none" stroke="#2457d6" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <text x="480" y="78" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">byte_cnt == 0 (Кадр IPD прийнято повністю)</text>

  <!-- Self loop READ_IPD_BODY -->
  <path d="M 720,260 C 720,315 880,315 880,260" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="800" y="288" font-size="11" fill="#2457d6" text-anchor="middle">Байт даних (byte_cnt &gt; 0)</text>

  <!-- Переходи до нижнього ряду -->
  <!-- IDLE -> STATE_OK -->
  <path d="M 120,260 L 120,305 L 280,305 L 280,340" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="200" y="295" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Рядок "OK\r\n"</text>

  <!-- IDLE -> STATE_ERROR -->
  <path d="M 240,260 L 240,305 L 635,305 L 635,340" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="440" y="295" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Рядок "ERROR\r\n" / Таймаут</text>

  <!-- Повернення OK -> IDLE -->
  <path d="M 200,400 L 90,400 L 90,260" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>
  <text x="82" y="330" font-size="12" fill="#27ae60" text-anchor="end">Скидання FSM</text>

  <!-- Повернення ERROR -> IDLE -->
  <path d="M 635,460 L 635,498 L 60,498 L 60,260" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <text x="350" y="482" font-size="12" fill="#c0392b" text-anchor="middle">Повтор спроби / Очищення буфера</text>

  <!-- СТАН 1: STATE_IDLE -->
  <rect x="40" y="130" width="240" height="130" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <rect x="40" y="130" width="240" height="32" rx="8" fill="#d0d7de" fill-opacity="0.5"/>
  <text x="160" y="152" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">1. STATE_IDLE</text>
  <text x="52" y="182" font-size="12" fill="#1a1a1a">• Очікування кадру UART</text>
  <text x="52" y="202" font-size="12" fill="#6b7280">• Буферизація рядка (\r\n)</text>
  <text x="52" y="222" font-size="12" fill="#6b7280">• Пошук префікса +IPD / OK / ERR</text>

  <!-- СТАН 2: PARSE_IPD_HEADER -->
  <rect x="360" y="130" width="240" height="130" rx="8" fill="#eaf0fd" fill-opacity="0.3" stroke="#2457d6" stroke-width="2"/>
  <rect x="360" y="130" width="240" height="32" rx="8" fill="#eaf0fd"/>
  <text x="480" y="152" font-size="14" font-weight="700" fill="#2457d6" text-anchor="middle">2. PARSE_IPD_HDR</text>
  <text x="372" y="182" font-size="12" fill="#1a1a1a">• Накопичення ID та довжини</text>
  <text x="372" y="202" font-size="12" fill="#6b7280">• Парсинг чисельного len</text>
  <text x="372" y="222" font-size="12" fill="#2457d6" font-weight="700">• Встановлення byte_cnt = len</text>

  <!-- СТАН 3: READ_IPD_BODY -->
  <rect x="680" y="130" width="240" height="130" rx="8" fill="#eaf0fd" fill-opacity="0.3" stroke="#2457d6" stroke-width="2"/>
  <rect x="680" y="130" width="240" height="32" rx="8" fill="#eaf0fd"/>
  <text x="800" y="152" font-size="14" font-weight="700" fill="#2457d6" text-anchor="middle">3. READ_IPD_BODY</text>
  <text x="692" y="182" font-size="12" fill="#1a1a1a">• Запис прямо в rx_buf хоста</text>
  <text x="692" y="202" font-size="12" fill="#2457d6">• Декремент byte_cnt--</text>
  <text x="692" y="222" font-size="12" fill="#6b7280">• Оминає текстовий парсер</text>

  <!-- СТАН 4: RESPONSE_OK -->
  <rect x="200" y="340" width="250" height="120" rx="8" fill="#e9f7ef" fill-opacity="0.4" stroke="#27ae60" stroke-width="2"/>
  <rect x="200" y="340" width="250" height="32" rx="8" fill="#e9f7ef"/>
  <text x="325" y="362" font-size="14" font-weight="700" fill="#27ae60" text-anchor="middle">4. STATE_OK</text>
  <text x="212" y="392" font-size="12" fill="#1a1a1a">• Термінатор "OK\r\n" розпізнано</text>
  <text x="212" y="412" font-size="12" fill="#6b7280">• Скидання таймера AT-таймауту</text>
  <text x="212" y="432" font-size="12" fill="#27ae60" font-weight="700">• Подія success -&gt; FSM додатка</text>

  <!-- СТАН 5: RESPONSE_ERROR -->
  <rect x="510" y="340" width="250" height="120" rx="8" fill="#fdecea" fill-opacity="0.4" stroke="#c0392b" stroke-width="2"/>
  <rect x="510" y="340" width="250" height="32" rx="8" fill="#fdecea"/>
  <text x="635" y="362" font-size="14" font-weight="700" fill="#c0392b" text-anchor="middle">5. STATE_ERROR</text>
  <text x="522" y="392" font-size="12" fill="#1a1a1a">• Термінатор "ERROR" або таймаут</text>
  <text x="522" y="412" font-size="12" fill="#6b7280">• Фіксація коду помилки сокета</text>
  <text x="522" y="432" font-size="12" fill="#c0392b" font-weight="700">• Ініціалізація повтору / reset</text>
</svg>
