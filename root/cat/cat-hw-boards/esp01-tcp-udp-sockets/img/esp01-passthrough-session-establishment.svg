<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Полотно -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Встановлення сесії прозорого режиму (Passthrough) в ESP-01</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Перехід від AT-команд до прозорого TCP-каналу після AT+CIPMODE=1, AT+CIPSTART та запрошення «&gt;»</text>

  <!-- Вузли / Учасники -->
  <rect x="70" y="70" width="180" height="44" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="160" y="89" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Хост-МК</text>
  <text x="160" y="105" font-size="12" fill="#6b7280" text-anchor="middle">(UART Клієнт)</text>

  <rect x="390" y="70" width="180" height="44" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="89" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Модуль ESP-01</text>
  <text x="480" y="105" font-size="12" fill="#6b7280" text-anchor="middle">(AT / Passthrough)</text>

  <rect x="710" y="70" width="180" height="44" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="800" y="89" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">TCP-сервер</text>
  <text x="800" y="105" font-size="12" fill="#6b7280" text-anchor="middle">(IP:Port 8080)</text>

  <!-- Вертикальні лінії життя (Lifelines) -->
  <line x1="160" y1="114" x2="160" y2="485" stroke="#d0d7de" stroke-dasharray="4 4" stroke-width="1.5"/>
  <line x1="480" y1="114" x2="480" y2="485" stroke="#d0d7de" stroke-dasharray="4 4" stroke-width="1.5"/>
  <line x1="800" y1="114" x2="800" y2="485" stroke="#d0d7de" stroke-dasharray="4 4" stroke-width="1.5"/>

  <!-- ФАЗА 1: Командний режим AT -->
  <rect x="30" y="128" width="900" height="232" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="180" y="136" width="280" height="22" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="320" y="151" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">ФАЗА 1: НАЛАШТУВАННЯ ТА З'ЄДНАННЯ (AT-РЕЖИМ)</text>

  <!-- 1. AT+CIPMODE=1 -->
  <text x="320" y="171" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. AT+CIPMODE=1</text>
  <line x1="160" y1="178" x2="470" y2="178" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- OK (Passthrough) -->
  <text x="320" y="195" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">OK (режим Passthrough увімкнено)</text>
  <line x1="480" y1="202" x2="170" y2="202" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-green)"/>

  <!-- 2. AT+CIPSTART -->
  <text x="320" y="225" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. AT+CIPSTART="TCP","192.168.1.100",8080</text>
  <line x1="160" y1="232" x2="470" y2="232" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- TCP Handshake -->
  <text x="640" y="243" font-size="12" fill="#6b7280" text-anchor="middle">TCP 3-way Handshake (SYN / ACK)</text>
  <line x1="480" y1="248" x2="790" y2="248" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#arr-gray)"/>
  <line x1="800" y1="262" x2="490" y2="262" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 2" marker-end="url(#arr-gray)"/>

  <!-- CONNECT OK -->
  <text x="320" y="275" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">CONNECT OK (з'єднання встановлено)</text>
  <line x1="480" y1="282" x2="170" y2="282" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-green)"/>

  <!-- 3. AT+CIPSEND -->
  <text x="320" y="305" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3. AT+CIPSEND (запит прозорого потоку)</text>
  <line x1="160" y1="312" x2="470" y2="312" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Запрошення '>' -->
  <rect x="210" y="328" width="220" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="320" y="344" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">OK  &gt;  (Символ запрошення)</text>
  <line x1="480" y1="352" x2="170" y2="352" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- ФАЗА 2: Прозорий потік даних -->
  <rect x="30" y="370" width="900" height="115" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="180" y="378" width="280" height="22" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="320" y="393" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">ФАЗА 2: БЕЗПЕРЕРВНИЙ ПОТІК ДАНИХ</text>

  <!-- Потік від МК -->
  <text x="320" y="413" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Потік даних / Телеметрія (Raw Payload)</text>
  <line x1="160" y1="420" x2="470" y2="420" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <text x="640" y="413" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Пряме ретранслювання у TCP-сокет</text>
  <line x1="480" y1="420" x2="790" y2="420" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- Відповідь сервера -->
  <text x="640" y="448" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Відповідь сервера / Команди</text>
  <line x1="800" y1="455" x2="490" y2="455" stroke="#2457d6" stroke-width="2.5" stroke-dasharray="6 3" marker-end="url(#arr-blue)"/>

  <text x="320" y="448" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Прозоре виведення у UART Host МК</text>
  <line x1="480" y1="455" x2="170" y2="455" stroke="#2457d6" stroke-width="2.5" stroke-dasharray="6 3" marker-end="url(#arr-blue)"/>

  <!-- Вихід з прозорого режиму -->
  <rect x="30" y="495" width="900" height="42" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="521" font-size="12" fill="#1a1a1a" text-anchor="middle">Вихід з прозорого режиму: пауза ≥ 1 с → відправка «+++» (без CR/LF) → пауза ≥ 1 с → повернення в командний режим AT</text>
</svg>
