<svg viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Розподіл пам'яті DRAM та поріг OOM при рості TCP-з'єднань (AT+CIPMUX)</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Збільшення кількості сокетів та розміру вікна TCP вичерпує кучу Heap до порогу збою OOM</text>

  <!-- Left Panel: Memory Map -->
  <rect x="25" y="75" width="440" height="425" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="245" y="100" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Схема оперативної пам'яті DRAM (ESP8266)</text>

  <!-- Stack A: 1-2 Sockets -->
  <text x="140" y="126" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">1-2 сокети (AT+CIPMUX)</text>
  <text x="140" y="144" font-size="12" fill="#27ae60" text-anchor="middle">W_TCP = 1460 B (Норма)</text>

  <!-- Stack A Blocks -->
  <rect x="50" y="160" width="180" height="75" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="140" y="195" font-size="13" font-weight="700" fill="#27ae60" text-anchor="middle">Вільна куча Heap</text>
  <text x="140" y="218" font-size="12" fill="#27ae60" text-anchor="middle">~24 кБ (Безпечно)</text>

  <rect x="50" y="245" width="180" height="60" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="140" y="272" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">TCB 1 + Сокетний буфер</text>
  <text x="140" y="292" font-size="12" fill="#2457d6" text-anchor="middle">~6 кБ</text>

  <rect x="50" y="315" width="180" height="60" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="140" y="342" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">TCB 0 + Сокетний буфер</text>
  <text x="140" y="362" font-size="12" fill="#2457d6" text-anchor="middle">~6 кБ</text>

  <rect x="50" y="385" width="180" height="75" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="140" y="418" font-size="12" fill="#6b7280" text-anchor="middle">Система &amp; SDK DRAM</text>
  <text x="140" y="438" font-size="12" font-weight="700" fill="#6b7280" text-anchor="middle">~12 кБ</text>

  <!-- Stack B: 5 Sockets -->
  <text x="355" y="126" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">5 сокетів (AT+CIPMUX)</text>
  <text x="355" y="144" font-size="12" fill="#c0392b" text-anchor="middle">W_TCP = 2920 B (Загроза)</text>

  <!-- Stack B Blocks -->
  <rect x="265" y="160" width="180" height="35" rx="4" fill="#fdecea" stroke="#c0392b" stroke-dasharray="4,3" stroke-width="1.5"/>
  <text x="355" y="182" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Heap &lt; 2 кБ (OOM!)</text>

  <rect x="265" y="205" width="180" height="80" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="355" y="238" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">TCB 3..4 + W_TCP x2</text>
  <text x="355" y="258" font-size="12" fill="#c0392b" text-anchor="middle">~14 кБ (Переповнення)</text>

  <rect x="265" y="295" width="180" height="80" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="355" y="328" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">TCB 0..2 + Буфери</text>
  <text x="355" y="348" font-size="12" fill="#2457d6" text-anchor="middle">~18 кБ</text>

  <rect x="265" y="385" width="180" height="75" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="355" y="418" font-size="12" fill="#6b7280" text-anchor="middle">Система &amp; SDK DRAM</text>
  <text x="355" y="438" font-size="12" font-weight="700" fill="#6b7280" text-anchor="middle">~12 кБ</text>

  <!-- Right Panel: Heap Dynamics Chart -->
  <rect x="495" y="75" width="440" height="425" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="715" y="100" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Динаміка вільної кучі Heap при зміні навантаження</text>

  <!-- Y Axis Label -->
  <text x="545" y="128" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Heap (кБ)</text>

  <!-- Grid Lines (trimmed before callout box at x=735) -->
  <line x1="545" y1="150" x2="735" y2="150" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="535" y="154" font-size="12" fill="#6b7280" text-anchor="end">40</text>

  <line x1="545" y1="220" x2="735" y2="220" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="535" y="224" font-size="12" fill="#6b7280" text-anchor="end">30</text>

  <line x1="545" y1="290" x2="900" y2="290" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="535" y="294" font-size="12" fill="#6b7280" text-anchor="end">20</text>

  <line x1="545" y1="360" x2="900" y2="360" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="535" y="364" font-size="12" fill="#6b7280" text-anchor="end">10</text>

  <text x="535" y="434" font-size="12" fill="#6b7280" text-anchor="end">0</text>

  <!-- OOM Threshold Line -->
  <line x1="545" y1="402" x2="900" y2="402" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="555" y="394" font-size="12" font-weight="700" fill="#c0392b" text-anchor="start">Поріг OOM (4 кБ)</text>

  <!-- Axes -->
  <line x1="545" y1="430" x2="545" y2="138" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="545" y1="430" x2="915" y2="430" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="915" y="488" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">Час t / Сценарії</text>

  <!-- X Axis Stage Labels -->
  <text x="575" y="450" font-size="12" fill="#1a1a1a" text-anchor="middle">t₀: Старт</text>
  <text x="575" y="466" font-size="11" fill="#6b7280" text-anchor="middle">CIPMUX=1</text>

  <text x="650" y="450" font-size="12" fill="#1a1a1a" text-anchor="middle">t₁: 1 сокет</text>
  <text x="650" y="466" font-size="11" fill="#6b7280" text-anchor="middle">Link 0</text>

  <text x="725" y="450" font-size="12" fill="#1a1a1a" text-anchor="middle">t₂: 3 сокети</text>
  <text x="725" y="466" font-size="11" fill="#6b7280" text-anchor="middle">Link 0..2</text>

  <text x="800" y="450" font-size="12" fill="#1a1a1a" text-anchor="middle">t₃: W_TCP x2</text>
  <text x="800" y="466" font-size="11" fill="#6b7280" text-anchor="middle">Вікно 2920B</text>

  <text x="875" y="450" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">t₄: 5 сокетів</text>
  <text x="875" y="466" font-size="11" fill="#c0392b" text-anchor="middle">OOM Крах</text>

  <!-- Heap Dynamic Line -->
  <path d="M 575,178 L 650,234 L 725,318 L 800,388 L 875,419" fill="none" stroke="#2457d6" stroke-width="3"/>

  <!-- Data Points -->
  <circle cx="575" cy="178" r="5" fill="#2457d6"/>
  <text x="575" y="164" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">36 кБ</text>

  <circle cx="650" cy="234" r="5" fill="#2457d6"/>
  <text x="650" y="208" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">28 кБ</text>

  <circle cx="725" cy="318" r="5" fill="#2457d6"/>
  <text x="725" y="304" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">16 кБ</text>

  <circle cx="800" cy="388" r="5" fill="#2457d6"/>
  <text x="800" y="375" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">6 кБ</text>

  <circle cx="875" cy="419" r="6" fill="#c0392b" stroke="#ffffff" stroke-width="2"/>
  <text x="895" y="415" font-size="12" font-weight="700" fill="#c0392b" text-anchor="start">1.5 кБ</text>

  <!-- OOM Callout Box -->
  <rect x="745" y="145" width="180" height="85" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="835" y="168" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">ПОМИЛКА OOM (t₄)</text>
  <text x="835" y="188" font-size="12" fill="#1a1a1a" text-anchor="middle">Heap &lt; 4 кБ (Помилка пам'яті)</text>
  <text x="835" y="206" font-size="11" fill="#6b7280" text-anchor="middle">+LINK_CONN: ERROR</text>
  <text x="835" y="222" font-size="11" fill="#6b7280" text-anchor="middle">Відмова створення TCB</text>

  <!-- Dash line from callout box to data point t4 -->
  <line x1="835" y1="230" x2="870" y2="408" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
</svg>
