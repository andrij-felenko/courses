<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Підкладка полотна -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="28" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Двофазне відправлення даних у сокет через AT+CIPSEND</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Хост надсилає корисний вантаж лише після отримання символу-запрошення '&gt;' від ESP-01</text>

  <!-- Вертикальні лінії ліній життя (Lifelines) -->
  <line x1="160" y1="108" x2="160" y2="485" stroke="#d0d7de" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="480" y1="108" x2="480" y2="485" stroke="#d0d7de" stroke-width="2" stroke-dasharray="6,4"/>
  <line x1="800" y1="108" x2="800" y2="485" stroke="#d0d7de" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Заголовки ліній життя -->
  <rect x="65" y="70" width="190" height="36" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="160" y="93" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">Хост-мікроконтролер</text>

  <rect x="385" y="70" width="190" height="36" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="93" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">ESP-01 (AT-інтерфейс)</text>

  <rect x="705" y="70" width="190" height="36" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="800" y="93" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Мережевий сокет (TCP/UDP)</text>

  <!-- Фаза 1: Оголошення довжини -->
  <rect x="30" y="118" width="900" height="78" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="38" y="126" width="104" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="90" y="142" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">1. Оголошення</text>
  <line x1="160" y1="156" x2="480" y2="156" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="320" y="144" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">AT+CIPSEND=0,14\r\n</text>
  <text x="320" y="176" font-size="12" fill="#6b7280" text-anchor="middle">Запит на відправлення 14 байтів у сокет #0</text>

  <!-- Фаза 2: Запрошення '>' -->
  <rect x="30" y="210" width="900" height="78" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <rect x="38" y="218" width="104" height="24" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="90" y="234" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">2. Запрошення '&gt;'</text>
  <line x1="480" y1="248" x2="160" y2="248" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr-red)"/>
  <text x="320" y="236" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle">\r\nOK\r\n\r\n&gt; </text>
  <text x="320" y="268" font-size="12" fill="#c0392b" text-anchor="middle">Очікування '&gt;' від ESP-01 (буфер готовий до прийому даних)</text>

  <!-- Фаза 3: Передавання даних (Payload) -->
  <rect x="30" y="302" width="900" height="78" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <rect x="38" y="310" width="104" height="24" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="90" y="326" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">3. Payload</text>
  <line x1="160" y1="340" x2="480" y2="340" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="320" y="328" font-size="13" font-weight="700" fill="#27ae60" text-anchor="middle">"Hello, World!\n" (14 байтів)</text>
  <text x="320" y="360" font-size="12" fill="#27ae60" text-anchor="middle">Сирі байти без символів ВК/ПС чи AT-команд</text>

  <!-- Фаза 4: Підтвердження -->
  <rect x="30" y="394" width="900" height="82" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="38" y="402" width="104" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="90" y="418" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">4. Результат</text>

  <line x1="480" y1="422" x2="800" y2="422" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="640" y="412" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">TCP/UDP Сегмент</text>
  <text x="640" y="436" font-size="12" fill="#6b7280" text-anchor="middle">Відправка у Wi-Fi мережу</text>

  <line x1="480" y1="454" x2="160" y2="454" stroke="#27ae60" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arr-green)"/>
  <text x="320" y="444" font-size="13" font-weight="700" fill="#27ae60" text-anchor="middle">Recv 14 bytes\r\n\r\nSEND OK\r\n</text>
  <text x="320" y="468" font-size="12" fill="#6b7280" text-anchor="middle">Підтвердження відправлення (SEND OK)</text>

  <!-- Нижні блоки ліній життя -->
  <rect x="65" y="490" width="190" height="30" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="160" y="510" font-size="12" fill="#2457d6" text-anchor="middle">Host MCU</text>

  <rect x="385" y="490" width="190" height="30" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="510" font-size="12" fill="#1a1a1a" text-anchor="middle">ESP-01</text>

  <rect x="705" y="490" width="190" height="30" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="800" y="510" font-size="12" fill="#1a1a1a" text-anchor="middle">TCP/UDP Server</text>
</svg>
