<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема живлення та узгодження рівнів 3.3 В / 5 В для модуля ESP-01</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Фільтрація пікових кидків струму Wi-Fi передавача та безпечне спряження сигнальних ліній UART</text>

  <!-- Left Panel: Power Supply & Filtering -->
  <rect x="30" y="85" width="430" height="410" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="245" y="110" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Джерело живлення 3.3 В та фільтрація</text>

  <!-- Power Bus (+3.3V) -->
  <text x="45" y="130" font-size="12" font-weight="bold" fill="#2457d6">+3.3V (VCC)</text>
  <line x1="45" y1="138" x2="440" y2="138" stroke="#2457d6" stroke-width="2"/>

  <!-- Ground Bus (GND) -->
  <line x1="45" y1="320" x2="440" y2="320" stroke="#1a1a1a" stroke-width="2"/>
  <text x="45" y="340" font-size="12" font-weight="bold" fill="#1a1a1a">GND (0V)</text>

  <!-- Capacitor C1 (100 uF Electrolytic) -->
  <line x1="110" y1="138" x2="110" y2="198" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="98" y="193" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">+</text>
  <line x1="96" y1="198" x2="124" y2="198" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 96 208 Q 110 213 124 208" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="110" y1="211" x2="110" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="135" y="200" font-size="12" font-weight="bold" fill="#1a1a1a">C1 (100 µF)</text>
  <text x="135" y="216" font-size="11" fill="#6b7280">Електроліт 6.3V</text>

  <!-- Capacitor C2 (0.1 uF Ceramic) -->
  <line x1="240" y1="138" x2="240" y2="198" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="226" y1="198" x2="254" y2="198" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="226" y1="206" x2="254" y2="206" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="240" y1="206" x2="240" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="265" y="200" font-size="12" font-weight="bold" fill="#1a1a1a">C2 (0.1 µF)</text>
  <text x="265" y="216" font-size="11" fill="#6b7280">Кераміка 100 нФ</text>

  <!-- Resistor R_CHPD (10k Pull-up) -->
  <line x1="375" y1="138" x2="375" y2="165" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="363" y="165" width="24" height="40" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="355" y="190" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="end">10 kΩ</text>
  <line x1="375" y1="205" x2="375" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="375" cy="240" r="4" fill="#27ae60"/>
  <text x="375" y="260" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">CH_PD (EN)</text>

  <!-- Power Summary Box -->
  <rect x="45" y="360" width="400" height="120" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="60" y="380" font-size="12" font-weight="bold" fill="#2457d6">Особливості схеми живлення:</text>
  <text x="60" y="400" font-size="11" fill="#1a1a1a">• C1 (100 µF): Поглинає імпульси струму 300 мА Wi-Fi</text>
  <text x="60" y="420" font-size="11" fill="#1a1a1a">• C2 (0.1 µF): Пригнічує високочастотні завади VCC</text>
  <text x="60" y="440" font-size="11" fill="#1a1a1a">• CH_PD / RST: Утримують стабільний рівень 3.3 В</text>
  <text x="60" y="460" font-size="11" fill="#6b7280">• Стабілізатор: Вимагає LDO 3.3В струмом ≥ 500 мА</text>

  <!-- Right Panel: UART Level Shifter Circuit -->
  <rect x="485" y="85" width="445" height="410" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="707" y="110" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">2. Узгодження сигнальних ліній UART (3.3В ⇄ 5В)</text>

  <!-- Circuit 2A: 5V MCU TX -> 3.3V ESP-01 RX (Divider) -->
  <text x="505" y="140" font-size="12" font-weight="bold" fill="#c0392b">5V MCU TX</text>
  <line x1="575" y1="136" x2="610" y2="136" stroke="#c0392b" stroke-width="2"/>

  <!-- Resistor R1 (1.8k) -->
  <rect x="610" y="124" width="50" height="24" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="635" y="140" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1.8 kΩ</text>

  <line x1="660" y1="136" x2="720" y2="136" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="720" cy="136" r="3" fill="#2457d6"/>

  <!-- Line to ESP-01 RXD0 -->
  <line x1="720" y1="136" x2="815" y2="136" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="825" y="140" font-size="12" font-weight="bold" fill="#2457d6">ESP-01 RXD0</text>

  <!-- Resistor R2 (3.3k to GND) -->
  <line x1="720" y1="136" x2="720" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="708" y="160" width="24" height="40" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="740" y="184" font-size="11" font-weight="bold" fill="#1a1a1a">R2 = 3.3 kΩ</text>
  <line x1="720" y1="200" x2="720" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- GND Symbol right panel -->
  <line x1="705" y1="220" x2="735" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="710" y1="225" x2="730" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="715" y1="230" x2="725" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="740" y="224" font-size="11" fill="#6b7280">GND (0 В)</text>

  <!-- Voltage Formula Box -->
  <rect x="500" y="250" width="415" height="32" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="707" y="270" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">V_out = 5 V × 3.3 kΩ / (1.8 kΩ + 3.3 kΩ) = 3.23 В (Безпечно для ESP-01)</text>

  <!-- Circuit 2B: 3.3V ESP-01 TX -> 5V MCU RX (Direct) -->
  <text x="505" y="315" font-size="12" font-weight="bold" fill="#27ae60">ESP-01 TXD0 (3.3V)</text>
  <line x1="640" y1="311" x2="815" y2="311" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="825" y="315" font-size="12" font-weight="bold" fill="#1a1a1a">5V MCU RX</text>

  <!-- Level Shifter Summary Box -->
  <rect x="500" y="360" width="415" height="120" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="515" y="380" font-size="12" font-weight="bold" fill="#2457d6">Принцип роботи узгоджувача:</text>
  <text x="515" y="400" font-size="11" fill="#1a1a1a">• Дільник R1/R2 знижує 5 В імпульси MCU TX до безпечних 3.23 В</text>
  <text x="515" y="420" font-size="11" fill="#1a1a1a">• Сигнал 3.3 В з ESP-01 TX безпосередньо сприймається MCU</text>
  <text x="515" y="440" font-size="11" fill="#6b7280">  як високий рівень (V_IH &gt; 3.0 V)</text>
  <text x="515" y="460" font-size="11" font-weight="bold" fill="#27ae60">• Захищає вхідний порт ESP-01 від пробою напругою 5 В</text>
</svg>
