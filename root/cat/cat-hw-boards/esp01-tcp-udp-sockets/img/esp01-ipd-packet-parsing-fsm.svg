<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-success" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-error" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>

  <!-- Title & Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Скінченний автомат (FSM) обробки асинхронного префікса +IPD</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Послідовність станів парсера: від виявлення префікса до зчитування корисного навантаження</text>

  <!-- UART Protocol Frame Format Bar -->
  <rect x="40" y="75" width="880" height="40" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="55" y="100" font-size="12" font-weight="bold" fill="#6b7280">Формат UART:</text>

  <rect x="145" y="83" width="90" height="24" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="190" y="99" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">+IPD,</text>

  <rect x="245" y="83" width="110" height="24" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="300" y="99" font-size="12" fill="#1a1a1a" text-anchor="middle">&lt;link_id&gt;,</text>

  <rect x="365" y="83" width="90" height="24" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="410" y="99" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">&lt;len&gt;:</text>

  <rect x="465" y="83" width="220" height="24" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="575" y="99" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">&lt;binary_data_payload&gt;</text>

  <text x="700" y="99" font-size="12" fill="#6b7280">(байтовий потік з сокета)</text>

  <!-- FSM States (Main Horizontal Row) -->

  <!-- State 1: SEARCH_PREFIX -->
  <rect x="40" y="140" width="170" height="130" fill="#f4f6f8" stroke="#2457d6" stroke-width="2" rx="8"/>
  <rect x="50" y="150" width="150" height="24" fill="#eaf0fd" rx="4"/>
  <text x="125" y="166" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">1. SEARCH_PREFIX</text>
  <text x="52" y="193" font-size="12" font-weight="bold" fill="#1a1a1a">Очікування '+IPD,'</text>
  <text x="52" y="213" font-size="12" fill="#6b7280">Посимвольний аналіз</text>
  <text x="52" y="233" font-size="12" fill="#6b7280">буфера UART RX</text>
  <text x="52" y="255" font-size="12" font-weight="bold" fill="#2457d6">[ Стан: IDLE ]</text>

  <!-- Transition 1 -> 2 -->
  <line x1="210" y1="205" x2="260" y2="205" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-main)"/>
  <text x="235" y="194" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">'+IPD,'</text>

  <!-- State 2: PARSE_HEADER -->
  <rect x="260" y="140" width="170" height="130" fill="#f4f6f8" stroke="#2457d6" stroke-width="2" rx="8"/>
  <rect x="270" y="150" width="150" height="24" fill="#eaf0fd" rx="4"/>
  <text x="345" y="166" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">2. PARSE_HEADER</text>
  <text x="272" y="193" font-size="12" font-weight="bold" fill="#1a1a1a">Зчитування LEN</text>
  <text x="272" y="213" font-size="12" fill="#6b7280">Парсинг link_id та len</text>
  <text x="272" y="233" font-size="12" fill="#6b7280">накопичення до ':'</text>
  <text x="272" y="255" font-size="12" font-weight="bold" fill="#2457d6">[ Парсинг довжини ]</text>

  <!-- Transition 2 -> 3 -->
  <line x1="430" y1="205" x2="480" y2="205" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-main)"/>
  <text x="455" y="194" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">':' (len)</text>

  <!-- State 3: READ_PAYLOAD -->
  <rect x="480" y="140" width="170" height="130" fill="#f4f6f8" stroke="#2457d6" stroke-width="2" rx="8"/>
  <rect x="490" y="150" width="150" height="24" fill="#eaf0fd" rx="4"/>
  <text x="565" y="166" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">3. READ_PAYLOAD</text>
  <text x="492" y="193" font-size="12" font-weight="bold" fill="#1a1a1a">Прямий збір даних</text>
  <text x="492" y="213" font-size="12" fill="#6b7280">Зчитано rx_bytes</text>
  <text x="492" y="233" font-size="12" fill="#6b7280">до досягнення len</text>
  <text x="492" y="255" font-size="12" font-weight="bold" fill="#2457d6">[ Прийом пакета ]</text>

  <!-- Transition 3 -> 4 -->
  <line x1="650" y1="205" x2="700" y2="205" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-success)"/>
  <text x="675" y="194" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">rx == len</text>

  <!-- State 4: PROCESS_PKT -->
  <rect x="700" y="140" width="170" height="130" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="8"/>
  <rect x="710" y="150" width="150" height="24" fill="#ffffff" rx="4"/>
  <text x="785" y="166" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">4. PROCESS_PKT</text>
  <text x="712" y="193" font-size="12" font-weight="bold" fill="#1a1a1a">Кадр сформовано</text>
  <text x="712" y="213" font-size="12" fill="#6b7280">Передача в callback</text>
  <text x="712" y="233" font-size="12" fill="#6b7280">обробника мережі</text>
  <text x="712" y="255" font-size="12" font-weight="bold" fill="#27ae60">[ ПАКЕТ ГОТОВИЙ ]</text>

  <!-- Loopback Transition 4 -> 1 (Success Return Path) -->
  <path d="M 870,205 L 910,205 L 910,285 L 140,285 L 140,270" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr-success)"/>
  <text x="770" y="278" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Успішна обробка -&gt; IDLE</text>

  <!-- State 5: ERROR_RESET / TIMEOUT -->
  <rect x="310" y="330" width="340" height="90" fill="#fdecea" stroke="#c0392b" stroke-width="2" rx="8"/>
  <rect x="320" y="338" width="320" height="22" fill="#ffffff" rx="4"/>
  <text x="480" y="354" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">5. ERROR_RESET / TIMEOUT</text>
  <text x="325" y="378" font-size="12" font-weight="bold" fill="#1a1a1a">Скидання буфера та відновлення FSM</text>
  <text x="325" y="398" font-size="12" fill="#6b7280">Причини: LEN &gt; MAX_BUF, нечисловий ID, UART timeout</text>

  <!-- Error Transitions to State 5 -->
  <!-- From State 2 -->
  <path d="M 320,270 L 350,330" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-error)"/>
  <text x="305" y="312" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">Синтаксична помилка</text>

  <!-- From State 3 -->
  <path d="M 610,270 L 610,330" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-error)"/>
  <text x="622" y="312" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">Таймаут / Overflow</text>

  <!-- Error Recovery Transition 5 -> 1 -->
  <path d="M 310,380 L 105,380 L 105,270" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr-error)"/>
  <text x="205" y="372" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Очищення буфера</text>

  <!-- Bottom Informational Panel -->
  <rect x="40" y="440" width="880" height="60" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="55" y="460" font-size="12" font-weight="bold" fill="#1a1a1a">Захисні механізми FSM при роботі з сокетами ESP-AT:</text>
  <text x="55" y="482" font-size="12" fill="#2457d6">• Static RX Buffer:<tspan fill="#6b7280"> Запобігає фрагментації DRAM (без malloc/free)</tspan></text>
  <text x="460" y="482" font-size="12" fill="#2457d6">• Byte Timeout:<tspan fill="#6b7280"> Автоматичний скид при зависанні UART (&gt;50 ms)</tspan></text>
</svg>
