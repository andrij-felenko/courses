<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>

  <!-- Header -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Послідовність AT-команд ініціалізації мульти-сокетного сервера</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Етапи конфігурування мережі, відкриття TCP-сервера та обміну даними з підключеним клієнтом</text>

  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Participant Lifeline Boxes -->
  <!-- 1. Host MCU -->
  <rect x="105" y="72" width="150" height="38" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="180" y="89" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Управляючий МК</text>
  <text x="180" y="103" text-anchor="middle" font-size="11" fill="#6b7280">Host MCU</text>

  <!-- 2. ESP-01 Module -->
  <rect x="400" y="72" width="160" height="38" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="480" y="89" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Модуль ESP-01</text>
  <text x="480" y="103" text-anchor="middle" font-size="11" fill="#6b7280">AT-прошивка</text>

  <!-- 3. Remote TCP Client -->
  <rect x="705" y="72" width="150" height="38" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="780" y="89" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">TCP-Клієнт</text>
  <text x="780" y="103" text-anchor="middle" font-size="11" fill="#6b7280">ПК / Браузер</text>

  <!-- Vertical Lifelines -->
  <line x1="180" y1="110" x2="180" y2="525" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="480" y1="110" x2="480" y2="525" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="780" y1="110" x2="780" y2="525" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Step Badges (Left Column) -->
  <rect x="25" y="132" width="70" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="60" y="150" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Крок 1</text>

  <rect x="25" y="187" width="70" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="60" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Крок 2</text>

  <rect x="25" y="247" width="70" height="28" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="60" y="265" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Крок 3</text>

  <rect x="25" y="307" width="70" height="28" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="60" y="325" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Крок 4</text>

  <rect x="25" y="385" width="70" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="60" y="403" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Крок 5</text>
  <text x="60" y="418" text-anchor="middle" font-size="11" fill="#6b7280">Передача</text>

  <rect x="25" y="477" width="70" height="28" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="60" y="495" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Крок 6</text>

  <!-- Step 1: MUX Mode -->
  <text x="330" y="133" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">AT+CIPMUX=1</text>
  <line x1="180" y1="140" x2="480" y2="140" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <text x="330" y="153" text-anchor="middle" font-size="11" fill="#27ae60">OK</text>
  <line x1="480" y1="160" x2="180" y2="160" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>

  <!-- Step 2: Start TCP Server -->
  <text x="330" y="188" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">AT+CIPSERVER=1,80</text>
  <line x1="180" y1="195" x2="480" y2="195" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <text x="330" y="208" text-anchor="middle" font-size="11" fill="#27ae60">OK (Сервер запущено)</text>
  <line x1="480" y1="215" x2="180" y2="215" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>

  <!-- Step 3: Client Connects -->
  <text x="630" y="248" text-anchor="middle" font-size="12" fill="#2457d6">TCP SYN (Порт 80)</text>
  <line x1="780" y1="255" x2="480" y2="255" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <text x="330" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">0,CONNECT</text>
  <line x1="480" y1="275" x2="180" y2="275" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arr-green)"/>

  <!-- Step 4: Receive Data -->
  <text x="630" y="308" text-anchor="middle" font-size="12" fill="#2457d6">HTTP GET /</text>
  <line x1="780" y1="315" x2="480" y2="315" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <text x="330" y="328" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">+IPD,0,18:GET / HTTP/1.1</text>
  <line x1="480" y1="335" x2="180" y2="335" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr-gray)"/>

  <!-- Step 5: Send Data -->
  <text x="330" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">AT+CIPSEND=0,24</text>
  <line x1="180" y1="375" x2="480" y2="375" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <text x="330" y="388" text-anchor="middle" font-size="11" fill="#27ae60">> (Запрошення даних)</text>
  <line x1="480" y1="395" x2="180" y2="395" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>

  <text x="330" y="413" text-anchor="middle" font-size="11" fill="#2457d6">&lt;24 байти даних веб-сторінки&gt;</text>
  <line x1="180" y1="420" x2="480" y2="420" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <text x="630" y="428" text-anchor="middle" font-size="11" fill="#27ae60">HTTP 200 OK</text>
  <line x1="480" y1="435" x2="780" y2="435" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arr-green)"/>

  <text x="330" y="446" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">SEND OK</text>
  <line x1="480" y1="452" x2="180" y2="452" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>

  <!-- Step 6: Close Socket -->
  <text x="330" y="478" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">AT+CIPCLOSE=0</text>
  <line x1="180" y1="485" x2="480" y2="485" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arr-red)"/>

  <text x="330" y="498" text-anchor="middle" font-size="11" fill="#6b7280">0,CLOSED / OK</text>
  <line x1="480" y1="505" x2="180" y2="505" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>
</svg>
