<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Еволюція сокетного стека ESP-AT для мікроконтролера ESP8266</text>
  <text x="480" y="53" text-anchor="middle" font-size="13" fill="#6b7280">Від застарілих статичних буферів AT v0.9 до апаратного контролю RTS/CTS, режиму passthrough та динамічного LwIP</text>

  <!-- Головна панель діаграми -->
  <rect x="30" y="75" width="900" height="385" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="50" y="100" font-size="13" font-weight="bold" fill="#1a1a1a">Хронологічні етапи розвитку стеків AT-команд та обробки TCP/UDP сокетів</text>

  <!-- КАРТКА 1: v0.9 (2014) - Проблема -->
  <rect x="50" y="120" width="200" height="320" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="60" y="132" width="180" height="26" rx="4" fill="#c0392b"/>
  <text x="150" y="149" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">v0.9 (2014): Початковий стек</text>

  <text x="65" y="185" font-size="12" font-weight="bold" fill="#c0392b">Статичні LwIP буфери</text>
  <text x="65" y="205" font-size="11" fill="#1a1a1a">Виділення при компіляції</text>

  <text x="65" y="240" font-size="12" font-weight="bold" fill="#c0392b">Без контролю RTS/CTS</text>
  <text x="65" y="260" font-size="11" fill="#1a1a1a">Переповнення буферів UART</text>

  <text x="65" y="295" font-size="12" font-weight="bold" fill="#c0392b">Зависання WDT</text>
  <text x="65" y="315" font-size="11" fill="#1a1a1a">Спеціальні таймери скидали MCU</text>

  <rect x="65" y="398" width="170" height="24" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="150" y="414" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Низька надійність</text>


  <!-- Стрілка 1 -> 2 -->
  <line x1="250" y1="280" x2="270" y2="280" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>


  <!-- КАРТКА 2: v0.20–v1.3 (2015) -->
  <rect x="270" y="120" width="200" height="320" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="280" y="132" width="180" height="26" rx="4" fill="#2457d6"/>
  <text x="370" y="149" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">v0.20–v1.3 (2015)</text>

  <text x="285" y="185" font-size="12" font-weight="bold" fill="#2457d6">Контроль потоку RTS/CTS</text>
  <text x="285" y="205" font-size="11" fill="#1a1a1a">Апаратне призупинення даних</text>

  <text x="285" y="240" font-size="12" font-weight="bold" fill="#2457d6">Режим Passthrough</text>
  <text x="285" y="260" font-size="11" fill="#1a1a1a">Прозора передача даних</text>

  <text x="285" y="295" font-size="12" font-weight="bold" fill="#2457d6">Сокети CIPMUX=1</text>
  <text x="285" y="315" font-size="11" fill="#1a1a1a">До 5 паралельних з'єднань</text>

  <rect x="285" y="398" width="170" height="24" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="370" y="414" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Апаратний контроль</text>


  <!-- Стрілка 2 -> 3 -->
  <line x1="470" y1="280" x2="490" y2="280" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>


  <!-- КАРТКА 3: v1.5–v2.2 (2016–2018) -->
  <rect x="490" y="120" width="200" height="320" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="500" y="132" width="180" height="26" rx="4" fill="#2457d6"/>
  <text x="590" y="149" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">v1.5–v2.2 (2016–2018)</text>

  <text x="505" y="185" font-size="12" font-weight="bold" fill="#2457d6">Динамічні pbuf буфери</text>
  <text x="505" y="205" font-size="11" fill="#1a1a1a">Виділення з кучі DRAM</text>

  <text x="505" y="240" font-size="12" font-weight="bold" fill="#2457d6">Підтримка SSL / TLS</text>
  <text x="505" y="260" font-size="11" fill="#1a1a1a">Захищене сокетне з'єднання</text>

  <text x="505" y="295" font-size="12" font-weight="bold" fill="#2457d6">Стабільність WDT</text>
  <text x="505" y="315" font-size="11" fill="#1a1a1a">Оптимізація фонових задач</text>

  <rect x="505" y="398" width="170" height="24" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="590" y="414" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Динамічна пам'ять</text>


  <!-- Стрілка 3 -> 4 -->
  <line x1="690" y1="280" x2="710" y2="280" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>


  <!-- КАРТКА 4: ESP-IDF AT (2019+) - Розв'язок -->
  <rect x="710" y="120" width="200" height="320" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="720" y="132" width="180" height="26" rx="4" fill="#27ae60"/>
  <text x="810" y="149" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">ESP-IDF AT (2019+)</text>

  <text x="725" y="185" font-size="12" font-weight="bold" fill="#27ae60">FreeRTOS &amp; LwIP v2.x</text>
  <text x="725" y="205" font-size="11" fill="#1a1a1a">Багатозадачна обробка</text>

  <text x="725" y="240" font-size="12" font-weight="bold" fill="#27ae60">Повнодуплексна передача</text>
  <text x="725" y="260" font-size="11" fill="#1a1a1a">Швидкість понад 1.5 Мбіт/с</text>

  <text x="725" y="295" font-size="12" font-weight="bold" fill="#27ae60">Асинхронні сокети</text>
  <text x="725" y="315" font-size="11" fill="#1a1a1a">Гнучке керування ресурсами</text>

  <rect x="725" y="398" width="170" height="24" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="810" y="414" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Сучасний стандарт</text>
</svg>
