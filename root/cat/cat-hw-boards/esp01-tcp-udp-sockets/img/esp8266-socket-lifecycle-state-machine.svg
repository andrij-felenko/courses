<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Автомат станів життєвого циклу сокета в AT-прошивці ESP8266</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Переходи між станами FSM, кадрування даних +IPD та обробка асинхронних подій CLOSED і BUSY</text>

  <!-- Node 1: IDLE -->
  <rect x="70" y="85" width="180" height="65" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="160" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">1. IDLE</text>
  <text x="160" y="134" text-anchor="middle" font-size="12" fill="#6b7280">Сокет закритий (ID 0–4)</text>

  <!-- Node 2: CONNECTING -->
  <rect x="390" y="85" width="180" height="65" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="480" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">2. CONNECTING</text>
  <text x="480" y="134" text-anchor="middle" font-size="12" fill="#1a1a1a">Створення TCP/UDP</text>

  <!-- Node 3: CONNECTED -->
  <rect x="710" y="85" width="180" height="65" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="800" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">3. CONNECTED</text>
  <text x="800" y="134" text-anchor="middle" font-size="12" fill="#1a1a1a">Сокет активний (Ready)</text>

  <!-- Node 4: SENDING DATA -->
  <rect x="710" y="240" width="180" height="65" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="800" y="267" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">4. SENDING DATA</text>
  <text x="800" y="289" text-anchor="middle" font-size="12" fill="#1a1a1a">Запит AT+CIPSEND</text>

  <!-- Node 5: RECEIVING (+IPD) -->
  <rect x="390" y="240" width="180" height="65" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="480" y="267" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">5. RECEIVING (+IPD)</text>
  <text x="480" y="289" text-anchor="middle" font-size="12" fill="#1a1a1a">Парсинг +IPD,&lt;len&gt;:</text>

  <!-- Node 6: CLOSING -->
  <rect x="70" y="240" width="180" height="65" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="160" y="267" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">6. CLOSING</text>
  <text x="160" y="289" text-anchor="middle" font-size="12" fill="#1a1a1a">Запит AT+CIPCLOSE</text>

  <!-- Transitions -->
  <!-- T1: IDLE -> CONNECTING -->
  <path d="M 250,117.5 L 380,117.5" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-main)"/>
  <text x="320" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">AT+CIPSTART</text>

  <!-- T2: CONNECTING -> CONNECTED -->
  <path d="M 570,117.5 L 700,117.5" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="640" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">CONNECT / OK</text>

  <!-- T3: CONNECTED -> SENDING -->
  <path d="M 830,150 L 830,230" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-main)"/>
  <text x="842" y="195" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">AT+CIPSEND</text>

  <!-- T4: SENDING -> CONNECTED -->
  <path d="M 770,240 L 770,160" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="758" y="195" text-anchor="end" font-size="12" fill="#27ae60">SEND OK / ERROR</text>

  <!-- T5: CONNECTED -> RECEIVING -->
  <path d="M 715,150 L 715,175 L 530,175 L 530,230" stroke="#27ae60" stroke-width="2" stroke-dasharray="4" fill="none" marker-end="url(#arr-green)"/>
  <text x="622" y="167" text-anchor="middle" font-size="12" fill="#27ae60">Кадр +IPD</text>

  <!-- T7: CONNECTED -> CLOSING -->
  <path d="M 710,135 L 590,135 L 590,190 L 210,190 L 210,230" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arr-red)"/>
  <text x="350" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">AT+CIPCLOSE / Розрив</text>

  <!-- T6: RECEIVING -> CONNECTED -->
  <path d="M 470,240 L 470,205 L 675,205 L 675,160" stroke="#6b7280" stroke-width="2" fill="none" marker-end="url(#arr-gray)"/>
  <text x="572" y="220" text-anchor="middle" font-size="12" fill="#6b7280">Буфер зчитано</text>

  <!-- T8: CLOSING -> IDLE -->
  <path d="M 160,240 L 160,160" stroke="#6b7280" stroke-width="2" marker-end="url(#arr-gray)"/>
  <text x="148" y="195" text-anchor="end" font-size="12" fill="#6b7280">Очищення PCB</text>

  <!-- Asynchronous Events Panel -->
  <rect x="50" y="340" width="860" height="175" rx="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="480" y="365" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Перехоплення асинхронних системних подій (Async Events)</text>

  <!-- Event Box 1: CLOSED -->
  <rect x="70" y="385" width="390" height="115" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="85" y="407" text-anchor="start" font-size="13" font-weight="bold" fill="#c0392b">Подія: CLOSED або &lt;link_id&gt;,CLOSED</text>
  <text x="85" y="430" text-anchor="start" font-size="12" fill="#1a1a1a">• Асинхронний розрив сесії сервером чи мережею</text>
  <text x="85" y="452" text-anchor="start" font-size="12" fill="#6b7280">• Дія FSM: Негайне переведення сокета в стан IDLE</text>
  <text x="85" y="474" text-anchor="start" font-size="12" fill="#6b7280">• Звільнення ресурсів lwIP PCB у пам'яті</text>

  <!-- Event Box 2: BUSY -->
  <rect x="500" y="385" width="390" height="115" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="515" y="407" text-anchor="start" font-size="13" font-weight="bold" fill="#c0392b">Подія: BUSY s... або BUSY p...</text>
  <text x="515" y="430" text-anchor="start" font-size="12" fill="#1a1a1a">• Модем або буфер передачі зараз зайнятий</text>
  <text x="515" y="452" text-anchor="start" font-size="12" fill="#6b7280">• Дія FSM: Таймаут-пауза (yield) та повтор запиту (retry)</text>
  <text x="515" y="474" text-anchor="start" font-size="12" fill="#6b7280">• Запобігання розсинхронізації шини UART</text>
</svg>
