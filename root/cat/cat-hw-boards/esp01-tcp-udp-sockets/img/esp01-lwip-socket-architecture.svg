<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Архітектура сокетного зв'язку ESP-01 та розподіл DRAM</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Взаємодія хост-контролера, AT-інтерпретатора, стека LwIP та блоків PCB у кучі Heap</text>

  <!-- Left Column: Host Microcontroller -->
  <rect x="25" y="80" width="190" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="120" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Хост-мікроконтролер</text>
  <text x="120" y="123" font-size="12" fill="#6b7280" text-anchor="middle">(MCU / UART Master)</text>

  <rect x="40" y="145" width="160" height="85" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="120" y="170" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">AT-команди &amp; Дані</text>
  <text x="120" y="190" font-size="12" fill="#1a1a1a" text-anchor="middle">AT+CIPSEND / CIPMODE</text>
  <text x="120" y="210" font-size="11" fill="#6b7280" text-anchor="middle">Командний потік TXD</text>

  <rect x="40" y="250" width="160" height="160" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="120" y="275" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Асинхронний парсер</text>
  <text x="120" y="298" font-size="12" fill="#1a1a1a" text-anchor="middle">Двофазний розбір:</text>
  <text x="120" y="320" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">+IPD,&lt;link_id&gt;,&lt;len&gt;:...</text>
  <text x="120" y="342" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Passthrough (+++)</text>
  <text x="120" y="365" font-size="11" fill="#6b7280" text-anchor="middle">Захисний таймаут 1000мс</text>
  <text x="120" y="385" font-size="11" fill="#6b7280" text-anchor="middle">Буфер кадру в RAM MCU</text>

  <!-- UART Lines / Connecting Arrows -->
  <line x1="200" y1="185" x2="305" y2="185" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="253" y="175" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">TXD → RXD</text>
  <text x="253" y="202" font-size="11" fill="#6b7280" text-anchor="middle">115200 baud</text>

  <line x1="305" y1="330" x2="200" y2="330" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="253" y="320" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">RXD ← TXD</text>
  <text x="253" y="348" font-size="11" fill="#6b7280" text-anchor="middle">+IPD / Passthrough</text>

  <!-- Right Big Container: ESP-01 Module -->
  <rect x="295" y="80" width="640" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="615" y="105" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Модуль ESP-01 (Платформа ESP8266 + LwIP Stack)</text>

  <!-- Sub-panel 1: AT Interpreter -->
  <rect x="310" y="130" width="180" height="285" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="400" y="153" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">AT-Інтерпретатор</text>
  <text x="400" y="170" font-size="11" fill="#6b7280" text-anchor="middle">ESP-AT Firmware</text>

  <rect x="325" y="185" width="150" height="60" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="400" y="208" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Кільцевий UART FIFO</text>
  <text x="400" y="228" font-size="11" fill="#6b7280" text-anchor="middle">Буфер 256–1024 байтів</text>

  <rect x="325" y="255" width="150" height="145" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="400" y="278" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Перемикач режимів</text>
  <text x="400" y="300" font-size="11" fill="#1a1a1a" text-anchor="middle">1. CIPMODE=0 (Normal)</text>
  <text x="400" y="318" font-size="11" fill="#2457d6" text-anchor="middle">+IPD префікси у TXD</text>
  <text x="400" y="340" font-size="11" fill="#1a1a1a" text-anchor="middle">2. CIPMODE=1 (Pass)</text>
  <text x="400" y="358" font-size="11" fill="#27ae60" text-anchor="middle">Пряме тунелювання</text>
  <text x="400" y="380" font-size="11" fill="#6b7280" text-anchor="middle">Guard time 1000мс +++</text>

  <!-- Arrow from AT to LwIP -->
  <line x1="490" y1="215" x2="510" y2="215" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="490" y1="315" x2="510" y2="315" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Sub-panel 2: LwIP Stack -->
  <rect x="515" y="130" width="190" height="285" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="610" y="153" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мережевий стек LwIP</text>
  <text x="610" y="170" font-size="11" fill="#6b7280" text-anchor="middle">LwIP v1.4 / v2.x Core</text>

  <rect x="530" y="185" width="160" height="65" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="610" y="208" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">TCP / UDP Сокети</text>
  <text x="610" y="226" font-size="11" fill="#6b7280" text-anchor="middle">Вікно W_rx / W_tx</text>
  <text x="610" y="242" font-size="11" fill="#6b7280" text-anchor="middle">Мультиплекс CIPMUX=1</text>

  <rect x="530" y="260" width="160" height="140" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="610" y="283" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Wi-Fi MAC / PHY</text>
  <text x="610" y="303" font-size="11" fill="#1a1a1a" text-anchor="middle">Трансивер 802.11 b/g/n</text>
  <text x="610" y="323" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Піковий струм 300мА</text>
  <text x="610" y="343" font-size="11" fill="#6b7280" text-anchor="middle">Апаратний DMA доступ</text>
  <text x="610" y="363" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Бездротовий ефір</text>
  <text x="610" y="383" font-size="11" fill="#6b7280" text-anchor="middle">Кадри 2.4 ГГц</text>

  <!-- Arrow from LwIP to DRAM -->
  <line x1="705" y1="215" x2="725" y2="215" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="705" y1="315" x2="725" y2="315" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Sub-panel 3: DRAM Heap Memory Allocation -->
  <rect x="730" y="130" width="190" height="285" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="825" y="153" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ОП DRAM (Куча Heap)</text>
  <text x="825" y="170" font-size="11" fill="#6b7280" text-anchor="middle">Вільна куча ~30–40 КБ</text>

  <rect x="742" y="185" width="166" height="75" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="825" y="206" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Блоки керування PCB</text>
  <text x="825" y="224" font-size="11" fill="#6b7280" text-anchor="middle">S_udp_pcb (44B) | Listen (72B)</text>
  <text x="825" y="240" font-size="11" fill="#6b7280" text-anchor="middle">S_active_pcb (164B)</text>

  <rect x="742" y="268" width="166" height="80" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="825" y="289" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Пакетні буфери pbuf</text>
  <text x="825" y="307" font-size="11" fill="#6b7280" text-anchor="middle">Заголовок pbuf_hdr (16B)</text>
  <text x="825" y="325" font-size="11" fill="#6b7280" text-anchor="middle">Динамічний пул RAM</text>

  <rect x="742" y="356" width="166" height="48" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="825" y="375" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Критична межа OOM</text>
  <text x="825" y="393" font-size="11" fill="#c0392b" text-anchor="middle">Резерв M_safety = 8192B</text>

</svg>
