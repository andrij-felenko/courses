<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow markers for transition paths -->
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Асинхронний FSM хост-мікроконтролера для керування сокетами ESP-01</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Попотоковий розбір кадру +IPD та обробка мережевих таймаутів забезпечують надійний обмін без блокування MCU</text>

  <!-- Main Container Panel -->
  <rect x="30" y="75" width="900" height="445" rx="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Panel Legend -->
  <text x="45" y="98" font-size="12" font-weight="bold" fill="#6b7280">ГРАФ СТАНІВ ТА ПЕРЕХОДІВ (UART ASYNC PARSER FSM)</text>

  <!-- SUCCESS PATH RETURN LINE (S_PROCESS -> S_IDLE) -->
  <path d="M 830,145 V 118 H 140 V 145" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="480" y="110" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Кадр опрацьовано -&gt; повернення в IDLE</text>

  <!-- STATE 0: S_IDLE -->
  <rect x="65" y="145" width="150" height="85" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="140" y="168" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">S_IDLE: Очікування</text>
  <text x="140" y="190" font-size="12" fill="#6b7280" text-anchor="middle">Моніторинг UART Rx</text>
  <text x="140" y="210" font-size="12" fill="#6b7280" text-anchor="middle">Пошук префікса "+IPD,"</text>

  <!-- TRANSITION T1: S_IDLE -> S_PARSE_HDR -->
  <path d="M 215,187.5 H 290" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="252.5" y="172" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Префікс "+IPD,"</text>

  <!-- STATE 1: S_PARSE_HDR -->
  <rect x="290" y="145" width="160" height="85" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="370" y="168" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">S_PARSE_HDR</text>
  <text x="370" y="190" font-size="12" fill="#6b7280" text-anchor="middle">Вилучення &lt;id&gt; і &lt;len&gt;</text>
  <text x="370" y="210" font-size="12" fill="#6b7280" text-anchor="middle">Очікування символу ':'</text>

  <!-- TRANSITION T2: S_PARSE_HDR -> S_RX_DATA -->
  <path d="M 450,187.5 H 520" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="485" y="172" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Символ ':'</text>

  <!-- STATE 2: S_RX_DATA -->
  <rect x="520" y="145" width="160" height="85" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="600" y="168" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">S_RX_DATA</text>
  <text x="600" y="190" font-size="12" fill="#6b7280" text-anchor="middle">Запис байт у буфер</text>
  <text x="600" y="210" font-size="12" fill="#6b7280" text-anchor="middle">Лічильник: len_rem--</text>

  <!-- TRANSITION T3: S_RX_DATA -> S_PROCESS -->
  <path d="M 680,187.5 H 755" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="717.5" y="172" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">len_rem == 0</text>

  <!-- STATE 3: S_PROCESS -->
  <rect x="755" y="145" width="150" height="85" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="830" y="168" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">S_PROCESS</text>
  <text x="830" y="190" font-size="12" fill="#27ae60" text-anchor="middle">Кадр готовий</text>
  <text x="830" y="210" font-size="12" fill="#6b7280" text-anchor="middle">Передача в застосунок</text>

  <!-- INFO CARD (MIDDLE GAP) -->
  <rect x="382.5" y="260" width="215" height="65" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="490" y="278" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Формат кадру ESP-01:</text>
  <text x="490" y="296" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">+IPD,&lt;link_id&gt;,&lt;len&gt;:&lt;payload&gt;</text>
  <text x="490" y="314" font-size="12" fill="#6b7280" text-anchor="middle">(Неблокуючий розбір UART)</text>

  <!-- ERROR TRANSITIONS (DASHED RED PATHS TO S_ERROR) -->
  <!-- From S_IDLE to S_ERROR -->
  <path d="M 115,230 V 397.5 H 355" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr-red)"/>
  <text x="235" y="390" font-size="12" fill="#c0392b" text-anchor="middle">Сигнал "CLOSED" / "ERROR"</text>

  <!-- From S_PARSE_HDR to S_ERROR -->
  <path d="M 370,230 V 355" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr-red)"/>
  <text x="360" y="290" font-size="12" fill="#c0392b" text-anchor="end">Помилка заголовка</text>

  <!-- From S_RX_DATA to S_ERROR -->
  <path d="M 600,230 V 355" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr-red)"/>
  <text x="610" y="290" font-size="12" fill="#c0392b" text-anchor="start">Таймаут байт UART</text>

  <!-- STATE 4: S_ERROR (ROW 2) -->
  <rect x="355" y="355" width="260" height="85" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="485" y="378" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">S_ERROR: Обробка помилки</text>
  <text x="485" y="400" font-size="12" fill="#1a1a1a" text-anchor="middle">Таймаут UART / CLOSED / OOM</text>
  <text x="485" y="420" font-size="12" fill="#6b7280" text-anchor="middle">Скидання буфера та виклик AT+CIPSTATUS</text>

  <!-- RECOVERY TRANSITION T6: S_ERROR -> S_IDLE -->
  <path d="M 485,440 V 485 H 165 V 230" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="325" y="477" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Скидання стану &amp; виклик AT+CIPSTATUS -&gt; Відновлення IDLE</text>
</svg>
