<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow Markers Right -->
    <marker id="arr-r-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-r-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-r-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>

    <!-- Arrow Markers Left -->
    <marker id="arr-l-blue" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-l-red" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-l-green" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Часова діаграма живлення, скидання та старт-ап послідовності ESP-AT</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Стабільний запуск вимагає затримки EN/RST після 3.3V, фіксації IO0 = HIGH та очікування "ready" на TX</text>

  <!-- Outer Container Panel -->
  <rect x="25" y="75" width="910" height="445" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Phase Highlights -->
  <rect x="190" y="85" width="100" height="370" fill="#eaf0fd" rx="4"/>
  <rect x="490" y="85" width="100" height="370" fill="#fdecea" rx="4"/>
  <rect x="590" y="85" width="260" height="370" fill="#e9f7ef" rx="4"/>

  <!-- Left Channel Column Background -->
  <rect x="35" y="85" width="135" height="370" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Channel Labels -->
  <text x="45" y="118" font-size="13" font-weight="700" fill="#1a1a1a">3.3V (VDD)</text>
  <text x="45" y="134" font-size="11" fill="#6b7280">Живлення</text>

  <text x="45" y="188" font-size="13" font-weight="700" fill="#1a1a1a">EN (CHIP_PU)</text>
  <text x="45" y="204" font-size="11" fill="#6b7280">Вмикання чипа</text>

  <text x="45" y="258" font-size="13" font-weight="700" fill="#1a1a1a">RST (Reset)</text>
  <text x="45" y="274" font-size="11" fill="#6b7280">Скидання (Low)</text>

  <text x="45" y="328" font-size="13" font-weight="700" fill="#1a1a1a">IO0 (GPIO0)</text>
  <text x="45" y="344" font-size="11" fill="#6b7280">Режим завантаж.</text>

  <text x="45" y="398" font-size="13" font-weight="700" fill="#1a1a1a">TX (UART0)</text>
  <text x="45" y="414" font-size="11" fill="#6b7280">Логи / AT-вхід</text>

  <!-- Horizontal Grid Lines -->
  <line x1="170" y1="157" x2="925" y2="157" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <line x1="170" y1="227" x2="925" y2="227" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <line x1="170" y1="297" x2="925" y2="297" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <line x1="170" y1="367" x2="925" y2="367" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <line x1="170" y1="437" x2="925" y2="437" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Vertical Event Markers (Dashed Lines) -->
  <line x1="190" y1="110" x2="190" y2="437" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="290" y1="110" x2="290" y2="437" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="390" y1="110" x2="390" y2="437" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="490" y1="110" x2="490" y2="437" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="590" y1="110" x2="590" y2="437" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="710" y1="110" x2="710" y2="437" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="850" y1="110" x2="850" y2="437" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Phase Header Titles -->
  <text x="240" y="98" font-size="11" font-weight="700" fill="#2457d6" text-anchor="middle">t_stab ≥ 10 ms</text>
  <text x="340" y="98" font-size="11" font-weight="700" fill="#6b7280" text-anchor="middle">Пауза EN</text>
  <text x="540" y="98" font-size="11" font-weight="700" fill="#c0392b" text-anchor="middle">Скидання (RST=0)</text>
  <text x="650" y="98" font-size="11" font-weight="700" fill="#2457d6" text-anchor="middle">ROM Logs</text>
  <text x="780" y="98" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="middle">Ініціалізація AT</text>
  <text x="885" y="98" font-size="11" font-weight="700" fill="#27ae60" text-anchor="middle">Ready</text>

  <!-- Signal Waveforms -->
  <!-- 1. 3.3V VDD -->
  <path d="M 180,142 L 190,142 L 290,112 L 915,112" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- 2. EN -->
  <path d="M 180,212 L 390,212 L 390,182 L 915,182" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- 3. RST -->
  <path d="M 180,252 L 490,252 L 490,282 L 590,282 L 590,252 L 915,252" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- 4. IO0 -->
  <path d="M 180,352 L 260,352 L 280,322 L 915,322" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- 5. TX -->
  <line x1="180" y1="422" x2="590" y2="422" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,4"/>
  <path d="M 590,422 L 590,392 L 600,392 L 600,422 L 610,422 L 610,392 L 622,392 L 622,422 L 635,422 L 635,392 L 648,392 L 648,422 L 660,422 L 660,392 L 675,392 L 675,422 L 690,422 L 690,392 L 710,392 L 710,422" fill="none" stroke="#2457d6" stroke-width="2"/>
  <path d="M 710,392 L 770,392 L 770,422 L 775,422 L 775,392 L 840,392" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 840,392 L 844,422 L 848,392 L 852,422 L 856,392 L 915,392" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Dimension Arrows -->
  <!-- t_stab arrow -->
  <line x1="192" y1="126" x2="288" y2="126" stroke="#2457d6" stroke-width="1.2" marker-start="url(#arr-l-blue)" marker-end="url(#arr-r-blue)"/>
  
  <!-- t_delay arrow -->
  <line x1="292" y1="200" x2="388" y2="200" stroke="#2457d6" stroke-width="1.2" marker-start="url(#arr-l-blue)" marker-end="url(#arr-r-blue)"/>

  <!-- t_RST arrow -->
  <line x1="492" y1="270" x2="588" y2="270" stroke="#c0392b" stroke-width="1.2" marker-start="url(#arr-l-red)" marker-end="url(#arr-r-red)"/>

  <!-- t_boot arrow -->
  <line x1="592" y1="448" x2="848" y2="448" stroke="#27ae60" stroke-width="1.2" marker-start="url(#arr-l-green)" marker-end="url(#arr-r-green)"/>

  <!-- Bottom Timeline Marker Text Labels -->
  <text x="190" y="475" font-size="11" fill="#6b7280" text-anchor="middle">T0 (0ms)</text>
  <text x="290" y="475" font-size="11" fill="#6b7280" text-anchor="middle">T1 (VDD ok)</text>
  <text x="390" y="475" font-size="11" fill="#6b7280" text-anchor="middle">T2 (EN high)</text>
  <text x="490" y="475" font-size="11" fill="#6b7280" text-anchor="middle">T3 (RST low)</text>
  <text x="590" y="475" font-size="11" fill="#c0392b" font-weight="700" text-anchor="middle">T4 (Boot sample)</text>
  <text x="710" y="475" font-size="11" fill="#6b7280" text-anchor="middle">T5 (Init start)</text>
  <text x="850" y="475" font-size="11" fill="#27ae60" font-weight="700" text-anchor="middle">T6 (ready)</text>

  <!-- Explanatory Text Callouts (Positioned away from lines) -->
  <!-- Callout 2: t_delay -->
  <text x="340" y="193" font-size="11" font-weight="600" fill="#2457d6" text-anchor="middle">t_delay (RC)</text>

  <!-- Callout 3: t_RST -->
  <text x="540" y="263" font-size="11" font-weight="700" fill="#c0392b" text-anchor="middle">t_RST ≥ 500 µs</text>

  <!-- Callout 4: IO0 High Boot Mode -->
  <text x="440" y="338" font-size="11" font-weight="700" fill="#27ae60" text-anchor="middle">IO0 = 1 (Flash Boot)</text>

  <!-- Callout 5: Boot sample point note -->
  <text x="660" y="338" font-size="11" font-weight="600" fill="#c0392b" text-anchor="middle">Фіксація режиму Boot при RST 0→1</text>

  <!-- Callout 6: ROM Logs speed -->
  <text x="650" y="382" font-size="11" font-weight="600" fill="#2457d6" text-anchor="middle">74880 baud</text>

  <!-- Callout 7: Ready Output string -->
  <text x="885" y="414" font-size="11" font-weight="700" fill="#27ae60" text-anchor="middle">"ready\r\n"</text>

  <!-- Callout 8: Boot duration -->
  <text x="720" y="464" font-size="11" font-weight="700" fill="#27ae60" text-anchor="middle">Час завантаження t_boot (~150-500 ms)</text>
</svg>
