<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="530" fill="white"/>

  <!-- Маркери стрілок -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr_blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr_green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr_red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Накопичення часового зсуву та помилка стробування в кадрах UART (8N1)</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">При відхиленні частоти генератора точка вибірки стоп-біта зміщується за межі біта, спричиняючи помилку кадрування</text>

  <!-- Колонки бітів (колірне чергування) -->
  <rect x="160" y="75" width="76" height="215" fill="#f4f6f8"/>
  <rect x="312" y="75" width="76" height="215" fill="#f4f6f8"/>
  <rect x="464" y="75" width="76" height="215" fill="#f4f6f8"/>
  <rect x="616" y="75" width="76" height="215" fill="#f4f6f8"/>
  <rect x="768" y="75" width="76" height="215" fill="#f4f6f8"/>

  <!-- Зовнішня рамка діаграми -->
  <rect x="160" y="75" width="760" height="215" fill="none" stroke="#d0d7de" stroke-width="1"/>

  <!-- Назви бітів угорі -->
  <text x="198" y="92" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">Start</text>
  <text x="274" y="92" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">D0</text>
  <text x="350" y="92" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">D1</text>
  <text x="426" y="92" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">D2</text>
  <text x="502" y="92" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">D3</text>
  <text x="578" y="92" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">D4</text>
  <text x="654" y="92" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">D5</text>
  <text x="730" y="92" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">D6</text>
  <text x="806" y="92" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">D7</text>
  <text x="882" y="92" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle">Stop</text>

  <!-- Вертикальні лінії меж бітів -->
  <line x1="236" y1="75" x2="236" y2="290" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="312" y1="75" x2="312" y2="290" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="388" y1="75" x2="388" y2="290" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="464" y1="75" x2="464" y2="290" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="540" y1="75" x2="540" y2="290" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="616" y1="75" x2="616" y2="290" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="692" y1="75" x2="692" y2="290" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="768" y1="75" x2="768" y2="290" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="844" y1="75" x2="844" y2="290" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Ліва панель підписів рядків -->
  <text x="150" y="115" font-size="12" font-weight="700" fill="#2457d6" text-anchor="end">Сигнал TX (8N1)</text>

  <text x="150" y="185" font-size="12" font-weight="700" fill="#27ae60" text-anchor="end">Ідеальна вибірка</text>
  <text x="150" y="198" font-size="11" fill="#6b7280" text-anchor="end">f_RX = f_TX (δ = 0)</text>

  <text x="150" y="250" font-size="12" font-weight="700" fill="#c0392b" text-anchor="end">Зсув вибірки</text>
  <text x="150" y="263" font-size="11" fill="#6b7280" text-anchor="end">f_RX &lt; f_TX (δ &gt; 0)</text>

  <!-- Осцилограма сигналу UART TX -->
  <path d="M 120,125 L 160,125 L 160,155 L 236,155 L 236,125 L 312,125 L 312,155 L 388,155 L 388,125 L 464,125 L 464,155 L 540,155 L 540,125 L 616,125 L 616,155 L 692,155 L 692,125 L 768,125 L 768,155 L 844,155 L 844,125 L 935,125" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- ІДЕАЛЬНЕ СТРОБУВАННЯ (Зелені пунктири та точки) -->
  <line x1="198" y1="155" x2="198" y2="185" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="2,2"/>
  <circle cx="198" cy="185" r="4" fill="#27ae60"/>

  <line x1="274" y1="125" x2="274" y2="185" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="2,2"/>
  <circle cx="274" cy="185" r="4" fill="#27ae60"/>

  <line x1="350" y1="155" x2="350" y2="185" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="2,2"/>
  <circle cx="350" cy="185" r="4" fill="#27ae60"/>

  <line x1="426" y1="125" x2="426" y2="185" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="2,2"/>
  <circle cx="426" cy="185" r="4" fill="#27ae60"/>

  <line x1="502" y1="155" x2="502" y2="185" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="2,2"/>
  <circle cx="502" cy="185" r="4" fill="#27ae60"/>

  <line x1="578" y1="125" x2="578" y2="185" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="2,2"/>
  <circle cx="578" cy="185" r="4" fill="#27ae60"/>

  <line x1="654" y1="155" x2="654" y2="185" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="2,2"/>
  <circle cx="654" cy="185" r="4" fill="#27ae60"/>

  <line x1="730" y1="125" x2="730" y2="185" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="2,2"/>
  <circle cx="730" cy="185" r="4" fill="#27ae60"/>

  <line x1="806" y1="155" x2="806" y2="185" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="2,2"/>
  <circle cx="806" cy="185" r="4" fill="#27ae60"/>

  <line x1="882" y1="125" x2="882" y2="185" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="2,2"/>
  <circle cx="882" cy="185" r="4" fill="#27ae60"/>

  <!-- ЗСУНУТЕ СТРОБУВАННЯ (Накопичення часового зсуву) -->
  <line x1="200" y1="155" x2="200" y2="250" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="2,2"/>
  <circle cx="200" cy="250" r="4" fill="#27ae60"/>

  <line x1="280" y1="125" x2="280" y2="250" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="2,2"/>
  <circle cx="280" cy="250" r="4" fill="#27ae60"/>

  <line x1="360" y1="155" x2="360" y2="250" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="2,2"/>
  <circle cx="360" cy="250" r="4" fill="#27ae60"/>

  <line x1="440" y1="125" x2="440" y2="250" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="2,2"/>
  <circle cx="440" cy="250" r="4" fill="#27ae60"/>

  <line x1="520" y1="155" x2="520" y2="250" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="2,2"/>
  <circle cx="520" cy="250" r="4" fill="#e67e22"/>

  <line x1="600" y1="125" x2="600" y2="250" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="2,2"/>
  <circle cx="600" cy="250" r="4" fill="#e67e22"/>

  <line x1="680" y1="155" x2="680" y2="250" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="2,2"/>
  <circle cx="680" cy="250" r="4" fill="#e67e22"/>

  <line x1="760" y1="125" x2="760" y2="250" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="2,2"/>
  <circle cx="760" cy="250" r="4" fill="#e67e22"/>

  <line x1="840" y1="155" x2="840" y2="250" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="2,2"/>
  <circle cx="840" cy="250" r="4.5" fill="#c0392b"/>

  <!-- Критичний вихід за межу Стоп-біта -->
  <line x1="924" y1="125" x2="924" y2="250" stroke="#c0392b" stroke-width="2"/>
  <circle cx="924" cy="250" r="6" fill="#c0392b"/>
  <!-- Хрестик у центрі кричущої помилки -->
  <line x1="920" y1="246" x2="928" y2="254" stroke="white" stroke-width="1.5"/>
  <line x1="928" y1="246" x2="920" y2="254" stroke="white" stroke-width="1.5"/>

  <!-- Позначення накопиченого зсуву Δt_накоп -->
  <line x1="882" y1="270" x2="924" y2="270" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr_red)" marker-end="url(#arr_red)"/>
  <text x="903" y="285" font-size="11" font-weight="700" fill="#c0392b" text-anchor="middle">Δt_накоп</text>

  <!-- Бедж помилки стробування -->
  <rect x="750" y="302" width="190" height="24" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="845" y="318" font-size="11" font-weight="700" fill="#c0392b" text-anchor="middle">⚠ Помилка стробування</text>

  <!-- Нижній блок 1: Математична модель -->
  <rect x="20" y="340" width="290" height="165" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="35" y="365" font-size="13" font-weight="700" fill="#2457d6">1. Накопичення часового зсуву</text>
  <text x="35" y="392" font-size="12" fill="#1a1a1a">• Час вибірки N-го біта: t_N = (N + 0.5) T_bit</text>
  <text x="35" y="415" font-size="12" fill="#1a1a1a">• Часовий зсув: Δt = (N + 0.5) · δ · T_bit</text>
  <text x="35" y="438" font-size="12" fill="#1a1a1a">• Зсув Стоп-біта (N=9): Δt_max = 9.5 · δ · T_bit</text>
  <text x="35" y="461" font-size="12" fill="#6b7280">де δ = (f_RX - f_TX) / f_TX — похибка бодрейту</text>

  <!-- Нижній блок 2: Критичний допуск -->
  <rect x="330" y="340" width="300" height="165" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="8"/>
  <text x="345" y="365" font-size="13" font-weight="700" fill="#2457d6">2. Умова успішного стробування</text>
  <text x="345" y="392" font-size="12" fill="#1a1a1a">• Умова збереження кадру: |Δt_max| &lt; 0.5 T_bit</text>
  <text x="345" y="415" font-size="12" fill="#1a1a1a">• Теоретичний ліміт: 9.5 · |δ| &lt; 0.5 ⇒ |δ| &lt; 5.26%</text>
  <text x="345" y="438" font-size="12" fill="#1a1a1a">• З урахуванням джитеру та 16x oversampling:</text>
  <text x="345" y="461" font-size="12" font-weight="700" fill="#2457d6">• Допустима похибка: |δ_доп| ≤ ±2.5% ... ±3.0%</text>

  <!-- Нижній блок 3: Наслідки для ESP-AT -->
  <rect x="650" y="340" width="290" height="165" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="8"/>
  <text x="665" y="365" font-size="13" font-weight="700" fill="#c0392b">3. Наслідки помилки бодрейту</text>
  <text x="665" y="392" font-size="12" fill="#1a1a1a">• Вибірка хибного рівня на Стоп-біті</text>
  <text x="665" y="415" font-size="12" fill="#1a1a1a">• Апаратна помилка кадру (Framing Error)</text>
  <text x="665" y="438" font-size="12" fill="#1a1a1a">• Спотворення символів у відповідях OK/ERROR</text>
  <text x="665" y="461" font-size="12" font-weight="700" fill="#c0392b">• Збій FSM парсера на хост-контролері</text>
</svg>
