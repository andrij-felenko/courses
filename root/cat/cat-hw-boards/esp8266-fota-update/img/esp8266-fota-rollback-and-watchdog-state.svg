<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Автоматичний відкат (Rollback) та апаратний Watchdog при FOTA ESP8266</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Збій запуску нової прошивки або тайм-аут сторожового таймера переключає завантажувач на резервний слот</text>

  <!-- State 1: Active Initial User1 -->
  <rect x="50" y="130" width="220" height="130" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="160" y="158" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Слот User1 (Активний)</text>
  <text x="160" y="182" font-size="12" fill="#1a1a1a" text-anchor="middle">Початковий робочий стан</text>
  <text x="160" y="204" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Прапор: Boot_VALID</text>
  <text x="160" y="226" font-size="12" fill="#6b7280" text-anchor="middle">Стабільна робота</text>

  <!-- Transition 1 -> 2: Download FOTA -->
  <line x1="270" y1="195" x2="370" y2="195" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="278" y="165" width="84" height="22" rx="3" fill="#ffffff" stroke="#2457d6"/>
  <text x="320" y="180" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Запис FOTA</text>

  <!-- State 2: Testing User2 (Pending) -->
  <rect x="370" y="130" width="230" height="130" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="485" y="158" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Слот User2 (Тестовий)</text>
  <text x="485" y="182" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Прапор: Boot_PENDING</text>
  <text x="485" y="204" font-size="12" fill="#1a1a1a" text-anchor="middle">Таймер WDT (t = 10 с)</text>
  <text x="485" y="226" font-size="12" fill="#6b7280" text-anchor="middle">Очікування підтвердження</text>

  <!-- Transition 2 -> 3: Validation Success -->
  <line x1="600" y1="195" x2="700" y2="195" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="608" y="165" width="84" height="22" rx="3" fill="#ffffff" stroke="#27ae60"/>
  <text x="650" y="180" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Перевірено</text>

  <!-- State 3: Validated Main User2 -->
  <rect x="700" y="130" width="210" height="130" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="805" y="158" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Слот User2 (Основний)</text>
  <text x="805" y="182" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Прапор: Boot_VALID</text>
  <text x="805" y="204" font-size="12" fill="#27ae60" text-anchor="middle">Повна заміна прошивки</text>
  <text x="805" y="226" font-size="12" fill="#6b7280" text-anchor="middle">Успішне оновлення</text>

  <!-- Fault Transition 2 -> 4: WDT / Crash -->
  <line x1="485" y1="260" x2="485" y2="320" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#arr-red)"/>
  <rect x="500" y="280" width="160" height="24" rx="4" fill="#ffffff" stroke="#c0392b"/>
  <text x="580" y="296" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Спрацював WDT / Crash</text>

  <!-- State 4: Rollback Action in Bootloader -->
  <rect x="340" y="320" width="290" height="100" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="485" y="345" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Апаратне відновлення (Rollback)</text>
  <text x="485" y="368" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Слот User2 -&gt; Boot_INVALID</text>
  <text x="485" y="390" font-size="12" fill="#1a1a1a" text-anchor="middle">Перемикання вектора на Слот User1</text>

  <!-- Rollback Loop Line: 4 -> 1 -->
  <path d="M 340,370 L 160,370 L 160,260" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arr-red)"/>
  <rect x="175" y="348" width="150" height="22" rx="3" fill="#ffffff" stroke="#c0392b"/>
  <text x="250" y="363" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Відкат на Слот User1</text>

  <!-- Bottom Summary Banner -->
  <rect x="40" y="444" width="880" height="28" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="463" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Захист від "цеглування": Помилка нової прошивки не ламає пристрій — завантажувач миттєво повертає роботу на завідомо справний слот</text>
</svg>
