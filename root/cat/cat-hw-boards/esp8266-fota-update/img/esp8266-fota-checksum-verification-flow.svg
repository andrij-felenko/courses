<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Верифікація контрольної суми SHA-256 та цифрового підпису FOTA</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Перевірка цілісності бінарного образу перед перемиканням прапорця завантажувача rtc_sys_info</text>

  <!-- Step 1: Download & Flash Storage -->
  <rect x="40" y="140" width="170" height="140" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="125" y="162" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Завантаження</text>
  <text x="125" y="188" font-size="12" fill="#1a1a1a" text-anchor="middle">Прийом образу</text>
  <text x="125" y="206" font-size="12" fill="#6b7280" text-anchor="middle">за HTTPS (user2.bin)</text>
  <text x="125" y="230" font-size="12" fill="#1a1a1a" text-anchor="middle">Запис у неактивний</text>
  <text x="125" y="248" font-size="12" fill="#6b7280" text-anchor="middle">банк SPI Flash</text>

  <!-- Flow Arrow 1 to 2 -->
  <line x1="210" y1="210" x2="250" y2="210" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Step 2: SHA-256 Check -->
  <rect x="250" y="140" width="180" height="140" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="340" y="162" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">2. Обчислення SHA-256</text>
  <text x="340" y="188" font-size="12" fill="#1a1a1a" text-anchor="middle">Обчислення хашу</text>
  <text x="340" y="206" font-size="12" fill="#6b7280" text-anchor="middle">побайтово з Flash</text>
  <text x="340" y="230" font-size="12" fill="#1a1a1a" text-anchor="middle">Порівняння з хашем</text>
  <text x="340" y="248" font-size="12" fill="#2457d6" text-anchor="middle">із трейлера образу</text>

  <!-- Flow Arrow 2 to 3 -->
  <line x1="430" y1="210" x2="470" y2="210" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Step 3: Signature Verification -->
  <rect x="470" y="140" width="190" height="140" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="565" y="162" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">3. Перевірка підпису</text>
  <text x="565" y="188" font-size="12" fill="#1a1a1a" text-anchor="middle">Дешифрування підпису</text>
  <text x="565" y="206" font-size="12" fill="#6b7280" text-anchor="middle">відкритим ключем RSA</text>
  <text x="565" y="230" font-size="12" fill="#1a1a1a" text-anchor="middle">Валідація автентичності</text>
  <text x="565" y="248" font-size="12" fill="#2457d6" text-anchor="middle">виробника прошивки</text>

  <!-- Flow Arrow 3 to 4 (Success) -->
  <text x="685" y="198" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Збігається</text>
  <line x1="660" y1="210" x2="710" y2="210" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Step 4: Boot Activation -->
  <rect x="710" y="140" width="210" height="140" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="815" y="162" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">4. Активація прошивки</text>
  <text x="815" y="188" font-size="12" fill="#1a1a1a" text-anchor="middle">Оновлення прапорця</text>
  <text x="815" y="206" font-size="12" fill="#6b7280" text-anchor="middle">в секторі rtc_sys_info</text>
  <text x="815" y="230" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Перезавантаження</text>
  <text x="815" y="248" font-size="12" fill="#27ae60" text-anchor="middle">і старт з user2.bin</text>

  <!-- Failure Branch Labels and Lines -->
  <text x="280" y="315" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Незбіг хашу</text>
  <line x1="340" y1="280" x2="340" y2="340" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arr-red)"/>

  <text x="635" y="315" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Підпис недійсний</text>
  <line x1="565" y1="280" x2="565" y2="340" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arr-red)"/>

  <!-- Failure Outcome Box -->
  <rect x="340" y="340" width="320" height="100" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="500" y="365" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Аварійне скасування (Rollback)</text>
  <text x="500" y="388" font-size="12" fill="#1a1a1a" text-anchor="middle">Очищення недійсного банку Flash</text>
  <text x="500" y="406" font-size="12" fill="#1a1a1a" text-anchor="middle">збереження активного образу user1.bin</text>
  <text x="500" y="424" font-size="12" fill="#c0392b" text-anchor="middle">та відновлення роботи після збою</text>
</svg>
