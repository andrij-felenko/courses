<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="#ffffff"/>

  <!-- Title & Subtitle -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Двобанківська розмітка Flash-пам'яті та завантажувач rBoot</text>
  <text x="480" y="46" font-size="13" fill="#6b7280" text-anchor="middle">rBoot атомарно перемикає активний слот (user1.bin / user2.bin) після перевірки цілісності образу FOTA</text>

  <!-- Upper Switch Arrow Label -->
  <text x="410" y="64" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">3. Перемикання вказівника активного слота після успішної перевірки</text>

  <!-- Upper Switch Path -->
  <path d="M 685 145 C 685 76, 145 76, 145 145" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#arr-green)"/>

  <!-- Flash Memory Outer Panel -->
  <rect x="50" y="105" width="860" height="255" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="480" y="128" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Карта розділів Flash-пам'яті ESP8266 (Partition Map)</text>

  <!-- Sector 0: rBoot Bootloader -->
  <rect x="70" y="145" width="150" height="195" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="145" y="175" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">rBoot Config</text>
  <text x="145" y="198" font-size="12" fill="#6b7280" text-anchor="middle">0x00000 - 0x01FFF</text>
  <line x1="85" y1="215" x2="205" y2="215" stroke="#d0d7de" stroke-width="1"/>
  <text x="145" y="235" font-size="12" fill="#1a1a1a" text-anchor="middle">Вектор старту:</text>
  <rect x="85" y="248" width="120" height="28" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="145" y="267" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">user1.bin (Slot 0)</text>
  <text x="145" y="305" font-size="12" fill="#6b7280" text-anchor="middle">Розмір: 8 КБ</text>

  <!-- Active Arrow from rBoot to Slot 0 -->
  <path d="M 220 262 L 240 262" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Slot 0: user1.bin -->
  <rect x="245" y="145" width="280" height="195" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="385" y="175" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Слот 0: user1.bin</text>
  <text x="385" y="198" font-size="12" fill="#6b7280" text-anchor="middle">0x02000 - 0x7B000</text>
  <rect x="265" y="215" width="240" height="26" rx="4" fill="#27ae60"/>
  <text x="385" y="232" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">АКТИВНА ПРОШИВКА</text>
  <text x="385" y="265" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">1. Виконання коду програми</text>
  <text x="385" y="285" font-size="12" fill="#1a1a1a" text-anchor="middle">Ініціювання завантаження FOTA</text>
  <text x="385" y="310" font-size="12" fill="#6b7280" text-anchor="middle">Обсяг: 492 КБ</text>

  <!-- Slot 1: user2.bin -->
  <rect x="545" y="145" width="280" height="195" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="685" y="175" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Слот 1: user2.bin</text>
  <text x="685" y="198" font-size="12" fill="#6b7280" text-anchor="middle">0x82000 - 0xFB000</text>
  <rect x="565" y="215" width="240" height="26" rx="4" fill="#2457d6"/>
  <text x="685" y="232" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">НЕАКТИВНИЙ СЛОТ (FOTA)</text>
  <text x="685" y="265" font-size="12" fill="#1a1a1a" text-anchor="middle">Буфер для нового образу</text>
  <text x="685" y="285" font-size="12" fill="#1a1a1a" text-anchor="middle">Перевірка хешу SHA-256</text>
  <text x="685" y="310" font-size="12" fill="#6b7280" text-anchor="middle">Обсяг: 492 КБ</text>

  <!-- System Params / RF Calibration -->
  <rect x="835" y="145" width="60" height="195" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="865" y="225" font-size="12" fill="#6b7280" text-anchor="middle">System</text>
  <text x="865" y="245" font-size="12" fill="#6b7280" text-anchor="middle">Params</text>

  <!-- FOTA Download Path -->
  <path d="M 385 340 C 385 415, 685 415, 685 340" fill="none" stroke="#2457d6" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arr-blue)"/>
  <text x="535" y="435" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">2. Запис нової прошивки по Wi-Fi у неактивний слот 1 та верифікація підпису</text>
</svg>
