<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Послідовність обміну даними при бездротовому FOTA-оновленні ESP8266</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Взаємодія mDNS, HTTP/HTTPS запитів, бібліотеки UpdateClass та потікового запису у Flash</text>

  <!-- Lifeline Columns -->
  <!-- Column 1: Client / Server -->
  <rect x="60" y="80" width="160" height="36" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="140" y="103" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Сервер / Браузер</text>
  <line x1="140" y1="116" x2="140" y2="480" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Column 2: mDNS Service -->
  <rect x="300" y="80" width="160" height="36" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="380" y="103" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Служба mDNS</text>
  <line x1="380" y1="116" x2="380" y2="480" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Column 3: ESP8266 WebServer -->
  <rect x="540" y="80" width="160" height="36" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="620" y="103" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">ESP8266 WebServer</text>
  <line x1="620" y1="116" x2="620" y2="480" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Column 4: Flash Slot 1 -->
  <rect x="760" y="80" width="160" height="36" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="840" y="103" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Flash (Slot 1)</text>
  <line x1="840" y1="116" x2="840" y2="480" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Step 1: mDNS Query -->
  <text x="260" y="138" text-anchor="middle" font-size="12" fill="#1a1a1a">1. mDNS запит: esp8266.local</text>
  <line x1="140" y1="145" x2="373" y2="145" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- Step 2: mDNS Response -->
  <text x="260" y="173" text-anchor="middle" font-size="12" fill="#6b7280">2. IP-відповідь: 192.168.1.105</text>
  <line x1="380" y1="180" x2="147" y2="180" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-dark)"/>

  <!-- Step 3: HTTP GET /update -->
  <text x="380" y="213" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">3. HTTP GET /update (форма завантаження)</text>
  <line x1="140" y1="220" x2="613" y2="220" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Step 4: HTTP 200 Form HTML -->
  <text x="380" y="248" text-anchor="middle" font-size="12" fill="#6b7280">4. 200 OK (HTML-форма оновлення)</text>
  <line x1="620" y1="255" x2="147" y2="255" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-dark)"/>

  <!-- Step 5: HTTP POST firmware -->
  <text x="380" y="293" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">5. HTTP POST /update + firmware.bin (Update.begin)</text>
  <line x1="140" y1="300" x2="613" y2="300" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Step 6: Stream chunk to Flash -->
  <text x="730" y="333" text-anchor="middle" font-size="11" fill="#2457d6">6. Update.write(chunk)</text>
  <line x1="620" y1="340" x2="833" y2="340" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Step 7: MD5 verification -->
  <text x="730" y="373" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">7. Update.end() -&gt; MD5 OK</text>
  <line x1="620" y1="380" x2="833" y2="380" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Step 8: HTTP 200 OK Success -->
  <text x="380" y="413" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">8. 200 OK "Update Success! Rebooting..."</text>
  <line x1="620" y1="420" x2="147" y2="420" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-green)"/>

  <!-- Step 9: Reset & Boot Slot 1 -->
  <rect x="525" y="445" width="190" height="40" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="620" y="463" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">9. ESP.restart()</text>
  <text x="620" y="478" text-anchor="middle" font-size="10" fill="#1a1a1a">Перемикання на Slot 1</text>
</svg>
