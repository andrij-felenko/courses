<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- White Canvas Background -->
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>

  <!-- Title & Subtitle -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Діаграма послідовності мережевого рукостискання FOTA</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Покроковий HTTPS-обмін версіями, авторизація, поблокова передача прошивки та верифікація</text>

  <!-- Entity Lifepoles Headers -->
  <!-- Client Entity: ESP8266 -->
  <rect x="80" y="85" width="200" height="40" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="180" y="104" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">ESP8266 Client</text>
  <text x="180" y="118" font-size="11" fill="#6b7280" text-anchor="middle">(AT+CIUPDATE / FOTA Agent)</text>
  <line x1="180" y1="125" x2="180" y2="480" stroke="#d0d7de" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Server Entity: HTTPS FOTA Server -->
  <rect x="680" y="85" width="200" height="40" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="780" y="104" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">HTTPS FOTA Server</text>
  <text x="780" y="118" font-size="11" fill="#6b7280" text-anchor="middle">(Cloud Firmware Repository)</text>
  <line x1="780" y1="125" x2="780" y2="480" stroke="#d0d7de" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Sequence Step 1: TLS Handshake -->
  <text x="480" y="147" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">1. TLS 1.2 Handshake (Client Hello + CA Cert Verification)</text>
  <line x1="180" y1="155" x2="780" y2="155" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <text x="480" y="172" font-size="11" fill="#27ae60" text-anchor="middle">Server Certificate &amp; Session Key Established</text>
  <line x1="780" y1="180" x2="180" y2="180" stroke="#27ae60" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arr-green)"/>

  <!-- Sequence Step 2: GET Version Check -->
  <text x="480" y="207" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">2. GET /fota/check?version=v1.0.0 &amp; device_id=ESP01_9A2F</text>
  <line x1="180" y1="215" x2="780" y2="215" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <text x="480" y="232" font-size="11" fill="#27ae60" text-anchor="middle">200 OK { new_version: "v1.2.0", size: 499712, sha256: "e3b0c44..." }</text>
  <line x1="780" y1="240" x2="180" y2="240" stroke="#27ae60" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arr-green)"/>

  <!-- Sequence Step 3: GET Binary Chunks -->
  <text x="480" y="267" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">3. GET /fota/user2.bin (Range: bytes=0-4095)</text>
  <line x1="180" y1="275" x2="780" y2="275" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <text x="480" y="292" font-size="11" fill="#27ae60" text-anchor="middle">206 Partial Content (Chunk 4096 B + SHA-256 block hash)</text>
  <line x1="780" y1="300" x2="180" y2="300" stroke="#27ae60" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arr-green)"/>

  <!-- Step 4: Iterative Chunk Processing Note Box -->
  <rect x="230" y="323" width="500" height="38" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="338" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Цикл завантаження: Запис порції 4 кБ у Flash user2.bin + розрахунок SHA-256</text>
  <text x="480" y="352" font-size="11" fill="#6b7280" text-anchor="middle">(Повторюється до заповнення повного розміру 499712 B)</text>

  <!-- Sequence Step 5: Verification Report -->
  <text x="480" y="382" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">4. POST /fota/status { status: "download_complete", sha256_valid: true }</text>
  <line x1="180" y1="390" x2="780" y2="390" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <text x="480" y="407" font-size="11" fill="#27ae60" text-anchor="middle">200 OK { action: "reboot_to_user2" }</text>
  <line x1="780" y1="415" x2="180" y2="415" stroke="#27ae60" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arr-green)"/>

  <!-- Step 6: Reboot & Switch Note Box -->
  <rect x="230" y="433" width="500" height="38" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="448" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Завершення: Перемикання прапора rboot у RTC -&gt; Скидання RST -&gt; Старт з user2.bin</text>
  <text x="480" y="462" font-size="11" fill="#6b7280" text-anchor="middle">(При помилці підпису/хешу — відкат rollback на user1.bin)</text>

  <!-- Lifepoles Bottom Boxes -->
  <rect x="80" y="480" width="200" height="30" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="180" y="500" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ESP8266 Client</text>

  <rect x="680" y="480" width="200" height="30" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="780" y="500" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">HTTPS FOTA Server</text>

  <!-- Bottom Status Banner -->
  <rect x="30" y="522" width="900" height="28" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="541" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Результат: Асинхронне двобанківське оновлення запобігає блокуванню чипа при збоях мережі або живлення</text>
</svg>
