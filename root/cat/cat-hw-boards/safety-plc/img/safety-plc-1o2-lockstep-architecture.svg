<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Двоканальна архітектура 1o2 з перехресним контролем та апаратним Watchdog</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Канали CPU1 та CPU2 виконують синхронні обчислення, порівнюють дані через Cross-Check та керують ключами F-DO</text>

  <!-- ГОЛОВНИЙ КОРПУС SAFETY PLC -->
  <rect x="24" y="75" width="912" height="465" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- КАНАЛ 1 -->
  <rect x="44" y="95" width="380" height="270" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="60" y="118" font-size="13" font-weight="bold" fill="#1a1a1a">Канал обчислення 1 (Channel A)</text>

  <!-- Вхід DI1 -->
  <rect x="60" y="135" width="150" height="50" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="135" y="156" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вхід DI 1</text>
  <text x="135" y="172" font-size="12" fill="#6b7280" text-anchor="middle">первинний сенсор</text>

  <!-- CPU 1 -->
  <rect x="240" y="135" width="164" height="120" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="322" y="158" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мікропроцесор CPU 1</text>
  <text x="250" y="180" font-size="12" fill="#1a1a1a">• Виконання логіки ПО</text>
  <text x="250" y="198" font-size="12" fill="#1a1a1a">• Стробування WD 1</text>
  <text x="250" y="216" font-size="12" fill="#1a1a1a">• Перехресний аналіз</text>
  <text x="250" y="234" font-size="12" fill="#1a1a1a">• Керування FET 1</text>

  <!-- Стрілка DI1 -> CPU1 -->
  <path d="M 210 160 L 238 160" stroke="#2457d6" stroke-width="1.8" fill="none" marker-end="url(#arr-accent)"/>

  <!-- Watchdog 1 -->
  <rect x="60" y="280" width="344" height="65" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="74" y="302" font-size="12" font-weight="bold" fill="#1a1a1a">Апаратний сторожовий таймер (Watchdog 1)</text>
  <text x="74" y="324" font-size="12" fill="#6b7280">Незалежний RC-генератор; знеструмлює FET 1 при зависанні</text>

  <!-- Стрілка CPU1 -> WD1 -->
  <path d="M 322 255 L 322 278" stroke="#2457d6" stroke-width="1.8" fill="none" marker-end="url(#arr-accent)"/>

  <!-- КАНАЛ 2 -->
  <rect x="536" y="95" width="380" height="270" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="552" y="118" font-size="13" font-weight="bold" fill="#1a1a1a">Канал обчислення 2 (Channel B)</text>

  <!-- CPU 2 -->
  <rect x="552" y="135" width="164" height="120" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="634" y="158" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мікропроцесор CPU 2</text>
  <text x="562" y="180" font-size="12" fill="#1a1a1a">• Виконання логіки ПО</text>
  <text x="562" y="198" font-size="12" fill="#1a1a1a">• Стробування WD 2</text>
  <text x="562" y="216" font-size="12" fill="#1a1a1a">• Перехресний аналіз</text>
  <text x="562" y="234" font-size="12" fill="#1a1a1a">• Керування FET 2</text>

  <!-- Вхід DI2 -->
  <rect x="746" y="135" width="150" height="50" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="821" y="156" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вхід DI 2</text>
  <text x="821" y="172" font-size="12" fill="#6b7280" text-anchor="middle">дубльований сенсор</text>

  <!-- Стрілка DI2 -> CPU2 -->
  <path d="M 746 160 L 718 160" stroke="#2457d6" stroke-width="1.8" fill="none" marker-end="url(#arr-accent)"/>

  <!-- Watchdog 2 -->
  <rect x="552" y="280" width="344" height="65" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="566" y="302" font-size="12" font-weight="bold" fill="#1a1a1a">Апаратний сторожовий таймер (Watchdog 2)</text>
  <text x="566" y="324" font-size="12" fill="#6b7280">Незалежний RC-генератор; знеструмлює FET 2 при зависанні</text>

  <!-- Стрілка CPU2 -> WD2 -->
  <path d="M 634 255 L 634 278" stroke="#2457d6" stroke-width="1.8" fill="none" marker-end="url(#arr-accent)"/>

  <!-- ШИНА КРОС-КОНТРОЛЮ (CROSS-CHECK BUS) -->
  <rect x="434" y="150" width="92" height="90" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="173" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Шина Cross-Check</text>
  <text x="480" y="193" font-size="12" fill="#1a1a1a" text-anchor="middle">Взаємне</text>
  <text x="480" y="210" font-size="12" fill="#1a1a1a" text-anchor="middle">порівняння</text>
  <text x="480" y="227" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">1o2</text>

  <!-- Двонаправлені лінії Cross-Check -->
  <path d="M 404 195 L 432 195" stroke="#27ae60" stroke-width="1.8" fill="none" marker-end="url(#arr-green)"/>
  <path d="M 552 195 L 528 195" stroke="#27ae60" stroke-width="1.8" fill="none" marker-end="url(#arr-green)"/>

  <!-- ВИХІДНИЙ КАСКАД FAIL-SAFE (F-DO) -->
  <rect x="44" y="380" width="872" height="140" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="401" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вихідний безпечний каскад F-DO (ключі High-Side / Low-Side)</text>

  <!-- Блок Джерело живлення -->
  <rect x="60" y="418" width="120" height="85" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="120" y="452" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Живлення 24V</text>
  <text x="120" y="470" font-size="12" fill="#6b7280" text-anchor="middle">Safety Bus</text>

  <!-- Ключ FET 1 (High-Side) -->
  <rect x="230" y="418" width="180" height="85" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="320" y="443" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Силовий ключ FET 1</text>
  <text x="320" y="463" font-size="12" fill="#2457d6" text-anchor="middle">Керування: CPU 1 + WD 1</text>
  <text x="320" y="481" font-size="12" fill="#6b7280" text-anchor="middle">High-Side Switch</text>

  <!-- Ключ FET 2 (Low-Side) -->
  <rect x="470" y="418" width="180" height="85" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="560" y="443" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Силовий ключ FET 2</text>
  <text x="560" y="463" font-size="12" fill="#2457d6" text-anchor="middle">Керування: CPU 2 + WD 2</text>
  <text x="560" y="481" font-size="12" fill="#6b7280" text-anchor="middle">Low-Side Switch</text>

  <!-- Навантаження / Аварійний привід -->
  <rect x="700" y="418" width="200" height="85" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="800" y="443" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Навантаження (Актюатор)</text>
  <text x="800" y="463" font-size="12" fill="#27ae60" text-anchor="middle">Клапан / Головний контактор</text>
  <text x="800" y="481" font-size="12" fill="#6b7280" text-anchor="middle">Fail-Safe знеструмлення</text>

  <!-- Лінії силового потоку -->
  <path d="M 180 460 L 228 460" stroke="#1a1a1a" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M 410 460 L 468 460" stroke="#1a1a1a" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M 650 460 L 698 460" stroke="#1a1a1a" stroke-width="2" fill="none" marker-end="url(#arr)"/>

  <!-- Стрілки керування з каналів до силових ключів -->
  <path d="M 232 345 L 232 416" stroke="#2457d6" stroke-dasharray="4 3" stroke-width="1.8" fill="none" marker-end="url(#arr-accent)"/>
  <path d="M 724 345 L 648 416" stroke="#2457d6" stroke-dasharray="4 3" stroke-width="1.8" fill="none" marker-end="url(#arr-accent)"/>
</svg>
