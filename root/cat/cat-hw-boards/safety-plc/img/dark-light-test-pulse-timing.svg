<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="520" fill="white"/>
  
  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Часова діаграма діагностики Dark Test та Light Test</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Короткочасні імпульси (t_test &lt; t_relay) не викликають спрацьовування реле</text>

  <!-- PANEL A: DARK TEST -->
  <rect x="30" y="75" width="900" height="195" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="100" font-size="14" font-weight="bold" fill="#c0392b">1. Dark Test (тестування ввімкненого виходу F-DO)</text>

  <!-- Dark Test pulse highlight -->
  <rect x="400" y="130" width="60" height="120" fill="#fdecea" opacity="0.6" stroke="#c0392b" stroke-dasharray="2 2"/>

  <!-- Signal Labels Panel A -->
  <text x="40" y="155" font-size="12" font-weight="bold" fill="#1a1a1a">Сигнал F-DO</text>
  <text x="40" y="230" font-size="12" font-weight="bold" fill="#1a1a1a">Реле</text>

  <text x="175" y="144" text-anchor="end" font-size="12" fill="#6b7280">24 В</text>
  <text x="175" y="179" text-anchor="end" font-size="12" fill="#6b7280">0 В</text>
  <text x="175" y="229" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">Замкнено</text>

  <!-- Dotted 0V line -->
  <line x1="180" y1="175" x2="640" y2="175" stroke="#d0d7de" stroke-dasharray="3 3"/>

  <!-- Waveform F-DO V_out (Dark Test) -->
  <path d="M 180,140 L 400,140 L 400,175 L 460,175 L 460,140 L 640,140" stroke="#c0392b" stroke-width="2.5" fill="none"/>

  <!-- Waveform Relay Contact (Dark Test - flat closed) -->
  <line x1="180" y1="225" x2="640" y2="225" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Time axis Panel A -->
  <line x1="180" y1="190" x2="640" y2="190" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-main)"/>
  <text x="648" y="194" font-size="12" fill="#6b7280">Час t</text>

  <!-- Pulse width marker Panel A -->
  <line x1="400" y1="125" x2="460" y2="125" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="400" y1="120" x2="400" y2="130" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="460" y1="120" x2="460" y2="130" stroke="#c0392b" stroke-width="1.5"/>
  <text x="430" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">t_dark ≈ 0.5 мс</text>

  <!-- Status badge Panel A -->
  <rect x="680" y="140" width="220" height="45" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="790" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Діагностика успішна</text>
  <text x="790" y="175" text-anchor="middle" font-size="12" fill="#1a1a1a">Реле НЕ розмикається</text>


  <!-- PANEL B: LIGHT TEST -->
  <rect x="30" y="290" width="900" height="195" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="315" font-size="14" font-weight="bold" fill="#2457d6">2. Light Test (тестування вимкненого виходу F-DO)</text>

  <!-- Light Test pulse highlight -->
  <rect x="400" y="345" width="60" height="120" fill="#eaf0fd" opacity="0.6" stroke="#2457d6" stroke-dasharray="2 2"/>

  <!-- Signal Labels Panel B -->
  <text x="40" y="370" font-size="12" font-weight="bold" fill="#1a1a1a">Сигнал F-DO</text>
  <text x="40" y="445" font-size="12" font-weight="bold" fill="#1a1a1a">Реле</text>

  <text x="175" y="359" text-anchor="end" font-size="12" fill="#6b7280">24 В</text>
  <text x="175" y="394" text-anchor="end" font-size="12" fill="#6b7280">0 В</text>
  <text x="175" y="444" text-anchor="end" font-size="12" fill="#6b7280">Розімкнено</text>

  <!-- Dotted 24V line -->
  <line x1="180" y1="355" x2="640" y2="355" stroke="#d0d7de" stroke-dasharray="3 3"/>

  <!-- Waveform F-DO V_out (Light Test) -->
  <path d="M 180,390 L 400,390 L 400,355 L 460,355 L 460,390 L 640,390" stroke="#2457d6" stroke-width="2.5" fill="none"/>

  <!-- Waveform Relay Contact (Light Test - flat open) -->
  <line x1="180" y1="440" x2="640" y2="440" stroke="#6b7280" stroke-width="2.5"/>

  <!-- Time axis Panel B -->
  <line x1="180" y1="405" x2="640" y2="405" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-main)"/>
  <text x="648" y="409" font-size="12" fill="#6b7280">Час t</text>

  <!-- Pulse width marker Panel B -->
  <line x1="400" y1="340" x2="460" y2="340" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="400" y1="335" x2="400" y2="345" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="460" y1="335" x2="460" y2="345" stroke="#2457d6" stroke-width="1.5"/>
  <text x="430" y="333" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">t_light ≈ 0.2 мс</text>

  <!-- Status badge Panel B -->
  <rect x="680" y="355" width="220" height="45" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="790" y="373" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Діагностика успішна</text>
  <text x="790" y="390" text-anchor="middle" font-size="12" fill="#1a1a1a">Реле НЕ спрацьовує</text>
</svg>
