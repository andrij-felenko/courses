<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Двоканальна архітектура 1oo2 з синфазними ядрами Lockstep CPU</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Похресне порівняння обчислень компаратором та аварійне розмикання виходів при розбіжності (Fail-Safe)</text>

  <!-- Main Architecture Panel -->
  <rect x="30" y="70" width="900" height="355" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Left Module: F-DI Input Module -->
  <rect x="50" y="140" width="110" height="180" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="105" y="165" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Модуль F-DI</text>
  <text x="105" y="185" font-size="12" fill="#6b7280" text-anchor="middle">Вхідний сигнал</text>
  <text x="105" y="205" font-size="12" fill="#6b7280" text-anchor="middle">безпеки (24V)</text>

  <rect x="65" y="225" width="80" height="30" rx="4" fill="#ffffff" stroke="#2457d6"/>
  <text x="105" y="244" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вхід Sensor</text>

  <!-- Input Signal Splitting -->
  <path d="M 160,240 L 180,240 L 180,175 L 210,175" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <path d="M 160,240 L 180,240 L 180,295 L 210,295" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <circle cx="180" cy="240" r="4" fill="#2457d6"/>

  <!-- Channel A: CPU A (Master) -->
  <rect x="210" y="135" width="240" height="80" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="330" y="157" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Ядро CPU A (Основний канал)</text>
  <text x="330" y="177" font-size="12" fill="#1a1a1a" text-anchor="middle">Синхронне виконання коду</text>
  <text x="330" y="195" font-size="12" fill="#6b7280" text-anchor="middle">Стан: [0x55AA, Out=HIGH]</text>

  <!-- Channel B: CPU B (Lockstep / 2-cycle Delay) -->
  <rect x="210" y="255" width="240" height="80" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="330" y="277" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Ядро CPU B (Lockstep-дублер)</text>
  <text x="330" y="297" font-size="12" fill="#1a1a1a" text-anchor="middle">Затримка 2 такти (зсув завад)</text>
  <text x="330" y="315" font-size="12" fill="#6b7280" text-anchor="middle">Стан: [0x55AA, Out=HIGH]</text>

  <!-- Inter-Core Sync Line -->
  <line x1="330" y1="215" x2="330" y2="255" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="335" y="239" font-size="12" fill="#6b7280">Тактова синхронізація</text>

  <!-- Channels Output to Comparator -->
  <path d="M 450,175 L 470,175 L 470,205 L 490,205" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <path d="M 450,295 L 470,295 L 470,265 L 490,265" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Bypass Line from CPU A to Output Stage -->
  <path d="M 450,155 L 710,155" fill="none" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Comparator Block -->
  <rect x="490" y="165" width="170" height="140" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="575" y="190" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Апаратний Компаратор</text>
  <text x="575" y="208" font-size="12" fill="#6b7280" text-anchor="middle">Похресне порівняння</text>

  <rect x="505" y="222" width="140" height="30" rx="4" fill="#ffffff" stroke="#27ae60"/>
  <text x="575" y="241" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">CPU A == CPU B (OK)</text>

  <text x="575" y="275" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">При розбіжності → TRIP</text>

  <!-- Output Enable Signal from Comparator to Output Block -->
  <line x1="660" y1="235" x2="710" y2="235" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="685" y="227" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Enable</text>

  <!-- Right Module: F-DO Output Stage -->
  <rect x="710" y="140" width="190" height="190" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="805" y="163" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вихідний модуль F-DO</text>

  <!-- Key K1 -->
  <rect x="735" y="180" width="140" height="38" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="805" y="203" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Ключ K1: Замкнено</text>

  <!-- Key K2 -->
  <rect x="735" y="230" width="140" height="38" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="805" y="253" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Ключ K2: Замкнено</text>

  <!-- Output Connection & Terminal -->
  <line x1="875" y1="249" x2="895" y2="249" stroke="#27ae60" stroke-width="2"/>
  <circle cx="895" cy="249" r="4" fill="#27ae60"/>
  <text x="805" y="305" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Вихід на контактори (24V)</text>

  <!-- Flow Phase Banners at bottom of panel -->
  <rect x="50" y="365" width="170" height="30" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="135" y="385" font-size="12" fill="#6b7280" text-anchor="middle">1. Паралельне зчитування</text>

  <rect x="240" y="365" width="210" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="345" y="385" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">2. Синфазне виконання коду</text>

  <rect x="470" y="365" width="200" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="570" y="385" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">3. Похресне порівняння</text>

  <rect x="690" y="365" width="220" height="30" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="800" y="385" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">4. Аварійне розмикання (Fail-Safe)</text>

  <!-- Bottom Info Cards -->
  <!-- Card 1: Lockstep Principles -->
  <rect x="30" y="445" width="430" height="95" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="45" y="465" font-size="12" font-weight="bold" fill="#2457d6">Принцип роботи Lockstep CPU:</text>
  <text x="45" y="485" font-size="12" fill="#1a1a1a">• Обидва ядра виконують один і той самий потік інструкцій</text>
  <text x="45" y="505" font-size="12" fill="#1a1a1a">• CPU B працює із затримкою у 2 такти для виявлення завад живлення</text>
  <text x="45" y="525" font-size="12" fill="#27ae60">• Гарантує діагностичне покриття DC &gt; 99% для апаратури</text>

  <!-- Card 2: Discrepancy Reaction -->
  <rect x="480" y="445" width="450" height="95" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="495" y="465" font-size="12" font-weight="bold" fill="#c0392b">Реакція на розбіжність (Discrepancy Trip):</text>
  <text x="495" y="485" font-size="12" fill="#1a1a1a">• При найменшому неспівпадінні регістрів компаратор фіксує помилку</text>
  <text x="495" y="505" font-size="12" fill="#1a1a1a">• Сигнал блокування негайно розмикає послідовні реле K1 / K2</text>
  <text x="495" y="525" font-size="12" fill="#c0392b">• Перехід у стан Fail-Safe відбувається без участі програмного коду</text>
</svg>
