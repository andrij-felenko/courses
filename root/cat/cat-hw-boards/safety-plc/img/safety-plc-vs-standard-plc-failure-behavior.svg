<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Поведінка ПЛК при апаратній відмові виходу (Output Short Circuit)</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Стандартний ПЛК ігнорує аварію через поодиноку відмову, тоді як Safety PLC вимикає коло через дублювання</text>

  <!-- Left Panel: Standard PLC -->
  <rect x="30" y="75" width="435" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="45" y="90" width="405" height="34" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="247.5" y="112" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">Стандартний ПЛК (Одноканальний вихід)</text>

  <!-- Left: E-Stop -->
  <rect x="55" y="145" width="160" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="135" y="168" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кнопка E-Stop</text>
  <text x="135" y="188" font-size="12" fill="#c0392b" text-anchor="middle">Сигнал: 0 В (Натиснуто)</text>

  <!-- Arrow E-Stop -> CPU -->
  <path d="M 215 175 L 260 175" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- Left: CPU -->
  <rect x="260" y="145" width="180" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="350" y="168" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Процесор ПЛК</text>
  <text x="350" y="188" font-size="12" fill="#6b7280" text-anchor="middle">Команда: Вимкнути</text>

  <!-- Arrow CPU -> Output -->
  <path d="M 350 205 L 350 235" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- Left: Output Key -->
  <rect x="150" y="235" width="200" height="85" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="250" y="258" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Одиничний ключ (Q0)</text>
  <text x="250" y="278" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">ВІДМОВА: Пробій / Залипання</text>
  <text x="250" y="298" font-size="12" fill="#6b7280" text-anchor="middle">Ключ постійно замкнений</text>

  <!-- Arrow Output -> Actuator -->
  <path d="M 250 320 L 250 350" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="260" y="338" font-size="12" fill="#c0392b" text-anchor="start">Струм тече</text>

  <!-- Left: Actuator -->
  <rect x="150" y="350" width="200" height="65" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="250" y="375" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">НЕБЕЗПЕКА: Двигун працює</text>
  <text x="250" y="395" font-size="12" fill="#c0392b" text-anchor="middle">Живлення 24 В НЕ вимкнено!</text>


  <!-- Right Panel: Safety PLC -->
  <rect x="495" y="75" width="435" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="510" y="90" width="405" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712.5" y="112" font-size="15" font-weight="bold" fill="#27ae60" text-anchor="middle">Safety PLC (Дубльований вихід 1oo2)</text>

  <!-- Right: E-Stop -->
  <rect x="520" y="145" width="160" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="600" y="168" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кнопка E-Stop</text>
  <text x="600" y="188" font-size="12" fill="#27ae60" text-anchor="middle">Сигнал: 0 В (Натиснуто)</text>

  <!-- Arrow E-Stop -> Safety CPU -->
  <path d="M 680 175 L 725 175" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- Right: Safety CPU -->
  <rect x="725" y="145" width="180" height="60" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="815" y="168" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Дубльований CPU</text>
  <text x="815" y="188" font-size="12" fill="#6b7280" text-anchor="middle">Діагностика: Відмова</text>

  <!-- Right: Dual Output Keys -->
  <rect x="615" y="225" width="200" height="105" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="625" y="235" width="180" height="40" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="715" y="260" font-size="12" fill="#c0392b" text-anchor="middle">Ключ A (Q0_A): Залипання</text>

  <rect x="625" y="282" width="180" height="40" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="715" y="307" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Ключ B (Q0_B): РОЗІМКНЕНО</text>

  <!-- Arrows Safety CPU -> Keys -->
  <path d="M 815 205 L 815 255 L 805 255" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M 815 255 L 815 302 L 805 302" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Arrow Dual Output -> Actuator -->
  <path d="M 715 330 L 715 350" stroke="#27ae60" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr-green)"/>
  <text x="725" y="343" font-size="12" fill="#27ae60" text-anchor="start">Струм відсутній</text>

  <!-- Right: Actuator -->
  <rect x="615" y="350" width="200" height="65" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="715" y="375" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">БЕЗПЕКА: Двигун зупинено</text>
  <text x="715" y="395" font-size="12" fill="#27ae60" text-anchor="middle">Коло знеструмлене (0 В)</text>
</svg>
