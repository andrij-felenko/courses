<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <defs>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Порівняння вихідних каскадів: Звичайний ПЛК vs Safety PLC</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Пробій одного ключа у звичайному ПЛК спричиняє небезпечну відмову;</text>
  <text x="480" y="68" text-anchor="middle" font-size="13" fill="#6b7280">у Safety PLC другий послідовний ключ та зчитування FB гарантують безпечний стан (Fail-Safe)</text>

  <!-- LEFT PANEL: Standard PLC Output Stage -->
  <rect x="30" y="85" width="435" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  
  <rect x="45" y="98" width="405" height="34" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="247" y="119" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Звичайний ПЛК (Каскад 1oo1 без резервування)</text>

  <!-- Power rail +24V (Left) -->
  <line x1="55" y1="160" x2="415" y2="160" stroke="#1a1a1a" stroke-width="2"/>
  <text x="60" y="152" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">+24V</text>

  <!-- Standard MCU -->
  <rect x="55" y="210" width="80" height="45" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="95" y="237" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">MCU</text>
  
  <!-- Control Line -->
  <line x1="135" y1="232.5" x2="175" y2="232.5" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>
  <text x="155" y="224" text-anchor="middle" font-size="12" fill="#6b7280">Control</text>

  <!-- Single Transistor Q1 (Fault state) -->
  <rect x="175" y="200" width="115" height="65" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="232.5" y="225" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Ключ Q1</text>
  <text x="232.5" y="245" text-anchor="middle" font-size="12" fill="#c0392b">(Пробій / Short)</text>

  <!-- High current wire through broken Q1 -->
  <line x1="232.5" y1="160" x2="232.5" y2="200" stroke="#c0392b" stroke-width="2.5"/>
  <polyline points="232.5,265 232.5,300 350,300 350,320" fill="none" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="285" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Струм +24V</text>

  <!-- Output terminal DO_0 -->
  <circle cx="350" cy="300" r="5" fill="#c0392b"/>
  <text x="362" y="304" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">DO_0</text>

  <!-- Actuator / Load (Left) -->
  <rect x="292.5" y="320" width="115" height="55" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="350" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Навантаження</text>
  <text x="350" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">(Увімкнено!)</text>

  <!-- Ground Rail (Left) -->
  <line x1="350" y1="375" x2="350" y2="410" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="55" y1="410" x2="415" y2="410" stroke="#1a1a1a" stroke-width="2"/>
  <text x="60" y="402" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">GND (0V)</text>

  <!-- Left Bottom Banner -->
  <rect x="45" y="430" width="405" height="34" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="247" y="451" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">⚡ Небезпека: пробій Q1 неможливо зупинити</text>


  <!-- RIGHT PANEL: Safety PLC Output Stage -->
  <rect x="495" y="85" width="435" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  
  <rect x="510" y="98" width="405" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712" y="119" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Safety PLC (Каскад P/M з резервуванням і FB)</text>

  <!-- Power rail +24V (Right) -->
  <line x1="520" y1="160" x2="880" y2="160" stroke="#1a1a1a" stroke-width="2"/>
  <text x="525" y="152" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">+24V</text>

  <!-- Safety CPU -->
  <rect x="520" y="200" width="85" height="65" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="562.5" y="225" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Safety CPU</text>
  <text x="562.5" y="245" text-anchor="middle" font-size="12" fill="#6b7280">(Lockstep)</text>

  <!-- Key Q_P (P-Switch) - Shorted -->
  <rect x="630" y="195" width="90" height="50" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="675" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Ключ Q_P</text>
  <text x="675" y="233" text-anchor="middle" font-size="12" fill="#c0392b">(Пробій)</text>

  <!-- Key Q_M (M-Switch) - Open / Safe -->
  <rect x="745" y="195" width="90" height="50" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="790" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Ключ Q_M</text>
  <text x="790" y="233" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">(ВІДКРИТО)</text>

  <!-- Control Lines from CPU -->
  <line x1="605" y1="210" x2="630" y2="210" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <polyline points="562.5,200 562.5,175 790,175 790,195" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>

  <!-- Power path from +24V down to Q_P -->
  <line x1="675" y1="160" x2="675" y2="195" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Intermediate path between Q_P and Q_M (Fault potential) -->
  <line x1="720" y1="220" x2="745" y2="220" stroke="#c0392b" stroke-width="2"/>

  <!-- Output path from Q_M to F-DO & Load (De-energized 0V) -->
  <polyline points="835,220 870,220 870,320" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="882" y="270" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">0V (Безпека)</text>

  <!-- Diagnostic Readback Circuit (FB) -->
  <polyline points="732.5,220 732.5,290" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <rect x="675" y="290" width="115" height="50" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="732.5" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Діагностика FB</text>
  <text x="732.5" y="328" text-anchor="middle" font-size="12" fill="#2457d6">(Сигнал пробою)</text>
  
  <polyline points="675,315 562.5,315 562.5,265" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <text x="618" y="307" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Помилка FB</text>

  <!-- Output terminal F-DO -->
  <circle cx="870" cy="220" r="5" fill="#27ae60"/>
  <text x="882" y="224" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">F-DO</text>

  <!-- Actuator / Load (Right) -->
  <rect x="812.5" y="320" width="115" height="55" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
  <text x="870" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Навантаження</text>
  <text x="870" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">(Знеструмлено)</text>

  <!-- Ground Rail (Right) -->
  <line x1="870" y1="375" x2="870" y2="410" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="520" y1="410" x2="880" y2="410" stroke="#1a1a1a" stroke-width="2"/>
  <text x="525" y="402" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">GND (0V)</text>

  <!-- Right Bottom Banner -->
  <rect x="510" y="430" width="405" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712" y="451" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">✓ Гарантований Fail-Safe: Q_M розімкнув коло при відмові Q_P</text>
</svg>
