<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-danger" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-success" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Еволюція систем захисту: Релейна шафа vs Safety PLC</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Порівняння шляхів струму, автоматичної діагностики та режимів відмови (SIL3)</text>

  <!-- ЛІВА ПАНЕЛЬ: Релейна шафа -->
  <rect x="25" y="80" width="445" height="440" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="40" y="95" width="415" height="34" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="247" y="117" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">Релейна шафа (Традиційний захист)</text>

  <!-- Схема релейного кола -->
  <rect x="40" y="140" width="415" height="170" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="162" font-size="12" font-weight="bold" fill="#1a1a1a">Електричне коло захисту (послідовне з'єднання)</text>

  <!-- Елементи кола -->
  <text x="55" y="214" font-size="12" font-weight="bold" fill="#2457d6">+24V</text>
  <path d="M 88,210 L 102,210 M 102,210 L 122,198 M 122,210 L 142,210" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
  <text x="112" y="188" text-anchor="middle" font-size="12" fill="#1a1a1a">Давач S1</text>

  <path d="M 142,210 L 165,210 M 165,202 L 165,218 M 185,202 L 185,218 M 185,210 L 210,210" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
  <text x="175" y="188" text-anchor="middle" font-size="12" fill="#1a1a1a">Контакт K1</text>
  <text x="175" y="234" text-anchor="middle" font-size="12" fill="#27ae60">Справний</text>

  <!-- Помилка приварення K2 -->
  <rect x="220" y="172" width="90" height="72" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M 235,202 L 235,218 M 255,202 L 255,218 M 235,210 L 255,210" stroke="#c0392b" stroke-width="1.5" fill="none"/>
  <circle cx="245" cy="210" r="3" fill="#c0392b"/>
  <text x="265" y="188" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Контакт K2</text>
  <text x="265" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Приварений!</text>

  <!-- Струм до клапана -->
  <path d="M 310,210 L 328,210" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arr-danger)" fill="none"/>
  <rect x="330" y="190" width="105" height="40" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="382" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Клапан Y1 (ESD)</text>
  <text x="290" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Струм не розривається при відмові</text>

  <!-- Земля GND -->
  <path d="M 435,210 L 445,210 L 445,285 L 55,285" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 2" fill="none"/>
  <text x="55" y="280" font-size="12" font-weight="bold" fill="#6b7280">0V (GND)</text>

  <!-- Недоліки реле -->
  <rect x="40" y="325" width="415" height="180" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="348" font-size="13" font-weight="bold" fill="#c0392b">Основні обмеження релейного захисту:</text>

  <rect x="52" y="360" width="391" height="42" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="0.8"/>
  <text x="62" y="378" font-size="12" font-weight="bold" fill="#c0392b">1. Прихована відмова (Silent Fault):</text>
  <text x="62" y="394" font-size="12" fill="#1a1a1a">Приварення контакту K2 не виявляється до аварійного виклику.</text>

  <rect x="52" y="410" width="391" height="42" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="0.8"/>
  <text x="62" y="428" font-size="12" font-weight="bold" fill="#c0392b">2. Відсутність самодіагностики:</text>
  <text x="62" y="444" font-size="12" fill="#1a1a1a">Неможливо перевірити цілісність кола без зупинки процесу.</text>

  <rect x="52" y="460" width="391" height="38" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="0.8"/>
  <text x="62" y="476" font-size="12" font-weight="bold" fill="#c0392b">3. Механічна деградація та громіздкість:</text>
  <text x="62" y="491" font-size="12" fill="#1a1a1a">Обмежений ресурс реле, складна перебудова логіки захисту.</text>


  <!-- ПРАВА ПАНЕЛЬ: Safety PLC -->
  <rect x="490" y="80" width="445" height="440" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="505" y="95" width="415" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712" y="117" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Safety PLC (Архітектура 1o2D / SIL3)</text>

  <!-- Схема архітектури Safety PLC -->
  <rect x="505" y="140" width="415" height="170" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="520" y="162" font-size="12" font-weight="bold" fill="#1a1a1a">Резервована мікропроцесорна структура з самодіагностикою</text>

  <!-- Модуль DI -->
  <rect x="518" y="180" width="70" height="92" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="553" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Модуль DI</text>
  <text x="553" y="218" text-anchor="middle" font-size="12" fill="#1a1a1a">Канал A</text>
  <path d="M 524,225 L 582,225" stroke="#d0d7de" stroke-width="1"/>
  <text x="553" y="244" text-anchor="middle" font-size="12" fill="#1a1a1a">Канал B</text>
  <text x="553" y="263" text-anchor="middle" font-size="12" fill="#6b7280">24V Test</text>

  <!-- Лінії DI -> CPU -->
  <path d="M 588,214 L 608,214" stroke="#2457d6" stroke-width="1.2" marker-end="url(#arr-accent)" fill="none"/>
  <path d="M 588,240 L 608,240" stroke="#2457d6" stroke-width="1.2" marker-end="url(#arr-accent)" fill="none"/>

  <!-- CPU A & B -->
  <rect x="610" y="180" width="120" height="38" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="670" y="203" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">CPU A (Основний)</text>

  <rect x="625" y="222" width="90" height="15" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="0.8"/>
  <text x="670" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Крос-діагностика</text>

  <rect x="610" y="241" width="120" height="38" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="670" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">CPU B (Резервний)</text>

  <!-- Лінії CPU -> DO -->
  <path d="M 730,199 L 750,199" stroke="#2457d6" stroke-width="1.2" marker-end="url(#arr-accent)" fill="none"/>
  <path d="M 730,260 L 750,260" stroke="#2457d6" stroke-width="1.2" marker-end="url(#arr-accent)" fill="none"/>

  <!-- Модуль DO -->
  <rect x="752" y="180" width="76" height="92" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="790" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Модуль DO</text>
  <text x="790" y="218" text-anchor="middle" font-size="12" fill="#27ae60">Ключ Q1</text>
  <text x="790" y="236" text-anchor="middle" font-size="12" fill="#27ae60">Ключ Q2</text>
  <text x="790" y="255" text-anchor="middle" font-size="12" fill="#c0392b">Тест-імпульс</text>

  <!-- Лінія DO -> Клапан -->
  <path d="M 828,226 L 846,226" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-success)" fill="none"/>

  <!-- Клапан -->
  <rect x="848" y="206" width="62" height="40" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="879" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Клапан Y1</text>

  <!-- Переваги Safety PLC -->
  <rect x="505" y="325" width="415" height="180" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="520" y="348" font-size="13" font-weight="bold" fill="#27ae60">Ключові переваги та відповідність SIL3:</text>

  <rect x="517" y="360" width="391" height="42" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="0.8"/>
  <text x="527" y="378" font-size="12" font-weight="bold" fill="#27ae60">1. Гарантований безпечний стан (Fail-Safe):</text>
  <text x="527" y="394" font-size="12" fill="#1a1a1a">При будь-якій відмові виходи знеструмлюються за мілісекунди.</text>

  <rect x="517" y="410" width="391" height="42" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="0.8"/>
  <text x="527" y="428" font-size="12" font-weight="bold" fill="#27ae60">2. Апаратна циклічна самодіагностика:</text>
  <text x="527" y="444" font-size="12" fill="#1a1a1a">Тестові імпульси виявляють пробій ключів без зупинки процесу.</text>

  <rect x="517" y="460" width="391" height="38" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="0.8"/>
  <text x="527" y="476" font-size="12" font-weight="bold" fill="#27ae60">3. Висока готовність та сертифікація SIL3:</text>
  <text x="527" y="491" font-size="12" fill="#1a1a1a">IEC 61508 / 61511, гаряча заміна вузлів (Hot-Swap) під напругою.</text>
</svg>
