<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>

  <!-- Titles -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Двоканальне підключення E-Stop до модуля F-DI та виявлення замикань</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Тестові імпульси T1 і T2 виявляють крос-коротке замикання між каналами та обрив ліній</text>

  <!-- Left Panel: E-Stop Button Unit -->
  <rect x="35" y="75" width="330" height="420" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="50" y="90" width="300" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="200" y="110" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Кнопка E-Stop (Двоканальна)</text>

  <!-- Mushroom Cap & Actuator Symbol -->
  <path d="M 55,200 C 55,180 105,180 105,200 Z" fill="#c0392b"/>
  <rect x="75" y="200" width="10" height="130" fill="#6b7280"/>
  <text x="80" y="172" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">E-Stop</text>
  
  <!-- Mechanical Linkage -->
  <line x1="85" y1="185" x2="165" y2="185" stroke="#6b7280" stroke-dasharray="3,3" stroke-width="1.5"/>
  <line x1="85" y1="305" x2="165" y2="305" stroke="#6b7280" stroke-dasharray="3,3" stroke-width="1.5"/>
  <text x="92" y="240" font-size="12" fill="#6b7280">Механічний</text>
  <text x="92" y="254" font-size="12" fill="#6b7280">зв'язок</text>

  <!-- Contact NC1 -->
  <rect x="165" y="140" width="165" height="80" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="247" y="158" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Контакт NC1 (Канал 1)</text>
  <line x1="175" y1="185" x2="205" y2="185" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="205" y1="185" x2="245" y2="175" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="245" y1="185" x2="320" y2="185" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="205" cy="185" r="3" fill="#1a1a1a"/>
  <circle cx="245" cy="185" r="3" fill="#1a1a1a"/>
  <text x="180" y="178" font-size="12" font-weight="bold" fill="#6b7280">11</text>
  <text x="312" y="178" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="end">12</text>
  <text x="247" y="208" font-size="12" fill="#27ae60" text-anchor="middle">Замкнено (Норма)</text>

  <!-- Contact NC2 -->
  <rect x="165" y="260" width="165" height="80" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="247" y="278" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Контакт NC2 (Канал 2)</text>
  <line x1="175" y1="305" x2="205" y2="305" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="205" y1="305" x2="245" y2="295" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="245" y1="305" x2="320" y2="305" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="205" cy="305" r="3" fill="#1a1a1a"/>
  <circle cx="245" cy="305" r="3" fill="#1a1a1a"/>
  <text x="180" y="298" font-size="12" font-weight="bold" fill="#6b7280">21</text>
  <text x="312" y="298" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="end">22</text>
  <text x="247" y="328" font-size="12" fill="#27ae60" text-anchor="middle">Замкнено (Норма)</text>

  <!-- E-Stop Bottom Note -->
  <rect x="50" y="365" width="300" height="110" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="65" y="387" font-size="12" font-weight="bold" fill="#1a1a1a">Особливості кнопки E-Stop:</text>
  <text x="65" y="407" font-size="12" fill="#6b7280">• Окремі розмикальні контакти NC1/NC2</text>
  <text x="65" y="427" font-size="12" fill="#6b7280">• Пряме примусове розмикання контакту</text>
  <text x="65" y="447" font-size="12" fill="#6b7280">• При натисканні розриваються обидва такти</text>

  <!-- Middle Cable & Fault Field -->
  <!-- Wire T1 Out -->
  <line x1="465" y1="185" x2="330" y2="185" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <circle cx="330" cy="185" r="4" fill="#2457d6"/>
  <text x="397" y="177" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вихід T1</text>

  <!-- Wire DI1 Return -->
  <line x1="330" y1="225" x2="465" y2="225" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <circle cx="330" cy="225" r="4" fill="#2457d6"/>
  <text x="397" y="217" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вхід DI1 (Канал 1)</text>

  <!-- Wire T2 Out -->
  <line x1="465" y1="305" x2="330" y2="305" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <circle cx="330" cy="305" r="4" fill="#27ae60"/>
  <text x="397" y="297" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Вихід T2</text>

  <!-- Wire DI2 Return -->
  <line x1="330" y1="345" x2="465" y2="345" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <circle cx="330" cy="345" r="4" fill="#27ae60"/>
  <text x="397" y="362" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Вхід DI2 (Канал 2)</text>

  <!-- Cross-Circuit Short Connection -->
  <line x1="425" y1="185" x2="425" y2="345" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="4,3"/>
  <circle cx="425" cy="185" r="4.5" fill="#c0392b"/>
  <circle cx="425" cy="345" r="4.5" fill="#c0392b"/>
  <path d="M 425,345 L 465,345" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <rect x="345" y="244" width="104" height="34" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="397" y="258" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">КРОС-ЗАМИКАННЯ</text>
  <text x="397" y="272" font-size="12" fill="#c0392b" text-anchor="middle">Витік T1 на DI2</text>

  <!-- Right Panel: Safety PLC F-DI Module -->
  <rect x="445" y="75" width="480" height="420" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="460" y="90" width="450" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="685" y="110" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Модуль безпекових входів F-DI (Safety PLC)</text>

  <!-- Test Pulse Generator Sub-panel -->
  <rect x="465" y="135" width="145" height="215" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="537" y="153" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Генератор такту T1/T2</text>

  <circle cx="465" cy="185" r="4" fill="#2457d6"/>
  <text x="475" y="189" font-size="12" font-weight="bold" fill="#2457d6">T1</text>
  <text x="552" y="168" font-size="12" fill="#2457d6" text-anchor="middle">Такт 1 (T1)</text>
  <path d="M 510,190 L 525,190 L 525,175 L 545,175 L 545,190 L 565,190 L 565,175 L 585,175 L 585,190 L 595,190" fill="none" stroke="#2457d6" stroke-width="1.5"/>

  <line x1="475" y1="225" x2="600" y2="225" stroke="#d0d7de" stroke-width="1"/>

  <circle cx="465" cy="305" r="4" fill="#27ae60"/>
  <text x="475" y="309" font-size="12" font-weight="bold" fill="#27ae60">T2</text>
  <text x="552" y="288" font-size="12" fill="#27ae60" text-anchor="middle">Такт 2 (T2, зсув)</text>
  <path d="M 510,300 L 530,300 L 530,315 L 550,315 L 550,300 L 570,300 L 570,315 L 590,315 L 590,300 L 595,300" fill="none" stroke="#27ae60" stroke-width="1.5"/>

  <!-- F-DI Terminals -->
  <circle cx="465" cy="225" r="4" fill="#2457d6"/>
  <text x="475" y="229" font-size="12" font-weight="bold" fill="#2457d6">DI1</text>

  <circle cx="465" cy="345" r="4" fill="#c0392b"/>
  <text x="475" y="349" font-size="12" font-weight="bold" fill="#c0392b">DI2 (Fault)</text>

  <!-- Input Processing & Logic Evaluation Unit -->
  <rect x="625" y="135" width="290" height="215" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="770" y="153" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Оцінка імпульсів та діагностика</text>

  <!-- Channel 1 Status (OK) -->
  <rect x="640" y="165" width="260" height="42" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="650" y="182" font-size="12" font-weight="bold" fill="#27ae60">Вхід DI1 (Канал 1):</text>
  <text x="650" y="197" font-size="12" fill="#1a1a1a">Отримано такт T1 → Норма (OK)</text>

  <!-- Channel 2 Status (FAULT) -->
  <rect x="640" y="215" width="260" height="60" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="650" y="232" font-size="12" font-weight="bold" fill="#c0392b">Вхід DI2 (Канал 2): ПОМИЛКА!</text>
  <text x="650" y="247" font-size="12" font-weight="bold" fill="#c0392b">Виявлено такт T1 замість T2</text>
  <text x="650" y="262" font-size="12" fill="#6b7280">Крос-коротке замикання між дротами!</text>

  <!-- Safety Action Badge -->
  <rect x="640" y="283" width="260" height="55" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="770" y="303" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">РЕАКЦІЯ БЕЗПЕКИ: FAULT / TRIP</text>
  <text x="770" y="323" font-size="12" fill="#1a1a1a" text-anchor="middle">Вимкнення виходів F-DO (SIL3 / PL e)</text>

  <!-- F-DI Bottom Note -->
  <rect x="460" y="365" width="455" height="110" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="475" y="387" font-size="12" font-weight="bold" fill="#1a1a1a">Принцип виявлення крос-короткого замикання:</text>
  <text x="475" y="407" font-size="12" fill="#6b7280">• Такти T1 та T2 мають відмінну часову форму (зсув фази).</text>
  <text x="475" y="427" font-size="12" fill="#6b7280">• При короткому замиканні між жилами такт T1 потрапляє на DI2.</text>
  <text x="475" y="447" font-size="12" fill="#6b7280">• F-DI розпізнає чужий такт і переводить канал у стан безпеки.</text>
</svg>
