<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Canvas background -->
  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>

  <!-- Title and Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Структура кадру PROFIsafe у концепції Black Channel</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Інкапсуляція захищеного контейнера F-Data у стандартні кадри Industrial Ethernet</text>

  <!-- 1. PROFIsafe Safety Container Panel -->
  <rect x="40" y="80" width="880" height="150" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="8"/>
  <text x="60" y="104" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="start">1. Захищений контейнер PROFIsafe (F-PDU / Safety Container)</text>
  <text x="60" y="122" font-size="12" fill="#6b7280" text-anchor="start">Формується у програмі Safety PLC (F-CPU) і передається без змін через незахищену мережу</text>

  <!-- F-PDU Fields -->
  <rect x="60" y="135" width="300" height="75" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="210" y="162" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">F-Payload (1..123 байтів)</text>
  <text x="210" y="182" font-size="12" fill="#6b7280" text-anchor="middle">Дані входів / виходів безпеки</text>

  <rect x="372" y="135" width="170" height="75" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="457" y="162" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Байт стану / управління</text>
  <text x="457" y="182" font-size="12" fill="#6b7280" text-anchor="middle">Status / Control Byte (1B)</text>

  <rect x="554" y="135" width="160" height="75" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="634" y="162" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Лічильник телеграм</text>
  <text x="634" y="182" font-size="12" fill="#6b7280" text-anchor="middle">Consecutive No (3B)</text>

  <rect x="726" y="135" width="174" height="75" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="6"/>
  <text x="813" y="162" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Захисна CRC сума</text>
  <text x="813" y="182" font-size="12" fill="#1a1a1a" text-anchor="middle">F-CRC (3 або 4 байти)</text>

  <!-- Encapsulation Arrow -->
  <line x1="480" y1="230" x2="480" y2="252" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="495" y="246" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">Інкапсуляція в мережевий кадр (Black Channel Principle)</text>

  <!-- 2. Standard Ethernet Frame Panel -->
  <rect x="40" y="265" width="880" height="135" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="8"/>
  <text x="60" y="287" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="start">2. Стандартний мережевий кадр Ethernet / PROFINET («Чорний канал»)</text>
  <text x="60" y="304" font-size="12" fill="#6b7280" text-anchor="start">Стандартні комутатори та лінії зв'язку обробляють кадр без знання про специфіку безпеки</text>

  <!-- Ethernet Frame Fields -->
  <rect x="60" y="315" width="150" height="65" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="135" y="342" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Ethernet Header</text>
  <text x="135" y="360" font-size="12" fill="#1a1a1a" text-anchor="middle">MAC адреси (14B)</text>

  <rect x="222" y="315" width="170" height="65" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="307" y="342" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">PROFINET Header</text>
  <text x="307" y="360" font-size="12" fill="#1a1a1a" text-anchor="middle">Ідентифікатор каналу</text>

  <rect x="404" y="315" width="346" height="65" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="6"/>
  <text x="577" y="342" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Захищений контейнер PROFIsafe (F-PDU)</text>
  <text x="577" y="360" font-size="12" fill="#1a1a1a" text-anchor="middle">Вкладений шар безпеки (F-Payload + F-CRC)</text>

  <rect x="762" y="315" width="138" height="65" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="831" y="342" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Ethernet FCS</text>
  <text x="831" y="360" font-size="12" fill="#1a1a1a" text-anchor="middle">Мережевий CRC (4B)</text>

  <!-- 3. Safety Mechanism Panel -->
  <rect x="40" y="415" width="880" height="105" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="8"/>

  <rect x="60" y="430" width="205" height="75" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="162" y="452" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Послідовні номери</text>
  <text x="162" y="470" font-size="12" fill="#1a1a1a" text-anchor="middle">Виявлення втрати,</text>
  <text x="162" y="486" font-size="12" fill="#1a1a1a" text-anchor="middle">повтору чи затримки</text>

  <rect x="277" y="430" width="205" height="75" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="379" y="452" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Таймер Watchdog</text>
  <text x="379" y="470" font-size="12" fill="#1a1a1a" text-anchor="middle">Контроль максимального</text>
  <text x="379" y="486" font-size="12" fill="#1a1a1a" text-anchor="middle">часу затримки кадру</text>

  <rect x="494" y="430" width="205" height="75" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="596" y="452" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Унікальні F-адреси</text>
  <text x="596" y="470" font-size="12" fill="#1a1a1a" text-anchor="middle">Захист від перехресних</text>
  <text x="596" y="486" font-size="12" fill="#1a1a1a" text-anchor="middle">помилок підключення</text>

  <rect x="711" y="430" width="189" height="75" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="805" y="452" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Обчислення F-CRC</text>
  <text x="805" y="470" font-size="12" fill="#1a1a1a" text-anchor="middle">Виявлення спотворень</text>
  <text x="805" y="486" font-size="12" fill="#1a1a1a" text-anchor="middle">бітів у пакеті даних</text>
</svg>
