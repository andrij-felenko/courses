<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Архітектура USB Composite прошивки DAPLink після конвертації ST-Link V2.1</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Один контролер STM32 одночасно надає три інтерфейси: зневадження CMSIS-DAP, VCP та MSD Drag-and-Drop</text>

  <!-- Top Block: USB Composite Host Stack -->
  <rect x="240" y="70" width="480" height="55" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="93" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">USB Composite Device (DAPLink Core)</text>
  <text x="480" y="112" font-size="12" fill="#6b7280" text-anchor="middle">Interface Association Descriptor (IAD) | STM32F103 / STM32F4</text>

  <!-- Distribution Lines -->
  <line x1="480" y1="125" x2="480" y2="142" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="180" y1="142" x2="780" y2="142" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="180" y1="142" x2="180" y2="158" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="480" y1="142" x2="480" y2="158" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="780" y1="142" x2="780" y2="158" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Column 1: CMSIS-DAP -->
  <rect x="45" y="160" width="270" height="225" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="55" y="170" width="250" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="180" y="191" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">1. CMSIS-DAP (Зневадження)</text>

  <rect x="55" y="210" width="250" height="45" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="180" y="228" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Ендпоінти: Bulk IN / Bulk OUT</text>
  <text x="180" y="244" font-size="12" fill="#6b7280" text-anchor="middle">Протокол: CMSIS-DAP v1 / v2</text>

  <rect x="55" y="263" width="250" height="52" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="180" y="281" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Модуль: DAP / SWD Engine</text>
  <text x="180" y="299" font-size="12" fill="#6b7280" text-anchor="middle">OpenOCD / PyOCD / Keil</text>

  <rect x="55" y="323" width="250" height="52" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="180" y="343" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Лінії SWD: SWCLK, SWDIO</text>
  <text x="180" y="360" font-size="12" fill="#2457d6" text-anchor="middle">Апаратний скид: nRESET</text>

  <!-- Column 2: VCP CDC -->
  <rect x="345" y="160" width="270" height="225" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="355" y="170" width="250" height="32" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="480" y="191" font-size="13" font-weight="700" fill="#27ae60" text-anchor="middle">2. VCP CDC (COM-порт)</text>

  <rect x="355" y="210" width="250" height="45" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="228" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Comm IN + Bulk IN / OUT</text>
  <text x="480" y="244" font-size="12" fill="#6b7280" text-anchor="middle">Класи: CDC-ACM / Serial Bridge</text>

  <rect x="355" y="263" width="250" height="52" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="281" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Модуль: UART Ring Buffer</text>
  <text x="480" y="299" font-size="12" fill="#6b7280" text-anchor="middle">Монітор консолі (Термінал)</text>

  <rect x="355" y="323" width="250" height="52" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="480" y="343" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Лінії UART: USART TX / RX</text>
  <text x="480" y="360" font-size="12" fill="#27ae60" text-anchor="middle">Швидкість: до 115200+ baud</text>

  <!-- Column 3: MSD Flasher -->
  <rect x="645" y="160" width="270" height="225" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="655" y="170" width="250" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="780" y="191" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">3. MSD (Drag-and-Drop)</text>

  <rect x="655" y="210" width="250" height="45" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="780" y="228" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Ендпоінти: Bulk IN / Bulk OUT</text>
  <text x="780" y="244" font-size="12" fill="#6b7280" text-anchor="middle">Клас: USB Mass Storage Class</text>

  <rect x="655" y="263" width="250" height="52" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="780" y="281" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">FAT Emulation &amp; Flash Algo</text>
  <text x="780" y="299" font-size="12" fill="#6b7280" text-anchor="middle">Прошивання .bin / .hex</text>

  <rect x="655" y="323" width="250" height="52" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="780" y="343" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Автоматичний запис uC</text>
  <text x="780" y="360" font-size="12" fill="#2457d6" text-anchor="middle">Прямий доступ до Flash</text>

  <!-- Connectors to Target -->
  <line x1="180" y1="385" x2="180" y2="418" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="480" y1="385" x2="480" y2="418" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="780" y1="385" x2="780" y2="418" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Bottom Block: Target MCU -->
  <rect x="45" y="420" width="870" height="75" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="440" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Цільовий мікроконтролер (Target MCU: STM32 / ARM Cortex-M)</text>

  <rect x="60" y="450" width="240" height="35" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="180" y="472" font-size="12" fill="#1a1a1a" text-anchor="middle">Порт SWD (SWCLK / SWDIO)</text>

  <rect x="360" y="450" width="240" height="35" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="472" font-size="12" fill="#1a1a1a" text-anchor="middle">Периферія USART (RX / TX)</text>

  <rect x="660" y="450" width="240" height="35" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="780" y="472" font-size="12" fill="#1a1a1a" text-anchor="middle">Внутрішня Flash-пам'ять</text>
</svg>
