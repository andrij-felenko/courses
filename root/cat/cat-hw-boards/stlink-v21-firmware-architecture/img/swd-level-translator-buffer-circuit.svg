<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Markers -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема узгодження рівнів ST-Link V2.1 для різновольтних плат</text>
  <text x="480" y="57" text-anchor="middle" font-size="13" fill="#6b7280">Буферизація SWCLK і SWDIO (74LVC1T45) та відкритий колектор для NRST (1,65 В – 5,5 В)</text>

  <!-- Main Containers -->
  <!-- Left Panel: ST-Link MCU -->
  <rect x="30" y="80" width="210" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="135" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">ST-Link V2.1 MCU</text>
  <text x="135" y="124" text-anchor="middle" font-size="12" fill="#6b7280">STM32F103 (3.3V VDD)</text>

  <!-- Inner MCU IC Box -->
  <rect x="45" y="140" width="180" height="355" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="135" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">STM32F103C8/CB</text>

  <!-- MCU Pin Terminals & Labels -->
  <!-- PA14 SWCLK -->
  <text x="215" y="179" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">PA14 (SWCLK)</text>
  <circle cx="225" cy="175" r="3" fill="#2457d6"/>

  <!-- PA13 SWDIO -->
  <text x="215" y="259" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">PA13 (SWDIO)</text>
  <circle cx="225" cy="255" r="3" fill="#2457d6"/>

  <!-- PB14 SWDIO_DIR -->
  <text x="215" y="299" text-anchor="end" font-size="11" fill="#6b7280">PB14 (SWDIO_DIR)</text>
  <circle cx="225" cy="295" r="3" fill="#6b7280"/>

  <!-- PB0 NRST_OUT -->
  <text x="215" y="369" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">PB0 (NRST_OUT)</text>
  <circle cx="225" cy="365" r="3" fill="#27ae60"/>

  <!-- PA0 T_VCC_SENSE -->
  <text x="215" y="441" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">PA0 (T_VCC_SENSE)</text>
  <circle cx="225" cy="437" r="3" fill="#c0392b"/>

  <!-- GND Pin -->
  <text x="215" y="494" text-anchor="end" font-size="11" fill="#6b7280">GND (0V)</text>
  <circle cx="225" cy="490" r="3" fill="#6b7280"/>


  <!-- Middle Panel: Level Translator & Buffers -->
  <rect x="270" y="80" width="420" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Вузол трансляції та буферизації</text>
  <text x="480" y="124" text-anchor="middle" font-size="12" fill="#6b7280">Розділені домени живлення: VCCA (3.3V) і VCCB (1.65V–5.5V)</text>


  <!-- U1 Sub-panel (74LVC1T45 SWCLK) -->
  <rect x="340" y="145" width="280" height="55" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="163" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">U1: 74LVC1T45 (Буфер SWCLK)</text>
  <text x="480" y="181" text-anchor="middle" font-size="11" fill="#1a1a1a">VCCA=3.3V | VCCB=V_TGT | DIR=VCCA (A → B)</text>
  <text x="348" y="179" text-anchor="start" font-size="11" font-weight="bold" fill="#2457d6">A</text>
  <text x="612" y="179" text-anchor="end" font-size="11" font-weight="bold" fill="#2457d6">B</text>


  <!-- U2 Sub-panel (74LVC1T45 SWDIO) -->
  <rect x="340" y="220" width="280" height="95" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">U2: 74LVC1T45 (Двонаправлений SWDIO)</text>
  <text x="480" y="258" text-anchor="middle" font-size="11" fill="#1a1a1a">DIR=HIGH: Write (A→B) | DIR=LOW: Read (B→A)</text>
  <text x="480" y="278" text-anchor="middle" font-size="11" fill="#2457d6">Керування напрямком: лінія SWDIO_DIR</text>
  <text x="348" y="259" text-anchor="start" font-size="11" font-weight="bold" fill="#2457d6">A</text>
  <text x="612" y="259" text-anchor="end" font-size="11" font-weight="bold" fill="#2457d6">B</text>
  <text x="348" y="299" text-anchor="start" font-size="11" fill="#6b7280">DIR</text>


  <!-- NRST Sub-panel (Open-Drain Driver) -->
  <rect x="340" y="330" width="280" height="75" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Вузол скидання NRST (Open-Drain)</text>
  <text x="480" y="368" text-anchor="middle" font-size="11" fill="#1a1a1a">Транзистор Q1 (N-FET/NPN) + Pull-up R_PU до VCCB</text>
  <text x="480" y="388" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Захист від КЗ при натисканні кнопкою Reset</text>


  <!-- VDD Sense Sub-panel -->
  <rect x="340" y="416" width="280" height="42" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Вимірювання VDD та живлення VCCB</text>
  <text x="480" y="448" text-anchor="middle" font-size="11" fill="#6b7280">Дільник R1/R2 → ADC (Визначення 1.65V–5.5V)</text>


  <!-- Right Panel: Target Board -->
  <rect x="720" y="80" width="210" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="825" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Цільова плата (Target)</text>
  <text x="825" y="124" text-anchor="middle" font-size="12" fill="#6b7280">STM32 / ARM MCU</text>

  <!-- Inner Target MCU Box -->
  <rect x="735" y="140" width="180" height="355" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="825" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Цільовий МК</text>

  <!-- Target Pin Terminals & Labels -->
  <!-- SWCLK -->
  <circle cx="735" cy="175" r="3" fill="#2457d6"/>
  <text x="745" y="179" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">SWCLK</text>

  <!-- SWDIO -->
  <circle cx="735" cy="255" r="3" fill="#2457d6"/>
  <text x="745" y="259" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">SWDIO</text>

  <!-- NRST -->
  <circle cx="735" cy="365" r="3" fill="#27ae60"/>
  <text x="745" y="369" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">NRST</text>

  <!-- VDD_TARGET -->
  <circle cx="735" cy="437" r="3" fill="#c0392b"/>
  <text x="745" y="441" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">VTGT (1.65–5.5V)</text>

  <!-- GND -->
  <circle cx="735" cy="490" r="3" fill="#6b7280"/>
  <text x="745" y="494" text-anchor="start" font-size="11" fill="#6b7280">GND (0V)</text>


  <!-- Connecting Signal Wires & Arrow Paths -->

  <!-- 1. SWCLK Line: Left to U1 to Right -->
  <!-- MCU to U1 -->
  <line x1="225" y1="175" x2="340" y2="175" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="282" y="162" text-anchor="middle" font-size="12" fill="#1a1a1a">SWCLK_MCU</text>

  <!-- U1 to Target -->
  <line x1="620" y1="175" x2="735" y2="175" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="677" y="162" text-anchor="middle" font-size="12" fill="#1a1a1a">SWCLK_TGT</text>


  <!-- 2. SWDIO Signal & Control Lines -->
  <!-- SWDIO Signal MCU to U2 -->
  <line x1="225" y1="255" x2="340" y2="255" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="282" y="242" text-anchor="middle" font-size="12" fill="#1a1a1a">SWDIO_MCU</text>

  <!-- SWDIO Control (DIR) MCU to U2 -->
  <line x1="225" y1="295" x2="340" y2="295" stroke="#6b7280" stroke-dasharray="4,3" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="282" y="312" text-anchor="middle" font-size="11" fill="#6b7280">SWDIO_DIR</text>

  <!-- SWDIO U2 to Target -->
  <line x1="620" y1="255" x2="735" y2="255" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="677" y="242" text-anchor="middle" font-size="12" fill="#1a1a1a">SWDIO_TGT</text>


  <!-- 3. NRST Signal Lines -->
  <!-- MCU to NRST Stage -->
  <line x1="225" y1="365" x2="340" y2="365" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="282" y="352" text-anchor="middle" font-size="12" fill="#1a1a1a">NRST_OUT</text>

  <!-- NRST Stage to Target -->
  <line x1="620" y1="365" x2="735" y2="365" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="677" y="352" text-anchor="middle" font-size="12" fill="#1a1a1a">NRST_TGT</text>


  <!-- 4. VDD Target Sense Line -->
  <!-- Target VDD to Middle Buffer VDD Sense -->
  <line x1="735" y1="437" x2="620" y2="437" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="677" y="424" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">VDD_TARGET</text>

  <!-- Divider to MCU ADC -->
  <line x1="340" y1="437" x2="225" y2="437" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="282" y="424" text-anchor="middle" font-size="12" fill="#1a1a1a">T_VCC_SENSE</text>


  <!-- 5. Common Ground (GND) Line -->
  <line x1="225" y1="490" x2="735" y2="490" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="480" y="475" text-anchor="middle" font-size="11" fill="#6b7280">Спільна земля (GND)</text>

</svg>
