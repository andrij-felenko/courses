<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>
  
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Архітектура USB Composite Device у ST-Link V2.1</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Паралельні інтерфейси зневадження, VCP-термінала та Drag-and-Drop прошивання</text>

  <!-- Host PC Block -->
  <rect x="40" y="76" width="880" height="90" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="55" y="96" font-size="14" font-weight="bold" fill="#1a1a1a">Хост-комп'ютер (USB Host / ПК)</text>
  
  <!-- Host Applications -->
  <rect x="60" y="108" width="270" height="48" rx="4" fill="white" stroke="#2457d6" stroke-width="1"/>
  <text x="195" y="126" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">STM32CubeIDE / GDB</text>
  <text x="195" y="144" font-size="12" fill="#6b7280" text-anchor="middle">ST-Link Vendor Driver</text>

  <rect x="345" y="108" width="270" height="48" rx="4" fill="white" stroke="#27ae60" stroke-width="1"/>
  <text x="480" y="126" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">COM-термінал (VCP)</text>
  <text x="480" y="144" font-size="12" fill="#6b7280" text-anchor="middle">Стандартний USB CDC</text>

  <rect x="630" y="108" width="270" height="48" rx="4" fill="white" stroke="#2457d6" stroke-width="1"/>
  <text x="765" y="126" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Файловий менеджер</text>
  <text x="765" y="144" font-size="12" fill="#6b7280" text-anchor="middle">Drag-and-Drop (.bin / .hex)</text>

  <!-- USB Transport Layer -->
  <rect x="40" y="183" width="130" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="105" y="199" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">USB-кабель (D+/D-)</text>

  <!-- Vertical USB Endpoint Lines -->
  <line x1="195" y1="156" x2="195" y2="234" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <text x="207" y="199" font-size="12" fill="#6b7280" text-anchor="start">Vendor USB</text>

  <line x1="480" y1="156" x2="480" y2="234" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>
  <text x="492" y="199" font-size="12" fill="#6b7280" text-anchor="start">CDC USB</text>

  <line x1="765" y1="156" x2="765" y2="234" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <text x="777" y="199" font-size="12" fill="#6b7280" text-anchor="start">MSC USB</text>

  <!-- ST-Link V2.1 Microcontroller Block -->
  <rect x="40" y="234" width="880" height="194" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="55" y="256" font-size="14" font-weight="bold" fill="#1a1a1a">Мікроконтролер ST-Link V2.1 (USB Composite Device)</text>
  
  <rect x="510" y="240" width="220" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="620" y="255" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">USB Descriptors &amp; Endpoints</text>

  <!-- Interface 0: Vendor Debug -->
  <rect x="60" y="272" width="270" height="144" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="195" y="290" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Інтерфейс 0: Vendor Debug</text>
  <text x="195" y="306" font-size="12" fill="#6b7280" text-anchor="middle">Endpoints: Bulk IN / Bulk OUT</text>
  
  <rect x="75" y="316" width="240" height="88" rx="4" fill="white" stroke="#2457d6" stroke-width="1"/>
  <text x="195" y="333" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Модуль зневадження SWD/JTAG</text>
  <text x="195" y="350" font-size="12" fill="#6b7280" text-anchor="middle">Прямий доступ до пам'яті</text>
  <text x="195" y="367" font-size="12" fill="#6b7280" text-anchor="middle">та регістрів ядра (GDB/SWD)</text>
  <text x="195" y="387" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Протокол: Proprietary ST</text>

  <!-- Interface 1-2: VCP CDC -->
  <rect x="345" y="272" width="270" height="144" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="290" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Інтерфейси 1-2: VCP (CDC)</text>
  <text x="480" y="306" font-size="12" fill="#6b7280" text-anchor="middle">Endpoints: Interrupt IN, Bulk IN/OUT</text>
  
  <rect x="360" y="316" width="240" height="88" rx="4" fill="white" stroke="#27ae60" stroke-width="1"/>
  <text x="480" y="333" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Апаратний міст USB ↔ UART</text>
  <text x="480" y="350" font-size="12" fill="#6b7280" text-anchor="middle">Перетворення USB-пакетів</text>
  <text x="480" y="367" font-size="12" fill="#6b7280" text-anchor="middle">у послідовні символи RX/TX</text>
  <text x="480" y="387" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Стандарт: USB CDC ACM</text>

  <!-- Interface 3: MSC Mass Storage -->
  <rect x="630" y="272" width="270" height="144" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="765" y="290" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Інтерфейс 3: MSC (Mass Storage)</text>
  <text x="765" y="306" font-size="12" fill="#6b7280" text-anchor="middle">Endpoints: Bulk IN / Bulk OUT</text>
  
  <rect x="645" y="316" width="240" height="88" rx="4" fill="white" stroke="#2457d6" stroke-width="1"/>
  <text x="765" y="333" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Віртуальна файл. система FAT</text>
  <text x="765" y="350" font-size="12" fill="#6b7280" text-anchor="middle">Парсинг файлів .bin / .hex</text>
  <text x="765" y="367" font-size="12" fill="#6b7280" text-anchor="middle">та автоматичний Flashloader</text>
  <text x="765" y="387" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Стандарт: USB MSC (BOT)</text>

  <!-- Lines from ST-Link to Target MCU -->
  <line x1="195" y1="428" x2="195" y2="456" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="207" y="446" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">SWD-лінії</text>

  <line x1="480" y1="428" x2="480" y2="456" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="492" y="446" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">TX / RX лінії</text>

  <line x1="765" y1="428" x2="765" y2="456" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="777" y="446" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">Flash-команди</text>

  <!-- Target STM32 MCU Block -->
  <rect x="40" y="456" width="880" height="78" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="55" y="474" font-size="14" font-weight="bold" fill="#1a1a1a">Цільовий мікроконтролер (Target STM32 MCU)</text>

  <rect x="60" y="484" width="270" height="42" rx="4" fill="white" stroke="#2457d6" stroke-width="1"/>
  <text x="195" y="500" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Інтерфейс SWD / JTAG</text>
  <text x="195" y="516" font-size="12" fill="#6b7280" text-anchor="middle">SWDIO, SWCLK, NRST, SWO</text>

  <rect x="345" y="484" width="270" height="42" rx="4" fill="white" stroke="#27ae60" stroke-width="1"/>
  <text x="480" y="500" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Периферія USART (UART)</text>
  <text x="480" y="516" font-size="12" fill="#6b7280" text-anchor="middle">Виводи RX / TX мікроконтролера</text>

  <rect x="630" y="484" width="270" height="42" rx="4" fill="white" stroke="#2457d6" stroke-width="1"/>
  <text x="765" y="500" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Внутрішня Flash-пам'ять</text>
  <text x="765" y="516" font-size="12" fill="#6b7280" text-anchor="middle">Запис через SWD Flashloader</text>
</svg>
