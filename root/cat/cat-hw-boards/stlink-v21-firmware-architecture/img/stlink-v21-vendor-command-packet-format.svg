<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Структура пакетів вендорного протоколу ST-Link V2.1 (ST_LINK_CMD)</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">16-байтовий командний фрейм (Bulk OUT) задає операцію, адресу й довжину для фаз даних та статусу</text>

  <!-- Section 1: 16-Byte Command Packet Panel -->
  <rect x="30" y="72" width="900" height="150" rx="6" ry="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="45" y="92" font-size="13" font-weight="bold" fill="#1a1a1a">Структура 16-байтового командного пакета (EP OUT Command Frame)</text>

  <!-- Byte 0 Block -->
  <rect x="45" y="104" width="110" height="104" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="100" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Byte 0</text>
  <text x="100" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">0xF2 / 0xF1</text>
  <text x="100" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">CMD_CLASS</text>
  <text x="100" y="180" text-anchor="middle" font-size="11" fill="#6b7280">STLINK_DEBUG</text>
  <text x="100" y="196" text-anchor="middle" font-size="11" fill="#6b7280">(Клас команд)</text>

  <!-- Byte 1 Block -->
  <rect x="167" y="104" width="145" height="104" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="239" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Byte 1</text>
  <text x="239" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Sub-Opcode</text>
  <text x="239" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">CMD_TYPE</text>
  <text x="239" y="180" text-anchor="middle" font-size="11" fill="#6b7280">0x07: ReadMem</text>
  <text x="239" y="196" text-anchor="middle" font-size="11" fill="#6b7280">0x08: WriteMem</text>

  <!-- Bytes 2..5 Block -->
  <rect x="324" y="104" width="215" height="104" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="431" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Bytes 2..5</text>
  <text x="431" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">ADDR [31:0]</text>
  <text x="431" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Адреса в пам'яті</text>
  <text x="431" y="180" text-anchor="middle" font-size="11" fill="#6b7280">32-бітний адрес Flash/RAM</text>
  <text x="431" y="196" text-anchor="middle" font-size="11" fill="#6b7280">(Little-Endian порядок)</text>

  <!-- Bytes 6..7 Block -->
  <rect x="551" y="104" width="175" height="104" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="638" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Bytes 6..7</text>
  <text x="638" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">LEN [15:0]</text>
  <text x="638" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Довжина передачі</text>
  <text x="638" y="180" text-anchor="middle" font-size="11" fill="#6b7280">Кількість байтів (L)</text>
  <text x="638" y="196" text-anchor="middle" font-size="11" fill="#6b7280">(16-бітне значення)</text>

  <!-- Bytes 8..15 Block -->
  <rect x="738" y="104" width="177" height="104" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="826" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Bytes 8..15</text>
  <text x="826" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b7280">0x00 ... 0x00</text>
  <text x="826" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Резерв / Заповнення</text>
  <text x="826" y="180" text-anchor="middle" font-size="11" fill="#6b7280">Вирівнювання пакета</text>
  <text x="826" y="196" text-anchor="middle" font-size="11" fill="#6b7280">до розміру 16 байтів</text>

  <!-- Connecting Lines from Command Frame to Transaction Columns -->
  <line x1="172" y1="222" x2="172" y2="247" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="480" y1="222" x2="480" y2="247" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="788" y1="222" x2="788" y2="247" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Section 2: Transaction Flows -->

  <!-- Card 1: Read Memory -->
  <rect x="30" y="250" width="285" height="226" rx="6" ry="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="172" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">1. Читання пам'яті (ReadMem)</text>

  <!-- Card 1 Step 1 -->
  <rect x="45" y="278" width="255" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="172" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Фаза 1: Команда (EP1 OUT)</text>
  <text x="172" y="312" text-anchor="middle" font-size="11" fill="#2457d6">[0xF2][0x07][Addr][Len][0x00...]</text>

  <line x1="172" y1="320" x2="172" y2="338" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Card 1 Step 2 -->
  <rect x="45" y="340" width="255" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="172" y="357" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Фаза 2: Прийом даних (EP1 IN)</text>
  <text x="172" y="374" text-anchor="middle" font-size="11" fill="#1a1a1a">Масив із L байтів з RAM/Flash</text>

  <line x1="172" y1="382" x2="172" y2="400" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Card 1 Step 3 -->
  <rect x="45" y="402" width="255" height="62" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="172" y="419" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Фаза 3: Статус (EP1 IN)</text>
  <text x="172" y="437" text-anchor="middle" font-size="11" fill="#1a1a1a">[0x80][0x00] (2 байти status)</text>
  <text x="172" y="454" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">STLINK_DEBUG_ERR_OK</text>


  <!-- Card 2: Write Memory -->
  <rect x="337" y="250" width="285" height="226" rx="6" ry="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">2. Запис пам'яті (WriteMem)</text>

  <!-- Card 2 Step 1 -->
  <rect x="352" y="278" width="255" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Фаза 1: Команда (EP1 OUT)</text>
  <text x="480" y="312" text-anchor="middle" font-size="11" fill="#2457d6">[0xF2][0x08][Addr][Len][0x00...]</text>

  <line x1="480" y1="320" x2="480" y2="338" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Card 2 Step 2 -->
  <rect x="352" y="340" width="255" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="357" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Фаза 2: Передача даних (EP1 OUT)</text>
  <text x="480" y="374" text-anchor="middle" font-size="11" fill="#1a1a1a">Масив із L байтів для запису</text>

  <line x1="480" y1="382" x2="480" y2="400" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Card 2 Step 3 -->
  <rect x="352" y="402" width="255" height="62" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="419" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Фаза 3: Статус (EP1 IN)</text>
  <text x="480" y="437" text-anchor="middle" font-size="11" fill="#1a1a1a">[0x80][0x00] (підтвердження)</text>
  <text x="480" y="454" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">STLINK_DEBUG_ERR_OK</text>


  <!-- Card 3: Core Control -->
  <rect x="645" y="250" width="285" height="226" rx="6" ry="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="788" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">3. Керування ядром (Core Control)</text>

  <!-- Card 3 Step 1 -->
  <rect x="660" y="278" width="255" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="788" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Фаза 1: Команда (EP1 OUT)</text>
  <text x="788" y="312" text-anchor="middle" font-size="11" fill="#2457d6">[0xF2][OpCode][0x00...0x00]</text>

  <line x1="788" y1="320" x2="788" y2="338" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Card 3 Step 2 -->
  <rect x="660" y="340" width="255" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-dasharray="4 3" stroke-width="1.5"/>
  <text x="788" y="357" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">Фаза 2: Без передачі даних</text>
  <text x="788" y="374" text-anchor="middle" font-size="11" fill="#6b7280">(Дані в USB Bulk не передаються)</text>

  <line x1="788" y1="382" x2="788" y2="400" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Card 3 Step 3 -->
  <rect x="660" y="402" width="255" height="62" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="788" y="419" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Фаза 3: Статус і стан ядра (EP1 IN)</text>
  <text x="788" y="437" text-anchor="middle" font-size="11" fill="#1a1a1a">[0x80][0x00] + [Core_State]</text>
  <text x="788" y="454" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">0x80: HALTED / 0x81: RUNNING</text>


  <!-- Section 3: Status Codes Legend Panel -->
  <rect x="30" y="488" width="900" height="30" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="45" y="507" font-size="11" font-weight="bold" fill="#1a1a1a">Коди відповідей ST-Link V2.1:</text>
  <text x="225" y="507" font-size="11" font-weight="bold" fill="#27ae60">0x80 0x00: ERR_OK</text>
  <text x="345" y="507" font-size="11" font-weight="bold" fill="#c0392b">0x80 0x01: ERR_FAILED</text>
  <text x="488" y="507" font-size="11" font-weight="bold" fill="#6b7280">0x80 0x04: SWD_AP_WAIT</text>
  <text x="635" y="507" font-size="11" font-weight="bold" fill="#c0392b">0x80 0x05: SWD_AP_FAULT</text>
  <text x="788" y="507" font-size="11" font-weight="bold" fill="#6b7280">0x80 0x09: ERR_UNKNOWN</text>
</svg>
