<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Header -->
  <text x="480" y="35" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Співвідношення пакетів USB Bulk та сигналів шини SWD</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Часова послідовність трансляції USB-команд у фізичні такти SWCLK та імпульси SWDIO</text>

  <!-- Main Container -->
  <rect x="30" y="90" width="900" height="445" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>

  <!-- TRACK 1: USB 2.0 Bulk Transport -->
  <text x="50" y="125" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="start">1. Рівень USB 2.0 Bulk (Транспортна шина)</text>
  <line x1="200" y1="170" x2="870" y2="170" stroke="#d0d7de" stroke-width="2"/>

  <!-- Packet A: Bulk OUT Header -->
  <rect x="220" y="145" width="170" height="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="6"/>
  <text x="305" y="166" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">USB Bulk OUT (Cmd Header)</text>
  <text x="305" y="184" font-size="12" fill="#1a1a1a" text-anchor="middle">16 байтів (Опокод + Адреса)</text>

  <!-- Gap indicator -->
  <line x1="395" y1="170" x2="425" y2="170" stroke="#6b7280" stroke-dasharray="3,3" stroke-width="1.5"/>

  <!-- Packet B: Bulk OUT Data Payload -->
  <rect x="430" y="145" width="230" height="50" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="6"/>
  <text x="545" y="166" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">USB Bulk OUT (Data Payload)</text>
  <text x="545" y="184" font-size="12" fill="#1a1a1a" text-anchor="middle">64 байти (Блок даних прошивки)</text>

  <!-- Gap indicator -->
  <line x1="665" y1="170" x2="695" y2="170" stroke="#6b7280" stroke-dasharray="3,3" stroke-width="1.5"/>

  <!-- Packet C: Bulk IN Status CSW -->
  <rect x="700" y="145" width="160" height="50" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5" rx="6"/>
  <text x="780" y="166" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">USB Bulk IN (Status CSW)</text>
  <text x="780" y="184" font-size="12" fill="#6b7280" text-anchor="middle">13 байтів (Статус OK)</text>

  <!-- TRACK 2: ST-Link Buffer & Firmware Processing -->
  <text x="50" y="235" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">2. Буферизація та декодування у ST-Link</text>

  <!-- Connectors from USB Packets down to Processing -->
  <line x1="305" y1="195" x2="305" y2="245" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr-blue)"/>
  <line x1="545" y1="195" x2="545" y2="245" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr-green)"/>

  <!-- Processing Box -->
  <rect x="220" y="248" width="640" height="42" fill="white" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="320" y="274" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Декодування команд (Cmd Parse)</text>

  <line x1="420" y1="248" x2="420" y2="290" stroke="#d0d7de" stroke-width="1"/>
  <text x="550" y="274" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Формування бітової черги SWD</text>

  <line x1="680" y1="248" x2="680" y2="290" stroke="#d0d7de" stroke-width="1"/>
  <text x="770" y="274" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Запис статусу CSW (IN)</text>

  <!-- TRACK 3: Physical SWD Interface Signals -->
  <text x="50" y="330" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="start">3. Фізичні сигнали шини SWD (4 МГц)</text>
  <line x1="550" y1="290" x2="550" y2="340" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr-green)"/>

  <!-- Signal Labels -->
  <text x="50" y="375" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="start">SWCLK</text>
  <text x="50" y="393" font-size="12" fill="#6b7280" text-anchor="start">(4 МГц, T = 250 нс)</text>

  <text x="50" y="455" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="start">SWDIO</text>
  <text x="50" y="473" font-size="12" fill="#6b7280" text-anchor="start">(Двонаправлена)</text>

  <!-- SWCLK Waveform -->
  <path d="M 220,390 L 220,365 L 240,365 L 240,390 L 260,390 L 260,365 L 280,365 L 280,390 L 300,390 L 300,365 L 320,365 L 320,390 L 340,390 L 340,365 L 360,365 L 360,390 L 380,390 L 380,365 L 400,365 L 400,390 L 420,390 L 420,365 L 440,365 L 440,390 L 460,390 L 460,365 L 480,365 L 480,390 L 500,390 L 500,365 L 520,365 L 520,390 L 540,390 L 540,365 L 560,365 L 560,390 L 580,390 L 580,365 L 600,365 L 600,390 L 620,390 L 620,365 L 640,365 L 640,390 L 660,390 L 660,365 L 680,365 L 680,390 L 700,390 L 700,365 L 720,365 L 720,390 L 740,390 L 740,365 L 760,365 L 760,390 L 780,390 L 780,365 L 800,365 L 800,390 L 820,390 L 820,365 L 840,365 L 840,390 L 860,390" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- SWDIO Phase Boxes -->
  <!-- Phase 1: Header -->
  <rect x="220" y="440" width="120" height="42" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="280" y="457" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Запит (Header)</text>
  <text x="280" y="474" font-size="12" fill="#1a1a1a" text-anchor="middle">8 тактів (Host→МК)</text>

  <!-- Phase 2: TRN 1 -->
  <rect x="345" y="440" width="45" height="42" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5" rx="4"/>
  <text x="367" y="457" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">TRN</text>
  <text x="367" y="474" font-size="12" fill="#6b7280" text-anchor="middle">1 такт</text>

  <!-- Phase 3: ACK -->
  <rect x="395" y="440" width="80" height="42" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="435" y="457" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">ACK (OK)</text>
  <text x="435" y="474" font-size="12" fill="#1a1a1a" text-anchor="middle">3 такти</text>

  <!-- Phase 4: TRN 2 -->
  <rect x="480" y="440" width="45" height="42" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5" rx="4"/>
  <text x="502" y="457" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">TRN</text>
  <text x="502" y="474" font-size="12" fill="#6b7280" text-anchor="middle">1 такт</text>

  <!-- Phase 5: Data Phase -->
  <rect x="530" y="440" width="250" height="42" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="4"/>
  <text x="655" y="457" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Фаза даних (Data Phase + Parity)</text>
  <text x="655" y="474" font-size="12" fill="#1a1a1a" text-anchor="middle">33 такти (32 біти + біт паритету)</text>

  <!-- Phase 6: Idle -->
  <rect x="785" y="440" width="75" height="42" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="4"/>
  <text x="822" y="457" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Пауза</text>
  <text x="822" y="474" font-size="12" fill="#6b7280" text-anchor="middle">2 такти</text>

  <!-- Summary Footer Caption -->
  <text x="480" y="512" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Сумарна тривалість 32-бітної SWD-транзакції: 48 тактів SWCLK = 12 мікросекунд (при 4 МГц)</text>
</svg>
