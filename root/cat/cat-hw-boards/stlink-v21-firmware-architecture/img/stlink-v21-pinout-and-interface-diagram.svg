<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Апаратний інтерфейс та розпіновка ST-Link V2.1</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Узгодження рівнів TVCC (1.65–3.6 В), інтерфейси зневадження SWD/JTAG та VCP UART</text>

  <!-- Left Panel: ST-Link V2.1 -->
  <rect x="30" y="75" width="280" height="440" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="40" y="85" width="260" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="170" y="105" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">ST-Link V2.1 (Відлагоджувач)</text>

  <!-- ST-Link Level Shifter -->
  <rect x="45" y="127" width="250" height="63" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="170" y="145" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Двонаправлені буфери (Level Shifter)</text>
  <text x="170" y="163" font-size="12" fill="#6b7280" text-anchor="middle">Живлення від входу TVCC (1.65–3.6 В)</text>
  <text x="170" y="181" font-size="12" fill="#2457d6" text-anchor="middle">Адаптація рівнів ST-Link &lt;-&gt; MCU</text>

  <!-- ST-Link Debug Engine -->
  <rect x="45" y="202" width="250" height="150" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="170" y="220" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Контролер SWD / JTAG &amp; NRST</text>
  <text x="170" y="242" font-size="12" fill="#6b7280" text-anchor="middle">Генерація SWCLK / TCK</text>
  <text x="170" y="264" font-size="12" fill="#6b7280" text-anchor="middle">Обробка даних SWDIO / TMS</text>
  <text x="170" y="286" font-size="12" fill="#6b7280" text-anchor="middle">Прийом трасувальних даних SWO</text>
  <text x="170" y="308" font-size="12" fill="#6b7280" text-anchor="middle">Управління скиданням NRST</text>
  <text x="170" y="334" font-size="12" fill="#2457d6" text-anchor="middle">Підтримка протоколів SWD та JTAG</text>

  <!-- ST-Link VCP UART -->
  <rect x="45" y="365" width="250" height="82" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="170" y="388" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Віртуальний COM-порт (USB VCP)</text>
  <text x="170" y="410" font-size="12" fill="#6b7280" text-anchor="middle">Міст USB &lt;-&gt; UART (Tx / Rx)</text>
  <text x="170" y="434" font-size="12" fill="#27ae60" text-anchor="middle">Швидкість до 2.25 Мбіт/с</text>

  <!-- ST-Link GND -->
  <rect x="45" y="460" width="250" height="42" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="170" y="485" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Спільна шина заземлення (GND)</text>


  <!-- Right Panel: Target MCU -->
  <rect x="650" y="75" width="280" height="440" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="660" y="85" width="260" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="790" y="105" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Цільовий мікроконтролер (Target)</text>

  <!-- Target VDD -->
  <rect x="665" y="127" width="250" height="63" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="790" y="145" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Шина живлення цілі (VDD)</text>
  <text x="790" y="163" font-size="12" fill="#6b7280" text-anchor="middle">Напруга ядра / периферії 1.65–3.6 В</text>
  <text x="790" y="181" font-size="12" fill="#c0392b" text-anchor="middle">Подає напругу на вхід TVCC</text>

  <!-- Target Debug Module -->
  <rect x="665" y="202" width="250" height="150" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="790" y="220" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Ядро ARM Cortex-M &amp; Debug</text>
  <text x="790" y="242" font-size="12" fill="#6b7280" text-anchor="middle">SWCLK: вхід тактування (PA14)</text>
  <text x="790" y="264" font-size="12" fill="#6b7280" text-anchor="middle">SWDIO: лінії даних / команд (PA13)</text>
  <text x="790" y="286" font-size="12" fill="#6b7280" text-anchor="middle">SWO: вихід виводу трасування (PB3)</text>
  <text x="790" y="308" font-size="12" fill="#6b7280" text-anchor="middle">NRST: вхід скидання мікроконтролера</text>
  <text x="790" y="334" font-size="12" fill="#2457d6" text-anchor="middle">Внутрішні регістраційні pull-підтяжки</text>

  <!-- Target USART -->
  <rect x="665" y="365" width="250" height="82" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="790" y="388" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Периферійний модуль USART1</text>
  <text x="790" y="410" font-size="12" fill="#6b7280" text-anchor="middle">USART1_RX: прийом даних (PA10)</text>
  <text x="790" y="434" font-size="12" fill="#27ae60" text-anchor="middle">USART1_TX: передача даних (PA9)</text>

  <!-- Target GND -->
  <rect x="665" y="460" width="250" height="42" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="790" y="485" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Спільний дріт заземлення (GND)</text>


  <!-- Middle Signal Lines & Connections -->

  <!-- 1. TVCC Line -->
  <line x1="650" y1="145" x2="310" y2="145" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <circle cx="310" cy="145" r="4" fill="#c0392b"/>
  <circle cx="650" cy="145" r="4" fill="#c0392b"/>
  <text x="480" y="138" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">TVCC (Моніторинг напруги 1.65–3.6 В)</text>

  <!-- 2. SWCLK Line -->
  <line x1="310" y1="220" x2="650" y2="220" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <circle cx="310" cy="220" r="4" fill="#2457d6"/>
  <circle cx="650" cy="220" r="4" fill="#2457d6"/>
  <text x="480" y="213" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">SWCLK / TCK (Тактова лінія ST-Link -&gt; MCU)</text>

  <!-- 3. SWDIO Line -->
  <line x1="310" y1="255" x2="650" y2="255" stroke="#2457d6" stroke-width="2" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
  <circle cx="310" cy="255" r="4" fill="#2457d6"/>
  <circle cx="650" cy="255" r="4" fill="#2457d6"/>
  <text x="480" y="248" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">SWDIO / TMS (Двонаправлена лінія даних)</text>

  <!-- 4. SWO Line -->
  <line x1="650" y1="290" x2="310" y2="290" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <circle cx="310" cy="290" r="4" fill="#2457d6"/>
  <circle cx="650" cy="290" r="4" fill="#2457d6"/>
  <text x="480" y="283" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">SWO / TDO (Вихід трасування MCU -&gt; ST-Link)</text>

  <!-- 5. NRST Line -->
  <line x1="310" y1="325" x2="650" y2="325" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-black)"/>
  <circle cx="310" cy="325" r="4" fill="#1a1a1a"/>
  <circle cx="650" cy="325" r="4" fill="#1a1a1a"/>
  <text x="480" y="318" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">NRST (Лінія скидання Open-Drain)</text>

  <!-- 6. UART TX Line -->
  <line x1="310" y1="385" x2="650" y2="385" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <circle cx="310" cy="385" r="4" fill="#27ae60"/>
  <circle cx="650" cy="385" r="4" fill="#27ae60"/>
  <text x="480" y="378" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">UART_TX -&gt; USART1_RX (PA10)</text>

  <!-- 7. UART RX Line -->
  <line x1="650" y1="420" x2="310" y2="420" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <circle cx="310" cy="420" r="4" fill="#27ae60"/>
  <circle cx="650" cy="420" r="4" fill="#27ae60"/>
  <text x="480" y="413" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">UART_RX &lt;- USART1_TX (PA9)</text>

  <!-- 8. GND Line -->
  <line x1="310" y1="480" x2="650" y2="480" stroke="#6b7280" stroke-width="2" stroke-dasharray="6,4"/>
  <circle cx="310" cy="480" r="4" fill="#6b7280"/>
  <circle cx="650" cy="480" r="4" fill="#6b7280"/>
  <text x="480" y="473" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Спільний провід заземлення (GND)</text>
</svg>
