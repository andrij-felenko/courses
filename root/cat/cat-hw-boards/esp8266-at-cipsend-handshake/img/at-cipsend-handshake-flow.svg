<svg viewBox="0 0 720 520" width="720" height="520" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-req" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-res" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="520" fill="white"/>

  <text x="360" y="40" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Двофазна передача даних через AT+CIPSEND</text>
  <text x="360" y="60" font-size="13" text-anchor="middle" fill="#6b7280">ESP8266 очікує дані лише після відправки символу-запрошення «&gt;»</text>

  <rect x="130" y="90" width="140" height="40" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="200" y="115" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Хост-МК</text>

  <rect x="450" y="90" width="140" height="40" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="520" y="115" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">ESP8266</text>

  <line x1="200" y1="130" x2="200" y2="500" stroke="#d0d7de" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="520" y1="130" x2="520" y2="500" stroke="#d0d7de" stroke-width="2" stroke-dasharray="6 4"/>

  <text x="360" y="155" font-size="14" font-weight="bold" text-anchor="middle" fill="#2457d6">1. Команда підготовки</text>
  <line x1="200" y1="170" x2="510" y2="170" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-req)"/>
  <text x="360" y="198" font-size="13" text-anchor="middle" fill="#2457d6">AT+CIPSEND=12</text>

  <text x="360" y="245" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">2. Дозвіл на передачу</text>
  <line x1="520" y1="260" x2="210" y2="260" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-res)"/>
  <text x="360" y="288" font-size="13" text-anchor="middle" fill="#1a1a1a">OK, потім запрошення «&gt;»</text>

  <text x="360" y="335" font-size="14" font-weight="bold" text-anchor="middle" fill="#2457d6">3. Передача сирих даних</text>
  <line x1="200" y1="350" x2="510" y2="350" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-req)"/>
  <text x="360" y="378" font-size="13" text-anchor="middle" fill="#2457d6">"Hello World!" (рівно 12 байтів)</text>

  <text x="360" y="425" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">4. Підтвердження отримання</text>
  <line x1="520" y1="440" x2="210" y2="440" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-res)"/>
  <text x="360" y="468" font-size="13" text-anchor="middle" fill="#1a1a1a">SEND OK</text>
</svg>
