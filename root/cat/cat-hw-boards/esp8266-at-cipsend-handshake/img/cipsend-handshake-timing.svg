<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <text x="480" y="40" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Часова діаграма двофазної передачі даних AT+CIPSEND</text>
  <text x="480" y="60" font-size="13" text-anchor="middle" fill="#6b7280">Дві фази обміну зумовлюють різні таймаути: для очікування запрошення і для підтвердження відправки</text>

  <!-- Host MCU Timeline -->
  <text x="80" y="130" font-size="14" font-weight="bold" text-anchor="end" fill="#1a1a1a">Host MCU</text>
  <line x1="100" y1="125" x2="880" y2="125" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  
  <!-- ESP8266 Timeline -->
  <text x="80" y="270" font-size="14" font-weight="bold" text-anchor="end" fill="#1a1a1a">ESP8266</text>
  <line x1="100" y1="265" x2="880" y2="265" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Blocks on Host Timeline -->
  <rect x="120" y="105" width="120" height="40" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="180" y="130" font-size="13" text-anchor="middle" fill="#1a1a1a">AT+CIPSEND=N</text>

  <rect x="420" y="105" width="140" height="40" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="490" y="130" font-size="13" text-anchor="middle" fill="#1a1a1a">Дані (N байт)</text>

  <!-- Blocks on ESP8266 Timeline -->
  <rect x="280" y="245" width="80" height="40" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="320" y="270" font-size="13" text-anchor="middle" fill="#1a1a1a">\r\nOK\r\n&gt; </text>

  <rect x="700" y="245" width="120" height="40" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="760" y="270" font-size="13" text-anchor="middle" fill="#1a1a1a">SEND OK</text>

  <!-- Interaction Arrows -->
  <line x1="240" y1="145" x2="280" y2="245" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr)"/>
  <line x1="360" y1="245" x2="420" y2="145" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr)"/>
  <line x1="560" y1="145" x2="700" y2="245" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr)"/>

  <!-- Host Dimension Lines (Timeouts) -->
  <!-- T_cmd -->
  <line x1="120" y1="80" x2="120" y2="105" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="240" y1="80" x2="240" y2="105" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="120" y1="85" x2="240" y2="85" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="180" y="75" font-size="13" font-style="italic" text-anchor="middle" fill="#1a1a1a">T<tspan baseline-shift="sub" font-size="10">cmd</tspan></text>

  <!-- Timeout 1 -->
  <line x1="420" y1="80" x2="420" y2="105" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="240" y1="85" x2="420" y2="85" stroke="#2457d6" stroke-width="2" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
  <text x="330" y="75" font-size="13" font-style="italic" text-anchor="middle" fill="#2457d6">Timeout 1 (до &gt;)</text>

  <!-- T_data -->
  <line x1="560" y1="80" x2="560" y2="105" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="420" y1="70" x2="420" y2="85" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="420" y1="75" x2="560" y2="75" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="490" y="65" font-size="13" font-style="italic" text-anchor="middle" fill="#1a1a1a">T<tspan baseline-shift="sub" font-size="10">data</tspan></text>

  <!-- Timeout 2 -->
  <line x1="840" y1="80" x2="840" y2="245" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="560" y1="85" x2="840" y2="85" stroke="#2457d6" stroke-width="2" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
  <text x="700" y="75" font-size="13" font-style="italic" text-anchor="middle" fill="#2457d6">Timeout 2 (до SEND OK)</text>

  <!-- ESP Dimension Lines -->
  <!-- ΔT_prompt -->
  <line x1="240" y1="290" x2="240" y2="305" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="240" y1="245" x2="240" y2="290" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="280" y1="290" x2="280" y2="305" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="240" y1="295" x2="280" y2="295" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="260" y="315" font-size="13" font-style="italic" text-anchor="middle" fill="#1a1a1a">ΔT<tspan baseline-shift="sub" font-size="10">prompt</tspan></text>

  <!-- ΔT_network -->
  <line x1="560" y1="245" x2="560" y2="305" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="700" y1="290" x2="700" y2="305" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="560" y1="295" x2="700" y2="295" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="630" y="315" font-size="13" font-style="italic" text-anchor="middle" fill="#1a1a1a">ΔT<tspan baseline-shift="sub" font-size="10">network</tspan></text>

  <!-- Annotations for delays (adjusted to avoid overlapping lines or blocks) -->
  <text x="265" y="195" font-size="12" text-anchor="middle" fill="#6b7280">Передача і парсинг</text>

  <text x="390" y="225" font-size="12" text-anchor="middle" fill="#6b7280">Обробка і запрошення</text>
  
  <text x="635" y="195" font-size="12" text-anchor="middle" fill="#6b7280">Затримка мережі / lwIP</text>

  <!-- Explanation Panels -->
  <rect x="110" y="340" width="320" height="90" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="270" y="365" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Фаза 1: Запит</text>
  <text x="270" y="385" font-size="13" text-anchor="middle" fill="#1a1a1a">Хост відправляє команду</text>
  <text x="270" y="400" font-size="13" text-anchor="middle" fill="#1a1a1a">й очікує запрошення &gt;</text>
  <text x="270" y="420" font-size="13" font-family="monospace" text-anchor="middle" fill="#2457d6">Timeout1 = T_cmd + ΔT_prompt</text>

  <rect x="450" y="340" width="410" height="90" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="655" y="365" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Фаза 2: Передача даних</text>
  <text x="655" y="385" font-size="13" text-anchor="middle" fill="#1a1a1a">Хост відсилає порцію бінарних даних</text>
  <text x="655" y="400" font-size="13" text-anchor="middle" fill="#1a1a1a">і чекає підтвердження успішної передачі</text>
  <text x="655" y="420" font-size="13" font-family="monospace" text-anchor="middle" fill="#2457d6">Timeout2 = T_data + ΔT_network</text>

</svg>
