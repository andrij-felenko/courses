<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <text x="480" y="40" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Двофазний хендшейк передачі даних AT+CIPSEND</text>
  <text x="480" y="60" font-size="13" text-anchor="middle" fill="#6b7280">Розділення фази заявки на буфер та надсилання двійкового корисного навантаження</text>

  <!-- Lifelines -->
  <line x1="200" y1="110" x2="200" y2="520" stroke="#d0d7de" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="480" y1="110" x2="480" y2="520" stroke="#d0d7de" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="760" y1="110" x2="760" y2="520" stroke="#d0d7de" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Headers -->
  <rect x="120" y="80" width="160" height="30" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="4"/>
  <text x="200" y="100" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Host (MCU)</text>

  <rect x="380" y="80" width="200" height="30" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="4"/>
  <text x="480" y="100" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">UART Interpreter</text>

  <rect x="680" y="80" width="160" height="30" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="4"/>
  <text x="760" y="100" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">lwIP Stack</text>

  <!-- Phase 1 Box -->
  <rect x="40" y="120" width="880" height="140" fill="#eaf0fd" fill-opacity="0.5" stroke="#2457d6" stroke-dasharray="4 4" rx="4"/>
  <text x="50" y="140" font-size="13" font-weight="bold" fill="#2457d6">Фаза 1: Запит довжини та виділення буфера</text>

  <!-- Phase 2 Box -->
  <rect x="40" y="300" width="880" height="170" fill="#e9f7ef" fill-opacity="0.5" stroke="#27ae60" stroke-dasharray="4 4" rx="4"/>
  <text x="50" y="320" font-size="13" font-weight="bold" fill="#27ae60">Фаза 2: Надсилання корисного навантаження (Payload)</text>

  <!-- Processing Rectangles -->
  <rect x="192" y="150" width="16" height="100" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <rect x="472" y="150" width="16" height="100" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <rect x="752" y="180" width="16" height="40" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>

  <rect x="192" y="340" width="16" height="120" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <rect x="472" y="340" width="16" height="120" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <rect x="752" y="370" width="16" height="50" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>

  <!-- Gap / Wait State -->
  <line x1="480" y1="250" x2="480" y2="340" stroke="#c0392b" stroke-width="4" stroke-dasharray="4 4"/>
  
  <text x="180" y="285" font-size="12" text-anchor="end" fill="#6b7280">Очікування символу &gt; </text>
  <text x="180" y="300" font-size="12" text-anchor="end" fill="#6b7280">без \r\n</text>

  <text x="495" y="285" font-size="12" fill="#c0392b">Буфер UART приймає сирі байти,</text>
  <text x="495" y="300" font-size="12" fill="#c0392b">ігноруючи нові AT-команди</text>

  <!-- Host Notes -->
  <text x="180" y="170" font-size="12" text-anchor="end" fill="#6b7280">Формування команди</text>
  <text x="180" y="185" font-size="12" text-anchor="end" fill="#6b7280">з довжиною payload</text>

  <text x="180" y="375" font-size="12" text-anchor="end" fill="#6b7280">Очікування підтвердження</text>
  <text x="180" y="390" font-size="12" text-anchor="end" fill="#6b7280">про успішну відправку</text>

  <!-- UART Notes -->
  <text x="495" y="170" font-size="12" fill="#2457d6">Парсинг AT-команди</text>
  <text x="495" y="445" font-size="12" fill="#27ae60">Формування SEND OK</text>

  <!-- Messages -->
  <!-- 1. AT+CIPSEND=5 -->
  <line x1="208" y1="160" x2="466" y2="160" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="339" y="152" font-size="13" font-family="monospace" text-anchor="middle" fill="#1a1a1a">AT+CIPSEND=5\r\n</text>

  <!-- 2. Alloc -->
  <line x1="488" y1="190" x2="746" y2="190" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="617" y="182" font-size="13" text-anchor="middle" fill="#1a1a1a">Запит виділення пам'яті (5 байтів)</text>

  <!-- 3. OK Alloc -->
  <line x1="752" y1="215" x2="494" y2="215" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="623" y="207" font-size="13" text-anchor="middle" fill="#1a1a1a">Буфер виділено успішно</text>

  <!-- 4. \r\nOK\r\n> -->
  <line x1="472" y1="240" x2="214" y2="240" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="343" y="232" font-size="13" font-family="monospace" text-anchor="middle" fill="#1a1a1a">\r\nOK\r\n&gt; </text>

  <!-- 5. "Hello" -->
  <line x1="208" y1="350" x2="466" y2="350" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="339" y="342" font-size="13" font-family="monospace" text-anchor="middle" fill="#1a1a1a">"Hello"</text>
  <text x="339" y="364" font-size="12" text-anchor="middle" fill="#6b7280">(5 байтів бінарного payload)</text>

  <!-- 6. To lwIP -->
  <line x1="488" y1="380" x2="746" y2="380" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="617" y="372" font-size="13" text-anchor="middle" fill="#1a1a1a">Запис даних у TCP-буфер</text>

  <!-- 7. From lwIP -->
  <line x1="752" y1="415" x2="494" y2="415" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="623" y="407" font-size="13" text-anchor="middle" fill="#1a1a1a">Успішно поміщено в чергу TX</text>

  <!-- 8. SEND OK -->
  <line x1="472" y1="450" x2="214" y2="450" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="343" y="442" font-size="13" font-family="monospace" text-anchor="middle" fill="#1a1a1a">\r\nSEND OK\r\n</text>

</svg>
