<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма заповнення FIFO-буфера та зміни стану лінії RTS</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Сигнал готовності змінюється до вичерпання 128-байтового ліміту FIFO</text>

  <!-- Background panel for diagram area -->
  <rect x="60" y="80" width="840" height="330" fill="#f4f6f8" stroke="#d0d7de" rx="6"/>

  <!-- Y Axis Labels -->
  <!-- UART TX / FIFO Fill -->
  <text x="80" y="125" font-size="13" fill="#1a1a1a" font-weight="bold">FIFO Bytes</text>
  <text x="80" y="142" font-size="12" fill="#6b7280">128 B (Full)</text>
  <text x="80" y="212" font-size="12" fill="#6b7280">Threshold</text>
  <text x="80" y="240" font-size="12" fill="#6b7280">0 B (Empty)</text>

  <!-- RTS Line -->
  <text x="80" y="295" font-size="13" fill="#1a1a1a" font-weight="bold">RTS Pin</text>
  <text x="80" y="315" font-size="12" fill="#27ae60">Low (Ready)</text>
  <text x="80" y="365" font-size="12" fill="#c0392b">High (Hold)</text>

  <!-- Timeline Axes -->
  <line x1="180" y1="130" x2="880" y2="130" stroke="#d0d7de" stroke-dasharray="4,4"/>
  <line x1="180" y1="235" x2="880" y2="235" stroke="#d0d7de" stroke-dasharray="4,4"/>
  <line x1="180" y1="240" x2="880" y2="240" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- RTS Axis -->
  <line x1="180" y1="310" x2="880" y2="310" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="180" y1="360" x2="880" y2="360" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- FIFO Fill Waveform (Ramp up, then threshold trigger, then drop) -->
  <polyline fill="none" stroke="#2457d6" stroke-width="2.5" points="
    180,240
    320,180
    460,130
    500,130
    560,200
    700,240
    880,240
  "/>

  <!-- RTS Waveform -->
  <polyline fill="none" stroke="#27ae60" stroke-width="2.5" points="
    180,310
    450,310
    470,360
    720,360
    740,310
    880,310
  "/>

  <!-- Vertical markers / annotations -->
  <line x1="460" y1="100" x2="460" y2="380" stroke="#c0392b" stroke-dasharray="3,3" stroke-width="1.5"/>
  <text x="465" y="115" font-size="12" fill="#c0392b" font-weight="bold">Рівень спрацьовування RTS</text>

  <line x1="700" y1="100" x2="700" y2="380" stroke="#27ae60" stroke-dasharray="3,3" stroke-width="1.5"/>
  <text x="705" y="115" font-size="12" fill="#27ae60" font-weight="bold">Спорожнення буфера</text>

  <!-- Time axis arrow at bottom -->
  <line x1="180" y1="390" x2="880" y2="390" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="885" y="394" font-size="12" fill="#1a1a1a">Час (t)</text>

</svg>
