<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Структура регістра завантаження та лог boot mode:(P1,P2,P3)</text>
  <text x="480" y="54" font-size="13" text-anchor="middle" fill="#6b7280">Параметр P1 кодує strapping-виводи (GPIO15, GPIO0, GPIO2), P2 — частоту кварцю, P3 — режим Flash</text>

  <!-- Верхня панель: Console Boot Log -->
  <rect x="140" y="72" width="680" height="54" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="160" y="92" font-size="12" font-weight="700" fill="#6b7280">Рядок логу ROM-завантажувача у послідовному порту UART0 (74880 бод):</text>
  <text x="160" y="113" font-size="15" font-weight="700" fill="#1a1a1a">ets Jan  8 2013, rst cause:1, boot mode:(<tspan fill="#2457d6">P1</tspan>, <tspan fill="#27ae60">P2</tspan>, <tspan fill="#6b7280">P3</tspan>)</text>

  <!-- Стрілки-вказівники від логу до панелей -->
  <line x1="300" y1="126" x2="300" y2="144" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="770" y1="126" x2="770" y2="144" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Панель 1: Параметр P1 (Strapping Register & Modes) -->
  <rect x="20" y="150" width="560" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="40" y="176" font-size="14" font-weight="700" fill="#2457d6">Параметр P1 — Трибітний регістр strapping-виводів</text>
  <text x="40" y="194" font-size="12" fill="#6b7280">Формула обчислення: P1 = (GPIO2 × 4) + (GPIO0 × 2) + (GPIO15 × 1)</text>

  <!-- Бітова структура P1 -->
  <rect x="40" y="210" width="160" height="42" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="120" y="228" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">Біт 2: GPIO2</text>
  <text x="120" y="244" font-size="12" text-anchor="middle" fill="#6b7280">Вага 4 (0b100)</text>

  <rect x="210" y="210" width="160" height="42" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="290" y="228" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">Біт 1: GPIO0</text>
  <text x="290" y="244" font-size="12" text-anchor="middle" fill="#6b7280">Вага 2 (0b010)</text>

  <rect x="380" y="210" width="180" height="42" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="470" y="228" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">Біт 0: GPIO15</text>
  <text x="470" y="244" font-size="12" text-anchor="middle" fill="#6b7280">Вага 1 (0b001)</text>

  <!-- Режими P1 -->
  <!-- Mode 1: SPI Flash Boot -->
  <rect x="40" y="268" width="520" height="48" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="54" y="287" font-size="13" font-weight="700" fill="#27ae60">P1 = 3 (0b011) — SPI Flash Boot [Штатний запуск]</text>
  <text x="54" y="304" font-size="12" fill="#1a1a1a">GPIO15=0, GPIO0=1, GPIO2=1 — Виконання прошивки користувача з Flash</text>

  <!-- Mode 2: UART Download -->
  <rect x="40" y="324" width="520" height="48" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="54" y="343" font-size="13" font-weight="700" fill="#2457d6">P1 = 1 (0b001) — UART Download Mode [Програмування]</text>
  <text x="54" y="360" font-size="12" fill="#1a1a1a">GPIO15=0, GPIO0=0, GPIO2=1 — Режим запису прошивки у Flash через UART0</text>

  <!-- Mode 3: SDIO Boot -->
  <rect x="40" y="380" width="520" height="48" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="54" y="399" font-size="13" font-weight="700" fill="#1a1a1a">P1 = 7 (0b111) — SDIO Boot [Режим модема]</text>
  <text x="54" y="416" font-size="12" fill="#6b7280">GPIO15=1, GPIO0=1, GPIO2=1 — Завантаження коду через інтерфейс SDIO</text>

  <!-- Mode 4: Error Boot -->
  <rect x="40" y="436" width="520" height="48" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="54" y="455" font-size="13" font-weight="700" fill="#c0392b">P1 = 0 або (x, 0) — Помилка завантаження / Boot Loop</text>
  <text x="54" y="472" font-size="12" fill="#1a1a1a">GPIO2=0 або плаваючий GPIO15=1 — Відмова старту, зациклення ROM</text>

  <!-- Панель 2: Параметри P2 і P3 (XTAL та Flash Mode) -->
  <rect x="600" y="150" width="340" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Секція P2 -->
  <text x="618" y="176" font-size="14" font-weight="700" fill="#27ae60">Параметр P2 — Частота кварцу</text>
  <text x="618" y="194" font-size="12" fill="#6b7280">Автовизначення резонатора XTAL</text>

  <rect x="618" y="208" width="304" height="44" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="630" y="226" font-size="13" font-weight="700" fill="#1a1a1a">P2 = 6 — Кварцевий резонатор 26 МГц</text>
  <text x="630" y="242" font-size="12" fill="#6b7280">Стандартна частота для ESP-01 / ESP-12</text>

  <rect x="618" y="258" width="304" height="44" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="630" y="276" font-size="13" font-weight="700" fill="#1a1a1a">P2 = 4 — Кварцевий резонатор 40 МГц</text>
  <text x="630" y="292" font-size="12" fill="#6b7280">Альтернативна частота резонатора</text>

  <!-- Секція P3 -->
  <text x="618" y="332" font-size="14" font-weight="700" fill="#6b7280">Параметр P3 — Інтерфейс Flash</text>
  <text x="618" y="350" font-size="12" fill="#6b7280">Режим шини та мапування пам'яті</text>

  <rect x="618" y="364" width="304" height="44" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="630" y="382" font-size="13" font-weight="700" fill="#1a1a1a">P3 = 6 / 7 — QSPI Direct Flash Boot</text>
  <text x="630" y="398" font-size="12" fill="#6b7280">Пряме виконання (QIO, QOUT, DIO, DOUT)</text>

  <rect x="618" y="414" width="304" height="44" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="630" y="432" font-size="13" font-weight="700" fill="#1a1a1a">P3 = 0..5 — SDIO / Slave Mapping</text>
  <text x="630" y="448" font-size="12" fill="#6b7280">Мапування шини Flash на SDIO хост</text>
</svg>
