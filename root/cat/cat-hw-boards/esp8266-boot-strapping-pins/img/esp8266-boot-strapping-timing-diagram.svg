<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма защепкування режимів завантаження ESP8266</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Фіксація рівнів GPIO0, GPIO2 та GPIO15 відбувається на зростаючому фронті RST у вікні Latch-in</text>

  <!-- Latch Window Shading -->
  <rect x="420" y="70" width="100" height="335" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4 4" rx="4"/>
  <text x="470" y="85" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Вікно Latch-in</text>

  <!-- Timing arrows for setup and hold -->
  <line x1="420" y1="118" x2="452" y2="118" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr-dark)"/>
  <text x="430" y="112" font-size="12" fill="#1a1a1a">t_setup</text>
  <line x1="468" y1="118" x2="512" y2="118" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr-dark)"/>
  <text x="480" y="112" font-size="12" fill="#1a1a1a">t_hold</text>

  <!-- Vertical Trigger Edge Line -->
  <line x1="460" y1="70" x2="460" y2="400" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- Signal 1: CH_PD (EN) -->
  <text x="160" y="100" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">CH_PD (EN)</text>
  <path d="M 180 95 L 900 95" stroke="#2457d6" stroke-width="2.5" fill="none"/>
  <text x="190" y="90" font-size="12" fill="#2457d6">HIGH (3.3V)</text>

  <!-- Signal 2: RST -->
  <text x="160" y="165" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">RST (Reset)</text>
  <path d="M 180 170 L 450 170 L 470 150 L 900 150" stroke="#2457d6" stroke-width="2.5" fill="none"/>
  <text x="190" y="165" font-size="12" fill="#6b7280">LOW (Reset)</text>
  <text x="490" y="145" font-size="12" font-weight="bold" fill="#27ae60">Фронт зчитування</text>

  <!-- Signal 3: GPIO15 -->
  <text x="160" y="235" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">GPIO15 (MTDO)</text>
  <path d="M 180 240 L 520 240" stroke="#c0392b" stroke-width="2.5" fill="none"/>
  <path d="M 520 240 L 900 240" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <text x="270" y="232" font-size="12" font-weight="bold" fill="#c0392b">Обов'язково LOW (0V)</text>
  <text x="620" y="232" font-size="12" fill="#6b7280">Вільний вивід (користувацький)</text>

  <!-- Signal 4: GPIO0 -->
  <text x="160" y="305" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">GPIO0</text>
  <path d="M 180 295 L 520 295" stroke="#27ae60" stroke-width="2.5" fill="none"/>
  <text x="270" y="290" font-size="12" font-weight="bold" fill="#27ae60">HIGH = 1 (Flash Boot)</text>
  <path d="M 520 295 L 900 295" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>

  <path d="M 180 315 L 520 315" stroke="#2457d6" stroke-width="2.5" fill="none"/>
  <text x="270" y="328" font-size="12" font-weight="bold" fill="#2457d6">LOW = 0 (UART Download)</text>
  <path d="M 520 315 L 900 315" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>

  <!-- Signal 5: GPIO2 -->
  <text x="160" y="375" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">GPIO2 (TXD1)</text>
  <path d="M 180 365 L 520 365" stroke="#27ae60" stroke-width="2.5" fill="none"/>
  <path d="M 520 365 L 900 365" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <text x="270" y="360" font-size="12" font-weight="bold" fill="#27ae60">Обов'язково HIGH (3.3V)</text>
  <text x="620" y="360" font-size="12" fill="#6b7280">Вільний вивід (користувацький / TXD1)</text>

  <!-- Summary Panel -->
  <rect x="40" y="415" width="880" height="50" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="60" y="435" font-size="12" font-weight="bold" fill="#1a1a1a">Режим Flash Boot (звичайний запуск):</text>
  <text x="310" y="435" font-size="12" fill="#27ae60">GPIO15 = 0 (GND), GPIO0 = 1 (PU), GPIO2 = 1 (PU) — виконання прошивки з SPI Flash</text>

  <text x="60" y="453" font-size="12" font-weight="bold" fill="#1a1a1a">Режим UART Download (прошивання):</text>
  <text x="310" y="453" font-size="12" fill="#2457d6">GPIO15 = 0 (GND), GPIO0 = 0 (GND), GPIO2 = 1 (PU) — очікування завантаження прошивки</text>
</svg>
