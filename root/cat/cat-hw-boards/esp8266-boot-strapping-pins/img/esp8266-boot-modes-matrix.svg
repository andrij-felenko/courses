<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Матриця режимів завантаження ESP8266 (Strapping Pins)</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Режим старту визначається логічними рівнями на GPIO15, GPIO0 та GPIO2 під час скидання RST</text>

  <!-- Main Table Container -->
  <rect x="30" y="85" width="900" height="273" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Table Header -->
  <rect x="40" y="93" width="880" height="36" rx="6" fill="#e5e7eb" stroke="#d0d7de" stroke-width="1"/>
  <text x="130" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Режим завантаження</text>
  <text x="275" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">GPIO15 (MTDO)</text>
  <text x="385" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">GPIO0</text>
  <text x="485" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">GPIO2</text>
  <text x="610" y="116" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Лог ROM boot mode</text>
  <text x="700" y="116" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">Призначення та стан</text>

  <!-- Row 1: SPI Flash Boot -->
  <rect x="40" y="135" width="880" height="50" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="130" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">SPI Flash Boot</text>
  <text x="130" y="174" text-anchor="middle" font-size="12" fill="#6b7280">(Основний режим)</text>

  <text x="275" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">0 (LOW)</text>
  <text x="275" y="174" text-anchor="middle" font-size="12" fill="#6b7280">Pull-down GND</text>

  <text x="385" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">1 (HIGH)</text>
  <text x="385" y="174" text-anchor="middle" font-size="12" fill="#6b7280">Pull-up 3.3V</text>

  <text x="485" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">1 (HIGH)</text>
  <text x="485" y="174" text-anchor="middle" font-size="12" fill="#6b7280">Pull-up 3.3V</text>

  <text x="610" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">boot mode:(3, x)</text>
  <text x="610" y="174" text-anchor="middle" font-size="12" fill="#6b7280">(0, 1, 1)₂ = 3</text>

  <text x="700" y="155" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">Виконання коду з Flash</text>
  <text x="700" y="174" text-anchor="start" font-size="12" fill="#6b7280">Стандартний старт пристрою</text>

  <!-- Row 2: UART Download Mode -->
  <rect x="40" y="191" width="880" height="50" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="130" y="211" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">UART Download</text>
  <text x="130" y="230" text-anchor="middle" font-size="12" fill="#6b7280">(Режим прошивки)</text>

  <text x="275" y="211" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">0 (LOW)</text>
  <text x="275" y="230" text-anchor="middle" font-size="12" fill="#6b7280">Pull-down GND</text>

  <text x="385" y="211" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">0 (LOW)</text>
  <text x="385" y="230" text-anchor="middle" font-size="12" fill="#2457d6">Кнопка FLASH</text>

  <text x="485" y="211" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">1 (HIGH)</text>
  <text x="485" y="230" text-anchor="middle" font-size="12" fill="#6b7280">Pull-up 3.3V</text>

  <text x="610" y="211" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">boot mode:(1, x)</text>
  <text x="610" y="230" text-anchor="middle" font-size="12" fill="#6b7280">(0, 0, 1)₂ = 1</text>

  <text x="700" y="211" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">Запис прошивки через UART</text>
  <text x="700" y="230" text-anchor="start" font-size="12" fill="#6b7280">Очікування esptool / UART0</text>

  <!-- Row 3: SDIO Boot -->
  <rect x="40" y="247" width="880" height="50" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="130" y="267" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">SDIO Boot</text>
  <text x="130" y="286" text-anchor="middle" font-size="12" fill="#6b7280">(Завантаження SDIO)</text>

  <text x="275" y="267" text-anchor="middle" font-size="13" font-weight="bold" fill="#d97706">1 (HIGH)</text>
  <text x="275" y="286" text-anchor="middle" font-size="12" fill="#d97706">Pull-up 3.3V</text>

  <text x="385" y="267" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b7280">X (довільно)</text>
  <text x="385" y="286" text-anchor="middle" font-size="12" fill="#6b7280">Не впливає</text>

  <text x="485" y="267" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b7280">X (довільно)</text>
  <text x="485" y="286" text-anchor="middle" font-size="12" fill="#6b7280">Не впливає</text>

  <text x="610" y="267" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">boot mode:(7, x)</text>
  <text x="610" y="286" text-anchor="middle" font-size="12" fill="#6b7280">(1, x, x)₂ ≥ 4</text>

  <text x="700" y="267" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">Режим SDIO slave</text>
  <text x="700" y="286" text-anchor="start" font-size="12" fill="#6b7280">Завантаження від хоста</text>

  <!-- Row 4: Invalid Boot Mode -->
  <rect x="40" y="303" width="880" height="50" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="130" y="323" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Заборонений режим</text>
  <text x="130" y="342" text-anchor="middle" font-size="12" fill="#c0392b">(Апаратний збій)</text>

  <text x="275" y="323" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">0 (LOW)</text>
  <text x="275" y="342" text-anchor="middle" font-size="12" fill="#6b7280">Pull-down GND</text>

  <text x="385" y="323" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b7280">X (довільно)</text>
  <text x="385" y="342" text-anchor="middle" font-size="12" fill="#6b7280">0 або 1</text>

  <text x="485" y="323" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">0 (LOW)</text>
  <text x="485" y="342" text-anchor="middle" font-size="12" fill="#c0392b">ПОМИЛКА: GND</text>

  <text x="610" y="323" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">boot mode:(2, x)</text>
  <text x="610" y="342" text-anchor="middle" font-size="12" fill="#c0392b">(0, 1, 0)₂ або (0, 0, 0)₂</text>

  <text x="700" y="323" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">Збій завантаження ESP8266</text>
  <text x="700" y="342" text-anchor="start" font-size="12" fill="#6b7280">GPIO2 має бути HIGH при RST</text>

  <!-- Card 1: Circuit Rules -->
  <rect x="30" y="375" width="435" height="135" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247" y="396" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Правила схемотехніки підтяжки (Pull-up / Pull-down)</text>
  <text x="50" y="421" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#2457d6">GPIO15:</tspan> обов'язковий Pull-down резистор 10 кОм до GND</text>
  <text x="50" y="443" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#27ae60">GPIO0:</tspan> Pull-up 10 кОм до 3.3V (кнопка FLASH замикає на GND)</text>
  <text x="50" y="465" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#27ae60">GPIO2:</tspan> Pull-up 10 кОм до 3.3V (під час скидання не тягти до GND)</text>
  <text x="50" y="487" font-size="12" fill="#6b7280">Рівні напруг буфера: V_IL &lt; 0.25×VDD, V_IH &gt; 0.75×VDD</text>

  <!-- Card 2: Diagnostic ROM log -->
  <rect x="495" y="375" width="435" height="135" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="712" y="396" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Діагностика за кодом ROM boot mode:(P1, P2)</text>
  <text x="515" y="421" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#1a1a1a">Формула P1:</tspan> P1 = (GPIO15 &lt;&lt; 2) | (GPIO0 &lt;&lt; 1) | GPIO2</text>
  <text x="515" y="443" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#27ae60">P1 = 3 (011₂):</tspan> Нормальний старт із Flash (GPIO15=0, GPIO0=1, GPIO2=1)</text>
  <text x="515" y="465" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#2457d6">P1 = 1 (001₂):</tspan> Готовність до прошивки через UART (GPIO0 притиснуто)</text>
  <text x="515" y="487" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#c0392b">P1 = 0 або 2:</tspan> Помилка — GPIO2 підтягнуто до GND замість VDD</text>
</svg>
