<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" width="960" height="580" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="580" fill="white"/>

  <!-- Header -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема завадостійкого вузла автоскиду та підтяжки ESP8266</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Двотранзисторне керування DTR/RTS, підтяжки 10 кОм та фільтруючі конденсатори 100 нФ</text>

  <!-- PANEL 1: USB-UART Adapter -->
  <rect x="30" y="75" width="170" height="370" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="115" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">USB-UART адаптер</text>
  <text x="115" y="118" font-size="12" fill="#6b7280" text-anchor="middle">(CP2102 / CH340 / FT232)</text>

  <!-- Pins on USB-UART Panel -->
  <text x="185" y="154" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">DTR</text>
  <text x="185" y="234" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">RTS</text>
  <text x="185" y="399" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">TXD</text>
  <text x="185" y="424" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">RXD</text>

  <!-- PANEL 2: Auto-Reset Circuit -->
  <rect x="220" y="75" width="350" height="370" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="395" y="100" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Вузол автоматичного скиду (Auto-Reset)</text>
  <text x="395" y="118" font-size="12" fill="#6b7280" text-anchor="middle">NPN-транзистори BS84 / 2N3904</text>

  <!-- Resistors R1 & R2 in Panel 2 -->
  <!-- R1 (10k on RTS to Base Q1) -->
  <text x="325" y="160" font-size="12" fill="#1a1a1a" text-anchor="middle">R1 = 10 кОм</text>
  <rect x="295" y="164" width="40" height="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" rx="2"/>

  <!-- R2 (10k on DTR to Base Q2) -->
  <text x="325" y="260" font-size="12" fill="#1a1a1a" text-anchor="middle">R2 = 10 кОм</text>
  <rect x="295" y="264" width="40" height="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" rx="2"/>

  <!-- Transistor Q1 Symbol -->
  <text x="440" y="142" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Q1 (NPN)</text>
  <circle cx="440" cy="170" r="18" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="430" y1="158" x2="430" y2="182" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="405" y1="170" x2="430" y2="170" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="430" y1="163" x2="452" y2="152" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="452" y1="152" x2="452" y2="145" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="430" y1="177" x2="452" y2="188" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="446,183 454,189 443,189" fill="#1a1a1a"/>
  <line x1="452" y1="188" x2="452" y2="195" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Transistor Q2 Symbol -->
  <text x="440" y="242" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Q2 (NPN)</text>
  <circle cx="440" cy="270" r="18" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="430" y1="258" x2="430" y2="282" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="405" y1="270" x2="430" y2="270" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="430" y1="263" x2="452" y2="252" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="452" y1="252" x2="452" y2="245" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="430" y1="277" x2="452" y2="288" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="446,283 454,289 443,289" fill="#1a1a1a"/>
  <line x1="452" y1="288" x2="452" y2="295" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Wiring inside Panel 2 -->
  <!-- DTR Signal Routing -->
  <line x1="185" y1="150" x2="260" y2="150" stroke="#2457d6" stroke-width="2"/>
  <circle cx="260" cy="150" r="3.5" fill="#2457d6"/>
  <line x1="260" y1="150" x2="260" y2="195" stroke="#2457d6" stroke-width="2"/>
  <line x1="260" y1="195" x2="452" y2="195" stroke="#2457d6" stroke-width="2"/>
  <line x1="260" y1="195" x2="260" y2="270" stroke="#2457d6" stroke-width="2"/>
  <line x1="260" y1="270" x2="295" y2="270" stroke="#2457d6" stroke-width="2"/>
  <line x1="335" y1="270" x2="405" y2="270" stroke="#2457d6" stroke-width="1.5"/>

  <!-- RTS Signal Routing -->
  <line x1="185" y1="230" x2="280" y2="230" stroke="#2457d6" stroke-width="2"/>
  <circle cx="280" cy="230" r="3.5" fill="#2457d6"/>
  <line x1="280" y1="230" x2="280" y2="170" stroke="#2457d6" stroke-width="2"/>
  <line x1="280" y1="170" x2="295" y2="170" stroke="#2457d6" stroke-width="2"/>
  <line x1="335" y1="170" x2="405" y2="170" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="280" y1="230" x2="280" y2="295" stroke="#2457d6" stroke-width="2"/>
  <line x1="280" y1="295" x2="452" y2="295" stroke="#2457d6" stroke-width="2"/>

  <!-- Output lines from Panel 2 to Panel 3 -->
  <line x1="452" y1="145" x2="480" y2="145" stroke="#2457d6" stroke-width="2"/>
  <line x1="480" y1="145" x2="480" y2="160" stroke="#2457d6" stroke-width="2"/>
  <line x1="480" y1="160" x2="590" y2="160" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  <text x="540" y="152" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">RST</text>

  <line x1="452" y1="245" x2="480" y2="245" stroke="#2457d6" stroke-width="2"/>
  <line x1="480" y1="245" x2="480" y2="210" stroke="#2457d6" stroke-width="2"/>
  <line x1="480" y1="210" x2="590" y2="210" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  <text x="540" y="202" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">GPIO0</text>

  <!-- TXD & RXD Passthrough Lines in Panel 2 -->
  <line x1="185" y1="395" x2="590" y2="395" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="395" y="388" font-size="12" fill="#6b7280" text-anchor="middle">TXD → RXD (Дані від PC до ESP)</text>

  <line x1="590" y1="425" x2="185" y2="425" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="395" y="418" font-size="12" fill="#6b7280" text-anchor="middle">RXD ← TXD (Дані від ESP до PC)</text>

  <!-- PANEL 3: ESP8266 & Strapping Pins -->
  <rect x="590" y="75" width="340" height="370" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="760" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мікроконтролер ESP8266 (ESP-12F)</text>
  <text x="760" y="118" font-size="12" fill="#6b7280" text-anchor="middle">Конфігурація виводів (Strapping Pins)</text>

  <!-- Power Rail +3.3V -->
  <line x1="640" y1="138" x2="880" y2="138" stroke="#c0392b" stroke-width="2"/>
  <text x="635" y="134" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">+3.3V</text>

  <!-- RST Pin Structure -->
  <text x="600" y="154" font-size="12" font-weight="bold" fill="#c0392b">RST</text>
  <line x1="590" y1="160" x2="790" y2="160" stroke="#2457d6" stroke-width="2"/>
  <!-- Pull-UP Resistor R3 (10k) -->
  <line x1="670" y1="138" x2="670" y2="144" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="664" y="144" width="12" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" rx="2"/>
  <line x1="670" y1="168" x2="670" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="670" cy="160" r="3" fill="#1a1a1a"/>
  <text x="682" y="160" font-size="12" fill="#1a1a1a">R3 10k</text>
  <!-- Filter Capacitor C1 (100nF to GND) -->
  <circle cx="750" cy="160" r="3" fill="#27ae60"/>
  <line x1="750" y1="160" x2="750" y2="170" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="742" y1="170" x2="758" y2="170" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="742" y1="174" x2="758" y2="174" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="750" y1="174" x2="750" y2="182" stroke="#27ae60" stroke-width="1.5"/>
  <!-- GND symbol C1 -->
  <line x1="744" y1="182" x2="756" y2="182" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="747" y1="185" x2="753" y2="185" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="749" y1="188" x2="751" y2="188" stroke="#27ae60" stroke-width="1.5"/>
  <text x="764" y="176" font-size="12" font-weight="bold" fill="#27ae60">C1 100нФ</text>

  <!-- GPIO0 Pin Structure -->
  <text x="600" y="204" font-size="12" font-weight="bold" fill="#2457d6">GPIO0</text>
  <line x1="590" y1="210" x2="790" y2="210" stroke="#2457d6" stroke-width="2"/>
  <!-- Pull-UP Resistor R4 (10k) -->
  <line x1="670" y1="138" x2="670" y2="194" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="664" y="194" width="12" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" rx="2"/>
  <line x1="670" y1="218" x2="670" y2="210" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="670" cy="210" r="3" fill="#1a1a1a"/>
  <text x="682" y="210" font-size="12" fill="#1a1a1a">R4 10k</text>
  <!-- Filter Capacitor C2 (100nF to GND) -->
  <circle cx="750" cy="210" r="3" fill="#27ae60"/>
  <line x1="750" y1="210" x2="750" y2="220" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="742" y1="220" x2="758" y2="220" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="742" y1="224" x2="758" y2="224" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="750" y1="224" x2="750" y2="232" stroke="#27ae60" stroke-width="1.5"/>
  <!-- GND symbol C2 -->
  <line x1="744" y1="232" x2="756" y2="232" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="747" y1="235" x2="753" y2="235" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="749" y1="238" x2="751" y2="238" stroke="#27ae60" stroke-width="1.5"/>
  <text x="764" y="226" font-size="12" font-weight="bold" fill="#27ae60">C2 100нФ</text>
  <text x="830" y="204" font-size="12" fill="#6b7280">[Boot: 1/0]</text>

  <!-- GPIO2 Pin Structure -->
  <text x="600" y="254" font-size="12" font-weight="bold" fill="#1a1a1a">GPIO2</text>
  <line x1="600" y1="260" x2="750" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Pull-UP Resistor R5 (10k) -->
  <line x1="670" y1="138" x2="670" y2="244" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="664" y="244" width="12" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" rx="2"/>
  <line x1="670" y1="268" x2="670" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="670" cy="260" r="3" fill="#1a1a1a"/>
  <text x="682" y="260" font-size="12" fill="#1a1a1a">R5 10k</text>
  <text x="760" y="254" font-size="12" font-weight="bold" fill="#27ae60">[HIGH при старті]</text>

  <!-- GPIO15 Pin Structure -->
  <text x="600" y="304" font-size="12" font-weight="bold" fill="#1a1a1a">GPIO15</text>
  <line x1="600" y1="310" x2="750" y2="310" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Pull-DOWN Resistor R6 (10k to GND) -->
  <circle cx="670" cy="310" r="3" fill="#1a1a1a"/>
  <line x1="670" y1="310" x2="670" y2="318" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="664" y="318" width="12" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" rx="2"/>
  <line x1="670" y1="342" x2="670" y2="348" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- GND symbol R6 -->
  <line x1="664" y1="348" x2="676" y2="348" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="667" y1="351" x2="673" y2="351" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="669" y1="354" x2="671" y2="354" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="682" y="334" font-size="12" fill="#1a1a1a">R6 10k</text>
  <text x="760" y="304" font-size="12" font-weight="bold" fill="#27ae60">[LOW при старті]</text>

  <!-- EN (CH_PD) Pin Structure -->
  <text x="600" y="354" font-size="12" font-weight="bold" fill="#1a1a1a">EN (CH_PD)</text>
  <line x1="600" y1="360" x2="750" y2="360" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Pull-UP Resistor R7 (10k) -->
  <line x1="670" y1="138" x2="670" y2="344" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="664" y="344" width="12" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" rx="2"/>
  <line x1="670" y1="368" x2="670" y2="360" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="670" cy="360" r="3" fill="#1a1a1a"/>
  <text x="682" y="360" font-size="12" fill="#1a1a1a">R7 10k</text>
  <text x="760" y="354" font-size="12" fill="#27ae60">[HIGH (Enable)]</text>

  <!-- UART RXD/TXD Pins inside Panel 3 -->
  <text x="600" y="396" font-size="12" font-weight="bold" fill="#1a1a1a">RXD</text>
  <text x="600" y="421" font-size="12" font-weight="bold" fill="#1a1a1a">TXD</text>

  <!-- PANEL 4: Summary Table (Bottom) -->
  <rect x="30" y="460" width="900" height="105" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Left Column: Auto-Reset Truth Table -->
  <text x="50" y="482" font-size="12" font-weight="bold" fill="#2457d6">Логіка роботи Auto-Reset (DTR / RTS):</text>
  <text x="50" y="502" font-size="12" fill="#1a1a1a">• DTR=1, RTS=0  ⇒  Q1=OFF, Q2=ON   ⇒  RST=1, GPIO0=0  (Режим прошивки)</text>
  <text x="50" y="522" font-size="12" fill="#1a1a1a">• DTR=0, RTS=1  ⇒  Q1=ON,  Q2=OFF  ⇒  RST=0, GPIO0=1  (Імпульс скидання)</text>
  <text x="50" y="542" font-size="12" fill="#1a1a1a">• DTR=0, RTS=0  ⇒  Q1=OFF, Q2=OFF  ⇒  RST=1, GPIO0=1  (Робочий старт)</text>

  <!-- Right Column: Strapping Pins Requirements -->
  <text x="500" y="482" font-size="12" font-weight="bold" fill="#27ae60">Вимоги конфігураційних виводів (Boot Pins):</text>
  <text x="500" y="502" font-size="12" fill="#1a1a1a">• GPIO0  : HIGH (1) — Flash Boot | LOW (0) — UART Download</text>
  <text x="500" y="522" font-size="12" fill="#1a1a1a">• GPIO2  : HIGH (1) обов'язково (підтяжка R5 10 кОм до +3.3V)</text>
  <text x="500" y="542" font-size="12" fill="#1a1a1a">• GPIO15 : LOW (0) обов'язково (стяжка R6 10 кОм до GND)</text>
</svg>
