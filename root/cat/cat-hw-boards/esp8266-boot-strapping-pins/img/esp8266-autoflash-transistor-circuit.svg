<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема автоматичного скидання та прошивки ESP8266 (NodeMCU Auto-Reset)</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Перехресне підключення NPN-транзисторів зануляє RST та GPIO0 без взаємного блокування чи хибних спрацьовувань</text>

  <!-- ЛІВА ПАНЕЛЬ: Принципова схема -->
  <rect x="40" y="85" width="530" height="395" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="305" y="115" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Принципова схема транзисторного ключа</text>

  <!-- Термінали USB-UART (Зліва) -->
  <rect x="60" y="165" width="85" height="34" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="102" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">DTR (USB)</text>

  <rect x="60" y="365" width="85" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="102" y="386" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">RTS (USB)</text>

  <!-- Термінали ESP8266 (Справа) -->
  <rect x="445" y="165" width="105" height="34" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="497" y="186" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">RST (ESP)</text>

  <rect x="445" y="365" width="105" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="497" y="386" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">GPIO0 (ESP)</text>

  <!-- Підтяжки до 3.3V -->
  <text x="497" y="145" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">R_pull1 до 3.3V</text>
  <line x1="497" y1="150" x2="497" y2="165" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,2"/>

  <text x="497" y="420" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">R_pull2 до 3.3V</text>
  <line x1="497" y1="399" x2="497" y2="410" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Транзистор Q1 (NPN) -->
  <rect x="290" y="160" width="85" height="60" rx="6" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="332" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Q1 (NPN)</text>
  <text x="332" y="205" text-anchor="middle" font-size="11" fill="#2457d6">Ключ RST</text>

  <!-- Транзистор Q2 (NPN) -->
  <rect x="290" y="345" width="85" height="60" rx="6" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <text x="332" y="370" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Q2 (NPN)</text>
  <text x="332" y="390" text-anchor="middle" font-size="11" fill="#27ae60">Ключ GPIO0</text>

  <!-- Базові резистори -->
  <rect x="180" y="240" width="70" height="26" rx="3" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <text x="215" y="257" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">R1: 10 кОм</text>

  <rect x="180" y="298" width="70" height="26" rx="3" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="215" y="315" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">R2: 10 кОм</text>

  <!-- ПРОВОДИ Й ПЕРЕХРЕСНІ ЗВ'ЯЗКИ -->
  <!-- DTR -> Emitter Q1 -->
  <path d="M 145,182 L 290,182" stroke="#2457d6" stroke-width="2"/>
  <!-- DTR -> R2 -> Base Q2 -->
  <path d="M 165,182 L 165,311 L 180,311" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,2"/>
  <path d="M 250,311 L 270,311 L 270,375 L 290,375" fill="none" stroke="#2457d6" stroke-width="1.5"/>

  <!-- RTS -> Emitter Q2 -->
  <path d="M 145,382 L 290,382" stroke="#27ae60" stroke-width="2"/>
  <!-- RTS -> R1 -> Base Q1 -->
  <path d="M 165,382 L 165,253 L 180,253" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,2"/>
  <path d="M 250,253 L 270,253 L 270,190 L 290,190" fill="none" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Collector Q1 -> RST -->
  <path d="M 375,182 L 445,182" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <!-- Collector Q2 -> GPIO0 -->
  <path d="M 375,382 L 445,382" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>


  <!-- ПРАВА ПАНЕЛЬ: Таблиця істинності -->
  <rect x="590" y="85" width="330" height="395" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="755" y="115" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Таблиця істинності автоскидання</text>

  <!-- Стан 1: IDLE -->
  <rect x="605" y="145" width="300" height="65" rx="6" ry="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="620" y="168" font-size="12" font-weight="bold" fill="#1a1a1a">DTR = 1 (3.3V), RTS = 1 (3.3V)</text>
  <text x="620" y="186" font-size="11" fill="#6b7280">Q1 OFF, Q2 OFF -&gt; RST=1, GPIO0=1</text>
  <text x="620" y="202" font-size="11" font-weight="bold" fill="#27ae60">Штатний запуск коду з Flash</text>

  <!-- Стан 2: BOOT SELECTION -->
  <rect x="605" y="222" width="300" height="65" rx="6" ry="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="620" y="245" font-size="12" font-weight="bold" fill="#2457d6">DTR = 1 (3.3V), RTS = 0 (0V)</text>
  <text x="620" y="263" font-size="11" fill="#1a1a1a">Q2 ON -&gt; GPIO0 = 0V, Q1 OFF -&gt; RST = 1</text>
  <text x="620" y="279" font-size="11" font-weight="bold" fill="#2457d6">Підготовка режим прошивки (GPIO0=0)</text>

  <!-- Стан 3: RESET PULSE -->
  <rect x="605" y="299" width="300" height="65" rx="6" ry="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="620" y="322" font-size="12" font-weight="bold" fill="#27ae60">DTR = 0 (0V), RTS = 1 (3.3V)</text>
  <text x="620" y="340" font-size="11" fill="#1a1a1a">Q1 ON -&gt; RST = 0V (Імпульс скидання)</text>
  <text x="620" y="356" font-size="11" font-weight="bold" fill="#27ae60">Защепкування логічного нуля на GPIO0</text>

  <!-- Стан 4: CROSS-LOCKING -->
  <rect x="605" y="376" width="300" height="85" rx="6" ry="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="620" y="398" font-size="12" font-weight="bold" fill="#c0392b">DTR = 0 (0V), RTS = 0 (0V)</text>
  <text x="620" y="416" font-size="11" fill="#1a1a1a">Q1 OFF, Q2 OFF (V_be &lt; 0.7V)</text>
  <text x="620" y="434" font-size="11" font-weight="bold" fill="#c0392b">Перехресне блокування</text>
  <text x="620" y="450" font-size="11" fill="#6b7280">Запобігає хибним скиданням</text>
</svg>
