<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- White Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Паразитне заживлення ESP8266 через ESD-діоди</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Зовнішнє живлення периферії наводить потенціал 1.2–1.8 В на знеструмлену шину VCC, збуваючи скидання POR</text>

  <!-- Left Panel: External Peripheral -->
  <rect x="30" y="70" width="240" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="40" y="80" width="220" height="34" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="150" y="102" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Зовнішня периферія</text>

  <!-- External VCC Source -->
  <rect x="50" y="125" width="200" height="46" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="150" y="143" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">VCC_ext = +3.3 В</text>
  <text x="150" y="159" font-size="11" fill="#27ae60" text-anchor="middle">(Живлення активне)</text>

  <!-- Pull-up resistor -->
  <line x1="150" y1="171" x2="150" y2="185" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="140" y="185" width="20" height="45" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="170" y="204" font-size="12" font-weight="bold" fill="#1a1a1a">R_pull</text>
  <text x="170" y="219" font-size="11" fill="#6b7280">10 кОм</text>

  <!-- Line from Resistor to Output Pin -->
  <line x1="150" y1="230" x2="150" y2="245" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="150" y1="245" x2="250" y2="245" stroke="#c0392b" stroke-width="2"/>
  <circle cx="250" cy="245" r="4" fill="#2457d6"/>
  <text x="195" y="235" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Вихід OUT (3.3 В)</text>

  <!-- Callout Badge 1 (Inside Left Panel) -->
  <rect x="45" y="260" width="210" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="150" y="277" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">1. Струм іде від VCC_ext</text>

  <!-- Left Panel Info Box -->
  <rect x="45" y="300" width="210" height="120" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="150" y="320" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Стан схеми:</text>
  <text x="55" y="340" font-size="11" fill="#1a1a1a">• Модуль живиться (3.3 В)</text>
  <text x="55" y="360" font-size="11" fill="#1a1a1a">• На виході логічна 1</text>
  <text x="55" y="380" font-size="11" fill="#c0392b">• Струм протікає в GPIO</text>
  <text x="55" y="402" font-size="11" fill="#6b7280">• VCC MCU вимкнено (0 В)</text>

  <!-- Connection Line between Panels (gap x=250 to x=335) -->
  <line x1="250" y1="245" x2="335" y2="245" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="5,3"/>
  <text x="292" y="235" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">GPIO</text>

  <!-- Right Panel: ESP8266 SoC -->
  <rect x="320" y="70" width="610" height="365" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <rect x="330" y="80" width="590" height="34" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="625" y="102" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">SoC ESP8266 (Головна шина VCC вимкнена / 0 В)</text>

  <!-- Internal VCC Rail -->
  <line x1="420" y1="160" x2="790" y2="160" stroke="#c0392b" stroke-width="3"/>
  <text x="340" y="142" font-size="12" font-weight="bold" fill="#c0392b">Шина VCC чипа</text>

  <!-- Phantom Voltage Badge (Placed Above VCC Rail) -->
  <rect x="510" y="120" width="250" height="28" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="635" y="138" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">V_phantom = 1.2–1.8 В (Примарне VCC)</text>

  <!-- Main Power Supply Box (OFF) -->
  <rect x="790" y="130" width="120" height="40" rx="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1"/>
  <text x="850" y="146" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="middle">VCC_main (0 В)</text>
  <text x="850" y="162" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">[ВИМКНЕНО]</text>

  <!-- Badge 2: Near Upper ESD Diode -->
  <rect x="340" y="180" width="135" height="32" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="407" y="194" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">2. Прохід через діод</text>
  <text x="407" y="207" font-size="11" fill="#c0392b" text-anchor="middle">на шину VCC</text>

  <!-- Upper ESD Diode (D_ESD,top) -->
  <line x1="490" y1="245" x2="490" y2="215" stroke="#c0392b" stroke-width="2"/>
  <polygon points="478,215 502,215 490,193" fill="#c0392b"/>
  <line x1="478" y1="193" x2="502" y2="193" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="490" y1="193" x2="490" y2="160" stroke="#c0392b" stroke-width="2"/>

  <text x="515" y="200" font-size="11" font-weight="bold" fill="#c0392b">D_ESD,top (Верхній діод)</text>
  <text x="515" y="214" font-size="11" fill="#c0392b">ВІДКРИТИЙ (струм протікає)</text>

  <!-- Lower ESD Diode (D_ESD,bot) -->
  <line x1="490" y1="350" x2="490" y2="315" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="478,315 502,315 490,293" fill="#6b7280"/>
  <line x1="478" y1="293" x2="502" y2="293" stroke="#6b7280" stroke-width="2"/>
  <line x1="490" y1="293" x2="490" y2="245" stroke="#6b7280" stroke-width="1.5"/>

  <text x="515" y="300" font-size="11" fill="#6b7280">D_ESD,bot (Нижній діод)</text>
  <text x="515" y="314" font-size="11" fill="#6b7280">Закритий (зворотний напрямок)</text>

  <!-- Internal GND Rail -->
  <line x1="420" y1="350" x2="880" y2="350" stroke="#1a1a1a" stroke-width="2"/>
  <text x="420" y="368" font-size="12" font-weight="bold" fill="#6b7280">GND (0 В)</text>

  <!-- GPIO Pin Pad inside ESP8266 -->
  <circle cx="335" cy="245" r="5" fill="#c0392b"/>
  <text x="345" y="228" font-size="12" font-weight="bold" fill="#1a1a1a">Вивід GPIO</text>
  <text x="345" y="240" font-size="11" fill="#6b7280">(GPIO0/2/15)</text>
  <line x1="335" y1="245" x2="630" y2="245" stroke="#c0392b" stroke-width="2"/>

  <!-- Input Buffer Block -->
  <rect x="630" y="215" width="100" height="60" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="680" y="241" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вхідний буфер</text>
  <text x="680" y="256" font-size="11" fill="#6b7280" text-anchor="middle">(Тригер Шмітта)</text>
  <line x1="730" y1="245" x2="755" y2="245" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- POR Block -->
  <rect x="755" y="195" width="155" height="140" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="832" y="216" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Система скидання POR</text>
  <line x1="832" y1="160" x2="832" y2="195" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arr-red)"/>

  <rect x="765" y="226" width="135" height="98" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="832" y="244" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">СІРА ЗОНА НАПРУГИ!</text>
  <text x="832" y="261" font-size="11" fill="#1a1a1a" text-anchor="middle">1.0 В &lt; V_VCC &lt; 2.4 В</text>
  <text x="832" y="278" font-size="11" fill="#6b7280" text-anchor="middle">POR не може скинути чип</text>
  <text x="832" y="304" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">→ BOOT LOOP / ЗБОЙ</text>

  <!-- Red Dashed Parasitic Current Flow Path -->
  <path d="M 150,171 L 150,245 L 490,245 L 490,160 L 832,160 L 832,195" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6,4" marker-end="url(#arr-red)"/>
</svg>
