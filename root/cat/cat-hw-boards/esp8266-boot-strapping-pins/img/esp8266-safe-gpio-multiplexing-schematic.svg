<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>

  <!-- Header -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Безпечна ізоляція периферії від конфігураційних виводів ESP8266</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Розв'язувальні резистори та MOSFET-ключі виключають хибне визначення режимів завантаження під час скидання (RST)</text>

  <!-- PANEL LEFT: GPIO0 / GPIO2 (N-MOSFET) -->
  <rect x="30" y="85" width="435" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  
  <!-- Header Badge Left -->
  <rect x="45" y="100" width="405" height="36" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="247" y="123" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">GPIO0 / GPIO2: Ізоляція N-MOSFET ключем (High = 1)</text>

  <!-- ESP8266 Chip Box Left -->
  <rect x="50" y="155" width="110" height="170" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="105" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">ESP8266</text>
  <text x="145" y="234" text-anchor="end" font-size="13" font-weight="bold" fill="#2457d6">GPIO0</text>
  <circle cx="160" cy="230" r="4" fill="#2457d6"/>

  <!-- Wiring & Pull-Up R1 -->
  <!-- Wire from pin to node A -->
  <line x1="160" y1="230" x2="210" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="210" cy="230" r="3.5" fill="#1a1a1a"/>

  <!-- Pull-up branch up to VCC -->
  <line x1="210" y1="230" x2="210" y2="210" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="200" y="170" width="20" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="225" y="194" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">R1 (10 kΩ)</text>
  <line x1="210" y1="170" x2="210" y2="155" stroke="#1a1a1a" stroke-width="2"/>
  <!-- VCC Bar -->
  <line x1="195" y1="155" x2="225" y2="155" stroke="#27ae60" stroke-width="2"/>
  <text x="210" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">+3.3V (VCC)</text>

  <!-- Resistor Rg to Gate -->
  <line x1="210" y1="230" x2="245" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="245" y="220" width="35" height="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="262" y="255" text-anchor="middle" font-size="12" fill="#6b7280">Rg (1 kΩ)</text>
  <line x1="280" y1="230" x2="315" y2="230" stroke="#1a1a1a" stroke-width="2"/>

  <!-- N-MOSFET Symbol Q1 -->
  <!-- Gate line -->
  <line x1="315" y1="215" x2="315" y2="245" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Channel line -->
  <line x1="322" y1="215" x2="322" y2="245" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="7,4"/>
  <!-- Drain & Source lines -->
  <line x1="322" y1="215" x2="340" y2="215" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="340" y1="215" x2="340" y2="185" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="322" y1="245" x2="340" y2="245" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="340" y1="245" x2="340" y2="275" stroke="#1a1a1a" stroke-width="2"/>
  <text x="350" y="235" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">Q1 (N-MOSFET)</text>

  <!-- Source to GND -->
  <line x1="340" y1="275" x2="340" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="330" y1="300" x2="350" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="334" y1="304" x2="346" y2="304" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="338" y1="308" x2="342" y2="308" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Drain to Load -->
  <line x1="340" y1="185" x2="370" y2="185" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="370" y="165" width="75" height="40" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="407" y="183" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Силове реле</text>
  <text x="407" y="197" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">/ LED</text>

  <!-- Explanatory Note Box Left -->
  <rect x="45" y="340" width="405" height="155" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="60" y="365" font-size="13" font-weight="bold" fill="#27ae60">✔ РЕЖИМ СКИДАННЯ (RST = 0 → 1):</text>
  <text x="60" y="388" font-size="12" fill="#1a1a1a">• I_gate ≈ 0 мА — затвор не навантажує вивід GPIO0</text>
  <text x="60" y="410" font-size="12" fill="#1a1a1a">• R1 (10 kΩ) гарантує надійний високий рівень (3.3 В)</text>
  <text x="60" y="432" font-size="12" fill="#1a1a1a">• ROM-завантажувач чітко розпізнає стан Flash Boot (1)</text>
  <text x="60" y="454" font-size="12" fill="#1a1a1a">• Після старту ESP8266 безпечно вмикає Q1 через GPIO0</text>
  <text x="60" y="474" font-size="12" fill="#6b7280">  без ризику блокування завантаження</text>

  <!-- PANEL RIGHT: GPIO15 (P-MOSFET) -->
  <rect x="495" y="85" width="435" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Header Badge Right -->
  <rect x="510" y="100" width="405" height="36" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="712" y="123" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">GPIO15: Ізоляція P-MOSFET ключем (Low = 0)</text>

  <!-- ESP8266 Chip Box Right -->
  <rect x="515" y="155" width="110" height="170" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="570" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">ESP8266</text>
  <text x="610" y="234" text-anchor="end" font-size="13" font-weight="bold" fill="#c0392b">GPIO15</text>
  <circle cx="625" cy="230" r="4" fill="#c0392b"/>

  <!-- Wiring & Pull-Down R2 -->
  <!-- Wire from pin to node B -->
  <line x1="625" y1="230" x2="675" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="675" cy="230" r="3.5" fill="#1a1a1a"/>

  <!-- Pull-down branch down to GND -->
  <line x1="675" y1="230" x2="675" y2="250" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="665" y="250" width="20" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="693" y="274" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">R2 (10 kΩ)</text>
  <line x1="675" y1="290" x2="675" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <!-- GND Symbol -->
  <line x1="665" y1="300" x2="685" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="669" y1="304" x2="681" y2="304" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="673" y1="308" x2="677" y2="308" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Resistor Rg2 to Gate -->
  <line x1="675" y1="230" x2="710" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="710" y="220" width="35" height="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="727" y="212" text-anchor="middle" font-size="12" fill="#6b7280">Rg2 (1 kΩ)</text>
  <line x1="745" y1="230" x2="780" y2="230" stroke="#1a1a1a" stroke-width="2"/>

  <!-- P-MOSFET Symbol Q2 -->
  <!-- Gate line -->
  <line x1="780" y1="215" x2="780" y2="245" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Channel line -->
  <line x1="787" y1="215" x2="787" y2="245" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="7,4"/>
  <!-- Source (Up to VCC) & Drain (Down to Load) lines -->
  <line x1="787" y1="215" x2="805" y2="215" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="805" y1="215" x2="805" y2="170" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="787" y1="245" x2="805" y2="245" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="805" y1="245" x2="805" y2="265" stroke="#1a1a1a" stroke-width="2"/>
  <text x="815" y="205" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">Q2 (P-MOSFET)</text>

  <!-- Source to VCC -->
  <line x1="790" y1="160" x2="820" y2="160" stroke="#27ae60" stroke-width="2"/>
  <line x1="805" y1="170" x2="805" y2="160" stroke="#1a1a1a" stroke-width="2"/>
  <text x="805" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">+3.3V (VCC)</text>

  <!-- Drain to Load -->
  <rect x="835" y="245" width="75" height="40" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="872" y="263" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Периферія</text>
  <text x="872" y="277" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">/ LED</text>
  <line x1="805" y1="265" x2="835" y2="265" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Load to GND -->
  <line x1="872" y1="285" x2="872" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="862" y1="300" x2="882" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="866" y1="304" x2="878" y2="304" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="870" y1="308" x2="874" y2="308" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Explanatory Note Box Right -->
  <rect x="510" y="340" width="405" height="155" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="525" y="365" font-size="13" font-weight="bold" fill="#27ae60">✔ РЕЖИМ СКИДАННЯ (RST = 0 → 1):</text>
  <text x="525" y="388" font-size="12" fill="#1a1a1a">• R2 (10 kΩ) надійно утримує низький рівень (GND)</text>
  <text x="525" y="410" font-size="12" fill="#1a1a1a">• Витокові струми периферії відсічені P-MOSFET затвором</text>
  <text x="525" y="432" font-size="12" fill="#1a1a1a">• Виключено збій завантаження через хибний SDIO Mode</text>
  <text x="525" y="454" font-size="12" fill="#1a1a1a">• GPIO15 стійко защепкується у стан 0 (Flash Boot)</text>
  <text x="525" y="474" font-size="12" fill="#6b7280">  для нормального виконання програмного коду</text>
</svg>
