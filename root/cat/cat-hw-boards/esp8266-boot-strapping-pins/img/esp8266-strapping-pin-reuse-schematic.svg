<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема безпечного використання strapping-виводів у ролі шини I2C</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Природна сумісність підтяжок I2C (SDA/SCL) з вимогами старту Flash Boot (GPIO0=1, GPIO2=1)</text>

  <!-- PANEL 1: Boot Phase (Left) -->
  <rect x="20" y="75" width="440" height="325" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="240" y="98" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Фаза завантаження (GPIO0=1, GPIO2=1)</text>

  <!-- ESP8266 Box (Panel 1) -->
  <rect x="40" y="125" width="130" height="185" rx="6" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <text x="105" y="150" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">ESP8266</text>
  <text x="105" y="168" font-size="11" fill="#6b7280" text-anchor="middle">ROM Bootloader</text>

  <text x="160" y="214" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="end">GPIO0</text>
  <circle cx="170" cy="210" r="3.5" fill="#27ae60"/>

  <text x="160" y="274" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="end">GPIO2</text>
  <circle cx="170" cy="270" r="3.5" fill="#27ae60"/>

  <!-- SDA / SCL Bus Lines (Panel 1) -->
  <line x1="170" y1="210" x2="325" y2="210" stroke="#27ae60" stroke-width="2"/>
  <text x="245" y="202" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">SDA (3.3V)</text>

  <line x1="170" y1="270" x2="325" y2="270" stroke="#27ae60" stroke-width="2"/>
  <text x="245" y="262" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">SCL (3.3V)</text>

  <!-- Pull-Up Resistors R1 & R2 (Panel 1) -->
  <line x1="210" y1="138" x2="280" y2="138" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="245" y="132" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">3.3V (VDD)</text>

  <!-- R1 (SDA) -->
  <line x1="215" y1="138" x2="215" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="207" y="160" width="16" height="30" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="200" y="179" font-size="11" fill="#6b7280" text-anchor="end">R1 4.7k</text>
  <line x1="215" y1="190" x2="215" y2="210" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="215" cy="210" r="2.5" fill="#1a1a1a"/>

  <!-- R2 (SCL) -->
  <line x1="275" y1="138" x2="275" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="267" y="220" width="16" height="30" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="290" y="239" font-size="11" fill="#6b7280" text-anchor="start">R2 4.7k</text>
  <line x1="275" y1="250" x2="275" y2="270" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="275" cy="270" r="2.5" fill="#1a1a1a"/>

  <!-- I2C Sensor Device Box (Panel 1) -->
  <rect x="325" y="170" width="120" height="130" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="385" y="195" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">I2C Sensor</text>
  <text x="385" y="213" font-size="11" fill="#6b7280" text-anchor="middle">(BME280 / OLED)</text>
  <text x="385" y="240" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Inputs: High-Z</text>
  <text x="385" y="258" font-size="11" fill="#6b7280" text-anchor="middle">No GND pull</text>

  <!-- Result Box (Panel 1) -->
  <rect x="40" y="340" width="400" height="40" rx="4" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <text x="240" y="365" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Гарантований старт у режимі Flash Boot</text>

  <!-- PANEL 2: Active I2C Operation (Right) -->
  <rect x="500" y="75" width="440" height="325" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="720" y="98" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Робочий режим I2C (Після завантаження)</text>

  <!-- ESP8266 Box (Panel 2) -->
  <rect x="520" y="125" width="130" height="185" rx="6" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="585" y="150" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">ESP8266</text>
  <text x="585" y="168" font-size="11" fill="#6b7280" text-anchor="middle">User Firmware</text>

  <text x="640" y="214" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="end">GPIO0</text>
  <circle cx="650" cy="210" r="3.5" fill="#2457d6"/>

  <text x="640" y="274" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="end">GPIO2</text>
  <circle cx="650" cy="270" r="3.5" fill="#2457d6"/>

  <!-- SDA / SCL Bus Lines (Panel 2) -->
  <line x1="650" y1="210" x2="805" y2="210" stroke="#2457d6" stroke-width="2"/>
  <text x="725" y="202" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">SDA Data</text>

  <line x1="650" y1="270" x2="805" y2="270" stroke="#2457d6" stroke-width="2"/>
  <text x="725" y="262" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">SCL Clock</text>

  <!-- Pull-Up Resistors R1 & R2 (Panel 2) -->
  <line x1="690" y1="138" x2="760" y2="138" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="725" y="132" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">3.3V (VDD)</text>

  <!-- R1 (SDA) -->
  <line x1="695" y1="138" x2="695" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="687" y="160" width="16" height="30" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="680" y="179" font-size="11" fill="#6b7280" text-anchor="end">R1 4.7k</text>
  <line x1="695" y1="190" x2="695" y2="210" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="695" cy="210" r="2.5" fill="#1a1a1a"/>

  <!-- R2 (SCL) -->
  <line x1="755" y1="138" x2="755" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="747" y="220" width="16" height="30" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="770" y="239" font-size="11" fill="#6b7280" text-anchor="start">R2 4.7k</text>
  <line x1="755" y1="250" x2="755" y2="270" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="755" cy="270" r="2.5" fill="#1a1a1a"/>

  <!-- I2C Sensor Device Box (Panel 2) -->
  <rect x="805" y="170" width="120" height="130" rx="6" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="865" y="195" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">I2C Sensor</text>
  <text x="865" y="213" font-size="11" fill="#6b7280" text-anchor="middle">(BME280 / OLED)</text>
  <text x="865" y="240" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Active I2C Bus</text>
  <text x="865" y="258" font-size="11" fill="#6b7280" text-anchor="middle">Bidirectional</text>

  <!-- Result Box (Panel 2) -->
  <rect x="520" y="340" width="405" height="40" rx="4" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="722.5" y="365" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Повноцінна робота шини I2C без конфліктів</text>

  <!-- Bottom Summary Card -->
  <rect x="20" y="415" width="920" height="35" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="437" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Висновок: Підтяжки I2C (4.7 кОм до 3.3V) природно розтягують GPIO0 та GPIO2 у стан 1 при старті, задовольняючи вимогам Flash Boot</text>
</svg>
