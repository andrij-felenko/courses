<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="960" height="490" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="490" fill="white"/>

  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема засувок IOMUX та стробування Power-On Reset (POR)</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Фіксація логічних рівнів strapping-ліній защепками завантажувача під час підйому живлення VDD</text>

  <!-- ПАНЕЛЬ 1: Апаратна схема засувки IOMUX (Ліворуч) -->
  <rect x="30" y="70" width="425" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="242.5" y="96" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Структурна схема засувки IOMUX</text>

  <!-- Вхідний вивід GPIO Pin -->
  <rect x="50" y="180" width="75" height="50" rx="4" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="87.5" y="204" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GPIO Pin</text>
  <text x="87.5" y="220" font-size="11" fill="#6b7280" text-anchor="middle">GPIO0/2/15</text>

  <!-- Лінія від Pin до Тригера Шмітта -->
  <line x1="125" y1="205" x2="165" y2="205" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Тригер Шмітта -->
  <rect x="165" y="180" width="80" height="50" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="205" y="202" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Тригер</text>
  <text x="205" y="220" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Шмітта</text>

  <!-- Лінія від Тригера Шмітта до D-засувки -->
  <line x1="245" y1="205" x2="285" y2="205" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- D-Засувка IOMUX -->
  <rect x="285" y="170" width="85" height="70" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="327.5" y="194" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">D-Засувка</text>
  <text x="327.5" y="212" font-size="11" fill="#6b7280" text-anchor="middle">IOMUX</text>
  <text x="327.5" y="228" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Latch</text>

  <!-- Схема POR -->
  <rect x="165" y="280" width="80" height="50" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="205" y="302" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Схема POR</text>
  <text x="205" y="320" font-size="11" fill="#6b7280" text-anchor="middle">Reset</text>

  <!-- Лінія стробу від POR до засувки -->
  <path d="M 245,305 L 327.5,305 L 327.5,240" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
  <text x="286" y="296" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Строб (Strobe)</text>

  <!-- Лінія від D-засувки до Регістра режиму ROM Boot -->
  <path d="M 370,205 L 392.5,205 L 392.5,340" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Блок Регістра Boot -->
  <rect x="345" y="340" width="95" height="50" rx="4" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="392.5" y="362" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Boot Register</text>
  <text x="392.5" y="378" font-size="11" fill="#6b7280" text-anchor="middle">Режим ROM</text>

  <!-- ПАНЕЛЬ 2: Часова діаграма Latch Window (Праворуч) -->
  <rect x="480" y="70" width="450" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="705" y="96" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Часова діаграма Latch Window</text>

  <!-- Зона Latch Window -->
  <rect x="680" y="115" width="100" height="275" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="730" y="132" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Latch Window</text>
  <text x="730" y="147" font-size="11" fill="#6b7280" text-anchor="middle">(Вікно фіксації)</text>

  <!-- Вертикальні лінії часових відліків -->
  <line x1="580" y1="115" x2="580" y2="390" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="680" y1="115" x2="680" y2="390" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="780" y1="115" x2="780" y2="390" stroke="#2457d6" stroke-width="2"/>
  <line x1="870" y1="115" x2="870" y2="390" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Позначки часу вгорі -->
  <text x="580" y="108" font-size="11" fill="#6b7280" text-anchor="middle">t0: VDD ON</text>
  <text x="680" y="108" font-size="11" fill="#6b7280" text-anchor="middle">t1: V_por</text>
  <text x="780" y="108" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">t2: Latch</text>
  <text x="870" y="108" font-size="11" fill="#27ae60" text-anchor="middle">t3: ROM Boot</text>

  <!-- Сигнал 1: Напруга VDD -->
  <text x="495" y="195" font-size="12" font-weight="bold" fill="#1a1a1a">VDD (3.3V)</text>
  <path d="M 540,215 L 580,215 C 630,215 650,178 680,175 L 900,175" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- Сигнал 2: POR Reset Signal -->
  <text x="495" y="250" font-size="12" font-weight="bold" fill="#c0392b">Сигнал POR</text>
  <path d="M 540,270 L 580,270 L 580,230 L 780,230 L 780,270 L 900,270" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="680" y="224" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Строб фіксації</text>

  <!-- Сигнал 3: Strapping рівні GPIO -->
  <text x="495" y="315" font-size="12" font-weight="bold" fill="#2457d6">GPIO0/2/15</text>
  <path d="M 540,295 L 780,295 L 790,300 L 900,300" fill="none" stroke="#27ae60" stroke-width="2"/>
  <path d="M 540,330 L 780,330 L 790,325 L 900,325" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="730" y="318" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Стабільний рівень</text>

  <!-- Сигнал 4: Зафіксований стан у регістрі -->
  <text x="495" y="375" font-size="12" font-weight="bold" fill="#27ae60">Стан засувки</text>
  <path d="M 540,380 L 780,380 L 780,355 L 900,355" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <text x="840" y="348" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Режим зафіксовано (Flash Boot)</text>

  <!-- Нижня картка підсумку -->
  <rect x="30" y="440" width="900" height="40" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="465" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Параметри защепкування: V_por ≈ 1.6 В, Вікно Latch = t1...t2 (~30 мкс), Захист від завад живлення</text>
</svg>
