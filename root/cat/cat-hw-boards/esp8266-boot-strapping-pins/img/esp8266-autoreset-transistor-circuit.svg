<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Електрична схема автопрошивання ESP8266 на NPN-транзисторах</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Логіка формування імпульсів RESET та GPIO0 при маніпуляціях сигналами DTR і RTS USB-UART адаптера</text>

  <!-- Left Panel: USB-to-UART Converter -->
  <rect x="30" y="80" width="160" height="260" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="110" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">USB-UART</text>
  <text x="110" y="123" text-anchor="middle" font-size="12" fill="#6b7280">CP2102 / CH340</text>

  <text x="175" y="155" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">DTR</text>
  <line x1="180" y1="160" x2="660" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>

  <text x="175" y="205" text-anchor="end" font-size="11" fill="#6b7280">TXD</text>
  <text x="175" y="230" text-anchor="end" font-size="11" fill="#6b7280">RXD</text>

  <text x="175" y="275" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">RTS</text>
  <line x1="180" y1="280" x2="660" y2="280" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Transistor Q1 (NPN) - Controls RESET -->
  <text x="440" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Q1 (S8050 NPN)</text>
  <circle cx="440" cy="160" r="18" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="430" y1="150" x2="430" y2="170" stroke="#2457d6" stroke-width="2.5"/>
  <!-- Collector Q1 -->
  <line x1="430" y1="154" x2="450" y2="142" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="450" y1="142" x2="450" y2="140" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="450" y1="140" x2="660" y2="140" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="660" y1="140" x2="660" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Emitter Q1 -->
  <line x1="430" y1="166" x2="450" y2="178" stroke="#2457d6" stroke-width="1.5"/>
  <polygon points="444,178 452,179 448,172" fill="#2457d6"/>
  <line x1="450" y1="178" x2="450" y2="195" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="450" y1="195" x2="250" y2="195" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="250" y1="195" x2="250" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="250" cy="160" r="2.5" fill="#1a1a1a"/>
  <!-- Base Q1 & Resistor R1 -->
  <line x1="430" y1="160" x2="390" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="360" y="152" width="30" height="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="375" y="146" text-anchor="middle" font-size="10" fill="#6b7280">10 kΩ (R1)</text>
  <line x1="360" y1="160" x2="330" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="330" y1="160" x2="330" y2="280" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="330" cy="280" r="2.5" fill="#1a1a1a"/>

  <!-- Transistor Q2 (NPN) - Controls GPIO0 -->
  <text x="440" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Q2 (S8050 NPN)</text>
  <circle cx="440" cy="280" r="18" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="430" y1="270" x2="430" y2="290" stroke="#2457d6" stroke-width="2.5"/>
  <!-- Collector Q2 -->
  <line x1="430" y1="274" x2="450" y2="262" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="450" y1="262" x2="450" y2="250" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="450" y1="250" x2="660" y2="250" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="660" y1="250" x2="660" y2="280" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Emitter Q2 -->
  <line x1="430" y1="286" x2="450" y2="298" stroke="#2457d6" stroke-width="1.5"/>
  <polygon points="444,298 452,299 448,292" fill="#2457d6"/>
  <line x1="450" y1="298" x2="450" y2="315" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="450" y1="315" x2="210" y2="315" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="210" y1="315" x2="210" y2="280" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="210" cy="280" r="2.5" fill="#1a1a1a"/>
  <!-- Base Q2 & Resistor R2 -->
  <line x1="430" y1="280" x2="390" y2="280" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="360" y="272" width="30" height="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="375" y="266" text-anchor="middle" font-size="10" fill="#6b7280">10 kΩ (R2)</text>
  <line x1="360" y1="280" x2="290" y2="280" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="290" y1="280" x2="290" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="290" cy="160" r="2.5" fill="#1a1a1a"/>

  <!-- Right Panel: ESP8266 Module -->
  <rect x="710" y="80" width="220" height="260" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="820" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">ESP8266 / ESP-12F</text>
  <text x="820" y="123" text-anchor="middle" font-size="12" fill="#6b7280">Target Microcontroller</text>

  <!-- RESET Pin & Pull-up -->
  <line x1="660" y1="160" x2="710" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="710" cy="160" r="3.5" fill="#2457d6"/>
  <text x="720" y="164" font-size="12" font-weight="bold" fill="#1a1a1a">RESET</text>
  <!-- Pull-Up R_pu1 -->
  <circle cx="685" cy="160" r="2.5" fill="#1a1a1a"/>
  <line x1="685" y1="160" x2="685" y2="145" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="677" y="125" width="16" height="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="670" y="137" text-anchor="end" font-size="10" fill="#6b7280">10 kΩ</text>
  <line x1="685" y1="125" x2="685" y2="118" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="685" y="114" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">3.3V</text>

  <!-- GPIO0 Pin & Pull-up -->
  <line x1="660" y1="280" x2="710" y2="280" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="710" cy="280" r="3.5" fill="#2457d6"/>
  <text x="720" y="284" font-size="12" font-weight="bold" fill="#1a1a1a">GPIO0</text>
  <!-- Pull-Up R_pu2 -->
  <circle cx="685" cy="280" r="2.5" fill="#1a1a1a"/>
  <line x1="685" y1="280" x2="685" y2="265" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="677" y="245" width="16" height="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="670" y="257" text-anchor="end" font-size="10" fill="#6b7280">10 kΩ</text>
  <line x1="685" y1="245" x2="685" y2="238" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="685" y="234" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">3.3V</text>

  <!-- Internal Strapping Pins Labels -->
  <text x="720" y="200" font-size="11" fill="#27ae60">GPIO2: Pull-Up (10k → 3.3V)</text>
  <text x="720" y="230" font-size="11" fill="#c0392b">GPIO15: Pull-Down (10k → GND)</text>

  <!-- Bottom Panel: Operation Logic Table -->
  <rect x="30" y="360" width="900" height="85" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="380" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Таблиця станів автоматичного скидання (Auto-Reset Logic)</text>

  <rect x="45" y="390" width="870" height="22" rx="4" fill="#eaf0fd"/>
  <text x="110" y="405" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">DTR (USB)</text>
  <text x="210" y="405" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">RTS (USB)</text>
  <text x="310" y="405" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Q1 (RESET)</text>
  <text x="410" y="405" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Q2 (GPIO0)</text>
  <text x="510" y="405" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">RESET Pin</text>
  <text x="610" y="405" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">GPIO0 Pin</text>
  <text x="780" y="405" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Результат / Режим завантаження</text>

  <rect x="45" y="415" width="870" height="22" rx="4" fill="#e9f7ef"/>
  <text x="110" y="430" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">1 (HIGH)</text>
  <text x="210" y="430" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">0 (LOW)</text>
  <text x="310" y="430" text-anchor="middle" font-size="11" fill="#6b7280">OFF</text>
  <text x="410" y="430" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">ON</text>
  <text x="510" y="430" text-anchor="middle" font-size="11" fill="#27ae60">1 (3.3V)</text>
  <text x="610" y="430" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">0 (GND)</text>
  <text x="780" y="430" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">UART Download Mode (Готовий до прошивки)</text>
</svg>
