<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="530" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема комутації сигналів ESP-01 / ESP-01S для вибору режиму завантаження</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Для режиму UART Bootloader: GPIO0 замикається на GND (0V) під час короткого імпульсу скидання RST</text>

  <!-- Ліва панель: Принципова схема -->
  <rect x="30" y="70" width="530" height="435" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Заголовок лівої панелі -->
  <rect x="45" y="82" width="230" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="160" y="98" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Електрична схема принципова</text>

  <!-- Шина живлення +3.3V (VCC) -->
  <line x1="55" y1="130" x2="365" y2="130" stroke="#c0392b" stroke-width="2.5"/>
  <rect x="55" y="105" width="85" height="20" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="97.5" y="119" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+3.3V (VCC)</text>

  <!-- Шина землі GND (0V) -->
  <line x1="55" y1="475" x2="365" y2="475" stroke="#1a1a1a" stroke-width="2.5"/>
  <rect x="55" y="480" width="75" height="20" rx="4" fill="#e2e8f0" stroke="#1a1a1a" stroke-width="1"/>
  <text x="92.5" y="494" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GND (0V)</text>

  <!-- VCC -> ESP-01 VCC Pin -->
  <path d="M 365 130 V 205 H 380" fill="none" stroke="#c0392b" stroke-width="2"/>
  <circle cx="365" cy="130" r="3.5" fill="#c0392b"/>

  <!-- Line 1: CH_PD (EN) Line -->
  <path d="M 145 130 V 165 M 145 201 V 250 H 380" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="145" cy="130" r="3.5" fill="#1a1a1a"/>
  <rect x="137" y="165" width="16" height="36" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="133" y="187" font-size="12" fill="#6b7280" text-anchor="end">10kΩ</text>
  <text x="133" y="235" font-size="12" fill="#2457d6" text-anchor="end">ESP-01S: вбуд.</text>

  <!-- Line 2: RST Line, R2, SW_RESET -->
  <path d="M 205 130 V 175 M 205 211 V 300 H 380 M 205 300 V 320 M 205 360 V 475" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="205" cy="130" r="3.5" fill="#1a1a1a"/>
  <rect x="197" y="175" width="16" height="36" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="193" y="197" font-size="12" fill="#6b7280" text-anchor="end">10kΩ</text>

  <!-- Вузол RST -->
  <circle cx="205" cy="300" r="3.5" fill="#1a1a1a"/>

  <!-- Перемикач SW_RESET -->
  <circle cx="205" cy="320" r="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="205" cy="360" r="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="205" y1="360" x2="193" y2="325" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="185" y1="340" x2="199" y2="340" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="192" y1="340" x2="192" y2="345" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="205" cy="475" r="3.5" fill="#1a1a1a"/>

  <!-- Позначка SW_RESET -->
  <rect x="120" y="322" width="75" height="36" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="157.5" y="337" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">SW_RESET</text>
  <text x="157.5" y="351" font-size="12" fill="#6b7280" text-anchor="middle">(Reset)</text>

  <!-- Line 3: GPIO0 Line, R3, SW_FLASH -->
  <path d="M 275 130 V 190 M 275 226 V 355 M 275 375 V 415 M 275 415 V 475" fill="none" stroke="#2457d6" stroke-width="2"/>
  <line x1="275" y1="355" x2="380" y2="355" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="275" cy="130" r="3.5" fill="#1a1a1a"/>
  <rect x="267" y="190" width="16" height="36" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="263" y="212" font-size="12" fill="#6b7280" text-anchor="end">10kΩ</text>

  <!-- Вузол GPIO0 -->
  <circle cx="275" cy="355" r="3.5" fill="#2457d6"/>

  <!-- Перемикач SW_FLASH -->
  <circle cx="275" cy="375" r="3" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="275" cy="415" r="3" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="275" y1="415" x2="263" y2="380" stroke="#2457d6" stroke-width="2"/>
  <line x1="255" y1="395" x2="269" y2="395" stroke="#2457d6" stroke-width="2"/>
  <line x1="262" y1="395" x2="262" y2="400" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="275" cy="475" r="3.5" fill="#1a1a1a"/>

  <!-- Позначка SW_FLASH -->
  <rect x="286" y="377" width="55" height="36" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="313.5" y="392" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">SW_FLASH</text>
  <text x="313.5" y="406" font-size="12" fill="#2457d6" text-anchor="middle">(Boot)</text>

  <!-- Line 4: GPIO2 Line & R4 -->
  <path d="M 345 130 V 220 M 345 256 V 410 H 380" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="345" cy="130" r="3.5" fill="#1a1a1a"/>
  <rect x="337" y="220" width="16" height="36" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="333" y="242" font-size="12" fill="#6b7280" text-anchor="end">10kΩ</text>

  <!-- GND з'єднання ESP-01 -->
  <path d="M 380 450 H 365 V 475" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="365" cy="475" r="3.5" fill="#1a1a1a"/>

  <!-- Модуль ESP-01 / ESP-01S -->
  <rect x="380" y="115" width="165" height="360" rx="8" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <rect x="380" y="115" width="165" height="35" rx="8" fill="#334155"/>
  <text x="462.5" y="137" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">ESP-01 / ESP-01S</text>

  <!-- Зображення антени -->
  <rect x="392" y="155" width="141" height="38" rx="3" fill="#0284c7" opacity="0.2"/>
  <path d="M 400 158 H 525 V 163 H 410 V 168 H 525 V 173 H 400" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="462.5" y="187" font-size="12" fill="#cbd5e1" text-anchor="middle">PCB Antenna</text>

  <!-- Контакти модуля -->
  <circle cx="380" cy="205" r="4" fill="#f59e0b" stroke="#ffffff" stroke-width="1"/>
  <text x="392" y="209" font-size="12" font-weight="bold" fill="#ffffff">VCC</text>

  <circle cx="380" cy="250" r="4" fill="#f59e0b" stroke="#ffffff" stroke-width="1"/>
  <text x="392" y="254" font-size="12" font-weight="bold" fill="#ffffff">CH_PD (EN)</text>

  <circle cx="380" cy="300" r="4" fill="#f59e0b" stroke="#ffffff" stroke-width="1"/>
  <text x="392" y="304" font-size="12" font-weight="bold" fill="#ffffff">RST</text>

  <circle cx="380" cy="355" r="4" fill="#f59e0b" stroke="#ffffff" stroke-width="1"/>
  <text x="392" y="359" font-size="12" font-weight="bold" fill="#ffffff">GPIO0</text>

  <circle cx="380" cy="410" r="4" fill="#f59e0b" stroke="#ffffff" stroke-width="1"/>
  <text x="392" y="414" font-size="12" font-weight="bold" fill="#ffffff">GPIO2</text>

  <circle cx="380" cy="450" r="4" fill="#f59e0b" stroke="#ffffff" stroke-width="1"/>
  <text x="392" y="454" font-size="12" font-weight="bold" fill="#ffffff">GND</text>

  <!-- Права панель: Таблиці та опис режимів -->
  <rect x="580" y="70" width="350" height="435" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Заголовок правої панелі -->
  <rect x="595" y="85" width="320" height="28" rx="5" fill="#1e293b"/>
  <text x="755" y="104" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">РЕЖИМИ ЗАВАНТАЖЕННЯ (BOOT MODES)</text>

  <!-- Картка 1: Режим прошивки -->
  <rect x="595" y="125" width="320" height="170" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="605" y="135" width="175" height="22" rx="4" fill="#2457d6"/>
  <text x="692.5" y="150" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1. UART Download Mode</text>
  <text x="790" y="150" font-size="12" font-weight="bold" fill="#2457d6">(Прошивка)</text>

  <!-- Рядки рівнів для Режиму 1 -->
  <rect x="605" y="165" width="75" height="20" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="642.5" y="179" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">LOW (0V)</text>
  <text x="690" y="179" font-size="12" fill="#1a1a1a">SW_FLASH натиснута (GPIO0 ➔ GND)</text>

  <rect x="605" y="191" width="75" height="20" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="642.5" y="205" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Pulse LOW</text>
  <text x="690" y="205" font-size="12" fill="#1a1a1a">Коротке скидання SW_RESET</text>

  <rect x="605" y="217" width="75" height="20" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="642.5" y="231" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">HIGH (3.3V)</text>
  <text x="690" y="231" font-size="12" fill="#1a1a1a">CH_PD і GPIO2 підтягнуті до VCC</text>

  <text x="605" y="253" font-size="12" font-weight="bold" fill="#2457d6">Порядок переходу в режим Bootloader:</text>
  <text x="605" y="268" font-size="12" fill="#1a1a1a">1. Затиснути SW_FLASH (GPIO0 ➔ GND)</text>
  <text x="605" y="283" font-size="12" fill="#1a1a1a">2. Клацнути SW_RESET, відпустити SW_FLASH</text>

  <!-- Картка 2: Звичайний режим -->
  <rect x="595" y="307" width="320" height="105" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="605" y="317" width="165" height="22" rx="4" fill="#27ae60"/>
  <text x="687.5" y="332" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">2. Normal Run Mode</text>
  <text x="780" y="332" font-size="12" font-weight="bold" fill="#27ae60">(Робота)</text>

  <rect x="605" y="347" width="75" height="20" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="642.5" y="361" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">HIGH (3.3V)</text>
  <text x="690" y="361" font-size="12" fill="#1a1a1a">SW_FLASH відпущена (Pull-up)</text>

  <rect x="605" y="373" width="75" height="20" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="642.5" y="387" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">HIGH (3.3V)</text>
  <text x="690" y="387" font-size="12" fill="#1a1a1a">SW_RESET відпущена (Pull-up)</text>

  <text x="605" y="403" font-size="12" font-style="italic" fill="#27ae60">Виконання коду з Flash-пам'яті</text>

  <!-- Картка 3: Попередження про живлення -->
  <rect x="595" y="422" width="320" height="73" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="605" y="437" font-size="12" font-weight="bold" fill="#c0392b">⚠️ Вимоги до живлення 3.3V:</text>
  <text x="605" y="453" font-size="12" fill="#1a1a1a">• Струм у піках до 300 mA (потрібен LDO 3.3V)</text>
  <text x="605" y="469" font-size="12" fill="#1a1a1a">• GPIO15 на ESP-01 підтягнутий до GND усередині</text>
</svg>
