<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Header -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема підключення автономного вузла давача на ESP-01S</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Мінімальна обв'язка завдяки вбудованим підтягувальним резисторам ревізії ESP-01S</text>

  <!-- Power Rails (+3.3V Top & GND Bottom) -->
  <!-- 3.3V Rail Line (Red) -->
  <line x1="84" y1="125" x2="885" y2="125" stroke="#c0392b" stroke-width="2"/>
  <!-- 3.3V Tag Box -->
  <rect x="32" y="112" width="52" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="58" y="129" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+3.3 В</text>

  <!-- GND Rail Line (Dark) -->
  <line x1="84" y1="330" x2="885" y2="330" stroke="#1a1a1a" stroke-width="2"/>
  <!-- GND Tag Box -->
  <rect x="32" y="317" width="52" height="26" rx="4" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="58" y="334" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GND</text>

  <!-- Panel 1: Power Filtering Section (Left) -->
  <rect x="25" y="70" width="245" height="295" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="147.5" y="92" font-size="13" font-weight="bold" fill="#6b7280" text-anchor="middle">Фільтрація живлення</text>

  <!-- C1 Branch (Electrolytic 100uF) at x=110 -->
  <circle cx="110" cy="125" r="3.5" fill="#c0392b"/>
  <line x1="110" y1="125" x2="110" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="95" y1="175" x2="125" y2="175" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="95" y1="185" x2="125" y2="185" stroke="#1a1a1a" stroke-width="3"/>
  <text x="113" y="170" font-size="12" font-weight="bold" fill="#c0392b">+</text>
  <line x1="110" y1="185" x2="110" y2="330" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="110" cy="330" r="3.5" fill="#1a1a1a"/>

  <!-- C1 Labels (Placed to the left of x=92) -->
  <text x="92" y="168" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">C1</text>
  <text x="92" y="215" font-size="12" fill="#6b7280" text-anchor="end">100 мкФ</text>
  <text x="92" y="233" font-size="12" fill="#6b7280" text-anchor="end">електроліт</text>

  <!-- C2 Branch (Ceramic 0.1uF) at x=185 -->
  <circle cx="185" cy="125" r="3.5" fill="#c0392b"/>
  <line x1="185" y1="125" x2="185" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="170" y1="175" x2="200" y2="175" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="170" y1="185" x2="200" y2="185" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="185" y1="185" x2="185" y2="330" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="185" cy="330" r="3.5" fill="#1a1a1a"/>

  <!-- C2 Labels (Placed to the right of x=203) -->
  <text x="203" y="168" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">C2</text>
  <text x="203" y="215" font-size="12" fill="#6b7280" text-anchor="start">0.1 мкФ</text>
  <text x="203" y="233" font-size="12" fill="#6b7280" text-anchor="start">кераміка</text>

  <!-- Panel 2: ESP-01S Module (Center) -->
  <rect x="295" y="70" width="370" height="295" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="480" y="92" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Модуль ESP-01S</text>

  <!-- Power Routing to ESP-01S -->
  <circle cx="315" cy="125" r="3.5" fill="#c0392b"/>
  <polyline points="315,125 315,145 325,145" fill="none" stroke="#c0392b" stroke-width="2"/>
  <circle cx="325" cy="145" r="3" fill="#c0392b"/>
  <text x="305" y="142" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">3V3</text>

  <circle cx="315" cy="330" r="3.5" fill="#1a1a1a"/>
  <polyline points="315,330 315,310 325,310" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="325" cy="310" r="3" fill="#1a1a1a"/>
  <text x="305" y="304" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">GND</text>

  <!-- Internal Pull-up Box inside ESP-01S -->
  <rect x="325" y="140" width="315" height="205" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="480" y="160" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Вбудовані резистори 12 кОм</text>

  <!-- Row 1: EN -->
  <text x="335" y="189" font-size="12" fill="#1a1a1a">EN (CH_PD)</text>
  <line x1="418" y1="185" x2="445" y2="185" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="445" y="180" width="24" height="10" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <line x1="469" y1="185" x2="495" y2="185" stroke="#27ae60" stroke-width="1.5"/>
  <text x="502" y="189" font-size="12" fill="#27ae60">12 кОм → 3.3V</text>

  <!-- Row 2: RST -->
  <text x="335" y="219" font-size="12" fill="#1a1a1a">RST</text>
  <line x1="418" y1="215" x2="445" y2="215" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="445" y="210" width="24" height="10" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <line x1="469" y1="215" x2="495" y2="215" stroke="#27ae60" stroke-width="1.5"/>
  <text x="502" y="219" font-size="12" fill="#27ae60">12 кОм → 3.3V</text>

  <!-- Row 3: GPIO0 -->
  <text x="335" y="249" font-size="12" fill="#1a1a1a">GPIO0 (IO0)</text>
  <line x1="418" y1="245" x2="445" y2="245" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="445" y="240" width="24" height="10" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <line x1="469" y1="245" x2="495" y2="245" stroke="#27ae60" stroke-width="1.5"/>
  <text x="502" y="249" font-size="12" fill="#27ae60">12 кОм → 3.3V</text>

  <!-- Row 4: GPIO2 -->
  <text x="335" y="279" font-size="12" fill="#1a1a1a">GPIO2 (IO2)</text>
  <line x1="418" y1="275" x2="445" y2="275" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="445" y="270" width="24" height="10" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <line x1="469" y1="275" x2="495" y2="275" stroke="#27ae60" stroke-width="1.5"/>
  <text x="502" y="279" font-size="12" fill="#27ae60">12 кОм → 3.3V</text>

  <!-- Badge inside internal box -->
  <rect x="345" y="302" width="270" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="480" y="319" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Зовнішні резистори не потрібні</text>

  <!-- Data Signal Routing from GPIO2 to Sensor -->
  <circle cx="412" cy="275" r="3" fill="#2457d6"/>
  <polyline points="412,275 412,292 688,292 688,275" fill="none" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="645" y="286" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">GPIO2</text>
  <text x="677.5" y="286" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">DATA</text>

  <!-- Panel 3: Sensor Module (Right) -->
  <rect x="690" y="70" width="245" height="295" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="812.5" y="90" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Давач температури</text>
  <text x="812.5" y="106" font-size="12" fill="#6b7280" text-anchor="middle">DS18B20 / DHT22</text>

  <!-- Sensor Power Connection VDD -->
  <circle cx="885" cy="125" r="3.5" fill="#c0392b"/>
  <polyline points="885,125 885,155 700,155" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="705" y="147" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">VDD (3.3V)</text>

  <!-- Sensor DATA Pin Label -->
  <text x="705" y="263" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">DATA</text>

  <!-- Sensor GND Connection -->
  <circle cx="885" cy="330" r="3.5" fill="#1a1a1a"/>
  <polyline points="885,330 885,305 700,305" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="705" y="297" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">GND</text>

  <!-- Sensor Annotations inside Panel 3 -->
  <text x="812.5" y="198" font-size="12" fill="#1a1a1a" text-anchor="middle">Шина даних One-Wire</text>
  <text x="812.5" y="216" font-size="12" fill="#6b7280" text-anchor="middle">підтяжка всередині ESP</text>

  <!-- Bottom Summary Cards -->
  <!-- Left Card (Green) -->
  <rect x="25" y="385" width="445" height="110" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="45" y="408" font-size="14" font-weight="bold" fill="#27ae60">Переваги схеми ESP-01S</text>
  <text x="45" y="432" font-size="12" fill="#1a1a1a">• Резистори 12 кОм інтегровані на платі (EN, RST, IO0, IO2)</text>
  <text x="45" y="452" font-size="12" fill="#1a1a1a">• Гарантований старт у робочому режимі без зовнішньої обв'язки</text>
  <text x="45" y="472" font-size="12" fill="#1a1a1a">• Мінімальні габарити та висока надійність автономного вузла</text>

  <!-- Right Card (Blue) -->
  <rect x="490" y="385" width="445" height="110" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="510" y="408" font-size="14" font-weight="bold" fill="#2457d6">Вимоги до джерела живлення 3.3 В</text>
  <text x="510" y="432" font-size="12" fill="#1a1a1a">• С1 (100 мкФ) компенсує піки струму Wi-Fi (до 300 мА)</text>
  <text x="510" y="452" font-size="12" fill="#1a1a1a">• С2 (0.1 мкФ) пригнічує високочастотні завади біля VCC</text>
  <text x="510" y="472" font-size="12" fill="#1a1a1a">• Стабілізатор повинен забезпечувати струм від 500 мА</text>
</svg>
