<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="540" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Схемотехнічні відмінності модулів ESP-01 та ESP-01S</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">ESP-01S має вбудовані підтяжки 12 кОм на RST/EN/GPIO0/2 та світлодіод на GPIO2</text>

  <!-- Left Panel: ESP-01 -->
  <rect x="30" y="75" width="435" height="405" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="45" y="88" width="405" height="32" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="247" y="109" font-size="14" font-weight="700" fill="#c0392b" text-anchor="middle">Модуль ESP-01 (базова ревізія)</text>

  <!-- ESP-01 Sub-block 1: Control line pull-ups -->
  <rect x="45" y="132" width="405" height="200" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="148" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="start">1. Підтяжка ліній керування</text>
  <text x="440" y="148" font-size="12" font-weight="700" fill="#c0392b" text-anchor="end">Зовнішні підтяжки</text>

  <!-- ESP-01 PCB boundary -->
  <rect x="52" y="162" width="165" height="135" rx="4" fill="none" stroke="#c0392b" stroke-dasharray="4,4" stroke-width="1.5"/>

  <!-- ESP8266 IC -->
  <rect x="60" y="168" width="84" height="122" rx="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
  <text x="102" y="186" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">ESP8266EX</text>
  <text x="138" y="208" font-size="12" fill="#6b7280" text-anchor="end">RST</text>
  <text x="138" y="230" font-size="12" fill="#6b7280" text-anchor="end">EN</text>
  <text x="138" y="252" font-size="12" fill="#6b7280" text-anchor="end">IO0</text>
  <text x="138" y="274" font-size="12" fill="#6b7280" text-anchor="end">IO2</text>

  <!-- Wires & Resistors for ESP-01 -->
  <line x1="144" y1="204" x2="250" y2="204" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="144" y1="226" x2="295" y2="226" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="144" y1="248" x2="340" y2="248" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="144" y1="270" x2="385" y2="270" stroke="#1a1a1a" stroke-width="1.5"/>

  <line x1="230" y1="174" x2="395" y2="174" stroke="#2457d6" stroke-width="2"/>
  <text x="400" y="178" font-size="12" font-weight="700" fill="#2457d6" text-anchor="start">+3.3V</text>

  <line x1="250" y1="174" x2="250" y2="204" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="243" y="182" width="14" height="14" fill="#fdecea" stroke="#c0392b"/>
  <text x="260" y="194" font-size="12" fill="#c0392b" text-anchor="start">10k</text>

  <line x1="295" y1="174" x2="295" y2="226" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="288" y="182" width="14" height="14" fill="#fdecea" stroke="#c0392b"/>
  <text x="305" y="194" font-size="12" fill="#c0392b" text-anchor="start">10k</text>

  <line x1="340" y1="174" x2="340" y2="248" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="333" y="182" width="14" height="14" fill="#fdecea" stroke="#c0392b"/>
  <text x="350" y="194" font-size="12" fill="#c0392b" text-anchor="start">10k</text>

  <line x1="385" y1="174" x2="385" y2="270" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="378" y="182" width="14" height="14" fill="#fdecea" stroke="#c0392b"/>
  <text x="395" y="194" font-size="12" fill="#c0392b" text-anchor="start">10k</text>

  <!-- ESP-01 Sub-block 1 warning badge -->
  <rect x="55" y="302" width="385" height="22" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="247" y="317" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">⚠️ Без зовнішніх R1-R4 модуль висне / не стартує</text>

  <!-- ESP-01 Sub-block 2: LEDs -->
  <rect x="45" y="344" width="405" height="128" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="361" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="start">2. Індикаційні світлодіоди (2 світлодіоди)</text>

  <rect x="55" y="370" width="185" height="64" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="147" y="386" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Power LED (Червоний)</text>
  <text x="147" y="404" font-size="12" fill="#1a1a1a" text-anchor="middle">VCC → R → LED → GND</text>
  <text x="147" y="422" font-size="12" fill="#c0392b" text-anchor="middle">Постійне споживання струму</text>

  <rect x="250" y="370" width="190" height="64" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="345" y="386" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">TXD LED (Синій)</text>
  <text x="345" y="404" font-size="12" fill="#1a1a1a" text-anchor="middle">TXD (GPIO1) → LED → GND</text>
  <text x="345" y="422" font-size="12" fill="#6b7280" text-anchor="middle">Блимає лише при передачі</text>

  <rect x="55" y="442" width="385" height="22" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="247" y="457" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">🔴 2 світлодіоди (Power + TXD), високе споживання</text>

  <!-- Right Panel: ESP-01S -->
  <rect x="495" y="75" width="435" height="405" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="510" y="88" width="405" height="32" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712" y="109" font-size="14" font-weight="700" fill="#27ae60" text-anchor="middle">Модуль ESP-01S (оновлена ревізія)</text>

  <!-- ESP-01S Sub-block 1: Integrated Pull-ups -->
  <rect x="510" y="132" width="405" height="200" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="520" y="148" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="start">1. Підтяжка ліній керування</text>
  <text x="905" y="148" font-size="12" font-weight="700" fill="#27ae60" text-anchor="end">Вбудовані R1–R4 (12 кОм)</text>

  <!-- Integrated PCB Box -->
  <rect x="518" y="162" width="304" height="135" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>

  <!-- ESP8266 IC inside ESP-01S -->
  <rect x="525" y="168" width="84" height="122" rx="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
  <text x="567" y="186" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">ESP8266EX</text>
  <text x="603" y="208" font-size="12" fill="#6b7280" text-anchor="end">RST</text>
  <text x="603" y="230" font-size="12" fill="#6b7280" text-anchor="end">EN</text>
  <text x="603" y="252" font-size="12" fill="#6b7280" text-anchor="end">IO0</text>
  <text x="603" y="274" font-size="12" fill="#6b7280" text-anchor="end">IO2</text>

  <!-- Wires & Integrated Resistors for ESP-01S -->
  <line x1="609" y1="204" x2="645" y2="204" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="609" y1="230" x2="688" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="609" y1="252" x2="731" y2="252" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="609" y1="274" x2="774" y2="274" stroke="#1a1a1a" stroke-width="1.5"/>

  <line x1="630" y1="174" x2="784" y2="174" stroke="#2457d6" stroke-width="2"/>
  <text x="789" y="178" font-size="12" font-weight="700" fill="#2457d6" text-anchor="start">+3.3V</text>

  <line x1="645" y1="174" x2="645" y2="204" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="638" y="182" width="14" height="14" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="654" y="194" font-size="12" fill="#27ae60" text-anchor="start">12k</text>

  <line x1="688" y1="174" x2="688" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="681" y="182" width="14" height="14" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="697" y="194" font-size="12" fill="#27ae60" text-anchor="start">12k</text>

  <line x1="731" y1="174" x2="731" y2="252" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="724" y="182" width="14" height="14" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="740" y="194" font-size="12" fill="#27ae60" text-anchor="start">12k</text>

  <line x1="774" y1="174" x2="774" y2="274" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="767" y="182" width="14" height="14" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="783" y="194" font-size="12" fill="#27ae60" text-anchor="start">12k</text>

  <!-- External Area for ESP-01S -->
  <rect x="828" y="162" width="82" height="135" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="869" y="210" font-size="12" font-weight="700" fill="#6b7280" text-anchor="middle">Зовнішні</text>
  <text x="869" y="226" font-size="12" fill="#6b7280" text-anchor="middle">підтяжки</text>
  <text x="869" y="252" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">НЕ потрібні</text>

  <!-- ESP-01S Sub-block 1 solution badge -->
  <rect x="520" y="302" width="385" height="22" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="712" y="317" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">✅ Пряме підключення до живлення та програматора</text>

  <!-- ESP-01S Sub-block 2: LEDs -->
  <rect x="510" y="344" width="405" height="128" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="520" y="361" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="start">2. Індикаційний світлодіод (1 світлодіод)</text>

  <rect x="520" y="370" width="185" height="64" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="612" y="386" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Power LED</text>
  <text x="612" y="404" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">ПРИБРАНО з схеми</text>
  <text x="612" y="422" font-size="12" fill="#6b7280" text-anchor="middle">Економія енергії</text>

  <rect x="715" y="370" width="190" height="64" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="810" y="386" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Blue LED (Синій)</text>
  <text x="810" y="404" font-size="12" fill="#1a1a1a" text-anchor="middle">VCC → R → LED → GPIO2</text>
  <text x="810" y="422" font-size="12" fill="#2457d6" text-anchor="middle">Керування: LOW (активний 0)</text>

  <rect x="520" y="442" width="385" height="22" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="712" y="457" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">🔵 1 світлодіод на GPIO2 (Active-LOW), Power LED видалено</text>

  <!-- Footer bar -->
  <rect x="30" y="494" width="900" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="480" y="510" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Висновок: ESP-01S спрощує схемотехніку (вбудовані підтяжки) та заощаджує енергію (без Power LED)</text>
</svg>
