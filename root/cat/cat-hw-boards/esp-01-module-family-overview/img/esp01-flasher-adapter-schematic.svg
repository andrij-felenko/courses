<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Принципова схема адаптера-флешера для ESP-01 / ESP-01S</text>
  <text x="480" y="52" font-size="13" text-anchor="middle" fill="#6b7280">Схема комутації живлення 3.3V (AMS1117), USB-UART та кнопок Reset і Flash</text>

  <!-- Панель 1: USB-UART Конвертер -->
  <rect x="30" y="75" width="180" height="465" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="120" y="98" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">USB-UART Конвертер</text>
  <text x="120" y="115" font-size="12" text-anchor="middle" fill="#6b7280">(FT232 / CP2102 / CH340)</text>

  <!-- Чип USB-UART -->
  <rect x="45" y="140" width="150" height="340" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="120" y="165" font-size="13" font-weight="bold" text-anchor="middle" fill="#2457d6">Модуль USB-UART</text>

  <!-- Виводи USB-UART -->
  <circle cx="195" cy="200" r="3.5" fill="#2457d6"/>
  <text x="182" y="204" font-size="12" font-weight="bold" text-anchor="end" fill="#2457d6">5V (VBUS)</text>

  <circle cx="195" cy="310" r="3.5" fill="#2457d6"/>
  <text x="182" y="314" font-size="12" font-weight="bold" text-anchor="end" fill="#2457d6">TXD</text>

  <circle cx="195" cy="370" r="3.5" fill="#2457d6"/>
  <text x="182" y="374" font-size="12" font-weight="bold" text-anchor="end" fill="#2457d6">RXD</text>

  <circle cx="195" cy="450" r="3.5" fill="#2457d6"/>
  <text x="182" y="454" font-size="12" font-weight="bold" text-anchor="end" fill="#2457d6">GND</text>


  <!-- Панель 2: Стабілізатор 3.3V та фільтри -->
  <rect x="230" y="75" width="220" height="465" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="340" y="98" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Стабілізатор 3.3V</text>
  <text x="340" y="115" font-size="12" text-anchor="middle" fill="#6b7280">AMS1117-3.3 та фільтри</text>

  <!-- Чип AMS1117 -->
  <rect x="290" y="150" width="100" height="80" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="340" y="182" font-size="13" font-weight="bold" text-anchor="middle" fill="#2457d6">AMS1117</text>
  <text x="340" y="200" font-size="12" text-anchor="middle" fill="#2457d6">3.3V 1A</text>
  <text x="300" y="172" font-size="10" font-weight="bold" fill="#2457d6">VIN</text>
  <text x="380" y="172" font-size="10" font-weight="bold" text-anchor="end" fill="#2457d6">VOUT</text>
  <text x="340" y="222" font-size="10" font-weight="bold" text-anchor="middle" fill="#2457d6">GND</text>

  <!-- Позначки ліній живлення у Панелі 2 -->
  <text x="238" y="190" font-size="11" font-weight="bold" fill="#1a1a1a">5V</text>
  <text x="402" y="190" font-size="11" font-weight="bold" fill="#2457d6">+3.3V</text>

  <!-- Конденсатор C1 (вхідний 10 uF) -->
  <line x1="265" y1="200" x2="265" y2="256" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="253" y1="256" x2="277" y2="256" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="253" y1="264" x2="277" y2="264" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="265" y1="264" x2="265" y2="450" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="248" y="256" font-size="12" font-weight="bold" text-anchor="end" fill="#1a1a1a">C1</text>
  <text x="248" y="271" font-size="11" text-anchor="end" fill="#6b7280">10 µF</text>
  <text x="248" y="284" font-size="10" text-anchor="end" fill="#6b7280">(вхідний)</text>

  <!-- Конденсатор C2 (вихідний 10 uF) -->
  <line x1="415" y1="200" x2="415" y2="256" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="403" y1="256" x2="427" y2="256" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="403" y1="264" x2="427" y2="264" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="415" y1="264" x2="415" y2="450" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="430" y="256" font-size="12" font-weight="bold" text-anchor="start" fill="#1a1a1a">C2</text>
  <text x="430" y="271" font-size="11" text-anchor="start" fill="#6b7280">10 µF</text>
  <text x="430" y="284" font-size="10" text-anchor="start" fill="#6b7280">(вихідний)</text>


  <!-- Панель 3: Роз'єм ESP-01 / ESP-01S та Обв'язка -->
  <rect x="470" y="75" width="460" height="465" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="700" y="98" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Роз'єм та комутація режимів ESP-01 / ESP-01S</text>

  <!-- Модуль ESP-01 / ESP-01S Header -->
  <rect x="740" y="140" width="175" height="340" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="827" y="165" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">ESP-01 / ESP-01S</text>
  <text x="827" y="182" font-size="11" text-anchor="middle" fill="#6b7280">Роз'єм 2x4 Header</text>

  <!-- Виводи модуля ESP-01 -->
  <circle cx="740" cy="200" r="4" fill="#27ae60"/>
  <text x="752" y="204" font-size="12" font-weight="bold" fill="#1a1a1a">1: VCC (3.3V)</text>

  <circle cx="740" cy="245" r="4" fill="#27ae60"/>
  <text x="752" y="249" font-size="12" fill="#1a1a1a">2: CH_PD (EN)</text>

  <circle cx="740" cy="290" r="4" fill="#27ae60"/>
  <text x="752" y="294" font-size="12" font-weight="bold" fill="#1a1a1a">3: RST (Reset)</text>

  <circle cx="740" cy="350" r="4" fill="#27ae60"/>
  <text x="752" y="354" font-size="12" font-weight="bold" fill="#1a1a1a">4: GPIO0 (Prog)</text>

  <circle cx="740" cy="395" r="4" fill="#27ae60"/>
  <text x="752" y="399" font-size="12" fill="#1a1a1a">5: GPIO2</text>

  <circle cx="740" cy="425" r="4" fill="#27ae60"/>
  <text x="752" y="429" font-size="12" fill="#1a1a1a">6: RXD (GPIO3)</text>

  <circle cx="740" cy="450" r="4" fill="#27ae60"/>
  <text x="752" y="454" font-size="12" fill="#1a1a1a">7: TXD (GPIO1)</text>

  <circle cx="740" cy="470" r="4" fill="#27ae60"/>
  <text x="752" y="474" font-size="12" font-weight="bold" fill="#1a1a1a">8: GND</text>

  <!-- Підтяжка R4 (CH_PD) -->
  <line x1="695" y1="200" x2="695" y2="210" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="690" y="210" width="10" height="25" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="683" y="226" font-size="11" font-weight="bold" text-anchor="end" fill="#1a1a1a">R4 10k</text>
  <line x1="695" y1="235" x2="695" y2="245" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="695" y1="245" x2="740" y2="245" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Підтяжка R1 та кнопка SW1 (RST) -->
  <line x1="530" y1="200" x2="530" y2="235" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="525" y="235" width="10" height="25" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="518" y="251" font-size="11" font-weight="bold" text-anchor="end" fill="#1a1a1a">R1 10k</text>
  <line x1="530" y1="260" x2="530" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="495" y="320" width="70" height="30" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="530" y="339" font-size="11" font-weight="bold" text-anchor="middle" fill="#c0392b">SW1: RST</text>
  <line x1="530" y1="350" x2="530" y2="450" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="530" y1="290" x2="740" y2="290" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Підтяжка R2 та кнопка SW2 (GPIO0 / PROG) -->
  <line x1="620" y1="200" x2="620" y2="270" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="615" y="270" width="10" height="25" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="608" y="286" font-size="11" font-weight="bold" text-anchor="end" fill="#1a1a1a">R2 10k</text>
  <line x1="620" y1="295" x2="620" y2="380" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="585" y="380" width="70" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="620" y="399" font-size="11" font-weight="bold" text-anchor="middle" fill="#2457d6">SW2: PROG</text>
  <line x1="620" y1="410" x2="620" y2="450" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="620" y1="350" x2="740" y2="350" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Підтяжка R3 (GPIO2) -->
  <line x1="695" y1="340" x2="695" y2="365" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="690" y="365" width="10" height="25" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="683" y="381" font-size="11" font-weight="bold" text-anchor="end" fill="#1a1a1a">R3 10k</text>
  <line x1="695" y1="390" x2="695" y2="395" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="695" y1="395" x2="740" y2="395" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- З'єднання 3.3V до R3 від загальної шини -->
  <line x1="695" y1="200" x2="695" y2="210" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="695" y1="245" x2="695" y2="340" stroke="#1a1a1a" stroke-width="1.5"/>


  <!-- Міжблочні з'єднання провідників -->

  <!-- 1. Шина 5V (USB-UART to AMS1117) -->
  <line x1="195" y1="200" x2="290" y2="200" stroke="#1a1a1a" stroke-width="2"/>

  <!-- 2. Шина 3.3V (AMS1117 to ESP-01 VCC & Pull-ups) -->
  <line x1="390" y1="200" x2="740" y2="200" stroke="#2457d6" stroke-width="2"/>

  <!-- 3. Сигнальна лінія TXD (USB-UART) -> RXD (ESP-01) -->
  <line x1="195" y1="310" x2="710" y2="310" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="710" y1="310" x2="710" y2="425" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="710" y1="425" x2="740" y2="425" stroke="#2457d6" stroke-width="1.5"/>
  <text x="220" y="302" font-size="11" font-weight="bold" fill="#2457d6">TXD →</text>

  <!-- 4. Сигнальна лінія RXD (USB-UART) <- TXD (ESP-01) -->
  <line x1="740" y1="450" x2="725" y2="450" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="725" y1="450" x2="725" y2="370" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="725" y1="370" x2="195" y2="370" stroke="#2457d6" stroke-width="1.5"/>
  <text x="220" y="362" font-size="11" font-weight="bold" fill="#2457d6">RXD ←</text>

  <!-- 5. Шина GND (Спільна земля) -->
  <line x1="195" y1="450" x2="740" y2="450" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="740" y1="450" x2="740" y2="470" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="340" y1="230" x2="340" y2="450" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Вузли з'єднання (Junction Dots) -->
  <circle cx="265" cy="200" r="3.5" fill="#1a1a1a"/>
  <circle cx="415" cy="200" r="3.5" fill="#2457d6"/>
  <circle cx="530" cy="200" r="3.5" fill="#2457d6"/>
  <circle cx="620" cy="200" r="3.5" fill="#2457d6"/>
  <circle cx="695" cy="200" r="3.5" fill="#2457d6"/>

  <circle cx="530" cy="290" r="3.5" fill="#1a1a1a"/>
  <circle cx="620" cy="350" r="3.5" fill="#1a1a1a"/>
  <circle cx="695" cy="245" r="3.5" fill="#1a1a1a"/>
  <circle cx="695" cy="395" r="3.5" fill="#1a1a1a"/>

  <circle cx="265" cy="450" r="3.5" fill="#1a1a1a"/>
  <circle cx="340" cy="450" r="3.5" fill="#1a1a1a"/>
  <circle cx="415" cy="450" r="3.5" fill="#1a1a1a"/>
  <circle cx="530" cy="450" r="3.5" fill="#1a1a1a"/>
  <circle cx="620" cy="450" r="3.5" fill="#1a1a1a"/>


  <!-- Підказка режимів роботи -->
  <rect x="485" y="488" width="430" height="40" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="495" y="504" font-size="11" font-weight="bold" fill="#27ae60">Normal Run:</text>
  <text x="575" y="504" font-size="11" fill="#1a1a1a">GPIO0 = HIGH (R2), RST = HIGH (R1)</text>
  <text x="495" y="520" font-size="11" font-weight="bold" fill="#c0392b">Bootloader Mode:</text>
  <text x="600" y="520" font-size="11" fill="#1a1a1a">Натиснути SW2 (GPIO0=LOW) + затиснути SW1 (RST)</text>
</svg>
