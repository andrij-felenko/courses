<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Definitions for Markers -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема принципова зовнішньої обв'язки модуля ESP-01 / ESP-01S</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Джерело 3.3V (≥300 mA), фільтраційні конденсатори, підтяжки 10 кОм та кнопки Flash/Reset</text>

  <!-- Left Panel: Power Supply & Filtering -->
  <rect x="25" y="75" width="240" height="320" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <path d="M25,83 A8,8 0 0 1 33,75 L257,75 A8,8 0 0 1 265,75 L265,105 L25,105 Z" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="145" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Джерело живлення 3.3V</text>

  <!-- Power Supply Block -->
  <rect x="40" y="130" width="70" height="45" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="75" y="149" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">DC 3.3V</text>
  <text x="75" y="165" text-anchor="middle" font-size="12" fill="#2457d6">≥ 300 mA</text>

  <!-- Power Supply Connections -->
  <polyline points="110,145 135,145 135,120" fill="none" stroke="#c0392b" stroke-width="2"/>
  <line x1="50" y1="175" x2="50" y2="295" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Capacitor C1 (Ceramic 100 nF) -->
  <line x1="135" y1="120" x2="135" y2="195" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="123" y1="195" x2="147" y2="195" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="123" y1="203" x2="147" y2="203" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="135" y1="203" x2="135" y2="295" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="135" cy="120" r="3" fill="#c0392b"/>

  <text x="117" y="190" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">C1</text>
  <text x="117" y="204" text-anchor="end" font-size="12" fill="#6b7280">100 nF</text>
  <text x="117" y="218" text-anchor="end" font-size="12" fill="#6b7280">кераміка</text>

  <!-- Capacitor C2 (Tantalum/Electrolytic 10-100 uF) -->
  <line x1="185" y1="120" x2="185" y2="250" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="188" y="244" font-size="12" font-weight="bold" fill="#c0392b">+</text>
  <line x1="173" y1="250" x2="197" y2="250" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="173" y1="258" x2="197" y2="258" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="185" y1="258" x2="185" y2="295" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="185" cy="120" r="3" fill="#c0392b"/>

  <text x="202" y="245" font-size="12" font-weight="bold" fill="#1a1a1a">C2</text>
  <text x="202" y="259" font-size="12" fill="#6b7280">10-100 µF</text>
  <text x="202" y="273" font-size="12" fill="#6b7280">тантал</text>

  <!-- GND Bus in Left Panel -->
  <line x1="45" y1="295" x2="245" y2="295" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="50" cy="295" r="3" fill="#1a1a1a"/>
  <circle cx="135" cy="295" r="3" fill="#1a1a1a"/>
  <circle cx="185" cy="295" r="3" fill="#1a1a1a"/>

  <line x1="45" y1="295" x2="45" y2="370" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="45" cy="370" r="3" fill="#1a1a1a"/>

  <!-- Left Panel Note -->
  <rect x="55" y="310" width="190" height="46" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="150" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Фільтрація живлення</text>
  <text x="150" y="346" text-anchor="middle" font-size="12" fill="#6b7280">Гасить імпульси струму</text>

  <!-- Center Panel: ESP-01 Module & Wiring -->
  <rect x="280" y="75" width="385" height="320" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <path d="M280,83 A8,8 0 0 1 288,75 L657,75 A8,8 0 0 1 665,75 L665,105 L280,105 Z" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="472.5" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Модуль ESP-01 / ESP-01S та Обв'язка</text>

  <!-- Power Rails through Center Panel -->
  <line x1="135" y1="120" x2="615" y2="120" stroke="#c0392b" stroke-width="2"/>
  <text x="300" y="114" font-size="12" font-weight="bold" fill="#c0392b">+3.3V (VCC)</text>

  <line x1="45" y1="370" x2="710" y2="370" stroke="#1a1a1a" stroke-width="2"/>
  <text x="75" y="386" font-size="12" font-weight="bold" fill="#1a1a1a">GND (0V)</text>

  <!-- ESP-01 Module Box -->
  <rect x="435" y="135" width="120" height="230" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="445" y="145" width="100" height="25" rx="3" fill="#1a1a1a"/>
  <text x="495" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">PCB ANTENNA</text>
  <text x="495" y="188" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">ESP-01 / 01S</text>
  <text x="495" y="202" text-anchor="middle" font-size="12" fill="#6b7280">(ESP8266EX)</text>

  <!-- Left Pins & Internal Text -->
  <circle cx="435" cy="225" r="4" fill="#c0392b"/>
  <text x="443" y="229" font-size="12" font-weight="bold" fill="#c0392b">VCC</text>

  <circle cx="435" cy="260" r="4" fill="#2457d6"/>
  <text x="443" y="264" font-size="12" font-weight="bold" fill="#1a1a1a">CH_PD</text>

  <circle cx="435" cy="295" r="4" fill="#2457d6"/>
  <text x="443" y="299" font-size="12" font-weight="bold" fill="#1a1a1a">RST</text>

  <circle cx="435" cy="330" r="4" fill="#2457d6"/>
  <text x="443" y="334" font-size="12" font-weight="bold" fill="#1a1a1a">GPIO0</text>

  <!-- Right Pins & Internal Text -->
  <circle cx="555" cy="225" r="4" fill="#1a1a1a"/>
  <text x="547" y="229" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">GND</text>

  <circle cx="555" cy="260" r="4" fill="#2457d6"/>
  <text x="547" y="264" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">GPIO2</text>

  <circle cx="555" cy="295" r="4" fill="#2457d6"/>
  <text x="547" y="299" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">TX</text>

  <circle cx="555" cy="330" r="4" fill="#2457d6"/>
  <text x="547" y="334" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">RX</text>

  <!-- Pin Wiring: VCC -->
  <polyline points="435,225 295,225 295,120" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="295" cy="120" r="3" fill="#c0392b"/>

  <!-- Pin Wiring: CH_PD & R1 -->
  <line x1="435" y1="260" x2="405" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="405" y1="120" x2="405" y2="135" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="399" y="135" width="12" height="35" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="405" y1="170" x2="405" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="405" cy="120" r="3" fill="#c0392b"/>
  <text x="396" y="149" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">R1</text>
  <text x="396" y="163" text-anchor="end" font-size="12" fill="#6b7280">10 kΩ</text>

  <!-- Pin Wiring: RST, R2 & SW1 -->
  <line x1="435" y1="295" x2="360" y2="295" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="360" cy="295" r="3" fill="#1a1a1a"/>
  <!-- Pull-up R2 -->
  <line x1="360" y1="120" x2="360" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="354" y="180" width="12" height="35" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="360" y1="215" x2="360" y2="295" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="360" cy="120" r="3" fill="#c0392b"/>
  <text x="348" y="194" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">R2</text>
  <text x="348" y="208" text-anchor="end" font-size="12" fill="#6b7280">10 kΩ</text>
  <!-- Switch SW1 (RESET) -->
  <line x1="360" y1="295" x2="360" y2="325" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="360" cy="325" r="2.5" fill="#1a1a1a"/>
  <circle cx="360" cy="345" r="2.5" fill="#1a1a1a"/>
  <line x1="353" y1="323" x2="365" y2="315" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="359" y1="319" x2="359" y2="311" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="360" y1="345" x2="360" y2="370" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="360" cy="370" r="3" fill="#1a1a1a"/>
  <text x="346" y="304" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">SW1</text>
  <text x="346" y="318" text-anchor="end" font-size="12" fill="#2457d6">RESET</text>

  <!-- Pin Wiring: GPIO0, R3 & SW2 -->
  <line x1="435" y1="330" x2="310" y2="330" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="310" cy="330" r="3" fill="#1a1a1a"/>
  <!-- Pull-up R3 -->
  <line x1="310" y1="120" x2="310" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="304" y="225" width="12" height="35" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="310" y1="260" x2="310" y2="330" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="310" cy="120" r="3" fill="#c0392b"/>
  <text x="322" y="239" font-size="12" font-weight="bold" fill="#1a1a1a">R3</text>
  <text x="322" y="253" font-size="12" fill="#6b7280">10 kΩ</text>
  <!-- Switch SW2 (BOOT) -->
  <line x1="310" y1="330" x2="310" y2="340" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="310" cy="340" r="2.5" fill="#1a1a1a"/>
  <circle cx="310" cy="355" r="2.5" fill="#1a1a1a"/>
  <line x1="303" y1="338" x2="315" y2="330" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="309" y1="334" x2="309" y2="326" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="310" y1="355" x2="310" y2="370" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="310" cy="370" r="3" fill="#1a1a1a"/>
  <text x="322" y="345" font-size="12" font-weight="bold" fill="#1a1a1a">SW2</text>
  <text x="322" y="359" font-size="12" fill="#c0392b">BOOT</text>

  <!-- Pin Wiring: GPIO2 & R4 -->
  <line x1="555" y1="260" x2="615" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="615" y1="120" x2="615" y2="150" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="609" y="150" width="12" height="35" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="615" y1="185" x2="615" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="615" cy="120" r="3" fill="#c0392b"/>
  <text x="627" y="164" font-size="12" font-weight="bold" fill="#1a1a1a">R4</text>
  <text x="627" y="178" font-size="12" fill="#6b7280">10 kΩ</text>

  <!-- Pin Wiring: GND -->
  <polyline points="555,225 655,225 655,370" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="655" cy="370" r="3" fill="#1a1a1a"/>

  <!-- Right Panel: USB-UART Converter -->
  <rect x="680" y="75" width="255" height="320" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <path d="M680,83 A8,8 0 0 1 688,75 L927,75 A8,8 0 0 1 935,75 L935,105 L680,105 Z" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="807.5" y="95" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">USB-UART Програматор / PC</text>

  <!-- USB-UART Converter Box -->
  <rect x="710" y="135" width="195" height="165" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="807.5" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">USB-UART Модуль</text>
  <text x="807.5" y="175" text-anchor="middle" font-size="12" fill="#6b7280">(CP2102 / CH340G / FT232)</text>

  <!-- Converter Pin Labels -->
  <circle cx="710" cy="225" r="4" fill="#c0392b"/>
  <text x="718" y="229" font-size="12" font-weight="bold" fill="#c0392b">VCC (3.3V)</text>

  <circle cx="710" cy="260" r="4" fill="#1a1a1a"/>
  <text x="718" y="264" font-size="12" font-weight="bold" fill="#1a1a1a">GND</text>
  <line x1="710" y1="260" x2="710" y2="370" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="710" cy="370" r="3" fill="#1a1a1a"/>

  <circle cx="710" cy="295" r="4" fill="#2457d6"/>
  <text x="718" y="299" font-size="12" font-weight="bold" fill="#2457d6">RXD</text>

  <circle cx="710" cy="330" r="4" fill="#2457d6"/>
  <text x="718" y="334" font-size="12" font-weight="bold" fill="#2457d6">TXD (3.3V)</text>

  <!-- TX and RX Signal Connections -->
  <!-- TX to RXD -->
  <line x1="555" y1="295" x2="702" y2="295" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="610" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">TX → RXD</text>

  <!-- RX from TXD -->
  <line x1="710" y1="330" x2="563" y2="330" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="610" y="344" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">RX ← TXD</text>

  <!-- Warning Box inside Right Panel -->
  <rect x="715" y="345" width="210" height="42" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="820" y="361" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Увага: Рівні логіки 3.3V!</text>
  <text x="820" y="377" text-anchor="middle" font-size="12" fill="#1a1a1a">Не подавайте 5V на TXD / RXD</text>

  <!-- Bottom Panel: Reference Tables -->
  <rect x="25" y="410" width="910" height="135" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Bottom Left: Boot Modes Table -->
  <text x="275" y="428" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Логічні рівні для вибору режимів робота / прошивка</text>
  <rect x="35" y="435" width="480" height="84" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <rect x="35" y="435" width="480" height="24" fill="#eaf0fd"/>
  <text x="120" y="451" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Режим роботи</text>
  <text x="250" y="451" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">GPIO0</text>
  <text x="325" y="451" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">GPIO2</text>
  <text x="390" y="451" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">CH_PD</text>
  <text x="460" y="451" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">RST</text>

  <rect x="35" y="459" width="480" height="28" fill="#e9f7ef"/>
  <text x="120" y="477" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Flash Boot (Робота)</text>
  <text x="250" y="477" text-anchor="middle" font-size="12" fill="#1a1a1a">HIGH (1)</text>
  <text x="325" y="477" text-anchor="middle" font-size="12" fill="#1a1a1a">HIGH (1)</text>
  <text x="390" y="477" text-anchor="middle" font-size="12" fill="#1a1a1a">HIGH (1)</text>
  <text x="460" y="477" text-anchor="middle" font-size="12" fill="#1a1a1a">HIGH (1)</text>

  <rect x="35" y="487" width="480" height="32" fill="#ffffff"/>
  <text x="120" y="507" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">UART Download (Прошивка)</text>
  <text x="250" y="507" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">LOW (0) [SW2]</text>
  <text x="325" y="507" text-anchor="middle" font-size="12" fill="#1a1a1a">HIGH (1)</text>
  <text x="390" y="507" text-anchor="middle" font-size="12" fill="#1a1a1a">HIGH (1)</text>
  <text x="460" y="507" text-anchor="middle" font-size="12" fill="#1a1a1a">HIGH (1)</text>

  <!-- Divider Line -->
  <line x1="525" y1="420" x2="525" y2="535" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Bottom Right: ESP-01 vs ESP-01S Differences -->
  <text x="730" y="428" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Апаратні відмінності версій ESP-01 та ESP-01S</text>
  <rect x="540" y="435" width="380" height="84" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <circle cx="555" cy="455" r="3.5" fill="#2457d6"/>
  <text x="565" y="459" font-size="12" font-weight="bold" fill="#2457d6">ESP-01S:</text>
  <text x="628" y="459" font-size="12" fill="#1a1a1a">Вбудовані підтяжки (CH_PD, RST, GPIO0)</text>

  <circle cx="555" cy="480" r="3.5" fill="#c0392b"/>
  <text x="565" y="484" font-size="12" font-weight="bold" fill="#c0392b">ESP-01:</text>
  <text x="620" y="484" font-size="12" fill="#1a1a1a">Потребує зовнішніх підтяжок R1–R4 (10 кОм)</text>

  <circle cx="555" cy="505" r="3.5" fill="#27ae60"/>
  <text x="565" y="509" font-size="12" font-weight="bold" fill="#27ae60">LED індикатор:</text>
  <text x="665" y="509" font-size="12" fill="#6b7280">ESP-01 (Power), ESP-01S (GPIO2, LOW)</text>
</svg>
