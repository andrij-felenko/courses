<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Призначення виводів та режими завантаження ESP-01</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">Для запуску потрібен HIGH на CH_PD та GPIO2; рівень GPIO0 визначає режим: HIGH — робота, LOW — прошивка</text>

  <!-- ЛІВА ПАНЕЛЬ: Pinout -->
  <rect x="30" y="85" width="410" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="235" y="112" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розташування виводів (ESP-01 Pinout)</text>

  <!-- ESP-01 PCB Graphic -->
  <rect x="150" y="125" width="170" height="145" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="235" y="142" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ESP-01 / ESP-01S</text>

  <!-- Wi-Fi Antenna -->
  <path d="M 170 150 L 170 160 L 180 160 L 180 150 L 190 150 L 190 160 L 200 160 L 200 150 L 210 150 L 210 160 L 220 160 L 220 150 L 230 150 L 230 160 L 240 160 L 240 150 L 250 150 L 250 160 L 260 160 L 260 150 L 270 150 L 270 160 L 280 160 L 280 150 L 290 150 L 290 160 L 300 160" fill="none" stroke="#2457d6" stroke-width="2"/>
  <text x="235" y="172" font-size="10" fill="#6b7280" text-anchor="middle">Wi-Fi Антена</text>

  <!-- Pin labels above header -->
  <text x="190" y="186" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">GND</text>
  <text x="220" y="186" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="middle">IO2</text>
  <text x="250" y="186" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="middle">IO0</text>
  <text x="280" y="186" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="middle">RX</text>

  <!-- Header 2x4 box -->
  <rect x="175" y="190" width="120" height="52" rx="3" fill="#1a1a1a"/>

  <!-- Top row pins (y=203) -->
  <circle cx="190" cy="203" r="5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="220" cy="203" r="5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="250" cy="203" r="5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="280" cy="203" r="5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Bottom row pins (y=229) -->
  <circle cx="190" cy="229" r="5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="220" cy="229" r="5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="250" cy="229" r="5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="280" cy="229" r="5" fill="#f59e0b" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Pin labels below header -->
  <text x="190" y="256" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="middle">TX</text>
  <text x="220" y="256" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">EN</text>
  <text x="250" y="256" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="middle">RST</text>
  <text x="280" y="256" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">VCC</text>

  <!-- Pinout Details - Left Box (Top Row) -->
  <rect x="45" y="280" width="180" height="165" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="135" y="300" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Верхній ряд (Top Row)</text>
  <text x="55" y="326" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#c0392b">GND</tspan>: Земля (0 В)</text>
  <text x="55" y="354" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#2457d6">GPIO2</tspan>: Старт (HIGH)</text>
  <text x="55" y="382" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#2457d6">GPIO0</tspan>: Режим boot</text>
  <text x="55" y="410" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#6b7280">RXD</tspan>: UART Rx (GPIO3)</text>

  <!-- Pinout Details - Right Box (Bottom Row) -->
  <rect x="240" y="280" width="180" height="165" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="330" y="300" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Нижній ряд (Bottom Row)</text>
  <text x="250" y="326" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#6b7280">TXD</tspan>: UART Tx (GPIO1)</text>
  <text x="250" y="354" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#27ae60">CH_PD</tspan>: Вмик. (HIGH)</text>
  <text x="250" y="382" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#6b7280">RST</tspan>: Скидання (RESET)</text>
  <text x="250" y="410" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#27ae60">VCC</tspan>: Живлення (+3.3V)</text>

  <!-- ПРАВА ПАНЕЛЬ: Boot Modes -->
  <rect x="460" y="85" width="470" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="695" y="112" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Режими завантаження ESP8266</text>

  <!-- Card 1: Flash Boot -->
  <rect x="475" y="125" width="440" height="95" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="490" y="145" font-size="13" font-weight="bold" fill="#27ae60">1. Flash Boot (Нормальний режим роботи)</text>
  <rect x="800" y="132" width="100" height="20" rx="4" fill="#27ae60"/>
  <text x="850" y="146" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ОСНОВНИЙ</text>

  <rect x="490" y="156" width="125" height="26" rx="4" fill="#ffffff" stroke="#27ae60"/>
  <text x="552" y="173" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">CH_PD = HIGH</text>

  <rect x="625" y="156" width="125" height="26" rx="4" fill="#ffffff" stroke="#27ae60"/>
  <text x="687" y="173" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">GPIO0 = HIGH</text>

  <rect x="760" y="156" width="125" height="26" rx="4" fill="#ffffff" stroke="#27ae60"/>
  <text x="822" y="173" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">GPIO2 = HIGH</text>

  <text x="490" y="204" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#27ae60">Результат:</tspan> Виконання збереженої прошивки з Flash-пам'яті</text>

  <!-- Card 2: UART Download -->
  <rect x="475" y="235" width="440" height="95" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="490" y="255" font-size="13" font-weight="bold" fill="#2457d6">2. UART Download (Режим прошивки)</text>
  <rect x="800" y="242" width="100" height="20" rx="4" fill="#2457d6"/>
  <text x="850" y="256" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ПРОШИВКА</text>

  <rect x="490" y="266" width="125" height="26" rx="4" fill="#ffffff" stroke="#2457d6"/>
  <text x="552" y="283" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">CH_PD = HIGH</text>

  <rect x="625" y="266" width="125" height="26" rx="4" fill="#2457d6" stroke="#2457d6"/>
  <text x="687" y="283" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">GPIO0 = LOW</text>

  <rect x="760" y="266" width="125" height="26" rx="4" fill="#ffffff" stroke="#2457d6"/>
  <text x="822" y="283" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">GPIO2 = HIGH</text>

  <text x="490" y="314" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#2457d6">Результат:</tspan> Очікування завантаження нового коду через UART</text>

  <!-- Card 3: Error Mode -->
  <rect x="475" y="345" width="440" height="95" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="490" y="365" font-size="13" font-weight="bold" fill="#c0392b">3. Стан помилки (Блокування запуску)</text>
  <rect x="800" y="352" width="100" height="20" rx="4" fill="#c0392b"/>
  <text x="850" y="366" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">ПОМИЛКА</text>

  <rect x="490" y="376" width="195" height="26" rx="4" fill="#ffffff" stroke="#c0392b"/>
  <text x="587" y="393" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">CH_PD = LOW (Вимкнено)</text>

  <rect x="695" y="376" width="195" height="26" rx="4" fill="#ffffff" stroke="#c0392b"/>
  <text x="792" y="393" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">GPIO2 = LOW (SDIO mode)</text>

  <text x="490" y="424" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#c0392b">Результат:</tspan> Чип знеструмлений або зависає під час завантаження</text>
</svg>
