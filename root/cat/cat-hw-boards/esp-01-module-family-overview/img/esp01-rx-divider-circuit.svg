<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема узгодження рівнів 5V TX → 3.3V RX дільником напруги</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Дільник знижує 5 В до безпечних 3,3 В на RX ESP-01 з урахуванням ємності C_in</text>

  <!-- Left Main Panel: Circuit & Voltages -->
  <rect x="30" y="75" width="580" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="98" text-anchor="start" font-size="14" font-weight="bold" fill="#1a1a1a">Електрична схема та розподіл потенціалів</text>

  <!-- MCU 5V Block -->
  <rect x="45" y="125" width="100" height="285" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="95" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">MCU 5V</text>
  <text x="95" y="166" text-anchor="middle" font-size="12" fill="#6b7280">(Arduino)</text>

  <circle cx="145" cy="210" r="4" fill="#2457d6"/>
  <text x="135" y="205" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">TX</text>
  <text x="95" y="225" text-anchor="middle" font-size="12" fill="#1a1a1a">5.0 V HIGH</text>

  <circle cx="145" cy="360" r="4" fill="#6b7280"/>
  <text x="135" y="355" text-anchor="end" font-size="12" fill="#6b7280">GND</text>

  <!-- ESP-01 Block -->
  <rect x="475" y="125" width="110" height="285" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="530" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">ESP-01</text>
  <text x="530" y="166" text-anchor="middle" font-size="12" fill="#6b7280">(ESP8266)</text>

  <circle cx="475" cy="210" r="4" fill="#2457d6"/>
  <text x="490" y="205" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">RX</text>

  <polygon points="505,195 505,225 530,210" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="530" y1="195" x2="530" y2="225" stroke="#2457d6" stroke-width="1.5"/>
  <text x="530" y="250" text-anchor="middle" font-size="12" fill="#1a1a1a">CMOS Input</text>
  <text x="530" y="300" text-anchor="middle" font-size="12" fill="#1a1a1a">V_IH ≥ 2.0V</text>
  <text x="530" y="320" text-anchor="middle" font-size="12" fill="#27ae60">V_max = 3.6V</text>

  <circle cx="475" cy="360" r="4" fill="#6b7280"/>

  <!-- Circuit Wiring & Elements -->
  <!-- Wire from TX to R1 -->
  <line x1="145" y1="210" x2="180" y2="210" stroke="#1a1a1a" stroke-width="2"/>

  <!-- R1 Resistor -->
  <rect x="180" y="200" width="70" height="20" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="215" y="185" text-anchor="middle" font-size="12" fill="#6b7280">Верхнє плече</text>
  <text x="215" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">R1 = 1 kΩ</text>

  <!-- Current Arrow I_div -->
  <line x1="150" y1="230" x2="260" y2="230" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <text x="205" y="246" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">I_div = 1.67 mA</text>

  <!-- Wire from R1 to Node V_RX -->
  <line x1="250" y1="210" x2="300" y2="210" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Node V_RX -->
  <circle cx="300" cy="210" r="5" fill="#27ae60"/>
  <text x="315" y="185" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">V_RX = 3.33 V</text>

  <!-- Wire from Node V_RX to C_in Node and ESP RX -->
  <line x1="300" y1="210" x2="410" y2="210" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="410" y1="210" x2="475" y2="210" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Branch R2 (Vertical at x=300) -->
  <line x1="300" y1="210" x2="300" y2="250" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="290" y="250" width="20" height="60" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="278" y="275" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">R2 = 2 kΩ</text>
  <text x="278" y="293" text-anchor="end" font-size="12" fill="#6b7280">Нижнє плече</text>
  <line x1="300" y1="310" x2="300" y2="360" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Branch C_in (Vertical at x=410) -->
  <line x1="410" y1="210" x2="410" y2="245" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="397" y1="245" x2="423" y2="245" stroke="#6b7280" stroke-width="2"/>
  <line x1="397" y1="253" x2="423" y2="253" stroke="#6b7280" stroke-width="2"/>
  <line x1="410" y1="253" x2="410" y2="360" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="385" y="270" text-anchor="end" font-size="12" fill="#6b7280">
    <tspan x="385" dy="0">C_in</tspan>
    <tspan x="385" dy="15">≈ 5..10 pF</tspan>
  </text>

  <!-- GND Rail -->
  <line x1="145" y1="360" x2="475" y2="360" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="300" cy="360" r="4" fill="#1a1a1a"/>
  <circle cx="410" cy="360" r="3" fill="#6b7280"/>

  <!-- Earth Ground Symbol -->
  <line x1="235" y1="360" x2="235" y2="375" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="223" y1="375" x2="247" y2="375" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="228" y1="380" x2="242" y2="380" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="232" y1="385" x2="238" y2="385" stroke="#1a1a1a" stroke-width="1"/>
  <text x="235" y="402" text-anchor="middle" font-size="12" fill="#6b7280">Спільна земля (GND)</text>

  <!-- Right Top Card: Formulas & Calculations -->
  <rect x="630" y="75" width="300" height="155" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="645" y="98" text-anchor="start" font-size="14" font-weight="bold" fill="#1a1a1a">Розрахунок дільника</text>
  <text x="645" y="125" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">V_RX = V_TX × [ R2 / (R1 + R2) ]</text>
  <text x="645" y="146" text-anchor="start" font-size="13" font-weight="bold" fill="#27ae60">V_RX = 5 В × (2 кОм / 3 кОм) = 3.33 В</text>
  <text x="645" y="168" text-anchor="start" font-size="12" fill="#1a1a1a">I_div = 5 В / 3 кОм = 1.67 мА</text>
  <text x="645" y="190" text-anchor="start" font-size="12" fill="#6b7280">Співвідношення: R1 : R2 = 1 : 2</text>
  <text x="645" y="210" text-anchor="start" font-size="12" fill="#6b7280">Номінали: 1 kΩ / 2 kΩ або 1.8 kΩ / 3.3 kΩ</text>

  <!-- Right Bottom Card: Logic States & C_in -->
  <rect x="630" y="245" width="300" height="195" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="645" y="268" text-anchor="start" font-size="14" font-weight="bold" fill="#1a1a1a">Логічні стани та ємність C_in</text>

  <rect x="645" y="280" width="270" height="42" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="655" y="296" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">HIGH (1): TX = 5 В → RX = 3.33 В</text>
  <text x="655" y="312" text-anchor="start" font-size="12" fill="#1a1a1a">Заряд C_in, рівень в межах норми</text>

  <rect x="645" y="330" width="270" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="655" y="346" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">LOW (0): TX = 0 В → RX = 0 В</text>
  <text x="655" y="362" text-anchor="start" font-size="12" fill="#1a1a1a">Розряд C_in через дільник на GND</text>

  <text x="645" y="392" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">Час спаду: τ = (R1 ∥ R2) · C_in ≈ 4.4 нс</text>
  <text x="645" y="410" text-anchor="start" font-size="12" fill="#6b7280">Фронти без спотворень на UART 115200</text>
</svg>
