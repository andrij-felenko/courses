<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="530" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Режими роботи ESP-01: Командний AT-режим та прозорий TCP-тунель</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Маркер '&gt;' перемикає модуль у прямий двосторонній потік байтів, а комбінація '+++' відновлює AT-керування</text>

  <!-- STATE MACHINE SECTION (Y = 85 .. 275) -->
  <!-- Left Panel: Command Mode -->
  <rect x="40" y="85" width="360" height="190" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="55" y="100" width="220" height="26" rx="4" fill="#e2e8f0"/>
  <text x="165" y="117" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Командний режим (AT-команди)</text>
  
  <text x="60" y="148" font-size="12" fill="#1a1a1a">• AT+CIPMUX=0 — одиночне з'єднання</text>
  <text x="60" y="171" font-size="12" fill="#1a1a1a">• AT+CIPMODE=1 — режим Passthrough</text>
  <text x="60" y="194" font-size="12" fill="#1a1a1a">• AT+CIPSTART="TCP",... — сесія</text>
  <text x="60" y="217" font-size="12" fill="#1a1a1a">• AT+CIPSEND — запуск передачі</text>
  <text x="60" y="240" font-size="12" fill="#6b7280">• Обробка відповідей OK / ERROR / +IPD</text>

  <!-- Right Panel: Passthrough Mode -->
  <rect x="560" y="85" width="360" height="190" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="575" y="100" width="240" height="26" rx="4" fill="#2457d6"/>
  <text x="695" y="117" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Прозорий режим (Passthrough)</text>
  
  <text x="580" y="148" font-size="12" font-weight="700" fill="#2457d6">• Прямий тунель UART ↔ Wi-Fi TCP</text>
  <text x="580" y="171" font-size="12" fill="#1a1a1a">• Будь-які байти проходять без оверхеду</text>
  <text x="580" y="194" font-size="12" fill="#1a1a1a">• Обробку AT-команд призупинено</text>
  <text x="580" y="217" font-size="12" fill="#1a1a1a">• Відсутні префікси та заголовки +IPD</text>
  <text x="580" y="240" font-size="12" fill="#27ae60">• Двосторонній транзит у реальному часі</text>

  <!-- Transitions Between States -->
  <!-- Entrance: Command -> Passthrough -->
  <line x1="400" y1="135" x2="548" y2="135" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="425" y="106" width="100" height="22" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="475" y="121" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Маркер '&gt;'</text>
  <text x="475" y="156" font-size="11" fill="#6b7280" text-anchor="middle">Вхід у тунель</text>

  <!-- Exit: Passthrough -> Command -->
  <line x1="560" y1="225" x2="412" y2="225" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <rect x="425" y="196" width="100" height="22" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="475" y="211" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Символи '+++'</text>
  <text x="475" y="246" font-size="11" fill="#6b7280" text-anchor="middle">Вихід у AT-режим</text>

  <!-- DATAFLOW SECTION (Y = 295 .. 510) -->
  <!-- Actor 1: MCU -->
  <rect x="40" y="295" width="200" height="38" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="140" y="319" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Мікроконтролер (MCU)</text>

  <!-- Actor 2: ESP-01 -->
  <rect x="380" y="295" width="200" height="38" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="319" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">Модуль ESP-01 (Wi-Fi)</text>

  <!-- Actor 3: TCP Server -->
  <rect x="720" y="295" width="200" height="38" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="820" y="319" font-size="13" font-weight="700" fill="#27ae60" text-anchor="middle">TCP Сервер / Мережа</text>

  <!-- Step 1: AT+CIPSEND -->
  <line x1="140" y1="360" x2="468" y2="360" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="310" y="352" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">1. AT+CIPSEND</text>

  <!-- Step 2: Response OK and > -->
  <line x1="480" y1="385" x2="152" y2="385" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="310" y="377" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">2. OK \r\n &gt;</text>

  <!-- Step 3 & 4: Passthrough Active Tunnel Area -->
  <rect x="50" y="402" width="860" height="68" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" stroke-dasharray="4 3"/>
  <rect x="215" y="406" width="190" height="18" rx="3" fill="#2457d6"/>
  <text x="310" y="419" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Прозорий тунель активний</text>

  <!-- TX Data Stream -->
  <line x1="140" y1="432" x2="808" y2="432" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="475" y="426" font-size="11" font-weight="700" fill="#2457d6" text-anchor="middle">3. Передача сирих даних: UART Tx → [ESP-01] → TCP Socket (без AT-префіксів)</text>

  <!-- RX Data Stream -->
  <line x1="820" y1="454" x2="152" y2="454" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="485" y="466" font-size="11" font-weight="700" fill="#27ae60" text-anchor="middle">4. Прийом сирих даних: TCP Socket → [ESP-01] → UART Rx (без +IPD...)</text>

  <!-- Step 5: Exit Sequence +++ -->
  <line x1="140" y1="495" x2="468" y2="495" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="310" y="487" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">5. Послідовність '+++' без \r\n (пауза 1с до та після)</text>
</svg>
