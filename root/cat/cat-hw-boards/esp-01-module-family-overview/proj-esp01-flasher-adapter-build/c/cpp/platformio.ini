; PlatformIO configuration file for ESP-01 and ESP-01S Wi-Fi modules
; Конфігураційне середовище збірки прошивки мовою C++

[env:esp01_1m]
platform = espressif8266
board = esp01_1m
framework = arduino

; Швидкість послідовного порту для прошивки та моніторингу
monitor_speed = 115200
upload_speed = 115200

; Параметри флеш-пам'яті (1MB, режим DOUT для сумісності з ESP-01/01S)
board_build.flash_mode = dout
board_build.ldscript = eagle.flash.1m.ld

; Моніторинг винятків та декодування стеку
monitor_filters = default, esp8266_exception_decoder
