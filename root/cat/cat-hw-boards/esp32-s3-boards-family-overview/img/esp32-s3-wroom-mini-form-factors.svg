<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Header -->
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Конструктивні типи корпусів модулів ESP32-S3: WROOM та MINI</text>
  <text x="480" y="48" text-anchor="middle" font-size="13" fill="#6b7280">Порівняння геометрії, площі плати, розташування метал-екрана та варіантів антени (PCB vs IPEX)</text>

  <!-- LEFT PANEL: WROOM SERIES -->
  <rect x="30" y="68" width="435" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247" y="93" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Модулі серії ESP32-S3-WROOM</text>
  <text x="247" y="111" text-anchor="middle" font-size="12" fill="#6b7280">Габарити: 18.0 × 25.5 мм | Крок виводів: 1.27 мм (Castellated)</text>

  <!-- WROOM-1 Subpanel (PCB Antenna) -->
  <rect x="45" y="126" width="195" height="275" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="142" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">WROOM-1 (PCB)</text>
  
  <!-- WROOM-1 Module Drawing -->
  <g transform="translate(82, 160)">
    <!-- PCB Base -->
    <rect x="0" y="0" width="120" height="170" rx="3" fill="#1e293b"/>
