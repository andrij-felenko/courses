  <rect x="255" y="126" width="195" height="275" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="352" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">WROOM-1U (IPEX)</text>

