  <rect x="45" y="413" width="405" height="72" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="60" y="433" font-size="12" font-weight="bold" fill="#2457d6">Особливості серії WROOM:</text>
  <text x="60" y="451" font-size="12" fill="#1a1a1a">• До 36 GPIO | Опції Octal SPI (8 біт) / Quad SPI (4 біт)</text>
  <text x="60" y="469" font-size="12" fill="#6b7280">• Кращий тепловідвід для навантажених обчислень</text>


