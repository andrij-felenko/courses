  <text x="712" y="111" text-anchor="middle" font-size="12" fill="#6b7280">Габарити: 15.4 × 15.4 мм | Крок виводів: 0.85 мм (LGA/SMD)</text>

  <!-- MINI-1 Subpanel (PCB Antenna) -->
  <rect x="510" y="126" width="195" height="275" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
