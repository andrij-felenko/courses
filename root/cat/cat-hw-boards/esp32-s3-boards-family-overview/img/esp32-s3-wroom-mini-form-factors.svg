    <path d="M 12,15 L 12,6 L 25,6 L 25,15 L 38,15 L 38,6 L 51,6 L 51,15 L 64,15 L 64,6 L 77,6 L 77,15 L 90,15" fill="none" stroke="#eab308" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

