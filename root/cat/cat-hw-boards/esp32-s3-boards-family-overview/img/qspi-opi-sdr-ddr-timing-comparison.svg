<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часове порівняння передачі даних шинами QSPI / OPI в режимах SDR та DDR</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Режим DDR передає дані за обома фронтами тактового сигналу (Rising &amp; Falling), подвоюючи пропускну здатність</text>

  <!-- 1. SDR Mode Panel -->
  <rect x="40" y="80" width="880" height="155" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="56" y="102" font-size="14" font-weight="bold" fill="#c0392b">1. Режим SDR (Single Data Rate) — Зчитування 1 раз за такт (тільки фронт ↑)</text>

  <text x="205" y="138" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">SCLK (SDR)</text>
  <text x="205" y="195" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="end">Дані IO[7:0]</text>

  <!-- SCLK (SDR) Waveform -->
  <path d="M 220,145 L 220,120 L 290,120 L 290,145 L 360,145 L 360,120 L 430,120 L 430,145 L 500,145 L 500,120 L 570,120 L 570,145 L 640,145 L 640,120 L 710,120 L 710,145 L 780,145 L 780,120 L 850,120 L 850,145 L 900,145" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Sample Point Dashed Projections (SDR) -->
  <line x1="220" y1="150" x2="220" y2="125" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="220" y="114" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">↑ Sample 1</text>

  <line x1="360" y1="150" x2="360" y2="125" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="360" y="114" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">↑ Sample 2</text>

  <line x1="500" y1="150" x2="500" y2="125" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="500" y="114" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">↑ Sample 3</text>

  <line x1="640" y1="150" x2="640" y2="125" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="640" y="114" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">↑ Sample 4</text>

  <!-- SDR Data Cells -->
  <polygon points="225,190 232,175 348,175 355,190 348,205 232,205" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="290" y="194" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Байт D0 (1-й такт)</text>

  <polygon points="365,190 372,175 488,175 495,190 488,205 372,205" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="430" y="194" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Байт D1 (2-й такт)</text>

  <polygon points="505,190 512,175 628,175 635,190 628,205 512,205" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="570" y="194" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Байт D2 (3-й такт)</text>

  <polygon points="645,190 652,175 768,175 775,190 768,205 652,205" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="710" y="194" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Байт D3 (4-й такт)</text>

  <text x="840" y="194" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">1 такт = 1 Байт</text>

  <!-- 2. DDR Mode Panel -->
  <rect x="40" y="250" width="880" height="165" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="56" y="272" font-size="14" font-weight="bold" fill="#27ae60">2. Режим DDR (Double Data Rate) — Зчитування 2 рази за такт (фронти ↑ та ↓)</text>

  <text x="205" y="308" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">SCLK (DDR)</text>
  <text x="205" y="365" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="end">Дані IO[7:0]</text>

  <!-- SCLK (DDR) Waveform -->
  <path d="M 220,315 L 220,290 L 290,290 L 290,315 L 360,315 L 360,290 L 430,290 L 430,315 L 500,315 L 500,290 L 570,290 L 570,315 L 640,315 L 640,290 L 710,290 L 710,315 L 780,315 L 780,290 L 850,290 L 850,315 L 900,315" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Sample Point Projections (DDR: Rising ↑ and Falling ↓) -->
  <line x1="220" y1="320" x2="220" y2="295" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="290" y1="320" x2="290" y2="295" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3"/>

  <line x1="360" y1="320" x2="360" y2="295" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="430" y1="320" x2="430" y2="295" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3"/>

  <line x1="500" y1="320" x2="500" y2="295" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="570" y1="320" x2="570" y2="295" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- DDR Data Cells (2 Bytes per clock period) -->
  <polygon points="225,360 230,345 280,345 285,360 280,375 230,375" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="255" y="364" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">D0_A (↑)</text>

  <polygon points="295,360 300,345 350,345 355,360 350,375 300,375" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="325" y="364" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">D0_B (↓)</text>

  <polygon points="365,360 370,345 420,345 425,360 420,375 370,375" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="395" y="364" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">D1_A (↑)</text>

  <polygon points="435,360 440,345 490,345 495,360 490,375 440,375" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="465" y="364" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">D1_B (↓)</text>

  <polygon points="505,360 510,345 560,345 565,360 560,375 510,375" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="535" y="364" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">D2_A (↑)</text>

  <polygon points="575,360 580,345 630,345 635,360 630,375 580,375" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="605" y="364" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">D2_B (↓)</text>

  <polygon points="645,360 650,345 700,345 705,360 700,375 650,375" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="675" y="364" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">D3_A (↑)</text>

  <polygon points="715,360 720,345 770,345 775,360 770,375 720,375" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="745" y="364" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">D3_B (↓)</text>

  <text x="500" y="396" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Подвоєна щільність даних: 2 Байти за один період SCLK (↑ Фронт + ↓ Зріз)</text>
  <text x="840" y="364" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">1 такт = 2 Байти</text>

  <!-- Bottom Summary / Math Box -->
  <rect x="40" y="430" width="880" height="75" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="451" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Формула підсумкової пропускної здатності шини PSRAM</text>
  <text x="480" y="472" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">B_SDR = N_bits × f_clk / 8  (40–80 МБ/с)   ──►   B_DDR = N_bits × f_clk × 2 / 8  (160–240 МБ/с)</text>
  <text x="480" y="492" font-size="12" fill="#6b7280" text-anchor="middle">Завдяки 8-бітній шині Octal SPI у режимі DDR 80 МГц ESP32-S3 досягає 160 МБ/с, повністю виключаючи затримки L1-кешу та AI.</text>
</svg>
