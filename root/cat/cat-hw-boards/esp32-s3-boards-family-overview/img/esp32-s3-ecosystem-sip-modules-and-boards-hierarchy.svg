<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="540" fill="white"/>
  
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Ієрархія екосистеми ESP32-S3: від SiP-чипів до готових плат</text>
  <text x="480" y="62" text-anchor="middle" font-size="13" fill="#6b7280">Послідовна інкапсуляція кристала в модулі та плати розширює периферію та спрощує розробку</text>

  <!-- Column 1: SiP Chips -->
  <rect x="30" y="80" width="260" height="440" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="40" y="90" width="240" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="160" y="111" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">1. SiP / Кремнієві чипи</text>

  <rect x="42" y="132" width="236" height="175" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="160" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">ESP32-S3 / SiP PICO</text>

  <rect x="120" y="162" width="80" height="42" rx="3" fill="#1a1a1a"/>
  <text x="160" y="188" text-anchor="middle" font-size="12" font-weight="bold" fill="white">ESP32-S3</text>

  <text x="52" y="222" font-size="12" fill="#6b7280">• Dual-Core LX7 + Vector PIE</text>
  <text x="52" y="240" font-size="12" fill="#6b7280">• 512 KB SRAM, SiP Flash/PSRAM</text>
  <text x="52" y="258" font-size="12" fill="#6b7280">• USB OTG, USB-JTAG, LCD_CAM</text>
  <text x="52" y="276" font-size="12" fill="#6b7280">• 45× GPIO, GPIO Matrix, IO MUX</text>
  <text x="52" y="294" font-size="12" fill="#6b7280">• Розмір кристала: ~7×7 мм</text>

  <rect x="42" y="317" width="236" height="193" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="160" y="337" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Вимоги до розробки</text>

  <text x="52" y="358" font-size="12" fill="#6b7280">• Зовнішній RF-тракт (2.4 ГГц)</text>
  <text x="52" y="376" font-size="12" fill="#6b7280">• Кварцовий резонатор 40 МГц</text>
  <text x="52" y="394" font-size="12" fill="#6b7280">• Схема живлення, DC-DC / LDO</text>
  <text x="52" y="412" font-size="12" fill="#6b7280">• Багатошарова PCB (Impedance)</text>

  <rect x="50" y="425" width="220" height="75" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="160" y="445" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Високий поріг входу</text>
  <text x="160" y="465" text-anchor="middle" font-size="12" fill="#1a1a1a">Потребує сертифікації FCC/CE</text>
  <text x="160" y="485" text-anchor="middle" font-size="12" fill="#6b7280">для RF-випромінювання</text>

  <!-- Column 2: Modules -->
  <rect x="320" y="80" width="320" height="440" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="330" y="90" width="300" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="111" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">2. Сертифіковані модулі</text>

  <rect x="332" y="132" width="296" height="185" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="480" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">ESP32-S3-WROOM-1 / WROOM-2</text>

  <rect x="348" y="165" width="85" height="48" rx="3" fill="#d0d7de" stroke="#6b7280"/>
  <text x="390" y="194" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">ESP-WROOM</text>
  <rect x="440" y="165" width="60" height="48" rx="2" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="470" y="194" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">PCB/IPEX</text>

  <text x="342" y="230" font-size="12" fill="#6b7280">• Flash: Quad SPI (QSPI) / Octal SPI (OPI)</text>
  <text x="342" y="248" font-size="12" fill="#6b7280">• PSRAM: Quad SPI або High-Speed OPI</text>
  <text x="342" y="266" font-size="12" fill="#6b7280">• Вбудоване екранування, 36 GPIO</text>
  <text x="342" y="284" font-size="12" fill="#6b7280">• Габарити: 18.0 × 25.5 × 3.2 мм</text>
  <text x="342" y="302" font-size="12" fill="#6b7280">• Сертифіковано FCC, CE, TELEC, SRRC</text>

  <rect x="332" y="327" width="296" height="183" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="480" y="347" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">ESP32-S3-MINI-1 / MINI-1U</text>

  <rect x="360" y="360" width="65" height="42" rx="3" fill="#d0d7de" stroke="#6b7280"/>
  <text x="392" y="386" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">MINI-1</text>
  <rect x="430" y="360" width="45" height="42" rx="2" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="452" y="386" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">PCB</text>

  <text x="342" y="420" font-size="12" fill="#6b7280">• Ультракомпактний форм-фактор</text>
  <text x="342" y="438" font-size="12" fill="#6b7280">• Вбудований SiP Flash (Embedded 4-8 MB)</text>
  <text x="342" y="456" font-size="12" fill="#6b7280">• Оптимізована розпіновка GPIO</text>
  <text x="342" y="474" font-size="12" fill="#6b7280">• Габарити: 13.2 × 16.6 × 2.4 мм</text>
  <text x="342" y="492" font-size="12" fill="#6b7280">• Ідеально для компактного IoT</text>

  <!-- Column 3: Development Boards -->
  <rect x="670" y="80" width="260" height="440" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="680" y="90" width="240" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="800" y="111" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">3. Готові плати розробки</text>

  <rect x="680" y="132" width="240" height="85" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="690" y="150" font-size="13" font-weight="bold" fill="#1a1a1a">DevKitC-1 (Стандарт)</text>
  <text x="690" y="170" font-size="12" fill="#6b7280">• 2×19 DIP pin-headers, LDO 3.3V</text>
  <text x="690" y="188" font-size="12" fill="#6b7280">• Подвійний Type-C (UART + Native)</text>
  <text x="690" y="206" font-size="12" fill="#6b7280">• Зручно для прототипування</text>

  <rect x="680" y="225" width="240" height="85" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="690" y="243" font-size="13" font-weight="bold" fill="#1a1a1a">ESP32-S3-Zero (Мікро)</text>
  <text x="690" y="263" font-size="12" fill="#6b7280">• Castellated holes (SMD-монтаж)</text>
  <text x="690" y="281" font-size="12" fill="#6b7280">• USB Type-C, RGB LED (WS2812)</text>
  <text x="690" y="299" font-size="12" fill="#6b7280">• На базі MINI-1 чи SiP</text>

  <rect x="680" y="318" width="240" height="85" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="690" y="336" font-size="13" font-weight="bold" fill="#1a1a1a">SuperMini (Ультракомпакт)</text>
  <text x="690" y="356" font-size="12" fill="#6b7280">• 17.5 × 22.5 мм, USB Type-C</text>
  <text x="690" y="374" font-size="12" fill="#6b7280">• Керамічна / PCB антена</text>
  <text x="690" y="392" font-size="12" fill="#6b7280">• Оптимізовано для портативності</text>

  <rect x="680" y="411" width="240" height="99" rx="6" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="690" y="429" font-size="13" font-weight="bold" fill="#27ae60">Touch-LCD / HMI (Мультимедіа)</text>
  <text x="690" y="449" font-size="12" fill="#1a1a1a">• Дисплей + Touch, CAM (LCD_CAM)</text>
  <text x="690" y="467" font-size="12" fill="#1a1a1a">• MicroSD slot, Li-Po контролер</text>
  <text x="690" y="485" font-size="12" font-weight="bold" fill="#27ae60">• Прискорення TinyML / CV / HMI</text>
  <text x="690" y="501" font-size="12" fill="#6b7280">• Octal PSRAM + DMA буфер</text>

  <!-- Transition Arrows -->
  <line x1="290" y1="225" x2="318" y2="225" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="290" y1="418" x2="318" y2="418" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <line x1="640" y1="174" x2="668" y2="174" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="640" y1="267" x2="668" y2="267" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="640" y1="360" x2="668" y2="360" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="640" y1="460" x2="668" y2="460" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
</svg>
