<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема подвійного USB-інтерфейсу та автоскиду для ESP32-S3</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Нативний USB CDC/JTAG та зовнішній USB-UART міст із діодним захистом VBUS і розв'язкою DTR/RTS</text>

  <!-- Left Top: Native USB Port Block -->
  <rect x="40" y="85" width="180" height="150" fill="#f4f6f8" stroke="#2457d6" stroke-width="2" rx="8"/>
  <text x="130" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Нативний USB</text>
  <text x="130" y="126" text-anchor="middle" font-size="12" fill="#6b7280">(USB-C CDC/JTAG)</text>

  <text x="205" y="149" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">VBUS1 (5V)</text>
  <circle cx="220" cy="145" r="4" fill="#c0392b"/>

  <text x="205" y="184" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">D- (GPIO19)</text>
  <circle cx="220" cy="180" r="4" fill="#2457d6"/>

  <text x="205" y="214" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">D+ (GPIO20)</text>
  <circle cx="220" cy="210" r="4" fill="#2457d6"/>

  <!-- Center Top: VBUS Protection (OR-ing) -->
  <rect x="260" y="85" width="390" height="80" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="8"/>
  <text x="455" y="104" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Вузол захисту VBUS (OR-ing)</text>

  <!-- Diode D1 Path (VBUS1) -->
  <line x1="220" y1="145" x2="240" y2="145" stroke="#c0392b" stroke-width="2"/>
  <line x1="240" y1="145" x2="240" y2="115" stroke="#c0392b" stroke-width="2"/>
  <line x1="240" y1="115" x2="290" y2="115" stroke="#c0392b" stroke-width="2"/>
  <polygon points="290,109 305,115 290,121" fill="#c0392b"/>
  <line x1="305" y1="109" x2="305" y2="121" stroke="#c0392b" stroke-width="2"/>
  <text x="297" y="132" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">D1</text>
  <line x1="305" y1="115" x2="360" y2="115" stroke="#c0392b" stroke-width="2"/>
  <line x1="360" y1="115" x2="360" y2="130" stroke="#c0392b" stroke-width="2"/>

  <!-- Diode D2 Path (VBUS2) -->
  <line x1="220" y1="290" x2="240" y2="290" stroke="#c0392b" stroke-width="2"/>
  <line x1="240" y1="290" x2="240" y2="145" stroke="#c0392b" stroke-width="2"/>
  <line x1="240" y1="145" x2="290" y2="145" stroke="#c0392b" stroke-width="2"/>
  <polygon points="290,139 305,145 290,151" fill="#c0392b"/>
  <line x1="305" y1="139" x2="305" y2="151" stroke="#c0392b" stroke-width="2"/>
  <text x="297" y="162" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">D2</text>
  <line x1="305" y1="145" x2="360" y2="145" stroke="#c0392b" stroke-width="2"/>
  <line x1="360" y1="145" x2="360" y2="130" stroke="#c0392b" stroke-width="2"/>

  <!-- VBUS Protected Output Line to ESP32 -->
  <line x1="360" y1="130" x2="680" y2="130" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="515" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Захищений 5V VEXT</text>

  <!-- Native USB Data Lines in Open Channel -->
  <line x1="220" y1="180" x2="680" y2="180" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="455" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">USB_D- → GPIO19 (Native CDC/JTAG)</text>

  <line x1="220" y1="210" x2="680" y2="210" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="455" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">USB_D+ → GPIO20 (Native CDC/JTAG)</text>

  <!-- Left Bottom: USB-UART Bridge Port Block -->
  <rect x="40" y="260" width="180" height="265" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="8"/>
  <text x="130" y="282" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">USB-UART Порт</text>
  <text x="130" y="300" text-anchor="middle" font-size="12" fill="#6b7280">(CP2102 / CH340)</text>

  <text x="205" y="294" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">VBUS2 (5V)</text>
  <circle cx="220" cy="290" r="4" fill="#c0392b"/>

  <text x="205" y="334" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">TXD</text>
  <circle cx="220" cy="330" r="4" fill="#27ae60"/>

  <text x="205" y="374" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">RXD</text>
  <circle cx="220" cy="370" r="4" fill="#27ae60"/>

  <text x="205" y="434" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">DTR</text>
  <circle cx="220" cy="430" r="4" fill="#1a1a1a"/>

  <text x="205" y="484" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">RTS</text>
  <circle cx="220" cy="480" r="4" fill="#1a1a1a"/>

  <!-- Center Bottom: Auto-Reset & UART Block -->
  <rect x="260" y="260" width="390" height="265" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="8"/>

  <!-- UART Lines Across Bottom Block -->
  <line x1="220" y1="330" x2="680" y2="330" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="455" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">TXD → U0RXD (GPIO44)</text>

  <line x1="680" y1="370" x2="220" y2="370" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="455" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">RXD ← U0TXD (GPIO43)</text>

  <!-- Auto-Reset Circuit Title -->
  <text x="455" y="405" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Вузол автоматичного скиду (DTR/RTS)</text>

  <!-- Sub-box Q1/Q2 Transistors -->
  <rect x="275" y="415" width="170" height="95" fill="#ffffff" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="360" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Транзистори Q1 / Q2</text>
  <text x="360" y="452" text-anchor="middle" font-size="12" fill="#6b7280">DTR=0, RTS=1 ⇒ EN</text>
  <text x="360" y="470" text-anchor="middle" font-size="12" fill="#6b7280">DTR=1, RTS=0 ⇒ GPIO0</text>
  <text x="360" y="495" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Автозавантаження</text>

  <!-- Sub-box RC Filter -->
  <rect x="465" y="415" width="170" height="95" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="550" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">RC-ланцюг EN</text>
  <text x="550" y="452" text-anchor="middle" font-size="12" fill="#6b7280">R_EN = 10 кОм</text>
  <text x="550" y="470" text-anchor="middle" font-size="12" fill="#6b7280">C_EN = 1 мкФ</text>
  <text x="550" y="495" text-anchor="middle" font-size="12" fill="#6b7280">Захист від завад</text>

  <!-- DTR / RTS Inputs -->
  <line x1="220" y1="430" x2="275" y2="430" stroke="#1a1a1a" stroke-width="2"/>
  <text x="245" y="424" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">DTR</text>

  <line x1="220" y1="480" x2="275" y2="480" stroke="#1a1a1a" stroke-width="2"/>
  <text x="245" y="474" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">RTS</text>

  <!-- Outputs to ESP32-S3 -->
  <line x1="635" y1="430" x2="680" y2="430" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>
  <text x="657" y="424" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">EN</text>

  <line x1="635" y1="480" x2="680" y2="480" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>
  <text x="657" y="474" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">GPIO0</text>

  <!-- Right: ESP32-S3 Module Block -->
  <rect x="680" y="85" width="240" height="440" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="8"/>
  <text x="800" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Модуль ESP32-S3</text>
  <text x="800" y="126" text-anchor="middle" font-size="12" fill="#6b7280">(WROOM-1 / MINI-1)</text>

  <!-- ESP32 Pins -->
  <circle cx="680" cy="130" r="4" fill="#c0392b"/>
  <text x="695" y="134" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">5V / VEXT (Power)</text>

  <circle cx="680" cy="180" r="4" fill="#2457d6"/>
  <text x="695" y="184" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">USB_D- (GPIO19)</text>

  <circle cx="680" cy="210" r="4" fill="#2457d6"/>
  <text x="695" y="214" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">USB_D+ (GPIO20)</text>

  <circle cx="680" cy="330" r="4" fill="#27ae60"/>
  <text x="695" y="334" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">U0RXD (GPIO44)</text>

  <circle cx="680" cy="370" r="4" fill="#27ae60"/>
  <text x="695" y="374" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">U0TXD (GPIO43)</text>

  <circle cx="680" cy="430" r="4" fill="#1a1a1a"/>
  <text x="695" y="434" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">EN (RESET)</text>

  <circle cx="680" cy="480" r="4" fill="#1a1a1a"/>
  <text x="695" y="484" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">GPIO0 (BOOT)</text>
</svg>
