<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема нативного USB та strapping-виводів ESP32-S3</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Комутація USB PHY (GPIO19/20) та конфігурація старт-режимів (GPIO0, GPIO45, GPIO46)</text>

  <!-- Panel 1: External Connectors & Strapping Input -->
  <rect x="30" y="80" width="220" height="450" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="140" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Периферія та кнопки</text>

  <!-- Box 1.1: USB Type-C Connector -->
  <rect x="45" y="125" width="190" height="135" rx="6" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="140" y="147" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Роз'єм USB Type-C</text>
  <text x="140" y="169" font-size="11" fill="#1a1a1a" text-anchor="middle">D- (Шина даних GPIO19)</text>
  <text x="140" y="189" font-size="11" fill="#1a1a1a" text-anchor="middle">D+ (Шина даних GPIO20)</text>
  <text x="140" y="211" font-size="11" fill="#6b7280" text-anchor="middle">Резистори 27 Ом + ESD</text>
  <text x="140" y="233" font-size="11" fill="#6b7280" text-anchor="middle">Живлення VBUS 5.0 В</text>

  <!-- Box 1.2: Strapping & Reset Buttons -->
  <rect x="45" y="280" width="190" height="230" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="140" y="302" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Конфігураційні кнопки</text>
  <text x="140" y="324" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Кнопка BOOT (GPIO0)</text>
  <text x="140" y="344" font-size="11" fill="#6b7280" text-anchor="middle">Pull-up 10 кОм до 3.3 В</text>
  <text x="140" y="374" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кнопка RESET (EN)</text>
  <text x="140" y="394" font-size="11" fill="#6b7280" text-anchor="middle">RC-коло 10 кОм / 1 мкФ</text>
  <text x="140" y="424" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Перемикачі напруги</text>
  <text x="140" y="444" font-size="11" fill="#6b7280" text-anchor="middle">GPIO45, GPIO46 подтяжки</text>
  <text x="140" y="474" font-size="11" fill="#27ae60" text-anchor="middle">Стабільний старт ROM</text>

  <!-- Panel 2: ESP32-S3 SoC Microcontroller -->
  <rect x="300" y="80" width="360" height="450" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="2"/>
  <text x="480" y="105" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">Мікроконтролер ESP32-S3 SoC</text>

  <!-- Box 2.1: Native USB Subsystem -->
  <rect x="315" y="125" width="330" height="135" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="480" y="147" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Підсистема нативного USB (PHY)</text>
  <text x="480" y="169" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">USB Serial / JTAG Controller</text>
  <text x="480" y="189" font-size="11" fill="#6b7280" text-anchor="middle">Апаратний CDC консольний вивід та OpenOCD</text>
  <text x="480" y="214" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">USB OTG Controller (Full-Speed 12 Мбіт/с)</text>
  <text x="480" y="234" font-size="11" fill="#6b7280" text-anchor="middle">Емуляція пристроїв HID, MSC, Host mode</text>

  <!-- Box 2.2: ROM Bootstrapping Detector -->
  <rect x="315" y="280" width="330" height="230" rx="6" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="480" y="302" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Детектор Strapping-виводів ROM</text>
  <text x="480" y="324" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GPIO0 (Режим завантаження ROM)</text>
  <text x="480" y="344" font-size="11" fill="#6b7280" text-anchor="middle">LOW: Download Mode | HIGH: SPI Flash Boot</text>
  <text x="480" y="374" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GPIO45 (Вибір напруги VDD_SPI)</text>
  <text x="480" y="394" font-size="11" fill="#6b7280" text-anchor="middle">LOW: 3.3 В Flash/PSRAM | HIGH: 1.8 В Flash</text>
  <text x="480" y="424" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GPIO46 (Діагностичне логування ROM)</text>
  <text x="480" y="444" font-size="11" fill="#6b7280" text-anchor="middle">LOW: Друк логів у UART0 | HIGH: Режим тиші</text>
  <text x="480" y="474" font-size="11" fill="#2457d6" text-anchor="middle">Зчитування рівнів при знятті сигналу EN</text>

  <!-- Panel 3: System Outcomes & Operation Modes -->
  <rect x="710" y="80" width="220" height="450" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="820" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Режими роботи</text>

  <!-- Box 3.1: ROM Boot Modes -->
  <rect x="725" y="125" width="190" height="135" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="820" y="147" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Режими старту ROM</text>
  <text x="820" y="171" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">SPI Flash Boot</text>
  <text x="820" y="191" font-size="11" fill="#6b7280" text-anchor="middle">Запуск робочої прошивки</text>
  <text x="820" y="216" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">UART/USB Download</text>
  <text x="820" y="236" font-size="11" fill="#6b7280" text-anchor="middle">Запис Flash через USB</text>

  <!-- Box 3.2: Native USB Benefits -->
  <rect x="725" y="280" width="190" height="230" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="820" y="302" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Переваги Native USB</text>
  <text x="820" y="324" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Пряме підключення</text>
  <text x="820" y="344" font-size="11" fill="#6b7280" text-anchor="middle">Без чипа CP2102/CH340</text>
  <text x="820" y="374" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Апаратний JTAG</text>
  <text x="820" y="394" font-size="11" fill="#6b7280" text-anchor="middle">Покрокова відладка C/C++</text>
  <text x="820" y="424" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Гнучкість периферії</text>
  <text x="820" y="444" font-size="11" fill="#6b7280" text-anchor="middle">Емуляція USB-клавіатур</text>
  <text x="820" y="474" font-size="11" fill="#27ae60" text-anchor="middle">Збереження виводів GPIO</text>

  <!-- Connections / Signal Lines -->
  <!-- D- USB Line -->
  <line x1="235" y1="165" x2="310" y2="165" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="272" y="155" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">D- (GPIO19)</text>

  <!-- D+ USB Line -->
  <line x1="235" y1="195" x2="310" y2="195" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="272" y="185" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">D+ (GPIO20)</text>

  <!-- GPIO0 Boot Line -->
  <line x1="235" y1="330" x2="310" y2="330" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="272" y="320" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">GPIO0</text>

  <!-- GPIO45/46 Strapping Lines -->
  <line x1="235" y1="430" x2="310" y2="430" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="272" y="420" font-size="11" fill="#1a1a1a" text-anchor="middle">GPIO45/46</text>

  <!-- ROM Logic Output -->
  <line x1="645" y1="190" x2="720" y2="190" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="682" y="180" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Логіка ROM</text>

  <!-- Native USB Benefits Output -->
  <line x1="645" y1="390" x2="720" y2="390" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="682" y="380" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">USB PHY</text>
</svg>
