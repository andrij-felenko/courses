<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="500" fill="white"/>
  
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="35" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Захоплення відеокадрів через LCD_CAM та DMA в ESP32-S3</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Камера передає кадри в SRAM та PSRAM через кільцевий буфер DMA без залучення CPU</text>

  <!-- Колонка 1: DVP Камера -->
  <rect x="40" y="85" width="180" height="310" fill="#f4f6f8" stroke="#d0d7de" rx="8"/>
  <text x="130" y="110" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">DVP Камера</text>
  <text x="130" y="128" font-size="12" fill="#6b7280" text-anchor="middle">(OV2640 / OV5640)</text>

  <rect x="55" y="145" width="150" height="105" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="6"/>
  <text x="130" y="172" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">Матриця сенсора</text>
  <text x="130" y="192" font-size="12" fill="#1a1a1a" text-anchor="middle">Синхронізація PCLK</text>
  <text x="130" y="212" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">RGB565 / YUV422</text>

  <rect x="55" y="265" width="150" height="115" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="130" y="288" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Паралельна шина</text>
  <text x="130" y="310" font-size="12" fill="#1a1a1a" text-anchor="middle">D[0..7] — 8 біт даних</text>
  <text x="130" y="330" font-size="12" fill="#1a1a1a" text-anchor="middle">PCLK — Такти пікселів</text>
  <text x="130" y="350" font-size="12" fill="#1a1a1a" text-anchor="middle">VSYNC / HREF — Кадр</text>

  <!-- Зв'язок 1-2: Шина даних -->
  <line x1="205" y1="322" x2="243" y2="322" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-accent)"/>
  <text x="225" y="312" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">8 біт</text>

  <!-- Колонка 2: Модуль LCD_CAM -->
  <rect x="250" y="85" width="180" height="310" fill="#f4f6f8" stroke="#d0d7de" rx="8"/>
  <text x="340" y="110" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Модуль LCD_CAM</text>
  <text x="340" y="128" font-size="12" fill="#6b7280" text-anchor="middle">(ESP32-S3 Периферія)</text>

  <rect x="265" y="145" width="150" height="105" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="6"/>
  <text x="340" y="172" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">CAM Rx FIFO</text>
  <text x="340" y="194" font-size="12" fill="#1a1a1a" text-anchor="middle">Апаратний прийом</text>
  <text x="340" y="214" font-size="12" fill="#1a1a1a" text-anchor="middle">байтів по PCLK</text>
  <text x="340" y="234" font-size="12" fill="#6b7280" text-anchor="middle">Асинхронний FIFO</text>

  <line x1="340" y1="250" x2="340" y2="262" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>

  <rect x="265" y="265" width="150" height="115" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="340" y="288" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Інтерфейс GDMA</text>
  <text x="340" y="310" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Пряма передача</text>
  <text x="340" y="330" font-size="12" fill="#1a1a1a" text-anchor="middle">без участі CPU</text>
  <text x="340" y="350" font-size="12" fill="#6b7280" text-anchor="middle">Авто-інкремент</text>

  <!-- Зв'язок 2-3: Потік даних -->
  <line x1="415" y1="322" x2="453" y2="322" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-accent)"/>
  <text x="435" y="312" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Stream</text>

  <!-- Колонка 3: Кільцевий буфер DMA -->
  <rect x="460" y="85" width="220" height="310" fill="#f4f6f8" stroke="#d0d7de" rx="8"/>
  <text x="570" y="110" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Кільцевий буфер DMA</text>
  <text x="570" y="128" font-size="12" fill="#6b7280" text-anchor="middle">Двохсегментний дескриптор</text>

  <rect x="475" y="145" width="190" height="105" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="570" y="168" font-size="13" font-weight="700" fill="#27ae60" text-anchor="middle">Дескриптор 0 (Ping)</text>
  <text x="570" y="188" font-size="12" fill="#1a1a1a" text-anchor="middle">buf_addr: -&gt; SRAM</text>
  <text x="570" y="208" font-size="12" fill="#1a1a1a" text-anchor="middle">length: 4095, owner: DMA</text>
  <text x="570" y="228" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">next: -&gt; Дескриптор 1</text>

  <line x1="645" y1="250" x2="645" y2="263" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="495" y1="265" x2="495" y2="252" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>

  <rect x="475" y="265" width="190" height="115" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="570" y="288" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">Дескриптор 1 (Pong)</text>
  <text x="570" y="308" font-size="12" fill="#1a1a1a" text-anchor="middle">buf_addr: -&gt; PSRAM</text>
  <text x="570" y="328" font-size="12" fill="#1a1a1a" text-anchor="middle">length: 4095, owner: DMA</text>
  <text x="570" y="348" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">next: -&gt; Дескриптор 0</text>
  <text x="570" y="366" font-size="12" fill="#6b7280" text-anchor="middle">(Кільцеве переключення)</text>

  <!-- Зв'язки 3-4: Ping і Pong шляхи -->
  <line x1="665" y1="197" x2="703" y2="197" stroke="#27ae60" stroke-width="3" marker-end="url(#arr-green)"/>
  <text x="685" y="187" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Ping</text>

  <line x1="665" y1="322" x2="703" y2="322" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-accent)"/>
  <text x="685" y="312" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Pong</text>

  <!-- Колонка 4: Пам'ять ESP32-S3 -->
  <rect x="710" y="85" width="210" height="310" fill="#f4f6f8" stroke="#d0d7de" rx="8"/>
  <text x="815" y="110" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Пам'ять ESP32-S3</text>
  <text x="815" y="128" font-size="12" fill="#6b7280" text-anchor="middle">Розділення шляхів кадрів</text>

  <rect x="725" y="145" width="180" height="105" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="815" y="168" font-size="13" font-weight="700" fill="#27ae60" text-anchor="middle">Внутрішня SRAM</text>
  <text x="815" y="188" font-size="12" fill="#1a1a1a" text-anchor="middle">Швидкий Ping-буфер</text>
  <text x="815" y="208" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Xtensa PIE (SIMD)</text>
  <text x="815" y="228" font-size="12" fill="#6b7280" text-anchor="middle">ESP-NN Прискорення</text>

  <rect x="725" y="265" width="180" height="115" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="815" y="288" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">Зовнішня PSRAM</text>
  <text x="815" y="308" font-size="12" fill="#1a1a1a" text-anchor="middle">Повнокадровий Pong</text>
  <text x="815" y="328" font-size="12" fill="#1a1a1a" text-anchor="middle">Буфер кадрів (8 MB)</text>
  <text x="815" y="348" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Виведення на LCD</text>
  <text x="815" y="366" font-size="12" fill="#6b7280" text-anchor="middle">Octal SPI Bus</text>

  <!-- Нижня панель: Обхід CPU -->
  <rect x="40" y="415" width="880" height="60" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="8"/>

  <rect x="55" y="423" width="160" height="44" fill="#ffffff" stroke="#27ae60" stroke-width="1" rx="6"/>
  <text x="135" y="441" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Ядро CPU Xtensa LX7</text>
  <text x="135" y="457" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Вільне від захоплення</text>

  <text x="235" y="441" font-size="13" font-weight="700" fill="#1a1a1a">Безперервний потік без залучення CPU (Zero-Copy DMA Transfer):</text>
  <text x="235" y="457" font-size="12" fill="#6b7280">Кадри передаються в SRAM/PSRAM апаратно, дозволяючи CPU паралельно виконувати обчислення ESP-NN</text>
</svg>
