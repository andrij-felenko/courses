<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>

  <!-- Markers -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Конструктивні відмінності модулів ESP32-S3: WROOM, MINI та SiP-чипів</text>
  <text x="480" y="48" text-anchor="middle" font-size="13" fill="#6b7280">Порівняння компонування кристалів SoC, Flash і PSRAM та еволюції формфакторів</text>

  <!-- ================= PANEL 1: WROOM MODULE ================= -->
  <rect x="30" y="65" width="285" height="405" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="172.5" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">ESP32-S3-WROOM-1 / WROOM-2</text>
  <text x="172.5" y="106" text-anchor="middle" font-size="12" fill="#6b7280">18 × 25.5 мм · Дискретні Flash/PSRAM</text>

  <!-- PCB Diagram for WROOM -->
  <rect x="50" y="120" width="245" height="210" rx="4" fill="#1b4332" stroke="#2d6a4f" stroke-width="2"/>
  
  <!-- Antenna area -->
  <path d="M 65 148 L 65 132 L 80 132 L 80 148 L 95 148 L 95 132 L 110 132 L 110 148 L 125 148 L 125 132 L 140 132 L 140 148 L 155 148 L 155 132 L 170 132 L 170 148" fill="none" stroke="#d4af37" stroke-width="3"/>
  <text x="230" y="144" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4af37">Антена (3.5 dBi)</text>

  <!-- Metal Shield boundary -->
  <rect x="60" y="162" width="225" height="158" rx="3" fill="#e9ecef" stroke="#adb5bd" stroke-dasharray="4,3"/>
  <text x="172.5" y="177" text-anchor="middle" font-size="11" font-weight="bold" fill="#6c757d">[ Металевий екран WROOM ]</text>

  <!-- SoC Chip inside WROOM -->
  <rect x="132.5" y="188" width="80" height="58" rx="3" fill="#343a40" stroke="#212529"/>
  <text x="172.5" y="212" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">ESP32-S3</text>
  <text x="172.5" y="228" text-anchor="middle" font-size="11" fill="#adb5bd">(SoC QFN56)</text>

  <!-- Flash Chip inside WROOM -->
  <rect x="72" y="264" width="86" height="46" rx="3" fill="#495057" stroke="#212529"/>
  <text x="115" y="284" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Flash Chip</text>
  <text x="115" y="299" text-anchor="middle" font-size="11" fill="#ced4da">(8–16 МБ)</text>

  <!-- PSRAM Chip inside WROOM -->
  <rect x="187" y="264" width="86" height="46" rx="3" fill="#495057" stroke="#212529"/>
  <text x="230" y="284" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">PSRAM Chip</text>
  <text x="230" y="299" text-anchor="middle" font-size="11" fill="#ced4da">(2–8 МБ)</text>

  <!-- Interconnect lines -->
  <path d="M 152.5 246 L 115 264" stroke="#2457d6" stroke-width="2"/>
  <path d="M 192.5 246 L 230 264" stroke="#2457d6" stroke-width="2"/>

  <!-- Features List for WROOM -->
  <rect x="45" y="340" width="255" height="24" rx="4" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="55" y="356" font-size="12" fill="#1a1a1a">• Пам'ять: 2 окремі зовнішні чипи</text>

  <rect x="45" y="370" width="255" height="24" rx="4" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="55" y="386" font-size="12" fill="#1a1a1a">• Шина: Quad SPI або Octal SPI</text>

  <rect x="45" y="400" width="255" height="24" rx="4" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="55" y="416" font-size="12" fill="#1a1a1a">• Виводи: 36 контактів (крок 1.27 мм)</text>

  <rect x="45" y="430" width="255" height="26" rx="4" fill="#f4f6f8" stroke="#6b7280"/>
  <text x="55" y="447" font-size="12" font-weight="bold" fill="#1a1a1a">Площа: 459 мм² (базовий модуль)</text>


  <!-- ================= PANEL 2: MINI MODULE ================= -->
  <rect x="337.5" y="65" width="285" height="405" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">ESP32-S3-MINI-1 / MINI-1U</text>
  <text x="480" y="106" text-anchor="middle" font-size="12" fill="#6b7280">13.2 × 16.6 мм · SiP SoC + Ext. Flash</text>

  <!-- PCB Diagram for MINI -->
  <rect x="357.5" y="120" width="245" height="210" rx="4" fill="#1b4332" stroke="#2d6a4f" stroke-width="2"/>

  <!-- Compact Antenna area -->
  <path d="M 375 148 L 375 134 L 387 134 L 387 148 L 399 148 L 399 134 L 411 134 L 411 148 L 423 148 L 423 134" fill="none" stroke="#d4af37" stroke-width="2.5"/>
  <text x="515" y="144" text-anchor="middle" font-size="11" font-weight="bold" fill="#d4af37">Компактна антена</text>

  <!-- Metal Shield boundary MINI -->
  <rect x="367.5" y="162" width="225" height="158" rx="3" fill="#e9ecef" stroke="#adb5bd" stroke-dasharray="4,3"/>
  <text x="480" y="177" text-anchor="middle" font-size="11" font-weight="bold" fill="#6c757d">[ Зменшений екран MINI ]</text>

  <!-- SiP SoC Chip inside MINI -->
  <rect x="378" y="192" width="102" height="118" rx="4" fill="#1d3557" stroke="#212529"/>
  <!-- SoC Die inside SiP -->
  <rect x="386" y="200" width="86" height="46" rx="2" fill="#343a40"/>
  <text x="429" y="220" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">SoC Die</text>
  <text x="429" y="235" text-anchor="middle" font-size="11" fill="#adb5bd">(ESP32-S3)</text>

  <!-- PSRAM Die inside SiP -->
  <rect x="386" y="252" width="86" height="50" rx="2" fill="#c0392b"/>
  <text x="429" y="271" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">PSRAM (SiP)</text>
  <text x="429" y="287" text-anchor="middle" font-size="11" fill="#fdecea">(2/8 МБ в корпусі)</text>

  <!-- External Flash Chip inside MINI -->
  <rect x="495" y="200" width="86" height="102" rx="3" fill="#495057" stroke="#212529"/>
  <text x="538" y="246" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Flash Chip</text>
  <text x="538" y="263" text-anchor="middle" font-size="11" fill="#ced4da">(8 МБ QSPI)</text>

  <!-- Interconnect line -->
  <line x1="480" y1="250" x2="495" y2="250" stroke="#2457d6" stroke-width="2"/>

  <!-- Features List for MINI -->
  <rect x="352.5" y="340" width="255" height="24" rx="4" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="362.5" y="356" font-size="12" fill="#1a1a1a">• PSRAM вбудовано в SoC (SiP-чип)</text>

  <rect x="352.5" y="370" width="255" height="24" rx="4" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="362.5" y="386" font-size="12" fill="#1a1a1a">• Flash окремим чипом поруч</text>

  <rect x="352.5" y="400" width="255" height="24" rx="4" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="362.5" y="416" font-size="12" fill="#1a1a1a">• Виводи: LGA площадки під екраном</text>

  <rect x="352.5" y="430" width="255" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="362.5" y="447" font-size="12" font-weight="bold" fill="#27ae60">Площа: 219 мм² (-52% від WROOM)</text>


  <!-- ================= PANEL 3: SiP CHIP ================= -->
  <rect x="645" y="65" width="285" height="405" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="787.5" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">ESP32-S3R2 / S3R8 / S3FH4R2</text>
  <text x="787.5" y="106" text-anchor="middle" font-size="12" fill="#6b7280">7 × 7 мм QFN56 / LGA SiP Корпус</text>

  <!-- IC Package Diagram for SiP -->
  <rect x="665" y="120" width="245" height="210" rx="4" fill="#212529" stroke="#343a40" stroke-width="2"/>

  <!-- QFN Lead Pads (around chip body) -->
  <rect x="672" y="145" width="231" height="160" rx="4" fill="#2b2d42"/>

  <!-- SoC Die inside SiP -->
  <rect x="687" y="156" width="201" height="62" rx="3" fill="#1d3557" stroke="#457b9d"/>
  <text x="787.5" y="181" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Кристал SoC (ESP32-S3)</text>
  <text x="787.5" y="200" text-anchor="middle" font-size="11" fill="#a8dadc">(Dual-Core LX7 + RF + Периферія)</text>

  <!-- Internal Wire Bonds -->
  <path d="M 700 218 L 700 234 M 875 218 L 875 234 M 787.5 218 L 787.5 234" stroke="#ffd166" stroke-width="2" stroke-dasharray="3,2"/>
  <rect x="720" y="222" width="135" height="16" rx="3" fill="#212529"/>
  <text x="787.5" y="234" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffd166">Внутрішні SiP-провідники</text>

  <!-- PSRAM / Flash Die inside SiP -->
  <rect x="687" y="240" width="201" height="56" rx="3" fill="#c0392b" stroke="#f1faee"/>
  <text x="787.5" y="263" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Кристал PSRAM / Flash</text>
  <text x="787.5" y="281" text-anchor="middle" font-size="11" fill="#fdecea">(2/8 МБ PSRAM чи 4 МБ Flash)</text>

  <!-- Features List for SiP -->
  <rect x="660" y="340" width="255" height="24" rx="4" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="670" y="356" font-size="12" fill="#1a1a1a">• Пам'ять упакована в один корпус</text>

  <rect x="660" y="370" width="255" height="24" rx="4" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="670" y="386" font-size="12" fill="#1a1a1a">• Швидка внутрішня розводка PSRAM</text>

  <rect x="660" y="400" width="255" height="24" rx="4" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="670" y="416" font-size="12" fill="#1a1a1a">• Не блокує зовнішні виводи GPIO</text>

  <rect x="660" y="430" width="255" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="670" y="447" font-size="12" font-weight="bold" fill="#2457d6">Площа: 49 мм² (-89% від WROOM)</text>


  <!-- ================= BOTTOM SUMMARY BAR ================= -->
  <rect x="30" y="480" width="900" height="28" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="499" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Ключовий висновок: SiP-технологія вивільняє лінії GPIO та економить площу плати, зберігаючи продуктивність пам'яті</text>
</svg>
