<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема прямого підключення нативного USB OTG / Serial-JTAG у ESP32-S3</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Зв'язок роз'єму USB Type-C із виводами GPIO19 (D-) та GPIO20 (D+) через диференціальні резистори та TVS ESD-захист</text>

  <!-- COLUMN 1: USB Type-C Connector -->
  <rect x="30" y="85" width="210" height="350" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="2"/>
  <rect x="42" y="98" width="186" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="135" y="117" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Роз'єм USB Type-C</text>

  <!-- USB Pins -->
  <text x="225" y="149" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">VBUS (5V)</text>
  <circle cx="240" cy="145" r="4" fill="#c0392b"/>

  <text x="225" y="199" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">D- (DN)</text>
  <circle cx="240" cy="195" r="4" fill="#2457d6"/>

  <text x="225" y="279" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">D+ (DP)</text>
  <circle cx="240" cy="275" r="4" fill="#2457d6"/>

  <text x="225" y="359" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">GND</text>
  <circle cx="240" cy="355" r="4" fill="#1a1a1a"/>

  <rect x="42" y="385" width="186" height="35" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="135" y="406" text-anchor="middle" font-size="11" fill="#6b7280">CC1/CC2: 5.1 кОм на GND</text>

  <!-- COLUMN 2: Protection & Impedance Matching -->
  <rect x="270" y="85" width="390" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="282" y="98" width="366" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="465" y="117" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Обв'язка та TVS ESD-захист</text>

  <!-- TVS Diode Box -->
  <rect x="290" y="145" width="160" height="275" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="370" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">TVS Масив (ESD)</text>
  <text x="370" y="185" text-anchor="middle" font-size="11" fill="#6b7280">(USBLC6 / SRV05)</text>
  <text x="370" y="220" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Захист від статики</text>
  <text x="370" y="238" text-anchor="middle" font-size="11" fill="#6b7280">До 15 кВ (IEC61000-4-2)</text>
  <text x="370" y="270" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Ємність &lt; 3.5 пФ</text>
  <text x="370" y="288" text-anchor="middle" font-size="11" fill="#6b7280">Без викривлення</text>
  <text x="370" y="304" text-anchor="middle" font-size="11" fill="#6b7280">сигналу USB 12 Мбіт/с</text>
  <text x="370" y="340" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Швидкісна зрізка</text>
  <text x="370" y="358" text-anchor="middle" font-size="11" fill="#6b7280">імпульсів напруги</text>

  <!-- Damping Resistor D- -->
  <text x="560" y="173" text-anchor="middle" font-size="11" fill="#6b7280">Узгодження D-</text>
  <rect x="480" y="180" width="160" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="560" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">R_D- = 22 Ом</text>

  <!-- Damping Resistor D+ -->
  <text x="560" y="253" text-anchor="middle" font-size="11" fill="#6b7280">Узгодження D+</text>
  <rect x="480" y="260" width="160" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="560" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">R_D+ = 22 Ом</text>

  <!-- Explanation Box -->
  <rect x="480" y="315" width="160" height="105" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="490" y="336" font-size="11" font-weight="bold" fill="#1a1a1a">Функція 22 Ом:</text>
  <text x="490" y="355" font-size="11" fill="#6b7280">• Придушення відбивань</text>
  <text x="490" y="372" font-size="11" fill="#6b7280">• Захист входу PHY</text>
  <text x="490" y="395" font-size="11" font-weight="bold" fill="#27ae60">• Опір 90 Ом (Diff)</text>

  <!-- COLUMN 3: ESP32-S3 Module -->
  <rect x="690" y="85" width="240" height="350" rx="8" fill="#f4f6f8" stroke="#27ae60" stroke-width="2"/>
  <rect x="702" y="98" width="216" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="810" y="117" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Модуль ESP32-S3</text>

  <!-- Module Pins -->
  <circle cx="690" cy="145" r="4" fill="#c0392b"/>
  <text x="705" y="149" font-size="12" font-weight="bold" fill="#c0392b">5V / VEXT (Живлення)</text>

  <circle cx="690" cy="195" r="4" fill="#2457d6"/>
  <text x="705" y="199" font-size="12" font-weight="bold" fill="#2457d6">GPIO19 (USB_D- / JTAG_TMS)</text>

  <circle cx="690" cy="275" r="4" fill="#2457d6"/>
  <text x="705" y="279" font-size="12" font-weight="bold" fill="#2457d6">GPIO20 (USB_D+ / JTAG_TDI)</text>

  <circle cx="690" cy="355" r="4" fill="#1a1a1a"/>
  <text x="705" y="359" font-size="12" font-weight="bold" fill="#1a1a1a">GND (Спільний нуль)</text>

  <!-- ESP32-S3 Sub-box -->
  <rect x="705" y="380" width="210" height="45" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="810" y="398" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Апаратний USB Serial/JTAG</text>
  <text x="810" y="415" text-anchor="middle" font-size="11" fill="#6b7280">Без зовнішнього USB-UART містка</text>

  <!-- Routing Lines -->
  <!-- VBUS Line -->
  <line x1="240" y1="145" x2="690" y2="145" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="465" y="138" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Лінія живлення VBUS (5V)</text>

  <!-- D- Line segments -->
  <line x1="240" y1="195" x2="290" y2="195" stroke="#2457d6" stroke-width="2"/>
  <line x1="450" y1="195" x2="480" y2="195" stroke="#2457d6" stroke-width="2"/>
  <line x1="640" y1="195" x2="690" y2="195" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- D+ Line segments -->
  <line x1="240" y1="275" x2="290" y2="275" stroke="#2457d6" stroke-width="2"/>
  <line x1="450" y1="275" x2="480" y2="275" stroke="#2457d6" stroke-width="2"/>
  <line x1="640" y1="275" x2="690" y2="275" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- GND Line segments -->
  <line x1="240" y1="355" x2="290" y2="355" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="450" y1="355" x2="690" y2="355" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>
</svg>
