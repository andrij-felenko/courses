<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>

  <!-- Main Header -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Формфактори системних модулів серії ESP32-S3</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Порівняння конструктивного виконання WROOM, MINI та SiP: розміри, типи контактів та щільність монтажу</text>

  <!-- COLUMN 1: WROOM-1 MODULE -->
  <g id="wroom-module">
    <!-- Panel Background -->
    <rect x="40" y="75" width="270" height="420" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
    
    <!-- Title inside panel -->
    <text x="175" y="100" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ESP32-S3-WROOM-1</text>
    <text x="175" y="118" font-size="12" fill="#6b7280" text-anchor="middle">Класичний поверхневий модуль (SMD)</text>

    <!-- Visual Representation of WROOM PCB & Shield -->
    <g transform="translate(85, 132)">
      <!-- PCB base -->
      <rect x="0" y="0" width="110" height="155" fill="#065f46" rx="3"/>
      <!-- PCB Antenna area -->
      <rect x="0" y="0" width="110" height="30" fill="#022c22" rx="2"/>
      <!-- Gold meander antenna line -->
      <path d="M 20,22 L 20,8 L 30,8 L 30,22 L 40,22 L 40,8 L 50,8 L 50,22 L 60,22 L 60,8 L 70,8 L 70,22 L 80,22 L 80,8 L 90,8 L 90,22" fill="none" stroke="#f59e0b" stroke-width="2"/>
      <!-- Metal Shield Box -->
      <rect x="8" y="36" width="94" height="110" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5" rx="3"/>
      <text x="55" y="75" font-size="12" font-weight="bold" fill="#334155" text-anchor="middle">ESP32-S3</text>
      <text x="55" y="93" font-size="11" font-weight="bold" fill="#475569" text-anchor="middle">WROOM-1</text>
      <text x="55" y="125" font-size="10" fill="#64748b" text-anchor="middle">Espressif</text>
      
      <!-- Castellated Pins Left/Right/Bottom -->
      <!-- Left pins -->
      <circle cx="0" cy="45" r="3" fill="#f59e0b"/>
      <circle cx="0" cy="60" r="3" fill="#f59e0b"/>
      <circle cx="0" cy="75" r="3" fill="#f59e0b"/>
      <circle cx="0" cy="90" r="3" fill="#f59e0b"/>
      <circle cx="0" cy="105" r="3" fill="#f59e0b"/>
      <circle cx="0" cy="120" r="3" fill="#f59e0b"/>
      <circle cx="0" cy="135" r="3" fill="#f59e0b"/>
      <!-- Right pins -->
      <circle cx="110" cy="45" r="3" fill="#f59e0b"/>
      <circle cx="110" cy="60" r="3" fill="#f59e0b"/>
      <circle cx="110" cy="75" r="3" fill="#f59e0b"/>
      <circle cx="110" cy="90" r="3" fill="#f59e0b"/>
      <circle cx="110" cy="105" r="3" fill="#f59e0b"/>
      <circle cx="110" cy="120" r="3" fill="#f59e0b"/>
      <circle cx="110" cy="135" r="3" fill="#f59e0b"/>
      <!-- Bottom pins -->
      <circle cx="20" cy="155" r="3" fill="#f59e0b"/>
      <circle cx="37" cy="155" r="3" fill="#f59e0b"/>
      <circle cx="55" cy="155" r="3" fill="#f59e0b"/>
      <circle cx="73" cy="155" r="3" fill="#f59e0b"/>
      <circle cx="90" cy="155" r="3" fill="#f59e0b"/>
    </g>

    <!-- Specs White Box -->
    <rect x="52" y="305" width="246" height="175" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
    <text x="64" y="325" font-size="12" font-weight="bold" fill="#1a1a1a">Параметри WROOM-1:</text>
    <text x="64" y="347" font-size="12" fill="#1a1a1a">• Габарити: <tspan font-weight="bold">18.0 × 25.5 мм</tspan></text>
    <text x="64" y="367" font-size="12" fill="#1a1a1a">• Контакти: <tspan font-weight="bold">Зубчасті крайові</tspan></text>
    <text x="64" y="387" font-size="12" fill="#1a1a1a">• Пам'ять: <tspan font-weight="bold">Quad / Octal SPI</tspan></text>
    <text x="64" y="407" font-size="12" fill="#1a1a1a">• Кількість виводів: <tspan font-weight="bold">41 контакт</tspan></text>
    <text x="64" y="427" font-size="12" fill="#1a1a1a">• Трасування: <tspan font-weight="bold">2-шарова плата</tspan></text>
    <text x="64" y="447" font-size="12" fill="#2457d6">• Перевага: <tspan font-weight="bold">Просте ручне паяння</tspan></text>
    <text x="64" y="467" font-size="12" fill="#6b7280">• Крок виводів: 1.27 мм</text>
  </g>

  <!-- COLUMN 2: MINI-1 MODULE -->
  <g id="mini-module">
    <!-- Panel Background -->
    <rect x="345" y="75" width="270" height="420" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
    
    <!-- Title inside panel -->
    <text x="480" y="100" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ESP32-S3-MINI-1</text>
    <text x="480" y="118" font-size="12" fill="#6b7280" text-anchor="middle">Ультракомпактний модуль (LGA)</text>

    <!-- Visual Representation of MINI PCB & Shield -->
    <g transform="translate(438, 142)">
      <!-- PCB base -->
      <rect x="0" y="0" width="84" height="110" fill="#065f46" rx="3"/>
      <!-- PCB Antenna area -->
      <rect x="0" y="0" width="84" height="22" fill="#022c22" rx="2"/>
      <!-- Gold meander antenna line -->
      <path d="M 15,16 L 15,6 L 25,6 L 25,16 L 35,16 L 35,6 L 45,6 L 45,16 L 55,16 L 55,6 L 65,6 L 65,16" fill="none" stroke="#f59e0b" stroke-width="1.8"/>
      <!-- Metal Shield Box -->
      <rect x="6" y="26" width="72" height="78" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1.5" rx="3"/>
      <text x="42" y="56" font-size="11" font-weight="bold" fill="#334155" text-anchor="middle">ESP32-S3</text>
      <text x="42" y="72" font-size="10" font-weight="bold" fill="#475569" text-anchor="middle">MINI-1</text>
      <text x="42" y="94" font-size="10" fill="#64748b" text-anchor="middle">LGA Pad</text>

      <!-- Bottom LGA Grid representation (dots indicator) -->
      <rect x="12" y="114" width="60" height="12" fill="#e2e8f0" stroke="#cbd5e1" rx="2"/>
      <circle cx="20" cy="120" r="2" fill="#f59e0b"/>
      <circle cx="30" cy="120" r="2" fill="#f59e0b"/>
      <circle cx="40" cy="120" r="2" fill="#f59e0b"/>
      <circle cx="50" cy="120" r="2" fill="#f59e0b"/>
      <circle cx="60" cy="120" r="2" fill="#f59e0b"/>
    </g>

    <!-- Specs White Box -->
    <rect x="357" y="305" width="246" height="175" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
    <text x="369" y="325" font-size="12" font-weight="bold" fill="#1a1a1a">Параметри MINI-1:</text>
    <text x="369" y="347" font-size="12" fill="#1a1a1a">• Габарити: <tspan font-weight="bold">13.2 × 16.6 мм</tspan></text>
    <text x="369" y="367" font-size="12" fill="#1a1a1a">• Контакти: <tspan font-weight="bold">Площадкові (LGA)</tspan></text>
    <text x="369" y="387" font-size="12" fill="#1a1a1a">• Пам'ять: <tspan font-weight="bold">Quad SPI (SiP/Flash)</tspan></text>
    <text x="369" y="407" font-size="12" fill="#1a1a1a">• Кількість виводів: <tspan font-weight="bold">53 контакти</tspan></text>
    <text x="369" y="427" font-size="12" fill="#1a1a1a">• Трасування: <tspan font-weight="bold">4-шарова плата</tspan></text>
    <text x="369" y="447" font-size="12" fill="#27ae60">• Перевага: <tspan font-weight="bold">Економія площі &gt;50%</tspan></text>
    <text x="369" y="467" font-size="12" fill="#6b7280">• Крок контактів: 0.85 мм</text>
  </g>

  <!-- COLUMN 3: SiP (QFN-56) MODULE -->
  <g id="sip-module">
    <!-- Panel Background -->
    <rect x="650" y="75" width="270" height="420" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
    
    <!-- Title inside panel -->
    <text x="785" y="100" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ESP32-S3-SiP</text>
    <text x="785" y="118" font-size="12" fill="#6b7280" text-anchor="middle">Безкорпусний кристальний (QFN)</text>

    <!-- Visual Representation of QFN IC with Cutaway Die -->
    <g transform="translate(730, 142)">
      <!-- Black QFN IC body -->
      <rect x="0" y="0" width="110" height="110" fill="#1e293b" stroke="#0f172a" stroke-width="2" rx="4"/>
      
      <!-- QFN Outer Pins -->
      <!-- Top pins -->
      <rect x="15" y="-4" width="6" height="6" fill="#f59e0b"/>
      <rect x="35" y="-4" width="6" height="6" fill="#f59e0b"/>
      <rect x="55" y="-4" width="6" height="6" fill="#f59e0b"/>
      <rect x="75" y="-4" width="6" height="6" fill="#f59e0b"/>
      <rect x="90" y="-4" width="6" height="6" fill="#f59e0b"/>
      <!-- Bottom pins -->
      <rect x="15" y="108" width="6" height="6" fill="#f59e0b"/>
      <rect x="35" y="108" width="6" height="6" fill="#f59e0b"/>
      <rect x="55" y="108" width="6" height="6" fill="#f59e0b"/>
      <rect x="75" y="108" width="6" height="6" fill="#f59e0b"/>
      <rect x="90" y="108" width="6" height="6" fill="#f59e0b"/>
      <!-- Left pins -->
      <rect x="-4" y="15" width="6" height="6" fill="#f59e0b"/>
      <rect x="-4" y="35" width="6" height="6" fill="#f59e0b"/>
      <rect x="-4" y="55" width="6" height="6" fill="#f59e0b"/>
      <rect x="-4" y="75" width="6" height="6" fill="#f59e0b"/>
      <rect x="-4" y="90" width="6" height="6" fill="#f59e0b"/>
      <!-- Right pins -->
      <rect x="108" y="15" width="6" height="6" fill="#f59e0b"/>
      <rect x="108" y="35" width="6" height="6" fill="#f59e0b"/>
      <rect x="108" y="55" width="6" height="6" fill="#f59e0b"/>
      <rect x="108" y="75" width="6" height="6" fill="#f59e0b"/>
      <rect x="108" y="90" width="6" height="6" fill="#f59e0b"/>

      <!-- Internal Stacked Die View -->
      <!-- MCU Die -->
      <rect x="15" y="45" width="80" height="50" fill="#2457d6" stroke="#93c5fd" stroke-width="1" rx="2"/>
      <text x="55" y="75" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">SoC ESP32-S3</text>

      <!-- Stacked PSRAM Die on top -->
      <rect x="25" y="15" width="60" height="32" fill="#27ae60" stroke="#86efac" stroke-width="1" rx="2"/>
      <text x="55" y="34" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">PSRAM Die</text>

      <!-- Wire bonds -->
      <line x1="30" y1="47" x2="30" y2="44" stroke="#f59e0b" stroke-width="1.2"/>
      <line x1="80" y1="47" x2="80" y2="44" stroke="#f59e0b" stroke-width="1.2"/>
    </g>

    <!-- Specs White Box -->
    <rect x="662" y="305" width="246" height="175" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
    <text x="674" y="325" font-size="12" font-weight="bold" fill="#1a1a1a">Параметри SiP (QFN-56):</text>
    <text x="674" y="347" font-size="12" fill="#1a1a1a">• Габарити: <tspan font-weight="bold">7.0 × 7.0 мм (Чип)</tspan></text>
    <text x="674" y="367" font-size="12" fill="#1a1a1a">• Контакти: <tspan font-weight="bold">Безкорпусний QFN-56</tspan></text>
    <text x="674" y="387" font-size="12" fill="#1a1a1a">• Пам'ять: <tspan font-weight="bold">Вбудований PSRAM 2/8МБ</tspan></text>
    <text x="674" y="407" font-size="12" fill="#1a1a1a">• Кількість виводів: <tspan font-weight="bold">56 виводів + Pad</tspan></text>
    <text x="674" y="427" font-size="12" fill="#1a1a1a">• Трасування: <tspan font-weight="bold">Одночиповий дизайн</tspan></text>
    <text x="674" y="447" font-size="12" fill="#2457d6">• Перевага: <tspan font-weight="bold">Вільні шинні GPIO</tspan></text>
    <text x="674" y="467" font-size="12" fill="#6b7280">• Крок контактів: 0.40 мм</text>
  </g>
</svg>
