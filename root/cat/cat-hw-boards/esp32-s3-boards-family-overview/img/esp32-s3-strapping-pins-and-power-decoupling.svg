<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема strapping-пінів та розв'язування живлення ESP32-S3</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Фільтрація пікових струмів VDD та фіксовані рівні GPIO0, GPIO45, GPIO46 забезпечують стабільний пуск</text>

  <!-- PANEL 1: Power & Decoupling -->
  <rect x="30" y="85" width="270" height="440" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="165" y="110" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Підсистема живлення (VDD)</text>

  <!-- Power Bus Rails -->
  <line x1="50" y1="135" x2="280" y2="135" stroke="#2457d6" stroke-width="3"/>
  <text x="55" y="127" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">+3.3V (VDD)</text>

  <line x1="50" y1="495" x2="280" y2="495" stroke="#1a1a1a" stroke-width="3"/>
  <text x="55" y="515" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">GND (Спільний)</text>

  <!-- Branch 1: EN Reset RC Circuit -->
  <line x1="80" y1="135" x2="80" y2="495" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="72" y="152" width="16" height="30" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="95" y="170" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">R1 = 10 kΩ</text>

  <circle cx="80" cy="197" r="3.5" fill="#2457d6"/>
  <line x1="80" y1="197" x2="280" y2="197" stroke="#2457d6" stroke-width="2"/>
  <text x="185" y="189" font-size="12" fill="#2457d6" text-anchor="middle">Сигнал EN (CHIP_PU)</text>

  <rect x="72" y="218" width="16" height="30" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="72" y1="228" x2="88" y2="228" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="72" y1="238" x2="88" y2="238" stroke="#2457d6" stroke-width="1.5"/>
  <text x="95" y="230" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">C_EN = 1 µF</text>
  <text x="95" y="245" font-size="12" fill="#6b7280" text-anchor="start">Затримка пуску &gt; 50 µs</text>

  <!-- Branch 2: Capacitors C1, C2, C3 -->
  <line x1="155" y1="135" x2="155" y2="495" stroke="#1a1a1a" stroke-width="1.5"/>

  <rect x="147" y="290" width="16" height="30" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="147" y1="300" x2="163" y2="300" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="147" y1="310" x2="163" y2="310" stroke="#2457d6" stroke-width="1.5"/>
  <text x="170" y="302" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">C1 = 10 µF</text>
  <text x="170" y="317" font-size="12" fill="#6b7280" text-anchor="start">Буфер піків Wi-Fi</text>

  <rect x="147" y="375" width="16" height="30" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="147" y1="385" x2="163" y2="385" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="147" y1="395" x2="163" y2="395" stroke="#2457d6" stroke-width="1.5"/>
  <text x="170" y="385" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">C2 = 0.1 µF</text>
  <text x="170" y="400" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">C3 = 1 nF</text>
  <text x="170" y="415" font-size="12" fill="#6b7280" text-anchor="start">ВЧ-фільтрація</text>

  <!-- WIRES: Panel 1 -&gt; Panel 2 -->
  <line x1="280" y1="135" x2="380" y2="135" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="315" y="127" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">3.3V</text>

  <line x1="280" y1="197" x2="345" y2="197" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="315" y="189" font-size="12" fill="#2457d6" text-anchor="middle">EN</text>

  <line x1="280" y1="495" x2="345" y2="495" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="315" y="487" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GND</text>

  <!-- PANEL 2: ESP32-S3 Microcontroller -->
  <rect x="330" y="85" width="270" height="440" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="465" y="110" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мікроконтролер ESP32-S3</text>

  <!-- MCU Body -->
  <rect x="380" y="135" width="170" height="375" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="465" y="160" font-size="16" font-weight="bold" fill="#2457d6" text-anchor="middle">ESP32-S3</text>
  <text x="465" y="177" font-size="12" fill="#6b7280" text-anchor="middle">(SoC / WROOM / MINI)</text>

  <!-- MCU Left Pins -->
  <rect x="345" y="187" width="35" height="20" fill="#2457d6" rx="3"/>
  <text x="362" y="201" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">EN</text>

  <rect x="345" y="485" width="35" height="20" fill="#1a1a1a" rx="3"/>
  <text x="362" y="499" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">GND</text>

  <!-- Internal Latch Box -->
  <rect x="395" y="195" width="140" height="295" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="465" y="213" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Latch при EN=1</text>
  <text x="465" y="228" font-size="12" fill="#6b7280" text-anchor="middle">Зчитування стану</text>
  <line x1="405" y1="238" x2="525" y2="238" stroke="#d0d7de" stroke-width="1"/>

  <rect x="405" y="248" width="120" height="24" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="465" y="264" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">SPI Boot</text>

  <rect x="405" y="308" width="120" height="24" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="465" y="324" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">VDD_SPI 3.3V</text>

  <rect x="405" y="463" width="120" height="24" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="465" y="479" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">ROM Log ON</text>

  <!-- MCU Right Pins -->
  <rect x="550" y="250" width="48" height="20" fill="#2457d6" rx="3"/>
  <text x="574" y="264" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">GPIO0</text>

  <rect x="550" y="310" width="52" height="20" fill="#2457d6" rx="3"/>
  <text x="576" y="324" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">GPIO45</text>

  <rect x="550" y="465" width="52" height="20" fill="#2457d6" rx="3"/>
  <text x="576" y="479" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">GPIO46</text>

  <!-- WIRES: Panel 2 -&gt; Panel 3 -->
  <line x1="598" y1="260" x2="670" y2="260" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="615" y="252" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">GPIO0</text>

  <line x1="602" y1="320" x2="670" y2="320" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="615" y="312" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">GPIO45</text>

  <line x1="602" y1="475" x2="670" y2="475" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="615" y="467" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">GPIO46</text>

  <!-- PANEL 3: Strapping Pins Configuration -->
  <rect x="630" y="85" width="300" height="440" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="780" y="110" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Конфігурація Strapping-пінів</text>

  <!-- GPIO0 Circuit -->
  <line x1="650" y1="145" x2="700" y2="145" stroke="#2457d6" stroke-width="2"/>
  <text x="650" y="138" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">+3.3V</text>

  <line x1="670" y1="145" x2="670" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="662" y="165" width="16" height="30" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="685" y="180" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">R_PU = 10 kΩ</text>

  <circle cx="670" cy="260" r="3.5" fill="#2457d6"/>

  <line x1="670" y1="260" x2="715" y2="260" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="715" y="245" width="50" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="740" y="264" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Boot</text>

  <rect x="785" y="135" width="135" height="135" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="852" y="155" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">GPIO0 = HIGH (1)</text>
  <text x="852" y="173" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">SPI Flash Boot</text>
  <text x="852" y="190" font-size="12" fill="#6b7280" text-anchor="middle">(Нормальний пуск)</text>
  <line x1="795" y1="202" x2="910" y2="202" stroke="#27ae60" stroke-width="0.8" stroke-dasharray="3,3"/>
  <text x="852" y="220" font-size="12" fill="#c0392b" text-anchor="middle">LOW (Натиснуто):</text>
  <text x="852" y="237" font-size="12" fill="#c0392b" text-anchor="middle">UART Download</text>

  <!-- GPIO45 Circuit -->
  <line x1="670" y1="320" x2="670" y2="380" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="662" y="335" width="16" height="30" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="685" y="355" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">R_PD = 10 kΩ</text>

  <line x1="650" y1="380" x2="690" y2="380" stroke="#1a1a1a" stroke-width="2"/>
  <text x="650" y="392" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">GND</text>

  <circle cx="670" cy="320" r="3.5" fill="#2457d6"/>

  <rect x="785" y="290" width="135" height="95" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="852" y="310" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">GPIO45 = LOW (0)</text>
  <text x="852" y="328" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">VDD_SPI = 3.3V</text>
  <text x="852" y="345" font-size="12" fill="#6b7280" text-anchor="middle">(Стандартна Flash)</text>
  <text x="852" y="363" font-size="12" fill="#c0392b" text-anchor="middle">HIGH = 1.8V Flash</text>

  <!-- GPIO46 Circuit -->
  <line x1="650" y1="420" x2="690" y2="420" stroke="#2457d6" stroke-width="2"/>
  <text x="650" y="416" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">+3.3V</text>

  <line x1="670" y1="420" x2="670" y2="475" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="662" y="430" width="16" height="30" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="685" y="448" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">R_PU = 10 kΩ</text>

  <circle cx="670" cy="475" r="3.5" fill="#2457d6"/>

  <rect x="785" y="415" width="135" height="90" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="852" y="435" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">GPIO46 = HIGH (1)</text>
  <text x="852" y="453" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ROM Log Ввімкнено</text>
  <text x="852" y="470" font-size="12" fill="#6b7280" text-anchor="middle">(Друк у UART0 TX)</text>
  <text x="852" y="487" font-size="12" fill="#6b7280" text-anchor="middle">LOW = Silent Boot</text>
</svg>
