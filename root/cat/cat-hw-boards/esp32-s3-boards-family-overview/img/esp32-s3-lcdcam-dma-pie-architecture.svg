<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка полотна -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Архітектура обробки відеопотоку та TinyML в ESP32-S3</text>
  <text x="480" y="55" font-size="13" fill="#6b7280" text-anchor="middle">Пряма передача кадру через LCD_CAM та DMA в RAM із векторним прискоренням Xtensa PIE без залучення CPU</text>

  <!-- 1. ГРУПА: DVP Камера -->
  <rect x="25" y="75" width="150" height="315" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="100" y="96" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">DVP Камера</text>
  <text x="100" y="114" font-size="12" fill="#6b7280" text-anchor="middle">(OV2640 / OV5640)</text>

  <rect x="37" y="128" width="126" height="110" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="100" y="148" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Паралельна шина</text>
  <text x="100" y="168" font-size="12" fill="#6b7280" text-anchor="middle">D[0..7/15] (Дані)</text>
  <text x="100" y="188" font-size="12" fill="#6b7280" text-anchor="middle">PCLK (Такти)</text>
  <text x="100" y="208" font-size="12" fill="#6b7280" text-anchor="middle">VSYNC / HREF</text>
  <text x="100" y="228" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">8/16-біт потік</text>

  <rect x="37" y="250" width="126" height="125" rx="6" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="100" y="270" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Формат кадру:</text>
  <text x="100" y="290" font-size="12" fill="#1a1a1a" text-anchor="middle">• RGB565 / YUV</text>
  <text x="100" y="310" font-size="12" fill="#1a1a1a" text-anchor="middle">• Grayscale 8-bit</text>
  <text x="100" y="330" font-size="12" fill="#1a1a1a" text-anchor="middle">• До 240x240/VGA</text>
  <text x="100" y="355" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Безперервно</text>

  <!-- Стрілка 1: DVP -> LCD_CAM -->
  <line x1="175" y1="185" x2="240" y2="185" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="207.5" y="170" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">DVP шина</text>
  <text x="207.5" y="202" font-size="12" fill="#6b7280" text-anchor="middle">8/16 біт</text>

  <!-- 2. ГРУПА: Апаратний блок ESP32-S3 (LCD_CAM + GDMA) -->
  <rect x="240" y="75" width="230" height="315" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="355" y="96" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Периферія ESP32-S3</text>
  <text x="355" y="114" font-size="12" fill="#6b7280" text-anchor="middle">LCD_CAM &amp; GDMA Контролери</text>

  <!-- Блок LCD_CAM -->
  <rect x="252" y="128" width="206" height="90" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="355" y="148" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Модуль LCD_CAM (CAM RX)</text>
  <text x="355" y="168" font-size="12" fill="#6b7280" text-anchor="middle">Апаратний прийом по DVP шині</text>
  <text x="355" y="188" font-size="12" fill="#6b7280" text-anchor="middle">Вхідний FIFO буфер (16×32 біт)</text>
  <text x="355" y="208" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Фіксація за PCLK тактом</text>

  <!-- Стрілка між LCD_CAM та GDMA -->
  <line x1="355" y1="218" x2="355" y2="250" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="365" y="238" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">FIFO ➔ DMA</text>

  <!-- Блок GDMA -->
  <rect x="252" y="250" width="206" height="125" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="355" y="270" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">GDMA Контролер</text>
  <text x="355" y="290" font-size="12" fill="#1a1a1a" text-anchor="middle">Списочні дескриптори DMA</text>
  <text x="355" y="310" font-size="12" fill="#6b7280" text-anchor="middle">Desc[0] ➔ Desc[1] ➔ Desc[N]</text>
  <text x="355" y="330" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Автономна передача у RAM</text>
  <text x="355" y="350" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Без участі процесора (0% CPU)</text>

  <!-- Стрілка 2: GDMA -> SRAM -->
  <line x1="470" y1="315" x2="535" y2="315" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="502.5" y="300" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">AXI / AHB</text>
  <text x="502.5" y="332" font-size="12" fill="#6b7280" text-anchor="middle">DMA потік</text>

  <!-- 3. ГРУПА: Внутрішня пам'ять SRAM -->
  <rect x="535" y="75" width="210" height="315" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="640" y="96" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Внутрішня SRAM</text>
  <text x="640" y="114" font-size="12" fill="#6b7280" text-anchor="middle">Кільцеві буфери (Ping-Pong)</text>

  <!-- Подвійний буфер -->
  <rect x="545" y="128" width="190" height="135" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="640" y="146" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Подвійний Framebuffer</text>

  <rect x="555" y="156" width="170" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="640" y="176" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Буфер A: DMA Запис кадру</text>

  <rect x="555" y="194" width="170" height="32" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="640" y="214" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Буфер B: PIE Обробка (ML)</text>

  <text x="640" y="246" font-size="12" fill="#6b7280" text-anchor="middle">Перемикання по перериванню</text>

  <!-- Переваги Zero-Copy -->
  <rect x="545" y="270" width="190" height="105" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="640" y="288" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принцип Zero-Copy:</text>
  <text x="640" y="308" font-size="12" fill="#6b7280" text-anchor="middle">• Пряма адресація в RAM</text>
  <text x="640" y="326" font-size="12" fill="#6b7280" text-anchor="middle">• Немає копіювання CPU</text>
  <text x="640" y="344" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">• Максимальна швидкість FPS</text>

  <!-- Стрілка 3: SRAM Buffer B -> Xtensa PIE -->
  <line x1="745" y1="215" x2="805" y2="215" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="775" y="200" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">128-біт</text>
  <text x="775" y="232" font-size="12" fill="#6b7280" text-anchor="middle">PIE Bus</text>

  <!-- 4. ГРУПА: Xtensa LX7 PIE / TinyML -->
  <rect x="805" y="75" width="130" height="315" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="870" y="96" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Xtensa PIE</text>
  <text x="870" y="114" font-size="12" fill="#6b7280" text-anchor="middle">SIMD Співпроцесор</text>

  <!-- Блок PIE -->
  <rect x="813" y="128" width="114" height="135" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="870" y="148" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">128-біт SIMD</text>
  <text x="870" y="168" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="middle">Векторний DSP</text>
  <text x="870" y="188" font-size="12" fill="#6b7280" text-anchor="middle">Прискорення ML:</text>
  <text x="870" y="208" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="middle">• INT8 / INT16</text>
  <text x="870" y="228" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="middle">• 2D згортки</text>
  <text x="870" y="248" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">ESP-NN бібл.</text>

  <!-- Блок Результат -->
  <rect x="813" y="270" width="114" height="105" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="870" y="288" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вихід TinyML:</text>
  <text x="870" y="308" font-size="12" fill="#27ae60" font-weight="bold" text-anchor="middle">Розпізнавання</text>
  <text x="870" y="326" font-size="12" fill="#27ae60" font-weight="bold" text-anchor="middle">Детекція об'єктів</text>
  <text x="870" y="344" font-size="12" fill="#6b7280" text-anchor="middle">Person Detect</text>

  <!-- 5. НИЖНЯ ПАНЕЛЬ: Порівняння та стан CPU -->
  <rect x="25" y="405" width="910" height="95" rx="8" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Ліва частина: Проблема -->
  <rect x="37" y="415" width="435" height="75" rx="6" fill="#fdecea" stroke="#c0392b"/>
  <text x="254.5" y="433" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">❌ Без DMA та PIE: CPU завантажений на 100%</text>
  <text x="254.5" y="452" font-size="12" fill="#1a1a1a" text-anchor="middle">Процесор побайтово зчитує GPIO ➔ затримки, втрати кадрів</text>
  <text x="254.5" y="471" font-size="12" fill="#c0392b" font-weight="bold" text-anchor="middle">Wi-Fi/Bluetooth та системні задачі блокуються</text>

  <!-- Права частина: Розв'язок -->
  <rect x="488" y="415" width="435" height="75" rx="6" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="705.5" y="433" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">✅ Архітектура ESP32-S3: 0% завантаження CPU на передачу</text>
  <text x="705.5" y="452" font-size="12" fill="#1a1a1a" text-anchor="middle">GDMA пише кадр у SRAM автономно ➔ Core 0 / Core 1 повністю вільні</text>
  <text x="705.5" y="471" font-size="12" fill="#27ae60" font-weight="bold" text-anchor="middle">Xtensa PIE паралельно прискорює TinyML інференс у 4–8 разів</text>
</svg>
