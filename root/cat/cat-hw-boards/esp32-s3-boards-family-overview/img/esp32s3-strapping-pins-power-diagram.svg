<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>

  <!-- Marker Defs -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Main Title & Subtitle -->
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схемотехнічна схема живлення, скидання (EN) та strapping-виводів ESP32-S3</text>
  <text x="480" y="48" text-anchor="middle" font-size="13" fill="#6b7280">Правильне обв'язування LDO 3.3V, RC-кола затримки CHIP_PU (EN) та підтяжок GPIO0/GPIO45/GPIO46</text>

  <!-- ================= PANEL 1: LDO POWER SUPPLY ================= -->
  <rect x="30" y="65" width="265" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="162.5" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Джерело живлення 3.3V LDO</text>
  <text x="162.5" y="104" text-anchor="middle" font-size="12" fill="#6b7280">Схема стабілізації напруги VDD</text>

  <!-- LDO Diagram Box -->
  <rect x="45" y="122" width="235" height="138" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  
  <!-- Inputs / Rail Labels -->
  <rect x="55" y="132" width="95" height="24" rx="3" fill="#fdecea" stroke="#c0392b"/>
  <text x="102.5" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">5V VBUS / VIN</text>

  <rect x="170" y="132" width="100" height="24" rx="3" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="220" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">3.3V VDD Rail</text>

  <!-- LDO IC -->
  <rect x="105" y="168" width="115" height="48" rx="3" fill="#343a40"/>
  <text x="162.5" y="188" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">LDO 3.3V</text>
  <text x="162.5" y="204" text-anchor="middle" font-size="10" fill="#adb5bd">AMS1117 / ME6211</text>

  <!-- Connectors / Caps -->
  <line x1="102.5" y1="156" x2="120" y2="192" stroke="#c0392b" stroke-width="2"/>
  <line x1="205" y1="192" x2="220" y2="156" stroke="#27ae60" stroke-width="2"/>

  <!-- Cap Labels -->
  <text x="60" y="238" font-size="11" font-weight="bold" fill="#2457d6">C1: 10µF (Вхід)</text>
  <text x="165" y="238" font-size="11" font-weight="bold" fill="#2457d6">C2: 10µF + 0.1µF</text>

  <!-- Notes in Panel 1 -->
  <rect x="45" y="272" width="235" height="36" rx="4" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="55" y="294" font-size="12" fill="#1a1a1a">• Струм LDO: ≥ 500 mA (піковий)</text>

  <rect x="45" y="318" width="235" height="36" rx="4" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="55" y="340" font-size="12" fill="#1a1a1a">• Пульсації: &lt; 50 mV (RF-тракт)</text>

  <rect x="45" y="364" width="235" height="36" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="55" y="386" font-size="12" font-weight="bold" fill="#27ae60">• Живлення шин Flash/PSRAM</text>


  <!-- ================= PANEL 2: RESET & AUTO-BOOT CIRCUIT ================= -->
  <rect x="315" y="65" width="315" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="472.5" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Коло скидання EN та Auto-Reset</text>
  <text x="472.5" y="104" text-anchor="middle" font-size="12" fill="#6b7280">RC-коло CHIP_PU та транзистори DTR/RTS</text>

  <!-- Circuit Schematic Box -->
  <rect x="330" y="122" width="285" height="185" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Top 3.3V Line -->
  <line x1="345" y1="138" x2="600" y2="138" stroke="#27ae60" stroke-width="2"/>
  <text x="350" y="133" font-size="11" font-weight="bold" fill="#27ae60">+3.3V VDD</text>

  <!-- RC Filter for EN -->
  <rect x="365" y="152" width="36" height="38" fill="#f4f6f8" stroke="#1a1a1a"/>
  <text x="383" y="175" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">R_EN</text>
  <text x="408" y="175" font-size="11" fill="#6b7280">10 kΩ</text>

  <!-- Node EN Wire Connections -->
  <line x1="383" y1="138" x2="383" y2="152" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="383" y1="190" x2="383" y2="215" stroke="#2457d6" stroke-width="2"/>
  <circle cx="383" cy="196" r="3" fill="#2457d6"/>
  <line x1="383" y1="196" x2="470" y2="196" stroke="#2457d6" stroke-width="2"/>
  <text x="392" y="191" font-size="11" font-weight="bold" fill="#2457d6">EN (CHIP_PU)</text>

  <!-- Capacitor C_EN -->
  <line x1="370" y1="215" x2="396" y2="215" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="370" y1="221" x2="396" y2="221" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="383" y1="221" x2="383" y2="242" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="408" y="217" font-size="11" font-weight="bold" fill="#2457d6">C_EN</text>
  <text x="408" y="230" font-size="10" fill="#6b7280">1 µF (τ=10ms)</text>

  <!-- Ground -->
  <line x1="373" y1="242" x2="393" y2="242" stroke="#1a1a1a" stroke-width="2"/>
  <text x="383" y="256" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">GND</text>

  <!-- Auto-Reset Block (DTR/RTS) -->
  <rect x="475" y="148" width="130" height="56" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="540" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Q1 (NPN) · DTR/RTS</text>
  <text x="540" y="186" text-anchor="middle" font-size="11" fill="#1a1a1a">Керування EN (Reset)</text>

  <rect x="475" y="218" width="130" height="56" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="540" y="238" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Q2 (NPN) · DTR/RTS</text>
  <text x="540" y="256" text-anchor="middle" font-size="11" fill="#1a1a1a">Керування GPIO0</text>

  <!-- Notes in Panel 2 -->
  <rect x="330" y="320" width="285" height="36" rx="4" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="340" y="342" font-size="12" fill="#1a1a1a">• Затримка EN: щонайменше 50 µs після VDD</text>

  <rect x="330" y="364" width="285" height="36" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="340" y="386" font-size="12" font-weight="bold" fill="#27ae60">• Захист від паразитних скидань</text>


  <!-- ================= PANEL 3: STRAPPING PINS CONFIG ================= -->
  <rect x="650" y="65" width="280" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="790" y="86" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Конфігурація Strapping Pins</text>
  <text x="790" y="104" text-anchor="middle" font-size="12" fill="#6b7280">Виводи GPIO0, GPIO45, GPIO46</text>

  <!-- Strapping Pins List Box -->
  <rect x="665" y="122" width="250" height="280" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>

  <!-- GPIO0 Item -->
  <rect x="675" y="132" width="230" height="64" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="685" y="150" font-size="12" font-weight="bold" fill="#2457d6">GPIO0 (Режим завантаження)</text>
  <text x="685" y="168" font-size="11" fill="#1a1a1a">• Внутр. Pull-Up (3.3V за умовчанням)</text>
  <text x="685" y="184" font-size="11" fill="#6b7280">• 0 = Download Mode | 1 = SPI Flash</text>

  <!-- GPIO45 Item -->
  <rect x="675" y="204" width="230" height="64" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="685" y="222" font-size="12" font-weight="bold" fill="#c0392b">GPIO45 (Напруга VDD_SPI)</text>
  <text x="685" y="240" font-size="11" fill="#1a1a1a">• Внутр. Pull-Down (0V за умовчанням)</text>
  <text x="685" y="256" font-size="11" fill="#c0392b">• 0 = 3.3V (Flash) | 1 = 1.8V</text>

  <!-- GPIO46 Item -->
  <rect x="675" y="276" width="230" height="64" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="685" y="294" font-size="12" font-weight="bold" fill="#1a1a1a">GPIO46 (Debug / ROM Log)</text>
  <text x="685" y="312" font-size="11" fill="#1a1a1a">• Внутр. Pull-Down (0V за умовчанням)</text>
  <text x="685" y="328" font-size="11" fill="#6b7280">• Зберегти 0 V при старті системи</text>

  <!-- Warning Banner -->
  <rect x="675" y="348" width="230" height="46" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="685" y="366" font-size="11" font-weight="bold" fill="#c0392b">⚠️ Помилка на GPIO45 (1.8V)</text>
  <text x="685" y="381" font-size="11" fill="#c0392b">блокує зчитання 3.3V Flash-пам'яті!</text>


  <!-- ================= BOTTOM SUMMARY BAR ================= -->
  <rect x="30" y="475" width="900" height="30" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="495" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Ключовий висновок: RC-коло на EN створює затримку 10 мс для стабілізації VDD, а підтяжки strapping-виводів гарантують надійний старт чипа</text>
</svg>
