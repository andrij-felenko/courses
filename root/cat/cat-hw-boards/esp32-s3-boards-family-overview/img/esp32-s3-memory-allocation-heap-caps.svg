<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розподіл пам'яті ESP32-S3 та алокація через heap_caps</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">SRAM підтримує апаратний DMA, а PSRAM працює через L1-кеш шини Octal/Quad SPI</text>

  <!-- КОЛОНКА 1: Запити пам'яті (Heap API) -->
  <rect x="30" y="85" width="260" height="445" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="160" y="112" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Запити пам'яті (Heap API)</text>

  <!-- Блок 1: DMA -->
  <rect x="45" y="130" width="230" height="75" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="160" y="152" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">MALLOC_CAP_DMA</text>
  <text x="160" y="170" font-size="12" fill="#1a1a1a" text-anchor="middle">+ MALLOC_CAP_INTERNAL</text>
  <text x="160" y="188" font-size="12" fill="#6b7280" text-anchor="middle">Буфери DMA периферії</text>

  <!-- Блок 2: EXEC -->
  <rect x="45" y="225" width="230" height="75" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="160" y="247" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">MALLOC_CAP_EXEC</text>
  <text x="160" y="265" font-size="12" fill="#1a1a1a" text-anchor="middle">+ MALLOC_CAP_INTERNAL</text>
  <text x="160" y="283" font-size="12" fill="#6b7280" text-anchor="middle">Швидкий код IRAM / ISR</text>

  <!-- Блок 3: SPIRAM -->
  <rect x="45" y="320" width="230" height="75" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="160" y="342" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">MALLOC_CAP_SPIRAM</text>
  <text x="160" y="360" font-size="12" fill="#1a1a1a" text-anchor="middle">Великі масиви та буфери</text>
  <text x="160" y="378" font-size="12" fill="#6b7280" text-anchor="middle">Framebuffers, TinyML</text>

  <!-- Блок 4: DEFAULT -->
  <rect x="45" y="415" width="230" height="95" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="160" y="437" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">MALLOC_CAP_DEFAULT</text>
  <text x="160" y="455" font-size="12" fill="#1a1a1a" text-anchor="middle">Стандартний malloc()</text>
  <text x="160" y="473" font-size="12" fill="#6b7280" text-anchor="middle">Автовибір за порогом</text>
  <text x="160" y="491" font-size="12" fill="#6b7280" text-anchor="middle">CONFIG_SPIRAM_MALLOC...</text>


  <!-- КОЛОНКА 2: Шини та контролери -->
  <rect x="330" y="85" width="270" height="445" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="465" y="112" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Шини та контролери ESP32-S3</text>

  <!-- Шина SRAM & DMA -->
  <rect x="345" y="130" width="240" height="170" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="465" y="153" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Матриця шин SRAM &amp; DMA</text>
  <line x1="365" y1="163" x2="565" y2="163" stroke="#eaf0fd" stroke-width="2"/>
  <text x="465" y="183" font-size="12" fill="#1a1a1a" text-anchor="middle">Прямий доступ Internal AHB</text>
  <text x="465" y="203" font-size="12" fill="#6b7280" text-anchor="middle">Тактова частота 240 МГц</text>
  <text x="465" y="230" font-size="12" fill="#1a1a1a" text-anchor="middle">· L1 Bypass (без затримок)</text>
  <text x="465" y="255" font-size="12" fill="#6b7280" text-anchor="middle">· Вирівнювання: 32-bit words</text>

  <!-- Шина Flash / PSRAM -->
  <rect x="345" y="320" width="240" height="190" fill="#ffffff" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="465" y="343" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Контролер Flash / PSRAM</text>
  <line x1="365" y1="353" x2="565" y2="353" stroke="#e9f7ef" stroke-width="2"/>
  <text x="465" y="373" font-size="12" fill="#1a1a1a" text-anchor="middle">Шина Octal / Quad SPI (OPI)</text>
  <text x="465" y="393" font-size="12" fill="#6b7280" text-anchor="middle">L1 Data Cache (32 КБ/ядро)</text>
  <text x="465" y="420" font-size="12" fill="#1a1a1a" text-anchor="middle">· Трансляція адрес MMU</text>
  <text x="465" y="445" font-size="12" fill="#6b7280" text-anchor="middle">· Доступ лише через CPU</text>
  <text x="465" y="475" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">⛔ Немає прямого DMA</text>


  <!-- КОЛОНКА 3: Пам'ять та Периферія -->
  <rect x="640" y="85" width="290" height="445" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="785" y="112" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Області пам'яті та Периферія</text>

  <!-- Внутрішня SRAM -->
  <rect x="655" y="130" width="260" height="120" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="785" y="152" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Внутрішня SRAM (SRAM 0/1/2)</text>
  <text x="670" y="176" font-size="12" fill="#1a1a1a">Обсяг: ~512 КБ (IRAM + DRAM)</text>
  <text x="670" y="198" font-size="12" font-weight="bold" fill="#27ae60">Доступ DMA: Прямий (апаратний)</text>
  <text x="670" y="220" font-size="12" fill="#6b7280">Критичні буфери та стек</text>

  <!-- DMA Периферія -->
  <rect x="655" y="265" width="260" height="80" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="785" y="287" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Периферія DMA (LCD_CAM, SPI)</text>
  <text x="785" y="307" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Потрібен MALLOC_CAP_DMA</text>
  <text x="785" y="327" font-size="12" fill="#6b7280" text-anchor="middle">Камери, дисплеї, Wi-Fi DMA</text>

  <!-- Зовнішня PSRAM -->
  <rect x="655" y="360" width="260" height="150" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="785" y="382" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Зовнішня PSRAM (Quad/Octal SPI)</text>
  <text x="670" y="406" font-size="12" fill="#1a1a1a">Обсяг: 2 МБ – 32 МБ</text>
  <text x="670" y="428" font-size="12" fill="#1a1a1a">Доступ: через CPU L1 Cache</text>
  <text x="670" y="450" font-size="12" font-weight="bold" fill="#c0392b">Прямий DMA: Відсутній</text>
  <text x="670" y="472" font-size="12" fill="#6b7280">Framebuffers, TinyML тензори</text>


  <!-- З'ЄДНУВАЛЬНІ ЛІНІЇ СТРІЛОК -->

  <!-- Потік DMA -> Матриця шин SRAM -->
  <line x1="275" y1="167" x2="345" y2="167" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Потік EXEC -> Матриця шин SRAM -->
  <line x1="275" y1="262" x2="345" y2="245" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>

  <!-- Потік SPIRAM -> Контролер PSRAM -->
  <line x1="275" y1="357" x2="345" y2="357" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Потік DEFAULT -> Контролер PSRAM / SRAM -->
  <line x1="275" y1="462" x2="345" y2="445" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>

  <!-- Потік з Матриці шин SRAM -> Внутрішня SRAM -->
  <line x1="585" y1="167" x2="655" y2="167" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Прив'язка SRAM -> DMA Периферія -->
  <line x1="785" y1="250" x2="785" y2="265" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Потік з Контролера PSRAM -> Зовнішня PSRAM -->
  <line x1="585" y1="415" x2="655" y2="415" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

</svg>
