<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Скалярне виконання vs 128-бітні SIMD MAC-операції в Xtensa PIE (ESP32-S3)</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">Векторне розширення PIE виконує 16 паралельних 8-бітних MAC-операцій за 1 такт замість послідовних обчислень</text>

  <!-- LEFT PANEL: Scalar Execution -->
  <rect x="30" y="85" width="300" height="430" fill="#fdecea" stroke="#e0b4b4" stroke-width="1.5" rx="8"/>
  <text x="180" y="112" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">Скалярний ALU (без SIMD)</text>
  <text x="180" y="130" font-size="12" fill="#6b7280" text-anchor="middle">Послідовне виконання по 1 операції</text>

  <!-- Badge Left -->
  <rect x="50" y="142" width="260" height="28" fill="#c0392b" rx="4"/>
  <text x="180" y="160" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">16 тактів для 16 MAC-операцій</text>

  <!-- Operands A & B -->
  <text x="110" y="188" font-size="12" fill="#6b7280" text-anchor="middle">Операнд A[i] (8 bit)</text>
  <rect x="70" y="196" width="80" height="36" fill="#ffffff" stroke="#c0392b" stroke-width="1.5" rx="4"/>
  <text x="110" y="219" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">A[i]</text>

  <text x="250" y="188" font-size="12" fill="#6b7280" text-anchor="middle">Операнд B[i] (8 bit)</text>
  <rect x="210" y="196" width="80" height="36" fill="#ffffff" stroke="#c0392b" stroke-width="1.5" rx="4"/>
  <text x="250" y="219" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">B[i]</text>

  <!-- Arrows to MAC -->
  <line x1="110" y1="232" x2="145" y2="268" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="250" y1="232" x2="215" y2="268" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Scalar MAC Unit -->
  <rect x="75" y="268" width="210" height="56" fill="#ffffff" stroke="#c0392b" stroke-width="2" rx="6"/>
  <text x="180" y="290" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Множник &amp; Акумулятор (MAC)</text>
  <text x="180" y="310" font-size="12" fill="#6b7280" text-anchor="middle">acc = acc + (A[i] × B[i])</text>

  <!-- Arrow to ACC -->
  <line x1="180" y1="324" x2="180" y2="356" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Accumulator ACC -->
  <rect x="75" y="356" width="210" height="48" fill="#ffffff" stroke="#c0392b" stroke-width="1.5" rx="4"/>
  <text x="180" y="375" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Регістр ACC (32-bit)</text>
  <text x="180" y="393" font-size="12" fill="#6b7280" text-anchor="middle">Накопичує 1 результат за такт</text>

  <!-- Iteration Box -->
  <rect x="55" y="420" width="250" height="78" fill="#ffffff" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <text x="180" y="440" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Цикл обчислень: i = 0 ... 15</text>
  <text x="180" y="460" font-size="12" fill="#1a1a1a" text-anchor="middle">Усього операцій: 16 MAC</text>
  <text x="180" y="480" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Загальний час: 16 тактів</text>

  <!-- RIGHT PANEL: SIMD Xtensa PIE -->
  <rect x="350" y="85" width="580" height="430" fill="#e9f7ef" stroke="#a3e2b8" stroke-width="1.5" rx="8"/>
  <text x="640" y="112" font-size="15" font-weight="bold" fill="#27ae60" text-anchor="middle">Векторне SIMD-виконання (Xtensa PIE)</text>
  <text x="640" y="130" font-size="12" fill="#6b7280" text-anchor="middle">Паралельне виконання 16 MAC-операцій за один такт</text>

  <!-- Badge Right -->
  <rect x="510" y="142" width="260" height="28" fill="#27ae60" rx="4"/>
  <text x="640" y="160" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1 такт для 16 MAC-операцій (16×)</text>

  <!-- Register Q_A -->
  <text x="376" y="186" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Векторний регістр Q_A (128 bit = 16 × 8-bit операндів)</text>

  <!-- Q_A 16 Cells -->
  <rect x="376" y="192" width="33" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="2"/>
  <text x="392.5" y="210" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">A0</text>
  <rect x="409" y="192" width="33" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="2"/>
  <text x="425.5" y="210" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">A1</text>
  <rect x="442" y="192" width="33" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="2"/>
  <text x="458.5" y="210" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">A2</text>
  <rect x="475" y="192" width="33" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="2"/>
  <text x="491.5" y="210" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">A3</text>
  <rect x="508" y="192" width="33" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="2"/>
  <text x="524.5" y="210" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">A4</text>
  <rect x="541" y="192" width="33" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="2"/>
  <text x="557.5" y="210" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">A5</text>
  <rect x="574" y="192" width="33" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="2"/>
  <text x="590.5" y="210" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">A6</text>
  <rect x="607" y="192" width="33" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="2"/>
  <text x="623.5" y="210" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">A7</text>
  <rect x="640" y="192" width="33" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="2"/>
  <text x="656.5" y="210" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">A8</text>
  <rect x="673" y="192" width="33" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="2"/>
  <text x="689.5" y="210" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">A9</text>
  <rect x="706" y="192" width="33" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="2"/>
  <text x="722.5" y="210" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">A10</text>
  <rect x="739" y="192" width="33" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="2"/>
  <text x="755.5" y="210" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">A11</text>
  <rect x="772" y="192" width="33" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="2"/>
  <text x="788.5" y="210" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">A12</text>
  <rect x="805" y="192" width="33" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="2"/>
  <text x="821.5" y="210" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">A13</text>
  <rect x="838" y="192" width="33" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="2"/>
  <text x="854.5" y="210" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">A14</text>
  <rect x="871" y="192" width="33" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="2"/>
  <text x="887.5" y="210" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">A15</text>

  <!-- Register Q_B -->
  <text x="376" y="234" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Векторний регістр Q_B (128 bit = 16 × 8-bit операндів)</text>

  <!-- Q_B 16 Cells -->
  <rect x="376" y="240" width="33" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="2"/>
  <text x="392.5" y="258" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">B0</text>
  <rect x="409" y="240" width="33" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="2"/>
  <text x="425.5" y="258" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">B1</text>
  <rect x="442" y="240" width="33" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="2"/>
  <text x="458.5" y="258" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">B2</text>
  <rect x="475" y="240" width="33" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="2"/>
  <text x="491.5" y="258" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">B3</text>
  <rect x="508" y="240" width="33" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="2"/>
  <text x="524.5" y="258" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">B4</text>
  <rect x="541" y="240" width="33" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="2"/>
  <text x="557.5" y="258" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">B5</text>
  <rect x="574" y="240" width="33" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="2"/>
  <text x="590.5" y="258" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">B6</text>
  <rect x="607" y="240" width="33" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="2"/>
  <text x="623.5" y="258" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">B7</text>
  <rect x="640" y="240" width="33" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="2"/>
  <text x="656.5" y="258" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">B8</text>
  <rect x="673" y="240" width="33" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="2"/>
  <text x="689.5" y="258" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">B9</text>
  <rect x="706" y="240" width="33" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="2"/>
  <text x="722.5" y="258" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">B10</text>
  <rect x="739" y="240" width="33" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="2"/>
  <text x="755.5" y="258" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">B11</text>
  <rect x="772" y="240" width="33" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="2"/>
  <text x="788.5" y="258" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">B12</text>
  <rect x="805" y="240" width="33" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="2"/>
  <text x="821.5" y="258" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">B13</text>
  <rect x="838" y="240" width="33" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="2"/>
  <text x="854.5" y="258" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">B14</text>
  <rect x="871" y="240" width="33" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="2"/>
  <text x="887.5" y="258" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">B15</text>

  <!-- MAC Engine Label & Container -->
  <text x="376" y="282" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">Паралельна SIMD-матриця: 16 × MAC-блоків (виконання за 1 такт)</text>

  <!-- MAC Units (16 Lanes) -->
  <rect x="376" y="288" width="528" height="32" fill="#ffffff" stroke="#27ae60" stroke-width="1.5" rx="4"/>

  <rect x="376" y="288" width="33" height="32" fill="none" stroke="#a3e2b8" stroke-width="1"/>
  <text x="392.5" y="309" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">MAC</text>

  <rect x="409" y="288" width="33" height="32" fill="none" stroke="#a3e2b8" stroke-width="1"/>
  <text x="425.5" y="309" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">MAC</text>

  <rect x="442" y="288" width="33" height="32" fill="none" stroke="#a3e2b8" stroke-width="1"/>
  <text x="458.5" y="309" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">MAC</text>

  <rect x="475" y="288" width="33" height="32" fill="none" stroke="#a3e2b8" stroke-width="1"/>
  <text x="491.5" y="309" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">MAC</text>

  <rect x="508" y="288" width="33" height="32" fill="none" stroke="#a3e2b8" stroke-width="1"/>
  <text x="524.5" y="309" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">MAC</text>

  <rect x="541" y="288" width="33" height="32" fill="none" stroke="#a3e2b8" stroke-width="1"/>
  <text x="557.5" y="309" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">MAC</text>

  <rect x="574" y="288" width="33" height="32" fill="none" stroke="#a3e2b8" stroke-width="1"/>
  <text x="590.5" y="309" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">MAC</text>

  <rect x="607" y="288" width="33" height="32" fill="none" stroke="#a3e2b8" stroke-width="1"/>
  <text x="623.5" y="309" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">MAC</text>

  <rect x="640" y="288" width="33" height="32" fill="none" stroke="#a3e2b8" stroke-width="1"/>
  <text x="656.5" y="309" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">MAC</text>

  <rect x="673" y="288" width="33" height="32" fill="none" stroke="#a3e2b8" stroke-width="1"/>
  <text x="689.5" y="309" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">MAC</text>

  <rect x="706" y="288" width="33" height="32" fill="none" stroke="#a3e2b8" stroke-width="1"/>
  <text x="722.5" y="309" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">MAC</text>

  <rect x="739" y="288" width="33" height="32" fill="none" stroke="#a3e2b8" stroke-width="1"/>
  <text x="755.5" y="309" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">MAC</text>

  <rect x="772" y="288" width="33" height="32" fill="none" stroke="#a3e2b8" stroke-width="1"/>
  <text x="788.5" y="309" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">MAC</text>

  <rect x="805" y="288" width="33" height="32" fill="none" stroke="#a3e2b8" stroke-width="1"/>
  <text x="821.5" y="309" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">MAC</text>

  <rect x="838" y="288" width="33" height="32" fill="none" stroke="#a3e2b8" stroke-width="1"/>
  <text x="854.5" y="309" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">MAC</text>

  <rect x="871" y="288" width="33" height="32" fill="none" stroke="#a3e2b8" stroke-width="1"/>
  <text x="887.5" y="309" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">MAC</text>

  <!-- Accumulators Label -->
  <text x="376" y="336" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">4 × 32-бітні акумулятори (накопичення по 4 канали на ACC)</text>

  <!-- Flow Arrows from MAC down to ACC -->
  <line x1="440.5" y1="342" x2="440.5" y2="362" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="573.5" y1="342" x2="573.5" y2="362" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="706.5" y1="342" x2="706.5" y2="362" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="839.5" y1="342" x2="839.5" y2="362" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- 4 Accumulators -->
  <rect x="376" y="364" width="129" height="46" fill="#ffffff" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="440.5" y="383" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ACC0 (32-bit)</text>
  <text x="440.5" y="401" font-size="12" fill="#6b7280" text-anchor="middle">Σ (A0..3 × B0..3)</text>

  <rect x="509" y="364" width="129" height="46" fill="#ffffff" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="573.5" y="383" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ACC1 (32-bit)</text>
  <text x="573.5" y="401" font-size="12" fill="#6b7280" text-anchor="middle">Σ (A4..7 × B4..7)</text>

  <rect x="642" y="364" width="129" height="46" fill="#ffffff" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="706.5" y="383" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ACC2 (32-bit)</text>
  <text x="706.5" y="401" font-size="12" fill="#6b7280" text-anchor="middle">Σ (A8..11 × B8..11)</text>

  <rect x="775" y="364" width="129" height="46" fill="#ffffff" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="839.5" y="383" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ACC3 (32-bit)</text>
  <text x="839.5" y="401" font-size="12" fill="#6b7280" text-anchor="middle">Σ (A12..15 × B12..15)</text>

  <!-- Summary Box Right -->
  <rect x="376" y="422" width="528" height="78" fill="#ffffff" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="640" y="442" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Результат: 16 MAC-операцій виконуються за 1 такт CPU</text>
  <text x="640" y="462" font-size="12" fill="#1a1a1a" text-anchor="middle">Теоретична пікова продуктивність на 240 МГц: 3.84 GMAC/s (7.68 GOPs/s)</text>
  <text x="640" y="482" font-size="12" fill="#6b7280" text-anchor="middle">Фактори зниження: вирівнювання даних, пропуски кешу та пропускна здатність шини</text>
</svg>
