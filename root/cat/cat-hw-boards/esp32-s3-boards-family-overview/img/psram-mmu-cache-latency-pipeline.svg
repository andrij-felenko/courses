<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <defs>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Конвеєр доступу CPU через L1-кеш та MMU до зовнішньої PSRAM</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Промахи кешу (Cache Miss) та регенерація DRAM створюють додаткові часові затримки на шині</text>

  <!-- Column 1: CPU Core -->
  <rect x="30" y="80" width="150" height="430" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="105" y="108" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Ядро CPU</text>
  <text x="105" y="126" font-size="12" fill="#6b7280" text-anchor="middle">Xtensa LX7 (240 MHz)</text>

  <!-- Component 1A: Instruction Execution -->
  <rect x="42" y="150" width="126" height="140" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="105" y="174" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Генератор VA</text>
  <text x="105" y="196" font-size="12" fill="#1a1a1a" text-anchor="middle">Віртуальна адреса</text>
  <text x="105" y="218" font-size="12" fill="#6b7280" text-anchor="middle">Команда Read/Write</text>
  <text x="105" y="240" font-size="12" fill="#2457d6" text-anchor="middle">Запит: 0x3F800000</text>
  <text x="105" y="262" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Тактується 240MHz</text>

  <!-- Component 1B: Latency Impact -->
  <rect x="42" y="320" width="126" height="170" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <text x="105" y="344" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Вплив затримок</text>
  <text x="105" y="368" font-size="12" fill="#1a1a1a" text-anchor="middle">• CPU Stall (пауза)</text>
  <text x="105" y="390" font-size="12" fill="#c0392b" text-anchor="middle">• Блокування ядра</text>
  <text x="105" y="412" font-size="12" fill="#6b7280" text-anchor="middle">• Втрата тактів</text>
  <text x="105" y="434" font-size="12" fill="#c0392b" text-anchor="middle">• Зниження FPS</text>
  <text x="105" y="460" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Пауза до 100+ нс</text>

  <!-- Arrow Col 1 to Col 2 -->
  <line x1="168" y1="190" x2="210" y2="190" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="189" y="178" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">VA</text>

  <!-- Column 2: L1 Cache -->
  <rect x="210" y="80" width="180" height="430" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="300" y="108" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. L1-кеш (32/64 KB)</text>
  <text x="300" y="126" font-size="12" fill="#6b7280" text-anchor="middle">Перевірка кеш-ліній</text>

  <!-- Component 2A: Cache Hit Path -->
  <rect x="222" y="150" width="156" height="100" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="300" y="174" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Hit (Влучання)</text>
  <text x="300" y="196" font-size="12" fill="#1a1a1a" text-anchor="middle">Дані є у L1-кеші</text>
  <text x="300" y="218" font-size="12" fill="#27ae60" text-anchor="middle">Затримка: 1-2 такти</text>
  <text x="300" y="238" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Швидка відповідь</text>

  <!-- Return Arrow Cache Hit -->
  <line x1="222" y1="170" x2="168" y2="170" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="195" y="158" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Hit</text>

  <!-- Component 2B: Cache Miss Path -->
  <rect x="222" y="270" width="156" height="220" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <text x="300" y="294" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Miss (Промах)</text>
  <text x="300" y="316" font-size="12" fill="#1a1a1a" text-anchor="middle">Даних немає у кеші</text>
  <text x="300" y="338" font-size="12" fill="#c0392b" text-anchor="middle">Запитується лінія 32B</text>
  <text x="300" y="360" font-size="12" fill="#6b7280" text-anchor="middle">Штраф: +20-50 тактів</text>
  <text x="300" y="382" font-size="12" fill="#1a1a1a" text-anchor="middle">Передається до MMU</text>

  <!-- Sub-box Cache Eviction -->
  <rect x="232" y="400" width="136" height="75" fill="#ffffff" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="300" y="420" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Заміщення ліній</text>
  <text x="300" y="440" font-size="12" fill="#6b7280" text-anchor="middle">Write-back брудних</text>
  <text x="300" y="460" font-size="12" fill="#c0392b" text-anchor="middle">Додатковий оверхед</text>

  <!-- Arrow Col 2 to Col 3 (Miss to MMU) -->
  <line x1="378" y1="360" x2="420" y2="360" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="399" y="348" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Miss</text>

  <!-- Column 3: MMU & SPI Controller -->
  <rect x="420" y="80" width="230" height="430" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="535" y="108" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3. MMU та SPI Контролер</text>
  <text x="535" y="126" font-size="12" fill="#6b7280" text-anchor="middle">Трансляція та формувач шини</text>

  <!-- Component 3A: MMU Address Translation Box -->
  <rect x="432" y="150" width="206" height="140" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="535" y="172" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Блок MMU (Page Tables)</text>
  <text x="535" y="194" font-size="12" fill="#1a1a1a" text-anchor="middle">Трансляція VA -&gt; PA</text>
  <text x="535" y="216" font-size="12" fill="#6b7280" text-anchor="middle">Сторінки 64 КБ (64KB Page)</text>
  <text x="535" y="238" font-size="12" fill="#c0392b" text-anchor="middle">TLB Miss: +10-15 тактів</text>
  <text x="535" y="260" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Фізична адреса PA</text>

  <!-- Component 3B: SPI Controller Box -->
  <rect x="432" y="310" width="206" height="180" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="535" y="332" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Контролер SPI (OPI/QSPI)</text>
  <text x="535" y="354" font-size="12" fill="#1a1a1a" text-anchor="middle">Режими: Octal DDR / Quad</text>
  <text x="535" y="376" font-size="12" fill="#2457d6" text-anchor="middle">Частота шини: 80–120 MHz</text>
  <text x="535" y="398" font-size="12" fill="#6b7280" text-anchor="middle">Передача Command+Addr</text>
  <text x="535" y="420" font-size="12" fill="#6b7280" text-anchor="middle">Паузи Dummy Cycles (6-10)</text>
  <text x="535" y="444" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Пропускність: 80-160MB/s</text>
  <text x="535" y="466" font-size="12" fill="#6b7280" text-anchor="middle">(теоретичний максимум)</text>

  <!-- Arrow Col 3 to Col 4 -->
  <line x1="638" y1="400" x2="680" y2="400" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="659" y="388" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">SPI</text>

  <!-- Column 4: External PSRAM -->
  <rect x="680" y="80" width="250" height="430" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="805" y="108" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">4. Зовнішня чипова PSRAM</text>
  <text x="805" y="126" font-size="12" fill="#6b7280" text-anchor="middle">Чип 8-16 МБ (OPI PSRAM)</text>

  <!-- Component 4A: Memory Array -->
  <rect x="692" y="150" width="226" height="140" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="805" y="172" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Масив елементів DRAM</text>
  <text x="805" y="194" font-size="12" fill="#1a1a1a" text-anchor="middle">Вибірка пакету даних</text>
  <text x="805" y="216" font-size="12" fill="#6b7280" text-anchor="middle">Час t_ACC (Access Time)</text>
  <text x="805" y="238" font-size="12" fill="#6b7280" text-anchor="middle">Вибірка по 32 байти</text>
  <text x="805" y="260" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Передача до L1-кешу</text>

  <!-- Component 4B: DRAM Refresh Latency -->
  <rect x="692" y="310" width="226" height="180" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <text x="805" y="332" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Часові паузи регенерації</text>
  <text x="805" y="354" font-size="12" fill="#1a1a1a" text-anchor="middle">Авто-регенерація t_REFRESH</text>
  <text x="805" y="376" font-size="12" fill="#c0392b" text-anchor="middle">Макс. час CS t_CEM (8 мкс)</text>
  <text x="805" y="398" font-size="12" fill="#6b7280" text-anchor="middle">Примусове розривання CS</text>
  <text x="805" y="420" font-size="12" fill="#c0392b" text-anchor="middle">Затримка Stall: +60-120 нс</text>
  <text x="805" y="444" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Пауза шини під час регенерації</text>
  <text x="805" y="466" font-size="12" fill="#6b7280" text-anchor="middle">(періодичне запізнення)</text>
</svg>
