<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема розв'язки та струмових меж ліній живлення VDD і VDD_SPI в ESP32-S3</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Низькочастотне та високочастотне шунтування ліній VDD3P3 і VDD_SPI з обмеженнями струмових навантажень каскадів</text>

  <!-- Left Block: Power Source & LDO -->
  <rect x="40" y="90" width="200" height="430" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="8"/>
  <text x="140" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">Джерело живлення 3.3V</text>
  <text x="140" y="133" text-anchor="middle" font-size="12" fill="#6b7280">(LDO / DC-DC Перетворювач)</text>

  <text x="140" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">500 mA пік (Wi-Fi/BT)</text>

  <!-- Internal LDO Sub-box -->
  <rect x="60" y="240" width="160" height="120" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="140" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Внутрішній LDO VDD_SPI</text>
  <text x="140" y="284" text-anchor="middle" font-size="11" fill="#6b7280">Кероване джерело живлення</text>
  <text x="140" y="306" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Вибір: 1.8V (GPIO45=1)</text>
  <text x="140" y="328" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Вибір: 3.3V (GPIO45=0)</text>
  <text x="140" y="348" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Max струм: I_max = 40 mA</text>

  <text x="140" y="410" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">I_out(GPIO) ≤ 40 mA</text>
  <text x="140" y="430" text-anchor="middle" font-size="11" fill="#6b7280">Сумарний струм GPIO ≤ 120 mA</text>

  <!-- Middle Block 1: VDD3P3 Domain Decoupling -->
  <rect x="280" y="90" width="380" height="200" fill="#fdecea" stroke="#c0392b" stroke-width="2" rx="8"/>
  <text x="470" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">Шунтування лінії VDD3P3 (Основне ядро та RF)</text>

  <!-- Power Rail VDD3P3 & GND -->
  <line x1="240" y1="150" x2="690" y2="150" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-red)"/>
  <line x1="240" y1="230" x2="690" y2="230" stroke="#1a1a1a" stroke-width="3"/>

  <!-- C1 (10 uF Tantalum) -->
  <line x1="320" y1="150" x2="320" y2="173" stroke="#c0392b" stroke-width="2"/>
  <rect x="305" y="173" width="30" height="4" fill="#c0392b"/>
  <rect x="305" y="183" width="30" height="4" fill="#1a1a1a"/>
  <line x1="320" y1="187" x2="320" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <text x="345" y="182" text-anchor="start" font-size="11" fill="#6b7280">C1 (10 µF)</text>

  <!-- C2 (0.1 uF Ceramic) -->
  <line x1="430" y1="150" x2="430" y2="173" stroke="#c0392b" stroke-width="2"/>
  <rect x="415" y="173" width="30" height="4" fill="#2457d6"/>
  <rect x="415" y="183" width="30" height="4" fill="#1a1a1a"/>
  <line x1="430" y1="187" x2="430" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <text x="455" y="182" text-anchor="start" font-size="11" fill="#6b7280">C2 (0.1 µF)</text>

  <!-- C3 (10 nF Ceramic High-Freq) -->
  <line x1="545" y1="150" x2="545" y2="173" stroke="#c0392b" stroke-width="2"/>
  <rect x="530" y="173" width="30" height="4" fill="#2457d6"/>
  <rect x="530" y="183" width="30" height="4" fill="#1a1a1a"/>
  <line x1="545" y1="187" x2="545" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <text x="570" y="182" text-anchor="start" font-size="11" fill="#6b7280">C3 (10 nF)</text>

  <text x="470" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Фільтрація імпульсних сплесків струму Wi-Fi (до 500 мА)</text>

  <!-- Middle Block 2: VDD_SPI Domain Decoupling -->
  <rect x="280" y="310" width="380" height="210" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="8"/>
  <text x="470" y="335" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Шунтування лінії VDD_SPI (Flash / PSRAM)</text>

  <!-- Power Rail VDD_SPI & GND -->
  <line x1="220" y1="370" x2="690" y2="370" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>
  <line x1="240" y1="470" x2="690" y2="470" stroke="#1a1a1a" stroke-width="3"/>

  <!-- C4 (1 uF Ceramic) -->
  <line x1="350" y1="370" x2="350" y2="393" stroke="#2457d6" stroke-width="2"/>
  <rect x="335" y="393" width="30" height="4" fill="#2457d6"/>
  <rect x="335" y="403" width="30" height="4" fill="#1a1a1a"/>
  <line x1="350" y1="407" x2="350" y2="470" stroke="#1a1a1a" stroke-width="2"/>
  <text x="375" y="402" text-anchor="start" font-size="11" fill="#6b7280">C4 (1 µF)</text>

  <!-- C5 (0.1 uF Ceramic) -->
  <line x1="500" y1="370" x2="500" y2="393" stroke="#2457d6" stroke-width="2"/>
  <rect x="485" y="393" width="30" height="4" fill="#2457d6"/>
  <rect x="485" y="403" width="30" height="4" fill="#1a1a1a"/>
  <line x1="500" y1="407" x2="500" y2="470" stroke="#1a1a1a" stroke-width="2"/>
  <text x="525" y="402" text-anchor="start" font-size="11" fill="#6b7280">C5 (0.1 µF)</text>

  <text x="470" y="498" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Границя струму: I_SPI ≤ 40 мА (захист від вибіркових збоїв PSRAM)</text>

  <!-- Right Block: ESP32-S3 SoC / Module -->
  <rect x="700" y="90" width="220" height="430" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="8"/>
  <text x="810" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">ESP32-S3 SoC / Модуль</text>
  <text x="810" y="133" text-anchor="middle" font-size="12" fill="#6b7280">(Навантаження каскадів)</text>

  <!-- Pin 1: VDD3P3 -->
  <circle cx="700" cy="150" r="4" fill="#c0392b"/>
  <text x="715" y="144" text-anchor="start" font-size="13" font-weight="bold" fill="#c0392b">VDD3P3 (3.3V)</text>
  <text x="810" y="180" text-anchor="middle" font-size="11" fill="#6b7280">Ядро Xtensa LX7, Wi-Fi/BT</text>
  <text x="810" y="200" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">I_peak ≈ 500 mA</text>

  <line x1="720" y1="230" x2="900" y2="230" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Pin 2: VDD_SPI -->
  <circle cx="700" cy="370" r="4" fill="#2457d6"/>
  <text x="715" y="364" text-anchor="start" font-size="13" font-weight="bold" fill="#2457d6">VDD_SPI (1.8V/3.3V)</text>
  <text x="810" y="400" text-anchor="middle" font-size="11" fill="#6b7280">Живлення Flash &amp; PSRAM</text>
  <text x="810" y="420" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">I_max ≤ 40 mA</text>
  <text x="810" y="440" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Strapping: GPIO45</text>
</svg>
