<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Картування виводів шин Quad SPI та Octal SPI в ESP32-S3</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Зарезервовані внутрішні лінії PSRAM/Flash та їхній вплив на вільні GPIO модуля</text>

  <!-- PANEL 1: Quad SPI -->
  <rect x="30" y="85" width="435" height="370" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="45" y="98" width="405" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="247" y="119" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Конфігурація Quad SPI (4-біт)</text>

  <rect x="45" y="142" width="405" height="120" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="60" y="164" font-size="12" font-weight="bold" fill="#1a1a1a">Зарезервовані шинні лінії (Внутрішній монтаж):</text>
  <text x="60" y="186" font-size="11" fill="#6b7280">• GPIO26 .. GPIO32 (7 виводів)</text>
  <text x="60" y="204" font-size="11" fill="#6b7280">• Шина: SPICLK, SPID, SPIQ, SPIWP, SPIHD, SPICS0, SPICS1</text>
  <text x="60" y="224" font-size="11" font-weight="bold" fill="#2457d6">Призначення: 4-біт Flash та 4-біт PSRAM</text>

  <rect x="45" y="274" width="405" height="165" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="60" y="296" font-size="12" font-weight="bold" fill="#27ae60">Вільні GPIO для користувача (Доступні):</text>
  <text x="60" y="318" font-size="11" font-weight="bold" fill="#1a1a1a">• GPIO33, GPIO34, GPIO35, GPIO36, GPIO37</text>
  <text x="60" y="338" font-size="11" fill="#6b7280">• Вільні для розведення периферії, UART, I2C, SPI, ADC</text>
  <text x="60" y="360" font-size="11" fill="#6b7280">• Виведені на зовнішні контакти гребінки модуля</text>
  <text x="60" y="385" font-size="11" font-weight="bold" fill="#27ae60">Результат: +5 вільних портів I/O на гребінці</text>

  <!-- PANEL 2: Octal SPI -->
  <rect x="495" y="85" width="435" height="370" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="510" y="98" width="405" height="32" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="712" y="119" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Конфігурація Octal SPI (8-біт OPI)</text>

  <rect x="510" y="142" width="405" height="120" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="525" y="164" font-size="12" font-weight="bold" fill="#1a1a1a">Зарезервовані шинні лінії (Внутрішній монтаж):</text>
  <text x="525" y="186" font-size="11" fill="#6b7280">• GPIO26 .. GPIO32 (Базова шина SPI)</text>
  <text x="525" y="204" font-size="11" font-weight="bold" fill="#c0392b">• GPIO33, GPIO34, GPIO35, GPIO36, GPIO37 (Розширення 8-біт)</text>
  <text x="525" y="224" font-size="11" font-weight="bold" fill="#1a1a1a">• Шина: D0..D7, SPI_CLK, SPI_CS, SPI_DQS</text>

  <rect x="510" y="274" width="405" height="165" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="525" y="296" font-size="12" font-weight="bold" fill="#c0392b">Заблоковані GPIO у модулях N8R8 / N16R8:</text>
  <text x="525" y="318" font-size="11" font-weight="bold" fill="#1a1a1a">• GPIO33 .. GPIO37 ЗАБОРОНЕНО використовувати</text>
  <text x="525" y="338" font-size="11" fill="#6b7280">• Підключені до високошвидкісних кристалів OPI PSRAM</text>
  <text x="525" y="360" font-size="11" fill="#6b7280">• Спроба підключення периферії спричинить збій OPI PSRAM</text>
  <text x="525" y="385" font-size="11" font-weight="bold" fill="#c0392b">Результат: -5 портів I/O задіяні шиною OPI</text>
</svg>
