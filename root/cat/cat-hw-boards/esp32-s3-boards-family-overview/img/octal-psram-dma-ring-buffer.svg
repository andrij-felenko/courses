<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кільцевий буфер DMA в Octal PSRAM для відеопотоку ESP32-S3</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Чергування апаратного заповнення кадрів та їх зчитування без участі ЦПУ</text>

  <!-- Ліва панель: Джерело -->
  <rect x="30" y="80" width="200" height="415" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="130" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Джерело відеопотоку</text>

  <rect x="45" y="125" width="170" height="75" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="130" y="146" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Сенсор OV2640 / OV5640</text>
  <text x="130" y="166" font-size="12" fill="#6b7280" text-anchor="middle">DVP 8/16-bit + PCLK</text>
  <text x="130" y="184" font-size="12" fill="#6b7280" text-anchor="middle">(кадри до 30 FPS)</text>

  <line x1="130" y1="200" x2="130" y2="227" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="45" y="235" width="170" height="75" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="130" y="256" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Периферія LCD_CAM</text>
  <text x="130" y="276" font-size="12" fill="#1a1a1a" text-anchor="middle">Апаратний Rx FIFO</text>
  <text x="130" y="294" font-size="12" fill="#6b7280" text-anchor="middle">Прямий запис DMA</text>

  <rect x="45" y="380" width="170" height="95" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="130" y="401" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Автономність DMA</text>
  <text x="130" y="421" font-size="12" fill="#6b7280" text-anchor="middle">Запис без паузи</text>
  <text x="130" y="439" font-size="12" fill="#6b7280" text-anchor="middle">Нульове навантаження</text>
  <text x="130" y="457" font-size="12" fill="#6b7280" text-anchor="middle">на ядра ЦПУ</text>

  <!-- Центральна панель: Octal PSRAM + DMA ring -->
  <rect x="250" y="80" width="460" height="415" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Пам'ять Octal PSRAM та дескриптори DMA</text>

  <!-- Буфер 0 -->
  <rect x="270" y="125" width="195" height="80" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="280" y="133" width="70" height="20" rx="4" fill="#f4f6f8"/>
  <text x="315" y="147" font-size="12" fill="#6b7280" text-anchor="middle">Вільний</text>
  <text x="367" y="167" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Буфер 0 (Кадр N+1)</text>
  <text x="367" y="189" font-size="12" fill="#6b7280" text-anchor="middle">Очікує черги DMA</text>

  <!-- Буфер 1 (Запис HW) -->
  <rect x="495" y="125" width="195" height="80" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <rect x="505" y="133" width="115" height="20" rx="4" fill="#2457d6"/>
  <text x="562.5" y="147" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ЗАПИС DMA (HW)</text>
  <text x="592" y="167" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Буфер 1 (Кадр N)</text>
  <text x="592" y="189" font-size="12" fill="#1a1a1a" text-anchor="middle">Потік з LCD_CAM</text>

  <!-- Буфер 2 (Готовий) -->
  <rect x="495" y="255" width="195" height="80" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="505" y="263" width="90" height="20" rx="4" fill="#27ae60"/>
  <text x="550" y="277" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ГОТОВИЙ</text>
  <text x="592" y="297" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Буфер 2 (Кадр N-1)</text>
  <text x="592" y="319" font-size="12" fill="#1a1a1a" text-anchor="middle">Очікує передачі</text>

  <!-- Буфер 3 (Зчитування SW) -->
  <rect x="270" y="255" width="195" height="80" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <rect x="280" y="263" width="125" height="20" rx="4" fill="#2457d6"/>
  <text x="342.5" y="277" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ЗЧИТУВАННЯ (SW)</text>
  <text x="367" y="297" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Буфер 3 (Кадр N-2)</text>
  <text x="367" y="319" font-size="12" fill="#1a1a1a" text-anchor="middle">Відправка в Wi-Fi</text>

  <!-- Стрілки кільця next дескрипторів DMA -->
  <line x1="465" y1="165" x2="487" y2="165" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="480" y="155" font-size="12" fill="#6b7280" text-anchor="middle">next</text>

  <line x1="640" y1="205" x2="640" y2="247" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="650" y="232" font-size="12" fill="#6b7280" text-anchor="start">next</text>

  <line x1="495" y1="295" x2="473" y2="295" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="480" y="285" font-size="12" fill="#6b7280" text-anchor="middle">next</text>

  <line x1="310" y1="255" x2="310" y2="213" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="300" y="232" font-size="12" fill="#6b7280" text-anchor="end">next</text>

  <!-- Особливості PSRAM та DMA -->
  <rect x="270" y="380" width="425" height="95" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="482.5" y="401" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Особливості Octal PSRAM + DMA</text>
  <text x="285" y="421" font-size="12" fill="#1a1a1a">• Шина Octal SPI (OPI): пропускна здатність до 80 МБ/с</text>
  <text x="285" y="439" font-size="12" fill="#1a1a1a">• Дескриптори DMA: зациклені через вказівники next</text>
  <text x="285" y="457" font-size="12" fill="#1a1a1a">• Авто-перемикання: апаратна зміна кадру по EOF</text>

  <!-- Права панель: Споживач (Мережа / USB) -->
  <rect x="730" y="80" width="200" height="415" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="830" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Передача в мережу</text>

  <rect x="745" y="125" width="170" height="75" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="830" y="147" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Wi-Fi HTTP / RTSP</text>
  <text x="830" y="167" font-size="12" fill="#1a1a1a" text-anchor="middle">MJPEG потік</text>
  <text x="830" y="185" font-size="12" fill="#6b7280" text-anchor="middle">Зчитування з PSRAM</text>

  <rect x="745" y="235" width="170" height="75" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="830" y="257" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">USB OTG (UVC)</text>
  <text x="830" y="277" font-size="12" fill="#1a1a1a" text-anchor="middle">Пряма передача</text>
  <text x="830" y="295" font-size="12" fill="#6b7280" text-anchor="middle">Висока швидкість</text>

  <rect x="745" y="380" width="170" height="95" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="830" y="401" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Результат</text>
  <text x="830" y="421" font-size="12" fill="#1a1a1a" text-anchor="middle">Стабільні 30 FPS</text>
  <text x="830" y="439" font-size="12" fill="#1a1a1a" text-anchor="middle">Без пропуску кадрів</text>
  <text x="830" y="457" font-size="12" fill="#6b7280" text-anchor="middle">Мінімальний jitter</text>

  <!-- Зв'язки між панелями -->
  <!-- Потік запису з LCD_CAM в Буфер 1 (вгорі над кільцем) -->
  <path d="M 215,272.5 L 236,272.5 L 236,112 L 592,112 L 592,123" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="240" y="104" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">Запис DMA (HW)</text>

  <!-- Потік зчитування з Бувера 3 в мережу / USB (внизу під кільцем) -->
  <path d="M 367,335 L 367,364 L 722,364 L 722,162.5 L 743,162.5" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <path d="M 722,272.5 L 743,272.5" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="480" y="352" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Зчитування в мережу (SW)</text>

</svg>
