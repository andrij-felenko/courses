<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow Blue Down -->
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <!-- Arrow Blue Up -->
    <marker id="arr-blue-up" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
    </marker>
    <!-- Arrow Green Down -->
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <!-- Arrow Green Up -->
    <marker id="arr-green-up" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розподіл пам'яті ESP32-S3 для TinyML та прискорення Xtensa PIE</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">Використання heap_caps для розділення SRAM, PSRAM і Flash під ваги, арену тензорів та буфери DSP</text>

  <!-- ==================== COLUMN 1: Flash Memory ==================== -->
  <rect x="30" y="88" width="280" height="302" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="170" y="112" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Flash-пам'ять (SPI Flash)</text>
  <text x="170" y="132" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Шина DROM (Read-Only)</text>

  <!-- Block 1.1: Model Weights -->
  <rect x="45" y="147" width="250" height="108" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="170" y="168" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вагові коефіцієнти моделі</text>
  <text x="170" y="188" font-size="12" fill="#6b7280" text-anchor="middle">Файл моделі (.tflite)</text>
  <text x="170" y="206" font-size="12" fill="#6b7280" text-anchor="middle">Пряме читання через DROM cache</text>
  <rect x="60" y="220" width="220" height="24" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="170" y="236" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">esp_partition_mmap()</text>

  <!-- Block 1.2: Flash Properties -->
  <rect x="45" y="265" width="250" height="110" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="170" y="286" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Характеристики Flash</text>
  <text x="170" y="306" font-size="12" fill="#1a1a1a" text-anchor="middle">Обсяг: 4 МБ / 8 МБ / 16 МБ</text>
  <text x="170" y="324" font-size="12" fill="#1a1a1a" text-anchor="middle">Не потребує RAM для ваг</text>
  <text x="170" y="344" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Економія оперативної пам'яті</text>

  <!-- ==================== COLUMN 2: Internal SRAM ==================== -->
  <rect x="340" y="88" width="280" height="302" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="112" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Внутрішня SRAM (512 КБ)</text>
  <text x="480" y="132" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">SRAM1/2 (128-bit Bus &amp; DMA)</text>

  <!-- Block 2.1: DSP Buffers -->
  <rect x="355" y="147" width="250" height="108" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="480" y="168" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Буфери DSP та I2S DMA</text>
  <text x="480" y="188" font-size="12" fill="#6b7280" text-anchor="middle">Аудіозахоплення з мікрофона</text>
  <text x="480" y="206" font-size="12" fill="#6b7280" text-anchor="middle">Буфер БПФ / спектрограми</text>
  <rect x="365" y="220" width="230" height="24" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="480" y="236" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">MALLOC_CAP_INTERNAL | DMA</text>

  <!-- Block 2.2: ESP-NN Scratchpad -->
  <rect x="355" y="265" width="250" height="110" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="286" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Швидкий буфер ESP-NN</text>
  <text x="480" y="306" font-size="12" fill="#6b7280" text-anchor="middle">Проміжні обчислення SIMD</text>
  <text x="480" y="324" font-size="12" fill="#6b7280" text-anchor="middle">Максимальна швидкість Xtensa PIE</text>
  <rect x="365" y="340" width="230" height="24" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="356" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">MALLOC_CAP_INTERNAL | 8BIT</text>

  <!-- ==================== COLUMN 3: External PSRAM ==================== -->
  <rect x="650" y="88" width="280" height="302" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="790" y="112" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Зовнішня PSRAM (SPI RAM)</text>
  <text x="790" y="132" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Octal SPI RAM (до 8 / 16 МБ)</text>

  <!-- Block 3.1: Tensor Arena -->
  <rect x="665" y="147" width="250" height="108" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="790" y="168" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Тензорна арена TFLite</text>
  <text x="790" y="188" font-size="12" fill="#6b7280" text-anchor="middle">Тензори входу/виходу і шарів</text>
  <text x="790" y="206" font-size="12" fill="#6b7280" text-anchor="middle">Велика оперативна пам'ять</text>
  <rect x="675" y="220" width="230" height="24" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="790" y="236" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">MALLOC_CAP_SPIRAM</text>

  <!-- Block 3.2: Audio Ring Buffer -->
  <rect x="665" y="265" width="250" height="110" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="790" y="286" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кільцевий аудіобуфер</text>
  <text x="790" y="306" font-size="12" fill="#6b7280" text-anchor="middle">Накопичення часових вікон</text>
  <text x="790" y="324" font-size="12" fill="#6b7280" text-anchor="middle">Збереження спектрограм</text>
  <rect x="675" y="340" width="230" height="24" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
  <text x="790" y="356" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">heap_caps_malloc(..., SPIRAM)</text>

  <!-- ==================== VERTICAL CONNECTIONS ==================== -->
  <!-- Line A: Flash -> Execution -->
  <line x1="170" y1="390" x2="170" y2="413" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="182" y="408" font-size="12" fill="#2457d6" text-anchor="start">Ваги в Flash (DROM)</text>

  <!-- Line B: SRAM <-> Xtensa PIE -->
  <line x1="480" y1="390" x2="480" y2="413" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)" marker-start="url(#arr-green-up)"/>
  <text x="492" y="408" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">128-bit SIMD шина</text>

  <!-- Line C: PSRAM <-> Execution -->
  <line x1="790" y1="390" x2="790" y2="413" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)" marker-start="url(#arr-blue-up)"/>
  <text x="802" y="408" font-size="12" fill="#2457d6" text-anchor="start">Арена в PSRAM</text>

  <!-- ==================== BOTTOM PANEL: Execution & Hardware Acceleration ==================== -->
  <rect x="30" y="415" width="900" height="120" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="435" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Апаратне забезпечення ESP32-S3: Двоядерний LX7 &amp; Векторний співпроцесор PIE</text>

  <!-- Sub-block 4.1: DSP Audio -->
  <rect x="45" y="445" width="260" height="78" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="175" y="465" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Обробка аудіосигналу (DSP)</text>
  <text x="175" y="485" font-size="12" fill="#6b7280" text-anchor="middle">Прийом I2S DMA -&gt; FFT (БПФ)</text>
  <text x="175" y="504" font-size="12" fill="#6b7280" text-anchor="middle">Генерація спектрограми</text>

  <!-- Sub-block 4.2: Xtensa PIE -->
  <rect x="340" y="445" width="280" height="78" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="465" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Векторний співпроцесор PIE</text>
  <text x="480" y="485" font-size="12" fill="#1a1a1a" text-anchor="middle">128-бітні Q-регістри (SIMD)</text>
  <text x="480" y="504" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Прискорення ESP-NN (8-bit MAC)</text>

  <!-- Sub-block 4.3: TFLite Micro -->
  <rect x="655" y="445" width="260" height="78" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="785" y="465" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Інтерпретатор TFLite Micro</text>
  <text x="785" y="485" font-size="12" fill="#6b7280" text-anchor="middle">Виконання графів нейромережі</text>
  <text x="785" y="504" font-size="12" fill="#6b7280" text-anchor="middle">Виклик ESP-NN операторів</text>
</svg>
