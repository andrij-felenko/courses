<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Еволюція архітектури ESP32-S3: Quad SPI проти Octal SPI та нативний USB</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">8-бітна шина Octal SPI подвоює швидкість PSRAM, а вбудований USB CDC/JTAG усуває зовнішній мост</text>

  <!-- Left Panel: Quad SPI Architecture -->
  <rect x="40" y="90" width="420" height="330" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <rect x="55" y="102" width="390" height="28" fill="#eaf0fd" rx="4"/>
  <text x="250" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Класична архітектура (Quad SPI)</text>

  <rect x="55" y="145" width="390" height="110" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="250" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Шина пам'яті Flash / PSRAM</text>
  <text x="250" y="188" text-anchor="middle" font-size="12" fill="#6b7280">4-бітна шина даних (D0..D3 + CS + CLK)</text>
  <text x="250" y="208" text-anchor="middle" font-size="12" fill="#c0392b">Пропускна здатність: ~40 МБ/с (40/80 МГц)</text>
  <text x="250" y="238" text-anchor="middle" font-size="12" fill="#c0392b">Обмеження для TinyML та 2 МП кадрових масивів</text>

  <rect x="55" y="265" width="390" height="140" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="250" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Підключення USB та налагодження</text>
  <text x="250" y="308" text-anchor="middle" font-size="12" fill="#6b7280">Зовнішня мікросхема USB-to-UART (CP2102/CH340)</text>
  <text x="250" y="328" text-anchor="middle" font-size="12" fill="#6b7280">Окремі піни TXD / RXD для прошивки</text>
  <text x="250" y="348" text-anchor="middle" font-size="12" fill="#c0392b">JTAG вимагає додаткових 4 пінів GPIO</text>
  <text x="250" y="385" text-anchor="middle" font-size="12" fill="#6b7280">Додаткова площа плати та вартість компонентів</text>

  <!-- Right Panel: Octal SPI & Native USB Architecture -->
  <rect x="500" y="90" width="420" height="330" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="8"/>
  <rect x="515" y="102" width="390" height="28" fill="#27ae60" rx="4"/>
  <text x="710" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Архітектура ESP32-S3 (Octal SPI + Native USB)</text>

  <rect x="515" y="145" width="390" height="110" fill="#ffffff" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="710" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Шина пам'яті Octal SPI (OPI)</text>
  <text x="710" y="188" text-anchor="middle" font-size="12" fill="#1a1a1a">8-бітна шина даних (D0..D7 + CS + CLK + DQS)</text>
  <text x="710" y="208" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Пропускна здатність: ~80-120 МБ/с (80 МГц DDR)</text>
  <text x="710" y="238" text-anchor="middle" font-size="12" fill="#2457d6">Прискорення інференсу TinyML та потоку кадру</text>

  <rect x="515" y="265" width="390" height="140" fill="#ffffff" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="710" y="288" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Вбудований USB CDC / JTAG Controller</text>
  <text x="710" y="308" text-anchor="middle" font-size="12" fill="#1a1a1a">Пряме підключення D- / D+ (GPIO19 / GPIO20)</text>
  <text x="710" y="328" text-anchor="middle" font-size="12" fill="#27ae60">Апаратне JTAG-налагодження без занурення</text>
  <text x="710" y="348" text-anchor="middle" font-size="12" fill="#27ae60">Віртуальний послідовний порт CDC без UART-моста</text>
  <text x="710" y="385" text-anchor="middle" font-size="12" fill="#6b7280">Зменшення розмірів плат (SuperMini / Zero)</text>

  <!-- Bottom Summary Banner -->
  <rect x="40" y="435" width="880" height="45" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <rect x="55" y="443" width="165" height="28" fill="#2457d6" rx="4"/>
  <text x="137" y="462" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">КЛЮЧОВИЙ ЕФЕКТ</text>
  <text x="235" y="453" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">Подвоєна ширина шини (8 біт OPI) гарантує плавну роботу алгоритмів комп'ютерного зору,</text>
  <text x="235" y="471" text-anchor="start" font-size="12" fill="#1a1a1a">а вбудований контролер USB здешевлює плати та спрощує розробку через єдиний роз'єм Type-C.</text>
</svg>
