<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схемотехніка підключення USB в ESP32-S3: Нативний USB CDC/JTAG проти USB-to-UART</text>
  <text x="480" y="48" text-anchor="middle" font-size="13" fill="#6b7280">Пряме підключення диференційної пари D+/D- до GPIO19/GPIO20 усуває потребу у зовнішньому мості UART</text>

  <!-- ================= LEFT PANEL: TRADITIONAL USB-TO-UART ================= -->
  <rect x="25" y="65" width="440" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Header Badge Left -->
  <rect x="40" y="80" width="410" height="30" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="245" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Класичне підключення (Зовнішній міст USB-to-UART)</text>

  <!-- USB Connector Box Left -->
  <rect x="40" y="135" width="95" height="220" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="87" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">USB Type-C</text>
  <text x="87" y="176" text-anchor="middle" font-size="11" fill="#6b7280">Роз'єм</text>

  <rect x="48" y="195" width="79" height="145" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="87" y="215" text-anchor="middle" font-size="11" fill="#1a1a1a">VBUS (5V)</text>
  <text x="87" y="244" text-anchor="middle" font-size="11" fill="#c0392b">D-</text>
  <text x="87" y="274" text-anchor="middle" font-size="11" fill="#c0392b">D+</text>
  <text x="87" y="310" text-anchor="middle" font-size="11" fill="#1a1a1a">GND</text>

  <!-- External Bridge IC Box -->
  <rect x="180" y="135" width="130" height="220" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="245" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Міст USB-UART</text>
  <text x="245" y="176" text-anchor="middle" font-size="11" fill="#6b7280">(CP2102 / CH340)</text>

  <rect x="188" y="195" width="114" height="65" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="245" y="213" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Конвертер сигналів</text>
  <text x="245" y="229" text-anchor="middle" font-size="10.5" fill="#1a1a1a">USB PHY -> UART</text>
  <text x="245" y="244" text-anchor="middle" font-size="10.5" fill="#6b7280">(TXD, RXD)</text>

  <rect x="188" y="270" width="114" height="70" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="245" y="288" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Auto-Reset Схема</text>
  <text x="245" y="304" text-anchor="middle" font-size="10.5" fill="#1a1a1a">2× Транзистори</text>
  <text x="245" y="320" text-anchor="middle" font-size="10.5" fill="#6b7280">(DTR / RTS -> EN/IO0)</text>

  <!-- ESP32 SoC Box Left -->
  <rect x="355" y="135" width="95" height="220" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="402" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">ESP32 SoC</text>
  <text x="402" y="176" text-anchor="middle" font-size="11" fill="#6b7280">UART0 Port</text>

  <rect x="363" y="195" width="79" height="145" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="402" y="215" text-anchor="middle" font-size="11" fill="#1a1a1a">RXD0 (IO44)</text>
  <text x="402" y="244" text-anchor="middle" font-size="11" fill="#1a1a1a">TXD0 (IO43)</text>
  <line x1="368" y1="265" x2="436" y2="265" stroke="#d0d7de" stroke-dasharray="2,2"/>
  <text x="402" y="285" text-anchor="middle" font-size="10.5" fill="#6b7280">EN (Reset)</text>
  <text x="402" y="310" text-anchor="middle" font-size="10.5" fill="#6b7280">GPIO0 (Boot)</text>

  <!-- Lines Left Panel -->
  <line x1="127" y1="240" x2="180" y2="240" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="127" y1="270" x2="180" y2="270" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="153" y="231" text-anchor="middle" font-size="10.5" font-weight="bold" fill="#c0392b">D-/D+</text>

  <line x1="302" y1="210" x2="355" y2="210" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <line x1="302" y1="240" x2="355" y2="240" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="328" y="202" text-anchor="middle" font-size="10.5" fill="#1a1a1a">UART</text>

  <line x1="302" y1="295" x2="355" y2="295" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-gray)"/>
  <text x="328" y="287" text-anchor="middle" font-size="10" fill="#6b7280">Reset</text>

  <!-- Bottom Badge Left Panel -->
  <rect x="40" y="388" width="410" height="42" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="245" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Потребує окрему мікросхему моста та транзистори</text>
  <text x="245" y="421" text-anchor="middle" font-size="11" fill="#1a1a1a">Відсутнє апаратне JTAG-налагодження через USB</text>


  <!-- ================= RIGHT PANEL: NATIVE ESP32-S3 USB CDC/JTAG ================= -->
  <rect x="495" y="65" width="440" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Header Badge Right -->
  <rect x="510" y="80" width="410" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="715" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Нативне підключення ESP32-S3 (Direct USB CDC/JTAG)</text>

  <!-- USB Connector Box Right -->
  <rect x="515" y="135" width="110" height="220" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="570" y="158" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">USB Type-C</text>
  <text x="570" y="176" text-anchor="middle" font-size="11" fill="#6b7280">Роз'єм</text>

  <rect x="523" y="195" width="94" height="145" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="570" y="215" text-anchor="middle" font-size="11" fill="#1a1a1a">VBUS (5V)</text>
  <text x="570" y="244" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">D- (USBDN)</text>
  <text x="570" y="284" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">D+ (USBDP)</text>
  <text x="570" y="324" text-anchor="middle" font-size="11" fill="#1a1a1a">GND</text>

  <!-- ESP32-S3 Microcontroller Box Right -->
  <rect x="730" y="135" width="190" height="220" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="825" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">ESP32-S3 SoC</text>

  <!-- Internal Controller Block -->
  <rect x="742" y="172" width="166" height="50" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="825" y="190" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Вбудований USB-контролер</text>
  <text x="825" y="206" text-anchor="middle" font-size="11" fill="#1a1a1a">Hardware CDC-UART + JTAG</text>

  <!-- Internal Pins Box -->
  <rect x="742" y="230" width="166" height="115" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="825" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Виводи USB PHY:</text>
  <text x="825" y="267" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">GPIO19 — USB_D-</text>
  <text x="825" y="286" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">GPIO20 — USB_D+</text>
  <line x1="750" y1="298" x2="900" y2="298" stroke="#d0d7de" stroke-dasharray="2,2"/>
  <text x="825" y="315" text-anchor="middle" font-size="10.5" fill="#27ae60">Автоматичний прошивковий скид</text>
  <text x="825" y="330" text-anchor="middle" font-size="10.5" fill="#27ae60">(без схемотехніки DTR/RTS)</text>

  <!-- Differential Pair Lines Right Panel -->
  <line x1="625" y1="240" x2="730" y2="240" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="677" y="231" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">D- (GPIO19)</text>

  <line x1="625" y1="280" x2="730" y2="280" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="677" y="271" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">D+ (GPIO20)</text>

  <!-- Diff Pair Badge -->
  <rect x="635" y="296" width="85" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="0.8"/>
  <text x="677" y="310" text-anchor="middle" font-size="10" fill="#2457d6">Diff Pair 90 Ом</text>

  <!-- Bottom Badge Right Panel -->
  <rect x="510" y="388" width="410" height="42" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="715" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Пряме підключення до USB без зовнішніх конвертерів</text>
  <text x="715" y="421" text-anchor="middle" font-size="11" fill="#1a1a1a">CDC консоль + повноцінне JTAG налагодження (OpenOCD)</text>
</svg>
