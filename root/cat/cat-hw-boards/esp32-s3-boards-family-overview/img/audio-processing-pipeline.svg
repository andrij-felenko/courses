<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="960" height="490" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="490" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="36" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Конвеєр обробки аудіосигналу TinyML на ESP32-S3</text>
  <text x="480" y="58" font-size="13" text-anchor="middle" fill="#6b7280">Трансформація неперервного I2S-потоку через DMA у двовимірну лог-мел спектрограму</text>

  <!-- =================ЕТАП 1: I2S Вхід================= -->
  <rect x="35" y="85" width="162" height="30" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="116" y="105" font-size="13" font-weight="700" text-anchor="middle" fill="#2457d6">1. I2S Вхід</text>
  
  <rect x="35" y="123" width="162" height="342" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Суб-блок 1.1: Давач -->
  <rect x="45" y="135" width="142" height="55" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="116" y="156" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">I2S-мікрофон</text>
  <text x="116" y="176" font-size="12" text-anchor="middle" fill="#6b7280">INMP441 / SPM1423</text>

  <line x1="116" y1="190" x2="116" y2="206" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Суб-блок 1.2: Сигнал -->
  <rect x="45" y="214" width="142" height="110" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="116" y="234" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Сигнал x[n]</text>
  <path d="M55,268 Q67,248 80,268 T105,268 T130,268 T155,268 T177,268" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <text x="116" y="308" font-size="12" text-anchor="middle" fill="#6b7280">f_s = 16 kHz, 16-bit</text>

  <line x1="116" y1="324" x2="116" y2="340" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Суб-блок 1.3: Шина -->
  <rect x="45" y="348" width="142" height="105" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="116" y="368" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">I2S Периферія</text>
  <text x="116" y="388" font-size="12" text-anchor="middle" fill="#1a1a1a">BCLK, WS, SD</text>
  <text x="116" y="422" font-size="12" text-anchor="middle" fill="#6b7280">Прямий потік</text>
  <text x="116" y="440" font-size="12" text-anchor="middle" fill="#6b7280">у DMA-буфери</text>

  <!-- Стрілка Етап 1 -> Етап 2 -->
  <line x1="197" y1="400" x2="211" y2="400" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- =================ЕТАП 2: DMA-буфери================= -->
  <rect x="217" y="85" width="162" height="30" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="298" y="105" font-size="13" font-weight="700" text-anchor="middle" fill="#2457d6">2. DMA-буфери</text>

  <rect x="217" y="123" width="162" height="342" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Суб-блок 2.1: Концепція -->
  <rect x="227" y="135" width="142" height="55" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="298" y="156" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Ping-Pong DMA</text>
  <text x="298" y="176" font-size="12" text-anchor="middle" fill="#6b7280">Безперервний вхід</text>

  <line x1="298" y1="190" x2="298" y2="206" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Суб-блок 2.2: Буфер B1 -->
  <rect x="227" y="214" width="142" height="110" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="298" y="234" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">Буфер B_1 (Запис)</text>
  <text x="298" y="254" font-size="12" text-anchor="middle" fill="#1a1a1a">DMA заповнює</text>
  <!-- Елементи пам'яті B1 -->
  <rect x="249" y="266" width="20" height="18" fill="#2457d6" rx="2"/>
  <rect x="273" y="266" width="20" height="18" fill="#2457d6" rx="2"/>
  <rect x="297" y="266" width="20" height="18" fill="#eaf0fd" stroke="#2457d6" rx="2"/>
  <rect x="321" y="266" width="20" height="18" fill="#eaf0fd" stroke="#2457d6" rx="2"/>
  <text x="298" y="308" font-size="12" text-anchor="middle" fill="#6b7280">Активний вхід</text>

  <line x1="298" y1="324" x2="298" y2="340" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Суб-блок 2.3: Буфер B2 -->
  <rect x="227" y="348" width="142" height="105" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="298" y="368" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">Буфер B_2 (Готовий)</text>
  <text x="298" y="388" font-size="12" text-anchor="middle" fill="#1a1a1a">Передача на DSP</text>
  <!-- Елементи пам'яті B2 -->
  <rect x="249" y="398" width="20" height="18" fill="#27ae60" rx="2"/>
  <rect x="273" y="398" width="20" height="18" fill="#27ae60" rx="2"/>
  <rect x="297" y="398" width="20" height="18" fill="#27ae60" rx="2"/>
  <rect x="321" y="398" width="20" height="18" fill="#27ae60" rx="2"/>
  <text x="298" y="440" font-size="12" text-anchor="middle" fill="#6b7280">Обробка в CPU</text>

  <!-- Стрілка Етап 2 -> Етап 3 -->
  <line x1="379" y1="400" x2="393" y2="400" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- =================ЕТАП 3: Фреймування================= -->
  <rect x="399" y="85" width="162" height="30" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="105" font-size="13" font-weight="700" text-anchor="middle" fill="#2457d6">3. Фреймування</text>

  <rect x="399" y="123" width="162" height="342" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Суб-блок 3.1: Параметри -->
  <rect x="409" y="135" width="142" height="75" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="480" y="156" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Ковзне вікно</text>
  <text x="480" y="176" font-size="12" text-anchor="middle" fill="#1a1a1a">Розмір N = 512</text>
  <text x="480" y="196" font-size="12" text-anchor="middle" fill="#6b7280">Крок H = 160 (Hop)</text>

  <line x1="480" y1="210" x2="480" y2="226" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Суб-блок 3.2: Віконна функція -->
  <rect x="409" y="234" width="142" height="98" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="480" y="254" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Множення на w[n]</text>
  <text x="480" y="272" font-size="12" text-anchor="middle" fill="#6b7280">Вікно Хеммінга</text>
  <path d="M424,308 Q480,278 536,308" fill="none" stroke="#2457d6" stroke-width="2"/>
  <line x1="420" y1="308" x2="540" y2="308" stroke="#6b7280" stroke-width="1"/>
  <text x="480" y="322" font-size="12" text-anchor="middle" fill="#1a1a1a">x_w[n] = x[n] · w[n]</text>

  <line x1="480" y1="332" x2="480" y2="348" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Суб-блок 3.3: Результат фрейму -->
  <rect x="409" y="356" width="142" height="97" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="480" y="376" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">Фрейм аудіо</text>
  <text x="480" y="396" font-size="12" text-anchor="middle" fill="#1a1a1a">512 відліків</text>
  <text x="480" y="428" font-size="12" text-anchor="middle" fill="#6b7280">Підготовка</text>
  <text x="480" y="444" font-size="12" text-anchor="middle" fill="#6b7280">до FFT</text>

  <!-- Стрілка Етап 3 -> Етап 4 -->
  <line x1="561" y1="400" x2="575" y2="400" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- =================ЕТАП 4: FFT & Мел================= -->
  <rect x="581" y="85" width="162" height="30" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="662" y="105" font-size="13" font-weight="700" text-anchor="middle" fill="#2457d6">4. FFT &amp; Мел</text>

  <rect x="581" y="123" width="162" height="342" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Суб-блок 4.1: FFT -->
  <rect x="591" y="135" width="142" height="95" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="662" y="156" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">512-pt RFFT</text>
  <text x="662" y="176" font-size="12" text-anchor="middle" fill="#2457d6">Прискорення PIE</text>
  <text x="662" y="196" font-size="12" text-anchor="middle" fill="#6b7280">ESP-DSP бібліотека</text>
  <text x="662" y="218" font-size="12" text-anchor="middle" fill="#1a1a1a">Спектр |X[k]|^2</text>

  <line x1="662" y1="230" x2="662" y2="246" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Суб-блок 4.2: Фільтри Мела -->
  <rect x="591" y="254" width="142" height="98" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="662" y="274" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Фільтри Мела</text>
  <!-- Трикутники Мел-фільтрів -->
  <polygon points="605,316 625,290 645,316" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <polygon points="630,316 650,290 670,316" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <polygon points="655,316 675,290 695,316" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <polygon points="680,316 700,290 720,316" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="600" y1="316" x2="724" y2="316" stroke="#6b7280" stroke-width="1"/>
  <text x="662" y="338" font-size="12" text-anchor="middle" fill="#6b7280">M = 40–64 банків</text>

  <line x1="662" y1="352" x2="662" y2="368" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Суб-блок 4.3: Логарифмування -->
  <rect x="591" y="376" width="142" height="77" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="662" y="396" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">Логарифмування</text>
  <text x="662" y="416" font-size="12" text-anchor="middle" fill="#1a1a1a">E_m = log(∑|X|² · M)</text>
  <text x="662" y="440" font-size="12" text-anchor="middle" fill="#6b7280">Лог-енергія Мел</text>

  <!-- Стрілка Етап 4 -> Етап 5 -->
  <line x1="743" y1="400" x2="757" y2="400" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- =================ЕТАП 5: Спектрограма================= -->
  <rect x="763" y="85" width="162" height="30" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="844" y="105" font-size="13" font-weight="700" text-anchor="middle" fill="#27ae60">5. Спектрограма</text>

  <rect x="763" y="123" width="162" height="342" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Суб-блок 5.1: 2D Масив -->
  <rect x="773" y="135" width="142" height="135" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="844" y="154" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Спектрограма</text>
  <text x="844" y="172" font-size="12" text-anchor="middle" fill="#6b7280">Масив S[m, t]</text>

  <!-- 2D Спектрограма Сетка -->
  <!-- Рядок 1 (y=182) -->
  <rect x="795" y="182" width="16" height="12" fill="#2457d6" rx="1"/>
  <rect x="814" y="182" width="16" height="12" fill="#eaf0fd" stroke="#2457d6" stroke-width="0.5" rx="1"/>
  <rect x="833" y="182" width="16" height="12" fill="#27ae60" rx="1"/>
  <rect x="852" y="182" width="16" height="12" fill="#2457d6" rx="1"/>
  <rect x="871" y="182" width="16" height="12" fill="#eaf0fd" stroke="#2457d6" stroke-width="0.5" rx="1"/>

  <!-- Рядок 2 (y=197) -->
  <rect x="795" y="197" width="16" height="12" fill="#e9f7ef" stroke="#27ae60" stroke-width="0.5" rx="1"/>
  <rect x="814" y="197" width="16" height="12" fill="#27ae60" rx="1"/>
  <rect x="833" y="197" width="16" height="12" fill="#2457d6" rx="1"/>
  <rect x="852" y="197" width="16" height="12" fill="#eaf0fd" stroke="#2457d6" stroke-width="0.5" rx="1"/>
  <rect x="871" y="197" width="16" height="12" fill="#27ae60" rx="1"/>

  <!-- Рядок 3 (y=212) -->
  <rect x="795" y="212" width="16" height="12" fill="#eaf0fd" stroke="#2457d6" stroke-width="0.5" rx="1"/>
  <rect x="814" y="212" width="16" height="12" fill="#2457d6" rx="1"/>
  <rect x="833" y="212" width="16" height="12" fill="#eaf0fd" stroke="#2457d6" stroke-width="0.5" rx="1"/>
  <rect x="852" y="212" width="16" height="12" fill="#27ae60" rx="1"/>
  <rect x="871" y="212" width="16" height="12" fill="#2457d6" rx="1"/>

  <text x="844" y="242" font-size="12" text-anchor="middle" fill="#1a1a1a">Ознаки M × T</text>
  <text x="844" y="258" font-size="12" text-anchor="middle" fill="#6b7280">двовимірний тензор</text>

  <line x1="844" y1="270" x2="844" y2="286" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Суб-блок 5.2: heap_caps -->
  <rect x="773" y="294" width="142" height="60" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="844" y="314" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Виділення heap_caps</text>
  <text x="844" y="334" font-size="12" text-anchor="middle" fill="#6b7280">MALLOC_CAP_INTERNAL</text>

  <line x1="844" y1="354" x2="844" y2="370" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Суб-блок 5.3: Нейромережа -->
  <rect x="773" y="378" width="142" height="75" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="844" y="398" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">TFLite / ESP-NN</text>
  <text x="844" y="418" font-size="12" text-anchor="middle" fill="#1a1a1a">Нейромережа</text>
  <text x="844" y="438" font-size="12" text-anchor="middle" fill="#6b7280">Класифікація / KWS</text>
</svg>
