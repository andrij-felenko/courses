<svg width="960" height="540" viewBox="0 0 960 540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Топологія шин пам'яті ESP32-S3: Quad SPI проти Octal SPI</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Шина Octal SPI (8 біт) задіює виводи GPIO33–GPIO37, тоді як Quad SPI (4 біти) залишає їх вільними</text>

  <!-- LEFT PANEL: Quad SPI Topology -->
  <rect x="25" y="80" width="445" height="435" rx="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  
  <!-- Left Panel Header Badge -->
  <rect x="40" y="95" width="415" height="36" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="247.5" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#2457d6">Режим Quad SPI (QSPI — 4 біти даних)</text>

  <!-- Left Panel: ESP32-S3 SoC Block -->
  <rect x="45" y="150" width="145" height="215" rx="8" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="117.5" y="173" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">ESP32-S3 SoC</text>
  <text x="117.5" y="192" text-anchor="middle" font-size="11" fill="#6b7280">Xtensa LX7 (Dual-Core)</text>
  
  <!-- SoC Inner Block 1: SPI Controller -->
  <rect x="53" y="208" width="129" height="40" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="117.5" y="233" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">SPI1/SPI2 Controller</text>

  <!-- SoC Inner Block 2: Free GPIOs -->
  <rect x="53" y="262" width="129" height="92" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="117.5" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Вільні GPIO</text>
  <text x="117.5" y="298" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">GPIO33, GPIO34</text>
  <text x="117.5" y="315" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">GPIO35, GPIO36, 37</text>
  <text x="117.5" y="338" text-anchor="middle" font-size="10" fill="#27ae60">(Виведені на PIN)</text>

  <!-- Left Panel: QSPI Memory Block -->
  <rect x="310" y="150" width="145" height="215" rx="8" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="382.5" y="173" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Пам'ять QSPI</text>
  <text x="382.5" y="192" text-anchor="middle" font-size="11" fill="#6b7280">(SiP або Discrete)</text>

  <!-- Memory Inner Block 1: Flash -->
  <rect x="318" y="208" width="129" height="60" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="382.5" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Quad NOR Flash</text>
  <text x="382.5" y="252" text-anchor="middle" font-size="11" fill="#6b7280">4-біт шина (QSPI)</text>

  <!-- Memory Inner Block 2: PSRAM -->
  <rect x="318" y="282" width="129" height="60" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="382.5" y="306" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Quad PSRAM</text>
  <text x="382.5" y="326" text-anchor="middle" font-size="11" fill="#6b7280">4-біт шина (QSPI)</text>

  <!-- Connecting Lines QSPI -->
  <line x1="190" y1="220" x2="310" y2="220" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="250" y="210" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">CS, CLK (2 лінії)</text>

  <line x1="190" y1="248" x2="310" y2="248" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>
  <text x="250" y="265" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">D0–D3 (4 біти)</text>

  <!-- Left Panel: Bottom Summary Box -->
  <rect x="40" y="380" width="415" height="120" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="247.5" y="403" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">✔ Доступно +5 контактів GPIO</text>
  <text x="55" y="426" text-anchor="start" font-size="12" fill="#1a1a1a">• GPIO33–GPIO37 повністю вільні від шини пам'яті</text>
  <text x="55" y="448" text-anchor="start" font-size="12" fill="#1a1a1a">• Можуть використовуватись для ADC, I2C, SPI, UART, PWM</text>
  <text x="55" y="470" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">• Оптимально для пристроїв із великою кількістю периферії</text>


  <!-- RIGHT PANEL: Octal SPI Topology -->
  <rect x="490" y="80" width="445" height="435" rx="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  
  <!-- Right Panel Header Badge -->
  <rect x="505" y="95" width="415" height="36" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="712.5" y="118" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">Режим Octal SPI (OSPI — 8 біт даних)</text>

  <!-- Right Panel: ESP32-S3 SoC Block -->
  <rect x="510" y="150" width="145" height="215" rx="8" fill="white" stroke="#c0392b" stroke-width="1.5"/>
  <text x="582.5" y="173" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">ESP32-S3 SoC</text>
  <text x="582.5" y="192" text-anchor="middle" font-size="11" fill="#6b7280">Xtensa LX7 (Dual-Core)</text>
  
  <!-- SoC Inner Block 1: Octal SPI Controller -->
  <rect x="518" y="208" width="129" height="40" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="582.5" y="233" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Octal SPI Controller</text>

  <!-- SoC Inner Block 2: Busy GPIOs -->
  <rect x="518" y="262" width="129" height="92" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="582.5" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Зайняті GPIO</text>
  <text x="582.5" y="298" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">GPIO33..36 (D4..D7)</text>
  <text x="582.5" y="318" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">GPIO37 (DQS)</text>
  <text x="582.5" y="338" text-anchor="middle" font-size="10" fill="#c0392b">(Зайняті OSPI)</text>

  <!-- Right Panel: OSPI Memory Block -->
  <rect x="775" y="150" width="145" height="215" rx="8" fill="white" stroke="#c0392b" stroke-width="1.5"/>
  <text x="847.5" y="173" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Пам'ять OSPI</text>
  <text x="847.5" y="192" text-anchor="middle" font-size="11" fill="#6b7280">(SiP або Discrete)</text>

  <!-- Memory Inner Block 1: Octal Flash -->
  <rect x="783" y="208" width="129" height="60" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="847.5" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Octal NOR Flash</text>
  <text x="847.5" y="252" text-anchor="middle" font-size="11" fill="#6b7280">8-біт шина (OSPI)</text>

  <!-- Memory Inner Block 2: Octal PSRAM -->
  <rect x="783" y="282" width="129" height="60" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="847.5" y="306" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Octal PSRAM (OPI)</text>
  <text x="847.5" y="326" text-anchor="middle" font-size="11" fill="#6b7280">Висока швидкість</text>

  <!-- Connecting Lines OSPI -->
  <line x1="655" y1="215" x2="775" y2="215" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="715" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">CS, CLK, DQS</text>

  <line x1="655" y1="245" x2="775" y2="245" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="715" y="260" text-anchor="middle" font-size="11" fill="#2457d6">D0–D3 (4 біти)</text>

  <line x1="655" y1="285" x2="775" y2="285" stroke="#c0392b" stroke-width="3" stroke-dasharray="4,2" marker-end="url(#arr-red)"/>
  <text x="715" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">D4–D7 (GPIO33–36)</text>

  <!-- Right Panel: Bottom Summary Box -->
  <rect x="505" y="380" width="415" height="120" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="712.5" y="403" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">✖ Виводи GPIO33–GPIO37 ЗАРЕЗЕРВОВАНІ</text>
  <text x="520" y="426" text-anchor="start" font-size="12" fill="#1a1a1a">• GPIO33–GPIO36 використовуються для ліній даних D4–D7</text>
  <text x="520" y="448" text-anchor="start" font-size="12" fill="#1a1a1a">• GPIO37 відповідає за сигнал стробування даних DQS</text>
  <text x="520" y="470" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">• Максимальна пропускна здатність, але менше вільних GPIO</text>

</svg>
