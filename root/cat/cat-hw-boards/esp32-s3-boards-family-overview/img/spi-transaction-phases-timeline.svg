<svg viewBox="0 0 960 575" width="960" height="575" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="960" height="575" fill="white"/>
  <defs>
    <marker id="arr-right" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-left" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red-right" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-red-left" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green-right" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-green-left" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма фаз транзакції Quad та Octal SPI</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Розширення шини до 8 біт скорочує накладні витрати t_overhead та збільшує ефективність обміну η</text>

  <!-- Legend Panel -->
  <rect x="40" y="75" width="880" height="40" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  
  <rect x="55" y="87" width="16" height="16" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="78" y="100" font-size="12" fill="#1a1a1a">Накладні витрати (CMD+ADDR+DUMMY)</text>

  <rect x="340" y="87" width="16" height="16" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="363" y="100" font-size="12" fill="#1a1a1a">Корисне навантаження (DATA)</text>

  <text x="590" y="100" font-size="12" font-weight="bold" fill="#2457d6">Ефективність шини: η = t_data / T_total</text>

  <!-- Panel 1: Quad SPI -->
  <rect x="40" y="130" width="880" height="185" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  
  <text x="55" y="153" font-size="14" font-weight="bold" fill="#1a1a1a">1. Quad SPI (QSPI / 4-бітна шина)</text>
  <text x="320" y="153" font-size="12" fill="#6b7280">(Режим SDR / 4 лінії DQ0..DQ3)</text>

  <!-- Signal Labels Panel 1 -->
  <text x="55" y="188" font-size="12" font-weight="bold" fill="#1a1a1a">CLK</text>
  <text x="55" y="208" font-size="12" fill="#6b7280">CS#</text>
  <text x="55" y="228" font-size="12" font-weight="bold" fill="#1a1a1a">DQ0..DQ3</text>

  <!-- Signal Guide Lines Panel 1 -->
  <line x1="140" y1="175" x2="140" y2="240" stroke="#d0d7de" stroke-dasharray="2 2" stroke-width="1"/>
  <line x1="160" y1="175" x2="160" y2="295" stroke="#d0d7de" stroke-dasharray="2 2" stroke-width="1"/>
  <line x1="464" y1="175" x2="464" y2="270" stroke="#d0d7de" stroke-dasharray="2 2" stroke-width="1"/>
  <line x1="890" y1="175" x2="890" y2="295" stroke="#d0d7de" stroke-dasharray="2 2" stroke-width="1"/>

  <!-- Phase Blocks Panel 1 -->
  <!-- CMD Phase -->
  <rect x="160" y="175" width="80" height="65" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="200" y="196" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">CMD</text>
  <text x="200" y="212" font-size="12" fill="#6b7280" text-anchor="middle">8 тактів</text>
  <text x="200" y="226" font-size="12" fill="#6b7280" text-anchor="middle">(1 біт/т)</text>

  <!-- ADDR Phase -->
  <rect x="252" y="175" width="100" height="65" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="302" y="196" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">ADDR</text>
  <text x="302" y="212" font-size="12" fill="#6b7280" text-anchor="middle">32 біти</text>
  <text x="302" y="226" font-size="12" fill="#6b7280" text-anchor="middle">(8 тактів)</text>

  <!-- DUMMY Phase -->
  <rect x="364" y="175" width="100" height="65" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="414" y="196" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">DUMMY</text>
  <text x="414" y="212" font-size="12" fill="#c0392b" text-anchor="middle">Затримка</text>
  <text x="414" y="226" font-size="12" fill="#c0392b" text-anchor="middle">(8 тактів)</text>

  <!-- DATA Phase -->
  <rect x="476" y="175" width="414" height="65" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="683" y="196" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">DATA (Payload)</text>
  <text x="683" y="212" font-size="12" fill="#27ae60" text-anchor="middle">32 байти (256 біт)</text>
  <text x="683" y="226" font-size="12" fill="#27ae60" text-anchor="middle">(64 такти обміну)</text>

  <!-- Panel 1 Dimensions -->
  <!-- Overhead dimension -->
  <line x1="160" y1="260" x2="464" y2="260" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 2"/>
  <line x1="160" y1="257" x2="160" y2="263" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="464" y1="257" x2="464" y2="263" stroke="#c0392b" stroke-width="1.5"/>
  <text x="312" y="253" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">t_overhead = 24 такти (27%)</text>

  <!-- Data dimension -->
  <line x1="476" y1="260" x2="890" y2="260" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4 2"/>
  <line x1="476" y1="257" x2="476" y2="263" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="890" y1="257" x2="890" y2="263" stroke="#27ae60" stroke-width="1.5"/>
  <text x="683" y="253" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">t_data = 64 такти (73%)</text>

  <!-- Total dimension -->
  <line x1="160" y1="288" x2="890" y2="288" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-left)" marker-end="url(#arr-right)"/>
  <text x="525" y="282" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">T_total = 88 тактів (Ефективність η = 73%)</text>


  <!-- Panel 2: Octal SPI -->
  <rect x="40" y="330" width="880" height="185" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  
  <text x="55" y="353" font-size="14" font-weight="bold" fill="#1a1a1a">2. Octal SPI (OSPI / 8-бітна шина)</text>
  <text x="330" y="353" font-size="12" fill="#6b7280">(Режим SDR / DDR / 8 ліній DQ0..DQ7)</text>

  <!-- Signal Labels Panel 2 -->
  <text x="55" y="388" font-size="12" font-weight="bold" fill="#1a1a1a">CLK</text>
  <text x="55" y="408" font-size="12" fill="#6b7280">CS#</text>
  <text x="55" y="428" font-size="12" font-weight="bold" fill="#1a1a1a">DQ0..DQ7</text>

  <!-- Signal Guide Lines Panel 2 -->
  <line x1="140" y1="375" x2="140" y2="440" stroke="#d0d7de" stroke-dasharray="2 2" stroke-width="1"/>
  <line x1="160" y1="375" x2="160" y2="495" stroke="#d0d7de" stroke-dasharray="2 2" stroke-width="1"/>
  <line x1="344" y1="375" x2="344" y2="470" stroke="#d0d7de" stroke-dasharray="2 2" stroke-width="1"/>
  <line x1="560" y1="375" x2="560" y2="495" stroke="#d0d7de" stroke-dasharray="2 2" stroke-width="1"/>

  <!-- Phase Blocks Panel 2 -->
  <!-- CMD Phase -->
  <rect x="160" y="375" width="40" height="65" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="180" y="413" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">CMD</text>

  <!-- ADDR Phase -->
  <rect x="212" y="375" width="55" height="65" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="239" y="405" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ADDR</text>
  <text x="239" y="421" font-size="12" fill="#6b7280" text-anchor="middle">4 такти</text>

  <!-- DUMMY Phase -->
  <rect x="279" y="375" width="65" height="65" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="311" y="405" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">DUMMY</text>
  <text x="311" y="421" font-size="12" fill="#c0392b" text-anchor="middle">6 тактів</text>

  <!-- DATA Phase -->
  <rect x="356" y="375" width="204" height="65" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="458" y="396" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">DATA (Payload)</text>
  <text x="458" y="412" font-size="12" fill="#27ae60" text-anchor="middle">32 байти (256 біт)</text>
  <text x="458" y="426" font-size="12" fill="#27ae60" text-anchor="middle">(32 такти обміну)</text>

  <!-- Saved Time / Optimization Box -->
  <rect x="572" y="375" width="318" height="65" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="731" y="400" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Свобода шини / Економія часу</text>
  <text x="731" y="418" font-size="12" fill="#1a1a1a" text-anchor="middle">Заощаджено 44 такти (в 2.0× швидше)</text>

  <!-- Panel 2 Dimensions -->
  <!-- Overhead dimension -->
  <line x1="160" y1="460" x2="344" y2="460" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 2"/>
  <line x1="160" y1="457" x2="160" y2="463" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="344" y1="457" x2="344" y2="463" stroke="#c0392b" stroke-width="1.5"/>
  <text x="252" y="453" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">t_overhead = 12 тактів</text>

  <!-- Data dimension -->
  <line x1="356" y1="460" x2="560" y2="460" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4 2"/>
  <line x1="356" y1="457" x2="356" y2="463" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="560" y1="457" x2="560" y2="463" stroke="#27ae60" stroke-width="1.5"/>
  <text x="458" y="453" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">t_data = 32 такти (73%)</text>

  <!-- Total dimension -->
  <line x1="160" y1="488" x2="560" y2="488" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-left)" marker-end="url(#arr-right)"/>
  <text x="360" y="482" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">T_total = 44 такти (Ефективність η = 73%)</text>

  <!-- Bottom Summary Panel -->
  <rect x="40" y="527" width="880" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="545" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Висновок: Octal SPI зменшує абсолютний час транзакції T_total удвічі при однаковому обсязі даних, вивільняючи шину</text>
</svg>
