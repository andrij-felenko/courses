<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Часова розкладка транзакції зчитування L1-кешу (32 B) в SDR: Quad SPI vs Octal SPI</text>
  <text x="480" y="54" font-size="13" font-weight="400" text-anchor="middle" fill="#6b7280">Розширення шини до 8 біт скорочує фазу даних і затримку t_miss майже вдвічі при однакових тактах очікування</text>

  <!-- Панель 1: Quad SPI SDR -->
  <rect x="30" y="75" width="900" height="155" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="45" y="98" font-size="15" font-weight="700" fill="#1a1a1a">Quad SPI SDR (4 лінії даних IO0–IO3 | 1 такт = 4 біти)</text>
  <text x="915" y="98" font-size="13" font-weight="700" text-anchor="end" fill="#c0392b">Загалом: 86 тактів (t_miss)</text>

  <!-- Позначка ліній -->
  <text x="45" y="146" font-size="13" font-weight="700" fill="#1a1a1a">Фази шини:</text>

  <!-- Блоки фаз Quad SPI -->
  <!-- CMD: 8 тактів -->
  <rect x="180" y="120" width="65" height="44" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5" rx="4"/>
  <text x="212.5" y="139" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">CMD</text>
  <text x="212.5" y="153" font-size="12" text-anchor="middle" fill="#4b5563">8 тактів</text>

  <!-- ADDR: 8 тактів -->
  <rect x="249" y="120" width="65" height="44" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5" rx="4"/>
  <text x="281.5" y="139" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">ADDR</text>
  <text x="281.5" y="153" font-size="12" text-anchor="middle" fill="#4b5563">8 тактів</text>

  <!-- DUMMY: 6 тактів -->
  <rect x="318" y="120" width="55" height="44" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="4"/>
  <text x="345.5" y="139" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">DUMMY</text>
  <text x="345.5" y="153" font-size="12" text-anchor="middle" fill="#c0392b">6 тактів</text>

  <!-- DATA: 64 такти -->
  <rect x="377" y="120" width="503" height="44" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="628.5" y="139" font-size="13" font-weight="700" text-anchor="middle" fill="#2457d6">DATA (32 B = 256 біт)</text>
  <text x="628.5" y="155" font-size="12" text-anchor="middle" fill="#2457d6">64 такти шини (4 біти / такт)</text>

  <!-- Підписи дужок Quad SPI -->
  <line x1="180" y1="174" x2="373" y2="174" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="180" y1="170" x2="180" y2="178" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="373" y1="170" x2="373" y2="178" stroke="#c0392b" stroke-width="1.5"/>
  <text x="276.5" y="193" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">Накладні витрати: 22 такти (25.6%)</text>
  <text x="276.5" y="209" font-size="12" text-anchor="middle" fill="#6b7280">N_cmd + N_addr + N_dummy</text>

  <line x1="377" y1="174" x2="880" y2="174" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="377" y1="170" x2="377" y2="178" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="880" y1="170" x2="880" y2="178" stroke="#2457d6" stroke-width="1.5"/>
  <text x="628.5" y="193" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">Передача даних: 64 такти (74.4%)</text>
  <text x="628.5" y="209" font-size="12" text-anchor="middle" fill="#6b7280">256 біт / 4 біти за такт (N_data)</text>

  <!-- Панель 2: Octal SPI SDR -->
  <rect x="30" y="245" width="900" height="155" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="45" y="268" font-size="15" font-weight="700" fill="#1a1a1a">Octal SPI SDR (8 ліній даних IO0–IO7 | 1 такт = 8 біт)</text>
  <text x="915" y="268" font-size="13" font-weight="700" text-anchor="end" fill="#27ae60">Загалом: 44 такти (t_miss) — Прискорення 1.95×</text>

  <!-- Позначка ліній -->
  <text x="45" y="316" font-size="13" font-weight="700" fill="#1a1a1a">Фази шини:</text>

  <!-- Блоки фаз Octal SPI -->
  <!-- CMD: 2 такти -->
  <rect x="180" y="290" width="45" height="44" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5" rx="4"/>
  <text x="202.5" y="309" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">CMD</text>
  <text x="202.5" y="323" font-size="12" text-anchor="middle" fill="#4b5563">2 такти</text>

  <!-- ADDR: 4 такти -->
  <rect x="229" y="290" width="45" height="44" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5" rx="4"/>
  <text x="251.5" y="309" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">ADDR</text>
  <text x="251.5" y="323" font-size="12" text-anchor="middle" fill="#4b5563">4 такти</text>

  <!-- DUMMY: 6 тактів -->
  <rect x="278" y="290" width="55" height="44" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="4"/>
  <text x="305.5" y="309" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">DUMMY</text>
  <text x="305.5" y="323" font-size="12" text-anchor="middle" fill="#c0392b">6 тактів</text>

  <!-- DATA: 32 такти -->
  <rect x="337" y="290" width="260" height="44" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="467" y="309" font-size="13" font-weight="700" text-anchor="middle" fill="#27ae60">DATA (32 B = 256 біт)</text>
  <text x="467" y="325" font-size="12" text-anchor="middle" fill="#27ae60">32 такти шини (8 біт / такт)</text>

  <!-- Блок вивільненого часу -->
  <rect x="601" y="290" width="279" height="44" fill="#e9f7ef" stroke="#27ae60" stroke-dasharray="4 4" stroke-width="1.5" rx="4"/>
  <text x="740.5" y="309" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">Скекономлено 42 такти шини (-48.8% затримки)</text>
  <text x="740.5" y="325" font-size="12" text-anchor="middle" fill="#27ae60">Ядро раніше відновлює виконання після cache miss</text>

  <!-- Підписи дужок Octal SPI -->
  <line x1="180" y1="344" x2="333" y2="344" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="180" y1="340" x2="180" y2="348" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="333" y1="340" x2="333" y2="348" stroke="#c0392b" stroke-width="1.5"/>
  <text x="256.5" y="363" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">Накладні: 12 тактів (27.3%)</text>
  <text x="256.5" y="379" font-size="12" text-anchor="middle" fill="#6b7280">N_cmd + N_addr + N_dummy</text>

  <line x1="337" y1="344" x2="597" y2="344" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="337" y1="340" x2="337" y2="348" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="597" y1="340" x2="597" y2="348" stroke="#27ae60" stroke-width="1.5"/>
  <text x="467" y="363" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">Передача даних: 32 такти (72.7%)</text>
  <text x="467" y="379" font-size="12" text-anchor="middle" fill="#6b7280">256 біт / 8 біт за такт (N_data)</text>

  <!-- Панель 3: Підсумок / Порівняльні картки -->
  <rect x="30" y="415" width="900" height="90" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>

  <rect x="45" y="427" width="275" height="66" fill="white" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="182.5" y="445" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Тривалість фази даних (N_data)</text>
  <text x="182.5" y="463" font-size="13" font-weight="700" text-anchor="middle" fill="#2457d6">64 такти → 32 такти</text>
  <text x="182.5" y="479" font-size="12" text-anchor="middle" fill="#27ae60">Прискорення фази даних у 2.0 рази</text>

  <rect x="342.5" y="427" width="275" height="66" fill="white" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="480" y="445" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Фіксовані накладні витрати (N_oh)</text>
  <text x="480" y="463" font-size="13" font-weight="700" text-anchor="middle" fill="#c0392b">22 такти → 12 тактів</text>
  <text x="480" y="479" font-size="12" text-anchor="middle" fill="#6b7280">N_dummy не залежить від ширини шини</text>

  <rect x="640" y="427" width="275" height="66" fill="white" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="777.5" y="445" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">Загальна затримка miss penalty (t_miss)</text>
  <text x="777.5" y="463" font-size="13" font-weight="700" text-anchor="middle" fill="#27ae60">86 тактів → 44 такти (-48.8%)</text>
  <text x="777.5" y="479" font-size="12" text-anchor="middle" fill="#27ae60">Скорочення промаху кешу в 1.95 рази</text>
</svg>
