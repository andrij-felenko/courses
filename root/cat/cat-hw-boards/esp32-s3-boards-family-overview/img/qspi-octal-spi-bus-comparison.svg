<svg viewBox="0 0 960 520" width="960" height="520" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Порівняння апаратних шин Quad SPI та Octal SPI (SDR / DDR)</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Подвоєння ширини шини, стробування DQS та тактування по обох фронтах (до 160 МБ/с)</text>

  <!-- Panel 1: Quad SPI (QSPI) -->
  <rect x="40" y="75" width="880" height="195" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="55" y="96" font-size="13" font-weight="bold" fill="#1a1a1a">1. Шина Quad SPI (QSPI — 4 лінії даних, режим SDR, стробування по зростаючому фронту)</text>

  <!-- QSPI Left Info Block -->
  <rect x="55" y="110" width="220" height="145" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="68" y="130" font-size="11" font-weight="bold" fill="#1a1a1a">Лінії шини (6 виводів):</text>
  <text x="68" y="148" font-size="11" fill="#6b7280">• CLK (Тактування SPI)</text>
  <text x="68" y="164" font-size="11" fill="#6b7280">• CS# (Вибір чипа)</text>
  <text x="68" y="180" font-size="11" fill="#6b7280">• IO0–IO3 (4-біт дані)</text>
  <text x="68" y="205" font-size="11" font-weight="bold" fill="#1a1a1a">Максимальна швидкість:</text>
  <text x="68" y="225" font-size="13" font-weight="bold" fill="#2457d6">40 МБ/с (80 МГц)</text>

  <!-- QSPI Timing Waveforms Block -->
  <rect x="290" y="110" width="615" height="145" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="305" y="145" font-size="11" font-weight="bold" fill="#1a1a1a">CLK:</text>
  <text x="305" y="208" font-size="11" font-weight="bold" fill="#1a1a1a">IO0–IO3:</text>

  <text x="580" y="125" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">Зчитування 4 біт по кожному зростаючому фронту CLK (1 байт за 2 такти)</text>

  <!-- CLK Waveform -->
  <path d="M 380,153 L 420,153 L 420,133 L 460,133 L 460,153 L 500,153 L 500,133 L 540,133 L 540,153 L 580,153 L 580,133 L 620,133 L 620,153 L 660,153 L 660,133 L 700,133 L 700,153 L 740,153 L 740,133 L 780,133 L 780,153 L 840,153" stroke="#1a1a1a" stroke-width="1.8" fill="none"/>

  <!-- Sampling Lines -->
  <line x1="420" y1="130" x2="420" y2="190" stroke="#27ae60" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr-green)"/>
  <line x1="500" y1="130" x2="500" y2="190" stroke="#27ae60" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr-green)"/>
  <line x1="580" y1="130" x2="580" y2="190" stroke="#27ae60" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr-green)"/>
  <line x1="660" y1="130" x2="660" y2="190" stroke="#27ae60" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr-green)"/>

  <!-- Data Bus Bytes -->
  <rect x="420" y="193" width="75" height="24" rx="3" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="457" y="209" font-size="10" fill="#2457d6" text-anchor="middle">Байт 0 (Низький)</text>

  <rect x="500" y="193" width="75" height="24" rx="3" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="537" y="209" font-size="10" fill="#2457d6" text-anchor="middle">Байт 0 (Високий)</text>

  <rect x="580" y="193" width="75" height="24" rx="3" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="617" y="209" font-size="10" fill="#2457d6" text-anchor="middle">Байт 1 (Низький)</text>

  <rect x="660" y="193" width="75" height="24" rx="3" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="697" y="209" font-size="10" fill="#2457d6" text-anchor="middle">Байт 1 (Високий)</text>

  <text x="890" y="245" font-size="10" fill="#6b7280" text-anchor="end">2 такти CLK = 1 байт даних</text>

  <!-- Panel 2: Octal SPI (OSPI) -->
  <rect x="40" y="280" width="880" height="225" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="55" y="301" font-size="13" font-weight="bold" fill="#27ae60">2. Шина Octal SPI (OSPI — 8 ліній даних, режим DDR + строб DQS)</text>

  <!-- OSPI Left Info Block -->
  <rect x="55" y="315" width="220" height="175" rx="4" fill="#ffffff" stroke="#27ae60"/>
  <text x="68" y="335" font-size="11" font-weight="bold" fill="#1a1a1a">Лінії шини (11 виводів):</text>
  <text x="68" y="353" font-size="11" fill="#6b7280">• CLK / CLK# (Диф. такт)</text>
  <text x="68" y="369" font-size="11" fill="#6b7280">• CS# (Вибір чипа)</text>
  <text x="68" y="385" font-size="11" fill="#6b7280">• IO0–IO7 (8-біт дані)</text>
  <text x="68" y="401" font-size="11" font-weight="bold" fill="#27ae60">• DQS (Data Strobe)</text>
  <text x="68" y="430" font-size="11" font-weight="bold" fill="#1a1a1a">Максимальна швидкість:</text>
  <text x="68" y="450" font-size="13" font-weight="bold" fill="#27ae60">160 МБ/с (DDR @ 80 МГц)</text>

  <!-- OSPI Timing Waveforms Block -->
  <rect x="290" y="315" width="615" height="175" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="305" y="348" font-size="11" font-weight="bold" fill="#1a1a1a">CLK:</text>
  <text x="305" y="398" font-size="11" font-weight="bold" fill="#27ae60">DQS:</text>
  <text x="305" y="448" font-size="11" font-weight="bold" fill="#1a1a1a">IO0–IO7:</text>

  <text x="580" y="378" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">Зчитування по обох фронтах DQS (1 повний 8-біт байт за кожне перемикання)</text>

  <!-- CLK Waveform -->
  <path d="M 380,358 L 410,358 L 410,338 L 460,338 L 460,358 L 510,358 L 510,338 L 560,338 L 560,358 L 610,358 L 610,338 L 660,338 L 660,358 L 710,358 L 710,338 L 760,338 L 760,358 L 840,358" stroke="#1a1a1a" stroke-width="1.8" fill="none"/>

  <!-- DQS Waveform -->
  <path d="M 380,408 L 410,408 L 410,388 L 460,388 L 460,408 L 510,408 L 510,388 L 560,388 L 560,408 L 610,408 L 610,388 L 660,388 L 660,408 L 710,408 L 710,388 L 760,388 L 760,408 L 840,408" stroke="#27ae60" stroke-width="1.8" fill="none"/>

  <!-- DQS Sampling Lines -->
  <line x1="410" y1="388" x2="410" y2="430" stroke="#27ae60" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr-green)"/>
  <line x1="460" y1="408" x2="460" y2="430" stroke="#27ae60" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr-green)"/>
  <line x1="510" y1="388" x2="510" y2="430" stroke="#27ae60" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr-green)"/>
  <line x1="560" y1="408" x2="560" y2="430" stroke="#27ae60" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr-green)"/>
  <line x1="610" y1="388" x2="610" y2="430" stroke="#27ae60" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr-green)"/>
  <line x1="660" y1="408" x2="660" y2="430" stroke="#27ae60" stroke-width="1" stroke-dasharray="2,2" marker-end="url(#arr-green)"/>

  <!-- Data Bus Bytes -->
  <rect x="410" y="433" width="48" height="24" rx="3" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="434" y="449" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">Байт 0</text>

  <rect x="460" y="433" width="48" height="24" rx="3" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="484" y="449" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">Байт 1</text>

  <rect x="510" y="433" width="48" height="24" rx="3" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="534" y="449" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">Байт 2</text>

  <rect x="560" y="433" width="48" height="24" rx="3" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="584" y="449" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">Байт 3</text>

  <rect x="610" y="433" width="48" height="24" rx="3" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="634" y="449" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">Байт 4</text>

  <rect x="660" y="433" width="48" height="24" rx="3" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="684" y="449" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">Байт 5</text>

  <rect x="710" y="433" width="48" height="24" rx="3" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="734" y="449" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">Байт 6</text>

  <text x="890" y="478" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="end">1 такт CLK = 2 байти даних (DDR + 8 біт)</text>
</svg>
