<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Апаратна архітектура USB Serial/JTAG контролера ESP32-S3</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Внутрішній міст з'єднує USB D+/D- напряму з JTAG та CDC без зовнішніх USB-UART конвертерів</text>

  <!-- LEFT PANEL: Traditional approach -->
  <rect x="35" y="85" width="435" height="415" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="252" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">Класична схема (Зовнішній USB-UART)</text>

  <!-- PC Host Left -->
  <rect x="55" y="130" width="110" height="55" rx="6" fill="white" stroke="#c0392b"/>
  <text x="110" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">ПК / Host</text>
  <text x="110" y="170" text-anchor="middle" font-size="11" fill="#6b7280">(USB Порт)</text>

  <!-- Arrow PC -> CP2102 -->
  <path d="M165,157 L215,157" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="190" y="146" text-anchor="middle" font-size="11" fill="#6b7280">USB D+/D-</text>

  <!-- External Chip CP2102 -->
  <rect x="215" y="130" width="130" height="55" rx="6" fill="white" stroke="#c0392b"/>
  <text x="280" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">CP2102 / CH340</text>
  <text x="280" y="170" text-anchor="middle" font-size="11" fill="#6b7280">Зовнішній конвертер</text>

  <!-- Arrow CP2102 -> ESP32 Chip -->
  <path d="M280,185 L280,225" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="292" y="210" text-anchor="start" font-size="11" fill="#c0392b">RX0 / TX0 (GPIO1/3)</text>

  <!-- ESP32 Chip Left -->
  <rect x="55" y="225" width="395" height="255" rx="8" fill="white" stroke="#d0d7de"/>
  <text x="252" y="246" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">ESP32 SoC (Без нативного USB)</text>

  <!-- UART0 Sub-block -->
  <rect x="75" y="260" width="165" height="80" rx="6" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="157" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Периферія UART0</text>
  <text x="157" y="302" text-anchor="middle" font-size="11" fill="#6b7280">• Лише консоль і лог</text>
  <text x="157" y="322" text-anchor="middle" font-size="11" fill="#6b7280">• Прошивка через ROM</text>

  <!-- Arrow UART0 -> CPU -->
  <path d="M240,300 L265,300" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- CPU Sub-block Left -->
  <rect x="265" y="260" width="165" height="80" rx="6" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="347" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Xtensa® Dual-Core</text>
  <text x="347" y="302" text-anchor="middle" font-size="11" fill="#6b7280">Виконання коду</text>
  <text x="347" y="322" text-anchor="middle" font-size="11" fill="#6b7280">Без JTAG по USB</text>

  <!-- Drawbacks Box -->
  <rect x="75" y="352" width="355" height="115" rx="6" fill="#fdecea" stroke="#c0392b"/>
  <text x="252" y="372" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Недоліки класичної схеми:</text>
  <text x="252" y="392" text-anchor="middle" font-size="11" fill="#c0392b">1. Додаткова мікросхема конвертера на платі</text>
  <text x="252" y="411" text-anchor="middle" font-size="11" fill="#c0392b">2. Відлагодження JTAG вимагає ESP-Prog адаптер</text>
  <text x="252" y="430" text-anchor="middle" font-size="11" fill="#c0392b">3. Займає 4-6 додаткових виводів GPIO для JTAG</text>
  <text x="252" y="449" text-anchor="middle" font-size="11" fill="#c0392b">4. Повільніша прошивка (обмеження Baudrate)</text>


  <!-- RIGHT PANEL: ESP32-S3 Embedded USB Serial/JTAG -->
  <rect x="490" y="85" width="435" height="415" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="707" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Нова архітектура ESP32-S3 (Вбудований міст)</text>

  <!-- PC Host Right -->
  <rect x="510" y="130" width="110" height="55" rx="6" fill="white" stroke="#27ae60"/>
  <text x="565" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">ПК / Host</text>
  <text x="565" y="170" text-anchor="middle" font-size="11" fill="#6b7280">(USB Порт)</text>

  <!-- Direct USB Cable Arrow -->
  <path d="M620,157 L670,157" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="645" y="146" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Прямий USB</text>

  <!-- ESP32-S3 SoC Box -->
  <rect x="670" y="130" width="240" height="350" rx="8" fill="white" stroke="#27ae60"/>
  <text x="790" y="150" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">ESP32-S3 SoC</text>
  <text x="790" y="167" text-anchor="middle" font-size="11" fill="#6b7280">GPIO19 (D-) / GPIO20 (D+)</text>

  <!-- Embedded USB Serial/JTAG Controller -->
  <rect x="685" y="180" width="210" height="170" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="790" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">USB Serial/JTAG Controller</text>

  <!-- USB PHY -->
  <rect x="695" y="208" width="190" height="24" rx="4" fill="white" stroke="#2457d6"/>
  <text x="790" y="224" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Full-Speed USB PHY (12 Mbps)</text>

  <!-- CDC-ACM -->
  <rect x="695" y="238" width="190" height="46" rx="4" fill="white" stroke="#2457d6"/>
  <text x="790" y="255" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">USB CDC-ACM (Virtual COM)</text>
  <text x="790" y="272" text-anchor="middle" font-size="10" fill="#6b7280">Друк логів, консоль, прошивка</text>

  <!-- Hardware JTAG -->
  <rect x="695" y="290" width="190" height="46" rx="4" fill="white" stroke="#2457d6"/>
  <text x="790" y="307" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Hardware JTAG TAP Engine</text>
  <text x="790" y="324" text-anchor="middle" font-size="10" fill="#6b7280">GDB debugging, точки зупину</text>

  <!-- Arrows USB Controller -> CPU -->
  <path d="M740,350 L740,370" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M840,350 L840,370" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- CPU Dual-Core Box Right -->
  <rect x="685" y="370" width="210" height="98" rx="6" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="790" y="389" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Xtensa® Dual-Core LX7 CPU</text>
  <text x="790" y="408" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">✓ Повноцінний GDB відлагоджувач</text>
  <text x="790" y="426" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">✓ Прямий доступ до пам'яті і шини</text>
  <text x="790" y="445" text-anchor="middle" font-size="10" fill="#6b7280">Всі виводи GPIO лишаються вільними</text>
</svg>
