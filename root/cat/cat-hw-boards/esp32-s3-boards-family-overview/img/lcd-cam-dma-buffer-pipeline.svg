<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Конвеєр обробки даних LCD_CAM через DMA в ESP32-S3</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">Апаратна передача кадрових даних у подвійні буфери RAM через кільцевий список дескрипторів без залучення CPU</text>

  <!-- Panel 1: LCD_CAM Peripheral -->
  <rect x="25" y="85" width="210" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="130" y="108" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Периферія LCD_CAM</text>

  <!-- Sub-box 1: DVP Camera -->
  <rect x="35" y="125" width="190" height="73" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="130" y="142" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Камерний сенсор</text>
  <text x="130" y="162" font-size="12" fill="#6b7280" text-anchor="middle">(8/16-bit DVP / CAM)</text>
  <text x="130" y="182" font-size="12" fill="#6b7280" text-anchor="middle">PCLK, VSYNC, HREF</text>

  <!-- Arrow Sub-box 1 to 2 -->
  <line x1="130" y1="198" x2="130" y2="225" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>

  <!-- Sub-box 2: RX FIFO -->
  <rect x="35" y="225" width="190" height="73" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="130" y="242" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Апаратний RX FIFO</text>
  <text x="130" y="262" font-size="12" fill="#6b7280" text-anchor="middle">Асинхронне буферування</text>
  <text x="130" y="282" font-size="12" fill="#2457d6" font-weight="bold" text-anchor="middle">Потік подій і тактування</text>

  <!-- Arrow Sub-box 2 to 3 -->
  <line x1="130" y1="298" x2="130" y2="325" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Sub-box 3: GDMA Controller -->
  <rect x="35" y="325" width="190" height="130" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="130" y="342" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Контролер GDMA</text>
  <text x="130" y="362" font-size="12" fill="#1a1a1a" text-anchor="middle">Зчитування lldesc_t</text>
  <text x="130" y="382" font-size="12" fill="#1a1a1a" text-anchor="middle">Запис кадру в RAM</text>
  
  <!-- Zero-CPU Badge -->
  <rect x="50" y="398" width="160" height="44" rx="4" fill="#27ae60"/>
  <text x="130" y="415" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Без участі CPU</text>
  <text x="130" y="432" font-size="12" fill="#ffffff" text-anchor="middle">(Zero-CPU Overhead)</text>

  <!-- Panel 2: DMA Descriptor Ring -->
  <rect x="290" y="85" width="370" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="475" y="108" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кільцевий список дескрипторів DMA (lldesc_t)</text>

  <!-- Desc 0 -->
  <rect x="305" y="125" width="160" height="150" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="385" y="145" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Дескриптор 0</text>
  <rect x="320" y="152" width="130" height="22" rx="4" fill="#27ae60"/>
  <text x="385" y="167" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">owner = 1 (DMA)</text>
  <text x="315" y="193" font-size="12" fill="#1a1a1a">length: 4096 B</text>
  <text x="315" y="211" font-size="12" fill="#1a1a1a">buf: &amp;Buffer_A[0]</text>
  <text x="315" y="229" font-size="12" fill="#1a1a1a">eof: 0</text>
  <text x="315" y="255" font-size="12" fill="#27ae60" font-weight="bold">next: &amp;Desc_1</text>

  <!-- Desc 1 -->
  <rect x="485" y="125" width="160" height="150" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="565" y="145" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Дескриптор 1</text>
  <rect x="500" y="152" width="130" height="22" rx="4" fill="#d0d7de"/>
  <text x="565" y="167" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">owner = 1 (DMA)</text>
  <text x="495" y="193" font-size="12" fill="#1a1a1a">length: 4096 B</text>
  <text x="495" y="211" font-size="12" fill="#1a1a1a">buf: &amp;Buffer_A[4096]</text>
  <text x="495" y="229" font-size="12" fill="#27ae60" font-weight="bold">eof: 1 (EOF кадру)</text>
  <text x="495" y="255" font-size="12" fill="#2457d6" font-weight="bold">next: &amp;Desc_2</text>

  <!-- Desc 2 -->
  <rect x="485" y="300" width="160" height="150" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="565" y="320" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Дескриптор 2</text>
  <rect x="500" y="327" width="130" height="22" rx="4" fill="#2457d6"/>
  <text x="565" y="342" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">owner = 0 (CPU)</text>
  <text x="495" y="368" font-size="12" fill="#1a1a1a">length: 4096 B</text>
  <text x="495" y="386" font-size="12" fill="#1a1a1a">buf: &amp;Buffer_B[0]</text>
  <text x="495" y="404" font-size="12" fill="#1a1a1a">eof: 0</text>
  <text x="495" y="430" font-size="12" fill="#2457d6" font-weight="bold">next: &amp;Desc_3</text>

  <!-- Desc 3 -->
  <rect x="305" y="300" width="160" height="150" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="385" y="320" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Дескриптор 3</text>
  <rect x="320" y="327" width="130" height="22" rx="4" fill="#6b7280"/>
  <text x="385" y="342" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">owner = 0 (CPU)</text>
  <text x="315" y="368" font-size="12" fill="#1a1a1a">length: 4096 B</text>
  <text x="315" y="386" font-size="12" fill="#1a1a1a">buf: &amp;Buffer_B[4096]</text>
  <text x="315" y="404" font-size="12" fill="#2457d6" font-weight="bold">eof: 1 (EOF кадру)</text>
  <text x="315" y="430" font-size="12" fill="#27ae60" font-weight="bold">next: &amp;Desc_0</text>

  <!-- Ring Flow Arrows between descriptors -->
  <line x1="465" y1="185" x2="485" y2="185" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="565" y1="275" x2="565" y2="300" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="485" y1="375" x2="465" y2="375" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="385" y1="300" x2="385" y2="275" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Panel 3: System RAM & Buffers -->
  <rect x="720" y="85" width="215" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="827" y="108" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Оперативна пам'ять (RAM)</text>

  <!-- Buffer A -->
  <rect x="735" y="125" width="185" height="155" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="827" y="145" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Буфер A (Ping Buffer)</text>
  <rect x="752" y="152" width="150" height="22" rx="4" fill="#27ae60"/>
  <text x="827" y="167" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Активний запис DMA</text>
  <text x="745" y="191" font-size="12" fill="#1a1a1a">heap_caps_malloc(...,</text>
  <text x="757" y="207" font-size="12" fill="#27ae60" font-weight="bold">MALLOC_CAP_DMA)</text>
  <text x="827" y="226" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Кадр 1: 65% заповнено</text>
  <rect x="745" y="232" width="165" height="14" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <rect x="747" y="234" width="107" height="10" rx="2" fill="#27ae60" opacity="0.6"/>
  <text x="745" y="266" font-size="12" fill="#6b7280">Адреса: 0x3FC90000 (SRAM)</text>

  <!-- Buffer B -->
  <rect x="735" y="300" width="185" height="155" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="827" y="320" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Буфер B (Pong Buffer)</text>
  <rect x="752" y="327" width="150" height="22" rx="4" fill="#2457d6"/>
  <text x="827" y="342" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Готовий для обробки CPU</text>
  <text x="745" y="366" font-size="12" fill="#1a1a1a">heap_caps_malloc(...,</text>
  <text x="757" y="382" font-size="12" fill="#2457d6" font-weight="bold">MALLOC_CAP_SPIRAM)</text>
  <text x="827" y="401" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Кадр 0: 100% (Повний кадр)</text>
  <rect x="745" y="407" width="165" height="14" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <rect x="747" y="409" width="161" height="10" rx="2" fill="#2457d6" opacity="0.6"/>
  <text x="745" y="441" font-size="12" fill="#6b7280">Адреса: 0x3D800000 (PSRAM)</text>

  <!-- GDMA to Descriptor Read Arrow -->
  <path d="M 225 380 L 260 380 L 260 205 L 305 205" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="260" y="180" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Читання</text>

  <!-- Descriptors to RAM Buffer Pointers -->
  <line x1="645" y1="205" x2="735" y2="205" stroke="#27ae60" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>
  <text x="690" y="193" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">buf_ptr</text>

  <line x1="645" y1="380" x2="735" y2="380" stroke="#2457d6" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <text x="690" y="368" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">buf_ptr</text>

  <!-- Interrupt Banner -->
  <rect x="290" y="480" width="645" height="32" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="612" y="500" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Переривання GDMA (IN_SUC_EOF): Автоматичне перемикання Ping-Pong буферів</text>
</svg>
