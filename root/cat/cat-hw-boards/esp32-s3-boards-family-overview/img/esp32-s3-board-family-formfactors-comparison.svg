<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Порівняння формфакторів плат розробки на базі ESP32-S3</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Видно геометричні розміри, кількість контактних площадок GPIO та сфери застосування плат</text>

  <!-- Legend Bar -->
  <rect x="30" y="72" width="900" height="40" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>
  
  <rect x="45" y="82" width="20" height="20" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="3"/>
  <text x="73" y="96" font-size="12" font-weight="bold" fill="#2457d6">Повнорозмірні плати (DevKitC)</text>

  <rect x="360" y="82" width="20" height="20" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="3"/>
  <text x="388" y="96" font-size="12" font-weight="bold" fill="#27ae60">Компактні плати (Pico)</text>

  <rect x="670" y="82" width="20" height="20" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5" rx="3"/>
  <text x="698" y="96" font-size="12" font-weight="bold" fill="#1a1a1a">Мікро-плати (Zero / SuperMini)</text>

  <!-- Column 1: DevKitC-1 -->
  <rect x="30" y="125" width="210" height="370" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <rect x="30" y="125" width="210" height="35" fill="#2457d6" rx="8"/>
  <rect x="30" y="150" width="210" height="10" fill="#2457d6"/>
  <text x="135" y="148" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">ESP32-S3 DevKitC-1</text>

  <rect x="65" y="175" width="140" height="110" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <rect x="80" y="185" width="110" height="50" fill="#ffffff" stroke="#2457d6" stroke-width="1" rx="3"/>
  <text x="135" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">WROOM-1</text>
  <rect x="85" y="258" width="40" height="18" fill="#d0d7de" rx="2"/>
  <text x="105" y="271" text-anchor="middle" font-size="11" fill="#1a1a1a">UART</text>
  <rect x="145" y="258" width="40" height="18" fill="#d0d7de" rx="2"/>
  <text x="165" y="271" text-anchor="middle" font-size="11" fill="#1a1a1a">OTG</text>

  <text x="45" y="310" font-size="12" font-weight="bold" fill="#1a1a1a">Розміри: 65 × 28 мм</text>
  <text x="45" y="332" font-size="12" fill="#1a1a1a">Виводи: 44 GPIO (DIP)</text>
  <text x="45" y="354" font-size="12" fill="#1a1a1a">Живлення: USB / 5V / 3.3V</text>
  <text x="45" y="376" font-size="12" fill="#1a1a1a">Порти: 2× Type-C</text>
  <text x="45" y="405" font-size="12" font-weight="bold" fill="#2457d6">Прототипування та</text>
  <text x="45" y="425" font-size="12" font-weight="bold" fill="#2457d6">макетні плати</text>

  <!-- Column 2: ESP32-S3-Pico -->
  <rect x="260" y="125" width="210" height="370" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <rect x="260" y="125" width="210" height="35" fill="#27ae60" rx="8"/>
  <rect x="260" y="150" width="210" height="10" fill="#27ae60"/>
  <text x="365" y="148" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">ESP32-S3-Pico</text>

  <rect x="295" y="175" width="140" height="110" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <rect x="310" y="185" width="110" height="50" fill="#ffffff" stroke="#27ae60" stroke-width="1" rx="3"/>
  <text x="365" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">WROOM-1 / SiP</text>
  <rect x="340" y="258" width="50" height="18" fill="#d0d7de" rx="2"/>
  <text x="365" y="271" text-anchor="middle" font-size="11" fill="#1a1a1a">Type-C</text>

  <text x="275" y="310" font-size="12" font-weight="bold" fill="#1a1a1a">Розміри: 51 × 21 мм</text>
  <text x="275" y="332" font-size="12" fill="#1a1a1a">Виводи: 30 GPIO (Pico)</text>
  <text x="275" y="354" font-size="12" fill="#1a1a1a">Живлення: USB / 5V / 3.3V</text>
  <text x="275" y="376" font-size="12" fill="#1a1a1a">Порти: 1× Type-C</text>
  <text x="275" y="405" font-size="12" font-weight="bold" fill="#27ae60">Модульні системи та</text>
  <text x="275" y="425" font-size="12" font-weight="bold" fill="#27ae60">Pico-шилди</text>

  <!-- Column 3: ESP32-S3-Zero -->
  <rect x="490" y="125" width="210" height="370" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <rect x="490" y="125" width="210" height="35" fill="#1a1a1a" rx="8"/>
  <rect x="490" y="150" width="210" height="10" fill="#1a1a1a"/>
  <text x="595" y="148" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">ESP32-S3-Zero</text>

  <rect x="535" y="175" width="120" height="110" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" rx="4"/>
  <rect x="550" y="185" width="90" height="50" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1" rx="3"/>
  <text x="595" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">QFN56 SiP</text>
  <rect x="570" y="258" width="50" height="18" fill="#d0d7de" rx="2"/>
  <text x="595" y="271" text-anchor="middle" font-size="11" fill="#1a1a1a">Type-C</text>

  <text x="505" y="310" font-size="12" font-weight="bold" fill="#1a1a1a">Розміри: 23.5 × 18 мм</text>
  <text x="505" y="332" font-size="12" fill="#1a1a1a">Виводи: 18 GPIO (SMD)</text>
  <text x="505" y="354" font-size="12" fill="#1a1a1a">Живлення: USB / 5V / 3.3V</text>
  <text x="505" y="376" font-size="12" fill="#1a1a1a">Порти: 1× Type-C</text>
  <text x="505" y="405" font-size="12" font-weight="bold" fill="#1a1a1a">Мікро-пристрої та</text>
  <text x="505" y="425" font-size="12" font-weight="bold" fill="#1a1a1a">вбудовані модулі</text>

  <!-- Column 4: ESP32-S3 SuperMini -->
  <rect x="720" y="125" width="210" height="370" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <rect x="720" y="125" width="210" height="35" fill="#2457d6" rx="8"/>
  <rect x="720" y="150" width="210" height="10" fill="#2457d6"/>
  <text x="825" y="148" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold">ESP32-S3 SuperMini</text>

  <rect x="765" y="175" width="120" height="110" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <rect x="780" y="185" width="90" height="50" fill="#ffffff" stroke="#2457d6" stroke-width="1" rx="3"/>
  <text x="825" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">SoC + Ant</text>
  <rect x="800" y="258" width="50" height="18" fill="#d0d7de" rx="2"/>
  <text x="825" y="271" text-anchor="middle" font-size="11" fill="#1a1a1a">Type-C</text>

  <text x="735" y="310" font-size="12" font-weight="bold" fill="#1a1a1a">Розміри: 22.5 × 18 мм</text>
  <text x="735" y="332" font-size="12" fill="#1a1a1a">Виводи: 13 GPIO (DIP)</text>
  <text x="735" y="354" font-size="12" fill="#1a1a1a">Живлення: USB / 5V / 3.3V</text>
  <text x="735" y="376" font-size="12" fill="#1a1a1a">Порти: 1× Type-C</text>
  <text x="735" y="405" font-size="12" font-weight="bold" fill="#2457d6">Носимі сенсори та</text>
  <text x="735" y="425" font-size="12" font-weight="bold" fill="#2457d6">автономні вузли</text>
</svg>
