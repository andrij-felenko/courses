<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Маршрутизація GPIO33–GPIO37 та конфлікт ADC2 з Wi-Fi в ESP32-S3</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Апаратне блокування Octal SPI ліній через IO MUX та арбітраж ADC2 під час бездротового передавання</text>

  <!-- LEFT PANEL: Octal SPI MUX Routing -->
  <rect x="30" y="75" width="435" height="420" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Конфлікт шини Octal SPI (GPIO33–GPIO37)</text>

  <!-- Octal SPI Controller Box -->
  <rect x="55" y="118" width="385" height="46" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="247" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Octal SPI Controller (Шина пам'яті OPI)</text>

  <!-- Connecting Arrow Blue -->
  <line x1="247" y1="164" x2="247" y2="188" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- IO MUX Box -->
  <rect x="55" y="190" width="385" height="60" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="247" y="213" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">IO MUX (Жорстка фіксація виводів)</text>
  <text x="247" y="235" text-anchor="middle" font-size="12" fill="#1a1a1a">Пряма прив'язка до фізичних ліній GPIO33–GPIO37</text>

  <!-- Down Connection to Physical Pins -->
  <line x1="350" y1="250" x2="350" y2="276" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Dashed Line to GPIO Matrix (Blocked) -->
  <line x1="145" y1="250" x2="145" y2="276" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr-red)"/>
  <text x="153" y="268" text-anchor="start" font-size="10" font-weight="bold" fill="#c0392b">Обхід заблоковано</text>

  <!-- GPIO Matrix Box -->
  <rect x="55" y="278" width="180" height="54" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="145" y="300" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">GPIO Matrix</text>
  <text x="145" y="318" text-anchor="middle" font-size="11" fill="#6b7280">(Обхід неможливий)</text>

  <!-- Physical Pins Box -->
  <rect x="260" y="278" width="180" height="54" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="350" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">GPIO33 – GPIO37</text>
  <text x="350" y="318" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Зарезервовано OPI</text>

  <!-- Left Status Banner -->
  <rect x="55" y="352" width="385" height="125" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="70" y="375" font-size="12" font-weight="bold" fill="#c0392b">⛔ Апаратні обмеження Octal SPI:</text>
  <text x="70" y="398" font-size="12" fill="#1a1a1a">• GPIO33–37 фізично підключені до Flash/PSRAM</text>
  <text x="70" y="420" font-size="12" fill="#1a1a1a">• Сигнали йдуть в обхід гнучкої матриці GPIO</text>
  <text x="70" y="442" font-size="12" fill="#1a1a1a">• Спроба перевикористання ламає шину пам'яті</text>
  <text x="70" y="464" font-size="12" fill="#1a1a1a">• Застосовуйте тільки для Octal SPI Flash/PSRAM</text>

  <!-- RIGHT PANEL: ADC2 vs Wi-Fi Conflict -->
  <rect x="495" y="75" width="435" height="420" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="712" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Конфлікт аналогових каналів ADC2 з Wi-Fi</text>

  <!-- Wi-Fi PHY Controller Box -->
  <rect x="520" y="118" width="385" height="46" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="712" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Модуль Wi-Fi / Bluetooth (PHY Arbiter)</text>

  <!-- Connecting Lines to ADC1 and ADC2 -->
  <line x1="612" y1="164" x2="612" y2="188" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="812" y1="164" x2="812" y2="188" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="820" y="180" text-anchor="start" font-size="10" font-weight="bold" fill="#c0392b">Пріоритет RF</text>

  <!-- Sub-box ADC1 -->
  <rect x="520" y="190" width="185" height="142" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="612" y="213" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Канал ADC1</text>
  <text x="612" y="233" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">GPIO1 – GPIO10</text>
  <text x="532" y="258" font-size="12" fill="#1a1a1a">• Власний блок SAR1</text>
  <text x="532" y="280" font-size="12" fill="#1a1a1a">• Незалежний від радіо</text>
  <text x="532" y="302" font-size="12" fill="#1a1a1a">• Стабільні заміри</text>
  <text x="612" y="322" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">✓ Дозволено при Wi-Fi</text>

  <!-- Sub-box ADC2 -->
  <rect x="720" y="190" width="185" height="142" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="812" y="213" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Канал ADC2</text>
  <text x="812" y="233" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">GPIO11 – GPIO20</text>
  <text x="732" y="258" font-size="12" fill="#1a1a1a">• Спільний блок SAR2</text>
  <text x="732" y="280" font-size="12" fill="#1a1a1a">• Блокується Wi-Fi PHY</text>
  <text x="732" y="302" font-size="12" fill="#1a1a1a">• Хибні зчитування</text>
  <text x="812" y="322" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">⛔ Конфлікт із Wi-Fi</text>

  <!-- Right Status Banner -->
  <rect x="520" y="352" width="385" height="125" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="535" y="375" font-size="12" font-weight="bold" fill="#1a1a1a">💡 Правила вибору аналогових виводів:</text>
  <text x="535" y="398" font-size="12" fill="#1a1a1a">• Для сенсорів обирайте виводи каналу ADC1</text>
  <text x="535" y="420" font-size="12" fill="#1a1a1a">• Використовуйте ADC2 лише при вимкненому Wi-Fi</text>
  <text x="535" y="442" font-size="12" fill="#1a1a1a">• При передачі Wi-Fi виклики ADC2 повертають помилку</text>
  <text x="535" y="464" font-size="12" fill="#1a1a1a">• Апаратний арбітр надає пріоритет калібруванню RF</text>
</svg>
