<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <defs>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Карта адрес зміщення флеш-пам'яті та режими шини SPI (esptool)</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Розподіл бінарних сегментів у пам'яті ESP32/ESP8266 та порівняння швидкодії режимів Dual/Quad SPI</text>

  <!-- LEFT PANEL: Memory Map -->
  <rect x="30" y="80" width="420" height="435" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="240" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Розподіл секторів флеш-пам'яті (Offsets)</text>

  <!-- Offset 0x00000: Bootloader -->
  <text x="115" y="150" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">0x00000</text>
  <rect x="125" y="125" width="305" height="50" rx="4" ry="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="277" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">bootloader.bin</text>
  <text x="277" y="164" text-anchor="middle" font-size="11" fill="#6b7280">Первинний завантажувач ROM Bootloader (4 KB)</text>

  <!-- Offset 0x08000: Partition Table -->
  <text x="115" y="210" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">0x08000</text>
  <rect x="125" y="185" width="305" height="45" rx="4" ry="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="277" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">partitions.bin</text>
  <text x="277" y="221" text-anchor="middle" font-size="11" fill="#6b7280">Таблиця розділів флеш-пам'яті (4 KB)</text>

  <!-- Offset 0x09000: NVS / Data -->
  <text x="115" y="265" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">0x09000</text>
  <rect x="125" y="240" width="305" height="45" rx="4" ry="4" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="277" y="259" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">nvs / otadata</text>
  <text x="277" y="276" text-anchor="middle" font-size="11" fill="#6b7280">Дані конфігурації NVS та стан OTA (20 KB)</text>

  <!-- Offset 0x10000: Main Application Firmware -->
  <text x="115" y="340" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">0x10000</text>
  <rect x="125" y="295" width="305" height="135" rx="4" ry="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="277" y="325" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">firmware.bin (app)</text>
  <text x="277" y="348" text-anchor="middle" font-size="12" fill="#1a1a1a">Основний бінарний образ програми</text>
  <text x="277" y="370" text-anchor="middle" font-size="11" fill="#6b7280">Сегменти IRAM_ATTR (код у пам'яті IRAM)</text>
  <text x="277" y="390" text-anchor="middle" font-size="11" fill="#6b7280">Сегменти IROM (FLASH виконуваний код)</text>
  <text x="277" y="410" text-anchor="middle" font-size="11" fill="#6b7280">Константи DRAM / DROM (до 3 MB)</text>

  <!-- Offset 0x3F0000: System Data -->
  <text x="115" y="468" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">0x3F0000</text>
  <rect x="125" y="445" width="305" height="50" rx="4" ry="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="277" y="466" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">phy_init / coredump</text>
  <text x="277" y="484" text-anchor="middle" font-size="11" fill="#6b7280">Калібрування RF та діагностичний лог (64 KB)</text>


  <!-- RIGHT PANEL: SPI Bus Modes -->
  <rect x="475" y="80" width="455" height="435" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="702" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Режими шини SPI Flash (esptool --flash_mode)</text>

  <!-- Dual SPI Block -->
  <rect x="495" y="125" width="415" height="160" rx="6" ry="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="510" y="150" font-size="13" font-weight="bold" fill="#1a1a1a">Режими Dual SPI (2 лінії даних)</text>

  <!-- DOUT -->
  <rect x="510" y="165" width="185" height="75" rx="4" ry="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="602" y="187" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">DOUT (Dual Output)</text>
  <text x="602" y="206" text-anchor="middle" font-size="11" fill="#1a1a1a">Адреса: 1 біт | Дані: 2 біти</text>
  <text x="602" y="224" text-anchor="middle" font-size="11" fill="#6b7280">Базовий режим (сумісний)</text>

  <!-- DIO -->
  <rect x="710" y="165" width="185" height="75" rx="4" ry="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="802" y="187" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">DIO (Dual I/O)</text>
  <text x="802" y="206" text-anchor="middle" font-size="11" fill="#1a1a1a">Адреса: 2 біти | Дані: 2 біти</text>
  <text x="802" y="224" text-anchor="middle" font-size="11" fill="#2457d6">Швидше за DOUT на ~15%</text>

  <text x="510" y="265" font-size="11" fill="#6b7280">• Використовує провідники SD0 (MOSI) та SD1 (MISO).</text>

  <!-- Quad SPI Block -->
  <rect x="495" y="300" width="415" height="195" rx="6" ry="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="510" y="325" font-size="13" font-weight="bold" fill="#27ae60">Режими Quad SPI (4 лінії даних — Висока пропускна здатність)</text>

  <!-- QOUT -->
  <rect x="510" y="340" width="185" height="85" rx="4" ry="4" fill="white" stroke="#27ae60" stroke-width="1"/>
  <text x="602" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">QOUT (Quad Output)</text>
  <text x="602" y="381" text-anchor="middle" font-size="11" fill="#1a1a1a">Адреса: 1 біт | Дані: 4 біти</text>
  <text x="602" y="400" text-anchor="middle" font-size="11" fill="#6b7280">Вимагає ліній WP/HD</text>
  <text x="602" y="415" text-anchor="middle" font-size="11" fill="#27ae60">Прискорення ×3.2</text>

  <!-- QIO -->
  <rect x="710" y="340" width="185" height="85" rx="4" ry="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="802" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">QIO (Quad I/O)</text>
  <text x="802" y="381" text-anchor="middle" font-size="11" fill="#1a1a1a">Адреса: 4 біти | Дані: 4 біти</text>
  <text x="802" y="400" text-anchor="middle" font-size="11" fill="#27ae60">Максимальна швидкість</text>
  <text x="802" y="415" text-anchor="middle" font-size="11" fill="#27ae60">Прискорення ×4.0</text>

  <text x="510" y="452" font-size="11" fill="#1a1a1a">• Лінії: SD0, SD1, SD2 (WP — Write Protect), SD3 (HD — Hold).</text>
  <text x="510" y="475" font-size="11" stroke="none" fill="#27ae60" font-weight="bold">• Стандартне налаштування esptool для ESP32 при 80 MHz SPI.</text>

</svg>
