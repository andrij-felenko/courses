<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="460" fill="#ffffff"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма сигналів RTS / DTR схеми автоскидання ESP</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Переведення мікроконтролера в режим ROM Bootloader через утримання IO0 = LOW під час зростання EN</text>

  <!-- Main Diagram Panel -->
  <rect x="40" y="70" width="880" height="300" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>

  <!-- Critical Boot Sampling Highlight Box -->
  <rect x="465" y="100" width="110" height="260" fill="#e9f7ef" fill-opacity="0.7" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,4" rx="6"/>

  <!-- Phase Header Titles -->
  <text x="250" y="90" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">1. Спокій</text>
  <text x="380" y="90" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">2. Скидання (EN=0)</text>
  <text x="520" y="90" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">3. Засув IO0=0</text>
  <text x="730" y="90" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">4. Режим прошивання</text>

  <!-- Vertical Phase Grid Lines -->
  <line x1="310" y1="95" x2="310" y2="360" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="450" y1="95" x2="450" y2="360" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="590" y1="95" x2="590" y2="360" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Signal 1: RTS -->
  <text x="55" y="130" font-size="13" font-weight="bold" fill="#1a1a1a">RTS</text>
  <text x="55" y="144" font-size="11" fill="#6b7280">USB UART</text>
  <line x1="190" y1="135" x2="870" y2="135" stroke="#e5e7eb" stroke-width="1"/>
  <path d="M 190,120 L 310,120 L 310,150 L 450,150 L 450,120 L 870,120" stroke="#2457d6" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
  <text x="250" y="112" font-size="11" fill="#6b7280" text-anchor="middle">HIGH</text>
  <text x="380" y="165" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">LOW</text>
  <text x="730" y="112" font-size="11" fill="#6b7280" text-anchor="middle">HIGH</text>

  <!-- Signal 2: DTR -->
  <text x="55" y="190" font-size="13" font-weight="bold" fill="#1a1a1a">DTR</text>
  <text x="55" y="204" font-size="11" fill="#6b7280">USB UART</text>
  <line x1="190" y1="195" x2="870" y2="195" stroke="#e5e7eb" stroke-width="1"/>
  <path d="M 190,180 L 450,180 L 450,210 L 590,210 L 590,180 L 870,180" stroke="#2457d6" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
  <text x="250" y="172" font-size="11" fill="#6b7280" text-anchor="middle">HIGH</text>
  <text x="520" y="225" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">LOW</text>
  <text x="730" y="172" font-size="11" fill="#6b7280" text-anchor="middle">HIGH</text>

  <!-- Signal 3: EN / RESET -->
  <text x="55" y="250" font-size="13" font-weight="bold" fill="#c0392b">EN / RESET</text>
  <text x="55" y="264" font-size="11" fill="#6b7280">Скидання чипа</text>
  <line x1="190" y1="255" x2="870" y2="255" stroke="#e5e7eb" stroke-width="1"/>
  <path d="M 190,240 L 310,240 L 310,270 L 450,270 C 480,270 510,252 540,243 L 590,240 L 870,240" stroke="#c0392b" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
  <text x="250" y="232" font-size="11" fill="#6b7280" text-anchor="middle">HIGH (3.3V)</text>
  <text x="380" y="285" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">RESET (0V)</text>
  <text x="730" y="232" font-size="11" fill="#6b7280" text-anchor="middle">HIGH (3.3V)</text>

  <!-- Signal 4: IO0 / GPIO0 -->
  <text x="55" y="310" font-size="13" font-weight="bold" fill="#27ae60">IO0 / GPIO0</text>
  <text x="55" y="324" font-size="11" fill="#6b7280">Boot Mode</text>
  <line x1="190" y1="315" x2="870" y2="315" stroke="#e5e7eb" stroke-width="1"/>
  <path d="M 190,300 L 450,300 L 450,330 L 590,330 L 590,300 L 870,300" stroke="#27ae60" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
  <text x="250" y="292" font-size="11" fill="#6b7280" text-anchor="middle">HIGH (3.3V)</text>
  <text x="520" y="345" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">BOOT MODE (0V)</text>
  <text x="730" y="292" font-size="11" fill="#6b7280" text-anchor="middle">HIGH (3.3V)</text>

  <!-- Sampling point annotation -->
  <circle cx="520" cy="248" r="5" fill="#27ae60" stroke="#ffffff" stroke-width="2"/>
  <line x1="520" y1="253" x2="520" y2="330" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="2,2"/>
  <circle cx="520" cy="330" r="4" fill="#27ae60"/>

  <rect x="470" y="104" width="100" height="28" fill="#ffffff" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="520" y="116" font-size="10" font-weight="bold" fill="#1e7e34" text-anchor="middle">Семплування IO0</text>
  <text x="520" y="126" font-size="10" fill="#1e7e34" text-anchor="middle">Фронт EN: IO0 = 0</text>

  <!-- Bottom Legend / Summary Box -->
  <rect x="40" y="385" width="880" height="55" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <rect x="60" y="395" width="12" height="12" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="2"/>
  <text x="80" y="405" font-size="12" fill="#1a1a1a">Принцип: Якщо IO0 утримується на рівні 0V у момент зростання EN, чип входить у режим програмування.</text>
  <rect x="60" y="415" width="12" height="12" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="2"/>
  <text x="80" y="425" font-size="12" fill="#1a1a1a">Таймінг: RC-ланцюг затримує відновлення EN, даючи транзисторам DTR/RTS час надійно встановити IO0 = LOW.</text>
</svg>
