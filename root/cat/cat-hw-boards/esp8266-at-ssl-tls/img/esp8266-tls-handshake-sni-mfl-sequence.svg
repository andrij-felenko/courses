<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-grey" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма рукостискання TLS Handshake у прошивці ESP8266 AT</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Передача розширень SNI та MFL (2048 Б) дозволяє пройти автентифікацію CA в умовах дефіциту DRAM</text>

  <!-- Lifelines -->
  <line x1="150" y1="115" x2="150" y2="512" stroke="#d0d7de" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="480" y1="115" x2="480" y2="512" stroke="#d0d7de" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="810" y1="115" x2="810" y2="512" stroke="#d0d7de" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Header Boxes -->
  <rect x="60" y="75" width="180" height="40" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="150" y="99" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Хост-контролер (Host MCU)</text>

  <rect x="390" y="75" width="180" height="40" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="99" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">ESP8266 (AT + mbedTLS)</text>

  <rect x="720" y="75" width="180" height="40" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="810" y="99" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">HTTPS / MQTTS Server</text>

  <!-- Sequence Step 1 -->
  <text x="315" y="137" font-size="12" fill="#1a1a1a" text-anchor="middle">1. AT+CIPSSLCCONF=1 (увімкнення валідації CA)</text>
  <line x1="150" y1="145" x2="472" y2="145" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <text x="315" y="163" font-size="12" fill="#6b7280" text-anchor="middle">OK</text>
  <line x1="480" y1="168" x2="158" y2="168" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-grey)"/>

  <!-- Sequence Step 2 -->
  <text x="315" y="192" font-size="12" fill="#1a1a1a" text-anchor="middle">2. AT+CIPSSLCSNI=0,"api.example.com" (SNI)</text>
  <line x1="150" y1="200" x2="472" y2="200" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <text x="315" y="218" font-size="12" fill="#6b7280" text-anchor="middle">OK</text>
  <line x1="480" y1="223" x2="158" y2="223" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-grey)"/>

  <!-- Sequence Step 3 -->
  <text x="315" y="250" font-size="12" fill="#1a1a1a" text-anchor="middle">3. AT+CIPSTART=0,"SSL","api.example.com",443</text>
  <line x1="150" y1="258" x2="472" y2="258" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Sequence Step 4 -->
  <text x="645" y="290" font-size="12" fill="#2457d6" text-anchor="middle">4. ClientHello (SNI="api.example.com", MFL=2048 B)</text>
  <line x1="480" y1="298" x2="802" y2="298" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Sequence Step 5 -->
  <text x="645" y="332" font-size="12" fill="#2457d6" text-anchor="middle">5. ServerHello, Certificate, ServerHelloDone</text>
  <line x1="810" y1="340" x2="488" y2="340" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Processing Box on ESP8266 -->
  <rect x="355" y="362" width="250" height="44" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="380" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Валідація CA у Flash-пам'яті</text>
  <text x="480" y="396" font-size="11" fill="#1a1a1a" text-anchor="middle">MFL=2048 Б -&gt; економія DRAM (~16 КБ)</text>

  <!-- Sequence Step 6 -->
  <text x="645" y="427" font-size="12" fill="#2457d6" text-anchor="middle">6. ClientKeyExchange, ChangeCipherSpec, Finished</text>
  <line x1="480" y1="435" x2="802" y2="435" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <text x="645" y="457" font-size="12" fill="#2457d6" text-anchor="middle">7. ChangeCipherSpec, Finished</text>
  <line x1="810" y1="465" x2="488" y2="465" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Sequence Step 7 -->
  <text x="315" y="492" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">8. CONNECT &amp; OK (TLS-сесію встановлено)</text>
  <line x1="480" y1="500" x2="158" y2="500" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Footer Banner -->
  <rect x="60" y="522" width="840" height="26" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="539" font-size="12" fill="#6b7280" text-anchor="middle">Примітка: Фрагментація MFL (2048 Б) запобігає помилці вичерпання купи -0x7200 (MBEDTLS_ERR_SSL_ALLOC_FAILED)</text>
</svg>
