<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Відвантаження SSL/TLS обчислень з Хост-МК на ESP8266 через UART</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Хост-мікроконтролер надсилає текстові AT-команди, а ESP8266 бере на себе TLS-рукостискання, шифрування та буферизацію</text>

  <!-- ЛІВА ПАНЕЛЬ: Хост-мікроконтролер -->
  <rect x="40" y="85" width="370" height="395" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="225" y="115" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Хост-мікроконтролер (MCU)</text>
  <text x="225" y="133" text-anchor="middle" font-size="12" fill="#6b7280">(STM32, AVR, PIC тощо)</text>

  <!-- Блок 1: Прикладна логіка -->
  <rect x="60" y="150" width="330" height="80" rx="6" ry="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="225" y="175" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Прикладна логіка пристрою</text>
  <text x="225" y="195" text-anchor="middle" font-size="12" fill="#27ae60">Формування даних та парсинг +IPD</text>
  <text x="225" y="213" text-anchor="middle" font-size="12" fill="#6b7280">Без криптографічних бібліотек</text>

  <!-- Блок 2: ОЗП -->
  <rect x="60" y="245" width="330" height="75" rx="6" ry="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="225" y="270" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Оперативна пам'ять RAM</text>
  <text x="225" y="290" text-anchor="middle" font-size="12" fill="#27ae60">Витрати: лише сотні байт (буфер UART)</text>
  <text x="225" y="308" text-anchor="middle" font-size="12" fill="#6b7280">Не потрібні 16 КБ для TLS-кадрів</text>

  <!-- Блок 3: Драйвер UART -->
  <rect x="60" y="335" width="330" height="125" rx="6" ry="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="225" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Драйвер UART / AT-команд</text>
  <text x="225" y="380" text-anchor="middle" font-size="12" fill="#2457d6">1. AT+CIPSTART="SSL","server",443</text>
  <text x="225" y="398" text-anchor="middle" font-size="12" fill="#2457d6">2. AT+CIPSEND=length</text>
  <text x="225" y="416" text-anchor="middle" font-size="12" fill="#2457d6">3. Обробка відкритого тексту з +IPD</text>

  <!-- ЦЕНТРАЛЬНА ЧАСТИНА: Стрілки та UART -->
  <!-- Стрілка вправо: TX (MCU -> ESP8266) -->
  <path d="M 410,210 L 540,210" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="475" y="193" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">TX: AT-команди</text>
  <text x="475" y="205" text-anchor="middle" font-size="10" fill="#6b7280">(відкритий текст)</text>

  <!-- Блок шини UART -->
  <rect x="430" y="275" width="90" height="40" rx="4" ry="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="475" y="293" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Шина UART</text>
  <text x="475" y="307" text-anchor="middle" font-size="10" fill="#6b7280">TXD / RXD</text>

  <!-- Стрілка вліво: RX (ESP8266 -> MCU) -->
  <path d="M 540,390 L 410,390" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="475" y="410" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">RX: OK / +IPD</text>
  <text x="475" y="423" text-anchor="middle" font-size="10" fill="#6b7280">(розшифровані дані)</text>

  <!-- ПРАВА ПАНЕЛЬ: Співпроцесор ESP8266 -->
  <rect x="550" y="85" width="370" height="395" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="735" y="115" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Модуль ESP8266 (AT-прошивка)</text>
  <text x="735" y="133" text-anchor="middle" font-size="12" fill="#6b7280">(Криптографічний співпроцесор)</text>

  <!-- Блок 1: Парсер AT -->
  <rect x="570" y="150" width="330" height="55" rx="6" ry="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="735" y="173" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Парсер AT-команд та FSM</text>
  <text x="735" y="193" text-anchor="middle" font-size="12" fill="#2457d6">Керування сесією, SNI, сертифікатами</text>

  <!-- Блок 2: Крипторушій -->
  <rect x="570" y="218" width="330" height="85" rx="6" ry="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="735" y="240" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Рушій mbedTLS / BearSSL</text>
  <text x="735" y="260" text-anchor="middle" font-size="12" fill="#c0392b">Рукостискання TLS 1.2 / ECDHE / AES</text>
  <text x="735" y="278" text-anchor="middle" font-size="12" fill="#6b7280">Перевірка X.509 сертифікатів з Flash (esp_ca)</text>

  <!-- Блок 3: Буфери DRAM та мережа -->
  <rect x="570" y="315" width="330" height="145" rx="6" ry="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="735" y="340" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">DRAM Буфери та Мережевий стек</text>
  <text x="735" y="360" text-anchor="middle" font-size="12" fill="#1a1a1a">16 КБ TLS Frame Buffer + lwIP TCP/IP</text>
  <line x1="590" y1="373" x2="880" y2="373" stroke="#d0d7de" stroke-width="1"/>
  <text x="735" y="395" text-anchor="middle" font-size="12" fill="#27ae60">Захищений шифрований канал TLS</text>
  <text x="735" y="415" text-anchor="middle" font-size="12" fill="#6b7280">Зашифрований Wi-Fi трафік до хмари</text>
  <text x="735" y="443" text-anchor="middle" font-size="11" font-style="italic" fill="#2457d6">Вихід у мережу Інтернет / Cloud Server</text>
</svg>
