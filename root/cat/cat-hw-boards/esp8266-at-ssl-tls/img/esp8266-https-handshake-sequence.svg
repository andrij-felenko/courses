<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Послідовність TLS-рукостискання та HTTPS-запиту в AT-прошивці ESP8266</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Хронологія AT+CIPSTART, mbedTLS-рукостискання, двофазного AT+CIPSEND та асинхронного кадру +IPD</text>

  <!-- Entity Header Boxes -->
  <rect x="70" y="70" width="180" height="40" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="160" y="94" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Зовнішній МК</text>

  <rect x="390" y="70" width="180" height="40" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="94" font-size="14" font-weight="700" fill="#2457d6" text-anchor="middle">ESP8266 (mbedTLS)</text>

  <rect x="710" y="70" width="180" height="40" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="800" y="94" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">HTTPS Сервер</text>

  <!-- Lifelines -->
  <line x1="160" y1="110" x2="160" y2="530" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="480" y1="110" x2="480" y2="530" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.5"/>
  <line x1="800" y1="110" x2="800" y2="530" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Phase 1: Connection & Handshake -->
  <text x="70" y="130" font-size="11" font-weight="700" fill="#6b7280">ФАЗА 1: З'ЄДНАННЯ ТА TLS-РУКОСТИСКАННЯ</text>

  <!-- Step 1 -->
  <text x="320" y="147" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">AT+CIPSTART="SSL","example.com",443</text>
  <line x1="160" y1="155" x2="472" y2="155" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Step 2a -->
  <text x="640" y="177" font-size="12" fill="#1a1a1a" text-anchor="middle">Client Hello (опція MFLN 2KB)</text>
  <line x1="480" y1="185" x2="792" y2="185" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>

  <!-- Step 2b -->
  <text x="640" y="207" font-size="12" fill="#1a1a1a" text-anchor="middle">Server Hello, Cert, Key Exchange</text>
  <line x1="800" y1="215" x2="488" y2="215" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>

  <!-- ESP Processing Box -->
  <rect x="390" y="230" width="180" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="250" font-size="11" font-weight="700" fill="#2457d6" text-anchor="middle">Перевірка CA та RSA-прискорення</text>

  <!-- Step 3 -->
  <text x="320" y="272" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">CONNECT OK / OK</text>
  <line x1="480" y1="280" x2="168" y2="280" stroke="#27ae60" stroke-width="2" stroke-dasharray="6,3" marker-end="url(#arr-green)"/>

  <!-- Divider 1 -->
  <line x1="70" y1="295" x2="890" y2="295" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Phase 2: Two-Phase Data Transmission -->
  <text x="70" y="312" font-size="11" font-weight="700" fill="#6b7280">ФАЗА 2: ДВОФАЗНЕ ПЕРЕДАВАННЯ (AT+CIPSEND)</text>

  <!-- Step 4 -->
  <text x="320" y="324" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">1. AT+CIPSEND=48 (оголошення розміру)</text>
  <line x1="160" y1="332" x2="472" y2="332" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Step 5 -->
  <text x="320" y="350" font-size="12" fill="#6b7280" text-anchor="middle">2. Запрошення &gt; (готовність до прийому)</text>
  <line x1="480" y1="358" x2="168" y2="358" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>

  <!-- Step 6 -->
  <text x="320" y="380" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">3. Передача 48 байт (GET /api HTTP/1.1...)</text>
  <line x1="160" y1="388" x2="472" y2="388" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-black)"/>

  <!-- Step 7 -->
  <text x="640" y="404" font-size="12" fill="#2457d6" text-anchor="middle">TLS-кадр (шифровані 48 байт)</text>
  <line x1="480" y1="412" x2="792" y2="412" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Step 8 -->
  <text x="320" y="414" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">SEND OK</text>
  <line x1="480" y1="422" x2="168" y2="422" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="6,3" marker-end="url(#arr-green)"/>

  <!-- Divider 2 -->
  <line x1="70" y1="437" x2="890" y2="437" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Phase 3: Response & Async Data Delivery -->
  <text x="70" y="454" font-size="11" font-weight="700" fill="#6b7280">ФАЗА 3: ПРИЙОМ ДЕШИФРОВАНОЇ ВІДПОВІДІ (+IPD)</text>

  <!-- Step 9 -->
  <text x="640" y="466" font-size="12" fill="#1a1a1a" text-anchor="middle">TLS Encrypted Response (HTTP 200 OK)</text>
  <line x1="800" y1="474" x2="488" y2="474" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>

  <!-- Step 10 -->
  <text x="320" y="496" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">+IPD,23:{"status":"ok"} (розшифрований кадр)</text>
  <line x1="480" y1="504" x2="168" y2="504" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
</svg>
