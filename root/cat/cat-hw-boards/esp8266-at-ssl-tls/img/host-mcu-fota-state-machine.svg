<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Скінченний автомат (FSM) мікроконтролера-хоста під час HTTPS FOTA</text>
  <text x="480" y="54" font-size="13" text-anchor="middle" fill="#6b7280">Послідовна обробка AT-команд, потоковий розбір кадрів +IPD через UART та підтвердження SHA-256 перед перезавантаженням</text>

  <!-- Початкова точка -->
  <circle cx="20" cy="145" r="6" fill="#2457d6"/>
  <text x="20" y="132" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Старт</text>
  <line x1="26" y1="145" x2="40" y2="145" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Стан 1: ІНІЦІАЛІЗАЦІЯ -->
  <rect x="40" y="100" width="150" height="90" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="115" y="122" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">1. ІНІЦІАЛІЗАЦІЯ</text>
  <text x="115" y="142" font-size="12" fill="#1a1a1a" text-anchor="middle">AT+CWJAP (Wi-Fi)</text>
  <text x="115" y="160" font-size="12" fill="#1a1a1a" text-anchor="middle">AT+CIPSSLCCONF</text>
  <text x="115" y="178" font-size="11" fill="#6b7280" text-anchor="middle">Конфігурація CA</text>

  <!-- Стрілка 1 -> 2 -->
  <line x1="190" y1="145" x2="240" y2="145" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="215" y="136" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">OK</text>

  <!-- Стан 2: TLS-З'ЄДНАННЯ -->
  <rect x="240" y="100" width="160" height="90" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="320" y="122" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">2. TLS-З'ЄДНАННЯ</text>
  <text x="320" y="142" font-size="12" fill="#1a1a1a" text-anchor="middle">AT+CIPSTART="SSL"</text>
  <text x="320" y="160" font-size="12" fill="#1a1a1a" text-anchor="middle">Handshake TLS 1.2</text>
  <text x="320" y="178" font-size="11" fill="#6b7280" text-anchor="middle">Перевірка сертифіката</text>

  <!-- Стрілка 2 -> 3 -->
  <line x1="400" y1="145" x2="460" y2="145" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="430" y="136" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">CONNECTED</text>

  <!-- Стан 3: HTTP GET ЗАПИТ -->
  <rect x="460" y="100" width="160" height="90" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="540" y="122" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">3. HTTP GET ЗАПИТ</text>
  <text x="540" y="142" font-size="12" fill="#1a1a1a" text-anchor="middle">AT+CIPSEND</text>
  <text x="540" y="160" font-size="12" fill="#1a1a1a" text-anchor="middle">GET /firmware.bin</text>
  <text x="540" y="178" font-size="11" fill="#6b7280" text-anchor="middle">Запит маніфесту</text>

  <!-- Стрілка 3 -> 4 -->
  <line x1="620" y1="145" x2="680" y2="145" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="650" y="136" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">HTTP 200 OK</text>

  <!-- Стан 4: ПОТОКОВИЙ РОЗБІР +IPD -->
  <rect x="680" y="100" width="240" height="90" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="800" y="122" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">4. ПОТОКОВИЙ РОЗБІР +IPD</text>
  <text x="800" y="142" font-size="12" fill="#1a1a1a" text-anchor="middle">+IPD,&lt;len&gt;:&lt;payload&gt;</text>
  <text x="800" y="160" font-size="12" fill="#1a1a1a" text-anchor="middle">Запис чанків у Flash host MCU</text>
  <text x="800" y="178" font-size="11" fill="#6b7280" text-anchor="middle">Скидання WDT + оновлення SHA</text>

  <!-- Стрілка 4 -> 5 -->
  <line x1="800" y1="190" x2="800" y2="250" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="812" y="224" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="start">Прийнято 100% (EOF)</text>

  <!-- Стан 5: ВАЛІДАЦІЯ ЦІЛІСНОСТІ -->
  <rect x="680" y="250" width="240" height="90" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="800" y="272" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">5. ВАЛІДАЦІЯ ЦІЛІСНОСТІ</text>
  <text x="800" y="292" font-size="12" fill="#1a1a1a" text-anchor="middle">Обчислення SHA-256 образу</text>
  <text x="800" y="310" font-size="12" fill="#1a1a1a" text-anchor="middle">Порівняння з маніфестом</text>
  <text x="800" y="328" font-size="11" fill="#6b7280" text-anchor="middle">Перевірка розміру бінарника</text>

  <!-- Стрілка 5 -> 6 (Успіх) -->
  <line x1="680" y1="295" x2="570" y2="295" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="625" y="286" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">SHA-256 OK</text>

  <!-- Стан 6: ЗАСТОСУВАННЯ ТА СКИД -->
  <rect x="350" y="250" width="220" height="90" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="460" y="272" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">6. ЗАСТОСУВАННЯ ТА СКИД</text>
  <text x="460" y="292" font-size="12" fill="#1a1a1a" text-anchor="middle">Встановлення прапорця Boot</text>
  <text x="460" y="310" font-size="12" fill="#1a1a1a" text-anchor="middle">Перемикання активного slot</text>
  <text x="460" y="328" font-size="11" fill="#27ae60" text-anchor="middle">System Reset (Reboot)</text>

  <!-- Стан 7: ОБРОБКА ПОМИЛОК (FAIL) -->
  <rect x="40" y="250" width="250" height="90" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="165" y="272" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">7. ОБРОБКА ПОМИЛОК (FAIL)</text>
  <text x="165" y="292" font-size="12" fill="#1a1a1a" text-anchor="middle">Очищення тимчасового розділу</text>
  <text x="165" y="310" font-size="12" fill="#1a1a1a" text-anchor="middle">Rollback на робочий образ</text>
  <text x="165" y="328" font-size="11" fill="#c0392b" text-anchor="middle">Затримка та повторна спроба</text>

  <!-- Перехід помилки: Стан 5 -> Стан 7 -->
  <path d="M800,340 L800,370 L165,370 L165,340" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <text x="480" y="385" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">SHA-256 Mismatch / Bad Size</text>

  <!-- Перехід помилки: Стан 2 -> Стан 7 -->
  <path d="M320,190 L320,222 L165,222 L165,250" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <text x="240" y="210" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">OOM / TLS Error / Timeout</text>

  <!-- Перехід повтору: Стан 7 -> Початок/Стан 1 -->
  <path d="M40,295 L18,295 L18,145 L40,145" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-gray)"/>
  <text x="25" y="220" font-size="11" fill="#6b7280" text-anchor="start">Retry</text>

  <!-- Нижні панелі -->
  <!-- Панель 1: Механіка UART та пам'яті -->
  <rect x="40" y="405" width="420" height="90" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="426" font-size="13" font-weight="bold" fill="#1a1a1a">Механіка UART та оперативної пам'яті Host MCU:</text>
  <text x="55" y="448" font-size="12" fill="#1a1a1a">• Буферизація чанків +IPD запобігає вичерпанню Heap (OOM)</text>
  <text x="55" y="468" font-size="12" fill="#1a1a1a">• Скидання WDT під час потокового запису бінарника у Flash</text>
  <text x="55" y="488" font-size="11" fill="#6b7280">• Обробка асинхронних статусів та помилок з'єднання UART</text>

  <!-- Панель 2: Гарантії безпеки -->
  <rect x="500" y="405" width="420" height="90" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="515" y="426" font-size="13" font-weight="bold" fill="#1a1a1a">Гарантії безпеки та цілісності (HTTPS FOTA):</text>
  <text x="515" y="448" font-size="12" fill="#1a1a1a">• L4/TLS перевіряє CA-сертифікат та ланцюжок довіри (MITM)</text>
  <text x="515" y="468" font-size="12" fill="#1a1a1a">• Валідація SHA-256 порівнює хеш образу з маніфестом</text>
  <text x="515" y="488" font-size="11" fill="#27ae60">• Завантажувач перемикає слот Flash лише при 100% збігу</text>
</svg>
