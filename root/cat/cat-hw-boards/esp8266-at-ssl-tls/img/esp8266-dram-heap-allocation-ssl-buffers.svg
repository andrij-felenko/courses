<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розподіл оперативної пам'яті DRAM в ESP8266 при TLS-з'єднанні</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Контекст mbedTLS вимагає понад 70% доступної купи, спричиняючи дефіцит RAM для нових сокетів</text>

  <!-- Top Overview Strip (Total DRAM = 80 KB) -->
  <rect x="40" y="80" width="880" height="44" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="44" y="84" width="480" height="36" rx="4" fill="#e5e7eb" stroke="#9ca3af"/>
  <text x="284" y="107" font-size="12" fill="#374151" text-anchor="middle">Системна пам'ять SDK / FreeRTOS / Stack (~44 кБ)</text>
  <rect x="528" y="84" width="388" height="36" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="722" y="107" font-size="12" font-weight="bold" fill="#1e40af" text-anchor="middle">Доступна динамічна купа DRAM (~36 кБ)</text>

  <!-- Container Panel for Heap Breakdown -->
  <rect x="40" y="145" width="880" height="325" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="60" y="172" font-size="14" font-weight="bold" fill="#1e293b">Деталізація використання динамічної купи DRAM (~36 кБ) під час активної TLS-сесії</text>

  <!-- Block 1: UART RX/TX Buffer -->
  <rect x="60" y="195" width="100" height="250" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="110" y="225" font-size="13" font-weight="bold" fill="#1e40af" text-anchor="middle">UART Буфер</text>
  <text x="110" y="245" font-size="12" fill="#2457d6" text-anchor="middle">~2–3 кБ</text>
  <text x="110" y="285" font-size="12" fill="#475569" text-anchor="middle">
    <tspan x="110" dy="0">Прийом та</tspan>
    <tspan x="110" dy="16">передача</tspan>
    <tspan x="110" dy="16">AT-команд</tspan>
    <tspan x="110" dy="16">і даних</tspan>
  </text>

  <!-- Block 2: LwIP PCB Socket -->
  <rect x="176" y="195" width="110" height="250" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="231" y="225" font-size="13" font-weight="bold" fill="#1e40af" text-anchor="middle">Сокет LwIP</text>
  <text x="231" y="245" font-size="12" fill="#2457d6" text-anchor="middle">~3–5 кБ</text>
  <text x="231" y="285" font-size="12" fill="#475569" text-anchor="middle">
    <tspan x="231" dy="0">Структура</tspan>
    <tspan x="231" dy="16">TCP PCB,</tspan>
    <tspan x="231" dy="16">буфери вікна</tspan>
    <tspan x="231" dy="16">та черга</tspan>
  </text>

  <!-- Block 3: mbedTLS Cryptographic Context (Main Heap Consumer) -->
  <rect x="302" y="195" width="450" height="250" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="527" y="225" font-size="14" font-weight="bold" fill="#900c3f" text-anchor="middle">Криптографічний контекст mbedTLS</text>
  <text x="527" y="247" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">~24–28 кБ (понад 70% доступної купи!)</text>

  <!-- Sub-box A: TLS In Buffer -->
  <rect x="318" y="265" width="130" height="160" rx="4" fill="#ffffff" stroke="#e74c3c" stroke-dasharray="3,3"/>
  <text x="383" y="288" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">TLS In Buffer</text>
  <text x="383" y="308" font-size="12" fill="#c0392b" text-anchor="middle">~6–16 кБ</text>
  <text x="383" y="335" font-size="12" fill="#6b7280" text-anchor="middle">Вхідні пакети,</text>
  <text x="383" y="353" font-size="12" fill="#6b7280" text-anchor="middle">сертифікати</text>

  <!-- Sub-box B: TLS Out Buffer -->
  <rect x="462" y="265" width="130" height="160" rx="4" fill="#ffffff" stroke="#e74c3c" stroke-dasharray="3,3"/>
  <text x="527" y="288" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">TLS Out Buffer</text>
  <text x="527" y="308" font-size="12" fill="#c0392b" text-anchor="middle">~4–6 кБ</text>
  <text x="527" y="335" font-size="12" fill="#6b7280" text-anchor="middle">Зашифровані</text>
  <text x="527" y="353" font-size="12" fill="#6b7280" text-anchor="middle">вихідні дані</text>

  <!-- Sub-box C: Crypto Keys & State -->
  <rect x="606" y="265" width="130" height="160" rx="4" fill="#ffffff" stroke="#e74c3c" stroke-dasharray="3,3"/>
  <text x="671" y="288" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Crypto Context</text>
  <text x="671" y="308" font-size="12" fill="#c0392b" text-anchor="middle">~4–6 кБ</text>
  <text x="671" y="335" font-size="12" fill="#6b7280" text-anchor="middle">Ключі RSA/ECC,</text>
  <text x="671" y="353" font-size="12" fill="#6b7280" text-anchor="middle">стан сесії TLS</text>

  <!-- Block 4: Free Heap Remaining -->
  <rect x="768" y="195" width="142" height="250" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="839" y="225" font-size="13" font-weight="bold" fill="#1e8449" text-anchor="middle">Вільна купа</text>
  <text x="839" y="245" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">~2–6 кБ</text>
  <text x="839" y="285" font-size="12" fill="#475569" text-anchor="middle">
    <tspan x="839" dy="0">Критичний</tspan>
    <tspan x="839" dy="16">залишок RAM.</tspan>
    <tspan x="839" dy="16">Друге TLS-</tspan>
    <tspan x="839" dy="16">з'єднання</tspan>
    <tspan x="839" dy="16">неможливе</tspan>
    <tspan x="839" dy="16">(ризик OOM)</tspan>
  </text>
</svg>
