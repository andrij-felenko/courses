<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схемотехніка підключення DIP-перемикачів: Pull-Up та Pull-Down</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Формування чітких логічних рівнів на вході мікроконтролера та шляхи струму в розімкненому й замкненому станах</text>

  <!-- LEFT MAIN PANEL: PULL-UP -->
  <rect x="30" y="70" width="435" height="465" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#2457d6">Схема Pull-Up (підтяжка до VCC)</text>

  <!-- Sub-box 1A: Pull-Up OPEN -->
  <rect x="45" y="115" width="195" height="405" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="142" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b7280">Розмікнено (OPEN)</text>
  <rect x="65" y="148" width="154" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="142" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Вхід GPIO: HIGH (VCC)</text>

  <!-- VCC Rail 1A -->
  <circle cx="142" cy="190" r="4" fill="#2457d6"/>
  <text x="142" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">VCC</text>
  <line x1="142" y1="194" x2="142" y2="210" stroke="#1a1a1a" stroke-width="1.8"/>

  <!-- Resistor R_pull 1A -->
  <rect x="132" y="210" width="20" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
  <text x="160" y="228" font-size="12" font-weight="bold" fill="#1a1a1a">R_pull</text>
  <text x="160" y="242" font-size="11" fill="#6b7280">10 кОм</text>
  <line x1="142" y1="250" x2="142" y2="280" stroke="#1a1a1a" stroke-width="1.8"/>

  <!-- Node Junction 1A -->
  <circle cx="142" cy="280" r="4" fill="#1a1a1a"/>
  <!-- Branch to GPIO -->
  <line x1="142" y1="280" x2="210" y2="280" stroke="#27ae60" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>
  <text x="180" y="272" font-size="11" font-weight="bold" fill="#27ae60">до GPIO</text>

  <!-- Wire down to DIP switch 1A -->
  <line x1="142" y1="280" x2="142" y2="310" stroke="#1a1a1a" stroke-width="1.8"/>

  <!-- DIP Switch OPEN 1A -->
  <circle cx="142" cy="310" r="3" fill="#1a1a1a"/>
  <line x1="142" y1="310" x2="156" y2="338" stroke="#c0392b" stroke-width="2.2"/>
  <circle cx="142" cy="350" r="3" fill="#1a1a1a"/>
  <text x="65" y="326" font-size="11" font-weight="bold" fill="#1a1a1a">DIP SW</text>
  <text x="65" y="340" font-size="11" fill="#c0392b">(Вимкнено)</text>

  <!-- Wire down to GND 1A -->
  <line x1="142" y1="350" x2="142" y2="375" stroke="#1a1a1a" stroke-width="1.8"/>
  <!-- GND Symbol 1A -->
  <line x1="130" y1="375" x2="154" y2="375" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="135" y1="380" x2="149" y2="380" stroke="#1a1a1a" stroke-width="1.8"/>
  <line x1="139" y1="385" x2="145" y2="385" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="142" y="400" text-anchor="middle" font-size="11" fill="#6b7280">GND</text>

  <!-- Descriptions 1A -->
  <text x="142" y="430" text-anchor="middle" font-size="11" fill="#6b7280">Струм підтягує вхід до VCC</text>
  <text x="142" y="446" text-anchor="middle" font-size="11" fill="#6b7280">Коло GND розімкнене</text>
  <text x="142" y="495" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Логічна 1 (HIGH)</text>


  <!-- Sub-box 1B: Pull-Up CLOSED -->
  <rect x="255" y="115" width="195" height="405" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="352" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b7280">Замкнено (CLOSED)</text>
  <rect x="275" y="148" width="154" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="352" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Вхід GPIO: LOW (GND)</text>

  <!-- VCC Rail 1B -->
  <circle cx="352" cy="190" r="4" fill="#2457d6"/>
  <text x="352" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">VCC</text>
  <line x1="352" y1="194" x2="352" y2="210" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arr-blue)"/>

  <!-- Resistor R_pull 1B -->
  <rect x="342" y="210" width="20" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
  <text x="370" y="228" font-size="12" font-weight="bold" fill="#1a1a1a">R_pull</text>
  <text x="370" y="242" font-size="11" fill="#6b7280">10 кОм</text>
  <line x1="352" y1="250" x2="352" y2="280" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arr-blue)"/>

  <!-- Node Junction 1B -->
  <circle cx="352" cy="280" r="4" fill="#1a1a1a"/>
  <!-- Branch to GPIO -->
  <line x1="352" y1="280" x2="420" y2="280" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arr-red)"/>
  <text x="390" y="272" font-size="11" font-weight="bold" fill="#c0392b">до GPIO</text>

  <!-- Wire down to DIP switch 1B -->
  <line x1="352" y1="280" x2="352" y2="310" stroke="#2457d6" stroke-width="2.2"/>

  <!-- DIP Switch CLOSED 1B -->
  <circle cx="352" cy="310" r="3" fill="#1a1a1a"/>
  <line x1="352" y1="310" x2="352" y2="350" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="352" cy="350" r="3" fill="#1a1a1a"/>
  <text x="275" y="326" font-size="11" font-weight="bold" fill="#1a1a1a">DIP SW</text>
  <text x="275" y="340" font-size="11" fill="#27ae60">(Увімкнено)</text>

  <!-- Wire down to GND 1B -->
  <line x1="352" y1="350" x2="352" y2="375" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arr-blue)"/>
  <!-- GND Symbol 1B -->
  <line x1="340" y1="375" x2="364" y2="375" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="345" y1="380" x2="359" y2="380" stroke="#1a1a1a" stroke-width="1.8"/>
  <line x1="349" y1="385" x2="355" y2="385" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="352" y="400" text-anchor="middle" font-size="11" fill="#6b7280">GND</text>

  <!-- Descriptions 1B -->
  <text x="352" y="430" text-anchor="middle" font-size="11" fill="#6b7280">Струм витоку: I = VCC / R</text>
  <text x="352" y="446" text-anchor="middle" font-size="11" fill="#6b7280">Потенціал входу = 0 В (GND)</text>
  <text x="352" y="495" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Логічний 0 (LOW)</text>



  <!-- RIGHT MAIN PANEL: PULL-DOWN -->
  <rect x="495" y="70" width="435" height="465" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="712" y="96" text-anchor="middle" font-size="15" font-weight="bold" fill="#2457d6">Схема Pull-Down (підтяжка до GND)</text>

  <!-- Sub-box 2A: Pull-Down OPEN -->
  <rect x="510" y="115" width="195" height="405" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="607" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b7280">Розмікнено (OPEN)</text>
  <rect x="530" y="148" width="154" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="607" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Вхід GPIO: LOW (GND)</text>

  <!-- VCC Rail 2A -->
  <circle cx="607" cy="190" r="4" fill="#2457d6"/>
  <text x="607" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">VCC</text>
  <line x1="607" y1="194" x2="607" y2="210" stroke="#1a1a1a" stroke-width="1.8"/>

  <!-- DIP Switch OPEN 2A -->
  <circle cx="607" cy="210" r="3" fill="#1a1a1a"/>
  <line x1="607" y1="210" x2="621" y2="238" stroke="#c0392b" stroke-width="2.2"/>
  <circle cx="607" cy="250" r="3" fill="#1a1a1a"/>
  <text x="530" y="226" font-size="11" font-weight="bold" fill="#1a1a1a">DIP SW</text>
  <text x="530" y="240" font-size="11" fill="#c0392b">(Вимкнено)</text>

  <!-- Wire down to Node 2A -->
  <line x1="607" y1="250" x2="607" y2="280" stroke="#1a1a1a" stroke-width="1.8"/>

  <!-- Node Junction 2A -->
  <circle cx="607" cy="280" r="4" fill="#1a1a1a"/>
  <!-- Branch to GPIO -->
  <line x1="607" y1="280" x2="675" y2="280" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <text x="645" y="272" font-size="11" font-weight="bold" fill="#c0392b">до GPIO</text>

  <!-- Resistor R_down 2A -->
  <line x1="607" y1="280" x2="607" y2="310" stroke="#1a1a1a" stroke-width="1.8"/>
  <rect x="597" y="310" width="20" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
  <text x="625" y="328" font-size="12" font-weight="bold" fill="#1a1a1a">R_down</text>
  <text x="625" y="342" font-size="11" fill="#6b7280">10 кОм</text>
  <line x1="607" y1="350" x2="607" y2="375" stroke="#1a1a1a" stroke-width="1.8"/>

  <!-- GND Symbol 2A -->
  <line x1="595" y1="375" x2="619" y2="375" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="600" y1="380" x2="614" y2="380" stroke="#1a1a1a" stroke-width="1.8"/>
  <line x1="604" y1="385" x2="610" y2="385" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="607" y="400" text-anchor="middle" font-size="11" fill="#6b7280">GND</text>

  <!-- Descriptions 2A -->
  <text x="607" y="430" text-anchor="middle" font-size="11" fill="#6b7280">Коло VCC розімкнене</text>
  <text x="607" y="446" text-anchor="middle" font-size="11" fill="#6b7280">Вхід утримується на GND</text>
  <text x="607" y="495" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Логічний 0 (LOW)</text>


  <!-- Sub-box 2B: Pull-Down CLOSED -->
  <rect x="720" y="115" width="195" height="405" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="817" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#6b7280">Замкнено (CLOSED)</text>
  <rect x="740" y="148" width="154" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="817" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Вхід GPIO: HIGH (VCC)</text>

  <!-- VCC Rail 2B -->
  <circle cx="817" cy="190" r="4" fill="#2457d6"/>
  <text x="817" y="182" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">VCC</text>
  <line x1="817" y1="194" x2="817" y2="210" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arr-blue)"/>

  <!-- DIP Switch CLOSED 2B -->
  <circle cx="817" cy="210" r="3" fill="#1a1a1a"/>
  <line x1="817" y1="210" x2="817" y2="250" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="817" cy="250" r="3" fill="#1a1a1a"/>
  <text x="740" y="226" font-size="11" font-weight="bold" fill="#1a1a1a">DIP SW</text>
  <text x="740" y="240" font-size="11" fill="#27ae60">(Увімкнено)</text>

  <!-- Wire down to Node 2B -->
  <line x1="817" y1="250" x2="817" y2="280" stroke="#2457d6" stroke-width="2.2"/>

  <!-- Node Junction 2B -->
  <circle cx="817" cy="280" r="4" fill="#1a1a1a"/>
  <!-- Branch to GPIO -->
  <line x1="817" y1="280" x2="885" y2="280" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="855" y="272" font-size="11" font-weight="bold" fill="#27ae60">до GPIO</text>

  <!-- Resistor R_down 2B -->
  <line x1="817" y1="280" x2="817" y2="310" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arr-blue)"/>
  <rect x="807" y="310" width="20" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
  <text x="835" y="328" font-size="12" font-weight="bold" fill="#1a1a1a">R_down</text>
  <text x="835" y="342" font-size="11" fill="#6b7280">10 кОм</text>
  <line x1="817" y1="350" x2="817" y2="375" stroke="#2457d6" stroke-width="2.2" marker-end="url(#arr-blue)"/>

  <!-- GND Symbol 2B -->
  <line x1="805" y1="375" x2="829" y2="375" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="810" y1="380" x2="824" y2="380" stroke="#1a1a1a" stroke-width="1.8"/>
  <line x1="814" y1="385" x2="820" y2="385" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="817" y="400" text-anchor="middle" font-size="11" fill="#6b7280">GND</text>

  <!-- Descriptions 2B -->
  <text x="817" y="430" text-anchor="middle" font-size="11" fill="#6b7280">Пряме підключення до VCC</text>
  <text x="817" y="446" text-anchor="middle" font-size="11" fill="#6b7280">Струм витоку: I = VCC / R</text>
  <text x="817" y="495" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Логічна 1 (HIGH)</text>
</svg>
