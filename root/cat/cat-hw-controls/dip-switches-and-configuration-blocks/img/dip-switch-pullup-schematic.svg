<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="480" y="36" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Принципова схема N-позиційного DIP-перемикача з підтяжкою Pull-Up</text>
  <text x="480" y="56" font-size="13" text-anchor="middle" fill="#6b7280">При замиканні важелів струм найгіршого випадку I_worst = N × (Vcc / R_pull) протікає через замкнені ключі</text>

  <!-- Left Panel: Schematic -->
  <rect x="30" y="80" width="540" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="50" y="105" font-size="14" font-weight="bold" fill="#1a1a1a">Схема підключення DIP-перемикача (Pull-Up)</text>

  <!-- VCC Rail -->
  <text x="45" y="144" font-size="13" font-weight="bold" fill="#c0392b">Vcc (+5V)</text>
  <line x1="110" y1="140" x2="450" y2="140" stroke="#c0392b" stroke-width="3"/>

  <!-- Channel 1 (SW1 - ON / CLOSED) -->
  <circle cx="120" cy="140" r="4" fill="#c0392b"/>
  <line x1="120" y1="140" x2="120" y2="165" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Resistor R1 -->
  <rect x="108" y="165" width="24" height="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="120" y="194" font-size="12" text-anchor="middle" fill="#2457d6">R1</text>
  <line x1="120" y1="215" x2="120" y2="250" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Current arrow R1 -->
  <line x1="120" y1="222" x2="120" y2="242" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="110" y="235" font-size="12" text-anchor="end" fill="#2457d6">I_1 = Vcc/R</text>
  <!-- Node D0 -->
  <circle cx="120" cy="250" r="4" fill="#1a1a1a"/>
  <line x1="120" y1="250" x2="150" y2="250" stroke="#1a1a1a" stroke-width="2"/>
  <text x="155" y="254" font-size="12" fill="#1a1a1a">D0</text>
  <!-- Switch SW1 (Closed / ON) -->
  <line x1="120" y1="250" x2="120" y2="285" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="120" cy="285" r="3" fill="#1a1a1a"/>
  <line x1="120" y1="285" x2="120" y2="335" stroke="#27ae60" stroke-width="3"/>
  <circle cx="120" cy="335" r="3" fill="#1a1a1a"/>
  <text x="125" y="314" font-size="12" fill="#27ae60">SW1 (ON)</text>
  <line x1="120" y1="335" x2="120" y2="370" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Channel 2 (SW2 - OFF / OPEN) -->
  <circle cx="210" cy="140" r="4" fill="#c0392b"/>
  <line x1="210" y1="140" x2="210" y2="165" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Resistor R2 -->
  <rect x="198" y="165" width="24" height="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="210" y="194" font-size="12" text-anchor="middle" fill="#2457d6">R2</text>
  <line x1="210" y1="215" x2="210" y2="250" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Node D1 -->
  <circle cx="210" cy="250" r="4" fill="#1a1a1a"/>
  <line x1="210" y1="250" x2="240" y2="250" stroke="#1a1a1a" stroke-width="2"/>
  <text x="245" y="254" font-size="12" fill="#1a1a1a">D1</text>
  <!-- Switch SW2 (Open / OFF) -->
  <line x1="210" y1="250" x2="210" y2="285" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="210" cy="285" r="3" fill="#1a1a1a"/>
  <line x1="210" y1="335" x2="225" y2="290" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="210" cy="335" r="3" fill="#1a1a1a"/>
  <text x="230" y="314" font-size="12" fill="#c0392b">SW2 (OFF)</text>
  <line x1="210" y1="335" x2="210" y2="370" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Channel 3 (SW3 - ON / CLOSED) -->
  <circle cx="300" cy="140" r="4" fill="#c0392b"/>
  <line x1="300" y1="140" x2="300" y2="165" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Resistor R3 -->
  <rect x="288" y="165" width="24" height="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="300" y="194" font-size="12" text-anchor="middle" fill="#2457d6">R3</text>
  <line x1="300" y1="215" x2="300" y2="250" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Node D2 -->
  <circle cx="300" cy="250" r="4" fill="#1a1a1a"/>
  <line x1="300" y1="250" x2="330" y2="250" stroke="#1a1a1a" stroke-width="2"/>
  <text x="335" y="254" font-size="12" fill="#1a1a1a">D2</text>
  <!-- Switch SW3 (Closed / ON) -->
  <line x1="300" y1="250" x2="300" y2="285" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="300" cy="285" r="3" fill="#1a1a1a"/>
  <line x1="300" y1="285" x2="300" y2="335" stroke="#27ae60" stroke-width="3"/>
  <circle cx="300" cy="335" r="3" fill="#1a1a1a"/>
  <text x="305" y="314" font-size="12" fill="#27ae60">SW3 (ON)</text>
  <line x1="300" y1="335" x2="300" y2="370" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Dots between Ch 3 and Ch 4 -->
  <text x="365" y="255" font-size="16" text-anchor="middle" fill="#6b7280">...</text>

  <!-- Channel 4 (SWN - ON / CLOSED) -->
  <circle cx="410" cy="140" r="4" fill="#c0392b"/>
  <line x1="410" y1="140" x2="410" y2="165" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Resistor RN -->
  <rect x="398" y="165" width="24" height="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="410" y="194" font-size="12" text-anchor="middle" fill="#2457d6">RN</text>
  <line x1="410" y1="215" x2="410" y2="250" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Node DN-1 -->
  <circle cx="410" cy="250" r="4" fill="#1a1a1a"/>
  <line x1="410" y1="250" x2="440" y2="250" stroke="#1a1a1a" stroke-width="2"/>
  <text x="445" y="254" font-size="12" fill="#1a1a1a">DN-1</text>
  <!-- Switch SWN (Closed / ON) -->
  <line x1="410" y1="250" x2="410" y2="285" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="410" cy="285" r="3" fill="#1a1a1a"/>
  <line x1="410" y1="285" x2="410" y2="335" stroke="#27ae60" stroke-width="3"/>
  <circle cx="410" cy="335" r="3" fill="#1a1a1a"/>
  <text x="415" y="314" font-size="12" fill="#27ae60">SWN (ON)</text>
  <line x1="410" y1="335" x2="410" y2="370" stroke="#1a1a1a" stroke-width="2"/>

  <!-- GND Rail -->
  <line x1="110" y1="370" x2="450" y2="370" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="260" y1="370" x2="260" y2="385" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="245" y1="385" x2="275" y2="385" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="250" y1="390" x2="270" y2="390" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="255" y1="395" x2="265" y2="395" stroke="#1a1a1a" stroke-width="2"/>
  <text x="260" y="415" font-size="12" text-anchor="middle" fill="#1a1a1a">GND (0V)</text>

  <!-- Right Panel: Parameters & Calculations -->
  <rect x="590" y="80" width="340" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="610" y="105" font-size="14" font-weight="bold" fill="#1a1a1a">Параметри та струми найгіршого випадку</text>

  <!-- Card 1: Logic levels -->
  <rect x="605" y="125" width="310" height="72" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="618" y="145" font-size="13" font-weight="bold" fill="#2457d6">Логічні рівні ліній (Pull-Up):</text>
  <text x="618" y="165" font-size="12" fill="#1a1a1a">• OFF (відкрито): V_out = Vcc, I_static = 0</text>
  <text x="618" y="183" font-size="12" fill="#1a1a1a">• ON (замкнено): V_out = 0V, I_line = Vcc / R</text>

  <!-- Card 2: Worst Case Formula -->
  <rect x="605" y="210" width="310" height="72" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="618" y="230" font-size="13" font-weight="bold" fill="#c0392b">Найгірший випадок (Усі N замкнені):</text>
  <text x="618" y="250" font-size="12" fill="#1a1a1a">• I_worst = N × (Vcc / R_pull)</text>
  <text x="618" y="268" font-size="12" fill="#1a1a1a">• P_worst = Vcc × I_worst</text>

  <!-- Card 3: Numerical Example -->
  <rect x="605" y="295" width="310" height="120" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="618" y="316" font-size="13" font-weight="bold" fill="#27ae60">Приклад розрахунку (N=8, 10kΩ, 5V):</text>
  <text x="618" y="336" font-size="12" fill="#1a1a1a">• Струм 1 лінії: I_line = 5V / 10kΩ = 0.5 mA</text>
  <text x="618" y="356" font-size="12" fill="#1a1a1a">• Сумарний струм: I_worst = 8 × 0.5 mA = 4.0 mA</text>
  <text x="618" y="376" font-size="12" fill="#1a1a1a">• Потужність: P_worst = 5V × 4.0 mA = 20 mW</text>
  <text x="618" y="396" font-size="12" fill="#27ae60">• Рекомендація: R_pull = 10kΩ..47kΩ</text>
</svg>
