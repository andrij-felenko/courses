<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Конструкція та види DIP-перемикачів і джамперних колодок</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Зіставлення кінематики контактів слайдових, рокерних, піаніно-масивів та штирових джамперів</text>

  <!-- Panel 1: Slide DIP -->
  <rect x="20" y="75" width="215" height="425" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <rect x="30" y="85" width="195" height="30" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="127" y="105" font-size="14" font-weight="700" fill="#2457d6" text-anchor="middle">1. Слайдовий (Slide)</text>

  <rect x="45" y="130" width="165" height="180" fill="white" stroke="#b0b7be" stroke-width="1.5" rx="6"/>
  <rect x="60" y="145" width="135" height="40" fill="#f4f6f8" stroke="#d0d7de" rx="3"/>
  <rect x="75" y="148" width="45" height="34" fill="#2457d6" rx="3"/>
  <path d="M125 165 L180 165" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  <text x="127" y="202" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Лінійний зсув</text>

  <line x1="75" y1="290" x2="75" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="75" cy="230" r="4" fill="#ffd700" stroke="#1a1a1a"/>
  <line x1="180" y1="290" x2="180" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="180" cy="230" r="4" fill="#ffd700" stroke="#1a1a1a"/>
  <path d="M97 182 L97 225 L175 225" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <text x="127" y="275" font-size="12" fill="#6b7280" text-anchor="middle">Ковзний місток</text>

  <line x1="75" y1="310" x2="75" y2="330" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="180" y1="310" x2="180" y2="330" stroke="#1a1a1a" stroke-width="2.5"/>

  <rect x="30" y="340" width="195" height="145" fill="white" stroke="#d0d7de" rx="4"/>
  <text x="40" y="362" font-size="12" fill="#1a1a1a">• Принцип: ковзання</text>
  <text x="40" y="382" font-size="12" fill="#1a1a1a">• Рух: прямолінійний</text>
  <text x="40" y="402" font-size="12" fill="#1a1a1a">• Захист від зсуву: високий</text>
  <text x="40" y="422" font-size="12" fill="#1a1a1a">• Зусилля: горизонтальне</text>
  <text x="40" y="442" font-size="12" fill="#1a1a1a">• Монтаж: TTH / SMD</text>
  <text x="40" y="462" font-size="12" fill="#1a1a1a">• Позиції: ON / OFF</text>

  <!-- Panel 2: Rocker DIP -->
  <rect x="255" y="75" width="215" height="425" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <rect x="265" y="85" width="195" height="30" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="362" y="105" font-size="14" font-weight="700" fill="#2457d6" text-anchor="middle">2. Рокерний (Rocker)</text>

  <rect x="280" y="130" width="165" height="180" fill="white" stroke="#b0b7be" stroke-width="1.5" rx="6"/>
  <rect x="295" y="145" width="135" height="40" fill="#f4f6f8" stroke="#d0d7de" rx="3"/>
  <polygon points="305,178 362,152 420,165 362,175" fill="#2457d6"/>
  <line x1="320" y1="135" x2="320" y2="160" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  <text x="362" y="202" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Кутове перекидання</text>

  <line x1="362" y1="220" x2="362" y2="255" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="315" y1="248" x2="410" y2="228" stroke="#2457d6" stroke-width="3"/>
  <line x1="315" y1="290" x2="315" y2="252" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="315" cy="252" r="4" fill="#ffd700" stroke="#1a1a1a"/>
  <line x1="410" y1="290" x2="410" y2="252" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="410" cy="252" r="4" fill="#ffd700" stroke="#1a1a1a"/>
  <text x="362" y="275" font-size="12" fill="#6b7280" text-anchor="middle">Перекидна ламель</text>

  <line x1="315" y1="310" x2="315" y2="330" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="410" y1="310" x2="410" y2="330" stroke="#1a1a1a" stroke-width="2.5"/>

  <rect x="265" y="340" width="195" height="145" fill="white" stroke="#d0d7de" rx="4"/>
  <text x="275" y="362" font-size="12" fill="#1a1a1a">• Принцип: перекидання</text>
  <text x="275" y="382" font-size="12" fill="#1a1a1a">• Рух: важеля на осі</text>
  <text x="275" y="402" font-size="12" fill="#1a1a1a">• Тактильний відгук: чіткий</text>
  <text x="275" y="422" font-size="12" fill="#1a1a1a">• Зусилля: вертикальне</text>
  <text x="275" y="442" font-size="12" fill="#1a1a1a">• Клавішний контакт</text>
  <text x="275" y="462" font-size="12" fill="#1a1a1a">• Стандарт: 2.54 мм</text>

  <!-- Panel 3: Piano DIP -->
  <rect x="490" y="75" width="215" height="425" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <rect x="500" y="85" width="195" height="30" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="597" y="105" font-size="14" font-weight="700" fill="#2457d6" text-anchor="middle">3. Піаніно (Piano)</text>

  <rect x="515" y="130" width="165" height="180" fill="white" stroke="#b0b7be" stroke-width="1.5" rx="6"/>
  <rect x="525" y="145" width="40" height="50" fill="#2457d6" rx="4"/>
  <line x1="545" y1="135" x2="545" y2="155" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  <text x="597" y="202" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Фронтальний доступ</text>

  <path d="M545 195 L545 250 L640 250" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="545" y1="290" x2="545" y2="255" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="545" cy="255" r="4" fill="#ffd700" stroke="#1a1a1a"/>
  <line x1="640" y1="290" x2="640" y2="255" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="640" cy="255" r="4" fill="#ffd700" stroke="#1a1a1a"/>
  <text x="597" y="275" font-size="12" fill="#6b7280" text-anchor="middle">Бічний важіль</text>

  <line x1="545" y1="310" x2="545" y2="330" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="640" y1="310" x2="640" y2="330" stroke="#1a1a1a" stroke-width="2.5"/>

  <rect x="500" y="340" width="195" height="145" fill="white" stroke="#d0d7de" rx="4"/>
  <text x="510" y="362" font-size="12" fill="#1a1a1a">• Доступ: скраю плати</text>
  <text x="510" y="382" font-size="12" fill="#1a1a1a">• Перемикання з торця</text>
  <text x="510" y="402" font-size="12" fill="#1a1a1a">• Зручно для корпусів</text>
  <text x="510" y="422" font-size="12" fill="#1a1a1a">• Фронтальна орієнтація</text>
  <text x="510" y="442" font-size="12" fill="#1a1a1a">• Монтаж: TTH / SMD</text>
  <text x="510" y="462" font-size="12" fill="#1a1a1a">• Гібридна кінематика</text>

  <!-- Panel 4: Jumper Block -->
  <rect x="725" y="75" width="215" height="425" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <rect x="735" y="85" width="195" height="30" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="832" y="105" font-size="14" font-weight="700" fill="#2457d6" text-anchor="middle">4. Джамперний блок</text>

  <rect x="750" y="130" width="165" height="180" fill="white" stroke="#b0b7be" stroke-width="1.5" rx="6"/>
  <rect x="760" y="245" width="145" height="35" fill="#333333" rx="3"/>
  <line x1="785" y1="175" x2="785" y2="285" stroke="#d4af37" stroke-width="5"/>

  <!-- Pin 2 split around text at y=218 -->
  <line x1="832" y1="175" x2="832" y2="200" stroke="#d4af37" stroke-width="5"/>
  <line x1="832" y1="232" x2="832" y2="285" stroke="#d4af37" stroke-width="5"/>

  <line x1="880" y1="175" x2="880" y2="285" stroke="#d4af37" stroke-width="5"/>
  <rect x="773" y="150" width="69" height="55" fill="#2457d6" rx="4"/>
  <rect x="779" y="156" width="57" height="14" fill="#ffd700" stroke="#b8860b" stroke-width="1"/>
  <line x1="807" y1="125" x2="807" y2="145" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  <text x="832" y="218" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Знімний шунт (Jumper)</text>

  <line x1="785" y1="310" x2="785" y2="330" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="832" y1="310" x2="832" y2="330" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="880" y1="310" x2="880" y2="330" stroke="#1a1a1a" stroke-width="2.5"/>

  <rect x="735" y="340" width="195" height="145" fill="white" stroke="#d0d7de" rx="4"/>
  <text x="745" y="362" font-size="12" fill="#1a1a1a">• Штирові планки (Header)</text>
  <text x="745" y="382" font-size="12" fill="#1a1a1a">• Металевий шунт у капсулі</text>
  <text x="745" y="402" font-size="12" fill="#1a1a1a">• Крок штирів: 2.54 мм</text>
  <text x="745" y="422" font-size="12" fill="#1a1a1a">• Комутація 2 або 3 пинів</text>
  <text x="745" y="442" font-size="12" fill="#1a1a1a">• Скидання Clear CMOS</text>
  <text x="745" y="462" font-size="12" fill="#1a1a1a">• Низька собівартість</text>
</svg>
