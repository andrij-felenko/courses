<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Побітовий розбір конфігураційного байта DIP-перемикачів</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Формування байта зі станів GPIO та витягнення бітових полів за допомогою масок і зсувів</text>

  <!-- Section 1: GPIO Input & Byte Assembly Panel -->
  <rect x="40" y="75" width="880" height="85" rx="6" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="55" y="96" font-size="13" font-weight="bold" fill="#1a1a1a">1. Вхідні сигнали GPIO з підтяжкою (PULLUP):</text>

  <!-- GPIO Pin Badges B7..B0 -->
  <!-- B7 -->
  <rect x="340" y="108" width="55" height="38" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="367" y="123" font-size="11" fill="#6b7280" text-anchor="middle">GPIO7</text>
  <text x="367" y="139" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">HIGH</text>

  <!-- B6 -->
  <rect x="410" y="108" width="55" height="38" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="437" y="123" font-size="11" fill="#6b7280" text-anchor="middle">GPIO6</text>
  <text x="437" y="139" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">HIGH</text>

  <!-- B5 -->
  <rect x="480" y="108" width="55" height="38" rx="4" fill="#fbeee6" stroke="#d35400"/>
  <text x="507" y="123" font-size="11" fill="#d35400" text-anchor="middle">GPIO5</text>
  <text x="507" y="139" font-size="12" font-weight="bold" fill="#d35400" text-anchor="middle">LOW</text>

  <!-- B4 -->
  <rect x="550" y="108" width="55" height="38" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="577" y="123" font-size="11" fill="#27ae60" text-anchor="middle">GPIO4</text>
  <text x="577" y="139" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">LOW</text>

  <!-- B3 -->
  <rect x="620" y="108" width="55" height="38" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="647" y="123" font-size="11" fill="#6b7280" text-anchor="middle">GPIO3</text>
  <text x="647" y="139" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">HIGH</text>

  <!-- B2 -->
  <rect x="690" y="108" width="55" height="38" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="717" y="123" font-size="11" fill="#2457d6" text-anchor="middle">GPIO2</text>
  <text x="717" y="139" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">LOW</text>

  <!-- B1 -->
  <rect x="760" y="108" width="55" height="38" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="787" y="123" font-size="11" fill="#6b7280" text-anchor="middle">GPIO1</text>
  <text x="787" y="139" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">HIGH</text>

  <!-- B0 -->
  <rect x="830" y="108" width="55" height="38" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="857" y="123" font-size="11" fill="#2457d6" text-anchor="middle">GPIO0</text>
  <text x="857" y="139" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">LOW</text>


  <!-- Section 2: 8-Bit Configuration Register Panel -->
  <rect x="40" y="175" width="880" height="110" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="55" y="196" font-size="13" font-weight="bold" fill="#1a1a1a">2. Конфігураційний байт (raw_byte = 0x35 = 0b00110101):</text>

  <!-- Bit Cells B7..B0 -->
  <!-- B7 -->
  <text x="190" y="212" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="middle">B7 (Res)</text>
  <rect x="152" y="218" width="76" height="42" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="190" y="244" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0</text>

  <!-- B6 -->
  <text x="278" y="212" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="middle">B6 (Res)</text>
  <rect x="240" y="218" width="76" height="42" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="278" y="244" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0</text>

  <!-- B5 -->
  <text x="366" y="212" font-size="11" font-weight="bold" fill="#d35400" text-anchor="middle">B5 (Parity)</text>
  <rect x="328" y="218" width="76" height="42" rx="4" fill="#fbeee6" stroke="#d35400" stroke-width="1.5"/>
  <text x="366" y="244" font-size="16" font-weight="bold" fill="#d35400" text-anchor="middle">1</text>

  <!-- B4 -->
  <text x="454" y="212" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">B4 (Debug)</text>
  <rect x="416" y="218" width="76" height="42" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="454" y="244" font-size="16" font-weight="bold" fill="#27ae60" text-anchor="middle">1</text>

  <!-- B3 -->
  <text x="542" y="212" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="middle">B3 (CAN)</text>
  <rect x="504" y="218" width="76" height="42" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="542" y="244" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0</text>

  <!-- B2 -->
  <text x="630" y="212" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">B2 (I2C2)</text>
  <rect x="592" y="218" width="76" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="630" y="244" font-size="16" font-weight="bold" fill="#2457d6" text-anchor="middle">1</text>

  <!-- B1 -->
  <text x="718" y="212" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">B1 (I2C1)</text>
  <rect x="680" y="218" width="76" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="718" y="244" font-size="16" font-weight="bold" fill="#2457d6" text-anchor="middle">0</text>

  <!-- B0 -->
  <text x="806" y="212" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">B0 (I2C0)</text>
  <rect x="768" y="218" width="76" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="806" y="244" font-size="16" font-weight="bold" fill="#2457d6" text-anchor="middle">1</text>

  <!-- Group Labels Below Cells -->
  <text x="366" y="276" font-size="11" font-weight="bold" fill="#d35400" text-anchor="middle">Parity</text>
  <text x="454" y="276" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Debug Flag</text>
  <text x="542" y="276" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="middle">CAN Spd</text>

  <line x1="592" y1="265" x2="844" y2="265" stroke="#2457d6" stroke-width="1.5"/>
  <text x="718" y="278" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">I2C Адреса (Поле ADDR[2:0])</text>


  <!-- Section 3: Bitmask Extraction Operations (3 Cards) -->

  <!-- Card 1: I2C Address Extraction -->
  <rect x="40" y="300" width="280" height="235" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="180" y="323" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Виділення I2C Адреси</text>
  <text x="180" y="340" font-size="11" fill="#6b7280" text-anchor="middle">Біти 0..2 (Маска 0x07)</text>

  <!-- Formula 1 -->
  <rect x="55" y="348" width="250" height="28" rx="4" fill="white" stroke="#2457d6"/>
  <text x="180" y="366" font-size="12" font-weight="bold" font-family="monospace" fill="#1a1a1a" text-anchor="middle">addr = raw_byte &amp; 0x07</text>

  <!-- Bit Operation Table 1 -->
  <text x="65" y="396" font-size="11" font-family="monospace" fill="#6b7280">raw_byte : 0b 0011 0101</text>
  <text x="65" y="414" font-size="11" font-family="monospace" fill="#2457d6">&amp; MASK   : 0b 0000 0111</text>
  <line x1="65" y1="422" x2="295" y2="422" stroke="#d0d7de" stroke-width="1"/>
  <text x="65" y="438" font-size="11" font-weight="bold" font-family="monospace" fill="#27ae60">= Result : 0b 0000 0101</text>
  <text x="65" y="456" font-size="11" fill="#6b7280">Значення  : 0x05 (5)</text>

  <!-- Result Box 1 -->
  <rect x="55" y="475" width="250" height="42" rx="4" fill="white" stroke="#27ae60" stroke-width="1"/>
  <text x="180" y="492" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">I2C Адреса = 0x05 (5)</text>
  <text x="180" y="508" font-size="11" fill="#6b7280" text-anchor="middle">Зсув не потрібен (біти 0..2)</text>


  <!-- Card 2: Debug Mode Extraction -->
  <rect x="340" y="300" width="280" height="235" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="323" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Виділення Debug Flag</text>
  <text x="480" y="340" font-size="11" fill="#6b7280" text-anchor="middle">Біт 4 (Маска 0x10, зсув &gt;&gt; 4)</text>

  <!-- Formula 2 -->
  <rect x="355" y="348" width="250" height="28" rx="4" fill="white" stroke="#27ae60"/>
  <text x="480" y="366" font-size="11" font-weight="bold" font-family="monospace" fill="#1a1a1a" text-anchor="middle">dbg = (raw_byte &amp; 0x10) &gt;&gt; 4</text>

  <!-- Bit Operation Table 2 -->
  <text x="365" y="396" font-size="11" font-family="monospace" fill="#6b7280">raw_byte : 0b 0011 0101</text>
  <text x="365" y="414" font-size="11" font-family="monospace" fill="#27ae60">&amp; MASK   : 0b 0001 0000</text>
  <line x1="365" y1="422" x2="595" y2="422" stroke="#d0d7de" stroke-width="1"/>
  <text x="365" y="438" font-size="11" font-weight="bold" font-family="monospace" fill="#27ae60">&gt;&gt; 4     : 0b 0000 0001</text>
  <text x="365" y="456" font-size="11" fill="#6b7280">Значення  : 1 (True)</text>

  <!-- Result Box 2 -->
  <rect x="355" y="475" width="250" height="42" rx="4" fill="white" stroke="#27ae60" stroke-width="1"/>
  <text x="480" y="492" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Debug = УВІМКНЕНО (1)</text>
  <text x="480" y="508" font-size="11" fill="#6b7280" text-anchor="middle">Режим відлагодження активовано</text>


  <!-- Card 3: CAN Speed Extraction -->
  <rect x="640" y="300" width="280" height="235" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="780" y="323" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Виділення Швидкості CAN</text>
  <text x="780" y="340" font-size="11" fill="#6b7280" text-anchor="middle">Біт 3 (Маска 0x08, зсув &gt;&gt; 3)</text>

  <!-- Formula 3 -->
  <rect x="655" y="348" width="250" height="28" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="780" y="366" font-size="11" font-weight="bold" font-family="monospace" fill="#1a1a1a" text-anchor="middle">spd = (raw_byte &amp; 0x08) &gt;&gt; 3</text>

  <!-- Bit Operation Table 3 -->
  <text x="665" y="396" font-size="11" font-family="monospace" fill="#6b7280">raw_byte : 0b 0011 0101</text>
  <text x="665" y="414" font-size="11" font-family="monospace" fill="#6b7280">&amp; MASK   : 0b 0000 1000</text>
  <line x1="665" y1="422" x2="895" y2="422" stroke="#d0d7de" stroke-width="1"/>
  <text x="665" y="438" font-size="11" font-weight="bold" font-family="monospace" fill="#1a1a1a">&gt;&gt; 3     : 0b 0000 0000</text>
  <text x="665" y="456" font-size="11" fill="#6b7280">Значення  : 0 (500 kbps)</text>

  <!-- Result Box 3 -->
  <rect x="655" y="475" width="250" height="42" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="780" y="492" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">CAN Speed = 500 kbps (0)</text>
  <text x="780" y="508" font-size="11" fill="#6b7280" text-anchor="middle">0 = 500 kbps, 1 = 1 Mbps</text>
</svg>
