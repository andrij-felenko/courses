<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-left-blue" markerWidth="9" markerHeight="9" refX="1.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-right-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Header -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принципова схема модуля апаратного конфігурування</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Мультиплексування 8-позиційного DIP-перемикача та джамперного блоку через зсувний регістр 74HC165</text>

  <!-- PANEL 1: DIP-перемикач & Джампери -->
  <rect x="30" y="85" width="180" height="445" fill="#f4f6f8" stroke="#d0d7de" rx="8"/>
  <text x="120" y="110" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">DIP-перемикач &amp; Джампери</text>

  <!-- DIP Switch SW1 Box -->
  <rect x="45" y="125" width="150" height="290" fill="white" stroke="#d0d7de" rx="6"/>
  <text x="120" y="145" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">SW1 (8-pos DIP)</text>

  <!-- GND Rail inside DIP Box -->
  <line x1="60" y1="170" x2="60" y2="400" stroke="#1a1a1a" stroke-width="2"/>
  <!-- GND Symbol at GND Rail -->
  <line x1="50" y1="400" x2="70" y2="400" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="54" y1="404" x2="66" y2="404" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="58" y1="408" x2="62" y2="408" stroke="#1a1a1a" stroke-width="1"/>

  <!-- 8 DIP Switches (SW0 to SW7) -->
  <!-- D0 (y=190) -->
  <line x1="60" y1="190" x2="80" y2="190" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="80" cy="190" r="2.5" fill="#1a1a1a"/>
  <line x1="80" y1="190" x2="102" y2="184" stroke="#2457d6" stroke-width="2"/>
  <circle cx="105" cy="190" r="2.5" fill="#1a1a1a"/>
  <text x="135" y="184" font-size="12" fill="#6b7280">SW0</text>
  <line x1="105" y1="190" x2="195" y2="190" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- D1 (y=220) -->
  <line x1="60" y1="220" x2="80" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="80" cy="220" r="2.5" fill="#1a1a1a"/>
  <line x1="80" y1="220" x2="105" y2="220" stroke="#27ae60" stroke-width="2"/>
  <circle cx="105" cy="220" r="2.5" fill="#1a1a1a"/>
  <text x="135" y="214" font-size="12" fill="#6b7280">SW1</text>
  <line x1="105" y1="220" x2="195" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- D2 (y=250) -->
  <line x1="60" y1="250" x2="80" y2="250" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="80" cy="250" r="2.5" fill="#1a1a1a"/>
  <line x1="80" y1="250" x2="102" y2="244" stroke="#2457d6" stroke-width="2"/>
  <circle cx="105" cy="250" r="2.5" fill="#1a1a1a"/>
  <text x="135" y="244" font-size="12" fill="#6b7280">SW2</text>
  <line x1="105" y1="250" x2="195" y2="250" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- D3 (y=280) -->
  <line x1="60" y1="280" x2="80" y2="280" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="80" cy="280" r="2.5" fill="#1a1a1a"/>
  <line x1="80" y1="280" x2="102" y2="274" stroke="#2457d6" stroke-width="2"/>
  <circle cx="105" cy="280" r="2.5" fill="#1a1a1a"/>
  <text x="135" y="274" font-size="12" fill="#6b7280">SW3</text>
  <line x1="105" y1="280" x2="195" y2="280" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- D4 (y=310) -->
  <line x1="60" y1="310" x2="80" y2="310" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="80" cy="310" r="2.5" fill="#1a1a1a"/>
  <line x1="80" y1="310" x2="105" y2="310" stroke="#27ae60" stroke-width="2"/>
  <circle cx="105" cy="310" r="2.5" fill="#1a1a1a"/>
  <text x="135" y="304" font-size="12" fill="#6b7280">SW4</text>
  <line x1="105" y1="310" x2="195" y2="310" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- D5 (y=340) -->
  <line x1="60" y1="340" x2="80" y2="340" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="80" cy="340" r="2.5" fill="#1a1a1a"/>
  <line x1="80" y1="340" x2="102" y2="334" stroke="#2457d6" stroke-width="2"/>
  <circle cx="105" cy="340" r="2.5" fill="#1a1a1a"/>
  <text x="135" y="334" font-size="12" fill="#6b7280">SW5</text>
  <line x1="105" y1="340" x2="195" y2="340" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- D6 (y=370) -->
  <line x1="60" y1="370" x2="80" y2="370" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="80" cy="370" r="2.5" fill="#1a1a1a"/>
  <line x1="80" y1="370" x2="105" y2="370" stroke="#27ae60" stroke-width="2"/>
  <circle cx="105" cy="370" r="2.5" fill="#1a1a1a"/>
  <text x="135" y="364" font-size="12" fill="#6b7280">SW6</text>
  <line x1="105" y1="370" x2="195" y2="370" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- D7 (y=400) -->
  <line x1="60" y1="400" x2="80" y2="400" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="80" cy="400" r="2.5" fill="#1a1a1a"/>
  <line x1="80" y1="400" x2="102" y2="394" stroke="#2457d6" stroke-width="2"/>
  <circle cx="105" cy="400" r="2.5" fill="#1a1a1a"/>
  <text x="135" y="394" font-size="12" fill="#6b7280">SW7</text>
  <line x1="105" y1="400" x2="195" y2="400" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Jumper Block JP1/JP2 Box -->
  <rect x="45" y="425" width="150" height="90" fill="white" stroke="#d0d7de" rx="6"/>
  <text x="120" y="445" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">JP1 / JP2 (Джампери)</text>

  <!-- JP1 (Addr) -->
  <text x="55" y="472" font-size="12" fill="#1a1a1a">JP1 (Addr)</text>
  <circle cx="140" cy="468" r="3" fill="#1a1a1a"/>
  <circle cx="165" cy="468" r="3" fill="#1a1a1a"/>
  <rect x="134" y="461" width="34" height="14" fill="#27ae60" rx="3"/>
  <text x="151" y="472" font-size="12" font-weight="bold" fill="white" text-anchor="middle">ON</text>

  <!-- JP2 (Mode) -->
  <text x="55" y="502" font-size="12" fill="#1a1a1a">JP2 (Mode)</text>
  <circle cx="140" cy="498" r="3" fill="#1a1a1a"/>
  <circle cx="165" cy="498" r="3" fill="#1a1a1a"/>
  <text x="180" y="502" font-size="12" fill="#6b7280">OFF</text>

  <!-- PANEL 2: Підтяжка Pull-Up -->
  <rect x="230" y="85" width="150" height="445" fill="#f4f6f8" stroke="#d0d7de" rx="8"/>
  <text x="305" y="110" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Підтяжка Pull-Up</text>

  <!-- RN1 Resistor Box -->
  <rect x="245" y="125" width="120" height="390" fill="white" stroke="#d0d7de" rx="6"/>
  <text x="305" y="142" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">RN1 (10 kΩ)</text>

  <!-- VCC Rail inside RN1 -->
  <line x1="260" y1="172" x2="350" y2="172" stroke="#c0392b" stroke-width="2"/>
  <text x="305" y="165" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+3.3V (VCC)</text>

  <!-- Resistor Branches R0..R7 -->
  <!-- R0 (y=190) -->
  <line x1="305" y1="172" x2="305" y2="182" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="298" y="182" width="14" height="12" fill="#eaf0fd" stroke="#2457d6"/>
  <line x1="305" y1="194" x2="305" y2="190" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="305" cy="190" r="3" fill="#2457d6"/>
  <line x1="195" y1="190" x2="435" y2="190" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- R1 (y=220) -->
  <line x1="305" y1="172" x2="305" y2="212" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="298" y="212" width="14" height="12" fill="#eaf0fd" stroke="#2457d6"/>
  <line x1="305" y1="224" x2="305" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="305" cy="220" r="3" fill="#2457d6"/>
  <line x1="195" y1="220" x2="435" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- R2 (y=250) -->
  <line x1="305" y1="172" x2="305" y2="242" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="298" y="242" width="14" height="12" fill="#eaf0fd" stroke="#2457d6"/>
  <line x1="305" y1="254" x2="305" y2="250" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="305" cy="250" r="3" fill="#2457d6"/>
  <line x1="195" y1="250" x2="435" y2="250" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- R3 (y=280) -->
  <line x1="305" y1="172" x2="305" y2="272" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="298" y="272" width="14" height="12" fill="#eaf0fd" stroke="#2457d6"/>
  <line x1="305" y1="284" x2="305" y2="280" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="305" cy="280" r="3" fill="#2457d6"/>
  <line x1="195" y1="280" x2="435" y2="280" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- R4 (y=310) -->
  <line x1="305" y1="172" x2="305" y2="302" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="298" y="302" width="14" height="12" fill="#eaf0fd" stroke="#2457d6"/>
  <line x1="305" y1="314" x2="305" y2="310" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="305" cy="310" r="3" fill="#2457d6"/>
  <line x1="195" y1="310" x2="435" y2="310" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- R5 (y=340) -->
  <line x1="305" y1="172" x2="305" y2="332" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="298" y="332" width="14" height="12" fill="#eaf0fd" stroke="#2457d6"/>
  <line x1="305" y1="344" x2="305" y2="340" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="305" cy="340" r="3" fill="#2457d6"/>
  <line x1="195" y1="340" x2="435" y2="340" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- R6 (y=370) -->
  <line x1="305" y1="172" x2="305" y2="362" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="298" y="362" width="14" height="12" fill="#eaf0fd" stroke="#2457d6"/>
  <line x1="305" y1="374" x2="305" y2="370" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="305" cy="370" r="3" fill="#2457d6"/>
  <line x1="195" y1="370" x2="435" y2="370" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- R7 (y=400) -->
  <line x1="305" y1="172" x2="305" y2="392" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="298" y="392" width="14" height="12" fill="#eaf0fd" stroke="#2457d6"/>
  <line x1="305" y1="404" x2="305" y2="400" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="305" cy="400" r="3" fill="#2457d6"/>
  <line x1="195" y1="400" x2="435" y2="400" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- PANEL 3: Зсувний регістр 74HC165 -->
  <rect x="410" y="85" width="250" height="445" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="8"/>
  <text x="535" y="110" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Зсувний регістр 74HC165</text>

  <!-- IC Chip Body -->
  <rect x="435" y="125" width="200" height="390" fill="white" stroke="#2457d6" stroke-width="2" rx="6"/>
  <!-- Top notch -->
  <path d="M 525 125 A 10 10 0 0 0 545 125" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <text x="535" y="148" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">74HC165</text>
  <text x="535" y="165" font-size="12" fill="#6b7280" text-anchor="middle">8-Bit PISO Shift Register</text>

  <!-- Pins D0..D7 Labels on Left Inside IC -->
  <text x="445" y="194" font-size="12" fill="#1a1a1a">D0 (p11)</text>
  <text x="445" y="224" font-size="12" fill="#1a1a1a">D1 (p12)</text>
  <text x="445" y="254" font-size="12" fill="#1a1a1a">D2 (p13)</text>
  <text x="445" y="284" font-size="12" fill="#1a1a1a">D3 (p14)</text>
  <text x="445" y="314" font-size="12" fill="#1a1a1a">D4 (p3)</text>
  <text x="445" y="344" font-size="12" fill="#1a1a1a">D5 (p4)</text>
  <text x="445" y="374" font-size="12" fill="#1a1a1a">D6 (p5)</text>
  <text x="445" y="404" font-size="12" fill="#1a1a1a">D7 (p6)</text>

  <!-- Right Side Pins & Labels inside IC -->
  <!-- VCC (p16) -->
  <text x="625" y="194" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">VCC (p16)</text>
  <!-- SH/LD (p1) -->
  <text x="625" y="224" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">SH/LD (p1)</text>
  <!-- CLK (p2) -->
  <text x="625" y="274" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">CLK (p2)</text>
  <!-- Q7 / DATA (p9) -->
  <text x="625" y="324" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">Q7 / DATA (p9)</text>
  <!-- CLK INH (p15) -->
  <text x="625" y="444" font-size="12" fill="#6b7280" text-anchor="end">CLK INH (p15)</text>
  <!-- SER (p10) -->
  <text x="625" y="474" font-size="12" fill="#6b7280" text-anchor="end">SER (p10)</text>

  <!-- Grounding lines for CLK INH and SER -->
  <line x1="635" y1="440" x2="650" y2="440" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="635" y1="470" x2="650" y2="470" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="650" y1="440" x2="650" y2="470" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="650" y1="470" x2="650" y2="485" stroke="#6b7280" stroke-width="1.5"/>
  <!-- GND Symbol for INH/SER -->
  <line x1="644" y1="485" x2="656" y2="485" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="647" y1="489" x2="653" y2="489" stroke="#6b7280" stroke-width="1"/>

  <!-- PANEL 4: Мікроконтролер (MCU) -->
  <rect x="730" y="85" width="200" height="445" fill="#f4f6f8" stroke="#d0d7de" rx="8"/>
  <text x="830" y="110" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мікроконтролер (MCU)</text>

  <!-- MCU Chip Box -->
  <rect x="750" y="125" width="160" height="390" fill="white" stroke="#1a1a1a" stroke-width="2" rx="6"/>
  <text x="830" y="152" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">MCU (ESP32)</text>
  <text x="830" y="169" font-size="12" fill="#6b7280" text-anchor="middle">Master Interface</text>

  <!-- GPIO Pins inside MCU -->
  <text x="760" y="224" font-size="12" font-weight="bold" fill="#2457d6">GPIO4 (SH/LD)</text>
  <text x="760" y="274" font-size="12" font-weight="bold" fill="#2457d6">GPIO18 (CLK)</text>
  <text x="760" y="324" font-size="12" font-weight="bold" fill="#27ae60">GPIO19 (DATA)</text>

  <!-- Bus Lines between 74HC165 (x=635) and MCU (x=750) -->
  <!-- 1. SH/LD Control Line -->
  <line x1="750" y1="220" x2="635" y2="220" stroke="#2457d6" stroke-width="2" marker-start="url(#arr-left-blue)"/>
  <text x="692" y="212" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">SH/LD</text>

  <!-- 2. CLK Control Line -->
  <line x1="750" y1="270" x2="635" y2="270" stroke="#2457d6" stroke-width="2" marker-start="url(#arr-left-blue)"/>
  <text x="692" y="262" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">CLK</text>

  <!-- 3. DATA Serial Line -->
  <line x1="635" y1="320" x2="750" y2="320" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-right-green)"/>
  <text x="692" y="312" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">DATA (Q7)</text>
</svg>
