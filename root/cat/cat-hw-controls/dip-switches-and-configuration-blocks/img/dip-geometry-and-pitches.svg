<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-blue-rev" markerWidth="9" markerHeight="9" refX="1.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
    </marker>

    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-green-rev" markerWidth="9" markerHeight="9" refX="1.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#27ae60"/>
    </marker>

    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-black-rev" markerWidth="9" markerHeight="9" refX="1.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Header -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Геометрія та крок виводів DIP-перемикачів і джамперів</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Крок 2.54 мм забезпечує зручність комутації, а 1.27 мм економить 50% площі плати</text>

  <!-- Panel 1: Standard DIP (x: 30..310, width: 280) -->
  <rect x="30" y="75" width="280" height="375" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <path d="M 30,111 L 30,83 A 8,8 0 0,1 38,75 L 302,75 A 8,8 0 0,1 310,83 L 310,111 Z" fill="#eaf0fd"/>
  <line x1="30" y1="111" x2="310" y2="111" stroke="#d0d7de" stroke-width="1"/>
  <text x="170" y="99" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">1. Стандартний DIP (2.54 мм)</text>

  <text x="170" y="130" font-size="12" fill="#2457d6" text-anchor="middle">Крок виводів p = 2.54 мм (0.1")</text>

  <!-- DIP-4 Housing -->
  <rect x="85" y="148" width="170" height="106" rx="4" ry="4" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="94" y="162" font-size="10" font-weight="700" fill="#ffffff">ON</text>

  <!-- Sliders -->
  <rect x="100" y="165" width="25" height="75" fill="#ffffff" stroke="#1a1a1a"/>
  <rect x="140" y="165" width="25" height="75" fill="#ffffff" stroke="#1a1a1a"/>
  <rect x="180" y="165" width="25" height="75" fill="#ffffff" stroke="#1a1a1a"/>
  <rect x="220" y="165" width="25" height="75" fill="#ffffff" stroke="#1a1a1a"/>

  <!-- Knobs -->
  <rect x="103" y="170" width="19" height="28" rx="2" fill="#27ae60"/>
  <rect x="143" y="207" width="19" height="28" rx="2" fill="#c0392b"/>
  <rect x="183" y="170" width="19" height="28" rx="2" fill="#27ae60"/>
  <rect x="223" y="207" width="19" height="28" rx="2" fill="#c0392b"/>

  <text x="112" y="250" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="152" y="250" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="192" y="250" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="232" y="250" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>

  <!-- Pitch dimension lines -->
  <line x1="112" y1="272" x2="152" y2="272" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue-rev)" marker-end="url(#arr-blue)"/>
  <line x1="112" y1="256" x2="112" y2="278" stroke="#2457d6" stroke-width="1"/>
  <line x1="152" y1="256" x2="152" y2="278" stroke="#2457d6" stroke-width="1"/>
  <text x="132" y="292" font-size="11" font-weight="700" fill="#2457d6" text-anchor="middle">p = 2.54 мм</text>

  <!-- Features Box -->
  <rect x="42" y="310" width="256" height="125" rx="6" ry="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="52" y="330" font-size="11" font-weight="700" fill="#1a1a1a">Параметри стандарту 2.54 мм:</text>
  <text x="52" y="350" font-size="11" fill="#1a1a1a">• Крок між ніжками: 2.54 мм (100 mil)</text>
  <text x="52" y="368" font-size="11" fill="#1a1a1a">• Ширина корпусу: 7.62 мм (0.3")</text>
  <text x="52" y="386" font-size="11" fill="#1a1a1a">• Монтаж: THT (у отвори) або SMD</text>
  <text x="52" y="404" font-size="11" fill="#1a1a1a">• Ручне перемикання без інструменту</text>
  <text x="52" y="422" font-size="11" fill="#1a1a1a">• Комутаційний струм: до 100 мА</text>


  <!-- Panel 2: Micro DIP (x: 340..620, width: 280) -->
  <rect x="340" y="75" width="280" height="375" rx="8" ry="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <path d="M 340,111 L 340,83 A 8,8 0 0,1 348,75 L 612,75 A 8,8 0 0,1 620,83 L 620,111 Z" fill="#e9f7ef"/>
  <line x1="340" y1="111" x2="620" y2="111" stroke="#27ae60" stroke-width="1"/>
  <text x="480" y="99" font-size="13" font-weight="700" fill="#27ae60" text-anchor="middle">2. Мікро-DIP (1.27 мм)</text>

  <text x="480" y="130" font-size="12" fill="#27ae60" text-anchor="middle">Крок виводів p = 1.27 мм (0.05")</text>

  <!-- Micro DIP-4 Housing -->
  <rect x="425" y="160" width="110" height="78" rx="3" ry="3" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Sliders -->
  <rect x="435" y="170" width="16" height="58" fill="#ffffff" stroke="#1a1a1a"/>
  <rect x="460" y="170" width="16" height="58" fill="#ffffff" stroke="#1a1a1a"/>
  <rect x="485" y="170" width="16" height="58" fill="#ffffff" stroke="#1a1a1a"/>
  <rect x="510" y="170" width="16" height="58" fill="#ffffff" stroke="#1a1a1a"/>

  <!-- Knobs -->
  <rect x="437" y="173" width="12" height="22" rx="2" fill="#2457d6"/>
  <rect x="462" y="203" width="12" height="22" rx="2" fill="#c0392b"/>
  <rect x="487" y="173" width="12" height="22" rx="2" fill="#2457d6"/>
  <rect x="512" y="203" width="12" height="22" rx="2" fill="#c0392b"/>

  <!-- Pitch dimension lines -->
  <line x1="443" y1="272" x2="468" y2="272" stroke="#27ae60" stroke-width="1.5" marker-start="url(#arr-green-rev)" marker-end="url(#arr-green)"/>
  <line x1="443" y1="240" x2="443" y2="278" stroke="#27ae60" stroke-width="1"/>
  <line x1="468" y1="240" x2="468" y2="278" stroke="#27ae60" stroke-width="1"/>
  <text x="455" y="292" font-size="11" font-weight="700" fill="#27ae60" text-anchor="middle">p = 1.27 мм</text>

  <!-- Features Box -->
  <rect x="352" y="310" width="256" height="125" rx="6" ry="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="362" y="330" font-size="11" font-weight="700" fill="#27ae60">Параметри мікро-стандарту 1.27 мм:</text>
  <text x="362" y="350" font-size="11" fill="#1a1a1a">• Крок між ніжками: 1.27 мм (50 mil)</text>
  <text x="362" y="368" font-size="11" fill="#1a1a1a">• Ширина корпусу: 4.40 мм</text>
  <text x="362" y="386" font-size="11" fill="#1a1a1a">• Монтаж: лише SMD (поверхневий)</text>
  <text x="362" y="404" font-size="11" fill="#1a1a1a">• Заощаджує до 50% площі плати</text>
  <text x="362" y="422" font-size="11" fill="#1a1a1a">• Комутація стилусом або пінцетом</text>


  <!-- Panel 3: Jumper Block (x: 650..930, width: 280) -->
  <rect x="650" y="75" width="280" height="375" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <path d="M 650,111 L 650,83 A 8,8 0 0,1 658,75 L 922,75 A 8,8 0 0,1 930,83 L 930,111 Z" fill="#f4f6f8"/>
  <line x1="650" y1="111" x2="930" y2="111" stroke="#d0d7de" stroke-width="1"/>
  <text x="790" y="99" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">3. Джампер (Pin Header + Shunt)</text>

  <text x="790" y="130" font-size="12" fill="#1a1a1a" text-anchor="middle">Позолочений/луджений контакт</text>

  <!-- 3 Pins -->
  <line x1="725" y1="165" x2="725" y2="260" stroke="#f39c12" stroke-width="8"/>
  <line x1="795" y1="165" x2="795" y2="260" stroke="#f39c12" stroke-width="8"/>
  <line x1="865" y1="165" x2="865" y2="260" stroke="#f39c12" stroke-width="8"/>

  <!-- Pin Header Base -->
  <rect x="695" y="215" width="190" height="24" rx="3" ry="3" fill="#1a1a1a" stroke="#6b7280"/>

  <!-- Jumper Shunt Cap on Pin 1 & 2 -->
  <rect x="710" y="150" width="90" height="54" rx="4" ry="4" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="755" y="182" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Shunt</text>

  <!-- Pitch dimension lines -->
  <line x1="725" y1="272" x2="795" y2="272" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-black-rev)" marker-end="url(#arr-black)"/>
  <line x1="725" y1="262" x2="725" y2="278" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="795" y1="262" x2="795" y2="278" stroke="#1a1a1a" stroke-width="1"/>
  <text x="760" y="292" font-size="11" font-weight="700" fill="#1a1a1a" text-anchor="middle">p = 2.54 мм</text>

  <!-- Features Box -->
  <rect x="662" y="310" width="256" height="125" rx="6" ry="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="672" y="330" font-size="11" font-weight="700" fill="#1a1a1a">Особливості джамперних блоків:</text>
  <text x="672" y="350" font-size="11" fill="#1a1a1a">• Витримуваний струм: до 3.0 А</text>
  <text x="672" y="368" font-size="11" fill="#1a1a1a">• Опір контакту: ≤ 20 мОм</text>
  <text x="672" y="386" font-size="11" fill="#1a1a1a">• Покриття: Au (золото) / Sn (олово)</text>
  <text x="672" y="404" font-size="11" fill="#1a1a1a">• Надійна механічна фіксація</text>
  <text x="672" y="422" font-size="11" fill="#1a1a1a">• Виключає випадкове перемикання</text>
</svg>
