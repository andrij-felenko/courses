<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>

  <!-- Header -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема виділення та нормалізації суб-поля з конфігураційного слова</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Побітова маска І (&amp; 0x3C) виділяє потрібні біти, а зсув праворуч (&gt;&gt; 2) вирівнює їх до молодшого розряду</text>

  <!-- KРОК 1: Вхідне слово RAW -->
  <rect x="30" y="75" width="900" height="110" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="50" y="98" font-size="13" font-weight="bold" fill="#1a1a1a">Крок 1: Вхідне конфігураційне слово RAW (стан DIP-перемикачів)</text>
  <text x="910" y="98" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">RAW = 0b10110100 (0xB4)</text>

  <text x="50" y="145" font-size="12" font-weight="bold" fill="#6b7280">Розряди DIP:</text>
  <text x="735" y="145" font-size="12" font-weight="bold" fill="#2457d6">Цільове суб-поле [5:2]</text>

  <!-- Бітові мітки Step 1 -->
  <text x="270" y="112" font-size="11" fill="#6b7280" text-anchor="middle">B7</text>
  <text x="330" y="112" font-size="11" fill="#6b7280" text-anchor="middle">B6</text>
  <text x="390" y="112" font-size="11" fill="#2457d6" font-weight="bold" text-anchor="middle">B5</text>
  <text x="450" y="112" font-size="11" fill="#2457d6" font-weight="bold" text-anchor="middle">B4</text>
  <text x="510" y="112" font-size="11" fill="#2457d6" font-weight="bold" text-anchor="middle">B3</text>
  <text x="570" y="112" font-size="11" fill="#2457d6" font-weight="bold" text-anchor="middle">B2</text>
  <text x="630" y="112" font-size="11" fill="#6b7280" text-anchor="middle">B1</text>
  <text x="690" y="112" font-size="11" fill="#6b7280" text-anchor="middle">B0</text>

  <!-- Осередки бітів Step 1 -->
  <rect x="240" y="120" width="60" height="45" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="270" y="148" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1</text>

  <rect x="300" y="120" width="60" height="45" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="330" y="148" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0</text>

  <rect x="360" y="120" width="60" height="45" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="390" y="148" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">1</text>

  <rect x="420" y="120" width="60" height="45" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="450" y="148" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">1</text>

  <rect x="480" y="120" width="60" height="45" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="510" y="148" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">0</text>

  <rect x="540" y="120" width="60" height="45" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="570" y="148" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">1</text>

  <rect x="600" y="120" width="60" height="45" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="630" y="148" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0</text>

  <rect x="660" y="120" width="60" height="45" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="690" y="148" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0</text>


  <!-- КРОК 2: Побітова маска & MASK -->
  <rect x="30" y="200" width="900" height="110" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="50" y="223" font-size="13" font-weight="bold" fill="#1a1a1a">Крок 2: Застосування бітової маски І (&amp; MASK)</text>
  <text x="910" y="223" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">MASK = 0b00111100 (0x3C)</text>

  <text x="50" y="270" font-size="13" font-weight="bold" fill="#2457d6">&amp; MASK (0x3C)</text>
  <text x="735" y="270" font-size="12" font-weight="bold" fill="#27ae60">MASKED = 0x34</text>

  <!-- Осередки бітів Step 2 -->
  <rect x="240" y="245" width="60" height="45" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="270" y="273" font-size="14" font-weight="bold" fill="#6b7280" text-anchor="middle">0</text>

  <rect x="300" y="245" width="60" height="45" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="330" y="273" font-size="14" font-weight="bold" fill="#6b7280" text-anchor="middle">0</text>

  <rect x="360" y="245" width="60" height="45" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="390" y="273" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">1</text>

  <rect x="420" y="245" width="60" height="45" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="450" y="273" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">1</text>

  <rect x="480" y="245" width="60" height="45" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="510" y="273" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">0</text>

  <rect x="540" y="245" width="60" height="45" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="570" y="273" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">1</text>

  <rect x="600" y="245" width="60" height="45" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="630" y="273" font-size="14" font-weight="bold" fill="#6b7280" text-anchor="middle">0</text>

  <rect x="660" y="245" width="60" height="45" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="690" y="273" font-size="14" font-weight="bold" fill="#6b7280" text-anchor="middle">0</text>


  <!-- Стрілки зсуву між Step 2 і Step 3 -->
  <path d="M 390 290 L 505 365" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-green)"/>
  <path d="M 450 290 L 565 365" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-green)"/>
  <path d="M 510 290 L 625 365" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-green)"/>
  <path d="M 570 290 L 685 365" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-green)"/>


  <!-- КРОК 3: Зсув праворуч >> 2 та результат -->
  <rect x="30" y="325" width="900" height="110" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="50" y="348" font-size="13" font-weight="bold" fill="#27ae60">Крок 3: Зсув праворуч (&gt;&gt; 2) та отримана нормалізована величина</text>
  <text x="910" y="348" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">VAL = (RAW &amp; 0x3C) &gt;&gt; 2</text>

  <text x="50" y="395" font-size="13" font-weight="bold" fill="#27ae60">&gt;&gt; 2 (Shift)</text>
  <text x="735" y="380" font-size="13" font-weight="bold" fill="#27ae60">Результат: 13 (0x0D)</text>
  <text x="735" y="400" font-size="11" fill="#1a1a1a">Діапазон: 0..15 (4 біти)</text>

  <!-- Осередки бітів Step 3 -->
  <rect x="240" y="370" width="60" height="45" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="270" y="398" font-size="14" font-weight="bold" fill="#6b7280" text-anchor="middle">0</text>

  <rect x="300" y="370" width="60" height="45" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="330" y="398" font-size="14" font-weight="bold" fill="#6b7280" text-anchor="middle">0</text>

  <rect x="360" y="370" width="60" height="45" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="390" y="398" font-size="14" font-weight="bold" fill="#6b7280" text-anchor="middle">0</text>

  <rect x="420" y="370" width="60" height="45" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="450" y="398" font-size="14" font-weight="bold" fill="#6b7280" text-anchor="middle">0</text>

  <rect x="480" y="370" width="60" height="45" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="510" y="398" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">1</text>

  <rect x="540" y="370" width="60" height="45" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="570" y="398" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">1</text>

  <rect x="600" y="370" width="60" height="45" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="630" y="398" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">0</text>

  <rect x="660" y="370" width="60" height="45" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="690" y="398" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">1</text>

  <!-- Нижній блок коду C -->
  <rect x="30" y="450" width="900" height="50" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="480" font-size="13" font-weight="bold" fill="#1a1a1a">Код C: <tspan fill="#2457d6">uint8_t mode = (dip_raw &amp; 0x3C) &gt;&gt; 2;</tspan></text>
  <text x="910" y="480" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">✔ Нормалізація приводить значення поля до виробу безпосереднього індексу [0..15]</text>
</svg>
