<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Програмна обробка конфігураційного байта: бітове маскування та зсуви</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Покрокове виділення полів адреси, режиму та прапорців за допомогою операцій AND (&amp;) та ЗСУВ (&gt;&gt;)</text>

  <!-- Section 1: Raw Config Byte -->
  <rect x="20" y="75" width="920" height="110" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <rect x="30" y="85" width="900" height="28" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="480" y="104" font-size="14" font-weight="700" fill="#2457d6" text-anchor="middle">1. Вхідне конфігураційне слово raw_byte (8 біт = 0b10110100)</text>

  <!-- Bit cells B7..B0 -->
  <!-- Address Bits (B7..B4) -->
  <rect x="162" y="122" width="70" height="30" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="3"/>
  <text x="197" y="142" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">B7: 1</text>

  <rect x="237" y="122" width="70" height="30" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="3"/>
  <text x="272" y="142" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">B6: 0</text>

  <rect x="312" y="122" width="70" height="30" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="3"/>
  <text x="347" y="142" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">B5: 1</text>

  <rect x="387" y="122" width="70" height="30" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="3"/>
  <text x="422" y="142" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">B4: 1</text>

  <text x="292" y="170" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Адреса пристрою [7:4]</text>

  <!-- Mode Bits (B3..B2) -->
  <rect x="477" y="122" width="70" height="30" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="3"/>
  <text x="512" y="142" font-size="13" font-weight="700" fill="#27ae60" text-anchor="middle">B3: 0</text>

  <rect x="552" y="122" width="70" height="30" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="3"/>
  <text x="587" y="142" font-size="13" font-weight="700" fill="#27ae60" text-anchor="middle">B2: 1</text>

  <text x="550" y="170" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Режим [3:2]</text>

  <!-- Flag Bits (B1..B0) -->
  <rect x="642" y="122" width="70" height="30" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="3"/>
  <text x="677" y="142" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle">B1: 0</text>

  <rect x="717" y="122" width="70" height="30" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="3"/>
  <text x="752" y="142" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle">B0: 0</text>

  <text x="714" y="170" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Прапорці [1:0]</text>

  <!-- Section 2: Extraction Columns -->
  <!-- Column 1: Address -->
  <rect x="20" y="195" width="295" height="180" fill="#f4f6f8" stroke="#d0d7de" rx="8"/>
  <rect x="30" y="205" width="275" height="28" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="167" y="224" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">Виділення адреси (4 біти)</text>

  <text x="40" y="252" font-size="12" fill="#1a1a1a">1) raw_byte &amp; 0xF0 = 0b10110000</text>
  <text x="40" y="280" font-size="12" fill="#1a1a1a">2) (raw_byte &amp; 0xF0) &gt;&gt; 4</text>

  <rect x="40" y="298" width="255" height="30" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="167" y="318" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">address = 0b1011 (11 / 0x0B)</text>
  <text x="167" y="355" font-size="12" fill="#6b7280" text-anchor="middle">Зсув на 4 позиції вправо</text>

  <!-- Column 2: Mode -->
  <rect x="332" y="195" width="295" height="180" fill="#f4f6f8" stroke="#d0d7de" rx="8"/>
  <rect x="342" y="205" width="275" height="28" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="480" y="224" font-size="13" font-weight="700" fill="#27ae60" text-anchor="middle">Виділення режиму (2 біти)</text>

  <text x="352" y="252" font-size="12" fill="#1a1a1a">1) raw_byte &amp; 0x0C = 0b00000100</text>
  <text x="352" y="280" font-size="12" fill="#1a1a1a">2) (raw_byte &amp; 0x0C) &gt;&gt; 2</text>

  <rect x="352" y="298" width="255" height="30" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="480" y="318" font-size="13" font-weight="700" fill="#27ae60" text-anchor="middle">mode = 0b01 (1)</text>
  <text x="480" y="355" font-size="12" fill="#6b7280" text-anchor="middle">Зсув на 2 позиції вправо</text>

  <!-- Column 3: Flags -->
  <rect x="645" y="195" width="295" height="180" fill="#f4f6f8" stroke="#d0d7de" rx="8"/>
  <rect x="655" y="205" width="275" height="28" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="792" y="224" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle">Виділення прапорців (2 біти)</text>

  <text x="665" y="252" font-size="12" fill="#1a1a1a">1) raw_byte &amp; 0x03 = 0b00000000</text>
  <text x="665" y="280" font-size="12" fill="#1a1a1a">2) Зсув не потрібен (зсув 0)</text>

  <rect x="665" y="298" width="255" height="30" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="792" y="318" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle">flags = 0b00 (0)</text>
  <text x="792" y="355" font-size="12" fill="#6b7280" text-anchor="middle">Молодші біти LSB</text>

  <!-- Section 3: C Struct Result -->
  <rect x="20" y="390" width="920" height="95" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <rect x="30" y="400" width="900" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="480" y="418" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">3. Сформована структура системних налаштувань (Software Struct)</text>

  <rect x="30" y="432" width="900" height="44" fill="white" stroke="#d0d7de" rx="4"/>
  <text x="45" y="450" font-size="12" fill="#1a1a1a">config.device_address = (raw &amp; 0xF0) &gt;&gt; 4;   // 11 (адреса пристрою на шині CAN/I2C)</text>
  <text x="45" y="467" font-size="12" fill="#1a1a1a">config.baud_rate_mode = (raw &amp; 0x0C) &gt;&gt; 2;   // 1 (режим швидкості обмеження шини)</text>
</svg>
