<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Цокольовка та схемотехніка підключення DIP-перемикачів і джамперів</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Сухі контакти потребують Pull-Up/Pull-Down підтяжки або SPDT-джамперів для гарантованого логічного стану</text>

  <!-- Panel 1: DIP-Switch + Pull-Up -->
  <rect x="20" y="74" width="292" height="442" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="166" y="98" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">A. DIP-перемикач + Pull-Up</text>
  <text x="166" y="116" font-size="12" fill="#6b7280" text-anchor="middle">4-позиційний блок з SIP-збіркою</text>

  <!-- VCC Line -->
  <line x1="46" y1="142" x2="286" y2="142" stroke="#c0392b" stroke-width="2"/>
  <text x="166" y="134" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">VCC (+5V / +3.3V)</text>

  <!-- SIP Resistor Network Box -->
  <rect x="46" y="156" width="240" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="166" y="174" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Резистивна збірка Pull-Up (SIP-5)</text>
  <text x="166" y="190" font-size="12" fill="#6b7280" text-anchor="middle">Спільна шина VCC, 4 × 10 кОм</text>
  <line x1="166" y1="142" x2="166" y2="156" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Lines from SIP to DIP switch -->
  <line x1="76" y1="198" x2="76" y2="245" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="136" y1="198" x2="136" y2="245" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="196" y1="198" x2="196" y2="245" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="256" y1="198" x2="256" y2="245" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Labels for Signals -->
  <text x="70" y="226" font-size="12" fill="#1a1a1a" text-anchor="end">SW1</text>
  <text x="130" y="226" font-size="12" fill="#1a1a1a" text-anchor="end">SW2</text>
  <text x="190" y="226" font-size="12" fill="#1a1a1a" text-anchor="end">SW3</text>
  <text x="250" y="226" font-size="12" fill="#1a1a1a" text-anchor="end">SW4</text>

  <!-- DIP Switch Body -->
  <rect x="46" y="245" width="240" height="135" rx="6" fill="#1a1a1a" stroke="#000000" stroke-width="1.5"/>
  <text x="66" y="263" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">ON</text>

  <!-- Switches inside DIP -->
  <!-- Switch 1 (OFF / OPEN) -->
  <rect x="64" y="275" width="24" height="60" rx="3" fill="#333333"/>
  <rect x="67" y="278" width="18" height="24" rx="2" fill="#c0392b"/>
  <text x="76" y="352" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="76" y="370" font-size="12" fill="#c0392b" text-anchor="middle">ВІДКР</text>

  <!-- Switch 2 (ON / CLOSED) -->
  <rect x="124" y="275" width="24" height="60" rx="3" fill="#333333"/>
  <rect x="127" y="308" width="18" height="24" rx="2" fill="#27ae60"/>
  <text x="136" y="352" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="136" y="370" font-size="12" fill="#27ae60" text-anchor="middle">ЗАКР</text>

  <!-- Switch 3 (OFF / OPEN) -->
  <rect x="184" y="275" width="24" height="60" rx="3" fill="#333333"/>
  <rect x="187" y="278" width="18" height="24" rx="2" fill="#c0392b"/>
  <text x="196" y="352" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="196" y="370" font-size="12" fill="#c0392b" text-anchor="middle">ВІДКР</text>

  <!-- Switch 4 (ON / CLOSED) -->
  <rect x="244" y="275" width="24" height="60" rx="3" fill="#333333"/>
  <rect x="247" y="308" width="18" height="24" rx="2" fill="#27ae60"/>
  <text x="256" y="352" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="256" y="370" font-size="12" fill="#27ae60" text-anchor="middle">ЗАКР</text>

  <!-- GND Line below DIP -->
  <line x1="76" y1="380" x2="76" y2="420" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="136" y1="380" x2="136" y2="420" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="196" y1="380" x2="196" y2="420" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="256" y1="380" x2="256" y2="420" stroke="#1a1a1a" stroke-width="1.5"/>

  <line x1="46" y1="420" x2="286" y2="420" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="166" y1="420" x2="166" y2="440" stroke="#1a1a1a" stroke-width="2"/>
  <!-- GND symbol -->
  <line x1="151" y1="440" x2="181" y2="440" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="157" y1="444" x2="175" y2="444" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="162" y1="448" x2="170" y2="448" stroke="#1a1a1a" stroke-width="2"/>
  <text x="166" y="466" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">GND (0V)</text>

  <!-- Result Logic Badges -->
  <rect x="46" y="480" width="54" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="73" y="495" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">SW1=1</text>

  <rect x="106" y="480" width="54" height="22" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="133" y="495" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">SW2=0</text>

  <rect x="166" y="480" width="54" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="193" y="495" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">SW3=1</text>

  <rect x="226" y="480" width="54" height="22" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="253" y="495" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">SW4=0</text>


  <!-- Panel 2: Jumper Header Types (2-Pin & 3-Pin) -->
  <rect x="334" y="74" width="292" height="442" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="98" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">B. Джамперні колодки (Pinout)</text>
  <text x="480" y="116" font-size="12" fill="#6b7280" text-anchor="middle">2-Pin з Pull-Up та 3-Pin SPDT селектор</text>

  <!-- Sub-block 1: 2-Pin Jumper Header -->
  <rect x="350" y="132" width="260" height="165" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="152" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">2-Pin Header (Нормально розімкнений)</text>

  <!-- Pin 1 & Pin 2 graphics -->
  <!-- Base Header plastic body -->
  <rect x="410" y="168" width="140" height="50" rx="4" fill="#1a1a1a"/>
  <!-- Pin 1 -->
  <circle cx="440" cy="193" r="10" fill="#d0d7de" stroke="#6b7280" stroke-width="2"/>
  <circle cx="440" cy="193" r="4" fill="#1a1a1a"/>
  <text x="440" y="234" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">1: Вхід</text>

  <!-- Pin 2 -->
  <circle cx="520" cy="193" r="10" fill="#d0d7de" stroke="#6b7280" stroke-width="2"/>
  <circle cx="520" cy="193" r="4" fill="#1a1a1a"/>
  <text x="520" y="234" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">2: GND</text>

  <!-- Shunt representation (Open) -->
  <text x="480" y="258" font-size="12" fill="#6b7280" text-anchor="middle">Без шунта: Вхід = HIGH (через R_pull)</text>
  <text x="480" y="276" font-size="12" fill="#27ae60" text-anchor="middle">З шунтом: Pin 1-2 замкнуто = LOW (0V)</text>


  <!-- Sub-block 2: 3-Pin SPDT Jumper Header -->
  <rect x="350" y="312" width="260" height="190" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="332" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">3-Pin SPDT Header (Перемикач станів)</text>

  <!-- Base Header plastic body 3-pin -->
  <rect x="390" y="348" width="180" height="50" rx="4" fill="#1a1a1a"/>

  <!-- Pin 1 (VCC) -->
  <circle cx="420" cy="373" r="10" fill="#d0d7de" stroke="#6b7280" stroke-width="2"/>
  <circle cx="420" cy="373" r="4" fill="#c0392b"/>
  <text x="420" y="412" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">1: VCC</text>

  <!-- Pin 2 (Signal) -->
  <circle cx="480" cy="373" r="10" fill="#d0d7de" stroke="#6b7280" stroke-width="2"/>
  <circle cx="480" cy="373" r="4" fill="#2457d6"/>
  <text x="480" y="412" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">2: Сигнал</text>

  <!-- Pin 3 (GND) -->
  <circle cx="540" cy="373" r="10" fill="#d0d7de" stroke="#6b7280" stroke-width="2"/>
  <circle cx="540" cy="373" r="4" fill="#1a1a1a"/>
  <text x="540" y="412" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">3: GND</text>

  <!-- Active Shunt on 1-2 -->
  <rect x="408" y="359" width="84" height="28" rx="4" fill="#2457d6" fill-opacity="0.8" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="450" y="377" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">Шунт 1-2</text>

  <!-- Explanation -->
  <text x="480" y="438" font-size="12" fill="#2457d6" text-anchor="middle">Позиція 1-2: Вхід підключено до VCC (HIGH)</text>
  <text x="480" y="456" font-size="12" fill="#1a1a1a" text-anchor="middle">Позиція 2-3: Вхід підключено до GND (LOW)</text>
  <text x="480" y="478" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Перевага: не потрібен зовнішній R_pull!</text>


  <!-- Panel 3: RC Filter & Shift Register -->
  <rect x="648" y="74" width="292" height="442" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="794" y="98" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">C. Приглушення дребезгу та 74HC165</text>
  <text x="794" y="116" font-size="12" fill="#6b7280" text-anchor="middle">RC-ланцюг + паралельне зчитування</text>

  <!-- RC Debounce Circuit Box -->
  <rect x="664" y="132" width="260" height="165" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="794" y="147" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Схема RC-антидребезгу</text>

  <!-- Circuit Diagram inside Box -->
  <!-- VCC line -->
  <line x1="695" y1="180" x2="710" y2="180" stroke="#c0392b" stroke-width="1.5"/>
  <text x="695" y="167" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">VCC</text>

  <!-- R_pull -->
  <rect x="710" y="172" width="36" height="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="728" y="167" font-size="12" fill="#1a1a1a" text-anchor="middle">R1 10k</text>

  <!-- Node A -->
  <line x1="746" y1="180" x2="760" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="760" cy="180" r="3" fill="#1a1a1a"/>

  <!-- Switch to GND from Node A -->
  <line x1="760" y1="180" x2="760" y2="195" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Switch symbol -->
  <circle cx="760" cy="195" r="2" fill="#1a1a1a"/>
  <line x1="760" y1="195" x2="772" y2="207" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="760" cy="211" r="2" fill="#1a1a1a"/>
  <line x1="760" y1="211" x2="760" y2="222" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- GND -->
  <line x1="750" y1="222" x2="770" y2="222" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="754" y1="226" x2="766" y2="226" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="784" y="205" font-size="12" fill="#1a1a1a">SW</text>

  <!-- R_series to Filter Node -->
  <rect x="770" y="172" width="36" height="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="788" y="167" font-size="12" fill="#1a1a1a" text-anchor="middle">R2 1k</text>
  <line x1="760" y1="180" x2="770" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="806" y1="180" x2="880" y2="180" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Capacitor C_filter to GND -->
  <circle cx="835" cy="180" r="3" fill="#1a1a1a"/>
  <line x1="835" y1="180" x2="835" y2="195" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Capacitor plates -->
  <line x1="827" y1="195" x2="843" y2="195" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="827" y1="200" x2="843" y2="200" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="835" y1="200" x2="835" y2="214" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- GND -->
  <line x1="825" y1="214" x2="845" y2="214" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="829" y1="218" x2="841" y2="218" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="852" y="201" font-size="12" fill="#1a1a1a">C 100nF</text>

  <!-- Output text -->
  <text x="895" y="167" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">До МК</text>
  <text x="794" y="254" font-size="12" fill="#2457d6" text-anchor="middle">Часова стала: τ = R2 · C = 100 мкс</text>
  <text x="794" y="274" font-size="12" fill="#27ae60" text-anchor="middle">Згладжує дребезг контакту (&lt; 5 мс)</text>


  <!-- Sub-block 74HC165 Shift Register -->
  <rect x="664" y="312" width="260" height="190" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="794" y="332" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Зсувний регістр 74HC165 (SPI-ввід)</text>

  <!-- IC Package 74HC165 -->
  <rect x="704" y="348" width="180" height="85" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="794" y="370" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">74HC165 (8-Bit PISO)</text>
  <text x="794" y="388" font-size="12" fill="#6b7280" text-anchor="middle">Паралельний вхід D0..D7</text>

  <!-- Control lines -->
  <text x="724" y="414" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">PL#</text>
  <text x="794" y="414" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">CP</text>
  <text x="864" y="414" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Q7</text>

  <line x1="724" y1="452" x2="724" y2="430" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="794" y1="452" x2="794" y2="430" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="864" y1="430" x2="864" y2="452" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <text x="794" y="468" font-size="12" fill="#1a1a1a" text-anchor="middle">Зчитує до 8/16/32 перемикачів</text>
  <text x="794" y="486" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Використовує всього 3 виводи МК!</text>

</svg>
