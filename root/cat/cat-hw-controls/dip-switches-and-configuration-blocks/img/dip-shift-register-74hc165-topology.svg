<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Топологія зчитування DIP-перемикача через зсувний регістр 74HC165</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Паралельне завантаження стану важелів D[7:0] за сигналом PL та послідовне вичитування Q7 за тактами CLK</text>

  <!-- Block 1: DIP-8 + Pull-Up -->
  <rect x="20" y="75" width="230" height="380" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <rect x="30" y="85" width="210" height="30" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="135" y="105" font-size="14" font-weight="700" fill="#2457d6" text-anchor="middle">1. DIP-8 + Pull-Up</text>

  <rect x="35" y="130" width="90" height="230" fill="white" stroke="#b0b7be" stroke-width="1.5" rx="6"/>
  <text x="80" y="152" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">DIP SW8</text>

  <!-- Individual switches mini visualization -->
  <rect x="45" y="165" width="70" height="18" fill="#2457d6" rx="2"/>
  <text x="80" y="179" font-size="12" fill="white" text-anchor="middle">SW1 (D0)</text>

  <rect x="45" y="190" width="70" height="18" fill="#2457d6" rx="2"/>
  <text x="80" y="204" font-size="12" fill="white" text-anchor="middle">SW2 (D1)</text>

  <rect x="45" y="215" width="70" height="18" fill="#2457d6" rx="2"/>
  <text x="80" y="229" font-size="12" fill="white" text-anchor="middle">SW3 (D2)</text>

  <rect x="45" y="240" width="70" height="18" fill="#2457d6" rx="2"/>
  <text x="80" y="254" font-size="12" fill="white" text-anchor="middle">SW4 (D3)</text>

  <rect x="45" y="265" width="70" height="18" fill="#2457d6" rx="2"/>
  <text x="80" y="279" font-size="12" fill="white" text-anchor="middle">SW5 (D4)</text>

  <rect x="45" y="290" width="70" height="18" fill="#2457d6" rx="2"/>
  <text x="80" y="304" font-size="12" fill="white" text-anchor="middle">SW6 (D5)</text>

  <rect x="45" y="315" width="70" height="18" fill="#2457d6" rx="2"/>
  <text x="80" y="329" font-size="12" fill="white" text-anchor="middle">SW7 (D6)</text>

  <rect x="45" y="340" width="70" height="18" fill="#2457d6" rx="2"/>
  <text x="80" y="354" font-size="12" fill="white" text-anchor="middle">SW8 (D7)</text>

  <rect x="140" y="130" width="95" height="230" fill="white" stroke="#d0d7de" rx="4"/>
  <text x="187" y="152" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Підтяжка R</text>
  <text x="187" y="172" font-size="12" fill="#6b7280" text-anchor="middle">10 кОм x 8</text>
  <text x="187" y="192" font-size="12" fill="#6b7280" text-anchor="middle">до +3.3V</text>

  <rect x="30" y="375" width="210" height="65" fill="white" stroke="#d0d7de" rx="4"/>
  <text x="40" y="397" font-size="12" fill="#1a1a1a">• Кожен перемикач має R_pull</text>
  <text x="40" y="417" font-size="12" fill="#1a1a1a">• Сигнал: ON = GND, OFF = VCC</text>
  <text x="40" y="432" font-size="12" fill="#6b7280">• Активна інверсна логіка</text>

  <!-- Bus from Block 1 to Block 2 -->
  <line x1="250" y1="245" x2="350" y2="245" stroke="#1a1a1a" stroke-width="4" marker-end="url(#arr-dark)"/>
  <text x="300" y="232" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">D[7:0] (8 біт)</text>
  <text x="300" y="268" font-size="12" fill="#6b7280" text-anchor="middle">Паралельний вхід</text>

  <!-- Block 2: 74HC165 Register -->
  <rect x="360" y="75" width="240" height="380" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <rect x="370" y="85" width="220" height="30" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="480" y="105" font-size="14" font-weight="700" fill="#2457d6" text-anchor="middle">2. Регістр 74HC165</text>

  <rect x="385" y="130" width="190" height="310" fill="white" stroke="#2457d6" stroke-width="2" rx="6"/>
  <text x="480" y="155" font-size="14" font-weight="700" fill="#2457d6" text-anchor="middle">IC 74HC165 (PISO)</text>

  <!-- Inputs on Left of IC -->
  <text x="395" y="190" font-size="12" font-weight="700" fill="#1a1a1a">D0..D7</text>
  <text x="395" y="210" font-size="12" fill="#6b7280">Паралельні входи</text>
  <rect x="395" y="220" width="80" height="20" fill="#eaf0fd" rx="2"/>
  <text x="435" y="234" font-size="12" fill="#2457d6" text-anchor="middle">8-біт фіксатор</text>

  <!-- Control & Serial Pins on Right of IC -->
  <rect x="495" y="180" width="70" height="40" fill="#fdecea" stroke="#c0392b" rx="3"/>
  <text x="530" y="197" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">PL (pin 1)</text>
  <text x="530" y="213" font-size="12" fill="#c0392b" text-anchor="middle">SH / LD</text>

  <rect x="495" y="240" width="70" height="40" fill="#eaf0fd" stroke="#2457d6" rx="3"/>
  <text x="530" y="257" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">CLK (pin 2)</text>
  <text x="530" y="273" font-size="12" fill="#2457d6" text-anchor="middle">CP Clock</text>

  <rect x="495" y="300" width="70" height="40" fill="#f4f6f8" stroke="#d0d7de" rx="3"/>
  <text x="530" y="317" font-size="12" font-weight="700" fill="#6b7280" text-anchor="middle">CE (pin 15)</text>
  <text x="530" y="333" font-size="12" fill="#6b7280" text-anchor="middle">GND (Active)</text>

  <rect x="495" y="360" width="70" height="40" fill="#e9f7ef" stroke="#27ae60" rx="3"/>
  <text x="530" y="377" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Q7 (pin 9)</text>
  <text x="530" y="393" font-size="12" fill="#27ae60" text-anchor="middle">Serial Data</text>

  <!-- Lines between Block 2 and Block 3 -->
  <!-- PL Line (MCU -> 74HC165) -->
  <line x1="710" y1="200" x2="570" y2="200" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="640" y="192" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">PL (Імпульс захвату)</text>

  <!-- CLK Line (MCU -> 74HC165) -->
  <line x1="710" y1="260" x2="570" y2="260" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="640" y="252" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">CLK (Такти зсуву)</text>

  <!-- CE Line (to GND) -->
  <line x1="570" y1="320" x2="640" y2="320" stroke="#6b7280" stroke-width="1.5"/>
  <text x="640" y="312" font-size="12" fill="#6b7280" text-anchor="middle">CE = GND</text>

  <!-- Q7 Line (74HC165 -> MCU) -->
  <line x1="570" y1="380" x2="710" y2="380" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="640" y="372" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Q7 (Послідовний потік)</text>

  <!-- Block 3: MCU -->
  <rect x="710" y="75" width="230" height="380" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <rect x="720" y="85" width="210" height="30" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="825" y="105" font-size="14" font-weight="700" fill="#2457d6" text-anchor="middle">3. Мікроконтролер (MCU)</text>

  <rect x="735" y="130" width="180" height="310" fill="white" stroke="#b0b7be" stroke-width="1.5" rx="6"/>
  <text x="825" y="155" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">MCU (STM32 / AVR)</text>

  <!-- MCU GPIO Pins -->
  <rect x="745" y="180" width="120" height="40" fill="#fdecea" stroke="#c0392b" rx="3"/>
  <text x="805" y="197" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">GPIO_PL (Out)</text>
  <text x="805" y="213" font-size="12" fill="#c0392b" text-anchor="middle">Latch Pulse</text>

  <rect x="745" y="240" width="120" height="40" fill="#eaf0fd" stroke="#2457d6" rx="3"/>
  <text x="805" y="257" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">GPIO_CLK / SCK</text>
  <text x="805" y="273" font-size="12" fill="#2457d6" text-anchor="middle">Clock Output</text>

  <rect x="745" y="300" width="120" height="40" fill="#f4f6f8" stroke="#d0d7de" rx="3"/>
  <text x="805" y="317" font-size="12" font-weight="700" fill="#6b7280" text-anchor="middle">GND</text>
  <text x="805" y="333" font-size="12" fill="#6b7280" text-anchor="middle">Спільна земля</text>

  <rect x="745" y="360" width="120" height="40" fill="#e9f7ef" stroke="#27ae60" rx="3"/>
  <text x="805" y="377" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">GPIO_DATA / MISO</text>
  <text x="805" y="393" font-size="12" fill="#27ae60" text-anchor="middle">Serial Input</text>
</svg>
