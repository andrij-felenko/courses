<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Header -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема підключення DIP-перемикача з резистивною збіркою підтяжки</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Розімкнений контакт підтягується до VCC (1, HIGH), замкнений — стягується на GND (0, LOW)</text>

  <!-- VCC Rail & Label -->
  <text x="100" y="84" text-anchor="end" font-size="14" font-weight="bold" fill="#c0392b">VCC (+3.3V)</text>
  <line x1="110" y1="80" x2="575" y2="80" stroke="#c0392b" stroke-width="3"/>
  <circle cx="110" cy="80" r="5" fill="#c0392b"/>

  <!-- SIL Resistor Array Box & Label -->
  <text x="120" y="73" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">Збірка SIL (4 × 10 кОм)</text>
  <rect x="110" y="92" width="465" height="74" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- VCC Connections to Resistors -->
  <line x1="170" y1="80" x2="170" y2="115" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="280" y1="80" x2="280" y2="115" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="390" y1="80" x2="390" y2="115" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="500" y1="80" x2="500" y2="115" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Resistor R1 -->
  <rect x="158" y="115" width="24" height="36" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="186" y="137" font-size="11" fill="#1a1a1a">R1 (10k)</text>

  <!-- Resistor R2 -->
  <rect x="268" y="115" width="24" height="36" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="296" y="137" font-size="11" fill="#1a1a1a">R2 (10k)</text>

  <!-- Resistor R3 -->
  <rect x="378" y="115" width="24" height="36" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="406" y="137" font-size="11" fill="#1a1a1a">R3 (10k)</text>

  <!-- Resistor R4 -->
  <rect x="488" y="115" width="24" height="36" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="516" y="137" font-size="11" fill="#1a1a1a">R4 (10k)</text>

  <!-- Wires from Resistors to Nodes N1..N4 -->
  <line x1="170" y1="151" x2="170" y2="195" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="280" y1="151" x2="280" y2="195" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="390" y1="151" x2="390" y2="195" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="500" y1="151" x2="500" y2="195" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Junction Nodes N1..N4 -->
  <circle cx="170" cy="195" r="4" fill="#1a1a1a"/>
  <circle cx="280" cy="195" r="4" fill="#1a1a1a"/>
  <circle cx="390" cy="195" r="4" fill="#1a1a1a"/>
  <circle cx="500" cy="195" r="4" fill="#1a1a1a"/>

  <!-- Node Labels -->
  <text x="162" y="185" text-anchor="end" font-size="12" fill="#6b7280">Лінія 1</text>
  <text x="272" y="185" text-anchor="end" font-size="12" fill="#6b7280">Лінія 2</text>
  <text x="382" y="185" text-anchor="end" font-size="12" fill="#6b7280">Лінія 3</text>
  <text x="492" y="185" text-anchor="end" font-size="12" fill="#6b7280">Лінія 4</text>

  <!-- DIP Switch Block Housing -->
  <rect x="110" y="235" width="465" height="125" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="335" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">DIP-перемикач</text>
  <text x="335" y="264" text-anchor="middle" font-size="11" fill="#6b7280">(4 позиції)</text>

  <!-- SW1: OFF (OPEN) -->
  <line x1="170" y1="195" x2="170" y2="260" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="170" cy="260" r="3" fill="#1a1a1a"/>
  <line x1="170" y1="260" x2="188" y2="305" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="170" cy="315" r="3" fill="#1a1a1a"/>
  <line x1="170" y1="315" x2="170" y2="385" stroke="#1a1a1a" stroke-width="2"/>
  <text x="184" y="342" font-size="11" font-weight="bold" fill="#27ae60">SW1: OFF</text>

  <!-- SW2: ON (CLOSED) -->
  <line x1="280" y1="195" x2="280" y2="260" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="280" cy="260" r="3" fill="#1a1a1a"/>
  <line x1="280" y1="260" x2="280" y2="315" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="280" cy="315" r="3" fill="#1a1a1a"/>
  <line x1="280" y1="315" x2="280" y2="385" stroke="#1a1a1a" stroke-width="2"/>
  <text x="294" y="342" font-size="11" font-weight="bold" fill="#c0392b">SW2: ON</text>

  <!-- SW3: OFF (OPEN) -->
  <line x1="390" y1="195" x2="390" y2="260" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="390" cy="260" r="3" fill="#1a1a1a"/>
  <line x1="390" y1="260" x2="408" y2="305" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="390" cy="315" r="3" fill="#1a1a1a"/>
  <line x1="390" y1="315" x2="390" y2="385" stroke="#1a1a1a" stroke-width="2"/>
  <text x="404" y="342" font-size="11" font-weight="bold" fill="#27ae60">SW3: OFF</text>

  <!-- SW4: ON (CLOSED) -->
  <line x1="500" y1="195" x2="500" y2="260" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="500" cy="260" r="3" fill="#1a1a1a"/>
  <line x1="500" y1="260" x2="500" y2="315" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="500" cy="315" r="3" fill="#1a1a1a"/>
  <line x1="500" y1="315" x2="500" y2="385" stroke="#1a1a1a" stroke-width="2"/>
  <text x="514" y="342" font-size="11" font-weight="bold" fill="#c0392b">SW4: ON</text>

  <!-- GND Bus Line & Symbol -->
  <line x1="140" y1="385" x2="530" y2="385" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="335" y1="385" x2="335" y2="402" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="315" y1="402" x2="355" y2="402" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="322" y1="407" x2="348" y2="407" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="329" y1="412" x2="341" y2="412" stroke="#1a1a1a" stroke-width="2"/>
  <text x="335" y="432" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">GND (0V)</text>

  <!-- Signal Lines from Junction Nodes N1..N4 to MCU -->
  <!-- Line 1: N1 (170, 195) -> (530, 195) -> (530, 175) -> (650, 175) -->
  <path d="M 170,195 L 530,195 L 530,175 L 650,175" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Line 2: N2 (280, 195) -> (542, 195) -> (542, 225) -> (650, 225) -->
  <path d="M 280,195 L 542,195 L 542,225 L 650,225" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Line 3: N3 (390, 195) -> (554, 195) -> (554, 275) -> (650, 275) -->
  <path d="M 390,195 L 554,195 L 554,275 L 650,275" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Line 4: N4 (500, 195) -> (566, 195) -> (566, 325) -> (650, 325) -->
  <path d="M 500,195 L 566,195 L 566,325 L 650,325" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Logic Badges on Signal Corridor -->
  <text x="610" y="166" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">1 (HIGH)</text>
  <text x="610" y="216" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">0 (LOW)</text>
  <text x="610" y="266" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">1 (HIGH)</text>
  <text x="610" y="316" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">0 (LOW)</text>

  <!-- MCU Box -->
  <rect x="650" y="95" width="270" height="365" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="2"/>

  <!-- MCU Header -->
  <path d="M 650,103 A 8,8 0 0,1 658,95 L 912,95 A 8,8 0 0,1 920,103 L 920,135 L 650,135 Z" fill="#2457d6"/>
  <text x="785" y="121" text-anchor="middle" font-size="14" font-weight="bold" fill="white">Мікроконтролер (MCU / ПЛІС)</text>

  <!-- MCU Pins & Statuses -->
  <!-- Pin 1 -->
  <circle cx="650" cy="175" r="4" fill="#2457d6"/>
  <text x="665" y="180" font-size="13" font-weight="bold" fill="#1a1a1a">PA0</text>
  <rect x="760" y="163" width="145" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="832" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">= 1 (Вхід HIGH)</text>

  <!-- Pin 2 -->
  <circle cx="650" cy="225" r="4" fill="#2457d6"/>
  <text x="665" y="230" font-size="13" font-weight="bold" fill="#1a1a1a">PA1</text>
  <rect x="760" y="213" width="145" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="832" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">= 0 (Вхід LOW)</text>

  <!-- Pin 3 -->
  <circle cx="650" cy="275" r="4" fill="#2457d6"/>
  <text x="665" y="280" font-size="13" font-weight="bold" fill="#1a1a1a">PA2</text>
  <rect x="760" y="263" width="145" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="832" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">= 1 (Вхід HIGH)</text>

  <!-- Pin 4 -->
  <circle cx="650" cy="325" r="4" fill="#2457d6"/>
  <text x="665" y="330" font-size="13" font-weight="bold" fill="#1a1a1a">PA3</text>
  <rect x="760" y="313" width="145" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="832" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">= 0 (Вхід LOW)</text>

  <!-- MCU Internal Register Result Card -->
  <rect x="665" y="365" width="240" height="80" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="785" y="386" text-anchor="middle" font-size="12" fill="#6b7280">Зчитаний код конфігурації:</text>
  <text x="785" y="410" text-anchor="middle" font-size="15" font-weight="bold" fill="#2457d6">0b1010  (Адреса / Код = 10)</text>
  <text x="785" y="430" text-anchor="middle" font-size="12" fill="#6b7280">Порядок бітів: [PA3, PA2, PA1, PA0]</text>
</svg>
