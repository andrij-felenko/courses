<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Header -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема підключення 4-позиційного DIP-перемикача та джампера до GPIO МК</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Підтяжка 10 кОм (Pull-up) гарантує «1», замикання на GND дає «0», конденсатори 100 нФ гасять дребезг</text>

  <!-- Power Rail VCC -->
  <line x1="120" y1="100" x2="560" y2="100" stroke="#c0392b" stroke-width="3"/>
  <text x="110" y="104" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="end">VCC (+3.3V)</text>

  <!-- Ground Rail GND -->
  <line x1="120" y1="500" x2="630" y2="500" stroke="#1a1a1a" stroke-width="3"/>
  <text x="110" y="504" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="end">GND (0V)</text>
  <!-- GND Symbol at x=120 -->
  <line x1="120" y1="500" x2="120" y2="510" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="110" y1="510" x2="130" y2="510" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="114" y1="514" x2="126" y2="514" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="118" y1="518" x2="122" y2="518" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Common Ground Bus Line at y=465 -->
  <line x1="170" y1="465" x2="620" y2="465" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="395" y1="465" x2="395" y2="500" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="395" cy="500" r="3.5" fill="#1a1a1a"/>

  <!-- DIP Switch Block Outline -->
  <rect x="135" y="365" width="330" height="85" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 2"/>
  <!-- Title Badge -->
  <rect x="195" y="346" width="210" height="20" rx="3" fill="white" stroke="#2457d6" stroke-width="1"/>
  <text x="300" y="360" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">4-позиційний DIP-перемикач</text>

  <!-- Jumper Block Outline -->
  <rect x="525" y="365" width="70" height="85" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="560" y="358" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Джампер J1</text>

  <!-- Channel 1 (SW1 / ADDR0 / 170) -->
  <!-- VCC Connection -->
  <circle cx="170" cy="100" r="3.5" fill="#c0392b"/>
  <line x1="170" y1="100" x2="170" y2="125" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Resistor R1 -->
  <rect x="162" y="125" width="16" height="35" rx="2" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="154" y="146" font-size="12" fill="#6b7280" text-anchor="end">R1 10k</text>
  <line x1="170" y1="160" x2="170" y2="190" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Junction Node 1 -->
  <circle cx="170" cy="190" r="3.5" fill="#1a1a1a"/>
  <!-- Line to MCU GPIO0 -->
  <line x1="170" y1="190" x2="710" y2="190" stroke="#27ae60" stroke-width="2"/>
  <!-- Line down to SW1 -->
  <line x1="170" y1="190" x2="170" y2="375" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- SW1 Housing & Contact -->
  <rect x="152" y="375" width="36" height="50" rx="3" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="170" cy="385" r="2.5" fill="#1a1a1a"/>
  <circle cx="170" cy="415" r="2.5" fill="#1a1a1a"/>
  <line x1="170" y1="415" x2="160" y2="388" stroke="#c0392b" stroke-width="2.5"/>
  <!-- Line down to GND Bus -->
  <line x1="170" y1="425" x2="170" y2="465" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="170" cy="465" r="3" fill="#1a1a1a"/>
  <!-- SW1 Labels at x=170, y=482 -->
  <text x="170" y="482" font-size="11" fill="#1a1a1a" text-anchor="middle">SW1 (BIT0)</text>
  <text x="170" y="496" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">ВІДКРИТО ("1")</text>

  <!-- Capacitor C1 Branch at x=230 -->
  <circle cx="230" cy="190" r="3.5" fill="#1a1a1a"/>
  <line x1="230" y1="190" x2="230" y2="328" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="220" y1="328" x2="240" y2="328" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="220" y1="334" x2="240" y2="334" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Gap for title rect at y=346..366 -->
  <line x1="230" y1="334" x2="230" y2="345" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="230" y1="367" x2="230" y2="465" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="230" cy="465" r="3" fill="#1a1a1a"/>
  <text x="245" y="335" font-size="11" fill="#6b7280" text-anchor="start">C1 100nF</text>

  <!-- Channel 2 (SW2 / ADDR1 / 300) -->
  <!-- VCC Connection -->
  <circle cx="300" cy="100" r="3.5" fill="#c0392b"/>
  <line x1="300" y1="100" x2="300" y2="125" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Resistor R2 -->
  <rect x="292" y="125" width="16" height="35" rx="2" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="284" y="146" font-size="12" fill="#6b7280" text-anchor="end">R2 10k</text>
  <line x1="300" y1="160" x2="300" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Junction Node 2 -->
  <circle cx="300" cy="260" r="3.5" fill="#1a1a1a"/>
  <!-- Line to MCU GPIO1 -->
  <line x1="300" y1="260" x2="710" y2="260" stroke="#2457d6" stroke-width="2"/>
  <!-- Line down to SW2 with gap at y=346..366 -->
  <line x1="300" y1="260" x2="300" y2="345" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="300" y1="367" x2="300" y2="375" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- SW2 Housing & Contact -->
  <rect x="282" y="375" width="36" height="50" rx="3" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="300" cy="385" r="2.5" fill="#1a1a1a"/>
  <circle cx="300" cy="415" r="2.5" fill="#1a1a1a"/>
  <line x1="300" y1="385" x2="300" y2="415" stroke="#2457d6" stroke-width="3"/>
  <!-- Line down to GND Bus -->
  <line x1="300" y1="425" x2="300" y2="465" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="300" cy="465" r="3" fill="#1a1a1a"/>
  <!-- SW2 Labels at x=280, y=482 -->
  <text x="280" y="482" font-size="11" fill="#1a1a1a" text-anchor="middle">SW2 (BIT1)</text>
  <text x="280" y="496" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">ЗАМКНЕНО ("0")</text>

  <!-- Capacitor C2 Branch at x=360 -->
  <circle cx="360" cy="260" r="3.5" fill="#1a1a1a"/>
  <line x1="360" y1="260" x2="360" y2="328" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="350" y1="328" x2="370" y2="328" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="350" y1="334" x2="370" y2="334" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Gap for title rect at y=346..366 -->
  <line x1="360" y1="334" x2="360" y2="345" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="360" y1="367" x2="360" y2="465" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="360" cy="465" r="3" fill="#1a1a1a"/>
  <text x="375" y="335" font-size="11" fill="#6b7280" text-anchor="start">C2 100nF</text>

  <!-- Channel 3 (SW3 / ADDR2 / 430) -->
  <!-- VCC Connection -->
  <circle cx="430" cy="100" r="3.5" fill="#c0392b"/>
  <line x1="430" y1="100" x2="430" y2="125" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Resistor R3 -->
  <rect x="422" y="125" width="16" height="35" rx="2" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="414" y="146" font-size="12" fill="#6b7280" text-anchor="end">R3 10k</text>
  <line x1="430" y1="160" x2="430" y2="330" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Junction Node 3 -->
  <circle cx="430" cy="330" r="3.5" fill="#1a1a1a"/>
  <!-- Line to MCU GPIO2 -->
  <line x1="430" y1="330" x2="710" y2="330" stroke="#27ae60" stroke-width="2"/>
  <!-- Line down to SW3 -->
  <line x1="430" y1="330" x2="430" y2="375" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- SW3 Housing & Contact -->
  <rect x="412" y="375" width="36" height="50" rx="3" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="430" cy="385" r="2.5" fill="#1a1a1a"/>
  <circle cx="430" cy="415" r="2.5" fill="#1a1a1a"/>
  <line x1="430" y1="415" x2="420" y2="388" stroke="#c0392b" stroke-width="2.5"/>
  <!-- Line down to GND Bus -->
  <line x1="430" y1="425" x2="430" y2="465" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="430" cy="465" r="3" fill="#1a1a1a"/>
  <!-- SW3 Labels at x=450, y=482 -->
  <text x="450" y="482" font-size="11" fill="#1a1a1a" text-anchor="middle">SW3 (BIT2)</text>
  <text x="450" y="496" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">ВІДКРИТО ("1")</text>

  <!-- Capacitor C3 Branch at x=490 -->
  <circle cx="490" cy="330" r="3.5" fill="#1a1a1a"/>
  <line x1="490" y1="330" x2="490" y2="345" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="480" y1="345" x2="500" y2="345" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="480" y1="351" x2="500" y2="351" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="490" y1="351" x2="490" y2="465" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="490" cy="465" r="3" fill="#1a1a1a"/>
  <text x="505" y="352" font-size="11" fill="#6b7280" text-anchor="start">C3 100nF</text>

  <!-- Channel 4 (J1 / BOOT0 / 560) -->
  <!-- VCC Connection -->
  <circle cx="560" cy="100" r="3.5" fill="#c0392b"/>
  <line x1="560" y1="100" x2="560" y2="125" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Resistor R4 -->
  <rect x="552" y="125" width="16" height="35" rx="2" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="544" y="146" font-size="12" fill="#6b7280" text-anchor="end">R4 10k</text>
  <line x1="560" y1="160" x2="560" y2="400" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Junction Node 4 -->
  <circle cx="560" cy="400" r="3.5" fill="#1a1a1a"/>
  <!-- Line to MCU GPIO3 -->
  <line x1="560" y1="400" x2="710" y2="400" stroke="#2457d6" stroke-width="2"/>
  <!-- Line down to J1 -->
  <line x1="560" y1="400" x2="560" y2="375" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- J1 Housing & Jumper Cap -->
  <circle cx="560" cy="387" r="3" fill="#1a1a1a"/>
  <circle cx="560" cy="413" r="3" fill="#1a1a1a"/>
  <rect x="550" y="380" width="20" height="40" rx="3" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Line down to GND Bus -->
  <line x1="560" y1="420" x2="560" y2="465" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="560" cy="465" r="3" fill="#1a1a1a"/>
  <!-- J1 Labels at x=560, y=482 -->
  <text x="560" y="482" font-size="11" fill="#1a1a1a" text-anchor="middle">J1 (BOOT0)</text>
  <text x="560" y="496" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">ВСТАНОВЛЕНО ("0")</text>

  <!-- Capacitor C4 Branch at x=620 -->
  <circle cx="620" cy="400" r="3.5" fill="#1a1a1a"/>
  <line x1="620" y1="400" x2="620" y2="415" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="610" y1="415" x2="630" y2="415" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="610" y1="421" x2="630" y2="421" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="620" y1="421" x2="620" y2="465" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="620" cy="465" r="3" fill="#1a1a1a"/>
  <text x="635" y="422" font-size="11" fill="#6b7280" text-anchor="start">C4 100nF</text>

  <!-- MCU Box -->
  <rect x="710" y="110" width="220" height="380" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="820" y="138" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">Мікроконтролер (MCU)</text>
  <text x="820" y="156" font-size="12" fill="#6b7280" text-anchor="middle">GPIO з фільтрацією та Pull-up</text>
  <line x1="730" y1="166" x2="910" y2="166" stroke="#2457d6" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Signal Arrows into MCU -->
  <polygon points="705,190 695,185 695,195" fill="#27ae60"/>
  <polygon points="705,260 695,255 695,265" fill="#2457d6"/>
  <polygon points="705,330 695,325 695,335" fill="#27ae60"/>
  <polygon points="705,400 695,395 695,405" fill="#2457d6"/>

  <!-- MCU Pin Details -->
  <!-- Pin 1 -->
  <text x="722" y="194" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">GPIO0 (ADDR0)</text>
  <rect x="850" y="179" width="65" height="20" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="882" y="193" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">1 (HIGH)</text>

  <!-- Pin 2 -->
  <text x="722" y="264" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">GPIO1 (ADDR1)</text>
  <rect x="850" y="249" width="65" height="20" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="882" y="263" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">0 (LOW)</text>

  <!-- Pin 3 -->
  <text x="722" y="334" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">GPIO2 (ADDR2)</text>
  <rect x="850" y="319" width="65" height="20" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="882" y="333" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">1 (HIGH)</text>

  <!-- Pin 4 -->
  <text x="722" y="404" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">GPIO3 (BOOT0)</text>
  <rect x="850" y="389" width="65" height="20" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="882" y="403" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">0 (LOW)</text>

  <!-- Summary Box inside MCU -->
  <rect x="725" y="435" width="190" height="42" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="820" y="452" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">I2C Адреса: 0x05 (101₂)</text>
  <text x="820" y="468" font-size="11" fill="#6b7280" text-anchor="middle">Режим: Завантажувач (BOOT=0)</text>
</svg>
