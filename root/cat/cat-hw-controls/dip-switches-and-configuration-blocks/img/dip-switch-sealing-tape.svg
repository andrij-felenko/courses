<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="480" fill="white"/>
  
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Захист герметичного DIP-перемикача від флюсу поліімідною плівкою</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Захисна Kapton-плівка витримує паяння хвилею та запобігає забрудненню контактних груп</text>

  <!-- PANEL 1: Sealing -->
  <rect x="30" y="80" width="280" height="370" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="40" y="90" width="260" height="30" rx="4" fill="#eaf0fd"/>
  <text x="170" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">1. Герметизація плівкою</text>
  
  <text x="170" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#d35400">Kapton-плівка (поліімід)</text>
  <path d="M170,142 L170,162" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  
  <!-- Tape & Switch Body as paths -->
  <path d="M75,170 L265,170 L265,184 L75,184 Z" fill="#f39c12" fill-opacity="0.9" stroke="#d35400" stroke-width="1"/>
  <path d="M85,186 L255,186 L255,266 L85,266 Z" fill="#c0392b" rx="4"/>
  
  <!-- Slots & Actuators in Panel 1 (drawn as paths) -->
  <path d="M100,191 L125,191 L125,206 L100,206 Z" fill="#7f8c8d"/>
  <path d="M140,191 L165,191 L165,206 L140,206 Z" fill="#7f8c8d"/>
  <path d="M180,191 L205,191 L205,206 L180,206 Z" fill="#7f8c8d"/>
  <path d="M220,191 L245,191 L245,206 L220,206 Z" fill="#7f8c8d"/>
  
  <path d="M108,193 L117,193 L117,211 L108,211 Z" fill="#ffffff"/>
  <path d="M148,193 L157,193 L157,211 L148,211 Z" fill="#ffffff"/>
  <path d="M188,193 L197,193 L197,211 L188,211 Z" fill="#ffffff"/>
  <path d="M228,193 L237,193 L237,211 L228,211 Z" fill="#ffffff"/>

  <path d="M65,268 L275,268 L275,280 L65,280 Z" fill="#27ae60"/>
  <text x="170" y="298" text-anchor="middle" font-size="12" fill="#6b7280">Друкована плата (PCB)</text>

  <rect x="45" y="325" width="250" height="105" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="170" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Захисне накриття</text>
  <text x="170" y="370" text-anchor="middle" font-size="12" fill="#1a1a1a">Термостійкий шар (до 260 °C)</text>
  <text x="170" y="390" text-anchor="middle" font-size="12" fill="#1a1a1a">Закриває зазори слайдерів</text>
  <text x="170" y="410" text-anchor="middle" font-size="12" fill="#6b7280">Запобігає капілярному затіканню</text>

  <!-- PANEL 2: Wave Soldering -->
  <rect x="340" y="80" width="280" height="370" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="350" y="90" width="260" height="30" rx="4" fill="#fdecea"/>
  <text x="480" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">2. Паяння хвилею та флюс</text>

  <text x="480" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">✓ Захищений верхній зазор</text>
  
  <path d="M385,173 L575,173 L575,187 L385,187 Z" fill="#f39c12" fill-opacity="0.95" stroke="#d35400" stroke-width="1"/>
  <path d="M395,189 L565,189 L565,259 L395,259 Z" fill="#c0392b"/>
  <path d="M375,261 L585,261 L585,273 L375,273 Z" fill="#27ae60"/>

  <line x1="415" y1="273" x2="415" y2="310" stroke="#7f8c8d" stroke-width="3"/>
  <line x1="455" y1="273" x2="455" y2="310" stroke="#7f8c8d" stroke-width="3"/>
  <line x1="495" y1="273" x2="495" y2="310" stroke="#7f8c8d" stroke-width="3"/>
  <line x1="535" y1="273" x2="535" y2="310" stroke="#7f8c8d" stroke-width="3"/>

  <!-- Solder wave -->
  <path d="M360,328 Q400,300 440,312 T520,308 T600,325 L600,350 L360,350 Z" fill="#2980b9" fill-opacity="0.85"/>
  <text x="480" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Хвиля рідкого припою (260 °C)</text>

  <!-- Vapor/flux capillary movement arrows -->
  <path d="M390,285 C380,245 380,215 382,192" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
  <path d="M570,285 C580,245 580,215 578,192" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>

  <rect x="355" y="360" width="250" height="75" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="480" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Капілярний ефект та пари</text>
  <text x="480" y="400" text-anchor="middle" font-size="12" fill="#1a1a1a">Флюс піднімається крізь отвори</text>
  <text x="480" y="420" text-anchor="middle" font-size="12" fill="#27ae60">Плівка затримує флюс зовні</text>

  <!-- PANEL 3: Washing & Tape Removal -->
  <rect x="650" y="80" width="280" height="370" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="660" y="90" width="260" height="30" rx="4" fill="#e9f7ef"/>
  <text x="790" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">3. Промивка та зняття плівки</text>

  <path d="M685,145 L705,170 M700,140 L715,168 M715,142 L725,165" stroke="#2457d6" stroke-width="2" stroke-dasharray="2,2"/>
  <path d="M895,145 L875,170 M880,140 L865,168 M850,142 L840,165" stroke="#2457d6" stroke-width="2" stroke-dasharray="2,2"/>
  <text x="790" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Спрей розчинника / мийка</text>

  <path d="M705,200 L875,200 L875,280 L705,280 Z" fill="#c0392b"/>

  <path d="M720,205 L745,205 L745,220 L720,220 Z" fill="#7f8c8d"/>
  <path d="M760,205 L785,205 L785,220 L760,220 Z" fill="#7f8c8d"/>
  <path d="M800,205 L825,205 L825,220 L800,220 Z" fill="#7f8c8d"/>
  <path d="M840,205 L865,205 L865,220 L840,220 Z" fill="#7f8c8d"/>

  <path d="M728,207 L737,207 L737,225 L728,225 Z" fill="#ffffff"/>
  <path d="M768,207 L777,207 L777,225 L768,225 Z" fill="#ffffff"/>
  <path d="M808,207 L817,207 L817,225 L808,225 Z" fill="#ffffff"/>
  <path d="M848,207 L857,207 L857,225 L848,225 Z" fill="#ffffff"/>

  <!-- Tape peeling off -->
  <path d="M695,196 L805,196 Q840,196 855,178 L880,153" fill="none" stroke="#f39c12" stroke-width="8" stroke-linecap="round"/>
  <path d="M850,173 L875,148" stroke="#d35400" stroke-width="2" marker-end="url(#arr-dark)"/>
  <text x="880" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#d35400">Зняття плівки</text>

  <path d="M685,282 L895,282 L895,294 L685,294 Z" fill="#27ae60"/>

  <path d="M725,294 L730,304 L735,294 Z" fill="#7f8c8d"/>
  <path d="M765,294 L770,304 L775,294 Z" fill="#7f8c8d"/>
  <path d="M805,294 L810,304 L815,294 Z" fill="#7f8c8d"/>
  <path d="M845,294 L850,304 L855,294 Z" fill="#7f8c8d"/>

  <rect x="665" y="325" width="250" height="105" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="790" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Чисті внутрішні контакти</text>
  <text x="790" y="370" text-anchor="middle" font-size="12" fill="#1a1a1a">Ніяких залишків флюсу всередині</text>
  <text x="790" y="390" text-anchor="middle" font-size="12" fill="#1a1a1a">Плівка викидається після мийки</text>
  <text x="790" y="410" text-anchor="middle" font-size="12" fill="#6b7280">Перемикач готовий до роботи</text>
</svg>
