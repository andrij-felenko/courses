<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Підкладка полотна -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <defs>
    <!-- Маркери стрілок -->
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Програмна архітектура драйвера RVDT та потік обробки даних</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Передача вибірок АЦП у C/C++ структуру драйвера, демодуляція, раціометрія, LUT-корекція та діагностика</text>

  <!-- КОЛОНКА 1: Апаратний рівень -->
  <rect x="30" y="75" width="195" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="127.5" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Апаратний рівень</text>
  <text x="127.5" y="115" font-size="12" fill="#6b7280" text-anchor="middle">АЦП та сирі сигнали</text>

  <!-- Блок 1A: RVDT Давач -->
  <rect x="42" y="130" width="171" height="85" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="127.5" y="148" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">RVDT Давач</text>
  <text x="127.5" y="168" font-size="12" fill="#1a1a1a" text-anchor="middle">Обмотки V_s1, V_s2</text>
  <text x="127.5" y="186" font-size="12" fill="#1a1a1a" text-anchor="middle">Збудження V_exc</text>
  <text x="127.5" y="202" font-size="11" fill="#6b7280" text-anchor="middle">Аналогові сигнали</text>

  <!-- Блок 1B: АЦП / DMA Модуль -->
  <rect x="42" y="240" width="171" height="95" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="127.5" y="258" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">АЦП / DMA Модуль</text>
  <text x="127.5" y="278" font-size="12" fill="#1a1a1a" text-anchor="middle">Синхронна вибірка 3ch</text>
  <text x="127.5" y="296" font-size="12" fill="#1a1a1a" text-anchor="middle">Кільцевий DMA буфер</text>
  <text x="127.5" y="314" font-size="11" fill="#6b7280" text-anchor="middle">Оцифрування V_s1, V_s2</text>

  <!-- Блок 1C: Подія переривання -->
  <rect x="42" y="360" width="171" height="95" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="127.5" y="378" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Подія переривання</text>
  <text x="127.5" y="398" font-size="12" fill="#1a1a1a" text-anchor="middle">Тригер: ADC_EOS_IRQ</text>
  <text x="127.5" y="416" font-size="12" fill="#1a1a1a" text-anchor="middle">DMA Half/Full Transfer</text>
  <text x="127.5" y="434" font-size="11" fill="#6b7280" text-anchor="middle">Передача в драйвер</text>


  <!-- КОЛОНКА 2: ISR & Структури даних -->
  <rect x="250" y="75" width="205" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="352.5" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. ISR &amp; Структури даних</text>
  <text x="352.5" y="115" font-size="12" fill="#6b7280" text-anchor="middle">Первинна обробка вибірок</text>

  <!-- Блок 2A: ISR Handler -->
  <rect x="262" y="130" width="181" height="90" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="352.5" y="148" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">ISR: rvdt_adc_isr()</text>
  <text x="352.5" y="168" font-size="12" fill="#1a1a1a" text-anchor="middle">Читання сирих відліків</text>
  <text x="352.5" y="186" font-size="12" fill="#1a1a1a" text-anchor="middle">Запис у структуру даних</text>
  <text x="352.5" y="204" font-size="11" fill="#2457d6" text-anchor="middle">rvdt_raw_samples_t</text>

  <!-- Блок 2B: Діагностика обмоток -->
  <rect x="262" y="240" width="181" height="95" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="352.5" y="258" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Перевірка обриву / КЗ</text>
  <text x="352.5" y="278" font-size="12" fill="#1a1a1a" text-anchor="middle">V_s1 + V_s2 &lt; V_min (Обрив)</text>
  <text x="352.5" y="296" font-size="12" fill="#1a1a1a" text-anchor="middle">V_s1, V_s2 &gt; V_max (КЗ)</text>
  <text x="352.5" y="314" font-size="11" fill="#c0392b" text-anchor="middle">rvdt_diag_flags_t</text>

  <!-- Блок 2C: Демодулятор -->
  <rect x="262" y="360" width="181" height="95" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="352.5" y="378" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Синхронний демодулятор</text>
  <text x="352.5" y="398" font-size="12" fill="#1a1a1a" text-anchor="middle">Виділення огинаючої</text>
  <text x="352.5" y="416" font-size="12" fill="#1a1a1a" text-anchor="middle">Обчислення піків A_s1, A_s2</text>
  <text x="352.5" y="434" font-size="11" fill="#6b7280" text-anchor="middle">Фазовий аналіз V_exc</text>


  <!-- КОЛОНКА 3: Раціометрія та DSP -->
  <rect x="480" y="75" width="210" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="585" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3. Раціометрія та DSP</text>
  <text x="585" y="115" font-size="12" fill="#6b7280" text-anchor="middle">Обчислення кута та фільтрація</text>

  <!-- Блок 3A: Раціометричний розрахунок -->
  <rect x="492" y="130" width="186" height="100" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="585" y="148" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Раціометричний розрахунок</text>
  <text x="585" y="168" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Ratio = (A_s1 - A_s2) / Sum</text>
  <text x="585" y="186" font-size="11" fill="#1a1a1a" text-anchor="middle">Компенсація V_exc та T°</text>
  <text x="585" y="204" font-size="11" fill="#6b7280" text-anchor="middle">Сирий кут theta_raw</text>
  <text x="585" y="220" font-size="11" fill="#2457d6" text-anchor="middle">rvdt_calc_angle_ratio()</text>

  <!-- Блок 3B: Цифровий фільтр -->
  <rect x="492" y="245" width="186" height="95" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="585" y="263" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Цифрова фільтрація (DSP)</text>
  <text x="585" y="283" font-size="12" fill="#1a1a1a" text-anchor="middle">Низькочастотний IIR/FIR</text>
  <text x="585" y="301" font-size="12" fill="#1a1a1a" text-anchor="middle">Приглушення шуму АЦП</text>
  <text x="585" y="319" font-size="11" fill="#6b7280" text-anchor="middle">Результат: theta_filt</text>

  <!-- Блок 3C: Структура стану -->
  <rect x="492" y="355" width="186" height="100" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="585" y="373" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Структура rvdt_handle_t</text>
  <text x="585" y="393" font-size="11" fill="#1a1a1a" text-anchor="middle">float raw_angle</text>
  <text x="585" y="411" font-size="11" fill="#1a1a1a" text-anchor="middle">float filtered_angle</text>
  <text x="585" y="429" font-size="11" fill="#1a1a1a" text-anchor="middle">rvdt_diag_flags_t flags</text>
  <text x="585" y="445" font-size="11" fill="#27ae60" text-anchor="middle">Оновлення стану C/C++</text>


  <!-- КОЛОНКА 4: Калібрування та API -->
  <rect x="715" y="75" width="215" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="822.5" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">4. Калібрування та API</text>
  <text x="822.5" y="115" font-size="12" fill="#6b7280" text-anchor="middle">Прикладний рівень C/C++</text>

  <!-- Блок 4A: LUT Інтерполяція -->
  <rect x="727" y="130" width="191" height="95" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="822.5" y="148" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Таблична LUT-корекція</text>
  <text x="822.5" y="168" font-size="12" fill="#1a1a1a" text-anchor="middle">Компенсація нелінійності</text>
  <text x="822.5" y="186" font-size="12" fill="#1a1a1a" text-anchor="middle">Кутова інтерполяція</text>
  <text x="822.5" y="204" font-size="11" fill="#6b7280" text-anchor="middle">rvdt_calib_lut_t table</text>

  <!-- Блок 4B: C/C++ API -->
  <rect x="727" y="245" width="191" height="95" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="822.5" y="263" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">C/C++ Інтерфейс API</text>
  <text x="822.5" y="283" font-size="11" fill="#1a1a1a" text-anchor="middle">rvdt_get_angle_deg()</text>
  <text x="822.5" y="301" font-size="11" fill="#1a1a1a" text-anchor="middle">rvdt_get_status()</text>
  <text x="822.5" y="319" font-size="11" fill="#27ae60" text-anchor="middle">Повертає rvdt_status_t</text>

  <!-- Блок 4C: Результат RTOS/App -->
  <rect x="727" y="360" width="191" height="95" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="822.5" y="378" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Додаток / Система RTOS</text>
  <text x="822.5" y="398" font-size="12" fill="#1a1a1a" text-anchor="middle">Точний кут theta (град)</text>
  <text x="822.5" y="416" font-size="12" fill="#1a1a1a" text-anchor="middle">Статус: RVDT_OK / FAULT</text>
  <text x="822.5" y="434" font-size="11" fill="#2457d6" text-anchor="middle">Контур сервокерування</text>


  <!-- ЗВ'ЯЗУВАЛЬНІ ЛІНІЇ ТА СТРІЛКИ -->

  <!-- Колонка 1 внутрішні -->
  <line x1="127.5" y1="215" x2="127.5" y2="240" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="135" y="231" font-size="10" fill="#6b7280" text-anchor="start">V_s1, V_s2</text>

  <line x1="127.5" y1="335" x2="127.5" y2="360" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="135" y="351" font-size="10" fill="#6b7280" text-anchor="start">IRQ Event</text>

  <!-- Зв'язок Колонка 1 -> Колонка 2 -->
  <line x1="213" y1="175" x2="262" y2="175" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="237.5" y="167" font-size="10" fill="#2457d6" text-anchor="middle">DMA / IRQ</text>

  <!-- Колонка 2 внутрішні -->
  <line x1="352.5" y1="220" x2="352.5" y2="240" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="360" y="233" font-size="10" fill="#6b7280" text-anchor="start">Сирі вибірки</text>

  <line x1="352.5" y1="335" x2="352.5" y2="360" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="360" y="351" font-size="10" fill="#6b7280" text-anchor="start">Перевірка OK</text>

  <!-- Зв'язок Колонка 2 -> Колонка 3 -->
  <path d="M 443,407 L 467.5,407 L 467.5,180 L 492,180" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="467.5" y="170" font-size="10" fill="#2457d6" text-anchor="middle">Амплітуди A1, A2</text>

  <!-- Колонка 3 внутрішні -->
  <line x1="585" y1="230" x2="585" y2="245" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="592" y="240" font-size="10" fill="#6b7280" text-anchor="start">theta_raw</text>

  <line x1="585" y1="340" x2="585" y2="355" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="592" y="350" font-size="10" fill="#6b7280" text-anchor="start">theta_filt</text>

  <!-- Зв'язок Колонка 3 -> Колонка 4 -->
  <path d="M 678,405 L 702.5,405 L 702.5,177 L 727,177" fill="none" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="702.5" y="167" font-size="10" fill="#27ae60" text-anchor="middle">theta_filt</text>

  <!-- Колонка 4 внутрішні -->
  <line x1="822.5" y1="225" x2="822.5" y2="245" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="830" y="238" font-size="10" fill="#6b7280" text-anchor="start">theta_corr</text>

  <line x1="822.5" y1="340" x2="822.5" y2="360" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="830" y="353" font-size="10" fill="#2457d6" text-anchor="start">RVDT_OK</text>


  <!-- НИЖНЯ ПАНЕЛЬ ЛЕГЕНДИ -->
  <rect x="30" y="485" width="900" height="35" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <rect x="45" y="496" width="12" height="12" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="63" y="506" font-size="11" fill="#1a1a1a">Обробка вибірок АЦП</text>

  <rect x="240" y="496" width="12" height="12" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="258" y="506" font-size="11" fill="#1a1a1a">Діагностика обмоток (Обрив/КЗ)</text>

  <rect x="500" y="496" width="12" height="12" rx="2" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="518" y="506" font-size="11" fill="#1a1a1a">Готовий кут та статус RVDT</text>

  <rect x="730" y="496" width="12" height="12" rx="2" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="748" y="506" font-size="11" fill="#1a1a1a">Таблиці та структури даних</text>
</svg>
