<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-orange" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#e67e22"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Векторна діаграма та схема раціометричного декодування сигналів RVDT</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Обчислення кута θ = atan2(V_diff, V_sum) повністю компенсує нестабільність напруги збудження V_exc</text>

  <!-- ЛІВА ПАНЕЛЬ: Векторна діаграма -->
  <rect x="30" y="75" width="430" height="410" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="245" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Векторний простір сигналів (V_sum, V_diff)</text>

  <!-- Легенда векторів -->
  <rect x="45" y="115" width="400" height="65" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="133" font-size="11" fill="#1a1a1a">• V_sum = V_S1 + V_S2 (пропорційна V_exc)</text>
  <text x="55" y="149" font-size="11" fill="#1a1a1a">• V_diff = V_S1 - V_S2 (пропорційна θ · V_exc)</text>
  <text x="55" y="165" font-size="11" fill="#27ae60" font-weight="bold">• Відношення V_diff / V_sum = k · θ (інваріантне)</text>

  <!-- Осі координат -->
  <!-- Горизонтальна вісь V_sum -->
  <line x1="75" y1="320" x2="420" y2="320" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="428" y="324" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">V_sum</text>

  <!-- Вертикальна вісь V_diff -->
  <line x1="100" y1="410" x2="100" y2="195" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="100" y="187" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">V_diff</text>

  <!-- Проекції і мітки для Вектора 1 (номінал V_exc) -->
  <line x1="360" y1="320" x2="360" y2="190" stroke="#2457d6" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="100" y1="190" x2="360" y2="190" stroke="#2457d6" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="360" y="336" text-anchor="middle" font-size="11" fill="#2457d6">V_sum1</text>
  <text x="92" y="194" text-anchor="end" font-size="11" fill="#2457d6">V_diff1</text>

  <!-- Проекції і мітки для Вектора 2 (просідання V_exc) -->
  <line x1="240" y1="320" x2="240" y2="250" stroke="#e67e22" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="100" y1="250" x2="240" y2="250" stroke="#e67e22" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="240" y="336" text-anchor="middle" font-size="11" fill="#e67e22">V_sum2</text>
  <text x="92" y="254" text-anchor="end" font-size="11" fill="#e67e22">V_diff2</text>

  <!-- Вектор 1 (номінальний) -->
  <line x1="100" y1="320" x2="354" y2="193" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <circle cx="360" cy="190" r="4" fill="#2457d6"/>
  <text x="368" y="185" font-size="12" font-weight="bold" fill="#2457d6">V(θ) [номінал V_exc]</text>

  <!-- Вектор 2 (при зсуві/просіданні V_exc) -->
  <line x1="100" y1="320" x2="234" y2="253" stroke="#e67e22" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arr-orange)"/>
  <circle cx="240" cy="250" r="4" fill="#e67e22"/>
  <text x="125" y="235" font-size="11" font-weight="bold" fill="#e67e22">V'(θ) [просідання V_exc]</text>

  <!-- Кутова дуга θ -->
  <path d="M 170,320 A 70,70 0 0,0 163,289" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="180" y="298" font-size="14" font-weight="bold" fill="#27ae60">θ</text>

  <!-- Примітка внизу лівої панелі -->
  <rect x="45" y="435" width="400" height="35" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="245" y="457" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Напрямок вектора θ = arctan(V_diff / V_sum) стабільний</text>


  <!-- ПРАВА ПАНЕЛЬ: Схема декодування -->
  <rect x="490" y="75" width="440" height="410" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="710" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Схема раціометричної обробки сигналів</text>

  <!-- Вхідні блоки сигналів -->
  <rect x="510" y="135" width="75" height="40" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="547.5" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">V_S1(t)</text>

  <rect x="510" y="210" width="75" height="40" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="547.5" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">V_S2(t)</text>

  <!-- Стрілки від входів до суматора та різницевого підсилювача -->
  <line x1="585" y1="155" x2="607" y2="155" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="585" y1="230" x2="607" y2="230" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Блоки суми та різниці -->
  <rect x="615" y="132" width="120" height="48" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="675" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Суматор</text>
  <text x="675" y="168" text-anchor="middle" font-size="11" fill="#2457d6">V_sum = V_S1 + V_S2</text>

  <rect x="615" y="207" width="120" height="48" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="675" y="227" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Різницевий підс.</text>
  <text x="675" y="243" text-anchor="middle" font-size="11" fill="#2457d6">V_diff = V_S1 - V_S2</text>

  <!-- Стрілки від суми і різниці до блоку DSP/atan2 -->
  <line x1="735" y1="156" x2="757" y2="156" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="746" y="148" text-anchor="middle" font-size="10" fill="#2457d6">V_sum</text>

  <line x1="735" y1="231" x2="757" y2="231" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="746" y="223" text-anchor="middle" font-size="10" fill="#2457d6">V_diff</text>

  <!-- Блок Синхронного DSP / Обчислювача atan2 -->
  <rect x="765" y="132" width="150" height="128" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="840" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Синхронний DSP / RDC</text>
  <text x="840" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">θ = atan2(V_d, V_s)</text>
  <line x1="780" y1="184" x2="900" y2="184" stroke="#d0d7de" stroke-width="1"/>
  <text x="840" y="202" text-anchor="middle" font-size="11" fill="#27ae60">Демодуляція + АЦП</text>
  <text x="840" y="219" text-anchor="middle" font-size="11" fill="#27ae60">Скасування V_exc</text>
  <text x="840" y="238" text-anchor="middle" font-size="10" fill="#6b7280">синхр. з генератором</text>

  <!-- Стрілка до вихідного блоку -->
  <line x1="840" y1="260" x2="840" y2="307" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Вихідний блок Кут θ -->
  <rect x="765" y="315" width="150" height="42" rx="6" fill="#27ae60"/>
  <text x="840" y="341" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Вихід: Кут θ</text>

  <!-- Нижня примітка правої панелі -->
  <rect x="510" y="405" width="410" height="60" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="715" y="428" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Результат раціометричного оброблення:</text>
  <text x="715" y="449" text-anchor="middle" font-size="11" fill="#1a1a1a">Повна незалежність від амплітуди збудження V_exc та температури</text>
</svg>
