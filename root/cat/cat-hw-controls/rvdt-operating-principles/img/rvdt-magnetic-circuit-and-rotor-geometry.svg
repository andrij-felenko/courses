<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Магнітопровід RVDT: геометрична зміна зазору та перетворення кута</text>
  <text x="480" y="52" font-size="13" text-anchor="middle" fill="#6b7280">Профільований ротор змінює повітряні зазори δ1 та δ2, модулюючи взаємну індуктивність вторинних обмоток S1 та S2</text>

  <!-- Left Panel: RVDT Magnetic Circuit Cross-Section -->
  <rect x="40" y="90" width="430" height="390" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="255" y="115" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Схема магнітопроводу RVDT</text>

  <!-- Stator Yoke Circles -->
  <circle cx="255" cy="275" r="135" fill="none" stroke="#6b7280" stroke-width="4"/>
  <circle cx="255" cy="275" r="105" fill="white" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Top Pole: Primary Winding P -->
  <text x="255" y="132" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">Первинна V_exc</text>
  <path d="M 235,140 L 275,140 L 275,185 L 235,185 Z" fill="#d0d7de" stroke="#6b7280"/>
  <rect x="220" y="150" width="70" height="24" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="255" y="166" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">Обмотка P</text>

  <!-- Left Pole: Secondary Winding S1 -->
  <text x="110" y="240" font-size="12" font-weight="bold" text-anchor="end" fill="#27ae60">Зазор δ1(θ)</text>
  <path d="M 140,257 L 180,257 L 180,293 L 140,293 Z" fill="#d0d7de" stroke="#6b7280"/>
  <!-- Secondary Winding S1 Box with internal labels to clear stator lines -->
  <rect x="146" y="242" width="32" height="66" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="162" y="267" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">S1</text>
  <text x="162" y="291" font-size="11" font-weight="bold" text-anchor="middle" fill="#27ae60">Φ1</text>

  <!-- Right Pole: Secondary Winding S2 -->
  <text x="400" y="240" font-size="12" font-weight="bold" text-anchor="start" fill="#c0392b">Зазор δ2(θ)</text>
  <path d="M 330,257 L 370,257 L 370,293 L 330,293 Z" fill="#d0d7de" stroke="#6b7280"/>
  <!-- Secondary Winding S2 Box with internal labels to clear stator lines -->
  <rect x="332" y="242" width="32" height="66" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="4"/>
  <text x="348" y="267" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">S2</text>
  <text x="348" y="291" font-size="11" font-weight="bold" text-anchor="middle" fill="#c0392b">Φ2</text>

  <!-- Cam Rotor in Center -->
  <path d="M 255,195 C 315,215 310,335 255,335 C 210,335 215,215 255,195 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="255" cy="275" r="10" fill="#1a1a1a"/>

  <!-- Rotation Arrow & Angle Label -->
  <path d="M 230,250 A 30,30 0 0,1 280,250" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="255" y="360" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">Кут повороту θ</text>

  <!-- Explanatory Text at Bottom of Left Panel -->
  <text x="255" y="425" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">При повороті ротора на θ: зазор δ1 зменшується, δ2 зростає</text>
  <text x="255" y="450" font-size="12" text-anchor="middle" fill="#6b7280">Внаслідок цього: напруга V_S1 зростає, а V_S2 зменшується</text>

  <!-- Right Panel Top: Characteristics Plot -->
  <rect x="490" y="90" width="430" height="215" fill="white" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="705" y="115" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Залежність вихідних напруг від кута θ</text>

  <!-- Axes -->
  <line x1="520" y1="210" x2="875" y2="210" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="700" y1="275" x2="700" y2="135" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="888" y="214" font-size="12" font-weight="bold" fill="#6b7280">θ</text>
  <text x="700" y="128" font-size="12" font-weight="bold" text-anchor="middle" fill="#6b7280">V</text>

  <!-- Neutral Line & Marks -->
  <line x1="700" y1="140" x2="700" y2="270" stroke="#d0d7de" stroke-dasharray="3,3"/>
  <text x="700" y="293" font-size="12" text-anchor="middle" fill="#6b7280">θ = 0 (Нуль RVDT)</text>
  <text x="550" y="226" font-size="12" text-anchor="middle" fill="#6b7280">-θ_max</text>
  <text x="850" y="226" font-size="12" text-anchor="middle" fill="#6b7280">+θ_max</text>

  <!-- Characteristic Curves -->
  <line x1="550" y1="250" x2="850" y2="150" stroke="#27ae60" stroke-width="2"/>
  <line x1="550" y1="150" x2="850" y2="250" stroke="#c0392b" stroke-width="2"/>
  <line x1="550" y1="260" x2="850" y2="140" stroke="#2457d6" stroke-width="3"/>

  <!-- Curve Labels -->
  <text x="858" y="145" font-size="12" font-weight="bold" fill="#27ae60">V_S1</text>
  <text x="858" y="255" font-size="12" font-weight="bold" fill="#c0392b">V_S2</text>
  <text x="710" y="152" font-size="12" font-weight="bold" fill="#2457d6">V_out = V_S1 - V_S2</text>

  <!-- Right Panel Bottom: Mathematical Principles -->
  <rect x="490" y="318" width="430" height="162" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="705" y="339" font-size="14" font-weight="bold" text-anchor="middle" fill="#27ae60">Математичний принцип лінеаризації</text>
  <text x="705" y="364" font-size="12" text-anchor="middle" fill="#1a1a1a">Магнітний опір зазору: R_m(θ) = δ(θ) / (μ₀ · A)</text>
  <text x="705" y="392" font-size="13" font-weight="bold" text-anchor="middle" fill="#2457d6">Диференційна напруга: V_out(θ) = K · θ · V_0 · sin(ωt)</text>
  <text x="705" y="420" font-size="12" text-anchor="middle" fill="#27ae60">• Профіль ротора забезпечує лінійність V_out ∝ θ (похибка &lt; 0.1%)</text>
  <text x="705" y="444" font-size="12" text-anchor="middle" fill="#1a1a1a">• У нейтралі (θ = 0): V_S1 = V_S2 ⇒ V_out = 0 (нульовий сигнал)</text>

  <!-- Bottom Legend Banner -->
  <rect x="40" y="495" width="880" height="35" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="4"/>
  <circle cx="65" cy="512" r="6" fill="#2457d6"/>
  <text x="80" y="516" font-size="12" text-anchor="start" fill="#1a1a1a">Первинна збуджувальна обмотка (P)</text>

  <circle cx="370" cy="512" r="6" fill="#27ae60"/>
  <text x="385" y="516" font-size="12" text-anchor="start" fill="#1a1a1a">Перша вторинна обмотка (S1)</text>

  <circle cx="660" cy="512" r="6" fill="#c0392b"/>
  <text x="675" y="516" font-size="12" text-anchor="start" fill="#1a1a1a">Друга вторинна обмотка (S2)</text>
</svg>
