<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Фазочутливий демодулятор RVDT із ратіометричним нормуванням</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Ділення різниці напруг на їхню суму (V₁ - V₂) / (V₁ + V₂) компенсує температурний дрейф та плавання збудження</text>

  <!-- STAGE 1: RVDT SENSOR -->
  <rect x="30" y="75" width="155" height="455" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="107" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">RVDT Давач</text>

  <!-- Primary Winding -->
  <rect x="42" y="125" width="131" height="36" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="107" y="147" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Первинна обмотка</text>

  <!-- Input Excitation Line & Label -->
  <line x1="20" y1="143" x2="42" y2="143" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="31" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">V_exc</text>

  <!-- Rotor Shaft Icon -->
  <circle cx="107" cy="240" r="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <ellipse cx="107" cy="240" rx="24" ry="12" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" transform="rotate(-30 107 240)"/>
  <circle cx="107" cy="240" r="5" fill="#2457d6"/>
  <text x="107" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Кут вала θ</text>

  <!-- Secondary Winding 1 -->
  <rect x="42" y="340" width="131" height="36" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="107" y="362" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Вторинна 1 [V₁]</text>

  <!-- Secondary Winding 2 -->
  <rect x="42" y="415" width="131" height="36" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="107" y="437" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Вторинна 2 [V₂]</text>

  <!-- STAGE 2: PHASE-SENSITIVE DEMODULATION -->
  <rect x="225" y="75" width="190" height="455" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="320" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Фазочутлива демодуляція</text>

  <!-- Detector 1 -->
  <rect x="240" y="130" width="160" height="60" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="320" y="153" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Фазовий детектор 1</text>
  <text x="320" y="173" text-anchor="middle" font-size="12" fill="#6b7280">+ ФНЧ ➔ v₁(θ)</text>

  <!-- Detector 2 -->
  <rect x="240" y="330" width="160" height="60" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="320" y="353" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Фазовий детектор 2</text>
  <text x="320" y="373" text-anchor="middle" font-size="12" fill="#6b7280">+ ФНЧ ➔ v₂(θ)</text>

  <!-- Reference Phase Bus (Clean Routing around detectors) -->
  <path d="M 20 143 L 20 260 L 320 260" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <line x1="320" y1="260" x2="320" y2="190" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arr-blue)"/>
  <line x1="320" y1="260" x2="320" y2="330" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arr-blue)"/>
  <text x="312" y="252" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">Опорна фаза V_exc</text>

  <!-- Signals V1 and V2 from Stage 1 to Stage 2 -->
  <path d="M 173 358 L 200 358 L 200 160 L 240 160" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="207" y="235" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">V₁(t)</text>

  <path d="M 173 433 L 212 433 L 212 360 L 240 360" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="216" y="415" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">V₂(t)</text>

  <!-- STAGE 3: DIFFERENCE & SUM COMPUTATION -->
  <rect x="455" y="75" width="190" height="455" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="550" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Формування сигналів</text>

  <!-- Difference Sub-block -->
  <rect x="470" y="130" width="160" height="60" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="550" y="153" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Різниця: v₁ - v₂</text>
  <text x="550" y="173" text-anchor="middle" font-size="12" fill="#6b7280">Пропорційна куту θ</text>

  <!-- Sum Sub-block -->
  <rect x="470" y="330" width="160" height="60" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="550" y="353" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Сума: v₁ + v₂</text>
  <text x="550" y="373" text-anchor="middle" font-size="12" fill="#6b7280">Пропорційна V_exc</text>

  <!-- Signals v1 and v2 from Stage 2 to Stage 3 -->
  <line x1="400" y1="160" x2="470" y2="160" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="435" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">v₁</text>
  <path d="M 430 160 L 430 345 L 470 345" stroke="#2457d6" stroke-width="1.5" fill="none" marker-end="url(#arr-blue)"/>

  <line x1="400" y1="360" x2="470" y2="360" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="435" y="375" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">v₂</text>
  <path d="M 442 360 L 442 175 L 470 175" stroke="#2457d6" stroke-width="1.5" fill="none" marker-end="url(#arr-blue)"/>

  <!-- STAGE 4: RATIOMETRIC DIVISION & OUTPUT -->
  <rect x="685" y="75" width="220" height="455" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="795" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Ратіометричне ділення</text>

  <!-- Division Formula Box -->
  <rect x="700" y="130" width="190" height="90" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="795" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">U_out = ΔV / ΣV</text>
  <text x="795" y="177" text-anchor="middle" font-size="12" fill="#6b7280">(v₁ - v₂) / (v₁ + v₂)</text>
  <text x="795" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">= K · θ</text>

  <!-- Output Arrow -->
  <line x1="890" y1="175" x2="930" y2="175" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <!-- Signals ΔV and ΣV from Stage 3 to Stage 4 -->
  <line x1="630" y1="160" x2="700" y2="160" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="660" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">ΔV</text>

  <path d="M 630 360 L 660 360 L 660 190 L 700 190" stroke="#2457d6" stroke-width="2" fill="none" marker-end="url(#arr-blue)"/>
  <text x="660" y="375" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">ΣV</text>

  <!-- Advantages Callout Box -->
  <rect x="700" y="240" width="190" height="270" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="795" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Переваги нормування:</text>

  <text x="712" y="295" font-size="12" fill="#1a1a1a">• Повна компенсація</text>
  <text x="724" y="315" font-size="12" fill="#6b7280">дрейфу V_exc та частоти</text>

  <text x="712" y="345" font-size="12" fill="#1a1a1a">• Незалежність від</text>
  <text x="724" y="365" font-size="12" fill="#6b7280">температури обмоток</text>

  <text x="712" y="395" font-size="12" fill="#1a1a1a">• Строго лінійний</text>
  <text x="724" y="415" font-size="12" fill="#6b7280">вихідний сигнал</text>

  <text x="712" y="450" font-size="12" font-weight="bold" fill="#27ae60">• Висока точність</text>
  <text x="724" y="470" font-size="12" font-weight="bold" fill="#27ae60">в аерокосмітиці</text>
</svg>
