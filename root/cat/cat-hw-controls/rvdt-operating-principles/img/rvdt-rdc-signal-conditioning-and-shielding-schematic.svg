<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Аналоговий фронтенд RVDT та інтерфейс RDC-перетворювача</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Диференціальне підключення обмоток, ФНЧ Саллена-Кея та екранування від завад</text>

  <!-- Panel 1: RVDT Sensor & Shielding -->
  <rect x="30" y="75" width="265" height="455" fill="#f4f6f8" stroke="#d0d7de" rx="8" ry="8"/>
  <text x="162" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. RVDT та екранована лінія</text>

  <!-- Primary Coil Block -->
  <rect x="145" y="125" width="135" height="45" fill="#eaf0fd" stroke="#2457d6" rx="4"/>
  <text x="135" y="152" font-size="12" fill="#1a1a1a" text-anchor="end">Збудження V_exc</text>
  <text x="212" y="152" font-size="12" fill="#2457d6" text-anchor="middle">Первинна обмотка</text>

  <!-- Rotor Block -->
  <rect x="145" y="185" width="135" height="40" fill="#ffffff" stroke="#6b7280" rx="20"/>
  <text x="212" y="210" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Ротор (кут θ)</text>

  <!-- Secondary Coils -->
  <rect x="145" y="240" width="135" height="45" fill="#eaf0fd" stroke="#2457d6" rx="4"/>
  <text x="212" y="267" font-size="12" fill="#2457d6" text-anchor="middle">Вторинна S1 (V_S1)</text>

  <rect x="145" y="300" width="135" height="45" fill="#eaf0fd" stroke="#2457d6" rx="4"/>
  <text x="212" y="327" font-size="12" fill="#2457d6" text-anchor="middle">Вторинна S2 (V_S2)</text>

  <!-- Shielding Container Box -->
  <rect x="45" y="365" width="235" height="150" fill="#ffffff" stroke="#6b7280" stroke-dasharray="4 4" rx="6"/>
  <text x="162" y="390" font-size="13" font-weight="bold" fill="#6b7280" text-anchor="middle">Захисний екран (Chassis GND)</text>
  <text x="162" y="415" font-size="12" fill="#6b7280" text-anchor="middle">Вита пара з мідним заземленням</text>
  <text x="162" y="440" font-size="12" fill="#6b7280" text-anchor="middle">Захист від високочастотних завад</text>

  <!-- Shield Ground Symbol -->
  <line x1="162" y1="455" x2="162" y2="480" stroke="#6b7280" stroke-width="2"/>
  <line x1="147" y1="480" x2="177" y2="480" stroke="#6b7280" stroke-width="2"/>
  <line x1="152" y1="485" x2="172" y2="485" stroke="#6b7280" stroke-width="2"/>
  <line x1="157" y1="490" x2="167" y2="490" stroke="#6b7280" stroke-width="2"/>
  <text x="162" y="506" font-size="11" fill="#6b7280" text-anchor="middle">З'єднання в одній точці</text>


  <!-- Panel 2: Signal Conditioning & Sallen-Key LPF -->
  <rect x="315" y="75" width="330" height="455" fill="#f4f6f8" stroke="#d0d7de" rx="8" ry="8"/>
  <text x="480" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Аналоговий фронтенд та ФНЧ</text>

  <!-- Differential Amp Box -->
  <rect x="335" y="125" width="290" height="100" fill="#ffffff" stroke="#d0d7de" rx="6"/>
  <text x="480" y="150" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Диференціальний підсилювач</text>
  <text x="480" y="175" font-size="12" fill="#6b7280" text-anchor="middle">Пригнічення синфазної завади (CMRR)</text>
  <text x="480" y="200" font-size="12" fill="#6b7280" text-anchor="middle">Нормалізація сигналів V_S1 та V_S2</text>

  <!-- Active Sallen-Key Filter Box -->
  <rect x="335" y="240" width="290" height="140" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="480" y="265" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">ФНЧ Саллена-Кея (2-й порядок)</text>
  <text x="480" y="292" font-size="12" fill="#6b7280" text-anchor="middle">Активна фільтрація вищих гармонік</text>
  <text x="480" y="318" font-size="12" fill="#1a1a1a" text-anchor="middle">Схема: R1, R2, C1, C2 + ОП-підсилювач</text>
  <text x="480" y="344" font-size="12" fill="#6b7280" text-anchor="middle">Частота зрізу fc > f_збудження</text>
  <text x="480" y="366" font-size="11" fill="#27ae60" text-anchor="middle">Низький рівень фазових спотворень</text>

  <!-- Phase Sync Box -->
  <rect x="335" y="395" width="290" height="120" fill="#ffffff" stroke="#d0d7de" rx="6"/>
  <text x="480" y="420" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Фазова компенсація V_ref</text>
  <text x="480" y="448" font-size="12" fill="#6b7280" text-anchor="middle">Синхронізація опорної частоти</text>
  <text x="480" y="475" font-size="12" fill="#6b7280" text-anchor="middle">Компенсація фазового зсуву кабелю</text>
  <text x="480" y="498" font-size="11" fill="#6b7280" text-anchor="middle">Формування чистого опорного синуса</text>


  <!-- Panel 3: RDC Converter & Output -->
  <rect x="665" y="75" width="265" height="455" fill="#f4f6f8" stroke="#d0d7de" rx="8" ry="8"/>
  <text x="797" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3. RDC-перетворювач (Цифра)</text>

  <!-- Main RDC Chip Box -->
  <rect x="680" y="125" width="235" height="230" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="797" y="150" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">RDC (Resolver-to-Digital)</text>

  <!-- RDC Internal Features -->
  <rect x="695" y="165" width="205" height="32" fill="#eaf0fd" rx="4"/>
  <text x="797" y="186" font-size="12" fill="#2457d6" text-anchor="middle">Синхронний демодулятор</text>

  <rect x="695" y="205" width="205" height="32" fill="#eaf0fd" rx="4"/>
  <text x="797" y="226" font-size="12" fill="#2457d6" text-anchor="middle">Раціометричне ділення V1/V2</text>

  <rect x="695" y="245" width="205" height="32" fill="#eaf0fd" rx="4"/>
  <text x="797" y="266" font-size="12" fill="#2457d6" text-anchor="middle">Декодування atan2 (LUT)</text>

  <rect x="695" y="285" width="205" height="32" fill="#eaf0fd" rx="4"/>
  <text x="797" y="306" font-size="12" fill="#2457d6" text-anchor="middle">Слідкуючий АЦП (Tracking ADC)</text>

  <text x="797" y="340" font-size="11" fill="#27ae60" text-anchor="middle">Діагностика: контроль обриву обмоток</text>

  <!-- Output Interface Box -->
  <rect x="680" y="370" width="235" height="145" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="797" y="395" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Цифровий вихід кута θ</text>
  <text x="797" y="423" font-size="12" fill="#1a1a1a" text-anchor="middle">Інтерфейс SPI / Паралельний</text>
  <text x="797" y="450" font-size="12" fill="#1a1a1a" text-anchor="middle">Роздільна здатність 12-16 біт</text>
  <text x="797" y="476" font-size="12" fill="#27ae60" text-anchor="middle">Повна незалежність від V_exc</text>
  <text x="797" y="498" font-size="11" fill="#6b7280" text-anchor="middle">Вхід у цифровий польотний контролер</text>


  <!-- Inter-Panel Signal Connection Lines -->
  <!-- S1 connection line -->
  <path d="M 280 262 L 335 160" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <!-- S2 connection line -->
  <path d="M 280 322 L 335 190" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Diff Amp to Sallen-Key -->
  <path d="M 480 225 L 480 240" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Sallen-Key to RDC -->
  <path d="M 625 310 L 680 220" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Phase Sync to RDC -->
  <path d="M 625 455 L 665 455 L 665 260 L 680 260" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-gray)"/>

  <!-- RDC Internal to Output -->
  <path d="M 797 355 L 797 370" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
</svg>
