<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Конструктивна схема та принцип роботи RVDT-датчика</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Перетворення кута повороту ротора у диференціальну різницю вторинних напруг</text>

  <!-- LEFT PANEL: Construction & Magnetic Coupling -->
  <rect x="30" y="75" width="435" height="385" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Left Header -->
  <rect x="45" y="90" width="405" height="34" rx="4" fill="#2457d6"/>
  <text x="247.5" y="112" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1. Конструкція RVDT з кулачковим ротором</text>

  <!-- Stator Outer Ring -->
  <circle cx="247.5" cy="235" r="105" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="247.5" cy="235" r="80" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Primary Coil (Top) -->
  <rect x="195" y="125" width="105" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="247.5" y="142" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Первинна W_p</text>

  <!-- Secondary Coil S1 (Bottom Left, safely outside stator circle) -->
  <rect x="65" y="305" width="100" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="115" y="322" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Вторинна S1</text>
  <line x1="165" y1="318" x2="185" y2="285" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Secondary Coil S2 (Bottom Right, safely outside stator circle) -->
  <rect x="330" y="305" width="100" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="380" y="322" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Вторинна S2</text>
  <line x1="330" y1="318" x2="310" y2="285" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Cam Rotor Core (Ferromagnetic asymmetric profile) -->
  <path d="M 247.5,175 C 290,185 300,245 247.5,265 C 195,255 200,195 247.5,175 Z" fill="#d0d7de" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Rotor Shaft Center -->
  <circle cx="247.5" cy="225" r="15" fill="#6b7280" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Shaft Labels -->
  <text x="247.5" y="220" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Кулачковий</text>
  <text x="247.5" y="233" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ротор</text>

  <!-- Rotation Arc & Angle θ Label -->
  <path d="M 232,198 A 20,20 0 0 1 263,198" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="247.5" y="190" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Кут θ</text>

  <!-- Flux Line Φ1 (Left Side Path) -->
  <path d="M 195,140 C 130,170 130,270 165,310" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-blue)"/>
  <!-- Flux Φ1 Label positioned safely at x=42 to avoid path intersection -->
  <text x="42" y="200" font-size="12" font-weight="bold" fill="#2457d6">
    <tspan x="42" dy="0">Потік Φ1</tspan>
    <tspan x="42" dy="14">(більший)</tspan>
  </text>

  <!-- Flux Line Φ2 (Right Side Path) -->
  <path d="M 300,140 C 365,170 365,270 330,310" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-blue)"/>
  <!-- Flux Φ2 Label positioned safely at x=370 to avoid path intersection -->
  <text x="370" y="200" font-size="12" font-weight="bold" fill="#6b7280">
    <tspan x="370" dy="0">Потік Φ2</tspan>
    <tspan x="370" dy="14">(менший)</tspan>
  </text>

  <!-- Left Bottom Summary -->
  <rect x="45" y="365" width="405" height="80" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="60" y="385" font-size="12" fill="#1a1a1a">• Обертання ротора змінює повітряні зазори</text>
  <text x="60" y="405" font-size="12" fill="#1a1a1a">• Зміна кута θ змінює магнітні потоки Φ1 та Φ2</text>
  <text x="60" y="425" font-size="12" font-weight="bold" fill="#2457d6">• Безконтактний рух = нескінченний ресурс</text>

  <!-- RIGHT PANEL: Differential Circuit & Characteristics -->
  <rect x="495" y="75" width="435" height="385" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Right Header -->
  <rect x="510" y="90" width="405" height="34" rx="4" fill="#27ae60"/>
  <text x="712.5" y="112" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2. Диференціальне увімкнення та вихідний сигнал</text>

  <!-- AC Source Generator -->
  <circle cx="525" cy="190" r="14" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M 518,190 Q 521.5,183 525,190 T 532,190" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <text x="525" y="142" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">V_pri</text>

  <!-- Wires to Primary Winding -->
  <line x1="525" y1="176" x2="525" y2="155" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="525" y1="155" x2="560" y2="155" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="560" y1="155" x2="560" y2="170" stroke="#2457d6" stroke-width="1.5"/>

  <line x1="525" y1="204" x2="525" y2="255" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="525" y1="255" x2="560" y2="255" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="560" y1="255" x2="560" y2="240" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Primary Coil Graphic -->
  <path d="M 560,170 C 540,170 540,184 560,184 C 540,184 540,198 560,198 C 540,198 540,212 560,212 C 540,212 540,226 560,226 C 540,226 540,240 560,240" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Core Lines (Dashed) -->
  <line x1="576" y1="150" x2="576" y2="260" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="5 3"/>
  <line x1="580" y1="150" x2="580" y2="260" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="580" y="142" font-size="12" fill="#6b7280" text-anchor="middle">Сердечник</text>

  <!-- Secondary Winding S1 -->
  <path d="M 595,155 C 615,155 615,167 595,167 C 615,167 615,179 595,179 C 615,179 615,190 595,190" fill="none" stroke="#27ae60" stroke-width="2"/>
  <text x="630" y="172" font-size="12" font-weight="bold" fill="#27ae60">Обмотка S1</text>

  <!-- Secondary Winding S2 -->
  <path d="M 595,205 C 615,205 615,217 595,217 C 615,217 615,229 595,229 C 615,229 615,240 595,240" fill="none" stroke="#27ae60" stroke-width="2"/>
  <text x="630" y="222" font-size="12" font-weight="bold" fill="#27ae60">Обмотка S2</text>

  <!-- Secondary Series-Opposing Wire -->
  <line x1="595" y1="190" x2="595" y2="205" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Output Wires to Formula Badge -->
  <line x1="595" y1="148" x2="740" y2="148" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="740" y1="148" x2="740" y2="190" stroke="#27ae60" stroke-width="1.5"/>

  <line x1="595" y1="250" x2="740" y2="250" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="740" y1="250" x2="740" y2="226" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Output Formula Badge -->
  <rect x="740" y="190" width="175" height="36" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="827.5" y="213" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">V_out = V_S1 - V_S2</text>

  <!-- Response Graph V_out vs θ -->
  <!-- X Axis -->
  <line x1="540" y1="315" x2="880" y2="315" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <text x="890" y="319" font-size="12" fill="#1a1a1a">Кут θ</text>

  <!-- Y Axis -->
  <line x1="710" y1="265" x2="710" y2="345" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="710" y="258" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">V_out</text>

  <!-- Output Curve Line (passing through origin at 710, 315) -->
  <line x1="580" y1="345" x2="840" y2="285" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Curve Labels (Safely positioned to avoid output line intersections) -->
  <text x="590" y="295" font-size="12" font-weight="bold" fill="#c0392b">Протифаза (180°)</text>
  <text x="710" y="348" font-size="12" fill="#6b7280" text-anchor="middle">θ = 0 (V_out = 0)</text>
  <text x="830" y="335" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">У фазі (0°)</text>

  <!-- Right Bottom Summary -->
  <rect x="510" y="365" width="405" height="80" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="525" y="385" font-size="12" fill="#1a1a1a">• θ = 0: V_S1 = V_S2  ⇒  V_out = 0 (баланс)</text>
  <text x="525" y="405" font-size="12" font-weight="bold" fill="#27ae60">• θ &gt; 0: V_S1 &gt; V_S2  ⇒  V_out у фазі з V_pri</text>
  <text x="525" y="425" font-size="12" font-weight="bold" fill="#c0392b">• θ &lt; 0: V_S1 &lt; V_S2  ⇒  V_out у протифазі (180°)</text>
</svg>
