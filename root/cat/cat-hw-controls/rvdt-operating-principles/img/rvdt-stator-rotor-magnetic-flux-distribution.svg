<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead Markers -->
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>

    <!-- Gradients for ferromagnetic core & rotor -->
    <linearGradient id="core-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e5e7eb"/>
      <stop offset="100%" stop-color="#9ca3af"/>
    </linearGradient>
    <linearGradient id="rotor-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d1d5db"/>
      <stop offset="100%" stop-color="#6b7280"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розподіл магнітного потоку RVDT при повертанні ротора</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Обертання ексцентрикового осердя змінює повітряні зазори δ₁ та δ₂, перерозподіляючи потік Φ між обмотками S₁ та S₂</text>

  <!-- ==================== PANEL A: NEUTRAL POSITION (θ = 0°) ==================== -->
  <rect x="25" y="70" width="445" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  
  <!-- Panel Header -->
  <rect x="40" y="85" width="415" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="247" y="106" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Стан 1: Нейтральне положення (θ = 0°)</text>

  <!-- RVDT Diagram Group Panel A (Center: X=247, Y=265) -->
  <g id="panel-a-diagram">
    <!-- Stator Ring Outer & Inner -->
    <path d="M 147,265 A 100,100 0 1,1 347,265 A 100,100 0 1,1 147,265 M 177,265 A 70,70 0 1,0 317,265 A 70,70 0 1,0 177,265" fill="url(#core-grad)" stroke="#4b5563" stroke-width="1.5" fill-rule="evenodd"/>

    <!-- Stator Poles (Top, Left, Right, Bottom) -->
    <rect x="232" y="165" width="30" height="30" fill="url(#core-grad)" stroke="#4b5563" stroke-width="1.5"/>
    <rect x="147" y="250" width="30" height="30" fill="url(#core-grad)" stroke="#4b5563" stroke-width="1.5"/>
    <rect x="317" y="250" width="30" height="30" fill="url(#core-grad)" stroke="#4b5563" stroke-width="1.5"/>
    <rect x="232" y="335" width="30" height="30" fill="url(#core-grad)" stroke="#4b5563" stroke-width="1.5"/>

    <!-- Primary Winding P_exc (Top) -->
    <rect x="222" y="170" width="10" height="20" rx="2" fill="#2457d6" stroke="#1d4ed8" stroke-width="1"/>
    <rect x="264" y="170" width="10" height="20" rx="2" fill="#2457d6" stroke="#1d4ed8" stroke-width="1"/>
    <text x="247" y="152" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Первинна P (V_exc)</text>

    <!-- Secondary Winding S1 (Left) -->
    <rect x="152" y="240" width="20" height="10" rx="2" fill="#27ae60" stroke="#15803d" stroke-width="1"/>
    <rect x="152" y="280" width="20" height="10" rx="2" fill="#27ae60" stroke="#15803d" stroke-width="1"/>
    <text x="115" y="260" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">Вторинна S₁</text>
    <text x="115" y="276" font-size="12" fill="#15803d" text-anchor="end">(V_S1)</text>

    <!-- Secondary Winding S2 (Right) -->
    <rect x="325" y="240" width="20" height="10" rx="2" fill="#c0392b" stroke="#991b1b" stroke-width="1"/>
    <rect x="325" y="280" width="20" height="10" rx="2" fill="#c0392b" stroke="#991b1b" stroke-width="1"/>
    <text x="378" y="260" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">Вторинна S₂</text>
    <text x="378" y="276" font-size="12" fill="#991b1b" text-anchor="start">(V_S2)</text>

    <!-- Symmetrical Eccentric Rotor in Neutral (Center: 247, 265) -->
    <path d="M 212,265 C 212,225 282,225 282,265 C 282,315 212,315 212,265 Z" fill="url(#rotor-grad)" stroke="#1f2937" stroke-width="2"/>
    <circle cx="247" cy="265" r="8" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <circle cx="247" cy="265" r="3" fill="#1f2937"/>
    <text x="247" y="310" font-size="12" font-weight="bold" fill="#374151" text-anchor="middle">Ротор (θ=0°)</text>

    <!-- Magnetic Flux Lines Neutral (Symmetric Blue Dashed Loops) -->
    <path d="M 235,195 C 190,195 177,220 177,250 C 177,280 200,285 235,265" fill="none" stroke="#2457d6" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
    <path d="M 259,195 C 304,195 317,220 317,250 C 317,280 294,285 259,265" fill="none" stroke="#2457d6" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>

    <!-- Air Gaps Indicators -->
    <line x1="177" y1="265" x2="212" y2="265" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="2,2"/>
    <text x="195" y="252" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">δ₁</text>

    <line x1="282" y1="265" x2="317" y2="265" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="2,2"/>
    <text x="300" y="252" font-size="12" font-weight="bold" fill="#1f2937" text-anchor="middle">δ₂</text>
  </g>

  <!-- Bottom Summary Box Panel A -->
  <rect x="40" y="395" width="415" height="90" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="418" font-size="12" font-weight="bold" fill="#1a1a1a">Симетрія магнітного кола:</text>
  <text x="55" y="438" font-size="12" fill="#4b5563">• Повітряні зазори:  δ₁ = δ₂ = 0.5 мм</text>
  <text x="55" y="456" font-size="12" fill="#4b5563">• Магнітні опори:    R_m1 = R_m2  ⇒  Потоки: Φ₁ = Φ₂</text>
  <text x="55" y="474" font-size="12" font-weight="bold" fill="#2457d6">• Вихідний сигнал:   V_S1 = V_S2  ⇒  V_out = V_S1 - V_S2 = 0 В</text>

  <!-- ==================== PANEL B: ROTATED POSITION (θ > 0°) ==================== -->
  <rect x="490" y="70" width="445" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  
  <!-- Panel Header -->
  <rect x="505" y="85" width="415" height="32" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712" y="106" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Стан 2: Кутове відхилення (θ > 0°)</text>

  <!-- RVDT Diagram Group Panel B (Center: X=712, Y=265) -->
  <g id="panel-b-diagram">
    <!-- Stator Ring Outer & Inner -->
    <path d="M 612,265 A 100,100 0 1,1 812,265 A 100,100 0 1,1 612,265 M 642,265 A 70,70 0 1,0 782,265 A 70,70 0 1,0 642,265" fill="url(#core-grad)" stroke="#4b5563" stroke-width="1.5" fill-rule="evenodd"/>

    <!-- Stator Poles (Top, Left, Right, Bottom) -->
    <rect x="697" y="165" width="30" height="30" fill="url(#core-grad)" stroke="#4b5563" stroke-width="1.5"/>
    <rect x="612" y="250" width="30" height="30" fill="url(#core-grad)" stroke="#4b5563" stroke-width="1.5"/>
    <rect x="782" y="250" width="30" height="30" fill="url(#core-grad)" stroke="#4b5563" stroke-width="1.5"/>
    <rect x="697" y="335" width="30" height="30" fill="url(#core-grad)" stroke="#4b5563" stroke-width="1.5"/>

    <!-- Primary Winding P_exc (Top) -->
    <rect x="687" y="170" width="10" height="20" rx="2" fill="#2457d6" stroke="#1d4ed8" stroke-width="1"/>
    <rect x="729" y="170" width="10" height="20" rx="2" fill="#2457d6" stroke="#1d4ed8" stroke-width="1"/>
    <text x="712" y="152" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Первинна P (V_exc)</text>

    <!-- Secondary Winding S1 (Left - Stronger Induction) -->
    <rect x="617" y="240" width="20" height="10" rx="2" fill="#27ae60" stroke="#15803d" stroke-width="1"/>
    <rect x="617" y="280" width="20" height="10" rx="2" fill="#27ae60" stroke="#15803d" stroke-width="1"/>
    <text x="580" y="260" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">Вторинна S₁</text>
    <text x="580" y="276" font-size="12" fill="#15803d" text-anchor="end">(V_S1 ↑)</text>

    <!-- Secondary Winding S2 (Right - Weaker Induction) -->
    <rect x="790" y="240" width="20" height="10" rx="2" fill="#c0392b" stroke="#991b1b" stroke-width="1"/>
    <rect x="790" y="280" width="20" height="10" rx="2" fill="#c0392b" stroke="#991b1b" stroke-width="1"/>
    <text x="843" y="260" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">Вторинна S₂</text>
    <text x="843" y="276" font-size="12" fill="#991b1b" text-anchor="start">(V_S2 ↓)</text>

    <!-- Rotated Eccentric Rotor (Turned Clockwise towards Left Pole: δ1 smaller, δ2 larger) -->
    <path d="M 667,260 C 672,218 740,230 745,270 C 740,320 662,302 667,260 Z" fill="url(#rotor-grad)" stroke="#1f2937" stroke-width="2"/>
    <circle cx="712" cy="265" r="8" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
    <circle cx="712" cy="265" r="3" fill="#1f2937"/>
    
    <!-- Rotation Arrow & Angle θ -->
    <path d="M 712,235 A 30,30 0 0,0 690,243" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
    <text x="702" y="222" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">+θ</text>
    <text x="712" y="310" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Ротор повернено</text>

    <!-- Magnetic Flux Lines Rotated (Heavy Loop Left Φ1, Thin Loop Right Φ2) -->
    <path d="M 700,195 C 650,195 637,215 637,250 C 637,285 660,285 695,265" fill="none" stroke="#27ae60" stroke-width="3.5" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
    <!-- Positioned OUTSIDE lines at x=605, y=200 -->
    <text x="605" y="200" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">Φ₁ ↑</text>

    <path d="M 724,195 C 769,195 782,225 782,250 C 782,275 759,280 729,265" fill="none" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
    <!-- Positioned OUTSIDE lines at x=818, y=200 -->
    <text x="818" y="200" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">Φ₂ ↓</text>

    <!-- Air Gaps Indicators Rotated -->
    <line x1="642" y1="265" x2="667" y2="265" stroke="#27ae60" stroke-width="2"/>
    <text x="654" y="252" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">δ₁↓</text>

    <line x1="745" y1="265" x2="782" y2="265" stroke="#c0392b" stroke-width="2"/>
    <text x="763" y="252" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">δ₂↑</text>
  </g>

  <!-- Bottom Summary Box Panel B -->
  <rect x="505" y="395" width="415" height="90" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="520" y="418" font-size="12" font-weight="bold" fill="#1a1a1a">Перерозподіл магнітного потоку:</text>
  <text x="520" y="438" font-size="12" fill="#4b5563">• Зменшення зазору:   δ₁ (0.3 мм) &lt; δ₂ (0.7 мм)</text>
  <text x="520" y="456" font-size="12" fill="#4b5563">• Зміна опору:        R_m1 &lt; R_m2  ⇒  Потоки: Φ₁ &gt; Φ₂</text>
  <text x="520" y="474" font-size="12" font-weight="bold" fill="#27ae60">• Диференціальний вихід: V_S1 &gt; V_S2  ⇒  V_out = V_S1 - V_S2 &gt; 0 В</text>
</svg>
