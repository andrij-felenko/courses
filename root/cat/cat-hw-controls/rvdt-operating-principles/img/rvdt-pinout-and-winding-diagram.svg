<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Електричні схеми підключення обмоток RVDT</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Порівняння 4-провідної конфігурації (із спільним центром) та 5-провідної конфігурації (із розділеними вторинними котушками)</text>

  <!-- PANEL 1: 4-WIRE CONFIGURATION -->
  <rect x="30" y="75" width="435" height="415" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="100" font-size="14" font-weight="bold" fill="#2457d6">1. 4-провідне підключення (Спільний вивід CT)</text>
  <text x="45" y="120" font-size="12" fill="#6b7280">2 виводи збудження + 2 виводи виходу + 1 спільний (CT)</text>

  <!-- Primary Winding (PRI) - Left -->
  <line x1="60" y1="160" x2="90" y2="160" stroke="#2457d6" stroke-width="2"/>
  <text x="55" y="164" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">EXC+</text>
  <path d="M 90,160 A 10 10 0 0 1 90,180 A 10 10 0 0 1 90,200 A 10 10 0 0 1 90,220 A 10 10 0 0 1 90,240 A 10 10 0 0 1 90,260" fill="none" stroke="#2457d6" stroke-width="2"/>
  <line x1="90" y1="260" x2="60" y2="260" stroke="#2457d6" stroke-width="2"/>
  <text x="55" y="264" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">EXC-</text>
  <text x="105" y="215" font-size="12" font-weight="bold" fill="#2457d6">PRI (Збудження)</text>

  <!-- Rotatable Magnetic Core (Center) -->
  <rect x="187" y="150" width="6" height="200" rx="3" fill="#6b7280"/>
  <text x="190" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Ротор (θ)</text>
  <!-- Rotation Angle Indicator -->
  <path d="M 175,240 A 15 15 0 0 1 205,240" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="190" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">±θ</text>

  <!-- Secondary Windings (SEC1 & SEC2 with CT) - Right -->
  <!-- SEC1 Coil -->
  <line x1="290" y1="160" x2="380" y2="160" stroke="#27ae60" stroke-width="2"/>
  <text x="385" y="164" font-size="12" font-weight="bold" fill="#27ae60">S1 (Out 1)</text>
  <path d="M 290,160 A 9 9 0 0 0 290,178 A 9 9 0 0 0 290,196 A 9 9 0 0 0 290,214 L 290,230" fill="none" stroke="#27ae60" stroke-width="2"/>
  <text x="305" y="195" font-size="12" font-weight="bold" fill="#27ae60">SEC1</text>

  <!-- Center Tap Connection -->
  <line x1="290" y1="230" x2="290" y2="270" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="290" cy="250" r="4" fill="#1a1a1a"/>
  <line x1="290" y1="250" x2="380" y2="250" stroke="#1a1a1a" stroke-width="2"/>
  <text x="385" y="254" font-size="12" font-weight="bold" fill="#1a1a1a">CT / COM</text>

  <!-- SEC2 Coil -->
  <path d="M 290,270 L 290,286 A 9 9 0 0 0 290,304 A 9 9 0 0 0 290,322 A 9 9 0 0 0 290,340" fill="none" stroke="#27ae60" stroke-width="2"/>
  <line x1="290" y1="340" x2="380" y2="340" stroke="#27ae60" stroke-width="2"/>
  <text x="385" y="344" font-size="12" font-weight="bold" fill="#27ae60">S2 (Out 2)</text>
  <text x="305" y="315" font-size="12" font-weight="bold" fill="#27ae60">SEC2</text>

  <!-- Panel 1 Summary Box -->
  <rect x="45" y="370" width="405" height="105" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="60" y="392" font-size="12" font-weight="bold" fill="#2457d6">Особливості 4-провідної схеми:</text>
  <text x="60" y="415" font-size="12" fill="#1a1a1a">• Вторинні обмотки з'єднані зустрічно в спільній точці CT</text>
  <text x="60" y="438" font-size="12" fill="#1a1a1a">• Вихідний сигнал: V_out = V_S1 - V_S2 (відносно точки CT)</text>
  <text x="60" y="461" font-size="12" fill="#27ae60">• Економія кабельних жил для компактних систем</text>


  <!-- PANEL 2: 5-WIRE CONFIGURATION -->
  <rect x="495" y="75" width="435" height="415" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="510" y="100" font-size="14" font-weight="bold" fill="#2457d6">2. 5-провідне підключення (Ізольовані обмотки)</text>
  <text x="510" y="120" font-size="12" fill="#6b7280">2 виводи збудження + 4 розділені виводи вторинних котушок</text>

  <!-- Primary Winding (PRI) - Left -->
  <line x1="525" y1="160" x2="555" y2="160" stroke="#2457d6" stroke-width="2"/>
  <text x="520" y="164" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">EXC+</text>
  <path d="M 555,160 A 10 10 0 0 1 555,180 A 10 10 0 0 1 555,200 A 10 10 0 0 1 555,220 A 10 10 0 0 1 555,240 A 10 10 0 0 1 555,260" fill="none" stroke="#2457d6" stroke-width="2"/>
  <line x1="555" y1="260" x2="525" y2="260" stroke="#2457d6" stroke-width="2"/>
  <text x="520" y="264" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">EXC-</text>
  <text x="570" y="215" font-size="12" font-weight="bold" fill="#2457d6">PRI (Збудження)</text>

  <!-- Rotatable Magnetic Core (Center) -->
  <rect x="652" y="150" width="6" height="200" rx="3" fill="#6b7280"/>
  <text x="655" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Ротор (θ)</text>
  <!-- Rotation Angle Indicator -->
  <path d="M 640,240 A 15 15 0 0 1 670,240" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="655" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">±θ</text>

  <!-- Secondary Windings (SEC1 & SEC2 Isolated) - Right -->
  <!-- SEC1 Coil (Isolated) -->
  <line x1="755" y1="160" x2="845" y2="160" stroke="#27ae60" stroke-width="2"/>
  <text x="850" y="164" font-size="12" font-weight="bold" fill="#27ae60">S1+</text>
  <path d="M 755,160 A 9 9 0 0 0 755,178 A 9 9 0 0 0 755,196 A 9 9 0 0 0 755,214 L 755,220" fill="none" stroke="#27ae60" stroke-width="2"/>
  <line x1="755" y1="220" x2="845" y2="220" stroke="#27ae60" stroke-width="2"/>
  <text x="850" y="224" font-size="12" font-weight="bold" fill="#27ae60">S1-</text>
  <text x="770" y="195" font-size="12" font-weight="bold" fill="#27ae60">SEC1</text>

  <!-- SEC2 Coil (Isolated) -->
  <line x1="755" y1="280" x2="845" y2="280" stroke="#27ae60" stroke-width="2"/>
  <text x="850" y="284" font-size="12" font-weight="bold" fill="#27ae60">S2+</text>
  <path d="M 755,280 L 755,296 A 9 9 0 0 0 755,314 A 9 9 0 0 0 755,332 A 9 9 0 0 0 755,340" fill="none" stroke="#27ae60" stroke-width="2"/>
  <line x1="755" y1="340" x2="845" y2="340" stroke="#27ae60" stroke-width="2"/>
  <text x="850" y="344" font-size="12" font-weight="bold" fill="#27ae60">S2-</text>
  <text x="770" y="315" font-size="12" font-weight="bold" fill="#27ae60">SEC2</text>

  <!-- Panel 2 Summary Box -->
  <rect x="510" y="370" width="405" height="105" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="525" y="392" font-size="12" font-weight="bold" fill="#2457d6">Особливості 5-провідної схеми:</text>
  <text x="525" y="415" font-size="12" fill="#1a1a1a">• Повна гальванічна й електрична розв'язка між SEC1 та SEC2</text>
  <text x="525" y="438" font-size="12" fill="#1a1a1a">• Окреме вимірювання сигналів V_S1 та V_S2 для RDC</text>
  <text x="525" y="461" font-size="12" fill="#27ae60">• Максимальна завадостійкість та гнучкість комутації AFE</text>
</svg>
