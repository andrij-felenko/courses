<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Блок-схема аналогового фронтенду (AFE) давача RVDT</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Формування збудження, фазочутлива демодуляція сигналів та ратіометричне обчислення кута θ</text>

  <!-- Stage 1: Excitation Generator -->
  <rect x="40" y="90" width="150" height="150" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="115" y="112" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Генератор збудження</text>

  <rect x="52" y="125" width="126" height="38" fill="white" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="115" y="148" font-size="12" fill="#1a1a1a" text-anchor="middle">DDS / Міст Віна</text>

  <rect x="52" y="175" width="126" height="52" fill="white" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="115" y="195" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Підсилювач потужності</text>
  <text x="115" y="214" font-size="12" fill="#6b7280" text-anchor="middle">V_exc (1...10 кГц)</text>

  <!-- Main Excitation Line to RVDT -->
  <line x1="190" y1="199" x2="240" y2="199" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="215" y="190" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">V_exc</text>

  <!-- Stage 2: RVDT Sensor Assembly -->
  <rect x="240" y="90" width="160" height="240" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="320" y="112" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Давач RVDT</text>

  <!-- Primary Winding -->
  <rect x="270" y="180" width="100" height="38" fill="white" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="320" y="203" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Первинна обмотка</text>

  <!-- Profiled Rotor -->
  <circle cx="320" cy="242" r="14" fill="#d0d7de" stroke="#6b7280" stroke-width="1.5"/>
  <text x="320" y="246" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Ротор θ</text>

  <!-- Secondary Winding 1 -->
  <rect x="250" y="275" width="65" height="42" fill="white" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="282" y="293" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Вторинна 1</text>
  <text x="282" y="309" font-size="12" fill="#27ae60" text-anchor="middle">V₁(t)</text>

  <!-- Secondary Winding 2 -->
  <rect x="325" y="275" width="65" height="42" fill="white" stroke="#c0392b" stroke-width="1.5" rx="4"/>
  <text x="357" y="293" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Вторинна 2</text>
  <text x="357" y="309" font-size="12" fill="#c0392b" text-anchor="middle">V₂(t)</text>

  <!-- Signal Lines V1 and V2 to Conditioning -->
  <path d="M 315,296 L 425,296 L 425,157 L 455,157" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="370" y="288" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">V₁(t)</text>

  <path d="M 390,296 L 435,296 L 435,257 L 455,257" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="415" y="288" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">V₂(t)</text>

  <!-- Reference Sync Path to PSDs -->
  <path d="M 115,242 L 115,405 L 617,405 L 617,280" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <line x1="617" y1="235" x2="617" y2="180" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="270" y="425" font-size="12" fill="#6b7280" text-anchor="middle">Опорна синхронізація Ref (Phase Sync)</text>
  <text x="630" y="350" font-size="12" fill="#6b7280">Ref Sync</text>

  <!-- Stage 3: Signal Conditioning & Demodulation -->
  <rect x="440" y="90" width="240" height="345" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="560" y="112" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Нормування та Демодуляція</text>

  <!-- Channel 1: InAmp 1 + PSD 1 -->
  <rect x="455" y="135" width="95" height="45" fill="white" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="502" y="155" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Підсилювач</text>
  <text x="502" y="171" font-size="12" fill="#27ae60" text-anchor="middle">InAmp 1</text>

  <line x1="550" y1="157" x2="570" y2="157" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <rect x="570" y="135" width="95" height="45" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="617" y="155" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Демодулятор</text>
  <text x="617" y="171" font-size="12" fill="#27ae60" text-anchor="middle">PSD 1 + ФНЧ</text>

  <!-- Channel 2: InAmp 2 + PSD 2 -->
  <rect x="455" y="235" width="95" height="45" fill="white" stroke="#c0392b" stroke-width="1.5" rx="4"/>
  <text x="502" y="255" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Підсилювач</text>
  <text x="502" y="271" font-size="12" fill="#c0392b" text-anchor="middle">InAmp 2</text>

  <line x1="550" y1="257" x2="570" y2="257" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <rect x="570" y="235" width="95" height="45" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="4"/>
  <text x="617" y="255" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Демодулятор</text>
  <text x="617" y="271" font-size="12" fill="#c0392b" text-anchor="middle">PSD 2 + ФНЧ</text>

  <!-- Lines from PSDs to ADC -->
  <line x1="665" y1="157" x2="740" y2="157" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="702" y="149" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">V_DC1</text>

  <line x1="665" y1="257" x2="740" y2="257" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="702" y="249" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">V_DC2</text>

  <!-- Stage 4: Digitization & Angle Computation -->
  <rect x="720" y="90" width="200" height="345" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="820" y="112" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Обчислення кута</text>

  <!-- Dual ADC Block -->
  <rect x="740" y="135" width="160" height="145" fill="white" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="820" y="155" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Двоканальний АЦП</text>

  <rect x="750" y="168" width="140" height="42" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="3"/>
  <text x="820" y="186" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Канал 1 (ADC₁)</text>
  <text x="820" y="202" font-size="12" fill="#1a1a1a" text-anchor="middle">N₁ ∝ V_DC1</text>

  <rect x="750" y="223" width="140" height="42" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="3"/>
  <text x="820" y="241" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Канал 2 (ADC₂)</text>
  <text x="820" y="257" font-size="12" fill="#1a1a1a" text-anchor="middle">N₂ ∝ V_DC2</text>

  <line x1="820" y1="280" x2="820" y2="300" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Microcontroller / DSP Block -->
  <rect x="740" y="300" width="160" height="115" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="820" y="322" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Мікроконтролер / DSP</text>
  <text x="820" y="347" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Ratio = (N₁ - N₂) / (N₁ + N₂)</text>
  <text x="820" y="372" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Кут θ = Ratio / K</text>

  <!-- Output Arrow & Digital Angle Label -->
  <line x1="820" y1="415" x2="820" y2="442" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="820" y="460" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Вихідний цифровий кут θ</text>
</svg>
