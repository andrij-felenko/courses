<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Main Header -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Синхронна демодуляція та розрахунок кута RVDT</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Опорний сигнал збудження V_exc, вторинні напруги V_S1/V_S2 та раціометричне обчислення позиції</text>

  <!-- PANEL 1: SIGNAL PROCESSING FLOW DIAGRAM -->
  <rect x="30" y="72" width="435" height="405" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="45" y="85" width="405" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="247.5" y="106" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Структура тракту обробки сигналів</text>

  <!-- Processing Blocks -->
  <!-- Block 1: Excitation Generator -->
  <rect x="60" y="135" width="130" height="42" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="125" y="152" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Генератор V_exc</text>
  <text x="125" y="167" font-size="10" fill="#6b7280" text-anchor="middle">V0 · sin(ωt)</text>
  <line x1="190" y1="156" x2="235" y2="156" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Block 2: RVDT Sensor -->
  <rect x="235" y="135" width="110" height="42" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="290" y="152" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Давач RVDT</text>
  <text x="290" y="167" font-size="10" fill="#6b7280" text-anchor="middle">Кут повороту θ</text>

  <!-- Output Lines S1 and S2 -->
  <line x1="345" y1="146" x2="395" y2="146" stroke="#27ae60" stroke-width="1.5"/>
  <text x="370" y="141" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">V_S1</text>

  <line x1="345" y1="166" x2="395" y2="166" stroke="#c0392b" stroke-width="1.5"/>
  <text x="370" y="180" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">V_S2</text>

  <!-- Block 3: Synchronous Demodulator & ADC -->
  <rect x="130" y="210" width="235" height="50" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="247.5" y="230" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Синхронний демодулятор / АЦП</text>
  <text x="247.5" y="248" font-size="11" fill="#2457d6" text-anchor="middle">Стробування у піках sin(ωt)</text>
  <line x1="247.5" y1="260" x2="247.5" y2="290" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Block 4: Ratiometric Position Calculation -->
  <rect x="75" y="290" width="345" height="50" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="247.5" y="310" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Раціометричний розрахунок відношення</text>
  <text x="247.5" y="328" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Ratio = (V_S1 - V_S2) / (V_S1 + V_S2)</text>
  <line x1="247.5" y1="340" x2="247.5" y2="365" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Block 5: LUT Linearity Correction & Output -->
  <rect x="100" y="365" width="295" height="42" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="247.5" y="383" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Таблична LUT-інтерполяція</text>
  <text x="247.5" y="398" font-size="10" fill="#1a1a1a" text-anchor="middle">Вихідне кутове значення: θ_out (град)</text>

  <!-- Panel 1 Note Text Box -->
  <rect x="45" y="420" width="405" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="58" y="445" font-size="11" font-weight="bold" fill="#27ae60">Корекція:</text>
  <text x="120" y="445" font-size="11" fill="#1a1a1a">Компенсація температурного дрейфу й нестабільності VCC</text>


  <!-- PANEL 2: TIMING DIAGRAMS OF SYNCHRONOUS DEMODULATION -->
  <rect x="495" y="72" width="435" height="405" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="510" y="85" width="405" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="712.5" y="106" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Часові діаграми сигналів</text>

  <!-- Graph 1: Excitation Voltage V_exc -->
  <rect x="560" y="132" width="345" height="65" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="550" y="165" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">V_exc</text>
  <!-- Sine wave path for V_exc -->
  <path d="M 560 165 Q 582.5 137, 605 165 T 650 165 T 695 165 T 740 165 T 785 165 T 830 165 T 875 165 L 905 165" fill="none" stroke="#2457d6" stroke-width="1.8"/>

  <!-- Sampling Strobe Marks at Peaks (t1, t2, t3, t4) -->
  <line x1="582.5" y1="132" x2="582.5" y2="415" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="672.5" y1="132" x2="672.5" y2="415" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="762.5" y1="132" x2="762.5" y2="415" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="852.5" y1="132" x2="852.5" y2="415" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Strobe Points (Circles) -->
  <circle cx="582.5" cy="137" r="3.5" fill="#2457d6"/>
  <circle cx="672.5" cy="137" r="3.5" fill="#2457d6"/>
  <circle cx="762.5" cy="137" r="3.5" fill="#2457d6"/>
  <circle cx="852.5" cy="137" r="3.5" fill="#2457d6"/>
  <text x="582.5" y="127" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="middle">t1</text>
  <text x="672.5" y="127" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="middle">t2</text>
  <text x="762.5" y="127" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="middle">t3</text>

  <!-- Graph 2: Secondary Voltage V_S1 -->
  <rect x="560" y="225" width="345" height="65" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="550" y="258" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">V_S1</text>
  <!-- Amplitude Modulated Sine S1 -->
  <path d="M 560 258 Q 582.5 235, 605 258 T 650 258 T 695 258 T 740 258 T 785 258 T 830 258 T 875 258 L 905 258" fill="none" stroke="#27ae60" stroke-width="1.8"/>
  <!-- Sample Strobe Dots on S1 -->
  <circle cx="582.5" cy="235" r="3.5" fill="#27ae60"/>
  <circle cx="672.5" cy="235" r="3.5" fill="#27ae60"/>
  <circle cx="762.5" cy="235" r="3.5" fill="#27ae60"/>

  <!-- Graph 3: Secondary Voltage V_S2 -->
  <rect x="560" y="318" width="345" height="65" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
  <text x="550" y="351" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">V_S2</text>
  <!-- Complementary Amplitude Sine S2 -->
  <path d="M 560 351 Q 582.5 338, 605 351 T 650 351 T 695 351 T 740 351 T 785 351 T 830 351 T 875 351 L 905 351" fill="none" stroke="#c0392b" stroke-width="1.8"/>
  <!-- Sample Strobe Dots on S2 -->
  <circle cx="582.5" cy="338" r="3.5" fill="#c0392b"/>
  <circle cx="672.5" cy="338" r="3.5" fill="#c0392b"/>

  <!-- Time Axis t -->
  <line x1="560" y1="415" x2="905" y2="415" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="912" y="419" font-size="11" fill="#6b7280" text-anchor="start">Час (t)</text>
  <text x="732.5" y="440" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Синхронний вибір відліків АЦП (Стробування у пиках)</text>


  <!-- BOTTOM SUMMARY BANNER -->
  <rect x="30" y="488" width="900" height="38" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="512" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Раціометричне відношення (V_S1 - V_S2) / (V_S1 + V_S2) компенсує температурний дрейф та нестабільність V_exc</text>
</svg>
