<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схемотехніка аналогового фронтенду давача RVDT</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Генерація синусоїдального збудження, диференціальне підсилення вторинних обмоток та RDC-перетворення</text>

  <!-- ==================== BLOCK 1: EXCITATION OSCILLATOR ==================== -->
  <rect x="24" y="68" width="195" height="250" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  
  <rect x="34" y="78" width="175" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="121.5" y="95" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Генератор збудження</text>

  <!-- Generator Box / Oscillator -->
  <rect x="45" y="120" width="153" height="75" fill="white" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="121.5" y="142" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Осцилятор V_EXC</text>
  <text x="121.5" y="156" font-size="10" fill="#6b7280" text-anchor="middle">5 V_rms @ 5 кГц</text>

  <!-- Sine Wave Graphic -->
  <path d="M 65 174 Q 75 162 85 174 T 105 174" fill="none" stroke="#2457d6" stroke-width="2"/>
  <text x="145" y="178" font-size="10" font-weight="bold" fill="#2457d6">sin(ωt)</text>

  <!-- Excitation Lines Out -->
  <line x1="198" y1="135" x2="255" y2="135" stroke="#2457d6" stroke-width="2"/>
  <line x1="198" y1="160" x2="255" y2="160" stroke="#2457d6" stroke-width="2"/>

  <!-- Reference Output Line to RDC with break for V_REF text -->
  <line x1="121.5" y1="195" x2="121.5" y2="252" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="121.5" y="265" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="middle">V_REF</text>
  <text x="121.5" y="278" font-size="10" fill="#6b7280" text-anchor="middle">(Опорна фаза)</text>
  <line x1="121.5" y1="284" x2="121.5" y2="295" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="121.5" y1="295" x2="755" y2="295" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>


  <!-- ==================== BLOCK 2: RVDT SENSOR & SHIELD ==================== -->
  <rect x="235" y="68" width="225" height="250" fill="white" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="5 3" rx="6"/>
  
  <rect x="245" y="78" width="205" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="347.5" y="95" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Давач RVDT (Екран кабелю)</text>

  <!-- Primary Winding P -->
  <g>
    <path d="M 255 135 C 265 125 265 145 255 145 C 265 135 265 155 255 155 C 265 145 265 165 255 160" fill="none" stroke="#2457d6" stroke-width="2"/>
    <text x="245" y="120" font-size="11" font-weight="bold" fill="#2457d6">Обмотка P</text>
  </g>

  <!-- Movable Ferromagnetic Core (Rotor) -->
  <rect x="285" y="135" width="28" height="65" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5" rx="3"/>
  <text x="299" y="160" font-size="10" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Ядро</text>
  <text x="299" y="174" font-size="10" fill="#1a1a1a" text-anchor="middle">RVDT</text>
  
  <!-- Angle Arrow θ -->
  <path d="M 299 126 C 309 126 314 130 314 134" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="299" y="122" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">Кут θ</text>

  <!-- Secondary Windings S1 & S2 -->
  <!-- Upper Winding S1 -->
  <g>
    <path d="M 345 125 C 355 115 355 135 345 135 C 355 125 355 145 345 145" fill="none" stroke="#27ae60" stroke-width="2"/>
    <text x="355" y="120" font-size="11" font-weight="bold" fill="#27ae60">S1</text>
    <line x1="345" y1="125" x2="480" y2="125" stroke="#27ae60" stroke-width="2"/>
  </g>

  <!-- Lower Winding S2 -->
  <g>
    <path d="M 345 185 C 355 175 355 195 345 195 C 355 185 355 205 345 205" fill="none" stroke="#27ae60" stroke-width="2"/>
    <text x="355" y="218" font-size="11" font-weight="bold" fill="#27ae60">S2</text>
    <line x1="345" y1="205" x2="480" y2="205" stroke="#27ae60" stroke-width="2"/>
  </g>

  <!-- Common Center Tap Line -->
  <line x1="345" y1="145" x2="345" y2="185" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="345" y1="165" x2="480" y2="165" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="355" y="160" font-size="10" fill="#6b7280">COM (Спільний)</text>

  <!-- Cable Shield Single-Point Grounding Connection -->
  <line x1="347.5" y1="318" x2="347.5" y2="330" stroke="#2457d6" stroke-width="1.5"/>
  <!-- Ground symbol -->
  <line x1="340" y1="330" x2="355" y2="330" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="343" y1="333" x2="352" y2="333" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="346" y1="336" x2="349" y2="336" stroke="#2457d6" stroke-width="1.5"/>
  <text x="362" y="334" font-size="10" font-weight="bold" fill="#2457d6">Екран PE</text>


  <!-- ==================== BLOCK 3: ANALOG FRONTEND & DIFF AMPLIFIER ==================== -->
  <rect x="475" y="68" width="225" height="250" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  
  <rect x="485" y="78" width="205" height="26" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="587.5" y="95" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Аналоговий фронтенд (AFE)</text>

  <!-- Bias / Pull-up Resistors R_B to V_BIAS -->
  <!-- Resistor R_B1 on S1 line -->
  <rect x="505" y="135" width="14" height="26" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="512" y1="125" x2="512" y2="135" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="512" y1="161" x2="512" y2="165" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="502" y="152" font-size="10" font-weight="bold" fill="#1a1a1a" text-anchor="end">R_B1</text>

  <!-- Resistor R_B2 on S2 line -->
  <rect x="505" y="170" width="14" height="26" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="512" y1="165" x2="512" y2="170" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="512" y1="196" x2="512" y2="205" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="502" y="187" font-size="10" font-weight="bold" fill="#1a1a1a" text-anchor="end">R_B2</text>

  <!-- V_BIAS Reference Line -->
  <line x1="512" y1="165" x2="535" y2="165" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="512" cy="165" r="3" fill="#1a1a1a"/>
  <text x="540" y="169" font-size="10" font-weight="bold" fill="#27ae60">V_BIAS</text>

  <!-- Bandpass Coupling Capacitors C_C -->
  <!-- Capacitor C_C1 on S1 line -->
  <line x1="550" y1="120" x2="550" y2="130" stroke="#27ae60" stroke-width="2"/>
  <line x1="550" y1="125" x2="565" y2="125" stroke="#27ae60" stroke-width="2"/>
  <text x="557.5" y="118" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">C_C1</text>

  <!-- Capacitor C_C2 on S2 line -->
  <line x1="550" y1="200" x2="550" y2="210" stroke="#27ae60" stroke-width="2"/>
  <line x1="550" y1="205" x2="565" y2="205" stroke="#27ae60" stroke-width="2"/>
  <text x="557.5" y="222" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">C_C2</text>

  <!-- Instrumentation Op-Amp (InAmp) Triangle -->
  <polygon points="590,110 590,220 655,165" fill="white" stroke="#27ae60" stroke-width="2"/>
  <text x="600" y="135" font-size="12" font-weight="bold" fill="#27ae60">+</text>
  <text x="600" y="200" font-size="12" font-weight="bold" fill="#27ae60">-</text>

  <text x="615" y="156" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">InAmp</text>
  <text x="615" y="170" font-size="10" fill="#6b7280" text-anchor="middle">CMRR &gt; 100dB</text>

  <!-- Op-Amp Lines In -->
  <line x1="565" y1="125" x2="590" y2="125" stroke="#27ae60" stroke-width="2"/>
  <line x1="565" y1="205" x2="590" y2="205" stroke="#27ae60" stroke-width="2"/>

  <!-- Op-Amp Out -->
  <line x1="655" y1="165" x2="715" y2="165" stroke="#27ae60" stroke-width="2"/>
  <text x="680" y="155" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">V_DIFF</text>


  <!-- ==================== BLOCK 4: RDC / DEMODULATOR ==================== -->
  <rect x="715" y="68" width="220" height="250" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  
  <rect x="725" y="78" width="200" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="825" y="95" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">RDC / Демодулятор</text>

  <!-- Synchronous Demodulator Block -->
  <rect x="735" y="120" width="180" height="175" fill="white" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  
  <text x="825" y="140" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Перетворювач RDC</text>
  <text x="825" y="154" font-size="10" fill="#6b7280" text-anchor="middle">(AD2S1210 / PGA411)</text>

  <!-- Demodulator Multiplier Circle -->
  <circle cx="755" cy="195" r="14" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="755" y="199" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">×</text>
  <text x="765" y="222" font-size="10" fill="#1a1a1a">Фазовий демод.</text>

  <!-- Active LPF Box -->
  <rect x="800" y="180" width="95" height="30" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="3"/>
  <text x="847.5" y="199" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">ФНЧ (LPF)</text>

  <!-- Signal path inside RDC -->
  <line x1="769" y1="195" x2="800" y2="195" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- Reference Line into Multiplier -->
  <line x1="755" y1="295" x2="755" y2="209" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Digital Position Output Line -->
  <line x1="895" y1="195" x2="925" y2="195" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="825" y="248" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Цифровий код θ</text>
  <text x="825" y="262" font-size="10" fill="#6b7280" text-anchor="middle">(SPI / 16 біт)</text>


  <!-- ==================== EXPLANATORY CARD AT BOTTOM ==================== -->
  <rect x="24" y="335" width="911" height="182" fill="white" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="40" y="356" font-size="12" font-weight="bold" fill="#1a1a1a">Ключові принципи схемотехніки аналогового фронтенду RVDT:</text>
  
  <text x="40" y="378" font-size="11" fill="#1a1a1a">• <tspan font-weight="bold" fill="#2457d6">Збудження первинної обмотки (V_EXC):</tspan> високостабільне синусоїдальне джерело (3–10 кГц) створює змінальний</text>
  <text x="50" y="393" font-size="11" fill="#1a1a1a">магнітний потік, наводячи протифазні ЕРС у вторинних обмотках S1 та S2 залежно від кута ротора θ.</text>

  <text x="40" y="415" font-size="11" fill="#1a1a1a">• <tspan font-weight="bold" fill="#27ae60">Захист від плаваючого потенціалу та синфазні завади (AFE):</tspan> резистори R_B фіксують постійне зміщення V_BIAS,</text>
  <text x="50" y="430" font-size="11" fill="#1a1a1a">а високопрецизійний підсилювач InAmp (CMRR &gt; 100 дБ) повністю пригнічує синфазні мережеві наводки.</text>

  <text x="40" y="452" font-size="11" fill="#1a1a1a">• <tspan font-weight="bold" fill="#2457d6">Синхронна демодуляція та RDC-перетворення:</tspan> множення сигналу V_DIFF на опорну фазу V_REF усуває</text>
  <text x="50" y="467" font-size="11" fill="#1a1a1a">квадратурні завади, а ФНЧ виділяє постійну складову, пропорційну абсолютному куту повороту θ.</text>

  <text x="40" y="489" font-size="11" fill="#1a1a1a">• <tspan font-weight="bold" fill="#1a1a1a">Одноточкове заземлення екрана (Single-Point Ground):</tspan> заземлення екрану кабелю виключно на боку плати AFE</text>
  <text x="50" y="504" font-size="11" fill="#1a1a1a">унеможливлює виникнення паразитних земляних контурів під час роботи у промисловому середовищі.</text>

</svg>
