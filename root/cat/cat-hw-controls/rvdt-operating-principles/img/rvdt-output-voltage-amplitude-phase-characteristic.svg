<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="28" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Вихідна амплітудно-фазова характеристика RVDT</text>
  <text x="480" y="48" font-size="13" text-anchor="middle" fill="#6b7280">Залежність диференціальної напруги та фази від кута повороту вала</text>

  <!-- Left Graph Container Panel -->
  <rect x="30" y="65" width="585" height="425" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="8"/>

  <!-- Graph Legend (Top Left / Top Right inside Panel) -->
  <line x1="50" y1="88" x2="75" y2="88" stroke="#2457d6" stroke-width="2.5"/>
  <text x="82" y="92" font-size="12" font-weight="bold" fill="#1a1a1a">V_demod (демодульована напруга)</text>

  <line x1="360" y1="88" x2="385" y2="88" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="392" y="92" font-size="12" font-weight="bold" fill="#1a1a1a">|V1 - V2| (амплітуда ЗС)</text>

  <!-- Linear Region Green Background Highlight -->
  <rect x="185" y="105" width="270" height="305" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" stroke-dasharray="4 4" rx="4"/>
  <text x="320" y="123" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Лінійний діапазон (±40°)</text>

  <!-- Nested V_null Callout Box (Fully contained within Linear Region Highlight) -->
  <rect x="332" y="296" width="114" height="44" fill="#ffffff" stroke="#c0392b" stroke-width="1.5" rx="4"/>
  <text x="389" y="313" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">V_null (у нулі)</text>
  <text x="389" y="330" font-size="12" fill="#6b7280" text-anchor="middle">залишок напруги</text>
  <line x1="332" y1="308" x2="324" y2="262" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Grid Axes -->
  <!-- Horizontal Axis (Angle theta) -->
  <line x1="75" y1="260" x2="565" y2="260" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="575" y="264" font-size="12" font-weight="bold" fill="#1a1a1a">θ</text>

  <!-- Vertical Axis (Voltage V_out) -->
  <line x1="320" y1="410" x2="320" y2="105" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="320" y="93" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">V_out</text>

  <!-- Angle Axis Ticks & Labels -->
  <!-- -60 deg -->
  <line x1="115" y1="255" x2="115" y2="265" stroke="#6b7280" stroke-width="1.5"/>
  <text x="115" y="280" font-size="12" fill="#6b7280" text-anchor="middle">-60°</text>

  <!-- -40 deg -->
  <line x1="185" y1="255" x2="185" y2="265" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="185" y="280" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">-40°</text>

  <!-- 0 deg -->
  <text x="308" y="280" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">0°</text>

  <!-- +40 deg -->
  <line x1="455" y1="255" x2="455" y2="265" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="455" y="280" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">+40°</text>

  <!-- +60 deg -->
  <line x1="525" y1="255" x2="525" y2="265" stroke="#6b7280" stroke-width="1.5"/>
  <text x="525" y="280" font-size="12" fill="#6b7280" text-anchor="middle">+60°</text>

  <!-- Curve 1: AC RMS Amplitude |V1 - V2| (Dashed Red Line) -->
  <path d="M 115 150 C 145 160, 168 172, 185 175 L 320 256 L 455 175 C 472 172, 495 160, 525 150" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Curve 2: Demodulated Output Voltage V_demod (Solid Blue Line) -->
  <path d="M 115 370 C 145 360, 168 348, 185 345 L 455 175 C 472 172, 495 160, 525 150" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Null Voltage Point Highlight -->
  <circle cx="320" cy="256" r="4" fill="#c0392b"/>

  <!-- Phase Angle Regions Indicator (Bottom Bar) -->
  <line x1="115" y1="440" x2="300" y2="440" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="207" y="458" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Фаза φ = 180° (протифаза)</text>

  <line x1="340" y1="440" x2="525" y2="440" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="432" y="458" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Фаза φ = 0° (у фазі)</text>

  <!-- Right Side Panel Cards -->
  <rect x="635" y="65" width="295" height="425" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="782" y="92" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Ключові параметри RVDT</text>

  <!-- Card 1: Linear Range -->
  <rect x="650" y="105" width="265" height="75" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="6"/>
  <text x="662" y="125" font-size="12" font-weight="bold" fill="#27ae60">1. Робоча зона (±40°…±60°)</text>
  <text x="662" y="145" font-size="12" fill="#1a1a1a">Висока лінійність (похибка &lt; 0.5%)</text>
  <text x="662" y="165" font-size="12" fill="#6b7280">Поза межами — насичення ротора</text>

  <!-- Card 2: Null Voltage -->
  <rect x="650" y="192" width="265" height="75" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="6"/>
  <text x="662" y="212" font-size="12" font-weight="bold" fill="#c0392b">2. Залишок у нулі (V_null)</text>
  <text x="662" y="232" font-size="12" fill="#1a1a1a">Викликаний ємнісним зв'язком</text>
  <text x="662" y="252" font-size="12" fill="#6b7280">та вихровими струмами ротора</text>

  <!-- Card 3: Ratio Normalization -->
  <rect x="650" y="279" width="265" height="196" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="662" y="301" font-size="12" font-weight="bold" fill="#2457d6">3. Ратіометричне нормування</text>

  <rect x="662" y="312" width="241" height="40" fill="#eaf0fd" rx="4"/>
  <text x="782" y="337" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">V_out = (V1 - V2) / (V1 + V2)</text>

  <text x="662" y="372" font-size="12" fill="#1a1a1a">Компенсує температурний дрейф</text>
  <text x="662" y="392" font-size="12" fill="#1a1a1a">та амплітудні коливання збудження</text>
  <text x="662" y="412" font-size="12" fill="#1a1a1a">Забезпечує високу точність</text>
  <text x="662" y="442" font-size="12" font-weight="bold" fill="#27ae60">Стандарт в авіації та космонавтиці</text>
</svg>
