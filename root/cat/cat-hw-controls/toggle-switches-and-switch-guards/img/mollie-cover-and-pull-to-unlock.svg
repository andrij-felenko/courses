<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Механізми захисту від випадкового спрацьовування тумблерів</text>
  <text x="480" y="52" font-size="13" text-anchor="middle" fill="#6b7280">Примусове повернення ковпачком Mollie та подвійний рух з витягуванням важеля Pull-to-Unlock</text>

  <!-- ==================== PANEL A: MOLLIE GUARD ==================== -->
  <rect x="30" y="75" width="435" height="435" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247" y="100" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Захисний ковпачок Mollie Guard</text>
  <text x="247" y="118" font-size="12" text-anchor="middle" fill="#6b7280">Примусове вимкнення важеля при закриванні кришки</text>

  <!-- Callout box top left (positioned clear of cover arc) -->
  <rect x="45" y="140" width="130" height="44" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="110" y="157" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">Відкидна кришка</text>
  <text x="110" y="173" font-size="11" text-anchor="middle" fill="#6b7280">з поворотною пружиною</text>

  <!-- Initial ON lever label badge (positioned high and clear of paths) -->
  <rect x="315" y="132" width="135" height="22" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="382" y="147" font-size="11" font-weight="bold" text-anchor="middle" fill="#c0392b">Початковий стан ON</text>

  <!-- Panel mount line -->
  <line x1="55" y1="360" x2="440" y2="360" stroke="#9ca3af" stroke-width="4"/>
  <text x="80" y="348" font-size="11" text-anchor="start" fill="#6b7280">Монтажна панель</text>

  <!-- Switch Bushing & Body (drawn using paths for details to prevent rect-on-rect overlap) -->
  <path d="M 225,315 h 44 v 45 h -44 Z" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  <!-- Bushing thread texture -->
  <line x1="225" y1="325" x2="269" y2="325" stroke="#9ca3af" stroke-width="1"/>
  <line x1="225" y1="335" x2="269" y2="335" stroke="#9ca3af" stroke-width="1"/>
  <path d="M 215,345 h 64 v 15 h -64 Z" fill="#d1d5db" stroke="#374151" stroke-width="1.5"/>
  <rect x="210" y="365" width="74" height="60" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Switch Internal Contacts -->
  <circle cx="247" cy="392" r="5" fill="#374151"/>
  <path d="M 247,392 L 230,412" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="230" cy="412" r="3" fill="#27ae60"/>
  <circle cx="264" cy="412" r="3" fill="#c0392b"/>

  <!-- Mollie Hinge & Bracket -->
  <path d="M 150,348 h 45 v 12 h -45 Z" fill="#9ca3af" stroke="#374151" stroke-width="1.5"/>
  <circle cx="165" cy="350" r="7" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Initial ON Lever (tilted right, dashed) -->
  <line x1="247" y1="320" x2="330" y2="210" stroke="#c0392b" stroke-width="3" stroke-dasharray="4 3"/>
  <circle cx="330" cy="210" r="8" fill="#c0392b"/>

  <!-- Forced OFF Lever (tilted left, solid) -->
  <line x1="247" y1="320" x2="195" y2="225" stroke="#27ae60" stroke-width="4"/>
  <circle cx="195" cy="225" r="9" fill="#27ae60"/>

  <!-- Mollie Cover shape (Closing arc down onto lever) -->
  <path d="M 165,350 Q 195,180 335,160 Q 370,180 375,230 Q 340,300 240,350 Z" fill="#eaf0fd" fill-opacity="0.7" stroke="#2457d6" stroke-width="2.5"/>
  <!-- Inner push ramp highlight -->
  <path d="M 235,185 Q 295,190 325,225" fill="none" stroke="#2457d6" stroke-width="3.5" stroke-dasharray="6 3"/>

  <!-- Motion Arrow (Closing cover pushing lever) -->
  <path d="M 345,185 Q 315,225 240,230" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Push & Reset Badges -->
  <rect x="325" y="261" width="125" height="20" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="387" y="275" font-size="11" font-weight="bold" text-anchor="middle" fill="#2457d6">Примусове штовхання</text>

  <rect x="45" y="261" width="95" height="20" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="92" y="275" font-size="11" font-weight="bold" text-anchor="middle" fill="#27ae60">Скидання в OFF</text>

  <!-- Result Box A -->
  <rect x="130" y="440" width="234" height="52" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="247" y="460" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Гарантоване вимкнення:</text>
  <text x="247" y="478" font-size="11" text-anchor="middle" fill="#1a1a1a">кришка примусово повертає важіль</text>

  <!-- ==================== PANEL B: PULL-TO-UNLOCK ==================== -->
  <rect x="495" y="75" width="435" height="435" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="712" y="100" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Важіль з блокуванням Pull-to-Unlock</text>
  <text x="712" y="118" font-size="12" text-anchor="middle" fill="#6b7280">Осьове витягування важеля для виходу з фіксуючого паза</text>

  <!-- SUB-PANEL B1: LOCKED -->
  <rect x="515" y="135" width="190" height="365" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="610" y="155" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">1. Заблоковано (Locked)</text>

  <!-- Lever shaft B1 -->
  <path d="M 602,205 h 16 v 105 h -16 Z" fill="#d1d5db" stroke="#374151" stroke-width="1.5"/>
  <circle cx="610" cy="195" r="10" fill="#6b7280"/>
  <!-- Internal Spring B1 -->
  <path d="M 605,215 L 615,223 L 605,231 L 615,239 L 605,247 L 615,255 L 605,263" fill="none" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Spring Label B1 (split & shifted left to avoid shaft intersection) -->
  <text x="595" y="195" font-size="11" text-anchor="end" fill="#6b7280">Внутрішня</text>
  <text x="595" y="209" font-size="11" text-anchor="end" fill="#6b7280">пружина</text>

  <!-- Locking collar & pin seated deep in slot B1 -->
  <path d="M 594,305 h 32 v 14 h -32 Z" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Locking Pin Label B1 (split & shifted left to avoid shaft intersection) -->
  <text x="595" y="278" font-size="11" font-weight="bold" text-anchor="end" fill="#c0392b">Пін у пазі</text>
  <text x="595" y="292" font-size="11" font-weight="bold" text-anchor="end" fill="#c0392b">втулки</text>

  <!-- Bushing with slots B1 -->
  <path d="M 585,315 h 50 v 45 h -50 Z" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  <!-- Cutout slot B1 -->
  <path d="M 593,315 h 34 v 14 h -34 Z" fill="#ffffff" stroke="#374151" stroke-width="1"/>

  <!-- Panel B1 Line -->
  <line x1="530" y1="360" x2="690" y2="360" stroke="#9ca3af" stroke-width="3"/>
  <text x="610" y="375" font-size="11" text-anchor="middle" fill="#6b7280">Панель</text>

  <!-- Switch body B1 -->
  <path d="M 580,360 h 60 v 50 h -60 Z" fill="#f4f6f8" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- Bottom Box B1 -->
  <rect x="525" y="440" width="170" height="50" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="610" y="460" font-size="11" font-weight="bold" text-anchor="middle" fill="#c0392b">Поворот заблоковано:</text>
  <text x="610" y="476" font-size="11" text-anchor="middle" fill="#1a1a1a">витягніть важіль вгору</text>

  <!-- SUB-PANEL B2: PULLED & UNLOCKED -->
  <rect x="720" y="135" width="195" height="365" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="817" y="155" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">2. Розблоковано (Pulled)</text>

  <text x="817" y="168" font-size="11" font-weight="bold" text-anchor="middle" fill="#27ae60">Вільний поворот</text>
  <!-- Rotation arrow B2 -->
  <path d="M 780,185 Q 817,195 850,185" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Pull arrow UP B2 -->
  <line x1="855" y1="245" x2="855" y2="200" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="862" y="218" font-size="11" font-weight="bold" text-anchor="start" fill="#2457d6">F_pull</text>
  <text x="862" y="232" font-size="11" text-anchor="start" fill="#6b7280">витягування</text>

  <!-- Lever shaft B2 (Lifted & Tilted) -->
  <line x1="817" y1="315" x2="835" y2="195" stroke="#374151" stroke-width="14" stroke-linecap="round"/>
  <circle cx="835" cy="195" r="10" fill="#27ae60"/>

  <!-- Compressed Spring B2 -->
  <path d="M 823,225 L 831,229 L 823,233 L 831,237 L 823,241 L 831,245" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Pin lifted ABOVE notch B2 -->
  <path d="M 798,295 h 38 v 14 h -38 Z" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Pin Raised Label B2 (split & shifted left to avoid shaft intersection) -->
  <text x="790" y="278" font-size="11" font-weight="bold" text-anchor="end" fill="#27ae60">Пін піднято</text>
  <text x="790" y="292" font-size="11" font-weight="bold" text-anchor="end" fill="#27ae60">з паза</text>

  <!-- Bushing with slots B2 -->
  <path d="M 792,315 h 50 v 45 h -50 Z" fill="#e5e7eb" stroke="#374151" stroke-width="2"/>
  <!-- Cutout slot B2 -->
  <path d="M 800,315 h 34 v 14 h -34 Z" fill="#ffffff" stroke="#374151" stroke-width="1"/>

  <!-- Panel B2 Line -->
  <line x1="735" y1="360" x2="900" y2="360" stroke="#9ca3af" stroke-width="3"/>
  <text x="817" y="375" font-size="11" text-anchor="middle" fill="#6b7280">Панель</text>

  <!-- Switch body B2 -->
  <path d="M 787,360 h 60 v 50 h -60 Z" fill="#f4f6f8" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- Bottom Box B2 -->
  <rect x="732" y="440" width="170" height="50" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="817" y="460" font-size="11" font-weight="bold" text-anchor="middle" fill="#27ae60">Поворот дозволено:</text>
  <text x="817" y="476" font-size="11" text-anchor="middle" fill="#1a1a1a">перемикання позиції</text>
</svg>
