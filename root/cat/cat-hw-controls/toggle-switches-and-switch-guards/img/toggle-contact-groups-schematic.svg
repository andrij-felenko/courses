<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема контактних груп та алгоритми комутації тумблерів</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Конфігурації SPST, SPDT, DPST, DPDT та стани 3-позиційних перемикачів: ON, OFF, (ON)</text>

  <!-- TOP SECTION: 4 Contact Group Cards -->

  <!-- Card 1: SPST -->
  <rect x="30" y="85" width="210" height="205" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="135" y="110" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">SPST</text>
  <text x="135" y="126" font-size="11" fill="#6b7280" text-anchor="middle">Single Pole Single Throw</text>

  <!-- SPST Diagram -->
  <circle cx="85" cy="165" r="5" fill="#1a1a1a"/>
  <circle cx="185" cy="165" r="5" fill="#1a1a1a"/>
  <line x1="50" y1="165" x2="80" y2="165" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="190" y1="165" x2="220" y2="165" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Switch blade open -->
  <line x1="85" y1="165" x2="175" y2="140" stroke="#c0392b" stroke-width="2.5"/>
  <text x="85" y="185" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">COM</text>
  <text x="185" y="185" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">NO</text>
  <text x="135" y="240" font-size="11" fill="#1a1a1a" text-anchor="middle">2 виводи. Просте увімкнення</text>
  <text x="135" y="256" font-size="11" fill="#1a1a1a" text-anchor="middle">чи вимкнення (ON-OFF).</text>

  <!-- Card 2: SPDT -->
  <rect x="260" y="85" width="210" height="205" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="365" y="110" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">SPDT</text>
  <text x="365" y="126" font-size="11" fill="#6b7280" text-anchor="middle">Single Pole Double Throw</text>

  <!-- SPDT Diagram -->
  <circle cx="315" cy="165" r="5" fill="#1a1a1a"/>
  <circle cx="415" cy="145" r="5" fill="#1a1a1a"/>
  <circle cx="415" cy="185" r="5" fill="#1a1a1a"/>
  <line x1="280" y1="165" x2="310" y2="165" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="420" y1="145" x2="450" y2="145" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="420" y1="185" x2="450" y2="185" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Switch blade connected to top NO -->
  <line x1="315" y1="165" x2="410" y2="146" stroke="#27ae60" stroke-width="2.5"/>
  <text x="315" y="185" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">COM</text>
  <text x="430" y="140" font-size="11" font-weight="bold" fill="#1a1a1a">NO</text>
  <text x="430" y="195" font-size="11" font-weight="bold" fill="#1a1a1a">NC</text>
  <text x="365" y="240" font-size="11" fill="#1a1a1a" text-anchor="middle">3 виводи. Перемикання</text>
  <text x="365" y="256" font-size="11" fill="#1a1a1a" text-anchor="middle">одного полюса між 2 лініями.</text>

  <!-- Card 3: DPST -->
  <rect x="490" y="85" width="210" height="205" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="595" y="110" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">DPST</text>
  <text x="595" y="126" font-size="11" fill="#6b7280" text-anchor="middle">Double Pole Single Throw</text>

  <!-- DPST Diagram (Dual independent switches connected by dashed mechanical tie) -->
  <circle cx="545" cy="150" r="4" fill="#1a1a1a"/>
  <circle cx="645" cy="150" r="4" fill="#1a1a1a"/>
  <line x1="545" y1="150" x2="635" y2="135" stroke="#c0392b" stroke-width="2"/>

  <circle cx="545" cy="185" r="4" fill="#1a1a1a"/>
  <circle cx="645" cy="185" r="4" fill="#1a1a1a"/>
  <line x1="545" y1="185" x2="635" y2="170" stroke="#c0392b" stroke-width="2"/>

  <!-- Mechanical tie -->
  <line x1="590" y1="142" x2="590" y2="177" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="3,3"/>

  <text x="530" y="154" font-size="10" font-weight="bold" fill="#1a1a1a">L1</text>
  <text x="530" y="189" font-size="10" font-weight="bold" fill="#1a1a1a">L2</text>
  <text x="595" y="240" font-size="11" fill="#1a1a1a" text-anchor="middle">4 виводи. Одночасна</text>
  <text x="595" y="256" font-size="11" fill="#1a1a1a" text-anchor="middle">комутація двох фаз/полюсів.</text>

  <!-- Card 4: DPDT -->
  <rect x="720" y="85" width="210" height="205" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="825" y="110" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">DPDT</text>
  <text x="825" y="126" font-size="11" fill="#6b7280" text-anchor="middle">Double Pole Double Throw</text>

  <!-- DPDT Diagram (6 pins) -->
  <circle cx="770" cy="150" r="4" fill="#1a1a1a"/>
  <circle cx="875" cy="140" r="4" fill="#1a1a1a"/>
  <circle cx="875" cy="160" r="4" fill="#1a1a1a"/>
  <line x1="770" y1="150" x2="870" y2="141" stroke="#27ae60" stroke-width="2"/>

  <circle cx="770" cy="190" r="4" fill="#1a1a1a"/>
  <circle cx="875" cy="180" r="4" fill="#1a1a1a"/>
  <circle cx="875" cy="200" r="4" fill="#1a1a1a"/>
  <line x1="770" y1="190" x2="870" y2="181" stroke="#27ae60" stroke-width="2"/>

  <!-- Mechanical tie -->
  <line x1="820" y1="145" x2="820" y2="185" stroke="#7f8c8d" stroke-width="2" stroke-dasharray="3,3"/>

  <text x="825" y="240" font-size="11" fill="#1a1a1a" text-anchor="middle">6 виводів. Двополюсне</text>
  <text x="825" y="256" font-size="11" fill="#1a1a1a" text-anchor="middle">перемикання та мостовий реверс.</text>

  <!-- BOTTOM SECTION: 3 Switching Modes Cards -->

  <!-- Mode 1: ON - OFF - ON -->
  <rect x="30" y="305" width="290" height="225" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="45" y="332" font-size="13" font-weight="bold" fill="#2457d6">1. Фіксований режим (ON - OFF - ON)</text>

  <!-- 3 Lever Positions Diagram -->
  <rect x="45" y="350" width="260" height="80" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <!-- Positions -->
  <line x1="85" y1="410" x2="65" y2="365" stroke="#2457d6" stroke-width="3"/>
  <circle cx="65" cy="365" r="5" fill="#2457d6"/>
  <text x="65" y="423" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">ON (1)</text>

  <line x1="175" y1="410" x2="175" y2="365" stroke="#7f8c8d" stroke-width="3"/>
  <circle cx="175" cy="365" r="5" fill="#7f8c8d"/>
  <text x="175" y="423" font-size="11" font-weight="bold" fill="#7f8c8d" text-anchor="middle">OFF</text>

  <line x1="265" y1="410" x2="285" y2="365" stroke="#2457d6" stroke-width="3"/>
  <circle cx="285" cy="365" r="5" fill="#2457d6"/>
  <text x="285" y="423" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">ON (2)</text>

  <text x="45" y="455" font-size="11" fill="#1a1a1a">Три фіксовані позиції важеля.</text>
  <text x="45" y="473" font-size="11" fill="#1a1a1a">Центральний стан OFF повного розриву.</text>
  <text x="45" y="491" font-size="11" fill="#6b7280">Вибір режимів (Ручний / Вимк / Авто).</text>

  <!-- Mode 2: ON - NONE - ON -->
  <rect x="335" y="305" width="290" height="225" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="350" y="332" font-size="13" font-weight="bold" fill="#27ae60">2. Двопозиційний (ON - NONE - ON)</text>

  <!-- 2 Lever Positions Diagram -->
  <rect x="350" y="350" width="260" height="80" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <line x1="415" y1="410" x2="390" y2="365" stroke="#27ae60" stroke-width="3"/>
  <circle cx="390" cy="365" r="5" fill="#27ae60"/>
  <text x="390" y="423" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">ON (А)</text>

  <line x1="545" y1="410" x2="570" y2="365" stroke="#27ae60" stroke-width="3"/>
  <circle cx="570" cy="365" r="5" fill="#27ae60"/>
  <text x="570" y="423" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">ON (Б)</text>

  <text x="350" y="455" font-size="11" fill="#1a1a1a">Дві фіксовані крайні позиції.</text>
  <text x="350" y="473" font-size="11" fill="#1a1a1a">Відсутній нейтральний стан (NONE).</text>
  <text x="350" y="491" font-size="11" fill="#6b7280">Безперервна комутація ліній А або Б.</text>

  <!-- Mode 3: (ON) - OFF - (ON) -->
  <rect x="640" y="305" width="290" height="225" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="655" y="332" font-size="13" font-weight="bold" fill="#c0392b">3. Моментальний ((ON) - OFF - (ON))</text>

  <!-- Momentary Lever Positions Diagram -->
  <rect x="655" y="350" width="260" height="80" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <line x1="695" y1="410" x2="675" y2="365" stroke="#c0392b" stroke-width="3"/>
  <circle cx="675" cy="365" r="5" fill="#c0392b"/>
  <!-- Return arrow -->
  <path d="M 685 365 Q 710 355 725 380" stroke="#c0392b" stroke-width="1.5" fill="none" marker-end="url(#arr-red)"/>
  <text x="675" y="423" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">(ON)</text>

  <line x1="785" y1="410" x2="785" y2="365" stroke="#7f8c8d" stroke-width="3"/>
  <circle cx="785" cy="365" r="5" fill="#7f8c8d"/>
  <text x="785" y="423" font-size="11" font-weight="bold" fill="#7f8c8d" text-anchor="middle">OFF</text>

  <line x1="875" y1="410" x2="895" y2="365" stroke="#c0392b" stroke-width="3"/>
  <circle cx="895" cy="365" r="5" fill="#c0392b"/>
  <text x="895" y="423" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">(ON)</text>

  <text x="655" y="455" font-size="11" fill="#1a1a1a">Дужки (ON) — нефіксована позиція.</text>
  <text x="655" y="473" font-size="11" fill="#1a1a1a">Автоматичне самоповернення пружиною.</text>
  <text x="655" y="491" font-size="11" fill="#6b7280">Короткочасний імпульс (Пуск / Скидання).</text>
</svg>
