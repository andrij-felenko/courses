<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Перехідні процеси при комутації індуктивного навантаження</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#6b7280">RC-демпфер поглинає магнітну енергію, обмежуючи крутизну наростання напруги dU/dt і запобігаючи дузі</text>

  <!-- Panel 1: Unprotected Circuit (Without RC Snubber) -->
  <rect x="40" y="90" width="420" height="340" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="250" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">Без захисту (Без демпфера)</text>
  <text x="250" y="136" text-anchor="middle" font-size="12" fill="#c0392b">(Високовольтний сплеск та електрична дуга)</text>

  <!-- Graph 1 Axes -->
  <line x1="90" y1="370" x2="430" y2="370" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="435" y="365" font-size="12" font-weight="bold" fill="#1a1a1a">t</text>

  <line x1="90" y1="370" x2="90" y2="160" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="90" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">u(t)</text>

  <!-- Dashed Reference Lines Panel 1 -->
  <line x1="90" y1="320" x2="410" y2="320" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="82" y="324" text-anchor="end" font-size="12" fill="#6b7280">U_supply</text>

  <line x1="90" y1="200" x2="410" y2="200" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="82" y="204" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">U_arc</text>

  <!-- Unprotected Voltage Waveform (High Peak & Arc Plateau) -->
  <path d="M 90,320 L 150,320 L 158,170 L 175,200 L 270,200 L 275,320 L 410,320" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Annotations Panel 1 -->
  <text x="200" y="165" font-size="12" font-weight="bold" fill="#c0392b">Крутий фронт dU/dt !</text>

  <!-- Arc Duration Arrow -->
  <line x1="175" y1="240" x2="270" y2="240" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-red)" marker-end="url(#arr-red)"/>
  <text x="222" y="256" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Тривалість дуги t_arc</text>

  <text x="250" y="415" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Ерозія та випалювання контактів</text>

  <!-- Panel 2: Protected Circuit (With RC Snubber) -->
  <rect x="500" y="90" width="420" height="340" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="710" y="118" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">З RC-демпфером (Захищене коло)</text>
  <text x="710" y="136" text-anchor="middle" font-size="12" fill="#27ae60">(Обмеження dU/dt та м'яке згасання)</text>

  <!-- Graph 2 Axes -->
  <line x1="550" y1="370" x2="890" y2="370" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="895" y="365" font-size="12" font-weight="bold" fill="#1a1a1a">t</text>

  <line x1="550" y1="370" x2="550" y2="160" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="550" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">u(t)</text>

  <!-- Dashed Reference Lines Panel 2 -->
  <line x1="550" y1="320" x2="870" y2="320" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="542" y="324" text-anchor="end" font-size="12" fill="#6b7280">U_supply</text>

  <line x1="550" y1="240" x2="870" y2="240" stroke="#27ae60" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="542" y="244" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">U_max</text>

  <!-- Protected Damped Voltage Waveform (Smooth Ramping & Soft Decay) -->
  <path d="M 550,320 L 610,320 Q 640,240 680,245 T 750,310 T 810,320 L 870,320" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Annotations Panel 2 -->
  <text x="650" y="195" font-size="12" font-weight="bold" fill="#27ae60">Плавне наростання dU/dt</text>
  <line x1="660" y1="202" x2="640" y2="260" stroke="#27ae60" stroke-width="1" stroke-dasharray="2 2"/>

  <text x="730" y="225" font-size="12" font-weight="bold" fill="#27ae60">Пік U_max &lt; U_arc (без дуги)</text>

  <text x="710" y="415" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Повне збереження ресурсу контактів</text>
</svg>
