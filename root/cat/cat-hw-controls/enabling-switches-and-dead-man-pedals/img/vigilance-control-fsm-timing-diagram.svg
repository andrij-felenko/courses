<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-orange" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#e67e22"/>
    </marker>
  </defs>

  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">FSM та часова діаграма циклу контролю пильності (Vigilance Control)</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Послідовність світлозвукового попередження, часові вікна скидання таймера та перехід у безпечний стан</text>

  <!-- Панель 1: Граф станів FSM -->
  <rect x="24" y="66" width="912" height="190" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="40" y="88" font-size="13" font-weight="700" fill="#1a1a1a">Граф станів FSM (Finite State Machine) контролера пильності</text>

  <!-- Вузол S0: NORMAL -->
  <rect x="40" y="104" width="180" height="74" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="130" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#27ae60">S0: NORMAL (ОК)</text>
  <text x="130" y="146" text-anchor="middle" font-size="12" fill="#1a1a1a">Педаль у Позиції 2</text>
  <text x="130" y="164" text-anchor="middle" font-size="12" fill="#6b7280">Таймер t_vigilance іде</text>

  <!-- Перехід S0 -> S1 -->
  <line x1="220" y1="141" x2="262" y2="141" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="241" y="132" text-anchor="middle" font-size="12" fill="#2457d6">t ≥ 25 c</text>

  <!-- Вузол S1: WARN_LIGHT -->
  <rect x="270" y="104" width="180" height="74" rx="6" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/>
  <text x="360" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#d68910">S1: WARN_LIGHT</text>
  <text x="360" y="146" text-anchor="middle" font-size="12" fill="#1a1a1a">Світлове попер.</text>
  <text x="360" y="164" text-anchor="middle" font-size="12" fill="#6b7280">Вікно Δt_light = 5 c</text>

  <!-- Перехід S1 -> S2 -->
  <line x1="450" y1="141" x2="492" y2="141" stroke="#e67e22" stroke-width="1.5" marker-end="url(#arr-orange)"/>
  <text x="471" y="132" text-anchor="middle" font-size="12" fill="#e67e22">t ≥ 30 c</text>

  <!-- Вузол S2: WARN_AUDIO -->
  <rect x="500" y="104" width="180" height="74" rx="6" fill="#fdf2e9" stroke="#e67e22" stroke-width="1.5"/>
  <text x="590" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#e67e22">S2: WARN_AUDIO</text>
  <text x="590" y="146" text-anchor="middle" font-size="12" fill="#1a1a1a">Світло + Звук</text>
  <text x="590" y="164" text-anchor="middle" font-size="12" fill="#6b7280">Вікно Δt_audio = 3 c</text>

  <!-- Перехід S2 -> S3 -->
  <line x1="680" y1="141" x2="722" y2="141" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="701" y="132" text-anchor="middle" font-size="12" fill="#c0392b">t ≥ 33 c</text>

  <!-- Вузол S3: TRIP / BRAKE -->
  <rect x="730" y="104" width="190" height="74" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="825" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">S3: TRIP / BRAKE</text>
  <text x="825" y="146" text-anchor="middle" font-size="12" fill="#1a1a1a">Аварійне гальмо</text>
  <text x="825" y="164" text-anchor="middle" font-size="12" fill="#c0392b">Реле безпеки ВИМК</text>

  <!-- Лінії скидання до S0 -->
  <!-- Скидання S1 -> S0 -->
  <path d="M 360,178 L 360,206 L 130,206 L 130,186" fill="none" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="245" y="200" text-anchor="middle" font-size="12" fill="#27ae60">Скидання (Ack S1)</text>

  <!-- Скидання S2 -> S0 -->
  <path d="M 590,178 L 590,226 L 130,226 L 130,186" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arr-green)"/>
  <text x="360" y="222" text-anchor="middle" font-size="12" fill="#27ae60">Скидання (Ack S2)</text>

  <!-- Пояснення аварійного відпускання -->
  <text x="535" y="244" text-anchor="middle" font-size="12" fill="#c0392b">Відпускання (Поз 1) або Панічний натиск (Поз 3) з будь-якого стану → негайний перехід у S3</text>

  <!-- Панель 2: Часова діаграма -->
  <rect x="24" y="268" width="912" height="268" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="40" y="290" font-size="13" font-weight="700" fill="#1a1a1a">Часова діаграма сигналів у часі t (сек)</text>

  <!-- Фонові прямокутники часових вікон -->
  <!-- Вікно 1: Normal (0..25 s) -->
  <rect x="250" y="306" width="300" height="190" fill="#e9f7ef" opacity="0.6" stroke="#27ae60" stroke-dasharray="3 3"/>
  <text x="400" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">t_normal = 25 c (Режим ОК)</text>

  <!-- Вікно 2: Light Warn (25..30 s) -->
  <rect x="550" y="306" width="120" height="190" fill="#fef9e7" opacity="0.7" stroke="#f39c12" stroke-dasharray="3 3"/>
  <text x="610" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#d68910">Δt_light = 5 c</text>

  <!-- Вікно 3: Audio Warn (30..33 s) -->
  <rect x="670" y="306" width="72" height="190" fill="#fdf2e9" opacity="0.8" stroke="#e67e22" stroke-dasharray="3 3"/>
  <text x="706" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#e67e22">Δt_aud = 3 c</text>

  <!-- Вікно 4: Trip (33..40 s) -->
  <rect x="742" y="306" width="148" height="190" fill="#fdecea" opacity="0.7" stroke="#c0392b" stroke-dasharray="3 3"/>
  <text x="816" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">Аварія (TRIP)</text>

  <!-- Підписи сигналів ліворуч -->
  <text x="40" y="348" font-size="12" font-weight="700" fill="#1a1a1a">Педаль (Позиція 2 / ОК)</text>
  <text x="40" y="390" font-size="12" font-weight="700" fill="#d68910">Світловий сигнал (Light)</text>
  <text x="40" y="432" font-size="12" font-weight="700" fill="#e67e22">Звуковий сигнал (Buzzer)</text>
  <text x="40" y="474" font-size="12" font-weight="700" fill="#c0392b">Реле безпеки (Safety Relay)</text>

  <!-- Сигнал 1: Педаль (Pos 2) -->
  <polyline points="250,338 742,338 742,354 890,354" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Сигнал 2: Світловий сигнал -->
  <polyline points="250,396 550,396 550,380 742,380 742,396 890,396" fill="none" stroke="#f39c12" stroke-width="2.5"/>

  <!-- Сигнал 3: Звуковий сигнал -->
  <polyline points="250,438 670,438 670,422 742,422 742,438 890,438" fill="none" stroke="#e67e22" stroke-width="2.5"/>

  <!-- Сигнал 4: Реле безпеки -->
  <polyline points="250,466 742,466 742,482 890,482" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Вертикальні часові засічки -->
  <line x1="250" y1="306" x2="250" y2="506" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="550" y1="306" x2="550" y2="506" stroke="#f39c12" stroke-width="1.2" stroke-dasharray="2 2"/>
  <line x1="670" y1="306" x2="670" y2="506" stroke="#e67e22" stroke-width="1.2" stroke-dasharray="2 2"/>
  <line x1="742" y1="306" x2="742" y2="506" stroke="#c0392b" stroke-width="1.8"/>

  <!-- Часова вісь та позначки -->
  <line x1="230" y1="506" x2="900" y2="506" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="250" y="522" text-anchor="middle" font-size="12" fill="#1a1a1a">0 c</text>
  <text x="550" y="522" text-anchor="middle" font-size="12" fill="#d68910">25 c</text>
  <text x="670" y="522" text-anchor="middle" font-size="12" fill="#e67e22">30 c</text>
  <text x="742" y="522" text-anchor="middle" font-size="12" fill="#c0392b">33 c</text>
  <text x="890" y="522" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">час t</text>
</svg>
