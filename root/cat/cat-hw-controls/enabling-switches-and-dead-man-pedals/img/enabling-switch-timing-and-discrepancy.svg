<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="520" fill="white"/>
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Часові діаграми та аналіз розсинхронізації каналів (Discrepancy Time)</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Допустимий інтервал t_disc регулює затримку спрацьовування CH1 і CH2 для виявлення збоїв контактів</text>

  <!-- PANEL 1: Normal Operation -->
  <rect x="25" y="72" width="910" height="200" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="40" y="94" font-size="13" font-weight="bold" fill="#27ae60">1. Нормальний цикл роботи: Допустима затримка контактів (Δt ≤ t_disc)</text>

  <!-- Position Phase Lines for Panel 1 -->
  <line x1="175" y1="104" x2="175" y2="258" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="390" y1="104" x2="390" y2="258" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="620" y1="104" x2="620" y2="258" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="282.5" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b7280">Позиція 1 (OFF)</text>
  <text x="505" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Позиція 2 (ДОЗВІЛ / ENABLED)</text>
  <text x="750" y="118" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Позиція 3 (ПАНІКА / OFF)</text>

  <!-- Waveform CH1 Panel 1 -->
  <text x="165" y="146" text-anchor="end" font-size="11" font-weight="bold" fill="#2457d6">CH1 (Контакт S1)</text>
  <path d="M175,150 L390,150 L390,132 L620,132 L620,150 L880,150" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Waveform CH2 Panel 1 (Delayed by dt) -->
  <text x="165" y="182" text-anchor="end" font-size="11" font-weight="bold" fill="#8e44ad">CH2 (Контакт S2)</text>
  <path d="M175,186 L430,186 L430,168 L635,168 L635,186 L880,186" fill="none" stroke="#8e44ad" stroke-width="2"/>

  <!-- Discrepancy Time Delta t Marker Panel 1 -->
  <line x1="390" y1="130" x2="390" y2="198" stroke="#27ae60" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="430" y1="166" x2="430" y2="198" stroke="#27ae60" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="390" y1="195" x2="430" y2="195" stroke="#27ae60" stroke-width="1.5" marker-start="url(#arr-green)" marker-end="url(#arr-green)"/>
  <text x="410" y="209" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Δt ≤ t_disc</text>

  <!-- Output Relay Waveform Panel 1 -->
  <text x="165" y="234" text-anchor="end" font-size="11" font-weight="bold" fill="#27ae60">Вихід реле (Out)</text>
  <path d="M175,238 L430,238 L430,220 L620,220 L620,238 L880,238" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Status Badge Panel 1 -->
  <rect x="655" y="145" width="265" height="50" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="787.5" y="165" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">СТАН: ДОЗВІЛ АКТИВНИЙ (OK)</text>
  <text x="787.5" y="183" text-anchor="middle" font-size="11" fill="#1a1a1a">Обидва канали замкнулися в межах t_disc</text>


  <!-- PANEL 2: Discrepancy Fault -->
  <rect x="25" y="285" width="910" height="215" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="40" y="307" font-size="13" font-weight="bold" fill="#c0392b">2. Аварія розсинхронізації контактів: Перевищення ліміту (Δt &gt; t_disc)</text>

  <!-- Vertical Phase Lines Panel 2 -->
  <line x1="175" y1="317" x2="175" y2="485" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="390" y1="317" x2="390" y2="485" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="530" y1="317" x2="530" y2="485" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>

  <text x="282.5" y="331" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b7280">Позиція 1 (OFF)</text>
  <text x="460" y="331" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Інтервал контролю t_disc</text>
  <text x="705" y="331" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Аварійне блокування (FAULT LOCKOUT)</text>

  <!-- Shaded Fault Zone for t_disc timeout -->
  <rect x="390" y="340" width="140" height="140" fill="#fdecea" fill-opacity="0.6"/>

  <!-- Waveform CH1 Panel 2 -->
  <text x="165" y="359" text-anchor="end" font-size="11" font-weight="bold" fill="#2457d6">CH1 (Контакт S1)</text>
  <path d="M175,363 L390,363 L390,345 L880,345" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Waveform CH2 Panel 2 (Fails to close or too late) -->
  <text x="165" y="399" text-anchor="end" font-size="11" font-weight="bold" fill="#8e44ad">CH2 (Заклинив / Обрив)</text>
  <path d="M175,403 L880,403" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,2"/>

  <!-- Discrepancy Timeout Window Marker Panel 2 -->
  <line x1="390" y1="418" x2="530" y2="418" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-red)" marker-end="url(#arr-red)"/>
  <text x="460" y="432" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Таймаут t_disc вичерпано!</text>

  <!-- Output Relay Waveform Panel 2 (Remains OFF) -->
  <text x="165" y="460" text-anchor="end" font-size="11" font-weight="bold" fill="#c0392b">Вихід реле (Out)</text>
  <path d="M175,464 L880,464" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="282.5" y="456" text-anchor="middle" font-size="11" fill="#c0392b">БЛОКОВАНО (0 В)</text>
  <text x="705" y="456" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">БЛОКУВАННЯ ДО РУЧНОГО СКИДАННЯ (RESET)</text>

  <!-- Status Badge Panel 2 -->
  <rect x="545" y="355" width="375" height="55" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="732.5" y="375" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">ПОМИЛКА: РОЗСИНХРОНІЗАЦІЯ КАНАЛІВ (DISCREPANCY FAULT)</text>
  <text x="732.5" y="395" text-anchor="middle" font-size="11" fill="#1a1a1a">Контакт CH2 не замкнувся за час t_disc → Система заблокована</text>

</svg>
