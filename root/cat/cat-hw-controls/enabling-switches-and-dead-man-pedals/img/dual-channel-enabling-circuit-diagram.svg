<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Двоканальна схема підключення кнопки дозволу до реле безпеки</text>
  <text x="480" y="54" font-size="13" text-anchor="middle" fill="#6b7280">Контроль коротких замикань тестовими імпульсами T1/T2 та примусово керовані контакти</text>

  <!-- Панель 1: Кнопка дозволу (Лівий блок) -->
  <rect x="30" y="80" width="330" height="435" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="195" y="105" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a1a">Кнопка дозволу (3-позиційна)</text>

  <!-- Підпанель: Положення механізму -->
  <rect x="45" y="120" width="300" height="125" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="195" y="140" font-size="13" font-weight="700" text-anchor="middle" fill="#2457d6">Кінематика 3-х положень</text>
  
  <text x="60" y="165" font-size="12" fill="#6b7280">Положення 1 (Відпущено):</text>
  <text x="330" y="165" font-size="12" font-weight="700" text-anchor="end" fill="#c0392b">РОЗІМКНУТО (OFF)</text>

  <text x="60" y="190" font-size="12" fill="#6b7280">Положення 2 (Утримання):</text>
  <text x="330" y="190" font-size="12" font-weight="700" text-anchor="end" fill="#27ae60">ЗІМКНУТО (ENABLE)</text>

  <text x="60" y="215" font-size="12" fill="#6b7280">Положення 3 (Паніка):</text>
  <text x="330" y="215" font-size="12" font-weight="700" text-anchor="end" fill="#c0392b">РОЗІМКНУТО (OFF)</text>

  <!-- Підпанель: Контактні групи -->
  <rect x="45" y="260" width="285" height="240" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="187" y="282" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">Дубльовані канали з прямим розмиканням</text>

  <!-- Канал 1 блок -->
  <rect x="55" y="295" width="265" height="90" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="70" y="315" font-size="12" font-weight="700" fill="#2457d6">Канал 1 (CH1)</text>
  <text x="70" y="335" font-size="12" fill="#1a1a1a">Вхід S11 → Вихід S12</text>
  <text x="70" y="355" font-size="12" fill="#6b7280">Пряме розмикання (Θ)</text>
  <text x="70" y="373" font-size="12" font-weight="700" fill="#27ae60">Зімкнено у Положенні 2</text>

  <!-- Канал 2 блок -->
  <rect x="55" y="395" width="265" height="95" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="70" y="415" font-size="12" font-weight="700" fill="#2457d6">Канал 2 (CH2)</text>
  <text x="70" y="435" font-size="12" fill="#1a1a1a">Вхід S21 → Вихід S22</text>
  <text x="70" y="455" font-size="12" fill="#6b7280">Ізольований від CH1 (Θ)</text>
  <text x="70" y="475" font-size="12" font-weight="700" fill="#27ae60">Зімкнено у Положенні 2</text>

  <!-- Позначення клем роз'єму кнопки -->
  <circle cx="360" cy="330" r="4" fill="#2457d6"/>
  <text x="350" y="325" font-size="12" font-weight="700" text-anchor="end" fill="#2457d6">S11</text>

  <circle cx="360" cy="370" r="4" fill="#2457d6"/>
  <text x="350" y="365" font-size="12" font-weight="700" text-anchor="end" fill="#2457d6">S12</text>

  <circle cx="360" cy="420" r="4" fill="#c0392b"/>
  <text x="350" y="415" font-size="12" font-weight="700" text-anchor="end" fill="#c0392b">S21</text>

  <circle cx="360" cy="460" r="4" fill="#c0392b"/>
  <text x="350" y="455" font-size="12" font-weight="700" text-anchor="end" fill="#c0392b">S22</text>

  <!-- Центральна зона: Діагностика КЗ та Лінії зв'язку -->
  <rect x="385" y="80" width="190" height="205" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="6"/>
  <text x="480" y="103" font-size="13" font-weight="700" text-anchor="middle" fill="#c0392b">Діагностика КЗ (Cross-fault)</text>
  <text x="480" y="128" font-size="12" text-anchor="middle" fill="#1a1a1a">Тестові імпульси T1 і T2</text>
  <text x="480" y="148" font-size="12" text-anchor="middle" fill="#1a1a1a">зсунуті за часом (зсув фаз).</text>
  <text x="480" y="173" font-size="12" text-anchor="middle" fill="#c0392b">При КЗ між CH1 і CH2</text>
  <text x="480" y="193" font-size="12" text-anchor="middle" fill="#1a1a1a">або замиканні на 24V / 0V</text>
  <text x="480" y="213" font-size="12" text-anchor="middle" fill="#1a1a1a">реле виявляє чужий імпульс</text>
  <text x="480" y="238" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">та розмикає реле K1/K2</text>
  <text x="480" y="260" font-size="12" text-anchor="middle" fill="#6b7280">за час t &lt; 20 мс</text>

  <!-- Зв'язки ліній -->
  <!-- Провід 1: T1 -> S11 -->
  <line x1="600" y1="330" x2="368" y2="330" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="480" y="322" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">Тестовий імпульс T1 (Канал 1)</text>

  <!-- Провід 2: S12 -> S12 -->
  <line x1="368" y1="370" x2="592" y2="370" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="480" y="362" font-size="12" text-anchor="middle" fill="#2457d6">Вхід зворотного сигналу S12</text>

  <!-- Провід 3: T2 -> S21 -->
  <line x1="600" y1="420" x2="368" y2="420" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="480" y="412" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">Тестовий імпульс T2 (зсунутий)</text>

  <!-- Провід 4: S22 -> S22 -->
  <line x1="368" y1="460" x2="592" y2="460" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="480" y="452" font-size="12" text-anchor="middle" fill="#c0392b">Вхід зворотного сигналу S22</text>

  <!-- Панель 3: Реле безпеки (Правий блок) -->
  <rect x="600" y="80" width="330" height="435" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="765" y="105" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a1a">Реле безпеки (Safety Relay)</text>

  <!-- Блок генератора імпульсів -->
  <rect x="630" y="120" width="285" height="75" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="6"/>
  <text x="772" y="140" font-size="13" font-weight="700" text-anchor="middle" fill="#2457d6">Формувач генератора тестових імпульсів</text>
  <text x="640" y="162" font-size="12" fill="#2457d6">Вихід T1: імпульсний меандр (0V...24V)</text>
  <text x="640" y="182" font-size="12" fill="#c0392b">Вихід T2: інвертований/зсунутий меандр</text>

  <!-- Блок логіки -->
  <rect x="630" y="205" width="285" height="175" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="772" y="227" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">Логічний модуль оцінки входів</text>
  
  <text x="640" y="252" font-size="12" fill="#1a1a1a">• Контроль одночасності каналів (CH1 / CH2)</text>
  <text x="640" y="275" font-size="12" fill="#c0392b">• Детекція перехресного КЗ та обриву</text>
  <text x="640" y="298" font-size="12" fill="#1a1a1a">• Контроль зварювання контактів кнопки</text>
  <text x="640" y="321" font-size="12" fill="#6b7280">• Часова розбіжність каналів &lt; 0.5 с</text>
  <text x="640" y="344" font-size="12" fill="#27ae60">• Захист від блокування (байпасу)</text>
  <text x="640" y="367" font-size="12" fill="#1a1a1a">• Відповідність ISO 10218 / IEC 60204-1</text>

  <!-- Блок вихідних контактів -->
  <rect x="630" y="390" width="285" height="110" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="6"/>
  <text x="772" y="412" font-size="13" font-weight="700" text-anchor="middle" fill="#27ae60">Вихідний ланцюг безпеки (K1 / K2)</text>
  <text x="640" y="437" font-size="12" fill="#1a1a1a">Реле K1, K2: примусово керовані контакти</text>
  <text x="640" y="460" font-size="12" fill="#1a1a1a">Вихід на керування приводів (STO / Контактори)</text>
  <text x="772" y="485" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">Дозвіл рухів ТІЛЬКИ в Положенні 2 (ENABLE)</text>

  <!-- Клеми реле -->
  <circle cx="600" cy="330" r="4" fill="#2457d6"/>
  <text x="608" y="325" font-size="12" font-weight="700" fill="#2457d6">T1</text>

  <circle cx="600" cy="370" r="4" fill="#2457d6"/>
  <text x="608" y="365" font-size="12" font-weight="700" fill="#2457d6">S12</text>

  <circle cx="600" cy="420" r="4" fill="#c0392b"/>
  <text x="608" y="415" font-size="12" font-weight="700" fill="#c0392b">T2</text>

  <circle cx="600" cy="460" r="4" fill="#c0392b"/>
  <text x="608" y="455" font-size="12" font-weight="700" fill="#c0392b">S22</text>
</svg>
