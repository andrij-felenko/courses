<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="500" fill="white"/>
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Вразливість двопозиційного вимикача присутності («мертвої руки»)</text>
  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#6b7280">При непритомності важіль відпускається (Безпека), але м'язовий спазм утримує коло замкненим (Відмова)</text>

  <!-- Panel 1: Normal Operation -->
  <rect x="25" y="68" width="295" height="412" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="172" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">1. Нормальна робота</text>
  <text x="172" y="112" text-anchor="middle" font-size="12" fill="#2457d6">Оператор свідомо тисне</text>

  <!-- Switch Diagram 1 -->
  <rect x="65" y="130" width="214" height="150" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <!-- Switch Housing Base -->
  <rect x="95" y="220" width="154" height="45" fill="#2c3e50" rx="3"/>
  <!-- Contacts -->
  <circle cx="130" cy="242" r="5" fill="#f1c40f" stroke="#d4ac0d" stroke-width="1"/>
  <circle cx="214" cy="242" r="5" fill="#f1c40f" stroke="#d4ac0d" stroke-width="1"/>
  <!-- Contact Blade (Closed) -->
  <line x1="130" y1="242" x2="214" y2="242" stroke="#27ae60" stroke-width="4"/>
  <!-- Actuator Button Pressed -->
  <rect x="157" y="180" width="30" height="40" fill="#2457d6" rx="2"/>
  <!-- Force Arrow Down -->
  <line x1="172" y1="140" x2="172" y2="175" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="180" y="160" font-size="11" font-weight="bold" fill="#2457d6">F_hand</text>

  <text x="172" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Контакти: ЗАМКНЕНО</text>

  <!-- Specs Box 1 -->
  <rect x="45" y="315" width="255" height="42" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="55" y="332" font-size="12" font-weight="bold" fill="#1a1a1a">Стан руки:</text>
  <text x="125" y="332" font-size="12" fill="#1a1a1a">Робоче утримання</text>
  <text x="55" y="348" font-size="11" fill="#6b7280">Свідомий контроль оператора</text>

  <rect x="45" y="365" width="255" height="42" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="55" y="382" font-size="12" font-weight="bold" fill="#1a1a1a">Електричне коло:</text>
  <text x="165" y="382" font-size="12" fill="#27ae60">Замкнено (ВВІМК)</text>
  <text x="55" y="398" font-size="11" fill="#6b7280">Обладнання отримує живлення</text>

  <rect x="45" y="415" width="255" height="52" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="55" y="433" font-size="12" font-weight="bold" fill="#2457d6">Результат:</text>
  <text x="125" y="433" font-size="12" fill="#1a1a1a">Штатний технологічний рух</text>
  <text x="55" y="451" font-size="11" fill="#1a1a1a">Машина працює під контролем</text>

  <!-- Panel 2: Unconscious Release (Safe Fallback) -->
  <rect x="332" y="68" width="295" height="412" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">2. Непритомність (Відпускання)</text>
  <text x="480" y="112" text-anchor="middle" font-size="12" fill="#27ae60">Втрата свідомості / Млявість</text>

  <!-- Switch Diagram 2 -->
  <rect x="372" y="130" width="214" height="150" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <!-- Switch Housing Base -->
  <rect x="402" y="220" width="154" height="45" fill="#2c3e50" rx="3"/>
  <!-- Contacts -->
  <circle cx="437" cy="242" r="5" fill="#f1c40f" stroke="#d4ac0d" stroke-width="1"/>
  <circle cx="521" cy="242" r="5" fill="#f1c40f" stroke="#d4ac0d" stroke-width="1"/>
  <!-- Contact Blade (Open / Tilted Up) -->
  <line x1="437" y1="242" x2="515" y2="225" stroke="#c0392b" stroke-width="4"/>
  <!-- Actuator Button Released (Up) -->
  <rect x="464" y="160" width="30" height="40" fill="#27ae60" rx="2"/>
  <!-- Spring Force Arrow Up -->
  <line x1="479" y1="210" x2="479" y2="152" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="487" y="190" font-size="11" font-weight="bold" fill="#27ae60">F_spring</text>

  <text x="480" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Контакти: РОЗІМКНЕНО</text>

  <!-- Specs Box 2 -->
  <rect x="352" y="315" width="255" height="42" rx="4" fill="#ffffff" stroke="#27ae60"/>
  <text x="362" y="332" font-size="12" font-weight="bold" fill="#1a1a1a">Стан руки:</text>
  <text x="432" y="332" font-size="12" fill="#1a1a1a">Повне відпускання</text>
  <text x="362" y="348" font-size="11" fill="#6b7280">Оператор впав / знепритомнів</text>

  <rect x="352" y="365" width="255" height="42" rx="4" fill="#ffffff" stroke="#27ae60"/>
  <text x="362" y="382" font-size="12" font-weight="bold" fill="#1a1a1a">Електричне коло:</text>
  <text x="472" y="382" font-size="12" fill="#c0392b">Розімкнено (ВІМК)</text>
  <text x="362" y="398" font-size="11" fill="#6b7280">Живлення примусово знято</text>

  <rect x="352" y="415" width="255" height="52" rx="4" fill="#ffffff" stroke="#27ae60"/>
  <text x="362" y="433" font-size="12" font-weight="bold" fill="#27ae60">Реакція захисту:</text>
  <text x="475" y="433" font-size="12" fill="#1a1a1a">Аварійна зупинка</text>
  <text x="362" y="451" font-size="11" fill="#1a1a1a">Захист працює при відпусканні</text>

  <!-- Panel 3: Muscle Spasm / Panic (Dangerous Failure) -->
  <rect x="640" y="68" width="295" height="412" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="787" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">3. Панічний спазм / Судома</text>
  <text x="787" y="112" text-anchor="middle" font-size="12" fill="#c0392b">Судомне стискання рукоятки</text>

  <!-- Switch Diagram 3 -->
  <rect x="680" y="130" width="214" height="150" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <!-- Switch Housing Base -->
  <rect x="710" y="220" width="154" height="45" fill="#2c3e50" rx="3"/>
  <!-- Contacts -->
  <circle cx="745" cy="242" r="5" fill="#f1c40f" stroke="#d4ac0d" stroke-width="1"/>
  <circle cx="829" cy="242" r="5" fill="#f1c40f" stroke="#d4ac0d" stroke-width="1"/>
  <!-- Contact Blade (Closed under Spasm) -->
  <line x1="745" y1="242" x2="829" y2="242" stroke="#c0392b" stroke-width="4"/>
  <!-- Actuator Button Over-Pressed -->
  <rect x="772" y="185" width="30" height="35" fill="#c0392b" rx="2"/>
  <!-- Heavy Spasm Force Arrow Down -->
  <line x1="787" y1="135" x2="787" y2="180" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-red)"/>
  <text x="795" y="155" font-size="11" font-weight="bold" fill="#c0392b">F_spasm</text>

  <text x="787" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Контакти: ЗАМКНЕНО!</text>

  <!-- Specs Box 3 -->
  <rect x="660" y="315" width="255" height="42" rx="4" fill="#ffffff" stroke="#c0392b"/>
  <text x="670" y="332" font-size="12" font-weight="bold" fill="#1a1a1a">Стан руки:</text>
  <text x="740" y="332" font-size="12" fill="#c0392b">М'язова судома / Паніка</text>
  <text x="670" y="348" font-size="11" fill="#6b7280">Рефлекторне м'язове стискання</text>

  <rect x="660" y="365" width="255" height="42" rx="4" fill="#ffffff" stroke="#c0392b"/>
  <text x="670" y="382" font-size="12" font-weight="bold" fill="#1a1a1a">Електричне коло:</text>
  <text x="780" y="382" font-size="12" fill="#c0392b">Замкнено! (ВВІМК)</text>
  <text x="670" y="398" font-size="11" fill="#6b7280">Пристрою не знято живлення</text>

  <rect x="660" y="415" width="255" height="52" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="670" y="433" font-size="12" font-weight="bold" fill="#c0392b">КРИТИЧНА АВАРІЯ:</text>
  <text x="795" y="433" font-size="12" fill="#1a1a1a">Рух триває!</text>
  <text x="670" y="451" font-size="11" fill="#c0392b">Двопозиційна схема незахищена</text>
</svg>
