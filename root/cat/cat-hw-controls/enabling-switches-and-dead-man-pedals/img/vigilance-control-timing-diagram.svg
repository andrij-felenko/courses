<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма системи контролю пильності (Vigilance Control)</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Часові інтервали t_hold, t_warn, t_react та умови запобігання захисному відключенню</text>

  <!-- PANEL A: Successful Reset -->
  <rect x="30" y="75" width="900" height="195" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  
  <!-- Panel A Header Badge -->
  <rect x="45" y="87" width="370" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="55" y="103" font-size="13" font-weight="bold" fill="#27ae60">Сценарій А: Своєчасне скидання (t_react ≤ t_warn)</text>

  <!-- Panel A Signal Labels -->
  <text x="45" y="138" font-size="12" font-weight="bold" fill="#1a1a1a">Педаль / кнопка</text>
  <text x="45" y="153" font-size="12" fill="#6b7280">(Поз. 2 / Поз. 1)</text>
  
  <text x="45" y="188" font-size="12" font-weight="bold" fill="#1a1a1a">Сигнал тривоги</text>
  <text x="45" y="203" font-size="12" fill="#6b7280">(t_warn увімкнено)</text>
  
  <text x="45" y="238" font-size="12" font-weight="bold" fill="#1a1a1a">Вихід безпеки</text>
  <text x="45" y="253" font-size="12" font-weight="bold" fill="#27ae60">(Дозвіл руху)</text>

  <line x1="220" y1="87" x2="220" y2="258" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Panel A Timing Background Zones -->
  <rect x="240" y="117" width="280" height="141" fill="#eaf0fd" opacity="0.6"/>
  <rect x="520" y="117" width="140" height="141" fill="#fdecea" opacity="0.6"/>
  <rect x="660" y="117" width="240" height="141" fill="#eaf0fd" opacity="0.4"/>

  <!-- Panel A Timeline Dimension Arrows -->
  <line x1="240" y1="125" x2="325" y2="125" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue)"/>
  <rect x="327" y="115" width="106" height="20" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="380" y="129" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">t_hold (8–60 с)</text>
  <line x1="433" y1="125" x2="520" y2="125" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <line x1="520" y1="125" x2="540" y2="125" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-red)"/>
  <rect x="542" y="115" width="96" height="20" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="590" y="129" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">t_warn (2.5 с)</text>
  <line x1="640" y1="125" x2="660" y2="125" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <line x1="660" y1="125" x2="710" y2="125" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="712" y="115" width="126" height="20" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="775" y="129" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Новий цикл t_hold</text>
  <line x1="840" y1="125" x2="900" y2="125" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <line x1="520" y1="172" x2="532" y2="172" stroke="#27ae60" stroke-width="1.5" marker-start="url(#arr-green)"/>
  <rect x="534" y="162" width="62" height="20" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="565" y="176" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">t_react</text>
  <line x1="598" y1="172" x2="610" y2="172" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Panel A Vertical Guidelines -->
  <line x1="240" y1="110" x2="240" y2="258" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="520" y1="110" x2="520" y2="258" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="610" y1="110" x2="610" y2="258" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="660" y1="110" x2="660" y2="258" stroke="#2457d6" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Panel A Waveforms -->
  <!-- 1. Pedal -->
  <path d="M 230,142 L 610,142 L 610,162 L 640,162 L 640,142 L 900,142" stroke="#2457d6" stroke-width="2.5" fill="none"/>
  <text x="625" y="138" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Скидання</text>

  <!-- 2. Alarm -->
  <path d="M 230,202 L 520,202 L 520,186 L 610,186 L 610,202 L 900,202" stroke="#c0392b" stroke-width="2.5" fill="none"/>
  <text x="565" y="180" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Світло/Звук ON</text>

  <!-- 3. Safety Output -->
  <path d="M 230,232 L 900,232" stroke="#27ae60" stroke-width="3" fill="none"/>
  <text x="775" y="224" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Безперервний дозвіл руху (без зупинки)</text>


  <!-- PANEL B: Missed Reset / Trip -->
  <rect x="30" y="285" width="900" height="190" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  
  <!-- Panel B Header Badge -->
  <rect x="45" y="297" width="440" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="55" y="313" font-size="13" font-weight="bold" fill="#c0392b">Сценарій Б: Пропускання скидання (t > t_hold + t_warn → Тріп)</text>

  <!-- Panel B Signal Labels -->
  <text x="45" y="348" font-size="12" font-weight="bold" fill="#1a1a1a">Педаль / кнопка</text>
  <text x="45" y="363" font-size="12" fill="#6b7280">(Безперервне утримання)</text>
  
  <text x="45" y="398" font-size="12" font-weight="bold" fill="#1a1a1a">Сигнал тривоги</text>
  <text x="45" y="413" font-size="12" fill="#c0392b">(Перехід у тривогу)</text>
  
  <text x="45" y="448" font-size="12" font-weight="bold" fill="#1a1a1a">Вихід безпеки</text>
  <text x="45" y="463" font-size="12" font-weight="bold" fill="#c0392b">(Відключення)</text>

  <line x1="220" y1="297" x2="220" y2="468" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Panel B Timing Background Zones -->
  <rect x="240" y="327" width="280" height="141" fill="#eaf0fd" opacity="0.6"/>
  <rect x="520" y="327" width="140" height="141" fill="#fdecea" opacity="0.6"/>
  <rect x="660" y="327" width="240" height="141" fill="#fdecea" opacity="0.95"/>

  <!-- Panel B Timeline Dimension Arrows -->
  <line x1="240" y1="335" x2="325" y2="335" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue)"/>
  <rect x="327" y="325" width="106" height="20" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="380" y="339" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">t_hold (8–60 с)</text>
  <line x1="433" y1="335" x2="520" y2="335" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <line x1="520" y1="335" x2="540" y2="335" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-red)"/>
  <rect x="542" y="325" width="96" height="20" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="590" y="339" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">t_warn (2.5 с)</text>
  <line x1="640" y1="335" x2="660" y2="335" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <rect x="675" y="325" width="210" height="20" rx="3" fill="#c0392b"/>
  <text x="780" y="339" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ЗАХИСНЕ ВІДКЛЮЧЕННЯ (TRIP)</text>

  <!-- Panel B Vertical Guidelines -->
  <line x1="240" y1="320" x2="240" y2="468" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="520" y1="320" x2="520" y2="468" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="660" y1="320" x2="660" y2="468" stroke="#c0392b" stroke-width="2" stroke-dasharray="3 3"/>

  <!-- Panel B Waveforms -->
  <!-- 1. Pedal -->
  <path d="M 230,352 L 900,352" stroke="#2457d6" stroke-width="2.5" fill="none"/>
  <text x="780" y="368" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Нерухоме утримання (немає скидання)</text>

  <!-- 2. Alarm -->
  <path d="M 230,412 L 520,412 L 520,392 L 900,392" stroke="#c0392b" stroke-width="2.5" fill="none"/>
  <text x="590" y="386" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Попередження</text>
  <text x="780" y="386" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Аварійна сирена ON</text>

  <!-- 3. Safety Output -->
  <path d="M 230,442 L 660,442 L 660,462 L 900,462" stroke="#c0392b" stroke-width="3" fill="none"/>
  <text x="780" y="456" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">АВАРІЙНА ЗУПИНКА (0 В / Безпечний стан)</text>

  <!-- FOOTER -->
  <rect x="30" y="482" width="900" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="500" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Критерій безпеки: Дозвіл руху діє лише за умови t_reset ≤ t_hold + t_warn (ISO 13849-1 / IEC 62061)</text>
</svg>
