<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кінематичні стани трипозиційного вимикача дозволу</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Коло безпеки замкнене тільки у Позиції 2 і розмикається при відпусканні (Поз. 1) або паніці (Поз. 3)</text>

  <!-- PANEL 1: POSITION 1 (OFF / UNPRESSED) -->
  <rect x="30" y="70" width="280" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="40" y="82" width="260" height="32" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="170" y="103" font-size="14" font-weight="bold" fill="#6b7280" text-anchor="middle">Позиція 1: Відпущено (OFF)</text>
  <text x="170" y="127" font-size="12" fill="#6b7280" text-anchor="middle">F = 0 Н (відпущено)</text>

  <!-- Plunger Assembly 1 -->
  <rect x="145" y="136" width="50" height="18" rx="4" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="170" y1="154" x2="170" y2="230" stroke="#1a1a1a" stroke-width="4"/>
  <!-- Return Spring 1 -->
  <path d="M 155,160 L 185,168 L 155,176 L 185,184 L 155,192 L 185,200 L 170,208" fill="none" stroke="#6b7280" stroke-width="2"/>

  <!-- Contacts 1 (Open Gap) -->
  <line x1="80" y1="255" x2="115" y2="255" stroke="#6b7280" stroke-width="3"/>
  <circle cx="115" cy="255" r="5" fill="#6b7280"/>
  <line x1="225" y1="255" x2="260" y2="255" stroke="#6b7280" stroke-width="3"/>
  <circle cx="225" cy="255" r="5" fill="#6b7280"/>
  <!-- Open Bridge Above Terminals -->
  <line x1="110" y1="238" x2="230" y2="238" stroke="#6b7280" stroke-width="4"/>

  <!-- Status Badge 1 -->
  <rect x="55" y="295" width="230" height="30" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="170" y="315" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">КОЛО РОЗІМКНЕНО (OFF)</text>

  <!-- Description 1 -->
  <text x="170" y="355" font-size="12" fill="#1a1a1a" text-anchor="middle">Оператор відпустив кнопку або</text>
  <text x="170" y="375" font-size="12" fill="#6b7280" text-anchor="middle">випустив пульт з рук</text>
  <text x="170" y="415" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Рух заборонено</text>

  <!-- PANEL 2: POSITION 2 (ON / MID-PRESSED) -->
  <rect x="340" y="70" width="280" height="365" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <rect x="350" y="82" width="260" height="32" rx="4" fill="#ffffff" stroke="#27ae60"/>
  <text x="480" y="103" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Позиція 2: Натиснуто (ON)</text>
  <text x="480" y="127" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">F1 ≈ 3...6 Н (робочий дозвіл)</text>

  <!-- Plunger Assembly 2 (Mid Position) -->
  <line x1="438" y1="136" x2="438" y2="150" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="455" y="146" width="50" height="18" rx="4" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="480" y1="164" x2="480" y2="245" stroke="#1a1a1a" stroke-width="4"/>
  <!-- Compressed Spring 2 -->
  <path d="M 465,168 L 495,174 L 465,180 L 495,186 L 465,192 L 495,198 L 480,204" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Contacts 2 (Closed / Connected) -->
  <line x1="390" y1="255" x2="425" y2="255" stroke="#27ae60" stroke-width="3"/>
  <circle cx="425" cy="255" r="5" fill="#27ae60"/>
  <line x1="535" y1="255" x2="570" y2="255" stroke="#27ae60" stroke-width="3"/>
  <circle cx="535" cy="255" r="5" fill="#27ae60"/>
  <!-- Bridge Connected onto Terminals -->
  <line x1="420" y1="255" x2="540" y2="255" stroke="#27ae60" stroke-width="4"/>

  <!-- Status Badge 2 -->
  <rect x="365" y="295" width="230" height="30" rx="4" fill="#ffffff" stroke="#27ae60"/>
  <text x="480" y="315" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">КОЛО ЗАМКНЕНО (ON)</text>

  <!-- Description 2 -->
  <text x="480" y="355" font-size="12" fill="#1a1a1a" text-anchor="middle">Свідоме утримання у середній</text>
  <text x="480" y="375" font-size="12" fill="#6b7280" text-anchor="middle">точці фіксації</text>
  <text x="480" y="415" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Дозвіл на рух надано</text>

  <!-- PANEL 3: POSITION 3 (OFF / FULLY PRESSED / PANIC) -->
  <rect x="650" y="70" width="280" height="365" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <rect x="660" y="82" width="260" height="32" rx="4" fill="#ffffff" stroke="#c0392b"/>
  <text x="790" y="103" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Позиція 3: Перетиснуто (OFF)</text>
  <text x="790" y="127" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">F2 > 15...25 Н (панічний хват)</text>

  <!-- Plunger Assembly 3 (Fully Over-pressed Position) -->
  <line x1="748" y1="136" x2="748" y2="160" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <rect x="765" y="160" width="50" height="18" rx="4" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="790" y1="178" x2="790" y2="265" stroke="#1a1a1a" stroke-width="4"/>
  <!-- Stiff Spring Overcome -->
  <path d="M 775,182 L 805,186 L 775,190 L 805,194 L 775,198 L 805,202 L 790,206" fill="none" stroke="#c0392b" stroke-width="2"/>

  <!-- Contacts 3 (Forced Open by Positive Opening Cam) -->
  <line x1="700" y1="255" x2="735" y2="255" stroke="#c0392b" stroke-width="3"/>
  <circle cx="735" cy="255" r="5" fill="#c0392b"/>
  <line x1="845" y1="255" x2="880" y2="255" stroke="#c0392b" stroke-width="3"/>
  <circle cx="845" cy="255" r="5" fill="#c0392b"/>
  <!-- Mechanical Pusher Wedge -->
  <polygon points="782,242 798,242 790,268" fill="#c0392b" stroke="#1a1a1a" stroke-width="1"/>
  <!-- Forced Open Bridge Below Terminals -->
  <line x1="730" y1="275" x2="850" y2="275" stroke="#c0392b" stroke-width="4"/>

  <!-- Status Badge 3 -->
  <rect x="675" y="295" width="230" height="30" rx="4" fill="#ffffff" stroke="#c0392b"/>
  <text x="790" y="315" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">ПРИМУСОВО РОЗІМКНЕНО</text>

  <!-- Description 3 -->
  <text x="790" y="355" font-size="12" fill="#1a1a1a" text-anchor="middle">Судомне панічне стискання</text>
  <text x="790" y="375" font-size="12" fill="#6b7280" text-anchor="middle">рукоятки пульта до упору</text>
  <text x="790" y="415" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Аварійна зупинка</text>
</svg>
