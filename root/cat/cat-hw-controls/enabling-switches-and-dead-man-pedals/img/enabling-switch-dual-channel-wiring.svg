<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Markers -->
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Двоканальне підключення кнопки дозволу з імпульсним опитуванням</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Схема виявлення міжканальних коротких замикань (Pulse Testing) між каналами CH1 і CH2</text>

  <!-- Left Block: Safety Module -->
  <rect x="30" y="75" width="310" height="385" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="8"/>
  <text x="185" y="100" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Модуль безпеки (Safety Relay)</text>

  <!-- Sub-block 1: Pulse Generator -->
  <rect x="45" y="115" width="280" height="85" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="4"/>
  <text x="185" y="133" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Генератор імпульсів (Pulse Testing)</text>
  <text x="55" y="156" font-size="12" fill="#1a1a1a">Вихід T1 (Тест P1):</text>
  <path d="M 205,156 L 215,156 L 215,144 L 225,144 L 225,156 L 235,156" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <text x="55" y="184" font-size="12" fill="#1a1a1a">Вихід T2 (Тест P2):</text>
  <path d="M 205,184 L 225,184 L 225,172 L 235,172 L 235,184 L 245,184" fill="none" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Sub-block 2: Logic and Inputs -->
  <rect x="45" y="210" width="280" height="110" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="4"/>
  <text x="185" y="228" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Логіка аналізу та моніторингу</text>
  <text x="55" y="252" font-size="12" fill="#1a1a1a">Вхід I1 (Канал CH1)</text>
  <text x="55" y="277" font-size="12" fill="#1a1a1a">Вхід I2 (Канал CH2)</text>
  <text x="185" y="302" font-size="12" fill="#6b7280" text-anchor="middle">Порівняння імпульсів: P1 ≠ P2</text>

  <!-- Sub-block 3: Safety Output Relays -->
  <rect x="45" y="330" width="280" height="115" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="185" y="352" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Виходи безпеки (Safety Relays)</text>
  <text x="185" y="377" font-size="12" fill="#1a1a1a" text-anchor="middle">Дозвіл за відсутності відмов</text>
  <text x="185" y="402" font-size="12" fill="#c0392b" text-anchor="middle">Розмикання при K.Z. чи паніці</text>

  <!-- Right Block: Enabling Switch -->
  <rect x="620" y="75" width="310" height="385" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="8"/>
  <text x="775" y="98" font-size="14" font-weight="700" fill="#2457d6" text-anchor="middle">Пристрій дозволу (Enabling Switch)</text>
  <text x="775" y="118" font-size="12" fill="#27ae60" font-weight="700" text-anchor="middle">Позиція 2 (Нормальна робота / ON)</text>

  <!-- Contact S1 -->
  <rect x="635" y="130" width="270" height="105" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="770" y="150" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Канал 1: Контактний блок S1</text>
  <text x="770" y="170" font-size="12" fill="#27ae60" font-weight="700" text-anchor="middle">Замкнено в Позиції 2</text>
  <circle cx="660" cy="195" r="4" fill="#2457d6"/>
  <circle cx="880" cy="195" r="4" fill="#2457d6"/>
  <line x1="664" y1="195" x2="876" y2="195" stroke="#27ae60" stroke-width="3"/>
  <text x="655" y="222" font-size="12" fill="#6b7280" text-anchor="start">Вхід (T1)</text>
  <text x="885" y="222" font-size="12" fill="#6b7280" text-anchor="end">Вихід (I1)</text>

  <!-- Mechanical Link -->
  <line x1="770" y1="195" x2="770" y2="245" stroke="#2457d6" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="770" y1="277" x2="770" y2="285" stroke="#2457d6" stroke-width="2" stroke-dasharray="4,4"/>
  <rect x="710" y="250" width="120" height="22" fill="#eaf0fd" stroke="#2457d6" rx="3"/>
  <text x="770" y="266" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Спільний штовхач</text>

  <!-- Contact S2 -->
  <rect x="635" y="285" width="270" height="105" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="770" y="305" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Канал 2: Контактний блок S2</text>
  <text x="770" y="325" font-size="12" fill="#27ae60" font-weight="700" text-anchor="middle">Замкнено в Позиції 2</text>
  <circle cx="660" cy="348" r="4" fill="#2457d6"/>
  <circle cx="880" cy="348" r="4" fill="#2457d6"/>
  <line x1="664" y1="348" x2="876" y2="348" stroke="#27ae60" stroke-width="3"/>
  <text x="655" y="375" font-size="12" fill="#6b7280" text-anchor="start">Вхід (T2)</text>
  <text x="885" y="375" font-size="12" fill="#6b7280" text-anchor="end">Вихід (I2)</text>

  <!-- Wiring Connections -->
  <!-- Line CH1 Out (T1 -> S1 In) -->
  <path d="M 325,156 L 656,156" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="405" y="132" width="150" height="20" fill="#ffffff" stroke="#d0d7de" rx="3"/>
  <text x="480" y="146" font-size="12" fill="#2457d6" font-weight="700" text-anchor="middle">Прямий CH1 (T1)</text>

  <!-- Line CH1 Return (S1 Out -> I1) -->
  <path d="M 880,199 L 915,199 L 915,225 L 375,225 L 375,252 L 329,252" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>
  <rect x="405" y="200" width="150" height="20" fill="#ffffff" stroke="#d0d7de" rx="3"/>
  <text x="480" y="214" font-size="12" fill="#1a1a1a" text-anchor="middle">Зворотний CH1 (I1)</text>

  <!-- Line CH2 Out (T2 -> S2 In) -->
  <path d="M 325,184 L 355,184 L 355,348 L 656,348" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="405" y="324" width="150" height="20" fill="#ffffff" stroke="#d0d7de" rx="3"/>
  <text x="480" y="338" font-size="12" fill="#2457d6" font-weight="700" text-anchor="middle">Прямий CH2 (T2)</text>

  <!-- Line CH2 Return (S2 Out -> I2) -->
  <path d="M 880,352 L 915,352 L 915,400 L 365,400 L 365,277 L 329,277" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>
  <rect x="405" y="376" width="150" height="20" fill="#ffffff" stroke="#d0d7de" rx="3"/>
  <text x="480" y="390" font-size="12" fill="#1a1a1a" text-anchor="middle">Зворотний CH2 (I2)</text>

  <!-- Cross Fault Warning Box -->
  <rect x="385" y="260" width="190" height="48" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="5"/>
  <text x="480" y="278" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Захист від K.Z. (Cross-Fault)</text>
  <text x="480" y="296" font-size="12" fill="#1a1a1a" text-anchor="middle">Виявлення короткого між лініями</text>
</svg>
