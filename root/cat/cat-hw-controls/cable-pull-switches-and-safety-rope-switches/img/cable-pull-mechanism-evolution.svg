<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="470" fill="white"/>

  <!-- Header & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Еволюція механізму тросового аварійного вимикача</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Від одностороннього натягу без фіксації до двостороннього пружинного балансу за IEC 60947-5-5</text>

  <!-- Markers -->
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- PANEL 1: Dangerous Primitive Button -->
  <g>
    <rect x="20" y="75" width="295" height="375" rx="8" fill="#fdecea" stroke="#f5c6cb" stroke-width="1.5"/>
    <rect x="35" y="90" width="265" height="28" rx="4" fill="#c0392b"/>
    <text x="167" y="109" text-anchor="middle" fill="white" font-size="13" font-weight="bold">1. Проста кнопка з тросом</text>

    <rect x="35" y="125" width="265" height="22" rx="4" fill="#ffffff" stroke="#c0392b"/>
    <text x="167" y="140" text-anchor="middle" fill="#c0392b" font-size="11" font-weight="bold">НЕБЕЗПЕЧНО · БЕЗ ЗАХИСТУ ВІД ОБРИВУ</text>

    <!-- Schematic 1 -->
    <rect x="45" y="160" width="245" height="110" rx="4" fill="white" stroke="#d0d7de"/>
    <rect x="55" y="180" width="10" height="70" fill="#95a5a6"/>
    <rect x="180" y="190" width="90" height="50" rx="3" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
    <rect x="165" y="208" width="15" height="14" rx="2" fill="#e11d48"/>
    <line x1="65" y1="215" x2="165" y2="215" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arr-red)"/>
    <text x="115" y="205" text-anchor="middle" font-size="11" fill="#475569">Трос натягу</text>
    <text x="225" y="218" text-anchor="middle" font-size="10" font-weight="bold" fill="#991b1b">Лише натяг</text>

    <!-- Bullets 1 -->
    <rect x="35" y="280" width="265" height="155" rx="6" fill="white" stroke="#f5c6cb"/>
    <text x="45" y="298" font-size="12" fill="#1a1a1a">❌ Спрацьовує лише при потягуванні</text>
    <text x="45" y="320" font-size="12" fill="#1a1a1a">❌ Немає засува (latch)</text>
    <text x="45" y="338" font-size="11" fill="#6b7280">  після відпускання контакти замкнені</text>
    <text x="45" y="362" font-size="12" font-weight="bold" fill="#991b1b">❌ Обрив троса незапобіжний:</text>
    <text x="45" y="380" font-size="11" fill="#6b7280">  при обриві або провисанні лінія</text>
    <text x="45" y="398" font-size="11" font-weight="bold" fill="#991b1b">  ПРОДОВЖУЄ ПРАЦЮВАТИ без захисту!</text>
    <text x="45" y="420" font-size="11" fill="#b91c1c">  Заборонено ISO 13850 / IEC 60947</text>
  </g>

  <!-- PANEL 2: Single-Action Latching Switch -->
  <g>
    <rect x="332" y="75" width="295" height="375" rx="8" fill="#eaf0fd" stroke="#b3c7f7" stroke-width="1.5"/>
    <rect x="347" y="90" width="265" height="28" rx="4" fill="#2457d6"/>
    <text x="480" y="109" text-anchor="middle" fill="white" font-size="13" font-weight="bold">2. Односторонній із засувом</text>

    <rect x="347" y="125" width="265" height="22" rx="4" fill="#ffffff" stroke="#2457d6"/>
    <text x="480" y="140" text-anchor="middle" fill="#2457d6" font-size="11" font-weight="bold">ЧАСТКОВИЙ ЗАХИСТ · Є RESET</text>

    <!-- Schematic 2 -->
    <rect x="357" y="160" width="245" height="110" rx="4" fill="white" stroke="#d0d7de"/>
    <rect x="367" y="180" width="10" height="70" fill="#95a5a6"/>
    <rect x="492" y="185" width="95" height="60" rx="3" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
    <rect x="525" y="170" width="30" height="15" rx="3" fill="#2457d6"/>
    <text x="540" y="181" text-anchor="middle" font-size="10" fill="white" font-weight="bold">Reset</text>
    <path d="M477 215 L492 215 L492 205 L482 205 Z" fill="#2457d6"/>
    <line x1="377" y1="215" x2="477" y2="215" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arr-blue)"/>
    <text x="427" y="205" text-anchor="middle" font-size="11" fill="#475569">Трос натягу</text>
    <text x="540" y="225" text-anchor="middle" font-size="10" font-weight="bold" fill="#1e40af">Засув (latch)</text>

    <!-- Bullets 2 -->
    <rect x="347" y="280" width="265" height="155" rx="6" fill="white" stroke="#b3c7f7"/>
    <text x="357" y="298" font-size="12" fill="#1a1a1a">✔ Зафіксовує стан після потягування</text>
    <text x="357" y="320" font-size="12" fill="#1a1a1a">✔ Вимагає ручного скидання (Reset)</text>
    <text x="357" y="348" font-size="12" font-weight="bold" fill="#c2410c">❌ Проблема обриву не розв'язана:</text>
    <text x="357" y="368" font-size="11" fill="#6b7280">  якщо трос перетерся або послаб,</text>
    <text x="357" y="386" font-size="11" fill="#6b7280">  механізм НЕ реагує й залишає</text>
    <text x="357" y="404" font-size="11" font-weight="bold" fill="#c2410c">  лінію без аварійного вимикача!</text>
    <text x="357" y="422" font-size="11" fill="#9a3412">  Не відповідає вимогам SIL 2 / Cat 3</text>
  </g>

  <!-- PANEL 3: Modern Dual-Action Balanced Mechanism -->
  <g>
    <rect x="645" y="75" width="295" height="375" rx="8" fill="#e9f7ef" stroke="#a3e4d7" stroke-width="1.5"/>
    <rect x="660" y="90" width="265" height="28" rx="4" fill="#27ae60"/>
    <text x="792" y="109" text-anchor="middle" fill="white" font-size="13" font-weight="bold">3. Двосторонній пружинний баланс</text>

    <rect x="660" y="125" width="265" height="22" rx="4" fill="#ffffff" stroke="#27ae60"/>
    <text x="792" y="140" text-anchor="middle" fill="#27ae60" font-size="11" font-weight="bold">ПОВНИЙ ЗАХИСТ · СТАНДАРТ IEC 60947-5-5</text>

    <!-- Schematic 3 -->
    <rect x="670" y="160" width="245" height="110" rx="4" fill="white" stroke="#d0d7de"/>
    <rect x="680" y="167" width="75" height="18" rx="2" fill="#f8fafc" stroke="#94a3b8"/>
    <rect x="683" y="170" width="20" height="12" fill="#ef4444"/>
    <rect x="707" y="170" width="21" height="12" fill="#22c55e"/>
    <rect x="732" y="170" width="20" height="12" fill="#ef4444"/>
    <text x="717" y="197" text-anchor="middle" font-size="10" fill="#475569">Вікно натягу</text>

    <path d="M765 215 Q770 207 775 215 T785 215 T795 215" fill="none" stroke="#2563eb" stroke-width="2"/>
    <line x1="680" y1="215" x2="840" y2="215" stroke="#1e293b" stroke-width="2.5"/>
    <polygon points="800,205 810,215 800,225 790,215" fill="#15803d"/>
    <rect x="797" y="185" width="6" height="20" fill="#b91c1c"/>
    <circle cx="800" cy="175" r="8" fill="#27ae60"/>
    <line x1="840" y1="215" x2="905" y2="215" stroke="#1e293b" stroke-width="2.5" marker-end="url(#arr-green)"/>
    <text x="792" y="260" text-anchor="middle" font-size="10" font-weight="bold" fill="#15803d">Баланс пружин та V-кулачок</text>

    <!-- Bullets 3 -->
    <rect x="660" y="280" width="265" height="155" rx="6" fill="white" stroke="#a3e4d7"/>
    <text x="670" y="298" font-size="12" font-weight="bold" fill="#15803d">✔ Спрацьовує при ПОТЯГУВАННІ троса</text>
    <text x="670" y="320" font-size="12" font-weight="bold" fill="#15803d">✔ Спрацьовує при ОБРИВІ чи ПОСЛАБЛЕННІ</text>
    <text x="670" y="344" font-size="11" fill="#1a1a1a">✔ Двостороння фіксація засувом (latch)</text>
    <text x="670" y="364" font-size="11" fill="#1a1a1a">✔ Примусове розмикання NC-контактів</text>
    <text x="670" y="384" font-size="11" fill="#1a1a1a">✔ Огляд вікна юстування робочого натягу</text>
    <text x="670" y="412" font-size="11" font-weight="bold" fill="#15803d">Відповідає ISO 13850 / Cat 4 / SIL 3</text>
  </g>
</svg>
