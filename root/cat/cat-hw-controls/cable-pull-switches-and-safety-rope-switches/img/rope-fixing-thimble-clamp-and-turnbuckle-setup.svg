<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Монтажна схема вузла кріплення та натягу троса</text>
  <text x="480" y="52" font-size="13" text-anchor="middle" fill="#6b7280">Закладання троса в коуш, дуплексні затискачі та підключення талрепа з пружиною</text>

  <!-- ПАНЕЛЬ 1: Кінематична схема вузла -->
  <rect x="30" y="75" width="435" height="445" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247" y="100" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">1. Кінематична схема вузла натягу</text>
  <text x="247" y="118" font-size="12" text-anchor="middle" fill="#6b7280">Послідовне з'єднання елементів силової лінії</text>

  <!-- Схема елементів Панелі 1 -->
  <!-- Стіна / Анкер -->
  <rect x="50" y="160" width="12" height="120" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="62" y1="220" x2="68" y2="220" stroke="#1a1a1a" stroke-width="4"/>
  <circle cx="80" cy="220" r="12" fill="none" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Пружина -->
  <path d="M 92 220 L 100 220 L 105 208 L 115 232 L 125 208 L 135 232 L 145 208 L 155 232 L 160 220 L 168 220" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Талреп -->
  <line x1="168" y1="220" x2="200" y2="220" stroke="#1a1a1a" stroke-width="3"/>
  <rect x="200" y="210" width="60" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <rect x="215" y="214" width="30" height="12" rx="2" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="260" y1="220" x2="292" y2="220" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Стрілка регулювання талрепа -->
  <path d="M 215 198 L 245 198" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="230" y="192" font-size="11" text-anchor="middle" fill="#2457d6">Регулювання</text>

  <!-- Вузол коуша і затискачів (схематично) -->
  <circle cx="304" cy="220" r="10" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
  <rect x="330" y="212" width="12" height="16" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="355" y="212" width="12" height="16" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="314" y1="215" x2="425" y2="215" stroke="#c0392b" stroke-width="4"/>
  <line x1="314" y1="225" x2="380" y2="225" stroke="#c0392b" stroke-width="4"/>

  <!-- Маркери точок 1-4 -->
  <circle cx="80" cy="265" r="11" fill="#2457d6"/>
  <text x="80" y="269" font-size="11" font-weight="bold" fill="white" text-anchor="middle">1</text>
  <text x="80" y="292" font-size="11" text-anchor="middle" fill="#1a1a1a">Анкер</text>

  <circle cx="130" cy="265" r="11" fill="#2457d6"/>
  <text x="130" y="269" font-size="11" font-weight="bold" fill="white" text-anchor="middle">2</text>
  <text x="130" y="292" font-size="11" text-anchor="middle" fill="#1a1a1a">Пружина</text>

  <circle cx="230" cy="265" r="11" fill="#2457d6"/>
  <text x="230" y="269" font-size="11" font-weight="bold" fill="white" text-anchor="middle">3</text>
  <text x="230" y="292" font-size="11" text-anchor="middle" fill="#1a1a1a">Талреп M6</text>

  <circle cx="345" cy="265" r="11" fill="#2457d6"/>
  <text x="345" y="269" font-size="11" font-weight="bold" fill="white" text-anchor="middle">4</text>
  <text x="345" y="292" font-size="11" text-anchor="middle" fill="#1a1a1a">Коуш / Затискачі</text>

  <!-- Інформаційний блок Панелі 1 -->
  <rect x="45" y="325" width="405" height="180" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="60" y="348" font-size="13" font-weight="bold" fill="#1a1a1a">Принцип дії вузла натягу:</text>
  <text x="60" y="373" font-size="12" fill="#1a1a1a">1. Анкер або очко вимикача сприймає натяг лінії</text>
  <text x="60" y="395" font-size="12" fill="#1a1a1a">2. Пружина запобігає хибним спрацьовуванням від вібрацій</text>
  <text x="60" y="417" font-size="12" fill="#1a1a1a">3. Талреп налаштовує точний натяг троса в зелену зону</text>
  <text x="60" y="439" font-size="12" fill="#1a1a1a">4. Вузол коуша гарантує надійне закладання без зламу</text>
  <text x="60" y="461" font-size="12" fill="#1a1a1a">5. Червона ПВХ-оболонка захищає трос від корозії</text>

  <!-- ПАНЕЛЬ 2: Конструкція петлі з коушем -->
  <rect x="495" y="75" width="435" height="445" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="712" y="100" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">2. Конструкція петлі з коушем і затискачами</text>
  <text x="712" y="118" font-size="12" text-anchor="middle" fill="#6b7280">Правила монтажу дуплексних затискачів</text>

  <!-- Деталізований коуш та трос -->
  <path d="M 580 190 C 540 190 535 220 535 220 C 535 220 540 250 580 250 L 595 240 L 595 200 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <path d="M 575 202 C 550 202 547 220 547 220 C 547 220 550 238 575 238 L 585 230 L 585 210 Z" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M 510 220 L 545 220" stroke="#1a1a1a" stroke-width="6"/>
  <circle cx="510" cy="220" r="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Основна гілка троса (згори) -->
  <path d="M 595 200 L 910 200" stroke="#c0392b" stroke-width="5" fill="none"/>
  <!-- Вільний кінець троса (знизу) -->
  <path d="M 595 240 L 820 240" stroke="#c0392b" stroke-width="5" fill="none"/>

  <!-- Дуплексний затискач 1 -->
  <rect x="652" y="188" width="24" height="64" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="657" y="180" width="14" height="8" rx="1" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="657" y="252" width="14" height="8" rx="1" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="652" y1="220" x2="676" y2="220" stroke="#d0d7de" stroke-width="2"/>

  <!-- Дуплексний затискач 2 -->
  <rect x="742" y="188" width="24" height="64" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="747" y="180" width="14" height="8" rx="1" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="747" y="252" width="14" height="8" rx="1" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="742" y1="220" x2="766" y2="220" stroke="#d0d7de" stroke-width="2"/>

  <!-- Розмірні лінії відстаней -->
  <line x1="595" y1="275" x2="652" y2="275" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
  <line x1="595" y1="248" x2="595" y2="282" stroke="#2457d6" stroke-dasharray="2,2" stroke-width="1"/>
  <line x1="652" y1="248" x2="652" y2="282" stroke="#2457d6" stroke-dasharray="2,2" stroke-width="1"/>
  <text x="623" y="293" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">~2×D</text>

  <line x1="676" y1="275" x2="742" y2="275" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
  <line x1="676" y1="248" x2="676" y2="282" stroke="#2457d6" stroke-dasharray="2,2" stroke-width="1"/>
  <line x1="742" y1="248" x2="742" y2="282" stroke="#2457d6" stroke-dasharray="2,2" stroke-width="1"/>
  <text x="709" y="293" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">3–4×D</text>

  <line x1="766" y1="275" x2="820" y2="275" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
  <line x1="766" y1="248" x2="766" y2="282" stroke="#2457d6" stroke-dasharray="2,2" stroke-width="1"/>
  <line x1="820" y1="248" x2="820" y2="282" stroke="#2457d6" stroke-dasharray="2,2" stroke-width="1"/>
  <text x="793" y="293" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">≥50 мм</text>

  <!-- Виносні підписи елементів Панелі 2 -->
  <text x="910" y="188" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Основна гілка троса</text>
  <text x="830" y="244" font-size="12" fill="#6b7280" text-anchor="start">Вільний кінець</text>

  <text x="560" y="152" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Сталевий коуш</text>
  <path d="M 560 156 L 560 182" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <text x="709" y="152" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Затискачі дуплекс (2 шт.)</text>
  <path d="M 685 156 L 664 176" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 733 156 L 754 176" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Інформаційний блок Панелі 2 -->
  <rect x="510" y="325" width="405" height="180" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="525" y="348" font-size="13" font-weight="bold" fill="#1a1a1a">Вимоги до монтажу коуша та затискачів:</text>
  <text x="525" y="373" font-size="12" fill="#27ae60">✔ Коуш захищає трос від неприпустимого перегину</text>
  <text x="525" y="395" font-size="12" fill="#27ae60">✔ Застосовувати МІНІМУМ 2 дуплексні затискачі</text>
  <text x="525" y="417" font-size="12" fill="#27ae60">✔ Відстань між затискачами становить 3–4 діаметри троса D</text>
  <text x="525" y="439" font-size="12" fill="#c0392b">✖ ЗАБОРОНЕНО формувати петлю без металевого коуша</text>
  <text x="525" y="461" font-size="12" fill="#c0392b">✖ ЗАБОРОНЕНО використовувати лише один затискач</text>
</svg>
