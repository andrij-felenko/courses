<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-left" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>

  <!-- Title & Subtitle -->
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Монтаж та двоканальне підключення тросового вимикача безпеки</text>
  <text x="480" y="48" text-anchor="middle" font-size="13" fill="#6b7280">Механічні вузли траси (люнети, талреп, демпфер) та електричне з'єднання 2×NC з реле безпеки</text>

  <!-- ==================== PANEL 1: MECHANICAL CONVEYOR SYSTEM ==================== -->
  <rect x="30" y="68" width="900" height="215" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="50" y="91" font-size="14" font-weight="bold" fill="#2457d6">Механічне розташування вузлів тросової траси (до 75 м)</text>

  <!-- Left Rigid Anchor -->
  <path d="M 55 115 L 70 115 L 70 225 L 55 225 Z" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="62" y="242" text-anchor="middle" font-size="12" fill="#6b7280">Анкер</text>

  <!-- Damping Spring -->
  <path d="M 70 165 L 80 165 L 85 155 L 95 175 L 105 155 L 115 175 L 125 155 L 135 175 L 140 165 L 150 165" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <text x="110" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Демпферна пружина</text>
  <text x="110" y="212" text-anchor="middle" font-size="12" fill="#6b7280">(гасіння вібрацій)</text>

  <!-- Turnbuckle -->
  <path d="M 180 165 L 205 165 M 205 157 L 270 157 L 270 173 L 205 173 Z M 237 157 L 237 173 M 270 165 L 285 165" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="237" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Талреп (юстування)</text>
  <text x="237" y="212" text-anchor="middle" font-size="12" fill="#6b7280">(регулювання натягу)</text>

  <!-- Main Cable Rope -->
  <line x1="285" y1="165" x2="710" y2="165" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Eyebolt 1 -->
  <circle cx="390" cy="165" r="8" fill="none" stroke="#2457d6" stroke-width="2"/>
  <path d="M 390 173 L 390 220 M 380 220 L 400 220" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="390" y="236" text-anchor="middle" font-size="12" fill="#1a1a1a">Люнет 1</text>

  <!-- Eyebolt 2 -->
  <circle cx="560" cy="165" r="8" fill="none" stroke="#2457d6" stroke-width="2"/>
  <path d="M 560 173 L 560 220 M 550 220 L 570 220" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="560" y="236" text-anchor="middle" font-size="12" fill="#1a1a1a">Люнет 2</text>

  <!-- Eyebolt Spacing Dimension -->
  <line x1="390" y1="135" x2="560" y2="135" stroke="#6b7280" stroke-width="1.5" marker-start="url(#arr-left)" marker-end="url(#arr)"/>
  <text x="475" y="127" text-anchor="middle" font-size="12" fill="#6b7280">Крок між люнетами ≤ 2.5–3.0 м</text>

  <!-- Pull Action Force -->
  <path d="M 475 165 L 475 188" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="475" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Потягування F &gt; 100 Н</text>

  <!-- Cable Pull Switch Enclosure -->
  <path d="M 710 115 L 840 115 L 840 230 L 710 230 Z" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="775" y="136" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Тросовий вимикач</text>

  <!-- Inspection Window inside Switch -->
  <path d="M 735 148 L 815 148 L 815 178 L 735 178 Z" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="775" y="167" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">ВІКНО: [ OK ]</text>

  <!-- Reset Knob -->
  <path d="M 760 93 L 790 93 L 790 115 L 760 115 Z" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="775" y="87" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">RESET (скидання)</text>
  <text x="775" y="246" text-anchor="middle" font-size="12" fill="#6b7280">IEC 60947-5-5</text>

  <!-- Right Support Anchor -->
  <path d="M 855 115 L 870 115 L 870 225 L 855 225 Z" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="862" y="242" text-anchor="middle" font-size="12" fill="#6b7280">Опора</text>


  <!-- ==================== PANEL 2: ELECTRICAL WIRING DIAGRAM (2xNC) ==================== -->
  <rect x="30" y="300" width="900" height="225" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="50" y="323" font-size="14" font-weight="bold" fill="#27ae60">Електрична двоканальна схема підключення (2×NC) до реле безпеки</text>

  <!-- Switch Terminals Box -->
  <path d="M 60 340 L 320 340 L 320 505 L 60 505 Z" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="190" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Контакти вимикача (2×NC)</text>

  <!-- Channel 1 NC (11 - 12) -->
  <text x="70" y="394" font-size="12" font-weight="bold" fill="#1a1a1a">Канал 1:</text>
  <circle cx="140" cy="390" r="4" fill="#2457d6"/>
  <text x="140" y="410" text-anchor="middle" font-size="12" fill="#6b7280">11 (NC1_in)</text>

  <line x1="144" y1="390" x2="220" y2="382" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="225" cy="390" r="4" fill="#2457d6"/>
  <text x="225" y="410" text-anchor="middle" font-size="12" fill="#6b7280">12 (NC1_out)</text>

  <text x="182" y="376" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">→ (примусове розмикання)</text>

  <!-- Channel 2 NC (21 - 22) -->
  <text x="70" y="454" font-size="12" font-weight="bold" fill="#1a1a1a">Канал 2:</text>
  <circle cx="140" cy="450" r="4" fill="#2457d6"/>
  <text x="140" y="470" text-anchor="middle" font-size="12" fill="#6b7280">21 (NC2_in)</text>

  <line x1="144" y1="450" x2="220" y2="442" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="225" cy="450" r="4" fill="#2457d6"/>
  <text x="225" y="470" text-anchor="middle" font-size="12" fill="#6b7280">22 (NC2_out)</text>

  <text x="190" y="496" text-anchor="middle" font-size="12" fill="#c0392b">Механічний засув (latch) заклинює 11-12 та 21-22</text>

  <!-- Wiring Lines between Switch Terminals and Safety Relay -->
  <path d="M 320 390 L 590 390" stroke="#c0392b" stroke-width="2"/>
  <path d="M 320 410 L 590 410" stroke="#2457d6" stroke-width="2"/>
  <path d="M 320 450 L 590 450" stroke="#c0392b" stroke-width="2"/>
  <path d="M 320 470 L 590 470" stroke="#2457d6" stroke-width="2"/>

  <!-- Wire Annotations -->
  <text x="455" y="384" text-anchor="middle" font-size="12" fill="#c0392b">Тестові імпульси S11 (Канал 1)</text>
  <text x="455" y="444" text-anchor="middle" font-size="12" fill="#c0392b">Тестові імпульси S21 (Канал 2, зсув фази)</text>

  <!-- Safety Relay Module Box -->
  <path d="M 590 340 L 900 340 L 900 505 L 590 505 Z" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="745" y="358" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Модуль реле безпеки (Cat 4 / SIL 3)</text>

  <!-- Relay Terminal Indicators -->
  <circle cx="610" cy="390" r="4" fill="#27ae60"/>
  <text x="622" y="394" font-size="12" font-weight="bold" fill="#1a1a1a">S11</text>

  <circle cx="610" cy="410" r="4" fill="#27ae60"/>
  <text x="622" y="414" font-size="12" font-weight="bold" fill="#1a1a1a">S12</text>

  <circle cx="610" cy="450" r="4" fill="#27ae60"/>
  <text x="622" y="454" font-size="12" font-weight="bold" fill="#1a1a1a">S21</text>

  <circle cx="610" cy="470" r="4" fill="#27ae60"/>
  <text x="622" y="474" font-size="12" font-weight="bold" fill="#1a1a1a">S22</text>

  <!-- Relay Logic and EDM Box -->
  <path d="M 665 375 L 885 375 L 885 490 L 665 490 Z" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="775" y="396" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Логіка моніторингу та EDM</text>
  <text x="775" y="418" text-anchor="middle" font-size="12" fill="#6b7280">Виявлення зварювання K1/K2</text>

  <path d="M 700 435 L 850 435 L 850 475 L 700 475 Z" fill="#2457d6" rx="4"/>
  <text x="775" y="460" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Вихід живлення K1 / K2</text>

  <!-- Footer Caption -->
  <text x="480" y="545" text-anchor="middle" font-size="12" fill="#6b7280">Двоканальне опитування 2×NC з асинхронними імпульсами S11/S21 унеможливлює небезпечні відмови при обриві чи короткому замиканні</text>
</svg>
