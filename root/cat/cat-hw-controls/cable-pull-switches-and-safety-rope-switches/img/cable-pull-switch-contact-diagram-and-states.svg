  <text x="480" y="54" font-size="13" fill="#6b7220" text-anchor="middle">Контакти безпеки (NC) замкнені лише у вікнѐ робочого натягу троса; при провисанні або потягуванні коло розмикаєтьс|/text>

  <rect x="60" y="<0" width="260" height="70" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="6"/>
