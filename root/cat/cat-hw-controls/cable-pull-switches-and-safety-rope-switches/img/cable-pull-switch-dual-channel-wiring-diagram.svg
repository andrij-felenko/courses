<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="530" fill="white"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Двоканальна схема підключення тросового вимикача до Safety PLC</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Тестові імпульси контролера виявляють обрив лінії та перехресне замикання між каналами</text>

  <!-- ================= LEFT PANEL: SAFETY PLC ================= -->
  <rect x="30" y="75" width="360" height="330" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="30" y="75" width="360" height="36" rx="8" fill="#2457d6"/>
  <text x="210" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="white">МОДУЛЬ БЕЗПЕКИ (SAFETY PLC / РЕЛЕ)</text>

  <!-- Internal Logic Box -->
  <rect x="45" y="125" width="330" height="95" rx="6" fill="white" stroke="#2457d6" stroke-width="1"/>
  <text x="210" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Генератор імпульсів та діагностика</text>
  <text x="210" y="164" text-anchor="middle" font-size="12" fill="#6b7280">Канал A (Т1): Тестові імпульси фази 1</text>
  <text x="210" y="183" text-anchor="middle" font-size="12" fill="#6b7280">Канал B (Т2): Тестові імпульси фази 2</text>
  <text x="210" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Рівень безпеки: PL d / PL e (ISO 13849-1)</text>

  <!-- Terminals on Safety PLC -->
  <circle cx="390" cy="245" r="7" fill="#2457d6"/>
  <text x="370" y="236" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">T1 (Вихід A)</text>

  <circle cx="390" cy="285" r="7" fill="#2457d6"/>
  <text x="370" y="276" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">I1 (Вхід A)</text>

  <circle cx="390" cy="335" r="7" fill="#27ae60"/>
  <text x="370" y="326" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">T2 (Вихід B)</text>

  <circle cx="390" cy="375" r="7" fill="#27ae60"/>
  <text x="370" y="366" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">I2 (Вхід B)</text>

  <!-- ================= RIGHT PANEL: CABLE-PULL SWITCH ================= -->
  <rect x="570" y="75" width="360" height="330" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="570" y="75" width="360" height="36" rx="8" fill="#475569"/>
  <text x="750" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="white">ТРОСОВИЙ ВИМИКАЧ (CABLE-PULL SWITCH)</text>

  <!-- Mechanical Cam Link Shaft -->
  <line x1="750" y1="140" x2="750" y2="395" stroke="#6b7280" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="750" y="133" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="bold">Механічна зчіпка кулачка</text>
  <text x="750" y="398" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="bold">Примусове розмикання</text>

  <!-- Terminals on Cable Pull Switch -->
  <circle cx="570" cy="245" r="7" fill="#2457d6"/>
  <text x="585" y="236" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">11 (NC1)</text>

  <circle cx="570" cy="285" r="7" fill="#2457d6"/>
  <text x="585" y="276" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">12 (NC1)</text>

  <circle cx="570" cy="335" r="7" fill="#27ae60"/>
  <text x="585" y="326" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">21 (NC2)</text>

  <circle cx="570" cy="375" r="7" fill="#27ae60"/>
  <text x="585" y="366" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">22 (NC2)</text>

  <!-- Contact Pair 1 (NC1) -->
  <line x1="570" y1="245" x2="680" y2="245" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="680" y1="245" x2="680" y2="258" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="570" y1="285" x2="730" y2="285" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="730" y1="285" x2="730" y2="258" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="680" cy="258" r="4" fill="#2457d6"/>
  <circle cx="730" cy="258" r="4" fill="#2457d6"/>
  <rect x="675" y="256" width="60" height="4" fill="#2457d6"/>
  <text x="705" y="235" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">NC1 (11–12)</text>

  <!-- Contact Pair 2 (NC2) -->
  <line x1="570" y1="335" x2="780" y2="335" stroke="#27ae60" stroke-width="2.5"/>
  <line x1="780" y1="335" x2="780" y2="348" stroke="#27ae60" stroke-width="2.5"/>
  <line x1="570" y1="375" x2="830" y2="375" stroke="#27ae60" stroke-width="2.5"/>
  <line x1="830" y1="375" x2="830" y2="348" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="780" cy="348" r="4" fill="#27ae60"/>
  <circle cx="830" cy="348" r="4" fill="#27ae60"/>
  <rect x="775" y="346" width="60" height="4" fill="#27ae60"/>
  <text x="805" y="325" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">NC2 (21–22)</text>

  <!-- ================= INTERCONNECTION LINES ================= -->
  <!-- Wire 1 (T1 -> 11) -->
  <line x1="390" y1="245" x2="570" y2="245" stroke="#2457d6" stroke-width="2.5"/>
  <path d="M 405 245 h 6 v -8 h 8 v 8 h 10 v -8 h 8 v 8 h 6" stroke="#2457d6" stroke-width="1.5" fill="none"/>
  <text x="430" y="234" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Тест A (T1)</text>

  <!-- Wire 2 (12 -> I1) -->
  <line x1="570" y1="285" x2="390" y2="285" stroke="#2457d6" stroke-width="2.5"/>
  <text x="430" y="274" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Сигнал A (I1)</text>

  <!-- Cross-Fault Diagnostic Indicator -->
  <line x1="515" y1="285" x2="515" y2="298" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="515" y1="322" x2="515" y2="335" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <rect x="455" y="298" width="120" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="515" y="314" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Перехресне замикання</text>

  <!-- Wire 3 (T2 -> 21) -->
  <line x1="390" y1="335" x2="570" y2="335" stroke="#27ae60" stroke-width="2.5"/>
  <path d="M 405 335 h 6 v -8 h 8 v 8 h 10 v -8 h 8 v 8 h 6" stroke="#27ae60" stroke-width="1.5" fill="none"/>
  <text x="430" y="324" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Тест B (T2)</text>

  <!-- Wire 4 (22 -> I2) -->
  <line x1="570" y1="375" x2="390" y2="375" stroke="#27ae60" stroke-width="2.5"/>
  <text x="430" y="364" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Сигнал B (I2)</text>

  <!-- ================= FEATURE CARDS AT BOTTOM ================= -->
  <!-- Box 1 -->
  <rect x="30" y="420" width="280" height="60" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="170" y="442" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Канал 1: NC1 (11–12)</text>
  <text x="170" y="462" text-anchor="middle" font-size="11" fill="#1a1a1a">Контроль відмикання та обриву лінії A</text>

  <!-- Box 2 -->
  <rect x="340" y="420" width="280" height="60" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="480" y="442" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Перехресний моніторинг</text>
  <text x="480" y="462" text-anchor="middle" font-size="11" fill="#1a1a1a">Зсув фаз T1/T2 виявляє коротке замикання</text>

  <!-- Box 3 -->
  <rect x="650" y="420" width="280" height="60" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="790" y="442" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Канал 2: NC2 (21–22)</text>
  <text x="790" y="462" text-anchor="middle" font-size="11" fill="#1a1a1a">Контроль відмикання та обриву лінії B</text>

  <!-- Footnote -->
  <text x="480" y="508" text-anchor="middle" font-size="12" fill="#6b7280">Двоканальна комутація з рознесенням фаз імпульсів відповідає вимогам категорій PL d / PL e за ISO 13849-1</text>
</svg>
