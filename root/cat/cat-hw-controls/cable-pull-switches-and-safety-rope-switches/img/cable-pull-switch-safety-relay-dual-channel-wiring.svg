<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Header -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Двоканальне підключення тросового вимикача до реле безпеки</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Тестові імпульси T1/T2 виявляють перехресне замикання між каналами S11–S12 та S21–S22 (PL e)</text>

  <!-- Left Panel: Safety Relay -->
  <rect x="40" y="85" width="350" height="440" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <rect x="40" y="85" width="350" height="36" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="215" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Модуль реле безпеки (Safety Relay)</text>

  <!-- Test Generator Block -->
  <rect x="60" y="135" width="310" height="75" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="215" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Генератор тестових імпульсів</text>
  <rect x="75" y="168" width="130" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="140" y="187" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">T1 (Імпульс P1)</text>
  <rect x="225" y="168" width="130" height="30" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="290" y="187" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">T2 (Імпульс P2)</text>

  <!-- Logic & Cross-fault Monitor -->
  <rect x="60" y="225" width="310" height="150" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="215" y="247" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Монітор перехресного замикання</text>

  <rect x="75" y="260" width="130" height="40" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="140" y="278" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Вхід S12 (Канал 1)</text>
  <text x="140" y="293" text-anchor="middle" font-size="11" fill="#2457d6">Очікує імпульс P1</text>

  <rect x="225" y="260" width="130" height="40" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="290" y="278" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Вхід S22 (Канал 2)</text>
  <text x="290" y="293" text-anchor="middle" font-size="11" fill="#c0392b">Очікує імпульс P2</text>

  <rect x="75" y="312" width="280" height="48" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="215" y="331" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Режим нормальної роботи (PL e):</text>
  <text x="215" y="348" text-anchor="middle" font-size="11" fill="#1a1a1a">Різні фази P1 ≠ P2 запобігають шунтуванню</text>

  <!-- Relay Terminals -->
  <circle cx="360" cy="400" r="13" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="360" y="404" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">T1</text>

  <circle cx="360" cy="435" r="13" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="360" y="439" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">S12</text>

  <circle cx="360" cy="470" r="13" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="360" y="474" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">T2</text>

  <circle cx="360" cy="505" r="13" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="360" y="509" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">S22</text>

  <!-- Right Panel: Cable Pull Switch -->
  <rect x="570" y="85" width="350" height="440" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <rect x="570" y="85" width="350" height="36" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="745" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Тросовий вимикач (IEC 60947-5-5)</text>

  <!-- Switch Mechanism Box -->
  <rect x="590" y="135" width="310" height="75" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="745" y="157" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Кулачково-пружинний механізм</text>
  <rect x="605" y="168" width="280" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="745" y="187" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Трос натягнуто: контакти 11-12 та 21-22 замкнуті</text>

  <!-- Contact Block 2NC -->
  <rect x="590" y="225" width="310" height="280" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="745" y="247" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Блок контактів примусового розмикання</text>

  <!-- Channel 1 Contacts inside Switch -->
  <circle cx="600" cy="400" r="13" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="600" y="404" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">11</text>

  <circle cx="600" cy="435" r="13" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="600" y="439" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">12</text>

  <!-- NC1 Graphic -->
  <line x1="620" y1="400" x2="650" y2="400" stroke="#2457d6" stroke-width="2"/>
  <line x1="620" y1="435" x2="650" y2="435" stroke="#2457d6" stroke-width="2"/>
  <line x1="650" y1="395" x2="650" y2="440" stroke="#2457d6" stroke-width="2.5"/>
  <text x="745" y="421" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">NC1 (Канал 1: 11 – 12)</text>

  <!-- Channel 2 Contacts inside Switch -->
  <circle cx="600" cy="470" r="13" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="600" y="474" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">21</text>

  <circle cx="600" cy="505" r="13" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="600" y="509" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">22</text>

  <!-- NC2 Graphic -->
  <line x1="620" y1="470" x2="650" y2="470" stroke="#c0392b" stroke-width="2"/>
  <line x1="620" y1="505" x2="650" y2="505" stroke="#c0392b" stroke-width="2"/>
  <line x1="650" y1="465" x2="650" y2="510" stroke="#c0392b" stroke-width="2.5"/>
  <text x="745" y="491" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">NC2 (Канал 2: 21 – 22)</text>

  <!-- Mechanical Coupling Bar -->
  <line x1="660" y1="400" x2="660" y2="505" stroke="#6b7280" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="675" y="456" text-anchor="start" font-size="11" fill="#6b7280">Спільний штовхач</text>

  <!-- Middle Interconnecting Wires -->
  <path d="M 373,400 L 587,400" stroke="#2457d6" stroke-width="2.5" fill="none" marker-end="url(#arr-blue)"/>
  <text x="380" y="392" text-anchor="start" font-size="11" font-weight="bold" fill="#2457d6">T1 (Тест P1)</text>

  <path d="M 587,435 L 373,435" stroke="#2457d6" stroke-width="2.5" fill="none" marker-end="url(#arr-blue)"/>
  <text x="380" y="427" text-anchor="start" font-size="11" font-weight="bold" fill="#2457d6">S12 (Канал 1)</text>

  <path d="M 373,470 L 587,470" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arr-red)"/>
  <text x="380" y="462" text-anchor="start" font-size="11" font-weight="bold" fill="#c0392b">T2 (Тест P2)</text>

  <path d="M 587,505 L 373,505" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arr-red)"/>
  <text x="380" y="497" text-anchor="start" font-size="11" font-weight="bold" fill="#c0392b">S22 (Канал 2)</text>

  <!-- Fault Box / Cross-Short Circuit Annotation -->
  <rect x="445" y="270" width="130" height="90" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="510" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Перехресне KЗ</text>
  <text x="510" y="307" text-anchor="middle" font-size="10" fill="#1a1a1a">Пошкодження кабелю</text>
  <text x="510" y="324" text-anchor="middle" font-size="10" fill="#c0392b">P1 потрапляє на S22</text>
  <text x="510" y="341" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">➔ Відключення PL e</text>

  <!-- Fault Dashed Line pointing to wires -->
  <line x1="510" y1="360" x2="510" y2="470" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="510" cy="435" r="4" fill="#c0392b"/>
  <circle cx="510" cy="470" r="4" fill="#c0392b"/>

</svg>
