<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Цокольовка та принципові схеми рокерних перемикачів</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Конфігурації 3-pin SPST, 4-pin DPST та 6-pin DPDT з картографією клем та схемотехнікою підсвічування</text>

  <!-- ==================== COLUMN 1: 3-PIN SPST ==================== -->
  <rect x="30" y="75" width="280" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  
  <!-- Badge -->
  <rect x="45" y="87" width="250" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="170" y="104" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">3-Pin SPST (З підсвічуванням)</text>

  <!-- Section 1: Pinout -->
  <text x="45" y="130" font-size="12" font-weight="bold" fill="#1a1a1a">Цокольовка клем (Faston 6.3 мм):</text>
  <rect x="55" y="140" width="230" height="72" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  
  <!-- Terminal 1 -->
  <rect x="70" y="152" width="55" height="22" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="97" y="167" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">1 (L_in)</text>
  <text x="97" y="195" font-size="12" fill="#6b7280" text-anchor="middle">Вхід (L)</text>

  <!-- Terminal 2 -->
  <rect x="142" y="152" width="55" height="22" rx="2" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="169" y="167" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">2 (Load)</text>
  <text x="169" y="195" font-size="12" fill="#6b7280" text-anchor="middle">Навантаж.</text>

  <!-- Terminal 3 -->
  <rect x="215" y="152" width="55" height="22" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="242" y="167" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">3 (N)</text>
  <text x="242" y="195" font-size="12" fill="#6b7280" text-anchor="middle">Нуль (N)</text>

  <!-- Section 2: Schematic -->
  <text x="45" y="228" font-size="12" font-weight="bold" fill="#1a1a1a">Схема підключення навантаження:</text>
  <rect x="45" y="238" width="250" height="155" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  
  <!-- Line L_in -->
  <line x1="55" y1="270" x2="90" y2="270" stroke="#2457d6" stroke-width="2"/>
  <circle cx="90" cy="270" r="3" fill="#2457d6"/>
  <text x="55" y="262" font-size="12" font-weight="bold" fill="#2457d6">1(L)</text>

  <!-- Contact Lever -->
  <line x1="90" y1="270" x2="130" y2="255" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="135" cy="270" r="3" fill="#27ae60"/>
  <text x="130" y="262" font-size="12" font-weight="bold" fill="#27ae60">2</text>

  <!-- Load Output Wire & Load Box -->
  <line x1="135" y1="270" x2="210" y2="270" stroke="#27ae60" stroke-width="2"/>
  <rect x="210" y="255" width="45" height="30" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="232" y="274" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">LOAD</text>

  <!-- Backlight Circuit -->
  <line x1="165" y1="270" x2="165" y2="310" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Resistor R_bal -->
  <rect x="153" y="310" width="24" height="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="135" y="322" font-size="12" font-weight="bold" fill="#1a1a1a">R</text>
  <line x1="165" y1="324" x2="165" y2="340" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Neon Lamp Circle -->
  <circle cx="165" cy="350" r="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="165" y="354" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">N</text>
  <!-- Wire to Terminal 3 (N) -->
  <line x1="165" y1="360" x2="165" y2="375" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="165" y1="375" x2="235" y2="375" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="235" cy="375" r="3" fill="#c0392b"/>
  <text x="215" y="367" font-size="12" font-weight="bold" fill="#c0392b">3(N)</text>

  <!-- Summary Box 1 -->
  <rect x="45" y="403" width="250" height="55" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="420" font-size="12" font-weight="bold" fill="#1a1a1a">Особливість 3-Pin SPST:</text>
  <text x="55" y="435" font-size="12" fill="#6b7280">Пін 3 потрібен ЛИШЕ для живлення</text>
  <text x="55" y="449" font-size="12" fill="#6b7280">підсвітки. Комутується лише фаза.</text>


  <!-- ==================== COLUMN 2: 4-PIN DPST ==================== -->
  <rect x="340" y="75" width="280" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  
  <!-- Badge -->
  <rect x="355" y="87" width="250" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="104" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">4-Pin DPST (Двополюсний)</text>

  <!-- Section 1: Pinout -->
  <text x="355" y="130" font-size="12" font-weight="bold" fill="#1a1a1a">Цокольовка клем (2 незалежні лінії):</text>
  <rect x="365" y="140" width="230" height="72" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Row 1: Line 1 -->
  <rect x="385" y="148" width="65" height="22" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="417" y="163" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">1 (L1)</text>

  <rect x="510" y="148" width="65" height="22" rx="2" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="542" y="163" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">2 (L2)</text>

  <!-- Row 2: Line 2 -->
  <rect x="385" y="180" width="65" height="22" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="417" y="195" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">3 (N1)</text>

  <rect x="510" y="180" width="65" height="22" rx="2" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="542" y="195" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">4 (N2)</text>

  <!-- Section 2: Schematic -->
  <text x="355" y="228" font-size="12" font-weight="bold" fill="#1a1a1a">Схема повного розриву (L + N):</text>
  <rect x="355" y="238" width="250" height="155" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Line 1 (L) -->
  <line x1="365" y1="265" x2="400" y2="265" stroke="#2457d6" stroke-width="2"/>
  <circle cx="400" cy="265" r="3" fill="#2457d6"/>
  <text x="365" y="257" font-size="12" font-weight="bold" fill="#2457d6">1(L1)</text>

  <line x1="400" y1="265" x2="438" y2="252" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="442" cy="265" r="3" fill="#27ae60"/>
  <text x="445" y="257" font-size="12" font-weight="bold" fill="#27ae60">2(L2)</text>
  <line x1="442" y1="265" x2="515" y2="265" stroke="#27ae60" stroke-width="2"/>

  <!-- Line 2 (N) -->
  <line x1="365" y1="340" x2="400" y2="340" stroke="#2457d6" stroke-width="2"/>
  <circle cx="400" cy="340" r="3" fill="#2457d6"/>
  <text x="365" y="332" font-size="12" font-weight="bold" fill="#2457d6">3(N1)</text>

  <line x1="400" y1="340" x2="438" y2="327" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="442" cy="340" r="3" fill="#27ae60"/>
  <text x="445" y="332" font-size="12" font-weight="bold" fill="#27ae60">4(N2)</text>
  <line x1="442" y1="340" x2="515" y2="340" stroke="#27ae60" stroke-width="2"/>

  <!-- Mechanical Ganging Tie -->
  <line x1="418" y1="258" x2="418" y2="333" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Backlight Lamp across outputs 2 & 4 -->
  <line x1="475" y1="265" x2="475" y2="290" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="475" cy="302" r="9" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="475" y1="314" x2="475" y2="340" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Load Block -->
  <rect x="515" y="255" width="45" height="95" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="537" y="306" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">LOAD</text>

  <!-- Summary Box 2 -->
  <rect x="355" y="403" width="250" height="55" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="365" y="420" font-size="12" font-weight="bold" fill="#1a1a1a">Особливість 4-Pin DPST:</text>
  <text x="365" y="435" font-size="12" fill="#6b7280">Одночасне відключення фази і нуля.</text>
  <text x="365" y="449" font-size="12" font-weight="bold" fill="#27ae60">Повна гальванічна розв'язка 230 В.</text>


  <!-- ==================== COLUMN 3: 6-PIN DPDT ==================== -->
  <rect x="650" y="75" width="280" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  
  <!-- Badge -->
  <rect x="665" y="87" width="250" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="790" y="104" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">6-Pin DPDT (Перекидний)</text>

  <!-- Section 1: Pinout -->
  <text x="665" y="130" font-size="12" font-weight="bold" fill="#1a1a1a">Цокольовка 6 клем (Матриця 2×3):</text>
  <rect x="675" y="140" width="230" height="72" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Row 1: Pole 1 -->
  <rect x="688" y="148" width="60" height="22" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="718" y="163" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">1 (NC1)</text>

  <rect x="760" y="148" width="60" height="22" rx="2" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="790" y="163" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">2 (C1)</text>

  <rect x="832" y="148" width="60" height="22" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="862" y="163" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">3 (NO1)</text>

  <!-- Row 2: Pole 2 -->
  <rect x="688" y="180" width="60" height="22" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="718" y="195" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">4 (NC2)</text>

  <rect x="760" y="180" width="60" height="22" rx="2" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="790" y="195" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">5 (C2)</text>

  <rect x="832" y="180" width="60" height="22" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="862" y="195" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">6 (NO2)</text>

  <!-- Section 2: Schematic -->
  <text x="665" y="228" font-size="12" font-weight="bold" fill="#1a1a1a">Схема реверсу / переключення:</text>
  <rect x="665" y="238" width="250" height="155" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Pole 1 Changeover Switch -->
  <circle cx="755" cy="270" r="3" fill="#27ae60"/>
  <text x="755" y="250" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">2(C1)</text>
  
  <line x1="755" y1="270" x2="695" y2="255" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="690" cy="255" r="3" fill="#2457d6"/>
  <text x="690" y="244" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">1(NC1)</text>
  
  <circle cx="690" cy="285" r="3" fill="#2457d6"/>
  <text x="690" y="298" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">3(NO1)</text>

  <!-- Pole 2 Changeover Switch -->
  <circle cx="755" cy="335" r="3" fill="#27ae60"/>
  <text x="755" y="362" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">5(C2)</text>
  
  <line x1="755" y1="335" x2="695" y2="320" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="690" cy="320" r="3" fill="#2457d6"/>
  <text x="690" y="310" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">4(NC2)</text>
  
  <circle cx="690" cy="350" r="3" fill="#2457d6"/>
  <circle cx="690" cy="350" r="1.5" fill="white"/>

  <!-- Mechanical Ganging Tie -->
  <line x1="725" y1="262" x2="725" y2="327" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Output Motor Block -->
  <rect x="830" y="275" width="60" height="50" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="860" y="304" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">MOTOR</text>
  <line x1="755" y1="270" x2="830" y2="285" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="755" y1="335" x2="830" y2="315" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Summary Box 3 -->
  <rect x="665" y="403" width="250" height="55" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="675" y="420" font-size="12" font-weight="bold" fill="#1a1a1a">Особливість 6-Pin DPDT:</text>
  <text x="675" y="435" font-size="12" fill="#6b7280">Два незалежні перекидні контакти.</text>
  <text x="675" y="449" font-size="12" font-weight="bold" fill="#2457d6">Для реверсу двигунів (ON-OFF-ON).</text>


  <!-- ==================== FOOTER ==================== -->
  <rect x="30" y="482" width="900" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="500" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Правильна підключка клем запобігає КЗ між фазою та нулем на внутрішній підсвітці</text>
</svg>
