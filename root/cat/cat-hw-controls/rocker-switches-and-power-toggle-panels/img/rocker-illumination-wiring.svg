<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Header -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схеми підключення індикації клавішних перемикачів</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Залежне підсвічування реагує на увімкнення навантаження, незалежне — сигналізує про наявність мережевої напруги</text>

  <!-- Panel 1: 3-Pin Neon Dependent -->
  <rect x="30" y="75" width="280" height="360" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="170" y="105" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">3-піновий рокер (230 В)</text>
  <text x="170" y="125" font-size="12" fill="#2457d6" text-anchor="middle">Залежна неонова індикація</text>

  <!-- Phase L In Line -->
  <line x1="50" y1="180" x2="110" y2="180" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-gray)"/>
  <text x="75" y="165" font-size="12" fill="#1a1a1a" text-anchor="middle">Фаза L</text>

  <!-- Switch 1 Contacts -->
  <circle cx="110" cy="180" r="4" fill="#1a1a1a"/>
  <line x1="110" y1="180" x2="180" y2="160" stroke="#2457d6" stroke-width="3"/>
  <circle cx="190" cy="180" r="4" fill="#1a1a1a"/>

  <!-- Phase L Out Line -->
  <line x1="190" y1="180" x2="270" y2="180" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="235" y="165" font-size="12" fill="#2457d6" text-anchor="middle">До споживача</text>

  <!-- Internal Neon Circuit (Dependent) -->
  <line x1="190" y1="180" x2="190" y2="220" stroke="#2457d6" stroke-width="1.5"/>
  <!-- Resistor R -->
  <rect x="183" y="220" width="14" height="30" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="240" y="240" font-size="12" fill="#6b7280" text-anchor="middle">Резистор R</text>
  <line x1="190" y1="250" x2="190" y2="270" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Neon Lamp -->
  <circle cx="190" cy="285" r="15" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="185" cy="285" r="3" fill="#c0392b"/>
  <circle cx="195" cy="285" r="3" fill="#c0392b"/>
  <text x="240" y="290" font-size="12" fill="#2457d6" text-anchor="middle">Неонка</text>
  <line x1="190" y1="300" x2="190" y2="330" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Neutral N Line -->
  <line x1="190" y1="330" x2="50" y2="330" stroke="#1a1a1a" stroke-width="2"/>
  <text x="75" y="350" font-size="12" fill="#1a1a1a" text-anchor="middle">Нуль N</text>

  <!-- Pin Labels 1 -->
  <text x="110" y="200" font-size="12" fill="#1a1a1a" text-anchor="middle">Pin 1</text>
  <text x="210" y="200" font-size="12" fill="#1a1a1a" text-anchor="middle">Pin 2</text>
  <text x="215" y="325" font-size="12" fill="#1a1a1a" text-anchor="middle">Pin 3 (N)</text>
  <text x="170" y="390" font-size="12" fill="#2457d6" text-anchor="middle">Світло лише в стані ON</text>


  <!-- Panel 2: 4-Pin DPST Neon Dependent -->
  <rect x="340" y="75" width="280" height="360" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="105" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">4-піновий DPST рокер</text>
  <text x="480" y="125" font-size="12" fill="#27ae60" text-anchor="middle">Повна ізоляція L і N</text>

  <!-- Pole 1 (Phase L) -->
  <line x1="360" y1="180" x2="410" y2="180" stroke="#1a1a1a" stroke-width="2"/>
  <text x="375" y="165" font-size="12" fill="#1a1a1a" text-anchor="middle">Вхід L</text>
  <circle cx="410" cy="180" r="4" fill="#1a1a1a"/>
  <line x1="410" y1="180" x2="480" y2="160" stroke="#27ae60" stroke-width="3"/>
  <circle cx="490" cy="180" r="4" fill="#1a1a1a"/>
  <line x1="490" y1="180" x2="570" y2="180" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="545" y="165" font-size="12" fill="#27ae60" text-anchor="middle">Вихід L</text>

  <!-- Pole 2 (Neutral N) -->
  <line x1="360" y1="300" x2="410" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <text x="375" y="320" font-size="12" fill="#1a1a1a" text-anchor="middle">Вхід N</text>
  <circle cx="410" cy="300" r="4" fill="#1a1a1a"/>
  <line x1="410" y1="300" x2="480" y2="280" stroke="#27ae60" stroke-width="3"/>
  <circle cx="490" cy="300" r="4" fill="#1a1a1a"/>
  <line x1="490" y1="300" x2="570" y2="300" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="545" y="320" font-size="12" fill="#27ae60" text-anchor="middle">Вихід N</text>

  <!-- Mechanical Link -->
  <line x1="445" y1="170" x2="445" y2="290" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Internal Neon between outputs 2 and 5 -->
  <line x1="490" y1="180" x2="490" y2="220" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="483" y="220" width="14" height="20" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="490" cy="255" r="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="490" y1="265" x2="490" y2="300" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Pin Labels 2 -->
  <text x="410" y="200" font-size="12" fill="#1a1a1a" text-anchor="middle">Pin 1</text>
  <text x="510" y="200" font-size="12" fill="#1a1a1a" text-anchor="middle">Pin 2</text>
  <text x="410" y="275" font-size="12" fill="#1a1a1a" text-anchor="middle">Pin 4</text>
  <text x="510" y="275" font-size="12" fill="#1a1a1a" text-anchor="middle">Pin 5</text>
  <text x="480" y="390" font-size="12" fill="#27ae60" text-anchor="middle">Подвійне відключення фази й нуля</text>


  <!-- Panel 3: 4-Pin Independent LED / DC -->
  <rect x="650" y="75" width="280" height="360" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="790" y="105" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">4-піновий LED / DC</text>
  <text x="790" y="125" font-size="12" fill="#c0392b" text-anchor="middle">Незалежне підсвічування</text>

  <!-- Main Switch Contact (Power Circuit) -->
  <line x1="670" y1="180" x2="720" y2="180" stroke="#1a1a1a" stroke-width="2"/>
  <text x="685" y="165" font-size="12" fill="#1a1a1a" text-anchor="middle">Вхід L</text>
  <circle cx="720" cy="180" r="4" fill="#1a1a1a"/>
  <line x1="720" y1="180" x2="790" y2="160" stroke="#c0392b" stroke-width="3"/>
  <circle cx="800" cy="180" r="4" fill="#1a1a1a"/>
  <line x1="800" y1="180" x2="880" y2="180" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="840" y="165" font-size="12" fill="#c0392b" text-anchor="middle">Вихід L</text>

  <!-- Independent LED Circuit -->
  <line x1="670" y1="300" x2="720" y2="300" stroke="#c0392b" stroke-width="2"/>
  <text x="685" y="320" font-size="12" fill="#c0392b" text-anchor="middle">V+ (LED)</text>
  <rect x="720" y="293" width="25" height="14" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="732" y="285" font-size="12" fill="#6b7280" text-anchor="middle">R</text>

  <!-- LED Diode Symbol -->
  <polygon points="765,292 765,308 780,300" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="780" y1="292" x2="780" y2="308" stroke="#c0392b" stroke-width="2"/>
  <line x1="745" y1="300" x2="765" y2="300" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="780" y1="300" x2="880" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <text x="840" y="320" font-size="12" fill="#1a1a1a" text-anchor="middle">GND (LED)</text>

  <!-- Pin Labels 3 -->
  <text x="720" y="200" font-size="12" fill="#1a1a1a" text-anchor="middle">Pin 1</text>
  <text x="800" y="200" font-size="12" fill="#1a1a1a" text-anchor="middle">Pin 2</text>
  <text x="710" y="275" font-size="12" fill="#c0392b" text-anchor="middle">Pin 3</text>
  <text x="800" y="275" font-size="12" fill="#1a1a1a" text-anchor="middle">Pin 4</text>
  <text x="790" y="390" font-size="12" fill="#c0392b" text-anchor="middle">Постійне світло (пошукове)</text>
</svg>
