<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr-dark" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Механізм моментального спрацьовування (Snap-Action) клавішного перемикача</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Пружинний штовхач долає мертву точку і миттєво перекидає рухомий контакт, запобігаючи дугоутворенню</text>

  <!-- Panel 1: OFF -->
  <rect x="30" y="70" width="286" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="42" y="82" width="262" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="173" y="101" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Стан «OFF» (Вимкнено)</text>

  <!-- Panel 1 Rocker Button -->
  <polygon points="93,135 253,165 253,180 93,150" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="173" cy="155" r="4" fill="#1a1a1a"/>
  <text x="173" y="130" font-size="12" fill="#6b7280" text-anchor="middle">Клавіша (Rocker)</text>

  <!-- Panel 1 Plunger and Spring -->
  <line x1="155" y1="150" x2="135" y2="270" stroke="#2457d6" stroke-width="3"/>
  <path d="M155,160 L145,175 L155,190 L145,205 L155,220 L145,235 L155,250" fill="none" stroke="#2457d6" stroke-width="2"/>
  <text x="110" y="200" font-size="12" fill="#2457d6" text-anchor="end">Пружина F_sp</text>

  <!-- Panel 1 Moving Arm and Base -->
  <rect x="63" y="340" width="220" height="12" fill="#ffffff" stroke="#d0d7de" rx="2"/>
  <!-- COM pin -->
  <line x1="173" y1="340" x2="173" y2="290" stroke="#1a1a1a" stroke-width="4"/>
  <polygon points="163,290 183,290 173,280" fill="#1a1a1a"/>
  <text x="173" y="368" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">COM</text>
  <!-- NC pin -->
  <line x1="98" y1="340" x2="98" y2="305" stroke="#1a1a1a" stroke-width="4"/>
  <circle cx="98" cy="300" r="6" fill="#27ae60"/>
  <text x="98" y="368" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">NC</text>
  <!-- NO pin -->
  <line x1="248" y1="340" x2="248" y2="305" stroke="#1a1a1a" stroke-width="4"/>
  <circle cx="248" cy="300" r="6" fill="#d0d7de"/>
  <text x="248" y="368" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">NO</text>
  <!-- Moving contact blade -->
  <line x1="98" y1="300" x2="173" y2="280" stroke="#1a1a1a" stroke-width="4"/>
  <line x1="173" y1="280" x2="248" y2="260" stroke="#1a1a1a" stroke-width="4"/>

  <!-- Panel 1 Subcard -->
  <rect x="43" y="382" width="260" height="42" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="173" y="399" font-size="12" fill="#1a1a1a" text-anchor="middle">Штовхач тисне ліворуч від осі</text>
  <text x="173" y="415" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Контакт NC замкнено</text>

  <!-- Panel 2: DEAD CENTER -->
  <rect x="337" y="70" width="286" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="349" y="82" width="262" height="28" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="480" y="101" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">2. Мертва точка (Стиснення)</text>

  <!-- Panel 2 Rocker Button (Horizontal) -->
  <polygon points="400,150 560,150 560,165 400,165" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="480" cy="157" r="4" fill="#1a1a1a"/>
  <!-- Finger press arrow -->
  <line x1="540" y1="115" x2="540" y2="142" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="540" y="110" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">F_пальця</text>

  <!-- Panel 2 Plunger (Vertical Compressed) -->
  <line x1="480" y1="160" x2="480" y2="275" stroke="#c0392b" stroke-width="4"/>
  <path d="M480,165 L472,175 L488,185 L472,195 L488,205 L472,215 L488,225 L472,235 L488,245 L480,255" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="425" y="210" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">Max F_spring</text>

  <!-- Panel 2 Moving Arm and Base -->
  <rect x="370" y="340" width="220" height="12" fill="#ffffff" stroke="#d0d7de" rx="2"/>
  <!-- COM pin -->
  <line x1="480" y1="340" x2="480" y2="290" stroke="#1a1a1a" stroke-width="4"/>
  <polygon points="470,290 490,290 480,280" fill="#1a1a1a"/>
  <text x="480" y="368" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">COM</text>
  <!-- NC pin -->
  <line x1="405" y1="340" x2="405" y2="305" stroke="#1a1a1a" stroke-width="4"/>
  <circle cx="405" cy="300" r="6" fill="#d0d7de"/>
  <text x="405" y="368" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">NC</text>
  <!-- NO pin -->
  <line x1="555" y1="340" x2="555" y2="305" stroke="#1a1a1a" stroke-width="4"/>
  <circle cx="555" cy="300" r="6" fill="#d0d7de"/>
  <text x="555" y="368" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">NO</text>
  <!-- Moving contact blade -->
  <line x1="405" y1="300" x2="480" y2="280" stroke="#1a1a1a" stroke-width="4"/>
  <line x1="480" y1="280" x2="555" y2="260" stroke="#1a1a1a" stroke-width="4"/>

  <!-- Panel 2 Subcard -->
  <rect x="350" y="382" width="260" height="42" rx="4" fill="#ffffff" stroke="#c0392b"/>
  <text x="480" y="399" font-size="12" fill="#1a1a1a" text-anchor="middle">Штовхач по центру осі опори</text>
  <text x="480" y="415" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Початок перекидання (Мертва точка)</text>

  <!-- Panel 3: ON (SNAP) -->
  <rect x="644" y="70" width="286" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="656" y="82" width="262" height="28" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="787" y="101" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">3. Моментальне «ON» (Snap)</text>

  <!-- Panel 3 Rocker Button -->
  <polygon points="707,165 867,135 867,150 707,180" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="787" cy="155" r="4" fill="#1a1a1a"/>
  <text x="787" y="130" font-size="12" fill="#27ae60" font-weight="bold" text-anchor="middle">Snap-Action!</text>

  <!-- Panel 3 Plunger and Spring -->
  <line x1="805" y1="160" x2="825" y2="270" stroke="#27ae60" stroke-width="3"/>
  <path d="M805,160 L815,175 L805,190 L815,205 L805,220 L815,235 L805,250" fill="none" stroke="#27ae60" stroke-width="2"/>
  <text x="850" y="200" font-size="12" fill="#27ae60" text-anchor="start">F_sp імпульс</text>

  <!-- Panel 3 Moving Arm and Base -->
  <rect x="677" y="340" width="220" height="12" fill="#ffffff" stroke="#d0d7de" rx="2"/>
  <!-- COM pin -->
  <line x1="787" y1="340" x2="787" y2="290" stroke="#1a1a1a" stroke-width="4"/>
  <polygon points="777,290 797,290 787,280" fill="#1a1a1a"/>
  <text x="787" y="368" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">COM</text>
  <!-- NC pin -->
  <line x1="712" y1="340" x2="712" y2="305" stroke="#1a1a1a" stroke-width="4"/>
  <circle cx="712" cy="300" r="6" fill="#d0d7de"/>
  <text x="712" y="368" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">NC</text>
  <!-- NO pin -->
  <line x1="862" y1="340" x2="862" y2="305" stroke="#1a1a1a" stroke-width="4"/>
  <circle cx="862" cy="300" r="6" fill="#27ae60"/>
  <text x="862" y="368" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">NO</text>
  <!-- Moving contact blade -->
  <line x1="712" y1="260" x2="787" y2="280" stroke="#1a1a1a" stroke-width="4"/>
  <line x1="787" y1="280" x2="862" y2="300" stroke="#1a1a1a" stroke-width="4"/>

  <!-- Panel 3 Subcard -->
  <rect x="657" y="382" width="260" height="42" rx="4" fill="#ffffff" stroke="#27ae60"/>
  <text x="787" y="399" font-size="12" fill="#1a1a1a" text-anchor="middle">Штовхач перейшов вісь праворуч</text>
  <text x="787" y="415" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Контакт NO миттєво замкнено</text>
</svg>
