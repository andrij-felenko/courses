<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="28" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Порівняльна кінематика комутації: класичний тумблер проти пружинного рокера (Snap-Action)</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Підпружинений штовхач рокера накопичує зусилля та забезпечує миттєвий перекид контакту незалежно від швидкості натискання</text>

  <!-- LEFT PANEL: TOGGLE SWITCH -->
  <rect x="30" y="68" width="435" height="372" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247.5" y="94" font-size="15" font-weight="700" fill="#c0392b" text-anchor="middle">1. Класичний тумблер (Повільна ручна комутація)</text>

  <!-- Switch Outer Housing -->
  <rect x="50" y="115" width="395" height="235" rx="6" ry="6" fill="white" stroke="#d0d7de" stroke-width="1"/>

  <!-- Toggle Lever (Protruding) -->
  <line x1="247.5" y1="180" x2="190" y2="130" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>
  <circle cx="185" cy="125" r="10" fill="#6b7280"/>
  <text x="185" y="106" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Важіль тумблера</text>

  <!-- Pivot Center -->
  <circle cx="247.5" cy="180" r="7" fill="#2457d6"/>

  <!-- Slow Movement Force Arrow -->
  <path d="M 160 135 Q 185 155 210 165" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="140" y="160" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Повільне зусилля v_hand</text>

  <!-- Mechanical Contact Arm Directly Linked to Lever -->
  <line x1="247.5" y1="180" x2="310" y2="245" stroke="#1a1a1a" stroke-width="4"/>
  <circle cx="310" cy="245" r="6" fill="#c0392b"/>

  <!-- Stationary Contacts -->
  <rect x="330" y="270" width="45" height="15" rx="2" fill="#d0d7de" stroke="#1a1a1a"/>
  <circle cx="340" cy="270" r="5" fill="#2457d6"/>
  <text x="385" y="282" font-size="12" fill="#1a1a1a">Нерухомий контакт</text>

  <!-- Arc Sparks during slow break -->
  <path d="M 314 248 L 336 266" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="2 2"/>
  <text x="350" y="245" font-size="12" font-weight="700" fill="#c0392b">Тривала дуга!</text>

  <!-- Result Badge Toggle -->
  <rect x="65" y="365" width="365" height="60" rx="4" ry="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="247.5" y="386" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Прямий зв'язок: v_contact = v_hand</text>
  <text x="247.5" y="405" font-size="12" fill="#1a1a1a" text-anchor="middle">Повільне розведення розпалює дугу та викликає ерозію</text>


  <!-- RIGHT PANEL: ROCKER SNAP-ACTION -->
  <rect x="495" y="68" width="435" height="372" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="712.5" y="94" font-size="15" font-weight="700" fill="#27ae60" text-anchor="middle">2. Рокер Snap-Action (Миттєвий перекид)</text>

  <!-- Rocker Outer Housing -->
  <rect x="515" y="115" width="395" height="235" rx="6" ry="6" fill="white" stroke="#d0d7de" stroke-width="1"/>

  <!-- Flush Rocker Button (Curved Top) -->
  <path d="M 570 140 L 712 148 L 855 135 L 855 160 L 570 160 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="712.5" y="132" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Клавіша рокера (Flush Design)</text>

  <!-- Rocker Press Arrow -->
  <line x1="600" y1="110" x2="600" y2="135" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="600" y="104" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Натискання</text>

  <!-- Internal Spring-Loaded Plunger (Штовхач із пружиною) -->
  <rect x="704" y="160" width="16" height="40" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <!-- Internal Spring coils inside plunger -->
  <path d="M 706 170 L 718 174 L 706 178 L 718 182 L 706 186 L 718 190" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <!-- Plunger Tip (Roller / Point) -->
  <polygon points="704,200 720,200 712,212" fill="#2457d6"/>

  <text x="760" y="185" font-size="12" font-weight="700" fill="#2457d6">Штовхач з пружиною</text>

  <!-- Pivot Rocker Arm (Contact Bridge) -->
  <line x1="615" y1="270" x2="810" y2="225" stroke="#1a1a1a" stroke-width="4"/>
  <circle cx="712" cy="248" r="6" fill="#27ae60"/>
  <text x="712" y="270" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Мертва точка перекиду</text>

  <!-- Moving Contact on Rocker Arm -->
  <circle cx="615" cy="270" r="6" fill="#27ae60"/>

  <!-- Fast Snap Motion Arrow -->
  <path d="M 625 260 Q 640 280 660 285" fill="none" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="590" y="295" font-size="12" font-weight="700" fill="#27ae60">v_snap &gt;&gt; v_hand</text>

  <!-- Result Badge Rocker -->
  <rect x="530" y="365" width="365" height="60" rx="4" ry="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712.5" y="386" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Пружинний розрив: v_snap = const</text>
  <text x="712.5" y="405" font-size="12" fill="#1a1a1a" text-anchor="middle">Миттєвий перекид гасить дугу та захищає контакти</text>

</svg>
