<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Цокольовка та схемотехніка підсвічування 3-Pin і 4-Pin рокерів</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Залежна підсвітка індикує включене навантаження, незалежна — підсвічує клавішу у темряві</text>

  <!-- Panel 1: 3-Pin Rocker (Dependent Illumination) -->
  <rect x="20" y="74" width="292" height="442" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="166" y="98" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">A. 3-Pin (Залежна підсвітка)</text>
  <text x="166" y="116" font-size="12" fill="#6b7280" text-anchor="middle">Лампа світиться лише в стані ON</text>

  <!-- Rocker Body Box -->
  <rect x="46" y="136" width="240" height="180" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="166" y="156" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">3-Pin SPST з підсвіткою</text>

  <!-- Internal Switch Contact -->
  <circle cx="86" cy="200" r="4" fill="#1a1a1a"/>
  <text x="86" y="186" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Pin 1 (LINE)</text>
  <line x1="86" y1="200" x2="160" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Switch Blade (Closed / ON) -->
  <circle cx="160" cy="200" r="3" fill="#1a1a1a"/>
  <line x1="160" y1="200" x2="220" y2="200" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="220" cy="200" r="4" fill="#1a1a1a"/>
  <text x="220" y="186" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Pin 2 (LOAD)</text>
  <line x1="220" y1="200" x2="260" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Internal Lamp (Neon / LED + Resistor) -->
  <line x1="240" y1="200" x2="240" y2="240" stroke="#2457d6" stroke-width="1.5"/>
  <!-- Lamp Symbol (Circle with X) -->
  <circle cx="240" cy="255" r="12" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="232" y1="247" x2="248" y2="263" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="248" y1="247" x2="232" y2="263" stroke="#2457d6" stroke-width="1.5"/>
  <text x="180" y="259" font-size="12" fill="#2457d6" text-anchor="end">Лампа / LED</text>

  <line x1="240" y1="267" x2="240" y2="290" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="240" y1="290" x2="166" y2="290" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="166" cy="290" r="4" fill="#2457d6"/>
  <text x="166" y="308" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Pin 3 (N / GND)</text>

  <!-- External Wiring Diagram -->
  <rect x="46" y="332" width="240" height="170" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="166" y="352" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Зовнішнє підключення</text>

  <text x="60" y="380" font-size="12" fill="#c0392b" font-weight="700">Фаза L (Вхід)</text>
  <line x1="140" y1="376" x2="270" y2="376" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <text x="60" y="415" font-size="12" fill="#2457d6" font-weight="700">До Навантаження</text>
  <line x1="165" y1="411" x2="270" y2="411" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <text x="60" y="450" font-size="12" fill="#1a1a1a" font-weight="700">Нуль N (Підсвітка)</text>
  <line x1="165" y1="446" x2="270" y2="446" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <text x="166" y="488" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Захищає від витоку в стан OFF</text>


  <!-- Panel 2: 4-Pin Rocker (DPST Dual Pole) -->
  <rect x="334" y="74" width="292" height="442" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="98" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">B. 4-Pin DPST (2-полюсний)</text>
  <text x="480" y="116" font-size="12" fill="#6b7280" text-anchor="middle">Повне розмикання Фази (L) та Нуля (N)</text>

  <!-- Rocker Body Box -->
  <rect x="360" y="136" width="240" height="180" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="156" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">4-Pin DPST з підсвіткою</text>

  <!-- Pole 1 (Line L) -->
  <text x="380" y="186" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">1 (L_in)</text>
  <circle cx="380" cy="200" r="4" fill="#c0392b"/>
  <line x1="380" y1="200" x2="580" y2="200" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="580" cy="200" r="4" fill="#c0392b"/>
  <text x="580" y="186" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">2 (L_out)</text>

  <!-- Mechanical Coupling -->
  <line x1="480" y1="200" x2="480" y2="260" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Pole 2 (Neutral N) -->
  <text x="380" y="246" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">3 (N_in)</text>
  <circle cx="380" cy="260" r="4" fill="#1a1a1a"/>
  <line x1="380" y1="260" x2="580" y2="260" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="580" cy="260" r="4" fill="#1a1a1a"/>
  <text x="580" y="246" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">4 (N_out)</text>

  <!-- Internal Lamp between L_out and N_out -->
  <line x1="530" y1="200" x2="530" y2="220" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="530" cy="230" r="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="524" y1="224" x2="536" y2="236" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="536" y1="224" x2="524" y2="236" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="530" y1="240" x2="530" y2="260" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Explanation Box -->
  <rect x="360" y="332" width="240" height="170" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="356" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Особливості DPST</text>
  <text x="480" y="385" font-size="12" fill="#1a1a1a" text-anchor="middle">Розриває обидва провідники живлення</text>
  <text x="480" y="410" font-size="12" fill="#6b7280" text-anchor="middle">Гарантує гальванічне відключення</text>
  <text x="480" y="435" font-size="12" fill="#2457d6" text-anchor="middle">Підсвітка підключена після контактів</text>
  <text x="480" y="475" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Найвищий рівень безпеки в 230V!</text>


  <!-- Panel 3: Independent Illumination -->
  <rect x="648" y="74" width="292" height="442" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="794" y="98" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">C. Незалежна підсвітка</text>
  <text x="794" y="116" font-size="12" fill="#6b7280" text-anchor="middle">Світиться постійно для пошуку у темряві</text>

  <!-- Circuit Box -->
  <rect x="674" y="136" width="240" height="180" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="794" y="156" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">Окремі виводи лампи</text>

  <!-- Switch Circuit (Pin 1 to Pin 2) -->
  <text x="694" y="186" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Pin 1</text>
  <circle cx="694" cy="200" r="4" fill="#1a1a1a"/>
  <line x1="694" y1="200" x2="794" y2="200" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="794" cy="200" r="4" fill="#1a1a1a"/>
  <text x="794" y="186" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Pin 2 (До навантаження)</text>

  <!-- Independent Lamp Circuit (Pin 5 to Pin 6) -->
  <text x="694" y="246" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Pin 5</text>
  <circle cx="694" cy="260" r="4" fill="#2457d6"/>
  <line x1="694" y1="260" x2="734" y2="260" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Lamp Circle -->
  <circle cx="744" cy="260" r="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="738" y1="254" x2="750" y2="266" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="750" y1="254" x2="738" y2="266" stroke="#2457d6" stroke-width="1.5"/>

  <line x1="754" y1="260" x2="794" y2="260" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="794" cy="260" r="4" fill="#2457d6"/>
  <text x="794" y="246" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Pin 6 (VCC / N)</text>

  <text x="794" y="295" font-size="12" fill="#6b7280" text-anchor="middle">Лампа підключена до лінії до кнопки</text>

  <!-- Explanation Box -->
  <rect x="674" y="332" width="240" height="170" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="794" y="356" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Сфера застосування</text>
  <text x="794" y="385" font-size="12" fill="#1a1a1a" text-anchor="middle">Пошукове підсвічування приладових панелей</text>
  <text x="794" y="410" font-size="12" fill="#6b7280" text-anchor="middle">Постійна індикація наявності мережі</text>
  <text x="794" y="435" font-size="12" fill="#2457d6" text-anchor="middle">Можливе зовнішнє керування підсвіткою</text>
  <text x="794" y="475" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Зручно для нічного виявлення пультів</text>

</svg>
