<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Header -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Панельний затискний монтаж snap-in та герметизація IP65</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Пружинні засувки фіксують корпус у вирізі панелі, а герметичний ущільнювач захищає від пилу та вологи</text>

  <!-- Panel 1: Cutout Geometry (x: 30..460, width: 430) -->
  <rect x="30" y="75" width="430" height="360" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="245" y="105" font-size="14" font-weight="700" fill="#2457d6" text-anchor="middle">1. Геометрія посадочного отвору</text>
  <text x="245" y="125" font-size="12" fill="#2457d6" text-anchor="middle">Розміри вирізу панелі під стандарт snap-in</text>

  <!-- Sheet Metal Plate -->
  <rect x="80" y="150" width="330" height="230" rx="4" ry="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <!-- Cutout Hole -->
  <rect x="170" y="200" width="150" height="130" rx="2" ry="2" fill="#ffffff" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Dimension Lines -->
  <!-- Width W -->
  <line x1="170" y1="180" x2="320" y2="180" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
  <line x1="170" y1="172" x2="170" y2="192" stroke="#2457d6" stroke-width="1"/>
  <line x1="320" y1="172" x2="320" y2="192" stroke="#2457d6" stroke-width="1"/>
  <text x="245" y="173" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">W = 28.6 ± 0.1 мм</text>

  <!-- Height H -->
  <line x1="345" y1="200" x2="345" y2="330" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
  <line x1="338" y1="200" x2="358" y2="200" stroke="#2457d6" stroke-width="1"/>
  <line x1="338" y1="330" x2="358" y2="330" stroke="#2457d6" stroke-width="1"/>
  <text x="355" y="270" font-size="12" font-weight="700" fill="#2457d6" text-anchor="start">H = 13.8 ± 0.1 мм</text>

  <!-- Corner Radius Callout -->
  <line x1="170" y1="200" x2="195" y2="230" stroke="#6b7280" stroke-width="1.5" marker-start="url(#arr-gray)"/>
  <text x="200" y="242" font-size="11" fill="#6b7280" text-anchor="start">Радіус кута R ≤ 0.5 мм</text>

  <text x="245" y="415" font-size="12" fill="#6b7280" text-anchor="middle">Точність вирізу запобігає люфту та деформації</text>


  <!-- Panel 2: Cross Section Mounting & Seal (x: 500..930, width: 430) -->
  <rect x="500" y="75" width="430" height="360" rx="8" ry="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="715" y="105" font-size="14" font-weight="700" fill="#27ae60" text-anchor="middle">2. Механізм фіксації та герметизація</text>
  <text x="715" y="125" font-size="12" fill="#27ae60" text-anchor="middle">Розріз корпусу в момент затискання в панелі</text>

  <!-- Insertion Force Arrow -->
  <line x1="715" y1="145" x2="715" y2="182" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="715" y="140" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Сила вставляння F</text>

  <!-- Rocker Switch Bezel (Top Flange) -->
  <path d="M 620,195 L 810,195 L 810,215 L 620,215 Z" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="715" y="210" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">Буртик корпусу перемикача</text>

  <!-- Silicone Gasket (Red Seals) -->
  <rect x="625" y="215" width="20" height="20" rx="2" ry="2" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <rect x="785" y="215" width="20" height="20" rx="2" ry="2" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <line x1="805" y1="225" x2="838" y2="215" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-red)"/>
  <text x="845" y="218" font-size="12" font-weight="700" fill="#c0392b" text-anchor="start">Ущільнювач IP65</text>

  <!-- Sheet Metal Panel Plate (Left and Right halves) -->
  <rect x="540" y="235" width="105" height="25" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="785" y="235" width="105" height="25" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="545" y="280" font-size="11" fill="#1a1a1a">Панель t = 1.0–3.0 мм</text>

  <!-- Main Body Housing (inserted into hole 645 to 785) -->
  <rect x="645" y="215" width="140" height="130" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="715" y="325" font-size="12" fill="#6b7280" text-anchor="middle">Корпус рокера</text>

  <!-- Flexible Snap-in Spring Latches (Left and Right) -->
  <!-- Left Latch -->
  <polygon points="645,260 625,260 645,280" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="625" y1="260" x2="625" y2="236" stroke="#27ae60" stroke-width="2"/>

  <!-- Right Latch -->
  <polygon points="785,260 805,260 785,280" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="805" y1="260" x2="805" y2="236" stroke="#27ae60" stroke-width="2"/>

  <line x1="805" y1="270" x2="838" y2="285" stroke="#27ae60" stroke-width="1.5" marker-start="url(#arr-green)"/>
  <text x="845" y="290" font-size="12" font-weight="700" fill="#27ae60" text-anchor="start">Засувка snap-in</text>

  <text x="715" y="415" font-size="12" fill="#27ae60" text-anchor="middle">Фіксація засувками без інструментів</text>
</svg>
