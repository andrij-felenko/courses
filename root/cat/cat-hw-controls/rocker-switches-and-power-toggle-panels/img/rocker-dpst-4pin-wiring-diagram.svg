<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="35" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принципова схема підключення 4-пінового двополюсного рокера (DPST)</text>
  <text x="480" y="55" font-size="13" fill="#6b7280" text-anchor="middle">Повний розрив фази L та нуля N при комутації з залежним неоновим підсвічуванням</text>

  <!-- Power Supply (Left Block) -->
  <rect x="30" y="90" width="160" height="330" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="110" y="118" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мережа 230 V AC</text>
  
  <circle cx="170" cy="160" r="4" fill="#c0392b"/>
  <text x="100" y="155" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Фаза L</text>
  
  <circle cx="170" cy="320" r="4" fill="#2457d6"/>
  <text x="100" y="315" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Нуль N</text>

  <!-- Switch Enclosure (Center Block) -->
  <rect x="270" y="90" width="420" height="330" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="118" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">4-Pin DPST Рокерний перемикач</text>

  <!-- Pin Labels Inside Switch -->
  <text x="285" y="142" font-size="12" font-weight="bold" fill="#c0392b">Вхід 1 (L_in)</text>
  <text x="590" y="142" font-size="12" font-weight="bold" fill="#c0392b">Вихід 2 (L_out)</text>
  <text x="285" y="348" font-size="12" font-weight="bold" fill="#2457d6">Вхід 3 (N_in)</text>
  <text x="590" y="348" font-size="12" font-weight="bold" fill="#2457d6">Вихід 4 (N_out)</text>

  <!-- Terminal Pins Input/Output -->
  <circle cx="280" cy="160" r="4" fill="#c0392b"/>
  <circle cx="680" cy="160" r="4" fill="#c0392b"/>
  <circle cx="280" cy="320" r="4" fill="#2457d6"/>
  <circle cx="680" cy="320" r="4" fill="#2457d6"/>

  <!-- Pole 1 (Phase Contact) -->
  <line x1="284" y1="160" x2="350" y2="160" stroke="#c0392b" stroke-width="2"/>
  <circle cx="350" cy="160" r="3.5" fill="#c0392b"/>
  <line x1="350" y1="160" x2="535" y2="145" stroke="#c0392b" stroke-width="2"/>
  <circle cx="540" cy="160" r="3.5" fill="#c0392b"/>
  <line x1="544" y1="160" x2="676" y2="160" stroke="#c0392b" stroke-width="2"/>
  <text x="445" y="132" font-size="12" fill="#1a1a1a" text-anchor="middle">Контакт 1 (Фазовий полюс)</text>

  <!-- Pole 2 (Neutral Contact) -->
  <line x1="284" y1="320" x2="350" y2="320" stroke="#2457d6" stroke-width="2"/>
  <circle cx="350" cy="320" r="3.5" fill="#2457d6"/>
  <line x1="350" y1="320" x2="535" y2="305" stroke="#2457d6" stroke-width="2"/>
  <circle cx="540" cy="320" r="3.5" fill="#2457d6"/>
  <line x1="544" y1="320" x2="676" y2="320" stroke="#2457d6" stroke-width="2"/>
  <text x="445" y="348" font-size="12" fill="#1a1a1a" text-anchor="middle">Контакт 2 (Нейтральний полюс)</text>

  <!-- Mechanical Tie Line & Box -->
  <line x1="445" y1="153" x2="445" y2="215" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="445" y1="243" x2="445" y2="313" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4"/>
  <rect x="375" y="215" width="140" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="445" y="233" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Механічна злинка</text>

  <!-- Internal Neon Indicator & Resistor Assembly (at x=570) -->
  <circle cx="570" cy="160" r="3" fill="#2457d6"/>
  <circle cx="570" cy="320" r="3" fill="#2457d6"/>
  <line x1="570" y1="160" x2="570" y2="185" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="555" y="185" width="30" height="20" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="592" y="199" font-size="12" fill="#2457d6">R_lim</text>
  <line x1="570" y1="205" x2="570" y2="236" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="570" cy="250" r="14" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="565" y1="246" x2="565" y2="254" stroke="#2457d6" stroke-width="2"/>
  <line x1="575" y1="246" x2="575" y2="254" stroke="#2457d6" stroke-width="2"/>
  <line x1="570" y1="264" x2="570" y2="320" stroke="#2457d6" stroke-width="1.5"/>
  <text x="592" y="254" font-size="12" fill="#2457d6">Неонова лампа</text>

  <!-- External Connections: Power to Switch -->
  <line x1="174" y1="160" x2="274" y2="160" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="174" y1="320" x2="274" y2="320" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Load (Right Block) -->
  <rect x="770" y="90" width="160" height="330" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="850" y="118" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Навантаження</text>
  <text x="850" y="138" font-size="12" fill="#1a1a1a" text-anchor="middle">(Прилад / Двигун)</text>

  <rect x="782" y="210" width="136" height="80" rx="6" fill="white" stroke="#27ae60" stroke-width="1"/>
  <text x="850" y="233" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Повне</text>
  <text x="850" y="251" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">знеструмлення</text>
  <text x="850" y="269" font-size="12" fill="#6b7280" text-anchor="middle">у стані OFF</text>

  <!-- External Connections: Switch to Load -->
  <line x1="684" y1="160" x2="764" y2="160" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="684" y1="320" x2="764" y2="320" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
</svg>
