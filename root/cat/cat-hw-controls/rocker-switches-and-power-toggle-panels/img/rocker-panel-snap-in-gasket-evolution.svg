<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  
  <!-- Main Title & Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Еволюція кріплення Snap-In та герметизації IP67 рокерних панелей</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Від ручного гвинтового фіксування до безінструментного Snap-In та силіконових ущільнювальних контурів</text>

  <!-- Stage 1 Box -->
  <rect x="40" y="75" width="275" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="177" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Гвинтове кріплення</text>
  <rect x="97" y="112" width="160" height="24" rx="12" fill="#fdecea" stroke="#c0392b"/>
  <text x="177" y="128" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">IP40 • Без захисту</text>
  
  <!-- Stage 1 Diagram -->
  <g>
    <!-- Panel slices -->
    <rect x="65" y="190" width="50" height="15" fill="#b0b8c0" stroke="#707880"/>
    <rect x="239" y="190" width="50" height="15" fill="#b0b8c0" stroke="#707880"/>
    <!-- Switch Body -->
    <rect x="115" y="186" width="124" height="64" fill="#404550" stroke="#202530" rx="2"/>
    <rect x="105" y="173" width="144" height="13" fill="#202530" rx="1"/>
    <!-- Screws -->
    <rect x="80" y="168" width="16" height="5" fill="#707880"/>
    <line x1="88" y1="173" x2="88" y2="215" stroke="#707880" stroke-width="3" stroke-dasharray="3,2"/>
    <rect x="258" y="168" width="16" height="5" fill="#707880"/>
    <line x1="266" y1="173" x2="266" y2="215" stroke="#707880" stroke-width="3" stroke-dasharray="3,2"/>
    <!-- Rocker Key -->
    <polygon points="120,173 234,173 234,158 120,168" fill="#808895" stroke="#202530"/>
    <!-- Leak gap arrows -->
    <path d="M 108,178 L 108,202" stroke="#c0392b" stroke-width="2" stroke-dasharray="2,2"/>
    <path d="M 246,178 L 246,202" stroke="#c0392b" stroke-width="2" stroke-dasharray="2,2"/>
    <text x="177" y="270" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Пил і волога крізь щілини</text>
  </g>

  <!-- Stage 1 Bullets -->
  <text x="55" y="305" font-size="12" fill="#1a1a1a">• Гвинтове кронштейнування</text>
  <text x="55" y="327" font-size="12" fill="#6b7280">• Висока трудомісткість збірки</text>
  <text x="55" y="349" font-size="12" fill="#c0392b">• Щілини та корозія контактів</text>
  <text x="55" y="371" font-size="12" fill="#6b7280">• Ризик самовідкручування</text>
  <text x="55" y="393" font-size="12" fill="#6b7280">• Застаріла конструкція</text>

  <!-- Stage 2 Box -->
  <rect x="342" y="75" width="275" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="479" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Механізм Snap-In</text>
  <rect x="389" y="112" width="180" height="24" rx="12" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="479" y="128" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">IP40–IP54 • Швидкий монтаж</text>

  <!-- Stage 2 Diagram -->
  <g>
    <!-- Panel slices -->
    <rect x="367" y="190" width="50" height="15" fill="#b0b8c0" stroke="#707880"/>
    <rect x="541" y="190" width="50" height="15" fill="#b0b8c0" stroke="#707880"/>
    <!-- Switch Body -->
    <rect x="417" y="186" width="124" height="64" fill="#404550" stroke="#202530" rx="2"/>
    <rect x="407" y="173" width="144" height="13" fill="#202530" rx="1"/>
    <!-- Snap-In Latches -->
    <path d="M 417,220 L 401,205 L 417,205 Z" fill="#2457d6"/>
    <path d="M 541,220 L 557,205 L 541,205 Z" fill="#2457d6"/>
    <!-- Rocker Key -->
    <polygon points="422,173 536,173 536,158 422,168" fill="#808895" stroke="#202530"/>
    <text x="479" y="270" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Консольні пружні засувки</text>
  </g>

  <!-- Stage 2 Bullets -->
  <text x="357" y="305" font-size="12" fill="#1a1a1a">• Фіксація втисканням Snap-In</text>
  <text x="357" y="327" font-size="12" fill="#6b7280">• Монтаж за лічені секунди</text>
  <text x="357" y="349" font-size="12" fill="#2457d6">• Автовибір під товщину стінки</text>
  <text x="357" y="371" font-size="12" fill="#6b7280">• Стандартні рамки 11/22×30 мм</text>
  <text x="357" y="393" font-size="12" fill="#6b7280">• Промисловий стандарт панелей</text>

  <!-- Stage 3 Box -->
  <rect x="645" y="75" width="275" height="360" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="782" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3. Ущільнений контур IP67</text>
  <rect x="692" y="112" width="180" height="24" rx="12" fill="#27ae60" stroke="#27ae60"/>
  <text x="782" y="128" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">IP67 • Повний захист</text>

  <!-- Stage 3 Diagram -->
  <g>
    <!-- Panel slices -->
    <rect x="670" y="190" width="50" height="15" fill="#b0b8c0" stroke="#707880"/>
    <rect x="844" y="190" width="50" height="15" fill="#b0b8c0" stroke="#707880"/>
    <!-- Silicone Gasket Ring -->
    <rect x="710" y="186" width="10" height="4" rx="1" fill="#27ae60" stroke="#1e8449"/>
    <rect x="844" y="186" width="10" height="4" rx="1" fill="#27ae60" stroke="#1e8449"/>
    <!-- Switch Body -->
    <rect x="720" y="186" width="124" height="64" fill="#404550" stroke="#202530" rx="2"/>
    <rect x="706" y="173" width="152" height="13" fill="#202530" rx="1"/>
    <!-- Snap-In Latches -->
    <path d="M 720,220 L 704,205 L 720,205 Z" fill="#27ae60"/>
    <path d="M 844,220 L 860,205 L 844,205 Z" fill="#27ae60"/>
    <!-- Rocker Key -->
    <polygon points="725,173 839,173 839,158 725,168" fill="#808895" stroke="#202530"/>
    <!-- Silicone Cap Contour -->
    <path d="M 700,173 Q 782,143 864,173" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="4,2"/>
    <text x="782" y="270" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Силіконовий контур IP67</text>
  </g>

  <!-- Stage 3 Bullets -->
  <text x="660" y="305" font-size="12" fill="#1a1a1a">• Інтегроване силіконове кільце</text>
  <text x="660" y="327" font-size="12" fill="#6b7280">• Дренажні лабіринтні канали</text>
  <text x="660" y="349" font-size="12" fill="#27ae60">• Повна герметичність IP67</text>
  <text x="660" y="371" font-size="12" fill="#6b7280">• Захист від струменів води й олив</text>
  <text x="660" y="393" font-size="12" fill="#6b7280">• Морське та важке виконання</text>
</svg>
