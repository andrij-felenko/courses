<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="530" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Геометричні допуски вирізів панелі для Snap-In монтажу рокерів</text>
  <text x="480" y="52" font-size="13" text-anchor="middle" fill="#6b7280">Розміри вирізів під однополюсні (11×30 мм) та двополюсні (22×30 мм) перемикачі</text>

  <!-- LEFT PANEL: Single Pole 11x30 Cutout -->
  <rect x="30" y="75" width="420" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="240" y="96" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Однополюсний виріз (11×30 мм / SPST)</text>

  <!-- Panel Sheet Representation -->
  <rect x="75" y="135" width="290" height="190" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  
  <!-- Cutout Hole (x=160 to 280, width 120, height 140) -->
  <rect x="160" y="160" width="120" height="140" rx="2" fill="white" stroke="#2457d6" stroke-width="2"/>
  <text x="220" y="235" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">Виріз 11×30</text>

  <!-- Snap-In Tabs Icons -->
  <polygon points="220,160 214,153 226,153" fill="#2457d6"/>
  <polygon points="220,300 214,307 226,307" fill="#2457d6"/>
  <path d="M 145 205 L 157 195" fill="none" stroke="#2457d6" stroke-width="1" marker-end="url(#arr-blue)"/>
  <text x="45" y="210" font-size="11" text-anchor="start" fill="#2457d6">Snap-In фіксатор</text>

  <!-- Corner Radius Note -->
  <path d="M 145 175 L 158 162" fill="none" stroke="#6b7280" stroke-width="1" marker-end="url(#arr-black)"/>
  <text x="45" y="180" font-size="11" text-anchor="start" fill="#6b7280">R ≤ 0.5 мм (без фасок)</text>

  <!-- Width Dimension Line (Top) -->
  <line x1="160" y1="145" x2="280" y2="145" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-black)" marker-end="url(#arr-black)"/>
  <line x1="160" y1="160" x2="160" y2="140" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="280" y1="160" x2="280" y2="140" stroke="#1a1a1a" stroke-width="1"/>
  <text x="220" y="125" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">W = 11.0 (+0.2) мм</text>

  <!-- Height Dimension Line (Right) -->
  <line x1="305" y1="160" x2="305" y2="300" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-black)" marker-end="url(#arr-black)"/>
  <line x1="280" y1="160" x2="312" y2="160" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="280" y1="300" x2="312" y2="300" stroke="#1a1a1a" stroke-width="1"/>
  <text x="318" y="234" font-size="12" font-weight="bold" text-anchor="start" fill="#1a1a1a">H = 30.0 (+0.2) мм</text>

  <!-- Left Technical Specification Card -->
  <rect x="42" y="360" width="396" height="125" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="240" y="380" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">Залежність вирізу від товщини панелі t (SPST)</text>
  <text x="55" y="402" font-size="12" text-anchor="start" fill="#1a1a1a">• t = 0.75 ... 1.25 мм  ➔  Виріз: 11.2 × 28.6 мм</text>
  <text x="55" y="424" font-size="12" text-anchor="start" fill="#1a1a1a">• t = 1.25 ... 2.00 мм  ➔  Виріз: 11.2 × 28.8 мм</text>
  <text x="55" y="446" font-size="12" text-anchor="start" fill="#1a1a1a">• t = 2.00 ... 3.00 мм  ➔  Виріз: 11.2 × 29.2 мм</text>
  <text x="240" y="472" font-size="11" text-anchor="middle" fill="#6b7280">Допуск вирізу: +0.2 / -0.0 мм</text>


  <!-- RIGHT PANEL: Double Pole 22x30 Cutout -->
  <rect x="480" y="75" width="450" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="705" y="96" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Двополюсний виріз (22×30 мм / DPST)</text>

  <!-- Panel Sheet Representation -->
  <rect x="520" y="135" width="320" height="190" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  
  <!-- Cutout Hole (x=600 to 770, width 170, height 140) -->
  <rect x="600" y="160" width="170" height="140" rx="2" fill="white" stroke="#27ae60" stroke-width="2"/>
  <text x="685" y="235" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Виріз 22×30</text>

  <!-- Snap-In Tabs Icons -->
  <polygon points="600,200 593,194 593,206" fill="#27ae60"/>
  <polygon points="600,260 593,254 593,266" fill="#27ae60"/>
  <polygon points="770,200 777,194 777,206" fill="#27ae60"/>
  <polygon points="770,260 777,254 777,266" fill="#27ae60"/>
  <path d="M 588 205 L 596 200" fill="none" stroke="#27ae60" stroke-width="1" marker-start="url(#arr-green)"/>
  <text x="492" y="210" font-size="11" text-anchor="start" fill="#27ae60">Фіксатори snap-in</text>

  <!-- Corner Radius Note -->
  <path d="M 588 175 L 598 162" fill="none" stroke="#6b7280" stroke-width="1" marker-end="url(#arr-black)"/>
  <text x="495" y="180" font-size="11" text-anchor="start" fill="#6b7280">R ≤ 0.5 мм</text>

  <!-- Width Dimension Line (Top) -->
  <line x1="600" y1="145" x2="770" y2="145" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-black)" marker-end="url(#arr-black)"/>
  <line x1="600" y1="160" x2="600" y2="140" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="770" y1="160" x2="770" y2="140" stroke="#1a1a1a" stroke-width="1"/>
  <text x="685" y="125" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">W = 22.0 (+0.2) мм</text>

  <!-- Height Dimension Line (Right) -->
  <line x1="795" y1="160" x2="795" y2="300" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-black)" marker-end="url(#arr-black)"/>
  <line x1="770" y1="160" x2="802" y2="160" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="770" y1="300" x2="802" y2="300" stroke="#1a1a1a" stroke-width="1"/>
  <text x="808" y="234" font-size="12" font-weight="bold" text-anchor="start" fill="#1a1a1a">H = 30.0 (+0.2) мм</text>

  <!-- Right Technical Specification Card -->
  <rect x="495" y="360" width="420" height="125" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="705" y="380" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Залежність вирізу від товщини панелі t (DPST)</text>
  <text x="515" y="402" font-size="12" text-anchor="start" fill="#1a1a1a">• t = 0.75 ... 1.25 мм  ➔  Виріз: 21.9 × 30.0 мм</text>
  <text x="515" y="424" font-size="12" text-anchor="start" fill="#1a1a1a">• t = 1.25 ... 2.00 мм  ➔  Виріз: 21.9 × 30.2 мм</text>
  <text x="515" y="446" font-size="12" text-anchor="start" fill="#1a1a1a">• t = 2.00 ... 3.00 мм  ➔  Виріз: 21.9 × 30.5 мм</text>
  <text x="705" y="472" font-size="11" text-anchor="middle" fill="#6b7280">Забезпечує щільну фіксацію без люфту</text>
</svg>
