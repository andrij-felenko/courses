<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Marker Definitions -->
  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Еволюція комутаційних механізмів: від рубильника до клавішного перемикача</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Порівняння конструкції відкритого рубильника, важелевого тумблера та клавішного перемикача (Rocker)</text>

  <!-- CARD 1: OPEN KNIFE SWITCH -->
  <rect x="24" y="75" width="290" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="169" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Відкритий рубильник</text>
  <text x="169" y="118" text-anchor="middle" font-size="12" fill="#6b7280">Незахищена ножова група</text>

  <!-- Diagram Container 1 -->
  <rect x="44" y="135" width="250" height="170" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <!-- Base Plate -->
  <rect x="64" y="258" width="210" height="20" rx="2" fill="#78350f"/>
  <text x="169" y="273" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Ізоляційна основа</text>

  <!-- Jaw Contact & Blade -->
  <rect x="85" y="210" width="18" height="48" fill="#d97706" stroke="#b45309" stroke-width="1.5"/>
  <rect x="225" y="243" width="18" height="15" fill="#d97706" stroke="#b45309" stroke-width="1.5"/>
  <!-- Hinge Blade -->
  <line x1="234" y1="248" x2="105" y2="175" stroke="#d97706" stroke-width="6" stroke-linecap="round"/>
  <!-- Handle -->
  <circle cx="98" cy="170" r="10" fill="#b45309"/>

  <!-- Danger Arc Zone -->
  <circle cx="94" cy="205" r="22" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="169" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Відкриті контакти</text>
  <text x="169" y="294" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Ризик ураження струмом</text>

  <!-- Card 1 Badges -->
  <rect x="44" y="320" width="250" height="50" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="54" y="340" font-size="12" font-weight="bold" fill="#c0392b">Негабаритність і відкритість</text>
  <text x="54" y="358" font-size="12" fill="#1a1a1a">Високий ризик випадкового дотику</text>

  <rect x="44" y="380" width="250" height="50" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="54" y="400" font-size="12" font-weight="bold" fill="#c0392b">Вплив пилу та окиснення</text>
  <text x="54" y="418" font-size="12" fill="#1a1a1a">Відкритий іскровий проміжок</text>

  <rect x="44" y="440" width="250" height="50" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="54" y="460" font-size="12" font-weight="bold" fill="#1a1a1a">Монтаж: Гвинтовий на плату</text>
  <text x="54" y="478" font-size="12" fill="#6b7280">Потребує ізольованої шафи</text>

  <!-- CARD 2: TOGGLE SWITCH -->
  <rect x="335" y="75" width="290" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Важелевий тумблер</text>
  <text x="480" y="118" text-anchor="middle" font-size="12" fill="#6b7280">Закритий корпус із важелем</text>

  <!-- Diagram Container 2 -->
  <rect x="355" y="135" width="250" height="170" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <!-- Panel cutoff line -->
  <line x1="375" y1="205" x2="585" y2="205" stroke="#6b7280" stroke-dasharray="4,4"/>
  <text x="580" y="198" text-anchor="end" font-size="12" fill="#6b7280">Панель</text>

  <!-- Threaded Bushing -->
  <rect x="460" y="185" width="40" height="40" fill="#9ca3af" stroke="#4b5563" stroke-width="1.5"/>
  <!-- Internal Enclosed Body -->
  <rect x="415" y="225" width="130" height="45" rx="4" fill="#4b5563" stroke="#1f2937" stroke-width="1.5"/>
  <text x="480" y="252" text-anchor="middle" font-size="12" fill="#ffffff">Камера контактів</text>

  <!-- Protruding Lever -->
  <line x1="480" y1="200" x2="445" y2="155" stroke="#9ca3af" stroke-width="8" stroke-linecap="round"/>
  <circle cx="442" cy="151" r="8" fill="#d1d5db" stroke="#4b5563" stroke-width="1.5"/>

  <!-- Snag hazard alert arrow -->
  <path d="M405,145 Q420,138 428,144" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="400" y="148" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">Зачіпання</text>

  <text x="480" y="294" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Захист контактів усередині</text>

  <!-- Card 2 Badges -->
  <rect x="355" y="320" width="250" height="50" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="365" y="340" font-size="12" font-weight="bold" fill="#2457d6">Ізольована камера дуги</text>
  <text x="365" y="358" font-size="12" fill="#1a1a1a">Захист від пилу й випадкового дотику</text>

  <rect x="355" y="380" width="250" height="50" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="365" y="400" font-size="12" font-weight="bold" fill="#c0392b">Виступаючий важіль</text>
  <text x="365" y="418" font-size="12" fill="#1a1a1a">Ризик випадкового збивання станцій</text>

  <rect x="355" y="440" width="250" height="50" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="365" y="460" font-size="12" font-weight="bold" fill="#1a1a1a">Монтаж: Різьбова втулка</text>
  <text x="365" y="478" font-size="12" fill="#6b7280">Потребує фіксації гайкою та шайбою</text>

  <!-- CARD 3: ROCKER SWITCH -->
  <rect x="646" y="75" width="290" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="791" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Клавішний перемикач</text>
  <text x="791" y="118" text-anchor="middle" font-size="12" fill="#6b7280">Заполіцьована клавіша-гойдалка</text>

  <!-- Diagram Container 3 -->
  <rect x="666" y="135" width="250" height="170" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <!-- Panel cutoff line -->
  <line x1="686" y1="195" x2="896" y2="195" stroke="#6b7280" stroke-dasharray="4,4"/>
  <text x="890" y="188" text-anchor="end" font-size="12" fill="#6b7280">Панель</text>

  <!-- Enclosed Body (Snap-in housing) -->
  <rect x="741" y="195" width="100" height="65" rx="3" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
  <text x="791" y="238" text-anchor="middle" font-size="12" fill="#ffffff">Герметичний корпус</text>

  <!-- Snap-in Latch Wings -->
  <path d="M741,210 L731,220 L741,230 Z" fill="#475569"/>
  <path d="M841,210 L851,220 L841,230 Z" fill="#475569"/>
  <text x="725" y="224" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">Snap-in</text>

  <!-- Rocker Actuator -->
  <polygon points="738,195 791,183 844,195 844,172 738,172" fill="#2457d6" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="762" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">OFF</text>
  <text x="818" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#e9f7ef">ON</text>

  <text x="791" y="294" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Ергономічний гладкий профіль</text>

  <!-- Card 3 Badges -->
  <rect x="666" y="320" width="250" height="50" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="676" y="340" font-size="12" font-weight="bold" fill="#27ae60">Заполіцьований профіль (Flush)</text>
  <text x="676" y="358" font-size="12" fill="#1a1a1a">Унеможливлює випадкове збивання</text>

  <rect x="666" y="380" width="250" height="50" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="676" y="400" font-size="12" font-weight="bold" fill="#27ae60">Вбудована індикація</text>
  <text x="676" y="418" font-size="12" fill="#1a1a1a">Неонова або світлодіодна підсвітка</text>

  <rect x="666" y="440" width="250" height="50" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="676" y="460" font-size="12" font-weight="bold" fill="#2457d6">Монтаж: Затискний (Snap-in)</text>
  <text x="676" y="478" font-size="12" fill="#1a1a1a">Встановлення в один клік без інструментів</text>
</svg>
