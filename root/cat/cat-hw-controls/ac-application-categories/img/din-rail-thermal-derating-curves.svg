<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <text x="480" y="36" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Температурне пониження номінального струму контактора</text>
  <text x="480" y="58" font-size="13" text-anchor="middle" fill="#6b7280">Допустимий робочий струм I_op знижується при підвищенні температури в шафі понад +40 °C</text>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Plot background -->
  <rect x="90" y="90" width="540" height="300" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Warning region background -->
  <rect x="306" y="90" width="324" height="300" fill="#fdecea" opacity="0.5"/>
  <text x="468" y="115" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">Зона температурного зниження струму (&gt; 40 °C)</text>

  <!-- Grid lines -->
  <line x1="90" y1="150" x2="630" y2="150" stroke="#e1e4e8" stroke-dasharray="4,4"/>
  <line x1="90" y1="210" x2="630" y2="210" stroke="#e1e4e8" stroke-dasharray="4,4"/>
  <line x1="90" y1="270" x2="630" y2="270" stroke="#e1e4e8" stroke-dasharray="4,4"/>
  <line x1="90" y1="330" x2="630" y2="330" stroke="#e1e4e8" stroke-dasharray="4,4"/>

  <!-- Axes -->
  <line x1="90" y1="390" x2="645" y2="390" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="90" y1="390" x2="90" y2="75" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

  <text x="650" y="394" font-size="12" font-weight="bold" fill="#1a1a1a">T_amb (°C)</text>
  <text x="90" y="65" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">I_op / I_nom (%)</text>

  <!-- Y Ticks -->
  <text x="80" y="394" font-size="12" text-anchor="end" fill="#6b7280">50%</text>
  <text x="80" y="334" font-size="12" text-anchor="end" fill="#6b7280">65%</text>
  <text x="80" y="274" font-size="12" text-anchor="end" fill="#6b7280">80%</text>
  <text x="80" y="214" font-size="12" text-anchor="end" fill="#6b7280">90%</text>
  <text x="80" y="154" font-size="12" text-anchor="end" fill="#6b7280">100%</text>

  <!-- X Ticks -->
  <text x="90" y="412" font-size="12" text-anchor="middle" fill="#6b7280">20</text>
  <text x="198" y="412" font-size="12" text-anchor="middle" fill="#6b7280">30</text>
  <text x="306" y="412" font-size="12" text-anchor="middle" fill="#6b7280">40</text>
  <text x="414" y="412" font-size="12" text-anchor="middle" fill="#6b7280">50</text>
  <text x="522" y="412" font-size="12" text-anchor="middle" fill="#6b7280">60</text>
  <text x="630" y="412" font-size="12" text-anchor="middle" fill="#6b7280">70</text>

  <!-- Derating Curve -->
  <path d="M 90,150 L 306,150 L 414,210 L 522,286 L 630,350" fill="none" stroke="#c0392b" stroke-width="3"/>
  <circle cx="306" cy="150" r="5" fill="#27ae60"/>
  <circle cx="414" cy="210" r="5" fill="#c0392b"/>
  <circle cx="522" cy="286" r="5" fill="#c0392b"/>
  <circle cx="630" cy="350" r="5" fill="#c0392b"/>

  <!-- Callouts -->
  <text x="210" y="135" font-size="12" font-weight="bold" fill="#27ae60">100% (норма при &lt;= 40°C)</text>
  <text x="425" y="195" font-size="12" font-weight="bold" fill="#c0392b">90% при 50°C</text>
  <text x="535" y="270" font-size="12" font-weight="bold" fill="#c0392b">75% при 60°C</text>

  <!-- Right Side Summary Panel -->
  <rect x="670" y="90" width="240" height="300" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="790" y="120" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Формула розрахунку</text>
  
  <rect x="685" y="140" width="210" height="60" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="790" y="165" font-size="13" font-weight="bold" text-anchor="middle" fill="#2457d6">I_op = I_nom × K_temp</text>
  <text x="790" y="185" font-size="12" text-anchor="middle" fill="#1a1a1a">де K_temp залежить від T_amb</text>

  <rect x="685" y="220" width="210" height="150" fill="white" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="700" y="245" font-size="12" font-weight="bold" fill="#1a1a1a">Рекомендації:</text>
  <text x="700" y="270" font-size="12" fill="#1a1a1a">• Примусова вентиляція шафи</text>
  <text x="700" y="295" font-size="12" fill="#1a1a1a">• Залишати 0.5U зазори</text>
  <text x="700" y="320" font-size="12" fill="#1a1a1a">• Обирати контактор +25%</text>
</svg>
