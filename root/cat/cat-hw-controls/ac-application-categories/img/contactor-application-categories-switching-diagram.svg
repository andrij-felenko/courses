<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <rect width="800" height="400" fill="#1e1e2e" rx="12"/>
  <text x="400" y="35" fill="#cba6f7" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Категорії застосування контакторів: AC-1 vs AC-3</text>

  <g transform="translate(40, 60)">
    <rect width="340" height="300" fill="#181825" stroke="#45475a" stroke-width="1.5" rx="8"/>
    <text x="170" y="30" fill="#89b4fa" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Категорія AC-1 (Омічне навантаження)</text>
    <path d="M 40 240 L 100 240 L 100 100 L 280 100 L 280 240 L 320 240" fill="none" stroke="#a6e3a1" stroke-width="3"/>
    <text x="190" y="90" fill="#a6e3a1" font-family="sans-serif" font-size="13" text-anchor="middle">I_inrush = I_nom</text>
    <text x="170" y="270" fill="#bac2de" font-family="sans-serif" font-size="12" text-anchor="middle">Пусковий кидок струму відсутній</text>
    <text x="170" y="288" fill="#a6adc8" font-family="sans-serif" font-size="11" text-anchor="middle">cos φ ≥ 0.95</text>
  </g>

  <g transform="translate(420, 60)">
    <rect width="340" height="300" fill="#181825" stroke="#45475a" stroke-width="1.5" rx="8"/>
    <text x="170" y="30" fill="#f38ba8" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Категорія AC-3 (Двигуни AC)</text>
    <path d="M 40 240 L 80 240 L 80 60 L 130 140 L 300 140 L 300 240 L 320 240" fill="none" stroke="#f38ba8" stroke-width="3"/>
    <text x="105" y="50" fill="#f38ba8" font-family="sans-serif" font-size="13" font-weight="bold" text-anchor="middle">I_inrush = 5...8 · I_nom</text>
    <text x="215" y="130" fill="#fab387" font-family="sans-serif" font-size="12" text-anchor="middle">I_nom (робочий режим)</text>
    <text x="170" y="270" fill="#bac2de" font-family="sans-serif" font-size="12" text-anchor="middle">Важкий пуск асинхронного двигуна</text>
    <text x="170" y="288" fill="#a6adc8" font-family="sans-serif" font-size="11" text-anchor="middle">cos φ = 0.35 ... 0.65</text>
  </g>
</svg>
