<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="100%" height="100%">
  <rect width="800" height="400" fill="#1e1e2e" rx="12"/>
  <text x="400" y="35" fill="#cba6f7" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Дерейтинг струму контакторів на DIN-рейці</text>

  <g transform="translate(60, 60)">
    <rect width="680" height="300" fill="#181825" stroke="#45475a" stroke-width="1.5" rx="8"/>
    <line x1="60" y1="240" x2="620" y2="240" stroke="#6c7086" stroke-width="2"/>
    <line x1="60" y1="40" x2="60" y2="240" stroke="#6c7086" stroke-width="2"/>

    <text x="600" y="270" fill="#bac2de" font-family="sans-serif" font-size="12" text-anchor="middle">Температура, °C</text>
    <text x="30" y="30" fill="#bac2de" font-family="sans-serif" font-size="12" text-anchor="middle">K_factor</text>

    <line x1="60" y1="80" x2="620" y2="80" stroke="#313244" stroke-dasharray="4"/>
    <text x="45" y="85" fill="#a6adc8" font-family="sans-serif" font-size="11">1.0</text>

    <line x1="60" y1="130" x2="620" y2="130" stroke="#313244" stroke-dasharray="4"/>
    <text x="45" y="135" fill="#a6adc8" font-family="sans-serif" font-size="11">0.8</text>

    <line x1="60" y1="180" x2="620" y2="180" stroke="#313244" stroke-dasharray="4"/>
    <text x="45" y="185" fill="#a6adc8" font-family="sans-serif" font-size="11">0.6</text>

    <text x="60" y="255" fill="#a6adc8" font-family="sans-serif" font-size="11">20°C</text>
    <text x="200" y="255" fill="#a6adc8" font-family="sans-serif" font-size="11">40°C</text>
    <text x="340" y="255" fill="#a6adc8" font-family="sans-serif" font-size="11">50°C</text>
    <text x="480" y="255" fill="#a6adc8" font-family="sans-serif" font-size="11">60°C</text>

    <path d="M 60 80 L 200 80 L 340 105 L 480 130" fill="none" stroke="#a6e3a1" stroke-width="3"/>
    <text x="500" y="125" fill="#a6e3a1" font-family="sans-serif" font-size="12">З зазором >9мм (K_density=1.0)</text>

    <path d="M 60 130 L 200 130 L 340 155 L 480 180" fill="none" stroke="#f38ba8" stroke-width="3"/>
    <text x="500" y="175" fill="#f38ba8" font-family="sans-serif" font-size="12">Щільний ряд без зазору (K_density=0.8)</text>
  </g>
</svg>
