<svg viewBox="0 0 960 480" width="960" height="480" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Marker Definitions -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Архітектура конвеєра обробки сигналів джойстика</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Послідовна обробка: сирі відліки АЦП → калібрування → мертва зона → EMA-фільтрація</text>

  <!-- Stage 1: ADC Raw Input -->
  <rect x="30" y="90" width="155" height="250" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="107" y="114" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Вхід АЦП</text>
  <text x="107" y="130" font-size="12" fill="#6b7280" text-anchor="middle">Raw ADC Data</text>

  <rect x="45" y="145" width="125" height="32" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="107" y="166" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ADC_X (0..4095)</text>

  <rect x="45" y="190" width="125" height="32" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="107" y="211" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ADC_Y (0..4095)</text>

  <text x="107" y="255" font-size="12" fill="#6b7280" text-anchor="middle">Аналогова напруга</text>
  <text x="107" y="275" font-size="12" fill="#6b7280" text-anchor="middle">з двох потенціометрів</text>
  <text x="107" y="295" font-size="12" fill="#6b7280" text-anchor="middle">або датчиків Холла</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="185" y1="215" x2="215" y2="215" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Stage 2: Calibration -->
  <rect x="215" y="90" width="175" height="250" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="302" y="114" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">2. Калібрування</text>
  <text x="302" y="130" font-size="12" fill="#6b7280" text-anchor="middle">Центрування та шкала</text>

  <rect x="225" y="142" width="155" height="105" rx="4" fill="white" stroke="#2457d6"/>
  <text x="302" y="162" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Центрування нуля</text>
  <text x="302" y="182" font-size="12" fill="#1a1a1a" text-anchor="middle">Xc = Xraw - Xzero</text>
  <text x="302" y="210" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Масштабування</text>
  <text x="302" y="230" font-size="12" fill="#1a1a1a" text-anchor="middle">Xnorm ∈ [-1.0, +1.0]</text>

  <text x="302" y="275" font-size="12" fill="#6b7280" text-anchor="middle">Компенсація асиметрії</text>
  <text x="302" y="295" font-size="12" fill="#6b7280" text-anchor="middle">та початкового зсуву</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="390" y1="215" x2="420" y2="215" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Stage 3: Scaled Radial Deadzone -->
  <rect x="420" y="90" width="185" height="250" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="512" y="114" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">3. Мертва зона</text>
  <text x="512" y="130" font-size="12" fill="#6b7280" text-anchor="middle">Scaled Radial Deadzone</text>

  <rect x="428" y="142" width="169" height="105" rx="4" fill="white" stroke="#27ae60"/>
  <text x="512" y="162" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Радіус r = √(X² + Y²)</text>
  <text x="512" y="182" font-size="12" fill="#1a1a1a" text-anchor="middle">r &lt; r_dead → (0, 0)</text>
  <text x="512" y="210" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Динамічний скейлінг</text>
  <text x="512" y="230" font-size="12" fill="#1a1a1a" text-anchor="middle">r' = (r - r_d)/(1 - r_d)</text>

  <text x="512" y="275" font-size="12" fill="#6b7280" text-anchor="middle">Придушення механічного</text>
  <text x="512" y="295" font-size="12" fill="#6b7280" text-anchor="middle">дрейфу в зоні спокою</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="605" y1="215" x2="635" y2="215" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Stage 4: EMA Filter -->
  <rect x="635" y="90" width="165" height="250" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="717" y="114" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">4. EMA-фільтр</text>
  <text x="717" y="130" font-size="12" fill="#6b7280" text-anchor="middle">Експоненційний фільтр</text>

  <rect x="645" y="142" width="145" height="105" rx="4" fill="white" stroke="#2457d6"/>
  <text x="717" y="162" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Формула EMA</text>
  <text x="717" y="182" font-size="12" fill="#1a1a1a" text-anchor="middle">y = α·x + (1-α)·y_prev</text>
  <text x="717" y="210" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Параметр α ∈ (0, 1]</text>
  <text x="717" y="230" font-size="12" fill="#1a1a1a" text-anchor="middle">Згладжування шумів</text>

  <text x="717" y="275" font-size="12" fill="#6b7280" text-anchor="middle">Придушення високо-</text>
  <text x="717" y="295" font-size="12" fill="#6b7280" text-anchor="middle">частотного шуму АЦП</text>

  <!-- Arrow 4 -> Output -->
  <line x1="800" y1="215" x2="825" y2="215" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Stage 5: Output Vector -->
  <rect x="825" y="140" width="110" height="150" rx="8" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
  <text x="880" y="165" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вихід</text>
  <text x="880" y="195" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вектор V</text>
  <text x="880" y="220" font-size="12" fill="#1a1a1a" text-anchor="middle">(Vx, Vy)</text>
  <text x="880" y="245" font-size="12" fill="#6b7280" text-anchor="middle">[-1.0, +1.0]</text>

  <!-- Bottom Panel 1: EEPROM Storage -->
  <rect x="215" y="365" width="390" height="85" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="410" y="390" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Енергонезалежна пам'ять (Flash / EEPROM)</text>
  <text x="410" y="412" font-size="12" fill="#1a1a1a" text-anchor="middle">Збережені константи калібрування:</text>
  <text x="410" y="432" font-size="12" fill="#6b7280" text-anchor="middle">X_zero, Y_zero, Min/Max межі, r_dead</text>

  <!-- Vertical Arrows from EEPROM to Calibration & Deadzone -->
  <line x1="302" y1="365" x2="302" y2="340" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="512" y1="365" x2="512" y2="340" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Bottom Panel 2: Real-time Requirements -->
  <rect x="635" y="365" width="300" height="85" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="785" y="390" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Вимоги до обробки в ТРЧ</text>
  <text x="785" y="412" font-size="12" fill="#1a1a1a" text-anchor="middle">Частота опитування АЦП: ≥ 100 Гц</text>
  <text x="785" y="432" font-size="12" fill="#6b7280" text-anchor="middle">Повна відсутність дрейфу в спокої</text>
</svg>
