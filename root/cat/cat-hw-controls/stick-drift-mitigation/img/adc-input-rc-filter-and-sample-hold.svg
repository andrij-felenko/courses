<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Marker definition for arrows -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="40" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RC-фільтр аналогового входу та ланцюг вибірки-утримання АЦП</text>
  <text x="480" y="62" font-size="13" text-anchor="middle" fill="#6b7280">Зовнішня ємність C_ext швидше заряджає внутрішнє C_ADC, запобігаючи просіданню напруги</text>

  <!-- Left Container Panel: Circuit Schematic -->
  <rect x="30" y="80" width="600" height="380" fill="#f4f6f8" stroke="#d0d7de" rx="8"/>
  <text x="45" y="103" font-size="13" font-weight="bold" fill="#1a1a1a">Схема сполучення датчика та АЦП мікроконтролера</text>

  <!-- Sub-panel 1: Sensor / Potentiometer -->
  <rect x="45" y="120" width="130" height="320" fill="white" stroke="#d0d7de" rx="6"/>
  <text x="110" y="140" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Датчик (Джойстик)</text>
  <text x="110" y="155" font-size="11" text-anchor="middle" fill="#6b7280">Вихідний потенціометр</text>

  <text x="110" y="177" font-size="11" font-weight="bold" text-anchor="middle" fill="#2457d6">VDD (3.3V)</text>
  <line x1="110" y1="181" x2="110" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Potentiometer Resistor Body -->
  <rect x="95" y="200" width="30" height="80" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="88" y="245" font-size="11" text-anchor="end" fill="#6b7280">R_pot</text>

  <line x1="110" y1="280" x2="110" y2="300" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Sensor Ground AGND -->
  <line x1="95" y1="300" x2="125" y2="300" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="100" y1="305" x2="120" y2="305" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="105" y1="310" x2="115" y2="310" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="110" y="327" font-size="11" text-anchor="middle" fill="#6b7280">AGND</text>

  <!-- Wiper Output Wire -->
  <line x1="125" y1="240" x2="175" y2="240" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="150" y="229" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">V_in</text>

  <!-- Signal Trace from Sensor to Filter -->
  <line x1="175" y1="240" x2="215" y2="240" stroke="#1a1a1a" stroke-width="2"/>

  <!-- External Resistor R_ext -->
  <rect x="215" y="228" width="55" height="24" fill="white" stroke="#1a1a1a" stroke-width="1.5" rx="3"/>
  <text x="242" y="220" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">R_ext</text>
  <text x="242" y="267" font-size="11" text-anchor="middle" fill="#6b7280">1 kΩ</text>

  <!-- Signal Wire from R_ext to Node C_ext -->
  <line x1="270" y1="240" x2="310" y2="240" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="310" cy="240" r="3.5" fill="#1a1a1a"/>

  <!-- External Capacitor C_ext (Shunt) -->
  <rect x="272" y="277" width="76" height="50" fill="#e9f7ef" stroke="#27ae60" stroke-dasharray="3,3" rx="4"/>
  <line x1="310" y1="240" x2="310" y2="285" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- C_ext Plates -->
  <line x1="292" y1="285" x2="328" y2="285" stroke="#27ae60" stroke-width="2.5"/>
  <line x1="292" y1="293" x2="328" y2="293" stroke="#27ae60" stroke-width="2.5"/>
  <text x="354" y="289" font-size="12" font-weight="bold" text-anchor="start" fill="#27ae60">C_ext</text>
  <text x="354" y="305" font-size="11" text-anchor="start" fill="#27ae60">10 nF (Фільтр)</text>

  <line x1="310" y1="293" x2="310" y2="330" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- AGND Symbol for C_ext -->
  <line x1="295" y1="330" x2="325" y2="330" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="300" y1="335" x2="320" y2="335" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="305" y1="340" x2="315" y2="340" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="310" y="357" font-size="11" text-anchor="middle" fill="#6b7280">AGND</text>

  <!-- Wire from C_ext Node to MCU Pin ADC_IN -->
  <line x1="310" y1="240" x2="415" y2="240" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Sub-panel 2: MCU ADC Internal Circuit -->
  <rect x="415" y="120" width="200" height="320" fill="#eaf0fd" stroke="#2457d6" stroke-dasharray="4,4" rx="6"/>
  <text x="515" y="140" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">Мікроконтролер (АЦП)</text>

  <!-- ADC_IN Pin -->
  <circle cx="415" cy="240" r="4" fill="#2457d6"/>
  <text x="415" y="227" font-size="11" font-weight="bold" text-anchor="middle" fill="#2457d6">ADC_IN</text>

  <!-- Sampling Switch S_samp -->
  <line x1="415" y1="240" x2="435" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="435" cy="240" r="2.5" fill="#1a1a1a"/>
  <circle cx="465" cy="240" r="2.5" fill="#1a1a1a"/>
  <line x1="435" y1="240" x2="462" y2="227" stroke="#1a1a1a" stroke-width="2"/>

  <text x="450" y="185" font-size="11" text-anchor="middle" fill="#1a1a1a">Ключ S_samp</text>
  <text x="450" y="200" font-size="10" text-anchor="middle" fill="#2457d6">(замкнено t_samp)</text>
  <line x1="450" y1="203" x2="450" y2="219" stroke="#2457d6" stroke-width="1" marker-end="url(#arr-blue)"/>

  <!-- Internal Sampling Resistor R_ADC -->
  <line x1="465" y1="240" x2="480" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="480" y="230" width="45" height="20" fill="white" stroke="#1a1a1a" stroke-width="1.5" rx="2"/>
  <text x="502" y="222" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">R_ADC</text>
  <text x="502" y="263" font-size="10" text-anchor="middle" fill="#6b7280">1–2 kΩ</text>

  <!-- Wire to C_ADC Node -->
  <line x1="525" y1="240" x2="550" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="550" cy="240" r="3.5" fill="#1a1a1a"/>

  <!-- Sampling Capacitor C_ADC -->
  <line x1="550" y1="240" x2="550" y2="285" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="535" y1="285" x2="565" y2="285" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="535" y1="293" x2="565" y2="293" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="525" y="289" font-size="11" font-weight="bold" text-anchor="end" fill="#1a1a1a">C_ADC</text>
  <text x="525" y="303" font-size="10" text-anchor="end" fill="#6b7280">5–15 pF</text>

  <line x1="550" y1="293" x2="550" y2="330" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Internal AGND Symbol -->
  <line x1="535" y1="330" x2="565" y2="330" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="540" y1="335" x2="560" y2="335" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="545" y1="340" x2="555" y2="340" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="550" y="357" font-size="11" text-anchor="middle" fill="#6b7280">AGND</text>

  <!-- Signal Path to Converter Core -->
  <line x1="550" y1="240" x2="575" y2="240" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="575" y="220" width="32" height="40" fill="white" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="591" y="244" font-size="11" font-weight="bold" text-anchor="middle" fill="#2457d6">ADC</text>

  <!-- Right Container Panel: Principles & Analysis -->
  <rect x="645" y="80" width="285" height="380" fill="#f4f6f8" stroke="#d0d7de" rx="8"/>
  <text x="660" y="103" font-size="13" font-weight="bold" fill="#1a1a1a">Аналіз перерозподілу заряду</text>

  <!-- Box 1 (Green / Success): With C_ext -->
  <rect x="655" y="120" width="265" height="155" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="668" y="140" font-size="12" font-weight="bold" fill="#27ae60">З використанням C_ext (Рекомендовано)</text>
  <text x="668" y="163" font-size="11" fill="#1a1a1a">Умова: C_ext ≥ 100 × C_ADC</text>
  <text x="668" y="183" font-size="11" fill="#1a1a1a">Заряд C_ADC відбувається від C_ext:</text>
  <text x="668" y="205" font-size="11" font-weight="bold" fill="#27ae60">ΔV = V_in × [ C_ADC / (C_ext + C_ADC) ]</text>
  <text x="668" y="227" font-size="11" fill="#1a1a1a">При 10 nF / 10 pF: ΔV ≈ 0.001 × V_in</text>
  <text x="668" y="249" font-size="11" font-weight="bold" fill="#27ae60">✓ Просідання &lt; 1 LSB, відсутній дрейф!</text>

  <!-- Box 2 (Red / Warning): Without C_ext -->
  <rect x="655" y="290" width="265" height="155" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <text x="668" y="310" font-size="12" font-weight="bold" fill="#c0392b">Без C_ext (Високий опір джерела)</text>
  <text x="668" y="333" font-size="11" fill="#1a1a1a">Стала часу: τ = (R_src + R_ADC) × C_ADC</text>
  <text x="668" y="353" font-size="11" fill="#1a1a1a">Якщо R_pot = 10 kΩ, τ є занадто великою</text>
  <text x="668" y="375" font-size="11" fill="#c0392b">C_ADC не встигає зарядитися за t_samp</text>
  <text x="668" y="397" font-size="11" fill="#1a1a1a">Виникає похибка квантування АЦП</text>
  <text x="668" y="419" font-size="11" font-weight="bold" fill="#c0392b">✗ Шум, дрейф нуля джойстика!</text>
</svg>
