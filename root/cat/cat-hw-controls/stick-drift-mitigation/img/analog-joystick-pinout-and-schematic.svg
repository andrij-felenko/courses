<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема підключення аналогового джойстика до мікроконтролера</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Осі VRX/VRY підключаються до АЦП, кнопка SW — до входу GPIO з підтяжкою Pull-Up</text>

  <!-- Блок 1: Модуль джойстика (KY-023) -->
  <rect x="40" y="90" width="380" height="410" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="230" y="116" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Модуль джойстика (KY-023)</text>

  <!-- Потенціометр осі X -->
  <rect x="55" y="135" width="315" height="100" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="70" y="156" font-size="13" font-weight="bold" fill="#2457d6">Потенціометр осі X (10 кОм)</text>
  <text x="180" y="166" font-size="12" fill="#6b7280" text-anchor="middle">R_X = 10 кОм</text>
  <line x1="95" y1="180" x2="140" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="140" y="172" width="80" height="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="220" y1="180" x2="310" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M180,198 L180,188" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <path d="M180,198 L180,215 L420,215" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Потенціометр осі Y -->
  <rect x="55" y="250" width="315" height="100" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="70" y="271" font-size="13" font-weight="bold" fill="#2457d6">Потенціометр осі Y (10 кОм)</text>
  <text x="180" y="281" font-size="12" fill="#6b7280" text-anchor="middle">R_Y = 10 кОм</text>
  <line x1="95" y1="295" x2="140" y2="295" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="140" y="287" width="80" height="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="220" y1="295" x2="310" y2="295" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M180,313 L180,303" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <path d="M180,313 L180,330 L420,330" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Кнопка SW -->
  <rect x="55" y="365" width="315" height="115" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="70" y="386" font-size="13" font-weight="bold" fill="#1a1a1a">Тактильна кнопка (SW)</text>

  <!-- Перемикач -->
  <line x1="95" y1="425" x2="150" y2="425" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="150" cy="425" r="3" fill="#1a1a1a"/>
  <line x1="150" y1="417" x2="205" y2="410" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="177" y1="402" x2="177" y2="412" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="167" y1="402" x2="187" y2="402" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="210" cy="425" r="3" fill="#1a1a1a"/>
  <line x1="210" y1="425" x2="420" y2="425" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Захисний конденсатор C_deb -->
  <line x1="260" y1="425" x2="260" y2="440" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="260" y1="465" x2="260" y2="475" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="250" y1="440" x2="270" y2="440" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="250" y1="446" x2="270" y2="446" stroke="#1a1a1a" stroke-width="2"/>
  <text x="278" y="450" font-size="12" fill="#6b7280">C_deb = 100 нФ</text>
  <circle cx="260" cy="425" r="3" fill="#1a1a1a"/>
  <circle cx="260" cy="475" r="3" fill="#1a1a1a"/>

  <!-- Внутрішні лінії живлення джойстика -->
  <!-- VCC Rail (червона) -->
  <path d="M420,140 L95,140 L95,295" fill="none" stroke="#c0392b" stroke-width="2"/>
  <circle cx="95" cy="180" r="3" fill="#c0392b"/>
  <circle cx="95" cy="295" r="3" fill="#c0392b"/>

  <!-- GND Rail (темна) -->
  <path d="M310,180 L310,295 L310,475 L420,475" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="95" y1="425" x2="95" y2="475" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="95" y1="475" x2="310" y2="475" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="310" cy="180" r="3" fill="#1a1a1a"/>
  <circle cx="310" cy="295" r="3" fill="#1a1a1a"/>
  <circle cx="95" cy="425" r="3" fill="#1a1a1a"/>

  <!-- Клеми модуля (виходи) -->
  <circle cx="420" cy="140" r="4" fill="#c0392b"/>
  <text x="405" y="132" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">VCC</text>

  <circle cx="420" cy="215" r="4" fill="#2457d6"/>
  <text x="405" y="210" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">VRX</text>

  <circle cx="420" cy="330" r="4" fill="#2457d6"/>
  <text x="405" y="325" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">VRY</text>

  <circle cx="420" cy="425" r="4" fill="#1a1a1a"/>
  <text x="405" y="420" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">SW</text>

  <circle cx="420" cy="475" r="4" fill="#1a1a1a"/>
  <text x="405" y="470" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">GND</text>

  <!-- Блок 2: З'єднувальні лінії та підтяжка Pull-Up -->
  <!-- VCC Line -->
  <line x1="420" y1="140" x2="640" y2="140" stroke="#c0392b" stroke-width="2"/>
  <circle cx="530" cy="140" r="3.5" fill="#c0392b"/>

  <!-- Pull-Up Resistor R_pullup -->
  <line x1="530" y1="140" x2="530" y2="365" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="522" y="365" width="16" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="546" y="389" font-size="12" fill="#1a1a1a">R_pullup = 10 кОм</text>
  <line x1="530" y1="405" x2="530" y2="425" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- VRX Signal Line -->
  <line x1="420" y1="215" x2="632" y2="215" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="530" y="205" font-size="12" fill="#2457d6" text-anchor="middle">VRX (0 ... VCC)</text>

  <!-- VRY Signal Line -->
  <line x1="420" y1="330" x2="632" y2="330" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="530" y="320" font-size="12" fill="#2457d6" text-anchor="middle">VRY (0 ... VCC)</text>

  <!-- SW Signal Line -->
  <line x1="420" y1="425" x2="632" y2="425" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>
  <circle cx="530" cy="425" r="3.5" fill="#1a1a1a"/>
  <text x="475" y="445" font-size="12" fill="#6b7280">SW (active-low)</text>

  <!-- GND Line -->
  <line x1="420" y1="475" x2="640" y2="475" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Блок 3: Мікроконтролер (MCU) -->
  <rect x="640" y="90" width="280" height="410" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="780" y="116" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">Мікроконтролер (MCU)</text>

  <!-- VCC Pin MCU -->
  <circle cx="640" cy="140" r="4" fill="#c0392b"/>
  <text x="655" y="144" font-size="12" font-weight="bold" fill="#c0392b">VCC (3.3V / 5V)</text>

  <!-- АЦП блок -->
  <rect x="660" y="175" width="240" height="185" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="780" y="196" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Модуль АЦП (ADC)</text>

  <!-- ADC_IN0 (X) -->
  <circle cx="640" cy="215" r="4" fill="#2457d6"/>
  <line x1="640" y1="215" x2="670" y2="215" stroke="#2457d6" stroke-width="1.5"/>
  <text x="675" y="225" font-size="12" font-weight="bold" fill="#1a1a1a">Канал ADC_IN0 (Вісь X)</text>
  <text x="675" y="243" font-size="12" fill="#6b7280">Відліки: 0 ... 4095</text>

  <!-- ADC_IN1 (Y) -->
  <circle cx="640" cy="330" r="4" fill="#2457d6"/>
  <line x1="640" y1="330" x2="670" y2="330" stroke="#2457d6" stroke-width="1.5"/>
  <text x="675" y="305" font-size="12" font-weight="bold" fill="#1a1a1a">Канал ADC_IN1 (Вісь Y)</text>
  <text x="675" y="323" font-size="12" fill="#6b7280">Відліки: 0 ... 4095</text>

  <!-- GPIO_SW блок -->
  <rect x="660" y="380" width="240" height="70" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <circle cx="640" cy="425" r="4" fill="#1a1a1a"/>
  <line x1="640" y1="425" x2="670" y2="425" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="675" y="405" font-size="12" font-weight="bold" fill="#1a1a1a">Вхід GPIO_SW (Кнопка)</text>
  <text x="675" y="425" font-size="12" fill="#6b7280">HIGH = відпущено / LOW = натиснуто</text>

  <!-- GND Pin MCU -->
  <circle cx="640" cy="475" r="4" fill="#1a1a1a"/>
  <text x="655" y="479" font-size="12" font-weight="bold" fill="#1a1a1a">GND (Спільна земля)</text>
</svg>
