<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Порівняння алгоритмів мертвих зон аналогового маніпулятора</text>
  <text x="480" y="48" text-anchor="middle" font-size="13" fill="#6b7280">Вплив геометрії маскування дрейфу нуля на лінійність відгуку та плавність керування в 360°</text>

  <!-- PANEL 1: AXIAL DEADZONE -->
  <rect x="25" y="65" width="286" height="370" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="168" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">1. Осьова (Axial)</text>
  <text x="168" y="106" text-anchor="middle" font-size="12" fill="#6b7280">Незалежний фільтр по X та Y</text>

  <!-- Panel 1 Grid -->
  <circle cx="168" cy="215" r="75" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="78" y1="215" x2="258" y2="215" stroke="#d0d7de" stroke-width="1"/>
  <line x1="168" y1="125" x2="168" y2="305" stroke="#d0d7de" stroke-width="1"/>
  <text x="262" y="219" text-anchor="start" font-size="12" fill="#6b7280">+X</text>
  <text x="168" y="120" text-anchor="middle" font-size="12" fill="#6b7280">+Y</text>

  <!-- Panel 1 Deadzone Cross -->
  <rect x="88" y="203" width="160" height="24" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="156" y="135" width="24" height="160" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="157" y="204" width="22" height="22" fill="#fdecea" stroke="none"/>
  
  <!-- Panel 1 Drift Point & Label Positioned Safely -->
  <circle cx="178" cy="207" r="4" fill="#c0392b"/>
  <line x1="178" y1="207" x2="186" y2="184" stroke="#c0392b" stroke-width="1"/>
  <text x="186" y="180" font-size="12" fill="#c0392b">Дрейф</text>

  <!-- Panel 1 Status Card -->
  <rect x="37" y="322" width="262" height="98" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="47" y="342" font-size="13" font-weight="bold" fill="#c0392b">⛔ Хрестоподібне злипання</text>
  <text x="47" y="362" font-size="12" fill="#1a1a1a">Маскує дрейф, але «притягує»</text>
  <text x="47" y="379" font-size="12" fill="#1a1a1a">рух до осей X/Y. Діагоналі</text>
  <text x="47" y="396" font-size="12" fill="#6b7280">спотворені прямокутною зоною.</text>


  <!-- PANEL 2: SIMPLE RADIAL DEADZONE -->
  <rect x="337" y="65" width="286" height="370" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">2. Проста радіальна</text>
  <text x="480" y="106" text-anchor="middle" font-size="12" fill="#6b7280">Фільтр за радіусом r &lt; dz</text>

  <!-- Panel 2 Grid -->
  <circle cx="480" cy="215" r="75" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="390" y1="215" x2="570" y2="215" stroke="#d0d7de" stroke-width="1"/>
  <line x1="480" y1="125" x2="480" y2="305" stroke="#d0d7de" stroke-width="1"/>
  <text x="574" y="219" text-anchor="start" font-size="12" fill="#6b7280">+X</text>
  <text x="480" y="120" text-anchor="middle" font-size="12" fill="#6b7280">+Y</text>

  <!-- Panel 2 Deadzone Circle -->
  <circle cx="480" cy="215" r="28" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  
  <!-- Panel 2 Drift Point & Label Positioned Safely -->
  <circle cx="490" cy="207" r="4" fill="#c0392b"/>
  <line x1="490" y1="207" x2="498" y2="184" stroke="#c0392b" stroke-width="1"/>
  <text x="498" y="180" font-size="12" fill="#c0392b">Дрейф</text>
  
  <line x1="480" y1="215" x2="508" y2="215" stroke="#c0392b" stroke-width="1.5"/>
  <text x="494" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">dz</text>
  
  <!-- Step jump arrow outside boundary -->
  <line x1="508" y1="215" x2="538" y2="215" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Panel 2 Status Card -->
  <rect x="349" y="322" width="262" height="98" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="359" y="342" font-size="13" font-weight="bold" fill="#c0392b">⚠️ Стрибок сили відгуку</text>
  <text x="359" y="362" font-size="12" fill="#1a1a1a">Зберігає круглу симетрію 360°,</text>
  <text x="359" y="379" font-size="12" fill="#1a1a1a">але при перетині r = dz сигнал</text>
  <text x="359" y="396" font-size="12" fill="#6b7280">раптово стрибає від 0 до dz.</text>


  <!-- PANEL 3: SCALED RADIAL DEADZONE -->
  <rect x="649" y="65" width="286" height="370" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="792" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">3. Масштабована радіальна</text>
  <text x="792" y="106" text-anchor="middle" font-size="12" fill="#27ae60">Плавне нормування (r-dz)/(1-dz)</text>

  <!-- Panel 3 Grid -->
  <circle cx="792" cy="215" r="75" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="702" y1="215" x2="882" y2="215" stroke="#d0d7de" stroke-width="1"/>
  <line x1="792" y1="125" x2="792" y2="305" stroke="#d0d7de" stroke-width="1"/>
  <text x="886" y="219" text-anchor="start" font-size="12" fill="#6b7280">+X</text>
  <text x="792" y="120" text-anchor="middle" font-size="12" fill="#6b7280">+Y</text>

  <!-- Panel 3 Deadzone Circle -->
  <circle cx="792" cy="215" r="28" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  
  <!-- Panel 3 Drift Point & Label Positioned Safely -->
  <circle cx="802" cy="207" r="4" fill="#27ae60"/>
  <line x1="802" y1="207" x2="810" y2="184" stroke="#27ae60" stroke-width="1"/>
  <text x="810" y="180" font-size="12" fill="#27ae60">Дрейф</text>

  <line x1="792" y1="215" x2="820" y2="215" stroke="#27ae60" stroke-width="1.5"/>
  <text x="806" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">dz</text>

  <!-- Radial Scaling Outward Arrows (4 Cardinal Directions to avoid text box) -->
  <line x1="820" y1="215" x2="855" y2="215" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="764" y1="215" x2="729" y2="215" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="792" y1="187" x2="792" y2="152" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="792" y1="243" x2="792" y2="278" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Panel 3 Status Card -->
  <rect x="661" y="322" width="262" height="98" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="671" y="342" font-size="13" font-weight="bold" fill="#27ae60">✅ Плавне нормування (0..1)</text>
  <text x="671" y="362" font-size="12" fill="#1a1a1a">Дрейф повністю пригнічено.</text>
  <text x="671" y="379" font-size="12" fill="#1a1a1a">Вихідний вектор зростає плавно</text>
  <text x="671" y="396" font-size="12" fill="#27ae60">від 0% на межі dz до 100% на краях.</text>
</svg>
