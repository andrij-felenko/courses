<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Фізичні причини виникнення дрейфу нуля (Stick Drift)</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Поєднання абразивного зносу вуглецевого шару та механічної втоми пружини зміщує сигнал спокою за межі deadzone</text>

  <!-- Панель 1: Електричний знос -->
  <rect x="30" y="80" width="435" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="45" y="95" width="405" height="32" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="247" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">1. Абразивний знос резистивної доріжки</text>

  <!-- Текст позначок потенціометра -->
  <text x="60" y="136" font-size="12" fill="#6b7280">Вуглецеве покриття</text>
  <text x="320" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Знос шару (зміна R)</text>

  <!-- Основа та вуглецева доріжка -->
  <rect x="60" y="145" width="375" height="24" rx="3" fill="#d0d7de"/>
  <rect x="60" y="145" width="375" height="24" rx="2" fill="#333333"/>
  <rect x="60" y="145" width="80" height="24" fill="#2c3e50"/>
  <rect x="355" y="145" width="80" height="24" fill="#2c3e50"/>
  <rect x="180" y="152" width="135" height="10" rx="2" fill="#7f8c8d"/>

  <!-- Графітовий пил (частинки) -->
  <circle cx="195" cy="157" r="2.5" fill="#c0392b"/>
  <circle cx="220" cy="159" r="3" fill="#c0392b"/>
  <circle cx="245" cy="156" r="2" fill="#c0392b"/>
  <circle cx="270" cy="160" r="3" fill="#c0392b"/>
  <circle cx="295" cy="157" r="2.5" fill="#c0392b"/>

  <!-- Струмознімач -->
  <path d="M 230 185 L 247 160 L 264 185" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="247" y1="185" x2="247" y2="215" stroke="#7f8c8d" stroke-width="4"/>

  <!-- Підписи елементів потенціометра -->
  <text x="60" y="205" font-size="12" fill="#6b7280">Сплавні контакти</text>
  <text x="350" y="205" font-size="12" fill="#c0392b">Графітовий пил</text>
  <line x1="345" y1="201" x2="285" y2="182" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arr-red)"/>

  <!-- Схема напруги V_out -->
  <rect x="60" y="235" width="375" height="225" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="247" y="257" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Вихідна напруга в стані спокою V_out</text>

  <!-- Осі напруги та рівні -->
  <line x1="90" y1="345" x2="405" y2="345" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Мертва зона (Deadzone) -->
  <rect x="175" y="295" width="70" height="85" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="170" y="315" text-anchor="end" font-size="12" fill="#27ae60">Мертва зона</text>
  <text x="170" y="330" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">(Deadzone)</text>
  <line x1="172" y1="322" x2="192" y2="322" stroke="#27ae60" stroke-width="1" marker-end="url(#arr-green)"/>

  <!-- Лінія ідеального нуля -->
  <line x1="210" y1="275" x2="210" y2="385" stroke="#27ae60" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="180" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">V_ref / 2 (Нуль)</text>

  <!-- Дрейфова напруга -->
  <line x1="310" y1="275" x2="310" y2="385" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="210" y1="345" x2="302" y2="345" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="256" y="338" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">ΔV_err</text>
  <text x="320" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">V_drift (Дрейф)</text>

  <!-- Статус попередження -->
  <text x="247" y="445" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Помилковий сигнал руху!</text>

  <!-- Панель 2: Механічна деградація -->
  <rect x="495" y="80" width="435" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="510" y="95" width="405" height="32" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="712" y="116" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">2. Механічний люфт та втома пружини</text>

  <!-- Схема важеля і пружини -->
  <text x="630" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Вісь спокою (X₀, Y₀)</text>
  <rect x="525" y="140" width="375" height="115" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="630" y1="140" x2="630" y2="255" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Пружина та втома -->
  <path d="M 545 195 Q 557 183 570 195 T 595 195 T 620 195" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="582" y="175" text-anchor="middle" font-size="12" fill="#c0392b">Втома пружини</text>

  <!-- Важіль стіка у відхиленому стані -->
  <line x1="630" y1="215" x2="690" y2="160" stroke="#c0392b" stroke-width="7" stroke-linecap="round"/>
  <circle cx="698" cy="152" r="13" fill="#c0392b"/>

  <!-- Знос куліси (люфт) -->
  <circle cx="630" cy="215" r="14" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="745" y="210" font-size="12" fill="#c0392b">Знос куліси (люфт)</text>
  <line x1="740" y1="206" x2="646" y2="214" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arr-red)"/>

  <!-- 2D Координатна площина -->
  <rect x="525" y="270" width="375" height="190" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="712" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Зсув координати в зоні спокою (X-Y)</text>

  <!-- Осі координат -->
  <line x1="550" y1="375" x2="845" y2="375" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="670" y1="435" x2="670" y2="315" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="855" y="379" font-size="12" font-weight="bold" fill="#6b7280">X</text>
  <text x="670" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">Y</text>

  <!-- Коло deadzone -->
  <circle cx="670" cy="375" r="35" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="595" y="348" font-size="12" font-weight="bold" fill="#27ae60">Deadzone</text>

  <!-- Точка центру та дрейфу -->
  <circle cx="670" cy="375" r="3.5" fill="#27ae60"/>
  <text x="662" y="392" font-size="12" fill="#27ae60" text-anchor="end">(0, 0)</text>

  <line x1="670" y1="375" x2="724" y2="341" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <circle cx="730" cy="337" r="4.5" fill="#c0392b"/>
  <text x="742" y="335" font-size="12" font-weight="bold" fill="#c0392b">Зсув спокою</text>
  <text x="742" y="350" font-size="12" fill="#c0392b">(X_rest, Y_rest)</text>

  <!-- Статус попередження -->
  <text x="712" y="445" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Зсув за межі мертвої зони!</text>

  <!-- Нижня підсумкова панель -->
  <rect x="30" y="490" width="900" height="52" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="512" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Фізичний підсумок: Абразивний знос доріжки + Втома пружини → Зсув сигналу за межі Deadzone</text>
  <text x="480" y="531" text-anchor="middle" font-size="12" fill="#1a1a1a">Програмне розширення мертвої зони зменшує точність; вирішення проблеми — безконтактні сенсори Холла</text>
</svg>
