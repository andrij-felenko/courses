<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Marker Definitions -->
  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Передавальні характеристики радіальних мертвих зон</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Усунення стрибка амплітуди на межі r_dead за допомогою масштабованого та степенного відсікання</text>

  <!-- LEFT PANEL: CHART PLOT -->
  <rect x="30" y="75" width="560" height="415" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="310" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Графік залежності v_out(r_in)</text>

  <!-- Grid Lines -->
  <line x1="215" y1="130" x2="215" y2="420" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="520" y1="130" x2="520" y2="420" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="110" y1="150" x2="520" y2="150" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Plot Axes -->
  <line x1="110" y1="430" x2="110" y2="130" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-main)"/>
  <line x1="90" y1="420" x2="545" y2="420" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-main)"/>

  <!-- Axis Titles & Tick Labels -->
  <text x="110" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Вихід v_out</text>
  <text x="540" y="455" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">Вхідне відхилення r_in</text>

  <text x="95" y="424" text-anchor="end" font-size="12" fill="#6b7280">0.0</text>
  <text x="95" y="154" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">1.0</text>

  <!-- Deadzone Tick & Label -->
  <line x1="215" y1="420" x2="215" y2="426" stroke="#c0392b" stroke-width="1.5"/>
  <text x="215" y="442" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">r_dead</text>

  <!-- Max Radius Tick & Label -->
  <line x1="520" y1="420" x2="520" y2="426" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="520" y="442" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">1.0 (r_max)</text>

  <!-- CURVE 1: Unscaled Deadzone (Red) -->
  <line x1="110" y1="420" x2="215" y2="420" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="215" y1="420" x2="215" y2="350.75" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="215" y1="350.75" x2="520" y2="150" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Unscaled Curve Dots -->
  <circle cx="215" cy="420" r="4" fill="white" stroke="#c0392b" stroke-width="2"/>
  <circle cx="215" cy="350.75" r="4" fill="#c0392b"/>

  <!-- Discontinuity Jump Label (Left of Jump Line) -->
  <text x="205" y="380" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">Стрибок Δv</text>
  <text x="205" y="396" text-anchor="end" font-size="12" fill="#c0392b">(дисконтинуїтет)</text>
  <path d="M207,385 L213,385" stroke="#c0392b" stroke-width="1" marker-end="url(#arr-red)"/>

  <!-- CURVE 2: Scaled Linear (Green) -->
  <line x1="215" y1="420" x2="520" y2="150" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="215" cy="420" r="4" fill="#27ae60"/>

  <!-- CURVE 3: Scaled Power Curve (Blue) -->
  <path d="M 215,420 C 350,420 460,200 520,150" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- RIGHT PANEL: MATHEMATICAL MODELS & LEGEND -->
  <rect x="605" y="75" width="330" height="415" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="770" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Характеристики та математика</text>

  <!-- CARD 1: Unscaled -->
  <rect x="620" y="115" width="300" height="90" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="632" y="135" font-size="12" font-weight="bold" fill="#c0392b">1. Звичайне відсікання (Unscaled)</text>
  <text x="632" y="155" font-size="12" fill="#1a1a1a">• v = r_in  при r_in ≥ r_dead</text>
  <text x="632" y="177" font-size="12" font-weight="bold" fill="#c0392b">⚠ Стрибок від 0 до r_dead на межі!</text>

  <!-- CARD 2: Scaled Linear -->
  <rect x="620" y="215" width="300" height="95" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="632" y="235" font-size="12" font-weight="bold" fill="#27ae60">2. Масштабоване лінійне (Scaled)</text>
  <text x="632" y="255" font-size="12" fill="#1a1a1a">• v = (r_in - r_dead) / (1 - r_dead)</text>
  <text x="632" y="275" font-size="12" font-weight="bold" fill="#27ae60">✓ Плавний старт з 0.0 на межі</text>
  <text x="632" y="293" font-size="12" fill="#27ae60">✓ 100% шкали досягається при r = 1.0</text>

  <!-- CARD 3: Scaled Power Curve -->
  <rect x="620" y="320" width="300" height="95" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="632" y="340" font-size="12" font-weight="bold" fill="#2457d6">3. Степенна крива (Power Curve)</text>
  <text x="632" y="360" font-size="12" fill="#1a1a1a">• v = ((r_in - r_dead) / (1 - r_dead))^γ</text>
  <text x="632" y="380" font-size="12" font-weight="bold" fill="#2457d6">✓ Максимальна точність у центрі</text>
  <text x="632" y="398" font-size="12" fill="#2457d6">✓ Плавний нелінійний відгук</text>
</svg>
