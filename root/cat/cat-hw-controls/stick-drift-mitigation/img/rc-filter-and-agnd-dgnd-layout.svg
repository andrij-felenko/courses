<svg viewBox="0 0 960 480" width="960" height="480" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Defs for Markers -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Header Title and Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема RC-фільтрації та розведення шин AGND і DGND</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Пасивний RC-фільтр придушує шум контакту, а одноточкове з'єднання земель ізолює АЦП від цифрових завад</text>

  <!-- Panel 1: Joystick Module -->
  <rect x="40" y="80" width="140" height="250" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="110" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Джойстик</text>
  <text x="110" y="123" font-size="12" fill="#6b7280" text-anchor="middle">(Потенціометр)</text>

  <!-- Potentiometer Wires & Symbol -->
  <text x="50" y="152" font-size="12" fill="#6b7280">AVCC</text>
  <line x1="80" y1="150" x2="150" y2="150" stroke="#2457d6" stroke-width="2"/>
  <rect x="140" y="150" width="10" height="120" fill="#d0d7de" stroke="#6b7280"/>

  <text x="50" y="215" font-size="12" font-weight="bold" fill="#2457d6">V_OUT</text>
  <line x1="80" y1="210" x2="140" y2="210" stroke="#2457d6" stroke-width="2"/>
  <line x1="140" y1="210" x2="180" y2="210" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <text x="50" y="275" font-size="12" fill="#2457d6">AGND</text>
  <line x1="80" y1="270" x2="140" y2="270" stroke="#2457d6" stroke-width="2"/>
  <line x1="110" y1="270" x2="110" y2="390" stroke="#2457d6" stroke-width="3"/>

  <!-- Panel 2: RC Low-Pass Filter -->
  <rect x="210" y="80" width="220" height="250" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="320" y="105" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Пасивний RC-фільтр</text>
  <text x="320" y="123" font-size="12" fill="#6b7280" text-anchor="middle">Фільтрація вище f_c</text>

  <text x="295" y="192" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">R = 1..10 кОм</text>
  <line x1="180" y1="210" x2="250" y2="210" stroke="#2457d6" stroke-width="2"/>
  <rect x="250" y="200" width="60" height="20" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="280" y="214" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">R</text>
  <line x1="310" y1="210" x2="350" y2="210" stroke="#2457d6" stroke-width="2"/>

  <circle cx="350" cy="210" r="4" fill="#2457d6"/>
  <line x1="350" y1="210" x2="470" y2="210" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="405" y="200" font-size="12" fill="#2457d6" text-anchor="middle">V_FILT</text>

  <line x1="350" y1="210" x2="350" y2="245" stroke="#2457d6" stroke-width="2"/>
  <line x1="335" y1="245" x2="365" y2="245" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="335" y1="253" x2="365" y2="253" stroke="#1a1a1a" stroke-width="3"/>
  <text x="375" y="253" font-size="12" font-weight="bold" fill="#1a1a1a">C = 100 нФ</text>
  <line x1="350" y1="253" x2="350" y2="390" stroke="#2457d6" stroke-width="3"/>

  <rect x="230" y="288" width="180" height="30" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="320" y="308" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">f_c = 1 / (2π · R · C) ≈ 160 Гц</text>

  <!-- Panel 3: Microcontroller -->
  <rect x="470" y="80" width="450" height="250" rx="8" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
  <text x="695" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мікроконтролер (MCU)</text>

  <!-- Sub-block 1: ADC Analog Domain -->
  <rect x="490" y="130" width="170" height="180" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="575" y="155" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Аналогова частина</text>
  <text x="575" y="173" font-size="12" fill="#2457d6" text-anchor="middle">(Модуль АЦП)</text>

  <circle cx="490" cy="210" r="4" fill="#2457d6"/>
  <text x="500" y="204" font-size="12" font-weight="bold" fill="#2457d6">ADC_IN</text>

  <rect x="525" y="215" width="100" height="45" rx="4" fill="white" stroke="#2457d6"/>
  <text x="575" y="242" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">АЦП / VREF</text>

  <line x1="575" y1="260" x2="575" y2="390" stroke="#2457d6" stroke-width="3"/>
  <text x="585" y="320" font-size="12" fill="#2457d6">AGND Pin</text>

  <!-- Sub-block 2: Digital Domain -->
  <rect x="710" y="130" width="190" height="180" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="805" y="155" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Цифрова частина</text>
  <text x="805" y="173" font-size="12" fill="#c0392b" text-anchor="middle">(CPU, Flash, I/O)</text>

  <rect x="735" y="195" width="140" height="45" rx="4" fill="white" stroke="#c0392b"/>
  <text x="805" y="215" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">CPU / Тактовий генератор</text>
  <text x="805" y="231" font-size="12" fill="#c0392b" text-anchor="middle">Джерело завад dI/dt</text>

  <line x1="805" y1="260" x2="805" y2="390" stroke="#6b7280" stroke-width="3"/>
  <text x="815" y="320" font-size="12" fill="#6b7280">DGND Pin</text>

  <line x1="685" y1="130" x2="685" y2="310" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="685" y="324" font-size="12" fill="#6b7280" text-anchor="middle">Ізоляція шин</text>

  <!-- GROUNDING BUSES & STAR POINT -->
  <line x1="110" y1="390" x2="660" y2="390" stroke="#2457d6" stroke-width="4"/>
  <text x="340" y="415" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Шина аналогової землі (AGND)</text>
  <text x="340" y="433" font-size="12" fill="#6b7280" text-anchor="middle">«Чистий» провідник без імпульсних струмів</text>

  <line x1="805" y1="390" x2="680" y2="390" stroke="#6b7280" stroke-width="4"/>
  <text x="805" y="415" font-size="13" font-weight="bold" fill="#6b7280" text-anchor="middle">Шина цифрової землі (DGND)</text>
  <text x="805" y="433" font-size="12" fill="#c0392b" text-anchor="middle">Містить комутаційні завади перемикання</text>

  <circle cx="670" cy="390" r="9" fill="#27ae60" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="660" y1="390" x2="680" y2="390" stroke="#27ae60" stroke-width="4"/>

  <text x="670" y="362" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Зіркове з'єднання в 1 точці</text>
  <text x="670" y="378" font-size="12" fill="#6b7280" text-anchor="middle">(0 Ом резистор або Ferrite Bead)</text>

  <line x1="670" y1="399" x2="670" y2="440" stroke="#1a1a1a" stroke-width="3" marker-end="url(#arr)"/>
  <text x="670" y="458" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Загальний мінус живлення (GND Power)</text>
</svg>
