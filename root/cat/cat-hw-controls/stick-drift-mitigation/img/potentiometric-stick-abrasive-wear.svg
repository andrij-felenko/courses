<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Механічний знос потенціометра стіка та фізична природа дрейфу нуля</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Стирання вуглецевого шару повзунком викликає зміну опору ΔR та зсув нульового потенціалу</text>

  <!-- LEFT PANEL: Physical Cross-section of Worn Track -->
  <rect x="30" y="78" width="435" height="370" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="42" y="90" width="411" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="247" y="107" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Абразивне зношення резистивної доріжки</text>

  <!-- Wiper Arm & Terminal -->
  <text x="247" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Металевий повзунок (Wiper)</text>
  <line x1="247" y1="138" x2="247" y2="205" stroke="#2457d6" stroke-width="3"/>
  <path d="M 247 205 Q 235 220 247 238" fill="none" stroke="#2457d6" stroke-width="3"/>

  <!-- Substrate Base Layer (PCB) -->
  <rect x="60" y="270" width="375" height="25" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="247" y="287" text-anchor="middle" font-size="12" fill="#6b7280">Підкладка (FR-4 / Гетинакс)</text>

  <!-- Carbon Layer Parts -->
  <!-- Left Intact Part -->
  <rect x="60" y="250" width="125" height="20" fill="#1a1a1a"/>
  <!-- Center Worn Groove -->
  <rect x="185" y="258" width="125" height="12" fill="#6b7280"/>
  <!-- Right Intact Part -->
  <rect x="310" y="250" width="125" height="20" fill="#1a1a1a"/>

  <!-- Labels for Carbon Track -->
  <text x="122" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Вуглецевий шар (R0)</text>
  <text x="247" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Канавка зносу (R + ΔR)</text>
  <text x="372" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Вуглецевий шар (R0)</text>

  <!-- Debris particles -->
  <circle cx="195" cy="254" r="2.5" fill="#c0392b"/>
  <circle cx="210" cy="252" r="2" fill="#1a1a1a"/>
  <circle cx="280" cy="253" r="2.5" fill="#c0392b"/>
  <circle cx="298" cy="255" r="2" fill="#1a1a1a"/>
  <text x="247" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Накопичення абразивного графітового пилу</text>

  <!-- Left Info Card -->
  <rect x="42" y="330" width="411" height="100" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="247" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Причини деградації контактної групи:</text>
  <text x="54" y="368" font-size="12" fill="#6b7280">• Мільйони циклів тертя вискоблюють канавку в зоні спокою</text>
  <text x="54" y="388" font-size="12" fill="#6b7280">• Зменшення товщини шару підвищує локальний опір (ΔR)</text>
  <text x="54" y="408" font-size="12" fill="#6b7280">• Графітовий пил викликає шуми та ненадійний контакт</text>

  <!-- RIGHT PANEL: Voltage Offset & Stick Drift Graph -->
  <rect x="495" y="78" width="435" height="370" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="507" y="90" width="411" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712" y="107" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Електричний зсув напруги у центральному положенні</text>

  <!-- Deadzone Band Shading -->
  <rect x="680" y="130" width="64" height="175" fill="#2457d6" fill-opacity="0.08" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="712" y="124" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Мертва зона (Deadzone)</text>

  <!-- Graph Axes -->
  <!-- Y-axis (Voltage V) -->
  <line x1="560" y1="140" x2="560" y2="300" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-main)"/>
  <!-- X-axis (Position X/Y) -->
  <line x1="560" y1="220" x2="885" y2="220" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-main)"/>

  <!-- Axis Labels -->
  <text x="550" y="145" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">VCC</text>
  <text x="550" y="224" text-anchor="end" font-size="12" fill="#6b7280">V_nom (50%)</text>
  <text x="550" y="300" text-anchor="end" font-size="12" fill="#1a1a1a">GND (0V)</text>
  <text x="885" y="238" text-anchor="end" font-size="12" fill="#6b7280">Кут важеля θ</text>

  <!-- Ideal Characteristic Line (Dashed Green) -->
  <line x1="580" y1="290" x2="860" y2="150" stroke="#27ae60" stroke-width="2" stroke-dasharray="4,4"/>
  <circle cx="712" cy="220" r="4" fill="#27ae60"/>
  <text x="770" y="148" font-size="12" font-weight="bold" fill="#27ae60">Ідеальна характеристика</text>

  <!-- Degraded / Worn Characteristic Curve (Solid Red) -->
  <path d="M 580 290 L 670 245 L 712 185 L 754 175 L 860 150" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="712" cy="185" r="4.5" fill="#c0392b"/>

  <!-- Voltage Shift Indicator Arrow -->
  <line x1="712" y1="220" x2="712" y2="189" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="722" y="206" font-size="12" font-weight="bold" fill="#c0392b">ΔV_drift (Зсув напруги)</text>

  <!-- Status Callout text under graph -->
  <text x="712" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Зсув V_drift виходить за межі deadzone!</text>

  <!-- Right Info Card -->
  <rect x="507" y="330" width="411" height="100" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="712" y="348" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Наслідки для електронного блоку керування:</text>
  <text x="519" y="368" font-size="12" fill="#1a1a1a">• Важіль механічно перебуває у центрі (0,0)</text>
  <text x="519" y="388" font-size="12" fill="#1a1a1a">• АЦП зчитує зміщену напругу через підвищений опір ΔR</text>
  <text x="519" y="408" font-size="12" fill="#1a1a1a">• Контролер реєструє хибний рух без торкання до стіка</text>
</svg>
