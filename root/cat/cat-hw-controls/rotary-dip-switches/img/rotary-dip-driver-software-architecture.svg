<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Архітектура програмного драйвера ротаційного DIP-перемикача</text>
  <text x="480" y="54" font-size="13" text-anchor="middle" fill="#6b7280">Потік даних від 4-бітної GPIO шини через фільтр брязкоту й LUT-таблиці декодування до API</text>

  <!-- Column 1: GPIO Inputs -->
  <rect x="30" y="80" width="200" height="390" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="130" y="108" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">1. GPIO Входи MCU</text>

  <rect x="45" y="130" width="170" height="325" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="130" y="152" font-size="13" font-weight="bold" text-anchor="middle" fill="#2457d6">Паралельна 4-біт шина</text>
  <text x="60" y="185" font-size="12" font-weight="bold" fill="#1a1a1a">PIN 0 (Bit 1): 2⁰</text>
  <text x="60" y="205" font-size="12" fill="#6b7280">Вхід GPIO + Pull-Up</text>

  <text x="60" y="245" font-size="12" font-weight="bold" fill="#1a1a1a">PIN 1 (Bit 2): 2¹</text>
  <text x="60" y="265" font-size="12" fill="#6b7280">Вхід GPIO + Pull-Up</text>

  <text x="60" y="305" font-size="12" font-weight="bold" fill="#1a1a1a">PIN 2 (Bit 4): 2²</text>
  <text x="60" y="325" font-size="12" fill="#6b7280">Вхід GPIO + Pull-Up</text>

  <text x="60" y="365" font-size="12" font-weight="bold" fill="#1a1a1a">PIN 3 (Bit 8): 2³</text>
  <text x="60" y="385" font-size="12" fill="#6b7280">Вхід GPIO + Pull-Up</text>

  <!-- Column 2: Masking & Debounce -->
  <rect x="255" y="80" width="210" height="390" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="360" y="108" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">2. Маскування &amp; Фільтр</text>

  <rect x="270" y="130" width="180" height="150" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="360" y="152" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">Маскування бітів</text>
  <text x="280" y="180" font-size="12" fill="#1a1a1a">• Invert bits (Active LOW)</text>
  <text x="280" y="202" font-size="12" fill="#1a1a1a">• `raw_code = (~gpio &amp; 0xF)`</text>
  <text x="280" y="224" font-size="12" fill="#6b7280">• Зсув шини (Shift offset)</text>

  <rect x="270" y="305" width="180" height="150" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="360" y="327" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">Фільтрація брязкоту</text>
  <text x="280" y="355" font-size="12" fill="#1a1a1a">• Неблокуючий таймер</text>
  <text x="280" y="377" font-size="12" fill="#1a1a1a">• Затримка 10–20 мс</text>
  <text x="280" y="399" font-size="12" fill="#6b7280">• Стабілізований код</text>

  <!-- Column 3: LUT Decoding -->
  <rect x="490" y="80" width="210" height="390" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="595" y="108" font-size="14" font-weight="bold" text-anchor="middle" fill="#27ae60">3. LUT-Декодери</text>

  <rect x="505" y="130" width="180" height="150" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="595" y="152" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Табличне декодування</text>
  <text x="515" y="180" font-size="12" fill="#1a1a1a">• Прямий BCD (0..9)</text>
  <text x="515" y="202" font-size="12" fill="#1a1a1a">• Прямий Hex (0..F)</text>
  <text x="515" y="224" font-size="12" fill="#1a1a1a">• Перетворення коду Ґрея</text>
  <text x="515" y="246" font-size="12" fill="#6b7280">• `gray_to_bin_lut[16]`</text>

  <rect x="505" y="305" width="180" height="150" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="595" y="327" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Валідація &amp; Діагностика</text>
  <text x="515" y="355" font-size="12" fill="#1a1a1a">• Перевірка меж BCD</text>
  <text x="515" y="377" font-size="12" fill="#c0392b">• Детекція невалідного коду</text>
  <text x="515" y="399" font-size="12" fill="#6b7280">• Контроль обриву ліній</text>

  <!-- Column 4: Application API -->
  <rect x="725" y="80" width="205" height="390" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="827" y="108" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">4. Прикладний API</text>

  <rect x="740" y="130" width="175" height="150" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="827" y="152" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">Опитування API</text>
  <text x="750" y="180" font-size="12" fill="#1a1a1a">• `dip_read_value()`</text>
  <text x="750" y="202" font-size="12" fill="#1a1a1a">• `dip_has_changed()`</text>
  <text x="750" y="224" font-size="12" fill="#6b7280">• `dip_get_status()`</text>

  <rect x="740" y="305" width="175" height="150" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="827" y="327" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Події додатка</text>
  <text x="750" y="355" font-size="12" fill="#1a1a1a">• `ON_POSITION_CHANGE`</text>
  <text x="750" y="377" font-size="12" fill="#1a1a1a">• Конфігурація адреси MCU</text>
  <text x="750" y="399" font-size="12" fill="#6b7280">• Вибір режиму при старті</text>

  <!-- Connectors -->
  <line x1="215" y1="205" x2="255" y2="205" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="450" y1="205" x2="490" y2="205" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="450" y1="380" x2="490" y2="380" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <line x1="685" y1="205" x2="725" y2="205" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="685" y1="380" x2="725" y2="380" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
</svg>
