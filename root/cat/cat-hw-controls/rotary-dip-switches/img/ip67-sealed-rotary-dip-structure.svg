<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Header Section -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Герметизована структура ротаційного DIP-перемикача (IP67)</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Силіконове кільце O-ring та заповнений корпус захищають внутрішні контакти від флюсу і промивання</text>

  <!-- Left Container: Structural Cutaway Diagram -->
  <g id="left-panel">
    <rect x="30" y="85" width="550" height="370" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="305" y="108" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Конструктивний розріз ущільненого корпусу (IP67)</text>
    <line x1="30" y1="120" x2="580" y2="120" stroke="#d0d7de" stroke-width="1"/>

    <!-- Rotor Actuator Knob (Top part outside housing) -->
    <rect x="240" y="140" width="130" height="20" rx="3" fill="#2457d6" stroke="#1a1a1a"/>
    <!-- Screwdriver Slot -->
    <rect x="285" y="145" width="40" height="10" fill="#ffffff"/>
    <!-- Connecting Shaft link -->
    <line x1="305" y1="160" x2="305" y2="165" stroke="#2457d6" stroke-width="4"/>

    <!-- Outer Molded Plastic Housing -->
    <rect x="165" y="165" width="280" height="200" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>

    <!-- Rotor Shaft & Actuator (Contained inside housing) -->
    <rect x="255" y="165" width="100" height="105" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

    <!-- O-Ring Seal Ellipses -->
    <ellipse cx="255" cy="195" rx="10" ry="8" fill="#c0392b" stroke="#1a1a1a" stroke-width="1"/>
    <ellipse cx="355" cy="195" rx="10" ry="8" fill="#c0392b" stroke="#1a1a1a" stroke-width="1"/>

    <!-- O-Ring Callout Badge & Line -->
    <rect x="45" y="180" width="105" height="30" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
    <text x="97" y="200" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Кільце O-Ring</text>
    <line x1="150" y1="195" x2="243" y2="195" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>

    <!-- Internal Rotor Contact Plate -->
    <rect x="220" y="270" width="170" height="15" fill="#27ae60" stroke="#1a1a1a"/>

    <!-- Fixed Contact Terminals (Gold Contacts) -->
    <path d="M 200,390 L 200,320 L 245,320 L 245,285" stroke="#27ae60" stroke-width="3" fill="none"/>
    <path d="M 410,390 L 410,320 L 365,320 L 365,285" stroke="#27ae60" stroke-width="3" fill="none"/>
    <path d="M 305,415 L 305,285" stroke="#2457d6" stroke-width="3" fill="none"/>

    <!-- Bottom Epoxy Sealing Layer -->
    <rect x="167" y="340" width="276" height="23" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Epoxy Seal Callout Badge & Line -->
    <rect x="455" y="337" width="115" height="28" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
    <text x="512" y="355" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Епоксидна заливка</text>
    <line x1="455" y1="351" x2="445" y2="351" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

    <!-- PCB Board Representation -->
    <line x1="80" y1="410" x2="530" y2="410" stroke="#6b7280" stroke-width="3" stroke-dasharray="8,4"/>
    <text x="305" y="440" font-size="12" fill="#6b7280" text-anchor="middle">Друкована плата (PCB) — Пайка хвилею та мийка</text>

    <!-- Wave Soldering Flux Protection Arrow -->
    <line x1="140" y1="435" x2="140" y2="375" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
    <text x="45" y="395" font-size="11" font-weight="bold" fill="#c0392b">Флюс пайки</text>
    <text x="45" y="408" font-size="11" fill="#c0392b">і хвиля припою</text>

    <!-- Washing Solvent Protection Arrow -->
    <line x1="465" y1="160" x2="370" y2="185" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
    <text x="465" y="145" font-size="11" font-weight="bold" fill="#c0392b">Миючий розчинник</text>
    <text x="465" y="158" font-size="11" fill="#c0392b">під тиском</text>
  </g>

  <!-- Right Panel: Explanatory Features -->
  <g id="right-panel">
    <rect x="610" y="85" width="320" height="370" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="770" y="108" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Елементи захисту від забруднень</text>
    <line x1="610" y1="120" x2="930" y2="120" stroke="#d0d7de" stroke-width="1"/>

    <!-- Sub-box 1: O-Ring Seal -->
    <rect x="625" y="135" width="290" height="75" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
    <text x="637" y="155" font-size="12" font-weight="bold" fill="#c0392b">1. Ущільнення штока O-Ring</text>
    <text x="637" y="174" font-size="11" fill="#1a1a1a">• Силіконове кільце в канавці ротора</text>
    <text x="637" y="192" font-size="11" fill="#6b7280">• Захист від мийки під тиском (IP67)</text>

    <!-- Sub-box 2: Epoxy Seal -->
    <rect x="625" y="222" width="290" height="75" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
    <text x="637" y="242" font-size="12" font-weight="bold" fill="#27ae60">2. Заливка основи епоксидкою</text>
    <text x="637" y="261" font-size="11" fill="#1a1a1a">• Повна герметизація штирьових виводів</text>
    <text x="637" y="279" font-size="11" fill="#6b7280">• Блокування всмоктування флюсу</text>

    <!-- Sub-box 3: Contacts & IP67 Specs -->
    <rect x="625" y="309" width="290" height="134" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
    <text x="637" y="329" font-size="12" font-weight="bold" fill="#2457d6">3. Контактна система (BCD / Hex)</text>
    <text x="637" y="347" font-size="11" fill="#1a1a1a">• Позолочені ламелі (Au over Ni)</text>
    <text x="637" y="365" font-size="11" fill="#1a1a1a">• Опір контакту: R_cnt &lt; 50 мОм</text>
    <rect x="635" y="377" width="270" height="52" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
    <text x="770" y="397" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Стандарт захисту IP67 (IEC 60529)</text>
    <text x="770" y="415" font-size="11" fill="#6b7280" text-anchor="middle">Захист від пилу та тимчасового занурення</text>
  </g>

  <!-- Bottom Legend Panel -->
  <rect x="30" y="470" width="900" height="36" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="170" y="493" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">■ Ущільнювальне кільце O-Ring</text>
  <text x="480" y="493" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">■ Нижня епоксидна герметизація</text>
  <text x="790" y="493" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">■ Позолочені контакти (BCD / Hex)</text>
</svg>
