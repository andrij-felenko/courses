<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Defs -->
  <defs>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема зчитування 16-позиційного ротаційного перемикача через один вхід АЦП</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Зважена резистивна драбина формує 16 унікальних рівнів напруги V_ADC для кожного з 16 станів (0..F)</text>

  <!-- LEFT PANEL: Schematic Diagram -->
  <rect x="30" y="75" width="435" height="440" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8" ry="8"/>
  <text x="247.5" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принципова схема АЦП-дільника</text>
  <text x="247.5" y="114" font-size="12" fill="#6b7280" text-anchor="middle">(змальовування 16 станів Rotary DIP в 1 аналоговий дріт)</text>

  <!-- VCC Rail & Text -->
  <text x="247.5" y="135" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">VCC (+3.3V)</text>
  <line x1="247.5" y1="140" x2="247.5" y2="155" stroke="#c0392b" stroke-width="2"/>

  <!-- Pull-up Resistor R_P -->
  <rect x="240.5" y="155" width="14" height="35" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="262" y="177" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">R_P = 10 кОм</text>
  <line x1="247.5" y1="190" x2="247.5" y2="210" stroke="#1a1a1a" stroke-width="2"/>

  <!-- V_ADC Node -->
  <circle cx="247.5" cy="210" r="4" fill="#c0392b"/>
  <text x="256" y="206" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">V_ADC</text>

  <!-- Connection to MCU ADC Input -->
  <line x1="247.5" y1="210" x2="360" y2="210" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="365" y="214" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">ADC_IN (MCU)</text>

  <!-- Filter Capacitor C_f -->
  <line x1="340" y1="210" x2="340" y2="230" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="330" y1="230" x2="350" y2="230" stroke="#2457d6" stroke-width="2"/>
  <line x1="330" y1="235" x2="350" y2="235" stroke="#2457d6" stroke-width="2"/>
  <line x1="340" y1="235" x2="340" y2="255" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Ground for C_f -->
  <line x1="332" y1="255" x2="348" y2="255" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="336" y1="258" x2="344" y2="258" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="355" y="236" font-size="12" fill="#6b7280" text-anchor="start">C_f = 100 нФ</text>

  <!-- Wire from V_ADC down to Horizontal Bus -->
  <line x1="247.5" y1="210" x2="247.5" y2="245" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Horizontal Distribution Bus -->
  <line x1="70" y1="245" x2="355" y2="245" stroke="#2457d6" stroke-width="1.5"/>

  <!-- 4 Weighted Resistor Branches -->
  <!-- Branch 1 (Bit 0 / Pin 1): 10k -->
  <line x1="70" y1="245" x2="70" y2="260" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="63" y="260" width="14" height="32" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="70" y1="292" x2="70" y2="310" stroke="#2457d6" stroke-width="1.5"/>
  <text x="82" y="280" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">R_1 = 10 k</text>

  <!-- Branch 2 (Bit 1 / Pin 2): 20k -->
  <line x1="165" y1="245" x2="165" y2="260" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="158" y="260" width="14" height="32" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="165" y1="292" x2="165" y2="310" stroke="#2457d6" stroke-width="1.5"/>
  <text x="177" y="280" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">R_2 = 20 k</text>

  <!-- Branch 3 (Bit 2 / Pin 4): 40k -->
  <line x1="260" y1="245" x2="260" y2="260" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="253" y="260" width="14" height="32" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="260" y1="292" x2="260" y2="310" stroke="#2457d6" stroke-width="1.5"/>
  <text x="272" y="280" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">R_4 = 40 k</text>

  <!-- Branch 4 (Bit 3 / Pin 8): 80k -->
  <line x1="355" y1="245" x2="355" y2="260" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="348" y="260" width="14" height="32" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="355" y1="292" x2="355" y2="310" stroke="#2457d6" stroke-width="1.5"/>
  <text x="367" y="280" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">R_8 = 80 k</text>

  <!-- Rotary DIP Switch Component Box -->
  <rect x="50" y="310" width="335" height="55" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="217.5" y="328" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Rotary DIP Switch (Hex 0..F)</text>
  <text x="70" y="348" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1</text>
  <text x="165" y="348" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2</text>
  <text x="260" y="348" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">4</text>
  <text x="355" y="348" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">8</text>

  <!-- Common GND connection -->
  <line x1="217.5" y1="365" x2="217.5" y2="380" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="207.5" y1="380" x2="227.5" y2="380" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="211.5" y1="383" x2="223.5" y2="383" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="214.5" y1="386" x2="220.5" y2="386" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="235" y="382" font-size="12" fill="#6b7280" text-anchor="start">Спільний вивід (C) -&gt; GND</text>

  <!-- Left Bottom Summary Box -->
  <rect x="45" y="398" width="405" height="105" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6" ry="6"/>
  <text x="247.5" y="416" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Особливості 1-провідного зчитування:</text>
  <text x="247.5" y="436" font-size="12" fill="#1a1a1a" text-anchor="middle">• 1 вхід АЦП замість 4 цифрових пінів</text>
  <text x="247.5" y="456" font-size="12" fill="#1a1a1a" text-anchor="middle">• Двійкова вага опорів (1:2:4:8) -&gt; 16 рівнів</text>
  <text x="247.5" y="476" font-size="12" fill="#6b7280" text-anchor="middle">• Конденсатор C_f (100 нФ) усуває брязкіт</text>
  <text x="247.5" y="494" font-size="12" fill="#6b7280" text-anchor="middle">• Точність резисторів 1% запобігає збоям</text>

  <!-- RIGHT PANEL: Voltage Breakdown Table -->
  <rect x="495" y="75" width="435" height="440" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8" ry="8"/>
  <text x="712.5" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Таблиця напруг та кодів АЦП (VCC = 3.3V)</text>
  <text x="712.5" y="114" font-size="12" fill="#6b7280" text-anchor="middle">(16 унікальних рівнів для 10-бітного АЦП 0..1023)</text>

  <!-- Table Container Box -->
  <rect x="510" y="130" width="405" height="300" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6" ry="6"/>

  <!-- Table Header Row -->
  <rect x="510" y="130" width="405" height="28" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1"/>

  <!-- Center Divider Line -->
  <line x1="712.5" y1="130" x2="712.5" y2="430" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Column Dividers -->
  <!-- Left Half Dividers -->
  <line x1="545" y1="130" x2="545" y2="430" stroke="#d0d7de" stroke-width="1"/>
  <line x1="590" y1="130" x2="590" y2="430" stroke="#d0d7de" stroke-width="1"/>
  <line x1="655" y1="130" x2="655" y2="430" stroke="#d0d7de" stroke-width="1"/>

  <!-- Right Half Dividers -->
  <line x1="747.5" y1="130" x2="747.5" y2="430" stroke="#d0d7de" stroke-width="1"/>
  <line x1="792.5" y1="130" x2="792.5" y2="430" stroke="#d0d7de" stroke-width="1"/>
  <line x1="857.5" y1="130" x2="857.5" y2="430" stroke="#d0d7de" stroke-width="1"/>

  <!-- Header Texts -->
  <!-- Left Side Header -->
  <text x="527.5" y="149" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Hex</text>
  <text x="567.5" y="149" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Код</text>
  <text x="622.5" y="149" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">V_ADC</text>
  <text x="683.75" y="149" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">ADC10</text>

  <!-- Right Side Header -->
  <text x="730" y="149" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Hex</text>
  <text x="770" y="149" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Код</text>
  <text x="825" y="149" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">V_ADC</text>
  <text x="886.25" y="149" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">ADC10</text>

  <!-- Table Rows Horizontal Dividers -->
  <line x1="510" y1="158" x2="915" y2="158" stroke="#d0d7de" stroke-width="1"/>
  <line x1="510" y1="192" x2="915" y2="192" stroke="#d0d7de" stroke-width="1"/>
  <line x1="510" y1="226" x2="915" y2="226" stroke="#d0d7de" stroke-width="1"/>
  <line x1="510" y1="260" x2="915" y2="260" stroke="#d0d7de" stroke-width="1"/>
  <line x1="510" y1="294" x2="915" y2="294" stroke="#d0d7de" stroke-width="1"/>
  <line x1="510" y1="328" x2="915" y2="328" stroke="#d0d7de" stroke-width="1"/>
  <line x1="510" y1="362" x2="915" y2="362" stroke="#d0d7de" stroke-width="1"/>
  <line x1="510" y1="396" x2="915" y2="396" stroke="#d0d7de" stroke-width="1"/>
  <line x1="510" y1="430" x2="915" y2="430" stroke="#d0d7de" stroke-width="1"/>

  <!-- Row 0: Pos 0 & 8 -->
  <text x="527.5" y="180" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0</text>
  <text x="567.5" y="180" font-size="12" fill="#6b7280" text-anchor="middle">0000</text>
  <text x="622.5" y="180" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">3.30 В</text>
  <text x="683.75" y="180" font-size="12" fill="#27ae60" text-anchor="middle">1023</text>

  <text x="730" y="180" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">8</text>
  <text x="770" y="180" font-size="12" fill="#6b7280" text-anchor="middle">1000</text>
  <text x="825" y="180" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">2.93 В</text>
  <text x="886.25" y="180" font-size="12" fill="#27ae60" text-anchor="middle">909</text>

  <!-- Row 1: Pos 1 & 9 -->
  <text x="527.5" y="214" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1</text>
  <text x="567.5" y="214" font-size="12" fill="#6b7280" text-anchor="middle">0001</text>
  <text x="622.5" y="214" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">1.65 В</text>
  <text x="683.75" y="214" font-size="12" fill="#27ae60" text-anchor="middle">512</text>

  <text x="730" y="214" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">9</text>
  <text x="770" y="214" font-size="12" fill="#6b7280" text-anchor="middle">1001</text>
  <text x="825" y="214" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">1.56 В</text>
  <text x="886.25" y="214" font-size="12" fill="#27ae60" text-anchor="middle">483</text>

  <!-- Row 2: Pos 2 & A -->
  <text x="527.5" y="248" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2</text>
  <text x="567.5" y="248" font-size="12" fill="#6b7280" text-anchor="middle">0010</text>
  <text x="622.5" y="248" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">2.20 В</text>
  <text x="683.75" y="248" font-size="12" fill="#27ae60" text-anchor="middle">682</text>

  <text x="730" y="248" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">A</text>
  <text x="770" y="248" font-size="12" fill="#6b7280" text-anchor="middle">1010</text>
  <text x="825" y="248" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">2.04 В</text>
  <text x="886.25" y="248" font-size="12" fill="#27ae60" text-anchor="middle">632</text>

  <!-- Row 3: Pos 3 & B -->
  <text x="527.5" y="282" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3</text>
  <text x="567.5" y="282" font-size="12" fill="#6b7280" text-anchor="middle">0011</text>
  <text x="622.5" y="282" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">1.32 В</text>
  <text x="683.75" y="282" font-size="12" fill="#27ae60" text-anchor="middle">410</text>

  <text x="730" y="282" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">B</text>
  <text x="770" y="282" font-size="12" fill="#6b7280" text-anchor="middle">1011</text>
  <text x="825" y="282" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">1.27 В</text>
  <text x="886.25" y="282" font-size="12" fill="#27ae60" text-anchor="middle">394</text>

  <!-- Row 4: Pos 4 & C -->
  <text x="527.5" y="316" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">4</text>
  <text x="567.5" y="316" font-size="12" fill="#6b7280" text-anchor="middle">0100</text>
  <text x="622.5" y="316" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">2.64 В</text>
  <text x="683.75" y="316" font-size="12" fill="#27ae60" text-anchor="middle">818</text>

  <text x="730" y="316" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">C</text>
  <text x="770" y="316" font-size="12" fill="#6b7280" text-anchor="middle">1100</text>
  <text x="825" y="316" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">2.45 В</text>
  <text x="886.25" y="316" font-size="12" fill="#27ae60" text-anchor="middle">760</text>

  <!-- Row 5: Pos 5 & D -->
  <text x="527.5" y="350" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">5</text>
  <text x="567.5" y="350" font-size="12" fill="#6b7280" text-anchor="middle">0101</text>
  <text x="622.5" y="350" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">1.47 В</text>
  <text x="683.75" y="350" font-size="12" fill="#27ae60" text-anchor="middle">455</text>

  <text x="730" y="350" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">D</text>
  <text x="770" y="350" font-size="12" fill="#6b7280" text-anchor="middle">1101</text>
  <text x="825" y="350" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">1.42 В</text>
  <text x="886.25" y="350" font-size="12" fill="#27ae60" text-anchor="middle">440</text>

  <!-- Row 6: Pos 6 & E -->
  <text x="527.5" y="384" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">6</text>
  <text x="567.5" y="384" font-size="12" fill="#6b7280" text-anchor="middle">0110</text>
  <text x="622.5" y="384" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">1.89 В</text>
  <text x="683.75" y="384" font-size="12" fill="#27ae60" text-anchor="middle">585</text>

  <text x="730" y="384" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">E</text>
  <text x="770" y="384" font-size="12" fill="#6b7280" text-anchor="middle">1110</text>
  <text x="825" y="384" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">1.80 В</text>
  <text x="886.25" y="384" font-size="12" fill="#27ae60" text-anchor="middle">558</text>

  <!-- Row 7: Pos 7 & F -->
  <text x="527.5" y="418" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">7</text>
  <text x="567.5" y="418" font-size="12" fill="#6b7280" text-anchor="middle">0111</text>
  <text x="622.5" y="418" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">1.22 В</text>
  <text x="683.75" y="418" font-size="12" fill="#27ae60" text-anchor="middle">378</text>

  <text x="730" y="418" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">F</text>
  <text x="770" y="418" font-size="12" fill="#6b7280" text-anchor="middle">1111</text>
  <text x="825" y="418" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">1.18 В</text>
  <text x="886.25" y="418" font-size="12" fill="#27ae60" text-anchor="middle">366</text>

  <!-- Table Footer Legend Box -->
  <rect x="510" y="442" width="405" height="60" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="712.5" y="462" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">• Крок між суміжними рівнями ΔV &gt; 50 мВ</text>
  <text x="712.5" y="484" font-size="12" fill="#6b7280" text-anchor="middle">• Допуск розпізнавання (±25 мВ) гарантує 100% точність</text>
</svg>
