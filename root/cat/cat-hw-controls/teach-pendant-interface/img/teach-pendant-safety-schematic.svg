<svg viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L8,4.5 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L8,4.5 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="460" fill="#ffffff"/>

  <!-- Title & Subtitle -->
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Двоканальне підключення органів безпеки Teach Pendant</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Дубльовані канали CH1/CH2 та контроль розсинхрону виявляють КЗ й несправність контактів</text>

  <!-- Left Main Container: Teach Pendant -->
  <rect x="30" y="75" width="280" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="45" y="97" font-size="14" font-weight="bold" fill="#1a1a1a">Пульт Teach Pendant</text>

  <!-- Sub-block S1: 3-Position Enabling Switch -->
  <rect x="45" y="108" width="250" height="152" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="127" font-size="13" font-weight="bold" fill="#2457d6">S1: Кнопка дозволу (3-поз.)</text>
  <text x="55" y="143" font-size="12" fill="#6b7280">Поз: 0 (відп) | 1 (ОК) | 2 (паніка)</text>

  <!-- S1 Channel 1 -->
  <text x="55" y="167" font-size="12" font-weight="bold" fill="#1a1a1a">CH1 (S1-1)</text>
  <text x="55" y="183" font-size="12" fill="#27ae60">Замикається в Поз. 1</text>
  <text x="240" y="164" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">S1-1</text>
  <line x1="210" y1="178" x2="222" y2="178" stroke="#2457d6" stroke-width="2"/>
  <circle cx="222" cy="178" r="2.5" fill="#2457d6"/>
  <line x1="222" y1="178" x2="242" y2="167" stroke="#2457d6" stroke-width="2"/>
  <circle cx="245" cy="178" r="2.5" fill="#2457d6"/>
  <line x1="245" y1="178" x2="255" y2="178" stroke="#2457d6" stroke-width="2"/>

  <!-- S1 Channel 2 -->
  <text x="55" y="215" font-size="12" font-weight="bold" fill="#1a1a1a">CH2 (S1-2)</text>
  <text x="55" y="231" font-size="12" fill="#27ae60">Замикається в Поз. 1</text>
  <text x="240" y="212" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">S1-2</text>
  <line x1="190" y1="226" x2="222" y2="226" stroke="#27ae60" stroke-width="2"/>
  <circle cx="222" cy="226" r="2.5" fill="#27ae60"/>
  <line x1="222" y1="226" x2="242" y2="215" stroke="#27ae60" stroke-width="2"/>
  <circle cx="245" cy="226" r="2.5" fill="#27ae60"/>
  <line x1="245" y1="226" x2="255" y2="226" stroke="#27ae60" stroke-width="2"/>

  <!-- Sub-block S2: Emergency Stop Button -->
  <rect x="45" y="270" width="250" height="157" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="289" font-size="13" font-weight="bold" fill="#c0392b">S2: Кнопка E-Stop (НЗ / NC)</text>
  <text x="55" y="305" font-size="12" fill="#6b7280">Аварійне розмикання двох кіл</text>

  <!-- S2 Channel 1 NC -->
  <text x="55" y="333" font-size="12" font-weight="bold" fill="#1a1a1a">CH1 (S2-1)</text>
  <text x="55" y="349" font-size="12" fill="#6b7280">НЗ контакт (NC1)</text>
  <text x="240" y="327" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">S2-1</text>
  <line x1="210" y1="339" x2="222" y2="339" stroke="#2457d6" stroke-width="2"/>
  <circle cx="222" cy="339" r="2.5" fill="#2457d6"/>
  <line x1="222" y1="333" x2="245" y2="333" stroke="#c0392b" stroke-width="2"/>
  <circle cx="245" cy="339" r="2.5" fill="#2457d6"/>
  <line x1="245" y1="339" x2="255" y2="339" stroke="#2457d6" stroke-width="2"/>

  <!-- S2 Channel 2 NC -->
  <text x="55" y="387" font-size="12" font-weight="bold" fill="#1a1a1a">CH2 (S2-2)</text>
  <text x="55" y="403" font-size="12" fill="#6b7280">НЗ контакт (NC2)</text>
  <text x="240" y="381" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">S2-2</text>
  <line x1="190" y1="393" x2="222" y2="393" stroke="#27ae60" stroke-width="2"/>
  <circle cx="222" cy="393" r="2.5" fill="#27ae60"/>
  <line x1="222" y1="387" x2="245" y2="387" stroke="#c0392b" stroke-width="2"/>
  <circle cx="245" cy="393" r="2.5" fill="#27ae60"/>
  <line x1="245" y1="393" x2="255" y2="393" stroke="#27ae60" stroke-width="2"/>

  <!-- Right Main Container: Safety Relay Module -->
  <rect x="335" y="75" width="595" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="350" y="97" font-size="14" font-weight="bold" fill="#1a1a1a">Реле безпеки (Safety Relay Module)</text>

  <!-- Section 1: Terminals Block -->
  <rect x="350" y="108" width="75" height="319" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="387" y="127" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Клеми</text>

  <!-- Terminal S11 -->
  <circle cx="410" cy="178" r="4" fill="#2457d6"/>
  <text x="375" y="173" font-size="12" font-weight="bold" fill="#2457d6">S11</text>

  <!-- Terminal S12 -->
  <circle cx="410" cy="202" r="4" fill="#2457d6"/>
  <text x="375" y="197" font-size="12" font-weight="bold" fill="#2457d6">S12</text>

  <!-- Terminal S21 -->
  <circle cx="410" cy="226" r="4" fill="#27ae60"/>
  <text x="375" y="221" font-size="12" font-weight="bold" fill="#27ae60">S21</text>

  <!-- Terminal S22 -->
  <circle cx="410" cy="393" r="4" fill="#27ae60"/>
  <text x="375" y="388" font-size="12" font-weight="bold" fill="#27ae60">S22</text>

  <!-- Wires CH1 (Blue) -->
  <!-- Wire S11 -> S1-1 -->
  <path d="M 410,178 L 255,178" fill="none" stroke="#2457d6" stroke-width="2"/>
  <!-- Wire S1-1 -> S2-1 -->
  <path d="M 210,178 L 210,339" fill="none" stroke="#2457d6" stroke-width="2"/>
  <!-- Wire S2-1 -> S12 -->
  <path d="M 255,339 L 315,339 L 315,202 L 410,202" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Wires CH2 (Green) -->
  <!-- Wire S21 -> S1-2 -->
  <path d="M 410,226 L 285,226 L 285,226 L 255,226" fill="none" stroke="#27ae60" stroke-width="2"/>
  <!-- Wire S1-2 -> S2-2 -->
  <path d="M 190,226 L 190,393" fill="none" stroke="#27ae60" stroke-width="2"/>
  <!-- Wire S2-2 -> S22 -->
  <path d="M 255,393 L 410,393" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Section 2: Logic & Discrepancy Control Block -->
  <rect x="440" y="108" width="240" height="180" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="560" y="128" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Контроль розсинхронізації</text>

  <text x="455" y="150" font-size="12" fill="#1a1a1a">• Порівняння каналів CH1/CH2</text>
  <text x="455" y="170" font-size="12" fill="#1a1a1a">• Час розсинхрону Δt &lt; 0.5 с</text>
  <text x="455" y="190" font-size="12" fill="#1a1a1a">• Захист від КЗ між каналами</text>

  <!-- Status Box -->
  <rect x="455" y="207" width="210" height="68" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="560" y="232" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Стан: Норма (CH1 = CH2)</text>
  <text x="560" y="254" font-size="12" fill="#1a1a1a" text-anchor="middle">Дозвіл увімкнення K1/K2</text>

  <!-- Flow S12/S22 signals into Logic -->
  <path d="M 410,202 L 440,202" fill="none" stroke="#2457d6" stroke-width="2"/>
  <path d="M 410,393 L 428,393 L 428,247 L 440,247" fill="none" stroke="#27ae60" stroke-width="2"/>

  <!-- Section 3: Relays K1 & K2 Coils -->
  <rect x="440" y="302" width="240" height="125" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="560" y="322" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Котушки реле K1 та K2</text>

  <!-- Control signals from logic to coils -->
  <path d="M 560,275 L 560,292 L 502,292 L 502,337" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-blue)"/>
  <path d="M 560,292 L 617,292 L 617,337" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-green)"/>

  <!-- Coil K1 -->
  <rect x="455" y="337" width="95" height="75" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="502" y="362" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Реле K1</text>
  <text x="502" y="384" font-size="12" fill="#6b7280" text-anchor="middle">(Канал 1)</text>

  <!-- Coil K2 -->
  <rect x="570" y="337" width="95" height="75" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="617" y="362" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Реле K2</text>
  <text x="617" y="384" font-size="12" fill="#6b7280" text-anchor="middle">(Канал 2)</text>

  <!-- Section 4: Output Safety Circuits -->
  <rect x="695" y="108" width="220" height="319" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="805" y="128" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вихідні кола безпеки</text>

  <!-- Contact K1 (13-14) -->
  <rect x="710" y="144" width="190" height="72" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="720" y="164" font-size="12" font-weight="bold" fill="#1a1a1a">Контакт K1 (13-14)</text>
  <text x="720" y="184" font-size="12" fill="#6b7280">НО контакт Каналу 1</text>
  <text x="720" y="202" font-size="12" fill="#27ae60">Замикається при K1=1</text>

  <!-- Mechanical link K1 -->
  <path d="M 550,374.5 L 687,374.5 L 687,180 L 710,180" fill="none" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Contact K2 (23-24) -->
  <rect x="710" y="226" width="190" height="72" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="720" y="246" font-size="12" font-weight="bold" fill="#1a1a1a">Контакт K2 (23-24)</text>
  <text x="720" y="266" font-size="12" fill="#6b7280">НО контакт Каналу 2</text>
  <text x="720" y="284" font-size="12" fill="#27ae60">Замикається при K2=1</text>

  <!-- Mechanical link K2 -->
  <path d="M 665,374.5 L 682,374.5 L 682,262 L 710,262" fill="none" stroke="#27ae60" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Power / STO Load box -->
  <rect x="710" y="308" width="190" height="104" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="805" y="330" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Коло силового живлення</text>
  <text x="805" y="350" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">та входи STO робота</text>
  <text x="805" y="372" font-size="12" fill="#6b7280" text-anchor="middle">(Safe Torque Off / Серво)</text>
  <text x="805" y="394" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Активація лише за CH1 і CH2</text>
</svg>
