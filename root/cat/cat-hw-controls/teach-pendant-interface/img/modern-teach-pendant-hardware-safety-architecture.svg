<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Маркери стрілок -->
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Апаратна архітектура безпеки сучасного пульта налагодження (Teach Pendant)</text>
  <text x="480" y="48" text-anchor="middle" font-size="13" fill="#6b7280">Повне схемотехнічне розділення ОС пульта та дубльованих апаратних кіл безпеки (ISO 10218 / ISO 13849 PL e)</text>

  <!-- ЛІВА ПАНЕЛЬ: ПУЛЬТ НАЛАГОДЖЕННЯ (x=30..430) -->
  <g id="teach-pendant">
    <rect x="30" y="80" width="400" height="370" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
    <path d="M 30,105 L 30,88 Q 30,80 38,80 L 422,80 Q 430,80 430,88 L 430,105 Z" fill="#eaf0fd"/>
    <line x1="30" y1="105" x2="430" y2="105" stroke="#2457d6" stroke-width="1.5"/>
    <text x="230" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Пульт налагодження (Teach Pendant)</text>

    <!-- Блок 1.1: HMI Підсистема -->
    <rect x="45" y="118" width="370" height="135" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
    <text x="230" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">HMI-підсистема (Графічна ОС &amp; Сенсорний екран)</text>

    <!-- Touchscreen Box -->
    <rect x="60" y="148" width="160" height="85" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
    <text x="140" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Сенсорний екран 10.4"</text>
    <text x="140" y="186" text-anchor="middle" font-size="11" fill="#6b7280">GUI / Графічний інтерфейс</text>
    <text x="140" y="204" text-anchor="middle" font-size="11" fill="#6b7280">Вибір програм &amp; Ручний Jog</text>
    <text x="140" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Не є засобом безпеки!</text>

    <!-- CPU Box -->
    <rect x="240" y="148" width="160" height="85" rx="4" fill="#f4f6f8" stroke="#2457d6" stroke-width="1"/>
    <text x="320" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Процесор пульта (CPU)</text>
    <text x="320" y="186" text-anchor="middle" font-size="11" fill="#6b7280">ОС Linux / RTOS</text>
    <text x="320" y="204" text-anchor="middle" font-size="11" fill="#6b7280">Industrial Ethernet</text>
    <text x="320" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Цифрова шина HMI</text>

    <line x1="220" y1="190" x2="240" y2="190" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

    <!-- Блок 1.2: Апаратна система безпеки -->
    <rect x="45" y="268" width="370" height="165" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="230" y="286" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Апаратна система безпеки (Hardware Safety Lines)</text>

    <!-- E-Stop Switch Box -->
    <rect x="60" y="298" width="160" height="120" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
    <text x="140" y="316" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Кнопка E-Stop</text>
    <text x="140" y="332" text-anchor="middle" font-size="11" fill="#1a1a1a">(Аварійна зупинка)</text>
    <circle cx="140" cy="352" r="9" fill="#c0392b"/>
    <text x="140" y="375" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">2 × NC контакти</text>
    <text x="140" y="392" text-anchor="middle" font-size="11" fill="#6b7280">Примусовий розрив</text>
    <text x="140" y="408" text-anchor="middle" font-size="11" fill="#6b7280">Стандарт IEC 60947</text>

    <!-- Enabling Switch Box -->
    <rect x="240" y="298" width="160" height="120" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
    <text x="320" y="316" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">3-позиційна кнопка</text>
    <text x="320" y="332" text-anchor="middle" font-size="11" fill="#1a1a1a">(Enabling Switch)</text>
    <text x="320" y="355" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Стан: OFF - ON - OFF</text>
    <text x="320" y="375" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">2 дубльовані канали</text>
    <text x="320" y="392" text-anchor="middle" font-size="11" fill="#6b7280">Панічний захист</text>
    <text x="320" y="408" text-anchor="middle" font-size="11" fill="#6b7280">(ISO 10218 / ISO 13849)</text>
  </g>

  <!-- МІЖПАНЕЛЬНІ ЗВ'ЯЗКИ (x=400..560) -->
  <!-- 1. HMI Bus -->
  <line x1="400" y1="190" x2="560" y2="190" stroke="#2457d6" stroke-width="2.5" stroke-dasharray="6,3" marker-end="url(#arr-blue)"/>
  <rect x="435" y="165" width="90" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="179" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">HMI Bus (Eth)</text>

  <!-- 2. Safety Ch 1 -->
  <line x1="400" y1="330" x2="560" y2="330" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <rect x="435" y="306" width="90" height="18" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="480" y="319" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Safety Ch 1</text>

  <!-- 3. Safety Ch 2 -->
  <line x1="400" y1="380" x2="560" y2="380" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <rect x="435" y="356" width="90" height="18" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="480" y="369" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Safety Ch 2</text>


  <!-- ПРАВА ПАНЕЛЬ: ШАФА КЕРУВАННЯ РОБОТОМ (x=530..930) -->
  <g id="robot-cabinet">
    <rect x="530" y="80" width="400" height="370" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
    <path d="M 530,105 L 530,88 Q 530,80 538,80 L 922,80 Q 930,80 930,88 L 930,105 Z" fill="#eaf0fd"/>
    <line x1="530" y1="105" x2="930" y2="105" stroke="#2457d6" stroke-width="1.5"/>
    <text x="730" y="97" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Шафа керування роботом (Robot Controller)</text>

    <!-- Блок 2.1: Основний ЦПУ робота -->
    <rect x="545" y="118" width="370" height="135" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
    <text x="730" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Основний ЦПУ робота (Motion &amp; Trajectory CPU)</text>

    <!-- Motion CPU Box -->
    <rect x="560" y="148" width="160" height="85" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
    <text x="640" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">ЦПУ траєкторії</text>
    <text x="640" y="186" text-anchor="middle" font-size="11" fill="#6b7280">Обчислення кінематики</text>
    <text x="640" y="204" text-anchor="middle" font-size="11" fill="#6b7280">Виконання програм</text>
    <text x="640" y="222" text-anchor="middle" font-size="11" fill="#2457d6">Прийом команд з HMI</text>

    <!-- Servo Drives Box -->
    <rect x="740" y="148" width="160" height="85" rx="4" fill="#f4f6f8" stroke="#2457d6" stroke-width="1"/>
    <text x="820" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Сервоприводи осей</text>
    <text x="820" y="186" text-anchor="middle" font-size="11" fill="#6b7280">ШІМ-інвертори двигунів</text>
    <text x="820" y="204" text-anchor="middle" font-size="11" fill="#6b7280">Струмове керування</text>
    <text x="820" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Приводи осей J1..J6</text>

    <line x1="720" y1="190" x2="740" y2="190" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

    <!-- Блок 2.2: Апаратний модуль безпеки -->
    <rect x="545" y="268" width="370" height="165" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
    <text x="730" y="286" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Модуль безпеки (Safety Controller / Relays)</text>

    <!-- Safety Relays / PLC Box -->
    <rect x="560" y="298" width="160" height="120" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
    <text x="640" y="316" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Реле безпеки / Safety PLC</text>
    <text x="640" y="332" text-anchor="middle" font-size="11" fill="#1a1a1a">Контроль Ch 1 &amp; Ch 2</text>
    <text x="640" y="355" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Cross-monitoring</text>
    <text x="640" y="375" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Категорія 4 / PL e</text>
    <text x="640" y="392" text-anchor="middle" font-size="11" fill="#6b7280">SIL 3 (IEC 62061)</text>
    <text x="640" y="408" text-anchor="middle" font-size="11" fill="#6b7280">Апаратна логіка</text>

    <!-- STO & Contactors Box -->
    <rect x="740" y="298" width="160" height="120" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
    <text x="820" y="316" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Силовий розрив STO</text>
    <text x="820" y="332" text-anchor="middle" font-size="11" fill="#1a1a1a">Safe Torque Off</text>
    <text x="820" y="355" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Контактори живлення</text>
    <text x="820" y="375" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Розрив шини 400V DC</text>
    <text x="820" y="392" text-anchor="middle" font-size="11" fill="#6b7280">Знеструмлення драйверів</text>
    <text x="820" y="408" text-anchor="middle" font-size="11" fill="#6b7280">Без участі ОС пульта</text>

    <line x1="720" y1="358" x2="740" y2="358" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  </g>

  <!-- НИЖНІЙ ПІДСУМКОВИЙ БАНЕР -->
  <rect x="30" y="475" width="900" height="55" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="497" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">✓ ПОВНА АПАРАТНА НЕЗАЛЕЖНІСТЬ СИСТЕМИ БЕЗПЕКИ ВІД ГРАФІЧНОЇ ОС ПУЛЬТА</text>
  <text x="480" y="516" text-anchor="middle" font-size="12" fill="#1a1a1a">Зависання ОС, збій сенсора чи обрив цифрової шини HMI не заважають дубльованим апаратним колам E-Stop та Enabling Switch знеструмити приводи</text>
</svg>
