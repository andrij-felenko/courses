<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Регуляризація DLS при проходженні кінематичної сингулярності</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Метод демпфірованих найменших квадратів J* = Jᵀ(JJᵀ + λ²I)⁻¹ запобігає вибуху швидкостей суглобів</text>

  <!-- PANEL A: UNREGULARIZED (STANDARD PSEUDO-INVERSE J+) -->
  <g id="panel-unregularized">
    <rect x="30" y="75" width="435" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="247" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">1. БЕЗ РЕГУЛЯРИЗАЦІЇ (ПСЕВДОІНВЕРСІЯ J⁺)</text>
    <line x1="30" y1="108" x2="465" y2="108" stroke="#d0d7de" stroke-width="1"/>

    <!-- Manipulativity Ellipsoid (Collapsed Singularity) -->
    <line x1="75" y1="170" x2="195" y2="170" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="135" y1="135" x2="135" y2="195" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
    <ellipse cx="135" cy="170" rx="50" ry="5" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <text x="135" y="126" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">σ₁ (велика піввісь)</text>
    <text x="135" y="215" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">σ₂ → 0 (виродження)</text>

    <!-- Callout Box Singularity -->
    <rect x="250" y="135" width="195" height="70" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
    <text x="347" y="153" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Виродження Якобіана</text>
    <text x="347" y="172" text-anchor="middle" font-size="11" fill="#1a1a1a">det(J · Jᵀ) = 0</text>
    <text x="347" y="190" text-anchor="middle" font-size="11" fill="#c0392b">Втрата ступеня свободи</text>

    <!-- Velocity Spike Plot q_dot(t) -->
    <line x1="247" y1="240" x2="247" y2="350" stroke="#c0392b" stroke-dasharray="2,2"/>
    <text x="255" y="252" font-size="10" font-weight="bold" fill="#c0392b">Сингулярність</text>

    <line x1="90" y1="350" x2="425" y2="350" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
    <line x1="90" y1="350" x2="90" y2="240" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
    <text x="96" y="235" font-size="11" font-weight="bold" fill="#c0392b">q̇ [рад/с]</text>
    <text x="257" y="372" text-anchor="middle" font-size="11" fill="#1a1a1a">Положення робота (t / q)</text>

    <!-- Exploding Curve -->
    <path d="M 100,340 Q 180,335 210,310 T 247,242 T 284,310 Q 345,335 415,340" fill="none" stroke="#c0392b" stroke-width="3"/>
    <text x="247" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">q̇ → ∞ (стрибок!)</text>

    <!-- Status Badge Panel A -->
    <rect x="50" y="398" width="395" height="24" rx="4" fill="#fdecea" stroke="#c0392b"/>
    <text x="247" y="414" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">🛑 АВАРІЯ: Неконтрольоване розганяння приводів</text>
  </g>

  <!-- PANEL B: REGULARIZED DAMPED LEAST SQUARES (DLS J*) -->
  <g id="panel-dls">
    <rect x="495" y="75" width="435" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="712" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">2. З РЕГУЛЯРИЗАЦІЄЮ DLS (МАТРИЦЯ J*)</text>
    <line x1="495" y1="108" x2="930" y2="108" stroke="#d0d7de" stroke-width="1"/>

    <!-- Damped Ellipsoid -->
    <line x1="535" y1="170" x2="655" y2="170" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="595" y1="135" x2="595" y2="195" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
    <ellipse cx="595" cy="170" rx="50" ry="22" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
    <text x="650" y="165" font-size="11" font-weight="bold" fill="#2457d6">σ₁</text>
    <text x="595" y="215" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">√(σ₂² + λ²) &gt; 0</text>

    <!-- Callout Box DLS -->
    <rect x="685" y="135" width="225" height="70" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
    <text x="797" y="153" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Демпфірування λ²</text>
    <text x="797" y="172" text-anchor="middle" font-size="11" fill="#1a1a1a">J* = Jᵀ (J · Jᵀ + λ²I)⁻¹</text>
    <text x="797" y="190" text-anchor="middle" font-size="11" fill="#27ae60">Обмеження амплітуди</text>

    <!-- Bounded Velocity Plot q_dot(t) -->
    <line x1="712" y1="240" x2="712" y2="350" stroke="#27ae60" stroke-dasharray="2,2"/>
    <text x="720" y="252" font-size="10" font-weight="bold" fill="#27ae60">Зона демпфірування (λ &gt; 0)</text>

    <!-- Limit line q_dot_max -->
    <line x1="550" y1="270" x2="890" y2="270" stroke="#c0392b" stroke-dasharray="4,3"/>
    <text x="885" y="264" text-anchor="end" font-size="11" font-weight="bold" fill="#c0392b">q̇_max (гранична швидкість)</text>

    <line x1="550" y1="350" x2="890" y2="350" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
    <line x1="550" y1="350" x2="550" y2="240" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
    <text x="556" y="235" font-size="11" font-weight="bold" fill="#27ae60">q̇ [рад/с]</text>
    <text x="720" y="372" text-anchor="middle" font-size="11" fill="#1a1a1a">Положення робота (t / q)</text>

    <!-- Smooth Bounded Curve -->
    <path d="M 560,340 Q 632,335 662,312 Q 712,295 762,312 Q 822,335 880,340" fill="none" stroke="#27ae60" stroke-width="3"/>
    <text x="720" y="288" font-size="11" font-weight="bold" fill="#27ae60">q̇ ≤ q̇_max (плавний рух)</text>

    <!-- Status Badge Panel B -->
    <rect x="512" y="398" width="400" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
    <text x="712" y="414" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">✓ БЕЗПЕКА: Стабільна робота маніпулятора без ривків</text>
  </g>
</svg>
