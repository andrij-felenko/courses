<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Маркери стрілок -->
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Структурна блок-схема мікроконтролерного пульта налагодження робота (Teach Pendant)</text>
  <text x="480" y="48" text-anchor="middle" font-size="13" fill="#6b7280">Чітке розділення апаратних дубльованих кіл безпеки (SIL 3 / PL e) та сигнальних периферійних інтерфейсів</text>

  <!-- ЛІВА КОЛОНКА: Органи керування та пристрої безпеки (x=25..225) -->
  <g id="left-inputs">
    <!-- 1.1 3-Позиційна кнопка дозволу -->
    <rect x="25" y="85" width="200" height="85" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="125" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">3-Позиційна кнопка</text>
    <text x="125" y="123" text-anchor="middle" font-size="11" fill="#1a1a1a">Дозволу (Enabling Ch1/Ch2)</text>
    <line x1="35" y1="135" x2="215" y2="135" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="125" y="153" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">SIL 3 / PL e (Дубльована)</text>

    <!-- 1.2 Кнопка E-Stop -->
    <rect x="25" y="180" width="200" height="85" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="125" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Кнопка Аварійного Стопу</text>
    <text x="125" y="218" text-anchor="middle" font-size="11" fill="#1a1a1a">E-Stop (2хNC: ES_Ch1/Ch2)</text>
    <line x1="35" y1="230" x2="215" y2="230" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="125" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Примусове розмикання</text>

    <!-- 1.3 3D-Джойстик -->
    <rect x="25" y="275" width="200" height="85" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="125" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">3D-Джойстик</text>
    <text x="125" y="313" text-anchor="middle" font-size="11" fill="#1a1a1a">Аналоговий (X, Y, Z + Btn)</text>
    <line x1="35" y1="325" x2="215" y2="325" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="125" y="343" text-anchor="middle" font-size="11" fill="#6b7280">Потенціометри / Датчики Голла</text>

    <!-- 1.4 Клавіатура та селектор -->
    <rect x="25" y="370" width="200" height="85" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="125" y="390" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Клавіатура та Селектор</text>
    <text x="125" y="408" text-anchor="middle" font-size="11" fill="#1a1a1a">Матриця кнопок + Режими</text>
    <line x1="35" y1="420" x2="215" y2="420" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,2"/>
    <text x="125" y="438" text-anchor="middle" font-size="11" fill="#6b7280">Auto / Manual / Teach</text>
  </g>

  <!-- ЦЕНТРАЛЬНА КОЛОНКА: Мікроконтролер пульта MCU (x=285..665, y=85..465) -->
  <g id="mcu-core">
    <rect x="285" y="85" width="380" height="380" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
    <path d="M 285,110 L 285,91 Q 285,85 291,85 L 659,85 Q 665,85 665,91 L 665,110 Z" fill="#eaf0fd"/>
    <line x1="285" y1="110" x2="665" y2="110" stroke="#2457d6" stroke-width="1.5"/>
    <text x="475" y="101" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Мікроконтролер пульта (MCU Core)</text>

    <!-- Підблок А: Крос-моніторинг безпеки -->
    <rect x="300" y="125" width="350" height="95" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
    <text x="475" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Модуль Крос-Моніторингу Безпеки</text>
    <text x="475" y="163" text-anchor="middle" font-size="11" fill="#1a1a1a">• Перевірка неузгодженості сигналів (Δt &lt; 20 ms)</text>
    <text x="475" y="180" text-anchor="middle" font-size="11" fill="#1a1a1a">• Контроль КЗ між каналами (Cross-fault Detection)</text>
    <text x="475" y="197" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">• Апаратне блокування виходів при збої</text>

    <!-- Підблок Б: Обробка периферії -->
    <rect x="300" y="235" width="350" height="105" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
    <text x="475" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Обробка Сигналів та Периферії</text>
    <text x="475" y="273" text-anchor="middle" font-size="11" fill="#1a1a1a">• 12-біт АЦП (ADC) з ФНЧ фільтрацією джойстика</text>
    <text x="475" y="290" text-anchor="middle" font-size="11" fill="#1a1a1a">• Сканування матриці кнопок та дебаунсинг (10 ms)</text>
    <text x="475" y="307" text-anchor="middle" font-size="11" fill="#1a1a1a">• Перетворення координат маніпулятора (World/Tool)</text>

    <!-- Підблок В: Формувач кадрів та CRC -->
    <rect x="300" y="355" width="350" height="95" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
    <text x="475" y="375" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Формувач Мережевих Кадрів</text>
    <text x="475" y="393" text-anchor="middle" font-size="11" fill="#1a1a1a">• Упаковка телеметрії та стану кнопок у бінарний кадр</text>
    <text x="475" y="410" text-anchor="middle" font-size="11" fill="#1a1a1a">• Обчислення контрольної суми CRC-16 / CRC-32</text>
    <text x="475" y="427" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">• Контроль обриву зв'язку (Heartbeat 50 ms)</text>
  </g>

  <!-- ПРАВА КОЛОНКА: Вихідні модулі та трансивер (x=725..945) -->
  <g id="right-outputs">
    <!-- 3.1 Модуль реле безпеки -->
    <rect x="725" y="85" width="220" height="170" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="835" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Модуль Реле Безпеки</text>
    <text x="835" y="123" text-anchor="middle" font-size="11" fill="#1a1a1a">Дубльовані силові виходи</text>
    <text x="835" y="140" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Розмикання STO / E-Stop</text>
    <line x1="735" y1="150" x2="935" y2="150" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,2"/>

    <!-- Схема двох реле -->
    <rect x="740" y="162" width="80" height="40" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
    <text x="780" y="186" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Relay Ch1</text>

    <rect x="840" y="162" width="80" height="40" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
    <text x="880" y="186" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Relay Ch2</text>

    <text x="835" y="230" text-anchor="middle" font-size="11" fill="#6b7280">До кола STO робота</text>

    <!-- 3.2 Ізольований трансивер -->
    <rect x="725" y="270" width="220" height="195" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
    <text x="835" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Ізольований Трансивер</text>
    <text x="835" y="308" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">RS-485 / CANopen</text>
    <text x="835" y="325" text-anchor="middle" font-size="11" fill="#6b7280">Розв'язка 2.5 kV</text>
    <line x1="735" y1="337" x2="935" y2="337" stroke="#27ae60" stroke-width="1" stroke-dasharray="3,2"/>

    <rect x="745" y="348" width="180" height="50" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
    <text x="835" y="367" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Кабель пульта (Гич)</text>
    <text x="835" y="385" text-anchor="middle" font-size="11" fill="#1a1a1a">Шина A/B + Живлення</text>

    <text x="835" y="440" text-anchor="middle" font-size="11" fill="#6b7280">До контролера маніпулятора</text>
  </g>

  <!-- ЛІНІЇ СИГНАЛІВ ТА ЗВ'ЯЗКІВ -->

  <!-- 1. Сигнали безпеки (Червоні дубльовані лінії) -->
  <line x1="225" y1="127" x2="285" y2="127" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="255" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Enabling</text>

  <line x1="225" y1="222" x2="285" y2="222" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="255" y="215" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">E-Stop</text>

  <!-- 2. Сигнали периферії (Сині лінії) -->
  <line x1="225" y1="317" x2="285" y2="317" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="255" y="310" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">ADC X/Y/Z</text>

  <line x1="225" y1="412" x2="285" y2="412" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="255" y="405" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Keypad</text>

  <!-- 3. Зв'язок MCU -> Реле безпеки (Червона лінія) -->
  <line x1="665" y1="172" x2="725" y2="172" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="695" y="165" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Trip/Cut</text>

  <!-- 4. Зв'язок MCU -> Трансивер (Зелена лінія) -->
  <line x1="665" y1="402" x2="725" y2="402" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="695" y="395" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">TX/RX</text>

  <!-- НИЖНІЙ ПІДСУМКОВИЙ БАНЕР -->
  <rect x="25" y="485" width="910" height="55" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="507" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">✓ АРХІТЕКТУРА БЕЗПЕКИ: Сигнали E-Stop та 3-позиційної кнопки дубльовані (Ch1/Ch2) та опитуються з крос-моніторингом</text>
  <text x="480" y="526" text-anchor="middle" font-size="12" fill="#1a1a1a">Дані джойстика і клавіатури упаковуються в кадр із CRC-16 та передаються через ізольовану шину RS-485 / CAN</text>
</svg>
