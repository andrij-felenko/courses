<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема фільтрації брязкоту, ESD-захисту та опторозв'язки входу Teach Pendant</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Каскадний захист: TVS-супресор від статики, RC-фільтр брязкоту та оптопара для безпеки МК</text>

  <!-- Left Container: Field Side (+24V Field) (x = 30..505) -->
  <rect x="30" y="85" width="475" height="320" rx="6" ry="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="30" y="85" width="475" height="32" rx="6" fill="#eaf0fd"/>
  <rect x="30" y="107" width="475" height="10" fill="#eaf0fd"/>
  <text x="267" y="106" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Польова сторона (+24V FIELD / GND_FIELD)</text>

  <!-- Right Container: MCU Side (+3.3V MCU) (x = 680..930) -->
  <rect x="680" y="85" width="250" height="320" rx="6" ry="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="680" y="85" width="250" height="32" rx="6" fill="#e9f7ef"/>
  <rect x="680" y="107" width="250" height="10" fill="#e9f7ef"/>
  <text x="805" y="106" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Сторона МК (+3.3V / GND_MCU)</text>

  <!-- Isolation Barrier Line & Text Badge (Positioned in isolation gap x = 505..680) -->
  <!-- Top isolation segment -->
  <line x1="600" y1="85" x2="600" y2="120" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- Badge -->
  <rect x="545" y="120" width="110" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="600" y="136" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Ізоляція 2.5 кВ</text>
  <!-- Middle isolation segment (between badge and IC1) -->
  <line x1="600" y1="144" x2="600" y2="170" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>
  <!-- Bottom isolation segment (below IC1) -->
  <line x1="600" y1="320" x2="600" y2="405" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- ESD Strike Box & Arrow (Top Left) -->
  <rect x="45" y="130" width="125" height="42" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="107" y="147" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">ESD / Стрибок</text>
  <text x="107" y="162" font-size="10" fill="#c0392b" text-anchor="middle">IEC 61000-4-2 (±15 кВ)</text>
  <line x1="107" y1="172" x2="65" y2="210" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>

  <!-- Main Signal Line (Field Side) -->
  <line x1="60" y1="220" x2="535" y2="220" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Input Terminal IN_FIELD -->
  <circle cx="60" cy="220" r="6" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="60" y="242" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">IN_FIELD</text>

  <!-- Stage 1: TVS Diode Branch (x = 125) -->
  <line x1="125" y1="220" x2="125" y2="255" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="125" y1="295" x2="125" y2="360" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- TVS Diode Symbol -->
  <rect x="117" y="255" width="16" height="40" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <polygon points="119,260 131,260 125,272" fill="#c0392b"/>
  <polygon points="119,290 131,290 125,278" fill="#c0392b"/>
  <line x1="115" y1="272" x2="135" y2="272" stroke="#c0392b" stroke-width="2"/>
  <!-- TVS Labels (Positioned left of TVS branch x=125) -->
  <text x="110" y="266" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">D_TVS</text>
  <text x="110" y="282" font-size="11" fill="#6b7280" text-anchor="end">TVS-супресор</text>

  <!-- Stage 2: Pull-down Resistor R_P Branch (x = 210) -->
  <line x1="210" y1="220" x2="210" y2="255" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="210" y1="295" x2="210" y2="360" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Resistor R_P Box -->
  <rect x="202" y="255" width="16" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- R_P Labels (Positioned right of R_P branch x=210) -->
  <text x="224" y="270" font-size="12" font-weight="bold" fill="#1a1a1a">R_P = 10 кОм</text>
  <text x="224" y="287" font-size="11" fill="#6b7280">Підтяжка GND</text>

  <!-- Stage 3: Series Filter Resistor R1 (x = 310..360) -->
  <rect x="310" y="210" width="50" height="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- R1 Labels -->
  <text x="335" y="198" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">R1 = 1 кОм</text>
  <text x="335" y="181" font-size="11" fill="#6b7280" text-anchor="middle">Струмообмежувач</text>

  <!-- Stage 4: Debounce Capacitor C1 Branch (x = 415) -->
  <line x1="415" y1="220" x2="415" y2="258" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="415" y1="272" x2="415" y2="360" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Capacitor C1 Plates -->
  <line x1="403" y1="258" x2="427" y2="258" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="403" y1="272" x2="427" y2="272" stroke="#2457d6" stroke-width="2.5"/>
  <!-- C1 Labels (Positioned right of C1 branch x=415, max x = 430 + 66 = 496 < 505) -->
  <text x="430" y="262" font-size="12" font-weight="bold" fill="#2457d6">C1 = 100 нФ</text>
  <text x="430" y="278" font-size="11" fill="#6b7280">RC-фільтр</text>
  <text x="430" y="293" font-size="10" fill="#6b7280">τ = 100 мкс</text>

  <!-- Optocoupler IC1 Package Box (x = 525..675, sitting cleanly in isolation gap x=505..680) -->
  <rect x="525" y="170" width="150" height="150" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="600" y="190" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Оптопара IC1 (PC817)</text>

  <!-- Optocoupler LED (Field Side: Anode x=535, Cathode x=550) -->
  <line x1="535" y1="220" x2="540" y2="220" stroke="#2457d6" stroke-width="1.5"/>
  <polygon points="540,212 555,220 540,228" fill="#2457d6"/>
  <line x1="555" y1="212" x2="555" y2="228" stroke="#2457d6" stroke-width="2"/>
  <!-- Cathode Ground Drop (x = 550 drops to y=360) -->
  <line x1="550" y1="220" x2="550" y2="360" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Optical Coupling Light Arrows (x = 565..625, inside IC1) -->
  <line x1="565" y1="230" x2="615" y2="230" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="2,2" marker-end="url(#arr-blue)"/>
  <line x1="565" y1="245" x2="615" y2="245" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="2,2" marker-end="url(#arr-blue)"/>
  <text x="600" y="278" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Світловий потік</text>

  <!-- Optocoupler Phototransistor (MCU Side: Collector x=655, Emitter x=655) -->
  <line x1="655" y1="220" x2="655" y2="230" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="640" y1="230" x2="640" y2="260" stroke="#27ae60" stroke-width="2.5"/>
  <line x1="640" y1="235" x2="655" y2="225" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="640" y1="255" x2="655" y2="265" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="655" y1="265" x2="655" y2="360" stroke="#27ae60" stroke-width="1.5"/>
  <!-- Collector Signal Out (Right to x=815) -->
  <line x1="655" y1="220" x2="815" y2="220" stroke="#27ae60" stroke-width="2"/>

  <!-- MCU Power Rail (+3.3V MCU) -->
  <line x1="700" y1="140" x2="745" y2="140" stroke="#27ae60" stroke-width="2"/>
  <text x="720" y="132" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">+3.3V MCU</text>

  <!-- Pull-up Resistor R_PU Branch (MCU Side, x = 720) -->
  <line x1="720" y1="140" x2="720" y2="170" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="712" y="170" width="16" height="30" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="720" y1="200" x2="720" y2="220" stroke="#27ae60" stroke-width="1.5"/>
  <!-- R_PU Labels (Positioned right of R_PU branch x=720, max x = 732 + 78 = 810 < 815) -->
  <text x="732" y="185" font-size="11" font-weight="bold" fill="#27ae60">R_PU = 10 кОм</text>
  <text x="732" y="201" font-size="10" fill="#6b7280">Підтяжка +3.3V</text>

  <!-- Schmitt Trigger Buffer Symbol (x = 815..845) -->
  <polygon points="815,205 845,220 815,235" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="822" y="223" font-size="10" font-weight="bold" fill="#27ae60">⎎</text>
  <line x1="845" y1="220" x2="880" y2="220" stroke="#27ae60" stroke-width="2"/>

  <!-- MCU Output Terminal MCU_GPIO -->
  <circle cx="880" cy="220" r="6" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="880" y="198" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">MCU_GPIO</text>
  <text x="880" y="242" font-size="10" fill="#6b7280" text-anchor="middle">(Чистий сигнал)</text>

  <!-- Ground Lines & Symbols -->
  <!-- GND_FIELD Line (y = 360, x = 60..550) -->
  <line x1="60" y1="360" x2="550" y2="360" stroke="#1a1a1a" stroke-width="2"/>
  <!-- GND_FIELD Symbol (x = 267) -->
  <line x1="257" y1="360" x2="277" y2="360" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="261" y1="365" x2="273" y2="365" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="265" y1="370" x2="269" y2="370" stroke="#1a1a1a" stroke-width="1"/>
  <text x="267" y="388" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GND_FIELD (Земля джерела +24V)</text>

  <!-- GND_MCU Line (y = 360, x = 655..880) -->
  <line x1="655" y1="360" x2="880" y2="360" stroke="#27ae60" stroke-width="2"/>
  <!-- GND_MCU Symbol (x = 805) -->
  <line x1="795" y1="360" x2="815" y2="360" stroke="#27ae60" stroke-width="2"/>
  <line x1="799" y1="365" x2="811" y2="365" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="803" y1="370" x2="807" y2="370" stroke="#27ae60" stroke-width="1"/>
  <text x="805" y="388" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">GND_MCU (Земля контролера)</text>

  <!-- Bottom Summary / Sequence Panel -->
  <rect x="30" y="415" width="900" height="45" rx="6" ry="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="433" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Послідовність обробки сигналу вхідного каскаду Teach Pendant:</text>
  <text x="480" y="450" font-size="11" fill="#6b7280" text-anchor="middle">1. TVS гасить ESD ➔ 2. R_P тримає 0V ➔ 3. R1·C1 фільтрує брязкіт ➔ 4. Оптопара ізолює 2.5 кВ ➔ 5. R_PU формує фронт МК</text>
</svg>
