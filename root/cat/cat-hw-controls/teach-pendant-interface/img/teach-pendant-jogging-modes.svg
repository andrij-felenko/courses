<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема вибору систем координат та ручного позиціонування (Jogging)</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Перетворення вектора відхилення 3D-джойстика у відносні та абсолютні осі маніпулятора</text>

  <!-- Left Panel: 3D Joystick -->
  <rect x="30" y="75" width="280" height="355" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="170" y="95" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Вхідний вектор 3D-джойстика</text>

  <!-- Joystick Illustration -->
  <ellipse cx="170" cy="190" rx="40" ry="18" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <line x1="170" y1="190" x2="170" y2="145" stroke="#1a1a1a" stroke-width="6"/>
  <circle cx="170" cy="145" r="15" fill="#2457d6" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Joystick Axis Vectors -->
  <line x1="170" y1="145" x2="205" y2="145" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="212" y="149" font-size="12" font-weight="bold" fill="#2457d6">+X</text>

  <line x1="170" y1="145" x2="170" y2="115" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="170" y="110" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">+Y</text>

  <!-- Text Card 1 inside Left Panel -->
  <rect x="45" y="225" width="250" height="45" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="170" y="242" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3D-джойстик (3D Joystick)</text>
  <text x="170" y="259" font-size="12" fill="#6b7280" text-anchor="middle">4 ступені вільності (X, Y, Z, Rz)</text>

  <!-- Text Card 2 inside Left Panel -->
  <rect x="45" y="280" width="250" height="135" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="55" y="298" font-size="12" font-weight="bold" fill="#2457d6">Сигнали відхилення:</text>
  <text x="55" y="318" font-size="12" fill="#1a1a1a">• ΔX, ΔY : площинне зсунення</text>
  <text x="55" y="338" font-size="12" fill="#1a1a1a">• ΔZ : вертикальне зусилля</text>
  <text x="55" y="358" font-size="12" fill="#1a1a1a">• ΔRz : кручення ручки</text>
  <text x="55" y="390" font-size="12" fill="#6b7280">Формування векторного коду</text>

  <!-- Center Panel: Coordinate Transformation -->
  <rect x="330" y="75" width="300" height="355" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="480" y="95" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Перетворення координат</text>

  <!-- Mode A -->
  <rect x="345" y="115" width="270" height="70" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="355" y="134" font-size="13" font-weight="bold" fill="#2457d6">Joint (Посуглобовий)</text>
  <text x="355" y="154" font-size="12" fill="#1a1a1a">Прямий рух суглоба J1...J6</text>
  <text x="355" y="172" font-size="12" fill="#6b7280">Кінематика не обчислюється</text>

  <!-- Mode B -->
  <rect x="345" y="198" width="270" height="70" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="355" y="217" font-size="13" font-weight="bold" fill="#2457d6">World (Світовий)</text>
  <text x="355" y="237" font-size="12" fill="#1a1a1a">Декартова система основи</text>
  <text x="355" y="255" font-size="12" fill="#6b7280">Базис: [X_world, Y_world, Z_world]</text>

  <!-- Mode C -->
  <rect x="345" y="281" width="270" height="70" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="355" y="300" font-size="13" font-weight="bold" fill="#2457d6">Tool (Інструментальний)</text>
  <text x="355" y="320" font-size="12" fill="#1a1a1a">Система координат фланця</text>
  <text x="355" y="338" font-size="12" fill="#6b7280">Центр інструмента (TCP)</text>

  <text x="480" y="395" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Перемикання режимів на пульті</text>

  <!-- Right Panel: Robot Output -->
  <rect x="650" y="75" width="280" height="355" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="790" y="95" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3. Реакція маніпулятора</text>

  <!-- Result A -->
  <rect x="665" y="115" width="250" height="70" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="675" y="134" font-size="13" font-weight="bold" fill="#27ae60">Обертання мотора сервоосі</text>
  <text x="675" y="154" font-size="12" fill="#1a1a1a">Зміна кута θ_i одинцем</text>
  <text x="675" y="172" font-size="12" fill="#6b7280">Решта осей зафіксовані</text>

  <!-- Result B -->
  <rect x="665" y="198" width="250" height="70" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="675" y="217" font-size="13" font-weight="bold" fill="#27ae60">Лінійне зсунення TCP</text>
  <text x="675" y="237" font-size="12" fill="#1a1a1a">Прямолінійний траєкторний рух</text>
  <text x="675" y="255" font-size="12" fill="#6b7280">Синхронна робота осей</text>

  <!-- Result C -->
  <rect x="665" y="281" width="250" height="70" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="675" y="300" font-size="13" font-weight="bold" fill="#27ae60">Рух уздовж осі схвата</text>
  <text x="675" y="320" font-size="12" fill="#1a1a1a">Зсунення/поворот підводки</text>
  <text x="675" y="338" font-size="12" fill="#6b7280">Орієнтація відносно деталі</text>

  <!-- Safety Indicator -->
  <rect x="665" y="370" width="250" height="40" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="790" y="394" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Обмеження T1 Mode: V ≤ 250 мм/с</text>

  <!-- Arrows Left to Center -->
  <line x1="310" y1="150" x2="345" y2="150" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="310" y1="233" x2="345" y2="233" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="310" y1="316" x2="345" y2="316" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Arrows Center to Right -->
  <line x1="615" y1="150" x2="665" y2="150" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="615" y1="233" x2="665" y2="233" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="615" y1="316" x2="665" y2="316" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
</svg>
