<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 450" width="960" height="450" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="450" fill="white"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма диференціальних інтерфейсів SSI та BiSS-C</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Синхронна передача абсолютних координат по RS-422 з контролем парності та 6-бітною поліноміальною підсумком CRC</text>

  <!-- PANEL 1: SSI PROTOCOL -->
  <g id="ssi-panel">
    <rect x="30" y="68" width="900" height="172" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="50" y="90" font-size="14" font-weight="bold" fill="#1a1a1a">1. Інтерфейс SSI (Synchronous Serial Interface — RS-422)</text>

    <!-- Signal Labels -->
    <text x="50" y="125" font-size="12" font-weight="bold" fill="#2457d6">CLK (Master)</text>
    <text x="50" y="171" font-size="12" font-weight="bold" fill="#1a1a1a">DATA (Slave)</text>

    <!-- CLK Waveform (Idle High at y=112, Low at y=132) -->
    <path d="M 140 112 L 180 112 L 180 132 L 200 132 L 200 112 L 220 112 L 220 132 L 240 132 L 240 112 L 260 112 L 260 132 L 280 132 L 280 112 L 300 112 L 300 132 L 320 132 L 320 112 L 340 112 L 340 132 L 360 132 L 360 112 L 380 112 L 380 132 L 400 132 L 400 112 L 420 112 L 420 132 L 440 132 L 440 112 L 460 112 L 460 132 L 480 132 L 480 112 L 500 112 L 500 132 L 520 132 L 520 112 L 540 112 L 540 132 L 560 132 L 560 112 L 580 112 L 580 132 L 600 132 L 600 112 L 620 112 L 620 132 L 640 132 L 640 112 L 660 112 L 660 132 L 680 132 L 680 112 L 890 112" fill="none" stroke="#2457d6" stroke-width="2"/>

    <!-- DATA Signal Idle Line before t=0 -->
    <line x1="140" y1="155" x2="180" y2="155" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Latch delay box t_L -->
    <rect x="180" y="155" width="40" height="26" fill="#ffffff" stroke="#6b7280" stroke-dasharray="2,2"/>
    <text x="200" y="172" font-size="11" fill="#6b7280" text-anchor="middle">t_L</text>

    <!-- Data Bits (MSB..LSB) -->
    <rect x="220" y="155" width="40" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="240" y="172" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">MSB</text>

    <rect x="260" y="155" width="40" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="280" y="172" font-size="11" fill="#2457d6" text-anchor="middle">D_n-2</text>

    <rect x="300" y="155" width="40" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="320" y="172" font-size="11" fill="#2457d6" text-anchor="middle">D_n-3</text>

    <rect x="340" y="155" width="100" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="390" y="172" font-size="11" fill="#2457d6" text-anchor="middle">... Дані ...</text>

    <rect x="440" y="155" width="40" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="460" y="172" font-size="11" fill="#2457d6" text-anchor="middle">D_1</text>

    <rect x="480" y="155" width="40" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="500" y="172" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">LSB</text>

    <!-- Status / Parity Bits -->
    <rect x="520" y="155" width="40" height="26" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="540" y="172" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">E</text>

    <rect x="560" y="155" width="40" height="26" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="580" y="172" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">W</text>

    <rect x="600" y="155" width="40" height="26" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="620" y="172" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">P</text>

    <!-- Low state before timeout -->
    <line x1="640" y1="181" x2="680" y2="181" stroke="#1a1a1a" stroke-width="1.5"/>

    <!-- Timeout t_m -->
    <rect x="680" y="155" width="210" height="26" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
    <text x="785" y="172" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Пауза монофлопа t_m (12–20 мкс)</text>

    <!-- Vertical dashed latch line -->
    <line x1="180" y1="112" x2="180" y2="190" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="180" y="206" font-size="11" fill="#6b7280" text-anchor="middle">Фіксація позиції</text>

    <!-- Brackets and Annotations -->
    <line x1="220" y1="190" x2="520" y2="190" stroke="#2457d6" stroke-width="1.5"/>
    <text x="370" y="206" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">N-бітне число координати (код Ґрея / Binary)</text>

    <line x1="520" y1="190" x2="640" y2="190" stroke="#c0392b" stroke-width="1.5"/>
    <text x="580" y="206" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Статус і парність</text>

    <line x1="680" y1="190" x2="890" y2="190" stroke="#27ae60" stroke-width="1.5"/>
    <text x="785" y="206" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Готовність до кадру</text>
  </g>

  <!-- PANEL 2: BiSS-C PROTOCOL -->
  <g id="biss-panel">
    <rect x="30" y="250" width="900" height="182" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="50" y="272" font-size="14" font-weight="bold" fill="#1a1a1a">2. Протокол BiSS-C (Bidirectional Synchronous Serial C-Mode — RS-422)</text>

    <!-- Signal Labels -->
    <text x="50" y="307" font-size="12" font-weight="bold" fill="#2457d6">MA (Clock)</text>
    <text x="50" y="353" font-size="12" font-weight="bold" fill="#1a1a1a">SL (Data)</text>

    <!-- MA Waveform (Continuous Clock y=293 High, y=313 Low) -->
    <path d="M 140 293 L 170 293 L 170 313 L 185 313 L 185 293 L 200 293 L 200 313 L 215 313 L 215 293 L 230 293 L 230 313 L 245 313 L 245 293 L 260 293 L 260 313 L 275 313 L 275 293 L 310 293 L 310 313 L 325 313 L 325 293 L 360 293 L 360 313 L 375 313 L 375 293 L 415 293 L 415 313 L 430 313 L 430 293 L 470 293 L 470 313 L 485 313 L 485 293 L 525 293 L 525 313 L 540 313 L 540 293 L 570 293 L 570 313 L 585 313 L 585 293 L 610 293 L 610 313 L 625 313 L 625 293 L 650 293 L 650 313 L 665 313 L 665 293 L 710 293 L 710 313 L 725 313 L 725 293 L 770 293 L 770 313 L 785 313 L 785 293 L 830 293 L 830 313 L 845 313 L 845 293 L 890 293" fill="none" stroke="#2457d6" stroke-width="2"/>

    <!-- SL Data Frame Blocks (y = 337 to 363, h=26) -->
    <!-- Idle -->
    <line x1="140" y1="337" x2="170" y2="337" stroke="#1a1a1a" stroke-width="1.5"/>

    <!-- ACK -->
    <rect x="170" y="337" width="30" height="26" fill="#e0e0e0" stroke="#6b7280" stroke-width="1.5"/>
    <text x="185" y="354" font-size="11" fill="#1a1a1a" text-anchor="middle">ACK</text>

    <!-- ST=1 -->
    <rect x="200" y="337" width="30" height="26" fill="#e0e0e0" stroke="#6b7280" stroke-width="1.5"/>
    <text x="215" y="354" font-size="11" fill="#1a1a1a" text-anchor="middle">ST=1</text>

    <!-- CDS -->
    <rect x="230" y="337" width="30" height="26" fill="#e0e0e0" stroke="#6b7280" stroke-width="1.5"/>
    <text x="245" y="354" font-size="11" fill="#1a1a1a" text-anchor="middle">CDS</text>

    <!-- Multi-turn Position Data (M bits) -->
    <rect x="260" y="337" width="100" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="310" y="354" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Оберти (M біт)</text>

    <!-- Single-turn Position Data (N bits) -->
    <rect x="360" y="337" width="210" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="465" y="354" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Однооборотні (N біт)</text>

    <!-- Status Bits nE, nW -->
    <rect x="570" y="337" width="40" height="26" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="590" y="354" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">nE</text>

    <rect x="610" y="337" width="40" height="26" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="630" y="354" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">nW</text>

    <!-- CRC-6 Bit Field -->
    <rect x="650" y="337" width="120" height="26" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
    <text x="710" y="354" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">CRC-6 (x⁶ + x + 1)</text>

    <!-- Timeout / Busy -->
    <rect x="770" y="337" width="120" height="26" fill="#ffffff" stroke="#6b7280" stroke-dasharray="3,3"/>
    <text x="830" y="354" font-size="11" fill="#6b7280" text-anchor="middle">t_BUSY / Timeout</text>

    <!-- Brackets and Annotations -->
    <line x1="170" y1="371" x2="260" y2="371" stroke="#6b7280" stroke-width="1.5"/>
    <text x="215" y="387" font-size="11" fill="#6b7280" text-anchor="middle">Синхронізація</text>

    <line x1="260" y1="371" x2="570" y2="371" stroke="#2457d6" stroke-width="1.5"/>
    <text x="415" y="387" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Координати (N + M бітів)</text>

    <line x1="570" y1="371" x2="650" y2="371" stroke="#c0392b" stroke-width="1.5"/>
    <text x="610" y="387" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Статус</text>

    <line x1="650" y1="371" x2="770" y2="371" stroke="#27ae60" stroke-width="1.5"/>
    <text x="710" y="387" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Контрольна сума CRC</text>

    <!-- Footnote Summary Line -->
    <text x="480" y="415" font-size="12" font-style="italic" fill="#6b7280" text-anchor="middle">Безперервний ізохронний режим без втрати тактової частоти</text>
  </g>
</svg>
