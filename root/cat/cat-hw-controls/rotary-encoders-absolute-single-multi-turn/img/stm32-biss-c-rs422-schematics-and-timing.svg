<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема підключення STM32 до BiSS-C та часова діаграма сигналів</text>
  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Диференційна передача по RS-422 (MA±, SLO±) та структура кадрів протоколу BiSS-C</text>

  <!-- SECTION 1: Hardware Schematic Diagram -->
  <rect x="40" y="70" width="880" height="205" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Апаратний інтерфейс RS-422 (STM32 ↔ BiSS-C Енкодер)</text>

  <!-- Block 1: STM32 Microcontroller -->
  <rect x="60" y="108" width="180" height="152" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="150" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">STM32 MCU</text>
  <text x="150" y="146" text-anchor="middle" font-size="12" fill="#6b7280">Апаратний SPI / Timer</text>

  <!-- MA output pin -->
  <text x="228" y="179" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">MA (SCK)</text>
  <line x1="230" y1="175" x2="320" y2="175" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- SLO input pin -->
  <text x="228" y="229" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">SLO (MISO)</text>
  <line x1="320" y1="225" x2="240" y2="225" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>


  <!-- Block 2: RS-422 Transceivers -->
  <rect x="300" y="108" width="360" height="152" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Диференційні трансивери RS-422</text>

  <!-- TX Driver (MA Clock) -->
  <rect x="320" y="155" width="70" height="40" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="355" y="179" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">TX (MA)</text>

  <!-- MA+ Line -->
  <line x1="390" y1="165" x2="720" y2="165" stroke="#2457d6" stroke-width="1.5"/>
  <text x="460" y="160" font-size="12" font-weight="bold" fill="#2457d6">MA+</text>

  <!-- MA- Line -->
  <line x1="390" y1="185" x2="720" y2="185" stroke="#2457d6" stroke-width="1.5"/>
  <text x="460" y="197" font-size="12" font-weight="bold" fill="#2457d6">MA-</text>

  <!-- R1 120 Ohm Termination for MA -->
  <line x1="590" y1="165" x2="590" y2="185" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="586" y="170" width="8" height="10" fill="white" stroke="#1a1a1a"/>
  <text x="590" y="158" text-anchor="middle" font-size="12" fill="#6b7280">120 Ом</text>

  <!-- RX Receiver (SLO Data) -->
  <rect x="320" y="205" width="70" height="40" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="355" y="229" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">RX (SLO)</text>

  <!-- SLO+ Line -->
  <line x1="720" y1="215" x2="390" y2="215" stroke="#27ae60" stroke-width="1.5"/>
  <text x="460" y="210" font-size="12" font-weight="bold" fill="#27ae60">SLO+</text>

  <!-- SLO- Line -->
  <line x1="720" y1="235" x2="390" y2="235" stroke="#27ae60" stroke-width="1.5"/>
  <text x="460" y="247" font-size="12" font-weight="bold" fill="#27ae60">SLO-</text>

  <!-- R2 120 Ohm Termination for SLO -->
  <line x1="590" y1="215" x2="590" y2="235" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="586" y="220" width="8" height="10" fill="white" stroke="#1a1a1a"/>
  <text x="590" y="252" text-anchor="middle" font-size="12" fill="#6b7280">120 Ом</text>


  <!-- Block 3: BiSS-C Encoder -->
  <rect x="720" y="108" width="180" height="152" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="810" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">BiSS-C Енкодер</text>
  <text x="810" y="146" text-anchor="middle" font-size="12" fill="#6b7280">Одно / Багатооборотний</text>

  <text x="728" y="179" font-size="12" font-weight="bold" fill="#1a1a1a">MA±</text>
  <text x="728" y="229" font-size="12" font-weight="bold" fill="#1a1a1a">SLO±</text>


  <!-- SECTION 2: BiSS-C Protocol Timing Diagram -->
  <rect x="40" y="290" width="880" height="225" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="314" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Часова діаграма сигналів BiSS-C (MA та SLO)</text>

  <!-- Signal 1: MA (Clock Waveform) -->
  <text x="60" y="355" font-size="12" font-weight="bold" fill="#2457d6">MA (Такти)</text>

  <!-- MA Waveform Line -->
  <!-- Idle High -->
  <line x1="150" y1="345" x2="210" y2="345" stroke="#2457d6" stroke-width="2"/>
  <!-- Clock Pulses (Square Wave) -->
  <path d="M 210,345 L 210,360 L 225,360 L 225,345 L 240,345 L 240,360 L 255,360 L 255,345 L 270,345 L 270,360 L 285,360 L 285,345 L 300,345 L 300,360 L 315,360 L 315,345 L 330,345 L 330,360 L 345,360 L 345,345 L 360,345 L 360,360 L 375,360 L 375,345 L 390,345 L 390,360 L 405,360 L 405,345 L 420,345 L 420,360 L 435,360 L 435,345 L 450,345 L 450,360 L 465,360 L 465,345 L 480,345 L 480,360 L 495,360 L 495,345 L 510,345 L 510,360 L 525,360 L 525,345 L 540,345 L 540,360 L 555,360 L 555,345 L 570,345 L 570,360 L 585,360 L 585,345 L 600,345 L 600,360 L 615,360 L 615,345 L 630,345 L 630,360 L 645,360 L 645,345 L 660,345 L 660,360 L 675,360 L 675,345 L 690,345 L 690,360 L 705,360 L 705,345 L 720,345 L 720,360 L 735,360 L 735,345 L 750,345 L 750,360 L 765,360 L 765,345 L 780,345 L 780,360 L 795,360 L 795,345 L 810,345 L 810,360 L 830,360 L 830,345 L 890,345" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Signal 2: SLO (Data Waveform) -->
  <text x="60" y="430" font-size="12" font-weight="bold" fill="#27ae60">SLO (Дані)</text>

  <!-- SLO Waveform Line -->
  <!-- Idle High (150-210) -->
  <line x1="150" y1="410" x2="210" y2="410" stroke="#27ae60" stroke-width="2"/>
  <!-- Ack Low (210-250) -->
  <line x1="210" y1="410" x2="210" y2="440" stroke="#27ae60" stroke-width="2"/>
  <line x1="210" y1="440" x2="250" y2="440" stroke="#27ae60" stroke-width="2"/>
  <!-- Start High (250-290) -->
  <line x1="250" y1="440" x2="250" y2="410" stroke="#27ae60" stroke-width="2"/>
  <line x1="250" y1="410" x2="290" y2="410" stroke="#27ae60" stroke-width="2"/>
  <!-- CDS Low (290-330) -->
  <line x1="290" y1="410" x2="290" y2="440" stroke="#27ae60" stroke-width="2"/>
  <line x1="290" y1="440" x2="330" y2="440" stroke="#27ae60" stroke-width="2"/>
  <!-- Position Data Bus Block (330-630) -->
  <line x1="330" y1="440" x2="330" y2="410" stroke="#27ae60" stroke-width="2"/>
  <line x1="330" y1="410" x2="630" y2="410" stroke="#27ae60" stroke-width="2"/>
  <line x1="330" y1="440" x2="630" y2="440" stroke="#27ae60" stroke-width="2"/>
  <!-- Data crosses inside data bus -->
  <line x1="330" y1="410" x2="340" y2="440" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="330" y1="440" x2="340" y2="410" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="620" y1="410" x2="630" y2="440" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="620" y1="440" x2="630" y2="410" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Error Bit E (630-670) -->
  <line x1="630" y1="440" x2="630" y2="410" stroke="#c0392b" stroke-width="2"/>
  <line x1="630" y1="410" x2="670" y2="410" stroke="#c0392b" stroke-width="2"/>

  <!-- Warning Bit W (670-710) -->
  <line x1="670" y1="410" x2="710" y2="410" stroke="#c0392b" stroke-width="2"/>

  <!-- CRC-6 Field (710-810) -->
  <line x1="710" y1="410" x2="710" y2="440" stroke="#27ae60" stroke-width="2"/>
  <line x1="710" y1="410" x2="810" y2="410" stroke="#27ae60" stroke-width="2"/>
  <line x1="710" y1="440" x2="810" y2="440" stroke="#27ae60" stroke-width="2"/>
  <line x1="710" y1="410" x2="720" y2="440" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="710" y1="440" x2="720" y2="410" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="800" y1="410" x2="810" y2="440" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="800" y1="440" x2="810" y2="410" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Timeout / t_busy (810-860) -->
  <line x1="810" y1="410" x2="810" y2="440" stroke="#6b7280" stroke-width="2"/>
  <line x1="810" y1="440" x2="860" y2="440" stroke="#6b7280" stroke-width="2"/>

  <!-- Return to Idle (860-890) -->
  <line x1="860" y1="440" x2="860" y2="410" stroke="#27ae60" stroke-width="2"/>
  <line x1="860" y1="410" x2="890" y2="410" stroke="#27ae60" stroke-width="2"/>


  <!-- Field Callout Tags below Waveforms -->
  <!-- Ack Tag -->
  <rect x="212" y="455" width="36" height="18" rx="3" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="230" y="468" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Ack</text>

  <!-- Start Tag -->
  <rect x="252" y="455" width="36" height="18" rx="3" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="270" y="468" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Start</text>

  <!-- CDS Tag -->
  <rect x="292" y="455" width="36" height="18" rx="3" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="310" y="468" text-anchor="middle" font-size="12" fill="#2457d6">CDS</text>

  <!-- Position Data Box -->
  <rect x="332" y="455" width="296" height="18" rx="3" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="480" y="468" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Позиція (Дані кутового положення)</text>

  <!-- Error Tag (E) -->
  <rect x="632" y="455" width="36" height="18" rx="3" fill="#fdecea" stroke="#c0392b"/>
  <text x="650" y="468" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">E</text>

  <!-- Warning Tag (W) -->
  <rect x="672" y="455" width="36" height="18" rx="3" fill="#fdecea" stroke="#c0392b"/>
  <text x="690" y="468" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">W</text>

  <!-- CRC-6 Box -->
  <rect x="712" y="455" width="96" height="18" rx="3" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="760" y="468" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">CRC-6</text>

  <!-- Timeout Box -->
  <rect x="812" y="455" width="56" height="18" rx="3" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="840" y="468" text-anchor="middle" font-size="12" fill="#6b7280">t_busy</text>

  <!-- Footer Waveform Legend -->
  <text x="480" y="498" text-anchor="middle" font-size="12" fill="#6b7280">Кадр BiSS-C: Ack (0) → Start (1) → CDS → Дані положення → E (Помилка) → W (Попередження) → CRC-6</text>

</svg>
