<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Main Title and Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Однодоріжковий енкодер: Послідовність Де Брьойна та ковзне вікно (n = 4)</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Кільцева послідовність довжиною L = 2⁴ = 16 біт формує унікальний 4-бітний вектор у кожному секторі</text>

  <!-- LEFT PANEL: Sequence and Window -->
  <rect x="30" y="75" width="435" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="45" y="90" width="405" height="34" rx="5" fill="#2457d6"/>
  <text x="247" y="112" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1. Кільцева маска Де Брьойна B(2, 4)</text>

  <!-- Bit Array Title -->
  <text x="247" y="142" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Послідовність бітів диска (L = 16):</text>

  <!-- Window Highlight Container (Behind Bit Cells) -->
  <rect x="106" y="151" width="97" height="36" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>

  <!-- 16 Bit Cells -->
  <!-- Cell 0 (k=0): 0 -->
  <rect x="63" y="155" width="21" height="28" rx="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="73.5" y="174" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0</text>

  <!-- Cell 1 (k=1): 0 -->
  <rect x="86" y="155" width="21" height="28" rx="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="96.5" y="174" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0</text>

  <!-- Cell 2 (k=2): 0 (Window start) -->
  <rect x="109" y="155" width="21" height="28" rx="3" fill="#2457d6" stroke="#2457d6"/>
  <text x="119.5" y="174" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">0</text>

  <!-- Cell 3 (k=3): 0 -->
  <rect x="132" y="155" width="21" height="28" rx="3" fill="#2457d6" stroke="#2457d6"/>
  <text x="142.5" y="174" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">0</text>

  <!-- Cell 4 (k=4): 1 -->
  <rect x="155" y="155" width="21" height="28" rx="3" fill="#2457d6" stroke="#2457d6"/>
  <text x="165.5" y="174" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

  <!-- Cell 5 (k=5): 0 (Window end) -->
  <rect x="178" y="155" width="21" height="28" rx="3" fill="#2457d6" stroke="#2457d6"/>
  <text x="188.5" y="174" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">0</text>

  <!-- Cell 6 (k=6): 1 -->
  <rect x="201" y="155" width="21" height="28" rx="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="211.5" y="174" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1</text>

  <!-- Cell 7 (k=7): 1 -->
  <rect x="224" y="155" width="21" height="28" rx="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="234.5" y="174" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1</text>

  <!-- Cell 8 (k=8): 1 -->
  <rect x="247" y="155" width="21" height="28" rx="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="257.5" y="174" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1</text>

  <!-- Cell 9 (k=9): 1 -->
  <rect x="270" y="155" width="21" height="28" rx="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="280.5" y="174" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1</text>

  <!-- Cell 10 (k=10): 0 -->
  <rect x="293" y="155" width="21" height="28" rx="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="303.5" y="174" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0</text>

  <!-- Cell 11 (k=11): 1 -->
  <rect x="316" y="155" width="21" height="28" rx="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="326.5" y="174" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1</text>

  <!-- Cell 12 (k=12): 0 -->
  <rect x="339" y="155" width="21" height="28" rx="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="349.5" y="174" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0</text>

  <!-- Cell 13 (k=13): 0 -->
  <rect x="362" y="155" width="21" height="28" rx="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="372.5" y="174" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0</text>

  <!-- Cell 14 (k=14): 1 -->
  <rect x="385" y="155" width="21" height="28" rx="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="395.5" y="174" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1</text>

  <!-- Cell 15 (k=15): 1 -->
  <rect x="408" y="155" width="21" height="28" rx="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="418.5" y="174" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1</text>

  <!-- Window Labels -->
  <text x="154.5" y="202" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Ковзне вікно: W₂ = [0 0 1 0]</text>
  <text x="73.5" y="222" font-size="11" fill="#6b7280" text-anchor="middle">k=0</text>
  <text x="154.5" y="222" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">k=2 (Сектор 2)</text>
  <text x="418.5" y="222" font-size="11" fill="#6b7280" text-anchor="middle">k=15</text>
  <text x="247" y="246" font-size="12" fill="#1a1a1a" text-anchor="middle">Крок зсуву: Δθ = 360° / 16 = 22.5°</text>

  <!-- Decoding Card -->
  <rect x="45" y="265" width="405" height="130" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="247" y="286" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Декодування позиції для сектору k = 2:</text>
  <text x="247" y="310" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Читання 4 оптичних датчиків ➔ Вектор: 0010₂</text>
  <text x="247" y="334" font-size="12" fill="#1a1a1a" text-anchor="middle">2. Пошук у LUT-таблиці ➔ LUT[0010₂] = Сектор 2</text>
  <text x="247" y="358" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">3. Розрахунок кута ➔ θ = 2 × 22.5° = 45.0°</text>
  <text x="247" y="380" font-size="12" fill="#6b7280" text-anchor="middle">Однозначна відповідність для будь-якого кута</text>

  <!-- Left Callout Banner -->
  <rect x="45" y="410" width="405" height="75" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="247" y="430" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">✓ Ефективність: 1 доріжка замість 4!</text>
  <text x="247" y="450" font-size="12" fill="#1a1a1a" text-anchor="middle">Замість N окремих концентричних кодових кіл</text>
  <text x="247" y="468" font-size="12" fill="#1a1a1a" text-anchor="middle">використовують 1 доріжку та лінійну фотоматрицу</text>

  <!-- RIGHT PANEL: Table of Sectors -->
  <rect x="495" y="75" width="435" height="425" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="510" y="90" width="405" height="34" rx="5" fill="#27ae60"/>
  <text x="712" y="112" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2. Таблиця унікальних секторних векторів (LUT)</text>

  <!-- Table Column Headers -->
  <text x="605" y="138" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Сектори 0 – 7 (0° – 157.5°)</text>
  <text x="815" y="138" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Сектори 8 – 15 (180° – 337.5°)</text>

  <!-- Table Column 1 Background -->
  <rect x="515" y="146" width="180" height="230" rx="5" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Table Column 2 Background -->
  <rect x="725" y="146" width="180" height="230" rx="5" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Highlight Row for Sector k=2 -->
  <rect x="517" y="202" width="176" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Column 1 Rows -->
  <text x="605" y="162" font-size="12" fill="#1a1a1a" text-anchor="middle">k=0  (0.0°):   0000₂</text>
  <text x="605" y="190" font-size="12" fill="#1a1a1a" text-anchor="middle">k=1  (22.5°):  0001₂</text>
  <text x="605" y="218" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">k=2  (45.0°):  0010₂  ➔ k=2</text>
  <text x="605" y="246" font-size="12" fill="#1a1a1a" text-anchor="middle">k=3  (67.5°):  0101₂</text>
  <text x="605" y="274" font-size="12" fill="#1a1a1a" text-anchor="middle">k=4  (90.0°):  1011₂</text>
  <text x="605" y="302" font-size="12" fill="#1a1a1a" text-anchor="middle">k=5  (112.5°): 0111₂</text>
  <text x="605" y="330" font-size="12" fill="#1a1a1a" text-anchor="middle">k=6  (135.0°): 1111₂</text>
  <text x="605" y="358" font-size="12" fill="#1a1a1a" text-anchor="middle">k=7  (157.5°): 1110₂</text>

  <!-- Column 2 Rows -->
  <text x="815" y="162" font-size="12" fill="#1a1a1a" text-anchor="middle">k=8  (180.0°): 1101₂</text>
  <text x="815" y="190" font-size="12" fill="#1a1a1a" text-anchor="middle">k=9  (202.5°): 1010₂</text>
  <text x="815" y="218" font-size="12" fill="#1a1a1a" text-anchor="middle">k=10 (225.0°): 0100₂</text>
  <text x="815" y="246" font-size="12" fill="#1a1a1a" text-anchor="middle">k=11 (247.5°): 1001₂</text>
  <text x="815" y="274" font-size="12" fill="#1a1a1a" text-anchor="middle">k=12 (270.0°): 0011₂</text>
  <text x="815" y="302" font-size="12" fill="#1a1a1a" text-anchor="middle">k=13 (292.5°): 0110₂</text>
  <text x="815" y="330" font-size="12" fill="#1a1a1a" text-anchor="middle">k=14 (315.0°): 1100₂</text>
  <text x="815" y="358" font-size="12" fill="#1a1a1a" text-anchor="middle">k=15 (337.5°): 1000₂</text>

  <!-- Table Footer Note -->
  <text x="712" y="390" font-size="12" fill="#6b7280" text-anchor="middle">Усі 16 4-бітних комбінацій є унікальними</text>

  <!-- Right Callout Banner -->
  <rect x="510" y="410" width="405" height="75" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="712" y="430" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">✓ 100% Покриття кутового простору 360°</text>
  <text x="712" y="450" font-size="12" fill="#1a1a1a" text-anchor="middle">Неповторність векторів дає змогу миттєво</text>
  <text x="712" y="468" font-size="12" fill="#1a1a1a" text-anchor="middle">визначати абсолютний кут при увімкненні живлення</text>
</svg>
