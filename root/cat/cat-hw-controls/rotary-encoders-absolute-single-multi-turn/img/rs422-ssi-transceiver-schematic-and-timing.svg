<svg viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схемотехніка сполучення RS-422 / SSI та часова діаграма кадру</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Диференційна передача сигналів Clock і Data та формат послідовного кадру з розповсюдженням бітів</text>

  <!-- SECTION 1: SCHEMATIC PANEL -->
  <rect x="40" y="75" width="880" height="220" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="98" font-size="14" font-weight="bold" fill="#1a1a1a">1. Схемотехніка сполучення RS-422 трансиверів</text>

  <!-- MCU Block -->
  <rect x="60" y="115" width="140" height="160" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="130" y="135" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Мікроконтролер (MCU)</text>
  <text x="190" y="155" font-size="12" fill="#1a1a1a" text-anchor="end">CLK (Out)</text>
  <text x="190" y="225" font-size="12" fill="#1a1a1a" text-anchor="end">DATA (In)</text>

  <!-- MCU Tx (Clock) IC -->
  <rect x="230" y="140" width="70" height="40" rx="4" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="265" y="164" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Tx (Clock)</text>

  <!-- Line MCU -> Tx -->
  <line x1="190" y1="160" x2="228" y2="160" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- MCU Rx (Data) IC -->
  <rect x="230" y="210" width="70" height="40" rx="4" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="265" y="234" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Rx (Data)</text>

  <!-- Line Rx -> MCU -->
  <line x1="230" y1="230" x2="192" y2="230" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Differential Lines: Clock (CLK+ / CLK-) -->
  <text x="490" y="142" font-size="12" fill="#2457d6" text-anchor="middle">Диференційна пара Clock (CLK+ / CLK-)</text>
  <!-- CLK+ Line -->
  <line x1="300" y1="150" x2="678" y2="150" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="310" y="146" font-size="12" fill="#2457d6">CLK+</text>

  <!-- CLK- Line -->
  <line x1="300" y1="170" x2="678" y2="170" stroke="#2457d6" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-blue)"/>
  <text x="310" y="183" font-size="12" fill="#2457d6">CLK-</text>

  <!-- Termination Resistor RT for CLK at Encoder side -->
  <line x1="650" y1="150" x2="650" y2="154" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="645" y="154" width="10" height="12" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="650" y1="166" x2="650" y2="170" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="638" y="164" font-size="12" fill="#1a1a1a" text-anchor="end">R_T = 120 Ω</text>

  <!-- Differential Lines: Data (DATA+ / DATA-) -->
  <!-- DATA+ Line -->
  <line x1="680" y1="220" x2="302" y2="220" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="670" y="216" font-size="12" fill="#27ae60" text-anchor="end">DATA+</text>

  <!-- DATA- Line -->
  <line x1="680" y1="240" x2="302" y2="240" stroke="#27ae60" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <text x="670" y="253" font-size="12" fill="#27ae60" text-anchor="end">DATA-</text>

  <text x="490" y="260" font-size="12" fill="#27ae60" text-anchor="middle">Диференційна пара Data (DATA+ / DATA-)</text>

  <!-- Termination Resistor RT for DATA at MCU side -->
  <line x1="330" y1="220" x2="330" y2="224" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="325" y="224" width="10" height="12" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="330" y1="236" x2="330" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="343" y="234" font-size="12" fill="#1a1a1a" text-anchor="start">R_T = 120 Ω</text>

  <!-- Encoder Block -->
  <rect x="760" y="115" width="140" height="160" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="830" y="135" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">SSI Енкодер (Slave)</text>

  <!-- Encoder Rx (Clock) IC -->
  <rect x="680" y="140" width="60" height="40" rx="4" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="710" y="164" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Rx</text>
  <line x1="740" y1="160" x2="760" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Encoder Tx (Data) IC -->
  <rect x="680" y="210" width="60" height="40" rx="4" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="710" y="234" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Tx</text>
  <line x1="760" y1="230" x2="740" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- SECTION 2: TIMING DIAGRAM PANEL -->
  <rect x="40" y="315" width="880" height="220" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="338" font-size="14" font-weight="bold" fill="#1a1a1a">2. Часова діаграма кадру SSI (Clock, Data та моностабільна пауза t_m)</text>

  <!-- Waveform Labels -->
  <text x="55" y="385" font-size="12" font-weight="bold" fill="#2457d6">CLK+ / CLK-</text>
  <text x="55" y="455" font-size="12" font-weight="bold" fill="#27ae60">DATA+ / DATA-</text>

  <!-- Vertical Guide / Latch Marker -->
  <line x1="210" y1="350" x2="210" y2="500" stroke="#c0392b" stroke-dasharray="3,3" stroke-width="1.5"/>
  <text x="210" y="348" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Фіксація координати (Latch)</text>

  <!-- Idle Annotations -->
  <text x="160" y="360" font-size="12" fill="#6b7280" text-anchor="middle">Пауза (High)</text>

  <!-- CLK Waveform Path -->
  <path d="M 130,370 L 210,370 L 210,395 L 240,395 L 240,370 L 270,370 L 270,395 L 300,395 L 300,370 L 330,370 L 330,395 L 360,395 L 360,370 L 390,370 M 450,370 L 480,370 L 480,395 L 510,395 L 510,370 L 540,370 L 540,395 L 570,395 L 570,370 L 870,370" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Ellipsis for CLK -->
  <text x="420" y="385" font-size="14" font-weight="bold" fill="#6b7280" text-anchor="middle">. . .</text>

  <!-- DATA Waveform Path -->
  <path d="M 130,440 L 210,440 L 210,465 L 240,465 L 240,440 L 270,440 L 270,465 L 330,465 L 330,440 L 390,440 M 450,440 L 510,440 L 510,465 L 760,465 L 760,440 L 870,440" fill="none" stroke="#27ae60" stroke-width="2"/>

  <!-- Ellipsis for DATA -->
  <text x="420" y="455" font-size="14" font-weight="bold" fill="#6b7280" text-anchor="middle">. . .</text>

  <!-- Bit Data Labels -->
  <text x="255" y="430" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">MSB (Bit N-1)</text>
  <text x="300" y="482" font-size="12" fill="#1a1a1a" text-anchor="middle">Bit N-2</text>
  <text x="360" y="430" font-size="12" fill="#1a1a1a" text-anchor="middle">Bit N-3</text>
  <text x="480" y="430" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">LSB (Bit 0)</text>
  <text x="540" y="482" font-size="12" fill="#c0392b" text-anchor="middle">Parity / Err</text>

  <!-- Monostable Timeout tm Shaded Box & Dimension Line -->
  <rect x="570" y="355" width="190" height="135" fill="#fdecea" opacity="0.6" stroke="#c0392b" stroke-dasharray="3,3" stroke-width="1"/>
  
  <!-- Dimension Line for tm -->
  <line x1="570" y1="505" x2="760" y2="505" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="570" y1="498" x2="570" y2="512" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="760" y1="498" x2="760" y2="512" stroke="#c0392b" stroke-width="1.5"/>
  <text x="665" y="525" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">t_m (моностабільний таймаут: 12…20 мкс)</text>

  <!-- Ready Label -->
  <text x="820" y="360" font-size="12" fill="#27ae60" text-anchor="middle">Готовність до наступного кадру</text>
</svg>
