<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Main Title and Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принципова схема підключення абсолютного енкодера SSI/BiSS-C до STM32</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Узгодження диференціальних ліній RS-422 із термінаційними резисторами 120 Ом та захистом від завад</text>

  <!-- BLOCK 1: STM32 Microcontroller -->
  <rect x="30" y="85" width="220" height="345" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="45" y="98" width="190" height="30" rx="4" fill="#2457d6"/>
  <text x="140" y="118" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">STM32F4 / SPI (MCU)</text>

  <!-- STM32 PA5 Pin -->
  <text x="140" y="168" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">PA5 (SPI1_SCK / Master)</text>
  <rect x="220" y="180" width="15" height="20" fill="#ffffff" stroke="#2457d6"/>
  <text x="210" y="194" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">TX_CLK ➔</text>

  <!-- Power and GND labels -->
  <text x="140" y="245" font-size="12" fill="#6b7280" text-anchor="middle">Живлення VDD = +3.3V</text>
  <text x="140" y="265" font-size="12" fill="#6b7280" text-anchor="middle">Спільне заземлення GND</text>

  <!-- STM32 PA6 Pin -->
  <text x="140" y="328" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">PA6 (SPI1_MISO / Master)</text>
  <rect x="220" y="340" width="15" height="20" fill="#ffffff" stroke="#27ae60"/>
  <text x="210" y="354" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">RX_DATA </text>

  <text x="140" y="405" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">SPI Hardware Engine</text>

  <!-- BLOCK 2: RS-422 Transceivers Board -->
  <rect x="280" y="85" width="400" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="295" y="98" width="370" height="30" rx="4" fill="#1a1a1a"/>
  <text x="480" y="118" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Плата узгодження ліній RS-422 (SN65HVD82)</text>

  <!-- IC1 Sub-box: TX Driver for Clock -->
  <rect x="295" y="140" width="370" height="120" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="480" y="160" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">IC1: Transmitter (CLK Driver)</text>
  <text x="310" y="194" font-size="12" font-weight="bold" fill="#1a1a1a">D</text>
  <text x="650" y="184" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">Y (CLK+)</text>
  <text x="650" y="214" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">Z (CLK-)</text>
  <text x="480" y="242" font-size="12" fill="#6b7280" text-anchor="middle">Перетворення 3.3V CMOS ➔ RS-422 Differential</text>

  <!-- IC2 Sub-box: RX Receiver for Data -->
  <rect x="295" y="280" width="370" height="120" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="480" y="300" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">IC2: Receiver (DATA Receiver)</text>
  <text x="650" y="324" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">A (DATA+)</text>
  <text x="650" y="354" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">B (DATA-)</text>
  <text x="310" y="354" font-size="12" font-weight="bold" fill="#1a1a1a">R</text>
  <text x="480" y="382" font-size="12" fill="#6b7280" text-anchor="middle">Перетворення RS-422 Differential ➔ 3.3V CMOS</text>

  <!-- BLOCK 3: Absolute Encoder -->
  <rect x="710" y="85" width="220" height="345" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="725" y="98" width="190" height="30" rx="4" fill="#27ae60"/>
  <text x="820" y="118" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Промисловий Енкодер</text>

  <!-- Encoder Clock Inputs -->
  <rect x="710" y="170" width="15" height="20" fill="#ffffff" stroke="#2457d6"/>
  <text x="732" y="184" font-size="12" font-weight="bold" fill="#2457d6">CLK+</text>
  <rect x="710" y="200" width="15" height="20" fill="#ffffff" stroke="#2457d6"/>
  <text x="732" y="214" font-size="12" font-weight="bold" fill="#2457d6">CLK-</text>

  <text x="820" y="255" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Протокол: SSI / BiSS-C</text>
  <text x="820" y="275" font-size="12" fill="#6b7280" text-anchor="middle">Розрядність: 12..24 біт</text>

  <!-- Encoder Data Outputs -->
  <rect x="710" y="310" width="15" height="20" fill="#ffffff" stroke="#27ae60"/>
  <text x="732" y="324" font-size="12" font-weight="bold" fill="#27ae60">DATA+</text>
  <rect x="710" y="340" width="15" height="20" fill="#ffffff" stroke="#27ae60"/>
  <text x="732" y="354" font-size="12" font-weight="bold" fill="#27ae60">DATA-</text>

  <text x="820" y="395" font-size="12" fill="#6b7280" text-anchor="middle">Живлення: +5V / +24V DC</text>

  <!-- INTERCONNECT LINES -->

  <!-- Clock Single-ended (STM32 PA5 to Transceiver IC1 D) -->
  <line x1="235" y1="190" x2="295" y2="190" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="265" y="182" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">CLK</text>

  <!-- Clock Differential Lines (IC1 Y/Z to Encoder CLK+/CLK-) -->
  <line x1="665" y1="180" x2="710" y2="180" stroke="#2457d6" stroke-width="2"/>
  <line x1="665" y1="210" x2="710" y2="210" stroke="#2457d6" stroke-width="2"/>
  <text x="635" y="174" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">CLK+</text>
  <text x="635" y="224" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">CLK-</text>

  <!-- Resistor 1: CLK Termination 120 Ohm -->
  <line x1="687" y1="180" x2="687" y2="187" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="680" y="187" width="14" height="16" rx="2" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="687" y1="203" x2="687" y2="210" stroke="#c0392b" stroke-width="1.5"/>
  <text x="687" y="232" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">R_t1 = 120 Ом</text>

  <!-- Data Differential Lines (Encoder DATA+/DATA- to Transceiver IC2 A/B) -->
  <line x1="710" y1="320" x2="665" y2="320" stroke="#27ae60" stroke-width="2"/>
  <line x1="710" y1="350" x2="665" y2="350" stroke="#27ae60" stroke-width="2"/>
  <text x="635" y="314" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">DATA+</text>
  <text x="635" y="364" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">DATA-</text>

  <!-- Resistor 2: DATA Termination 120 Ohm -->
  <line x1="687" y1="320" x2="687" y2="327" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="680" y="327" width="14" height="16" rx="2" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="687" y1="343" x2="687" y2="350" stroke="#c0392b" stroke-width="1.5"/>
  <text x="687" y="372" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">R_t2 = 120 Ом</text>

  <!-- Data Single-ended (Transceiver IC2 R to STM32 PA6) -->
  <line x1="295" y1="350" x2="235" y2="350" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="265" y="342" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">DATA</text>

  <!-- BOTTOM PANEL: Protection and Line Parameters -->
  <rect x="30" y="445" width="900" height="50" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="465" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Захист ліній: Термінатори 120 Ом усувають відбиття хвиль у довгому кабелі RS-422</text>
  <text x="480" y="483" font-size="12" fill="#6b7280" text-anchor="middle">Екранований витий кабель (STP) та диференційна передача забезпечують високу завадостійкість</text>
</svg>
