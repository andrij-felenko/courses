<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <defs>
    <!-- Arrow Markers -->
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Топологія заземлення та екранування кабелів енкодерів</text>
  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Одноточкове заземлення екрана на PE шафи запобігає появі паразитних струмових контурів</text>

  <!-- ЛІВА ПАНЕЛЬ: Одноточкове заземлення (Правильно) -->
  <rect x="25" y="65" width="440" height="455" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="35" y="75" width="420" height="32" rx="4" fill="#27ae60" opacity="0.15" stroke="#27ae60" stroke-width="1"/>
  <text x="245" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e7e34">1. Одноточкове заземлення екрана (Правильно)</text>

  <!-- Шафа ПЛК (Ліва сторона) -->
  <rect x="45" y="125" width="110" height="210" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="100" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Шафа ПЛК</text>

  <!-- Шина PE в шафі -->
  <rect x="55" y="280" width="80" height="20" rx="3" fill="#27ae60"/>
  <text x="95" y="294" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Шина PE</text>

  <!-- Символ заземлення PE -->
  <line x1="95" y1="300" x2="95" y2="315" stroke="#27ae60" stroke-width="2"/>
  <line x1="83" y1="315" x2="107" y2="315" stroke="#27ae60" stroke-width="2"/>
  <line x1="87" y1="319" x2="103" y2="319" stroke="#27ae60" stroke-width="2"/>
  <line x1="91" y1="323" x2="99" y2="323" stroke="#27ae60" stroke-width="2"/>

  <!-- Корпус енкодера (Права сторона лівої панелі) -->
  <rect x="325" y="125" width="120" height="210" rx="6" fill="#ffffff" stroke="#7f8c8d" stroke-width="1.5"/>
  <text x="385" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Енкодер</text>
  <text x="385" y="315" text-anchor="middle" font-size="12" fill="#7f8c8d">Корпус енкодера</text>

  <!-- Оболонка екрана кабелю (у проміжку між шафою та енкодером) -->
  <rect x="175" y="175" width="130" height="50" rx="6" fill="#ffffff" stroke="#95a5a6" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="240" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#7f8c8d">Екранований кабель</text>

  <!-- Сигнальні проводи витої пари -->
  <line x1="100" y1="190" x2="385" y2="190" stroke="#2457d6" stroke-width="2"/>
  <line x1="100" y1="210" x2="385" y2="210" stroke="#c0392b" stroke-width="2"/>

  <!-- 360° ЕМС-скоба на вході в шафу (Path замість Rect для виключення конфліктів прямокутників) -->
  <path d="M 160,168 L 170,168 L 170,232 L 160,232 Z" fill="#27ae60"/>

  <!-- Лінія заземлення від скоби до шини PE -->
  <path d="M 165,232 L 165,290 L 135,290" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Текстові підписи для скоби та ізольованого кінця -->
  <text x="185" y="250" font-size="12" font-weight="bold" fill="#27ae60">360° ЕМС-скоба</text>

  <!-- Ізольований незаключений кінець екрана біля енкодера -->
  <line x1="305" y1="175" x2="305" y2="225" stroke="#c0392b" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="315" y="250" font-size="12" font-weight="bold" fill="#c0392b">Не підключати</text>

  <!-- Блок висновку лівої панелі -->
  <rect x="35" y="355" width="420" height="150" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="45" y="380" font-size="12" font-weight="bold" fill="#1a1a1a">• 360° затискач екрана на вході в шафу ПЛК</text>
  <text x="45" y="405" font-size="12" fill="#27ae60">• Відсутність контуру: струм I_loop = 0 (коло розімкнене)</text>
  <text x="45" y="430" font-size="12" fill="#2457d6">• Скидання завад ВЧ безпосередньо на шину PE</text>
  <text x="45" y="455" font-size="12" fill="#6b7280">• Висока завадозахищеність сигнальних кіл</text>
  <text x="45" y="480" font-size="12" font-weight="bold" fill="#1e7e34">• Рекомендований стандарт монтажу ЕМС</text>


  <!-- ПРАВА ПАНЕЛЬ: Двоточкове заземлення (Помилка) -->
  <rect x="495" y="65" width="440" height="455" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="505" y="75" width="420" height="32" rx="4" fill="#c0392b" opacity="0.15" stroke="#c0392b" stroke-width="1"/>
  <text x="715" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">2. Двоточкове заземлення з контуром (Помилка)</text>

  <!-- Шафа ПЛК (Ліва сторона правої панелі) -->
  <rect x="515" y="125" width="110" height="210" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="570" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Шафа ПЛК</text>

  <!-- Шина PE1 в шафі -->
  <rect x="525" y="280" width="90" height="20" rx="3" fill="#2457d6"/>
  <text x="570" y="294" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">PE1 (V1)</text>

  <!-- Символ PE1 -->
  <line x1="570" y1="300" x2="570" y2="315" stroke="#2457d6" stroke-width="2"/>
  <line x1="558" y1="315" x2="582" y2="315" stroke="#2457d6" stroke-width="2"/>
  <line x1="562" y1="319" x2="578" y2="319" stroke="#2457d6" stroke-width="2"/>
  <line x1="566" y1="323" x2="574" y2="323" stroke="#2457d6" stroke-width="2"/>

  <!-- Енкодер двигуна (Права сторона правої панелі) -->
  <rect x="795" y="125" width="120" height="210" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="855" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Енкодер двигуна</text>

  <!-- Шина PE2 біля двигуна -->
  <rect x="810" y="280" width="90" height="20" rx="3" fill="#c0392b"/>
  <text x="855" y="294" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">PE2 (V2)</text>

  <!-- Символ PE2 -->
  <line x1="855" y1="300" x2="855" y2="315" stroke="#c0392b" stroke-width="2"/>
  <line x1="843" y1="315" x2="867" y2="315" stroke="#c0392b" stroke-width="2"/>
  <line x1="847" y1="319" x2="863" y2="319" stroke="#c0392b" stroke-width="2"/>
  <line x1="851" y1="323" x2="859" y2="323" stroke="#c0392b" stroke-width="2"/>

  <!-- Оболонка екрана кабелю -->
  <rect x="645" y="175" width="130" height="50" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="710" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Двоточкове підключення!</text>

  <!-- Сигнальні проводи -->
  <line x1="570" y1="190" x2="855" y2="190" stroke="#2457d6" stroke-width="2"/>
  <line x1="570" y1="210" x2="855" y2="210" stroke="#c0392b" stroke-width="2"/>

  <!-- Лівий зв’язок екрана з PE1 -->
  <path d="M 645,225 L 645,290 L 615,290" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Правий зв’язок екрана з PE2 -->
  <path d="M 775,225 L 775,290 L 810,290" fill="none" stroke="#c0392b" stroke-width="2"/>

  <!-- Шлях замкненого струмового контуру (I_loop) -->
  <path d="M 615,290 L 810,290 L 775,225 L 645,225 Z" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>

  <!-- Напис струмового контуру всередині замкненого прямокутника -->
  <text x="710" y="250" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Струм I_loop</text>
  <text x="710" y="268" text-anchor="middle" font-size="12" fill="#c0392b">різниця V1 - V2</text>

  <!-- Блок висновку правої панелі -->
  <rect x="505" y="355" width="420" height="150" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="515" y="380" font-size="12" font-weight="bold" fill="#c0392b">• Небезпека: різниця потенціалів ΔV між заземленнями</text>
  <text x="515" y="405" font-size="12" fill="#c0392b">• Паразитний струм I_loop протікає по оплетці екрана</text>
  <text x="515" y="430" font-size="12" fill="#6b7280">• Наведення завад викликає помилки даних і CRC</text>
  <text x="515" y="455" font-size="12" fill="#1a1a1a">• Загроза пошкодження портів RS-422 / SSI / BiSS</text>
  <text x="515" y="480" font-size="12" font-weight="bold" fill="#c0392b">• Неприпустима топологія в промислових мережах</text>
</svg>
