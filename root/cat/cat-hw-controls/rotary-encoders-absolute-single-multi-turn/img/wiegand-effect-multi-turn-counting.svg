<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Ефект Віґанда у безбатарейних багатооборотних енкодерах</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Стрибкоподібне перемагнічування дроту генерує імпульс напруги для живлення лічильника</text>

  <!-- PANEL 1: Wiegand Wire Construction -->
  <rect x="20" y="70" width="290" height="295" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <rect x="35" y="82" width="260" height="30" fill="#ffffff" stroke="#d0d7de" rx="4"/>
  <text x="165" y="102" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Конструкція сенсора Віґанда</text>

  <!-- Rotor Magnets -->
  <rect x="85" y="125" width="65" height="26" fill="#c0392b" rx="3"/>
  <text x="117.5" y="142" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">S (Магніт)</text>
  
  <rect x="180" y="125" width="65" height="26" fill="#2457d6" rx="3"/>
  <text x="212.5" y="142" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">N (Магніт)</text>

  <!-- Field lines -->
  <path d="M 117.5,151 L 117.5,170" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
  <path d="M 212.5,151 L 212.5,170" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-blue)"/>

  <!-- Vicalloy Wire (Hard Shell / Soft Core) -->
  <rect x="50" y="175" width="230" height="44" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="4"/>
  <rect x="65" y="188" width="200" height="18" fill="#2457d6" opacity="0.85" rx="2"/>
  <text x="165" y="201" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">М'яке ферромагнітне ядро</text>

  <!-- Coil Winding Loops -->
  <path d="M 85,168 C 80,160 80,226 85,226 M 115,168 C 110,160 110,226 115,226 M 145,168 C 140,160 140,226 145,226 M 175,168 C 170,160 170,226 175,226 M 205,168 C 200,160 200,226 205,226 M 235,168 C 230,160 230,226 235,226" stroke="#d97706" stroke-width="2.5" fill="none"/>

  <!-- Labels Panel 1 -->
  <text x="165" y="240" font-size="12" fill="#1a1a1a" text-anchor="middle">Тверда оболонка (висока H_c)</text>
  <text x="165" y="260" font-size="12" fill="#d97706" text-anchor="middle">Котушка зчитування (N витків)</text>

  <rect x="50" y="280" width="230" height="32" fill="#ffffff" stroke="#d0d7de" rx="4"/>
  <text x="165" y="301" font-size="12" fill="#6b7280" text-anchor="middle">Зовнішнє магнітне поле обертається (B_ext)</text>

  <text x="165" y="332" font-size="12" fill="#1a1a1a" text-anchor="middle">Діаметр дроту Віґанда: d ≈ 0.25 мм</text>
  <text x="165" y="352" font-size="11" fill="#6b7280" text-anchor="middle">Спеціальне термомеханічне гартування</text>


  <!-- PANEL 2: Hysteresis & Voltage Pulse -->
  <rect x="325" y="70" width="310" height="295" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <rect x="340" y="82" width="280" height="30" fill="#ffffff" stroke="#d0d7de" rx="4"/>
  <text x="480" y="102" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Гістерезис та імпульс напруги</text>

  <!-- Plot 1: B-H Loop -->
  <line x1="360" y1="175" x2="590" y2="175" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="600" y="179" font-size="12" fill="#1a1a1a">H</text>

  <line x1="480" y1="225" x2="480" y2="125" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="480" y="120" font-size="12" fill="#1a1a1a" text-anchor="middle">B</text>

  <path d="M 375,215 L 435,215 L 500,215 L 500,140 L 585,140" fill="none" stroke="#2457d6" stroke-width="2"/>
  <line x1="500" y1="215" x2="500" y2="140" stroke="#c0392b" stroke-width="3"/>

  <text x="345" y="145" font-size="11" font-weight="bold" fill="#c0392b">Стрибок Баркгаузена</text>
  <text x="345" y="160" font-size="11" fill="#c0392b">(ΔB/Δt &gt;&gt; 0)</text>

  <!-- Plot 2: Voltage Pulse e(t) -->
  <line x1="360" y1="320" x2="590" y2="320" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="600" y="324" font-size="12" fill="#1a1a1a">t (нс)</text>

  <line x1="390" y1="345" x2="390" y2="245" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="390" y="240" font-size="12" fill="#1a1a1a" text-anchor="middle">e(t)</text>

  <path d="M 370,320 L 440,320 L 452,255 L 464,320 L 585,320" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <line x1="370" y1="320" x2="585" y2="320" stroke="#d0d7de" stroke-dasharray="2,2"/>
  <line x1="390" y1="255" x2="452" y2="255" stroke="#27ae60" stroke-dasharray="2,2"/>

  <text x="465" y="260" font-size="12" font-weight="bold" fill="#27ae60">V_peak ≈ 2.5...3 В</text>
  <text x="465" y="280" font-size="11" fill="#6b7280">Δt ≈ 10...20 нс</text>
  <text x="465" y="295" font-size="11" fill="#2457d6">(не залежить від rpm)</text>

  <text x="480" y="352" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Формула: e(t) = -N × (dΦ / dt)</text>


  <!-- PANEL 3: Energy Harvesting Circuit -->
  <rect x="650" y="70" width="290" height="295" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <rect x="665" y="82" width="260" height="30" fill="#ffffff" stroke="#d0d7de" rx="4"/>
  <text x="795" y="102" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема знімання енергії</text>

  <rect x="680" y="125" width="230" height="38" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="795" y="148" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Котушка зчитування e(t)</text>
  <line x1="795" y1="163" x2="795" y2="178" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="680" y="180" width="230" height="38" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="4"/>
  <text x="795" y="203" font-size="12" fill="#1a1a1a" text-anchor="middle">Випрямний міст Шотткі</text>
  <line x1="795" y1="218" x2="795" y2="233" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="680" y="235" width="230" height="38" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="795" y="258" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Накопичувальний конденсатор C_s</text>
  <line x1="795" y1="273" x2="795" y2="288" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <rect x="680" y="290" width="230" height="60" fill="#ffffff" stroke="#2457d6" stroke-width="2" rx="4"/>
  <text x="795" y="312" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Низькоспоживний МК лічильника</text>
  <text x="795" y="334" font-size="12" fill="#2457d6" text-anchor="middle">Інкремент оборотів та запис у FRAM</text>


  <!-- PANEL 4: Process Flow -->
  <rect x="20" y="380" width="920" height="140" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="480" y="404" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Послідовність генерації енергії та збереження стану без батареї</text>

  <!-- Step 1 -->
  <rect x="40" y="420" width="195" height="85" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="4"/>
  <text x="137.5" y="442" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Обертання вала</text>
  <text x="137.5" y="464" font-size="11" fill="#6b7280" text-anchor="middle">Ротор повертає магніт</text>
  <text x="137.5" y="484" font-size="11" fill="#6b7280" text-anchor="middle">Зміна поля B_ext</text>

  <line x1="235" y1="462.5" x2="260" y2="462.5" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 2 -->
  <rect x="265" y="420" width="195" height="85" fill="#ffffff" stroke="#c0392b" stroke-width="1.5" rx="4"/>
  <text x="362.5" y="442" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">2. Стрибок Віґанда</text>
  <text x="362.5" y="464" font-size="11" fill="#6b7280" text-anchor="middle">Перемагнічування ядра</text>
  <text x="362.5" y="484" font-size="11" fill="#c0392b" text-anchor="middle">Час стрибка &lt; 20 нс</text>

  <line x1="460" y1="462.5" x2="485" y2="462.5" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step 3 -->
  <rect x="490" y="420" width="195" height="85" fill="#ffffff" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="587.5" y="442" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">3. Напруга e(t)</text>
  <text x="587.5" y="464" font-size="11" fill="#6b7280" text-anchor="middle">Індукований імпульс</text>
  <text x="587.5" y="484" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">V_peak ≈ 2.5...3 В</text>

  <line x1="685" y1="462.5" x2="710" y2="462.5" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Step 4 -->
  <rect x="715" y="420" width="195" height="85" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="4"/>
  <text x="812.5" y="442" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">4. Запис у FRAM</text>
  <text x="812.5" y="464" font-size="11" fill="#27ae60" text-anchor="middle">Життя за рахунок імпульсу</text>
  <text x="812.5" y="484" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Безбатарейний лічильник</text>
</svg>
