<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Definitions -->
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Конструкція багатооборотного енкодера з сенсором Віганда</text>
  <text x="480" y="50" font-size="13" text-anchor="middle" fill="#6b7280">Поєднання редукторного механізму та енергонезалежного лічильника обертів</text>

  <!-- PANEL 1: Single-turn Section -->
  <rect x="30" y="75" width="275" height="345" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <rect x="42" y="88" width="251" height="34" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="6"/>
  <text x="167" y="109" font-size="13" font-weight="bold" text-anchor="middle" fill="#2457d6">1. Однооборотна секція</text>

  <!-- Drive Shaft -->
  <text x="167" y="138" font-size="12" text-anchor="middle" fill="#6b7280">Вхідний вал</text>
  <rect x="45" y="215" width="245" height="10" fill="#9ca3af" rx="2"/>

  <!-- Code Disc -->
  <circle cx="167" cy="220" r="55" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <circle cx="167" cy="220" r="42" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="8 6"/>
  <circle cx="167" cy="220" r="28" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="14 10"/>
  <circle cx="167" cy="220" r="10" fill="#1a1a1a"/>

  <!-- Sensor Box -->
  <rect x="137" y="285" width="60" height="28" fill="#2457d6" rx="4"/>
  <text x="167" y="303" font-size="12" font-weight="bold" text-anchor="middle" fill="white">Сенсор</text>

  <!-- Code Disc Description -->
  <text x="167" y="335" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Кодувальний диск</text>
  <text x="167" y="355" font-size="12" text-anchor="middle" fill="#6b7280">Вимір кута (0°…360°)</text>

  <!-- Signal Path Panel 1 to Output (Routed to avoid text) -->
  <path d="M197,299 L280,299 L280,472 L280,472" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>


  <!-- PANEL 2: Gear Train -->
  <rect x="325" y="75" width="310" height="345" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <rect x="337" y="88" width="286" height="34" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="6"/>
  <text x="480" y="109" font-size="13" font-weight="bold" text-anchor="middle" fill="#2457d6">2. Знижувальний редуктор</text>

  <!-- Gear 1 -->
  <text x="370" y="152" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Шестерня 1</text>
  <circle cx="370" cy="220" r="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <circle cx="370" cy="220" r="30" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Gear 2 -->
  <text x="445" y="140" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Шестерня 2</text>
  <circle cx="445" cy="220" r="44" fill="#ffffff" stroke="#6b7280" stroke-width="2"/>
  <circle cx="445" cy="220" r="48" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5 5"/>
  <text x="445" y="295" font-size="12" text-anchor="middle" fill="#6b7280">Передача N:1</text>

  <!-- Gear 3 -->
  <text x="530" y="152" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Шестерня 3</text>
  <circle cx="530" cy="220" r="30" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <circle cx="530" cy="220" r="34" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Secondary Shaft & Magnet (Separated to eliminate overlap) -->
  <rect x="530" y="215" width="48" height="10" fill="#9ca3af" rx="2"/>

  <text x="600" y="175" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">Магніт</text>
  <rect x="580" y="195" width="20" height="50" fill="#c0392b" rx="2"/>
  <text x="590" y="225" font-size="13" font-weight="bold" text-anchor="middle" fill="white">N</text>
  <rect x="600" y="195" width="20" height="50" fill="#2457d6" rx="2"/>
  <text x="610" y="225" font-size="13" font-weight="bold" text-anchor="middle" fill="white">S</text>

  <!-- Magnetic Field Coupling Arrow to Wiegand Sensor -->
  <path d="M620,220 L670,220" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
  <text x="645" y="212" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">Магн. поле</text>

  <!-- Panel 2 Summary Lines -->
  <text x="480" y="345" font-size="12" text-anchor="middle" fill="#1a1a1a">Редуктор зменшує швидкість обертання</text>
  <text x="480" y="365" font-size="12" text-anchor="middle" fill="#6b7280">та передає рух на сенсор Віганда</text>


  <!-- PANEL 3: Wiegand Sensor & Counter -->
  <rect x="655" y="75" width="275" height="345" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <rect x="667" y="88" width="251" height="34" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="6"/>
  <text x="792" y="109" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">3. Сенсор Віганда та FRAM</text>

  <!-- Wiegand Sensor Module Box -->
  <rect x="675" y="132" width="235" height="110" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="792" y="152" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Сенсор ефекту Віганда</text>

  <!-- Wiegand Wire & Coil -->
  <line x1="695" y1="185" x2="890" y2="185" stroke="#1a1a1a" stroke-width="4"/>
  <line x1="695" y1="185" x2="890" y2="185" stroke="#27ae60" stroke-width="1.5"/>

  <rect x="757" y="170" width="70" height="30" fill="#ffffff" stroke="#27ae60" stroke-width="2" rx="4"/>
  <line x1="767" y1="170" x2="767" y2="200" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="782" y1="170" x2="782" y2="200" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="797" y1="170" x2="797" y2="200" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="812" y1="170" x2="812" y2="200" stroke="#27ae60" stroke-width="1.5"/>

  <text x="792" y="225" font-size="12" text-anchor="middle" fill="#1a1a1a">Дріт Віганда + котушка</text>

  <!-- Energy Pulse Arrow -->
  <path d="M740,242 L740,272" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arr-green)"/>
  <text x="748" y="261" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="start">Імпульс живлення ΔE</text>

  <!-- Counter ASIC & FRAM Box -->
  <rect x="675" y="272" width="235" height="92" fill="#2457d6" stroke="#1d4ed8" stroke-width="1.5" rx="6"/>
  <text x="792" y="294" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Мікрочіп лічби обертів</text>
  <text x="792" y="314" font-size="12" text-anchor="middle" fill="#eaf0fd">Автономний облік обертів</text>

  <rect x="710" y="326" width="165" height="24" fill="#eaf0fd" rx="4"/>
  <text x="792" y="342" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">Пам'ять FRAM (без батареї)</text>

  <!-- Signal Path Panel 3 to Output Interface Box -->
  <path d="M792,364 L792,472 L680,472" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Output Interface Box -->
  <rect x="280" y="450" width="400" height="45" fill="#2457d6" rx="6"/>
  <text x="480" y="477" font-size="13" font-weight="bold" text-anchor="middle" fill="white">Вихідний інтерфейс даних (SSI / BiSS-C)</text>
</svg>
