<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Main Title and Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Еволюція кодування абсолютних енкодерів: Двійковий код vs Код Ґрея</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Код Ґрея змінює лише один біт за крок, повністю усуваючи ризик небезпечних перехідних станів (Hazard States)</text>

  <!-- LEFT PANEL: Binary Code (Problem) -->
  <rect x="30" y="75" width="435" height="425" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="45" y="90" width="405" height="34" rx="5" fill="#c0392b"/>
  <text x="247" y="112" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1. Двійковий код (Binary) — Перехідні состязання</text>

  <!-- Track headers -->
  <text x="177" y="142" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Позиція 3 (011₂)</text>
  <text x="260" y="142" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Зсув Δt</text>
  <text x="342" y="142" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Позиція 4 (100₂)</text>

  <!-- Track B2 (MSB) -->
  <text x="55" y="164" font-size="12" font-weight="bold" fill="#1a1a1a">B2 (MSB)</text>
  <rect x="115" y="150" width="125" height="20" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="177" y="165" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">0</text>
  <rect x="240" y="150" width="40" height="20" fill="#fdecea" stroke="#c0392b" stroke-dasharray="2,2"/>
  <text x="260" y="165" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">0</text>
  <rect x="280" y="150" width="125" height="20" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="342" y="165" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">1</text>

  <!-- Track B1 -->
  <text x="55" y="199" font-size="12" font-weight="bold" fill="#1a1a1a">B1</text>
  <rect x="115" y="185" width="125" height="20" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="177" y="200" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">1</text>
  <rect x="240" y="185" width="40" height="20" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="260" y="200" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">0*</text>
  <rect x="280" y="185" width="125" height="20" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="342" y="200" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">0</text>

  <!-- Track B0 (LSB) -->
  <text x="55" y="234" font-size="12" font-weight="bold" fill="#1a1a1a">B0 (LSB)</text>
  <rect x="115" y="220" width="125" height="20" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="177" y="235" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">1</text>
  <rect x="240" y="220" width="40" height="20" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="260" y="235" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">0*</text>
  <rect x="280" y="220" width="125" height="20" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="342" y="235" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">0</text>

  <!-- Hazard Highlight Frame -->
  <rect x="236" y="130" width="48" height="116" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="260" y="258" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Код: 000₂ (0)</text>
  <text x="260" y="274" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Хибний стан!</text>

  <!-- Left Sequence Card -->
  <rect x="45" y="290" width="405" height="108" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="247" y="310" font-size="12" fill="#1a1a1a" text-anchor="middle">Початковий стан: 011₂ (Позиція 3)</text>
  <line x1="247" y1="315" x2="247" y2="325" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="247" y="340" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Асинхронний зсув ➔ Считування: 000₂ (Позиція 0)</text>
  <line x1="247" y1="345" x2="247" y2="355" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="247" y="370" font-size="12" fill="#1a1a1a" text-anchor="middle">Кінцевий стан: 100₂ (Позиція 4)</text>
  <text x="247" y="388" font-size="12" fill="#6b7280" text-anchor="middle">Зміна 3 бітів одночасно створює хибний сплеск (3 ➔ 0 ➔ 4)</text>

  <!-- Left Alert Banner -->
  <rect x="45" y="410" width="405" height="75" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="247" y="430" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">⛔ Критичний ризик: Помилка позиціонування на 180°!</text>
  <text x="247" y="450" font-size="12" fill="#1a1a1a" text-anchor="middle">При зчитуванні 000₂ замість 011₂/100₂ система сприймає</text>
  <text x="247" y="468" font-size="12" fill="#1a1a1a" text-anchor="middle">помилковий кут повороту, що викликає збій у ЧПУ</text>

  <!-- RIGHT PANEL: Gray Code (Solution) -->
  <rect x="495" y="75" width="435" height="425" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="510" y="90" width="405" height="34" rx="5" fill="#27ae60"/>
  <text x="712" y="112" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2. Код Ґрея (Gray Code) — Однобітова безпека</text>

  <!-- Track headers -->
  <text x="642" y="142" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Позиція 3 (010_G)</text>
  <text x="725" y="142" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Зміна 1 біта</text>
  <text x="807" y="142" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Позиція 4 (110_G)</text>

  <!-- Track G2 (MSB) -->
  <text x="520" y="164" font-size="12" font-weight="bold" fill="#1a1a1a">G2 (MSB)</text>
  <rect x="580" y="150" width="125" height="20" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="642" y="165" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">0</text>
  <rect x="705" y="150" width="40" height="20" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="725" y="165" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">0➔1</text>
  <rect x="745" y="150" width="125" height="20" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="807" y="165" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">1</text>

  <!-- Track G1 -->
  <text x="520" y="199" font-size="12" font-weight="bold" fill="#1a1a1a">G1</text>
  <rect x="580" y="185" width="125" height="20" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="642" y="200" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">1</text>
  <rect x="705" y="185" width="40" height="20" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="725" y="200" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">1</text>
  <rect x="745" y="185" width="125" height="20" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="807" y="200" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">1</text>

  <!-- Track G0 (LSB) -->
  <text x="520" y="234" font-size="12" font-weight="bold" fill="#1a1a1a">G0 (LSB)</text>
  <rect x="580" y="220" width="125" height="20" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="642" y="235" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">0</text>
  <rect x="705" y="220" width="40" height="20" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="725" y="235" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">0</text>
  <rect x="745" y="220" width="125" height="20" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="807" y="235" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">0</text>

  <!-- Safe Highlight Frame -->
  <rect x="701" y="130" width="48" height="116" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="725" y="258" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Лише 010 або 110</text>
  <text x="725" y="274" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Жодного Hazard!</text>

  <!-- Right Sequence Card -->
  <rect x="510" y="290" width="405" height="108" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="712" y="310" font-size="12" fill="#1a1a1a" text-anchor="middle">Початковий стан: 010_G (Позиція 3)</text>
  <line x1="712" y1="315" x2="712" y2="325" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="712" y="340" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Змінюється лише біт G2 ➔ Неможливість хибного стану</text>
  <line x1="712" y1="345" x2="712" y2="355" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="712" y="370" font-size="12" fill="#1a1a1a" text-anchor="middle">Кінцевий стан: 110_G (Позиція 4)</text>
  <text x="712" y="388" font-size="12" fill="#6b7280" text-anchor="middle">Перехід гарантує неперервність коду (Hamming Distance d_H = 1)</text>

  <!-- Right Success Banner -->
  <rect x="510" y="410" width="405" height="75" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="712" y="430" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">✓ Гарантована точність: Повна відсутність сплесків!</text>
  <text x="712" y="450" font-size="12" fill="#1a1a1a" text-anchor="middle">При будь-якому оптичному зсуві давач бачить або Позицію 3,</text>
  <text x="712" y="468" font-size="12" fill="#1a1a1a" text-anchor="middle">або Позицію 4, що забезпечує стабільну роботу ЧПУ</text>
</svg>
