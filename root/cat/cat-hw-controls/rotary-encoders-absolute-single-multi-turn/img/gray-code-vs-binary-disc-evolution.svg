<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Main Header -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Двійковий код проти коду Грея на кодовому диску енкодера</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Однобітова зміна стану в коді Грея повністю ліквідує міжбітові змагання та помилки зчитування</text>

  <!-- PANEL 1: NATURAL BINARY CODE (RACE CONDITIONS) -->
  <rect x="30" y="72" width="435" height="405" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="45" y="85" width="405" height="32" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="247.5" y="106" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Двійковий код: Ризик міжбітових змагань</text>

  <!-- Track Segment Diagrams (Binary) -->
  <!-- Header Labels -->
  <text x="80" y="140" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">Поз.</text>
  <text x="140" y="140" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Біт 2 (MSB)</text>
  <text x="220" y="140" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Біт 1</text>
  <text x="300" y="140" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Біт 0 (LSB)</text>
  <text x="385" y="140" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Код</text>

  <!-- Position 3 (011) Row -->
  <text x="80" y="172" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">3</text>
  <rect x="120" y="155" width="40" height="26" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="140" y="172" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0</text>

  <rect x="200" y="155" width="40" height="26" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="220" y="172" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

  <rect x="280" y="155" width="40" height="26" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="300" y="172" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

  <text x="385" y="172" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">011 (3)</text>

  <!-- Transition Boundary (Red Highlighted Error Zone) -->
  <line x1="60" y1="195" x2="425" y2="195" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3"/>
  <rect x="100" y="202" width="295" height="34" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="247.5" y="223" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Змагання бітів на межі: можлив. хибний стан 111 (7)!</text>

  <!-- Position 4 (100) Row -->
  <text x="80" y="267" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">4</text>
  <rect x="120" y="250" width="40" height="26" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="140" y="267" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

  <rect x="200" y="250" width="40" height="26" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="220" y="267" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0</text>

  <rect x="280" y="250" width="40" height="26" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="300" y="267" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0</text>

  <text x="385" y="267" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">100 (4)</text>

  <!-- Panel 1 Explanatory Text Box -->
  <rect x="45" y="318" width="405" height="145" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="58" y="338" font-size="12" font-weight="bold" fill="#1a1a1a">Проблема звичайного двійкового коду:</text>
  <text x="58" y="360" font-size="12" fill="#1a1a1a">• При переході 3 (011) → 4 (100) змінюються одразу 3 біти</text>
  <text x="58" y="382" font-size="12" fill="#1a1a1a">• Через розкид фотодатчиків виникають міжбітові змагання</text>
  <text x="58" y="406" font-size="12" font-weight="bold" fill="#c0392b">• Виникає хибний проміжний код: 111 (7) або 000 (0)</text>
  <text x="58" y="428" font-size="11" font-weight="bold" fill="#c0392b">• Наслідок: катастрофічні викиди у вимірюваннях кута</text>


  <!-- PANEL 2: GRAY CODE (NO RACE CONDITIONS) -->
  <rect x="495" y="72" width="435" height="405" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="510" y="85" width="405" height="32" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712.5" y="106" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Код Грея: Однобітова зміна (Безперешкодно)</text>

  <!-- Track Segment Diagrams (Gray Code) -->
  <!-- Header Labels -->
  <text x="545" y="140" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">Поз.</text>
  <text x="605" y="140" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Біт 2 (MSB)</text>
  <text x="685" y="140" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Біт 1</text>
  <text x="765" y="140" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Біт 0 (LSB)</text>
  <text x="850" y="140" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Грей</text>

  <!-- Position 3 (Gray 010) Row -->
  <text x="545" y="172" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">3</text>
  <rect x="585" y="155" width="40" height="26" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="605" y="172" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0</text>

  <rect x="665" y="155" width="40" height="26" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="685" y="172" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

  <rect x="745" y="155" width="40" height="26" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="765" y="172" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0</text>

  <text x="850" y="172" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">010 (Грей)</text>

  <!-- Transition Boundary (Green Smooth Zone) -->
  <line x1="525" y1="195" x2="890" y2="195" stroke="#27ae60" stroke-width="2" stroke-dasharray="4,3"/>
  <rect x="565" y="202" width="295" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712.5" y="223" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Змінюється ТІЛЬКИ 1 біт (MSB): 0 → 1!</text>

  <!-- Position 4 (Gray 110) Row -->
  <text x="545" y="267" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">4</text>
  <rect x="585" y="250" width="40" height="26" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="605" y="267" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

  <rect x="665" y="250" width="40" height="26" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="685" y="267" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

  <rect x="745" y="250" width="40" height="26" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="765" y="267" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0</text>

  <text x="850" y="267" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">110 (Грей)</text>

  <!-- Panel 2 Explanatory Text Box -->
  <rect x="510" y="318" width="405" height="145" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="523" y="338" font-size="12" font-weight="bold" fill="#1a1a1a">Перевага коду Грея (Reflected Binary Code):</text>
  <text x="523" y="360" font-size="12" fill="#1a1a1a">• При будь-якому переході між позиціями змінюється 1 біт</text>
  <text x="523" y="382" font-size="12" fill="#1a1a1a">• Відстань Хеммінга d_H = 1 між сусідніми словами</text>
  <text x="523" y="406" font-size="12" font-weight="bold" fill="#27ae60">• Повна відсутність міжбітових змагань і збоїв</text>
  <text x="523" y="428" font-size="11" font-weight="bold" fill="#27ae60">• Стандарт для всіх оптичних і магнітних абсолютних дисків</text>


  <!-- BOTTOM SUMMARY BANNER -->
  <rect x="30" y="488" width="900" height="38" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="512" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Висновок: Код Грея усуває апаратний брязкіт і змагання, є стандартом для всіх абсолютних енкодерів</text>
</svg>
