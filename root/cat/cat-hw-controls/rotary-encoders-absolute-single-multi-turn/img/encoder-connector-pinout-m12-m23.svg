<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Розводка контактів роз'ємів M12 та M23 для SSI / BiSS-C</text>
  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Призначення пінів для диференційних пар (CLK/MA±, DATA/SLO±), живлення (VCC, GND) та екрана</text>


  <!-- PANEL 1: M12 Connector (8-Pin) -->
  <rect x="40" y="70" width="430" height="445" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="255" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Роз'єм M12 (8-контактний, A-code)</text>

  <!-- M12 Circular Pin Diagram -->
  <!-- Outer Metal Body -->
  <circle cx="150" cy="190" r="65" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.5"/>
  <!-- Keyway Notch at Top -->
  <path d="M 144,125 L 156,125 L 150,133 Z" fill="#2457d6"/>
  <!-- Inner Insulator -->
  <circle cx="150" cy="190" r="52" fill="white" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- 8 Pins in Circle -->
  <!-- Pin 1 -->
  <circle cx="174" cy="166" r="7" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="174" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">1</text>

  <!-- Pin 2 -->
  <circle cx="184" cy="190" r="7" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="184" y="194" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">2</text>

  <!-- Pin 3 (CLK+) -->
  <circle cx="174" cy="214" r="7" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="174" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">3</text>

  <!-- Pin 4 (CLK-) -->
  <circle cx="150" cy="224" r="7" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="150" y="228" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">4</text>

  <!-- Pin 5 (DATA+) -->
  <circle cx="126" cy="214" r="7" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="126" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">5</text>

  <!-- Pin 6 (DATA-) -->
  <circle cx="116" cy="190" r="7" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="116" y="194" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">6</text>

  <!-- Pin 7 -->
  <circle cx="126" cy="166" r="7" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="126" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">7</text>

  <!-- Pin 8 (Center) -->
  <circle cx="150" cy="190" r="7" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
  <text x="150" y="194" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">8</text>

  <!-- M12 Titles under Drawing -->
  <text x="150" y="275" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">M12-8P (Вид спереду)</text>
  <text x="150" y="293" text-anchor="middle" font-size="12" fill="#6b7280">Вита пара + Екран</text>

  <!-- M12 Pinout Table -->
  <rect x="240" y="115" width="215" height="380" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <rect x="240" y="115" width="215" height="26" rx="6" fill="#eaf0fd"/>
  <text x="250" y="132" font-size="12" font-weight="bold" fill="#2457d6">Пін</text>
  <text x="290" y="132" font-size="12" font-weight="bold" fill="#2457d6">Призначення (M12)</text>

  <!-- Highlight Box for Diff Pair CLK (3,4) -->
  <rect x="242" y="222" width="211" height="84" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>

  <!-- Highlight Box for Diff Pair DATA (5,6) -->
  <rect x="242" y="308" width="211" height="84" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>

  <!-- Rows -->
  <text x="250" y="156" font-size="12" font-weight="bold" fill="#1a1a1a">1</text>
  <text x="290" y="156" font-size="12" fill="#1a1a1a">GND (0 В)</text>

  <text x="250" y="198" font-size="12" font-weight="bold" fill="#1a1a1a">2</text>
  <text x="290" y="198" font-size="12" font-weight="bold" fill="#1a1a1a">+VCC (10..30 В)</text>

  <text x="250" y="240" font-size="12" font-weight="bold" fill="#2457d6">3</text>
  <text x="290" y="240" font-size="12" font-weight="bold" fill="#2457d6">CLK+ / MA+</text>

  <text x="250" y="282" font-size="12" font-weight="bold" fill="#2457d6">4</text>
  <text x="290" y="282" font-size="12" font-weight="bold" fill="#2457d6">CLK- / MA-</text>

  <text x="250" y="324" font-size="12" font-weight="bold" fill="#27ae60">5</text>
  <text x="290" y="324" font-size="12" font-weight="bold" fill="#27ae60">DATA+ / SLO+</text>

  <text x="250" y="366" font-size="12" font-weight="bold" fill="#27ae60">6</text>
  <text x="290" y="366" font-size="12" font-weight="bold" fill="#27ae60">DATA- / SLO-</text>

  <text x="250" y="408" font-size="12" font-weight="bold" fill="#1a1a1a">7</text>
  <text x="290" y="408" font-size="12" fill="#1a1a1a">Preset / Zero</text>

  <text x="250" y="450" font-size="12" font-weight="bold" fill="#6b7280">8</text>
  <text x="290" y="450" font-size="12" font-weight="bold" fill="#6b7280">Shield / PE (Екран)</text>

  <!-- M12 Wire Color Card -->
  <rect x="55" y="325" width="170" height="170" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="140" y="345" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Маркування жил</text>
  <text x="65" y="366" font-size="12" fill="#1a1a1a">1: Блакитний (GND)</text>
  <text x="65" y="386" font-size="12" fill="#1a1a1a">2: Коричневий (+VCC)</text>
  <text x="65" y="406" font-size="12" fill="#2457d6">3/4: Зелений / Жовтий</text>
  <text x="65" y="426" font-size="12" fill="#27ae60">5/6: Сірий / Рожевий</text>
  <text x="65" y="446" font-size="12" fill="#1a1a1a">7: Червоний (Preset)</text>
  <text x="65" y="466" font-size="12" fill="#6b7280">8: Екран (Shield)</text>


  <!-- PANEL 2: M23 Connector (12-Pin) -->
  <rect x="490" y="70" width="430" height="445" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="705" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Роз'єм M23 (12-контактний, Промисловий)</text>

  <!-- M23 Circular Pin Diagram -->
  <!-- Outer Metal Body -->
  <circle cx="600" cy="190" r="65" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.5"/>
  <!-- Keyway Notch at Top -->
  <path d="M 594,125 L 606,125 L 600,133 Z" fill="#2457d6"/>
  <!-- Inner Insulator -->
  <circle cx="600" cy="190" r="52" fill="white" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- 12 Pins Pattern -->
  <!-- Outer Ring (Pins 1..11) -->
  <circle cx="600" cy="154" r="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="600" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">1</text>

  <circle cx="620" cy="159" r="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="620" y="163" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">2</text>

  <!-- Pin 3 CLK+ -->
  <circle cx="633" cy="175" r="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="633" y="179" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">3</text>

  <!-- Pin 4 CLK- -->
  <circle cx="635" cy="197" r="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="635" y="201" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">4</text>

  <!-- Pin 5 DATA+ -->
  <circle cx="626" cy="217" r="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="626" y="221" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">5</text>

  <!-- Pin 6 DATA- -->
  <circle cx="608" cy="225" r="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="608" y="229" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">6</text>

  <circle cx="588" cy="223" r="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="588" y="227" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">7</text>

  <circle cx="572" cy="211" r="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="572" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">8</text>

  <circle cx="565" cy="192" r="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
  <text x="565" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">9</text>

  <circle cx="568" cy="172" r="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="568" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">10</text>

  <circle cx="580" cy="158" r="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="580" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">11</text>

  <!-- Center Pin 12 -->
  <circle cx="600" cy="190" r="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
  <text x="600" y="194" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">12</text>

  <!-- M23 Titles under Drawing -->
  <text x="600" y="275" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">M23-12P (Вид спереду)</text>
  <text x="600" y="293" text-anchor="middle" font-size="12" fill="#6b7280">Дифпари + Sense-лінії</text>

  <!-- M23 Pinout Table -->
  <rect x="690" y="115" width="215" height="380" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <rect x="690" y="115" width="215" height="26" rx="6" fill="#eaf0fd"/>
  <text x="700" y="132" font-size="12" font-weight="bold" fill="#2457d6">Пін</text>
  <text x="740" y="132" font-size="12" font-weight="bold" fill="#2457d6">Призначення (M23)</text>

  <!-- Highlight Box for Diff Pair CLK (3,4) -->
  <rect x="692" y="194" width="211" height="54" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>

  <!-- Highlight Box for Diff Pair DATA (5,6) -->
  <rect x="692" y="252" width="211" height="54" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>

  <!-- Rows -->
  <text x="700" y="152" font-size="12" font-weight="bold" fill="#1a1a1a">1</text>
  <text x="740" y="152" font-size="12" fill="#1a1a1a">GND Sense (0 В)</text>

  <text x="700" y="181" font-size="12" font-weight="bold" fill="#1a1a1a">2</text>
  <text x="740" y="181" font-size="12" font-weight="bold" fill="#1a1a1a">+VCC Sense (Живлення)</text>

  <text x="700" y="210" font-size="12" font-weight="bold" fill="#2457d6">3</text>
  <text x="740" y="210" font-size="12" font-weight="bold" fill="#2457d6">CLK+ / MA+</text>

  <text x="700" y="239" font-size="12" font-weight="bold" fill="#2457d6">4</text>
  <text x="740" y="239" font-size="12" font-weight="bold" fill="#2457d6">CLK- / MA-</text>

  <text x="700" y="268" font-size="12" font-weight="bold" fill="#27ae60">5</text>
  <text x="740" y="268" font-size="12" font-weight="bold" fill="#27ae60">DATA+ / SLO+</text>

  <text x="700" y="297" font-size="12" font-weight="bold" fill="#27ae60">6</text>
  <text x="740" y="297" font-size="12" font-weight="bold" fill="#27ae60">DATA- / SLO-</text>

  <text x="700" y="326" font-size="12" font-weight="bold" fill="#6b7280">7</text>
  <text x="740" y="326" font-size="12" fill="#6b7280">NC (Не використовується)</text>

  <text x="700" y="355" font-size="12" font-weight="bold" fill="#1a1a1a">8</text>
  <text x="740" y="355" font-size="12" fill="#1a1a1a">SET / DIR (Установка)</text>

  <text x="700" y="384" font-size="12" font-weight="bold" fill="#6b7280">9</text>
  <text x="740" y="384" font-size="12" fill="#6b7280">Shield (Екран)</text>

  <text x="700" y="413" font-size="12" font-weight="bold" fill="#1a1a1a">10</text>
  <text x="740" y="413" font-size="12" fill="#1a1a1a">GND (0 В силовий)</text>

  <text x="700" y="442" font-size="12" font-weight="bold" fill="#1a1a1a">11</text>
  <text x="740" y="442" font-size="12" fill="#1a1a1a">+VCC (Силовий)</text>

  <text x="700" y="471" font-size="12" font-weight="bold" fill="#6b7280">12</text>
  <text x="740" y="471" font-size="12" font-weight="bold" fill="#6b7280">Case / PE (Корпус)</text>

  <!-- M23 Features Card -->
  <rect x="505" y="325" width="170" height="170" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="590" y="345" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Особливості M23</text>
  <text x="515" y="366" font-size="12" fill="#1a1a1a">• Окремі Sense-лінії</text>
  <text x="515" y="388" font-size="12" fill="#1a1a1a">• Компенсація спаду U</text>
  <text x="515" y="410" font-size="12" fill="#2457d6">• Термінатор 120 Ом</text>
  <text x="515" y="432" font-size="12" fill="#27ae60">• Захист від завад</text>
  <text x="515" y="454" font-size="12" fill="#6b7280">• Надійне заземлення</text>

</svg>
