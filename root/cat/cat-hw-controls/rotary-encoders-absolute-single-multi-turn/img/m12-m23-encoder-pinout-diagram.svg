  <text x="250" y="358" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">5</text>
  <text x="280" y="358" font-size="12" fill="#1a1a1a">Data+ (DATA+)</text>
  <text x="385" y="358" font-size="11" fill="#6b7280">Сірий</text>

  <!-- Row 6 -->
  <line x1="230" y1="380" x2="450" y2="380" stroke="#d0d7de" stroke-width="1"/>
  <rect x="240" y="387" width="20" height="20" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="250" y="401" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">6</text>
  <text x="280" y="401" font-size="12" fill="#1a1a1a">Data- (DATA-)</text>
  <text x="385" y="401" font-size="11" fill="#6b7280">Рожевий</text>

  <!-- Row 7 -->
