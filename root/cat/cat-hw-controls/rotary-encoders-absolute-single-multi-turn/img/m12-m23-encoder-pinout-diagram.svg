  <text x="280" y="487" font-size="12" fill="#1a1a1a">DIR (Напрямок)</text>
  <text x="385" y="487" font-size="11" fill="#6b7280">Червоний</text>


  <!-- ================= RIGHT PANEL: M23 12-pin Male ================= -->
  <rect x="495" y="75" width="435" height="455" rx="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
