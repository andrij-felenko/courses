<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Цокольовка промислових роз'ємів M12 та M23 абсолютних енкодерів</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Призначення контактів вилок M12 (8-pin A-coded) та M23 (12-pin) для інтерфейсу SSI</text>

  <!-- ================= LEFT PANEL: M12 8-pin A-coded ================= -->
  <rect x="30" y="75" width="435" height="455" rx="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247" y="100" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вилка M12 (8-контактна, A-coded)</text>
  <text x="247" y="118" font-size="12" fill="#6b7280" text-anchor="middle">Вигляд з боку контактів вилки (Male / Pin View)</text>

  <!-- M12 Connector Schematic Drawing -->
  <!-- Outer Metal Shell -->
  <circle cx="135" cy="300" r="75" fill="#ffffff" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="135" cy="300" r="62" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <!-- Key Notch at Top -->
  <rect x="129" y="225" width="12" height="10" rx="2" fill="#2457d6"/>
  <!-- Center Dot / Label -->
  <text x="135" y="304" font-size="11" fill="#6b7280" font-weight="bold" text-anchor="middle">M12-8A</text>

  <!-- 8 Pin Circles & Labels -->
  <!-- Pin 1 -->
  <circle cx="107" cy="255" r="9" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="107" y="259" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">1</text>

  <!-- Pin 2 -->
  <circle cx="135" cy="248" r="9" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="135" y="252" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">2</text>

  <!-- Pin 3 -->
  <circle cx="163" cy="255" r="9" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="163" y="259" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">3</text>

  <!-- Pin 4 -->
  <circle cx="180" cy="300" r="9" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="180" y="304" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">4</text>

  <!-- Pin 5 -->
  <circle cx="163" cy="345" r="9" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="163" y="349" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">5</text>

  <!-- Pin 6 -->
  <circle cx="135" cy="352" r="9" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="135" y="356" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">6</text>

  <!-- Pin 7 -->
  <circle cx="107" cy="345" r="9" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="107" y="349" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">7</text>

  <!-- Pin 8 -->
