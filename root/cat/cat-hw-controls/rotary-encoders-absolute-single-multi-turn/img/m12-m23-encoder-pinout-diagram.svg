  <rect x="240" y="215" width="20" height="20" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="250" y="229" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">2</text>
  <text x="280" y="229" font-size="12" fill="#1a1a1a">+Vcc (10..30V)</text>
  <text x="385" y="229" font-size="11" fill="#6b7280">Коричн.</text>

  <!-- Row 3 -->
  <line x1="230" y1="251" x2="450" y2="251" stroke="#d0d7de" stroke-width="1"/>
  <rect x="240" y="258" width="20" height="20" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="250" y="272" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">3</text>
  <text x="280" y="272" font-size="12" fill="#1a1a1a">Clock+ (CLK+)</text>
  <text x="385" y="272" font-size="11" fill="#6b7280">Зелений</text>

  <!-- Row 4 -->
  <line x1="230" y1="294" x2="450" y2="294" stroke="#d0d7de" stroke-width="1"/>
  <rect x="240" y="301" width="20" height="20" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="250" y="315" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">4</text>
  <text x="280" y="315" font-size="12" fill="#1a1a1a">Clock- (CLK-)</text>
  <text x="385" y="315" font-size="11" fill="#6b7280">Жовтий</text>

  <!-- Row 5 -->
