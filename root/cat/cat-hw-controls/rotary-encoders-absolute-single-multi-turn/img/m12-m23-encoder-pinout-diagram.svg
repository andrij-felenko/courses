  <text x="245" y="155" font-size="12" font-weight="bold" fill="#2457d6">Pin</text>
  <text x="280" y="155" font-size="12" font-weight="bold" fill="#2457d6">Сигнал (SSI)</text>
  <text x="385" y="155" font-size="12" font-weight="bold" fill="#2457d6">Колір</text>

  <!-- Row 1 -->
  <line x1="230" y1="165" x2="450" y2="165" stroke="#d0d7de" stroke-width="1"/>
  <rect x="240" y="172" width="20" height="20" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="250" y="186" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">1</text>
  <text x="280" y="186" font-size="12" fill="#1a1a1a">GND (0 V)</text>
  <text x="385" y="186" font-size="11" fill="#6b7280">Білий</text>

