<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Інкрементальний та абсолютний принципи відліку кутової позиції</text>
  <text x="480" y="53" text-anchor="middle" font-size="13" fill="#6b7280">Інкрементальний диск потребує пошуку нуля та підрахунку імпульсів, а абсолютний видає код позиції відразу після вмикання</text>

  <!-- Left Panel: Incremental Encoder -->
  <rect x="30" y="75" width="435" height="440" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">Інкрементальний енкодер (відносний відлік)</text>

  <!-- Incremental Disc -->
  <circle cx="145" cy="225" r="75" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="145" cy="225" r="55" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  <circle cx="145" cy="225" r="35" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Radial Ticks for Incremental Disc -->
  <g stroke="#334155" stroke-width="2">
    <line x1="145" y1="152" x2="145" y2="170" transform="rotate(0, 145, 225)"/>
    <line x1="145" y1="152" x2="145" y2="170" transform="rotate(15, 145, 225)"/>
    <line x1="145" y1="152" x2="145" y2="170" transform="rotate(30, 145, 225)"/>
    <line x1="145" y1="152" x2="145" y2="170" transform="rotate(45, 145, 225)"/>
    <line x1="145" y1="152" x2="145" y2="170" transform="rotate(60, 145, 225)"/>
    <line x1="145" y1="152" x2="145" y2="170" transform="rotate(75, 145, 225)"/>
    <line x1="145" y1="152" x2="145" y2="170" transform="rotate(90, 145, 225)"/>
    <line x1="145" y1="152" x2="145" y2="170" transform="rotate(105, 145, 225)"/>
    <line x1="145" y1="152" x2="145" y2="170" transform="rotate(120, 145, 225)"/>
    <line x1="145" y1="152" x2="145" y2="170" transform="rotate(135, 145, 225)"/>
    <line x1="145" y1="152" x2="145" y2="170" transform="rotate(150, 145, 225)"/>
    <line x1="145" y1="152" x2="145" y2="170" transform="rotate(165, 145, 225)"/>
    <line x1="145" y1="152" x2="145" y2="170" transform="rotate(180, 145, 225)"/>
    <line x1="145" y1="152" x2="145" y2="170" transform="rotate(195, 145, 225)"/>
    <line x1="145" y1="152" x2="145" y2="170" transform="rotate(210, 145, 225)"/>
    <line x1="145" y1="152" x2="145" y2="170" transform="rotate(225, 145, 225)"/>
    <line x1="145" y1="152" x2="145" y2="170" transform="rotate(240, 145, 225)"/>
    <line x1="145" y1="152" x2="145" y2="170" transform="rotate(255, 145, 225)"/>
    <line x1="145" y1="152" x2="145" y2="170" transform="rotate(270, 145, 225)"/>
    <line x1="145" y1="152" x2="145" y2="170" transform="rotate(285, 145, 225)"/>
    <line x1="145" y1="152" x2="145" y2="170" transform="rotate(300, 145, 225)"/>
    <line x1="145" y1="152" x2="145" y2="170" transform="rotate(315, 145, 225)"/>
    <line x1="145" y1="152" x2="145" y2="170" transform="rotate(330, 145, 225)"/>
    <line x1="145" y1="152" x2="145" y2="170" transform="rotate(345, 145, 225)"/>
  </g>

  <!-- Reference Mark Z -->
  <circle cx="145" cy="190" r="4" fill="#c0392b"/>
  <text x="145" y="185" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Z</text>

  <!-- Incremental Shaft Center -->
  <circle cx="145" cy="225" r="14" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>

  <!-- Optical Sensor Icon -->
  <rect x="105" y="125" width="80" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="145" y="139" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Сенсор (A, B)</text>

  <!-- Labels under Incremental Disc -->
  <text x="145" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Інкрементальний диск</text>
  <text x="145" y="334" text-anchor="middle" font-size="11" fill="#6b7280">(однакові імпульсні ґратки)</text>

  <!-- Left Callout Box (Problem Box) -->
  <rect x="245" y="125" width="205" height="175" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="347" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Особливості відліку:</text>
  <text x="255" y="168" font-size="12" fill="#1a1a1a">• Позиція = сума імпульсів</text>
  <text x="255" y="188" font-size="12" fill="#1a1a1a">• При вимкненні живлення</text>
  <text x="265" y="206" font-size="12" font-weight="bold" fill="#c0392b">лічильник скидається</text>
  <text x="255" y="226" font-size="12" fill="#1a1a1a">• Обов'язковий пошук нуля</text>
  <text x="265" y="244" font-size="11" fill="#6b7280">(процедура Homing)</text>
  <text x="255" y="264" font-size="12" fill="#1a1a1a">• Ризик пропуску кроків</text>
  <text x="265" y="282" font-size="11" fill="#6b7280">при електричних завадах</text>

  <!-- Left Bottom Signals Box -->
  <rect x="45" y="355" width="405" height="145" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="247" y="375" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Форма вихідних сигналів при обертанні</text>

  <text x="60" y="402" font-size="12" font-weight="bold" fill="#2457d6">Канал A</text>
  <path d="M120,405 L140,405 L140,390 L170,390 L170,405 L200,405 L200,390 L230,390 L230,405 L260,405 L260,390 L290,390 L290,405 L320,405 L320,390 L350,390 L350,405 L420,405" stroke="#2457d6" stroke-width="2" fill="none"/>

  <text x="60" y="432" font-size="12" font-weight="bold" fill="#2457d6">Канал B</text>
  <path d="M120,435 L155,435 L155,420 L185,420 L185,435 L215,435 L215,420 L245,420 L245,435 L275,435 L275,420 L305,420 L305,435 L335,435 L335,420 L365,420 L365,435 L420,435" stroke="#2457d6" stroke-width="2" fill="none"/>

  <text x="60" y="462" font-size="12" font-weight="bold" fill="#c0392b">Канал Z</text>
  <path d="M120,465 L260,465 L260,450 L275,450 L275,465 L420,465" stroke="#c0392b" stroke-width="2" fill="none"/>

  <text x="247" y="490" text-anchor="middle" font-size="11" fill="#6b7280">Зсув фаз 90° між A і B визначає напрямок обертання</text>

  <!-- Right Panel: Absolute Encoder -->
  <rect x="495" y="75" width="435" height="440" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="712" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#27ae60">Абсолютний енкодер (унікальний код)</text>

  <!-- Absolute Code Disc -->
  <!-- Background tracks -->
  <circle cx="610" cy="225" r="67" fill="none" stroke="#f1f5f9" stroke-width="14"/>
  <circle cx="610" cy="225" r="52" fill="none" stroke="#f1f5f9" stroke-width="14"/>
  <circle cx="610" cy="225" r="37" fill="none" stroke="#f1f5f9" stroke-width="14"/>
  <circle cx="610" cy="225" r="22" fill="none" stroke="#f1f5f9" stroke-width="14"/>

  <!-- Code Pattern Sectors via stroke-dasharray -->
  <circle cx="610" cy="225" r="67" fill="none" stroke="#334155" stroke-width="14" stroke-dasharray="26.3 26.3"/>
  <circle cx="610" cy="225" r="52" fill="none" stroke="#334155" stroke-width="14" stroke-dasharray="40.8 40.8"/>
  <circle cx="610" cy="225" r="37" fill="none" stroke="#334155" stroke-width="14" stroke-dasharray="58.1 58.1"/>
  <circle cx="610" cy="225" r="22" fill="none" stroke="#334155" stroke-width="14" stroke-dasharray="69.1 69.1"/>

  <!-- Track Dividers -->
  <circle cx="610" cy="225" r="74.5" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="610" cy="225" r="59.5" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="610" cy="225" r="44.5" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="610" cy="225" r="29.5" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="610" cy="225" r="14.5" fill="none" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Absolute Shaft Center -->
  <circle cx="610" cy="225" r="14" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>

  <!-- Linear Photodiode Array Sensor -->
  <rect x="540" y="125" width="140" height="20" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="610" y="139" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Сенсорна лінійка (D3..D0)</text>

  <!-- Labels under Absolute Disc -->
  <text x="610" y="318" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Багатодоріжковий диск Ґрея</text>
  <text x="610" y="334" text-anchor="middle" font-size="11" fill="#6b7280">(унікальна комбінація доріжок)</text>

  <!-- Right Callout Box (Solution Box) -->
  <rect x="710" y="125" width="205" height="175" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="812" y="146" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Особливості відліку:</text>
  <text x="720" y="168" font-size="12" fill="#1a1a1a">• Миттєве визначення кута</text>
  <text x="730" y="186" font-size="12" font-weight="bold" fill="#27ae60">відразу після увімкнення</text>
  <text x="720" y="206" font-size="12" fill="#1a1a1a">• Пошук нуля непотрібен</text>
  <text x="720" y="226" font-size="12" fill="#1a1a1a">• Нечутливий до збоїв</text>
  <text x="730" y="244" font-size="11" fill="#6b7280">живлення чи пропуску</text>
  <text x="720" y="264" font-size="12" fill="#1a1a1a">• Код Ґрея захищає від</text>
  <text x="730" y="282" font-size="11" fill="#6b7280">помилок перемикання</text>

  <!-- Right Bottom Code Readout Box -->
  <rect x="510" y="355" width="405" height="145" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="712" y="375" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Зчитане цифрове слово позиції (4-бітне значення)</text>

  <!-- Bit Labels -->
  <text x="592" y="393" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">D3 (MSB)</text>
  <text x="662" y="393" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">D2</text>
  <text x="732" y="393" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">D1</text>
  <text x="802" y="393" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">D0 (LSB)</text>

  <!-- Bit Values Boxes -->
  <rect x="567" y="400" width="50" height="30" rx="4" fill="#2457d6"/>
  <text x="592" y="420" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">1</text>

  <rect x="637" y="400" width="50" height="30" rx="4" fill="#2457d6"/>
  <text x="662" y="420" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">1</text>

  <rect x="707" y="400" width="50" height="30" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="732" y="420" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">0</text>

  <rect x="777" y="400" width="50" height="30" rx="4" fill="#2457d6"/>
  <text x="802" y="420" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">1</text>

  <!-- Result Summary Badge -->
  <rect x="567" y="442" width="285" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="710" y="459" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Код 1101₂ ➔ Унікальний кут θ = 135.0°</text>

  <text x="712" y="490" text-anchor="middle" font-size="11" fill="#6b7280">Кожне положення вала має власний єдиний цифровий код</text>
</svg>
