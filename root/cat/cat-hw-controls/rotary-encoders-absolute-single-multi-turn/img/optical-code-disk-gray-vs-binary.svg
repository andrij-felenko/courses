  <text x="52" y="457" font-size="12" fill="#1a1a1a">Через розкид спрацьовування датчиків виникають хибні стани 111 або 010.</text>
  <text x="52" y="477" font-size="12" font-weight="bold" fill="#c0392b">Наслідок: короткочасний хибний стрибок позиції у приводі на 180°!</text>


