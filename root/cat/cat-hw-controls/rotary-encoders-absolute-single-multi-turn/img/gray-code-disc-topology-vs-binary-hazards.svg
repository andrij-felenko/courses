<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Definitions -->
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Порівняння топології двійкового коду та коду Ґрея в енкодерах</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Одночасне перемикання бітів у двійковому коді створює хибні стани (hazards), які усуває код Ґрея</text>

  <!-- LEFT PANEL: BINARY CODE -->
  <rect x="30" y="70" width="435" height="472" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Left Header -->
  <rect x="45" y="85" width="405" height="52" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="247" y="104" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Двійковий код (Binary Code)</text>
  <text x="247" y="122" font-size="12" fill="#1a1a1a" text-anchor="middle">Перехід 3 (011₂) → 4 (100₂): перемикаються 3 біти</text>

  <!-- Left Section 1: Disc Tracks -->
  <text x="45" y="152" font-size="12" font-weight="bold" fill="#1a1a1a">1. Топологія доріжок і неспіввісність датчиків</text>
  <rect x="45" y="162" width="405" height="118" rx="6" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Misalignment label -->
  <text x="247" y="177" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Зона неспіввісності датчиків (Δt)</text>

  <!-- Background container for Misalignment Zone -->
  <rect x="220" y="181" width="40" height="68" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3" rx="3"/>

  <!-- Track B2 -->
  <text x="55" y="198" font-size="12" font-weight="bold" fill="#1a1a1a">B₂</text>
  <rect x="80" y="185" width="140" height="18" fill="#eaf0fd" stroke="#d0d7de"/>
  <text x="150" y="198" font-size="12" fill="#1a1a1a" text-anchor="middle">0</text>
  <rect x="220" y="185" width="40" height="18" fill="#fdecea" stroke="#c0392b" stroke-dasharray="2,2"/>
  <text x="240" y="198" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">0→1</text>
  <rect x="260" y="185" width="170" height="18" fill="#2457d6"/>
  <text x="345" y="198" font-size="12" fill="#ffffff" text-anchor="middle">1</text>

  <!-- Track B1 -->
  <text x="55" y="220" font-size="12" font-weight="bold" fill="#1a1a1a">B₁</text>
  <rect x="80" y="207" width="140" height="18" fill="#2457d6"/>
  <text x="150" y="220" font-size="12" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="220" y="207" width="40" height="18" fill="#fdecea" stroke="#c0392b" stroke-dasharray="2,2"/>
  <text x="240" y="220" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">1→0</text>
  <rect x="260" y="207" width="170" height="18" fill="#eaf0fd" stroke="#d0d7de"/>
  <text x="345" y="220" font-size="12" fill="#1a1a1a" text-anchor="middle">0</text>

  <!-- Track B0 -->
  <text x="55" y="242" font-size="12" font-weight="bold" fill="#1a1a1a">B₀</text>
  <rect x="80" y="229" width="140" height="18" fill="#2457d6"/>
  <text x="150" y="242" font-size="12" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="220" y="229" width="40" height="18" fill="#fdecea" stroke="#c0392b" stroke-dasharray="2,2"/>
  <text x="240" y="242" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">1→0</text>
  <rect x="260" y="229" width="170" height="18" fill="#eaf0fd" stroke="#d0d7de"/>
  <text x="345" y="242" font-size="12" fill="#1a1a1a" text-anchor="middle">0</text>

  <!-- Sector Labels -->
  <text x="150" y="267" font-size="12" fill="#6b7280" text-anchor="middle">Сектор 3</text>
  <text x="345" y="267" font-size="12" fill="#6b7280" text-anchor="middle">Сектор 4</text>

  <!-- Left Section 2: Timing Diagram -->
  <text x="45" y="295" font-size="12" font-weight="bold" fill="#1a1a1a">2. Часова діаграма поява хибних станів</text>
  <rect x="45" y="305" width="405" height="152" rx="6" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Hazard Highlight Box -->
  <rect x="210" y="315" width="60" height="108" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3" rx="4"/>

  <!-- Waveform Labels -->
  <text x="55" y="338" font-size="12" font-weight="bold" fill="#1a1a1a">B₂</text>
  <text x="55" y="373" font-size="12" font-weight="bold" fill="#1a1a1a">B₁</text>
  <text x="55" y="408" font-size="12" font-weight="bold" fill="#1a1a1a">B₀</text>

  <!-- Waveforms -->
  <!-- B2: 0 -> 1 at x=240 -->
  <path d="M100,345 L240,345 L240,330 L430,330" fill="none" stroke="#2457d6" stroke-width="2"/>
  <!-- B1: 1 -> 0 at x=270 -->
  <path d="M100,365 L270,365 L270,380 L430,380" fill="none" stroke="#2457d6" stroke-width="2"/>
  <!-- B0: 1 -> 0 at x=210 -->
  <path d="M100,395 L210,395 L210,410 L430,410" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Hazard Value Callouts -->
  <text x="225" y="327" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">2</text>
  <text x="255" y="327" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">6</text>

  <!-- Timing Annotations -->
  <text x="155" y="442" font-size="12" fill="#6b7280" text-anchor="middle">3 (011₂)</text>
  <text x="240" y="442" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Збій (Hazards)</text>
  <text x="350" y="442" font-size="12" fill="#6b7280" text-anchor="middle">4 (100₂)</text>

  <!-- Left Bottom Summary -->
  <rect x="45" y="472" width="405" height="52" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="247" y="491" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Результат: Критичний збій декодування кута</text>
  <text x="247" y="509" font-size="12" fill="#1a1a1a" text-anchor="middle">Хибні проміжні стани 3 → 2 → 6 → 4 викликають збій ПЛК</text>


  <!-- RIGHT PANEL: GRAY CODE -->
  <rect x="495" y="70" width="435" height="472" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Right Header -->
  <rect x="510" y="85" width="405" height="52" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712" y="104" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Код Ґрея (Gray Code)</text>
  <text x="712" y="122" font-size="12" fill="#1a1a1a" text-anchor="middle">Перехід 3 (010_G) → 4 (110_G): змінюється лише біт G₂</text>

  <!-- Right Section 1: Disc Tracks -->
  <text x="510" y="152" font-size="12" font-weight="bold" fill="#1a1a1a">1. Топологія доріжок (без подвійних меж)</text>
  <rect x="510" y="162" width="405" height="118" rx="6" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Boundary label -->
  <text x="712" y="177" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Єдина межа секторів під датчиками (G₂)</text>

  <!-- Background container for Transition Zone -->
  <rect x="685" y="181" width="40" height="68" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3" rx="3"/>

  <!-- Track G2 -->
  <text x="520" y="198" font-size="12" font-weight="bold" fill="#1a1a1a">G₂</text>
  <rect x="545" y="185" width="140" height="18" fill="#eaf0fd" stroke="#d0d7de"/>
  <text x="615" y="198" font-size="12" fill="#1a1a1a" text-anchor="middle">0</text>
  <rect x="685" y="185" width="40" height="18" fill="#e9f7ef" stroke="#27ae60" stroke-dasharray="2,2"/>
  <text x="705" y="198" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">0→1</text>
  <rect x="725" y="185" width="170" height="18" fill="#2457d6"/>
  <text x="810" y="198" font-size="12" fill="#ffffff" text-anchor="middle">1</text>

  <!-- Track G1 -->
  <text x="520" y="220" font-size="12" font-weight="bold" fill="#1a1a1a">G₁</text>
  <rect x="545" y="207" width="140" height="18" fill="#2457d6"/>
  <text x="615" y="220" font-size="12" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="685" y="207" width="40" height="18" fill="#2457d6"/>
  <text x="705" y="220" font-size="10" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="725" y="207" width="170" height="18" fill="#2457d6"/>
  <text x="810" y="220" font-size="12" fill="#ffffff" text-anchor="middle">1</text>

  <!-- Track G0 -->
  <text x="520" y="242" font-size="12" font-weight="bold" fill="#1a1a1a">G₀</text>
  <rect x="545" y="229" width="140" height="18" fill="#eaf0fd" stroke="#d0d7de"/>
  <text x="615" y="242" font-size="12" fill="#1a1a1a" text-anchor="middle">0</text>
  <rect x="685" y="229" width="40" height="18" fill="#eaf0fd" stroke="#d0d7de"/>
  <text x="705" y="242" font-size="10" fill="#1a1a1a" text-anchor="middle">0</text>
  <rect x="725" y="229" width="170" height="18" fill="#eaf0fd" stroke="#d0d7de"/>
  <text x="810" y="242" font-size="12" fill="#1a1a1a" text-anchor="middle">0</text>

  <!-- Sector Labels -->
  <text x="615" y="267" font-size="12" fill="#6b7280" text-anchor="middle">Сектор 3</text>
  <text x="810" y="267" font-size="12" fill="#6b7280" text-anchor="middle">Сектор 4</text>

  <!-- Right Section 2: Timing Diagram -->
  <text x="510" y="295" font-size="12" font-weight="bold" fill="#1a1a1a">2. Часова діаграма плавного перемикання</text>
  <rect x="510" y="305" width="405" height="152" rx="6" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Transition Highlight Box -->
  <rect x="685" y="315" width="40" height="108" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3" rx="4"/>

  <!-- Waveform Labels -->
  <text x="520" y="338" font-size="12" font-weight="bold" fill="#1a1a1a">G₂</text>
  <text x="520" y="373" font-size="12" font-weight="bold" fill="#1a1a1a">G₁</text>
  <text x="520" y="408" font-size="12" font-weight="bold" fill="#1a1a1a">G₀</text>

  <!-- Waveforms -->
  <!-- G2: 0 -> 1 smoothly at x=685..725 -->
  <path d="M565,345 L685,345 L725,330 L895,330" fill="none" stroke="#2457d6" stroke-width="2"/>
  <!-- G1: Constant 1 -->
  <path d="M565,365 L895,365" fill="none" stroke="#2457d6" stroke-width="2"/>
  <!-- G0: Constant 0 -->
  <path d="M565,410 L895,410" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Timing Annotations -->
  <text x="625" y="442" font-size="12" fill="#6b7280" text-anchor="middle">3 (010_G)</text>
  <text x="705" y="442" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Δt (1 біт)</text>
  <text x="810" y="442" font-size="12" fill="#6b7280" text-anchor="middle">4 (110_G)</text>

  <!-- Right Bottom Summary -->
  <rect x="510" y="472" width="405" height="52" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712" y="491" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Результат: 100% захист від міжкодових завад</text>
  <text x="712" y="509" font-size="12" fill="#1a1a1a" text-anchor="middle">Можливі лише два валідних стани: або 3, або 4</text>
</svg>
