<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Еволюція інтерфейсів абсолютних енкодерів: Паралельний vs SSI</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Скорочення кабельних ліній: від N-жильного паралельного шлейфа до 4-провідного SSI</text>

  <!-- LEFT PANEL: Parallel Interface (Legacy) -->
  <rect x="30" y="70" width="435" height="390" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Left Header -->
  <rect x="45" y="85" width="405" height="36" rx="4" fill="#c0392b"/>
  <text x="247.5" y="108" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Паралельний інтерфейс (1970-ті роки)</text>

  <!-- Left: Encoder -->
  <rect x="48" y="135" width="130" height="215" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="113" y="158" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Енкодер</text>
  <text x="113" y="182" font-size="12" fill="#6b7280" text-anchor="middle">Роздільність:</text>
  <text x="113" y="200" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">12–16 біт</text>
  <text x="113" y="226" font-size="12" fill="#6b7280" text-anchor="middle">Паралельні лінії:</text>
  <text x="113" y="244" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">D0, D1, D2 ... Dn</text>
  <text x="113" y="268" font-size="12" fill="#6b7280" text-anchor="middle">+ Strobe, Latch</text>
  <text x="113" y="286" font-size="12" fill="#6b7280" text-anchor="middle">+ VCC / GND</text>
  <text x="113" y="312" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">(до 24 контактів)</text>

  <!-- Left: Parallel Cable Harness -->
  <rect x="188" y="137" width="118" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="247" y="154" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">16–24 провідники</text>

  <!-- Upper Lines -->
  <line x1="178" y1="175" x2="317" y2="175" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="178" y1="187" x2="317" y2="187" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="178" y1="199" x2="317" y2="199" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Central Clear Label Box (Between Upper and Lower Lines) -->
  <rect x="185" y="210" width="124" height="64" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="247" y="230" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Широкий шлейф</text>
  <text x="247" y="248" font-size="12" fill="#6b7280" text-anchor="middle">Паралельна шина</text>
  <text x="247" y="266" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Довжина &lt; 10 м</text>

  <!-- Lower Lines -->
  <line x1="178" y1="285" x2="317" y2="285" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="178" y1="297" x2="317" y2="297" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="178" y1="309" x2="317" y2="309" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Left: PLC / Controller -->
  <rect x="317" y="135" width="130" height="215" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="382" y="158" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ЧПУ / ПЛК</text>
  <text x="382" y="182" font-size="12" fill="#6b7280" text-anchor="middle">Вхідний модуль:</text>
  <text x="382" y="200" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Паралельний</text>
  <text x="382" y="226" font-size="12" fill="#6b7280" text-anchor="middle">Потрібно входів:</text>
  <text x="382" y="244" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">16–32 дискретних</text>
  <text x="382" y="268" font-size="12" fill="#6b7280" text-anchor="middle">Ризик змагань</text>
  <text x="382" y="286" font-size="12" fill="#6b7280" text-anchor="middle">(Hazard States)</text>
  <text x="382" y="312" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">(багато портів)</text>

  <!-- Left: Bottom Summary -->
  <rect x="45" y="365" width="405" height="72" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="58" y="386" font-size="12" font-weight="bold" fill="#c0392b">• Складний монтаж та низька завадостійкість</text>
  <text x="58" y="405" font-size="12" fill="#1a1a1a">• Дорогий товстий кабель і обмежена довжина (&lt; 10 м)</text>
  <text x="58" y="424" font-size="12" fill="#1a1a1a">• Виникнення змагань (Hazard) при зчитуванні бітів</text>

  <!-- RIGHT PANEL: SSI Interface (Modern) -->
  <rect x="495" y="70" width="435" height="390" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Right Header -->
  <rect x="510" y="85" width="405" height="36" rx="4" fill="#27ae60"/>
  <text x="712.5" y="108" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Інтерфейс SSI (Stegmann, 1984)</text>

  <!-- Right: Encoder -->
  <rect x="513" y="135" width="130" height="215" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="578" y="158" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">SSI Енкодер</text>
  <text x="578" y="182" font-size="12" fill="#6b7280" text-anchor="middle">Схема обробки:</text>
  <text x="578" y="200" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Зсувний регістр</text>
  <text x="578" y="226" font-size="12" fill="#6b7280" text-anchor="middle">Перетворення:</text>
  <text x="578" y="244" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Паралель → Послід.</text>
  <text x="578" y="268" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Код Ґрея → SSI</text>
  <text x="578" y="286" font-size="12" fill="#6b7280" text-anchor="middle">Драйвер RS-422</text>
  <text x="578" y="312" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">(лише 4 провідники)</text>

  <!-- Right: 4-Wire SSI Harness -->
  <rect x="653" y="137" width="119" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712.5" y="154" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Усього 4 сигнали</text>

  <!-- Clock signal (Master -> Slave) -->
  <text x="712.5" y="177" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">CLK+ / CLK- (Такт ←)</text>
  <line x1="782" y1="185" x2="643" y2="185" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Data signal (Slave -> Master) -->
  <text x="712.5" y="227" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">DATA+ / DATA- (Дані →)</text>
  <line x1="643" y1="235" x2="782" y2="235" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Power lines -->
  <text x="712.5" y="277" font-size="12" fill="#6b7280" text-anchor="middle">Живлення (+24V / GND)</text>
  <line x1="643" y1="285" x2="782" y2="285" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Cable Length Note -->
  <text x="712.5" y="325" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Довжина кабелю до 1200 м</text>

  <!-- Right: PLC / Controller -->
  <rect x="782" y="135" width="130" height="215" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="847" y="158" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ЧПУ / ПЛК</text>
  <text x="847" y="182" font-size="12" fill="#6b7280" text-anchor="middle">Вхідний модуль:</text>
  <text x="847" y="200" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">SSI Master</text>
  <text x="847" y="226" font-size="12" fill="#6b7280" text-anchor="middle">Потрібно ліній:</text>
  <text x="847" y="244" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Лише 2 виті пари</text>
  <text x="847" y="268" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Генератор CLK</text>
  <text x="847" y="286" font-size="12" fill="#6b7280" text-anchor="middle">Зчитування по CLK</text>
  <text x="847" y="312" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">(мінімум портів)</text>

  <!-- Right: Bottom Summary -->
  <rect x="510" y="365" width="405" height="72" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="523" y="386" font-size="12" font-weight="bold" fill="#27ae60">• Тонкий кабель та висока завадостійкість (RS-422)</text>
  <text x="523" y="405" font-size="12" fill="#1a1a1a">• Економія кабельних каналів та уніфіковане підключення</text>
  <text x="523" y="424" font-size="12" fill="#1a1a1a">• Передача даних без втрат і змагань (швидкість до 2 Мбіт/с)</text>
</svg>
