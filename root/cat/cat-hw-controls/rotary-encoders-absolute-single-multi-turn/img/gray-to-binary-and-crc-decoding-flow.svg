<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Marker definition -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Алгоритм декодування коду Ґрея та верифікації кадру BiSS-C</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Послідовне розпакування: виділення полів, XOR-перетворення Ґрея, перевірка прапорців E/W та CRC-6</text>

  <!-- Panel 1: Frame Unpacking -->
  <rect x="30" y="90" width="200" height="390" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="130" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">1. Прийом та розпакування</text>

  <!-- Panel 2: Gray Decoding -->
  <rect x="250" y="90" width="220" height="390" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="360" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">2. Декодування Ґрея</text>

  <!-- Panel 3: Status Flags -->
  <rect x="490" y="90" width="220" height="390" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="600" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">3. Контроль прапорців</text>

  <!-- Panel 4: CRC Verification -->
  <rect x="730" y="90" width="200" height="390" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="830" y="118" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">4. Контроль CRC-6</text>

  <!-- STAGE 1 CONTENT -->
  <rect x="45" y="145" width="170" height="85" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="130" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Сирий кадр (32 біти)</text>
  <rect x="55" y="182" width="85" height="22" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="97" y="197" text-anchor="middle" font-size="12" fill="#2457d6">Gray (24b)</text>
  <rect x="143" y="182" width="25" height="22" fill="#fdecea" stroke="#c0392b"/>
  <text x="155" y="197" text-anchor="middle" font-size="12" fill="#c0392b">E/W</text>
  <rect x="171" y="182" width="32" height="22" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="187" y="197" text-anchor="middle" font-size="12" fill="#27ae60">CRC</text>

  <!-- Arrow Panel 1 to 2 -->
  <line x1="215" y1="187" x2="265" y2="187" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Bit Extraction Box -->
  <rect x="45" y="260" width="170" height="195" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="130" y="283" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Бітові маски</text>
  <text x="55" y="315" text-anchor="start" font-size="12" fill="#6b7280">pos_raw = frame &gt;&gt; 8</text>
  <text x="55" y="345" text-anchor="start" font-size="12" fill="#6b7280">err_b = (frame &gt;&gt; 6) &amp; 3</text>
  <text x="55" y="375" text-anchor="start" font-size="12" fill="#6b7280">crc_b = frame &amp; 0x3F</text>
  <text x="130" y="420" text-anchor="middle" font-size="12" fill="#2457d6">Виділення полів</text>

  <!-- STAGE 2 CONTENT -->
  <rect x="265" y="145" width="190" height="150" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="360" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Паралельний XOR-зсув</text>
  <text x="275" y="198" text-anchor="start" font-size="12" fill="#1a1a1a">g ^= (g &gt;&gt; 1);</text>
  <text x="275" y="223" text-anchor="start" font-size="12" fill="#1a1a1a">g ^= (g &gt;&gt; 2);</text>
  <text x="275" y="248" text-anchor="start" font-size="12" fill="#1a1a1a">g ^= (g &gt;&gt; 4); ...</text>

  <!-- Output Binary Position -->
  <rect x="265" y="325" width="190" height="130" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="360" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Двійковий код</text>
  <text x="360" y="388" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">N_pos = 0x8A4F12</text>
  <text x="360" y="420" text-anchor="middle" font-size="12" fill="#6b7280">(0 ... 16 777 215)</text>

  <!-- Arrow Panel 2 to 3 -->
  <line x1="455" y1="220" x2="505" y2="220" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>

  <!-- STAGE 3 CONTENT -->
  <rect x="505" y="145" width="190" height="150" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="600" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Аналіз прапорців</text>

  <!-- Flag E -->
  <rect x="520" y="188" width="160" height="35" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="600" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">E = 0: Помилка давача!</text>

  <!-- Flag W -->
  <rect x="520" y="238" width="160" height="35" rx="4" fill="#f4f6f8" stroke="#6b7280"/>
  <text x="600" y="260" text-anchor="middle" font-size="12" fill="#1a1a1a">W = 1: Попереджень нема</text>

  <!-- Action on E=0 -->
  <rect x="505" y="325" width="190" height="130" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="600" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Стан апаратури</text>
  <text x="600" y="388" text-anchor="middle" font-size="12" fill="#1a1a1a">Світлодіод ОК</text>
  <text x="600" y="420" text-anchor="middle" font-size="12" fill="#27ae60">Кабелі цілі</text>

  <!-- Arrow Panel 3 to 4 -->
  <line x1="695" y1="220" x2="745" y2="220" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>

  <!-- STAGE 4 CONTENT -->
  <rect x="745" y="145" width="170" height="150" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="830" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Поліном CRC-6</text>
  <text x="830" y="198" text-anchor="middle" font-size="12" fill="#1a1a1a">P(x) = x⁶ + x + 1</text>
  <text x="830" y="228" text-anchor="middle" font-size="12" fill="#6b7280">Маска: 0x03</text>
  <text x="830" y="258" text-anchor="middle" font-size="12" fill="#1a1a1a">XOR 0x3F (інверсія)</text>

  <!-- Output Result Validation -->
  <rect x="745" y="325" width="170" height="130" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="830" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Результат CRC</text>
  <text x="830" y="388" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Співпало! (OK)</text>
  <text x="830" y="420" text-anchor="middle" font-size="12" fill="#1a1a1a">Передача в ЧПУ</text>

  <!-- Bottom Banner -->
  <rect x="30" y="500" width="900" height="40" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="525" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Результат: Гарантована цілісність даних та точний двійковий код позиції для сервоприводу</text>
</svg>
