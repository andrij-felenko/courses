<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Усередині: підкова опору з двома кінцями + повзунок на валу = три виводи</text>
<rect x="85.0" y="93.0" width="330.0" height="330.0" rx="12" fill="#fafbfc" stroke="#6b7280" stroke-width="1.6"/>
<text x="250.0" y="78.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle" font-weight="700">механізм (вид зверху)</text>
<path d="M 174.2 177.6 A 118.0 118.0 0 1 0 325.8 177.6" fill="none" stroke="#8a5a5a" stroke-width="13" stroke-linecap="round"/>
<circle cx="174.2" cy="177.6" r="8.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="148.3" y="155.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="end" font-weight="700">вивід 1</text>
<circle cx="325.8" cy="177.6" r="8.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="351.7" y="155.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">вивід 3</text>
<circle cx="250.0" cy="268.0" r="26.0" fill="#3b4048" stroke="#1a1a1a" stroke-width="1.6"/>
<circle cx="250.0" cy="268.0" r="7.0" fill="#5b616b" stroke="#1a1a1a" stroke-width="1.0"/>
<line x1="250.0" y1="268.0" x2="250.0" y2="386.0" stroke="#c0392b" stroke-width="4.0"/>
<circle cx="250.0" cy="386.0" r="6.0" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="250.0" y1="386.0" x2="250.0" y2="426.0" stroke="#c0392b" stroke-width="2.0"/>
<circle cx="250.0" cy="426.0" r="8.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="250.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">вивід 2 (повзунок)</text>
<text x="250.0" y="172.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">крутиш вал →</text>
<text x="250.0" y="188.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">повзунок їде доріжкою</text>
<text x="680.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">те саме як схема: дільник напруги</text>
<rect x="666.0" y="96.0" width="28.0" height="334.0" rx="7" fill="#f0e6e6" stroke="#8a5a5a" stroke-width="1.8"/>
<text x="654.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">повний опір R</text>
<text x="654.0" y="156.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">(напр. 10 кОм)</text>
<line x1="680.0" y1="96.0" x2="680.0" y2="70.0" stroke="#c0392b" stroke-width="2.4"/>
<circle cx="680.0" cy="56.0" r="11.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="680.0" y="61.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<text x="702.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">вивід 1 → +</text>
<line x1="680.0" y1="430.0" x2="680.0" y2="456.0" stroke="#2457d6" stroke-width="2.4"/>
<circle cx="680.0" cy="470.0" r="11.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="680.0" y="474.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<text x="702.0" y="474.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="start" font-weight="700">вивід 3 → −</text>
<polygon points="666.0,222.9 640.0,210.9 640.0,234.9" fill="#c0392b" stroke="#1a1a1a" stroke-width="1.4"/>
<line x1="640.0" y1="222.9" x2="584.0" y2="222.9" stroke="#c0392b" stroke-width="2.4"/>
<rect x="476.0" y="204.9" width="108.0" height="36.0" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.7"/>
<text x="530.0" y="219.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">вивід 2</text>
<text x="530.0" y="235.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">Uвих</text>
<text x="702.0" y="159.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7a4040" text-anchor="start"><tspan x="702.0" dy="0.0">опір зверху</tspan><tspan x="702.0" dy="12.3">(до +)</tspan></text>
<text x="702.0" y="326.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#7a4040" text-anchor="start"><tspan x="702.0" dy="0.0">опір знизу</tspan><tspan x="702.0" dy="12.3">(до −)</tspan></text>
<rect x="85.9" y="505.9" width="768.1" height="44.1" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="524.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">Повзунок ділить доріжку на дві частини: скільки опору лишилось до «+» і скільки до «−». Вивід 2 віддає напругу</tspan><tspan x="470.0" dy="13.7">рівно за цим поділом — от і весь потенціометр. Крутнув до «+» кінця — Uвих ≈ живлення; до «−» — ≈ 0; посередині — ≈ половина.</tspan></text>
</svg>