<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема RC-фільтра брязкоту контактів енкодера та придушення завад</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Підтягуючий резистор R_pullup, RC-ланцюжок (τ = R_f × C_f) та тригер Шмітта формують чистий сигнал</text>

  <!-- LEFT PANEL: SCHEMATIC DIAGRAM -->
  <rect x="30" y="75" width="435" height="440" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <path d="M 30,107 L 30,83 Q 30,75 38,75 L 457,75 Q 465,75 465,83 L 465,107 Z" fill="#eaf0fd"/>
  <line x1="30" y1="107" x2="465" y2="107" stroke="#2457d6" stroke-width="1.5"/>
  <text x="247" y="96" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Принципова схема RC-фільтра</text>

  <!-- VCC Rail & Label -->
  <line x1="140" y1="130" x2="140" y2="145" stroke="#c0392b" stroke-width="2"/>
  <text x="140" y="125" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">VCC (+5V)</text>

  <!-- R_pullup (Resistor vertical) -->
  <rect x="133" y="145" width="14" height="40" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="115" y="160" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">R_pullup</text>
  <text x="115" y="176" font-size="12" fill="#6b7280" text-anchor="end">10 кОм</text>
  <line x1="140" y1="185" x2="140" y2="210" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Raw Signal Node (N1) -->
  <circle cx="140" cy="210" r="4" fill="#c0392b"/>
  <text x="125" y="214" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">V_raw</text>

  <!-- Switch SW_A (Encoder Contact) -->
  <line x1="140" y1="210" x2="140" y2="240" stroke="#c0392b" stroke-width="2"/>
  <circle cx="140" cy="240" r="3" fill="#1a1a1a"/>
  <line x1="140" y1="240" x2="128" y2="265" stroke="#c0392b" stroke-width="2"/>
  <circle cx="140" cy="270" r="3" fill="#1a1a1a"/>
  <line x1="140" y1="270" x2="140" y2="290" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Switch Ground Symbol -->
  <line x1="130" y1="290" x2="150" y2="290" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="134" y1="294" x2="146" y2="294" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="138" y1="298" x2="142" y2="298" stroke="#1a1a1a" stroke-width="2"/>
  <text x="115" y="250" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">Контакт SW_A</text>
  <text x="115" y="266" font-size="12" fill="#6b7280" text-anchor="end">(енкодер)</text>

  <!-- Filter Resistor R_f (Horizontal) -->
  <line x1="140" y1="210" x2="180" y2="210" stroke="#2457d6" stroke-width="2"/>
  <rect x="180" y="203" width="40" height="14" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="200" y="195" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">R_f = 10 кОм</text>
  <line x1="220" y1="210" x2="260" y2="210" stroke="#2457d6" stroke-width="2"/>

  <!-- Filter Signal Node (N2) -->
  <circle cx="260" cy="210" r="4" fill="#2457d6"/>
  <text x="260" y="195" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">V_filt</text>

  <!-- Capacitor C_f -->
  <line x1="260" y1="210" x2="260" y2="250" stroke="#2457d6" stroke-width="2"/>
  <line x1="248" y1="250" x2="272" y2="250" stroke="#2457d6" stroke-width="2"/>
  <line x1="248" y1="256" x2="272" y2="256" stroke="#2457d6" stroke-width="2"/>
  <line x1="260" y1="256" x2="260" y2="285" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Capacitor Ground Symbol -->
  <line x1="250" y1="285" x2="270" y2="285" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="254" y1="289" x2="266" y2="289" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="258" y1="293" x2="262" y2="293" stroke="#1a1a1a" stroke-width="2"/>
  <text x="282" y="258" font-size="12" font-weight="bold" fill="#2457d6">C_f = 100 нФ</text>

  <!-- Schmitt Trigger IC (74HC14) -->
  <line x1="260" y1="210" x2="310" y2="210" stroke="#27ae60" stroke-width="2"/>
  <polygon points="310,188 310,232 350,210" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="353" cy="210" r="3" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <!-- Hysteresis symbol -->
  <path d="M 322,206 H 330 V 214 H 322" fill="none" stroke="#27ae60" stroke-width="1.2"/>
  <text x="330" y="172" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Тригер Шмітта</text>
  <text x="330" y="185" font-size="12" fill="#6b7280" text-anchor="middle">(74HC14)</text>

  <!-- Output Wire -->
  <line x1="356" y1="210" x2="410" y2="210" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="415" y="214" font-size="12" font-weight="bold" fill="#27ae60">V_out</text>

  <!-- Left Bottom Formula & Summary Box -->
  <rect x="45" y="325" width="405" height="175" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="247" y="348" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розрахунок параметрів RC-фільтра:</text>
  <text x="247" y="370" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">τ = R_f × C_f = 10 кОм × 100 нФ = 1.0 мс</text>
  <text x="247" y="392" font-size="12" fill="#1a1a1a" text-anchor="middle">Частота зрізу: f_c = 1 / (2π × τ) ≈ 159 Гц</text>
  <text x="247" y="414" font-size="12" fill="#1a1a1a" text-anchor="middle">• τ &gt; t_bounce (1...5 мс) усуває брязкіт контактів</text>
  <text x="247" y="436" font-size="12" fill="#6b7280" text-anchor="middle">• Тригер Шмітта формує крутий прямокутний фронт</text>
  <text x="247" y="458" font-size="12" fill="#6b7280" text-anchor="middle">• R_pullup (10 кОм) забезпечує підтяжку до VCC</text>
  <text x="247" y="480" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Захист входу МК від хибних переривань</text>

  <!-- RIGHT PANEL: WAVEFORM DIAGRAMS -->
  <rect x="495" y="75" width="435" height="440" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <path d="M 495,107 L 495,83 Q 495,75 503,75 L 922,75 Q 930,75 930,83 L 930,107 Z" fill="#eaf0fd"/>
  <line x1="495" y1="107" x2="930" y2="107" stroke="#2457d6" stroke-width="1.5"/>
  <text x="712" y="96" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Часові діаграми згладжування</text>

  <!-- Right Waveform Container Box -->
  <rect x="510" y="120" width="405" height="380" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>

  <!-- 1. V_raw Diagram (Top) -->
  <text x="525" y="142" font-size="12" font-weight="bold" fill="#c0392b">V_raw(t)</text>
  <text x="895" y="142" font-size="12" fill="#6b7280" text-anchor="end">Вхідний брязкіт (High frequency spikes)</text>
  <!-- Axes V_raw -->
  <line x1="535" y1="200" x2="895" y2="200" stroke="#d0d7de" stroke-width="1"/>
  <!-- Raw Wave -->
  <path d="M 540,155 H 580 V 200 H 584 V 155 H 588 V 200 H 592 V 165 H 596 V 200 H 600 V 180 H 604 V 200 H 720 V 155 H 724 V 200 H 728 V 155 H 732 V 180 H 736 V 155 H 740 V 200 H 885" fill="none" stroke="#c0392b" stroke-width="1.8"/>

  <!-- 2. V_filt Diagram (Middle Exponential) -->
  <text x="525" y="215" font-size="12" font-weight="bold" fill="#2457d6">V_filt(t)</text>
  <text x="895" y="250" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">V_th (Поріг 74HC14)</text>
  <!-- Threshold V_th line -->
  <line x1="535" y1="260" x2="895" y2="260" stroke="#27ae60" stroke-dasharray="4,3" stroke-width="1.2"/>
  <!-- Axes V_filt -->
  <line x1="535" y1="310" x2="895" y2="310" stroke="#d0d7de" stroke-width="1"/>
  <!-- Smooth Exponential RC Charge/Discharge Curve -->
  <path d="M 540,225 H 580 C 600,280 620,310 660,310 H 720 C 740,250 760,225 800,225 H 885" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Time Constant Tau Annotation -->
  <line x1="580" y1="310" x2="580" y2="324" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="630" y1="310" x2="630" y2="324" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="580" y1="324" x2="630" y2="324" stroke="#2457d6" stroke-width="1.2" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
  <text x="605" y="340" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">τ = R_f × C_f</text>

  <!-- 3. V_out Diagram (Bottom Clean Rectangular Waveform) -->
  <text x="525" y="365" font-size="12" font-weight="bold" fill="#27ae60">V_out(t)</text>
  <!-- Axes V_out -->
  <line x1="535" y1="440" x2="895" y2="440" stroke="#d0d7de" stroke-width="1"/>
  <!-- Clean Rectangular Waveform -->
  <path d="M 540,390 H 615 V 440 H 755 V 390 H 885" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Vertical trigger alignment lines from V_filt crossing V_th to V_out edge -->
  <line x1="615" y1="260" x2="615" y2="315" stroke="#27ae60" stroke-dasharray="2,2" stroke-width="1"/>
  <line x1="615" y1="350" x2="615" y2="440" stroke="#27ae60" stroke-dasharray="2,2" stroke-width="1"/>
  <line x1="755" y1="260" x2="755" y2="440" stroke="#27ae60" stroke-dasharray="2,2" stroke-width="1"/>

  <text x="712" y="475" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">✓ Чистий прямокутний імпульс (без хибних спрацьовувань)</text>
</svg>
