<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Порівняння квадратурних сигналів: механічний vs оптичний енкодер</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Механічні контакти утворюють брязкіт (bounce), а безконтактна оптопара формує чіткий сигнал</text>

  <!-- LEFT PANEL: MECHANICAL ENCODER -->
  <g id="panel-mechanical">
    <rect x="30" y="75" width="435" height="440" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
    <path d="M 30,107 L 30,83 Q 30,75 38,75 L 457,75 Q 465,75 465,83 L 465,107 Z" fill="#fdecea"/>
    <line x1="30" y1="107" x2="465" y2="107" stroke="#c0392b" stroke-width="1.5"/>
    <text x="247" y="98" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">1. МЕХАНІЧНИЙ ЕНКОДЕР (КОНТАКТНИЙ БРЯЗКІТ)</text>

    <!-- Waveform Box Left -->
    <rect x="50" y="125" width="395" height="240" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>

    <!-- Channel A Label & Waveform -->
    <text x="65" y="148" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">Канал A (Механічний контакт A)</text>
    <path d="M 65,200 H 120 V 165 H 125 V 200 H 130 V 165 H 135 V 200 H 140 V 175 H 145 V 200 H 150 V 190 H 155 V 200 H 230 V 165 H 235 V 200 H 240 V 165 H 245 V 180 H 250 V 200 H 325 V 165 H 330 V 200 H 335 V 165 H 340 V 185 H 345 V 200 H 425" fill="none" stroke="#c0392b" stroke-width="2"/>

    <!-- Bounce Highlight A -->
    <rect x="118" y="160" width="40" height="45" fill="#fdecea" fill-opacity="0.6" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="138" y="220" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Брязкіт (Bounce) 1..5 мс</text>

    <!-- Channel B Label & Waveform -->
    <text x="65" y="260" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">Канал B (Механічний контакт B)</text>
    <path d="M 65,320 H 175 V 285 H 180 V 320 H 185 V 285 H 190 V 305 H 195 V 320 H 200 V 310 H 205 V 320 H 285 V 285 H 290 V 320 H 295 V 285 H 300 V 305 H 305 V 320 H 385 V 285 H 390 V 320 H 395 V 285 H 425" fill="none" stroke="#c0392b" stroke-width="2"/>

    <!-- Bounce Highlight B -->
    <rect x="173" y="280" width="35" height="45" fill="#fdecea" fill-opacity="0.6" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="190" y="340" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Хибні спрацьовування</text>

    <!-- Summary Box Left -->
    <rect x="50" y="380" width="395" height="120" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
    <text x="247" y="400" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Недоліки механічних контактів:</text>
    <text x="247" y="422" font-size="12" fill="#1a1a1a" text-anchor="middle">• Потребує апаратних RC-фільтрів або затримок дебаунсу</text>
    <text x="247" y="442" font-size="12" fill="#1a1a1a" text-anchor="middle">• Ризик хибного визначення напрямку обертання</text>
    <text x="247" y="462" font-size="12" fill="#6b7280" text-anchor="middle">• Фізичний знос контактів, низька швидкість (&lt; 1000 об/хв)</text>
  </g>

  <!-- RIGHT PANEL: OPTICAL ENCODER -->
  <g id="panel-optical">
    <rect x="495" y="75" width="435" height="440" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
    <path d="M 495,107 L 495,83 Q 495,75 503,75 L 922,75 Q 930,75 930,83 L 930,107 Z" fill="#eaf0fd"/>
    <line x1="495" y1="107" x2="930" y2="107" stroke="#2457d6" stroke-width="1.5"/>
    <text x="712" y="98" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">2. ОПТИЧНИЙ ЕНКОДЕР (БЕЗКОНТАКТНИЙ ЧИСТИЙ СИГНАЛ)</text>

    <!-- Waveform Box Right -->
    <rect x="515" y="125" width="395" height="240" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>

    <!-- Channel A Clean Waveform -->
    <text x="530" y="148" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">Канал A (Оптична оптопара A)</text>
    <path d="M 530,200 H 560 V 165 H 640 V 200 H 720 V 165 H 800 V 200 H 880 V 165 H 895" fill="none" stroke="#2457d6" stroke-width="2"/>

    <!-- Phase Shift & Edge Indicators -->
    <line x1="560" y1="160" x2="560" y2="215" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="600" y1="210" x2="600" y2="218" stroke="#27ae60" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="600" y1="268" x2="600" y2="285" stroke="#27ae60" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="560" y1="215" x2="600" y2="215" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
    
    <rect x="550" y="220" width="60" height="16" fill="#ffffff"/>
    <text x="580" y="232" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Δφ = 90°</text>

    <text x="760" y="232" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Чіткий фронт (t_r &lt; 100 нс)</text>

    <!-- Channel B Clean Waveform -->
    <text x="530" y="258" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">Канал B (Оптична оптопара B)</text>
    <path d="M 530,320 H 600 V 285 H 680 V 320 H 760 V 285 H 840 V 320 H 895" fill="none" stroke="#27ae60" stroke-width="2"/>

    <!-- Summary Box Right -->
    <rect x="515" y="380" width="395" height="120" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
    <text x="712" y="400" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Переваги оптичної оптопари:</text>
    <text x="712" y="422" font-size="12" fill="#1a1a1a" text-anchor="middle">• Повна відсутність брязкіту та перехідних завад</text>
    <text x="712" y="442" font-size="12" fill="#1a1a1a" text-anchor="middle">• Пряме підключення до квадратурних лічильників (QEI)</text>
    <text x="712" y="462" font-size="12" fill="#6b7280" text-anchor="middle">• Висока частота (&gt; 100 000 об/хв) та висока надійність</text>
  </g>
</svg>
