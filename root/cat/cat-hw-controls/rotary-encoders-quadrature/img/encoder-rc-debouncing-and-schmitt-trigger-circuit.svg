<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Апаратне придушення брязкоту контактів енкодера</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Низькочастотний RC-фільтр згладжує завади, а тригер Шмітта усуває невизначеність рівня</text>

  <!-- Panel 1: Circuit Diagram -->
  <rect x="30" y="75" width="900" height="200" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="50" y="98" font-size="14" font-weight="bold" fill="#1a1a1a">Схемотехніка фільтрації (Канал енкодера)</text>

  <!-- VCC Power Supply -->
  <text x="120" y="116" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">+5V (VCC)</text>
  <line x1="100" y1="122" x2="140" y2="122" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="120" y1="122" x2="120" y2="140" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Pull-up Resistor R_pu -->
  <rect x="110" y="140" width="20" height="36" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="138" y="156" font-size="13" font-weight="bold" fill="#1a1a1a">R_pu</text>
  <text x="138" y="170" font-size="12" fill="#6b7280">10 кОм</text>
  <line x1="120" y1="176" x2="120" y2="200" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Switch S1 (Contact A) & Ground -->
  <circle cx="120" cy="200" r="3.5" fill="#1a1a1a"/>
  <line x1="120" y1="200" x2="120" y2="215" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="120" cy="215" r="3" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="120" y1="215" x2="102" y2="238" stroke="#c0392b" stroke-width="2"/>
  <circle cx="120" cy="242" r="3" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="120" y1="242" x2="120" y2="252" stroke="#1a1a1a" stroke-width="2"/>

  <line x1="110" y1="252" x2="130" y2="252" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="114" y1="256" x2="126" y2="256" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="118" y1="260" x2="122" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>

  <text x="92" y="224" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="end">Контакт A</text>
  <text x="92" y="238" font-size="12" fill="#c0392b" text-anchor="end">(Брязкіт)</text>

  <!-- Point 1 (V_sw) -->
  <line x1="120" y1="200" x2="270" y2="200" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="195" cy="200" r="4" fill="#c0392b"/>
  <rect x="145" y="165" width="100" height="22" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="195" y="180" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Точка ①: V_sw</text>
  <line x1="195" y1="187" x2="195" y2="196" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- Resistor R -->
  <rect x="270" y="190" width="40" height="20" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="290" y="172" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">R</text>
  <text x="290" y="186" font-size="12" fill="#6b7280" text-anchor="middle">10 кОм</text>
  <line x1="310" y1="200" x2="470" y2="200" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Point 2 (V_C) & Capacitor C -->
  <circle cx="470" cy="200" r="4" fill="#2457d6"/>
  <rect x="420" y="165" width="100" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="470" y="180" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Точка ②: V_C</text>
  <line x1="470" y1="187" x2="470" y2="196" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="2 2"/>

  <line x1="470" y1="200" x2="470" y2="220" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="455" y1="220" x2="485" y2="220" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="455" y1="227" x2="485" y2="227" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="470" y1="227" x2="470" y2="242" stroke="#1a1a1a" stroke-width="2"/>

  <line x1="460" y1="242" x2="480" y2="242" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="464" y1="246" x2="476" y2="246" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="468" y1="250" x2="472" y2="250" stroke="#1a1a1a" stroke-width="1.5"/>

  <text x="495" y="222" font-size="13" font-weight="bold" fill="#1a1a1a">C</text>
  <text x="495" y="236" font-size="12" fill="#6b7280">100 нФ</text>

  <!-- Schmitt Trigger -->
  <line x1="470" y1="200" x2="570" y2="200" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="570,170 570,230 630,200" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 584,205 L 592,205 L 592,195 M 596,195 L 588,195 L 588,205" fill="none" stroke="#2457d6" stroke-width="1.8"/>
  <text x="600" y="146" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Тригер Шмітта</text>
  <text x="600" y="160" font-size="12" fill="#6b7280" text-anchor="middle">(74HC14 / 74LVC1G17)</text>

  <!-- Point 3 (V_out) & Output Terminal -->
  <line x1="630" y1="200" x2="815" y2="200" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="725" cy="200" r="4" fill="#27ae60"/>
  <rect x="670" y="165" width="110" height="22" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="725" y="180" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Точка ③: V_out</text>
  <line x1="725" y1="187" x2="725" y2="196" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="2 2"/>

  <line x1="815" y1="200" x2="825" y2="200" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <circle cx="815" cy="200" r="4" fill="#27ae60"/>

  <text x="838" y="196" font-size="13" font-weight="bold" fill="#27ae60">До МК / GPIO</text>
  <text x="838" y="211" font-size="12" fill="#6b7280">(Без брязкоту)</text>

  <!-- Panel 2: Waveforms -->
  <rect x="30" y="295" width="900" height="205" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="50" y="318" font-size="14" font-weight="bold" fill="#1a1a1a">Діаграми сигналів у часі t</text>

  <!-- Vertical Guidelines -->
  <line x1="300" y1="335" x2="300" y2="476" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <line x1="385" y1="335" x2="385" y2="476" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="385" cy="414" r="3.5" fill="#27ae60"/>

  <line x1="600" y1="335" x2="600" y2="476" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 3" opacity="0.5"/>
  <line x1="665" y1="335" x2="665" y2="476" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="665" cy="400" r="3.5" fill="#27ae60"/>

  <!-- Track 1: V_sw -->
  <text x="50" y="350" font-size="13" font-weight="bold" fill="#c0392b">① V_sw (вхід)</text>
  <text x="50" y="364" font-size="12" fill="#6b7280">Брязкіт контакту</text>
  <line x1="220" y1="365" x2="875" y2="365" stroke="#d0d7de" stroke-width="1"/>
  <path d="M 220,342 L 300,342 L 300,365 L 312,365 L 312,342 L 325,342 L 325,365 L 338,365 L 338,342 L 350,350 L 350,365 L 362,365 L 362,342 L 375,342 L 375,365 L 420,365 L 600,365 L 600,342 L 612,342 L 612,365 L 625,365 L 625,342 L 638,342 L 638,365 L 650,365 L 650,342 L 700,342 L 875,342" fill="none" stroke="#c0392b" stroke-width="2"/>

  <!-- Track 2: V_C -->
  <text x="50" y="402" font-size="13" font-weight="bold" fill="#2457d6">② V_C (конденсатор)</text>
  <text x="50" y="416" font-size="12" fill="#6b7280">RC-інтегрування</text>
  <line x1="220" y1="422" x2="875" y2="422" stroke="#d0d7de" stroke-width="1"/>
  <line x1="220" y1="400" x2="875" y2="400" stroke="#95a5a6" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="882" y="404" font-size="12" font-weight="bold" fill="#6b7280">V_T+</text>
  <line x1="220" y1="414" x2="875" y2="414" stroke="#95a5a6" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="882" y="418" font-size="12" font-weight="bold" fill="#6b7280">V_T-</text>
  <path d="M 220,392 L 300,392 C 330,392 355,420 420,422 L 600,422 C 630,422 655,394 700,392 L 875,392" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Track 3: V_out -->
  <text x="50" y="455" font-size="13" font-weight="bold" fill="#27ae60">③ V_out (вихід)</text>
  <text x="50" y="469" font-size="12" fill="#6b7280">Прямокутний сигнал</text>
  <line x1="220" y1="472" x2="875" y2="472" stroke="#d0d7de" stroke-width="1"/>
  <path d="M 220,448 L 385,448 L 385,472 L 665,472 L 665,448 L 875,448" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Annotations -->
  <text x="385" y="490" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Поріг V_T- (Спрацьовування)</text>
  <text x="665" y="490" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Поріг V_T+ (Спрацьовування)</text>
</svg>
