<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Конструктивні відмінності механічного та оптичного енкодерів</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Механічний контакт схильний до зносу й дребезгу, а безконтактний оптичний растр забезпечує високу точність</text>

  <!-- Left Panel: Mechanical Encoder -->
  <rect x="30" y="75" width="430" height="445" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="245" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Механічний енкодер (Контактний)</text>

  <!-- Mechanical Disc Assembly -->
  <g>
    <!-- Outer Conductive Disc -->
    <circle cx="230" cy="215" r="75" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
    <!-- Inner Contact Ring -->
    <circle cx="230" cy="215" r="42" fill="white" stroke="#2457d6" stroke-width="1.5"/>
    <!-- Center Shaft -->
    <circle cx="230" cy="215" r="18" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="230" y="219" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Вал</text>

    <!-- Conductive Teeth / Contact Segments -->
    <path d="M 230,140 L 230,173 M 305,215 L 272,215 M 230,290 L 230,257 M 155,215 L 188,215" stroke="#2457d6" stroke-width="6"/>
    <path d="M 283,162 L 260,185 M 283,268 L 260,245 M 177,268 L 200,245 M 177,162 L 200,185" stroke="#2457d6" stroke-width="6"/>

    <!-- Common Contact Label & Pointer -->
    <text x="45" y="132" font-size="12" font-weight="bold" fill="#1a1a1a">Спільна шина C (GND)</text>
    <path d="M 140,138 L 192,195" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-blue)"/>

    <!-- Channel A Wiper & Label -->
    <text x="445" y="162" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">Щітка Каналу A</text>
    <path d="M 350,167 L 292,173" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <circle cx="292" cy="173" r="4" fill="#2457d6"/>

    <!-- Channel B Wiper & Label -->
    <text x="445" y="272" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">Щітка Каналу B</text>
    <path d="M 350,267 L 292,257" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <circle cx="292" cy="257" r="4" fill="#2457d6"/>
  </g>

  <!-- Features Box Left -->
  <rect x="45" y="315" width="400" height="190" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="245" y="338" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Особливості механічної конструкції:</text>
  <text x="60" y="365" font-size="12" fill="#1a1a1a">• Механічне тертя й знос струмознімальних щіток</text>
  <text x="60" y="390" font-size="12" fill="#1a1a1a">• Обов'язковий брязкіт контактів (1–5 мс)</text>
  <text x="60" y="415" font-size="12" fill="#1a1a1a">• Низька роздільна здатність (12–24 імпульси/оберт)</text>
  <text x="60" y="440" font-size="12" fill="#1a1a1a">• Обмежена частота обертання (&lt; 300 об/хв)</text>
  <text x="60" y="465" font-size="12" fill="#6b7280">• Застосування: регулятори на панелях приладів</text>

  <!-- Right Panel: Optical Encoder -->
  <rect x="480" y="75" width="450" height="445" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="705" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Оптичний енкодер (Безконтактний)</text>

  <!-- Optical Disc Assembly -->
  <g>
    <!-- Glass Disc -->
    <circle cx="690" cy="215" r="75" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <circle cx="690" cy="215" r="18" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="690" y="219" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Вал</text>

    <!-- Slits Grid Ring -->
    <circle cx="690" cy="215" r="63" fill="none" stroke="#1a1a1a" stroke-width="12" stroke-dasharray="3,3"/>

    <!-- LED Emitter Box -->
    <rect x="520" y="140" width="90" height="34" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="565" y="161" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Світлодіод</text>

    <!-- Light Beam Path -->
    <line x1="565" y1="174" x2="565" y2="260" stroke="#c0392b" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
    <text x="508" y="219" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">Промінь</text>

    <!-- Photo Sensor Box -->
    <rect x="510" y="260" width="110" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
    <text x="565" y="281" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Фотоприймач</text>

    <!-- Labels Right & Pointers -->
    <text x="915" y="162" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">Скляний кодовий диск</text>
    <path d="M 780,167 L 748,182" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-blue)"/>

    <text x="915" y="272" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">Оптичні растрові прорізи</text>
    <path d="M 775,267 L 742,242" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  </g>

  <!-- Features Box Right -->
  <rect x="495" y="315" width="420" height="190" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="705" y="338" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Особливості оптичної конструкції:</text>
  <text x="510" y="365" font-size="12" fill="#1a1a1a">• Повна відсутність механічного тертя й зносу</text>
  <text x="510" y="390" font-size="12" fill="#1a1a1a">• Ідеальні прямокутні фронти без брязкоту контактів</text>
  <text x="510" y="415" font-size="12" fill="#1a1a1a">• Висока роздільна здатність (100–10000 PPR)</text>
  <text x="510" y="440" font-size="12" fill="#1a1a1a">• Висока гранична частота (&gt; 10000 об/хв)</text>
  <text x="510" y="465" font-size="12" fill="#6b7280">• Застосування: сервоприводи, верстати з ЧПУ, робототехніка</text>
</svg>
