<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="4.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4.5 L0,9 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Режими умноження роздільної здатності енкодера (1X, 2X, 4X)</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">1X підраховує фронт A↑, 2X — фронти A↑ A↓, 4X — всі фронти каналів A та B (A↑ A↓ B↑ B↓)</text>

  <!-- SECTION 1: QUADRATURE SIGNALS WAVEFORMS -->
  <g id="signals-panel">
    <rect x="30" y="76" width="900" height="118" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    
    <!-- Vertical Phase Grid inside Signals Panel -->
    <line x1="190" y1="76" x2="190" y2="194" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="275" y1="76" x2="275" y2="194" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="360" y1="98" x2="360" y2="194" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="445" y1="76" x2="445" y2="194" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="530" y1="76" x2="530" y2="194" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="615" y1="76" x2="615" y2="194" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="700" y1="76" x2="700" y2="194" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="785" y1="76" x2="785" y2="194" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Period T indicator -->
    <text x="360" y="91" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b7280">Період T (360°)</text>
    <line x1="190" y1="96" x2="530" y2="96" stroke="#6b7280" stroke-width="1.5"/>

    <!-- Channel A -->
    <text x="45" y="133" font-size="12" font-weight="bold" fill="#2457d6">Канал A</text>
    <path d="M 140,145 L 190,145 L 190,115 L 360,115 L 360,145 L 530,145 L 530,115 L 700,115 L 700,145 L 870,145 L 900,145" stroke="#2457d6" stroke-width="2.5" fill="none"/>
    
    <!-- Channel B -->
    <text x="45" y="173" font-size="12" font-weight="bold" fill="#2457d6">Канал B</text>
    <path d="M 140,185 L 275,185 L 275,155 L 445,155 L 445,185 L 615,185 L 615,155 L 785,155 L 785,185 L 870,185 L 900,185" stroke="#2457d6" stroke-width="2.5" fill="none"/>
  </g>

  <!-- SECTION 2: MODE 1X -->
  <g id="mode-1x">
    <rect x="30" y="202" width="900" height="52" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="45" y="226" font-size="12" font-weight="bold" fill="#2457d6">Режим 1X</text>
    <text x="45" y="242" font-size="11" fill="#6b7280">(1 імпульс/T)</text>

    <!-- Triggers -->
    <circle cx="190" cy="228" r="5" fill="#27ae60"/>
    <text x="190" y="246" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">+1 (A↑)</text>

    <circle cx="530" cy="228" r="5" fill="#27ae60"/>
    <text x="530" y="246" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">+2 (A↑)</text>
  </g>

  <!-- SECTION 3: MODE 2X -->
  <g id="mode-2x">
    <rect x="30" y="262" width="900" height="52" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="45" y="286" font-size="12" font-weight="bold" fill="#2457d6">Режим 2X</text>
    <text x="45" y="302" font-size="11" fill="#6b7280">(2 імпульси/T)</text>

    <!-- Triggers -->
    <circle cx="190" cy="288" r="5" fill="#27ae60"/>
    <text x="190" y="306" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">+1 (A↑)</text>

    <circle cx="360" cy="288" r="5" fill="#27ae60"/>
    <text x="360" y="306" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">+2 (A↓)</text>

    <circle cx="530" cy="288" r="5" fill="#27ae60"/>
    <text x="530" y="306" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">+3 (A↑)</text>

    <circle cx="700" cy="288" r="5" fill="#27ae60"/>
    <text x="700" y="306" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">+4 (A↓)</text>
  </g>

  <!-- SECTION 4: MODE 4X -->
  <g id="mode-4x">
    <rect x="30" y="322" width="900" height="52" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="45" y="346" font-size="12" font-weight="bold" fill="#2457d6">Режим 4X</text>
    <text x="45" y="362" font-size="11" fill="#6b7280">(4 імпульси/T)</text>

    <!-- Triggers -->
    <circle cx="190" cy="348" r="5" fill="#27ae60"/>
    <text x="190" y="366" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">+1</text>

    <circle cx="275" cy="348" r="5" fill="#27ae60"/>
    <text x="275" y="366" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">+2</text>

    <circle cx="360" cy="348" r="5" fill="#27ae60"/>
    <text x="360" y="366" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">+3</text>

    <circle cx="445" cy="348" r="5" fill="#27ae60"/>
    <text x="445" y="366" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">+4</text>

    <circle cx="530" cy="348" r="5" fill="#27ae60"/>
    <text x="530" y="366" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">+5</text>

    <circle cx="615" cy="348" r="5" fill="#27ae60"/>
    <text x="615" y="366" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">+6</text>

    <circle cx="700" cy="348" r="5" fill="#27ae60"/>
    <text x="700" y="366" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">+7</text>

    <circle cx="785" cy="348" r="5" fill="#27ae60"/>
    <text x="785" y="366" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">+8</text>
  </g>

  <!-- SECTION 5: SUMMARY INFO BOX -->
  <rect x="30" y="382" width="900" height="58" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="404" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">✓ ВИСНОВОК: Режим 4X забезпечує в 4 рази вищу кутову роздільну здатність (N_cpr = 4 × N_ppr)</text>
  <text x="480" y="424" text-anchor="middle" font-size="11" fill="#1a1a1a">Кожен фронт переходу стану (A, B) інкрементує лічильник позиції, збільшуючи точність вимірювання кута.</text>
</svg>
