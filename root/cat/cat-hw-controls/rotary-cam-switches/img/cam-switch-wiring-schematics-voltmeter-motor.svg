<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-amber" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Main Titles -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Типові принципові схеми розключення кулачкових перемикачів</text>
  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Організація зовнішніх перемичок для вольтметрового селектора та реверсу трьохфазного двигуна</text>


  <!-- LEFT PANEL: VOLTMETER SELECTOR SCHEMATIC -->
  <rect x="30" y="75" width="435" height="415" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="247" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#2457d6">Схема А: Селектор напруг вольтметра</text>
  <text x="247" y="120" text-anchor="middle" font-size="12" fill="#6b7280">(Комутація між фазами L1, L2, L3 та вольтметром V)</text>

  <!-- Input Lines L1, L2, L3 -->
  <line x1="50" y1="160" x2="159" y2="160" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-red)"/>
  <text x="65" y="153" font-size="11" font-weight="bold" fill="#c0392b">L1</text>

  <line x1="50" y1="220" x2="159" y2="220" stroke="#d97706" stroke-width="3" marker-end="url(#arr-amber)"/>
  <text x="65" y="213" font-size="11" font-weight="bold" fill="#d97706">L2</text>

  <line x1="50" y1="280" x2="159" y2="280" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>
  <text x="65" y="273" font-size="11" font-weight="bold" fill="#2457d6">L3</text>

  <!-- Cam Switch Contact Decks -->
  <rect x="160" y="145" width="150" height="30" rx="4" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="235" y="164" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Контакт 1-2 (L1-L2)</text>

  <rect x="160" y="205" width="150" height="30" rx="4" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="235" y="224" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Контакт 3-4 (L2-L3)</text>

  <rect x="160" y="265" width="150" height="30" rx="4" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="235" y="284" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Контакт 5-6 (L3-L1)</text>

  <!-- External Jumpers & Output lines to Voltmeter -->
  <path d="M 310,160 L 340,160 L 340,210 L 387,210" fill="none" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <path d="M 310,220 L 340,220 L 340,230 L 387,230" fill="none" stroke="#166534" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <!-- Jumper line 5-6 to V+ bus -->
  <path d="M 310,280 L 340,280 L 340,210" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="348" y="185" font-size="10" font-weight="bold" fill="#27ae60">Перемичка V+</text>

  <!-- Voltmeter V Symbol -->
  <circle cx="410" cy="220" r="22" fill="white" stroke="#2457d6" stroke-width="2"/>
  <text x="410" y="226" text-anchor="middle" font-size="16" font-weight="bold" fill="#2457d6">V</text>
  <text x="410" y="255" text-anchor="middle" font-size="10" font-weight="bold" fill="#6b7280">Вольтметр</text>

  <!-- Left Bottom Banner -->
  <rect x="50" y="430" width="395" height="36" rx="4" fill="white" stroke="#2457d6" stroke-width="1"/>
  <text x="247" y="452" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">✅ 1 вольтметр вимірює всі 3 фазні напруги</text>


  <!-- RIGHT PANEL: MOTOR REVERSING SCHEMATIC -->
  <rect x="495" y="75" width="435" height="415" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="712" y="100" text-anchor="middle" font-size="15" font-weight="bold" fill="#27ae60">Схема Б: Реверсер трьохфазного двигуна</text>
  <text x="712" y="120" text-anchor="middle" font-size="12" fill="#6b7280">(Переворот двох фаз L1 ↔ L2 для зміни напрямку)</text>

  <!-- Input Lines L1, L2, L3 -->
  <line x1="515" y1="160" x2="609" y2="160" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-red)"/>
  <text x="530" y="153" font-size="11" font-weight="bold" fill="#c0392b">L1</text>

  <line x1="515" y1="220" x2="609" y2="220" stroke="#d97706" stroke-width="3" marker-end="url(#arr-amber)"/>
  <text x="530" y="213" font-size="11" font-weight="bold" fill="#d97706">L2</text>

  <line x1="515" y1="280" x2="609" y2="280" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>
  <text x="530" y="273" font-size="11" font-weight="bold" fill="#2457d6">L3</text>

  <!-- Reversing Cam Switch Decks -->
  <rect x="610" y="145" width="155" height="30" rx="4" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <text x="687" y="164" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Контакт L1 (Прямий/Реверс)</text>

  <rect x="610" y="205" width="155" height="30" rx="4" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <text x="687" y="224" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Контакт L2 (Реверс фаз)</text>

  <rect x="610" y="265" width="155" height="30" rx="4" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <text x="687" y="284" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Контакт L3 (Транзит L3)</text>

  <!-- Output & Cross-over Reversing Jumpers -->
  <!-- Direct Lines to Motor Terminals -->
  <line x1="765" y1="160" x2="848" y2="160" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="765" y1="220" x2="848" y2="220" stroke="#d97706" stroke-width="2.5"/>
  <line x1="765" y1="280" x2="848" y2="280" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Cross-jumper Lines for Phase Swap -->
  <path d="M 765,160 L 805,220" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="4,2"/>
  <path d="M 765,220 L 805,160" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="785" y="320" text-anchor="middle" font-size="10" font-weight="bold" fill="#d97706">Перехрестя фаз L1/L2</text>

  <!-- 3-Phase Motor M Symbol -->
  <circle cx="875" cy="220" r="26" fill="white" stroke="#27ae60" stroke-width="2"/>
  <text x="875" y="218" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">M</text>
  <text x="875" y="234" text-anchor="middle" font-size="11" font-weight="bold" fill="#166534">3 ~</text>

  <!-- Motor Terminal Labels -->
  <text x="840" y="153" font-size="10" font-weight="bold" fill="#c0392b">U1</text>
  <text x="840" y="213" font-size="10" font-weight="bold" fill="#d97706">V1</text>
  <text x="840" y="273" font-size="10" font-weight="bold" fill="#2457d6">W1</text>

  <!-- Right Bottom Banner -->
  <rect x="515" y="430" width="395" height="36" rx="4" fill="white" stroke="#27ae60" stroke-width="1"/>
  <text x="712" y="452" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">✅ Перемикач містить фіксацію «0» для безпечного реверсу</text>
</svg>
