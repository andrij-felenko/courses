<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Main Titles -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Еволюція комутації: Від відкритого рубильника до пакетного вимикача</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Локалізація та безпечне гасіння дуги в набірній ізоляційній камері пакета</text>

  <!-- LEFT PANEL: Open Knife Switch (Problem) -->
  <g id="panel-left-knife-switch">
    <rect x="30" y="75" width="400" height="420" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="230" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">Відкритий ножовий рубильник</text>
    <text x="230" y="116" text-anchor="middle" font-size="12" fill="#6b7280">(Відкрита дуга та вільний повітряний зазор)</text>

    <!-- Left Callout 1 -->
    <rect x="45" y="128" width="170" height="46" fill="white" stroke="#c0392b" rx="4"/>
    <text x="130" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Відкрита дуга в повітрі</text>
    <text x="130" y="164" text-anchor="middle" font-size="12" fill="#1a1a1a">Викид іонізованого газу</text>

    <!-- Left Callout 2 -->
    <rect x="230" y="128" width="185" height="46" fill="white" stroke="#c0392b" rx="4"/>
    <text x="322" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Повільне розмикання</text>
    <text x="322" y="164" text-anchor="middle" font-size="12" fill="#1a1a1a">Ерозія й знос контактів</text>

    <!-- Left Graphic Elements -->
    <!-- Base insulation plate -->
    <rect x="55" y="380" width="350" height="20" fill="#e5e7eb" stroke="#9ca3af" rx="2"/>
    <text x="230" y="395" text-anchor="middle" font-size="12" fill="#1a1a1a">Ізоляційна плита (відкрита основа)</text>

    <!-- Fixed contact jaw -->
    <rect x="85" y="270" width="50" height="110" fill="#f59e0b" stroke="#d97706" rx="2"/>
    <text x="110" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Губка</text>

    <!-- Hinge / Pivot -->
    <rect x="310" y="320" width="50" height="60" fill="#f59e0b" stroke="#d97706" rx="2"/>
    <text x="335" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Шарнір</text>

    <!-- Open Knife Blade -->
    <path d="M 320,330 L 160,220 L 170,208 L 330,318 Z" fill="#d97706" stroke="#b45309"/>
    <!-- Handle -->
    <text x="150" y="188" text-anchor="middle" font-size="12" fill="#6b7280">Рукоятка</text>
    <rect x="135" y="195" width="30" height="25" fill="#1f2937" rx="3"/>

    <!-- Arc Sparks & Fire -->
    <path d="M 110,270 Q 125,230 160,210" fill="none" stroke="#fef08a" stroke-width="12" opacity="0.6"/>
    <path d="M 110,270 Q 125,230 160,210" fill="none" stroke="#dc2626" stroke-width="4" stroke-dasharray="5,3"/>
    <text x="235" y="235" font-size="12" font-weight="bold" fill="#dc2626">Дуга і спалахи!</text>

    <!-- Left Bottom Banner -->
    <rect x="42" y="445" width="376" height="36" fill="white" stroke="#c0392b" rx="4"/>
    <text x="230" y="467" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">⚠️ Ризик ураження та відкритого іскріння</text>
  </g>

  <!-- MIDDLE EVOLUTION STEP -->
  <g id="middle-evolution">
    <line x1="432" y1="270" x2="438" y2="270" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
    <rect x="440" y="225" width="80" height="90" fill="#eaf0fd" stroke="#2457d6" rx="6"/>
    <text x="480" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">ЕВОЛЮЦІЯ</text>
    <text x="480" y="265" text-anchor="middle" font-size="12" fill="#1a1a1a">Локалізація</text>
    <text x="480" y="283" text-anchor="middle" font-size="12" fill="#1a1a1a">дуги в</text>
    <text x="480" y="301" text-anchor="middle" font-size="12" fill="#1a1a1a">пакеті</text>
    <line x1="522" y1="270" x2="528" y2="270" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  </g>

  <!-- RIGHT PANEL: Closed Packet Switch (Solution) -->
  <g id="panel-right-packet-switch">
    <rect x="530" y="75" width="400" height="420" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
    <text x="730" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Закритий пакетний вимикач</text>
    <text x="730" y="116" text-anchor="middle" font-size="12" fill="#6b7280">(Локалізоване гасіння в набірному пакеті)</text>

    <!-- Right Callout 1 -->
    <rect x="545" y="128" width="170" height="46" fill="white" stroke="#27ae60" rx="4"/>
    <text x="630" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Закрита камера</text>
    <text x="630" y="164" text-anchor="middle" font-size="12" fill="#1a1a1a">Швидке згасання дуги</text>

    <!-- Right Callout 2 -->
    <rect x="730" y="128" width="185" height="46" fill="white" stroke="#27ae60" rx="4"/>
    <text x="822" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Шарувата ізоляція</text>
    <text x="822" y="164" text-anchor="middle" font-size="12" fill="#1a1a1a">Набірні фіброві шайби</text>

    <!-- Right Graphic Elements (Packet Switch Section) -->
    <text x="730" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Кулачковий вал</text>

    <!-- Top shaft segment (above top disc) -->
    <rect x="723" y="190" width="14" height="15" fill="#4b5563" stroke="#1f2937" rx="1"/>

    <!-- Top Insulation Disc Layer -->
    <g id="top-disc-group">
      <rect x="590" y="205" width="280" height="30" fill="#d1fae5" stroke="#10b981" rx="4"/>
      <!-- Shaft segment nested inside top disc -->
      <rect x="723" y="205" width="14" height="30" fill="#4b5563" stroke="#1f2937"/>
      <text x="656" y="224" text-anchor="middle" font-size="12" fill="#065f46">Верхня ізоляція</text>
    </g>

    <!-- Shaft gap segment 1 -->
    <rect x="723" y="235" width="14" height="10" fill="#4b5563" stroke="#1f2937"/>

    <!-- Middle Switching Chamber Layer -->
    <g id="switching-chamber-group">
      <rect x="590" y="245" width="280" height="80" fill="white" stroke="#27ae60" stroke-width="2" rx="4"/>
      <!-- Shaft segment nested inside switching chamber -->
      <rect x="723" y="245" width="14" height="80" fill="#4b5563" stroke="#1f2937"/>

      <!-- Fixed Contacts -->
      <rect x="600" y="270" width="35" height="30" fill="#f59e0b" stroke="#d97706" rx="2"/>
      <rect x="825" y="270" width="35" height="30" fill="#f59e0b" stroke="#d97706" rx="2"/>

      <!-- Moving Cams / Bridge -->
      <rect x="690" y="278" width="28" height="14" fill="#10b981" rx="2"/>
      <text x="704" y="290" text-anchor="middle" font-size="12" fill="white" font-weight="bold">C1</text>
      <rect x="742" y="278" width="28" height="14" fill="#10b981" rx="2"/>
      <text x="756" y="290" text-anchor="middle" font-size="12" fill="white" font-weight="bold">C2</text>

      <!-- Quenching gaps -->
      <rect x="640" y="260" width="45" height="50" fill="#e9f7ef" stroke="#27ae60" stroke-dasharray="2,2" rx="3"/>
      <text x="662.5" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Малий</text>
      <text x="662.5" y="296" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">зазор</text>

      <rect x="775" y="260" width="45" height="50" fill="#e9f7ef" stroke="#27ae60" stroke-dasharray="2,2" rx="3"/>
      <text x="797.5" y="280" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Гасіння</text>
      <text x="797.5" y="296" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">дуги</text>
    </g>

    <!-- Shaft gap segment 2 -->
    <rect x="723" y="325" width="14" height="10" fill="#4b5563" stroke="#1f2937"/>

    <!-- Bottom Insulation Disc Layer -->
    <g id="bottom-disc-group">
      <rect x="590" y="335" width="280" height="30" fill="#d1fae5" stroke="#10b981" rx="4"/>
      <!-- Shaft segment nested inside bottom disc -->
      <rect x="723" y="335" width="14" height="30" fill="#4b5563" stroke="#1f2937"/>
      <text x="656" y="354" text-anchor="middle" font-size="12" fill="#065f46">Нижня ізоляція</text>
    </g>

    <!-- Bottom shaft segment (below bottom disc) -->
    <rect x="723" y="365" width="14" height="15" fill="#4b5563" stroke="#1f2937" rx="1"/>

    <!-- Tie Rods -->
    <line x1="575" y1="195" x2="575" y2="375" stroke="#6b7280" stroke-width="3" stroke-dasharray="4,2"/>
    <text x="575" y="395" text-anchor="middle" font-size="12" fill="#6b7280">Стяжка</text>

    <line x1="885" y1="195" x2="885" y2="375" stroke="#6b7280" stroke-width="3" stroke-dasharray="4,2"/>
    <text x="885" y="395" text-anchor="middle" font-size="12" fill="#6b7280">Стяжка</text>

    <!-- Right Bottom Banner -->
    <rect x="542" y="445" width="376" height="36" fill="white" stroke="#27ae60" rx="4"/>
    <text x="730" y="467" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">✅ Висока пожежобезпека та ізоляція дуги</text>
  </g>
</svg>
