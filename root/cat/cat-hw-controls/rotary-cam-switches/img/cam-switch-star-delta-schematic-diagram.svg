<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="520" fill="white"/>
  
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Header Section -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема та матрична діаграма комутації «Зірка-Трикутник» (Y-Δ)</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Багатопакетний кулачковий перемикач формує конфігурації Y та Δ для 3-фазного двигуна</text>

  <!-- Left Container: Schematic Diagram -->
  <rect x="30" y="85" width="440" height="370" rx="6" ry="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="30" y="85" width="440" height="35" rx="6" fill="#eaf0fd"/>
  <rect x="30" y="110" width="440" height="10" fill="#eaf0fd"/>
  <text x="250" y="107" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Принципова схема кіл двигуна (Y-Δ)</text>

  <!-- Mains Lines L1, L2, L3 -->
  <text x="90" y="130" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">L1</text>
  <text x="140" y="130" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">L2</text>
  <text x="190" y="130" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">L3</text>

  <!-- Main Contacts (1-2, 3-4, 5-6) -->
  <line x1="90" y1="135" x2="90" y2="155" stroke="#c0392b" stroke-width="2"/>
  <line x1="90" y1="155" x2="102" y2="170" stroke="#c0392b" stroke-width="2"/>
  <line x1="90" y1="175" x2="90" y2="210" stroke="#c0392b" stroke-width="2"/>
  <text x="108" y="168" font-size="10" fill="#6b7280">1-2</text>

  <line x1="140" y1="135" x2="140" y2="155" stroke="#2457d6" stroke-width="2"/>
  <line x1="140" y1="155" x2="152" y2="170" stroke="#2457d6" stroke-width="2"/>
  <line x1="140" y1="175" x2="140" y2="210" stroke="#2457d6" stroke-width="2"/>
  <text x="158" y="168" font-size="10" fill="#6b7280">3-4</text>

  <line x1="190" y1="135" x2="190" y2="155" stroke="#27ae60" stroke-width="2"/>
  <line x1="190" y1="155" x2="202" y2="170" stroke="#27ae60" stroke-width="2"/>
  <line x1="190" y1="175" x2="190" y2="210" stroke="#27ae60" stroke-width="2"/>
  <text x="208" y="168" font-size="10" fill="#6b7280">5-6</text>

  <!-- Motor Terminals U1, V1, W1 -->
  <text x="90" y="224" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">U1</text>
  <text x="140" y="224" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">V1</text>
  <text x="190" y="224" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">W1</text>

  <!-- Motor Body Symbol -->
  <circle cx="140" cy="275" r="32" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="140" y="272" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">M 3~</text>
  <text x="140" y="287" font-size="10" fill="#6b7280" text-anchor="middle">Двигун</text>

  <!-- Motor Output Terminals U2, V2, W2 -->
  <line x1="112" y1="295" x2="90" y2="335" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="140" y1="307" x2="140" y2="335" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="168" y1="295" x2="190" y2="335" stroke="#1a1a1a" stroke-width="1.5"/>

  <text x="90" y="348" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">U2</text>
  <text x="140" y="348" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">V2</text>
  <text x="190" y="348" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">W2</text>

  <!-- Star Bridge Badge (Y Position) -->
  <rect x="65" y="365" width="150" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="140" y="381" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Перемичка Y (7-8)</text>

  <!-- Delta Connections Detail Box -->
  <rect x="245" y="135" width="210" height="255" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="350" y="155" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Контакти Δ (Трикутник)</text>
  <text x="255" y="180" font-size="11" fill="#1a1a1a">• 9-10: U2 з'єднує з V1</text>
  <text x="255" y="202" font-size="11" fill="#1a1a1a">• 11-12: V2 з'єднує з W1</text>
  <text x="255" y="224" font-size="11" fill="#1a1a1a">• 13-14: W2 з'єднує з U1</text>

  <rect x="255" y="240" width="190" height="135" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="350" y="260" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Параметри режимів:</text>
  <text x="265" y="280" font-size="10" font-weight="bold" fill="#2457d6">Пуск Y (Зірка):</text>
  <text x="265" y="295" font-size="10" fill="#1a1a1a"> U_ph = 220В | I_st = 1/3 I_n</text>
  <text x="265" y="315" font-size="10" font-weight="bold" fill="#27ae60">Робота Δ (Трикутник):</text>
  <text x="265" y="330" font-size="10" fill="#1a1a1a"> U_ph = 380В | P = P_ном</text>
  <text x="265" y="350" font-size="10" fill="#6b7280">Переключення після розгону</text>

  <!-- Right Container: Contact Matrix Map -->
  <rect x="490" y="85" width="440" height="370" rx="6" ry="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="490" y="85" width="440" height="35" rx="6" fill="#eaf0fd"/>
  <rect x="490" y="110" width="440" height="10" fill="#eaf0fd"/>
  <text x="710" y="107" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Матрична карта комутації контактів</text>

  <!-- Matrix Table Header -->
  <rect x="505" y="135" width="140" height="35" fill="#eaf0fd" stroke="#d0d7de"/>
  <text x="575" y="157" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Контакт / Ланцюг</text>

  <rect x="645" y="135" width="90" height="35" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="690" y="157" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="middle">0 (Вимк)</text>

  <rect x="735" y="135" width="90" height="35" fill="#eaf0fd" stroke="#d0d7de"/>
  <text x="780" y="157" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Y (Зірка)</text>

  <rect x="825" y="135" width="90" height="35" fill="#e9f7ef" stroke="#d0d7de"/>
  <text x="870" y="157" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Δ (Трикутник)</text>

  <!-- Row 1: 1-2 (L1) -->
  <rect x="505" y="170" width="140" height="37" fill="#ffffff" stroke="#d0d7de"/>
  <text x="515" y="193" font-size="11" font-weight="bold" fill="#1a1a1a">1-2 (Мережа L1)</text>
  <rect x="645" y="170" width="90" height="37" fill="#ffffff" stroke="#d0d7de"/>
  <text x="690" y="193" font-size="14" fill="#6b7280" text-anchor="middle">—</text>
  <rect x="735" y="170" width="90" height="37" fill="#eaf0fd" stroke="#d0d7de"/>
  <text x="780" y="193" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">X</text>
  <rect x="825" y="170" width="90" height="37" fill="#e9f7ef" stroke="#d0d7de"/>
  <text x="870" y="193" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">X</text>

  <!-- Row 2: 3-4 (L2) -->
  <rect x="505" y="207" width="140" height="37" fill="#ffffff" stroke="#d0d7de"/>
  <text x="515" y="230" font-size="11" font-weight="bold" fill="#1a1a1a">3-4 (Мережа L2)</text>
  <rect x="645" y="207" width="90" height="37" fill="#ffffff" stroke="#d0d7de"/>
  <text x="690" y="230" font-size="14" fill="#6b7280" text-anchor="middle">—</text>
  <rect x="735" y="207" width="90" height="37" fill="#eaf0fd" stroke="#d0d7de"/>
  <text x="780" y="230" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">X</text>
  <rect x="825" y="207" width="90" height="37" fill="#e9f7ef" stroke="#d0d7de"/>
  <text x="870" y="230" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">X</text>

  <!-- Row 3: 5-6 (L3) -->
  <rect x="505" y="244" width="140" height="37" fill="#ffffff" stroke="#d0d7de"/>
  <text x="515" y="267" font-size="11" font-weight="bold" fill="#1a1a1a">5-6 (Мережа L3)</text>
  <rect x="645" y="244" width="90" height="37" fill="#ffffff" stroke="#d0d7de"/>
  <text x="690" y="267" font-size="14" fill="#6b7280" text-anchor="middle">—</text>
  <rect x="735" y="244" width="90" height="37" fill="#eaf0fd" stroke="#d0d7de"/>
  <text x="780" y="267" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">X</text>
  <rect x="825" y="244" width="90" height="37" fill="#e9f7ef" stroke="#d0d7de"/>
  <text x="870" y="267" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">X</text>

  <!-- Row 4: 7-8 (Star Bridge) -->
  <rect x="505" y="281" width="140" height="37" fill="#ffffff" stroke="#d0d7de"/>
  <text x="515" y="304" font-size="11" font-weight="bold" fill="#2457d6">7-8 (Міст Y)</text>
  <rect x="645" y="281" width="90" height="37" fill="#ffffff" stroke="#d0d7de"/>
  <text x="690" y="304" font-size="14" fill="#6b7280" text-anchor="middle">—</text>
  <rect x="735" y="281" width="90" height="37" fill="#eaf0fd" stroke="#d0d7de"/>
  <text x="780" y="304" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">X</text>
  <rect x="825" y="281" width="90" height="37" fill="#ffffff" stroke="#d0d7de"/>
  <text x="870" y="304" font-size="14" fill="#6b7280" text-anchor="middle">—</text>

  <!-- Row 5: 9-10 (Delta U2-V1) -->
  <rect x="505" y="318" width="140" height="37" fill="#ffffff" stroke="#d0d7de"/>
  <text x="515" y="341" font-size="11" font-weight="bold" fill="#27ae60">9-10 (Δ: U2-V1)</text>
  <rect x="645" y="318" width="90" height="37" fill="#ffffff" stroke="#d0d7de"/>
  <text x="690" y="341" font-size="14" fill="#6b7280" text-anchor="middle">—</text>
  <rect x="735" y="318" width="90" height="37" fill="#ffffff" stroke="#d0d7de"/>
  <text x="780" y="341" font-size="14" fill="#6b7280" text-anchor="middle">—</text>
  <rect x="825" y="318" width="90" height="37" fill="#e9f7ef" stroke="#d0d7de"/>
  <text x="870" y="341" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">X</text>

  <!-- Row 6: 11-12 (Delta V2-W1) -->
  <rect x="505" y="355" width="140" height="37" fill="#ffffff" stroke="#d0d7de"/>
  <text x="515" y="378" font-size="11" font-weight="bold" fill="#27ae60">11-12 (Δ: V2-W1)</text>
  <rect x="645" y="355" width="90" height="37" fill="#ffffff" stroke="#d0d7de"/>
  <text x="690" y="378" font-size="14" fill="#6b7280" text-anchor="middle">—</text>
  <rect x="735" y="355" width="90" height="37" fill="#ffffff" stroke="#d0d7de"/>
  <text x="780" y="378" font-size="14" fill="#6b7280" text-anchor="middle">—</text>
  <rect x="825" y="355" width="90" height="37" fill="#e9f7ef" stroke="#d0d7de"/>
  <text x="870" y="378" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">X</text>

  <!-- Row 7: 13-14 (Delta W2-U1) -->
  <rect x="505" y="392" width="140" height="37" fill="#ffffff" stroke="#d0d7de"/>
  <text x="515" y="415" font-size="11" font-weight="bold" fill="#27ae60">13-14 (Δ: W2-U1)</text>
  <rect x="645" y="392" width="90" height="37" fill="#ffffff" stroke="#d0d7de"/>
  <text x="690" y="415" font-size="14" fill="#6b7280" text-anchor="middle">—</text>
  <rect x="735" y="392" width="90" height="37" fill="#ffffff" stroke="#d0d7de"/>
  <text x="780" y="415" font-size="14" fill="#6b7280" text-anchor="middle">—</text>
  <rect x="825" y="392" width="90" height="37" fill="#e9f7ef" stroke="#d0d7de"/>
  <text x="870" y="415" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">X</text>

  <!-- Bottom Legend Panel -->
  <rect x="30" y="470" width="900" height="36" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="170" y="493" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">■ Положення 0: Вимкнено</text>
  <text x="480" y="493" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">■ Положення Y: Пуск (Зірка)</text>
  <text x="790" y="493" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">■ Положення Δ: Робота (Трикутник)</text>
</svg>
