<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Внутрішній механічний устрій кулачкового перемикача</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Поворотний вал із профільованими кулачками примусово розмикає підпружинені контактні містки</text>

  <!-- Left Container Panel -->
  <rect x="40" y="75" width="440" height="455" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="40" y="75" width="440" height="33" rx="8" fill="#eaf0fd"/>
  <text x="260" y="96" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Контактна секція з фасонним кулачком</text>

  <!-- Contact Chamber Outer Housing -->
  <rect x="130" y="125" width="260" height="245" rx="16" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>

  <!-- Fixed Terminals -->
  <!-- Left Terminal L1 -->
  <rect x="70" y="210" width="70" height="20" rx="3" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="100" y="224" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">L1</text>
  <circle cx="140" cy="220" r="6" fill="#2457d6"/>

  <!-- Right Terminal U1 -->
  <rect x="380" y="210" width="70" height="20" rx="3" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="410" y="224" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">U1</text>
  <circle cx="380" cy="220" r="6" fill="#2457d6"/>

  <!-- Moving Contact Bridge Bar -->
  <rect x="135" y="194" width="250" height="10" rx="3" fill="#27ae60"/>
  <circle cx="140" cy="199" r="5" fill="#27ae60"/>
  <circle cx="380" cy="199" r="5" fill="#27ae60"/>

  <!-- Return Springs (Left & Right) -->
  <path d="M 160,135 L 160,194" stroke="#6b7280" stroke-width="3" stroke-dasharray="5 3"/>
  <path d="M 360,135 L 360,194" stroke="#6b7280" stroke-width="3" stroke-dasharray="5 3"/>

  <!-- Center Cam Follower (Pusher) -->
  <rect x="245" y="204" width="30" height="22" rx="4" fill="#6b7280"/>

  <!-- Profiled Cam Disc -->
  <path d="M 260,230 C 295,230 305,255 295,285 C 285,310 235,310 225,285 C 215,255 225,230 260,230 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Square Central Shaft -->
  <rect x="252" y="262" width="16" height="16" fill="#1a1a1a"/>

  <!-- Left Panel Note Card -->
  <rect x="60" y="390" width="400" height="125" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="260" y="412" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принцип дії кулачкової групи:</text>
  <text x="80" y="434" font-size="12" fill="#1a1a1a">1. Виступ кулачка піднімає штовхач → розмикання</text>
  <text x="80" y="456" font-size="12" fill="#1a1a1a">2. Впадина кулачка звільняє пружину → замикання</text>
  <text x="80" y="478" font-size="12" font-weight="bold" fill="#2457d6">3. Пряме розмикання (Positive Opening Operation)</text>
  <text x="80" y="500" font-size="12" fill="#6b7280">Гарантує розрив контактів при зварюванні від дуги</text>

  <!-- Right Container Panel -->
  <rect x="500" y="75" width="420" height="455" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="500" y="75" width="420" height="33" rx="8" fill="#eaf0fd"/>
  <text x="710" y="96" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Механізм фіксації позицій (Detent Wheel)</text>

  <!-- Spring Housing for Detent Mechanism -->
  <rect x="690" y="115" width="40" height="25" fill="#d0d7de" stroke="#6b7280" stroke-width="1.5"/>
  <!-- Heavy Detent Spring -->
  <path d="M 710,125 L 710,165" stroke="#6b7280" stroke-width="4" stroke-dasharray="6 3"/>
  <!-- Detent Roller / Ball -->
  <circle cx="710" cy="177" r="12" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Star Wheel / Detent Cam Disc -->
  <path d="M 710,190 C 735,190 745,210 765,210 C 785,210 790,235 790,250 C 790,265 775,285 760,295 C 740,305 710,310 690,300 C 670,290 640,270 640,250 C 640,230 660,210 680,200 C 695,195 700,190 710,190 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Square Central Shaft -->
  <rect x="702" y="242" width="16" height="16" fill="#1a1a1a"/>

  <!-- Star Wheel Position Markers -->
  <text x="710" y="332" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Позиція 1 (0°)</text>
  <text x="830" y="235" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Поз. 2 (90°)</text>

  <!-- Right Panel Note Card -->
  <rect x="515" y="365" width="390" height="150" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="710" y="386" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Призначення та характеристики фіксатора:</text>
  <text x="530" y="410" font-size="12" fill="#1a1a1a">• Чітка кутова фіксація (кути кроку 30°, 45°, 60°, 90°)</text>
  <text x="530" y="432" font-size="12" fill="#1a1a1a">• Високий тактильний момент (захист від зсуву)</text>
  <text x="530" y="454" font-size="12" font-weight="bold" fill="#2457d6">• BBM (Break-Before-Make): розмикання перед замиканням</text>
  <text x="530" y="476" font-size="12" font-weight="bold" fill="#2457d6">• MBB (Make-Before-Break): замикання без розриву струму</text>
  <text x="530" y="498" font-size="12" fill="#6b7280">• Механічний ресурс: до 1 000 000 циклів комутації</text>
</svg>
