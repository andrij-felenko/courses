<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Header Section -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кінематика кулачкового вала та механізму Quick-Break</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Пружинний детантор накопичує зусилля оператора та миттєво розмикає контакти незалежно від швидкості повороту</text>

  <!-- Left Container: Stage 1 - Energy Accumulation -->
  <g id="stage-1">
    <rect x="30" y="85" width="440" height="330" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="250" y="108" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Поворот вала: Накопичення енергії</text>
    <line x1="30" y1="120" x2="470" y2="120" stroke="#d0d7de" stroke-width="1"/>

    <!-- Cam Profile & Hub (Stage 1) -->
    <path d="M 150,210 C 185,210 205,225 195,255 C 185,285 150,290 120,275 C 105,260 115,230 130,215 Z" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
    <circle cx="150" cy="255" r="20" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
    <circle cx="150" cy="255" r="6" fill="#2457d6"/>

    <!-- Rotation Direction Arrow -->
    <path d="M 115,225 A 35,35 0 0,1 165,215" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
    <text x="135" y="198" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Поворот ω</text>

    <!-- Follower Arm & Roller (Stage 1) -->
    <line x1="188" y1="225" x2="250" y2="160" stroke="#1a1a1a" stroke-width="3"/>
    <circle cx="188" cy="225" r="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="250" cy="160" r="4" fill="#1a1a1a"/>

    <!-- Compressed Spring (Stage 1) -->
    <path d="M 250,160 L 260,152 L 270,168 L 280,152 L 290,168 L 300,152 L 310,168 L 320,160" stroke="#c0392b" stroke-width="2" fill="none"/>
    <line x1="320" y1="145" x2="320" y2="175" stroke="#1a1a1a" stroke-width="3"/>

    <!-- Spring Force Arrow -->
    <line x1="235" y1="142" x2="275" y2="142" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
    <text x="255" y="132" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Стискання F_прудж</text>

    <!-- Closed Electrical Contacts (Stage 1) -->
    <text x="375" y="222" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Контакти ЗАМКНЕНІ</text>
    <rect x="360" y="235" width="30" height="10" rx="2" fill="#27ae60"/>
    <rect x="360" y="275" width="30" height="10" rx="2" fill="#27ae60"/>
    <line x1="375" y1="235" x2="375" y2="275" stroke="#27ae60" stroke-width="4"/>
    <line x1="250" y1="160" x2="375" y2="235" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Stage 1 Status Badge -->
    <rect x="45" y="355" width="410" height="35" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
    <text x="250" y="377" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Повільне заведення пружини оператором (підготовка)</text>
  </g>

  <!-- Right Container: Stage 2 - Quick-Break Snap -->
  <g id="stage-2">
    <rect x="490" y="85" width="440" height="330" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="710" y="108" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">2. Перехід вершини: Миттєвий розрив (Quick-Break)</text>
    <line x1="490" y1="120" x2="930" y2="120" stroke="#d0d7de" stroke-width="1"/>

    <!-- Cam Profile & Hub Rotated (Stage 2) -->
    <path d="M 610,210 C 640,225 650,250 635,275 C 610,290 575,285 565,260 C 560,235 580,210 610,210 Z" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
    <circle cx="610" cy="255" r="20" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
    <circle cx="610" cy="255" r="6" fill="#2457d6"/>

    <!-- Follower Arm & Roller Released (Stage 2) -->
    <line x1="625" y1="230" x2="710" y2="190" stroke="#1a1a1a" stroke-width="3"/>
    <circle cx="625" cy="230" r="9" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
    <circle cx="710" cy="190" r="4" fill="#1a1a1a"/>

    <!-- Snap Motion Arrow & Label -->
    <line x1="645" y1="212" x2="675" y2="227" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
    <text x="645" y="248" font-size="11" font-weight="bold" fill="#27ae60">Зрив Quick-Break</text>

    <!-- Expanded Released Spring (Stage 2) -->
    <path d="M 710,190 L 725,182 L 740,198 L 755,182 L 770,198 L 785,182 L 800,198 L 815,190" stroke="#27ae60" stroke-width="2" fill="none"/>
    <line x1="815" y1="175" x2="815" y2="205" stroke="#1a1a1a" stroke-width="3"/>

    <!-- Open Electrical Contacts (Stage 2) -->
    <text x="835" y="165" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Контакти РОЗМКНЕНІ</text>
    <rect x="820" y="235" width="30" height="10" rx="2" fill="#2457d6"/>
    <rect x="820" y="290" width="30" height="10" rx="2" fill="#2457d6"/>
    <line x1="835" y1="195" x2="835" y2="225" stroke="#c0392b" stroke-width="4"/>
    <line x1="710" y1="190" x2="835" y2="195" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Air Gap Dimension -->
    <line x1="875" y1="235" x2="875" y2="290" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="870" y1="235" x2="880" y2="235" stroke="#c0392b" stroke-width="1.5"/>
    <line x1="870" y1="290" x2="880" y2="290" stroke="#c0392b" stroke-width="1.5"/>
    <text x="890" y="267" font-size="11" font-weight="bold" fill="#c0392b">Зазор d</text>

    <!-- Stage 2 Status Badge -->
    <rect x="505" y="355" width="410" height="35" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
    <text x="710" y="377" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Миттєве розмикання (t &lt; 5 мс) — швидкість розриву не залежить від руки</text>
  </g>

  <!-- Bottom Legend Panel -->
  <rect x="30" y="430" width="900" height="36" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="170" y="453" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">■ Кулачковий вал з фасонним профілем</text>
  <text x="480" y="453" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">■ Накопичувальна пружина Quick-Break</text>
  <text x="790" y="453" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">■ Дугогасний контактний зазор</text>
</svg>
