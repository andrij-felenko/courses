<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема кулачкового перемикання «Зірка-Трикутник» (Y-Δ) трьохфазного двигуна</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Багатопакетний кулачковий перемикач формує нульову точку Y у пуску та повнофазний Δ у роботі</text>

  <!-- Left Container Panel -->
  <rect x="40" y="75" width="450" height="455" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="40" y="75" width="450" height="33" rx="8" fill="#eaf0fd"/>
  <text x="265" y="96" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Електрична схема та пакети контактів (Y-Δ)</text>

  <!-- Supply Lines L1, L2, L3 -->
  <line x1="60" y1="145" x2="180" y2="145" stroke="#2457d6" stroke-width="2"/>
  <line x1="60" y1="175" x2="180" y2="175" stroke="#2457d6" stroke-width="2"/>
  <line x1="60" y1="205" x2="180" y2="205" stroke="#2457d6" stroke-width="2"/>

  <text x="75" y="140" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">L1</text>
  <text x="75" y="170" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">L2</text>
  <text x="75" y="200" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">L3</text>

  <!-- Central Cam Switch Package Box -->
  <rect x="180" y="115" width="160" height="225" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="260" y="135" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Кулачковий пакет</text>

  <!-- Contact Blocks inside Box -->
  <rect x="195" y="148" width="130" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="260" y="163" font-size="12" fill="#1a1a1a" text-anchor="middle">K1-K3 (1..6) Мережа</text>

  <rect x="195" y="188" width="130" height="22" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="260" y="203" font-size="12" fill="#1a1a1a" text-anchor="middle">K4 (7-8) Міст Y</text>

  <rect x="195" y="228" width="130" height="22" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="260" y="243" font-size="12" fill="#1a1a1a" text-anchor="middle">K5 (9-10) Міст Δ</text>

  <rect x="195" y="268" width="130" height="22" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="260" y="283" font-size="12" fill="#1a1a1a" text-anchor="middle">K6 (11-12) Міст Δ</text>

  <!-- Lines to Motor -->
  <line x1="340" y1="160" x2="370" y2="160" stroke="#2457d6" stroke-width="2"/>
  <line x1="340" y1="200" x2="370" y2="200" stroke="#27ae60" stroke-width="2"/>
  <line x1="340" y1="250" x2="370" y2="250" stroke="#c0392b" stroke-width="2"/>

  <!-- 3-Phase Motor Representation -->
  <circle cx="410" cy="220" r="40" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="410" y="225" font-size="16" font-weight="bold" fill="#2457d6" text-anchor="middle">M 3~</text>

  <!-- Left Panel Note Box -->
  <rect x="60" y="360" width="410" height="155" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="265" y="380" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Режими комутації пакетного перемикача:</text>

  <text x="75" y="402" font-size="12" font-weight="bold" fill="#6b7280">1. Позиція 0 (ВИМК):</text>
  <text x="75" y="420" font-size="12" fill="#1a1a1a">Усі пакети контактів розімкнені, живлення відсутнє</text>

  <text x="75" y="442" font-size="12" font-weight="bold" fill="#2457d6">2. Позиція Y (Пуск):</text>
  <text x="75" y="460" font-size="12" fill="#1a1a1a">Замкнені K1-K3 та K4 (точка Y). Пусковий струм знижено в 3 р.</text>

  <text x="75" y="482" font-size="12" font-weight="bold" fill="#27ae60">3. Позиція Δ (Робота):</text>
  <text x="75" y="500" font-size="12" fill="#1a1a1a">K4 розімкнено, замкнені K5-K6 (повна лінійна напруга 380 В)</text>

  <!-- Right Container Panel -->
  <rect x="510" y="75" width="410" height="455" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="510" y="75" width="410" height="33" rx="8" fill="#eaf0fd"/>
  <text x="715" y="96" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Діаграма замкненості контактів (Switching Table)</text>

  <!-- Table Header -->
  <rect x="525" y="120" width="380" height="26" fill="#2457d6" rx="4"/>
  <text x="585" y="137" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Контакт / Пакет</text>
  <text x="675" y="137" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">0 (Off)</text>
  <text x="757" y="137" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Y (Зірка)</text>
  <text x="852" y="137" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Δ (Трикутник)</text>

  <!-- Table Data Rows -->
  <!-- Row 1: K1-K3 (Мережа) -->
  <rect x="525" y="148" width="380" height="38" fill="#ffffff"/>
  <text x="585" y="171" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">K1-K3 (1..6) Мережа</text>
  <text x="675" y="171" font-size="12" fill="#6b7280" text-anchor="middle">—</text>
  <text x="757" y="171" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">X</text>
  <text x="852" y="171" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">X</text>

  <!-- Row 2: K4 (Y міст) -->
  <rect x="525" y="188" width="380" height="38" fill="#e9f7ef"/>
  <text x="585" y="211" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">K4 (7-8) Міст Y</text>
  <text x="675" y="211" font-size="12" fill="#6b7280" text-anchor="middle">—</text>
  <text x="757" y="211" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">X</text>
  <text x="852" y="211" font-size="12" fill="#6b7280" text-anchor="middle">—</text>

  <!-- Row 3: K5 (Δ міст 1) -->
  <rect x="525" y="228" width="380" height="38" fill="#ffffff"/>
  <text x="585" y="251" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">K5 (9-10) Міст Δ</text>
  <text x="675" y="251" font-size="12" fill="#6b7280" text-anchor="middle">—</text>
  <text x="757" y="251" font-size="12" fill="#6b7280" text-anchor="middle">—</text>
  <text x="852" y="251" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">X</text>

  <!-- Row 4: K6 (Δ міст 2) -->
  <rect x="525" y="268" width="380" height="38" fill="#fdecea"/>
  <text x="585" y="291" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">K6 (11-12) Міст Δ</text>
  <text x="675" y="291" font-size="12" fill="#6b7280" text-anchor="middle">—</text>
  <text x="757" y="291" font-size="12" fill="#6b7280" text-anchor="middle">—</text>
  <text x="852" y="291" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">X</text>

  <!-- Right Panel Note Box -->
  <rect x="525" y="360" width="380" height="155" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="715" y="380" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схемотехнічні правила та захист:</text>

  <text x="540" y="404" font-size="12" font-weight="bold" fill="#2457d6">• BBM (Break-Before-Make):</text>
  <text x="540" y="422" font-size="12" fill="#1a1a1a">Розмикання Y-містка перед замиканням Δ (без КЗ)</text>

  <text x="540" y="446" font-size="12" font-weight="bold" fill="#c0392b">• Захист від міжфазного КЗ:</text>
  <text x="540" y="464" font-size="12" fill="#1a1a1a">Блокування вала унеможливлює одночасне включення Y та Δ</text>

  <text x="540" y="488" font-size="12" font-weight="bold" fill="#27ae60">• Категорія застосування AC-3 / AC-4:</text>
  <text x="540" y="506" font-size="12" fill="#6b7280">Розраховано на пускові струми індуктивного навантаження</text>
</svg>
