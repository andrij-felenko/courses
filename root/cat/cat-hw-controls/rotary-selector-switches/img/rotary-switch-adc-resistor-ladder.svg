<svg viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <!-- Маркери стрілок -->
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="35" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Схема підключення галетного перемикача 1P12T до АЦП</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Резистивна драбина формує ступені напруги, а лінія підтяжки запобігає плаванню сигналу в BBM-паузах</text>

  <!-- Блок 1: Дільник напруги (Резистивна драбина) -->
  <rect x="30" y="80" width="220" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="140" y="102" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Резистивна драбина</text>
  <text x="140" y="118" font-size="11" fill="#6b7280" text-anchor="middle">11 × R (1 кОм), VCC = 3.3 В</text>

  <!-- Вертикальна лінія дільника -->
  <line x1="140" y1="135" x2="140" y2="435" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Живлення VCC вгорі дільника -->
  <circle cx="140" cy="135" r="4" fill="#2457d6"/>
  <text x="140" y="130" font-size="11" font-weight="700" fill="#2457d6" text-anchor="middle">VCC (3.3 В)</text>

  <!-- Земля GND внизу дільника -->
  <line x1="140" y1="435" x2="140" y2="443" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="130" y1="443" x2="150" y2="443" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="133" y1="447" x2="147" y2="447" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="137" y1="451" x2="143" y2="451" stroke="#1a1a1a" stroke-width="1"/>
  <text x="158" y="450" font-size="11" fill="#6b7280">GND (0 В)</text>

  <!-- Резистори дільника (схематичні позначки) -->
  <rect x="134" y="145" width="12" height="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="125" y="158" font-size="10" fill="#6b7280" text-anchor="end">R11</text>
  <rect x="134" y="172" width="12" height="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="125" y="185" font-size="10" fill="#6b7280" text-anchor="end">R10</text>
  <rect x="134" y="199" width="12" height="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="125" y="212" font-size="10" fill="#6b7280" text-anchor="end">R9</text>
  <rect x="134" y="226" width="12" height="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="125" y="239" font-size="10" fill="#6b7280" text-anchor="end">R8</text>
  <rect x="134" y="253" width="12" height="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="125" y="266" font-size="10" fill="#6b7280" text-anchor="end">R7</text>
  <rect x="134" y="280" width="12" height="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="125" y="293" font-size="10" fill="#6b7280" text-anchor="end">R6</text>
  <rect x="134" y="307" width="12" height="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="125" y="320" font-size="10" fill="#6b7280" text-anchor="end">R5</text>
  <rect x="134" y="334" width="12" height="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="125" y="347" font-size="10" fill="#6b7280" text-anchor="end">R4</text>
  <rect x="134" y="361" width="12" height="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="125" y="374" font-size="10" fill="#6b7280" text-anchor="end">R3</text>
  <rect x="134" y="388" width="12" height="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="125" y="401" font-size="10" fill="#6b7280" text-anchor="end">R2</text>
  <rect x="134" y="415" width="12" height="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="125" y="428" font-size="10" fill="#6b7280" text-anchor="end">R1</text>

  <!-- Відводи напруги до контактів перемикача -->
  <line x1="140" y1="135" x2="310" y2="135" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="140" y1="165" x2="310" y2="162" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="140" y1="192" x2="310" y2="189" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="140" y1="219" x2="310" y2="216" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="140" y1="246" x2="310" y2="243" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="140" y1="273" x2="310" y2="270" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="140" y1="300" x2="310" y2="297" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="140" y1="327" x2="310" y2="324" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="140" y1="354" x2="310" y2="351" stroke="#2457d6" stroke-width="2"/>
  <line x1="140" y1="381" x2="310" y2="378" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="140" y1="408" x2="310" y2="405" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="140" y1="435" x2="310" y2="432" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Значення напруг біля відводів -->
  <text x="150" y="147" font-size="10" fill="#1a1a1a">3.30В</text>
  <text x="150" y="347" font-size="10" font-weight="700" fill="#2457d6">0.90В (P4)</text>
  <text x="150" y="444" font-size="10" fill="#1a1a1a">0.00В</text>

  <!-- Блок 2: Галетний перемикач 1P12T -->
  <rect x="270" y="80" width="220" height="380" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="380" y="102" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Перемикач 1P12T</text>
  <text x="380" y="118" font-size="11" fill="#6b7280" text-anchor="middle">12 статичних контактів</text>

  <!-- Статичні контакти (P1..P12) -->
  <circle cx="310" cy="135" r="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="295" y="130" font-size="11" fill="#6b7280" text-anchor="end">P12</text>

  <circle cx="310" cy="162" r="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="295" y="157" font-size="11" fill="#6b7280" text-anchor="end">P11</text>

  <circle cx="310" cy="189" r="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="295" y="184" font-size="11" fill="#6b7280" text-anchor="end">P10</text>

  <circle cx="310" cy="216" r="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="295" y="211" font-size="11" fill="#6b7280" text-anchor="end">P9</text>

  <circle cx="310" cy="243" r="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="295" y="238" font-size="11" fill="#6b7280" text-anchor="end">P8</text>

  <circle cx="310" cy="270" r="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="295" y="265" font-size="11" fill="#6b7280" text-anchor="end">P7</text>

  <circle cx="310" cy="297" r="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="295" y="292" font-size="11" fill="#6b7280" text-anchor="end">P6</text>

  <circle cx="310" cy="324" r="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="295" y="319" font-size="11" fill="#6b7280" text-anchor="end">P5</text>

  <circle cx="310" cy="351" r="5" fill="#2457d6"/>
  <text x="295" y="344" font-size="11" font-weight="700" fill="#2457d6" text-anchor="end">P4</text>

  <circle cx="310" cy="378" r="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="295" y="373" font-size="11" fill="#6b7280" text-anchor="end">P3</text>

  <circle cx="310" cy="405" r="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="295" y="400" font-size="11" fill="#6b7280" text-anchor="end">P2</text>

  <circle cx="310" cy="432" r="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="295" y="427" font-size="11" fill="#6b7280" text-anchor="end">P1</text>

  <!-- Рухомий контакт (Вайпер / Полюсар C) -->
  <circle cx="430" cy="283" r="6" fill="#2457d6"/>
  <text x="445" y="278" font-size="12" font-weight="700" fill="#2457d6">C (Полюс)</text>
  <line x1="430" y1="283" x2="314" y2="351" stroke="#2457d6" stroke-width="3"/>

  <!-- Стрілка обертання ручки -->
  <path d="M 370 310 A 55 55 0 0 1 370 370" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-blue)"/>
  <text x="380" y="398" font-size="11" fill="#2457d6">BBM розрив</text>

  <!-- Блок 3: Схема підтяжки та фільтрації -->
  <line x1="430" y1="283" x2="520" y2="283" stroke="#2457d6" stroke-width="2"/>
  <circle cx="520" cy="283" r="4" fill="#1a1a1a"/>

  <!-- Лінія підтяжки R_pu вгору -->
  <line x1="520" y1="283" x2="520" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="512" y="180" width="16" height="30" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="535" y="193" font-size="11" font-weight="700" fill="#1a1a1a">R_pu</text>
  <text x="535" y="207" font-size="10" fill="#6b7280">100 кОм</text>

  <!-- Живлення підтяжки VCC (3.3В) -->
  <circle cx="520" cy="160" r="4" fill="#2457d6"/>
  <text x="520" y="148" font-size="11" font-weight="700" fill="#2457d6" text-anchor="middle">VCC (3.3 В)</text>
  <text x="520" y="134" font-size="10" fill="#6b7280" text-anchor="middle">Підтяжка BBM</text>

  <!-- Фільтруючий конденсатор C_flt до землі внизу -->
  <line x1="520" y1="283" x2="520" y2="390" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="510" y1="345" x2="530" y2="345" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="510" y1="351" x2="530" y2="351" stroke="#1a1a1a" stroke-width="2"/>
  <text x="535" y="344" font-size="11" font-weight="700" fill="#1a1a1a">C_flt</text>
  <text x="535" y="358" font-size="10" fill="#6b7280">100 нФ</text>

  <!-- Земля конденсатора -->
  <line x1="520" y1="390" x2="520" y2="398" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="510" y1="398" x2="530" y2="398" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="513" y1="402" x2="527" y2="402" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="517" y1="406" x2="523" y2="406" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Сигнальна лінія до мікроконтролера -->
  <line x1="520" y1="283" x2="670" y2="283" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="595" y="275" font-size="11" font-weight="700" fill="#2457d6" text-anchor="middle">V_sig (0.90 В)</text>

  <!-- Блок 4: Мікроконтролер (MCU) -->
  <rect x="670" y="80" width="260" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="800" y="105" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">Мікроконтролер (MCU)</text>
  <text x="800" y="122" font-size="11" fill="#6b7280" text-anchor="middle">Обробка сигналу галетника</text>

  <!-- Вхідний пін ADC_IN -->
  <circle cx="670" cy="283" r="5" fill="#2457d6"/>
  <text x="680" y="275" font-size="12" font-weight="700" fill="#2457d6">ADC_IN (GPIO)</text>

  <!-- Внутрішній блок АЦП -->
  <rect x="695" y="150" width="210" height="75" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="800" y="172" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">АЦП Модуль (12-bit)</text>
  <text x="800" y="191" font-size="11" fill="#1a1a1a" text-anchor="middle">N_adc = (V_sig / 3.3В) × 4095</text>
  <text x="800" y="209" font-size="11" font-weight="700" fill="#2457d6" text-anchor="middle">При P4: N_adc ≈ 1117</text>

  <!-- Стрілка передачі даних з АЦП до Драйвера -->
  <line x1="800" y1="225" x2="800" y2="245" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- Програмний Драйвер C/C++ -->
  <rect x="695" y="245" width="210" height="195" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="800" y="267" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Програмний Драйвер C/C++</text>

  <!-- Кроки драйвера -->
  <rect x="705" y="280" width="190" height="36" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="715" y="295" font-size="11" font-weight="700" fill="#27ae60">1. Придушення брязкоту</text>
  <text x="715" y="310" font-size="10" fill="#1a1a1a">Цифровий ФНЧ (10–20 мс)</text>

  <rect x="705" y="324" width="190" height="36" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="715" y="339" font-size="11" font-weight="700" fill="#c0392b">2. Фільтрація BBM-сплесків</text>
  <text x="715" y="354" font-size="10" fill="#1a1a1a">Ігнорування VCC під час розриву</text>

  <rect x="705" y="368" width="190" height="60" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="715" y="383" font-size="11" font-weight="700" fill="#1a1a1a">3. Декодування з гістерезисом</text>
  <text x="715" y="398" font-size="10" fill="#6b7280">Вікно P4: [1000 .. 1235]</text>
  <text x="715" y="418" font-size="11" font-weight="700" fill="#2457d6">Вихід: Pos = 4 (Позиція 4)</text>

  <!-- Пояснювальні картки внизу -->
  <rect x="30" y="475" width="280" height="65" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="42" y="494" font-size="12" font-weight="700" fill="#1a1a1a">Принцип резистивної драбини</text>
  <text x="42" y="511" font-size="11" fill="#6b7280">11 однакових резисторів ділять 3.3 В</text>
  <text x="42" y="527" font-size="11" fill="#6b7280">на 12 рівнів з кроком ΔV = 0.30 В</text>

  <rect x="330" y="475" width="300" height="65" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="342" y="494" font-size="12" font-weight="700" fill="#2457d6">Роль підтяжки R_pu та C_flt</text>
  <text x="342" y="511" font-size="11" fill="#1a1a1a">R_pu (100 кОм) фіксує VCC у паузі BBM</text>
  <text x="342" y="527" font-size="11" fill="#6b7280">C_flt (100 нФ) поглинає імпульсні завади</text>

  <rect x="650" y="475" width="280" height="65" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="662" y="494" font-size="12" font-weight="700" fill="#27ae60">Надійність декодування</text>
  <text x="662" y="511" font-size="11" fill="#1a1a1a">Гістерезис запобігає мигтінню станів</text>
  <text x="662" y="527" font-size="11" fill="#6b7280">при шумі та відхиленні номіналів R</text>
</svg>
