<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Підкладка полотна -->
  <rect x="0" y="0" width="960" height="470" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема дільника напруги на галетному перемикачі для АЦП</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Формування ступенів напруги на аналоговому вході та RC-фільтрація брязкоту</text>

  <!-- ПАНЕЛЬ 1: Принципова схема дільника -->
  <g id="panel-schematic">
    <rect x="30" y="70" width="560" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="48" y="94" font-size="14" font-weight="bold" fill="#1a1a1a">Принципова схема дільника (Resistor Ladder)</text>

    <!-- Термінал живлення VCC -->
    <circle cx="80" cy="125" r="5" fill="#2457d6"/>
    <text x="80" y="113" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">VCC (+5 В)</text>
    <line x1="80" y1="125" x2="80" y2="145" stroke="#2457d6" stroke-width="1.5"/>

    <!-- Підтягувальний резистор R_PU -->
    <rect x="70" y="145" width="20" height="40" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="100" y="160" font-size="12" font-weight="bold" fill="#1a1a1a">R_PU</text>
    <text x="100" y="176" font-size="11" fill="#6b7280">10 кОм</text>
    <line x1="80" y1="185" x2="80" y2="210" stroke="#2457d6" stroke-width="1.5"/>

    <!-- Сигнальний вузол U_SIG -->
    <circle cx="80" cy="210" r="4" fill="#2457d6"/>
    <text x="45" y="214" text-anchor="end" font-size="11" font-weight="bold" fill="#2457d6">U_SIG</text>

    <!-- RC-фільтр низьких частот -->
    <line x1="80" y1="210" x2="140" y2="210" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="140" y="200" width="40" height="20" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="160" y="192" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">R_F (1 кОм)</text>
    <line x1="180" y1="210" x2="230" y2="210" stroke="#1a1a1a" stroke-width="1.5"/>

    <!-- Вузол фільтрація та конденсатор C_F -->
    <circle cx="230" cy="210" r="4" fill="#1a1a1a"/>
    <line x1="230" y1="210" x2="230" y2="235" stroke="#1a1a1a" stroke-width="1.5"/>
    <line x1="218" y1="235" x2="242" y2="235" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="218" y1="241" x2="242" y2="241" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="230" y1="241" x2="230" y2="258" stroke="#1a1a1a" stroke-width="1.5"/>

    <!-- Земля фільтра -->
    <line x1="218" y1="258" x2="242" y2="258" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="222" y1="262" x2="238" y2="262" stroke="#1a1a1a" stroke-width="1.5"/>
    <line x1="226" y1="266" x2="234" y2="266" stroke="#1a1a1a" stroke-width="1.5"/>

    <text x="250" y="242" font-size="11" fill="#6b7280">C_F (100 нФ)</text>
    <text x="230" y="284" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">RC-фільтр брязкоту</text>

    <!-- Лінія до аналогового входу МК -->
    <line x1="230" y1="210" x2="348" y2="210" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

    <!-- Блок мікроконтролера -->
    <rect x="350" y="155" width="220" height="110" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
    <text x="460" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">АЦП Мікроконтролера</text>
    <text x="460" y="200" text-anchor="middle" font-size="11" fill="#6b7280">Вхід ADC_IN (0..5 В)</text>
    <rect x="365" y="215" width="190" height="36" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
    <text x="460" y="238" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Код = (U_ADC / 5.0) × 1023</text>

    <!-- Секція галетного перемикача -->
    <line x1="80" y1="210" x2="80" y2="250" stroke="#2457d6" stroke-width="1.5"/>
    <circle cx="80" cy="250" r="4" fill="#2457d6"/>

    <!-- Важіль ротора перемикача (спрямований на P3) -->
    <line x1="80" y1="250" x2="225" y2="310" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
    <text x="50" y="260" text-anchor="end" font-size="11" font-weight="bold" fill="#27ae60">Ротор (P3)</text>

    <!-- Контактні точки позицій (P1..P5) -->
    <circle cx="70" cy="315" r="5" fill="#1a1a1a"/>
    <circle cx="150" cy="315" r="5" fill="#1a1a1a"/>
    <circle cx="230" cy="315" r="6" fill="#27ae60"/>
    <circle cx="310" cy="315" r="5" fill="#1a1a1a"/>
    <circle cx="390" cy="315" r="5" fill="#6b7280"/>

    <!-- Підписи позицій -->
    <text x="70" y="298" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">P1</text>
    <text x="150" y="298" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">P2</text>
    <text x="230" y="298" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">P3</text>
    <text x="310" y="298" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">P4</text>
    <text x="390" y="298" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b7280">P5 (NC)</text>

    <!-- Резистори дільника між позиціями -->
    <line x1="70" y1="315" x2="95" y2="315" stroke="#1a1a1a" stroke-width="1.2"/>
    <rect x="95" y="307" width="30" height="16" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
    <line x1="125" y1="315" x2="150" y2="315" stroke="#1a1a1a" stroke-width="1.2"/>

    <line x1="150" y1="315" x2="175" y2="315" stroke="#1a1a1a" stroke-width="1.2"/>
    <rect x="175" y="307" width="30" height="16" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
    <line x1="205" y1="315" x2="230" y2="315" stroke="#1a1a1a" stroke-width="1.2"/>

    <line x1="230" y1="315" x2="255" y2="315" stroke="#1a1a1a" stroke-width="1.2"/>
    <rect x="255" y="307" width="30" height="16" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
    <line x1="285" y1="315" x2="310" y2="315" stroke="#1a1a1a" stroke-width="1.2"/>

    <!-- Підписи резисторів -->
    <text x="110" y="342" text-anchor="middle" font-size="11" fill="#6b7280">R1 (3.3к)</text>
    <text x="190" y="342" text-anchor="middle" font-size="11" fill="#6b7280">R2 (6.8к)</text>
    <text x="270" y="342" text-anchor="middle" font-size="11" fill="#6b7280">R3 (20к)</text>

    <!-- Підключення до землі (GND) -->
    <line x1="70" y1="315" x2="70" y2="365" stroke="#1a1a1a" stroke-width="1.5"/>
    <line x1="58" y1="365" x2="82" y2="365" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="62" y1="369" x2="78" y2="369" stroke="#1a1a1a" stroke-width="1.5"/>
    <line x1="66" y1="373" x2="74" y2="373" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="70" y="390" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">GND</text>
  </g>

  <!-- ПАНЕЛЬ 2: Розрахунок рівнів напруги -->
  <g id="panel-table">
    <rect x="610" y="70" width="320" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="630" y="94" font-size="14" font-weight="bold" fill="#1a1a1a">Розрахунок рівнів напруги (10-біт АЦП)</text>

    <!-- Шапка таблиці -->
    <rect x="625" y="112" width="290" height="28" rx="4" fill="#2457d6"/>
    <text x="650" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Поз.</text>
    <text x="725" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Опір R_ниж</text>
    <text x="815" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">U_ADC</text>
    <text x="880" y="130" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Код АЦП</text>

    <!-- Рядок 1: P1 -->
    <rect x="625" y="144" width="290" height="28" rx="3" fill="#ffffff" stroke="#e0e0e0"/>
    <text x="650" y="162" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">P1</text>
    <text x="725" y="162" text-anchor="middle" font-size="11" fill="#6b7280">0 Ом (GND)</text>
    <text x="815" y="162" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">0.00 В</text>
    <text x="880" y="162" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">0</text>

    <!-- Рядок 2: P2 -->
    <rect x="625" y="176" width="290" height="28" rx="3" fill="#ffffff" stroke="#e0e0e0"/>
    <text x="650" y="194" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">P2</text>
    <text x="725" y="194" text-anchor="middle" font-size="11" fill="#6b7280">3.3 кОм</text>
    <text x="815" y="194" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">1.24 В</text>
    <text x="880" y="194" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">254</text>

    <!-- Рядок 3: P3 (Активна позиція) -->
    <rect x="625" y="208" width="290" height="28" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
    <text x="650" y="226" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">P3 ★</text>
    <text x="725" y="226" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">10.1 кОм</text>
    <text x="815" y="226" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">2.50 В</text>
    <text x="880" y="226" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">512</text>

    <!-- Рядок 4: P4 -->
    <rect x="625" y="240" width="290" height="28" rx="3" fill="#ffffff" stroke="#e0e0e0"/>
    <text x="650" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">P4</text>
    <text x="725" y="258" text-anchor="middle" font-size="11" fill="#6b7280">30.1 кОм</text>
    <text x="815" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">3.75 В</text>
    <text x="880" y="258" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">768</text>

    <!-- Рядок 5: P5 -->
    <rect x="625" y="272" width="290" height="28" rx="3" fill="#ffffff" stroke="#e0e0e0"/>
    <text x="650" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">P5</text>
    <text x="725" y="290" text-anchor="middle" font-size="11" fill="#6b7280">∞ (NC)</text>
    <text x="815" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">5.00 В</text>
    <text x="880" y="290" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">1023</text>

    <!-- Пояснювальна блок-картка -->
    <rect x="625" y="312" width="290" height="118" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
    <text x="770" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Особливості обробки в прошивці</text>
    <text x="640" y="354" font-size="11" fill="#1a1a1a">• Вікно допуску напруги: ±0.3 В (±60 відліків)</text>
    <text x="640" y="376" font-size="11" fill="#1a1a1a">• Врахування допуску резисторів (1%)</text>
    <text x="640" y="398" font-size="11" fill="#1a1a1a">• Економія 4 цифрових ніжок (1 аналоговий ПІН)</text>
  </g>
</svg>
