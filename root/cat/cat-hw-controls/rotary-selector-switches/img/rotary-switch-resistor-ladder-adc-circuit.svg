<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схемотехніка резистивної драбини галетного перемикача з АЦП</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Перетворення багатопозиційної механічної комутації на дискретні рівні напруги U_ADC для одного входу МК</text>

  <!-- Panel 1: Resistor Ladder -->
  <rect x="30" y="75" width="260" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="160" y="98" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Резистивний дільник</text>

  <!-- V_CC Node -->
  <circle cx="80" cy="125" r="4" fill="#2457d6"/>
  <text x="80" y="116" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">V_CC (+3.3V)</text>
  <line x1="80" y1="125" x2="80" y2="145" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Resistor R1 -->
  <rect x="70" y="145" width="20" height="35" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="110" y="166" font-size="12" fill="#1a1a1a">R1 (1 kΩ)</text>

  <!-- Tap Node 1 -->
  <line x1="80" y1="180" x2="80" y2="205" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="80" cy="190" r="3.5" fill="#1a1a1a"/>
  <line x1="80" y1="190" x2="270" y2="190" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="175" y="184" font-size="12" fill="#6b7280">U1 = 3.30 V</text>

  <!-- Resistor R2 -->
  <rect x="70" y="205" width="20" height="35" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="110" y="226" font-size="12" fill="#1a1a1a">R2 (1 kΩ)</text>

  <!-- Tap Node 2 -->
  <line x1="80" y1="240" x2="80" y2="265" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="80" cy="250" r="3.5" fill="#27ae60"/>
  <line x1="80" y1="250" x2="270" y2="250" stroke="#27ae60" stroke-width="2.5"/>
  <text x="175" y="244" font-size="12" font-weight="bold" fill="#27ae60">U2 = 2.475 V</text>

  <!-- Resistor R3 -->
  <rect x="70" y="265" width="20" height="35" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="110" y="286" font-size="12" fill="#1a1a1a">R3 (1 kΩ)</text>

  <!-- Tap Node 3 -->
  <line x1="80" y1="300" x2="80" y2="325" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="80" cy="310" r="3.5" fill="#1a1a1a"/>
  <line x1="80" y1="310" x2="270" y2="310" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="175" y="304" font-size="12" fill="#6b7280">U3 = 1.65 V</text>

  <!-- Resistor R4 -->
  <rect x="70" y="325" width="20" height="35" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="110" y="346" font-size="12" fill="#1a1a1a">R4 (1 kΩ)</text>

  <!-- Tap Node 4 & GND -->
  <line x1="80" y1="360" x2="80" y2="395" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="80" cy="370" r="3.5" fill="#1a1a1a"/>
  <line x1="80" y1="370" x2="270" y2="370" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="175" y="364" font-size="12" fill="#6b7280">U4 = 0.825 V</text>

  <!-- GND Symbol Panel 1 -->
  <line x1="68" y1="395" x2="92" y2="395" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="72" y1="399" x2="88" y2="399" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="76" y1="403" x2="84" y2="403" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="80" y="420" font-size="12" fill="#6b7280" text-anchor="middle">GND (0 V)</text>


  <!-- Panel 2: Rotary Switch Assembly -->
  <rect x="320" y="75" width="310" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="475" y="98" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">2. Поворотний селектор (Галета)</text>

  <!-- Stator Contacts -->
  <line x1="270" y1="190" x2="350" y2="190" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="350" cy="190" r="5" fill="#2457d6"/>
  <text x="338" y="184" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">P1</text>

  <line x1="270" y1="250" x2="350" y2="250" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="350" cy="250" r="5" fill="#27ae60"/>
  <text x="338" y="244" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">P2</text>

  <line x1="270" y1="310" x2="350" y2="310" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="350" cy="310" r="5" fill="#2457d6"/>
  <text x="338" y="304" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">P3</text>

  <line x1="270" y1="370" x2="350" y2="370" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="350" cy="370" r="5" fill="#2457d6"/>
  <text x="338" y="364" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">P4</text>

  <!-- Wiper Blade & Rotor Mechanics -->
  <circle cx="470" cy="250" r="14" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <line x1="470" y1="250" x2="355" y2="250" stroke="#27ae60" stroke-width="3"/>
  <text x="470" y="215" font-size="12" fill="#2457d6" font-weight="bold" text-anchor="middle">Рухомий ротор</text>

  <rect x="375" y="270" width="130" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="440" y="286" font-size="12" fill="#27ae60" font-weight="bold" text-anchor="middle">Позиція 2 увімкнена</text>

  <!-- Common Output Line (COM) -->
  <line x1="484" y1="250" x2="570" y2="250" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="570" cy="250" r="4" fill="#2457d6"/>
  <text x="570" y="235" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">COM</text>

  <!-- Filter Capacitor C_f -->
  <line x1="570" y1="250" x2="570" y2="330" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="558" y1="330" x2="582" y2="330" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="558" y1="336" x2="582" y2="336" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="570" y1="336" x2="570" y2="395" stroke="#1a1a1a" stroke-width="1.5"/>

  <text x="590" y="340" font-size="12" fill="#1a1a1a">C_f (100 nF)</text>
  <text x="590" y="358" font-size="11" fill="#6b7280">Антибрязкіт / Фільтр</text>

  <!-- GND Symbol Panel 2 -->
  <line x1="558" y1="395" x2="582" y2="395" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="562" y1="399" x2="578" y2="399" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="566" y1="403" x2="574" y2="403" stroke="#1a1a1a" stroke-width="1.5"/>


  <!-- Panel 3: Microcontroller & ADC Processing -->
  <rect x="660" y="75" width="270" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="795" y="98" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">3. Зчитування мікроконтролером</text>

  <!-- Input Connection Line to Pin -->
  <line x1="570" y1="250" x2="670" y2="250" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr)"/>

  <rect x="670" y="235" width="75" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="707" y="255" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Пін ADC0</text>

  <!-- Internal MCU Architecture Box -->
  <rect x="760" y="130" width="150" height="280" rx="6" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="835" y="152" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">АЦП (10-біт / 12-біт)</text>

  <!-- Voltage Reading -->
  <text x="835" y="180" font-size="12" fill="#1a1a1a" text-anchor="middle">U_ADC = U2 = 2.475 V</text>

  <!-- ADC Quantization Formula & Value -->
  <rect x="772" y="198" width="126" height="50" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="835" y="218" font-size="11" fill="#1a1a1a" text-anchor="middle">N_ADC = U_in/V_ref × 1023</text>
  <text x="835" y="236" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">N_ADC = 767 (75%)</text>

  <!-- Hysteresis Window -->
  <rect x="772" y="260" width="126" height="65" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="835" y="278" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Цифровий гістерезис</text>
  <text x="835" y="296" font-size="11" fill="#1a1a1a" text-anchor="middle">716 ≤ N_ADC ≤ 818</text>
  <text x="835" y="313" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">=&gt; Команда: Позиція 2</text>

  <!-- Fault Detection Block -->
  <rect x="772" y="338" width="126" height="55" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="835" y="354" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Діагностика ліній</text>
  <text x="835" y="370" font-size="10" fill="#6b7280" text-anchor="middle">N = 0 =&gt; Обрив / КЗ GND</text>
  <text x="835" y="384" font-size="10" fill="#6b7280" text-anchor="middle">N = 1023 =&gt; КЗ V_CC</text>
</svg>
