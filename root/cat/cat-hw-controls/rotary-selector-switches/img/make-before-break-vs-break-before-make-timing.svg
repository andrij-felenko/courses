<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Header -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Порівняння часових діаграм комутації BBM (Break-Before-Make) та MBB (Make-Before-Break)</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">BBM створює паузу розриву кола, а MBB короткочасно замкне обидва контакти для безперервності струму</text>

  <!-- PANEL 1: BBM (Left) -->
  <rect x="30" y="70" width="435" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="42" y="82" width="411" height="28" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="247" y="101" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">1. Break-Before-Make (BBM / Non-Shorting)</text>

  <!-- Physical Contact Model BBM -->
  <rect x="55" y="122" width="385" height="85" fill="#ffffff" stroke="#d0d7de" rx="4"/>
  <text x="247" y="139" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Геометрія роторного ножа: Вузький пелюсток (W_knife &lt; W_gap)</text>
  <!-- Stationary Contact N -->
  <rect x="75" y="152" width="90" height="20" fill="#d0d7de" rx="2"/>
  <text x="120" y="166" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Ламель N</text>
  <!-- Stationary Contact N+1 -->
  <rect x="330" y="152" width="90" height="20" fill="#d0d7de" rx="2"/>
  <text x="375" y="166" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Ламель N+1</text>
  <!-- Rotor Knife in Middle (Gap) -->
  <rect x="180" y="150" width="135" height="24" fill="#c0392b" rx="3"/>
  <text x="247" y="166" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Ніж ротора</text>
  <text x="247" y="196" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Контакти не торкаються (Обрів)</text>

  <!-- Timing Diagrams BBM -->
  <!-- Track 1: Contact N -->
  <text x="55" y="235" font-size="12" font-weight="bold" fill="#1a1a1a">Контакт N</text>
  <path d="M 125 220 L 210 220 L 210 245 L 430 245" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Track 2: Contact N+1 -->
  <text x="55" y="285" font-size="12" font-weight="bold" fill="#1a1a1a">Контакт N+1</text>
  <path d="M 125 295 L 290 295 L 290 270 L 430 270" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Discrepancy / Break Gap Highlight -->
  <rect x="210" y="215" width="80" height="90" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="250" y="260" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Пауза Δt_break</text>

  <!-- Time Axis -->
  <line x1="125" y1="318" x2="425" y2="318" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="430" y="332" font-size="12" fill="#1a1a1a">Час t</text>

  <!-- Panel 1 Subcard -->
  <rect x="42" y="380" width="411" height="42" rx="4" fill="#ffffff" stroke="#c0392b"/>
  <text x="247" y="397" font-size="12" fill="#1a1a1a" text-anchor="middle">Пауза розриву запобігає замиканню між джерелами</text>
  <text x="247" y="413" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Небезпека: ЕРС самоіндукції й дуга на DC</text>


  <!-- PANEL 2: MBB (Right) -->
  <rect x="495" y="70" width="435" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="507" y="82" width="411" height="28" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712" y="101" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">2. Make-Before-Break (MBB / Shorting)</text>

  <!-- Physical Contact Model MBB -->
  <rect x="520" y="122" width="385" height="85" fill="#ffffff" stroke="#d0d7de" rx="4"/>
  <text x="712" y="139" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Геометрія роторного ножа: Широкий пелюсток (W_knife &gt; W_gap)</text>
  <!-- Stationary Contact N -->
  <rect x="535" y="152" width="70" height="20" fill="#d0d7de" rx="2"/>
  <text x="570" y="166" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Лам. N</text>
  <!-- Stationary Contact N+1 -->
  <rect x="820" y="152" width="70" height="20" fill="#d0d7de" rx="2"/>
  <text x="855" y="166" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Лам. N+1</text>
  <!-- Wide Rotor Knife touch edge to edge -->
  <rect x="605" y="150" width="215" height="24" fill="#27ae60" rx="3"/>
  <text x="712" y="166" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Широкий ніж ротора</text>
  <text x="712" y="196" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Обидва контакти замкнено (Shorting)</text>

  <!-- Timing Diagrams MBB -->
  <!-- Track 1: Contact N -->
  <text x="520" y="235" font-size="12" font-weight="bold" fill="#1a1a1a">Контакт N</text>
  <path d="M 590 220 L 755 220 L 755 245 L 895 245" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Track 2: Contact N+1 -->
  <text x="520" y="285" font-size="12" font-weight="bold" fill="#1a1a1a">Контакт N+1</text>
  <path d="M 590 295 L 675 295 L 675 270 L 895 270" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Overlap Zone Highlight -->
  <rect x="675" y="215" width="80" height="90" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="715" y="260" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Перекриття Δt_overlap</text>

  <!-- Time Axis -->
  <line x1="590" y1="318" x2="890" y2="318" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="895" y="332" font-size="12" fill="#1a1a1a">Час t</text>

  <!-- Panel 2 Subcard -->
  <rect x="507" y="380" width="411" height="42" rx="4" fill="#ffffff" stroke="#27ae60"/>
  <text x="712" y="397" font-size="12" fill="#1a1a1a" text-anchor="middle">Безперервний струм запобігає щигликам в аудіо</text>
  <text x="712" y="413" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Перевага: Безщигольне перемикання (Pop-Free)</text>
</svg>
