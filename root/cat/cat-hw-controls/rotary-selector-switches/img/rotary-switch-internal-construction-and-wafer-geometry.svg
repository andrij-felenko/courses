<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow markers -->
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Header -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Внутрішня будова та кінематика галетного перемикача</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Взаємодія поворотного вала, фіксатора положень (detent), обмежувального кільця та галетної платини</text>

  <!-- ==================== LEFT PANEL: DETENT & STOP RING ==================== -->
  <rect x="35" y="75" width="415" height="395" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="50" y="90" width="385" height="28" rx="4" ry="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="242" y="109" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Механізм фіксації та обмеження ходу</text>

  <!-- Left Diagram (Detent & Stop Ring) -->
  <g transform="translate(65, 130)">
    <rect x="0" y="0" width="355" height="195" rx="6" ry="6" fill="white" stroke="#d0d7de"/>

    <!-- Central Shaft -->
    <circle cx="177" cy="98" r="22" fill="#d0d7de" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="171" y="76" width="12" height="44" fill="#6b7280"/>
    <text x="177" y="102" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вал</text>

    <!-- Star Detent Disc (Notched Gear) -->
    <!-- Draw notched outer circle -->
    <path d="M 177 40 
             A 58 58 0 0 1 218 57 L 225 48 L 228 59 L 235 68 
             A 58 58 0 0 1 235 128 L 228 137 L 225 148 L 218 139 
             A 58 58 0 0 1 136 139 L 129 148 L 126 137 L 119 128 
             A 58 58 0 0 1 119 68 L 126 59 L 129 48 L 136 57 
             Z" fill="none" stroke="#2457d6" stroke-width="2.5"/>

    <!-- Detent Ball & Spring Assembly (Top) -->
    <circle cx="177" cy="30" r="8" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M 177 5 Q 173 12 177 18 Q 181 24 177 28" fill="none" stroke="#2457d6" stroke-width="2"/>
    <rect x="165" y="0" width="24" height="8" fill="#6b7280"/>

    <!-- Stop Ring (Outer Ring with pin) -->
    <circle cx="177" cy="98" r="75" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="6,4"/>
    <!-- Stop Pin at position ~30 deg -->
    <circle cx="230" cy="45" r="5" fill="#c0392b" stroke="#1a1a1a" stroke-width="1"/>

    <!-- Index Holes on Frame -->
    <circle cx="215" cy="32" r="3" fill="#6b7280"/>
    <circle cx="230" cy="45" r="3" fill="#c0392b"/>
    <circle cx="242" cy="62" r="3" fill="#6b7280"/>
    <circle cx="248" cy="82" r="3" fill="#6b7280"/>
    <circle cx="248" cy="114" r="3" fill="#6b7280"/>

    <!-- Labels with pointer lines -->
    <!-- Ball label -->
    <text x="60" y="22" font-size="11" font-weight="bold" fill="#2457d6">Кулька-фіксатор</text>
    <path d="M 110 24 L 169 30" fill="none" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Notched disc label -->
    <text x="45" y="165" font-size="11" font-weight="bold" fill="#2457d6">Зірчастий диск (30°)</text>
    <path d="M 115 155 L 140 135" fill="none" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Stop Ring label -->
    <text x="250" y="22" font-size="11" font-weight="bold" fill="#c0392b">Штифт стопорного кільця</text>
    <path d="M 275 28 L 235 42" fill="none" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Position holes label -->
    <text x="260" y="165" font-size="11" fill="#6b7280">Отвори вибору позицій</text>
    <path d="M 275 152 L 250 114" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  </g>

  <!-- Left Text Details -->
  <text x="70" y="350" font-size="12" font-weight="bold" fill="#1a1a1a">• Фіксатор дає чіткий тактильний клац при кожнім кроку (30°)</text>
  <text x="70" y="370" font-size="12" fill="#1a1a1a">• Пружина притискає кульку до западин зірчастого диска</text>
  <text x="70" y="390" font-size="12" fill="#c0392b" font-weight="bold">• Перестановкою штифта обмежують кількість станів (2..12)</text>
  <text x="70" y="410" font-size="12" fill="#6b7280">• Запобігає випадковому перекручуванню вала поза робочу зону</text>
  <text x="70" y="450" font-size="12" font-weight="bold" fill="#2457d6">Точність позиціонування: кут кроку 30° (12 позицій на 360°)</text>


  <!-- ==================== RIGHT PANEL: WAFER DECK ==================== -->
  <rect x="510" y="75" width="415" height="395" rx="8" ry="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="525" y="90" width="385" height="28" rx="4" ry="4" fill="#27ae60"/>
  <text x="717" y="109" font-size="13" font-weight="bold" fill="white" text-anchor="middle">2. Галетна платина та контактна група (Wafer Deck)</text>

  <!-- Right Diagram (Wafer Deck) -->
  <g transform="translate(540, 130)">
    <rect x="0" y="0" width="355" height="195" rx="6" ry="6" fill="white" stroke="#27ae60"/>

    <!-- Stator Wafer Base (Ceramic/Phenolic Circle) -->
    <circle cx="177" cy="98" r="70" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>

    <!-- 12 Stator Lugs (Contacts around circle) -->
    <!-- Position 1 (Top 12 o'clock) -->
    <rect x="172" y="18" width="10" height="20" fill="#27ae60" stroke="#1a1a1a" stroke-width="1"/>
    <text x="177" y="14" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">1</text>

    <!-- Position 2 (1 o'clock, active) -->
    <rect x="204" y="26" width="10" height="20" fill="#27ae60" stroke="#1a1a1a" stroke-width="1" transform="rotate(30 209 36)"/>
    <text x="218" y="24" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">2</text>

    <!-- Position 3 (2 o'clock) -->
    <rect x="228" y="50" width="10" height="20" fill="#6b7280" stroke="#1a1a1a" stroke-width="1" transform="rotate(60 233 60)"/>
    <text x="246" y="52" font-size="10" fill="#6b7280" text-anchor="middle">3</text>

    <!-- Position 4 (3 o'clock) -->
    <rect x="238" y="88" width="10" height="20" fill="#6b7280" stroke="#1a1a1a" stroke-width="1" transform="rotate(90 243 98)"/>
    <text x="256" y="102" font-size="10" fill="#6b7280" text-anchor="middle">4</text>

    <!-- Position 5 (4 o'clock) -->
    <rect x="228" y="126" width="10" height="20" fill="#6b7280" stroke="#1a1a1a" stroke-width="1" transform="rotate(120 233 136)"/>
    <!-- Position 6 (5 o'clock) -->
    <rect x="204" y="150" width="10" height="20" fill="#6b7280" stroke="#1a1a1a" stroke-width="1" transform="rotate(150 209 160)"/>

    <!-- Position 7 (6 o'clock - Common Pole Input) -->
    <rect x="172" y="158" width="10" height="20" fill="#2457d6" stroke="#1a1a1a" stroke-width="1"/>
    <text x="177" y="190" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="middle">P (Pole)</text>

    <!-- Position 8..12 -->
    <rect x="140" y="150" width="10" height="20" fill="#6b7280" stroke="#1a1a1a" stroke-width="1" transform="rotate(210 145 160)"/>
    <rect x="116" y="126" width="10" height="20" fill="#6b7280" stroke="#1a1a1a" stroke-width="1" transform="rotate(240 121 136)"/>
    <rect x="106" y="88" width="10" height="20" fill="#6b7280" stroke="#1a1a1a" stroke-width="1" transform="rotate(270 111 98)"/>
    <rect x="116" y="50" width="10" height="20" fill="#6b7280" stroke="#1a1a1a" stroke-width="1" transform="rotate(300 121 60)"/>
    <rect x="140" y="26" width="10" height="20" fill="#6b7280" stroke="#1a1a1a" stroke-width="1" transform="rotate(330 145 36)"/>

    <!-- Rotor Disc & Wiper Contact Arm (Connecting Pole P to Pos 2) -->
    <circle cx="177" cy="98" r="30" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <path d="M 177 128 L 177 98 L 205 40" fill="none" stroke="#27ae60" stroke-width="4" stroke-linecap="round"/>
    <circle cx="177" cy="98" r="6" fill="#2457d6"/>

    <!-- Labels -->
    <!-- Rotor wiper label -->
    <text x="35" y="80" font-size="11" font-weight="bold" fill="#27ae60">Роторний ніж</text>
    <path d="M 100 82 L 180 65" fill="none" stroke="#27ae60" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Stator contact label -->
    <text x="250" y="32" font-size="11" font-weight="bold" fill="#27ae60">Ламель статора № 2</text>

    <!-- Common pole label -->
    <text x="35" y="145" font-size="11" font-weight="bold" fill="#2457d6">Спільний вивід P</text>
    <path d="M 115 150 L 168 165" fill="none" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,3"/>
  </g>

  <!-- Right Text Details -->
  <text x="545" y="350" font-size="12" font-weight="bold" fill="#1a1a1a">• Роторний ніж безперервно з'єднаний зі спільним виводом P</text>
  <text x="545" y="370" font-size="12" fill="#1a1a1a">• При повороті вала ніж комутує відповідну ламель (1..12)</text>
  <text x="545" y="390" font-size="12" fill="#27ae60" font-weight="bold">• Посріблені пелюстки забезпечують низький перехідний опір</text>
  <text x="545" y="410" font-size="12" fill="#6b7280">• Керамічна або гетинаксова основа витримує напругу до 250 В</text>
  <text x="545" y="450" font-size="12" font-weight="bold" fill="#27ae60">Конфігурація 1P12T: 1 полюс на 12 дискретних напрямків</text>

</svg>
