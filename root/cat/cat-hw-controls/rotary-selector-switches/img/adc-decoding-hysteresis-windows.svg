<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="520" fill="white"/>
  <defs>
    <marker id="arr-dark" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Аналогове декодування АЦП з вікнамі гістерезису (ADC Hysteresis Windows)</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Поділ напруги V_ADC на вікна декодування з порогами V_th ± V_hyst запобігає брязкоту від шуму</text>

  <!-- Left / Main Panel: Hysteresis Windows Plot -->
  <rect x="25" y="72" width="635" height="428" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Panel Header inside plot -->
  <text x="40" y="94" font-size="13" font-weight="bold" fill="#1a1a1a">Діаграма порогових вікон напруги V_ADC (12-bit ADC: 0..4095)</text>

  <!-- Voltage Scale Y-Axis -->
  <line x1="115" y1="450" x2="115" y2="115" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="110" y="110" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">V_ADC (В)</text>

  <!-- Voltage Reference Level Labels (Left of Y-Axis) -->
  <text x="108" y="454" text-anchor="end" font-size="11" fill="#6b7280">0 V (0)</text>
  <text x="108" y="379" text-anchor="end" font-size="11" font-weight="bold" fill="#2457d6">V_1 (819)</text>
  <text x="108" y="299" text-anchor="end" font-size="11" font-weight="bold" fill="#2457d6">V_2 (1638)</text>
  <text x="108" y="219" text-anchor="end" font-size="11" font-weight="bold" fill="#2457d6">V_3 (2457)</text>
  <text x="108" y="139" text-anchor="end" font-size="11" font-weight="bold" fill="#2457d6">V_4 (3276)</text>

  <!-- Position 1 Window -->
  <rect x="130" y="350" width="515" height="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <line x1="115" y1="375" x2="645" y2="375" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="140" y="368" font-size="11" font-weight="bold" fill="#2457d6">Позиція 1 (0.66 V)</text>

  <!-- Position 2 Window -->
  <rect x="130" y="270" width="515" height="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <line x1="115" y1="295" x2="645" y2="295" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="140" y="288" font-size="11" font-weight="bold" fill="#2457d6">Позиція 2 (1.32 V)</text>

  <!-- Position 3 Window -->
  <rect x="130" y="190" width="515" height="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <line x1="115" y1="215" x2="645" y2="215" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="140" y="208" font-size="11" font-weight="bold" fill="#2457d6">Позиція 3 (1.98 V)</text>

  <!-- Position 4 Window -->
  <rect x="130" y="110" width="515" height="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <line x1="115" y1="135" x2="645" y2="135" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="140" y="128" font-size="11" font-weight="bold" fill="#2457d6">Позиція 4 (2.64 V)</text>

  <!-- Deadband / Guard Bands (BBM / Noise Zones between windows) -->
  <rect x="130" y="320" width="515" height="30" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2" rx="2"/>
  <text x="210" y="339" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Мертва зона / BBM (Шум)</text>

  <rect x="130" y="240" width="515" height="30" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2" rx="2"/>
  <text x="210" y="259" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Мертва зона / BBM (Шум)</text>

  <rect x="130" y="160" width="515" height="30" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2" rx="2"/>
  <text x="210" y="179" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Мертва зона / BBM (Шум)</text>

  <!-- Hysteresis Band Dimension Marker inside Position 2 -->
  <line x1="585" y1="270" x2="585" y2="280" stroke="#27ae60" stroke-width="1.5" marker-start="url(#arr-green)"/>
  <line x1="585" y1="310" x2="585" y2="320" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="530" y="280" width="110" height="30" fill="#ffffff" stroke="#27ae60" rx="3"/>
  <text x="585" y="294" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Вікно дозволу</text>
  <text x="585" y="306" text-anchor="middle" font-size="11" fill="#27ae60">2 · V_hyst</text>

  <!-- Superimposed Signal Track V_ADC(t) showing noisy input remaining inside Pos 2, then jumping to Pos 3 -->
  <path d="M250,298 C260,291 270,305 280,295 C290,301 300,293 310,299 C320,294 330,303 340,297 C350,299 360,293 370,298 L400,298 L430,225 C440,212 450,218 460,212 C470,216 480,210 490,215" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="340" cy="297" r="4" fill="#2457d6"/>
  <circle cx="460" cy="212" r="4" fill="#2457d6"/>

  <!-- Callout for Noise Suppression inside Window -->
  <line x1="310" y1="299" x2="240" y2="425" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
  <rect x="140" y="420" width="200" height="32" fill="#ffffff" stroke="#d0d7de" rx="4"/>
  <text x="240" y="434" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Шум V_noise у межах V_hyst</text>
  <text x="240" y="446" text-anchor="middle" font-size="11" fill="#27ae60">Позиція 2 утримується стабільно</text>

  <!-- Callout for Transition to Pos 3 -->
  <line x1="430" y1="225" x2="510" y2="425" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
  <rect x="410" y="420" width="200" height="32" fill="#ffffff" stroke="#d0d7de" rx="4"/>
  <text x="510" y="434" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Перехід через поріг V_th</text>
  <text x="510" y="446" text-anchor="middle" font-size="11" fill="#2457d6">Переключення у Позицію 3</text>

  <!-- Bottom Note Left -->
  <text x="350" y="482" text-anchor="middle" font-size="11" fill="#6b7280">Сигнал V_ADC має вийти за поріг (V_nom ± V_hyst) для зміни зафіксованого стану</text>


  <!-- Right Panel: Decoding Logic & Equations -->
  <rect x="675" y="72" width="260" height="428" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="805" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Параметри декодування</text>
  <text x="805" y="112" text-anchor="middle" font-size="12" fill="#2457d6">C/C++ Driver Logic</text>

  <!-- Card 1: Nominal Centers -->
  <rect x="690" y="128" width="230" height="60" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="805" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Центр вікна k:</text>
  <text x="805" y="166" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">V_nom[k] = Vcc · R_div[k]</text>
  <text x="805" y="181" text-anchor="middle" font-size="11" fill="#6b7280">Розрахункове значення дільника</text>

  <!-- Card 2: Hysteresis Window Width -->
  <rect x="690" y="200" width="230" height="64" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="805" y="220" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Ширина гістерезису:</text>
  <text x="805" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">V_hyst = ½ · (V_step - V_noise)</text>
  <text x="805" y="255" text-anchor="middle" font-size="11" fill="#6b7280">Компенсація розкиду резисторів</text>

  <!-- Card 3: Switch Decision Rule -->
  <rect x="690" y="276" width="230" height="100" fill="#ffffff" stroke="#d0d7de" rx="4"/>
  <text x="805" y="296" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Умова перемикання:</text>
  <text x="805" y="314" text-anchor="middle" font-size="11" fill="#1a1a1a">Новий стан k при:</text>
  <text x="805" y="331" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">|V_ADC - V_nom[k]| &lt; V_in_th</text>
  <text x="805" y="348" text-anchor="middle" font-size="11" fill="#1a1a1a">Утримання старого стану при:</text>
  <text x="805" y="365" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">|V_ADC - V_nom[old]| &lt; V_out_th</text>

  <!-- Card 4: Protection Status Badge -->
  <rect x="690" y="388" width="230" height="98" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="805" y="408" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">ПЕРЕВАГИ ГІСТЕРЕЗИСУ:</text>
  <text x="805" y="427" text-anchor="middle" font-size="11" fill="#1a1a1a">• 100% придушення брязкоту</text>
  <text x="805" y="445" text-anchor="middle" font-size="11" fill="#1a1a1a">• Ігнорування шуму та пульсацій</text>
  <text x="805" y="463" text-anchor="middle" font-size="11" fill="#27ae60">• Стабільне утримання позиції</text>

</svg>
