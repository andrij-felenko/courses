<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Підкладка полотна -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Стрілки для діаграм -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часові діаграми та геометрія контактів MBB та BBM</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Порівняння невикорочувальних (BBM) та викорочувальних (MBB) контактних груп</text>

  <!-- ПАНЕЛЬ 1: BBM (Break-Before-Make) -->
  <g id="panel-bbm">
    <!-- Зовнішній блок -->
    <rect x="30" y="70" width="435" height="405" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

    <!-- Плашка типу перемикача -->
    <rect x="45" y="82" width="405" height="30" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
    <text x="247" y="102" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">BBM (Break-Before-Make) — Невикорочувальний</text>

    <!-- Секція 1А: Геометрія контактів -->
    <text x="45" y="134" font-size="12" font-weight="bold" fill="#1a1a1a">Геометричний стан під час перемикання</text>
    <rect x="45" y="142" width="405" height="115" rx="6" fill="white" stroke="#d0d7de"/>

    <!-- Нерухомий контакт 1 -->
    <rect x="70" y="170" width="80" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="110" y="186" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Контакт 1</text>

    <!-- Нерухомий контакт 2 -->
    <rect x="330" y="170" width="80" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="370" y="186" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Контакт 2</text>

    <!-- Рухомий роторний контакт (вузький) -->
    <rect x="160" y="198" width="90" height="18" rx="3" fill="#6b7280" stroke="#1a1a1a" stroke-width="1"/>
    <text x="205" y="211" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Рухомий ротор</text>

    <!-- Індикатор повітряного зазору (Open Gap) -->
    <rect x="180" y="156" width="135" height="22" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
    <text x="247" y="171" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Розімкнено (Open)</text>

    <!-- Пояснення до геометрії -->
    <text x="247" y="246" font-size="11" fill="#6b7280" text-anchor="middle">Контакт 1 розімкнено ДО замикання Контакту 2</text>

    <!-- Секція 1Б: Часова діаграма -->
    <text x="45" y="280" font-size="12" font-weight="bold" fill="#1a1a1a">Часова діаграма сигналів</text>
    <rect x="45" y="288" width="405" height="172" rx="6" fill="white" stroke="#d0d7de"/>

    <!-- Підписи сигналів -->
    <text x="55" y="328" font-size="12" font-weight="bold" fill="#1a1a1a">Контакт 1</text>
    <text x="55" y="388" font-size="12" font-weight="bold" fill="#1a1a1a">Контакт 2</text>

    <!-- Виділення інтервалу розмикання (t_open) -->
    <rect x="200" y="300" width="70" height="120" fill="#fdecea" opacity="0.6"/>
    <line x1="200" y1="300" x2="200" y2="420" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="270" y1="300" x2="270" y2="420" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>

    <text x="235" y="324" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">t_open (пауза)</text>
    <text x="235" y="360" font-size="11" fill="#c0392b" text-anchor="middle">Обидва розімкнені</text>

    <!-- Сигнал 1 (High -> Low) -->
    <path d="M 125,328 L 200,328 L 200,348 L 410,348" stroke="#2457d6" stroke-width="2.5" fill="none"/>

    <!-- Сигнал 2 (Low -> High) -->
    <path d="M 125,408 L 270,408 L 270,388 L 410,388" stroke="#2457d6" stroke-width="2.5" fill="none"/>

    <!-- Вісь часу -->
    <line x1="125" y1="432" x2="415" y2="432" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="410" y="448" font-size="11" fill="#6b7280" text-anchor="end">Час t / Кут повороту</text>
  </g>

  <!-- ПАНЕЛЬ 2: MBB (Make-Before-Break) -->
  <g id="panel-mbb">
    <!-- Зовнішній блок -->
    <rect x="495" y="70" width="435" height="405" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

    <!-- Плашка типу перемикача -->
    <rect x="510" y="82" width="405" height="30" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
    <text x="712" y="102" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">MBB (Make-Before-Break) — Викорочувальний</text>

    <!-- Секція 2А: Геометрія контактів -->
    <text x="510" y="134" font-size="12" font-weight="bold" fill="#1a1a1a">Геометричний стан під час перемикання</text>
    <rect x="510" y="142" width="405" height="115" rx="6" fill="white" stroke="#d0d7de"/>

    <!-- Нерухомий контакт 1 -->
    <rect x="535" y="170" width="80" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="575" y="186" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Контакт 1</text>

    <!-- Нерухомий контакт 2 -->
    <rect x="795" y="170" width="80" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="835" y="186" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Контакт 2</text>

    <!-- Рухомий роторний контакт (широкий, що перекриває обидва контакти) -->
    <rect x="595" y="198" width="220" height="18" rx="3" fill="#27ae60" stroke="#1e8449" stroke-width="1"/>
    <text x="705" y="211" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Широкий ротор (MBB)</text>

    <!-- Індикатор перекриття контактів (Shorting) -->
    <rect x="635" y="156" width="140" height="22" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
    <text x="705" y="171" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Перекриття (Shorting)</text>

    <!-- Пояснення до геометрії -->
    <text x="705" y="246" font-size="11" fill="#6b7280" text-anchor="middle">Контакт 2 замкнено ДО розмикання Контакту 1</text>

    <!-- Секція 2Б: Часова діаграма -->
    <text x="510" y="280" font-size="12" font-weight="bold" fill="#1a1a1a">Часова діаграма сигналів</text>
    <rect x="510" y="288" width="405" height="172" rx="6" fill="white" stroke="#d0d7de"/>

    <!-- Підписи сигналів -->
    <text x="520" y="328" font-size="12" font-weight="bold" fill="#1a1a1a">Контакт 1</text>
    <text x="520" y="388" font-size="12" font-weight="bold" fill="#1a1a1a">Контакт 2</text>

    <!-- Виділення інтервалу перекриття (t_overlap) -->
    <rect x="665" y="300" width="70" height="120" fill="#e9f7ef" opacity="0.6"/>
    <line x1="665" y1="300" x2="665" y2="420" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="735" y1="300" x2="735" y2="420" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3"/>

    <text x="700" y="324" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">t_overlap</text>
    <text x="700" y="360" font-size="11" fill="#27ae60" text-anchor="middle">Обидва замкнені</text>

    <!-- Сигнал 1 (High -> Low, пізніше) -->
    <path d="M 590,328 L 735,328 L 735,348 L 875,348" stroke="#2457d6" stroke-width="2.5" fill="none"/>

    <!-- Сигнал 2 (Low -> High, раніше) -->
    <path d="M 590,408 L 665,408 L 665,388 L 875,388" stroke="#2457d6" stroke-width="2.5" fill="none"/>

    <!-- Вісь часу -->
    <line x1="590" y1="432" x2="880" y2="432" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
    <text x="875" y="448" font-size="11" fill="#6b7280" text-anchor="end">Час t / Кут повороту</text>
  </g>
</svg>
