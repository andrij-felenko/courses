<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схемотехнічні конфігурації контактних груп галетних перемикачів</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Розподіл 12 статорних виводів та центральних роторних полюсів (A, B, C, D) для 1P12T, 2P6T, 3P4T та 4P3T</text>

  <!-- CARD 1: 1P12T -->
  <rect x="40" y="75" width="430" height="195" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="52" y="87" width="406" height="26" rx="4" fill="#eaf0fd"/>
  <text x="255" y="105" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Конфігурація 1P12T (1 Полюс / 12 Положень)</text>

  <!-- Circular Wafer Diagram 1 -->
  <circle cx="140" cy="180" r="48" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="140" cy="180" r="9" fill="#2457d6"/>
  <text x="140" y="184" font-size="12" font-weight="bold" fill="white" text-anchor="middle">A</text>

  <!-- 12 pins dots & labels -->
  <!-- Pin 1 -->
  <circle cx="140" cy="132" r="4" fill="#2457d6"/><text x="140" y="122" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">1</text>
  <!-- Pin 2 -->
  <circle cx="164" cy="138" r="3.5" fill="#1a1a1a"/><text x="172" y="134" font-size="12" fill="#6b7280">2</text>
  <!-- Pin 3 -->
  <circle cx="182" cy="156" r="3.5" fill="#1a1a1a"/><text x="190" y="156" font-size="12" fill="#6b7280">3</text>
  <!-- Pin 4 -->
  <circle cx="188" cy="180" r="3.5" fill="#1a1a1a"/><text x="196" y="184" font-size="12" fill="#6b7280">4</text>
  <!-- Pin 5 -->
  <circle cx="182" cy="204" r="3.5" fill="#1a1a1a"/><text x="190" y="210" font-size="12" fill="#6b7280">5</text>
  <!-- Pin 6 -->
  <circle cx="164" cy="222" r="3.5" fill="#1a1a1a"/><text x="172" y="228" font-size="12" fill="#6b7280">6</text>
  <!-- Pin 7 -->
  <circle cx="140" cy="228" r="3.5" fill="#1a1a1a"/><text x="140" y="244" font-size="12" fill="#6b7280" text-anchor="middle">7</text>
  <!-- Pin 8 -->
  <circle cx="116" cy="222" r="3.5" fill="#1a1a1a"/><text x="108" y="228" font-size="12" fill="#6b7280" text-anchor="end">8</text>
  <!-- Pin 9 -->
  <circle cx="98" cy="204" r="3.5" fill="#1a1a1a"/><text x="90" y="210" font-size="12" fill="#6b7280" text-anchor="end">9</text>
  <!-- Pin 10 -->
  <circle cx="92" cy="180" r="3.5" fill="#1a1a1a"/><text x="84" y="184" font-size="12" fill="#6b7280" text-anchor="end">10</text>
  <!-- Pin 11 -->
  <circle cx="98" cy="156" r="3.5" fill="#1a1a1a"/><text x="90" y="156" font-size="12" fill="#6b7280" text-anchor="end">11</text>
  <!-- Pin 12 -->
  <circle cx="116" cy="138" r="3.5" fill="#1a1a1a"/><text x="108" y="134" font-size="12" fill="#6b7280" text-anchor="end">12</text>
  <!-- Rotor Knife Line -->
  <line x1="140" y1="180" x2="140" y2="136" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Details 1 -->
  <text x="215" y="132" font-size="12" font-weight="bold" fill="#1a1a1a">Полюси: <tspan font-weight="normal" fill="#6b7280">1 вхідний (A)</tspan></text>
  <text x="215" y="152" font-size="12" font-weight="bold" fill="#1a1a1a">Напрямки: <tspan font-weight="normal" fill="#6b7280">12 позицій (1–12)</tspan></text>
  <text x="215" y="172" font-size="12" font-weight="bold" fill="#1a1a1a">Комутація: <tspan font-weight="normal" fill="#2457d6">A → 1, 2, 3 ... 12</tspan></text>
  <rect x="215" y="188" width="240" height="52" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="335" y="208" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Максимальне число позицій</text>
  <text x="335" y="226" font-size="12" fill="#1a1a1a" text-anchor="middle">Вибір 1 з 12 вимірювальних ліній</text>

  <!-- CARD 2: 2P6T -->
  <rect x="490" y="75" width="430" height="195" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="502" y="87" width="406" height="26" rx="4" fill="#eaf0fd"/>
  <text x="705" y="105" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Конфігурація 2P6T (2 Полюси / 6 Положень)</text>

  <!-- Circular Wafer Diagram 2 -->
  <circle cx="590" cy="180" r="48" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="578" cy="180" r="9" fill="#2457d6"/>
  <text x="578" y="184" font-size="12" font-weight="bold" fill="white" text-anchor="middle">A</text>
  <circle cx="602" cy="180" r="9" fill="#27ae60"/>
  <text x="602" y="184" font-size="12" font-weight="bold" fill="white" text-anchor="middle">B</text>

  <!-- 12 pins -->
  <circle cx="590" cy="132" r="4" fill="#2457d6"/><text x="590" y="122" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">1</text>
  <circle cx="614" cy="138" r="3.5" fill="#1a1a1a"/><text x="622" y="134" font-size="12" fill="#6b7280">2</text>
  <circle cx="632" cy="156" r="3.5" fill="#1a1a1a"/><text x="640" y="156" font-size="12" fill="#6b7280">3</text>
  <circle cx="638" cy="180" r="3.5" fill="#1a1a1a"/><text x="646" y="184" font-size="12" fill="#6b7280">4</text>
  <circle cx="632" cy="204" r="3.5" fill="#1a1a1a"/><text x="640" y="210" font-size="12" fill="#6b7280">5</text>
  <circle cx="614" cy="222" r="3.5" fill="#1a1a1a"/><text x="622" y="228" font-size="12" fill="#6b7280">6</text>
  <circle cx="590" cy="228" r="4" fill="#27ae60"/><text x="590" y="244" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">7</text>
  <circle cx="566" cy="222" r="3.5" fill="#1a1a1a"/><text x="558" y="228" font-size="12" fill="#6b7280" text-anchor="end">8</text>
  <circle cx="548" cy="204" r="3.5" fill="#1a1a1a"/><text x="540" y="210" font-size="12" fill="#6b7280" text-anchor="end">9</text>
  <circle cx="542" cy="180" r="3.5" fill="#1a1a1a"/><text x="534" y="184" font-size="12" fill="#6b7280" text-anchor="end">10</text>
  <circle cx="548" cy="156" r="3.5" fill="#1a1a1a"/><text x="540" y="156" font-size="12" fill="#6b7280" text-anchor="end">11</text>
  <circle cx="566" cy="138" r="3.5" fill="#1a1a1a"/><text x="558" y="134" font-size="12" fill="#6b7280" text-anchor="end">12</text>
  <line x1="578" y1="180" x2="590" y2="136" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="602" y1="180" x2="590" y2="224" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Details 2 -->
  <text x="665" y="132" font-size="12" font-weight="bold" fill="#1a1a1a">Полюси: <tspan font-weight="normal" fill="#6b7280">2 входи (A, B)</tspan></text>
  <text x="665" y="152" font-size="12" font-weight="bold" fill="#1a1a1a">Напрямки: <tspan font-weight="normal" fill="#6b7280">6 позицій на полюс</tspan></text>
  <text x="665" y="172" font-size="12" font-weight="bold" fill="#1a1a1a">Групи: <tspan font-weight="normal" fill="#2457d6">A→1..6</tspan> | <tspan font-weight="normal" fill="#27ae60">B→7..12</tspan></text>
  <rect x="665" y="188" width="240" height="52" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="785" y="208" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Двоканальна комутація</text>
  <text x="785" y="226" font-size="12" fill="#1a1a1a" text-anchor="middle">Одночасне перемикання L та N</text>

  <!-- CARD 3: 3P4T -->
  <rect x="40" y="285" width="430" height="195" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="52" y="297" width="406" height="26" rx="4" fill="#eaf0fd"/>
  <text x="255" y="315" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Конфігурація 3P4T (3 Полюси / 4 Положення)</text>

  <!-- Circular Wafer Diagram 3 -->
  <circle cx="140" cy="390" r="48" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="126" cy="382" r="9" fill="#2457d6"/><text x="126" y="386" font-size="12" font-weight="bold" fill="white" text-anchor="middle">A</text>
  <circle cx="154" cy="382" r="9" fill="#27ae60"/><text x="154" y="386" font-size="12" font-weight="bold" fill="white" text-anchor="middle">B</text>
  <circle cx="140" cy="402" r="9" fill="#c0392b"/><text x="140" y="406" font-size="12" font-weight="bold" fill="white" text-anchor="middle">C</text>

  <!-- 12 pins -->
  <circle cx="140" cy="342" r="4" fill="#2457d6"/><text x="140" y="332" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">1</text>
  <circle cx="164" cy="348" r="3.5" fill="#1a1a1a"/><text x="172" y="344" font-size="12" fill="#6b7280">2</text>
  <circle cx="182" cy="366" r="3.5" fill="#1a1a1a"/><text x="190" y="366" font-size="12" fill="#6b7280">3</text>
  <circle cx="188" cy="390" r="3.5" fill="#1a1a1a"/><text x="196" y="394" font-size="12" fill="#6b7280">4</text>
  <circle cx="182" cy="414" r="4" fill="#27ae60"/><text x="190" y="420" font-size="12" font-weight="bold" fill="#27ae60">5</text>
  <circle cx="164" cy="432" r="3.5" fill="#1a1a1a"/><text x="172" y="438" font-size="12" fill="#6b7280">6</text>
  <circle cx="140" cy="438" r="3.5" fill="#1a1a1a"/><text x="140" y="454" font-size="12" fill="#6b7280" text-anchor="middle">7</text>
  <circle cx="116" cy="432" r="3.5" fill="#1a1a1a"/><text x="108" y="438" font-size="12" fill="#6b7280" text-anchor="end">8</text>
  <circle cx="98" cy="414" r="4" fill="#c0392b"/><text x="90" y="420" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">9</text>
  <circle cx="92" cy="390" r="3.5" fill="#1a1a1a"/><text x="84" y="394" font-size="12" fill="#6b7280" text-anchor="end">10</text>
  <circle cx="98" cy="366" r="3.5" fill="#1a1a1a"/><text x="90" y="366" font-size="12" fill="#6b7280" text-anchor="end">11</text>
  <circle cx="116" cy="348" r="3.5" fill="#1a1a1a"/><text x="108" y="344" font-size="12" fill="#6b7280" text-anchor="end">12</text>
  <line x1="126" y1="382" x2="140" y2="346" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="154" y1="382" x2="178" y2="410" stroke="#27ae60" stroke-width="2.5"/>
  <line x1="140" y1="402" x2="102" y2="410" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Details 3 -->
  <text x="215" y="342" font-size="12" font-weight="bold" fill="#1a1a1a">Полюси: <tspan font-weight="normal" fill="#6b7280">3 входи (A, B, C)</tspan></text>
  <text x="215" y="362" font-size="12" font-weight="bold" fill="#1a1a1a">Напрямки: <tspan font-weight="normal" fill="#6b7280">4 позиції на полюс</tspan></text>
  <text x="215" y="382" font-size="12" font-weight="bold" fill="#1a1a1a">Групи: <tspan font-weight="normal" fill="#2457d6">A→1..4</tspan> | <tspan font-weight="normal" fill="#27ae60">B→5..8</tspan> | <tspan font-weight="normal" fill="#c0392b">C→9..12</tspan></text>
  <rect x="215" y="398" width="240" height="52" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="335" y="418" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Трифазна комутація</text>
  <text x="335" y="436" font-size="12" fill="#1a1a1a" text-anchor="middle">Комутація сигналів RGB / 3 фаз</text>

  <!-- CARD 4: 4P3T -->
  <rect x="490" y="285" width="430" height="195" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="502" y="297" width="406" height="26" rx="4" fill="#eaf0fd"/>
  <text x="705" y="315" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Конфігурація 4P3T (4 Полюси / 3 Положення)</text>

  <!-- Circular Wafer Diagram 4 -->
  <circle cx="590" cy="390" r="48" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="576" cy="382" r="9" fill="#2457d6"/><text x="576" y="386" font-size="12" font-weight="bold" fill="white" text-anchor="middle">A</text>
  <circle cx="604" cy="382" r="9" fill="#27ae60"/><text x="604" y="386" font-size="12" font-weight="bold" fill="white" text-anchor="middle">B</text>
  <circle cx="604" cy="402" r="9" fill="#c0392b"/><text x="604" y="406" font-size="12" font-weight="bold" fill="white" text-anchor="middle">C</text>
  <circle cx="576" cy="402" r="9" fill="#1a1a1a"/><text x="576" y="406" font-size="12" font-weight="bold" fill="white" text-anchor="middle">D</text>

  <!-- 12 pins -->
  <circle cx="590" cy="342" r="4" fill="#2457d6"/><text x="590" y="332" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">1</text>
  <circle cx="614" cy="348" r="3.5" fill="#1a1a1a"/><text x="622" y="344" font-size="12" fill="#6b7280">2</text>
  <circle cx="632" cy="366" r="3.5" fill="#1a1a1a"/><text x="640" y="366" font-size="12" fill="#6b7280">3</text>
  <circle cx="638" cy="390" r="4" fill="#27ae60"/><text x="646" y="394" font-size="12" font-weight="bold" fill="#27ae60">4</text>
  <circle cx="632" cy="414" r="3.5" fill="#1a1a1a"/><text x="640" y="420" font-size="12" fill="#6b7280">5</text>
  <circle cx="614" cy="432" r="3.5" fill="#1a1a1a"/><text x="622" y="438" font-size="12" fill="#6b7280">6</text>
  <circle cx="590" cy="438" r="4" fill="#c0392b"/><text x="590" y="454" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">7</text>
  <circle cx="566" cy="432" r="3.5" fill="#1a1a1a"/><text x="558" y="438" font-size="12" fill="#6b7280" text-anchor="end">8</text>
  <circle cx="548" cy="414" r="3.5" fill="#1a1a1a"/><text x="540" y="420" font-size="12" fill="#6b7280" text-anchor="end">9</text>
  <circle cx="542" cy="390" r="4" fill="#1a1a1a"/><text x="534" y="394" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">10</text>
  <circle cx="548" cy="366" r="3.5" fill="#1a1a1a"/><text x="540" y="366" font-size="12" fill="#6b7280" text-anchor="end">11</text>
  <circle cx="566" cy="348" r="3.5" fill="#1a1a1a"/><text x="558" y="344" font-size="12" fill="#6b7280" text-anchor="end">12</text>
  <line x1="576" y1="382" x2="590" y2="346" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="604" y1="382" x2="634" y2="390" stroke="#27ae60" stroke-width="2.5"/>
  <line x1="604" y1="402" x2="590" y2="434" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="576" y1="402" x2="546" y2="390" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- Details 4 -->
  <text x="665" y="342" font-size="12" font-weight="bold" fill="#1a1a1a">Полюси: <tspan font-weight="normal" fill="#6b7280">4 входи (A, B, C, D)</tspan></text>
  <text x="665" y="362" font-size="12" font-weight="bold" fill="#1a1a1a">Напрямки: <tspan font-weight="normal" fill="#6b7280">3 позиції на полюс</tspan></text>
  <text x="665" y="382" font-size="12" font-weight="bold" fill="#1a1a1a">Групи: <tspan font-weight="normal" fill="#2457d6">A→1..3</tspan> | <tspan font-weight="normal" fill="#27ae60">B→4..6</tspan> | <tspan font-weight="normal" fill="#c0392b">C→7..9</tspan></text>
  <rect x="665" y="398" width="240" height="52" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="785" y="418" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">4-канальне опитування</text>
  <text x="785" y="436" font-size="12" fill="#1a1a1a" text-anchor="middle">Вибір 4-диференційних кіл</text>
</svg>
