<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Електрична схема та просторове розпаювання резистивної матриці атенюатора</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Послідовне підключення резисторів R1–R5 між пелюстками галети та вихід на центральний ротор</text>

  <!-- Left Panel: Schematic -->
  <rect x="30" y="75" width="435" height="455" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247" y="103" text-anchor="middle" font-size="15" font-weight="bold" fill="#2457d6">Електрична принципова схема</text>

  <!-- Vin Label and Wire -->
  <text x="50" y="145" font-size="13" font-weight="bold" fill="#27ae60">Вхід Vin (Pos 5)</text>
  <circle cx="120" cy="160" r="4" fill="#27ae60"/>
  <line x1="50" y1="160" x2="120" y2="160" stroke="#27ae60" stroke-width="2"/>

  <!-- Resistor R5 -->
  <line x1="120" y1="160" x2="120" y2="180" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="110" y="180" width="20" height="35" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="98" y="202" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">R5</text>
  <line x1="120" y1="215" x2="120" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="120" cy="230" r="3.5" fill="#1a1a1a"/>

  <!-- Resistor R4 -->
  <line x1="120" y1="230" x2="120" y2="245" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="110" y="245" width="20" height="35" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="98" y="267" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">R4</text>
  <line x1="120" y1="280" x2="120" y2="295" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="120" cy="295" r="3.5" fill="#1a1a1a"/>

  <!-- Resistor R3 -->
  <line x1="120" y1="295" x2="120" y2="310" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="110" y="310" width="20" height="35" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="98" y="332" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">R3</text>
  <line x1="120" y1="345" x2="120" y2="360" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="120" cy="360" r="3.5" fill="#1a1a1a"/>

  <!-- Resistor R2 -->
  <line x1="120" y1="360" x2="120" y2="375" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="110" y="375" width="20" height="35" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="98" y="397" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">R2</text>
  <line x1="120" y1="410" x2="120" y2="425" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="120" cy="425" r="3.5" fill="#1a1a1a"/>

  <!-- Resistor R1 -->
  <line x1="120" y1="425" x2="120" y2="440" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="110" y="440" width="20" height="35" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="98" y="462" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">R1</text>
  <line x1="120" y1="475" x2="120" y2="490" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="120" cy="490" r="4" fill="#1a1a1a"/>

  <!-- GND symbol at bottom of ladder -->
  <line x1="120" y1="490" x2="120" y2="505" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="105" y1="505" x2="135" y2="505" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="110" y1="510" x2="130" y2="510" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="115" y1="515" x2="125" y2="515" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="142" y="508" font-size="12" fill="#6b7280">GND (Pos 0)</text>

  <!-- Horizontal Taps to Selector Contacts -->
  <line x1="120" y1="160" x2="230" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="230" cy="160" r="4.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="242" y="164" font-size="12" fill="#1a1a1a">5</text>

  <line x1="120" y1="230" x2="230" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="230" cy="230" r="4.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="242" y="234" font-size="12" fill="#1a1a1a">4</text>

  <line x1="120" y1="295" x2="230" y2="295" stroke="#2457d6" stroke-width="2"/>
  <circle cx="230" cy="295" r="5" fill="#2457d6"/>
  <text x="242" y="299" font-size="13" font-weight="bold" fill="#2457d6">3 (Активна)</text>

  <line x1="120" y1="360" x2="230" y2="360" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="230" cy="360" r="4.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="242" y="364" font-size="12" fill="#1a1a1a">2</text>

  <line x1="120" y1="425" x2="230" y2="425" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="230" cy="425" r="4.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="242" y="429" font-size="12" fill="#1a1a1a">1</text>

  <line x1="120" y1="490" x2="230" y2="490" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="230" cy="490" r="4.5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="242" y="494" font-size="12" fill="#1a1a1a">0</text>

  <!-- Wiper / Rotor Selector Arm -->
  <circle cx="350" cy="325" r="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <circle cx="350" cy="325" r="3.5" fill="#2457d6"/>
  <line x1="350" y1="325" x2="235" y2="295" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>

  <!-- Output Line Vout -->
  <line x1="350" y1="325" x2="435" y2="325" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="435" cy="325" r="4" fill="#2457d6"/>
  <text x="350" y="360" font-size="12" font-weight="bold" fill="#2457d6">Вихідний ротор</text>
  <text x="430" y="314" text-anchor="end" font-size="13" font-weight="bold" fill="#2457d6">Vout</text>

  <!-- Right Panel: Spatial Deck Diagram -->
  <rect x="495" y="75" width="435" height="455" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="712" y="103" text-anchor="middle" font-size="15" font-weight="bold" fill="#2457d6">Просторове розпаювання на галеті</text>

  <!-- Wafer Ceramic Body -->
  <circle cx="712" cy="305" r="145" fill="#ffffff" stroke="#d0d7de" stroke-width="2.5"/>
  <circle cx="712" cy="305" r="130" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Central Rotor Ring / Wiper Collector Bus -->
  <circle cx="712" cy="305" r="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <circle cx="712" cy="305" r="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="712" cy="305" r="6" fill="#1a1a1a"/>

  <!-- Solder Lugs -->
  <!-- Lug 0 -->
  <rect x="602" y="382" width="20" height="20" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="612" cy="392" r="4" fill="#d0d7de"/>
  <text x="612" y="374" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">0</text>

  <!-- Lug 1 -->
  <rect x="587" y="295" width="20" height="20" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="597" cy="305" r="4" fill="#d0d7de"/>
  <text x="575" y="309" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">1</text>

  <!-- Lug 2 -->
  <rect x="602" y="208" width="20" height="20" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="612" cy="218" r="4" fill="#d0d7de"/>
  <text x="590" y="202" font-size="12" font-weight="bold" fill="#1a1a1a">2</text>

  <!-- Lug 3 (Active Selected) -->
  <rect x="702" y="180" width="20" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <circle cx="712" cy="190" r="4" fill="#2457d6"/>
  <text x="712" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">3 (Контакт)</text>

  <!-- Lug 4 -->
  <rect x="802" y="208" width="20" height="20" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="812" cy="218" r="4" fill="#d0d7de"/>
  <text x="824" y="202" font-size="12" font-weight="bold" fill="#1a1a1a">4</text>

  <!-- Lug 5 -->
  <rect x="817" y="295" width="20" height="20" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
  <circle cx="827" cy="305" r="4" fill="#27ae60"/>
  <text x="827" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">5</text>

  <!-- Point-to-Point Resistors between Lugs -->
  <!-- R1 between Lug 0 and Lug 1 -->
  <path d="M 612 392 L 604 348" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="594" y="338" width="20" height="20" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" transform="rotate(-10 604 348)"/>
  <text x="622" y="352" font-size="11" font-weight="bold" fill="#1a1a1a">R1</text>
  <path d="M 604 348 L 597 305" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- R2 between Lug 1 and Lug 2 -->
  <path d="M 597 305 L 604 261" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="594" y="251" width="20" height="20" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" transform="rotate(10 604 261)"/>
  <text x="622" y="265" font-size="11" font-weight="bold" fill="#1a1a1a">R2</text>
  <path d="M 604 261 L 612 218" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- R3 between Lug 2 and Lug 3 -->
  <path d="M 612 218 L 662 204" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="652" y="194" width="20" height="20" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" transform="rotate(-15 662 204)"/>
  <text x="662" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">R3</text>
  <path d="M 662 204 L 712 190" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- R4 between Lug 3 and Lug 4 -->
  <path d="M 712 190 L 762 204" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="752" y="194" width="20" height="20" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" transform="rotate(15 762 204)"/>
  <text x="762" y="230" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">R4</text>
  <path d="M 762 204 L 812 218" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- R5 between Lug 4 and Lug 5 -->
  <path d="M 812 218 L 820 261" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="810" y="251" width="20" height="20" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" transform="rotate(-10 820 261)"/>
  <text x="802" y="265" text-anchor="end" font-size="11" font-weight="bold" fill="#1a1a1a">R5</text>
  <path d="M 820 261 L 827 305" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Wiper Rotor Arm -->
  <line x1="712" y1="305" x2="712" y2="195" stroke="#2457d6" stroke-width="3.5" marker-end="url(#arr-blue)"/>

  <!-- Output Wire from Central Rotor Bus -->
  <line x1="712" y1="305" x2="712" y2="445" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="712" cy="445" r="4" fill="#2457d6"/>
  <text x="712" y="468" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Вихід Vout (Центральний ротор)</text>

  <!-- Input Wire to Lug 5 -->
  <line x1="827" y1="305" x2="890" y2="305" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="890" cy="305" r="4" fill="#27ae60"/>
  <text x="890" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Вхід Vin</text>

  <!-- GND Wire from Lug 0 -->
  <line x1="612" y1="392" x2="540" y2="392" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="540" y1="382" x2="540" y2="402" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="535" y1="387" x2="535" y2="397" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="530" y1="390" x2="530" y2="394" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="535" y="418" text-anchor="middle" font-size="12" fill="#6b7280">GND</text>

  <!-- Annotations / Callouts -->
  <text x="775" y="368" text-anchor="middle" font-size="12" fill="#6b7280">Секція галети</text>

  <!-- Legend Box at bottom center -->
  <rect x="520" y="480" width="385" height="38" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <circle cx="535" cy="499" r="5" fill="#2457d6"/>
  <text x="548" y="503" font-size="12" fill="#1a1a1a">Роторний контакт</text>
  <rect x="660" y="492" width="14" height="14" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="680" y="503" font-size="12" fill="#1a1a1a">Резистори R1..R5</text>
  <circle cx="795" cy="499" r="5" fill="#27ae60"/>
  <text x="808" y="503" font-size="12" fill="#1a1a1a">Вхідний сигнал</text>

</svg>
