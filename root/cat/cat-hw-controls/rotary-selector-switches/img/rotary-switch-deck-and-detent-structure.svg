<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Будова галети та кулькового фіксатора позицій (Detent Mechanism)</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Пружинні кульки фіксують кут повороту валу, а роторна пелюстка комутує статорні контакти</text>

  <!-- PANEL 1: DETENT MECHANISM -->
  <rect x="30" y="70" width="435" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247" y="95" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Механізм фіксації позицій (Detent Mechanism)</text>

  <!-- Rotation Step Arrow -->
  <path d="M 217,135 A 110,110 0 0,1 277,135" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="247" y="120" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Крок 30°</text>

  <!-- Label Disc Top -->
  <text x="247" y="148" font-size="12" fill="#1a1a1a" text-anchor="middle">Зубчастий диск фіксатора</text>

  <!-- Star Wheel / Detent Disc -->
  <circle cx="247" cy="238" r="75" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <!-- 12 Notch indentations -->
  <circle cx="322" cy="238" r="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="172" cy="238" r="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="247" cy="163" r="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="247" cy="313" r="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="312" cy="275.5" r="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="284.5" cy="303" r="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="209.5" cy="303" r="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="182" cy="275.5" r="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="182" cy="200.5" r="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="209.5" cy="173" r="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="284.5" cy="173" r="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="312" cy="200.5" r="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Central Shaft -->
  <circle cx="247" cy="238" r="26" fill="#d0d7de" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="247" cy="238" r="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="237" y1="238" x2="257" y2="238" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="247" y1="228" x2="247" y2="248" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Left Detent Ball & Spring Assembly -->
  <rect x="55" y="223" width="45" height="30" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <path d="M 100,238 L 108,231 L 116,245 L 124,231 L 132,245 L 140,231 L 148,238" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="162" cy="238" r="11" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>

  <!-- Right Detent Ball & Spring Assembly -->
  <rect x="394" y="223" width="45" height="30" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <path d="M 394,238 L 386,231 L 378,245 L 370,231 L 362,245 L 354,231 L 346,238" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="332" cy="238" r="11" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>

  <!-- Labels for Panel 1 -->
  <text x="105" y="175" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Сталева кулька</text>
  <line x1="105" y1="182" x2="152" y2="228" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <text x="105" y="302" font-size="12" fill="#1a1a1a" text-anchor="middle">Пружина притиску</text>
  <line x1="105" y1="288" x2="120" y2="252" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="247" y="362" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Центральний поворотний вал</text>
  <line x1="247" y1="346" x2="247" y2="270" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Explanatory footer panel 1 -->
  <rect x="40" y="388" width="415" height="35" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="247" y="410" font-size="12" fill="#6b7280" text-anchor="middle">Зусилля пружини гарантує чітку фіксацію кута та тактильний клік</text>

  <!-- PANEL 2: WAFER / DECK ASSEMBLY -->
  <rect x="495" y="70" width="435" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="712" y="95" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Секція галети (Wafer / Deck Assembly)</text>

  <!-- Wafer Plate (Ceramic / Bakelite Base) -->
  <circle cx="712" cy="238" r="95" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <circle cx="712" cy="238" r="85" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Top Label Base -->
  <text x="545" y="125" font-size="12" font-weight="bold" fill="#c0392b">Гетинакс / Кераміка</text>
  <line x1="615" y1="130" x2="645" y2="160" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Common Ring (COM Arc) -->
  <path d="M 667,238 A 45,45 0 1,1 757,238" fill="none" stroke="#27ae60" stroke-width="5" stroke-linecap="round"/>
  <line x1="712" y1="132" x2="712" y2="193" stroke="#27ae60" stroke-width="2.5"/>
  <text x="712" y="125" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">COM (Спільний)</text>

  <!-- Stator Terminals and Lugs -->
  <!-- P1 (Active Position, 30°) -->
  <circle cx="772.6" cy="203" r="6" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="772.6" y1="203" x2="810" y2="181" stroke="#2457d6" stroke-width="3"/>
  <text x="822" y="185" font-size="12" font-weight="bold" fill="#2457d6">P1</text>

  <!-- P2 -->
  <circle cx="782" cy="238" r="6" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="782" y1="238" x2="820" y2="238" stroke="#6b7280" stroke-width="2.5"/>
  <text x="832" y="242" font-size="12" fill="#6b7280">P2</text>

  <!-- P3 -->
  <circle cx="772.6" cy="273" r="6" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="772.6" y1="273" x2="810" y2="295" stroke="#6b7280" stroke-width="2.5"/>
  <text x="822" y="299" font-size="12" fill="#6b7280">P3</text>

  <!-- P4 -->
  <circle cx="651.4" cy="273" r="6" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="651.4" y1="273" x2="614" y2="295" stroke="#6b7280" stroke-width="2.5"/>
  <text x="602" y="299" font-size="12" fill="#6b7280" text-anchor="end">P4</text>

  <!-- P5 -->
  <circle cx="642" cy="238" r="6" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="642" y1="238" x2="604" y2="238" stroke="#6b7280" stroke-width="2.5"/>
  <text x="592" y="242" font-size="12" fill="#6b7280" text-anchor="end">P5</text>

  <!-- P6 -->
  <circle cx="651.4" cy="203" r="6" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="651.4" y1="203" x2="614" y2="181" stroke="#6b7280" stroke-width="2.5"/>
  <text x="602" y="181" font-size="12" fill="#6b7280" text-anchor="end">P6</text>

  <!-- Rotor Hub & Contact Blade -->
  <circle cx="712" cy="238" r="25" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <circle cx="712" cy="238" r="13" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Rotating Blade connecting COM to P1 -->
  <polygon points="707,230 775,199 770,207 717,246" fill="#2457d6" stroke="#1a1a1a" stroke-width="1"/>
  <circle cx="772.6" cy="203" r="8" fill="none" stroke="#27ae60" stroke-width="2"/>

  <!-- Labels for Panel 2 -->
  <text x="830" y="125" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Рухомий контакт ротора</text>
  <text x="830" y="140" font-size="12" fill="#6b7280" text-anchor="middle">(з'єднує COM з P1)</text>
  <line x1="785" y1="148" x2="745" y2="215" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <text x="712" y="355" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Шина спільних контактів (COM)</text>
  <line x1="712" y1="342" x2="712" y2="288" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-green)"/>

  <!-- Explanatory footer panel 2 -->
  <rect x="505" y="388" width="415" height="35" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="712" y="410" font-size="12" fill="#6b7280" text-anchor="middle">Самоочисні контакти ковзають по платі, знімаючи оксидний шар</text>
</svg>
