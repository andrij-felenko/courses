<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схемотехніка АЦП-селектора на 12-позиційному галетному перемикачі</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Резистивна драбина формує 12 дискретних рівнів напруги з захисними інтервалами обриву та КЗ</text>

  <!-- ==================== LEFT PANEL: SCHEMATIC ==================== -->
  <rect x="30" y="75" width="455" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="50" y="100" font-size="14" font-weight="bold" fill="#1a1a1a">1. Схема резистивної драбини та фільтрації</text>

  <!-- Power node Vref (+3.3V) -->
  <text x="90" y="120" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">+3.3V (V_ref)</text>
  <circle cx="90" cy="126" r="3" fill="#2457d6"/>
  <line x1="90" y1="126" x2="90" y2="140" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- R_top (Top Diagnostic Resistor) -->
  <rect x="80" y="140" width="20" height="30" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="112" y="159" font-size="11" fill="#1a1a1a">R_top (Крайовий R)</text>

  <line x1="90" y1="170" x2="90" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Contact P1 (3.0V) -->
  <circle cx="90" cy="180" r="4" fill="#27ae60"/>
  <text x="75" y="184" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="end">P1 (3.0V)</text>

  <line x1="90" y1="180" x2="90" y2="195" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Resistor Ladder Block (R1...R11) -->
  <rect x="80" y="195" width="20" height="90" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="3"/>
  <text x="72" y="244" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="end">R1...R11</text>
  <text x="72" y="258" font-size="10" fill="#6b7280" text-anchor="end">(Драбина)</text>

  <line x1="90" y1="285" x2="90" y2="300" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Contact P12 (0.3V) -->
  <circle cx="90" cy="300" r="4" fill="#27ae60"/>
  <text x="75" y="304" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="end">P12 (0.3V)</text>

  <line x1="90" y1="300" x2="90" y2="315" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- R_bot (Bottom Diagnostic Resistor) -->
  <rect x="80" y="315" width="20" height="30" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="112" y="334" font-size="11" fill="#1a1a1a">R_bot (Крайовий R)</text>

  <line x1="90" y1="345" x2="90" y2="365" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Ground symbol left panel -->
  <line x1="75" y1="365" x2="105" y2="365" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="80" y1="370" x2="100" y2="370" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="85" y1="375" x2="95" y2="375" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Selector Wiper (Ротор) -->
  <circle cx="210" cy="240" r="4" fill="#1a1a1a"/>
  <!-- Wiper lever connected to P1 contact (or P_k) -->
  <line x1="210" y1="240" x2="95" y2="182" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="210" y="260" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">COM (Вихід)</text>

  <!-- Output Signal Line -->
  <path d="M 210 240 L 360 240" fill="none" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="285" y="232" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">V_ADC</text>

  <!-- Filter Capacitor Cf (100 nF) -->
  <circle cx="310" cy="240" r="4" fill="#2457d6"/>
  <line x1="310" y1="240" x2="310" y2="278" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="298" y1="278" x2="322" y2="278" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="298" y1="286" x2="322" y2="286" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="310" y1="286" x2="310" y2="315" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- GND for Cf -->
  <line x1="298" y1="315" x2="322" y2="315" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="303" y1="320" x2="317" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="307" y1="325" x2="313" y2="325" stroke="#1a1a1a" stroke-width="1"/>

  <text x="330" y="288" font-size="11" font-weight="bold" fill="#2457d6">C_f = 100 nF</text>
  <text x="330" y="302" font-size="10" fill="#6b7280">Фільтр брязкоту</text>

  <!-- Target MCU Box -->
  <rect x="360" y="195" width="110" height="90" fill="white" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="415" y="222" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">МК (MCU)</text>
  <text x="415" y="242" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вхід АЦП</text>
  <text x="415" y="260" font-size="10" fill="#6b7280" text-anchor="middle">12-біт (0..4095)</text>

  <!-- ==================== RIGHT PANEL: VOLTAGE DISTRIBUTION ==================== -->
  <rect x="505" y="75" width="425" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="525" y="100" font-size="14" font-weight="bold" fill="#1a1a1a">2. Розподіл напруг та зони діагностики</text>

  <!-- Vertical Voltage Bar Outer -->
  <rect x="580" y="125" width="50" height="240" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="4"/>

  <!-- Top Fault Zone (Short to VCC / Open Circuit) -->
  <rect x="581" y="126" width="48" height="24" fill="#fdecea" rx="3"/>
  <line x1="575" y1="150" x2="635" y2="150" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="645" y="142" font-size="11" font-weight="bold" fill="#c0392b">Зона помилки: КЗ на VCC / Обрив (&gt;3.0V)</text>

  <!-- Bottom Fault Zone (Short to GND) -->
  <rect x="581" y="340" width="48" height="24" fill="#fdecea" rx="3"/>
  <line x1="575" y1="340" x2="635" y2="340" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="645" y="356" font-size="11" font-weight="bold" fill="#c0392b">Зона помилки: КЗ на GND (&lt;0.3V)</text>

  <!-- Voltage Ticks & Levels -->
  <!-- P1 Level (3.0V) -->
  <line x1="575" y1="150" x2="585" y2="150" stroke="#27ae60" stroke-width="2"/>
  <text x="570" y="154" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="end">P1 (3.0V)</text>

  <!-- Intermediate Ticks for P2..P11 -->
  <line x1="578" y1="167" x2="583" y2="167" stroke="#6b7280" stroke-width="1"/>
  <line x1="578" y1="184" x2="583" y2="184" stroke="#6b7280" stroke-width="1"/>
  <line x1="578" y1="201" x2="583" y2="201" stroke="#6b7280" stroke-width="1"/>
  <line x1="578" y1="218" x2="583" y2="218" stroke="#6b7280" stroke-width="1"/>

  <!-- P6 Level (1.75V) with Hysteresis Window -->
  <rect x="585" y="227" width="40" height="16" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="2"/>
  <line x1="575" y1="235" x2="625" y2="235" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="570" y="239" font-size="11" fill="#1a1a1a" text-anchor="end">P6 (1.75V)</text>

  <line x1="625" y1="235" x2="645" y2="235" stroke="#27ae60" stroke-width="1.5"/>
  <text x="650" y="239" font-size="11" font-weight="bold" fill="#27ae60">Вікно допуску P6 (1.75V ± ΔV)</text>

  <line x1="578" y1="252" x2="583" y2="252" stroke="#6b7280" stroke-width="1"/>
  <line x1="578" y1="269" x2="583" y2="269" stroke="#6b7280" stroke-width="1"/>
  <line x1="578" y1="286" x2="583" y2="286" stroke="#6b7280" stroke-width="1"/>
  <line x1="578" y1="303" x2="583" y2="303" stroke="#6b7280" stroke-width="1"/>
  <line x1="578" y1="320" x2="583" y2="320" stroke="#6b7280" stroke-width="1"/>

  <!-- P12 Level (0.3V) -->
  <line x1="575" y1="340" x2="585" y2="340" stroke="#27ae60" stroke-width="2"/>
  <text x="570" y="344" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="end">P12 (0.3V)</text>

  <!-- Bottom Explanatory Box -->
  <rect x="525" y="380" width="385" height="60" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="717" y="398" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Апаратно-програмна діагностика:</text>
  <text x="717" y="415" font-size="11" fill="#1a1a1a" text-anchor="middle">• 12 стійких ступенів V_k з програмним гістерезисом</text>
  <text x="717" y="431" font-size="11" fill="#6b7280" text-anchor="middle">• Контроль крайніх зон дозволяє фіксувати обрив лінії та КЗ</text>
</svg>
