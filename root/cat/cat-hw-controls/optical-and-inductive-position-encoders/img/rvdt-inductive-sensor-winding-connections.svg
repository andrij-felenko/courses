<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема підключення обмоток RVDT-давача до аналогового фронтенду (AFE)</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Розпіновка ліній збудження EXC+/EXC-, вторинних каналів SIN/COS та заземлення екрана кабелю</text>

  <!-- PANEL 1: RVDT SENSOR WINDINGS -->
  <rect x="30" y="75" width="270" height="355" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="45" y="96" font-size="14" font-weight="bold" fill="#2457d6">Обмотки RVDT (Трансформатор)</text>

  <!-- Sub-block 1.1: Primary Excitation Winding -->
  <rect x="45" y="115" width="240" height="85" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="133" font-size="13" font-weight="bold" fill="#2457d6">Первинна обмотка EXC</text>
  <text x="55" y="153" font-size="12" fill="#1a1a1a">Виводи EXC+ (Pin 1) / EXC- (Pin 2)</text>
  <text x="55" y="173" font-size="12" fill="#6b7280">Опорне синусоїдальне збудження</text>
  <text x="55" y="191" font-size="12" font-weight="bold" fill="#2457d6">V_exc = 7 V_rms, f = 10 kHz</text>

  <!-- Sub-block 1.2: Secondary SIN Winding -->
  <rect x="45" y="215" width="240" height="90" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="233" font-size="13" font-weight="bold" fill="#27ae60">Вторинна обмотка SIN</text>
  <text x="55" y="253" font-size="12" fill="#1a1a1a">Виводи SIN+ (Pin 3) / SIN- (Pin 4)</text>
  <text x="55" y="273" font-size="12" font-weight="bold" fill="#27ae60">V_sin = V_m·sin(θ)·sin(ωt)</text>
  <text x="55" y="293" font-size="12" fill="#6b7280">Диференціальний вихід синуса</text>

  <!-- Sub-block 1.3: Secondary COS Winding -->
  <rect x="45" y="315" width="240" height="90" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="333" font-size="13" font-weight="bold" fill="#27ae60">Вторинна обмотка COS</text>
  <text x="55" y="353" font-size="12" fill="#1a1a1a">Виводи COS+ (Pin 5) / COS- (Pin 6)</text>
  <text x="55" y="373" font-size="12" font-weight="bold" fill="#27ae60">V_cos = V_m·cos(θ)·sin(ωt)</text>
  <text x="55" y="393" font-size="12" fill="#6b7280">Диференціальний вихід косинуса</text>

  <!-- PANEL 2: SHIELDED CABLE HARNESS -->
  <rect x="330" y="75" width="270" height="355" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="345" y="96" font-size="14" font-weight="bold" fill="#1a1a1a">Кабельний шлейф та екран</text>

  <!-- Sub-block 2.1: Shielded Twisted Pairs -->
  <rect x="345" y="115" width="240" height="185" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="355" y="133" font-size="13" font-weight="bold" fill="#1a1a1a">Екрановані кручені пари</text>
  <text x="355" y="155" font-size="12" font-weight="bold" fill="#2457d6">Пара 1: EXC+ / EXC- (Збудження)</text>
  <text x="355" y="180" font-size="12" font-weight="bold" fill="#27ae60">Пара 2: SIN+ / SIN- (Канал A)</text>
  <text x="355" y="205" font-size="12" font-weight="bold" fill="#27ae60">Пара 3: COS+ / COS- (Канал B)</text>
  <text x="355" y="235" font-size="12" fill="#6b7280">Подвійне екранування (Фольга+Плетива)</text>
  <text x="355" y="258" font-size="12" fill="#1a1a1a">Зменшення синфазних наведень</text>

  <!-- Sub-block 2.2: Shield Grounding -->
  <rect x="345" y="315" width="240" height="90" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="355" y="333" font-size="13" font-weight="bold" fill="#2457d6">Заземлення екрана (Shield Ground)</text>
  <text x="355" y="353" font-size="12" fill="#1a1a1a">360° обтиск на корпус роз'єму PE</text>
  <text x="355" y="373" font-size="12" font-weight="bold" fill="#2457d6">Паралельний RC-ланцюг R=1MΩ, C=10nF</text>
  <text x="355" y="393" font-size="12" fill="#6b7280">Розрив контуру земляної петлі</text>

  <!-- PANEL 3: ANALOG FRONT-END INTERFACE -->
  <rect x="630" y="75" width="300" height="355" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="645" y="96" font-size="14" font-weight="bold" fill="#27ae60">Інтерфейсний модуль AFE</text>

  <!-- Sub-block 3.1: Excitation Driver Stage -->
  <rect x="645" y="115" width="270" height="85" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="655" y="133" font-size="13" font-weight="bold" fill="#2457d6">Драйвер збудження EXC</text>
  <text x="655" y="153" font-size="12" fill="#1a1a1a">Операційний підсилювач потужності</text>
  <text x="655" y="173" font-size="12" fill="#6b7280">Захист від КЗ та перенапруги TVS</text>
  <text x="655" y="191" font-size="12" font-weight="bold" fill="#2457d6">Формувач опорної напруги 10 кГц</text>

  <!-- Sub-block 3.2: Differential Filters -->
  <rect x="645" y="210" width="270" height="100" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="655" y="228" font-size="13" font-weight="bold" fill="#27ae60">Вхідні диференціальні ФНЧ</text>
  <text x="655" y="248" font-size="12" fill="#1a1a1a">Пасивний RC-фільтр f_c = 50 кГц</text>
  <text x="655" y="268" font-size="12" font-weight="bold" fill="#27ae60">Супресори TVS (ESD protection 15kV)</text>
  <text x="655" y="288" font-size="12" fill="#6b7280">Придушення високочастотного шуму</text>

  <!-- Sub-block 3.3: RDC Converter Chip -->
  <rect x="645" y="320" width="270" height="90" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="655" y="338" font-size="13" font-weight="bold" fill="#27ae60">Перетворювач RDC / АЦП (Resolver-to-Digital)</text>
  <text x="655" y="358" font-size="12" fill="#1a1a1a">Синхронне демодулювання та обчислення θ</text>
  <text x="655" y="378" font-size="12" font-weight="bold" fill="#27ae60">Цифровий код кута положення (16 біт)</text>
  <text x="655" y="398" font-size="12" fill="#6b7280">Інтерфейс SPI / Інкрементальний вихід</text>

  <!-- SIGNAL WIRES BETWEEN PANELS -->
  <!-- EXC Line (Power Driver -> Primary Winding) -->
  <path d="M 645,155 L 285,155" fill="none" stroke="#2457d6" stroke-width="2" marker-start="url(#arr-blue)"/>
  <text x="310" y="148" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">EXC+/EXC-</text>

  <!-- SIN Line (Secondary SIN -> AFE Filters) -->
  <path d="M 285,250 L 645,250" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="310" y="243" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">SIN+/SIN-</text>

  <!-- COS Line (Secondary COS -> AFE Filters) -->
  <path d="M 285,355 L 615,355 L 615,280 L 645,280" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="310" y="348" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">COS+/COS-</text>

  <!-- Internal AFE Filters -> RDC Chip -->
  <line x1="780" y1="310" x2="780" y2="320" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

</svg>
