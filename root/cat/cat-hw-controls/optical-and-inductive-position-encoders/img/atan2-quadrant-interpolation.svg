<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Маркери стрілок -->
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Тригонометрична інтерполяція кута функцією atan2(V_sin, V_cos)</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Безперервне обчислення кута θ в усіх чотирьох квадрантах на фазовій площині</text>

  <!-- ПАНЕЛЬ 1: СИНУСНО-КОСИНУСНІ СИГНАЛИ -->
  <g id="panel-signals">
    <!-- Рамка панелі 1 -->
    <rect x="30" y="80" width="435" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

    <!-- Заголовок панелі 1 -->
    <rect x="42" y="92" width="411" height="34" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
    <text x="247.5" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">1. Ортогональні сигнали V_sin(θ) та V_cos(θ)</text>

    <!-- Осі координат для сигналів -->
    <line x1="80" y1="230" x2="435" y2="230" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
    <line x1="80" y1="320" x2="80" y2="140" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
    <text x="440" y="234" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">θ</text>
    <text x="80" y="132" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">V</text>

    <!-- Вертикальні роздільники квадрантів -->
    <line x1="160" y1="140" x2="160" y2="320" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="240" y1="140" x2="240" y2="320" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="320" y1="140" x2="320" y2="320" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="400" y1="140" x2="400" y2="320" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Підписи квадрантів зверху -->
    <text x="120" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">I</text>
    <text x="200" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">II</text>
    <text x="280" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">III</text>
    <text x="360" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">IV</text>

    <!-- Позначки кутів на осі X -->
    <text x="80" y="248" text-anchor="middle" font-size="12" fill="#6b7280">0°</text>
    <text x="160" y="248" text-anchor="middle" font-size="12" fill="#6b7280">90°</text>
    <text x="240" y="248" text-anchor="middle" font-size="12" fill="#6b7280">180°</text>
    <text x="320" y="248" text-anchor="middle" font-size="12" fill="#6b7280">270°</text>
    <text x="400" y="248" text-anchor="middle" font-size="12" fill="#6b7280">360°</text>

    <!-- Синусоїда (Синя) V_sin -->
    <path d="M 80,230 C 120,170 120,170 160,170 C 200,170 200,230 240,230 C 280,230 280,290 320,290 C 360,290 360,230 400,230" stroke="#2457d6" stroke-width="2.5" fill="none"/>
    <text x="165" y="165" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">V_sin</text>

    <!-- Косинусоїда (Зелена) V_cos -->
    <path d="M 80,170 C 120,170 120,230 160,230 C 200,230 200,290 240,290 C 280,290 280,230 320,230 C 360,230 360,170 400,170" stroke="#27ae60" stroke-width="2.5" fill="none"/>
    <text x="85" y="165" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">V_cos</text>

    <!-- Підсумок для панелі 1 -->
    <rect x="42" y="380" width="411" height="38" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
    <text x="247.5" y="403" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">V_sin = V₀·sin(θ)  |  V_cos = V₀·cos(θ) (зсув 90°)</text>
  </g>

  <!-- ПАНЕЛЬ 2: ФАЗОВА ПЛОЩИНА ТА 4 КВАДРАНТИ ATAN2 -->
  <g id="panel-phase-plane">
    <!-- Рамка панелі 2 -->
    <rect x="495" y="80" width="435" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

    <!-- Заголовок панелі 2 -->
    <rect x="507" y="92" width="411" height="34" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
    <text x="712.5" y="114" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">2. Фазова площина (V_cos, V_sin) та 4 квадранти</text>

    <!-- Осі фазової площини -->
    <line x1="570" y1="230" x2="860" y2="230" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
    <line x1="712.5" y1="325" x2="712.5" y2="135" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
    <text x="865" y="234" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">V_cos</text>
    <text x="712.5" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">V_sin</text>

    <!-- Одиничне коло радіуса V0 -->
    <circle cx="712.5" cy="230" r="85" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>

    <!-- Підписи квадрантів та знаків сигналів -->
    <!-- Квадрант I -->
    <text x="770" y="165" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">Квадрант I (0°..90°)</text>
    <text x="770" y="180" text-anchor="start" font-size="12" fill="#6b7280">(V_cos &gt; 0, V_sin &gt; 0)</text>

    <!-- Квадрант II -->
    <text x="655" y="165" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">Квадрант II (90°..180°)</text>
    <text x="655" y="180" text-anchor="end" font-size="12" fill="#6b7280">(V_cos &lt; 0, V_sin &gt; 0)</text>

    <!-- Квадрант III -->
    <text x="655" y="295" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">Квадрант III (180°..270°)</text>
    <text x="655" y="310" text-anchor="end" font-size="12" fill="#6b7280">(V_cos &lt; 0, V_sin &lt; 0)</text>

    <!-- Квадрант IV -->
    <text x="770" y="295" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">Квадрант IV (270°..360°)</text>
    <text x="770" y="310" text-anchor="start" font-size="12" fill="#6b7280">(V_cos &gt; 0, V_sin &lt; 0)</text>

    <!-- Вектор поточного кута θ (45°) -->
    <line x1="712.5" y1="230" x2="772.6" y2="169.9" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
    <circle cx="772.6" cy="169.9" r="4" fill="#c0392b"/>

    <!-- Дуга кута θ -->
    <path d="M 742.5,230 A 30,30 0 0,0 733.7,208.8" stroke="#c0392b" stroke-width="1.5" fill="none"/>
    <text x="748" y="215" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">θ</text>

    <!-- Підсумок для панелі 2 -->
    <rect x="507" y="380" width="411" height="38" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
    <text x="712.5" y="403" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">θ = atan2(V_sin, V_cos) — безневизначне обчислення кута [0, 2π)</text>
  </g>
</svg>
