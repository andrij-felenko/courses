<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Title Section -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Будова та принципова схема індуктивного давача RVDT</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Обертання кулачкового ротора змінює магнітний опір і вихідні напруги V₁ = V_m sin(θ) sin(ω_c t), V₂ = V_m cos(θ) sin(ω_c t)</text>

  <!-- Panel 1: Construction (Left Panel) -->
  <rect x="30" y="75" width="430" height="380" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="245" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Конструкція статора та ротора</text>

  <!-- Stator Structure -->
  <circle cx="245" cy="240" r="110" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="245" cy="240" r="75" fill="white" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Magnetic Poles -->
  <!-- Top Pole (Pri) -->
  <rect x="230" y="130" width="30" height="35" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5" rx="3"/>
  <text x="245" y="122" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Обмотка Pri (V_exc)</text>

  <!-- Bottom Pole (Pri Return) -->
  <rect x="230" y="315" width="30" height="35" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5" rx="3"/>
  <text x="245" y="366" font-size="12" fill="#6b7280" text-anchor="middle">Pri (протифаза)</text>

  <!-- Left Pole (Sec 1) -->
  <rect x="135" y="225" width="35" height="30" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5" rx="3"/>
  <text x="125" y="244" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Sec 1 (sin)</text>

  <!-- Right Pole (Sec 2) -->
  <rect x="310" y="225" width="35" height="30" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5" rx="3"/>
  <text x="355" y="244" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Sec 2 (cos)</text>

  <!-- Cam Rotor -->
  <path d="M 225,240 C 225,200 245,185 270,210 C 295,235 285,275 245,275 C 225,275 225,260 225,240 Z" fill="#d0d7de" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="245" cy="240" r="16" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="245" y="244" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вал</text>

  <!-- Reference Axis & Rotor Angle Arc -->
  <line x1="245" y1="240" x2="245" y2="185" stroke="#6b7280" stroke-dasharray="3,3" stroke-width="1.5"/>
  <line x1="245" y1="240" x2="275" y2="195" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M 245,200 A 40,40 0 0,1 264,206" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="258" y="188" font-size="13" font-weight="bold" fill="#2457d6">θ</text>

  <!-- Explanatory Bullets -->
  <text x="45" y="395" font-size="12" fill="#1a1a1a">• g(θ) — змінний товщинний зазор під полюсами</text>
  <text x="45" y="415" font-size="12" fill="#1a1a1a">• R_m = g(θ) / (μ₀·A) — магнітний опір зазору</text>
  <text x="45" y="435" font-size="12" fill="#1a1a1a">• M₁(θ) = M₀·sin(θ),   M₂(θ) = M₀·cos(θ)</text>

  <!-- Panel 2: Schematic & Signal Processing (Right Panel) -->
  <rect x="490" y="75" width="440" height="380" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="710" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Принципова схема та обробка сигналів</text>

  <!-- Excitation Generator Box -->
  <rect x="508" y="134" width="130" height="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="573" y="154" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Джерело збудження</text>
  <text x="573" y="171" font-size="12" fill="#1a1a1a" text-anchor="middle">V_exc = V_m sin(ω_c t)</text>

  <!-- Connection to Primary Coil -->
  <path d="M 638,159 L 660,159" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Primary Transformer Coil Symbol -->
  <rect x="660" y="137" width="35" height="44" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="3"/>
  <text x="677" y="125" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Pri</text>
  <path d="M 677,142 C 670,147 670,157 677,159 C 670,162 670,172 677,177" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Rotor Label Box & Connector (to avoid line-text intersection) -->
  <rect x="540" y="195" width="98" height="26" fill="white" stroke="#6b7280" stroke-width="1" rx="4"/>
  <text x="589" y="212" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Ротор (кут θ)</text>
  <line x1="638" y1="208" x2="693" y2="208" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr)"/>

  <!-- Rotor Core Symbol on Magnetic Axis -->
  <rect x="695" y="196" width="24" height="24" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="3"/>
  <text x="707" y="212" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">θ</text>

  <!-- Magnetic Coupling / Core Lines (Broken into Top and Bottom segments around Rotor block) -->
  <line x1="703" y1="125" x2="703" y2="190" stroke="#1a1a1a" stroke-dasharray="4,3" stroke-width="2"/>
  <line x1="711" y1="125" x2="711" y2="190" stroke="#1a1a1a" stroke-dasharray="4,3" stroke-width="2"/>

  <line x1="703" y1="226" x2="703" y2="255" stroke="#1a1a1a" stroke-dasharray="4,3" stroke-width="2"/>
  <line x1="711" y1="226" x2="711" y2="255" stroke="#1a1a1a" stroke-dasharray="4,3" stroke-width="2"/>

  <!-- Secondary Coil 1 -->
  <rect x="725" y="130" width="35" height="44" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="3"/>
  <text x="742" y="123" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Sec 1</text>
  <path d="M 742,135 C 735,140 735,150 742,152 C 735,155 735,165 742,170" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Secondary Coil 2 -->
  <rect x="725" y="210" width="35" height="44" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="3"/>
  <text x="742" y="203" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Sec 2</text>
  <path d="M 742,215 C 735,220 735,230 742,232 C 735,235 735,245 742,250" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Secondary Outputs to Formula Boxes -->
  <path d="M 760,152 L 765,152" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="765" y="133" width="154" height="38" fill="white" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="842" y="156" font-size="11.5" font-weight="bold" fill="#2457d6" text-anchor="middle">V₁ = V_m sin(θ) sin(ω_c t)</text>

  <path d="M 760,232 L 765,232" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <rect x="765" y="213" width="154" height="38" fill="white" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="842" y="236" font-size="11.5" font-weight="bold" fill="#2457d6" text-anchor="middle">V₂ = V_m cos(θ) sin(ω_c t)</text>

  <!-- Demodulator & Processing Block -->
  <rect x="505" y="280" width="415" height="155" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="712" y="303" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Синхронний демодулятор та раціометричний розрахунок</text>

  <text x="522" y="326" font-size="12" fill="#1a1a1a">1) Фазочутлива демодуляція огинаючих сигналів:</text>
  <text x="542" y="346" font-size="12" font-weight="bold" fill="#1a1a1a">U_sin = K · V_m · sin(θ),   U_cos = K · V_m · cos(θ)</text>

  <text x="522" y="373" font-size="12" fill="#1a1a1a">2) Раціометричне ділення (усуває амплітудний дрейф V_m):</text>
  <text x="542" y="395" font-size="12" font-weight="bold" fill="#1a1a1a">U_sin / U_cos = tan(θ)</text>

  <text x="522" y="422" font-size="13" font-weight="bold" fill="#27ae60">3) Вихідне кутове значення:   θ = atan2(U_sin, U_cos)</text>
</svg>
