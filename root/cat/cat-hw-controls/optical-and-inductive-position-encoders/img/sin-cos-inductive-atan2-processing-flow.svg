<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Маркери стрілок -->
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Конвеєр обробки синусно-косинусних сигналів індуктивного давача</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Послідовність фільтрації, компенсації розбалансу АЦП та обчислення кута через atan2</text>

  <!-- СТРІЛКИ ПОТОКУ МІЖ КАРТКАМИ -->
  <line x1="234" y1="107" x2="252" y2="107" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="456" y1="107" x2="474" y2="107" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="678" y1="107" x2="696" y2="107" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- КАРТКА 1: АЦП ТА ФІЛЬТРАЦІЯ -->
  <g id="stage-1">
    <!-- Тло картки 1 -->
    <rect x="30" y="80" width="204" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

    <!-- Заголовок картки 1 -->
    <rect x="38" y="90" width="188" height="34" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
    <text x="132" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">1. АЦП та ФНЧ-фільтр</text>

    <!-- Текст опису 1 -->
    <text x="45" y="145" font-size="11" font-weight="bold" fill="#1a1a1a">• Вхідні сигнали:</text>
    <text x="45" y="163" font-size="11" fill="#6b7280">V_sin_raw, V_cos_raw</text>
    <text x="45" y="185" font-size="11" font-weight="bold" fill="#1a1a1a">• Обробка:</text>
    <text x="45" y="203" font-size="11" fill="#6b7280">Оцифрування АЦП</text>
    <text x="45" y="221" font-size="11" fill="#6b7280">Приглушення шумів</text>

    <!-- Графічна область 1 (Шуми та зсув) -->
    <rect x="42" y="245" width="180" height="95" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <!-- Шумовий синусоїдальний сигнал -->
    <path d="M 47,295 Q 67,260 87,295 T 127,295 T 167,295 T 207,295" stroke="#2457d6" stroke-width="1.5" fill="none"/>
    <path d="M 47,265 Q 67,300 87,265 T 127,265 T 167,265 T 207,265" stroke="#c0392b" stroke-width="1.5" fill="none"/>
    <text x="132" y="330" text-anchor="middle" font-size="10" fill="#6b7280">Шуми та зсув нуля</text>

    <!-- Нижній блок статусу 1 -->
    <rect x="38" y="350" width="188" height="78" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <text x="132" y="370" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Вихід 1:</text>
    <text x="132" y="388" text-anchor="middle" font-size="11" fill="#2457d6">V_sin_filt</text>
    <text x="132" y="406" text-anchor="middle" font-size="11" fill="#c0392b">V_cos_filt</text>
  </g>

  <!-- КАРТКА 2: КОМПЕНСАЦІЯ РОЗБАЛАНСУ -->
  <g id="stage-2">
    <!-- Тло картки 2 -->
    <rect x="252" y="80" width="204" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

    <!-- Заголовок картки 2 -->
    <rect x="260" y="90" width="188" height="34" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
    <text x="354" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">2. Компенсація</text>

    <!-- Текст опису 2 -->
    <text x="262" y="145" font-size="11" font-weight="bold" fill="#1a1a1a">• Віднімання зсуву:</text>
    <text x="262" y="163" font-size="11" fill="#6b7280">V_corr = V - V_off</text>
    <text x="262" y="185" font-size="11" font-weight="bold" fill="#1a1a1a">• Масштабування k:</text>
    <text x="262" y="203" font-size="11" fill="#6b7280">V_norm = k · V_corr</text>
    <text x="262" y="221" font-size="11" font-weight="bold" fill="#27ae60">✓ V_sin² + V_cos² = 1</text>

    <!-- Графічна область 2 (Нормоване коло) -->
    <rect x="264" y="245" width="180" height="95" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <circle cx="354" cy="292" r="32" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="354" cy="292" r="2" fill="#1a1a1a"/>
    <line x1="354" y1="292" x2="378" y2="270" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
    <text x="354" y="333" text-anchor="middle" font-size="10" fill="#27ae60">Нормоване коло</text>

    <!-- Нижній блок статусу 2 -->
    <rect x="260" y="350" width="188" height="78" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <text x="354" y="370" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Вихід 2:</text>
    <text x="354" y="388" text-anchor="middle" font-size="11" fill="#27ae60">V_sin_norm</text>
    <text x="354" y="406" text-anchor="middle" font-size="11" fill="#27ae60">V_cos_norm</text>
  </g>

  <!-- КАРТКА 3: ОБЧИСЛЕННЯ atan2 -->
  <g id="stage-3">
    <!-- Тло картки 3 -->
    <rect x="474" y="80" width="204" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

    <!-- Заголовок картки 3 -->
    <rect x="482" y="90" width="188" height="34" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
    <text x="576" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">3. Розрахунок atan2</text>

    <!-- Текст опису 3 -->
    <text x="484" y="145" font-size="11" font-weight="bold" fill="#1a1a1a">• Формула кута:</text>
    <text x="484" y="163" font-size="11" font-weight="bold" fill="#2457d6">θ = atan2(V_sin, V_cos)</text>
    <text x="484" y="185" font-size="11" font-weight="bold" fill="#1a1a1a">• Діапазон:</text>
    <text x="484" y="203" font-size="11" fill="#6b7280">[-π, +π] (4 квадранти)</text>
    <text x="484" y="221" font-size="11" fill="#27ae60">Без невизначеностей</text>

    <!-- Графічна область 3 (Вектор кута atan2) -->
    <rect x="486" y="245" width="180" height="95" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <line x1="576" y1="250" x2="576" y2="330" stroke="#6b7280" stroke-width="1"/>
    <line x1="536" y1="290" x2="616" y2="290" stroke="#6b7280" stroke-width="1"/>
    <path d="M 596,290 A 20,20 0 0 0 588,274" fill="none" stroke="#2457d6" stroke-width="1.5"/>
    <line x1="576" y1="290" x2="600" y2="266" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
    <text x="595" y="262" font-size="10" font-weight="bold" fill="#2457d6">θ</text>

    <!-- Нижній блок статусу 3 -->
    <rect x="482" y="350" width="188" height="78" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <text x="576" y="370" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Вихід 3:</text>
    <text x="576" y="388" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Електричний кут θ_elec</text>
    <text x="576" y="406" text-anchor="middle" font-size="10" fill="#6b7280">Безперервний розрахунок</text>
  </g>

  <!-- КАРТКА 4: ВИХІДНІ ДАНІ (θ, ω) -->
  <g id="stage-4">
    <!-- Тло картки 4 -->
    <rect x="696" y="80" width="204" height="360" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>

    <!-- Заголовок картки 4 -->
    <rect x="704" y="90" width="188" height="34" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
    <text x="798" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">4. Вихідні дані (θ, ω)</text>

    <!-- Текст опису 4 -->
    <text x="706" y="145" font-size="11" font-weight="bold" fill="#1a1a1a">• Механічний кут:</text>
    <text x="706" y="163" font-size="11" fill="#6b7280">θ_mech = θ_elec / p</text>
    <text x="706" y="185" font-size="11" font-weight="bold" fill="#1a1a1a">• Багатооборотність:</text>
    <text x="706" y="203" font-size="11" fill="#6b7280">N_turn (підрахунок)</text>
    <text x="706" y="221" font-size="11" font-weight="bold" fill="#27ae60">• Кутова швидкість:</text>
    <text x="706" y="239" font-size="11" fill="#27ae60">ω = dθ / dt</text>

    <!-- Графічна область 4 (Абсолютний пилкоподібний кут θ(t)) -->
    <rect x="708" y="255" width="180" height="85" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <path d="M 715,325 L 755,275 M 755,325 L 795,275 M 795,325 L 835,275 M 835,325 L 875,275" stroke="#27ae60" stroke-width="2" fill="none"/>
    <text x="798" y="334" text-anchor="middle" font-size="10" font-weight="bold" fill="#27ae60">Абсолютний кут θ(t)</text>

    <!-- Нижній блок статусу 4 -->
    <rect x="704" y="350" width="188" height="78" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
    <text x="798" y="370" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Готовий вихід:</text>
    <text x="798" y="388" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Абсолютна позиція θ</text>
    <text x="798" y="406" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Швидкість обертання ω</text>
  </g>
</svg>
