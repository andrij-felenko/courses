<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="520" fill="white"/>
  
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Архітектура драйвера та потік даних QEI / RVDT</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Взаємодія апаратної периферії (QEI, АЦП, DMA) з обчислювальним API та регістрами кута</text>

  <!-- Column 1: Hardware Layer -->
  <rect x="30" y="95" width="240" height="365" rx="6" ry="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="30" y="95" width="240" height="35" rx="6" fill="#eaf0fd"/>
  <rect x="30" y="120" width="240" height="10" fill="#eaf0fd"/>
  <text x="150" y="117" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Апаратна периферія</text>

  <!-- Sub-box 1: QEI Hardware -->
  <rect x="42" y="140" width="216" height="125" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="150" y="160" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Канал QEI (Оптичний)</text>
  <text x="52" y="182" font-size="12" fill="#1a1a1a">• Входи A, B (фази 90°)</text>
  <text x="52" y="204" font-size="12" fill="#1a1a1a">• Індексний вхід Z (Ref)</text>
  <text x="52" y="226" font-size="12" fill="#6b7280">• Апаратний лічильник</text>
  <rect x="52" y="234" width="196" height="24" rx="4" fill="#eaf0fd"/>
  <text x="150" y="250" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Імпульсите QEI (Encoder)</text>

  <!-- Sub-box 2: RVDT Hardware -->
  <rect x="42" y="280" width="216" height="165" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="150" y="300" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Канал RVDT (Індуктивний)</text>
  <text x="52" y="322" font-size="12" fill="#1a1a1a">• Первинне збудження AC</text>
  <text x="52" y="344" font-size="12" fill="#1a1a1a">• Синусно-косинусні виходи</text>
  <text x="52" y="366" font-size="12" fill="#6b7280">• Буферизований DMA АЦП</text>
  <rect x="52" y="380" width="196" height="48" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="150" y="400" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Відліки АЦП (DMA Buffer)</text>
  <text x="150" y="418" font-size="11" fill="#6b7280" text-anchor="middle">Безперервний потік</text>

  <!-- Connecting Lines Col 1 -> Col 2 -->
  <line x1="258" y1="190" x2="342" y2="190" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="258" y1="285" x2="342" y2="285" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Column 2: Driver API & Algorithms -->
  <rect x="330" y="95" width="300" height="365" rx="6" ry="6" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <rect x="330" y="95" width="300" height="38" rx="6" fill="#2457d6"/>
  <rect x="330" y="123" width="300" height="10" fill="#2457d6"/>
  <text x="480" y="117" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2. API та Алгоритми Драйвера</text>

  <!-- Sub-box 1: QEI Math -->
  <rect x="342" y="140" width="276" height="85" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="160" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Декодування QEI &amp; Швидкість</text>
  <text x="352" y="182" font-size="12" fill="#1a1a1a">• Перерахунок імпульсів у кут θ_QEI</text>
  <text x="352" y="204" font-size="12" fill="#6b7280">• Розрахунок кутової швидкості ω</text>

  <!-- Sub-box 2: RVDT Math -->
  <rect x="342" y="235" width="276" height="100" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1"/>
  <text x="480" y="255" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Обробка RVDT &amp; Калібрування</text>
  <text x="352" y="277" font-size="12" fill="#1a1a1a">• Обчислення atan2(V_sin, V_cos)</text>
  <text x="352" y="299" font-size="12" fill="#1a1a1a">• Компенсація зсуву нуля та фази</text>
  <text x="352" y="321" font-size="11" fill="#6b7280">• Фільтрація огинаючої у градуси θ_RVDT</text>

  <!-- Sub-box 3: Cross-Comparison Engine -->
  <rect x="342" y="345" width="276" height="100" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="365" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Модуль Крос-Верифікації</text>
  <text x="352" y="387" font-size="12" font-weight="bold" fill="#1a1a1a">• Крос-порівняння: |θ_QEI - θ_RVDT| ≤ Δ</text>
  <text x="352" y="407" font-size="12" fill="#6b7280">• Контроль таймауту розходження</text>
  <text x="352" y="427" font-size="12" fill="#27ae60">• Формування достовірного кута θ_val</text>

  <!-- Connecting Lines Col 2 -> Col 3 -->
  <line x1="618" y1="190" x2="690" y2="190" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="618" y1="395" x2="690" y2="395" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Column 3: Output Registers & Diagnostics -->
  <rect x="690" y="95" width="240" height="365" rx="6" ry="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="690" y="95" width="240" height="35" rx="6" fill="#eaf0fd"/>
  <rect x="690" y="120" width="240" height="10" fill="#eaf0fd"/>
  <text x="810" y="117" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">3. Вихідні регістри та Аварії</text>

  <!-- Sub-box 1: Valid Position -->
  <rect x="702" y="140" width="216" height="125" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="810" y="160" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Достовірна координата</text>
  <text x="712" y="182" font-size="12" fill="#1a1a1a">• Узгоджений кут штурвала θ</text>
  <text x="712" y="204" font-size="12" fill="#27ae60">• Прапорець SystemHealthy=1</text>
  <rect x="712" y="216" width="196" height="38" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="810" y="239" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Передача в систему САУ</text>

  <!-- Sub-box 2: Fault & Diagnostics -->
  <rect x="702" y="280" width="216" height="165" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="810" y="300" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Діагностика та Аварії</text>
  <text x="712" y="322" font-size="12" fill="#1a1a1a">• Детекція пропуску кроків</text>
  <text x="712" y="344" font-size="12" fill="#c0392b">• Апаратний збій RVDT / QEI</text>
  <text x="712" y="366" font-size="12" fill="#6b7280">• Перемикання на резерв</text>
  <rect x="712" y="380" width="196" height="48" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="810" y="400" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Статус: Discrepancy Error</text>
  <text x="810" y="418" font-size="11" fill="#6b7280" text-anchor="middle">Блокування хибного кута</text>

  <!-- Bottom Legend Panel -->
  <rect x="30" y="475" width="900" height="35" rx="6" ry="6" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="160" y="497" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">■ Квадратурний канал QEI</text>
  <text x="480" y="497" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">■ Індуктивний канал RVDT</text>
  <text x="800" y="497" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">■ Крос-верифікація та Аварії</text>
</svg>
