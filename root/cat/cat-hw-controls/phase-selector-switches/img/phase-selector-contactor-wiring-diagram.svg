<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Header -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Перемикач фаз із контакторами та електричним блокуванням</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Перехресне блокування через NC-контакти унеможливлює міжфазне коротке замикання</text>

  <!-- SECTION A: 3-Phase Supply & Fuses -->
  <rect x="30" y="80" width="190" height="340" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="125" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мережа 3~ 400В</text>

  <!-- Phase L1 -->
  <text x="45" y="139" font-size="13" font-weight="bold" fill="#c0392b">L1</text>
  <line x1="65" y1="135" x2="145" y2="135" stroke="#c0392b" stroke-width="2"/>
  <!-- Fuse SF1 -->
  <rect x="145" y="123" width="40" height="24" fill="white" stroke="#c0392b" stroke-width="1.5" rx="2"/>
  <line x1="145" y1="135" x2="185" y2="135" stroke="#c0392b" stroke-width="1"/>
  <text x="165" y="117" font-size="12" fill="#c0392b" text-anchor="middle">SF1</text>
  <line x1="185" y1="135" x2="250" y2="135" stroke="#c0392b" stroke-width="2"/>
  <circle cx="210" cy="135" r="3.5" fill="#c0392b"/>

  <!-- Phase L2 -->
  <text x="45" y="189" font-size="13" font-weight="bold" fill="#d35400">L2</text>
  <line x1="65" y1="185" x2="145" y2="185" stroke="#d35400" stroke-width="2"/>
  <!-- Fuse SF2 -->
  <rect x="145" y="173" width="40" height="24" fill="white" stroke="#d35400" stroke-width="1.5" rx="2"/>
  <line x1="145" y1="185" x2="185" y2="185" stroke="#d35400" stroke-width="1"/>
  <text x="165" y="167" font-size="12" fill="#d35400" text-anchor="middle">SF2</text>
  <line x1="185" y1="185" x2="250" y2="185" stroke="#d35400" stroke-width="2"/>
  <circle cx="220" cy="185" r="3.5" fill="#d35400"/>

  <!-- Phase L3 -->
  <text x="45" y="239" font-size="13" font-weight="bold" fill="#2457d6">L3</text>
  <line x1="65" y1="235" x2="145" y2="235" stroke="#2457d6" stroke-width="2"/>
  <!-- Fuse SF3 -->
  <rect x="145" y="223" width="40" height="24" fill="white" stroke="#2457d6" stroke-width="1.5" rx="2"/>
  <line x1="145" y1="235" x2="185" y2="235" stroke="#2457d6" stroke-width="1"/>
  <text x="165" y="217" font-size="12" fill="#2457d6" text-anchor="middle">SF3</text>
  <line x1="185" y1="235" x2="250" y2="235" stroke="#2457d6" stroke-width="2"/>
  <circle cx="230" cy="235" r="3.5" fill="#2457d6"/>

  <!-- Neutral N -->
  <text x="45" y="384" font-size="13" font-weight="bold" fill="#7f8c8d">N</text>
  <line x1="65" y1="380" x2="250" y2="380" stroke="#7f8c8d" stroke-width="2"/>
  <circle cx="240" cy="380" r="3.5" fill="#7f8c8d"/>

  <!-- SECTION B: Phase Selector Switch (PF) -->
  <rect x="250" y="80" width="220" height="340" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="360" y="105" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Перемикач фаз (ПФ)</text>
  <text x="360" y="123" font-size="12" fill="#6b7280" text-anchor="middle">Контролер пріоритету</text>

  <!-- PF Terminals & Internal Relays -->
  <!-- L1_in -->
  <circle cx="250" cy="135" r="4" fill="#c0392b"/>
  <text x="260" y="139" font-size="12" fill="#1a1a1a">L1 (Пріоритетна)</text>
  <!-- L2_in -->
  <circle cx="250" cy="185" r="4" fill="#d35400"/>
  <text x="260" y="189" font-size="12" fill="#1a1a1a">L2 (Резервна 1)</text>
  <!-- L3_in -->
  <circle cx="250" cy="235" r="4" fill="#2457d6"/>
  <text x="260" y="239" font-size="12" fill="#1a1a1a">L3 (Резервна 2)</text>
  <!-- N_in -->
  <circle cx="250" cy="380" r="4" fill="#7f8c8d"/>
  <text x="260" y="384" font-size="12" fill="#7f8c8d">Нейтраль N</text>

  <!-- Output Relays Status inside PF -->
  <rect x="360" y="145" width="90" height="24" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="405" y="161" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Реле 1 (Активне)</text>
  <circle cx="470" cy="160" r="4" fill="#c0392b"/>

  <rect x="360" y="235" width="90" height="24" rx="3" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="405" y="251" font-size="12" fill="#6b7280" text-anchor="middle">Реле 2 (Готовність)</text>
  <circle cx="470" cy="250" r="4" fill="#d35400"/>

  <rect x="360" y="325" width="90" height="24" rx="3" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="405" y="341" font-size="12" fill="#6b7280" text-anchor="middle">Реле 3 (Готовність)</text>
  <circle cx="470" cy="340" r="4" fill="#2457d6"/>

  <!-- SECTION C: Contactors KM1, KM2, KM3 -->
  <!-- Contactor KM1 -->
  <rect x="500" y="80" width="130" height="340" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="565" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">KM1</text>
  <text x="565" y="123" font-size="12" fill="#6b7280" text-anchor="middle">Контактор L1</text>

  <!-- Contactor KM2 -->
  <rect x="650" y="80" width="130" height="340" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="715" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">KM2</text>
  <text x="715" y="123" font-size="12" fill="#6b7280" text-anchor="middle">Контактор L2</text>

  <!-- Contactor KM3 -->
  <rect x="800" y="80" width="130" height="340" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="865" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">KM3</text>
  <text x="865" y="123" font-size="12" fill="#6b7280" text-anchor="middle">Контактор L3</text>

  <!-- CONTROL CHANNEL 1 (L1 priority feed to KM1 Coil via KM2 NC & KM3 NC) -->
  <line x1="470" y1="160" x2="680" y2="160" stroke="#c0392b" stroke-width="2"/>
  <!-- KM2 NC1 Symbol -->
  <text x="690" y="148" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">KM2.NC</text>
  <circle cx="680" cy="160" r="3" fill="#c0392b"/>
  <line x1="680" y1="154" x2="700" y2="160" stroke="#c0392b" stroke-width="2"/>
  <circle cx="700" cy="160" r="3" fill="#c0392b"/>
  <line x1="700" y1="160" x2="830" y2="160" stroke="#c0392b" stroke-width="2"/>
  <!-- KM3 NC1 Symbol -->
  <text x="840" y="148" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">KM3.NC</text>
  <circle cx="830" cy="160" r="3" fill="#c0392b"/>
  <line x1="830" y1="154" x2="850" y2="160" stroke="#c0392b" stroke-width="2"/>
  <circle cx="850" cy="160" r="3" fill="#c0392b"/>
  <!-- Route back to KM1 Coil A1 -->
  <path d="M 850,160 L 880,160 L 880,140 L 565,140 L 565,180" fill="none" stroke="#c0392b" stroke-width="2"/>

  <!-- Coil KM1 -->
  <rect x="540" y="180" width="50" height="30" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="3"/>
  <text x="565" y="199" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">KM1 (A1-A2)</text>

  <!-- CONTROL CHANNEL 2 (L2 feed to KM2 Coil via KM1 NC & KM3 NC) -->
  <line x1="470" y1="250" x2="550" y2="250" stroke="#d35400" stroke-width="2"/>
  <!-- KM1 NC2 Symbol -->
  <text x="565" y="238" font-size="12" font-weight="bold" fill="#d35400" text-anchor="middle">KM1.NC</text>
  <circle cx="550" cy="250" r="3" fill="#d35400"/>
  <line x1="550" y1="244" x2="570" y2="250" stroke="#d35400" stroke-width="2"/>
  <circle cx="570" cy="250" r="3" fill="#d35400"/>
  <line x1="570" y1="250" x2="830" y2="250" stroke="#d35400" stroke-width="2"/>
  <!-- KM3 NC2 Symbol -->
  <text x="840" y="238" font-size="12" font-weight="bold" fill="#d35400" text-anchor="middle">KM3.NC</text>
  <circle cx="830" cy="250" r="3" fill="#d35400"/>
  <line x1="830" y1="244" x2="850" y2="250" stroke="#d35400" stroke-width="2"/>
  <circle cx="850" cy="250" r="3" fill="#d35400"/>
  <!-- Route back to KM2 Coil A1 -->
  <path d="M 850,250 L 870,250 L 870,230 L 715,230 L 715,270" fill="none" stroke="#d35400" stroke-width="2"/>

  <!-- Coil KM2 -->
  <rect x="690" y="270" width="50" height="30" fill="white" stroke="#d0d7de" stroke-width="1.5" rx="3"/>
  <text x="715" y="289" font-size="12" fill="#6b7280" text-anchor="middle">KM2 (A1-A2)</text>

  <!-- CONTROL CHANNEL 3 (L3 feed to KM3 Coil via KM1 NC & KM2 NC) -->
  <line x1="470" y1="340" x2="550" y2="340" stroke="#2457d6" stroke-width="2"/>
  <!-- KM1 NC3 Symbol -->
  <text x="565" y="328" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">KM1.NC</text>
  <circle cx="550" cy="340" r="3" fill="#2457d6"/>
  <line x1="550" y1="334" x2="570" y2="340" stroke="#2457d6" stroke-width="2"/>
  <circle cx="570" cy="340" r="3" fill="#2457d6"/>
  <line x1="570" y1="340" x2="680" y2="340" stroke="#2457d6" stroke-width="2"/>
  <!-- KM2 NC3 Symbol -->
  <text x="690" y="328" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">KM2.NC</text>
  <circle cx="680" cy="340" r="3" fill="#680"/>
  <line x1="680" y1="334" x2="700" y2="340" stroke="#2457d6" stroke-width="2"/>
  <circle cx="700" cy="340" r="3" fill="#2457d6"/>
  <!-- Route to KM3 Coil A1 -->
  <path d="M 700,340 L 865,340 L 865,360" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Coil KM3 -->
  <rect x="840" y="360" width="50" height="30" fill="white" stroke="#d0d7de" stroke-width="1.5" rx="3"/>
  <text x="865" y="379" font-size="12" fill="#6b7280" text-anchor="middle">KM3 (A1-A2)</text>

  <!-- NEUTRAL CONNECTION TO COILS A2 & LOAD -->
  <line x1="240" y1="380" x2="240" y2="415" stroke="#7f8c8d" stroke-width="2"/>
  <line x1="240" y1="415" x2="915" y2="415" stroke="#7f8c8d" stroke-width="2"/>
  <line x1="565" y1="210" x2="565" y2="415" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="565" cy="415" r="3" fill="#7f8c8d"/>
  <line x1="715" y1="300" x2="715" y2="415" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="715" cy="415" r="3" fill="#7f8c8d"/>
  <line x1="865" y1="390" x2="865" y2="415" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="865" cy="415" r="3" fill="#7f8c8d"/>
  <line x1="915" y1="415" x2="915" y2="490" stroke="#7f8c8d" stroke-width="2"/>

  <!-- POWER CONTACTS & COMMON OUTPUT BUS L_out -->
  <path d="M 210,135 L 210,450 L 530,450" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="530" cy="450" r="3.5" fill="#c0392b"/>
  <line x1="530" y1="450" x2="548" y2="442" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="550" cy="450" r="3.5" fill="#27ae60"/>
  <text x="540" y="437" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">KM1.NO (Замкнений)</text>
  <line x1="550" y1="450" x2="550" y2="475" stroke="#27ae60" stroke-width="2.5"/>

  <path d="M 220,185 L 220,458 L 680,458" fill="none" stroke="#d35400" stroke-width="2"/>
  <circle cx="680" cy="458" r="3.5" fill="#d35400"/>
  <line x1="680" y1="458" x2="696" y2="448" stroke="#d35400" stroke-width="2"/>
  <circle cx="700" cy="458" r="3.5" fill="#6b7280"/>
  <text x="690" y="437" font-size="12" fill="#6b7280" text-anchor="middle">KM2.NO (Розімкнений)</text>
  <line x1="700" y1="458" x2="700" y2="475" stroke="#6b7280" stroke-width="2"/>

  <path d="M 230,235 L 230,466 L 830,466" fill="none" stroke="#2457d6" stroke-width="2"/>
  <circle cx="830" cy="466" r="3.5" fill="#2457d6"/>
  <line x1="830" y1="466" x2="846" y2="456" stroke="#2457d6" stroke-width="2"/>
  <circle cx="850" cy="466" r="3.5" fill="#6b7280"/>
  <text x="840" y="437" font-size="12" fill="#6b7280" text-anchor="middle">KM3.NO (Розімкнений)</text>
  <line x1="850" y1="466" x2="850" y2="475" stroke="#6b7280" stroke-width="2"/>

  <!-- COMMON OUTPUT PHASE BUS L_out -->
  <line x1="550" y1="475" x2="850" y2="475" stroke="#27ae60" stroke-width="3"/>
  <circle cx="550" cy="475" r="4" fill="#27ae60"/>
  <circle cx="700" cy="475" r="4" fill="#27ae60"/>
  <circle cx="850" cy="475" r="4" fill="#27ae60"/>
  <text x="440" y="479" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Спільна фаза L_out</text>
  <line x1="775" y1="475" x2="775" y2="490" stroke="#27ae60" stroke-width="3" marker-end="url(#arr-green)"/>

  <!-- BOTTOM PANEL 1: Legend / Operational Principle Box -->
  <rect x="30" y="490" width="650" height="55" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="45" y="510" font-size="12" font-weight="bold" fill="#27ae60">Принцип роботи блокування:</text>
  <text x="45" y="527" font-size="12" fill="#1a1a1a">Ввімкнений контактор (KM1) розмикає свої NC-контакти в кола котушок KM2 та KM3,</text>
  <text x="45" y="540" font-size="12" fill="#1a1a1a">що блокує їхній одночасний запуск навіть при хибному виході контролера.</text>

  <!-- BOTTOM PANEL 2: Load Box -->
  <rect x="700" y="490" width="230" height="55" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="815" y="513" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Однофазне навантаження</text>
  <text x="815" y="533" font-size="12" fill="#6b7280" text-anchor="middle">230 В / L_out + N</text>

</svg>
