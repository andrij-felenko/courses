<svg viewBox="0 0 960 560" width="960" height="560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Перехресне електричне та механічне блокування контакторів</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Електричні NC-контакти та механічне коромисло запобігають міжфазному короткому замиканню</text>

  <!-- LEFT PANEL: Contactor KM1 Channel (x: 40..360) -->
  <rect x="40" y="80" width="320" height="440" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="52" y="102" font-size="13" font-weight="bold" fill="#2457d6">Канал контактора KM1</text>
  <text x="52" y="117" font-size="11" fill="#6b7280">(Джерело 1 / Фаза A)</text>

  <!-- MIDDLE PANEL: Interlock Assembly (x: 372..588, gap = 12px) -->
  <rect x="372" y="80" width="216" height="440" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="480" y="102" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Вузол блокування</text>
  <text x="480" y="117" font-size="11" fill="#6b7280" text-anchor="middle">(Захист від K3)</text>

  <!-- RIGHT PANEL: Contactor KM2 Channel (x: 600..920, gap = 12px) -->
  <rect x="600" y="80" width="320" height="440" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="612" y="102" font-size="13" font-weight="bold" fill="#2457d6">Канал контактора KM2</text>
  <text x="612" y="117" font-size="11" fill="#6b7280">(Джерело 2 / Фаза B)</text>

  <!-- POWER SUPPLY LINES -->
  <!-- Phase Line L -->
  <line x1="50" y1="135" x2="910" y2="135" stroke="#2457d6" stroke-width="2.5"/>
  <text x="55" y="130" font-size="11" font-weight="bold" fill="#2457d6">Фаза L</text>

  <!-- Neutral Line N -->
  <line x1="50" y1="490" x2="910" y2="490" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="55" y="505" font-size="11" font-weight="bold" fill="#1a1a1a">Нейтраль N</text>

  <!-- LEFT CHANNEL (KM1) WIRES & COMPONENTS (Center x = 200) -->
  <line x1="200" y1="135" x2="200" y2="160" stroke="#2457d6" stroke-width="2"/>
  
  <!-- SB1 Button -->
  <rect x="170" y="160" width="60" height="35" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="200" y="182" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">SB1</text>
  <text x="60" y="182" font-size="12" fill="#6b7280">Кнопка 'Пуск 1'</text>
  
  <line x1="200" y1="195" x2="200" y2="235" stroke="#2457d6" stroke-width="2"/>

  <!-- KM2_NC Contact Box -->
  <rect x="150" y="235" width="100" height="50" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="4"/>
  <text x="200" y="255" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">KM2_NC</text>
  <text x="200" y="272" font-size="11" fill="#c0392b" text-anchor="middle">(контакт KM2)</text>
  <text x="55" y="262" font-size="11" fill="#c0392b">Електр. блок.</text>

  <line x1="200" y1="285" x2="200" y2="340" stroke="#2457d6" stroke-width="2"/>

  <!-- KM1 Coil Box -->
  <rect x="170" y="340" width="60" height="45" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="4"/>
  <text x="200" y="360" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">KM1</text>
  <text x="200" y="374" font-size="10" fill="#2457d6" text-anchor="middle">(A1-A2)</text>
  <text x="75" y="367" font-size="12" fill="#1a1a1a">Котушка KM1</text>

  <line x1="200" y1="385" x2="200" y2="490" stroke="#1a1a1a" stroke-width="2"/>

  <!-- RIGHT CHANNEL (KM2) WIRES & COMPONENTS (Center x = 760) -->
  <line x1="760" y1="135" x2="760" y2="160" stroke="#2457d6" stroke-width="2"/>
  
  <!-- SB2 Button -->
  <rect x="730" y="160" width="60" height="35" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="760" y="182" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">SB2</text>
  <text x="801" y="182" font-size="12" fill="#6b7280">Кнопка 'Пуск 2'</text>

  <line x1="760" y1="195" x2="760" y2="235" stroke="#2457d6" stroke-width="2"/>

  <!-- KM1_NC Contact Box -->
  <rect x="710" y="235" width="100" height="50" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="4"/>
  <text x="760" y="255" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">KM1_NC</text>
  <text x="760" y="272" font-size="11" fill="#c0392b" text-anchor="middle">(контакт KM1)</text>
  <text x="825" y="262" font-size="11" fill="#c0392b">Електр. блок.</text>

  <line x1="760" y1="285" x2="760" y2="340" stroke="#2457d6" stroke-width="2"/>

  <!-- KM2 Coil Box -->
  <rect x="730" y="340" width="60" height="45" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="4"/>
  <text x="760" y="360" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">KM2</text>
  <text x="760" y="374" font-size="10" fill="#2457d6" text-anchor="middle">(A1-A2)</text>
  <text x="805" y="367" font-size="12" fill="#1a1a1a">Котушка KM2</text>

  <line x1="760" y1="385" x2="760" y2="490" stroke="#1a1a1a" stroke-width="2"/>

  <!-- MIDDLE PANEL: ELECTRICAL INTERLOCK SECTION (x: 372..588) -->
  <rect x="382" y="190" width="196" height="85" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <text x="480" y="212" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">ПЕРЕХРЕСТНІ NC-КОНТАКТИ</text>
  <text x="480" y="232" font-size="11" fill="#c0392b" text-anchor="middle">Розривають коло котушки</text>
  <text x="480" y="250" font-size="11" fill="#c0392b" text-anchor="middle">при втягненні іншої</text>

  <!-- Dashed Line 1: KM1 coil to KM1_NC (right side) -->
  <polyline points="230,362.5 280,362.5 280,168 680,168 680,260 710,260" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-red)"/>

  <!-- Dashed Line 2: KM2 coil to KM2_NC (left side) -->
  <polyline points="730,362.5 680,362.5 680,174 280,174 280,260 250,260" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-red)"/>

  <!-- MECHANICAL INTERLOCK ROCKER MECHANISM -->
  <!-- Mechanical linkage dashed lines connecting KM1 coil to Rocker Bar and Rocker Bar to KM2 coil -->
  <line x1="230" y1="361" x2="392" y2="361" stroke="#27ae60" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="568" y1="361" x2="730" y2="361" stroke="#27ae60" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Rocker Bar inside Middle Panel -->
  <rect x="392" y="355" width="176" height="12" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="3"/>
  
  <!-- Pivot Point -->
  <polygon points="472,367 488,367 480,380" fill="#27ae60"/>
  <circle cx="480" cy="361" r="6" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="480" y="346" font-size="11" fill="#1a1a1a" text-anchor="middle">Шарнір коромисла</text>

  <!-- MIDDLE PANEL: MECHANICAL INTERLOCK SECTION (x: 372..588) -->
  <rect x="382" y="390" width="196" height="85" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="480" y="412" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">МЕХАНІЧНЕ КОРОМИСЛО</text>
  <text x="480" y="432" font-size="11" fill="#1a1a1a" text-anchor="middle">Фізично блокує другий</text>
  <text x="480" y="450" font-size="11" fill="#1a1a1a" text-anchor="middle">якір від втягування</text>
</svg>
