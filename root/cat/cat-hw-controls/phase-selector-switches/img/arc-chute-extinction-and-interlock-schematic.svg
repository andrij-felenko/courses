<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Дугогасна камера силового контакта та подвійне міжфазне блокування</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Розщеплення електричної дуги сталевими пластинами і комбінація кулісного й електричного NC-блокувань</text>

  <!-- Left Panel: Arc Chute Extinction -->
  <rect x="20" y="70" width="440" height="465" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="240" y="96" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Фізика дугогасника (Arc Chute)</text>

  <!-- Fixed Contact -->
  <text x="72" y="225" font-size="12" fill="#1a1a1a" text-anchor="middle">Нерухомий контакт</text>
  <rect x="50" y="240" width="45" height="70" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>

  <!-- Moving Contact -->
  <path d="M 170,360 L 120,270" stroke="#2457d6" stroke-width="8" stroke-linecap="round"/>
  <circle cx="120" cy="270" r="10" fill="#2457d6"/>
  <text x="150" y="385" font-size="12" fill="#1a1a1a" text-anchor="middle">Рухомий контакт</text>

  <!-- Electric Arc Plasma -->
  <text x="150" y="220" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Комутаційна дуга</text>
  <path d="M 95,270 C 130,240 160,240 210,210 M 95,270 C 130,270 160,270 210,270 M 95,270 C 130,300 160,300 210,330" stroke="#c0392b" stroke-width="3" stroke-dasharray="3,2"/>

  <!-- Arc Chute Container & Plates -->
  <text x="300" y="150" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Дугогасна решітка (N пластин)</text>
  <rect x="210" y="160" width="180" height="220" rx="6" fill="white" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3"/>

  <rect x="230" y="180" width="140" height="10" rx="2" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="230" y="210" width="140" height="10" rx="2" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="230" y="240" width="140" height="10" rx="2" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="230" y="270" width="140" height="10" rx="2" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="230" y="300" width="140" height="10" rx="2" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="230" y="330" width="140" height="10" rx="2" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="230" y="360" width="140" height="10" rx="2" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Arc Splitting Sparks -->
  <path d="M 290,190 L 290,210 M 290,220 L 290,240 M 290,250 L 290,270 M 290,280 L 290,300 M 290,310 L 290,330 M 290,340 L 290,360" stroke="#c0392b" stroke-width="2"/>

  <!-- Formula Summary Box -->
  <rect x="40" y="405" width="400" height="115" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="240" y="428" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Формула загасання: U_total = N · U_gap</text>
  <text x="240" y="452" font-size="12" fill="#2457d6" text-anchor="middle">U_total = 10 · 20 В = 200 В > U_arc</text>
  <text x="240" y="476" font-size="12" fill="#27ae60" text-anchor="middle">Результат: деіонізація та загасання за 2..4 мс</text>
  <text x="240" y="500" font-size="12" fill="#6b7280" text-anchor="middle">Швидкість розмикання Snap Action: ω_snap > 1000 град/с</text>

  <!-- Right Panel: Dual Interlock -->
  <rect x="490" y="70" width="450" height="465" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="715" y="96" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Подвійне міжфазне блокування (KM1 / KM2)</text>

  <!-- Mechanical Interlock Box -->
  <rect x="510" y="115" width="410" height="135" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="715" y="135" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">А. Механічна куліса-балансир між якорями</text>

  <!-- Contactor KM1 (ON) -->
  <rect x="540" y="155" width="100" height="55" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="590" y="180" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Контактор KM1</text>
  <text x="590" y="198" font-size="12" fill="#27ae60" text-anchor="middle">УВІМКНЕНО</text>

  <!-- Rocker Arm -->
  <circle cx="715" cy="182" r="6" fill="#1a1a1a"/>
  <line x1="640" y1="170" x2="790" y2="194" stroke="#2457d6" stroke-width="4"/>
  <text x="715" y="235" font-size="12" fill="#1a1a1a" text-anchor="middle">Механічний стопор фізично блокує хід якоря KM2</text>

  <!-- Contactor KM2 (BLOCKED) -->
  <rect x="790" y="155" width="100" height="55" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="840" y="180" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Контактор KM2</text>
  <text x="840" y="198" font-size="12" fill="#c0392b" text-anchor="middle">ЗАБЛОКОВАНО</text>

  <!-- Electrical Interlock Box -->
  <rect x="510" y="260" width="410" height="260" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="715" y="280" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Б. Схема перехресного електричного блокування</text>

  <!-- Wires & Contacts -->
  <line x1="530" y1="305" x2="890" y2="305" stroke="#1a1a1a" stroke-width="2"/>
  <text x="525" y="300" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">L_control</text>

  <!-- Branch 1 (KM1) -->
  <line x1="600" y1="305" x2="600" y2="340" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="555" y="340" width="90" height="30" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="600" y="360" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">KM2.NC (замкнено)</text>
  <line x1="600" y1="370" x2="600" y2="400" stroke="#1a1a1a" stroke-width="2"/>

  <rect x="555" y="400" width="90" height="40" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="600" y="425" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Котушка KM1</text>
  <line x1="600" y1="440" x2="600" y2="470" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Branch 2 (KM2) -->
  <line x1="830" y1="305" x2="830" y2="340" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="785" y="340" width="90" height="30" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="830" y="360" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">KM1.NC (розімкнено)</text>
  <line x1="830" y1="370" x2="830" y2="400" stroke="#1a1a1a" stroke-width="2"/>

  <rect x="785" y="400" width="90" height="40" rx="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
  <text x="830" y="425" font-size="12" fill="#6b7280" text-anchor="middle">Котушка KM2</text>
  <line x1="830" y1="440" x2="830" y2="470" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Neutral Line -->
  <line x1="530" y1="470" x2="890" y2="470" stroke="#1a1a1a" stroke-width="2"/>
  <text x="525" y="465" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">N</text>

  <!-- Timing Condition -->
  <text x="715" y="502" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова умова безпеки: t_transfer > t_nc (t_nc = 5..15 мс)</text>
</svg>
