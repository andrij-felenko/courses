<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Header -->
  <text x="480" y="32" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Архітектура мікропроцесорного модуля автоматичного вибору фаз (АВФ)</text>
  <text x="480" y="52" font-size="13" text-anchor="middle" fill="#6b7280">Безконтактна симисторна матриця з вимірюванням напруги та комутацією в точці переходу через нуль</text>

  <!-- Panel 1: Input Phase Lines -->
  <rect x="30" y="90" width="125" height="390" fill="#f4f6f8" stroke="#d0d7de" rx="6"/>
  <text x="92" y="115" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Вхідні фази</text>

  <text x="92" y="152" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">L1 (230 V)</text>
  <text x="92" y="252" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">L2 (230 V)</text>
  <text x="92" y="352" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">L3 (160 V - Аварія)</text>
  <text x="92" y="435" font-size="12" text-anchor="middle" fill="#6b7280">N (Нейтраль)</text>

  <!-- Panel 2: Voltage Measurement Sensors -->
  <rect x="180" y="90" width="150" height="390" fill="#eaf0fd" stroke="#2457d6" rx="6"/>
  <text x="255" y="115" font-size="13" font-weight="bold" text-anchor="middle" fill="#2457d6">Модуль вимірювання</text>

  <rect x="195" y="145" width="120" height="40" fill="white" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="255" y="170" font-size="12" text-anchor="middle" fill="#1a1a1a">Датчик VA</text>

  <rect x="195" y="245" width="120" height="40" fill="white" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="255" y="270" font-size="12" text-anchor="middle" fill="#1a1a1a">Датчик VB</text>

  <rect x="195" y="345" width="120" height="40" fill="white" stroke="#c0392b" stroke-width="1.5" rx="4"/>
  <text x="255" y="370" font-size="12" text-anchor="middle" fill="#1a1a1a">Датчик VC</text>

  <!-- Panel 3: Microcontroller Logic -->
  <rect x="365" y="90" width="190" height="390" fill="#f4f6f8" stroke="#d0d7de" rx="6"/>
  <text x="460" y="115" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Мікроконтролер (MCU)</text>

  <rect x="380" y="135" width="160" height="42" fill="white" stroke="#d0d7de" rx="4"/>
  <text x="460" y="161" font-size="12" text-anchor="middle" fill="#1a1a1a">АЦП вимірювання RMS</text>

  <rect x="380" y="190" width="160" height="75" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="460" y="212" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Алгоритм вибору фази</text>
  <text x="460" y="232" font-size="12" text-anchor="middle" fill="#1a1a1a">Пріоритет: L1 &gt; L2 &gt; L3</text>
  <text x="460" y="252" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Статус: обрано L1</text>

  <rect x="380" y="278" width="160" height="42" fill="white" stroke="#d0d7de" rx="4"/>
  <text x="460" y="304" font-size="12" text-anchor="middle" fill="#1a1a1a">Детектор нуля (ZCD)</text>

  <rect x="380" y="333" width="160" height="85" fill="white" stroke="#d0d7de" rx="4"/>
  <text x="460" y="355" font-size="12" text-anchor="middle" fill="#1a1a1a">Блокувальна логіка</text>
  <text x="460" y="375" font-size="12" text-anchor="middle" fill="#1a1a1a">(Захист від КЗ фаз)</text>
  <text x="460" y="395" font-size="12" text-anchor="middle" fill="#6b7280">Перемикання у 0 В</text>

  <!-- Panel 4: Triac Matrix -->
  <rect x="590" y="90" width="170" height="390" fill="#f4f6f8" stroke="#d0d7de" rx="6"/>
  <text x="675" y="115" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Симисторна матриця (VS)</text>

  <rect x="605" y="145" width="140" height="70" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="4"/>
  <text x="675" y="172" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Оптосимистор + VS1</text>
  <text x="675" y="194" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Фаза L1: УВІМКНЕНО</text>

  <rect x="605" y="245" width="140" height="70" fill="white" stroke="#d0d7de" rx="4"/>
  <text x="675" y="272" font-size="12" text-anchor="middle" fill="#1a1a1a">Оптосимистор + VS2</text>
  <text x="675" y="294" font-size="12" text-anchor="middle" fill="#6b7280">Фаза L2: ВИМКНЕНО</text>

  <rect x="605" y="345" width="140" height="70" fill="#fdecea" stroke="#c0392b" rx="4"/>
  <text x="675" y="372" font-size="12" text-anchor="middle" fill="#c0392b">Оптосимистор + VS3</text>
  <text x="675" y="394" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">Фаза L3: БЛОКОВАНО</text>

  <!-- Panel 5: Output Load -->
  <rect x="795" y="90" width="135" height="390" fill="#f4f6f8" stroke="#d0d7de" rx="6"/>
  <text x="862" y="115" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Вихід і навантаження</text>

  <rect x="805" y="145" width="115" height="270" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="4"/>
  <text x="862" y="175" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">Навантаження R</text>
  <text x="862" y="235" font-size="14" font-weight="bold" text-anchor="middle" fill="#27ae60">L_out = 230 V</text>
  <text x="862" y="260" font-size="12" text-anchor="middle" fill="#1a1a1a">Живлення від L1</text>

  <rect x="813" y="300" width="99" height="35" fill="white" stroke="#27ae60" rx="4"/>
  <text x="862" y="322" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Стабільне ПЗ</text>

  <text x="862" y="380" font-size="12" text-anchor="middle" fill="#6b7280">Час t &lt; 10 мс</text>

  <!-- Wires / Lines -->
  <!-- Phase L1 Path (Active: #27ae60, stroke-width=3) -->
  <line x1="155" y1="165" x2="195" y2="165" stroke="#27ae60" stroke-width="3" marker-end="url(#arr-green)"/>
  <line x1="315" y1="165" x2="365" y2="156" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="540" y1="225" x2="605" y2="180" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="745" y1="180" x2="805" y2="180" stroke="#27ae60" stroke-width="3" marker-end="url(#arr-green)"/>

  <!-- Phase L2 Path (Standby: #2457d6) -->
  <line x1="155" y1="265" x2="195" y2="265" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="315" y1="265" x2="365" y2="165" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="540" y1="225" x2="605" y2="280" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr)"/>

  <!-- Phase L3 Path (Fault: #c0392b) -->
  <line x1="155" y1="365" x2="195" y2="365" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="315" y1="365" x2="365" y2="174" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="540" y1="375" x2="605" y2="380" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>

  <!-- Bottom Legend Banner -->
  <rect x="30" y="495" width="900" height="35" fill="#f4f6f8" stroke="#d0d7de" rx="4"/>
  <circle cx="55" cy="512" r="6" fill="#27ae60"/>
  <text x="70" y="516" font-size="12" text-anchor="start" fill="#1a1a1a">Активна фаза (L1, 230 В)</text>

  <circle cx="340" cy="512" r="6" fill="#2457d6"/>
  <text x="355" y="516" font-size="12" text-anchor="start" fill="#1a1a1a">Резервна фаза в нормі (L2, 230 В)</text>

  <circle cx="670" cy="512" r="6" fill="#c0392b"/>
  <text x="685" y="516" font-size="12" text-anchor="start" fill="#1a1a1a">Аварійна фаза (L3, 160 В)</text>
</svg>
