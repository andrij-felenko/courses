<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Markers -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Векторні зсуви напруг та зміщення нейтралі U_N</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Зміщення потенціалу нейтралі створює асиметрію 380 В, а кут 120° викликає подвоєні різниці ΔU</text>

  <!-- LEFT PANEL: Neutral Drift Diagram -->
  <rect x="25" y="70" width="435" height="465" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="242" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">1. Геометричне зміщення нейтралі N → N'</text>
  <text x="242" y="103" text-anchor="middle" font-size="11" fill="#6b7280">Зсув нейтрального провідника під дією струму асиметрії I_N</text>

  <!-- Reference Symmetrical Circle -->
  <circle cx="220" cy="220" r="90" fill="none" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Symmetrical Phase Vectors from N (220, 220) -->
  <line x1="220" y1="220" x2="220" y2="130" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <line x1="220" y1="220" x2="142" y2="265" stroke="#6b7280" stroke-width="2" marker-end="url(#arr-gray)"/>
  <line x1="220" y1="220" x2="298" y2="265" stroke="#6b7280" stroke-width="2" marker-end="url(#arr-gray)"/>

  <!-- Neutral Drift Vector U_N (N -> N') -->
  <line x1="220" y1="220" x2="260" y2="198" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <circle cx="220" cy="220" r="4" fill="#1a1a1a"/>
  <circle cx="260" cy="198" r="4" fill="#c0392b"/>

  <!-- Shifted Phase Vectors from N' (260, 198) -->
  <line x1="260" y1="198" x2="142" y2="265" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <line x1="260" y1="198" x2="220" y2="130" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Vector Labels in Left Panel -->
  <text x="220" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">L1 (230 В)</text>
  <text x="135" y="282" text-anchor="end" font-size="11" font-weight="bold" fill="#c0392b">L2' (360...380 В)</text>
  <text x="310" y="278" text-anchor="start" font-size="12" fill="#6b7280">L3</text>
  <text x="198" y="212" font-size="11" font-weight="bold" fill="#1a1a1a">N</text>
  <text x="272" y="194" font-size="11" font-weight="bold" fill="#c0392b">N'</text>
  <text x="230" y="198" font-size="11" font-weight="bold" fill="#c0392b">U_N</text>
  <text x="215" y="170" text-anchor="end" font-size="11" fill="#2457d6">U_L1'</text>

  <!-- Explanatory Box in Left Panel -->
  <rect x="40" y="310" width="405" height="210" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="55" y="332" font-size="12" font-weight="bold" fill="#1a1a1a">Фізика асиметрії та зміщення:</text>
  <text x="55" y="354" font-size="11" fill="#1a1a1a">• Струм нейтралі I_N = I_L1 + I_L2 + I_L3 ≠ 0</text>
  <text x="55" y="376" font-size="11" fill="#1a1a1a">• Напруга зміщення U_N = I_N · Z_N зміщує нуль N → N'</text>
  <text x="55" y="398" font-size="11" fill="#1a1a1a">• Фазна напруга просілої фази впадає: U_L1' &lt; 230 В</text>
  <text x="55" y="420" font-size="11" fill="#c0392b">• Перенапруга на суміжній фазі: U_L2' → 360...380 В!</text>
  <text x="55" y="442" font-size="11" fill="#1a1a1a">• Пробій варисторів та випрямлячів блоків живлення</text>
  <text x="55" y="490" font-size="12" font-weight="bold" fill="#c0392b">Загроза масового вигорання однофазного обладнання</text>

  <!-- RIGHT PANEL: Vector Shift 120° & Difference -->
  <rect x="480" y="70" width="455" height="465" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="707" y="88" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">2. Векторна різниця напруг між фазами ΔU</text>
  <text x="707" y="103" text-anchor="middle" font-size="11" fill="#6b7280">Комутація між L1 та L2 при куті 120° та ЕРС двигуна</text>

  <!-- Vectors for Difference Diagram (Origin O at 600, 210) -->
  <line x1="600" y1="210" x2="710" y2="210" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <line x1="600" y1="210" x2="545" y2="305" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <line x1="600" y1="210" x2="655" y2="115" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-gray)"/>

  <!-- Difference Vector ΔU (from L2 tip to L1 tip) -->
  <line x1="545" y1="305" x2="710" y2="210" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-red)"/>

  <!-- Angle Arc 120° -->
  <path d="M 635 210 A 35 35 0 0 1 582 240" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <text x="608" y="238" font-size="11" font-weight="bold" fill="#2457d6">120°</text>

  <!-- Labels in Right Panel Diagram -->
  <circle cx="600" cy="210" r="4" fill="#1a1a1a"/>
  <text x="585" y="214" font-size="12" font-weight="bold" fill="#1a1a1a">O</text>
  <text x="650" y="198" font-size="11" font-weight="bold" fill="#2457d6">U_L1 (325 В пік)</text>
  <text x="510" y="290" text-anchor="end" font-size="11" font-weight="bold" fill="#27ae60">U_L2</text>
  <text x="662" y="125" font-size="11" fill="#6b7280">-U_L2</text>
  <text x="645" y="285" font-size="11" font-weight="bold" fill="#c0392b">ΔU = √3 · U_m (400 В RMS)</text>

  <!-- Explanatory Box in Right Panel -->
  <rect x="495" y="310" width="425" height="210" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="510" y="332" font-size="12" font-weight="bold" fill="#1a1a1a">Комутація між несинхронізованими фазами:</text>
  <text x="510" y="354" font-size="11" fill="#1a1a1a">• Амплітуда лінійного стрибка: ΔU = √3 · U_m ≈ 400 В</text>
  <text x="510" y="376" font-size="11" fill="#1a1a1a">• Залишкова проти-ЕРС двигуна E_rot додається до мережі</text>
  <text x="510" y="398" font-size="11" fill="#c0392b">• При протифазі 180° напруга зазору: U_gap → 2 · U_m ≈ 650 В!</text>
  <text x="510" y="420" font-size="11" fill="#1a1a1a">• Виникає кидок струму inrush current I_inrush &gt; 15–20 · I_nom</text>
  <text x="510" y="442" font-size="11" fill="#1a1a1a">• Необхідна пауза t_pause = -T_r · ln(0.2) для згасання поля</text>
  <text x="510" y="490" font-size="12" font-weight="bold" fill="#27ae60">Захист: затримка BBM та аналіз True RMS у селекторі</text>
</svg>
