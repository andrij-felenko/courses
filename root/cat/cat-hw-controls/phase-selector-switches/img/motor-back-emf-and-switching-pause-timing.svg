<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>

  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма проти-ЕРС індукційного двигуна під час комутації джерел</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Пауза затримки t_pause запобігає протифазному ввімкненню та виникненню надструмів</text>

  <rect x="20" y="70" width="920" height="450" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Background Highlight Regions -->
  <rect x="312" y="115" width="268" height="150" fill="#fdecea" opacity="0.3"/>
  <rect x="580" y="115" width="98" height="150" fill="#e9f7ef" opacity="0.4"/>

  <!-- Top Status Bar -->
  <rect x="100" y="85" width="200" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="200" y="102" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Джерело 1 (ВВІМКНЕНО)</text>

  <rect x="312" y="85" width="366" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="495" y="102" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Безнапругова пауза затримки t_pause (Відключено)</text>

  <rect x="690" y="85" width="210" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="795" y="102" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Джерело 2 (ВВІМКНЕНО)</text>

  <!-- Voltage Reference Lines & Y-Axis Labels -->
  <line x1="120" y1="140" x2="900" y2="140" stroke="#d0d7de" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="110" y="144" font-size="12" fill="#6b7280" text-anchor="end">+U_nom</text>

  <line x1="120" y1="170" x2="900" y2="170" stroke="#27ae60" stroke-dasharray="4,4" stroke-width="1.5"/>
  <text x="110" y="174" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">+25% U_nom</text>

  <line x1="120" y1="200" x2="900" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="110" y="204" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">0 В</text>

  <line x1="120" y1="230" x2="900" y2="230" stroke="#27ae60" stroke-dasharray="4,4" stroke-width="1.5"/>
  <text x="110" y="234" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">-25% U_nom</text>

  <line x1="120" y1="255" x2="900" y2="255" stroke="#d0d7de" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="110" y="259" font-size="12" fill="#6b7280" text-anchor="end">-U_nom</text>

  <!-- Vertical Timeline Markers -->
  <line x1="312" y1="115" x2="312" y2="270" stroke="#c0392b" stroke-dasharray="4,4" stroke-width="2"/>
  <text x="312" y="288" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">t1: Відключення KM1</text>

  <line x1="580" y1="115" x2="580" y2="270" stroke="#27ae60" stroke-dasharray="4,4" stroke-width="2"/>
  <text x="550" y="288" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">t2: BEMF ≤ 25%</text>

  <line x1="678" y1="115" x2="678" y2="270" stroke="#2457d6" stroke-dasharray="4,4" stroke-width="2"/>
  <text x="680" y="288" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">t3: Ввімкнення KM2</text>

  <!-- Pause Dimension Arrow t_pause -->
  <line x1="317" y1="132" x2="420" y2="132" stroke="#2457d6" stroke-width="2" marker-start="url(#arr-blue)"/>
  <rect x="425" y="120" width="140" height="24" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="495" y="136" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Пауза t_pause ≥ 3·τ_d</text>
  <line x1="570" y1="132" x2="673" y2="132" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Waveform 1: Source 1 Mains (120..312) -->
  <path d="M 120,200 C 135,120 145,120 160,200 C 175,280 185,280 200,200 C 215,120 225,120 240,200 C 255,280 265,280 280,200 C 295,140 305,140 312,200" fill="none" stroke="#27ae60" stroke-width="3"/>

  <!-- Waveform 2: Decaying Back-EMF Envelopes -->
  <path d="M 312,140 Q 450,180 580,186 T 678,198" fill="none" stroke="#c0392b" stroke-dasharray="3,3" stroke-width="1.5"/>
  <path d="M 312,260 Q 450,220 580,214 T 678,202" fill="none" stroke="#c0392b" stroke-dasharray="3,3" stroke-width="1.5"/>

  <!-- Waveform 2: Oscillations -->
  <path d="M 312,200 C 327,150 337,150 352,200 C 367,245 377,245 392,200 C 407,165 417,165 432,200 C 447,230 457,230 472,200 C 487,180 497,180 512,200 C 527,215 537,215 552,200 C 563,190 571,190 580,200" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <path d="M 580,200 C 595,208 605,208 620,200 C 635,195 645,195 660,200 L 678,200" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Waveform 3: Source 2 Connection (678..900) -->
  <path d="M 678,200 C 693,120 703,120 718,200 C 733,280 743,280 758,200 C 773,120 783,120 798,200 C 813,280 823,280 838,200 C 853,120 863,120 878,200 C 888,250 895,250 900,200" fill="none" stroke="#27ae60" stroke-width="3"/>

  <!-- Annotations / Callout Cards -->
  <rect x="160" y="305" width="270" height="65" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="170" y="324" font-size="12" font-weight="bold" fill="#c0392b">🔴 Небезпечна проти-ЕРС (U_BEMF &gt; 25%)</text>
  <text x="170" y="342" font-size="12" fill="#1a1a1a">Ризик зустрічного включення фаз:</text>
  <text x="170" y="357" font-size="12" font-weight="bold" fill="#c0392b">ΔU max ≈ 200% U_nom (10..15·I_nom)</text>

  <rect x="560" y="305" width="250" height="65" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="570" y="324" font-size="12" font-weight="bold" fill="#27ae60">🟢 Безпечний рівень напруги</text>
  <text x="570" y="342" font-size="12" fill="#1a1a1a">Проти-ЕРС згасла до ≤ 25% U_nom.</text>
  <text x="570" y="357" font-size="12" font-weight="bold" fill="#27ae60">Дозволено ввімкнення KM2</text>

  <!-- Bottom Summary Panel -->
  <rect x="40" y="390" width="880" height="115" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="412" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Інженерний розрахунок часової затримки перемикання для індуктивних навантажень</text>

  <text x="60" y="437" font-size="12" fill="#1a1a1a">• Фізика процесу: після відключення мережі ротор двигуна обертається за інерцією і працює як генератор, створюючи згасаючу проти-ЕРС u_BEMF(t).</text>
  <text x="60" y="457" font-size="12" fill="#1a1a1a">• Вимога безпеки: пауза t_pause повинна перевищувати 3·τ_d (зазвичай 150...500 мс), що гарантує спад напруги на клемах нижче 25% U_nom.</text>
  <text x="60" y="477" font-size="12" fill="#1a1a1a">• Захисний ефект: запобігає динамічним зрізам шпонок, зварюванню контакторів та спрацьвуванню вхідних автоматів від струмових сплесків.</text>
</svg>
