<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="530" fill="#ffffff"/>

  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема механічного та електричного взаємного блокування контакторів АВР</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Подвійний захист унеможливлює одночасне ввімкнення двох джерел та міжфазне коротке замикання</text>

  <rect x="20" y="70" width="920" height="445" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- LEFT PANEL: KM1 (ACTIVE) -->
  <rect x="40" y="85" width="390" height="260" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="40" y="85" width="390" height="35" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="235" y="108" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Контактор KM1 — ВВІМКНЕНО (Джерело 1)</text>

  <!-- Power Contacts KM1 -->
  <rect x="60" y="135" width="160" height="110" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="140" y="153" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Силові контакти KM1</text>
  
  <line x1="85" y1="165" x2="85" y2="195" stroke="#27ae60" stroke-width="3"/>
  <circle cx="85" cy="165" r="4" fill="#27ae60"/>
  <circle cx="85" cy="195" r="4" fill="#27ae60"/>
  
  <line x1="140" y1="165" x2="140" y2="195" stroke="#27ae60" stroke-width="3"/>
  <circle cx="140" cy="165" r="4" fill="#27ae60"/>
  <circle cx="140" cy="195" r="4" fill="#27ae60"/>

  <line x1="195" y1="165" x2="195" y2="195" stroke="#27ae60" stroke-width="3"/>
  <circle cx="195" cy="165" r="4" fill="#27ae60"/>
  <circle cx="195" cy="195" r="4" fill="#27ae60"/>

  <text x="140" y="222" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">ЗАМКНЕНО</text>

  <!-- Auxiliary contact KM1:NC -->
  <rect x="250" y="135" width="165" height="110" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="332" y="153" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Допоміжний контакт KM1:NC</text>
  <circle cx="300" cy="180" r="4" fill="#c0392b"/>
  <circle cx="365" cy="180" r="4" fill="#c0392b"/>
  <line x1="300" y1="180" x2="355" y2="165" stroke="#c0392b" stroke-width="2.5"/>
  <text x="332" y="222" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">РОЗІМКНЕНО (Блокує KM2)</text>

  <!-- KM1 Coil -->
  <rect x="130" y="265" width="210" height="65" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="235" y="288" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Котушка KM1 (A1 - A2)</text>
  <text x="235" y="312" font-size="12" fill="#1a1a1a" text-anchor="middle">Під напругою (Активна)</text>


  <!-- RIGHT PANEL: KM2 (BLOCKED/OFF) -->
  <rect x="530" y="85" width="390" height="260" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="530" y="85" width="390" height="35" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="725" y="108" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Контактор KM2 — ВИМКНЕНО (Джерело 2)</text>

  <!-- Power Contacts KM2 -->
  <rect x="550" y="135" width="160" height="110" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="630" y="153" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Силові контакти KM2</text>

  <circle cx="575" cy="195" r="4" fill="#c0392b"/>
  <circle cx="575" cy="165" r="4" fill="#c0392b"/>
  <line x1="575" y1="195" x2="565" y2="170" stroke="#c0392b" stroke-width="2.5"/>

  <circle cx="630" cy="195" r="4" fill="#c0392b"/>
  <circle cx="630" cy="165" r="4" fill="#c0392b"/>
  <line x1="630" y1="195" x2="620" y2="170" stroke="#c0392b" stroke-width="2.5"/>

  <circle cx="685" cy="195" r="4" fill="#c0392b"/>
  <circle cx="685" cy="165" r="4" fill="#c0392b"/>
  <line x1="685" y1="195" x2="675" y2="170" stroke="#c0392b" stroke-width="2.5"/>

  <text x="630" y="222" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">РОЗІМКНЕНО</text>

  <!-- Auxiliary contact KM2:NC -->
  <rect x="740" y="135" width="165" height="110" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="822" y="153" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Допоміжний контакт KM2:NC</text>
  <circle cx="790" cy="180" r="4" fill="#27ae60"/>
  <circle cx="855" cy="180" r="4" fill="#27ae60"/>
  <line x1="790" y1="180" x2="855" y2="180" stroke="#27ae60" stroke-width="2.5"/>
  <text x="822" y="222" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">ЗАМКНЕНО (Готовий)</text>

  <!-- KM2 Coil -->
  <rect x="620" y="265" width="210" height="65" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="725" y="288" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Котушка KM2 (A1 - A2)</text>
  <text x="725" y="312" font-size="12" fill="#1a1a1a" text-anchor="middle">Знеструмлена (Заблокована)</text>


  <!-- CENTER MECHANICAL INTERLOCK -->
  <rect x="440" y="135" width="80" height="195" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="153" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Механічний</text>
  <text x="480" y="167" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">замок</text>

  <circle cx="480" cy="210" r="6" fill="#1a1a1a"/>
  <line x1="452" y1="195" x2="508" y2="225" stroke="#2457d6" stroke-width="5" stroke-linecap="round"/>
  <line x1="430" y1="195" x2="452" y2="195" stroke="#27ae60" stroke-width="3"/>
  <polygon points="445,190 454,195 445,200" fill="#27ae60"/>

  <line x1="508" y1="225" x2="530" y2="225" stroke="#c0392b" stroke-width="3"/>
  <rect x="520" y="218" width="10" height="14" fill="#c0392b"/>

  <text x="480" y="265" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Фізичний</text>
  <text x="480" y="280" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">стопор</text>
  <text x="480" y="295" font-size="12" fill="#6b7280" text-anchor="middle">якіра</text>


  <!-- ELECTRICAL INTERLOCK CIRCUIT (BOTTOM) -->
  <rect x="40" y="360" width="880" height="140" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="382" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принцип дії електричного та механічного блокування</text>

  <rect x="60" y="398" width="410" height="88" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="75" y="418" font-size="13" font-weight="bold" fill="#27ae60">1. Електричне блокування (перекрос НЗ-контактів)</text>
  <text x="75" y="436" font-size="12" fill="#1a1a1a">• Струм котушки KM1 тече через замкнений контакт KM2:NC.</text>
  <text x="75" y="454" font-size="12" fill="#1a1a1a">• При спрацюванні KM1 розмикається його контакт KM1:NC.</text>
  <text x="75" y="472" font-size="12" fill="#1a1a1a">• Котушка KM2 знеструмлюється навіть при подачі сигналу ввімкнення.</text>

  <rect x="490" y="398" width="410" height="88" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="505" y="418" font-size="13" font-weight="bold" fill="#c0392b">2. Механічне блокування (коромисловий замок)</text>
  <text x="505" y="436" font-size="12" fill="#1a1a1a">• Важіль жорстко пов'язує рухомі системи якорів KM1 та KM2.</text>
  <text x="505" y="454" font-size="12" fill="#1a1a1a">• Втягнутий якір KM1 механічно стопорить якір контактора KM2.</text>
  <text x="505" y="472" font-size="12" fill="#1a1a1a">• Захищає від КЗ навіть при зварюванні контактів або залипанні.</text>
</svg>
