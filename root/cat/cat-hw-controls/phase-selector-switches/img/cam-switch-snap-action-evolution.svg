<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Еволюція кулачкових перемикачів: пружинний механізм Snap Action</text>
  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Накопичення енергії пружиною усуває вплив швидкості оператора та дугоутворення</text>

  <!-- PANEL 1: Closed State -->
  <rect x="30" y="65" width="280" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="30" y="65" width="280" height="32" rx="8" fill="#eaf0fd"/>
  <text x="170" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">1. Замкнений стан (Норма)</text>

  <!-- Panel 1 Mechanics -->
  <!-- Cam -->
  <path d="M 140,240 C 140,210 160,200 170,200 C 180,200 200,210 200,240 C 200,270 140,270 140,240 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <circle cx="170" cy="240" r="7" fill="#2457d6"/>
  <text x="170" y="295" text-anchor="middle" font-size="11" fill="#2457d6">Кулачок (Cam)</text>

  <!-- Roller & Plunger -->
  <circle cx="170" cy="190" r="10" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="170" y1="180" x2="170" y2="130" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Spring Coil -->
  <path d="M 163,140 L 177,145 L 163,150 L 177,155 L 163,160 L 177,165 L 163,170 L 170,173" fill="none" stroke="#6b7280" stroke-width="2"/>
  <text x="135" y="160" text-anchor="end" font-size="11" fill="#6b7280">Пружина</text>

  <!-- Contact Arm and Contacts -->
  <line x1="170" y1="130" x2="230" y2="130" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="230" cy="130" r="4" fill="#1a1a1a"/>
  <circle cx="195" cy="127" r="4" fill="#27ae60"/>
  <circle cx="195" cy="120" r="4" fill="#27ae60"/>
  <line x1="195" y1="116" x2="195" y2="108" stroke="#27ae60" stroke-width="2"/>
  <text x="245" y="125" font-size="11" font-weight="bold" fill="#27ae60">Замкнено</text>

  <!-- Panel 1 Status Box -->
  <rect x="45" y="380" width="250" height="48" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="170" y="401" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Контакти замкнені (ОК)</text>
  <text x="170" y="418" text-anchor="middle" font-size="11" fill="#27ae60">Пружина в базовому стані</text>


  <!-- PANEL 2: Energy Storage / Dead Center -->
  <rect x="340" y="65" width="280" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="340" y="65" width="280" height="32" rx="8" fill="#fdecea"/>
  <text x="480" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">2. Накопичення енергії (Поворот)</text>

  <!-- Panel 2 Mechanics -->
  <!-- Rotated Cam -->
  <path d="M 450,240 C 450,230 470,185 480,185 C 490,185 510,230 510,240 C 510,270 450,270 450,240 Z" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <circle cx="480" cy="240" r="7" fill="#c0392b"/>
  <!-- Rotation arrow omega -->
  <path d="M 445,255 A 25 25 0 0 1 455,220" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="430" y="235" font-size="11" font-weight="bold" fill="#c0392b">ω</text>
  <text x="480" y="295" text-anchor="middle" font-size="11" fill="#c0392b">Поворот вала</text>

  <!-- Plunger & Compressed Spring -->
  <circle cx="480" cy="175" r="10" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="480" y1="165" x2="480" y2="128" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Tightly Compressed Spring -->
  <path d="M 473,135 L 487,138 L 473,141 L 487,144 L 473,147 L 487,150 L 473,153 L 487,156 L 473,159 L 480,161" fill="none" stroke="#c0392b" stroke-width="2.2"/>
  <!-- Force vector -->
  <line x1="498" y1="165" x2="498" y2="135" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="510" y="152" font-size="11" font-weight="bold" fill="#c0392b">F_max</text>

  <!-- Contacts STILL touching (Dead Center) -->
  <line x1="480" y1="128" x2="540" y2="130" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="540" cy="130" r="4" fill="#1a1a1a"/>
  <circle cx="505" cy="126" r="4" fill="#c0392b"/>
  <circle cx="505" cy="120" r="4" fill="#c0392b"/>
  <text x="520" y="115" font-size="11" font-weight="bold" fill="#c0392b">Поріг перед зривом</text>

  <!-- Panel 2 Status Box -->
  <rect x="355" y="380" width="250" height="48" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="480" y="401" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Мертва точка (Dead Center)</text>
  <text x="480" y="418" text-anchor="middle" font-size="11" fill="#c0392b">Максимальний стиск пружини</text>


  <!-- PANEL 3: Snap Release -->
  <rect x="650" y="65" width="280" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="650" y="65" width="280" height="32" rx="8" fill="#e9f7ef"/>
  <text x="790" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">3. Розмикання (Snap Action)</text>

  <!-- Panel 3 Mechanics -->
  <!-- Cam past peak -->
  <path d="M 770,240 C 770,200 810,190 820,220 C 825,240 810,270 760,260 Z" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <circle cx="790" cy="240" r="7" fill="#27ae60"/>
  <text x="790" y="295" text-anchor="middle" font-size="11" fill="#27ae60">Зрив з вершини</text>

  <!-- Roller & Plunger snapped DOWN -->
  <circle cx="790" cy="205" r="10" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="790" y1="195" x2="790" y2="145" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Snap Motion Arrow -->
  <line x1="762" y1="160" x2="762" y2="190" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="752" y="178" text-anchor="end" font-size="11" font-weight="bold" fill="#27ae60">Snap (&lt;5ms)</text>

  <!-- Contacts WIDE OPEN -->
  <line x1="790" y1="145" x2="850" y2="130" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="850" cy="130" r="4" fill="#1a1a1a"/>
  <circle cx="815" cy="138" r="4" fill="#27ae60"/>
  <circle cx="815" cy="118" r="4" fill="#27ae60"/>
  
  <!-- Air gap arrow d_gap -->
  <line x1="825" y1="120" x2="825" y2="136" stroke="#27ae60" stroke-width="1.2" marker-end="url(#arr-green)" marker-start="url(#arr-green)"/>
  <text x="834" y="131" font-size="11" font-weight="bold" fill="#27ae60">d_gap</text>

  <!-- Arc Extinction Chamber Walls -->
  <rect x="800" y="105" width="30" height="42" rx="3" fill="none" stroke="#6b7280" stroke-dasharray="3 2" stroke-width="1.2"/>
  <text x="855" y="112" font-size="11" fill="#6b7280">Дугогасна</text>
  <text x="855" y="125" font-size="11" fill="#6b7280">камера</text>

  <!-- Panel 3 Status Box -->
  <rect x="665" y="380" width="250" height="48" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="790" y="401" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Миттєве розмикання (Snap)</text>
  <text x="790" y="418" text-anchor="middle" font-size="11" fill="#27ae60">Дуга згашена за t &lt; 5 мс</text>
</svg>
