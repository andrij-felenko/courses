<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Принципова схема автоматичного перемикача фаз</text>
  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Силова комутація контакторами KM1..KM3, реле контролю та перехресне NC-блокування</text>

  <!-- PANEL 1: 3-Phase Power Supply -->
  <rect x="40" y="70" width="250" height="445" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="165" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">3-фазне силове живлення</text>

  <!-- Line L1 -->
  <rect x="52" y="129" width="35" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="69" y="144" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">L1</text>
  <line x1="87" y1="140" x2="130" y2="140" stroke="#2457d6" stroke-width="1.5"/>
  <!-- QF1 Fuse/Breaker -->
  <rect x="130" y="132" width="45" height="16" fill="white" stroke="#1a1a1a" stroke-width="1"/>
  <text x="152" y="144" text-anchor="middle" font-size="12" fill="#1a1a1a">QF1</text>
  <line x1="175" y1="140" x2="330" y2="140" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Line L2 -->
  <rect x="52" y="209" width="35" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="69" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">L2</text>
  <line x1="87" y1="220" x2="130" y2="220" stroke="#2457d6" stroke-width="1.5"/>
  <!-- QF2 Fuse/Breaker -->
  <rect x="130" y="212" width="45" height="16" fill="white" stroke="#1a1a1a" stroke-width="1"/>
  <text x="152" y="224" text-anchor="middle" font-size="12" fill="#1a1a1a">QF2</text>
  <line x1="175" y1="220" x2="330" y2="220" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Line L3 -->
  <rect x="52" y="289" width="35" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="69" y="304" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">L3</text>
  <line x1="87" y1="300" x2="130" y2="300" stroke="#2457d6" stroke-width="1.5"/>
  <!-- QF3 Fuse/Breaker -->
  <rect x="130" y="292" width="45" height="16" fill="white" stroke="#1a1a1a" stroke-width="1"/>
  <text x="152" y="304" text-anchor="middle" font-size="12" fill="#1a1a1a">QF3</text>
  <line x1="175" y1="300" x2="330" y2="300" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Line N -->
  <rect x="52" y="369" width="35" height="22" rx="4" fill="#eaf0fd" stroke="#6b7280"/>
  <text x="69" y="384" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">N</text>
  <line x1="87" y1="380" x2="330" y2="380" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Info Box in Panel 1 -->
  <rect x="52" y="420" width="226" height="75" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="165" y="438" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Параметри мережі</text>
  <text x="165" y="456" text-anchor="middle" font-size="12" fill="#6b7280">3 х 230 / 400 В, 50 Гц</text>
  <text x="165" y="474" text-anchor="middle" font-size="12" fill="#6b7280">Категорія контакторів AC-3</text>


  <!-- PANEL 2: Power Contactors & Output Bus -->
  <rect x="310" y="70" width="330" height="445" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="475" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Силовий блок контакторів KM1..KM3</text>

  <!-- Contactor KM1 (Active / Priority L1) -->
  <rect x="330" y="118" width="290" height="65" rx="6" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <text x="340" y="136" font-size="12" font-weight="bold" fill="#27ae60">KM1 (Пріоритет L1)</text>
  <circle cx="440" cy="140" r="4" fill="#27ae60"/>
  <circle cx="490" cy="140" r="4" fill="#27ae60"/>
  <line x1="440" y1="140" x2="490" y2="140" stroke="#27ae60" stroke-width="2.5"/>
  <text x="502" y="136" font-size="12" font-weight="bold" fill="#27ae60">ЗАМКНЕНО (L1)</text>
  <line x1="490" y1="140" x2="580" y2="140" stroke="#27ae60" stroke-width="2"/>

  <!-- Contactor KM2 (Standby L2) -->
  <rect x="330" y="198" width="290" height="65" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="340" y="216" font-size="12" font-weight="bold" fill="#2457d6">KM2 (Резерв L2)</text>
  <circle cx="440" cy="220" r="4" fill="#1a1a1a"/>
  <circle cx="490" cy="220" r="4" fill="#1a1a1a"/>
  <line x1="440" y1="220" x2="475" y2="206" stroke="#1a1a1a" stroke-width="2"/>
  <text x="502" y="216" font-size="12" fill="#6b7280">РОЗМКНЕНО</text>
  <line x1="490" y1="220" x2="580" y2="220" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Contactor KM3 (Standby L3) -->
  <rect x="330" y="278" width="290" height="65" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="340" y="296" font-size="12" font-weight="bold" fill="#2457d6">KM3 (Резерв L3)</text>
  <circle cx="440" cy="300" r="4" fill="#1a1a1a"/>
  <circle cx="490" cy="300" r="4" fill="#1a1a1a"/>
  <line x1="440" y1="300" x2="475" y2="286" stroke="#1a1a1a" stroke-width="2"/>
  <text x="502" y="296" font-size="12" fill="#6b7280">РОЗМКНЕНО</text>
  <line x1="490" y1="300" x2="580" y2="300" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Common Output Bus Line L_out -->
  <line x1="580" y1="140" x2="580" y2="300" stroke="#27ae60" stroke-width="2"/>
  <circle cx="580" cy="140" r="3.5" fill="#27ae60"/>
  <circle cx="580" cy="220" r="3" fill="#6b7280"/>
  <circle cx="580" cy="300" r="3" fill="#6b7280"/>

  <line x1="580" y1="140" x2="600" y2="140" stroke="#27ae60" stroke-width="2"/>
  <line x1="600" y1="140" x2="600" y2="415" stroke="#27ae60" stroke-width="2"/>
  <line x1="600" y1="415" x2="355" y2="415" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="585" y="130" font-size="12" font-weight="bold" fill="#27ae60">L_out</text>

  <!-- Neutral Line to Load Box Terminal -->
  <line x1="330" y1="380" x2="315" y2="380" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="315" y1="380" x2="315" y2="450" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="315" y1="450" x2="350" y2="450" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Single-Phase Load Box -->
  <rect x="330" y="365" width="290" height="130" rx="6" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <text x="475" y="386" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Однофазне навантаження (L_out + N)</text>

  <!-- L_out Terminal inside Load Box -->
  <circle cx="350" cy="415" r="4" fill="#27ae60"/>
  <text x="360" y="410" font-size="12" font-weight="bold" fill="#27ae60">Клема L_out (~230 В)</text>

  <!-- N Terminal inside Load Box -->
  <circle cx="350" cy="450" r="4" fill="#6b7280"/>
  <text x="360" y="445" font-size="12" fill="#6b7280">Клема N (Нейтраль)</text>

  <text x="475" y="480" text-anchor="middle" font-size="12" fill="#6b7280">Безперебійне живлення споживачів</text>


  <!-- PANEL 3: Control & Interlocking Circuit -->
  <rect x="660" y="70" width="260" height="445" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="790" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Коло керування та NC-блокування</text>

  <!-- Voltage Monitoring & Priority Relay Block KV1 -->
  <rect x="675" y="112" width="230" height="110" rx="6" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="790" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Релейний блок KV1 (PEF)</text>
  <text x="790" y="156" text-anchor="middle" font-size="12" fill="#1a1a1a">Контроль напруги U_min / U_max</text>
  <text x="790" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Вибір пріоритетної фази L1</text>
  <text x="790" y="196" text-anchor="middle" font-size="12" fill="#6b7280">Затримка вмикання t_on = 5 с</text>

  <!-- Interlocking Coils Circuit Box -->
  <rect x="675" y="235" width="230" height="260" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="790" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Коло котушок KM1..KM3</text>

  <!-- Branch 1 (Coil KM1 - Active) -->
  <rect x="685" y="268" width="210" height="60" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="693" y="284" font-size="12" font-weight="bold" fill="#27ae60">Гілка 1: Котушка KM1</text>
  <text x="693" y="302" font-size="12" fill="#1a1a1a">Через KM2.NC та KM3.NC</text>
  <text x="693" y="318" font-size="12" font-weight="bold" fill="#27ae60">Живлення подано (L1 увімкнено)</text>

  <!-- Branch 2 (Coil KM2 - Interlocked) -->
  <rect x="685" y="338" width="210" height="60" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="693" y="354" font-size="12" font-weight="bold" fill="#c0392b">Гілка 2: Котушка KM2</text>
  <text x="693" y="372" font-size="12" fill="#1a1a1a">Заблоковано контактом KM1.NC</text>
  <text x="693" y="388" font-size="12" fill="#c0392b">Захист від міжфазного КЗ</text>

  <!-- Branch 3 (Coil KM3 - Interlocked) -->
  <rect x="685" y="408" width="210" height="60" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="693" y="424" font-size="12" font-weight="bold" fill="#c0392b">Гілка 3: Котушка KM3</text>
  <text x="693" y="442" font-size="12" fill="#1a1a1a">Заблоковано контактом KM1.NC</text>
  <text x="693" y="458" font-size="12" fill="#c0392b">Захист від міжфазного КЗ</text>

  <!-- Interlock Pause Footer -->
  <text x="790" y="485" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">t_pause ≈ 150..300 мс (пауза)</text>

</svg>
