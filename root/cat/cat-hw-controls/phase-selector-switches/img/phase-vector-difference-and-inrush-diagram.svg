<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Векторна різниця напруг та кидок пускового струму</text>
  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Формування результуючого вектора ΔU та викликаний ним надмірний струм I_inrush при протифазній комутації</text>

  <!-- Left Panel: Vector Diagram -->
  <rect x="30" y="70" width="440" height="445" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="250" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Векторна діаграма напруг (ΔU)</text>

  <!-- Origin axes -->
  <line x1="60" y1="300" x2="440" y2="300" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="250" y1="110" x2="250" y2="480" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="250" cy="300" r="4" fill="#1a1a1a"/>
  <text x="235" y="315" font-size="12" fill="#6b7280">O</text>

  <!-- Vector 1: U_grid1 (Mains Phase L1) -->
  <line x1="250" y1="300" x2="410" y2="300" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>
  <text x="420" y="295" font-size="12" font-weight="bold" fill="#2457d6">U_L1 (Мережа 1)</text>

  <!-- Vector 2: E_bemf (Motor Back-EMF) -->
  <line x1="250" y1="300" x2="140" y2="210" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arr-gray)"/>
  <text x="80" y="210" font-size="12" font-weight="bold" fill="#6b7280">E_bemf (Проти-ЕРС)</text>

  <!-- Vector 3: U_grid2 (Target Phase L2) -->
  <line x1="250" y1="300" x2="150" y2="160" stroke="#27ae60" stroke-width="3" marker-end="url(#arr-green)"/>
  <text x="80" y="150" font-size="12" font-weight="bold" fill="#27ae60">U_L2 (Мережа 2)</text>

  <!-- Difference Vector ΔU = U_L1 - E_bemf -->
  <line x1="140" y1="210" x2="410" y2="300" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-red)"/>
  <text x="270" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">ΔU = U_L1 - E_bemf</text>

  <!-- Angle delta arc -->
  <path d="M 310,300 A 60,60 0 0,0 183,245" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <text x="245" y="265" font-size="12" font-weight="bold" fill="#2457d6">Кут δ</text>

  <!-- Explanatory Box at bottom left -->
  <rect x="50" y="420" width="400" height="75" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="250" y="442" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Максимальний сумарний потенціал ΔU</text>
  <text x="250" y="462" text-anchor="middle" font-size="12" fill="#1a1a1a">При зсуві фаз δ = 180° амплітуда напруги досягає 2·U_nom,</text>
  <text x="250" y="480" text-anchor="middle" font-size="12" fill="#1a1a1a">що спричиняє руйнівний екстремальний кидок струму.</text>


  <!-- Right Panel: Inrush Current Waveform -->
  <rect x="490" y="70" width="440" height="445" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="710" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Перехідний кидок струму i(t)</text>

  <!-- Graph box -->
  <rect x="510" y="115" width="400" height="380" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>

  <!-- Graph Axes -->
  <line x1="540" y1="300" x2="890" y2="300" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="895" y="305" font-size="12" font-weight="bold" fill="#1a1a1a">t</text>
  <line x1="560" y1="460" x2="560" y2="135" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="550" y="130" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">i(t)</text>

  <!-- Nominal current level lines (+I_nom, -I_nom) -->
  <line x1="560" y1="260" x2="890" y2="260" stroke="#27ae60" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="555" y="264" text-anchor="end" font-size="12" fill="#27ae60">I_nom</text>

  <line x1="560" y1="340" x2="890" y2="340" stroke="#27ae60" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="555" y="344" text-anchor="end" font-size="12" fill="#27ae60">-I_nom</text>

  <!-- Inrush Current Curve (Switched without delay at t=0) -->
  <path d="M 560,300 C 570,140 580,440 600,180 C 620,380 640,240 670,330 C 700,280 730,310 760,295 C 790,305 820,298 880,300" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Peak Inrush Marker -->
  <line x1="575" y1="145" x2="575" y2="300" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="575" cy="148" r="5" fill="#c0392b"/>
  <text x="585" y="155" font-size="12" font-weight="bold" fill="#c0392b">I_inrush = ΔU / Z_sub</text>

  <!-- Normal Delayed Switch Curve (Green, smooth transition) -->
  <path d="M 560,300 Q 640,300 680,300 C 700,260 720,340 740,260 C 760,340 780,260 880,300" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="730" y="245" font-size="12" font-weight="bold" fill="#27ae60">Комутація із затримкою (Без кидка)</text>

  <!-- Explanatory note at bottom right -->
  <rect x="530" y="445" width="360" height="40" rx="4" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1"/>
  <text x="710" y="462" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">T_transfer витримує час згасання E_bemf,</text>
  <text x="710" y="478" text-anchor="middle" font-size="12" fill="#6b7280">що знижує струм до безпечного номінального рівня</text>
</svg>
