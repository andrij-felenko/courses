<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Header -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Силова та колова схема дворубіжного блокування контакторів KM1, KM2, KM3</text>
  <text x="480" y="55" text-anchor="middle" font-size="13" fill="#6b7280">Послідовне електричне блокування через NC-контакти та механічні коромисла захищають від міжфазного КЗ</text>

  <!-- Panel 1: Power & Mechanical Interlock -->
  <rect x="40" y="75" width="420" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="250" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Силові кола та механічне блокування</text>

  <!-- Input Phase Labels -->
  <text x="110" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Фаза L1</text>
  <text x="250" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Фаза L2</text>
  <text x="390" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Фаза L3</text>

  <!-- Input wires to Contactors -->
  <line x1="110" y1="136" x2="110" y2="195" stroke="#c0392b" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="250" y1="136" x2="250" y2="195" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="390" y1="136" x2="390" y2="195" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Contactor Power Blocks -->
  <!-- KM1 Power Box -->
  <rect x="65" y="195" width="90" height="135" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="110" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">KM1</text>
  <line x1="110" y1="222" x2="110" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="110" cy="230" r="3" fill="#1a1a1a"/>
  <line x1="110" y1="250" x2="122" y2="231" stroke="#c0392b" stroke-width="2"/>
  <circle cx="110" cy="250" r="3" fill="#1a1a1a"/>
  <line x1="110" y1="250" x2="110" y2="330" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="120" y="270" text-anchor="start" font-size="11" fill="#6b7280">ГОЛОВНІ</text>
  <text x="120" y="285" text-anchor="start" font-size="11" fill="#6b7280">NO</text>

  <!-- KM2 Power Box -->
  <rect x="205" y="195" width="90" height="135" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="250" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">KM2</text>
  <line x1="250" y1="222" x2="250" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="250" cy="230" r="3" fill="#1a1a1a"/>
  <line x1="250" y1="250" x2="262" y2="231" stroke="#c0392b" stroke-width="2"/>
  <circle cx="250" cy="250" r="3" fill="#1a1a1a"/>
  <line x1="250" y1="250" x2="250" y2="330" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="260" y="270" text-anchor="start" font-size="11" fill="#6b7280">ГОЛОВНІ</text>
  <text x="260" y="285" text-anchor="start" font-size="11" fill="#6b7280">NO</text>

  <!-- KM3 Power Box -->
  <rect x="345" y="195" width="90" height="135" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="390" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">KM3</text>
  <line x1="390" y1="222" x2="390" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="390" cy="230" r="3" fill="#1a1a1a"/>
  <line x1="390" y1="250" x2="402" y2="231" stroke="#c0392b" stroke-width="2"/>
  <circle cx="390" cy="250" r="3" fill="#1a1a1a"/>
  <line x1="390" y1="250" x2="390" y2="330" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="400" y="270" text-anchor="start" font-size="11" fill="#6b7280">ГОЛОВНІ</text>
  <text x="400" y="285" text-anchor="start" font-size="11" fill="#6b7280">NO</text>

  <!-- Mechanical Interlocks -->
  <!-- Rocker 1 (KM1-KM2) -->
  <line x1="155" y1="240" x2="205" y2="240" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3"/>
  <rect x="171" y="232" width="18" height="16" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="180" y="225" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">МЕХ. БЛОК.</text>

  <!-- Rocker 2 (KM2-KM3) -->
  <line x1="295" y1="240" x2="345" y2="240" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3"/>
  <rect x="311" y="232" width="18" height="16" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="320" y="225" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">МЕХ. БЛОК.</text>

  <!-- Common Output Load Bus -->
  <line x1="110" y1="365" x2="390" y2="365" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="110" y1="330" x2="110" y2="365" stroke="#2457d6" stroke-width="2"/>
  <line x1="250" y1="330" x2="250" y2="365" stroke="#2457d6" stroke-width="2"/>
  <line x1="390" y1="330" x2="390" y2="365" stroke="#2457d6" stroke-width="2"/>
  <circle cx="110" cy="365" r="3.5" fill="#2457d6"/>
  <circle cx="250" cy="365" r="3.5" fill="#2457d6"/>
  <circle cx="390" cy="365" r="3.5" fill="#2457d6"/>

  <line x1="250" y1="365" x2="250" y2="400" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- Output Load Box -->
  <rect x="140" y="400" width="220" height="50" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="250" y="422" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Вихід до споживача (L_out)</text>
  <text x="250" y="440" text-anchor="middle" font-size="11" fill="#1a1a1a">Обрана пріоритетна фаза</text>

  <!-- Panel 2: Control & Electrical Interlock -->
  <rect x="480" y="75" width="440" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="700" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Кола керування та електричного блокування</text>

  <!-- Channel Inputs -->
  <text x="540" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Cmd1 (L1)</text>
  <text x="700" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Cmd2 (L2)</text>
  <text x="860" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Cmd3 (L3)</text>

  <!-- Channel 1 (KM1 Coil via KM2_NC, KM3_NC) -->
  <line x1="540" y1="135" x2="540" y2="160" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="495" y="160" width="90" height="45" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="540" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">KM2 NC</text>
  <text x="540" y="194" text-anchor="middle" font-size="11" fill="#6b7280">(контакт KM2)</text>

  <line x1="540" y1="205" x2="540" y2="230" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="495" y="230" width="90" height="45" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="540" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">KM3 NC</text>
  <text x="540" y="264" text-anchor="middle" font-size="11" fill="#6b7280">(контакт KM3)</text>

  <line x1="540" y1="275" x2="540" y2="305" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="495" y="305" width="90" height="50" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="540" y="325" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">KM1</text>
  <text x="540" y="343" text-anchor="middle" font-size="11" fill="#6b7280">Котушка A1-A2</text>

  <line x1="540" y1="355" x2="540" y2="395" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Channel 2 (KM2 Coil via KM1_NC, KM3_NC) -->
  <line x1="700" y1="135" x2="700" y2="160" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="655" y="160" width="90" height="45" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="700" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">KM1 NC</text>
  <text x="700" y="194" text-anchor="middle" font-size="11" fill="#6b7280">(контакт KM1)</text>

  <line x1="700" y1="205" x2="700" y2="230" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="655" y="230" width="90" height="45" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="700" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">KM3 NC</text>
  <text x="700" y="264" text-anchor="middle" font-size="11" fill="#6b7280">(контакт KM3)</text>

  <line x1="700" y1="275" x2="700" y2="305" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="655" y="305" width="90" height="50" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="700" y="325" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">KM2</text>
  <text x="700" y="343" text-anchor="middle" font-size="11" fill="#6b7280">Котушка A1-A2</text>

  <line x1="700" y1="355" x2="700" y2="395" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Channel 3 (KM3 Coil via KM1_NC, KM2_NC) -->
  <line x1="860" y1="135" x2="860" y2="160" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="815" y="160" width="90" height="45" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="860" y="178" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">KM1 NC</text>
  <text x="860" y="194" text-anchor="middle" font-size="11" fill="#6b7280">(контакт KM1)</text>

  <line x1="860" y1="205" x2="860" y2="230" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="815" y="230" width="90" height="45" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="860" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">KM2 NC</text>
  <text x="860" y="264" text-anchor="middle" font-size="11" fill="#6b7280">(контакт KM2)</text>

  <line x1="860" y1="275" x2="860" y2="305" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="815" y="305" width="90" height="50" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="860" y="325" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">KM3</text>
  <text x="860" y="343" text-anchor="middle" font-size="11" fill="#6b7280">Котушка A1-A2</text>

  <line x1="860" y1="355" x2="860" y2="395" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Neutral Bus -->
  <line x1="540" y1="395" x2="860" y2="395" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="540" cy="395" r="3.5" fill="#1a1a1a"/>
  <circle cx="700" cy="395" r="3.5" fill="#1a1a1a"/>
  <circle cx="860" cy="395" r="3.5" fill="#1a1a1a"/>

  <line x1="700" y1="395" x2="700" y2="418" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="615" y="418" width="170" height="36" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="700" y="440" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Загальна нейтраль N</text>

  <!-- Bottom Summary Banner -->
  <rect x="40" y="485" width="880" height="55" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="508" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Принцип дворубіжного взаємного блокування контакторів:</text>
  <text x="480" y="528" text-anchor="middle" font-size="11" fill="#1a1a1a">1. Електричне: знеструмлення котушки через NC-контакти   |   2. Механічне: фізичне блокування штоків коромислом</text>
</svg>
