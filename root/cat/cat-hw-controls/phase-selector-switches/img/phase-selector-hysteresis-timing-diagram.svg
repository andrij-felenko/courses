<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-main" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background canvas -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Header -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Порогова характеристика та часова діаграма перемикання фаз</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Гістерезис ΔU запобігає деренчанню контактів, а безнапругова пауза t_off забезпечує безпечне гасіння дуги</text>

  <!-- Upper Panel: Voltage U(t) -->
  <rect x="120" y="70" width="800" height="240" fill="#f4f6f8" stroke="#d0d7de" rx="6"/>
  <text x="135" y="92" font-size="13" font-weight="bold" fill="#1a1a1a">Вхідна напруга мережі U(t)</text>

  <!-- Y-axis Voltage Levels & Labels -->
  <line x1="120" y1="105" x2="910" y2="105" stroke="#c0392b" stroke-dasharray="4,4" stroke-width="1.2"/>
  <text x="110" y="109" font-size="12" fill="#c0392b" font-weight="bold" text-anchor="end">U_max (253 V)</text>

  <line x1="120" y1="125" x2="910" y2="125" stroke="#6b7280" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="110" y="129" font-size="12" fill="#6b7280" text-anchor="end">U_max - ΔU</text>

  <line x1="120" y1="160" x2="910" y2="160" stroke="#27ae60" stroke-dasharray="6,4" stroke-width="1.5"/>
  <text x="110" y="164" font-size="12" fill="#27ae60" font-weight="bold" text-anchor="end">U_nom (230 V)</text>

  <line x1="120" y1="205" x2="910" y2="205" stroke="#6b7280" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="110" y="209" font-size="12" fill="#6b7280" text-anchor="end">U_min + ΔU</text>

  <line x1="120" y1="225" x2="910" y2="225" stroke="#c0392b" stroke-dasharray="4,4" stroke-width="1.2"/>
  <text x="110" y="229" font-size="12" fill="#c0392b" font-weight="bold" text-anchor="end">U_min (195 V)</text>

  <!-- X Time Axis for Voltage Panel -->
  <line x1="120" y1="285" x2="905" y2="285" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-main)"/>
  <text x="915" y="289" font-size="12" fill="#1a1a1a" font-weight="bold">t</text>

  <!-- Vertical Time Marker Lines across panels -->
  <line x1="285" y1="105" x2="285" y2="480" stroke="#c0392b" stroke-dasharray="3,3" stroke-width="1.2"/>
  <text x="285" y="300" font-size="12" fill="#c0392b" font-weight="bold" text-anchor="middle">t1</text>

  <line x1="335" y1="105" x2="335" y2="480" stroke="#c0392b" stroke-dasharray="3,3" stroke-width="1.2"/>
  <text x="335" y="300" font-size="12" fill="#c0392b" font-weight="bold" text-anchor="middle">t2</text>

  <line x1="415" y1="105" x2="415" y2="480" stroke="#2457d6" stroke-dasharray="3,3" stroke-width="1.2"/>
  <text x="415" y="300" font-size="12" fill="#2457d6" font-weight="bold" text-anchor="middle">t3</text>

  <line x1="620" y1="105" x2="620" y2="480" stroke="#27ae60" stroke-dasharray="3,3" stroke-width="1.2"/>
  <text x="620" y="300" font-size="12" fill="#27ae60" font-weight="bold" text-anchor="middle">t4</text>

  <!-- Voltage Waveform U(t) -->
  <path d="M 130 160 L 260 160 Q 275 160 285 225 L 305 250 L 335 255 L 370 232 L 400 245 L 440 215 L 480 220 L 520 212 L 560 218 Q 590 215 620 205 L 660 160 L 890 160" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Delay t_delay Indicator -->
  <line x1="285" y1="268" x2="335" y2="268" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-red)" marker-end="url(#arr-red)"/>
  <rect x="288" y="254" width="44" height="14" fill="#ffffff" rx="2"/>
  <text x="310" y="265" font-size="11" fill="#c0392b" font-weight="bold" text-anchor="middle">t_delay</text>

  <!-- Hysteresis ΔU Callout Dimension Line -->
  <line x1="820" y1="205" x2="820" y2="225" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
  <text x="830" y="219" font-size="12" fill="#2457d6" font-weight="bold">ΔU (гістерезис)</text>

  <!-- Lower Panel: Contact State (Phase Switching) -->
  <rect x="120" y="330" width="800" height="160" fill="#f4f6f8" stroke="#d0d7de" rx="6"/>
  <text x="135" y="350" font-size="13" font-weight="bold" fill="#1a1a1a">Стан силових контактів перемикача</text>

  <!-- Dead Time Highlight Box (t_off) -->
  <rect x="335" y="330" width="80" height="160" fill="#fdecea" opacity="0.75" stroke="#c0392b" stroke-dasharray="4,3"/>
  <text x="375" y="405" font-size="11" fill="#c0392b" font-weight="bold" text-anchor="middle">
    <tspan x="375" dy="0">Пауза t_off</tspan>
    <tspan x="375" dy="14">(безнапругова)</tspan>
    <tspan x="375" dy="14">гасіння дуги</tspan>
  </text>

  <!-- Phase L1 Contact State Trace -->
  <rect x="130" y="370" width="205" height="30" fill="#e9f7ef" rx="3"/>
  <path d="M 130 370 L 335 370 L 335 400 L 890 400" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <text x="140" y="362" font-size="12" fill="#27ae60" font-weight="bold">Фаза L1 (Основна): УВІМКНЕНО</text>
  <text x="345" y="395" font-size="11" fill="#6b7280">L1 ВИМК</text>

  <!-- Phase L2 Contact State Trace -->
  <rect x="415" y="435" width="475" height="30" fill="#eaf0fd" rx="3"/>
  <path d="M 130 465 L 415 465 L 415 435 L 890 435" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <text x="140" y="460" font-size="11" fill="#6b7280">L2 ВИМК</text>
  <text x="425" y="427" font-size="12" fill="#2457d6" font-weight="bold">Фаза L2 (Резервна): УВІМКНЕНО</text>

  <!-- Bottom Legend / Notes -->
  <rect x="120" y="500" width="800" height="25" fill="#ffffff" stroke="#d0d7de" rx="4"/>
  <text x="130" y="517" font-size="11" fill="#6b7280">
    <tspan fill="#c0392b" font-weight="bold">t1-t2:</tspan> затримка спрацьовування t_delay (відлаштування від завад)  |  
    <tspan fill="#c0392b" font-weight="bold">t2-t3:</tspan> безнапругова пауза t_off (захист від дуги та проти-ЕРС)  |  
    <tspan fill="#2457d6" font-weight="bold">ΔU:</tspan> запобігання зворотному хибному перемиканню
  </text>
</svg>
