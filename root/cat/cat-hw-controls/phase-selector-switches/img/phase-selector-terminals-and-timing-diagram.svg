<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="36" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Специфікація клем та часова діаграма автоматичного перемикача фаз</text>
  <text x="480" y="56" font-size="13" text-anchor="middle" fill="#6b7280">Розташування силових клем L1–L3/N/OUT та часові затримки T_off, T_transfer і T_on для беззбійної комутації</text>

  <!-- LEFT PANEL: TERMINAL WIRING -->
  <rect x="30" y="80" width="350" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="30" y="80" width="350" height="40" rx="8" fill="#eaf0fd"/>
  <text x="45" y="105" font-size="14" font-weight="bold" fill="#2457d6">Схема силових клем та кросу</text>

  <!-- Terminal Block Artwork -->
  <rect x="55" y="140" width="300" height="200" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Top Inputs Row -->
  <rect x="75" y="155" width="45" height="45" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="97.5" y="182" font-size="14" font-weight="bold" text-anchor="middle" fill="#c0392b">L1</text>
  <text x="97.5" y="215" font-size="11" text-anchor="middle" fill="#c0392b">Фаза A</text>

  <rect x="140" y="155" width="45" height="45" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="162.5" y="182" font-size="14" font-weight="bold" text-anchor="middle" fill="#27ae60">L2</text>
  <text x="162.5" y="215" font-size="11" text-anchor="middle" fill="#27ae60">Фаза B</text>

  <rect x="205" y="155" width="45" height="45" rx="4" fill="#f4f6f8" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="227.5" y="182" font-size="14" font-weight="bold" text-anchor="middle" fill="#6b7280">L3</text>
  <text x="227.5" y="215" font-size="11" text-anchor="middle" fill="#6b7280">Фаза C</text>

  <rect x="270" y="155" width="45" height="45" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="292.5" y="182" font-size="14" font-weight="bold" text-anchor="middle" fill="#2457d6">N</text>
  <text x="292.5" y="215" font-size="11" text-anchor="middle" fill="#2457d6">Нуль</text>

  <!-- Bottom Output & NC Block Row -->
  <rect x="95" y="245" width="85" height="45" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="137.5" y="272" font-size="14" font-weight="bold" text-anchor="middle" fill="#27ae60">OUT</text>
  <text x="137.5" y="305" font-size="11" text-anchor="middle" fill="#27ae60">Вихід навантаження</text>

  <rect x="205" y="245" width="110" height="45" rx="4" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <text x="260" y="272" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">NC-блок</text>
  <text x="260" y="305" font-size="11" text-anchor="middle" fill="#2457d6">Захисне блокування</text>

  <!-- Explanations in Left Panel -->
  <text x="45" y="365" font-size="12" fill="#1a1a1a">• L1–L3: трифазне живлення на вході</text>
  <text x="45" y="390" font-size="12" fill="#27ae60">• OUT: робоча фаза з найліпшою напругою</text>
  <text x="45" y="415" font-size="12" fill="#2457d6">• NC-контакти: блокування міжфазних КЗ</text>

  <!-- RIGHT PANEL: TIMING DIAGRAM -->
  <rect x="410" y="80" width="520" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="410" y="80" width="520" height="40" rx="8" fill="#e9f7ef"/>
  <text x="425" y="105" font-size="14" font-weight="bold" fill="#27ae60">Часова діаграма комутаційних затримок</text>

  <!-- Dead-time Region Shading (T_transfer) -->
  <rect x="620" y="135" width="90" height="195" fill="#eaf0fd" opacity="0.6"/>

  <!-- Waveform Row 1: U_L1 -->
  <text x="490" y="152" font-size="11" text-anchor="end" fill="#c0392b">U_L1 (Фаза 1)</text>
  <line x1="500" y1="148" x2="570" y2="148" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="570" y1="148" x2="570" y2="165" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="570" y1="165" x2="900" y2="165" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Dimension T_off -->
  <line x1="570" y1="140" x2="570" y2="195" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="620" y1="140" x2="620" y2="235" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="570" y1="175" x2="620" y2="175" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="595" y="171" font-size="11" font-weight="bold" text-anchor="middle" fill="#c0392b">T_off</text>

  <!-- Waveform Row 2: Contact L1 -->
  <text x="490" y="195" font-size="11" text-anchor="end" fill="#1a1a1a">Контакт L1</text>
  <line x1="500" y1="190" x2="620" y2="190" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="620" y1="190" x2="620" y2="205" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="620" y1="205" x2="900" y2="205" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- Dimension T_transfer -->
  <line x1="710" y1="140" x2="710" y2="290" stroke="#27ae60" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="620" y1="220" x2="710" y2="220" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="665" y="215" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">T_transfer</text>

  <!-- Waveform Row 3: Contact L2 -->
  <text x="490" y="250" font-size="11" text-anchor="end" fill="#1a1a1a">Контакт L2</text>
  <line x1="500" y1="260" x2="710" y2="260" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="710" y1="260" x2="710" y2="245" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="710" y1="245" x2="900" y2="245" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Dimension T_on -->
  <line x1="780" y1="140" x2="780" y2="290" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="710" y1="275" x2="780" y2="275" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="745" y="271" font-size="11" font-weight="bold" text-anchor="middle" fill="#27ae60">T_on</text>

  <!-- Waveform Row 4: U_OUT -->
  <text x="490" y="305" font-size="11" font-weight="bold" text-anchor="end" fill="#27ae60">U_OUT</text>
  <line x1="500" y1="300" x2="570" y2="300" stroke="#27ae60" stroke-width="2.5"/>
  <line x1="570" y1="300" x2="620" y2="310" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="620" y1="315" x2="710" y2="315" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="710" y1="315" x2="710" y2="300" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="710" y1="300" x2="900" y2="300" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Time Axis -->
  <line x1="500" y1="330" x2="895" y2="330" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <text x="902" y="334" font-size="11" fill="#1a1a1a">t</text>

  <!-- Explanations in Right Panel -->
  <text x="425" y="360" font-size="11" fill="#c0392b">• T_off: затримка виявлення аварії напруги L1 (20…500 мс)</text>
  <text x="425" y="385" font-size="11" fill="#2457d6">• T_transfer: дугогасна пауза та дебаунс NC-контактів (50…200 мс)</text>
  <text x="425" y="410" font-size="11" fill="#27ae60">• T_on: затримка повторного ввімкнення після стабілізації (0.1…10 с)</text>

  <!-- BOTTOM SUMMARY BAR -->
  <rect x="30" y="475" width="900" height="32" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="496" font-size="12" text-anchor="middle" fill="#1a1a1a">Пауза T_transfer між розмиканням L1 та замиканням L2 унеможливлює коротке замикання між фазами</text>
</svg>
