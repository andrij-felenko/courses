<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема клемного підключення перемикача фаз</text>
  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Розподіл силових ліній L1-L3, N, виходу L_out та сигнальних колодок NC-блокування</text>

  <!-- PANEL 1: 3-Phase Grid Input -->
  <rect x="40" y="70" width="250" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="165" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">3-фазна мережа живлення</text>

  <!-- Line L1 -->
  <rect x="52" y="139" width="35" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="69" y="154" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">L1</text>
  <line x1="87" y1="150" x2="130" y2="150" stroke="#2457d6" stroke-width="1.5"/>
  <!-- QF1 Fuse/Breaker -->
  <rect x="130" y="142" width="45" height="16" fill="white" stroke="#1a1a1a" stroke-width="1"/>
  <text x="152" y="154" text-anchor="middle" font-size="12" fill="#1a1a1a">QF1</text>
  <line x1="175" y1="150" x2="345" y2="150" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Line L2 -->
  <rect x="52" y="199" width="35" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="69" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">L2</text>
  <line x1="87" y1="210" x2="130" y2="210" stroke="#2457d6" stroke-width="1.5"/>
  <!-- QF2 Fuse/Breaker -->
  <rect x="130" y="202" width="45" height="16" fill="white" stroke="#1a1a1a" stroke-width="1"/>
  <text x="152" y="214" text-anchor="middle" font-size="12" fill="#1a1a1a">QF2</text>
  <line x1="175" y1="210" x2="345" y2="210" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Line L3 -->
  <rect x="52" y="259" width="35" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="69" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">L3</text>
  <line x1="87" y1="270" x2="130" y2="270" stroke="#2457d6" stroke-width="1.5"/>
  <!-- QF3 Fuse/Breaker -->
  <rect x="130" y="262" width="45" height="16" fill="white" stroke="#1a1a1a" stroke-width="1"/>
  <text x="152" y="274" text-anchor="middle" font-size="12" fill="#1a1a1a">QF3</text>
  <line x1="175" y1="270" x2="345" y2="270" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Line N -->
  <rect x="52" y="339" width="35" height="22" rx="4" fill="#eaf0fd" stroke="#6b7280"/>
  <text x="69" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">N</text>
  <line x1="87" y1="350" x2="345" y2="350" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Info Box in Panel 1 -->
  <rect x="52" y="400" width="226" height="75" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="165" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Параметри мережі</text>
  <text x="165" y="436" text-anchor="middle" font-size="12" fill="#6b7280">3 х 230 В / 400 В, 50 Гц</text>
  <text x="165" y="454" text-anchor="middle" font-size="12" fill="#6b7280">Захист: автомати QF1..QF3</text>


  <!-- PANEL 2: Phase Selector Module -->
  <rect x="310" y="70" width="340" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Модуль перемикача фаз</text>

  <!-- Device Enclosure -->
  <rect x="330" y="112" width="300" height="365" rx="6" fill="white" stroke="#2457d6" stroke-width="2"/>
  <text x="480" y="126" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Перемикач фаз PEF / АВР</text>

  <!-- Input Terminals Left -->
  <!-- Terminal L1 -->
  <circle cx="355" cy="150" r="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="350" y1="150" x2="360" y2="150" stroke="#2457d6" stroke-width="1.5"/>
  <text x="372" y="154" font-size="12" font-weight="bold" fill="#1a1a1a">L1 (Вхід 1)</text>

  <!-- Terminal L2 -->
  <circle cx="355" cy="210" r="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="350" y1="210" x2="360" y2="210" stroke="#2457d6" stroke-width="1.5"/>
  <text x="372" y="214" font-size="12" font-weight="bold" fill="#1a1a1a">L2 (Вхід 2)</text>

  <!-- Terminal L3 -->
  <circle cx="355" cy="270" r="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="350" y1="270" x2="360" y2="270" stroke="#2457d6" stroke-width="1.5"/>
  <text x="372" y="274" font-size="12" font-weight="bold" fill="#1a1a1a">L3 (Вхід 3)</text>

  <!-- Terminal N -->
  <circle cx="355" cy="350" r="10" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="350" y1="350" x2="360" y2="350" stroke="#6b7280" stroke-width="1.5"/>
  <text x="372" y="341" font-size="12" font-weight="bold" fill="#1a1a1a">N (Нейтраль)</text>

  <!-- Internal Switching Channels -->
  <!-- Channel L1 (ACTIVE - GREEN) -->
  <line x1="435" y1="150" x2="470" y2="150" stroke="#27ae60" stroke-width="2"/>
  <line x1="470" y1="150" x2="510" y2="150" stroke="#27ae60" stroke-width="2"/>
  <text x="490" y="141" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">K1 (АКТИВНА)</text>

  <!-- Channel L2 (STANDBY) -->
  <line x1="435" y1="210" x2="470" y2="210" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="470" y1="210" x2="500" y2="198" stroke="#6b7280" stroke-width="1.5"/>
  <text x="490" y="226" text-anchor="middle" font-size="12" fill="#6b7280">K2 (Резерв)</text>

  <!-- Channel L3 (STANDBY) -->
  <line x1="435" y1="270" x2="470" y2="270" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="470" y1="270" x2="500" y2="258" stroke="#6b7280" stroke-width="1.5"/>
  <text x="490" y="286" text-anchor="middle" font-size="12" fill="#6b7280">K3 (Резерв)</text>

  <!-- Common Output Bus Line to L_out -->
  <line x1="510" y1="150" x2="540" y2="150" stroke="#27ae60" stroke-width="2"/>
  <line x1="540" y1="150" x2="540" y2="180" stroke="#27ae60" stroke-width="2"/>
  <line x1="540" y1="180" x2="595" y2="180" stroke="#27ae60" stroke-width="2"/>

  <!-- Output Terminal L_out -->
  <circle cx="605" cy="180" r="10" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="600" y1="180" x2="610" y2="180" stroke="#27ae60" stroke-width="1.5"/>
  <text x="605" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">L_out (Вихід)</text>

  <!-- Line L_out exiting to Panel 3 -->
  <line x1="615" y1="180" x2="690" y2="180" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Neutral Line passing through to Panel 3 -->
  <line x1="365" y1="350" x2="690" y2="350" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- NC Interlock Block in Panel 2 -->
  <rect x="345" y="380" width="270" height="85" rx="5" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="396" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Колодки NC-блокування (NC1, NC2, NC3)</text>

  <!-- NC1 -->
  <circle cx="375" cy="420" r="5" fill="white" stroke="#1a1a1a"/>
  <circle cx="405" cy="420" r="5" fill="white" stroke="#1a1a1a"/>
  <line x1="375" y1="414" x2="405" y2="414" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="390" y="445" text-anchor="middle" font-size="12" fill="#1a1a1a">NC1</text>

  <!-- NC2 -->
  <circle cx="465" cy="420" r="5" fill="white" stroke="#1a1a1a"/>
  <circle cx="495" cy="420" r="5" fill="white" stroke="#1a1a1a"/>
  <line x1="465" y1="414" x2="495" y2="414" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="480" y="445" text-anchor="middle" font-size="12" fill="#1a1a1a">NC2</text>

  <!-- NC3 -->
  <circle cx="555" cy="420" r="5" fill="white" stroke="#1a1a1a"/>
  <circle cx="585" cy="420" r="5" fill="white" stroke="#1a1a1a"/>
  <line x1="555" y1="414" x2="585" y2="414" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="570" y="445" text-anchor="middle" font-size="12" fill="#1a1a1a">NC3</text>


  <!-- PANEL 3: Load & NC Interlock Feedback -->
  <rect x="670" y="70" width="250" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="795" y="94" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Навантаження та NC-блокування</text>

  <!-- Load Module -->
  <rect x="690" y="140" width="210" height="110" rx="6" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <text x="795" y="162" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Однофазне навантаження</text>

  <text x="700" y="184" font-size="12" font-weight="bold" fill="#27ae60">L_out (~230 В)</text>
  <text x="700" y="214" font-size="12" fill="#6b7280">N (Нейтраль)</text>
  <text x="795" y="238" text-anchor="middle" font-size="12" fill="#6b7280">Критичні споживачі / Щит АВР</text>

  <!-- Interlock Info & Contactor Circuit Panel -->
  <rect x="690" y="270" width="210" height="205" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="795" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Електричне NC-блокування</text>

  <text x="795" y="316" text-anchor="middle" font-size="12" fill="#1a1a1a">Запобігання міжфазному KЗ</text>
  <text x="795" y="336" text-anchor="middle" font-size="12" fill="#6b7280">Пристрої: контактори K1..K3</text>

  <!-- Warning / Pause Box -->
  <rect x="695" y="350" width="200" height="42" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="795" y="367" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Затримка t_pause ≈ 150..300 мс</text>
  <text x="795" y="383" text-anchor="middle" font-size="12" fill="#c0392b">Безаварійна пауза перемикання</text>

  <text x="795" y="414" text-anchor="middle" font-size="12" fill="#6b7280">NC1-NC3 блокують увімкнення</text>
  <text x="795" y="432" text-anchor="middle" font-size="12" fill="#6b7280">інших фаз при замкненому контактора</text>

</svg>
