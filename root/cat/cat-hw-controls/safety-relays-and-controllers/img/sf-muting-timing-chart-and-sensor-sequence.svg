<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Маркери стрілок -->
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Часова діаграма послідовності у функціональному блоці SF_Muting</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Автоматичне маскування світлового бар'єра при валідному спрацьовуванні датчиків MutingIn_1 та MutingIn_2</text>

  <!-- ЛІВА СТОРОНА: ФУНКЦІОНАЛЬНИЙ БЛОК SF_Muting (PLCopen) -->
  <g id="fb-sf-muting">
    <!-- Тіло блоку -->
    <rect x="50" y="90" width="270" height="350" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>

    <!-- Заголовок блоку -->
    <path d="M 50,98 A 8,8 0 0 1 58,90 H 312 A 8,8 0 0 1 320,98 V 126 H 50 Z" fill="#2457d6"/>
    <text x="185" y="113" text-anchor="middle" font-size="14" font-weight="bold" fill="white">SF_Muting (PLCopen)</text>

    <!-- Входи (Left Side) -->
    <line x1="20" y1="160" x2="50" y2="160" stroke="#2457d6" stroke-width="1.5"/>
    <text x="58" y="164" text-anchor="start" font-size="11" font-weight="bold" fill="#1a1a1a">Activate</text>

    <line x1="20" y1="200" x2="50" y2="200" stroke="#c0392b" stroke-width="1.5"/>
    <text x="58" y="204" text-anchor="start" font-size="11" font-weight="bold" fill="#c0392b">S_SafetyIn</text>

    <line x1="20" y1="240" x2="50" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="58" y="244" text-anchor="start" font-size="11" font-weight="bold" fill="#1a1a1a">MutingIn_1</text>

    <line x1="20" y1="280" x2="50" y2="280" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="58" y="284" text-anchor="start" font-size="11" font-weight="bold" fill="#1a1a1a">MutingIn_2</text>

    <line x1="20" y1="320" x2="50" y2="320" stroke="#2457d6" stroke-width="1.5"/>
    <text x="58" y="324" text-anchor="start" font-size="11" font-weight="bold" fill="#2457d6">DiscTime12</text>

    <line x1="20" y1="360" x2="50" y2="360" stroke="#2457d6" stroke-width="1.5"/>
    <text x="58" y="364" text-anchor="start" font-size="11" font-weight="bold" fill="#2457d6">MaxMutingTime</text>

    <line x1="20" y1="400" x2="50" y2="400" stroke="#6b7280" stroke-width="1.5"/>
    <text x="58" y="404" text-anchor="start" font-size="11" font-weight="bold" fill="#6b7280">Reset</text>

    <!-- Виходи (Right Side) -->
    <line x1="320" y1="160" x2="350" y2="160" stroke="#2457d6" stroke-width="1.5"/>
    <text x="312" y="164" text-anchor="end" font-size="11" font-weight="bold" fill="#1a1a1a">Ready</text>

    <line x1="320" y1="200" x2="350" y2="200" stroke="#27ae60" stroke-width="2"/>
    <text x="312" y="204" text-anchor="end" font-size="11" font-weight="bold" fill="#27ae60">S_MutingOut</text>

    <line x1="320" y1="260" x2="350" y2="260" stroke="#2457d6" stroke-width="1.5"/>
    <text x="312" y="264" text-anchor="end" font-size="11" font-weight="bold" fill="#2457d6">MutingActive</text>

    <line x1="320" y1="360" x2="350" y2="360" stroke="#c0392b" stroke-width="1.5"/>
    <text x="312" y="364" text-anchor="end" font-size="11" font-weight="bold" fill="#c0392b">Error</text>

    <!-- Інформаційна картка всередині FB -->
    <rect x="110" y="285" width="150" height="45" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
    <text x="185" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Стан: Muting Active</text>
    <text x="185" y="320" text-anchor="middle" font-size="10" fill="#6b7280">Автомат станів (FSM)</text>
  </g>

  <!-- ПРАВА СТОРОНА: ЧАСОВА ДІАГРАМА СИГНАЛІВ -->
  <g id="timing-diagram">
    <!-- Тло часової діаграми -->
    <rect x="370" y="90" width="560" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

    <!-- Заголовок діаграми -->
    <rect x="382" y="100" width="536" height="30" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
    <text x="650" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Послідовність сигналів при проходженні палети</text>

    <!-- Позначки сигналів -->
    <text x="385" y="154" text-anchor="start" font-size="11" font-weight="bold" fill="#1a1a1a">MutingIn_1</text>
    <text x="385" y="209" text-anchor="start" font-size="11" font-weight="bold" fill="#1a1a1a">MutingIn_2</text>
    <text x="385" y="264" text-anchor="start" font-size="11" font-weight="bold" fill="#c0392b">S_SafetyIn</text>
    <text x="385" y="319" text-anchor="start" font-size="11" font-weight="bold" fill="#2457d6">MutingActive</text>
    <text x="385" y="374" text-anchor="start" font-size="11" font-weight="bold" fill="#27ae60">S_MutingOut</text>

    <!-- Вертикальні пунктирні лінії часових міток -->
    <line x1="540" y1="130" x2="540" y2="395" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="580" y1="130" x2="580" y2="395" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="640" y1="130" x2="640" y2="395" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="740" y1="130" x2="740" y2="395" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="800" y1="130" x2="800" y2="395" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="840" y1="130" x2="840" y2="395" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Вікно синхронізації dtsync -->
    <line x1="540" y1="132" x2="580" y2="132" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <text x="560" y="127" text-anchor="middle" font-size="10" font-weight="bold" fill="#2457d6">Δt ≤ DiscTime12</text>

    <!-- Сигнал MutingIn_1 -->
    <path d="M 480,160 H 540 V 140 H 800 V 160 H 900" stroke="#1a1a1a" stroke-width="2" fill="none"/>

    <!-- Сигнал MutingIn_2 -->
    <path d="M 480,215 H 580 V 195 H 840 V 215 H 900" stroke="#1a1a1a" stroke-width="2" fill="none"/>

    <!-- Сигнал S_SafetyIn (Світловий бар'єр: 1=Clear, 0=Interrupted) -->
    <path d="M 480,250 H 640 V 270 H 740 V 250 H 900" stroke="#c0392b" stroke-width="2" fill="none"/>
    <text x="690" y="283" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">Перекриття променів</text>

    <!-- Область активного мутингу -->
    <rect x="580" y="305" width="260" height="20" fill="#eaf0fd" opacity="0.6"/>
    <text x="710" y="299" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Вікно мутингу (Muting Active)</text>

    <!-- Сигнал MutingActive -->
    <path d="M 480,325 H 580 V 305 H 840 V 325 H 900" stroke="#2457d6" stroke-width="2.5" fill="none"/>

    <!-- Сигнал S_MutingOut (Вихід безпеки: залишається 1 завдяки мутингу) -->
    <path d="M 480,360 H 900" stroke="#27ae60" stroke-width="2.5" fill="none"/>
    <text x="710" y="354" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">S_MutingOut = TRUE (Безпечна робота)</text>

    <!-- Часові мітки -->
    <text x="540" y="407" text-anchor="middle" font-size="11" fill="#6b7280">t₁</text>
    <text x="580" y="407" text-anchor="middle" font-size="11" fill="#6b7280">t₂</text>
    <text x="640" y="407" text-anchor="middle" font-size="11" fill="#6b7280">t₃</text>
    <text x="740" y="407" text-anchor="middle" font-size="11" fill="#6b7280">t₄</text>
    <text x="800" y="407" text-anchor="middle" font-size="11" fill="#6b7280">t₅</text>
    <text x="840" y="407" text-anchor="middle" font-size="11" fill="#6b7280">t₆</text>

    <!-- Підсумок для правій панелі -->
    <rect x="382" y="414" width="536" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
    <text x="650" y="430" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">✓ Muting заблокує зупинку тільки при дотриманні часового вікна Δt</text>
  </g>
</svg>
