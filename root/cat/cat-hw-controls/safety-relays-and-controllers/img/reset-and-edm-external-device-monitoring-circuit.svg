<svg viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L8,4.5 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L8,4.5 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L8,4.5 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="#ffffff"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема моніторингу контакторів EDM та кнопки Reset (Клема S34)</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Послідовні NC-контакти K1/K2 та кнопка Reset дозволяють пуск лише при відсутніх зварюваннях</text>

  <!-- Left Container: Manual Reset with EDM -->
  <rect x="30" y="75" width="250" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="45" y="97" font-size="14" font-weight="bold" fill="#2457d6">1. Ручний пуск (Manual)</text>
  <text x="45" y="115" font-size="12" fill="#6b7280">Захист від несподіваного пуску</text>

  <!-- Button S3 (Reset NO) -->
  <rect x="42" y="130" width="226" height="85" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="52" y="150" font-size="12" font-weight="bold" fill="#2457d6">S3: Кнопка Reset (НО)</text>
  <text x="52" y="168" font-size="12" fill="#6b7280">Натискання оператором</text>
  <text x="235" y="175" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">S3</text>
  <line x1="200" y1="195" x2="220" y2="195" stroke="#2457d6" stroke-width="2"/>
  <circle cx="220" cy="195" r="2.5" fill="#2457d6"/>
  <line x1="220" y1="187" x2="245" y2="187" stroke="#2457d6" stroke-width="2"/>
  <circle cx="245" cy="195" r="2.5" fill="#2457d6"/>
  <line x1="245" y1="195" x2="255" y2="195" stroke="#2457d6" stroke-width="2"/>

  <!-- EDM Loop (K1 NC + K2 NC) -->
  <rect x="42" y="225" width="226" height="135" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="52" y="245" font-size="12" font-weight="bold" fill="#c0392b">Контур EDM (K1 NC + K2 NC)</text>

  <text x="52" y="272" font-size="12" fill="#2457d6">K1-NC:</text>
  <text x="235" y="255" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">K1-NC</text>
  <line x1="200" y1="275" x2="220" y2="275" stroke="#2457d6" stroke-width="2"/>
  <circle cx="220" cy="275" r="2.5" fill="#2457d6"/>
  <line x1="220" y1="269" x2="245" y2="269" stroke="#c0392b" stroke-width="2"/>
  <circle cx="245" cy="275" r="2.5" fill="#2457d6"/>
  <line x1="245" y1="275" x2="255" y2="275" stroke="#2457d6" stroke-width="2"/>

  <text x="52" y="322" font-size="12" fill="#27ae60">K2-NC:</text>
  <text x="235" y="305" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">K2-NC</text>
  <line x1="200" y1="325" x2="220" y2="325" stroke="#27ae60" stroke-width="2"/>
  <circle cx="220" cy="325" r="2.5" fill="#27ae60"/>
  <line x1="220" y1="319" x2="245" y2="319" stroke="#c0392b" stroke-width="2"/>
  <circle cx="245" cy="325" r="2.5" fill="#27ae60"/>
  <line x1="245" y1="325" x2="255" y2="325" stroke="#27ae60" stroke-width="2"/>

  <!-- Note Box -->
  <rect x="42" y="370" width="226" height="58" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="155" y="390" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Сигнал на клему S34:</text>
  <text x="155" y="410" font-size="12" fill="#1a1a1a" text-anchor="middle">Лише якщо K1=0, K2=0 та S3=1</text>

  <!-- Middle Container: Safety Relay Module -->
  <rect x="295" y="75" width="340" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="310" y="97" font-size="14" font-weight="bold" fill="#1a1a1a">Реле безпеки (Safety Relay)</text>

  <!-- Terminal S34 Box -->
  <rect x="307" y="108" width="90" height="130" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="352" y="128" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вхід Reset</text>
  <text x="352" y="148" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">S34</text>
  <circle cx="352" cy="165" r="5" fill="#2457d6"/>
  <text x="352" y="215" font-size="12" fill="#6b7280" text-anchor="middle">EDM / Reset</text>

  <!-- Auto Reset Sub-panel -->
  <rect x="307" y="250" width="316" height="175" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="465" y="270" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">2. Автоматичний пуск (Auto Reset)</text>
  <text x="317" y="292" font-size="12" fill="#1a1a1a">• Пряме з'єднання або лише NC-контакти</text>
  <text x="317" y="312" font-size="12" fill="#27ae60">• Пуск миттєво після відновлення E-Stop</text>

  <!-- Warning Box -->
  <rect x="317" y="328" width="296" height="85" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="465" y="350" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">⛔ Заборонено де можливий доступ людей!</text>
  <text x="465" y="372" font-size="12" fill="#6b7280" text-anchor="middle">(Ризик раптового пуску обладнання)</text>
  <text x="465" y="394" font-size="12" fill="#1a1a1a" text-anchor="middle">Дозволено лише для замкнених робокамер</text>

  <!-- Internal Logic & Edge Detector -->
  <rect x="410" y="108" width="213" height="130" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="516" y="128" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Детектор фронту S34</text>
  <text x="420" y="150" font-size="12" fill="#1a1a1a">• Моніторинг фронту (Monitored)</text>
  <text x="420" y="170" font-size="12" fill="#1a1a1a">• Захист від заклинювання S3</text>

  <!-- Status badge -->
  <rect x="420" y="185" width="193" height="42" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="516" y="211" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">EDM OK -> Пуск K1/K2</text>

  <!-- Right Container: Power Contactors K1 / K2 -->
  <rect x="650" y="75" width="280" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="665" y="97" font-size="14" font-weight="bold" fill="#1a1a1a">Силові контактори (K1, K2)</text>

  <!-- Contactor K1 Block -->
  <rect x="662" y="108" width="256" height="152" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="790" y="128" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Контактор K1 (Power 1)</text>
  <text x="672" y="150" font-size="12" fill="#1a1a1a">• НО контакти: Силова мережа 380V</text>
  <text x="672" y="172" font-size="12" font-weight="bold" fill="#c0392b">• НЗ контакт: Допоміжний (EDM)</text>
  <text x="672" y="194" font-size="12" fill="#6b7280">• Дзеркальні контакти (Mirror)</text>

  <rect x="672" y="206" width="236" height="44" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="790" y="232" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">При зварюванні НО -> НЗ відкритий!</text>

  <!-- Contactor K2 Block -->
  <rect x="662" y="270" width="256" height="155" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="790" y="290" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Контактор K2 (Power 2)</text>
  <text x="672" y="312" font-size="12" fill="#1a1a1a">• НО контакти: Дублювання сили</text>
  <text x="672" y="334" font-size="12" font-weight="bold" fill="#c0392b">• НЗ контакт: Допоміжний (EDM)</text>
  <text x="672" y="356" font-size="12" fill="#6b7280">• Послідовний ланцюг із K1-NC</text>

  <rect x="672" y="368" width="236" height="47" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="790" y="396" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Блокування повторного пуску</text>

  <!-- Wires & Signal Connections -->
  <!-- Line from EDM loop S3 -> K1-NC -> K2-NC to Terminal S34 circle -->
  <path d="M 255,325 L 285,325 L 285,165 L 347,165" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <!-- Terminal S34 -> Logic -->
  <path d="M 357,165 L 410,165" fill="none" stroke="#2457d6" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- Feedback line from K1/K2 contacts on right to EDM block on left -->
  <path d="M 662,172 L 640,172 L 640,245 L 268,245" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
  <path d="M 662,334 L 648,334 L 648,300 L 268,300" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
</svg>
