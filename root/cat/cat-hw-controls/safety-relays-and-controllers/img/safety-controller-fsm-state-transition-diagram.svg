<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Маркери стрілок -->
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Автомат станів функціонального блоку безпеки (PLCopen Safety FSM)</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Умови переходів між станами та блокування при перевищенні Discrepancy Time</text>

  <!-- СТАНИ АВТОМАТА (FSM NODES) -->

  <!-- Стан 1: Disabled (Вимкнено) -->
  <g id="state-disabled">
    <rect x="40" y="120" width="190" height="100" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="2"/>
    <text x="135" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Disabled</text>
    <text x="135" y="167" text-anchor="middle" font-size="12" fill="#6b7280">(Вимкнено)</text>
    <text x="135" y="195" text-anchor="middle" font-size="12" fill="#6b7280">Activate = 0</text>
  </g>

  <!-- Стан 2: Init / Reset (Ініціалізація) -->
  <g id="state-init">
    <rect x="385" y="120" width="190" height="100" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
    <text x="480" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Init / Reset</text>
    <text x="480" y="167" text-anchor="middle" font-size="12" fill="#2457d6">(Ініціалізація)</text>
    <text x="480" y="195" text-anchor="middle" font-size="12" fill="#1a1a1a">Очікування Reset</text>
  </g>

  <!-- Стан 3: Safety Active (Нормальна робота) -->
  <g id="state-active">
    <rect x="730" y="120" width="190" height="100" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
    <text x="825" y="145" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Safety Active</text>
    <text x="825" y="167" text-anchor="middle" font-size="12" fill="#27ae60">(Нормальна робота)</text>
    <text x="825" y="195" text-anchor="middle" font-size="12" fill="#1a1a1a">OutEnable = 1</text>
  </g>

  <!-- Стан 4: Fault (Аварійне блокування) -->
  <g id="state-fault">
    <rect x="330" y="310" width="300" height="110" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <text x="480" y="335" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">Fault (Блокування аварії)</text>
    <text x="480" y="360" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">t &gt; t_discrepancy (Розсихронізація каналів)</text>
    <text x="480" y="382" text-anchor="middle" font-size="12" fill="#1a1a1a">OutEnable = 0 | Потрібен Reset (0→1)</text>
    <text x="480" y="402" text-anchor="middle" font-size="12" fill="#6b7280">(Автоматичний вихід заборонений)</text>
  </g>

  <!-- ПЕРЕХОДИ МІЖ СТАНАМИ (TRANSITIONS) -->

  <!-- Перехід 1: Disabled -> Init -->
  <line x1="230" y1="170" x2="385" y2="170" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="307.5" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Activate = 1</text>

  <!-- Перехід 2: Init -> Safety Active -->
  <line x1="575" y1="170" x2="730" y2="170" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="652.5" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Канали A/B OK + Reset</text>

  <!-- Перехід 3: Safety Active -> Fault (Привищення Discrepancy Time) -->
  <path d="M 825,220 V 365 H 630" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)" fill="none"/>
  <text x="835" y="280" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">t &gt; t_discrepancy</text>
  <text x="835" y="298" text-anchor="start" font-size="12" fill="#c0392b">(Розсихронізація)</text>

  <!-- Перехід 4: Fault -> Init (Усунення відмови та скидання) -->
  <line x1="480" y1="310" x2="480" y2="220" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="470" y="265" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">Усунення помилки</text>
  <text x="470" y="283" text-anchor="end" font-size="12" fill="#2457d6">+ Reset (0→1)</text>

  <!-- Перехід 5: Safety Active -> Disabled (Деактивація) -->
  <path d="M 825,120 V 88 H 135 V 120" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-dark)" fill="none"/>
  <text x="480" y="80" text-anchor="middle" font-size="12" fill="#6b7280">Activate = 0 (Деактивація)</text>

  <!-- Інформаційний блок (Легенда безпеки) -->
  <g id="info-legend">
    <rect x="40" y="325" width="260" height="80" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
    <text x="170" y="347" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">✓ Гарантія безпеки PLCopen:</text>
    <text x="170" y="367" text-anchor="middle" font-size="12" fill="#1a1a1a">Помилка засувається (Fault Latch)</text>
    <text x="170" y="387" text-anchor="middle" font-size="12" fill="#6b7280">Вихід можливий лише через Reset</text>
  </g>
</svg>
