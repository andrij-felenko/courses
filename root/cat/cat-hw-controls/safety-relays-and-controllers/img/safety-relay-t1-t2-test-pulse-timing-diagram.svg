<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Main Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Часова діаграма тестових імпульсів T1/T2 реле безпеки</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Виявлення міжканального короткого замикання за рахунок фазового зсуву строб-імпульсів S11/S21</text>

  <!-- PANEL A: NORMAL OPERATION -->
  <g id="panel-normal">
    <rect x="40" y="70" width="880" height="215" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <path d="M 40,102 L 40,78 Q 40,70 48,70 L 912,70 Q 920,70 920,78 L 920,102 Z" fill="#eaf0fd"/>
    <line x1="40" y1="102" x2="920" y2="102" stroke="#2457d6" stroke-width="1.5"/>
    <text x="480" y="93" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">1. НОРМАЛЬНИЙ РЕЖИМ (ШТАТНА ДІАГНОСТИКА S11/S21)</text>

    <!-- Grid Reference Lines Panel A -->
    <line x1="210" y1="102" x2="210" y2="240" stroke="#d0d7de" stroke-width="1"/>
    <line x1="320" y1="130" x2="320" y2="235" stroke="#d0d7de" stroke-dasharray="2,2"/>
    <line x1="380" y1="130" x2="380" y2="235" stroke="#d0d7de" stroke-dasharray="2,2"/>
    <line x1="580" y1="190" x2="580" y2="235" stroke="#d0d7de" stroke-dasharray="2,2"/>
    <line x1="640" y1="190" x2="640" y2="235" stroke="#d0d7de" stroke-dasharray="2,2"/>

    <!-- Channel Labels Panel A -->
    <text x="195" y="132" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">S11 (Вихід Ch1)</text>
    <text x="195" y="162" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">S12 (Вхід Ch1)</text>
    <text x="195" y="192" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">S21 (Вихід Ch2)</text>
    <text x="195" y="222" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">S22 (Вхід Ch2)</text>

    <!-- Waveform S11 (Panel A) -->
    <path d="M 210,130 L 320,130 L 320,145 L 380,145 L 380,130 L 880,130" fill="none" stroke="#2457d6" stroke-width="2"/>
    <text x="350" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Імпульс T1 (2 ms)</text>

    <!-- Waveform S12 (Panel A) -->
    <path d="M 210,160 L 320,160 L 320,175 L 380,175 L 380,160 L 880,160" fill="none" stroke="#2457d6" stroke-width="2"/>

    <!-- Phase Shift Arrow Panel A -->
    <line x1="350" y1="145" x2="425" y2="145" stroke="#6b7280" stroke-width="1" marker-start="url(#arr-gray)"/>
    <line x1="535" y1="145" x2="610" y2="145" stroke="#6b7280" stroke-width="1" marker-end="url(#arr-gray)"/>
    <rect x="425" y="126" width="110" height="18" fill="#f4f6f8" rx="3"/>
    <text x="480" y="140" text-anchor="middle" font-size="12" fill="#6b7280">Фазовий зсув Δt</text>

    <!-- Waveform S21 (Panel A) -->
    <path d="M 210,190 L 580,190 L 580,205 L 640,205 L 640,190 L 880,190" fill="none" stroke="#2457d6" stroke-width="2"/>
    <text x="610" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Імпульс T2 (2 ms)</text>

    <!-- Waveform S22 (Panel A) -->
    <path d="M 210,220 L 580,220 L 580,235 L 640,235 L 640,220 L 880,220" fill="none" stroke="#2457d6" stroke-width="2"/>

    <!-- Status Badge Panel A -->
    <rect x="210" y="246" width="670" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
    <text x="545" y="263" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">✓ ШТАТНИЙ СТАН: Імпульси T1 і T2 не перетинаються → КЗ відсутнє → Реле БЕЗПЕКИ УВІМКНЕНО</text>
  </g>

  <!-- PANEL B: CROSS-CIRCUIT FAULT -->
  <g id="panel-fault">
    <rect x="40" y="300" width="880" height="240" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <path d="M 40,332 L 40,308 Q 40,300 48,300 L 912,300 Q 920,300 920,308 L 920,332 Z" fill="#fdecea"/>
    <line x1="40" y1="332" x2="920" y2="332" stroke="#c0392b" stroke-width="1.5"/>
    <text x="480" y="323" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">2. АВАРІЙНИЙ РЕЖИМ (МІЖКАНАЛЬНЕ КЗ МІЖ СИГНАЛАМИ S12 ТА S22)</text>

    <!-- Grid Reference Lines Panel B -->
    <line x1="210" y1="332" x2="210" y2="475" stroke="#d0d7de" stroke-width="1"/>
    <line x1="320" y1="352" x2="320" y2="465" stroke="#c0392b" stroke-dasharray="2,2" stroke-opacity="0.4"/>
    <line x1="380" y1="352" x2="380" y2="465" stroke="#c0392b" stroke-dasharray="2,2" stroke-opacity="0.4"/>
    <line x1="580" y1="418" x2="580" y2="465" stroke="#c0392b" stroke-dasharray="2,2" stroke-opacity="0.4"/>
    <line x1="640" y1="418" x2="640" y2="465" stroke="#c0392b" stroke-dasharray="2,2" stroke-opacity="0.4"/>

    <!-- Channel Labels Panel B -->
    <text x="195" y="352" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">S11 (Вихід Ch1)</text>
    <text x="195" y="385" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">S12 (Вхід Ch1)</text>
    <text x="195" y="418" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">S21 (Вихід Ch2)</text>
    <text x="195" y="451" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">S22 (Вхід Ch2)</text>

    <!-- Waveform S11 (Panel B) -->
    <path d="M 210,352 L 320,352 L 320,364 L 380,364 L 380,352 L 880,352" fill="none" stroke="#2457d6" stroke-width="2"/>
    <text x="350" y="344" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Імпульс T1</text>

    <!-- Waveform S12 with leaked pulse T2 (Panel B) -->
    <path d="M 210,385 L 320,385 L 320,397 L 380,397 L 380,385 L 580,385 L 580,397 L 640,397 L 640,385 L 880,385" fill="none" stroke="#c0392b" stroke-width="2"/>
    <!-- Highlight box on S12 leaked pulse T2 -->
    <rect x="572" y="380" width="76" height="22" rx="3" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
    <!-- Callout Badge 1 for S12 -->
    <rect x="660" y="356" width="170" height="20" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
    <text x="745" y="370" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">КЗ: Проникання T2 в Ch1!</text>
    <line x1="660" y1="366" x2="636" y2="385" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

    <!-- Waveform S21 (Panel B) -->
    <path d="M 210,418 L 580,418 L 580,430 L 640,430 L 640,418 L 880,418" fill="none" stroke="#2457d6" stroke-width="2"/>
    <text x="610" y="410" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Імпульс T2</text>

    <!-- Waveform S22 with leaked pulse T1 (Panel B) -->
    <path d="M 210,451 L 320,451 L 320,463 L 380,463 L 380,451 L 580,451 L 580,463 L 640,463 L 640,451 L 880,451" fill="none" stroke="#c0392b" stroke-width="2"/>
    <!-- Highlight box on S22 leaked pulse T1 -->
    <rect x="312" y="446" width="76" height="22" rx="3" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
    <!-- Callout Badge 2 for S22 -->
    <rect x="400" y="424" width="170" height="20" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
    <text x="485" y="438" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">КЗ: Проникання T1 в Ch2!</text>
    <line x1="400" y1="434" x2="376" y2="451" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

    <!-- Status Badge Panel B -->
    <rect x="210" y="485" width="670" height="42" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="545" y="503" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">🛑 АВАРІЙНИЙ СТАН: Виявлено проникання імпульсу в канал Ch2!</text>
    <text x="545" y="521" text-anchor="middle" font-size="12" fill="#1a1a1a">Реле безпеки негайно знеструмлює силові виходи 13-14 / 23-24 та блокує пуск.</text>
  </g>
</svg>
