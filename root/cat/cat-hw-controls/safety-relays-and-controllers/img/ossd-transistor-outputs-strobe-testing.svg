<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Часова діаграма та схемотехніка OSSD-виходів</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Мікропаузи самодіагностики (100–500 мкс) перевіряють транзистори без відключення навантаження</text>

  <!-- Left Panel: Schematic -->
  <rect x="30" y="80" width="430" height="440" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="245" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Схемотехніка OSSD (PNP-ключі)</text>

  <!-- Controller Block -->
  <rect x="50" y="130" width="130" height="340" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="115" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Логіка безпеки</text>
  <text x="115" y="180" text-anchor="middle" font-size="12" fill="#6b7280">(MCU 1 / MCU 2)</text>
  
  <!-- Internal pulse generator symbols in MCU -->
  <rect x="65" y="210" width="100" height="40" rx="4" fill="white" stroke="#2457d6" stroke-width="1"/>
  <text x="115" y="234" text-anchor="middle" font-size="11" fill="#2457d6">Генератор t_test</text>
  
  <rect x="65" y="350" width="100" height="40" rx="4" fill="white" stroke="#2457d6" stroke-width="1"/>
  <text x="115" y="374" text-anchor="middle" font-size="11" fill="#2457d6">Компаратор ADC</text>

  <!-- Power Rail +24V -->
  <line x1="210" y1="130" x2="330" y2="130" stroke="#c0392b" stroke-width="2"/>
  <text x="270" y="123" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">+24 V DC</text>

  <!-- Q1 Switch -->
  <line x1="270" y1="130" x2="270" y2="160" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="230" y="160" width="80" height="50" rx="4" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="270" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Q1 (PNP)</text>
  <!-- Control line MCU -> Q1 -->
  <path d="M 180,225 L 210,225 L 210,185 L 230,185" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  
  <!-- Output OSSD1 -->
  <line x1="270" y1="210" x2="270" y2="260" stroke="#2457d6" stroke-width="2"/>
  <line x1="270" y1="260" x2="350" y2="260" stroke="#2457d6" stroke-width="2"/>
  <circle cx="350" cy="260" r="4" fill="#2457d6"/>
  <text x="350" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">OSSD1</text>
  <!-- Feedback to MCU comparator -->
  <path d="M 310,260 L 310,360 L 165,360" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-dark)"/>
  <text x="240" y="352" text-anchor="middle" font-size="11" fill="#6b7280">Тестовий замір</text>

  <!-- Q2 Switch -->
  <line x1="270" y1="130" x2="330" y2="130" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="330" y1="130" x2="330" y2="280" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="290" y="280" width="80" height="50" rx="4" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="330" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Q2 (PNP)</text>
  <!-- Control line MCU -> Q2 -->
  <path d="M 180,240 L 200,240 L 200,305 L 290,305" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Output OSSD2 -->
  <line x1="330" y1="330" x2="330" y2="380" stroke="#2457d6" stroke-width="2"/>
  <line x1="330" y1="380" x2="350" y2="380" stroke="#2457d6" stroke-width="2"/>
  <circle cx="350" cy="380" r="4" fill="#2457d6"/>
  <text x="350" y="372" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">OSSD2</text>

  <!-- Loads K1 & K2 -->
  <line x1="350" y1="260" x2="400" y2="260" stroke="#27ae60" stroke-width="2"/>
  <line x1="400" y1="260" x2="400" y2="280" stroke="#27ae60" stroke-width="2"/>
  <rect x="365" y="280" width="70" height="40" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="400" y="304" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Котушка K1</text>

  <line x1="350" y1="380" x2="400" y2="380" stroke="#27ae60" stroke-width="2"/>
  <line x1="400" y1="380" x2="400" y2="400" stroke="#27ae60" stroke-width="2"/>
  <rect x="365" y="400" width="70" height="40" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="400" y="424" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Котушка K2</text>

  <!-- Ground 0V -->
  <line x1="400" y1="320" x2="400" y2="350" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="400" y1="440" x2="400" y2="470" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="380" y1="470" x2="420" y2="470" stroke="#6b7280" stroke-width="2"/>
  <text x="400" y="490" text-anchor="middle" font-size="11" fill="#6b7280">0 V DC (GND)</text>


  <!-- Right Panel: Timing Diagram -->
  <rect x="480" y="80" width="450" height="440" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="705" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Часова діаграма OSSD1 та OSSD2</text>

  <!-- Axis Lines & Grid for Timing Diagram -->
  <!-- Signal 1: OSSD1 -->
  <text x="500" y="160" font-size="13" font-weight="bold" fill="#2457d6">OSSD1</text>
  <line x1="560" y1="185" x2="900" y2="185" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- OSSD1 Waveform -->
  <path d="M 560,145 L 640,145 L 640,185 L 660,185 L 660,145 L 900,145" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  
  <!-- Dimension / Annotation for OSSD1 Pulse Width -->
  <line x1="640" y1="130" x2="660" y2="130" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="640" y1="125" x2="640" y2="135" stroke="#c0392b" stroke-width="1"/>
  <line x1="660" y1="125" x2="660" y2="135" stroke="#c0392b" stroke-width="1"/>
  <text x="650" y="120" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">t_test (100–500 мкс)</text>

  <!-- Signal 2: OSSD2 -->
  <text x="500" y="280" font-size="13" font-weight="bold" fill="#2457d6">OSSD2</text>
  <line x1="560" y1="305" x2="900" y2="305" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- OSSD2 Waveform -->
  <path d="M 560,265 L 760,265 L 760,305 L 780,305 L 780,265 L 900,265" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Phase Shift Dimension Line -->
  <line x1="650" y1="210" x2="770" y2="210" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="650" y1="190" x2="650" y2="230" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="770" y1="230" x2="770" y2="260" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="710" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Зсув фази (Phase shift)</text>

  <!-- Signal 3: Load Voltage (K1 coil) -->
  <text x="500" y="400" font-size="13" font-weight="bold" fill="#27ae60">Котушка K1</text>
  <line x1="560" y1="420" x2="900" y2="420" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- Continuous HIGH line with no drop -->
  <path d="M 560,385 L 900,385" fill="none" stroke="#27ae60" stroke-width="3"/>
  <text x="730" y="375" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Безперервний HIGH (+24 V DC)</text>

  <!-- Summary box at bottom of Right Panel -->
  <rect x="510" y="445" width="390" height="55" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="705" y="468" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Інерційність контакторів (t_mech = 10–30 мс) відфільтровує</text>
  <text x="705" y="488" text-anchor="middle" font-size="12" fill="#6b7280">строб-імпульси t_test, виключаючи моргання й збої живлення.</text>

</svg>
