<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Маркери стрілок -->
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Каскадна логіка блоків безпеки PLCopen (SF_EmergencyStop + SF_SafetyGate)</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Передача статусів безпеки (SAFEBOOL), каскадування дозволів та послідовне скидання</text>

  <!-- ФІЗИЧНІ ДАВАЧІ / ВХОДИ (Ліва колонка x=30..180) -->
  <g id="sensors">
    <!-- Джерело живлення +24V -->
    <rect x="30" y="130" width="150" height="32" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
    <text x="105" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">+24V DC (TRUE)</text>
    <line x1="180" y1="146" x2="230" y2="146" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

    <!-- Давач 1: E-Stop -->
    <rect x="30" y="180" width="150" height="36" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
    <text x="105" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Давач E-Stop (NC)</text>
    <line x1="180" y1="198" x2="230" y2="198" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

    <!-- Давач 2: Reset E-Stop -->
    <rect x="30" y="235" width="150" height="36" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
    <text x="105" y="257" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Кнопка Reset E-Stop</text>
    <line x1="180" y1="253" x2="230" y2="253" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

    <!-- Давач 3: Safety Gate Door -->
    <rect x="30" y="290" width="150" height="36" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
    <text x="105" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Давач дверей (Gate)</text>

    <!-- Давач 4: Reset Gate -->
    <rect x="30" y="345" width="150" height="36" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
    <text x="105" y="367" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Кнопка Reset Дверей</text>

    <!-- Давач 5: EDM Feedback -->
    <rect x="30" y="400" width="150" height="36" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
    <text x="105" y="422" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Контур EDM (K1/K2)</text>

    <!-- Провід 3: Давач дверей -> SF_SafetyGate.S_SafetyGate (490, 198) -->
    <path d="M 180,308 L 200,308 L 200,465 L 460,465 L 460,198 L 490,198" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

    <!-- Провід 4: Кнопка Reset Дверей -> SF_SafetyGate.Reset (490, 253) -->
    <path d="M 180,363 L 210,363 L 210,475 L 475,475 L 475,253 L 490,253" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  </g>

  <!-- БЛОК 1: SF_EmergencyStop -->
  <g id="block-estop">
    <rect x="230" y="100" width="190" height="350" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
    <path d="M 230,132 L 230,108 Q 230,100 238,100 L 412,100 Q 420,100 420,108 L 420,132 Z" fill="#eaf0fd"/>
    <line x1="230" y1="132" x2="420" y2="132" stroke="#2457d6" stroke-width="1.5"/>
    <text x="325" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">SF_EmergencyStop</text>

    <!-- Входи Блоку 1 -->
    <circle cx="230" cy="146" r="4" fill="#27ae60"/>
    <text x="238" y="150" font-size="12" font-weight="bold" fill="#27ae60">Activate</text>

    <circle cx="230" cy="198" r="4" fill="#2457d6"/>
    <text x="238" y="202" font-size="12" font-weight="bold" fill="#2457d6">S_EStopIn</text>

    <circle cx="230" cy="253" r="4" fill="#2457d6"/>
    <text x="238" y="257" font-size="12" font-weight="bold" fill="#2457d6">Reset</text>

    <circle cx="230" cy="308" r="4" fill="#6b7280"/>
    <text x="238" y="312" font-size="12" font-weight="bold" fill="#6b7280">AutoReset</text>

    <!-- Виходи Блоку 1 -->
    <circle cx="420" cy="146" r="4" fill="#6b7280"/>
    <text x="412" y="150" text-anchor="end" font-size="12" font-weight="bold" fill="#6b7280">Ready</text>

    <circle cx="420" cy="198" r="5" fill="#27ae60"/>
    <text x="412" y="202" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">S_EStopOut</text>

    <circle cx="420" cy="308" r="4" fill="#c0392b"/>
    <text x="412" y="312" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">Error</text>

    <circle cx="420" cy="363" r="4" fill="#6b7280"/>
    <text x="412" y="367" text-anchor="end" font-size="12" font-weight="bold" fill="#6b7280">DiagCode</text>
  </g>

  <!-- КАСКАДНИЙ ПРОВІД 1: S_EStopOut -> SF_SafetyGate.Activate -->
  <path d="M 420,198 L 435,198 L 435,146 L 490,146" fill="none" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <!-- Бейдж каскадування (розміщено у вільній зоні x=440..486, y=163..181) -->
  <rect x="440" y="163" width="46" height="18" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="463" y="176" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">CASCADE</text>

  <!-- БЛОК 2: SF_SafetyGate -->
  <g id="block-gate">
    <rect x="490" y="100" width="190" height="350" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
    <path d="M 490,132 L 490,108 Q 490,100 498,100 L 672,100 Q 680,100 680,108 L 680,132 Z" fill="#eaf0fd"/>
    <line x1="490" y1="132" x2="680" y2="132" stroke="#2457d6" stroke-width="1.5"/>
    <text x="585" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">SF_SafetyGate</text>

    <!-- Входи Блоку 2 -->
    <circle cx="490" cy="146" r="5" fill="#27ae60"/>
    <text x="498" y="150" font-size="12" font-weight="bold" fill="#27ae60">Activate</text>

    <circle cx="490" cy="198" r="4" fill="#2457d6"/>
    <text x="498" y="202" font-size="12" font-weight="bold" fill="#2457d6">S_SafetyGate</text>

    <circle cx="490" cy="253" r="4" fill="#2457d6"/>
    <text x="498" y="257" font-size="12" font-weight="bold" fill="#2457d6">Reset</text>

    <circle cx="490" cy="308" r="4" fill="#6b7280"/>
    <text x="498" y="312" font-size="12" font-weight="bold" fill="#6b7280">StartReset</text>

    <!-- Виходи Блоку 2 -->
    <circle cx="680" cy="146" r="4" fill="#6b7280"/>
    <text x="672" y="150" text-anchor="end" font-size="12" font-weight="bold" fill="#6b7280">Ready</text>

    <circle cx="680" cy="198" r="5" fill="#27ae60"/>
    <text x="672" y="202" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">S_SafetyOut</text>

    <circle cx="680" cy="308" r="4" fill="#c0392b"/>
    <text x="672" y="312" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">Error</text>

    <circle cx="680" cy="363" r="4" fill="#6b7280"/>
    <text x="672" y="367" text-anchor="end" font-size="12" font-weight="bold" fill="#6b7280">DiagCode</text>
  </g>

  <!-- КАСКАДНИЙ ПРОВІД 2: S_SafetyOut -> SF_OutControl.Activate -->
  <line x1="680" y1="198" x2="740" y2="198" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <!-- БЛОК 3: SF_OutControl -->
  <g id="block-out">
    <rect x="740" y="100" width="160" height="350" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
    <path d="M 740,132 L 740,108 Q 740,100 748,100 L 892,100 Q 900,100 900,108 L 900,132 Z" fill="#e9f7ef"/>
    <line x1="740" y1="132" x2="900" y2="132" stroke="#27ae60" stroke-width="1.5"/>
    <text x="820" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">SF_OutControl</text>

    <!-- Входи Блоку 3 -->
    <circle cx="740" cy="198" r="5" fill="#27ae60"/>
    <text x="748" y="202" font-size="12" font-weight="bold" fill="#27ae60">Activate</text>

    <circle cx="740" cy="280" r="4" fill="#2457d6"/>
    <text x="748" y="284" font-size="12" font-weight="bold" fill="#2457d6">S_EDM_In</text>

    <!-- Виходи Блоку 3 -->
    <circle cx="900" cy="198" r="5" fill="#27ae60"/>
    <text x="892" y="202" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">S_OutControl</text>

    <circle cx="900" cy="308" r="4" fill="#c0392b"/>
    <text x="892" y="312" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">Error</text>
  </g>

  <!-- Провід зворотного зв'язку EDM: (740, 280) -> (715, 280) -> (715, 485) -> (180, 485) -> (180, 418) -->
  <path d="M 740,280 L 715,280 L 715,485 L 180,485 L 180,418" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-blue)"/>

  <!-- Фінальна лінія виходу -->
  <line x1="900" y1="198" x2="940" y2="198" stroke="#27ae60" stroke-width="3" marker-end="url(#arr-green)"/>

  <!-- НИЖНІЙ ПІДСУМКОВИЙ БАНЕР -->
  <rect x="30" y="500" width="900" height="44" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="518" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">✓ ПРАВИЛО КАСКАДУВАННЯ: Вихід S_EStopOut блоку E-Stop активує вхід Activate блоку SafetyGate</text>
  <text x="480" y="534" text-anchor="middle" font-size="12" fill="#1a1a1a">Натискання E-Stop миттєво знімає сигнал з усього ланцюжка без потреби індивідуального опитування</text>
</svg>
