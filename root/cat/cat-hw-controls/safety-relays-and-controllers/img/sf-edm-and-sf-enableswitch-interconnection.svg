<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Програмний взаємозв'язок блоків SF_EnableSwitch та SF_EDM (PLCopen Safety)</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Дозвіл роботи (Enable) подається на вихід лише при справному стані контакторів K1/K2 (EDM Feedback)</text>

  <!-- COLUMN 1: HARDWARE INPUT SIGNALS -->
  <g id="panel-inputs">
    <rect x="25" y="85" width="115" height="270" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="82" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Вхідні сигнали</text>

    <!-- Input 1: Activate -->
    <rect x="35" y="125" width="95" height="45" rx="4" fill="#ffffff" stroke="#2457d6"/>
    <text x="82" y="145" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Activate</text>
    <text x="82" y="160" text-anchor="middle" font-size="10" fill="#6b7280">+24V (E-Stop)</text>

    <!-- Input 2: SwitchChA -->
    <rect x="35" y="185" width="95" height="45" rx="4" fill="#ffffff" stroke="#2457d6"/>
    <text x="82" y="205" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">SwitchChA</text>
    <text x="82" y="220" text-anchor="middle" font-size="10" fill="#6b7280">Кнопка поз.2</text>

    <!-- Input 3: SwitchChB -->
    <rect x="35" y="245" width="95" height="45" rx="4" fill="#ffffff" stroke="#2457d6"/>
    <text x="82" y="265" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">SwitchChB</text>
    <text x="82" y="280" text-anchor="middle" font-size="10" fill="#6b7280">Кнопка поз.2</text>

    <!-- Input 4: Reset -->
    <rect x="35" y="305" width="95" height="45" rx="4" fill="#ffffff" stroke="#2457d6"/>
    <text x="82" y="325" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Reset</text>
    <text x="82" y="340" text-anchor="middle" font-size="10" fill="#6b7280">Кнопка Пуск</text>
  </g>

  <!-- FUNCTIONAL BLOCK 1: SF_EnableSwitch -->
  <g id="fb-enableswitch">
    <rect x="160" y="85" width="220" height="270" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <rect x="160" y="85" width="220" height="36" rx="6" fill="#2457d6"/>
    <text x="270" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">SF_EnableSwitch</text>

    <!-- Inputs Labels -->
    <text x="170" y="145" font-size="11" font-weight="bold" fill="#1a1a1a">Activate</text>
    <text x="170" y="205" font-size="11" font-weight="bold" fill="#1a1a1a">SwitchChA</text>
    <text x="170" y="265" font-size="11" font-weight="bold" fill="#1a1a1a">SwitchChB</text>
    <text x="170" y="325" font-size="11" font-weight="bold" fill="#1a1a1a">Reset</text>

    <!-- Outputs Labels -->
    <text x="370" y="145" text-anchor="end" font-size="11" fill="#6b7280">Ready</text>
    <text x="370" y="205" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">SafetyOut</text>
    <text x="370" y="325" text-anchor="end" font-size="11" fill="#c0392b">Error</text>

    <!-- Input Wires -->
    <line x1="130" y1="145" x2="160" y2="145" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <line x1="130" y1="205" x2="160" y2="205" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <line x1="130" y1="265" x2="160" y2="265" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <line x1="130" y1="325" x2="160" y2="325" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  </g>

  <!-- INTERCONNECTION WIRE: SF_EnableSwitch.SafetyOut -> SF_EDM.Activate -->
  <line x1="380" y1="205" x2="440" y2="205" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <!-- FUNCTIONAL BLOCK 2: SF_EDM -->
  <g id="fb-edm">
    <rect x="440" y="85" width="220" height="270" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <rect x="440" y="85" width="220" height="36" rx="6" fill="#2457d6"/>
    <text x="550" y="108" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">SF_EDM</text>

    <!-- Inputs Labels -->
    <text x="450" y="205" font-size="11" font-weight="bold" fill="#1a1a1a">Activate</text>
    <text x="450" y="265" font-size="11" font-weight="bold" fill="#2457d6">Feedback</text>
    <text x="450" y="295" font-size="10" fill="#6b7280">MonitoringTime</text>
    <text x="450" y="325" font-size="11" fill="#1a1a1a">Reset</text>

    <!-- Outputs Labels -->
    <text x="650" y="145" text-anchor="end" font-size="11" fill="#6b7280">Ready</text>
    <text x="650" y="205" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">SafetyOut</text>
    <text x="650" y="325" text-anchor="end" font-size="11" font-weight="bold" fill="#c0392b">Error</text>
  </g>

  <!-- COLUMN 3: HARDWARE ACTUATORS & FEEDBACK -->
  <g id="panel-actuators">
    <rect x="700" y="85" width="235" height="270" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="817" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Виконавчі пристрої</text>

    <!-- Contactor Coils -->
    <rect x="715" y="180" width="205" height="50" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
    <text x="817" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Котушки K1 / K2</text>
    <text x="817" y="218" text-anchor="middle" font-size="10" fill="#6b7280">(Подача силового живлення)</text>

    <!-- Wire SF_EDM.SafetyOut -> Coils -->
    <line x1="660" y1="205" x2="715" y2="205" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>

    <!-- NC Auxiliary Contacts (EDM Feedback) -->
    <rect x="715" y="285" width="205" height="55" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
    <text x="817" y="307" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Контакти K1 NC + K2 NC</text>
    <text x="817" y="325" text-anchor="middle" font-size="10" fill="#6b7280">(Послідовний контур EDM)</text>

    <!-- Mechanical Link Coils -> NC Contacts -->
    <line x1="817" y1="230" x2="817" y2="285" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>

    <!-- Feedback Wire NC Contacts -> SF_EDM.Feedback -->
    <path d="M 715 312 L 675 312 L 675 265 L 440 265" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  </g>

  <!-- BOTTOM DIAGNOSTIC INFO BOX -->
  <rect x="25" y="375" width="910" height="65" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="480" y="398" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">✓ АЛГОРИТМ КОНТРОЛЮ ЗАЛИПАННЯ (EDM): При зварюванні контактів K1/K2 коло K1 NC + K2 NC розмикається.</text>
  <text x="480" y="420" text-anchor="middle" font-size="11" fill="#1a1a1a">SF_EDM виявляє неузгодженість сигналів за час t_EDM, виставляє Error=TRUE та блокує повторне ввімкнення.</text>
</svg>
