<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схемотехніка контуру моніторингу зовнішніх пристроїв (EDM)</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Послідовні NC-контакти пускачів K1/K2 у колі S33–S34 блокують запуск при зварюванні контактів</text>

  <!-- Left Panel: Circuit Diagram -->
  <rect x="40" y="75" width="520" height="455" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="60" y="100" font-size="14" font-weight="bold" fill="#1a1a1a">Схема підключення контуру зворотного зв'язку EDM</text>

  <!-- Safety Relay Module -->
  <rect x="60" y="125" width="200" height="385" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <rect x="60" y="125" width="200" height="35" rx="6" fill="#eaf0fd"/>
  <text x="160" y="147" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Модуль безпеки</text>

  <!-- Logic Block inside Relay -->
  <rect x="80" y="275" width="105" height="210" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <text x="132" y="360" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Логіка</text>
  <text x="132" y="380" font-size="12" fill="#6b7280" text-anchor="middle">моніторингу EDM</text>
  <text x="132" y="400" font-size="12" fill="#6b7280" text-anchor="middle">і дозволу пуску</text>

  <!-- Terminals and Labels (Placed ABOVE horizontal lines) -->
  <circle cx="260" cy="187" r="5" fill="#2457d6"/>
  <text x="250" y="178" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">S33 (24V)</text>

  <circle cx="260" cy="260" r="5" fill="#2457d6"/>
  <text x="250" y="251" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">S34 (EDM)</text>

  <circle cx="260" cy="360" r="5" fill="#27ae60"/>
  <text x="250" y="351" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">14 (Out1)</text>

  <circle cx="260" cy="440" r="5" fill="#27ae60"/>
  <text x="250" y="431" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">24 (Out2)</text>

  <!-- Internal Wiring inside Relay -->
  <line x1="185" y1="260" x2="260" y2="260" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="185" y1="360" x2="260" y2="360" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="185" y1="440" x2="260" y2="440" stroke="#27ae60" stroke-width="1.5"/>

  <!-- EDM Feedback Loop External Wiring -->
  <!-- Wire S33 -> Start Button -->
  <line x1="260" y1="187" x2="300" y2="187" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Start Button S1 -->
  <text x="320" y="168" font-size="12" fill="#1a1a1a" text-anchor="middle">S1 (Старт)</text>
  <circle cx="300" cy="187" r="4" fill="#1a1a1a"/>
  <circle cx="340" cy="187" r="4" fill="#1a1a1a"/>
  <line x1="300" y1="182" x2="340" y2="182" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="320" y1="182" x2="320" y2="173" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Line S1 -> NC K1 -->
  <line x1="340" y1="187" x2="380" y2="187" stroke="#2457d6" stroke-width="2"/>

  <!-- Auxiliary Contact K1 (NC) -->
  <text x="400" y="168" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">K1 (NC)</text>
  <circle cx="380" cy="187" r="4" fill="#1a1a1a"/>
  <circle cx="420" cy="187" r="4" fill="#1a1a1a"/>
  <line x1="380" y1="187" x2="418" y2="180" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Line NC K1 -> NC K2 -->
  <line x1="420" y1="187" x2="460" y2="187" stroke="#2457d6" stroke-width="2"/>

  <!-- Auxiliary Contact K2 (NC) -->
  <text x="480" y="168" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">K2 (NC)</text>
  <circle cx="460" cy="187" r="4" fill="#1a1a1a"/>
  <circle cx="500" cy="187" r="4" fill="#1a1a1a"/>
  <line x1="460" y1="187" x2="498" y2="180" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Return Wire NC K2 -> S34 -->
  <path d="M500,187 L525,187 L525,260 L260,260" stroke="#2457d6" stroke-width="2" fill="none" marker-end="url(#arr-blue)"/>

  <!-- Actuator Power Coils K1 and K2 -->
  <!-- Wire Out14 -> Coil K1 -->
  <line x1="260" y1="360" x2="375" y2="360" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="375" y="343" width="50" height="34" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="400" y="364" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">K1</text>
  <line x1="425" y1="360" x2="525" y2="360" stroke="#6b7280" stroke-width="1.5"/>
  <text x="532" y="364" font-size="12" fill="#6b7280" text-anchor="start">A2 (0V)</text>

  <!-- Wire Out24 -> Coil K2 -->
  <line x1="260" y1="440" x2="455" y2="440" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="455" y="423" width="50" height="34" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="444" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">K2</text>
  <line x1="505" y1="440" x2="525" y2="440" stroke="#6b7280" stroke-width="1.5"/>
  <text x="532" y="444" font-size="12" fill="#6b7280" text-anchor="start">A2 (0V)</text>

  <!-- Mechanical Coupling Lines (Dashed) -->
  <line x1="400" y1="200" x2="400" y2="343" stroke="#6b7280" stroke-dasharray="3 3" stroke-width="1.5"/>
  <line x1="480" y1="200" x2="480" y2="423" stroke="#6b7280" stroke-dasharray="3 3" stroke-width="1.5"/>

  <!-- Right Panel: State Comparison & Diagnostics -->
  <rect x="580" y="75" width="340" height="455" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="600" y="100" font-size="14" font-weight="bold" fill="#1a1a1a">Діагностика стану пристроїв</text>

  <!-- State 1: Normal State -->
  <rect x="600" y="120" width="300" height="150" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="615" y="145" font-size="13" font-weight="bold" fill="#27ae60">1. Нормальний стан (готовність)</text>
  <text x="615" y="170" font-size="12" fill="#1a1a1a">• Пускачі K1/K2 знеструмлені</text>
  <text x="615" y="193" font-size="12" fill="#1a1a1a">• Силові контакти NO розімкнені</text>
  <text x="615" y="216" font-size="12" fill="#1a1a1a">• Допоміжні NC K1/K2 ЗАМКНЕНІ</text>
  <text x="615" y="242" font-size="12" font-weight="bold" fill="#27ae60">✓ Контур S33-S34 замкнено — старт дозволено</text>

  <!-- State 2: Fault Condition (Weld Fault) -->
  <rect x="600" y="285" width="300" height="230" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="615" y="310" font-size="13" font-weight="bold" fill="#c0392b">2. Аварія: Зварювання контакту K1</text>
  <text x="615" y="333" font-size="12" fill="#1a1a1a">• Силовий контакт K1 приварився (NO замкнено)</text>
  <text x="615" y="356" font-size="12" fill="#1a1a1a">• Механічний зв'язок тримає NC K1 РОЗІМКНУТИМ</text>
  <text x="615" y="379" font-size="12" fill="#1a1a1a">• Ланцюг EDM (S33-S34) РОЗІРВАНО</text>
  <text x="615" y="405" font-size="12" font-weight="bold" fill="#c0392b">✗ Спроба натискання S1 є нерезультативною</text>
  <text x="615" y="430" font-size="12" font-weight="bold" fill="#c0392b">• Заборона повторного пуску реле</text>
  <text x="615" y="456" font-size="12" fill="#6b7280">• Запобігає поновленню роботи обладнання</text>
  <text x="615" y="480" font-size="12" fill="#6b7280">  до усунення несправності пускача</text>
</svg>
