<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="#ffffff"/>

  <!-- Markers -->
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Часова діаграма опитування зсувного регістра 74HC165</text>
  <text x="480" y="55" text-anchor="middle" font-size="13" fill="#6b7280">Імпульс PL фіксує BCD-код у тригерах, а такти CLK послідовно висувають біти BCD-тетрад</text>

  <!-- Main Panel Box -->
  <rect x="30" y="70" width="900" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Vertical Timing Grid Lines -->
  <line x1="240" y1="85" x2="240" y2="330" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="300" y1="85" x2="300" y2="330" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="340" y1="160" x2="340" y2="330" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Channel Titles -->
  <text x="45" y="140" font-size="13" font-weight="bold" fill="#c0392b">PL (Parallel Load)</text>
  <text x="45" y="220" font-size="13" font-weight="bold" fill="#2457d6">CLK (Clock Input)</text>
  <text x="45" y="300" font-size="13" font-weight="bold" fill="#27ae60">Q7 (Serial Output)</text>

  <!-- Signal PL Waveform -->
  <path d="M 210,120 L 240,120 L 240,150 L 300,150 L 300,120 L 880,120" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- PL Pulse Width Annotation t_w(PL) -->
  <line x1="240" y1="100" x2="300" y2="100" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="270" y="93" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">t_w(PL) ≥ 20 нс</text>

  <!-- Setup Time Annotation t_su -->
  <line x1="300" y1="175" x2="340" y2="175" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="320" y="168" text-anchor="middle" font-size="11" fill="#6b7280">t_su ≥ 15 нс</text>

  <!-- Signal CLK Waveform -->
  <path d="M 210,230 L 340,230 L 340,200 L 365,200 L 365,230 L 390,230 L 390,200 L 415,200 L 415,230 L 440,230 L 440,200 L 465,200 L 465,230 L 490,230 L 490,200 L 515,200 L 515,230 L 560,230 L 560,200 L 585,200 L 585,230 L 610,230 L 610,200 L 635,200 L 635,230 L 660,230 L 660,200 L 685,200 L 685,230 L 710,230 L 710,200 L 735,200 L 735,230 L 880,230" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Clock Pulse Numbers -->
  <text x="352" y="193" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">1</text>
  <text x="402" y="193" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">2</text>
  <text x="452" y="193" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">3</text>
  <text x="502" y="193" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">4</text>

  <text x="572" y="193" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">5</text>
  <text x="622" y="193" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">6</text>
  <text x="672" y="193" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">7</text>
  <text x="722" y="193" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">8</text>

  <!-- Q7 Data Stream Cells (Nibble 1) -->
  <rect x="300" y="280" width="90" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="345" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">D8 (Біт 7)</text>

  <rect x="390" y="280" width="50" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="415" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">D4</text>

  <rect x="440" y="280" width="50" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="465" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">D2</text>

  <rect x="490" y="280" width="50" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="515" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">D1</text>

  <!-- Nibble 1 Container -->
  <rect x="300" y="335" width="240" height="35" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="420" y="357" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">BCD-тетрада Декади 1 (Нібл 1)</text>

  <!-- Q7 Data Stream Cells (Nibble 2) -->
  <rect x="560" y="280" width="50" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="585" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">D8</text>

  <rect x="610" y="280" width="50" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="635" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">D4</text>

  <rect x="660" y="280" width="50" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="685" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">D2</text>

  <rect x="710" y="280" width="50" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="735" y="300" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">D1</text>

  <!-- Nibble 2 Container -->
  <rect x="560" y="335" width="200" height="35" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="660" y="357" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">BCD-тетрада Декади 2 (Нібл 2)</text>

  <!-- Bottom Explanatory Card -->
  <rect x="45" y="385" width="870" height="38" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="408" text-anchor="middle" font-size="12" fill="#1a1a1a">• Кожна тетрада валідується умовою (<tspan font-weight="bold">нібл ≤ 9</tspan>). Зчитані значення <tspan font-weight="bold" fill="#c0392b">10...15</tspan> відкидаються як невалідний транзитний брязкіт.</text>
</svg>
