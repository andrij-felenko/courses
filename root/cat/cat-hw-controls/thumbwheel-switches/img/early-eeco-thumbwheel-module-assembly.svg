<svg width="960" height="560" viewBox="0 0 960 560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Конструкція першого щитового барабанного перемикача EECO (1950-ті рр.)</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Поєднання індикаційного колеса, рифленого ободу та друкованого диска з BCD-контактами</text>

  <!-- ==================== LEFT PANEL: FRONT BEZEL VIEW ==================== -->
  <rect x="30" y="65" width="340" height="475" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="200" y="88" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">Щитовий модуль EECO (Лицьова панель)</text>
  <text x="200" y="106" font-size="12" fill="#6b7280" text-anchor="middle">Вигляд з боку оператора у стійці</text>

  <!-- Module Front Bezel Assembly -->
  <rect x="100" y="135" width="200" height="260" rx="8" fill="#1a1a1a" stroke="#6b7280" stroke-width="2"/>
  <rect x="120" y="145" width="160" height="15" rx="3" fill="#d0d7de"/>
  <rect x="120" y="370" width="160" height="15" rx="3" fill="#d0d7de"/>
  <circle cx="135" cy="152.5" r="3" fill="#1a1a1a"/>
  <circle cx="265" cy="152.5" r="3" fill="#1a1a1a"/>
  <circle cx="135" cy="377.5" r="3" fill="#1a1a1a"/>
  <circle cx="265" cy="377.5" r="3" fill="#1a1a1a"/>

  <!-- Digit Window Frame -->
  <rect x="145" y="175" width="110" height="180" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>

  <!-- Protruding Ribbed Thumbwheel Rim -->
  <rect x="250" y="185" width="30" height="160" fill="#b0b8c1" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="250" y1="195" x2="280" y2="195" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="250" y1="210" x2="280" y2="210" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="250" y1="225" x2="280" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="250" y1="240" x2="280" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="250" y1="255" x2="280" y2="255" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="250" y1="270" x2="280" y2="270" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="250" y1="285" x2="280" y2="285" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="250" y1="300" x2="280" y2="300" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="250" y1="315" x2="280" y2="315" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="250" y1="330" x2="280" y2="330" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Active Digit Display "7" -->
  <rect x="155" y="225" width="90" height="80" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="200" y="282" font-size="52" font-weight="bold" fill="#2457d6" text-anchor="middle">7</text>

  <!-- Adjacent Digits Fade (Top 6, Bottom 8) -->
  <text x="200" y="212" font-size="28" font-weight="bold" fill="#b0b8c1" text-anchor="middle">6</text>
  <text x="200" y="338" font-size="28" font-weight="bold" fill="#b0b8c1" text-anchor="middle">8</text>

  <!-- Left Panel Summary Box -->
  <rect x="45" y="415" width="310" height="105" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="200" y="435" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Переваги щитового модуля EECO</text>
  <text x="200" y="455" font-size="12" fill="#1a1a1a" text-anchor="middle">Економія площі в 5 разів проти галетників</text>
  <text x="200" y="473" font-size="12" fill="#1a1a1a" text-anchor="middle">Пряме зчитування цифри без окремого дисплея</text>
  <text x="200" y="491" font-size="11" fill="#6b7280" text-anchor="middle">Модульне збирання у багатодекадні блоки</text>


  <!-- ==================== RIGHT PANEL: EXPLODED ROTOR ASSEMBLY ==================== -->
  <rect x="390" y="65" width="540" height="475" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="660" y="88" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">Будова барабанного роторного вузла</text>
  <text x="660" y="106" font-size="12" fill="#6b7280" text-anchor="middle">Інтеграція механічного барабана та контактної BCD-плати</text>

  <!-- 1. Outer Ribbed Wheel Rim (Radius 95) -->
  <circle cx="530" cy="240" r="95" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Teeth / Notches around Ribbed Rim -->
  <line x1="530" y1="141" x2="530" y2="149" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="588" y1="157" x2="583" y2="164" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="623" y1="200" x2="615" y2="204" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="623" y1="280" x2="615" y2="276" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="588" y1="323" x2="583" y2="316" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="530" y1="339" x2="530" y2="331" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="472" y1="323" x2="477" y2="316" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="437" y1="280" x2="445" y2="276" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="437" y1="200" x2="445" y2="204" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="472" y1="157" x2="477" y2="164" stroke="#1a1a1a" stroke-width="2"/>

  <!-- 2. Digit Drum Dial (Radius 72) -->
  <circle cx="530" cy="240" r="72" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
  <text x="530" y="180" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0</text>
  <text x="572" y="193" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1</text>
  <text x="592" y="232" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2</text>
  <text x="586" y="275" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3</text>
  <text x="555" y="304" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">4</text>
  <text x="505" y="304" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">5</text>
  <text x="474" y="275" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">6</text>
  <text x="468" y="232" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">7</text>
  <text x="488" y="193" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">8</text>

  <!-- 3. Attached Rotor BCD PCB Disk (Radius 50) -->
  <circle cx="530" cy="240" r="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>

  <!-- Concentric Conductive BCD Tracks -->
  <!-- COM Common Track (r=18) -->
  <circle cx="530" cy="240" r="18" fill="none" stroke="#2457d6" stroke-width="3"/>
  <!-- Track 1 (r=26) -->
  <circle cx="530" cy="240" r="26" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="16,8"/>
  <!-- Track 2 (r=34) -->
  <circle cx="530" cy="240" r="34" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="28,14"/>
  <!-- Track 4 (r=42) -->
  <circle cx="530" cy="240" r="42" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="45,20"/>

  <!-- Shaft Center -->
  <circle cx="530" cy="240" r="8" fill="#1a1a1a"/>

  <!-- 4. Stator Wiper Contacts Assembly (Right) -->
  <rect x="680" y="195" width="30" height="90" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <!-- Wiper Arms -->
  <path d="M 680,205 L 548,240" stroke="#2457d6" stroke-width="2" fill="none"/>
  <path d="M 680,220 L 556,240" stroke="#27ae60" stroke-width="2" fill="none"/>
  <path d="M 680,235 L 564,240" stroke="#27ae60" stroke-width="2" fill="none"/>
  <path d="M 680,250 L 572,240" stroke="#27ae60" stroke-width="2" fill="none"/>

  <!-- Wiper Terminal Dots -->
  <circle cx="680" cy="205" r="3" fill="#2457d6"/>
  <circle cx="680" cy="220" r="3" fill="#27ae60"/>
  <circle cx="680" cy="235" r="3" fill="#27ae60"/>
  <circle cx="680" cy="250" r="3" fill="#27ae60"/>

  <!-- 5. Detent Spring & Roller Mechanism (Bottom) -->
  <path d="M 460,355 Q 530,345 580,355" stroke="#c0392b" stroke-width="2.5" fill="none"/>
  <circle cx="530" cy="335" r="7" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="530" y="368" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Фіксатор кроку (Detent)</text>

  <!-- Component Callout Labels & Leader Lines (Right Side of Panel 2) -->
  <!-- Label 1: Ribbed Rim -->
  <text x="725" y="145" font-size="12" font-weight="bold" fill="#1a1a1a">1. Рифлений обід</text>
  <text x="725" y="160" font-size="11" fill="#6b7280">Зручне прокручування пальцем</text>
  <line x1="720" y1="150" x2="610" y2="180" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Label 2: Digit Drum -->
  <text x="725" y="190" font-size="12" font-weight="bold" fill="#2457d6">2. Індикаційний барабан</text>
  <text x="725" y="205" font-size="11" fill="#6b7280">Прямий показ цифр 0–9</text>
  <line x1="720" y1="195" x2="590" y2="210" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Label 3: BCD PCB Disk -->
  <text x="725" y="235" font-size="12" font-weight="bold" fill="#27ae60">3. Роторна BCD-плата</text>
  <text x="725" y="250" font-size="11" fill="#6b7280">Концентричні доріжки коду</text>
  <line x1="720" y1="240" x2="575" y2="240" stroke="#27ae60" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Label 4: Wiper Contacts -->
  <text x="725" y="280" font-size="12" font-weight="bold" fill="#2457d6">4. Ковзні контакти</text>
  <text x="725" y="295" font-size="11" fill="#6b7280">Знімання BCD-сигналу (8-4-2-1)</text>
  <line x1="720" y1="285" x2="680" y2="260" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Right Panel Summary Box -->
  <rect x="405" y="395" width="510" height="125" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="660" y="416" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Ключова інновація модуля EECO (1950-ті)</text>
  <text x="660" y="436" font-size="12" fill="#1a1a1a" text-anchor="middle">Барабан поєднує візуальний циферблат та роторний комутатор BCD-коду</text>
  <text x="660" y="454" font-size="12" fill="#1a1a1a" text-anchor="middle">Механічний заскоч (detent) фіксує чітку позицію кожного контакту</text>
  <text x="660" y="472" font-size="12" fill="#1a1a1a" text-anchor="middle">Прямий вихід двійково-кодованого десяткового значення на обчислювач</text>
  <text x="660" y="495" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Стандарт для бортової авіоніки, військових радіостанцій та ЧПУ</text>
</svg>
