<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Definitions -->
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Діодна розв'язка в матриці декадних BCD-перемикачів</text>
  <text x="480" y="53" font-size="13" fill="#6b7280" text-anchor="middle">Розв'язувальні діоди 1N4148 блокують зворотні паразитні струми (sneak paths) при опитуванні</text>

  <!-- LEFT PANEL: SCHEMATICS -->
  <rect x="30" y="75" width="590" height="460" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="325" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принципова схема діодної розв'язки (2 декади)</text>

  <!-- SCAN_1 Input Line & Label -->
  <line x1="100" y1="90" x2="100" y2="120" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="100" y="86" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">SCAN_1 (5V)</text>

  <!-- SCAN_2 Input Line & Label -->
  <line x1="550" y1="90" x2="550" y2="120" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-dark)"/>
  <text x="550" y="86" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">SCAN_2 (0V)</text>

  <!-- DECADE 1 (ACTIVE: SCAN_1 = 5V) -->
  <rect x="45" y="120" width="265" height="320" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="177" y="142" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Декада 1 (Активна: 5V)</text>

  <!-- COM1 Bus -->
  <line x1="70" y1="170" x2="70" y2="410" stroke="#27ae60" stroke-width="2"/>
  <text x="75" y="162" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="start">COM1 (5V)</text>

  <!-- Branch 1 (Bit 1) -->
  <line x1="70" y1="195" x2="135" y2="195" stroke="#27ae60" stroke-width="2"/>
  <text x="100" y="187" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Bit 1</text>
  <!-- Diode D1_1 -->
  <polygon points="135,189 147,195 135,201" fill="#27ae60"/>
  <line x1="147" y1="188" x2="147" y2="202" stroke="#27ae60" stroke-width="2"/>
  <line x1="147" y1="195" x2="295" y2="195" stroke="#27ae60" stroke-width="2"/>
  <text x="215" y="187" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Прямий струм ➔</text>

  <!-- Branch 2 (Bit 2) -->
  <line x1="70" y1="255" x2="135" y2="255" stroke="#27ae60" stroke-width="2"/>
  <text x="100" y="247" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Bit 2</text>
  <!-- Diode D1_2 -->
  <polygon points="135,249 147,255 135,261" fill="#27ae60"/>
  <line x1="147" y1="248" x2="147" y2="262" stroke="#27ae60" stroke-width="2"/>
  <line x1="147" y1="255" x2="295" y2="255" stroke="#27ae60" stroke-width="2"/>
  <text x="215" y="247" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Прямий струм ➔</text>

  <!-- Branch 3 (Bit 4) -->
  <line x1="70" y1="315" x2="135" y2="315" stroke="#27ae60" stroke-width="2"/>
  <text x="100" y="307" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Bit 4</text>
  <!-- Diode D1_4 -->
  <polygon points="135,309 147,315 135,321" fill="#27ae60"/>
  <line x1="147" y1="308" x2="147" y2="322" stroke="#27ae60" stroke-width="2"/>
  <line x1="147" y1="315" x2="295" y2="315" stroke="#27ae60" stroke-width="2"/>
  <text x="215" y="307" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Прямий струм ➔</text>

  <!-- Branch 4 (Bit 8) -->
  <line x1="70" y1="375" x2="90" y2="363" stroke="#6b7280" stroke-width="1.5"/>
  <text x="100" y="367" font-size="11" fill="#6b7280" text-anchor="middle">Bit 8 (Відкр)</text>
  <!-- Diode D1_8 -->
  <polygon points="135,369 147,375 135,381" fill="#6b7280"/>
  <line x1="147" y1="368" x2="147" y2="382" stroke="#6b7280" stroke-width="2"/>
  <line x1="147" y1="375" x2="295" y2="375" stroke="#6b7280" stroke-width="1.5"/>

  <!-- DECADE 2 (INACTIVE: SCAN_2 = 0V) -->
  <rect x="340" y="120" width="265" height="320" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="472" y="142" font-size="13" font-weight="bold" fill="#6b7280" text-anchor="middle">Декада 2 (Вимкнена: 0V)</text>

  <!-- COM2 Bus -->
  <line x1="365" y1="170" x2="365" y2="410" stroke="#c0392b" stroke-width="2"/>
  <text x="370" y="162" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="start">COM2 (0V)</text>

  <!-- Branch 1 (Bit 1) -->
  <line x1="365" y1="195" x2="430" y2="195" stroke="#c0392b" stroke-width="1.5"/>
  <text x="395" y="187" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Bit 1</text>
  <!-- Diode D2_1 (Reverse Biased / Blocked) -->
  <polygon points="430,189 442,195 430,201" fill="#c0392b"/>
  <line x1="442" y1="188" x2="442" y2="202" stroke="#c0392b" stroke-width="2"/>
  <line x1="445" y1="188" x2="453" y2="202" stroke="#c0392b" stroke-width="2"/>
  <line x1="445" y1="202" x2="453" y2="188" stroke="#c0392b" stroke-width="2"/>
  <line x1="453" y1="195" x2="590" y2="195" stroke="#6b7280" stroke-width="1.5"/>
  <text x="510" y="187" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Заперто ⛔</text>

  <!-- Branch 2 (Bit 2) -->
  <line x1="365" y1="255" x2="430" y2="255" stroke="#c0392b" stroke-width="1.5"/>
  <text x="395" y="247" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Bit 2</text>
  <!-- Diode D2_2 (Reverse Biased / Blocked) -->
  <polygon points="430,249 442,255 430,261" fill="#c0392b"/>
  <line x1="442" y1="248" x2="442" y2="262" stroke="#c0392b" stroke-width="2"/>
  <line x1="445" y1="248" x2="453" y2="262" stroke="#c0392b" stroke-width="2"/>
  <line x1="445" y1="262" x2="453" y2="248" stroke="#c0392b" stroke-width="2"/>
  <line x1="453" y1="255" x2="590" y2="255" stroke="#6b7280" stroke-width="1.5"/>
  <text x="510" y="247" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Заперто ⛔</text>

  <!-- Branch 3 (Bit 4) -->
  <line x1="365" y1="315" x2="430" y2="315" stroke="#c0392b" stroke-width="1.5"/>
  <text x="395" y="307" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Bit 4</text>
  <!-- Diode D2_4 (Reverse Biased / Blocked) -->
  <polygon points="430,309 442,315 430,321" fill="#c0392b"/>
  <line x1="442" y1="308" x2="442" y2="322" stroke="#c0392b" stroke-width="2"/>
  <line x1="445" y1="308" x2="453" y2="322" stroke="#c0392b" stroke-width="2"/>
  <line x1="445" y1="322" x2="453" y2="308" stroke="#c0392b" stroke-width="2"/>
  <line x1="453" y1="315" x2="590" y2="315" stroke="#6b7280" stroke-width="1.5"/>
  <text x="510" y="307" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Заперто ⛔</text>

  <!-- Branch 4 (Bit 8) -->
  <line x1="365" y1="375" x2="385" y2="363" stroke="#6b7280" stroke-width="1.5"/>
  <text x="395" y="367" font-size="11" fill="#6b7280" text-anchor="middle">Bit 8 (Відкр)</text>
  <!-- Diode D2_8 -->
  <polygon points="430,369 442,375 430,381" fill="#6b7280"/>
  <line x1="442" y1="368" x2="442" y2="382" stroke="#6b7280" stroke-width="2"/>
  <line x1="442" y1="375" x2="590" y2="375" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Summary Callout Box in Left Panel -->
  <rect x="45" y="455" width="560" height="60" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="325" y="477" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Результат: Діоди D2_1..D2_4 надійно блокують зворотний струм</text>
  <text x="325" y="497" font-size="11" fill="#1a1a1a" text-anchor="middle">Струм із COM1 (+5V) не може протікати в COM2 (0V) через заперті p-n переходи</text>

  <!-- RIGHT PANEL: ANALYSIS & RECOMMENDATIONS -->
  <rect x="640" y="75" width="290" height="460" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="785" y="100" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Аналіз завадозахисту</text>

  <!-- Card 1: Problem without Diodes -->
  <rect x="655" y="120" width="260" height="105" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="6"/>
  <text x="668" y="140" font-size="12" font-weight="bold" fill="#c0392b">1. Проблема без діодів (Sneak Path)</text>
  <text x="668" y="160" font-size="11" fill="#1a1a1a">При замиканні однакових бітів у</text>
  <text x="668" y="177" font-size="11" fill="#1a1a1a">декадах виникає зворотний струм</text>
  <text x="668" y="194" font-size="11" fill="#6b7280">від 5V (SCAN_1) до 0V (SCAN_2)</text>
  <text x="668" y="213" font-size="11" font-weight="bold" fill="#c0392b">Наслідок: Хибні коди (Ghosting)</text>

  <!-- Card 2: Solution with Diodes -->
  <rect x="655" y="240" width="260" height="105" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="6"/>
  <text x="668" y="260" font-size="12" font-weight="bold" fill="#27ae60">2. Розв'язок діодами 1N4148</text>
  <text x="668" y="280" font-size="11" fill="#1a1a1a">Діоди у вимкнених декадах</text>
  <text x="668" y="297" font-size="11" fill="#1a1a1a">перебувають у зворотному зміщенні</text>
  <text x="668" y="314" font-size="11" fill="#6b7280">і мають опір &gt; 100 МОм</text>
  <text x="668" y="333" font-size="11" font-weight="bold" fill="#27ae60">Результат: 100% точне зчитування</text>

  <!-- Card 3: Hardware Recommendations -->
  <rect x="655" y="360" width="260" height="155" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="668" y="380" font-size="12" font-weight="bold" fill="#2457d6">3. Правила схемотехніки</text>
  <text font-size="11" fill="#1a1a1a">
    <tspan x="668" y="402">• Діоди: 1N4148 або BAT54 (Schottky)</tspan>
    <tspan x="668" y="422">• Струм витоку: I_r &lt; 25 нА</tspan>
    <tspan x="668" y="442">• Підтяжка: R_pullup = 10 кОм</tspan>
    <tspan x="668" y="462">• Захист від брязкоту: C = 10 нФ</tspan>
    <tspan x="668" y="487" fill="#27ae60" font-weight="bold">• Стандарт для матриць перемикачів</tspan>
  </text>
</svg>
