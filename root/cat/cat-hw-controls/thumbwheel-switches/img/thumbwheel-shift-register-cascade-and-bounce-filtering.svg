<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Каскадування регістрів 74HC165 та часовий аналіз фільтрації брязкоту</text>
  <text x="480" y="52" font-size="13" text-anchor="middle" fill="#6b7280">Завантаження BCD-тетрад за пульсом PL з подальшою затримкою зчитування після загасання брязкоту контакту</text>

  <!-- БЛОК 1: Схема каскадування -->
  <rect x="20" y="70" width="920" height="195" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="35" y="92" font-size="14" font-weight="bold" fill="#1a1a1a">1. Схема каскадування 4х 74HC165 для 4 BCD-декад (16-бітне зчитування)</text>

  <!-- Декада 4 (MSB) -->
  <rect x="45" y="105" width="160" height="110" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <path d="M45,105 L205,105 L205,126 L45,126 Z" fill="#eaf0fd"/>
  <text x="125" y="120" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Декада 4 (MSB)</text>
  <text x="125" y="142" font-size="12" fill="#6b7280" text-anchor="middle">Перемикач BCD</text>
  <text x="125" y="165" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">74HC165 (IC4)</text>
  <text x="125" y="185" font-size="12" fill="#1a1a1a" text-anchor="middle">D0..D3 (8-4-2-1)</text>

  <!-- Декада 3 -->
  <rect x="230" y="105" width="160" height="110" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <path d="M230,105 L390,105 L390,126 L230,126 Z" fill="#eaf0fd"/>
  <text x="310" y="120" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Декада 3</text>
  <text x="310" y="142" font-size="12" fill="#6b7280" text-anchor="middle">Перемикач BCD</text>
  <text x="310" y="165" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">74HC165 (IC3)</text>
  <text x="310" y="185" font-size="12" fill="#1a1a1a" text-anchor="middle">D0..D3 (8-4-2-1)</text>

  <!-- Декада 2 -->
  <rect x="415" y="105" width="160" height="110" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <path d="M415,105 L575,105 L575,126 L415,126 Z" fill="#eaf0fd"/>
  <text x="495" y="120" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Декада 2</text>
  <text x="495" y="142" font-size="12" fill="#6b7280" text-anchor="middle">Перемикач BCD</text>
  <text x="495" y="165" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">74HC165 (IC2)</text>
  <text x="495" y="185" font-size="12" fill="#1a1a1a" text-anchor="middle">D0..D3 (8-4-2-1)</text>

  <!-- Декада 1 (LSB) -->
  <rect x="600" y="105" width="160" height="110" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <path d="M600,105 L760,105 L760,126 L600,126 Z" fill="#eaf0fd"/>
  <text x="680" y="120" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Декада 1 (LSB)</text>
  <text x="680" y="142" font-size="12" fill="#6b7280" text-anchor="middle">Перемикач BCD</text>
  <text x="680" y="165" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">74HC165 (IC1)</text>
  <text x="680" y="185" font-size="12" fill="#1a1a1a" text-anchor="middle">D0..D3 (8-4-2-1)</text>

  <!-- Мікроконтролер -->
  <rect x="785" y="105" width="135" height="110" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="852" y="124" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Мікроконтролер</text>
  <text x="852" y="142" font-size="12" fill="#6b7280" text-anchor="middle">(MCU / SoC)</text>
  <text x="792" y="168" font-size="12" fill="#1a1a1a">MISO (DATA)</text>
  <text x="792" y="190" font-size="12" fill="#1a1a1a">PL_OUT</text>
  <text x="792" y="210" font-size="12" fill="#1a1a1a">CLK_OUT</text>

  <!-- Каскадне зсунення Q7 -> DS -->
  <line x1="205" y1="160" x2="228" y2="160" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="390" y1="160" x2="413" y2="160" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="575" y1="160" x2="598" y2="160" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="760" y1="164" x2="783" y2="164" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Спільна шина PL -->
  <path d="M785,186 L770,186 L770,234 L125,234" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="680" cy="234" r="3" fill="#c0392b"/>
  <line x1="680" y1="234" x2="680" y2="215" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="495" cy="234" r="3" fill="#c0392b"/>
  <line x1="495" y1="234" x2="495" y2="215" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="310" cy="234" r="3" fill="#c0392b"/>
  <line x1="310" y1="234" x2="310" y2="215" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="125" cy="234" r="3" fill="#c0392b"/>
  <line x1="125" y1="234" x2="125" y2="215" stroke="#c0392b" stroke-width="1.5"/>
  <text x="35" y="238" font-size="12" font-weight="bold" fill="#c0392b">Лінія PL (Load)</text>

  <!-- Спільна шина CLK -->
  <path d="M785,206 L775,206 L775,250 L145,250" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="700" cy="250" r="3" fill="#1a1a1a"/>
  <line x1="700" y1="250" x2="700" y2="215" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="515" cy="250" r="3" fill="#1a1a1a"/>
  <line x1="515" y1="250" x2="515" y2="215" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="330" cy="250" r="3" fill="#1a1a1a"/>
  <line x1="330" y1="250" x2="330" y2="215" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="145" cy="250" r="3" fill="#1a1a1a"/>
  <line x1="145" y1="250" x2="145" y2="215" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="35" y="254" font-size="12" font-weight="bold" fill="#1a1a1a">Лінія CLK (Такти)</text>

  <!-- БЛОК 2: Часова діаграма -->
  <rect x="20" y="280" width="920" height="225" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="35" y="302" font-size="14" font-weight="bold" fill="#1a1a1a">2. Часова діаграма фільтрації брязкоту та транзитних станів при перемиканні</text>

  <!-- Зони аналізу -->
  <rect x="340" y="315" width="180" height="180" rx="4" fill="#fdecea" opacity="0.6"/>
  <text x="430" y="328" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Зона брязкоту й завад</text>

  <rect x="520" y="315" width="140" height="180" rx="4" fill="#e9f7ef" opacity="0.6"/>
  <text x="590" y="328" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Пауза t_settle (20 мс)</text>

  <rect x="660" y="315" width="240" height="180" rx="4" fill="#eaf0fd" opacity="0.6"/>
  <text x="780" y="328" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Стробування PL та зсув</text>

  <!-- Сигнал 1: Вхід BCD -->
  <text x="35" y="350" font-size="12" font-weight="bold" fill="#1a1a1a">Вхід BCD (Контакт)</text>
  <line x1="220" y1="352" x2="340" y2="352" stroke="#27ae60" stroke-width="2"/>
  <text x="280" y="344" font-size="12" fill="#27ae60" text-anchor="middle">Код "3" (Стабільний)</text>
  <!-- Брязкіт у зоні 340..520 -->
  <path d="M340,352 L355,342 L370,360 L385,342 L400,360 L415,345 L430,360 L445,342 L465,360 L485,345 L505,358 L520,352" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <!-- Стабільний код "4" -->
  <line x1="520" y1="352" x2="900" y2="352" stroke="#27ae60" stroke-width="2"/>
  <text x="710" y="344" font-size="12" fill="#27ae60" text-anchor="middle">Код "4" (Новий стабільний)</text>

  <!-- Сигнал 2: PL -->
  <text x="35" y="388" font-size="12" font-weight="bold" fill="#1a1a1a">Сигнал PL (Load)</text>
  <path d="M220,380 L670,380 L675,398 L695,398 L700,380 L900,380" fill="none" stroke="#2457d6" stroke-width="2"/>
  <text x="685" y="408" font-size="12" fill="#2457d6" text-anchor="middle">Імпульс PL (Засувка)</text>

  <!-- Сигнал 3: CLK -->
  <text x="35" y="432" font-size="12" font-weight="bold" fill="#1a1a1a">Такти CLK (16 біт)</text>
  <path d="M220,438 L710,438 L715,425 L720,438 L725,425 L730,438 L735,425 L740,438 L745,425 L750,438 L755,425 L760,438 L765,425 L770,438 L775,425 L780,438 L785,425 L790,438 L795,425 L850,438 L900,438" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="790" y="418" font-size="12" fill="#1a1a1a" text-anchor="middle">16 тактових імпульсів CLK</text>

  <!-- Сигнал 4: Дані у MCU -->
  <text x="35" y="472" font-size="12" font-weight="bold" fill="#1a1a1a">Дані у MCU (SPI)</text>
  <!-- Шина старих даних -->
  <path d="M220,460 L670,460 L675,475 L670,490 L220,490 Z" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="280" y="479" font-size="12" fill="#6b7280" text-anchor="middle">Попереднє значення</text>
  <!-- Шина нових даних -->
  <path d="M675,475 L680,460 L900,460 L900,490 L680,490 Z" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="780" y="479" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Прийом 4 BCD-тетрад (Код 4)</text>

</svg>
