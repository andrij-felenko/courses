<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Цокольовка виводів та апаратний інтерфейс BCD-перемикача</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Призначення виводів крайового роз'єму статора (COM, 1, 2, 4, 8) та внутрішня матриця комутації ламелей</text>

  <!-- LEFT PANEL: PCB Edge Pinout & Physical Specs -->
  <rect x="35" y="80" width="425" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">1. Розводка виводів та крайовий роз'єм</text>
  <text x="247" y="120" text-anchor="middle" font-size="12" fill="#6b7280">Геометрія друкованого роз'єму статора модуля</text>

  <!-- Stator PCB Card -->
  <rect x="65" y="140" width="365" height="180" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="247" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Плата-статор (PCB Stator Edge Connector)</text>

  <!-- Gold Fingers Pins -->
  <!-- Pin COM -->
  <rect x="85" y="180" width="50" height="110" rx="3" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.2"/>
  <text x="110" y="205" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">COM</text>
  <text x="110" y="225" font-size="10" fill="#6b7280" text-anchor="middle">(Спільний)</text>
  <rect x="90" y="250" width="40" height="35" rx="2" fill="#2457d6"/>
  <text x="110" y="272" font-size="10" font-weight="bold" fill="white" text-anchor="middle">GND/VCC</text>

  <!-- Pin 1 -->
  <rect x="150" y="180" width="50" height="110" rx="3" fill="white" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="175" y="205" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1</text>
  <text x="175" y="225" font-size="10" fill="#6b7280" text-anchor="middle">(Біт 2⁰)</text>
  <rect x="155" y="250" width="40" height="35" rx="2" fill="#27ae60"/>
  <text x="175" y="272" font-size="11" font-weight="bold" fill="white" text-anchor="middle">D0</text>

  <!-- Pin 2 -->
  <rect x="215" y="180" width="50" height="110" rx="3" fill="white" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="240" y="205" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2</text>
  <text x="240" y="225" font-size="10" fill="#6b7280" text-anchor="middle">(Біт 2¹)</text>
  <rect x="220" y="250" width="40" height="35" rx="2" fill="#27ae60"/>
  <text x="240" y="272" font-size="11" font-weight="bold" fill="white" text-anchor="middle">D1</text>

  <!-- Pin 4 -->
  <rect x="280" y="180" width="50" height="110" rx="3" fill="white" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="305" y="205" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">4</text>
  <text x="305" y="225" font-size="10" fill="#6b7280" text-anchor="middle">(Біт 2²)</text>
  <rect x="285" y="250" width="40" height="35" rx="2" fill="#27ae60"/>
  <text x="305" y="272" font-size="11" font-weight="bold" fill="white" text-anchor="middle">D2</text>

  <!-- Pin 8 -->
  <rect x="345" y="180" width="50" height="110" rx="3" fill="white" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="370" y="205" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">8</text>
  <text x="370" y="225" font-size="10" fill="#6b7280" text-anchor="middle">(Біт 2³)</text>
  <rect x="350" y="250" width="40" height="35" rx="2" fill="#27ae60"/>
  <text x="370" y="272" font-size="11" font-weight="bold" fill="white" text-anchor="middle">D3</text>

  <!-- Specs Card -->
  <rect x="50" y="335" width="395" height="125" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="65" y="357" font-size="12" fill="#1a1a1a">• Робоча напруга: 5 V DC ... 28 V DC</text>
  <text x="65" y="380" font-size="12" fill="#1a1a1a">• Струм комутації: 10 мА ... 100 мА</text>
  <text x="65" y="403" font-size="12" fill="#1a1a1a">• Струм проведення у спокої: до 1.0 А</text>
  <text x="65" y="426" font-size="12" fill="#2457d6">• Покриття ламелей: Тверде золото 0.5–1.0 мкм</text>
  <text x="65" y="449" font-size="12" font-weight="bold" fill="#27ae60">• Перехідний опір контакта: &lt; 50 мОм</text>

  <!-- RIGHT PANEL: Equivalent Internal Circuit -->
  <rect x="485" y="80" width="440" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="705" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">2. Принципова схема комутації BCD</text>
  <text x="705" y="120" text-anchor="middle" font-size="12" fill="#2457d6">Стан позиції "7" [0111]: лінії 1, 2, 4 замкнені, лінія 8 розімкнена</text>

  <!-- Schematic Box -->
  <rect x="500" y="135" width="410" height="325" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.2"/>

  <!-- Common Input Bus (COM) -->
  <text x="515" y="278" font-size="11" font-weight="bold" fill="#2457d6">COM (GND)</text>
  <line x1="515" y1="290" x2="575" y2="290" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="575" cy="290" r="4" fill="#2457d6"/>
  <line x1="575" y1="170" x2="575" y2="410" stroke="#2457d6" stroke-width="2"/>

  <!-- LINE D0 (Bit 1) -->
  <line x1="575" y1="170" x2="675" y2="170" stroke="#27ae60" stroke-width="2"/>
  <text x="615" y="162" font-size="10" fill="#27ae60" font-weight="bold">Замкнено</text>
  <!-- Diode 1N4148 -->
  <polygon points="675,166 685,170 675,174" fill="#1a1a1a"/>
  <line x1="685" y1="166" x2="685" y2="174" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="685" y1="170" x2="740" y2="170" stroke="#27ae60" stroke-width="1.5"/>
  <!-- Pull-Up Resistor -->
  <rect x="733" y="143" width="14" height="20" fill="white" stroke="#1a1a1a" stroke-width="1"/>
  <text x="740" y="133" font-size="10" text-anchor="middle" fill="#6b7280">VCC (+3.3V)</text>
  <line x1="740" y1="138" x2="740" y2="143" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="740" y1="163" x2="740" y2="170" stroke="#1a1a1a" stroke-width="1"/>
  <circle cx="740" cy="170" r="3" fill="#27ae60"/>
  <line x1="740" y1="170" x2="890" y2="170" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="885" y="165" font-size="10" text-anchor="end" fill="#27ae60" font-weight="bold">D0 (1) = 0 V (Лог. 0)</text>

  <!-- LINE D1 (Bit 2) -->
  <line x1="575" y1="250" x2="675" y2="250" stroke="#27ae60" stroke-width="2"/>
  <text x="615" y="242" font-size="10" fill="#27ae60" font-weight="bold">Замкнено</text>
  <polygon points="675,246 685,250 675,254" fill="#1a1a1a"/>
  <line x1="685" y1="246" x2="685" y2="254" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="685" y1="250" x2="740" y2="250" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="733" y="223" width="14" height="20" fill="white" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="740" y1="218" x2="740" y2="223" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="740" y1="243" x2="740" y2="250" stroke="#1a1a1a" stroke-width="1"/>
  <circle cx="740" cy="250" r="3" fill="#27ae60"/>
  <line x1="740" y1="250" x2="890" y2="250" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="885" y="245" font-size="10" text-anchor="end" fill="#27ae60" font-weight="bold">D1 (2) = 0 V (Лог. 0)</text>

  <!-- LINE D2 (Bit 4) -->
  <line x1="575" y1="330" x2="675" y2="330" stroke="#27ae60" stroke-width="2"/>
  <text x="615" y="322" font-size="10" fill="#27ae60" font-weight="bold">Замкнено</text>
  <polygon points="675,326 685,330 675,334" fill="#1a1a1a"/>
  <line x1="685" y1="326" x2="685" y2="334" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="685" y1="330" x2="740" y2="330" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="733" y="303" width="14" height="20" fill="white" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="740" y1="298" x2="740" y2="303" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="740" y1="323" x2="740" y2="330" stroke="#1a1a1a" stroke-width="1"/>
  <circle cx="740" cy="330" r="3" fill="#27ae60"/>
  <line x1="740" y1="330" x2="890" y2="330" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arr-green)"/>
  <text x="885" y="325" font-size="10" text-anchor="end" fill="#27ae60" font-weight="bold">D2 (4) = 0 V (Лог. 0)</text>

  <!-- LINE D3 (Bit 8) -->
  <!-- Open Switch -->
  <line x1="575" y1="410" x2="605" y2="410" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="605" y1="410" x2="630" y2="398" stroke="#c0392b" stroke-width="2"/>
  <line x1="635" y1="410" x2="675" y2="410" stroke="#6b7280" stroke-width="1.5"/>
  <text x="615" y="392" font-size="10" fill="#c0392b" font-weight="bold">Розімкнено</text>
  <polygon points="675,406 685,410 675,414" fill="#6b7280"/>
  <line x1="685" y1="406" x2="685" y2="414" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="685" y1="410" x2="740" y2="410" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="733" y="383" width="14" height="20" fill="white" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="740" y1="378" x2="740" y2="383" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="740" y1="403" x2="740" y2="410" stroke="#1a1a1a" stroke-width="1"/>
  <circle cx="740" cy="410" r="3" fill="#c0392b"/>
  <line x1="740" y1="410" x2="890" y2="410" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <text x="885" y="405" font-size="10" text-anchor="end" fill="#c0392b" font-weight="bold">D3 (8) = 3.3 V (Лог. 1)</text>
</svg>
