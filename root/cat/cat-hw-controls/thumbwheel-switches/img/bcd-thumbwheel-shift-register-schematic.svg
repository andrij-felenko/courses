  <text x="292" y="257" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">4</text>
  <text x="292" y="273" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">8</text>

  <!-- SW3 Box -->
  <rect x="80" y="302" width="220" height="84" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
