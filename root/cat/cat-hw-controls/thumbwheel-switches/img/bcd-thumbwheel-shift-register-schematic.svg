  <text x="59" y="445" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">SEL4</text>
  <line x1="76" y1="441" x2="80" y2="441" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- SW1 Box -->
