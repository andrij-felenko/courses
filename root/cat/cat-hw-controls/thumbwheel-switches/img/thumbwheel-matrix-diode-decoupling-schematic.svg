<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <defs>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Матрична схема підключення 4 декадних BCD-перемикачів</text>
  <text x="480" y="48" text-anchor="middle" font-size="13" fill="#6b7280">Діоди 1N4148 запобігають обхідним струмам між неактивними розрядами при скануванні</text>

  <!-- MCU Scanning Controller (Left) -->
  <rect x="25" y="75" width="115" height="350" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="82" y="98" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Мікроконтролер</text>
  <text x="82" y="115" text-anchor="middle" font-size="11" fill="#6b7280">(Сканування)</text>

  <rect x="35" y="132" width="95" height="32" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="82" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b7280">SCAN 0 (5V)</text>

  <rect x="35" y="212" width="95" height="32" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="82" y="232" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">SCAN 1 (0V)</text>

  <rect x="35" y="292" width="95" height="32" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="82" y="312" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b7280">SCAN 2 (5V)</text>

  <rect x="35" y="372" width="95" height="32" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="82" y="392" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b7280">SCAN 3 (5V)</text>

  <!-- Decade 0 (Inactive) -->
  <rect x="165" y="115" width="510" height="62" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="180" y="136" font-size="12" font-weight="bold" fill="#6b7280">Декада 0 (Тисячі) — НЕАКТИВНА (SCAN 0 = 5В)</text>
  <text x="180" y="156" font-size="11" fill="#c0392b">Уставка '3' (BCD 0011): контакти замкнені, діоди VD0 відсічені</text>
  <rect x="545" y="124" width="115" height="20" rx="3" fill="#fdecea" stroke="#c0392b"/>
  <text x="602" y="138" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">VD0: БЛОКОВАНО</text>

  <!-- Decade 1 (Active) -->
  <rect x="165" y="195" width="510" height="62" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="180" y="216" font-size="12" font-weight="bold" fill="#27ae60">Декада 1 (Сотні) — АКТИВНА (SCAN 1 = 0В)</text>
  <text x="180" y="236" font-size="11" fill="#1a1a1a">Уставка '5' (BCD 0101): струм іде через діоди VD1_1 та VD1_4</text>
  <rect x="545" y="204" width="115" height="20" rx="3" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="602" y="218" text-anchor="middle" font-size="10" font-weight="bold" fill="#27ae60">VD1_1,4: ПРОВІДНІ</text>

  <!-- Decade 2 (Inactive) -->
  <rect x="165" y="275" width="510" height="62" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="180" y="296" font-size="12" font-weight="bold" fill="#6b7280">Декада 2 (Десятки) — НЕАКТИВНА (SCAN 2 = 5В)</text>
  <text x="180" y="316" font-size="11" fill="#6b7280">Уставка '8' (BCD 1000): контакт замкнений, діод VD2 відсічений</text>

  <!-- Decade 3 (Inactive) -->
  <rect x="165" y="355" width="510" height="62" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="180" y="376" font-size="12" font-weight="bold" fill="#6b7280">Декада 3 (Одиниці) — НЕАКТИВНА (SCAN 3 = 5В)</text>
  <text x="180" y="396" font-size="11" fill="#6b7280">Уставка '0' (BCD 0000): контакти відкриті, діоди VD3 вимкнені</text>

  <!-- Wires from MCU SCAN to Decades -->
  <line x1="130" y1="148" x2="165" y2="148" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="130" y1="228" x2="165" y2="228" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <line x1="130" y1="308" x2="165" y2="308" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="130" y1="388" x2="165" y2="388" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Schematic Diodes 1N4148 inside Decades (Right Side of Decades) -->
  <!-- Decade 0 Diodes (Blocked) -->
  <line x1="640" y1="148" x2="725" y2="148" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <polygon points="645,148 655,143 655,153" fill="#c0392b"/>
  <line x1="645" y1="142" x2="645" y2="154" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Decade 1 Diodes (Conducting - Green) -->
  <!-- Line BCD 1 -->
  <line x1="640" y1="216" x2="725" y2="216" stroke="#27ae60" stroke-width="2" marker-start="url(#arr-green)"/>
  <polygon points="645,216 655,211 655,221" fill="#27ae60"/>
  <line x1="645" y1="210" x2="645" y2="222" stroke="#27ae60" stroke-width="2"/>

  <!-- Line BCD 4 -->
  <line x1="640" y1="240" x2="785" y2="240" stroke="#27ae60" stroke-width="2" marker-start="url(#arr-green)"/>
  <polygon points="645,240 655,235 655,245" fill="#27ae60"/>
  <line x1="645" y1="234" x2="645" y2="246" stroke="#27ae60" stroke-width="2"/>

  <!-- Decade 2 & 3 Output Wires -->
  <line x1="640" y1="308" x2="815" y2="308" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="640" y1="388" x2="755" y2="388" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Pull-up Resistors & BCD Bus Area (x=705 to 835) -->
  <!-- VCC Rail (+5V) -->
  <line x1="710" y1="75" x2="830" y2="75" stroke="#2457d6" stroke-width="2"/>
  <text x="770" y="65" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">+5V (VCC)</text>

  <!-- Pull-Up Resistors R1, R2, R4, R8 -->
  <!-- Resistor R1 (x=725) -->
  <line x1="725" y1="75" x2="725" y2="84" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="719" y="84" width="12" height="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="714" y="96" text-anchor="end" font-size="10" fill="#6b7280">R1</text>
  <line x1="725" y1="102" x2="725" y2="412" stroke="#27ae60" stroke-width="2"/>

  <!-- Resistor R2 (x=755) -->
  <line x1="755" y1="75" x2="755" y2="84" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="749" y="84" width="12" height="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="744" y="96" text-anchor="end" font-size="10" fill="#6b7280">R2</text>
  <line x1="755" y1="102" x2="755" y2="412" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Resistor R4 (x=785) -->
  <line x1="785" y1="75" x2="785" y2="84" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="779" y="84" width="12" height="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="774" y="96" text-anchor="end" font-size="10" fill="#6b7280">R4</text>
  <line x1="785" y1="102" x2="785" y2="412" stroke="#27ae60" stroke-width="2"/>

  <!-- Resistor R8 (x=815) -->
  <line x1="815" y1="75" x2="815" y2="84" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="809" y="84" width="12" height="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="804" y="96" text-anchor="end" font-size="10" fill="#6b7280">R8</text>
  <line x1="815" y1="102" x2="815" y2="412" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Bus Labels at Bottom (Split into 2 lines) -->
  <text x="725" y="426" text-anchor="middle" font-size="10" font-weight="bold" fill="#27ae60">BCD1</text>
  <text x="725" y="438" text-anchor="middle" font-size="10" font-weight="bold" fill="#27ae60">0V</text>

  <text x="755" y="426" text-anchor="middle" font-size="10" font-weight="bold" fill="#6b7280">BCD2</text>
  <text x="755" y="438" text-anchor="middle" font-size="10" fill="#6b7280">5V</text>

  <text x="785" y="426" text-anchor="middle" font-size="10" font-weight="bold" fill="#27ae60">BCD4</text>
  <text x="785" y="438" text-anchor="middle" font-size="10" font-weight="bold" fill="#27ae60">0V</text>

  <text x="815" y="426" text-anchor="middle" font-size="10" font-weight="bold" fill="#6b7280">BCD8</text>
  <text x="815" y="438" text-anchor="middle" font-size="10" fill="#6b7280">5V</text>

  <!-- MCU BCD Inputs (Right) -->
  <rect x="850" y="75" width="95" height="350" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="897" y="98" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Мікроконтролер</text>
  <text x="897" y="114" text-anchor="middle" font-size="11" fill="#6b7280">(Входи BCD)</text>

  <!-- Connection Wires from Bus to MCU Inputs -->
  <line x1="725" y1="148" x2="850" y2="148" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="860" y="136" width="75" height="24" rx="3" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="897" y="152" text-anchor="middle" font-size="10" font-weight="bold" fill="#27ae60">IN1: 0V (1)</text>

  <line x1="755" y1="228" x2="850" y2="228" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="860" y="216" width="75" height="24" rx="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="897" y="232" text-anchor="middle" font-size="10" font-weight="bold" fill="#6b7280">IN2: 5V (0)</text>

  <line x1="785" y1="308" x2="850" y2="308" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <rect x="860" y="296" width="75" height="24" rx="3" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="897" y="312" text-anchor="middle" font-size="10" font-weight="bold" fill="#27ae60">IN4: 0V (1)</text>

  <line x1="815" y1="388" x2="850" y2="388" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="860" y="376" width="75" height="24" rx="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="897" y="392" text-anchor="middle" font-size="10" font-weight="bold" fill="#6b7280">IN8: 5V (0)</text>

  <!-- Summary Footer Box -->
  <rect x="25" y="452" width="920" height="58" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="40" y="470" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#27ae60">Прямий струм (SCAN 1 = 0В):</tspan> Струм з VCC іде через відкритий діод VD1 в 0В. МК зчитує LOW (0В) на шинах BCD 1 і 4.</text>
  <text x="40" y="492" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#c0392b">Зворотне відсікання (SCAN 0,2,3 = 5В):</tspan> Зворотна напруга на діодах блокує витік струму 5В у шину BCD через замкнені контактори.</text>
</svg>
