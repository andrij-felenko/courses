<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-blue-start" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма RC-наростання напруги BCD-шини</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Вплив падіння напруги V_F на діоді 1N4148 та постійної часу τ = R_pull × C_line</text>

  <!-- Plot Frame Borders -->
  <line x1="140" y1="80" x2="570" y2="80" stroke="#d0d7de" stroke-width="1"/>
  <line x1="570" y1="80" x2="570" y2="367" stroke="#d0d7de" stroke-width="1"/>
  <line x1="140" y1="80" x2="140" y2="367" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Noise Margin Region (Shaded Area between V_F and V_IL,max) -->
  <rect x="140" y="287" width="250" height="45" fill="#fdecea" stroke="#c0392b" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="285" y="306" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Звужений запас N_ML</text>
  <text x="285" y="322" font-size="11" fill="#c0392b" text-anchor="middle">N_ML = V_IL,max - V_F ≈ 0.85 В</text>

  <!-- Voltage Threshold Lines (Horizontal) -->
  <!-- V_CC line (5.0V) -->
  <line x1="140" y1="100" x2="570" y2="100" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="130" y="104" font-size="12" fill="#1a1a1a" text-anchor="end">5.0 В (V_CC)</text>

  <!-- V_IH,min line (3.5V) -->
  <line x1="140" y1="180" x2="570" y2="180" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="130" y="184" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">3.5 В (V_IH,min)</text>

  <!-- V_IL,max line (1.5V) -->
  <line x1="140" y1="287" x2="570" y2="287" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="130" y="291" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">1.5 В (V_IL,max)</text>

  <!-- V_F line (0.65V) -->
  <line x1="140" y1="332" x2="570" y2="332" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="130" y="336" font-size="12" fill="#6b7280" text-anchor="end">0.65 В (V_F)</text>

  <!-- GND line (0V) & Time Axis -->
  <line x1="140" y1="367" x2="575" y2="367" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="130" y="371" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">0 В (GND)</text>
  <text x="575" y="392" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Час (t)</text>

  <!-- Vertical Time Guide Lines -->
  <!-- t0 line -->
  <line x1="190" y1="80" x2="190" y2="377" stroke="#6b7280" stroke-dasharray="2,2" stroke-width="1"/>
  <text x="190" y="405" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">t₀ (Розмикання)</text>

  <!-- t0 + tau line (segmented to avoid noise margin box) -->
  <line x1="390" y1="180" x2="390" y2="280" stroke="#6b7280" stroke-dasharray="2,2" stroke-width="1"/>
  <line x1="390" y1="337" x2="390" y2="377" stroke="#6b7280" stroke-dasharray="2,2" stroke-width="1"/>
  <text x="390" y="405" font-size="12" fill="#6b7280" text-anchor="middle">t₀ + τ</text>

  <!-- t_delay line -->
  <line x1="460" y1="140" x2="460" y2="422" stroke="#2457d6" stroke-dasharray="3,3" stroke-width="1.5"/>
  <text x="460" y="438" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">t_delay (Поріг V_IH)</text>

  <!-- Delay Time Span Arrow & Text -->
  <line x1="190" y1="140" x2="460" y2="140" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue-start)" marker-end="url(#arr-blue)"/>
  <text x="325" y="130" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Затримка фронту t_delay ≈ 1.1 × τ</text>

  <!-- RC Charging Curve -->
  <path d="M 140,367 L 190,367 L 190,332 C 240,332 320,230 390,205 C 410,198 440,186 460,180 C 500,168 530,135 560,115" fill="none" stroke="#2457d6" stroke-width="3"/>

  <!-- Key Points on Curve -->
  <!-- Diode Jump Point & Callout -->
  <circle cx="190" cy="332" r="4" fill="#c0392b"/>
  <text x="205" y="356" font-size="12" fill="#c0392b">Стрибок на V_F ≈ 0.65 В</text>

  <!-- Threshold Crossing Point -->
  <circle cx="460" cy="180" r="5" fill="#27ae60"/>

  <!-- Info Panel (Right Side) -->
  <rect x="600" y="90" width="330" height="280" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8" ry="8"/>
  <text x="620" y="120" font-size="14" font-weight="bold" fill="#1a1a1a">Ключові параметри та вимоги:</text>

  <text x="620" y="152" font-size="12" font-weight="bold" fill="#2457d6">• Постійна часу τ:</text>
  <text x="635" y="171" font-size="12" fill="#1a1a1a">τ = R_pull × C_line</text>
  <text x="635" y="189" font-size="12" fill="#6b7280">(R = 4.7 kΩ, C = 100 pF → τ ≈ 470 нс)</text>

  <text x="620" y="219" font-size="12" font-weight="bold" fill="#c0392b">• Падіння на діоді V_F:</text>
  <text x="635" y="237" font-size="12" fill="#1a1a1a">V_OL = V_F ≈ 0.65 В (1N4148)</text>

  <text x="620" y="266" font-size="12" font-weight="bold" fill="#c0392b">• Запас завадостійкості N_ML:</text>
  <text x="635" y="284" font-size="12" fill="#1a1a1a">N_ML = V_IL,max - V_F ≈ 0.85 В</text>
  <text x="635" y="302" font-size="12" fill="#6b7280">(зменшення з 1.5 В на величину V_F)</text>

  <text x="620" y="332" font-size="12" font-weight="bold" fill="#27ae60">• Затримка фронту t_delay:</text>
  <text x="635" y="350" font-size="12" fill="#1a1a1a">t_delay ≈ 1.1 × τ (поріг V_IH = 3.5 В)</text>
</svg>
