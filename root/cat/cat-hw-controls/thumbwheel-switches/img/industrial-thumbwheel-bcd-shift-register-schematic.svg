<svg width="960" height="560" viewBox="0 0 960 560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принципова схема опитування 4-розрядного блоку BCD-перемикачів через 74HC165</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Діодна ізоляція 1N4148 усуває паразитичні струми, а зсувний регістр згортає BCD-шину до 3 сигналів МК</text>

  <!-- ==================== PANEL 1: BCD SWITCH BLOCK & DIODES ==================== -->
  <rect x="30" y="65" width="310" height="475" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="185" y="88" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Блок BCD-перемикачів</text>
  <text x="185" y="105" font-size="11" fill="#6b7280" text-anchor="middle">4 декади (D1...D4) з діодами 1N4148</text>

  <!-- Decade D1 Box -->
  <rect x="45" y="125" width="280" height="55" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="145" font-size="12" font-weight="bold" fill="#1a1a1a">Декада D1 (Тисячі) [7]</text>
  <text x="240" y="145" font-size="11" font-weight="bold" fill="#c0392b">4× 1N4148</text>

  <!-- Decade D2 Box -->
  <rect x="45" y="190" width="280" height="55" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="210" font-size="12" font-weight="bold" fill="#1a1a1a">Декада D2 (Сотні) [3]</text>
  <text x="240" y="210" font-size="11" font-weight="bold" fill="#c0392b">4× 1N4148</text>

  <!-- Decade D3 Box -->
  <rect x="45" y="255" width="280" height="55" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="275" font-size="12" font-weight="bold" fill="#1a1a1a">Декада D3 (Десятки) [5]</text>
  <text x="240" y="275" font-size="11" font-weight="bold" fill="#c0392b">4× 1N4148</text>

  <!-- Decade D4 Box -->
  <rect x="45" y="320" width="280" height="55" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="340" font-size="12" font-weight="bold" fill="#1a1a1a">Декада D4 (Одиниці) [2]</text>
  <text x="240" y="340" font-size="11" font-weight="bold" fill="#c0392b">4× 1N4148</text>

  <!-- Panel 1 Summary Box -->
  <rect x="45" y="390" width="280" height="135" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="185" y="412" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Роль діодів 1N4148</text>
  <text x="185" y="432" font-size="12" fill="#1a1a1a" text-anchor="middle">Усувають паразитичні зворотні струми</text>
  <text x="185" y="450" font-size="12" fill="#1a1a1a" text-anchor="middle">у спільних BCD-шинах при скануванні</text>
  <text x="185" y="472" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Підтяжка до GND: R_pull = 10 кОм</text>
  <text x="185" y="490" font-size="11" fill="#6b7280" text-anchor="middle">Фіксація суворого логічного 0</text>
  <text x="185" y="510" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Надійність у промислових завадах</text>


  <!-- ==================== PANEL 2: SHIFT REGISTER 74HC165 ==================== -->
  <rect x="370" y="65" width="260" height="475" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="500" y="88" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">2. Зсувний регістр 74HC165</text>
  <text x="500" y="105" font-size="11" fill="#6b7280" text-anchor="middle">Паралельне захоплення BCD-коду</text>

  <!-- IC 74HC165 Symbol -->
  <rect x="390" y="125" width="220" height="250" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="500" y="150" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">IC 74HC165</text>
  <text x="500" y="166" font-size="11" fill="#6b7280" text-anchor="middle">8-Bit PISO Shift Register</text>

  <!-- Parallel Inputs (Left Side Pins) -->
  <text x="400" y="190" font-size="11" font-weight="bold" fill="#1a1a1a">A (D0) ← Bit 1</text>
  <text x="400" y="215" font-size="11" font-weight="bold" fill="#1a1a1a">B (D1) ← Bit 2</text>
  <text x="400" y="240" font-size="11" font-weight="bold" fill="#1a1a1a">C (D2) ← Bit 4</text>
  <text x="400" y="265" font-size="11" font-weight="bold" fill="#1a1a1a">D (D3) ← Bit 8</text>
  <text x="400" y="295" font-size="11" fill="#6b7280">E..H (D4..D7) [D2 декада]</text>

  <!-- Control & Output Pins (Right Side) -->
  <text x="590" y="190" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="end">Q7 (Data Out)</text>
  <text x="590" y="320" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="end">SH/LD (PL)</text>
  <text x="590" y="345" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="end">CLK (CP)</text>

  <!-- Panel 2 Summary Box -->
  <rect x="385" y="390" width="230" height="135" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="500" y="412" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Принцип згортання шин</text>
  <text x="500" y="432" font-size="12" fill="#1a1a1a" text-anchor="middle">SH/LD = 0: імпульсний запізний</text>
  <text x="500" y="450" font-size="12" fill="#1a1a1a" text-anchor="middle">захоплює 8-бітний BCD-код</text>
  <text x="500" y="472" font-size="12" fill="#1a1a1a" text-anchor="middle">CLK створює 8 імпульсів</text>
  <text x="500" y="490" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Послідовна передача по 1 лінії</text>
  <text x="500" y="510" font-size="11" fill="#6b7280" text-anchor="middle">Заощадження 13 виводів МК!</text>


  <!-- ==================== PANEL 3: MICROCONTROLLER MCU ==================== -->
  <rect x="660" y="65" width="270" height="475" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="795" y="88" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">3. Мікроконтролер (MCU)</text>
  <text x="795" y="105" font-size="11" fill="#6b7280" text-anchor="middle">Сканування та обробка BCD-устави</text>

  <!-- MCU Symbol Box -->
  <rect x="680" y="125" width="230" height="250" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
  <text x="795" y="150" font-size="15" font-weight="bold" fill="#27ae60" text-anchor="middle">STM32 / AVR MCU</text>
  <text x="795" y="166" font-size="11" fill="#6b7280" text-anchor="middle">Industrial Controller</text>

  <!-- MCU GPIO Pins -->
  <text x="690" y="190" font-size="11" font-weight="bold" fill="#27ae60">PB0 ← DATA (Q7)</text>
  <text x="690" y="250" font-size="11" font-weight="bold" fill="#c0392b">PA0..PA3 → SEL1..SEL4</text>
  <text x="690" y="320" font-size="11" font-weight="bold" fill="#2457d6">PB2 → SH/LD (PL)</text>
  <text x="690" y="345" font-size="11" font-weight="bold" fill="#2457d6">PB1 → CLK (CP)</text>

  <!-- Panel 3 Summary Box -->
  <rect x="675" y="390" width="240" height="135" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="795" y="412" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Програмний драйвер МК</text>
  <text x="795" y="432" font-size="12" fill="#1a1a1a" text-anchor="middle">1. Активація декади SEL_n = 0</text>
  <text x="795" y="450" font-size="12" fill="#1a1a1a" text-anchor="middle">2. Строб SH/LD = 0 → 1</text>
  <text x="795" y="472" font-size="12" fill="#1a1a1a" text-anchor="middle">3. Читання SPI / shiftIn()</text>
  <text x="795" y="490" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">4. Валідація: code &lt;= 9</text>
  <text x="795" y="510" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Повна завадозахищеність</text>


  <!-- ==================== SIGNAL INTERCONNECT WIRES ==================== -->
  <!-- 1. BCD Data Lines (Decades -> 74HC165 Inputs) -->
  <line x1="325" y1="160" x2="390" y2="190" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="325" y1="225" x2="390" y2="215" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="325" y1="290" x2="390" y2="240" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="325" y1="355" x2="390" y2="265" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- 2. Serial Data Out (74HC165 Q7 -> MCU PB0) -->
  <line x1="610" y1="190" x2="680" y2="190" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="645" y="180" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">DATA (Q7)</text>

  <!-- 3. Latch Control (MCU PB2 -> 74HC165 SH/LD) -->
  <line x1="680" y1="320" x2="610" y2="320" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="645" y="312" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">SH/LD</text>

  <!-- 4. Clock Line (MCU PB1 -> 74HC165 CLK) -->
  <line x1="680" y1="345" x2="610" y2="345" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="645" y="337" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">CLK</text>

  <!-- 5. Decade Strobe Line (MCU PA0..PA3 -> Left Decades) -->
  <path d="M 680,250 L 325,250" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <text x="350" y="242" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">SEL1..SEL4</text>
</svg>
