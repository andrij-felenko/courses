<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" width="960" height="490" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="490" fill="white"/>

  <defs>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Двоканальне коло аварійного стопу (2×NC) та принцип Fail-Safe</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Нормально замкнені контакти та примусове розмикання гарантують розрив живлення при збої</text>

  <!-- PANEL 1: NORMAL OPERATION -->
  <rect x="30" y="80" width="435" height="390" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <path d="M30,88 A8,8 0 0,1 38,80 L457,80 A8,8 0 0,1 465,88 L465,116 L30,116 Z" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="247.5" y="103" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">1. Нормальна робота (Струм протікає)</text>

  <!-- +24V Power Rail Panel 1 -->
  <line x1="50" y1="140" x2="445" y2="140" stroke="#27ae60" stroke-width="3"/>
  <text x="50" y="131" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">+24V DC</text>

  <!-- Channel 1 NC (Closed) -->
  <line x1="155" y1="140" x2="155" y2="165" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <circle cx="155" cy="170" r="4" fill="#27ae60"/>
  <!-- Closed Lever -->
  <line x1="155" y1="170" x2="155" y2="240" stroke="#27ae60" stroke-width="3.5"/>
  <circle cx="155" cy="240" r="4" fill="#27ae60"/>
  <line x1="155" y1="240" x2="155" y2="300" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="145" y="215" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">
    <tspan x="145" dy="0">NC1</tspan>
    <tspan x="145" dy="14">(Замкнено)</tspan>
  </text>

  <!-- Channel 2 NC (Closed) -->
  <line x1="340" y1="140" x2="340" y2="165" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <circle cx="340" cy="170" r="4" fill="#27ae60"/>
  <!-- Closed Lever -->
  <line x1="340" y1="170" x2="340" y2="240" stroke="#27ae60" stroke-width="3.5"/>
  <circle cx="340" cy="240" r="4" fill="#27ae60"/>
  <line x1="340" y1="240" x2="340" y2="300" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="350" y="215" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">
    <tspan x="350" dy="0">NC2</tspan>
    <tspan x="350" dy="14">(Замкнено)</tspan>
  </text>

  <!-- Mechanical Linkage -->
  <line x1="155" y1="190" x2="340" y2="190" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="247.5" y="183" font-size="11" fill="#6b7280" text-anchor="middle">Спільний вал кнопкового штовхача</text>

  <!-- Safety Relay Block Panel 1 -->
  <rect x="95" y="310" width="305" height="65" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="247.5" y="303" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Модуль реле безпеки (Safety Relay)</text>

  <!-- Relay Coil K1 -->
  <rect x="140" y="323" width="30" height="40" rx="2" fill="white" stroke="#27ae60" stroke-width="2"/>
  <text x="155" y="348" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">K1</text>
  <line x1="155" y1="363" x2="155" y2="410" stroke="#27ae60" stroke-width="2"/>

  <!-- Relay Coil K2 -->
  <rect x="325" y="323" width="30" height="40" rx="2" fill="white" stroke="#27ae60" stroke-width="2"/>
  <text x="340" y="348" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">K2</text>
  <line x1="340" y1="363" x2="340" y2="410" stroke="#27ae60" stroke-width="2"/>

  <!-- 0V GND Rail Panel 1 -->
  <line x1="50" y1="410" x2="445" y2="410" stroke="#27ae60" stroke-width="3"/>
  <text x="50" y="426" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">0V (GND)</text>

  <!-- Status Badge Panel 1 -->
  <rect x="85" y="438" width="325" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="247.5" y="455" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Струм є → Силовий каскад підключено</text>


  <!-- PANEL 2: EMERGENCY TRIP / FAIL-SAFE -->
  <rect x="495" y="80" width="435" height="390" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <path d="M495,88 A8,8 0 0,1 503,80 L922,80 A8,8 0 0,1 930,88 L930,116 L495,116 Z" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="712.5" y="103" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">2. Натиск / Обрив (Fail-Safe зупинка)</text>

  <!-- +24V Power Rail Panel 2 -->
  <line x1="515" y1="140" x2="910" y2="140" stroke="#c0392b" stroke-width="3"/>
  <text x="515" y="131" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">+24V DC</text>

  <!-- Mushroom Cap Icon -->
  <path d="M692.5,152 C692.5,137 732.5,137 732.5,152 Z" fill="#c0392b"/>
  <rect x="707.5" y="152" width="10" height="18" fill="#6b7280"/>
  <line x1="712.5" y1="170" x2="712.5" y2="188" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="712.5" y="130" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Натиск E-Stop</text>

  <!-- Channel 1 NC (Opened by Mechanical Force) -->
  <line x1="620" y1="140" x2="620" y2="170" stroke="#c0392b" stroke-width="2"/>
  <circle cx="620" cy="170" r="4" fill="#c0392b"/>
  <!-- Open Lever -->
  <line x1="620" y1="240" x2="597" y2="178" stroke="#c0392b" stroke-width="3.5"/>
  <circle cx="620" cy="240" r="4" fill="#c0392b"/>
  <!-- Dashed line (no current) -->
  <line x1="620" y1="240" x2="620" y2="300" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="585" y="215" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">
    <tspan x="585" dy="0">NC1</tspan>
    <tspan x="585" dy="14">(Розмкнено)</tspan>
  </text>

  <!-- Channel 2 NC (Opened / Wire Break) -->
  <line x1="805" y1="140" x2="805" y2="155" stroke="#c0392b" stroke-width="2"/>
  <!-- Wire Break Symbol (X) -->
  <line x1="799" y1="155" x2="811" y2="167" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="811" y1="155" x2="799" y2="167" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="805" y1="167" x2="805" y2="170" stroke="#c0392b" stroke-width="2" stroke-dasharray="3,3"/>
  <circle cx="805" cy="170" r="4" fill="#c0392b"/>
  <!-- Open Lever -->
  <line x1="805" y1="240" x2="782" y2="178" stroke="#c0392b" stroke-width="3.5"/>
  <circle cx="805" cy="240" r="4" fill="#c0392b"/>
  <line x1="805" y1="240" x2="805" y2="300" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="818" y="215" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">
    <tspan x="818" dy="0">NC2</tspan>
    <tspan x="818" dy="14">(Обрив кола)</tspan>
  </text>

  <!-- Mechanical Linkage Panel 2 -->
  <line x1="620" y1="190" x2="805" y2="190" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Safety Relay Block Panel 2 -->
  <rect x="560" y="310" width="305" height="65" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="712.5" y="303" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Модуль реле безпеки (Знеструмлено)</text>

  <!-- Relay Coil K1 (De-energized) -->
  <rect x="605" y="323" width="30" height="40" rx="2" fill="white" stroke="#c0392b" stroke-width="2"/>
  <text x="620" y="348" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">K1</text>
  <line x1="620" y1="363" x2="620" y2="410" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Relay Coil K2 (De-energized) -->
  <rect x="790" y="323" width="30" height="40" rx="2" fill="white" stroke="#c0392b" stroke-width="2"/>
  <text x="805" y="348" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">K2</text>
  <line x1="805" y1="363" x2="805" y2="410" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- 0V GND Rail Panel 2 -->
  <line x1="515" y1="410" x2="910" y2="410" stroke="#c0392b" stroke-width="3"/>
  <text x="515" y="426" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">0V (GND)</text>

  <!-- Status Badge Panel 2 -->
  <rect x="550" y="438" width="325" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="712.5" y="455" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Струм відсутній → Силовий каскад знеструмлено</text>
</svg>
