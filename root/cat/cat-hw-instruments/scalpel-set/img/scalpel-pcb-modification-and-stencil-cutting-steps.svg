<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Markers -->
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Доробка друкованої плати скальпельними лезами №11 та №16</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Технологія перерізання мідної доріжки подвійним надрізом та знімання паяльної маски</text>

  <!-- Step 1 Panel: Cutting Copper Trace with #11 Blade -->
  <rect x="40" y="80" width="420" height="375" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="60" y="108" font-size="15" font-weight="bold" fill="#2457d6">Крок 1. Перерізання доріжки (Лезо №11)</text>
  <text x="60" y="126" font-size="12" fill="#6b7280">Подвійний V-подібний надріз з вилученням сегмента</text>

  <!-- Step 1 Diagram Content -->
  <!-- FR-4 Substrate -->
  <rect x="65" y="280" width="370" height="40" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="3"/>
  <text x="250" y="305" font-size="12" fill="#27ae60" text-anchor="middle">Склотекстоліт FR-4</text>

  <!-- Copper Trace Left and Right -->
  <rect x="65" y="270" width="140" height="10" fill="#c0392b" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="235" y="270" width="200" height="10" fill="#c0392b" stroke="#1a1a1a" stroke-width="1"/>
  <text x="75" y="258" font-size="12" font-weight="bold" fill="#c0392b">Мідна фольга (35 мкм)</text>

  <!-- Removed Segment Indicator Gap -->
  <line x1="205" y1="270" x2="205" y2="280" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="235" y1="270" x2="235" y2="280" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Scalpel Blade #11 Body -->
  <polygon points="205,270 155,175 205,165 225,225" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="205" y1="270" x2="205" y2="165" stroke="#d0d7de" stroke-width="1"/>

  <!-- Cutting Force Arrow -->
  <line x1="240" y1="175" x2="215" y2="245" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="250" y="195" font-size="12" font-weight="bold" fill="#2457d6">F_надрізу</text>

  <!-- Attack Angle Arc for #11 Blade -->
  <path d="M 170,270 A 35,35 0 0,1 180,245" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <text x="110" y="240" font-size="12" font-weight="bold" fill="#2457d6">α = 35°–45°</text>

  <!-- Step 1 Bullet Points -->
  <text x="60" y="365" font-size="12" fill="#1a1a1a">• Виконується 2 надрізи на відстані 0.3–0.5 мм.</text>
  <text x="60" y="388" font-size="12" fill="#1a1a1a">• Кут нахилу леза 35°–45° дає чіткий контроль глибини.</text>
  <text x="60" y="411" font-size="12" fill="#1a1a1a">• Вилучення мідного сегмента запобігає замиканню.</text>


  <!-- Step 2 Panel: Removing Solder Mask with #16 Blade -->
  <rect x="500" y="80" width="420" height="375" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="520" y="108" font-size="15" font-weight="bold" fill="#27ae60">Крок 2. Знімання маски (Лезо №16)</text>
  <text x="520" y="126" font-size="12" fill="#6b7280">Пошарове вискрібання для відкриття майданчика</text>

  <!-- Step 2 Diagram Content -->
  <!-- FR-4 Substrate -->
  <rect x="525" y="280" width="370" height="40" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="3"/>
  <text x="710" y="305" font-size="12" fill="#27ae60" text-anchor="middle">Склотекстоліт FR-4</text>

  <!-- Base Copper Foil Under Mask -->
  <rect x="525" y="270" width="370" height="10" fill="#c0392b" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Exposed Copper Pad (Scraped Region) -->
  <rect x="670" y="270" width="80" height="10" fill="#f39c12" stroke="#1a1a1a" stroke-width="1"/>
  <text x="710" y="248" font-size="12" font-weight="bold" fill="#d35400" text-anchor="middle">Відкрита мідь під допайку</text>

  <!-- Solder Mask Layer Left and Right -->
  <rect x="525" y="265" width="145" height="5" fill="#27ae60"/>
  <rect x="750" y="265" width="145" height="5" fill="#27ae60"/>
  <text x="525" y="230" font-size="12" fill="#27ae60">Паяльна маска</text>

  <!-- Scalpel Blade #16 (Chisel / Curved Scraper) Body -->
  <polygon points="670,265 590,235 605,210 685,245" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Scraping Motion Arrow -->
  <line x1="610" y1="205" x2="655" y2="227" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="615" y="190" font-size="12" font-weight="bold" fill="#27ae60">Рух вискрібання</text>

  <!-- Low Angle Arc for #16 Blade -->
  <path d="M 625,265 A 45,45 0 0,1 633,251" fill="none" stroke="#27ae60" stroke-width="1.5"/>
  <text x="525" y="260" font-size="12" font-weight="bold" fill="#27ae60">θ = 15°–20°</text>

  <!-- Step 2 Bullet Points -->
  <text x="520" y="365" font-size="12" fill="#1a1a1a">• Лезо №16 тримають під малим кутом (15°–20°).</text>
  <text x="520" y="388" font-size="12" fill="#1a1a1a">• Плоский вигнутий край знімає маску без зарізання в мідь.</text>
  <text x="520" y="411" font-size="12" fill="#1a1a1a">• Сформований майданчик зачищають під підпайку дроту.</text>
</svg>
