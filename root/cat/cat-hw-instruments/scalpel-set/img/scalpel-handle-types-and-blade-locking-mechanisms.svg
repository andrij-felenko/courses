<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="520" fill="white"/>
  
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Будова цангового затискача та хірургічного замка кріплення лез</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Принцип дії цанги макетного ножа (X-Acto) та рейкового фіксатора хірургічної державки (Bard-Parker)</text>

  <!-- ЛІВА ПАНЕЛЬ: ЦАНГОВИЙ ЗАТИСКАЧ -->
  <rect x="30" y="75" width="435" height="415" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">1. Цанговий затискач макетного скальпеля (X-Acto)</text>
  <text x="247" y="116" text-anchor="middle" font-size="12" fill="#6b7280">Радіальне стиснення пелюсток при нагвинчуванні гайки</text>

  <!-- Списочні елементи лівої панелі -->
  <text x="50" y="146" font-size="12" fill="#1a1a1a">• Рукоятка з внутрішнім нарізним каналом</text>
  <text x="50" y="166" font-size="12" fill="#1a1a1a">• 4-пелюсткова розрізна конічна цанга</text>
  <text x="50" y="186" font-size="12" fill="#1a1a1a">• Затискна гайка з конічним внутрішнім фасетом</text>
  <text x="50" y="206" font-size="12" fill="#1a1a1a">• Плоский хвостовик леза в хрестоподібному пазу</text>

  <!-- Схема цанги -->
  <!-- Рукоятка -->
  <rect x="50" y="260" width="110" height="40" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="105" y="284" text-anchor="middle" font-size="12" fill="#475569">Рукоятка</text>

  <!-- Конічна цанга -->
  <path d="M160,265 L220,255 L250,265 L250,295 L220,305 L160,295 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="160" y1="280" x2="250" y2="280" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="205" y="243" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Цанга</text>
  <line x1="205" y1="247" x2="205" y2="265" stroke="#2457d6" stroke-width="1" marker-end="url(#arr-blue)"/>

  <!-- Затискна гайка -->
  <rect x="230" y="248" width="60" height="64" rx="4" fill="#d9e2ec" stroke="#2457d6" stroke-width="2"/>
  <line x1="245" y1="248" x2="245" y2="312" stroke="#9fb3c8" stroke-width="1.5"/>
  <line x1="260" y1="248" x2="260" y2="312" stroke="#9fb3c8" stroke-width="1.5"/>
  <line x1="275" y1="248" x2="275" y2="312" stroke="#9fb3c8" stroke-width="1.5"/>
  <text x="260" y="332" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Гайка</text>

  <!-- Лезо №11 -->
  <polygon points="230,277 390,277 280,240" fill="#cbd5e1" stroke="#1e293b" stroke-width="1.5"/>
  <text x="340" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Лезо №11</text>

  <!-- Стрілки зусиль стиснення -->
  <line x1="225" y1="235" x2="225" y2="253" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-dark)"/>
  <line x1="225" y1="325" x2="225" y2="307" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-dark)"/>
  <text x="170" y="332" font-size="12" font-weight="bold" fill="#c0392b">Стиск</text>

  <!-- Описовий блок лівої панелі -->
  <rect x="50" y="360" width="395" height="110" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="65" y="382" font-size="12" font-weight="bold" fill="#2457d6">Механіка цангового затискача:</text>
  <text x="65" y="404" font-size="12" fill="#1a1a1a">1. Хвостовик леза вставляється в хрестоподібний паз цанги.</text>
  <text x="65" y="424" font-size="12" fill="#1a1a1a">2. Обертання гайки зсуває її вздовж зовнішнього конуса цанги.</text>
  <text x="65" y="444" font-size="12" fill="#1a1a1a">3. Конус гайки стискає пелюстки цанги, надійно зажимаючи хвостовик.</text>


  <!-- ПРАВА ПАНЕЛЬ: ХІРУРГІЧНИЙ ЗАМОК BARD-PARKER -->
  <rect x="495" y="75" width="435" height="415" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="712" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">2. Рейковий замок хірургічної державки (Bard-Parker)</text>
  <text x="712" y="116" text-anchor="middle" font-size="12" fill="#6b7280">Замикання фасонного отвору леза на направляючій рейці</text>

  <!-- Списочні елементи правої панелі -->
  <text x="515" y="146" font-size="12" fill="#1a1a1a">• Замкова головка з фасонною направляючою рейкою</text>
  <text x="515" y="166" font-size="12" fill="#1a1a1a">• Скошений уступ-засувка для фіксації основи леза</text>
  <text x="515" y="186" font-size="12" fill="#1a1a1a">• Стандартизований замковий отвір у хвостовику леза</text>
  <text x="515" y="206" font-size="12" fill="#1a1a1a">• Замикання зі звуковим клацанням (snap-fit)</text>

  <!-- Схема замка Bard-Parker -->
  <!-- Хірургічна рукоятка (головка замка) -->
  <path d="M515,280 L620,280 L640,270 L720,270 L720,285 L640,285 L620,295 L515,295 Z" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <!-- Рейка фіксатора -->
  <path d="M640,270 L700,270 L710,276 L640,276 Z" fill="#2457d6" stroke="#1d4ed8" stroke-width="1"/>
  <text x="570" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">Рукоятка №3</text>
  <text x="675" y="255" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Замкова рейка</text>
  <line x1="675" y1="259" x2="675" y2="268" stroke="#2457d6" stroke-width="1" marker-end="url(#arr-blue)"/>

  <!-- Лезо зі скошеним отвором -->
  <path d="M710,265 L870,265 L760,230 L710,240 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <!-- Отвір у лезі -->
  <path d="M725,252 L780,252 L770,258 L725,258 Z" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="800" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Лезо №10/11</text>

  <!-- Стрілка насування леза -->
  <line x1="770" y1="290" x2="710" y2="290" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-dark)"/>
  <text x="740" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Насування назад</text>

  <!-- Описовий блок правої панелі -->
  <rect x="515" y="360" width="395" height="110" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="530" y="382" font-size="12" font-weight="bold" fill="#2457d6">Посадкові стандарти та знімання:</text>
  <text x="530" y="404" font-size="12" fill="#1a1a1a">• Замок №3 (вузький 4 мм): сумісний із лезами №10, 11, 12, 15.</text>
  <text x="530" y="424" font-size="12" fill="#1a1a1a">• Замок №4 (широкий 6 мм): сумісний із лезами №20, 21, 22, 24.</text>
  <text x="530" y="444" font-size="12" fill="#1a1a1a">• Знімання: підняття основи гемостатом та зсув леза вперед.</text>
</svg>
