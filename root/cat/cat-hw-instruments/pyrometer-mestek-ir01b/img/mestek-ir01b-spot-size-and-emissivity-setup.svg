<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,4 L0,8 Z" fill="#64748b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка полотна -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Оптична роздільність D:S = 12:1 та коефіцієнти емісії ε компонентів плати</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Залежність діаметра вимірювальної плями S від відстані D та значення ε для матеріалів електронного блоку</text>

  <!-- ЛІВА ПАНЕЛЬ: ОПТИЧНА РОЗДІЛЬНІСТЬ D:S -->
  <rect x="25" y="80" width="465" height="455" rx="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="40" y="105" font-size="14" font-weight="bold" fill="#2457d6">1. Пляма вимірювання S залежно від відстані D</text>

  <!-- Світловий конус пірометра -->
  <polygon points="98,260 465,150 465,370" fill="#eaf0fd" fill-opacity="0.7" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="98" y1="260" x2="475" y2="260" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Корпус пірометра -->
  <rect x="40" y="225" width="50" height="70" rx="6" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="90" y="245" width="8" height="30" rx="2" fill="#38bdf8"/>
  <text x="65" y="264" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">IR01B</text>

  <!-- Контрольні точки відстані та плями -->
  <!-- D1 = 300 мм -->
  <line x1="220" y1="130" x2="220" y2="390" stroke="#94a3b8" stroke-dasharray="2,2"/>
  <ellipse cx="220" cy="260" rx="5" ry="18" fill="none" stroke="#2457d6" stroke-width="2"/>
  <text x="220" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Ø S₁ = 25 мм</text>
  <text x="220" y="405" text-anchor="middle" font-size="12" fill="#1a1a1a">D₁ = 300 мм</text>

  <!-- D2 = 600 мм -->
  <line x1="340" y1="130" x2="340" y2="390" stroke="#94a3b8" stroke-dasharray="2,2"/>
  <ellipse cx="340" cy="260" rx="7" ry="36" fill="none" stroke="#2457d6" stroke-width="2"/>
  <text x="340" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Ø S₂ = 50 мм</text>
  <text x="340" y="405" text-anchor="middle" font-size="12" fill="#1a1a1a">D₂ = 600 мм</text>

  <!-- D3 = 900 мм -->
  <line x1="460" y1="130" x2="460" y2="390" stroke="#94a3b8" stroke-dasharray="2,2"/>
  <ellipse cx="460" cy="260" rx="9" ry="54" fill="none" stroke="#2457d6" stroke-width="2"/>
  <text x="460" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Ø S₃ = 75 мм</text>
  <text x="460" y="405" text-anchor="middle" font-size="12" fill="#1a1a1a">D₃ = 900 мм</text>

  <!-- Блок правил та формули у лівій панелі -->
  <rect x="40" y="425" width="435" height="95" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="445" font-size="13" font-weight="bold" fill="#c0392b">Важливе правило запобігання похибкам:</text>
  <text x="50" y="465" font-size="12" fill="#1a1a1a">• Пляма S має повністю перекривати поверхню деталі.</text>
  <text x="50" y="483" font-size="12" fill="#1a1a1a">• Якщо S &gt; деталь — вимір усередниться з тлом плати!</text>
  <text x="50" y="503" font-size="12" font-weight="bold" fill="#2457d6">• Формула оптичного відношення: S = D / 12</text>

  <!-- ПРАВА ПАНЕЛЬ: ТАБЛИЦЯ ТА НАЛАШТУВАННЯ EPSILON -->
  <rect x="510" y="80" width="425" height="455" rx="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="525" y="105" font-size="14" font-weight="bold" fill="#27ae60">2. Таблиця коефіцієнтів емісії ε компонентів плати</text>

  <!-- Заголовок таблиці -->
  <rect x="525" y="120" width="395" height="28" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="535" y="139" font-size="12" font-weight="bold" fill="#1a1a1a">Матеріал / Компонент</text>
  <text x="755" y="139" font-size="12" font-weight="bold" fill="#1a1a1a">Типова ε</text>
  <text x="830" y="139" font-size="12" font-weight="bold" fill="#1a1a1a">Рекомендація</text>

  <!-- Рядок 1 -->
  <rect x="525" y="148" width="395" height="34" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="535" y="169" font-size="12" fill="#1a1a1a">Пластиковий корпус МС (DIP/SOP)</text>
  <text x="755" y="169" font-size="12" font-weight="bold" fill="#27ae60">0.90 – 0.95</text>
  <text x="830" y="169" font-size="12" fill="#1a1a1a">Прямий вимір</text>

  <!-- Рядок 2 -->
  <rect x="525" y="182" width="395" height="34" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="535" y="203" font-size="12" fill="#1a1a1a">Зелена паяльна маска FR-4</text>
  <text x="755" y="203" font-size="12" font-weight="bold" fill="#27ae60">0.88 – 0.92</text>
  <text x="830" y="203" font-size="12" fill="#1a1a1a">Прямий вимір</text>

  <!-- Рядок 3 -->
  <rect x="525" y="216" width="395" height="34" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="535" y="237" font-size="12" fill="#1a1a1a">Анодований алюм. (радіатор)</text>
  <text x="755" y="237" font-size="12" font-weight="bold" fill="#27ae60">0.77 – 0.85</text>
  <text x="830" y="237" font-size="12" fill="#1a1a1a">Калібрування</text>

  <!-- Рядок 4 -->
  <rect x="525" y="250" width="395" height="34" fill="#fdecea" stroke="#fca5a5"/>
  <text x="535" y="271" font-size="12" font-weight="bold" fill="#c0392b">Оголена полірована мідь</text>
  <text x="755" y="271" font-size="12" font-weight="bold" fill="#c0392b">0.03 – 0.07</text>
  <text x="830" y="271" font-size="12" font-weight="bold" fill="#c0392b">Низька ε!</text>

  <!-- Рядок 5 -->
  <rect x="525" y="284" width="395" height="34" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="535" y="305" font-size="12" fill="#1a1a1a">Чистий алюміній / припій</text>
  <text x="755" y="305" font-size="12" font-weight="bold" fill="#c0392b">0.05 – 0.15</text>
  <text x="830" y="305" font-size="12" fill="#1a1a1a">Чорна стрічка</text>

  <!-- Рядок 6 -->
  <rect x="525" y="318" width="395" height="34" fill="#eaf0fd" stroke="#bfdbfe"/>
  <text x="535" y="339" font-size="12" font-weight="bold" fill="#2457d6">Матова чорна стрічка (еталон)</text>
  <text x="755" y="339" font-size="12" font-weight="bold" fill="#2457d6">0.95</text>
  <text x="830" y="339" font-size="12" font-weight="bold" fill="#2457d6">Еталон для ε</text>

  <!-- Практичні вказівки у правій панелі -->
  <rect x="525" y="365" width="395" height="155" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="535" y="387" font-size="13" font-weight="bold" fill="#2457d6">Методика вимірювання дзеркальних металів:</text>
  <text x="535" y="407" font-size="12" fill="#1a1a1a">1. Наклеїти чорну матову стрічку (ε = 0.95) на деталь.</text>
  <text x="535" y="425" font-size="12" fill="#1a1a1a">2. Або виміряти еталон контактною термопарою K-типу.</text>
  <text x="535" y="443" font-size="12" fill="#1a1a1a">3. Налаштувати ε в меню MESTEK IR01B до збігу показів.</text>
  <text x="535" y="461" font-size="12" fill="#1a1a1a">4. Для пластику й паяльної маски встановити ε = 0.95.</text>
  <text x="535" y="482" font-size="11" fill="#6b7280">Збереження налаштувань ε виконується в меню кнопкою Mode.</text>
</svg>
