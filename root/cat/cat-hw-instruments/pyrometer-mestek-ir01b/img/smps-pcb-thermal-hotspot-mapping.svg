<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Тепловий моніторинг силової плати БЖ пірометром MESTEK IR01B</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Геометрія плями D:S = 12:1 та карта нормальних і критичних зон MOSFET, діода й трансформатора</text>

  <!-- LEFT PANEL: Measurement Geometry -->
  <rect x="24" y="65" width="440" height="455" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="24" y="65" width="440" height="36" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="244" y="88" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Геометрія вимірювання та пляма D:S = 12:1</text>

  <!-- Pyrometer Graphic -->
  <path d="M 50 170 L 130 170 L 140 230 L 110 310 L 70 310 L 95 240 L 50 200 Z" fill="#34495e" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="58" y="175" width="42" height="22" rx="3" fill="#1a1a1a" stroke="#2457d6" stroke-width="1"/>
  <text x="79" y="190" font-size="12" fill="#27ae60" font-weight="bold" text-anchor="middle">78.5 °C</text>
  <path d="M 95 210 L 105 210 L 105 225 L 95 225 Z" fill="#c0392b"/>
  <rect x="130" y="170" width="20" height="40" rx="3" fill="#2c3e50" stroke="#1a1a1a"/>

  <!-- Optical Cone & Laser Pointer Lines -->
  <line x1="150" y1="180" x2="380" y2="148" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="150" y1="200" x2="380" y2="232" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="150" y1="190" x2="380" y2="190" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- PCB & Target Component -->
  <rect x="380" y="125" width="12" height="130" rx="2" fill="#27ae60" stroke="#1e8449" stroke-width="1.5"/>
  <rect x="365" y="165" width="15" height="50" rx="2" fill="#2c3e50" stroke="#1a1a1a" stroke-width="1.5"/>
  <ellipse cx="380" cy="190" rx="4" ry="42" fill="#fdecea" stroke="#c0392b" stroke-width="2" stroke-dasharray="3,3" opacity="0.9"/>

  <!-- Distance D Dimension Arrow -->
  <line x1="150" y1="262" x2="380" y2="262" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-dark)" marker-end="url(#arr-dark)"/>
  <text x="265" y="255" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Відстань D = 300 мм</text>

  <!-- Spot Size S Dimension Arrow -->
  <line x1="404" y1="148" x2="404" y2="232" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-red)" marker-end="url(#arr-red)"/>
  <text x="414" y="194" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">S = 25 мм</text>

  <!-- Rule & Calculation Box -->
  <rect x="40" y="285" width="408" height="220" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="244" y="308" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розрахунок оптичного розрізнення D:S = 12:1</text>
  <rect x="56" y="320" width="376" height="38" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="244" y="344" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">S = D / 12 = 300 мм / 12 = 25 мм</text>

  <text x="64" y="380" font-size="12" fill="#1a1a1a">• Пляма S (25 мм) має повністю перекривати компонент</text>
  <text x="64" y="402" font-size="12" fill="#c0392b">• Якщо S > S_деталі, пірометр усереднює T з тлом плати</text>
  <text x="64" y="424" font-size="12" fill="#27ae60">• Для дрібних деталей (SMD): зменшувати відстань D</text>
  <text x="64" y="446" font-size="12" fill="#1a1a1a">• Лазерне кільце MESTEK показує точні межі плями S</text>
  <text x="64" y="468" font-size="12" fill="#6b7280">• Час відгуку τ ≤ 500 мс для фіксації динамічного нагріву</text>

  <!-- RIGHT PANEL: Component Thermal Map -->
  <rect x="496" y="65" width="440" height="455" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="496" y="65" width="440" height="36" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="716" y="88" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">2. Карта температурних зон силових компонентів (SMPS)</text>

  <!-- Card 1: MOSFET (Critical Overheat) -->
  <rect x="512" y="112" width="408" height="92" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="524" y="122" width="80" height="24" rx="4" fill="#c0392b"/>
  <text x="564" y="138" font-size="12" font-weight="bold" fill="white" text-anchor="middle">MOSFET</text>
  <text x="614" y="138" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="start">Критичний перегрів: T = 115 °C</text>
  <text x="830" y="138" font-size="12" fill="#6b7280" text-anchor="start">(HAL = 100 °C)</text>
  <text x="524" y="162" font-size="12" fill="#1a1a1a">• Емісивність пластикового корпусу: ε = 0.95 (налаштовано)</text>
  <text x="524" y="182" font-size="12" fill="#c0392b">• Причина: деградація термопасти радіатора / перевантаження</text>

  <!-- Card 2: Output Diode (Normal Operating Temp) -->
  <rect x="512" y="214" width="408" height="92" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="524" y="224" width="80" height="24" rx="4" fill="#27ae60"/>
  <text x="564" y="240" font-size="12" font-weight="bold" fill="white" text-anchor="middle">ДІОД ШОТТКІ</text>
  <text x="614" y="240" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="start">Робочий нагрів: T = 68 °C</text>
  <text x="815" y="240" font-size="12" fill="#6b7280" text-anchor="start">(Запас до 100 °C)</text>
  <text x="524" y="264" font-size="12" fill="#1a1a1a">• Корпус TO-247, виміряно при ε = 0.95 безпосередньо</text>
  <text x="524" y="284" font-size="12" fill="#27ae60">• Тепловий режим стабільний, радіатор розсіює тепло</text>

  <!-- Card 3: Transformer (Normal State) -->
  <rect x="512" y="316" width="408" height="92" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="524" y="326" width="80" height="24" rx="4" fill="#27ae60"/>
  <text x="564" y="342" font-size="12" font-weight="bold" fill="white" text-anchor="middle">ДРОСЕЛЬ / ТР</text>
  <text x="614" y="342" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="start">Нормальний стан: T = 52 °C</text>
  <text x="815" y="342" font-size="12" fill="#6b7280" text-anchor="start">(Запас до 85 °C)</text>
  <text x="524" y="366" font-size="12" fill="#1a1a1a">• Ферритове осердя (ε = 0.92), рівномірне розсіювання</text>
  <text x="524" y="386" font-size="12" fill="#27ae60">• Міжвиткове коротке замикання та перегрів відсутні</text>

  <!-- Card 4: Radiator / Bare Copper (Emissivity Warning & Solution) -->
  <rect x="512" y="418" width="408" height="92" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="524" y="428" width="80" height="24" rx="4" fill="#2457d6"/>
  <text x="564" y="444" font-size="12" font-weight="bold" fill="white" text-anchor="middle">РАДІАТОР / МІДЬ</text>
  <text x="614" y="444" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="start">Низька емісивність: ε ≈ 0.05..0.20</text>
  <text x="524" y="468" font-size="12" fill="#c0392b">• Без калібрування пірометр покаже відбите фонове T!</text>
  <text x="524" y="488" font-size="12" fill="#2457d6">• Рішення: наклеїти чорну стрічку (ε ≈ 0.95) або термопару K</text>
</svg>
