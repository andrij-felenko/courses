<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-blue-rev" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма апаратної синхронізації (Hardware Trigger)</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Узгодження фронту тригера TTL, затримки t_delay, вікна експозиції t_exp та імпульсу лазера</text>

  <!-- Main Container -->
  <rect x="40" y="72" width="880" height="358" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Vertical Timing Projections -->
  <line x1="380" y1="115" x2="380" y2="395" stroke="#a0aec0" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="500" y1="180" x2="500" y2="395" stroke="#a0aec0" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="780" y1="255" x2="780" y2="395" stroke="#a0aec0" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Channel 1: Trigger -->
  <text x="60" y="125" font-size="13" font-weight="bold" fill="#1a1a1a">1. Тригерний сигнал TTL</text>
  <text x="60" y="142" font-size="12" fill="#6b7280">(External Trigger Input)</text>
  
  <text x="380" y="94" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Фронт тригера</text>
  <path d="M 310,150 L 380,150 L 380,110 L 520,110 L 520,150 L 880,150" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="380" cy="110" r="4" fill="#2457d6"/>

  <!-- Channel 2: Trigger Delay -->
  <text x="60" y="200" font-size="13" font-weight="bold" fill="#1a1a1a">2. Затримка тригера</text>
  <text x="60" y="217" font-size="12" fill="#6b7280">(Trigger Delay, t_delay)</text>

  <rect x="380" y="175" width="120" height="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="440" y="196" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">t_delay</text>
  <line x1="388" y1="212" x2="492" y2="212" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue-rev)" marker-end="url(#arr-blue)"/>
  <path d="M 310,225 L 380,225 L 380,175 L 500,175 L 500,225 L 880,225" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Channel 3: Exposure Window -->
  <text x="60" y="275" font-size="13" font-weight="bold" fill="#1a1a1a">3. Експозиція сенсора</text>
  <text x="60" y="292" font-size="12" fill="#6b7280">(Sensor Exposure, t_exp)</text>

  <rect x="500" y="250" width="280" height="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="640" y="271" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вікно витримки t_exp</text>
  <line x1="508" y1="287" x2="772" y2="287" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue-rev)" marker-end="url(#arr-blue)"/>
  <path d="M 310,300 L 500,300 L 500,250 L 780,250 L 780,300 L 880,300" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Channel 4: Laser Pulse -->
  <text x="60" y="350" font-size="13" font-weight="bold" fill="#1a1a1a">4. Лазерний спалах</text>
  <text x="60" y="367" font-size="12" fill="#6b7280">(Laser Pulse Event)</text>

  <rect x="570" y="330" width="100" height="45" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="620" y="357" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Спалах лазера</text>
  <path d="M 310,375 L 570,375 L 570,330 L 670,330 L 670,375 L 880,375" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Time Axis Bottom -->
  <line x1="310" y1="395" x2="875" y2="395" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="885" y="399" font-size="12" font-weight="bold" fill="#1a1a1a">t</text>
  
  <text x="380" y="416" font-size="12" fill="#1a1a1a" text-anchor="middle">t₀ (Тригер)</text>
  <text x="500" y="416" font-size="12" fill="#1a1a1a" text-anchor="middle">t₁ (Старт t_exp)</text>
  <text x="780" y="416" font-size="12" fill="#1a1a1a" text-anchor="middle">t₂ (Стоп t_exp)</text>
</svg>
