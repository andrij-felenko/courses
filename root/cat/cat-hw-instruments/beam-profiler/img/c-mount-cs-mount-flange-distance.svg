<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-blue-start" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-dark-start" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-red-start" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Main Header -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Геометричне порівняння кріплень C-mount / CS-mount та установка атенюатора</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">C-mount має робочий відрізок 17.526 мм, CS-mount — 12.526 мм. Різниця 5.00 мм дає простір для кільця-адаптера чи атенюатора</text>

  <!-- Panel 1 (Left): Geometry & Flange Focal Distance -->
  <rect x="30" y="70" width="435" height="445" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="247.5" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Геометрія кріплень і робочі відрізки (FFD)</text>

  <!-- Card 1A: C-mount -->
  <rect x="50" y="110" width="395" height="175" fill="white" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="65" y="130" font-size="13" font-weight="bold" fill="#1a1a1a">C-mount (Flange Focal Distance = 17.526 мм)</text>

  <!-- C-mount Mechanical Lines -->
  <line x1="120" y1="155" x2="120" y2="250" stroke="#2457d6" stroke-width="2"/>
  <text x="120" y="145" text-anchor="middle" font-size="11" fill="#2457d6">Площина фланця</text>

  <line x1="370" y1="155" x2="370" y2="250" stroke="#27ae60" stroke-width="2"/>
  <rect x="370" y="175" width="12" height="60" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="2"/>
  <text x="370" y="145" text-anchor="middle" font-size="11" fill="#27ae60">Площина сенсора</text>

  <!-- Thread label placed safely beside flange line without intersecting lines -->
  <text x="135" y="175" font-size="11" fill="#6b7280">Різьба 1"-32 UN</text>

  <!-- Dimension line C-mount FFD -->
  <line x1="120" y1="210" x2="370" y2="210" stroke="#2457d6" stroke-width="2" marker-start="url(#arr-blue-start)" marker-end="url(#arr-blue)"/>
  <rect x="200" y="194" width="90" height="16" fill="white" opacity="0.9"/>
  <text x="245" y="206" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">17.526 мм</text>

  <text x="245" y="265" text-anchor="middle" font-size="11" fill="#6b7280">Стандартний робочий відрізок C-mount</text>

  <!-- Card 1B: CS-mount with 5 mm Adapter -->
  <rect x="50" y="300" width="395" height="195" fill="white" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="65" y="320" font-size="13" font-weight="bold" fill="#1a1a1a">CS-mount (FFD = 12.526 мм) + 5.00 мм адаптер</text>

  <!-- CS-mount Mechanical Lines -->
  <line x1="120" y1="345" x2="120" y2="425" stroke="#2457d6" stroke-width="2"/>
  <line x1="191" y1="345" x2="191" y2="425" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="370" y1="345" x2="370" y2="425" stroke="#27ae60" stroke-width="2"/>
  <rect x="370" y="355" width="12" height="60" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="2"/>

  <!-- 5 mm Adapter Ring -->
  <rect x="120" y="355" width="71" height="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="3"/>
  <text x="155.5" y="377" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Адаптер</text>
  <text x="155.5" y="393" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">5 мм</text>

  <!-- CS FFD dimension line -->
  <line x1="191" y1="375" x2="370" y2="375" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-dark-start)" marker-end="url(#arr-dark)"/>
  <rect x="225" y="360" width="110" height="15" fill="white" opacity="0.9"/>
  <text x="280.5" y="372" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">12.526 мм (CS-mount)</text>

  <!-- Difference dimension line (5.00 mm) -->
  <line x1="120" y1="435" x2="191" y2="435" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-red-start)" marker-end="url(#arr-red)"/>
  <text x="155.5" y="455" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Δ = 5 мм</text>

  <text x="247.5" y="482" text-anchor="middle" font-size="11" fill="#6b7280">Завдяки +5 мм C-об'єктив підходить до CS-камери</text>

  <!-- Panel 2 (Right): Attenuator Mount & Optical Scheme -->
  <rect x="495" y="70" width="435" height="445" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="712.5" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Схема монтажу оптичного атенюатора</text>

  <!-- Card 2A: Beam & Filter Alignment -->
  <rect x="515" y="110" width="395" height="220" fill="white" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="530" y="130" font-size="13" font-weight="bold" fill="#1a1a1a">Розміщення нейтрального світлофільтра (ND)</text>

  <!-- Incoming Beam (High power) -->
  <polygon points="525,190 605,200 605,220 525,230" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="565" y="178" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">Висока потужність</text>
  <text x="565" y="248" text-anchor="middle" font-size="10" fill="#c0392b">P_in &gt; P_max</text>

  <!-- Filter Housing & Glass -->
  <text x="635" y="152" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">ND Атенюатор</text>
  <rect x="615" y="165" width="40" height="90" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="4"/>
  <rect x="631" y="175" width="8" height="70" fill="#2457d6" opacity="0.7" rx="1"/>
  <text x="635" y="273" text-anchor="middle" font-size="10" fill="#2457d6">Трансмісія T &lt;&lt; 1</text>

  <!-- Attenuated Beam -->
  <polygon points="655,204 805,207 805,213 655,216" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="730" y="194" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Ослаблений пучок</text>
  <text x="730" y="232" text-anchor="middle" font-size="10" fill="#27ae60">P_out &lt; P_sat</text>

  <!-- Sensor Housing & Matrix -->
  <text x="852.5" y="144" text-anchor="middle" font-size="11" fill="#1a1a1a">Корпус камери</text>
  <rect x="810" y="155" width="85" height="110" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2" rx="4"/>
  <rect x="825" y="175" width="12" height="70" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="2"/>
  <text x="852.5" y="283" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">CMOS/CCD матриця</text>

  <!-- Card 2B: Safety & Rules Box -->
  <rect x="515" y="345" width="395" height="155" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="6"/>
  <text x="530" y="368" font-size="12" font-weight="bold" fill="#27ae60">Ключові вимоги до встановлення атенюатора:</text>
  <text x="530" y="392" font-size="11" fill="#1a1a1a">1. Монтаж ЗАВЖДИ перед відкритим сенсором</text>
  <text x="530" y="414" font-size="11" fill="#1a1a1a">2. Використання різьби C-mount (1"-32 UN) для надійності</text>
  <text x="530" y="436" font-size="11" fill="#1a1a1a">3. Клиноподібні світлофільтри запобігають відблискам</text>
  <text x="530" y="458" font-size="11" fill="#1a1a1a">4. Враховуйте зсув фокуса d = t·(1 - 1/n) через товщину t</text>
</svg>
