<svg viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-green-rev" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Header -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема оптичного стенда для вимірювання каустики та фактора M²</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Послідовність атенюації, фокусування та сканування профілю вздовж осі Z</text>

  <!-- Main Bench Panel Box -->
  <rect x="30" y="70" width="900" height="260" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Z Optical Axis Line (starts at laser aperture x=130) -->
  <line x1="130" y1="210" x2="895" y2="210" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="910" y="214" font-size="12" font-weight="bold" fill="#1a1a1a">Z</text>

  <!-- Component 1: Laser Source -->
  <rect x="40" y="150" width="90" height="110" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="130" cy="210" r="6" fill="#c0392b"/>
  <text x="85" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Лазерне джерело</text>
  <text x="85" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Лазер</text>
  <text x="85" y="210" text-anchor="middle" font-size="12" fill="#6b7280">Випромінювач</text>

  <!-- Optical Beam 1: Full High Power Beam -->
  <polygon points="130,202 205,200 205,220 130,218" fill="#c0392b" opacity="0.3"/>
  <line x1="130" y1="202" x2="205" y2="200" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="130" y1="218" x2="205" y2="220" stroke="#c0392b" stroke-width="1.5"/>
  <text x="167" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Повний пучок</text>

  <!-- Component 2: Wedged Beam Sampler -->
  <polygon points="205,170 230,175 220,250 205,250" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="217" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Світлодільний клин</text>

  <!-- Deflected Beam to Beam Dump -->
  <polygon points="210,220 220,220 230,300 215,300" fill="#c0392b" opacity="0.2"/>
  <line x1="217" y1="220" x2="222" y2="300" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <rect x="195" y="300" width="50" height="25" rx="3" fill="#34495e" stroke="#1a1a1a"/>
  <text x="220" y="317" text-anchor="middle" font-size="12" fill="#ffffff">Dump</text>

  <!-- Optical Beam 2: Sampled Beam (~4%) -->
  <polygon points="225,206 300,206 300,214 225,214" fill="#2457d6" opacity="0.3"/>
  <line x1="225" y1="206" x2="300" y2="206" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="225" y1="214" x2="300" y2="214" stroke="#2457d6" stroke-width="1.5"/>
  <text x="262" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Відбір ~4%</text>

  <!-- Component 3: Neutral Density Filters -->
  <rect x="300" y="175" width="30" height="70" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="306" y="180" width="5" height="60" rx="1" fill="#34495e"/>
  <rect x="318" y="180" width="5" height="60" rx="1" fill="#34495e"/>
  <text x="315" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">ND-фільтри</text>

  <!-- Optical Beam 3: Attenuated Beam -->
  <polygon points="330,207 410,205 410,215 330,213" fill="#2457d6" opacity="0.25"/>
  <line x1="330" y1="207" x2="410" y2="205" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="330" y1="213" x2="410" y2="215" stroke="#2457d6" stroke-width="1.5"/>
  <text x="370" y="235" text-anchor="middle" font-size="12" fill="#6b7280">Послаблений потік</text>

  <!-- Component 4: Focusing Lens -->
  <rect x="405" y="165" width="16" height="90" rx="3" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 412,170 Q 425,210 412,250 Q 407,210 412,170" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="413" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Лінза (f)</text>

  <!-- Component 5: Focused Beam Caustic -->
  <path d="M 425,175 C 520,203 610,205 660,205 C 710,205 800,185 880,170 L 880,250 C 800,235 710,215 660,215 C 610,215 520,217 425,245 Z" fill="#eaf0fd" opacity="0.6"/>
  <path d="M 425,175 C 520,203 610,205 660,205 C 710,205 800,185 880,170" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M 425,245 C 520,217 610,215 660,215 C 710,215 800,235 880,250" fill="none" stroke="#2457d6" stroke-width="1.5"/>

  <line x1="660" y1="185" x2="660" y2="235" stroke="#c0392b" stroke-dasharray="3,3"/>
  <text x="660" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Перетяжка w₀</text>

  <!-- Component 6: Linear Z-Stage & Camera -->
  <rect x="470" y="280" width="430" height="16" rx="3" fill="#34495e" stroke="#1a1a1a"/>
  <line x1="520" y1="280" x2="520" y2="288" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="580" y1="280" x2="580" y2="288" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="660" y1="280" x2="660" y2="288" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="740" y1="280" x2="740" y2="288" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="820" y1="280" x2="820" y2="288" stroke="#ffffff" stroke-width="1.5"/>

  <text x="520" y="312" text-anchor="middle" font-size="12" fill="#6b7280">z₁</text>
  <text x="580" y="312" text-anchor="middle" font-size="12" fill="#6b7280">z₂</text>
  <text x="660" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">z₀</text>
  <text x="740" y="312" text-anchor="middle" font-size="12" fill="#6b7280">z₃</text>
  <text x="820" y="312" text-anchor="middle" font-size="12" fill="#6b7280">z₄</text>

  <text x="685" y="327" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Мікрометрична Z-рейка сканування</text>

  <!-- Movable Camera Base & Body -->
  <rect x="710" y="268" width="60" height="12" rx="2" fill="#2457d6"/>
  <rect x="720" y="175" width="40" height="93" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <rect x="718" y="195" width="5" height="30" rx="1" fill="#27ae60"/>

  <text x="740" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">КМОН-камера</text>
  <text x="740" y="248" text-anchor="middle" font-size="12" fill="#6b7280">Сенсор</text>

  <path d="M 680,162 L 800,162" stroke="#27ae60" stroke-width="2" marker-start="url(#arr-green-rev)" marker-end="url(#arr-green)"/>
  <text x="740" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Сканування вздовж Z</text>

  <!-- Bottom Callout & Workflow Steps Box -->
  <rect x="30" y="345" width="900" height="90" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="367" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Етапи вимірювального процесу ISO 11146 на оптичному стенді:</text>

  <text x="160" y="392" text-anchor="middle" font-size="12" fill="#1a1a1a">1. Оптична атенюація</text>
  <text x="160" y="410" text-anchor="middle" font-size="12" fill="#6b7280">Клин ~4% + ND-фільтри</text>

  <text x="375" y="392" text-anchor="middle" font-size="12" fill="#1a1a1a">2. Темне калібрування</text>
  <text x="375" y="410" text-anchor="middle" font-size="12" fill="#6b7280">Baseline subtraction фону</text>

  <text x="590" y="392" text-anchor="middle" font-size="12" fill="#1a1a1a">3. Сканування каустики</text>
  <text x="590" y="410" text-anchor="middle" font-size="12" fill="#6b7280">≥10 перерізів (z &lt; z_R та z &gt; 2z_R)</text>

  <text x="800" y="392" text-anchor="middle" font-size="12" fill="#1a1a1a">4. Обчислення M²</text>
  <text x="800" y="410" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">D4σ, w₀, z_R, θ та M²</text>
</svg>
