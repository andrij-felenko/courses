<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-red-start" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Main Header -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Еволюція методів вимірювання профілю лазерного пучка</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Перехід від послідовного механічного сканування лезом/щілиною до миттєвого 2D-зчитування CCD/CMOS-матрицею</text>

  <!-- Panel 1 (Left): Mechanical Scanning -->
  <rect x="30" y="70" width="435" height="445" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="247.5" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">1. Механічне сканування (1D-інтегрування)</text>

  <!-- Card 1A: Mechanical Diagram -->
  <rect x="50" y="110" width="395" height="220" fill="white" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="65" y="130" font-size="13" font-weight="bold" fill="#1a1a1a">Схема з рухомою щілиною або лезом</text>

  <!-- Incoming Laser Beam -->
  <polygon points="55,195 155,200 155,220 55,225" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="105" y="180" text-anchor="middle" font-size="10" font-weight="bold" fill="#2457d6">Лазерний пучок I(x,y)</text>

  <!-- Mechanical Slit Plate -->
  <rect x="155" y="165" width="12" height="90" fill="#6b7280" rx="2"/>
  <line x1="161" y1="145" x2="161" y2="160" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-red-start)" marker-end="url(#arr-red)"/>
  <text x="161" y="140" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">Рух dx/dt</text>

  <!-- Optical Connection Slit -> Photodiode -->
  <line x1="167" y1="205" x2="215" y2="205" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Photodiode Box -->
  <rect x="215" y="180" width="50" height="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="240" y="202" text-anchor="middle" font-size="10" fill="#2457d6">Фотодіод</text>
  <text x="240" y="217" text-anchor="middle" font-size="10" fill="#2457d6">(1D)</text>

  <!-- Connection Photodiode -> Graph -->
  <line x1="265" y1="205" x2="290" y2="205" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- 1D Profile Plot Box -->
  <text x="360" y="158" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">1D-профіль I(x)</text>
  <rect x="290" y="165" width="140" height="85" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <line x1="300" y1="230" x2="420" y2="230" stroke="#6b7280" stroke-width="1"/>
  <line x1="300" y1="175" x2="300" y2="230" stroke="#6b7280" stroke-width="1"/>
  <path d="M300,230 Q330,230 340,210 T360,180 T380,210 T420,230" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Card 1B: Mechanical Limitations -->
  <rect x="50" y="345" width="395" height="155" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="6"/>
  <text x="65" y="368" font-size="12" font-weight="bold" fill="#c0392b">Особливості та обмеження механічного методу:</text>
  <text x="65" y="392" font-size="11" fill="#1a1a1a">• Вимірює лише 1D-проектну інтегральну суму</text>
  <text x="65" y="414" font-size="11" fill="#1a1a1a">• Вимагає стабільного неперерваного (CW) лазера</text>
  <text x="65" y="436" font-size="11" fill="#1a1a1a">• Низька швидкість (інерція механічного приводу)</text>
  <text x="65" y="458" font-size="11" fill="#1a1a1a">• Не може знімати поодинокі короткі імпульси</text>

  <!-- Panel 2 (Right): Camera / Matrix Profiling -->
  <rect x="495" y="70" width="435" height="445" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="712.5" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">2. Матричне зчитування (CCD/CMOS)</text>

  <!-- Card 2A: Matrix Camera Diagram -->
  <rect x="515" y="110" width="395" height="220" fill="white" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="530" y="130" font-size="13" font-weight="bold" fill="#1a1a1a">Схема прямої двовимірної зйомки</text>

  <!-- Incoming Laser Beam -->
  <polygon points="525,195 615,200 615,220 525,225" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="570" y="180" text-anchor="middle" font-size="10" font-weight="bold" fill="#2457d6">Лазерний пучок</text>

  <!-- Attenuator Filter -->
  <text x="622" y="156" text-anchor="middle" font-size="10" fill="#2457d6">Атенюатор</text>
  <rect x="615" y="165" width="14" height="90" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="2"/>

  <!-- CCD/CMOS Matrix Sensor -->
  <text x="685" y="152" text-anchor="middle" font-size="10" font-weight="bold" fill="#27ae60">CCD/CMOS</text>
  <rect x="655" y="165" width="60" height="90" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="4"/>
  <!-- Grid representation -->
  <line x1="655" y1="187" x2="715" y2="187" stroke="#27ae60" stroke-opacity="0.4" stroke-width="1"/>
  <line x1="655" y1="210" x2="715" y2="210" stroke="#27ae60" stroke-opacity="0.4" stroke-width="1"/>
  <line x1="655" y1="232" x2="715" y2="232" stroke="#27ae60" stroke-opacity="0.4" stroke-width="1"/>
  <line x1="675" y1="165" x2="675" y2="255" stroke="#27ae60" stroke-opacity="0.4" stroke-width="1"/>
  <line x1="695" y1="165" x2="695" y2="255" stroke="#27ae60" stroke-opacity="0.4" stroke-width="1"/>
  <text x="685" y="268" text-anchor="middle" font-size="10" fill="#27ae60">2D-матриця</text>

  <!-- Connection Matrix -> Display -->
  <line x1="715" y1="210" x2="745" y2="210" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Monitor Display -->
  <text x="820" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">2D / 3D розподіл</text>
  <rect x="745" y="160" width="150" height="105" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2" rx="6"/>
  <rect x="755" y="170" width="130" height="70" fill="white" stroke="#d0d7de" stroke-width="1" rx="3"/>
  <ellipse cx="820" cy="205" rx="45" ry="25" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <ellipse cx="820" cy="205" rx="30" ry="16" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <ellipse cx="820" cy="205" rx="14" ry="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="820" y="283" text-anchor="middle" font-size="10" font-weight="bold" fill="#2457d6">Параметри ISO 11146 (D4σ, M²)</text>

  <!-- Card 2B: Matrix Advantages -->
  <rect x="515" y="345" width="395" height="155" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="6"/>
  <text x="530" y="368" font-size="12" font-weight="bold" fill="#27ae60">Переваги двовимірного цифрового аналізу:</text>
  <text x="530" y="392" font-size="11" fill="#1a1a1a">• Одночасна реєстрація всього 2D-профілю за 1 кадр</text>
  <text x="530" y="414" font-size="11" fill="#1a1a1a">• Вимірювання поодиноких імпульсів (Single-shot pulse)</text>
  <text x="530" y="436" font-size="11" fill="#1a1a1a">• Точний розрахунок D4σ (другі моменти) та фактора M²</text>
  <text x="530" y="458" font-size="11" fill="#1a1a1a">• Виявлення астигматизму, еліптичності та хот-спотів</text>
</svg>
