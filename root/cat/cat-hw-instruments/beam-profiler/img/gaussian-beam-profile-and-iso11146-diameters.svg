<svg viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-blue-rev" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-green-rev" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-red-rev" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Header -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Розподіл інтенсивності гаусового пучка та діаметри за ISO 11146</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Визначення розміру пучка за рівнями 50% (FWHM), 13.5% (1/e²) та другим моментом інтенсивності (D4σ)</text>

  <!-- Left Panel: 1D Profile -->
  <rect x="30" y="70" width="500" height="365" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="280" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">1D-профіль інтенсивності I(r)</text>
  <text x="280" y="114" text-anchor="middle" font-size="12" fill="#6b7280">Визначення межі пучка за різними критеріями</text>

  <!-- Axis Lines -->
  <line x1="80" y1="280" x2="480" y2="280" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="280" y1="280" x2="280" y2="128" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="280" y="123" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">I / I₀</text>
  <text x="495" y="284" font-size="12" font-weight="bold" fill="#1a1a1a">r</text>

  <!-- Gaussian Curve Area & Line -->
  <path d="M 100,280 C 170,280 220,250 250,185 C 265,150 273,145 280,145 C 287,145 295,150 310,185 C 340,250 390,280 460,280 Z" fill="#eaf0fd" opacity="0.6"/>
  <path d="M 100,280 C 170,280 220,250 250,185 C 265,150 273,145 280,145 C 287,145 295,150 310,185 C 340,250 390,280 460,280" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Horizontal Intensity Levels -->
  <line x1="120" y1="145" x2="280" y2="145" stroke="#6b7280" stroke-dasharray="3,3"/>
  <text x="110" y="149" text-anchor="end" font-size="12" fill="#1a1a1a">100% (I₀)</text>

  <line x1="120" y1="212.5" x2="239" y2="212.5" stroke="#2457d6" stroke-dasharray="3,3"/>
  <text x="110" y="216.5" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">50% (FWHM)</text>

  <line x1="120" y1="261.7" x2="210" y2="261.7" stroke="#27ae60" stroke-dasharray="3,3"/>
  <text x="110" y="265.7" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">13.5% (1/e²)</text>

  <!-- Diameter Dimension FWHM (placed cleanly to the right of dimension arrow) -->
  <path d="M 239,212.5 L 321,212.5" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue-rev)" marker-end="url(#arr-blue)"/>
  <text x="330" y="216" font-size="12" font-weight="bold" fill="#2457d6">d(FWHM)</text>

  <!-- Diameter Dimension 1/e^2 -->
  <line x1="210" y1="261.7" x2="210" y2="325" stroke="#27ae60" stroke-dasharray="2,2"/>
  <line x1="350" y1="261.7" x2="350" y2="325" stroke="#27ae60" stroke-dasharray="2,2"/>
  <text x="280" y="304" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">d₁/ₑ² = 2w₀</text>
  <path d="M 210,310 L 350,310" stroke="#27ae60" stroke-width="1.5" marker-start="url(#arr-green-rev)" marker-end="url(#arr-green)"/>

  <!-- Diameter Dimension D4sigma -->
  <line x1="205" y1="325" x2="205" y2="365" stroke="#c0392b" stroke-dasharray="2,2"/>
  <line x1="355" y1="325" x2="355" y2="365" stroke="#c0392b" stroke-dasharray="2,2"/>
  <text x="280" y="349" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">D4σ = 4σ (ISO 11146)</text>
  <path d="M 205,355 L 355,355" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-red-rev)" marker-end="url(#arr-red)"/>

  <!-- Left Callout Box -->
  <rect x="45" y="375" width="470" height="45" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="280" y="393" text-anchor="middle" font-size="12" fill="#1a1a1a">Для ідеального Гаусового пучка: D4σ = d₁/ₑ² = 1.699 · d(FWHM)</text>
  <text x="280" y="410" text-anchor="middle" font-size="12" fill="#6b7280">Для неідеальних пучків D4σ враховує крила шуму й реальну форму</text>

  <!-- Right Panel: 2D Cross-section -->
  <rect x="560" y="70" width="370" height="365" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="745" y="95" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">2D-переріз та моменти ISO 11146</text>
  <text x="745" y="114" text-anchor="middle" font-size="12" fill="#6b7280">Центроїд (x₀, y₀) та другий момент σ²</text>

  <!-- 2D Sensor Aperture Box -->
  <rect x="600" y="140" width="290" height="190" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>

  <!-- ISO Integration Window -->
  <rect x="645" y="165" width="200" height="140" rx="4" fill="none" stroke="#c0392b" stroke-dasharray="4,4" stroke-width="1.5"/>
  <text x="840" y="160" text-anchor="end" font-size="12" fill="#c0392b">Вікно інтегрування ISO</text>

  <!-- Ellipse Heatmap Contours -->
  <ellipse cx="745" cy="235" rx="70" ry="45" fill="#3498db" opacity="0.35" stroke="#27ae60" stroke-width="1.5"/>
  <text x="822" y="239" font-size="12" font-weight="bold" fill="#27ae60">1/e²</text>

  <ellipse cx="745" cy="235" rx="41" ry="26" fill="#f1c40f" opacity="0.5" stroke="#2457d6" stroke-width="1.5"/>
  <text x="668" y="239" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">FWHM</text>

  <ellipse cx="745" cy="235" rx="20" ry="13" fill="#c0392b"/>

  <!-- Centroid Crosshair -->
  <line x1="730" y1="235" x2="760" y2="235" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="745" y1="220" x2="745" y2="250" stroke="#ffffff" stroke-width="1.5"/>
  <text x="745" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">(x₀, y₀)</text>

  <!-- Right Callout Box -->
  <rect x="575" y="340" width="340" height="80" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="745" y="360" text-anchor="middle" font-size="12" fill="#1a1a1a">Центроїд: x₀ = ∫∫ x · I(x,y) dx dy / P_tot</text>
  <text x="745" y="380" text-anchor="middle" font-size="12" fill="#1a1a1a">Другий момент: σx² = ∫∫ (x - x₀)² I(x,y) dx dy / P_tot</text>
  <text x="745" y="402" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Стандарт ISO 11146: D4σ_x = 4 · σx,  D4σ_y = 4 · σy</text>
</svg>
