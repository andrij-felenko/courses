<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Маркери стрілок -->
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-orange" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Двостадійна технологія монтажу термоусадкових обтискних гільз</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Механічне опресування металевої гілези дає контакт, а термічна усадка адгезиву — герметичність</text>

  <!-- ПАНЕЛЬ 1: Вставляння дротів -->
  <rect x="30" y="80" width="280" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="42" y="92" width="256" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="170" y="112" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Суміщення дротів у гільзі</text>

  <!-- Графіка панелі 1 -->
  <!-- Зовнішня оболонка -->
  <path d="M 70 190 L 270 190 A 6 6 0 0 1 276 196 L 276 228 A 6 6 0 0 1 270 234 L 70 234 A 6 6 0 0 1 64 228 L 64 196 A 6 6 0 0 1 70 190 Z" fill="#2457d6" fill-opacity="0.12" stroke="#2457d6" stroke-width="1.5"/>
  <!-- Шар термоклею -->
  <path d="M 75 194 L 265 194 L 265 230 L 75 230 Z" fill="#fbbf24" fill-opacity="0.25" stroke="#f59e0b" stroke-dasharray="3,2" stroke-width="1"/>
  <!-- Металева гілеза -->
  <path d="M 135 200 L 205 200 L 205 224 L 135 224 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
  <!-- Лівий провідник: ізоляція і жили -->
  <path d="M 40 204 L 95 204 L 95 220 L 40 220 Z" fill="#dc2626"/>
  <path d="M 95 207 L 165 207 L 165 217 L 95 217 Z" fill="#d97706"/>
  <!-- Правий провідник: ізоляція і жили -->
  <path d="M 245 204 L 300 204 L 300 220 L 245 220 Z" fill="#2563eb"/>
  <path d="M 175 207 L 245 207 L 245 217 L 175 217 Z" fill="#d97706"/>
  <!-- Маркувальне кільце -->
  <path d="M 80 190 L 90 190 L 90 234 L 80 234 Z" fill="#2457d6"/>

  <!-- Виносні підписи для схеми 1 -->
  <text x="170" y="152" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Прозора трубка з термоклеєм</text>
  <line x1="170" y1="158" x2="170" y2="188" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>

  <text x="170" y="262" font-size="12" fill="#6b7280" text-anchor="middle">Внутрішня мідна олов'янована гілеза</text>

  <!-- Блок деталей 1.1 -->
  <rect x="42" y="280" width="256" height="75" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="52" y="299" font-size="12" font-weight="bold" fill="#1a1a1a">Вимоги до підготовки:</text>
  <text x="52" y="318" font-size="12" fill="#6b7280">• Довжина зачистки жил: 7–8 мм</text>
  <text x="52" y="336" font-size="12" fill="#6b7280">• Жили заходять до центрального упору</text>

  <!-- Блок підсумку 1.2 -->
  <rect x="42" y="367" width="256" height="73" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="170" y="386" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Колірне маркування за перерізом</text>
  <text x="170" y="405" font-size="12" fill="#6b7280" text-anchor="middle">Червоний: 0.5–1.5 | Синій: 1.5–2.5 мм²</text>
  <text x="170" y="423" font-size="12" fill="#6b7280" text-anchor="middle">Жовтий: 4.0–6.0 мм²</text>


  <!-- ПАНЕЛЬ 2: Механічний обтиск -->
  <rect x="340" y="80" width="280" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="352" y="92" width="256" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="112" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">2. Механічний обтиск (Кримпінг)</text>

  <!-- Графіка панелі 2 -->
  <!-- Зусилля обтиску стрілки -->
  <text x="480" y="145" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Стискання кримпером</text>
  <line x1="480" y1="150" x2="480" y2="168" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="480" y1="266" x2="480" y2="248" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Матриці кримпера -->
  <polygon points="465,170 495,170 490,192 470,192" fill="#64748b" stroke="#334155" stroke-width="1"/>
  <polygon points="465,246 495,246 490,224 470,224" fill="#64748b" stroke="#334155" stroke-width="1"/>

  <!-- Трубка з прогинанням / деформацією -->
  <path d="M 380 194 L 580 194 L 580 222 L 380 222 Z" fill="#2457d6" fill-opacity="0.12" stroke="#2457d6" stroke-width="1.5"/>
  <!-- Деформована гілеза -->
  <path d="M 445 202 L 468 206 L 492 206 L 515 202 L 515 214 L 492 210 L 468 210 L 445 214 Z" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <!-- Провідники всередині -->
  <path d="M 350 200 L 405 200 L 405 216 L 350 216 Z" fill="#dc2626"/>
  <path d="M 405 203 L 470 203 L 470 213 L 405 213 Z" fill="#d97706"/>
  <path d="M 555 200 L 610 200 L 610 216 L 555 216 Z" fill="#2563eb"/>
  <path d="M 490 203 L 555 203 L 555 213 L 490 213 Z" fill="#d97706"/>

  <text x="480" y="280" font-size="12" fill="#1a1a1a" text-anchor="middle">Пластична деформація міді</text>

  <!-- Блок деталей 2.1 -->
  <rect x="352" y="295" width="256" height="60" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="362" y="314" font-size="12" font-weight="bold" fill="#1a1a1a">Вимоги до кримпера:</text>
  <text x="362" y="332" font-size="12" fill="#6b7280">• Сумісна матриця (без гострих країв)</text>
  <text x="362" y="347" font-size="12" fill="#6b7280">• Запобігання проколу полімеру</text>

  <!-- Блок контролю 2.2 -->
  <rect x="352" y="367" width="256" height="73" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="480" y="386" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Контроль опресування</text>
  <text x="480" y="405" font-size="12" fill="#1a1a1a" text-anchor="middle">Низький переходний опір R_contact</text>
  <text x="480" y="423" font-size="12" fill="#c0392b" text-anchor="middle">Механічна міцність на розрив</text>


  <!-- ПАНЕЛЬ 3: Термічна усадка -->
  <rect x="650" y="80" width="280" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="662" y="92" width="256" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="790" y="112" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">3. Термічна усадка та герметизація</text>

  <!-- Графіка панелі 3 -->
  <!-- Потік гарячого повітря -->
  <text x="790" y="145" font-size="12" font-weight="bold" fill="#d97706" text-anchor="middle">Нагрів термофеном (150–200 °C)</text>
  <path d="M 760 152 Q 765 170 770 186" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-orange)"/>
  <path d="M 790 152 L 790 186" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-orange)"/>
  <path d="M 820 152 Q 815 170 810 186" fill="none" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-orange)"/>

  <!-- Усаджена оболонка, що щільно облягає провідники і гілезу -->
  <path d="M 695 204 L 745 204 L 755 197 L 825 197 L 835 204 L 885 204 L 885 220 L 835 220 L 825 227 L 755 227 L 745 220 L 695 220 Z" fill="#2457d6" fill-opacity="0.3" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Провідники всередині усадженої трубки -->
  <path d="M 660 204 L 700 204 L 700 220 L 660 220 Z" fill="#dc2626"/>
  <path d="M 880 204 L 920 204 L 920 220 L 880 220 Z" fill="#2563eb"/>

  <!-- Клейові валики на торцях -->
  <ellipse cx="700" cy="212" rx="5" ry="9" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
  <ellipse cx="880" cy="212" rx="5" ry="9" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>

  <text x="700" y="250" font-size="12" fill="#d97706" text-anchor="middle">Клейовий валик</text>
  <text x="880" y="250" font-size="12" fill="#d97706" text-anchor="middle">Клейовий валик</text>

  <!-- Блок деталей 3.1 -->
  <rect x="662" y="280" width="256" height="75" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="672" y="299" font-size="12" font-weight="bold" fill="#1a1a1a">Фізико-хімічний процес:</text>
  <text x="672" y="318" font-size="12" fill="#6b7280">• Радіальна усадка полімеру (3:1)</text>
  <text x="672" y="336" font-size="12" fill="#6b7280">• Заповнення щілин розплавом клею</text>

  <!-- Блок підсумку 3.2 -->
  <rect x="662" y="367" width="256" height="73" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="790" y="386" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Результат герметизації</text>
  <text x="790" y="405" font-size="12" fill="#1a1a1a" text-anchor="middle">Кільцеве клейове ущільнення на торцях</text>
  <text x="790" y="423" font-size="12" fill="#27ae60" text-anchor="middle">Захист від вологи та корозії (IP67)</text>

  <!-- Стрілки між панелями -->
  <path d="M 312 267 L 336 267" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <path d="M 622 267 L 646 267" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
</svg>
