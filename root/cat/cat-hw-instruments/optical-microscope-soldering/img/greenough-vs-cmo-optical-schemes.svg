<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
  </marker>
  <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
  </marker>
</defs>

<rect x="0" y="0" width="960" height="540" fill="white"/>

<!-- Title and Subtitle -->
<text x="480" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Порівняння оптичних схем стереомікроскопів: Ґріну (Greenough) та CMO</text>
<text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Схема Ґріну забезпечує глибину різкості, CMO — плоске поле зору та розширюваність</text>

<!-- Left Panel: Greenough -->
<rect x="25" y="70" width="445" height="450" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
<text x="247" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">Схема Ґріну (Greenough)</text>
<text x="247" y="114" text-anchor="middle" font-size="12" fill="#6b7280">Двооб'єктивна схема з похилими оптичними осями</text>

<!-- Oculars Greenough -->
<text x="247" y="136" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Окуляри</text>
<rect x="195" y="145" width="26" height="30" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="3"/>
<rect x="273" y="145" width="26" height="30" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="3"/>

<!-- Zoom Tubes Greenough -->
<polygon points="192,185 224,185 214,320 186,320" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<polygon points="270,185 302,185 308,320 280,320" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>

<!-- Objectives Greenough -->
<ellipse cx="200" cy="326" rx="16" ry="7" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<ellipse cx="294" cy="326" rx="16" ry="7" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

<!-- Optical Axes Greenough -->
<line x1="208" y1="145" x2="247" y2="415" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="4,3"/>
<line x1="286" y1="145" x2="247" y2="415" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="4,3"/>

<!-- Convergence Angle Greenough -->
<path d="M 233,365 A 40,40 0 0,0 261,365" fill="none" stroke="#c0392b" stroke-width="1.5"/>
<text x="295" y="369" text-anchor="start" font-size="12" font-weight="700" fill="#c0392b">Кут θ ≈ 12°</text>
<line x1="263" y1="365" x2="290" y2="365" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>

<!-- Specimen Greenough -->
<rect x="147" y="415" width="200" height="10" fill="#27ae60" rx="2" opacity="0.85"/>
<rect x="238" y="407" width="18" height="8" fill="#c0392b" rx="1"/>
<text x="247" y="442" text-anchor="middle" font-size="12" fill="#1a1a1a">Об'єкт контролю / SMD-компонент</text>

<!-- Callouts Left Panel -->
<text x="140" y="225" text-anchor="end" font-size="12" font-weight="700" fill="#2457d6">Окремі похилі</text>
<text x="140" y="241" text-anchor="end" font-size="12" fill="#6b7280">оптичні канали</text>
<line x1="146" y1="233" x2="186" y2="233" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>

<text x="140" y="315" text-anchor="end" font-size="12" font-weight="700" fill="#1a1a1a">Два окремі</text>
<text x="140" y="331" text-anchor="end" font-size="12" fill="#6b7280">об'єктиви</text>
<line x1="146" y1="326" x2="182" y2="326" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>

<!-- Badges Left Panel -->
<rect x="330" y="190" width="128" height="50" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
<text x="394" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">Переваги:</text>
<text x="394" y="228" text-anchor="middle" font-size="12" fill="#1a1a1a">Глибина різкості, 3D</text>

<rect x="330" y="255" width="128" height="66" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="4"/>
<text x="394" y="274" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">Особливість:</text>
<text x="394" y="292" text-anchor="middle" font-size="12" fill="#1a1a1a">Трапецієподібні</text>
<text x="394" y="308" text-anchor="middle" font-size="12" fill="#1a1a1a">спотворення осей</text>

<rect x="45" y="465" width="405" height="38" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
<text x="247" y="482" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Застосування: Ручне паяння SMD, монтаж, ремонт</text>
<text x="247" y="496" text-anchor="middle" font-size="12" fill="#6b7280">Висока стереоскопічність та зручний робочий простір</text>

<!-- Right Panel: CMO -->
<rect x="490" y="70" width="445" height="450" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
<text x="712" y="96" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">Схема CMO (Common Main Objective)</text>
<text x="712" y="114" text-anchor="middle" font-size="12" fill="#6b7280">Паралельні канали та єдиний головний об'єктив</text>

<!-- Oculars CMO -->
<text x="712" y="136" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Окуляри</text>
<rect x="660" y="145" width="26" height="30" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="3"/>
<rect x="738" y="145" width="26" height="30" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="3"/>

<!-- Parallel Zone -->
<rect x="635" y="180" width="154" height="48" fill="#eaf0fd" stroke="#2457d6" stroke-dasharray="3,3" stroke-width="1.5" rx="3"/>
<text x="712" y="200" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Паралельна</text>
<text x="712" y="216" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">зона (∞)</text>

<!-- Zoom Tubes CMO -->
<rect x="662" y="235" width="22" height="75" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<rect x="740" y="235" width="22" height="75" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>

<!-- Main Lens CMO -->
<ellipse cx="712" cy="326" rx="65" ry="12" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>

<!-- Optical Axes CMO -->
<line x1="673" y1="145" x2="673" y2="326" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="4,3"/>
<line x1="751" y1="145" x2="751" y2="326" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="4,3"/>
<line x1="673" y1="326" x2="712" y2="415" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="4,3"/>
<line x1="751" y1="326" x2="712" y2="415" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="4,3"/>

<!-- Specimen CMO -->
<rect x="612" y="415" width="200" height="10" fill="#27ae60" rx="2" opacity="0.85"/>
<rect x="703" y="407" width="18" height="8" fill="#c0392b" rx="1"/>
<text x="712" y="442" text-anchor="middle" font-size="12" fill="#1a1a1a">Об'єкт контролю / SMD-компонент</text>

<!-- Callouts Right Panel -->
<text x="605" y="200" text-anchor="end" font-size="12" font-weight="700" fill="#2457d6">Модульні вставки</text>
<text x="605" y="216" text-anchor="end" font-size="12" fill="#6b7280">(фотоадаптери, дільники)</text>
<line x1="612" y1="206" x2="633" y2="206" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>

<text x="605" y="315" text-anchor="end" font-size="12" font-weight="700" fill="#1a1a1a">Єдиний великий</text>
<text x="605" y="331" text-anchor="end" font-size="12" fill="#6b7280">об'єктив (CMO)</text>
<line x1="612" y1="326" x2="643" y2="326" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>

<!-- Badges Right Panel -->
<rect x="795" y="190" width="128" height="66" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
<text x="859" y="210" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">Переваги:</text>
<text x="859" y="228" text-anchor="middle" font-size="12" fill="#1a1a1a">Плоске поле зору,</text>
<text x="859" y="244" text-anchor="middle" font-size="12" fill="#1a1a1a">легка модульність</text>

<rect x="795" y="270" width="128" height="50" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
<text x="859" y="290" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280">Особливість:</text>
<text x="859" y="308" text-anchor="middle" font-size="12" fill="#1a1a1a">Вища вартість і вага</text>

<rect x="510" y="465" width="405" height="38" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
<text x="712" y="482" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Застосування: Точні вимірювання, мікрофотозйомка</text>
<text x="712" y="496" text-anchor="middle" font-size="12" fill="#6b7280">Сумісність із проміжними фото- та відеоадаптерами</text>

</svg>
