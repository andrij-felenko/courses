<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
  </marker>
  <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
  </marker>
  <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
  </marker>
  <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
  </marker>
</defs>

<rect x="0" y="0" width="960" height="520" fill="white"/>

<!-- Title and Subtitle -->
<text x="480" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Кільцеве освітлення з розсіювачем та поляризаційними фільтрами</text>
<text x="480" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Механізм усунення паразитних відблисків від дзеркальних припайних галтелей</text>

<!-- Left Panel: Without Polarization -->
<rect x="25" y="70" width="445" height="430" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
<text x="247" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">Пряме освітлення (без поляризації)</text>
<text x="247" y="112" text-anchor="middle" font-size="12" fill="#6b7280">Прямі відблиски засліплюють мікроскоп</text>

<!-- Left Objective -->
<ellipse cx="247" cy="160" rx="35" ry="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="247" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Об'єктив мікроскопа</text>

<!-- Left Ring Light & Diffuser -->
<rect x="167" y="205" width="35" height="15" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="3"/>
<rect x="292" y="205" width="35" height="15" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="3"/>
<circle cx="184" cy="212" r="4" fill="#f1c40f"/>
<circle cx="310" cy="212" r="4" fill="#f1c40f"/>

<rect x="167" y="222" width="160" height="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="2"/>

<!-- Left Callout LED/Diffuser -->
<text x="40" y="208" text-anchor="start" font-size="12" font-weight="700" fill="#1a1a1a">LED-освітлювач</text>
<text x="40" y="224" text-anchor="start" font-size="11" fill="#6b7280">з розсіювачем</text>
<line x1="130" y1="215" x2="162" y2="215" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>

<!-- Left Light Rays -->
<line x1="184" y1="230" x2="235" y2="345" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
<line x1="310" y1="230" x2="259" y2="345" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

<line x1="247" y1="345" x2="247" y2="172" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>

<!-- Left Callout Reflected Ray -->
<text x="334" y="260" text-anchor="start" font-size="12" font-weight="700" fill="#c0392b">Паразитний відблиск</text>
<text x="334" y="276" text-anchor="start" font-size="11" fill="#c0392b">(сліпуче засвічення)</text>
<line x1="252" y1="265" x2="328" y2="265" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>

<!-- Left PCB & Component -->
<rect x="120" y="375" width="254" height="12" fill="#27ae60" rx="2"/>
<text x="247" y="401" text-anchor="middle" font-size="12" fill="#1a1a1a">Друкована плата (PCB)</text>

<rect x="140" y="340" width="55" height="35" fill="#1a1a1a" rx="2"/>
<text x="167" y="362" text-anchor="middle" font-size="11" fill="#ffffff">SMD</text>

<path d="M195,375 Q 220,375 235,345 L 245,345 Q 260,375 285,375 Z" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
<ellipse cx="247" cy="347" rx="10" ry="4" fill="#c0392b" opacity="0.8"/>

<!-- Left Bottom Badge -->
<rect x="35" y="430" width="425" height="55" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="6"/>
<text x="247" y="452" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">Перешкода: Сліпучий відблиск приховує дефекти</text>
<text x="247" y="471" text-anchor="middle" font-size="12" fill="#1a1a1a">Неможливо виявити мікротріщини, відшарування та непропаї</text>


<!-- Right Panel: With Polarization -->
<rect x="490" y="70" width="445" height="430" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
<text x="712" y="94" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a1a">Поляризаційне освітлення (P1 ⊥ P2)</text>
<text x="712" y="112" text-anchor="middle" font-size="12" fill="#6b7280">Крос-поляризація блокує прямі дзеркальні відблиски</text>

<!-- Right Objective -->
<ellipse cx="712" cy="160" rx="35" ry="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="712" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Об'єктив мікроскопа</text>

<!-- Analyzer P2 -->
<rect x="662" y="180" width="100" height="12" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="2"/>
<line x1="682" y1="182" x2="682" y2="190" stroke="#2457d6" stroke-width="1.5"/>
<line x1="712" y1="182" x2="712" y2="190" stroke="#2457d6" stroke-width="1.5"/>
<line x1="742" y1="182" x2="742" y2="190" stroke="#2457d6" stroke-width="1.5"/>

<!-- Right Callout Analyzer P2 -->
<text x="775" y="186" text-anchor="start" font-size="12" font-weight="700" fill="#2457d6">Аналізатор P2</text>
<text x="775" y="202" text-anchor="start" font-size="11" fill="#6b7280">(орієнтація 90°)</text>
<line x1="764" y1="186" x2="771" y2="186" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>

<!-- Right Ring Light, Diffuser & Polarizer P1 -->
<rect x="632" y="205" width="35" height="15" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="3"/>
<rect x="757" y="205" width="35" height="15" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="3"/>
<circle cx="649" cy="212" r="4" fill="#f1c40f"/>
<circle cx="775" cy="212" r="4" fill="#f1c40f"/>

<rect x="632" y="222" width="160" height="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="2"/>
<rect x="632" y="232" width="160" height="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="2"/>
<line x1="650" y1="237" x2="665" y2="237" stroke="#2457d6" stroke-width="1.5"/>
<line x1="755" y1="237" x2="770" y2="237" stroke="#2457d6" stroke-width="1.5"/>

<!-- Right Callout P1 -->
<text x="505" y="222" text-anchor="start" font-size="12" font-weight="700" fill="#2457d6">Поляризатор P1</text>
<text x="505" y="238" text-anchor="start" font-size="11" fill="#6b7280">з розсіювачем (0°)</text>
<line x1="605" y1="228" x2="628" y2="228" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>

<!-- Right Light Rays -->
<line x1="649" y1="242" x2="700" y2="345" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
<line x1="775" y1="242" x2="724" y2="345" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

<!-- Blocked Specular Ray -->
<line x1="706" y1="345" x2="706" y2="194" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3"/>
<circle cx="706" cy="192" r="5" fill="#c0392b"/>
<line x1="703" y1="189" x2="709" y2="195" stroke="#ffffff" stroke-width="1.5"/>
<line x1="703" y1="195" x2="709" y2="189" stroke="#ffffff" stroke-width="1.5"/>

<!-- Callout Blocked Specular Ray -->
<text x="505" y="275" text-anchor="start" font-size="12" font-weight="700" fill="#c0392b">Відблиск E₁</text>
<text x="505" y="291" text-anchor="start" font-size="11" fill="#c0392b">заблоковано P2</text>
<line x1="590" y1="280" x2="700" y2="192" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>

<!-- Passed Scattered Ray -->
<line x1="718" y1="345" x2="718" y2="172" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

<!-- Callout Passed Scattered Ray -->
<text x="799" y="275" text-anchor="start" font-size="12" font-weight="700" fill="#27ae60">Світло від дефекту</text>
<text x="799" y="291" text-anchor="start" font-size="11" fill="#27ae60">проходить в об'єктив</text>
<line x1="723" y1="280" x2="793" y2="280" stroke="#27ae60" stroke-width="1" stroke-dasharray="2,2"/>

<!-- Right PCB & Component -->
<rect x="585" y="375" width="254" height="12" fill="#27ae60" rx="2"/>
<text x="712" y="401" text-anchor="middle" font-size="12" fill="#1a1a1a">Друкована плата (PCB)</text>

<rect x="605" y="340" width="55" height="35" fill="#1a1a1a" rx="2"/>
<text x="632" y="362" text-anchor="middle" font-size="11" fill="#ffffff">SMD</text>

<path d="M660,375 Q 685,375 700,345 L 710,345 Q 725,375 750,375 Z" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
<path d="M716,346 L719,355 L717,365" stroke="#c0392b" stroke-width="2" fill="none"/>

<text x="775" y="355" text-anchor="start" font-size="12" font-weight="700" fill="#27ae60">Чітка мікротріщина</text>
<text x="775" y="371" text-anchor="start" font-size="11" fill="#6b7280">(контрастний дефект)</text>

<!-- Right Bottom Badge -->
<rect x="500" y="430" width="425" height="55" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="6"/>
<text x="712" y="452" text-anchor="middle" font-size="13" font-weight="700" fill="#27ae60">Розв'язок: Чіткий безвідблисковий контроль</text>
<text x="712" y="471" text-anchor="middle" font-size="12" fill="#1a1a1a">Максимальний контраст галтелі та надійна інспекція паяння</text>

</svg>
