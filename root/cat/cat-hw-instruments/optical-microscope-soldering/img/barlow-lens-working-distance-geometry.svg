<svg viewBox="0 0 960 560" width="960" height="560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Markers -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Canvas Header -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вплив лінз Барлоу на геометрію робочої зони мікроскопа</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Додаткові оптичні насадки збільшують робочу відстань (WD) та поле зору (FOV)</text>

  <!-- ==================== PANEL 1: Без лінзи (1.0x) ==================== -->
  <g id="panel-1">
    <!-- Panel Background -->
    <rect x="25" y="70" width="290" height="470" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    
    <!-- Panel Header Box -->
    <rect x="35" y="80" width="270" height="44" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="170" y="98" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Без лінзи (1.0×)</text>
    <text x="170" y="114" font-size="12" fill="#6b7280" text-anchor="middle">Базовий режим мікроскопа</text>

    <!-- Microscope Stand / Head -->
    <rect x="135" y="135" width="70" height="90" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <rect x="145" y="225" width="50" height="30" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
    <text x="170" y="180" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">Об'єктив</text>

    <!-- Optical Cone -->
    <polygon points="150,255 190,255 205,440 135,440" fill="#c0392b" fill-opacity="0.08" stroke="#c0392b" stroke-width="1" stroke-dasharray="4 3"/>

    <!-- PCB Surface -->
    <rect x="45" y="440" width="250" height="12" rx="2" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="160" y="434" width="20" height="6" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>

    <!-- Working Distance (WD) Measurement -->
    <line x1="125" y1="262" x2="125" y2="433" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-red)" marker-end="url(#arr-red)"/>
    <line x1="118" y1="255" x2="132" y2="255" stroke="#c0392b" stroke-width="1.5"/>
    <line x1="118" y1="440" x2="132" y2="440" stroke="#c0392b" stroke-width="1.5"/>
    <text x="32" y="340" font-size="12" font-weight="bold" fill="#c0392b">WD = 100 мм</text>
    <text x="32" y="354" font-size="10" fill="#c0392b">(малий простір)</text>

    <!-- Warning Badge & Clearance Text -->
    <circle cx="210" cy="275" r="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="210" y="279" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">!</text>
    <text x="225" y="279" font-size="10" fill="#c0392b">Загроза оптиці</text>

    <!-- Soldering Tool -->
    <line x1="300" y1="345" x2="180" y2="434" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="210" y1="412" x2="180" y2="434" stroke="#c0392b" stroke-width="2.5" stroke-linecap="round"/>
    <text x="220" y="300" font-size="11" font-weight="bold" fill="#c0392b">Кут 40°</text>
    <text x="220" y="314" font-size="10" fill="#c0392b">Тісний кут</text>

    <!-- Field of View (FOV) Measurement -->
    <line x1="135" y1="475" x2="205" y2="475" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-red)" marker-end="url(#arr-red)"/>
    <line x1="135" y1="442" x2="135" y2="478" stroke="#c0392b" stroke-width="1"/>
    <line x1="205" y1="442" x2="205" y2="478" stroke="#c0392b" stroke-width="1"/>
    <text x="170" y="495" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">FOV = Ø 28 мм</text>
    <text x="170" y="512" font-size="11" fill="#6b7280" text-anchor="middle">(вузьке поле)</text>
  </g>

  <!-- ==================== PANEL 2: З лінзою Барлоу 0.75x ==================== -->
  <g id="panel-2">
    <!-- Panel Background -->
    <rect x="335" y="70" width="290" height="470" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    
    <!-- Panel Header Box -->
    <rect x="345" y="80" width="270" height="44" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="480" y="98" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Лінза Барлоу 0.75×</text>
    <text x="480" y="114" font-size="12" fill="#6b7280" text-anchor="middle">Компромісна конфігурація</text>

    <!-- Microscope Head & Barlow Lens -->
    <rect x="445" y="125" width="70" height="80" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <rect x="455" y="205" width="50" height="20" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
    <rect x="450" y="225" width="60" height="15" rx="3" fill="#2457d6" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="480" y="170" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">Об'єктив</text>
    <line x1="510" y1="232" x2="517" y2="232" stroke="#2457d6" stroke-width="1"/>
    <text x="520" y="236" font-size="11" font-weight="bold" fill="#2457d6">Насадка 0.75×</text>

    <!-- Optical Cone -->
    <polygon points="455,240 505,240 530,440 430,440" fill="#2457d6" fill-opacity="0.08" stroke="#2457d6" stroke-width="1" stroke-dasharray="4 3"/>

    <!-- PCB Surface -->
    <rect x="355" y="440" width="250" height="12" rx="2" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="470" y="434" width="20" height="6" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>

    <!-- Working Distance (WD) Measurement -->
    <line x1="425" y1="247" x2="425" y2="433" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
    <line x1="418" y1="240" x2="432" y2="240" stroke="#2457d6" stroke-width="1.5"/>
    <line x1="418" y1="440" x2="432" y2="440" stroke="#2457d6" stroke-width="1.5"/>
    <text x="342" y="340" font-size="12" font-weight="bold" fill="#2457d6">WD = 135 мм</text>
    <text x="342" y="354" font-size="10" fill="#2457d6">+35% простору</text>

    <!-- Info Badge & Clearance Text -->
    <circle cx="520" cy="275" r="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="520" y="279" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">✓</text>
    <text x="535" y="279" font-size="10" fill="#2457d6">Безпечний зазор</text>

    <!-- Soldering Tool -->
    <line x1="610" y1="345" x2="490" y2="434" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="520" y1="412" x2="490" y2="434" stroke="#2457d6" stroke-width="2.5" stroke-linecap="round"/>
    <text x="530" y="300" font-size="11" font-weight="bold" fill="#2457d6">Кут 50°</text>
    <text x="530" y="314" font-size="10" fill="#2457d6">Достатній кут</text>

    <!-- Field of View (FOV) Measurement -->
    <line x1="430" y1="475" x2="530" y2="475" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
    <line x1="430" y1="442" x2="430" y2="478" stroke="#2457d6" stroke-width="1"/>
    <line x1="530" y1="442" x2="530" y2="478" stroke="#2457d6" stroke-width="1"/>
    <text x="480" y="495" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">FOV = Ø 37 мм</text>
    <text x="480" y="512" font-size="11" fill="#6b7280" text-anchor="middle">(розширене поле)</text>
  </g>

  <!-- ==================== PANEL 3: З лінзою Барлоу 0.5x ==================== -->
  <g id="panel-3">
    <!-- Panel Background -->
    <rect x="645" y="70" width="290" height="470" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    
    <!-- Panel Header Box -->
    <rect x="655" y="80" width="270" height="44" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
    <text x="790" y="98" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Лінза Барлоу 0.5×</text>
    <text x="790" y="114" font-size="12" fill="#27ae60" text-anchor="middle">Максимальний простір</text>

    <!-- Microscope Head & Barlow Lens -->
    <rect x="755" y="110" width="70" height="75" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <rect x="765" y="185" width="50" height="20" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
    <rect x="758" y="205" width="64" height="20" rx="3" fill="#27ae60" stroke="#1e7e34" stroke-width="1.5"/>
    <text x="790" y="150" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">Об'єктив</text>
    <line x1="822" y1="215" x2="826" y2="215" stroke="#27ae60" stroke-width="1"/>
    <text x="828" y="218" font-size="11" font-weight="bold" fill="#27ae60">Насадка 0.5×</text>

    <!-- Optical Cone -->
    <polygon points="765,225 815,225 855,440 725,440" fill="#27ae60" fill-opacity="0.08" stroke="#27ae60" stroke-width="1" stroke-dasharray="4 3"/>

    <!-- PCB Surface -->
    <rect x="665" y="440" width="250" height="12" rx="2" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="780" y="434" width="20" height="6" fill="#fbbf24" stroke="#d97706" stroke-width="1"/>

    <!-- Working Distance (WD) Measurement -->
    <line x1="735" y1="232" x2="735" y2="433" stroke="#27ae60" stroke-width="1.5" marker-start="url(#arr-green)" marker-end="url(#arr-green)"/>
    <line x1="728" y1="225" x2="742" y2="225" stroke="#27ae60" stroke-width="1.5"/>
    <line x1="728" y1="440" x2="742" y2="440" stroke="#27ae60" stroke-width="1.5"/>
    <text x="652" y="340" font-size="12" font-weight="bold" fill="#27ae60">WD = 165 мм</text>
    <text x="652" y="354" font-size="10" fill="#27ae60">+65% простору</text>

    <!-- Info Badge & Clearance Text -->
    <circle cx="830" cy="275" r="10" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
    <text x="830" y="279" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">✓</text>
    <text x="845" y="279" font-size="10" fill="#27ae60">Максимум місця</text>

    <!-- Soldering Tool -->
    <line x1="920" y1="345" x2="800" y2="434" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="830" y1="412" x2="800" y2="434" stroke="#27ae60" stroke-width="2.5" stroke-linecap="round"/>
    <text x="840" y="300" font-size="11" font-weight="bold" fill="#27ae60">Кут 60°</text>
    <text x="840" y="314" font-size="10" fill="#27ae60">Вільний доступ</text>

    <!-- Field of View (FOV) Measurement -->
    <line x1="725" y1="475" x2="855" y2="475" stroke="#27ae60" stroke-width="1.5" marker-start="url(#arr-green)" marker-end="url(#arr-green)"/>
    <line x1="725" y1="442" x2="725" y2="478" stroke="#27ae60" stroke-width="1"/>
    <line x1="855" y1="442" x2="855" y2="478" stroke="#27ae60" stroke-width="1"/>
    <text x="790" y="495" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">FOV = Ø 57 мм</text>
    <text x="790" y="512" font-size="11" fill="#27ae60" text-anchor="middle">(максимальне поле)</text>
  </g>
</svg>
