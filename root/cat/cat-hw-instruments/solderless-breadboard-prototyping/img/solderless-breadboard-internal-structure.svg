<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <!-- Arrow Markers -->
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Header Section -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Внутрішня анатомія та електричні з'єднання макетної плати</text>
  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Вертикальні 5-контактні ребра з'єднані пружинними затискачами, а шини живлення ізольовані DIP-пазом</text>

  <!-- Panel 1: Cross-Section View -->
  <rect x="30" y="68" width="435" height="376" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="48" y="94" font-size="14" font-weight="bold" fill="#1a1a1a">1. Поперечний розріз та топологія корпусів</text>

  <!-- Breadboard Body Base -->
  <rect x="50" y="140" width="395" height="115" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Left Power Rails (V+ and GND) -->
  <line x1="75" y1="140" x2="75" y2="255" stroke="#c0392b" stroke-width="3" stroke-dasharray="4,2"/>
  <line x1="105" y1="140" x2="105" y2="255" stroke="#2457d6" stroke-width="3" stroke-dasharray="4,2"/>
  <text x="90" y="134" text-anchor="middle" font-size="12" fill="#6b7280">Шини</text>

  <line x1="120" y1="140" x2="120" y2="255" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="2,2"/>

  <!-- Left Terminal Block (A-E) -->
  <!-- Holes A, B, C, D, E -->
  <rect x="136" y="140" width="10" height="5" fill="#1a1a1a"/>
  <rect x="156" y="140" width="10" height="5" fill="#1a1a1a"/>
  <rect x="176" y="140" width="10" height="5" fill="#1a1a1a"/>
  <rect x="196" y="140" width="10" height="5" fill="#1a1a1a"/>
  <rect x="216" y="140" width="10" height="5" fill="#1a1a1a"/>

  <text x="141" y="134" text-anchor="middle" font-size="12" fill="#6b7280">A</text>
  <text x="161" y="134" text-anchor="middle" font-size="12" fill="#6b7280">B</text>
  <text x="181" y="134" text-anchor="middle" font-size="12" fill="#6b7280">C</text>
  <text x="201" y="134" text-anchor="middle" font-size="12" fill="#6b7280">D</text>
  <text x="221" y="134" text-anchor="middle" font-size="12" fill="#6b7280">E</text>

  <!-- Left Spring Metal Clip (Shorting A-E) -->
  <rect x="133" y="200" width="96" height="22" fill="#eaf0fd" opacity="0.7" rx="2"/>
  <rect x="133" y="210" width="96" height="12" fill="#b8c4d0" stroke="#6b7280" stroke-width="1" rx="2"/>
  <path d="M 137,145 L 137,210 M 145,145 L 145,210" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M 157,145 L 157,210 M 165,145 L 165,210" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M 177,145 L 177,210 M 185,145 L 185,210" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M 197,145 L 197,210 M 205,145 L 205,210" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M 217,145 L 217,210 M 225,145 L 225,210" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Center DIP Groove -->
  <path d="M 225,140 L 225,190 L 275,190 L 275,140 Z" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="250" y="180" text-anchor="middle" font-size="12" fill="#6b7280">7.62 мм</text>

  <!-- Right Terminal Block (F-J) -->
  <!-- Holes F, G, H, I, J -->
  <rect x="276" y="140" width="10" height="5" fill="#1a1a1a"/>
  <rect x="296" y="140" width="10" height="5" fill="#1a1a1a"/>
  <rect x="316" y="140" width="10" height="5" fill="#1a1a1a"/>
  <rect x="336" y="140" width="10" height="5" fill="#1a1a1a"/>
  <rect x="356" y="140" width="10" height="5" fill="#1a1a1a"/>

  <text x="281" y="134" text-anchor="middle" font-size="12" fill="#6b7280">F</text>
  <text x="301" y="134" text-anchor="middle" font-size="12" fill="#6b7280">G</text>
  <text x="321" y="134" text-anchor="middle" font-size="12" fill="#6b7280">H</text>
  <text x="341" y="134" text-anchor="middle" font-size="12" fill="#6b7280">I</text>
  <text x="361" y="134" text-anchor="middle" font-size="12" fill="#6b7280">J</text>

  <!-- Right Spring Metal Clip (Shorting F-J) -->
  <rect x="273" y="200" width="96" height="22" fill="#eaf0fd" opacity="0.7" rx="2"/>
  <rect x="273" y="210" width="96" height="12" fill="#b8c4d0" stroke="#6b7280" stroke-width="1" rx="2"/>
  <path d="M 277,145 L 277,210 M 285,145 L 285,210" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M 297,145 L 297,210 M 305,145 L 305,210" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M 317,145 L 317,210 M 325,145 L 325,210" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M 337,145 L 337,210 M 345,145 L 345,210" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M 357,145 L 357,210 M 365,145 L 365,210" stroke="#2457d6" stroke-width="1.5"/>

  <line x1="380" y1="140" x2="380" y2="255" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="2,2"/>

  <!-- Right Power Rails (V+ and GND) -->
  <line x1="395" y1="140" x2="395" y2="255" stroke="#c0392b" stroke-width="3" stroke-dasharray="4,2"/>
  <line x1="425" y1="140" x2="425" y2="255" stroke="#2457d6" stroke-width="3" stroke-dasharray="4,2"/>
  <text x="410" y="134" text-anchor="middle" font-size="12" fill="#6b7280">Шини</text>

  <!-- DIP Package Plugged In -->
  <rect x="208" y="105" width="84" height="22" rx="3" fill="#1a1a1a" stroke="#4a5568" stroke-width="1"/>
  <path d="M 208,116 C 212,116 212,116 212,116" stroke="#ffffff" stroke-width="2"/>
  <text x="250" y="120" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="bold">DIP Корпус</text>
  <path d="M 221,127 L 221,145" stroke="#6b7280" stroke-width="2.5"/>
  <path d="M 281,127 L 281,145" stroke="#6b7280" stroke-width="2.5"/>

  <!-- Panel 1 Explanatory Callouts -->
  <text x="250" y="310" text-anchor="middle" font-size="12" fill="#1a1a1a">Металеві затискачі з'єднують 5 отворів вертикально</text>
  <text x="250" y="330" text-anchor="middle" font-size="12" fill="#6b7280">Центральний паз забезпечує фізичну ізоляцію боків A–E та F–J</text>

  <!-- Panel 1 Badge -->
  <rect x="48" y="365" width="399" height="60" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="247" y="387" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Стандартний геометричний крок отворів: 2.54 мм (100 mil)</text>
  <text x="247" y="410" text-anchor="middle" font-size="12" fill="#1a1a1a">Рекомендовані дротівники та штирі: AWG 22–24 (0.5–0.65 мм)</text>

  <!-- Panel 2: Longitudinal Section & Electrical Parasitics -->
  <rect x="495" y="68" width="435" height="376" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="513" y="94" font-size="14" font-weight="bold" fill="#1a1a1a">2. Будова пружинного затискача та паразити</text>

  <!-- Upper Sub-panel: Single 5-Clip Metal Strip -->
  <rect x="513" y="110" width="399" height="135" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="525" y="128" font-size="12" font-weight="bold" fill="#1a1a1a">Конструкція двокрилого пружинного затискача:</text>

  <!-- Metal Base Bar -->
  <rect x="535" y="200" width="200" height="12" fill="#b8c4d0" stroke="#4a5568" stroke-width="1" rx="2"/>

  <!-- Clip 1 (Empty) -->
  <path d="M 549,165 C 549,185 553,195 553,200 M 561,165 C 561,185 557,195 557,200" stroke="#2457d6" stroke-width="2" fill="none"/>

  <!-- Clip 2 (Wire Inserted) -->
  <path d="M 587,165 C 587,185 592,195 592,200 M 603,165 C 603,185 598,195 598,200" stroke="#2457d6" stroke-width="2" fill="none"/>
  <line x1="595" y1="135" x2="595" y2="202" stroke="#d97706" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 580,180 L 586,180" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <path d="M 610,180 L 604,180" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="588" y="148" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">Дріт AWG 22</text>

  <!-- Clip 3 (Component Lead Inserted) -->
  <line x1="635" y1="138" x2="635" y2="202" stroke="#6b7280" stroke-width="2.5"/>
  <path d="M 629,165 C 629,185 633,195 633,200 M 641,165 C 641,185 637,195 637,200" stroke="#2457d6" stroke-width="2" fill="none"/>

  <!-- Clips 4 & 5 (Empty) -->
  <path d="M 669,165 C 669,185 673,195 673,200 M 681,165 C 681,185 677,195 677,200" stroke="#2457d6" stroke-width="2" fill="none"/>
  <path d="M 709,165 C 709,185 713,195 713,200 M 721,165 C 721,185 717,195 717,200" stroke="#2457d6" stroke-width="2" fill="none"/>

  <!-- Base Bus Label -->
  <text x="660" y="230" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Суцільна металева шина (5 отворів)</text>

  <!-- Callout Parameters Box -->
  <rect x="750" y="132" width="154" height="75" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="758" y="152" font-size="12" font-weight="bold" fill="#c0392b">R_контакт = 10–50 мОм</text>
  <text x="758" y="172" font-size="12" fill="#6b7280">F_притиску ≈ 1.2 Н</text>
  <text x="758" y="192" font-size="12" fill="#6b7280">Матеріал: бронза</text>

  <!-- Lower Sub-panel: Comparison / Rules Boxes -->
  <rect x="513" y="255" width="399" height="173" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Box A: Parasitic Effects -->
  <rect x="523" y="270" width="184" height="145" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="533" y="290" font-size="12" font-weight="bold" fill="#c0392b">⛔ Паразитні ефекти</text>
  <text x="533" y="312" font-size="12" fill="#1a1a1a">• C_паразит: 2–5 пФ</text>
  <text x="533" y="334" font-size="12" fill="#1a1a1a">• L_паразит: 10–20 нГн</text>
  <text x="533" y="356" font-size="12" fill="#1a1a1a">• Частота: f &lt; 10 МГц</text>
  <text x="533" y="378" font-size="12" fill="#c0392b" font-weight="bold">• Струм: I_макс ≤ 1.5 А</text>
  <text x="533" y="400" font-size="12" fill="#6b7280">(нагрів та окислення)</text>

  <!-- Box B: Layout Best Practices -->
  <rect x="717" y="270" width="184" height="145" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="727" y="290" font-size="12" font-weight="bold" fill="#27ae60">✓ Рекомендації макету</text>
  <text x="727" y="312" font-size="12" fill="#1a1a1a">• C_декуплінг = 0.1 мкФ</text>
  <text x="727" y="334" font-size="12" fill="#1a1a1a">• Плоскі перемички</text>
  <text x="727" y="356" font-size="12" fill="#1a1a1a">• Маркування V+ / GND</text>
  <text x="727" y="378" font-size="12" fill="#27ae60" font-weight="bold">• Коротка заземлення</text>
  <text x="727" y="400" font-size="12" fill="#6b7280">(придушення завад)</text>
</svg>
