<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Маркери стрілок -->
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Фізика змочування припою та структура інтерметалевого шару</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">Флюс знижує поверхневий натяг γ_LV, забезпечуючи кут θ &lt; 30° та формування міцних фаз Cu6Sn5 і Cu3Sn</text>

  <!-- ==================== ПАНЕЛЬ 1: РІВНОВАГА ЮНГА ТА ЗМОЧУВАННЯ ==================== -->
  <rect x="25" y="85" width="445" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="35" y="95" width="425" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="247" y="114" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Рівновага Юнга та кут змочування (Макрорівень)</text>

  <!-- Мідний контакт (підкладка Cu) -->
  <rect x="55" y="315" width="385" height="35" rx="2" fill="#d97706" stroke="#b45309" stroke-width="1.5"/>
  <text x="247" y="337" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Мідний контакт (Cu substrate)</text>

  <!-- Крапля рідкого припою -->
  <path d="M 85,315 C 120,175 374,175 409,315 Z" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <text x="247" y="210" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Рідкий припой</text>
  <text x="247" y="228" font-size="12" fill="#475569" text-anchor="middle">(SAC305 / Sn63Pb37)</text>
  <text x="247" y="250" font-size="12" fill="#475569" text-anchor="middle">@@uk|поверхневий натяг@@ у масиві сплаву</text>

  <!-- Кут змочування theta (потрійна точка x=100, y=315) -->
  <!-- Базова лінія твердої поверхні -->
  <line x1="40" y1="315" x2="200" y2="315" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- Дотична до поверхні краплі -->
  <line x1="100" y1="315" x2="180" y2="275" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <!-- Дуга кута theta -->
  <path d="M 135,315 A 35,35 0 0,0 131,299" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <text x="148" y="311" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="start">θ</text>

  <!-- Вектори поверхневого натягу в потрійній точці (100, 315) -->
  <!-- γ_SV (Тверде тіло - Газ/Флюс) напрямлений ліворуч -->
  <line x1="100" y1="315" x2="45" y2="315" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="65" y="295" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">γ_SV</text>

  <!-- γ_SL (Тверде тіло - Рідина) напрямлений праворуч -->
  <line x1="100" y1="315" x2="165" y2="315" stroke="#6b7280" stroke-width="2" marker-end="url(#arr-gray)"/>
  <text x="135" y="295" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">γ_SL</text>

  <!-- γ_LV (Рідина - Газ/Флюс) напрямлений вздовж дотичної -->
  <text x="160" y="255" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">γ_LV</text>

  <!-- Картка рівняння Юнга та характеристика змочування -->
  <rect x="35" y="365" width="425" height="135" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="247" y="387" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">@@uk|рівняння Юнга@@: γ_SV = γ_SL + γ_LV · cos(θ)</text>
  <text x="48" y="410" font-size="12" fill="#27ae60" text-anchor="start">• Добре змочування (з флюсом): θ &lt; 30° (висока капілярність)</text>
  <text x="48" y="432" font-size="12" fill="#c0392b" text-anchor="start">• Погане змочування (окислення): θ &gt; 90° (кулькування припою)</text>
  <text x="48" y="454" font-size="12" fill="#1a1a1a" text-anchor="start">• Флюс розчиняє Cu2O/CuO та знижує γ_LV і γ_SL для розтікання</text>
  <text x="48" y="476" font-size="12" fill="#6b7280" text-anchor="start">• Формування металургійного зв'язку можливе лише при θ &lt; 30°</text>

  <!-- ==================== ПАНЕЛЬ 2: ПОШАРОВА СТРУКТУРА ІНТЕРМЕТАЛІДІВ ==================== -->
  <rect x="490" y="85" width="445" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="500" y="95" width="425" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="712" y="114" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">2. Пошарова структура інтерметалідів IMC (Мікрорівень)</text>

  <!-- Пошаровий зріз -->
  <!-- 1. Масив припою (Bulk Solder) -->
  <rect x="510" y="135" width="405" height="65" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1"/>
  <!-- Дрібні включення у масиві припою (розміщені збоку від центрального тексту) -->
  <ellipse cx="550" cy="150" rx="8" ry="4" fill="#94a3b8"/>
  <ellipse cx="650" cy="143" rx="10" ry="5" fill="#94a3b8"/>
  <ellipse cx="875" cy="150" rx="7" ry="4" fill="#94a3b8"/>
  <text x="712" y="158" font-size="13" font-weight="bold" fill="#1e293b" text-anchor="middle">Масив припою (Bulk Solder)</text>
  <text x="712" y="178" font-size="12" fill="#475569" text-anchor="middle">Матриця β-Sn з евтектичними включеннями Ag3Sn / Cu6Sn5</text>

  <!-- 2. η-фаза Cu6Sn5 (Гребінчаста морфологія) -->
  <path d="M 510,200 Q 525,188 540,200 Q 555,188 570,200 Q 585,188 600,200 Q 615,188 630,200 Q 645,188 660,200 Q 675,188 690,200 Q 705,188 720,200 Q 735,188 750,200 Q 765,188 780,200 Q 795,188 810,200 Q 825,188 840,200 Q 855,188 870,200 Q 885,188 900,200 Q 907,188 915,200 L 915,250 L 510,250 Z" fill="#93c5fd" stroke="#2563eb" stroke-width="1.5"/>
  <text x="712" y="222" font-size="13" font-weight="bold" fill="#1e3a8a" text-anchor="middle">@@en|η-phase@@ Cu6Sn5 (Товщина 1–3 мкм)</text>
  <text x="712" y="240" font-size="12" fill="#1e3a8a" text-anchor="middle">Гребінчаста морфологія (Scallop-like structure)</text>

  <!-- 3. ε-фаза Cu3Sn (Суцільний планарний шар) -->
  <rect x="510" y="250" width="405" height="32" fill="#fde047" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="712" y="271" font-size="13" font-weight="bold" fill="#854d0e" text-anchor="middle">@@en|ε-phase@@ Cu3Sn (Товщина 0.5–1 мкм, прилеглий до Cu)</text>

  <!-- 4. Мідна основа (Cu Substrate) -->
  <rect x="510" y="282" width="405" height="70" fill="#d97706" stroke="#b45309" stroke-width="1.5"/>
  <text x="712" y="312" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Мідна підкладка (Cu Substrate)</text>
  <text x="712" y="334" font-size="12" fill="#fef3c7" text-anchor="middle">Джерело атомів Cu для дифузійного утворення ІМС</text>

  <!-- Картка інформації про ІМС -->
  <rect x="500" y="365" width="425" height="135" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="712" y="387" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Металургійна роль @@uk|інтерметалеві сполуки|інтерметалідів@@ (IMC)</text>
  <text x="513" y="410" font-size="12" fill="#27ae60" text-anchor="start">• Cu6Sn5 формує первинний міжатомний зв'язок припаю</text>
  <text x="513" y="432" font-size="12" fill="#6b7280" text-anchor="start">• Cu3Sn росте внаслідок твердотільної дифузії при старінні</text>
  <text x="513" y="454" font-size="12" fill="#c0392b" text-anchor="start">• Надмірна товщина ІМС (&gt; 5 мкм) спричиняє крихкість шову</text>
  <text x="513" y="476" font-size="12" fill="#1a1a1a" text-anchor="start">• Контроль термопрофілю запобігає деградації паяного шову</text>
</svg>
