<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-up" markerWidth="9" markerHeight="9" refX="4" refY="1.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,8 L4,0 L8,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-left-blue" markerWidth="8" markerHeight="8" refX="0" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M7,0 L0,3.5 L7,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-left-red" markerWidth="8" markerHeight="8" refX="0" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M7,0 L0,3.5 L7,7 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Canvas background -->
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>

  <!-- Title & Subtitle -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Чотирьохзонний термопрофіль оплавлення припайної пасти (SAC305)</text>
  <text x="480" y="46" font-size="13" fill="#6b7280" text-anchor="middle">Оптимальні температурно-часові інтервали забезпечують активацію флюсу та якісне змочування</text>

  <!-- Zone background panels -->
  <rect x="120" y="60" width="140" height="330" fill="#f4f6f8" opacity="0.6"/>
  <rect x="260" y="60" width="260" height="330" fill="#eaf0fd" opacity="0.35"/>
  <rect x="520" y="60" width="220" height="330" fill="#fdecea" opacity="0.3"/>
  <rect x="740" y="60" width="140" height="330" fill="#e9f7ef" opacity="0.35"/>

  <!-- Zone vertical dividers -->
  <line x1="260" y1="60" x2="260" y2="390" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="520" y1="60" x2="520" y2="390" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="740" y1="60" x2="740" y2="390" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Zone Headers -->
  <text x="190" y="74" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Ramp-to-Soak</text>
  <text x="190" y="90" font-size="12" fill="#6b7280" text-anchor="middle">Початковий нагрів</text>

  <text x="390" y="74" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">2. Soak (Preheat)</text>
  <text x="390" y="90" font-size="12" fill="#6b7280" text-anchor="middle">Стабілізація й активація</text>

  <text x="630" y="74" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">3. Reflow / Peak</text>
  <text x="630" y="90" font-size="12" fill="#6b7280" text-anchor="middle">Оплавлення та пік</text>

  <text x="810" y="74" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">4. Cooling</text>
  <text x="810" y="90" font-size="12" fill="#6b7280" text-anchor="middle">Охолодження</text>

  <!-- Horizontal reference temperature lines -->
  <!-- 260 °C -->
  <line x1="120" y1="118" x2="880" y2="118" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2,2" opacity="0.4"/>
  <text x="112" y="122" font-size="12" fill="#6b7280" text-anchor="end">260 °C</text>

  <!-- 245 °C Peak -->
  <line x1="120" y1="138" x2="880" y2="138" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <text x="112" y="142" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">245 °C</text>

  <!-- 217 °C Liquidus -->
  <line x1="120" y1="175" x2="880" y2="175" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="4,3" opacity="0.7"/>
  <text x="112" y="179" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">217 °C</text>

  <!-- 180 °C Soak End -->
  <line x1="120" y1="224" x2="880" y2="224" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>
  <text x="112" y="228" font-size="12" fill="#6b7280" text-anchor="end">180 °C</text>

  <!-- 150 °C Soak Start -->
  <line x1="120" y1="264" x2="880" y2="264" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>
  <text x="112" y="268" font-size="12" fill="#6b7280" text-anchor="end">150 °C</text>

  <!-- 25 °C Room Temp -->
  <line x1="120" y1="375" x2="880" y2="375" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2,2" opacity="0.3"/>
  <text x="112" y="379" font-size="12" fill="#6b7280" text-anchor="end">25 °C</text>

  <!-- TAL shaded region -->
  <path d="M 565,175 C 585,150 610,138 630,138 C 650,138 675,150 695,175 Z" fill="#c0392b" opacity="0.15"/>

  <!-- Main Reflow Curve -->
  <path d="M 120,375 C 160,340 210,285 260,264 C 340,248 440,235 520,224 C 542,220 552,192 565,175 C 585,150 610,138 630,138 C 650,138 675,150 695,175 C 710,195 725,215 740,224 C 780,255 830,320 880,350" fill="none" stroke="#2457d6" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Peak point & annotations -->
  <circle cx="630" cy="138" r="5" fill="#c0392b" stroke="#ffffff" stroke-width="2"/>
  <line x1="630" y1="138" x2="630" y2="390" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  <text x="630" y="118" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">T_peak = 245 °C (235…250 °C)</text>

  <!-- TAL arrow & label -->
  <line x1="565" y1="160" x2="695" y2="160" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-left-red)" marker-end="url(#arr-red)"/>
  <line x1="565" y1="160" x2="565" y2="175" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="695" y1="160" x2="695" y2="175" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="630" y="153" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">TAL = 40…90 s (T &gt; 217 °C)</text>

  <!-- Reflow ramp gradient -->
  <text x="510" y="195" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="end">+1.5…+2.5 °C/s</text>

  <!-- Zone 2 Annotations -->
  <text x="390" y="240" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вирівнювання T та активація флюсу</text>
  <text x="390" y="255" font-size="11" fill="#6b7280" text-anchor="middle">тривалість t = 60…120 s | ΔT &lt; 5 °C</text>
  <line x1="260" y1="275" x2="520" y2="275" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-left-blue)" marker-end="url(#arr-blue)"/>
  <rect x="330" y="285" width="120" height="20" fill="#ffffff" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="390" y="299" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">t_soak = 60…120 s</text>

  <!-- Zone 1 Annotations -->
  <text x="190" y="200" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">+1.0…+3.0 °C/s</text>
  <text x="190" y="214" font-size="11" fill="#6b7280" text-anchor="middle">градієнт нагріву</text>

  <!-- Zone 4 Annotations -->
  <text x="810" y="245" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">-2.0…-4.0 °C/s</text>
  <text x="810" y="260" font-size="11" fill="#6b7280" text-anchor="middle">формування дрібного зерна</text>

  <!-- Axes -->
  <line x1="120" y1="390" x2="120" y2="105" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-up)"/>
  <text x="30" y="94" font-size="13" font-weight="bold" fill="#1a1a1a">T (°C)</text>

  <line x1="120" y1="390" x2="895" y2="390" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="902" y="404" font-size="13" font-weight="bold" fill="#1a1a1a">t (s)</text>

  <!-- X ticks and time labels -->
  <line x1="120" y1="390" x2="120" y2="396" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="120" y="416" font-size="12" fill="#6b7280" text-anchor="middle">0 s</text>

  <line x1="260" y1="390" x2="260" y2="396" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="260" y="416" font-size="12" fill="#6b7280" text-anchor="middle">60…90 s</text>

  <line x1="520" y1="390" x2="520" y2="396" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="520" y="416" font-size="12" fill="#6b7280" text-anchor="middle">180 s</text>

  <line x1="740" y1="390" x2="740" y2="396" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="740" y="416" font-size="12" fill="#6b7280" text-anchor="middle">250 s</text>

  <line x1="880" y1="390" x2="880" y2="396" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="880" y="416" font-size="12" fill="#6b7280" text-anchor="middle">310 s</text>

  <!-- Bottom Cards -->
  <!-- Card 1 -->
  <rect x="30" y="435" width="290" height="70" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="42" y="453" font-size="12" font-weight="bold" fill="#1a1a1a">Сплав SAC305 (Sn96.5Ag3.0Cu0.5)</text>
  <text x="42" y="471" font-size="12" fill="#6b7280">• T_солідус = T_ліквідус = 217 °C</text>
  <text x="42" y="489" font-size="12" fill="#6b7280">• Оптимум T_peak = 240…245 °C</text>

  <!-- Card 2 -->
  <rect x="335" y="435" width="290" height="70" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" stroke-opacity="0.5" rx="6"/>
  <text x="347" y="453" font-size="12" font-weight="bold" fill="#2457d6">Час оплавлення та витримка</text>
  <text x="347" y="471" font-size="12" fill="#1a1a1a">• TAL (T &gt; 217 °C): 40…90 s (IMC 1–3 мкм)</text>
  <text x="347" y="489" font-size="12" fill="#1a1a1a">• Soak: 60…120 s при T = 150…180 °C</text>

  <!-- Card 3 -->
  <rect x="640" y="435" width="290" height="70" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-opacity="0.5" rx="6"/>
  <text x="652" y="453" font-size="12" font-weight="bold" fill="#c0392b">Запобігання дефектам</text>
  <text x="652" y="471" font-size="12" fill="#1a1a1a">• Ramp &gt; 3 °C/s: "надгробки" та бризки</text>
  <text x="652" y="489" font-size="12" fill="#1a1a1a">• Cooling &lt; 2 °C/s: грубий ріст IMC</text>
</svg>
