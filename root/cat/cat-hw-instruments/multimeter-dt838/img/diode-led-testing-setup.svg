<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Header -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Діагностика діодів та світлодіодів мультиметром DT-838</text>
  <text x="480" y="57" font-size="13" fill="#6b7280" text-anchor="middle">Показання дисплея в режимі ➔| для прямого/зворотного ввімкнення, норми U_f та несправностей</text>

  <!-- Panel 1: Rectifier Diode (Left) -->
  <rect x="30" y="75" width="435" height="455" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Перевірка випрямного діода (1N4007)</text>

  <!-- Case 1A: Forward Bias -->
  <rect x="45" y="110" width="405" height="185" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="60" y="130" font-size="13" font-weight="bold" fill="#27ae60">Пряме ввімкнення (Forward Bias)</text>

  <text x="60" y="155" font-size="12" font-weight="bold" fill="#c0392b">Червоний (+ VΩmA)</text>
  <text x="220" y="155" font-size="12" font-weight="bold" fill="#1a1a1a">Чорний (- COM)</text>

  <!-- Diode drawing -->
  <line x1="110" y1="182" x2="160" y2="182" stroke="#c0392b" stroke-width="3"/>
  <line x1="230" y1="182" x2="280" y2="182" stroke="#1a1a1a" stroke-width="3"/>
  <rect x="160" y="170" width="70" height="24" rx="3" fill="#1a1a1a"/>
  <rect x="215" y="170" width="10" height="24" fill="#d0d7de"/>

  <text x="110" y="168" font-size="11" font-weight="bold" fill="#c0392b">Анод (+)</text>
  <text x="240" y="168" font-size="11" font-weight="bold" fill="#1a1a1a">Катод (-)</text>

  <line x1="130" y1="198" x2="260" y2="198" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="195" y="212" font-size="11" fill="#27ae60" text-anchor="middle">Струм проходить (I_test ≈ 1 mA)</text>

  <!-- Display Box 1A -->
  <rect x="315" y="135" width="120" height="70" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="375" y="150" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="middle">Дисплей DT-838</text>
  <text x="375" y="180" font-size="22" font-weight="bold" fill="#1a1a1a" text-anchor="middle">542</text>
  <text x="375" y="196" font-size="10" fill="#27ae60" text-anchor="middle">мВ (U_f)</text>

  <text x="60" y="245" font-size="12" font-weight="bold" fill="#27ae60">✓ Норма для Si діода: U_f = 400 – 700 мВ</text>
  <text x="60" y="265" font-size="11" fill="#6b7280">Для германієвих (Ge) діодів: U_f = 150 – 300 мВ</text>


  <!-- Case 1B: Reverse Bias -->
  <rect x="45" y="305" width="405" height="210" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="60" y="325" font-size="13" font-weight="bold" fill="#2457d6">Зворотне ввімкнення (Reverse Bias)</text>

  <text x="60" y="350" font-size="12" font-weight="bold" fill="#1a1a1a">Чорний (- COM)</text>
  <text x="210" y="350" font-size="12" font-weight="bold" fill="#c0392b">Червоний (+ VΩmA)</text>

  <!-- Diode drawing reversed probes connection -->
  <line x1="110" y1="377" x2="160" y2="377" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="230" y1="377" x2="280" y2="377" stroke="#c0392b" stroke-width="3"/>
  <rect x="160" y="365" width="70" height="24" rx="3" fill="#1a1a1a"/>
  <rect x="215" y="365" width="10" height="24" fill="#d0d7de"/>

  <line x1="130" y1="393" x2="260" y2="393" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="195" y="408" font-size="11" fill="#6b7280" text-anchor="middle">Струм заблоковано (I_rev ≈ 0)</text>

  <!-- Display Box 1B -->
  <rect x="315" y="330" width="120" height="70" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="375" y="345" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="middle">Дисплей DT-838</text>
  <text x="375" y="375" font-size="22" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1 .</text>
  <text x="375" y="391" font-size="10" fill="#2457d6" text-anchor="middle">Обрив / Нескінченність</text>

  <text x="60" y="445" font-size="12" font-weight="bold" fill="#2457d6">✓ Перехід закритий: Одиниця ліворуч (1 .)</text>
  <text x="60" y="465" font-size="11" fill="#6b7280">Свідчить про абсолютну відсутність витоку струму</text>


  <!-- Panel 2: LED & Faults (Right) -->
  <rect x="495" y="75" width="435" height="455" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="712" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Перевірка LED та види несправностей</text>

  <!-- Case 2A: LED Testing -->
  <rect x="510" y="110" width="405" height="185" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="525" y="130" font-size="13" font-weight="bold" fill="#27ae60">Перевірка світлодіода (LED)</text>

  <text x="525" y="155" font-size="11" font-weight="bold" fill="#c0392b">Червоний (+ VΩmA)</text>
  <text x="665" y="155" font-size="11" font-weight="bold" fill="#1a1a1a">Чорний (- COM)</text>

  <!-- LED drawing -->
  <line x1="575" y1="182" x2="622" y2="182" stroke="#c0392b" stroke-width="3"/>
  <line x1="658" y1="182" x2="705" y2="182" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="640" cy="182" r="18" fill="#27ae60" opacity="0.85" stroke="#1e8449" stroke-width="2"/>

  <!-- Light emission rays -->
  <line x1="652" y1="168" x2="664" y2="156" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="658" y1="174" x2="670" y2="162" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <text x="575" y="170" font-size="10" font-weight="bold" fill="#c0392b">Анод (+ довша)</text>
  <text x="665" y="170" font-size="10" font-weight="bold" fill="#1a1a1a">Катод (- скос)</text>

  <!-- Display Box 2A -->
  <rect x="780" y="135" width="120" height="70" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="840" y="150" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="middle">Дисплей DT-838</text>
  <text x="840" y="180" font-size="22" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1850</text>
  <text x="840" y="196" font-size="10" fill="#27ae60" text-anchor="middle">мВ (U_f LED)</text>

  <text x="525" y="245" font-size="12" font-weight="bold" fill="#27ae60">✓ Червоний/Зелений LED слабко світиться!</text>
  <text x="525" y="265" font-size="11" fill="#6b7280">U_f LED: Червоний ~1.8V, Синій ~3.0V (може бути 1 .)</text>


  <!-- Case 2B: Fault Diagnostics -->
  <rect x="510" y="305" width="405" height="210" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="525" y="325" font-size="13" font-weight="bold" fill="#c0392b">Діагностика несправностей (Пробій / Обрив)</text>

  <!-- Fault 1 -->
  <rect x="525" y="340" width="375" height="70" rx="4" fill="#ffffff" stroke="#c0392b" stroke-dasharray="3,3"/>
  <text x="535" y="358" font-size="12" font-weight="bold" fill="#c0392b">1. Коротке замикання (Пробій P-N переходу):</text>
  <text x="545" y="376" font-size="12" fill="#1a1a1a">• Дисплей: 000 ... 005 мВ в ОБОХ напрямках</text>
  <text x="545" y="394" font-size="12" font-weight="bold" fill="#c0392b">🔊 Безперервний звуковий сигнал (прозвонка &lt; 50 Ω)</text>

  <!-- Fault 2 -->
  <rect x="525" y="425" width="375" height="70" rx="4" fill="#ffffff" stroke="#c0392b" stroke-dasharray="3,3"/>
  <text x="535" y="443" font-size="12" font-weight="bold" fill="#c0392b">2. Обрив кристала або виводу (Open Circuit):</text>
  <text x="545" y="461" font-size="12" fill="#1a1a1a">• Дисплей: 1 . в ОБОХ напрямках (і прямому, і зворотному)</text>
  <text x="545" y="479" font-size="12" fill="#6b7280">⛔ Струм не проходить ні в одну сторону (немає світіння)</text>

</svg>
