<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Markers -->
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Обмеження аналогового гальванометра при вимірюваннях</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Шунтування кола низьким вхідним опором (R_вх) та похибка паралаксу при зчитуванні</text>

  <!-- PANEL 1: LOADING EFFECT -->
  <rect x="30" y="75" width="435" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Шунтувальний вплив вхідного опору (R_вх)</text>

  <!-- Circuit Diagram -->
  <!-- Source Vs -->
  <circle cx="70" cy="190" r="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="70" y="185" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">+</text>
  <text x="70" y="200" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">−</text>
  <text x="46" y="194" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Vs = 10 В</text>

  <!-- Top Wire & Rs -->
  <line x1="70" y1="174" x2="70" y2="140" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="70" y1="140" x2="120" y2="140" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="120" y="132" width="100" height="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="170" y="122" font-size="12" fill="#1a1a1a" text-anchor="middle">Rs = 100 кОм</text>
  <line x1="220" y1="140" x2="250" y2="140" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Node A -->
  <circle cx="250" cy="140" r="3.5" fill="#1a1a1a"/>

  <!-- RL Resistor -->
  <line x1="250" y1="140" x2="250" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="242" y="160" width="16" height="60" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="234" y="194" font-size="12" fill="#1a1a1a" text-anchor="end">RL = 100 кОм</text>
  <line x1="250" y1="220" x2="250" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Node B -->
  <circle cx="250" cy="240" r="3.5" fill="#1a1a1a"/>

  <!-- Bottom Wire -->
  <line x1="70" y1="206" x2="70" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="70" y1="240" x2="360" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Meter Connection -->
  <line x1="250" y1="140" x2="360" y2="140" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="360" y1="140" x2="360" y2="165" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="360" y1="240" x2="360" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Shunt Current Arrow -->
  <line x1="275" y1="140" x2="310" y2="140" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="292" y="132" font-size="11" fill="#c0392b" text-anchor="middle">I_шунт</text>

  <!-- Analogue Meter Box -->
  <rect x="320" y="165" width="80" height="75" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="360" y="185" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Гальванометр</text>
  <text x="360" y="203" font-size="12" fill="#c0392b" text-anchor="middle">R_вх = 20 кОм</text>
  <circle cx="360" cy="223" r="9" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="360" y="227" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">V</text>

  <!-- Box 1: Ideal / DMM -->
  <rect x="45" y="260" width="405" height="55" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="55" y="278" font-size="12" font-weight="bold" fill="#27ae60">Ідеальний режим або ЦИФРОВИЙ мультиметр (R_вх = 10 МОм):</text>
  <text x="55" y="300" font-size="12" fill="#1a1a1a">V_падежу = 10 В × (100 кОм / 200 кОм) = 5.00 В   (Похибка 0%)</text>

  <!-- Box 2: Loading Effect -->
  <rect x="45" y="325" width="405" height="75" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="55" y="343" font-size="12" font-weight="bold" fill="#c0392b">АНАЛОГОВИЙ прилад (R_вх = 20 кОм шунтує RL):</text>
  <text x="55" y="363" font-size="12" fill="#1a1a1a">R_екв = 100 кОм || 20 кОм = 16.67 кОм</text>
  <text x="55" y="385" font-size="12" font-weight="bold" fill="#c0392b">V_виміряна = 10 В × (16.67 / 116.7) = 1.43 В   (Похибка -71%)</text>

  <!-- Panel 1 Summary -->
  <rect x="45" y="410" width="405" height="75" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="428" font-size="12" font-weight="bold" fill="#1a1a1a">Висновок:</text>
  <text x="55" y="448" font-size="12" fill="#6b7280">Низький вхідний опір стрілочного приладу викривляє</text>
  <text x="55" y="468" font-size="12" fill="#6b7280">режим роботи високоомних кіл, занижуючи реальну напругу.</text>

  <!-- PANEL 2: PARALLAX ERROR -->
  <rect x="495" y="75" width="435" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="712" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Похибка кута зору (паралакс)</text>

  <!-- Observers -->
  <!-- Left Eye -->
  <text x="560" y="120" font-size="12" fill="#c0392b" text-anchor="middle">Кут &lt; 90°</text>
  <circle cx="560" cy="140" r="12" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="560" cy="140" r="4" fill="#c0392b"/>

  <!-- Center Eye -->
  <text x="712" y="110" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Прямий кут (90°)</text>
  <circle cx="712" cy="130" r="12" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="712" cy="130" r="4" fill="#27ae60"/>

  <!-- Right Eye -->
  <text x="864" y="120" font-size="12" fill="#c0392b" text-anchor="middle">Кут &gt; 90°</text>
  <circle cx="864" cy="140" r="12" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="864" cy="140" r="4" fill="#c0392b"/>

  <!-- Sight Lines -->
  <!-- Center Line -->
  <line x1="712" y1="144" x2="712" y2="258" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Left Line -->
  <line x1="560" y1="154" x2="792" y2="258" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>

  <!-- Right Line -->
  <line x1="864" y1="154" x2="632" y2="258" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>

  <!-- Pointer (Needle) -->
  <circle cx="712" cy="205" r="4" fill="#1a1a1a"/>
  <line x1="712" y1="205" x2="712" y2="235" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="725" y="210" font-size="12" font-weight="bold" fill="#1a1a1a">Стрілка приладу</text>

  <!-- Height Gap Indicator -->
  <line x1="525" y1="205" x2="525" y2="240" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="520" y1="205" x2="530" y2="205" stroke="#6b7280" stroke-width="1"/>
  <line x1="520" y1="240" x2="530" y2="240" stroke="#6b7280" stroke-width="1"/>
  <text x="518" y="226" font-size="11" fill="#6b7280" text-anchor="end">зазор h</text>

  <!-- Scale Plate -->
  <rect x="535" y="240" width="370" height="35" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Mirror Strip -->
  <rect x="575" y="244" width="315" height="8" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="795" y="251" font-size="11" fill="#2457d6" text-anchor="start">Дзеркальна смужка</text>

  <!-- Scale Ticks -->
  <line x1="630" y1="260" x2="630" y2="273" stroke="#c0392b" stroke-width="2"/>
  <line x1="712" y1="256" x2="712" y2="273" stroke="#27ae60" stroke-width="2.5"/>
  <line x1="794" y1="260" x2="794" y2="273" stroke="#c0392b" stroke-width="2"/>

  <!-- Scale Readings -->
  <text x="630" y="290" font-size="12" fill="#c0392b" text-anchor="middle">3.8 В</text>
  <text x="712" y="290" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">5.0 В (Точно)</text>
  <text x="794" y="290" font-size="12" fill="#c0392b" text-anchor="middle">6.2 В</text>

  <!-- Panel 2 Box A: Cause -->
  <rect x="510" y="310" width="405" height="80" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="520" y="328" font-size="12" font-weight="bold" fill="#1a1a1a">Причина паралаксу:</text>
  <text x="520" y="348" font-size="12" fill="#6b7280">Стрілка піднята над площиною шкали на висоту h.</text>
  <text x="520" y="365" font-size="12" fill="#6b7280">При погляді під кутом проекція стрілки зміщується,</text>
  <text x="520" y="382" font-size="12" fill="#c0392b">створюючи фальшивий відлік (похибка до 5–10%).</text>

  <!-- Panel 2 Box B: Solution -->
  <rect x="510" y="400" width="405" height="85" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="520" y="418" font-size="12" font-weight="bold" fill="#27ae60">Метод усунення (Правильне зчитування):</text>
  <text x="520" y="438" font-size="12" fill="#1a1a1a">Оператор повинен дивитися чітко перпендикулярно,</text>
  <text x="520" y="456" font-size="12" fill="#1a1a1a">щоб стрілка повністю перекривала свій відбиток у дзеркалі.</text>
  <text x="520" y="474" font-size="12" font-weight="bold" fill="#27ae60">Цифрові РК-дисплеї (DT-838) позбавлені цієї похибки.</text>
</svg>
