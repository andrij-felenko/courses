<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Header -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема комутації вхідних гнізд та перемикача режимів DT-838</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Маршрутизація сигналів між гніздами COM, VΩmA, 10ADC та вхідними колами АЦП</text>

  <!-- COLUMN 1: Input Terminals -->
  <rect x="30" y="80" width="200" height="430" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="130" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Вхідні гнізда (Inputs)</text>

  <!-- Red Socket V/Ohm/mA -->
  <rect x="45" y="120" width="170" height="70" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="130" y="143" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">V / Ω / mA (Червоне)</text>
  <text x="130" y="161" text-anchor="middle" font-size="11" fill="#6b7280">DCV, ACV, Ω, mA, °C</text>
  <text x="130" y="177" text-anchor="middle" font-size="11" fill="#6b7280">Макс. 1000V DC / 750V AC</text>

  <!-- Black Socket COM -->
  <rect x="45" y="210" width="170" height="55" rx="6" fill="#1a1a1a"/>
  <text x="130" y="234" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">COM (Спільний GND)</text>
  <text x="130" y="251" text-anchor="middle" font-size="11" fill="#d0d7de">Земля вимірювання</text>

  <!-- Blue Socket 10ADC -->
  <rect x="45" y="285" width="170" height="65" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="130" y="308" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">10ADC (Синє)</text>
  <text x="130" y="325" text-anchor="middle" font-size="11" fill="#6b7280">Постійний струм до 10 А</text>
  <text x="130" y="340" text-anchor="middle" font-size="11" fill="#c0392b">Без запобіжника (max 10s)</text>

  <!-- Socket Temp / hFE -->
  <rect x="45" y="370" width="170" height="65" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="130" y="393" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Гніздо Temp / hFE</text>
  <text x="130" y="410" text-anchor="middle" font-size="11" fill="#6b7280">Термопара K-типу</text>
  <text x="130" y="426" text-anchor="middle" font-size="11" fill="#6b7280">Сокет транзисторів NPN/PNP</text>


  <!-- COLUMN 2: Rotary Switch Selector -->
  <rect x="260" y="80" width="370" height="430" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="445" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Селектор режимів (Rotary Switch)</text>

  <!-- Sector 1: Voltage DCV / ACV -->
  <rect x="275" y="120" width="340" height="75" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="445" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Секція напруги (DCV / ACV)</text>
  <text x="445" y="160" text-anchor="middle" font-size="11" fill="#1a1a1a">Комутація точних дільників 9M, 900k, 90k, 9k</text>
  <text x="445" y="177" text-anchor="middle" font-size="11" fill="#6b7280">Увімкнення диодного випрямляча для ACV</text>

  <!-- Sector 2: Low Current DCA -->
  <rect x="275" y="210" width="340" height="75" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="445" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Секція малого струму (DCA 200µA–200mA)</text>
  <text x="445" y="250" text-anchor="middle" font-size="11" fill="#1a1a1a">Комутація внутрішнього шунта R_s = 9.9 Ом</text>
  <text x="445" y="267" text-anchor="middle" font-size="11" fill="#c0392b">Захист плавким запобіжником 0.5 А / 250 V</text>

  <!-- Sector 3: Resistance, Temp & hFE -->
  <rect x="275" y="300" width="340" height="75" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="445" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Секція опору, температури та hFE</text>
  <text x="445" y="340" text-anchor="middle" font-size="11" fill="#1a1a1a">Подача еталонного струму I_ref для вимірювання Ω</text>
  <text x="445" y="357" text-anchor="middle" font-size="11" fill="#6b7280">Підключення зумера продзвону (R &lt; 50 Ом)</text>

  <!-- Sector 4: High Current 10A DC -->
  <rect x="275" y="390" width="340" height="75" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="445" y="412" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Секція великого струму (10A DC)</text>
  <text x="445" y="430" text-anchor="middle" font-size="11" fill="#1a1a1a">Пряме підключення гнізда 10ADC до шунта 0.01 Ом</text>
  <text x="445" y="447" text-anchor="middle" font-size="11" fill="#6b7280">Сигнальна лінія напряму до входу АЦП IN HI</text>


  <!-- COLUMN 3: ADC Core Inputs -->
  <rect x="660" y="80" width="270" height="430" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="795" y="102" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Входи АЦП ICL7106</text>

  <!-- Block A: IN HI Input -->
  <rect x="675" y="130" width="240" height="90" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="795" y="153" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Вхід IN HI (+)</text>
  <text x="795" y="171" text-anchor="middle" font-size="11" fill="#1a1a1a">Масштабований сигнал ±200.0 мВ</text>
  <text x="795" y="188" text-anchor="middle" font-size="11" fill="#6b7280">Захисний PTC-резистор &amp; діоди</text>
  <text x="795" y="204" text-anchor="middle" font-size="11" fill="#6b7280">Фільтр високих частот RC</text>

  <!-- Block B: 10A Shunt -->
  <rect x="675" y="240" width="240" height="80" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="795" y="263" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Шунт R_10A (0.01 Ом)</text>
  <text x="795" y="281" text-anchor="middle" font-size="11" fill="#1a1a1a">Калібрований манганіновий дріт</text>
  <text x="795" y="298" text-anchor="middle" font-size="11" fill="#6b7280">Спад напруги 100 мВ при I = 10 А</text>

  <!-- Block C: IN LO & GND Input -->
  <rect x="675" y="340" width="240" height="90" rx="6" fill="#1a1a1a"/>
  <text x="795" y="365" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Вхід IN LO (-) &amp; Спільний GND</text>
  <text x="795" y="383" text-anchor="middle" font-size="11" fill="#d0d7de">Штучна середня точка батареї 9V</text>
  <text x="795" y="400" text-anchor="middle" font-size="11" fill="#d0d7de">Потенціал V_GND = +2.8 V від V+</text>
  <text x="795" y="416" text-anchor="middle" font-size="11" fill="#27ae60">Опорна напруга V_REF = 100 мВ</text>


  <!-- CONNECTING PATHS & ARROWS -->
  <!-- Connection 1: Red Socket -> Selector -->
  <path d="M 215 155 L 275 155" stroke="#2457d6" stroke-width="2" fill="none" marker-end="url(#arr-blue)"/>
  <text x="245" y="147" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">V_in / I_in</text>

  <!-- Connection 2: 10ADC Socket -> Sector 4 -->
  <path d="M 215 317 L 245 317 L 245 427 L 275 427" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arr-red)"/>
  <text x="238" y="370" text-anchor="end" font-size="11" font-weight="bold" fill="#c0392b">I_10A</text>

  <!-- Connection 3: Selector -> ADC IN HI -->
  <path d="M 615 157 L 675 157" stroke="#2457d6" stroke-width="2" fill="none" marker-end="url(#arr-blue)"/>
  <text x="645" y="149" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">U_scaled</text>

  <!-- Connection 4: COM Socket -> ADC IN LO -->
  <path d="M 215 237 L 240 237 L 240 480 L 640 480 L 640 385 L 675 385" stroke="#1a1a1a" stroke-width="2" fill="none" marker-end="url(#arr-gray)"/>
  <text x="440" y="495" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Прямий провідник COM -&gt; IN LO</text>
</svg>
