<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Marker Definitions -->
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Canvas background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Main Title -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Ієрархія SCPI-команд керування часовою розгорткою та режимом Roll Mode</text>
  <!-- Subtitle -->
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Команда :TIMebase:MODE перемикає розгортку між MAIN та ROLL, залежно від масштабу :TIMebase:SCALe та порогу auto-roll</text>

  <!-- TOP PANELS: SCPI SUBSYSTEMS -->
  <!-- TIMebase Subsystem -->
  <rect x="40" y="75" width="420" height="125" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="60" y="98" font-size="14" font-weight="bold" fill="#2457d6">Підсистема :TIMebase</text>
  <text x="60" y="122" font-size="13" font-weight="bold" fill="#1a1a1a">:TIMebase:MODE {MAIN | ROLL | XY}</text>
  <text x="60" y="142" font-size="13" fill="#1a1a1a">:TIMebase:SCALe &lt;значення_масштабу&gt;</text>
  <text x="60" y="162" font-size="12" fill="#6b7280">(Налаштування масштабу часу, наприклад: 500 ms/div)</text>

  <!-- WAVeform Subsystem -->
  <rect x="500" y="75" width="420" height="125" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="520" y="98" font-size="14" font-weight="bold" fill="#2457d6">Підсистема :WAVeform</text>
  <text x="520" y="122" font-size="13" fill="#1a1a1a">:WAVeform:SOURce CHANnel1</text>
  <text x="520" y="142" font-size="13" fill="#1a1a1a">:WAVeform:FORMat {BYTE | WORD | ASCii}</text>
  <text x="520" y="162" font-size="13" font-weight="bold" fill="#27ae60">:WAVeform:DATA?  (Зчитування масиву вибірок)</text>

  <!-- MIDDLE SECTION: AUTO-ROLL THRESHOLD DECISION -->
  <rect x="280" y="215" width="400" height="55" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="480" y="235" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Автоматична активація за порогом SCALe:</text>
  <text x="480" y="253" font-size="12" fill="#6b7280" text-anchor="middle">Поріг auto-roll threshold (зазвичай SCALe ≥ 200 ms/div)</text>

  <!-- Connecting Arrows -->
  <!-- TIMebase -> Threshold Box -->
  <line x1="250" y1="200" x2="350" y2="215" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- WAVeform -> ROLL Mode direct link -->
  <line x1="710" y1="200" x2="710" y2="285" stroke="#27ae60" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arr-green)"/>

  <!-- Threshold -> MAIN Mode (Left Arrow) -->
  <line x1="340" y1="270" x2="250" y2="285" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>
  <text x="240" y="268" font-size="12" fill="#6b7280" text-anchor="end">SCALe &lt; 200 ms/div</text>

  <!-- Threshold -> ROLL Mode (Right Arrow) -->
  <line x1="620" y1="270" x2="710" y2="285" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="720" y="268" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">SCALe ≥ 200 ms/div</text>

  <!-- BOTTOM PANELS: OPERATIONAL MODES -->
  <!-- LEFT: MAIN Mode Panel -->
  <rect x="40" y="290" width="420" height="160" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="60" y="315" font-size="14" font-weight="bold" fill="#1a1a1a">Режим MAIN (Швидкі сигнали)</text>
  <text x="60" y="340" font-size="12" fill="#1a1a1a">• Тригерний запуск: Чекає події тригера (Wait for Trigger)</text>
  <text x="60" y="362" font-size="12" fill="#1a1a1a">• Оновлення: Екран оновлюється цілими кадрами</text>
  <text x="60" y="384" font-size="12" fill="#1a1a1a">• Буфер: Фіксована довжина кадру вибірок</text>
  <text x="60" y="406" font-size="12" fill="#6b7280">• Вивантаження: Запит :WAV:DATA? повертає статичний кадр</text>

  <!-- RIGHT: ROLL Mode Panel -->
  <rect x="500" y="290" width="420" height="160" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="520" y="315" font-size="14" font-weight="bold" fill="#27ae60">Режим ROLL (Повільні процеси / Самописець)</text>
  <text x="520" y="340" font-size="12" fill="#1a1a1a">✓ Безперервний збір: Тригер вимкнено (Trigger Disabled)</text>
  <text x="520" y="362" font-size="12" fill="#1a1a1a">✓ Оновлення: Сигнал плавно прокручується справа наліво</text>
  <text x="520" y="384" font-size="12" fill="#1a1a1a">✓ Буфер: Циклічний оновлюваний кільцевий буфер ОЗП</text>
  <text x="520" y="406" font-size="12" font-weight="bold" fill="#27ae60">✓ Вивантаження: Запит :WAV:DATA? повертає потоковий масив</text>
</svg>
