<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Header -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема кільцевого буфера пам'яті та часової розгортки у режимі Roll Mode</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Математичний зв'язок між частотою дискретизації f_s, глибиною буфера N_depth та часовим вікном T_window</text>

  <!-- Left Panel: Ring Buffer Visual -->
  <rect x="40" y="85" width="350" height="420" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="215" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Структура кільцевого буфера</text>

  <!-- Outer Ring Circle -->
  <circle cx="215" cy="275" r="125" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <!-- Inner Ring Circle -->
  <circle cx="215" cy="275" r="80" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Ring Memory Cells / Sectors -->
  <!-- Sector 0: Write Head (Active Blue) -->
  <path d="M 215,150 A 125,125 0 0,1 323,212 L 284,235 A 80,80 0 0,0 215,195 Z" fill="#2457d6" stroke="#ffffff" stroke-width="1.5"/>
  <!-- Display Window Sectors (Active Green) -->
  <path d="M 127,186 A 125,125 0 0,1 215,150 L 215,195 A 80,80 0 0,0 159,218 Z" fill="#27ae60" stroke="#ffffff" stroke-width="1.5"/>
  <path d="M 90,275 A 125,125 0 0,1 127,186 L 159,218 A 80,80 0 0,0 135,275 Z" fill="#27ae60" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Pre-trigger Stored History Sectors (Light Blue) -->
  <path d="M 323,212 A 125,125 0 0,1 340,275 L 295,275 A 80,80 0 0,0 284,235 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <path d="M 340,275 A 125,125 0 0,1 323,338 L 284,315 A 80,80 0 0,0 295,275 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <path d="M 323,338 A 125,125 0 0,1 215,400 L 215,355 A 80,80 0 0,0 284,315 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <path d="M 215,400 A 125,125 0 0,1 107,338 L 146,315 A 80,80 0 0,0 215,355 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <path d="M 107,338 A 125,125 0 0,1 90,275 L 135,275 A 80,80 0 0,0 146,315 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>

  <!-- Write Pointer Arrow -->
  <line x1="330" y1="168" x2="292" y2="195" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="350" y="145" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">Write Pointer (f_s)</text>
  <text x="350" y="160" text-anchor="end" font-size="11" fill="#6b7280">(Запис АЦП)</text>

  <!-- Screen Window Label -->
  <text x="120" y="150" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Вікно T_window</text>
  <text x="120" y="165" text-anchor="middle" font-size="11" fill="#6b7280">(N_screen відліків)</text>

  <!-- Center Text of Ring -->
  <text x="215" y="262" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Кільцевий буфер</text>
  <text x="215" y="280" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">N_depth відліків</text>
  <text x="215" y="298" text-anchor="middle" font-size="11" fill="#6b7280">Зациклена пам'ять</text>

  <!-- Bottom Legend inside Left Panel -->
  <rect x="52" y="415" width="326" height="75" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <circle cx="67" cy="433" r="6" fill="#2457d6"/>
  <text x="82" y="437" font-size="11" fill="#1a1a1a">Вказівник запису АЦП (Запис нового відліку)</text>

  <circle cx="67" cy="453" r="6" fill="#27ae60"/>
  <text x="82" y="457" font-size="11" fill="#1a1a1a">Вікно дисплея (N_screen відліків на екрані)</text>

  <circle cx="67" cy="473" r="6" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="82" y="477" font-size="11" fill="#1a1a1a">Буфер передісторії (N_depth - N_screen)</text>

  <!-- Right Panel 1: Display Window -->
  <rect x="410" y="85" width="510" height="125" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="425" y="108" font-size="14" font-weight="bold" fill="#2457d6">1. Часове вікно дисплея (T_window)</text>
  <text x="425" y="133" font-size="12" fill="#1a1a1a">• Тривалість розгортки: T_window = t_div × N_div</text>
  <text x="425" y="155" font-size="12" fill="#1a1a1a">• Кількість відліків на екрані: N_screen = f_s × T_window</text>
  <text x="425" y="177" font-size="11" fill="#6b7280">• Оновлення пікселя растру: t_pixel = T_window / X_res (f_fps = 1 / t_pixel)</text>

  <!-- Right Panel 2: Memory Depth & Autonomous Record Time -->
  <rect x="410" y="225" width="510" height="135" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="425" y="248" font-size="14" font-weight="bold" fill="#27ae60">2. Автономний запис та глибина буфера (N_depth)</text>
  <text x="425" y="273" font-size="12" fill="#1a1a1a">• Необхідна глибина пам'яті: N_depth = f_s × T_record</text>
  <text x="425" y="295" font-size="12" fill="#1a1a1a">• Максимальний час запису до зупинки: T_record = N_depth / f_s</text>
  <text x="425" y="317" font-size="12" fill="#1a1a1a">• Збережена передісторія тригера: T_pre = η × T_record (де η ∈ [0, 1])</text>
  <text x="425" y="339" font-size="11" fill="#6b7280">• При примусовій зупинці буфер зберігає повну передісторію процесів.</text>

  <!-- Right Panel 3: Sampling & Peak Detect -->
  <rect x="410" y="375" width="510" height="130" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="425" y="398" font-size="14" font-weight="bold" fill="#c0392b">3. Дискретизація та піковий детектор</text>
  <text x="425" y="423" font-size="12" fill="#1a1a1a">• Критерій Найквіста — Шеннона: f_s ≥ 2 × f_max</text>
  <text x="425" y="445" font-size="12" fill="#1a1a1a">• Децимація вибірок АЦП: K_dec = f_ADC / f_s</text>
  <text x="425" y="467" font-size="12" fill="#1a1a1a">• Режим Peak Detect фіксує екстремуми (V_min, V_max) для усунення пропусків</text>
  <text x="425" y="489" font-size="11" fill="#6b7280">• Гарантує відображення короткочасних імпульсних завад (glitch).</text>
</svg>
