<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Markers -->
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Потокове зчитування вибірок з кільцевого буфера в режимі Roll Mode</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Взаємодія покажчика запису АЦП та SCPI-команд зчитування (:WAV:DATA?) без зупинки збору даних</text>

  <!-- PANEL 1: CIRCULAR BUFFER -->
  <rect x="30" y="75" width="435" height="385" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Кільцевий буфер ОЗП (АЦП vs SCPI)</text>

  <!-- Circular Buffer Sectors (R_outer=85, R_inner=55, Center=247,210) -->
  <!-- Sector 1: Top-Right (0° to 90°) - Write Zone -->
  <path d="M 332,210 A 85,85 0 0,1 247,295 L 247,265 A 55,55 0 0,0 302,210 Z" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Sector 2: Bottom-Right (90° to 180°) - Unread Delta -->
  <path d="M 247,295 A 85,85 0 0,1 162,210 L 202,210 A 55,55 0 0,0 247,265 Z" fill="#fef9e7" stroke="#f39c12" stroke-width="1.5"/>

  <!-- Sector 3: Bottom-Left (180° to 270°) - Read SCPI Zone -->
  <path d="M 162,210 A 85,85 0 0,1 247,125 L 247,155 A 55,55 0 0,0 202,210 Z" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Sector 4: Top-Left (270° to 360°) - Old Data -->
  <path d="M 247,125 A 85,85 0 0,1 332,210 L 302,210 A 55,55 0 0,0 247,155 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Center Text -->
  <text x="247" y="205" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Буфер ОЗП</text>
  <text x="247" y="222" font-size="12" fill="#6b7280" text-anchor="middle">Roll Mode</text>

  <!-- Clockwise direction arrow in center -->
  <path d="M 235,175 A 35,35 0 0,1 265,175" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- Pointer 1: ADC Write (Red) -->
  <line x1="345" y1="135" x2="315" y2="148" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="340" y="135" font-size="12" font-weight="bold" fill="#c0392b">Запис АЦП</text>
  <text x="340" y="150" font-size="12" fill="#c0392b">(потік f_s)</text>

  <!-- Pointer 2: SCPI Read (Green) -->
  <line x1="130" y1="210" x2="160" y2="210" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="125" y="205" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">Зчитано SCPI</text>
  <text x="125" y="220" font-size="12" fill="#27ae60" text-anchor="end">(:WAV:DATA?)</text>

  <!-- Panel 1 Info Box -->
  <rect x="45" y="325" width="405" height="120" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="60" y="347" font-size="12" font-weight="bold" fill="#1a1a1a">Правило безперервного потоку:</text>
  <text x="60" y="369" font-size="12" fill="#2457d6">1. Швидкість SCPI більша за АЦП (V_scpi ≥ f_s / N_block)</text>
  <text x="60" y="391" font-size="12" fill="#c0392b">2. Затримка SCPI призведе до переповнення буфера</text>
  <text x="60" y="413" font-size="12" fill="#c0392b">   та перезапису непрочитаних вибірок АЦП.</text>

  <!-- PANEL 2: REAL-TIME SCPI STREAMING PROTOCOL -->
  <rect x="495" y="75" width="435" height="385" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="712" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Протокол SCPI-зчитування у реальному часі</text>

  <!-- Lifelines & Column Headers -->
  <rect x="525" y="120" width="100" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="575" y="139" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Осцилограф</text>
  <line x1="575" y1="150" x2="575" y2="315" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>

  <rect x="800" y="120" width="100" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="850" y="139" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Управляючий ПК</text>
  <line x1="850" y1="150" x2="850" y2="315" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Sequence Messages -->
  <!-- Message 1: Mode Config -->
  <line x1="850" y1="175" x2="575" y2="175" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="712.5" y="168" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">:TIMebase:MODE ROLL</text>

  <!-- Message 2: Scale Config -->
  <line x1="850" y1="210" x2="575" y2="210" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="712.5" y="203" font-size="12" fill="#1a1a1a" text-anchor="middle">:TIMebase:SCALe 500e-3</text>

  <!-- Loop Container Box -->
  <rect x="535" y="230" width="355" height="80" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="545" y="245" font-size="12" font-weight="bold" fill="#27ae60">Цикл зчитування вибірок (Real-Time)</text>

  <!-- Message 3: Data Query -->
  <line x1="850" y1="265" x2="575" y2="265" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="712.5" y="260" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">:WAVeform:DATA?</text>

  <!-- Message 4: Data Response -->
  <line x1="575" y1="295" x2="850" y2="295" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="712.5" y="290" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">#9000001000&lt;дані АЦП&gt;</text>

  <!-- Panel 2 Info Box -->
  <rect x="510" y="325" width="405" height="120" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="525" y="347" font-size="12" font-weight="bold" fill="#2457d6">Особливості роботи в Roll Mode:</text>
  <text x="525" y="369" font-size="12" fill="#1a1a1a">1. Прилад збирає дані без очікування тригера (Free Run).</text>
  <text x="525" y="391" font-size="12" fill="#1a1a1a">2. Передача йде без зупинки або перезапуску розгортки.</text>
  <text x="525" y="413" font-size="12" fill="#1a1a1a">3. Команда :WAV:DATA? повертає новий блок із буфера ОЗП.</text>
</svg>
