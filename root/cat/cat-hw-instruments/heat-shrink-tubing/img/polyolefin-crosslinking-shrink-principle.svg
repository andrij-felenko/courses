<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Принцип термомеханічної пам'яті форми зшитого поліолефіну</text>
  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Перебудова мікроструктури полімеру: від розтягнутого стану розширяної трубки до відновленої сітки під дією тепла</text>

  <!-- Left Column: Stretched State (Cold Expanded Tube) -->
  <rect x="25" y="70" width="410" height="365" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  
  <text x="230" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">1. Розтягнутий стан (холодна трубка D₁)</text>
  <text x="230" y="114" text-anchor="middle" font-size="12" fill="#6b7280">Орієнтовані ланцюги під механічним натягом</text>

  <!-- Left Tube Graphic Box -->
  <rect x="55" y="135" width="350" height="190" rx="5" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="105" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">D₁ (розширений діаметр)</text>

  <!-- Expanded Tube Outer Wall -->
  <rect x="85" y="150" width="290" height="110" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <!-- Tube Internal Bore -->
  <rect x="85" y="170" width="290" height="70" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Oriented Polymer Chains (Stretched Horizontal Lines) -->
  <path d="M 115,185 Q 175,183 235,185 T 355,185" stroke="#2457d6" stroke-width="2" fill="none"/>
  <path d="M 115,205 Q 175,203 235,205 T 355,205" stroke="#2457d6" stroke-width="2" fill="none"/>
  <path d="M 115,225 Q 175,223 235,225 T 355,225" stroke="#2457d6" stroke-width="2" fill="none"/>

  <!-- Covalent Cross-link Nodes -->
  <line x1="155" y1="185" x2="155" y2="205" stroke="#c0392b" stroke-width="2"/>
  <circle cx="155" cy="185" r="3.5" fill="#c0392b"/>
  <circle cx="155" cy="205" r="3.5" fill="#c0392b"/>

  <line x1="235" y1="205" x2="235" y2="225" stroke="#c0392b" stroke-width="2"/>
  <circle cx="235" cy="205" r="3.5" fill="#c0392b"/>
  <circle cx="235" cy="225" r="3.5" fill="#c0392b"/>

  <line x1="315" y1="185" x2="315" y2="205" stroke="#c0392b" stroke-width="2"/>
  <circle cx="315" cy="185" r="3.5" fill="#c0392b"/>
  <circle cx="315" cy="205" r="3.5" fill="#c0392b"/>

  <!-- Left Microstructure Labels -->
  <text x="230" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Ковалентні вузли зшивання (Cross-links)</text>
  <text x="230" y="303" text-anchor="middle" font-size="12" fill="#6b7280">Ланцюги витягнуті, зафіксовані вкристалізованими блоками</text>

  <!-- Left Panel Bottom Info Box -->
  <rect x="35" y="340" width="390" height="75" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="360" font-size="12" font-weight="bold" fill="#1a1a1a">Стан перед монтажем (T &lt; T_m):</text>
  <text x="45" y="378" font-size="12" fill="#2457d6">Трубка розширена механічно під час виготовлення</text>
  <text x="45" y="396" font-size="12" fill="#6b7280">Збереження збільшеного внутрішнього діаметра D₁</text>

  <!-- Central Transition: Heating & Shrinkage -->
  <rect x="440" y="175" width="80" height="45" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="480" y="193" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Тепло (ΔT)</text>
  <text x="480" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">90–120 °C</text>

  <line x1="440" y1="245" x2="515" y2="245" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-red)"/>
  <text x="480" y="265" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Усадження 2:1</text>

  <!-- Right Column: Recovered Shrunk State -->
  <rect x="525" y="70" width="410" height="365" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  
  <text x="730" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">2. Відновлений стан (після усадження D₂)</text>
  <text x="730" y="114" text-anchor="middle" font-size="12" fill="#6b7280">Релаксація ланцюгів до початкової ковалентної сітки</text>

  <!-- Right Tube Graphic Box -->
  <rect x="555" y="135" width="350" height="190" rx="5" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="605" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">D₂ = D₁ / 2 (обтискання)</text>

  <!-- Shrunk Tube Outer Wall (Thicker Wall, Small Diameter D2) -->
  <rect x="585" y="165" width="290" height="80" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <!-- Shrunk Tube Internal Bore -->
  <rect x="585" y="185" width="290" height="40" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Coiled Polymer Chains (Relaxed Wavy Lines) -->
  <path d="M 615,178 Q 645,170 675,178 T 735,178 T 795,178 T 855,178" stroke="#27ae60" stroke-width="2" fill="none"/>
  <path d="M 615,198 Q 645,206 675,198 T 735,198 T 795,198 T 855,198" stroke="#27ae60" stroke-width="2" fill="none"/>
  <path d="M 615,218 Q 645,210 675,218 T 735,218 T 795,218 T 855,218" stroke="#27ae60" stroke-width="2" fill="none"/>

  <!-- Compact Cross-link Nodes -->
  <line x1="655" y1="178" x2="655" y2="198" stroke="#27ae60" stroke-width="2"/>
  <circle cx="655" cy="178" r="3.5" fill="#27ae60"/>
  <circle cx="655" cy="198" r="3.5" fill="#27ae60"/>

  <line x1="735" y1="198" x2="735" y2="218" stroke="#27ae60" stroke-width="2"/>
  <circle cx="735" cy="198" r="3.5" fill="#27ae60"/>
  <circle cx="735" cy="218" r="3.5" fill="#27ae60"/>

  <line x1="815" y1="178" x2="815" y2="198" stroke="#27ae60" stroke-width="2"/>
  <circle cx="815" cy="178" r="3.5" fill="#27ae60"/>
  <circle cx="815" cy="198" r="3.5" fill="#27ae60"/>

  <!-- Right Microstructure Labels -->
  <text x="730" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Ентропійна еластичність сітки</text>
  <text x="730" y="303" text-anchor="middle" font-size="12" fill="#6b7280">Ланцюги згортаються, відновлюючи первинну форму</text>

  <!-- Right Panel Bottom Info Box -->
  <rect x="535" y="340" width="390" height="75" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="545" y="360" font-size="12" font-weight="bold" fill="#1a1a1a">Результат після нагрівання (T &gt; T_m):</text>
  <text x="545" y="378" font-size="12" fill="#27ae60">Радіальне усадження до відновленого діаметра D₂</text>
  <text x="545" y="396" font-size="12" fill="#6b7280">Щільне обтискання та герметизація провідника</text>
</svg>
