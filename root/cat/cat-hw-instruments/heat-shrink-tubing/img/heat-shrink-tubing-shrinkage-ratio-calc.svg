<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Геометрія усадження та правило робочого діапазону 80/20</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Залежність товщини стінки t від діаметрів D_exp / D_rec та оптимальна зона обтискання D_obj</text>

  <!-- LEFT COLUMN: CROSS-SECTION GEOMETRY -->
  <rect x="40" y="80" width="420" height="360" rx="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="250" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Геометричні зміни при усадженні</text>

  <!-- Ring 1: BEFORE Shrinking (Expanded) -->
  <g>
    <text x="140" y="135" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Початковий стан (D_exp)</text>
    
    <!-- Outer circle -->
    <circle cx="140" cy="215" r="65" fill="#eaf0fd" stroke="#2457d6" stroke-width="3"/>
    <!-- Inner circle -->
    <circle cx="140" cy="215" r="55" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
    
    <!-- Outer diameter dimension -->
    <line x1="75" y1="145" x2="205" y2="145" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="75" y1="142" x2="75" y2="150" stroke="#2457d6" stroke-width="1.5"/>
    <line x1="205" y1="142" x2="205" y2="150" stroke="#2457d6" stroke-width="1.5"/>
    
    <!-- Thickness callout -->
    <line x1="140" y1="150" x2="140" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="140" y="295" font-size="12" fill="#1a1a1a" text-anchor="middle">Товщина стінки t_exp</text>
  </g>

  <!-- Heat Arrow -->
  <g>
    <line x1="215" y1="215" x2="265" y2="215" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
    <text x="240" y="195" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Нагрів</text>
    <text x="240" y="235" font-size="10" fill="#c0392b" text-anchor="middle">(усадження)</text>
  </g>

  <!-- Ring 2: AFTER Shrinking (Recovered) -->
  <g>
    <text x="340" y="135" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Усаджений стан (D_rec)</text>
    
    <!-- Outer circle -->
    <circle cx="340" cy="215" r="45" fill="#e9f7ef" stroke="#27ae60" stroke-width="3"/>
    <!-- Inner circle -->
    <circle cx="340" cy="215" r="25" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
    
    <!-- Thickness callout -->
    <text x="340" y="295" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Товщина стінки t_rec</text>
  </g>

  <!-- Left Column Formula Card -->
  <rect x="55" y="325" width="390" height="100" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="70" y="346" font-size="12" font-weight="bold" fill="#1a1a1a">Збереження об'єму матеріалу стінки:</text>
  <text x="70" y="368" font-size="13" font-weight="bold" fill="#2457d6">t_rec = t_exp · (D_exp ÷ D_rec)</text>
  <text x="70" y="392" font-size="11" fill="#6b7280">При усадженні 2:1 (D_exp / D_rec = 2)</text>
  <text x="70" y="408" font-size="11" fill="#27ae60">товщина стінки t_rec подвоюється.</text>

  <!-- RIGHT COLUMN: RULE 80/20 & WORKING RANGE -->
  <rect x="480" y="80" width="440" height="360" rx="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="700" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Робочий діапазон об'єкта (Правило 80/20)</text>

  <!-- Scale Diagram Labels -->
  <text x="700" y="140" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Рекомендована зона діаметра об'єкта D_obj</text>

  <text x="548" y="162" font-size="11" fill="#c0392b" text-anchor="middle">Недотиск</text>
  <text x="548" y="174" font-size="10" fill="#c0392b" text-anchor="middle">(&lt; 20% усадки)</text>

  <text x="700" y="174" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Зона 80/20 (Оптимальна)</text>

  <text x="852" y="162" font-size="11" fill="#c0392b" text-anchor="middle">Перетяг</text>
  <text x="852" y="174" font-size="10" fill="#c0392b" text-anchor="middle">(&gt; 80% усадки)</text>

  <!-- Scale Bar -->
  <rect x="510" y="185" width="380" height="34" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="586" y="185" width="228" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="700" y="206" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Допустимі діаметри об'єкта D_obj</text>

  <!-- Ticks & Diameter Labels -->
  <g>
    <!-- Tick 1: D_rec -->
    <line x1="510" y1="219" x2="510" y2="238" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="510" y="254" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">D_rec</text>
    <text x="510" y="268" font-size="10" fill="#6b7280" text-anchor="middle">(Відновлений)</text>

    <!-- Tick 2: D_min -->
    <line x1="586" y1="219" x2="586" y2="238" stroke="#27ae60" stroke-width="2"/>
    <text x="586" y="254" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">D_min</text>
    <text x="586" y="268" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">(D_rec + 20%)</text>

    <!-- Tick 3: D_max -->
    <line x1="814" y1="219" x2="814" y2="238" stroke="#27ae60" stroke-width="2"/>
    <text x="814" y="254" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">D_max</text>
    <text x="814" y="268" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">(D_exp - 20%)</text>

    <!-- Tick 4: D_exp -->
    <line x1="890" y1="219" x2="890" y2="238" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="890" y="254" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">D_exp</text>
    <text x="890" y="268" font-size="10" fill="#6b7280" text-anchor="middle">(Розширений)</text>
  </g>

  <!-- Right Column Summary Card -->
  <rect x="495" y="325" width="410" height="100" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="510" y="346" font-size="12" font-weight="bold" fill="#1a1a1a">Математичне правило 80/20:</text>
  <text x="510" y="368" font-size="13" font-weight="bold" fill="#27ae60">D_rec + 0.2·ΔD ≤ D_obj ≤ D_exp - 0.2·ΔD</text>
  <text x="510" y="392" font-size="11" fill="#6b7280">де ΔD = D_exp - D_rec (інтервал усадження).</text>
  <text x="510" y="408" font-size="11" fill="#2457d6">Забезпечує 20–80% робочу деформацію полімеру.</text>
</svg>
