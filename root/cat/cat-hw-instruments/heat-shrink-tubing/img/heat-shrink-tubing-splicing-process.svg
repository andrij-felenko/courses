<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Технологічний процес усадження клейової термоусадкової трубки</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Послідовність прогріву термофеном із рефлектором та порівняння якості герметизації</text>

  <!-- Головна панель 3-х кроків процесу -->
  <rect x="30" y="80" width="900" height="190" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="45" y="100" font-size="12" font-weight="bold" fill="#6b7280">Послідовність усадження (від центру до країв):</text>

  <!-- Крок 1: Позиціонування -->
  <rect x="45" y="112" width="275" height="145" fill="white" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="55" y="130" font-size="12" font-weight="bold" fill="#2457d6">1. Позиціонування</text>
  <!-- Малюнок кроку 1 -->
  <path d="M 60 175 L 160 175" stroke="#1a1a1a" stroke-width="4"/>
  <path d="M 195 175 L 295 175" stroke="#1a1a1a" stroke-width="4"/>
  <rect x="155" y="170" width="45" height="10" fill="#6b7280" rx="2"/>
  <rect x="115" y="155" width="125" height="40" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 3" rx="4"/>
  <text x="177.5" y="179" font-size="10" fill="#2457d6" text-anchor="middle">Зазор (Unshrunk)</text>
  <text x="55" y="215" font-size="11" fill="#6b7280">Трубка 3:1 перекриває спай</text>
  <text x="55" y="233" font-size="11" fill="#6b7280">з перекриттям ≥ 15 мм</text>

  <!-- Стрілка 1->2 -->
  <path d="M 324 185 L 336 185" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Крок 2: Прогрів рефлектором -->
  <rect x="340" y="112" width="280" height="145" fill="white" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="350" y="130" font-size="12" font-weight="bold" fill="#2457d6">2. Прогрів рефлектором</text>
  <!-- Малюнок кроку 2 -->
  <path d="M 355 175 L 605 175" stroke="#1a1a1a" stroke-width="4"/>
  <!-- Рефлекторна насадка -->
  <path d="M 450 145 C 430 145 420 175 420 175 C 420 175 430 205 450 205" fill="none" stroke="#6b7280" stroke-width="3"/>
  <path d="M 435 155 L 460 168" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <!-- Трубка звужується від центру -->
  <path d="M 390 160 L 440 160 L 455 168 L 505 168 L 520 160 L 570 160 L 570 190 L 520 190 L 505 182 L 455 182 L 440 190 L 390 190 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="350" y="215" font-size="11" fill="#6b7280">Температура 120–150 °C</text>
  <text x="350" y="233" font-size="11" fill="#6b7280">Прогрів від центру до країв</text>

  <!-- Стрілка 2->3 -->
  <path d="M 624 185 L 636 185" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Крок 3: Клейова герметизація -->
  <rect x="640" y="112" width="275" height="145" fill="white" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="650" y="130" font-size="12" font-weight="bold" fill="#27ae60">3. Клейова герметизація</text>
  <!-- Малюнок кроку 3 -->
  <path d="M 655 175 L 900 175" stroke="#1a1a1a" stroke-width="4"/>
  <rect x="700" y="166" width="140" height="18" fill="#2457d6" rx="3"/>
  <circle cx="698" cy="175" r="4" fill="#27ae60"/>
  <circle cx="842" cy="175" r="4" fill="#27ae60"/>
  <text x="650" y="215" font-size="11" font-weight="bold" fill="#27ae60">✓ Вихід клейового галтеля</text>
  <text x="650" y="233" font-size="11" fill="#6b7280">Повна вологозахищеність</text>

  <!-- Картка Ліва: Якісне усадження (ТАК) -->
  <rect x="30" y="285" width="435" height="170" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <rect x="45" y="295" width="230" height="24" fill="#27ae60" rx="3"/>
  <text x="160" y="311" font-size="12" font-weight="bold" fill="white" text-anchor="middle">ЯКІСНЕ З'ЄДНАННЯ (ТАК)</text>
  <!-- Малюнок лівої картки -->
  <line x1="45" y1="355" x2="425" y2="355" stroke="#1a1a1a" stroke-width="4"/>
  <rect x="115" y="347" width="240" height="16" fill="#27ae60" rx="3"/>
  <circle cx="112" cy="355" r="5" fill="#27ae60"/>
  <circle cx="358" cy="355" r="5" fill="#27ae60"/>
  <text x="235" y="340" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Герметичний клейовий галтель 360°</text>
  <text x="45" y="402" font-size="12" font-weight="bold" fill="#27ae60">Ознаки якісного усадження:</text>
  <text x="45" y="420" font-size="11" fill="#1a1a1a">• Рівномірний обтиск по всій довжині без повітряних бульбашок</text>
  <text x="45" y="438" font-size="11" fill="#1a1a1a">• Вихід термоклею по краях (герметичний галтель 360°)</text>

  <!-- Картка Права: Дефекти та перегрів (НЕ ТАК) -->
  <rect x="495" y="285" width="435" height="170" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <rect x="510" y="295" width="250" height="24" fill="#c0392b" rx="3"/>
  <text x="635" y="311" font-size="12" font-weight="bold" fill="white" text-anchor="middle">ДЕФЕКТИ ТА ПЕРЕГРІВ (НЕ ТАК)</text>
  <!-- Малюнок правої картки -->
  <line x1="510" y1="355" x2="890" y2="355" stroke="#1a1a1a" stroke-width="4"/>
  <rect x="580" y="347" width="240" height="16" fill="#c0392b" rx="3"/>
  <circle cx="700" cy="355" r="7" fill="#1a1a1a"/>
  <ellipse cx="640" cy="355" rx="15" ry="5" fill="#fdecea" stroke="#c0392b" stroke-dasharray="2 2"/>
  <text x="700" y="340" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Пропал та затиснута каверна</text>
  <text x="510" y="402" font-size="12" font-weight="bold" fill="#c0392b">Типові помилки та дефекти:</text>
  <text x="510" y="420" font-size="11" fill="#1a1a1a">• Перегрів вище 200 °C: обгорання полімеру та втрата еластичності</text>
  <text x="510" y="438" font-size="11" fill="#1a1a1a">• Прогрів із країв: затиснення повітряної каверни всередині</text>
</svg>
