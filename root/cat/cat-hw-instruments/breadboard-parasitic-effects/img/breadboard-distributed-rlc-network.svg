<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Маркери стрілок -->
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розподілена RLC-модель контактної доріжки макетної плати</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Контактні опори R_c, індуктивність L_s та паразитна ємність C_adj між суміжними доріжками</text>

  <!-- ПАНЕЛЬ 1: Еквівалентна схема (Ліва частина) -->
  <rect x="30" y="85" width="600" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="330" y="110" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Еквівалентна заступна схема двох контактних рядів</text>
  <text x="330" y="127" font-size="12" fill="#6b7280" text-anchor="middle">Паразитні параметри доріжки N (сигнал) та доріжки N+1 (суміжна)</text>

  <!-- Доріжка N: позначка блоку -->
  <rect x="45" y="142" width="570" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="330" y="158" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Доріжка N (сигнальний контактний блок з 5 пружинних затискачів)</text>

  <!-- Вхідний вивід компонента (Signal In) -->
  <text x="45" y="180" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">Вхід V_in</text>
  <!-- Провідник від Входу до R_c1 -->
  <line x1="45" y1="192" x2="65" y2="192" stroke="#2457d6" stroke-width="2"/>
  <!-- Resistor R_c1 (x=65..85, y=192) -->
  <rect x="65" y="186" width="20" height="12" fill="white" stroke="#c0392b" stroke-width="1.5"/>
  <text x="75" y="210" font-size="12" fill="#c0392b" text-anchor="middle">R_c1</text>
  <!-- Wire from R_c1 to Pin 1 -->
  <line x1="85" y1="192" x2="110" y2="192" stroke="#2457d6" stroke-width="2"/>
  <line x1="110" y1="192" x2="110" y2="221" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Основна лінія Доріжки N (y=230) -->
  <!-- Wire from Pin 1 (110) to Pin 2 (220) -->
  <line x1="119" y1="230" x2="145" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Resistor R_s1 (x=145..165, y=230) -->
  <rect x="145" y="224" width="20" height="12" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="165" y1="230" x2="175" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Inductor L_s1 (coil loops at x=175..199, y=230) -->
  <path d="M 175 230 A 4 4 0 0 1 183 230 A 4 4 0 0 1 191 230 A 4 4 0 0 1 199 230" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="199" y1="230" x2="211" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <text x="172" y="215" font-size="12" fill="#1a1a1a" text-anchor="middle">R_s1, L_s1</text>

  <!-- Wire from Pin 2 (220) to Pin 3 (330) -->
  <line x1="229" y1="230" x2="255" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Resistor R_s2 -->
  <rect x="255" y="224" width="20" height="12" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="275" y1="230" x2="285" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Inductor L_s2 -->
  <path d="M 285 230 A 4 4 0 0 1 293 230 A 4 4 0 0 1 301 230 A 4 4 0 0 1 309 230" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="309" y1="230" x2="321" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <text x="282" y="215" font-size="12" fill="#1a1a1a" text-anchor="middle">R_s2, L_s2</text>

  <!-- Wire from Pin 3 (330) to Pin 4 (440) -->
  <line x1="339" y1="230" x2="365" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Resistor R_s3 -->
  <rect x="365" y="224" width="20" height="12" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="385" y1="230" x2="395" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Inductor L_s3 -->
  <path d="M 395 230 A 4 4 0 0 1 403 230 A 4 4 0 0 1 411 230 A 4 4 0 0 1 419 230" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="419" y1="230" x2="431" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <text x="392" y="215" font-size="12" fill="#1a1a1a" text-anchor="middle">R_s3, L_s3</text>

  <!-- Wire from Pin 4 (440) to Pin 5 (550) -->
  <line x1="449" y1="230" x2="475" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Resistor R_s4 -->
  <rect x="475" y="224" width="20" height="12" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="495" y1="230" x2="505" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Inductor L_s4 -->
  <path d="M 505 230 A 4 4 0 0 1 513 230 A 4 4 0 0 1 521 230 A 4 4 0 0 1 529 230" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="529" y1="230" x2="541" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <text x="502" y="215" font-size="12" fill="#1a1a1a" text-anchor="middle">R_s4, L_s4</text>

  <!-- Вихідний вивід компонента (Signal Out) -->
  <line x1="550" y1="221" x2="550" y2="192" stroke="#2457d6" stroke-width="2"/>
  <line x1="550" y1="192" x2="565" y2="192" stroke="#2457d6" stroke-width="2"/>
  <!-- Resistor R_c5 -->
  <rect x="565" y="186" width="20" height="12" fill="white" stroke="#c0392b" stroke-width="1.5"/>
  <text x="575" y="210" font-size="12" fill="#c0392b" text-anchor="middle">R_c5</text>
  <line x1="585" y1="192" x2="615" y2="192" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="615" y="180" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">Вихід V_out</text>

  <!-- Пін-затискачі Доріжки N (гнізда 1..5) -->
  <rect x="101" y="221" width="18" height="18" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="110" cy="230" r="3" fill="#1a1a1a"/>
  <text x="110" y="254" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">1</text>

  <rect x="211" y="221" width="18" height="18" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="220" cy="230" r="3" fill="#1a1a1a"/>
  <text x="220" y="254" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">2</text>

  <rect x="321" y="221" width="18" height="18" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="330" cy="230" r="3" fill="#1a1a1a"/>
  <text x="330" y="254" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">3</text>

  <rect x="431" y="221" width="18" height="18" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="440" cy="230" r="3" fill="#1a1a1a"/>
  <text x="440" y="254" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">4</text>

  <rect x="541" y="221" width="18" height="18" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="550" cy="230" r="3" fill="#1a1a1a"/>
  <text x="550" y="254" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">5</text>

  <!-- Доріжка N+1: позначка блоку -->
  <rect x="180" y="380" width="300" height="24" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="330" y="396" font-size="12" fill="#6b7280" text-anchor="middle">Доріжка N+1 (суміжна доріжка)</text>

  <!-- Основна лінія Доріжки N+1 (y=345) -->
  <line x1="90" y1="345" x2="570" y2="345" stroke="#6b7280" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Пін-затискачі Доріжки N+1 (гнізда 1'..5') -->
  <rect x="101" y="336" width="18" height="18" rx="3" fill="white" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="110" cy="345" r="3" fill="#6b7280"/>
  <text x="110" y="328" font-size="12" fill="#6b7280" text-anchor="middle">1'</text>

  <rect x="211" y="336" width="18" height="18" rx="3" fill="white" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="220" cy="345" r="3" fill="#6b7280"/>
  <text x="220" y="328" font-size="12" fill="#6b7280" text-anchor="middle">2'</text>

  <rect x="321" y="336" width="18" height="18" rx="3" fill="white" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="330" cy="345" r="3" fill="#6b7280"/>
  <text x="330" y="328" font-size="12" fill="#6b7280" text-anchor="middle">3'</text>

  <rect x="431" y="336" width="18" height="18" rx="3" fill="white" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="440" cy="345" r="3" fill="#6b7280"/>
  <text x="440" y="328" font-size="12" fill="#6b7280" text-anchor="middle">4'</text>

  <rect x="541" y="336" width="18" height="18" rx="3" fill="white" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="550" cy="345" r="3" fill="#6b7280"/>
  <text x="550" y="328" font-size="12" fill="#6b7280" text-anchor="middle">5'</text>

  <!-- Паразитні міждоріжкові ємності C_adj -->
  <line x1="270" y1="230" x2="270" y2="265" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="261" y1="265" x2="279" y2="265" stroke="#c0392b" stroke-width="2"/>
  <line x1="261" y1="273" x2="279" y2="273" stroke="#c0392b" stroke-width="2"/>
  <line x1="270" y1="273" x2="270" y2="345" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="283" y="273" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">C_adj1 (1..3 пФ)</text>

  <line x1="480" y1="230" x2="480" y2="265" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="471" y1="265" x2="489" y2="265" stroke="#c0392b" stroke-width="2"/>
  <line x1="471" y1="273" x2="489" y2="273" stroke="#c0392b" stroke-width="2"/>
  <line x1="480" y1="273" x2="480" y2="345" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="493" y="273" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">C_adj2</text>

  <!-- Металева основа / Земля (GND) -->
  <line x1="70" y1="472" x2="570" y2="472" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="90" y1="472" x2="82" y2="482" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="170" y1="472" x2="162" y2="482" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="250" y1="472" x2="242" y2="482" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="330" y1="472" x2="322" y2="482" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="410" y1="472" x2="402" y2="482" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="490" y1="472" x2="482" y2="482" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="320" y="498" font-size="12" fill="#6b7280" text-anchor="middle">Металева основа макетної плати / Заземлений екран (GND)</text>

  <!-- Ємності на землю C_g з Доріжки N+1 -->
  <!-- C_g1 at x=140 -->
  <line x1="140" y1="345" x2="140" y2="430" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="131" y1="430" x2="149" y2="430" stroke="#2457d6" stroke-width="2"/>
  <line x1="131" y1="437" x2="149" y2="437" stroke="#2457d6" stroke-width="2"/>
  <line x1="140" y1="437" x2="140" y2="472" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="154" y="437" font-size="12" fill="#2457d6" text-anchor="start">C_g1 (1..2 пФ)</text>

  <!-- C_g2 at x=510 -->
  <line x1="510" y1="345" x2="510" y2="430" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="501" y1="430" x2="519" y2="430" stroke="#2457d6" stroke-width="2"/>
  <line x1="501" y1="437" x2="519" y2="437" stroke="#2457d6" stroke-width="2"/>
  <line x1="510" y1="437" x2="510" y2="472" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="496" y="437" font-size="12" fill="#2457d6" text-anchor="end">C_g2</text>

  <!-- ПАНЕЛЬ 2: Опис величин та наслідків (Права частина) -->
  <rect x="645" y="85" width="285" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="787" y="110" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Фізичні величини та наслідки</text>
  <text x="787" y="127" font-size="12" fill="#6b7280" text-anchor="middle">Оцінка завад для безпаяних плат</text>

  <!-- Блок 2.1: Контактний опір R_c -->
  <rect x="657" y="142" width="261" height="80" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="787" y="162" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Опір контактів R_c</text>
  <text x="667" y="181" font-size="12" fill="#1a1a1a" text-anchor="start">• Новий контакт: 0.05...0.1 Ом</text>
  <text x="667" y="198" font-size="12" fill="#1a1a1a" text-anchor="start">• Зношений/окислений: 0.5...2 Ом</text>
  <text x="667" y="214" font-size="12" fill="#c0392b" text-anchor="start">  Ефект: зсув U_out, падіння I_load</text>

  <!-- Блок 2.2: Паразитна ємність C_adj / C_g -->
  <rect x="657" y="232" width="261" height="84" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="787" y="252" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Паразитна ємність C_adj / C_g</text>
  <text x="667" y="271" font-size="12" fill="#1a1a1a" text-anchor="start">• Суміжні доріжки C_adj: 1...3 пФ</text>
  <text x="667" y="288" font-size="12" fill="#1a1a1a" text-anchor="start">• Ємність на землю C_g: 1...2 пФ</text>
  <text x="667" y="305" font-size="12" fill="#2457d6" text-anchor="start">  Ефект: перехресні завади (crosstalk)</text>

  <!-- Блок 2.3: Власна індуктивність L_s -->
  <rect x="657" y="324" width="261" height="78" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="787" y="344" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Індуктивність L_s / L_wire</text>
  <text x="667" y="363" font-size="12" fill="#1a1a1a" text-anchor="start">• Пружинний затискач: 5...10 нГн</text>
  <text x="667" y="380" font-size="12" fill="#1a1a1a" text-anchor="start">• Провідник 5 см: ~50 нГн</text>
  <text x="667" y="395" font-size="12" fill="#6b7280" text-anchor="start">  Ефект: звону (ringing), L·di/dt</text>

  <!-- Блок 2.4: Рекомендації -->
  <rect x="657" y="410" width="261" height="92" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="787" y="430" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Мінімізація паразитних ефектів</text>
  <text x="667" y="449" font-size="12" fill="#1a1a1a" text-anchor="start">• Короткі провідники впритул</text>
  <text x="667" y="466" font-size="12" fill="#1a1a1a" text-anchor="start">• Екранування GND-доріжками</text>
  <text x="667" y="483" font-size="12" fill="#27ae60" text-anchor="start">• Границя частоти: f &lt; 10...20 МГц</text>
</svg>
