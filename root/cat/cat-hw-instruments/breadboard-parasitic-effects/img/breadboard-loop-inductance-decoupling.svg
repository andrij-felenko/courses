<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="500" fill="#ffffff"/>

  <!-- Title & Subtitle -->
  <text x="480" y="28" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Вплив паразитної індуктивності та декуплювання на макетній платі</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Довгі провідники створюють високу індуктивність L_loop і сплески V = L·(di/dt), а локальний C_dec замкне ВЧ струм</text>

  <!-- LEFT PANEL: PROBLEM -->
  <rect x="25" y="70" width="440" height="410" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  
  <!-- Left Header Badge -->
  <rect x="40" y="85" width="230" height="26" rx="4" fill="#c0392b"/>
  <text x="155" y="102" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">⛔ Довга петля без C_dec</text>
  <text x="40" y="130" font-size="12" font-weight="700" fill="#c0392b">Велика паразитна індуктивність L_loop ≈ 50–100 нГн</text>

  <!-- Left Power Supply Box -->
  <rect x="45" y="155" width="70" height="150" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="80" y="218" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">
    <tspan x="80" dy="0">Джерело</tspan>
    <tspan x="80" dy="20">V_CC</tspan>
  </text>

  <!-- Left IC Box -->
  <rect x="355" y="155" width="90" height="150" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="400" y="210" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">
    <tspan x="400" dy="0">Цифрова ІС</tspan>
    <tspan x="400" dy="20">(ключ SW)</tspan>
  </text>
  
  <!-- Transistor/Switch symbol inside left IC -->
  <line x1="400" y1="242" x2="400" y2="252" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="392" y1="252" x2="408" y2="252" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="395" y1="262" x2="400" y2="252" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="400" y1="262" x2="400" y2="275" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Left Power Lines & Inductors -->
  <!-- V_CC Wire (top) -->
  <line x1="115" y1="185" x2="170" y2="185" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 170 185 Q 177.5 173 185 185 Q 192.5 173 200 185 Q 207.5 173 215 185 Q 222.5 173 230 185" fill="none" stroke="#c0392b" stroke-width="2"/>
  <line x1="230" y1="185" x2="355" y2="185" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="200" y="165" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">L_VCC</text>

  <!-- GND Wire (bottom) -->
  <line x1="355" y1="275" x2="230" y2="275" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 230 275 Q 222.5 287 215 275 Q 207.5 287 200 275 Q 192.5 287 185 275 Q 177.5 287 170 275" fill="none" stroke="#c0392b" stroke-width="2"/>
  <line x1="170" y1="275" x2="115" y2="275" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="200" y="305" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">L_GND</text>

  <!-- Left Pulse Current Loop (Dashed Red Loop) -->
  <path d="M 130,172 L 340,172 Q 350,172 350,185 L 350,265 Q 350,278 340,278 L 130,278 Q 120,278 120,265 L 120,185 Q 120,172 130,172" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr-red)"/>
  <text x="235" y="218" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Велика петля струму i(t)</text>
  <text x="235" y="238" font-size="12" fill="#c0392b" text-anchor="middle">високий di/dt на довгій лінії</text>

  <!-- Left Oscillogram Box -->
  <rect x="40" y="335" width="410" height="130" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="50" y="354" font-size="12" font-weight="700" fill="#1a1a1a">Напруга V_IC(t) на виводах живлення ІС:</text>
  
  <!-- Nominal Line -->
  <line x1="60" y1="412" x2="430" y2="412" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="60" y="392" font-size="12" fill="#6b7280">V_CC (номінал)</text>
  
  <!-- Waveform (Red) -->
  <path d="M 60 412 L 150 412 L 160 372 L 180 436 L 205 392 L 230 420 L 255 406 L 280 414 L 310 412 L 430 412" fill="none" stroke="#c0392b" stroke-width="2"/>
  
  <!-- Spike Annotation -->
  <text x="225" y="372" font-size="12" font-weight="700" fill="#c0392b">ΔV = L_loop · (di/dt) (сплеск і звон)</text>
  <text x="50" y="452" font-size="12" font-weight="600" fill="#c0392b">⚠️ Ризик збоїв логіки та перевищення V_max</text>


  <!-- RIGHT PANEL: SOLUTION -->
  <rect x="495" y="70" width="440" height="410" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  
  <!-- Right Header Badge -->
  <rect x="510" y="85" width="230" height="26" rx="4" fill="#27ae60"/>
  <text x="625" y="102" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">✓ Коротка петля з C_dec</text>
  <text x="510" y="126" font-size="12" font-weight="700" fill="#27ae60">Локалізована ВЧ петля живлення, L_loop &lt; 5 нГн</text>

  <!-- Right Local Pulse Loop Label (placed neatly above C_dec loop) -->
  <text x="770" y="148" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Коротка ВЧ петля (L_local &lt; 5 нГн)</text>

  <!-- Right Power Supply Box -->
  <rect x="515" y="155" width="70" height="150" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="550" y="218" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">
    <tspan x="550" dy="0">Джерело</tspan>
    <tspan x="550" dy="20">V_CC</tspan>
  </text>

  <!-- Right Decoupling Capacitor C_dec -->
  <line x1="740" y1="185" x2="740" y2="212" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="722" y1="212" x2="758" y2="212" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="722" y1="222" x2="758" y2="222" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="740" y1="222" x2="740" y2="275" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="765" y="218" font-size="12" font-weight="700" fill="#27ae60" text-anchor="start">C_dec</text>
  <text x="765" y="238" font-size="12" fill="#6b7280" text-anchor="start">100 нФ</text>

  <!-- Right IC Box -->
  <rect x="825" y="155" width="90" height="150" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="870" y="210" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">
    <tspan x="870" dy="0">Цифрова ІС</tspan>
    <tspan x="870" dy="20">(ключ SW)</tspan>
  </text>

  <!-- Transistor/Switch symbol inside right IC -->
  <line x1="870" y1="242" x2="870" y2="252" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="862" y1="252" x2="878" y2="252" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="865" y1="262" x2="870" y2="252" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="870" y1="262" x2="870" y2="275" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Right Power Lines & Inductors -->
  <!-- Main V_CC Wire to Capacitor -->
  <line x1="585" y1="185" x2="630" y2="185" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 630 185 Q 637.5 173 645 185 Q 652.5 173 660 185 Q 667.5 173 675 185 Q 682.5 173 690 185" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="690" y1="185" x2="740" y2="185" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="660" y="165" font-size="12" fill="#6b7280" text-anchor="middle">L_VCC</text>

  <!-- Main GND Wire to Capacitor -->
  <line x1="740" y1="275" x2="690" y2="275" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 690 275 Q 682.5 287 675 275 Q 667.5 287 660 275 Q 652.5 287 645 275 Q 637.5 287 630 275" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="630" y1="275" x2="585" y2="275" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="660" y="305" font-size="12" fill="#6b7280" text-anchor="middle">L_GND</text>

  <!-- Short Wires from Capacitor to IC -->
  <line x1="740" y1="185" x2="825" y2="185" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="740" y1="275" x2="825" y2="275" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Short Local Pulse Loop (Green Dashed) -->
  <path d="M 725,172 L 815,172 Q 820,172 820,185 L 820,265 Q 820,278 815,278 L 725,278 Q 720,278 720,265 L 720,185 Q 720,172 725,172" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>

  <!-- Slow Recharging Current (Blue Line & Arrow) -->
  <path d="M 595,198 L 715,198" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="650" y="215" font-size="12" font-weight="600" fill="#2457d6" text-anchor="middle">НЧ струм підзарядки</text>
  <text x="650" y="233" font-size="12" fill="#6b7280" text-anchor="middle">(повільний заряд C_dec)</text>

  <!-- Right Oscillogram Box -->
  <rect x="510" y="335" width="410" height="130" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="520" y="354" font-size="12" font-weight="700" fill="#1a1a1a">Напруга V_IC(t) на виводах живлення ІС:</text>
  
  <!-- Nominal Line -->
  <line x1="530" y1="412" x2="900" y2="412" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="530" y="392" font-size="12" fill="#6b7280">V_CC (номінал)</text>
  
  <!-- Waveform (Green) -->
  <path d="M 530 412 L 620 412 L 630 409 L 645 410 L 660 407 L 675 412 L 900 412" fill="none" stroke="#27ae60" stroke-width="2"/>
  
  <!-- Waveform Annotation -->
  <text x="700" y="370" font-size="12" font-weight="700" fill="#27ae60">ΔV ≈ 0 (чиста напруга без сплесків)</text>
  <text x="520" y="452" font-size="12" font-weight="600" fill="#27ae60">✓ Надійна робота схеми та відсутність завад</text>
</svg>
