<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Стенд вимірювання паразитної ємності контактів макетної плати</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Збалансовані щупи 10X та еталонний резистор виділяють ємність доріжки з часового відгуку</text>

  <!-- БЛОК 1: Генератор імпульсів -->
  <rect x="25" y="70" width="200" height="335" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="125" y="94" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Генератор імпульсів</text>
  <text x="125" y="112" font-size="12" fill="#6b7280" text-anchor="middle">Джерело швидкого перепаду</text>

  <!-- Підпанель сигналу генератора -->
  <rect x="38" y="125" width="174" height="92" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <path d="M 50 150 L 72 150 L 72 136 L 112 136 L 112 150 L 152 150 L 152 136 L 176 136 L 176 150 L 200 150" stroke="#2457d6" stroke-width="2" fill="none"/>
  <text x="125" y="170" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Прямокутний імпульс</text>
  <text x="125" y="188" font-size="12" fill="#6b7280" text-anchor="middle">f = 100 кГц, tr &lt; 5 нс</text>
  <text x="125" y="206" font-size="12" fill="#6b7280" text-anchor="middle">Vpp = 3.3 В (CMOS)</text>

  <!-- Підпанель виходу BNC -->
  <rect x="38" y="227" width="174" height="80" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="125" y="246" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вихідний роз&apos;єм BNC</text>
  <circle cx="65" cy="278" r="12" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <circle cx="65" cy="278" r="3.5" fill="#2457d6"/>
  <text x="86" y="274" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Rвих = 50 Ом</text>
  <text x="86" y="292" font-size="12" fill="#6b7280" text-anchor="start">Коаксіальний кабель</text>

  <!-- Підпанель заземлення генератора -->
  <rect x="38" y="317" width="174" height="73" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="125" y="336" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Корпус / Заземлення</text>
  <line x1="125" y1="344" x2="125" y2="354" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="113" y1="354" x2="137" y2="354" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="117" y1="359" x2="133" y2="359" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="121" y1="364" x2="129" y2="364" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="125" y="380" font-size="12" fill="#6b7280" text-anchor="middle">Спільна точка GND</text>

  <!-- БЛОК 2: Макетна плата (DUT) -->
  <rect x="245" y="70" width="430" height="335" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="460" y="94" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Безпаяльна макетна плата (DUT)</text>
  <text x="460" y="112" font-size="12" fill="#6b7280" text-anchor="middle">Досліджувані контактні рейки та шина GND</text>

  <!-- Тіло макетної плати -->
  <rect x="258" y="125" width="404" height="267" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Вхідний вузол і еталонний резистор -->
  <line x1="212" y1="278" x2="275" y2="278" stroke="#2457d6" stroke-width="2"/>
  <line x1="275" y1="278" x2="275" y2="175" stroke="#2457d6" stroke-width="2"/>
  <line x1="275" y1="175" x2="295" y2="175" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <circle cx="300" cy="175" r="4.5" fill="#2457d6"/>
  <text x="300" y="196" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вузол Vin</text>

  <line x1="305" y1="175" x2="322" y2="175" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="322" y="167" width="38" height="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="360" y1="175" x2="380" y2="175" stroke="#1a1a1a" stroke-width="2"/>
  <text x="341" y="158" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Rref = 10 кОм</text>

  <!-- Доріжка 1 (досліджувана) -->
  <rect x="380" y="163" width="130" height="24" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="391" y="171" width="8" height="8" rx="1.5" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <rect x="416" y="171" width="8" height="8" rx="1.5" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <rect x="441" y="171" width="8" height="8" rx="1.5" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <rect x="466" y="171" width="8" height="8" rx="1.5" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <rect x="491" y="171" width="8" height="8" rx="1.5" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="445" y="154" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Доріжка 1 (досліджувана)</text>

  <!-- Паразитна ємність Cp -->
  <line x1="445" y1="187" x2="445" y2="207" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="432" y1="207" x2="458" y2="207" stroke="#c0392b" stroke-width="2"/>
  <line x1="432" y1="215" x2="458" y2="215" stroke="#c0392b" stroke-width="2"/>
  <line x1="445" y1="215" x2="445" y2="240" stroke="#c0392b" stroke-width="1.5"/>
  <text x="466" y="215" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">Cp = 2–5 пФ</text>

  <!-- Доріжка 2 (суміжна смуга) -->
  <rect x="380" y="240" width="130" height="24" rx="3" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="391" y="248" width="8" height="8" rx="1.5" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
  <rect x="416" y="248" width="8" height="8" rx="1.5" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
  <rect x="441" y="248" width="8" height="8" rx="1.5" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
  <rect x="466" y="248" width="8" height="8" rx="1.5" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
  <rect x="491" y="248" width="8" height="8" rx="1.5" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
  <text x="522" y="256" font-size="12" fill="#6b7280" text-anchor="start">Доріжка 2 (GND)</text>

  <!-- Діелектрик ABS та крок -->
  <text x="330" y="248" font-size="12" fill="#6b7280" text-anchor="middle">Діелектрик ABS</text>
  <text x="330" y="265" font-size="12" fill="#6b7280" text-anchor="middle">крок 2.54 мм</text>

  <!-- Заземлення доріжки 2 -->
  <line x1="395" y1="264" x2="395" y2="325" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="403" y="295" font-size="12" fill="#6b7280" text-anchor="start">Заземлення суміжної рейки</text>

  <!-- Шина заземлення (GND rail) -->
  <rect x="270" y="325" width="380" height="24" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="275" y1="337" x2="645" y2="337" stroke="#2457d6" stroke-width="2"/>
  <circle cx="295" cy="337" r="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <circle cx="345" cy="337" r="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <circle cx="395" cy="337" r="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <circle cx="445" cy="337" r="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <circle cx="495" cy="337" r="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <circle cx="545" cy="337" r="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <circle cx="595" cy="337" r="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <circle cx="635" cy="337" r="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="460" y="365" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Спільна шина заземлення (GND rail)</text>
  <text x="460" y="382" font-size="12" fill="#6b7280" text-anchor="middle">Точка підключення коротких земляних пружин щупів</text>

  <!-- З&apos;єднання GND генератора з шиною GND -->
  <line x1="212" y1="354" x2="238" y2="354" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="238" y1="354" x2="238" y2="337" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="238" y1="337" x2="270" y2="337" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Сигнальні лінії до осцилографа -->
  <!-- Лінія 1 (CH1): від Вузла Vin (300, 175) до CH1 (708, 295) -->
  <line x1="300" y1="175" x2="300" y2="134" stroke="#2457d6" stroke-width="2"/>
  <line x1="300" y1="134" x2="682" y2="134" stroke="#2457d6" stroke-width="2"/>
  <line x1="682" y1="134" x2="682" y2="295" stroke="#2457d6" stroke-width="2"/>
  <line x1="682" y1="295" x2="708" y2="295" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Лінія 2 (CH2): від кінця Доріжки 1 (495, 175) до CH2 (708, 335) -->
  <line x1="495" y1="175" x2="676" y2="175" stroke="#27ae60" stroke-width="2"/>
  <line x1="676" y1="175" x2="676" y2="335" stroke="#27ae60" stroke-width="2"/>
  <line x1="676" y1="335" x2="708" y2="335" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- БЛОК 3: Цифровий осцилограф -->
  <rect x="695" y="70" width="240" height="335" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="815" y="94" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Цифровий осцилограф</text>
  <text x="815" y="112" font-size="12" fill="#6b7280" text-anchor="middle">Фіксація форми перехідного процесу</text>

  <!-- Екран осцилографа -->
  <rect x="708" y="125" width="214" height="145" rx="4" fill="#1a1a1a" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Сітка екрана -->
  <line x1="750" y1="126" x2="750" y2="269" stroke="#334155" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="792" y1="126" x2="792" y2="269" stroke="#334155" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="834" y1="126" x2="834" y2="269" stroke="#334155" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="876" y1="126" x2="876" y2="269" stroke="#334155" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="709" y1="162" x2="921" y2="162" stroke="#334155" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="709" y1="198" x2="921" y2="198" stroke="#334155" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="709" y1="234" x2="921" y2="234" stroke="#334155" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Мітки каналів на екрані -->
  <rect x="716" y="132" width="40" height="15" rx="2" fill="#2457d6"/>
  <text x="736" y="144" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">CH1</text>
  <rect x="760" y="132" width="40" height="15" rx="2" fill="#27ae60"/>
  <text x="780" y="144" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">CH2</text>

  <!-- Осцилограма CH1 (Вхідний прямокутний імпульс) -->
  <path d="M 714 240 L 748 240 L 748 160 L 912 160" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
  <text x="898" y="154" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">Vin</text>

  <!-- Осцилограма CH2 (Відгук RC-кола з затягуванням фронту) -->
  <path d="M 714 240 L 748 240 C 768 240 788 200 818 174 C 838 164 868 160 912 160" stroke="#4ade80" stroke-width="2.5" fill="none"/>
  <text x="898" y="177" font-size="12" font-weight="bold" fill="#4ade80" text-anchor="middle">Vout</text>

  <!-- Вимірювання фронту tr -->
  <line x1="758" y1="160" x2="758" y2="240" stroke="#f4f6f8" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="818" y1="160" x2="818" y2="240" stroke="#f4f6f8" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="760" y1="200" x2="816" y2="200" stroke="#ffffff" stroke-width="1.5"/>
  <text x="788" y="194" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">tr = 2.2·τ</text>

  <!-- Вхідні гнізда осцилографа -->
  <!-- Вхід CH1 -->
  <rect x="708" y="278" width="214" height="34" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="726" cy="295" r="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="726" cy="295" r="2.5" fill="#2457d6"/>
  <text x="742" y="299" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">CH1: Вхідний сигнал Vin (10X щуп)</text>

  <!-- Вхід CH2 -->
  <rect x="708" y="318" width="214" height="34" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="726" cy="335" r="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="726" cy="335" r="2.5" fill="#27ae60"/>
  <text x="742" y="339" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">CH2: Відгук Vout на Cp (10X щуп)</text>

  <!-- Примітка щодо компенсації щупів -->
  <rect x="708" y="358" width="214" height="36" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="815" y="374" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Щупи 10X: Cщупа = 12 пФ</text>
  <text x="815" y="388" font-size="12" fill="#27ae60" text-anchor="middle">Збалансовані (без викидів)</text>

  <!-- КАРТКА 1: Формули та розрахунок -->
  <rect x="25" y="420" width="440" height="80" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="42" y="442" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="start">Методика обчислення паразитної ємності доріжки:</text>
  <text x="42" y="464" font-size="12" fill="#1a1a1a" text-anchor="start">1. Сумарна ємність: Ctotal = tr / (2.2 · Rref) = Cp + Cщупа</text>
  <text x="42" y="484" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">2. Шукана ємність: Cp = Ctotal - Cщупа = [tr / (2.2 · Rref)] - 12 пФ</text>

  <!-- КАРТКА 2: Вимоги до щупів 10X -->
  <rect x="495" y="420" width="440" height="80" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="512" y="442" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="start">Вимоги до вимірювальних щупів 10X:</text>
  <text x="512" y="464" font-size="12" fill="#1a1a1a" text-anchor="start">1. Щуп 10X знижує ємнісне навантаження до ~12 пФ (1X дає ~100 пФ)</text>
  <text x="512" y="484" font-size="12" fill="#1a1a1a" text-anchor="start">2. Земляна пружина замість дроту усуває дзвін індуктивної петлі</text>
</svg>
