<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Canvas Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Markers for Arrows -->
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Main Header -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Контактний опір затискачів та опір шини макетної плати</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Сумарний опір R = R_contact + R_strip спричиняє розподілене падіння напруги ΔV вздовж шини живлення</text>

  <!-- ================= LEFT PANEL: PHYSICAL STRUCTURE ================= -->
  <rect x="30" y="75" width="435" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Фізична будова пружинного контакту</text>

  <!-- Breadboard Sockets Container (White Box inside Left Panel) -->
  <rect x="50" y="120" width="395" height="155" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="247" y="135" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280">Пластиковий корпус (5 з'єднаних отворів A-E)</text>

  <!-- Socket holes (A, B, C, D, E) -->
  <!-- Hole A -->
  <rect x="85" y="152" width="30" height="14" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="100" y="147" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">A</text>

  <!-- Hole B -->
  <rect x="155" y="152" width="30" height="14" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="170" y="147" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">B</text>

  <!-- Hole C (Active Pin Inserted) -->
  <rect x="225" y="152" width="30" height="14" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="240" y="147" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">C</text>

  <!-- Hole D -->
  <rect x="295" y="152" width="30" height="14" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="310" y="147" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">D</text>

  <!-- Hole E -->
  <rect x="365" y="152" width="30" height="14" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="380" y="147" text-anchor="middle" font-size="12" font-weight="700" fill="#475569">E</text>

  <!-- Continuous Metal Bus Bar (Strip) at bottom of sockets -->
  <rect x="75" y="240" width="345" height="16" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <text x="247" y="253" text-anchor="middle" font-size="12" font-weight="700" fill="#1e293b">Суцільна металева смуга (шина)</text>

  <!-- Spring Leaves (5 Clips branching from bus bar) -->
  <!-- Clip A -->
  <path d="M 92,240 L 92,185 Q 92,175 100,175 L 100,185 Q 96,185 96,240" fill="#94a3b8" stroke="#475569" stroke-width="1"/>
  <path d="M 108,240 L 108,185 Q 108,175 100,175 L 100,185 Q 104,185 104,240" fill="#94a3b8" stroke="#475569" stroke-width="1"/>

  <!-- Clip B -->
  <path d="M 162,240 L 162,185 Q 162,175 170,175 L 170,185 Q 166,185 166,240" fill="#94a3b8" stroke="#475569" stroke-width="1"/>
  <path d="M 178,240 L 178,185 Q 178,175 170,175 L 170,185 Q 174,185 174,240" fill="#94a3b8" stroke="#475569" stroke-width="1"/>

  <!-- Clip C (Pinching Pin) -->
  <path d="M 231,240 L 231,185 Q 231,175 237,175 L 237,185 Q 235,185 235,240" fill="#64748b" stroke="#334155" stroke-width="1"/>
  <path d="M 249,240 L 249,185 Q 249,175 243,175 L 243,185 Q 245,185 245,240" fill="#64748b" stroke="#334155" stroke-width="1"/>

  <!-- Component Pin inserted into C -->
  <line x1="240" y1="140" x2="240" y2="200" stroke="#2457d6" stroke-width="4"/>
  <!-- Contact Points Highlight -->
  <circle cx="236" cy="180" r="4" fill="#c0392b"/>
  <circle cx="244" cy="180" r="4" fill="#c0392b"/>

  <!-- Clip D -->
  <path d="M 302,240 L 302,185 Q 302,175 310,175 L 310,185 Q 306,185 306,240" fill="#94a3b8" stroke="#475569" stroke-width="1"/>
  <path d="M 318,240 L 318,185 Q 318,175 310,175 L 310,185 Q 314,185 314,240" fill="#94a3b8" stroke="#475569" stroke-width="1"/>

  <!-- Clip E -->
  <path d="M 372,240 L 372,185 Q 372,175 380,175 L 380,185 Q 376,185 376,240" fill="#94a3b8" stroke="#475569" stroke-width="1"/>
  <path d="M 388,240 L 388,185 Q 388,175 380,175 L 380,185 Q 384,185 384,240" fill="#94a3b8" stroke="#475569" stroke-width="1"/>

  <!-- Pointer to Pin C / Contact Resistance -->
  <line x1="285" y1="180" x2="252" y2="180" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="292" y="184" font-size="12" font-weight="700" fill="#c0392b">R_contact (перехідний опір)</text>

  <!-- Left Panel Parameters Box (White Box at bottom of Left Panel) -->
  <rect x="50" y="290" width="395" height="195" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="247" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Параметри паразитних опорів</text>

  <!-- Item 1: R_contact -->
  <rect x="65" y="325" width="365" height="70" rx="5" fill="#fdecea" stroke="#f5c6cb" stroke-width="1"/>
  <text x="80" y="345" font-size="13" font-weight="700" fill="#c0392b">1. Перехідний опір контакту (R_contact = 0.05 ... 0.20 Ом)</text>
  <text x="80" y="365" font-size="12" fill="#1a1a1a">• Виникає в місці дотику пружинних пелюсток до ніжки</text>
  <text x="80" y="383" font-size="12" fill="#1a1a1a">• Зростає через оксидацію, бруд та ослаблення пружин</text>

  <!-- Item 2: R_strip -->
  <rect x="65" y="405" width="365" height="68" rx="5" fill="#eaf0fd" stroke="#b8daff" stroke-width="1"/>
  <text x="80" y="425" font-size="13" font-weight="700" fill="#2457d6">2. Опір металевої смуги (R_strip = 0.02 ... 0.08 Ом / секцію)</text>
  <text x="80" y="445" font-size="12" fill="#1a1a1a">• Власний опір матеріалу пружинної вилки (латунь/бронза)</text>
  <text x="80" y="463" font-size="12" fill="#1a1a1a">• Накопичується послідовно вздовж усієї довжини шини</text>


  <!-- ================= RIGHT PANEL: EQUIVALENT SCHEMATIC & DROP ================= -->
  <rect x="495" y="75" width="435" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="712" y="102" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Еквівалентна схема та просідання напруги</text>

  <!-- Schematic Container (White Box inside Right Panel) -->
  <rect x="515" y="120" width="395" height="155" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="712" y="138" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280">Еквівалентна схема шини живлення з навантаженням</text>

  <!-- Schematic Elements -->
  <!-- Power Input V_in -->
  <circle cx="540" cy="175" r="5" fill="#27ae60" stroke="#1e8449" stroke-width="1.5"/>
  <text x="560" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">V_in = 5.00В</text>

  <!-- Wire 0 to Resistor Strip 1 -->
  <line x1="545" y1="175" x2="570" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- R_strip1 (Resistor 1) -->
  <rect x="570" y="168" width="30" height="14" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="585" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">R_s1</text>

  <line x1="600" y1="175" x2="640" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Node 1 -->
  <circle cx="640" cy="175" r="4" fill="#1a1a1a"/>
  <text x="640" y="162" text-anchor="middle" font-size="12" fill="#1a1a1a">4.95В</text>

  <!-- Vertical Branch 1 (Contact Resistor R_c1) -->
  <line x1="640" y1="179" x2="640" y2="195" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="633" y="195" width="14" height="26" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="655" y="212" font-size="12" font-weight="700" fill="#c0392b">R_c1</text>
  <line x1="640" y1="221" x2="640" y2="235" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="640" y="250" text-anchor="middle" font-size="12" fill="#6b7280">Вуз. 1</text>

  <!-- Wire Node 1 to Resistor Strip 2 -->
  <line x1="644" y1="175" x2="685" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- R_strip2 (Resistor 2) -->
  <rect x="685" y="168" width="30" height="14" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="700" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">R_s2</text>

  <line x1="715" y1="175" x2="755" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Node 2 -->
  <circle cx="755" cy="175" r="4" fill="#1a1a1a"/>
  <text x="755" y="162" text-anchor="middle" font-size="12" fill="#1a1a1a">4.88В</text>

  <!-- Vertical Branch 2 (Contact Resistor R_c2) -->
  <line x1="755" y1="179" x2="755" y2="195" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="748" y="195" width="14" height="26" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="770" y="212" font-size="12" font-weight="700" fill="#c0392b">R_c2</text>
  <line x1="755" y1="221" x2="755" y2="235" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="755" y="250" text-anchor="middle" font-size="12" fill="#6b7280">Вуз. 2</text>

  <!-- Wire Node 2 to Resistor Strip 3 -->
  <line x1="759" y1="175" x2="800" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- R_strip3 (Resistor 3) -->
  <rect x="800" y="168" width="30" height="14" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="815" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">R_s3</text>

  <line x1="830" y1="175" x2="865" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Node 3 (Load Node) -->
  <circle cx="865" cy="175" r="4" fill="#c0392b"/>
  <text x="865" y="162" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">4.65В</text>

  <!-- Vertical Branch 3 (Load Current I_load) -->
  <line x1="865" y1="179" x2="865" y2="195" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="858" y="195" width="14" height="26" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="878" y="212" font-size="12" font-weight="700" fill="#c0392b">R_c3</text>
  <line x1="865" y1="221" x2="865" y2="235" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="865" y="250" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">I_load</text>


  <!-- Voltage Drop Plot Box (White Box at bottom of Right Panel) -->
  <rect x="515" y="290" width="395" height="195" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="712" y="312" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Розподіл напруги V(x) вздовж довжини шини</text>

  <!-- Plot Axes -->
  <!-- Y axis (Voltage) -->
  <line x1="560" y1="335" x2="560" y2="445" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="555" y="332" text-anchor="end" font-size="12" font-weight="700" fill="#1a1a1a">V (В)</text>

  <!-- X axis (Distance/Node) -->
  <line x1="560" y1="445" x2="885" y2="445" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="875" y="440" text-anchor="end" font-size="12" font-weight="700" fill="#1a1a1a">Позиція x</text>

  <!-- Y axis Grid Lines & Labels -->
  <!-- 5.00V Line -->
  <line x1="560" y1="350" x2="870" y2="350" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="552" y="354" text-anchor="end" font-size="12" fill="#27ae60">5.00</text>

  <!-- 4.80V Line -->
  <line x1="560" y1="390" x2="870" y2="390" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="552" y="394" text-anchor="end" font-size="12" fill="#6b7280">4.80</text>

  <!-- 4.60V Line -->
  <line x1="560" y1="430" x2="870" y2="430" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="552" y="434" text-anchor="end" font-size="12" fill="#c0392b">4.60</text>

  <!-- X axis Node Tick Labels -->
  <text x="575" y="462" text-anchor="middle" font-size="12" fill="#6b7280">Вхід</text>
  <text x="655" y="462" text-anchor="middle" font-size="12" fill="#6b7280">Вуз. 1</text>
  <text x="745" y="462" text-anchor="middle" font-size="12" fill="#6b7280">Вуз. 2</text>
  <text x="835" y="462" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">Вуз. 3</text>

  <!-- Shaded Voltage Drop Area -->
  <polygon points="575,350 655,360 745,374 835,420 835,350" fill="#fdecea" opacity="0.6"/>

  <!-- Voltage Drop Curve Line -->
  <polyline points="575,350 655,360 745,374 835,420" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Data Points on Curve -->
  <circle cx="575" cy="350" r="4" fill="#27ae60"/>
  <circle cx="655" cy="360" r="4" fill="#2457d6"/>
  <circle cx="745" cy="374" r="4" fill="#2457d6"/>
  <circle cx="835" cy="420" r="4" fill="#c0392b"/>

  <!-- Voltage Drop Delta Badge Callout -->
  <rect x="735" y="330" width="135" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="802" y="346" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">ΔV = 0.35 В (просідання)</text>
</svg>
