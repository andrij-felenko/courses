<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Definitions -->
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема живлення та силових шин CCPM-тестера сервоприводів</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Розділення силової шини сервоприводів V_SERVO та VCC_MCU для захисту мікроконтролера від завад</text>

  <!-- PANEL 1: Power Input -->
  <rect x="30" y="70" width="200" height="410" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="45" y="95" font-size="14" font-weight="bold" fill="#c0392b">Вхід живлення</text>
  <text x="45" y="115" font-size="12" fill="#6b7280">4.8–6.0В DC (BEC / Bat)</text>

  <!-- Input Terminal Block -->
  <rect x="45" y="140" width="70" height="90" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="80" y="160" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Роз'єм IN</text>
  <circle cx="80" cy="180" r="5" fill="#c0392b"/>
  <text x="80" y="197" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+V_IN</text>
  <circle cx="80" cy="212" r="5" fill="#1a1a1a"/>
  <text x="80" y="228" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GND</text>

  <!-- Protection Diode D1 -->
  <rect x="135" y="167" width="50" height="26" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="160" y="184" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">D1</text>

  <!-- Input Capacitors C1, C2 -->
  <line x1="140" y1="230" x2="140" y2="440" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="125" y="260" width="30" height="30" rx="2" fill="#ffffff" stroke="#c0392b"/>
  <text x="140" y="279" font-size="12" fill="#c0392b" text-anchor="middle">C1</text>

  <rect x="175" y="260" width="30" height="30" rx="2" fill="#ffffff" stroke="#c0392b"/>
  <text x="190" y="279" font-size="12" fill="#c0392b" text-anchor="middle">C2</text>

  <!-- PANEL 2: MCU Power & LDO -->
  <rect x="250" y="70" width="370" height="180" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="265" y="95" font-size="14" font-weight="bold" fill="#2457d6">Вузол стабілізації VCC MCU</text>
  <text x="265" y="115" font-size="12" fill="#6b7280">LDO-стабілізатор та LC-фільтрація</text>

  <!-- LDO Module -->
  <rect x="270" y="135" width="110" height="65" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="325" y="158" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">AMS1117</text>
  <text x="285" y="185" font-size="12" fill="#c0392b">IN</text>
  <text x="325" y="185" font-size="12" fill="#1a1a1a" text-anchor="middle">GND</text>
  <text x="365" y="185" font-size="12" fill="#2457d6" text-anchor="end">OUT</text>

  <!-- Ferrite Bead FB1 -->
  <rect x="410" y="153" width="45" height="28" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="432" y="171" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">FB1</text>

  <!-- Filter Cap C3 -->
  <rect x="480" y="180" width="35" height="30" rx="2" fill="#ffffff" stroke="#2457d6"/>
  <text x="497" y="199" font-size="12" fill="#2457d6" text-anchor="middle">C3</text>

  <!-- PANEL 3: MCU Core -->
  <rect x="250" y="270" width="370" height="210" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="265" y="295" font-size="14" font-weight="bold" fill="#27ae60">Мікроконтролер (MCU)</text>

  <!-- MCU Main Frame -->
  <rect x="270" y="315" width="330" height="145" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>

  <!-- MCU Sub-blocks -->
  <rect x="285" y="335" width="125" height="40" rx="3" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="347" y="359" font-size="12" fill="#1a1a1a" text-anchor="middle">АЦП (Потенціометр)</text>

  <rect x="285" y="395" width="125" height="40" rx="3" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="347" y="419" font-size="12" fill="#1a1a1a" text-anchor="middle">GPIO (Кнопка режиму)</text>

  <rect x="435" y="335" width="150" height="100" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="510" y="360" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Таймер ШІМ</text>
  <text x="510" y="385" font-size="12" fill="#6b7280" text-anchor="middle">Генератор 50 Гц / 20 мс</text>
  <text x="510" y="410" font-size="12" fill="#27ae60" text-anchor="middle">Виходи CH1, CH2, CH3</text>

  <!-- PANEL 4: Output Servo Bus -->
  <rect x="640" y="70" width="290" height="410" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="655" y="95" font-size="14" font-weight="bold" fill="#1a1a1a">Шина виходів CCPM</text>
  <text x="655" y="115" font-size="12" fill="#6b7280">Пряме силове живлення та ШІМ</text>

  <!-- Header CH1 -->
  <rect x="655" y="145" width="260" height="75" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="670" y="168" font-size="12" font-weight="bold" fill="#1a1a1a">Канал CH1 (Сервопривод 1)</text>
  <circle cx="695" cy="195" r="6" fill="#27ae60"/>
  <text x="684" y="199" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">SIG</text>
  <circle cx="785" cy="195" r="6" fill="#c0392b"/>
  <text x="774" y="199" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">VCC</text>
  <circle cx="885" cy="195" r="6" fill="#1a1a1a"/>
  <text x="874" y="199" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">GND</text>

  <!-- Header CH2 -->
  <rect x="655" y="245" width="260" height="75" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="670" y="268" font-size="12" font-weight="bold" fill="#1a1a1a">Канал CH2 (Сервопривод 2)</text>
  <circle cx="695" cy="295" r="6" fill="#27ae60"/>
  <text x="684" y="299" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">SIG</text>
  <circle cx="785" cy="295" r="6" fill="#c0392b"/>
  <text x="774" y="299" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">VCC</text>
  <circle cx="885" cy="295" r="6" fill="#1a1a1a"/>
  <text x="874" y="299" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">GND</text>

  <!-- Header CH3 -->
  <rect x="655" y="345" width="260" height="75" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="670" y="368" font-size="12" font-weight="bold" fill="#1a1a1a">Канал CH3 (Серво / ESC)</text>
  <circle cx="695" cy="395" r="6" fill="#27ae60"/>
  <text x="684" y="399" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">SIG</text>
  <circle cx="785" cy="395" r="6" fill="#c0392b"/>
  <text x="774" y="399" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">VCC</text>
  <circle cx="885" cy="395" r="6" fill="#1a1a1a"/>
  <text x="874" y="399" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">GND</text>

  <!-- WIRING & POWER RAILS -->

  <!-- High Current Servo Power Rail (Red V_SERVO) -->
  <path d="M 85,180 L 135,180 M 185,180 L 785,180 L 785,395" fill="none" stroke="#c0392b" stroke-width="3"/>
  <line x1="785" y1="295" x2="785" y2="295" stroke="#c0392b" stroke-width="3"/>
  <!-- Branch to LDO IN -->
  <path d="M 270,167 L 240,167 L 240,180" fill="none" stroke="#c0392b" stroke-width="2"/>
  <circle cx="240" cy="180" r="3" fill="#c0392b"/>
  <text x="340" y="130" font-size="12" font-weight="bold" fill="#c0392b">Силова шина V_SERVO (до 3–5А)</text>

  <!-- Common Ground Bus (Black GND) -->
  <path d="M 85,212 L 110,212 L 110,450 L 885,450 L 885,395" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="325" y1="200" x2="325" y2="450" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="885" y1="195" x2="885" y2="450" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="885" y1="295" x2="885" y2="450" stroke="#1a1a1a" stroke-width="3"/>
  <text x="600" y="475" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Спільний провід заземлення GND</text>

  <!-- Clean MCU Power Line (Blue VCC_MCU) -->
  <path d="M 380,167 L 410,167 M 455,167 L 550,167 L 550,315" fill="none" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="562" y="240" font-size="12" font-weight="bold" fill="#2457d6">VCC MCU (3.3V)</text>

  <!-- Signal PWM Lines (Green SIG1, SIG2, SIG3) -->
  <path d="M 585,370 L 695,370 L 695,195" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <path d="M 585,390 L 695,390 L 695,295" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <path d="M 585,410 L 695,410 L 695,395" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="625" y="340" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">ШІМ Сигнали</text>

</svg>
