<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <defs>
    <!-- Arrow markers -->
    <marker id="arr-1a1a1a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-2457d6" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-27ae60" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-c0392b" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Структурно-блочна схема автономного CCPM-тестера</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Формування керуючого ШІМ-сигналу в режимах Manual, Neutral та Auto з розгалуженням на 3 вихідні канали</text>

  <!-- ================= COLUMN 1: POWER & CONTROLS ================= -->
  <!-- Power Supply Box -->
  <rect x="40" y="80" width="200" height="70" fill="#fdecea" stroke="#f5c6cb" stroke-width="1" rx="6"/>
  <text x="140" y="102" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Живлення приладу</text>
  <text x="140" y="122" font-size="12" fill="#1a1a1a" text-anchor="middle">VCC: 4.8 – 6.0 В DC</text>
  <text x="140" y="138" font-size="11" fill="#6b7280" text-anchor="middle">(захист від переполюсовки)</text>

  <!-- Controls Box -->
  <rect x="40" y="170" width="200" height="270" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="140" y="192" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Органи керування</text>

  <!-- Manual Mode Control Block -->
  <rect x="52" y="210" width="176" height="60" fill="#eaf0fd" stroke="#b8daff" stroke-width="1" rx="4"/>
  <text x="140" y="232" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Ручне (Manual)</text>
  <text x="140" y="252" font-size="11" fill="#6b7280" text-anchor="middle">Потенціометр 1000–2000 мкс</text>

  <!-- Neutral Mode Control Block -->
  <rect x="52" y="280" width="176" height="60" fill="#e9f7ef" stroke="#c3e6cb" stroke-width="1" rx="4"/>
  <text x="140" y="302" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">2. Нейтраль (Neutral)</text>
  <text x="140" y="322" font-size="11" fill="#6b7280" text-anchor="middle">Фіксований еталон 1500 мкс</text>

  <!-- Auto Mode Control Block -->
  <rect x="52" y="350" width="176" height="60" fill="#fdecea" stroke="#f5c6cb" stroke-width="1" rx="4"/>
  <text x="140" y="372" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">3. Авто (Auto Sweep)</text>
  <text x="140" y="392" font-size="11" fill="#6b7280" text-anchor="middle">Циклічна розгортка 50 Гц</text>

  <text x="140" y="426" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кнопка «Select Mode»</text>

  <!-- ================= COLUMN 2: PWM GENERATOR CORE ================= -->
  <rect x="290" y="80" width="360" height="360" fill="#ffffff" stroke="#2457d6" stroke-width="2" rx="8"/>
  <rect x="290" y="80" width="360" height="40" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="8"/>
  <text x="470" y="105" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Ядро генератора ШІМ (PWM Controller)</text>

  <!-- Mode Selector Block -->
  <rect x="310" y="140" width="320" height="65" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="470" y="162" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Комутатор режимів сигналів</text>
  <text x="470" y="182" font-size="11" fill="#6b7280" text-anchor="middle">Перемикання задавання імпульсу</text>

  <!-- Base Clock Generator Block -->
  <rect x="310" y="220" width="320" height="65" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="470" y="242" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Формувач періоду T = 20 мс (f = 50 Гц)</text>
  <text x="470" y="262" font-size="11" fill="#6b7280" text-anchor="middle">Стабілізація тактової частоти імпульсів</text>

  <!-- PWM Modulator Block -->
  <rect x="310" y="300" width="320" height="65" fill="#eaf0fd" stroke="#b8daff" stroke-width="1" rx="4"/>
  <text x="470" y="322" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Модулятор тривалості t_w (1000–2000 мкс)</text>
  <text x="470" y="342" font-size="11" fill="#6b7280" text-anchor="middle">Формування прямокутного сигналу 5 В</text>

  <!-- LED Indicators Bar -->
  <rect x="310" y="380" width="320" height="45" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <circle cx="360" cy="402" r="6" fill="#2457d6"/>
  <text x="380" y="406" font-size="11" font-weight="bold" fill="#1a1a1a">Manual</text>
  <circle cx="460" cy="402" r="6" fill="#27ae60"/>
  <text x="480" y="406" font-size="11" font-weight="bold" fill="#1a1a1a">Neutral</text>
  <circle cx="560" cy="402" r="6" fill="#c0392b"/>
  <text x="580" y="406" font-size="11" font-weight="bold" fill="#1a1a1a">Auto</text>

  <!-- Internal Core Connectors -->
  <line x1="470" y1="205" x2="470" y2="220" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-1a1a1a)"/>
  <line x1="470" y1="285" x2="470" y2="300" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-1a1a1a)"/>

  <!-- ================= COLUMN 3: OUTPUT CHANNELS ================= -->
  <rect x="700" y="80" width="220" height="360" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <rect x="700" y="80" width="220" height="40" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="8"/>
  <text x="810" y="105" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Вихідний буфер і канали</text>

  <!-- Out Channel 1 -->
  <rect x="715" y="135" width="190" height="75" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="810" y="155" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Канал 1 (Out 1)</text>
  <text x="810" y="173" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Сервопривод 1 / ESC</text>
  <text x="810" y="190" font-size="11" fill="#6b7280" text-anchor="middle">[ Signal | VCC | GND ]</text>

  <!-- Out Channel 2 -->
  <rect x="715" y="230" width="190" height="75" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="810" y="250" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Канал 2 (Out 2)</text>
  <text x="810" y="268" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Сервопривод 2</text>
  <text x="810" y="285" font-size="11" fill="#6b7280" text-anchor="middle">[ Signal | VCC | GND ]</text>

  <!-- Out Channel 3 -->
  <rect x="715" y="325" width="190" height="75" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="810" y="345" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Канал 3 (Out 3)</text>
  <text x="810" y="363" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Сервопривод 3</text>
  <text x="810" y="380" font-size="11" fill="#6b7280" text-anchor="middle">[ Signal | VCC | GND ]</text>

  <text x="810" y="425" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Синхронний ШІМ 50 Гц</text>

  <!-- ================= EXTERNAL ARROWS ================= -->
  <!-- Power Arrow -->
  <line x1="240" y1="115" x2="290" y2="115" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-c0392b)"/>
  <text x="265" y="107" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">VCC/GND</text>

  <!-- Control Input Arrows -->
  <path d="M 228,240 L 260,240 L 260,172 L 310,172" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-2457d6)"/>
  <path d="M 228,310 L 270,310 L 270,172 L 310,172" fill="none" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-27ae60)"/>
  <path d="M 228,380 L 280,380 L 280,172 L 310,172" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-c0392b)"/>

  <!-- Output Signal Arrow & Distribution Bus -->
  <line x1="630" y1="332" x2="700" y2="332" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-2457d6)"/>
  <text x="665" y="322" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">ШІМ (PWM)</text>

  <!-- Internal Bus Distribution in Output Box -->
  <line x1="708" y1="172" x2="708" y2="362" stroke="#2457d6" stroke-width="2"/>
  <line x1="708" y1="172" x2="715" y2="172" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-2457d6)"/>
  <line x1="708" y1="267" x2="715" y2="267" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-2457d6)"/>
  <line x1="708" y1="362" x2="715" y2="362" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-2457d6)"/>

  <!-- ================= BOTTOM BANNER ================= -->
  <rect x="40" y="460" width="880" height="36" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="480" y="482" font-size="12" fill="#1a1a1a" text-anchor="middle">Шлях сигналу: Органі керування (Manual / Neutral / Auto) ➔ ШІМ-генератор (50 Гц) ➔ Вивід на 3 канали (Out 1..3)</text>
</svg>
