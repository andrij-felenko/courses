<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>
  
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Схема підключення та калібрування тестера CCPM</text>
  <text x="480" y="52" font-size="13" text-anchor="middle" fill="#6b7280">Органи керування, підключення приладів та безпечна послідовність подачі живлення</text>

  <!-- Panel 1: Power Supply -->
  <rect x="25" y="75" width="175" height="135" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="25" y="75" width="175" height="28" rx="8" fill="#eaf0fd"/>
  <text x="112" y="94" font-size="13" font-weight="bold" text-anchor="middle" fill="#2457d6">Живлення тестера</text>
  <text x="35" y="122" font-size="12" fill="#1a1a1a">Напруга: 4.8–6.0 В DC</text>
  <text x="35" y="142" font-size="12" fill="#6b7280">(4×NiMH або BEC 5V)</text>
  <text x="35" y="166" font-size="12" fill="#1a1a1a">Клеми: S / + / -</text>
  <text x="35" y="190" font-size="12" font-weight="bold" fill="#27ae60">● Готовність до роботи</text>

  <!-- Panel 2: CCPM Tester Unit -->
  <rect x="225" y="75" width="285" height="275" rx="10" fill="#f4f6f8" stroke="#2457d6" stroke-width="2"/>
  <rect x="225" y="75" width="285" height="32" rx="10" fill="#2457d6"/>
  <text x="367" y="96" font-size="14" font-weight="bold" text-anchor="middle" fill="#ffffff">Тестер CCPM (3-Channel Servo/ESC)</text>

  <!-- Input Port -->
  <rect x="235" y="125" width="45" height="40" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="257" y="142" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">IN</text>
  <text x="257" y="157" font-size="10" text-anchor="middle" fill="#6b7280">S + -</text>

  <!-- Output Ports -->
  <rect x="455" y="125" width="45" height="110" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="477" y="142" font-size="11" font-weight="bold" text-anchor="middle" fill="#27ae60">CH1</text>
  <text x="477" y="177" font-size="11" font-weight="bold" text-anchor="middle" fill="#c0392b">CH2</text>
  <text x="477" y="212" font-size="11" font-weight="bold" text-anchor="middle" fill="#6b7280">CH3</text>

  <!-- Mode LEDs Block -->
  <rect x="295" y="125" width="145" height="80" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="367" y="142" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Режими роботи</text>
  <circle cx="310" cy="158" r="4" fill="#27ae60"/>
  <text x="320" y="162" font-size="11" fill="#1a1a1a">Manual (Ручний)</text>
  <circle cx="310" cy="176" r="4" fill="#2457d6"/>
  <text x="320" y="180" font-size="11" fill="#1a1a1a">Neutral (1500 мкс)</text>
  <circle cx="310" cy="194" r="4" fill="#6b7280"/>
  <text x="320" y="198" font-size="11" fill="#1a1a1a">Auto (Авто-скан)</text>

  <!-- Select Button -->
  <rect x="295" y="215" width="145" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="367" y="232" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">Кнопка SELECT / MODE</text>

  <!-- Potentiometer Knob -->
  <circle cx="367" cy="295" r="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="367" cy="295" r="16" fill="#f4f6f8" stroke="#d0d7de"/>
  <line x1="367" y1="295" x2="367" y2="274" stroke="#2457d6" stroke-width="3" stroke-linecap="round"/>
  <text x="367" y="338" font-size="11" text-anchor="middle" fill="#6b7280">Ручка регулювання імпульсу</text>
  <text x="305" y="298" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">1000мкс</text>
  <text x="367" y="262" font-size="11" font-weight="bold" text-anchor="middle" fill="#2457d6">1500мкс</text>
  <text x="430" y="298" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">2000мкс</text>

  <!-- Signal Wires -->
  <path d="M 200 145 L 235 145" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <path d="M 500 145 L 535 145" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <path d="M 500 180 Q 518 180, 518 290 T 535 290" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arr-red)"/>

  <!-- Panel 3: Servomotor (Channel 1) -->
  <rect x="535" y="75" width="400" height="155" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="550" y="98" font-size="14" font-weight="bold" fill="#27ae60">Канал 1: Сервопривід (Центрування)</text>
  
  <rect x="555" y="115" width="80" height="75" rx="4" fill="#1a1a1a"/>
  <circle cx="595" cy="140" r="14" fill="#d0d7de"/>
  <line x1="595" y1="140" x2="595" y2="105" stroke="#27ae60" stroke-width="4" stroke-linecap="round"/>
  <line x1="595" y1="140" x2="560" y2="140" stroke="#6b7280" stroke-width="2" stroke-dasharray="3,3"/>
  <line x1="595" y1="140" x2="630" y2="140" stroke="#6b7280" stroke-width="2" stroke-dasharray="3,3"/>

  <text x="650" y="125" font-size="12" font-weight="bold" fill="#27ae60">Режим Neutral (1500 мкс):</text>
  <text x="650" y="145" font-size="12" fill="#1a1a1a">● Встановлення качалки під кутом 90°</text>
  <text x="650" y="165" font-size="12" fill="#1a1a1a">● Механічне центрування тяг</text>
  <text x="650" y="185" font-size="12" fill="#6b7280">Кути ходу: 0° (1000мкс) ... 180° (2000мкс)</text>
  <text x="650" y="210" font-size="11" fill="#1a1a1a">Кабель: Жовтий(S), Червоний(+), Коричневий(-)</text>

  <!-- Panel 4: ESC & Brushless Motor (Channel 2) -->
  <rect x="535" y="245" width="400" height="175" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="550" y="268" font-size="14" font-weight="bold" fill="#c0392b">Канал 2: ESC та безколекторний мотор (BLDC)</text>

  <rect x="555" y="285" width="85" height="50" rx="4" fill="#2457d6"/>
  <text x="597" y="314" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">ESC 30A</text>

  <circle cx="695" cy="310" r="22" fill="#d0d7de" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="695" cy="310" r="7" fill="#1a1a1a"/>
  <text x="695" y="348" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">BLDC Motor</text>

  <line x1="640" y1="300" x2="673" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="640" y1="310" x2="673" y2="310" stroke="#2457d6" stroke-width="2"/>
  <line x1="640" y1="320" x2="673" y2="320" stroke="#c0392b" stroke-width="2"/>

  <!-- Safety Warning Box -->
  <rect x="740" y="280" width="185" height="80" rx="6" fill="#ffffff" stroke="#c0392b"/>
  <text x="832" y="300" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">⚠️ УВАГА: БЕЗПЕКА</text>
  <text x="748" y="318" font-size="11" fill="#1a1a1a">● Калібрування проводить-</text>
  <text x="753" y="333" font-size="11" font-weight="bold" fill="#c0392b">  ся БЕЗ пропелера!</text>
  <text x="748" y="348" font-size="11" fill="#6b7280">● Запобігання травмам</text>

  <text x="550" y="372" font-size="11" fill="#1a1a1a">Силові дроти ESC (+ / -): до LiPo акумулятора 2S–4S</text>
  <text x="550" y="392" font-size="11" font-weight="bold" fill="#c0392b">Подача силового живлення — ЛИШЕ після налаштування тестера!</text>

  <!-- Panel 5: PWM Waveforms -->
  <rect x="25" y="365" width="485" height="170" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="40" y="388" font-size="13" font-weight="bold" fill="#1a1a1a">Характеристика імпульсного сигналу PWM (50 Гц)</text>

  <path d="M 45 440 L 65 440 L 65 415 L 85 415 L 85 440 L 130 440" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  <text x="87" y="408" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">1000 мкс</text>
  <text x="87" y="456" font-size="11" text-anchor="middle" fill="#6b7280">Min / Throttle Off (0°)</text>

  <path d="M 175 440 L 195 440 L 195 415 L 225 415 L 225 440 L 270 440" stroke="#2457d6" stroke-width="2" fill="none"/>
  <text x="210" y="408" font-size="11" font-weight="bold" text-anchor="middle" fill="#2457d6">1500 мкс</text>
  <text x="210" y="456" font-size="11" text-anchor="middle" fill="#2457d6">Neutral / Center (90°)</text>

  <path d="M 315 440 L 335 440 L 335 415 L 375 415 L 375 440 L 420 440" stroke="#27ae60" stroke-width="2" fill="none"/>
  <text x="355" y="408" font-size="11" font-weight="bold" text-anchor="middle" fill="#27ae60">2000 мкс</text>
  <text x="355" y="456" font-size="11" text-anchor="middle" fill="#27ae60">Max / Full Throttle (180°)</text>

  <text x="40" y="485" font-size="11" fill="#1a1a1a">● Тривалість імпульсу керує валом або точками газу ESC.</text>
  <text x="40" y="503" font-size="11" fill="#6b7280">● Частота повторення: 50 Гц (період кадрів T = 20 мс).</text>
  <text x="40" y="521" font-size="11" font-weight="bold" fill="#2457d6">● Режим Auto здійснює плавну осциляцію 1000–2000 мкс.</text>

  <!-- Panel 6: ESC Calibration Sequence -->
  <rect x="535" y="430" width="400" height="105" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="550" y="450" font-size="13" font-weight="bold" fill="#2457d6">Послідовність безпечного калібрування ESC:</text>
  <text x="550" y="470" font-size="11" fill="#1a1a1a">1. Живлення 5В на тестер, Manual і 2000 мкс (Max).</text>
  <text x="550" y="487" font-size="11" fill="#1a1a1a">2. Підключити LiPo до ESC (звуковий сигнал 🎵).</text>
  <text x="550" y="504" font-size="11" fill="#1a1a1a">3. Швидко зменшити імпульс до 1000 мкс (Min).</text>
  <text x="550" y="521" font-size="11" font-weight="bold" fill="#27ae60">4. Підтверджувальний біп — записи збережено!</text>
</svg>
