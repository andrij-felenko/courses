<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Definitions -->
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Порівняння сигналів ШІМ: Аналоговий, CCPM та Цифровий режими</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Зростання частоти кадрів від 50 Гц до 333–560 Гц підвищує відгук та точність утримання приводу</text>

  <!-- PANEL 1: Analog 50 Hz -->
  <rect x="30" y="70" width="900" height="110" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="93" font-size="14" font-weight="bold" fill="#1a1a1a">1. Класичний аналоговий ШІМ (50 Гц / T = 20 мс)</text>
  <text x="45" y="112" font-size="12" fill="#6b7280">t_pulse = 1000–2000 мкс (один підкачувальний імпульс на кадр)</text>

  <!-- Waveform 1 -->
  <path d="M 460,160 L 480,160 L 480,130 L 540,130 L 540,160 L 840,160 L 840,130 L 880,130 L 880,160" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="510" y="122" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold">t_pulse = 1500 мкс</text>
  <line x1="480" y1="125" x2="540" y2="125" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
  
  <!-- Period T=20ms line -->
  <line x1="480" y1="172" x2="840" y2="172" stroke="#1a1a1a" stroke-width="1" marker-start="url(#arr-dark)" marker-end="url(#arr-dark)"/>
  <text x="660" y="168" font-size="12" fill="#1a1a1a" text-anchor="middle">T = 20 мс (50 Гц)</text>

  <!-- PANEL 2: CCPM 3-Channel Sync 50 Hz -->
  <rect x="30" y="195" width="900" height="115" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="45" y="217" font-size="14" font-weight="bold" fill="#2457d6">2. Триканальний CCPM режим (50 Гц / 3 синхронні виходи)</text>
  <text x="45" y="235" font-size="12" fill="#6b7280">Синхронне генерування 3 ШІМ-імпульсів (CH1, CH2, CH3) для автомата перекосу</text>

  <!-- CH1 Waveform -->
  <text x="505" y="253" font-size="12" font-weight="bold" fill="#2457d6">CH1</text>
  <path d="M 535,255 L 550,255 L 550,242 L 598,242 L 598,255 L 880,255" fill="none" stroke="#2457d6" stroke-width="1.5"/>

  <!-- CH2 Waveform -->
  <text x="505" y="273" font-size="12" font-weight="bold" fill="#2457d6">CH2</text>
  <path d="M 535,275 L 550,275 L 550,262 L 610,262 L 610,275 L 880,275" fill="none" stroke="#2457d6" stroke-width="1.5"/>

  <!-- CH3 Waveform -->
  <text x="505" y="293" font-size="12" font-weight="bold" fill="#2457d6">CH3</text>
  <path d="M 535,295 L 550,295 L 550,282 L 622,282 L 622,295 L 880,295" fill="none" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Sync Start Marker Line -->
  <line x1="550" y1="238" x2="550" y2="300" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="550" y="306" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Синхронний старт</text>

  <!-- PANEL 3: Digital High Frequency 333-560 Hz -->
  <rect x="30" y="325" width="900" height="115" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="45" y="347" font-size="14" font-weight="bold" fill="#27ae60">3. Цифровий високочастотний ШІМ (333 Гц … 560 Гц / T = 1.8–3.0 мс)</text>
  <text x="45" y="365" font-size="12" fill="#6b7280">Висока частота кадрів забезпечує миттєву корекцію сили та утримання ротора</text>

  <!-- High Frequency Waveform -->
  <path d="M 520,415 L 540,415 L 540,385 L 570,385 L 570,415 L 600,415 L 600,385 L 630,385 L 630,415 L 660,415 L 660,385 L 690,385 L 690,415 L 720,415 L 720,385 L 750,385 L 750,415 L 780,415 L 780,385 L 810,385 L 810,415 L 840,415 L 840,385 L 870,385 L 870,415 L 890,415" fill="none" stroke="#27ae60" stroke-width="2"/>

  <!-- Period Marker for HF -->
  <line x1="540" y1="426" x2="600" y2="426" stroke="#27ae60" stroke-width="1" marker-start="url(#arr-green)" marker-end="url(#arr-green)"/>
  <text x="570" y="422" font-size="11" fill="#27ae60" font-weight="bold" text-anchor="middle">T = 3 мс (333 Гц)</text>
</svg>
