<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Definitions -->
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема комутації CCPM-сервотестера з сервоприводами, ESC та батареєю</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Топологія з'єднання сигнальних ліній ШІМ (S1–S3), вбудованого BEC та силового живлення LiPo</text>

  <!-- BOX 1: IN Power Source (Top Left) -->
  <rect x="30" y="85" width="160" height="120" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="2"/>
  <text x="110" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Джерело IN (5V)</text>
  <text x="110" y="130" text-anchor="middle" font-size="12" fill="#6b7280">Блок 4.8–6.0V / BEC</text>
  <text x="110" y="160" text-anchor="middle" font-size="12" fill="#1a1a1a">Живлення тестера</text>
  <text x="110" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Подача 5V</text>

  <!-- Cable 1: IN Source -> Tester IN -->
  <line x1="190" y1="140" x2="270" y2="140" stroke="#d97706" stroke-width="2"/>
  <line x1="190" y1="145" x2="270" y2="145" stroke="#c0392b" stroke-width="2"/>
  <line x1="190" y1="150" x2="270" y2="150" stroke="#1f2937" stroke-width="2"/>
  <text x="230" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Вхід 5V</text>

  <!-- BOX 2: LiPo Battery (Bottom Left) -->
  <rect x="30" y="265" width="160" height="125" rx="8" fill="#f4f6f8" stroke="#c0392b" stroke-width="2"/>
  <text x="110" y="290" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">Батарея LiPo</text>
  <text x="110" y="310" text-anchor="middle" font-size="12" fill="#6b7280">2S – 6S (7.4–22.2V)</text>
  <text x="110" y="345" text-anchor="middle" font-size="12" fill="#1a1a1a">Силовий акумулятор</text>
  <text x="110" y="370" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Живлення ESC</text>

  <!-- Heavy Cable: LiPo -> ESC -->
  <path d="M 190,360 L 190,435 L 685,435 L 685,390" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-red)"/>
  <path d="M 175,360 L 175,447 L 670,447 L 670,390" fill="none" stroke="#1f2937" stroke-width="3"/>
  <text x="430" y="420" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Силовий кабель живлення LiPo (+ / -)</text>

  <!-- BOX 3: CENTER TESTER -->
  <rect x="270" y="85" width="230" height="305" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.5"/>
  <text x="385" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#2457d6">CCPM СЕРВОТЕСТЕР</text>
  <text x="385" y="130" text-anchor="middle" font-size="12" fill="#6b7280">50 Гц (1000–2000 мкс)</text>

  <!-- IN Port Indicator on Tester -->
  <rect x="270" y="135" width="25" height="40" fill="#d0d7de"/>
  <text x="282" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">IN</text>

  <!-- Potentiometer Dial -->
  <circle cx="385" cy="200" r="28" fill="white" stroke="#2457d6" stroke-width="2"/>
  <line x1="385" y1="200" x2="385" y2="176" stroke="#2457d6" stroke-width="3"/>
  <text x="385" y="248" text-anchor="middle" font-size="12" fill="#1a1a1a">Регулятор Manual</text>
  <text x="385" y="268" text-anchor="middle" font-size="12" fill="#6b7280">LED: Manual | Neutral | Auto</text>

  <!-- SELECT Button -->
  <rect x="335" y="330" width="100" height="28" rx="6" fill="#2457d6"/>
  <text x="385" y="349" text-anchor="middle" font-size="12" font-weight="bold" fill="white">SELECT</text>

  <!-- OUT Ports Indicator on Tester -->
  <rect x="475" y="105" width="25" height="265" fill="#d0d7de"/>
  <text x="487" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">OUT</text>

  <!-- Straight Cables: Tester OUT -> Servos & ESC -->
  <!-- Cable Out 1: S1 -->
  <line x1="500" y1="120" x2="610" y2="120" stroke="#d97706" stroke-width="2"/>
  <line x1="500" y1="125" x2="610" y2="125" stroke="#c0392b" stroke-width="2"/>
  <line x1="500" y1="130" x2="610" y2="130" stroke="#1f2937" stroke-width="2"/>
  <text x="555" y="110" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">Канал S1</text>

  <!-- Cable Out 2: S2 -->
  <line x1="500" y1="215" x2="610" y2="215" stroke="#d97706" stroke-width="2"/>
  <line x1="500" y1="220" x2="610" y2="220" stroke="#c0392b" stroke-width="2"/>
  <line x1="500" y1="225" x2="610" y2="225" stroke="#1f2937" stroke-width="2"/>
  <text x="555" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">Канал S2</text>

  <!-- Cable Out 3: S3 -->
  <line x1="500" y1="325" x2="610" y2="325" stroke="#d97706" stroke-width="2"/>
  <line x1="500" y1="330" x2="610" y2="330" stroke="#c0392b" stroke-width="2"/>
  <line x1="500" y1="335" x2="610" y2="335" stroke="#1f2937" stroke-width="2"/>
  <text x="555" y="315" text-anchor="middle" font-size="12" font-weight="bold" fill="#b45309">Канал S3</text>

  <!-- BOX 4: SERVO 1 (Top Right) -->
  <rect x="610" y="85" width="150" height="80" rx="8" fill="#f4f6f8" stroke="#27ae60" stroke-width="2"/>
  <text x="685" y="108" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Сервопривод S1</text>
  <text x="685" y="128" text-anchor="middle" font-size="12" fill="#6b7280">Динамічний тест</text>
  <text x="685" y="148" text-anchor="middle" font-size="12" fill="#1a1a1a">Кут 0° – 180°</text>

  <!-- BOX 5: SERVO 2 (Middle Right) -->
  <rect x="610" y="180" width="150" height="80" rx="8" fill="#f4f6f8" stroke="#27ae60" stroke-width="2"/>
  <text x="685" y="203" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Сервопривод S2</text>
  <text x="685" y="223" text-anchor="middle" font-size="12" fill="#6b7280">Центрування (90°)</text>
  <text x="685" y="243" text-anchor="middle" font-size="12" fill="#1a1a1a">Режим Neutral</text>

  <!-- BOX 6: ESC (Bottom Right) -->
  <rect x="610" y="275" width="150" height="115" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="685" y="298" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">Регулятор ESC</text>
  <text x="685" y="318" text-anchor="middle" font-size="12" fill="#6b7280">Вбудований BEC 5V</text>
  <text x="685" y="338" text-anchor="middle" font-size="12" fill="#1a1a1a">Калібрування ШІМ</text>
  <text x="685" y="370" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Вихід BEC 5В</text>

  <!-- 3-Phase Wires: ESC -> BLDC Motor -->
  <line x1="760" y1="330" x2="835" y2="330" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="760" y1="345" x2="835" y2="345" stroke="#d97706" stroke-width="2.5"/>
  <line x1="760" y1="360" x2="835" y2="360" stroke="#1f2937" stroke-width="2.5"/>
  <text x="797" y="312" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">3 фази</text>

  <!-- BOX 7: BLDC MOTOR (Far Right) -->
  <rect x="835" y="275" width="105" height="115" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="887" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">BLDC Мотор</text>
  <text x="887" y="325" text-anchor="middle" font-size="11" fill="#6b7280">Безколекторний</text>
  <circle cx="887" cy="358" r="12" fill="white" stroke="#2457d6" stroke-width="2"/>
</svg>
