<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <!-- Arrow markers -->
    <marker id="arr-c0392b" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-27ae60" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-2457d6" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-6b7280" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма ШІМ-сигналу керування сервоприводом</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Залежність кута повороту вала (-45°, 0°, +45°) від тривалості імпульсу t_w (1.0 мс, 1.5 мс, 2.0 мс) при періоді T = 20 мс (50 Гц)</text>

  <!-- ================= ROW 1: 1.0 ms (MIN) ================= -->
  <!-- Waveform Panel -->
  <rect x="40" y="75" width="610" height="130" fill="#fdecea" stroke="#f5c6cb" stroke-width="1" rx="6"/>
  <text x="55" y="98" font-size="13" font-weight="bold" fill="#c0392b">Режим Min / Крайнє ліве</text>

  <!-- Voltage level ticks -->
  <text x="100" y="118" font-size="11" fill="#6b7280" text-anchor="end">5 В</text>
  <text x="100" y="163" font-size="11" fill="#6b7280" text-anchor="end">0 В</text>
  <line x1="105" y1="115" x2="110" y2="115" stroke="#d0d7de" stroke-width="1"/>
  <line x1="105" y1="160" x2="110" y2="160" stroke="#d0d7de" stroke-width="1"/>

  <!-- Waveform pulse 1.0 ms -->
  <path d="M 110,160 L 130,160 L 130,115 L 170,115 L 170,160 L 530,160 L 530,115 L 550,115" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Pulse width tw dimension -->
  <line x1="130" y1="115" x2="130" y2="95" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="170" y1="115" x2="170" y2="95" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="130" y1="100" x2="170" y2="100" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-c0392b)" marker-end="url(#arr-c0392b)"/>
  <text x="150" y="92" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">t_w = 1.0 мс</text>

  <!-- Period T dimension -->
  <line x1="130" y1="160" x2="130" y2="185" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="530" y1="160" x2="530" y2="185" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="130" y1="180" x2="530" y2="180" stroke="#6b7280" stroke-width="1.5" marker-start="url(#arr-6b7280)" marker-end="url(#arr-6b7280)"/>
  <text x="330" y="194" font-size="12" fill="#6b7280" text-anchor="middle">Період T = 20 мс (50 Гц)</text>

  <!-- Servo Diagram Panel 1 -->
  <rect x="670" y="75" width="250" height="130" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="795" y="95" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Поворот вала: -45°</text>
  <!-- Servo Body -->
  <rect x="755" y="135" width="80" height="50" fill="#e0e0e0" stroke="#757575" stroke-width="1.5" rx="4"/>
  <circle cx="795" cy="145" r="12" fill="#9e9e9e" stroke="#424242" stroke-width="1.5"/>
  <circle cx="795" cy="145" r="4" fill="#ffffff" stroke="#424242" stroke-width="1"/>
  <!-- Neutral reference line -->
  <line x1="795" y1="145" x2="795" y2="110" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- Servo horn (-45 deg) -->
  <line x1="795" y1="145" x2="770" y2="120" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
  <circle cx="770" cy="120" r="3" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="750" y="115" font-size="11" font-weight="bold" fill="#c0392b">-45°</text>

  <!-- ================= ROW 2: 1.5 ms (NEUTRAL) ================= -->
  <!-- Waveform Panel -->
  <rect x="40" y="220" width="610" height="130" fill="#e9f7ef" stroke="#c3e6cb" stroke-width="1" rx="6"/>
  <text x="55" y="243" font-size="13" font-weight="bold" fill="#27ae60">Режим Neutral / Центр</text>

  <!-- Voltage level ticks -->
  <text x="100" y="263" font-size="11" fill="#6b7280" text-anchor="end">5 В</text>
  <text x="100" y="308" font-size="11" fill="#6b7280" text-anchor="end">0 В</text>
  <line x1="105" y1="260" x2="110" y2="260" stroke="#d0d7de" stroke-width="1"/>
  <line x1="105" y1="305" x2="110" y2="305" stroke="#d0d7de" stroke-width="1"/>

  <!-- Waveform pulse 1.5 ms -->
  <path d="M 110,305 L 130,305 L 130,260 L 190,260 L 190,305 L 530,305 L 530,260 L 550,260" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Pulse width tw dimension -->
  <line x1="130" y1="260" x2="130" y2="240" stroke="#27ae60" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="190" y1="260" x2="190" y2="240" stroke="#27ae60" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="130" y1="245" x2="190" y2="245" stroke="#27ae60" stroke-width="1.5" marker-start="url(#arr-27ae60)" marker-end="url(#arr-27ae60)"/>
  <text x="160" y="237" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">t_w = 1.5 мс</text>

  <!-- Period T dimension -->
  <line x1="130" y1="305" x2="130" y2="330" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="530" y1="305" x2="530" y2="330" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="130" y1="325" x2="530" y2="325" stroke="#6b7280" stroke-width="1.5" marker-start="url(#arr-6b7280)" marker-end="url(#arr-6b7280)"/>
  <text x="330" y="339" font-size="12" fill="#6b7280" text-anchor="middle">Період T = 20 мс (50 Гц)</text>

  <!-- Servo Diagram Panel 2 -->
  <rect x="670" y="220" width="250" height="130" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="795" y="240" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Поворот вала: 0° (Нейтраль)</text>
  <!-- Servo Body -->
  <rect x="755" y="280" width="80" height="50" fill="#e0e0e0" stroke="#757575" stroke-width="1.5" rx="4"/>
  <circle cx="795" cy="290" r="12" fill="#9e9e9e" stroke="#424242" stroke-width="1.5"/>
  <circle cx="795" cy="290" r="4" fill="#ffffff" stroke="#424242" stroke-width="1"/>
  <!-- Servo horn (0 deg) -->
  <line x1="795" y1="290" x2="795" y2="255" stroke="#27ae60" stroke-width="5" stroke-linecap="round"/>
  <circle cx="795" cy="255" r="3" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="805" y="252" font-size="11" font-weight="bold" fill="#27ae60">0°</text>

  <!-- ================= ROW 3: 2.0 ms (MAX) ================= -->
  <!-- Waveform Panel -->
  <rect x="40" y="365" width="610" height="130" fill="#eaf0fd" stroke="#b8daff" stroke-width="1" rx="6"/>
  <text x="55" y="388" font-size="13" font-weight="bold" fill="#2457d6">Режим Max / Крайнє праве</text>

  <!-- Voltage level ticks -->
  <text x="100" y="408" font-size="11" fill="#6b7280" text-anchor="end">5 В</text>
  <text x="100" y="453" font-size="11" fill="#6b7280" text-anchor="end">0 В</text>
  <line x1="105" y1="405" x2="110" y2="405" stroke="#d0d7de" stroke-width="1"/>
  <line x1="105" y1="450" x2="110" y2="450" stroke="#d0d7de" stroke-width="1"/>

  <!-- Waveform pulse 2.0 ms -->
  <path d="M 110,450 L 130,450 L 130,405 L 210,405 L 210,450 L 530,450 L 530,405 L 550,405" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Pulse width tw dimension -->
  <line x1="130" y1="405" x2="130" y2="385" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="210" y1="405" x2="210" y2="385" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="130" y1="390" x2="210" y2="390" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-2457d6)" marker-end="url(#arr-2457d6)"/>
  <text x="170" y="382" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">t_w = 2.0 мс</text>

  <!-- Period T dimension -->
  <line x1="130" y1="450" x2="130" y2="475" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="530" y1="450" x2="530" y2="475" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="130" y1="470" x2="530" y2="470" stroke="#6b7280" stroke-width="1.5" marker-start="url(#arr-6b7280)" marker-end="url(#arr-6b7280)"/>
  <text x="330" y="484" font-size="12" fill="#6b7280" text-anchor="middle">Період T = 20 мс (50 Гц)</text>

  <!-- Servo Diagram Panel 3 -->
  <rect x="670" y="365" width="250" height="130" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="795" y="385" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Поворот вала: +45°</text>
  <!-- Servo Body -->
  <rect x="755" y="425" width="80" height="50" fill="#e0e0e0" stroke="#757575" stroke-width="1.5" rx="4"/>
  <circle cx="795" cy="435" r="12" fill="#9e9e9e" stroke="#424242" stroke-width="1.5"/>
  <circle cx="795" cy="435" r="4" fill="#ffffff" stroke="#424242" stroke-width="1"/>
  <!-- Neutral reference line -->
  <line x1="795" y1="435" x2="795" y2="400" stroke="#9e9e9e" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- Servo horn (+45 deg) -->
  <line x1="795" y1="435" x2="820" y2="410" stroke="#2457d6" stroke-width="5" stroke-linecap="round"/>
  <circle cx="820" cy="410" r="3" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="825" y="402" font-size="11" font-weight="bold" fill="#2457d6">+45°</text>

  <!-- ================= BOTTOM BANNER ================= -->
  <rect x="40" y="508" width="880" height="36" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="480" y="530" font-size="12" fill="#1a1a1a" text-anchor="middle">Параметри ШІМ: Амплітуда 5 В | Період T = 20 мс (f = 50 Гц) | Нейтраль = 1.5 мс | Діапазон газу ESC: 1.0 мс (Min) ... 2.0 мс (Max)</text>
</svg>
