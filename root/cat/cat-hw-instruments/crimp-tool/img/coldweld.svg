<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Чому холодний тиск надійніший за припій</text>
<line x1="470.0" y1="70.0" x2="470.0" y2="470.0" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="245.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">Пайка: жорсткий наплив тріскається</text>
<line x1="40.0" y1="188.0" x2="190.0" y2="188.0" stroke="#c0522a" stroke-width="3.0"/>
<line x1="40.0" y1="196.0" x2="190.0" y2="196.0" stroke="#c0522a" stroke-width="3.0"/>
<line x1="40.0" y1="204.0" x2="190.0" y2="204.0" stroke="#c0522a" stroke-width="3.0"/>
<line x1="40.0" y1="212.0" x2="190.0" y2="212.0" stroke="#c0522a" stroke-width="3.0"/>
<path d="M 175 165 Q 260 150 300 200 Q 260 250 175 235 Z" fill="#8a8f98" stroke="#5a6270" stroke-width="2"/>
<rect x="295.0" y="178.0" width="70.0" height="44.0" rx="4" fill="#f3e2b3" stroke="#b8860b" stroke-width="2.0"/>
<circle cx="178.0" cy="200.0" r="15.0" fill="none" stroke="#c0392b" stroke-width="2.5"/>
<path d="M 168 190 L 176 200 L 168 210" fill="none" stroke="#c0392b" stroke-width="2.5"/>
<line x1="95.0" y1="150.0" x2="95.0" y2="175.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<line x1="95.0" y1="250.0" x2="95.0" y2="225.0" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="95.0" y="135.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">вібрація</text>
<rect x="20.0" y="302.8" width="380.0" height="74.4" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="210.0" y="321.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">Припій жорсткий і крихкий. Гнучкий дріт</tspan><tspan x="210.0" dy="15.0">хитається — а біля краю напливу, де м'яка</tspan><tspan x="210.0" dy="15.0">мідь зустрічає тверду пайку, росте напруга.</tspan><tspan x="210.0" dy="15.0">Метал там і тріскається (стрес-концентратор).</tspan></text>
<text x="210.0" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">✗ ламається від вібрації</text>
<text x="700.0" y="60.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">Обтиск: тиск зварює метал начисто</text>
<rect x="600.0" y="130.0" width="190.0" height="26.0" rx="4" fill="#c9ced6" stroke="#5a6270" stroke-width="2.0"/>
<rect x="600.0" y="244.0" width="190.0" height="26.0" rx="4" fill="#c9ced6" stroke="#5a6270" stroke-width="2.0"/>
<line x1="695.0" y1="118.0" x2="695.0" y2="130.0" stroke="#5a6270" stroke-width="2.5" marker-end="url(#arrow)"/>
<line x1="695.0" y1="282.0" x2="695.0" y2="270.0" stroke="#5a6270" stroke-width="2.5" marker-end="url(#arrow)"/>
<rect x="620.0" y="162.0" width="150.0" height="76.0" rx="6" fill="#f3e2b3" stroke="#b8860b" stroke-width="2.0"/>
<polygon points="684.5,194.5 684.5,205.5 675.0,211.0 665.5,205.5 665.5,194.5 675.0,189.0" fill="#c0522a" stroke="#b8860b" stroke-width="1.2"/>
<polygon points="704.5,194.5 704.5,205.5 695.0,211.0 685.5,205.5 685.5,194.5 695.0,189.0" fill="#c0522a" stroke="#b8860b" stroke-width="1.2"/>
<polygon points="724.5,194.5 724.5,205.5 715.0,211.0 705.5,205.5 705.5,194.5 715.0,189.0" fill="#c0522a" stroke="#b8860b" stroke-width="1.2"/>
<polygon points="694.5,177.5 694.5,188.5 685.0,194.0 675.5,188.5 675.5,177.5 685.0,172.0" fill="#c0522a" stroke="#b8860b" stroke-width="1.2"/>
<polygon points="714.5,177.5 714.5,188.5 705.0,194.0 695.5,188.5 695.5,177.5 705.0,172.0" fill="#c0522a" stroke="#b8860b" stroke-width="1.2"/>
<polygon points="694.5,211.5 694.5,222.5 685.0,228.0 675.5,222.5 675.5,211.5 685.0,206.0" fill="#c0522a" stroke="#b8860b" stroke-width="1.2"/>
<polygon points="714.5,211.5 714.5,222.5 705.0,228.0 695.5,222.5 695.5,211.5 705.0,206.0" fill="#c0522a" stroke="#b8860b" stroke-width="1.2"/>
<circle cx="695.0" cy="200.0" r="34.0" fill="none" stroke="#27ae60" stroke-width="2.5"/>
<rect x="500.0" y="295.4" width="400.0" height="89.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="700.0" y="314.1" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="700.0" dy="0.0">Тиск чавить жили: круглі перетини сплющуються</tspan><tspan x="700.0" dy="15.0">в стільник упритул. Оксидні плівки тріскають і</tspan><tspan x="700.0" dy="15.0">сходять — чистий метал тисне на чистий метал і</tspan><tspan x="700.0" dy="15.0">зварюється холодним, без нагріву й флюсу.</tspan><tspan x="700.0" dy="15.0">Наплив м'яко тече в дріт — краю-тріщини нема.</tspan></text>
<text x="700.0" y="448.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">✓ тримає під вібрацією</text>
</svg>