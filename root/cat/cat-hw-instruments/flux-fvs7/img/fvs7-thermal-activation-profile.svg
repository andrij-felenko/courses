<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Main Header -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Температурний профіль активації та розкладу безвідмивного флюсу FVS-7</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Максимальна дезоксидація поверхні відбувається при 150–220 °C, а в піку паяння флюс термічно нейтралізується</text>

  <!-- Main Graph Panel Box -->
  <rect x="40" y="75" width="880" height="325" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>

  <!-- Phase Shading Columns -->
  <!-- Phase 1: Pre-heat (x=170..320) -->
  <rect x="170" y="100" width="150" height="260" fill="white" opacity="0.6"/>
  <text x="245" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">1. Нагрів</text>
  <text x="245" y="136" text-anchor="middle" font-size="10" fill="#6b7280">Випар розчинника</text>

  <!-- Phase 2: Activation Zone (x=320..550) -->
  <rect x="320" y="100" width="230" height="260" fill="#eaf0fd" opacity="0.7" stroke="#2457d6" stroke-dasharray="3 3"/>
  <text x="435" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">2. Активація FVS-7</text>
  <text x="435" y="136" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Дезоксидація (150–220 °C)</text>

  <!-- Phase 3: Reflow Peak (x=550..720) -->
  <rect x="550" y="100" width="170" height="260" fill="#fdecea" opacity="0.7" stroke="#c0392b" stroke-dasharray="3 3"/>
  <text x="635" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">3. Пік паяння</text>
  <text x="635" y="136" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Розклад / нейтралізація</text>

  <!-- Phase 4: Cooling (x=720..890) -->
  <rect x="720" y="100" width="170" height="260" fill="#e9f7ef" opacity="0.7" stroke="#27ae60" stroke-dasharray="3 3"/>
  <text x="805" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">4. Охолодження</text>
  <text x="805" y="136" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Інертний залишок</text>

  <!-- Temperature Horizontal Grid Lines -->
  <line x1="170" y1="130" x2="890" y2="130" stroke="#c0392b" stroke-opacity="0.4" stroke-dasharray="4 4"/>
  <text x="160" y="134" text-anchor="end" font-size="11" font-weight="bold" fill="#c0392b">250 °C (Пік паяння)</text>

  <line x1="170" y1="170" x2="890" y2="170" stroke="#2457d6" stroke-opacity="0.5" stroke-dasharray="4 4"/>
  <text x="160" y="174" text-anchor="end" font-size="11" fill="#2457d6">220 °C (Верхня межа)</text>

  <line x1="170" y1="250" x2="890" y2="250" stroke="#2457d6" stroke-opacity="0.5" stroke-dasharray="4 4"/>
  <text x="160" y="254" text-anchor="end" font-size="11" fill="#2457d6">150 °C (Старт активації)</text>

  <line x1="170" y1="310" x2="890" y2="310" stroke="#6b7280" stroke-opacity="0.3" stroke-dasharray="4 4"/>
  <text x="160" y="314" text-anchor="end" font-size="11" fill="#6b7280">100 °C (Випар)</text>

  <text x="160" y="364" text-anchor="end" font-size="11" fill="#6b7280">25 °C</text>

  <!-- Axes -->
  <line x1="170" y1="360" x2="170" y2="95" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>
  <text x="165" y="90" text-anchor="end" font-size="11" font-weight="bold" fill="#1a1a1a">T (°C)</text>

  <line x1="170" y1="360" x2="905" y2="360" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>
  <text x="912" y="375" text-anchor="end" font-size="11" font-weight="bold" fill="#1a1a1a">Час t (с)</text>

  <!-- Temperature Curve -->
  <path d="M170,360 L320,250 L550,170 L635,130 L720,250 L890,340" fill="none" stroke="#2457d6" stroke-width="3.5"/>

  <!-- Key Activation Points -->
  <circle cx="320" cy="250" r="5" fill="#2457d6"/>
  <text x="320" y="225" text-anchor="middle" font-size="10" font-weight="bold" fill="#2457d6">Старт активації</text>

  <circle cx="550" cy="170" r="5" fill="#2457d6"/>
  <text x="485" y="225" text-anchor="middle" font-size="10" font-weight="bold" fill="#2457d6">Кінець активації</text>

  <circle cx="635" cy="130" r="5" fill="#c0392b"/>
  <text x="630" y="210" text-anchor="middle" font-size="10" font-weight="bold" fill="#c0392b">Розклад флюсу</text>

  <!-- Bottom Summary Card -->
  <rect x="40" y="415" width="880" height="105" fill="white" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="60" y="438" font-size="12" font-weight="bold" fill="#1a1a1a">Ключові стадії хімічного перетворення флюсу FVS-7:</text>
  <text x="60" y="460" font-size="11" fill="#1a1a1a">• 150–220 °C (Активація): Інтенсивне розчинення оксидів металів органічними кислотами флюсу.</text>
  <text x="60" y="482" font-size="11" fill="#1a1a1a">• &gt; 230 °C (Нейтралізація): Повний розклад та випар активаторів у піку паяльного профілю.</text>
  <text x="60" y="504" font-size="11" fill="#27ae60">• Залишок (Після охолодження): Високий діелектричний опір (SIR), не кородує, не вимагає відмивання.</text>
</svg>
