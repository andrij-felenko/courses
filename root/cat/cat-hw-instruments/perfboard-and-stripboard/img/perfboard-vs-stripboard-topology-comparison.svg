  <circle cx="329" cy="262" r="7" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><circle cx="329" cy="262" r="3" fill="#ffffff"/>
  <circle cx="357" cy="262" r="7" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><circle cx="357" cy="262" r="3" fill="#ffffff"/>
  <circle cx="385" cy="262" r="7" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><circle cx="385" cy="262" r="3" fill="#ffffff"/>

  <!-- Grid Pitch Dimension Line & Label -->
  <line x1="105" y1="276" x2="133" y2="276" stroke="#6b7280" stroke-width="1" marker-start="url(#arr-gray)" marker-end="url(#arr-gray)"/>
  <text x="119" y="291" font-size="12" fill="#6b7280" text-anchor="middle">P = 2.54 мм</text>

  <!-- Feature List -->
  <text x="252.5" y="315" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Особливості монтажу</text>
  <text x="252.5" y="338" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">• Ізольовані точкові контактні площадки</text>
  <text x="252.5" y="358" font-size="12" fill="#6b7280" text-anchor="middle">• Кожне з'єднання вимагає окремого дроту</text>
  <text x="252.5" y="378" font-size="12" fill="#6b7280" text-anchor="middle">• Висока гнучкість для довільних схем</text>
  <text x="252.5" y="398" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">• Потребує більше часу на розпайку дротів</text>

  <!-- Summary Badge Card -->
  <rect x="62" y="415" width="381" height="26" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="252.5" y="432" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Призначення: макети з довільною топологією</text>

  <!-- ==================== RIGHT PANEL: STRIPBOARD ==================== -->
  <rect x="495" y="80" width="425" height="370" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8" ry="8"/>

  <!-- Header Box -->
  <rect x="507" y="90" width="401" height="36" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="707.5" y="113" font-size="15" font-weight="bold" fill="#27ae60" text-anchor="middle">Смугова плата (Stripboard / Veroboard)</text>

  <!-- Subhead -->
  <text x="707.5" y="145" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Паралельні мідні шини та розриви колій</text>

  <!-- Diagram Inner Box -->
  <rect x="517" y="155" width="381" height="140" fill="white" stroke="#d0d7de" stroke-width="1" rx="6"/>

  <!-- Substrate Board Base -->
  <rect x="535" y="168" width="345" height="104" fill="#fef3c7" fill-opacity="0.5" stroke="#d97706" stroke-width="1" rx="4"/>

  <!-- Track Cut Label & Pointer Line (Y range of text: 168 to 180, well below diagram top 155 and above track 1 184) -->
  <text x="755" y="180" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Розрив шини</text>
  <line x1="755" y1="183" x2="755" y2="205" stroke="#c0392b" stroke-width="1" marker-end="url(#arr-red)"/>

  <!-- Continuous Copper Strips (Row 1 to 4) -->
  <!-- Track 1 y=190 -->
  <rect x="545" y="184" width="325" height="12" fill="#f59e0b" fill-opacity="0.8" stroke="#d97706" stroke-width="1" rx="2"/>

  <!-- Track 2 y=214 with cut out at x=755 -->
  <rect x="545" y="208" width="200" height="12" fill="#f59e0b" fill-opacity="0.8" stroke="#d97706" stroke-width="1" rx="2"/>
  <rect x="765" y="208" width="105" height="12" fill="#f59e0b" fill-opacity="0.8" stroke="#d97706" stroke-width="1" rx="2"/>
  <!-- Cut indicator box and cross at x=755 -->
