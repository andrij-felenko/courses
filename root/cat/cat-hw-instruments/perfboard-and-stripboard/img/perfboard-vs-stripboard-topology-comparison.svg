  <circle cx="161" cy="214" r="7" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><circle cx="161" cy="214" r="3" fill="#ffffff"/>
  <circle cx="189" cy="214" r="7" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><circle cx="189" cy="214" r="3" fill="#ffffff"/>
  <circle cx="217" cy="214" r="7" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><circle cx="217" cy="214" r="3" fill="#ffffff"/>
  <circle cx="245" cy="214" r="7" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><circle cx="245" cy="214" r="3" fill="#ffffff"/>
  <circle cx="273" cy="214" r="7" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><circle cx="273" cy="214" r="3" fill="#ffffff"/>
  <circle cx="301" cy="214" r="7" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><circle cx="301" cy="214" r="3" fill="#ffffff"/>
  <circle cx="329" cy="214" r="7" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><circle cx="329" cy="214" r="3" fill="#ffffff"/>
  <circle cx="357" cy="214" r="7" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><circle cx="357" cy="214" r="3" fill="#ffffff"/>
  <circle cx="385" cy="214" r="7" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><circle cx="385" cy="214" r="3" fill="#ffffff"/>

  <!-- Wire Connection Line & Solder Joints on Row 2 -->
  <line x1="161" y1="214" x2="273" y2="214" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="161" cy="214" r="5" fill="#94a3b8" stroke="#475569" stroke-width="1"/>
  <circle cx="273" cy="214" r="5" fill="#94a3b8" stroke="#475569" stroke-width="1"/>

  <!-- Row 3 y=238 -->
  <circle cx="105" cy="238" r="7" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><circle cx="105" cy="238" r="3" fill="#ffffff"/>
  <circle cx="133" cy="238" r="7" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><circle cx="133" cy="238" r="3" fill="#ffffff"/>
  <circle cx="161" cy="238" r="7" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><circle cx="161" cy="238" r="3" fill="#ffffff"/>
  <circle cx="189" cy="238" r="7" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><circle cx="189" cy="238" r="3" fill="#ffffff"/>
  <circle cx="217" cy="238" r="7" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><circle cx="217" cy="238" r="3" fill="#ffffff"/>
  <circle cx="245" cy="238" r="7" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><circle cx="245" cy="238" r="3" fill="#ffffff"/>
  <circle cx="273" cy="238" r="7" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><circle cx="273" cy="238" r="3" fill="#ffffff"/>
  <circle cx="301" cy="238" r="7" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><circle cx="301" cy="238" r="3" fill="#ffffff"/>
  <circle cx="329" cy="238" r="7" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><circle cx="329" cy="238" r="3" fill="#ffffff"/>
  <circle cx="357" cy="238" r="7" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><circle cx="357" cy="238" r="3" fill="#ffffff"/>
  <circle cx="385" cy="238" r="7" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><circle cx="385" cy="238" r="3" fill="#ffffff"/>

  <!-- Row 4 y=262 -->
  <circle cx="105" cy="262" r="7" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><circle cx="105" cy="262" r="3" fill="#ffffff"/>
