  <line x1="749" y1="208" x2="761" y2="220" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="761" y1="208" x2="749" y2="220" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Track 3 y=238 -->
  <rect x="545" y="232" width="325" height="12" fill="#f59e0b" fill-opacity="0.8" stroke="#d97706" stroke-width="1" rx="2"/>

  <!-- Track 4 y=262 -->
  <rect x="545" y="256" width="325" height="12" fill="#f59e0b" fill-opacity="0.8" stroke="#d97706" stroke-width="1" rx="2"/>

  <!-- Holes grid over tracks (Cols x=560,588,616,644,672,700,728,756,784,812,840) -->
  <!-- Row 1 y=190 -->
  <circle cx="560" cy="190" r="3" fill="#ffffff"/><circle cx="588" cy="190" r="3" fill="#ffffff"/>
  <circle cx="616" cy="190" r="3" fill="#ffffff"/><circle cx="644" cy="190" r="3" fill="#ffffff"/>
  <circle cx="672" cy="190" r="3" fill="#ffffff"/><circle cx="700" cy="190" r="3" fill="#ffffff"/>
  <circle cx="728" cy="190" r="3" fill="#ffffff"/><circle cx="756" cy="190" r="3" fill="#ffffff"/>
  <circle cx="784" cy="190" r="3" fill="#ffffff"/><circle cx="812" cy="190" r="3" fill="#ffffff"/>
  <circle cx="840" cy="190" r="3" fill="#ffffff"/>

  <!-- Row 2 y=214 -->
  <circle cx="560" cy="214" r="3" fill="#ffffff"/><circle cx="588" cy="214" r="3" fill="#ffffff"/>
  <circle cx="616" cy="214" r="3" fill="#ffffff"/><circle cx="644" cy="214" r="3" fill="#ffffff"/>
  <circle cx="672" cy="214" r="3" fill="#ffffff"/><circle cx="700" cy="214" r="3" fill="#ffffff"/>
  <circle cx="728" cy="214" r="3" fill="#ffffff"/>
  <circle cx="784" cy="214" r="3" fill="#ffffff"/><circle cx="812" cy="214" r="3" fill="#ffffff"/>
  <circle cx="840" cy="214" r="3" fill="#ffffff"/>

  <!-- Row 3 y=238 -->
  <circle cx="560" cy="238" r="3" fill="#ffffff"/><circle cx="588" cy="238" r="3" fill="#ffffff"/>
  <circle cx="616" cy="238" r="3" fill="#ffffff"/><circle cx="644" cy="238" r="3" fill="#ffffff"/>
  <circle cx="672" cy="238" r="3" fill="#ffffff"/><circle cx="700" cy="238" r="3" fill="#ffffff"/>
  <circle cx="728" cy="238" r="3" fill="#ffffff"/><circle cx="756" cy="238" r="3" fill="#ffffff"/>
  <circle cx="784" cy="238" r="3" fill="#ffffff"/><circle cx="812" cy="238" r="3" fill="#ffffff"/>
  <circle cx="840" cy="238" r="3" fill="#ffffff"/>

  <!-- Row 4 y=262 -->
  <circle cx="560" cy="262" r="3" fill="#ffffff"/><circle cx="588" cy="262" r="3" fill="#ffffff"/>
  <circle cx="616" cy="262" r="3" fill="#ffffff"/><circle cx="644" cy="262" r="3" fill="#ffffff"/>
  <circle cx="672" cy="262" r="3" fill="#ffffff"/><circle cx="700" cy="262" r="3" fill="#ffffff"/>
  <circle cx="728" cy="262" r="3" fill="#ffffff"/><circle cx="756" cy="262" r="3" fill="#ffffff"/>
  <circle cx="784" cy="262" r="3" fill="#ffffff"/><circle cx="812" cy="262" r="3" fill="#ffffff"/>
  <circle cx="840" cy="262" r="3" fill="#ffffff"/>

  <!-- Vertical Jumper Line (connecting row 1 at x=644 to row 3 at x=644) -->
  <line x1="644" y1="190" x2="644" y2="238" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="644" cy="190" r="4" fill="#94a3b8" stroke="#475569" stroke-width="1"/>
  <circle cx="644" cy="238" r="4" fill="#94a3b8" stroke="#475569" stroke-width="1"/>
  <text x="644" y="285" font-size="12" fill="#27ae60" text-anchor="middle">Перемичка</text>

  <!-- Grid Pitch Dimension Line & Label -->
  <line x1="560" y1="276" x2="588" y2="276" stroke="#6b7280" stroke-width="1" marker-start="url(#arr-gray)" marker-end="url(#arr-gray)"/>
  <text x="574" y="291" font-size="12" fill="#6b7280" text-anchor="middle">P = 2.54 мм</text>

  <!-- Feature List -->
  <text x="707.5" y="315" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Особливості монтажу</text>
  <text x="707.5" y="338" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">• Суцільні паралельні мідні доріжки</text>
  <text x="707.5" y="358" font-size="12" fill="#6b7280" text-anchor="middle">• Спільні шини живлення та сигналів</text>
  <text x="707.5" y="378" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">• Швидкий монтаж без зайвих дротів</text>
  <text x="707.5" y="398" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">• Потребує перерізання шин під корпусами</text>

  <!-- Summary Badge Card -->
  <rect x="517" y="415" width="381" height="26" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
