  <circle cx="161" cy="262" r="7" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><circle cx="161" cy="262" r="3" fill="#ffffff"/>
  <circle cx="189" cy="262" r="7" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><circle cx="189" cy="262" r="3" fill="#ffffff"/>
