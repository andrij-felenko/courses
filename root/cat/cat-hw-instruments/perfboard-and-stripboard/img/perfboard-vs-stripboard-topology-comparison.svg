<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Порівняння топології макетних плат: Perfboard та Stripboard</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Точкові ізольовані площадки вимагають дротів, а смугові доріжки потребують перерізання шин</text>

  <!-- ==================== LEFT PANEL: PERFBOARD ==================== -->
  <rect x="40" y="80" width="425" height="370" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8" ry="8"/>

  <!-- Header Box -->
  <rect x="52" y="90" width="401" height="36" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="252.5" y="113" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">Точкова плата (Perfboard)</text>

  <!-- Subhead -->
  <text x="252.5" y="145" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Конструкція та крок сітки 2.54 мм (0.1")</text>

  <!-- Diagram Inner Box -->
  <rect x="62" y="155" width="381" height="140" fill="white" stroke="#d0d7de" stroke-width="1" rx="6"/>

  <!-- Substrate Board Base -->
  <rect x="80" y="168" width="345" height="104" fill="#fef3c7" fill-opacity="0.5" stroke="#d97706" stroke-width="1" rx="4"/>

  <!-- Perfboard Donut Pads Grid (Rows y=190, 214, 238, 262) -->
  <!-- Row 1 y=190 -->
  <circle cx="105" cy="190" r="7" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><circle cx="105" cy="190" r="3" fill="#ffffff"/>
  <circle cx="133" cy="190" r="7" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><circle cx="133" cy="190" r="3" fill="#ffffff"/>
  <circle cx="161" cy="190" r="7" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><circle cx="161" cy="190" r="3" fill="#ffffff"/>
  <circle cx="189" cy="190" r="7" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><circle cx="189" cy="190" r="3" fill="#ffffff"/>
  <circle cx="217" cy="190" r="7" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><circle cx="217" cy="190" r="3" fill="#ffffff"/>
  <circle cx="245" cy="190" r="7" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><circle cx="245" cy="190" r="3" fill="#ffffff"/>
  <circle cx="273" cy="190" r="7" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><circle cx="273" cy="190" r="3" fill="#ffffff"/>
  <circle cx="301" cy="190" r="7" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><circle cx="301" cy="190" r="3" fill="#ffffff"/>
  <circle cx="329" cy="190" r="7" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><circle cx="329" cy="190" r="3" fill="#ffffff"/>
  <circle cx="357" cy="190" r="7" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><circle cx="357" cy="190" r="3" fill="#ffffff"/>
  <circle cx="385" cy="190" r="7" fill="#f59e0b" stroke="#d97706" stroke-width="1"/><circle cx="385" cy="190" r="3" fill="#ffffff"/>

  <!-- Row 2 y=214 with wire connection between x=161 and x=273 -->
