<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Marker definitions -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-copper" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b5701c"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Архітектура та монтаж на макетній платі Stripboard (Veroboard)</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Паралельні мідні смуги з кроком 2.54 мм та розрив доріжок під DIP-корпусами</text>

  <!-- PANEL 1: Board Structure & Track Cuts (Left) -->
  <rect x="30" y="75" width="430" height="425" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="245" y="95" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Конструкція плати та розрив доріжок</text>

  <!-- Pitch dimension indicator (2.54 mm) placed ABOVE board base -->
  <text x="132.5" y="112" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">2.54 мм</text>
  <line x1="110" y1="120" x2="155" y2="120" stroke="#2457d6" stroke-width="1.2"/>
  <line x1="110" y1="116" x2="110" y2="124" stroke="#2457d6" stroke-width="1.2"/>
  <line x1="155" y1="116" x2="155" y2="124" stroke="#2457d6" stroke-width="1.2"/>

  <!-- FR-2 Board Base -->
  <rect x="50" y="128" width="390" height="295" fill="#ebd4b4" stroke="#c49f6e" stroke-width="1.5" rx="6"/>

  <!-- Copper Tracks (Disjoint segments to eliminate rect overlap with DIP IC) -->
  <!-- Track 1: VCC (+5V) full top track -->
  <rect x="50" y="138" width="390" height="26" fill="#e89d43" stroke="#b5701c" stroke-width="1"/>
  <text x="60" y="155" font-size="12" font-weight="bold" fill="#78350f">VCC (+5V)</text>

  <!-- Track 2 (Pin 1 & 8): Left & Right segments -->
  <rect x="50" y="185" width="165" height="26" fill="#e89d43" stroke="#b5701c" stroke-width="1"/>
  <rect x="320" y="185" width="120" height="26" fill="#e89d43" stroke="#b5701c" stroke-width="1"/>

  <!-- Track 3 (Pin 2 & 7): Left & Right segments -->
  <rect x="50" y="235" width="165" height="26" fill="#e89d43" stroke="#b5701c" stroke-width="1"/>
  <rect x="320" y="235" width="120" height="26" fill="#e89d43" stroke="#b5701c" stroke-width="1"/>

  <!-- Track 4 (Pin 3 & 6): Left & Right segments -->
  <rect x="50" y="285" width="165" height="26" fill="#e89d43" stroke="#b5701c" stroke-width="1"/>
  <rect x="320" y="285" width="120" height="26" fill="#e89d43" stroke="#b5701c" stroke-width="1"/>

  <!-- Track 5 (Pin 4 & 5): Left & Right segments -->
  <rect x="50" y="335" width="165" height="26" fill="#e89d43" stroke="#b5701c" stroke-width="1"/>
  <rect x="320" y="335" width="120" height="26" fill="#e89d43" stroke="#b5701c" stroke-width="1"/>

  <!-- Track 6: GND (0V) full bottom track -->
  <rect x="50" y="382" width="390" height="26" fill="#e89d43" stroke="#b5701c" stroke-width="1"/>
  <text x="60" y="399" font-size="12" font-weight="bold" fill="#78350f">GND (0V)</text>

  <!-- Holes in board (columns x=110, 155, 200, 245, 290, 335, 380, 415) -->
  <!-- Row 1 (y=151) -->
  <circle cx="110" cy="151" r="5" fill="#3e2723" stroke="#8d6e63" stroke-width="1"/>
  <circle cx="155" cy="151" r="5" fill="#3e2723" stroke="#8d6e63" stroke-width="1"/>
  <circle cx="200" cy="151" r="5" fill="#3e2723" stroke="#8d6e63" stroke-width="1"/>
  <circle cx="245" cy="151" r="5" fill="#3e2723" stroke="#8d6e63" stroke-width="1"/>
  <circle cx="290" cy="151" r="5" fill="#3e2723" stroke="#8d6e63" stroke-width="1"/>
  <circle cx="335" cy="151" r="5" fill="#3e2723" stroke="#8d6e63" stroke-width="1"/>
  <circle cx="380" cy="151" r="5" fill="#3e2723" stroke="#8d6e63" stroke-width="1"/>
  <circle cx="415" cy="151" r="5" fill="#3e2723" stroke="#8d6e63" stroke-width="1"/>

  <!-- Row 2 (y=198) -->
  <circle cx="110" cy="198" r="5" fill="#3e2723" stroke="#8d6e63" stroke-width="1"/>
  <circle cx="155" cy="198" r="5" fill="#3e2723" stroke="#8d6e63" stroke-width="1"/>

  <!-- Row 3 (y=248) -->
  <circle cx="110" cy="248" r="5" fill="#3e2723" stroke="#8d6e63" stroke-width="1"/>
  <circle cx="155" cy="248" r="5" fill="#3e2723" stroke="#8d6e63" stroke-width="1"/>

  <!-- Row 4 (y=298) -->
  <circle cx="110" cy="298" r="5" fill="#3e2723" stroke="#8d6e63" stroke-width="1"/>
  <circle cx="155" cy="298" r="5" fill="#3e2723" stroke="#8d6e63" stroke-width="1"/>

  <!-- Row 5 (y=348) -->
  <circle cx="110" cy="348" r="5" fill="#3e2723" stroke="#8d6e63" stroke-width="1"/>
  <circle cx="155" cy="348" r="5" fill="#3e2723" stroke="#8d6e63" stroke-width="1"/>

  <!-- Row 6 (y=395) -->
  <circle cx="110" cy="395" r="5" fill="#3e2723" stroke="#8d6e63" stroke-width="1"/>
  <circle cx="155" cy="395" r="5" fill="#3e2723" stroke="#8d6e63" stroke-width="1"/>
  <circle cx="200" cy="395" r="5" fill="#3e2723" stroke="#8d6e63" stroke-width="1"/>
  <circle cx="245" cy="395" r="5" fill="#3e2723" stroke="#8d6e63" stroke-width="1"/>
  <circle cx="290" cy="395" r="5" fill="#3e2723" stroke="#8d6e63" stroke-width="1"/>
  <circle cx="335" cy="395" r="5" fill="#3e2723" stroke="#8d6e63" stroke-width="1"/>
  <circle cx="380" cy="395" r="5" fill="#3e2723" stroke="#8d6e63" stroke-width="1"/>
  <circle cx="415" cy="395" r="5" fill="#3e2723" stroke="#8d6e63" stroke-width="1"/>

  <!-- Track Cut Indicators under IC area (column x=267.5, y=198, 248, 298, 348) -->
  <circle cx="267.5" cy="198" r="9" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="263.5" y1="194" x2="271.5" y2="202" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="263.5" y1="202" x2="271.5" y2="194" stroke="#c0392b" stroke-width="1.5"/>

  <circle cx="267.5" cy="248" r="9" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="263.5" y1="244" x2="271.5" y2="252" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="263.5" y1="252" x2="271.5" y2="244" stroke="#c0392b" stroke-width="1.5"/>

  <circle cx="267.5" cy="298" r="9" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="263.5" y1="294" x2="271.5" y2="302" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="263.5" y1="302" x2="271.5" y2="294" stroke="#c0392b" stroke-width="1.5"/>

  <circle cx="267.5" cy="348" r="9" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="263.5" y1="344" x2="271.5" y2="352" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="263.5" y1="352" x2="271.5" y2="344" stroke="#c0392b" stroke-width="1.5"/>

  <!-- DIP-8 IC Body -->
  <rect x="215" y="175" width="105" height="190" fill="#2d3748" stroke="#1e293b" stroke-width="1.5" rx="4"/>
  <!-- DIP Notch -->
  <path d="M258.5,175 A9,9 0 0,0 276.5,175 Z" fill="#1e293b"/>
  <!-- DIP IC Label -->
  <text x="267.5" y="273" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">DIP-8 IC</text>

  <!-- IC Pins & Solder Joints -->
  <!-- Left Side (x=200): Pins 1, 2, 3, 4 -->
  <line x1="200" y1="198" x2="215" y2="198" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="200" cy="198" r="6" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>

  <line x1="200" y1="248" x2="215" y2="248" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="200" cy="248" r="6" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>

  <line x1="200" y1="298" x2="215" y2="298" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="200" cy="298" r="6" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>

  <line x1="200" y1="348" x2="215" y2="348" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="200" cy="348" r="6" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>

  <!-- Right Side (x=335): Pins 8, 7, 6, 5 -->
  <line x1="320" y1="198" x2="335" y2="198" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="335" cy="198" r="6" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>

  <line x1="320" y1="248" x2="335" y2="248" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="335" cy="248" r="6" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>

  <line x1="320" y1="298" x2="335" y2="298" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="335" cy="298" r="6" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>

  <line x1="320" y1="348" x2="335" y2="348" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="335" cy="348" r="6" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>

  <!-- Track Cut Description Box at Bottom of Panel 1 -->
  <rect x="70" y="435" width="350" height="50" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="245" y="455" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Розрив мідної смуги під корпусом мікросхеми</text>
  <text x="245" y="472" font-size="12" fill="#1a1a1a" text-anchor="middle">Ізолює протилежні виводи (Pin 1-8, 2-7, 3-6, 4-5)</text>
  <line x1="245" y1="435" x2="245" y2="368" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>


  <!-- PANEL 2: Track Cutting Technique (Top-Right) -->
  <rect x="480" y="75" width="450" height="205" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="705" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Механізм створення розриву смуги</text>

  <!-- FR-2 Base -->
  <rect x="510" y="170" width="390" height="20" fill="#ebd4b4" stroke="#c49f6e" stroke-width="1.5"/>

  <!-- Left Copper Layer -->
  <rect x="510" y="190" width="165" height="6" fill="#e89d43" stroke="#b5701c" stroke-width="1"/>

  <!-- Right Copper Layer -->
  <rect x="735" y="190" width="165" height="6" fill="#e89d43" stroke="#b5701c" stroke-width="1"/>

  <!-- Chamfered Cutout Path -->
  <path d="M675,190 L690,170 L720,170 L735,190 Z" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Drill Bit Body & Tip -->
  <rect x="695" y="105" width="20" height="50" fill="#94a3b8" stroke="#475569" stroke-width="1.2"/>
  <line x1="695" y1="118" x2="715" y2="128" stroke="#64748b" stroke-width="1.5"/>
  <line x1="695" y1="133" x2="715" y2="143" stroke="#64748b" stroke-width="1.5"/>
  <polygon points="695,155 705,185 715,155" fill="#64748b" stroke="#475569" stroke-width="1.2"/>

  <!-- Drill Rotation Arc -->
  <path d="M685,130 A15,15 0 0,1 725,130" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Panel 2 Annotations -->
  <text x="515" y="145" font-size="12" font-weight="bold" fill="#6b7280">Гетинакс (FR-2)</text>
  <line x1="565" y1="149" x2="590" y2="168" stroke="#6b7280" stroke-width="1" marker-end="url(#arr)"/>

  <text x="510" y="235" font-size="12" font-weight="bold" fill="#b5701c">Мідна смуга</text>
  <line x1="590" y1="230" x2="615" y2="198" stroke="#b5701c" stroke-width="1" marker-end="url(#arr-copper)"/>

  <text x="740" y="135" font-size="12" font-weight="bold" fill="#2457d6">Ручна фреза / свердло</text>
  <text x="740" y="150" font-size="12" fill="#6b7280">Ø 3.5 – 4.0 мм</text>
  <line x1="735" y1="140" x2="718" y2="145" stroke="#2457d6" stroke-width="1" marker-end="url(#arr-blue)"/>

  <text x="740" y="225" font-size="12" font-weight="bold" fill="#c0392b">Гальванічний розрив</text>
  <text x="740" y="240" font-size="12" fill="#6b7280">(знято фаску міді)</text>
  <line x1="735" y1="220" x2="715" y2="195" stroke="#c0392b" stroke-width="1" marker-end="url(#arr-red)"/>


  <!-- PANEL 3: Architecture Comparison (Bottom-Right) -->
  <rect x="480" y="295" width="450" height="205" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="705" y="318" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Порівняння архітектур макетування</text>

  <!-- Card 1: Stripboard (Header + Body non-overlapping Y rects) -->
  <rect x="495" y="330" width="205" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <rect x="495" y="356" width="205" height="129" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="597.5" y="347" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Stripboard (Veroboard)</text>
  <text x="505" y="375" font-size="12" fill="#1a1a1a">• Паралельні суцільні смуги</text>
  <text x="505" y="397" font-size="12" fill="#1a1a1a">• Потребує різання доріжок</text>
  <text x="505" y="419" font-size="12" fill="#1a1a1a">• Швидка розводка шин</text>
  <text x="505" y="441" font-size="12" fill="#1a1a1a">• Менше перемичок</text>
  <text x="505" y="466" font-size="12" font-weight="bold" fill="#27ae60">✓ Оптимально для DIP</text>

  <!-- Card 2: Perfboard (Header + Body non-overlapping Y rects) -->
  <rect x="710" y="330" width="205" height="26" fill="#f4f6f8" stroke="#475569" stroke-width="1" rx="6"/>
  <rect x="710" y="356" width="205" height="129" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="812.5" y="347" font-size="13" font-weight="bold" fill="#475569" text-anchor="middle">Perfboard (Pad-per-hole)</text>
  <text x="720" y="375" font-size="12" fill="#1a1a1a">• Окремі контактні п'ятачки</text>
  <text x="720" y="397" font-size="12" fill="#1a1a1a">• Повна ізоляція отворів</text>
  <text x="720" y="419" font-size="12" fill="#1a1a1a">• Багато дротяних з'єднань</text>
  <text x="720" y="441" font-size="12" fill="#1a1a1a">• Складніше з шинами</text>
  <text x="720" y="466" font-size="12" font-weight="bold" fill="#6b7280">✓ Гнучкість для схем</text>
</svg>
