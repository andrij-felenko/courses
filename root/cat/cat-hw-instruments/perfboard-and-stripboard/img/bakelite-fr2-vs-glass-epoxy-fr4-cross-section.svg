<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White canvas background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Main Title -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Порівняння структури макетних плат FR-2 (бакеліт) та FR-4 (склотекстоліт)</text>
  <!-- Subtitle -->
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">FR-2 має поверхневу фольгу без металізації отворів, тоді як FR-4 пропонує двостороннє фольгування та металізацію (PTH)</text>

  <!-- LEFT PANEL: FR-2 (Bakelite / Phenolic) -->
  <rect x="25" y="70" width="445" height="390" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="247" y="96" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Одностороння плата FR-2 (Гетинакс / Бакеліт)</text>
  <text x="247" y="114" font-size="12" fill="#6b7280" text-anchor="middle">Паперово-фенольна основа + 1 шар фольги</text>

  <!-- FR-2 Substrate Label -->
  <text x="247" y="148" font-size="12" font-weight="bold" fill="#7e5109" text-anchor="middle">Паперово-фенольний ламінат (гетинакс)</text>

  <!-- FR-2 Substrate Layer (Phenolic Paper) - Divided into 3 non-overlapping segments -->
  <rect x="55" y="170" width="85" height="70" fill="#e8c39e" stroke="#b8860b" stroke-width="1.5"/>
  <rect x="175" y="170" width="115" height="70" fill="#e8c39e" stroke="#b8860b" stroke-width="1.5"/>
  <rect x="325" y="170" width="115" height="70" fill="#e8c39e" stroke="#b8860b" stroke-width="1.5"/>

  <!-- Unplated Holes Side Guides (FR-2) -->
  <line x1="140" y1="170" x2="140" y2="240" stroke="#b8860b" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="175" y1="170" x2="175" y2="240" stroke="#b8860b" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="290" y1="170" x2="290" y2="240" stroke="#b8860b" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="325" y1="170" x2="325" y2="240" stroke="#b8860b" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Bottom Copper Foil Segments (FR-2) -->
  <rect x="55" y="240" width="85" height="8" fill="#e67e22" stroke="#d35400" stroke-width="1"/>
  <rect x="175" y="240" width="115" height="8" fill="#e67e22" stroke="#d35400" stroke-width="1"/>
  <rect x="325" y="240" width="115" height="8" fill="#e67e22" stroke="#d35400" stroke-width="1"/>

  <!-- Component Pin & Solder Joint on Hole 1 (FR-2) -->
  <rect x="135" y="130" width="45" height="22" fill="#34495e" rx="3"/>
  <line x1="157.5" y1="152" x2="157.5" y2="256" stroke="#7f8c8d" stroke-width="3"/>
  <path d="M 130 248 Q 157.5 264 185 248 Z" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>

  <!-- Bottom Foil Label (FR-2) -->
  <text x="247" y="278" font-size="12" font-weight="bold" fill="#d35400" text-anchor="middle">Мідна фольга тільки з одного боку</text>

  <!-- FR-2 Badges / Summary -->
  <rect x="45" y="300" width="405" height="65" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="6"/>
  <text x="60" y="320" font-size="13" font-weight="bold" fill="#c0392b">⚠️ Відсутність металізації отвору (PTH)</text>
  <text x="60" y="338" font-size="12" fill="#1a1a1a">При повторній перепайці або перегріві мідний п'ятачок</text>
  <text x="60" y="353" font-size="12" fill="#1a1a1a">легко відшаровується та відривається від підкладки.</text>

  <rect x="45" y="375" width="405" height="65" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="60" y="395" font-size="12" fill="#1a1a1a">• Низька термічна та механічна міцність</text>
  <text x="60" y="412" font-size="12" fill="#1a1a1a">• Схильність до викривлення при нагріванні</text>
  <text x="60" y="429" font-size="12" fill="#6b7280">• Призначення: одноразові дешеві макети</text>


  <!-- RIGHT PANEL: FR-4 (Glass-Epoxy / PTH) -->
  <rect x="490" y="70" width="445" height="390" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="712" y="96" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Двостороння плата FR-4 (Склотекстоліт)</text>
  <text x="712" y="114" font-size="12" fill="#6b7280" text-anchor="middle">Склотканина + епоксид + металізація (PTH)</text>

  <!-- FR-4 Substrate Label -->
  <text x="712" y="148" font-size="12" font-weight="bold" fill="#145a32" text-anchor="middle">Склотканина з епоксидною смолою (FR-4)</text>

  <!-- Top Copper Foil Segments (FR-4) -->
  <rect x="520" y="162" width="67" height="8" fill="#e67e22" stroke="#d35400" stroke-width="1"/>
  <rect x="625" y="162" width="112" height="8" fill="#e67e22" stroke="#d35400" stroke-width="1"/>
  <rect x="775" y="162" width="130" height="8" fill="#e67e22" stroke="#d35400" stroke-width="1"/>

  <!-- FR-4 Substrate Layer (Glass Epoxy) - Divided into 3 non-overlapping segments -->
  <rect x="520" y="170" width="67" height="70" fill="#a9dfbf" stroke="#1e8449" stroke-width="1.5"/>
  <rect x="625" y="170" width="112" height="70" fill="#a9dfbf" stroke="#1e8449" stroke-width="1.5"/>
  <rect x="775" y="170" width="130" height="70" fill="#a9dfbf" stroke="#1e8449" stroke-width="1.5"/>

  <!-- Bottom Copper Foil Segments (FR-4) -->
  <rect x="520" y="240" width="67" height="8" fill="#e67e22" stroke="#d35400" stroke-width="1"/>
  <rect x="625" y="240" width="112" height="8" fill="#e67e22" stroke="#d35400" stroke-width="1"/>
  <rect x="775" y="240" width="130" height="8" fill="#e67e22" stroke="#d35400" stroke-width="1"/>

  <!-- Plated-Through-Hole Copper Barrels (PTH) -->
  <!-- Hole 1 Barrel -->
  <rect x="587" y="162" width="6" height="86" fill="#e67e22" stroke="#d35400" stroke-width="1"/>
  <rect x="619" y="162" width="6" height="86" fill="#e67e22" stroke="#d35400" stroke-width="1"/>
  <!-- Barrel 1 Solder Fill -->
  <rect x="593" y="170" width="26" height="70" fill="#d5dbdb"/>

  <!-- Hole 2 Barrel -->
  <rect x="737" y="162" width="6" height="86" fill="#e67e22" stroke="#d35400" stroke-width="1"/>
  <rect x="769" y="162" width="6" height="86" fill="#e67e22" stroke="#d35400" stroke-width="1"/>

  <!-- Component Pin & Solder Joint on Hole 1 (FR-4) -->
  <rect x="585" y="130" width="45" height="22" fill="#34495e" rx="3"/>
  <path d="M 580 162 Q 606 150 632 162 Z" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
  <line x1="606" y1="152" x2="606" y2="256" stroke="#7f8c8d" stroke-width="3"/>
  <path d="M 580 248 Q 606 264 632 248 Z" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>

  <!-- Bottom Foil Label (FR-4) -->
  <text x="712" y="278" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Металізована гільза (PTH) з'єднує обидва шари</text>

  <!-- FR-4 Badges / Summary -->
  <rect x="510" y="300" width="405" height="65" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="6"/>
  <text x="525" y="320" font-size="13" font-weight="bold" fill="#27ae60">✓ Металізовані наскрізні отвори (PTH)</text>
  <text x="525" y="338" font-size="12" fill="#1a1a1a">Припій затікає всередину отвору, утворюючи міцну</text>
  <text x="525" y="353" font-size="12" fill="#1a1a1a">3D-структуру, яка витримує багаторазову перепайку.</text>

  <rect x="510" y="375" width="405" height="65" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="525" y="395" font-size="12" fill="#1a1a1a">• Висока механічна міцність і термостійкість</text>
  <text x="525" y="412" font-size="12" fill="#1a1a1a">• Двостороннє трасування та надійні п'ятачки</text>
  <text x="525" y="429" font-size="12" fill="#2457d6">• Призначення: багаторазові надійні прототипи</text>
</svg>
