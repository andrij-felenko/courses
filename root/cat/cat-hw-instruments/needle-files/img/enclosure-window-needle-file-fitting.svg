<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Етапи доводки прямокутного вікна надфілями та примірка дисплея</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Формування граней плоским надфілем, виведення кута 90° тригранним інструментом і примірка</text>

  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- ЕТАП 1: ПЛОСКИЙ НАДФІЛЬ -->
  <g id="step1">
    <rect x="30" y="75" width="285" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="42" y="87" width="261" height="30" rx="4" fill="#eaf0fd"/>
    <text x="172.5" y="107" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Вирівнювання прямих граней</text>

    <!-- Корпус панелі -->
    <rect x="60" y="150" width="80" height="190" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Лінія грані вікна -->
    <line x1="140" y1="150" x2="140" y2="340" stroke="#64748b" stroke-width="2"/>

    <!-- Плоский надфіль -->
    <rect x="140" y="170" width="16" height="150" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
    <!-- Насічки надфіля -->
    <path d="M142,185 L154,180 M142,200 L154,195 M142,215 L154,210 M142,230 L154,225 M142,245 L154,240 M142,260 L154,255 M142,275 L154,270 M142,290 L154,285 M142,305 L154,300" stroke="#64748b" stroke-width="1"/>
    <!-- Ручка надфіля -->
    <rect x="143" y="320" width="10" height="45" rx="3" fill="#334155"/>

    <!-- Стрілки напрямку руху -->
    <line x1="172" y1="270" x2="172" y2="200" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
    <line x1="182" y1="210" x2="182" y2="280" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>

    <!-- Написи та підказки -->
    <line x1="156" y1="170" x2="190" y2="170" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="195" y="174" font-size="12" fill="#1a1a1a" text-anchor="start">Плоский надфіль</text>

    <text x="195" y="240" font-size="12" fill="#2457d6" font-weight="bold" text-anchor="start">Рух вздовж грані</text>

    <text x="45" y="355" font-size="12" fill="#6b7280" text-anchor="start">Припуск на обробку</text>
    <text x="45" y="370" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="start">0.2–0.5 мм</text>

    <!-- Нижній інформаційний блок -->
    <rect x="42" y="395" width="261" height="40" rx="4" fill="#ffffff" stroke="#d0d7de"/>
    <text x="172.5" y="413" font-size="12" fill="#1a1a1a" text-anchor="middle">Знімає основний припуск матеріалу</text>
    <text x="172.5" y="428" font-size="12" fill="#6b7280" text-anchor="middle">Контроль прямолінійності кромки</text>
  </g>

  <!-- ЕТАП 2: ТРИГРАННИЙ НАДФІЛЬ -->
  <g id="step2">
    <rect x="337" y="75" width="285" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="349" y="87" width="261" height="30" rx="4" fill="#e9f7ef"/>
    <text x="479.5" y="107" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">2. Доводка кута 90° (Тригранний)</text>

    <!-- Стінки кута вікна -->
    <rect x="360" y="145" width="85" height="70" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="360" y="215" width="70" height="100" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>

    <!-- Позначка кута 90 град -->
    <path d="M430,230 L445,230 L445,215" fill="none" stroke="#27ae60" stroke-width="1.5"/>
    <text x="452" y="210" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">90°</text>

    <!-- Профіль тригранного надфіля -->
    <polygon points="430,215 470,235 445,270" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
    <line x1="430" y1="215" x2="457.5" y2="252.5" stroke="#27ae60" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Вказівники та написи -->
    <line x1="430" y1="215" x2="475" y2="165" stroke="#27ae60" stroke-width="1" marker-end="url(#arr-green)"/>
    <text x="480" y="165" font-size="12" fill="#27ae60" font-weight="bold" text-anchor="start">Ребро у вершині кута</text>

    <line x1="457.5" y1="252.5" x2="475" y2="285" stroke="#6b7280" stroke-width="1"/>
    <text x="480" y="285" font-size="12" fill="#1a1a1a" text-anchor="start">Грань інструмента</text>

    <line x1="395" y1="315" x2="395" y2="345" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="365" y="360" font-size="12" fill="#6b7280" text-anchor="start">Захист суміжної стінки</text>

    <!-- Нижній інформаційний блок -->
    <rect x="349" y="395" width="261" height="40" rx="4" fill="#ffffff" stroke="#d0d7de"/>
    <text x="479.5" y="413" font-size="12" fill="#1a1a1a" text-anchor="middle">Формування гострого кута без підрізів</text>
    <text x="479.5" y="428" font-size="12" fill="#6b7280" text-anchor="middle">Працює лише одне активне ребро</text>
  </g>

  <!-- ЕТАП 3: ПРИМІРКА ДИСПЛЕЯ -->
  <g id="step3">
    <rect x="645" y="75" width="285" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="657" y="87" width="261" height="30" rx="4" fill="#eaf0fd"/>
    <text x="787.5" y="107" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">3. Контрольна примірка дисплея</text>

    <!-- Панель корпусу з підготовленим вікном -->
    <rect x="665" y="150" width="245" height="190" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <!-- Вирізане вікно -->
    <rect x="715" y="185" width="145" height="90" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>

    <!-- OLED модуль -->
    <rect x="705" y="175" width="165" height="110" rx="4" fill="#064e3b" fill-opacity="0.9" stroke="#047857" stroke-width="1.5"/>
    <rect x="720" y="190" width="135" height="80" rx="2" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Екранні написи на склі -->
    <text x="787.5" y="225" font-size="12" font-weight="bold" fill="#38bdf8" text-anchor="middle">OLED 0.96"</text>
    <text x="787.5" y="245" font-size="12" fill="#4ade80" text-anchor="middle">128 × 64 px</text>

    <!-- Монтажні отвори на платі OLED -->
    <circle cx="713" cy="183" r="3" fill="#cbd5e1" stroke="#047857"/>
    <circle cx="862" cy="183" r="3" fill="#cbd5e1" stroke="#047857"/>
    <circle cx="713" cy="277" r="3" fill="#cbd5e1" stroke="#047857"/>
    <circle cx="862" cy="277" r="3" fill="#cbd5e1" stroke="#047857"/>

    <!-- Стрілка встановлення -->
    <line x1="787.5" y1="130" x2="787.5" y2="160" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
    <text x="787.5" y="125" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Напрямок встановлення</text>

    <text x="787.5" y="310" font-size="12" fill="#1a1a1a" text-anchor="middle">Рівномірний зазор ~0.1 мм</text>
    <text x="787.5" y="365" font-size="12" fill="#6b7280" text-anchor="middle">Захист скла від перекосу</text>

    <!-- Нижній інформаційний блок -->
    <rect x="657" y="395" width="261" height="40" rx="4" fill="#ffffff" stroke="#d0d7de"/>
    <text x="787.5" y="413" font-size="12" fill="#1a1a1a" text-anchor="middle">Примірка «за місцем» до монтажу</text>
    <text x="787.5" y="428" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Відсутність мех. напружень</text>
  </g>
</svg>
