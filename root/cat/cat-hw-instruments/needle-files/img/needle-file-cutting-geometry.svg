<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Геометрія мікрорізання: сталевий зубець проти алмазного зерна</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Глибина проникнення hp під нормальним навантаженням FN визначає геометричну шорсткість Rz</text>

  <!-- LEFT BOX: Steel Tooth -->
  <rect x="30" y="75" width="435" height="300" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="247" y="98" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Сталевий зубець насічки (Мікрорізання)</text>

  <!-- Workpiece Block (Left) -->
  <polygon points="50,230 180,230 250,248 270,230 445,230 445,290 50,290" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Steel Tooth Body -->
  <polygon points="210,140 320,140 250,248" fill="#fef08a" stroke="#d97706" stroke-width="2"/>

  <!-- Reference Axis Lines -->
  <line x1="250" y1="110" x2="250" y2="248" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="150" y1="230" x2="350" y2="230" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Forces: FN and FT -->
  <line x1="265" y1="90" x2="265" y2="132" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="272" y="112" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">FN</text>

  <line x1="145" y1="170" x2="200" y2="170" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="172" y="160" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">FT (рух v)</text>

  <!-- Chip Formation -->
  <path d="M 235 220 Q 200 190 180 205 Q 195 215 220 230 Z" fill="#d0d7de" stroke="#2457d6" stroke-width="1.5"/>
  <text x="165" y="215" font-size="12" fill="#2457d6" text-anchor="end">Стружка</text>

  <!-- Angle Labels -->
  <text x="235" y="165" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">γ</text>
  <text x="262" y="180" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">β</text>
  <text x="285" y="222" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">α</text>

  <!-- Penetration Depth Dimension Line hp -->
  <line x1="365" y1="230" x2="365" y2="248" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="358" y1="230" x2="372" y2="230" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="358" y1="248" x2="372" y2="248" stroke="#1a1a1a" stroke-width="1"/>
  <text x="378" y="243" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">hp</text>

  <!-- Left Box Bottom Note -->
  <rect x="50" y="325" width="395" height="36" fill="#ffffff" stroke="#d0d7de" rx="4"/>
  <text x="247" y="341" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Зняття стружки з переднім кутом γ &gt; 0</text>
  <text x="247" y="355" font-size="12" fill="#6b7280" text-anchor="middle">Чистота поверхні залежить від кроку насічки</text>

  <!-- RIGHT BOX: Diamond Grain -->
  <rect x="495" y="75" width="435" height="300" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="712" y="98" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Алмазне зерно (Мікроподряпування)</text>

  <!-- Workpiece Block (Right) -->
  <polygon points="515,230 640,230 710,248 730,230 910,230 910,290 515,290" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Nickel Matrix Holder -->
  <rect x="580" y="130" width="260" height="45" fill="#d0d7de" stroke="#4b5563" stroke-width="1.5" rx="3"/>
  <text x="710" y="152" font-size="12" fill="#4b5563" text-anchor="middle">Нікелева зв'язка (покриття)</text>

  <!-- Diamond Crystal Grain -->
  <polygon points="675,150 740,155 745,190 710,248 665,200" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <line x1="710" y1="248" x2="705" y2="175" stroke="#27ae60" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="665" y1="200" x2="740" y2="155" stroke="#27ae60" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Forces: FN and Motion v -->
  <line x1="710" y1="88" x2="710" y2="122" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="718" y="108" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">FN</text>

  <line x1="605" y1="210" x2="655" y2="210" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="630" y="200" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">v</text>

  <!-- Vertical axis for negative rake angle -->
  <line x1="710" y1="190" x2="710" y2="248" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="660" y="224" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">γ &lt; 0 (негативний)</text>

  <!-- Penetration Depth Dimension Line hp / Rz -->
  <line x1="830" y1="230" x2="830" y2="248" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="824" y1="230" x2="836" y2="230" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="824" y1="248" x2="836" y2="248" stroke="#1a1a1a" stroke-width="1"/>
  <text x="842" y="243" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">hp ≈ Rz</text>

  <text x="742" y="224" font-size="12" fill="#27ae60" text-anchor="start">Мікроканавка</text>

  <!-- Right Box Bottom Note -->
  <rect x="515" y="325" width="395" height="36" fill="#ffffff" stroke="#d0d7de" rx="4"/>
  <text x="712" y="341" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Мікроподряпування з негативним кутом γ &lt; 0</text>
  <text x="712" y="355" font-size="12" fill="#6b7280" text-anchor="middle">Шорсткість Rz визначається зернистістю (Grit)</text>

  <!-- BOTTOM SUMMARY PANEL -->
  <rect x="30" y="388" width="900" height="58" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="480" y="410" font-size="12" fill="#1a1a1a" text-anchor="middle">Глибина проникнення hp залежить від нормального тиску FN та межі плинності матеріалу.</text>
  <text x="480" y="430" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Сталеві надфілі зрізають стружку (γ &gt; 0), а алмазні — мікроподряпують та деформують метал (γ &lt; 0).</text>
</svg>
