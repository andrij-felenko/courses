<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Техніка опилювання та хвату надфіля при підганянні вирізу</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Точний делікатний хват, кут подачі 30–45° та послідовність виведення кутів 90° запобігають зламу</text>

  <!-- ==================== PANEL 1: КРОК 1 ==================== -->
  <rect x="20" y="75" width="288" height="405" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="32" y="87" width="70" height="22" rx="4" fill="#2457d6"/>
  <text x="67" y="102" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">КРОК 1</text>
  <text x="110" y="102" font-size="14" font-weight="bold" fill="#1a1a1a">Правильний хват</text>
  <text x="32" y="122" font-size="12" fill="#6b7280">Делікатне утримання пальцями</text>
  <line x1="32" y1="130" x2="296" y2="130" stroke="#d0d7de" stroke-width="1"/>

  <!-- Graphic Box 1 -->
  <rect x="32" y="138" width="264" height="165" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  
  <!-- Workpiece -->
  <rect x="155" y="225" width="115" height="35" rx="3" fill="#f4f6f8" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="212" y="247" font-size="11" fill="#6b7280" text-anchor="middle">Деталь корпусу</text>

  <!-- Needle File Handle & Blade -->
  <rect x="55" y="215" width="60" height="10" rx="3" fill="#d0d7de" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="115" y="217" width="120" height="6" rx="1" fill="#2457d6"/>

  <!-- Contact zone indicators -->
  <ellipse cx="80" cy="210" rx="12" ry="7" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="2,2"/>
  <text x="82" y="192" font-size="11" fill="#2457d6" text-anchor="middle">Вказівний палець</text>

  <ellipse cx="80" cy="230" rx="12" ry="7" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="2,2"/>
  <text x="80" y="254" font-size="11" fill="#2457d6" text-anchor="middle">Великий палець</text>

  <!-- Force Arrows -->
  <line x1="125" y1="168" x2="175" y2="168" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="150" y="160" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Робочий хід F (подача)</text>

  <line x1="135" y1="182" x2="135" y2="206" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="145" y="196" font-size="11" fill="#27ae60">Легкий натиск</text>

  <!-- Text Box 1 -->
  <rect x="32" y="315" width="264" height="153" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="164" y="331" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ПРАВИЛА ХВАТУ</text>
  <text x="42" y="350" font-size="12" fill="#1a1a1a">• Хват трьома пальцями за хвостовик</text>
  <text x="42" y="368" font-size="12" fill="#1a1a1a">• Вказівний палець спрямовує рух</text>
  <text x="42" y="386" font-size="12" fill="#1a1a1a">• Натиск лише при русі ВПЕРЕД</text>
  <text x="42" y="404" font-size="12" fill="#1a1a1a">• Без бічного згину (проти зламу)</text>
  <text x="42" y="422" font-size="12" fill="#1a1a1a">• Холостий хід НАЗАД — без натиску</text>
  <text x="42" y="440" font-size="12" fill="#1a1a1a">• Контроль зусилля в межах 0,5–1,5 кг</text>


  <!-- ==================== PANEL 2: КРОК 2 ==================== -->
  <rect x="336" y="75" width="288" height="405" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="348" y="87" width="70" height="22" rx="4" fill="#2457d6"/>
  <text x="383" y="102" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">КРОК 2</text>
  <text x="426" y="102" font-size="14" font-weight="bold" fill="#1a1a1a">Кут подачі та напрямок</text>
  <text x="348" y="122" font-size="12" fill="#6b7280">Перехресне опилювання під 30–45°</text>
  <line x1="348" y1="130" x2="612" y2="130" stroke="#d0d7de" stroke-width="1"/>

  <!-- Graphic Box 2 -->
  <rect x="348" y="138" width="264" height="165" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Workpiece Edge -->
  <rect x="368" y="240" width="224" height="30" rx="3" fill="#f4f6f8" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="480" y="259" font-size="11" fill="#6b7280" text-anchor="middle">Кромка оброблюваного вирізу</text>

  <!-- Diagonally oriented file -->
  <line x1="390" y1="240" x2="510" y2="160" stroke="#2457d6" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Angle Reference line & Arc -->
  <line x1="390" y1="240" x2="475" y2="240" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>
  <path d="M 430,240 A 40,40 0 0,0 422,219" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <text x="360" y="205" font-size="12" font-weight="bold" fill="#2457d6">α = 30°–45°</text>

  <!-- Motion arrows -->
  <line x1="460" y1="205" x2="495" y2="182" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="502" y="180" font-size="11" font-weight="bold" fill="#27ae60">Подача під кутом</text>

  <line x1="490" y1="260" x2="455" y2="235" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-blue)"/>
  <text x="360" y="160" font-size="11" fill="#2457d6">Перехресний штрих</text>

  <!-- Text Box 2 -->
  <rect x="348" y="315" width="264" height="153" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="331" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ТЕХНІКА ПОДАЧІ</text>
  <text x="358" y="350" font-size="12" fill="#1a1a1a">• Подача під кутом α = 30°...45°</text>
  <text x="358" y="368" font-size="12" fill="#1a1a1a">• Перехресні штрихи для площини</text>
  <text x="358" y="386" font-size="12" fill="#1a1a1a">• Використання всієї довжини полотна</text>
  <text x="358" y="404" font-size="12" fill="#1a1a1a">• Швидкість руху 40–60 ходів/хв</text>
  <text x="358" y="422" font-size="12" fill="#1a1a1a">• Постійний контроль площинності</text>
  <text x="358" y="440" font-size="12" fill="#1a1a1a">• Очищення насічки щіткою від стружки</text>


  <!-- ==================== PANEL 3: КРОК 3 ==================== -->
  <rect x="652" y="75" width="288" height="405" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="664" y="87" width="70" height="22" rx="4" fill="#2457d6"/>
  <text x="699" y="102" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">КРОК 3</text>
  <text x="742" y="102" font-size="14" font-weight="bold" fill="#1a1a1a">Обробка кутів вирізу</text>
  <text x="664" y="122" font-size="12" fill="#6b7280">Формування кутів 90° під дисплей</text>
  <line x1="664" y1="130" x2="928" y2="130" stroke="#d0d7de" stroke-width="1"/>

  <!-- Graphic Box 3 -->
  <rect x="664" y="138" width="264" height="165" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Display Housing Plate with Cutout -->
  <path d="M 684,152 L 908,152 L 908,282 L 684,282 Z M 748,152 L 908,152 L 908,235 L 748,235 Z" fill="#f4f6f8" stroke="#94a3b8" stroke-width="1.5"/>
  
  <!-- Corner 90° highlight -->
  <path d="M 748,225 L 748,235 L 758,235" fill="none" stroke="#27ae60" stroke-width="2"/>

  <!-- Needle File inserted at corner -->
  <rect x="724" y="210" width="24" height="25" rx="1" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>

  <!-- Motion arrows towards corner vertex -->
  <line x1="736" y1="172" x2="736" y2="198" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="692" y1="222" x2="714" y2="222" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="748" y="270" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Рух ДО вершини кута</text>

  <!-- Badges / Labels -->
  <rect x="792" y="180" width="90" height="20" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="837" y="194" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Прямий кут 90°</text>

  <rect x="774" y="206" width="126" height="20" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="837" y="220" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Не завалювати кромки!</text>

  <!-- Text Box 3 -->
  <rect x="664" y="315" width="264" height="153" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="796" y="331" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">ПІДГАНЯННЯ КУТІВ</text>
  <text x="674" y="350" font-size="12" fill="#1a1a1a">• Плоский або квадратний надфіль</text>
  <text x="674" y="368" font-size="12" fill="#1a1a1a">• Рух ВІД периферії ДО вершини кута</text>
  <text x="674" y="386" font-size="12" fill="#1a1a1a">• Гладка грань надфіля до стінки</text>
  <text x="674" y="404" font-size="12" fill="#1a1a1a">• Контроль кутником 90° або рамкою</text>
  <text x="674" y="422" font-size="12" fill="#1a1a1a">• Зняття заусенців по периметру</text>
  <text x="674" y="440" font-size="12" fill="#1a1a1a">• Фінішна доводка насічкою №3–5</text>
</svg>
