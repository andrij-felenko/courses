<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Залежність частоти обертання шпинделя від діаметра свердла HSS</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Збільшення діаметра й твердості матеріалу вимагає зниження обертів для збереження різальних крайок</text>

  <!-- Plot Axes Grid Lines -->
  <!-- Horizontal Grid Lines -->
  <line x1="100" y1="374" x2="650" y2="374" stroke="#e5e7eb" stroke-dasharray="4 4" stroke-width="1"/>
  <line x1="100" y1="308" x2="650" y2="308" stroke="#e5e7eb" stroke-dasharray="4 4" stroke-width="1"/>
  <line x1="100" y1="242" x2="650" y2="242" stroke="#e5e7eb" stroke-dasharray="4 4" stroke-width="1"/>
  <line x1="100" y1="176" x2="650" y2="176" stroke="#e5e7eb" stroke-dasharray="4 4" stroke-width="1"/>
  <line x1="100" y1="110" x2="650" y2="110" stroke="#e5e7eb" stroke-dasharray="4 4" stroke-width="1"/>

  <!-- Vertical Grid Lines -->
  <line x1="120" y1="110" x2="120" y2="440" stroke="#e5e7eb" stroke-dasharray="4 4" stroke-width="1"/>
  <line x1="210" y1="110" x2="210" y2="440" stroke="#e5e7eb" stroke-dasharray="4 4" stroke-width="1"/>
  <line x1="300" y1="110" x2="300" y2="440" stroke="#e5e7eb" stroke-dasharray="4 4" stroke-width="1"/>
  <line x1="390" y1="110" x2="390" y2="440" stroke="#e5e7eb" stroke-dasharray="4 4" stroke-width="1"/>
  <line x1="480" y1="110" x2="480" y2="440" stroke="#e5e7eb" stroke-dasharray="4 4" stroke-width="1"/>
  <line x1="570" y1="110" x2="570" y2="440" stroke="#e5e7eb" stroke-dasharray="4 4" stroke-width="1"/>
  <line x1="650" y1="110" x2="650" y2="440" stroke="#e5e7eb" stroke-dasharray="4 4" stroke-width="1"/>

  <!-- Plot Axes Lines -->
  <line x1="100" y1="440" x2="665" y2="440" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="100" y1="440" x2="100" y2="92" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Axis Titles -->
  <text x="100" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Оберти n, об/хв</text>
  <text x="375" y="495" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Діаметр свердла D, мм</text>

  <!-- Y-Axis Ticks & Labels -->
  <line x1="94" y1="440" x2="100" y2="440" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="90" y="444" text-anchor="end" font-size="12" fill="#1a1a1a">0</text>

  <line x1="94" y1="374" x2="100" y2="374" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="90" y="378" text-anchor="end" font-size="12" fill="#1a1a1a">1000</text>

  <line x1="94" y1="308" x2="100" y2="308" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="90" y="312" text-anchor="end" font-size="12" fill="#1a1a1a">2000</text>

  <line x1="94" y1="242" x2="100" y2="242" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="90" y="246" text-anchor="end" font-size="12" fill="#1a1a1a">3000</text>

  <line x1="94" y1="176" x2="100" y2="176" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="90" y="180" text-anchor="end" font-size="12" fill="#1a1a1a">4000</text>

  <line x1="94" y1="110" x2="100" y2="110" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="90" y="114" text-anchor="end" font-size="12" fill="#1a1a1a">5000</text>

  <!-- X-Axis Ticks & Labels -->
  <line x1="120" y1="440" x2="120" y2="446" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="120" y="462" text-anchor="middle" font-size="12" fill="#1a1a1a">2.0</text>

  <line x1="210" y1="440" x2="210" y2="446" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="210" y="462" text-anchor="middle" font-size="12" fill="#1a1a1a">3.0</text>

  <line x1="300" y1="440" x2="300" y2="446" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="300" y="462" text-anchor="middle" font-size="12" fill="#1a1a1a">4.0</text>

  <line x1="390" y1="440" x2="390" y2="446" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="390" y="462" text-anchor="middle" font-size="12" fill="#1a1a1a">5.0</text>

  <line x1="480" y1="440" x2="480" y2="446" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="480" y="462" text-anchor="middle" font-size="12" fill="#1a1a1a">6.0</text>

  <line x1="570" y1="440" x2="570" y2="446" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="570" y="462" text-anchor="middle" font-size="12" fill="#1a1a1a">7.0</text>

  <line x1="650" y1="440" x2="650" y2="446" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="650" y="462" text-anchor="middle" font-size="12" fill="#1a1a1a">8.0</text>

  <!-- Curve 1: Aluminum (Blue) -->
  <path d="M 120,143 Q 210,209 300,255 T 480,315 T 650,348" fill="none" stroke="#2563eb" stroke-width="3"/>
  <circle cx="120" cy="143" r="4" fill="#2563eb" stroke="white" stroke-width="1.5"/>
  <circle cx="210" cy="209" r="4" fill="#2563eb" stroke="white" stroke-width="1.5"/>
  <circle cx="300" cy="255" r="4" fill="#2563eb" stroke="white" stroke-width="1.5"/>
  <circle cx="390" cy="288" r="4" fill="#2563eb" stroke="white" stroke-width="1.5"/>
  <circle cx="480" cy="315" r="4" fill="#2563eb" stroke="white" stroke-width="1.5"/>
  <circle cx="650" cy="348" r="4" fill="#2563eb" stroke="white" stroke-width="1.5"/>
  <text x="132" y="140" font-size="12" font-weight="bold" fill="#2563eb">4500 об/хв</text>
  <text x="605" y="338" font-size="12" font-weight="bold" fill="#2563eb">1400 об/хв</text>

  <!-- Curve 2: Structural Steel (Amber) -->
  <path d="M 120,255 Q 210,301 300,334 T 480,367 T 650,387" fill="none" stroke="#d97706" stroke-width="3"/>
  <circle cx="120" cy="255" r="4" fill="#d97706" stroke="white" stroke-width="1.5"/>
  <circle cx="210" cy="301" r="4" fill="#d97706" stroke="white" stroke-width="1.5"/>
  <circle cx="300" cy="334" r="4" fill="#d97706" stroke="white" stroke-width="1.5"/>
  <circle cx="390" cy="354" r="4" fill="#d97706" stroke="white" stroke-width="1.5"/>
  <circle cx="480" cy="367" r="4" fill="#d97706" stroke="white" stroke-width="1.5"/>
  <circle cx="650" cy="387" r="4" fill="#d97706" stroke="white" stroke-width="1.5"/>
  <text x="132" y="250" font-size="12" font-weight="bold" fill="#d97706">2800 об/хв</text>
  <text x="605" y="378" font-size="12" font-weight="bold" fill="#d97706">800 об/хв</text>

  <!-- Curve 3: Stainless Steel (Red) -->
  <path d="M 120,341 Q 210,374 300,390 T 480,407 T 650,415" fill="none" stroke="#dc2626" stroke-width="3"/>
  <circle cx="120" cy="341" r="4" fill="#dc2626" stroke="white" stroke-width="1.5"/>
  <circle cx="210" cy="374" r="4" fill="#dc2626" stroke="white" stroke-width="1.5"/>
  <circle cx="300" cy="390" r="4" fill="#dc2626" stroke="white" stroke-width="1.5"/>
  <circle cx="390" cy="400" r="4" fill="#dc2626" stroke="white" stroke-width="1.5"/>
  <circle cx="480" cy="407" r="4" fill="#dc2626" stroke="white" stroke-width="1.5"/>
  <circle cx="650" cy="415" r="4" fill="#dc2626" stroke="white" stroke-width="1.5"/>
  <text x="132" y="336" font-size="12" font-weight="bold" fill="#dc2626">1500 об/хв</text>
  <text x="605" y="412" font-size="12" font-weight="bold" fill="#dc2626">380 об/хв</text>

  <!-- Side Legend & Info Panel -->
  <rect x="690" y="95" width="250" height="400" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>

  <!-- Panel Header -->
  <text x="705" y="120" font-size="14" font-weight="bold" fill="#1a1a1a">Режими обробки (HSS)</text>

  <!-- Legend 1: Aluminum -->
  <line x1="705" y1="145" x2="723" y2="145" stroke="#2563eb" stroke-width="3"/>
  <circle cx="714" cy="145" r="3.5" fill="#2563eb"/>
  <text x="730" y="148" font-size="13" font-weight="bold" fill="#2563eb">Алюмінієві сплави</text>
  <text x="730" y="168" font-size="12" fill="#6b7280">Vc = 40–60 м/хв (м'який метал)</text>

  <!-- Legend 2: Structural Steel -->
  <line x1="705" y1="198" x2="723" y2="198" stroke="#d97706" stroke-width="3"/>
  <circle cx="714" cy="198" r="3.5" fill="#d97706"/>
  <text x="730" y="201" font-size="13" font-weight="bold" fill="#d97706">Конструкційна сталь</text>
  <text x="730" y="221" font-size="12" fill="#6b7280">Vc = 20–30 м/хв (середній режим)</text>

  <!-- Legend 3: Stainless Steel -->
  <line x1="705" y1="251" x2="723" y2="251" stroke="#dc2626" stroke-width="3"/>
  <circle cx="714" cy="251" r="3.5" fill="#dc2626"/>
  <text x="730" y="254" font-size="13" font-weight="bold" fill="#dc2626">Нержавіюча сталь</text>
  <text x="730" y="274" font-size="12" fill="#6b7280">Vc = 10–15 м/хв + ЗОР/олива</text>

  <!-- Formula Sub-panel -->
  <rect x="705" y="298" width="220" height="182" fill="white" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="715" y="320" font-size="12" font-weight="bold" fill="#1a1a1a">Формула обертів:</text>
  <text x="815" y="348" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">n = (1000 · Vc) / (π · D)</text>

  <text x="715" y="376" font-size="12" fill="#1a1a1a">n — оберти шпинделя, об/хв</text>
  <text x="715" y="398" font-size="12" fill="#1a1a1a">Vc — швидкість різання, м/хв</text>
  <text x="715" y="420" font-size="12" fill="#1a1a1a">D — діаметр свердла, мм</text>
  <text x="715" y="452" font-size="12" font-style="italic" fill="#c0392b">Увага: охолоджувати кромки!</text>

</svg>
