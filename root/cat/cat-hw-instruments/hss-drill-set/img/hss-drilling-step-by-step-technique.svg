<svg viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Технологічна послідовність свердління металу свердлами HSS</text>
  <text x="480" y="55" font-size="13" fill="#6b7280" text-anchor="middle">Від кернування й додавання ЗОР до свердління та зенкування фаски</text>

  <!-- ПАНЕЛЬ 1: Розмітка та кернування -->
  <rect x="25" y="80" width="215" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="35" y="95" width="195" height="30" rx="4" fill="#eaf0fd"/>
  <text x="132" y="115" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Розмітка та кернування</text>

  <rect x="72" y="128" width="120" height="18" rx="3" fill="#fdecea" stroke="#f5c6cb" stroke-width="1"/>
  <text x="132" y="141" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Удар молотка</text>
  <path d="M 132,147 L 132,152" stroke="#c0392b" stroke-width="2"/>

  <!-- Кернер -->
  <polygon points="124,152 140,152 138,255 132,270 126,255" fill="#475569" stroke="#1e293b" stroke-width="1.5"/>
  <line x1="138" y1="196" x2="145" y2="196" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="148" y="200" font-size="12" fill="#1a1a1a" text-anchor="start">Кернер</text>

  <!-- Заготовка та лунка -->
  <rect x="45" y="270" width="175" height="60" rx="4" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
  <line x1="132" y1="260" x2="132" y2="280" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="100" y1="270" x2="164" y2="270" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,2"/>
  <path d="M 126,270 L 132,277 L 138,270 Z" fill="#334155"/>

  <rect x="62" y="340" width="140" height="20" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="132" y="354" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Конічна лунка</text>

  <text x="132" y="390" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Точна центровка</text>
  <text x="132" y="412" font-size="12" fill="#6b7280" text-anchor="middle">Запобігання ковзанню</text>
  <text x="132" y="434" font-size="12" fill="#6b7280" text-anchor="middle">вершини свердла</text>

  <!-- ПАНЕЛЬ 2: ЗОР та засвердлювання -->
  <rect x="255" y="80" width="215" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="265" y="95" width="195" height="30" rx="4" fill="#eaf0fd"/>
  <text x="362" y="115" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">2. ЗОР та засвердлювання</text>

  <path d="M 342,165 A 15,6 0 0 1 382,165" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="312" y="168" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">n (об/хв)</text>

  <!-- Свердло HSS (вузьке) -->
  <rect x="354" y="145" width="16" height="60" fill="#475569" stroke="#1e293b" stroke-width="1.5"/>
  <path d="M 354,160 Q 362,165 370,160 M 354,180 Q 362,185 370,180 M 354,200 Q 362,205 370,200" stroke="#cbd5e1" stroke-width="1.5" fill="none"/>
  <polygon points="354,205 370,205 362,217" fill="#d97706" stroke="#92400e" stroke-width="1.5"/>

  <!-- Крапля ЗОР -->
  <path d="M 362,225 C 354,235 354,245 362,245 C 370,245 370,235 362,225 Z" fill="#2457d6" opacity="0.85"/>
  <line x1="382" y1="232" x2="370" y2="232" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="382" y="222" width="80" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="422" y="236" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ЗОР</text>

  <!-- Заготовка -->
  <rect x="275" y="270" width="175" height="60" rx="4" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 356,270 L 362,282 L 368,270 Z" fill="#1e293b"/>

  <text x="362" y="390" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Зменшення тертя</text>
  <text x="362" y="412" font-size="12" fill="#6b7280" text-anchor="middle">Захист кромки від перегріву</text>
  <text x="362" y="434" font-size="12" fill="#6b7280" text-anchor="middle">та передчасного зносу</text>

  <!-- ПАНЕЛЬ 3: Робочий діаметр -->
  <rect x="485" y="80" width="215" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="495" y="95" width="195" height="30" rx="4" fill="#eaf0fd"/>
  <text x="592" y="115" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">3. Робочий діаметр</text>

  <path d="M 592,128 L 592,142" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <rect x="612" y="128" width="75" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="649" y="142" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Подача F</text>

  <!-- Свердло HSS (широке) -->
  <rect x="578" y="145" width="28" height="85" fill="#475569" stroke="#1e293b" stroke-width="1.5"/>
  <path d="M 578,165 Q 592,173 606,165 M 578,190 Q 592,198 606,190 M 578,215 Q 592,223 606,215" stroke="#cbd5e1" stroke-width="2" fill="none"/>
  <polygon points="578,230 606,230 592,248" fill="#d97706" stroke="#92400e" stroke-width="1.5"/>

  <!-- Стружка -->
  <path d="M 572,260 Q 560,250 568,240 Q 576,230 564,220" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M 612,260 Q 624,250 616,240 Q 608,230 620,220" fill="none" stroke="#64748b" stroke-width="2"/>
  <text x="632" y="235" font-size="12" fill="#6b7280" text-anchor="start">Стружка</text>

  <!-- Заготовка з наскрізним отвором -->
  <rect x="505" y="270" width="175" height="60" rx="4" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
  <rect x="578" y="270" width="28" height="60" fill="#ffffff" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2"/>

  <rect x="522" y="340" width="140" height="20" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="592" y="354" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Переривчаста подача</text>

  <text x="592" y="390" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Подрібнення стружки</text>
  <text x="592" y="412" font-size="12" fill="#6b7280" text-anchor="middle">Легкий відвід з отвору</text>
  <text x="592" y="434" font-size="12" fill="#6b7280" text-anchor="middle">запобігає заклинюванню</text>

  <!-- ПАНЕЛЬ 4: Зенкування фаски -->
  <rect x="715" y="80" width="215" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="725" y="95" width="195" height="30" rx="4" fill="#e9f7ef"/>
  <text x="822" y="115" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">4. Зенкування фаски</text>

  <!-- Зенкер 90° -->
  <rect x="814" y="145" width="16" height="50" fill="#475569" stroke="#1e293b" stroke-width="1.5"/>
  <polygon points="798,195 846,195 822,235" fill="#27ae60" stroke="#1e7e34" stroke-width="1.5"/>
  <line x1="810" y1="195" x2="822" y2="235" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="834" y1="195" x2="822" y2="235" stroke="#ffffff" stroke-width="1.5"/>

  <line x1="850" y1="185" x2="840" y2="185" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="850" y="175" width="70" height="20" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="885" y="189" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Зенкер 90°</text>

  <!-- Заготовка з фаскою -->
  <rect x="735" y="270" width="175" height="60" rx="4" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5"/>
  <rect x="808" y="285" width="28" height="45" fill="#ffffff" stroke="#64748b" stroke-width="1"/>
  <polygon points="798,270 846,270 836,285 808,285" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>

  <rect x="742" y="340" width="160" height="20" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="822" y="354" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Фаска без заудерок</text>

  <text x="822" y="390" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Безпечний край отвору</text>
  <text x="822" y="412" font-size="12" fill="#6b7280" text-anchor="middle">Готовність під потайний гвинт</text>
  <text x="822" y="434" font-size="12" fill="#6b7280" text-anchor="middle">або заклепку</text>
</svg>
