<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Геометрія безпекового 4-мм штекера та панельного гнізда (IEC 61010-031)</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Захисний ізоляційний кожух Ø 7.8 мм та заглиблення контакту запобігають ураженню струмом</text>

  <!-- LEFT BOX: Shrouded Plug -->
  <rect x="40" y="70" width="425" height="320" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="252.5" y="95" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Безпековий штекер 4 мм (Shrouded Plug)</text>

  <!-- Flange Header & Height Label -->
  <text x="103" y="130" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Захисний бар'єр</text>
  <text x="103" y="146" font-size="12" fill="#2457d6" text-anchor="middle">h ≥ 12 мм</text>

  <!-- Flange Height Dimension Lines -->
  <line x1="80" y1="160" x2="95" y2="160" stroke="#2457d6" stroke-width="1"/>
  <line x1="80" y1="280" x2="95" y2="280" stroke="#2457d6" stroke-width="1"/>
  <line x1="82" y1="160" x2="82" y2="198" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue)"/>
  <line x1="82" y1="242" x2="82" y2="280" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Cable Entry -->
  <rect x="48" y="210" width="47" height="20" fill="#374151" rx="3"/>
  <text x="71.5" y="224" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">4 мм²</text>

  <!-- Finger Barrier Flange -->
  <rect x="95" y="160" width="16" height="120" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="3"/>

  <!-- Handle Body -->
  <rect x="111" y="190" width="75" height="60" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="4"/>
  <text x="148.5" y="225" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Корпус</text>

  <!-- Shroud Tube Label -->
  <text x="266" y="185" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Захисний кожух (IEC 61010)</text>

  <!-- Outer Shroud Walls (Top & Bottom) -->
  <rect x="186" y="200" width="160" height="7" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="1"/>
  <rect x="186" y="233" width="160" height="7" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="1"/>

  <!-- Inner Brass Pin & Tip -->
  <rect x="186" y="214" width="132" height="12" fill="#fef08a" stroke="#d97706" stroke-width="1.5" rx="1"/>
  <polygon points="318,214 326,220 318,226" fill="#fef08a" stroke="#d97706" stroke-width="1.5"/>

  <!-- Outer Diameter Dimension (7.8 mm) -->
  <line x1="346" y1="200" x2="375" y2="200" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="346" y1="240" x2="375" y2="240" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="368" y1="200" x2="368" y2="240" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-dark)" marker-end="url(#arr-dark)"/>
  <text x="380" y="224" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Ø 7.8 мм</text>

  <!-- Shroud Length Dimension (19.0 mm) -->
  <line x1="186" y1="240" x2="186" y2="272" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="346" y1="240" x2="346" y2="272" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="186" y1="265" x2="346" y2="265" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-dark)" marker-end="url(#arr-dark)"/>
  <text x="266" y="285" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Довжина кожуха: 19.0 мм</text>

  <!-- Pin Recess Dimension (2.0 mm) -->
  <line x1="326" y1="226" x2="326" y2="318" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="346" y1="240" x2="346" y2="318" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="326" y1="310" x2="346" y2="310" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-red)" marker-end="url(#arr-red)"/>
  <text x="250" y="314" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">Зазор штиря: 2.0 мм</text>
  <text x="250" y="330" font-size="12" fill="#6b7280" text-anchor="end">(≤ 4.0 мм за IEC 61010)</text>

  <!-- CAT II / CAT III-IV Mode Note Box -->
  <rect x="60" y="348" width="385" height="28" fill="#ffffff" stroke="#d0d7de" rx="4"/>
  <text x="252.5" y="366" font-size="12" fill="#6b7280" text-anchor="middle">Знімний ковпачок: CAT II (19 мм) / CAT III–IV (4 мм)</text>

  <!-- RIGHT BOX: Recessed Jack -->
  <rect x="495" y="70" width="425" height="320" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="707.5" y="95" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Заглиблене панельне гніздо (Recessed Jack)</text>

  <!-- Inner Well Diameter (7.9 mm) -->
  <line x1="533" y1="200" x2="565" y2="200" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="533" y1="240" x2="565" y2="240" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="555" y1="200" x2="555" y2="240" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-dark)" marker-end="url(#arr-dark)"/>
  <text x="555" y="185" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Ø 7.9 мм</text>

  <!-- Touch Safety Recess Depth (8.5 mm) -->
  <line x1="533" y1="150" x2="533" y2="200" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="618" y1="150" x2="618" y2="214" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="533" y1="155" x2="618" y2="155" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-red)" marker-end="url(#arr-red)"/>
  <text x="575.5" y="145" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Заглиблення: 8.5 мм (CAT III/IV)</text>

  <!-- Multimeter Front Panel -->
  <rect x="515" y="150" width="18" height="140" fill="#d0d7de" stroke="#4b5563" stroke-width="1.5" rx="2"/>
  <text x="524" y="308" font-size="12" font-weight="bold" fill="#4b5563" text-anchor="middle">Панель</text>

  <!-- Recessed Socket Tube Walls (Top, Bottom, Back) -->
  <rect x="533" y="200" width="160" height="7" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="1"/>
  <rect x="533" y="233" width="160" height="7" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="1"/>
  <rect x="693" y="200" width="8" height="40" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="1"/>

  <!-- Recessed Brass Contact -->
  <rect x="618" y="214" width="75" height="12" fill="#fef08a" stroke="#d97706" stroke-width="1.5" rx="1"/>
  <line x1="701" y1="220" x2="735" y2="220" stroke="#d97706" stroke-width="3"/>
  <text x="742" y="224" font-size="12" fill="#d97706" text-anchor="start">Вивід до плати</text>

  <!-- Contact Engagement Length (19.5 mm) -->
  <line x1="618" y1="226" x2="618" y2="272" stroke="#27ae60" stroke-width="1"/>
  <line x1="693" y1="240" x2="693" y2="272" stroke="#27ae60" stroke-width="1"/>
  <line x1="618" y1="265" x2="693" y2="265" stroke="#27ae60" stroke-width="1.5" marker-start="url(#arr-green)" marker-end="url(#arr-green)"/>
  <text x="655.5" y="285" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Глибина контакта: 19.5 мм</text>

  <!-- Jack Safety Badge -->
  <rect x="515" y="325" width="385" height="50" fill="#e9f7ef" stroke="#27ae60" rx="4"/>
  <text x="707.5" y="345" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">ЗАХИСТ ВІД ТОРКАННЯ ПАЛЬЦЕМ (IEC 61010)</text>
  <text x="707.5" y="362" font-size="12" fill="#1a1a1a" text-anchor="middle">Випробувальний щуп не досягає струмоведучих частин</text>

  <!-- BOTTOM SUMMARY PANEL -->
  <rect x="40" y="405" width="880" height="55" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="480" y="425" font-size="12" fill="#1a1a1a" text-anchor="middle">Категорії безпеки CAT III 1000V / CAT IV 600V вимагають суцільного кожуха Ø 7.8 мм та заглибленого контакту.</text>
  <text x="480" y="445" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Категорично заборонено використовувати зношені щупи з пошкодженим або зрізаним кожухом!</text>
</svg>
