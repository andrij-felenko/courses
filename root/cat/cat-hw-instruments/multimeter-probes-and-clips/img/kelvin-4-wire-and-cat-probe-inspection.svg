<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="480" fill="#ffffff"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Чотирипровідна схема Кельвіна та категорії безпеки щупів CAT</text>
  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Компенсація опору провідників при малих вимірюваннях та захист від дугового замикання ковпачками</text>

  <!-- LEFT PANEL: Kelvin 4-Wire Circuit -->
  <rect x="25" y="65" width="445" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Чотирипровідне вимірювання (Схема Кельвіна)</text>

  <!-- Instrument / DMM Box -->
  <rect x="45" y="110" width="125" height="235" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="107" y="132" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Прилад / Джерело</text>

  <!-- Terminals inside DMM Box -->
  <circle cx="145" cy="160" r="6" fill="#c0392b"/>
  <text x="130" y="164" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">I+</text>
  <text x="60" y="164" font-size="11" fill="#6b7280">Струм +</text>

  <circle cx="145" cy="205" r="6" fill="#2457d6"/>
  <text x="130" y="209" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">V+</text>
  <text x="60" y="209" font-size="11" fill="#6b7280">Напруга +</text>

  <circle cx="145" cy="265" r="6" fill="#2457d6"/>
  <text x="130" y="269" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">V-</text>
  <text x="60" y="269" font-size="11" fill="#6b7280">Напруга -</text>

  <circle cx="145" cy="310" r="6" fill="#1a1a1a"/>
  <text x="130" y="314" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">I-</text>
  <text x="60" y="314" font-size="11" fill="#6b7280">Струм -</text>

  <!-- Resistor Rx (DUT) -->
  <rect x="360" y="205" width="85" height="60" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="402" y="230" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">R_x</text>
  <text x="402" y="248" text-anchor="middle" font-size="12" fill="#27ae60">0.01 Ом</text>

  <!-- Wires & Lead Resistances (Labels placed clear of lines) -->
  <!-- Wire 1: I+ Force Line -->
  <path d="M 151,160 L 380,160 L 380,205" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <rect x="230" y="152" width="55" height="16" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="257" y="144" text-anchor="middle" font-size="11" fill="#c0392b">R_пров1</text>

  <!-- Wire 2: V+ Sense Line -->
  <path d="M 151,205 L 360,220" fill="none" stroke="#2457d6" stroke-width="2" stroke-dasharray="4,3"/>
  <rect x="230" y="197" width="55" height="16" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="257" y="189" text-anchor="middle" font-size="11" fill="#2457d6">R_пров2</text>

  <!-- Wire 3: V- Sense Line -->
  <path d="M 151,265 L 360,250" fill="none" stroke="#2457d6" stroke-width="2" stroke-dasharray="4,3"/>
  <rect x="230" y="257" width="55" height="16" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="257" y="286" text-anchor="middle" font-size="11" fill="#2457d6">R_пров3</text>

  <!-- Wire 4: I- Force Line -->
  <path d="M 151,310 L 380,310 L 380,265" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="230" y="302" width="55" height="16" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="257" y="331" text-anchor="middle" font-size="11" fill="#1a1a1a">R_пров4</text>

  <!-- Kelvin Contact Points -->
  <circle cx="380" cy="205" r="4" fill="#27ae60"/>
  <circle cx="380" cy="265" r="4" fill="#27ae60"/>

  <!-- Left Panel Summary Box -->
  <rect x="40" y="355" width="415" height="90" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="375" font-size="12" font-weight="bold" fill="#1a1a1a">Принцип Кельвіна (4-Wire):</text>
  <text x="50" y="395" font-size="11" fill="#1a1a1a">1. Струм I_test тече ЛИШЕ через лінії I+ та I-.</text>
  <text x="50" y="413" font-size="11" fill="#1a1a1a">2. Лінії V+/V- мають високий вхідний опір (струм I_V ≈ 0).</text>
  <text x="50" y="431" font-size="11" fill="#27ae60" font-weight="bold">3. Спад напруги вимірюється на R_x без похибки R_пров!</text>

  <!-- RIGHT PANEL: Probe CAT Categories and Caps -->
  <rect x="490" y="65" width="445" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="712" y="90" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Категорії безпеки щупів CAT та ковпачки</text>

  <!-- Diagram 1: Probe WITHOUT cap (CAT II) -->
  <text x="510" y="118" font-size="13" font-weight="bold" fill="#c0392b">1. Щуп БЕЗ ковпачка (CAT II):</text>

  <!-- Probe Handle -->
  <rect x="510" y="130" width="130" height="20" rx="3" fill="#34495e"/>
  <!-- Exposed Long Tip -->
  <rect x="640" y="137" width="90" height="6" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
  <polygon points="730,137 745,140 730,143" fill="#bdc3c7"/>

  <!-- Dimension line for 19mm -->
  <line x1="640" y1="150" x2="745" y2="150" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="640" y1="145" x2="640" y2="155" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="745" y1="145" x2="745" y2="155" stroke="#c0392b" stroke-width="1.5"/>
  <text x="692" y="168" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">19 мм відкритого металу (CAT II)</text>

  <!-- Hazard Box -->
  <rect x="760" y="122" width="160" height="52" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="840" y="142" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">РИЗИК КЗ ТА ДУГИ!</text>
  <text x="840" y="158" text-anchor="middle" font-size="10" fill="#c0392b">при вимірюванні в щитах</text>

  <!-- Diagram 2: Probe WITH Protective Cap (CAT III / CAT IV) -->
  <text x="510" y="195" font-size="13" font-weight="bold" fill="#27ae60">2. Щуп З КОВПАЧКОМ (CAT III / CAT IV):</text>

  <!-- Probe Handle -->
  <rect x="510" y="207" width="130" height="20" rx="3" fill="#34495e"/>
  <!-- Protective Cap (Insulation Sleeve) -->
  <rect x="640" y="210" width="75" height="14" rx="2" fill="#e67e22"/>
  <!-- Short Exposed Metal Tip -->
  <rect x="715" y="214" width="20" height="6" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
  <polygon points="735,214 745,217 735,220" fill="#bdc3c7"/>

  <!-- Dimension line for 4mm -->
  <line x1="715" y1="227" x2="745" y2="227" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="715" y1="222" x2="715" y2="232" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="745" y1="222" x2="745" y2="232" stroke="#27ae60" stroke-width="1.5"/>
  <text x="730" y="245" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">≤ 4 мм (CAT III/IV)</text>

  <!-- Safety Advantage Box -->
  <rect x="760" y="199" width="160" height="52" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="840" y="219" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">ЗАХИСТ ВІД КЗ</text>
  <text x="840" y="235" text-anchor="middle" font-size="10" fill="#27ae60">неможливо замкнути фази</text>

  <!-- Category Badges Section -->
  <text x="510" y="275" font-size="13" font-weight="bold" fill="#1a1a1a">Категорії перенапруги та сфери застосування:</text>

  <!-- CAT II Badge & Text -->
  <rect x="510" y="285" width="85" height="24" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="552" y="301" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">CAT II 1000V</text>
  <text x="605" y="301" font-size="11" fill="#1a1a1a">Розетки, побутові електроприлади, подовжувачі</text>

  <!-- CAT III Badge & Text -->
  <rect x="510" y="315" width="85" height="24" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="552" y="331" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">CAT III 1000V</text>
  <text x="605" y="331" font-size="11" fill="#1a1a1a">Розподільні щити, вимикачі, трифазні мережі</text>

  <!-- CAT IV Badge & Text -->
  <rect x="510" y="345" width="85" height="24" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="552" y="361" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">CAT IV 600V</text>
  <text x="605" y="361" font-size="11" fill="#1a1a1a">Первинний ввід будівлі, лічильники, підстанції</text>

  <!-- Safety Rule Box -->
  <rect x="505" y="385" width="415" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="515" y="405" font-size="11" font-weight="bold" fill="#c0392b">Правило безпеки:</text>
  <text x="515" y="423" font-size="11" fill="#1a1a1a">Завжди надягайте ковпачки при вимірюванні в силових шафах!</text>
  <text x="515" y="437" font-size="10" fill="#6b7280">Це запобігає виклику дугового спалаху при випадковому вислизанні.</text>
</svg>
