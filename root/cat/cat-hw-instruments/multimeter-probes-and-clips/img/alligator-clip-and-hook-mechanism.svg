<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Будова пружного мікрогачка та затискача «крокодил»</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Точки контактного тиску, внутрішній пружинний механізм та захисна ізольована юбка</text>

  <!-- ================= PANEL 1: GRABBER HOOK ================= -->
  <rect x="30" y="80" width="435" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="247" y="106" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Пружний мікрогачок (Grabber Hook)</text>

  <rect x="137" y="120" width="220" height="24" rx="12" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="247" y="136" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Захоплення SMD-виводів та дротів</text>

  <!-- Grabber Hook Graphics -->
  <rect x="65" y="215" width="45" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <rect x="110" y="210" width="210" height="40" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="320,215 380,225 380,235 320,245" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <line x1="90" y1="230" x2="395" y2="230" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="4,2"/>
  <path d="M135,230 L145,220 L155,240 L165,220 L175,240 L185,220 L195,240 L205,220 L215,230" fill="none" stroke="#2457d6" stroke-width="2"/>
  <path d="M380,230 L405,230 A8,8 0 0,1 405,246 L395,246" fill="none" stroke="#c0392b" stroke-width="3"/>
  <circle cx="400" cy="238" r="6" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.5"/>

  <line x1="408" y1="230" x2="386" y2="230" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Panel 1 Callout Lines & Labels -->
  <!-- Callout 1 -->
  <polyline points="87,215 87,175 45,175" fill="none" stroke="#1a1a1a" stroke-width="1.2" marker-start="url(#arr)"/>
  <text x="45" y="165" font-size="11" fill="#1a1a1a" text-anchor="start">Натискний ковпачок</text>

  <!-- Callout 2 -->
  <polyline points="175,210 175,175 190,175" fill="none" stroke="#2457d6" stroke-width="1.2" marker-start="url(#arr-blue)"/>
  <text x="195" y="165" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="start">Пружина притиску</text>

  <!-- Callout 3 -->
  <polyline points="400,225 400,175 320,175" fill="none" stroke="#c0392b" stroke-width="1.2" marker-start="url(#arr-red)"/>
  <text x="320" y="165" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="start">Гнучкий гачок</text>

  <!-- Callout 4 -->
  <polyline points="350,242 350,290 200,290" fill="none" stroke="#1a1a1a" stroke-width="1.2" marker-start="url(#arr)"/>
  <text x="45" y="295" font-size="11" fill="#1a1a1a" text-anchor="start">Захисна ізольована юбка</text>

  <!-- Callout 5 -->
  <polyline points="400,248 400,290 260,290" fill="none" stroke="#27ae60" stroke-width="1.2" marker-start="url(#arr-green)"/>
  <text x="260" y="295" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="start">Точка тиску F_press</text>
  <text x="260" y="310" font-size="11" fill="#6b7280" text-anchor="start">Фіксація виводу плати</text>

  <!-- Panel 1 Feature Box -->
  <rect x="45" y="345" width="405" height="52" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="366" font-size="11" font-weight="bold" fill="#1a1a1a">Особливість:</text>
  <text x="135" y="366" font-size="11" fill="#6b7280">Тонкий захват для щільних SMD-пакетів</text>
  <text x="55" y="386" font-size="11" font-weight="bold" fill="#1a1a1a">Безпека:</text>
  <text x="115" y="386" font-size="11" fill="#6b7280">Повна ізоляція корпусу усуває короткі замикання</text>

  <!-- ================= PANEL 2: ALLIGATOR CLIP ================= -->
  <rect x="495" y="80" width="435" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="712" y="106" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Затискач «крокодил» (Alligator Clip)</text>

  <rect x="602" y="120" width="220" height="24" rx="12" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="712" y="136" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Hands-free фіксація та силові кола</text>

  <!-- Alligator Clip Graphics -->
  <rect x="525" y="220" width="65" height="20" rx="2" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>

  <path d="M590,212 L665,222 L795,220 L820,222 L820,227 L810,227 L805,223 L800,227 L795,223 L790,227 L665,227 L590,217 Z" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M590,248 L665,238 L795,240 L820,238 L820,233 L810,233 L805,237 L800,233 L795,237 L790,233 L665,233 L590,243 Z" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>

  <path d="M515,210 L665,200 L740,208 L740,252 L665,260 L515,250 Z" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" opacity="0.85"/>

  <circle cx="665" cy="230" r="6" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="815" cy="230" r="7" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.5"/>

  <line x1="815" y1="205" x2="815" y2="218" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="815" y1="255" x2="815" y2="242" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Panel 2 Callout Lines & Labels -->
  <!-- Callout 1 -->
  <polyline points="555,220 555,175 510,175" fill="none" stroke="#1a1a1a" stroke-width="1.2" marker-start="url(#arr)"/>
  <text x="510" y="165" font-size="11" fill="#1a1a1a" text-anchor="start">Гніздо щупа (4 мм банан)</text>

  <!-- Callout 2 -->
  <polyline points="665,224 665,175 680,175" fill="none" stroke="#2457d6" stroke-width="1.2" marker-start="url(#arr-blue)"/>
  <text x="685" y="165" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="start">Вісь та пружина</text>

  <!-- Callout 3 -->
  <polyline points="815,210 815,175 800,175" fill="none" stroke="#c0392b" stroke-width="1.2" marker-start="url(#arr-red)"/>
  <text x="800" y="165" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="start">Тиск F_contact</text>

  <!-- Callout 4 -->
  <polyline points="635,258 635,290 510,290" fill="none" stroke="#c0392b" stroke-width="1.2" marker-start="url(#arr-red)"/>
  <text x="510" y="295" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="start">Ізольована юбка / чохол</text>

  <!-- Callout 5 -->
  <polyline points="815,250 815,290 710,290" fill="none" stroke="#27ae60" stroke-width="1.2" marker-start="url(#arr-green)"/>
  <text x="710" y="295" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="start">Зубчасті губки тиску</text>
  <text x="710" y="310" font-size="11" fill="#6b7280" text-anchor="start">Надійний контакт із виводом</text>

  <!-- Panel 2 Feature Box -->
  <rect x="510" y="345" width="405" height="52" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="520" y="366" font-size="11" font-weight="bold" fill="#1a1a1a">Особливість:</text>
  <text x="600" y="366" font-size="11" fill="#6b7280">Високий притиск та низький опір контакту</text>
  <text x="520" y="386" font-size="11" font-weight="bold" fill="#1a1a1a">Безпека:</text>
  <text x="580" y="386" font-size="11" fill="#6b7280">Подовжена юбка запобігає дуговому пробою</text>
</svg>
