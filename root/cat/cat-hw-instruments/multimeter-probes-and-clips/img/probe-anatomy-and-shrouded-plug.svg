<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Конструкція вимірювального щупа та безпечного штекера</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Елементи електробезпеки: захисний ковпачок CAT III/IV, бар'єр хвату (гарда) та глухий комір 4-мм штекера</text>

  <!-- ================= TOP CALLOUT CARDS ================= -->

  <!-- Card 1: Protective Cap -->
  <rect x="30" y="75" width="200" height="48" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="130" y="94" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">1. Захисний ковпачок</text>
  <text x="130" y="112" font-size="12" fill="#1a1a1a" text-anchor="middle">Виліт наконечника ≤ 4 мм</text>
  <line x1="130" y1="123" x2="77" y2="185" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Card 2: Finger Guard -->
  <rect x="250" y="75" width="200" height="48" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="350" y="94" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">2. Захисна гарда</text>
  <text x="350" y="112" font-size="12" fill="#1a1a1a" text-anchor="middle">Бар'єр проти ковзання руки</text>
  <line x1="350" y1="123" x2="109" y2="148" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Card 3: Insulation & Cable -->
  <rect x="470" y="75" width="220" height="48" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="580" y="94" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">3. Подвійна ізоляція</text>
  <text x="580" y="112" font-size="12" fill="#1a1a1a" text-anchor="middle">Силікон та амортизатор згину</text>
  <line x1="600" y1="123" x2="600" y2="185" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Card 4: Shrouded Plug -->
  <rect x="710" y="75" width="220" height="48" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="820" y="94" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">4. Глухий комір (Shroud)</text>
  <text x="820" y="112" font-size="12" fill="#1a1a1a" text-anchor="middle">Ізольований 4-мм штекер</text>
  <line x1="820" y1="123" x2="805" y2="155" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ================= PROBE ASSEMBLY GRAPHICS ================= -->

  <!-- Probe Tip Needle -->
  <rect x="40" y="197" width="20" height="6" rx="1" fill="#95a5a6" stroke="#7f8c8d"/>
  <text x="50" y="180" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">≤ 4 мм</text>

  <!-- Removable Protective Cap -->
  <rect x="60" y="188" width="35" height="24" rx="3" fill="#c0392b" stroke="#962d22"/>
  <rect x="65" y="191" width="4" height="18" rx="1" fill="#e74c3c"/>

  <!-- Finger Guard Barrier -->
  <rect x="100" y="150" width="18" height="100" rx="4" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="104" y="154" width="10" height="92" rx="2" fill="#3b72f6" opacity="0.6"/>

  <!-- Probe Body Handle -->
  <rect x="118" y="175" width="212" height="50" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Ribbed Grip Texture (Restricted to x=135..165) -->
  <line x1="135" y1="180" x2="135" y2="220" stroke="#475569" stroke-width="3"/>
  <line x1="145" y1="180" x2="145" y2="220" stroke="#475569" stroke-width="3"/>
  <line x1="155" y1="180" x2="155" y2="220" stroke="#475569" stroke-width="3"/>
  <line x1="165" y1="180" x2="165" y2="220" stroke="#475569" stroke-width="3"/>

  <!-- Body Rating Badge (x=190..320, clear of grip lines) -->
  <rect x="190" y="187" width="130" height="26" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="255" y="204" font-size="12" font-weight="bold" fill="#94a3b8" text-anchor="middle">CAT III 1000V</text>

  <!-- Strain Relief Boot 1 -->
  <path d="M330,180 L350,185 L365,190 L380,193 L380,207 L365,210 L350,215 L330,220 Z" fill="#334155" stroke="#1e293b"/>

  <!-- Main Cable -->
  <rect x="380" y="193" width="240" height="14" rx="7" fill="#dc2626" stroke="#991b1b"/>
  <!-- Dedicated Cable Tag -->
  <text x="470" y="162" font-size="12" font-weight="bold" fill="#d97706" text-anchor="middle">Подвійна силіконова ізоляція</text>

  <!-- Strain Relief Boot 2 -->
  <path d="M620,193 L635,190 L650,185 L670,180 L670,220 L650,215 L635,210 L620,207 Z" fill="#334155" stroke="#1e293b"/>

  <!-- Plug Rear Handle -->
  <rect x="670" y="175" width="80" height="50" rx="6" fill="#1e293b" stroke="#0f172a"/>

  <!-- Shrouded Collar (Banana Plug Shield) -->
  <rect x="750" y="160" width="110" height="80" rx="8" fill="#2457d6" stroke="#1d4ed8" stroke-width="2"/>
  <rect x="754" y="164" width="102" height="72" rx="6" fill="#1e40af"/>

  <!-- Recessed 4-mm Pin inside Shroud -->
  <rect x="765" y="193" width="70" height="14" rx="3" fill="#cbd5e1" stroke="#64748b"/>

  <!-- Safety Barrier Line -->
  <line x1="860" y1="145" x2="860" y2="250" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="860" y="268" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">Межа занурення в гніздо</text>

  <!-- ================= BOTTOM SUMMARY PANELS ================= -->

  <!-- Panel A: Tip Safety -->
  <rect x="30" y="285" width="280" height="210" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="310" font-size="13" font-weight="bold" fill="#1a1a1a">1. Захист наконечника (CAT III / IV)</text>
  <text x="45" y="338" font-size="12" fill="#1a1a1a">• Без ковпачка: виліт 19 мм (CAT II)</text>
  <text x="45" y="362" font-size="12" fill="#1a1a1a">• З ковпачком: виліт ≤ 4 мм (CAT III/IV)</text>
  <text x="45" y="386" font-size="12" fill="#1a1a1a">• Усуває міжфазне коротке замикання</text>
  <text x="45" y="410" font-size="12" fill="#1a1a1a">  та дуговий спалах (Arc Flash)</text>

  <rect x="45" y="445" width="250" height="36" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="170" y="467" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Короткий виліт запобігає КЗ</text>

  <!-- Panel B: Handle & Cable Anatomy -->
  <rect x="340" y="285" width="280" height="210" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="355" y="310" font-size="13" font-weight="bold" fill="#1a1a1a">2. Анатомія рукоятки та кабелю</text>
  <text x="355" y="338" font-size="12" fill="#1a1a1a">• Захисна гарда: бар'єр від ковзання</text>
  <text x="355" y="362" font-size="12" fill="#1a1a1a">• Подвійна ізоляція: індикатор зносу</text>
  <text x="355" y="386" font-size="12" fill="#1a1a1a">• Гнучка силіконова оболонка</text>
  <text x="355" y="410" font-size="12" fill="#1a1a1a">• Амортизатор проти перелому жил</text>

  <rect x="355" y="445" width="250" height="36" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="480" y="467" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Подвійний шар сигналізує про знос</text>

  <!-- Panel C: Shrouded Banana Plug -->
  <rect x="650" y="285" width="280" height="210" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="665" y="310" font-size="13" font-weight="bold" fill="#1a1a1a">3. Глухий штекер (Shrouded Plug)</text>
  <text x="665" y="338" font-size="12" fill="#1a1a1a">• Захисний циліндр (комір/shroud)</text>
  <text x="665" y="362" font-size="12" fill="#1a1a1a">• Повністю ховає 4-мм контакт</text>
  <text x="665" y="386" font-size="12" fill="#1a1a1a">• Упереджує ураження струмом</text>
  <text x="665" y="410" font-size="12" fill="#1a1a1a">  під час підключення до приладу</text>

  <rect x="665" y="445" width="250" height="36" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="790" y="467" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Захист від випадкового дотику</text>
</svg>
