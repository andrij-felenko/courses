<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Апаратна архітектура WeAct DLA Mini та потік стримінгу</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Передача цифрових відліків від вхідних 8 каналів через USB 2.0 High-Speed до ОЗП комп'ютера</text>

  <!-- PANEL 1: Input Stage -->
  <rect x="30" y="80" width="260" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="160" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Вхідний тракт сигналів</text>

  <!-- Probes box -->
  <rect x="50" y="125" width="220" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="160" y="148" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Щупи та 10-піновий роз'єм</text>
  <text x="160" y="168" font-size="12" fill="#6b7280" text-anchor="middle">8 сигнальних (CH0–CH7) + 2× GND</text>

  <!-- ESD & Resistors box -->
  <rect x="50" y="210" width="220" height="65" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="160" y="233" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Схема захисту та узгодження</text>
  <text x="160" y="253" font-size="12" fill="#1a1a1a" text-anchor="middle">ESD-діоди + R_in 100 кОм / 10 пФ</text>

  <!-- Buffers & Comparators -->
  <rect x="50" y="300" width="220" height="110" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="160" y="323" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вхідні буфери / Компаратори</text>
  <text x="160" y="345" font-size="12" fill="#6b7280" text-anchor="middle">Пороги V_IL = 0.8 В, V_IH = 2.0 В</text>
  <text x="160" y="365" font-size="12" fill="#27ae60" text-anchor="middle">Сумісність: 1.8В / 3.3В / 5.0В</text>
  <text x="160" y="385" font-size="12" fill="#6b7280" text-anchor="middle">Фіксація битів 0 та 1</text>

  <!-- Internal arrows in Panel 1 -->
  <line x1="160" y1="185" x2="160" y2="210" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <line x1="160" y1="275" x2="160" y2="300" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- PANEL 2: USB Controller / Streamer -->
  <rect x="330" y="80" width="300" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Стримінговий рушій DLA Mini</text>

  <!-- Clock Generator -->
  <rect x="350" y="125" width="260" height="55" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="148" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Тактовий генератор</text>
  <text x="480" y="168" font-size="12" fill="#6b7280" text-anchor="middle">Частота опитування f_s до 24 МГц</text>

  <!-- Hardware FIFO -->
  <rect x="350" y="205" width="260" height="70" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="228" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">8-бітне апаратне FIFO</text>
  <text x="480" y="248" font-size="12" fill="#1a1a1a" text-anchor="middle">Упаковка 8 каналів у 1 байт</text>
  <text x="480" y="264" font-size="12" fill="#6b7280" text-anchor="middle">Кадри 24 МБ/с (24 МГц × 1 байт)</text>

  <!-- USB Controller Engine -->
  <rect x="350" y="300" width="260" height="110" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="323" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">USB 2.0 High-Speed Controller</text>
  <text x="480" y="345" font-size="12" fill="#6b7280" text-anchor="middle">Чип контролера FX2LP / DLA</text>
  <text x="480" y="365" font-size="12" fill="#2457d6" font-weight="bold" text-anchor="middle">Потокова передача без пауз</text>
  <text x="480" y="385" font-size="12" fill="#6b7280" text-anchor="middle">Швидкість шини USB 480 Мбіт/с</text>

  <!-- Internal arrows in Panel 2 -->
  <line x1="480" y1="180" x2="480" y2="205" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <line x1="480" y1="275" x2="480" y2="300" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- PANEL 3: PC Host Subsystem -->
  <rect x="670" y="80" width="260" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="800" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3. Комп'ютер хост (Host PC)</text>

  <!-- USB Driver -->
  <rect x="690" y="125" width="220" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="800" y="148" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Системний драйвер</text>
  <text x="800" y="168" font-size="12" fill="#6b7280" text-anchor="middle">libsigrok / WinUSB / WinUSB-USB2</text>

  <!-- RAM Buffer -->
  <rect x="690" y="205" width="220" height="70" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="800" y="228" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Кільцевий буфер ОЗП ПК</text>
  <text x="800" y="248" font-size="12" fill="#1a1a1a" text-anchor="middle">Необмежений обсяг сесії</text>
  <text x="800" y="264" font-size="12" fill="#6b7280" text-anchor="middle">Збереження мільйонів семплів</text>

  <!-- Decoder & GUI -->
  <rect x="690" y="300" width="220" height="110" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="800" y="323" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ПО PulseView / Sigrok</text>
  <text x="800" y="345" font-size="12" fill="#6b7280" text-anchor="middle">Декодування I2C, SPI, UART</text>
  <text x="800" y="365" font-size="12" fill="#1a1a1a" text-anchor="middle">Візуалізація часових діаграм</text>
  <text x="800" y="385" font-size="12" fill="#6b7280" text-anchor="middle">Вимірювання затримок t_r / t_f</text>

  <!-- Internal arrows in Panel 3 -->
  <line x1="800" y1="185" x2="800" y2="205" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <line x1="800" y1="275" x2="800" y2="300" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- MAIN FLOW ARROWS BETWEEN PANELS -->
  <line x1="270" y1="355" x2="350" y2="355" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="275" y="333" width="70" height="18" fill="#eaf0fd" rx="3"/>
  <text x="310" y="346" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">8 каналів</text>

  <line x1="610" y1="355" x2="690" y2="355" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  <rect x="613" y="333" width="74" height="18" fill="#eaf0fd" rx="3"/>
  <text x="650" y="346" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">USB-потік</text>
</svg>
