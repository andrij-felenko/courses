<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="530" fill="white"/>

  <defs>
    <!-- Markers for arrows -->
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема підключення логічного аналізатора WeAct DLA Mini до шин SPI та I2C</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Паралельне зняття сигналів (пасивний моніторинг) та спільна лінія заземлення GND</text>

  <!-- LEFT PANEL: MCU Master -->
  <rect x="40" y="75" width="190" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <path d="M 41,76 L 229,76 L 229,109 L 41,109 Z" fill="#eaf0fd"/>
  <rect x="40" y="75" width="190" height="430" rx="8" fill="none" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="135" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Мікроконтролер (MCU)</text>

  <!-- MCU Pins & Labels -->
  <text x="55" y="149" font-size="12" font-weight="bold" fill="#1a1a1a">GND (Маса)</text>
  <circle cx="230" cy="145" r="4" fill="#1a1a1a"/>

  <text x="55" y="174" font-size="12" fill="#2457d6">CS (GPIO)</text>
  <circle cx="230" cy="170" r="4" fill="#2457d6"/>

  <text x="55" y="199" font-size="12" fill="#2457d6">SPI_SCK</text>
  <circle cx="230" cy="195" r="4" fill="#2457d6"/>

  <text x="55" y="224" font-size="12" fill="#2457d6">SPI_MOSI</text>
  <circle cx="230" cy="220" r="4" fill="#2457d6"/>

  <text x="55" y="249" font-size="12" fill="#2457d6">SPI_MISO</text>
  <circle cx="230" cy="245" r="4" fill="#2457d6"/>

  <text x="55" y="279" font-size="12" fill="#27ae60">I2C_SCL</text>
  <circle cx="230" cy="275" r="4" fill="#27ae60"/>

  <text x="55" y="304" font-size="12" fill="#27ae60">I2C_SDA</text>
  <circle cx="230" cy="300" r="4" fill="#27ae60"/>

  <text x="55" y="470" font-size="12" fill="#6b7280">VCC (3.3В / 5В)</text>

  <!-- RIGHT PANEL 1: SPI Peripheral -->
  <rect x="740" y="85" width="180" height="180" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="830" y="106" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">SPI Периферія</text>
  <text x="830" y="122" text-anchor="middle" font-size="12" fill="#6b7280">(Flash / TFT Дисплей)</text>
  <circle cx="740" cy="145" r="4" fill="#1a1a1a"/>
  <text x="755" y="149" font-size="12" fill="#1a1a1a">GND</text>
  <circle cx="740" cy="170" r="4" fill="#2457d6"/>
  <text x="755" y="174" font-size="12" fill="#2457d6">CS</text>
  <circle cx="740" cy="195" r="4" fill="#2457d6"/>
  <text x="755" y="199" font-size="12" fill="#2457d6">SCK</text>
  <circle cx="740" cy="220" r="4" fill="#2457d6"/>
  <text x="755" y="224" font-size="12" fill="#2457d6">MOSI</text>
  <circle cx="740" cy="245" r="4" fill="#2457d6"/>
  <text x="755" y="249" font-size="12" fill="#2457d6">MISO</text>

  <!-- RIGHT PANEL 2: I2C Peripheral -->
  <rect x="740" y="275" width="180" height="140" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="830" y="295" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">I2C Датчик / RTC</text>
  <text x="830" y="310" text-anchor="middle" font-size="12" fill="#6b7280">(Pull-Up 4.7 кОм)</text>

  <circle cx="740" cy="330" r="4" fill="#27ae60"/>
  <text x="755" y="334" font-size="12" fill="#27ae60">SCL</text>

  <circle cx="740" cy="360" r="4" fill="#27ae60"/>
  <text x="755" y="364" font-size="12" fill="#27ae60">SDA</text>

  <circle cx="740" cy="390" r="4" fill="#1a1a1a"/>
  <text x="755" y="394" font-size="12" fill="#1a1a1a">GND</text>

  <!-- HORIZONTAL BUS LINES (MCU -> Peripherals) -->
  <!-- 1. GND Line -->
  <path d="M 230 145 L 740 145 M 720 145 L 720 390 L 740 390" stroke="#1a1a1a" stroke-width="2.5" fill="none"/>
  <text x="240" y="138" font-size="12" font-weight="bold" fill="#1a1a1a">GND</text>

  <!-- 2. SPI CS Line -->
  <line x1="230" y1="170" x2="740" y2="170" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="240" y="163" font-size="12" fill="#2457d6">CS</text>

  <!-- 3. SPI SCK Line -->
  <line x1="230" y1="195" x2="740" y2="195" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="240" y="188" font-size="12" fill="#2457d6">SCK</text>

  <!-- 4. SPI MOSI Line -->
  <line x1="230" y1="220" x2="740" y2="220" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="240" y="213" font-size="12" fill="#2457d6">MOSI</text>

  <!-- 5. SPI MISO Line -->
  <line x1="230" y1="245" x2="740" y2="245" stroke="#2457d6" stroke-width="2"/>
  <text x="240" y="238" font-size="12" fill="#2457d6">MISO</text>

  <!-- 6. I2C SCL Line -->
  <path d="M 230 275 L 710 275 L 710 330 L 740 330" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>
  <text x="240" y="268" font-size="12" fill="#27ae60">SCL</text>

  <!-- 7. I2C SDA Line -->
  <path d="M 230 300 L 700 300 L 700 360 L 740 360" stroke="#27ae60" stroke-width="2" fill="none"/>
  <text x="240" y="293" font-size="12" fill="#27ae60">SDA</text>

  <!-- VERTICAL TAP LINES (Bus T-Junctions -> DLA Mini Inputs) -->
  <!-- GND Tap -->
  <line x1="310" y1="145" x2="310" y2="350" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="4,3"/>
  <circle cx="310" cy="145" r="3.5" fill="#1a1a1a"/>

  <!-- CS Tap -->
  <line x1="350" y1="170" x2="350" y2="350" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="350" cy="170" r="3.5" fill="#2457d6"/>

  <!-- SCK Tap -->
  <line x1="390" y1="195" x2="390" y2="350" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="390" cy="195" r="3.5" fill="#2457d6"/>

  <!-- MOSI Tap -->
  <line x1="430" y1="220" x2="430" y2="350" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="430" cy="220" r="3.5" fill="#2457d6"/>

  <!-- MISO Tap -->
  <line x1="470" y1="245" x2="470" y2="350" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="470" cy="245" r="3.5" fill="#2457d6"/>

  <!-- SCL Tap -->
  <line x1="510" y1="275" x2="510" y2="350" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="510" cy="275" r="3.5" fill="#27ae60"/>

  <!-- SDA Tap -->
  <line x1="550" y1="300" x2="550" y2="350" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="550" cy="300" r="3.5" fill="#27ae60"/>

  <!-- BOTTOM PANEL: WeAct DLA Mini Analyzer -->
  <rect x="290" y="350" width="380" height="155" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="480" y="372" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">WeAct DLA Mini (24 МГц / 8 каналів)</text>
  <text x="480" y="390" text-anchor="middle" font-size="12" fill="#6b7280">Пасивний вхідний опір &gt; 100 кОм | ПО PulseView</text>

  <!-- Connectors Header Dots & Labels inside DLA Mini -->
  <circle cx="310" cy="350" r="4" fill="#1a1a1a"/>
  <circle cx="350" cy="350" r="3.5" fill="#2457d6"/>
  <circle cx="390" cy="350" r="3.5" fill="#2457d6"/>
  <circle cx="430" cy="350" r="3.5" fill="#2457d6"/>
  <circle cx="470" cy="350" r="3.5" fill="#2457d6"/>
  <circle cx="510" cy="350" r="3.5" fill="#27ae60"/>
  <circle cx="550" cy="350" r="3.5" fill="#27ae60"/>

  <rect x="305" y="405" width="350" height="75" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="480" y="424" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Спільна маса GND — запобігання земляним петлям</text>
  <text x="480" y="444" text-anchor="middle" font-size="12" fill="#27ae60">F_sample ≥ 4...5 × F_bus | Тригер по CS / START</text>
  <text x="480" y="464" text-anchor="middle" font-size="12" fill="#2457d6">Декодування протоколів у ПО PulseView (sigrok)</text>

  <!-- USB Connector -->
  <rect x="440" y="505" width="80" height="15" rx="3" fill="#334155"/>
  <text x="480" y="517" text-anchor="middle" font-size="12" fill="#ffffff">USB до ПК</text>
</svg>
