<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часові діаграми та стекові декодери протоколів у PulseView</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Візуалізація сигналів I2C та SPI з декодуванням пакетів низького й вищого рівнів</text>

  <!-- Головна панель інтерфейсу PulseView -->
  <rect x="30" y="75" width="900" height="445" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>

  <!-- Панель керування (Toolbar) -->
  <rect x="30" y="75" width="900" height="32" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="45" y="96" font-size="12" font-weight="bold" fill="#2457d6">PulseView 0.5 (sigrok)</text>
  <text x="230" y="96" font-size="12" fill="#1a1a1a">Пристрій: WeAct DLA Mini (8 ch, 24 MHz)</text>
  <text x="530" y="96" font-size="12" fill="#6b7280">Частота: 24 МГц</text>
  <text x="770" y="96" font-size="12" font-weight="bold" fill="#2457d6">● Запис (Run)</text>

  <!-- Шкала часу (Timeline Ruler) -->
  <line x1="180" y1="132" x2="910" y2="132" stroke="#d0d7de" stroke-width="1"/>
  <!-- Засічки та часові мітки -->
  <line x1="200" y1="126" x2="200" y2="132" stroke="#6b7280" stroke-width="1"/>
  <text x="200" y="122" font-size="11" fill="#6b7280" text-anchor="middle">0.0 µs</text>

  <line x1="310" y1="126" x2="310" y2="132" stroke="#6b7280" stroke-width="1"/>
  <text x="310" y="122" font-size="11" fill="#6b7280" text-anchor="middle">10.0 µs</text>

  <line x1="420" y1="126" x2="420" y2="132" stroke="#6b7280" stroke-width="1"/>
  <text x="420" y="122" font-size="11" fill="#6b7280" text-anchor="middle">20.0 µs</text>

  <line x1="530" y1="126" x2="530" y2="132" stroke="#6b7280" stroke-width="1"/>
  <text x="530" y="122" font-size="11" fill="#6b7280" text-anchor="middle">30.0 µs</text>

  <line x1="640" y1="126" x2="640" y2="132" stroke="#6b7280" stroke-width="1"/>
  <text x="640" y="122" font-size="11" fill="#6b7280" text-anchor="middle">40.0 µs</text>

  <line x1="750" y1="126" x2="750" y2="132" stroke="#6b7280" stroke-width="1"/>
  <text x="750" y="122" font-size="11" fill="#6b7280" text-anchor="middle">50.0 µs</text>

  <line x1="860" y1="126" x2="860" y2="132" stroke="#6b7280" stroke-width="1"/>
  <text x="860" y="122" font-size="11" fill="#6b7280" text-anchor="middle">60.0 µs</text>

  <!-- РЯДОК 1: D0 I2C SCL -->
  <rect x="40" y="148" width="130" height="24" rx="3" fill="#2457d6"/>
  <text x="105" y="164" font-size="12" font-weight="bold" fill="white" text-anchor="middle">D0: I2C SCL</text>

  <path d="M 180 152 L 220 152 L 220 168 L 230 168 L 230 152 L 240 152 L 240 168 L 250 168 L 250 152 L 260 152 L 260 168 L 270 168 L 270 152 L 280 152 L 280 168 L 290 168 L 290 152 L 300 152 L 300 168 L 310 168 L 310 152 L 320 152 L 320 168 L 330 168 L 330 152 L 340 152 L 340 168 L 350 168 L 350 152 L 360 152 L 360 168 L 370 168 L 370 152 L 380 152 L 380 168 L 390 168 L 390 152 L 400 152 L 400 168 L 410 168 L 410 152 L 420 152 L 420 168 L 430 168 L 430 152 L 440 152 L 440 168 L 450 168 L 450 152 L 460 152 L 460 168 L 470 168 L 470 152 L 480 152 L 480 168 L 490 168 L 490 152 L 500 152 L 500 168 L 510 168 L 510 152 L 520 152 L 520 168 L 530 168 L 530 152 L 540 152 L 540 168 L 550 168 L 550 152 L 560 152 L 560 168 L 570 168 L 570 152 L 580 152 L 580 168 L 590 168 L 590 152 L 600 152 L 910 152" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- РЯДОК 2: D1 I2C SDA -->
  <rect x="40" y="188" width="130" height="24" rx="3" fill="#2457d6"/>
  <text x="105" y="204" font-size="12" font-weight="bold" fill="white" text-anchor="middle">D1: I2C SDA</text>

  <path d="M 180 192 L 205 192 L 205 208 L 225 208 L 225 192 L 245 192 L 245 208 L 265 208 L 265 192 L 285 192 L 285 208 L 380 208 L 380 208 L 400 208 L 465 208 L 465 192 L 485 192 L 485 208 L 565 208 L 565 208 L 595 208 L 595 192 L 910 192" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- РЯДОК 3: I2C Декодер рівень 1 (Protocol) -->
  <rect x="40" y="228" width="130" height="24" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="105" y="244" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">I2C (Protocol)</text>

  <!-- Декодовані елементи I2C -->
  <rect x="195" y="231" width="25" height="18" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="207.5" y="244" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">S</text>

  <rect x="225" y="231" width="150" height="18" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="300" y="244" font-size="11" fill="#2457d6" text-anchor="middle">Address: 0x50 (Write)</text>

  <rect x="380" y="231" width="25" height="18" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="392.5" y="244" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">A</text>

  <rect x="410" y="231" width="140" height="18" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="244" font-size="11" fill="#2457d6" text-anchor="middle">Data: 0x10 (Reg)</text>

  <rect x="555" y="231" width="25" height="18" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="567.5" y="244" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">A</text>

  <rect x="590" y="231" width="25" height="18" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="602.5" y="244" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">P</text>

  <!-- РЯДОК 4: EEPROM Декодер рівень 2 (Stacked) -->
  <rect x="40" y="268" width="130" height="24" rx="3" fill="#27ae60"/>
  <text x="105" y="284" font-size="11" font-weight="bold" fill="white" text-anchor="middle">EEPROM (Stacked)</text>

  <rect x="225" y="270" width="390" height="20" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="420" y="284" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Write Register 0x10 → Memory Address Set</text>

  <!-- Розділювальна пунктирна лінія -->
  <line x1="40" y1="308" x2="910" y2="308" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- РЯДОК 5: D2 SPI CS# -->
  <rect x="40" y="323" width="130" height="24" rx="3" fill="#2457d6"/>
  <text x="105" y="339" font-size="12" font-weight="bold" fill="white" text-anchor="middle">D2: SPI CS#</text>

  <path d="M 180 327 L 630 327 L 630 343 L 885 343 L 885 327 L 910 327" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- РЯДОК 6: D3 SPI SCLK -->
  <rect x="40" y="363" width="130" height="24" rx="3" fill="#2457d6"/>
  <text x="105" y="379" font-size="12" font-weight="bold" fill="white" text-anchor="middle">D3: SPI SCLK</text>

  <path d="M 180 379 L 640 379 L 640 363 L 650 363 L 650 379 L 660 379 L 660 363 L 670 363 L 670 379 L 680 379 L 680 363 L 690 363 L 690 379 L 700 379 L 700 363 L 710 363 L 710 379 L 720 379 L 720 363 L 730 363 L 730 379 L 740 379 L 740 363 L 750 363 L 750 379 L 760 379 L 760 363 L 770 363 L 770 379 L 780 379 L 780 363 L 790 363 L 790 379 L 800 379 L 800 363 L 810 363 L 810 379 L 820 379 L 820 363 L 830 363 L 830 379 L 840 379 L 840 363 L 850 363 L 850 379 L 860 379 L 860 363 L 875 363 L 875 379 L 910 379" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- РЯДОК 7: D4 SPI MOSI -->
  <rect x="40" y="403" width="130" height="24" rx="3" fill="#2457d6"/>
  <text x="105" y="419" font-size="12" font-weight="bold" fill="white" text-anchor="middle">D4: SPI MOSI</text>

  <path d="M 180 419 L 640 419 L 640 419 L 710 419 L 710 403 L 735 403 L 735 419 L 785 419 L 785 403 L 835 403 L 835 419 L 875 419 L 910 419" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- РЯДОК 8: SPI Декодер рівень 1 (Protocol) -->
  <rect x="40" y="443" width="130" height="24" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="105" y="459" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">SPI (Protocol)</text>

  <rect x="640" y="446" width="100" height="18" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="690" y="459" font-size="11" fill="#2457d6" text-anchor="middle">Cmd: 0x03 (Read)</text>

  <rect x="745" y="446" width="130" height="18" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="810" y="459" font-size="11" fill="#2457d6" text-anchor="middle">Addr: 0x00A0</text>

  <!-- РЯДОК 9: Flash Декодер рівень 2 (Stacked) -->
  <rect x="40" y="483" width="130" height="24" rx="3" fill="#27ae60"/>
  <text x="105" y="499" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Flash (Stacked)</text>

  <rect x="640" y="486" width="235" height="18" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="757.5" y="499" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">READ Flash Array @ 0x00A0</text>
</svg>
