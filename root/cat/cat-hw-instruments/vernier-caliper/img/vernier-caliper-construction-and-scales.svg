<svg width="960" height="560" viewBox="0 0 960 560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Header -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Будова штангенциркуля та принцип зчитування шкал ноніуса</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Дробова частка розміру визначається за порядковим номером штриха ноніуса, що точно збігається зі штрихом штанги</text>

  <!-- Top Panel: Caliper Construction -->
  <rect x="30" y="75" width="900" height="220" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="96" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Основні конструктивні елементи та вимірювальні поверхні</text>

  <!-- Caliper Drawings -->
  <!-- Beam (drawn as path to avoid rect overlap) -->
  <path d="M 120 160 H 760 V 195 H 120 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  
  <!-- Fixed Jaws (Left) -->
  <path d="M 120 195 L 120 255 L 145 255 L 155 195 Z" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <path d="M 120 160 L 120 115 L 140 115 L 145 160 Z" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>

  <!-- Movable Slider Frame & Jaws -->
  <rect x="320" y="145" width="130" height="65" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M 320 210 L 320 255 L 345 255 L 355 210 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M 320 145 L 320 115 L 340 115 L 345 145 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M 377 132 H 393 A 2 2 0 0 1 395 134 V 143 A 2 2 0 0 1 393 145 H 377 A 2 2 0 0 1 375 143 V 134 A 2 2 0 0 1 377 132 Z" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>

  <!-- Depth Rod (drawn as path) -->
  <path d="M 760 174 H 890 V 181 H 760 Z" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>

  <!-- Top Panel Labels -->
  <text x="230" y="108" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Губки для внутрішніх вимірювань</text>
  
  <text x="235" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Губки для зовнішніх вимірювань</text>
  
  <text x="550" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#475569">Штанга з основною шкалою (1 мм)</text>
  
  <!-- Movable frame label positioned clear of lower jaw path -->
  <text x="470" y="220" font-size="12" font-weight="bold" fill="#2457d6">Рухома рамка з ноніусом</text>
  <line x1="465" y1="216" x2="445" y2="185" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="440" y="125" font-size="12" fill="#475569">Стопорний гвинт</text>

  <text x="825" y="162" text-anchor="middle" font-size="12" font-weight="bold" fill="#1e293b">Щуп глибиноміра</text>

  <!-- Bottom Panel: Vernier Scale Principle -->
  <rect x="30" y="310" width="900" height="230" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="332" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Принцип зчитування розміру: L = L_ціле + (n × i)</text>

  <!-- Enlarged Main Scale (White Bar) -->
  <rect x="100" y="355" width="760" height="40" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Main Scale Ticks -->
  <line x1="140" y1="355" x2="140" y2="375" stroke="#1e293b" stroke-width="1.5"/>
  <text x="140" y="350" text-anchor="middle" font-size="12" fill="#475569">0</text>

  <line x1="340" y1="355" x2="340" y2="375" stroke="#1e293b" stroke-width="1.5"/>
  <text x="340" y="350" text-anchor="middle" font-size="12" fill="#475569">10</text>

  <line x1="380" y1="355" x2="380" y2="370" stroke="#2457d6" stroke-width="2"/>
  <text x="380" y="350" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">12</text>

  <line x1="540" y1="355" x2="540" y2="375" stroke="#1e293b" stroke-width="1.5"/>
  <text x="540" y="350" text-anchor="middle" font-size="12" fill="#475569">20</text>

  <line x1="740" y1="355" x2="740" y2="375" stroke="#1e293b" stroke-width="1.5"/>
  <text x="740" y="350" text-anchor="middle" font-size="12" fill="#475569">30</text>

  <line x1="780" y1="355" x2="780" y2="375" stroke="#27ae60" stroke-width="2"/>

  <!-- Vernier Scale Slider (Blue Tinted Bar) -->
  <rect x="375" y="395" width="455" height="45" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  
  <!-- Vernier Ticks -->
  <line x1="388" y1="395" x2="388" y2="418" stroke="#2457d6" stroke-width="2"/>
  <text x="388" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">0</text>

  <line x1="584" y1="395" x2="584" y2="415" stroke="#475569" stroke-width="1"/>
  <text x="584" y="432" text-anchor="middle" font-size="12" fill="#475569">10</text>

  <line x1="780" y1="395" x2="780" y2="422" stroke="#27ae60" stroke-width="2.5"/>
  <text x="780" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">20</text>

  <!-- Match Highlight Box (drawn as path to avoid rect overlap) -->
  <path d="M 771 352 H 789 A 3 3 0 0 1 792 355 V 439 A 3 3 0 0 1 789 442 H 771 A 3 3 0 0 1 768 439 V 355 A 3 3 0 0 1 771 352 Z" fill="none" stroke="#27ae60" stroke-width="2"/>

  <!-- Bottom Panel Annotations -->
  <line x1="388" y1="440" x2="388" y2="475" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="2,2"/>
  <text x="320" y="470" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">1. Цілі мм за нулем ноніуса: 12 мм</text>

  <text x="780" y="470" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">2. Точний збіг штриха №20: 20 × 0.02 = 0.40 мм</text>

  <!-- Total Summary Box -->
  <rect x="230" y="490" width="500" height="30" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="510" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Підсумковий виміряний розмір: L = 12 мм + 0.40 мм = 12.40 мм</text>
</svg>
