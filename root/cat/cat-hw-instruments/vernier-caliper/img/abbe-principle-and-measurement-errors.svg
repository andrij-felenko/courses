<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Black arrow -->
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <!-- Blue arrow -->
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <!-- Red arrow -->
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <!-- Green arrow -->
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принцип Аббе та джерела вимірювальних похибок</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Зміщення вимірювальної осі на відстань d від штанги створює кутовий перекіс θ та похибку ΔL = d · sin(θ)</text>

  <!-- LEFT PANEL: Abbe Principle Satisfied -->
  <rect x="40" y="75" width="410" height="355" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="60" y="90" width="370" height="30" rx="4" fill="#27ae60"/>
  <text x="245" y="110" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Дотримання принципу Аббе (Осі збігаються)</text>

  <!-- Left Diagram Graphics -->
  <text x="245" y="165" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Спільна вісь штанги та вимірювання</text>

  <!-- Coaxial Axis Line -->
  <line x1="65" y1="230" x2="395" y2="230" stroke="#27ae60" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Fixed Anvil -->
  <rect x="90" y="195" width="25" height="70" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Measured Object -->
  <rect x="115" y="205" width="150" height="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="2"/>
  <text x="190" y="280" font-size="12" fill="#2457d6" text-anchor="middle">Вимірюваний об'єкт L</text>

  <!-- Moving Spindle -->
  <rect x="265" y="215" width="100" height="30" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Force Arrow F -->
  <line x1="380" y1="230" x2="340" y2="230" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="365" y="215" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Зусилля F</text>

  <text x="245" y="315" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Плече зміщення d = 0</text>

  <!-- Left Result Box -->
  <rect x="60" y="340" width="370" height="70" rx="6" fill="white" stroke="#27ae60" stroke-width="1.2"/>
  <text x="245" y="365" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Осі шкали та вимірювання збігаються (d = 0)</text>
  <text x="245" y="390" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Момент перекосу M = 0  ⇒  Похибка ΔL = 0</text>


  <!-- RIGHT PANEL: Abbe Principle Violated -->
  <rect x="480" y="75" width="440" height="355" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="500" y="90" width="400" height="30" rx="4" fill="#c0392b"/>
  <text x="700" y="110" font-size="14" font-weight="bold" fill="white" text-anchor="middle">Порушення принципу Аббе (Штангенциркуль)</text>

  <!-- Right Diagram Graphics -->
  <!-- Main Beam (Штанга) -->
  <rect x="520" y="150" width="370" height="22" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5" rx="2"/>

  <!-- Scale Axis Line -->
  <line x1="510" y1="161" x2="900" y2="161" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="795" y="142" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Лінія штанги (шкала)</text>

  <!-- Fixed Jaw (Нерухома губка) -->
  <path d="M 570 172 L 570 295 L 590 295 L 600 172 Z" fill="#eaf0fd" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Tilted Movable Jaw (Рухома губка з перекосом) -->
  <path d="M 720 144 L 770 146 L 766 174 L 750 298 L 730 297 L 748 174 Z" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Measurement Axis Line -->
  <line x1="510" y1="265" x2="900" y2="265" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="825" y="283" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Вимірювальна вісь</text>

  <!-- Offset Arm d Dimension -->
  <line x1="540" y1="161" x2="540" y2="265" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-black)" marker-end="url(#arr-black)"/>
  <text x="525" y="218" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Плече d</text>

  <!-- Measured Object between jaws -->
  <rect x="590" y="240" width="138" height="40" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="2"/>

  <!-- Force Arrow F -->
  <line x1="830" y1="265" x2="770" y2="265" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="800" y="250" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Зусилля F</text>

  <!-- Tilt Angle Arc & Label -->
  <path d="M 764 175 A 25 25 0 0 1 773 190" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <text x="775" y="195" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">Кут перекосу θ</text>

  <!-- Error Delta L Dimension Callout -->
  <line x1="728" y1="298" x2="728" y2="320" stroke="#c0392b" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="742" y1="298" x2="742" y2="320" stroke="#c0392b" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="728" y1="312" x2="742" y2="312" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-red)" marker-end="url(#arr-red)"/>
  <text x="740" y="328" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Похибка ΔL</text>

  <!-- Right Result Box -->
  <rect x="500" y="340" width="400" height="70" rx="6" fill="white" stroke="#c0392b" stroke-width="1.2"/>
  <text x="700" y="365" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Зусилля F створює згинайний момент M = F · d</text>
  <text x="700" y="390" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Люфт у рамці спричиняє похибку ΔL ≈ d · sin(θ)</text>
</svg>
