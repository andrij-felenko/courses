<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принцип суміщення штрихів шкали ноніуса</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Зсув у 0.1 мм перетворюється на точний візуальний збіг штриха ноніуса зі штрихом штанги</text>

  <!-- Match Badge Callout at Top -->
  <rect x="200" y="64" width="140" height="26" fill="#27ae60" rx="4"/>
  <text x="270" y="81" font-size="12" font-weight="bold" fill="white" text-anchor="middle">ЗБІГ: штрих №1</text>

  <!-- Main Scale Beam -->
  <rect x="50" y="102" width="860" height="83" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="895" y="118" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="end">Основна штанга (s = 1.0 мм)</text>

  <!-- Nested Green Highlight Rect in Main Beam -->
  <rect x="256" y="106" width="28" height="75" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3" rx="4"/>

  <!-- Main Scale Baseline -->
  <line x1="60" y1="175" x2="900" y2="175" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Main Ticks & Labels -->
  <line x1="120" y1="145" x2="120" y2="175" stroke="#1a1a1a" stroke-width="2"/>
  <text x="120" y="134" font-size="12" fill="#1a1a1a" text-anchor="middle">0</text>

  <line x1="170" y1="155" x2="170" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="170" y="134" font-size="12" fill="#1a1a1a" text-anchor="middle">1</text>

  <line x1="220" y1="145" x2="220" y2="175" stroke="#1a1a1a" stroke-width="2"/>
  <text x="220" y="134" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2 мм</text>

  <line x1="270" y1="142" x2="270" y2="175" stroke="#27ae60" stroke-width="2.5"/>
  <text x="270" y="134" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">3</text>

  <line x1="320" y1="155" x2="320" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="320" y="134" font-size="12" fill="#1a1a1a" text-anchor="middle">4</text>

  <line x1="370" y1="145" x2="370" y2="175" stroke="#1a1a1a" stroke-width="2"/>
  <text x="370" y="134" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">5 мм</text>

  <line x1="420" y1="155" x2="420" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="420" y="134" font-size="12" fill="#1a1a1a" text-anchor="middle">6</text>

  <line x1="470" y1="155" x2="470" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="470" y="134" font-size="12" fill="#1a1a1a" text-anchor="middle">7</text>

  <line x1="520" y1="155" x2="520" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="520" y="134" font-size="12" fill="#1a1a1a" text-anchor="middle">8</text>

  <line x1="570" y1="155" x2="570" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="570" y="134" font-size="12" fill="#1a1a1a" text-anchor="middle">9</text>

  <line x1="620" y1="145" x2="620" y2="175" stroke="#1a1a1a" stroke-width="2"/>
  <text x="620" y="134" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">10 мм</text>

  <line x1="670" y1="155" x2="670" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="670" y="134" font-size="12" fill="#1a1a1a" text-anchor="middle">11</text>

  <line x1="720" y1="145" x2="720" y2="175" stroke="#1a1a1a" stroke-width="2"/>
  <text x="720" y="134" font-size="12" fill="#1a1a1a" text-anchor="middle">12</text>

  <!-- Vernier Scale Frame -->
  <rect x="175" y="195" width="735" height="83" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="895" y="266" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">Шкала ноніуса (s' = 0.9 мм, i = 0.1 мм)</text>

  <!-- Nested Green Highlight Rect in Vernier Frame -->
  <rect x="256" y="199" width="28" height="75" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3" rx="4"/>

  <!-- Nested Red Gap Highlight Rect at Vernier 0 -->
  <rect x="219" y="197" width="7" height="30" fill="#fdecea" stroke="#c0392b" stroke-width="1.2" rx="2"/>

  <!-- Vernier Scale Baseline -->
  <line x1="180" y1="195" x2="900" y2="195" stroke="#2457d6" stroke-width="2"/>

  <!-- Vernier Ticks (k=0..10) & Labels -->
  <line x1="225" y1="195" x2="225" y2="222" stroke="#c0392b" stroke-width="2"/>
  <text x="225" y="244" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">0</text>

  <line x1="270" y1="195" x2="270" y2="228" stroke="#27ae60" stroke-width="2.5"/>
  <text x="270" y="244" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">1</text>

  <line x1="315" y1="195" x2="315" y2="212" stroke="#2457d6" stroke-width="1.5"/>
  <text x="315" y="244" font-size="12" fill="#2457d6" text-anchor="middle">2</text>

  <line x1="360" y1="195" x2="360" y2="212" stroke="#2457d6" stroke-width="1.5"/>
  <text x="360" y="244" font-size="12" fill="#2457d6" text-anchor="middle">3</text>

  <line x1="405" y1="195" x2="405" y2="212" stroke="#2457d6" stroke-width="1.5"/>
  <text x="405" y="244" font-size="12" fill="#2457d6" text-anchor="middle">4</text>

  <line x1="450" y1="195" x2="450" y2="222" stroke="#2457d6" stroke-width="2"/>
  <text x="450" y="244" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">5</text>

  <line x1="495" y1="195" x2="495" y2="212" stroke="#2457d6" stroke-width="1.5"/>
  <text x="495" y="244" font-size="12" fill="#2457d6" text-anchor="middle">6</text>

  <line x1="540" y1="195" x2="540" y2="212" stroke="#2457d6" stroke-width="1.5"/>
  <text x="540" y="244" font-size="12" fill="#2457d6" text-anchor="middle">7</text>

  <line x1="585" y1="195" x2="585" y2="212" stroke="#2457d6" stroke-width="1.5"/>
  <text x="585" y="244" font-size="12" fill="#2457d6" text-anchor="middle">8</text>

  <line x1="630" y1="195" x2="630" y2="212" stroke="#2457d6" stroke-width="1.5"/>
  <text x="630" y="244" font-size="12" fill="#2457d6" text-anchor="middle">9</text>

  <line x1="675" y1="195" x2="675" y2="222" stroke="#2457d6" stroke-width="2"/>
  <text x="675" y="244" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">10</text>

  <!-- Gap Callout for Zero Offset -->
  <rect x="50" y="295" width="180" height="44" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="4"/>
  <text x="140" y="313" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Зсув Δx = 0.1 мм</text>
  <text x="140" y="330" font-size="11" fill="#6b7280" text-anchor="middle">(відлічується від 2.0 мм)</text>
  <line x1="222.5" y1="228" x2="218" y2="293" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>

  <!-- Left Calculation Summary Panel -->
  <rect x="50" y="355" width="480" height="85" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="70" y="376" font-size="13" font-weight="bold" fill="#1a1a1a">Рівняння виміряного розміру:</text>
  <text x="70" y="401" font-size="14" font-weight="bold" fill="#2457d6">M = N_main · s + k · i = 2.0 мм + 1 · 0.1 мм = 2.1 мм</text>
  <text x="70" y="424" font-size="11" fill="#6b7280">N_main = 2 мм (ціла частина)  |  k = 1 (номер збігу)  |  i = 0.1 мм (ціна поділки)</text>

  <!-- Right Explanation Card -->
  <rect x="550" y="355" width="360" height="85" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="8"/>
  <text x="730" y="376" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Фізична суть суміщення:</text>
  <text x="730" y="399" font-size="12" fill="#1a1a1a" text-anchor="middle">Кожен наступний штрих ноніуса менший на i = 0.1 мм.</text>
  <text x="730" y="419" font-size="12" fill="#1a1a1a" text-anchor="middle">Збіг штриха №1 означає дробову добавку саме 0.1 мм.</text>
</svg>
