<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Markers -->
  <defs>
    <marker id="arr-black" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-black-rev" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-red-rev" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Геометрична модель похибки Аббе та кутового перекосу рамки</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Позаосьове зусилля F утворює момент, що повертає рамку на кут θ і створює синусну похибку Δx = L · sin θ</text>

  <!-- Main Scale Axis (Blue dashed line top) -->
  <line x1="40" y1="150" x2="610" y2="150" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="50" y="115" text-anchor="start" font-size="12" fill="#2457d6" font-weight="bold">Вісь шкали (базовий вимір)</text>

  <!-- Main Beam (Штанга) -->
  <rect x="50" y="130" width="560" height="40" rx="2" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <!-- Beam Scale Ticks -->
  <line x1="90" y1="130" x2="90" y2="140" stroke="#6b7280" stroke-width="1"/>
  <line x1="110" y1="130" x2="110" y2="137" stroke="#6b7280" stroke-width="1"/>
  <line x1="130" y1="130" x2="130" y2="137" stroke="#6b7280" stroke-width="1"/>
  <line x1="150" y1="130" x2="150" y2="137" stroke="#6b7280" stroke-width="1"/>
  <line x1="170" y1="130" x2="170" y2="137" stroke="#6b7280" stroke-width="1"/>
  <line x1="190" y1="130" x2="190" y2="140" stroke="#6b7280" stroke-width="1"/>
  <line x1="210" y1="130" x2="210" y2="137" stroke="#6b7280" stroke-width="1"/>
  <line x1="230" y1="130" x2="230" y2="137" stroke="#6b7280" stroke-width="1"/>
  <line x1="250" y1="130" x2="250" y2="137" stroke="#6b7280" stroke-width="1"/>
  <line x1="270" y1="130" x2="270" y2="137" stroke="#6b7280" stroke-width="1"/>
  <line x1="290" y1="130" x2="290" y2="140" stroke="#6b7280" stroke-width="1"/>

  <!-- Fixed Jaw (Нерухома губка) -->
  <polygon points="50,130 50,390 75,390 85,170 85,130" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Nominal Position Outline (Dashed Grey) -->
  <rect x="310" y="120" width="100" height="60" rx="2" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="310" y1="180" x2="310" y2="390" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Deflected Slider Frame & Jaw (Red accent) -->
  <polygon points="310,120 410,126 406,186 306,180" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <polygon points="306,180 326,180 361,390 341,390" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>

  <!-- Gap / Clearance g Arrow at Top Guide -->
  <line x1="410" y1="110" x2="410" y2="124" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="380" y="98" text-anchor="start" font-size="12" fill="#c0392b" font-weight="bold">Зазор g (напрямна)</text>

  <!-- Tilt Angle θ Arc -->
  <path d="M 310,230 A 50,50 0 0,0 318,229" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="350" y="215" text-anchor="start" font-size="13" font-weight="bold" fill="#c0392b">θ (кут перекосу)</text>

  <!-- Extension Reference Line (Nominal Vertical) -->
  <line x1="310" y1="390" x2="310" y2="425" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="345" y1="390" x2="345" y2="425" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Error Δx Dimension Line -->
  <line x1="310" y1="415" x2="345" y2="415" stroke="#c0392b" stroke-width="2" marker-start="url(#arr-red-rev)" marker-end="url(#arr-red)"/>
  <text x="337" y="455" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Δx = L · sin θ</text>

  <!-- Measuring Axis (Blue dashed line bottom) -->
  <line x1="40" y1="390" x2="610" y2="390" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="50" y="430" text-anchor="start" font-size="12" fill="#2457d6" font-weight="bold">Вісь вимірювання (на контактах)</text>

  <!-- Measured Object (Деталь) -->
  <rect x="75" y="360" width="235" height="30" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 2"/>
  <text x="192" y="380" text-anchor="middle" font-size="12" fill="#2457d6" font-weight="bold">Дійсний розмір x₀</text>

  <!-- Measuring Force F Arrow & Text (Moved text above line to avoid any overlap) -->
  <text x="390" y="372" text-anchor="start" font-size="13" font-weight="bold" fill="#c0392b">F (зусилля)</text>
  <line x1="450" y1="390" x2="365" y2="390" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>

  <!-- Jaw Length L Dimension Line -->
  <line x1="250" y1="180" x2="270" y2="180" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="250" y1="390" x2="270" y2="390" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="260" y1="180" x2="260" y2="390" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-black-rev)" marker-end="url(#arr-black)"/>
  <text x="245" y="285" text-anchor="end" font-size="13" font-weight="bold" fill="#1a1a1a">L (виліт)</text>

  <!-- Legend Keys at Bottom Left -->
  <line x1="50" y1="480" x2="80" y2="480" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="88" y="484" text-anchor="start" font-size="12" fill="#6b7280">Номінальне положення губок</text>

  <line x1="290" y1="480" x2="320" y2="480" stroke="#c0392b" stroke-width="2"/>
  <text x="328" y="484" text-anchor="start" font-size="12" fill="#c0392b">Деформоване положення (перекіс)</text>

  <line x1="50" y1="510" x2="80" y2="510" stroke="#2457d6" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="88" y="514" text-anchor="start" font-size="12" fill="#2457d6">Осі шкали та вимірювання (позаосьовий зсув)</text>

  <!-- Right Information / Formula Panel -->
  <rect x="640" y="80" width="290" height="440" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Panel Header -->
  <text x="660" y="110" text-anchor="start" font-size="14" font-weight="bold" fill="#1a1a1a">Принцип Аббе та джерела похибки</text>

  <text x="660" y="135" text-anchor="start" font-size="12" fill="#6b7280">• Лінія вимірювання не збігається</text>
  <text x="672" y="153" text-anchor="start" font-size="12" fill="#6b7280">з віссю вимірювальної шкали</text>
  <text x="660" y="175" text-anchor="start" font-size="12" fill="#6b7280">• Момент M = F · L повертає</text>
  <text x="672" y="193" text-anchor="start" font-size="12" fill="#6b7280">рамку в межах зазору g</text>

  <line x1="660" y1="210" x2="910" y2="210" stroke="#d0d7de" stroke-width="1"/>

  <!-- Formula Card (Red) -->
  <rect x="660" y="225" width="250" height="90" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="675" y="248" text-anchor="start" font-size="13" font-weight="bold" fill="#c0392b">Синусна похибка Аббе:</text>
  <text x="675" y="275" text-anchor="start" font-size="15" font-weight="bold" fill="#c0392b">Δx = L · sin θ ≈ L · θ</text>
  <text x="675" y="300" text-anchor="start" font-size="12" fill="#1a1a1a">де θ ≈ g / H (кутовий люфт)</text>

  <!-- Mitigation Card (Green) -->
  <rect x="660" y="330" width="250" height="175" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="675" y="353" text-anchor="start" font-size="13" font-weight="bold" fill="#27ae60">Мінімізація похибки:</text>

  <text x="675" y="378" text-anchor="start" font-size="12" fill="#1a1a1a">1. Вимірювати біля основи штанги</text>
  <text x="690" y="396" text-anchor="start" font-size="12" fill="#6b7280">(зменшення вильоту L → 0)</text>

  <text x="675" y="419" text-anchor="start" font-size="12" fill="#1a1a1a">2. Нормувати зусилля F</text>
  <text x="690" y="437" text-anchor="start" font-size="12" fill="#6b7280">(F ≈ 3–5 Н запобігає перекосу)</text>

  <text x="675" y="460" text-anchor="start" font-size="12" fill="#1a1a1a">3. Контролювати зазор g рамки</text>
  <text x="690" y="478" text-anchor="start" font-size="12" fill="#6b7280">(регулювати затискний клин)</text>
</svg>
