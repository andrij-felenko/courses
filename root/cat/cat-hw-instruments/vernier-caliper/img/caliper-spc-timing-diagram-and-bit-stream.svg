<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="35" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма 24-бітного SPC-протоколу цифрового штангенциркуля</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Передавання виміряного значення, знака та одиниць (мм/дюйм) у синхронному послідовному кадрі</text>

  <!-- Main Waveform Panel Box -->
  <rect x="30" y="75" width="900" height="235" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Functional Group Highlight Boxes -->
  <rect x="160" y="90" width="480" height="195" rx="4" fill="#eaf0fd" fill-opacity="0.6" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="640" y="90" width="120" height="195" rx="4" fill="#fdecea" fill-opacity="0.6" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <rect x="760" y="90" width="120" height="195" rx="4" fill="#e9f7ef" fill-opacity="0.6" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Group Titles -->
  <text x="400" y="108" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Значення вимірювання (Біти 0–15)</text>
  <text x="700" y="108" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Знак (16–19)</text>
  <text x="820" y="108" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Одиниці (20–23)</text>

  <!-- Left Side Signal Names and Voltage Levels -->
  <text x="45" y="132" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="start">CLK (Такти)</text>
  <text x="45" y="150" font-size="11" fill="#6b7280" text-anchor="start">1.5 V / 3.3 V</text>
  <text x="45" y="180" font-size="11" fill="#6b7280" text-anchor="start">0 V (GND)</text>

  <text x="45" y="222" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="start">DATA (Дані)</text>
  <text x="45" y="240" font-size="11" fill="#6b7280" text-anchor="start">1.5 V / 3.3 V</text>
  <text x="45" y="270" font-size="11" fill="#6b7280" text-anchor="start">0 V (GND)</text>

  <!-- Vertical Grid Lines for Bit Cells -->
  <line x1="160" y1="118" x2="160" y2="280" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="190" y1="118" x2="190" y2="280" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2 2"/>
