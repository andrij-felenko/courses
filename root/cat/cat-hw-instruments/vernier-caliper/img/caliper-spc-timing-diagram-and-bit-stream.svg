  <line x1="610" y1="118" x2="610" y2="280" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="640" y1="118" x2="640" y2="280" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="670" y1="118" x2="670" y2="280" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="700" y1="118" x2="700" y2="280" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="730" y1="118" x2="730" y2="280" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="760" y1="118" x2="760" y2="280" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="790" y1="118" x2="790" y2="280" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="820" y1="118" x2="820" y2="280" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="850" y1="118" x2="850" y2="280" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="880" y1="118" x2="880" y2="280" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- CLK Waveform Line -->
  <path d="M 160 145 L 168 145 L 168 180 L 182 180 L 182 145 L 198 145 L 198 180 L 212 180 L 212 145 L 228 145 L 228 180 L 242 180 L 242 145 L 258 145 L 258 180 L 272 180 L 272 145 L 288 145 L 288 180 L 302 180 L 302 145 L 318 145 L 318 180 L 332 180 L 332 145 L 348 145 L 348 180 L 362 180 L 362 145 L 378 145 L 378 180 L 392 180 L 392 145 L 408 145 L 408 180 L 422 180 L 422 145 L 438 145 L 438 180 L 452 180 L 452 145 L 468 145 L 468 180 L 482 180 L 482 145 L 498 145 L 498 180 L 512 180 L 512 145 L 528 145 L 528 180 L 542 180 L 542 145 L 558 145 L 558 180 L 572 180 L 572 145 L 588 145 L 588 180 L 602 180 L 602 145 L 618 145 L 618 180 L 632 180 L 632 145 L 648 145 L 648 180 L 662 180 L 662 145 L 678 145 L 678 180 L 692 180 L 692 145 L 708 145 L 708 180 L 722 180 L 722 145 L 738 145 L 738 180 L 752 180 L 752 145 L 768 145 L 768 180 L 782 180 L 782 145 L 798 145 L 798 180 L 812 180 L 812 145 L 828 145 L 828 180 L 842 180 L 842 145 L 858 145 L 858 180 L 872 180 L 872 145 L 880 145" stroke="#2457d6" stroke-width="2.5" fill="none"/>

  <!-- DATA Bit Values Text Above DATA Waveform -->
  <text x="175" y="220" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="middle">0</text>
  <text x="205" y="220" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">1</text>
  <text x="235" y="220" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="middle">0</text>
  <text x="265" y="220" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="middle">0</text>
  <text x="295" y="220" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">1</text>
  <text x="325" y="220" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="middle">0</text>
  <text x="355" y="220" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">1</text>
  <text x="385" y="220" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">1</text>
  <text x="415" y="220" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="middle">0</text>
  <text x="445" y="220" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="middle">0</text>
  <text x="475" y="220" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">1</text>
  <text x="505" y="220" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="middle">0</text>
  <text x="535" y="220" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="middle">0</text>
  <text x="565" y="220" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="middle">0</text>
  <text x="595" y="220" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="middle">0</text>
  <text x="625" y="220" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="middle">0</text>
  <text x="655" y="220" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="middle">0</text>
  <text x="685" y="220" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="middle">0</text>
  <text x="715" y="220" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="middle">0</text>
  <text x="745" y="220" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="middle">0</text>
  <text x="775" y="220" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="middle">0</text>
  <text x="805" y="220" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="middle">0</text>
  <text x="835" y="220" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="middle">0</text>
  <text x="865" y="220" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="middle">0</text>

  <!-- DATA Waveform Line -->
  <path d="M 160 270 L 198 270 L 198 235 L 228 235 L 228 270 L 288 270 L 288 235 L 318 235 L 318 270 L 348 270 L 348 235 L 408 235 L 408 270 L 468 270 L 468 235 L 498 235 L 498 270 L 880 270" stroke="#27ae60" stroke-width="2.5" fill="none"/>

  <!-- Bit Indices below Waveforms -->
  <text x="175" y="295" font-size="11" fill="#6b7280" text-anchor="middle">0</text>
  <text x="205" y="295" font-size="11" fill="#6b7280" text-anchor="middle">1</text>
  <text x="235" y="295" font-size="11" fill="#6b7280" text-anchor="middle">2</text>
  <text x="265" y="295" font-size="11" fill="#6b7280" text-anchor="middle">3</text>
  <text x="295" y="295" font-size="11" fill="#6b7280" text-anchor="middle">4</text>
  <text x="325" y="295" font-size="11" fill="#6b7280" text-anchor="middle">5</text>
  <text x="355" y="295" font-size="11" fill="#6b7280" text-anchor="middle">6</text>
  <text x="385" y="295" font-size="11" fill="#6b7280" text-anchor="middle">7</text>
  <text x="415" y="295" font-size="11" fill="#6b7280" text-anchor="middle">8</text>
  <text x="445" y="295" font-size="11" fill="#6b7280" text-anchor="middle">9</text>
  <text x="475" y="295" font-size="11" fill="#6b7280" text-anchor="middle">10</text>
  <text x="505" y="295" font-size="11" fill="#6b7280" text-anchor="middle">11</text>
  <text x="535" y="295" font-size="11" fill="#6b7280" text-anchor="middle">12</text>
  <text x="565" y="295" font-size="11" fill="#6b7280" text-anchor="middle">13</text>
  <text x="595" y="295" font-size="11" fill="#6b7280" text-anchor="middle">14</text>
  <text x="625" y="295" font-size="11" fill="#6b7280" text-anchor="middle">15</text>
  <text x="655" y="295" font-size="11" fill="#6b7280" text-anchor="middle">16</text>
  <text x="685" y="295" font-size="11" fill="#6b7280" text-anchor="middle">17</text>
  <text x="715" y="295" font-size="11" fill="#6b7280" text-anchor="middle">18</text>
  <text x="745" y="295" font-size="11" fill="#6b7280" text-anchor="middle">19</text>
  <text x="775" y="295" font-size="11" fill="#6b7280" text-anchor="middle">20</text>
  <text x="805" y="295" font-size="11" fill="#6b7280" text-anchor="middle">21</text>
  <text x="835" y="295" font-size="11" fill="#6b7280" text-anchor="middle">22</text>
  <text x="865" y="295" font-size="11" fill="#6b7280" text-anchor="middle">23</text>

  <!-- Bottom Legend Card -->
  <rect x="45" y="325" width="870" height="150" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Legend Title -->
  <text x="65" y="348" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="start">Структура 24-бітного кадру SPC (Digimatic) та інтерфейсні межі:</text>

  <!-- Legend Column 1 -->
  <text x="65" y="373" font-size="12" fill="#1a1a1a" text-anchor="start">• Біти 0–15 (16 біт): Двійкове значення виміру (LSB першим, крок 0.01 мм)</text>
  <text x="65" y="398" font-size="12" fill="#1a1a1a" text-anchor="start">• Біти 16–19 (4 біти): Знак значення (0000 = '+', 0001 = '-') та статус джерела</text>
  <text x="65" y="423" font-size="12" fill="#1a1a1a" text-anchor="start">• Біти 20–23 (4 біти): Одиниці вимірювання (0000 = мм, 0001 = дюйм)</text>
  <text x="65" y="448" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">• Приклад на діаграмі: двійковий код 0x04D2 = 1234 (відповідає +12.34 мм)</text>

  <!-- Legend Column 2 -->
  <text x="560" y="373" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">Параметри зв'язку та рівнів:</text>
  <text x="560" y="398" font-size="12" fill="#6b7280" text-anchor="start">• Частота CLK: f ≈ 10–20 кГц (T ≈ 50–100 мкс)</text>
  <text x="560" y="423" font-size="12" fill="#6b7280" text-anchor="start">• Напруга сигналу: 1.5 В (елемент LR44/SR44)</text>
  <text x="560" y="448" font-size="12" fill="#6b7280" text-anchor="start">• Зчитування: за зростаючим фронтом CLK</text>
</svg>
