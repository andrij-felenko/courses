<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background canvas -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Падіння напруги в колі живлення 5 В USB-паяльника</text>
  <text x="480" y="64" text-anchor="middle" font-size="13" fill="#6b7280">Опір провідників кабелю знижує напругу на нагрівачі 3,1 Ом і зменшує корисну теплову потужність</text>

  <!-- Left Panel: Power Source -->
  <rect x="40" y="90" width="220" height="300" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="150" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Джерело USB 5 В</text>
  <text x="150" y="142" text-anchor="middle" font-size="12" fill="#6b7280">(Power Supply / PB)</text>

  <rect x="85" y="165" width="130" height="190" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="150" y="210" text-anchor="middle" font-size="15" font-weight="bold" fill="#2457d6">U_src = 5,0 В</text>
  <text x="150" y="238" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">I_max = 2,0 А</text>
  <text x="150" y="275" text-anchor="middle" font-size="12" fill="#6b7280">Номінальний вихід</text>
  <text x="150" y="295" text-anchor="middle" font-size="12" fill="#6b7280">живлення USB</text>

  <!-- Middle Panel: Cable & Lines -->
  <rect x="290" y="90" width="360" height="300" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="470" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">USB-кабель та лінії живлення</text>
  <text x="470" y="142" text-anchor="middle" font-size="12" fill="#6b7280">Паразитний опір провідників R_cable</text>

  <!-- Circuit Wiring Lines -->
  <!-- Top line (+5V VBUS) -->
  <line x1="215" y1="180" x2="350" y2="180" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="225" y1="180" x2="275" y2="180" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-accent)"/>
  <text x="250" y="166" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">I = 1,39 А</text>

  <!-- Top wire resistor box -->
  <text x="410" y="162" text-anchor="middle" font-size="12" fill="#c0392b">ΔU_line+ = 0,35 В</text>
  <rect x="350" y="167" width="120" height="26" fill="#fdecea" stroke="#c0392b" stroke-width="2" rx="4"/>
  <text x="410" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">R_wire+ = 0,25 Ом</text>
  <line x1="470" y1="180" x2="680" y2="180" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Bottom line (GND) -->
  <line x1="215" y1="320" x2="350" y2="320" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- Bottom wire resistor box -->
  <rect x="350" y="307" width="120" height="26" fill="#fdecea" stroke="#c0392b" stroke-width="2" rx="4"/>
  <text x="410" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">R_wire- = 0,25 Ом</text>
  <text x="410" y="352" text-anchor="middle" font-size="12" fill="#c0392b">ΔU_line- = 0,35 В</text>
  <line x1="470" y1="320" x2="680" y2="320" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Cable Summary Loss Box -->
  <rect x="500" y="225" width="130" height="50" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <text x="565" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">R_cable = 0,50 Ом</text>
  <text x="565" y="263" text-anchor="middle" font-size="12" fill="#c0392b">ΔU_cable = 0,70 В</text>

  <!-- Right Panel: Heater -->
  <rect x="680" y="90" width="240" height="300" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="800" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Нагрівач TK-USB-DS</text>
  <text x="800" y="142" text-anchor="middle" font-size="12" fill="#27ae60">Корисне навантаження R_h</text>

  <!-- Connections from wires into heater element -->
  <path d="M 680,180 L 800,180 L 800,200" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 800,300 L 800,320 L 680,320" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Heater load box -->
  <rect x="740" y="200" width="120" height="100" fill="#ffffff" stroke="#27ae60" stroke-width="2" rx="6"/>
  <text x="800" y="232" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">R_h = 3,1 Ом</text>
  <text x="800" y="257" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">U_h = 4,30 В</text>
  <text x="800" y="282" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">P_h = 5,97 Вт</text>

  <!-- Bottom Right Badge -->
  <rect x="705" y="325" width="190" height="50" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="800" y="345" text-anchor="middle" font-size="12" fill="#6b7280">Паспортна потужність: 8 Вт</text>
  <text x="800" y="365" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Фактична: ~6 Вт (-25%)</text>

  <!-- Bottom Banner: Formula -->
  <rect x="40" y="405" width="880" height="35" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="427" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">U_h = U_src · R_h / (R_h + R_cable) = 5,0 · 3,1 / 3,6 = 4,30 В   ⇒   P_h = U_h² / R_h = 5,97 Вт</text>
</svg>
