<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Біла підкладка полотна -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Порівняльний тепловий баланс USB-паяльника 8 Вт</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">При паянні SMD-компонента P_heat &gt; P_loss і припій плавиться; на полігоні P_loss &gt; P_heat і тис заморожується</text>

  <!-- ПАНЕЛЬ А: Дрібний SMD-компонент (Ліворуч) -->
  <rect x="40" y="80" width="425" height="440" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  
  <!-- Заголовок панелі А -->
  <rect x="55" y="95" width="395" height="42" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="252" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Варіант А: Дрібний SMD-компонент (0805)</text>
  <text x="252" y="130" text-anchor="middle" font-size="11" fill="#1a1a1a">Допустима задача: P_heat (8 Вт) &gt; P_loss (1.5 Вт)</text>

  <!-- Візуалізація паяння SMD-компонента -->
  <!-- Плата -->
  <rect x="65" y="210" width="375" height="70" rx="6" fill="#27ae60" fill-opacity="0.12" stroke="#27ae60" stroke-width="1.5"/>
  <text x="80" y="265" font-size="11" font-weight="bold" fill="#27ae60">Двошарова друкована плата</text>

  <!-- Контактні площадки та резистор (неперетинні прямокутники) -->
  <rect x="190" y="224" width="25" height="24" fill="#d0d7de" stroke="#1a1a1a"/>
  <rect x="228" y="224" width="44" height="24" rx="2" fill="#1a1a1a"/>
  <text x="250" y="240" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">0805</text>
  <rect x="285" y="224" width="25" height="24" fill="#d0d7de" stroke="#1a1a1a"/>

  <!-- Тис паяльника А -->
  <path d="M 285,150 L 310,150 L 300,224 L 295,224 Z" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <text x="325" y="155" font-size="11" font-weight="bold" fill="#2457d6">Тис TK-USB-DS</text>
  <text x="325" y="175" font-size="11" font-weight="bold" fill="#27ae60">T_tip = 320 °C</text>
  <text x="325" y="195" font-size="11" fill="#6b7280">P_loss = 1.5 Вт</text>

  <!-- Стрілка теплового потоку P_heat А -->
  <line x1="245" y1="150" x2="245" y2="200" stroke="#27ae60" stroke-width="3" marker-end="url(#arr-green)"/>
  <text x="155" y="170" font-size="12" font-weight="bold" fill="#27ae60">P_heat = 8 Вт</text>

  <!-- Стрілка малого витоку тепла P_loss А -->
  <line x1="310" y1="236" x2="365" y2="236" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Блок розрахунку теплового балансу А -->
  <rect x="55" y="295" width="395" height="122" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="70" y="317" font-size="12" font-weight="bold" fill="#1a1a1a">Рівняння теплового балансу:</text>
  <text x="70" y="338" font-size="12" font-weight="bold" fill="#27ae60">ΔP = P_heat - P_loss = 8.0 Вт - 1.5 Вт = +6.5 Вт</text>
  <text x="70" y="360" font-size="11" fill="#27ae60">• ΔP &gt; 0: Тис утримує робочу температуру T_tip ≥ 300 °C</text>
  <text x="70" y="380" font-size="11" fill="#1a1a1a">• Припій швидко досягає рідкої фази (T_liq ≈ 217 °C)</text>
  <text x="70" y="400" font-size="11" fill="#27ae60">• Час паяння: t_solder ≈ 1.5–2.0 секунди (Якісна галтель)</text>

  <!-- Блок підсумку А -->
  <rect x="55" y="431" width="395" height="74" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="70" y="450" font-size="12" font-weight="bold" fill="#27ae60">РЕЗУЛЬТАТ: УСПІШНЕ ПАЯННЯ</text>
  <text x="70" y="470" font-size="11" fill="#1a1a1a">Мала теплоємність вузла дозволяє 8-ватному паяльнику</text>
  <text x="70" y="488" font-size="11" fill="#1a1a1a">забезпечити швидке змочування без перегріву плати.</text>

  <!-- ПАНЕЛЬ Б: Масивний полігон GND (Праворуч) -->
  <rect x="495" y="80" width="425" height="440" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  
  <!-- Заголовок панелі Б -->
  <rect x="510" y="95" width="395" height="42" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="707" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">Варіант Б: Масивний полігон заземлення (GND)</text>
  <text x="707" y="130" text-anchor="middle" font-size="11" fill="#1a1a1a">Непрохідна задача: P_loss (9.5 Вт) &gt; P_heat (8 Вт)</text>

  <!-- Візуалізація паяння на полігоні GND -->
  <!-- Плата з полігоном -->
  <rect x="520" y="210" width="375" height="70" rx="6" fill="#c0392b" fill-opacity="0.12" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="530" y="232" width="355" height="16" fill="#d0d7de" stroke="#c0392b" stroke-width="1.5"/>
  <text x="535" y="265" font-size="11" font-weight="bold" fill="#c0392b">Суцільний мідний полігон GND (35 мкм, 10 см²)</text>

  <!-- Тис паяльника Б -->
  <path d="M 720,150 L 745,150 L 735,232 L 730,232 Z" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/>
  <text x="765" y="155" font-size="11" font-weight="bold" fill="#c0392b">Тис TK-USB-DS</text>
  <text x="765" y="175" font-size="11" font-weight="bold" fill="#c0392b">T_tip &lt; 180 °C (Просідання)</text>
  <text x="765" y="195" font-size="11" font-weight="bold" fill="#c0392b">P_loss = 9.5 Вт</text>

  <!-- Стрілка тепла P_heat Б -->
  <line x1="695" y1="150" x2="695" y2="200" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="605" y="170" font-size="12" font-weight="bold" fill="#2457d6">P_heat = 8 Вт</text>

  <!-- Стрілки масивного витоку тепла в мідь P_loss Б -->
  <line x1="725" y1="238" x2="550" y2="238" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-red)"/>
  <line x1="740" y1="238" x2="865" y2="238" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-red)"/>

  <!-- Блок розрахунку теплового балансу Б -->
  <rect x="510" y="295" width="395" height="122" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="525" y="317" font-size="12" font-weight="bold" fill="#1a1a1a">Рівняння теплового балансу:</text>
  <text x="525" y="338" font-size="12" font-weight="bold" fill="#c0392b">ΔP = P_heat - P_loss = 8.0 Вт - 9.5 Вт = -1.5 Вт</text>
  <text x="525" y="360" font-size="11" fill="#c0392b">• ΔP &gt; 0: Некомпенсоване виточування тепла в мідь</text>
  <text x="525" y="380" font-size="11" fill="#1a1a1a">• Температура жала падає нижче точки плавлення припою</text>
  <text x="525" y="400" font-size="11" fill="#c0392b">• Ефект «заморожування»: тис прилипає до полігона</text>

  <!-- Блок підсумку Б -->
  <rect x="510" y="431" width="395" height="74" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="525" y="450" font-size="12" font-weight="bold" fill="#c0392b">РЕЗУЛЬТАТ: ВИТОК ТЕПЛА ТА БРАК</text>
  <text x="525" y="470" font-size="11" fill="#1a1a1a">Потужності 8 Вт недостатньо для подібного тепловідводу.</text>
  <text x="525" y="488" font-size="11" fill="#1a1a1a">Потрібен термофен або паяльник потужністю від 65 Вт.</text>
</svg>
