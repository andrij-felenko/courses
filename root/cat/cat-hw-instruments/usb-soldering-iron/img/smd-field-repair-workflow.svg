<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="540" fill="white"/>
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Послідовність виїзного ремонту та монтажу SMD-компонента (0805 / SOT-23)</text>
  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Етапи підготовки площадок, внесення флюсу, почергового прогріву та точної фіксації пінцетом</text>

  <!-- Step 1 Card: Preparation & Flux Application -->
  <rect x="30" y="75" width="210" height="365" fill="#f4f6f8" stroke="#d0d7de" rx="8"/>
  <circle cx="55" cy="100" r="12" fill="#2457d6"/>
  <text x="55" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="white">1</text>
  <text x="145" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Нанесення флюсу</text>

  <!-- Step 1 Illustration -->
  <rect x="55" y="202" width="160" height="40" fill="#eaf0fd" stroke="#2457d6" rx="4"/>
  <rect x="70" y="188" width="35" height="10" fill="#2457d6"/>
  <rect x="165" y="188" width="35" height="10" fill="#2457d6"/>
  <circle cx="87" cy="178" r="8" fill="#2457d6" opacity="0.6"/>
  <circle cx="182" cy="178" r="8" fill="#2457d6" opacity="0.6"/>
  <text x="135" y="145" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Флюс FVS-7</text>

  <!-- Step 1 Bullets -->
  <text x="50" y="295" font-size="11" fill="#1a1a1a">• Очищення контактів</text>
  <text x="50" y="325" font-size="11" font-weight="bold" fill="#2457d6">• Флюс FVS-7 на 2 виводи</text>
  <text x="50" y="355" font-size="11" fill="#1a1a1a">• Зняття оксидів</text>
  <text x="50" y="385" font-size="11" fill="#6b7280">• Нагрів: 280–300 °C</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="242" y1="195" x2="258" y2="195" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Step 2 Card: Alternating Desoldering -->
  <rect x="260" y="75" width="210" height="365" fill="#f4f6f8" stroke="#d0d7de" rx="8"/>
  <circle cx="285" cy="100" r="12" fill="#2457d6"/>
  <text x="285" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="white">2</text>
  <text x="375" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Демонтаж елемента</text>

  <!-- Step 2 Illustration -->
  <rect x="285" y="202" width="160" height="40" fill="#eaf0fd" stroke="#2457d6" rx="4"/>
  <rect x="300" y="188" width="35" height="10" fill="#2457d6"/>
  <rect x="395" y="188" width="35" height="10" fill="#2457d6"/>
  <rect x="338" y="168" width="54" height="20" fill="#1a1a1a" rx="2"/>
  <path d="M 333,168 L 338,168 L 338,188 L 333,188 Z" fill="#95a5a6"/>
  <path d="M 392,168 L 397,168 L 397,188 L 392,188 Z" fill="#95a5a6"/>
  <polygon points="295,150 315,175 308,180 290,155" fill="#2457d6"/>
  <text x="365" y="145" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Прогрів 1.5–2.0 с</text>

  <!-- Step 2 Bullets -->
  <text x="280" y="295" font-size="11" fill="#1a1a1a">• Почерговий дотик жала</text>
  <text x="280" y="325" font-size="11" font-weight="bold" fill="#2457d6">• Прогрів галтелі 1.5 с</text>
  <text x="280" y="355" font-size="11" fill="#1a1a1a">• Підняття пінцетом</text>
  <text x="280" y="385" font-size="11" fill="#6b7280">• Запобігання перегріву</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="472" y1="195" x2="488" y2="195" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Step 3 Card: Component Positioning -->
  <rect x="490" y="75" width="210" height="365" fill="#f4f6f8" stroke="#d0d7de" rx="8"/>
  <circle cx="515" cy="100" r="12" fill="#2457d6"/>
  <text x="515" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="white">3</text>
  <text x="605" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Позиціонування</text>

  <!-- Step 3 Illustration -->
  <rect x="515" y="202" width="160" height="40" fill="#eaf0fd" stroke="#2457d6" rx="4"/>
  <rect x="530" y="188" width="35" height="10" fill="#2457d6"/>
  <rect x="625" y="188" width="35" height="10" fill="#2457d6"/>
  <path d="M 575,130 L 585,168" stroke="#6b7280" stroke-width="2.5"/>
  <path d="M 615,130 L 605,168" stroke="#6b7280" stroke-width="2.5"/>
  <rect x="568" y="168" width="54" height="20" fill="#1a1a1a" rx="2"/>
  <path d="M 563,168 L 568,168 L 568,188 L 563,188 Z" fill="#95a5a6"/>
  <path d="M 622,168 L 627,168 L 627,188 L 622,188 Z" fill="#95a5a6"/>
  <text x="595" y="125" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Притиск пінцетом</text>

  <!-- Step 3 Bullets -->
  <text x="510" y="295" font-size="11" fill="#1a1a1a">• Попереднє лудження</text>
  <text x="510" y="325" font-size="11" font-weight="bold" fill="#2457d6">• Фіксація пінцетом</text>
  <text x="510" y="355" font-size="11" fill="#1a1a1a">• Притиск до контакту</text>
  <text x="510" y="385" font-size="11" fill="#6b7280">• Контроль орієнтації</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="702" y1="195" x2="718" y2="195" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Step 4 Card: Final Soldering -->
  <rect x="720" y="75" width="210" height="365" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="8"/>
  <circle cx="745" cy="100" r="12" fill="#27ae60"/>
  <text x="745" y="104" text-anchor="middle" font-size="12" font-weight="bold" fill="white">4</text>
  <text x="835" y="105" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Остаточний монтаж</text>

  <!-- Step 4 Illustration -->
  <rect x="745" y="202" width="160" height="40" fill="#e9f7ef" stroke="#27ae60" rx="4"/>
  <rect x="760" y="188" width="35" height="10" fill="#27ae60"/>
  <rect x="855" y="188" width="35" height="10" fill="#27ae60"/>
  <rect x="798" y="168" width="54" height="20" fill="#1a1a1a" rx="2"/>
  <path d="M 775,198 L 798,168 L 798,198 Z" fill="#27ae60"/>
  <path d="M 852,168 L 875,198 L 852,198 Z" fill="#27ae60"/>
  <text x="825" y="145" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Якісний монтаж ✔</text>

  <!-- Step 4 Bullets -->
  <text x="740" y="295" font-size="11" fill="#1a1a1a">• Паяння 1-го виводу (1.5 с)</text>
  <text x="740" y="325" font-size="11" font-weight="bold" fill="#27ae60">• Фіксація 2-го виводу</text>
  <text x="740" y="355" font-size="11" font-weight="bold" fill="#27ae60">• Блискуча галтель</text>
  <text x="740" y="385" font-size="11" fill="#6b7280">• Контроль без перегріву</text>

  <!-- Bottom Summary Banner -->
  <rect x="30" y="455" width="900" height="65" fill="#eaf0fd" stroke="#2457d6" rx="8"/>
  <text x="480" y="478" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Практичне правило виїзного монтажу 8-ватним USB-паяльником:</text>
  <text x="480" y="503" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Короткий контакт 1.5–2.0 с при 300 °C + флюс FVS-7 = надійне з'єднання без відшарування доріжок</text>
</svg>
