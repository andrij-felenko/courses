<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="540" fill="white"/>
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Еквівалентне теплове коло та часова динаміка температури жала USB-паяльника</text>
  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Тепловий баланс між генеруванням потужності P_heat та відведенням тепла P_loss на полігоні</text>

  <!-- Left Panel: Equivalent Thermal Circuit -->
  <rect x="25" y="75" width="430" height="445" fill="#f4f6f8" stroke="#d0d7de" rx="8"/>
  <text x="240" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Еквівалентна схема теплового балансу</text>

  <!-- Generator Node -->
  <rect x="55" y="135" width="110" height="75" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="110" y="155" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Джерело тепла</text>
  <text x="110" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">P_heat = 8.0 Вт</text>
  <text x="110" y="193" text-anchor="middle" font-size="11" fill="#6b7280">(5 В / 1.6 А)</text>

  <!-- Arrow Generator -> Tip Node -->
  <line x1="165" y1="172.5" x2="220" y2="172.5" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="192" y="165" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">P_heat</text>

  <!-- Tip Node -->
  <rect x="220" y="135" width="110" height="75" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" rx="6"/>
  <text x="275" y="155" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Вузлове жало</text>
  <text x="275" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">C_tip = 0.8 Дж/К</text>
  <text x="275" y="193" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">T_tip(t)</text>

  <!-- Arrow Tip Node -> Ground Board -->
  <line x1="275" y1="210" x2="275" y2="265" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="285" y="242" text-anchor="start" font-size="11" font-weight="bold" fill="#c0392b">P_loss (Тепловідвід)</text>

  <!-- Ground Board Node -->
  <rect x="220" y="265" width="110" height="75" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <text x="275" y="285" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Мідний полігон</text>
  <text x="275" y="305" text-anchor="middle" font-size="11" fill="#c0392b">k_Cu ≈ 390 Вт/(м·К)</text>
  <text x="275" y="323" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">P_loss ≈ 10 Вт</text>

  <!-- Formula Summary Card (Left Panel Bottom) -->
  <rect x="45" y="360" width="390" height="140" fill="#eaf0fd" stroke="#2457d6" rx="6"/>
  <text x="240" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Баланс потужності в точці контакта:</text>
  <text x="240" y="402" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">P_net = P_heat - P_loss</text>
  <text x="240" y="425" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">SMD вузол: P_loss ≈ 1.5 Вт ⇒ P_net = +6.5 Вт (Нагрів)</text>
  <text x="240" y="448" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Полігон заземлення: P_loss ≈ 10 Вт ⇒ P_net = -2.0 Вт</text>
  <text x="240" y="471" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">❌ Просідання T_tip нижче 180°C (Прилипання жала)</text>

  <!-- Right Panel: Temperature Dynamics Plot -->
  <rect x="475" y="75" width="460" height="445" fill="#f4f6f8" stroke="#d0d7de" rx="8"/>
  <text x="705" y="100" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Динаміка температури T_tip при двох режимах навантаження</text>

  <!-- Y-axis Label & Arrow -->
  <text x="530" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">T_tip (°C)</text>
  <line x1="540" y1="430" x2="540" y2="125" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>

  <!-- X-axis Label & Arrow -->
  <line x1="540" y1="430" x2="915" y2="430" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>
  <text x="730" y="465" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Час контакту t (с)</text>

  <!-- Grid Lines & Ticks Y-axis -->
  <!-- 320 °C -->
  <line x1="535" y1="160" x2="540" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="540" y1="160" x2="900" y2="160" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1.5"/>
  <text x="530" y="164" text-anchor="end" font-size="12" fill="#1a1a1a">320 °C</text>

  <!-- 220 °C -->
  <line x1="535" y1="260" x2="540" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="540" y1="260" x2="900" y2="260" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1.5"/>
  <text x="530" y="264" text-anchor="end" font-size="12" fill="#6b7280">220 °C</text>

  <!-- 180 °C -->
  <line x1="535" y1="300" x2="540" y2="300" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="540" y1="300" x2="900" y2="300" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1.5"/>
  <text x="530" y="304" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">180 °C</text>

  <!-- X-axis Ticks -->
  <line x1="540" y1="430" x2="540" y2="435" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="540" y="448" text-anchor="middle" font-size="12" fill="#1a1a1a">0</text>

  <line x1="630" y1="160" x2="630" y2="435" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1.5"/>
  <text x="630" y="448" text-anchor="middle" font-size="12" fill="#1a1a1a">1.0 с</text>

  <line x1="720" y1="160" x2="720" y2="435" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1.5"/>
  <text x="720" y="448" text-anchor="middle" font-size="12" fill="#1a1a1a">2.0 с</text>

  <line x1="810" y1="160" x2="810" y2="435" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1.5"/>
  <text x="810" y="448" text-anchor="middle" font-size="12" fill="#1a1a1a">3.0 с</text>

  <line x1="900" y1="160" x2="900" y2="435" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1.5"/>
  <text x="900" y="448" text-anchor="middle" font-size="12" fill="#1a1a1a">4.0 с</text>

  <!-- Green Curve (SMD component) -->
  <path d="M 540,160 Q 560,180 585,180 T 630,165 L 900,160" fill="none" stroke="#27ae60" stroke-width="3"/>
  <text x="650" y="148" text-anchor="start" font-size="11" font-weight="bold" fill="#27ae60">✔ SMD вузол (Швидкий розплав за 1.5 с)</text>

  <!-- Red Curve (Ground plane) -->
  <path d="M 540,160 C 580,210 630,260 720,300 C 780,325 840,335 900,340" fill="none" stroke="#c0392b" stroke-width="3"/>
  <text x="680" y="278" text-anchor="start" font-size="11" font-weight="bold" fill="#c0392b">❌ Полігон заземлення (T &lt; 180°C)</text>

  <!-- Warning Box inside Red Freezing Zone -->
  <rect x="735" y="330" width="160" height="85" fill="#fdecea" stroke="#c0392b" stroke-dasharray="3,3" stroke-width="1.5" rx="6"/>
  <text x="815" y="365" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Зона кристалізації</text>
  <text x="815" y="385" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">та прилипання жала</text>
</svg>
