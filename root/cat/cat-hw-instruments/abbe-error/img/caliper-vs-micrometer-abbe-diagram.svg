<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-start" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-red-start" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Main Titles -->
  <text x="480" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Принцип Аббе в конструкції вимірювальних приладів</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Чому в мікрометрі похибка Аббе відсутня, а в штангенциркулі вона зростає зі збільшенням плеча</text>

  <!-- Part 1: Caliper -->
  <text x="20" y="100" font-size="14" font-weight="bold" fill="#1a1a1a">Штангенциркуль (не дотримується принципу Аббе)</text>

  <!-- Caliper Mechanics -->
  <rect x="140" y="150" width="380" height="20" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  
  <path d="M 210 150 v 8 M 260 150 v 8 M 310 150 v 8 M 360 150 v 8 M 410 150 v 8 M 460 150 v 8 M 510 150 v 8" stroke="#6b7280" stroke-width="1.5"/>
  <path d="M 220 150 v 5 M 230 150 v 5 M 240 150 v 5 M 250 150 v 5 M 270 150 v 5 M 280 150 v 5 M 290 150 v 5 M 300 150 v 5 M 320 150 v 5 M 330 150 v 5 M 340 150 v 5 M 350 150 v 5 M 370 150 v 5 M 380 150 v 5 M 390 150 v 5 M 400 150 v 5 M 420 150 v 5 M 430 150 v 5 M 440 150 v 5 M 450 150 v 5 M 470 150 v 5 M 480 150 v 5 M 490 150 v 5 M 500 150 v 5" stroke="#d0d7de" stroke-width="1"/>

  <polygon points="170,145 210,145 210,260 195,260 195,170 170,170" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  
  <rect x="210" y="225" width="210" height="30" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="315" y="244" text-anchor="middle" font-size="13" fill="#2457d6">Вимірювана деталь</text>

  <!-- Nominal & Tilted Jaws -->
  <polygon points="390,145 450,145 450,175 435,175 435,260 420,260 420,175 390,175" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4"/>
  <polygon points="371,145 431,145 437,175 422,175 439,260 424,260 407,175 377,175" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>

  <!-- Caliper Markings & Errors -->
  <line x1="420" y1="150" x2="420" y2="160" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="404" y1="150" x2="404" y2="160" stroke="#c0392b" stroke-width="1.5"/>

  <line x1="404" y1="130" x2="420" y2="130" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-red-start)" marker-end="url(#arr-red)"/>
  <line x1="404" y1="130" x2="404" y2="150" stroke="#c0392b" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="420" y1="130" x2="420" y2="150" stroke="#c0392b" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="412" y="122" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">δ</text>
  <text x="422" y="122" font-size="12" fill="#c0392b">(похибка)</text>

  <!-- Axes Caliper -->
  <line x1="20" y1="160" x2="540" y2="160" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="15" y="140" font-size="13" fill="#2457d6">Еталонна вісь (шкала)</text>

  <line x1="20" y1="240" x2="250" y2="240" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="8 4"/>
  <line x1="378" y1="240" x2="540" y2="240" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="8 4"/>
  <text x="20" y="230" font-size="13" fill="#2457d6">Вісь вимірювання</text>

  <!-- Abbe Offset & Angle -->
  <line x1="380" y1="160" x2="380" y2="240" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-start)" marker-end="url(#arr)"/>
  <text x="372" y="204" text-anchor="end" font-size="13" fill="#1a1a1a">h (плече Аббе)</text>

  <line x1="404" y1="160" x2="404" y2="250" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 4"/>
  <path d="M 404 200 A 40 40 0 0 0 412 200" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <text x="400" y="215" text-anchor="end" font-size="13" font-weight="bold" fill="#c0392b">θ</text>

  <!-- Caliper Info Box -->
  <rect x="550" y="130" width="380" height="100" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="565" y="155" font-size="14" font-weight="bold" fill="#c0392b">Проблема: наявне плече Аббе (h &gt; 0)</text>
  <text x="565" y="175" font-size="13" fill="#1a1a1a">Перекіс рухомої губки на кут θ призводить до</text>
  <text x="565" y="195" font-size="13" fill="#1a1a1a">виникнення похибки вимірювання першого порядку:</text>
  <text x="565" y="215" font-size="14" font-weight="bold" fill="#c0392b">δ ≈ h · θ</text>


  <!-- Part 2: Micrometer -->
  <text x="20" y="340" font-size="14" font-weight="bold" fill="#1a1a1a">Мікрометр (дотримується принципу Аббе)</text>

  <!-- Micrometer Mechanics -->
  <path d="M 160 470 L 160 500 A 40 40 0 0 0 200 540 L 470 540 A 40 40 0 0 0 510 500 L 510 470 L 480 470 L 480 500 A 10 10 0 0 1 470 510 L 200 510 A 10 10 0 0 1 190 500 L 190 470 Z" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  
  <rect x="160" y="430" width="30" height="40" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <rect x="190" y="440" width="20" height="20" fill="#d0d7de" stroke="#6b7280" stroke-width="1.5"/>
  
  <rect x="210" y="435" width="210" height="30" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="315" y="454" text-anchor="middle" font-size="13" fill="#2457d6">Вимірювана деталь</text>

  <rect x="420" y="440" width="60" height="20" fill="#d0d7de" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="480" y="430" width="30" height="40" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <rect x="510" y="435" width="50" height="30" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <rect x="560" y="430" width="50" height="40" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>

  <!-- Micrometer Markings -->
  <line x1="510" y1="450" x2="560" y2="450" stroke="#6b7280" stroke-width="1"/>
  <path d="M 515 450 v -5 M 525 450 v -5 M 535 450 v -8 M 545 450 v -5 M 555 450 v -5" stroke="#6b7280" stroke-width="1"/>
  <path d="M 560 435 h 5 M 560 440 h 5 M 560 445 h 5 M 560 450 h 8 M 560 455 h 5 M 560 460 h 5 M 560 465 h 5" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Axes Micrometer -->
  <line x1="20" y1="450" x2="250" y2="450" stroke="#27ae60" stroke-width="2" stroke-dasharray="10 4"/>
  <line x1="380" y1="450" x2="630" y2="450" stroke="#27ae60" stroke-width="2" stroke-dasharray="10 4"/>
  <text x="20" y="415" font-size="13" font-weight="bold" fill="#27ae60">Еталонна вісь збігається з віссю вимірювання</text>
  <text x="360" y="430" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">h = 0</text>

  <!-- Micrometer Info Box -->
  <rect x="640" y="400" width="300" height="100" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="655" y="425" font-size="14" font-weight="bold" fill="#27ae60">Рішення: плече Аббе h = 0</text>
  <text x="655" y="445" font-size="13" fill="#1a1a1a">Еталонна шкала (стебло) та вісь</text>
  <text x="655" y="465" font-size="13" fill="#1a1a1a">вимірювання розташовані на одній прямій.</text>
  <text x="655" y="485" font-size="13" fill="#1a1a1a">Похибка першого порядку дорівнює нулю.</text>

</svg>
