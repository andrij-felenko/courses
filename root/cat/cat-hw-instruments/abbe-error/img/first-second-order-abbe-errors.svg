<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" fill="#1a1a1a">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-weight="bold" font-size="18">Похибки Аббе першого та другого порядку</text>
  <text x="480" y="65" text-anchor="middle" font-size="13" fill="#6b7280">Вплив кутових відхилень на результат вимірювання залежно від наявності плеча Аббе</text>

  <!-- Left Diagram -->
  <line x1="70" y1="160" x2="450" y2="160" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>

  <rect x="70" y="300" width="380" height="20" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <path d="M 110 300 v 8 M 150 300 v 8 M 190 300 v 8 M 230 300 v 8 M 270 300 v 8 M 310 300 v 8 M 350 300 v 8 M 390 300 v 8 M 430 300 v 8" stroke="#6b7280" stroke-width="1.5"/>

  <line x1="180" y1="160" x2="180" y2="300" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
  <text x="170" y="235" text-anchor="end" fill="#2457d6" font-size="13">h (плече Аббе)</text>

  <g stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,4" fill="none">
    <rect x="230" y="150" width="40" height="150"/>
    <rect x="270" y="150" width="60" height="20"/>
    <circle cx="330" cy="160" r="4" fill="#27ae60"/>
  </g>
  <line x1="330" y1="160" x2="330" y2="80" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,4"/>

  <g transform="rotate(20, 250, 300)">
    <rect x="230" y="150" width="40" height="150" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <rect x="270" y="150" width="60" height="20" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <circle cx="330" cy="160" r="4" fill="#c0392b"/>
  </g>
  <line x1="373.05" y1="195.8" x2="373.05" y2="80" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>

  <line x1="330" y1="90" x2="373.05" y2="90" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-red)" marker-end="url(#arr-red)"/>
  <text x="351.5" y="82" text-anchor="middle" fill="#c0392b" font-size="13">δ₁</text>

  <line x1="250" y1="300" x2="250" y2="210" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="2,2"/>
  <path d="M 250 230 A 70 70 0 0 1 273.9 234.2" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="270" y="225" text-anchor="start" font-size="13">θ (pitch)</text>

  <!-- Right Diagram -->
  <rect x="510" y="300" width="380" height="20" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <path d="M 550 300 v 8 M 590 300 v 8 M 630 300 v 8 M 670 300 v 8 M 710 300 v 8 M 750 300 v 8 M 790 300 v 8 M 830 300 v 8 M 870 300 v 8" stroke="#6b7280" stroke-width="1.5"/>

  <line x1="550" y1="300" x2="810" y2="300" stroke="#27ae60" stroke-width="2"/>
  <circle cx="810" cy="300" r="4" fill="#27ae60"/>

  <g transform="rotate(-30, 550, 300)">
    <line x1="550" y1="300" x2="810" y2="300" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>
    <circle cx="810" cy="300" r="4" fill="#c0392b"/>
    <line x1="550" y1="280" x2="810" y2="280" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <text x="680" y="270" text-anchor="middle" font-size="13">L</text>
    <line x1="550" y1="300" x2="550" y2="275" stroke="#6b7280" stroke-width="1"/>
    <line x1="810" y1="300" x2="810" y2="275" stroke="#6b7280" stroke-width="1"/>
  </g>

  <path d="M 620 300 A 70 70 0 0 0 610.6 265" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="625" y="275" text-anchor="start" font-size="13">θ (yaw / pitch)</text>

  <line x1="775.16" y1="170" x2="775.16" y2="340" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="810" y1="300" x2="810" y2="340" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,4"/>

  <line x1="775.16" y1="330" x2="810" y2="330" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-red)" marker-end="url(#arr-red)"/>
  <text x="792.58" y="348" text-anchor="middle" fill="#c0392b" font-size="13">δ₂</text>

  <text x="260" y="390" text-anchor="middle" font-weight="bold" font-size="14">Похибка першого порядку</text>
  <text x="260" y="410" text-anchor="middle" font-size="13" fill="#6b7280">δ₁ = h · sin(θ) ≈ h · θ</text>
  <text x="260" y="430" text-anchor="middle" font-size="13" fill="#6b7280">Лінійна залежність від плеча Аббе</text>

  <text x="700" y="390" text-anchor="middle" font-weight="bold" font-size="14">Похибка другого порядку</text>
  <text x="700" y="410" text-anchor="middle" font-size="13" fill="#6b7280">δ₂ = L · (1 − cos(θ)) ≈ L · θ² / 2</text>
  <text x="700" y="430" text-anchor="middle" font-size="13" fill="#6b7280">Виникає навіть при h = 0</text>
</svg>
