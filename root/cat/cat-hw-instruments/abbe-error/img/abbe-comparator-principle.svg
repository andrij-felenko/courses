<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Підкладка полотна -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <defs>
    <!-- Маркери стрілок -->
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Принцип компаратора Аббе: співвісність шкали та вимірювання</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Зміщення осей створює плече L_A і похибку 1-го порядку (ΔL ≈ L_A · θ), колінеарність усуває важіль (L_A = 0)</text>

  <!-- ЛІВА ПАНЕЛЬ: Порушення принципу (штангенциркуль) -->
  <rect x="24" y="72" width="444" height="384" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Шапка лівої панелі -->
  <rect x="38" y="84" width="416" height="42" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="246" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">Штангенциркуль: порушення принципу</text>
  <text x="246" y="118" text-anchor="middle" font-size="12" fill="#6b7280">Осі шкали та вимірювання просторово розділені плечем L_A</text>

  <!-- Підпис осі шкали (вгорі) -->
  <text x="50" y="146" font-size="12" font-weight="bold" fill="#6b7280">Вісь шкали (напрямна штанга)</text>

  <!-- Напрямна штанга зі шкалою -->
  <rect x="50" y="158" width="310" height="24" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <!-- Штрихи шкали -->
  <path d="M 65 158 v 6 M 85 158 v 9 M 105 158 v 6 M 125 158 v 9 M 145 158 v 6 M 165 158 v 9 M 185 158 v 6 M 205 158 v 9 M 225 158 v 6 M 245 158 v 9 M 265 158 v 6 M 285 158 v 9 M 305 158 v 6 M 325 158 v 9 M 345 158 v 6" stroke="#6b7280" stroke-width="1.2" fill="none"/>

  <!-- Лінія осі шкали (штрихова) -->
  <line x1="50" y1="170" x2="360" y2="170" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Нерухома губка штангенциркуля (ліворуч) -->
  <path d="M 50 158 h 25 v 146 h -12 v -122 h -13 Z" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Підписи стану номіналу та деталі -->
  <text x="124" y="215" text-anchor="middle" font-size="12" fill="#6b7280">Номінал</text>
  <text x="124" y="230" text-anchor="middle" font-size="12" fill="#6b7280">(θ = 0)</text>
  <text x="124" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Деталь (L)</text>

  <!-- Вимірювана деталь (workpiece) -->
  <rect x="75" y="278" width="97" height="40" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Лінія осі вимірювання (акцентна синя, штрихова) -->
  <line x1="50" y1="298" x2="360" y2="298" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="6,4"/>
  <!-- Підпис осі вимірювання -->
  <text x="50" y="345" font-size="12" font-weight="bold" fill="#2457d6">Вісь вимірювання</text>

  <!-- Номінальне положення рухомої губки (без перекосу, θ = 0) -->
  <rect x="172" y="154" width="22" height="32" rx="2" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
  <path d="M 172 186 v 118 h 14 v -118" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,4"/>
  <circle cx="172" cy="298" r="3" fill="#6b7280"/>

  <!-- Перекошена рухома каретка і губка (кут θ) -->
  <!-- Центр обертання каретки біля (183, 170). Перекіс зміщує контакт управо на 16 px -->
  <polygon points="170,154 192,156 208,306 188,304" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
  <circle cx="188" cy="298" r="3.5" fill="#c0392b"/>

  <!-- Кут перекосу θ та позначення -->
  <line x1="183" y1="170" x2="183" y2="216" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <path d="M 183 205 A 35 35 0 0 1 187 205" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="216" y="208" font-size="12" font-weight="bold" fill="#c0392b">θ</text>
  <text x="228" y="208" font-size="12" fill="#6b7280">(перекіс)</text>

  <!-- Виносні лінії та розмір похибки ΔL на осі вимірювання -->
  <line x1="172" y1="301" x2="172" y2="325" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="188" y1="301" x2="188" y2="325" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="172" y1="322" x2="188" y2="322" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="196" y="326" font-size="12" font-weight="bold" fill="#c0392b">ΔL ≈ L_A · θ</text>
  <text x="196" y="342" font-size="12" fill="#c0392b">(похибка Аббе)</text>

  <!-- Плече Аббе L_A (виносні лінії та вертикальна стрілка) -->
  <line x1="360" y1="170" x2="390" y2="170" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="360" y1="298" x2="390" y2="298" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="382" y1="179" x2="382" y2="289" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-red)" marker-end="url(#arr-red)"/>
  <text x="394" y="226" font-size="14" font-weight="bold" fill="#c0392b">L_A</text>
  <text x="394" y="244" font-size="12" fill="#1a1a1a">Плече</text>
  <text x="394" y="258" font-size="12" fill="#6b7280">Аббе</text>
  <text x="394" y="272" font-size="12" fill="#c0392b">(L_A &gt; 0)</text>

  <!-- Підсумкова плашка лівої панелі -->
  <rect x="38" y="365" width="416" height="76" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="386" font-size="13" font-weight="bold" fill="#c0392b">Похибка 1-го порядку:  ΔL = L_A · tan θ ≈ L_A · θ</text>
  <text x="50" y="405" font-size="12" fill="#1a1a1a">Осі рознесені (L_A &gt; 0): кутовий люфт каретки θ</text>
  <text x="50" y="423" font-size="12" fill="#6b7280">переноситься через важіль L_A у лінійний зсув показів.</text>

  <!-- ПРАВА ПАНЕЛЬ: Дотримання принципу (мікрометр / компаратор) -->
  <rect x="492" y="72" width="444" height="384" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Шапка правої панелі -->
  <rect x="506" y="84" width="416" height="42" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="714" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Компаратор / мікрометр: принцип дотримано</text>
  <text x="714" y="118" text-anchor="middle" font-size="12" fill="#6b7280">Осі шкали та вимірювання колінеарні (L_A = 0)</text>

  <!-- Підпис спільної осі (вгорі) -->
  <text x="714" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Спільна вісь: вимірювання та шкала на одній лінії</text>

  <!-- Підписи компонентів (над елементами, без перетину з лінією осі) -->
  <text x="539" y="196" text-anchor="middle" font-size="12" fill="#6b7280">Упор</text>
  <text x="602" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Деталь (L)</text>
  <text x="677" y="196" text-anchor="middle" font-size="12" fill="#6b7280">Шпиндель</text>
  <text x="727" y="196" text-anchor="middle" font-size="12" fill="#6b7280">Втулка</text>
  <text x="827" y="196" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Еталонна шкала</text>

  <!-- Нерухомий упор (Anvil) -->
  <rect x="518" y="215" width="42" height="40" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Вимірювана деталь на осі -->
  <rect x="560" y="210" width="85" height="50" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Рухомий вимірювальний шпиндель -->
  <rect x="645" y="227" width="65" height="16" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="645" cy="235" r="3.5" fill="#27ae60"/>

  <!-- Напрямна втулка шпинделя -->
  <rect x="710" y="215" width="35" height="40" rx="3" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Еталонна шкала (на тій самій осі, позаду шпинделя) -->
  <rect x="745" y="215" width="165" height="40" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <!-- Штрихи шкали -->
  <path d="M 760 215 v 8 M 775 215 v 14 M 790 215 v 8 M 805 215 v 14 M 820 215 v 8 M 835 215 v 14 M 850 215 v 8 M 865 215 v 14 M 880 215 v 8 M 895 215 v 14" stroke="#27ae60" stroke-width="1.2" fill="none"/>

  <!-- Спільна вісь (штрихова лінія через усю конструкцію) -->
  <line x1="510" y1="235" x2="918" y2="235" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Пояснення співвісності під схемою -->
  <text x="714" y="286" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">L_A = 0  (плече Аббе відсутнє)</text>
  <text x="714" y="306" text-anchor="middle" font-size="12" fill="#1a1a1a">Вісь вимірювання та вісь шкали суворо колінеарні</text>
  <text x="714" y="324" text-anchor="middle" font-size="12" fill="#27ae60">Похибка 1-го порядку усунута:  ΔL₁ = L_A · θ = 0</text>
  <text x="714" y="342" text-anchor="middle" font-size="12" fill="#6b7280">Кутовий люфт шпинделя θ не посилюється плечем</text>

  <!-- Підсумкова плашка правої панелі -->
  <rect x="506" y="365" width="416" height="76" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="518" y="386" font-size="13" font-weight="bold" fill="#27ae60">Похибка 2-го порядку:  ΔL₂ ≈ L · θ² / 2  (ΔL₁ = 0)</text>
  <text x="518" y="405" font-size="12" fill="#1a1a1a">Осі колінеарні (L_A = 0): кутовий перекіс θ не має плеча.</text>
  <text x="518" y="423" font-size="12" fill="#6b7280">Залишковий зсув другого порядку мізерний (частки нанометра).</text>
</svg>
