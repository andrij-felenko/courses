<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Підкладка полотна -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <!-- Маркери стрілок -->
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Геометрична модель похибки Аббе</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Зміщення лінії вимірювання на плече L_A перетворює кут перекосу каретки θ на лінійне відхилення Δx</text>

  <!-- Напрямна рейка (Guideway rail) -->
  <rect x="60" y="348" width="570" height="26" rx="3" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Штрихи шкали на напрямній -->
  <path d="M 80 374 v -6 M 100 374 v -4 M 120 374 v -4 M 140 374 v -4 M 160 374 v -6 M 180 374 v -4 M 200 374 v -4 M 220 374 v -4 M 240 374 v -6 M 260 374 v -4 M 280 374 v -4 M 300 374 v -4 M 320 374 v -6 M 480 374 v -6 M 500 374 v -4 M 520 374 v -4 M 540 374 v -4 M 560 374 v -6 M 580 374 v -4 M 600 374 v -4 M 620 374 v -6" stroke="#6b7280" stroke-width="1.2" fill="none"/>

  <!-- Осі координат -->
  <!-- Вісь вимірювання -->
  <line x1="60" y1="160" x2="630" y2="160" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="60" y="142" font-size="12" font-weight="bold" fill="#2457d6">Вісь вимірювання (лінія контакту / щупа)</text>

  <!-- Вісь руху напрямної -->
  <line x1="60" y1="338" x2="630" y2="338" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="8,4"/>
  <text x="60" y="394" font-size="12" fill="#6b7280">Напрямна рейка / шкала приладу</text>
  <text x="60" y="412" font-size="12" fill="#6b7280">Вісь руху: зміщення вздовж рейки відсутнє (Δx_шкали = 0)</text>

  <!-- Плече Аббе L_A (виносні та розмірна лінія) -->
  <line x1="85" y1="160" x2="115" y2="160" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="85" y1="338" x2="115" y2="338" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="100" y1="226" x2="100" y2="162" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <line x1="100" y1="272" x2="100" y2="336" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="114" y="244" font-size="14" font-weight="bold" fill="#1a1a1a">L_A</text>
  <text x="114" y="262" font-size="12" fill="#6b7280">Плече Аббе</text>
  <text x="114" y="278" font-size="12" fill="#6b7280">(зміщення осей)</text>

  <!-- Номінальна каретка (θ = 0) -->
  <polygon points="345,356 475,356 475,320 424,320 424,170 435,170 435,150 385,150 385,170 396,170 396,320 345,320" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="410" y1="338" x2="410" y2="160" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
  <circle cx="410" cy="160" r="4" fill="#6b7280"/>
  <path d="M 410 172 L 398 172 L 398 160" fill="none" stroke="#6b7280" stroke-width="1.2"/>
  <text x="394" y="145" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="end">A₀</text>
  <text x="330" y="295" font-size="12" fill="#6b7280" text-anchor="end">Номінальне</text>
  <text x="330" y="311" font-size="12" fill="#6b7280" text-anchor="end">положення (θ = 0)</text>

  <!-- Перекошена каретка (кут θ) -->
  <polygon points="343.2,346.7 471.9,364.8 476.9,329.1 426.4,322.1 447.2,173.6 458.1,175.1 460.9,145.3 411.4,138.4 408.6,168.2 419.5,169.7 398.7,318.2 348.2,311.1" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <line x1="410" y1="338" x2="434.8" y2="161.7" stroke="#2457d6" stroke-width="2"/>
  <circle cx="434.8" cy="161.7" r="4.5" fill="#c0392b"/>
  <text x="450" y="145" font-size="12" font-weight="bold" fill="#c0392b">A₁</text>
  <text x="510" y="295" font-size="12" font-weight="bold" fill="#2457d6">Положення</text>
  <text x="510" y="311" font-size="12" fill="#2457d6">з перекосом (θ)</text>

  <!-- Центр обертання каретки -->
  <circle cx="410" cy="338" r="4.5" fill="#2457d6"/>
  <text x="410" y="432" font-size="12" fill="#2457d6" text-anchor="middle">Центр обертання каретки (люфт)</text>
  <line x1="410" y1="360" x2="410" y2="420" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Кут перекосу θ (дуга зі стрілкою) -->
  <path d="M 410 253 A 85 85 0 0 1 421.8 253.8" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="430" y="244" font-size="13" font-weight="bold" fill="#2457d6">θ</text>
  <text x="444" y="244" font-size="12" fill="#2457d6">(кут перекосу)</text>

  <!-- Лінійна похибка Аббе Δx на осі вимірювання -->
  <line x1="410" y1="155" x2="410" y2="100" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="435" y1="155" x2="435" y2="100" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="410" y1="108" x2="433" y2="108" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="422.5" y="74" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Похибка Аббе</text>
  <text x="422.5" y="90" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Δx ≈ L_A · θ</text>

  <!-- Права інформаційна панель -->
  <rect x="670" y="80" width="250" height="355" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="795" y="104" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розрахункові залежності</text>

  <!-- Блок формули похибки -->
  <rect x="684" y="118" width="222" height="78" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="795" y="138" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Похибка першого порядку:</text>
  <text x="795" y="162" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Δx = L_A · tan θ ≈ L_A · θ</text>
  <text x="795" y="182" font-size="12" fill="#c0392b" text-anchor="middle">для малих кутів θ (у радіанах)</text>

  <!-- Пояснення змінних -->
  <text x="696" y="216" font-size="12" fill="#1a1a1a">L_A — плече Аббе (зсув осей)</text>
  <text x="696" y="238" font-size="12" fill="#2457d6">θ — кутовий перекос (pitch/yaw)</text>
  <text x="696" y="260" font-size="12" fill="#c0392b">Δx — лінійна похибка Аббе</text>

  <!-- Блок принципу Аббе -->
  <rect x="684" y="282" width="222" height="138" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="795" y="304" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Принцип Аббе: L_A = 0</text>
  <text x="795" y="326" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Δx = 0 · θ = 0</text>
  <text x="795" y="350" font-size="12" fill="#1a1a1a" text-anchor="middle">Коли лінія вимірювання</text>
  <text x="795" y="370" font-size="12" fill="#1a1a1a" text-anchor="middle">збігається з віссю шкали,</text>
  <text x="795" y="390" font-size="12" fill="#1a1a1a" text-anchor="middle">кутовий перекос каретки</text>
  <text x="795" y="408" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">не викликає похибки</text>

</svg>
