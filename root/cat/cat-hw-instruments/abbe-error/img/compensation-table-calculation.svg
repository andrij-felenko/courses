<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Полотно -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <defs>
    <!-- Маркери стрілок -->
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Перерахунок кута відхилення та плеча Аббе в лінійну похибку</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Кутовий перекіс каретки θ на плечі L_A генерує лінійну похибку Δx = L_A · θ, яку ЧПУ компенсує поправкою -Δx</text>

  <!-- ЛІВА ПАНЕЛЬ: Геометрична схема механізму -->
  <rect x="24" y="74" width="540" height="382" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="44" y="100" font-size="14" font-weight="bold" fill="#1a1a1a">Геометрична схема відхилення каретки та плеча Аббе</text>
  <text x="44" y="118" font-size="12" fill="#6b7280">Кут перекосу напрямної θ транслюється через плече L_A у похибку інструмента Δx</text>

  <!-- Напрямна рейка (Guideway) -->
  <rect x="50" y="360" width="488" height="24" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <!-- Шкала на напрямній -->
  <line x1="70" y1="360" x2="70" y2="368" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="90" y1="360" x2="90" y2="366" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="110" y1="360" x2="110" y2="368" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="130" y1="360" x2="130" y2="366" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="150" y1="360" x2="150" y2="368" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="170" y1="360" x2="170" y2="366" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="190" y1="360" x2="190" y2="368" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="210" y1="360" x2="210" y2="366" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="230" y1="360" x2="230" y2="368" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="250" y1="360" x2="250" y2="366" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="270" y1="360" x2="270" y2="368" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="290" y1="360" x2="290" y2="366" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="310" y1="360" x2="310" y2="368" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="330" y1="360" x2="330" y2="366" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="350" y1="360" x2="350" y2="368" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="370" y1="360" x2="370" y2="366" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="390" y1="360" x2="390" y2="368" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="410" y1="360" x2="410" y2="366" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="430" y1="360" x2="430" y2="368" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="450" y1="360" x2="450" y2="366" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="470" y1="360" x2="470" y2="368" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="490" y1="360" x2="490" y2="366" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="510" y1="360" x2="510" y2="368" stroke="#6b7280" stroke-width="1.2"/>

  <!-- Лінія осі вимірювання / шкали -->
  <line x1="50" y1="345" x2="538" y2="345" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="50" y="404" font-size="12" fill="#6b7280">Напрямна рейка та лінійна шкала (вісь переміщення X)</text>
  <text x="50" y="420" font-size="12" fill="#6b7280">На шкалі похибка відсутня: Δx_шкали = 0 (точка обертання O)</text>

  <!-- Розмірна лінія плеча Аббе L_A -->
  <line x1="76" y1="185" x2="104" y2="185" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="76" y1="345" x2="104" y2="345" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="90" y1="245" x2="90" y2="187" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="90" y1="285" x2="90" y2="343" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="104" y="260" font-size="14" font-weight="bold" fill="#1a1a1a">L_A</text>
  <text x="104" y="278" font-size="12" fill="#6b7280">Плече Аббе</text>

  <!-- Номінальна каретка (θ = 0) -->
  <rect x="160" y="333" width="100" height="22" rx="3" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="210" y1="333" x2="210" y2="185" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
  <circle cx="210" cy="185" r="4" fill="#6b7280"/>
  <!-- Номінальний інструмент -->
  <path d="M 204 156 L 216 156 L 213 175 L 210 185 L 207 175 Z" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="200" y="146" font-size="12" fill="#6b7280" text-anchor="end">P₀ (номінал)</text>

  <!-- Кут 90 градусів у трикутнику похибки -->
  <path d="M 210 196 L 221 196 L 221 185" fill="none" stroke="#6b7280" stroke-width="1.2"/>

  <!-- Перекошена каретка (кут θ) -->
  <polygon points="159,343 257,326 261,344 163,361" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="210" y1="345" x2="238" y2="188" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Перекошений інструмент / шпиндель -->
  <polygon points="232,158 244,160 241,178 238,188 235,178" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="238" cy="188" r="4.5" fill="#c0392b" stroke="#ffffff" stroke-width="1.5"/>
  <text x="250" y="148" font-size="12" font-weight="bold" fill="#c0392b">P' (зміщений інструмент)</text>

  <!-- Точка обертання O на осі переміщення -->
  <circle cx="210" cy="345" r="4" fill="#1a1a1a"/>
  <text x="198" y="340" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">O</text>

  <!-- Дуга кута перекосу θ -->
  <path d="M 210 290 A 55 55 0 0 1 220 291" fill="none" stroke="#2457d6" stroke-width="2"/>
  <text x="223" y="280" font-size="13" font-weight="bold" fill="#2457d6">θ</text>
  <text x="236" y="280" font-size="12" fill="#2457d6">(кут перекосу)</text>

  <!-- Виносні лінії зміщення на рівні інструмента -->
  <line x1="210" y1="185" x2="210" y2="166" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="2,2"/>
  <line x1="238" y1="188" x2="238" y2="166" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="2,2"/>
  <line x1="210" y1="185" x2="210" y2="216" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="2,2"/>
  <line x1="238" y1="188" x2="238" y2="216" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="2,2"/>

  <!-- Вектор похибки Δx (червоний) -->
  <line x1="210" y1="172" x2="236" y2="172" stroke="#c0392b" stroke-width="2.2" marker-end="url(#arr-red)"/>
  <text x="250" y="171" font-size="13" font-weight="bold" fill="#c0392b">Δx = +L_A · θ</text>
  <text x="250" y="186" font-size="12" fill="#c0392b">Похибка інструмента</text>

  <!-- Вектор компенсації C(x) (зелений) -->
  <line x1="238" y1="208" x2="212" y2="208" stroke="#27ae60" stroke-width="2.2" marker-end="url(#arr-green)"/>
  <text x="250" y="208" font-size="13" font-weight="bold" fill="#27ae60">C(x) = -Δx</text>
  <text x="250" y="223" font-size="12" fill="#27ae60">Поправка ЧПУ</text>

  <!-- Інформаційний блок процесу перерахунку -->
  <rect x="360" y="240" width="190" height="96" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="372" y="262" font-size="12" font-weight="bold" fill="#1a1a1a">Принцип перерахунку:</text>
  <text x="372" y="280" font-size="12" fill="#6b7280">1. Замір кута θ(x) оптикою</text>
  <text x="372" y="298" font-size="12" fill="#6b7280">2. Множення на плече L_A</text>
  <text x="372" y="316" font-size="12" font-weight="bold" fill="#27ae60">3. Запис поправки C(x) = -Δx</text>

  <!-- ПРАВА ПАНЕЛЬ: Формули та таблиця компенсації -->
  <rect x="580" y="74" width="356" height="382" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Підпанель формул -->
  <rect x="596" y="90" width="324" height="138" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="612" y="114" font-size="13" font-weight="bold" fill="#1a1a1a">Математична модель перерахунку</text>

  <rect x="612" y="124" width="292" height="42" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="622" y="142" font-size="12" fill="#c0392b">Лінійна похибка Аббе (1-й порядок):</text>
  <text x="622" y="157" font-size="13" font-weight="bold" fill="#c0392b">Δx = L_A · tan(θ) ≈ L_A · θ_rad</text>

  <rect x="612" y="174" width="292" height="42" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="622" y="192" font-size="12" fill="#27ae60">Компенсуюча поправка в ЧПУ:</text>
  <text x="622" y="207" font-size="13" font-weight="bold" fill="#27ae60">C(x) = -Δx = -L_A · θ_rad</text>

  <!-- Підпанель таблиці компенсації -->
  <rect x="596" y="240" width="324" height="200" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="612" y="262" font-size="13" font-weight="bold" fill="#1a1a1a">Таблиця поправок ЧПУ (Grid X)</text>
  <text x="612" y="278" font-size="12" fill="#6b7280">База L_A = 200 мм (1" ≈ 4.85 мкрад ≈ 0.97 мкм)</text>

  <!-- Заголовок таблиці -->
  <rect x="608" y="288" width="300" height="24" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="618" y="304" font-size="12" font-weight="bold" fill="#2457d6">x [мм]</text>
  <text x="682" y="304" font-size="12" font-weight="bold" fill="#2457d6">θ [arcsec]</text>
  <text x="760" y="304" font-size="12" font-weight="bold" fill="#2457d6">Δx [мкм]</text>
  <text x="836" y="304" font-size="12" font-weight="bold" fill="#2457d6">C [мкм]</text>

  <!-- Рядок 1 -->
  <rect x="608" y="313" width="300" height="19" fill="#f4f6f8"/>
  <text x="622" y="327" font-size="12" fill="#1a1a1a">100</text>
  <text x="688" y="327" font-size="12" fill="#1a1a1a">+2.0"</text>
  <text x="764" y="327" font-size="12" font-weight="bold" fill="#c0392b">+1.94</text>
  <text x="840" y="327" font-size="12" font-weight="bold" fill="#27ae60">-1.94</text>

  <!-- Рядок 2 -->
  <rect x="608" y="333" width="300" height="19" fill="#ffffff"/>
  <text x="622" y="347" font-size="12" fill="#1a1a1a">200</text>
  <text x="688" y="347" font-size="12" fill="#1a1a1a">-3.5"</text>
  <text x="764" y="347" font-size="12" font-weight="bold" fill="#c0392b">-3.39</text>
  <text x="840" y="347" font-size="12" font-weight="bold" fill="#27ae60">+3.39</text>

  <!-- Рядок 3 -->
  <rect x="608" y="353" width="300" height="19" fill="#f4f6f8"/>
  <text x="622" y="367" font-size="12" fill="#1a1a1a">300</text>
  <text x="688" y="367" font-size="12" fill="#1a1a1a">+1.2"</text>
  <text x="764" y="367" font-size="12" font-weight="bold" fill="#c0392b">+1.16</text>
  <text x="840" y="367" font-size="12" font-weight="bold" fill="#27ae60">-1.16</text>

  <!-- Рядок 4 -->
  <rect x="608" y="373" width="300" height="19" fill="#ffffff"/>
  <text x="622" y="387" font-size="12" fill="#1a1a1a">400</text>
  <text x="688" y="387" font-size="12" fill="#1a1a1a">+4.1"</text>
  <text x="764" y="387" font-size="12" font-weight="bold" fill="#c0392b">+3.98</text>
  <text x="840" y="387" font-size="12" font-weight="bold" fill="#27ae60">-3.98</text>

  <!-- Рамка та вертикальні розділювачі таблиці -->
  <rect x="608" y="288" width="300" height="105" rx="3" fill="none" stroke="#d0d7de" stroke-width="1"/>
  <line x1="668" y1="288" x2="668" y2="393" stroke="#d0d7de" stroke-width="1"/>
  <line x1="748" y1="288" x2="748" y2="393" stroke="#d0d7de" stroke-width="1"/>
  <line x1="826" y1="288" x2="826" y2="393" stroke="#d0d7de" stroke-width="1"/>

  <!-- Підсумкова формула внизу таблиці -->
  <rect x="608" y="403" width="300" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="758" y="420" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">x_corr = x_enc + C(x) = x_enc - Δx</text>
</svg>
