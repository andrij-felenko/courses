<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrGreen" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#27ae60"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#c0392b"/>
    </marker>
    <marker id="arrBlue" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Заголовок -->
  <text x="480" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Похибка Аббе у вимірювальних приладах</text>
  <text x="480" y="65" text-anchor="middle" font-size="13" fill="#6b7280">Вплив кутових відхилень на точність при колінеарному та позаосьовому розміщенні шкали</text>

  <!-- ЛІВА ПАНЕЛЬ -->
  <rect x="30" y="100" width="430" height="420" fill="#f4f6f8" stroke="#d0d7de" rx="6"/>
  <text x="245" y="135" text-anchor="middle" font-size="15" font-weight="bold" fill="#27ae60">Колінеарне розміщення (принцип Аббе)</text>
  <text x="245" y="155" text-anchor="middle" font-size="13" fill="#6b7280">Вісь вимірювання та шкала лежать на одній прямій</text>

  <!-- Направляюча (Ліва) -->
  <line x1="50" y1="440" x2="440" y2="440" stroke="#6b7280" stroke-width="2"/>
  <text x="60" y="465" font-size="12" fill="#6b7280">Направляюча (з перекосом)</text>

  <!-- Шкала (Ліва) -->
  <line x1="50" y1="260" x2="440" y2="260" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M100,260 L100,265 M150,260 L150,265 M200,260 L200,265 M250,260 L250,265 M300,260 L300,265 M350,260 L350,265 M400,260 L400,265" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="60" y="245" font-size="12" fill="#1a1a1a" font-weight="bold">Спільна вісь: шкала + вимірювання</text>

  <!-- Об'єкт (Ліва) -->
  <line x1="80" y1="280" x2="80" y2="210" stroke="#6b7280" stroke-width="3" stroke-linecap="round"/>
  <rect x="80" y="250" width="160" height="20" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="160" y="240" text-anchor="middle" font-size="12" fill="#27ae60">Об'єкт (L)</text>

  <!-- Рухома губка (Ліва) -->
  <line x1="280" y1="440" x2="280" y2="210" stroke="#d0d7de" stroke-width="6" stroke-dasharray="6,4" stroke-linecap="round"/>
  <line x1="280" y1="440" x2="227" y2="200" stroke="#27ae60" stroke-width="6" stroke-linecap="round"/>
  
  <circle cx="280" cy="440" r="5" fill="#1a1a1a"/>
  <circle cx="240" cy="260" r="5" fill="#27ae60"/>

  <path d="M280,380 A60,60 0 0,0 267,382" fill="none" stroke="#1a1a1a" marker-end="url(#arr)"/>
  <text x="260" y="375" text-anchor="end" font-size="13" font-style="italic">θ</text>

  <path d="M330,195 L250,250" stroke="#27ae60" fill="none" marker-end="url(#arrGreen)"/>
  <text x="340" y="180" text-anchor="middle" font-size="12" fill="#27ae60">Показ збігається з L</text>
  <text x="340" y="195" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Похибка ≈ 0</text>


  <!-- ПРАВА ПАНЕЛЬ -->
  <rect x="500" y="100" width="430" height="420" fill="#f4f6f8" stroke="#d0d7de" rx="6"/>
  <text x="715" y="135" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">Позаосьове розміщення</text>
  <text x="715" y="155" text-anchor="middle" font-size="13" fill="#6b7280">Вісь шкали віддалена від осі вимірювання</text>

  <!-- Направляюча та шкала (Права) -->
  <line x1="520" y1="440" x2="910" y2="440" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M550,440 L550,435 M600,440 L600,435 M650,440 L650,435 M700,440 L700,435 M750,440 L750,435 M800,440 L800,435 M850,440 L850,435" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="530" y="465" font-size="12" fill="#1a1a1a" font-weight="bold">Направляюча та шкала</text>

  <!-- Вісь вимірювання (Права) -->
  <line x1="520" y1="260" x2="910" y2="260" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="530" y="245" font-size="12" fill="#6b7280">Вісь вимірювання</text>

  <!-- Об'єкт (Права) -->
  <line x1="550" y1="280" x2="550" y2="210" stroke="#6b7280" stroke-width="3" stroke-linecap="round"/>
  <rect x="550" y="250" width="150" height="20" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="625" y="240" text-anchor="middle" font-size="12" fill="#c0392b">Об'єкт (L)</text>

  <!-- Рухома губка (Права) -->
  <line x1="740" y1="440" x2="740" y2="210" stroke="#d0d7de" stroke-width="6" stroke-dasharray="6,4" stroke-linecap="round"/>
  <line x1="740" y1="440" x2="687" y2="200" stroke="#c0392b" stroke-width="6" stroke-linecap="round"/>

  <circle cx="740" cy="440" r="5" fill="#c0392b"/>
  <circle cx="700" cy="260" r="5" fill="#c0392b"/>

  <path d="M740,380 A60,60 0 0,0 727,382" fill="none" stroke="#1a1a1a" marker-end="url(#arr)"/>
  <text x="720" y="375" text-anchor="end" font-size="13" font-style="italic">θ</text>

  <!-- Похибка (Права) -->
  <line x1="700" y1="260" x2="700" y2="300" stroke="#c0392b" stroke-width="1"/>
  <line x1="740" y1="440" x2="740" y2="300" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
  
  <line x1="718" y1="290" x2="702" y2="290" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrRed)"/>
  <line x1="722" y1="290" x2="738" y2="290" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arrRed)"/>
  <text x="720" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Δ = h · θ</text>

  <path d="M810,470 L750,445" stroke="#c0392b" fill="none" marker-end="url(#arrRed)"/>
  <text x="815" y="475" text-anchor="start" font-size="12" fill="#c0392b">Показ шкали</text>

  <path d="M630,205 L690,250" stroke="#c0392b" fill="none" marker-end="url(#arrRed)"/>
  <text x="625" y="195" text-anchor="middle" font-size="12" fill="#c0392b">Фактичний край</text>

  <!-- Плече Аббе (Права) -->
  <line x1="860" y1="260" x2="860" y2="440" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arrBlue)" marker-end="url(#arrBlue)"/>
  <text x="870" y="345" text-anchor="start" font-size="14" fill="#2457d6" font-style="italic" font-weight="bold">h</text>
  <text x="870" y="360" text-anchor="start" font-size="12" fill="#2457d6">Плече Аббе</text>

</svg>
