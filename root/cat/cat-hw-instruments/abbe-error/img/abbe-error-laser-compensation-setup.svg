<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Двокоординатний стіл із цифровою компенсацією похибки Аббе</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Багатоканальний інтерферометр вимірює кут перекосу θ для усунення похибки в робочій точці</text>

  <!-- ЛІВА ПАНЕЛЬ: Лазерна вимірювальна система -->
  <rect x="30" y="80" width="175" height="365" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="117" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Лазерна система</text>
  <text x="117" y="123" text-anchor="middle" font-size="12" fill="#6b7280">Нерухома станина</text>
  <text x="117" y="139" text-anchor="middle" font-size="12" fill="#6b7280">Двоканальний блок</text>

  <!-- Канал 1: Лінійний -->
  <rect x="42" y="160" width="151" height="75" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="117" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Канал 1: Лінійний</text>
  <text x="117" y="202" text-anchor="middle" font-size="12" fill="#1a1a1a">Вимірює зсув x₁</text>
  <text x="117" y="219" text-anchor="middle" font-size="12" fill="#6b7280">Осьовий детектор</text>

  <!-- Канал 2: Кутовий -->
  <rect x="42" y="250" width="151" height="75" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="117" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Канал 2: Кутовий</text>
  <text x="117" y="292" text-anchor="middle" font-size="12" fill="#1a1a1a">Вимірює зсув x₂</text>
  <text x="117" y="309" text-anchor="middle" font-size="12" fill="#6b7280">Кутовий детектор</text>

  <!-- Блок оптичної бази -->
  <rect x="42" y="340" width="151" height="90" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="117" y="364" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Оптична база b</text>
  <text x="117" y="383" text-anchor="middle" font-size="12" fill="#6b7280">Відстань між осями</text>
  <text x="117" y="402" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">b = |y₂ - y₁|</text>
  <text x="117" y="418" text-anchor="middle" font-size="12" fill="#6b7280">еталонна база</text>

  <!-- СЕРЕДНЯ ПАНЕЛЬ: Двокоординатний стіл -->
  <rect x="225" y="80" width="460" height="365" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="455" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Двокоординатний стіл (X-Y Stage)</text>

  <!-- Напрямні осі X -->
  <line x1="235" y1="126" x2="675" y2="126" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="240" y="120" font-size="12" fill="#6b7280">Напрямна осі X</text>
  <line x1="235" y1="432" x2="675" y2="432" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 3"/>
  <text x="240" y="426" font-size="12" fill="#6b7280">Напрямна осі X</text>

  <!-- Каретка осі X -->
  <rect x="425" y="132" width="245" height="286" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Вкладений блок: Робоча зона і точка вимірювання -->
  <rect x="438" y="142" width="219" height="52" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <circle cx="456" cy="168" r="5" fill="#c0392b"/>
  <circle cx="456" cy="168" r="9" fill="none" stroke="#c0392b" stroke-width="1"/>
  <text x="472" y="162" font-size="12" font-weight="bold" fill="#c0392b">Точка вимірювання</text>
  <text x="472" y="179" font-size="12" fill="#c0392b">(робоча точка / деталь)</text>

  <!-- Похибка Аббе в точці вимірювання (стрілка зміщення) -->
  <line x1="600" y1="168" x2="642" y2="168" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="621" y="159" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Δx</text>

  <!-- Вкладений блок: Супорт осі Y -->
  <rect x="438" y="202" width="219" height="52" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
  <text x="547" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Супорт осі Y</text>
  <text x="547" y="242" text-anchor="middle" font-size="12" fill="#6b7280">поперечний рух столу</text>

  <!-- Вкладений блок: Каретка X та перекос -->
  <rect x="438" y="262" width="219" height="146" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="555" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Каретка осі X</text>
  <text x="555" y="302" text-anchor="middle" font-size="12" fill="#6b7280">поздовжнє переміщення</text>

  <!-- Кут перекосу (yaw) ілюстрація всередині каретки X -->
  <line x1="460" y1="320" x2="460" y2="390" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 2"/>
  <line x1="460" y1="320" x2="475" y2="390" stroke="#c0392b" stroke-width="1.5"/>
  <path d="M 460 365 A 45 45 0 0 1 469 363" fill="none" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="478" y="367" font-size="12" font-weight="bold" fill="#c0392b">θ (yaw)</text>

  <text x="575" y="345" text-anchor="middle" font-size="12" fill="#1a1a1a">Кут перекосу напрямних:</text>
  <text x="575" y="365" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">θ ≈ (x₁ - x₂) / b</text>
  <text x="575" y="385" text-anchor="middle" font-size="12" fill="#c0392b">Δx = d_Abbe · θ</text>

  <!-- ЛАЗЕРНІ ПРОМЕНІ -->
  <!-- Промінь 1 -->
  <line x1="193" y1="197" x2="426" y2="197" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="307" y="214" text-anchor="middle" font-size="12" fill="#2457d6">Осьовий промінь X (x₁)</text>

  <!-- Промінь 2 -->
  <line x1="193" y1="287" x2="426" y2="287" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="307" y="304" text-anchor="middle" font-size="12" fill="#2457d6">Кутовий промінь (x₂)</text>

  <!-- Відбивачі (ретрорефлектори) всередині лівого торця каретки X -->
  <rect x="426" y="187" width="8" height="20" rx="1" fill="#6b7280"/>
  <rect x="426" y="277" width="8" height="20" rx="1" fill="#6b7280"/>

  <!-- Розмір бази b між променями -->
  <line x1="395" y1="203" x2="395" y2="281" stroke="#1a1a1a" stroke-width="1.2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="385" y="246" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">База b</text>

  <!-- Плече Аббе d_Abbe (між віссю променя 1 та точкою вимірювання) -->
  <line x1="228" y1="168" x2="438" y2="168" stroke="#c0392b" stroke-width="1" stroke-dasharray="4 2"/>
  <line x1="365" y1="174" x2="365" y2="191" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-red)" marker-end="url(#arr-red)"/>
  <text x="355" y="186" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">d_Abbe</text>

  <!-- ПРАВА ПАНЕЛЬ: Блок компенсації -->
  <rect x="705" y="80" width="225" height="365" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="817" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Блок компенсації</text>
  <text x="817" y="123" text-anchor="middle" font-size="12" fill="#27ae60" font-weight="bold">Контролер ЧПУ / DSP</text>

  <text x="718" y="150" font-size="12" font-weight="bold" fill="#1a1a1a">1. Виміряні сигнали:</text>
  <text x="728" y="168" font-size="12" fill="#2457d6">• x₁ — лінійне положення</text>
  <text x="728" y="186" font-size="12" fill="#2457d6">• x₂ — кутовий канал</text>
  <text x="728" y="204" font-size="12" fill="#6b7280">• b — калібрована база</text>
  <text x="728" y="222" font-size="12" fill="#c0392b">• d_Abbe — плече до точки</text>

  <text x="718" y="250" font-size="12" font-weight="bold" fill="#1a1a1a">2. Кут перекосу (yaw):</text>
  <rect x="718" y="258" width="199" height="32" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="817" y="279" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">θ = (x₁ - x₂) / b</text>

  <text x="718" y="312" font-size="12" font-weight="bold" fill="#1a1a1a">3. Похибка Аббе:</text>
  <rect x="718" y="320" width="199" height="32" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="817" y="341" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Δx = d_Abbe · θ</text>

  <text x="718" y="374" font-size="12" font-weight="bold" fill="#1a1a1a">4. Точна координата:</text>
  <rect x="718" y="382" width="199" height="34" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="817" y="404" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">x_corr = x₁ - Δx</text>

  <!-- Шина передачі даних -->
  <path d="M 117 445 L 117 475 L 817 475 L 817 450" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arr-green)"/>
  <text x="465" y="495" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Шина зворотного зв'язку: передача координат (x₁, x₂) у контролер</text>
  <text x="465" y="515" text-anchor="middle" font-size="12" fill="#6b7280">Компенсація кутового перекосу в реальному часі усуває похибку Аббе</text>
</svg>
