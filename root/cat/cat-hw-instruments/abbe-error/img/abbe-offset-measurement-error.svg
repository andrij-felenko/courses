<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Маркери для стрілок -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="40" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Похибка Аббе</text>
  <text x="480" y="65" font-size="13" text-anchor="middle" fill="#6b7280">Зміщення осі вимірювання відносно осі шкали перетворює кутовий люфт на лінійну похибку</text>

  <!-- Направляюча (шкала) -->
  <rect x="100" y="310" width="760" height="40" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  
  <!-- Штрихи шкали -->
  <g stroke="#6b7280" stroke-width="1.5" fill="none">
    <path d="M 200 350 v -10 M 210 350 v -5 M 220 350 v -5 M 230 350 v -5 M 240 350 v -5 
             M 250 350 v -10 M 260 350 v -5 M 270 350 v -5 M 280 350 v -5 M 290 350 v -5 
             M 300 350 v -10 M 310 350 v -5 M 320 350 v -5 M 330 350 v -5 M 340 350 v -5 
             M 350 350 v -10 M 360 350 v -5 M 370 350 v -5 M 380 350 v -5 M 390 350 v -5 
             M 400 350 v -10 M 410 350 v -5 M 420 350 v -5 M 430 350 v -5 M 440 350 v -5 
             M 450 350 v -10 M 460 350 v -5 M 470 350 v -5 M 480 350 v -5 M 490 350 v -5 
             M 500 350 v -10 M 510 350 v -5 M 520 350 v -5 M 530 350 v -5 M 540 350 v -5 
             M 550 350 v -10 M 560 350 v -5 M 570 350 v -5 M 580 350 v -5 M 590 350 v -5 
             M 600 350 v -10 M 610 350 v -5 M 620 350 v -5 M 630 350 v -5 M 640 350 v -5 
             M 650 350 v -10 M 660 350 v -5 M 670 350 v -5 M 680 350 v -5 M 690 350 v -5 
             M 700 350 v -10 M 710 350 v -5 M 720 350 v -5 M 730 350 v -5 M 740 350 v -5 
             M 750 350 v -10"/>
  </g>

  <!-- Ідеальний повзун (без перекосу) -->
  <path d="M 400 306 L 450 306 L 450 190 L 350 190 L 350 130 L 490 130 L 490 306 L 560 306 L 560 354 L 400 354 Z" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6,4" />

  <!-- Повзун із перекосом (повернутий на 8 градусів) -->
  <path d="M 400 306 L 450 306 L 450 190 L 350 190 L 350 130 L 490 130 L 490 306 L 560 306 L 560 354 L 400 354 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" transform="rotate(8, 480, 330)" />

  <!-- Осі (малюємо поверх повзунів для наочності геометрії) -->
  <text x="100" y="322" fill="#6b7280" font-size="13">Вісь шкали (направляючої)</text>
  <line x1="80" y1="330" x2="880" y2="330" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="8,4"/>
  
  <text x="100" y="152" fill="#6b7280" font-size="13">Лінія вимірювання</text>
  <line x1="80" y1="160" x2="880" y2="160" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="8,4"/>

  <!-- Повернута вісь повзуна -->
  <line x1="200" y1="330" x2="720" y2="330" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6,4" transform="rotate(8, 480, 330)"/>

  <!-- Точка обертання -->
  <circle cx="480" cy="330" r="4" fill="#c0392b"/>

  <!-- Розмір h (Плече Аббе) -->
  <line x1="800" y1="225" x2="800" y2="162" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="800" y1="265" x2="800" y2="328" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="800" y="250" fill="#1a1a1a" font-size="14" font-weight="bold" font-style="italic" text-anchor="middle">h</text>
  <text x="815" y="244" fill="#6b7280" font-size="13">Плече Аббе</text>
  <text x="815" y="259" fill="#6b7280" font-size="13">(зміщення осі)</text>

  <!-- Кут перекосу θ -->
  <path d="M 680 330 A 200 200 0 0 1 678 357.8" stroke="#c0392b" stroke-width="1.5" fill="none" marker-end="url(#arr-red)"/>
  <text x="690" y="348" fill="#c0392b" font-weight="bold" font-size="14">θ</text>
  <text x="705" y="344" fill="#c0392b" font-size="13">Кутовий перекіс</text>
  <text x="705" y="359" fill="#c0392b" font-size="13">повзуна (люфт)</text>

  <!-- Лінії проекції для похибки та стрілка ΔL -->
  <line x1="350" y1="105" x2="350" y2="160" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="373" y1="105" x2="373" y2="160" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="350" y1="112" x2="371" y2="112" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Текст для похибки -->
  <text x="361.5" y="86" fill="#c0392b" font-size="14" text-anchor="middle">Похибка Аббе</text>
  <text x="361.5" y="104" fill="#c0392b" font-size="14" font-weight="bold" text-anchor="middle">ΔL</text>

  <!-- Блок із формулою -->
  <g transform="translate(100, 180)">
    <rect x="0" y="0" width="160" height="56" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="80" y="24" fill="#c0392b" font-weight="bold" font-size="14" text-anchor="middle">ΔL ≈ h × θ</text>
    <text x="80" y="44" fill="#c0392b" font-size="12" text-anchor="middle">де θ у радіанах</text>
  </g>
</svg>
