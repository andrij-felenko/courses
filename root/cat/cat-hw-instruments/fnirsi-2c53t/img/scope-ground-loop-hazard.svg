<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Ризик заземлювальної петлі каналів осцилографа та ізоляція мультиметра</text>
  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Спільна земля CH1/CH2 створює небезпеку короткого замикання, тоді як мультиметр є гальванічно ізольованим</text>

  <!-- LEFT PANEL: HAZARD / PROBLEM -->
  <rect x="30" y="75" width="435" height="360" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="247" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">УВАГА: Спільна земля каналів CH1 та CH2</text>

  <!-- Left: Circuit Under Test (DUT) -->
  <rect x="50" y="125" width="170" height="130" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="135" y="147" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Досліджуване коло (DUT)</text>
  <text x="135" y="172" text-anchor="middle" font-size="12" fill="#6b7280">Точка A (0 В / Земля)</text>
  <rect x="110" y="182" width="50" height="20" rx="3" fill="#f4f6f8" stroke="#6b7280"/>
  <text x="135" y="196" text-anchor="middle" font-size="12" fill="#1a1a1a">R_load</text>
  <text x="135" y="232" text-anchor="middle" font-size="12" fill="#c0392b">Точка B (+12 В потенціал)</text>

  <!-- Left: Oscilloscope Block -->
  <rect x="260" y="125" width="185" height="130" rx="6" fill="white" stroke="#c0392b" stroke-width="1.5"/>
  <text x="352" y="147" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Осцилограф 2C53T</text>
  
  <rect x="275" y="165" width="70" height="35" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="310" y="187" text-anchor="middle" font-size="12" fill="#2457d6">CH1</text>
  
  <rect x="360" y="165" width="70" height="35" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="395" y="187" text-anchor="middle" font-size="12" fill="#2457d6">CH2</text>

  <!-- Left: Common Ground Line inside scope -->
  <path d="M 310 200 L 310 230 L 395 230 L 395 200" stroke="#c0392b" stroke-width="3" fill="none"/>
  <text x="352" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Спільна шина GND</text>

  <!-- Left: Short Circuit Current Path (Dashed Red Line) -->
  <path d="M 175 225 L 360 225 L 360 200 M 310 200 L 310 215 L 175 170" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="5,4" fill="none" marker-end="url(#arr-red)"/>

  <!-- Left: Hazard Description Box -->
  <rect x="50" y="275" width="395" height="140" rx="6" fill="white" stroke="#c0392b" stroke-width="1"/>
  <text x="247" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">НЕБЕЗПЕКА: Коротке замикання!</text>
  <text x="247" y="323" text-anchor="middle" font-size="12" fill="#1a1a1a">Приєднавши крокодил GND CH2 до +12 В (Точка B),</text>
  <text x="247" y="345" text-anchor="middle" font-size="12" fill="#1a1a1a">через спільну шину осцилографа виникає струм КЗ</text>
  <text x="247" y="367" text-anchor="middle" font-size="12" stroke="none" fill="#c0392b" font-weight="bold">I_short → сплавлення заземлювального провідника!</text>
  <text x="247" y="390" text-anchor="middle" font-size="12" fill="#6b7280">Рішення: вимірювати диференційно або використовувати DMM</text>

  <!-- RIGHT PANEL: SAFE / SOLUTION -->
  <rect x="495" y="75" width="435" height="360" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="712" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">БЕЗПЕКА: Гальванічна ізоляція мультиметра</text>

  <!-- Right: Circuit Under Test (DUT) -->
  <rect x="515" y="125" width="170" height="130" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="600" y="147" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Досліджуване коло (DUT)</text>
  <text x="600" y="172" text-anchor="middle" font-size="12" fill="#6b7280">Точка A (0 В)</text>
  <rect x="575" y="182" width="50" height="20" rx="3" fill="#f4f6f8" stroke="#6b7280"/>
  <text x="600" y="196" text-anchor="middle" font-size="12" fill="#1a1a1a">R_load</text>
  <text x="600" y="232" text-anchor="middle" font-size="12" fill="#27ae60">Точка B (+12 В)</text>

  <!-- Right: Multimeter Block with Isolation -->
  <rect x="725" y="125" width="185" height="130" rx="6" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <text x="817" y="147" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Мультиметр 2C53T</text>

  <rect x="735" y="165" width="65" height="35" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="767" y="187" text-anchor="middle" font-size="12" fill="#27ae60">V / COM</text>

  <!-- Isolation Barrier -->
  <rect x="815" y="165" width="80" height="75" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-dasharray="3,3"/>
  <text x="855" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Оптопара /</text>
  <text x="855" y="217" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Ізоляція</text>

  <!-- Safe Connection Lines -->
  <line x1="735" y1="175" x2="640" y2="170" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="735" y1="190" x2="640" y2="225" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Right: Safety Description Box -->
  <rect x="515" y="275" width="395" height="140" rx="6" fill="white" stroke="#27ae60" stroke-width="1"/>
  <text x="712" y="298" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">ПОВНА БЕЗПЕКА: Вимірювання без ризику</text>
  <text x="712" y="323" text-anchor="middle" font-size="12" fill="#1a1a1a">Входи DMM гальванічно відокремлені від схеми</text>
  <text x="712" y="345" text-anchor="middle" font-size="12" fill="#1a1a1a">осцилографа й корпусного заземлення приладу.</text>
  <text x="712" y="367" text-anchor="middle" font-size="12" fill="#27ae60" font-weight="bold">I_short = 0 А → КЗ та замкнені петлі відсутні!</text>
  <text x="712" y="390" text-anchor="middle" font-size="12" fill="#6b7280">Можна безпечно вимірювати різницю потенціалів між будь-якими точками</text>
</svg>
