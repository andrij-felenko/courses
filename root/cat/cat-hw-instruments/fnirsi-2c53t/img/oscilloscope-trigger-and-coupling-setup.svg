<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема аналогового тракту, AC/DC розв'язки та тригера FNIRSI 2C53T</text>
  <text x="480" y="55" font-size="13" fill="#6b7280" text-anchor="middle">Компенсація щупа 10X узгоджує вхідну ємність, розв'язка AC відсікає постійний зсув, а тригер стабілізує сигнал</text>

  <!-- =================Панель 1: 10X Щуп і компенсація================= -->
  <rect x="30" y="85" width="215" height="245" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="137" y="108" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">1. 10X Щуп і компенсація</text>
  
  <!-- Схема щупа 10X -->
  <circle cx="45" cy="155" r="3" fill="#2457d6"/>
  <text x="45" y="142" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">V_in</text>
  <line x1="45" y1="155" x2="65" y2="155" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Паралельне з'єднання R_p та C_p -->
  <line x1="65" y1="135" x2="65" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Верхня гілка: Резистор R_p = 9M -->
  <line x1="65" y1="135" x2="75" y2="135" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="75" y="127" width="30" height="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="90" y="122" font-size="10" font-weight="bold" fill="#1a1a1a" text-anchor="middle">9 M Ом</text>
  <line x1="105" y1="135" x2="115" y2="135" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Нижня гілка: Конденсатор C_p (підбудовний) -->
  <line x1="65" y1="175" x2="84" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="84" y1="167" x2="84" y2="183" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="90" y1="167" x2="90" y2="183" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="78" y1="185" x2="96" y2="165" stroke="#2457d6" stroke-dasharray="2,2" stroke-width="1.2"/>
  <line x1="90" y1="175" x2="115" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="90" y="196" font-size="10" fill="#2457d6" text-anchor="middle">C_p (підбудова)</text>

  <line x1="115" y1="135" x2="115" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="115" y1="155" x2="140" y2="155" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Кабель та Вхід BNC (R_in=1M, C_in=20pF) -->
  <rect x="140" y="145" width="20" height="20" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="150" y="139" font-size="10" fill="#6b7280" text-anchor="middle">BNC</text>
  <line x1="160" y1="155" x2="185" y2="155" stroke="#1a1a1a" stroke-width="1.5"/>
  
  <line x1="185" y1="155" x2="185" y2="165" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="175" y="165" width="20" height="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="185" y="191" font-size="10" fill="#6b7280" text-anchor="middle">1M || 20pF</text>
  <line x1="185" y1="177" x2="185" y2="185" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Внутрішня підпанель форм компенсації -->
  <rect x="40" y="210" width="195" height="110" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="137" y="226" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Форма тесту 1 кГц (CAL):</text>

  <path d="M46,275 L54,275 L55,242 L64,252 L74,252 L74,275 L82,275" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <text x="62" y="295" font-size="10" fill="#c0392b" text-anchor="middle">Завелика C_p</text>

  <path d="M114,275 L122,275 Q128,260 136,252 L145,252 L145,275 L153,275" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <text x="133" y="295" font-size="10" fill="#c0392b" text-anchor="middle">Замала C_p</text>

  <path d="M178,275 L186,275 L186,252 L208,252 L208,275 L216,275" fill="none" stroke="#27ae60" stroke-width="2"/>
  <text x="197" y="295" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">Норма 10X</text>
  <text x="137" y="312" font-size="10" fill="#6b7280" text-anchor="middle">Умова: C_p · R_p = C_in · R_in</text>

  <!-- Стрілка зв'язку 1 -> 2 -->
  <path d="M245,155 L260,155" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- =================Панель 2: Перемикач AC / DC================= -->
  <rect x="260" y="85" width="195" height="245" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="357" y="108" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">2. Перемикач AC / DC</text>

  <circle cx="275" cy="155" r="3" fill="#1a1a1a"/>
  
  <line x1="275" y1="155" x2="295" y2="135" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="295" y1="135" x2="385" y2="135" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="385" cy="135" r="3" fill="#27ae60"/>
  <text x="340" y="127" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">DC: Прямий зв'язок</text>

  <line x1="275" y1="155" x2="295" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="295" y1="175" x2="325" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="325" y1="167" x2="325" y2="183" stroke="#2457d6" stroke-width="2"/>
  <line x1="331" y1="167" x2="331" y2="183" stroke="#2457d6" stroke-width="2"/>
  <line x1="331" y1="175" x2="385" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="385" cy="175" r="3" fill="#2457d6"/>
  <text x="340" y="194" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="middle">AC: C_ac = 100 нФ</text>

  <line x1="415" y1="155" x2="387" y2="173" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="415" cy="155" r="3" fill="#1a1a1a"/>
  <line x1="415" y1="155" x2="440" y2="155" stroke="#1a1a1a" stroke-width="1.5"/>

  <rect x="270" y="210" width="175" height="110" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="357" y="228" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Властивості розв'язки:</text>
  <text x="357" y="248" font-size="10" fill="#27ae60" text-anchor="middle">DC: V_out = V_dc + V_ac</text>
  <text x="357" y="264" font-size="10" fill="#6b7280" text-anchor="middle">(пропускає 0 Гц ... 50 МГц)</text>
  <text x="357" y="286" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="middle">AC: V_out = V_ac</text>
  <text x="357" y="304" font-size="10" fill="#6b7280" text-anchor="middle">(відсікає постійний зсув)</text>

  <!-- Стрілка зв'язку 2 -> 3 -->
  <path d="M455,155 L470,155" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- =================Панель 3: Вхідний дільник і ПВШ================= -->
  <rect x="470" y="85" width="200" height="245" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="570" y="108" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">3. Вхідний дільник і ПВШ</text>

  <line x1="480" y1="155" x2="500" y2="155" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="500" y="140" width="40" height="30" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="520" y="153" font-size="10" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1X/10X</text>
  <text x="520" y="164" font-size="10" fill="#6b7280" text-anchor="middle">Атен.</text>

  <line x1="540" y1="155" x2="570" y2="155" stroke="#1a1a1a" stroke-width="1.5"/>

  <polygon points="570,135 620,155 570,175" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="585" y="158" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="middle">PGA</text>

  <line x1="620" y1="155" x2="655" y2="155" stroke="#1a1a1a" stroke-width="1.5"/>

  <rect x="480" y="210" width="180" height="110" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="570" y="228" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Масштабування V/div:</text>
  <text x="570" y="248" font-size="10" fill="#1a1a1a" text-anchor="middle">Кроки: 10 мВ/діл ... 10 В/діл</text>
  <text x="570" y="268" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="middle">Нормалізація для АЦП</text>
  <text x="570" y="288" font-size="10" fill="#6b7280" text-anchor="middle">Амплітуда на виході PGA:</text>
  <text x="570" y="306" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">±1.0 В (Dynamic Range)</text>

  <!-- Стрілка зв'язку 3 -> 4 -->
  <path d="M670,155 L685,155" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- =================Панель 4: Вузол тригера й АЦП================= -->
  <rect x="685" y="85" width="245" height="245" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="807" y="108" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">4. Вузол тригера й АЦП</text>

  <!-- Вхідний сигнал розгалужується на тригер та АЦП -->
  <line x1="695" y1="155" x2="705" y2="155" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="705" cy="155" r="2.5" fill="#1a1a1a"/>

  <!-- Верхній канал: Вхід до Компаратора Тригера -->
  <line x1="705" y1="155" x2="705" y2="138" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="705" y1="138" x2="730" y2="138" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Опорна напруга тригера V_trig (верхній вхід -) -->
  <text x="712" y="116" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">V_trig (ЦАП)</text>
  <line x1="695" y1="122" x2="730" y2="122" stroke="#c0392b" stroke-dasharray="3,2" stroke-width="1.2"/>

  <!-- Компаратор тригера -->
  <polygon points="730,112 770,130 730,148" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="737" y="125" font-size="10" fill="#c0392b" text-anchor="middle">-</text>
  <text x="737" y="141" font-size="10" fill="#2457d6" text-anchor="middle">+</text>

  <!-- Вихід тригера (Trig Sync) -->
  <line x1="770" y1="130" x2="800" y2="130" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="830" y="133" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">Trig Sync</text>

  <!-- Нижній канал: Прямий шлях до АЦП -->
  <line x1="705" y1="155" x2="755" y2="155" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="755" y="142" width="50" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="780" y="158" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="middle">АЦП 8-біт</text>

  <line x1="805" y1="155" x2="850" y2="155" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="880" y="159" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="middle">FPGA / RAM</text>

  <!-- Підпанель параметрів тригера -->
  <rect x="695" y="210" width="225" height="110" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="807" y="228" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Параметри синхронізації:</text>
  <text x="807" y="248" font-size="10" fill="#1a1a1a" text-anchor="middle">Режими: Auto / Normal / Single</text>
  <text x="807" y="268" font-size="10" fill="#2457d6" text-anchor="middle">Фронт: Зростаючий (↑) / Спадаючий (↓)</text>
  <text x="807" y="288" font-size="10" fill="#6b7280" text-anchor="middle">Частота АЦП: 250 MSa/s (real-time)</text>
  <text x="807" y="306" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">Стабільний стоп-кадр на екрані</text>

  <!-- =================Нижня частина: Практичне застосування================= -->

  <rect x="30" y="350" width="285" height="185" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="172" y="372" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Практика: Спостереження малих пульсацій</text>

  <rect x="42" y="388" width="120" height="110" fill="#1a1a1a" rx="4"/>
  <line x1="42" y1="443" x2="162" y2="443" stroke="#333333" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="102" y1="388" x2="102" y2="498" stroke="#333333" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="42" y1="398" x2="162" y2="398" stroke="#c0392b" stroke-width="2"/>
  <text x="102" y="515" font-size="10" fill="#c0392b" text-anchor="middle">DC: 5 В/діл (фон 12 В)</text>

  <rect x="180" y="388" width="120" height="110" fill="#1a1a1a" rx="4"/>
  <line x1="180" y1="443" x2="300" y2="443" stroke="#333333" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="240" y1="388" x2="240" y2="498" stroke="#333333" stroke-width="1" stroke-dasharray="2,2"/>
  <path d="M180,443 Q195,413 210,443 T240,443 T270,443 T300,443" fill="none" stroke="#27ae60" stroke-width="2"/>
  <text x="240" y="515" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">AC: 20 мВ/діл (пульсації)</text>

  <rect x="330" y="350" width="300" height="185" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="372" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Компенсація щупа 10X (Гвинт C_p)</text>

  <rect x="345" y="388" width="270" height="110" fill="#1a1a1a" rx="4"/>
  <line x1="345" y1="443" x2="615" y2="443" stroke="#333333" stroke-width="1" stroke-dasharray="2,2"/>

  <path d="M355,465 L370,465 L371,405 L385,420 L415,420 L415,465 L425,465" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <text x="390" y="515" font-size="10" fill="#c0392b" text-anchor="middle">C_p завелика</text>

  <path d="M445,465 L460,465 Q470,435 485,420 L505,420 L505,465 L515,465" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <text x="480" y="515" font-size="10" fill="#c0392b" text-anchor="middle">C_p замала</text>

  <path d="M535,465 L550,465 L550,420 L595,420 L595,465 L605,465" fill="none" stroke="#27ae60" stroke-width="2"/>
  <text x="572" y="515" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">Оптимально 10X</text>

  <rect x="645" y="350" width="285" height="185" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="787" y="372" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Синхронізація тригером (Trig Level)</text>

  <rect x="660" y="388" width="255" height="110" fill="#1a1a1a" rx="4"/>
  <line x1="660" y1="443" x2="915" y2="443" stroke="#333333" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="787" y1="388" x2="787" y2="498" stroke="#333333" stroke-width="1" stroke-dasharray="2,2"/>

  <path d="M665,443 Q690,398 715,443 T765,443 T815,443 T865,443 T910,443" fill="none" stroke="#27ae60" stroke-width="2"/>

  <line x1="660" y1="420" x2="915" y2="420" stroke="#c0392b" stroke-dasharray="4,3" stroke-width="1.5"/>
  <text x="675" y="414" font-size="10" font-weight="bold" fill="#c0392b">V_trig</text>
  
  <circle cx="702" cy="420" r="4" fill="#c0392b"/>
  <path d="M702,434 L702,426" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <text x="720" y="515" font-size="10" fill="#6b7280" text-anchor="middle">Поріг у межах V_pp</text>
  <text x="850" y="515" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">Фронт підйому (↑)</text>
</svg>
