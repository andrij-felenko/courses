<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background MUST BE FIRST CHILD -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <defs>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2563eb"/>
    </marker>
    <marker id="arr-dark" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Капілярний ефект та кут змочування при пайці THT</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Флюс знижує поверхневий натяг: θ &lt; 90° забезпечує капілярне всмоктування припаю в отворі</text>

  <!-- Panel 1: Left Container -->
  <rect x="24" y="68" width="430" height="450" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="36" y="78" width="406" height="26" rx="4" fill="#eaf0fd"/>
  <text x="239" y="95" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Кут змочування θ та вплив флюсу</text>

  <!-- Sub-panel 1A: Non-wetting -->
  <rect x="36" y="110" width="196" height="396" rx="6" fill="#fdecea" stroke="#f5c6cb" stroke-width="1"/>
  <text x="134" y="128" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Без флюсу (Окисли)</text>
  <text x="134" y="143" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">θ &gt; 90° — Незмочування</text>

  <!-- Graphics 1A -->
  <rect x="46" y="274" width="176" height="12" fill="#c97a2b" rx="2"/>
  <rect x="46" y="271" width="176" height="3" fill="#92400e"/>
  <path d="M 94 271 A 40 40 0 1 1 174 271 Z" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  
  <!-- Vectors 1A -->
  <path d="M 94 271 L 60 271" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <path d="M 94 271 L 128 271" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <path d="M 94 271 L 118 220" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <path d="M 124 271 A 30 30 0 0 0 108 236" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Vector Labels 1A -->
  <text x="126" y="215" font-size="11" fill="#c0392b" text-anchor="start">γ_LV</text>
  <text x="150" y="286" font-size="11" fill="#c0392b" text-anchor="middle">γ_SL</text>
  <text x="65" y="286" font-size="11" fill="#c0392b" text-anchor="middle">γ_SV</text>
  <text x="120" y="250" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">θ &gt; 90°</text>

  <!-- Text 1A Explanations -->
  <text x="134" y="365" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Припай згортається в кулю</text>
  <text x="134" y="385" font-size="11" fill="#6b7280" text-anchor="middle">Поверхневий натяг високий</text>
  <text x="134" y="403" font-size="11" fill="#6b7280" text-anchor="middle">Сила зчеплення слабка</text>
  <text x="134" y="440" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Всмоктування ВІДСУТНЄ</text>
  <text x="134" y="460" font-size="11" fill="#c0392b" text-anchor="middle">F_cap ≤ 0 (меніск опуклий)</text>

  <!-- Sub-panel 1B: Wetting -->
  <rect x="246" y="110" width="196" height="396" rx="6" fill="#e9f7ef" stroke="#c3e6cb" stroke-width="1"/>
  <text x="344" y="128" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">З флюсом (Чиста мідь)</text>
  <text x="344" y="143" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">θ &lt; 30° — Добре змочування</text>

  <!-- Graphics 1B -->
  <rect x="256" y="274" width="176" height="12" fill="#c97a2b" rx="2"/>
  <rect x="256" y="271" width="176" height="3" fill="#6ee7b7"/>
  <path d="M 266 271 Q 344 245 422 271 Z" fill="#3b82f6" stroke="#1d4ed8" stroke-width="2"/>
  
  <!-- Vectors 1B -->
  <path d="M 266 271 L 236 271" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <path d="M 266 271 L 300 271" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <path d="M 266 271 L 306 256" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <path d="M 296 271 A 30 30 0 0 0 294 260" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Vector Labels 1B -->
  <text x="318" y="252" font-size="11" fill="#27ae60" text-anchor="start">γ_LV</text>
  <text x="315" y="286" font-size="11" fill="#27ae60" text-anchor="middle">γ_SL</text>
  <text x="245" y="286" font-size="11" fill="#27ae60" text-anchor="middle">γ_SV</text>
  <text x="290" y="246" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">θ &lt; 30°</text>

  <!-- Text 1B Explanations -->
  <text x="344" y="365" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Припай тонко розтікається</text>
  <text x="344" y="385" font-size="11" fill="#6b7280" text-anchor="middle">Флюс знімає плівку оксидів</text>
  <text x="344" y="403" font-size="11" fill="#6b7280" text-anchor="middle">Формується інтерметалід</text>
  <text x="344" y="440" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Всмоктування АКТИВНЕ</text>
  <text x="344" y="460" font-size="11" fill="#27ae60" text-anchor="middle">F_cap &gt; 0 (меніск увігнутий)</text>

  <!-- Panel 2: Right Container -->
  <rect x="474" y="68" width="462" height="450" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="486" y="78" width="438" height="26" rx="4" fill="#eaf0fd"/>
  <text x="705" y="95" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">2. Механіка капілярного заповнення отвору (PTH)</text>

  <!-- Graphics Panel 2 -->
  <!-- FR-4 substrate -->
  <rect x="510" y="190" width="122" height="150" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
  <rect x="728" y="190" width="122" height="150" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>

  <!-- Top copper pads -->
  <rect x="510" y="182" width="130" height="8" fill="#c97a2b"/>
  <rect x="720" y="182" width="130" height="8" fill="#c97a2b"/>

  <!-- Bottom copper pads -->
  <rect x="510" y="340" width="130" height="8" fill="#c97a2b"/>
  <rect x="720" y="340" width="130" height="8" fill="#c97a2b"/>

  <!-- Plated barrel walls -->
  <rect x="632" y="190" width="8" height="150" fill="#c97a2b"/>
  <rect x="720" y="190" width="8" height="150" fill="#c97a2b"/>

  <!-- Solder in barrel -->
  <rect x="640" y="190" width="24" height="150" fill="#3b82f6" opacity="0.9"/>
  <rect x="696" y="190" width="24" height="150" fill="#3b82f6" opacity="0.9"/>

  <!-- Component lead (pin) -->
  <rect x="664" y="130" width="32" height="270" fill="#94a3b8" stroke="#475569" stroke-width="1.5" rx="2"/>

  <!-- Capillary force arrows -->
  <path d="M 652 245 L 652 208" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>
  <path d="M 708 245 L 708 208" stroke="#2563eb" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Gravity force arrow -->
  <path d="M 680 270 L 680 300" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Top solder menisci -->
  <path d="M 560 182 Q 620 182 664 165 L 664 190 L 560 190 Z" fill="#3b82f6"/>
  <path d="M 800 182 Q 740 182 696 165 L 696 190 L 800 190 Z" fill="#3b82f6"/>

  <!-- Bottom solder menisci -->
  <path d="M 550 348 Q 620 348 664 365 L 664 340 L 550 340 Z" fill="#3b82f6"/>
  <path d="M 810 348 Q 740 348 696 365 L 696 340 L 810 340 Z" fill="#3b82f6"/>

  <!-- Soldering Iron Tip Graphic -->
  <polygon points="825,375 875,348 880,358" fill="#d97706" stroke="#b45309" stroke-width="1"/>

  <!-- Panel 2 Labels -->
  <text x="575" y="138" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Верхній галтель (100% заповнення)</text>
  <text x="785" y="138" font-size="11" fill="#1a1a1a" text-anchor="middle">Вивід компонента (Pin)</text>

  <text x="530" y="260" font-size="11" fill="#475569" text-anchor="middle">Плата FR-4</text>
  <text x="810" y="260" font-size="11" fill="#b45309" text-anchor="middle">Мідний отвір (PTH)</text>

  <text x="610" y="220" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="end">F_cap ↑</text>
  <text x="750" y="220" font-size="11" font-weight="bold" fill="#2563eb" text-anchor="start">↑ F_cap</text>

  <text x="680" y="318" font-size="11" fill="#c0392b" text-anchor="middle">F_g = m·g ↓</text>

  <text x="550" y="390" font-size="11" fill="#1a1a1a" text-anchor="middle">Нижній галтель</text>
  <text x="810" y="390" font-size="11" fill="#d97706" text-anchor="middle">Паяльник та припай (Подача тепла)</text>

  <!-- Formula Box -->
  <rect x="486" y="418" width="438" height="86" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="705" y="438" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Формула капілярного підйому припаю:</text>
  <text x="705" y="460" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">h = (2 · γ_LV · cos θ) / (ρ · g · r_gap)</text>
  <text x="705" y="482" font-size="11" fill="#27ae60" text-anchor="middle">Умова підйому: θ &lt; 90° ⇒ cos θ &gt; 0 ⇒ F_cap &gt; F_g (припай тече вгору!)</text>
</svg>
