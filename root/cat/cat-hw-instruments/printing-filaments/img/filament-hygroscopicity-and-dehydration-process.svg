<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Вплив вологи на філамент та його термодегідратація</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Гідролітичний розрив полімерних ланцюгів у розплаві та відновлення властивостей у сушильній камері</text>

  <!-- ЛІВА ПАНЕЛЬ: ПРОБЛЕМА (ГІДРОЛІЗ ТА ДЕФЕКТИ) -->
  <rect x="24" y="75" width="444" height="440" rx="8" fill="#fdecea" stroke="#e6b0aa" stroke-width="1.5"/>

  <!-- Заголовок лівої панелі -->
  <rect x="36" y="87" width="420" height="36" rx="4" fill="#c0392b"/>
  <text x="246" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="white">ГІДРОЛІЗ ТА ДЕГРАДАЦІЯ В СОПЛІ (ПРОБЛЕМА)</text>

  <!-- Блок 1 лівої панелі: Хімічний розрив ланцюгів -->
  <rect x="36" y="135" width="420" height="153" rx="6" fill="white" stroke="#f5c6cb"/>
  <text x="48" y="155" font-size="13" font-weight="bold" fill="#c0392b">Поглинута волога (H₂O) та розрив ланцюгів</text>

  <!-- Рамка хімічного рівняння -->
  <rect x="48" y="168" width="396" height="52" rx="4" fill="#fdf2e9" stroke="#f5b041"/>
  <text x="246" y="188" text-anchor="middle" font-size="12" font-weight="bold" fill="#7e5109">−R−CO−O−R−  +  H₂O  ──( T &gt; 200 °C )──&gt;  −R−COOH  +  HO−R−</text>
  <text x="246" y="210" text-anchor="middle" font-size="12" fill="#7e5109">(Зменшення молекулярної маси M_w → падіння міцності)</text>

  <text x="48" y="245" font-size="12" fill="#1a1a1a">• Падіння в'язкості розплаву та міжшарової адгезії</text>
  <text x="48" y="268" font-size="12" fill="#1a1a1a">• Термічна деградація структурних властивостей</text>

  <!-- Блок 2 лівої панелі: Вибухове пароутворення в соплі -->
  <rect x="36" y="300" width="420" height="195" rx="6" fill="white" stroke="#f5c6cb"/>
  <text x="48" y="320" font-size="13" font-weight="bold" fill="#c0392b">Утворення дефектів при екструзії</text>

  <!-- Графіка сопла -->
  <path d="M 75,335 L 135,335 L 135,370 L 115,398 L 115,408 L 95,408 L 95,398 L 75,370 Z" fill="#fef5e7" stroke="#f39c12" stroke-width="2"/>
  <path d="M 93,335 L 117,335 L 117,370 L 109,398 L 109,408 L 101,408 L 101,398 L 93,370 Z" fill="#fadbd8"/>
  <rect x="100" y="408" width="10" height="42" fill="#e74c3c" opacity="0.85" rx="2"/>

  <!-- Волога та бульбашки пари -->
  <circle cx="105" cy="348" r="3" fill="#3498db"/>
  <circle cx="105" cy="385" r="5" fill="white" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="105" cy="425" r="7" fill="white" stroke="#c0392b" stroke-width="1.5"/>
  <!-- Промені вибуху пари -->
  <line x1="95" y1="425" x2="89" y2="425" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="115" y1="425" x2="121" y2="425" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="105" y1="415" x2="105" y2="409" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Список дефектів праворуч від сопла -->
  <text x="185" y="345" font-size="12" font-weight="bold" fill="#c0392b">Дефекти екструзії розплаву:</text>
  <text x="185" y="368" font-size="12" fill="#1a1a1a">1. Бульбашки пари у виробі (пори)</text>
  <text x="185" y="391" font-size="12" fill="#1a1a1a">2. Мимовільне витікання (павутина)</text>
  <text x="185" y="414" font-size="12" fill="#1a1a1a">3. Недоекструзія (пропусти кроків)</text>
  <text x="185" y="437" font-size="12" fill="#1a1a1a">4. Втрата міжшарової міцності</text>
  <text x="185" y="468" font-size="12" font-style="italic" fill="#6b7280">Супроводжується клацанням і парою</text>


  <!-- ПРАВА ПАНЕЛЬ: РОЗВ'ЯЗОК (СУШІННЯ ТА ЗБЕРІГАННЯ) -->
  <rect x="492" y="75" width="444" height="440" rx="8" fill="#e9f7ef" stroke="#a3e4d7" stroke-width="1.5"/>

  <!-- Заголовок правої панелі -->
  <rect x="504" y="87" width="420" height="36" rx="4" fill="#27ae60"/>
  <text x="714" y="110" text-anchor="middle" font-size="14" font-weight="bold" fill="white">СУШІННЯ ТА ГЕРМЕТИЧНЕ ЗБЕРІГАННЯ (РОЗВ'ЯЗОК)</text>

  <!-- Блок 1 правої панелі: Сушильна камера -->
  <rect x="504" y="135" width="420" height="153" rx="6" fill="white" stroke="#a3e4d7"/>
  <text x="516" y="155" font-size="13" font-weight="bold" fill="#27ae60">Термодегідратація (активне сушіння)</text>

  <!-- Графіка сушильної камери -->
  <rect x="516" y="170" width="130" height="95" rx="6" fill="#eef9f1" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="581" cy="210" r="26" fill="#a9dfbf" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="581" cy="210" r="9" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <!-- Стрілки тепла -->
  <path d="M 545,244 C 545,238 550,238 550,234" fill="none" stroke="#e67e22" stroke-width="1.5"/>
  <path d="M 581,244 C 581,238 586,238 586,234" fill="none" stroke="#e67e22" stroke-width="1.5"/>
  <path d="M 617,244 C 617,238 622,238 622,234" fill="none" stroke="#e67e22" stroke-width="1.5"/>
  <text x="581" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">T = 50–70 °C</text>

  <!-- Режими сушіння праворуч -->
  <text x="660" y="175" font-size="12" font-weight="bold" fill="#1a1a1a">Режими сушіння матеріалів:</text>
  <text x="660" y="196" font-size="12" fill="#1a1a1a">• PETG: 60–65 °C (4–6 год)</text>
  <text x="660" y="217" font-size="12" fill="#1a1a1a">• TPU: 55–60 °C (6–8 год)</text>
  <text x="660" y="238" font-size="12" fill="#1a1a1a">• NYLON: 70–80 °C (8–12 год)</text>
  <text x="660" y="268" font-size="12" font-style="italic" fill="#2457d6">Дифузія вологи: ∂C/∂t = D(T)·∇²C</text>

  <!-- Блок 2 правої панелі: Захисний бокс із силікагелем -->
  <rect x="504" y="300" width="420" height="195" rx="6" fill="white" stroke="#a3e4d7"/>
  <text x="516" y="320" font-size="13" font-weight="bold" fill="#27ae60">Герметичний бокс із силікагелем</text>

  <!-- Графіка гермобоксу -->
  <rect x="516" y="332" width="130" height="145" rx="6" fill="#ebf5fb" stroke="#2980b9" stroke-width="1.5"/>
  <rect x="520" y="336" width="122" height="137" rx="4" fill="none" stroke="#e74c3c" stroke-dasharray="3,3"/>
  <circle cx="581" cy="395" r="26" fill="#abebc6" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="581" cy="395" r="9" fill="white" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Гігрометр -->
  <rect x="604" y="340" width="36" height="20" rx="3" fill="#34495e"/>
  <text x="622" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#2ecc71">10%</text>

  <!-- Пакетик із силікагелем -->
  <rect x="536" y="445" width="90" height="22" rx="3" fill="#d4efdf" stroke="#27ae60"/>
  <text x="581" y="461" text-anchor="middle" font-size="12" fill="#1e8449">Силікагель</text>

  <!-- Трубка PTFE -->
  <path d="M 545,332 L 545,315 C 545,308 535,308 530,308 L 504,308" fill="none" stroke="#3498db" stroke-width="2.5"/>

  <!-- Особливості гермобоксу праворуч -->
  <text x="660" y="345" font-size="12" font-weight="bold" fill="#27ae60">Особливості гермобоксу:</text>
  <text x="660" y="368" font-size="12" fill="#1a1a1a">1. Поглинання залишкової вологи</text>
  <text x="660" y="391" font-size="12" fill="#1a1a1a">2. Подача через PTFE-трубку</text>
  <text x="660" y="414" font-size="12" fill="#1a1a1a">3. Контроль вологості (RH &lt; 15%)</text>
  <text x="660" y="437" font-size="12" fill="#1a1a1a">4. Збереження монолітності виробу</text>
  <text x="660" y="468" font-size="12" font-weight="bold" fill="#27ae60">Результат: висока адгезія шарів</text>

</svg>
