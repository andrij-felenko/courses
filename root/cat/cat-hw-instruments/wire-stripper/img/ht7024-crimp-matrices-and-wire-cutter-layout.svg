<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розташування обтискних матриць та кабелеріза в рукоятках HT-7024</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Функціональне зонування внутрішньої частини рукояток для різання дротів та опресування клем</text>

  <!-- PANEL 1: Wire Cutter Zone -->
  <rect x="40" y="75" width="270" height="275" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <rect x="52" y="87" width="246" height="26" fill="#2457d6" rx="4"/>
  <text x="175" y="104" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Кабелеріз (Wire Cutter)</text>

  <!-- Shear Blades Illustration in Panel 1 -->
  <rect x="110" y="140" width="130" height="35" fill="#94a3b8" stroke="#1a1a1a" stroke-width="1.5" rx="3"/>
  <rect x="110" y="195" width="130" height="35" fill="#94a3b8" stroke="#1a1a1a" stroke-width="1.5" rx="3"/>
  <rect x="80" y="177" width="160" height="16" fill="#f59e0b" opacity="0.9" rx="2"/>
  <text x="160" y="189" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кабель (0.2–6.0 мм²)</text>

  <!-- Cutting Action Arrows -->
  <line x1="175" y1="126" x2="175" y2="136" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="175" y1="244" x2="175" y2="234" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Text Panel 1 -->
  <text x="175" y="322" font-size="12" fill="#1a1a1a" text-anchor="middle">Чистий перпендикулярний зріз</text>
  <text x="175" y="338" font-size="11" fill="#6b7280" text-anchor="middle">Мідні й алюмінієві дроти</text>

  <!-- PANEL 2: Insulated Terminals Crimp Zone -->
  <rect x="325" y="75" width="290" height="275" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <rect x="337" y="87" width="266" height="26" fill="#2457d6" rx="4"/>
  <text x="470" y="104" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Ізольовані наконечники</text>

  <!-- Matrix Slots Block inside Panel 2 -->
  <rect x="350" y="135" width="240" height="130" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>

  <!-- Nest 1: Red 0.5-1.0 mm² -->
  <rect x="365" y="150" width="65" height="100" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="4"/>
  <text x="397.5" y="175" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">0.5–1.0</text>
  <text x="397.5" y="193" font-size="11" fill="#6b7280" text-anchor="middle">мм²</text>
  <rect x="375" y="210" width="45" height="18" fill="#c0392b" rx="3"/>
  <text x="397.5" y="223" font-size="10" font-weight="bold" fill="white" text-anchor="middle">RED</text>

  <!-- Nest 2: Blue 1.5-2.5 mm² -->
  <rect x="437.5" y="150" width="65" height="100" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="470" y="175" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">1.5–2.5</text>
  <text x="470" y="193" font-size="11" fill="#6b7280" text-anchor="middle">мм²</text>
  <rect x="447.5" y="210" width="45" height="18" fill="#2457d6" rx="3"/>
  <text x="470" y="223" font-size="10" font-weight="bold" fill="white" text-anchor="middle">BLUE</text>

  <!-- Nest 3: Yellow 4.0-6.0 mm² -->
  <rect x="510" y="150" width="65" height="100" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" rx="4"/>
  <text x="542.5" y="175" font-size="12" font-weight="bold" fill="#d97706" text-anchor="middle">4.0–6.0</text>
  <text x="542.5" y="193" font-size="11" fill="#6b7280" text-anchor="middle">мм²</text>
  <rect x="520" y="210" width="45" height="18" fill="#d97706" rx="3"/>
  <text x="542.5" y="223" font-size="10" font-weight="bold" fill="white" text-anchor="middle">YELLOW</text>

  <!-- Text Panel 2 -->
  <text x="470" y="322" font-size="12" fill="#1a1a1a" text-anchor="middle">Стандартні колірні позначення</text>
  <text x="470" y="338" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Клеми з ізолювальною манжетою</text>

  <!-- PANEL 3: Non-Insulated & Auto Crimp Zone -->
  <rect x="630" y="75" width="290" height="275" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <rect x="642" y="87" width="266" height="26" fill="#27ae60" rx="4"/>
  <text x="775" y="104" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Неізольовані та автоклеми</text>

  <!-- Matrix Slots Block inside Panel 3 -->
  <rect x="645" y="135" width="260" height="130" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>

  <!-- Slot 1: 0.5-1.0 mm² / 22-18 AWG -->
  <rect x="660" y="150" width="70" height="100" fill="white" stroke="#1a1a1a" stroke-width="1.5" rx="4"/>
  <text x="695" y="175" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0.5–1.0</text>
  <text x="695" y="193" font-size="11" fill="#6b7280" text-anchor="middle">мм²</text>
  <rect x="667.5" y="210" width="55" height="18" fill="#d0d7de" rx="3"/>
  <text x="695" y="223" font-size="10" font-weight="bold" fill="#1a1a1a" text-anchor="middle">22–18 AWG</text>

  <!-- Slot 2: 1.5-2.5 mm² / 16-14 AWG -->
  <rect x="740" y="150" width="70" height="100" fill="white" stroke="#1a1a1a" stroke-width="1.5" rx="4"/>
  <text x="775" y="175" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1.5–2.5</text>
  <text x="775" y="193" font-size="11" fill="#6b7280" text-anchor="middle">мм²</text>
  <rect x="747.5" y="210" width="55" height="18" fill="#d0d7de" rx="3"/>
  <text x="775" y="223" font-size="10" font-weight="bold" fill="#1a1a1a" text-anchor="middle">16–14 AWG</text>

  <!-- Slot 3: 4.0-6.0 mm² / 12-10 AWG -->
  <rect x="820" y="150" width="70" height="100" fill="white" stroke="#1a1a1a" stroke-width="1.5" rx="4"/>
  <text x="855" y="175" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">4.0–6.0</text>
  <text x="855" y="193" font-size="11" fill="#6b7280" text-anchor="middle">мм²</text>
  <rect x="827.5" y="210" width="55" height="18" fill="#d0d7de" rx="3"/>
  <text x="855" y="223" font-size="10" font-weight="bold" fill="#1a1a1a" text-anchor="middle">12–10 AWG</text>

  <!-- Text Panel 3 -->
  <text x="775" y="322" font-size="12" fill="#1a1a1a" text-anchor="middle">Для відкритих хвостовиків і гільз</text>
  <text x="775" y="338" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Точковий та W-подібний обтиск</text>

  <!-- Bottom Technical Summary Panel -->
  <rect x="40" y="365" width="880" height="80" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="60" y="385" font-size="13" font-weight="bold" fill="#1a1a1a">Зведені параметри обтискного вузла інструмента HT-7024:</text>
  <text x="60" y="408" font-size="12" fill="#1a1a1a">Діапазони опресування: 0.5–1.0 мм² (22–18 AWG) | 1.5–2.5 мм² (16–14 AWG) | 4.0–6.0 мм² (12–10 AWG)</text>
  <text x="60" y="430" font-size="11" fill="#6b7280">Вбудований кабелеріз забезпечує чистовий розкрій провідників перерізом від 0.2 до 6.0 мм² без сплющування жилок.</text>
</svg>
