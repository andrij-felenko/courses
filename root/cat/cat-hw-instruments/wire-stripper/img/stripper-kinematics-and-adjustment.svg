<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Markers Definitions -->
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Кінематика важелів та регулювання автоматичного знімача HT-7024</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Взаємодія затискних губок, підрізних крайок, обмежувача довжини та мікрорегулятора притиску</text>

  <!-- Left Panel: Kinematics & Force Balance -->
  <rect x="30" y="75" width="440" height="355" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="250" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">1. Схема заклинювання та зсуву губок</text>

  <!-- Mechanism Diagram Graphics -->
  <!-- Handle Levers -->
  <path d="M 60,150 L 130,240 L 220,240" fill="none" stroke="#2457d6" stroke-width="4"/>
  <path d="M 60,330 L 130,240 L 220,240" fill="none" stroke="#2457d6" stroke-width="4"/>
  <circle cx="130" cy="240" r="6" fill="#2457d6"/>

  <!-- Handle Force Arrows -->
  <text x="60" y="125" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">F_h</text>
  <line x1="60" y1="130" x2="60" y2="146" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <text x="60" y="355" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">F_h</text>
  <line x1="60" y1="350" x2="60" y2="334" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Clamping Jaw (Left) -->
  <rect x="235" y="180" width="30" height="120" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="250" y="173" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Fₙ</text>
  <line x1="250" y1="140" x2="250" y2="174" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Wire Assembly -->
  <!-- Copper Core -->
  <line x1="180" y1="240" x2="430" y2="240" stroke="#d97706" stroke-width="5"/>
  <!-- Main Insulation -->
  <rect x="180" y="231" width="145" height="18" rx="2" fill="#27ae60" opacity="0.85"/>
  <!-- Stripped Insulation Piece -->
  <rect x="355" y="231" width="55" height="18" rx="2" fill="#27ae60" opacity="0.4"/>

  <!-- Stripping Jaw (Right) -->
  <rect x="325" y="180" width="30" height="120" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>

  <!-- Friction Force Arrow (Green) -->
  <line x1="265" y1="222" x2="310" y2="222" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="287" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">F_f</text>

  <!-- Shear Resistance Arrow (Red) -->
  <line x1="355" y1="222" x2="400" y2="222" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="377" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">F_s</text>

  <!-- Left Bottom Text Box -->
  <rect x="45" y="325" width="410" height="90" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="55" y="345" font-size="12" fill="#1a1a1a">Затискні губки (ліворуч): створюють Fₙ та силу тертя F_f</text>
  <text x="55" y="365" font-size="12" fill="#1a1a1a">Підрізні губки (праворуч): рухаються вбік, створюючи F_s</text>
  <text x="55" y="385" font-size="12" font-weight="bold" fill="#27ae60">Умова утримання без проскоку: tan(α) ≤ μ (заклинювання)</text>
  <text x="55" y="403" font-size="12" fill="#6b7280">Захист міді: притиск обмежений мікрорегулятором</text>

  <!-- Right Panel: Adjustment & Blade Gap -->
  <rect x="490" y="75" width="440" height="355" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="710" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">2. Регулювання довжини ходу та притиску</text>

  <!-- Stopper Box -->
  <rect x="510" y="125" width="195" height="85" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="607" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Обмежувач довжини l_strip</text>
  <text x="607" y="165" text-anchor="middle" font-size="12" fill="#6b7280">Діапазон ходу: 2 – 20 мм</text>
  <text x="607" y="185" text-anchor="middle" font-size="12" fill="#1a1a1a">Задає довжину знімання оболонки</text>

  <!-- Micro-adjuster Box -->
  <rect x="720" y="125" width="195" height="85" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="817" y="145" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Мікрорегулятор (p = 0.5 мм)</text>
  <text x="817" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Зазор: D_in &lt; g_opt &lt; D_out</text>
  <text x="817" y="185" text-anchor="middle" font-size="12" fill="#27ae60">Поворот: ϕ = 360° · (Δg ÷ p)</text>

  <!-- Subpanel for Blade Gap Geometry -->
  <rect x="510" y="225" width="405" height="95" rx="6" fill="white" stroke="#d0d7de"/>

  <!-- Left Side Text inside Gap Subpanel -->
  <text x="522" y="252" font-size="12" fill="#27ae60">Захисна товщина стінки t</text>
  <text x="522" y="272" font-size="12" fill="#6b7280">δ ≈ 0.10...0.15 (допуск)</text>
  <text x="522" y="292" font-size="12" fill="#1a1a1a">Запобігає надсіканню жилок</text>

  <!-- Blade Shapes & Wire Section Graphics -->
  <!-- Upper Blade -->
  <path d="M 645,233 L 675,233 L 660,257 Z" fill="#c0392b"/>
  <!-- Lower Blade -->
  <path d="M 645,316 L 675,316 L 660,292 Z" fill="#c0392b"/>

  <!-- Outer Insulation Circle (dash array) -->
  <circle cx="660" cy="275" r="15" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="3,3"/>
  <!-- Inner Copper Core Circle -->
  <circle cx="660" cy="275" r="6" fill="#d97706"/>

  <!-- Gap Dimension Line (g_opt) -->
  <line x1="685" y1="257" x2="685" y2="292" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-black)" marker-end="url(#arr-black)"/>
  <text x="696" y="279" font-size="12" font-weight="bold" fill="#1a1a1a">g_opt = D_in + 2·δ·t</text>

  <!-- Summary Box in Right Panel -->
  <rect x="510" y="335" width="405" height="80" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="525" y="355" font-size="12" font-weight="bold" fill="#27ae60">Алгоритм налаштування (кабелі 24–10 AWG):</text>
  <text x="525" y="373" font-size="12" fill="#1a1a1a">1. Фіксація упору на потрібну довжину l_strip</text>
  <text x="525" y="391" font-size="12" fill="#1a1a1a">2. Підлаштування мікрогвинта під тип (PVC, PTFE)</text>
  <text x="525" y="407" font-size="12" fill="#6b7280">3. Контроль чистоти зрізу та цілісності мідних жилок</text>
</svg>
