<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Послідовність роботи двощелепного механізму HT-7024</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Синхронна кінематика: затискання провідника, підріз оболонки та її лінійне знімання</text>

  <!-- PANEL 1: Phase 1 (Clamping) -->
  <rect x="40" y="72" width="270" height="275" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <rect x="52" y="82" width="246" height="24" fill="#2457d6" rx="4"/>
  <text x="175" y="98" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Фаза 1: Затискання провідника</text>

  <!-- Wire in Panel 1 -->
  <rect x="55" y="180" width="240" height="30" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="3"/>
  <rect x="55" y="188" width="240" height="14" fill="#f59e0b" opacity="0.9"/>

  <!-- Clamping Jaws in Panel 1 -->
  <rect x="105" y="132" width="45" height="46" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5" rx="3"/>
  <rect x="105" y="212" width="45" height="46" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5" rx="3"/>
  <text x="98" y="124" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="end">F_clamp</text>
  <line x1="127.5" y1="113" x2="127.5" y2="127" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="127.5" y1="277" x2="127.5" y2="263" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="98" y="273" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="end">F_clamp</text>

  <!-- Blades in Panel 1 -->
  <rect x="215" y="135" width="30" height="43" fill="#94a3b8" stroke="#1a1a1a" stroke-width="1.5" rx="2"/>
  <rect x="215" y="212" width="30" height="43" fill="#94a3b8" stroke="#1a1a1a" stroke-width="1.5" rx="2"/>

  <!-- Text Panel 1 -->
  <text x="175" y="312" font-size="12" fill="#1a1a1a" text-anchor="middle">Ліва губка фіксує дріт</text>
  <text x="175" y="330" font-size="11" fill="#6b7280" text-anchor="middle">Леза торкаються поверхні</text>

  <!-- PANEL 2: Phase 2 (Incising / Cutting) -->
  <rect x="325" y="72" width="270" height="275" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <rect x="337" y="82" width="246" height="24" fill="#2457d6" rx="4"/>
  <text x="460" y="98" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Фаза 2: Підрізання оболонки</text>

  <!-- Standalone Cut Depth Callout Card -->
  <rect x="435" y="116" width="65" height="22" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="3"/>
  <text x="467.5" y="131" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">h_cut = t</text>

  <!-- Wire in Panel 2 -->
  <rect x="340" y="180" width="240" height="30" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="3"/>
  <rect x="340" y="188" width="240" height="14" fill="#f59e0b" opacity="0.9"/>

  <!-- Clamped Jaws in Panel 2 -->
  <rect x="390" y="134" width="45" height="44" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5" rx="3"/>
  <rect x="390" y="212" width="45" height="44" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5" rx="3"/>

  <!-- Cutting Blades in Panel 2 -->
  <rect x="500" y="143" width="30" height="43" fill="#94a3b8" stroke="#1a1a1a" stroke-width="1.5" rx="2"/>
  <rect x="500" y="204" width="30" height="43" fill="#94a3b8" stroke="#1a1a1a" stroke-width="1.5" rx="2"/>
  <line x1="515" y1="123" x2="515" y2="137" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="515" y1="267" x2="515" y2="253" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Text Panel 2 -->
  <text x="460" y="312" font-size="12" fill="#1a1a1a" text-anchor="middle">Леза прорізають ізоляцію</text>
  <text x="460" y="330" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Жила не пошкоджується</text>

  <!-- PANEL 3: Phase 3 (Linear Shift / Stripping) -->
  <rect x="610" y="72" width="270" height="275" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <rect x="622" y="82" width="246" height="24" fill="#27ae60" rx="4"/>
  <text x="745" y="98" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Фаза 3: Лінійний зсув оболонки</text>

  <!-- Wire & Stripped Core in Panel 3 -->
  <rect x="625" y="180" width="130" height="30" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="3"/>
  <rect x="755" y="188" width="55" height="14" fill="#f59e0b"/>
  <rect x="810" y="180" width="55" height="30" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="3"/>

  <!-- Left Jaws in Panel 3 -->
  <rect x="665" y="134" width="45" height="44" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5" rx="3"/>
  <rect x="665" y="212" width="45" height="44" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5" rx="3"/>

  <!-- Shifted Right Blades in Panel 3 -->
  <rect x="810" y="134" width="30" height="44" fill="#94a3b8" stroke="#1a1a1a" stroke-width="1.5" rx="2"/>
  <rect x="810" y="212" width="30" height="44" fill="#94a3b8" stroke="#1a1a1a" stroke-width="1.5" rx="2"/>
  <text x="788.5" y="144" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Δx</text>
  <line x1="775" y1="152" x2="802" y2="152" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="782.5" y="218" font-size="11" font-weight="bold" fill="#f59e0b" text-anchor="middle">L_strip</text>

  <!-- Text Panel 3 -->
  <text x="745" y="312" font-size="12" fill="#1a1a1a" text-anchor="middle">Права блочна губка зсувається</text>
  <text x="745" y="330" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Ізоляція знята без деформації</text>

  <!-- Bottom Parameter Summary Panel -->
  <rect x="40" y="362" width="840" height="83" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="60" y="383" font-size="13" font-weight="bold" fill="#1a1a1a">Ключові кінематичні параметри інструмента HT-7024:</text>
  <text x="60" y="406" font-size="12" fill="#1a1a1a">Діапазон перерізів: 0.2–6.0 мм² (24–10 AWG)   |   Типи ізоляції: PVC, Silicone, PTFE</text>
  <text x="60" y="428" font-size="11" fill="#6b7280">Мікрорегулятор притиску налаштовує глибину заглиблення лез h_cut для запобігання підрізу жилок.</text>
</svg>
