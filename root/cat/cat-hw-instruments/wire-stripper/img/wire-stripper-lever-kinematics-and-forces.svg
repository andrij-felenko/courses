<svg viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Markers -->
  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кінематика важелів та силовий баланс знімача HT-7024</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Стискання рукояток трансформується у нормальний притиск та опір зсуву без прослизання</text>

  <!-- PANEL 1: LEVER KINEMATICS -->
  <rect x="30" y="75" width="510" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="285" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Шарнірно-важельна кінематика приводу</text>

  <!-- Main Handle Lever -->
  <line x1="100" y1="340" x2="100" y2="140" stroke="#1a1a1a" stroke-width="6" stroke-linecap="round"/>
  <!-- Handle Force F_h -->
  <line x1="35" y1="160" x2="93" y2="160" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-accent)"/>
  <text x="65" y="150" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">F_h = 50 N</text>

  <!-- Long arm L_h dimension line -->
  <line x1="115" y1="160" x2="115" y2="340" stroke="#6b7280" stroke-dasharray="3,3" stroke-width="1.5"/>
  <line x1="110" y1="160" x2="120" y2="160" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="110" y1="340" x2="120" y2="340" stroke="#6b7280" stroke-width="1.5"/>
  <text x="123" y="250" font-size="12" fill="#6b7280">L_h = 120 мм</text>

  <!-- Pivot O1 -->
  <circle cx="100" cy="340" r="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/>
  <text x="75" y="345" font-size="12" font-weight="bold" fill="#1a1a1a">O₁</text>

  <!-- Short arm L_j -->
  <line x1="100" y1="340" x2="170" y2="290" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>
  <text x="135" y="330" font-size="12" fill="#6b7280">L_j = 20 мм</text>

  <!-- Joint A -->
  <circle cx="170" cy="290" r="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="170" y="274" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">A</text>

  <!-- Reference line for theta -->
  <line x1="170" y1="290" x2="250" y2="290" stroke="#6b7280" stroke-dasharray="3,3" stroke-width="1.5"/>
  <!-- Connecting rod AB -->
  <line x1="170" y1="290" x2="320" y2="240" stroke="#2457d6" stroke-width="3.5" stroke-linecap="round"/>
  <text x="215" y="278" font-size="12" font-weight="bold" fill="#2457d6">θ = 30°</text>

  <!-- Joint B & Slider Block (Text B moved to y=208 clear above slider top edge y=225) -->
  <text x="320" y="208" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">B</text>
  <circle cx="320" cy="240" r="6" fill="#ffffff" stroke="#2457d6" stroke-width="2.5"/>

  <rect x="310" y="225" width="60" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <line x1="370" y1="240" x2="423" y2="240" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-accent)"/>
  <text x="397" y="228" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">F_in</text>

  <!-- Wedge block with angle alpha -->
  <polygon points="430,225 490,225 490,270" fill="#d0d7de" stroke="#1a1a1a" stroke-width="2"/>
  <text x="475" y="245" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">α</text>

  <!-- Formula Box Panel 1 -->
  <rect x="45" y="360" width="480" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="60" y="380" font-size="12" fill="#1a1a1a">Передавальне відношення: k_m = (L_h ÷ L_j) · (1 ÷ cos θ) ≈ 6.93</text>
  <text x="60" y="402" font-size="13" font-weight="bold" fill="#2457d6">Нормальний притиск: F_n = k_m · F_h = 6.93 × 50 N ≈ 346.5 N</text>


  <!-- PANEL 2: FORCE BALANCE & JAMMING -->
  <rect x="560" y="75" width="370" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="745" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Силовий баланс губки та заклинювання</text>

  <!-- Jaw Tooth -->
  <polygon points="715,115 775,115 755,165 735,165" fill="#d0d7de" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M725,165 L730,172 L735,165 L740,172 L745,165 L750,172 L755,165" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Insulation Layer -->
  <rect x="600" y="172" width="290" height="38" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="640" y="196" font-size="12" fill="#2457d6">Ізоляційна оболонка (PVC / Silicone)</text>

  <!-- Copper Core -->
  <rect x="600" y="210" width="290" height="24" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="640" y="226" font-size="12" fill="#c0392b">Мідний сердечник провідника</text>

  <!-- Vectors of forces -->
  <!-- Normal Force F_n -->
  <line x1="745" y1="105" x2="745" y2="157" stroke="#2457d6" stroke-width="3.5" marker-end="url(#arr-accent)"/>
  <text x="755" y="135" font-size="13" font-weight="bold" fill="#2457d6">F_n ≈ 346.5 N</text>

  <!-- Friction Force F_f -->
  <line x1="745" y1="172" x2="835" y2="172" stroke="#27ae60" stroke-width="3.5" marker-end="url(#arr-green)"/>
  <text x="795" y="158" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">F_f = μ · F_n</text>

  <!-- Shear Resistance Force F_s -->
  <line x1="745" y1="172" x2="655" y2="172" stroke="#c0392b" stroke-width="3.5" marker-end="url(#arr-red)"/>
  <text x="695" y="158" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">F_s = F_c + F_slide</text>

  <!-- Box A: Retention condition -->
  <rect x="580" y="252" width="330" height="52" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="595" y="272" font-size="12" font-weight="bold" fill="#27ae60">Умова утримання (без проковзування):</text>
  <text x="595" y="292" font-size="13" font-weight="bold" fill="#1a1a1a">F_f = μ · F_n ≥ F_s  ⇒  μ · F_n ≥ (F_c + F_slide)</text>

  <!-- Box B: Self-jamming limit -->
  <rect x="580" y="318" width="330" height="102" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="595" y="340" font-size="12" font-weight="bold" fill="#1a1a1a">Границя самозаклинювання затискача:</text>
  <text x="595" y="365" font-size="13" font-weight="bold" fill="#2457d6">tan(α) ≤ μ   ⇒   α ≤ arctan(μ)</text>
  <text x="595" y="388" font-size="12" fill="#6b7280">Автоматичне самофіксування при зростанні F_s</text>
  <text x="595" y="408" font-size="12" fill="#c0392b">Обмеження: запобігати пластичному зминанню жилок</text>
</svg>
