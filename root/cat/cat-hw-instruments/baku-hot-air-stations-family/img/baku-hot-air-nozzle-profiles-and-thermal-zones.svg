<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-amber" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розподіл температурних зон і повітряного потоку залежно від насадки фена</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Точний добір профілю насадки локалізує нагрів IC-корпусу та запобігає здуттю і деформації плати</text>

  <!-- ================= ПАНЕЛЬ 1: SOIC ================= -->
  <rect x="25" y="70" width="294" height="450" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>

  <!-- Заголовок панелі 1 -->
  <rect x="37" y="82" width="270" height="34" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="6"/>
  <text x="172" y="104" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Точкова насадка (Ø 3–5 мм)</text>

  <!-- Графічна зона 1 -->
  <rect x="37" y="126" width="270" height="254" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>

  <!-- Насадка SOIC -->
  <path d="M 152 136 L 192 136 L 192 160 L 179 185 L 179 205 L 165 205 L 165 185 L 152 160 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Повітряний потік SOIC -->
  <line x1="168" y1="208" x2="168" y2="240" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-blue)"/>
  <line x1="172" y1="208" x2="172" y2="244" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="176" y1="208" x2="176" y2="240" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-blue)"/>

  <!-- Температурна зона (контур) -->
  <polygon points="165,205 188,246 156,246" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3" opacity="0.7"/>

  <!-- Компоненти на платі 1 -->
  <rect x="75" y="258" width="18" height="10" fill="#64748b" rx="1"/>
  <text x="84" y="246" font-size="12" fill="#27ae60" text-anchor="middle">Безпечна зона</text>

  <rect x="147" y="250" width="50" height="18" fill="#1e293b" rx="2"/>
  <rect x="139" y="260" width="8" height="8" fill="#94a3b8"/>
  <rect x="197" y="260" width="8" height="8" fill="#94a3b8"/>
  <text x="172" y="263" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">SOIC</text>

  <rect x="251" y="258" width="18" height="10" fill="#64748b" rx="1"/>

  <!-- Друкована плата (PCB) 1 -->
  <rect x="47" y="268" width="250" height="12" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1" rx="2"/>
  <rect x="47" y="268" width="250" height="3" fill="#27ae60" opacity="0.6"/>

  <!-- Графік температурного профілю 1 -->
  <text x="172" y="306" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">T_max (вузький пік)</text>
  <path d="M 57 356 L 130 356 Q 172 318 172 318 Q 172 318 214 356 L 287 356" fill="none" stroke="#c0392b" stroke-width="2"/>
  <line x1="57" y1="356" x2="287" y2="356" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="172" y="372" font-size="12" fill="#6b7280" text-anchor="middle">Градієнт температури (T°)</text>

  <!-- Нижня блок-картка 1 -->
  <rect x="37" y="390" width="270" height="120" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="6"/>
  <text x="50" y="412" font-size="13" font-weight="bold" fill="#27ae60">✓ Призначення: SOIC / SOP / SOT</text>
  <text x="50" y="435" font-size="12" fill="#1a1a1a">• Локальний вузький потік повітря</text>
  <text x="50" y="455" font-size="12" fill="#1a1a1a">• Запобігає здуванню дрібних SMD</text>
  <text x="50" y="475" font-size="12" fill="#1a1a1a">• Мінімальний термошок суміжних зон</text>
  <text x="50" y="495" font-size="12" fill="#6b7280">• Оптимальний зазор: 3–5 мм від IC</text>


  <!-- ================= ПАНЕЛЬ 2: QFP ================= -->
  <rect x="333" y="70" width="294" height="450" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>

  <!-- Заголовок панелі 2 -->
  <rect x="345" y="82" width="270" height="34" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="6"/>
  <text x="480" y="104" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Квадратна насадка (QFP / TQFP)</text>

  <!-- Графічна зона 2 -->
  <rect x="345" y="126" width="270" height="254" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>

  <!-- Насадка QFP -->
  <path d="M 430 136 L 530 136 L 530 160 L 545 185 L 545 205 L 415 205 L 415 185 L 430 160 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="480" y1="136" x2="480" y2="180" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Повітряний потік QFP -->
  <line x1="425" y1="208" x2="425" y2="244" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="455" y1="208" x2="455" y2="240" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-blue)"/>
  <line x1="505" y1="208" x2="505" y2="240" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-blue)"/>
  <line x1="535" y1="208" x2="535" y2="244" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Температурна зона 2 -->
  <rect x="410" y="205" width="140" height="41" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3" opacity="0.7"/>

  <!-- Компонент QFP -->
  <rect x="440" y="246" width="80" height="22" fill="#1e293b" rx="2"/>
  <rect x="418" y="260" width="22" height="8" fill="#94a3b8"/>
  <rect x="520" y="260" width="22" height="8" fill="#94a3b8"/>
  <text x="480" y="261" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">QFP-100</text>

  <!-- Друкована плата (PCB) 2 -->
  <rect x="355" y="268" width="250" height="12" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1" rx="2"/>
  <rect x="355" y="268" width="250" height="3" fill="#27ae60" opacity="0.6"/>

  <!-- Графік температурного профілю 2 -->
  <text x="480" y="306" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">T_плато (рівномірне поле)</text>
  <path d="M 365 356 L 405 356 Q 420 318 430 318 L 530 318 Q 540 318 555 356 L 595 356" fill="none" stroke="#c0392b" stroke-width="2"/>
  <line x1="365" y1="356" x2="595" y2="356" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="480" y="372" font-size="12" fill="#6b7280" text-anchor="middle">Широкий ізотермічний профіль</text>

  <!-- Нижня блок-картка 2 -->
  <rect x="345" y="390" width="270" height="120" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="6"/>
  <text x="358" y="412" font-size="13" font-weight="bold" fill="#27ae60">✓ Призначення: QFP / TQFP / PLCC</text>
  <text x="358" y="435" font-size="12" fill="#1a1a1a">• Одночасне розплавлення всіх 4 сторін</text>
  <text x="358" y="455" font-size="12" fill="#1a1a1a">• Виключено перекіс і викривлення виводів</text>
  <text x="358" y="475" font-size="12" fill="#1a1a1a">• Рівномірний тепловий градієнт</text>
  <text x="358" y="495" font-size="12" fill="#6b7280">• Насадка добирається за розміром IC</text>


  <!-- ================= ПАНЕЛЬ 3: BGA ================= -->
  <rect x="641" y="70" width="294" height="450" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>

  <!-- Заголовок панелі 3 -->
  <rect x="653" y="82" width="270" height="34" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="6"/>
  <text x="788" y="104" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">BGA-насадка + Нижній підігрів</text>

  <!-- Графічна зона 3 -->
  <rect x="653" y="126" width="270" height="254" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>

  <!-- Насадка BGA -->
  <path d="M 738 136 L 838 136 L 838 160 L 853 185 L 853 205 L 723 205 L 723 185 L 738 160 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="733" y="188" width="14" height="12" fill="#ffffff" stroke="#2457d6" stroke-width="1" rx="1"/>
  <rect x="831" y="188" width="14" height="12" fill="#ffffff" stroke="#2457d6" stroke-width="1" rx="1"/>
  <path d="M 733 194 L 718 194" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M 845 194 L 860 194" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Повітряний потік BGA -->
  <line x1="755" y1="208" x2="755" y2="236" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-blue)"/>
  <line x1="788" y1="208" x2="788" y2="236" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="821" y1="208" x2="821" y2="236" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-blue)"/>

  <!-- Компонент BGA + Кульки -->
  <rect x="738" y="244" width="100" height="18" fill="#1e293b" rx="2"/>
  <circle cx="748" cy="265" r="2.5" fill="#94a3b8" stroke="#475569" stroke-width="0.5"/>
  <circle cx="760" cy="265" r="2.5" fill="#94a3b8" stroke="#475569" stroke-width="0.5"/>
  <circle cx="772" cy="265" r="2.5" fill="#94a3b8" stroke="#475569" stroke-width="0.5"/>
  <circle cx="784" cy="265" r="2.5" fill="#94a3b8" stroke="#475569" stroke-width="0.5"/>
  <circle cx="796" cy="265" r="2.5" fill="#94a3b8" stroke="#475569" stroke-width="0.5"/>
  <circle cx="808" cy="265" r="2.5" fill="#94a3b8" stroke="#475569" stroke-width="0.5"/>
  <circle cx="820" cy="265" r="2.5" fill="#94a3b8" stroke="#475569" stroke-width="0.5"/>
  <circle cx="832" cy="265" r="2.5" fill="#94a3b8" stroke="#475569" stroke-width="0.5"/>
  <text x="788" y="257" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">BGA Chip</text>

  <!-- Друкована плата (PCB) 3 -->
  <rect x="663" y="268" width="250" height="12" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1" rx="2"/>
  <rect x="663" y="268" width="250" height="3" fill="#27ae60" opacity="0.6"/>

  <!-- Нижній підігрів (пластина та потік) -->
  <rect x="713" y="284" width="150" height="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1" rx="2"/>
  <text x="788" y="304" font-size="12" font-weight="bold" fill="#d97706" text-anchor="middle">Нижній підігрів (120–150°C)</text>

  <!-- Графік температурного профілю 3 -->
  <text x="788" y="322" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Об'ємний прогрів T_bga</text>
  <path d="M 673 356 Q 713 346 738 332 L 838 332 Q 863 346 903 356" fill="none" stroke="#c0392b" stroke-width="2"/>
  <line x1="673" y1="356" x2="903" y2="356" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="788" y="372" font-size="12" fill="#6b7280" text-anchor="middle">Запобігає розшаруванню плати</text>

  <!-- Нижня блок-картка 3 -->
  <rect x="653" y="390" width="270" height="120" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="6"/>
  <text x="666" y="412" font-size="13" font-weight="bold" fill="#27ae60">✓ Призначення: BGA / CSP / LGA</text>
  <text x="666" y="435" font-size="12" fill="#1a1a1a">• Двосторонній прогрів без деформації</text>
  <text x="666" y="455" font-size="12" fill="#1a1a1a">• Відсутність здуття плати (delamination)</text>
  <text x="666" y="475" font-size="12" fill="#1a1a1a">• Рівномірне плавлення масиву кульок</text>
  <text x="666" y="495" font-size="12" fill="#6b7280">• Обов'язковий попередній підігрів</text>
</svg>
