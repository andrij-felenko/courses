<svg viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
<rect x="0" y="0" width="960" height="460" fill="white"/>

<!-- Headers -->
<text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Контур PID-регулювання термоповітряної паяльної станції</text>
<text x="480" y="65" font-size="13" fill="#6b7280" text-anchor="middle">Згладжування перехідного температурного процесу через опрацювання помилки неузгодження та керування PWM</text>

<defs>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
  </marker>
</defs>

<!-- Nodes -->
<circle cx="180" cy="220" r="20" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" />
<text x="165" y="215" fill="#1a1a1a" font-size="16" font-weight="bold" text-anchor="middle">+</text>
<text x="195" y="250" fill="#1a1a1a" font-size="16" font-weight="bold" text-anchor="middle">-</text>

<rect x="280" y="190" width="140" height="60" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" />
<text x="350" y="215" fill="#1a1a1a" font-size="14" font-weight="bold" text-anchor="middle">Дискретний</text>
<text x="350" y="235" fill="#1a1a1a" font-size="14" font-weight="bold" text-anchor="middle">PID-контролер</text>

<rect x="580" y="190" width="160" height="60" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" />
<text x="660" y="215" fill="#1a1a1a" font-size="14" font-weight="bold" text-anchor="middle">Нагрівальний</text>
<text x="660" y="235" fill="#1a1a1a" font-size="14" font-weight="bold" text-anchor="middle">елемент</text>

<rect x="430" y="330" width="140" height="60" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" />
<text x="500" y="355" fill="#1a1a1a" font-size="14" font-weight="bold" text-anchor="middle">Термопара</text>
<text x="500" y="375" fill="#1a1a1a" font-size="14" font-weight="bold" text-anchor="middle">K-типу</text>

<!-- Lines -->
<line x1="40" y1="220" x2="155" y2="220" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)" />
<text x="100" y="190" fill="#1a1a1a" font-size="13" text-anchor="middle">Задана темп.</text>
<text x="100" y="206" fill="#1a1a1a" font-size="13" font-style="italic" text-anchor="middle">T_set</text>

<line x1="200" y1="220" x2="275" y2="220" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)" />
<text x="240" y="190" fill="#1a1a1a" font-size="13" text-anchor="middle">Помилка</text>
<text x="240" y="206" fill="#c0392b" font-size="13" font-weight="bold" text-anchor="middle">e(t)</text>

<line x1="420" y1="220" x2="575" y2="220" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)" />
<text x="500" y="190" fill="#1a1a1a" font-size="13" text-anchor="middle">Цифровий сигнал</text>
<text x="500" y="206" fill="#2457d6" font-size="13" font-weight="bold" text-anchor="middle">ШІМ (PWM)</text>

<line x1="740" y1="220" x2="880" y2="220" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)" />
<text x="835" y="190" fill="#1a1a1a" font-size="13" text-anchor="middle">Фактична темп.</text>
<text x="835" y="206" fill="#1a1a1a" font-size="13" font-style="italic" text-anchor="middle">T_out</text>

<!-- Feedback -->
<circle cx="780" cy="220" r="4" fill="#1a1a1a" />
<path d="M780,220 L780,360 L575,360" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)" />
<path d="M430,360 L180,360 L180,245" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)" />
<text x="300" y="330" fill="#1a1a1a" font-size="13" text-anchor="middle">Ланцюг зворотного зв'язку</text>
<text x="300" y="346" fill="#1a1a1a" font-size="13" font-style="italic" text-anchor="middle">T_meas</text>

<!-- Chart -->
<rect x="755" y="80" width="175" height="85" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" />
<text x="842" y="98" fill="#6b7280" font-size="12" font-weight="bold" text-anchor="middle">Перехідний процес</text>
<path d="M770,150 L870,150 M770,150 L770,110" fill="none" stroke="#6b7280" stroke-width="1" />
<path d="M770,124 L865,124" fill="none" stroke="#27ae60" stroke-width="1" stroke-dasharray="4,4" />
<text x="872" y="128" fill="#27ae60" font-size="12" text-anchor="start">T_set</text>
<path d="M770,150 C 785,150 795,124 825,124 L865,124" fill="none" stroke="#2457d6" stroke-width="2" />
</svg>
