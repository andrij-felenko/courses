<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Будова та схема підключення ручки термоповітряного фена BAKU</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Вузли розбирання, розташування нагрівача й сенсорів та електричне розведення джгута</text>

  <!-- PANEL 1: Disassembly & Wand Structure -->
  <rect x="20" y="65" width="920" height="235" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="38" y="86" font-size="13" font-weight="bold" fill="#1a1a1a">1. Вузли розбирання та внутрішні компоненти ручки фена</text>

  <!-- Top Callouts in Panel 1 -->
  <!-- Callout A: Fan / Turbine -->
  <text x="128" y="112" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Турбіна 24 В</text>
  <text x="128" y="127" font-size="12" fill="#6b7280" text-anchor="middle">(нагнітач DC)</text>
  <line x1="128" y1="131" x2="128" y2="152" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Callout B: Crimps -->
  <text x="295" y="112" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Обтискні гільзи</text>
  <text x="295" y="127" font-size="12" fill="#6b7280" text-anchor="middle">(термостійкі)</text>
  <line x1="295" y1="131" x2="295" y2="166" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Callout C: Heater Core -->
  <text x="445" y="112" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Керамічний нагрівач</text>
  <text x="445" y="127" font-size="12" fill="#c0392b" text-anchor="middle">(спіраль 70 Ом)</text>
  <line x1="445" y1="131" x2="445" y2="166" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Callout D: Mica Tube -->
  <text x="604" y="112" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Слюдяна гільза</text>
  <text x="604" y="127" font-size="12" fill="#6b7280" text-anchor="middle">(діелектрик)</text>
  <line x1="604" y1="131" x2="604" y2="160" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Callout E: Steel Barrel -->
  <text x="738" y="112" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Захисний кожух</text>
  <text x="738" y="127" font-size="12" fill="#2457d6" text-anchor="middle">(сталь, контакт PE)</text>
  <line x1="738" y1="131" x2="738" y2="156" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Callout F: Nozzle -->
  <text x="878" y="112" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Знімне сопло</text>
  <text x="878" y="127" font-size="12" fill="#6b7280" text-anchor="middle">(з гайкою)</text>
  <line x1="878" y1="131" x2="880" y2="166" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Mechanical Components Drawn along axis y=185 -->
  <!-- 1. Cable inlet & boot -->
  <rect x="35" y="176" width="30" height="18" rx="3" fill="#475569" stroke="#1e293b" stroke-width="1"/>
  <path d="M65,172 L85,160 L85,210 L65,198 Z" fill="#64748b" stroke="#334155" stroke-width="1"/>

  <!-- 2. Handle Body (lower half shell background) -->
  <rect x="88" y="156" width="235" height="58" rx="6" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Fan / Blower inside handle -->
  <rect x="98" y="162" width="52" height="46" rx="4" fill="#cbd5e1" stroke="#64748b" stroke-width="1"/>
  <circle cx="124" cy="185" r="14" fill="#94a3b8" stroke="#475569" stroke-width="1"/>
  <!-- Fan blades -->
  <path d="M124,175 L124,195 M114,185 L134,185 M117,178 L131,192 M117,192 L131,178" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Silicone O-ring seal -->
  <rect x="154" y="166" width="8" height="38" rx="3" fill="#f87171" stroke="#dc2626" stroke-width="1"/>

  <!-- Reed switch capsule -->
  <rect x="195" y="196" width="45" height="12" rx="3" fill="#e0f2fe" stroke="#0284c7" stroke-width="1"/>
  <line x1="198" y1="202" x2="215" y2="202" stroke="#0369a1" stroke-width="1"/>
  <line x1="237" y1="202" x2="217" y2="200" stroke="#0369a1" stroke-width="1"/>

  <!-- Terminal crimps block inside handle -->
  <rect x="270" y="168" width="45" height="34" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1"/>
  <circle cx="282" cy="177" r="3" fill="#d97706"/>
  <circle cx="302" cy="177" r="3" fill="#d97706"/>
  <circle cx="282" cy="193" r="3" fill="#0284c7"/>
  <circle cx="302" cy="193" r="3" fill="#0284c7"/>

  <!-- Disassembly Arrow 1 -->
  <line x1="330" y1="185" x2="352" y2="185" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 3. Ceramic Heater Element -->
  <rect x="360" y="168" width="155" height="34" rx="3" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <!-- Heater wires extending left -->
  <line x1="345" y1="176" x2="360" y2="176" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="345" y1="182" x2="360" y2="182" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="345" y1="188" x2="360" y2="188" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="345" y1="194" x2="360" y2="194" stroke="#2457d6" stroke-width="1.5"/>
  <!-- Internal coil zig-zag -->
  <path d="M375,185 Q382,174 390,185 T405,185 T420,185 T435,185 T450,185 T465,185 T480,185 T495,185" fill="none" stroke="#dc2626" stroke-width="1.8"/>
  <!-- Thermocouple bead at the tip -->
  <line x1="495" y1="182" x2="512" y2="182" stroke="#27ae60" stroke-width="1"/>
  <line x1="495" y1="188" x2="512" y2="188" stroke="#2457d6" stroke-width="1"/>
  <circle cx="514" cy="185" r="4" fill="#7c3aed" stroke="#5b21b6" stroke-width="1"/>

  <!-- Disassembly Arrow 2 -->
  <line x1="524" y1="185" x2="546" y2="185" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 4. Mica Tube (Dielectric sleeve) -->
  <rect x="555" y="164" width="95" height="42" rx="3" fill="#fefce8" stroke="#ca8a04" stroke-width="1.2" stroke-dasharray="3,1"/>
  <line x1="565" y1="170" x2="640" y2="170" stroke="#ca8a04" stroke-width="0.8" stroke-opacity="0.5"/>
  <line x1="565" y1="200" x2="640" y2="200" stroke="#ca8a04" stroke-width="0.8" stroke-opacity="0.5"/>

  <!-- Disassembly Arrow 3 -->
  <line x1="658" y1="185" x2="678" y2="185" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 5. Steel Barrel -->
  <rect x="685" y="160" width="105" height="50" rx="3" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <rect x="690" y="164" width="95" height="42" fill="none" stroke="#94a3b8" stroke-width="1"/>
  <!-- Ground PE lug on barrel -->
  <rect x="700" y="152" width="16" height="8" rx="2" fill="#ca8a04" stroke="#854d0e" stroke-width="1"/>
  <circle cx="708" cy="156" r="1.5" fill="#1e293b"/>

  <!-- Disassembly Arrow 4 -->
  <line x1="798" y1="185" x2="816" y2="185" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 6. Locking nut & Nozzle -->
  <rect x="822" y="165" width="18" height="40" rx="2" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>
  <line x1="827" y1="168" x2="827" y2="202" stroke="#475569" stroke-width="1"/>
  <line x1="832" y1="168" x2="832" y2="202" stroke="#475569" stroke-width="1"/>
  <!-- Removable Nozzle cone -->
  <path d="M848,168 L888,175 L915,178 L915,192 L888,195 L848,202 Z" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/>

  <!-- Bottom Callouts in Panel 1 -->
  <!-- Callout B1: Cable Inlet -->
  <text x="65" y="252" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кабель 8 жил</text>
  <text x="65" y="267" font-size="12" fill="#6b7280" text-anchor="middle">(силікон)</text>
  <line x1="65" y1="236" x2="65" y2="202" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Callout B2: Seal Ring -->
  <text x="158" y="252" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Ущільнювач</text>
  <text x="158" y="267" font-size="12" fill="#c0392b" text-anchor="middle">(тиск потоку)</text>
  <line x1="158" y1="236" x2="158" y2="210" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Callout B3: Reed Switch -->
  <text x="270" y="252" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Геркон підставки</text>
  <text x="270" y="267" font-size="12" fill="#2457d6" text-anchor="middle">(автоохолодження)</text>
  <line x1="250" y1="236" x2="225" y2="214" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Callout B4: Thermocouple Tip -->
  <text x="515" y="252" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Спай термопари</text>
  <text x="515" y="267" font-size="12" fill="#7c3aed" text-anchor="middle">(K-тип, захист S-E)</text>
  <line x1="515" y1="236" x2="515" y2="195" stroke="#7c3aed" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Callout B5: PE Ground Lug -->
  <text x="708" y="252" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Заземлення PE</text>
  <text x="708" y="267" font-size="12" fill="#27ae60" text-anchor="middle">(ESD-захист &lt; 1 Ом)</text>
  <line x1="708" y1="236" x2="708" y2="216" stroke="#27ae60" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Callout B6: Air Nozzle -->
  <text x="880" y="252" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Потік повітря</text>
  <text x="880" y="267" font-size="12" fill="#6b7280" text-anchor="middle">(до 480 °C)</text>
  <line x1="880" y1="236" x2="880" y2="210" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- PANEL 2: Pinout, Wiring & Diagnostics -->
  <rect x="20" y="312" width="920" height="236" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="38" y="333" font-size="13" font-weight="bold" fill="#1a1a1a">2. Схема електричних з'єднань джгута та мультиметрична діагностика</text>

  <!-- Sub-panel 2A: 8-Wire Pinout Table -->
  <rect x="36" y="345" width="484" height="191" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="364" font-size="12" font-weight="bold" fill="#1a1a1a">Колірне маркування та призначення жил джгута</text>

  <!-- Table Header Line -->
  <line x1="50" y1="372" x2="506" y2="372" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Row 1: Heater L1 -->
  <circle cx="58" cy="385" r="4.5" fill="#dc2626" stroke="#b91c1c" stroke-width="1"/>
  <text x="70" y="389" font-size="12" font-weight="bold" fill="#1a1a1a">Червоний</text>
  <text x="155" y="389" font-size="12" fill="#6b7280">Heater L1 (~220 В AC, фаза спіралі нагрівача)</text>

  <!-- Row 2: Heater L2 -->
  <circle cx="58" cy="404" r="4.5" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="70" y="408" font-size="12" font-weight="bold" fill="#1a1a1a">Білий</text>
  <text x="155" y="408" font-size="12" fill="#6b7280">Heater L2 (~220 В AC, нуль спіралі нагрівача)</text>

  <!-- Row 3: Fan (+) -->
  <circle cx="58" cy="423" r="4.5" fill="#eab308" stroke="#ca8a04" stroke-width="1"/>
  <text x="70" y="427" font-size="12" font-weight="bold" fill="#1a1a1a">Жовтий</text>
  <text x="155" y="427" font-size="12" fill="#6b7280">Fan (+) (0..24 В DC PWM, живлення турбіни)</text>

  <!-- Row 4: Fan (-) / GND -->
  <circle cx="58" cy="442" r="4.5" fill="#1e293b" stroke="#0f172a" stroke-width="1"/>
  <text x="70" y="446" font-size="12" font-weight="bold" fill="#1a1a1a">Чорний</text>
  <text x="155" y="446" font-size="12" fill="#6b7280">Fan (-) / GND (спільний мінус турбіни й геркона)</text>

  <!-- Row 5: TC (+) -->
  <circle cx="58" cy="461" r="4.5" fill="#16a34a" stroke="#15803d" stroke-width="1"/>
  <text x="70" y="465" font-size="12" font-weight="bold" fill="#1a1a1a">Зелений</text>
  <text x="155" y="465" font-size="12" fill="#6b7280">TC (+) (хромель, аналоговий термосигнал +)</text>

  <!-- Row 6: TC (-) -->
  <circle cx="58" cy="480" r="4.5" fill="#2563eb" stroke="#1d4ed8" stroke-width="1"/>
  <text x="70" y="484" font-size="12" font-weight="bold" fill="#1a1a1a">Синій</text>
  <text x="155" y="484" font-size="12" fill="#6b7280">TC (-) (алюмель, аналоговий термосигнал -)</text>

  <!-- Row 7: Reed Switch -->
  <circle cx="58" cy="499" r="4.5" fill="#92400e" stroke="#78350f" stroke-width="1"/>
  <text x="70" y="503" font-size="12" font-weight="bold" fill="#1a1a1a">Коричневий</text>
  <text x="155" y="503" font-size="12" fill="#6b7280">Reed Switch (геркон підставки, сигнал Standby)</text>

  <!-- Row 8: Ground PE -->
  <circle cx="58" cy="518" r="4.5" fill="#84cc16" stroke="#4d7c0f" stroke-width="1"/>
  <text x="70" y="522" font-size="12" font-weight="bold" fill="#1a1a1a">Жовто-зел.</text>
  <text x="155" y="522" font-size="12" fill="#6b7280">PE Ground (захисне заземлення сопла, ESD)</text>

  <!-- Sub-panel 2B: Diagnostic Reference Criteria -->
  <rect x="536" y="345" width="388" height="191" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="550" y="364" font-size="12" font-weight="bold" fill="#1a1a1a">Мультиметрична перевірка кіл (при 25 °C)</text>

  <!-- Table Header Line -->
  <line x1="550" y1="372" x2="910" y2="372" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Diagnostic Block 1: Heater -->
  <text x="552" y="390" font-size="12" font-weight="bold" fill="#c0392b">Нагрівач L1–L2:</text>
  <text x="652" y="390" font-size="12" fill="#1a1a1a">R = 70–75 Ом (номінал 670 Вт при 25 °C)</text>
  <text x="552" y="405" font-size="12" fill="#6b7280">R = ∞ (OL) — обрив спіралі; R &lt; 40 Ом — міжвиткове КЗ</text>
  <line x1="552" y1="413" x2="910" y2="413" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Diagnostic Block 2: Thermocouple -->
  <text x="552" y="429" font-size="12" font-weight="bold" fill="#2457d6">Термопара TC:</text>
  <text x="652" y="429" font-size="12" fill="#1a1a1a">R = 1.2–3.0 Ом, термо-ЕРС = +0.5..18 мВ</text>
  <text x="552" y="444" font-size="12" fill="#6b7280">Обрив спаю (OL) викликає системну помилку S-E</text>
  <line x1="552" y1="452" x2="910" y2="452" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Diagnostic Block 3: Reed Switch -->
  <text x="552" y="468" font-size="12" font-weight="bold" fill="#27ae60">Геркон Reed:</text>
  <text x="645" y="468" font-size="12" fill="#1a1a1a">У повітрі R = ∞; на підставці R &lt; 1 Ом</text>
  <text x="552" y="483" font-size="12" fill="#6b7280">Замикання вмикає автоохолодження турбіною до 100 °C</text>
  <line x1="552" y1="491" x2="910" y2="491" stroke="#f1f5f9" stroke-width="1"/>

  <!-- Diagnostic Block 4: Ground PE -->
  <text x="552" y="507" font-size="12" font-weight="bold" fill="#1a1a1a">Заземлення PE:</text>
  <text x="652" y="507" font-size="12" fill="#1a1a1a">R &lt; 1.0 Ом (металеве сопло ──> земля)</text>
  <text x="552" y="522" font-size="12" fill="#6b7280">Захист чутливих SMD-компонентів від заряду ESD</text>

</svg>
