<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <pattern id="heater-pattern" width="10" height="10" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="10" y2="10" stroke="#d0d7de" stroke-width="1"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема заміни та обтискання керамічного нагрівача</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Послідовність монтажу слюдяної трубки, ізоляції та критерії надійного з'єднання виводів</text>

  <!-- ЛІВА ЧАСТИНА: Послідовність монтажу -->
  <rect x="40" y="90" width="560" height="340" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="320" y="115" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Послідовність монтажу</text>

  <!-- 1. Керамічний нагрівач і виводи -->
  <rect x="80" y="160" width="120" height="40" fill="url(#heater-pattern)" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="80" y="160" width="12" height="40" fill="#1a1a1a"/>
  <!-- Виводи нагрівача -->
  <line x1="200" y1="170" x2="280" y2="170" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="200" y1="190" x2="280" y2="190" stroke="#1a1a1a" stroke-width="2"/>
  <text x="140" y="150" font-size="12" fill="#1a1a1a" text-anchor="middle">Нагрівач</text>

  <!-- 2. Слюдяна трубка -->
  <rect x="160" y="220" width="140" height="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" stroke-dasharray="4 2" fill-opacity="0.5"/>
  <path d="M 230 220 L 230 180" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="230" y="285" font-size="12" fill="#2457d6" text-anchor="middle">Слюдяна трубка (ізолятор)</text>
  
  <!-- 3. З'єднання та обтиск -->
  <rect x="340" y="165" width="30" height="10" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="340" y="185" width="30" height="10" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <text x="355" y="150" font-size="12" fill="#1a1a1a" text-anchor="middle">Обтискні гільзи</text>

  <!-- Дроти від станції -->
  <line x1="370" y1="170" x2="450" y2="170" stroke="#c0392b" stroke-width="3"/>
  <line x1="370" y1="190" x2="450" y2="190" stroke="#2457d6" stroke-width="3"/>
  
  <line x1="280" y1="170" x2="340" y2="170" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="280" y1="190" x2="340" y2="190" stroke="#1a1a1a" stroke-width="2"/>

  <!-- 4. Термостійкі рукави -->
  <rect x="300" y="220" width="110" height="16" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="4"/>
  <path d="M 355 220 L 355 195" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-black)"/>
  <text x="355" y="250" font-size="12" fill="#27ae60" text-anchor="middle">Термостійкі рукави</text>
  <text x="355" y="265" font-size="12" fill="#6b7280" text-anchor="middle">(насуваються на з'єднання)</text>

  <text x="460" y="183" font-size="12" fill="#1a1a1a">Дроти</text>
  
  <!-- Кроки текстом -->
  <text x="60" y="320" font-size="13" font-weight="bold" fill="#1a1a1a">Порядок дій:</text>
  <text x="60" y="340" font-size="13" fill="#1a1a1a">1. Одягнути слюдяну трубку на керамічний нагрівач.</text>
  <text x="60" y="360" font-size="13" fill="#1a1a1a">2. Одягнути термостійкі рукави на дроти станції.</text>
  <text x="60" y="380" font-size="13" fill="#1a1a1a">3. З'єднати виводи нагрівача з дротами через металеві гільзи.</text>
  <text x="60" y="400" font-size="13" fill="#1a1a1a">4. Щільно обтиснути гільзи (без паяння).</text>
  <text x="60" y="420" font-size="13" fill="#1a1a1a">5. Насунути термостійкі рукави поверх обтиснутих гільз.</text>

  <!-- ПРАВА ЧАСТИНА: Критерії з'єднання -->
  <text x="770" y="90" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Критерії з'єднання</text>

  <!-- ПРАВИЛЬНО -->
  <rect x="620" y="110" width="300" height="140" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="8"/>
  <text x="635" y="135" font-size="14" font-weight="bold" fill="#27ae60">ТАК: Надійний обтиск</text>
  
  <line x1="650" y1="180" x2="710" y2="180" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="710" y="172" width="40" height="16" fill="#d0d7de" stroke="#1a1a1a" stroke-width="2"/>
  <!-- вм'ятини від інструменту -->
  <line x1="720" y1="172" x2="720" y2="188" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="740" y1="172" x2="740" y2="188" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="750" y1="180" x2="810" y2="180" stroke="#c0392b" stroke-width="3"/>
  <rect x="690" y="165" width="80" height="30" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="635" y="215" font-size="12" fill="#1a1a1a">• Механічна міцність</text>
  <text x="635" y="235" font-size="12" fill="#1a1a1a">• Стійкість до високих температур</text>

  <!-- НЕПРАВИЛЬНО -->
  <rect x="620" y="270" width="300" height="160" fill="#fdecea" stroke="#c0392b" stroke-width="2" rx="8"/>
  <text x="635" y="295" font-size="14" font-weight="bold" fill="#c0392b">НІ: Скрутка або звичайне паяння</text>
  
  <line x1="650" y1="340" x2="710" y2="340" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="725" cy="340" r="15" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="740" y1="340" x2="800" y2="340" stroke="#c0392b" stroke-width="3"/>
  
  <text x="635" y="380" font-size="12" fill="#1a1a1a">• Припій розплавиться від нагріву</text>
  <text x="635" y="400" font-size="12" fill="#1a1a1a">• Окислення та втрата контакту</text>
  <text x="635" y="420" font-size="12" fill="#1a1a1a">• Ризик короткого замикання</text>

</svg>
