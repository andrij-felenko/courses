<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розводка контактів 8-пінового роз'єму GX16 фена BAKU</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Вигляд з боку паяння штекера: просторове розмежування силових 220 В та низьковольтних сигнальних кіл</text>

  <!-- ЛІВА ПАНЕЛЬ: Схема роз'єму GX16 -->
  <rect x="24" y="72" width="436" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Підзаголовок лівої панелі -->
  <rect x="40" y="84" width="404" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="242" y="102" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Штекер GX16 — вигляд з боку паяння проводів</text>

  <!-- Ключ (паз) роз'єму -->
  <text x="242" y="122" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Фіксувальний ключ (орієнтація 12:00)</text>
  <rect x="234" y="126" width="16" height="10" rx="2" fill="#6b7280" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Зовнішній металевий корпус роз'єму -->
  <circle cx="242" cy="240" r="104" fill="#e5e7eb" stroke="#6b7280" stroke-width="3"/>
  <!-- Різьбовий фланець -->
  <circle cx="242" cy="240" r="96" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <!-- Керамічний / термопластиковий ізолятор -->
  <circle cx="242" cy="240" r="88" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>

  <!-- ПІНИ РОЗ'ЄМУ (контакти паяння з номерами всередині) -->

  <!-- Pin 1: Heater L1 (220V) -->
  <circle cx="217" cy="189" r="14" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <circle cx="217" cy="189" r="7" fill="white" stroke="#c0392b" stroke-width="1"/>
  <text x="217" y="193" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">1</text>
  <circle cx="203" cy="175" r="5" fill="#c0392b" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Pin 2: Heater L2 (220V) -->
  <circle cx="267" cy="189" r="14" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <circle cx="267" cy="189" r="7" fill="white" stroke="#c0392b" stroke-width="1"/>
  <text x="267" y="193" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">2</text>
  <circle cx="281" cy="175" r="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Pin 3: Fan + (0..24V PWM) -->
  <circle cx="298" cy="227" r="14" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <circle cx="298" cy="227" r="7" fill="white" stroke="#2457d6" stroke-width="1"/>
  <text x="298" y="231" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">3</text>
  <circle cx="316" cy="223" r="5" fill="#eab308" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Pin 4: Fan - / GND -->
  <circle cx="287" cy="275" r="14" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <circle cx="287" cy="275" r="7" fill="white" stroke="#2457d6" stroke-width="1"/>
  <text x="287" y="279" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">4</text>
  <circle cx="303" cy="287" r="5" fill="#1a1a1a" stroke="#6b7280" stroke-width="1"/>

  <!-- Pin 5: Thermocouple TC+ -->
  <circle cx="242" cy="297" r="14" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <circle cx="242" cy="297" r="7" fill="white" stroke="#27ae60" stroke-width="1"/>
  <text x="242" y="301" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">5</text>
  <circle cx="242" cy="317" r="5" fill="#22c55e" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Pin 6: Thermocouple TC- -->
  <circle cx="197" cy="275" r="14" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <circle cx="197" cy="275" r="7" fill="white" stroke="#27ae60" stroke-width="1"/>
  <text x="197" y="279" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">6</text>
  <circle cx="181" cy="287" r="5" fill="#2563eb" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Pin 7: Reed Switch -->
  <circle cx="186" cy="227" r="14" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <circle cx="186" cy="227" r="7" fill="white" stroke="#d97706" stroke-width="1"/>
  <text x="186" y="231" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">7</text>
  <circle cx="168" cy="223" r="5" fill="#854d0e" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Pin 8: PE Ground (Center) -->
  <circle cx="242" cy="240" r="14" fill="#e9f7ef" stroke="#16a34a" stroke-width="2.5"/>
  <circle cx="242" cy="240" r="7" fill="white" stroke="#16a34a" stroke-width="1"/>
  <text x="242" y="244" font-size="12" font-weight="bold" fill="#16a34a" text-anchor="middle">8</text>
  <circle cx="258" cy="254" r="5" fill="#84cc16" stroke="#15803d" stroke-width="1"/>

  <!-- Нижня інформаційна табличка лівої панелі -->
  <rect x="38" y="356" width="408" height="134" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="50" y="375" font-size="12" font-weight="bold" fill="#1a1a1a">Зведена карта контактів та колірне маркування:</text>
  <text x="50" y="395" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#c0392b">Pin 1, 2:</tspan> 220 В ~ нагрівач (<tspan fill="#6b7280">червоний, білий</tspan>) — R = 70...75 Ω</text>
  <text x="50" y="415" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#2457d6">Pin 3, 4:</tspan> Турбіна 0–24 В PWM та GND (<tspan fill="#6b7280">жовтий, чорний</tspan>)</text>
  <text x="50" y="435" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#27ae60">Pin 5, 6:</tspan> Термопара K-типу (<tspan fill="#6b7280">зелений TC+, синій TC-</tspan>) — R = 1...3 Ω</text>
  <text x="50" y="455" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#1a1a1a">Pin 7:</tspan> Геркон підставки (<tspan fill="#6b7280">коричневий дріт, замикає на Pin 4</tspan>)</text>
  <text x="50" y="475" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#16a34a">Pin 8 (центр):</tspan> Захисне заземлення сопла PE (<tspan fill="#6b7280">жовто-зелений</tspan>)</text>

  <!-- ПРАВА ПАНЕЛЬ: Електричні параметри та опис кіл -->
  <rect x="478" y="72" width="458" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- КАРТКА 1: Силове коло нагрівача (220 В) -->
  <rect x="492" y="84" width="430" height="72" rx="6" fill="white" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="504" y="92" width="60" height="20" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="534" y="106" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Pin 1 · 2</text>
  <text x="574" y="106" font-size="13" font-weight="bold" fill="#c0392b">СИЛОВИЙ КЕРАМІЧНИЙ НАГРІВАЧ</text>
  <text x="504" y="128" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">Змінна напруга 220 В ~</tspan> | Струм до 3 А | Потужність 650–700 Вт</text>
  <text x="504" y="146" font-size="12" fill="#6b7280">Дроти: <tspan font-weight="bold" fill="#c0392b">червоний</tspan> + <tspan font-weight="bold" fill="#1a1a1a">білий</tspan> | Опір R_холод при 25 °C = <tspan font-weight="bold" fill="#1a1a1a">70...75 Ω</tspan></text>

  <!-- КАРТКА 2: Турбіна нагнітача -->
  <rect x="492" y="166" width="430" height="72" rx="6" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="504" y="174" width="60" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="534" y="188" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Pin 3 · 4</text>
  <text x="574" y="188" font-size="13" font-weight="bold" fill="#2457d6">БЕЗКОЛЕКТОРНА ТУРБІНА (НАГНІТАЧ)</text>
  <text x="504" y="210" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">Pin 3 (Fan +):</tspan> живлення 0–24 В = (PWM 20–25 кГц, <tspan font-weight="bold">жовтий</tspan> дріт)</text>
  <text x="504" y="228" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">Pin 4 (Fan - / GND):</tspan> спільна земля вентилятора й геркона (<tspan font-weight="bold">чорний</tspan>)</text>

  <!-- КАРТКА 3: Термопара K-типу -->
  <rect x="492" y="248" width="430" height="72" rx="6" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="504" y="256" width="60" height="20" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="534" y="270" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Pin 5 · 6</text>
  <text x="574" y="270" font-size="13" font-weight="bold" fill="#27ae60">ТЕРМОПАРА K-ТИПУ (ТЕРМОДАТЧИК)</text>
  <text x="504" y="292" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">Pin 5 (TC+):</tspan> хромель (<tspan font-weight="bold" fill="#27ae60">зелений</tspan>) | <tspan font-weight="bold">Pin 6 (TC-):</tspan> алюмель (<tspan font-weight="bold" fill="#c0392b">синій</tspan>)</text>
  <text x="504" y="310" font-size="12" fill="#6b7280">Опір R = <tspan font-weight="bold" fill="#1a1a1a">1.2...3.0 Ω</tspan> | Термо-ЕРС: 0...18.7 мВ (~41 µV/°C)</text>

  <!-- КАРТКА 4: Геркон та ESD-заземлення -->
  <rect x="492" y="330" width="430" height="72" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="504" y="338" width="60" height="20" rx="3" fill="#f4f6f8" stroke="#6b7280" stroke-width="1"/>
  <text x="534" y="352" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Pin 7 · 8</text>
  <text x="574" y="352" font-size="13" font-weight="bold" fill="#1a1a1a">ГЕРКОН ТА АНТИСТАТИЧНИЙ ЗАХИСТ ESD</text>
  <text x="504" y="374" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">Pin 7 (Reed Switch):</tspan> сигнал підставки 5 В, замикає на Pin 4 (<tspan font-weight="bold">коричневий</tspan>)</text>
  <text x="504" y="392" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">Pin 8 (PE Ground):</tspan> заземлення сопла (<tspan font-weight="bold" fill="#16a34a">жовто-зелений</tspan>, R &lt; 1.0 Ω)</text>

  <!-- ПОПЕРЕДЖЕННЯ ПРО БЕЗПЕКУ -->
  <rect x="492" y="412" width="430" height="78" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="504" y="432" font-size="12" font-weight="bold" fill="#c0392b">КРИТИЧНА ВИМОГА ТЕХНІКИ БЕЗПЕКИ ПРИ МОНТАЖІ:</text>
  <text x="504" y="452" font-size="12" fill="#1a1a1a">Помилкове подання силової напруги 220 В на сигнальні піни термопари</text>
  <text x="504" y="470" font-size="12" fill="#1a1a1a">(Pin 5–6) або лінію PWM турбіни спричиняє миттєве вигорання ADC станції!</text>
</svg>
