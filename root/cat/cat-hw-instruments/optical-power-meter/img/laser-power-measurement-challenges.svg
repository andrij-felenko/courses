<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Діаграма застосування сенсорів оптичної потужності лазерів</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Спектральний діапазон, межі потужності та режими випромінювання для 3 типів сенсорів</text>

  <!-- Сітка графіка -->
  <line x1="100" y1="105" x2="860" y2="105" stroke="#e5e7eb" stroke-dasharray="4 4"/>
  <line x1="100" y1="160" x2="860" y2="160" stroke="#e5e7eb" stroke-dasharray="4 4"/>
  <line x1="100" y1="215" x2="860" y2="215" stroke="#e5e7eb" stroke-dasharray="4 4"/>
  <line x1="100" y1="270" x2="860" y2="270" stroke="#e5e7eb" stroke-dasharray="4 4"/>
  <line x1="100" y1="325" x2="860" y2="325" stroke="#e5e7eb" stroke-dasharray="4 4"/>

  <!-- Подобсітка за довжиною хвилі -->
  <line x1="130" y1="95" x2="130" y2="335" stroke="#f3f4f6" stroke-dasharray="2 2"/>
  <line x1="240" y1="95" x2="240" y2="335" stroke="#f3f4f6" stroke-dasharray="2 2"/>
  <line x1="370" y1="95" x2="370" y2="335" stroke="#f3f4f6" stroke-dasharray="2 2"/>
  <line x1="550" y1="95" x2="550" y2="335" stroke="#f3f4f6" stroke-dasharray="2 2"/>
  <line x1="830" y1="95" x2="830" y2="335" stroke="#f3f4f6" stroke-dasharray="2 2"/>

  <!-- Оси координат -->
  <line x1="100" y1="335" x2="100" y2="85" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="100" y1="335" x2="870" y2="335" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Назви осей -->
  <text x="95" y="78" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Потужність P</text>
  <text x="860" y="330" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Довжина хвилі λ</text>

  <!-- Підписи осі Y -->
  <text x="92" y="109" font-size="12" fill="#6b7280" text-anchor="end">10 кВт</text>
  <text x="92" y="164" font-size="12" fill="#6b7280" text-anchor="end">1 Вт</text>
  <text x="92" y="219" font-size="12" fill="#6b7280" text-anchor="end">1 мВт</text>
  <text x="92" y="274" font-size="12" fill="#6b7280" text-anchor="end">1 мкВт</text>
  <text x="92" y="329" font-size="12" fill="#6b7280" text-anchor="end">1 пВт</text>

  <!-- Підписи осі X -->
  <text x="130" y="352" font-size="12" fill="#6b7280" text-anchor="middle">200 нм</text>
  <text x="240" y="352" font-size="12" fill="#6b7280" text-anchor="middle">400 нм</text>
  <text x="370" y="352" font-size="12" fill="#6b7280" text-anchor="middle">700 нм</text>
  <text x="550" y="352" font-size="12" fill="#6b7280" text-anchor="middle">1.8 мкм</text>
  <text x="830" y="352" font-size="12" fill="#6b7280" text-anchor="middle">20 мкм</text>

  <!-- Спектральні діапазони (смуга під віссю X) -->
  <rect x="130" y="365" width="110" height="12" fill="#e0e7ff" rx="2"/>
  <rect x="240" y="365" width="130" height="12" fill="#dcfce7" rx="2"/>
  <rect x="370" y="365" width="180" height="12" fill="#fef3c7" rx="2"/>
  <rect x="550" y="365" width="280" height="12" fill="#fee2e2" rx="2"/>

  <text x="185" y="392" font-size="12" fill="#6b7280" text-anchor="middle">УФ (UV)</text>
  <text x="305" y="392" font-size="12" fill="#6b7280" text-anchor="middle">Видиме (VIS)</text>
  <text x="460" y="392" font-size="12" fill="#6b7280" text-anchor="middle">Ближнє ІЧ (NIR)</text>
  <text x="690" y="392" font-size="12" fill="#6b7280" text-anchor="middle">Середнє / Далеке ІЧ</text>

  <!-- Область 1: Термоелектричні сенсори (Thermopile) -->
  <rect x="130" y="100" width="700" height="55" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="6"/>
  <text x="480" y="122" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Термоелектричні сенсори (Thermopile)</text>
  <text x="480" y="142" font-size="12" fill="#1a1a1a" text-anchor="middle">• 190 нм – 20 мкм | 100 мкВт – 10 кВт (CW / середня потужність)</text>

  <!-- Область 2: Фотодіодні сенсори (Si, Ge, InGaAs) -->
  <rect x="130" y="165" width="410" height="155" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="6"/>
  <text x="335" y="190" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Фотодіодні сенсори (Si, Ge, InGaAs)</text>
  <text x="335" y="215" font-size="12" fill="#1a1a1a" text-anchor="middle">• 200 нм – 1800 нм | 1 пВт – 1 Вт</text>
  <text x="335" y="240" font-size="12" fill="#1a1a1a" text-anchor="middle">• Неперервний (CW) та висока швидкість (нс)</text>
  <text x="335" y="265" font-size="12" fill="#1a1a1a" text-anchor="middle">• Висока чутливість, лінійний вихід</text>
  <text x="335" y="290" font-size="12" fill="#6b7280" text-anchor="middle">• Чутливі до спектра (калібрування λ)</text>

  <!-- Область 3: Піроелектричні сенсори -->
  <rect x="555" y="165" width="275" height="155" fill="#fdecea" stroke="#c0392b" stroke-width="2" rx="6"/>
  <text x="692" y="190" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Піроелектричні сенсори</text>
  <text x="692" y="215" font-size="12" fill="#1a1a1a" text-anchor="middle">• 190 нм – 20 мкм</text>
  <text x="692" y="240" font-size="12" fill="#1a1a1a" text-anchor="middle">• Енергія: 1 мкДж – 10 Дж</text>
  <text x="692" y="265" font-size="12" fill="#1a1a1a" text-anchor="middle">• Імпульсне випромінювання</text>
  <text x="692" y="290" font-size="12" fill="#6b7280" text-anchor="middle">• Вимірювання dT/dt</text>

  <!-- Нижні порівняльні картки характеристик -->
  <!-- Картка 1: Фотодіоди -->
  <rect x="30" y="412" width="290" height="130" fill="#f4f6f8" stroke="#d0d7de" rx="6"/>
  <text x="45" y="432" font-size="13" font-weight="bold" fill="#2457d6">1. Фотодіоди (Si / InGaAs)</text>
  <text x="45" y="454" font-size="12" fill="#1a1a1a">Застосування: малі потужності,</text>
  <text x="45" y="474" font-size="12" fill="#1a1a1a">швидкі сигнали, волоконні лінії.</text>
  <text x="45" y="496" font-size="12" fill="#6b7280">Особливість: потребує компенсації</text>
  <text x="45" y="516" font-size="12" fill="#6b7280">темнового струму та калібрування.</text>

  <!-- Картка 2: Термостовпчики -->
  <rect x="335" y="412" width="290" height="130" fill="#f4f6f8" stroke="#d0d7de" rx="6"/>
  <text x="350" y="432" font-size="13" font-weight="bold" fill="#27ae60">2. Термостовпчики (Thermopile)</text>
  <text x="350" y="454" font-size="12" fill="#1a1a1a">Застосування: високі потужності,</text>
  <text x="350" y="474" font-size="12" fill="#1a1a1a">CO₂ лазери, промислова обробка.</text>
  <text x="350" y="496" font-size="12" fill="#6b7280">Особливість: плоска спектральна</text>
  <text x="350" y="516" font-size="12" fill="#6b7280">характеристика, відгук ~1 сек.</text>

  <!-- Картка 3: Піроелектрики -->
  <rect x="640" y="412" width="290" height="130" fill="#f4f6f8" stroke="#d0d7de" rx="6"/>
  <text x="655" y="432" font-size="13" font-weight="bold" fill="#c0392b">3. Піроелектрики (Pyroelectric)</text>
  <text x="655" y="454" font-size="12" fill="#1a1a1a">Застосування: вимірювання енергії</text>
  <text x="655" y="474" font-size="12" fill="#1a1a1a">поодиноких та частотних імпульсів.</text>
  <text x="655" y="496" font-size="12" fill="#6b7280">Особливість: реагують на зміни</text>
  <text x="655" y="516" font-size="12" fill="#6b7280">температури (dT/dt), не для CW.</text>
</svg>
