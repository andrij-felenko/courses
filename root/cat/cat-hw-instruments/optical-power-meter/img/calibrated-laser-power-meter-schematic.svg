<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принципова схема прецизійного трансімпедансного підсилювача (TIA)</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Фотогальванічний режим діода запобігає темновим струмам витоку; Cf компенсує вхідну ємність</text>

  <!-- LEFT PANEL: Photodiode Sensor -->
  <rect x="30" y="75" width="260" height="300" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="160" y="98" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Оптичний сенсор VD1</text>

  <!-- Photodiode Symbol VD1 -->
  <polygon points="145,235 175,235 160,205" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <line x1="145" y1="205" x2="175" y2="205" stroke="#2457d6" stroke-width="2"/>
  <line x1="160" y1="235" x2="160" y2="275" stroke="#2457d6" stroke-width="2"/>
  <line x1="160" y1="205" x2="160" y2="160" stroke="#2457d6" stroke-width="2"/>

  <!-- GND at Photodiode Anode -->
  <line x1="148" y1="275" x2="172" y2="275" stroke="#2457d6" stroke-width="2"/>
  <line x1="153" y1="280" x2="167" y2="280" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="158" y1="285" x2="162" y2="285" stroke="#2457d6" stroke-width="1"/>

  <!-- Laser Photons Beam -->
  <line x1="70" y1="190" x2="132" y2="215" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="70" y1="210" x2="132" y2="235" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="75" y="175" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">Лазер P (Вт)</text>

  <!-- Sensor Labels -->
  <text x="160" y="306" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Фотодіод Si / InGaAs</text>
  <text x="160" y="322" font-size="12" fill="#6b7280" text-anchor="middle">Фотогальванічний режим (U=0 В)</text>
  <text x="160" y="338" font-size="12" fill="#1a1a1a" text-anchor="middle">Iph = Rλ × P</text>

  <!-- Photocurrent Connection Line to TIA -->
  <line x1="160" y1="160" x2="305" y2="160" stroke="#2457d6" stroke-width="2"/>
  <line x1="210" y1="160" x2="245" y2="160" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="227" y="148" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Iph</text>

  <!-- CENTER PANEL: Transimpedance Amplifier -->
  <rect x="305" y="75" width="370" height="300" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="320" y="98" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="start">2. Підсилювач TIA (DA1)</text>

  <!-- Wire into Op-Amp (-) -->
  <line x1="305" y1="160" x2="420" y2="160" stroke="#2457d6" stroke-width="2"/>
  <circle cx="360" cy="160" r="3" fill="#2457d6"/>

  <!-- Op-Amp DA1 Triangle -->
  <polygon points="420,130 420,250 520,190" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="412" y="156" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">-</text>
  <text x="412" y="216" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">+</text>
  <text x="468" y="194" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">DA1 (OPA380)</text>

  <!-- Non-inverting input (+) to GND -->
  <line x1="420" y1="220" x2="420" y2="275" stroke="#2457d6" stroke-width="2"/>
  <line x1="408" y1="275" x2="432" y2="275" stroke="#2457d6" stroke-width="2"/>
  <line x1="413" y1="280" x2="427" y2="280" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="418" y1="285" x2="422" y2="285" stroke="#2457d6" stroke-width="1"/>

  <!-- Op-Amp Output Wire -->
  <line x1="520" y1="190" x2="560" y2="190" stroke="#2457d6" stroke-width="2"/>
  <circle cx="560" cy="190" r="3" fill="#2457d6"/>

  <!-- Feedback Wires (Cf and Rf) -->
  <line x1="360" y1="160" x2="360" y2="115" stroke="#2457d6" stroke-width="2"/>
  <line x1="360" y1="115" x2="560" y2="115" stroke="#2457d6" stroke-width="2"/>
  <line x1="560" y1="115" x2="560" y2="190" stroke="#2457d6" stroke-width="2"/>

  <!-- Feedback Capacitor Cf (Upper Branch) -->
  <line x1="500" y1="100" x2="525" y2="100" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="535" y1="100" x2="560" y2="100" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="525" y1="92" x2="525" y2="108" stroke="#2457d6" stroke-width="2"/>
  <line x1="535" y1="92" x2="535" y2="108" stroke="#2457d6" stroke-width="2"/>
  <text x="530" y="86" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Cf (2.2 pF)</text>

  <!-- Feedback Resistor Rf (Lower Branch) -->
  <line x1="360" y1="115" x2="360" y2="135" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="560" y1="115" x2="560" y2="135" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="430" y="128" width="60" height="14" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="460" y="123" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Rf (100 kΩ)</text>

  <!-- TIA Formula & Notes Box -->
  <rect x="325" y="325" width="330" height="36" fill="#ffffff" stroke="#d0d7de" rx="4"/>
  <text x="490" y="341" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Uout = - Iph × Rf</text>
  <text x="490" y="355" font-size="12" fill="#6b7280" text-anchor="middle">Cf стабілізує фазу та пригнічує шум TIA</text>

  <!-- RIGHT PANEL: RC Filter and ADC -->
  <rect x="690" y="75" width="240" height="300" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="810" y="98" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">3. Фільтр та АЦП</text>

  <!-- Wire from Op-Amp Output to Filter & ADC -->
  <line x1="560" y1="190" x2="720" y2="190" stroke="#2457d6" stroke-width="2"/>

  <!-- Series Resistor R_flt -->
  <rect x="720" y="183" width="40" height="14" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="740" y="174" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">R_flt (1 kΩ)</text>
  <line x1="760" y1="190" x2="825" y2="190" stroke="#27ae60" stroke-width="2"/>
  <circle cx="790" cy="190" r="3" fill="#27ae60"/>

  <!-- Shunt Capacitor C_flt to GND -->
  <line x1="790" y1="190" x2="790" y2="220" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="782" y1="220" x2="798" y2="220" stroke="#27ae60" stroke-width="2"/>
  <line x1="782" y1="226" x2="798" y2="226" stroke="#27ae60" stroke-width="2"/>
  <line x1="790" y1="226" x2="790" y2="255" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="782" y1="255" x2="798" y2="255" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="786" y1="259" x2="794" y2="259" stroke="#27ae60" stroke-width="1"/>
  <text x="778" y="240" font-size="12" fill="#27ae60" text-anchor="end">C_flt (10 nF)</text>

  <!-- Microcontroller ADC Block -->
  <rect x="825" y="155" width="90" height="90" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="4"/>
  <text x="870" y="185" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">ADC_IN</text>
  <text x="870" y="205" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">АЦП 16-біт</text>
  <text x="870" y="225" font-size="12" fill="#1a1a1a" text-anchor="middle">MCU / DSP</text>

  <!-- Right Panel Bottom Note -->
  <rect x="705" y="325" width="210" height="36" fill="#ffffff" stroke="#d0d7de" rx="4"/>
  <text x="810" y="341" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Фільтрація вибірок</text>
  <text x="810" y="355" font-size="12" fill="#6b7280" text-anchor="middle">Оцифрування &amp; DSP</text>

  <!-- BOTTOM SUMMARY PANEL -->
  <rect x="30" y="388" width="900" height="58" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="480" y="410" font-size="12" fill="#1a1a1a" text-anchor="middle">Ланцюжок перетворення: Лазерне світло P → Фотострум Iph = Rλ × P → Напруга Uout = - Iph × Rf → АЦП → Цифрова потужність (Вт/dBm).</text>
  <text x="480" y="430" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Нульовий зсув U=0 В унеможливлює темновий струм, забезпечуючи високу точність у мікроватному діапазоні.</text>
</svg>
