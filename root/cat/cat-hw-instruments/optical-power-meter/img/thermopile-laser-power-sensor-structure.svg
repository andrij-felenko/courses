<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Маркери стрілок та градієнти -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-orange" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d35400"/>
    </marker>

    <!-- Градієнт лазерного пучка -->
    <linearGradient id="laserGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e74c3c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#c0392b" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Градієнт температурного поля -->
    <linearGradient id="tempGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2980b9"/>
      <stop offset="50%" stop-color="#e74c3c"/>
      <stop offset="100%" stop-color="#2980b9"/>
    </linearGradient>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Конструкція та принцип дії термоелектричного сенсора лазерної потужності</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Об'ємне поглинання випромінювання P_in та формування термоЕРС V_out на термобатареї</text>

  <!-- ЛІВА ПАНЕЛЬ: Конструктивна схема сенсора -->
  <rect x="40" y="70" width="580" height="410" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="55" y="93" font-size="14" font-weight="bold" fill="#1a1a1a">Схема радіального термоелектричного датчика (Thermopile)</text>

  <!-- 1. Лазерний пучок -->
  <path d="M240,105 L280,105 L272,185 L248,185 Z" fill="url(#laserGrad)" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 2"/>
  <line x1="250" y1="105" x2="252" y2="185" stroke="#ffffff" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="260" y1="105" x2="260" y2="185" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="270" y1="105" x2="268" y2="185" stroke="#ffffff" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Підпис лазерного пучка -->
  <text x="335" y="130" font-size="12" font-weight="bold" fill="#c0392b">Лазерне випромінювання</text>
  <text x="335" y="148" font-size="12" font-weight="bold" fill="#c0392b">Потужність P_in (Вт)</text>
  <line x1="330" y1="136" x2="275" y2="136" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- 2. Об'ємний поглинач -->
  <rect x="195" y="195" width="130" height="60" rx="4" fill="#34495e" stroke="#1a252f" stroke-width="2"/>
  <rect x="200" y="200" width="120" height="50" rx="3" fill="#2c3e50" stroke="#7f8c8d" stroke-dasharray="2 2"/>
  <text x="260" y="222" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Об'ємний поглинач</text>
  <text x="260" y="240" font-size="12" fill="#bdc3c7" text-anchor="middle">(Volumetric Absorber)</text>

  <!-- 3. Термобатарея (Thermopile Ring) -->
  <!-- Лівий блок термопар -->
  <rect x="130" y="195" width="65" height="60" fill="#ecf0f1" stroke="#bdc3c7"/>
  <line x1="140" y1="195" x2="140" y2="255" stroke="#e74c3c" stroke-width="3"/>
  <line x1="152" y1="195" x2="152" y2="255" stroke="#2980b9" stroke-width="3"/>
  <line x1="164" y1="195" x2="164" y2="255" stroke="#e74c3c" stroke-width="3"/>
  <line x1="176" y1="195" x2="176" y2="255" stroke="#2980b9" stroke-width="3"/>
  <line x1="188" y1="195" x2="188" y2="255" stroke="#e74c3c" stroke-width="3"/>

  <!-- Правий блок термопар -->
  <rect x="325" y="195" width="65" height="60" fill="#ecf0f1" stroke="#bdc3c7"/>
  <line x1="332" y1="195" x2="332" y2="255" stroke="#e74c3c" stroke-width="3"/>
  <line x1="344" y1="195" x2="344" y2="255" stroke="#2980b9" stroke-width="3"/>
  <line x1="356" y1="195" x2="356" y2="255" stroke="#e74c3c" stroke-width="3"/>
  <line x1="368" y1="195" x2="368" y2="255" stroke="#2980b9" stroke-width="3"/>
  <line x1="380" y1="195" x2="380" y2="255" stroke="#e74c3c" stroke-width="3"/>

  <!-- Зігзагоподібні перемички -->
  <path d="M140,195 L152,195 M152,255 L164,255 M164,195 L176,195 M176,255 L188,255" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
  <path d="M332,195 L344,195 M344,255 L356,255 M356,195 L368,195 M368,255 L380,255" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>

  <!-- 4. Спаї термопар -->
  <!-- Гарячі спаї -->
  <circle cx="195" cy="205" r="4" fill="#e74c3c"/>
  <circle cx="195" cy="225" r="4" fill="#e74c3c"/>
  <circle cx="195" cy="245" r="4" fill="#e74c3c"/>
  <circle cx="325" cy="205" r="4" fill="#e74c3c"/>
  <circle cx="325" cy="225" r="4" fill="#e74c3c"/>
  <circle cx="325" cy="245" r="4" fill="#e74c3c"/>

  <!-- Холодні спаї -->
  <circle cx="130" cy="205" r="4" fill="#2980b9"/>
  <circle cx="130" cy="225" r="4" fill="#2980b9"/>
  <circle cx="130" cy="245" r="4" fill="#2980b9"/>
  <circle cx="390" cy="205" r="4" fill="#2980b9"/>
  <circle cx="390" cy="225" r="4" fill="#2980b9"/>
  <circle cx="390" cy="245" r="4" fill="#2980b9"/>

  <!-- Підпис Холодні спаї у виділеному бейджі -->
  <rect x="75" y="145" width="110" height="24" rx="4" fill="#ffffff" stroke="#2980b9" stroke-width="1"/>
  <text x="130" y="161" font-size="12" font-weight="bold" fill="#2980b9" text-anchor="middle">Холодні спаї T_c</text>
  <line x1="130" y1="169" x2="130" y2="195" stroke="#2980b9" stroke-width="1" marker-end="url(#arr-blue)"/>

  <!-- 5. Тепловий потік (Q) -->
  <line x1="190" y1="225" x2="135" y2="225" stroke="#d35400" stroke-width="3" marker-end="url(#arr-orange)"/>
  <line x1="330" y1="225" x2="385" y2="225" stroke="#d35400" stroke-width="3" marker-end="url(#arr-orange)"/>

  <rect x="200" y="270" width="120" height="22" rx="4" fill="#ffffff" stroke="#d35400" stroke-width="1"/>
  <text x="260" y="285" font-size="12" font-weight="bold" fill="#d35400" text-anchor="middle">Тепловий потік Q</text>

  <!-- Підпис Гарячі спаї -->
  <rect x="200" y="300" width="120" height="22" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="260" y="315" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Гарячі спаї T_h</text>
  <line x1="200" y1="311" x2="197" y2="246" stroke="#c0392b" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="320" y1="311" x2="323" y2="246" stroke="#c0392b" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- 6. Масивний радіатор (Тепловідвід) -->
  <!-- Лівий корпус радіатора (повністю всередині панелі x=40) -->
  <rect x="75" y="185" width="45" height="145" rx="4" fill="#7f8c8d" stroke="#2c3e50" stroke-width="1.5"/>
  <!-- Ліві ребра охолодження (x=58..74, просвіт до лівого краю панелі x=40 становить 18px) -->
  <rect x="58" y="195" width="16" height="12" fill="#95a5a6" stroke="#2c3e50"/>
  <rect x="58" y="220" width="16" height="12" fill="#95a5a6" stroke="#2c3e50"/>
  <rect x="58" y="245" width="16" height="12" fill="#95a5a6" stroke="#2c3e50"/>
  <rect x="58" y="270" width="16" height="12" fill="#95a5a6" stroke="#2c3e50"/>
  <rect x="58" y="295" width="16" height="12" fill="#95a5a6" stroke="#2c3e50"/>

  <!-- Правий корпус радіатора -->
  <rect x="400" y="185" width="45" height="145" rx="4" fill="#7f8c8d" stroke="#2c3e50" stroke-width="1.5"/>
  <!-- Праві ребра охолодження -->
  <rect x="446" y="195" width="16" height="12" fill="#95a5a6" stroke="#2c3e50"/>
  <rect x="446" y="220" width="16" height="12" fill="#95a5a6" stroke="#2c3e50"/>
  <rect x="446" y="245" width="16" height="12" fill="#95a5a6" stroke="#2c3e50"/>
  <rect x="446" y="270" width="16" height="12" fill="#95a5a6" stroke="#2c3e50"/>
  <rect x="446" y="295" width="16" height="12" fill="#95a5a6" stroke="#2c3e50"/>

  <!-- Нижня плита радіатора -->
  <rect x="75" y="330" width="370" height="20" fill="#7f8c8d" stroke="#2c3e50" stroke-width="1.5"/>

  <!-- Підписи радіатора -->
  <text x="110" y="372" font-size="12" font-weight="bold" fill="#2c3e50" text-anchor="middle">Масивний радіатор</text>
  <text x="110" y="390" font-size="12" fill="#6b7280" text-anchor="middle">(Тепловідвід T_amb)</text>

  <!-- 7. Вихідний сигнал V_out -->
  <path d="M390,210 L485,210" stroke="#f39c12" stroke-width="2" fill="none"/>
  <path d="M390,240 L485,240" stroke="#2c3e50" stroke-width="2" fill="none"/>

  <rect x="485" y="185" width="120" height="95" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="545" y="208" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вихідна ЕРС</text>
  <text x="545" y="228" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">V_out = S_s · P_in</text>
  <text x="545" y="248" font-size="12" fill="#6b7280" text-anchor="middle">V_out = N·S·ΔT</text>
  <text x="545" y="268" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">(мілівольти мВ)</text>

  <!-- 8. Шкала температурного градієнта ΔT -->
  <rect x="130" y="420" width="260" height="14" rx="4" fill="url(#tempGrad)" stroke="#d0d7de"/>
  <text x="260" y="455" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Температурний градієнт ΔT = T_h - T_c</text>
  <text x="115" y="432" font-size="12" font-weight="bold" fill="#2980b9">T_c</text>
  <text x="260" y="413" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">T_h</text>
  <text x="400" y="432" font-size="12" font-weight="bold" fill="#2980b9">T_c</text>

  <!-- ПРАВА ПАНЕЛЬ: Характеристики та принципи -->
  <rect x="640" y="70" width="295" height="410" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="787" y="93" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Характеристики та принципи</text>

  <!-- Блок 1: Об'ємний поглинач -->
  <rect x="655" y="108" width="265" height="112" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="667" y="128" font-size="12" font-weight="bold" fill="#1a1a1a">Об'ємний поглинач (Volumetric):</text>
  <text x="667" y="148" font-size="12" fill="#1a1a1a">• Поглинання у об'ємі матеріалу</text>
  <text x="667" y="166" font-size="12" fill="#1a1a1a">• Захист від поверхневого пробою</text>
  <text x="667" y="184" font-size="12" font-weight="bold" fill="#c0392b">• Поріг стійкості: до 10 кВт/см²</text>
  <text x="667" y="202" font-size="12" fill="#6b7280">• Спектр: від УФ до далекого ІК</text>

  <!-- Блок 2: Термоелектрична батарея -->
  <rect x="655" y="230" width="265" height="112" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="667" y="250" font-size="12" font-weight="bold" fill="#1a1a1a">Термоелектрична батарея:</text>
  <text x="667" y="270" font-size="12" fill="#1a1a1a">• Послідовне з'єднання термопар</text>
  <text x="667" y="288" font-size="12" font-weight="bold" fill="#2457d6">• Ефект Зеєбека: V = N·S·(T_h - T_c)</text>
  <text x="667" y="306" font-size="12" fill="#1a1a1a">• Пряма пропорційність: V_out ∝ P_in</text>
  <text x="667" y="324" font-size="12" fill="#6b7280">• Чутливість S_s: 0.1...10 мВ/Вт</text>

  <!-- Блок 3: Область застосування -->
  <rect x="655" y="352" width="265" height="112" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="667" y="372" font-size="12" font-weight="bold" fill="#27ae60">Область застосування:</text>
  <text x="667" y="392" font-size="12" fill="#1a1a1a">• Вимірювання CW та імпульсних лазерів</text>
  <text x="667" y="410" font-size="12" fill="#1a1a1a">• Діапазон потужностей: 10 мВт – 10 кВт</text>
  <text x="667" y="428" font-size="12" fill="#1a1a1a">• Незалежність від діаметра пучка</text>
  <text x="667" y="446" font-size="12" fill="#6b7280">• Час відгуку: τ ≈ 0.8...2.5 с</text>
</svg>
