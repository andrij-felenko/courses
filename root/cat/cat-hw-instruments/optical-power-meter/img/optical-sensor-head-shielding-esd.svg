<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Двошарове екранування та розв'язка заземлень сенсорної головки</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Зовнішній екран відводить ESD у корпус, а внутрішній охоронний екран ізолює пікоамперний фотострум</text>

  <!-- PANEL 1: SENSOR HEAD (LEFT) -->
  <g id="panel-sensor-head">
    <rect x="24" y="74" width="226" height="426" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="137" y="96" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">СЕНСОРНИЙ МОДУЛЬ</text>

    <!-- Box 1: Photodiode & Guard Ring -->
    <rect x="36" y="112" width="202" height="154" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
    <text x="137" y="128" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Оптичний фотодіод</text>

    <!-- Photodiode Symbol -->
    <circle cx="110" cy="180" r="18" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
    <polygon points="102,172 102,188 118,180" fill="#2457d6"/>
    <line x1="118" y1="170" x2="118" y2="190" stroke="#2457d6" stroke-width="2"/>
    <!-- Light Input Arrows -->
    <line x1="72" y1="154" x2="88" y2="166" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <line x1="76" y1="144" x2="92" y2="156" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

    <!-- Guard Ring Trace -->
    <rect x="70" y="154" width="134" height="52" rx="4" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="4 2"/>
    <text x="137" y="242" font-size="11" fill="#27ae60" text-anchor="middle">Охоронне кільце (Guard)</text>

    <!-- Box 2: Digital EEPROM & Temp Sensor -->
    <rect x="36" y="278" width="202" height="140" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="137" y="294" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Калібрувальна EEPROM</text>
    <rect x="60" y="306" width="154" height="60" rx="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
    <text x="137" y="334" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">EEPROM / NTC</text>
    <text x="137" y="352" font-size="11" fill="#6b7280" text-anchor="middle">Пам'ять та термодатчик</text>
    <text x="137" y="398" font-size="11" fill="#6b7280" text-anchor="middle">DGND ізольована</text>

    <!-- Sensor Head Metal Case -->
    <rect x="36" y="440" width="202" height="46" rx="6" fill="#eaf0fd" stroke="#4b5563" stroke-width="1.5"/>
    <text x="137" y="458" font-size="11" font-weight="bold" fill="#4b5563" text-anchor="middle">Металевий корпус</text>
    <text x="137" y="474" font-size="11" fill="#4b5563" text-anchor="middle">CH_GND (Екранування)</text>
  </g>

  <!-- PANEL 2: CABLE TRACT (CENTER) -->
  <g id="panel-cable">
    <rect x="274" y="74" width="412" height="426" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="480" y="96" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ДВОШАРОВИЙ ЕКРАНОВАНИЙ КАБЕЛЬ</text>

    <!-- Outer Shield Boundary -->
    <rect x="286" y="112" width="388" height="374" rx="10" fill="#ffffff" stroke="#4b5563" stroke-width="2" stroke-dasharray="6 3"/>
    <text x="480" y="130" font-size="12" font-weight="bold" fill="#4b5563" text-anchor="middle">Зовнішній екран (CH_GND — захист від ESD/ЕМІ)</text>

    <!-- Inner Shield Boundary (Analog Guard) -->
    <rect x="298" y="144" width="364" height="124" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
    <text x="480" y="162" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Внутрішній екран (GUARD — фольга над I_ph)</text>

    <!-- Line 1: I_ph+ -->
    <text x="480" y="183" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">I_ph+ (Сигнальний фотострум pA)</text>
    <line x1="238" y1="188" x2="722" y2="188" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>

    <!-- Line 2: I_ph- / AGND -->
    <text x="480" y="213" font-size="11" fill="#2457d6" text-anchor="middle">I_ph- / AGND (Аналогова земля)</text>
    <line x1="238" y1="218" x2="722" y2="218" stroke="#2457d6" stroke-width="2"/>

    <!-- Line 3: GUARD -->
    <text x="480" y="243" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">GUARD (Еквіпотенціальний захист витоку)</text>
    <line x1="238" y1="248" x2="722" y2="248" stroke="#27ae60" stroke-width="2" stroke-dasharray="4 2"/>

    <!-- Digital Lines outside Inner Shield -->
    <!-- Line 4: SDA / SCL -->
    <text x="480" y="289" font-size="11" fill="#1a1a1a" text-anchor="middle">SDA / SCL (Цифрова шина EEPROM)</text>
    <line x1="238" y1="294" x2="722" y2="294" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

    <!-- Line 5: VCC -->
    <text x="480" y="323" font-size="11" fill="#c0392b" text-anchor="middle">VCC (+3.3V Живлення EEPROM)</text>
    <line x1="238" y1="328" x2="722" y2="328" stroke="#c0392b" stroke-width="1.5"/>

    <!-- Line 6: DGND -->
    <text x="480" y="357" font-size="11" fill="#6b7280" text-anchor="middle">DGND (Цифрова земля)</text>
    <line x1="238" y1="362" x2="722" y2="362" stroke="#6b7280" stroke-width="1.5"/>

    <!-- Line 7: CH_GND -->
    <text x="480" y="393" font-size="11" font-weight="bold" fill="#4b5563" text-anchor="middle">CH_GND (Металева оплітка / Корпус)</text>
    <line x1="238" y1="398" x2="722" y2="398" stroke="#4b5563" stroke-width="3"/>
  </g>

  <!-- PANEL 3: MAIN MEASUREMENT UNIT (RIGHT) -->
  <g id="panel-main-unit">
    <rect x="710" y="74" width="226" height="426" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="823" y="96" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">БАЗОВИЙ БЛОК ВАТМЕТРА</text>

    <!-- Box 1: TIA & Guard Driver -->
    <rect x="722" y="112" width="202" height="154" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
    <text x="823" y="128" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Підсилювач TIA &amp; Guard</text>

    <!-- Op-Amp TIA Graphic -->
    <polygon points="744,152 744,212 804,182" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
    <text x="752" y="166" font-size="13" font-weight="bold" fill="#2457d6">-</text>
    <text x="752" y="198" font-size="13" font-weight="bold" fill="#2457d6">+</text>
    <!-- Feedback Resistor -->
    <rect x="754" y="134" width="36" height="12" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
    <text x="772" y="144" font-size="10" text-anchor="middle" fill="#2457d6">R_f</text>

    <!-- Guard Driver Buffer -->
    <polygon points="830,206 830,246 870,226" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
    <text x="836" y="230" font-size="11" font-weight="bold" fill="#27ae60">A=1</text>
    <text x="823" y="252" font-size="11" fill="#27ae60" text-anchor="middle">Буфер охорони (Guard)</text>

    <!-- Box 2: MCU & TVS ESD Protection -->
    <rect x="722" y="278" width="202" height="140" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="823" y="294" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">MCU &amp; ESD Захист (TVS)</text>

    <!-- TVS Diode graphics -->
    <polygon points="814,330 814,350 830,340" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <line x1="830" y1="326" x2="830" y2="354" stroke="#c0392b" stroke-width="2"/>
    <text x="823" y="374" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">TVS діоди на CH_GND</text>
    <text x="823" y="398" font-size="11" fill="#6b7280" text-anchor="middle">Захист від статичної напруги</text>

    <!-- Box 3: Single-Point Star Ground -->
    <rect x="732" y="434" width="182" height="54" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
    <text x="823" y="452" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Одноточкова зірка земель</text>
    <text x="823" y="472" font-size="11" fill="#1a1a1a" text-anchor="middle">AGND + DGND + CH_GND</text>
  </g>
</svg>
