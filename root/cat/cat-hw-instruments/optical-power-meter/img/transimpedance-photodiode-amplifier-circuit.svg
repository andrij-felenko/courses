<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема трансімпедансного підсилювача з компенсацією темнового струму</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Прецизійна конверсія фотоструму I_ph у напругу з температурною стабілізацією</text>

  <!-- Загальна панель схеми -->
  <rect x="30" y="75" width="900" height="320" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="8"/>

  <!-- Лівий каскад: Основний TIA підсилювач -->
  <rect x="45" y="90" width="420" height="290" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="255" y="106" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Основний каскад TIA (ОП1)</text>

  <!-- Світловий потік P_in -->
  <text x="48" y="165" font-size="12" font-weight="bold" fill="#2457d6">Лазерний потік P_in</text>
  <line x1="48" y1="182" x2="110" y2="182" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="48" y1="192" x2="110" y2="192" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="48" y1="202" x2="110" y2="202" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Фотодіод VD1 -->
  <!-- Анод на GND, Катод до вузла 200В -->
  <line x1="125" y1="200" x2="125" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="115,220 135,220 125,235" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="115" y1="235" x2="135" y2="235" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="125" y1="235" x2="125" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Земля VD1 (GND) -->
  <line x1="115" y1="260" x2="135" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="119" y1="264" x2="131" y2="264" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="123" y1="268" x2="127" y2="268" stroke="#1a1a1a" stroke-width="1.5"/>

  <text x="140" y="248" font-size="12" font-weight="bold" fill="#1a1a1a">VD1 (Робочий FD)</text>

  <!-- Провід від VD1 до ОП1 (-) -->
  <line x1="125" y1="200" x2="250" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="125" cy="200" r="3" fill="#1a1a1a"/>
  <text x="160" y="190" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">I_in</text>

  <!-- Зворотний зв'язок R_f || C_f з відводом на x=200 -->
  <line x1="200" y1="200" x2="200" y2="145" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="3" fill="#1a1a1a"/>
  <line x1="200" y1="145" x2="350" y2="145" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="350" y1="145" x2="350" y2="215" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="350" cy="215" r="3" fill="#1a1a1a"/>

  <!-- Паралельні елементи R_f та C_f -->
  <!-- Конденсатор C_f (верхня гілка y=135) -->
  <line x1="230" y1="135" x2="260" y2="135" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="260" y1="127" x2="260" y2="143" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="268" y1="127" x2="268" y2="143" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="268" y1="135" x2="300" y2="135" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="264" y="124" font-size="12" fill="#6b7280" text-anchor="middle">C_f</text>

  <!-- Резистор R_f (нижня гілка y=160) -->
  <line x1="230" y1="160" x2="250" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="250" y="152" width="40" height="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="290" y1="160" x2="310" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="270" y="178" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">R_f</text>

  <!-- З'єднання паралельних гілок -->
  <line x1="200" y1="145" x2="230" y2="145" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="230" y1="135" x2="230" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="300" y1="135" x2="310" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Операційний підсилювач ОП1 -->
  <polygon points="250,175 250,255 320,215" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="258" y="199" font-size="14" font-weight="bold" fill="#1a1a1a">-</text>
  <text x="258" y="239" font-size="14" font-weight="bold" fill="#1a1a1a">+</text>
  <text x="280" y="220" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ОП1</text>

  <!-- Вихід ОП1 -->
  <line x1="320" y1="215" x2="430" y2="215" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="430" cy="215" r="4" fill="#2457d6"/>
  <text x="375" y="240" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">V_out = -I_ph × R_f</text>

  <!-- Неінвертуючий вхід ОП1 (+) підключений до лінії компенсації -->
  <line x1="220" y1="235" x2="250" y2="235" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="220" y1="235" x2="220" y2="345" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Правий каскад: Каскад компенсації темнового струму (ОП2) -->
  <rect x="495" y="90" width="420" height="290" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="705" y="106" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Каскад компенсації темнового струму (ОП2)</text>

  <!-- Затемнений фотодіод VD2 з екраном (розміщено на x=530..580) -->
  <rect x="530" y="175" width="50" height="95" fill="#f4f6f8" stroke="#6b7280" stroke-dasharray="3 3" rx="4"/>
  <text x="555" y="165" font-size="12" fill="#6b7280" text-anchor="middle">Затемнення</text>

  <!-- VD2 схематично -->
  <line x1="555" y1="190" x2="555" y2="210" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="545,210 565,210 555,225" fill="#6b7280" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="545" y1="225" x2="565" y2="225" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="555" y1="225" x2="555" y2="250" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- GND VD2 -->
  <line x1="545" y1="250" x2="565" y2="250" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="549" y1="254" x2="561" y2="254" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="553" y1="258" x2="557" y2="258" stroke="#1a1a1a" stroke-width="1.5"/>

  <text x="555" y="283" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">VD2 (Dark FD)</text>

  <!-- Провід від VD2 до ОП2 (-) з відводом зворотного зв'язку на x=610 -->
  <line x1="555" y1="190" x2="700" y2="190" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Текст I_dark(T) розміщено праворуч від відводу x=610 (x=630..689.4) -->
  <text x="630" y="182" font-size="12" font-weight="bold" fill="#c0392b">I_dark(T)</text>

  <!-- ОП2 зворотний зв'язок R_comp з відводом на x=610 -->
  <line x1="610" y1="190" x2="610" y2="150" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="610" cy="190" r="3" fill="#1a1a1a"/>
  <line x1="610" y1="150" x2="640" y2="150" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="640" y="142" width="40" height="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="660" y="136" font-size="12" fill="#1a1a1a" text-anchor="middle">R_comp</text>
  <line x1="680" y1="150" x2="785" y2="150" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="785" y1="150" x2="785" y2="215" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="785" cy="215" r="3" fill="#1a1a1a"/>

  <!-- Операційний підсилювач ОП2 -->
  <polygon points="700,175 700,255 770,215" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="708" y="199" font-size="14" font-weight="bold" fill="#1a1a1a">-</text>
  <text x="708" y="239" font-size="14" font-weight="bold" fill="#1a1a1a">+</text>
  <text x="730" y="220" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ОП2</text>

  <!-- GND для (+) ОП2 -->
  <line x1="680" y1="235" x2="700" y2="235" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="680" y1="235" x2="680" y2="250" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="672" y1="250" x2="688" y2="250" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="676" y1="254" x2="684" y2="254" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Вихід компенсації від ОП2 до ОП1 (+) -->
  <line x1="770" y1="215" x2="815" y2="215" stroke="#27ae60" stroke-width="2"/>
  <line x1="815" y1="215" x2="815" y2="345" stroke="#27ae60" stroke-width="2"/>
  <line x1="815" y1="345" x2="220" y2="345" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="510" y="340" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Компенсаційна напруга V_comp = I_dark(T) × R_comp</text>

  <!-- Нижні пояснювальні картки -->
  <!-- Картка 1: Принцип TIA -->
  <rect x="30" y="412" width="290" height="130" fill="#f4f6f8" stroke="#d0d7de" rx="6"/>
  <text x="45" y="432" font-size="13" font-weight="bold" fill="#2457d6">1. Перетворення I → V</text>
  <text x="45" y="454" font-size="12" fill="#1a1a1a">ОП1 утримує вхід на віртуальній</text>
  <text x="45" y="474" font-size="12" fill="#1a1a1a">землі (0 В). Весь фотострум I_ph</text>
  <text x="45" y="496" font-size="12" fill="#1a1a1a">тече через R_f, формуючи V_out.</text>
  <text x="45" y="516" font-size="12" fill="#6b7280">C_f запобігає самозбудженню.</text>

  <!-- Картка 2: Проблема темнового струму -->
  <rect x="335" y="412" width="290" height="130" fill="#f4f6f8" stroke="#d0d7de" rx="6"/>
  <text x="350" y="432" font-size="13" font-weight="bold" fill="#c0392b">2. Проблема I_dark(T)</text>
  <text x="350" y="454" font-size="12" fill="#1a1a1a">Темновий струм витікання I_dark</text>
  <text x="350" y="474" font-size="12" fill="#1a1a1a">експоненційно зростає з Т,</text>
  <text x="350" y="496" font-size="12" fill="#1a1a1a">створюючи температурне зміщення</text>
  <text x="350" y="516" font-size="12" fill="#6b7280">та похибку при малих потужностях.</text>

  <!-- Картка 3: Термокомпенсація -->
  <rect x="640" y="412" width="290" height="130" fill="#f4f6f8" stroke="#d0d7de" rx="6"/>
  <text x="655" y="432" font-size="13" font-weight="bold" fill="#27ae60">3. Термокомпенсація</text>
  <text x="655" y="454" font-size="12" fill="#1a1a1a">Затемнений фотодіод VD2 має</text>
  <text x="655" y="474" font-size="12" fill="#1a1a1a">ідентичний дрейф I_dark(T).</text>
  <text x="655" y="496" font-size="12" fill="#1a1a1a">ОП2 віднімає його, забезпечуючи</text>
  <text x="655" y="516" font-size="12" fill="#6b7280">нульовий зсув V_out при P_in = 0.</text>
</svg>
