<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Header -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема розводки контакторів роз'єму оптичної вимірювальної головки (DB-9 Pinout)</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Розподіл аналогових ліній фотоструму, цифрової шини калібрування EEPROM та двошарового екранування</text>

  <!-- Left Panel: DB-9 Connector Pinout Visual -->
  <rect x="40" y="75" width="250" height="435" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="165" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Роз'єм DB-9 (Sensor Head)</text>

  <!-- D-Sub Housing Outer -->
  <rect x="65" y="125" width="200" height="175" rx="12" fill="#e5e7eb" stroke="#9ca3af" stroke-width="2"/>
  <!-- D-Sub Housing Inner Shield -->
  <rect x="75" y="135" width="180" height="155" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Row 1 Pins: 1, 2, 3, 4, 5 -->
  <circle cx="95" cy="175" r="13" fill="#2457d6"/>
  <text x="95" y="179" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">1</text>

  <circle cx="130" cy="175" r="13" fill="#2457d6"/>
  <text x="130" y="179" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">2</text>

  <circle cx="165" cy="175" r="13" fill="#2457d6"/>
  <text x="165" y="179" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">3</text>

  <circle cx="200" cy="175" r="13" fill="#27ae60"/>
  <text x="200" y="179" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">4</text>

  <circle cx="235" cy="175" r="13" fill="#27ae60"/>
  <text x="235" y="179" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">5</text>

  <!-- Row 2 Pins: 6, 7, 8, 9 -->
  <circle cx="112.5" cy="235" r="13" fill="#27ae60"/>
  <text x="112.5" y="239" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">6</text>

  <circle cx="147.5" cy="235" r="13" fill="#27ae60"/>
  <text x="147.5" y="239" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">7</text>

  <circle cx="182.5" cy="235" r="13" fill="#6b7280"/>
  <text x="182.5" y="239" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">8</text>

  <circle cx="217.5" cy="235" r="13" fill="#c0392b"/>
  <text x="217.5" y="239" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">9</text>

  <!-- Pin Legend Box -->
  <rect x="52" y="315" width="226" height="180" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="165" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Опис контактів роз'єму</text>

  <circle cx="67" cy="358" r="7" fill="#2457d6"/>
  <text x="82" y="362" font-size="11" fill="#1a1a1a">1: PDC (Катод / I_PH струм)</text>

  <circle cx="67" cy="380" r="7" fill="#2457d6"/>
  <text x="82" y="384" font-size="11" fill="#1a1a1a">2: PDA (Анод / GND_A)</text>

  <circle cx="67" cy="402" r="7" fill="#2457d6"/>
  <text x="82" y="406" font-size="11" fill="#1a1a1a">3: GUARD (Охоронне кільце)</text>

  <circle cx="67" cy="424" r="7" fill="#27ae60"/>
  <text x="82" y="428" font-size="11" fill="#1a1a1a">4: SDA | 5: SCL (I2C шина)</text>

  <circle cx="67" cy="446" r="7" fill="#27ae60"/>
  <text x="82" y="450" font-size="11" fill="#1a1a1a">6: VCC_D (+3.3V) | 7: TEMP</text>

  <circle cx="67" cy="468" r="7" fill="#6b7280"/>
  <text x="82" y="472" font-size="11" fill="#1a1a1a">8: DGND (Цифрова земля)</text>

  <circle cx="67" cy="490" r="7" fill="#c0392b"/>
  <text x="82" y="494" font-size="11" fill="#1a1a1a">9: SHIELD (Екран корпусу)</text>

  <!-- Right Panel Box 1: Analog Section -->
  <rect x="305" y="75" width="615" height="135" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="320" y="98" font-size="14" font-weight="bold" fill="#2457d6">1. Аналоговий тракт (Малошумний струмовий канал)</text>
  <text x="320" y="123" font-size="12" fill="#1a1a1a">• Pin 1 (PDC): Сигнал фотоструму I_PH (діапазон pA...mA, екранований коаксіал)</text>
  <text x="320" y="145" font-size="12" fill="#1a1a1a">• Pin 2 (PDA): Аналогова земля GND_A (ізольована від цифрової землі приладу)</text>
  <text x="320" y="167" font-size="12" fill="#1a1a1a">• Pin 3 (GUARD): Потенціал Guard Ring для усунення витоків по поверхні друкованої плати</text>
  <text x="320" y="189" font-size="11" fill="#6b7280">Вимоги: Струм витоку ізоляції &lt; 0.1 pA, використання тефлонових (PTFE) ізоляторів.</text>

  <!-- Right Panel Box 2: Digital Section -->
  <rect x="305" y="225" width="615" height="135" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="320" y="248" font-size="14" font-weight="bold" fill="#27ae60">2. Цифровий тракт (Калібрування EEPROM &amp; Термометрія)</text>
  <text x="320" y="273" font-size="12" fill="#1a1a1a">• Pin 4 (SDA) &amp; Pin 5 (SCL): Інтерфейс I2C (підтяжка 4.7 kΩ до +3.3V у базовому блоці)</text>
  <text x="320" y="295" font-size="12" fill="#1a1a1a">• Pin 6 (VCC_D) &amp; Pin 8 (DGND): Цифрове живлення +3.3В для мікросхеми EEPROM 24C08</text>
  <text x="320" y="317" font-size="12" fill="#1a1a1a">• Pin 7 (TEMP_OUT): Сигнал терморезистора NTC 10 kΩ для термокомпенсації чутливості</text>
  <text x="320" y="339" font-size="11" fill="#6b7280">Вимоги: Збереження коефіцієнтів чутливості Rλ у розрізі довжин хвиль та температур.</text>

  <!-- Right Panel Box 3: Shielding & Protection Section -->
  <rect x="305" y="375" width="615" height="135" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="320" y="398" font-size="14" font-weight="bold" fill="#c0392b">3. Екранування та захист від електростатичного розряду (ESD)</text>
  <text x="320" y="423" font-size="12" fill="#1a1a1a">• Pin 9 (SHIELD_OUTER): Зовнішній екран кабелю (Chassis Ground)</text>
  <text x="320" y="445" font-size="12" fill="#1a1a1a">• Внутрішнє екранування: Окремий фольгований екран аналогової пари PDC/PDA</text>
  <text x="320" y="467" font-size="12" fill="#1a1a1a">• Захист ESD: TVS-діоди малого витоку (&lt; 1 pA) на вході TIA для захисту від статики</text>
  <text x="320" y="489" font-size="11" fill="#6b7280">Вимоги: Двошарове екранування запобігає електромагнітним наводкам та завадам.</text>
</svg>
