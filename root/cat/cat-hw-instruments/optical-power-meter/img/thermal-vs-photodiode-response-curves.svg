<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Порівняння характеристик термостовпчика та кремнієвого фотодіода</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Плоска спектральна чутливість з повільним відгуком проти високої швидкодії з бандгапом</text>

  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- ЛІВА ПАНЕЛЬ: СПЕКТРАЛЬНА ЧУТЛИВІСТЬ S(λ) -->
  <g id="panel-left">
    <rect x="30" y="75" width="435" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="42" y="87" width="411" height="30" rx="4" fill="#eaf0fd"/>
    <text x="247.5" y="107" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">а) Спектральна чутливість S(λ)</text>

    <!-- Сітка графіка -->
    <line x1="85" y1="300" x2="435" y2="300" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="85" y1="250" x2="435" y2="250" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="85" y1="200" x2="435" y2="200" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="85" y1="150" x2="435" y2="150" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Осі координат -->
    <line x1="85" y1="350" x2="85" y2="135" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
    <line x1="85" y1="350" x2="445" y2="350" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

    <!-- Підписи осей -->
    <text x="45" y="125" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">S(λ), відн. од.</text>
    <text x="255" y="395" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Довжина хвилі λ, нм</text>

    <!-- Мітки Y -->
    <text x="75" y="354" font-size="12" fill="#6b7280" text-anchor="end">0.0</text>
    <text x="75" y="254" font-size="12" fill="#6b7280" text-anchor="end">0.5</text>
    <text x="75" y="154" font-size="12" fill="#6b7280" text-anchor="end">1.0</text>

    <!-- Мітки X -->
    <text x="85" y="370" font-size="12" fill="#6b7280" text-anchor="middle">200</text>
    <text x="153" y="370" font-size="12" fill="#6b7280" text-anchor="middle">400</text>
    <text x="221" y="370" font-size="12" fill="#6b7280" text-anchor="middle">600</text>
    <text x="289" y="370" font-size="12" fill="#6b7280" text-anchor="middle">800</text>
    <text x="357" y="370" font-size="12" fill="#6b7280" text-anchor="middle">1000</text>
    <text x="425" y="370" font-size="12" fill="#6b7280" text-anchor="middle">1200</text>

    <!-- Крива 1: Термостовпчик (Плоска) -->
    <path d="M 85,160 L 425,160" stroke="#2457d6" stroke-width="3" fill="none"/>
    <text x="160" y="140" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">Термостовпчик: плоска S(λ) ≈ const</text>

    <!-- Крива 2: Кремнієвий фотодіод Si (Селективна) -->
    <path d="M 85,340 C 130,330 180,310 230,270 C 270,220 300,160 323,150 C 350,160 380,260 391,350" stroke="#27ae60" stroke-width="3" fill="none"/>
    
    <!-- Підпис фотодіода з покажчиком -->
    <text x="120" y="225" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">Фотодіод Si</text>
    <line x1="195" y1="225" x2="245" y2="255" stroke="#27ae60" stroke-width="1" stroke-dasharray="2,2"/>
    <circle cx="245" cy="255" r="3" fill="#27ae60"/>

    <line x1="391" y1="150" x2="391" y2="350" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="330" y="335" font-size="12" fill="#c0392b" font-weight="bold" text-anchor="start">Край λ_c</text>

    <!-- Нижній блок висновку -->
    <rect x="42" y="407" width="411" height="22" rx="4" fill="#ffffff" stroke="#d0d7de"/>
    <text x="247.5" y="422" font-size="12" fill="#1a1a1a" text-anchor="middle">Термостовпчик — спектрально-незалежний, фотодіод — вибірковий</text>
  </g>

  <!-- ПРАВА ПАНЕЛЬ: ШВИДКОДІЯ P(t) -->
  <g id="panel-right">
    <rect x="495" y="75" width="435" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="507" y="87" width="411" height="30" rx="4" fill="#e9f7ef"/>
    <text x="712.5" y="107" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">б) Перехідна характеристика швидкодії P(t)</text>

    <!-- Сітка графіка -->
    <line x1="550" y1="250" x2="900" y2="250" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="550" y1="150" x2="900" y2="150" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Осі координат -->
    <line x1="550" y1="350" x2="550" y2="135" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
    <line x1="550" y1="350" x2="910" y2="350" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

    <!-- Підписи осей -->
    <text x="510" y="125" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Відгук P_out, відн. од.</text>
    <text x="725" y="395" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Час t, с</text>

    <!-- Мітки Y -->
    <text x="540" y="354" font-size="12" fill="#6b7280" text-anchor="end">0</text>
    <text x="540" y="254" font-size="12" fill="#6b7280" text-anchor="end">50%</text>
    <text x="540" y="154" font-size="12" fill="#6b7280" text-anchor="end">100%</text>

    <!-- Вхідний лазерний імпульс P_in (пунктир) -->
    <path d="M 550,350 L 580,350 L 580,150 L 900,150" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4" fill="none"/>
    <text x="600" y="138" font-size="12" fill="#6b7280" font-weight="bold" text-anchor="start">Оптичний імпульс P_in</text>

    <!-- Крива 1: Фотодіод (Миттєва) -->
    <path d="M 550,350 L 580,350 L 583,150 L 900,150" stroke="#27ae60" stroke-width="3" fill="none"/>
    <text x="600" y="175" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">Фотодіод: t_r &lt; 1 нс (миттєвий)</text>

    <!-- Крива 2: Термостовпчик (Повільна інерційна) -->
    <path d="M 550,350 L 580,350 C 640,340 700,260 880,165" stroke="#2457d6" stroke-width="3" fill="none"/>
    <line x1="700" y1="223" x2="700" y2="350" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="710" y="295" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">Термостовпчик: τ ≈ 1–3 с</text>

    <!-- Нижній блок висновку -->
    <rect x="507" y="407" width="411" height="22" rx="4" fill="#ffffff" stroke="#d0d7de"/>
    <text x="712.5" y="422" font-size="12" fill="#1a1a1a" text-anchor="middle">Фотодіод — для імпульсів, термостовпчик — для потужності</text>
  </g>
</svg>
