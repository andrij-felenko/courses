<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Marker Definitions -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кінетика термічної активації та деактивації безодмивного флюсу</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Температурні інтервали випаровування носія, відновлення оксидів кислотами та запікання залишків</text>

  <!-- Zone Headers -->
  <rect x="90" y="65" width="176" height="40" fill="#f4f6f8" stroke="#d0d7de" rx="4"/>
  <text x="178" y="81" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">I. Випаровування носія</text>
  <text x="178" y="96" font-size="11" fill="#6b7280" text-anchor="middle">25–120 °C (C₂H₅OH / IPA)</text>

  <rect x="272" y="65" width="214" height="40" fill="#eaf0fd" stroke="#2457d6" rx="4"/>
  <text x="379" y="81" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">II. Активація кислот</text>
  <text x="379" y="96" font-size="11" fill="#2457d6" text-anchor="middle">120–185 °C (Дикарбонові кислоти)</text>

  <rect x="492" y="65" width="194" height="40" fill="#fdecea" stroke="#c0392b" rx="4"/>
  <text x="589" y="81" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">III. Паяння &amp; Розклад</text>
  <text x="589" y="96" font-size="11" fill="#c0392b" text-anchor="middle">185–245 °C (Розклад до CO₂/H₂O)</text>

  <rect x="692" y="65" width="198" height="40" fill="#e9f7ef" stroke="#27ae60" rx="4"/>
  <text x="791" y="81" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">IV. Капсуляція залишків</text>
  <text x="791" y="96" font-size="11" fill="#27ae60" text-anchor="middle">&lt; 180 °C (Матриця RO/RE, SIR)</text>

  <!-- Vertical Zone Dividers -->
  <line x1="272" y1="110" x2="272" y2="370" stroke="#d0d7de" stroke-dasharray="4,4"/>
  <line x1="492" y1="110" x2="492" y2="370" stroke="#d0d7de" stroke-dasharray="4,4"/>
  <line x1="692" y1="110" x2="692" y2="370" stroke="#d0d7de" stroke-dasharray="4,4"/>

  <!-- Horizontal Grid Lines -->
  <line x1="272" y1="140" x2="890" y2="140" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <text x="82" y="144" font-size="11" fill="#6b7280" text-anchor="end">245 °C</text>

  <line x1="90" y1="205" x2="890" y2="205" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <text x="82" y="209" font-size="11" fill="#6b7280" text-anchor="end">185 °C</text>

  <line x1="90" y1="280" x2="890" y2="280" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <text x="82" y="284" font-size="11" fill="#6b7280" text-anchor="end">120 °C</text>

  <line x1="90" y1="360" x2="890" y2="360" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <text x="82" y="364" font-size="11" fill="#6b7280" text-anchor="end">25 °C</text>

  <!-- Axes -->
  <line x1="90" y1="370" x2="90" y2="110" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="90" y1="370" x2="905" y2="370" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="35" y="105" font-size="12" font-weight="bold" fill="#1a1a1a">T (°C)</text>
  <text x="905" y="390" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Час t (с)</text>

  <!-- Legend Box -->
  <rect x="98" y="120" width="166" height="50" fill="white" stroke="#d0d7de" rx="4"/>
  <line x1="108" y1="138" x2="132" y2="138" stroke="#2457d6" stroke-width="3"/>
  <text x="138" y="142" font-size="11" font-weight="bold" fill="#1a1a1a">T(t) Температура</text>
  <line x1="108" y1="156" x2="132" y2="156" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="4,3"/>
  <text x="138" y="160" font-size="11" font-weight="bold" fill="#1a1a1a">A(t) Активність</text>

  <!-- Curves -->
  <!-- Temperature Curve T(t) -->
  <path d="M 90,360 C 160,360 210,280 270,280 L 490,205 C 540,205 565,140 590,140 C 615,140 640,205 690,205 C 760,205 820,320 890,340" fill="none" stroke="#2457d6" stroke-width="3"/>

  <!-- Flux Chemical Activity Curve A(t) -->
  <path d="M 90,365 L 270,360 C 310,360 340,160 380,160 C 430,160 460,280 490,290 C 540,330 610,355 690,360 L 890,360" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="6,4"/>

  <!-- Reflow Peak Badge -->
  <rect x="520" y="118" width="140" height="20" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="3"/>
  <text x="590" y="132" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">Tmax = 245 °C (Reflow)</text>

  <!-- Callout Card 1: Peak Activity -->
  <rect x="280" y="110" width="200" height="36" fill="white" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="380" y="125" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Пік активності кислот A(t)</text>
  <text x="380" y="139" font-size="10" fill="#1a1a1a" text-anchor="middle">MeO + 2R-COOH → Me(R-COO)₂ + H₂O</text>

  <!-- Callout Card 2: Deactivation -->
  <rect x="500" y="235" width="180" height="36" fill="white" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="590" y="250" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Термічний розклад</text>
  <text x="590" y="264" font-size="10" fill="#1a1a1a" text-anchor="middle">Активатори → CO₂ ↑ + H₂O ↑</text>

  <!-- Callout Card 3: Encapsulation -->
  <rect x="700" y="120" width="180" height="36" fill="white" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="790" y="135" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Інертна капсуляція</text>
  <text x="790" y="149" font-size="10" fill="#1a1a1a" text-anchor="middle">Захист каніфоллю, високий SIR</text>

  <!-- Bottom Summary Cards -->
  <rect x="90" y="405" width="255" height="65" fill="#f4f6f8" stroke="#d0d7de" rx="5"/>
  <text x="102" y="423" font-size="11" font-weight="bold" fill="#1a1a1a">1. Випаровування &amp; Активація</text>
  <text x="102" y="440" font-size="11" fill="#6b7280">Видалення носія без розбризкування.</text>
  <text x="102" y="455" font-size="11" fill="#6b7280">Дисоціація кислот та зняття плівок MeO.</text>

  <rect x="360" y="405" width="255" height="65" fill="#eaf0fd" stroke="#2457d6" rx="5"/>
  <text x="372" y="423" font-size="11" font-weight="bold" fill="#2457d6">2. Паяння &amp; Деактивація</text>
  <text x="372" y="440" font-size="11" fill="#1a1a1a">Зниження поверхневого натягу припою.</text>
  <text x="372" y="455" font-size="11" fill="#1a1a1a">Повний розклад кислот при T &gt; 200 °C.</text>

  <rect x="630" y="405" width="260" height="65" fill="#e9f7ef" stroke="#27ae60" rx="5"/>
  <text x="642" y="423" font-size="11" font-weight="bold" fill="#27ae60">3. Капсуляція &amp; Безпека SIR</text>
  <text x="642" y="440" font-size="11" fill="#1a1a1a">Затвердіння смоли RO/RE навколо іонів.</text>
  <text x="642" y="455" font-size="11" fill="#1a1a1a">Запобігання корозії та дендритам.</text>
</svg>
