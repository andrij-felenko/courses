<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Definitions -->
  <defs>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-danger" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-success" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Електрохімічна міграція і розбудова корозійного дендрита</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Волога плівка та залишки флюсу утворюють електроліт для анодного розчинення Cu²⁺ і катодного росту дендрита</text>

  <!-- Step Card 1 -->
  <rect x="30" y="70" width="280" height="140" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="170" y="94" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Анодне розчинення (Анод)</text>
  <text x="170" y="118" font-size="12" fill="#1a1a1a" text-anchor="middle">Окиснення мідного треку (+U):</text>
  <text x="170" y="140" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Cu(s) → Cu²⁺ + 2e⁻</text>
  <text x="170" y="162" font-size="12" fill="#6b7280" text-anchor="middle">Іони Cu²⁺ розчиняються в електроліті</text>
  <text x="170" y="182" font-size="12" fill="#6b7280" text-anchor="middle">під дією напруги та вологи</text>

  <!-- Step Card 2 -->
  <rect x="340" y="70" width="280" height="140" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="94" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Іонне перенесення (Електроліт)</text>
  <text x="480" y="118" font-size="12" fill="#1a1a1a" text-anchor="middle">Дрейф іонів Cu²⁺ у полі E:</text>
  <text x="480" y="140" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Міграція: Анод (+) → Катод (-)</text>
  <text x="480" y="162" font-size="12" fill="#6b7280" text-anchor="middle">Волога плівка залишків флюсу</text>
  <text x="480" y="182" font-size="12" fill="#6b7280" text-anchor="middle">знижує опір ізоляції SIR</text>

  <!-- Step Card 3 -->
  <rect x="650" y="70" width="280" height="140" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="790" y="94" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">3. Катодний ріст дендрита (Катод)</text>
  <text x="790" y="118" font-size="12" fill="#1a1a1a" text-anchor="middle">Відновлення міді (GND / 0 В):</text>
  <text x="790" y="140" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Cu²⁺ + 2e⁻ → Cu⁰ (металевий ріст)</text>
  <text x="790" y="162" font-size="12" fill="#6b7280" text-anchor="middle">Формування голчастого кристала</text>
  <text x="790" y="182" font-size="12" fill="#6b7280" text-anchor="middle">коротке замикання між треками</text>

  <!-- Connecting Arrows between Cards -->
  <line x1="310" y1="140" x2="332" y2="140" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <line x1="620" y1="140" x2="642" y2="140" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-danger)"/>

  <!-- Main Panel Container -->
  <rect x="30" y="230" width="900" height="300" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Electric Field Indicator -->
  <line x1="250" y1="252" x2="710" y2="252" stroke="#2457d6" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr-accent)"/>
  <text x="480" y="245" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Електричне поле E (від Анода + до Катода -)</text>

  <!-- Moisture Layer Banner above moisture box -->
  <rect x="230" y="348" width="500" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="480" y="364" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Волога плівка залишків флюсу (електроліт з іонами Cl⁻, H⁺, OH⁻)</text>

  <!-- Callout Box for Dendrite Tip -->
  <rect x="370" y="275" width="220" height="50" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="480" y="295" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Фронт росту дендрита Cu⁰</text>
  <text x="480" y="313" font-size="11" fill="#1a1a1a" text-anchor="middle">Замикання міжтрекового зазору</text>

  <!-- Pointer arrow down to dendrite front -->
  <line x1="480" y1="325" x2="480" y2="342" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-danger)"/>

  <!-- Moisture layer box -->
  <rect x="230" y="380" width="500" height="40" rx="4" fill="#fdecea" stroke="#c0392b" stroke-dasharray="4,3" stroke-width="1.5"/>

  <!-- FR-4 Substrate -->
  <rect x="50" y="420" width="860" height="90" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="455" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Діелектрична підкладка друкованої плати (Склотекстоліт FR-4)</text>
  <text x="480" y="478" font-size="12" fill="#6b7280" text-anchor="middle">Висока вологість і некоректно підібраний флюс знижують опір поверхневої ізоляції (SIR)</text>

  <!-- Trace 1 (Anode) -->
  <rect x="70" y="320" width="160" height="100" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="150" y="350" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Анодний трек (+U)</text>
  <text x="150" y="374" font-size="12" fill="#1a1a1a" text-anchor="middle">Потенціал: +3.3В / +5В</text>
  <text x="150" y="396" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Cu → Cu²⁺ + 2e⁻</text>

  <!-- Trace 2 (Cathode) -->
  <rect x="730" y="320" width="160" height="100" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="810" y="350" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Катодний трек (0 В)</text>
  <text x="810" y="374" font-size="12" fill="#1a1a1a" text-anchor="middle">Потенціал: GND / 0 В</text>
  <text x="810" y="396" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Cu²⁺ + 2e⁻ → Cu⁰</text>

  <!-- Migrating Ions -->
  <circle cx="290" cy="400" r="13" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="290" y="404" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Cu²⁺</text>
  <line x1="305" y1="400" x2="335" y2="400" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>

  <circle cx="360" cy="400" r="13" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="360" y="404" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Cu²⁺</text>
  <line x1="375" y1="400" x2="405" y2="400" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>

  <!-- Dendrite Structure -->
  <path d="M 730,400 L 680,400 L 650,394 L 620,405 L 580,397 L 540,403 L 500,396 L 460,400 L 430,400" stroke="#c0392b" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 650,394 L 642,386 M 620,405 L 612,413 M 580,397 L 572,389 M 540,403 L 532,411 M 500,396 L 492,388 M 460,400 L 452,408" stroke="#c0392b" stroke-width="1.5" fill="none"/>
</svg>
