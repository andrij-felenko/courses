<rect x="124.8" y="463.9" width="690.3" height="44.1" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="470.0" y="482.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">П'ять чисел вирішують усе: сплав (Sn/Pb — свинцевий чи ні), діаметр (тонкий для дрібного, товстий для великого),</tspan><tspan x="470.0" dy="13.7">частка й тип флюсу (для новачка — свинцевий Sn60/63 + no-clean або RMA). Решта на етикетці — маса й виробник.</tspan></text>
