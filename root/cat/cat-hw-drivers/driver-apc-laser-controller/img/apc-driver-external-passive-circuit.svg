<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Пасивний обв'язок APC-драйвера лазерного діода</text>
  <text x="480" y="62" text-anchor="middle" font-size="13" fill="#6b7280">Резистори R_SET, R_LIM та конденсатор C_SS задають режим APC, захист і м'який пуск</text>

  <!-- LEFT PANEL: External Passive Network -->
  <rect x="40" y="90" width="270" height="410" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="175" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Зовнішній пасивний обв'язок</text>

  <!-- CENTER PANEL: APC Driver IC -->
  <rect x="360" y="90" width="290" height="410" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <rect x="375" y="105" width="260" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="505" y="126" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">APC Driver IC (Мікросхема)</text>

  <!-- RIGHT PANEL: Laser & Photodiode Module -->
  <rect x="690" y="90" width="230" height="410" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="805" y="115" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Оптичний блок (LD + PD)</text>
  <text x="805" y="132" text-anchor="middle" font-size="11" fill="#6b7280">Лазерний модуль із фотодіодом</text>

  <!-- LEFT PANEL COMPONENTS & WIRES -->
  <!-- Power VCC Input -->
  <text x="55" y="152" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">+V_CC</text>
  <line x1="55" y1="160" x2="360" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Bypass Capacitor C_BYP at x=90 -->
  <line x1="90" y1="160" x2="90" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="78" y1="175" x2="102" y2="175" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="78" y1="181" x2="102" y2="181" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="90" y1="181" x2="90" y2="460" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="90" cy="160" r="3" fill="#1a1a1a"/>
  <circle cx="90" cy="460" r="3" fill="#1a1a1a"/>

  <text x="108" y="175" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">C_BYP</text>
  <text x="108" y="189" text-anchor="start" font-size="11" fill="#6b7280">100 nF (фільтр)</text>

  <!-- Power Setting Resistor R_SET at x=250, y=230 -->
  <line x1="250" y1="230" x2="360" y2="230" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="250" y1="230" x2="250" y2="242" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="241" y="242" width="18" height="36" rx="2" fill="white" stroke="#2457d6" stroke-width="2"/>
  <line x1="250" y1="278" x2="250" y2="460" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="250" cy="460" r="3" fill="#2457d6"/>

  <text x="230" y="242" text-anchor="end" font-size="13" font-weight="bold" fill="#2457d6">R_SET</text>
  <text x="230" y="256" text-anchor="end" font-size="11" fill="#1a1a1a">Налаштування I_PD</text>
  <text x="230" y="270" text-anchor="end" font-size="11" fill="#2457d6">Потужність P_opt</text>

  <!-- Current Limit Resistor R_LIM at x=250, y=310 -->
  <line x1="250" y1="310" x2="360" y2="310" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="250" y1="310" x2="250" y2="322" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="241" y="322" width="18" height="36" rx="2" fill="white" stroke="#c0392b" stroke-width="2"/>
  <line x1="250" y1="358" x2="250" y2="460" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="250" cy="460" r="3" fill="#c0392b"/>

  <text x="230" y="322" text-anchor="end" font-size="13" font-weight="bold" fill="#c0392b">R_LIM</text>
  <text x="230" y="336" text-anchor="end" font-size="11" fill="#1a1a1a">Поріг струму I_max</text>
  <text x="230" y="350" text-anchor="end" font-size="11" fill="#c0392b">Захист лазера</text>

  <!-- Soft-Start Capacitor C_SS at x=250, y=390 -->
  <line x1="250" y1="390" x2="360" y2="390" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="250" y1="390" x2="250" y2="402" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="238" y1="402" x2="262" y2="402" stroke="#27ae60" stroke-width="2"/>
  <line x1="238" y1="408" x2="262" y2="408" stroke="#27ae60" stroke-width="2"/>
  <line x1="250" y1="408" x2="250" y2="460" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="250" cy="460" r="3" fill="#27ae60"/>

  <text x="230" y="402" text-anchor="end" font-size="13" font-weight="bold" fill="#27ae60">C_SS</text>
  <text x="230" y="416" text-anchor="end" font-size="11" fill="#1a1a1a">Плавний пуск t_ss</text>
  <text x="230" y="430" text-anchor="end" font-size="11" fill="#27ae60">Без сплесків струму</text>

  <!-- Ground Rail (Left Panel) -->
  <line x1="90" y1="460" x2="360" y2="460" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- IC PINS & INTERNAL BLOCKS -->
  <!-- Left Pin Labels -->
  <text x="372" y="164" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">VCC</text>
  <text x="372" y="234" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">SET</text>
  <text x="372" y="314" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">ILIM</text>
  <text x="372" y="394" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">SS</text>
  <text x="372" y="464" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">GND</text>

  <!-- Internal Sub-blocks -->
  <!-- APC Controller block -->
  <rect x="440" y="205" width="130" height="48" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="505" y="224" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Контур APC</text>
  <text x="505" y="240" text-anchor="middle" font-size="11" fill="#6b7280">Компенсація T і t</text>
  <path d="M 405,230 L 440,230" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arr-blue)"/>

  <!-- Current Limiter block -->
  <rect x="440" y="285" width="130" height="48" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="505" y="304" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Захист I_max</text>
  <text x="505" y="320" text-anchor="middle" font-size="11" fill="#6b7280">Обмеження струму</text>
  <path d="M 410,310 L 440,310" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arr-red)"/>

  <!-- Soft-Start block -->
  <rect x="440" y="365" width="130" height="48" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="505" y="384" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Плавний пуск</text>
  <text x="505" y="400" text-anchor="middle" font-size="11" fill="#6b7280">Формування рампи</text>
  <path d="M 395,390 L 440,390" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arr-green)"/>

  <!-- Right Pin Labels -->
  <text x="638" y="224" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">OUT_LD</text>
  <text x="638" y="364" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">IN_PD</text>

  <!-- Internal Connections to Output/Input Pins -->
  <path d="M 570,220 L 595,220" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <path d="M 595,360 L 570,240" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arr-blue)"/>

  <!-- RIGHT PANEL: LASER & PHOTODIODE MODULE COMPONENTS -->
  <!-- Wire from OUT_LD to LD -->
  <line x1="650" y1="220" x2="760" y2="220" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Laser Diode LD at x=760 -->
  <line x1="760" y1="160" x2="760" y2="190" stroke="#c0392b" stroke-width="1.5"/>
  <polygon points="760,190 748,208 772,208" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <line x1="748" y1="208" x2="772" y2="208" stroke="#c0392b" stroke-width="2"/>
  <line x1="760" y1="208" x2="760" y2="220" stroke="#c0392b" stroke-width="1.5"/>
  <text x="760" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">+V_CC</text>

  <text x="785" y="196" text-anchor="start" font-size="13" font-weight="bold" fill="#c0392b">LD</text>
  <text x="785" y="210" text-anchor="start" font-size="11" fill="#1a1a1a">Лазерний діод</text>
  <text x="785" y="224" text-anchor="start" font-size="11" fill="#c0392b">Генерація P_opt</text>

  <!-- Emitted Light Beam -->
  <line x1="780" y1="245" x2="875" y2="245" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arr-red)"/>
  <text x="760" y="258" text-anchor="start" font-size="11" font-weight="bold" fill="#c0392b">Вихідне світло P_opt</text>

  <!-- Optical Feedback Path (Dashed Curve from LD to PD) -->
  <path d="M 740,215 Q 715,275 740,335" fill="none" stroke="#2457d6" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr-blue)"/>
  <text x="715" y="274" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Оптичний</text>
  <text x="715" y="288" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">зв'язок</text>

  <!-- Wire from IN_PD to PD -->
  <line x1="650" y1="360" x2="760" y2="360" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Monitor Photodiode PD at x=760 -->
  <line x1="748" y1="348" x2="772" y2="348" stroke="#2457d6" stroke-width="2"/>
  <polygon points="748,348 772,348 760,366" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <line x1="760" y1="348" x2="760" y2="360" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="760" y1="366" x2="760" y2="460" stroke="#2457d6" stroke-width="1.5"/>

  <text x="785" y="348" text-anchor="start" font-size="13" font-weight="bold" fill="#2457d6">PD</text>
  <text x="785" y="362" text-anchor="start" font-size="11" fill="#1a1a1a">Моніторний фотодіод</text>
  <text x="785" y="376" text-anchor="start" font-size="11" fill="#2457d6">Струм I_PD ∝ P_opt</text>

  <!-- Module GND -->
  <line x1="760" y1="460" x2="760" y2="472" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="748" y1="472" x2="772" y2="472" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="752" y1="476" x2="768" y2="476" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="756" y1="480" x2="764" y2="480" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="760" y="494" text-anchor="middle" font-size="11" fill="#6b7280">GND</text>

  <!-- Left Panel GND Symbol -->
  <line x1="200" y1="460" x2="200" y2="472" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="188" y1="472" x2="212" y2="472" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="192" y1="476" x2="208" y2="476" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="196" y1="480" x2="204" y2="480" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="200" y="494" text-anchor="middle" font-size="11" fill="#6b7280">GND (Спільна шина)</text>
</svg>
