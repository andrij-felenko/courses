<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Структура мікросхеми APC-драйвера лазерного діода</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Контур зворотного зв'язку за струмом фотодіода стабілізує випромінювання</text>

  <!-- External Laser Module Container -->
  <rect x="720" y="80" width="200" height="390" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M 720 88 A 8 8 0 0 1 728 80 L 912 80 A 8 8 0 0 1 920 88 L 920 112 L 720 112 Z" fill="#eaf0fd"/>
  <line x1="720" y1="112" x2="920" y2="112" stroke="#2457d6" stroke-width="1"/>
  <text x="805" y="100" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Лазерний модуль</text>

  <!-- VCC Power Line to Laser Diode -->
  <text x="875" y="44" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Живлення VCC</text>
  <line x1="875" y1="50" x2="875" y2="135" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Laser Diode (LD) -->
  <rect x="735" y="135" width="170" height="75" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="820" y="162" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Лазерний діод (LD)</text>
  <text x="820" y="185" font-size="12" fill="#6b7280" text-anchor="middle">Струм накачки I_LD</text>

  <!-- Optical Feedback Arrow -->
  <line x1="770" y1="210" x2="770" y2="325" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <text x="782" y="272" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">Потік P_opt (hν)</text>

  <!-- Monitor Photodiode (MPD) -->
  <rect x="735" y="325" width="170" height="75" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="820" y="352" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Моніторний фотодіод</text>
  <text x="820" y="375" font-size="12" fill="#6b7280" text-anchor="middle">Фотострум I_PD ∝ P_opt</text>

  <!-- IC Main Container -->
  <rect x="40" y="80" width="600" height="390" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="2"/>
  <path d="M 40 88 A 8 8 0 0 1 48 80 L 632 80 A 8 8 0 0 1 640 88 L 640 112 L 40 112 Z" fill="#eaf0fd"/>
  <line x1="40" y1="112" x2="640" y2="112" stroke="#2457d6" stroke-width="1"/>
  <text x="55" y="100" font-size="13" font-weight="bold" fill="#2457d6">Мікросхема драйвера APC (Automatic Power Control IC)</text>

  <!-- Internal IC Blocks -->

  <!-- 1. V_REF -->
  <rect x="60" y="130" width="135" height="65" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="127.5" y="155" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Опорна напруга</text>
  <text x="127.5" y="176" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">V_REF</text>

  <!-- 2. FB Node / Current Sense -->
  <rect x="60" y="255" width="135" height="80" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="127.5" y="277" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Каскад зчитування</text>
  <text x="127.5" y="296" font-size="12" fill="#1a1a1a" text-anchor="middle">струму фотодіода</text>
  <text x="127.5" y="318" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">V_FB = I_PD · R_SET</text>

  <!-- 3. Error Amplifier (EA) -->
  <rect x="245" y="170" width="150" height="85" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="320" y="195" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Підсилювач</text>
  <text x="320" y="215" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">помилки (EA)</text>
  <text x="320" y="237" font-size="12" fill="#6b7280" text-anchor="middle">ΔV = V_REF − V_FB</text>

  <!-- 4. Soft-Start & Protection -->
  <rect x="245" y="290" width="150" height="80" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="320" y="314" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Плавний пуск та</text>
  <text x="320" y="334" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">захист I_MAX</text>
  <text x="320" y="355" font-size="12" fill="#6b7280" text-anchor="middle">Обмеження сплесків</text>

  <!-- 5. Output Control Driver Transistor -->
  <rect x="440" y="190" width="145" height="90" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="512.5" y="217" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Вихідний регулюючий</text>
  <text x="512.5" y="237" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">силовий ключ</text>
  <text x="512.5" y="259" font-size="12" fill="#6b7280" text-anchor="middle">Регулювання I_LD</text>

  <!-- APC Loop Summary Banner inside IC -->
  <rect x="195" y="425" width="425" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="407.5" y="442" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Контур APC: MPD → I_PD → R_SET → V_FB → EA → I_LD → P_opt</text>

  <!-- IC Terminals / Pins -->
  <rect x="590" y="197.5" width="45" height="30" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="612.5" y="216" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">OUT</text>

  <rect x="590" y="340" width="45" height="30" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="612.5" y="359" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">PD</text>

  <rect x="100" y="415" width="55" height="30" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="127.5" y="434" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">SET</text>

  <!-- Internal IC Connections -->

  <!-- V_REF -> EA (+) -->
  <path d="M 195 162.5 H 215 V 190 H 245" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="215" y="150" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">V_REF (+)</text>

  <!-- FB Node -> EA (-) -->
  <path d="M 195 280 H 215 V 230 H 245" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="207" y="258" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">V_FB (-)</text>

  <!-- EA -> Output Driver (V_CTRL) -->
  <path d="M 395 212.5 H 440" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="417.5" y="202" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">V_CTRL</text>

  <!-- Soft-Start -> Output Driver Protection -->
  <path d="M 395 330 H 417.5 V 257.5 H 440" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="424" y="298" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">Захист</text>

  <!-- Output Driver -> OUT Pin -->
  <path d="M 585 212.5 H 590" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="587" y="202" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">I_LD</text>

  <!-- SET Pin -> FB Node -->
  <path d="M 127.5 415 V 335" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="135" y="375" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">V_FB</text>

  <!-- PD Pin -> FB Node (Photocurrent Routing Path) -->
  <path d="M 590 355 H 580 V 390 H 215 V 310 H 195" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="400" y="410" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Сигнал фотоструму I_PD</text>

  <!-- External Connections -->

  <!-- OUT Pin to Laser Diode cathode -->
  <path d="M 635 212.5 H 675 V 172.5 H 735" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="680" y="162" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Струм I_LD</text>

  <!-- MPD anode to PD Pin -->
  <path d="M 735 362.5 H 675 V 355 H 635" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="680" y="344" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">I_PD</text>

  <!-- External Resistor R_SET -->
  <line x1="127.5" y1="445" x2="127.5" y2="465" stroke="#2457d6" stroke-width="2"/>
  <rect x="107.5" y="465" width="40" height="20" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="155" y="479" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">R_SET</text>

  <!-- Line to Ground -->
  <line x1="127.5" y1="485" x2="127.5" y2="502" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Ground Symbol -->
  <line x1="115.5" y1="502" x2="139.5" y2="502" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="119.5" y1="506" x2="135.5" y2="506" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="123.5" y1="510" x2="131.5" y2="510" stroke="#1a1a1a" stroke-width="1"/>
  <text x="148" y="508" font-size="12" fill="#6b7280" text-anchor="start">GND</text>
</svg>
