  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Топології виводів 3-вивідних лазерних діодів (TO-Can)</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Спільний вивід корпусу визначає тип вихідного каскаду драйвера (Sink/Source) та схему зворотного зв'язку</text>

  <!-- ==================== PANEL 1: TYPE A ==================== -->
