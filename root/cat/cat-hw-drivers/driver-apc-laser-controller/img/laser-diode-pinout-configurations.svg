<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Markers -->
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Конфігурації виводів трьохвивідних лазерних діодів (N, P, M-type)</text>
  <text x="480" y="55" font-size="13" fill="#6b7280" text-anchor="middle">Спільне внутрішнє з'єднання кристалів LD і PD визначає полярність включення в драйвер APC</text>

  <!-- ==================== PANEL 1: N-TYPE ==================== -->
  <g id="panel-n-type">
    <!-- Card Frame -->
    <rect x="30" y="80" width="284" height="420" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    
    <!-- Banner -->
    <rect x="42" y="92" width="260" height="44" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="172" y="111" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">N-type</text>
    <text x="172" y="128" font-size="12" fill="#1a1a1a" text-anchor="middle">Спільний: K(LD) + A(PD)</text>

    <!-- Housing Box -->
    <rect x="50" y="148" width="244" height="195" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="172" y="166" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Корпус LD (TO-can)</text>

    <!-- Component Labels -->
    <text x="100" y="188" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">LD</text>
    <text x="244" y="188" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">PD</text>

    <!-- Pin 1 wire to LD Anode -->
    <path d="M 80,343 L 80,205 L 100,205" fill="none" stroke="#1a1a1a" stroke-width="2"/>

    <!-- LD Diode -->
    <polygon points="90,205 110,205 100,225" fill="#2457d6" stroke="#2457d6"/>
    <line x1="90" y1="225" x2="110" y2="225" stroke="#2457d6" stroke-width="2.5"/>
    <!-- LD Emission arrows -->
    <line x1="112" y1="210" x2="122" y2="204" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <line x1="112" y1="220" x2="122" y2="226" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

    <!-- LD Cathode to Common -->
    <path d="M 100,225 L 100,275 L 172,275" fill="none" stroke="#1a1a1a" stroke-width="2"/>

    <!-- Optical Light Coupling -->
    <line x1="128" y1="215" x2="216" y2="215" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
    <text x="172" y="208" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Pₒ (Світло)</text>

    <!-- PD Diode -->
    <line x1="234" y1="205" x2="254" y2="205" stroke="#27ae60" stroke-width="2.5"/>
    <polygon points="234,205 254,205 244,225" fill="#27ae60" stroke="#27ae60"/>
    <!-- PD Light Sensing arrows -->
    <line x1="222" y1="204" x2="232" y2="210" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
    <line x1="222" y1="226" x2="232" y2="220" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

    <!-- PD Anode to Common -->
    <path d="M 244,225 L 244,275 L 172,275" fill="none" stroke="#1a1a1a" stroke-width="2"/>

    <!-- Pin 3 wire to PD Cathode -->
    <path d="M 264,343 L 264,205 L 244,205" fill="none" stroke="#1a1a1a" stroke-width="2"/>

    <!-- Common Junction Node & Pin 2 -->
    <circle cx="172" cy="275" r="4" fill="#1a1a1a"/>
    <line x1="172" y1="275" x2="172" y2="343" stroke="#1a1a1a" stroke-width="2"/>

    <!-- Pin lines from housing to circles -->
    <line x1="80" y1="343" x2="80" y2="359" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="172" y1="343" x2="172" y2="359" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="264" y1="343" x2="264" y2="359" stroke="#1a1a1a" stroke-width="2"/>

    <!-- Pin Circles -->
    <circle cx="80" cy="370" r="11" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="80" y="374" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1</text>

    <circle cx="172" cy="370" r="11" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="172" y="374" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2</text>

    <circle cx="264" cy="370" r="11" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="264" y="374" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3</text>

    <!-- External Interface Block -->
    <rect x="42" y="396" width="260" height="92" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
    <text x="54" y="414" font-size="12" font-weight="bold" fill="#1a1a1a">Виводи та з'єднання:</text>
    <text x="54" y="433" font-size="12" fill="#1a1a1a">• Pin 1: Анод LD (вихід Драйвера)</text>
    <text x="54" y="451" font-size="12" fill="#1a1a1a">• Pin 2: K(LD)/A(PD) → GND (0 В)</text>
    <text x="54" y="469" font-size="12" fill="#1a1a1a">• Pin 3: Катод PD (до FB / VCC)</text>
  </g>

  <!-- ==================== PANEL 2: P-TYPE ==================== -->
  <g id="panel-p-type">
    <!-- Card Frame -->
    <rect x="338" y="80" width="284" height="420" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

    <!-- Banner -->
    <rect x="350" y="92" width="260" height="44" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="480" y="111" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">P-type</text>
    <text x="480" y="128" font-size="12" fill="#1a1a1a" text-anchor="middle">Спільний: A(LD) + K(PD)</text>

    <!-- Housing Box -->
    <rect x="358" y="148" width="244" height="195" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="480" y="166" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Корпус LD (TO-can)</text>

    <!-- Component Labels -->
    <text x="408" y="188" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">LD</text>
    <text x="552" y="188" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">PD</text>

    <!-- Common Junction Node at TOP -->
    <circle cx="480" cy="205" r="4" fill="#1a1a1a"/>

    <!-- Common to LD Anode -->
    <line x1="480" y1="205" x2="408" y2="205" stroke="#1a1a1a" stroke-width="2"/>

    <!-- LD Diode -->
    <polygon points="398,205 418,205 408,225" fill="#2457d6" stroke="#2457d6"/>
    <line x1="398" y1="225" x2="418" y2="225" stroke="#2457d6" stroke-width="2.5"/>
    <!-- LD Emission arrows -->
    <line x1="420" y1="210" x2="430" y2="204" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <line x1="420" y1="220" x2="430" y2="226" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

    <!-- LD Cathode to Pin 1 -->
    <path d="M 408,225 L 408,275 L 388,275 L 388,343" fill="none" stroke="#1a1a1a" stroke-width="2"/>

    <!-- Optical Light Coupling -->
    <line x1="436" y1="215" x2="524" y2="215" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
    <text x="480" y="198" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Pₒ (Світло)</text>

    <!-- Common to PD Cathode -->
    <line x1="480" y1="205" x2="552" y2="205" stroke="#1a1a1a" stroke-width="2"/>

    <!-- PD Diode -->
    <line x1="542" y1="205" x2="562" y2="205" stroke="#27ae60" stroke-width="2.5"/>
    <polygon points="542,225 562,225 552,205" fill="#27ae60" stroke="#27ae60"/>
    <!-- PD Light Sensing arrows -->
    <line x1="530" y1="204" x2="540" y2="210" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
    <line x1="530" y1="226" x2="540" y2="220" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

    <!-- PD Anode to Pin 3 -->
    <path d="M 552,225 L 552,275 L 572,275 L 572,343" fill="none" stroke="#1a1a1a" stroke-width="2"/>

    <!-- Pin 2 Common Wire -->
    <line x1="480" y1="205" x2="480" y2="343" stroke="#1a1a1a" stroke-width="2"/>

    <!-- Pin lines from housing to circles -->
    <line x1="388" y1="343" x2="388" y2="359" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="480" y1="343" x2="480" y2="359" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="572" y1="343" x2="572" y2="359" stroke="#1a1a1a" stroke-width="2"/>

    <!-- Pin Circles -->
    <circle cx="388" cy="370" r="11" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="388" y="374" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1</text>

    <circle cx="480" cy="370" r="11" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="480" y="374" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2</text>

    <circle cx="572" cy="370" r="11" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="572" y="374" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3</text>

    <!-- External Interface Block -->
    <rect x="350" y="396" width="260" height="92" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
    <text x="362" y="414" font-size="12" font-weight="bold" fill="#1a1a1a">Виводи та з'єднання:</text>
    <text x="362" y="433" font-size="12" fill="#1a1a1a">• Pin 1: Катод LD (вихід Драйвера)</text>
    <text x="362" y="451" font-size="12" fill="#1a1a1a">• Pin 2: A(LD)/K(PD) → VCC (+живлення)</text>
    <text x="362" y="469" font-size="12" fill="#1a1a1a">• Pin 3: Анод PD (до FB / GND)</text>
  </g>

  <!-- ==================== PANEL 3: M-TYPE ==================== -->
  <g id="panel-m-type">
    <!-- Card Frame -->
    <rect x="646" y="80" width="284" height="420" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

    <!-- Banner -->
    <rect x="658" y="92" width="260" height="44" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="788" y="111" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">M-type</text>
    <text x="788" y="128" font-size="12" fill="#1a1a1a" text-anchor="middle">Спільний: K(LD) + K(PD)</text>

    <!-- Housing Box -->
    <rect x="666" y="148" width="244" height="195" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="5,4"/>
    <text x="788" y="166" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Корпус LD (TO-can)</text>

    <!-- Component Labels -->
    <text x="716" y="188" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">LD</text>
    <text x="860" y="188" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">PD</text>

    <!-- Pin 1 wire to LD Anode -->
    <path d="M 696,343 L 696,205 L 716,205" fill="none" stroke="#1a1a1a" stroke-width="2"/>

    <!-- LD Diode -->
    <polygon points="706,205 726,205 716,225" fill="#2457d6" stroke="#2457d6"/>
    <line x1="706" y1="225" x2="726" y2="225" stroke="#2457d6" stroke-width="2.5"/>
    <!-- LD Emission arrows -->
    <line x1="728" y1="210" x2="738" y2="204" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
    <line x1="728" y1="220" x2="738" y2="226" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

    <!-- LD Cathode to Common -->
    <path d="M 716,225 L 716,275 L 788,275" fill="none" stroke="#1a1a1a" stroke-width="2"/>

    <!-- Optical Light Coupling -->
    <line x1="744" y1="215" x2="832" y2="215" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
    <text x="788" y="208" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Pₒ (Світло)</text>

    <!-- PD Diode -->
    <polygon points="850,205 870,205 860,225" fill="#27ae60" stroke="#27ae60"/>
    <line x1="850" y1="225" x2="870" y2="225" stroke="#27ae60" stroke-width="2.5"/>
    <!-- PD Light Sensing arrows -->
    <line x1="838" y1="204" x2="848" y2="210" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
    <line x1="838" y1="226" x2="848" y2="220" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

    <!-- PD Cathode to Common -->
    <path d="M 860,225 L 860,275 L 788,275" fill="none" stroke="#1a1a1a" stroke-width="2"/>

    <!-- Pin 3 wire to PD Anode -->
    <path d="M 880,343 L 880,205 L 860,205" fill="none" stroke="#1a1a1a" stroke-width="2"/>

    <!-- Common Junction Node & Pin 2 -->
    <circle cx="788" cy="275" r="4" fill="#1a1a1a"/>
    <line x1="788" y1="275" x2="788" y2="343" stroke="#1a1a1a" stroke-width="2"/>

    <!-- Pin lines from housing to circles -->
    <line x1="696" y1="343" x2="696" y2="359" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="788" y1="343" x2="788" y2="359" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="880" y1="343" x2="880" y2="359" stroke="#1a1a1a" stroke-width="2"/>

    <!-- Pin Circles -->
    <circle cx="696" cy="370" r="11" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="696" y="374" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1</text>

    <circle cx="788" cy="370" r="11" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="788" y="374" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2</text>

    <circle cx="880" cy="370" r="11" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="880" y="374" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3</text>

    <!-- External Interface Block -->
    <rect x="658" y="396" width="260" height="92" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
    <text x="670" y="414" font-size="12" font-weight="bold" fill="#1a1a1a">Виводи та з'єднання:</text>
    <text x="670" y="433" font-size="12" fill="#1a1a1a">• Pin 1: Анод LD (вихід Драйвера)</text>
    <text x="670" y="451" font-size="12" fill="#1a1a1a">• Pin 2: K(LD)/K(PD) → GND (0 В)</text>
    <text x="670" y="469" font-size="12" fill="#1a1a1a">• Pin 3: Анод PD (негативна FB)</text>
  </g>
</svg>
