<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>

  <!-- Title & Subtitle -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Топології контурів APC драйверів лазерних діодів</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Порівняння конфігурацій зі спільним анодом (Low-Side) та спільним катодом (High-Side)</text>

  <!-- ==================== PANEL 1: COMMON ANODE ==================== -->
  <!-- Header Rect -->
  <rect x="30" y="65" width="435" height="34" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="247.5" y="87" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">А. Конфігурація зі спільним анодом (Common Anode)</text>

  <!-- Outer Panel Rect -->
  <rect x="30" y="107" width="435" height="413" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Feedback Line (Top) -->
  <path d="M400,350 L435,350 L435,118 L55,118 L55,375 L129,375" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-blue)"/>
  <text x="240" y="114" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Зворотний зв'язок керування (V_G)</text>

  <!-- Power Rails (Panel 1) -->
  <line x1="45" y1="140" x2="450" y2="140" stroke="#c0392b" stroke-width="2"/>
  <text x="65" y="134" font-size="12" font-weight="bold" fill="#c0392b">V_CC (+5V)</text>

  <line x1="45" y1="450" x2="450" y2="450" stroke="#1a1a1a" stroke-width="2"/>
  <text x="65" y="444" font-size="12" font-weight="bold" fill="#1a1a1a">GND (0V)</text>

  <!-- Pin 1 Common Node to V_CC -->
  <line x1="195" y1="140" x2="195" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="202" y="158" font-size="12" fill="#6b7280">Pin 1 (V_CC)</text>

  <!-- TO-Can Package Boundary (Panel 1) -->
  <rect x="100" y="175" width="190" height="95" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Common Node Inside TO-Can -->
  <line x1="140" y1="200" x2="250" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="195" cy="200" r="3" fill="#1a1a1a"/>

  <!-- Laser Diode LD (Panel 1) -->
  <line x1="140" y1="200" x2="140" y2="210" stroke="#2457d6" stroke-width="1.5"/>
  <polygon points="130,210 150,210 140,230" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="130" y1="230" x2="150" y2="230" stroke="#2457d6" stroke-width="2"/>
  <line x1="140" y1="230" x2="140" y2="270" stroke="#2457d6" stroke-width="1.5"/>
  <text x="125" y="225" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">LD</text>

  <!-- Monitor Photodiode MPD (Panel 1) -->
  <line x1="250" y1="200" x2="250" y2="210" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="240" y1="210" x2="260" y2="210" stroke="#2457d6" stroke-width="2"/>
  <polygon points="240,230 260,230 250,210" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="250" y1="230" x2="250" y2="270" stroke="#2457d6" stroke-width="1.5"/>
  <text x="265" y="225" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">MPD</text>

  <!-- Optical Ray (Panel 1) -->
  <path d="M155,222 L235,222" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <text x="195" y="217" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">P_opt</text>

  <!-- TO-Can Label Inside Box (Panel 1) -->
  <text x="195" y="248" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle"><tspan x="195" dy="0">Корпус LD/MPD</tspan><tspan x="195" dy="14">(CA)</tspan></text>

  <!-- Pin 2 Line (Panel 1) -->
  <line x1="140" y1="270" x2="140" y2="340" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="128" y="300" font-size="12" fill="#6b7280" text-anchor="end">Pin 2 (Kat_LD)</text>

  <!-- Q1 Transistor (N-FET) (Panel 1) -->
  <circle cx="140" cy="375" r="18" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="140" y1="340" x2="140" y2="362" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="140" y1="388" x2="140" y2="450" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="135" y1="362" x2="135" y2="388" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="129" y1="362" x2="129" y2="388" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="55" y1="375" x2="129" y2="375" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="65" y="365" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Q1 (N-FET)</text>

  <!-- Pin 3 Line & I_MON (Panel 1) -->
  <line x1="250" y1="270" x2="250" y2="315" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M250,278 L250,303" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="238" y="295" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">I_MON</text>
  <text x="258" y="295" font-size="12" fill="#6b7280" text-anchor="start">Pin 3 (An_MPD)</text>

  <!-- Node V_MON & R_SET (Panel 1) -->
  <circle cx="250" cy="315" r="3" fill="#2457d6"/>
  <text x="238" y="320" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">V_MON</text>
  <line x1="250" y1="315" x2="250" y2="340" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="242" y="340" width="16" height="45" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="250" y1="385" x2="250" y2="450" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="266" y="367" font-size="12" font-weight="bold" fill="#1a1a1a">R_SET</text>

  <!-- Line V_MON to EA (-) Input (Panel 1) -->
  <polyline points="250,315 310,315 310,335 340,335" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- V_REF Block & Line to EA (+) Input (Panel 1) -->
  <rect x="265" y="400" width="55" height="26" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="292.5" y="417" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">V_REF</text>
  <polyline points="320,413 325,413 325,365 340,365" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Error Amplifier EA (Panel 1) -->
  <polygon points="340,320 400,350 340,380" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="346" y="340" font-size="14" font-weight="bold" fill="#1a1a1a">-</text>
  <text x="346" y="370" font-size="14" font-weight="bold" fill="#1a1a1a">+</text>
  <text x="365" y="310" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">EA (Підсилювач)</text>

  <!-- Summary Box (Panel 1) -->
  <rect x="40" y="460" width="415" height="52" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="48" y="478" font-size="11.5" font-weight="bold" fill="#27ae60">• Low-Side керування (N-FET): I_MON утворює V_MON відносно GND</text>
  <text x="48" y="498" font-size="11.5" fill="#1a1a1a">• Опорна напруга V_REF на вхід підсилювача задає P_opt</text>

  <!-- ==================== PANEL 2: COMMON CATHODE ==================== -->
  <!-- Header Rect -->
  <rect x="495" y="65" width="435" height="34" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="712.5" y="87" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Б. Конфігурація зі спільним катодом (Common Cathode)</text>

  <!-- Outer Panel Rect -->
  <rect x="495" y="107" width="435" height="413" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Feedback Line (Top) -->
  <path d="M865,220 L900,220 L900,118 L520,118 L520,185 L594,185" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-blue)"/>
  <text x="705" y="114" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Зворотний зв'язок керування (V_G)</text>

  <!-- Power Rails (Panel 2) -->
  <line x1="510" y1="140" x2="915" y2="140" stroke="#c0392b" stroke-width="2"/>
  <text x="530" y="134" font-size="12" font-weight="bold" fill="#c0392b">V_CC (+5V)</text>

  <line x1="510" y1="450" x2="915" y2="450" stroke="#1a1a1a" stroke-width="2"/>
  <text x="530" y="444" font-size="12" font-weight="bold" fill="#1a1a1a">GND (0V)</text>

  <!-- High-Side Transistor Q2 (P-MOSFET) (Panel 2) -->
  <circle cx="605" cy="185" r="18" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="605" y1="140" x2="605" y2="167" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="605" y1="203" x2="605" y2="265" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="600" y1="172" x2="600" y2="198" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="594" y1="172" x2="594" y2="198" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="520" y1="185" x2="594" y2="185" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="530" y="175" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Q2 (P-FET)</text>

  <!-- Sense Resistor R_SET & Node V_MON (Panel 2) -->
  <line x1="715" y1="140" x2="715" y2="155" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="707" y="155" width="16" height="45" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="715" y1="200" x2="715" y2="265" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="715" cy="220" r="3" fill="#2457d6"/>
  <text x="730" y="180" font-size="12" font-weight="bold" fill="#1a1a1a">R_SET</text>
  <text x="703" y="224" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">V_MON</text>

  <!-- Pin Labels Outside TO-Can (Panel 2) -->
  <text x="595" y="255" font-size="12" fill="#6b7280" text-anchor="end">Pin 2 (An_LD)</text>
  <text x="725" y="255" font-size="12" fill="#6b7280" text-anchor="start">Pin 3 (Cat_MPD)</text>
  <path d="M715,230 L715,255" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="703" y="247" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">I_MON</text>

  <!-- TO-Can Package Boundary (Panel 2) -->
  <rect x="565" y="265" width="190" height="95" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="660" y="278" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle"><tspan x="660" dy="0">Корпус LD/MPD</tspan><tspan x="660" dy="14">(CC)</tspan></text>

  <!-- Laser Diode LD (Panel 2) -->
  <line x1="605" y1="265" x2="605" y2="315" stroke="#2457d6" stroke-width="1.5"/>
  <polygon points="595,315 615,315 605,335" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="595" y1="335" x2="615" y2="335" stroke="#2457d6" stroke-width="2"/>
  <line x1="605" y1="335" x2="605" y2="345" stroke="#2457d6" stroke-width="1.5"/>
  <text x="590" y="325" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">LD</text>

  <!-- Monitor Photodiode MPD (Panel 2) -->
  <line x1="715" y1="265" x2="715" y2="315" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="705" y1="315" x2="725" y2="315" stroke="#2457d6" stroke-width="2"/>
  <polygon points="705,335 725,335 715,315" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="715" y1="335" x2="715" y2="345" stroke="#2457d6" stroke-width="1.5"/>
  <text x="730" y="325" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">MPD</text>

  <!-- Optical Ray (Panel 2) -->
  <path d="M620,313 L700,313" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <text x="660" y="308" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">P_opt</text>

  <!-- Common Node Inside & Pin 1 Ground (Panel 2) -->
  <line x1="605" y1="345" x2="715" y2="345" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="660" cy="345" r="3" fill="#1a1a1a"/>
  <line x1="660" y1="345" x2="660" y2="450" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="668" y="385" font-size="12" fill="#6b7280" text-anchor="start">Pin 1 (GND)</text>

  <!-- Line V_MON to EA (-) Input (Panel 2) -->
  <polyline points="715,220 770,220 770,205 805,205" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- V_REF Block & Line to EA (+) Input (Panel 2) -->
  <rect x="770" y="275" width="55" height="26" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="797.5" y="292" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">V_REF</text>
  <polyline points="797.5,275 797.5,235 805,235" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Error Amplifier EA (Panel 2) -->
  <polygon points="805,190 865,220 805,250" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="811" y="210" font-size="14" font-weight="bold" fill="#1a1a1a">-</text>
  <text x="811" y="240" font-size="14" font-weight="bold" fill="#1a1a1a">+</text>
  <text x="835" y="180" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">EA (Підсилювач)</text>

  <!-- Summary Box (Panel 2) -->
  <rect x="510" y="460" width="405" height="52" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="520" y="478" font-size="11.5" font-weight="bold" fill="#27ae60">• High-Side керування (P-FET): V_MON знижується від V_CC</text>
  <text x="520" y="498" font-size="11.5" fill="#1a1a1a">• Полярність підсилювача враховує інверсію P-FET</text>
</svg>
