<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Динаміка заряду затвора MOSFET та плато Міллера при керуванні від GPIO</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Обмежений струм GPIO подовжує плато Міллера (t_stage3 = Q_gd / I_GPIO), збільшуючи динамічні втрати</text>

  <!-- Left Panel: Schematic -->
  <rect x="20" y="75" width="410" height="440" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="225" y="102" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">Схема паразитних ємностей MOSFET</text>

  <!-- MCU Box -->
  <rect x="36" y="240" width="80" height="90" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="76" y="265" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">MCU GPIO</text>
  <text x="76" y="287" font-size="12" fill="#1a1a1a" text-anchor="middle">V_GPIO</text>
  <text x="76" y="307" font-size="11" fill="#6b7280" text-anchor="middle">(3.3V / 5V)</text>

  <!-- Gate resistor Rg -->
  <line x1="116" y1="285" x2="135" y2="285" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="135" y="275" width="40" height="20" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="155" y="267" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">R_G</text>
  <line x1="175" y1="285" x2="240" y2="285" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Gate current arrow I_G -->
  <line x1="180" y1="270" x2="210" y2="270" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="195" y="262" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">I_G</text>

  <!-- MOSFET Body & Terminals -->
  <!-- Gate plate -->
  <line x1="240" y1="260" x2="240" y2="310" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Channel plates -->
  <line x1="252" y1="260" x2="275" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="252" y1="285" x2="275" y2="285" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="252" y1="310" x2="275" y2="310" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Vertical channel line connecting Drain and Source lines -->
  <line x1="275" y1="160" x2="275" y2="410" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Drain wire top -->
  <line x1="275" y1="160" x2="300" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Source wire bottom -->
  <line x1="275" y1="410" x2="300" y2="410" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- MOSFET label -->
  <text x="290" y="235" font-size="13" font-weight="700" fill="#1a1a1a">MOSFET</text>

  <!-- Capacitors -->
  <!-- C_gd (Miller) -->
  <!-- Wire from Gate (x=215, y=285) up to y=200, then right to C_gd -->
  <polyline points="215,285 215,200 245,200" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- C_gd plates at x=245 and x=255, y=190..210 -->
  <line x1="245" y1="190" x2="245" y2="210" stroke="#c0392b" stroke-width="2"/>
  <line x1="255" y1="190" x2="255" y2="210" stroke="#c0392b" stroke-width="2"/>
  <!-- Wire from C_gd to Drain wire at x=275 -->
  <line x1="255" y1="200" x2="275" y2="200" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="250" y="178" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">C_gd (Міллер)</text>

  <!-- C_gs -->
  <!-- Wire from Gate (x=215, y=285) down to y=370, then right to C_gs -->
  <polyline points="215,285 215,370 245,370" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- C_gs plates at x=245 and x=255, y=360..380 -->
  <line x1="245" y1="360" x2="245" y2="380" stroke="#2457d6" stroke-width="2"/>
  <line x1="255" y1="360" x2="255" y2="380" stroke="#2457d6" stroke-width="2"/>
  <!-- Wire from C_gs to Source wire at x=275 -->
  <line x1="255" y1="370" x2="275" y2="370" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="250" y="402" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">C_gs</text>

  <!-- C_ds -->
  <!-- Wire from Drain (x=300, y=160) to C_ds, down to Source (x=300, y=410) -->
  <line x1="300" y1="160" x2="360" y2="160" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="300" y1="410" x2="360" y2="410" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="360" y1="160" x2="360" y2="278" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="360" y1="292" x2="360" y2="410" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- C_ds plates horizontal at y=278 and y=292 -->
  <line x1="350" y1="278" x2="370" y2="278" stroke="#6b7280" stroke-width="2"/>
  <line x1="350" y1="292" x2="370" y2="292" stroke="#6b7280" stroke-width="2"/>
  <text x="382" y="289" font-size="12" font-weight="700" fill="#6b7280">C_ds</text>

  <!-- Load R_L and V_DD -->
  <line x1="300" y1="160" x2="300" y2="155" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="290" y="125" width="20" height="30" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="318" y="137" font-size="12" font-weight="700" fill="#1a1a1a">R_L</text>
  <text x="318" y="151" font-size="11" fill="#6b7280">Навантаження</text>
  <line x1="300" y1="125" x2="300" y2="115" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="300" cy="115" r="3" fill="#1a1a1a"/>
  <text x="300" y="108" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">+V_DD</text>

  <!-- Ground -->
  <line x1="300" y1="410" x2="300" y2="435" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="76" y1="330" x2="76" y2="435" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="76" y1="435" x2="300" y2="435" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- GND symbol at x=300, y=435 -->
  <line x1="288" y1="435" x2="312" y2="435" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="292" y1="439" x2="308" y2="439" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="296" y1="443" x2="304" y2="443" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="325" y="440" font-size="12" font-weight="700" fill="#1a1a1a">GND</text>

  <!-- Formula box bottom left -->
  <rect x="32" y="460" width="386" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="225" y="477" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">C_iss = C_gs + C_gd  |  C_rss = C_gd</text>
  <text x="225" y="494" font-size="11" fill="#1a1a1a" text-anchor="middle">Перезаряд C_gd задає плато Міллера та динамічний нагрів</text>

  <!-- Right Panel: Oscillogram -->
  <rect x="442" y="75" width="498" height="440" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="691" y="102" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">Осцилограма увімкнення V_GS(t) та V_DS(t)</text>

  <!-- Stage 3 Highlight Box -->
  <rect x="640" y="120" width="130" height="245" fill="#fdecea" stroke="#c0392b" stroke-dasharray="3,3" stroke-width="1"/>
  <rect x="648" y="128" width="114" height="38" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="705" y="144" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">ПЛАТО МІЛЛЕРА</text>
  <text x="705" y="159" font-size="11" font-weight="700" fill="#c0392b" text-anchor="middle">t_stage3 = Q_gd / I_G</text>

  <!-- Grid / Reference Lines -->
  <!-- V_GPIO level (y=150) -->
  <line x1="510" y1="150" x2="900" y2="150" stroke="#d0d7de" stroke-dasharray="4,4"/>
  <!-- V_Miller level (y=250) -->
  <line x1="510" y1="250" x2="900" y2="250" stroke="#d0d7de" stroke-dasharray="4,4"/>
  <!-- V_th level (y=300) -->
  <line x1="510" y1="300" x2="900" y2="300" stroke="#d0d7de" stroke-dasharray="4,4"/>

  <!-- Vertical stage lines -->
  <line x1="530" y1="120" x2="530" y2="365" stroke="#d0d7de" stroke-dasharray="2,2"/>
  <line x1="590" y1="120" x2="590" y2="365" stroke="#d0d7de" stroke-dasharray="2,2"/>
  <line x1="640" y1="120" x2="640" y2="365" stroke="#d0d7de" stroke-dasharray="2,2"/>
  <line x1="770" y1="120" x2="770" y2="365" stroke="#d0d7de" stroke-dasharray="2,2"/>
  <line x1="850" y1="120" x2="850" y2="365" stroke="#d0d7de" stroke-dasharray="2,2"/>

  <!-- Axes -->
  <!-- X axis -->
  <line x1="500" y1="360" x2="915" y2="360" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- Left Y axis (V_GS) -->
  <line x1="510" y1="370" x2="510" y2="125" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <!-- Right Y axis (V_DS) -->
  <line x1="900" y1="370" x2="900" y2="125" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Axis Labels -->
  <!-- Left Y Labels (V_GS) -->
  <text x="502" y="154" font-size="12" font-weight="700" fill="#2457d6" text-anchor="end">V_GPIO</text>
  <text x="502" y="254" font-size="12" font-weight="700" fill="#c0392b" text-anchor="end">V_Miller</text>
  <text x="502" y="304" font-size="12" font-weight="700" fill="#6b7280" text-anchor="end">V_GS(th)</text>
  <text x="502" y="364" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">0V</text>
  <text x="510" y="115" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">V_GS</text>

  <!-- Right Y Labels (V_DS) -->
  <text x="908" y="144" font-size="12" font-weight="700" fill="#c0392b">V_DD</text>
  <text x="908" y="354" font-size="11" fill="#c0392b">~0V</text>
  <text x="900" y="115" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">V_DS</text>

  <!-- X axis labels (Time & Stages) -->
  <text x="530" y="375" font-size="11" fill="#1a1a1a" text-anchor="middle">t_0</text>
  <text x="590" y="375" font-size="11" fill="#1a1a1a" text-anchor="middle">t_1</text>
  <text x="640" y="375" font-size="11" fill="#1a1a1a" text-anchor="middle">t_2</text>
  <text x="770" y="375" font-size="11" fill="#1a1a1a" text-anchor="middle">t_3</text>
  <text x="850" y="375" font-size="11" fill="#1a1a1a" text-anchor="middle">t_4</text>
  <text x="922" y="364" font-size="12" font-weight="700" fill="#1a1a1a">t</text>

  <!-- Stage labels below time axis -->
  <text x="560" y="392" font-size="11" fill="#6b7280" text-anchor="middle">Заряд C_gs</text>
  <text x="615" y="406" font-size="11" fill="#6b7280" text-anchor="middle">Ріст I_D</text>
  <text x="705" y="392" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Перезаряд C_gd</text>
  <text x="810" y="392" font-size="11" fill="#6b7280" text-anchor="middle">Насичення</text>

  <!-- Waveform Curves -->
  <!-- V_GS curve (blue solid) -->
  <path d="M 510,360 L 530,360 Q 560,340 590,300 Q 615,270 640,250 L 770,250 Q 810,210 850,150 L 895,150" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <text x="855" y="142" font-size="12" font-weight="700" fill="#2457d6">V_GS(t)</text>

  <!-- V_DS curve (red solid/thick) -->
  <path d="M 510,140 L 640,140 C 670,140 740,355 770,355 L 895,355" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="855" y="345" font-size="12" font-weight="700" fill="#c0392b">V_DS(t)</text>

  <!-- Bottom note box right -->
  <rect x="454" y="425" width="474" height="78" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="691" y="444" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Вплив струму GPIO та порогу V_GS(th):</text>
  <text x="691" y="464" font-size="11" fill="#1a1a1a" text-anchor="middle">1. Низький струм GPIO (I_GPIO ~ 10..20 мА) затягує фазу t_stage3 -&gt; ростуть втрати P_sw</text>
  <text x="691" y="484" font-size="11" fill="#1a1a1a" text-anchor="middle">2. Для 3.3V GPIO потрібен MOSFET з V_GS(th) &lt; 1.5V та V_Miller &lt; 2.5V (Logic-Level)</text>
</svg>
