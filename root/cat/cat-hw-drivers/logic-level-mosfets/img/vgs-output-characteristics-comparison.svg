<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Порівняння вихідних характеристик MOSFET (I_D від V_DS)</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Логічний MOSFET досягає насичення при V_GS = 3.3 В та 5 В, а стандартний залишається у високаопірній області</text>

  <!-- LEFT PANEL: STANDARD MOSFET -->
  <rect x="30" y="70" width="435" height="430" rx="8" fill="#fdecea" stroke="#e6b0aa" stroke-width="1.5"/>
  <rect x="42" y="82" width="411" height="44" rx="6" fill="#f9d5d2"/>
  <text x="247" y="100" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">Стандартний MOSFET (наприклад, IRF540N)</text>
  <text x="247" y="117" font-size="12" fill="#78281f" text-anchor="middle">Порогова напруга V_GS(th) = 2.0...4.0 В</text>

  <!-- Region Labels and Divider (Left) -->
  <text x="127" y="148" font-size="12" fill="#6b7280" text-anchor="middle">Омічна область</text>
  <text x="295" y="148" font-size="12" fill="#6b7280" text-anchor="middle">Область насичення</text>
  <line x1="160" y1="155" x2="160" y2="435" stroke="#d0d7de" stroke-dasharray="4 3"/>

  <!-- Graph Axes (Left) -->
  <line x1="95" y1="435" x2="440" y2="435" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>
  <line x1="95" y1="435" x2="95" y2="155" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>

  <text x="85" y="158" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="end">I_D</text>
  <text x="85" y="175" font-size="12" fill="#6b7280" text-anchor="end">(Струм)</text>
  <text x="440" y="462" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">V_DS (Напруга сток-витік)</text>

  <!-- Characteristic Curves (Left) -->
  <!-- V_GS = 10V -->
  <path d="M 95 435 C 120 230, 150 190, 435 190" fill="none" stroke="#2457d6" stroke-width="3"/>
  <text x="425" y="180" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">V_GS = 10 В</text>

  <!-- V_GS = 5V -->
  <path d="M 95 435 C 140 370, 180 340, 435 340" fill="none" stroke="#d97706" stroke-width="3"/>
  <text x="425" y="330" font-size="12" font-weight="bold" fill="#d97706" text-anchor="end">V_GS = 5 В</text>

  <!-- V_GS = 3.3V -->
  <path d="M 95 435 L 435 432" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="5 3"/>
  <text x="425" y="422" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">V_GS = 3.3 В</text>

  <!-- Slope Pointer (Left) -->
  <line x1="175" y1="375" x2="140" y2="390" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="180" y="378" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">Високий R_DS(on)</text>

  <!-- Callout Box (Left) -->
  <rect x="155" y="230" width="265" height="76" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="167" y="250" font-size="12" font-weight="bold" fill="#c0392b">❌ Непридатний для 3.3 В / 5 В GPIO</text>
  <text x="167" y="270" font-size="12" fill="#1a1a1a">• При 3.3 В: закритий (I_D ≈ 0)</text>
  <text x="167" y="290" font-size="12" fill="#1a1a1a">• При 5 В: великий R_DS(on) і перегрів</text>


  <!-- RIGHT PANEL: LOGIC-LEVEL MOSFET -->
  <rect x="495" y="70" width="435" height="430" rx="8" fill="#e9f7ef" stroke="#a3e4d7" stroke-width="1.5"/>
  <rect x="507" y="82" width="411" height="44" rx="6" fill="#d4efdf"/>
  <text x="712" y="100" font-size="15" font-weight="bold" fill="#27ae60" text-anchor="middle">MOSFET логічного рівня (наприклад, IRL540N)</text>
  <text x="712" y="117" font-size="12" fill="#1e8449" text-anchor="middle">Порогова напруга V_GS(th) = 1.0...2.0 В</text>

  <!-- Region Labels and Divider (Right) -->
  <text x="592" y="148" font-size="12" fill="#6b7280" text-anchor="middle">Омічна область</text>
  <text x="765" y="148" font-size="12" fill="#6b7280" text-anchor="middle">Область насичення</text>
  <line x1="625" y1="155" x2="625" y2="435" stroke="#d0d7de" stroke-dasharray="4 3"/>

  <!-- Graph Axes (Right) -->
  <line x1="560" y1="435" x2="905" y2="435" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>
  <line x1="560" y1="435" x2="560" y2="155" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>

  <text x="550" y="158" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="end">I_D</text>
  <text x="550" y="175" font-size="12" fill="#6b7280" text-anchor="end">(Струм)</text>
  <text x="905" y="462" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">V_DS (Напруга сток-витік)</text>

  <!-- Characteristic Curves (Right) -->
  <!-- V_GS = 10V -->
  <path d="M 560 435 C 580 200, 610 185, 900 185" fill="none" stroke="#2457d6" stroke-width="3"/>
  <text x="890" y="175" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">V_GS = 10 В</text>

  <!-- V_GS = 5V -->
  <path d="M 560 435 C 582 210, 615 200, 900 200" fill="none" stroke="#27ae60" stroke-width="3"/>
  <text x="890" y="213" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">V_GS = 5 В</text>

  <!-- V_GS = 3.3V -->
  <path d="M 560 435 C 588 235, 625 228, 900 228" fill="none" stroke="#0d9488" stroke-width="3"/>
  <text x="890" y="242" font-size="12" font-weight="bold" fill="#0d9488" text-anchor="end">V_GS = 3.3 В</text>

  <!-- Slope Pointer (Right) -->
  <line x1="605" y1="375" x2="580" y2="340" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="610" y="378" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">Низький R_DS(on)</text>

  <!-- Callout Box (Right) -->
  <rect x="615" y="270" width="275" height="76" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="627" y="290" font-size="12" font-weight="bold" fill="#27ae60">✅ Ідеально для 3.3 В / 5 В GPIO</text>
  <text x="627" y="310" font-size="12" fill="#1a1a1a">• Низький R_DS(on) вже при 3.3 В</text>
  <text x="627" y="330" font-size="12" fill="#1a1a1a">• Повне відкриття без драйвера затвора</text>
</svg>
