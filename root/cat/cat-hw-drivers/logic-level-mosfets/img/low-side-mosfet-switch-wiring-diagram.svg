<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема підключення MOSFET логічного рівня (Low-Side Switch)</text>
  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Розділення сигнального й силового контурів та захист від індуктивних викидів</text>

  <!-- PANEL 1: MCU -->
  <rect x="25" y="70" width="180" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="115" y="93" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Мікроконтролер</text>
  <text x="115" y="110" text-anchor="middle" font-size="12" fill="#6b7280">(3.3 В або 5 В)</text>

  <!-- MCU Inner Box -->
  <rect x="40" y="130" width="150" height="265" rx="6" fill="#ffffff" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="115" y="155" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">МК (MCU)</text>
  <text x="115" y="173" text-anchor="middle" font-size="12" fill="#6b7280">(GPIO Вихід)</text>

  <!-- MCU Pin Labels & Terminals -->
  <text x="178" y="234" text-anchor="end" font-size="13" font-weight="bold" fill="#1a1a1a">GPIO</text>
  <circle cx="190" cy="230" r="3.5" fill="#2457d6"/>
  <text x="178" y="354" text-anchor="end" font-size="13" font-weight="bold" fill="#1a1a1a">GND</text>
  <circle cx="190" cy="350" r="3.5" fill="#2457d6"/>

  <!-- PANEL 2: LOW-SIDE DRIVER & MOSFET -->
  <rect x="225" y="70" width="440" height="345" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="445" y="93" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Силовий ключ нижнього плеча (Low-Side Switch)</text>

  <!-- Gate Resistor R_G -->
  <text x="300" y="193" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">R_G = 47...100 Ом</text>
  <text x="300" y="210" text-anchor="middle" font-size="12" fill="#6b7280">(обмеження I_G)</text>
  <line x1="190" y1="230" x2="275" y2="230" stroke="#2457d6" stroke-width="2"/>
  <rect x="275" y="220" width="50" height="20" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="3"/>
  <line x1="325" y1="230" x2="365" y2="230" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Node A (Gate Junction) -->
  <circle cx="365" cy="230" r="4" fill="#1a1a1a"/>

  <!-- Pull-Down Resistor R_GS -->
  <line x1="365" y1="230" x2="365" y2="250" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="355" y="250" width="20" height="45" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="3"/>
  <line x1="365" y1="295" x2="365" y2="350" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="365" cy="350" r="3.5" fill="#1a1a1a"/>
  <text x="345" y="267" text-anchor="end" font-size="13" font-weight="bold" fill="#1a1a1a">R_GS = 10 кОм</text>
  <text x="345" y="284" text-anchor="end" font-size="12" fill="#6b7280">(стяжка до GND)</text>

  <!-- Wire from Node A to Gate Plate -->
  <line x1="365" y1="230" x2="415" y2="230" stroke="#2457d6" stroke-width="2"/>

  <!-- MOSFET Symbol -->
  <!-- Gate Plate -->
  <line x1="415" y1="205" x2="415" y2="255" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- Insulated Channel Segments -->
  <line x1="423" y1="205" x2="423" y2="218" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="423" y1="225" x2="423" y2="235" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="423" y1="242" x2="423" y2="255" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Drain Connection from Channel -->
  <line x1="423" y1="211.5" x2="445" y2="211.5" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="445" y1="211.5" x2="445" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Source Connection from Channel -->
  <line x1="423" y1="248.5" x2="445" y2="248.5" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="445" y1="248.5" x2="445" y2="350" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- Bulk Connection with Arrow -->
  <line x1="423" y1="230" x2="445" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="445" y1="230" x2="445" y2="248.5" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="430,230 438,225 438,235" fill="#1a1a1a"/>

  <!-- Parasitic Body Diode -->
  <line x1="445" y1="211.5" x2="470" y2="211.5" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="445" y1="248.5" x2="470" y2="248.5" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="470" y1="211.5" x2="470" y2="248.5" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="462" y1="222" x2="478" y2="222" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="470,222 462,237 478,237" fill="none" stroke="#6b7280" stroke-width="1.5"/>

  <!-- MOSFET Pin Labels -->
  <text x="405" y="225" text-anchor="end" font-size="13" font-weight="bold" fill="#2457d6">G</text>
  <text x="455" y="205" text-anchor="start" font-size="13" font-weight="bold" fill="#2457d6">D</text>
  <text x="455" y="268" text-anchor="start" font-size="13" font-weight="bold" fill="#2457d6">S</text>

  <!-- MOSFET Text Info -->
  <text x="495" y="190" font-size="13" font-weight="bold" fill="#1a1a1a">N-MOSFET (Logic Level)</text>
  <text x="495" y="208" font-size="12" font-weight="bold" fill="#2457d6">IRLZ44N / FDD8447L</text>
  <text x="495" y="226" font-size="12" fill="#6b7280">V_GS(th) = 1.0...2.2 В</text>
  <text x="495" y="244" font-size="12" fill="#6b7280">Керування від 3.3В / 5В</text>

  <!-- PANEL 3: LOAD & POWER SUPPLY -->
  <rect x="685" y="70" width="250" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="810" y="93" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Навантаження та ВЖ</text>

  <!-- Power Supply Terminal (+V_CC) -->
  <line x1="715" y1="135" x2="920" y2="135" stroke="#c0392b" stroke-width="2"/>
  <circle cx="920" cy="135" r="4" fill="#c0392b"/>
  <text x="920" y="120" text-anchor="end" font-size="13" font-weight="bold" fill="#c0392b">+V_CC (+12V...+24V)</text>

  <!-- Flyback Diode Branch D_flyback -->
  <line x1="725" y1="135" x2="725" y2="160" stroke="#27ae60" stroke-width="2"/>
  <line x1="713" y1="160" x2="737" y2="160" stroke="#27ae60" stroke-width="2.5"/>
  <polygon points="725,160 713,182 737,182" fill="#27ae60"/>
  <line x1="725" y1="182" x2="725" y2="300" stroke="#27ae60" stroke-width="2"/>
  <circle cx="725" cy="135" r="3.5" fill="#27ae60"/>
  <circle cx="725" cy="300" r="3.5" fill="#1a1a1a"/>
  <text x="742" y="173" font-size="13" font-weight="bold" fill="#27ae60">D_flyback</text>
  <text x="742" y="190" font-size="12" fill="#6b7280">(1N4007 / SS34)</text>
  <text x="742" y="207" font-size="12" fill="#27ae60">Захисний діод</text>

  <!-- Inductive Load Branch -->
  <line x1="890" y1="135" x2="890" y2="160" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="890" cy="135" r="3.5" fill="#c0392b"/>
  <rect x="875" y="160" width="30" height="55" fill="#eaf0fd" stroke="#1a1a1a" stroke-width="1.5" rx="4"/>
  <path d="M 890,168 Q 900,175 890,182 Q 900,189 890,196 Q 900,203 890,210" fill="none" stroke="#2457d6" stroke-width="2"/>
  <line x1="890" y1="215" x2="890" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="890" cy="300" r="3.5" fill="#1a1a1a"/>
  <text x="805" y="242" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Індуктивне</text>
  <text x="805" y="259" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">навантаження</text>
  <text x="805" y="276" text-anchor="middle" font-size="12" fill="#6b7280">(реле / мотор)</text>

  <!-- Drain Connection Wire -->
  <line x1="445" y1="300" x2="890" y2="300" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>

  <!-- GROUND WIRING & STAR GROUND POINT -->
  <!-- Signal Ground Line (MCU GND -> Star GND) -->
  <line x1="190" y1="350" x2="445" y2="350" stroke="#2457d6" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="290" y="324" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Сигнальна земля</text>
  <text x="290" y="340" text-anchor="middle" font-size="12" fill="#6b7280">(GND_signal)</text>

  <!-- Power Ground Line (-V_CC -> Star GND) -->
  <line x1="920" y1="350" x2="445" y2="350" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="920" cy="350" r="4" fill="#c0392b"/>
  <text x="920" y="370" text-anchor="end" font-size="13" font-weight="bold" fill="#c0392b">-V_CC (GND_power)</text>
  <text x="800" y="338" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Силова земля (GND_power)</text>

  <!-- Star Ground Point Node & Symbol -->
  <circle cx="445" cy="350" r="5" fill="#1a1a1a"/>
  <line x1="445" y1="350" x2="445" y2="370" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="431" y1="370" x2="459" y2="370" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="437" y1="374" x2="453" y2="374" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="442" y1="378" x2="448" y2="378" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="445" y="398" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Спільна точка заземлення (Star Ground)</text>

  <!-- BOTTOM SUMMARY BOX -->
  <rect x="25" y="430" width="910" height="95" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="45" y="452" font-size="13" font-weight="bold" fill="#27ae60">Ключові принципи функціонування та підключення:</text>
  <text x="45" y="470" font-size="12" fill="#1a1a1a">• Логічний рівень (Logic-Level): MOSFET типу IRL повністю відкривається від напруги 3.3 В / 5 В на затворі (V_GS).</text>
  <text x="45" y="487" font-size="12" fill="#1a1a1a">• Захисний діод D_flyback: шунтує струм самоіндукції при вимкненні, захищаючи ключ від пробою.</text>
  <text x="45" y="504" font-size="12" fill="#1a1a1a">• Star Grounding: сигнальна та силова землі з'єднуються в єдиній точці біля Source, виключаючи завади на МК.</text>
</svg>
