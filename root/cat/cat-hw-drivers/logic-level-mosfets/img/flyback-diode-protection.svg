<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Marker Definitions -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Захист MOSFET демпферним діодом та розділення заземлень</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Циркуляція струму зворотної ЕРС та єдина точка з'єднання сигнального GND і силового PGND</text>

  <!-- Panel 1: Signal Domain -->
  <rect x="30" y="80" width="255" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="42.5" y="92" width="230" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="157.5" y="109" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Сигнальний контур (MCU)</text>

  <!-- Panel 2: Power Domain -->
  <rect x="300" y="80" width="630" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="460" y="92" width="310" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="615" y="109" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Силовий контур та демпферний діод</text>

  <!-- MCU GPIO Box -->
  <rect x="45" y="315" width="80" height="50" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="85" y="335" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">MCU GPIO</text>
  <text x="85" y="352" font-size="12" fill="#6b7280" text-anchor="middle">3.3V / 5V</text>

  <!-- Gate Drive Connection & Current I_G -->
  <line x1="125" y1="340" x2="148" y2="340" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="136.5" y="330" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">I_G</text>

  <!-- Gate Resistor R_G -->
  <rect x="150" y="331" width="40" height="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="170" y="316" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">R_G = 100 Ω</text>
  <text x="170" y="364" font-size="12" fill="#6b7280" text-anchor="middle">(обмеження I_G)</text>

  <!-- Wire from R_G to Junction -->
  <line x1="190" y1="340" x2="240" y2="340" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="240" cy="340" r="3.5" fill="#1a1a1a"/>

  <!-- Wire from Junction to Gate -->
  <line x1="240" y1="340" x2="370" y2="340" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Pull-Down Resistor R_GS -->
  <line x1="240" y1="340" x2="240" y2="365" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="231" y="365" width="18" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="240" y1="405" x2="240" y2="430" stroke="#1a1a1a" stroke-width="2"/>
  <text x="222" y="380" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">R_GS = 10 kΩ</text>
  <text x="222" y="396" font-size="12" fill="#6b7280" text-anchor="end">(підтяжка GND)</text>

  <!-- Signal Ground Rail & MCU Ground Connection -->
  <line x1="85" y1="365" x2="85" y2="430" stroke="#2457d6" stroke-width="2"/>
  <line x1="85" y1="430" x2="240" y2="430" stroke="#2457d6" stroke-width="2"/>

  <!-- Signal Ground Symbol -->
  <line x1="150" y1="430" x2="180" y2="430" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="155" y1="435" x2="175" y2="435" stroke="#2457d6" stroke-width="2"/>
  <line x1="160" y1="440" x2="170" y2="440" stroke="#2457d6" stroke-width="1.5"/>
  <text x="165" y="460" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">GND (Сигнальна земля)</text>
  <text x="165" y="476" font-size="12" fill="#6b7280" text-anchor="middle">Малий струм I_G</text>

  <!-- Power Supply +V_PWR -->
  <rect x="435" y="130" width="90" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="149" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">+V_PWR (+12V)</text>
  <line x1="525" y1="145" x2="740" y2="145" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Inductive Load -->
  <circle cx="586" cy="145" r="3.5" fill="#1a1a1a"/>
  <line x1="586" y1="145" x2="586" y2="160" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="535" y="160" width="102" height="90" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 566,178 Q 576,168 586,178 Q 596,168 606,178 Q 616,168 626,178" fill="none" stroke="#2457d6" stroke-width="2"/>
  <text x="586" y="198" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Індуктивне</text>
  <text x="586" y="214" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">навантаження</text>
  <text x="586" y="231" font-size="12" fill="#6b7280" text-anchor="middle">(реле / двигун)</text>
  <line x1="586" y1="250" x2="586" y2="270" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="586" cy="270" r="3.5" fill="#1a1a1a"/>

  <!-- Flyback Diode D_flyback -->
  <circle cx="740" cy="145" r="3.5" fill="#1a1a1a"/>
  <line x1="740" y1="145" x2="740" y2="175" stroke="#27ae60" stroke-width="2"/>
  <line x1="726" y1="175" x2="754" y2="175" stroke="#27ae60" stroke-width="3"/>
  <path d="M 726,205 L 754,205 L 740,175 Z" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <line x1="740" y1="205" x2="740" y2="270" stroke="#27ae60" stroke-width="2"/>
  <circle cx="740" cy="270" r="3.5" fill="#1a1a1a"/>

  <!-- Wire between Diode Anode and Load Bottom -->
  <line x1="586" y1="270" x2="740" y2="270" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Flyback Diode Labels -->
  <text x="762" y="174" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">D_flyback (Діод Шотткі)</text>
  <text x="762" y="190" font-size="12" fill="#27ae60" text-anchor="start">Швидкий діод (Schottky)</text>
  <text x="762" y="206" font-size="12" fill="#6b7280" text-anchor="start">Замикає струм ЕРС</text>
  <text x="762" y="222" font-size="12" fill="#6b7280" text-anchor="start">Захищає MOSFET</text>

  <!-- Flyback Current Loop Curve & Badge -->
  <path d="M 606,260 C 685,260 685,155 606,155" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arr-green)"/>
  <rect x="650" y="193" width="74" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="687" y="209" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">I_flyback</text>

  <!-- Drain Connection Line -->
  <line x1="586" y1="270" x2="410" y2="270" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="410" y1="270" x2="410" y2="310" stroke="#1a1a1a" stroke-width="2"/>

  <!-- MOSFET (IRLZ44N) Symbol -->
  <circle cx="402" cy="340" r="26" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="382" y1="325" x2="382" y2="355" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="390" y1="322" x2="390" y2="332" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="390" y1="336" x2="390" y2="344" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="390" y1="348" x2="390" y2="358" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="390" y1="327" x2="410" y2="327" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="390" y1="353" x2="410" y2="353" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="390" y1="340" x2="410" y2="340" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 398,340 L 405,336 L 405,344 Z" fill="#1a1a1a"/>
  <line x1="410" y1="340" x2="410" y2="353" stroke="#1a1a1a" stroke-width="2"/>

  <!-- MOSFET Terminal Pin Labels -->
  <text x="362" y="335" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">G</text>
  <text x="418" y="302" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">D</text>
  <text x="418" y="378" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">S</text>

  <!-- MOSFET Info Text -->
  <text x="440" y="328" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">IRLZ44N</text>
  <text x="440" y="344" font-size="12" fill="#6b7280" text-anchor="start">Logic-Level MOSFET</text>
  <text x="440" y="360" font-size="12" fill="#6b7280" text-anchor="start">V_GS(th) = 1.0...2.0 V</text>

  <!-- Drain Current I_D Label & Flow -->
  <line x1="410" y1="370" x2="410" y2="420" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="440" y="390" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">Силовий струм I_D</text>

  <!-- Grounding Topology: Star Grounding Connection -->
  <line x1="240" y1="430" x2="404" y2="430" stroke="#2457d6" stroke-width="2" stroke-dasharray="4 3"/>
  <line x1="416" y1="430" x2="740" y2="430" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Power Ground Symbol -->
  <line x1="725" y1="430" x2="755" y2="430" stroke="#c0392b" stroke-width="2.5"/>
  <path d="M 728,430 L 723,440 M 736,430 L 731,440 M 744,430 L 739,440 M 752,430 L 747,440" stroke="#c0392b" stroke-width="2"/>
  <text x="740" y="460" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">PGND (Силова земля)</text>
  <text x="740" y="476" font-size="12" fill="#6b7280" text-anchor="middle">Силовий струм I_D</text>

  <!-- Star Ground Node Highlight -->
  <circle cx="410" cy="430" r="6" fill="#27ae60" stroke="#ffffff" stroke-width="2"/>

  <!-- Callout Arrow from Node to Star Ground Box -->
  <line x1="410" y1="436" x2="410" y2="448" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Star Ground Badge Box -->
  <rect x="315" y="452" width="190" height="46" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="410" y="470" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Точка Star Ground</text>
  <text x="410" y="487" font-size="12" fill="#1a1a1a" text-anchor="middle">Єдине з'єднання GND і PGND</text>
</svg>
