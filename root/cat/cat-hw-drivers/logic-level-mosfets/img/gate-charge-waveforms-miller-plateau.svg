  <rect x="40" y="75" width="880" height="445" rx="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <text x="480" y="40" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Осцилограми перезаряджання затвора MOSFET і плато Міллера</text>
  <text x="480" y="62" font-size="13" text-anchor="middle" fill="#6b7280">Під час плато Міллера V_GS стала, а одночасна присутність V_DS та I_D спричиняє втрати</text>

  <text x="300" y="98" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">УВІМКНЕННЯ (Turn-On)</text>
  <text x="695" y="98" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">ВИМКНЕННЯ (Turn-Off)</text>

  <rect x="210" y="225" width="160" height="230" fill="#fdecea" fill-opacity="0.65" rx="4" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="550" y="225" width="230" height="230" fill="#fdecea" fill-opacity="0.65" rx="4" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="290" y="240" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">Динамічні втрати P_sw</text>
  <text x="290" y="254" font-size="12" text-anchor="middle" fill="#c0392b">(одночасні V_DS та I_D)</text>

  <text x="665" y="240" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">Динамічні втрати P_sw</text>
  <text x="665" y="254" font-size="12" text-anchor="middle" fill="#c0392b">(одночасні V_DS та I_D)</text>

