  <text x="325" y="144" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">Плато Міллера</text>

  <rect x="612" y="130" width="106" height="20" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="665" y="144" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">Плато Міллера</text>

  <text x="125" y="129" font-size="12" text-anchor="end" fill="#2457d6">V_GS = V_DRV</text>
  <text x="125" y="159" font-size="12" text-anchor="end" fill="#2457d6">V_GP (плато)</text>
  <text x="125" y="179" font-size="12" text-anchor="end" fill="#2457d6">V_TH (поріг)</text>
  <text x="125" y="204" font-size="12" text-anchor="end" fill="#6b7280">0 V</text>

  <text x="125" y="274" font-size="12" text-anchor="end" fill="#27ae60">I_D,max</text>
  <text x="125" y="334" font-size="12" text-anchor="end" fill="#6b7280">0 A</text>

  <text x="125" y="374" font-size="12" text-anchor="end" fill="#c0392b">V_DS = V_DD</text>
  <text x="125" y="450" font-size="12" text-anchor="end" fill="#c0392b">V_DS(on) ~ 0 V</text>

  <text x="865" y="145" font-size="13" font-weight="bold" text-anchor="start" fill="#2457d6">V_GS (затвор)</text>
  <text x="865" y="275" font-size="13" font-weight="bold" text-anchor="start" fill="#27ae60">I_D (стік)</text>
  <text x="865" y="410" font-size="13" font-weight="bold" text-anchor="start" fill="#c0392b">V_DS (стік)</text>

  <text x="180" y="473" font-size="12" text-anchor="middle" fill="#1a1a1a">t_d(on)</text>
  <text x="245" y="473" font-size="12" text-anchor="middle" fill="#1a1a1a">t_ri</text>
  <text x="325" y="473" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">t_f (спад V_DS)</text>

  <text x="585" y="473" font-size="12" text-anchor="middle" fill="#1a1a1a">t_d(off)</text>
  <text x="665" y="473" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">t_r (ріст V_DS)</text>
  <text x="745" y="473" font-size="12" text-anchor="middle" fill="#1a1a1a">t_fi</text>

