<text x="470.0" y="482.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">Спільна земля логіки й силового живлення — обовʼязкова, інакше логіка «не бачить» рівнів</text>
<rect x="159.0" y="498.5" width="621.9" height="31.0" rx="6" fill="#eef6ef" stroke="#27ae60" stroke-width="1.5"/><text x="470.0" y="517.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">два джерела: логіка (VCC/GND від МК) і сила (V+/PWR GND від окремого блока); землі зведені разом</tspan></text>
