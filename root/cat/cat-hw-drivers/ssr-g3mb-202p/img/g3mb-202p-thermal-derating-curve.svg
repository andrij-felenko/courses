<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Header -->
  <text x="480" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Теплова характеристика G3MB-202P (Derating Curve)</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Зниження максимального струму навантаження від 2,0 А (при 40 °C) до 0 А (при 80 °C)</text>

  <!-- Main Chart Panel -->
  <rect x="30" y="75" width="900" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Shaded Regions -->
  <!-- Safe Operating Area (Nominal) -->
  <polygon points="160,350 160,170 510,170 710,350" fill="#eaf0fd" fill-opacity="0.85"/>
  <!-- Derating / Prohibited Area -->
  <polygon points="510,170 830,170 830,350 710,350" fill="#fdecea" fill-opacity="0.65"/>

  <!-- Grid Lines (Horizontal) -->
  <line x1="130" y1="305" x2="830" y2="305" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1"/>
  <!-- y=260 segmented around Card 1 (175..425) and Label 2 (625..705) -->
  <line x1="130" y1="260" x2="170" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1"/>
  <line x1="430" y1="260" x2="620" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1"/>
  <line x1="710" y1="260" x2="830" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1"/>
  <line x1="130" y1="215" x2="830" y2="215" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1"/>
  <line x1="130" y1="170" x2="830" y2="170" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1"/>
  <!-- y=125 segmented around Card 2 (550..820) -->
  <line x1="130" y1="125" x2="540" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1"/>
  <line x1="830" y1="125" x2="830" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1"/>

  <!-- Vertical Reference Lines -->
  <line x1="160" y1="170" x2="160" y2="350" stroke="#6b7280" stroke-dasharray="4,4" stroke-width="1"/>
  <!-- x=310 segmented around Card 1 (y=225..295) -->
  <line x1="310" y1="120" x2="310" y2="220" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1"/>
  <line x1="310" y1="300" x2="310" y2="350" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1"/>
  <line x1="510" y1="170" x2="510" y2="350" stroke="#c0392b" stroke-dasharray="4,4" stroke-width="1.5"/>
  <line x1="610" y1="260" x2="610" y2="350" stroke="#2457d6" stroke-dasharray="4,4" stroke-width="1"/>
  <line x1="710" y1="170" x2="710" y2="350" stroke="#c0392b" stroke-dasharray="4,4" stroke-width="1.5"/>

  <!-- Axes -->
  <!-- Y-Axis -->
  <line x1="130" y1="350" x2="130" y2="100" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <!-- X-Axis -->
  <line x1="130" y1="350" x2="850" y2="350" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Axis Titles -->
  <text x="130" y="88" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Струм навантаження, А</text>
  <text x="480" y="415" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Температура навколишнього середовища Tₐ (°C)</text>

  <!-- Y Ticks & Labels -->
  <line x1="124" y1="350" x2="130" y2="350" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="118" y="354" text-anchor="end" font-size="12" fill="#1a1a1a">0,0 А</text>

  <line x1="124" y1="305" x2="130" y2="305" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="118" y="309" text-anchor="end" font-size="12" fill="#1a1a1a">0,5 А</text>

  <line x1="124" y1="260" x2="130" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="118" y="264" text-anchor="end" font-size="12" fill="#1a1a1a">1,0 А</text>

  <line x1="124" y1="215" x2="130" y2="215" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="118" y="219" text-anchor="end" font-size="12" fill="#1a1a1a">1,5 А</text>

  <line x1="124" y1="170" x2="130" y2="170" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="118" y="174" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">2,0 А</text>

  <line x1="124" y1="125" x2="130" y2="125" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="118" y="129" text-anchor="end" font-size="12" fill="#1a1a1a">2,5 А</text>

  <!-- X Ticks & Labels -->
  <line x1="160" y1="350" x2="160" y2="356" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="160" y="372" text-anchor="middle" font-size="12" fill="#1a1a1a">-30 °C</text>

  <line x1="210" y1="350" x2="210" y2="356" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="210" y="372" text-anchor="middle" font-size="12" fill="#1a1a1a">-20 °C</text>

  <line x1="310" y1="350" x2="310" y2="356" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="310" y="372" text-anchor="middle" font-size="12" fill="#1a1a1a">0 °C</text>

  <line x1="410" y1="350" x2="410" y2="356" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="410" y="372" text-anchor="middle" font-size="12" fill="#1a1a1a">+20 °C</text>

  <line x1="510" y1="350" x2="510" y2="356" stroke="#c0392b" stroke-width="2"/>
  <text x="510" y="372" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">+40 °C</text>

  <line x1="610" y1="350" x2="610" y2="356" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="610" y="372" text-anchor="middle" font-size="12" fill="#1a1a1a">+60 °C</text>

  <line x1="710" y1="350" x2="710" y2="356" stroke="#c0392b" stroke-width="2"/>
  <text x="710" y="372" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">+80 °C</text>

  <line x1="810" y1="350" x2="810" y2="356" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="810" y="372" text-anchor="middle" font-size="12" fill="#1a1a1a">+100 °C</text>

  <!-- Derating Curve Line -->
  <!-- Flat Section (-30°C to +40°C) -->
  <line x1="160" y1="170" x2="510" y2="170" stroke="#2457d6" stroke-width="4" stroke-linecap="round"/>
  <!-- Slope Section (+40°C to +80°C) -->
  <line x1="510" y1="170" x2="710" y2="350" stroke="#2457d6" stroke-width="4" stroke-linecap="round"/>
  <!-- Zero Section (+80°C to +100°C) -->
  <line x1="710" y1="350" x2="830" y2="350" stroke="#c0392b" stroke-width="3" stroke-dasharray="6,4"/>

  <!-- Data Point Circles -->
  <circle cx="160" cy="170" r="5" fill="#2457d6"/>
  <circle cx="510" cy="170" r="6" fill="#c0392b" stroke="white" stroke-width="2"/>
  <circle cx="610" cy="260" r="5" fill="#2457d6" stroke="white" stroke-width="1.5"/>
  <circle cx="710" cy="350" r="6" fill="#c0392b" stroke="white" stroke-width="2"/>

  <!-- Point Callout Labels -->
  <text x="495" y="155" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">40 °C / 2,0 А</text>
  <text x="625" y="245" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">60 °C / 1,0 А</text>
  <text x="725" y="335" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">80 °C / 0 А</text>

  <!-- Info Cards / Annotations -->
  <!-- Card 1: Safe Operating Area -->
  <rect x="175" y="225" width="250" height="70" rx="6" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="190" y="246" font-size="13" font-weight="bold" fill="#2457d6">Номінальний режим (100%)</text>
  <text x="190" y="264" font-size="12" fill="#1a1a1a">I_max = 2,0 А при Tₐ ≤ 40 °C</text>
  <text x="190" y="282" font-size="12" fill="#6b7280">Без додаткового радіатора</text>

  <!-- Card 2: Derating / Warning Area -->
  <rect x="550" y="95" width="270" height="70" rx="6" fill="white" stroke="#c0392b" stroke-width="1.5"/>
  <text x="565" y="116" font-size="13" font-weight="bold" fill="#c0392b">Зона термозниження (Derating)</text>
  <text x="565" y="134" font-size="12" fill="#1a1a1a">Спадання: -0,05 А на кожен 1 °C</text>
  <text x="565" y="152" font-size="12" fill="#c0392b">При Tₐ > 80 °C робота ЗАБОРОНЕНА</text>
</svg>
