<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="480" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="36" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Гальванічна ізоляція та ізоляційний паз на друкованій платі</text>
  <text x="480" y="58" font-size="13" text-anchor="middle" fill="#6b7280">Фрезерований паз під корпусом збільшує шлях витоку струму (Creepage) по поверхні текстоліту</text>

  <!-- Main PCB Structure Top View / Cross Section Diagram -->
  <!-- PCB Substrate -->
  <rect x="80" y="240" width="800" height="60" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="130" y="275" font-size="13" font-weight="700" text-anchor="start" fill="#6b7280">Плата FR-4</text>

  <!-- Cutout Slot in PCB -->
  <rect x="450" y="240" width="60" height="60" fill="#ffffff" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="480" y="275" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">Ізоляційний паз</text>

  <!-- G3MB-202P Package Sitting Above PCB -->
  <rect x="250" y="100" width="460" height="90" rx="6" fill="#1a1a1a" stroke="#1a1a1a"/>
  <text x="480" y="145" font-size="16" font-weight="700" text-anchor="middle" fill="#ffffff">Корпус SSR G3MB-202P (SIP-4)</text>

  <!-- Low Voltage Side (DC 5V) Pins -->
  <rect x="290" y="190" width="16" height="50" fill="#2457d6"/>
  <rect x="370" y="190" width="16" height="50" fill="#2457d6"/>
  <text x="298" y="225" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
  <text x="378" y="225" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
  <text x="334" y="325" font-size="13" font-weight="700" text-anchor="middle" fill="#2457d6">Низьковольтна зона (DC 5V)</text>
  <text x="334" y="345" font-size="12" text-anchor="middle" fill="#6b7280">Вхідні піни керування</text>

  <!-- High Voltage Side (AC 230V) Pins -->
  <rect x="570" y="190" width="16" height="50" fill="#c0392b"/>
  <rect x="650" y="190" width="16" height="50" fill="#c0392b"/>
  <text x="578" y="225" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
  <text x="658" y="225" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
  <text x="624" y="325" font-size="13" font-weight="700" text-anchor="middle" fill="#c0392b">Високовольтна зона (AC 230V)</text>
  <text x="624" y="345" font-size="12" text-anchor="middle" fill="#6b7280">Силові контакти симістора</text>

  <!-- Clearance Arrow (in air) -->
  <line x1="386" y1="210" x2="556" y2="210" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  <text x="470" y="200" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">Зазор у повітрі (Clearance &gt; 3 мм)</text>

  <!-- Creepage Path with Slot (along surface down into slot and up) -->
  <!-- Creepage path: from 378,240 -> 450,240 -> 450,300 -> 510,300 -> 510,240 -> 570,240 -->
  <polyline points="378,240 450,240 450,300 510,300 510,240 570,240" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="5 3"/>
  <text x="480" y="380" font-size="13" font-weight="700" text-anchor="middle" fill="#27ae60">Шлях витоку по поверхні (Creepage Distance &gt; 5 мм)</text>
  <text x="480" y="400" font-size="12" text-anchor="middle" fill="#6b7280">Паз блокує поверхневий витік і пробій по поверхні плати</text>

  <!-- Dimension Indicator for Cutout Width -->
  <line x1="450" y1="430" x2="510" y2="430" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="480" y="425" font-size="12" text-anchor="middle" fill="#1a1a1a">Ширина пазу &ge; 2 мм</text>

</svg>