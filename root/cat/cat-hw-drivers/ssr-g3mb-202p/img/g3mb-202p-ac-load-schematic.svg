<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема підключення мережевого навантаження до реле G3MB-202P</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Гальванічна розв'язка 5 В / 230 В із захистом виходу запобіжником, варистором та RC-снабером</text>

  <!-- Фонові зони -->
  <!-- Низьковольтна зона (DC 5V) -->
  <rect x="30" y="70" width="250" height="385" rx="8" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="155" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Низьковольтна зона (DC 5 В)</text>
  <text x="155" y="113" text-anchor="middle" font-size="12" fill="#6b7280">Логіка мікроконтролера та індикація</text>

  <!-- Високовольтна зона (AC 230V) -->
  <rect x="480" y="70" width="450" height="385" rx="8" fill="#fdecea" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="705" y="95" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">Високовольтна зона (AC 230 В)</text>
  <text x="705" y="113" text-anchor="middle" font-size="12" fill="#6b7280">Силове мережеве коло та захисні елементи</text>

  <!-- Гальванічний ізоляційний бар'єр -->
  <line x1="380" y1="70" x2="380" y2="455" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>
  <rect x="310" y="118" width="140" height="24" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="380" y="134" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Ізоляція ≥ 2.5 кВ AC</text>
  <rect x="310" y="415" width="140" height="24" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="380" y="431" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Зазор ≥ 4.0 мм</text>

  <!-- Провідники низьковольтної зони -->
  <!-- GPIO 5V лінія -->
  <line x1="140" y1="240" x2="310" y2="240" stroke="#2457d6" stroke-width="2"/>
  <!-- GND лінія -->
  <line x1="140" y1="320" x2="310" y2="320" stroke="#6b7280" stroke-width="2"/>

  <!-- Блок Мікроконтролера -->
  <rect x="45" y="170" width="95" height="170" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="92.5" y="200" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Мікро-</text>
  <text x="92.5" y="216" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">контролер</text>
  <circle cx="140" cy="240" r="3" fill="#2457d6"/>
  <text x="132" y="233" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">GPIO (5V)</text>
  <circle cx="140" cy="320" r="3" fill="#6b7280"/>
  <text x="132" y="313" text-anchor="end" font-size="12" font-weight="bold" fill="#6b7280">GND</text>

  <!-- Індикаторний світлодіод LED1 та резистор R_ind -->
  <circle cx="210" cy="240" r="3.5" fill="#2457d6"/>
  <line x1="210" y1="240" x2="210" y2="248" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="203" y="248" width="14" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="224" y="264" text-anchor="start" font-size="12" fill="#1a1a1a">R<tspan font-size="10" baseline-shift="sub">ind</tspan> 470 Ω</text>
  <line x1="210" y1="272" x2="210" y2="280" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="203,280 217,280 210,292" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="203" y1="292" x2="217" y2="292" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="218" y1="282" x2="226" y2="276" stroke="#27ae60" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <line x1="220" y1="288" x2="228" y2="282" stroke="#27ae60" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <text x="232" y="295" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">LED Стан</text>
  <line x1="210" y1="292" x2="210" y2="320" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="210" cy="320" r="3.5" fill="#6b7280"/>

  <!-- Корпус Твердотільного Реле G3MB-202P -->
  <rect x="310" y="160" width="140" height="230" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="380" y="183" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">G3MB-202P</text>
  <text x="380" y="199" text-anchor="middle" font-size="12" fill="#6b7280">Твердотільне реле</text>

  <!-- Клеми та позначення входу (DC) -->
  <circle cx="310" cy="240" r="4" fill="#2457d6"/>
  <text x="318" y="233" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">3 (+)</text>
  <circle cx="310" cy="320" r="4" fill="#6b7280"/>
  <text x="318" y="313" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">4 (-)</text>

  <!-- Внутрішні елементи входу SSR -->
  <line x1="310" y1="240" x2="335" y2="240" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="335" y="235" width="14" height="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="349" y1="240" x2="358" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="358" y1="240" x2="358" y2="255" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="352,255 364,255 358,265" fill="#2457d6" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="352" y1="265" x2="364" y2="265" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="358" y1="265" x2="358" y2="320" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="358" y1="320" x2="310" y2="320" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Оптична розв'язка (світлові стрілки всередині SSR) -->
  <line x1="363" y1="258" x2="380" y2="258" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="2 2" marker-end="url(#arr-blue)"/>
  <line x1="363" y1="263" x2="380" y2="263" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="2 2" marker-end="url(#arr-blue)"/>

  <!-- Детектор нуля (Zero Cross) -->
  <rect x="382" y="248" width="34" height="28" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="399" y="260" text-anchor="middle" font-size="10" font-weight="bold" fill="#2457d6">Zero</text>
  <text x="399" y="271" text-anchor="middle" font-size="10" font-weight="bold" fill="#2457d6">Cross</text>

  <!-- Симістор всередині SSR -->
  <line x1="450" y1="240" x2="426" y2="240" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="426" y1="240" x2="426" y2="265" stroke="#c0392b" stroke-width="1.5"/>
  <polygon points="420,265 432,265 426,275" fill="#c0392b" stroke="#1a1a1a" stroke-width="1"/>
  <polygon points="420,275 432,275 426,265" fill="#c0392b" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="426" y1="275" x2="426" y2="320" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="426" y1="320" x2="450" y2="320" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Клеми виходу (AC) -->
  <circle cx="450" cy="240" r="4" fill="#c0392b"/>
  <text x="442" y="233" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">1</text>
  <circle cx="450" cy="320" r="4" fill="#c0392b"/>
  <text x="442" y="313" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">2</text>

  <!-- Провідники високовольтної зони (AC 230V) -->
  <!-- Шина L' від SSR Pin 1 do Fuse -->
  <line x1="450" y1="240" x2="770" y2="240" stroke="#c0392b" stroke-width="2"/>
  <!-- Шина L'' від SSR Pin 2 do Load -->
  <line x1="450" y1="320" x2="745" y2="320" stroke="#c0392b" stroke-width="2"/>

  <!-- RC-снабер (паралельно контактам 1 і 2 SSR) -->
  <circle cx="515" cy="240" r="3.5" fill="#c0392b"/>
  <line x1="515" y1="240" x2="515" y2="248" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="508" y="248" width="14" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="515" y1="272" x2="515" y2="280" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="503" y1="280" x2="527" y2="280" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="503" y1="286" x2="527" y2="286" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="515" y1="286" x2="515" y2="320" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="515" cy="320" r="3.5" fill="#c0392b"/>
  <text x="530" y="250" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">RC-снабер</text>
  <text x="530" y="266" text-anchor="start" font-size="12" fill="#1a1a1a">R<tspan font-size="10" baseline-shift="sub">s</tspan> = 47 Ω (2 Вт)</text>
  <text x="530" y="282" text-anchor="start" font-size="12" fill="#1a1a1a">C<tspan font-size="10" baseline-shift="sub">s</tspan> 0.1 µF (275V X2)</text>
  <text x="530" y="298" text-anchor="start" font-size="12" fill="#6b7280">Пригнічення dV/dt</text>

  <!-- Варистор MOV (між Фазою L та Нулем N) -->
  <circle cx="680" cy="240" r="3.5" fill="#c0392b"/>
  <line x1="680" y1="240" x2="680" y2="305" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="672" y="305" width="16" height="30" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 665 342 L 680 337 L 695 303" stroke="#1a1a1a" stroke-width="1.5" fill="none"/>
  <line x1="680" y1="335" x2="680" y2="400" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="680" cy="400" r="3.5" fill="#2457d6"/>
  <text x="695" y="355" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">Варистор MOV</text>
  <text x="695" y="371" text-anchor="start" font-size="12" fill="#1a1a1a">275V AC (10D431K)</text>
  <text x="695" y="386" text-anchor="start" font-size="12" fill="#6b7280">Захист від перенапруги</text>

  <!-- Плавкий запобіжник (Fuse) -->
  <rect x="770" y="233" width="40" height="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="770" y1="240" x2="810" y2="240" stroke="#1a1a1a" stroke-width="1"/>
  <text x="790" y="218" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Плавкий запобіжник</text>
  <text x="790" y="264" text-anchor="middle" font-size="12" fill="#c0392b">Fuse 2 А (Fast)</text>

  <!-- З'єднання після Запобіжника до клеми L -->
  <line x1="810" y1="240" x2="865" y2="240" stroke="#c0392b" stroke-width="2"/>

  <!-- Блок Навантаження (AC Load) -->
  <rect x="745" y="300" width="90" height="40" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="790" y="319" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Навантаження</text>
  <text x="790" y="333" text-anchor="middle" font-size="12" fill="#6b7280">AC Load ≤ 2 A</text>

  <!-- З'єднання з навантаження до шини N -->
  <line x1="835" y1="320" x2="850" y2="320" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="850" y1="320" x2="850" y2="400" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="850" cy="400" r="3.5" fill="#2457d6"/>

  <!-- Лінія Нуля N (Neutral) -->
  <line x1="680" y1="400" x2="865" y2="400" stroke="#2457d6" stroke-width="2"/>

  <!-- Клемник мережі AC 230V -->
  <rect x="865" y="190" width="55" height="230" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="892.5" y="208" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">МЕРЕЖА</text>
  <text x="892.5" y="222" text-anchor="middle" font-size="12" fill="#c0392b">230V AC</text>

  <circle cx="865" cy="240" r="5" fill="#c0392b"/>
  <text x="892.5" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">L</text>
  <text x="892.5" y="272" text-anchor="middle" font-size="12" fill="#6b7280">(Фаза)</text>

  <circle cx="865" cy="400" r="5" fill="#2457d6"/>
  <text x="892.5" y="370" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">N</text>
  <text x="892.5" y="384" text-anchor="middle" font-size="12" fill="#6b7280">(Нуль)</text>
</svg>
