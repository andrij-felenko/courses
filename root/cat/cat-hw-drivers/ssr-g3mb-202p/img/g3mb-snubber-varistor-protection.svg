<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="480" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="36" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Схема захисту реле G3MB-202P з RC-снабером і варистором</text>
  <text x="480" y="58" font-size="13" text-anchor="middle" fill="#6b7280">RC-ланцюг обмежує швидкість наростання dv/dt, а варистор гасить пікові сплески напруги</text>

  <!-- Low Voltage Logic Zone (MCU side) -->
  <rect x="40" y="90" width="260" height="340" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="170" y="118" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a1a">Низьковольтна частина (5 В)</text>

  <!-- MCU Box -->
  <rect x="60" y="140" width="100" height="120" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="110" y="195" font-size="14" font-weight="700" text-anchor="middle" fill="#2457d6">MCU</text>
  <text x="110" y="215" font-size="12" text-anchor="middle" fill="#6b7280">GPIO (5В)</text>

  <!-- Signal Arrow -->
  <line x1="160" y1="180" x2="210" y2="180" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="185" y="170" font-size="12" text-anchor="middle" fill="#2457d6">5V Control</text>

  <!-- Resistor R_in -->
  <rect x="210" y="170" width="40" height="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="230" y="160" font-size="12" text-anchor="middle" fill="#1a1a1a">R_in</text>
  <line x1="250" y1="180" x2="280" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- SSR G3MB-202P Box -->
  <rect x="330" y="90" width="280" height="340" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="470" y="118" font-size="15" font-weight="700" text-anchor="middle" fill="#2457d6">Твердотільне реле G3MB-202P</text>

  <!-- Optocoupler & Triac inside SSR -->
  <!-- LED -->
  <circle x="370" y="180" r="12" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="370" y="184" font-size="12" text-anchor="middle" fill="#2457d6">LED</text>
  <text x="350" y="220" font-size="12" text-anchor="middle" fill="#6b7280">Pin 3 (+)</text>
  <text x="350" y="280" font-size="12" text-anchor="middle" fill="#6b7280">Pin 4 (-)</text>
  <line x1="280" y1="180" x2="358" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
  
  <!-- LED GND connection -->
  <line x1="370" y1="192" x2="370" y2="290" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="370" y1="290" x2="110" y2="290" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="110" y1="290" x2="110" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Optical Isolation Barrier -->
  <line x1="420" y1="130" x2="420" y2="390" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="420" y="410" font-size="12" text-anchor="middle" fill="#6b7280">Опторозв'язка (4 кВ)</text>

  <!-- Zero-Cross & Phototriac -->
  <rect x="445" y="155" width="70" height="50" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="177" font-size="12" text-anchor="middle" fill="#1a1a1a">Zero-Cross</text>
  <text x="480" y="193" font-size="12" text-anchor="middle" fill="#1a1a1a">Detector</text>

  <!-- Main Triac -->
  <polygon points="540,240 560,260 540,280" fill="#2457d6" stroke="#2457d6"/>
  <polygon points="560,240 540,260 560,280" fill="#2457d6" stroke="#2457d6"/>
  <text x="550" y="225" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">Triac</text>
  <text x="585" y="160" font-size="12" text-anchor="middle" fill="#6b7280">Pin 1 (AC)</text>
  <text x="585" y="340" font-size="12" text-anchor="middle" fill="#6b7280">Pin 2 (AC)</text>

  <!-- Internal connections -->
  <line x1="480" y1="205" x2="480" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="480" y1="260" x2="540" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>

  <line x1="550" y1="140" x2="550" y2="240" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="550" y1="280" x2="550" y2="360" stroke="#1a1a1a" stroke-width="2"/>

  <!-- High Voltage Mains & Protection Zone -->
  <rect x="650" y="90" width="270" height="340" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="785" y="118" font-size="14" font-weight="700" text-anchor="middle" fill="#c0392b">Мережеве навантаження (230 В змінного струму)</text>

  <!-- Lines out from SSR to AC Load -->
  <line x1="550" y1="140" x2="680" y2="140" stroke="#c0392b" stroke-width="2"/>
  <line x1="550" y1="360" x2="680" y2="360" stroke="#c0392b" stroke-width="2"/>

  <!-- Load (Motor/Heater) -->
  <rect x="680" y="125" width="80" height="30" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="720" y="145" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">Навантаження</text>

  <line x1="760" y1="140" x2="880" y2="140" stroke="#c0392b" stroke-width="2"/>
  <text x="885" y="145" font-size="12" text-anchor="start" fill="#c0392b">L (230 В)</text>
  <text x="885" y="365" font-size="12" text-anchor="start" fill="#c0392b">N (0 В)</text>

  <!-- Parallel MOV (Varistor) -->
  <line x1="790" y1="140" x2="790" y2="220" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="775" y="220" width="30" height="40" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="770" y1="255" x2="810" y2="225" stroke="#27ae60" stroke-width="1.5"/>
  <text x="790" y="278" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">MOV (275V)</text>
  <line x1="790" y1="260" x2="790" y2="360" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Parallel RC Snubber -->
  <line x1="850" y1="140" x2="850" y2="200" stroke="#c0392b" stroke-width="1.5"/>
  <!-- Resistor R_s -->
  <rect x="835" y="200" width="30" height="30" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="850" y="220" font-size="12" text-anchor="middle" fill="#27ae60">100 Ом</text>
  <line x1="850" y1="230" x2="850" y2="250" stroke="#27ae60" stroke-width="1.5"/>
  <!-- Cap C_s -->
  <line x1="840" y1="250" x2="860" y2="250" stroke="#27ae60" stroke-width="2"/>
  <line x1="840" y1="256" x2="860" y2="256" stroke="#27ae60" stroke-width="2"/>
  <text x="850" y="275" font-size="12" text-anchor="middle" fill="#27ae60">10 нФ</text>
  <text x="850" y="292" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">RC-снабер</text>
  <line x1="850" y1="256" x2="850" y2="360" stroke="#c0392b" stroke-width="1.5"/>

</svg>