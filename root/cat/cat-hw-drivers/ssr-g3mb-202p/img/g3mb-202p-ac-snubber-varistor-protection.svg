<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow markers -->
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="510" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Захист виходу SSR G3MB-202P: RC-снабер та варистор</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Варистор пригнічує пікові сплески напруги, а RC-снабер обмежує швидкість наростання dv/dt</text>

  <!-- PANEL 1: Input Control (MCU) -->
  <rect x="25" y="80" width="150" height="275" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="100" y="102" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вхідне коло</text>
  <text x="100" y="118" font-size="12" fill="#6b7280" text-anchor="middle">(MCU / 5V DC)</text>

  <!-- MCU GPIO Box -->
  <rect x="30" y="133" width="140" height="55" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="100" y="153" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">GPIO (5V DC)</text>
  <text x="100" y="172" font-size="12" fill="#1a1a1a" text-anchor="middle">Вихід мікроконтролера</text>

  <!-- Control Specs Box -->
  <rect x="30" y="200" width="140" height="142" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="100" y="220" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Параметри входу:</text>
  <text x="100" y="240" font-size="12" fill="#6b7280" text-anchor="middle">U_in = 4...6 V DC</text>
  <text x="100" y="260" font-size="12" fill="#6b7280" text-anchor="middle">I_in ≈ 10 mA</text>
  <text x="100" y="280" font-size="12" fill="#6b7280" text-anchor="middle">R_in ≈ 440 Ω</text>
  <line x1="40" y1="298" x2="160" y2="298" stroke="#e5e7eb" stroke-width="1"/>
  <text x="100" y="324" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Гальванорозв'язка</text>

  <!-- Input Wires -->
  <path d="M 175 153 L 208 153" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="195" y="143" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">+5V</text>

  <path d="M 175 173 L 215 173" fill="none" stroke="#6b7280" stroke-width="2"/>
  <text x="195" y="189" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">GND</text>

  <!-- PANEL 2: G3MB-202P SSR Module -->
  <rect x="215" y="80" width="180" height="275" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 215 88 A 8 8 0 0 1 223 80 L 387 80 A 8 8 0 0 1 395 88 L 395 112 L 215 112 Z" fill="#1a1a1a"/>
  <text x="305" y="101" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">SSR G3MB-202P</text>

  <!-- Pin Labels Inside SSR -->
  <text x="223" y="136" font-size="12" font-weight="bold" fill="#2457d6">Pin 4 (+)</text>
  <text x="223" y="193" font-size="12" font-weight="bold" fill="#6b7280">Pin 3 (-)</text>

  <text x="387" y="136" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Pin 2 (AC)</text>
  <text x="387" y="284" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Pin 1 (AC)</text>

  <!-- Internal Optocoupler LED -->
  <line x1="215" y1="153" x2="240" y2="153" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="215" y1="173" x2="240" y2="173" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="240" y1="153" x2="240" y2="173" stroke="#2457d6" stroke-width="1.5"/>
  <polygon points="232,158 248,158 240,170" fill="#2457d6"/>
  <line x1="232" y1="170" x2="248" y2="170" stroke="#2457d6" stroke-width="2"/>

  <!-- Optic Rays -->
  <path d="M 250 160 L 264 160" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M 250 168 L 264 168" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Zero-Cross Detector Box -->
  <rect x="268" y="143" width="52" height="40" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="294" y="158" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Zero</text>
  <text x="294" y="173" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Cross</text>

  <!-- Triac & Gate -->
  <path d="M 320 163 L 334 163 L 334 213 L 342 213" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="348" y1="153" x2="348" y2="267" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="340,201 356,201 348,216" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="340,225 356,225 348,210" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

  <line x1="348" y1="153" x2="395" y2="153" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="348" y1="267" x2="395" y2="267" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Internal SSR Specs -->
  <rect x="225" y="295" width="160" height="48" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="305" y="313" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вбудований симістор</text>
  <text x="305" y="331" font-size="12" fill="#6b7280" text-anchor="middle">2 A RMS / 240 V AC</text>

  <!-- HIGH VOLTAGE OUTPUT & PROTECTION CIRCUIT -->

  <!-- Main Output Rails -->
  <line x1="395" y1="153" x2="733" y2="153" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="395" y1="267" x2="935" y2="267" stroke="#1a1a1a" stroke-width="2"/>

  <!-- BRANCH 1: VARISTOR (MOV) at x=465 -->
  <text x="465" y="118" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Варистор (MOV)</text>
  <text x="465" y="135" font-size="12" fill="#6b7280" text-anchor="middle">470V Clamp / 275VAC</text>

  <line x1="465" y1="153" x2="465" y2="187" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="453" y="187" width="24" height="40" rx="2" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <line x1="445" y1="234" x2="485" y2="180" stroke="#c0392b" stroke-width="2"/>
  <line x1="445" y1="234" x2="445" y2="228" stroke="#c0392b" stroke-width="2"/>
  <line x1="485" y1="180" x2="485" y2="186" stroke="#c0392b" stroke-width="2"/>
  <line x1="465" y1="227" x2="465" y2="267" stroke="#1a1a1a" stroke-width="2"/>

  <!-- MOV Junction Dots -->
  <circle cx="465" cy="153" r="4" fill="#1a1a1a"/>
  <circle cx="465" cy="267" r="4" fill="#1a1a1a"/>

  <!-- MOV Surge Pulse Arrow -->
  <path d="M 465 153 L 465 259" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-red)"/>

  <!-- MOV Action Badge -->
  <rect x="397.5" y="295" width="135" height="65" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="465" y="313" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Захист від сплесків</text>
  <text x="465" y="331" font-size="12" fill="#c0392b" text-anchor="middle">Шунтування U_surge</text>
  <text x="465" y="348" font-size="12" fill="#6b7280" text-anchor="middle">Поглинання енергії L</text>

  <!-- BRANCH 2: RC SNUBBER at x=585 -->
  <text x="585" y="118" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">RC-снабер</text>
  <text x="585" y="135" font-size="12" fill="#6b7280" text-anchor="middle">Демпфування dv/dt</text>

  <line x1="585" y1="153" x2="585" y2="178" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Resistor R_s -->
  <rect x="576" y="178" width="18" height="28" rx="2" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
  <text x="602" y="196" font-size="12" font-weight="bold" fill="#27ae60">R_s = 39...47 Ω</text>

  <line x1="585" y1="206" x2="585" y2="226" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Capacitor C_s -->
  <line x1="573" y1="226" x2="597" y2="226" stroke="#27ae60" stroke-width="2.5"/>
  <line x1="573" y1="234" x2="597" y2="234" stroke="#27ae60" stroke-width="2.5"/>
  <text x="602" y="234" font-size="12" font-weight="bold" fill="#27ae60">C_s = 10 nF / 400V</text>

  <line x1="585" y1="234" x2="585" y2="267" stroke="#1a1a1a" stroke-width="2"/>

  <!-- RC Junction Dots -->
  <circle cx="585" cy="153" r="4" fill="#1a1a1a"/>
  <circle cx="585" cy="267" r="4" fill="#1a1a1a"/>

  <!-- RC Transient dv/dt Current Arrow -->
  <path d="M 585 153 L 585 259" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arr-green)"/>

  <!-- RC Action Badge -->
  <rect x="535" y="295" width="140" height="65" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="605" y="313" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Пригнічення dv/dt</text>
  <text x="605" y="331" font-size="12" fill="#27ae60" text-anchor="middle">Захист від перехідних</text>
  <text x="605" y="348" font-size="12" fill="#6b7280" text-anchor="middle">процесів у мережі</text>

  <!-- AC LOAD BOX at x=733..867 -->
  <rect x="733" y="153" width="134" height="95" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="800" y="173" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Навантаження AC</text>
  <text x="800" y="191" font-size="12" fill="#6b7280" text-anchor="middle">Індуктивне / Резист.</text>
  <text x="800" y="209" font-size="12" fill="#6b7280" text-anchor="middle">(Мотор, соленоїд)</text>
  <text x="800" y="231" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Джерело L · (di/dt)</text>

  <!-- Wire through Load to AC Line -->
  <line x1="867" y1="153" x2="935" y2="153" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="935" cy="153" r="4" fill="#1a1a1a"/>
  <text x="935" y="140" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">L (240V AC)</text>

  <circle cx="935" cy="267" r="4" fill="#1a1a1a"/>
  <text x="935" y="283" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">N (Neutral)</text>

  <!-- BOTTOM SUMMARY PANEL -->
  <rect x="25" y="375" width="910" height="110" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Col 1 -->
  <text x="45" y="398" font-size="13" font-weight="bold" fill="#1a1a1a">1. Чому потрібен захист G3MB-202P?</text>
  <text x="45" y="418" font-size="12" fill="#6b7280">• Симістор розрахований лише на 2 A AC</text>
  <text x="45" y="438" font-size="12" fill="#6b7280">• Критичний поріг dv/dt ≈ 100 V/мкс</text>
  <text x="45" y="458" font-size="12" fill="#6b7280">• Індуктивний викид викличе пробій</text>

  <!-- Col 2 -->
  <text x="340" y="398" font-size="13" font-weight="bold" fill="#27ae60">2. Роль RC-снабера (R_s + C_s)</text>
  <text x="340" y="418" font-size="12" fill="#6b7280">• Обмежує швидкість наростання dv/dt</text>
  <text x="340" y="438" font-size="12" fill="#6b7280">• R_s (39–47 Ω) обмежує струм включення</text>
  <text x="340" y="458" font-size="12" fill="#6b7280">• C_s (10 nF) поглинає високу частоту</text>

  <!-- Col 3 -->
  <text x="640" y="398" font-size="13" font-weight="bold" fill="#c0392b">3. Роль Варистора (MOV 275V)</text>
  <text x="640" y="418" font-size="12" fill="#6b7280">• Зрізає комутаційні піки U &gt; 470V</text>
  <text x="640" y="438" font-size="12" fill="#6b7280">• Шунтує перенапругу мережі 240V AC</text>
  <text x="640" y="458" font-size="12" fill="#6b7280">• Захищає фотосимістор від пробою</text>
</svg>
