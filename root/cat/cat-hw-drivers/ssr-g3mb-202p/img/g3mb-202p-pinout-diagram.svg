<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow marker blue -->
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <!-- Arrow marker grey -->
    <marker id="arr-grey" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Header -->
  <text x="480" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Твердотільне реле G3MB-202P: розпіновка та внутрішня структура</text>
  <text x="480" y="57" text-anchor="middle" font-size="13" fill="#6b7280">Призначення виводів SIP-4, фототиристорна опторозв'язка та застереження щодо струму витікання</text>

  <!-- PANEL A: Package & Pinout -->
  <rect x="40" y="85" width="420" height="385" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="250" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Призначення виводів (корпус SIP-4)</text>

  <!-- Relay Body -->
  <rect x="75" y="135" width="350" height="105" rx="6" fill="#1a1a1a" stroke="#d0d7de" stroke-width="2"/>
  <text x="250" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">OMRON G3MB-202P</text>
  <text x="250" y="180" text-anchor="middle" font-size="12" fill="#eaf0fd">Вхід: 5V DC  |  Вихід: 240V AC 2A</text>
  <text x="250" y="200" text-anchor="middle" font-size="12" fill="#d0d7de">Zero-Cross SSR  (5V DC Control)</text>
  <text x="250" y="222" text-anchor="middle" font-size="12" fill="#27ae60">● Вбудований баластний резистор</text>

  <!-- High Voltage Isolation Gap Marker -->
  <line x1="185" y1="275" x2="315" y2="275" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="250" y="268" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Гальванічний зазор</text>

  <!-- Pins -->
  <!-- Pin 1 -->
  <line x1="110" y1="240" x2="110" y2="305" stroke="#6b7280" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="110" cy="305" r="6" fill="#2457d6"/>
  <text x="110" y="328" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Pin 1</text>
  <text x="110" y="345" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">LOAD ~</text>
  <text x="110" y="362" text-anchor="middle" font-size="12" fill="#6b7280">Вихід AC 1</text>

  <!-- Pin 2 -->
  <line x1="180" y1="240" x2="180" y2="305" stroke="#6b7280" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="180" cy="305" r="6" fill="#2457d6"/>
  <text x="180" y="328" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Pin 2</text>
  <text x="180" y="345" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">LOAD ~</text>
  <text x="180" y="362" text-anchor="middle" font-size="12" fill="#6b7280">Вихід AC 2</text>

  <!-- Pin 3 -->
  <line x1="320" y1="240" x2="320" y2="305" stroke="#6b7280" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="320" cy="305" r="6" fill="#27ae60"/>
  <text x="320" y="328" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Pin 3</text>
  <text x="320" y="345" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">+ INPUT</text>
  <text x="320" y="362" text-anchor="middle" font-size="12" fill="#6b7280">Вхід +5V</text>

  <!-- Pin 4 -->
  <line x1="390" y1="240" x2="390" y2="305" stroke="#6b7280" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="390" cy="305" r="6" fill="#c0392b"/>
  <text x="390" y="328" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Pin 4</text>
  <text x="390" y="345" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">- INPUT</text>
  <text x="390" y="362" text-anchor="middle" font-size="12" fill="#6b7280">Вхід GND</text>

  <!-- Panel A Summary Card -->
  <rect x="55" y="385" width="390" height="70" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="250" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Ключові специфікації виводів:</text>
  <text x="250" y="424" text-anchor="middle" font-size="12" fill="#1a1a1a">● Силове коло (1-2): 100–240V AC, струм 0.1–2 A</text>
  <text x="250" y="443" text-anchor="middle" font-size="12" fill="#1a1a1a">● Коло керування (3-4): 4–6V DC (ном. 5V, 1.5–5 mA)</text>

  <!-- PANEL B: Internal Circuit -->
  <rect x="485" y="85" width="435" height="385" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="702" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Принципова схема внутрішніх вузлів</text>
  <text x="702" y="131" text-anchor="middle" font-size="12" fill="#6b7280">Оптоізольоване управління з детектором Zero-Cross</text>

  <!-- Panel B Schematic Lines & Components -->
  <!-- Pin 3 Input Terminal & Wire -->
  <circle cx="520" cy="175" r="5" fill="#27ae60"/>
  <text x="520" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">+5V (Pin 3)</text>
  <line x1="525" y1="175" x2="550" y2="175" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Input Resistor R_in -->
  <rect x="550" y="167" width="30" height="16" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="565" y="160" text-anchor="middle" font-size="12" fill="#1a1a1a">R_in (440 Ω)</text>
  <line x1="580" y1="175" x2="610" y2="175" stroke="#1a1a1a" stroke-width="2"/>

  <!-- LED Photodiode Symbol -->
  <line x1="610" y1="175" x2="610" y2="205" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Triangle pointing down -->
  <polygon points="598,205 622,205 610,225" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
  <!-- Cathode Bar -->
  <line x1="598" y1="225" x2="622" y2="225" stroke="#2457d6" stroke-width="2"/>
  <line x1="610" y1="225" x2="610" y2="275" stroke="#1a1a1a" stroke-width="2"/>
  <text x="610" y="160" text-anchor="middle" font-size="12" fill="#2457d6">LED</text>

  <!-- Pin 4 Wire & Terminal -->
  <line x1="525" y1="275" x2="610" y2="275" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="520" cy="275" r="5" fill="#c0392b"/>
  <text x="520" y="263" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">GND (Pin 4)</text>

  <!-- Optical Light Rays (Arrows) -->
  <line x1="624" y1="210" x2="646" y2="220" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="624" y1="222" x2="646" y2="232" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Isolation Barrier (Dashed Line) -->
  <line x1="655" y1="150" x2="655" y2="300" stroke="#6b7280" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="655" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">Оптоізоляція</text>

  <!-- Zero-Cross Circuit Box -->
  <rect x="680" y="175" width="95" height="100" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="727" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Схема</text>
  <text x="727" y="216" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Zero-Cross</text>
  <text x="727" y="234" text-anchor="middle" font-size="12" fill="#6b7280">та фототригер</text>
  <text x="727" y="252" text-anchor="middle" font-size="12" fill="#1a1a1a">V_AC ≈ 0 V</text>

  <!-- Gate Control Line to Main Triac -->
  <line x1="775" y1="225" x2="818" y2="225" stroke="#2457d6" stroke-width="2"/>
  <text x="796" y="215" text-anchor="middle" font-size="12" fill="#2457d6">Керування</text>

  <!-- Power Triac Symbol -->
  <line x1="830" y1="175" x2="830" y2="275" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Triangle 1 down -->
  <polygon points="818,205 842,205 830,225" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Triangle 2 up -->
  <polygon points="818,245 842,245 830,225" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="830" y="145" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Симістор</text>

  <!-- Output Pin 1 Wire & Terminal -->
  <line x1="830" y1="175" x2="875" y2="175" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="880" cy="175" r="5" fill="#2457d6"/>
  <text x="880" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">LOAD (Pin 1)</text>

  <!-- Output Pin 2 Wire & Terminal -->
  <line x1="830" y1="275" x2="875" y2="275" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="880" cy="275" r="5" fill="#2457d6"/>
  <text x="880" y="295" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">LOAD (Pin 2)</text>

  <!-- Panel B Notes Card 1: Zero-Cross -->
  <rect x="498" y="315" width="408" height="62" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="702" y="333" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Режим Zero-Cross (перехід через нуль):</text>
  <text x="702" y="350" text-anchor="middle" font-size="12" fill="#1a1a1a">Вмикає навантаження лише при напрузі AC близькій до 0 V,</text>
  <text x="702" y="366" text-anchor="middle" font-size="12" fill="#1a1a1a">що мінімізує імпульсні завади та кидки струму.</text>

  <!-- Panel B Notes Card 2: Leakage Current -->
  <rect x="498" y="385" width="408" height="70" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="702" y="403" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">УВАГА: Струм витікання (Leakage Current ≤ 1.5 mA):</text>
  <text x="702" y="421" text-anchor="middle" font-size="12" fill="#1a1a1a">У вимкненому стані через симістор протікає струм витікання,</text>
  <text x="702" y="439" text-anchor="middle" font-size="12" fill="#1a1a1a">через що малопотужні LED-лампи можуть підмигувати.</text>
</svg>
