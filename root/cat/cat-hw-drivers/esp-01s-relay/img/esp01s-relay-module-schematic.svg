<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>

  <!-- Markers -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-power" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-ok" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принципова схема плати розширення реле для ESP-01S</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Логіка керування через GPIO0, LDO-стабілізація 3.3 В та комутація навантаження</text>

  <!-- ==================== PANEL 1: POWER & LDO ==================== -->
  <rect x="20" y="75" width="230" height="425" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="135" y="91" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вхід 5 В та LDO 3.3 В</text>

  <!-- +5V Rail to Relay Coil -->
  <line x1="95" y1="107" x2="250" y2="107" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-power)"/>
  <text x="165" y="104" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+5V до котушки реле</text>

  <!-- Terminal Block 5V/GND -->
  <text x="53" y="121" font-size="12" fill="#6b7280" text-anchor="middle">Вхід VCC</text>
  <rect x="30" y="126" width="46" height="60" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="45" cy="146" r="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="45" cy="171" r="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="53" y="140" font-size="11" font-weight="bold" fill="#c0392b">+5V</text>
  <text x="53" y="165" font-size="11" font-weight="bold" fill="#1a1a1a">GND</text>

  <!-- Wires from Terminal Block -->
  <line x1="45" y1="146" x2="95" y2="146" stroke="#c0392b" stroke-width="2"/>
  <line x1="95" y1="146" x2="95" y2="107" stroke="#c0392b" stroke-width="2"/>
  <circle cx="95" cy="146" r="3" fill="#c0392b"/>

  <!-- Wire +5V to LDO VIN -->
  <line x1="95" y1="146" x2="140" y2="146" stroke="#c0392b" stroke-width="2"/>

  <!-- Capacitor C1 (Input filter) -->
  <circle cx="95" cy="146" r="3" fill="#c0392b"/>
  <line x1="95" y1="146" x2="95" y2="166" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="88" y1="166" x2="102" y2="166" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="88" y1="172" x2="102" y2="172" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="95" y1="172" x2="95" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="105" y="164" font-size="12" font-weight="bold" fill="#1a1a1a">C1</text>
  <text x="105" y="178" font-size="12" fill="#6b7280">10 µF</text>

  <!-- LDO AMS1117-3.3 -->
  <rect x="140" y="128" width="60" height="60" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="170" y="156" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">AMS1117</text>
  <text x="170" y="171" font-size="12" fill="#2457d6" text-anchor="middle">3.3V LDO</text>

  <!-- Pin labels LDO -->
  <text x="144" y="141" font-size="11" fill="#6b7280">VIN</text>
  <text x="196" y="141" font-size="11" fill="#6b7280" text-anchor="end">VOUT</text>
  <text x="170" y="184" font-size="11" fill="#6b7280" text-anchor="middle">GND</text>

  <!-- LDO GND connection -->
  <line x1="170" y1="188" x2="170" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- 3.3V Wire from LDO VOUT -->
  <line x1="200" y1="146" x2="250" y2="146" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <text x="203" y="139" font-size="12" font-weight="bold" fill="#2457d6">3.3V</text>

  <!-- Capacitor C2 (Output filter) -->
  <circle cx="210" cy="146" r="3" fill="#2457d6"/>
  <line x1="210" y1="146" x2="210" y2="166" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="203" y1="166" x2="217" y2="166" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="203" y1="172" x2="217" y2="172" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="210" y1="172" x2="210" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="204" y="204" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">C2</text>
  <text x="204" y="218" font-size="12" fill="#6b7280" text-anchor="end">10 µF</text>

  <!-- GND Bus in Panel 1 -->
  <line x1="45" y1="171" x2="45" y2="260" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="45" y1="260" x2="250" y2="260" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="45" cy="260" r="3" fill="#1a1a1a"/>
  <circle cx="95" cy="260" r="3" fill="#1a1a1a"/>
  <circle cx="170" cy="260" r="3" fill="#1a1a1a"/>
  <circle cx="210" cy="260" r="3" fill="#1a1a1a"/>

  <!-- Panel 1 Explanatory Card -->
  <rect x="30" y="285" width="200" height="195" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="130" y="306" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принцип живлення:</text>
  <text x="38" y="328" font-size="12" fill="#1a1a1a">• 5V вхід живить котушку</text>
  <text x="38" y="346" font-size="12" fill="#1a1a1a">  реле та стабілізатор LDO.</text>
  <text x="38" y="370" font-size="12" fill="#2457d6">• LDO дає чисті 3.3V</text>
  <text x="38" y="388" font-size="12" fill="#2457d6">  для модуля ESP-01S.</text>
  <text x="38" y="412" font-size="12" fill="#6b7280">• Конденсатори C1, C2</text>
  <text x="38" y="430" font-size="12" fill="#6b7280">  гасять пульсації Wi-Fi</text>
  <text x="38" y="448" font-size="12" fill="#6b7280">  під час сплесків струму.</text>


  <!-- ==================== PANEL 2: ESP-01S SOCKET ==================== -->
  <rect x="265" y="75" width="230" height="425" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="380" y="94" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Модуль ESP-01S (Роз'єм 2×4)</text>

  <!-- ESP-01S Socket Box -->
  <rect x="290" y="115" width="180" height="150" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="380" y="133" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Роз'єм J1 (ESP-01S)</text>

  <!-- Pins Matrix (2 columns x 4 rows) -->
  <!-- Column 1 (Left): 3V3, RST, EN, TXD -->
  <circle cx="315" cy="160" r="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="325" y="164" font-size="12" font-weight="bold" fill="#2457d6">1: 3V3</text>

  <circle cx="315" cy="185" r="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="325" y="189" font-size="12" fill="#1a1a1a">2: RST</text>

  <circle cx="315" cy="210" r="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="325" y="214" font-size="12" fill="#1a1a1a">3: EN</text>

  <circle cx="315" cy="235" r="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="325" y="239" font-size="12" fill="#6b7280">4: TXD</text>

  <!-- Column 2 (Right): GND, GPIO2, GPIO0, RXD -->
  <circle cx="445" cy="160" r="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="435" y="164" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">GND :8</text>

  <circle cx="445" cy="185" r="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="435" y="189" font-size="12" fill="#1a1a1a" text-anchor="end">GPIO2 :7</text>

  <circle cx="445" cy="210" r="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="435" y="214" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">GPIO0 :6</text>

  <circle cx="445" cy="235" r="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="435" y="239" font-size="12" fill="#6b7280" text-anchor="end">RXD :5</text>

  <!-- Wires connecting to Panel 2 -->
  <!-- 3.3V input into Pin 1 -->
  <line x1="250" y1="146" x2="275" y2="146" stroke="#2457d6" stroke-width="2"/>
  <line x1="275" y1="146" x2="275" y2="160" stroke="#2457d6" stroke-width="2"/>
  <line x1="275" y1="160" x2="310" y2="160" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>

  <!-- GND wire from Pin 8 (GND) down to GND bus -->
  <line x1="445" y1="160" x2="480" y2="160" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="480" y1="160" x2="480" y2="260" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="250" y1="260" x2="510" y2="260" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="480" cy="260" r="3" fill="#1a1a1a"/>

  <!-- GPIO0 Control Output line exiting Panel 2 -->
  <line x1="445" y1="210" x2="510" y2="210" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-accent)"/>

  <!-- Panel 2 Explanatory Card -->
  <rect x="280" y="285" width="200" height="195" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="380" y="306" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Завантаження ESP8266:</text>
  <text x="288" y="328" font-size="12" fill="#1a1a1a">• EN, RST і GPIO2 мають</text>
  <text x="288" y="346" font-size="12" fill="#1a1a1a">  підтяжку до 3.3 В.</text>
  <text x="288" y="370" font-size="12" fill="#2457d6">• GPIO0 керує ключем.</text>
  <text x="288" y="394" font-size="12" fill="#c0392b">• При старті GPIO0 = HIGH</text>
  <text x="288" y="412" font-size="12" fill="#c0392b">  для завантаження з Flash.</text>


  <!-- ==================== PANEL 3: TRANSISTOR SWITCH & DIODE ==================== -->
  <rect x="510" y="75" width="230" height="425" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="625" y="94" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Транзисторний ключ Q1 та D1</text>

  <!-- Control Line label inside Panel 3 -->
  <text x="512" y="200" font-size="11" font-weight="bold" fill="#2457d6">GPIO0</text>

  <!-- Base Resistor R1 -->
  <line x1="510" y1="210" x2="550" y2="210" stroke="#2457d6" stroke-width="2"/>
  <rect x="550" y="202" width="30" height="16" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="565" y="195" font-size="12" fill="#1a1a1a" text-anchor="middle">R1 1k</text>
  <line x1="580" y1="210" x2="615" y2="210" stroke="#2457d6" stroke-width="2"/>

  <!-- Pull-down Resistor R2 -->
  <line x1="580" y1="210" x2="580" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="572" y="225" width="16" height="26" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="566" y="242" font-size="12" fill="#6b7280" text-anchor="end">R2 10k</text>
  <line x1="580" y1="251" x2="580" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="580" cy="210" r="3" fill="#2457d6"/>
  <circle cx="580" cy="260" r="3" fill="#1a1a1a"/>

  <!-- NPN Transistor Q1 Symbol -->
  <line x1="615" y1="198" x2="615" y2="222" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="615" y1="203" x2="633" y2="187" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="633" y1="187" x2="633" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="615" y1="217" x2="633" y2="233" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="633" y1="233" x2="633" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="630,226 635,235 625,233" fill="#1a1a1a"/>
  <circle cx="625" cy="210" r="18" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

  <text x="625" y="166" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Q1 (NPN S8050)</text>

  <!-- Flyback Diode D1 -->
  <line x1="250" y1="107" x2="755" y2="107" stroke="#c0392b" stroke-width="2"/>
  <circle cx="675" cy="107" r="3" fill="#c0392b"/>

  <line x1="675" y1="107" x2="675" y2="125" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="667" y1="125" x2="683" y2="125" stroke="#c0392b" stroke-width="2"/>
  <polygon points="675,125 667,140 683,140" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="675" y1="140" x2="675" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>

  <text x="687" y="132" font-size="12" font-weight="bold" fill="#c0392b">D1</text>
  <text x="687" y="146" font-size="12" fill="#c0392b">1N4148</text>
  <text x="687" y="160" font-size="12" fill="#6b7280">(Захист)</text>

  <line x1="633" y1="175" x2="675" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="675" cy="175" r="3" fill="#1a1a1a"/>
  <line x1="675" y1="175" x2="755" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>

  <line x1="510" y1="260" x2="755" y2="260" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="633" cy="260" r="3" fill="#1a1a1a"/>

  <!-- Panel 3 Explanatory Card -->
  <rect x="525" y="285" width="200" height="195" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="625" y="306" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Робота ключа Q1 та D1:</text>
  <text x="533" y="328" font-size="12" fill="#2457d6">• GPIO0 = HIGH (3.3V):</text>
  <text x="533" y="346" font-size="12" fill="#1a1a1a">  струм бази I_B відкриває</text>
  <text x="533" y="364" font-size="12" fill="#1a1a1a">  транзистор Q1.</text>
  <text x="533" y="388" font-size="12" fill="#27ae60">• Струм 5V тече через котушку</text>
  <text x="533" y="406" font-size="12" fill="#27ae60">  на земляну шину GND.</text>
  <text x="533" y="430" font-size="12" fill="#c0392b">• Діод D1 шунтує сплеск</text>
  <text x="533" y="448" font-size="12" fill="#c0392b">  ЕРС при вимкненні реле.</text>


  <!-- ==================== PANEL 4: RELAY & TERMINALS ==================== -->
  <rect x="755" y="75" width="185" height="425" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="847.5" y="94" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Реле 5 В та клеми J2</text>

  <!-- Relay Coil K1 Symbol -->
  <text x="816" y="140" font-size="12" font-weight="bold" fill="#1a1a1a">Котушка 5V</text>
  <rect x="780" y="114" width="30" height="61" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="780" y1="114" x2="810" y2="175" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Coil Wire connections -->
  <line x1="755" y1="107" x2="795" y2="107" stroke="#c0392b" stroke-width="2"/>
  <line x1="795" y1="107" x2="795" y2="114" stroke="#c0392b" stroke-width="2"/>
  <line x1="755" y1="175" x2="780" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Relay Mechanical Switch Contacts -->
  <g stroke="#1a1a1a" stroke-width="1.5">
    <line x1="780" y1="235.5" x2="870" y2="235.5" stroke="#2457d6"/>
    <line x1="780" y1="235.5" x2="823" y2="220" stroke-dasharray="3,2"/>
    <circle cx="825" cy="217" r="3" fill="#27ae60"/>
    <circle cx="825" cy="254" r="3" fill="#1a1a1a"/>
  </g>

  <text x="805" y="200" font-size="12" fill="#6b7280" text-anchor="middle">Контакти</text>

  <!-- Output Screw Terminal Block J2 -->
  <rect x="855" y="198" width="75" height="75" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Terminal Circles & Labels -->
  <circle cx="870" cy="212" r="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="825" y1="217" x2="870" y2="212" stroke="#27ae60" stroke-width="1.5"/>
  <text x="881" y="216" font-size="12" font-weight="bold" fill="#27ae60">NO</text>

  <circle cx="870" cy="235.5" r="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="881" y="239.5" font-size="12" font-weight="bold" fill="#2457d6">COM</text>

  <circle cx="870" cy="259" r="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="825" y1="254" x2="870" y2="259" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="881" y="263" font-size="12" font-weight="bold" fill="#1a1a1a">NC</text>

  <text x="892.5" y="288" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Клеми J2</text>

  <!-- Panel 4 Explanatory Card -->
  <rect x="765" y="305" width="165" height="175" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="847.5" y="324" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Гальванічна</text>
  <text x="847.5" y="340" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ізоляція:</text>
  <text x="772" y="362" font-size="12" fill="#1a1a1a">• COM: Спільний</text>
  <text x="772" y="380" font-size="12" fill="#27ae60">• NO: Норм. розімкн.</text>
  <text x="772" y="398" font-size="12" fill="#1a1a1a">• NC: Норм. замкн.</text>
  <text x="772" y="420" font-size="12" fill="#2457d6">• Комутація 250V</text>
  <text x="772" y="438" font-size="12" fill="#2457d6">  AC / 30V DC 10A.</text>
  <text x="772" y="460" font-size="12" fill="#27ae60">• Повна ізоляція.</text>

</svg>
