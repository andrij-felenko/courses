<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема підтяжки GPIO0 та транзисторного ключа Active-LOW</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Підтяжка R1 забезпечує високий рівень для завантаження з SPI Flash та утримує реле вимкненим</text>

  <!-- ==================== ПАНЕЛЬ 1: РЕЖИМ ЗАВАНТАЖЕННЯ ==================== -->
  <rect x="25" y="80" width="445" height="415" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  
  <!-- Заголовок панелі 1 -->
  <rect x="35" y="90" width="425" height="36" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="247.5" y="113" font-size="14" font-weight="bold" fill="#1e7e34" text-anchor="middle">1. Стан завантаження МК (Boot Mode)</text>

  <!-- Лінії живлення +3.3V та +5V (Панель 1) -->
  <line x1="170" y1="145" x2="214" y2="145" stroke="#2457d6" stroke-width="2"/>
  <text x="192" y="137" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">+3.3V (VCC)</text>
  
  <line x1="300" y1="145" x2="340" y2="145" stroke="#c0392b" stroke-width="2"/>
  <text x="320" y="137" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+5V (VCC_RELAY)</text>

  <!-- Резистор підтяжки R1 (Панель 1) -->
  <line x1="192" y1="145" x2="192" y2="165" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="182" y="165" width="20" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="208" y="180" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">R1</text>
  <text x="208" y="196" font-size="12" fill="#6b7280" text-anchor="start">10 kΩ</text>
  <line x1="192" y1="205" x2="192" y2="270" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Модуль ESP-01S (Панель 1) -->
  <rect x="45" y="210" width="80" height="105" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="85" y="235" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ESP-01S</text>
  <text x="85" y="253" font-size="12" fill="#6b7280" text-anchor="middle">(ESP8266)</text>
  <text x="115" y="274" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">GPIO0</text>
  <circle cx="125" cy="270" r="4" fill="#2457d6"/>

  <!-- Провід GPIO0 та вузол A (Панель 1) -->
  <line x1="125" y1="270" x2="192" y2="270" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="192" cy="270" r="3.5" fill="#1a1a1a"/>

  <!-- Плашка стану GPIO0 (Панель 1) -->
  <line x1="192" y1="270" x2="192" y2="305" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3"/>
  <rect x="135" y="305" width="114" height="46" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="192" y="323" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">3.3V (HIGH)</text>
  <text x="192" y="341" font-size="12" fill="#1a1a1a" text-anchor="middle">SPI Flash Boot</text>

  <!-- Базовий резистор R2 (Панель 1) -->
  <line x1="192" y1="270" x2="240" y2="270" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="240" y="261" width="36" height="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="258" y="253" font-size="12" fill="#6b7280" text-anchor="middle">R2 1k</text>
  <line x1="276" y1="270" x2="295" y2="270" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Транзистор Q1 PNP (Панель 1) -->
  <line x1="295" y1="255" x2="295" y2="285" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="295" y1="260" x2="320" y2="235" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="300,264 295,260 304,256" fill="#1a1a1a"/>
  <line x1="320" y1="235" x2="320" y2="145" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="295" y1="280" x2="320" y2="305" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="332" y="225" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Q1 (PNP)</text>

  <!-- Плашка стану транзистора Q1 (Панель 1) -->
  <rect x="332" y="260" width="84" height="26" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="374" y="277" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">ЗАКРИТИЙ</text>

  <!-- Котушка реле K1, діод D1, GND (Панель 1) -->
  <line x1="320" y1="305" x2="320" y2="355" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="320" cy="355" r="3" fill="#1a1a1a"/>
  <line x1="320" y1="355" x2="320" y2="365" stroke="#1a1a1a" stroke-width="1.5"/>

  <rect x="305" y="365" width="30" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="305" y1="365" x2="335" y2="405" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="297" y="382" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">K1</text>
  <text x="297" y="396" font-size="12" fill="#6b7280" text-anchor="end">5V</text>

  <!-- Діод D1 (Панель 1) -->
  <line x1="320" y1="355" x2="355" y2="355" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="355" y1="355" x2="355" y2="405" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="347" y1="373" x2="363" y2="373" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="355,373 347,388 363,388" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="368" y="385" font-size="12" fill="#6b7280" text-anchor="start">D1</text>

  <!-- GND (Панель 1) -->
  <line x1="320" y1="405" x2="320" y2="420" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="355" y1="405" x2="355" y2="420" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="355" y1="420" x2="320" y2="420" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="310" y1="420" x2="330" y2="420" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="314" y1="424" x2="326" y2="424" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="318" y1="428" x2="322" y2="428" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="320" y="440" font-size="12" fill="#6b7280" text-anchor="middle">GND</text>

  <!-- Контакти реле (Панель 1) -->
  <rect x="385" y="340" width="75" height="75" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="4"/>
  <circle cx="400" cy="377" r="3" fill="#1a1a1a"/>
  <circle cx="445" cy="357" r="3" fill="#1a1a1a"/>
  <circle cx="445" cy="397" r="3" fill="#1a1a1a"/>
  <line x1="400" y1="377" x2="442" y2="359" stroke="#1a1a1a" stroke-width="2"/>
  <text x="400" y="401" font-size="12" fill="#6b7280" text-anchor="middle">COM</text>
  <text x="445" y="351" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">NC</text>
  <text x="445" y="411" font-size="12" fill="#6b7280" text-anchor="middle">NO</text>

  <!-- Підсумкова плашка (Панель 1) -->
  <rect x="35" y="448" width="425" height="36" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="247.5" y="471" font-size="13" font-weight="bold" fill="#1e7e34" text-anchor="middle">РЕЗУЛЬТАТ: Реле ВИМКНЕНЕ (котушка знеструмлена)</text>


  <!-- ==================== ПАНЕЛЬ 2: РОБОЧИЙ РЕЖИМ ==================== -->
  <rect x="490" y="80" width="445" height="415" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  
  <!-- Заголовок панелі 2 -->
  <rect x="500" y="90" width="425" height="36" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="712.5" y="113" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">2. Робочий режим керування (Work Mode)</text>

  <!-- Лінії живлення +3.3V та +5V (Панель 2) -->
  <line x1="635" y1="145" x2="679" y2="145" stroke="#2457d6" stroke-width="2"/>
  <text x="657" y="137" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">+3.3V (VCC)</text>
  
  <line x1="765" y1="145" x2="805" y2="145" stroke="#c0392b" stroke-width="2"/>
  <text x="785" y="137" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+5V (VCC_RELAY)</text>

  <!-- Резистор підтяжки R1 (Панель 2) -->
  <line x1="657" y1="145" x2="657" y2="165" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="647" y="165" width="20" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="673" y="180" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">R1</text>
  <text x="673" y="196" font-size="12" fill="#6b7280" text-anchor="start">10 kΩ</text>
  <line x1="657" y1="205" x2="657" y2="270" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Модуль ESP-01S (Панель 2) -->
  <rect x="510" y="210" width="80" height="105" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="550" y="235" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ESP-01S</text>
  <text x="550" y="253" font-size="12" fill="#6b7280" text-anchor="middle">(ESP8266)</text>
  <text x="580" y="274" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">GPIO0</text>
  <circle cx="590" cy="270" r="4" fill="#2457d6"/>

  <!-- Провід GPIO0 та вузол A (Панель 2) -->
  <line x1="590" y1="270" x2="657" y2="270" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="657" cy="270" r="3.5" fill="#2457d6"/>

  <!-- Плашка стану GPIO0 (Панель 2) -->
  <line x1="657" y1="270" x2="657" y2="305" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <rect x="600" y="305" width="114" height="46" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="657" y="323" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">0V (LOW)</text>
  <text x="657" y="341" font-size="12" fill="#1a1a1a" text-anchor="middle">Сигнал УВІМК</text>

  <!-- Базовий резистор R2 та струм бази (Панель 2) -->
  <line x1="657" y1="270" x2="705" y2="270" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="705" y="261" width="36" height="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="723" y="253" font-size="12" fill="#6b7280" text-anchor="middle">R2 1k</text>
  <line x1="741" y1="270" x2="760" y2="270" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Транзистор Q1 PNP (Панель 2) -->
  <line x1="760" y1="255" x2="760" y2="285" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="760" y1="260" x2="785" y2="235" stroke="#2457d6" stroke-width="2"/>
  <polygon points="765,264 760,260 769,256" fill="#2457d6"/>
  <line x1="785" y1="145" x2="785" y2="235" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="760" y1="280" x2="785" y2="305" stroke="#2457d6" stroke-width="2"/>
  <text x="797" y="225" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Q1 (PNP)</text>

  <!-- Плашка стану транзистора Q1 (Панель 2) -->
  <rect x="797" y="260" width="84" height="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="839" y="277" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ВІДКРИТИЙ</text>

  <!-- Струм через котушку реле K1, діод D1, GND (Панель 2) -->
  <line x1="785" y1="305" x2="785" y2="355" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <circle cx="785" cy="355" r="3.5" fill="#2457d6"/>
  <line x1="785" y1="355" x2="785" y2="365" stroke="#2457d6" stroke-width="2"/>

  <rect x="770" y="365" width="30" height="40" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <line x1="770" y1="365" x2="800" y2="405" stroke="#2457d6" stroke-width="2"/>
  <text x="762" y="382" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">K1</text>
  <text x="762" y="396" font-size="12" fill="#6b7280" text-anchor="end">5V</text>

  <!-- Діод D1 (Панель 2) -->
  <line x1="785" y1="355" x2="820" y2="355" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="820" y1="355" x2="820" y2="405" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="812" y1="373" x2="828" y2="373" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="820,373 812,388 828,388" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="833" y="385" font-size="12" fill="#6b7280" text-anchor="start">D1</text>

  <!-- GND (Панель 2) -->
  <line x1="785" y1="405" x2="785" y2="420" stroke="#2457d6" stroke-width="2"/>
  <line x1="820" y1="405" x2="820" y2="420" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="820" y1="420" x2="785" y2="420" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="775" y1="420" x2="795" y2="420" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="779" y1="424" x2="791" y2="424" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="783" y1="428" x2="787" y2="428" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="785" y="440" font-size="12" fill="#6b7280" text-anchor="middle">GND</text>

  <!-- Контакти реле увімкнені (Панель 2) -->
  <rect x="850" y="340" width="75" height="75" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <circle cx="865" cy="377" r="3" fill="#1a1a1a"/>
  <circle cx="910" cy="357" r="3" fill="#1a1a1a"/>
  <circle cx="910" cy="397" r="3" fill="#2457d6"/>
  <line x1="865" y1="377" x2="907" y2="395" stroke="#2457d6" stroke-width="2"/>
  <text x="865" y="401" font-size="12" fill="#6b7280" text-anchor="middle">COM</text>
  <text x="910" y="351" font-size="12" fill="#6b7280" text-anchor="middle">NC</text>
  <text x="910" y="411" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">NO</text>

  <!-- Підсумкова плашка (Панель 2) -->
  <rect x="500" y="448" width="425" height="36" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="712.5" y="471" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">РЕЗУЛЬТАТ: Реле УВІМКНЕНЕ (струм тече через котушку)</text>
</svg>
