<svg viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часові діаграми ініціалізації GPIO0 та станів силового реле ESP-01S</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Попереднє встановлення HIGH перед pinMode(OUTPUT) запобігає хибному увімкненню реле з активним низьким рівнем</text>

  <!-- ==================== ВАРІАНТ 1 (ПРОБЛЕМА) ==================== -->
  <rect x="30" y="70" width="900" height="205" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="45" y="90" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="start">ВАРІАНТ 1. Пряма ініціалізація: pinMode(OUTPUT) → digitalWrite(HIGH) [ПОМИЛКА]</text>

  <!-- Вертикальні сітки часу в Панелі 1 -->
  <line x1="320" y1="114" x2="320" y2="242" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="520" y1="114" x2="520" y2="242" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="660" y1="114" x2="660" y2="242" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Позначки часу вгорі Панелі 1 -->
  <text x="320" y="108" font-size="12" fill="#6b7280" text-anchor="middle">t₀ (Power ON)</text>
  <text x="520" y="108" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">pinMode(OUTPUT)</text>
  <text x="660" y="108" font-size="12" fill="#2457d6" text-anchor="middle">digitalWrite(HIGH)</text>

  <!-- Підписи сигналів ліворуч -->
  <text x="45" y="145" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">GPIO0 (вивід)</text>
  <text x="45" y="160" font-size="12" fill="#6b7280" text-anchor="start">(вхід / вихід)</text>

  <text x="45" y="218" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Стан реле</text>
  <text x="45" y="233" font-size="12" fill="#6b7280" text-anchor="start">(активний LOW)</text>

  <!-- Діаграма сигналу GPIO0 (Панель 1) -->
  <!-- Живлення вимкнено (до t0): 0V (пунктир) -->
  <line x1="200" y1="168" x2="320" y2="168" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- Фронт подачі живлення t0 -->
  <line x1="320" y1="168" x2="320" y2="138" stroke="#2457d6" stroke-width="2"/>
  <!-- Стадія Bootloader: HIGH через pull-up (t0 -> t1) -->
  <line x1="320" y1="138" x2="520" y2="138" stroke="#2457d6" stroke-width="2"/>
  <!-- Спад при pinMode(OUTPUT) t1 -->
  <line x1="520" y1="138" x2="520" y2="168" stroke="#c0392b" stroke-width="2"/>
  <!-- Глітч LOW (t1 -> t2) -->
  <line x1="520" y1="168" x2="660" y2="168" stroke="#c0392b" stroke-width="2.5"/>
  <!-- Фронт при digitalWrite(HIGH) t2 -->
  <line x1="660" y1="168" x2="660" y2="138" stroke="#2457d6" stroke-width="2"/>
  <!-- Нормальна робота HIGH (після t2) -->
  <line x1="660" y1="138" x2="880" y2="138" stroke="#2457d6" stroke-width="2"/>

  <!-- Анотації сигналу GPIO0 -->
  <text x="420" y="128" font-size="12" fill="#2457d6" text-anchor="middle">Підтяжка 10k (HIGH)</text>
  <text x="590" y="182" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">0V (LOW)</text>

  <!-- Зона глітчу реле (Підсвічений червоний прямокутник) -->
  <rect x="520" y="198" width="140" height="48" fill="#c0392b" fill-opacity="0.15" stroke="#c0392b" stroke-dasharray="3,3"/>

  <!-- Діаграма стану реле (Панель 1) -->
  <!-- Вимкнено до t1 (HIGH на ключі) -->
  <line x1="200" y1="210" x2="520" y2="210" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Увімкнення силового ключа на t1 -->
  <line x1="520" y1="210" x2="520" y2="240" stroke="#c0392b" stroke-width="2"/>
  <!-- Спрацьовано/Замкнено під час глітчу (t1 -> t2) -->
  <line x1="520" y1="240" x2="660" y2="240" stroke="#c0392b" stroke-width="2.5"/>
  <!-- Розмикання на t2 -->
  <line x1="660" y1="240" x2="660" y2="210" stroke="#c0392b" stroke-width="2"/>
  <!-- Вимкнено після t2 -->
  <line x1="660" y1="210" x2="880" y2="210" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Анотації стану реле (Панель 1) -->
  <text x="420" y="202" font-size="12" fill="#6b7280" text-anchor="middle">Вимкнено</text>
  <text x="770" y="202" font-size="12" fill="#6b7280" text-anchor="middle">Вимкнено</text>
  <text x="590" y="225" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">ХИБНЕ СПРАЦЬОВУВАННЯ</text>
  <text x="590" y="258" font-size="12" fill="#c0392b" text-anchor="middle">Короткочасне увімкнення реле (Δt ≈ 1-50 ms)</text>

  <!-- ==================== ВАРІАНТ 2 (РОЗВ'ЯЗОК) ==================== -->
  <rect x="30" y="290" width="900" height="205" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="45" y="310" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="start">ВАРІАНТ 2. Попереднє встановлення HIGH: digitalWrite(HIGH) → pinMode(OUTPUT) [ПРАВИЛЬНО]</text>

  <!-- Вертикальні сітки часу в Панелі 2 -->
  <line x1="320" y1="334" x2="320" y2="462" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="520" y1="334" x2="520" y2="462" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="660" y1="334" x2="660" y2="462" stroke="#27ae60" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Позначки часу вгорі Панелі 2 -->
  <text x="320" y="328" font-size="12" fill="#6b7280" text-anchor="middle">t₀ (Power ON)</text>
  <text x="520" y="328" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">digitalWrite(HIGH)</text>
  <text x="660" y="328" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">pinMode(OUTPUT)</text>

  <!-- Підписи сигналів ліворуч -->
  <text x="45" y="365" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">GPIO0 (вивід)</text>
  <text x="45" y="380" font-size="12" fill="#6b7280" text-anchor="start">(вхід / вихід)</text>

  <text x="45" y="438" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Стан реле</text>
  <text x="45" y="453" font-size="12" fill="#6b7280" text-anchor="start">(активний LOW)</text>

  <!-- Діаграма сигналу GPIO0 (Панель 2) -->
  <!-- Живлення вимкнено (до t0): 0V (пунктир) -->
  <line x1="200" y1="388" x2="320" y2="388" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- Фронт подачі живлення t0 -->
  <line x1="320" y1="388" x2="320" y2="358" stroke="#27ae60" stroke-width="2"/>
  <!-- Суцільний стабільний HIGH рівень без просідання (t0 -> кінця) -->
  <line x1="320" y1="358" x2="880" y2="358" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Анотації сигналу GPIO0 -->
  <text x="420" y="348" font-size="12" fill="#2457d6" text-anchor="middle">Підтяжка 10k (HIGH)</text>
  <text x="590" y="348" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Засувка HIGH</text>
  <text x="770" y="348" font-size="12" fill="#27ae60" text-anchor="middle">Активний HIGH (3.3V)</text>

  <!-- Діаграма стану реле (Панель 2) -->
  <!-- Суцільна лінія ВИМКНЕНО до бейджа стабільності -->
  <line x1="200" y1="430" x2="450" y2="430" stroke="#27ae60" stroke-width="2"/>

  <!-- Бейдж стабільності на лінії реле -->
  <rect x="450" y="414" width="280" height="32" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="590" y="434" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">РЕЛЕ СТАБІЛЬНО ВИМКНЕНЕ (БЕЗ ЗБОЇВ)</text>

  <!-- Суцільна лінія ВИМКНЕНО після бейджа стабільності -->
  <line x1="730" y1="430" x2="880" y2="430" stroke="#27ae60" stroke-width="2"/>

  <!-- Анотація результату під Панеллю 2 -->
  <text x="590" y="478" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Результат: повне усунення клацання та імпульсів на виході при завантаженні</text>
</svg>
