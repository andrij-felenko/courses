<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема драйвера реле на GPIO0 для ESP-01S</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Підтяжка R_PU забезпечує High (Flash Boot) при завантаженні; I_B відкриває NPN-ключ у робочому режимі</text>

  <!-- ================= LEFT PANEL: BOOT MODE ================= -->
  <rect x="25" y="72" width="445" height="388" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Panel 1 Header -->
  <rect x="40" y="84" width="415" height="42" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="247.5" y="102" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Режим ініціалізації (Boot / Reset)</text>
  <text x="247.5" y="118" font-size="12" fill="#6b7280" text-anchor="middle">GPIO0 у стані Hi-Z ➔ струм I_PU тече в вхід ➔ V_GPIO0 = 3.3V</text>

  <!-- Left Schematic Wire & Components -->
  <!-- VCC Rail & Label -->
  <line x1="160" y1="150" x2="200" y2="150" stroke="#c0392b" stroke-width="2"/>
  <circle cx="180" cy="150" r="3" fill="#c0392b"/>
  <text x="180" y="143" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+3.3V (VCC)</text>

  <!-- Pull-up resistor R_PU -->
  <line x1="180" y1="150" x2="180" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="172" y="175" width="16" height="30" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="180" y1="205" x2="180" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="195" y="186" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">R_PU</text>
  <text x="195" y="201" font-size="11" fill="#6b7280" text-anchor="start">10 kΩ</text>

  <!-- Node A (GPIO0 junction) -->
  <circle cx="180" cy="230" r="3.5" fill="#1a1a1a"/>

  <!-- ESP-01S Box -->
  <rect x="45" y="205" width="95" height="50" rx="4" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="92.5" y="224" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ESP-01S</text>
  <text x="92.5" y="242" font-size="11" fill="#6b7280" text-anchor="middle">GPIO0 (Hi-Z)</text>
  <!-- Wire GPIO0 to Node A -->
  <line x1="140" y1="230" x2="180" y2="230" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Base Resistor R_B -->
  <line x1="180" y1="230" x2="220" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="220" y="222" width="35" height="16" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="255" y1="230" x2="300" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="237.5" y="213" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">R_B</text>
  <text x="237.5" y="252" font-size="11" fill="#6b7280" text-anchor="middle">1...4.7 kΩ</text>

  <!-- Transistor Q1 (NPN) -->
  <circle cx="318" cy="230" r="20" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="300" y1="230" x2="310" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="310" y1="218" x2="310" y2="242" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- Collector line -->
  <line x1="310" y1="223" x2="330" y2="195" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="330" y1="195" x2="330" y2="190" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Emitter line -->
  <line x1="310" y1="237" x2="330" y2="265" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="328,255 332,267 321,263" fill="#1a1a1a"/>
  <line x1="330" y1="265" x2="330" y2="295" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Transistor Labels -->
  <text x="348" y="232" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Q1 (NPN)</text>
  <text x="348" y="247" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="start">(ЗАПЕРТИЙ / OFF)</text>

  <!-- Ground GND -->
  <line x1="320" y1="295" x2="340" y2="295" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="324" y1="299" x2="336" y2="299" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="328" y1="303" x2="332" y2="303" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="330" y="318" font-size="11" fill="#6b7280" text-anchor="middle">GND</text>

  <!-- Relay Coil & Diode D1 Supply -->
  <line x1="355" y1="150" x2="405" y2="150" stroke="#c0392b" stroke-width="2"/>
  <circle cx="380" cy="150" r="3" fill="#c0392b"/>
  <text x="380" y="143" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+5V / +3.3V</text>

  <!-- Junction B above coil/diode -->
  <line x1="380" y1="150" x2="380" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="355" y1="160" x2="405" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="380" cy="160" r="2.5" fill="#1a1a1a"/>

  <!-- Relay Coil -->
  <line x1="405" y1="160" x2="405" y2="170" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="395" y="170" width="20" height="36" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="395" y1="170" x2="415" y2="206" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="405" y1="206" x2="405" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="422" y="184" font-size="11" fill="#1a1a1a" text-anchor="start">Котушка</text>
  <text x="422" y="197" font-size="11" fill="#6b7280" text-anchor="start">реле</text>

  <!-- Diode D1 (Flyback) -->
  <line x1="355" y1="160" x2="355" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="350" y1="175" x2="360" y2="175" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="355,175 350,190 360,190" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="355" y1="190" x2="355" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="338" y="185" font-size="11" fill="#1a1a1a" text-anchor="end">D1</text>

  <!-- Junction C below coil/diode to Collector -->
  <line x1="355" y1="220" x2="405" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="380" cy="220" r="2.5" fill="#1a1a1a"/>
  <line x1="380" y1="220" x2="380" y2="228" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="380" y1="228" x2="330" y2="228" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="330" y1="228" x2="330" y2="190" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Left Callout Box 1: Pull-up Current -->
  <rect x="45" y="270" width="225" height="48" rx="4" fill="white" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="55" y="288" font-size="11" fill="#1a1a1a" text-anchor="start">I_PU: струм підтяжки ≈ 0.33 mA</text>
  <text x="55" y="304" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="start">V_GPIO0 = 3.3V ➔ Flash Boot</text>

  <!-- Left Callout Box 2: Transistor OFF -->
  <rect x="280" y="330" width="175" height="48" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="290" y="348" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="start">I_B ≈ 0 mA (V_BE &lt; 0.7V)</text>
  <text x="290" y="364" font-size="11" fill="#1a1a1a" text-anchor="start">I_C = 0 mA (Реле ВИМКНЕНО)</text>

  <!-- Left Bottom Badge -->
  <rect x="40" y="392" width="415" height="52" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="247.5" y="413" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Результат ініціалізації: УСПІШНИЙ СТАРТ</text>
  <text x="247.5" y="431" font-size="12" fill="#1a1a1a" text-anchor="middle">GPIO0 = 3.3V ➔ ESP8266 завантажується без хибних спрацювань</text>


  <!-- ================= RIGHT PANEL: ACTIVE MODE ================= -->
  <rect x="490" y="72" width="445" height="388" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Panel 2 Header -->
  <rect x="505" y="84" width="415" height="42" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712.5" y="102" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">2. Робочий режим (GPIO0 = HIGH / Ключ відкритий)</text>
  <text x="712.5" y="118" font-size="12" fill="#6b7280" text-anchor="middle">GPIO0 видає 3.3V ➔ струм I_B насичує Q1 ➔ Реле спрацьовує</text>

  <!-- Right Schematic Wire & Components -->
  <!-- VCC Rail & Label -->
  <line x1="625" y1="150" x2="665" y2="150" stroke="#c0392b" stroke-width="2"/>
  <circle cx="645" cy="150" r="3" fill="#c0392b"/>
  <text x="645" y="143" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+3.3V (VCC)</text>

  <!-- Pull-up resistor R_PU -->
  <line x1="645" y1="150" x2="645" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="637" y="175" width="16" height="30" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="645" y1="205" x2="645" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="660" y="186" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">R_PU</text>
  <text x="660" y="201" font-size="11" fill="#6b7280" text-anchor="start">10 kΩ</text>

  <!-- Node A (GPIO0 junction) -->
  <circle cx="645" cy="230" r="3.5" fill="#27ae60"/>

  <!-- ESP-01S Box -->
  <rect x="510" y="205" width="95" height="50" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="557.5" y="224" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">ESP-01S</text>
  <text x="557.5" y="242" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">GPIO0 (HIGH)</text>
  <!-- Active Base Current Path I_B (green line with arrow) -->
  <line x1="605" y1="230" x2="645" y2="230" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <line x1="645" y1="230" x2="685" y2="230" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Base Resistor R_B -->
  <rect x="685" y="222" width="35" height="16" fill="white" stroke="#27ae60" stroke-width="2"/>
  <line x1="720" y1="230" x2="765" y2="230" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="702.5" y="213" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">R_B</text>
  <text x="702.5" y="252" font-size="11" fill="#6b7280" text-anchor="middle">1...4.7 kΩ</text>

  <!-- Transistor Q1 (NPN, ON state) -->
  <circle cx="783" cy="230" r="20" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <line x1="765" y1="230" x2="775" y2="230" stroke="#27ae60" stroke-width="2.5"/>
  <line x1="775" y1="218" x2="775" y2="242" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- Collector line -->
  <line x1="775" y1="223" x2="795" y2="195" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="795" y1="195" x2="795" y2="190" stroke="#2457d6" stroke-width="2.5"/>
  <!-- Emitter line -->
  <line x1="775" y1="237" x2="795" y2="265" stroke="#2457d6" stroke-width="2.5"/>
  <polygon points="793,255 797,267 786,263" fill="#2457d6"/>
  <line x1="795" y1="265" x2="795" y2="295" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <!-- Transistor Labels -->
  <text x="813" y="232" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Q1 (NPN)</text>
  <text x="813" y="247" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="start">(ВІДКРИТИЙ / ON)</text>

  <!-- Ground GND -->
  <line x1="785" y1="295" x2="805" y2="295" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="789" y1="299" x2="801" y2="299" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="793" y1="303" x2="797" y2="303" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="795" y="318" font-size="11" fill="#6b7280" text-anchor="middle">GND</text>

  <!-- Relay Coil & Diode D1 Supply -->
  <line x1="820" y1="150" x2="870" y2="150" stroke="#c0392b" stroke-width="2"/>
  <circle cx="845" cy="150" r="3" fill="#c0392b"/>
  <text x="845" y="143" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+5V / +3.3V</text>

  <!-- Junction B above coil/diode -->
  <line x1="845" y1="150" x2="845" y2="160" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="820" y1="160" x2="870" y2="160" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="845" cy="160" r="3" fill="#2457d6"/>

  <!-- Relay Coil (Active blue) -->
  <line x1="870" y1="160" x2="870" y2="170" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <rect x="860" y="170" width="20" height="36" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <line x1="860" y1="170" x2="880" y2="206" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="870" y1="206" x2="870" y2="220" stroke="#2457d6" stroke-width="2.5"/>
  <text x="885" y="184" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="start">Котушка</text>
  <text x="885" y="197" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="start">УВІМКН</text>

  <!-- Diode D1 (Flyback) -->
  <line x1="820" y1="160" x2="820" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="815" y1="175" x2="825" y2="175" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="820,175 815,190 825,190" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="820" y1="190" x2="820" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="805" y="185" font-size="11" fill="#1a1a1a" text-anchor="end">D1</text>

  <!-- Junction C below coil to Collector -->
  <line x1="820" y1="220" x2="870" y2="220" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="845" cy="220" r="3" fill="#2457d6"/>
  <line x1="845" y1="220" x2="845" y2="228" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="845" y1="228" x2="795" y2="228" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="795" y1="228" x2="795" y2="190" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Right Callout Box 1: Base Current Calc -->
  <rect x="510" y="270" width="225" height="48" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="520" y="288" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="start">I_B = (V_GPIO - V_BE) / R_B</text>
  <text x="520" y="304" font-size="11" fill="#1a1a1a" text-anchor="start">I_B ≈ (3.3V - 0.7V)/1kΩ = 2.6 mA</text>

  <!-- Right Callout Box 2: Relay Collector Current -->
  <rect x="750" y="330" width="175" height="48" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="760" y="348" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="start">I_C = I_котушки ≈ 70...80 mA</text>
  <text x="760" y="364" font-size="11" fill="#1a1a1a" text-anchor="start">Q1 у глибокому насиченні</text>

  <!-- Right Bottom Badge -->
  <rect x="505" y="392" width="415" height="52" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="712.5" y="413" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Результат робочого стану: РЕЛЕ АКТИВОВАНЕ</text>
  <text x="712.5" y="431" font-size="12" fill="#1a1a1a" text-anchor="middle">Транзистор Q1 відкритий, діод D1 гасить зворотну ЕРС</text>
</svg>
