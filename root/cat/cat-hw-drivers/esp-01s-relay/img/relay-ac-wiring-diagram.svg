<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Підкладка полотна -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Маркери стрілок -->
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Підключення мережевого навантаження 230 В через реле (COM / NO)</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">Фаза L комутується контактом реле; Нуль N та Заземлення PE підключаються напряму</text>

  <!-- 1. МЕРЕЖА 230 В AC -->
  <rect x="40" y="100" width="160" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="120" y="128" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мережа 230 В AC</text>
  <text x="120" y="146" font-size="12" fill="#6b7280" text-anchor="middle">(Джерело живлення)</text>

  <!-- Лінія L в мережі -->
  <text x="55" y="196" font-size="13" font-weight="bold" fill="#c0392b">L (Фаза)</text>
  <text x="55" y="214" font-size="12" fill="#6b7280">~230 В</text>
  <circle cx="170" cy="200" r="5" fill="#c0392b"/>

  <!-- Лінія N в мережі -->
  <text x="55" y="306" font-size="13" font-weight="bold" fill="#2457d6">N (Нуль)</text>
  <text x="55" y="324" font-size="12" fill="#6b7280">0 В (робочий)</text>
  <circle cx="170" cy="310" r="5" fill="#2457d6"/>

  <!-- Лінія PE в мережі -->
  <text x="55" y="416" font-size="13" font-weight="bold" fill="#27ae60">PE (Захист)</text>
  <text x="55" y="434" font-size="12" fill="#6b7280">Заземлення</text>
  <circle cx="170" cy="420" r="5" fill="#27ae60"/>

  <!-- ЛІНІЇ ВІД МЕРЕЖІ ТА ЕЛЕМЕНТИ ЗАХИСТУ -->

  <!-- Фазний провідник L від мережі до запобіжника -->
  <line x1="170" y1="200" x2="220" y2="200" stroke="#c0392b" stroke-width="3"/>

  <!-- Запобіжник (Fuse) -->
  <rect x="220" y="190" width="45" height="20" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <line x1="210" y1="200" x2="275" y2="200" stroke="#c0392b" stroke-width="1.5"/>
  <text x="242" y="178" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Запобіжник</text>

  <!-- Фазний провідник L від запобіжника до варистора/вузла L -->
  <line x1="265" y1="200" x2="290" y2="200" stroke="#c0392b" stroke-width="3"/>
  <circle cx="290" cy="200" r="4" fill="#c0392b"/>

  <!-- Фазний провідник L від вузла L до COM реле -->
  <line x1="290" y1="200" x2="440" y2="200" stroke="#c0392b" stroke-width="3"/>

  <!-- Варистор (MOV) між L і N -->
  <line x1="290" y1="200" x2="290" y2="235" stroke="#2457d6" stroke-width="2"/>
  <rect x="278" y="235" width="24" height="40" rx="2" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <line x1="272" y1="270" x2="308" y2="240" stroke="#2457d6" stroke-width="2"/>
  <line x1="290" y1="275" x2="290" y2="310" stroke="#2457d6" stroke-width="2"/>
  <circle cx="290" cy="310" r="4" fill="#2457d6"/>

  <text x="315" y="248" font-size="12" font-weight="bold" fill="#2457d6">Варистор (MOV)</text>
  <text x="315" y="264" font-size="12" fill="#6b7280">Захист від сплесків</text>

  <!-- Лінія N від мережі напряму під реле до навантаження -->
  <line x1="170" y1="310" x2="790" y2="310" stroke="#2457d6" stroke-width="3"/>

  <!-- Лінія PE від мережі напряму під реле до навантаження -->
  <line x1="170" y1="420" x2="790" y2="420" stroke="#27ae60" stroke-width="3"/>

  <!-- 2. МОДУЛЬ РЕЛЕ ESP-01S -->
  <rect x="440" y="100" width="290" height="350" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>

  <!-- Шапка модуля реле -->
  <path d="M 440 110 A 10 10 0 0 1 450 100 L 720 100 A 10 10 0 0 1 730 110 L 730 136 L 440 136 Z" fill="#2457d6"/>
  <text x="585" y="123" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Модуль реле ESP-01S Relay</text>

  <!-- Низьковольтна секція (ESP-01S + котушка) -->
  <rect x="455" y="150" width="100" height="70" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="505" y="172" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Плата ESP-01S</text>
  <text x="505" y="192" font-size="12" fill="#2457d6" text-anchor="middle">GPIO0 (SIG)</text>
  <text x="505" y="208" font-size="11" fill="#6b7280" text-anchor="middle">Живлення 3.3V</text>

  <!-- Котушка реле -->
  <rect x="455" y="250" width="100" height="60" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="505" y="274" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Котушка реле</text>
  <text x="505" y="294" font-size="12" fill="#c0392b" text-anchor="middle">OFF (без струму)</text>

  <!-- Лінія керування від ESP01 до котушки -->
  <line x1="505" y1="220" x2="505" y2="250" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Механічний зв'язок (пунктир) від котушки до контактора -->
  <line x1="555" y1="280" x2="620" y2="240" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Індикатор стану реле -->
  <rect x="455" y="350" width="100" height="55" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="505" y="372" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Реле: РОЗІМКНЕНО</text>
  <text x="505" y="390" font-size="11" fill="#6b7280" text-anchor="middle">Коло AC перервано</text>

  <!-- Високовольтна секція клем та контактор -->

  <!-- Клема COM -->
  <circle cx="590" cy="200" r="11" fill="#d0d7de" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="584" y1="200" x2="596" y2="200" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="590" y1="194" x2="590" y2="206" stroke="#1a1a1a" stroke-width="2"/>
  <text x="590" y="172" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">COM</text>
  <text x="590" y="226" font-size="11" fill="#6b7280" text-anchor="middle">Спільний</text>

  <!-- Клема NO -->
  <circle cx="700" cy="200" r="11" fill="#d0d7de" stroke="#27ae60" stroke-width="2"/>
  <line x1="694" y1="200" x2="706" y2="200" stroke="#27ae60" stroke-width="2"/>
  <line x1="700" y1="194" x2="700" y2="206" stroke="#27ae60" stroke-width="2"/>
  <text x="700" y="172" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">NO</text>
  <text x="700" y="226" font-size="11" fill="#27ae60" text-anchor="middle">Норм. розімкн.</text>

  <!-- Клема NC -->
  <circle cx="645" cy="300" r="11" fill="#eaeded" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="640" y1="300" x2="650" y2="300" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="645" y1="295" x2="645" y2="305" stroke="#6b7280" stroke-width="1.5"/>
  <text x="645" y="324" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">NC (вільна)</text>

  <!-- Схематичний перемикач / контактор -->
  <!-- Нерухомий контакт NO -->
  <circle cx="680" cy="200" r="4" fill="#27ae60"/>

  <!-- Нерухомий контакт NC -->
  <circle cx="645" cy="265" r="4" fill="#6b7280"/>
  <line x1="645" y1="265" x2="645" y2="289" stroke="#6b7280" stroke-width="2"/>

  <!-- Рухомий контакт від COM (590, 200) нахилений до NC (645, 265) -->
  <line x1="601" y1="200" x2="643" y2="262" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="601" cy="200" r="3" fill="#1a1a1a"/>

  <!-- Позначка розриву кола біля контакту NO -->
  <path d="M 660 190 A 15 15 0 0 1 675 210" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="2,2"/>
  <text x="645" y="185" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">РОЗРИВ КОЛА</text>

  <!-- ПРОВІДНИКИ ВІД РЕЛЕ ДО НАВАНТАЖЕННЯ -->

  <!-- Лінія L від клеми NO реле до навантаження -->
  <line x1="711" y1="200" x2="790" y2="200" stroke="#c0392b" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="750" y="175" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">L (комутована)</text>
  <text x="750" y="220" font-size="11" fill="#6b7280" text-anchor="middle">Струм = 0 А (0 В)</text>

  <!-- Лінія N підпис -->
  <text x="750" y="295" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">N (нерозривний)</text>

  <!-- Лінія PE підпис -->
  <text x="750" y="442" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">PE (нерозривний)</text>

  <!-- 3. МЕРЕЖЕВЕ НАВАНТАЖЕННЯ 230 В -->
  <rect x="790" y="100" width="140" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="860" y="128" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Навантаження</text>
  <text x="860" y="146" font-size="12" fill="#6b7280" text-anchor="middle">~230 В AC</text>

  <!-- Клеми підключення на навантаженні -->
  <circle cx="790" cy="200" r="5" fill="#c0392b"/>
  <circle cx="790" cy="310" r="5" fill="#2457d6"/>
  <circle cx="790" cy="420" r="5" fill="#27ae60"/>

  <!-- Графічний символ Лампи / Навантаження -->
  <circle cx="860" cy="255" r="26" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="842" y1="237" x2="878" y2="273" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="842" y1="273" x2="878" y2="237" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Внутрішні з'єднання в навантаженні -->
  <line x1="795" y1="200" x2="860" y2="200" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="860" y1="200" x2="860" y2="229" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3"/>

  <line x1="795" y1="310" x2="860" y2="310" stroke="#2457d6" stroke-width="2"/>
  <line x1="860" y1="310" x2="860" y2="281" stroke="#2457d6" stroke-width="2"/>

  <line x1="795" y1="420" x2="860" y2="420" stroke="#27ae60" stroke-width="2"/>
  <!-- Позначка заземлення на корпусі -->
  <line x1="860" y1="405" x2="860" y2="420" stroke="#27ae60" stroke-width="2"/>
  <line x1="848" y1="420" x2="872" y2="420" stroke="#27ae60" stroke-width="2"/>
  <line x1="853" y1="424" x2="867" y2="424" stroke="#27ae60" stroke-width="2"/>
  <line x1="857" y1="428" x2="863" y2="428" stroke="#27ae60" stroke-width="2"/>

  <!-- Підпис стану навантаження -->
  <rect x="805" y="340" width="110" height="40" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="860" y="358" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">ЗНЕСТРУМЛЕНО</text>
  <text x="860" y="374" font-size="11" fill="#6b7280" text-anchor="middle">Безпечний стан</text>

  <!-- 4. НИЖНЯ ПІДСУМКОВА ПАНЕЛЬ БЕЗПЕКИ -->
  <rect x="40" y="470" width="880" height="40" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="495" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Правило безпеки: Комутація виконується у розрив фази L; N та PE з'єднуються напряму</text>
</svg>
