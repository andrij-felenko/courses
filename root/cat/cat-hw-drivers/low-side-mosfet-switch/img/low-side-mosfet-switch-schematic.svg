<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background canvas -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Схемотехніка низькостороннього N-канального MOSFET-ключа</text>
  <text x="480" y="50" font-size="13" text-anchor="middle" fill="#6b7280">Правильне з'єднання RG, RGS, захисного діода та розділення сигнальної й силової земель</text>

  <!-- Main Schematic Container Panel -->
  <rect x="20" y="65" width="920" height="360" fill="#fcfdfe" stroke="#d0d7de" stroke-width="1" rx="8"/>

  <!-- Power Supply Rail (+V_LOAD) -->
  <text x="580" y="85" font-size="13" font-weight="bold" text-anchor="middle" fill="#2457d6">+V_LOAD (+5V...+48V)</text>
  <circle cx="580" cy="95" r="4" fill="#2457d6"/>
  <line x1="580" y1="95" x2="580" y2="110" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="580" y1="95" x2="680" y2="95" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Callout Box: RG Explanation -->
  <rect x="165" y="80" width="215" height="75" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="175" y="100" font-size="12" font-weight="bold" text-anchor="start" fill="#2457d6">1. Резистор затвора RG</text>
  <text x="175" y="118" font-size="12" text-anchor="start" fill="#1a1a1a">• Обмежує струм перезаряду</text>
  <text x="175" y="136" font-size="12" text-anchor="start" fill="#1a1a1a">• Пригнічує звон та осциляції</text>
  <line x1="272" y1="155" x2="255" y2="195" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-blue)"/>

  <!-- Inductive Load Block -->
  <rect x="525" y="95" width="110" height="85" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" rx="6"/>
  <text x="580" y="118" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Навантаження</text>
  <text x="580" y="136" font-size="12" text-anchor="middle" fill="#6b7280">(Двигун / Реле)</text>
  <text x="580" y="156" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">LLOAD, RLOAD</text>

  <!-- Load Inductance symbol inside load box -->
  <path d="M 545,170 Q 550,162 555,170 Q 560,162 565,170 Q 570,162 575,170 Q 580,162 585,170" fill="none" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Normal Load Current Flow Arrow (I_LOAD) -->
  <line x1="505" y1="85" x2="505" y2="175" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <text x="493" y="130" font-size="12" font-weight="bold" text-anchor="end" fill="#2457d6">I_LOAD</text>

  <!-- Flyback Protection Diode (DFLY) -->
  <line x1="680" y1="95" x2="680" y2="125" stroke="#27ae60" stroke-width="2"/>
  <line x1="680" y1="180" x2="680" y2="155" stroke="#27ae60" stroke-width="2"/>
  <line x1="580" y1="180" x2="680" y2="180" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="668,155 692,155 680,125" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <line x1="668" y1="125" x2="692" y2="125" stroke="#27ae60" stroke-width="3"/>
  <text x="705" y="132" font-size="13" font-weight="bold" text-anchor="start" fill="#27ae60">DFLY</text>
  <text x="705" y="150" font-size="12" font-weight="bold" text-anchor="start" fill="#27ae60">Захисний діод</text>
  <text x="705" y="168" font-size="12" text-anchor="start" fill="#6b7280">(Шотткі / Fast)</text>

  <!-- Flyback Current Loop Arrow (I_FLY) -->
  <path d="M 695,170 Q 710,130 695,95" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>
  <text x="705" y="100" font-size="12" font-weight="bold" text-anchor="start" fill="#27ae60">I_FLY (проти-ЕРС)</text>

  <!-- MCU / Gate Driver Block -->
  <rect x="40" y="195" width="110" height="85" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="95" y="221" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">МК / Драйвер</text>
  <text x="95" y="239" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">V_OUT</text>
  <text x="95" y="257" font-size="12" text-anchor="middle" fill="#6b7280">(0 / 3.3V / 5V)</text>

  <!-- Control Signal Wire -->
  <line x1="150" y1="227" x2="210" y2="227" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Gate Resistor RG -->
  <rect x="210" y="215" width="55" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="237.5" y="202" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">RG</text>
  <text x="237.5" y="256" font-size="12" text-anchor="middle" fill="#6b7280">10...100 Ом</text>

  <!-- Wire RG to Gate Junction Node -->
  <line x1="265" y1="227" x2="320" y2="227" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="320" cy="227" r="4" fill="#1a1a1a"/>

  <!-- Pull-Down Resistor RGS -->
  <line x1="320" y1="227" x2="320" y2="260" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="308" y="260" width="24" height="55" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="320" y1="315" x2="320" y2="365" stroke="#1a1a1a" stroke-width="2"/>
  <text x="296" y="283" font-size="13" font-weight="bold" text-anchor="end" fill="#1a1a1a">RGS</text>
  <text x="296" y="301" font-size="12" text-anchor="end" fill="#6b7280">10...100 кОм</text>

  <!-- Wire Gate Junction Node to MOSFET Gate Pin -->
  <line x1="320" y1="227" x2="400" y2="227" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Drain Wire from Load to Drain -->
  <line x1="580" y1="180" x2="580" y2="208.5" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="580" y1="208.5" x2="440" y2="208.5" stroke="#1a1a1a" stroke-width="2"/>

  <!-- MOSFET Component Box & Symbol -->
  <rect x="390" y="175" width="95" height="95" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3" rx="6"/>
  <text x="437.5" y="163" font-size="13" font-weight="bold" text-anchor="middle" fill="#2457d6">Q1 (N-MOSFET)</text>

  <!-- Gate Plate -->
  <line x1="412" y1="202" x2="412" y2="252" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Channel Segments -->
  <line x1="418" y1="202" x2="418" y2="215" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="418" y1="222" x2="418" y2="232" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="418" y1="239" x2="418" y2="252" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- Drain/Source/Middle Taps -->
  <line x1="418" y1="208.5" x2="440" y2="208.5" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="418" y1="245.5" x2="440" y2="245.5" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="418" y1="227" x2="440" y2="227" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="440" y1="227" x2="440" y2="245.5" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="428,223 420,227 428,231" fill="#1a1a1a"/>

  <!-- Internal Body Diode -->
  <line x1="440" y1="208.5" x2="465" y2="208.5" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="440" y1="245.5" x2="465" y2="245.5" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="465" y1="208.5" x2="465" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="465" y1="245.5" x2="465" y2="234" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="458,234 472,234 465,220" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="458" y1="220" x2="472" y2="220" stroke="#1a1a1a" stroke-width="2"/>

  <!-- MOSFET Pin Terminals Labels -->
  <text x="395" y="219" font-size="12" font-weight="bold" text-anchor="start" fill="#2457d6">G</text>
  <text x="448" y="197" font-size="12" font-weight="bold" text-anchor="start" fill="#2457d6">D</text>
  <text x="448" y="262" font-size="12" font-weight="bold" text-anchor="start" fill="#2457d6">S</text>

  <!-- Source Connection Wire to Star Ground Point -->
  <line x1="440" y1="245.5" x2="440" y2="365" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Signal Ground (MCU GND) Line & Symbol -->
  <line x1="95" y1="280" x2="95" y2="365" stroke="#6b7280" stroke-width="2"/>
  <line x1="95" y1="365" x2="440" y2="365" stroke="#6b7280" stroke-width="2"/>

  <!-- Signal Ground Symbol -->
  <line x1="86" y1="370" x2="104" y2="370" stroke="#6b7280" stroke-width="2"/>
  <line x1="89" y1="374" x2="101" y2="374" stroke="#6b7280" stroke-width="2"/>
  <line x1="92" y1="378" x2="98" y2="378" stroke="#6b7280" stroke-width="2"/>
  <text x="95" y="396" font-size="12" font-weight="bold" text-anchor="middle" fill="#6b7280">GND (Сигнальна)</text>

  <!-- Star Ground Point (Single Point Connection) -->
  <circle cx="440" cy="365" r="5" fill="#2457d6"/>
  <circle cx="440" cy="365" r="9" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="2,2"/>
  <text x="460" y="362" font-size="12" font-weight="bold" text-anchor="start" fill="#2457d6">Точка з'єднання (Star Ground)</text>

  <!-- Power Ground (PGND) Line & Symbol -->
  <line x1="440" y1="365" x2="440" y2="388" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="425" y1="388" x2="455" y2="388" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="428" y1="393" x2="434" y2="399" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="437" y1="393" x2="443" y2="399" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="446" y1="393" x2="452" y2="399" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="440" y="414" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">PGND (Силова)</text>

  <!-- Bottom Explanatory Summary Cards -->
  <!-- Card 1: RG -->
  <rect x="25" y="445" width="215" height="70" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="6"/>
  <text x="33" y="465" font-size="12" font-weight="bold" text-anchor="start" fill="#2457d6">1. Резистор затвора RG</text>
  <text x="33" y="483" font-size="12" text-anchor="start" fill="#1a1a1a">• Обмежує струм I_G</text>
  <text x="33" y="501" font-size="12" text-anchor="start" fill="#1a1a1a">• Запобігає звону (ringing)</text>

  <!-- Card 2: RGS -->
  <rect x="255" y="445" width="215" height="70" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="263" y="465" font-size="12" font-weight="bold" text-anchor="start" fill="#1a1a1a">2. Підтяжка RGS</text>
  <text x="263" y="483" font-size="12" text-anchor="start" fill="#1a1a1a">• Фіксує 0 В при скиданні</text>
  <text x="263" y="501" font-size="12" text-anchor="start" fill="#6b7280">• Усуває плаваючий затвор</text>

  <!-- Card 3: Star Ground -->
  <rect x="485" y="445" width="215" height="70" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="6"/>
  <text x="493" y="465" font-size="12" font-weight="bold" text-anchor="start" fill="#2457d6">3. Точка Star Ground</text>
  <text x="493" y="483" font-size="12" text-anchor="start" fill="#1a1a1a">• З'єднує GND і PGND на S</text>
  <text x="493" y="501" font-size="12" text-anchor="start" fill="#1a1a1a">• Ізолює коло від завад</text>

  <!-- Card 4: D_FLY -->
  <rect x="715" y="445" width="220" height="70" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="6"/>
  <text x="723" y="465" font-size="12" font-weight="bold" text-anchor="start" fill="#27ae60">4. Діод D_FLY (Flyback)</text>
  <text x="723" y="483" font-size="12" text-anchor="start" fill="#1a1a1a">• Шунтує сплески проти-ЕРС</text>
  <text x="723" y="501" font-size="12" text-anchor="start" fill="#1a1a1a">• Захищає V_DS від пробою</text>
</svg>
