<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Характеристика R_DS(on) від V_GS: Стандартний vs Logic-Level MOSFET</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Logic-Level MOSFET досягає мінімального опору при 3.3–5 В, у той час як стандартний вимагає 10 В</text>

  <!-- Ліва панель з графіком -->
  <rect x="40" y="75" width="570" height="425" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Зона напруг мікроконтролерів (3.3 В - 5 В) -->
  <rect x="226.5" y="125" width="65.2" height="295" fill="#eaf0fd"/>

  <!-- Бейдж зони МК -->
  <rect x="190" y="88" width="138" height="24" rx="4" ry="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="259" y="104" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Логіка МК (3.3В – 5В)</text>

  <!-- Бейдж 10В -->
  <rect x="425" y="88" width="116" height="24" rx="4" ry="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="483" y="104" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Стандарт (10 В)</text>

  <!-- Сітка графіка -->
  <line x1="110" y1="350" x2="560" y2="350" stroke="#e1e4e8" stroke-dasharray="3 3"/>
  <line x1="110" y1="280" x2="560" y2="280" stroke="#e1e4e8" stroke-dasharray="3 3"/>
  <line x1="110" y1="210" x2="560" y2="210" stroke="#e1e4e8" stroke-dasharray="3 3"/>
  <line x1="110" y1="140" x2="560" y2="140" stroke="#e1e4e8" stroke-dasharray="3 3"/>

  <!-- Вертикальні пунктирні лінії від точок кривих до осі X -->
  <line x1="226.5" y1="125" x2="226.5" y2="420" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="291.7" y1="125" x2="291.7" y2="420" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="483.3" y1="125" x2="483.3" y2="420" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Осі координат -->
  <line x1="110" y1="420" x2="575" y2="420" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="110" y1="420" x2="110" y2="120" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Позначки осі Y -->
  <text x="100" y="105" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="end">R<tspan font-size="11" dy="3">DS(on)</tspan><tspan font-size="13" dy="-3">, мОм</tspan></text>
  <text x="98" y="144" font-size="12" fill="#6b7280" text-anchor="end">80</text>
  <text x="98" y="214" font-size="12" fill="#6b7280" text-anchor="end">60</text>
  <text x="98" y="284" font-size="12" fill="#6b7280" text-anchor="end">40</text>
  <text x="98" y="354" font-size="12" fill="#6b7280" text-anchor="end">20</text>
  <text x="98" y="424" font-size="12" fill="#6b7280" text-anchor="end">0</text>

  <!-- Позначки осі X -->
  <text x="110" y="440" font-size="12" fill="#6b7280" text-anchor="middle">0</text>
  <text x="176.7" y="440" font-size="12" fill="#6b7280" text-anchor="middle">2 В</text>
  <text x="226.5" y="440" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">3.3 В</text>
  <text x="291.7" y="440" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">5 В</text>
  <text x="406.7" y="440" font-size="12" fill="#6b7280" text-anchor="middle">8 В</text>
  <text x="483.3" y="440" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">10 В</text>
  <text x="560" y="440" font-size="12" fill="#6b7280" text-anchor="middle">12 В</text>
  <text x="335" y="470" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Напруга затвор-витік V<tspan font-size="11" dy="3">GS</tspan><tspan font-size="13" dy="-3">, В</tspan></text>

  <!-- Крива 1: Стандартний MOSFET -->
  <path d="M 110,140 L 190,140 C 210,140 218,155 226.5,175 C 250,230 270,260 291.7,287 C 330,335 410,375 483.3,385 L 560,385" fill="none" stroke="#c0392b" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Крива 2: Logic-Level MOSFET -->
  <path d="M 110,140 L 145,140 C 158,140 165,180 176.7,260 C 190,340 205,372 226.5,378 C 248,384 270,385 291.7,385 L 560,385" fill="none" stroke="#27ae60" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Точки та виносні блоки -->
  <!-- Точка Стандарт при 3.3В -->
  <circle cx="226.5" cy="175" r="5" fill="#c0392b"/>
  <line x1="226.5" y1="175" x2="305" y2="175" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="2 2"/>
  <rect x="305" y="152" width="115" height="44" rx="4" ry="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="312" y="169" font-size="12" font-weight="700" fill="#c0392b">R_DS ≈ 70 мОм</text>
  <text x="312" y="187" font-size="12" fill="#c0392b">Високі втрати!</text>

  <!-- Точка Logic-Level при 3.3В -->
  <circle cx="226.5" cy="378" r="5" fill="#27ae60"/>
  <line x1="226.5" y1="378" x2="212" y2="378" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="2 2"/>
  <rect x="100" y="362" width="112" height="44" rx="4" ry="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="106" y="379" font-size="12" font-weight="700" fill="#27ae60">R_DS ≈ 12 мОм</text>
  <text x="106" y="396" font-size="12" fill="#27ae60">Відкритий (ОК)</text>

  <!-- Точка Стандарт при 5.0В -->
  <circle cx="291.7" cy="287" r="5" fill="#c0392b"/>
  <line x1="291.7" y1="287" x2="305" y2="250" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="2 2"/>
  <rect x="305" y="228" width="115" height="44" rx="4" ry="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="312" y="245" font-size="12" font-weight="700" fill="#c0392b">R_DS ≈ 38 мОм</text>
  <text x="312" y="263" font-size="12" fill="#c0392b">Недовідкритий</text>

  <!-- Точка 10В -->
  <circle cx="483.3" cy="385" r="5" fill="#27ae60"/>
  <circle cx="483.3" cy="385" r="3" fill="#c0392b"/>

  <!-- Легенда графіка -->
  <rect x="435" y="145" width="165" height="60" rx="6" ry="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <line x1="445" y1="165" x2="470" y2="165" stroke="#c0392b" stroke-width="3"/>
  <circle cx="457.5" cy="165" r="3.5" fill="#c0392b"/>
  <text x="478" y="169" font-size="12" font-weight="700" fill="#c0392b">Стандартний</text>
  <line x1="445" y1="190" x2="470" y2="190" stroke="#27ae60" stroke-width="3"/>
  <circle cx="457.5" cy="190" r="3.5" fill="#27ae60"/>
  <text x="478" y="194" font-size="12" font-weight="700" fill="#27ae60">Logic-Level</text>

  <!-- Права панель з порівнянням -->
  <!-- Карточка 1: Стандартний MOSFET -->
  <rect x="630" y="75" width="290" height="200" rx="8" ry="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="645" y="102" font-size="14" font-weight="700" fill="#c0392b">Стандартний MOSFET</text>
  <text x="645" y="122" font-size="12" fill="#6b7280">(наприклад, IRF540N, 2N7002)</text>
  <text x="645" y="150" font-size="13" fill="#1a1a1a">• V<tspan font-size="11" dy="3">GS(th)</tspan><tspan font-size="13" dy="-3"> = 2.0 ... 4.0 В</tspan></text>
  <text x="645" y="175" font-size="13" fill="#1a1a1a">• Повне відкриття при V<tspan font-size="11" dy="3">GS</tspan><tspan font-size="13" dy="-3"> = 10 В</tspan></text>
  <text x="645" y="200" font-size="13" font-weight="700" fill="#c0392b">• При 3.3–5 В від МК:</text>
  <text x="660" y="220" font-size="12" fill="#c0392b">високий R_DS, перегрів і збій</text>

  <!-- Карточка 2: Logic-Level MOSFET -->
  <rect x="630" y="295" width="290" height="205" rx="8" ry="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="645" y="322" font-size="14" font-weight="700" fill="#27ae60">Logic-Level MOSFET</text>
  <text x="645" y="342" font-size="12" fill="#6b7280">(наприклад, IRLZ44N, AO3400A)</text>
  <text x="645" y="370" font-size="13" fill="#1a1a1a">• V<tspan font-size="11" dy="3">GS(th)</tspan><tspan font-size="13" dy="-3"> = 1.0 ... 2.0 В</tspan></text>
  <text x="645" y="395" font-size="13" fill="#1a1a1a">• Повне відкриття при V<tspan font-size="11" dy="3">GS</tspan><tspan font-size="13" dy="-3"> = 3.3 ... 5 В</tspan></text>
  <text x="645" y="420" font-size="13" font-weight="700" fill="#27ae60">• При 3.3–5 В від МК:</text>
  <text x="660" y="440" font-size="12" fill="#27ae60">R_DS мінімальний, ККД &gt; 95%</text>

</svg>
