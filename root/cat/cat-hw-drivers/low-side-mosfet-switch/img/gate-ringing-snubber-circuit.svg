<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Затворний звон MOSFET та методи його придушення</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Паразитна індуктивність провідників викликає звон V_GS, який гасять феритова намистина та RC-демпфер</text>

  <!-- LEFT PANEL: Waveforms -->
  <g id="left-panel">
    <!-- Panel Container -->
    <rect x="25" y="70" width="445" height="445" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    
    <!-- Panel Header -->
    <rect x="25" y="70" width="445" height="36" rx="8" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1"/>
    <rect x="25" y="96" width="445" height="10" fill="#eaf0fd"/>
    <line x1="25" y1="106" x2="470" y2="106" stroke="#d0d7de" stroke-width="1"/>
    <text x="247.5" y="93" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Осцилограма V_GS при вмиканні ключа</text>

    <!-- Graph Axes -->
    <!-- Y-axis -->
    <line x1="100" y1="340" x2="100" y2="135" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
    <text x="100" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">V_GS (В)</text>

    <!-- X-axis -->
    <line x1="100" y1="340" x2="440" y2="340" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
    <text x="435" y="362" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">Час t (нс)</text>

    <!-- Reference Level Lines -->
    <!-- V_GS,max line -->
    <line x1="100" y1="160" x2="430" y2="160" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4,4"/>
    <text x="92" y="164" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">V_GS,max</text>

    <!-- 10V Nominal line -->
    <line x1="100" y1="220" x2="430" y2="220" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="92" y="224" text-anchor="end" font-size="12" fill="#6b7280">10 В</text>

    <!-- V_GS(th) Threshold line -->
    <line x1="100" y1="300" x2="430" y2="300" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="92" y="304" text-anchor="end" font-size="12" fill="#6b7280">V_GS(th)</text>

    <!-- Red Ringing Waveform (Without Damping) -->
    <path d="M 100,340 L 125,340 C 137,340 150,142 165,142 C 178,142 185,270 195,270 C 205,270 212,190 222,190 C 232,190 238,235 248,235 C 258,235 265,212 275,212 C 285,212 295,223 310,220 L 430,220" fill="none" stroke="#c0392b" stroke-width="2.5"/>

    <!-- Green Damped Waveform (With FB + RC Snubber) -->
    <path d="M 100,340 L 125,340 C 150,340 170,220 210,220 L 430,220" fill="none" stroke="#27ae60" stroke-width="2.5"/>

    <!-- Ringing Peak Pointer/Callout -->
    <line x1="190" y1="130" x2="168" y2="140" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arr-red)"/>
    <text x="175" y="125" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">Спалах дзвону (&gt; V_GS,max)</text>

    <!-- Damped Edge Pointer/Callout -->
    <text x="210" y="252" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">Плавний фронт без дзвону</text>

    <!-- Legend Box -->
    <rect x="275" y="275" width="160" height="50" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <!-- Red legend entry -->
    <line x1="285" y1="292" x2="305" y2="292" stroke="#c0392b" stroke-width="2.5"/>
    <text x="312" y="296" text-anchor="start" font-size="12" fill="#c0392b">Без придушення</text>
    <!-- Green legend entry -->
    <line x1="285" y1="312" x2="305" y2="312" stroke="#27ae60" stroke-width="2.5"/>
    <text x="312" y="316" text-anchor="start" font-size="12" fill="#27ae60">З FB + RC (демпф.)</text>

    <!-- Bottom Problem Callout -->
    <rect x="37" y="390" width="421" height="52" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
    <text x="47" y="410" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">Без захисту: паразитна індуктивність L_trace і C_iss</text>
    <text x="47" y="428" text-anchor="start" font-size="12" fill="#c0392b">утворюють LC-контур, що викликає високочастотний звон.</text>

    <!-- Bottom Solution Callout -->
    <rect x="37" y="450" width="421" height="52" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
    <text x="47" y="470" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">З FB та RC-демпфером: розсіювання ВЧ-енергії дзвону</text>
    <text x="47" y="488" text-anchor="start" font-size="12" fill="#27ae60">забезпечує аперіодичний фронт V_GS без перенапруги.</text>
  </g>

  <!-- RIGHT PANEL: Schematic Diagram -->
  <g id="right-panel">
    <!-- Panel Container -->
    <rect x="490" y="70" width="445" height="445" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    
    <!-- Panel Header -->
    <rect x="490" y="70" width="445" height="36" rx="8" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1"/>
    <rect x="490" y="96" width="445" height="10" fill="#eaf0fd"/>
    <line x1="490" y1="106" x2="935" y2="106" stroke="#d0d7de" stroke-width="1"/>
    <text x="712.5" y="93" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Схема низькостороннього ключа з демпфуванням</text>

    <!-- Top Rail (+VDD) -->
    <line x1="810" y1="135" x2="860" y2="135" stroke="#1a1a1a" stroke-width="2"/>
    <text x="835" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">+V_DD</text>

    <!-- Load Block -->
    <rect x="810" y="145" width="50" height="35" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="835" y="167" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Load</text>
    <line x1="835" y1="180" x2="835" y2="239" stroke="#1a1a1a" stroke-width="1.5"/>

    <!-- Driver Block -->
    <rect x="508" y="225" width="55" height="55" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="535.5" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Driver</text>
    <text x="535.5" y="266" text-anchor="middle" font-size="12" fill="#6b7280">OUT</text>

    <!-- Wire from Driver OUT -->
    <line x1="563" y1="250" x2="575" y2="250" stroke="#1a1a1a" stroke-width="1.5"/>

    <!-- L_trace (Parasitic Inductance) -->
    <path d="M 575,250 C 575,238 586,238 586,250 C 586,238 597,238 597,250 C 597,238 608,238 608,250 C 608,238 619,238 619,250" fill="none" stroke="#c0392b" stroke-width="1.8"/>
    <line x1="619" y1="250" x2="630" y2="250" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="597" y="210" text-anchor="middle" font-size="12" fill="#c0392b">(паразитна)</text>
    <text x="597" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">L_trace</text>

    <!-- Ferrite Bead (FB) -->
    <line x1="630" y1="250" x2="670" y2="250" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="637" y="240" width="26" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <line x1="645" y1="242" x2="645" y2="258" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="655" y1="242" x2="655" y2="258" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="650" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">FB</text>
    <text x="650" y="278" text-anchor="middle" font-size="12" fill="#2457d6">Намистина</text>

    <!-- Gate Resistor (R_G) -->
    <line x1="670" y1="250" x2="715" y2="250" stroke="#1a1a1a" stroke-width="1.5"/>
    <rect x="678" y="242" width="30" height="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="693" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">R_G</text>
    <line x1="715" y1="250" x2="740" y2="250" stroke="#1a1a1a" stroke-width="1.5"/>

    <!-- Node A (Junction at 740, 250) -->
    <circle cx="740" cy="250" r="3" fill="#1a1a1a"/>
    <line x1="740" y1="250" x2="780" y2="250" stroke="#1a1a1a" stroke-width="1.5"/>

    <!-- RC Snubber Branch at x=740 -->
    <line x1="740" y1="250" x2="740" y2="265" stroke="#27ae60" stroke-width="1.5"/>
    <!-- Resistor R_S -->
    <rect x="732" y="265" width="16" height="26" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
    <text x="724" y="282" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">R_S</text>
    <line x1="740" y1="291" x2="740" y2="303" stroke="#27ae60" stroke-width="1.5"/>
    <!-- Capacitor C_S -->
    <line x1="728" y1="303" x2="752" y2="303" stroke="#27ae60" stroke-width="2"/>
    <line x1="728" y1="309" x2="752" y2="309" stroke="#27ae60" stroke-width="2"/>
    <text x="724" y="311" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">C_S</text>
    <line x1="740" y1="309" x2="740" y2="340" stroke="#27ae60" stroke-width="1.5"/>
    <circle cx="740" cy="340" r="3" fill="#27ae60"/>
    <text x="740" y="365" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">RC-демпфер</text>

    <!-- Node B (Junction for C_iss at 780, 250) -->
    <circle cx="780" cy="250" r="3" fill="#c0392b"/>
    <line x1="780" y1="250" x2="815" y2="250" stroke="#1a1a1a" stroke-width="1.5"/>

    <!-- Parasitic Capacitance C_iss Branch at x=780 -->
    <line x1="780" y1="250" x2="780" y2="283" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
    <!-- Capacitor C_iss plates -->
    <line x1="770" y1="283" x2="790" y2="283" stroke="#c0392b" stroke-width="2"/>
    <line x1="770" y1="289" x2="790" y2="289" stroke="#c0392b" stroke-width="2"/>
    <text x="794" y="290" text-anchor="start" font-size="12" font-style="italic" fill="#c0392b">C_iss</text>
    <line x1="780" y1="289" x2="780" y2="340" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
    <circle cx="780" cy="340" r="3" fill="#c0392b"/>

    <!-- MOSFET Symbol -->
    <!-- Gate Plate -->
    <line x1="815" y1="235" x2="815" y2="265" stroke="#1a1a1a" stroke-width="2.5"/>
    <!-- Channel segments at x=821 -->
    <line x1="821" y1="235" x2="821" y2="243" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="821" y1="247" x2="821" y2="253" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="821" y1="257" x2="821" y2="265" stroke="#1a1a1a" stroke-width="2"/>
    <!-- Arrow on Bulk pointing left -->
    <path d="M 821,250 L 813,246 L 813,254 Z" fill="#1a1a1a"/>
    <!-- Connections -->
    <line x1="821" y1="239" x2="835" y2="239" stroke="#1a1a1a" stroke-width="1.5"/>
    <line x1="821" y1="250" x2="835" y2="250" stroke="#1a1a1a" stroke-width="1.5"/>
    <line x1="821" y1="261" x2="835" y2="261" stroke="#1a1a1a" stroke-width="1.5"/>
    <line x1="835" y1="250" x2="835" y2="261" stroke="#1a1a1a" stroke-width="1.5"/>
    <line x1="835" y1="261" x2="835" y2="340" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- Circle -->
    <circle cx="828" cy="250" r="23" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <!-- MOSFET label -->
    <text x="860" y="254" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">MOSFET</text>

    <!-- Ground Rail & Symbol -->
    <line x1="535.5" y1="280" x2="535.5" y2="340" stroke="#1a1a1a" stroke-width="1.5"/>
    <line x1="535.5" y1="340" x2="835" y2="340" stroke="#1a1a1a" stroke-width="1.8"/>
    <line x1="825" y1="340" x2="845" y2="340" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="829" y1="344" x2="841" y2="344" stroke="#1a1a1a" stroke-width="1.5"/>
    <line x1="833" y1="348" x2="837" y2="348" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="835" y="365" text-anchor="middle" font-size="12" fill="#6b7280">GND</text>

    <!-- Bottom Summary Box -->
    <rect x="502" y="390" width="421" height="112" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <text x="514" y="410" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">Призначення елементів придушення:</text>
    <text x="514" y="430" text-anchor="start" font-size="12" fill="#1a1a1a">• FB: Пригнічує ВЧ-резонанс (10–100 МГц) без втрат на DC.</text>
    <text x="514" y="450" text-anchor="start" font-size="12" fill="#1a1a1a">• R_S + C_S: Демпфує L_trace + C_iss і поглинає ВЧ-енергію.</text>
    <text x="514" y="470" text-anchor="start" font-size="12" fill="#1a1a1a">• R_G: Обмежує струм перезаряду ємності затвора C_iss.</text>
    <text x="514" y="490" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">• Результат: Ліквідація дзвону та захист затвора від пробою.</text>
  </g>
</svg>
