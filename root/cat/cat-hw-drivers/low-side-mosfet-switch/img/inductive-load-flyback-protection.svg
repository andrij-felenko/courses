<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Markers -->
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Захист низькостороннього MOSFET-ключа від зворотної ЕРС індуктивного навантаження</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Шляхи проходження струму самоіндукції I_ind при розмиканні транзистора (V_GS → 0 В)</text>

  <!-- ================= PANEL 1: FLYBACK DIODE ================= -->
  <rect x="25" y="65" width="440" height="435" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Panel 1 Header -->
  <text x="245" y="88" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Захист зворотним діодом (Flyback Diode)</text>
  <text x="245" y="108" font-size="12" font-weight="600" fill="#27ae60" text-anchor="middle">Обмеження напруги: V_DS = V_CC + V_F (~0.7 В)</text>

  <!-- Panel 1 Current Loop Label -->
  <text x="255" y="128" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Струм самоіндукції I_ind</text>

  <!-- Panel 1 Power Rail -->
  <text x="65" y="138" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">+V_CC (+12В)</text>
  <line x1="150" y1="155" x2="340" y2="155" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="150" cy="155" r="3" fill="#1a1a1a"/>

  <!-- Panel 1 Ground Rail & Symbols -->
  <line x1="150" y1="410" x2="250" y2="410" stroke="#1a1a1a" stroke-width="2"/>
  <!-- GND at x=185 -->
  <line x1="185" y1="410" x2="185" y2="418" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="175" y1="418" x2="195" y2="418" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="179" y1="422" x2="191" y2="422" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="183" y1="426" x2="187" y2="426" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Panel 1 Inductive Load (L + R_L) -->
  <rect x="180" y="165" width="60" height="90" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 3" rx="4"/>
  <!-- Load Coil -->
  <path d="M 210,172 C 222,172 222,185 210,185 C 222,185 222,198 210,198 C 222,198 222,211 210,211 C 222,211 222,224 210,224" fill="none" stroke="#2457d6" stroke-width="2"/>
  <!-- Load Resistor -->
  <rect x="203" y="228" width="14" height="20" fill="white" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Panel 1 Load Labels -->
  <text x="160" y="185" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">Навантаження</text>
  <text x="160" y="203" font-size="12" fill="#6b7280" text-anchor="end">(L, R_L)</text>
  <text x="160" y="230" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">e_L = -L(di/dt)</text>
  <!-- Polarity Marks -->
  <text x="193" y="182" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">−</text>
  <text x="193" y="242" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">+</text>

  <!-- Panel 1 Flyback Diode Box & Symbol -->
  <rect x="275" y="180" width="50" height="55" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <!-- Diode Wires -->
  <line x1="300" y1="155" x2="300" y2="195" stroke="#27ae60" stroke-width="2"/>
  <line x1="300" y1="220" x2="300" y2="260" stroke="#27ae60" stroke-width="2"/>
  <!-- Diode Triangle & Bar -->
  <polygon points="300,195 290,215 310,215" fill="#27ae60"/>
  <line x1="290" y1="195" x2="310" y2="195" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Panel 1 Diode Labels -->
  <text x="335" y="198" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="start">D_flyback</text>
  <text x="335" y="216" font-size="12" fill="#6b7280" text-anchor="start">(Зворотний діод)</text>

  <!-- Panel 1 Circuit Interconnects -->
  <!-- Wire from +Vcc to Load -->
  <line x1="210" y1="155" x2="210" y2="165" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Wire from Load to Drain node -->
  <line x1="210" y1="255" x2="210" y2="260" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="210" cy="260" r="3" fill="#1a1a1a"/>
  <!-- Wire from Drain node to Diode bottom -->
  <line x1="210" y1="260" x2="300" y2="260" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Panel 1 Current Loop (Dashed Overlay) -->
  <path d="M 210,250 L 210,155 L 300,155 L 300,260 L 210,260" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="6 4"/>
  <!-- Loop Direction Arrows -->
  <line x1="210" y1="230" x2="210" y2="200" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <line x1="270" y1="155" x2="240" y2="155" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <line x1="300" y1="210" x2="300" y2="175" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <line x1="240" y1="260" x2="275" y2="260" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <!-- Panel 1 Gate Control & MOSFET -->
  <!-- Input Signal Line -->
  <line x1="40" y1="340" x2="105" y2="340" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-black)"/>
  <text x="40" y="308" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">V_IN = 0 В</text>
  <text x="40" y="325" font-size="12" fill="#6b7280" text-anchor="start">(вимкнено)</text>

  <!-- Gate Resistor R_G -->
  <rect x="105" y="333" width="40" height="14" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="125" y="322" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">R_G</text>

  <!-- Wire R_G to Node -->
  <line x1="145" y1="340" x2="160" y2="340" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="160" cy="340" r="3" fill="#1a1a1a"/>

  <!-- Pull-down Resistor R_GS -->
  <line x1="160" y1="340" x2="160" y2="355" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="153" y="355" width="14" height="30" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="160" y1="385" x2="160" y2="410" stroke="#1a1a1a" stroke-width="2"/>
  <text x="147" y="378" font-size="12" fill="#1a1a1a" text-anchor="end">R_GS = 10k</text>

  <!-- Wire Node to Gate -->
  <line x1="160" y1="340" x2="198" y2="340" stroke="#1a1a1a" stroke-width="2"/>

  <!-- MOSFET Symbol (N-Channel) -->
  <!-- Gate Bar -->
  <line x1="198" y1="320" x2="198" y2="360" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- Channel Segments -->
  <line x1="204" y1="320" x2="204" y2="330" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="204" y1="337" x2="204" y2="343" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="204" y1="350" x2="204" y2="360" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Drain Connection -->
  <line x1="204" y1="325" x2="210" y2="325" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="210" y1="260" x2="210" y2="325" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Bulk & Source Connections -->
  <line x1="204" y1="340" x2="210" y2="340" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Bulk Arrow pointing left -->
  <polygon points="204,340 209,337 209,343" fill="#1a1a1a"/>
  <line x1="204" y1="355" x2="210" y2="355" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="210" y1="340" x2="210" y2="410" stroke="#1a1a1a" stroke-width="2"/>

  <!-- MOSFET Labels -->
  <text x="225" y="340" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">Q1 (N-Ch)</text>
  <text x="225" y="358" font-size="12" fill="#c0392b" text-anchor="start">V_GS = 0 В</text>

  <!-- Panel 1 Bottom Summary Box -->
  <rect x="40" y="428" width="410" height="58" fill="white" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="52" y="450" font-size="12" fill="#1a1a1a" text-anchor="start">• Напруга обрізається на рівні V_DS = V_CC + 0.7 В</text>
  <text x="52" y="470" font-size="12" fill="#6b7280" text-anchor="start">• Енергія розсіюється повільно через малий спад V_F</text>


  <!-- ================= PANEL 2: TVS CLAMPING ================= -->
  <rect x="495" y="65" width="440" height="435" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Panel 2 Header -->
  <text x="715" y="88" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Захист TVS-супресором (TVS Clamping)</text>
  <text x="715" y="108" font-size="12" font-weight="600" fill="#2457d6" text-anchor="middle">Швидка фіксація: V_DS = V_CC + V_BR</text>

  <!-- Panel 2 Current Loop Label -->
  <text x="725" y="128" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Струм самоіндукції I_ind</text>

  <!-- Panel 2 Power Rail -->
  <text x="535" y="138" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">+V_CC (+12В)</text>
  <line x1="620" y1="155" x2="810" y2="155" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="620" cy="155" r="3" fill="#1a1a1a"/>

  <!-- Panel 2 Ground Rail & Symbols -->
  <line x1="620" y1="410" x2="720" y2="410" stroke="#1a1a1a" stroke-width="2"/>
  <!-- GND at x=655 -->
  <line x1="655" y1="410" x2="655" y2="418" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="645" y1="418" x2="665" y2="418" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="649" y1="422" x2="661" y2="422" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="653" y1="426" x2="657" y2="426" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Panel 2 Inductive Load (L + R_L) -->
  <rect x="650" y="165" width="60" height="90" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 3" rx="4"/>
  <!-- Load Coil -->
  <path d="M 680,172 C 692,172 692,185 680,185 C 692,185 692,198 680,198 C 692,198 692,211 680,211 C 692,211 692,224 680,224" fill="none" stroke="#2457d6" stroke-width="2"/>
  <!-- Load Resistor -->
  <rect x="673" y="228" width="14" height="20" fill="white" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Panel 2 Load Labels -->
  <text x="630" y="185" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">Навантаження</text>
  <text x="630" y="203" font-size="12" fill="#6b7280" text-anchor="end">(L, R_L)</text>
  <text x="630" y="230" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">e_L = -L(di/dt)</text>
  <!-- Polarity Marks -->
  <text x="663" y="182" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">−</text>
  <text x="663" y="242" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">+</text>

  <!-- Panel 2 TVS Diode Box & Symbol -->
  <rect x="745" y="180" width="50" height="55" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <!-- TVS Wires -->
  <line x1="770" y1="155" x2="770" y2="195" stroke="#2457d6" stroke-width="2"/>
  <line x1="770" y1="220" x2="770" y2="260" stroke="#2457d6" stroke-width="2"/>
  <!-- TVS Triangle & Zener Bar -->
  <polygon points="770,195 760,215 780,215" fill="#2457d6"/>
  <!-- Zener/TVS Bar with hooks -->
  <line x1="760" y1="195" x2="780" y2="195" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="760" y1="195" x2="760" y2="201" stroke="#2457d6" stroke-width="2"/>
  <line x1="780" y1="195" x2="780" y2="189" stroke="#2457d6" stroke-width="2"/>

  <!-- Panel 2 TVS Labels -->
  <text x="805" y="198" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="start">D_TVS (Супресор)</text>
  <text x="805" y="216" font-size="12" fill="#6b7280" text-anchor="start">(V_BR > V_CC)</text>

  <!-- Panel 2 Circuit Interconnects -->
  <!-- Wire from +Vcc to Load -->
  <line x1="680" y1="155" x2="680" y2="165" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Wire from Load to Drain node -->
  <line x1="680" y1="255" x2="680" y2="260" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="680" cy="260" r="3" fill="#1a1a1a"/>
  <!-- Wire from Drain node to TVS bottom -->
  <line x1="680" y1="260" x2="770" y2="260" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Panel 2 Current Loop (Dashed Overlay) -->
  <path d="M 680,250 L 680,155 L 770,155 L 770,260 L 680,260" fill="none" stroke="#2457d6" stroke-width="2.5" stroke-dasharray="6 4"/>
  <!-- Loop Direction Arrows -->
  <line x1="680" y1="230" x2="680" y2="200" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <line x1="740" y1="155" x2="710" y2="155" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <line x1="770" y1="210" x2="770" y2="175" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <line x1="710" y1="260" x2="745" y2="260" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- Panel 2 Gate Control & MOSFET -->
  <!-- Input Signal Line -->
  <line x1="510" y1="340" x2="575" y2="340" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-black)"/>
  <text x="510" y="308" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">V_IN = 0 В</text>
  <text x="510" y="325" font-size="12" fill="#6b7280" text-anchor="start">(вимкнено)</text>

  <!-- Gate Resistor R_G -->
  <rect x="575" y="333" width="40" height="14" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="595" y="322" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">R_G</text>

  <!-- Wire R_G to Node -->
  <line x1="615" y1="340" x2="630" y2="340" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="630" cy="340" r="3" fill="#1a1a1a"/>

  <!-- Pull-down Resistor R_GS -->
  <line x1="630" y1="340" x2="630" y2="355" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="623" y="355" width="14" height="30" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="630" y1="385" x2="630" y2="410" stroke="#1a1a1a" stroke-width="2"/>
  <text x="617" y="378" font-size="12" fill="#1a1a1a" text-anchor="end">R_GS = 10k</text>

  <!-- Wire Node to Gate -->
  <line x1="630" y1="340" x2="668" y2="340" stroke="#1a1a1a" stroke-width="2"/>

  <!-- MOSFET Symbol (N-Channel) -->
  <!-- Gate Bar -->
  <line x1="668" y1="320" x2="668" y2="360" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- Channel Segments -->
  <line x1="674" y1="320" x2="674" y2="330" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="674" y1="337" x2="674" y2="343" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="674" y1="350" x2="674" y2="360" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Drain Connection -->
  <line x1="674" y1="325" x2="680" y2="325" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="680" y1="260" x2="680" y2="325" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Bulk & Source Connections -->
  <line x1="674" y1="340" x2="680" y2="340" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Bulk Arrow pointing left -->
  <polygon points="674,340 679,337 679,343" fill="#1a1a1a"/>
  <line x1="674" y1="355" x2="680" y2="355" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="680" y1="340" x2="680" y2="410" stroke="#1a1a1a" stroke-width="2"/>

  <!-- MOSFET Labels -->
  <text x="695" y="340" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">Q1 (N-Ch)</text>
  <text x="695" y="358" font-size="12" fill="#c0392b" text-anchor="start">V_GS = 0 В</text>

  <!-- Panel 2 Bottom Summary Box -->
  <rect x="510" y="428" width="410" height="58" fill="white" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="522" y="450" font-size="12" fill="#1a1a1a" text-anchor="start">• Напруга обрізається на рівні V_DS = V_CC + V_BR</text>
  <text x="522" y="470" font-size="12" fill="#6b7280" text-anchor="start">• Енергія розсіюється швидко завдяки високій напрузі V_BR</text>
</svg>
