<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-purple" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-start-gray" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-start-purple" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#7c3aed"/>
    </marker>
    <marker id="arr-start-red" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часові діаграми комутації MOSFET та ефект плато Міллера</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Фронти V_GS і V_DS, тривалість плато Міллера та індуктивний сплеск при вимкненні</text>

  <!-- Left Panel: Waveforms -->
  <rect x="25" y="68" width="610" height="392" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Shaded Miller Plateau & Spike Regions -->
  <rect x="200" y="90" width="75" height="330" fill="#f3e8ff" fill-opacity="0.6"/>
  <line x1="200" y1="90" x2="200" y2="420" stroke="#c084fc" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="275" y1="90" x2="275" y2="420" stroke="#c084fc" stroke-width="1" stroke-dasharray="3,3"/>

  <rect x="415" y="90" width="65" height="330" fill="#f3e8ff" fill-opacity="0.6"/>
  <line x1="415" y1="90" x2="415" y2="420" stroke="#c084fc" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="480" y1="90" x2="480" y2="420" stroke="#c084fc" stroke-width="1" stroke-dasharray="3,3"/>

  <rect x="480" y="248" width="65" height="172" fill="#fdecea" fill-opacity="0.5"/>
  <line x1="545" y1="248" x2="545" y2="420" stroke="#fca5a5" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Grid Reference Lines for V_GS plot -->
  <line x1="125" y1="115" x2="575" y2="115" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="125" y1="155" x2="575" y2="155" stroke="#c084fc" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="125" y1="180" x2="575" y2="180" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="125" y1="210" x2="575" y2="210" stroke="#94a3b8" stroke-width="1"/>

  <!-- Grid Reference Lines for V_DS plot -->
  <line x1="125" y1="265" x2="575" y2="265" stroke="#fca5a5" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="125" y1="315" x2="575" y2="315" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="125" y1="400" x2="575" y2="400" stroke="#94a3b8" stroke-width="1"/>

  <!-- Y Axes -->
  <line x1="125" y1="215" x2="125" y2="100" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="125" y1="405" x2="125" y2="255" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Time Axis -->
  <line x1="125" y1="420" x2="575" y2="420" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="580" y="423" font-size="12" font-weight="bold" fill="#1a1a1a">Час (t)</text>

  <!-- Plot Titles -->
  <text x="125" y="82" font-size="13" font-weight="bold" fill="#2457d6">Напруга затвора V_GS(t)</text>
  <text x="125" y="240" font-size="13" font-weight="bold" fill="#d97706">Напруга стока V_DS(t)</text>

  <!-- Y-axis Tick Labels V_GS -->
  <text x="117" y="119" font-size="12" fill="#2457d6" text-anchor="end">V_DRV (3.3V)</text>
  <text x="117" y="159" font-size="12" fill="#7c3aed" font-weight="bold" text-anchor="end">V_GS,Miller</text>
  <text x="117" y="184" font-size="12" fill="#6b7280" text-anchor="end">V_GS(th)</text>
  <text x="117" y="214" font-size="12" fill="#6b7280" text-anchor="end">0 V</text>

  <!-- Y-axis Tick Labels V_DS -->
  <text x="117" y="269" font-size="12" fill="#c0392b" font-weight="bold" text-anchor="end">V_spike</text>
  <text x="117" y="319" font-size="12" fill="#6b7280" text-anchor="end">V_DD</text>
  <text x="117" y="404" font-size="12" fill="#6b7280" text-anchor="end">V_DS(on)</text>

  <!-- Large R_G Comparison Waveforms (Dashed Lines) -->
  <path d="M 125 210 L 160 210 L 225 155 L 310 155 L 365 115 L 370 115 L 425 155 L 500 155 L 560 210 L 570 210" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
  <path d="M 125 315 L 225 315 L 310 400 L 370 400 L 425 400 L 500 315 C 510 305, 520 310, 530 315 L 570 315" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Main Signal Waveforms -->
  <path d="M 125 210 L 160 210 L 200 155 L 275 155 L 325 115 L 370 115 L 415 155 L 480 155 L 545 210 L 570 210" fill="none" stroke="#2457d6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 125 315 L 200 315 L 275 400 L 370 400 L 415 400 L 480 315" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M 480 315 C 490 270, 500 260, 510 305 C 515 325, 525 320, 535 315 L 570 315" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Label for Large R_G curve -->
  <text x="340" y="197" font-size="11" fill="#64748b" text-anchor="middle">-- -- Більший R_G (повільніше)</text>

  <!-- Waveform Annotations -->
  <text x="237" y="102" font-size="12" font-weight="bold" fill="#7c3aed" text-anchor="middle">Плато Міллера (t_gp)</text>
  <text x="447" y="102" font-size="12" font-weight="bold" fill="#7c3aed" text-anchor="middle">Плато Міллера</text>

  <text x="512" y="238" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Індуктивний сплеск V_spike</text>
  <text x="512" y="252" font-size="11" fill="#c0392b" text-anchor="middle">(L_load · di/dt)</text>

  <!-- Time Phase Measurement Arrows & Labels -->
  <line x1="160" y1="434" x2="200" y2="434" stroke="#6b7280" stroke-width="1" marker-start="url(#arr-start-gray)" marker-end="url(#arr-gray)"/>
  <text x="178" y="448" font-size="11" fill="#6b7280" text-anchor="middle">t_d(on)</text>

  <line x1="200" y1="434" x2="275" y2="434" stroke="#7c3aed" stroke-width="1" marker-start="url(#arr-start-purple)" marker-end="url(#arr-purple)"/>
  <text x="243" y="448" font-size="11" font-weight="bold" fill="#7c3aed" text-anchor="middle">t_Miller(on)</text>

  <line x1="370" y1="434" x2="415" y2="434" stroke="#6b7280" stroke-width="1" marker-start="url(#arr-start-gray)" marker-end="url(#arr-gray)"/>
  <text x="386" y="448" font-size="11" fill="#6b7280" text-anchor="middle">t_d(off)</text>

  <line x1="415" y1="434" x2="480" y2="434" stroke="#7c3aed" stroke-width="1" marker-start="url(#arr-start-purple)" marker-end="url(#arr-purple)"/>
  <text x="452" y="448" font-size="11" font-weight="bold" fill="#7c3aed" text-anchor="middle">t_Miller(off)</text>

  <line x1="480" y1="434" x2="545" y2="434" stroke="#c0392b" stroke-width="1" marker-start="url(#arr-start-red)" marker-end="url(#arr-red)"/>
  <text x="516" y="448" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">t_spike</text>

  <!-- Right Panel: Analysis & Explanations -->
  <rect x="655" y="68" width="280" height="392" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <text x="795" y="93" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Аналіз процесів комутації</text>

  <!-- Box 1: Miller Plateau -->
  <rect x="667" y="107" width="256" height="98" rx="6" fill="#f3e8ff" stroke="#c084fc" stroke-width="1"/>
  <text x="677" y="124" font-size="12" font-weight="bold" fill="#6b21a8">1. Ефект плато Міллера (t_gp)</text>
  <text x="677" y="142" font-size="12" fill="#4c1d95">• V_GS фіксується на V_GS,Miller</text>
  <text x="677" y="160" font-size="12" fill="#4c1d95">• Струм I_G перезаряджає C_gd</text>
  <text x="677" y="178" font-size="12" fill="#4c1d95">• Напруга V_DS активно змінюється</text>
  <text x="677" y="194" font-size="12" fill="#4c1d95">• Максимум втрат увімкнення P_sw</text>

  <!-- Box 2: Inductive Spike -->
  <rect x="667" y="219" width="256" height="98" rx="6" fill="#fdecea" stroke="#fca5a5" stroke-width="1"/>
  <text x="677" y="236" font-size="12" font-weight="bold" fill="#991b1b">2. Індуктивний сплеск V_spike</text>
  <text x="677" y="254" font-size="12" fill="#7f1d1d">• Сплеск при вимкненні: L · di/dt</text>
  <text x="677" y="272" font-size="12" fill="#7f1d1d">• Небезпека пробою (V_DS &gt; V_DSS)</text>
  <text x="677" y="290" font-size="12" fill="#7f1d1d">• Захист: паралельний діод Шотткі</text>
  <text x="677" y="306" font-size="12" fill="#7f1d1d">• Обмежує сплеск до V_DD + V_F</text>

  <!-- Box 3: Role of R_G -->
  <rect x="667" y="331" width="256" height="117" rx="6" fill="#e9f7ef" stroke="#6ee7b7" stroke-width="1"/>
  <text x="677" y="347" font-size="12" font-weight="bold" fill="#065f46">3. Вплив резистора R_G</text>
  <text x="677" y="364" font-size="12" font-weight="bold" fill="#047857">Більший R_G (повільніше):</text>
  <text x="677" y="380" font-size="12" fill="#065f46">  + Зменшує V_spike та EMI</text>
  <text x="677" y="395" font-size="12" fill="#065f46">  – Подовжує плато й ростуть P_sw</text>
  <text x="677" y="412" font-size="12" font-weight="bold" fill="#047857">Менший R_G (швидше):</text>
  <text x="677" y="427" font-size="12" fill="#065f46">  + Менші втрати P_sw</text>
  <text x="677" y="441" font-size="12" fill="#065f46">  – Росте сплеск V_spike та завади</text>

  <!-- Bottom Legend Panel -->
  <rect x="25" y="470" width="910" height="50" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <line x1="45" y1="495" x2="75" y2="495" stroke="#2457d6" stroke-width="2.5"/>
  <text x="82" y="499" font-size="12" fill="#1a1a1a">V_GS — напруга затвор-витік</text>

  <line x1="280" y1="495" x2="310" y2="495" stroke="#d97706" stroke-width="2.5"/>
  <text x="317" y="499" font-size="12" fill="#1a1a1a">V_DS — напруга стік-витік</text>

  <rect x="505" y="488" width="22" height="14" fill="#f3e8ff" stroke="#c084fc"/>
  <text x="534" y="499" font-size="12" fill="#1a1a1a">Плато Міллера (t_gp)</text>

  <rect x="680" y="488" width="22" height="14" fill="#fdecea" stroke="#fca5a5"/>
  <text x="709" y="499" font-size="12" fill="#1a1a1a">Індуктивний сплеск (V_spike)</text>
</svg>
