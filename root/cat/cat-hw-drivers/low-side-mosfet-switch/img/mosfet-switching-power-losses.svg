<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Динамічні та статичні втрати потужності MOSFET</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Перекриття напруги V_DS та струму I_DS під час комутації створює сплески миттєвої потужності P(t)</text>

  <!-- Верхня панель легенди -->
  <rect x="60" y="74" width="840" height="34" rx="6" fill="#f4f6f8" stroke="#d0d7de"/>
  
  <line x1="80" y1="91" x2="105" y2="91" stroke="#8e44ad" stroke-width="2.5"/>
  <text x="112" y="95" font-size="12" font-weight="600" fill="#1a1a1a">V_GS (Керування)</text>

  <line x1="270" y1="91" x2="295" y2="91" stroke="#2457d6" stroke-width="2.5"/>
  <text x="302" y="95" font-size="12" font-weight="600" fill="#1a1a1a">V_DS (Напруга стоку)</text>

  <line x1="490" y1="91" x2="515" y2="91" stroke="#27ae60" stroke-width="2.5"/>
  <text x="522" y="95" font-size="12" font-weight="600" fill="#1a1a1a">I_DS (Струм стоку)</text>

  <rect x="680" y="85" width="20" height="12" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="706" y="95" font-size="12" font-weight="600" fill="#1a1a1a">P(t) (Потужність втрат)</text>

  <!-- Вертикальні сіткові лінії фаз перемикання -->
  <line x1="170" y1="125" x2="170" y2="465" stroke="#d0d7de" stroke-dasharray="3,3"/>
  <line x1="230" y1="125" x2="230" y2="465" stroke="#d0d7de" stroke-dasharray="3,3"/>
  <line x1="290" y1="125" x2="290" y2="465" stroke="#d0d7de" stroke-dasharray="3,3"/>
  <line x1="370" y1="125" x2="370" y2="465" stroke="#d0d7de" stroke-dasharray="3,3"/>
  <line x1="410" y1="125" x2="410" y2="465" stroke="#d0d7de" stroke-dasharray="3,3"/>
  <line x1="570" y1="125" x2="570" y2="465" stroke="#d0d7de" stroke-dasharray="3,3"/>
  <line x1="630" y1="125" x2="630" y2="465" stroke="#d0d7de" stroke-dasharray="3,3"/>
  <line x1="710" y1="125" x2="710" y2="465" stroke="#d0d7de" stroke-dasharray="3,3"/>
  <line x1="770" y1="125" x2="770" y2="465" stroke="#d0d7de" stroke-dasharray="3,3"/>
  <line x1="810" y1="125" x2="810" y2="465" stroke="#d0d7de" stroke-dasharray="3,3"/>

  <!-- ==================== ПЛОТ 1: V_GS(t) ==================== -->
  <line x1="110" y1="200" x2="850" y2="200" stroke="#d0d7de"/>
  <line x1="110" y1="125" x2="110" y2="200" stroke="#1a1a1a"/>
  <line x1="850" y1="125" x2="850" y2="200" stroke="#d0d7de"/>

  <!-- Допоміжні лінії рівнів V_GS -->
  <line x1="110" y1="130" x2="850" y2="130" stroke="#8e44ad" stroke-dasharray="3,3" opacity="0.3"/>
  <line x1="110" y1="155" x2="850" y2="155" stroke="#8e44ad" stroke-dasharray="4,4" opacity="0.5"/>
  <line x1="110" y1="175" x2="850" y2="175" stroke="#8e44ad" stroke-dasharray="3,3" opacity="0.3"/>

  <!-- Області плато Міллера в Plot 1 -->
  <rect x="290" y="130" width="80" height="70" fill="#eaf0fd" opacity="0.6" stroke="#2457d6" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="330" y="146" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Плато Міллера (V_GP)</text>

  <rect x="630" y="130" width="80" height="70" fill="#eaf0fd" opacity="0.6" stroke="#2457d6" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="670" y="146" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Плато Міллера (V_GP)</text>

  <!-- Крива V_GS(t) -->
  <path d="M 110,200 L 170,200 L 230,175 L 290,155 L 370,155 L 410,130 L 570,130 L 630,155 L 710,155 L 770,175 L 810,200 L 850,200" fill="none" stroke="#8e44ad" stroke-width="2.5"/>

  <!-- Заголовок тамітки оси Plot 1 -->
  <text x="115" y="124" font-size="12" font-weight="bold" fill="#8e44ad">V_GS [В]</text>
  <text x="104" y="139" font-size="11" fill="#8e44ad" text-anchor="end">V_DRV</text>
  <text x="104" y="164" font-size="12" font-weight="bold" fill="#8e44ad" text-anchor="end">V_GP</text>
  <text x="104" y="184" font-size="11" fill="#8e44ad" text-anchor="end">V_GS(th)</text>
  <text x="104" y="204" font-size="11" fill="#6b7280" text-anchor="end">0 В</text>

  <!-- ==================== ПЛОТ 2: V_DS(t) та I_DS(t) ==================== -->
  <line x1="110" y1="340" x2="850" y2="340" stroke="#d0d7de"/>
  <line x1="110" y1="235" x2="110" y2="340" stroke="#1a1a1a"/>
  <line x1="850" y1="235" x2="850" y2="340" stroke="#1a1a1a"/>

  <!-- Лінії рівнів V_DD та V_DS(on) -->
  <line x1="110" y1="245" x2="850" y2="245" stroke="#d0d7de" stroke-dasharray="3,3"/>
  <line x1="110" y1="329" x2="850" y2="329" stroke="#2457d6" stroke-dasharray="2,2" opacity="0.4"/>

  <!-- Зони перекриття V-I під час увімкнення й вимкнення -->
  <rect x="230" y="235" width="140" height="105" fill="#fdecea" opacity="0.3" stroke="#c0392b" stroke-dasharray="2,2"/>
  <rect x="630" y="235" width="140" height="105" fill="#fdecea" opacity="0.3" stroke="#c0392b" stroke-dasharray="2,2"/>

  <!-- Крива V_DS(t) (Синя) -->
  <path d="M 110,245 L 290,245 L 370,329 L 570,329 L 630,329 L 710,245 L 850,245" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Крива I_DS(t) (Зелена) -->
  <path d="M 110,340 L 230,340 L 290,245 L 710,245 L 770,340 L 850,340" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Заголовки тамітки осей Plot 2 -->
  <text x="115" y="232" font-size="12" font-weight="bold" fill="#2457d6">V_DS [В]</text>
  <text x="845" y="232" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">I_DS [А]</text>

  <text x="104" y="254" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">V_DD</text>
  <text x="104" y="329" font-size="11" fill="#2457d6" text-anchor="end">V_DS(on)</text>
  <text x="104" y="344" font-size="11" fill="#6b7280" text-anchor="end">0 В</text>

  <text x="856" y="254" font-size="12" font-weight="bold" fill="#27ae60">I_D</text>
  <text x="856" y="344" font-size="11" fill="#6b7280">0 А</text>

  <!-- ==================== ПЛОТ 3: P(t) ==================== -->
  <line x1="110" y1="465" x2="850" y2="465" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="110" y1="370" x2="110" y2="465" stroke="#1a1a1a"/>
  <line x1="850" y1="370" x2="850" y2="465" stroke="#d0d7de"/>

  <!-- Рівень P_max -->
  <line x1="110" y1="385" x2="850" y2="385" stroke="#c0392b" stroke-dasharray="3,3" opacity="0.4"/>

  <!-- Заштриховані області втрат енергії E_on, P_stat, E_off -->
  <path d="M 230,465 L 290,385 L 370,458 L 410,458 L 410,465 Z" fill="#fdecea" opacity="0.85" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="410" y="456" width="160" height="9" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <path d="M 570,465 L 570,458 L 630,458 L 710,385 L 770,465 Z" fill="#fdecea" opacity="0.85" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Текстові підписи втрат у Plot 3 -->
  <text x="310" y="418" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">E_on</text>
  <text x="310" y="433" font-size="11" font-weight="600" fill="#c0392b" text-anchor="middle">Динамічні втрати</text>

  <text x="490" y="446" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">P_stat = I_D² · R_DS(on)</text>

  <text x="690" y="418" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">E_off</text>
  <text x="690" y="433" font-size="11" font-weight="600" fill="#c0392b" text-anchor="middle">Динамічні втрати</text>

  <!-- Заголовок тамітки осей Plot 3 -->
  <text x="115" y="368" font-size="12" font-weight="bold" fill="#c0392b">P(t) [Вт]</text>

  <text x="104" y="394" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">P_max</text>
  <text x="104" y="455" font-size="10" fill="#27ae60" text-anchor="end">P_stat</text>
  <text x="104" y="470" font-size="11" fill="#6b7280" text-anchor="end">0 Вт</text>

  <!-- Вісь часу t -->
  <path d="M 850,461 L 858,465 L 850,469 Z" fill="#1a1a1a"/>
  <text x="866" y="469" font-size="13" font-weight="bold" fill="#1a1a1a">t</text>

  <!-- ==================== НИЖНІ АНОТАЦІЇ ФАЗ КАТЕГОРІЙ ==================== -->
  <!-- Лінії виміру фаз -->
  <line x1="170" y1="482" x2="410" y2="482" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
  <line x1="410" y1="482" x2="570" y2="482" stroke="#27ae60" stroke-width="1.5" marker-start="url(#arr-green)" marker-end="url(#arr-green)"/>
  <line x1="570" y1="482" x2="810" y2="482" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-red)" marker-end="url(#arr-red)"/>

  <!-- Підписи головних фаз -->
  <text x="290" y="498" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Увімкнення (t_on)</text>
  <text x="490" y="498" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Відкритий стан (t_on_state)</text>
  <text x="690" y="498" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Вимкнення (t_off)</text>

  <!-- Підписи підінтервалів -->
  <text x="260" y="515" font-size="11" fill="#6b7280" text-anchor="middle">t_r (струм)</text>
  <text x="330" y="515" font-size="11" fill="#6b7280" text-anchor="middle">t_gp (плато)</text>

  <text x="670" y="515" font-size="11" fill="#6b7280" text-anchor="middle">t_rv (плато)</text>
  <text x="740" y="515" font-size="11" fill="#6b7280" text-anchor="middle">t_f (струм)</text>
</svg>
