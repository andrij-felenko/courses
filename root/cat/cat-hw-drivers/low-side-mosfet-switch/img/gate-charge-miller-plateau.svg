<svg width="960" height="540" viewBox="0 0 960 540" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Definitions -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Осцилограма увімкнення MOSFET: заряд затвора та плато Міллера</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Під час плато Міллера напруга V_DS спадає від V_DD до V_DS(on), а V_GS залишається на рівні V_plat</text>

  <!-- Highlight Area for Miller Plateau (Phase 3: X=450 to 630) -->
  <rect x="450" y="82" width="180" height="213" fill="#eaf0fd" fill-opacity="0.6" rx="4"/>
  <rect x="450" y="82" width="180" height="213" fill="none" stroke="#2457d6" stroke-opacity="0.4" stroke-dasharray="4 4" rx="4"/>

  <!-- Miller Plateau Pill Callout -->
  <rect x="480" y="86" width="140" height="36" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="550" y="101" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Плато Міллера</text>
  <text x="550" y="115" font-size="12" fill="#2457d6" text-anchor="middle">перезаряд C_gd</text>

  <!-- Horizontal Grid / Voltage Level Lines (Split around Miller Plateau callout) -->
  <line x1="130" y1="100" x2="440" y2="100" stroke="#e5e7eb" stroke-dasharray="3 3" stroke-width="1"/>
  <line x1="640" y1="100" x2="810" y2="100" stroke="#e5e7eb" stroke-dasharray="3 3" stroke-width="1"/>
  
  <line x1="130" y1="180" x2="440" y2="180" stroke="#2457d6" stroke-opacity="0.3" stroke-dasharray="3 3" stroke-width="1"/>
  <line x1="640" y1="180" x2="810" y2="180" stroke="#2457d6" stroke-opacity="0.3" stroke-dasharray="3 3" stroke-width="1"/>
  
  <line x1="130" y1="240" x2="810" y2="240" stroke="#e5e7eb" stroke-dasharray="3 3" stroke-width="1"/>

  <!-- Vertical Phase Boundary Lines -->
  <line x1="150" y1="82" x2="150" y2="295" stroke="#d0d7de" stroke-dasharray="4 4" stroke-width="1"/>
  <line x1="290" y1="82" x2="290" y2="295" stroke="#d0d7de" stroke-dasharray="4 4" stroke-width="1"/>
  <line x1="450" y1="82" x2="450" y2="295" stroke="#2457d6" stroke-opacity="0.5" stroke-dasharray="4 4" stroke-width="1"/>
  <line x1="630" y1="82" x2="630" y2="295" stroke="#2457d6" stroke-opacity="0.5" stroke-dasharray="4 4" stroke-width="1"/>
  <line x1="770" y1="82" x2="770" y2="295" stroke="#d0d7de" stroke-dasharray="4 4" stroke-width="1"/>

  <!-- Coordinate Axes -->
  <!-- Y-Axis -->
  <line x1="130" y1="295" x2="130" y2="82" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- X-Axis -->
  <line x1="130" y1="295" x2="815" y2="295" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Axis Titles -->
  <text x="130" y="70" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Напруга / Струм</text>
  <text x="825" y="315" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Час t (заряд Q_g)</text>

  <!-- Y-Axis Ticks & Labels -->
  <text x="122" y="104" font-size="12" fill="#1a1a1a" text-anchor="end">V_DD, V_DRV</text>
  <text x="122" y="184" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">V_plat</text>
  <text x="122" y="244" font-size="12" fill="#2457d6" text-anchor="end">V_GS(th)</text>
  <text x="122" y="299" font-size="12" fill="#6b7280" text-anchor="end">0 В</text>

  <!-- Time Ticks (X-Axis) -->
  <text x="150" y="315" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">t0</text>
  <text x="290" y="315" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">t1</text>
  <text x="450" y="315" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">t2</text>
  <text x="630" y="315" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">t3</text>
  <text x="770" y="315" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">t4</text>

  <!-- Signal Waveform Curves -->
  <!-- 1. Drain-Source Voltage V_DS (Red) -->
  <path d="M 130 100 L 450 100 L 630 290 L 800 290" fill="none" stroke="#c0392b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 2. Drain Current I_D (Green) -->
  <path d="M 130 295 L 290 295 L 450 130 L 800 130" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 3. Gate-Source Voltage V_GS (Blue) -->
  <path d="M 130 295 L 150 295 Q 220 285 290 240 Q 370 200 450 180 L 630 180 Q 700 130 770 110 L 800 110" fill="none" stroke="#2457d6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Phase Annotations Inside Graph -->
  <text x="220" y="210" font-size="12" fill="#2457d6" text-anchor="middle">Заряд C_gs</text>
  <text x="360" y="140" font-size="12" fill="#27ae60" text-anchor="middle">Зростання I_D</text>
  <text x="700" y="210" font-size="12" fill="#27ae60" text-anchor="middle">Повне насичення</text>

  <!-- Legend Bar -->
  <rect x="160" y="336" width="640" height="28" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <line x1="175" y1="350" x2="195" y2="350" stroke="#2457d6" stroke-width="3"/>
  <text x="202" y="354" font-size="12" font-weight="bold" fill="#2457d6">V_GS — напруга затвора</text>

  <line x1="380" y1="350" x2="400" y2="350" stroke="#c0392b" stroke-width="3"/>
  <text x="407" y="354" font-size="12" font-weight="bold" fill="#c0392b">V_DS — напруга стоку</text>

  <line x1="570" y1="350" x2="590" y2="350" stroke="#27ae60" stroke-width="2.5"/>
  <text x="597" y="354" font-size="12" font-weight="bold" fill="#27ae60">I_D — струм стоку</text>

  <!-- Bottom Cards: Phase Breakdown -->
  <!-- Card 1: Phase 1 -->
  <rect x="40" y="380" width="208" height="135" rx="6" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="52" y="402" font-size="13" font-weight="bold" fill="#1a1a1a">Фаза 1: t0 – t1</text>
  <text x="52" y="422" font-size="12" font-weight="bold" fill="#2457d6">Заряд C_gs</text>
  <text x="52" y="442" font-size="12" fill="#1a1a1a">• V_GS зростає до V_GS(th)</text>
  <text x="52" y="462" font-size="12" fill="#6b7280">• Струм стоку I_D = 0</text>
  <text x="52" y="482" font-size="12" fill="#6b7280">• Транзистор закритий</text>

  <!-- Card 2: Phase 2 -->
  <rect x="264" y="380" width="208" height="135" rx="6" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="276" y="402" font-size="13" font-weight="bold" fill="#1a1a1a">Фаза 2: t1 – t2</text>
  <text x="276" y="422" font-size="12" font-weight="bold" fill="#27ae60">Формування I_D</text>
  <text x="276" y="442" font-size="12" fill="#1a1a1a">• V_GS зростає до V_plat</text>
  <text x="276" y="462" font-size="12" fill="#27ae60">• I_D зростає 0 → I_D(max)</text>
  <text x="276" y="482" font-size="12" fill="#6b7280">• V_DS висока (V_DD)</text>

  <!-- Card 3: Phase 3 (Miller Plateau) -->
  <rect x="488" y="380" width="208" height="135" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="500" y="402" font-size="13" font-weight="bold" fill="#2457d6">Фаза 3: t2 – t3</text>
  <text x="500" y="422" font-size="12" font-weight="bold" fill="#2457d6">Плато Міллера</text>
  <text x="500" y="442" font-size="12" fill="#2457d6">• V_GS тримається = V_plat</text>
  <text x="500" y="462" font-size="12" fill="#1a1a1a">• Струм перезаряджає C_gd</text>
  <text x="500" y="482" font-size="12" fill="#c0392b">• V_DS спадає до V_DS(on)</text>

  <!-- Card 4: Phase 4 -->
  <rect x="712" y="380" width="208" height="135" rx="6" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="724" y="402" font-size="13" font-weight="bold" fill="#1a1a1a">Фаза 4: t3 – t4</text>
  <text x="724" y="422" font-size="12" font-weight="bold" fill="#27ae60">Повне насичення</text>
  <text x="724" y="442" font-size="12" fill="#1a1a1a">• V_GS зростає до V_DRV</text>
  <text x="724" y="462" font-size="12" fill="#6b7280">• Ключ повністю відкритий</text>
  <text x="724" y="482" font-size="12" fill="#27ae60">• Досягнуто R_DS(on) min</text>
</svg>
