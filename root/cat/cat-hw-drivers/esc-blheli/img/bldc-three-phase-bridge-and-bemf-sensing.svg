<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Header -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Трифазний міст MOSFET та схема зчитування зворотної ЕРС (BEMF)</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Силовий струм тече через фази A та B; на плаваючій фазі C вимірюється перетин нуля BEMF</text>

  <!-- Panel 1: Inverter Bridge & Motor -->
  <rect x="25" y="78" width="560" height="362" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="40" y="100" font-size="14" font-weight="bold" fill="#1a1a1a">Силовий трифазний міст (BLHeli ESC)</text>

  <!-- DC Power Rails -->
  <line x1="40" y1="125" x2="350" y2="125" stroke="#c0392b" stroke-width="3"/>
  <text x="40" y="116" font-size="12" font-weight="bold" fill="#c0392b">+V_BUS (+12V..24V)</text>

  <line x1="40" y1="405" x2="350" y2="405" stroke="#1a1a1a" stroke-width="3"/>
  <text x="40" y="426" font-size="12" font-weight="bold" fill="#1a1a1a">GND (Спільна земля)</text>
  <path d="M350,405 L350,415 M342,415 L358,415 M345,419 L355,419 M348,423 L352,423" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Vertical Leg Wires -->
  <!-- Leg A Wires (x=90) -->
  <line x1="90" y1="125" x2="90" y2="140" stroke="#2457d6" stroke-width="3"/>
  <line x1="90" y1="188" x2="90" y2="320" stroke="#2457d6" stroke-width="3"/>
  <line x1="90" y1="368" x2="90" y2="405" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Leg B Wires (x=200) -->
  <line x1="200" y1="125" x2="200" y2="140" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="200" y1="188" x2="200" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="200" y1="368" x2="200" y2="405" stroke="#2457d6" stroke-width="3"/>

  <!-- Leg C Wires (x=310) -->
  <line x1="310" y1="125" x2="310" y2="140" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="310" y1="188" x2="310" y2="320" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="310" y1="368" x2="310" y2="405" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- MOSFET Boxes -->
  <!-- Leg A: Q1 (High-Side, ON) -->
  <rect x="68" y="140" width="44" height="48" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <line x1="90" y1="140" x2="90" y2="188" stroke="#27ae60" stroke-width="3"/>
  <circle cx="90" cy="164" r="3" fill="#27ae60"/>
  <text x="64" y="157" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">Q1 (A+)</text>
  <text x="64" y="173" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">[ВКЛ]</text>

  <!-- Leg A: Q2 (Low-Side, OFF) -->
  <rect x="68" y="320" width="44" height="48" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="90" y1="320" x2="90" y2="336" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="90" y1="352" x2="90" y2="368" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="90" y1="352" x2="81" y2="334" stroke="#c0392b" stroke-width="2"/>
  <text x="64" y="337" text-anchor="end" font-size="12" font-weight="bold" fill="#6b7280">Q2 (A-)</text>
  <text x="64" y="353" text-anchor="end" font-size="12" font-weight="bold" fill="#6b7280">[ВИКЛ]</text>

  <!-- Leg B: Q3 (High-Side, OFF) -->
  <rect x="178" y="140" width="44" height="48" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="200" y1="140" x2="200" y2="156" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="200" y1="172" x2="200" y2="188" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="200" y1="172" x2="191" y2="154" stroke="#c0392b" stroke-width="2"/>
  <text x="174" y="157" text-anchor="end" font-size="12" font-weight="bold" fill="#6b7280">Q3 (B+)</text>
  <text x="174" y="173" text-anchor="end" font-size="12" font-weight="bold" fill="#6b7280">[ВИКЛ]</text>

  <!-- Leg B: Q4 (Low-Side, ON) -->
  <rect x="178" y="320" width="44" height="48" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <line x1="200" y1="320" x2="200" y2="368" stroke="#27ae60" stroke-width="3"/>
  <circle cx="200" cy="344" r="3" fill="#27ae60"/>
  <text x="174" y="337" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">Q4 (B-)</text>
  <text x="174" y="353" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">[ВКЛ]</text>

  <!-- Leg C: Q5 (High-Side, OFF) -->
  <rect x="288" y="140" width="44" height="48" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="310" y1="140" x2="310" y2="156" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="310" y1="172" x2="310" y2="188" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="310" y1="172" x2="301" y2="154" stroke="#c0392b" stroke-width="2"/>
  <text x="284" y="157" text-anchor="end" font-size="12" font-weight="bold" fill="#6b7280">Q5 (C+)</text>
  <text x="284" y="173" text-anchor="end" font-size="12" font-weight="bold" fill="#6b7280">[ВИКЛ]</text>

  <!-- Leg C: Q6 (Low-Side, OFF) -->
  <rect x="288" y="320" width="44" height="48" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="310" y1="320" x2="310" y2="336" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="310" y1="352" x2="310" y2="368" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="310" y1="352" x2="301" y2="334" stroke="#c0392b" stroke-width="2"/>
  <text x="284" y="337" text-anchor="end" font-size="12" font-weight="bold" fill="#6b7280">Q6 (C-)</text>
  <text x="284" y="353" text-anchor="end" font-size="12" font-weight="bold" fill="#6b7280">[ВИКЛ]</text>

  <!-- Phase Nodes -->
  <circle cx="90" cy="254" r="4" fill="#2457d6"/>
  <circle cx="200" cy="254" r="4" fill="#2457d6"/>
  <circle cx="310" cy="254" r="4" fill="#c0392b"/>

  <!-- Current Flow Badge -->
  <rect x="225" y="208" width="76" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="263" y="223" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Струм I_A-B</text>

  <!-- Phase Lines to Motor -->
  <!-- Phase A Line -->
  <path d="M90,254 L90,195 L410,195" fill="none" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>
  <text x="115" y="212" font-size="12" font-weight="bold" fill="#2457d6">Фаза A</text>

  <!-- Phase B Line -->
  <path d="M410,313 L200,313 L200,254" fill="none" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>
  <text x="210" y="300" font-size="12" font-weight="bold" fill="#2457d6">Фаза B</text>

  <!-- Phase C Line (Floating / BEMF) -->
  <line x1="310" y1="254" x2="410" y2="254" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6,3"/>
  <text x="315" y="274" font-size="12" font-weight="bold" fill="#c0392b">Фаза C (BEMF)</text>

  <!-- Sensing Tap Lines (Connecting to Panel 2) -->
  <!-- Phase A Sensing Tap Line -->
  <circle cx="340" cy="195" r="3" fill="#6b7280"/>
  <path d="M340,195 L340,126 L605,126" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Phase C Sensing Tap Line -->
  <circle cx="380" cy="254" r="3" fill="#c0392b"/>
  <path d="M380,254 L380,143.5 L575,143.5 L575,196 L605,196" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Phase B Sensing Tap Line -->
  <circle cx="360" cy="313" r="3" fill="#6b7280"/>
  <path d="M360,313 L360,390 L585,390 L585,161 L605,161" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Motor Stator Subsystem -->
  <circle cx="475" cy="254" r="65" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="475" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">BLDC Мотор (Статор)</text>

  <!-- Motor Windings (Coils) -->
  <!-- Coil A -->
  <path d="M410,195 Q440,200 450,215 Q460,230 475,254" fill="none" stroke="#2457d6" stroke-width="3"/>
  <text x="415" y="188" font-size="12" fill="#2457d6">Котушка A</text>

  <!-- Coil B -->
  <path d="M410,313 Q440,308 450,293 Q460,278 475,254" fill="none" stroke="#2457d6" stroke-width="3"/>
  <text x="415" y="328" font-size="12" fill="#2457d6">Котушка B</text>

  <!-- Coil C -->
  <line x1="410" y1="254" x2="475" y2="254" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="4,2"/>
  <text x="415" y="242" font-size="12" font-weight="bold" fill="#c0392b">Котушка C (e_C)</text>

  <!-- Rotor & Neutral Point inside Motor -->
  <circle cx="475" cy="254" r="24" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="475" y="248" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">Ротор</text>
  <circle cx="475" cy="262" r="3.5" fill="#1a1a1a"/>
  <text x="475" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">N (Нейтраль)</text>

  <!-- Panel 2: BEMF Sensing & Comparator -->
  <rect x="605" y="78" width="330" height="362" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="620" y="100" font-size="14" font-weight="bold" fill="#1a1a1a">Схема зчитування BEMF та компаратор</text>

  <!-- Virtual Neutral Network (V_N) -->
  <!-- Resistor R_A -->
  <line x1="605" y1="126" x2="635" y2="126" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="635" y="115" width="32" height="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="651" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">R_A</text>
  <line x1="667" y1="126" x2="695" y2="126" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Resistor R_B -->
  <line x1="605" y1="161" x2="635" y2="161" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="635" y="150" width="32" height="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="651" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">R_B</text>
  <line x1="667" y1="161" x2="695" y2="161" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Resistor R_C -->
  <line x1="605" y1="196" x2="635" y2="196" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="635" y="185" width="32" height="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="651" y="200" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">R_C</text>
  <line x1="667" y1="196" x2="695" y2="196" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Virtual Neutral Junction -->
  <line x1="695" y1="126" x2="695" y2="196" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="695" cy="161" r="4" fill="#1a1a1a"/>
  <text x="705" y="152" font-size="12" font-weight="bold" fill="#1a1a1a">V_N (Нейтраль)</text>

  <!-- Line from V_N to Comparator (-) input -->
  <line x1="695" y1="161" x2="775" y2="161" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Phase C Voltage Divider (V_C) -->
  <!-- Branch from Line C to R1 -->
  <circle cx="618" cy="196" r="3" fill="#c0392b"/>
  <line x1="618" y1="196" x2="618" y2="255" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="618" y1="255" x2="635" y2="255" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Resistor R1 -->
  <rect x="635" y="244" width="35" height="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="652.5" y="259" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">R1</text>
  <line x1="670" y1="255" x2="695" y2="255" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Node V_C -->
  <circle cx="695" cy="255" r="4" fill="#c0392b"/>
  <text x="705" y="242" font-size="12" font-weight="bold" fill="#c0392b">V_C (BEMF C)</text>

  <!-- Resistor R2 (down to GND) -->
  <line x1="695" y1="255" x2="695" y2="275" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="684" y="275" width="22" height="35" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="674" y="297" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">R2</text>
  <line x1="695" y1="310" x2="695" y2="330" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- R2 GND Symbol -->
  <path d="M695,330 L695,337 M688,337 L702,337 M691,341 L699,341 M693,345 L697,345" stroke="#1a1a1a" stroke-width="1.2"/>

  <!-- Line from V_C Node to Comparator (+) input -->
  <line x1="695" y1="255" x2="775" y2="255" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Comparator Triangle -->
  <path d="M775,140 L775,276 L855,208 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="787" y="167" font-size="14" font-weight="bold" fill="#1a1a1a">-</text>
  <text x="787" y="261" font-size="14" font-weight="bold" fill="#1a1a1a">+</text>
  <text x="808" y="212" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">Comp</text>

  <!-- Comparator Output Line -->
  <line x1="855" y1="208" x2="915" y2="208" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Line connecting output line to ZCD badge -->
  <line x1="875" y1="208" x2="875" y2="300" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- ZCD Output Badge -->
  <rect x="825" y="300" width="100" height="48" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="875" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Сигнал ZCD</text>
  <text x="875" y="336" text-anchor="middle" font-size="12" fill="#6b7280">до MCU</text>

  <!-- Bottom Explanatory Cards -->
  <!-- Card 1 (Left) -->
  <rect x="25" y="458" width="445" height="77" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="40" y="476" font-size="12" font-weight="bold" fill="#2457d6">1. Стан комутації фаз (Крок A → B)</text>
  <text x="40" y="493" font-size="12" fill="#1a1a1a">• Фаза A (Q1 ВКЛ): підключена до +V_BUS (струм входить)</text>
  <text x="40" y="509" font-size="12" fill="#1a1a1a">• Фаза B (Q4 ВКЛ): підключена до GND (струм виходить)</text>
  <text x="40" y="525" font-size="12" fill="#1a1a1a">• Фаза C (Q5, Q6 ВИКЛ): плаваюча фаза для вимірювання BEMF</text>

  <!-- Card 2 (Right) -->
  <rect x="490" y="458" width="445" height="77" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="505" y="476" font-size="12" font-weight="bold" fill="#27ae60">2. Детектування нуля BEMF (Zero-Crossing)</text>
  <text x="505" y="493" font-size="12" fill="#1a1a1a">• ЕРС e_C порівнюється з віртуальною нейтраллю V_N</text>
  <text x="505" y="509" font-size="12" fill="#1a1a1a">• Момент e_C = V_N є точкою перетину нуля (ZCD event)</text>
  <text x="505" y="525" font-size="12" fill="#1a1a1a">• MCU відраховує 30° ел. та виконує наступну комутацію</text>
</svg>
