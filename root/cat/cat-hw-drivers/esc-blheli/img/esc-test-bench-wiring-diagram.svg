<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-orange" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#e67e22"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема випробувального стенда для регулятора BLHeli 30A</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">Smoke Stopper захищає від короткого замикання, а програматор дає доступ до BLHeliSuite</text>

  <!-- Block 1: Power Supply -->
  <rect x="30" y="110" width="150" height="180" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="105" y="136" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Джерело живлення</text>
  <text x="105" y="156" font-size="12" fill="#6b7280" text-anchor="middle">12V DC / LiPo 3S–4S</text>
  <text x="145" y="202" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">+12V</text>
  <circle cx="165" cy="198" r="5" fill="#c0392b"/>
  <text x="145" y="252" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">GND</text>
  <circle cx="165" cy="248" r="5" fill="#1a1a1a"/>

  <!-- Wires 1: Power Supply to Smoke Stopper -->
  <line x1="170" y1="198" x2="250" y2="198" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="215" y="186" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+12V</text>
  <line x1="170" y1="248" x2="250" y2="248" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arr-black)"/>
  <text x="215" y="268" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GND</text>

  <!-- Block 2: Smoke Stopper -->
  <rect x="250" y="110" width="160" height="180" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="8"/>
  <text x="330" y="136" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Smoke Stopper</text>
  <text x="330" y="154" font-size="12" fill="#6b7280" text-anchor="middle">Обмежувач струму</text>
  <text x="330" y="170" font-size="12" fill="#6b7280" text-anchor="middle">(Захист від КЗ)</text>
  <rect x="285" y="185" width="90" height="26" fill="white" stroke="#c0392b" stroke-width="1.5" rx="4"/>
  <text x="330" y="202" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">eFuse / Лампа</text>
  <line x1="250" y1="198" x2="285" y2="198" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="375" y1="198" x2="410" y2="198" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="250" y1="248" x2="410" y2="248" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="330" y="240" font-size="12" fill="#6b7280" text-anchor="middle">Пряма лінія GND</text>

  <!-- Wires 2: Smoke Stopper to ESC -->
  <line x1="410" y1="198" x2="480" y2="198" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="445" y="186" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+V Prot</text>
  <line x1="410" y1="248" x2="480" y2="248" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arr-black)"/>
  <text x="445" y="268" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GND</text>

  <!-- Block 3: ESC BLHeli 30A -->
  <rect x="480" y="110" width="230" height="190" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="8"/>
  <text x="595" y="134" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">ESC BLHeli 30A</text>
  <text x="595" y="152" font-size="12" fill="#6b7280" text-anchor="middle">Регулятор ходу з BEC 5V</text>

  <!-- Sub-block MCU -->
  <rect x="495" y="165" width="95" height="50" fill="white" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="542" y="184" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">MCU / BLHeli</text>
  <text x="542" y="202" font-size="12" fill="#6b7280" text-anchor="middle">Timing / Demag</text>

  <!-- Sub-block BEC -->
  <rect x="600" y="165" width="95" height="50" fill="white" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="647" y="184" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">BEC 5V</text>
  <text x="647" y="202" font-size="12" fill="#6b7280" text-anchor="middle">Вихід 5V / 2A</text>

  <!-- Sub-block MOSFETs -->
  <rect x="495" y="228" width="200" height="30" fill="white" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="595" y="247" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Силовий каскад (3x MOSFET)</text>

  <!-- Wires 3: ESC to Motor (3 Phases) -->
  <line x1="710" y1="175" x2="780" y2="175" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="745" y="162" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Фаза A</text>

  <line x1="710" y1="200" x2="780" y2="200" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="745" y="193" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Фаза B</text>

  <line x1="710" y1="225" x2="780" y2="225" stroke="#e67e22" stroke-width="2.5" marker-end="url(#arr-orange)"/>
  <text x="745" y="242" font-size="12" font-weight="bold" fill="#e67e22" text-anchor="middle">Фаза C</text>

  <!-- Block 4: BLDC Motor -->
  <rect x="780" y="110" width="150" height="180" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="855" y="136" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">BLDC Мотор</text>

  <!-- Stator/Rotor circles -->
  <circle cx="855" cy="205" r="36" fill="white" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="855" cy="205" r="16" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="855" y="209" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">3Ф</text>
  <text x="855" y="264" font-size="12" fill="#6b7280" text-anchor="middle">Контроль напрямку</text>
  <circle cx="780" cy="175" r="4" fill="#2457d6"/>
  <circle cx="780" cy="200" r="4" fill="#27ae60"/>
  <circle cx="780" cy="225" r="4" fill="#e67e22"/>

  <!-- Signal & BEC Output Wires from ESC to Bottom Panels -->
  <line x1="510" y1="300" x2="510" y2="340" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="495" y="324" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">Сигнал 1-Wire / PWM</text>

  <line x1="670" y1="300" x2="670" y2="340" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="685" y="324" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">BEC +5V / GND</text>

  <!-- Block 5: Panel 1 - Programmer & PC (BLHeliSuite) -->
  <rect x="180" y="340" width="360" height="150" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="8"/>
  <text x="360" y="365" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">ПК з ПЗ BLHeliSuite</text>

  <rect x="200" y="380" width="320" height="95" fill="white" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="360" y="400" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">USB-програматор / Arduino 1-Wire</text>
  <text x="360" y="420" font-size="12" fill="#6b7280" text-anchor="middle">• Калібрування газу (Throttle Calibration)</text>
  <text x="360" y="438" font-size="12" fill="#6b7280" text-anchor="middle">• Motor Timing &amp; Demag Compensation</text>
  <text x="360" y="456" font-size="12" fill="#6b7280" text-anchor="middle">• Реверс обертання та прошивка</text>

  <!-- Block 6: Panel 2 - BEC Load Testing -->
  <rect x="570" y="340" width="360" height="150" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="8"/>
  <text x="750" y="365" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Перевірка BEC 5V (Навантаження)</text>

  <rect x="590" y="380" width="320" height="95" fill="white" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="750" y="400" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Активне навантаження / Сервопривід</text>
  <text x="750" y="420" font-size="12" fill="#6b7280" text-anchor="middle">• Перевірка стабільності напруги 5.0V</text>
  <text x="750" y="438" font-size="12" fill="#6b7280" text-anchor="middle">• Контроль просідання при русі серво</text>
  <text x="750" y="456" font-size="12" fill="#6b7280" text-anchor="middle">• Захист від перегріву та пульсацій</text>
</svg>
