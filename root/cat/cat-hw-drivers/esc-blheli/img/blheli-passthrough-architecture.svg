<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Підкладка полотна -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Архітектура BLHeli Pass-through (4way-interface)</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Трансляція конфігураційних команд від ПК до EEPROM регулятора через політний контролер</text>

  <!-- Панель 1: Персональний комп'ютер -->
  <rect x="30" y="90" width="250" height="348" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="155" y="115" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Персональний комп'ютер (ПК)</text>

  <rect x="48" y="132" width="214" height="88" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="155" y="154" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">BLHeliSuite / Web App</text>
  <text x="155" y="174" font-size="12" fill="#1a1a1a" text-anchor="middle">Формування 4way команд</text>
  <text x="155" y="194" font-size="12" fill="#6b7280" text-anchor="middle">Налаштування параметрів</text>

  <line x1="155" y1="220" x2="155" y2="240" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <rect x="48" y="248" width="214" height="72" fill="white" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="155" y="270" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Інтерфейс USB / VCP</text>
  <text x="155" y="292" font-size="12" fill="#6b7280" text-anchor="middle">Віртуальний COM-порт</text>

  <line x1="155" y1="320" x2="155" y2="340" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <rect x="48" y="348" width="214" height="78" fill="white" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4" rx="6"/>
  <text x="155" y="368" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Пакет 4way-over-USB</text>
  <text x="155" y="388" font-size="12" fill="#2457d6" text-anchor="middle">4way Cmd + Параметри</text>
  <text x="155" y="408" font-size="12" fill="#6b7280" text-anchor="middle">Швидкість: 115200 baud</text>

  <!-- Панель 2: Польотний контролер -->
  <rect x="355" y="90" width="250" height="348" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="480" y="115" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Польотний контролер (FC)</text>

  <rect x="373" y="132" width="214" height="72" fill="white" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="480" y="154" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">MSP / Serial Parser</text>
  <text x="480" y="176" font-size="12" fill="#6b7280" text-anchor="middle">Прийом 4way команд з USB</text>

  <line x1="480" y1="204" x2="480" y2="224" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <rect x="373" y="232" width="214" height="96" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="480" y="252" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Модуль 4way Passthrough</text>
  <text x="480" y="272" font-size="12" fill="#1a1a1a" text-anchor="middle">Перемикання на 1-Wire</text>
  <text x="480" y="292" font-size="12" fill="#1a1a1a" text-anchor="middle">Bit-bang / Multiplexing</text>
  <text x="480" y="312" font-size="12" fill="#6b7280" text-anchor="middle">Трансляція без буферизації</text>

  <line x1="480" y1="328" x2="480" y2="348" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <rect x="373" y="356" width="214" height="70" fill="white" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4" rx="6"/>
  <text x="480" y="374" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Сигнальний контакт (M1...M4)</text>
  <text x="480" y="394" font-size="12" fill="#2457d6" text-anchor="middle">1-Wire Serial Interface</text>
  <text x="480" y="412" font-size="12" fill="#6b7280" text-anchor="middle">Напівдуплексний режим</text>

  <!-- Панель 3: Регулятор ходу -->
  <rect x="680" y="90" width="250" height="348" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="805" y="115" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Регулятор ходу (ESC)</text>

  <rect x="698" y="132" width="214" height="88" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="805" y="154" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">BLHeli Bootloader</text>
  <text x="805" y="174" font-size="12" fill="#1a1a1a" text-anchor="middle">Прийом / декодування 4way</text>
  <text x="805" y="194" font-size="12" fill="#6b7280" text-anchor="middle">Перевірка CRC суми</text>

  <line x1="805" y1="220" x2="805" y2="240" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <rect x="698" y="248" width="214" height="72" fill="white" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="805" y="270" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мікроконтролер (MCU)</text>
  <text x="805" y="292" font-size="12" fill="#6b7280" text-anchor="middle">Виконання команд R/W</text>

  <line x1="805" y1="320" x2="805" y2="340" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <rect x="698" y="348" width="214" height="78" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="805" y="368" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">EEPROM / Flash</text>
  <text x="805" y="388" font-size="12" fill="#1a1a1a" text-anchor="middle">Запис / читання налаштувань</text>
  <text x="805" y="408" font-size="12" fill="#6b7280" text-anchor="middle">Timing, Demag, Throttle</text>

  <!-- Зв'язки між панелями: ПК <-> FC -->
  <line x1="280" y1="160" x2="345" y2="160" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="317.5" y="148" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">USB / MSP</text>

  <line x1="355" y1="190" x2="290" y2="190" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arr-gray)"/>
  <text x="317.5" y="208" font-size="12" fill="#6b7280" text-anchor="middle">ACK / Дані</text>

  <!-- Зв'язки між панелями: FC <-> ESC -->
  <line x1="605" y1="160" x2="670" y2="160" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="642.5" y="148" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">1-Wire C2</text>

  <line x1="680" y1="190" x2="615" y2="190" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arr-gray)"/>
  <text x="642.5" y="208" font-size="12" fill="#6b7280" text-anchor="middle">Відповідь</text>

  <!-- Нижній блок з підсумковим висновком -->
  <rect x="30" y="452" width="900" height="34" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="480" y="473" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Ключовий принцип: ПК керує EEPROM регулятора через FC без фізичного перепідключення виводів</text>
</svg>
