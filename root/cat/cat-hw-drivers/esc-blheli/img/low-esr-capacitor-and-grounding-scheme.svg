<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Правила підключення Low ESR конденсатора та схема заземлення ESC BLHeli 30A</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Фільтруючий конденсатор біля клем ESC пригнічує індуктивні сплески, а окрема сигнальна земля запобігає завадам</text>

  <!-- Panel 1: LiPo Battery -->
  <rect x="25" y="85" width="165" height="435" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="107" y="108" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">LiPo Акумулятор</text>
  <text x="107" y="125" font-size="12" fill="#6b7280" text-anchor="middle">(2S–4S / 7.4–14.8V)</text>

  <rect x="40" y="140" width="135" height="240" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <circle cx="107" cy="170" r="12" fill="#c0392b"/>
  <text x="107" y="175" font-size="14" font-weight="bold" fill="white" text-anchor="middle">+</text>

  <text x="107" y="225" font-size="12" fill="#6b7280" text-anchor="middle">Високий струм</text>
  <text x="107" y="243" font-size="12" fill="#6b7280" text-anchor="middle">розрядження</text>
  <text x="107" y="261" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="middle">(до 30A–40A)</text>

  <circle cx="107" cy="350" r="12" fill="#1a1a1a"/>
  <text x="107" y="355" font-size="14" font-weight="bold" fill="white" text-anchor="middle">–</text>

  <rect x="35" y="395" width="145" height="110" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="107" y="417" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Силове живлення</text>
  <text x="107" y="437" font-size="12" fill="#6b7280" text-anchor="middle">Пряме підключення</text>
  <text x="107" y="457" font-size="12" fill="#6b7280" text-anchor="middle">до силового моста</text>
  <text x="107" y="482" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Пульсації до 50A</text>

  <!-- Panel 2: Filter Zone (Low ESR Capacitor) -->
  <rect x="210" y="85" width="225" height="435" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="8"/>
  <text x="322" y="108" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Фільтрація завад</text>
  <text x="322" y="125" font-size="12" fill="#1e8449" text-anchor="middle">Low ESR конденсатор</text>

  <rect x="222" y="134" width="201" height="36" fill="#ffffff" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="322" y="148" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Правильний монтаж:</text>
  <text x="322" y="164" font-size="12" fill="#1a1a1a" text-anchor="middle">Мінімальна довжина виводів</text>

  <!-- Wires passing through Panel 2 -->
  <line x1="175" y1="195" x2="463" y2="195" stroke="#c0392b" stroke-width="4"/>
  <line x1="175" y1="365" x2="463" y2="365" stroke="#1a1a1a" stroke-width="4"/>
  <text x="225" y="190" font-size="12" fill="#c0392b" font-weight="bold">VCC (+)</text>
  <text x="225" y="358" font-size="12" fill="#1a1a1a" font-weight="bold">GND (-)</text>

  <!-- Capacitor Mount & Leads -->
  <line x1="322" y1="195" x2="322" y2="225" stroke="#c0392b" stroke-width="3"/>
  <line x1="322" y1="325" x2="322" y2="365" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="322" cy="195" r="5" fill="#c0392b"/>
  <circle cx="322" cy="365" r="5" fill="#1a1a1a"/>

  <!-- Capacitor Body -->
  <rect x="282" y="225" width="80" height="100" fill="#27ae60" stroke="#1e8449" stroke-width="2" rx="6"/>
  <text x="322" y="244" font-size="14" font-weight="bold" fill="white" text-anchor="middle">+</text>
  <text x="322" y="264" font-size="12" font-weight="bold" fill="white" text-anchor="middle">330–1000 µF</text>
  <text x="322" y="282" font-size="12" fill="white" text-anchor="middle">25–35 V</text>
  <rect x="284" y="297" width="76" height="22" fill="#1e8449" rx="2"/>
  <text x="322" y="313" font-size="14" font-weight="bold" fill="white" text-anchor="middle">–</text>

  <rect x="222" y="390" width="201" height="115" fill="#ffffff" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="322" y="408" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Функції Low ESR:</text>
  <text x="232" y="426" font-size="12" fill="#1a1a1a">• Гасіння сплесків напруги</text>
  <text x="232" y="444" font-size="12" fill="#1a1a1a">• Захист силових MOSFET</text>
  <text x="232" y="462" font-size="12" fill="#1a1a1a">• Зниження пульсацій BEC</text>
  <text x="232" y="480" font-size="12" fill="#1e8449" font-weight="bold">• Стабілізація MCU ESC</text>

  <!-- Panel 3: ESC BLHeli 30A -->
  <rect x="455" y="85" width="250" height="435" fill="#f4f6f8" stroke="#2457d6" stroke-width="2" rx="8"/>
  <text x="580" y="108" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">ESC BLHeli 30A з BEC</text>
  <text x="580" y="125" font-size="12" fill="#6b7280" text-anchor="middle">Силовий регулятор ходу</text>

  <!-- ESC Input Pads -->
  <rect x="463" y="185" width="14" height="20" fill="#c0392b" rx="2"/>
  <text x="465" y="176" font-size="12" font-weight="bold" fill="#c0392b">VCC Pad</text>

  <rect x="463" y="355" width="14" height="20" fill="#1a1a1a" rx="2"/>
  <text x="465" y="346" font-size="12" font-weight="bold" fill="#1a1a1a">GND Pad</text>

  <!-- ESC Internal Modules -->
  <rect x="520" y="140" width="175" height="80" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="6"/>
  <text x="607" y="162" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Силовий міст (MOSFET)</text>
  <text x="607" y="180" font-size="12" fill="#1a1a1a" text-anchor="middle">3-фазна комутація</text>
  <text x="607" y="198" font-size="12" fill="#6b7280" text-anchor="middle">Струм до 30A (пік 40A)</text>

  <rect x="520" y="235" width="175" height="65" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="607" y="255" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вбудований BEC 5V</text>
  <text x="607" y="273" font-size="12" fill="#2457d6" font-weight="bold" text-anchor="middle">Вихід 5V / 1.5A–2A</text>
  <text x="607" y="289" font-size="12" fill="#6b7280" text-anchor="middle">Живлення FC/Receiver</text>

  <rect x="520" y="315" width="175" height="75" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="607" y="335" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">MCU BLHeli</text>
  <text x="607" y="353" font-size="12" fill="#1a1a1a" text-anchor="middle">Обробка PWM / DShot</text>
  <text x="607" y="371" font-size="12" fill="#6b7280" text-anchor="middle">Керування MOSFET</text>

  <!-- ESC Grounding Rule Badge -->
  <rect x="465" y="440" width="230" height="65" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="580" y="458" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Схема заземлення (GND):</text>
  <text x="580" y="475" font-size="12" fill="#1a1a1a" text-anchor="middle">• Силовий струм: через силовий GND</text>
  <text x="580" y="492" font-size="12" fill="#c0392b" font-weight="bold" text-anchor="middle">Усунення земляних контурів</text>

  <!-- Panel 4 Top: BLDC Motor -->
  <rect x="765" y="85" width="170" height="145" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="8"/>
  <text x="850" y="108" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">BLDC Двигун</text>
  <text x="850" y="125" font-size="12" fill="#6b7280" text-anchor="middle">3 фази (U, V, W)</text>

  <rect x="778" y="136" width="144" height="82" fill="#ffffff" stroke="#2457d6" stroke-width="1" rx="6"/>
  <text x="850" y="158" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="middle">Обмотки статора</text>
  <text x="850" y="178" font-size="12" fill="#6b7280" text-anchor="middle">Високочастотна</text>
  <text x="850" y="196" font-size="12" fill="#6b7280" text-anchor="middle">комутація струму</text>

  <!-- Phase Connections ESC -> Motor -->
  <line x1="695" y1="155" x2="765" y2="155" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <line x1="695" y1="175" x2="765" y2="175" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <line x1="695" y1="195" x2="765" y2="195" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="735" y="150" font-size="12" fill="#2457d6" font-weight="bold" text-anchor="middle">A</text>
  <text x="735" y="170" font-size="12" fill="#2457d6" font-weight="bold" text-anchor="middle">B</text>
  <text x="735" y="190" font-size="12" fill="#2457d6" font-weight="bold" text-anchor="middle">C</text>

  <!-- Panel 4 Bottom: Flight Controller / Receiver -->
  <rect x="765" y="245" width="170" height="275" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="850" y="268" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Політний контролер</text>
  <text x="850" y="285" font-size="12" fill="#6b7280" text-anchor="middle">(FC / Receiver)</text>

  <rect x="771" y="310" width="14" height="20" fill="#c0392b" rx="2"/>
  <text x="790" y="324" font-size="12" font-weight="bold" fill="#c0392b">5V In</text>

  <rect x="771" y="365" width="14" height="20" fill="#2457d6" rx="2"/>
  <text x="790" y="379" font-size="12" font-weight="bold" fill="#2457d6">Signal Out</text>

  <rect x="771" y="415" width="14" height="20" fill="#6b7280" rx="2"/>
  <text x="790" y="429" font-size="12" font-weight="bold" fill="#6b7280">GND Ref</text>

  <rect x="775" y="452" width="150" height="56" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="850" y="470" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Окремий провід GND:</text>
  <text x="850" y="488" font-size="12" fill="#1a1a1a" text-anchor="middle">Захищає MCU від завад</text>

  <!-- Control & BEC Lines between ESC and FC -->
  <line x1="695" y1="320" x2="771" y2="320" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="735" y="313" font-size="12" fill="#c0392b" font-weight="bold" text-anchor="middle">+5V BEC</text>

  <line x1="771" y1="375" x2="695" y2="375" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="735" y="368" font-size="12" fill="#2457d6" font-weight="bold" text-anchor="middle">Signal</text>

  <line x1="771" y1="425" x2="695" y2="425" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>
  <text x="735" y="418" font-size="12" fill="#6b7280" font-weight="bold" text-anchor="middle">GND_sig</text>
</svg>
