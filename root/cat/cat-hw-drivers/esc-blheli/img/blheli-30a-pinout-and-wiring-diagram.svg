<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-yellow" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d68910"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема підключення регулятора ходу BLHeli 30A ESC</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Підключення акумулятора 2S–4S LiPo, фільтруючого конденсатора, сигнального шлейфу та фаз BLDC</text>

  <!-- 1. Панель Акумулятора (АКБ) -->
  <rect x="30" y="80" width="180" height="130" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="105" y="104" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Акумулятор LiPo</text>
  <text x="105" y="122" font-size="12" fill="#6b7280" text-anchor="middle">Живлення: 2S–4S</text>
  <text x="105" y="138" font-size="12" fill="#6b7280" text-anchor="middle">(7.4 В – 16.8 В)</text>
  <text x="105" y="172" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Силовий вихід</text>

  <!-- Клеми АКБ -->
  <rect x="180" y="111" width="22" height="18" rx="2" fill="#c0392b"/>
  <text x="191" y="124" font-size="12" font-weight="bold" fill="white" text-anchor="middle">+</text>
  <rect x="180" y="151" width="22" height="18" rx="2" fill="#1a1a1a"/>
  <text x="191" y="164" font-size="12" font-weight="bold" fill="white" text-anchor="middle">−</text>

  <!-- 2. Панель Low ESR Конденсатора -->
  <rect x="30" y="235" width="180" height="140" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="120" y="257" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Low ESR Конденсатор</text>
  <text x="120" y="277" font-size="12" fill="#1a1a1a" text-anchor="middle">Ємність: 330–470 мкФ</text>
  <text x="120" y="295" font-size="12" fill="#1a1a1a" text-anchor="middle">Напруга: 25 В – 35 В</text>
  <text x="120" y="319" font-size="12" fill="#6b7280" text-anchor="middle">Фільтрує сплески ШІМ</text>
  <text x="120" y="343" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Монтаж: біля входу ESC</text>

  <!-- Силові провідники від АКБ до ESC -->
  <line x1="202" y1="120" x2="325" y2="120" stroke="#c0392b" stroke-width="4"/>
  <text x="250" y="104" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">BAT+ (V+)</text>

  <line x1="202" y1="160" x2="325" y2="160" stroke="#1a1a1a" stroke-width="4"/>
  <text x="250" y="180" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">BAT- (GND)</text>

  <!-- Символ Конденсатора паралельно силовим шинам -->
  <line x1="295" y1="120" x2="295" y2="130" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="295" y1="150" x2="295" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="285" y="130" width="20" height="20" rx="3" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="295" y="139" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">+</text>
  <text x="295" y="148" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="middle">C</text>
  <path d="M 295,160 L 295,225 L 120,225 L 120,235" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3" fill="none"/>

  <!-- 3. Блок Регулятора ходу BLHeli 30A ESC -->
  <rect x="325" y="80" width="310" height="380" rx="8" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Шапка ESC -->
  <path d="M 325,88 A 8,8 0 0 1 333,80 L 627,80 A 8,8 0 0 1 635,88 L 635,115 L 325,115 Z" fill="#2457d6"/>
  <text x="480" y="101" font-size="14" font-weight="bold" fill="white" text-anchor="middle">BLHeli 30A ESC (з вбудованим BEC 5V)</text>

  <!-- Вхідні силові клеми на лівій грані ESC -->
  <rect x="325" y="111" width="22" height="18" rx="2" fill="#c0392b"/>
  <text x="336" y="124" font-size="12" font-weight="bold" fill="white" text-anchor="middle">+</text>

  <rect x="325" y="151" width="22" height="18" rx="2" fill="#1a1a1a"/>
  <text x="336" y="164" font-size="12" font-weight="bold" fill="white" text-anchor="middle">−</text>

  <!-- Внутрішній блок 1: MCU (Мікроконтролер) -->
  <rect x="353" y="130" width="120" height="95" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="413" y="148" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">MCU (Контролер)</text>
  <text x="413" y="166" font-size="12" fill="#6b7280" text-anchor="middle">Прошивка BLHeli</text>
  <text x="413" y="184" font-size="12" fill="#6b7280" text-anchor="middle">Вхід: PWM / DShot</text>
  <text x="413" y="210" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Керування фазами</text>

  <!-- Внутрішній блок 2: Вбудований BEC 5V -->
  <rect x="483" y="130" width="122" height="95" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="544" y="148" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вбудований BEC</text>
  <text x="544" y="166" font-size="12" fill="#1a1a1a" text-anchor="middle">Вихід: 5V / 2A–3A</text>
  <text x="544" y="184" font-size="12" fill="#6b7280" text-anchor="middle">Вхід: V+ (2S–4S)</text>
  <text x="544" y="210" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Живлення FC/RC</text>

  <!-- Внутрішній блок 3: Силові MOSFET -->
  <rect x="353" y="240" width="252" height="95" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="479" y="260" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Силові MOSFET (3-фазний міст)</text>
  <text x="479" y="278" font-size="12" fill="#6b7280" text-anchor="middle">Максимальний струм: 30 A</text>
  <text x="479" y="296" font-size="12" fill="#6b7280" text-anchor="middle">Високочастотна ШІМ-комутація</text>
  <text x="479" y="322" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Комутація живлення обмоток BLDC</text>

  <!-- Внутрішній блок 4: Параметри струму та захисту -->
  <rect x="353" y="350" width="252" height="95" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="479" y="370" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Характеристики силового каскаду</text>
  <text x="479" y="388" font-size="12" fill="#6b7280" text-anchor="middle">Безперервний струм: 30 А</text>
  <text x="479" y="406" font-size="12" fill="#6b7280" text-anchor="middle">Піковий струм (10 сек): до 40 А</text>
  <text x="479" y="432" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Захист від перегріву та втрати сигналу</text>

  <!-- Клеми сигналів та живлення BEC на правій грані ESC (угорі) -->
  <rect x="613" y="131" width="22" height="18" rx="2" fill="#e74c3c"/>
  <text x="624" y="144" font-size="10" font-weight="bold" fill="white" text-anchor="middle">+5V</text>

  <rect x="613" y="161" width="22" height="18" rx="2" fill="#34495e"/>
  <text x="624" y="174" font-size="10" font-weight="bold" fill="white" text-anchor="middle">GND</text>

  <rect x="613" y="191" width="22" height="18" rx="2" fill="#d68910"/>
  <text x="624" y="204" font-size="10" font-weight="bold" fill="#1a1a1a" text-anchor="middle">SIG</text>

  <!-- Клеми силових фаз на правій грані ESC (унизу) -->
  <rect x="613" y="351" width="22" height="18" rx="2" fill="#2980b9"/>
  <text x="624" y="364" font-size="11" font-weight="bold" fill="white" text-anchor="middle">A</text>

  <rect x="613" y="381" width="22" height="18" rx="2" fill="#d35400"/>
  <text x="624" y="394" font-size="11" font-weight="bold" fill="white" text-anchor="middle">B</text>

  <rect x="613" y="411" width="22" height="18" rx="2" fill="#27ae60"/>
  <text x="624" y="424" font-size="11" font-weight="bold" fill="white" text-anchor="middle">C</text>

  <!-- 4. Блок Польотного контролера (FC) -->
  <rect x="760" y="80" width="170" height="175" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="850" y="104" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Польотний контролер</text>
  <text x="850" y="122" font-size="12" fill="#6b7280" text-anchor="middle">(FC / Приймач)</text>

  <!-- Клеми FC -->
  <rect x="760" y="131" width="22" height="18" rx="2" fill="#e74c3c"/>
  <text x="771" y="144" font-size="10" font-weight="bold" fill="white" text-anchor="middle">+5V</text>

  <rect x="760" y="161" width="22" height="18" rx="2" fill="#34495e"/>
  <text x="771" y="174" font-size="10" font-weight="bold" fill="white" text-anchor="middle">GND</text>

  <rect x="760" y="191" width="22" height="18" rx="2" fill="#d68910"/>
  <text x="771" y="204" font-size="10" font-weight="bold" fill="white" text-anchor="middle">PWM</text>

  <text x="850" y="222" font-size="12" fill="#2457d6" text-anchor="middle">Спільне GND з FC</text>
  <text x="850" y="240" font-size="12" fill="#2457d6" text-anchor="middle">усуває завади сигналу</text>

  <!-- Лінії шлейфу між ESC та FC -->
  <path d="M 635,140 L 760,140" stroke="#e74c3c" stroke-width="2.5" fill="none" marker-end="url(#arr-red)"/>
  <text x="697" y="126" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Живлення FC (+5V)</text>

  <path d="M 635,170 L 760,170" stroke="#34495e" stroke-width="2.5" stroke-dasharray="5,3" fill="none"/>
  <text x="697" y="156" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Спільне GND</text>

  <path d="M 760,200 L 635,200" stroke="#d68910" stroke-width="2.5" fill="none" marker-end="url(#arr-yellow)"/>
  <text x="697" y="220" font-size="12" font-weight="bold" fill="#d68910" text-anchor="middle">Сигнал керування</text>

  <!-- 5. Блок BLDC Двигуна -->
  <rect x="760" y="280" width="170" height="180" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="848" y="304" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Двигун BLDC</text>
  <text x="848" y="322" font-size="12" fill="#6b7280" text-anchor="middle">3-фазний безколекторний</text>

  <!-- Клеми Двигуна -->
  <rect x="760" y="351" width="22" height="18" rx="2" fill="#2980b9"/>
  <text x="771" y="364" font-size="11" font-weight="bold" fill="white" text-anchor="middle">A</text>

  <rect x="760" y="381" width="22" height="18" rx="2" fill="#d35400"/>
  <text x="771" y="394" font-size="11" font-weight="bold" fill="white" text-anchor="middle">B</text>

  <rect x="760" y="411" width="22" height="18" rx="2" fill="#27ae60"/>
  <text x="771" y="424" font-size="11" font-weight="bold" fill="white" text-anchor="middle">C</text>

  <text x="848" y="437" font-size="11" fill="#6b7280" text-anchor="middle">Зміна напрямку обертання:</text>
  <text x="848" y="453" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">поміняти будь-які 2 фази</text>

  <!-- Фазні лінії від ESC до Двигуна -->
  <line x1="635" y1="360" x2="760" y2="360" stroke="#2980b9" stroke-width="3"/>
  <line x1="635" y1="390" x2="760" y2="390" stroke="#d35400" stroke-width="3"/>
  <line x1="635" y1="420" x2="760" y2="420" stroke="#27ae60" stroke-width="3"/>
  <text x="697" y="344" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Три силові фази BLDC</text>

  <!-- 6. Нижня панель рекомендацій -->
  <rect x="30" y="480" width="900" height="40" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="480" y="504" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan font-weight="bold" fill="#27ae60">Рекомендації: </tspan><tspan fill="#1a1a1a">1. Low ESR конденсатор фільтрує сплески напруги. </tspan><tspan fill="#2457d6">2. Спільний провід GND запобігає збоям сигналу керування.</tspan></text>
</svg>
