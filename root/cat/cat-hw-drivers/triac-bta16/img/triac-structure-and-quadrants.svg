<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="510" fill="white"/>
  
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Структура та квадранти відмикання симістора BTA16</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">П'ятишарова напівпровідникова будова та чутливість керування в чотирьох квадрантах</text>

  <!-- Ліва панель: Внутрішня структура -->
  <rect x="24" y="80" width="440" height="410" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="244" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Внутрішня п'ятишарова p-n-p-n структура</text>

  <!-- Виводи A1 (MT1) і G (Затвор) -->
  <text x="185" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">A1 (MT1)</text>
  <circle cx="185" cy="134" r="4" fill="#2457d6"/>
  <line x1="185" y1="134" x2="185" y2="162" stroke="#2457d6" stroke-width="2"/>

  <text x="320" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">G (Затвор)</text>
  <circle cx="320" cy="134" r="4" fill="#c0392b"/>
  <line x1="320" y1="134" x2="320" y2="162" stroke="#c0392b" stroke-width="2"/>

  <!-- Верхні металеві контакти A1 і G -->
  <rect x="130" y="162" width="110" height="18" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <rect x="270" y="162" width="90" height="18" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>

  <!-- Напівпровідниковий кристал (5 шарів) -->
  <!-- шар P1 (базовий верхній) -->
  <rect x="124" y="180" width="240" height="60" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <!-- вкраплення N1 (під контакти A1) -->
  <rect x="134" y="180" width="80" height="35" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="174" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">N1</text>
  <!-- вкраплення N4 (під контакт G) -->
  <rect x="280" y="180" width="70" height="35" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="315" y="202" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">N4</text>
  <!-- позначка P1 -->
  <text x="247" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">P1</text>

  <!-- шар N2 (базовий середній) -->
  <rect x="124" y="240" width="240" height="70" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="244" y="268" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">N2</text>
  <text x="244" y="288" text-anchor="middle" font-size="12" fill="#6b7280">(n-база, слабколегована)</text>

  <!-- шар P2 і N3 (нижній шар) -->
  <rect x="124" y="310" width="240" height="60" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <!-- вкраплення N3 -->
  <rect x="244" y="335" width="110" height="35" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="184" y="345" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">P2</text>
  <text x="299" y="357" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">N3</text>

  <!-- Нижній металевий контакт A2 -->
  <rect x="124" y="370" width="240" height="18" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>

  <!-- Вивід A2 (MT2) -->
  <line x1="244" y1="388" x2="244" y2="415" stroke="#2457d6" stroke-width="2"/>
  <circle cx="244" cy="415" r="4" fill="#2457d6"/>
  <text x="244" y="435" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">A2 (MT2)</text>

  <!-- Пояснювальний блок для лівої панелі -->
  <rect x="40" y="448" width="408" height="30" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="244" y="468" text-anchor="middle" font-size="12" fill="#1a1a1a">Еквівалент: 2 тиристори у зустрічно-паралельному включенні</text>

  <!-- Права панель: 4 квадранти відмикання -->
  <rect x="496" y="80" width="440" height="410" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="716" y="104" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Діаграма чотирьох квадрантів відмикання</text>

  <!-- Осі координат -->
  <!-- Горизонтальна вісь I_G -->
  <line x1="526" y1="265" x2="896" y2="265" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="906" y="269" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">+I_G</text>
  <text x="516" y="269" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">-I_G</text>

  <!-- Вертикальна вісь V_A2-A1 -->
  <line x1="716" y1="395" x2="716" y2="135" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="716" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">+V_A2-A1 (A2+)</text>
  <text x="716" y="412" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">-V_A2-A1 (A2-)</text>

  <!-- Квадрант I -->
  <rect x="736" y="140" width="175" height="105" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="823" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Квадрант I (I+)</text>
  <text x="823" y="180" text-anchor="middle" font-size="12" fill="#1a1a1a">V_A2-A1 &gt; 0 ,  I_G &gt; 0</text>
  <text x="823" y="200" text-anchor="middle" font-size="12" fill="#1a1a1a">Полярність: A2+, G+</text>
  <text x="823" y="223" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Чутливість: ВИСОКА</text>

  <!-- Квадрант II -->
  <rect x="521" y="140" width="175" height="105" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="608" y="160" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Квадрант II (I-)</text>
  <text x="608" y="180" text-anchor="middle" font-size="12" fill="#1a1a1a">V_A2-A1 &gt; 0 ,  I_G &lt; 0</text>
  <text x="608" y="200" text-anchor="middle" font-size="12" fill="#1a1a1a">Полярність: A2+, G-</text>
  <text x="608" y="223" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Чутливість: СЕРЕДНЯ</text>

  <!-- Квадрант III -->
  <rect x="521" y="285" width="175" height="105" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="608" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Квадрант III (III-)</text>
  <text x="608" y="325" text-anchor="middle" font-size="12" fill="#1a1a1a">V_A2-A1 &lt; 0 ,  I_G &lt; 0</text>
  <text x="608" y="345" text-anchor="middle" font-size="12" fill="#1a1a1a">Полярність: A2-, G-</text>
  <text x="608" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Чутливість: ВИСОКА</text>

  <!-- Квадрант IV -->
  <rect x="736" y="285" width="175" height="105" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="823" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Квадрант IV (III+)</text>
  <text x="823" y="325" text-anchor="middle" font-size="12" fill="#1a1a1a">V_A2-A1 &lt; 0 ,  I_G &gt; 0</text>
  <text x="823" y="345" text-anchor="middle" font-size="12" fill="#1a1a1a">Полярність: A2-, G+</text>
  <text x="823" y="368" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Низька (уникати!)</text>

  <!-- Пояснювальний блок для правої панелі -->
  <rect x="512" y="448" width="408" height="30" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="716" y="468" text-anchor="middle" font-size="12" fill="#1a1a1a">Примітка: BTA16 працює переважно в квадрантах I, II, III</text>
</svg>
