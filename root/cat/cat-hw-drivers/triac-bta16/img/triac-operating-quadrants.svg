<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="960" height="570" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="570" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Квадранти роботи симістора та полярності керування</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">Режим IV (V_MT2 &gt; 0, I_G &lt; 0) має знижену чутливість і високий струм відпирання I_GT</text>

  <!-- Central Axes -->
  <!-- Horizontal Axis (V_MT2) -->
  <line x1="480" y1="310" x2="880" y2="310" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-black)"/>
  <line x1="480" y1="310" x2="80" y2="310" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-black)"/>
  <text x="895" y="314" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">+V_MT2</text>
  <text x="65" y="314" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">-V_MT2</text>

  <!-- Vertical Axis (I_G) -->
  <line x1="480" y1="310" x2="480" y2="95" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-black)"/>
  <line x1="480" y1="310" x2="480" y2="525" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-black)"/>
  <text x="480" y="85" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">+I_G (втікає)</text>
  <text x="480" y="546" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">-I_G (витікає)</text>
  <circle cx="480" cy="310" r="4" fill="#1a1a1a"/>

  <!-- QUADRANT II (Top-Left) -->
  <rect x="40" y="100" width="410" height="190" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <rect x="55" y="112" width="380" height="28" rx="4" fill="#2457d6"/>
  <text x="245" y="131" font-size="13" font-weight="bold" fill="white" text-anchor="middle">КВАДРАНТ II (III+) — V_MT2(-), I_G(+)</text>
  <text x="65" y="160" font-size="12" fill="#1a1a1a">Полярність: MT2(-), затвор(+)</text>
  <text x="65" y="182" font-size="12" font-weight="bold" fill="#2457d6">Чутливість: СЕРЕДНЯ</text>
  <text x="65" y="204" font-size="12" fill="#1a1a1a">Струм відпирання: I_GT ≈ 1.5 × I_GT1</text>
  <text x="65" y="226" font-size="12" fill="#6b7280">Потребує більшого струму керування</text>
  <rect x="55" y="244" width="380" height="30" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="245" y="264" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Керування: Позитивний імпульс (G+)</text>

  <!-- QUADRANT I (Top-Right) -->
  <rect x="510" y="100" width="410" height="190" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <rect x="525" y="112" width="380" height="28" rx="4" fill="#27ae60"/>
  <text x="715" y="131" font-size="13" font-weight="bold" fill="white" text-anchor="middle">КВАДРАНТ I (I+) — V_MT2(+), I_G(+)</text>
  <text x="535" y="160" font-size="12" fill="#1a1a1a">Полярність: MT2(+), затвор(+)</text>
  <text x="535" y="182" font-size="12" font-weight="bold" fill="#27ae60">Чутливість: ВИСОКА (Оптимальна)</text>
  <text x="535" y="204" font-size="12" fill="#1a1a1a">Струм відпирання: I_GT1 = 100% (базовий)</text>
  <text x="535" y="226" font-size="12" fill="#6b7280">Пряме вмикання позитивної півхвилі</text>
  <rect x="525" y="244" width="380" height="30" rx="4" fill="white" stroke="#27ae60"/>
  <text x="715" y="264" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">✓ РЕКОМЕНДОВАНО ДЛЯ ВИКОРИСТАННЯ</text>

  <!-- QUADRANT III (Bottom-Left) -->
  <rect x="40" y="330" width="410" height="190" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <rect x="55" y="342" width="380" height="28" rx="4" fill="#27ae60"/>
  <text x="245" y="361" font-size="13" font-weight="bold" fill="white" text-anchor="middle">КВАДРАНТ III (III-) — V_MT2(-), I_G(-)</text>
  <text x="65" y="390" font-size="12" fill="#1a1a1a">Полярність: MT2(-), затвор(-)</text>
  <text x="65" y="412" font-size="12" font-weight="bold" fill="#27ae60">Чутливість: ВИСОКА (Оптимальна)</text>
  <text x="65" y="434" font-size="12" fill="#1a1a1a">Струм відпирання: I_GT ≈ I_GT1 (100%)</text>
  <text x="65" y="456" font-size="12" fill="#6b7280">Зворотне вмикання негативної півхвилі</text>
  <rect x="55" y="474" width="380" height="30" rx="4" fill="white" stroke="#27ae60"/>
  <text x="245" y="494" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">✓ РЕКОМЕНДОВАНО ДЛЯ ВИКОРИСТАННЯ</text>

  <!-- QUADRANT IV (Bottom-Right) -->
  <rect x="510" y="330" width="410" height="190" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <rect x="525" y="342" width="380" height="28" rx="4" fill="#c0392b"/>
  <text x="715" y="361" font-size="13" font-weight="bold" fill="white" text-anchor="middle">КВАДРАНТ IV (I-) — V_MT2(+), I_G(-)</text>
  <text x="535" y="390" font-size="12" fill="#1a1a1a">Полярність: MT2(+), затвор(-)</text>
  <text x="535" y="412" font-size="12" font-weight="bold" fill="#c0392b">Чутливість: НИЗЬКА / НЕСТАБІЛЬНА</text>
  <text x="535" y="434" font-size="12" fill="#c0392b">Струм відпирання: I_GT &gt; 2.5 ... 3.0 × I_GT1</text>
  <text x="535" y="456" font-size="12" fill="#6b7280">Вилучений у Snubberless (BTA16)</text>
  <rect x="525" y="474" width="380" height="30" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="715" y="494" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">НЕБАЖАНО: Нестабільність та dI/dt стрес</text>
</svg>
