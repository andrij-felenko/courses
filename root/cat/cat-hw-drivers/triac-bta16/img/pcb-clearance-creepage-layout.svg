<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>
  
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-blue-start" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-green-start" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Топологія силової друкованої плати: ізоляційні зазори та шляхи витоку</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Правила розділення низьковольтної (МК) та високовольтної (230 В) зон для BTA16-600B</text>

  <!-- Головне панельне тло (Плату) -->
  <rect x="30" y="80" width="900" height="340" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Тло самої друкованої плати (PCB) -->
  <rect x="50" y="95" width="860" height="310" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Зона низької напруги (SELV) -->
  <rect x="65" y="110" width="335" height="280" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-dasharray="4,4" stroke-width="1.5"/>
  <text x="80" y="132" font-size="13" font-weight="bold" fill="#2457d6">Низьковольтна зона (SELV ≤ 5 В)</text>

  <!-- Зона високої напруги (HV 230V) -->
  <rect x="560" y="110" width="335" height="280" rx="6" fill="#fdecea" stroke="#c0392b" stroke-dasharray="4,4" stroke-width="1.5"/>
  <text x="575" y="132" font-size="13" font-weight="bold" fill="#c0392b">Високовольтна зона (Мережа ~230 В / 16 А)</text>

  <!-- Повітряний зазор (Clearance) вгорі -->
  <path d="M 390,162 L 570,162" fill="none" stroke="#2457d6" stroke-width="2" stroke-dasharray="4,4" marker-start="url(#arr-blue-start)" marker-end="url(#arr-blue)"/>
  <text x="480" y="130" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Clearance ≥ 3.0 мм</text>
  <text x="480" y="146" font-size="12" fill="#2457d6" text-anchor="middle">(повітряний зазор)</text>

  <!-- Фрезерований ізоляційний проріз в платі (дві частини: верхня та нижня) -->
  <rect x="473" y="172" width="14" height="25" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="473" y="287" width="14" height="65" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Оптосимістор (MOC3063) посередині між прорізами -->
  <rect x="445" y="207" width="70" height="70" rx="4" fill="#2c3e50" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="457" cy="219" r="3" fill="#ffffff"/>
  <text x="480" y="240" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">MOC3063</text>
  <text x="480" y="258" font-size="12" fill="#d0d7de" text-anchor="middle">Оптопара</text>

  <!-- Ніжки оптопари (LV сторона) -->
  <line x1="420" y1="220" x2="445" y2="220" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="420" y1="242" x2="445" y2="242" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="420" y1="264" x2="445" y2="264" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- Ніжки оптопари (HV сторона) -->
  <line x1="515" y1="220" x2="540" y2="220" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="515" y1="242" x2="540" y2="242" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="515" y1="264" x2="540" y2="264" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- Мікроконтролер (MCU) -->
  <rect x="85" y="185" width="130" height="110" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="150" y="222" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мікроконтролер</text>
  <text x="150" y="242" font-size="12" fill="#6b7280" text-anchor="middle">(MCU 3.3V / 5V)</text>
  <text x="150" y="262" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">GPIO Вихід</text>

  <!-- Доріжки від МК до оптопари -->
  <path d="M 215,220 L 420,220" fill="none" stroke="#2457d6" stroke-width="3"/>
  <text x="300" y="206" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Сигнал керування (5 В)</text>

  <path d="M 215,262 L 420,262" fill="none" stroke="#6b7280" stroke-width="3"/>
  <text x="300" y="278" font-size="12" fill="#6b7280" text-anchor="middle">Земля МК (GND)</text>

  <!-- Силовий симістор BTA16-600B -->
  <rect x="640" y="185" width="125" height="110" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="702" y="222" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">BTA16-600B</text>
  <text x="702" y="242" font-size="12" fill="#6b7280" text-anchor="middle">Силовий симістор</text>
  <text x="702" y="262" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">A1  /  A2  /  G</text>

  <!-- Доріжки від оптопари до симістора -->
  <path d="M 540,262 L 640,262" fill="none" stroke="#c0392b" stroke-width="3"/>
  <text x="600" y="278" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Керування G</text>

  <path d="M 540,220 L 640,220" fill="none" stroke="#c0392b" stroke-width="3"/>

  <!-- Клеми мережі 230 В -->
  <rect x="790" y="185" width="100" height="110" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="840" y="222" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Клеми 230 В</text>
  <text x="840" y="242" font-size="12" fill="#c0392b" text-anchor="middle">Фаза L (230 В)</text>
  <text x="840" y="262" font-size="12" fill="#2457d6" text-anchor="middle">Навантаження</text>

  <!-- Силові доріжки до клемника -->
  <path d="M 765,220 L 790,220" fill="none" stroke="#c0392b" stroke-width="5"/>
  <path d="M 765,262 L 790,262" fill="none" stroke="#c0392b" stroke-width="5"/>

  <!-- Шлях витоку струму (Creepage) вздовж поверхні навколо нижнього прорізу -->
  <path d="M 410,262 L 445,322 Q 480,340 515,322 L 550,262" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="5,3" marker-start="url(#arr-green-start)" marker-end="url(#arr-green)"/>

  <!-- Підписи Creepage -->
  <text x="260" y="325" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Creepage ≥ 6.0 мм</text>
  <text x="260" y="341" font-size="12" fill="#27ae60" text-anchor="middle">(по поверхні плати)</text>
  <text x="260" y="357" font-size="12" fill="#6b7280" text-anchor="middle">збільшено прорізом</text>
  <path d="M 330,338 L 435,338" fill="none" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Підписи Прорізу -->
  <text x="640" y="325" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Проріз (паз)</text>
  <text x="640" y="341" font-size="12" fill="#6b7280" text-anchor="middle">ширина ≥ 2.0 мм</text>
  <text x="640" y="357" font-size="12" fill="#6b7280" text-anchor="middle">усуває витік</text>
  <path d="M 580,338 L 492,338" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- Картки з правилами внизу -->
  <rect x="30" y="432" width="285" height="108" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="45" y="454" font-size="13" font-weight="bold" fill="#2457d6">1. Повітряний зазор (Clearance)</text>
  <text x="45" y="475" font-size="12" fill="#1a1a1a">• Найкоротша відстань через повітря</text>
  <text x="45" y="495" font-size="12" fill="#1a1a1a">• Норма: ≥ 3.0 мм (мережева напруга)</text>
  <text x="45" y="515" font-size="12" fill="#6b7280">• Захист від іскрового пробою</text>

  <rect x="337" y="432" width="286" height="108" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="352" y="454" font-size="13" font-weight="bold" fill="#27ae60">2. Шлях витоку (Creepage)</text>
  <text x="352" y="475" font-size="12" fill="#1a1a1a">• Відстань уздовж поверхні плати</text>
  <text x="352" y="495" font-size="12" fill="#1a1a1a">• Норма: ≥ 6.0 мм (посилена ізоляція)</text>
  <text x="352" y="515" font-size="12" fill="#6b7280">• Захист від поверхневого витоку</text>

  <rect x="645" y="432" width="285" height="108" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="660" y="454" font-size="13" font-weight="bold" fill="#c0392b">3. Фрезерований проріз (Slot)</text>
  <text x="660" y="475" font-size="12" fill="#1a1a1a">• Паз у платі між LV та HV колами</text>
  <text x="660" y="495" font-size="12" fill="#1a1a1a">• Ширина прорізу: ≥ 2.0 мм</text>
  <text x="660" y="515" font-size="12" fill="#6b7280">• Розірвання поверхні диелектрика</text>
</svg>
