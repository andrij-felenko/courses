<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="500" fill="white"/>
  
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="480" y="35" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Еквівалентна теплова схема симістора BTA16-600B</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Перепад температур між кристалом і довкіллям пропорційний розсіюваній потужності P_D</text>

  <!-- Left Panel: Physical Structure & Layers -->
  <rect x="30" y="80" width="435" height="390" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247.5" y="108" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Конструкція та теплові переходи</text>

  <!-- Heat Flow Line & Label -->
  <text x="75" y="120" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Потік P_D</text>
  <line x1="75" y1="132" x2="75" y2="410" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- Layer 1: Die / Junction -->
  <rect x="110" y="135" width="190" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="205" y="160" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кристал (Junction)</text>
  
  <line x1="300" y1="156" x2="315" y2="156" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="315" cy="156" r="4" fill="#2457d6"/>
  <text x="325" y="154" font-size="13" font-weight="bold" fill="#2457d6">T_j (Кристал)</text>
  <text x="325" y="168" font-size="12" fill="#6b7280">макс. 125 °C</text>

  <!-- Transition 1: R_th(j-c) -->
  <line x1="205" y1="177" x2="205" y2="200" stroke="#2457d6" stroke-dasharray="3,3" stroke-width="1.5"/>
  <text x="212" y="193" font-size="11" font-weight="bold" fill="#2457d6">R_th(j-c)</text>

  <!-- Layer 2: Case -->
  <rect x="110" y="200" width="190" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <text x="205" y="225" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Корпус BTA (Case)</text>

  <line x1="300" y1="221" x2="315" y2="221" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="315" cy="221" r="4" fill="#1a1a1a"/>
  <text x="325" y="219" font-size="13" font-weight="bold" fill="#1a1a1a">T_c (Корпус)</text>
  <text x="325" y="233" font-size="12" fill="#6b7280">підкладка BTA</text>

  <!-- Transition 2: R_th(c-h) -->
  <line x1="205" y1="242" x2="205" y2="265" stroke="#2457d6" stroke-dasharray="3,3" stroke-width="1.5"/>
  <text x="212" y="258" font-size="11" font-weight="bold" fill="#2457d6">R_th(c-h)</text>

  <!-- Layer 3: Thermal Interface Material -->
  <rect x="110" y="265" width="190" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-dasharray="4,2" stroke-width="1.5"/>
  <text x="205" y="286" font-size="12" fill="#1a1a1a" text-anchor="middle">Термопаста (TIM)</text>

  <!-- Transition 3: to Heatsink -->
  <line x1="205" y1="297" x2="205" y2="320" stroke="#2457d6" stroke-dasharray="3,3" stroke-width="1.5"/>

  <!-- Layer 4: Heatsink -->
  <rect x="110" y="320" width="190" height="48" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="205" y="348" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Радіатор (Heatsink)</text>

  <line x1="300" y1="344" x2="315" y2="344" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="315" cy="344" r="4" fill="#1a1a1a"/>
  <text x="325" y="342" font-size="13" font-weight="bold" fill="#1a1a1a">T_h (Радіатор)</text>
  <text x="325" y="356" font-size="12" fill="#6b7280">темп. ребр</text>

  <!-- Transition 4: R_th(h-a) -->
  <line x1="205" y1="368" x2="205" y2="395" stroke="#2457d6" stroke-dasharray="3,3" stroke-width="1.5"/>
  <text x="212" y="386" font-size="11" font-weight="bold" fill="#2457d6">R_th(h-a)</text>

  <!-- Layer 5: Ambient -->
  <line x1="110" y1="395" x2="300" y2="395" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1.5"/>
  <text x="205" y="415" font-size="13" font-weight="bold" fill="#6b7280" text-anchor="middle">Довкілля (Ambient)</text>

  <line x1="300" y1="410" x2="315" y2="410" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="315" cy="410" r="4" fill="#6b7280"/>
  <text x="325" y="408" font-size="13" font-weight="bold" fill="#6b7280">T_a (Повітря)</text>
  <text x="325" y="422" font-size="12" fill="#6b7280">напр. 25–40 °C</text>


  <!-- Right Panel: Electrical Equivalent Schematic -->
  <rect x="495" y="80" width="435" height="390" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="712.5" y="108" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Еквівалентна електрична схема</text>

  <!-- Current Source P_D -->
  <text x="545" y="112" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Джерело P_D (Вт)</text>
  <circle cx="545" cy="150" r="18" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <line x1="545" y1="162" x2="545" y2="138" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  
  <!-- Wire from P_D top to node T_j -->
  <path d="M 545 132 L 545 132 L 620 132 L 620 150" fill="none" stroke="#2457d6" stroke-width="2"/>
  
  <!-- Wire from P_D bottom to Ground -->
  <line x1="545" y1="168" x2="545" y2="390" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="545" y1="390" x2="620" y2="390" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Node T_j -->
  <circle cx="620" cy="150" r="5" fill="#2457d6"/>
  <text x="635" y="148" font-size="14" font-weight="bold" fill="#2457d6">Вузол T_j</text>
  <text x="635" y="163" font-size="12" fill="#6b7280">Температура кристала</text>

  <!-- Resistor R_th(j-c) -->
  <line x1="620" y1="150" x2="620" y2="172" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="610" y="172" width="20" height="36" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" rx="2"/>
  <line x1="620" y1="208" x2="620" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <text x="645" y="186" font-size="13" font-weight="bold" fill="#1a1a1a">R_th(j-c)</text>
  <text x="645" y="201" font-size="12" fill="#6b7280">Кристал–Корпус: 1.55 °C/Вт</text>

  <!-- Node T_c -->
  <circle cx="620" cy="230" r="4" fill="#1a1a1a"/>
  <text x="635" y="228" font-size="13" font-weight="bold" fill="#1a1a1a">Вузол T_c</text>
  <text x="635" y="242" font-size="12" fill="#6b7280">Температура корпусу BTA</text>

  <!-- Resistor R_th(c-h) -->
  <line x1="620" y1="230" x2="620" y2="252" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="610" y="252" width="20" height="36" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" rx="2"/>
  <line x1="620" y1="288" x2="620" y2="310" stroke="#1a1a1a" stroke-width="2"/>
  <text x="645" y="266" font-size="13" font-weight="bold" fill="#1a1a1a">R_th(c-h)</text>
  <text x="645" y="281" font-size="12" fill="#6b7280">Корпус–Радіатор: ~0.2–0.5 °C/Вт</text>

  <!-- Node T_h -->
  <circle cx="620" cy="310" r="4" fill="#1a1a1a"/>
  <text x="635" y="308" font-size="13" font-weight="bold" fill="#1a1a1a">Вузол T_h</text>
  <text x="635" y="322" font-size="12" fill="#6b7280">Температура радіатора</text>

  <!-- Resistor R_th(h-a) -->
  <line x1="620" y1="310" x2="620" y2="332" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="610" y="332" width="20" height="36" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" rx="2"/>
  <line x1="620" y1="368" x2="620" y2="390" stroke="#1a1a1a" stroke-width="2"/>
  <text x="645" y="346" font-size="13" font-weight="bold" fill="#1a1a1a">R_th(h-a)</text>
  <text x="645" y="361" font-size="12" fill="#6b7280">Радіатор–Довкілля (конвекція)</text>

  <!-- Node T_a / Ground -->
  <line x1="600" y1="390" x2="640" y2="390" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="606" y1="395" x2="634" y2="395" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="612" y1="399" x2="628" y2="399" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="617" y1="403" x2="623" y2="403" stroke="#1a1a1a" stroke-width="1.5"/>
  
  <text x="645" y="393" font-size="13" font-weight="bold" fill="#6b7280">Вузол T_a (Довкілля)</text>

  <!-- Formula Banner -->
  <rect x="510" y="420" width="405" height="42" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="712.5" y="437" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">R_th(j-a) = R_th(j-c) + R_th(c-h) + R_th(h-a)</text>
  <text x="712.5" y="453" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">T_j = T_a + P_D × R_th(j-a) ≤ 125 °C</text>
</svg>
