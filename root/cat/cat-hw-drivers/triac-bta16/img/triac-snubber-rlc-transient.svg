<svg viewBox="0 0 960 490" width="960" height="490" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-amber" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="490" fill="white"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Еквівалентний RLC-контур комутації симістора та демпфування dV/dt</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">RC-демпфер обмежує швидкість наростання напруги (dV/dt) і запобігає самочинному відмиканню</text>

  <!-- ==================== PANEL A: SCHEME ==================== -->
  <rect x="30" y="68" width="435" height="402" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="247" y="90" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Еквівалентна схема вимикання навантаження</text>
  <text x="247" y="108" font-size="12" fill="#6b7280" text-anchor="middle">Паралельний RLC-контур при переході струму через 0</text>

  <!-- Component Top Labels (y=142, above top rail y=160) -->
  <text x="135" y="142" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">L_L</text>
  <text x="195" y="142" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">R_L</text>
  <text x="255" y="142" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вузол A</text>
  <text x="425" y="142" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">RC-демпфер</text>

  <!-- Schematic Lines & Components -->
  <!-- Top Rail Wire segments -->
  <line x1="70" y1="160" x2="110" y2="160" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Inductor L_L -->
  <path d="M 110 160 C 110 150 122 150 122 160 C 122 150 135 150 135 160 C 135 150 148 150 148 160 C 148 150 160 150 160 160" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="160" y1="160" x2="175" y2="160" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Resistor R_L -->
  <rect x="175" y="151" width="40" height="18" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Top Rail continuation -->
  <line x1="215" y1="160" x2="435" y2="160" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Bottom Rail Wire -->
  <line x1="70" y1="350" x2="435" y2="350" stroke="#1a1a1a" stroke-width="2"/>

  <!-- AC Source Branch at x=70 -->
  <line x1="70" y1="160" x2="70" y2="237" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="70" cy="255" r="18" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 61 255 Q 65.5 247 70 255 T 79 255" fill="none" stroke="#1a1a1a" stroke-width="1.8"/>
  <line x1="70" y1="273" x2="70" y2="350" stroke="#1a1a1a" stroke-width="2"/>
  <text x="46" y="259" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">V_AC</text>

  <!-- Voltage Arrow v_VT(t) & Node A/B at x=255 -->
  <circle cx="255" cy="160" r="3.5" fill="#1a1a1a"/>
  <circle cx="255" cy="350" r="3.5" fill="#1a1a1a"/>
  <text x="255" y="372" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вузол B</text>

  <!-- Voltage Arrow Line at x=215 -->
  <line x1="215" y1="175" x2="215" y2="335" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
  <text x="203" y="259" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="end">v_VT(t)</text>

  <!-- Branch 1: Triac BTA16 at x=305 -->
  <circle cx="305" cy="160" r="3" fill="#1a1a1a"/>
  <circle cx="305" cy="350" r="3" fill="#1a1a1a"/>
  <line x1="305" y1="160" x2="305" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Antiparallel Triangles -->
  <path d="M 295 230 L 315 230 L 305 245 Z" fill="white" stroke="#1a1a1a" stroke-width="1.8"/>
  <line x1="295" y1="245" x2="315" y2="245" stroke="#1a1a1a" stroke-width="1.8"/>
  <path d="M 295 260 L 315 260 L 305 245 Z" fill="white" stroke="#1a1a1a" stroke-width="1.8"/>
  <line x1="295" y1="230" x2="315" y2="230" stroke="#1a1a1a" stroke-width="1.8"/>
  <polyline points="295,245 285,255" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="305" y1="260" x2="305" y2="350" stroke="#1a1a1a" stroke-width="2"/>
  <text x="320" y="242" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="start">Симістор</text>
  <text x="320" y="256" font-size="10" fill="#6b7280" text-anchor="start">BTA16</text>

  <!-- Branch 2: Parasitic Capacitance C_p at x=375 -->
  <circle cx="375" cy="160" r="3" fill="#1a1a1a"/>
  <circle cx="375" cy="350" r="3" fill="#1a1a1a"/>
  <line x1="375" y1="160" x2="375" y2="245" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="365" y1="245" x2="385" y2="245" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="365" y1="253" x2="385" y2="253" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="375" y1="253" x2="375" y2="350" stroke="#1a1a1a" stroke-width="2"/>
  <text x="390" y="253" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="start">C_p</text>

  <!-- Branch 3: RC Snubber Branch at x=435 -->
  <rect x="415" y="175" width="40" height="160" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="435" cy="160" r="3" fill="#1a1a1a"/>
  <circle cx="435" cy="350" r="3" fill="#1a1a1a"/>
  <line x1="435" y1="160" x2="435" y2="200" stroke="#2457d6" stroke-width="2"/>
  <!-- Resistor R_s -->
  <rect x="426" y="200" width="18" height="30" fill="white" stroke="#2457d6" stroke-width="2"/>
  <text x="408" y="220" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="end">R_s</text>
  <line x1="435" y1="230" x2="435" y2="265" stroke="#2457d6" stroke-width="2"/>
  <!-- Capacitor C_s -->
  <line x1="425" y1="265" x2="445" y2="265" stroke="#2457d6" stroke-width="2"/>
  <line x1="425" y1="273" x2="445" y2="273" stroke="#2457d6" stroke-width="2"/>
  <text x="408" y="273" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="end">C_s</text>
  <line x1="435" y1="273" x2="435" y2="350" stroke="#2457d6" stroke-width="2"/>

  <!-- Panel A Bottom Card -->
  <rect x="45" y="395" width="405" height="60" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="58" y="417" font-size="12" fill="#1a1a1a">• Власна частота контуру: f_0 = 1 / (2π √(L_L · C))</text>
  <text x="58" y="439" font-size="12" fill="#1a1a1a">• Фактор демпфування: ζ = (R_s / 2) · √(C / L_L)</text>

  <!-- ==================== PANEL B: WAVEFORM ==================== -->
  <rect x="485" y="68" width="445" height="402" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="707" y="90" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Перехідний процес напруги v_VT(t) при вимиканні</text>
  <text x="707" y="108" font-size="12" fill="#6b7280" text-anchor="middle">Порівняння наростання dV/dt з демпфером та без нього</text>

  <!-- Plot Axes -->
  <!-- Y-Axis (Voltage) -->
  <line x1="545" y1="335" x2="545" y2="135" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="537" y="138" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">v_VT (В)</text>

  <!-- X-Axis (Time) -->
  <line x1="545" y1="335" x2="885" y2="335" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="893" y="339" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">t (мкс)</text>

  <!-- Origin label 0 -->
  <text x="537" y="348" font-size="12" fill="#6b7280" text-anchor="end">0</text>

  <!-- Mains Peak Voltage V_m Reference Line -->
  <line x1="545" y1="200" x2="875" y2="200" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="537" y="204" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="end">V_m</text>

  <!-- Red Curve: WITHOUT SNUBBER (Underdamped, High dV/dt, Overshoot) -->
  <path d="M 545 335 L 580 150 L 615 245 L 650 175 L 685 215 L 720 193 L 755 203 L 790 199 L 825 200 L 875 200" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Tangent line / Slope marker for Without Snubber -->
  <line x1="545" y1="335" x2="585" y2="130" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="610" y="140" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="start">Без демпфера: dV/dt &gt; (dV/dt)_c</text>
  <text x="610" y="154" font-size="11" fill="#c0392b" text-anchor="start">Небезпека хибного відмикання!</text>

  <!-- Critical dV/dt limit line (Amber/Orange slope) -->
  <line x1="545" y1="335" x2="655" y2="170" stroke="#d97706" stroke-width="1.8" stroke-dasharray="6 3"/>
  <text x="662" y="174" font-size="11" font-weight="bold" fill="#d97706" text-anchor="start">(dV/dt)_c крит.</text>

  <!-- Green Curve: WITH RC SNUBBER (Damped, Controlled dV/dt) -->
  <path d="M 545 335 C 605 335, 665 203, 735 200 L 875 200" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <text x="690" y="245" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="start">З RC-демпфером: dV/dt &lt; (dV/dt)_c</text>
  <text x="690" y="259" font-size="11" fill="#27ae60" text-anchor="start">Безпечна комутація</text>

  <!-- Panel B Bottom Legend Card -->
  <rect x="500" y="395" width="415" height="60" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <rect x="512" y="407" width="14" height="14" rx="3" fill="#c0392b"/>
  <text x="534" y="419" font-size="12" fill="#1a1a1a">Без демпфера: високий пік dV/dt, ризик пробою</text>
  <rect x="512" y="429" width="14" height="14" rx="3" fill="#27ae60"/>
  <text x="534" y="441" font-size="12" fill="#1a1a1a">З RC-демпфером: dV/dt обмежено до безпечного рівня</text>
</svg>
