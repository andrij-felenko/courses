<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Захист симістора BTA16 при роботі на індуктивне навантаження</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">RC-демпфер обмежує dV/dt при комутації, а варистор (MOV) зрізає високовольтні сплески напруги</text>

  <!-- Left Main Panel: Circuit Diagram -->
  <rect x="40" y="85" width="550" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="60" y="105" font-size="14" font-weight="bold" fill="#1a1a1a">Схема силового кола з елементами захисту</text>

  <!-- AC Source & Input Power Lines Labels -->
  <text x="92" y="148" font-size="13" font-weight="bold" fill="#1a1a1a">L (Фаза)</text>
  <text x="92" y="435" font-size="13" font-weight="bold" fill="#1a1a1a">N (Нуль)</text>

  <!-- AC Source Circle -->
  <circle cx="85" cy="305" r="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 75,305 Q 80,296 85,305 T 95,305" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="112" y="309" font-size="12" font-weight="bold" fill="#6b7280">~ 230V</text>

  <!-- Main Power Wires -->
  <path d="M 85,165 L 85,287 M 85,323 L 85,445 M 85,165 L 158,165 M 85,445 L 525,445" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Inductive Load Box -->
  <rect x="158" y="140" width="85" height="50" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="200.5" y="160" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Індуктивне</text>
  <text x="200.5" y="177" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">навантаження</text>

  <!-- Spike Vector on Load -->
  <path d="M 160,127 L 235,127" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="200.5" y="121" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">U_L = L · di/dt</text>

  <!-- Top Rail Wires from Load -->
  <path d="M 243,165 L 525,165" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Node Dots -->
  <circle cx="260" cy="165" r="3.5" fill="#1a1a1a"/>
  <circle cx="370" cy="165" r="3.5" fill="#1a1a1a"/>
  <circle cx="525" cy="165" r="3.5" fill="#1a1a1a"/>
  <circle cx="260" cy="445" r="3.5" fill="#1a1a1a"/>
  <circle cx="370" cy="445" r="3.5" fill="#1a1a1a"/>
  <circle cx="525" cy="445" r="3.5" fill="#1a1a1a"/>

  <!-- Branch 1: TRIAC BTA16 (X = 260) -->
  <path d="M 260,165 L 260,285 M 260,325 L 260,445" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Triac Symbol -->
  <path d="M 245,285 L 275,285 L 260,315 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 245,325 L 275,325 L 260,295 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Gate Line & Box -->
  <path d="M 252,318 L 230,318 L 205,345 L 175,345" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="115" y="330" width="60" height="30" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="145" y="349" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Gate</text>
  <text x="240" y="310" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">G</text>

  <!-- Triac Labels -->
  <text x="242" y="240" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">A2 (MT2)</text>
  <text x="242" y="370" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">A1 (MT1)</text>
  <text x="242" y="268" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">BTA16-600B</text>
  <text x="242" y="284" font-size="12" fill="#6b7280" text-anchor="end">(ізольований)</text>

  <!-- Flow Arrow Blue (Snubber Current Path) -->
  <path d="M 315,205 L 315,410" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <text x="315" y="198" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">I_snubber</text>

  <!-- Branch 2: RC Snubber (X = 370) -->
  <path d="M 370,165 L 370,220 M 370,260 L 370,335 M 370,345 L 370,445" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="370" y="148" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">RC-демпфер</text>

  <!-- Resistor Rs -->
  <rect x="360" y="220" width="20" height="40" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="388" y="234" font-size="12" font-weight="bold" fill="#1a1a1a">Rs = 39–100 Ω</text>
  <text x="388" y="250" font-size="12" fill="#6b7280">(2 Вт, недротяний)</text>

  <!-- Capacitor Cs -->
  <line x1="358" y1="335" x2="382" y2="335" stroke="#2457d6" stroke-width="3"/>
  <line x1="358" y1="345" x2="382" y2="345" stroke="#2457d6" stroke-width="3"/>
  <text x="388" y="336" font-size="12" font-weight="bold" fill="#1a1a1a">Cs = 10–100 nF</text>
  <text x="388" y="352" font-size="12" fill="#6b7280">(630V / клас X2)</text>

  <!-- Branch 3: Varistor MOV (X = 525) -->
  <path d="M 525,165 L 525,285 M 525,325 L 525,445" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="525" y="148" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Варистор</text>

  <!-- Varistor MOV Symbol -->
  <rect x="515" y="285" width="20" height="40" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
  <path d="M 508,322 L 542,288 M 542,288 L 542,282 M 508,322 L 508,328" fill="none" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Varistor Labels -->
  <text x="505" y="300" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">Варистор MOV</text>
  <text x="505" y="316" font-size="12" fill="#6b7280" text-anchor="end">(390–430 В)</text>

  <!-- Flow Arrow Green (Varistor Current Path) -->
  <path d="M 560,205 L 560,410" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>
  <text x="560" y="198" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">I_var</text>

  <!-- Bottom Panel Status Box -->
  <rect x="60" y="465" width="510" height="35" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="315" y="487" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Паралельний захист A1-A2: RC шунтує dV/dt, MOV обрізає U_max</text>

  <!-- Right Main Panel: Description & Action Mechanics -->
  <rect x="605" y="85" width="315" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="625" y="108" font-size="14" font-weight="bold" fill="#1a1a1a">Принцип дії та призначення</text>

  <!-- Card 1: Problem / Inductive Surge -->
  <rect x="620" y="125" width="285" height="110" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="635" y="147" font-size="13" font-weight="bold" fill="#c0392b">⚠️ Індуктивна самоіндукція</text>
  <text x="635" y="167" font-size="12" fill="#1a1a1a">При вимкненні L виникає</text>
  <text x="635" y="185" font-size="12" fill="#1a1a1a">висока швидкість наростання</text>
  <text x="635" y="205" font-size="12" font-weight="bold" fill="#c0392b">dV/dt та сплеск напруги U_L</text>

  <!-- Card 2: RC Snubber Action -->
  <rect x="620" y="250" width="285" height="115" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="635" y="272" font-size="13" font-weight="bold" fill="#2457d6">1. Демпфер (Rs + Cs)</text>
  <text x="635" y="292" font-size="12" fill="#1a1a1a">• Шунтує ВЧ-струм комутації</text>
  <text x="635" y="310" font-size="12" fill="#1a1a1a">• Обмежує dV/dt &lt; (dV/dt)_crit</text>
  <text x="635" y="328" font-size="12" fill="#1a1a1a">• Запобігає самовідкриванню</text>
  <text x="635" y="348" font-size="12" font-weight="bold" fill="#2457d6">Захист від помилкових вмикань</text>

  <!-- Card 3: Varistor Action -->
  <rect x="620" y="380" width="285" height="120" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="635" y="402" font-size="13" font-weight="bold" fill="#27ae60">2. Варистор (MOV)</text>
  <text x="635" y="422" font-size="12" fill="#1a1a1a">• Обрізає піки U &gt; U_var</text>
  <text x="635" y="440" font-size="12" fill="#1a1a1a">• Поглинає енергію сплеску</text>
  <text x="635" y="458" font-size="12" fill="#1a1a1a">• Захищає від пробою A1-A2</text>
  <text x="635" y="478" font-size="12" font-weight="bold" fill="#27ae60">Захист від високої напруги</text>
</svg>
