<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="960" height="570" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="570" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">MOC3063: Призначення виводів та внутрішня блок-схема</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Принцип роботи оптосимістора з детектором нуля (Zero-Cross) у корпусі DIP-6</text>

  <!-- Корпус мікросхеми DIP-6 -->
  <rect x="240" y="88" width="480" height="352" rx="12" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  
  <!-- Ключ (виїмка) корпусу DIP-6 -->
  <path d="M 466 88 A 14 14 0 0 0 494 88 Z" fill="#d0d7de"/>

  <!-- Заголовок всередині корпусу -->
  <text x="480" y="118" font-size="13" font-weight="bold" fill="#6b7280" text-anchor="middle">ВНУТРІШНЯ СТРУКТУРА ОПТОСИМІСТОРА (DIP-6)</text>

  <!-- Металеві виводи (ніжки DIP-6) -->
  <!-- Вивод 1 -->
  <rect x="195" y="142" width="45" height="16" rx="3" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>
  <!-- Вивод 2 -->
  <rect x="195" y="262" width="45" height="16" rx="3" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>
  <!-- Вивод 3 -->
  <rect x="195" y="382" width="45" height="16" rx="3" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>
  <!-- Вивод 6 -->
  <rect x="720" y="142" width="45" height="16" rx="3" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>
  <!-- Вивод 5 -->
  <rect x="720" y="262" width="45" height="16" rx="3" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>
  <!-- Вивод 4 -->
  <rect x="720" y="382" width="45" height="16" rx="3" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>

  <!-- Кружечки з номерами виводів -->
  <circle cx="250" cy="150" r="11" fill="#2457d6"/>
  <text x="250" y="154" font-size="12" font-weight="bold" fill="white" text-anchor="middle">1</text>

  <circle cx="250" cy="270" r="11" fill="#2457d6"/>
  <text x="250" y="274" font-size="12" font-weight="bold" fill="white" text-anchor="middle">2</text>

  <circle cx="250" cy="390" r="11" fill="#6b7280"/>
  <text x="250" y="394" font-size="12" font-weight="bold" fill="white" text-anchor="middle">3</text>

  <circle cx="710" cy="150" r="11" fill="#c0392b"/>
  <text x="710" y="154" font-size="12" font-weight="bold" fill="white" text-anchor="middle">6</text>

  <circle cx="710" cy="270" r="11" fill="#6b7280"/>
  <text x="710" y="274" font-size="12" font-weight="bold" fill="white" text-anchor="middle">5</text>

  <circle cx="710" cy="390" r="11" fill="#c0392b"/>
  <text x="710" y="394" font-size="12" font-weight="bold" fill="white" text-anchor="middle">4</text>

  <!-- Підписи виводів зовні корпусу -->
  <!-- Вивод 1 -->
  <text x="185" y="144" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">Pin 1: Anode (Анод)</text>
  <text x="185" y="160" font-size="12" fill="#6b7280" text-anchor="end">Вхід керування (LED +)</text>

  <!-- Вивод 2 -->
  <text x="185" y="264" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">Pin 2: Cathode (Катод)</text>
  <text x="185" y="280" font-size="12" fill="#6b7280" text-anchor="end">Спільний / Земля (LED -)</text>

  <!-- Вивод 3 -->
  <text x="185" y="384" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">Pin 3: NC</text>
  <text x="185" y="400" font-size="12" fill="#6b7280" text-anchor="end">Не підключено</text>

  <!-- Вивод 6 -->
  <text x="775" y="144" font-size="13" font-weight="bold" fill="#1a1a1a">Pin 6: Main Terminal 2</text>
  <text x="775" y="160" font-size="12" fill="#6b7280">Вихід до симістора/AC</text>

  <!-- Вивод 5 -->
  <text x="775" y="264" font-size="13" font-weight="bold" fill="#1a1a1a">Pin 5: NC / Substrate</text>
  <text x="775" y="280" font-size="12" fill="#6b7280">Не використовувати</text>

  <!-- Вивод 4 -->
  <text x="775" y="384" font-size="13" font-weight="bold" fill="#1a1a1a">Pin 4: Main Terminal 1</text>
  <text x="775" y="400" font-size="12" fill="#6b7280">Вихід до навантаження</text>

  <!-- Внутрішні провідники та компоненти -->

  <!-- Вхідне коло (LED) -->
  <!-- Провідник від Pin 1 (261, 150) -->
  <path d="M 261 150 L 300 150 L 300 210 L 320 210" fill="none" stroke="#2457d6" stroke-width="2"/>
  <!-- Провідник від Pin 2 (261, 270) -->
  <path d="M 261 270 L 360 270 L 360 210 L 340 210" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Світлодіод (GaAs IR LED) -->
  <polygon points="320,195 320,225 340,210" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="340" y1="195" x2="340" y2="225" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Стрілочки випромінювання світла від LED -->
  <line x1="335" y1="188" x2="349" y2="174" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="341" y1="194" x2="355" y2="180" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Підписи до LED -->
  <text x="330" y="244" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GaAs ІЧ-LED</text>
  <text x="330" y="258" font-size="12" fill="#2457d6" text-anchor="middle">I_FT ≤ 5 mA</text>

  <!-- Pin 3 внутрішній непідключений провідник -->
  <line x1="261" y1="390" x2="310" y2="390" stroke="#6b7280" stroke-width="2" stroke-dasharray="3,3"/>
  <circle cx="310" cy="390" r="3" fill="#6b7280"/>
  <text x="270" y="382" font-size="12" fill="#6b7280">NC (без кристала)</text>

  <!-- Гальванічна розв'язка (Ізоляційний бар'єр) -->
  <rect x="395" y="135" width="50" height="290" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-dasharray="4,4" stroke-width="1.5"/>
  
  <text x="420" y="185" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Світло (hν)</text>
  
  <!-- Промені світла через бар'єр -->
  <line x1="350" y1="205" x2="455" y2="205" stroke="#2457d6" stroke-dasharray="4,2" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="350" y1="215" x2="455" y2="215" stroke="#2457d6" stroke-dasharray="4,2" stroke-width="2" marker-end="url(#arr-blue)"/>

  <text x="420" y="270" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ІЗОЛЯЦІЯ</text>
  <text x="420" y="286" font-size="12" fill="#6b7280" text-anchor="middle">5300 VAC</text>

  <!-- Блок Zero-Cross (Детектор нуля) -->
  <rect x="460" y="160" width="125" height="180" rx="8" fill="white" stroke="#27ae60" stroke-width="2"/>
  <rect x="460" y="160" width="125" height="28" rx="8" fill="#e9f7ef"/>
  <text x="522.5" y="179" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Zero-Cross Детектор</text>

  <text x="522.5" y="202" font-size="12" fill="#1a1a1a" text-anchor="middle">Фотодетектор та</text>
  <text x="522.5" y="218" font-size="12" fill="#1a1a1a" text-anchor="middle">контроль фази AC</text>

  <text x="522.5" y="242" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Умова вмикання:</text>
  <text x="522.5" y="258" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">|V_AC| &lt; V_INH</text>

  <text x="522.5" y="282" font-size="12" fill="#6b7280" text-anchor="middle">V_INH = 20 V max</text>
  <text x="522.5" y="310" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">При &gt; 20V — БЛОК</text>

  <!-- Силові провідники виходу (Pin 6 та Pin 4) -->
  <!-- Провідник від Pin 6 (699, 150) -->
  <path d="M 699 150 L 522.5 150" fill="none" stroke="#c0392b" stroke-width="2"/>
  <path d="M 685 150 L 685 225 L 645 225" fill="none" stroke="#c0392b" stroke-width="2"/>
  <!-- Лінія контролю напруги від Pin 6 до Zero-Cross -->
  <path d="M 522.5 150 L 522.5 160" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="522.5" cy="150" r="3" fill="#c0392b"/>

  <!-- Провідник від Pin 4 (699, 390) -->
  <path d="M 699 390 L 522.5 390" fill="none" stroke="#c0392b" stroke-width="2"/>
  <path d="M 685 390 L 685 275 L 645 275" fill="none" stroke="#c0392b" stroke-width="2"/>
  <!-- Лінія контролю напруги від Pin 4 до Zero-Cross -->
  <path d="M 522.5 390 L 522.5 340" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="522.5" cy="390" r="3" fill="#c0392b"/>

  <!-- Фотосимістор (TRIAC symbol) -->
  <!-- Анодна лінія зверху (y=225) та знизу (y=275) -->
  <line x1="633" y1="225" x2="657" y2="225" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="633" y1="275" x2="657" y2="275" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- Два зустрічно-паралельні тиристори -->
  <polygon points="635,225 655,225 645,250" fill="#1a1a1a"/>
  <polygon points="635,275 655,275 645,250" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Gate вивід від Zero-Cross до TRIAC -->
  <path d="M 585 250 L 615 250 L 625 260" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="605" y="242" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Gate</text>

  <!-- Напис до фотосимістора -->
  <text x="635" y="195" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Фотосимістор</text>
  <text x="635" y="211" font-size="12" fill="#6b7280" text-anchor="middle">V_DRM = 600 V</text>

  <!-- Pin 5 непідключений провідник -->
  <line x1="699" y1="270" x2="670" y2="270" stroke="#6b7280" stroke-width="2" stroke-dasharray="3,3"/>
  <circle cx="670" cy="270" r="3" fill="#6b7280"/>
  <text x="665" y="292" font-size="12" fill="#6b7280" text-anchor="end">NC (не вик.)</text>


  <!-- Картки-підсумки з ключовими параметрами знизу -->

  <!-- Картка 1: Вхідне коло -->
  <rect x="30" y="460" width="285" height="82" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="45" y="480" font-size="13" font-weight="bold" fill="#2457d6">Вхідне коло (ІЧ-світлодіод)</text>
  <text x="45" y="498" font-size="12" fill="#1a1a1a">• I_FT = 5 mA (струм увімкнення)</text>
  <text x="45" y="514" font-size="12" fill="#1a1a1a">• V_F = 1.2…1.5 V (падіння V)</text>
  <text x="45" y="530" font-size="12" fill="#6b7280">• R_lim = (V_CC - V_F) / I_FT</text>

  <!-- Картка 2: Детектор нуля -->
  <rect x="337" y="460" width="285" height="82" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="352" y="480" font-size="13" font-weight="bold" fill="#27ae60">Детектор нуля (Zero-Cross)</text>
  <text x="352" y="498" font-size="12" fill="#1a1a1a">• V_INH = 20 V (поріг блоку)</text>
  <text x="352" y="514" font-size="12" fill="#1a1a1a">• Відмикання при V_AC ≈ 0V</text>
  <text x="352" y="530" font-size="12" fill="#6b7280">• Зменшення завад мережі</text>

  <!-- Картка 3: Силовий вихід -->
  <rect x="645" y="460" width="285" height="82" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="660" y="480" font-size="13" font-weight="bold" fill="#c0392b">Силовий фотосимістор</text>
  <text x="660" y="498" font-size="12" fill="#1a1a1a">• V_DRM = 600 V (макс. напруга)</text>
  <text x="660" y="514" font-size="12" fill="#1a1a1a">• dv/dt = 1000 V/µs (стійкість)</text>
  <text x="660" y="530" font-size="12" fill="#6b7280">• Керування зовнішнім триаком</text>

</svg>
