<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Трасування PCB: Гальванічна ізоляція та розмежування зон 5 В / 220 В</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Фрезерований проріз (Slot) під оптосимістором MOC3063 збільшує шлях витоку (Creepage)</text>

  <!-- Panel 1: Low Voltage Zone (Left) -->
  <rect x="35" y="75" width="355" height="355" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <path d="M 35,81 A 6,6 0 0,1 41,75 L 384,75 A 6,6 0 0,1 390,81 L 390,107 L 35,107 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="212.5" y="96" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Низьковольтна зона (DC 5V / МК)</text>

  <!-- Low Voltage Components & Traces -->
  <!-- Input Connector CON1 -->
  <text x="85" y="125" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вхід МК</text>
  <rect x="55" y="133" width="60" height="90" rx="4" fill="#27ae60" stroke="#1e8449" stroke-width="1.5"/>
  <!-- Screw Terminal 1 -->
  <circle cx="85" cy="158" r="11" fill="#1e8449"/>
  <text x="85" y="162" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">+5V</text>
  <!-- Screw Terminal 2 -->
  <circle cx="85" cy="198" r="11" fill="#1e8449"/>
  <text x="85" y="202" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">GND</text>

  <!-- Resistor R1 -->
  <text x="170" y="143" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">R1 (220 Ω)</text>
  <rect x="145" y="150" width="50" height="22" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>

  <!-- Status LED -->
  <text x="245" y="143" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">LED</text>
  <circle cx="245" cy="161" r="10" fill="#27ae60" stroke="#1e8449" stroke-width="2"/>

  <!-- Pin 1 & Pin 2 Labels -->
  <text x="375" y="148" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="end">Pin 1 (Анод)</text>
  <text x="375" y="188" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="end">Pin 2 (Катод)</text>

  <!-- Copper Traces (LV) -->
  <path d="M 115,158 L 145,158 M 195,158 L 235,158 M 255,158 L 410,158" fill="none" stroke="#2457d6" stroke-width="4" stroke-linecap="round"/>
  <path d="M 115,198 L 410,198" fill="none" stroke="#2457d6" stroke-width="4" stroke-linecap="round"/>

  <!-- Ground Pour (GND) -->
  <rect x="50" y="260" width="325" height="150" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="212.5" y="285" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Земляний полігон GND</text>
  <text x="212.5" y="308" font-size="12" fill="#6b7280" text-anchor="middle">Відступ від бар'єру ізоляції ≥ 3.0 мм</text>
  <text x="212.5" y="340" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Зазор полігону ≥ 3.0 мм</text>
  <line x1="280" y1="375" x2="380" y2="375" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="330" y="365" font-size="11" fill="#2457d6" text-anchor="middle">d ≥ 3.0 мм</text>


  <!-- Panel 2: Isolation Barrier (Center) -->
  <rect x="405" y="75" width="150" height="355" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="480" y="96" font-size="13" font-weight="bold" fill="#6b7280" text-anchor="middle">Бар'єр ізоляції</text>

  <!-- Top Clearance Annotation Line -->
  <line x1="390" y1="118" x2="570" y2="118" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
  <text x="480" y="112" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Clearance = 7.6 мм</text>

  <!-- Top and Bottom Slot Sections -->
  <text x="465" y="140" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="end">Проріз (Slot)</text>
  <rect x="473" y="125" width="14" height="25" rx="2" fill="#ffffff" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="473" y="254" width="14" height="55" rx="2" fill="#ffffff" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- MOC3063 IC Package -->
  <rect x="425" y="152" width="110" height="100" rx="4" fill="#2c3e50" stroke="#1a252f" stroke-width="2"/>
  <!-- Slot continuation through package -->
  <path d="M 473,152 L 473,252 M 487,152 L 487,252" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,2"/>
  <!-- Pin 1 Dot -->
  <circle cx="438" cy="164" r="3" fill="#ffffff"/>

  <!-- Inside IC Text Labels -->
  <text x="448" y="182" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">MOC3063</text>
  <text x="448" y="202" font-size="11" fill="#bdc3c7" text-anchor="middle">DC 5V</text>
  <text x="511" y="182" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">AC 220V</text>
  <text x="511" y="202" font-size="11" fill="#bdc3c7" text-anchor="middle">Силова</text>

  <!-- IC Pins -->
  <!-- Left Side Pins -->
  <rect x="410" y="153" width="15" height="10" rx="1" fill="#d0d7de"/>
  <rect x="410" y="193" width="15" height="10" rx="1" fill="#d0d7de"/>
  <rect x="410" y="233" width="15" height="10" rx="1" fill="#d0d7de"/>
  <!-- Right Side Pins -->
  <rect x="535" y="153" width="15" height="10" rx="1" fill="#d0d7de"/>
  <rect x="535" y="193" width="15" height="10" rx="1" fill="#d0d7de"/>
  <rect x="535" y="233" width="15" height="10" rx="1" fill="#d0d7de"/>

  <!-- Creepage Path around slot -->
  <path d="M 410,198 C 390,290 440,315 480,315 C 520,315 570,290 550,238" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <rect x="415" y="330" width="130" height="42" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="348" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Creepage &gt; 8.0 мм</text>
  <text x="480" y="364" font-size="11" fill="#6b7280" text-anchor="middle">вздовж прорізу</text>


  <!-- Panel 3: High Voltage Zone (Right) -->
  <rect x="570" y="75" width="355" height="355" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <path d="M 570,81 A 6,6 0 0,1 576,75 L 919,75 A 6,6 0 0,1 925,81 L 925,107 L 570,107 Z" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="747.5" y="96" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Високовольтна зона (AC 220V / Силова)</text>

  <!-- Pin 6 & Pin 4 Labels -->
  <text x="585" y="148" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="start">Pin 6 (Hot)</text>
  <text x="585" y="228" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="start">Pin 4 (Gate)</text>

  <!-- Gate Resistor Rg -->
  <text x="630" y="143" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Rg (360 Ω)</text>
  <rect x="605" y="150" width="50" height="22" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>

  <!-- Triac BTA16 -->
  <!-- Heatsink tab -->
  <rect x="740" y="132" width="60" height="14" rx="2" fill="#bdc3c7" stroke="#7f8c8d"/>
  <!-- Body -->
  <rect x="740" y="146" width="60" height="90" rx="4" fill="#34495e" stroke="#1a252f" stroke-width="2"/>
  <text x="770" y="170" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">BTA16</text>
  <text x="770" y="188" font-size="11" fill="#bdc3c7" text-anchor="middle">600V 16A</text>
  <!-- Triac Pin Labels inside package body at bottom -->
  <text x="753" y="226" font-size="11" font-weight="bold" fill="#bdc3c7" text-anchor="middle">A1</text>
  <text x="770" y="226" font-size="11" font-weight="bold" fill="#bdc3c7" text-anchor="middle">A2</text>
  <text x="787" y="226" font-size="11" font-weight="bold" fill="#bdc3c7" text-anchor="middle">G</text>

  <!-- Triac Pin Traces / Terminals -->
  <line x1="753" y1="236" x2="753" y2="256" stroke="#c0392b" stroke-width="4"/>
  <line x1="770" y1="236" x2="770" y2="256" stroke="#c0392b" stroke-width="4"/>
  <line x1="787" y1="236" x2="787" y2="256" stroke="#c0392b" stroke-width="4"/>

  <!-- Connector CON2 (220V AC Output) -->
  <text x="880" y="125" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">220V AC</text>
  <rect x="850" y="133" width="60" height="90" rx="4" fill="#c0392b" stroke="#922b21" stroke-width="1.5"/>
  <!-- Screw Terminal L -->
  <circle cx="880" cy="158" r="11" fill="#922b21"/>
  <text x="880" y="162" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">L</text>
  <!-- Screw Terminal N -->
  <circle cx="880" cy="198" r="11" fill="#922b21"/>
  <text x="880" y="202" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">N</text>

  <!-- HV Copper Traces -->
  <!-- Pin 6 -> Rg -> Line L & Triac A2 -->
  <path d="M 550,158 L 605,158 M 655,158 L 850,158" fill="none" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
  <!-- Top connection to A2 tab/heatsink area -->
  <path d="M 770,158 L 770,146" fill="none" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
  <!-- Pin 4 -> Gate (G) -->
  <path d="M 550,238 L 787,238 L 787,256" fill="none" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>
  <!-- Triac A1 -> Load Terminal N -->
  <path d="M 753,256 L 753,280 L 880,280 L 880,209" fill="none" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>

  <!-- RC Snubber Components (Rs + Cs) -->
  <text x="625" y="298" font-size="11" fill="#c0392b" text-anchor="middle">Rs 39 Ω</text>
  <rect x="602" y="304" width="46" height="20" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="692" y="298" font-size="11" fill="#c0392b" text-anchor="middle">Cs 10 nF</text>
  <rect x="669" y="304" width="46" height="20" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <!-- Snubber connections across Triac A1 & A2 -->
  <path d="M 730,158 L 730,314 L 715,314 M 669,314 L 648,314 M 602,314 L 585,314 L 585,280 L 753,280" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="660" y="340" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">RC-снабер (придушення dV/dt)</text>

  <!-- HV Clearance Box inside right panel -->
  <rect x="585" y="358" width="325" height="55" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="747.5" y="380" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Зазор між силовими доріжками ≥ 3.0 мм</text>
  <text x="747.5" y="398" font-size="11" fill="#6b7280" text-anchor="middle">Ширина силових провідників ≥ 2.5 мм</text>


  <!-- Bottom Summary Cards (Rules & Definitions) -->
  <!-- Card 1: Clearance -->
  <rect x="35" y="445" width="435" height="72" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="50" y="466" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="start">Clearance (Повітряний зазор):</text>
  <text x="50" y="486" font-size="12" fill="#1a1a1a" text-anchor="start">Найкоротша відстань по повітрю між провідниками.</text>
  <text x="50" y="504" font-size="12" fill="#6b7280" text-anchor="start">Мережеве коло 220 В потребує зазору ≥ 3.0 мм.</text>

  <!-- Card 2: Creepage & Slot -->
  <rect x="490" y="445" width="435" height="72" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="505" y="466" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="start">Creepage (Шлях витоку) &amp; Slot:</text>
  <text x="505" y="486" font-size="12" fill="#1a1a1a" text-anchor="start">Найкоротший шлях поверхнею діелектрика (текстоліту).</text>
  <text x="505" y="504" font-size="12" fill="#27ae60" text-anchor="start">Фрезерований проріз блокує витік струму через забруднення.</text>
</svg>
