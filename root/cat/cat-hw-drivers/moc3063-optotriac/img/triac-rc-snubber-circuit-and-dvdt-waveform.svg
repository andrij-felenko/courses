<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Стрілки в defs -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема RC-снабера симістора та осцилограма наростання напруги (dv/dt)</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">RC-снабер обмежує крутизну фронту dv/dt та гасить індуктивні сплески напруги до безпечного рівня</text>

  <!-- ЛІВА ПАНЕЛЬ: Електрична схема -->
  <rect x="30" y="80" width="425" height="415" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="242.5" y="108" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Електрична схема з RC-снабером</text>

  <!-- Блок індуктивного навантаження -->
  <text x="195" y="132" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Індуктивне навантаження</text>
  <rect x="130" y="140" width="130" height="48" fill="white" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="154" y="151" font-size="12" fill="#1a1a1a" text-anchor="middle">R_L</text>
  <rect x="143" y="156" width="22" height="16" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 130,164 L 143,164" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 165,164 L 182,164" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="210" y="151" font-size="12" fill="#1a1a1a" text-anchor="middle">L_L</text>
  <path d="M 182,164 Q 189,154 196,164 Q 203,154 210,164 Q 217,154 224,164 Q 231,154 238,164" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 238,164 L 260,164" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Джерело змінного струму -->
  <text x="95" y="148" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">L1</text>
  <text x="95" y="462" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">N</text>
  <circle cx="95" cy="290" r="18" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 83,290 Q 89,280 95,290 T 107,290" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="70" y="284" font-size="12" fill="#1a1a1a" text-anchor="end">~220 В</text>
  <text x="70" y="302" font-size="12" fill="#6b7280" text-anchor="end">50 Гц</text>

  <!-- Провідники живлення -->
  <path d="M 95,272 L 95,164 L 130,164" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 260,164 L 410,164" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 95,308 L 95,440 L 410,440" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Силовий симістор VT1 -->
  <circle cx="295" cy="164" r="3.5" fill="#1a1a1a"/>
  <path d="M 295,164 L 295,230" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 283,230 L 307,230 L 295,250 Z" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 283,270 L 307,270 L 295,250 Z" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 283,230 L 283,270" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 307,230 L 307,270" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 295,270 L 295,440" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="295" cy="440" r="3.5" fill="#1a1a1a"/>
  <text x="318" y="245" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">VT1</text>
  <text x="318" y="262" font-size="12" fill="#6b7280" text-anchor="start">симістор</text>

  <!-- Оптосимістор MOC3063 та затворна розв'язка -->
  <rect x="45" y="335" width="145" height="80" fill="white" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="117" y="358" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">MOC3063</text>
  <text x="117" y="376" font-size="12" fill="#6b7280" text-anchor="middle">Детектор нуля</text>
  <text x="117" y="394" font-size="12" fill="#6b7280" text-anchor="middle">(Zero-Cross)</text>
  <path d="M 190,365 L 210,365" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="210" y="357" width="28" height="16" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="224" y="348" font-size="12" fill="#1a1a1a" text-anchor="middle">R_g</text>
  <path d="M 238,365 L 258,365 L 258,260 L 283,260" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- RC-снабер -->
  <text x="410" y="148" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">RC-снабер</text>
  <rect x="374" y="175" width="72" height="245" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4 3" rx="6"/>
  <circle cx="410" cy="164" r="3.5" fill="#1a1a1a"/>
  <path d="M 410,164 L 410,215" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="402" y="215" width="16" height="36" fill="white" stroke="#27ae60" stroke-width="2"/>
  <text x="424" y="237" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">R_s</text>
  <path d="M 410,251 L 410,295" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 398,295 L 422,295" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <path d="M 398,303 L 422,303" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <text x="426" y="303" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">C_s</text>
  <path d="M 410,303 L 410,440" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="410" cy="440" r="3.5" fill="#1a1a1a"/>

  <!-- ПРАВА ПАНЕЛЬ: Часова діаграма -->
  <rect x="480" y="80" width="450" height="415" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="705" y="108" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Перехідний процес напруги v_VT(t) при вимкненні</text>

  <!-- Осі координат -->
  <path d="M 535,400 L 895,400" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="895" y="425" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Час (t)</text>

  <path d="M 540,415 L 540,130" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="540" y="120" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Напруга v_VT</text>

  <!-- Горизонтальні рівні напруги -->
  <path d="M 540,165 L 890,165" fill="none" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="885" y="155" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">V_DRM (гранична напруга)</text>

  <path d="M 540,230 L 890,230" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="2 2"/>
  <text x="885" y="220" font-size="12" fill="#6b7280" text-anchor="end">V_m (амплітуда мережі)</text>

  <!-- Вертикальна лінія моменту вимкнення t0 -->
  <path d="M 580,140 L 580,400" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="580" y="420" font-size="12" fill="#6b7280" text-anchor="middle">t_0 (i = 0)</text>

  <!-- Критична дотична dv/dt_crit -->
  <path d="M 580,400 L 645,160" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="650" y="140" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">(dv/dt)_crit</text>

  <!-- Крива БЕЗ СНАБЕРА (червона, сплеск і помилкове відкривання) -->
  <path d="M 540,400 L 580,400 C 583,320 586,145 592,145 C 596,145 599,220 603,400 L 890,400" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="592" cy="145" r="3.5" fill="#c0392b"/>

  <!-- Крива З RC-СНАБЕРОМ (зелена, демпфований процес) -->
  <path d="M 540,400 L 580,400 C 600,400 620,230 655,230 L 890,230" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Інформаційні плашки / Висновки -->
  <!-- Червона плашка -->
  <rect x="665" y="250" width="220" height="65" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="5"/>
  <text x="677" y="268" font-size="12" font-weight="bold" fill="#c0392b">Без снабера:</text>
  <text x="677" y="286" font-size="12" fill="#c0392b">• dv/dt &gt; (dv/dt)_crit</text>
  <text x="677" y="304" font-size="12" font-weight="bold" fill="#c0392b">• Помилкове вмикання!</text>

  <!-- Зелена плашка -->
  <rect x="665" y="325" width="220" height="65" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="5"/>
  <text x="677" y="343" font-size="12" font-weight="bold" fill="#27ae60">З RC-снабером:</text>
  <text x="677" y="361" font-size="12" fill="#27ae60">• dv/dt &lt; (dv/dt)_crit</text>
  <text x="677" y="379" font-size="12" font-weight="bold" fill="#27ae60">• Надійне блокування</text>
</svg>
