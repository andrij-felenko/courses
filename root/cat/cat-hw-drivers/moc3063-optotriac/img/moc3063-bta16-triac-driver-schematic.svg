<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема керування симістором BTA16 через оптосимістор MOC3063</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Гальванічна розв'язка, Zero-Crossing комутація та RC-снаберний захист від завад</text>

  <!-- Panel 1: Low Voltage MCU Control -->
  <rect x="25" y="70" width="215" height="380" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="132.5" y="94" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Керування (MCU)</text>

  <!-- Panel 2: MOC3063 Optocoupler -->
  <rect x="255" y="70" width="225" height="380" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="8"/>
  <text x="367.5" y="94" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">2. Оптосимістор MOC3063</text>

  <!-- Panel 3: High Voltage AC Mains -->
  <rect x="495" y="70" width="440" height="380" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="715" y="94" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">3. Силова мережа ~220 В</text>

  <!-- SCHEMATIC CONNECTIONS & COMPONENTS -->

  <!-- Panel 1 Elements -->
  <!-- MCU Signal Node -->
  <circle cx="60" cy="160" r="4" fill="#2457d6"/>
  <text x="60" y="120" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">MCU GPIO</text>
  <text x="60" y="136" font-size="12" fill="#6b7280" text-anchor="middle">+5V / +3.3V</text>

  <!-- Wire from MCU to Rin -->
  <line x1="60" y1="160" x2="115" y2="160" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Resistor Rin -->
  <rect x="115" y="150" width="45" height="20" fill="white" stroke="#1a1a1a" stroke-width="2" rx="2"/>
  <text x="137.5" y="120" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">R_in</text>
  <text x="137.5" y="136" font-size="12" fill="#6b7280" text-anchor="middle">330 Ом</text>

  <!-- Wire from Rin to Pin 1 -->
  <line x1="160" y1="160" x2="285" y2="160" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Current Flow Arrow on Rin wire -->
  <line x1="175" y1="160" x2="235" y2="160" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="205" y="120" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">I_F = 7.5 mA</text>
  <text x="205" y="184" font-size="12" fill="#6b7280" text-anchor="middle">(I_FT = 5 mA)</text>

  <!-- Return Wire from Pin 2 to GND -->
  <line x1="285" y1="320" x2="135" y2="320" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="135" y1="320" x2="135" y2="360" stroke="#1a1a1a" stroke-width="2"/>

  <!-- GND Symbol -->
  <line x1="120" y1="360" x2="150" y2="360" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="125" y1="365" x2="145" y2="365" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="130" y1="370" x2="140" y2="370" stroke="#1a1a1a" stroke-width="2"/>
  <text x="135" y="390" font-size="12" fill="#6b7280" text-anchor="middle">GND (MCU)</text>

  <!-- Panel 2 Elements: MOC3063 -->
  <!-- IC Outline -->
  <rect x="285" y="115" width="165" height="295" fill="white" stroke="#2457d6" stroke-width="2" rx="6"/>
  <!-- IC Notch -->
  <path d="M 357 115 A 10 10 0 0 0 377 115 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="367" y="138" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">MOC3063</text>

  <!-- Pin Dots & Numbers -->
  <circle cx="285" cy="160" r="4" fill="#2457d6"/>
  <text x="298" y="148" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1</text>

  <circle cx="285" cy="320" r="4" fill="#2457d6"/>
  <text x="298" y="308" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2</text>

  <circle cx="285" cy="370" r="3" fill="#6b7280"/>
  <text x="298" y="374" font-size="12" fill="#6b7280" text-anchor="start">3 (NC)</text>

  <circle cx="450" cy="160" r="4" fill="#2457d6"/>
  <text x="436" y="148" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">6</text>

  <circle cx="450" cy="275" r="3" fill="#6b7280"/>
  <text x="442" y="279" font-size="12" fill="#6b7280" text-anchor="end">5 (NC)</text>

  <circle cx="450" cy="320" r="4" fill="#2457d6"/>
  <text x="436" y="308" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">4</text>

  <!-- LED Internal Wires & Diode Symbol -->
  <line x1="285" y1="160" x2="325" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="325" y1="160" x2="325" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
  
  <!-- LED Anode Triangle & Cathode Bar -->
  <polygon points="313,200 337,200 325,220" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="313" y1="220" x2="337" y2="220" stroke="#2457d6" stroke-width="2.5"/>

  <line x1="325" y1="220" x2="325" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="325" y1="320" x2="285" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Optical Light Emission Arrows -->
  <line x1="338" y1="206" x2="354" y2="214" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="338" y1="218" x2="354" y2="226" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Optical Isolation Barrier -->
  <line x1="365" y1="150" x2="365" y2="365" stroke="#2457d6" stroke-dasharray="4,3" stroke-width="1.5"/>
  <text x="365" y="390" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Ізоляція 5 кВ</text>

  <!-- Zero-Crossing Detector Block -->
  <rect x="367" y="180" width="56" height="38" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="395" y="196" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Детектор</text>
  <text x="395" y="210" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">нуля</text>

  <!-- Phototriac Internal Circuit -->
  <line x1="450" y1="160" x2="395" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="395" y1="160" x2="395" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="395" y1="218" x2="395" y2="238" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Phototriac Symbol (anti-parallel triangles) -->
  <polygon points="385,238 405,238 395,253" fill="#2457d6"/>
  <polygon points="385,253 405,253 395,238" fill="white" stroke="#2457d6" stroke-width="1.5"/>

  <line x1="395" y1="253" x2="395" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="395" y1="320" x2="450" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Panel 3 Elements: Power Triac & AC Circuit -->

  <!-- Top AC Line (Hot / L) from Pin 6 to MT2 node & Load -->
  <line x1="450" y1="160" x2="710" y2="160" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="710" y1="160" x2="710" y2="125" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="710" y1="125" x2="825" y2="125" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Node at (710, 125) -->
  <circle cx="710" cy="125" r="4" fill="#1a1a1a"/>

  <!-- Node at (825, 125) for Snubber -->
  <circle cx="825" cy="125" r="4" fill="#1a1a1a"/>

  <!-- Wire to Load -->
  <line x1="825" y1="125" x2="840" y2="125" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Load Component -->
  <rect x="840" y="110" width="75" height="30" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="4"/>
  <text x="877.5" y="129" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Навантаження</text>

  <!-- Wire from Load to Phase Terminal L -->
  <line x1="915" y1="125" x2="922" y2="125" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="922" cy="125" r="4" fill="#c0392b"/>
  <text x="922" y="105" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">L (~220 В)</text>

  <!-- Gate Drive Circuit (MOC Pin 4 -> RG -> Gate) -->
  <line x1="450" y1="320" x2="515" y2="320" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- Resistor RG -->
  <rect x="515" y="310" width="45" height="20" fill="white" stroke="#1a1a1a" stroke-width="2" rx="2"/>
  <text x="537.5" y="276" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">R_G</text>
  <text x="537.5" y="292" font-size="12" fill="#6b7280" text-anchor="middle">360 Ом</text>
  <text x="537.5" y="348" font-size="12" fill="#6b7280" text-anchor="middle">обмежувач</text>
  <text x="537.5" y="362" font-size="12" fill="#6b7280" text-anchor="middle">затвора</text>

  <!-- Wire from RG to Gate Node -->
  <line x1="560" y1="320" x2="610" y2="320" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="610" cy="320" r="3.5" fill="#1a1a1a"/>

  <!-- Wire from Gate Node to BTA16 Gate -->
  <line x1="610" y1="320" x2="685" y2="290" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Gate-to-MT1 Resistor RGK -->
  <line x1="610" y1="320" x2="610" y2="345" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="600" y="345" width="20" height="35" fill="white" stroke="#1a1a1a" stroke-width="2" rx="2"/>
  <text x="624" y="366" font-size="12" fill="#6b7280" text-anchor="start">R_GK (1 кОм)</text>
  <line x1="610" y1="380" x2="610" y2="400" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="610" cy="400" r="3.5" fill="#1a1a1a"/>

  <!-- BTA16 Power Triac Symbol & Wires -->
  <line x1="710" y1="125" x2="710" y2="235" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="710" y1="265" x2="710" y2="400" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="710" cy="400" r="4" fill="#1a1a1a"/>

  <!-- Triac Symbol (anti-parallel triangles) -->
  <polygon points="695,235 725,235 710,265" fill="#1a1a1a"/>
  <polygon points="695,265 725,265 710,235" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="695" y1="235" x2="725" y2="235" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="695" y1="265" x2="725" y2="265" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="685" y1="290" x2="700" y2="265" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Triac Labels -->
  <text x="735" y="245" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">BTA16</text>
  <text x="735" y="262" font-size="12" fill="#6b7280" text-anchor="start">16 А / 600 В</text>

  <!-- RC Snubber Circuit (R_S + C_S in parallel across Triac) -->
  <rect x="815" y="180" width="105" height="150" fill="none" stroke="#27ae60" stroke-dasharray="3,3" stroke-width="1.5" rx="6"/>
  <text x="835" y="152" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">RC-снабер</text>
  <text x="835" y="168" font-size="12" fill="#27ae60" text-anchor="start">(захист dv/dt)</text>

  <!-- Snubber Top Connection from y=125 to RS -->
  <line x1="825" y1="125" x2="825" y2="195" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Snubber Resistor RS -->
  <rect x="815" y="195" width="20" height="35" fill="white" stroke="#1a1a1a" stroke-width="2" rx="2"/>
  <text x="842" y="217" font-size="12" fill="#1a1a1a" text-anchor="start">R_S (39 Ом)</text>

  <line x1="825" y1="230" x2="825" y2="258" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Snubber Capacitor CS -->
  <line x1="810" y1="258" x2="840" y2="258" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="810" y1="266" x2="840" y2="266" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="842" y="266" font-size="12" fill="#1a1a1a" text-anchor="start">C_S (10 нФ)</text>

  <!-- Snubber Bottom Connection to Neutral wire -->
  <line x1="825" y1="266" x2="825" y2="400" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="825" cy="400" r="4" fill="#1a1a1a"/>

  <!-- Bottom Neutral Line (N) -->
  <line x1="515" y1="400" x2="922" y2="400" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="922" cy="400" r="4" fill="#1a1a1a"/>
  <text x="922" y="422" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">N (0 В / Нейтраль)</text>

  <!-- BOTTOM SUMMARY CARDS -->
  
  <!-- Card 1: Rin formula -->
  <rect x="25" y="465" width="215" height="75" fill="white" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="132.5" y="490" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">R_in = (U_out - U_F) / I_F</text>
  <text x="132.5" y="508" font-size="12" fill="#6b7280" text-anchor="middle">Для 5V: R_in ≈ 330 Ом</text>
  <text x="132.5" y="526" font-size="12" fill="#6b7280" text-anchor="middle">I_F = 7.5 mA (I_FT = 5 mA)</text>

  <!-- Card 2: Zero-Crossing explanation -->
  <rect x="255" y="465" width="225" height="75" fill="white" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="367.5" y="490" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Zero-Crossing схема</text>
  <text x="367.5" y="508" font-size="12" fill="#6b7280" text-anchor="middle">Вмикання при U ≈ 0 В</text>
  <text x="367.5" y="526" font-size="12" fill="#6b7280" text-anchor="middle">Мінімізація завад (EMI)</text>

  <!-- Card 3: Snubber & Triac explanation -->
  <rect x="495" y="465" width="440" height="75" fill="white" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="715" y="490" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">RC-снабер (R_S + C_S) захищає від dv/dt</text>
  <text x="715" y="508" font-size="12" fill="#6b7280" text-anchor="middle">Поглинає сплески напруги на симісторі BTA16</text>
  <text x="715" y="526" font-size="12" fill="#6b7280" text-anchor="middle">Запобігає хибному відкриттю при індуктивному навантаженні</text>
</svg>
