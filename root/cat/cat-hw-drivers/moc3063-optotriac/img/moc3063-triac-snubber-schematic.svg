<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Header -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема підключення оптосимістора MOC3063 до силового симістора BTA16</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">RC-демпфер (R_S, C_S) та резистор R_GK захищають пристрій від хибного вмикання при dv/dt</text>

  <!-- Panel 1: Low Voltage MCU Side -->
  <rect x="30" y="70" width="220" height="400" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="140" y="93" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Низьковольтне коло (МК)</text>

  <!-- Panel 2: MOC3063 Optocoupler -->
  <rect x="270" y="70" width="250" height="400" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="395" y="93" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Оптопара MOC3063</text>

  <!-- Panel 3: Power Side ~220V AC -->
  <rect x="540" y="70" width="390" height="400" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="735" y="93" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Силове коло (~220 В AC)</text>

  <!-- ==================== PANEL 1 COMPONENTS ==================== -->
  <!-- GPIO Terminal -->
  <circle cx="85" cy="210" r="5" fill="#2457d6"/>
  <text x="85" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">GPIO МК</text>
  <text x="85" y="191" text-anchor="middle" font-size="12" fill="#6b7280">(3.3 В / 5 В)</text>
  <line x1="85" y1="210" x2="120" y2="210" stroke="#2457d6" stroke-width="2"/>

  <!-- Resistor R_in -->
  <text x="145" y="180" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">R_in</text>
  <text x="145" y="195" text-anchor="middle" font-size="12" fill="#1a1a1a">220…360 Ом</text>
  <rect x="120" y="202" width="50" height="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="145" y="238" text-anchor="middle" font-size="12" fill="#6b7280">I_FT ≈ 10…15 мА</text>
  <line x1="170" y1="210" x2="290" y2="210" stroke="#2457d6" stroke-width="2"/>

  <!-- Return Path to GND -->
  <line x1="290" y1="290" x2="145" y2="290" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="145" y1="290" x2="145" y2="340" stroke="#1a1a1a" stroke-width="2"/>

  <!-- GND Symbol -->
  <line x1="130" y1="340" x2="160" y2="340" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="136" y1="345" x2="154" y2="345" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="141" y1="350" x2="149" y2="350" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="145" y="370" text-anchor="middle" font-size="12" fill="#6b7280">GND (МК)</text>

  <!-- Panel 1 Note Box -->
  <rect x="45" y="415" width="190" height="44" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="140" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Керування від МК</text>
  <text x="140" y="448" text-anchor="middle" font-size="12" fill="#6b7280">(струмове обмеження)</text>

  <!-- ==================== PANEL 2 COMPONENTS (MOC3063) ==================== -->
  <!-- IC Package Body -->
  <rect x="310" y="120" width="170" height="275" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Top Notch Dot -->
  <circle cx="328" cy="137" r="4" fill="#1a1a1a"/>
  <text x="395" y="145" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">MOC3063</text>

  <!-- Galvanic Isolation Line -->
  <line x1="395" y1="152" x2="395" y2="160" stroke="#c0392b" stroke-dasharray="4,4" stroke-width="1.5"/>
  <text x="395" y="175" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Ізоляція 5000 В</text>
  <line x1="395" y1="180" x2="395" y2="385" stroke="#c0392b" stroke-dasharray="4,4" stroke-width="1.5"/>

  <!-- Pin Leads & Numbers/Names -->
  <!-- Pin 1 -->
  <line x1="290" y1="210" x2="310" y2="210" stroke="#1a1a1a" stroke-width="2"/>
  <text x="318" y="198" font-size="12" fill="#6b7280">1</text>
  <text x="328" y="198" font-size="12" font-weight="bold" fill="#1a1a1a">A</text>

  <!-- Pin 2 -->
  <line x1="290" y1="290" x2="310" y2="290" stroke="#1a1a1a" stroke-width="2"/>
  <text x="318" y="278" font-size="12" fill="#6b7280">2</text>
  <text x="328" y="278" font-size="12" font-weight="bold" fill="#1a1a1a">K</text>

  <!-- Pin 3 -->
  <line x1="290" y1="360" x2="310" y2="360" stroke="#9ca3af" stroke-dasharray="2,2" stroke-width="1.5"/>
  <text x="318" y="348" font-size="12" fill="#6b7280">3</text>
  <text x="328" y="348" font-size="12" fill="#9ca3af">NC</text>

  <!-- Pin 6 -->
  <line x1="480" y1="210" x2="500" y2="210" stroke="#1a1a1a" stroke-width="2"/>
  <text x="472" y="198" text-anchor="end" font-size="12" fill="#6b7280">6</text>
  <text x="456" y="198" font-size="12" font-weight="bold" fill="#1a1a1a">MT2</text>

  <!-- Pin 5 -->
  <line x1="480" y1="285" x2="500" y2="285" stroke="#9ca3af" stroke-dasharray="2,2" stroke-width="1.5"/>
  <text x="472" y="273" text-anchor="end" font-size="12" fill="#6b7280">5</text>
  <text x="456" y="273" font-size="12" fill="#9ca3af">NC</text>

  <!-- Pin 4 -->
  <line x1="480" y1="360" x2="500" y2="360" stroke="#1a1a1a" stroke-width="2"/>
  <text x="472" y="348" text-anchor="end" font-size="12" fill="#6b7280">4</text>
  <text x="456" y="348" font-size="12" font-weight="bold" fill="#1a1a1a">MT1</text>

  <!-- Internal LED -->
  <line x1="310" y1="210" x2="345" y2="210" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="345" y1="210" x2="345" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="335,230 355,230 345,246" fill="#2457d6" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="335" y1="246" x2="355" y2="246" stroke="#2457d6" stroke-width="2"/>
  <line x1="345" y1="246" x2="345" y2="290" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="345" y1="290" x2="310" y2="290" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- LED Optical Emission Arrows -->
  <line x1="352" y1="238" x2="364" y2="244" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="352" y1="248" x2="364" y2="254" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Zero-Cross Detector Box -->
  <rect x="368" y="230" width="54" height="40" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="395" y="246" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Zero</text>
  <text x="395" y="262" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Cross</text>

  <!-- Trigger Line from Zero-Cross to Opto-Triac -->
  <line x1="422" y1="250" x2="435" y2="250" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="435" y1="250" x2="435" y2="290" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="435" y1="290" x2="442" y2="290" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="2,2" marker-end="url(#arr-blue)"/>

  <!-- Internal Opto-Triac Symbol -->
  <line x1="480" y1="210" x2="450" y2="210" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="450" y1="210" x2="450" y2="270" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="442,270 458,270 450,285" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="442,310 458,310 450,295" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="450" y1="310" x2="450" y2="360" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="450" y1="360" x2="480" y2="360" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Panel 2 Note Box -->
  <rect x="285" y="415" width="220" height="44" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="395" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">V_INH = 20 В (Zero-Cross)</text>
  <text x="395" y="448" text-anchor="middle" font-size="12" fill="#6b7280">dv/dt = 1000 В/мкс</text>

  <!-- ==================== PANEL 3 COMPONENTS (POWER SIDE) ==================== -->

  <!-- Top Line L Rail (y=135) -->
  <circle cx="885" cy="135" r="5" fill="#c0392b"/>
  <text x="885" y="115" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">L (~220 В)</text>

  <!-- Load Z_load -->
  <text x="775" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Навантаження</text>
  <rect x="740" y="120" width="70" height="30" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="775" y="140" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Z_load</text>
  <line x1="885" y1="135" x2="810" y2="135" stroke="#c0392b" stroke-width="2"/>
  <line x1="740" y1="135" x2="690" y2="135" stroke="#c0392b" stroke-width="2"/>

  <!-- Wire down from Line L to BTA16 MT2 & MOC3063 connection -->
  <line x1="690" y1="135" x2="690" y2="240" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="690" cy="210" r="4" fill="#1a1a1a"/>

  <!-- Connection from MOC3063 Pin 6 to Node J1 (x=500..690, y=210) -->
  <line x1="500" y1="210" x2="690" y2="210" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Resistor R_G (Gate Drive) -->
  <line x1="500" y1="360" x2="565" y2="360" stroke="#1a1a1a" stroke-width="2"/>
  <text x="590" y="344" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">R_G = 360 Ом</text>
  <rect x="565" y="352" width="50" height="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="615" y1="360" x2="645" y2="360" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="645" cy="360" r="4" fill="#1a1a1a"/>

  <!-- Gate Wire to BTA16 -->
  <line x1="645" y1="360" x2="645" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="645" y1="300" x2="670" y2="300" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Resistor R_GK (Gate-MT1 Pull-Down) -->
  <line x1="645" y1="360" x2="645" y2="375" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="637" y="375" width="16" height="36" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="630" y="390" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">R_GK = 1 кОм</text>
  <text x="630" y="406" text-anchor="end" font-size="12" fill="#6b7280">(проти dv/dt)</text>
  <line x1="645" y1="411" x2="645" y2="440" stroke="#1a1a1a" stroke-width="2"/>

  <!-- BTA16 Triac -->
  <line x1="690" y1="240" x2="690" y2="265" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="682,265 698,265 690,280" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="682,295 698,295 690,280" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="690" y1="295" x2="690" y2="440" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="670" y1="300" x2="682" y2="290" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- BTA16 Label -->
  <text x="712" y="275" text-anchor="start" font-size="14" font-weight="bold" fill="#1a1a1a">BTA16-600B</text>
  <text x="712" y="293" text-anchor="start" font-size="12" fill="#6b7280">(16 А / 600 В)</text>

  <!-- RC Snubber Circuit -->
  <rect x="805" y="195" width="115" height="190" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-dasharray="4,4" stroke-width="1.5"/>
  <text x="862" y="213" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">RC-демпфер</text>

  <!-- Top Snubber Connection -->
  <line x1="690" y1="210" x2="845" y2="210" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="845" y1="210" x2="845" y2="230" stroke="#27ae60" stroke-width="2"/>

  <!-- Snubber Resistor R_S -->
  <rect x="837" y="230" width="16" height="36" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="845" y1="230" x2="845" y2="266" stroke="#27ae60" stroke-width="2"/>
  <text x="860" y="245" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">R_S: 39 Ом</text>
  <text x="860" y="260" text-anchor="start" font-size="12" fill="#6b7280">(2 Вт)</text>
  <line x1="845" y1="266" x2="845" y2="300" stroke="#27ae60" stroke-width="2"/>

  <!-- Snubber Capacitor C_S -->
  <line x1="835" y1="300" x2="855" y2="300" stroke="#27ae60" stroke-width="2"/>
  <line x1="835" y1="306" x2="855" y2="306" stroke="#27ae60" stroke-width="2"/>
  <text x="860" y="305" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">C_S: 10 нФ</text>
  <text x="860" y="321" text-anchor="start" font-size="12" fill="#6b7280">(630 В X2)</text>

  <!-- Bottom Snubber Connection to Neutral Rail -->
  <line x1="845" y1="306" x2="845" y2="440" stroke="#27ae60" stroke-width="2"/>

  <!-- Bottom Neutral Rail (y=440) -->
  <circle cx="645" cy="440" r="4" fill="#1a1a1a"/>
  <circle cx="690" cy="440" r="4" fill="#1a1a1a"/>
  <circle cx="845" cy="440" r="4" fill="#27ae60"/>
  <line x1="645" y1="440" x2="885" y2="440" stroke="#2457d6" stroke-width="2"/>

  <circle cx="885" cy="440" r="5" fill="#2457d6"/>
  <text x="885" y="462" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">N (Нейтраль)</text>

  <!-- Summary Banner at Bottom -->
  <rect x="30" y="485" width="900" height="35" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="507" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Принцип: GPIO МК → Світлодіод → Детектор нуля → Відмикання BTA16 при 0 В → RC-демпфер гасить dv/dt</text>
</svg>
