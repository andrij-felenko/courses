<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <defs>
    <!-- Маркер стрілки -->
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часові діаграми керування DRV8833 для біполярного крокового двигуна</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Послідовність сигналів IN1–IN4 та струми фаз I_A, I_B у повнокроковому й напівкроковому режимах</text>

  <!-- ==================== ЛІВА ПАНЕЛЬ: ПОВНОКРОКОВИЙ РЕЖИМ ==================== -->
  <g id="full-step-group">
    <!-- Тло панелі -->
    <rect x="30" y="80" width="435" height="435" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

    <!-- Назва панелі -->
    <text x="247.5" y="105" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Повнокроковий режим (2 фази)</text>
    <text x="247.5" y="123" font-size="12" fill="#2457d6" text-anchor="middle">Максимальний момент, 4 кроки на цикл</text>

    <!-- Позначки кроків -->
    <text x="165" y="147" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Крок 1</text>
    <text x="245" y="147" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Крок 2</text>
    <text x="325" y="147" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Крок 3</text>
    <text x="405" y="147" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Крок 4</text>

    <!-- Вертикальні лінії сітки кроків -->
    <line x1="125" y1="155" x2="125" y2="465" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="205" y1="155" x2="205" y2="465" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="285" y1="155" x2="285" y2="465" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="365" y1="155" x2="365" y2="465" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="445" y1="155" x2="445" y2="465" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Сигнали входів IN1..IN4 -->
    <!-- IN1 -->
    <text x="110" y="175" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">IN1</text>
    <path d="M 125,162 L 205,162 L 205,180 L 365,180 L 365,162 L 445,162" fill="none" stroke="#2457d6" stroke-width="2"/>

    <!-- IN2 -->
    <text x="110" y="220" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">IN2</text>
    <path d="M 125,225 L 205,225 L 205,207 L 365,207 L 365,225 L 445,225" fill="none" stroke="#2457d6" stroke-width="2"/>

    <!-- IN3 -->
    <text x="110" y="265" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">IN3</text>
    <path d="M 125,252 L 285,252 L 285,270 L 445,270" fill="none" stroke="#27ae60" stroke-width="2"/>

    <!-- IN4 -->
    <text x="110" y="310" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">IN4</text>
    <path d="M 125,315 L 285,315 L 285,297 L 445,297" fill="none" stroke="#27ae60" stroke-width="2"/>

    <!-- Розділювач між цифровими та аналоговими фазами -->
    <line x1="45" y1="332" x2="445" y2="332" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Нульові осі для струмів -->
    <line x1="125" y1="375" x2="445" y2="375" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="125" y1="440" x2="445" y2="440" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Струм I_A -->
    <text x="82" y="375" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="end">I_A</text>
    <text x="118" y="355" font-size="12" fill="#6b7280" text-anchor="end">+I</text>
    <text x="118" y="400" font-size="12" fill="#6b7280" text-anchor="end">-I</text>

    <!-- Заливка під струмом I_A -->
    <path d="M 125,375 L 125,352 L 205,352 L 205,375 Z" fill="#2457d6" fill-opacity="0.12"/>
    <path d="M 205,375 L 205,398 L 365,398 L 365,375 Z" fill="#c0392b" fill-opacity="0.12"/>
    <path d="M 365,375 L 365,352 L 445,352 L 445,375 Z" fill="#2457d6" fill-opacity="0.12"/>
    <!-- Лінія струму I_A -->
    <path d="M 125,352 L 205,352 L 205,398 L 365,398 L 365,352 L 445,352" fill="none" stroke="#2457d6" stroke-width="2.5"/>

    <!-- Струм I_B -->
    <text x="82" y="440" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="end">I_B</text>
    <text x="118" y="420" font-size="12" fill="#6b7280" text-anchor="end">+I</text>
    <text x="118" y="465" font-size="12" fill="#6b7280" text-anchor="end">-I</text>

    <!-- Заливка під струмом I_B -->
    <path d="M 125,440 L 125,417 L 285,417 L 285,440 Z" fill="#27ae60" fill-opacity="0.12"/>
    <path d="M 285,440 L 285,463 L 445,463 L 445,440 Z" fill="#c0392b" fill-opacity="0.12"/>
    <!-- Лінія струму I_B -->
    <path d="M 125,417 L 285,417 L 285,463 L 445,463" fill="none" stroke="#27ae60" stroke-width="2.5"/>

    <!-- Вісь часу -->
    <line x1="125" y1="472" x2="445" y2="472" stroke="#6b7280" stroke-width="1" marker-end="url(#arr)"/>
    <text x="445" y="486" font-size="12" fill="#6b7280" text-anchor="end">t</text>

    <!-- Підпис висновку знизу -->
    <text x="247.5" y="500" font-size="12" fill="#1a1a1a" text-anchor="middle">Дві фази завжди під напругою (100% моменту)</text>
  </g>

  <!-- ==================== ПРАВА ПАНЕЛЬ: НАПІВКРОКОВИЙ РЕЖИМ ==================== -->
  <g id="half-step-group">
    <!-- Тло панелі -->
    <rect x="495" y="80" width="435" height="435" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

    <!-- Назва панелі -->
    <text x="712.5" y="105" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Напівкроковий режим (1-2 фази)</text>
    <text x="712.5" y="123" font-size="12" fill="#27ae60" text-anchor="middle">Плавність руху, 8 кроків на цикл</text>

    <!-- Позначки кроків 1..8 -->
    <text x="591.5" y="147" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1</text>
    <text x="634.5" y="147" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2</text>
    <text x="677.5" y="147" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3</text>
    <text x="720.5" y="147" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">4</text>
    <text x="763.5" y="147" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">5</text>
    <text x="806.5" y="147" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">6</text>
    <text x="849.5" y="147" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">7</text>
    <text x="892.5" y="147" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">8</text>

    <!-- Вертикальні лінії сітки кроків -->
    <line x1="570" y1="155" x2="570" y2="465" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="613" y1="155" x2="613" y2="465" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="656" y1="155" x2="656" y2="465" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="699" y1="155" x2="699" y2="465" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="742" y1="155" x2="742" y2="465" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="785" y1="155" x2="785" y2="465" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="828" y1="155" x2="828" y2="465" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="871" y1="155" x2="871" y2="465" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
    <line x1="914" y1="155" x2="914" y2="465" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

    <!-- Сигнали входів IN1..IN4 -->
    <!-- IN1 -->
    <text x="555" y="175" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">IN1</text>
    <path d="M 570,162 L 656,162 L 656,180 L 871,180 L 871,162 L 914,162" fill="none" stroke="#2457d6" stroke-width="2"/>

    <!-- IN2 -->
    <text x="555" y="220" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">IN2</text>
    <path d="M 570,225 L 699,225 L 699,207 L 828,207 L 828,225 L 914,225" fill="none" stroke="#2457d6" stroke-width="2"/>

    <!-- IN3 -->
    <text x="555" y="265" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">IN3</text>
    <path d="M 570,270 L 613,270 L 613,252 L 742,252 L 742,270 L 914,270" fill="none" stroke="#27ae60" stroke-width="2"/>

    <!-- IN4 -->
    <text x="555" y="310" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">IN4</text>
    <path d="M 570,315 L 785,315 L 785,297 L 914,297" fill="none" stroke="#27ae60" stroke-width="2"/>

    <!-- Розділювач -->
    <line x1="510" y1="332" x2="914" y2="332" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Нульові осі для струмів -->
    <line x1="570" y1="375" x2="914" y2="375" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2,2"/>
    <line x1="570" y1="440" x2="914" y2="440" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- Струм I_A -->
    <text x="527" y="375" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="end">I_A</text>
    <text x="563" y="355" font-size="12" fill="#6b7280" text-anchor="end">+I</text>
    <text x="563" y="400" font-size="12" fill="#6b7280" text-anchor="end">-I</text>

    <!-- Заливка під струмом I_A -->
    <path d="M 570,375 L 570,352 L 656,352 L 656,375 Z" fill="#2457d6" fill-opacity="0.12"/>
    <path d="M 699,375 L 699,398 L 828,398 L 828,375 Z" fill="#c0392b" fill-opacity="0.12"/>
    <path d="M 871,375 L 871,352 L 914,352 L 914,375 Z" fill="#2457d6" fill-opacity="0.12"/>
    <!-- Лінія струму I_A -->
    <path d="M 570,352 L 656,352 L 656,375 L 699,375 L 699,398 L 828,398 L 828,375 L 871,375 L 871,352 L 914,352" fill="none" stroke="#2457d6" stroke-width="2.5"/>

    <!-- Струм I_B -->
    <text x="527" y="440" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="end">I_B</text>
    <text x="563" y="420" font-size="12" fill="#6b7280" text-anchor="end">+I</text>
    <text x="563" y="465" font-size="12" fill="#6b7280" text-anchor="end">-I</text>

    <!-- Заливка під струмом I_B -->
    <path d="M 613,440 L 613,417 L 742,417 L 742,440 Z" fill="#27ae60" fill-opacity="0.12"/>
    <path d="M 785,440 L 785,463 L 914,463 L 914,440 Z" fill="#c0392b" fill-opacity="0.12"/>
    <!-- Лінія струму I_B -->
    <path d="M 570,440 L 613,440 L 613,417 L 742,417 L 742,440 L 785,440 L 785,463 L 914,463" fill="none" stroke="#27ae60" stroke-width="2.5"/>

    <!-- Вісь часу -->
    <line x1="570" y1="472" x2="914" y2="472" stroke="#6b7280" stroke-width="1" marker-end="url(#arr)"/>
    <text x="914" y="486" font-size="12" fill="#6b7280" text-anchor="end">t</text>

    <!-- Підпис висновку знизу -->
    <text x="712.5" y="500" font-size="12" fill="#1a1a1a" text-anchor="middle">Чергування 1 та 2 фаз (подвійна дискретність)</text>
  </g>
</svg>
