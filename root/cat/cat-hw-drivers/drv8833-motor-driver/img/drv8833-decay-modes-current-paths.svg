<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Режими згасання струму в H-мості DRV8833: Fast Decay та Slow Decay</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Fast Decay повертає струм в джерело VM, Slow Decay закорочує котушку через нижні ключі</text>

  <!-- ==================== LEFT PANEL: FAST DECAY ==================== -->
  <rect x="30" y="70" width="435" height="465" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247" y="98" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">Fast Decay (Швидке згасання)</text>
  <text x="247" y="116" font-size="12" fill="#6b7280" text-anchor="middle">Енергія повертається в джерело VM через діоди</text>

  <!-- Power Rails (Fast Decay) -->
  <line x1="110" y1="150" x2="385" y2="150" stroke="#1a1a1a" stroke-width="2"/>
  <text x="110" y="144" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="start">VM (+10.8V)</text>

  <line x1="110" y1="305" x2="385" y2="305" stroke="#1a1a1a" stroke-width="2"/>
  <text x="110" y="317" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="start">GND</text>

  <!-- Q1 (HS1) - OFF -->
  <line x1="130" y1="150" x2="130" y2="172" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="130" y1="203" x2="130" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="130" y1="203" x2="142" y2="177" stroke="#c0392b" stroke-width="2"/>
  <text x="100" y="185" font-size="11" fill="#6b7280" text-anchor="end">Q1 (HS)</text>
  <text x="100" y="198" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="end">ВИМК (OFF)</text>

  <!-- D1 Diode (alongside Q1) -->
  <line x1="160" y1="150" x2="160" y2="225" stroke="#94a3b8" stroke-width="1.2"/>
  <polygon points="160,180 154,190 166,190" fill="#94a3b8"/>
  <line x1="153" y1="180" x2="167" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="170" y="175" font-size="11" fill="#6b7280" text-anchor="start">D1</text>

  <!-- Q2 (LS1) - OFF (Body diode conducts) -->
  <line x1="130" y1="225" x2="130" y2="252" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="130" y1="283" x2="130" y2="305" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="130" y1="283" x2="142" y2="257" stroke="#c0392b" stroke-width="2"/>
  <text x="100" y="260" font-size="11" fill="#6b7280" text-anchor="end">Q2 (LS)</text>
  <text x="100" y="273" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="end">ВИМК (OFF)</text>

  <!-- D2 Diode (Conducts in Fast Decay) -->
  <line x1="160" y1="225" x2="160" y2="305" stroke="#c0392b" stroke-width="2"/>
  <polygon points="160,255 154,265 166,265" fill="#c0392b"/>
  <line x1="153" y1="255" x2="167" y2="255" stroke="#c0392b" stroke-width="2"/>
  <text x="170" y="269" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="start">D2 (пров.)</text>

  <!-- Q3 (HS2) - OFF (Body diode conducts) -->
  <line x1="365" y1="150" x2="365" y2="172" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="365" y1="203" x2="365" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="365" y1="203" x2="353" y2="177" stroke="#c0392b" stroke-width="2"/>
  <text x="395" y="185" font-size="11" fill="#6b7280" text-anchor="start">Q3 (HS)</text>
  <text x="395" y="198" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="start">ВИМК (OFF)</text>

  <!-- D3 Diode (Conducts in Fast Decay) -->
  <line x1="335" y1="150" x2="335" y2="225" stroke="#c0392b" stroke-width="2"/>
  <polygon points="335,180 329,190 341,190" fill="#c0392b"/>
  <line x1="328" y1="180" x2="342" y2="180" stroke="#c0392b" stroke-width="2"/>
  <text x="325" y="175" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="end">D3 (пров.)</text>

  <!-- Q4 (LS2) - OFF -->
  <line x1="365" y1="225" x2="365" y2="252" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="365" y1="283" x2="365" y2="305" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="365" y1="283" x2="353" y2="257" stroke="#c0392b" stroke-width="2"/>
  <text x="395" y="260" font-size="11" fill="#6b7280" text-anchor="start">Q4 (LS)</text>
  <text x="395" y="273" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="start">ВИМК (OFF)</text>

  <!-- D4 Diode (alongside Q4) -->
  <line x1="335" y1="225" x2="335" y2="305" stroke="#94a3b8" stroke-width="1.2"/>
  <polygon points="335,255 329,265 341,265" fill="#94a3b8"/>
  <line x1="328" y1="255" x2="342" y2="255" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="325" y="269" font-size="11" fill="#6b7280" text-anchor="end">D4</text>

  <!-- Motor & Inductor (Fast Decay) -->
  <line x1="130" y1="225" x2="227" y2="225" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="267" y1="225" x2="365" y2="225" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="247.5" cy="225" r="20" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="247.5" y="230" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">M</text>
  <text x="247.5" y="196" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">I_L (індуктивний струм)</text>

  <!-- Current Path Arrows (Fast Decay: GND -> D2 -> Motor -> D3 -> VM) -->
  <path d="M 160,300 L 160,225 L 130,225 L 365,225 L 335,225 L 335,150 L 300,150" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6,3"/>
  <line x1="160" y1="290" x2="160" y2="275" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <line x1="280" y1="225" x2="305" y2="225" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <line x1="335" y1="210" x2="335" y2="195" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <line x1="335" y1="150" x2="310" y2="150" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>

  <!-- Path Badge (Fast Decay) -->
  <rect x="70" y="320" width="355" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="247.5" y="336" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Шлях: GND → D2 → Двигун → D3 → VM (Джерело)</text>

  <!-- Timing Diagram Box (Fast Decay) -->
  <rect x="45" y="355" width="405" height="165" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="177" y="370" font-size="10" fill="#6b7280" text-anchor="middle">Пряме ввімкнення</text>
  <text x="325" y="370" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">Fast Decay (Режим 0/0)</text>
  <line x1="240" y1="360" x2="240" y2="515" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Waveform IN1/IN2 (Fast Decay) -->
  <text x="110" y="392" font-size="11" fill="#1a1a1a" text-anchor="end">IN1 / IN2</text>
  <polyline points="115,382 240,382 240,400 410,400" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Waveform V_OUT (Fast Decay) -->
  <text x="110" y="437" font-size="11" fill="#1a1a1a" text-anchor="end">V_OUT</text>
  <line x1="115" y1="435" x2="410" y2="435" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  <polyline points="115,420 240,420 240,452 410,452" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="120" y="417" font-size="10" fill="#2457d6" text-anchor="start">+VM</text>
  <text x="325" y="445" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">-VM (-10.8V)</text>

  <!-- Waveform I_L (Fast Decay) -->
  <text x="110" y="492" font-size="11" fill="#1a1a1a" text-anchor="end">I_L</text>
  <line x1="115" y1="497" x2="240" y2="477" stroke="#c0392b" stroke-width="2"/>
  <line x1="240" y1="477" x2="410" y2="510" stroke="#c0392b" stroke-width="2.5"/>
  <text x="325" y="514" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">Швидке спадання струму</text>


  <!-- ==================== RIGHT PANEL: SLOW DECAY ==================== -->
  <rect x="495" y="70" width="435" height="465" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="712" y="98" font-size="15" font-weight="bold" fill="#27ae60" text-anchor="middle">Slow Decay (Повільне згасання)</text>
  <text x="712" y="116" font-size="12" fill="#6b7280" text-anchor="middle">Струм закорочується через обидва нижні MOSFET</text>

  <!-- Power Rails (Slow Decay) -->
  <line x1="575" y1="150" x2="850" y2="150" stroke="#1a1a1a" stroke-width="2"/>
  <text x="575" y="144" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="start">VM (+10.8V)</text>

  <line x1="575" y1="305" x2="850" y2="305" stroke="#1a1a1a" stroke-width="2"/>
  <text x="575" y="317" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="start">GND</text>

  <!-- Q1 (HS1) - OFF -->
  <line x1="595" y1="150" x2="595" y2="172" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="595" y1="203" x2="595" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="595" y1="203" x2="607" y2="177" stroke="#6b7280" stroke-width="2"/>
  <text x="565" y="185" font-size="11" fill="#6b7280" text-anchor="end">Q1 (HS)</text>
  <text x="565" y="198" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="end">ВИМК (OFF)</text>

  <!-- D1 Diode (alongside Q1) -->
  <line x1="625" y1="150" x2="625" y2="225" stroke="#94a3b8" stroke-width="1.2"/>
  <polygon points="625,180 619,190 631,190" fill="#94a3b8"/>
  <line x1="618" y1="180" x2="632" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="635" y="175" font-size="11" fill="#6b7280" text-anchor="start">D1</text>

  <!-- Q2 (LS1) - ON (Closed) -->
  <line x1="595" y1="225" x2="595" y2="305" stroke="#27ae60" stroke-width="3.5"/>
  <text x="565" y="260" font-size="11" fill="#6b7280" text-anchor="end">Q2 (LS)</text>
  <text x="565" y="273" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="end">УВІМК (ON)</text>

  <!-- D2 Diode (alongside Q2) -->
  <line x1="625" y1="225" x2="625" y2="305" stroke="#94a3b8" stroke-width="1.2"/>
  <polygon points="625,255 619,265 631,265" fill="#94a3b8"/>
  <line x1="618" y1="255" x2="632" y2="255" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="635" y="269" font-size="11" fill="#6b7280" text-anchor="start">D2</text>

  <!-- Q3 (HS2) - OFF -->
  <line x1="830" y1="150" x2="830" y2="172" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="830" y1="203" x2="830" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="830" y1="203" x2="818" y2="177" stroke="#6b7280" stroke-width="2"/>
  <text x="860" y="185" font-size="11" fill="#6b7280" text-anchor="start">Q3 (HS)</text>
  <text x="860" y="198" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">ВИМК (OFF)</text>

  <!-- D3 Diode (alongside Q3) -->
  <line x1="800" y1="150" x2="800" y2="225" stroke="#94a3b8" stroke-width="1.2"/>
  <polygon points="800,180 794,190 806,190" fill="#94a3b8"/>
  <line x1="793" y1="180" x2="807" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="793" y="175" font-size="11" fill="#6b7280" text-anchor="end">D3</text>

  <!-- Q4 (LS2) - ON (Closed) -->
  <line x1="830" y1="225" x2="830" y2="305" stroke="#27ae60" stroke-width="3.5"/>
  <text x="860" y="260" font-size="11" fill="#6b7280" text-anchor="start">Q4 (LS)</text>
  <text x="860" y="273" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="start">УВІМК (ON)</text>

  <!-- D4 Diode (alongside Q4) -->
  <line x1="800" y1="225" x2="800" y2="305" stroke="#94a3b8" stroke-width="1.2"/>
  <polygon points="800,255 794,265 806,265" fill="#94a3b8"/>
  <line x1="793" y1="255" x2="807" y2="255" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="793" y="269" font-size="11" fill="#6b7280" text-anchor="end">D4</text>

  <!-- Motor & Inductor (Slow Decay) -->
  <line x1="595" y1="225" x2="692" y2="225" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="732" y1="225" x2="830" y2="225" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="712.5" cy="225" r="20" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="712.5" y="230" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">M</text>
  <text x="712.5" y="196" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">I_L (рециркуляційний струм)</text>

  <!-- Current Path Arrows (Slow Decay: Motor -> Q4(ON) -> GND -> Q2(ON) -> Motor) -->
  <path d="M 712.5,225 L 830,225 L 830,305 L 595,305 L 595,225 Z" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="6,3"/>
  <line x1="830" y1="250" x2="830" y2="275" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <line x1="740" y1="305" x2="680" y2="305" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <line x1="595" y1="280" x2="595" y2="255" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <line x1="640" y1="225" x2="670" y2="225" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <!-- Path Badge (Slow Decay) -->
  <rect x="535" y="320" width="355" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712.5" y="336" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Шлях: Q4(ON) → GND → Q2(ON) → Двигун (Коло)</text>

  <!-- Timing Diagram Box (Slow Decay) -->
  <rect x="510" y="355" width="405" height="165" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="642" y="370" font-size="10" fill="#6b7280" text-anchor="middle">Пряме ввімкнення</text>
  <text x="790" y="370" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">Slow Decay (Режим 1/1)</text>
  <line x1="705" y1="360" x2="705" y2="515" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Waveform IN1/IN2 (Slow Decay) -->
  <text x="575" y="392" font-size="11" fill="#1a1a1a" text-anchor="end">IN1 / IN2</text>
  <polyline points="580,382 705,382 705,382 875,382" fill="none" stroke="#27ae60" stroke-width="2"/>

  <!-- Waveform V_OUT (Slow Decay) -->
  <text x="575" y="437" font-size="11" fill="#1a1a1a" text-anchor="end">V_OUT</text>
  <line x1="580" y1="435" x2="875" y2="435" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  <polyline points="580,420 705,420 705,435 875,435" fill="none" stroke="#27ae60" stroke-width="2"/>
  <text x="585" y="417" font-size="10" fill="#2457d6" text-anchor="start">+VM</text>
  <text x="790" y="425" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">≈ 0 В (закорочено)</text>

  <!-- Waveform I_L (Slow Decay) -->
  <text x="575" y="492" font-size="11" fill="#1a1a1a" text-anchor="end">I_L</text>
  <line x1="580" y1="497" x2="705" y2="477" stroke="#27ae60" stroke-width="2"/>
  <line x1="705" y1="477" x2="875" y2="490" stroke="#27ae60" stroke-width="2.5"/>
  <text x="790" y="514" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">Повільне спадання струму</text>
</svg>
