<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Markers -->
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Логічні режими керування H-мостом DRV8833</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Комутація MOSFET-ключів та шляхи протікання струму мотора для сигналів IN1 / IN2</text>

  <!-- PANEL 1: FORWARD (IN1=1, IN2=0) -->
  <g id="panel-forward">
    <!-- Panel Box -->
    <rect x="20" y="70" width="450" height="215" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <!-- Title & Badge -->
    <text x="35" y="92" font-size="14" font-weight="bold" fill="#1a1a1a">1. Пряме обертання (Forward)</text>
    <rect x="270" y="76" width="185" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
    <text x="362" y="91" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">IN1 = 1  |  IN2 = 0</text>

    <!-- Base Schematic Wires -->
    <line x1="100" y1="112" x2="260" y2="112" stroke="#d0d7de" stroke-width="2"/>
    <text x="190" y="104" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">+VMM</text>
    <line x1="100" y1="248" x2="260" y2="248" stroke="#d0d7de" stroke-width="2"/>
    <text x="190" y="265" font-size="12" fill="#6b7280" text-anchor="middle">GND (ISEN12)</text>

    <!-- Transistor Labels -->
    <text x="105" y="150" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">HS1</text>
    <text x="105" y="218" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">LS1</text>
    <text x="245" y="150" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">HS2</text>
    <text x="245" y="218" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">LS2</text>

    <!-- Inactive Open Switches (LS1, HS2) -->
    <!-- LS1 Open -->
    <line x1="120" y1="180" x2="120" y2="202" stroke="#9ca3af" stroke-width="2"/>
    <line x1="120" y1="226" x2="120" y2="248" stroke="#9ca3af" stroke-width="2"/>
    <circle cx="120" cy="202" r="2.5" fill="#6b7280"/>
    <circle cx="120" cy="226" r="2.5" fill="#6b7280"/>
    <line x1="120" y1="226" x2="110" y2="204" stroke="#9ca3af" stroke-width="2"/>

    <!-- HS2 Open -->
    <line x1="260" y1="112" x2="260" y2="134" stroke="#9ca3af" stroke-width="2"/>
    <line x1="260" y1="158" x2="260" y2="180" stroke="#9ca3af" stroke-width="2"/>
    <circle cx="260" cy="134" r="2.5" fill="#6b7280"/>
    <circle cx="260" cy="158" r="2.5" fill="#6b7280"/>
    <line x1="260" y1="158" x2="250" y2="136" stroke="#9ca3af" stroke-width="2"/>

    <!-- Active Current Path (Blue) -->
    <path d="M 190,112 L 120,112 L 120,180 L 170,180" fill="none" stroke="#2457d6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 210,180 L 260,180 L 260,248 L 190,248" fill="none" stroke="#2457d6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Contact Nodes for Active Switches (HS1, LS2) -->
    <circle cx="120" cy="134" r="3.5" fill="#2457d6"/>
    <circle cx="120" cy="158" r="3.5" fill="#2457d6"/>
    <circle cx="260" cy="202" r="3.5" fill="#2457d6"/>
    <circle cx="260" cy="226" r="3.5" fill="#2457d6"/>

    <!-- Path Flow Arrows -->
    <polygon points="116,144 120,152 124,144" fill="#2457d6"/>
    <polygon points="144,176 152,180 144,184" fill="#2457d6"/>
    <polygon points="230,176 238,180 230,184" fill="#2457d6"/>
    <polygon points="256,212 260,220 264,212" fill="#2457d6"/>

    <!-- Motor & Terminals -->
    <circle cx="190" cy="180" r="20" fill="white" stroke="#1a1a1a" stroke-width="2"/>
    <text x="190" y="184" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">M</text>
    <!-- CW Arrow inside Motor -->
    <path d="M 181,171 A 10,10 0 0,1 199,171" fill="none" stroke="#2457d6" stroke-width="1.8"/>
    <polygon points="196,167 202,172 197,176" fill="#2457d6"/>

    <text x="126" y="172" font-size="12" font-weight="bold" fill="#1a1a1a">OUT1</text>
    <text x="254" y="172" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">OUT2</text>

    <!-- Info Card -->
    <rect x="295" y="106" width="160" height="154" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
    <text x="305" y="124" font-size="12" font-weight="bold" fill="#1a1a1a">Режим: Прямий хід</text>
    <text x="305" y="143" font-size="12" fill="#2457d6">OUT1 = H (+VMM)</text>
    <text x="305" y="160" font-size="12" fill="#2457d6">OUT2 = L (GND)</text>
    <text x="305" y="179" font-size="12" fill="#1a1a1a">HS1: УВІМК  | LS1: ВИМК</text>
    <text x="305" y="196" font-size="12" fill="#1a1a1a">HS2: ВИМК  | LS2: УВІМК</text>
    <text x="305" y="215" font-size="12" font-weight="bold" fill="#1a1a1a">Напрямок: CW</text>
    <text x="305" y="234" font-size="12" font-weight="bold" fill="#2457d6">Струм: VMM → M → GND</text>
  </g>

  <!-- PANEL 2: REVERSE (IN1=0, IN2=1) -->
  <g id="panel-reverse">
    <!-- Panel Box -->
    <rect x="490" y="70" width="450" height="215" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <!-- Title & Badge -->
    <text x="505" y="92" font-size="14" font-weight="bold" fill="#1a1a1a">2. Зворотний хід (Reverse)</text>
    <rect x="740" y="76" width="185" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
    <text x="832" y="91" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">IN1 = 0  |  IN2 = 1</text>

    <!-- Base Schematic Wires -->
    <line x1="570" y1="112" x2="730" y2="112" stroke="#d0d7de" stroke-width="2"/>
    <text x="680" y="104" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">+VMM</text>
    <line x1="570" y1="248" x2="730" y2="248" stroke="#d0d7de" stroke-width="2"/>
    <text x="680" y="265" font-size="12" fill="#6b7280" text-anchor="middle">GND (ISEN12)</text>

    <!-- Transistor Labels -->
    <text x="595" y="150" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">HS1</text>
    <text x="595" y="218" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">LS1</text>
    <text x="735" y="150" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">HS2</text>
    <text x="735" y="218" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">LS2</text>

    <!-- Inactive Open Switches (HS1, LS2) -->
    <!-- HS1 Open -->
    <line x1="610" y1="112" x2="610" y2="134" stroke="#9ca3af" stroke-width="2"/>
    <line x1="610" y1="158" x2="610" y2="180" stroke="#9ca3af" stroke-width="2"/>
    <circle cx="610" cy="134" r="2.5" fill="#6b7280"/>
    <circle cx="610" cy="158" r="2.5" fill="#6b7280"/>
    <line x1="610" y1="158" x2="600" y2="136" stroke="#9ca3af" stroke-width="2"/>

    <!-- LS2 Open -->
    <line x1="750" y1="180" x2="750" y2="202" stroke="#9ca3af" stroke-width="2"/>
    <line x1="750" y1="226" x2="750" y2="248" stroke="#9ca3af" stroke-width="2"/>
    <circle cx="750" cy="202" r="2.5" fill="#6b7280"/>
    <circle cx="750" cy="226" r="2.5" fill="#6b7280"/>
    <line x1="750" y1="226" x2="740" y2="204" stroke="#9ca3af" stroke-width="2"/>

    <!-- Active Current Path (Blue) -->
    <path d="M 680,112 L 750,112 L 750,180 L 700,180" fill="none" stroke="#2457d6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 660,180 L 610,180 L 610,248 L 680,248" fill="none" stroke="#2457d6" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Contact Nodes for Active Switches (HS2, LS1) -->
    <circle cx="750" cy="134" r="3.5" fill="#2457d6"/>
    <circle cx="750" cy="158" r="3.5" fill="#2457d6"/>
    <circle cx="610" cy="202" r="3.5" fill="#2457d6"/>
    <circle cx="610" cy="226" r="3.5" fill="#2457d6"/>

    <!-- Path Flow Arrows -->
    <polygon points="746,144 750,152 754,144" fill="#2457d6"/>
    <polygon points="726,176 718,180 726,184" fill="#2457d6"/>
    <polygon points="638,176 630,180 638,184" fill="#2457d6"/>
    <polygon points="606,212 610,220 614,212" fill="#2457d6"/>

    <!-- Motor & Terminals -->
    <circle cx="680" cy="180" r="20" fill="white" stroke="#1a1a1a" stroke-width="2"/>
    <text x="680" y="184" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">M</text>
    <!-- CCW Arrow inside Motor -->
    <path d="M 699,171 A 10,10 0 0,0 661,171" fill="none" stroke="#2457d6" stroke-width="1.8"/>
    <polygon points="664,167 658,172 663,176" fill="#2457d6"/>

    <text x="616" y="172" font-size="12" font-weight="bold" fill="#1a1a1a">OUT1</text>
    <text x="744" y="172" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">OUT2</text>

    <!-- Info Card -->
    <rect x="765" y="106" width="160" height="154" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
    <text x="775" y="124" font-size="12" font-weight="bold" fill="#1a1a1a">Режим: Зворотний хід</text>
    <text x="775" y="143" font-size="12" fill="#2457d6">OUT1 = L (GND)</text>
    <text x="775" y="160" font-size="12" fill="#2457d6">OUT2 = H (+VMM)</text>
    <text x="775" y="179" font-size="12" fill="#1a1a1a">HS1: ВИМК  | LS1: УВІМК</text>
    <text x="775" y="196" font-size="12" fill="#1a1a1a">HS2: УВІМК  | LS2: ВИМК</text>
    <text x="775" y="215" font-size="12" font-weight="bold" fill="#1a1a1a">Напрямок: CCW</text>
    <text x="775" y="234" font-size="12" font-weight="bold" fill="#2457d6">Струм: VMM → M → GND</text>
  </g>

  <!-- PANEL 3: BRAKE (IN1=1, IN2=1) -->
  <g id="panel-brake">
    <!-- Panel Box -->
    <rect x="20" y="300" width="450" height="215" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <!-- Title & Badge -->
    <text x="35" y="322" font-size="14" font-weight="bold" fill="#1a1a1a">3. Гальмування (Slow Decay)</text>
    <rect x="270" y="306" width="185" height="22" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
    <text x="362" y="321" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">IN1 = 1  |  IN2 = 1</text>

    <!-- Base Schematic Wires -->
    <line x1="100" y1="342" x2="260" y2="342" stroke="#d0d7de" stroke-width="2"/>
    <text x="190" y="334" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">+VMM</text>
    <text x="190" y="495" font-size="12" fill="#6b7280" text-anchor="middle">GND (ISEN12)</text>

    <!-- Transistor Labels -->
    <text x="105" y="380" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">HS1</text>
    <text x="105" y="448" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">LS1</text>
    <text x="245" y="380" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">HS2</text>
    <text x="245" y="448" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">LS2</text>

    <!-- Inactive Open High-Side Switches (HS1, HS2) -->
    <!-- HS1 Open -->
    <line x1="120" y1="342" x2="120" y2="364" stroke="#9ca3af" stroke-width="2"/>
    <line x1="120" y1="388" x2="120" y2="410" stroke="#9ca3af" stroke-width="2"/>
    <circle cx="120" cy="364" r="2.5" fill="#6b7280"/>
    <circle cx="120" cy="388" r="2.5" fill="#6b7280"/>
    <line x1="120" y1="388" x2="110" y2="366" stroke="#9ca3af" stroke-width="2"/>

    <!-- HS2 Open -->
    <line x1="260" y1="342" x2="260" y2="364" stroke="#9ca3af" stroke-width="2"/>
    <line x1="260" y1="388" x2="260" y2="410" stroke="#9ca3af" stroke-width="2"/>
    <circle cx="260" cy="364" r="2.5" fill="#6b7280"/>
    <circle cx="260" cy="388" r="2.5" fill="#6b7280"/>
    <line x1="260" y1="388" x2="250" y2="366" stroke="#9ca3af" stroke-width="2"/>

    <!-- Recirculating Brake Current Path (Green) -->
    <path d="M 170,410 L 120,410 L 120,478 L 260,478 L 260,410 L 210,410" fill="none" stroke="#27ae60" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Contact Nodes for Active Low-Side Switches (LS1, LS2) -->
    <circle cx="120" cy="432" r="3.5" fill="#27ae60"/>
    <circle cx="120" cy="456" r="3.5" fill="#27ae60"/>
    <circle cx="260" cy="432" r="3.5" fill="#27ae60"/>
    <circle cx="260" cy="456" r="3.5" fill="#27ae60"/>

    <!-- Recirculation Flow Arrows -->
    <polygon points="150,406 142,410 150,414" fill="#27ae60"/>
    <polygon points="116,442 120,450 124,442" fill="#27ae60"/>
    <polygon points="186,474 194,478 186,482" fill="#27ae60"/>
    <polygon points="256,448 260,440 264,448" fill="#27ae60"/>

    <!-- Motor & Terminals -->
    <circle cx="190" cy="410" r="20" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
    <text x="190" y="414" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">M</text>

    <text x="126" y="402" font-size="12" font-weight="bold" fill="#1a1a1a">OUT1</text>
    <text x="254" y="402" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">OUT2</text>

    <!-- Info Card -->
    <rect x="295" y="336" width="160" height="154" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
    <text x="305" y="354" font-size="12" font-weight="bold" fill="#1a1a1a">Режим: Гальмування</text>
    <text x="305" y="373" font-size="12" fill="#27ae60">OUT1 = L (GND)</text>
    <text x="305" y="390" font-size="12" fill="#27ae60">OUT2 = L (GND)</text>
    <text x="305" y="409" font-size="12" fill="#1a1a1a">HS1: ВИМК  | LS1: УВІМК</text>
    <text x="305" y="426" font-size="12" fill="#1a1a1a">HS2: ВИМК  | LS2: УВІМК</text>
    <text x="305" y="445" font-size="12" font-weight="bold" fill="#27ae60">Гальмо: Активне</text>
    <text x="305" y="464" font-size="12" font-weight="bold" fill="#27ae60">Струм: Замкнено в LS</text>
  </g>

  <!-- PANEL 4: COAST (IN1=0, IN2=0) -->
  <g id="panel-coast">
    <!-- Panel Box -->
    <rect x="490" y="300" width="450" height="215" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <!-- Title & Badge -->
    <text x="505" y="322" font-size="14" font-weight="bold" fill="#1a1a1a">4. Вільний вибіг (Coast)</text>
    <rect x="740" y="306" width="185" height="22" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
    <text x="832" y="321" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">IN1 = 0  |  IN2 = 0</text>

    <!-- Base Schematic Wires -->
    <line x1="570" y1="342" x2="730" y2="342" stroke="#d0d7de" stroke-width="2"/>
    <text x="680" y="334" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">+VMM</text>
    <line x1="570" y1="478" x2="730" y2="478" stroke="#d0d7de" stroke-width="2"/>
    <text x="680" y="495" font-size="12" fill="#6b7280" text-anchor="middle">GND (ISEN12)</text>

    <!-- Motor Wires (Dashed Gray) -->
    <line x1="610" y1="410" x2="660" y2="410" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4,3"/>
    <line x1="700" y1="410" x2="750" y2="410" stroke="#9ca3af" stroke-width="2" stroke-dasharray="4,3"/>

    <!-- Transistor Labels -->
    <text x="595" y="380" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">HS1</text>
    <text x="595" y="448" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">LS1</text>
    <text x="735" y="380" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">HS2</text>
    <text x="735" y="448" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">LS2</text>

    <!-- All Switches Open (HS1, LS1, HS2, LS2) -->
    <!-- HS1 Open -->
    <line x1="610" y1="342" x2="610" y2="364" stroke="#9ca3af" stroke-width="2"/>
    <line x1="610" y1="388" x2="610" y2="410" stroke="#9ca3af" stroke-width="2"/>
    <circle cx="610" cy="364" r="2.5" fill="#6b7280"/>
    <circle cx="610" cy="388" r="2.5" fill="#6b7280"/>
    <line x1="610" y1="388" x2="600" y2="366" stroke="#9ca3af" stroke-width="2"/>

    <!-- LS1 Open -->
    <line x1="610" y1="410" x2="610" y2="432" stroke="#9ca3af" stroke-width="2"/>
    <line x1="610" y1="456" x2="610" y2="478" stroke="#9ca3af" stroke-width="2"/>
    <circle cx="610" cy="432" r="2.5" fill="#6b7280"/>
    <circle cx="610" cy="456" r="2.5" fill="#6b7280"/>
    <line x1="610" y1="456" x2="600" y2="434" stroke="#9ca3af" stroke-width="2"/>

    <!-- HS2 Open -->
    <line x1="750" y1="342" x2="750" y2="364" stroke="#9ca3af" stroke-width="2"/>
    <line x1="750" y1="388" x2="750" y2="410" stroke="#9ca3af" stroke-width="2"/>
    <circle cx="750" cy="364" r="2.5" fill="#6b7280"/>
    <circle cx="750" cy="388" r="2.5" fill="#6b7280"/>
    <line x1="750" y1="388" x2="740" y2="366" stroke="#9ca3af" stroke-width="2"/>

    <!-- LS2 Open -->
    <line x1="750" y1="410" x2="750" y2="432" stroke="#9ca3af" stroke-width="2"/>
    <line x1="750" y1="456" x2="750" y2="478" stroke="#9ca3af" stroke-width="2"/>
    <circle cx="750" cy="432" r="2.5" fill="#6b7280"/>
    <circle cx="750" cy="456" r="2.5" fill="#6b7280"/>
    <line x1="750" y1="456" x2="740" y2="434" stroke="#9ca3af" stroke-width="2"/>

    <!-- Motor & Terminals -->
    <circle cx="680" cy="410" r="20" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="680" y="414" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">M</text>

    <text x="616" y="402" font-size="12" font-weight="bold" fill="#1a1a1a">OUT1</text>
    <text x="744" y="402" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">OUT2</text>

    <!-- Info Card -->
    <rect x="765" y="336" width="160" height="154" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
    <text x="775" y="354" font-size="12" font-weight="bold" fill="#1a1a1a">Режим: Вільний вибіг</text>
    <text x="775" y="373" font-size="12" fill="#c0392b">OUT1 = Z (High-Z)</text>
    <text x="775" y="390" font-size="12" fill="#c0392b">OUT2 = Z (High-Z)</text>
    <text x="775" y="409" font-size="12" fill="#1a1a1a">HS1: ВИМК  | LS1: ВИМК</text>
    <text x="775" y="426" font-size="12" fill="#1a1a1a">HS2: ВИМК  | LS2: ВИМК</text>
    <text x="775" y="445" font-size="12" font-weight="bold" fill="#c0392b">Вибіг: Пасивний</text>
    <text x="775" y="464" font-size="12" font-weight="bold" fill="#c0392b">Струм: Відсутній (Z)</text>
  </g>
</svg>
