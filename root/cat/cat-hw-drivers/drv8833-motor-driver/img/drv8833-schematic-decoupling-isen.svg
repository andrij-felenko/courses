<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-dark" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Header -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема обв'язки DRV8833: фільтрація живлення та струмове обмеження ISEN</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Конденсатори C_VM придушують завади живлення, а R_ISEN задають поріг обмеження струму мотора</text>

  <!-- 1. Microcontroller (MCU) Panel -->
  <rect x="30" y="75" width="130" height="415" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <path d="M 30,83 A 8,8 0 0,1 38,75 L 152,75 A 8,8 0 0,1 160,83 L 160,118 L 30,118 Z" fill="#e2e8f0"/>
  <line x1="30" y1="118" x2="160" y2="118" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="95" y="96" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Мікроконтролер</text>
  <text x="95" y="110" text-anchor="middle" font-size="11" fill="#6b7280">(Керування)</text>

  <!-- MCU Pin Labels -->
  <text x="150" y="139" text-anchor="end" font-size="12" fill="#1a1a1a">IN1 (ШІМ A1)</text>
  <circle cx="160" cy="135" r="3" fill="#2457d6"/>

  <text x="150" y="179" text-anchor="end" font-size="12" fill="#1a1a1a">IN2 (ШІМ A2)</text>
  <circle cx="160" cy="175" r="3" fill="#2457d6"/>

  <text x="150" y="219" text-anchor="end" font-size="12" fill="#1a1a1a">IN3 (ШІМ B1)</text>
  <circle cx="160" cy="215" r="3" fill="#2457d6"/>

  <text x="150" y="259" text-anchor="end" font-size="12" fill="#1a1a1a">IN4 (ШІМ B2)</text>
  <circle cx="160" cy="255" r="3" fill="#2457d6"/>

  <text x="150" y="309" text-anchor="end" font-size="12" fill="#27ae60">nSLEEP (Ctrl)</text>
  <circle cx="160" cy="305" r="3" fill="#27ae60"/>

  <text x="150" y="359" text-anchor="end" font-size="12" fill="#c0392b">nFAULT (Flt)</text>
  <circle cx="160" cy="355" r="3" fill="#c0392b"/>

  <text x="150" y="419" text-anchor="end" font-size="12" fill="#1a1a1a">VCC (+3.3V)</text>
  <circle cx="160" cy="415" r="3" fill="#1a1a1a"/>

  <text x="150" y="469" text-anchor="end" font-size="12" fill="#6b7280">GND (Спільна)</text>
  <circle cx="160" cy="465" r="3" fill="#6b7280"/>

  <!-- 2. DRV8833 IC Main Block -->
  <rect x="280" y="75" width="270" height="415" fill="#ffffff" stroke="#2457d6" stroke-width="2" rx="8"/>
  <path d="M 280,83 A 8,8 0 0,1 288,75 L 542,75 A 8,8 0 0,1 550,83 L 550,118 L 280,118 Z" fill="#2457d6"/>
  <line x1="280" y1="118" x2="550" y2="118" stroke="#2457d6" stroke-width="2"/>
  <text x="415" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">DRV8833</text>
  <text x="415" y="110" text-anchor="middle" font-size="11" fill="#eaf0fd">Двоканальний H-міст (HTSSOP-16)</text>

  <!-- Left Pin Labels inside IC -->
  <text x="290" y="139" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">IN1</text>
  <circle cx="280" cy="135" r="3" fill="#2457d6"/>

  <text x="290" y="179" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">IN2</text>
  <circle cx="280" cy="175" r="3" fill="#2457d6"/>

  <text x="290" y="219" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">IN3</text>
  <circle cx="280" cy="215" r="3" fill="#2457d6"/>

  <text x="290" y="259" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">IN4</text>
  <circle cx="280" cy="255" r="3" fill="#2457d6"/>

  <text x="290" y="309" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">nSLEEP</text>
  <circle cx="280" cy="305" r="3" fill="#27ae60"/>

  <text x="290" y="359" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">nFAULT</text>
  <circle cx="280" cy="355" r="3" fill="#c0392b"/>

  <text x="290" y="419" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">VINT</text>
  <circle cx="280" cy="415" r="3" fill="#27ae60"/>

  <text x="290" y="469" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">VCP</text>
  <circle cx="280" cy="465" r="3" fill="#2457d6"/>

  <!-- Right Pin Labels inside IC -->
  <text x="540" y="139" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">OUT1</text>
  <circle cx="550" cy="135" r="3" fill="#2457d6"/>

  <text x="540" y="179" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">OUT2</text>
  <circle cx="550" cy="175" r="3" fill="#2457d6"/>

  <text x="540" y="219" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">OUT3</text>
  <circle cx="550" cy="215" r="3" fill="#2457d6"/>

  <text x="540" y="259" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">OUT4</text>
  <circle cx="550" cy="255" r="3" fill="#2457d6"/>

  <text x="540" y="309" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">AISEN</text>
  <circle cx="550" cy="305" r="3" fill="#1a1a1a"/>

  <text x="540" y="359" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">BISEN</text>
  <circle cx="550" cy="355" r="3" fill="#1a1a1a"/>

  <text x="540" y="419" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">VM</text>
  <circle cx="550" cy="415" r="3" fill="#27ae60"/>

  <text x="540" y="469" text-anchor="end" font-size="12" font-weight="bold" fill="#6b7280">GND</text>
  <circle cx="550" cy="465" r="3" fill="#6b7280"/>

  <!-- Internal IC Sub-blocks -->
  <!-- Bridge A -->
  <rect x="330" y="124" width="170" height="52" fill="#eaf0fd" stroke="#2457d6" stroke-dasharray="3,3" rx="5"/>
  <text x="415" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">H-міст каналу A</text>
  <text x="415" y="160" text-anchor="middle" font-size="11" fill="#6b7280">OUT1 / OUT2 (до 1.5A)</text>

  <!-- Bridge B -->
  <rect x="330" y="204" width="170" height="52" fill="#eaf0fd" stroke="#2457d6" stroke-dasharray="3,3" rx="5"/>
  <text x="415" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">H-міст каналу B</text>
  <text x="415" y="240" text-anchor="middle" font-size="11" fill="#6b7280">OUT3 / OUT4 (до 1.5A)</text>

  <!-- Protection Logic -->
  <rect x="330" y="284" width="170" height="84" fill="#f4f6f8" stroke="#d0d7de" rx="5"/>
  <text x="415" y="302" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Логіка керування</text>
  <text x="415" y="320" text-anchor="middle" font-size="11" fill="#6b7280">Захист: TSD, OCP, UVLO</text>
  <text x="415" y="338" text-anchor="middle" font-size="11" fill="#6b7280">ШІМ-регулювання</text>
  <text x="415" y="356" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Поріг ISEN = VREF / 10</text>

  <!-- Power & VREF Internal -->
  <rect x="330" y="394" width="170" height="84" fill="#e9f7ef" stroke="#27ae60" stroke-dasharray="3,3" rx="5"/>
  <text x="415" y="412" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Живлення / VREF</text>
  <text x="415" y="430" text-anchor="middle" font-size="11" fill="#1a1a1a">Внутр. LDO 1.5V (VINT)</text>
  <text x="415" y="448" text-anchor="middle" font-size="11" fill="#1a1a1a">Charge Pump (VCP)</text>
  <text x="415" y="466" text-anchor="middle" font-size="11" fill="#6b7280">VREF = 200 мВ</text>

  <!-- 3. Gap 1 Connections & Passives (x=160..280) -->
  <line x1="160" y1="135" x2="280" y2="135" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="160" y1="175" x2="280" y2="175" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="160" y1="215" x2="280" y2="215" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="160" y1="255" x2="280" y2="255" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- nSLEEP wire -->
  <line x1="160" y1="305" x2="280" y2="305" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- nFAULT wire & Pull-up R_PU -->
  <line x1="280" y1="355" x2="160" y2="355" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <circle cx="225" cy="355" r="3" fill="#c0392b"/>

  <line x1="225" y1="355" x2="225" y2="370" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="217" y="370" width="16" height="26" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="238" y="382" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">R_PU</text>
  <text x="238" y="396" text-anchor="start" font-size="11" fill="#6b7280">10 кОм</text>
  <line x1="225" y1="396" x2="225" y2="415" stroke="#c0392b" stroke-width="1.5"/>

  <!-- VCC line from MCU (x=160, y=415) to x=225 -->
  <line x1="160" y1="415" x2="225" y2="415" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="225" cy="415" r="3" fill="#1a1a1a"/>

  <!-- VINT bypass cap C_VINT -->
  <line x1="280" y1="415" x2="265" y2="415" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="265" cy="415" r="3" fill="#27ae60"/>
  <line x1="265" y1="415" x2="265" y2="436" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="257" y1="436" x2="273" y2="436" stroke="#27ae60" stroke-width="2"/>
  <line x1="257" y1="444" x2="273" y2="444" stroke="#27ae60" stroke-width="2"/>
  <text x="252" y="432" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">C_VINT</text>
  <text x="252" y="446" text-anchor="end" font-size="11" fill="#6b7280">2.2 мкФ</text>
  <line x1="265" y1="444" x2="265" y2="490" stroke="#27ae60" stroke-width="1.5"/>

  <!-- VCP charge pump cap C_VCP -->
  <line x1="280" y1="465" x2="190" y2="465" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="190" cy="465" r="3" fill="#2457d6"/>
  <line x1="190" y1="465" x2="190" y2="474" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="182" y1="474" x2="198" y2="474" stroke="#2457d6" stroke-width="2"/>
  <line x1="182" y1="480" x2="198" y2="480" stroke="#2457d6" stroke-width="2"/>
  <text x="202" y="477" text-anchor="start" font-size="10" font-weight="bold" fill="#2457d6">C_VCP</text>
  <text x="202" y="487" text-anchor="start" font-size="10" fill="#6b7280">10 нФ</text>
  <line x1="190" y1="480" x2="190" y2="490" stroke="#2457d6" stroke-width="1.5"/>

  <!-- 4. Gap 2 Connections & Right Side Blocks (x=550..930) -->
  <!-- Motor A wires -->
  <line x1="550" y1="135" x2="710" y2="135" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="550" y1="175" x2="710" y2="175" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Motor A Box -->
  <rect x="710" y="115" width="220" height="80" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <circle cx="750" cy="155" r="22" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="750" y="161" text-anchor="middle" font-size="16" font-weight="bold" fill="#2457d6">M</text>
  <text x="785" y="138" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">Мотор A (DC)</text>
  <text x="785" y="155" text-anchor="start" font-size="11" fill="#6b7280">OUT1 та OUT2</text>
  <text x="785" y="172" text-anchor="start" font-size="11" fill="#2457d6">Реверс + ШІМ</text>

  <!-- Motor B wires -->
  <line x1="550" y1="215" x2="710" y2="215" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="550" y1="255" x2="710" y2="255" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Motor B Box -->
  <rect x="710" y="205" width="220" height="80" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <circle cx="750" cy="245" r="22" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="750" y="251" text-anchor="middle" font-size="16" font-weight="bold" fill="#2457d6">M</text>
  <text x="785" y="228" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">Мотор B (DC)</text>
  <text x="785" y="245" text-anchor="start" font-size="11" fill="#6b7280">OUT3 та OUT4</text>
  <text x="785" y="262" text-anchor="start" font-size="11" fill="#2457d6">Реверс + ШІМ</text>

  <!-- AISEN Wire & Resistor R_ISEN1 -->
  <line x1="550" y1="305" x2="710" y2="305" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>
  <circle cx="585" cy="305" r="3" fill="#1a1a1a"/>
  <line x1="585" y1="305" x2="585" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="577" y="320" width="16" height="26" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="600" y="332" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">R_ISEN1</text>
  <text x="600" y="346" text-anchor="start" font-size="11" fill="#6b7280">0.2 Ом</text>
  <line x1="585" y1="346" x2="585" y2="490" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- BISEN Wire & Resistor R_ISEN2 -->
  <line x1="550" y1="355" x2="710" y2="355" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>
  <circle cx="660" cy="355" r="3" fill="#1a1a1a"/>
  <line x1="660" y1="355" x2="660" y2="370" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="652" y="370" width="16" height="26" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="645" y="382" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">R_ISEN2</text>
  <text x="645" y="396" text-anchor="end" font-size="11" fill="#6b7280">0.2 Ом</text>
  <line x1="660" y1="396" x2="660" y2="490" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- ISEN Callout Box -->
  <rect x="710" y="295" width="220" height="95" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="8"/>
  <text x="722" y="316" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">Обмеження струму ISEN</text>
  <text x="722" y="334" text-anchor="start" font-size="11" fill="#1a1a1a">R_ISEN1 = R_ISEN2 = 0.2 Ом</text>
  <text x="722" y="352" text-anchor="start" font-size="11" fill="#6b7280">Поріг струму за формулою:</text>
  <text x="722" y="372" text-anchor="start" font-size="11" font-weight="bold" fill="#27ae60">I_TRIP = 200mV / (10 × 0.2) = 1.0A</text>

  <!-- VM Line & Decoupling Capacitors C_VM1, C_VM2 -->
  <line x1="550" y1="415" x2="710" y2="415" stroke="#27ae60" stroke-width="2.5"/>

  <!-- C_VM1 Electrolytic (x=595) -->
  <circle cx="595" cy="415" r="3" fill="#27ae60"/>
  <line x1="595" y1="415" x2="595" y2="436" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="587" y1="436" x2="603" y2="436" stroke="#27ae60" stroke-width="2"/>
  <line x1="587" y1="444" x2="603" y2="444" stroke="#27ae60" stroke-width="2"/>
  <text x="607" y="430" font-size="12" font-weight="bold" fill="#27ae60">+</text>
  <text x="618" y="434" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">C_VM1</text>
  <text x="618" y="448" text-anchor="start" font-size="11" fill="#6b7280">47 мкФ</text>
  <line x1="595" y1="444" x2="595" y2="490" stroke="#27ae60" stroke-width="1.5"/>

  <!-- C_VM2 Ceramic (x=675) -->
  <circle cx="675" cy="415" r="3" fill="#27ae60"/>
  <line x1="675" y1="415" x2="675" y2="436" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="667" y1="436" x2="683" y2="436" stroke="#27ae60" stroke-width="2"/>
  <line x1="667" y1="444" x2="683" y2="444" stroke="#27ae60" stroke-width="2"/>
  <text x="640" y="462" text-anchor="end" font-size="11" font-weight="bold" fill="#27ae60">C_VM2</text>
  <text x="640" y="474" text-anchor="end" font-size="11" fill="#6b7280">0.1 мкФ</text>
  <line x1="675" y1="444" x2="675" y2="490" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Power Supply VM Box -->
  <rect x="710" y="400" width="220" height="90" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="8"/>
  <text x="722" y="420" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">Силове живлення VM</text>
  <text x="722" y="438" text-anchor="start" font-size="11" font-weight="bold" fill="#1a1a1a">+VM = +2.7V ... +10.8V</text>
  <text x="722" y="456" text-anchor="start" font-size="11" fill="#6b7280">C_VM1 = 47 мкФ (Електроліт)</text>
  <text x="722" y="474" text-anchor="start" font-size="11" fill="#27ae60">C_VM2 = 0.1 мкФ (Кераміка ВЧ)</text>

  <!-- 5. Common Ground Bus (GND) -->
  <line x1="160" y1="490" x2="710" y2="490" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="160" y1="465" x2="160" y2="490" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="160" cy="490" r="3" fill="#1a1a1a"/>
  <circle cx="190" cy="490" r="3" fill="#1a1a1a"/>
  <circle cx="265" cy="490" r="3" fill="#1a1a1a"/>
  <circle cx="585" cy="490" r="3" fill="#1a1a1a"/>
  <circle cx="595" cy="490" r="3" fill="#1a1a1a"/>
  <circle cx="660" cy="490" r="3" fill="#1a1a1a"/>
  <circle cx="675" cy="490" r="3" fill="#1a1a1a"/>

  <!-- Ground symbol -->
  <line x1="415" y1="490" x2="415" y2="502" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="405" y1="502" x2="425" y2="502" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="409" y1="506" x2="421" y2="506" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="412" y1="510" x2="418" y2="510" stroke="#1a1a1a" stroke-width="1"/>
  <text x="415" y="524" text-anchor="middle" font-size="11" font-weight="bold" fill="#6b7280">Спільна шина заземлення (GND)</text>
</svg>
