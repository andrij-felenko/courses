<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часові діаграми керування H-мостом DRV8833</text>
  <text x="480" y="55" font-size="13" fill="#6b7280" text-anchor="middle">Співвідношення вхідних сигналів IN1/IN2 та виходів OUT1/OUT2 у різних режимах ШІМ</text>

  <!-- Main Container Panel -->
  <rect x="30" y="72" width="900" height="448" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Phase Column Background Highlights -->
  <rect x="180" y="72" width="180" height="290" fill="#2457d6" fill-opacity="0.02"/>
  <rect x="360" y="72" width="180" height="290" fill="#2457d6" fill-opacity="0.04"/>
  <rect x="540" y="72" width="180" height="290" fill="#2457d6" fill-opacity="0.02"/>
  <rect x="720" y="72" width="180" height="290" fill="#c0392b" fill-opacity="0.03"/>

  <!-- Vertical Phase Boundary Lines -->
  <line x1="180" y1="72" x2="180" y2="362" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="360" y1="72" x2="360" y2="362" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="540" y1="72" x2="540" y2="362" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="720" y1="72" x2="720" y2="362" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="900" y1="72" x2="900" y2="362" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Phase Headers -->
  <text x="270" y="92" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Фаза 1: Вперед (Fast Decay)</text>
  <text x="450" y="92" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Фаза 2: Вперед (Slow Decay)</text>
  <text x="630" y="92" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Фаза 3: Реверс (Fast Decay)</text>
  <text x="810" y="92" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Фаза 4: Гальмування / Стоп</text>

  <!-- Horizontal Grid Baseline Guides -->
  <line x1="175" y1="110" x2="900" y2="110" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="175" y1="140" x2="900" y2="140" stroke="#e5e7eb" stroke-width="1"/>

  <line x1="175" y1="180" x2="900" y2="180" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="175" y1="210" x2="900" y2="210" stroke="#e5e7eb" stroke-width="1"/>

  <line x1="45" y1="230" x2="900" y2="230" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>

  <line x1="175" y1="250" x2="900" y2="250" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="175" y1="265" x2="900" y2="265" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="175" y1="280" x2="900" y2="280" stroke="#e5e7eb" stroke-width="1"/>

  <line x1="175" y1="320" x2="900" y2="320" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="175" y1="335" x2="900" y2="335" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="175" y1="350" x2="900" y2="350" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Left Column Signal Labels -->
  <!-- IN1 Card -->
  <rect x="45" y="105" width="115" height="40" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="102" y="122" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">IN1</text>
  <text x="102" y="137" font-size="11" fill="#6b7280" text-anchor="middle">(Вхід 1)</text>

  <!-- IN2 Card -->
  <rect x="45" y="175" width="115" height="40" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="102" y="192" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">IN2</text>
  <text x="102" y="207" font-size="11" fill="#6b7280" text-anchor="middle">(Вхід 2)</text>

  <!-- OUT1 Card -->
  <rect x="45" y="245" width="115" height="40" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="102" y="262" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">OUT1</text>
  <text x="102" y="277" font-size="11" fill="#6b7280" text-anchor="middle">(Вихід 1)</text>

  <!-- OUT2 Card -->
  <rect x="45" y="315" width="115" height="40" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="102" y="332" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">OUT2</text>
  <text x="102" y="347" font-size="11" fill="#6b7280" text-anchor="middle">(Вихід 2)</text>

  <!-- Signal Axis Value Labels -->
  <text x="172" y="114" font-size="11" fill="#6b7280" text-anchor="end">1</text>
  <text x="172" y="144" font-size="11" fill="#6b7280" text-anchor="end">0</text>

  <text x="172" y="184" font-size="11" fill="#6b7280" text-anchor="end">1</text>
  <text x="172" y="214" font-size="11" fill="#6b7280" text-anchor="end">0</text>

  <text x="172" y="254" font-size="11" fill="#6b7280" text-anchor="end">H</text>
  <text x="172" y="269" font-size="11" fill="#6b7280" text-anchor="end">Z</text>
  <text x="172" y="284" font-size="11" fill="#6b7280" text-anchor="end">L</text>

  <text x="172" y="324" font-size="11" fill="#6b7280" text-anchor="end">H</text>
  <text x="172" y="339" font-size="11" fill="#6b7280" text-anchor="end">Z</text>
  <text x="172" y="354" font-size="11" fill="#6b7280" text-anchor="end">L</text>

  <!-- WAVEFORMS -->

  <!-- IN1 Signal Line -->
  <path d="M 180,110 L 235,110 L 235,140 L 270,140 L 270,110 L 325,110 L 325,140 L 360,140 L 540,110 L 540,140 L 720,140 L 720,110 L 810,110 L 810,140 L 900,140" fill="none" stroke="#2457d6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- IN2 Signal Line -->
  <path d="M 180,210 L 360,210 L 415,210 L 415,180 L 450,180 L 450,210 L 505,210 L 505,180 L 540,180 L 595,180 L 595,210 L 630,210 L 630,180 L 685,180 L 685,210 L 720,210 L 720,180 L 810,180 L 810,210 L 900,210" fill="none" stroke="#2457d6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- OUT1 Signal Line (Solid Active Sections) -->
  <path d="M 180,250 L 235,250 M 270,250 L 325,250 M 360,250 L 415,250 L 415,280 L 450,280 L 450,250 L 505,250 L 505,280 L 540,280 L 595,280 M 630,280 L 685,280 M 720,280 L 810,280" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- OUT1 Hi-Z & Vertical Transition Lines -->
  <path d="M 235,250 L 235,265 M 270,265 L 270,250 M 325,250 L 325,265 M 360,265 L 360,250 M 540,280 L 540,280 M 595,280 L 595,265 M 630,265 L 630,280 M 685,280 L 685,265 M 810,280 L 810,265" fill="none" stroke="#27ae60" stroke-width="1.5"/>
  <path d="M 235,265 L 270,265 M 325,265 L 360,265 M 595,265 L 630,265 M 685,265 L 720,265 M 810,265 L 900,265" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- OUT2 Signal Line (Solid Active Sections) -->
  <path d="M 180,350 L 235,350 M 270,350 L 325,350 M 360,350 L 540,350 M 540,320 L 595,320 M 630,320 L 685,320 M 720,350 L 810,350" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- OUT2 Hi-Z & Vertical Transition Lines -->
  <path d="M 235,350 L 235,335 M 270,335 L 270,350 M 325,350 L 325,335 M 360,335 L 360,350 M 595,320 L 595,335 M 630,335 L 630,320 M 685,320 L 685,335 M 810,350 L 810,335" fill="none" stroke="#27ae60" stroke-width="1.5"/>
  <path d="M 235,335 L 270,335 M 325,335 L 360,335 M 595,335 L 630,335 M 685,335 L 720,335 M 810,335 L 900,335" fill="none" stroke="#8c959f" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- Waveform Annotations -->
  <text x="207" y="104" font-size="10" fill="#2457d6" text-anchor="middle">ШІМ 60%</text>
  <text x="567" y="174" font-size="10" fill="#2457d6" text-anchor="middle">ШІМ 60%</text>

  <text x="252" y="261" font-size="10" fill="#6b7280" text-anchor="middle">Hi-Z</text>
  <text x="252" y="331" font-size="10" fill="#6b7280" text-anchor="middle">Hi-Z</text>

  <text x="432" y="294" font-size="10" fill="#c0392b" text-anchor="middle">Гальмо (L)</text>

  <text x="612" y="261" font-size="10" fill="#6b7280" text-anchor="middle">Hi-Z</text>
  <text x="612" y="331" font-size="10" fill="#6b7280" text-anchor="middle">Hi-Z</text>

  <text x="765" y="294" font-size="10" fill="#c0392b" text-anchor="middle">Гальмо (L-L)</text>
  <text x="855" y="261" font-size="10" fill="#6b7280" text-anchor="middle">Coast (Z-Z)</text>

  <!-- SUMMARY MODE CARDS -->

  <!-- Card 1: Phase 1 -->
  <rect x="182" y="372" width="168" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="266" y="389" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вперед (Coast PWM)</text>
  <rect x="182" y="398" width="168" height="106" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="190" y="416" font-size="11" fill="#1a1a1a">• IN1: ШІМ (сигнал)</text>
  <text x="190" y="434" font-size="11" fill="#1a1a1a">• IN2: 0 (фіксовано)</text>
  <text x="190" y="452" font-size="11" fill="#1a1a1a">• Пауза: High-Z (Coast)</text>
  <text x="190" y="470" font-size="11" fill="#1a1a1a">• Спад струму: Швидкий</text>
  <text x="190" y="488" font-size="11" fill="#1a1a1a">• Мотор: Вільний вибіг</text>

  <!-- Card 2: Phase 2 -->
  <rect x="366" y="372" width="168" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="450" y="389" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вперед (Brake PWM)</text>
  <rect x="366" y="398" width="168" height="106" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="374" y="416" font-size="11" fill="#1a1a1a">• IN1: 1 (фіксовано)</text>
  <text x="374" y="434" font-size="11" fill="#1a1a1a">• IN2: ШІМ (інверсний)</text>
  <text x="374" y="452" font-size="11" fill="#1a1a1a">• Пауза: L-L (Гальмо)</text>
  <text x="374" y="470" font-size="11" fill="#1a1a1a">• Спад струму: Повільний</text>
  <text x="374" y="488" font-size="11" fill="#1a1a1a">• Мотор: Висока плавність</text>

  <!-- Card 3: Phase 3 -->
  <rect x="550" y="372" width="168" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="634" y="389" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Реверс (Fast Decay)</text>
  <rect x="550" y="398" width="168" height="106" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="558" y="416" font-size="11" fill="#1a1a1a">• IN1: 0 (фіксовано)</text>
  <text x="558" y="434" font-size="11" fill="#1a1a1a">• IN2: ШІМ (сигнал)</text>
  <text x="558" y="452" font-size="11" fill="#1a1a1a">• Активно: OUT1=L, OUT2=H</text>
  <text x="558" y="470" font-size="11" fill="#1a1a1a">• Пауза: High-Z (Coast)</text>
  <text x="558" y="488" font-size="11" fill="#1a1a1a">• Мотор: Обертання назад</text>

  <!-- Card 4: Phase 4 -->
  <rect x="734" y="372" width="168" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="818" y="389" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Гальмування та Стоп</text>
  <rect x="734" y="398" width="168" height="106" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="742" y="416" font-size="11" fill="#1a1a1a">• IN1=1, IN2=1: Brake</text>
  <text x="742" y="434" font-size="11" fill="#1a1a1a">  (OUT1=L, OUT2=L)</text>
  <text x="742" y="452" font-size="11" fill="#1a1a1a">• IN1=0, IN2=0: Standby</text>
  <text x="742" y="470" font-size="11" fill="#1a1a1a">  (OUT1=Z, OUT2=Z)</text>
  <text x="742" y="488" font-size="11" fill="#1a1a1a">• Низьке споживання</text>

</svg>
