<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="527" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Внутрішня блокова структура двоканального H-моста DRV8833</text>
  <text x="527" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Архітектура N-MOSFET ключів, Charge Pump, захисти та проходження струму</text>

  <!-- Outer Chip Container (IC DRV8833) -->
  <rect x="125" y="68" width="810" height="472" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="8"/>
  <text x="140" y="90" font-size="14" font-weight="bold" fill="#1a1a1a">Мікросхема DRV8833 (Dual H-Bridge)</text>

  <!-- Left Input Pins Lines & Labels -->
  <!-- VM Pin -->
  <line x1="110" y1="120" x2="135" y2="120" stroke="#2457d6" stroke-width="2"/>
  <circle cx="125" cy="120" r="3.5" fill="#2457d6"/>
  <text x="105" y="116" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">VM</text>
  <text x="105" y="129" text-anchor="end" font-size="12" fill="#6b7280">(2.7–10.8 В)</text>

  <!-- IN1 Pin -->
  <line x1="110" y1="186" x2="145" y2="186" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle cx="125" cy="186" r="3" fill="#1a1a1a"/>
  <text x="105" y="190" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">IN1</text>

  <!-- IN2 Pin -->
  <line x1="110" y1="214" x2="145" y2="214" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle cx="125" cy="214" r="3" fill="#1a1a1a"/>
  <text x="105" y="218" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">IN2</text>

  <!-- IN3 Pin -->
  <line x1="110" y1="242" x2="145" y2="242" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle cx="125" cy="242" r="3" fill="#1a1a1a"/>
  <text x="105" y="246" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">IN3</text>

  <!-- IN4 Pin -->
  <line x1="110" y1="270" x2="145" y2="270" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle cx="125" cy="270" r="3" fill="#1a1a1a"/>
  <text x="105" y="274" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">IN4</text>

  <!-- nSLEEP Pin -->
  <line x1="110" y1="298" x2="145" y2="298" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle cx="125" cy="298" r="3" fill="#1a1a1a"/>
  <text x="105" y="302" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">nSLEEP</text>

  <!-- nFAULT Pin -->
  <line x1="145" y1="326" x2="110" y2="326" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <circle cx="125" cy="326" r="3" fill="#c0392b"/>
  <text x="105" y="330" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">nFAULT</text>

  <!-- VREF Pin -->
  <line x1="110" y1="430" x2="145" y2="430" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <circle cx="125" cy="430" r="3" fill="#1a1a1a"/>
  <text x="105" y="426" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">VREF</text>
  <text x="105" y="439" text-anchor="end" font-size="12" fill="#6b7280">(200 мВ)</text>

  <!-- Column 1: Internal Control & Subsystems (x=145..350) -->
  <!-- 1.1 Charge Pump Block -->
  <rect x="145" y="102" width="205" height="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="247" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Charge Pump (Насос)</text>
  <text x="247" y="140" text-anchor="middle" font-size="12" fill="#1a1a1a">Подвоєння VCP для N-FET</text>

  <!-- 1.2 Control & Protection Logic Block -->
  <rect x="145" y="172" width="205" height="205" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="247" y="192" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Логіка керування та захисту</text>
  <line x1="155" y1="200" x2="340" y2="200" stroke="#d0d7de" stroke-width="1"/>
  <text x="155" y="218" font-size="12" fill="#1a1a1a">• Логіка входів IN1–IN4</text>
  <text x="155" y="240" font-size="12" fill="#1a1a1a">• Захист від перегріву TSD</text>
  <text x="155" y="262" font-size="12" fill="#c0392b">• Струмовий захист OCP</text>
  <text x="155" y="284" font-size="12" fill="#1a1a1a">• Блокування напруги UVLO</text>
  <text x="155" y="306" font-size="12" fill="#2457d6">• Контроль паузи Dead Time</text>
  <text x="155" y="328" font-size="12" fill="#1a1a1a">• Управління nSLEEP / EN</text>
  <text x="155" y="350" font-size="12" fill="#27ae60">• Формування Gate-сигналів</text>

  <!-- 1.3 ISEN Sense Comparator Logic Block -->
  <rect x="145" y="395" width="205" height="95" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="247" y="414" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Компаратори ISEN</text>
  <line x1="155" y1="421" x2="340" y2="421" stroke="#d0d7de" stroke-width="1"/>
  <text x="155" y="438" font-size="12" fill="#1a1a1a">• Порівняння V_ISEN з V_REF</text>
  <text x="155" y="456" font-size="12" fill="#2457d6">• Обмеження струму I_TRIP</text>
  <text x="155" y="474" font-size="12" fill="#27ae60">• Режими Fast / Slow Decay</text>

  <!-- Internal Connections inside Column 1 -->
  <!-- VM to Charge Pump Input -->
  <line x1="135" y1="120" x2="145" y2="120" stroke="#2457d6" stroke-width="2"/>
  <!-- Charge Pump VCP output to Logic Top -->
  <line x1="247" y1="152" x2="247" y2="172" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="259" y="166" font-size="12" font-weight="bold" fill="#2457d6">VCP</text>

  <!-- VM Main Power Bus Line across H-Bridges -->
  <line x1="135" y1="120" x2="135" y2="160" stroke="#2457d6" stroke-width="2"/>
  <line x1="135" y1="160" x2="860" y2="160" stroke="#2457d6" stroke-width="2"/>
  <circle cx="440" cy="160" r="3.5" fill="#2457d6"/>
  <circle cx="585" cy="160" r="3.5" fill="#2457d6"/>
  <circle cx="715" cy="160" r="3.5" fill="#2457d6"/>
  <circle cx="860" cy="160" r="3.5" fill="#2457d6"/>

  <!-- Column 2: Power H-Bridge A (x=394..638) -->
  <rect x="394" y="102" width="244" height="388" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="516" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Силовий H-міст A (Bridge A)</text>

  <!-- High-side 1 (HS1) -->
  <rect x="408" y="178" width="64" height="42" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2" rx="4"/>
  <text x="422" y="203" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">HS1</text>
  <!-- High-side 2 (HS2) -->
  <rect x="553" y="178" width="64" height="42" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2" rx="4"/>
  <text x="567" y="203" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">HS2</text>

  <!-- Low-side 1 (LS1) -->
  <rect x="408" y="328" width="64" height="42" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2" rx="4"/>
  <text x="422" y="353" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">LS1</text>
  <!-- Low-side 2 (LS2) -->
  <rect x="553" y="328" width="64" height="42" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2" rx="4"/>
  <text x="567" y="353" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">LS2</text>

  <!-- Bridge A Power & Signal Connections -->
  <!-- Top VM connections -->
  <line x1="440" y1="160" x2="440" y2="178" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="585" y1="160" x2="585" y2="178" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Inside MOSFET boxes wire lines -->
  <line x1="440" y1="178" x2="440" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="585" y1="178" x2="585" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="440" y1="328" x2="440" y2="370" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="585" y1="328" x2="585" y2="370" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Left leg: HS1 to LS1 -->
  <line x1="440" y1="220" x2="440" y2="328" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Right leg: HS2 to LS2 -->
  <line x1="585" y1="220" x2="585" y2="328" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Motor A Output Nodes and Terminals -->
  <circle cx="440" cy="274" r="3.5" fill="#1a1a1a"/>
  <circle cx="585" cy="274" r="3.5" fill="#1a1a1a"/>
  <line x1="440" y1="274" x2="490.5" y2="274" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="534.5" y1="274" x2="585" y2="274" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="448" y="262" font-size="12" font-weight="bold" fill="#2457d6">AOUT1</text>
  <text x="535" y="262" font-size="12" font-weight="bold" fill="#2457d6">AOUT2</text>

  <!-- Motor A Load Circle -->
  <circle cx="512.5" cy="274" r="22" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="512.5" y="279" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">M A</text>

  <!-- Bottom Common Node to AISEN -->
  <line x1="440" y1="370" x2="440" y2="395" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="585" y1="370" x2="585" y2="395" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="440" y1="395" x2="585" y2="395" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="512.5" cy="395" r="3.5" fill="#1a1a1a"/>
  <text x="532" y="385" font-size="12" font-weight="bold" fill="#1a1a1a">AISEN</text>
  <line x1="512.5" y1="395" x2="512.5" y2="415" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Sense Resistor R_ISENA -->
  <rect x="487.5" y="415" width="50" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="512.5" y="430" text-anchor="middle" font-size="12" fill="#1a1a1a">R_ISENA</text>
  <line x1="512.5" y1="439" x2="512.5" y2="452" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Ground Symbol -->
  <line x1="500.5" y1="452" x2="524.5" y2="452" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="505.5" y1="456" x2="519.5" y2="456" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="509.5" y1="460" x2="515.5" y2="460" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- HIGHLIGHTED ACTIVE FORWARD CURRENT PATH IN BRIDGE A (Green Dashed) -->
  <path d="M440,160 L440,274 L490.5,274 M534.5,274 L585,274 L585,395 L512.5,395 L512.5,415" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arr-green)"/>
  <text x="512.5" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Шлях струму I_MOTOR</text>

  <!-- Column 3: Power H-Bridge B (x=666..910) -->
  <rect x="666" y="102" width="244" height="388" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="788" y="121" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Силовий H-міст B (Bridge B)</text>

  <!-- High-side 3 (HS3) -->
  <rect x="683" y="178" width="64" height="42" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2" rx="4"/>
  <text x="697" y="203" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">HS3</text>
  <!-- High-side 4 (HS4) -->
  <rect x="828" y="178" width="64" height="42" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2" rx="4"/>
  <text x="842" y="203" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">HS4</text>

  <!-- Low-side 3 (LS3) -->
  <rect x="683" y="328" width="64" height="42" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2" rx="4"/>
  <text x="697" y="353" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">LS3</text>
  <!-- Low-side 4 (LS4) -->
  <rect x="828" y="328" width="64" height="42" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2" rx="4"/>
  <text x="842" y="353" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">LS4</text>

  <!-- Bridge B Power & Signal Connections -->
  <line x1="715" y1="160" x2="715" y2="178" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="860" y1="160" x2="860" y2="178" stroke="#1a1a1a" stroke-width="1.5"/>

  <line x1="715" y1="178" x2="715" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="860" y1="178" x2="860" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="715" y1="328" x2="715" y2="370" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="860" y1="328" x2="860" y2="370" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Left leg: HS3 to LS3 -->
  <line x1="715" y1="220" x2="715" y2="328" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Right leg: HS4 to LS4 -->
  <line x1="860" y1="220" x2="860" y2="328" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Motor B Output Nodes and Terminals -->
  <circle cx="715" cy="274" r="3.5" fill="#1a1a1a"/>
  <circle cx="860" cy="274" r="3.5" fill="#1a1a1a"/>
  <line x1="715" y1="274" x2="765.5" y2="274" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="809.5" y1="274" x2="860" y2="274" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="723" y="262" font-size="12" font-weight="bold" fill="#2457d6">BOUT1</text>
  <text x="810" y="262" font-size="12" font-weight="bold" fill="#2457d6">BOUT2</text>

  <!-- Motor B Load Circle -->
  <circle cx="787.5" cy="274" r="22" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="787.5" y="279" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">M B</text>

  <!-- Bottom Common Node to BISEN -->
  <line x1="715" y1="370" x2="715" y2="395" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="860" y1="370" x2="860" y2="395" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="715" y1="395" x2="860" y2="395" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="787.5" cy="395" r="3.5" fill="#1a1a1a"/>
  <text x="807" y="385" font-size="12" font-weight="bold" fill="#1a1a1a">BISEN</text>
  <line x1="787.5" y1="395" x2="787.5" y2="415" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Sense Resistor R_ISENB -->
  <rect x="762.5" y="415" width="50" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="787.5" y="430" text-anchor="middle" font-size="12" fill="#1a1a1a">R_ISENB</text>
  <line x1="787.5" y1="439" x2="787.5" y2="452" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Ground Symbol -->
  <line x1="775.5" y1="452" x2="799.5" y2="452" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="780.5" y1="456" x2="794.5" y2="456" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="784.5" y1="460" x2="790.5" y2="460" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- INTER-BLOCK CONTROL AND SENSE FEEDBACK LINES -->
  <!-- Gate Drive Control Signals from Logic to Bridge A -->
  <line x1="350" y1="228" x2="394" y2="228" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="372" y="222" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Gate A</text>

  <!-- Gate Drive Control Signals from Logic to Bridge B -->
  <path d="M350,360 L365,360 L365,502 L648,502 L648,360 L666,360" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="506" y="496" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Gate B</text>

  <!-- Sense Feedback A to ISEN Comparator -->
  <path d="M470,395 L470,470 L350,470" fill="none" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr-blue)"/>
  <text x="430" y="462" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Sense A</text>

  <!-- Sense Feedback B to ISEN Comparator -->
  <path d="M745,395 L745,484 L350,484" fill="none" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arr-blue)"/>
  <text x="710" y="476" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Sense B</text>

  <!-- Bottom Legend Note inside IC -->
  <text x="527" y="520" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Зелена лінія — активний шлях струму (HS1 → Motor A → LS2 → R_ISENA → GND)</text>
</svg>
