<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="510" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема обмеження струму DRV8833 через вивід ISEN</text>
  <text x="480" y="53" font-size="13" fill="#6b7280" text-anchor="middle">При V_ISEN ≥ 200 мВ компаратор тригрує вимикання силових ключів на час t_OFF ≈ 3.75 мкс</text>

  <!-- Маркери для стрілок -->
  <defs>
    <marker id="arr-main" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- ================= ЛІВА ПАНЕЛЬ: ВНУТРІШНЯ СХЕМА DRV8833 ТА ISEN ================= -->
  <!-- Корпус мікросхеми DRV8833 -->
  <rect x="40" y="75" width="520" height="300" rx="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>

  <!-- Бейдж корпусу -->
  <rect x="55" y="87" width="165" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="137.5" y="103" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Мікросхема DRV8833</text>

  <!-- Драйвери затворів -->
  <rect x="280" y="145" width="135" height="48" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="347.5" y="164" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Драйвери затворів</text>
  <text x="347.5" y="182" font-size="12" fill="#6b7280" text-anchor="middle">Керування MOSFET</text>

  <!-- Шина живлення VM -->
  <text x="147.5" y="122" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Живлення VM</text>
  <line x1="147.5" y1="126" x2="147.5" y2="138" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="97.5" y1="138" x2="197.5" y2="138" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="97.5" y1="138" x2="97.5" y2="145" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="197.5" y1="138" x2="197.5" y2="145" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="147.5" cy="138" r="3" fill="#1a1a1a"/>

  <!-- Силові ключі H-моста -->
  <!-- HS1 -->
  <rect x="75" y="145" width="45" height="30" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="97.5" y="164" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">HS1</text>

  <!-- HS2 -->
  <rect x="175" y="145" width="45" height="30" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="197.5" y="164" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">HS2</text>

  <!-- З'єднання від HS до мотора -->
  <line x1="97.5" y1="175" x2="97.5" y2="205" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="197.5" y1="175" x2="197.5" y2="205" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="97.5" y1="205" x2="129.5" y2="205" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="165.5" y1="205" x2="197.5" y2="205" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="97.5" cy="205" r="3" fill="#1a1a1a"/>
  <circle cx="197.5" cy="205" r="3" fill="#1a1a1a"/>

  <!-- Двигун М -->
  <circle cx="147.5" cy="205" r="18" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="147.5" y="210" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">M</text>

  <!-- LS1 -->
  <line x1="97.5" y1="205" x2="97.5" y2="235" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="75" y="235" width="45" height="30" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="97.5" y="254" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">LS1</text>

  <!-- LS2 -->
  <line x1="197.5" y1="205" x2="197.5" y2="235" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="175" y="235" width="45" height="30" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="197.5" y="254" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">LS2</text>

  <!-- Спільна шина повернення струму (Low-side return) -->
  <line x1="97.5" y1="265" x2="97.5" y2="278" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="197.5" y1="265" x2="197.5" y2="278" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="97.5" y1="278" x2="197.5" y2="278" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="147.5" y1="278" x2="147.5" y2="375" stroke="#2457d6" stroke-width="2"/>
  <circle cx="97.5" cy="278" r="3" fill="#1a1a1a"/>
  <circle cx="197.5" cy="278" r="3" fill="#1a1a1a"/>
  <circle cx="147.5" cy="278" r="3" fill="#1a1a1a"/>
  <circle cx="147.5" cy="335" r="3" fill="#2457d6"/>

  <!-- Стрілка струму мотора I_motor -->
  <line x1="147.5" y1="285" x2="147.5" y2="312" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="135" y="302" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">I_motor</text>

  <!-- Рівняння напруги V_ISEN -->
  <text x="160" y="358" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">V_ISEN = I_motor × R_ISEN</text>

  <!-- Опорна напруга V_TRIP = 200 мВ -->
  <rect x="225" y="290" width="75" height="34" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="262.5" y="304" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">V_TRIP</text>
  <text x="262.5" y="317" font-size="12" fill="#2457d6" text-anchor="middle">200 мВ</text>
  <line x1="300" y1="307" x2="330" y2="307" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Компаратор обмеження струму -->
  <polygon points="330,285 330,355 385,320" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="336" y="311" font-size="14" font-weight="bold" fill="#1a1a1a">–</text>
  <text x="336" y="340" font-size="14" font-weight="bold" fill="#1a1a1a">+</text>
  <text x="352" y="324" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">COMP</text>
  <line x1="147.5" y1="335" x2="330" y2="335" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Вихід компаратора TRIP -->
  <line x1="385" y1="320" x2="420" y2="320" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="402.5" y="312" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">TRIP</text>

  <!-- Блок логіки таймера t_OFF -->
  <rect x="420" y="285" width="125" height="70" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="482.5" y="305" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Логіка t_OFF</text>
  <text x="482.5" y="323" font-size="12" fill="#1a1a1a" text-anchor="middle">Пауза ШІМ</text>
  <text x="482.5" y="343" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">t_OFF ≈ 3.75 мкс</text>

  <!-- Сигнал вимкнення до драйверів затворів -->
  <line x1="482.5" y1="285" x2="482.5" y2="169" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="482.5" y1="169" x2="415" y2="169" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="495" y="215" font-size="12" font-weight="bold" fill="#c0392b">Вимкнення</text>
  <text x="495" y="231" font-size="12" font-weight="bold" fill="#c0392b">ключів</text>

  <!-- Сигнал керування від драйверів до ключів H-моста -->
  <line x1="280" y1="169" x2="240" y2="169" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="240" y1="169" x2="220" y2="160" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="240" y1="169" x2="220" y2="250" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ================= ЗОВНІШНІ КОМПОНЕНТИ ================= -->
  <!-- Зовнішній вивід ISEN -->
  <line x1="147.5" y1="375" x2="147.5" y2="390" stroke="#2457d6" stroke-width="2"/>
  <rect x="130" y="390" width="35" height="20" rx="3" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="147.5" y="404" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ISEN</text>

  <!-- Вимірювальний резистор R_ISEN -->
  <line x1="147.5" y1="410" x2="147.5" y2="430" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="135.5" y="430" width="24" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="175" y="448" font-size="13" font-weight="bold" fill="#1a1a1a">R_ISEN</text>
  <text x="175" y="464" font-size="12" fill="#6b7280">струмовимірювальний</text>

  <!-- Земля (GND) -->
  <line x1="147.5" y1="470" x2="147.5" y2="485" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="132.5" y1="485" x2="162.5" y2="485" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="137.5" y1="489" x2="157.5" y2="489" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="142.5" y1="493" x2="152.5" y2="493" stroke="#1a1a1a" stroke-width="1"/>
  <text x="175" y="493" font-size="12" fill="#6b7280">GND</text>

  <!-- ================= ПРАВА ПАНЕЛЬ: ФОРМУЛИ ТА ДІАГРАМА ================= -->
  <rect x="580" y="75" width="340" height="425" rx="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>

  <!-- Бейдж правої панелі -->
  <rect x="595" y="87" width="310" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="750" y="103" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Формули та режим обмеження струму</text>

  <!-- Блок 1: Формула порогу I_CHOP -->
  <rect x="595" y="120" width="310" height="70" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="750" y="138" font-size="12" fill="#6b7280" text-anchor="middle">Поріг вимикання компаратора (V_TRIP = 200 мВ):</text>
  <text x="750" y="160" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">I_CHOP = 0.2 В / R_ISEN</text>
  <text x="750" y="178" font-size="12" fill="#6b7280" text-anchor="middle">де I_CHOP — піковий струм мотора</text>

  <!-- Блок 2: Числовий приклад -->
  <rect x="595" y="204" width="310" height="66" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="610" y="223" font-size="12" font-weight="bold" fill="#1a1a1a">Приклад: R_ISEN = 0.2 Ом</text>
  <text x="610" y="242" font-size="13" font-weight="bold" fill="#27ae60">I_CHOP = 0.2 В / 0.2 Ом = 1.0 А</text>
  <text x="610" y="259" font-size="12" fill="#6b7280">Струм мотора обмежено на рівні 1.0 А</text>

  <!-- Блок 3: Часова діаграма -->
  <rect x="595" y="284" width="310" height="205" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="750" y="302" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма струму I_motor(t)</text>

  <!-- Легенда діаграми -->
  <rect x="760" y="312" width="135" height="34" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <line x1="768" y1="322" x2="783" y2="322" stroke="#27ae60" stroke-width="2.5"/>
  <text x="788" y="326" font-size="12" fill="#1a1a1a">Наростання</text>
  <line x1="768" y1="337" x2="783" y2="337" stroke="#c0392b" stroke-width="2.5"/>
  <text x="788" y="341" font-size="12" fill="#1a1a1a">Decay (t_OFF)</text>

  <!-- Осі координат -->
  <line x1="650" y1="445" x2="650" y2="320" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-main)"/>
  <text x="644" y="325" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">I_motor</text>

  <line x1="650" y1="445" x2="880" y2="445" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-main)"/>
  <text x="880" y="462" font-size="12" fill="#6b7280" text-anchor="end">Час t</text>

  <!-- Пунктир порогу I_CHOP -->
  <line x1="650" y1="355" x2="865" y2="355" stroke="#c0392b" stroke-dasharray="4,4" stroke-width="1.5"/>
  <text x="655" y="348" font-size="12" font-weight="bold" fill="#c0392b">I_CHOP (200 мВ)</text>

  <!-- Крива струму I_motor(t) -->
  <!-- Наростання 1 -->
  <line x1="650" y1="435" x2="710" y2="355" stroke="#27ae60" stroke-width="2.5"/>
  <!-- Згасання 1 (t_OFF) -->
  <line x1="710" y1="355" x2="760" y2="395" stroke="#c0392b" stroke-width="2.5"/>
  <!-- Наростання 2 -->
  <line x1="760" y1="395" x2="810" y2="355" stroke="#27ae60" stroke-width="2.5"/>
  <!-- Згасання 2 -->
  <line x1="810" y1="355" x2="860" y2="395" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Індикатор інтервалу t_OFF -->
  <line x1="710" y1="355" x2="710" y2="415" stroke="#c0392b" stroke-dasharray="2,2" stroke-width="1"/>
  <line x1="760" y1="395" x2="760" y2="415" stroke="#c0392b" stroke-dasharray="2,2" stroke-width="1"/>
  <line x1="710" y1="415" x2="760" y2="415" stroke="#c0392b" stroke-width="1.5"/>
  <text x="735" y="433" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">t_OFF ≈ 3.75 мкс</text>
</svg>
