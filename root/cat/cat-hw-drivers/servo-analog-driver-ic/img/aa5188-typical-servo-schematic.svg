<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Header & Subtitle -->
  <text x="490" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Типова схема включення аналогового сервопідсилювача AA5188 / KC0032</text>
  <text x="490" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Зовнішня RC-обв'язка задає зону нечутливості й таймінг, а H-міст керує мотором за зворотним зв'язком</text>

  <!-- Ground Line & GND Symbol -->
  <line x1="40" y1="450" x2="920" y2="450" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="490" y1="450" x2="490" y2="458" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="475" y1="458" x2="505" y2="458" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="480" y1="463" x2="500" y2="463" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="485" y1="468" x2="495" y2="468" stroke="#1a1a1a" stroke-width="1"/>
  <text x="490" y="485" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GND (Спільна земля)</text>

  <!-- Central IC Container Block (AA5188 / KC0032) -->
  <rect x="360" y="85" width="260" height="340" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>

  <!-- IC Header -->
  <rect x="360" y="85" width="260" height="42" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="360" y="112" width="260" height="15" fill="#eaf0fd" stroke="none"/>
  <text x="490" y="103" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">AA5188 / KC0032</text>
  <text x="490" y="119" font-size="12" fill="#6b7280" text-anchor="middle">Аналоговий сервопідсилювач</text>

  <!-- IC Internal Functional Sub-blocks -->
  <!-- Block 1: VREG Regulator -->
  <rect x="395" y="137" width="190" height="32" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="490" y="157" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Стабілізатор VREG (2.45 В)</text>

  <!-- Block 2: Demodulator & Deadband Generator -->
  <rect x="395" y="180" width="190" height="70" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="490" y="200" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Демодулятор імпульсів</text>
  <text x="490" y="218" font-size="12" fill="#6b7280" text-anchor="middle">Генератор Deadband і таймінгу</text>
  <text x="490" y="236" font-size="12" fill="#6b7280" text-anchor="middle">(порівняння VIN та POT)</text>

  <!-- Block 3: Internal H-Bridge Driver -->
  <rect x="395" y="260" width="190" height="70" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="490" y="280" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вихідний H-міст (Driver)</text>
  <text x="490" y="298" font-size="12" fill="#6b7280" text-anchor="middle">Керування мотором (OUT1, OUT2)</text>
  <text x="490" y="316" font-size="12" fill="#6b7280" text-anchor="middle">Макс. струм до 500 мА</text>

  <!-- Block 4: External Transistor Expansion -->
  <rect x="395" y="340" width="190" height="48" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="490" y="360" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Виходи EXP1 / EXP2</text>
  <text x="490" y="377" font-size="12" fill="#6b7280" text-anchor="middle">(зовнішні силові транзистори)</text>

  <!-- IC Pins & Labels -->
  <!-- Left Pins -->
  <!-- Pin 9 VREG -->
  <rect x="332" y="143" width="28" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="346" y="157" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">9</text>
  <text x="366" y="157" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">VREG</text>

  <!-- Pin 14 VIN -->
  <rect x="332" y="190" width="28" height="20" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="346" y="204" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">14</text>
  <text x="366" y="204" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">VIN</text>

  <!-- Pin 15 POT -->
  <rect x="332" y="226" width="28" height="20" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="346" y="240" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">15</text>
  <text x="366" y="240" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">POT</text>

  <!-- Pin 16 CT -->
  <rect x="332" y="340" width="28" height="20" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="346" y="354" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">16</text>
  <text x="366" y="354" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">CT</text>

  <!-- Pin 7 CST -->
  <rect x="332" y="376" width="28" height="20" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="346" y="390" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">7</text>
  <text x="366" y="390" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">CST</text>

  <!-- Right Pins -->
  <!-- Pin 10 VCC -->
  <rect x="620" y="143" width="28" height="20" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="634" y="157" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">10</text>
  <text x="614" y="157" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">VCC</text>

  <!-- Pin 3 OUT1 -->
  <rect x="620" y="270" width="28" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="634" y="284" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">3</text>
  <text x="614" y="284" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">OUT1</text>

  <!-- Pin 5 OUT2 -->
  <rect x="620" y="304" width="28" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="634" y="318" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">5</text>
  <text x="614" y="318" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">OUT2</text>

  <!-- Pin 2,6 EXP -->
  <rect x="620" y="354" width="34" height="20" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="637" y="368" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2,6</text>
  <text x="614" y="368" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">EXP</text>

  <!-- Pin 12,13 GND -->
  <rect x="620" y="394" width="38" height="20" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="639" y="408" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">12,13</text>
  <text x="614" y="408" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">GND</text>

  <!-- LEFT EXTERNAL CIRCUITS -->

  <!-- 1. PWM Input Signal Terminal & Wire -->
  <text x="25" y="156" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Вхід PWM</text>
  <text x="25" y="172" font-size="12" fill="#6b7280" text-anchor="start">(1.0–2.0 мс)</text>
  <circle cx="25" cy="200" r="4" fill="#2457d6"/>
  <line x1="29" y1="200" x2="65" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Filter Cap C_in at x = 65 -->
  <circle cx="65" cy="200" r="3" fill="#1a1a1a"/>
  <line x1="65" y1="200" x2="65" y2="222" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="57" y1="222" x2="73" y2="222" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="57" y1="228" x2="73" y2="228" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="65" y1="228" x2="65" y2="450" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="65" cy="450" r="3" fill="#1a1a1a"/>
  <text x="77" y="230" font-size="12" fill="#6b7280" text-anchor="start">C_in = 1 nF</text>

  <!-- Resistor R_in at x = 125..165 -->
  <line x1="65" y1="200" x2="125" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="125" y="192" width="40" height="16" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="145" y="180" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">R_in = 1 kΩ</text>
  <line x1="165" y1="200" x2="332" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- 2. VREG Line & Potentiometer VR1 (x = 205) -->
  <!-- VREG Wire from Pin 9 (332, 153) left to (205, 153) -->
  <line x1="332" y1="153" x2="205" y2="153" stroke="#2457d6" stroke-width="1.5"/>
  <text x="205" y="125" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">VR1 = 5 kΩ</text>
  <text x="205" y="140" font-size="12" fill="#6b7280" text-anchor="middle">(Потенціометр)</text>

  <!-- VR1 Body & GND wire -->
  <line x1="205" y1="153" x2="205" y2="165" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="197" y="165" width="16" height="46" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="205" y1="211" x2="205" y2="450" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="205" cy="450" r="3" fill="#1a1a1a"/>

  <!-- Wiper Output Wire from VR1 (213, 188) to x=245 -> y=236 -> Pin 15 (332, 236) -->
  <line x1="213" y1="188" x2="245" y2="188" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="245" y1="188" x2="245" y2="236" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="245" y1="236" x2="332" y2="236" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Filter Cap C_pot at x = 245 -->
  <circle cx="245" cy="236" r="3" fill="#1a1a1a"/>
  <line x1="245" y1="236" x2="245" y2="258" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="237" y1="258" x2="253" y2="258" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="237" y1="264" x2="253" y2="264" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="245" y1="264" x2="245" y2="450" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="245" cy="450" r="3" fill="#1a1a1a"/>
  <text x="257" y="258" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">C_pot</text>
  <text x="257" y="274" font-size="12" fill="#6b7280" text-anchor="start">0.1 µF</text>

  <!-- Timing Cap C_T at x = 115 (Pin 16 CT) -->
  <line x1="332" y1="350" x2="115" y2="350" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="115" cy="350" r="3" fill="#1a1a1a"/>
  <line x1="115" y1="350" x2="115" y2="372" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="107" y1="372" x2="123" y2="372" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="107" y1="378" x2="123" y2="378" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="115" y1="378" x2="115" y2="450" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="115" cy="450" r="3" fill="#1a1a1a"/>
  <text x="101" y="372" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">C_T = 100 nF</text>
  <text x="101" y="388" font-size="12" fill="#6b7280" text-anchor="end">(Deadband)</text>

  <!-- Stretcher Cap C_ST at x = 275 (Pin 7 CST) -->
  <line x1="332" y1="386" x2="275" y2="386" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="275" cy="386" r="3" fill="#1a1a1a"/>
  <line x1="275" y1="386" x2="275" y2="405" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="267" y1="405" x2="283" y2="405" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="267" y1="411" x2="283" y2="411" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="275" y1="411" x2="275" y2="450" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="275" cy="450" r="3" fill="#1a1a1a"/>
  <text x="285" y="398" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">C_ST</text>
  <text x="285" y="414" font-size="12" fill="#6b7280" text-anchor="start">4.7 µF</text>
  <text x="285" y="430" font-size="12" fill="#6b7280" text-anchor="start">(Stretcher)</text>

  <!-- RIGHT EXTERNAL CIRCUITS -->

  <!-- 1. Power Supply VCC Terminal & Rail -->
  <text x="920" y="85" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">Живлення VCC</text>
  <text x="920" y="100" font-size="12" fill="#6b7280" text-anchor="end">(+3.5 ... +7.4 В)</text>
  <circle cx="920" cy="110" r="4" fill="#c0392b"/>
  <line x1="920" y1="110" x2="648" y2="110" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="648" y1="110" x2="648" y2="153" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="648" cy="153" r="3" fill="#c0392b"/>

  <!-- Decoupling Cap C1 (Electrolytic 100uF) at x = 700 -->
  <circle cx="700" cy="110" r="3" fill="#c0392b"/>
  <line x1="700" y1="110" x2="700" y2="135" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="688" y="127" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">+</text>
  <line x1="692" y1="135" x2="708" y2="135" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="692" y1="141" x2="708" y2="141" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="700" y1="141" x2="700" y2="450" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="700" cy="450" r="3" fill="#1a1a1a"/>
  <text x="714" y="135" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">C1 = 100 µF</text>
  <text x="714" y="151" font-size="12" fill="#6b7280" text-anchor="start">(Електроліт)</text>

  <!-- Decoupling Cap C2 (Ceramic 0.1uF) at x = 810 -->
  <circle cx="810" cy="110" r="3" fill="#c0392b"/>
  <line x1="810" y1="110" x2="810" y2="135" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="802" y1="135" x2="818" y2="135" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="802" y1="141" x2="818" y2="141" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="810" y1="141" x2="810" y2="450" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="810" cy="450" r="3" fill="#1a1a1a"/>
  <text x="824" y="135" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">C2 = 0.1 µF</text>
  <text x="824" y="151" font-size="12" fill="#6b7280" text-anchor="start">(Кераміка ВЧ)</text>

  <!-- IC GND Pins (12, 13) Wire to GND Bus -->
  <line x1="658" y1="404" x2="675" y2="404" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="675" y1="404" x2="675" y2="450" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="675" cy="450" r="3" fill="#1a1a1a"/>

  <!-- 2. Motor Outputs & Motor Assembly -->
  <line x1="648" y1="280" x2="805" y2="280" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="648" y1="314" x2="805" y2="314" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Motor Filter Cap C_M at x = 740 -->
  <circle cx="740" cy="280" r="3" fill="#2457d6"/>
  <circle cx="740" cy="314" r="3" fill="#2457d6"/>
  <line x1="740" y1="280" x2="740" y2="294" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="732" y1="294" x2="748" y2="294" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="732" y1="300" x2="748" y2="300" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="740" y1="300" x2="740" y2="314" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="740" y="268" font-size="12" fill="#6b7280" text-anchor="middle">C_M = 0.1 µF</text>

  <!-- DC Motor Assembly -->
  <text x="825" y="260" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Колекторний мотор DC</text>
  <circle cx="825" cy="297" r="20" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="825" y="302" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">M</text>

  <!-- Motor Shaft to Gearbox -->
  <line x1="845" y1="297" x2="870" y2="297" stroke="#1a1a1a" stroke-width="3.5"/>

  <!-- Gearbox -->
  <rect x="870" y="272" width="70" height="50" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="905" y="294" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Редуктор</text>
  <text x="905" y="310" font-size="12" fill="#6b7280" text-anchor="middle">(Шестерні)</text>

  <!-- Output Shaft -->
  <line x1="905" y1="322" x2="905" y2="515" stroke="#27ae60" stroke-width="3.5"/>
  <text x="893" y="370" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">Вихідний вал</text>

  <!-- Mechanical Feedback Line -->
  <path d="M 905 515 L 160 515 L 160 188 L 195 188" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr-green)"/>
  <text x="530" y="538" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Механічний зв'язок вихідного вала з потенціометром VR1 (зворотний зв'язок за положенням)</text>
</svg>
