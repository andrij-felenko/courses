<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers for flow lines -->
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="510" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Внутрішня структура аналогового серводрайвера AA5188 (SOP-8)</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Інтеграція таймінгів та H-мосту мінімізує зовнішню обв'язку до потенціометра, двигуна та RC-елементів</text>

  <!-- External Elements Left Panel -->
  <!-- Box 1: PWM Signal Input -->
  <rect x="40" y="128" width="145" height="52" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="112" y="149" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вхідний сигнал PWM</text>
  <text x="112" y="167" font-size="12" fill="#2457d6" text-anchor="middle">1.0 – 2.0 мс</text>

  <!-- Box 2: C_OS Capacitor -->
  <rect x="40" y="210" width="145" height="50" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="112" y="230" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Конденсатор C_OS</text>
  <text x="112" y="248" font-size="12" fill="#6b7280" text-anchor="middle">Мертва зона (~1 nF)</text>

  <!-- Box 3: VR Potentiometer -->
  <rect x="40" y="285" width="145" height="60" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="112" y="307" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Потенціометр VR</text>
  <text x="112" y="325" font-size="12" fill="#27ae60" text-anchor="middle">5 кОм (ОС позиції)</text>

  <!-- Box 4: GND Power Ground -->
  <rect x="40" y="405" width="145" height="40" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="112" y="429" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Земля GND (0 В)</text>

  <!-- Lines from Left External Components to IC Pins -->
  <path d="M 185,154 L 200,154" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <path d="M 185,235 L 200,235" fill="none" stroke="#6b7280" stroke-width="2"/>
  <path d="M 185,315 L 200,315" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <path d="M 185,425 L 200,425" fill="none" stroke="#6b7280" stroke-width="2"/>

  <!-- AA5188 Microchip IC Boundary Box -->
  <rect x="220" y="85" width="510" height="375" rx="12" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  
  <!-- IC Header Banner -->
  <rect x="235" y="98" width="480" height="28" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="475" y="117" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Інтегральна мікросхема AA5188 / KC0032 (Корпус SOP-8)</text>

  <!-- IC Pins - Left Side -->
  <rect x="200" y="142" width="20" height="24" rx="3" fill="#d0d7de" stroke="#6b7280"/>
  <text x="232" y="142" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">1: SIG</text>

  <rect x="200" y="223" width="20" height="24" rx="3" fill="#d0d7de" stroke="#6b7280"/>
  <text x="232" y="223" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">2: OS</text>

  <rect x="200" y="303" width="20" height="24" rx="3" fill="#d0d7de" stroke="#6b7280"/>
  <text x="232" y="303" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">3: POT</text>

  <rect x="200" y="413" width="20" height="24" rx="3" fill="#d0d7de" stroke="#6b7280"/>
  <text x="232" y="413" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">4: GND</text>

  <!-- IC Pins - Right Side -->
  <rect x="740" y="142" width="20" height="24" rx="3" fill="#d0d7de" stroke="#6b7280"/>
  <text x="728" y="142" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">8: VCC</text>

  <rect x="740" y="223" width="20" height="24" rx="3" fill="#d0d7de" stroke="#6b7280"/>
  <text x="728" y="223" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">7: OUT1</text>

  <rect x="740" y="303" width="20" height="24" rx="3" fill="#d0d7de" stroke="#6b7280"/>
  <text x="728" y="303" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">6: OUT2</text>

  <rect x="740" y="413" width="20" height="24" rx="3" fill="#d0d7de" stroke="#6b7280"/>
  <text x="728" y="413" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">5: RF</text>

  <!-- Internal Functional Blocks inside AA5188 -->
  <!-- Block 1: Input One-Shot -->
  <rect x="290" y="140" width="140" height="65" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="360" y="163" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вхідний одновібратор</text>
  <text x="360" y="181" font-size="12" fill="#2457d6" text-anchor="middle">Імпульс t_in (1–2 мс)</text>

  <!-- Block 2: Feedback One-Shot -->
  <rect x="290" y="295" width="140" height="65" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="360" y="318" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Одновібратор ОС</text>
  <text x="360" y="336" font-size="12" fill="#2457d6" text-anchor="middle">Імпульс t_fb (VR)</text>

  <!-- Block 3: Error Detector & Dead-Band -->
  <rect x="455" y="200" width="140" height="115" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="525" y="222" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Детектор помилки</text>
  <text x="525" y="240" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">&amp; Мертва зона</text>
  <text x="525" y="262" font-size="12" fill="#2457d6" text-anchor="middle">Δt = t_in - t_fb</text>
  <text x="525" y="282" font-size="12" fill="#6b7280" text-anchor="middle">Контроль C_OS</text>

  <!-- Block 4: Integrated H-Bridge Driver -->
  <rect x="615" y="185" width="100" height="175" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="665" y="210" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Вбудований</text>
  <text x="665" y="228" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">H-міст</text>
  <text x="665" y="258" font-size="12" fill="#1a1a1a" text-anchor="middle">Силові ключі</text>
  <text x="665" y="276" font-size="12" fill="#1a1a1a" text-anchor="middle">4 × NPN/PNP</text>
  <text x="665" y="315" font-size="12" fill="#27ae60" text-anchor="middle">До 800 мА</text>
  <text x="665" y="333" font-size="12" fill="#6b7280" text-anchor="middle">CW / CCW</text>

  <!-- Internal Signal Connections -->
  <!-- Pin 1 to Block 1 -->
  <path d="M 220,154 L 290,154" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <!-- Pin 3 to Block 2 -->
  <path d="M 220,315 L 290,315" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <!-- Pin 2 to Block 3 -->
  <path d="M 220,235 L 455,235" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Block 1 to Block 3 -->
  <path d="M 430,172 L 445,172 L 445,225 L 455,225" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <!-- Block 2 to Block 3 -->
  <path d="M 430,327 L 445,327 L 445,295 L 455,295" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Block 3 to Block 4 (H-Bridge) drive lines -->
  <path d="M 595,230 L 615,230" fill="none" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <path d="M 595,290 L 615,290" fill="none" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Block 4 (H-Bridge) to Pin 7 & Pin 6 -->
  <path d="M 715,235 L 740,235" fill="none" stroke="#27ae60" stroke-width="2"/>
  <path d="M 715,315 L 740,315" fill="none" stroke="#27ae60" stroke-width="2"/>

  <!-- Right External Elements -->
  <!-- Box 1: VCC Power Supply -->
  <rect x="765" y="130" width="155" height="50" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="842" y="150" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Живлення VCC</text>
  <text x="842" y="168" font-size="12" fill="#6b7280" text-anchor="middle">+4.8 В ... +6.0 В</text>

  <!-- Box 2: DC Motor -->
  <rect x="765" y="210" width="155" height="130" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="842" cy="242" r="16" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
  <text x="842" y="247" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">M</text>
  <text x="842" y="278" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Двигун DC</text>
  <text x="842" y="296" font-size="12" fill="#27ae60" text-anchor="middle">Реверс CW / CCW</text>
  <text x="842" y="318" font-size="12" fill="#6b7280" text-anchor="middle">До OUT1 та OUT2</text>

  <!-- Box 3: C_RF Capacitor -->
  <rect x="765" y="405" width="155" height="50" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="842" y="425" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Конденсатор C_RF</text>
  <text x="842" y="443" font-size="12" fill="#6b7280" text-anchor="middle">Фільтр (~47 nF)</text>

  <!-- Lines from IC Right Pins to External Components -->
  <path d="M 740,154 L 765,154" fill="none" stroke="#6b7280" stroke-width="2"/>
  <path d="M 740,235 L 765,235" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <path d="M 740,315 L 765,315" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <path d="M 740,425 L 765,425" fill="none" stroke="#6b7280" stroke-width="2"/>

  <!-- Mechanical Feedback Loop (Dashed Line broken around the text box) -->
  <path d="M 842,340 L 842,482 L 660,482" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,4"/>
  <path d="M 300,482 L 20,482 L 20,315 L 40,315" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr-green)"/>

  <!-- Bottom Annotation Box on Feedback Loop -->
  <rect x="310" y="471" width="340" height="22" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="480" y="486" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Механічний зворотний зв'язок: редуктор повертає VR</text>

</svg>
