<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="530" fill="white"/>

  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue-right" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-blue-left" markerWidth="9" markerHeight="9" refX="1.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-amber-right" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-amber-left" markerWidth="9" markerHeight="9" refX="1.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#d97706"/>
    </marker>
    <marker id="arr-red-right" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-red-left" markerWidth="9" markerHeight="9" refX="1.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green-right" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-green-left" markerWidth="9" markerHeight="9" refX="1.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Часова діаграма моновибратора та формування імпульсу помилки</text>
  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Формування вихідного сигналу моста при перевищенні різницею Δt = t_in - t_ref зони нечутливості t_db</text>

  <rect x="25" y="70" width="215" height="380" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <rect x="35" y="96" width="12" height="12" rx="2" fill="#2457d6"/>
  <text x="54" y="107" font-size="13" font-weight="bold" fill="#1a1a1a">V_in (Вхідний імпульс)</text>
  <text x="54" y="123" font-size="12" fill="#6b7280">ШИМ керування (t_in)</text>

  <rect x="35" y="152" width="12" height="12" rx="2" fill="#d97706"/>
  <text x="54" y="163" font-size="13" font-weight="bold" fill="#1a1a1a">V_ref (Опорний імпульс)</text>
  <text x="54" y="179" font-size="12" fill="#6b7280">Одновібратор (t_ref)</text>

  <rect x="35" y="214" width="12" height="12" rx="2" fill="#7c3aed"/>
  <text x="54" y="225" font-size="13" font-weight="bold" fill="#1a1a1a">V_C (Заряд C_ref)</text>
  <text x="54" y="241" font-size="12" fill="#6b7280">R_pot · C_ref таймер</text>

  <rect x="35" y="276" width="12" height="12" rx="2" fill="#c0392b"/>
  <text x="54" y="287" font-size="13" font-weight="bold" fill="#1a1a1a">Δt (Різниця та Deadband)</text>
  <text x="54" y="303" font-size="12" fill="#6b7280">Порівняння з t_db</text>

  <rect x="35" y="354" width="12" height="12" rx="2" fill="#27ae60"/>
  <text x="54" y="365" font-size="13" font-weight="bold" fill="#1a1a1a">V_out (Вихід драйвера)</text>
  <text x="54" y="381" font-size="12" fill="#6b7280">Імпульс моста (t_out)</text>

  <rect x="250" y="70" width="685" height="380" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <line x1="310" y1="75" x2="310" y2="412" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="540" y1="75" x2="540" y2="412" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="595" y1="75" x2="595" y2="412" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="770" y1="75" x2="770" y2="412" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="880" y1="75" x2="880" y2="412" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="540" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">t_in (тривалість вхідного імпульсу)</text>
  <line x1="310" y1="90" x2="770" y2="90" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue-left)" marker-end="url(#arr-blue-right)"/>
  <rect x="310" y="100" width="460" height="26" fill="#eaf0fd" opacity="0.5"/>
  <path d="M 260,126 L 310,126 L 310,100 L 770,100 L 770,126 L 910,126" stroke="#2457d6" stroke-width="2.5" fill="none"/>

  <text x="425" y="144" text-anchor="middle" font-size="12" font-weight="bold" fill="#d97706">t_ref = k · R_pot · C_ref</text>
  <line x1="310" y1="150" x2="540" y2="150" stroke="#d97706" stroke-width="1.5" marker-start="url(#arr-amber-left)" marker-end="url(#arr-amber-right)"/>
  <rect x="310" y="160" width="230" height="26" fill="#fef3c7" opacity="0.5"/>
  <path d="M 260,186 L 310,186 L 310,160 L 540,160 L 540,186 L 910,186" stroke="#d97706" stroke-width="2.5" fill="none"/>

  <line x1="260" y1="210" x2="910" y2="210" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="305" y="206" text-anchor="end" font-size="11" fill="#6b7280">V_th</text>
  <path d="M 260,240 L 310,240 L 540,210 L 540,240 L 910,240" stroke="#7c3aed" stroke-width="2.5" fill="none"/>

  <text x="655" y="258" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Δt = t_in - t_ref</text>
  <line x1="540" y1="264" x2="770" y2="264" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-red-left)" marker-end="url(#arr-red-right)"/>
  <rect x="540" y="274" width="55" height="26" fill="#fee2e2" stroke="#fca5a5" stroke-dasharray="2,2"/>
  <rect x="595" y="274" width="175" height="26" fill="#fdecea" opacity="0.6"/>
  <path d="M 260,300 L 540,300 L 540,274 L 770,274 L 770,300 L 910,300" stroke="#c0392b" stroke-width="2.5" fill="none"/>
  <text x="682.5" y="291" text-anchor="middle" font-size="11" fill="#c0392b">Активна помилка (Δt - t_db)</text>
  <line x1="540" y1="312" x2="595" y2="312" stroke="#c0392b" stroke-width="1.2" marker-start="url(#arr-red-left)" marker-end="url(#arr-red-right)"/>
  <text x="567.5" y="324" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">t_db</text>

  <text x="737.5" y="342" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">t_out = k_exp · (Δt - t_db)</text>
  <line x1="595" y1="348" x2="880" y2="348" stroke="#27ae60" stroke-width="1.5" marker-start="url(#arr-green-left)" marker-end="url(#arr-green-right)"/>
  <rect x="595" y="358" width="285" height="26" fill="#e9f7ef" opacity="0.6"/>
  <path d="M 260,384 L 595,384 L 595,358 L 880,358 L 880,384 L 910,384" stroke="#27ae60" stroke-width="2.5" fill="none"/>

  <line x1="250" y1="412" x2="925" y2="412" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-main)"/>
  <text x="925" y="404" text-anchor="end" font-size="11" font-weight="bold" fill="#1a1a1a">Час (t)</text>

  <line x1="310" y1="408" x2="310" y2="416" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="310" y="429" text-anchor="middle" font-size="11" fill="#6b7280">t = 0</text>

  <line x1="540" y1="408" x2="540" y2="416" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="540" y="429" text-anchor="middle" font-size="11" fill="#6b7280">t_ref</text>

  <line x1="595" y1="408" x2="595" y2="416" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="595" y="429" text-anchor="middle" font-size="11" fill="#6b7280">t_ref + t_db</text>

  <line x1="770" y1="408" x2="770" y2="416" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="770" y="429" text-anchor="middle" font-size="11" fill="#6b7280">t_in</text>

  <line x1="880" y1="408" x2="880" y2="416" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="880" y="429" text-anchor="middle" font-size="11" fill="#6b7280">t_end</text>

  <rect x="25" y="466" width="910" height="50" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <circle cx="45" cy="491" r="4" fill="#2457d6"/>
  <text x="56" y="486" font-size="12" font-weight="bold" fill="#1a1a1a">Умова рівноваги:</text>
  <text x="56" y="502" font-size="12" fill="#6b7280">При t_in = t_ref вал нерухомий</text>

  <circle cx="335" cy="491" r="4" fill="#c0392b"/>
  <text x="346" y="486" font-size="12" font-weight="bold" fill="#1a1a1a">Зона нечутливості (t_db):</text>
  <text x="346" y="502" font-size="12" fill="#6b7280">При |Δt| ≤ t_db вихід заблоковано</text>

  <circle cx="650" cy="491" r="4" fill="#27ae60"/>
  <text x="661" y="486" font-size="12" font-weight="bold" fill="#1a1a1a">Силовий імпульс t_out:</text>
  <text x="661" y="502" font-size="12" fill="#6b7280">Розширення t_out долає тертя</text>
</svg>
