<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Markers for arrows -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема підключення зовнішніх MOSFET до мікросхеми AA5188</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Розв'язка затворів R_G та схеми затримки блокують наскрізні струми H-моста</text>

  <!-- PANEL 1: AA5188 IC -->
  <rect x="20" y="75" width="210" height="460" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="125" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Мікросхема AA5188</text>
  <text x="125" y="116" text-anchor="middle" font-size="12" fill="#6b7280">(Аналоговий драйвер)</text>

  <!-- IC Core Box -->
  <rect x="32" y="130" width="186" height="390" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="125" y="152" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Внутрішня логіка керування</text>

  <!-- Dead-Time Module Box inside IC -->
  <rect x="35" y="270" width="180" height="54" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="125" y="290" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Модуль затримки Dead-Time</text>
  <text x="125" y="310" text-anchor="middle" font-size="12" fill="#6b7280">t_dt ≥ 1.5 мкс (пауза)</text>

  <!-- Internal Connections to Dead-Time Box -->
  <line x1="125" y1="160" x2="125" y2="270" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="125" y1="324" x2="125" y2="395" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- IC Output Pins & Labels -->
  <!-- OUT1_P -->
  <line x1="190" y1="180" x2="230" y2="180" stroke="#2457d6" stroke-width="2"/>
  <circle cx="218" cy="180" r="3" fill="#2457d6"/>
  <text x="185" y="174" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">OUT1_P</text>

  <!-- OUT2_P -->
  <line x1="190" y1="240" x2="230" y2="240" stroke="#2457d6" stroke-width="2"/>
  <circle cx="218" cy="240" r="3" fill="#2457d6"/>
  <text x="185" y="234" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">OUT2_P</text>

  <!-- OUT1_N -->
  <line x1="190" y1="410" x2="230" y2="410" stroke="#2457d6" stroke-width="2"/>
  <circle cx="218" cy="410" r="3" fill="#2457d6"/>
  <text x="185" y="404" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">OUT1_N</text>

  <!-- OUT2_N -->
  <line x1="190" y1="470" x2="230" y2="470" stroke="#2457d6" stroke-width="2"/>
  <circle cx="218" cy="470" r="3" fill="#2457d6"/>
  <text x="185" y="464" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">OUT2_N</text>

  <!-- PANEL 2: GATE DRIVER & PROTECTION -->
  <rect x="250" y="75" width="310" height="460" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="405" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Коло затворів та розв'язки</text>
  <text x="405" y="116" text-anchor="middle" font-size="12" fill="#6b7280">(Організація швидкого вимкнення)</text>

  <!-- Protection Callout Box in Panel 2 -->
  <rect x="265" y="295" width="280" height="50" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="405" y="314" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Захист від наскрізного струму:</text>
  <text x="405" y="334" text-anchor="middle" font-size="12" fill="#1a1a1a">t_off &lt; t_on (діоди VD прискорюють розряд)</text>

  <!-- LINE 1: OUT1_P to Gate VT1 (Y=180) -->
  <line x1="230" y1="180" x2="300" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Resistor R_G1 -->
  <rect x="300" y="173" width="40" height="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="320" y="165" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">R_G1</text>
  <line x1="340" y1="180" x2="652" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Parallel Diode VD_D1 above R_G1 -->
  <line x1="285" y1="180" x2="285" y2="148" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="285" y1="148" x2="355" y2="148" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="355" y1="148" x2="355" y2="180" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="285" cy="180" r="2.5" fill="#1a1a1a"/>
  <circle cx="355" cy="180" r="2.5" fill="#1a1a1a"/>
  <!-- Diode Symbol VD_D1 -->
  <polygon points="325,148 315,142 315,154" fill="#27ae60"/>
  <line x1="325" y1="142" x2="325" y2="154" stroke="#27ae60" stroke-width="1.5"/>
  <text x="320" y="136" text-anchor="middle" font-size="12" fill="#27ae60">VD_D1</text>

  <!-- Pull-up R_PU1 to VCC_POWER (X=430) -->
  <circle cx="430" cy="180" r="2.5" fill="#1a1a1a"/>
  <line x1="430" y1="138" x2="430" y2="150" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="423" y="150" width="14" height="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="430" y1="170" x2="430" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="445" y="164" text-anchor="start" font-size="12" fill="#1a1a1a">R_PU1</text>

  <!-- LINE 2: OUT2_P to Gate VT3 (Y=240) -->
  <line x1="230" y1="240" x2="300" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Resistor R_G3 -->
  <rect x="300" y="233" width="40" height="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="320" y="225" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">R_G3</text>
  <line x1="340" y1="240" x2="852" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Parallel Diode VD_D3 below R_G3 -->
  <line x1="285" y1="240" x2="285" y2="268" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="285" y1="268" x2="355" y2="268" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="355" y1="268" x2="355" y2="240" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="285" cy="240" r="2.5" fill="#1a1a1a"/>
  <circle cx="355" cy="240" r="2.5" fill="#1a1a1a"/>
  <!-- Diode Symbol VD_D3 -->
  <polygon points="325,268 315,262 315,274" fill="#27ae60"/>
  <line x1="325" y1="262" x2="325" y2="274" stroke="#27ae60" stroke-width="1.5"/>
  <text x="320" y="288" text-anchor="middle" font-size="12" fill="#27ae60">VD_D3</text>

  <!-- Pull-up R_PU2 to VCC_POWER (X=500) -->
  <circle cx="500" cy="240" r="2.5" fill="#1a1a1a"/>
  <line x1="500" y1="138" x2="500" y2="190" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="493" y="190" width="14" height="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="500" y1="210" x2="500" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="515" y="204" text-anchor="start" font-size="12" fill="#1a1a1a">R_PU2</text>

  <!-- LINE 3: OUT1_N to Gate VT2 (Y=410) -->
  <line x1="230" y1="410" x2="300" y2="410" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Resistor R_G2 -->
  <rect x="300" y="403" width="40" height="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="320" y="395" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">R_G2</text>
  <line x1="340" y1="410" x2="652" y2="410" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Parallel Diode VD_D2 above R_G2 -->
  <line x1="285" y1="410" x2="285" y2="372" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="285" y1="372" x2="355" y2="372" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="355" y1="372" x2="355" y2="410" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="285" cy="410" r="2.5" fill="#1a1a1a"/>
  <circle cx="355" cy="410" r="2.5" fill="#1a1a1a"/>
  <!-- Diode Symbol VD_D2 -->
  <polygon points="315,372 325,366 325,378" fill="#27ae60"/>
  <line x1="315" y1="366" x2="315" y2="378" stroke="#27ae60" stroke-width="1.5"/>
  <text x="320" y="362" text-anchor="middle" font-size="12" fill="#27ae60">VD_D2</text>

  <!-- Pull-down R_PD1 to GND (X=430) -->
  <circle cx="430" cy="410" r="2.5" fill="#1a1a1a"/>
  <line x1="430" y1="410" x2="430" y2="430" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="423" y="430" width="14" height="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="430" y1="450" x2="430" y2="520" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="445" y="444" text-anchor="start" font-size="12" fill="#1a1a1a">R_PD1</text>

  <!-- LINE 4: OUT2_N to Gate VT4 (Y=470) -->
  <line x1="230" y1="470" x2="300" y2="470" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Resistor R_G4 -->
  <rect x="300" y="463" width="40" height="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="320" y="455" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">R_G4</text>
  <line x1="340" y1="470" x2="852" y2="470" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Parallel Diode VD_D4 below R_G4 -->
  <line x1="285" y1="470" x2="285" y2="498" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="285" y1="498" x2="355" y2="498" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="355" y1="498" x2="355" y2="470" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="285" cy="470" r="2.5" fill="#1a1a1a"/>
  <circle cx="355" cy="470" r="2.5" fill="#1a1a1a"/>
  <!-- Diode Symbol VD_D4 -->
  <polygon points="315,498 325,492 325,504" fill="#27ae60"/>
  <line x1="315" y1="492" x2="315" y2="504" stroke="#27ae60" stroke-width="1.5"/>
  <text x="320" y="518" text-anchor="middle" font-size="12" fill="#27ae60">VD_D4</text>

  <!-- Pull-down R_PD2 to GND (X=500) -->
  <circle cx="500" cy="470" r="2.5" fill="#1a1a1a"/>
  <line x1="500" y1="470" x2="500" y2="485" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="493" y="485" width="14" height="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="500" y1="505" x2="500" y2="520" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="515" y="499" text-anchor="start" font-size="12" fill="#1a1a1a">R_PD2</text>

  <!-- PANEL 3: POWER MOSFET H-BRIDGE & MOTOR -->
  <rect x="580" y="75" width="360" height="460" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="760" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Силовий H-міст MOSFET</text>
  <text x="760" y="116" text-anchor="middle" font-size="12" fill="#6b7280">(Потужне навантаження сервоприводу)</text>

  <!-- VCC Power Rail (+12V...+24V) -->
  <line x1="420" y1="138" x2="910" y2="138" stroke="#c0392b" stroke-width="2.5"/>
  <text x="760" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">V_CC_POWER (+12V...+24V)</text>

  <!-- GND Ground Rail -->
  <line x1="420" y1="520" x2="910" y2="520" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="760" y="512" text-anchor="middle" font-size="12" fill="#6b7280">GND (Силовий мінус)</text>

  <!-- LEFT LEG (Arm A): VT1 (P-MOS) and VT2 (N-MOS) at X=660 -->

  <!-- VT1 (P-channel MOSFET) at X=660, Y=180 -->
  <!-- Source to VCC -->
  <line x1="660" y1="138" x2="660" y2="165" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="660" cy="138" r="3" fill="#c0392b"/>
  <!-- Gate line connection -->
  <line x1="652" y1="165" x2="652" y2="195" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="656" y1="165" x2="656" y2="195" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="656" y1="165" x2="660" y2="165" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="656" y1="195" x2="660" y2="195" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Drain down to Node A (Y=330) -->
  <line x1="660" y1="195" x2="660" y2="330" stroke="#1a1a1a" stroke-width="2"/>

  <!-- VT1 Label (Left of transistor) -->
  <text x="645" y="162" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">VT1</text>
  <text x="645" y="174" text-anchor="end" font-size="12" fill="#6b7280">(P-MOS)</text>

  <!-- Body Diode VD1 for VT1 -->
  <line x1="675" y1="165" x2="675" y2="195" stroke="#6b7280" stroke-width="1"/>
  <line x1="660" y1="165" x2="675" y2="165" stroke="#6b7280" stroke-width="1"/>
  <line x1="660" y1="195" x2="675" y2="195" stroke="#6b7280" stroke-width="1"/>
  <polygon points="675,165 669,177 681,177" fill="#6b7280"/>
  <line x1="669" y1="165" x2="681" y2="165" stroke="#6b7280" stroke-width="1.5"/>
  <text x="688" y="184" font-size="12" fill="#6b7280">VD1</text>

  <!-- VT2 (N-channel MOSFET) at X=660, Y=410 -->
  <!-- Drain up to Node A (Y=330) -->
  <line x1="660" y1="330" x2="660" y2="395" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Gate line connection -->
  <line x1="652" y1="395" x2="652" y2="425" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="656" y1="395" x2="656" y2="425" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="656" y1="395" x2="660" y2="395" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="656" y1="425" x2="660" y2="425" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Source down to GND -->
  <line x1="660" y1="425" x2="660" y2="520" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="660" cy="520" r="3" fill="#1a1a1a"/>

  <!-- VT2 Label (Left of transistor) -->
  <text x="645" y="392" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">VT2</text>
  <text x="645" y="404" text-anchor="end" font-size="12" fill="#6b7280">(N-MOS)</text>

  <!-- Body Diode VD2 for VT2 -->
  <line x1="675" y1="395" x2="675" y2="425" stroke="#6b7280" stroke-width="1"/>
  <line x1="660" y1="395" x2="675" y2="395" stroke="#6b7280" stroke-width="1"/>
  <line x1="660" y1="425" x2="675" y2="425" stroke="#6b7280" stroke-width="1"/>
  <polygon points="675,395 669,407 681,407" fill="#6b7280"/>
  <line x1="669" y1="395" x2="681" y2="395" stroke="#6b7280" stroke-width="1.5"/>
  <text x="688" y="414" font-size="12" fill="#6b7280">VD2</text>

  <!-- RIGHT LEG (Arm B): VT3 (P-MOS) and VT4 (N-MOS) at X=860 -->

  <!-- VT3 (P-channel MOSFET) at X=860, Y=240 -->
  <!-- Source to VCC -->
  <line x1="860" y1="138" x2="860" y2="225" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="860" cy="138" r="3" fill="#c0392b"/>
  <!-- Gate line connection -->
  <line x1="852" y1="225" x2="852" y2="255" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="856" y1="225" x2="856" y2="255" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="856" y1="225" x2="860" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="856" y1="255" x2="860" y2="255" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Drain down to Node B (Y=330) -->
  <line x1="860" y1="255" x2="860" y2="330" stroke="#1a1a1a" stroke-width="2"/>

  <!-- VT3 Label (Right of transistor) -->
  <text x="875" y="222" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">VT3</text>
  <text x="875" y="234" text-anchor="start" font-size="12" fill="#6b7280">(P-MOS)</text>

  <!-- Body Diode VD3 for VT3 -->
  <line x1="845" y1="225" x2="845" y2="255" stroke="#6b7280" stroke-width="1"/>
  <line x1="845" y1="225" x2="860" y2="225" stroke="#6b7280" stroke-width="1"/>
  <line x1="845" y1="255" x2="860" y2="255" stroke="#6b7280" stroke-width="1"/>
  <polygon points="845,225 839,237 851,237" fill="#6b7280"/>
  <line x1="839" y1="225" x2="851" y2="225" stroke="#6b7280" stroke-width="1.5"/>
  <text x="832" y="244" text-anchor="end" font-size="12" fill="#6b7280">VD3</text>

  <!-- VT4 (N-channel MOSFET) at X=860, Y=470 -->
  <!-- Drain up to Node B (Y=330) -->
  <line x1="860" y1="330" x2="860" y2="455" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Gate line connection -->
  <line x1="852" y1="455" x2="852" y2="485" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="856" y1="455" x2="856" y2="485" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="856" y1="455" x2="860" y2="455" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="856" y1="485" x2="860" y2="485" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Source down to GND -->
  <line x1="860" y1="485" x2="860" y2="520" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="860" cy="520" r="3" fill="#1a1a1a"/>

  <!-- VT4 Label (Right of transistor) -->
  <text x="875" y="452" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">VT4</text>
  <text x="875" y="464" text-anchor="start" font-size="12" fill="#6b7280">(N-MOS)</text>

  <!-- Body Diode VD4 for VT4 -->
  <line x1="845" y1="455" x2="845" y2="485" stroke="#6b7280" stroke-width="1"/>
  <line x1="845" y1="455" x2="860" y2="455" stroke="#6b7280" stroke-width="1"/>
  <line x1="845" y1="485" x2="860" y2="485" stroke="#6b7280" stroke-width="1"/>
  <polygon points="845,455 839,467 851,467" fill="#6b7280"/>
  <line x1="839" y1="455" x2="851" y2="455" stroke="#6b7280" stroke-width="1.5"/>
  <text x="832" y="474" text-anchor="end" font-size="12" fill="#6b7280">VD4</text>

  <!-- CENTER MOTOR & CONNECTIONS -->
  <!-- Node A junction dot -->
  <circle cx="660" cy="330" r="3.5" fill="#2457d6"/>
  <!-- Line from Node A to Motor -->
  <line x1="660" y1="330" x2="734" y2="330" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Node B junction dot -->
  <circle cx="860" cy="330" r="3.5" fill="#2457d6"/>
  <!-- Line from Node B to Motor -->
  <line x1="860" y1="330" x2="786" y2="330" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Motor Circle -->
  <circle cx="760" cy="330" r="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="760" y="336" text-anchor="middle" font-size="18" font-weight="bold" fill="#2457d6">M</text>

  <!-- Motor Labels -->
