<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Підключення пін-у-пін: SPI + CE/CSN, і конденсатор на живленні</text>
<rect x="30.0" y="90.0" width="150.0" height="210.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.6"/><text x="105.0" y="141.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="105.0" dy="0.0">MCU 3.3 В</tspan><tspan x="105.0" dy="14.3"></tspan><tspan x="105.0" dy="14.3">3V3 →</tspan><tspan x="105.0" dy="14.3">GND →</tspan><tspan x="105.0" dy="14.3">SCK →</tspan><tspan x="105.0" dy="14.3">MOSI →</tspan><tspan x="105.0" dy="14.3">MISO →</tspan><tspan x="105.0" dy="14.3">GPIO → (CSN)</tspan><tspan x="105.0" dy="14.3">GPIO → (CE)</tspan></text>
<rect x="560.0" y="90.0" width="190.0" height="210.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="655.0" y="141.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="655.0" dy="0.0">nRF24-модуль</tspan><tspan x="655.0" dy="14.3"></tspan><tspan x="655.0" dy="14.3">VCC</tspan><tspan x="655.0" dy="14.3">GND</tspan><tspan x="655.0" dy="14.3">SCK</tspan><tspan x="655.0" dy="14.3">MOSI</tspan><tspan x="655.0" dy="14.3">MISO</tspan><tspan x="655.0" dy="14.3">CSN</tspan><tspan x="655.0" dy="14.3">CE</tspan></text>
<line x1="180.0" y1="128.0" x2="560.0" y2="128.0" stroke="#c0392b" stroke-width="1.8"/>
<text x="370.0" y="123.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="middle" font-weight="700">3V3 → VCC</text>
<line x1="180.0" y1="154.0" x2="560.0" y2="154.0" stroke="#1a1a1a" stroke-width="1.8"/>
<text x="370.0" y="149.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">GND → GND</text>
<line x1="180.0" y1="180.0" x2="560.0" y2="180.0" stroke="#2457d6" stroke-width="1.8"/>
<text x="370.0" y="175.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">SCK → SCK</text>
<line x1="180.0" y1="206.0" x2="560.0" y2="206.0" stroke="#2457d6" stroke-width="1.8"/>
<text x="370.0" y="201.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">MOSI → MOSI</text>
<line x1="180.0" y1="232.0" x2="560.0" y2="232.0" stroke="#2457d6" stroke-width="1.8"/>
<text x="370.0" y="227.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">MISO → MISO</text>
<line x1="180.0" y1="258.0" x2="560.0" y2="258.0" stroke="#8e44ad" stroke-width="1.8"/>
<text x="370.0" y="253.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8e44ad" text-anchor="middle" font-weight="700">GPIO → CSN</text>
<line x1="180.0" y1="284.0" x2="560.0" y2="284.0" stroke="#8e44ad" stroke-width="1.8"/>
<text x="370.0" y="279.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#8e44ad" text-anchor="middle" font-weight="700">GPIO → CE</text>
<line x1="520.0" y1="128.0" x2="520.0" y2="136.0" stroke="#c0392b" stroke-width="1.8"/>
<line x1="509.0" y1="136.0" x2="531.0" y2="136.0" stroke="#c0392b" stroke-width="2.6"/>
<line x1="509.0" y1="143.0" x2="531.0" y2="143.0" stroke="#c0392b" stroke-width="2.6"/>
<line x1="520.0" y1="143.0" x2="520.0" y2="154.0" stroke="#c0392b" stroke-width="1.8"/>
<text x="546.0" y="132.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#c0392b" text-anchor="start" font-weight="700">C 10 мкФ</text>
<rect x="30.0" y="330.0" width="350.0" height="78.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/><text x="205.0" y="351.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="205.0" dy="0.0">Пастка: у момент передачі PA+LNA-версія</tspan><tspan x="205.0" dy="14.3">рве до ~115 мА коротким піком. Тонке</tspan><tspan x="205.0" dy="14.3">живлення просідає → модуль «зникає»</tspan><tspan x="205.0" dy="14.3">або MCU скидається.</tspan></text>
<rect x="400.0" y="330.0" width="350.0" height="78.0" rx="6" fill="#fff8e1" stroke="#f0b429" stroke-width="1.2"/><text x="575.0" y="351.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="575.0" dy="0.0">Лік: конденсатор 10 мкФ (а біля PA+LNA —</tspan><tspan x="575.0" dy="14.3">100–220 мкФ) прямо на VCC/GND модуля</tspan><tspan x="575.0" dy="14.3">тримає напругу під час піку.</tspan><tspan x="575.0" dy="14.3">Живити від чистого 3.3 В.</tspan></text>
</svg>