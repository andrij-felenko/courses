<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4"
            orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
</defs>

<!-- Підкладка -->
<rect x="0" y="0" width="960" height="460" fill="white"/>

<!-- Заголовок і підзаголовок -->
<text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Підключення конектора U.FL до плати</text>
<text x="480" y="65" font-size="13" fill="#6b7280" text-anchor="middle">Перекіс під час монтажу призводить до згинання і зламу центрального контакту</text>

<!-- Ліва панель: Правильно -->
<rect x="40" y="90" width="420" height="330" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
<text x="250" y="125" font-size="16" font-weight="bold" fill="#27ae60" text-anchor="middle">Правильно: суворо вертикально</text>

<!-- Фонова вісь (ліворуч) -->
<path d="M 250 135 L 250 340" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>

<!-- Друкована плата (ліворуч) -->
<rect x="60" y="350" width="380" height="15" rx="2" fill="#d0d7de"/>
<text x="60" y="385" font-size="13" fill="#6b7280">Друкована плата (PCB)</text>

<!-- Розетка (ліворуч) -->
<rect x="200" y="340" width="100" height="10" rx="2" fill="#6b7280"/>
<rect x="200" y="280" width="15" height="60" rx="2" fill="#6b7280"/>
<rect x="285" y="280" width="15" height="60" rx="2" fill="#6b7280"/>

<!-- Центральний контакт (ліворуч) -->
<rect x="247" y="240" width="6" height="100" rx="3" fill="#2457d6"/>

<!-- Штекер U.FL (ліворуч) -->
<rect x="185" y="190" width="130" height="25" rx="4" fill="#1a1a1a"/>
<rect x="185" y="215" width="15" height="50" rx="2" fill="#1a1a1a"/>
<rect x="300" y="215" width="15" height="50" rx="2" fill="#1a1a1a"/>
<rect x="200" y="215" width="42" height="50" fill="#f4f6f8"/>
<rect x="258" y="215" width="42" height="50" fill="#f4f6f8"/>
<rect x="242" y="215" width="5" height="35" rx="1" fill="#2457d6"/>
<rect x="253" y="215" width="5" height="35" rx="1" fill="#2457d6"/>
<rect x="315" y="195" width="80" height="15" rx="2" fill="#1a1a1a"/>

<!-- Стрілка руху (ліворуч) -->
<path d="M 250 135 L 250 175" fill="none" stroke="#1a1a1a" stroke-width="3" marker-end="url(#arr)"/>

<!-- Підписи (ліворуч) -->
<text x="175" y="205" font-size="13" fill="#6b7280" text-anchor="end">Штекер U.FL</text>
<path d="M 180 201 L 185 201" fill="none" stroke="#6b7280" stroke-width="1"/>

<text x="175" y="276" font-size="13" fill="#6b7280" text-anchor="end">Центральний контакт</text>
<path d="M 180 272 L 246 272" fill="none" stroke="#6b7280" stroke-width="1"/>

<text x="175" y="345" font-size="13" fill="#6b7280" text-anchor="end">Розетка на платі</text>
<path d="M 180 341 L 200 341" fill="none" stroke="#6b7280" stroke-width="1"/>


<!-- Права панель: Неправильно -->
<rect x="500" y="90" width="420" height="330" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
<text x="710" y="125" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">Неправильно: з перекосом</text>

<!-- Фонова вісь (праворуч) -->
<path d="M 710 135 L 710 340" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="4 4" opacity="0.3"/>

<!-- Друкована плата (праворуч) -->
<rect x="520" y="350" width="380" height="15" rx="2" fill="#d0d7de"/>
<text x="520" y="385" font-size="13" fill="#6b7280">Друкована плата (PCB)</text>

<!-- Розетка (праворуч) -->
<rect x="660" y="340" width="100" height="10" rx="2" fill="#6b7280"/>
<rect x="660" y="280" width="15" height="60" rx="2" fill="#6b7280"/>
<rect x="745" y="280" width="15" height="60" rx="2" fill="#6b7280"/>

<!-- Центральний контакт (деформований) -->
<path d="M 710 340 L 710 300 Q 710 280 695 265" fill="none" stroke="#2457d6" stroke-width="6" stroke-linecap="round"/>

<!-- Штекер U.FL (з перекосом) -->
<g transform="rotate(15, 710, 230)">
    <path d="M 710 135 L 710 240" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="4 4" opacity="0.5"/>
    <rect x="645" y="190" width="130" height="25" rx="4" fill="#1a1a1a"/>
    <rect x="645" y="215" width="15" height="50" rx="2" fill="#1a1a1a"/>
    <rect x="760" y="215" width="15" height="50" rx="2" fill="#1a1a1a"/>
    <rect x="660" y="215" width="42" height="50" fill="#f4f6f8"/>
    <rect x="718" y="215" width="42" height="50" fill="#f4f6f8"/>
    <rect x="702" y="215" width="5" height="35" rx="1" fill="#2457d6"/>
    <rect x="713" y="215" width="5" height="35" rx="1" fill="#2457d6"/>
    <rect x="775" y="195" width="80" height="15" rx="2" fill="#1a1a1a"/>
    <path d="M 710 135 L 710 175" fill="none" stroke="#1a1a1a" stroke-width="3" marker-end="url(#arr)"/>
</g>

<!-- Акцент на деформації -->
<circle cx="698" cy="265" r="16" fill="none" stroke="#c0392b" stroke-width="3" stroke-dasharray="4 4"/>
<path d="M 775 265 L 714 265" fill="none" stroke="#c0392b" stroke-width="1"/>
<text x="780" y="260" font-size="14" fill="#c0392b" font-weight="bold">Деформація</text>
<text x="780" y="275" font-size="14" fill="#c0392b" font-weight="bold">контакту</text>

</svg>
