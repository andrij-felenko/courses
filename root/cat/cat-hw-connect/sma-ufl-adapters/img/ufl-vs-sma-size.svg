<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Порівняння розмірів роз'ємів U.FL та SMA</text>
  <text x="480" y="65" font-size="13" fill="#6b7280" text-anchor="middle">Зовнішнє гніздо SMA в рази більше за мікрокоаксіальний роз'єм U.FL на платі</text>

  <!-- Left block: U.FL on PCB -->
  <rect x="70" y="130" width="300" height="250" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="220" y="155" font-size="14" fill="#6b7280" text-anchor="middle">Друкована плата (PCB)</text>

  <rect x="197.5" y="227.5" width="45" height="45" rx="4" fill="#d0d7de" stroke="#6b7280" stroke-width="2"/>
  <circle cx="220" cy="250" r="15" fill="#eaf0fd" stroke="#2457d6" stroke-width="3"/>
  <circle cx="220" cy="250" r="3" fill="#1a1a1a"/>

  <text x="220" y="325" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">U.FL (IPEX / MHF)</text>
  <text x="220" y="355" font-size="14" fill="#6b7280" text-anchor="middle">Габарити: ~3 × 3 мм</text>

  <!-- Right block: SMA on Casing -->
  <rect x="570" y="90" width="340" height="340" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="740" y="115" font-size="14" fill="#6b7280" text-anchor="middle">Панель корпусу</text>

  <rect x="645" y="155" width="190" height="190" rx="8" fill="#d0d7de" stroke="#6b7280" stroke-width="2"/>
  <circle cx="670" cy="180" r="10" fill="#f4f6f8" stroke="#6b7280" stroke-width="2"/>
  <circle cx="810" cy="180" r="10" fill="#f4f6f8" stroke="#6b7280" stroke-width="2"/>
  <circle cx="670" cy="320" r="10" fill="#f4f6f8" stroke="#6b7280" stroke-width="2"/>
  <circle cx="810" cy="320" r="10" fill="#f4f6f8" stroke="#6b7280" stroke-width="2"/>

  <circle cx="740" cy="250" r="50" fill="#f4f6f8" stroke="#6b7280" stroke-width="3"/>
  <circle cx="740" cy="250" r="44" fill="none" stroke="#6b7280" stroke-width="1"/>
  <circle cx="740" cy="250" r="36" fill="white" stroke="#d0d7de" stroke-width="2"/>
  <circle cx="740" cy="250" r="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="3"/>

  <text x="740" y="380" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">SMA (гніздо)</text>
  <text x="740" y="410" font-size="14" fill="#6b7280" text-anchor="middle">Фланець: ~12.7 × 12.7 мм</text>

  <!-- Arrow between -->
  <path d="M 385,250 L 555,250" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="470" y="235" font-size="14" fill="#1a1a1a" text-anchor="middle">Пігтейл (адаптер)</text>
  <text x="470" y="275" font-size="13" fill="#6b7280" text-anchor="middle">Перехід від плати</text>
  <text x="470" y="305" font-size="13" fill="#6b7280" text-anchor="middle">до панелі корпусу</text>
</svg>
