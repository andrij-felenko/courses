<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="800" height="360" fill="white"/>

  <text x="400" y="40" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Монтаж роз'ємів SMA на друковану плату</text>
  <text x="400" y="60" font-size="13" text-anchor="middle" fill="#6b7280">Торцевий (Edge-Mount) та наскрізний (Through-Hole) способи встановлення</text>

  <text x="200" y="110" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Торцевий монтаж (Edge-Mount)</text>

  <path d="M60,216 h180 v8 h-180 Z" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="60" y1="216" x2="180" y2="216" stroke="#2457d6" stroke-width="2"/>

  <rect x="180" y="204" width="50" height="12" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="180" y="224" width="50" height="12" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="170" y="212" width="10" height="4" fill="#2457d6" stroke="#1a1a1a" stroke-width="1"/>
  <path d="M170,216 L180,216 L175,212 Z" fill="#6b7280"/>
  
  <rect x="230" y="188" width="30" height="64" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="260" y="198" width="30" height="44" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="264" y1="198" x2="264" y2="242" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="268" y1="198" x2="268" y2="242" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="272" y1="198" x2="272" y2="242" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="276" y1="198" x2="276" y2="242" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="280" y1="198" x2="280" y2="242" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="284" y1="198" x2="284" y2="242" stroke="#1a1a1a" stroke-width="1"/>

  <text x="180" y="150" font-size="13" text-anchor="middle" fill="#1a1a1a">Центральний контакт</text>
  <text x="180" y="166" font-size="13" text-anchor="middle" fill="#1a1a1a">припаяний до площинки</text>
  <line x1="180" y1="172" x2="175" y2="208" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="180" y="280" font-size="13" text-anchor="middle" fill="#1a1a1a">Заземлення обтискає</text>
  <text x="180" y="296" font-size="13" text-anchor="middle" fill="#1a1a1a">край плати</text>
  <line x1="180" y1="260" x2="195" y2="238" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="600" y="110" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Наскрізний монтаж (Through-Hole)</text>

  <path d="M440,216 h180 v8 h-180 Z" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="440" y1="216" x2="598" y2="216" stroke="#2457d6" stroke-width="2"/>

  <path d="M584,216 h6 v8 h-6 Z" fill="white"/>
  <path d="M597,216 h6 v8 h-6 Z" fill="white"/>
  <path d="M610,216 h6 v8 h-6 Z" fill="white"/>

  <path d="M585,216 h4 v18 h-4 Z" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1"/>
  <path d="M611,216 h4 v18 h-4 Z" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1"/>
  <path d="M598,216 h4 v18 h-4 Z" fill="#2457d6" stroke="#1a1a1a" stroke-width="1"/>

  <polygon points="582,224 592,224 587,230" fill="#6b7280"/>
  <polygon points="595,224 605,224 600,230" fill="#6b7280"/>
  <polygon points="608,224 618,224 613,230" fill="#6b7280"/>

  <rect x="580" y="168" width="40" height="48" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="620" y="174" width="30" height="36" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="624" y1="174" x2="624" y2="210" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="628" y1="174" x2="628" y2="210" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="632" y1="174" x2="632" y2="210" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="636" y1="174" x2="636" y2="210" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="640" y1="174" x2="640" y2="210" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="644" y1="174" x2="644" y2="210" stroke="#1a1a1a" stroke-width="1"/>

  <text x="500" y="146" font-size="13" text-anchor="middle" fill="#1a1a1a">Корпус спирається</text>
  <text x="500" y="162" font-size="13" text-anchor="middle" fill="#1a1a1a">на поверхню плати</text>
  <line x1="500" y1="168" x2="576" y2="185" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="500" y="280" font-size="13" text-anchor="middle" fill="#1a1a1a">Виводи проходять</text>
  <text x="500" y="296" font-size="13" text-anchor="middle" fill="#1a1a1a">крізь отвори</text>
  <line x1="500" y1="262" x2="581" y2="230" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

</svg>
