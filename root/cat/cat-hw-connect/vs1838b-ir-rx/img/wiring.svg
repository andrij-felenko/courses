<rect x="129.5" y="387.4" width="741.0" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="500.0" y="406.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">OUT іде на БУДЬ-ЯКИЙ цифровий пін — усередині вже стоїть підтяжка, вихід чистий, зовнішніх деталей не треба.</tspan><tspan x="500.0" dy="14.3">Живлення бери під логіку плати: ESP32 — 3.3 В. Переплутаєш VCC і GND — мікросхема гріється й гине, звір орієнтацію.</tspan></text>
