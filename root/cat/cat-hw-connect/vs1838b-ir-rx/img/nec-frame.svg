<line x1="222.0" y1="260.0" x2="366.0" y2="260.0" stroke="#27ae60" stroke-width="1.4"/>
<line x1="222.0" y1="254.0" x2="222.0" y2="260.0" stroke="#27ae60" stroke-width="1.4"/>
