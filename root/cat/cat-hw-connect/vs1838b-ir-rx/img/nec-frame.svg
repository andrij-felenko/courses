<text x="294.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">далі 32 біти: КОЖЕН = LOW 560 мкс + пауза (560 = 0, 1690 = 1)</text>
<rect x="139.5" y="303.1" width="321.0" height="73.9" rx="6" fill="#eaf5ec" stroke="#27ae60" stroke-width="1.5"/><text x="300.0" y="322.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="300.0" dy="0.0">Провал (LOW) у КОЖНОГО біта однаковий — 560 мкс.</tspan><tspan x="300.0" dy="14.3">Значення несе ПАУЗА після нього:</tspan><tspan x="300.0" dy="14.3">  560 мкс тиші  → нуль</tspan><tspan x="300.0" dy="14.3">  1690 мкс тиші → одиниця</tspan></text>
<rect x="622.7" y="303.1" width="314.7" height="73.9" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="780.0" y="322.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="780.0" dy="0.0">Вихід ІНВЕРТОВАНИЙ: «є світло» = 0, «тиша» = 1.</tspan><tspan x="780.0" dy="14.3">Тому старт — це ДОВГИЙ ПРОВАЛ у нуль (9 мс),</tspan><tspan x="780.0" dy="14.3">а не імпульс угору. Декодер, що чекає фронту</tspan><tspan x="780.0" dy="14.3">вгору, не побачить нічого.</tspan></text>
<rect x="166.3" y="447.4" width="747.3" height="45.3" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/><text x="540.0" y="466.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="540.0" dy="0.0">Повний кадр = преамбула + 8 біт адреси + 8 біт ~адреси + 8 біт команди + 8 біт ~команди (усе молодшим бітом уперед),</tspan><tspan x="540.0" dy="14.3">і завершальний короткий LOW 560 мкс. Інверсні байти — це вбудована перевірка: адреса XOR ~адреси має дати 0xFF.</tspan></text>
</svg>