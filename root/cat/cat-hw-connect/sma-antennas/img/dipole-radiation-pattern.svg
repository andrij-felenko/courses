<svg viewBox="0 0 960 460" width="960" height="460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Діаграма направленості штирьової антени</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Форма тора: максимальний сигнал перпендикулярно до осі, мінімальний — уздовж осі</text>

  <!-- Antenna (Top half, visible) -->
  <line x1="480" y1="120" x2="480" y2="292" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>

  <!-- Torus (Radiation Pattern) -->
  <g fill="#eaf0fd" fill-rule="evenodd" stroke="#2457d6" stroke-width="2">
    <path d="M 280 260 A 200 80 0 0 1 680 260 A 200 80 0 0 1 280 260 M 400 260 A 80 32 0 0 0 560 260 A 80 32 0 0 0 400 260" />
  </g>

  <!-- Torus Equator for 3D effect -->
  <ellipse cx="480" cy="260" rx="140" ry="56" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.6"/>

  <!-- Antenna (Hidden part inside the torus front) -->
  <line x1="480" y1="292" x2="480" y2="340" stroke="#1a1a1a" stroke-width="8" stroke-dasharray="6,4"/>

  <!-- Antenna (Bottom part, visible) -->
  <line x1="480" y1="340" x2="480" y2="400" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round"/>

  <!-- SMA Connector at the base -->
  <rect x="472" y="400" width="16" height="20" fill="#d0d7de" stroke="#1a1a1a" stroke-width="2" rx="2"/>
  <rect x="475" y="420" width="10" height="8" fill="#d0d7de" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="472" y1="405" x2="488" y2="405" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="472" y1="410" x2="488" y2="410" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="472" y1="415" x2="488" y2="415" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Max Radiation Arrows -->
  <line x1="680" y1="260" x2="760" y2="260" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>
  <line x1="280" y1="260" x2="200" y2="260" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>

  <!-- Max radiation label (Left) -->
  <text x="180" y="245" font-size="14" fill="#2457d6" text-anchor="end">Напрямок</text>
  <text x="180" y="265" font-size="14" fill="#2457d6" text-anchor="end">максимального</text>
  <text x="180" y="285" font-size="14" fill="#2457d6" text-anchor="end">випромінювання</text>

  <!-- Max radiation label (Right) -->
  <text x="770" y="265" font-size="14" fill="#2457d6" text-anchor="start">Максимум</text>

  <!-- Label: Antenna -->
  <text x="320" y="140" font-size="14" fill="#1a1a1a" text-anchor="end">Штирьова антена</text>
  <line x1="330" y1="136" x2="470" y2="160" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Label: Minimum Radiation -->
  <text x="600" y="130" font-size="14" fill="#c0392b" text-anchor="start">Мінімум (нуль)</text>
  <text x="600" y="150" font-size="14" fill="#c0392b" text-anchor="start">випромінювання</text>
  <line x1="590" y1="136" x2="490" y2="125" stroke="#c0392b" stroke-width="1" marker-end="url(#arr-red)"/>

  <!-- Label: Torus -->
  <text x="700" y="210" font-size="14" fill="#1a1a1a" text-anchor="start">Тривимірна діаграма</text>
  <text x="700" y="230" font-size="14" fill="#1a1a1a" text-anchor="start">направленості (тор)</text>
  <line x1="690" y1="216" x2="640" y2="236" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Label: SMA -->
  <text x="420" y="420" font-size="14" fill="#1a1a1a" text-anchor="end">SMA-роз'єм</text>
  <line x1="430" y1="416" x2="465" y2="416" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr)"/>
</svg>
