<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <text x="480" y="35" font-weight="bold" font-size="18" fill="#1a1a1a" text-anchor="middle">Роз'єми SMA та RP-SMA</text>
  <text x="480" y="55" font-size="13" fill="#6b7280" text-anchor="middle">Різниця між вилками та розетками: розташування різьби та форма центрального контакту</text>

  <!-- Panel 1: SMA-вилка -->
  <rect x="40" y="70" width="420" height="170" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="250" y="95" font-weight="bold" font-size="14" fill="#1a1a1a" text-anchor="middle">SMA-вилка (Male)</text>
  
  <rect x="60" y="140" width="60" height="40" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="120" y1="135" x2="120" y2="185" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="120" y="120" width="80" height="15" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="120" y="185" width="80" height="15" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="120" y="145" width="50" height="30" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="120" y="148" width="50" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 100 157 h 80 v 6 h -80 Z" fill="#2457d6"/>
  <polygon points="180,157 186,160 180,163" fill="#2457d6"/>
  
  <path d="M 130 135 v 3 M 140 135 v 3 M 150 135 v 3 M 160 135 v 3 M 170 135 v 3 M 180 135 v 3 M 190 135 v 3" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 130 185 v -3 M 140 185 v -3 M 150 185 v -3 M 160 185 v -3 M 170 185 v -3 M 180 185 v -3 M 190 185 v -3" stroke="#1a1a1a" stroke-width="2"/>
  
  <text x="290" y="130" font-size="13" fill="#6b7280" text-anchor="start">Внутрішня різьба</text>
  <line x1="285" y1="126" x2="202" y2="126" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  
  <text x="290" y="164" font-size="13" fill="#2457d6" font-weight="bold" text-anchor="start">Штир (Pin)</text>
  <line x1="285" y1="160" x2="188" y2="160" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Panel 2: SMA-розетка -->
  <rect x="500" y="70" width="420" height="170" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="710" y="95" font-weight="bold" font-size="14" fill="#1a1a1a" text-anchor="middle">SMA-розетка (Female)</text>
  
  <rect x="520" y="140" width="60" height="40" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="580" y="136" width="60" height="48" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="580" y="140" width="60" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 550 154 h 75 v 12 h -75 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <line x1="590" y1="160" x2="620" y2="160" stroke="#2457d6" stroke-width="2"/>
  
  <path d="M 590 136 v -3 M 600 136 v -3 M 610 136 v -3 M 620 136 v -3 M 630 136 v -3" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 590 184 v 3 M 600 184 v 3 M 610 184 v 3 M 620 184 v 3 M 630 184 v 3" stroke="#1a1a1a" stroke-width="2"/>
  
  <text x="750" y="130" font-size="13" fill="#6b7280" text-anchor="start">Зовнішня різьба</text>
  <line x1="745" y1="126" x2="630" y2="126" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  
  <text x="750" y="164" font-size="13" fill="#2457d6" font-weight="bold" text-anchor="start">Гніздо (Receptacle)</text>
  <line x1="745" y1="160" x2="627" y2="160" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Panel 3: RP-SMA-вилка -->
  <rect x="40" y="250" width="420" height="170" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="250" y="275" font-weight="bold" font-size="14" fill="#1a1a1a" text-anchor="middle">RP-SMA-вилка (Male)</text>
  
  <rect x="60" y="320" width="60" height="40" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="120" y1="315" x2="120" y2="365" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="120" y="300" width="80" height="15" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="120" y="365" width="80" height="15" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="120" y="325" width="50" height="30" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="120" y="328" width="50" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 90 334 h 75 v 12 h -75 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <line x1="130" y1="340" x2="160" y2="340" stroke="#2457d6" stroke-width="2"/>
  
  <path d="M 130 315 v 3 M 140 315 v 3 M 150 315 v 3 M 160 315 v 3 M 170 315 v 3 M 180 315 v 3 M 190 315 v 3" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 130 365 v -3 M 140 365 v -3 M 150 365 v -3 M 160 365 v -3 M 170 365 v -3 M 180 365 v -3 M 190 365 v -3" stroke="#1a1a1a" stroke-width="2"/>
  
  <text x="290" y="310" font-size="13" fill="#6b7280" text-anchor="start">Внутрішня різьба</text>
  <line x1="285" y1="306" x2="202" y2="306" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  
  <text x="290" y="344" font-size="13" fill="#2457d6" font-weight="bold" text-anchor="start">Гніздо (Receptacle)</text>
  <line x1="285" y1="340" x2="167" y2="340" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Panel 4: RP-SMA-розетка -->
  <rect x="500" y="250" width="420" height="170" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="710" y="275" font-weight="bold" font-size="14" fill="#1a1a1a" text-anchor="middle">RP-SMA-розетка (Female)</text>
  
  <rect x="520" y="320" width="60" height="40" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="580" y="316" width="60" height="48" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="580" y="320" width="60" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 550 337 h 80 v 6 h -80 Z" fill="#2457d6"/>
  <polygon points="630,337 636,340 630,343" fill="#2457d6"/>
  
  <path d="M 590 316 v -3 M 600 316 v -3 M 610 316 v -3 M 620 316 v -3 M 630 316 v -3" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 590 364 v 3 M 600 364 v 3 M 610 364 v 3 M 620 364 v 3 M 630 364 v 3" stroke="#1a1a1a" stroke-width="2"/>
  
  <text x="750" y="310" font-size="13" fill="#6b7280" text-anchor="start">Зовнішня різьба</text>
  <line x1="745" y1="306" x2="630" y2="306" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  
  <text x="750" y="344" font-size="13" fill="#2457d6" font-weight="bold" text-anchor="start">Штир (Pin)</text>
  <line x1="745" y1="340" x2="638" y2="340" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
</svg>
