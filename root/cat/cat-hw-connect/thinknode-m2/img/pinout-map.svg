<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>
  
  <text x="480" y="40" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">ThinkNode M2: Карта зовнішніх роз'ємів</text>
  <text x="480" y="65" font-size="13" text-anchor="middle" fill="#6b7280">Призначення виводів, доступні інтерфейси та внутрішні конфлікти</text>
  
  <!-- Основна плата -->
  <rect x="360" y="120" width="240" height="360" rx="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  
  <!-- Лівий роз'єм (Pins) -->
  <rect x="364" y="155" width="16" height="10" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="364" y="185" width="16" height="10" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="364" y="215" width="16" height="10" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="364" y="245" width="16" height="10" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="364" y="275" width="16" height="10" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="364" y="305" width="16" height="10" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="364" y="335" width="16" height="10" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="364" y="365" width="16" height="10" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="364" y="395" width="16" height="10" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="364" y="425" width="16" height="10" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Підписи лівого роз'єму -->
  <text x="330" y="165" font-size="14" text-anchor="end" fill="#c0392b">5V (Вхід живлення)</text>
  <text x="330" y="195" font-size="14" text-anchor="end" fill="#c0392b">3.3V (Вихід)</text>
  <text x="330" y="225" font-size="14" text-anchor="end" fill="#1a1a1a">GND</text>
  <text x="330" y="255" font-size="14" text-anchor="end" fill="#2457d6">IO4 (ADC / GPIO)</text>
  <text x="330" y="285" font-size="14" text-anchor="end" fill="#2457d6">IO5 (ADC / GPIO)</text>
  <text x="330" y="315" font-size="14" text-anchor="end" fill="#2457d6">IO6 (ADC / GPIO)</text>
  <text x="330" y="345" font-size="14" text-anchor="end" fill="#2457d6">IO7 (ADC / GPIO)</text>
  <text x="330" y="375" font-size="14" text-anchor="end" fill="#27ae60">IO15 (Вільний GPIO)</text>
  <text x="330" y="405" font-size="14" text-anchor="end" fill="#27ae60">IO16 (Вільний GPIO)</text>
  <text x="330" y="435" font-size="14" text-anchor="end" fill="#27ae60">IO17 (Вільний GPIO)</text>

  <!-- Правий роз'єм (Pins) -->
  <rect x="580" y="155" width="16" height="10" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="580" y="185" width="16" height="10" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="580" y="215" width="16" height="10" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="580" y="245" width="16" height="10" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="580" y="275" width="16" height="10" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="580" y="305" width="16" height="10" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="580" y="335" width="16" height="10" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="580" y="365" width="16" height="10" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="580" y="395" width="16" height="10" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="580" y="425" width="16" height="10" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Підписи правого роз'єму -->
  <text x="630" y="165" font-size="14" text-anchor="start" fill="#1a1a1a">GND</text>
  <text x="630" y="195" font-size="14" text-anchor="start" fill="#2457d6">IO43 (UART TX)</text>
  <text x="630" y="225" font-size="14" text-anchor="start" fill="#2457d6">IO44 (UART RX)</text>
  <text x="630" y="255" font-size="14" text-anchor="start" fill="#27ae60">IO8 (I2C SDA)</text>
  <text x="630" y="285" font-size="14" text-anchor="start" fill="#27ae60">IO9 (I2C SCL)</text>
  <text x="630" y="315" font-size="14" text-anchor="start" fill="#c0392b">IO37 (Внутр. SPI MISO) ⛔</text>
  <text x="630" y="345" font-size="14" text-anchor="start" fill="#c0392b">IO35 (Внутр. SPI MOSI) ⛔</text>
  <text x="630" y="375" font-size="14" text-anchor="start" fill="#c0392b">IO36 (Внутр. SPI SCK) ⛔</text>
  <text x="630" y="405" font-size="14" text-anchor="start" fill="#c0392b">IO34 (Внутр. SPI CS) ⛔</text>
  <text x="630" y="435" font-size="14" text-anchor="start" fill="#c0392b">IO33 (LoRa DIO1) ⛔</text>

  <!-- Внутрішні компоненти: ESP32-S3 -->
  <rect x="394" y="140" width="172" height="120" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="480" y="195" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">ESP32-S3</text>
  <text x="480" y="215" font-size="12" text-anchor="middle" fill="#6b7280">Мікроконтролер</text>

  <!-- Внутрішні компоненти: Лінії зв'язку -->
  <line x1="480" y1="260" x2="480" y2="280" stroke="#c0392b" stroke-width="2"/>
  <line x1="480" y1="320" x2="480" y2="340" stroke="#c0392b" stroke-width="2"/>
  <rect x="410" y="280" width="140" height="40" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="480" y="297" font-size="12" text-anchor="middle" fill="#c0392b">Внутрішні лінії</text>
  <text x="480" y="313" font-size="12" text-anchor="middle" fill="#c0392b">SPI, DIO1, BUSY, RST</text>

  <!-- Внутрішні компоненти: SX1262 -->
  <rect x="394" y="340" width="172" height="100" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="480" y="385" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">SX1262</text>
  <text x="480" y="405" font-size="12" text-anchor="middle" fill="#6b7280">LoRa трансивер</text>
  
  <!-- Легенда -->
  <rect x="40" y="470" width="310" height="70" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="490" font-size="13" font-weight="bold" fill="#1a1a1a">Легенда:</text>
  <text x="50" y="510" font-size="12" fill="#27ae60">■ Зелені — безпечні для використання</text>
  <text x="50" y="525" font-size="12" fill="#2457d6">■ Сині — доступні інтерфейси (ADC, UART)</text>
  <text x="50" y="540" font-size="12" fill="#c0392b">■ Червоні — зарезервовані/внутрішні (не чіпати)</text>
</svg>
