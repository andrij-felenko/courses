<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 480" width="720" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="480" fill="white"/>
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <text x="360" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Послідовність пробудження радіомодуля SX1262</text>
  <text x="360" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Взаємодія ESP32-S3 та SX1262 при виході з режиму глибокого сну</text>

  <line x1="160" y1="120" x2="160" y2="450" stroke="#d0d7de" stroke-width="2" stroke-dasharray="4"/>
  <line x1="420" y1="120" x2="420" y2="450" stroke="#d0d7de" stroke-width="2" stroke-dasharray="4"/>

  <rect x="100" y="80" width="120" height="40" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="160" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ESP32-S3</text>

  <rect x="360" y="80" width="120" height="40" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="420" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">SX1262</text>

  <text x="290" y="145" font-size="13" fill="#1a1a1a" text-anchor="middle">1. Встановлення NSS = LOW</text>
  <line x1="160" y1="160" x2="410" y2="160" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  
  <rect x="410" y="160" width="20" height="40" rx="2" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="440" y="185" font-size="13" fill="#6b7280" text-anchor="start">Запуск внутрішнього RC-генератора</text>

  <text x="290" y="215" font-size="13" fill="#1a1a1a" text-anchor="middle">2. BUSY = LOW (модуль готовий)</text>
  <line x1="410" y1="230" x2="170" y2="230" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <text x="290" y="275" font-size="13" fill="#1a1a1a" text-anchor="middle">3. Команда SetStandby(XOSC)</text>
  <line x1="160" y1="290" x2="410" y2="290" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <rect x="410" y="290" width="20" height="40" rx="2" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="440" y="315" font-size="13" fill="#6b7280" text-anchor="start">Запуск зовнішнього кварцу (XOSC)</text>

  <text x="290" y="345" font-size="13" fill="#1a1a1a" text-anchor="middle">4. BUSY = LOW (кварц готовий)</text>
  <line x1="410" y1="360" x2="170" y2="360" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <text x="290" y="405" font-size="13" fill="#1a1a1a" text-anchor="middle">5. Подальша конфігурація</text>
  <line x1="160" y1="420" x2="410" y2="420" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
</svg>
