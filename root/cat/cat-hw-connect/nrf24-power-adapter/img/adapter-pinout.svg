<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Заголовок -->
  <text x="480" y="45" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Адаптер живлення для nRF24L01</text>
  <text x="480" y="70" font-size="13" fill="#6b7280" text-anchor="middle">Схема перетворення напруги та проходження транзитних сигналів</text>

  <!-- Підписи сторін -->
  <text x="140" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">До мікроконтролера</text>
  <text x="820" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">До модуля nRF24L01</text>

  <!-- Плата-адаптер -->
  <rect x="220" y="120" width="520" height="280" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="480" y="385" font-size="14" fill="#6b7280" text-anchor="middle">Плата-адаптер</text>

  <!-- Вхідний конектор (зліва) -->
  <rect x="250" y="145" width="30" height="240" rx="4" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>
  <circle cx="265" cy="160" r="4" fill="#1a1a1a"/>
  <circle cx="265" cy="190" r="4" fill="#1a1a1a"/>
  <circle cx="265" cy="220" r="4" fill="#1a1a1a"/>
  <circle cx="265" cy="250" r="4" fill="#1a1a1a"/>
  <circle cx="265" cy="280" r="4" fill="#1a1a1a"/>
  <circle cx="265" cy="310" r="4" fill="#1a1a1a"/>
  <circle cx="265" cy="340" r="4" fill="#1a1a1a"/>
  <circle cx="265" cy="370" r="4" fill="#1a1a1a"/>

  <!-- Вихідний роз'єм (справа) -->
  <rect x="680" y="145" width="30" height="240" rx="4" fill="#1a1a1a" stroke="#6b7280" stroke-width="1"/>
  <circle cx="695" cy="160" r="4" fill="#f4f6f8"/>
  <circle cx="695" cy="190" r="4" fill="#f4f6f8"/>
  <circle cx="695" cy="220" r="4" fill="#f4f6f8"/>
  <circle cx="695" cy="250" r="4" fill="#f4f6f8"/>
  <circle cx="695" cy="280" r="4" fill="#f4f6f8"/>
  <circle cx="695" cy="310" r="4" fill="#f4f6f8"/>
  <circle cx="695" cy="340" r="4" fill="#f4f6f8"/>
  <circle cx="695" cy="370" r="4" fill="#f4f6f8"/>

  <!-- Стабілізатор напруги -->
  <rect x="400" y="135" width="160" height="45" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="480" y="152" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">AMS1117-3.3</text>
  <text x="480" y="170" font-size="12" fill="#27ae60" text-anchor="middle">Стабілізатор 3.3V</text>
  <text x="410" y="155" font-size="11" fill="#27ae60">IN</text>
  <text x="550" y="155" font-size="11" fill="#27ae60" text-anchor="end">OUT</text>

  <!-- Лінії живлення -->
  <path d="M280,160 L400,160" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <path d="M560,160 L680,160" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <path d="M280,190 L680,190" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="480" y1="180" x2="480" y2="190" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="480" cy="190" r="3" fill="#1a1a1a"/>

  <!-- Транзитні лінії сигналів -->
  <path d="M280,220 L680,220" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <path d="M280,250 L680,250" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <path d="M280,280 L680,280" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <path d="M280,310 L680,310" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <path d="M680,340 L280,340" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <path d="M680,370 L280,370" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Внутрішні підписи пінів (зліва) -->
  <text x="290" y="155" font-size="12" fill="#c0392b">VCC</text>
  <text x="290" y="185" font-size="12" fill="#6b7280">GND</text>
  <text x="290" y="215" font-size="12" fill="#6b7280">CE</text>
  <text x="290" y="245" font-size="12" fill="#6b7280">CSN</text>
  <text x="290" y="275" font-size="12" fill="#6b7280">SCK</text>
  <text x="290" y="305" font-size="12" fill="#6b7280">MOSI</text>
  <text x="290" y="335" font-size="12" fill="#6b7280">MISO</text>
  <text x="290" y="365" font-size="12" fill="#6b7280">IRQ</text>

  <!-- Внутрішні підписи пінів (справа) -->
  <text x="670" y="155" font-size="12" fill="#27ae60" text-anchor="end">VCC</text>
  <text x="670" y="185" font-size="12" fill="#6b7280" text-anchor="end">GND</text>
  <text x="670" y="215" font-size="12" fill="#6b7280" text-anchor="end">CE</text>
  <text x="670" y="245" font-size="12" fill="#6b7280" text-anchor="end">CSN</text>
  <text x="670" y="275" font-size="12" fill="#6b7280" text-anchor="end">SCK</text>
  <text x="670" y="305" font-size="12" fill="#6b7280" text-anchor="end">MOSI</text>
  <text x="670" y="335" font-size="12" fill="#6b7280" text-anchor="end">MISO</text>
  <text x="670" y="365" font-size="12" fill="#6b7280" text-anchor="end">IRQ</text>

  <!-- Зовнішні підписи пінів (зліва) -->
  <text x="240" y="164" font-size="14" fill="#c0392b" text-anchor="end">VCC (5V)</text>
  <text x="240" y="194" font-size="14" fill="#1a1a1a" text-anchor="end">GND</text>
  <text x="240" y="224" font-size="14" fill="#2457d6" text-anchor="end">CE</text>
  <text x="240" y="254" font-size="14" fill="#2457d6" text-anchor="end">CSN</text>
  <text x="240" y="284" font-size="14" fill="#2457d6" text-anchor="end">SCK</text>
  <text x="240" y="314" font-size="14" fill="#2457d6" text-anchor="end">MOSI</text>
  <text x="240" y="344" font-size="14" fill="#2457d6" text-anchor="end">MISO</text>
  <text x="240" y="374" font-size="14" fill="#2457d6" text-anchor="end">IRQ</text>

  <!-- Зовнішні підписи пінів (справа) -->
  <text x="720" y="164" font-size="14" fill="#27ae60">VCC (3.3V)</text>
  <text x="720" y="194" font-size="14" fill="#1a1a1a">GND</text>
  <text x="720" y="224" font-size="14" fill="#2457d6">CE</text>
  <text x="720" y="254" font-size="14" fill="#2457d6">CSN</text>
  <text x="720" y="284" font-size="14" fill="#2457d6">SCK</text>
  <text x="720" y="314" font-size="14" fill="#2457d6">MOSI</text>
  <text x="720" y="344" font-size="14" fill="#2457d6">MISO</text>
  <text x="720" y="374" font-size="14" fill="#2457d6">IRQ</text>
</svg>
