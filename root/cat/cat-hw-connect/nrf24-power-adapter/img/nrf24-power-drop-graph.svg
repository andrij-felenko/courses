<svg viewBox="0 0 800 460" width="800" height="460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Тло полотна -->
  <rect x="0" y="0" width="800" height="460" fill="white" />

  <!-- Заголовок і підзаголовок -->
  <text x="400" y="40" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Падіння напруги в момент передавання даних</text>
  <text x="400" y="65" font-size="13" text-anchor="middle" fill="#6b7280">Адаптер-стабілізатор згладжує просадки під час пікового споживання струму</text>

  <!-- Фонова зона для періоду передачі (TX) -->
  <rect x="300" y="100" width="200" height="280" fill="#f4f6f8" />
  <line x1="300" y1="100" x2="300" y2="380" stroke="#d0d7de" stroke-width="2" stroke-dasharray="4,4" />
  <line x1="500" y1="100" x2="500" y2="380" stroke="#d0d7de" stroke-width="2" stroke-dasharray="4,4" />
  <text x="400" y="365" font-size="14" fill="#6b7280" text-anchor="middle">Пікова потужність (TX)</text>

  <!-- Опорна лінія 3.3 В -->
  <line x1="95" y1="140" x2="700" y2="140" stroke="#d0d7de" stroke-width="2" stroke-dasharray="6,6" />

  <!-- Графік БЕЗ адаптера (червоний) -->
  <path d="M 100 140 L 300 140 C 305 140, 310 230, 320 230 C 350 230, 380 200, 410 220 C 440 240, 470 200, 500 220 C 510 220, 515 140, 520 140 L 700 140" fill="none" stroke="#c0392b" stroke-width="3" />

  <!-- Графік З адаптером (зелений) -->
  <path d="M 100 140 L 300 140 C 310 140, 310 145, 320 145 C 380 145, 440 145, 500 145 C 510 145, 510 140, 520 140 L 700 140" fill="none" stroke="#27ae60" stroke-width="3" />

  <!-- Мітки графіків -->
  <rect x="345" y="112" width="130" height="26" fill="#e9f7ef" rx="4" />
  <text x="410" y="130" font-size="14" fill="#27ae60" font-weight="bold" text-anchor="middle">З адаптером</text>

  <rect x="350" y="270" width="120" height="26" fill="#fdecea" rx="4" />
  <text x="410" y="288" font-size="14" fill="#c0392b" font-weight="bold" text-anchor="middle">Без адаптера</text>

  <!-- Осі координат -->
  <line x1="100" y1="380" x2="720" y2="380" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)" />
  <line x1="100" y1="380" x2="100" y2="100" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)" />

  <!-- Підписи осей -->
  <text x="100" y="85" font-size="14" fill="#1a1a1a" text-anchor="start">Напруга, U (В)</text>
  <text x="710" y="395" font-size="14" fill="#1a1a1a" text-anchor="start">Час, t</text>

  <!-- Поділки та значення на осі Y -->
  <text x="90" y="145" font-size="14" fill="#6b7280" text-anchor="end">3.3</text>
  <line x1="95" y1="140" x2="105" y2="140" stroke="#1a1a1a" stroke-width="2" />

  <text x="90" y="204" font-size="14" fill="#6b7280" text-anchor="end">2.5</text>
  <line x1="95" y1="199" x2="105" y2="199" stroke="#1a1a1a" stroke-width="2" />

  <text x="90" y="385" font-size="14" fill="#6b7280" text-anchor="end">0</text>
</svg>
