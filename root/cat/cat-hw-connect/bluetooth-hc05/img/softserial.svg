<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 360" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="780" height="360" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="390.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Дві лінії на Uno: USB-монітор вільний, модуль на SoftwareSerial</text>
<rect x="28.0" y="150.0" width="150.0" height="74.0" rx="6" fill="#eef2f7" stroke="#1a1a1a" stroke-width="1.6"/><text x="103.0" y="176.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="103.0" dy="0.0">Комп'ютер</tspan><tspan x="103.0" dy="14.3">монітор порту</tspan><tspan x="103.0" dy="14.3">(USB)</tspan></text>
<rect x="250.0" y="70.0" width="250.0" height="230.0" rx="10" fill="#fbfcfd" stroke="#6b7280" stroke-width="1.4"/>
<text x="375.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle" font-weight="700">Arduino Uno (ATmega328)</text>
<rect x="272.0" y="96.0" width="206.0" height="40.0" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.3"/><text x="375.0" y="119.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="375.0" dy="0.0">апаратний Serial → D0/D1</tspan></text>
<rect x="272.0" y="150.0" width="206.0" height="46.0" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/><text x="375.0" y="169.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="375.0" dy="0.0">скетч: перекладає байти</tspan><tspan x="375.0" dy="14.3">між двома портами</tspan></text>
<rect x="272.0" y="214.0" width="206.0" height="40.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.3"/><text x="375.0" y="237.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="375.0" dy="0.0">SoftwareSerial → D10/D11</tspan></text>
<rect x="566.0" y="150.0" width="186.0" height="74.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.8"/><text x="659.0" y="176.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="659.0" dy="0.0">HC-05 / HC-06</tspan><tspan x="659.0" dy="14.3">(RXD через дільник,</tspan><tspan x="659.0" dy="14.3">TXD напряму)</tspan></text>
<line x1="178.0" y1="116.0" x2="272.0" y2="116.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="272.0" y1="128.0" x2="178.0" y2="128.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="225.0" y="104.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700">USB</text>
<line x1="478.0" y1="234.0" x2="566.0" y2="234.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="566.0" y1="246.0" x2="478.0" y2="246.0" stroke="#27ae60" stroke-width="2.0" marker-end="url(#arrow)"/>
<text x="522.0" y="224.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700">радіобайти</text>
<rect x="70.0" y="300.0" width="640.0" height="44.0" rx="6" fill="#fff8e1" stroke="#f0b429" stroke-width="1.2"/><text x="390.0" y="318.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="390.0" dy="0.0">Навіщо два порти: апаратний Serial зайнятий друком у монітор і прошивкою по USB.</tspan><tspan x="390.0" dy="13.7">Повісити модуль ще й на D0/D1 → монітор ловитиме кашу. SoftwareSerial дає модулю окрему пару.</tspan></text>
</svg>