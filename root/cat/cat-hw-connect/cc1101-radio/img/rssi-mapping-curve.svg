<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="40" font-size="18" fill="#1a1a1a" font-weight="bold" text-anchor="middle">Залежність розрахованого RSSI від фактичної потужності сигналу</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Робочий лінійний діапазон обмежений шумовим порогом та зоною насичення приймача</text>

  <!-- Regions Backgrounds -->
  <rect x="80" y="100" width="105" height="300" fill="#fdecea"/>
  <rect x="185" y="100" width="630" height="300" fill="#e9f7ef"/>
  <rect x="815" y="100" width="105" height="300" fill="#fdecea"/>

  <!-- Region Labels -->
  <text x="132.5" y="125" font-size="12" fill="#c0392b" font-weight="bold" text-anchor="middle">
    <tspan x="132.5" dy="0">Шумовий</tspan>
    <tspan x="132.5" dy="16">поріг</tspan>
  </text>
  <text x="500" y="133" font-size="14" fill="#27ae60" font-weight="bold" text-anchor="middle">Робочий лінійний діапазон</text>
  <text x="867.5" y="133" font-size="12" fill="#c0392b" font-weight="bold" text-anchor="middle">Насичення</text>

  <!-- Grid lines -->
  <line x1="220" y1="100" x2="220" y2="400" stroke="#d0d7de" stroke-dasharray="4,4"/>
  <line x1="360" y1="100" x2="360" y2="400" stroke="#d0d7de" stroke-dasharray="4,4"/>
  <line x1="500" y1="100" x2="500" y2="400" stroke="#d0d7de" stroke-dasharray="4,4"/>
  <line x1="640" y1="100" x2="640" y2="400" stroke="#d0d7de" stroke-dasharray="4,4"/>
  <line x1="780" y1="100" x2="780" y2="400" stroke="#d0d7de" stroke-dasharray="4,4"/>
  <line x1="920" y1="100" x2="920" y2="400" stroke="#d0d7de" stroke-dasharray="4,4"/>
  
  <text x="80" y="420" font-size="12" fill="#6b7280" text-anchor="middle">-120</text>
  <text x="220" y="420" font-size="12" fill="#6b7280" text-anchor="middle">-100</text>
  <text x="360" y="420" font-size="12" fill="#6b7280" text-anchor="middle">-80</text>
  <text x="500" y="420" font-size="12" fill="#6b7280" text-anchor="middle">-60</text>
  <text x="640" y="420" font-size="12" fill="#6b7280" text-anchor="middle">-40</text>
  <text x="780" y="420" font-size="12" fill="#6b7280" text-anchor="middle">-20</text>
  <text x="920" y="420" font-size="12" fill="#6b7280" text-anchor="middle">0</text>

  <line x1="80" y1="350" x2="920" y2="350" stroke="#d0d7de" stroke-dasharray="4,4"/>
  <line x1="80" y1="300" x2="920" y2="300" stroke="#d0d7de" stroke-dasharray="4,4"/>
  <line x1="80" y1="250" x2="920" y2="250" stroke="#d0d7de" stroke-dasharray="4,4"/>
  <line x1="80" y1="200" x2="920" y2="200" stroke="#d0d7de" stroke-dasharray="4,4"/>
  <line x1="80" y1="150" x2="920" y2="150" stroke="#d0d7de" stroke-dasharray="4,4"/>
  <line x1="80" y1="100" x2="920" y2="100" stroke="#d0d7de" stroke-dasharray="4,4"/>

  <text x="70" y="404" font-size="12" fill="#6b7280" text-anchor="end">-120</text>
  <text x="70" y="354" font-size="12" fill="#6b7280" text-anchor="end">-100</text>
  <text x="70" y="304" font-size="12" fill="#6b7280" text-anchor="end">-80</text>
  <text x="70" y="254" font-size="12" fill="#6b7280" text-anchor="end">-60</text>
  <text x="70" y="204" font-size="12" fill="#6b7280" text-anchor="end">-40</text>
  <text x="70" y="154" font-size="12" fill="#6b7280" text-anchor="end">-20</text>
  <text x="70" y="104" font-size="12" fill="#6b7280" text-anchor="end">0</text>

  <!-- Titles -->
  <text x="500" y="445" font-size="14" fill="#1a1a1a" font-weight="bold" text-anchor="middle">Фактична потужність сигналу на антені (дБм)</text>
  <text x="80" y="85" font-size="14" fill="#1a1a1a" font-weight="bold" text-anchor="start">Обчислений рівень RSSI (дБм)</text>
  <text x="920" y="85" font-size="14" fill="#2457d6" font-weight="bold" text-anchor="end">Значення регістра (dec)</text>

  <!-- Right Y labels -->
  <text x="930" y="404" font-size="12" fill="#2457d6" text-anchor="start">-92</text>
  <text x="930" y="354" font-size="12" fill="#2457d6" text-anchor="start">-52</text>
  <text x="930" y="304" font-size="12" fill="#2457d6" text-anchor="start">-12</text>
  <text x="930" y="254" font-size="12" fill="#2457d6" text-anchor="start">28</text>
  <text x="930" y="204" font-size="12" fill="#2457d6" text-anchor="start">68</text>
  <text x="930" y="154" font-size="12" fill="#2457d6" text-anchor="start">108</text>

  <!-- Axes lines -->
  <line x1="80" y1="400" x2="920" y2="400" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="80" y1="100" x2="80" y2="400" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="920" y1="100" x2="920" y2="400" stroke="#1a1a1a" stroke-width="2"/>

  <!-- The curve -->
  <path d="M 80 362.5 L 185 362.5 L 815 137.5 L 920 137.5" fill="none" stroke="#2457d6" stroke-width="4"/>
  
  <circle cx="185" cy="362.5" r="4" fill="#2457d6"/>
  <text x="195" y="380" font-size="12" fill="#1a1a1a" text-anchor="start">~ -105 дБм</text>

  <circle cx="815" cy="137.5" r="4" fill="#2457d6"/>
  <text x="805" y="125" font-size="12" fill="#1a1a1a" text-anchor="end">~ -15 дБм</text>
</svg>
