<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>
  
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  
  <!-- Заголовок -->
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Формат транзакції SPI (CC1101)</text>
  <text x="480" y="65" font-size="13" fill="#6b7280" text-anchor="middle">Одночасне передавання заголовка/даних і отримання байта стану</text>
  
  <!-- Вертикальні лінії-маркери -->
  <line x1="200" y1="120" x2="200" y2="310" stroke="#d0d7de" stroke-dasharray="4 4" stroke-width="1.5"/>
  <line x1="440" y1="120" x2="440" y2="310" stroke="#d0d7de" stroke-dasharray="4 4" stroke-width="1.5"/>
  <line x1="760" y1="120" x2="760" y2="310" stroke="#d0d7de" stroke-dasharray="4 4" stroke-width="1.5"/>
  
  <!-- CSn -->
  <text x="130" y="115" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="end">CSn</text>
  <path d="M140,100 L180,100 L190,120 L770,120 L780,100 L840,100" fill="none" stroke="#2457d6" stroke-width="2"/>
  
  <!-- MOSI Row -->
  <text x="130" y="190" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="end">MOSI</text>
  
  <text x="320" y="135" font-size="13" font-weight="bold" fill="#6b7280" text-anchor="middle">Заголовок (1 байт)</text>
  <text x="600" y="135" font-size="13" font-weight="bold" fill="#6b7280" text-anchor="middle">Дані (1 або більше байтів)</text>
  
  <text x="220" y="152" font-size="12" fill="#6b7280" text-anchor="middle">7</text>
  <text x="260" y="152" font-size="12" fill="#6b7280" text-anchor="middle">6</text>
  <text x="360" y="152" font-size="12" fill="#6b7280" text-anchor="middle">5..0</text>
  
  <rect x="200" y="160" width="40" height="50" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="220" y="190" font-size="14" fill="#1a1a1a" text-anchor="middle">R/W</text>
  
  <rect x="240" y="160" width="40" height="50" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="260" y="190" font-size="14" fill="#1a1a1a" text-anchor="middle">B</text>
  
  <rect x="280" y="160" width="160" height="50" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="360" y="190" font-size="14" fill="#1a1a1a" text-anchor="middle">Адреса (A5..A0)</text>
  
  <rect x="440" y="160" width="130" height="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="505" y="190" font-size="14" fill="#1a1a1a" text-anchor="middle">Байт даних 1</text>
  
  <text x="600" y="190" font-size="18" fill="#1a1a1a" text-anchor="middle">...</text>
  
  <rect x="630" y="160" width="130" height="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="695" y="190" font-size="14" fill="#1a1a1a" text-anchor="middle">Байт даних N</text>

  <!-- MISO Row -->
  <text x="130" y="280" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="end">MISO</text>
  
  <text x="320" y="244" font-size="13" font-weight="bold" fill="#6b7280" text-anchor="middle">Байт стану</text>
  <text x="600" y="244" font-size="13" font-weight="bold" fill="#6b7280" text-anchor="middle">Дані (тільки під час читання)</text>
  
  <rect x="200" y="250" width="80" height="50" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="240" y="280" font-size="14" fill="#1a1a1a" text-anchor="middle">RDYn</text>
  
  <rect x="280" y="250" width="60" height="50" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="310" y="280" font-size="14" fill="#1a1a1a" text-anchor="middle">Стан</text>
  
  <rect x="340" y="250" width="100" height="50" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="390" y="280" font-size="14" fill="#1a1a1a" text-anchor="middle">FIFO вільні</text>
  
  <rect x="440" y="250" width="130" height="50" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="505" y="280" font-size="14" fill="#1a1a1a" text-anchor="middle">Байт даних 1</text>
  
  <text x="600" y="280" font-size="18" fill="#1a1a1a" text-anchor="middle">...</text>
  
  <rect x="630" y="250" width="130" height="50" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="695" y="280" font-size="14" fill="#1a1a1a" text-anchor="middle">Байт даних N</text>

  <text x="240" y="318" font-size="12" fill="#6b7280" text-anchor="middle">7</text>
  <text x="310" y="318" font-size="12" fill="#6b7280" text-anchor="middle">6..4</text>
  <text x="390" y="318" font-size="12" fill="#6b7280" text-anchor="middle">3..0</text>
  
  <!-- Легенда -->
  <text x="200" y="360" font-size="14" fill="#1a1a1a" text-anchor="start">R/W: 0 = Запис, 1 = Читання</text>
  <text x="200" y="385" font-size="14" fill="#1a1a1a" text-anchor="start">B: 0 = Один байт, 1 = Пакетний режим</text>
  <text x="200" y="410" font-size="14" fill="#1a1a1a" text-anchor="start">FIFO вільні: Байти, доступні у буфері FIFO</text>

  <text x="540" y="360" font-size="14" fill="#1a1a1a" text-anchor="start">RDYn: 0 = Готовий, 1 = Зайнятий</text>
  <text x="540" y="385" font-size="14" fill="#1a1a1a" text-anchor="start">Стан: Поточний стан (IDLE, RX, TX)</text>

</svg>
