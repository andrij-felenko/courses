<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Радіотракт CC1101: від мікросхеми до антени</text>
  <text x="480" y="65" font-size="13" fill="#6b7280" text-anchor="middle">Балун перетворює диференціальний сигнал на несиметричний, а LC-фільтр пригнічує гармоніки</text>

  <!-- CC1101 -->
  <rect x="40" y="140" width="120" height="160" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="4"/>
  <text x="100" y="225" font-size="16" font-weight="bold" fill="#2457d6" text-anchor="middle">CC1101</text>
  
  <text x="145" y="165" font-size="13" text-anchor="end" fill="#1a1a1a">RF_P (12)</text>
  <line x1="160" y1="180" x2="220" y2="180" stroke="#1a1a1a" stroke-width="2"/>
  
  <text x="145" y="265" font-size="13" text-anchor="end" fill="#1a1a1a">RF_N (13)</text>
  <line x1="160" y1="280" x2="220" y2="280" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Balun -->
  <rect x="200" y="100" width="280" height="260" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4" rx="4"/>
  <text x="340" y="125" font-size="14" font-weight="bold" fill="#6b7280" text-anchor="middle">Узгоджувальний балун</text>

  <!-- L1 -->
  <line x1="220" y1="180" x2="235" y2="180" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="235" y="174" width="30" height="12" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="265" y1="180" x2="280" y2="180" stroke="#1a1a1a" stroke-width="2"/>
  <text x="250" y="160" font-size="14" fill="#1a1a1a" text-anchor="middle">L1</text>
  
  <!-- L2 -->
  <line x1="220" y1="280" x2="235" y2="280" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="235" y="274" width="30" height="12" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="265" y1="280" x2="280" y2="280" stroke="#1a1a1a" stroke-width="2"/>
  <text x="250" y="260" font-size="14" fill="#1a1a1a" text-anchor="middle">L2</text>
  
  <!-- L3 -->
  <line x1="280" y1="180" x2="280" y2="215" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="274" y="215" width="12" height="30" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="280" y1="245" x2="280" y2="280" stroke="#1a1a1a" stroke-width="2"/>
  <text x="305" y="235" font-size="14" fill="#1a1a1a" text-anchor="start">L3</text>
  
  <!-- C1 -->
  <line x1="280" y1="180" x2="280" y2="164" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="270" y1="164" x2="290" y2="164" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="270" y1="156" x2="290" y2="156" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="280" y1="156" x2="280" y2="140" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="280" y1="140" x2="280" y2="130" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="268" y1="130" x2="292" y2="130" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="272" y1="125" x2="288" y2="125" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="276" y1="120" x2="284" y2="120" stroke="#1a1a1a" stroke-width="2"/>
  <text x="295" y="165" font-size="14" fill="#1a1a1a" text-anchor="start">C1</text>
  
  <!-- C2 -->
  <line x1="280" y1="280" x2="280" y2="296" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="270" y1="296" x2="290" y2="296" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="270" y1="304" x2="290" y2="304" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="280" y1="304" x2="280" y2="320" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="280" y1="320" x2="280" y2="330" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="268" y1="330" x2="292" y2="330" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="272" y1="335" x2="288" y2="335" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="276" y1="340" x2="284" y2="340" stroke="#1a1a1a" stroke-width="2"/>
  <text x="295" y="305" font-size="14" fill="#1a1a1a" text-anchor="start">C2</text>
  
  <line x1="280" y1="180" x2="340" y2="180" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- C3 -->
  <line x1="340" y1="180" x2="366" y2="180" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="366" y1="170" x2="366" y2="190" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="374" y1="170" x2="374" y2="190" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="374" y1="180" x2="400" y2="180" stroke="#1a1a1a" stroke-width="2"/>
  <text x="370" y="160" font-size="14" fill="#1a1a1a" text-anchor="middle">C3</text>

  <!-- Nodes in Balun -->
  <circle cx="280" cy="180" r="4" fill="#1a1a1a"/>
  <circle cx="280" cy="280" r="4" fill="#1a1a1a"/>
  
  <!-- Line from Balun to Filter -->
  <line x1="400" y1="180" x2="560" y2="180" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Filter -->
  <rect x="520" y="100" width="220" height="260" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4" rx="4"/>
  <text x="630" y="125" font-size="14" font-weight="bold" fill="#6b7280" text-anchor="middle">Фільтр низьких частот</text>

  <!-- C4 -->
  <line x1="560" y1="180" x2="560" y2="196" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="550" y1="196" x2="570" y2="196" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="550" y1="204" x2="570" y2="204" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="560" y1="204" x2="560" y2="220" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="560" y1="220" x2="560" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="548" y1="230" x2="572" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="552" y1="235" x2="568" y2="235" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="556" y1="240" x2="564" y2="240" stroke="#1a1a1a" stroke-width="2"/>
  <text x="540" y="205" font-size="14" fill="#1a1a1a" text-anchor="end">C4</text>
  
  <!-- L4 -->
  <line x1="560" y1="180" x2="585" y2="180" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="585" y="174" width="30" height="12" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="615" y1="180" x2="640" y2="180" stroke="#1a1a1a" stroke-width="2"/>
  <text x="600" y="160" font-size="14" fill="#1a1a1a" text-anchor="middle">L4</text>

  <!-- C5 -->
  <line x1="640" y1="180" x2="640" y2="196" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="630" y1="196" x2="650" y2="196" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="630" y1="204" x2="650" y2="204" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="640" y1="204" x2="640" y2="220" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="640" y1="220" x2="640" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="628" y1="230" x2="652" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="632" y1="235" x2="648" y2="235" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="636" y1="240" x2="644" y2="240" stroke="#1a1a1a" stroke-width="2"/>
  <text x="660" y="205" font-size="14" fill="#1a1a1a" text-anchor="start">C5</text>

  <!-- Nodes in Filter -->
  <circle cx="560" cy="180" r="4" fill="#1a1a1a"/>
  <circle cx="640" cy="180" r="4" fill="#1a1a1a"/>

  <!-- Line to Antenna -->
  <line x1="640" y1="180" x2="820" y2="180" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Antenna -->
  <line x1="820" y1="180" x2="820" y2="140" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="820" y1="140" x2="800" y2="115" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="820" y1="140" x2="840" y2="115" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="800" y1="115" x2="840" y2="115" stroke="#1a1a1a" stroke-width="2"/>
  <text x="820" y="210" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Антена</text>
  <text x="820" y="230" font-size="13" fill="#6b7280" text-anchor="middle">50 Ом</text>

</svg>
