<svg viewBox="0 0 960 560" width="960" height="560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
  </marker>
</defs>

<rect x="0" y="0" width="960" height="560" fill="white"/>

<text x="480" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Блок-схема трансивера CC1101</text>
<text x="480" y="65" text-anchor="middle" font-size="13" fill="#6b7280">Шлях сигналу від цифрового інтерфейсу SPI до аналогового радіотракту</text>

<rect x="120" y="100" width="370" height="380" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="6"/>
<text x="305" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b7280">Цифрова частина (Baseband &amp; MAC)</text>

<rect x="510" y="100" width="360" height="380" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="6"/>
<text x="690" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#6b7280">Аналогова частина (RF &amp; Synth)</text>

<rect x="130" y="150" width="110" height="310" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="4"/>
<text x="185" y="295" text-anchor="middle" font-size="13" fill="#1a1a1a">SPI інтерфейс</text>
<text x="185" y="315" text-anchor="middle" font-size="13" fill="#1a1a1a">та регістри</text>

<rect x="270" y="160" width="80" height="80" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="4"/>
<text x="310" y="195" text-anchor="middle" font-size="13" fill="#1a1a1a">RX FIFO</text>
<text x="310" y="215" text-anchor="middle" font-size="13" fill="#1a1a1a">64 байти</text>

<rect x="270" y="290" width="80" height="80" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="4"/>
<text x="310" y="325" text-anchor="middle" font-size="13" fill="#1a1a1a">TX FIFO</text>
<text x="310" y="345" text-anchor="middle" font-size="13" fill="#1a1a1a">64 байти</text>

<rect x="370" y="160" width="100" height="210" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="4"/>
<text x="420" y="250" text-anchor="middle" font-size="13" fill="#1a1a1a">Обробник</text>
<text x="420" y="270" text-anchor="middle" font-size="13" fill="#1a1a1a">пакетів</text>
<text x="420" y="290" text-anchor="middle" font-size="12" fill="#6b7280">(FEC, CRC)</text>

<rect x="530" y="160" width="140" height="80" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="4"/>
<text x="600" y="195" text-anchor="middle" font-size="13" fill="#1a1a1a">ADC та</text>
<text x="600" y="215" text-anchor="middle" font-size="13" fill="#1a1a1a">Демодулятор</text>

<rect x="700" y="160" width="150" height="80" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="4"/>
<text x="775" y="195" text-anchor="middle" font-size="13" fill="#1a1a1a">LNA, Міксер</text>
<text x="775" y="215" text-anchor="middle" font-size="13" fill="#1a1a1a">та Фільтри</text>

<rect x="530" y="290" width="140" height="80" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="4"/>
<text x="600" y="325" text-anchor="middle" font-size="13" fill="#1a1a1a">Модулятор</text>
<text x="600" y="345" text-anchor="middle" font-size="12" fill="#6b7280">(FSK / ASK)</text>

<rect x="700" y="290" width="150" height="80" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="4"/>
<text x="775" y="325" text-anchor="middle" font-size="13" fill="#1a1a1a">Підсилювач</text>
<text x="775" y="345" text-anchor="middle" font-size="13" fill="#1a1a1a">потужності (PA)</text>

<rect x="530" y="410" width="110" height="60" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="4"/>
<text x="585" y="435" text-anchor="middle" font-size="13" fill="#1a1a1a">Кварцовий</text>
<text x="585" y="455" text-anchor="middle" font-size="13" fill="#1a1a1a">генератор</text>

<rect x="670" y="410" width="180" height="60" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="4"/>
<text x="760" y="435" text-anchor="middle" font-size="13" fill="#1a1a1a">Синтезатор частот</text>
<text x="760" y="455" text-anchor="middle" font-size="12" fill="#6b7280">(PLL + VCO)</text>

<line x1="20" y1="180" x2="125" y2="180" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
<text x="120" y="170" text-anchor="end" font-size="13" fill="#1a1a1a">SI, SCLK, CSn</text>

<line x1="130" y1="220" x2="25" y2="220" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
<text x="120" y="210" text-anchor="end" font-size="13" fill="#1a1a1a">SO (MISO)</text>

<line x1="130" y1="330" x2="25" y2="330" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
<text x="120" y="320" text-anchor="end" font-size="13" fill="#1a1a1a">GDO0, GDO2</text>

<line x1="240" y1="330" x2="265" y2="330" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
<line x1="270" y1="200" x2="245" y2="200" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

<line x1="350" y1="330" x2="365" y2="330" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
<line x1="370" y1="200" x2="355" y2="200" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

<line x1="470" y1="330" x2="525" y2="330" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
<text x="500" y="320" text-anchor="middle" font-size="12" fill="#6b7280">TX дані</text>

<line x1="530" y1="200" x2="475" y2="200" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
<text x="500" y="190" text-anchor="middle" font-size="12" fill="#6b7280">RX дані</text>

<line x1="640" y1="440" x2="665" y2="440" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

<polyline points="720,410 720,390 600,390 600,375" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
<polyline points="775,410 775,385 880,385 880,265 775,265 775,245" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

<line x1="670" y1="330" x2="695" y2="330" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
<line x1="700" y="200" x2="675" y2="200" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

<line x1="850" y1="330" x2="915" y2="330" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
<line x1="920" y1="330" x2="920" y2="160" stroke="#1a1a1a" stroke-width="2"/>
<line x1="920" y1="200" x2="855" y2="200" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
<circle cx="920" cy="200" r="3" fill="#1a1a1a"/>
<path d="M 920 160 L 905 130 L 935 130 Z" fill="none" stroke="#1a1a1a" stroke-width="2"/>
<text x="920" y="115" text-anchor="middle" font-size="12" fill="#6b7280">Антена</text>

</svg>
