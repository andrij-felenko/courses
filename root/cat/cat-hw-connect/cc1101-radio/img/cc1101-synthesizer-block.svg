<svg viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
<rect x="0" y="0" width="960" height="460" fill="white"/>

<text x="480" y="40" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Структурна схема синтезатора частот CC1101</text>
<text x="480" y="60" font-size="13" text-anchor="middle" fill="#6b7280">Формування базової вихідної частоти із сигналу кварцового резонатора</text>

<defs>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
  </marker>
  <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
  </marker>
</defs>

<!-- Blocks -->
<rect x="80" y="160" width="180" height="80" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
<text x="170" y="195" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Кварцовий резонатор</text>
<text x="170" y="215" font-size="14" text-anchor="middle" fill="#6b7280">f_xosc</text>

<path d="M260,200 L332,200" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

<rect x="340" y="160" width="180" height="80" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
<text x="430" y="195" font-size="14" text-anchor="middle" fill="#1a1a1a">Дільник частоти</text>
<text x="430" y="215" font-size="14" text-anchor="middle" fill="#1a1a1a">/ 2¹⁶</text>

<path d="M520,200 L592,200" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

<rect x="600" y="160" width="180" height="80" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
<text x="690" y="195" font-size="14" text-anchor="middle" fill="#1a1a1a">Керований множник</text>
<text x="690" y="215" font-size="14" text-anchor="middle" fill="#1a1a1a">× FREQ</text>

<path d="M780,200 L842,200" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

<!-- Output -->
<text x="850" y="195" font-size="14" font-weight="bold" fill="#2457d6">Вихідна</text>
<text x="850" y="215" font-size="14" font-weight="bold" fill="#2457d6">частота</text>
<text x="850" y="240" font-size="14" fill="#6b7280">f_carrier</text>

<!-- Registers -->
<rect x="600" y="300" width="180" height="60" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
<text x="690" y="325" font-size="14" text-anchor="middle" fill="#2457d6">Регістри конфігурації</text>
<text x="690" y="345" font-size="12" text-anchor="middle" fill="#2457d6">FREQ2, FREQ1, FREQ0</text>

<path d="M690,300 L690,248" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
<text x="700" y="280" font-size="12" fill="#2457d6">24-бітне значення</text>

</svg>
