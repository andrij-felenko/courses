<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="660" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як відкритий SiK на дешевому залізі витіснив дорогий XBee</text>
<line x1="150.0" y1="70.0" x2="150.0" y2="620.0" stroke="#6b7280" stroke-width="3.0"/>
<circle cx="150.0" cy="125.0" r="7.0" fill="#c0392b" stroke="#c0392b" stroke-width="2.0"/>
<rect x="16.0" y="108.0" width="108.0" height="34.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="70.0" y="129.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="70.0" dy="0.0">до 2011</tspan></text>
<rect x="195.0" y="75.0" width="675.0" height="100.0" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="532.5" y="102.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="532.5" dy="0.0">Дорого й закрито: пара XBee (Digi)</tspan><tspan x="532.5" dy="18.2">коштує як половина дрона.</tspan><tspan x="532.5" dy="18.2">Спільнота DIY Drones (Кріс Андерсон,</tspan><tspan x="532.5" dy="18.2">з 2007) шукає дешеву заміну.</tspan></text>
<circle cx="150.0" cy="235.0" r="7.0" fill="#27ae60" stroke="#27ae60" stroke-width="2.0"/>
<rect x="16.0" y="218.0" width="108.0" height="34.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="70.0" y="239.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="70.0" dy="0.0">залізо</tspan></text>
<rect x="195.0" y="185.0" width="675.0" height="100.0" rx="6" fill="#fff7e6" stroke="#27ae60" stroke-width="1.5"/><text x="532.5" y="221.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="532.5" dy="0.0">Дешевий модуль HopeRF HM-TRP уже є:</tspan><tspan x="532.5" dy="18.2">чип Si1000 (8051) + радіо Si4432.</tspan><tspan x="532.5" dy="18.2">Але заводська прошивка — слабка.</tspan></text>
<circle cx="150.0" cy="345.0" r="7.0" fill="#27ae60" stroke="#27ae60" stroke-width="2.0"/>
<rect x="16.0" y="328.0" width="108.0" height="34.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="70.0" y="349.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="70.0" dy="0.0">2011</tspan></text>
<rect x="195.0" y="295.0" width="675.0" height="100.0" rx="6" fill="#eafaf1" stroke="#27ae60" stroke-width="1.5"/><text x="532.5" y="322.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="532.5" dy="0.0">Прошивка SiK. Майкл Сміт і</tspan><tspan x="532.5" dy="18.2">Ендрю Тріджелл (автор rsync/Samba)</tspan><tspan x="532.5" dy="18.2">пишуть вільний код на це залізо:</tspan><tspan x="532.5" dy="18.2">ECC, MAVLink, AT-налаштування.</tspan></text>
<circle cx="150.0" cy="455.0" r="7.0" fill="#2457d6" stroke="#2457d6" stroke-width="2.0"/>
<rect x="16.0" y="438.0" width="108.0" height="34.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="70.0" y="459.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="70.0" dy="0.0">2012</tspan></text>
<rect x="195.0" y="405.0" width="675.0" height="100.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="532.5" y="432.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="532.5" dy="0.0">Продукт «3DR-радіо». 3D Robotics</tspan><tspan x="532.5" dy="18.2">кладе SiK у коробку з USB й антеною;</tspan><tspan x="532.5" dy="18.2">версії 433 МГц (ЄС) і 915 МГц (США),</tspan><tspan x="532.5" dy="18.2">удвічі дешевше за XBee.</tspan></text>
<circle cx="150.0" cy="565.0" r="7.0" fill="#2457d6" stroke="#2457d6" stroke-width="2.0"/>
<rect x="16.0" y="548.0" width="108.0" height="34.0" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/><text x="70.0" y="569.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="70.0" dy="0.0">після</tspan></text>
<rect x="195.0" y="515.0" width="675.0" height="100.0" rx="6" fill="#eef4ff" stroke="#2457d6" stroke-width="1.5"/><text x="532.5" y="542.6" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle"><tspan x="532.5" dy="0.0">3DR згорнула напрямок — а SiK ні.</tspan><tspan x="532.5" dy="18.2">Відкритий код підхопили інші:</tspan><tspan x="532.5" dy="18.2">Holybro, mRo та безліч сумісних.</tspan><tspan x="532.5" dy="18.2">Продукт помер — платформа лишилась.</tspan></text>
</svg>