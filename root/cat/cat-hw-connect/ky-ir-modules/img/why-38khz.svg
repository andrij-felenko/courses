<text x="685.0" y="190.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">рівний фон викинуто, лишилась пачка</text>
<text x="450.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle">2 · а звідки саме 38, а не 36 чи 40 — з дільника й резонатора</text>
<text x="255.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">«за книжкою» (RC-5, Philips)</text>
<rect x="105.0" y="344.0" width="300.0" height="92.0" rx="8" fill="#fbfcfd" stroke="#2457d6" stroke-width="1.3"/>
<text x="255.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">432 кГц ÷ 12 = 36.0 кГц</text>
<text x="255.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">резонатор 432 кГц — рідкісний,</text>
<text x="255.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">мало хто його ставив</text>
<text x="645.0" y="330.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">«як вийшло насправді»</text>
<rect x="495.0" y="344.0" width="300.0" height="92.0" rx="8" fill="#fbfcfd" stroke="#27ae60" stroke-width="1.3"/>
<text x="645.0" y="370.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle">455 кГц ÷ 12 = 37.92 ≈ 38 кГц</text>
<text x="645.0" y="396.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">455 кГц — копійчаний резонатор ПЧ</text>
<text x="645.0" y="416.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">з кожного АМ-приймача</text>
