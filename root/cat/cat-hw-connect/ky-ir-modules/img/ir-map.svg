<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="430" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="34.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">ІЧ-члени KY-родини — за роллю</text>
<rect x="60.0" y="60.0" width="320.0" height="320.0" rx="12" fill="#f4f8ff" stroke="#2457d6" stroke-width="1.5"/>
<text x="220.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">лінія «пульт → прилад»</text>
<text x="220.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">світло летить від одного до іншого</text>
<rect x="84.0" y="130.0" width="272.0" height="70.0" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="104.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">KY-005</text>
<text x="104.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">передавач: одинокий ІЧ-світлодіод,</text>
<text x="104.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">шле код (потрібен резистор)</text>
<rect x="84.0" y="216.0" width="272.0" height="70.0" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="104.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">KY-022</text>
<text x="104.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">приймач: чип 1838 (VS1838B),</text>
<text x="104.0" y="278.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">ловить код, вихід перевернутий</text>
<rect x="84.0" y="302.0" width="272.0" height="60.0" rx="8" fill="#fbfcfd" stroke="#6b7280" stroke-width="1.3"/>
<text x="104.0" y="328.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="start" font-weight="700">VS1838B</text>
<text x="104.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">той самий приймач без плати</text>
<rect x="440.0" y="60.0" width="320.0" height="320.0" rx="12" fill="#f2fbf5" stroke="#27ae60" stroke-width="1.5"/>
<text x="600.0" y="88.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">віддзеркалення від поверхні</text>
<text x="600.0" y="108.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">світять поряд і ловлять власне відбиття</text>
<rect x="464.0" y="130.0" width="272.0" height="78.0" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="484.0" y="158.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">KY-032</text>
<text x="484.0" y="178.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">давач перешкоди: є відбиток —</text>
<text x="484.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">попереду щось є (поріг гвинтиком)</text>
<rect x="464.0" y="224.0" width="272.0" height="78.0" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.4"/>
<text x="484.0" y="252.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="start" font-weight="700">KY-033</text>
<text x="484.0" y="272.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">давач лінії: темне тло не відбиває,</text>
<text x="484.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">світле — відбиває (робот їде по смузі)</text>
<rect x="464.0" y="318.0" width="272.0" height="44.0" rx="6" fill="#eefaf1" stroke="#27ae60" stroke-width="1.5"/><text x="600.0" y="337.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="600.0" dy="0.0">інша книга-родина (давачі), не пульти —</tspan><tspan x="600.0" dy="13.0">тут лише згадані, щоб не сплутати</tspan></text>
<text x="410.0" y="410.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">спільне для всіх: 940 нм · несуча ~38 кГц · трипінова гребінка KY</text>
</svg>