<svg viewBox="0 0 720 400" width="720" height="400" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="400" fill="white"/>
  
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-curr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <text x="360" y="40" fill="#1a1a1a" font-size="18" font-weight="bold" text-anchor="middle">Струми в дільнику AMS1117-ADJ</text>
  <text x="360" y="60" fill="#6b7280" font-size="13" text-anchor="middle">Струм ADJ додається до базового струму дільника, впливаючи на вихідну напругу</text>

  <rect x="180" y="90" width="160" height="90" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="260" y="135" fill="#1a1a1a" font-size="16" font-weight="bold" text-anchor="middle">AMS1117</text>
  <text x="260" y="155" fill="#6b7280" font-size="13" text-anchor="middle">ADJ</text>
  
  <text x="190" y="125" fill="#1a1a1a" font-size="12" text-anchor="start">IN</text>
  <text x="330" y="125" fill="#1a1a1a" font-size="12" text-anchor="end">OUT</text>
  <text x="260" y="175" fill="#1a1a1a" font-size="12" text-anchor="middle">ADJ</text>

  <line x1="80" y1="120" x2="180" y2="120" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="340" y1="120" x2="600" y2="120" stroke="#1a1a1a" stroke-width="2"/>
  <polyline points="260,180 260,240 480,240" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  
  <circle cx="480" cy="120" r="4" fill="#1a1a1a"/>
  <line x1="480" y1="120" x2="480" y2="150" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="470" y="150" width="20" height="50" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="480" y1="200" x2="480" y2="240" stroke="#1a1a1a" stroke-width="2"/>
  
  <circle cx="480" cy="240" r="4" fill="#1a1a1a"/>
  
  <line x1="480" y1="240" x2="480" y2="270" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="470" y="270" width="20" height="50" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="480" y1="320" x2="480" y2="350" stroke="#1a1a1a" stroke-width="2"/>
  
  <line x1="460" y1="350" x2="500" y2="350" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="468" y1="356" x2="492" y2="356" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="476" y1="362" x2="484" y2="362" stroke="#1a1a1a" stroke-width="2"/>

  <circle cx="80" cy="120" r="4" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="80" y="105" fill="#1a1a1a" font-size="14" font-weight="bold" text-anchor="middle">V<tspan font-size="11" dy="3">IN</tspan></text>
  
  <circle cx="600" cy="120" r="4" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="600" y="105" fill="#1a1a1a" font-size="14" font-weight="bold" text-anchor="middle">V<tspan font-size="11" dy="3">OUT</tspan></text>

  <text x="455" y="175" fill="#1a1a1a" font-size="14" text-anchor="end">R1</text>
  <text x="455" y="195" fill="#6b7280" font-size="13" text-anchor="end">V<tspan font-size="11" dy="2">REF</tspan><tspan font-size="13" dy="-2"> = 1.25 В</tspan></text>
  
  <text x="455" y="300" fill="#1a1a1a" font-size="14" text-anchor="end">R2</text>

  <line x1="330" y1="230" x2="410" y2="230" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-curr)"/>
  <text x="370" y="220" fill="#2457d6" font-size="14" text-anchor="middle"><tspan font-style="italic">I</tspan><tspan font-size="11" dy="3">ADJ</tspan></text>
  
  <line x1="510" y1="155" x2="510" y2="195" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-curr)"/>
  <text x="520" y="180" fill="#2457d6" font-size="14" text-anchor="start"><tspan font-style="italic">I</tspan><tspan font-size="11" dy="3">R1</tspan></text>
  
  <line x1="510" y1="275" x2="510" y2="315" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-curr)"/>
  <text x="520" y="300" fill="#2457d6" font-size="14" text-anchor="start"><tspan font-style="italic">I</tspan><tspan font-size="11" dy="3">R2</tspan><tspan font-size="14" dy="-3"> = </tspan><tspan font-style="italic">I</tspan><tspan font-size="11" dy="3">R1</tspan><tspan font-size="14" dy="-3"> + </tspan><tspan font-style="italic">I</tspan><tspan font-size="11" dy="3">ADJ</tspan></text>
</svg>
