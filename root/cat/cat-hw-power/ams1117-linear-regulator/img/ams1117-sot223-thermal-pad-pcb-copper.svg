<svg viewBox="0 0 960 460" width="960" height="460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">AMS1117 (SOT-223) Thermal Pad and Vias Layout</text>
  <text x="480" y="65" font-size="13" fill="#6b7280" text-anchor="middle">Heat dissipation path from the central Tab to PCB copper layers using thermal vias</text>

  <!-- Left: Top View -->
  <text x="240" y="110" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Top View (PCB Footprint)</text>
  
  <!-- Top Copper Polygon -->
  <rect x="140" y="130" width="200" height="200" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="240" y="150" font-size="13" fill="#2457d6" text-anchor="middle">Top Copper Polygon</text>

  <!-- Vias Array -->
  <circle cx="160" cy="170" r="4" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="185" cy="170" r="4" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="210" cy="170" r="4" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="235" cy="170" r="4" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="260" cy="170" r="4" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="285" cy="170" r="4" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="310" cy="170" r="4" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>

  <circle cx="160" cy="195" r="4" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="185" cy="195" r="4" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="210" cy="195" r="4" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="235" cy="195" r="4" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="260" cy="195" r="4" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="285" cy="195" r="4" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="310" cy="195" r="4" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>

  <circle cx="160" cy="220" r="4" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="185" cy="220" r="4" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="210" cy="220" r="4" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="235" cy="220" r="4" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="260" cy="220" r="4" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="285" cy="220" r="4" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="310" cy="220" r="4" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>

  <circle cx="160" cy="245" r="4" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="185" cy="245" r="4" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="210" cy="245" r="4" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="235" cy="245" r="4" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="260" cy="245" r="4" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="285" cy="245" r="4" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="310" cy="245" r="4" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Component Footprint -->
  <rect x="190" y="260" width="100" height="40" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5" rx="2"/>
  <text x="240" y="285" font-size="13" fill="#1a1a1a" text-anchor="middle">Tab (VOUT)</text>

  <rect x="190" y="370" width="20" height="30" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5" rx="2"/>
  <rect x="230" y="370" width="20" height="30" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5" rx="2"/>
  <rect x="270" y="370" width="20" height="30" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5" rx="2"/>
  
  <text x="200" y="415" font-size="12" fill="#1a1a1a" text-anchor="middle">GND</text>
  <text x="240" y="415" font-size="12" fill="#1a1a1a" text-anchor="middle">VOUT</text>
  <text x="280" y="415" font-size="12" fill="#1a1a1a" text-anchor="middle">VIN</text>

  <rect x="170" y="285" width="140" height="70" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4 4" rx="4"/>
  <text x="240" y="325" font-size="13" fill="#6b7280" text-anchor="middle">AMS1117 Body</text>

  <line x1="320" y1="205" x2="350" y2="205" stroke="#1a1a1a" stroke-width="1"/>
  <text x="355" y="210" font-size="13" fill="#1a1a1a" text-anchor="start">Thermal Vias</text>

  <!-- Right: Cross Section View -->
  <text x="700" y="110" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Cross-Section View</text>

  <!-- PCB Layers -->
  <rect x="480" y="230" width="460" height="90" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <rect x="480" y="220" width="460" height="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="480" y="320" width="460" height="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Component Body -->
  <rect x="600" y="140" width="120" height="60" fill="#1a1a1a" rx="4"/>
  <text x="660" y="175" font-size="14" font-weight="bold" fill="#f4f6f8" text-anchor="middle">AMS1117</text>

  <!-- Component Pins & Tab -->
  <path d="M 710 180 L 760 180 L 760 216 L 710 216 Z" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <path d="M 580 190 L 610 190 L 610 216 L 580 216 Z" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Solder Paste -->
  <rect x="710" y="216" width="50" height="4" fill="#6b7280"/>
  <rect x="580" y="216" width="30" height="4" fill="#6b7280"/>

  <!-- Thermal Vias in FR4 -->
  <path d="M 720 220 h 6 v 100 h -6 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M 735 220 h 6 v 100 h -6 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M 750 220 h 6 v 100 h -6 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Heat Flow Arrows -->
  <path d="M 735 185 L 735 205" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  
  <path d="M 723 240 L 723 300" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 738 240 L 738 300" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 753 240 L 753 300" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>

  <path d="M 680 225 L 520 225" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 780 225 L 900 225" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  
  <path d="M 690 325 L 520 325" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 780 325 L 900 325" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Labels for Cross-section -->
  <text x="470" y="229" font-size="13" fill="#1a1a1a" text-anchor="end">Top Copper</text>
  <text x="470" y="280" font-size="13" fill="#1a1a1a" text-anchor="end">FR4 Substrate</text>
  <text x="470" y="329" font-size="13" fill="#1a1a1a" text-anchor="end">Bottom Copper</text>

  <line x1="790" y1="275" x2="760" y2="275" stroke="#1a1a1a" stroke-width="1"/>
  <text x="800" y="280" font-size="13" fill="#1a1a1a" text-anchor="start">Thermal Vias</text>

  <text x="840" y="355" font-size="13" fill="#2457d6" text-anchor="middle">Heat Dissipation</text>
</svg>
