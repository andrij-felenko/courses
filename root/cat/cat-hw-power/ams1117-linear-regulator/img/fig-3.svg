<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="720" height="360" fill="white"/>

  <text x="360" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема включення AMS1117-ADJ</text>
  <text x="360" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Розрахунок вихідної напруги за допомогою зовнішнього дільника</text>

  <!-- Вхідні та вихідні лінії -->
  <line x1="195" y1="160" x2="300" y2="160" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="420" y1="160" x2="525" y2="160" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="360" y1="200" x2="360" y2="240" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Мікросхема AMS1117 -->
  <rect x="300" y="130" width="120" height="70" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="360" y="165" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">AMS1117</text>
  <text x="308" y="150" font-size="12" fill="#1a1a1a" text-anchor="start">IN</text>
  <text x="412" y="150" font-size="12" fill="#1a1a1a" text-anchor="end">OUT</text>
  <text x="360" y="190" font-size="12" fill="#1a1a1a" text-anchor="middle">ADJ</text>

  <!-- Підписи напруг -->
  <text x="185" y="164" font-size="14" fill="#1a1a1a" text-anchor="end">VIN</text>
  <text x="535" y="164" font-size="14" fill="#1a1a1a" text-anchor="start">VOUT</text>

  <!-- Дільник напруги (R1 та R2) -->
  <line x1="440" y1="160" x2="440" y2="240" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="440" y1="240" x2="420" y2="240" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="380" y="230" width="40" height="20" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="400" y="222" font-size="12" fill="#1a1a1a" text-anchor="middle">R1</text>
  <line x1="380" y1="240" x2="360" y2="240" stroke="#1a1a1a" stroke-width="2"/>

  <line x1="360" y1="240" x2="360" y2="260" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="350" y="260" width="20" height="40" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="380" y="284" font-size="12" fill="#1a1a1a" text-anchor="start">R2</text>
  <line x1="360" y1="300" x2="360" y2="310" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Вхідний конденсатор (Cin) -->
  <line x1="250" y1="160" x2="250" y2="190" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="235" y1="190" x2="265" y2="190" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="235" y1="195" x2="265" y2="195" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="250" y1="195" x2="250" y2="260" stroke="#1a1a1a" stroke-width="2"/>
  <text x="225" y="195" font-size="12" fill="#1a1a1a" text-anchor="end">Cin</text>

  <!-- Вихідний конденсатор (Cout) -->
  <line x1="470" y1="160" x2="470" y2="190" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="455" y1="190" x2="485" y2="190" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="455" y1="195" x2="485" y2="195" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="470" y1="195" x2="470" y2="260" stroke="#1a1a1a" stroke-width="2"/>
  <text x="495" y="195" font-size="12" fill="#1a1a1a" text-anchor="start">Cout</text>

  <!-- Земля -->
  <g stroke="#1a1a1a" stroke-width="2">
    <!-- Земля R2 -->
    <line x1="350" y1="310" x2="370" y2="310"/>
    <line x1="355" y1="315" x2="365" y2="315"/>
    <line x1="358" y1="320" x2="362" y2="320"/>
    <!-- Земля Cin -->
    <line x1="240" y1="260" x2="260" y2="260"/>
    <line x1="245" y1="265" x2="255" y2="265"/>
    <line x1="248" y1="270" x2="252" y2="270"/>
    <!-- Земля Cout -->
    <line x1="460" y1="260" x2="480" y2="260"/>
    <line x1="465" y1="265" x2="475" y2="265"/>
    <line x1="468" y1="270" x2="472" y2="270"/>
  </g>

  <!-- Вузли з'єднань -->
  <circle cx="250" cy="160" r="3" fill="#1a1a1a"/>
  <circle cx="440" cy="160" r="3" fill="#1a1a1a"/>
  <circle cx="470" cy="160" r="3" fill="#1a1a1a"/>
  <circle cx="360" cy="240" r="3" fill="#1a1a1a"/>

  <!-- Формула -->
  <text x="360" y="340" font-size="14" fill="#1a1a1a" text-anchor="middle">VOUT = 1.25V × (1 + R2/R1) + IADJ × R2</text>
</svg>
