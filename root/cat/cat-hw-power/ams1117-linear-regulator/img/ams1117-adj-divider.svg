<svg viewBox="0 0 720 360" width="720" height="360" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="360" fill="white"/>

  <!-- Заголовок -->
  <text x="360" y="25" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема дільника напруги AMS1117 ADJ</text>
  <text x="360" y="45" font-size="13" fill="#6b7280" text-anchor="middle">Струми зворотного зв'язку через R1 та вивід ADJ визначають вихідну напругу</text>

  <!-- Мікросхема AMS1117 -->
  <rect x="240" y="70" width="160" height="90" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="320" y="115" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">AMS1117</text>
  
  <text x="250" y="115" font-size="13" fill="#1a1a1a" text-anchor="start">IN</text>
  <text x="390" y="115" font-size="13" fill="#1a1a1a" text-anchor="end">OUT</text>
  <text x="320" y="150" font-size="13" fill="#1a1a1a" text-anchor="middle">ADJ</text>

  <!-- Вхідна частина -->
  <line x1="120" y1="110" x2="240" y2="110" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="120" cy="110" r="4" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="120" y="95" font-size="14" fill="#1a1a1a" text-anchor="middle">V<tspan dy="3" font-size="11">IN</tspan></text>

  <!-- Вихідна частина -->
  <line x1="400" y1="110" x2="600" y2="110" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="600" cy="110" r="4" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="600" y="95" font-size="14" fill="#1a1a1a" text-anchor="middle">V<tspan dy="3" font-size="11">OUT</tspan></text>

  <!-- Дільник напруги: Вузол OUT -->
  <circle cx="480" cy="110" r="4" fill="#1a1a1a"/>
  
  <!-- Дільник напруги: R1 -->
  <line x1="480" y1="110" x2="480" y2="150" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="470" y="150" width="20" height="50" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="505" y="175" font-size="14" fill="#1a1a1a">R<tspan dy="3" font-size="11">1</tspan></text>
  <text x="505" y="195" font-size="13" fill="#6b7280">V<tspan dy="3" font-size="10">REF</tspan><tspan dy="-3" font-size="13"> = 1.25 V</tspan></text>
  <line x1="480" y1="200" x2="480" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="480" y1="230" x2="320" y2="230" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Зв'язок ADJ з дільником -->
  <line x1="320" y1="160" x2="320" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="320" cy="230" r="4" fill="#1a1a1a"/>

  <!-- Дільник напруги: R2 -->
  <line x1="320" y1="230" x2="320" y2="260" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="310" y="260" width="20" height="50" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Стрілка підлаштовного резистора -->
  <line x1="295" y1="315" x2="345" y2="255" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  
  <text x="360" y="285" font-size="14" fill="#1a1a1a">R<tspan dy="3" font-size="11">2</tspan></text>
  <text x="360" y="305" font-size="13" fill="#6b7280">Підлаштовний</text>
  
  <line x1="320" y1="310" x2="320" y2="330" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Земля (GND) -->
  <line x1="305" y1="330" x2="335" y2="330" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="312" y1="335" x2="328" y2="335" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="318" y1="340" x2="322" y2="340" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Струм I_1 -->
  <line x1="450" y1="160" x2="450" y2="190" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="440" y="180" font-size="13" fill="#2457d6" text-anchor="end">I<tspan dy="3" font-size="10">1</tspan></text>

  <!-- Струм I_ADJ -->
  <line x1="295" y1="180" x2="295" y2="210" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="285" y="200" font-size="13" fill="#2457d6" text-anchor="end">I<tspan dy="3" font-size="10">ADJ</tspan></text>

  <!-- Струм I_1 + I_ADJ -->
  <line x1="285" y1="270" x2="285" y2="300" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="275" y="290" font-size="13" fill="#2457d6" text-anchor="end">I<tspan dy="3" font-size="10">1</tspan><tspan dy="-3" font-size="13"> + I</tspan><tspan dy="3" font-size="10">ADJ</tspan></text>

</svg>
