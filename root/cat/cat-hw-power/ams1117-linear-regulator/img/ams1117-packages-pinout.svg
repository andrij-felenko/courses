<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок -->
  <text x="480" y="50" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Лінійний стабілізатор AMS1117: Корпуси та виводи (Pinout)</text>
  <text x="480" y="75" font-size="13" fill="#6b7280" text-anchor="middle">У корпусах SOT-223 і TO-252 металева площадка (Tab) завжди з'єднана з виводом VOUT</text>

  <!-- ================= SOT-223 ================= -->
  <!-- Tab -->
  <rect x="130" y="170" width="60" height="30" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <line x1="160" y1="155" x2="160" y2="168" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <text x="160" y="150" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Tab = VOUT</text>

  <!-- Pins -->
  <rect x="105" y="270" width="20" height="30" rx="1" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <rect x="150" y="270" width="20" height="30" rx="1" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <rect x="195" y="270" width="20" height="30" rx="1" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <!-- Body -->
  <rect x="100" y="200" width="120" height="70" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="160" y="242" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">SOT-223</text>

  <!-- Pin Numbers -->
  <text x="115" y="290" font-size="12" fill="#1a1a1a" text-anchor="middle">1</text>
  <text x="160" y="290" font-size="12" fill="#1a1a1a" text-anchor="middle">2</text>
  <text x="205" y="290" font-size="12" fill="#1a1a1a" text-anchor="middle">3</text>

  <!-- Labels below -->
  <text x="160" y="350" font-size="14" fill="#1a1a1a" text-anchor="middle">1 — GND / ADJ</text>
  <text x="160" y="370" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">2 — VOUT</text>
  <text x="160" y="390" font-size="14" fill="#1a1a1a" text-anchor="middle">3 — VIN</text>

  <!-- ================= TO-252 ================= -->
  <!-- Tab -->
  <rect x="440" y="150" width="80" height="40" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <line x1="480" y1="135" x2="480" y2="148" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <text x="480" y="130" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Tab = VOUT</text>

  <!-- Pins -->
  <rect x="435" y="280" width="20" height="40" rx="1" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <rect x="470" y="280" width="20" height="20" rx="1" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <rect x="505" y="280" width="20" height="40" rx="1" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <!-- Body -->
  <rect x="420" y="190" width="120" height="90" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="480" y="235" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">TO-252</text>
  <text x="480" y="255" font-size="12" fill="#6b7280" text-anchor="middle">(DPAK)</text>

  <!-- Pin Numbers -->
  <text x="445" y="305" font-size="12" fill="#1a1a1a" text-anchor="middle">1</text>
  <text x="480" y="295" font-size="12" fill="#1a1a1a" text-anchor="middle">2</text>
  <text x="515" y="305" font-size="12" fill="#1a1a1a" text-anchor="middle">3</text>

  <!-- Labels below -->
  <text x="480" y="350" font-size="14" fill="#1a1a1a" text-anchor="middle">1 — GND / ADJ</text>
  <text x="480" y="370" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">2 — VOUT</text>
  <text x="480" y="390" font-size="14" fill="#1a1a1a" text-anchor="middle">3 — VIN</text>

  <!-- ================= SO-8 ================= -->
  <!-- Pins Left -->
  <rect x="720" y="190" width="30" height="10" rx="1" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <rect x="720" y="215" width="30" height="10" rx="1" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <rect x="720" y="240" width="30" height="10" rx="1" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <rect x="720" y="265" width="30" height="10" rx="1" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <!-- Pins Right -->
  <rect x="850" y="190" width="30" height="10" rx="1" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
  <rect x="850" y="215" width="30" height="10" rx="1" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <rect x="850" y="240" width="30" height="10" rx="1" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <rect x="850" y="265" width="30" height="10" rx="1" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>

  <!-- Body -->
  <rect x="750" y="170" width="100" height="130" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <circle cx="765" cy="185" r="4" fill="#d0d7de"/>
  <text x="800" y="235" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">SO-8</text>
  <text x="800" y="255" font-size="12" fill="#6b7280" text-anchor="middle">(Без Tab)</text>

  <!-- Pin Numbers -->
  <text x="760" y="199" font-size="12" fill="#1a1a1a">1</text>
  <text x="760" y="224" font-size="12" fill="#1a1a1a">2</text>
  <text x="760" y="249" font-size="12" fill="#1a1a1a">3</text>
  <text x="760" y="274" font-size="12" fill="#1a1a1a">4</text>

  <text x="840" y="199" font-size="12" fill="#1a1a1a" text-anchor="end">8</text>
  <text x="840" y="224" font-size="12" fill="#1a1a1a" text-anchor="end">7</text>
  <text x="840" y="249" font-size="12" fill="#1a1a1a" text-anchor="end">6</text>
  <text x="840" y="274" font-size="12" fill="#1a1a1a" text-anchor="end">5</text>

  <!-- Pin Labels -->
  <text x="710" y="199" font-size="12" fill="#1a1a1a" text-anchor="end">GND / ADJ</text>
  <text x="710" y="224" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">VOUT</text>
  <text x="710" y="249" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">VOUT</text>
  <text x="710" y="274" font-size="12" fill="#1a1a1a" text-anchor="end">VIN</text>

  <text x="890" y="199" font-size="12" fill="#1a1a1a" text-anchor="start">NC</text>
  <text x="890" y="224" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">VOUT</text>
  <text x="890" y="249" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">VOUT</text>
  <text x="890" y="274" font-size="12" fill="#1a1a1a" text-anchor="start">NC</text>
</svg>
