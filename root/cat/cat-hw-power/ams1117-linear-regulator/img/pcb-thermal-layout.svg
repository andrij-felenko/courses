<svg viewBox="0 0 720 460" width="720" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="720" height="460" fill="white"/>
  
  <text x="360" y="35" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Трасування друкованої плати для AMS1117 (SOT-223)</text>
  <text x="360" y="55" font-size="13" fill="#6b7280" text-anchor="middle">Великий мідний полігон відводить тепло, а конденсатори розташовані впритул до виводів</text>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- PCB Base -->
  <rect x="50" y="80" width="340" height="340" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>

  <!-- Copper Areas -->
  <!-- VOUT Thermal Polygon -->
  <path d="M 80 100 L 360 100 L 360 245 L 240 245 L 240 340 L 200 340 L 200 245 L 80 245 Z" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  
  <!-- GND Trace -->
  <rect x="80" y="275" width="110" height="120" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  
  <!-- VIN Trace -->
  <rect x="250" y="285" width="110" height="110" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>

  <!-- Thermal Vias -->
  <g fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5">
    <circle cx="110" cy="130" r="4"/><circle cx="150" cy="130" r="4"/><circle cx="190" cy="130" r="4"/><circle cx="230" cy="130" r="4"/><circle cx="270" cy="130" r="4"/><circle cx="310" cy="130" r="4"/>
    <circle cx="110" cy="170" r="4"/><circle cx="150" cy="170" r="4"/><circle cx="190" cy="170" r="4"/><circle cx="230" cy="170" r="4"/><circle cx="270" cy="170" r="4"/><circle cx="310" cy="170" r="4"/>
    <circle cx="110" cy="210" r="4"/><circle cx="150" cy="210" r="4"/>
  </g>

  <!-- Copper Pads (SOT-223) -->
  <rect x="185" y="230" width="70" height="25" rx="2" fill="#d0d7de" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="170" y="300" width="20" height="35" rx="2" fill="#d0d7de" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="210" y="300" width="20" height="35" rx="2" fill="#d0d7de" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="250" y="300" width="20" height="35" rx="2" fill="#d0d7de" stroke="#6b7280" stroke-width="1.5"/>

  <!-- SOT-223 Body -->
  <rect x="175" y="255" width="90" height="45" rx="3" fill="#1a1a1a"/>
  <text x="220" y="275" font-size="14" fill="#f4f6f8" text-anchor="middle" font-weight="bold">AMS1117</text>
  <text x="220" y="290" font-size="12" fill="#d0d7de" text-anchor="middle">3.3V</text>

  <!-- C_OUT -->
  <rect x="100" y="220" width="30" height="25" rx="2" fill="#d0d7de" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="100" y="275" width="30" height="25" rx="2" fill="#d0d7de" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="105" y="245" width="20" height="30" fill="#6b7280"/>
  <text x="95" y="265" font-size="12" fill="#1a1a1a" text-anchor="end">C_OUT</text>

  <!-- C_IN -->
  <rect x="165" y="355" width="25" height="30" rx="2" fill="#d0d7de" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="250" y="355" width="25" height="30" rx="2" fill="#d0d7de" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="190" y="360" width="60" height="20" fill="#6b7280"/>
  <text x="220" y="374" font-size="12" fill="#f4f6f8" text-anchor="middle">C_IN</text>

  <!-- Trace Labels -->
  <text x="135" y="325" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">GND</text>
  <text x="305" y="325" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">VIN</text>

  <!-- Pointers & Explanations -->
  <!-- Thermal Polygon -->
  <line x1="410" y1="135" x2="350" y2="135" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="420" y="125" font-size="14" font-weight="bold" fill="#27ae60">Тепловідвідний полігон (VOUT)</text>
  <text x="420" y="155" font-size="13" fill="#1a1a1a">Значна площа міді для розсіювання</text>
  <text x="420" y="175" font-size="13" fill="#1a1a1a">тепла від лінійного стабілізатора.</text>

  <!-- C_OUT -->
  <polyline points="410,230 115,230 115,240" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="420" y="220" font-size="14" font-weight="bold" fill="#1a1a1a">Вихідний конденсатор (C_OUT)</text>
  <text x="420" y="250" font-size="13" fill="#1a1a1a">Розташований максимально близько до</text>
  <text x="420" y="270" font-size="13" fill="#1a1a1a">виводу VOUT для стабільності напруги.</text>

  <!-- C_IN -->
  <line x1="410" y1="370" x2="265" y2="370" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="420" y="360" font-size="14" font-weight="bold" fill="#1a1a1a">Вхідний конденсатор (C_IN)</text>
  <text x="420" y="390" font-size="13" fill="#1a1a1a">Підключений прямо до виводу VIN,</text>
  <text x="420" y="410" font-size="13" fill="#1a1a1a">мінімізує індуктивність ліній.</text>

</svg>
