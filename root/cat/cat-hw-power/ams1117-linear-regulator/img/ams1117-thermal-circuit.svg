<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="45" font-size="18" fill="#1a1a1a" font-weight="bold" text-anchor="middle">Еквівалентна теплова схема лінійного стабілізатора AMS1117</text>
  <text x="480" y="70" font-size="13" fill="#6b7280" text-anchor="middle">Площа мідного полігону визначає загальний тепловий опір та захищає кристал від перегріву</text>

  <!-- Маркери -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Панелі (Тло зон) -->
  <rect x="150" y="100" width="265" height="190" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="165" y="125" font-size="14" fill="#6b7280" font-weight="bold">AMS1117</text>

  <rect x="430" y="100" width="195" height="190" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="445" y="125" font-size="14" fill="#2457d6" font-weight="bold">Мідний полігон</text>

  <rect x="640" y="100" width="190" height="190" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="655" y="125" font-size="14" fill="#6b7280" font-weight="bold">Навколишнє середовище</text>

  <!-- Електричне коло -->
  <g fill="none" stroke="#1a1a1a" stroke-width="2">
    <!-- Провідники та резистори (Y=200) -->
    <path d="M 220 200 L 280 200 L 285 185 L 295 215 L 305 185 L 315 215 L 320 200 L 380 200"/>
    <path d="M 380 200 L 460 200 L 465 185 L 475 215 L 485 185 L 495 215 L 500 200 L 580 200"/>
    <path d="M 580 200 L 640 200 L 645 185 L 655 215 L 665 185 L 675 215 L 680 200 L 740 200"/>

    <!-- Вертикальні провідники до джерел -->
    <line x1="220" y1="200" x2="220" y2="320"/>
    <line x1="220" y1="360" x2="220" y2="400"/>
    <line x1="740" y1="200" x2="740" y2="320"/>
    <line x1="740" y1="360" x2="740" y2="400"/>

    <!-- Лінія землі -->
    <line x1="220" y1="400" x2="740" y2="400"/>

    <!-- Символ землі -->
    <line x1="480" y1="400" x2="480" y2="420"/>
    <line x1="465" y1="420" x2="495" y2="420"/>
    <line x1="472" y1="426" x2="488" y2="426"/>
    <line x1="477" y1="432" x2="483" y2="432"/>
  </g>

  <!-- Контури джерел (з білим тлом) -->
  <circle cx="220" cy="340" r="20" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="740" cy="340" r="20" fill="white" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Внутрішні елементи джерел -->
  <line x1="220" y1="352" x2="220" y2="328" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  
  <text x="740" y="334" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">+</text>
  <text x="740" y="354" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="bold">−</text>

  <!-- Вузли -->
  <circle cx="220" cy="200" r="4" fill="#1a1a1a"/>
  <circle cx="380" cy="200" r="4" fill="#1a1a1a"/>
  <circle cx="580" cy="200" r="4" fill="#1a1a1a"/>
  <circle cx="740" cy="200" r="4" fill="#1a1a1a"/>

  <!-- Підписи вузлів -->
  <text x="220" y="165" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">T<tspan dy="3" font-size="11">J</tspan></text>
  <text x="220" y="145" font-size="12" fill="#6b7280" text-anchor="middle">Кристал</text>

  <text x="380" y="165" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">T<tspan dy="3" font-size="11">C</tspan></text>
  <text x="380" y="145" font-size="12" fill="#6b7280" text-anchor="middle">Корпус</text>

  <text x="580" y="165" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">T<tspan dy="3" font-size="11">B</tspan></text>
  <text x="580" y="145" font-size="12" fill="#6b7280" text-anchor="middle">Плата</text>

  <text x="740" y="165" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="bold">T<tspan dy="3" font-size="11">A</tspan></text>
  <text x="740" y="145" font-size="12" fill="#6b7280" text-anchor="middle">Повітря</text>

  <!-- Підписи резисторів -->
  <text x="300" y="245" font-size="14" fill="#1a1a1a" text-anchor="middle">θ<tspan dy="3" font-size="11">JC</tspan></text>
  <text x="300" y="265" font-size="12" fill="#6b7280" text-anchor="middle">Кристал-корпус</text>

  <text x="480" y="245" font-size="14" fill="#1a1a1a" text-anchor="middle">θ<tspan dy="3" font-size="11">CB</tspan></text>
  <text x="480" y="265" font-size="12" fill="#6b7280" text-anchor="middle">Корпус-плата</text>

  <text x="660" y="245" font-size="14" fill="#1a1a1a" text-anchor="middle">θ<tspan dy="3" font-size="11">BA</tspan></text>
  <text x="660" y="265" font-size="12" fill="#6b7280" text-anchor="middle">Плата-повітря</text>

  <!-- Підписи джерел -->
  <text x="250" y="340" font-size="14" fill="#1a1a1a" text-anchor="start">P<tspan dy="3" font-size="11">D</tspan></text>
  <text x="250" y="360" font-size="12" fill="#6b7280" text-anchor="start">Потужність</text>

  <text x="710" y="340" font-size="14" fill="#1a1a1a" text-anchor="end">T<tspan dy="3" font-size="11">A</tspan></text>
  <text x="710" y="360" font-size="12" fill="#6b7280" text-anchor="end">Середовище</text>
</svg>
