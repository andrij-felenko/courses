<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Підкладка -->
  <rect x="0" y="0" width="720" height="460" fill="white"/>

  <!-- Заголовок -->
  <text x="360" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема підключення AMS1117-ADJ</text>
  <text x="360" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Розподіл струмів і напруг у резистивному дільнику</text>

  <!-- Блок регулятора AMS1117 -->
  <rect x="220" y="120" width="140" height="90" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="290" y="160" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">AMS1117</text>
  <text x="290" y="180" text-anchor="middle" font-size="13" fill="#6b7280">LDO</text>
  <text x="228" y="154" text-anchor="start" font-size="12" fill="#6b7280">IN</text>
  <text x="352" y="154" text-anchor="end" font-size="12" fill="#6b7280">OUT</text>
  <text x="290" y="202" text-anchor="middle" font-size="12" fill="#6b7280">ADJ</text>

  <!-- Лінії підключення та компоненти -->
  <!-- IN -->
  <line x1="100" y1="150" x2="220" y2="150" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="100" cy="150" r="4" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="90" y="145" text-anchor="end" font-size="14" fill="#1a1a1a" font-style="italic">V<tspan font-style="normal" baseline-shift="sub" font-size="11">IN</tspan></text>

  <!-- OUT -->
  <line x1="360" y1="150" x2="580" y2="150" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="580" cy="150" r="4" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="590" y="145" text-anchor="start" font-size="14" fill="#1a1a1a" font-style="italic">V<tspan font-style="normal" baseline-shift="sub" font-size="11">OUT</tspan></text>

  <!-- ADJ та резистори -->
  <polyline points="290,210 290,270 460,270" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  
  <line x1="460" y1="150" x2="460" y2="180" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="450" y="180" width="20" height="60" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="460" y1="240" x2="460" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="450" y="300" width="20" height="60" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="460" y1="360" x2="460" y2="390" stroke="#1a1a1a" stroke-width="2"/>

  <text x="480" y="214" text-anchor="start" font-size="14" fill="#1a1a1a" font-style="italic">R<tspan font-style="normal" baseline-shift="sub" font-size="11">1</tspan></text>
  <text x="480" y="334" text-anchor="start" font-size="14" fill="#1a1a1a" font-style="italic">R<tspan font-style="normal" baseline-shift="sub" font-size="11">2</tspan></text>

  <!-- GND -->
  <line x1="440" y1="390" x2="480" y2="390" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="446" y1="396" x2="474" y2="396" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="452" y1="402" x2="468" y2="402" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Вузли (точки) -->
  <circle cx="460" cy="150" r="4" fill="#1a1a1a"/>
  <circle cx="460" cy="270" r="4" fill="#1a1a1a"/>

  <!-- Струми -->
  <!-- I_R1 -->
  <line x1="435" y1="190" x2="435" y2="230" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="425" y="214" text-anchor="end" font-size="14" fill="#2457d6" font-style="italic">I<tspan font-style="normal" baseline-shift="sub" font-size="11">R1</tspan></text>

  <!-- I_R2 -->
  <line x1="435" y1="310" x2="435" y2="350" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="425" y="334" text-anchor="end" font-size="14" fill="#2457d6" font-style="italic">I<tspan font-style="normal" baseline-shift="sub" font-size="11">R2</tspan></text>

  <!-- I_ADJ -->
  <line x1="340" y1="260" x2="380" y2="260" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="360" y="252" text-anchor="middle" font-size="14" fill="#2457d6" font-style="italic">I<tspan font-style="normal" baseline-shift="sub" font-size="11">ADJ</tspan></text>

  <!-- Напруга V_REF -->
  <line x1="470" y1="150" x2="540" y2="150" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="470" y1="270" x2="540" y2="270" stroke="#d0d7de" stroke-width="1.5"/>
  
  <line x1="520" y1="200" x2="520" y2="155" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="520" y1="220" x2="520" y2="265" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="520" y="214" text-anchor="middle" font-size="14" fill="#27ae60" font-style="italic">V<tspan font-style="normal" baseline-shift="sub" font-size="11">REF</tspan></text>

</svg>
