<rect x="29.9" y="432.5" width="860.2" height="31.0" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="460.0" y="451.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="460.0" dy="0.0">Контролер щодвадцять мілісекунд шле один імпульс. Його ТРИВАЛІСТЬ (не висота, не частота кадру) і є командою кута: 1 мс, 1.5 мс, 2 мс.</tspan></text>
