<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="720" height="340" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="360.0" y="26.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Куди BEC подає 5 В: середній контакт роз'єму</text>
<text x="360.0" y="52.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Стандартний 3-контактний роз'єм (JR/Futaba). BEC заганяє 5 В у СЕРЕДНІЙ контакт — спільну плюсову шину приймача.</text>
<rect x="250.0" y="110.0" width="220.0" height="90.0" rx="8" fill="#2b2b2b" stroke="#111" stroke-width="2.0"/>
<rect x="268.7" y="194.0" width="36.0" height="40.0" rx="4" fill="#27ae60" stroke="#333" stroke-width="1.2"/>
<text x="286.7" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#f4f6f8" text-anchor="middle" font-weight="700">S</text>
<text x="286.7" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#27ae60" text-anchor="middle" font-weight="700">сигнал</text>
<text x="286.7" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">жовт./біл.</text>
<rect x="342.0" y="194.0" width="36.0" height="40.0" rx="4" fill="#c0392b" stroke="#333" stroke-width="1.2"/>
<text x="360.0" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#f4f6f8" text-anchor="middle" font-weight="700">+</text>
<text x="360.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">+5 В</text>
<text x="360.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">черв.</text>
<rect x="415.3" y="194.0" width="36.0" height="40.0" rx="4" fill="#2457d6" stroke="#333" stroke-width="1.2"/>
<text x="433.3" y="161.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="22" fill="#f4f6f8" text-anchor="middle" font-weight="700">−</text>
<text x="433.3" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">земля</text>
<text x="433.3" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">чорн./кор.</text>
<line x1="180.0" y1="155.0" x2="250.0" y2="155.0" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arrow)"/>
<text x="176.0" y="145.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="end" font-weight="700">BEC → +5 В</text>
<text x="176.0" y="167.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="end">у середній контакт</text>
<text x="360.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Усі канали приймача ділять цю одну шину +5 В — тому джерело живлення має бути рівно одне.</text>
</svg>