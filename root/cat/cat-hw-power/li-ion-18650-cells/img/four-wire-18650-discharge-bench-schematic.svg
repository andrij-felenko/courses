<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" font-family="sans-serif">
  <defs>
    <style>
      .thick-wire { fill: none; stroke: #e74c3c; stroke-width: 4; }
      .thick-wire-neg { fill: none; stroke: #34495e; stroke-width: 4; }
      .thin-wire { fill: none; stroke: #e67e22; stroke-width: 2; stroke-dasharray: 6,4; }
      .thin-wire-neg { fill: none; stroke: #2980b9; stroke-width: 2; stroke-dasharray: 6,4; }
      .resistor { fill: none; stroke: #2c3e50; stroke-width: 2; }
      .box { fill: #f8f9fa; stroke: #2c3e50; stroke-width: 2; }
      .bat-body { fill: #2ecc71; stroke: #27ae60; stroke-width: 2; }
      .bat-cap { fill: #bdc3c7; stroke: #7f8c8d; stroke-width: 2; }
      .text-label { font-size: 14px; fill: #2c3e50; }
      .title { font-size: 18px; font-weight: bold; fill: #2c3e50; }
      .term { font-size: 12px; font-weight: bold; fill: #ffffff; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff" />
  <text x="400" y="30" text-anchor="middle" class="title">Схема чотирипровідного підключення 18650 (Схема Кельвіна)</text>

  <!-- Battery -->
  <g transform="translate(100, 150)">
    <rect x="0" y="0" width="160" height="60" rx="5" class="bat-body" />
    <rect x="160" y="15" width="10" height="30" class="bat-cap" />
    <text x="80" y="35" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">Li-ion 18650</text>
    <text x="145" y="35" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">+</text>
    <text x="15" y="35" text-anchor="middle" font-size="16" fill="#fff" font-weight="bold">-</text>
  </g>

  <!-- Battery Terminals (Real) -->
  <circle cx="270" cy="180" r="4" fill="#e74c3c" />
  <circle cx="100" cy="180" r="4" fill="#34495e" />

  <!-- Positive Side Resistors (Contact & Wire) -->
  <g transform="translate(270, 160)">
    <!-- R_contact -->
    <path d="M 0 20 L 20 20 L 25 10 L 35 30 L 45 10 L 55 30 L 60 20 L 80 20" class="resistor" />
    <text x="40" y="5" text-anchor="middle" class="text-label" font-size="12">R_контакту</text>
    
    <!-- R_wire -->
    <path d="M 80 20 L 120 20 L 125 10 L 135 30 L 145 10 L 155 30 L 160 20 L 180 20" class="resistor" />
    <text x="140" y="5" text-anchor="middle" class="text-label" font-size="12">R_дроту</text>

    <!-- Force Wire -->
    <path d="M 180 20 L 330 20" class="thick-wire" />
  </g>

  <!-- Negative Side Resistors (Contact & Wire) -->
  <g transform="translate(-160, 200)">
    <!-- R_contact -->
    <path d="M 180 20 L 200 20 L 205 10 L 215 30 L 225 10 L 235 30 L 240 20 L 260 20" class="resistor" />
    <text x="220" y="45" text-anchor="middle" class="text-label" font-size="12">R_контакту</text>
    
    <!-- R_wire -->
    <path d="M 80 20 L 120 20 L 125 10 L 135 30 L 145 10 L 155 30 L 160 20 L 180 20" class="resistor" />
    <text x="140" y="45" text-anchor="middle" class="text-label" font-size="12">R_дроту</text>

    <!-- Force Wire -->
    <path d="M 80 20 L 40 20 L 40 100 L 760 100 L 760 30" class="thick-wire-neg" />
  </g>

  <!-- Sense Wires -->
  <path d="M 270 180 L 270 260 L 600 260 L 600 210" class="thin-wire" />
  <text x="450" y="250" class="text-label" fill="#e67e22">Sense+ (Вимірювання напруги)</text>
  
  <path d="M 100 180 L 100 280 L 600 280 L 600 230" class="thin-wire-neg" />
  <text x="450" y="295" class="text-label" fill="#2980b9">Sense- (Вимірювання напруги)</text>

  <text x="350" y="170" class="text-label" fill="#e74c3c" font-weight="bold">Force+ (Силовий струм розряду)</text>
  <text x="350" y="315" class="text-label" fill="#34495e" font-weight="bold">Force- (Силовий струм розряду)</text>

  <!-- Electronic Load Box -->
  <g transform="translate(600, 120)">
    <rect x="0" y="0" width="160" height="150" rx="8" class="box" fill="#ecf0f1" />
    <text x="80" y="30" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">Електронне</text>
    <text x="80" y="50" text-anchor="middle" font-size="16" font-weight="bold" fill="#2c3e50">навантаження</text>

    <rect x="-10" y="50" width="20" height="20" fill="#e74c3c" />
    <text x="0" y="65" text-anchor="middle" class="term">F+</text>
    
    <rect x="-10" y="80" width="20" height="20" fill="#e67e22" />
    <text x="0" y="95" text-anchor="middle" class="term">S+</text>

    <rect x="-10" y="110" width="20" height="20" fill="#2980b9" />
    <text x="0" y="125" text-anchor="middle" class="term">S-</text>

    <rect x="-10" y="140" width="20" height="20" fill="#34495e" />
    <text x="0" y="155" text-anchor="middle" class="term">F-</text>
  </g>

</svg>
