<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <defs>
    <!-- Arrow Markers -->
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-red-start" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-green-start" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Еквівалентна схема Li-ion елемента під навантаженням</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Спад напруги на внутрішньому опорі ΔU = I · R_int зменшує напругу на виводах: U_out = E − ΔU</text>

  <!-- Cell Container (Осередок 18650) -->
  <rect x="60" y="95" width="460" height="265" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" stroke-dasharray="6,4" rx="8" ry="8"/>
  <text x="80" y="122" text-anchor="start" font-size="14" font-weight="bold" fill="#1a1a1a">Корпус осередку Li-ion 18650</text>

  <!-- Ideal Voltage Source E -->
  <text x="160" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Джерело ЕРС (E)</text>
  <text x="160" y="165" text-anchor="middle" font-size="12" fill="#6b7280">Ідеальна напруга</text>
  <circle cx="160" cy="230" r="24" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="160" y="222" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">+</text>
  <text x="160" y="246" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">−</text>

  <!-- Wires inside Cell -->
  <!-- From source E top to R_int -->
  <path d="M 160,206 L 160,180 L 250,180" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <!-- From R_int to positive terminal (+) -->
  <path d="M 330,180 L 520,180" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <!-- From source E bottom to negative terminal (-) -->
  <path d="M 160,254 L 160,280 L 520,280" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Internal Resistor R_int -->
  <text x="290" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Внутрішній опір R_int</text>
  <rect x="250" y="168" width="80" height="24" fill="white" stroke="#1a1a1a" stroke-width="2" rx="3" ry="3"/>
  <text x="290" y="184" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">R_int</text>

  <!-- Voltage Drop Delta U callout -->
  <line x1="250" y1="208" x2="330" y2="208" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-red-start)" marker-end="url(#arr-red)"/>
  <text x="290" y="228" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">ΔU = I · R_int</text>
  <text x="290" y="244" text-anchor="middle" font-size="12" fill="#c0392b">(спад напруги)</text>

  <!-- Cell Terminals -->
  <!-- Positive (+) -->
  <circle cx="520" cy="180" r="5" fill="#2457d6"/>
  <text x="505" y="162" text-anchor="end" font-size="14" font-weight="bold" fill="#2457d6">+ (Анод)</text>

  <!-- Negative (-) -->
  <circle cx="520" cy="280" r="5" fill="#1a1a1a"/>
  <text x="505" y="304" text-anchor="end" font-size="14" font-weight="bold" fill="#1a1a1a">− (Катод)</text>

  <!-- Discharge Current Arrow (I) -->
  <line x1="545" y1="155" x2="635" y2="155" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="590" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Струм розряду I</text>

  <!-- Terminal Voltage Measurement (U_out) -->
  <line x1="565" y1="185" x2="565" y2="275" stroke="#27ae60" stroke-width="1.5" marker-start="url(#arr-green-start)" marker-end="url(#arr-green)"/>
  <rect x="578" y="215" width="64" height="30" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4" ry="4"/>
  <text x="610" y="235" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">U_out</text>
  <text x="590" y="304" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">U_out = E − ΔU</text>
  <text x="590" y="322" text-anchor="middle" font-size="12" fill="#1a1a1a">Напруга на виводах</text>

  <!-- Wires connecting cell to load -->
  <!-- Top wire from terminal + to load top -->
  <path d="M 520,180 L 780,180 L 780,195" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Bottom wire from load bottom to terminal - -->
  <path d="M 780,265 L 780,280 L 520,280" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Load Container (Зовнішнє навантаження) -->
  <rect x="660" y="95" width="240" height="265" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="8" ry="8"/>
  <text x="780" y="122" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Навантаження R_L</text>

  <!-- Load Resistor R_L -->
  <rect x="768" y="195" width="24" height="70" fill="white" stroke="#1a1a1a" stroke-width="2" rx="3" ry="3"/>
  <text x="800" y="224" text-anchor="start" font-size="14" font-weight="bold" fill="#1a1a1a">R_L</text>
  <text x="800" y="240" text-anchor="start" font-size="12" fill="#6b7280">Опір споживача</text>

  <!-- Bottom Comparison Cards -->
  <!-- Card 1: High Current (HG2) -->
  <rect x="60" y="380" width="410" height="95" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6" ry="6"/>
  <text x="75" y="402" text-anchor="start" font-size="13" font-weight="bold" fill="#27ae60">Високострумовий осередок (LiitoKala HG2)</text>
  <text x="75" y="422" text-anchor="start" font-size="12" fill="#1a1a1a">• Низький внутрішній опір: R_int ≈ 15–20 мОм</text>
  <text x="75" y="440" text-anchor="start" font-size="12" fill="#1a1a1a">• Малий спад ΔU під навантаженням 15–20 А</text>
  <text x="75" y="458" text-anchor="start" font-size="12" fill="#6b7280">• Вихідна напруга U_out залишається стабільною</text>

  <!-- Card 2: High Capacity (NCR18650B) -->
  <rect x="490" y="380" width="410" height="95" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="6" ry="6"/>
  <text x="505" y="402" text-anchor="start" font-size="13" font-weight="bold" fill="#c0392b">Високоємнісний осередок (Panasonic NCR18650B)</text>
  <text x="505" y="422" text-anchor="start" font-size="12" fill="#1a1a1a">• Вищий внутрішній опір: R_int ≈ 35–50 мОм</text>
  <text x="505" y="440" text-anchor="start" font-size="12" fill="#1a1a1a">• Значний спад ΔU при високому струмі I</text>
  <text x="505" y="458" text-anchor="start" font-size="12" fill="#6b7280">• Відчутне просідання U_out та нагрів (P = I² · R_int)</text>
</svg>
