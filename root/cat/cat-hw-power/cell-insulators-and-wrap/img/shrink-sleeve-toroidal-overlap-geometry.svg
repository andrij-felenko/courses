  <text x="720" y="540" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Після усадки</text>

  <rect x="670" y="160" width="100" height="310" fill="#f4f6f8" stroke="#6b7280" stroke-width="2"/>
  <rect x="705" y="155" width="30" height="5" fill="#eaf0fd" stroke="#6b7280" stroke-width="2"/>
  <line x1="670" y1="158" x2="700" y2="158" stroke="#1a1a1a" stroke-width="4"/>
  <line x1="740" y1="158" x2="770" y2="158" stroke="#1a1a1a" stroke-width="4"/>

  <path d="M 695 155 L 668 155 Q 666 155 666 157 L 666 470 Q 666 472 668 472 L 695 472" fill="none" stroke="#2457d6" stroke-width="4" stroke-linejoin="round"/>
  <path d="M 745 155 L 772 155 Q 774 155 774 157 L 774 470 Q 774 472 772 472 L 745 472" fill="none" stroke="#2457d6" stroke-width="4" stroke-linejoin="round"/>

  <text x="630" y="110" text-anchor="end" font-size="13" font-weight="bold" fill="#27ae60">Тороїдальне перекриття</text>
  <text x="630" y="135" text-anchor="end" font-size="12" fill="#6b7280">надійно фіксує ізолятор</text>
  <line x1="645" y1="115" x2="670" y2="152" stroke="#27ae60" stroke-width="1" marker-end="url(#arr_green)"/>

  <text x="810" y="110" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">Шайба-ізолятор</text>
  <text x="810" y="135" text-anchor="start" font-size="12" fill="#6b7280">захищає від КЗ</text>
  <line x1="795" y1="115" x2="760" y2="152" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr)"/>

