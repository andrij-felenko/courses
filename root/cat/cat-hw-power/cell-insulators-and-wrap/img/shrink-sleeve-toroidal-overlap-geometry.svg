  <line x1="160" y1="115" x2="320" y2="115" stroke="#6b7280" stroke-width="1" marker-start="url(#arr_start_gray)" marker-end="url(#arr_gray)"/>
  <line x1="160" y1="130" x2="160" y2="110" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 2"/>
  <line x1="320" y1="130" x2="320" y2="110" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 2"/>

