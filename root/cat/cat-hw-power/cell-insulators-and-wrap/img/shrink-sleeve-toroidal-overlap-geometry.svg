  <line x1="320" y1="215" x2="295" y2="215" stroke="#2457d6" stroke-width="2" marker-end="url(#arr_blue)"/>
  <line x1="160" y1="315" x2="185" y2="315" stroke="#2457d6" stroke-width="2" marker-end="url(#arr_blue)"/>
  <line x1="320" y1="315" x2="295" y2="315" stroke="#2457d6" stroke-width="2" marker-end="url(#arr_blue)"/>
  <line x1="160" y1="415" x2="185" y2="415" stroke="#2457d6" stroke-width="2" marker-end="url(#arr_blue)"/>
  <line x1="320" y1="415" x2="295" y2="415" stroke="#2457d6" stroke-width="2" marker-end="url(#arr_blue)"/>
  
  <line x1="160" y1="130" x2="185" y2="152" stroke="#2457d6" stroke-width="2" marker-end="url(#arr_blue)"/>
  <line x1="320" y1="130" x2="295" y2="152" stroke="#2457d6" stroke-width="2" marker-end="url(#arr_blue)"/>
  <line x1="160" y1="500" x2="185" y2="478" stroke="#2457d6" stroke-width="2" marker-end="url(#arr_blue)"/>
  <line x1="320" y1="500" x2="295" y2="478" stroke="#2457d6" stroke-width="2" marker-end="url(#arr_blue)"/>

  <text x="480" y="285" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Термоусадка</text>
