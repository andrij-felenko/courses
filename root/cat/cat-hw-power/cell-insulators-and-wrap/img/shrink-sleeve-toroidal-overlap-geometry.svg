  <rect x="225" y="155" width="30" height="5" fill="#eaf0fd" stroke="#6b7280" stroke-width="2"/>
  <line x1="190" y1="158" x2="220" y2="158" stroke="#1a1a1a" stroke-width="4"/>
  <line x1="260" y1="158" x2="290" y2="158" stroke="#1a1a1a" stroke-width="4"/>
  
