  <text x="480" y="66" text-anchor="middle" font-size="13" fill="#6b7280">Радіальне стиснення фіксує плівку на циліндрі та створює тороїдальне перекриття на торцях</text>

  <text x="240" y="540" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">До усадки</text>

