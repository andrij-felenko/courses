<svg viewBox="0 0 960 460" width="960" height="460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <pattern id="jelly" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M-1,1 l2,-2 M0,10 l10,-10 M9,11 l2,-2" stroke="#d0d7de" stroke-width="1"/>
    </pattern>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Розріз 18650: ізоляція плюсового контакту</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Діелектрична шайба запобігає замиканню нікелевої стрічки на мінусовий корпус</text>

  <rect x="330" y="310" width="300" height="90" fill="url(#jelly)"/>
  
  <path d="M 320,400 L 320,240 L 360,240 L 360,250 L 330,250 L 330,400 Z" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>
  <path d="M 640,400 L 640,240 L 600,240 L 600,250 L 630,250 L 630,400 Z" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>

  <path d="M 320,400 L 640,400" stroke="#6b7280" stroke-width="2" stroke-dasharray="4 4"/>

  <path d="M 360,240 L 380,240 L 380,310 L 330,310 L 330,250 L 360,250 Z" fill="#6b7280"/>
  <path d="M 600,240 L 580,240 L 580,310 L 630,310 L 630,250 L 600,250 Z" fill="#6b7280"/>
  
  <path d="M 380,280 L 430,280 L 430,232 L 530,232 L 530,280 L 580,280 L 580,300 L 380,300 Z" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="400" y1="280" x2="415" y2="280" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="545" y1="280" x2="560" y2="280" stroke="#1a1a1a" stroke-width="2"/>

  <path d="M 316,400 L 316,236 L 340,236 L 340,240 L 320,240 L 320,400 Z" fill="#2457d6"/>
  <path d="M 644,400 L 644,236 L 620,236 L 620,240 L 640,240 L 640,400 Z" fill="#2457d6"/>

  <rect x="316" y="232" width="109" height="8" fill="#27ae60"/>
  <rect x="535" y="232" width="109" height="8" fill="#27ae60"/>

  <rect x="220" y="226" width="310" height="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

  <circle cx="460" cy="229" r="2" fill="#1a1a1a"/>
  <circle cx="500" cy="229" r="2" fill="#1a1a1a"/>
  
  <circle cx="330" cy="240" r="14" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="3 3"/>

  <path d="M 200,229 L 218,229" fill="none" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="190" y="234" text-anchor="end" font-size="14" fill="#1a1a1a">Нікелева стрічка</text>

  <path d="M 280,170 L 330,170 L 370,232" fill="none" stroke="#27ae60" stroke-width="1" marker-end="url(#arr-green)"/>
  <text x="270" y="165" text-anchor="end" font-size="14" font-weight="bold" fill="#27ae60">Діелектрична шайба</text>
  <text x="270" y="185" text-anchor="end" font-size="13" fill="#27ae60">товщина 0.2–0.4 мм</text>

  <path d="M 210,310 L 260,310 L 320,248" fill="none" stroke="#c0392b" stroke-width="1" marker-end="url(#arr-red)"/>
  <text x="200" y="305" text-anchor="end" font-size="14" font-weight="bold" fill="#c0392b">Зона ризику КЗ</text>
  <text x="200" y="325" text-anchor="end" font-size="13" fill="#c0392b">при продавлюванні</text>

  <path d="M 250,350 L 314,350" fill="none" stroke="#2457d6" stroke-width="1" marker-end="url(#arr)"/>
  <text x="240" y="355" text-anchor="end" font-size="14" fill="#2457d6">Термоусадка (ПВХ/ПЕТ)</text>

  <path d="M 680,180 L 530,180 L 500,232" fill="none" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="690" y="175" text-anchor="start" font-size="14" font-weight="bold" fill="#1a1a1a">Плюс-контакт</text>
  <text x="690" y="195" text-anchor="start" font-size="13" fill="#6b7280">виступає над краєм</text>

  <path d="M 680,340 L 638,340" fill="none" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="690" y="335" text-anchor="start" font-size="14" fill="#1a1a1a">Мінусовий корпус</text>
  <text x="690" y="355" text-anchor="start" font-size="13" fill="#6b7280">сталевий стакан</text>

  <path d="M 680,280 L 640,280 L 590,280" fill="none" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="690" y="275" text-anchor="start" font-size="14" fill="#1a1a1a">Ізоляційне кільце</text>
  <text x="690" y="295" text-anchor="start" font-size="13" fill="#6b7280">штатна ізоляція (gasket)</text>
</svg>
