<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <text x="480" y="40" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Геометрія термоусадки для комірки 18650</text>
  <text x="480" y="65" font-size="13" text-anchor="middle" fill="#6b7280">При нагріванні надлишок довжини плівки (ΔL) утворює торцевий нахлест (W_wrap) для захисту країв комірки</text>

  <g>
    <text x="330" y="120" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">До нагрівання</text>
    
    <rect x="200" y="200" width="260" height="80" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
    <text x="330" y="245" font-size="14" text-anchor="middle" fill="#1a1a1a">Комірка 18650</text>
    
    <rect x="170" y="175" width="320" height="130" fill="none" stroke="#2457d6" stroke-width="2" stroke-dasharray="6,4"/>
    
    <line x1="200" y1="330" x2="460" y2="330" stroke="#1a1a1a" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <text x="330" y="322" font-size="12" text-anchor="middle" fill="#1a1a1a">L_cell</text>
    <line x1="200" y1="285" x2="200" y2="335" stroke="#6b7280"/>
    <line x1="460" y1="285" x2="460" y2="335" stroke="#6b7280"/>

    <line x1="170" y1="365" x2="490" y2="365" stroke="#2457d6" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
    <text x="330" y="357" font-size="12" text-anchor="middle" fill="#2457d6">L_sleeve</text>
    <line x1="170" y1="310" x2="170" y2="370" stroke="#6b7280"/>
    <line x1="490" y1="310" x2="490" y2="370" stroke="#6b7280"/>

    <line x1="150" y1="200" x2="150" y2="280" stroke="#1a1a1a" marker-start="url(#arr)" marker-end="url(#arr)"/>
    <text x="145" y="244" font-size="12" text-anchor="end" fill="#1a1a1a">D_cell</text>
    <line x1="145" y1="200" x2="195" y2="200" stroke="#6b7280"/>
    <line x1="145" y1="280" x2="195" y2="280" stroke="#6b7280"/>

    <line x1="90" y1="175" x2="90" y2="305" stroke="#2457d6" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
    <text x="85" y="244" font-size="12" text-anchor="end" fill="#2457d6">D_sleeve</text>
    <line x1="85" y1="175" x2="165" y2="175" stroke="#6b7280"/>
    <line x1="85" y1="305" x2="165" y2="305" stroke="#6b7280"/>

    <line x1="170" y1="170" x2="170" y2="150" stroke="#6b7280" stroke-dasharray="4,4"/>
    <line x1="200" y1="195" x2="200" y2="150" stroke="#6b7280" stroke-dasharray="4,4"/>
    <line x1="170" y1="155" x2="200" y2="155" stroke="#2457d6" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
    <text x="185" y="148" font-size="12" text-anchor="middle" fill="#2457d6">ΔL</text>

    <line x1="460" y1="195" x2="460" y2="150" stroke="#6b7280" stroke-dasharray="4,4"/>
    <line x1="490" y1="170" x2="490" y2="150" stroke="#6b7280" stroke-dasharray="4,4"/>
    <line x1="460" y1="155" x2="490" y2="155" stroke="#2457d6" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
    <text x="475" y="148" font-size="12" text-anchor="middle" fill="#2457d6">ΔL</text>
  </g>

  <g>
    <text x="730" y="120" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Після усадки</text>
    
    <rect x="600" y="200" width="260" height="80" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
    <text x="730" y="245" font-size="14" text-anchor="middle" fill="#1a1a1a">Комірка + плівка</text>
    
    <rect x="600" y="196" width="260" height="88" fill="#eaf0fd" fill-opacity="0.8"/>
    <line x1="600" y1="196" x2="860" y2="196" stroke="#2457d6" stroke-width="4"/>
    <line x1="600" y1="284" x2="860" y2="284" stroke="#2457d6" stroke-width="4"/>
    <line x1="600" y1="196" x2="600" y2="225" stroke="#2457d6" stroke-width="4"/>
    <line x1="860" y1="196" x2="860" y2="225" stroke="#2457d6" stroke-width="4"/>
    <line x1="600" y1="284" x2="600" y2="255" stroke="#2457d6" stroke-width="4"/>
    <line x1="860" y1="284" x2="860" y2="255" stroke="#2457d6" stroke-width="4"/>

    <line x1="575" y1="200" x2="596" y2="200" stroke="#6b7280"/>
    <line x1="575" y1="225" x2="596" y2="225" stroke="#6b7280"/>
    <line x1="580" y1="200" x2="580" y2="225" stroke="#2457d6" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
    <text x="575" y="217" font-size="12" text-anchor="end" fill="#2457d6">W_wrap</text>

    <line x1="864" y1="200" x2="885" y2="200" stroke="#6b7280"/>
    <line x1="864" y1="225" x2="885" y2="225" stroke="#6b7280"/>
    <line x1="880" y1="200" x2="880" y2="225" stroke="#2457d6" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
    <text x="885" y="217" font-size="12" text-anchor="start" fill="#2457d6">W_wrap</text>
  </g>
</svg>
