<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="500" fill="white"/>
  
  <defs>
    <marker id="arr-dim" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-dim-rev" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Ізоляційна шайба та термоусадочний рукав для 18650</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Точні геометричні розміри, допуски та профілі компонентів ізоляції перед монтажем</text>

  <!-- Washer -->
  <text x="250" y="110" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Шайба-ізолятор</text>
  <text x="250" y="130" font-size="13" fill="#6b7280" text-anchor="middle">Ячмінний папір, електрокартон, поліімід</text>
  
  <!-- Outer circle -->
  <circle cx="250" cy="250" r="100" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <!-- Inner circle -->
  <circle cx="250" cy="250" r="55" fill="white" stroke="#d0d7de" stroke-width="2"/>
  <circle cx="250" cy="250" r="2" fill="#1a1a1a"/>

  <!-- Inner Dia -->
  <line x1="250" y1="250" x2="305" y2="250" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-dim)"/>
  <line x1="305" y1="250" x2="365" y2="250" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="375" y="245" font-size="14" fill="#1a1a1a">r = 5.0...5.25 мм</text>
  <text x="375" y="260" font-size="13" fill="#6b7280">(внутр. D = 10.0...10.5)</text>
  
  <!-- Outer Dia -->
  <line x1="250" y1="250" x2="250" y2="150" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-dim)"/>
  <line x1="250" y1="150" x2="365" y2="150" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="375" y="145" font-size="14" fill="#1a1a1a">R = 8.75...9.0 мм</text>
  <text x="375" y="160" font-size="13" fill="#6b7280">(зовн. D = 17.5...18.0)</text>

  <!-- Side View -->
  <rect x="150" y="380" width="200" height="15" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <rect x="195" y="380" width="110" height="15" fill="white" stroke="white" stroke-width="0"/>
  <line x1="195" y1="380" x2="195" y2="395" stroke="#d0d7de" stroke-width="2"/>
  <line x1="305" y1="380" x2="305" y2="395" stroke="#d0d7de" stroke-width="2"/>
  
  <line x1="140" y1="380" x2="115" y2="380" stroke="#d0d7de" stroke-dasharray="4,4"/>
  <line x1="140" y1="395" x2="115" y2="395" stroke="#d0d7de" stroke-dasharray="4,4"/>
  <line x1="130" y1="360" x2="130" y2="380" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-dim)"/>
  <line x1="130" y1="415" x2="130" y2="395" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-dim)"/>
  
  <text x="115" y="382" font-size="14" fill="#1a1a1a" text-anchor="end">0.2...0.4 мм</text>
  <text x="115" y="398" font-size="13" fill="#6b7280" text-anchor="end">товщина</text>

  <!-- Heat Shrink -->
  <text x="710" y="110" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Термоусадочний рукав</text>
  <text x="710" y="130" font-size="13" fill="#6b7280" text-anchor="middle">Плаский профіль (ПВХ / ПЕТ) до усадки</text>

  <rect x="635" y="170" width="150" height="280" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="2"/>
  
  <!-- Width Dim -->
  <line x1="635" y1="155" x2="785" y2="155" stroke="#6b7280" stroke-width="1.5" marker-start="url(#arr-dim-rev)" marker-end="url(#arr-dim)"/>
  <line x1="635" y1="150" x2="635" y2="170" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="785" y1="150" x2="785" y2="170" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="710" y="148" font-size="14" fill="#1a1a1a" text-anchor="middle">Ширина: 29.5...30.5 мм</text>

  <!-- Height Dim -->
  <line x1="800" y1="170" x2="800" y2="450" stroke="#6b7280" stroke-width="1.5" marker-start="url(#arr-dim-rev)" marker-end="url(#arr-dim)"/>
  <line x1="785" y1="170" x2="805" y2="170" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="785" y1="450" x2="805" y2="450" stroke="#d0d7de" stroke-width="1.5"/>
  
  <text x="815" y="305" font-size="14" fill="#1a1a1a">Довжина:</text>
  <text x="815" y="325" font-size="14" fill="#1a1a1a">71.0...72.0 мм</text>
  
  <text x="610" y="305" font-size="13" fill="#6b7280" text-anchor="end">Товщина стінки:</text>
  <text x="610" y="320" font-size="13" fill="#6b7280" text-anchor="end">0.08...0.1 мм</text>
  <line x1="615" y1="310" x2="630" y2="310" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-dim)"/>

</svg>
