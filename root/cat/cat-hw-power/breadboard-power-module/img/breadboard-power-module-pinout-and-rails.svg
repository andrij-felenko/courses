<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="520" fill="white"/>
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Підключення модуля MB102 до рейок макетної плати та вибір напруги</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Штирі модуля входять у бічні шини; незалежні джампери задають 5 В, 3.3 В або OFF</text>
  <rect x="30" y="75" width="430" height="415" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="245" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Топологія модуля живлення MB102</text>
  <rect x="55" y="120" width="380" height="160" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="245" y="144" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Друкована плата модуля (MB102 / YP-08)</text>
  <rect x="70" y="160" width="65" height="55" rx="3" fill="#1a1a1a" stroke="#6b7280" stroke-width="1"/>
  <text x="102" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">DC Jack</text>
  <text x="102" y="203" text-anchor="middle" font-size="12" fill="#d0d7de">6.5–12 В</text>
  <rect x="150" y="168" width="40" height="40" rx="4" fill="#c0392b" stroke="#962d22" stroke-width="1.5"/>
  <text x="170" y="193" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">ON</text>
  <circle cx="210" cy="188" r="9" fill="#27ae60" stroke="#1e8449" stroke-width="1.5"/>
  <text x="210" y="215" text-anchor="middle" font-size="12" fill="#1a1a1a">LED</text>
  <rect x="235" y="160" width="55" height="55" rx="3" fill="#d0d7de" stroke="#6b7280" stroke-width="1.5"/>
  <text x="262" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">USB-A</text>
  <text x="262" y="203" text-anchor="middle" font-size="12" fill="#6b7280">5 В</text>
  <rect x="310" y="155" width="50" height="30" rx="2" fill="#1a1a1a"/>
  <text x="335" y="174" text-anchor="middle" font-size="12" fill="#ffffff">5.0V</text>
  <rect x="370" y="155" width="50" height="30" rx="2" fill="#1a1a1a"/>
  <text x="395" y="174" text-anchor="middle" font-size="12" fill="#ffffff">3.3V</text>
  <text x="365" y="210" text-anchor="middle" font-size="12" fill="#6b7280">LDO AMS1117</text>
  <rect x="60" y="300" width="160" height="95" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="140" y="324" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Лівий канал</text>
  <text x="140" y="346" text-anchor="middle" font-size="12" fill="#1a1a1a">Джампер: 5V/OFF/3.3V</text>
  <text x="140" y="372" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Штирі: [ + ] [ - ]</text>
  <rect x="265" y="300" width="160" height="95" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="345" y="324" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Правий канал</text>
  <text x="345" y="346" text-anchor="middle" font-size="12" fill="#1a1a1a">Джампер: 5V/OFF/3.3V</text>
  <text x="345" y="372" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Штирі: [ + ] [ - ]</text>
  <rect x="55" y="415" width="380" height="55" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="245" y="436" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Увага: не перевертайте модуль на 180 градусів!</text>
  <text x="245" y="456" text-anchor="middle" font-size="12" fill="#1a1a1a">Неправильне встановлення міняє плюс і мінус місцями на рейках.</text>
  <rect x="490" y="75" width="440" height="415" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="710" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Підключення до рейок макетної плати</text>
  <rect x="505" y="120" width="410" height="125" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="535" y1="145" x2="535" y2="230" stroke="#2457d6" stroke-width="4"/>
  <text x="535" y="137" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">GND (-)</text>
  <line x1="585" y1="145" x2="585" y2="230" stroke="#c0392b" stroke-width="4"/>
  <text x="585" y="137" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">VCC (+)</text>
  <rect x="615" y="135" width="190" height="95" fill="#f4f6f8" stroke="#e5e7eb" stroke-width="1"/>
  <text x="710" y="175" text-anchor="middle" font-size="13" fill="#6b7280">Поле контактних груп макетки</text>
  <text x="710" y="197" text-anchor="middle" font-size="12" fill="#6b7280">(крок контактів 2.54 мм)</text>
  <line x1="835" y1="145" x2="835" y2="230" stroke="#c0392b" stroke-width="4"/>
  <text x="835" y="137" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">VCC (+)</text>
  <line x1="885" y1="145" x2="885" y2="230" stroke="#2457d6" stroke-width="4"/>
  <text x="885" y="137" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">GND (-)</text>
  <rect x="505" y="260" width="410" height="215" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="710" y="284" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Три положення джампера вибору напруги</text>
  <rect x="525" y="305" width="115" height="155" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="582" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Режим 5 В</text>
  <circle cx="557" cy="375" r="5" fill="#1a1a1a"/>
  <circle cx="582" cy="375" r="5" fill="#1a1a1a"/>
  <circle cx="607" cy="375" r="5" fill="#1a1a1a"/>
  <rect x="551" y="367" width="37" height="16" rx="3" fill="#2457d6" opacity="0.85"/>
  <text x="582" y="415" text-anchor="middle" font-size="12" fill="#1a1a1a">Замкнено 1-2</text>
  <text x="582" y="438" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Вихід: 5.0 В</text>
  <rect x="652" y="305" width="115" height="155" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="709" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">Режим OFF</text>
  <circle cx="684" cy="375" r="5" fill="#1a1a1a"/>
  <circle cx="709" cy="375" r="5" fill="#1a1a1a"/>
  <circle cx="734" cy="375" r="5" fill="#1a1a1a"/>
  <text x="709" y="415" text-anchor="middle" font-size="12" fill="#1a1a1a">Знято джампер</text>
  <text x="709" y="438" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">Знеструмлено</text>
  <rect x="780" y="305" width="115" height="155" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="837" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Режим 3.3 В</text>
  <circle cx="812" cy="375" r="5" fill="#1a1a1a"/>
  <circle cx="837" cy="375" r="5" fill="#1a1a1a"/>
  <circle cx="862" cy="375" r="5" fill="#1a1a1a"/>
  <rect x="831" y="367" width="37" height="16" rx="3" fill="#2457d6" opacity="0.85"/>
  <text x="837" y="415" text-anchor="middle" font-size="12" fill="#1a1a1a">Замкнено 2-3</text>
  <text x="837" y="438" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Вихід: 3.3 В</text>
</svg>
