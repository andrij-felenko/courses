<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Header -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Принципова електрична схема модуля MB102</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Вхідний діод 1N4007, вимикач із фіксацією, стабілізатори AMS1117 та комутація рейок</text>

  <!-- 1. INPUT STAGE -->
  <rect x="35" y="80" width="180" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="125" y="105" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">ВХІДНИЙ ВУЗОЛ</text>

  <!-- DC Jack -->
  <rect x="50" y="125" width="150" height="85" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="125" y="148" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">DC Jack 5.5×2.1</text>
  <text x="125" y="170" font-size="12" fill="#6b7280" text-anchor="middle">6.5–12 В DC</text>
  <text x="125" y="195" font-size="12" fill="#1a1a1a" text-anchor="middle">Центр: плюс (+)</text>

  <!-- USB Input -->
  <rect x="50" y="235" width="150" height="85" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="125" y="258" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">USB Type-A</text>
  <text x="125" y="280" font-size="12" fill="#6b7280" text-anchor="middle">Вхід / вихід 5 В</text>
  <text x="125" y="305" font-size="12" fill="#c0392b" text-anchor="middle">Спільна шина 5V</text>

  <!-- Diode 1N4007 -->
  <rect x="50" y="345" width="150" height="75" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="125" y="370" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">Діод D1 (1N4007)</text>
  <text x="125" y="392" font-size="12" fill="#1a1a1a" text-anchor="middle">Захист від переполюсовки</text>
  <text x="125" y="410" font-size="12" fill="#6b7280" text-anchor="middle">Спадання 0.7–0.8 В</text>


  <!-- 2. SWITCH & FILTER STAGE -->
  <rect x="235" y="80" width="170" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="320" y="105" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">КОМУТАЦІЯ</text>

  <!-- Latching Switch -->
  <rect x="250" y="135" width="140" height="80" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="320" y="160" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">Кнопка SW1</text>
  <text x="320" y="182" font-size="12" fill="#1a1a1a" text-anchor="middle">З самофіксацією</text>
  <text x="320" y="200" font-size="12" fill="#6b7280" text-anchor="middle">Розриває VIN</text>

  <!-- Indicator LED -->
  <rect x="250" y="240" width="140" height="80" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="320" y="265" font-size="13" font-weight="700" fill="#27ae60" text-anchor="middle">Світлодіод LED1</text>
  <text x="320" y="287" font-size="12" fill="#1a1a1a" text-anchor="middle">Зелений індикатор</text>
  <text x="320" y="305" font-size="12" fill="#6b7280" text-anchor="middle">Резистор R1 (1 кОм)</text>

  <!-- Filter Caps -->
  <rect x="250" y="345" width="140" height="75" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="320" y="370" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Фільтр C1, C2</text>
  <text x="320" y="392" font-size="12" fill="#6b7280" text-anchor="middle">100 мкФ електроліт</text>
  <text x="320" y="410" font-size="12" fill="#6b7280" text-anchor="middle">100 нФ кераміка</text>


  <!-- 3. REGULATORS STAGE -->
  <rect x="425" y="80" width="220" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="535" y="105" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">СТАБІЛІЗАТОРИ LDO</text>

  <!-- AMS1117-5.0 -->
  <rect x="445" y="130" width="180" height="120" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="535" y="155" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">AMS1117-5.0</text>
  <text x="460" y="180" font-size="12" fill="#1a1a1a">Вхід: VIN (після SW1)</text>
  <text x="460" y="202" font-size="12" fill="#1a1a1a">Вихід: +5.0 В (до 800 мА)</text>
  <text x="460" y="225" font-size="12" fill="#6b7280">Вивід TAB: шина 5.0 В</text>

  <!-- AMS1117-3.3 -->
  <rect x="445" y="280" width="180" height="120" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="535" y="305" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">AMS1117-3.3</text>
  <text x="460" y="330" font-size="12" fill="#1a1a1a">Вхід: каскад від 5.0 В</text>
  <text x="460" y="352" font-size="12" fill="#1a1a1a">Вихід: +3.3 В (до 800 мА)</text>
  <text x="460" y="375" font-size="12" fill="#6b7280">Вивід TAB: шина 3.3 В</text>


  <!-- 4. JUMPERS & OUTPUT STAGE -->
  <rect x="665" y="80" width="260" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="795" y="105" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">ВИХІДНІ ДЖАМПЕРИ</text>

  <!-- Left Rail Jumper -->
  <rect x="685" y="130" width="220" height="120" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="795" y="155" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">Ліва рейка (JP1)</text>
  <text x="705" y="180" font-size="12" fill="#1a1a1a">Положення 1: 5.0 В</text>
  <text x="705" y="202" font-size="12" fill="#1a1a1a">Положення 2: OFF (вимк)</text>
  <text x="705" y="225" font-size="12" fill="#1a1a1a">Положення 3: 3.3 В</text>

  <!-- Right Rail Jumper -->
  <rect x="685" y="280" width="220" height="120" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="795" y="305" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">Права рейка (JP2)</text>
  <text x="705" y="330" font-size="12" fill="#1a1a1a">Положення 1: 5.0 В</text>
  <text x="705" y="352" font-size="12" fill="#1a1a1a">Положення 2: OFF (вимк)</text>
  <text x="705" y="375" font-size="12" fill="#1a1a1a">Положення 3: 3.3 В</text>

  <!-- Flow Arrows between blocks -->
  <line x1="205" y1="175" x2="245" y2="175" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="395" y1="175" x2="440" y2="175" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="630" y1="190" x2="680" y2="190" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="630" y1="340" x2="680" y2="340" stroke="#2457d6" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Ground bus bar at bottom -->
  <rect x="35" y="460" width="890" height="35" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="482" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">СПІЛЬНА ШИНА ЗЕМЛІ (GND): ОБ'ЄДНУЄ DC JACK, USB, ОБВ'ЯЗКУ ТА ОБИДВІ РЕЙКИ МАКЕТКИ</text>
</svg>
