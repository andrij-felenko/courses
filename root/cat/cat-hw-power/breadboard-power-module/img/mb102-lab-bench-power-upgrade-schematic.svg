<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принципова схема модернізації модуля MB102 до лабораторного рівня</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Додавання запобіжника PolySwitch, вимірювального шунта INA219 та I2C індикатора струму</text>

  <!-- Блок 1: Вхідне коло та захист PTC -->
  <rect x="40" y="90" width="170" height="330" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="125" y="118" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вхідне живлення</text>

  <!-- DC Jack -->
  <rect x="60" y="145" width="45" height="50" rx="4" fill="#2c3e50" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="82" y="174" font-size="11" fill="white" text-anchor="middle">DC Jack</text>

  <!-- Запобіжник PolySwitch PTC -->
  <rect x="130" y="145" width="60" height="30" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="160" y="164" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">PTC 500mA</text>

  <line x1="105" y1="160" x2="130" y2="160" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="60" y1="185" x2="190" y2="185" stroke="#1a1a1a" stroke-width="2"/>
  <text x="125" y="205" font-size="11" fill="#6b7280" text-anchor="middle">Спільна GND</text>

  <rect x="50" y="235" width="150" height="170" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="125" y="255" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Захист від КЗ:</text>
  <text x="60" y="275" font-size="11" fill="#1a1a1a">• Самоскидний</text>
  <text x="60" y="295" font-size="11" fill="#1a1a1a">  термозапобіжник</text>
  <text x="60" y="315" font-size="11" fill="#1a1a1a">• Струм відсічки 1 А</text>
  <text x="60" y="335" font-size="11" fill="#1a1a1a">• Опір у нормі</text>
  <text x="60" y="355" font-size="11" fill="#1a1a1a">  менше 0.3 Ом</text>
  <text x="60" y="380" font-size="11" fill="#27ae60">• Рятує AMS1117</text>

  <!-- Лінія живлення до MB102 -->
  <line x1="190" y1="160" x2="235" y2="160" stroke="#c0392b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Блок 2: Модуль MB102 (LDO 5V та 3.3V) -->
  <rect x="235" y="90" width="180" height="330" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="325" y="118" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Модуль MB102</text>

  <!-- LDO 5V -->
  <rect x="260" y="140" width="130" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="325" y="166" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">AMS1117-5.0V</text>

  <!-- LDO 3.3V -->
  <rect x="260" y="195" width="130" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="325" y="221" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">AMS1117-3.3V</text>

  <!-- Селектор джампера -->
  <rect x="260" y="250" width="130" height="40" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="325" y="275" font-size="11" fill="#1a1a1a" text-anchor="middle">Джампер виходу</text>

  <rect x="250" y="305" width="150" height="100" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="260" y="325" font-size="11" font-weight="bold" fill="#2457d6">Стабілізація:</text>
  <text x="260" y="345" font-size="11" fill="#1a1a1a">• Вибір 3.3 В або 5 В</text>
  <text x="260" y="365" font-size="11" fill="#1a1a1a">• Спільна земля GND</text>
  <text x="260" y="385" font-size="11" fill="#c0392b">• Межа тепла: 1.1 Вт</text>

  <!-- Лінія живлення до шунта INA219 -->
  <line x1="390" y1="270" x2="445" y2="270" stroke="#c0392b" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Блок 3: Сенсор INA219 з шунтом R_shunt -->
  <rect x="445" y="90" width="220" height="330" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="555" y="118" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Сенсор INA219 (I2C)</text>

  <!-- Шунт R_shunt -->
  <rect x="480" y="145" width="70" height="32" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="515" y="166" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">R 0.1 Ом</text>

  <!-- Мікросхема INA219 -->
  <rect x="480" y="195" width="150" height="75" rx="5" fill="#2c3e50" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="555" y="222" font-size="12" font-weight="bold" fill="white" text-anchor="middle">INA219 АЦП 12-біт</text>
  <text x="555" y="240" font-size="11" fill="#93c5fd" text-anchor="middle">I2C: SDA, SCL</text>
  <text x="555" y="258" font-size="11" fill="#bdc3c7" text-anchor="middle">Вимірювання V та I</text>

  <!-- З'єднання шунта з INA219 -->
  <line x1="490" y1="177" x2="490" y2="195" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="540" y1="177" x2="540" y2="195" stroke="#1a1a1a" stroke-width="1.5"/>

  <rect x="460" y="285" width="190" height="120" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="470" y="305" font-size="11" font-weight="bold" fill="#2457d6">Параметри вимірювача:</text>
  <text x="470" y="325" font-size="11" fill="#1a1a1a">• Точність струму: до 0.8 мА</text>
  <text x="470" y="345" font-size="11" fill="#1a1a1a">• Максимальний струм: 3.2 А</text>
  <text x="470" y="365" font-size="11" fill="#1a1a1a">• Напруга шини: до 26 В</text>
  <text x="470" y="388" font-size="11" fill="#27ae60">• Швидкість опитування: 1 кГц</text>

  <!-- Лінія живлення до макетної плати -->
  <line x1="550" y1="160" x2="695" y2="160" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Блок 4: Вихід на макетну плату та екран -->
  <rect x="695" y="90" width="225" height="330" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="807" y="118" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Макетна плата та Індикація</text>

  <!-- OLED Дисплей -->
  <rect x="720" y="140" width="175" height="75" rx="5" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  <text x="807" y="165" font-size="12" font-weight="bold" fill="#60a5fa" text-anchor="middle">OLED SSD1306 (0.96")</text>
  <text x="807" y="185" font-size="12" fill="#34d399" text-anchor="middle">5.02 V  |  142 mA</text>
  <text x="807" y="203" font-size="11" fill="#fcd34d" text-anchor="middle">Power: 712 mW  [OK]</text>

  <!-- Рейка живлення Breadboard -->
  <rect x="720" y="230" width="175" height="50" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="807" y="252" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Рейка живлення MB-102</text>
  <text x="807" y="270" font-size="11" fill="#1a1a1a" text-anchor="middle">Червона (+), Синя (GND)</text>

  <!-- Звуковий аларм зумер -->
  <rect x="720" y="295" width="175" height="40" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="807" y="320" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Зумер тривоги (OCP Alert)</text>

  <!-- Підсумковий напис -->
  <rect x="710" y="350" width="195" height="55" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="720" y="372" font-size="11" fill="#1a1a1a">• Повний захист від КЗ</text>
  <text x="720" y="392" font-size="11" fill="#27ae60">• Точний контроль потужності</text>
</svg>
