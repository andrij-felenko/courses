<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Еволюція макетного живлення: YwRobot MB102 проти клонів YP-08</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Оригінальний дизайн YwRobot став стандартом де-факто, але дешеві клони мають ризики</text>

  <!-- Ліва панель: Оригінал YwRobot -->
  <rect x="30" y="80" width="435" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247" y="108" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Оригінальний модуль MB102 (YwRobot)</text>

  <!-- Спрощена плата YwRobot -->
  <rect x="55" y="125" width="385" height="155" rx="6" fill="#1e3a8a" stroke="#172554" stroke-width="1.5"/>
  <text x="247" y="148" font-size="12" font-weight="bold" fill="white" text-anchor="middle">YwRobot Breadboard Power Supply v5</text>

  <!-- Елементи на лівій платі -->
  <!-- Гніздо DC Jack -->
  <rect x="65" y="165" width="45" height="45" rx="3" fill="#111827" stroke="#9ca3af" stroke-width="1"/>
  <text x="87" y="192" font-size="11" fill="white" text-anchor="middle">DC Jack</text>

  <!-- Кнопка живлення -->
  <circle cx="140" cy="187" r="14" fill="#dc2626" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="140" y="218" font-size="11" fill="white" text-anchor="middle">Кнопка</text>

  <!-- Стабілізатори LDO (5V та 3.3V) -->
  <rect x="175" y="165" width="38" height="28" rx="2" fill="#374151" stroke="#4b5563" stroke-width="1"/>
  <text x="194" y="183" font-size="10" fill="white" text-anchor="middle">5.0V</text>

  <rect x="225" y="165" width="38" height="28" rx="2" fill="#374151" stroke="#4b5563" stroke-width="1"/>
  <text x="244" y="183" font-size="10" fill="white" text-anchor="middle">3.3V</text>

  <!-- USB Type-A -->
  <rect x="280" y="165" width="45" height="45" rx="3" fill="#9ca3af" stroke="#4b5563" stroke-width="1"/>
  <text x="302" y="192" font-size="11" fill="#111827" text-anchor="middle">USB</text>

  <!-- Селекторні перемички (джампери) -->
  <rect x="345" y="160" width="80" height="26" rx="2" fill="#2563eb" stroke="#1d4ed8" stroke-width="1"/>
  <text x="385" y="177" font-size="11" fill="white" text-anchor="middle">Джампер L</text>

  <rect x="345" y="195" width="80" height="26" rx="2" fill="#2563eb" stroke="#1d4ed8" stroke-width="1"/>
  <text x="385" y="212" font-size="11" fill="white" text-anchor="middle">Джампер R</text>

  <!-- Нижні штирі під плату -->
  <text x="247" y="260" font-size="11" fill="#93c5fd" text-anchor="middle">Штирі живлення знизу плати: сумісні з рейками MB-102</text>

  <!-- Опис переваг оригіналу -->
  <rect x="50" y="295" width="395" height="120" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="65" y="320" font-size="12" font-weight="bold" fill="#27ae60">Особливості конструкції YwRobot:</text>
  <text x="65" y="342" font-size="12" fill="#1a1a1a">• Якісний склотекстоліт FR-4 з чітким маркуванням рейок</text>
  <text x="65" y="364" font-size="12" fill="#1a1a1a">• Справжні стабілізатори AMS1117 з великим полігоном охолодження</text>
  <text x="65" y="386" font-size="12" fill="#1a1a1a">• Фільтруючі електролітичні конденсатори на 100 мкФ</text>
  <text x="65" y="406" font-size="12" fill="#27ae60">• Фіксована кнопка з чітким клацанням і ресурсом 50 000 циклів</text>

  <!-- Права панель: Клон YP-08 -->
  <rect x="495" y="80" width="435" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="712" y="108" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Поширений клон YP-08 / Generic MB102</text>

  <!-- Спрощена плата клона -->
  <rect x="520" y="125" width="385" height="155" rx="6" fill="#1f2937" stroke="#111827" stroke-width="1.5"/>
  <text x="712" y="148" font-size="12" font-weight="bold" fill="#fca5a5" text-anchor="middle">Маркування YP-08 / Полегшена топологія</text>

  <!-- Елементи на правій платі -->
  <!-- Гніздо DC Jack -->
  <rect x="530" y="165" width="45" height="45" rx="3" fill="#111827" stroke="#9ca3af" stroke-width="1"/>
  <text x="552" y="192" font-size="11" fill="white" text-anchor="middle">DC Jack</text>

  <!-- Кнопка живлення дешева -->
  <circle cx="605" cy="187" r="14" fill="#991b1b" stroke="#7f1d1d" stroke-width="1.5"/>
  <text x="605" y="218" font-size="11" fill="#fca5a5" text-anchor="middle">Кнопка</text>

  <!-- Стабілізатори дешеві -->
  <rect x="640" y="165" width="38" height="28" rx="2" fill="#4b5563" stroke="#6b7280" stroke-width="1"/>
  <text x="659" y="183" font-size="10" fill="white" text-anchor="middle">1117-5</text>

  <rect x="690" y="165" width="38" height="28" rx="2" fill="#4b5563" stroke="#6b7280" stroke-width="1"/>
  <text x="709" y="183" font-size="10" fill="white" text-anchor="middle">1117-3</text>

  <!-- USB Type-A тонкий -->
  <rect x="745" y="165" width="45" height="45" rx="3" fill="#6b7280" stroke="#4b5563" stroke-width="1"/>
  <text x="767" y="192" font-size="11" fill="white" text-anchor="middle">USB</text>

  <!-- Селекторні джампери -->
  <rect x="810" y="160" width="80" height="26" rx="2" fill="#dc2626" stroke="#b91c1c" stroke-width="1"/>
  <text x="850" y="177" font-size="11" fill="white" text-anchor="middle">Джампер L</text>

  <rect x="810" y="195" width="80" height="26" rx="2" fill="#dc2626" stroke="#b91c1c" stroke-width="1"/>
  <text x="850" y="212" font-size="11" fill="white" text-anchor="middle">Джампер R</text>

  <!-- Нижні штирі -->
  <text x="712" y="260" font-size="11" fill="#fca5a5" text-anchor="middle">Увага: у деяких клонах полярність рейок дзеркальна!</text>

  <!-- Опис небезпек клонів -->
  <rect x="515" y="295" width="395" height="120" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="530" y="320" font-size="12" font-weight="bold" fill="#c0392b">Типові вади та пастки клонів YP-08:</text>
  <text x="530" y="342" font-size="12" fill="#1a1a1a">• Переплутана шовкографія +/-: ризик переполюсовки макета!</text>
  <text x="530" y="364" font-size="12" fill="#1a1a1a">• Дешеві підробки AMS1117: перегрів і падіння струму до 100 мА</text>
  <text x="530" y="386" font-size="12" fill="#1a1a1a">• Економія на конденсаторах (10-22 мкФ замість 100 мкФ): пульсації</text>
  <text x="530" y="406" font-size="12" fill="#c0392b">• Тонке лудіння штирів: ненадійний контакт у рейках breadboard</text>
</svg>
