<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-success" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Main Title and Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Діагональне підключення силових шин у паралельній групі 4P</text>
  <text x="480" y="56" font-size="13" text-anchor="middle" fill="#6b7280">Підключення навантаження з протилежних боків зрівнює опір струмових шляхів усіх осередків</text>

  <!-- PANEL 1: Одностороннє підключення (Небажано) -->
  <rect x="30" y="75" width="900" height="220" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="100" font-size="14" font-weight="bold" fill="#c0392b">1. ОДНОСТОРОННЄ ПІДКЛЮЧЕННЯ (небаланс струмів, перегрів крайнього осередку)</text>

  <!-- Panel 1: Input / Output Terminals -->
  <line x1="45" y1="138" x2="115" y2="138" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-accent)"/>
  <text x="45" y="125" font-size="12" font-weight="bold" fill="#2457d6">+ 120 A (Вхід)</text>

  <line x1="115" y1="247" x2="45" y2="247" stroke="#1a1a1a" stroke-width="3" marker-end="url(#arr-dark)"/>
  <text x="45" y="267" font-size="12" font-weight="bold" fill="#1a1a1a">- 120 A (Вихід)</text>

  <!-- Panel 1: Busbars -->
  <rect x="115" y="133" width="455" height="10" rx="3" fill="#2457d6"/>
  <rect x="115" y="242" width="455" height="10" rx="3" fill="#6b7280"/>

  <!-- Busbar Resistance Labels -->
  <text x="222" y="125" font-size="12" fill="#6b7280" text-anchor="middle">R_b</text>
  <text x="342" y="125" font-size="12" fill="#6b7280" text-anchor="middle">R_b</text>
  <text x="462" y="125" font-size="12" fill="#6b7280" text-anchor="middle">R_b</text>

  <!-- Panel 1: Cells -->
  <!-- Cell 1 -->
  <rect x="130" y="145" width="65" height="95" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="162.5" y="170" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">INR21700</text>
  <text x="162.5" y="186" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">40P</text>
  <text x="162.5" y="215" font-size="13" font-weight="bold" text-anchor="middle" fill="#c0392b">#1</text>

  <!-- Cell 2 -->
  <rect x="250" y="145" width="65" height="95" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="282.5" y="170" font-size="12" text-anchor="middle" fill="#6b7280">INR21700</text>
  <text x="282.5" y="186" font-size="12" text-anchor="middle" fill="#6b7280">40P</text>
  <text x="282.5" y="215" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">#2</text>

  <!-- Cell 3 -->
  <rect x="370" y="145" width="65" height="95" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="402.5" y="170" font-size="12" text-anchor="middle" fill="#6b7280">INR21700</text>
  <text x="402.5" y="186" font-size="12" text-anchor="middle" fill="#6b7280">40P</text>
  <text x="402.5" y="215" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">#3</text>

  <!-- Cell 4 -->
  <rect x="490" y="145" width="65" height="95" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="522.5" y="170" font-size="12" text-anchor="middle" fill="#6b7280">INR21700</text>
  <text x="522.5" y="186" font-size="12" text-anchor="middle" fill="#6b7280">40P</text>
  <text x="522.5" y="215" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">#4</text>

  <!-- Panel 1: Current Flow Arrows -->
  <line x1="203" y1="150" x2="203" y2="235" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-red)"/>
  <text x="208" y="195" font-size="12" font-weight="bold" fill="#c0392b">42 A</text>

  <line x1="323" y1="150" x2="323" y2="235" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>
  <text x="328" y="195" font-size="12" fill="#1a1a1a">32 A</text>

  <line x1="443" y1="150" x2="443" y2="235" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="448" y="195" font-size="12" fill="#1a1a1a">25 A</text>

  <line x1="563" y1="150" x2="563" y2="235" stroke="#6b7280" stroke-width="1" marker-end="url(#arr-gray)"/>
  <text x="568" y="195" font-size="12" fill="#6b7280">21 A</text>

  <!-- Panel 1: Summary Box -->
  <rect x="660" y="105" width="250" height="170" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="675" y="128" font-size="13" font-weight="bold" fill="#c0392b">Розподіл струму 120 A:</text>
  <text x="675" y="150" font-size="12" font-weight="bold" fill="#c0392b">Осередок #1: 42 А (35%) — ПЕРЕГРІВ</text>
  <text x="675" y="170" font-size="12" fill="#1a1a1a">Осередок #2: 32 А (27%)</text>
  <text x="675" y="190" font-size="12" fill="#1a1a1a">Осередок #3: 25 А (21%)</text>
  <text x="675" y="210" font-size="12" fill="#6b7280">Осередок #4: 21 А (17%)</text>
  <line x1="675" y1="220" x2="895" y2="220" stroke="#c0392b" stroke-width="0.5"/>
  <text x="675" y="238" font-size="12" font-weight="bold" fill="#c0392b">Дисбаланс ΔI = 21 А</text>
  <text x="675" y="258" font-size="12" fill="#c0392b">Шлях #1 коротший: R_path = R_c</text>


  <!-- PANEL 2: Діагональне підключення (Рекомендовано) -->
  <rect x="30" y="315" width="900" height="220" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="340" font-size="14" font-weight="bold" fill="#27ae60">2. ДІАГОНАЛЬНЕ ПІДКЛЮЧЕННЯ (симетричний опір шляхів, ідеальний баланс)</text>

  <!-- Panel 2: Input / Output Terminals -->
  <line x1="45" y1="378" x2="115" y2="378" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-accent)"/>
  <text x="45" y="365" font-size="12" font-weight="bold" fill="#2457d6">+ 120 A (Вхід)</text>

  <line x1="570" y1="487" x2="640" y2="487" stroke="#27ae60" stroke-width="3" marker-end="url(#arr-success)"/>
  <text x="640" y="507" font-size="12" font-weight="bold" text-anchor="end" fill="#27ae60">- 120 A (Вихід)</text>

  <!-- Panel 2: Busbars -->
  <rect x="115" y="373" width="455" height="10" rx="3" fill="#2457d6"/>
  <rect x="115" y="482" width="455" height="10" rx="3" fill="#27ae60"/>

  <!-- Panel 2: Cells -->
  <!-- Cell 1 -->
  <rect x="130" y="385" width="65" height="95" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="162.5" y="410" font-size="12" text-anchor="middle" fill="#6b7280">INR21700</text>
  <text x="162.5" y="426" font-size="12" text-anchor="middle" fill="#6b7280">40P</text>
  <text x="162.5" y="455" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">#1</text>

  <!-- Cell 2 -->
  <rect x="250" y="385" width="65" height="95" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="282.5" y="410" font-size="12" text-anchor="middle" fill="#6b7280">INR21700</text>
  <text x="282.5" y="426" font-size="12" text-anchor="middle" fill="#6b7280">40P</text>
  <text x="282.5" y="455" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">#2</text>

  <!-- Cell 3 -->
  <rect x="370" y="385" width="65" height="95" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="402.5" y="410" font-size="12" text-anchor="middle" fill="#6b7280">INR21700</text>
  <text x="402.5" y="426" font-size="12" text-anchor="middle" fill="#6b7280">40P</text>
  <text x="402.5" y="455" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">#3</text>

  <!-- Cell 4 -->
  <rect x="490" y="385" width="65" height="95" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="522.5" y="410" font-size="12" text-anchor="middle" fill="#6b7280">INR21700</text>
  <text x="522.5" y="426" font-size="12" text-anchor="middle" fill="#6b7280">40P</text>
  <text x="522.5" y="455" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">#4</text>

  <!-- Panel 2: Current Flow Arrows -->
  <line x1="203" y1="390" x2="203" y2="475" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-success)"/>
  <text x="208" y="435" font-size="12" font-weight="bold" fill="#27ae60">30 A</text>

  <line x1="323" y1="390" x2="323" y2="475" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-success)"/>
  <text x="328" y="435" font-size="12" fill="#27ae60">30 A</text>

  <line x1="443" y1="390" x2="443" y2="475" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-success)"/>
  <text x="448" y="435" font-size="12" fill="#27ae60">30 A</text>

  <line x1="563" y1="390" x2="563" y2="475" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-success)"/>
  <text x="568" y="435" font-size="12" fill="#27ae60">30 A</text>

  <!-- Panel 2: Summary Box -->
  <rect x="660" y="345" width="250" height="170" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="675" y="368" font-size="13" font-weight="bold" fill="#27ae60">Розподіл струму 120 A:</text>
  <text x="675" y="390" font-size="12" font-weight="bold" fill="#27ae60">Осередок #1: 30 А (25%)</text>
  <text x="675" y="410" font-size="12" font-weight="bold" fill="#27ae60">Осередок #2: 30 А (25%)</text>
  <text x="675" y="430" font-size="12" font-weight="bold" fill="#27ae60">Осередок #3: 30 А (25%)</text>
  <text x="675" y="450" font-size="12" font-weight="bold" fill="#27ae60">Осередок #4: 30 А (25%)</text>
  <line x1="675" y1="460" x2="895" y2="460" stroke="#27ae60" stroke-width="0.5"/>
  <text x="675" y="478" font-size="12" font-weight="bold" fill="#27ae60">Ідеальний баланс ΔI = 0 А</text>
  <text x="675" y="498" font-size="12" fill="#27ae60">Усі шляхи: R_path = R_c + 3·R_b</text>
</svg>
