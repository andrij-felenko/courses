<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Main Header & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема розміщення та зварювання силових шин збірки 21700 (4S2P)</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Діагональний токознім та винесені балансувальні контактні точки мінімізують вирівнювальні опори</text>

  <!-- ==================== LEFT PANEL: TOPOLOGY ==================== -->
  <rect x="30" y="75" width="440" height="460" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="215" y="96" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Топологія шин та діагональний токознім</text>

  <!-- Column Headers -->
  <text x="90" y="118" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Група 1 (1P)</text>
  <text x="185" y="118" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Група 2 (2P)</text>
  <text x="280" y="118" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Група 3 (3P)</text>
  <text x="375" y="118" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Група 4 (4P)</text>

  <!-- Branch 1 Current Indicator -->
  <path d="M 125,150 L 340,150" fill="none" stroke="#2457d6" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr-blue)"/>
  <text x="232" y="138" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">I_branch1 = 40 A</text>

  <!-- Busbars (Shyna) drawn as path shapes to avoid rect-rect overlaps -->
  <!-- Busbar 1: BAT- terminal busbar on Col 1 -->
  <path d="M 69 170 h 42 a 4 4 0 0 1 4 4 v 172 a 4 4 0 0 1 -4 4 h -42 a 4 4 0 0 1 -4 -4 v -172 a 4 4 0 0 1 4 -4 z" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- Busbar 2: S1-S2 interconnect (Col 1 to Col 2) -->
  <path d="M 79 178 h 122 a 4 4 0 0 1 4 4 v 36 a 4 4 0 0 1 -4 4 h -122 a 4 4 0 0 1 -4 -4 v -36 a 4 4 0 0 1 4 -4 z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" opacity="0.85"/>
  <path d="M 79 298 h 122 a 4 4 0 0 1 4 4 v 36 a 4 4 0 0 1 -4 4 h -122 a 4 4 0 0 1 -4 -4 v -36 a 4 4 0 0 1 4 -4 z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" opacity="0.85"/>

  <!-- Busbar 3: S2-S3 interconnect (Col 2 to Col 3) -->
  <path d="M 174 178 h 122 a 4 4 0 0 1 4 4 v 36 a 4 4 0 0 1 -4 4 h -122 a 4 4 0 0 1 -4 -4 v -36 a 4 4 0 0 1 4 -4 z" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5" opacity="0.85"/>
  <path d="M 174 298 h 122 a 4 4 0 0 1 4 4 v 36 a 4 4 0 0 1 -4 4 h -122 a 4 4 0 0 1 -4 -4 v -36 a 4 4 0 0 1 4 -4 z" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5" opacity="0.85"/>

  <!-- Busbar 4: S3-S4 interconnect (Col 3 to Col 4) -->
  <path d="M 269 178 h 122 a 4 4 0 0 1 4 4 v 36 a 4 4 0 0 1 -4 4 h -122 a 4 4 0 0 1 -4 -4 v -36 a 4 4 0 0 1 4 -4 z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" opacity="0.85"/>
  <path d="M 269 298 h 122 a 4 4 0 0 1 4 4 v 36 a 4 4 0 0 1 -4 4 h -122 a 4 4 0 0 1 -4 -4 v -36 a 4 4 0 0 1 4 -4 z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" opacity="0.85"/>

  <!-- Busbar 5: BAT+ terminal busbar on Col 4 -->
  <path d="M 354 170 h 42 a 4 4 0 0 1 4 4 v 172 a 4 4 0 0 1 -4 4 h -42 a 4 4 0 0 1 -4 -4 v -172 a 4 4 0 0 1 4 -4 z" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>

  <!-- Cell Circles 21700 -->
  <!-- Col 1 -->
  <circle cx="90" cy="200" r="26" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <circle cx="90" cy="320" r="26" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <!-- Col 2 -->
  <circle cx="185" cy="200" r="26" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
  <circle cx="185" cy="320" r="26" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
  <!-- Col 3 -->
  <circle cx="280" cy="200" r="26" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <circle cx="280" cy="320" r="26" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <!-- Col 4 -->
  <circle cx="375" cy="200" r="26" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
  <circle cx="375" cy="320" r="26" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>

  <!-- Weld Spots on Cells -->
  <!-- 1A -->
  <circle cx="74" cy="186" r="2" fill="#c0392b"/><circle cx="106" cy="186" r="2" fill="#c0392b"/>
  <circle cx="74" cy="214" r="2" fill="#c0392b"/><circle cx="106" cy="214" r="2" fill="#c0392b"/>
  <!-- 1B -->
  <circle cx="74" cy="306" r="2" fill="#c0392b"/><circle cx="106" cy="306" r="2" fill="#c0392b"/>
  <circle cx="74" cy="334" r="2" fill="#c0392b"/><circle cx="106" cy="334" r="2" fill="#c0392b"/>
  <!-- 2A -->
  <circle cx="169" cy="186" r="2" fill="#c0392b"/><circle cx="201" cy="186" r="2" fill="#c0392b"/>
  <circle cx="169" cy="214" r="2" fill="#c0392b"/><circle cx="201" cy="214" r="2" fill="#c0392b"/>
  <!-- 2B -->
  <circle cx="169" cy="306" r="2" fill="#c0392b"/><circle cx="201" cy="306" r="2" fill="#c0392b"/>
  <circle cx="169" cy="334" r="2" fill="#c0392b"/><circle cx="201" cy="334" r="2" fill="#c0392b"/>
  <!-- 3A -->
  <circle cx="264" cy="186" r="2" fill="#c0392b"/><circle cx="296" cy="186" r="2" fill="#c0392b"/>
  <circle cx="264" cy="214" r="2" fill="#c0392b"/><circle cx="296" cy="214" r="2" fill="#c0392b"/>
  <!-- 3B -->
  <circle cx="264" cy="306" r="2" fill="#c0392b"/><circle cx="296" cy="306" r="2" fill="#c0392b"/>
  <circle cx="264" cy="334" r="2" fill="#c0392b"/><circle cx="296" cy="334" r="2" fill="#c0392b"/>
  <!-- 4A -->
  <circle cx="359" cy="186" r="2" fill="#c0392b"/><circle cx="391" cy="186" r="2" fill="#c0392b"/>
  <circle cx="359" cy="214" r="2" fill="#c0392b"/><circle cx="391" cy="214" r="2" fill="#c0392b"/>
  <!-- 4B -->
  <circle cx="359" cy="306" r="2" fill="#c0392b"/><circle cx="391" cy="306" r="2" fill="#c0392b"/>
  <circle cx="359" cy="334" r="2" fill="#c0392b"/><circle cx="391" cy="334" r="2" fill="#c0392b"/>

  <!-- Cell Labels -->
  <text x="90" y="196" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1A</text>
  <text x="90" y="210" font-size="11" fill="#2457d6" text-anchor="middle">(-)</text>
  <text x="90" y="316" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1B</text>
  <text x="90" y="330" font-size="11" fill="#2457d6" text-anchor="middle">(-)</text>

  <text x="185" y="196" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2A</text>
  <text x="185" y="210" font-size="11" fill="#27ae60" text-anchor="middle">(+)</text>
  <text x="185" y="316" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2B</text>
  <text x="185" y="330" font-size="11" fill="#27ae60" text-anchor="middle">(+)</text>

  <text x="280" y="196" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3A</text>
  <text x="280" y="210" font-size="11" fill="#2457d6" text-anchor="middle">(-)</text>
  <text x="280" y="316" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3B</text>
  <text x="280" y="330" font-size="11" fill="#2457d6" text-anchor="middle">(-)</text>

  <text x="375" y="196" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">4A</text>
  <text x="375" y="210" font-size="11" fill="#27ae60" text-anchor="middle">(+)</text>
  <text x="375" y="316" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">4B</text>
  <text x="375" y="330" font-size="11" fill="#27ae60" text-anchor="middle">(+)</text>

  <!-- Branch 2 Current Indicator -->
  <path d="M 125,356 L 340,356" fill="none" stroke="#2457d6" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr-blue)"/>
  <text x="232" y="378" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">I_branch2 = 40 A</text>

  <!-- Power Terminals & Current Flow Arrows -->
  <!-- BAT- Terminal (Bottom Left) -->
  <path d="M 90,350 L 90,392" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-red)"/>
  <rect x="45" y="392" width="90" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="90" y="408" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">BAT- (80 A)</text>

  <!-- BAT+ Terminal (Top Right) routed to x=425 to avoid intersecting "Група 4 (4P)" at x=375 -->
  <path d="M 375,170 L 425,170 L 425,102" fill="none" stroke="#27ae60" stroke-width="3" marker-end="url(#arr-green)"/>
  <rect x="387.5" y="80" width="75" height="22" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="425" y="95" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">BAT+ (80 A)</text>

  <!-- Panel 1 Summary Box -->
  <rect x="45" y="430" width="410" height="92" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="250" y="448" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Перевага діагонального токозніма (Z-схема):</text>
  <text x="250" y="466" font-size="12" fill="#1a1a1a" text-anchor="middle">• Довжини шин: L_top = L_bottom → R_branch1 = R_branch2</text>
  <text x="250" y="484" font-size="12" fill="#1a1a1a" text-anchor="middle">• Струми паралельних комірок рівні (I_A = I_B = 40 A)</text>
  <text x="250" y="502" font-size="12" fill="#1a1a1a" text-anchor="middle">• Запобігає локальному перегріву та перекосу ємностей</text>

  <!-- ==================== RIGHT PANEL: WELDING & BMS ==================== -->
  <rect x="490" y="75" width="440" height="460" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="710" y="96" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Зварні контакти та вимірювання BMS</text>

  <!-- Sub-section A: Weld Geometry -->
  <text x="710" y="118" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Геометрія зварювання виводу 21700 (4 точки)</text>

  <!-- Zoomed 21700 Cell Drawing -->
  <text x="575" y="138" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Термінал 21700</text>
  <circle cx="575" cy="200" r="45" fill="#ffffff" stroke="#9ca3af" stroke-width="2"/>
  <circle cx="575" cy="200" r="28" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Nickel Strip Overlay with H-slot drawn as path -->
  <path d="M 560 145 h 30 a 3 3 0 0 1 3 3 v 104 a 3 3 0 0 1 -3 3 h -30 a 3 3 0 0 1 -3 -3 v -104 a 3 3 0 0 1 3 -3 z" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5" opacity="0.85"/>
  <!-- H-slot cutout -->
  <line x1="567" y1="175" x2="567" y2="225" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="583" y1="175" x2="583" y2="225" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="567" y1="200" x2="583" y2="200" stroke="#1a1a1a" stroke-width="2"/>

  <!-- 4 Weld Spots -->
  <circle cx="562" cy="183" r="3.5" fill="#c0392b" stroke="#ffffff" stroke-width="1"/>
  <circle cx="588" cy="183" r="3.5" fill="#c0392b" stroke="#ffffff" stroke-width="1"/>
  <circle cx="562" cy="217" r="3.5" fill="#c0392b" stroke="#ffffff" stroke-width="1"/>
  <circle cx="588" cy="217" r="3.5" fill="#c0392b" stroke="#ffffff" stroke-width="1"/>

  <!-- Weld Callout Lines & Text -->
  <path d="M 595,183 L 640,183" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 2"/>
  <path d="M 595,217 L 640,217" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 2"/>

  <text x="648" y="160" font-size="12" font-weight="bold" fill="#1a1a1a">Нікелева шина 0.15-0.20 мм</text>
  <text x="648" y="185" font-size="12" fill="#1a1a1a">H-проріз (концентрація імпульсу)</text>
  <text x="648" y="210" font-size="12" font-weight="bold" fill="#c0392b">4 точки точкового зварювання</text>
  <text x="648" y="235" font-size="12" font-weight="bold" fill="#27ae60">R_contact &lt; 0.3 мОм (4-точковий)</text>

  <path d="M 505,262 L 915,262" fill="none" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Sub-section B: BMS Tap Points -->
  <text x="710" y="284" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Точки підключення балансувальних виводів BMS</text>

  <!-- Left Box: Incorrect BMS Tap -->
  <rect x="505" y="298" width="195" height="220" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="602" y="318" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">❌ Невірно (на силову шину)</text>

  <!-- Diagram Incorrect -->
  <text x="602" y="335" font-size="12" fill="#2457d6" text-anchor="middle">Струм I = 40 A</text>
  <path d="M 524 342 h 152 a 2 2 0 0 1 2 2 v 18 a 2 2 0 0 1 -2 2 h -152 a 2 2 0 0 1 -2 -2 v -18 a 2 2 0 0 1 2 -2 z" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>
  <path d="M 526,353 L 670,353" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <!-- BMS Wire attached on power path -->
  <circle cx="630" cy="353" r="4" fill="#c0392b"/>
  <path d="M 630,357 L 630,383" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="3 2" marker-end="url(#arr-red)"/>
  <rect x="610" y="385" width="40" height="20" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="630" y="399" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">BMS</text>

  <text x="602" y="425" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">V_bms = V_cell - I · R_bus</text>
  <text x="602" y="447" font-size="12" fill="#c0392b" text-anchor="middle">Хибне просідання напруги</text>
  <text x="602" y="469" font-size="12" fill="#1a1a1a" text-anchor="middle">Хибне спрацьовування UVP</text>

  <!-- Right Box: Correct BMS Tap -->
  <rect x="720" y="298" width="195" height="220" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="817" y="318" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">✓ Вірно (винесений контакт)</text>

  <!-- Diagram Correct -->
  <text x="780" y="335" font-size="12" fill="#2457d6" text-anchor="middle">Струм I = 40 A</text>
  <path d="M 734 342 h 116 a 2 2 0 0 1 2 2 v 18 a 2 2 0 0 1 -2 2 h -116 a 2 2 0 0 1 -2 -2 v -18 a 2 2 0 0 1 2 -2 z" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>
  <path d="M 734,353 L 845,353" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <!-- Dedicated sensing tab -->
  <rect x="868" y="341" width="24" height="24" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <path d="M 852,353 L 868,353" fill="none" stroke="#27ae60" stroke-width="1" stroke-dasharray="2 2"/>
  <circle cx="880" cy="353" r="3.5" fill="#27ae60"/>
  <path d="M 880,357 L 880,383" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="3 2" marker-end="url(#arr-green)"/>
  <rect x="860" y="385" width="40" height="20" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="880" y="399" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">BMS</text>

  <text x="817" y="425" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">V_bms = V_cell (без I · R)</text>
  <text x="817" y="447" font-size="12" fill="#27ae60" text-anchor="middle">Точне вимірювання SOC/SOH</text>
  <text x="817" y="469" font-size="12" fill="#1a1a1a" text-anchor="middle">Коректне балансування</text>

</svg>
