  <text x="533" y="484" font-size="12" font-weight="700" fill="#1a1a1a">45 A</text>
  <text x="565" y="484" font-size="12" fill="#6b7280">(макс. тривалий, відсічка 80 °C)</text>

  <!-- Legend Item 4: 70A -->
  <line x1="755" y1="480" x2="780" y2="480" stroke="#c0392b" stroke-width="3" stroke-dasharray="5,3"/>
  <circle cx="767.5" cy="480" r="3.5" fill="#c0392b"/>
  <text x="788" y="484" font-size="12" font-weight="700" fill="#1a1a1a">70 A</text>
  <text x="820" y="484" font-size="12" fill="#c0392b" font-weight="700">(імпульс &lt; 5 c)</text>
</svg>
