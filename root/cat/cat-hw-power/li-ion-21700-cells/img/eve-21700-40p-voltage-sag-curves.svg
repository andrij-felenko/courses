  <line x1="545" y1="130" x2="895" y2="130" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="545" y1="207.1" x2="895" y2="207.1" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="545" y1="245.7" x2="895" y2="245.7" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="545" y1="284.3" x2="895" y2="284.3" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="545" y1="322.9" x2="895" y2="322.9" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="545" y1="361.4" x2="895" y2="361.4" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="545" y1="400" x2="895" y2="400" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Thermal Limit Line (80 °C) -->
  <line x1="545" y1="168.6" x2="895" y2="168.6" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Y Tick Labels (Right) -->
  <text x="537" y="134" font-size="12" fill="#6b7280" text-anchor="end">90</text>
  <text x="537" y="173" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">80</text>
  <text x="537" y="211" font-size="12" fill="#6b7280" text-anchor="end">70</text>
  <text x="537" y="250" font-size="12" fill="#6b7280" text-anchor="end">60</text>
  <text x="537" y="288" font-size="12" fill="#6b7280" text-anchor="end">50</text>
  <text x="537" y="327" font-size="12" fill="#6b7280" text-anchor="end">40</text>
  <text x="537" y="365" font-size="12" fill="#6b7280" text-anchor="end">30</text>
  <text x="537" y="404" font-size="12" fill="#6b7280" text-anchor="end">20</text>

  <!-- Vertical Grid Lines (Right) -->
  <line x1="632.5" y1="130" x2="632.5" y2="400" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="720" y1="130" x2="720" y2="400" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="807.5" y1="130" x2="807.5" y2="400" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="895" y1="130" x2="895" y2="400" stroke="#e5e7eb" stroke-width="1"/>

  <!-- X Tick Marks & Labels (Right) -->
  <line x1="545" y1="400" x2="545" y2="404" stroke="#6b7280" stroke-width="1"/>
  <line x1="632.5" y1="400" x2="632.5" y2="404" stroke="#6b7280" stroke-width="1"/>
  <line x1="720" y1="400" x2="720" y2="404" stroke="#6b7280" stroke-width="1"/>
  <line x1="807.5" y1="400" x2="807.5" y2="404" stroke="#6b7280" stroke-width="1"/>
  <line x1="895" y1="400" x2="895" y2="404" stroke="#6b7280" stroke-width="1"/>

  <text x="545" y="418" font-size="12" fill="#6b7280" text-anchor="middle">0.0</text>
  <text x="632.5" y="418" font-size="12" fill="#6b7280" text-anchor="middle">1.0</text>
  <text x="720" y="418" font-size="12" fill="#6b7280" text-anchor="middle">2.0</text>
  <text x="807.5" y="418" font-size="12" fill="#6b7280" text-anchor="middle">3.0</text>
  <text x="895" y="418" font-size="12" fill="#6b7280" text-anchor="middle">4.0</text>

  <text x="720" y="434" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Віддана ємність C, А·год</text>

  <!-- Right Plot Curves -->
  <!-- 10A Curve -->
  <path d="M 545,380.7 C 585,375 610,371 632.5,369.1 C 675,365 695,358 720,353.7 C 760,347 785,340 807.5,334.4 C 845,325 870,318 895,311.3" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="895" cy="311.3" r="3.5" fill="#27ae60"/>

  <!-- 30A Curve -->
  <path d="M 545,380.7 C 585,360 610,345 632.5,338.3 C 675,325 695,302 720,292.0 C 760,276 785,256 807.5,245.7 C 845,229 865,213 881.9,203.3" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="881.9" cy="203.3" r="3.5" fill="#2457d6"/>

  <!-- 45A Curve -->
  <path d="M 545,380.7 C 585,345 610,320 632.5,311.3 C 675,295 695,260 720,245.7 C 760,225 785,202 807.5,191.7 C 835,178 850,168 864.4,160.9" fill="none" stroke="#d35400" stroke-width="2.5"/>
  <circle cx="864.4" cy="160.9" r="3.5" fill="#d35400"/>

  <!-- 70A Pulse Curve -->
  <path d="M 545,380.7 C 565,330 578,295 588.8,276.6 C 608,243 620,212 632.5,199.5 C 648,183 658,162 667.5,149.3" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6,4"/>
  <circle cx="667.5" cy="149.3" r="3.5" fill="#c0392b"/>

  <circle cx="545" cy="380.7" r="3.5" fill="#1a1a1a"/>


  <!-- Bottom Legend Panel -->
  <rect x="40" y="455" width="880" height="50" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>

  <!-- Legend Item 1: 10A -->
  <line x1="60" y1="480" x2="85" y2="480" stroke="#27ae60" stroke-width="3"/>
  <circle cx="72.5" cy="480" r="3.5" fill="#27ae60"/>
  <text x="93" y="484" font-size="12" font-weight="700" fill="#1a1a1a">10 A</text>
  <text x="125" y="484" font-size="12" fill="#6b7280">(безпечний тривалий)</text>

  <!-- Legend Item 2: 30A -->
  <line x1="270" y1="480" x2="295" y2="480" stroke="#2457d6" stroke-width="3"/>
  <circle cx="282.5" cy="480" r="3.5" fill="#2457d6"/>
  <text x="303" y="484" font-size="12" font-weight="700" fill="#1a1a1a">30 A</text>
