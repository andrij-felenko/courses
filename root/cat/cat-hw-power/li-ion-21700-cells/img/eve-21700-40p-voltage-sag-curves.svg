<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Header Section -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Характеристики розряду та нагріву комірки EVE INR21700-40P</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Зростання струму підсилює IR-просідання напруги та прискорює нагрів; розряд 70 A припустимий лише короткими імпульсами</text>

  <!-- Left Panel: Voltage Sag -->
  <rect x="40" y="70" width="425" height="370" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="252" y="94" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Залежність напруги від розрядженої ємності</text>
  <text x="252" y="110" font-size="12" fill="#6b7280" text-anchor="middle">Просідання напруги U (В) при T_поч = 25 °C</text>
  
  <!-- Left Plot Background -->
  <rect x="90" y="130" width="350" height="270" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Left Plot Y Axis Title & Ticks -->
  <text x="90" y="124" font-size="12" font-weight="700" fill="#1a1a1a">U, В</text>
  
  <!-- Horizontal Grid Lines (Left) -->
  <line x1="90" y1="154.5" x2="440" y2="154.5" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="90" y1="215.9" x2="440" y2="215.9" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="90" y1="277.3" x2="440" y2="277.3" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="90" y1="338.6" x2="440" y2="338.6" stroke="#e5e7eb" stroke-dasharray="3,3" stroke-width="1"/>
  <line x1="90" y1="400" x2="440" y2="400" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Y Tick Labels (Left) -->
  <text x="82" y="134" font-size="12" fill="#6b7280" text-anchor="end">4.2</text>
  <text x="82" y="159" font-size="12" fill="#6b7280" text-anchor="end">4.0</text>
  <text x="82" y="220" font-size="12" fill="#6b7280" text-anchor="end">3.5</text>
  <text x="82" y="282" font-size="12" fill="#6b7280" text-anchor="end">3.0</text>
  <text x="82" y="343" font-size="12" fill="#c0392b" text-anchor="end" font-weight="700">2.5</text>
  <text x="82" y="404" font-size="12" fill="#6b7280" text-anchor="end">2.0</text>

  <!-- Vertical Grid Lines (Left) -->
  <line x1="177.5" y1="130" x2="177.5" y2="400" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="265" y1="130" x2="265" y2="400" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="352.5" y1="130" x2="352.5" y2="400" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="440" y1="130" x2="440" y2="400" stroke="#e5e7eb" stroke-width="1"/>

  <!-- X Tick Marks & Labels (Left) -->
  <line x1="90" y1="400" x2="90" y2="404" stroke="#6b7280" stroke-width="1"/>
  <line x1="177.5" y1="400" x2="177.5" y2="404" stroke="#6b7280" stroke-width="1"/>
  <line x1="265" y1="400" x2="265" y2="404" stroke="#6b7280" stroke-width="1"/>
  <line x1="352.5" y1="400" x2="352.5" y2="404" stroke="#6b7280" stroke-width="1"/>
  <line x1="440" y1="400" x2="440" y2="404" stroke="#6b7280" stroke-width="1"/>

  <text x="90" y="418" font-size="12" fill="#6b7280" text-anchor="middle">0.0</text>
  <text x="177.5" y="418" font-size="12" fill="#6b7280" text-anchor="middle">1.0</text>
  <text x="265" y="418" font-size="12" fill="#6b7280" text-anchor="middle">2.0</text>
  <text x="352.5" y="418" font-size="12" fill="#6b7280" text-anchor="middle">3.0</text>
  <text x="440" y="418" font-size="12" fill="#6b7280" text-anchor="middle">4.0</text>

  <text x="265" y="434" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Віддана ємність C, А·год</text>

  <!-- Left Plot Curves -->
  <!-- 10A Curve -->
  <path d="M 90,130 C 93,155 95,159.5 98.8,159.5 C 120,174 150,188 177.5,191.4 C 220,197 240,205 265,209.8 C 295,215 325,220 352.5,225.7 C 385,232 410,242 413.8,246.6 C 425,260 435,300 440,338.6" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="440" cy="338.6" r="3.5" fill="#27ae60"/>

  <!-- 30A Curve -->
  <path d="M 90,130 C 93,190 95,197.5 98.8,197.5 C 120,210 150,220 177.5,225.7 C 220,234 240,238 265,242.9 C 295,249 325,255 352.5,262.5 C 380,270 398,278 405,283.4 C 415,295 422,315 426.9,338.6" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="426.9" cy="338.6" r="3.5" fill="#2457d6"/>

  <!-- 45A Curve -->
  <path d="M 90,130 C 93,220 95,230.7 98.8,230.7 C 120,242 150,252 177.5,257.7 C 220,266 240,270 265,274.9 C 295,281 325,288 352.5,295.7 C 375,302 398,315 409.4,338.6" fill="none" stroke="#d35400" stroke-width="2.5"/>
  <circle cx="409.4" cy="338.6" r="3.5" fill="#d35400"/>

  <!-- 70A Pulse Curve -->
  <path d="M 90,130 C 93,260 95,274.9 98.8,274.9 C 115,285 145,298 177.5,314.2 C 192,321 202,328 212.5,338.6" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6,4"/>
  <circle cx="212.5" cy="338.6" r="3.5" fill="#c0392b"/>

  <circle cx="90" cy="130" r="3.5" fill="#1a1a1a"/>


  <!-- Right Panel: Temperature Rise -->
  <rect x="495" y="70" width="425" height="370" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="707" y="94" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Залежність температури від розрядженої ємності</text>
  <text x="707" y="110" font-size="12" fill="#6b7280" text-anchor="middle">Нагрів корпусу T (°C) при T_навк = 25 °C</text>

  <!-- Right Plot Background -->
  <rect x="545" y="130" width="350" height="270" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

