<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <style>
      .box { fill: #f8f9fa; stroke: #343a40; stroke-width: 2; rx: 5; ry: 5; }
      .text { font-family: sans-serif; font-size: 16px; fill: #212529; text-anchor: middle; alignment-baseline: middle; }
      .title { font-weight: bold; font-size: 18px; }
      .path { fill: none; stroke: #007bff; stroke-width: 3; }
      .arrow { fill: #007bff; }
      .switch { fill: none; stroke: #dc3545; stroke-width: 3; stroke-dasharray: 5,5; }
      .mosfet { fill: #e9ecef; stroke: #6c757d; stroke-width: 2; }
      .label { font-family: sans-serif; font-size: 14px; fill: #495057; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrow"/>
    </marker>
  </defs>

  <!-- Background / Module Boundary -->
  <rect x="180" y="40" width="440" height="320" class="box" fill="#ffffff" stroke-dasharray="8,4" stroke="#adb5bd"/>
  <text x="400" y="60" class="text title" fill="#6c757d">Модуль MH-CD42 (Power Path)</text>

  <!-- External Inputs / Outputs -->
  <rect x="20" y="100" width="120" height="60" class="box" fill="#e2e3e5"/>
  <text x="80" y="130" class="text title">Вхід 5 В</text>

  <rect x="660" y="100" width="120" height="60" class="box" fill="#e2e3e5"/>
  <text x="720" y="120" class="text title">Шина</text>
  <text x="720" y="140" class="text title">навантаження</text>

  <rect x="340" y="320" width="120" height="60" class="box" fill="#e2e3e5"/>
  <text x="400" y="340" class="text title">Li-Ion АКБ</text>
  <text x="400" y="360" class="text">3.0–4.2 В</text>

  <!-- Internal Components -->
  <rect x="320" y="100" width="160" height="60" class="box" fill="#d1e7dd"/>
  <text x="400" y="120" class="text title">Зарядний вузол</text>
  <text x="400" y="140" class="text">CC / CV</text>

  <rect x="440" y="220" width="180" height="60" class="box" fill="#fff3cd"/>
  <text x="530" y="240" class="text title">DC-DC Boost</text>
  <text x="530" y="260" class="text">5.1 В / до 2.1 А</text>

  <rect x="200" y="220" width="120" height="40" class="box" fill="#cff4fc"/>
  <text x="260" y="240" class="text">MOSFET Ключ</text>

  <!-- Connections -->
  <!-- Input to Charge Node -->
  <line x1="140" y1="130" x2="320" y2="130" class="path" marker-end="url(#arrowhead)"/>
  
  <!-- Charge Node to Battery -->
  <path d="M 400 160 L 400 320" class="path" marker-end="url(#arrowhead)"/>
  
  <!-- Input to Load (Bypass) -->
  <path d="M 140 130 L 170 130 L 170 80 L 640 80 L 640 115 L 660 115" class="path" marker-end="url(#arrowhead)"/>
  <text x="400" y="70" class="label" text-anchor="middle">Наскрізне живлення (Bypass)</text>

  <!-- Battery to Boost -->
  <path d="M 400 320 L 400 250 L 440 250" class="path" marker-end="url(#arrowhead)"/>
  
  <!-- Boost to Load -->
  <path d="M 620 250 L 640 250 L 640 145 L 660 145" class="path" marker-end="url(#arrowhead)"/>

  <!-- Battery Disconnect Key (Low Voltage Protection) -->
  <circle cx="400" cy="285" r="15" fill="#fff" stroke="#dc3545" stroke-width="2"/>
  <line x1="390" y1="285" x2="415" y2="275" stroke="#dc3545" stroke-width="2"/>
  <text x="460" y="290" class="label" fill="#dc3545">Захист від</text>
  <text x="460" y="305" class="label" fill="#dc3545">глибокого розряду</text>

</svg>
