<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Коло Keep-Alive та часова діаграма струму живлення MH-CD42</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Короткі імпульси розряду запобігають автовимкненню модуля під час deep-sleep мікроконтролера</text>

  <!-- Left Panel: Circuit Diagram -->
  <rect x="24" y="70" width="444" height="446" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="36" y="82" width="420" height="32" rx="4" ry="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="246" y="103" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Електрична схема кола Keep-Alive</text>

  <!-- MH-CD42 Module Block -->
  <rect x="50" y="135" width="115" height="190" rx="6" ry="6" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="107" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">MH-CD42</text>
  <text x="107" y="176" text-anchor="middle" font-size="12" fill="#6b7280">Заряд / Boost 5V</text>
  
  <!-- MH-CD42 Pins -->
  <text x="155" y="204" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">OUT (5V)</text>
  <circle cx="165" cy="200" r="3" fill="#c0392b"/>

  <text x="155" y="304" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">GND</text>
  <circle cx="165" cy="300" r="3" fill="#1a1a1a"/>

  <!-- MCU Block -->
  <rect x="335" y="135" width="115" height="190" rx="6" ry="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="392" y="158" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">МК (MCU)</text>
  <text x="392" y="176" text-anchor="middle" font-size="12" fill="#6b7280">ESP32 / AVR</text>
  
  <!-- MCU Pins -->
  <circle cx="335" cy="200" r="3" fill="#c0392b"/>
  <text x="345" y="204" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">VCC</text>

  <circle cx="335" cy="250" r="3" fill="#2457d6"/>
  <text x="345" y="254" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">GPIO</text>

  <circle cx="335" cy="300" r="3" fill="#1a1a1a"/>
  <text x="345" y="304" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">GND</text>

  <!-- Power Line (+5V) -->
  <line x1="165" y1="200" x2="335" y2="200" stroke="#c0392b" stroke-width="2"/>
  <text x="250" y="188" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">+5V</text>

  <!-- Ground Line (GND) -->
  <line x1="165" y1="300" x2="335" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <text x="250" y="318" text-anchor="middle" font-size="12" fill="#6b7280">GND</text>

  <!-- Keep-Alive Components -->
  <!-- R2 Load Resistor (51 Ohm) -->
  <line x1="235" y1="200" x2="235" y2="210" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="229" y="210" width="12" height="24" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="235" y1="234" x2="235" y2="242" stroke="#27ae60" stroke-width="1.5"/>
  <text x="223" y="218" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">R2 (51 Ом)</text>
  <text x="223" y="232" text-anchor="end" font-size="12" fill="#6b7280">(~100 мА)</text>

  <!-- R1 Base Resistor (1 kOhm) -->
  <line x1="335" y1="250" x2="295" y2="250" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="265" y="244" width="30" height="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="265" y1="250" x2="247" y2="250" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="280" y="238" text-anchor="middle" font-size="12" fill="#1a1a1a">R1 (1 кОм)</text>

  <!-- Q1 Transistor (NPN) -->
  <circle cx="235" cy="265" r="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="235" y1="258" x2="235" y2="272" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="247" y1="265" x2="235" y2="265" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="235" y1="261" x2="235" y2="242" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="235" y1="269" x2="235" y2="300" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="252" y="269" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">Q1 (NPN)</text>
  <circle cx="235" cy="300" r="3" fill="#1a1a1a"/>
  <circle cx="235" cy="200" r="3" fill="#c0392b"/>

  <!-- Left Panel Info Box -->
  <rect x="36" y="345" width="420" height="155" rx="4" ry="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="48" y="366" font-size="13" font-weight="bold" fill="#1a1a1a">Принцип роботи Keep-Alive:</text>
  <text x="48" y="388" font-size="12" fill="#1a1a1a">1. МК у режимі Deep-Sleep споживає &lt; 1 мА</text>
  <text x="48" y="408" font-size="12" fill="#c0392b">2. Автовимкнення MH-CD42 спрацьовує при I &lt; 45–50 мА</text>
  <text x="48" y="428" font-size="12" fill="#27ae60">3. МК подає HIGH на GPIO кожні 10–15 с на 100 мс</text>
  <text x="48" y="448" font-size="12" fill="#27ae60">4. Імпульс ~100 мА скидає внутрішній таймер модуля</text>
  <text x="48" y="468" font-size="12" fill="#6b7280">5. Середній додатковий струм розряду: &lt; 1 мА</text>

  <!-- Right Panel: Timing Diagram -->
  <rect x="492" y="70" width="444" height="446" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="504" y="82" width="420" height="32" rx="4" ry="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="714" y="103" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Часова діаграма струму I_load(t)</text>

  <!-- Graph Axes -->
  <!-- Y Axis -->
  <line x1="585" y1="305" x2="585" y2="135" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="575" y="132" text-anchor="end" font-size="13" font-weight="bold" fill="#1a1a1a">I (мА)</text>

  <!-- X Axis -->
  <line x1="575" y1="305" x2="910" y2="305" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="915" y="324" text-anchor="end" font-size="13" font-weight="bold" fill="#1a1a1a">t (с)</text>

  <!-- Y Levels & Ticks -->
  <!-- I_pulse (~100 mA) level -->
  <line x1="580" y1="160" x2="585" y2="160" stroke="#2457d6" stroke-width="1.5"/>
  <text x="575" y="164" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">I_pulse</text>

  <!-- I_th (45 mA) cutoff threshold level -->
  <line x1="585" y1="225" x2="900" y2="225" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="580" y1="225" x2="585" y2="225" stroke="#c0392b" stroke-width="1.5"/>
  <text x="575" y="229" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">I_th (45 мА)</text>

  <!-- I_sleep level -->
  <line x1="580" y1="290" x2="585" y2="290" stroke="#6b7280" stroke-width="1.5"/>
  <text x="575" y="293" text-anchor="end" font-size="12" fill="#6b7280">I_sleep</text>

  <!-- 0 level -->
  <line x1="580" y1="305" x2="585" y2="305" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="575" y="318" text-anchor="end" font-size="12" fill="#6b7280">0</text>

  <!-- Pulse 1 Fill & Path -->
  <polygon points="615,290 615,160 645,160 645,290" fill="#eaf0fd" opacity="0.8"/>
  <polygon points="775,290 775,160 805,160 805,290" fill="#eaf0fd" opacity="0.8"/>

  <!-- Waveform line -->
  <path d="M 585,290 L 615,290 L 615,160 L 645,160 L 645,290 L 775,290 L 775,160 L 805,160 L 805,290 L 895,290" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Status Badges inside chart area -->
  <rect x="660" y="182" width="150" height="22" rx="3" ry="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="735" y="197" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Модуль активний</text>

  <rect x="650" y="242" width="170" height="22" rx="3" ry="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="735" y="257" text-anchor="middle" font-size="12" fill="#c0392b">Поріг вимкнення 45 мА</text>

  <!-- Pulse Width Dimension Line (T_pulse) -->
  <line x1="615" y1="145" x2="645" y2="145" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="615" y1="141" x2="615" y2="149" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="645" y1="141" x2="645" y2="149" stroke="#2457d6" stroke-width="1.5"/>
  <text x="630" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">T_pulse ≈ 100 мс</text>

  <!-- Period Dimension Line (T_period) -->
  <line x1="615" y1="325" x2="775" y2="325" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="615" y1="321" x2="615" y2="329" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="775" y1="321" x2="775" y2="329" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="695" y="340" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">T_period ≈ 10–15 с (&lt; T_timeout)</text>

  <!-- Right Panel Info Box -->
  <rect x="504" y="365" width="420" height="135" rx="4" ry="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="516" y="386" font-size="13" font-weight="bold" fill="#1a1a1a">Вимоги до імпульсів Keep-Alive:</text>
  <text x="516" y="408" font-size="12" fill="#1a1a1a">• Амплітуда: I_pulse &gt; 50 мА (зазвичай 70–100 мА)</text>
  <text x="516" y="428" font-size="12" fill="#1a1a1a">• Тривалість: T_pulse = 100–200 мс (достатньо для детект.)</text>
  <text x="516" y="448" font-size="12" fill="#27ae60">• Період: T_period &lt; T_timeout (таймаут сну 16–32 с)</text>
  <text x="516" y="468" font-size="12" fill="#6b7280">• Енергоефективність: S = T_period / T_pulse ≈ 100</text>
</svg>
