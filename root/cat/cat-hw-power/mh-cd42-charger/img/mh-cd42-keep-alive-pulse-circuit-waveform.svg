<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <style>
      .box { fill: #f8f9fa; stroke: #343a40; stroke-width: 2; rx: 5; ry: 5; }
      .text { font-family: sans-serif; font-size: 14px; fill: #212529; text-anchor: middle; alignment-baseline: middle; }
      .title { font-weight: bold; font-size: 16px; }
      .axis { stroke: #343a40; stroke-width: 2; }
      .line { fill: none; stroke: #007bff; stroke-width: 2.5; }
      .thresh { fill: none; stroke: #dc3545; stroke-width: 2; stroke-dasharray: 5,5; }
      .label { font-family: sans-serif; font-size: 13px; fill: #495057; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#343a40"/>
    </marker>
  </defs>

  <!-- Left: Circuit Diagram -->
  <rect x="20" y="40" width="300" height="320" class="box" fill="#ffffff" stroke-dasharray="8,4"/>
  <text x="170" y="70" class="text title">Схема Keep-Alive</text>

  <!-- MCU -->
  <rect x="40" y="160" width="80" height="80" class="box" fill="#e2e3e5"/>
  <text x="80" y="200" class="text title">MCU</text>
  <text x="80" y="220" class="text">(Глибокий сон)</text>
  
  <line x1="120" y1="200" x2="180" y2="200" stroke="#343a40" stroke-width="2"/>
  <text x="150" y="190" class="label">GPIO</text>

  <!-- MOSFET -->
  <circle cx="210" cy="200" r="30" class="box" fill="#fff"/>
  <line x1="180" y1="200" x2="195" y2="200" stroke="#343a40" stroke-width="2"/> <!-- Gate -->
  <line x1="195" y1="180" x2="195" y2="220" stroke="#343a40" stroke-width="3"/> <!-- Channel -->
  <line x1="205" y1="180" x2="205" y2="220" stroke="#343a40" stroke-width="2"/>
  
  <line x1="205" y1="190" x2="240" y2="190" stroke="#343a40" stroke-width="2"/> <!-- Drain -->
  <line x1="205" y1="210" x2="240" y2="210" stroke="#343a40" stroke-width="2"/> <!-- Source -->
  
  <!-- Ground -->
  <line x1="240" y1="210" x2="240" y2="260" stroke="#343a40" stroke-width="2"/>
  <line x1="225" y1="260" x2="255" y2="260" stroke="#343a40" stroke-width="2"/>
  <line x1="232" y1="265" x2="248" y2="265" stroke="#343a40" stroke-width="2"/>
  <line x1="238" y1="270" x2="242" y2="270" stroke="#343a40" stroke-width="2"/>
  
  <!-- Resistor to 5V -->
  <line x1="240" y1="190" x2="240" y2="160" stroke="#343a40" stroke-width="2"/>
  <rect x="230" y="120" width="20" height="40" fill="#fff" stroke="#343a40" stroke-width="2"/>
  <text x="275" y="140" class="label">R = 47 Ом</text>
  <line x1="240" y1="120" x2="240" y2="100" stroke="#343a40" stroke-width="2"/>
  <text x="240" y="90" class="text title">Шина 5 В</text>

  <!-- Right: Waveform -->
  <rect x="340" y="40" width="440" height="320" class="box" fill="#ffffff" stroke-dasharray="8,4"/>
  <text x="560" y="70" class="text title">Часова діаграма споживання струму</text>

  <!-- Axes -->
  <line x1="380" y1="320" x2="750" y2="320" class="axis" marker-end="url(#arrow)"/>
  <line x1="380" y1="320" x2="380" y2="100" class="axis" marker-end="url(#arrow)"/>
  <text x="360" y="110" class="text">I (мА)</text>
  <text x="740" y="340" class="text">t (с)</text>

  <!-- Threshold line -->
  <line x1="380" y1="220" x2="730" y2="220" class="thresh"/>
  <text x="440" y="210" class="label" fill="#dc3545">Поріг автовимкнення (45–50 мА)</text>

  <!-- Current Waveform -->
  <!-- Base: ~0 mA (deep sleep), Pulses: 100mA for 50-100ms every 10-15s -->
  <!-- Let's map 100mA to y=140, 0mA to y=320, 50mA to y=220 -->
  <path d="M 380 315 L 430 315 L 430 140 L 440 140 L 440 315 L 600 315 L 600 140 L 610 140 L 610 315 L 720 315" class="line"/>
  
  <text x="360" y="315" class="label">0</text>
  <text x="360" y="140" class="label">100</text>
  
  <!-- Annotations -->
  <line x1="430" y1="120" x2="440" y2="120" stroke="#343a40" stroke-width="1"/>
  <line x1="430" y1="115" x2="430" y2="125" stroke="#343a40" stroke-width="1"/>
  <line x1="440" y1="115" x2="440" y2="125" stroke="#343a40" stroke-width="1"/>
  <text x="435" y="105" class="label">50-100 мс</text>

  <line x1="440" y1="340" x2="600" y2="340" stroke="#343a40" stroke-width="1"/>
  <line x1="440" y1="335" x2="440" y2="345" stroke="#343a40" stroke-width="1"/>
  <line x1="600" y1="335" x2="600" y2="345" stroke="#343a40" stroke-width="1"/>
  <text x="520" y="355" class="label">Період T = 10–15 с</text>

  <text x="520" y="300" class="label">Сон MCU</text>
</svg>
