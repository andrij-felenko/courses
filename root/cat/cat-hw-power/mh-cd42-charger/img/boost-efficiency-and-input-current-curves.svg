  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Зі зниженням напруги акумулятора струм розряду нелінійно зростає (при V_out = 5 В, I_out = 2 А)</text>
  
  <!-- Axis Labels -->
