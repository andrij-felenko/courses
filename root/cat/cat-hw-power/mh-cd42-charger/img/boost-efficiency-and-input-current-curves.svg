  <line x1="435" y1="90" x2="465" y2="90" stroke="#2457d6" stroke-width="3"/>
  <text x="475" y="94" font-size="13" fill="#1a1a1a">Вхідний струм I_bat</text>
  <line x1="435" y1="110" x2="465" y2="110" stroke="#27ae60" stroke-width="3"/>
  <text x="475" y="114" font-size="13" fill="#1a1a1a">Коефіцієнт корисної дії η</text>
  <text x="475" y="134" font-size="12" fill="#6b7280">I_bat = (V_out × I_out) / (V_bat × η)</text>
