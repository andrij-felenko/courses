  <text x="180" y="380" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">+</text>
  <text x="260" y="380" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">−</text>
