  <text x="360" y="112" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">5 В</text>
  <text x="360" y="312" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GND</text>

  <line x1="400" y1="120" x2="400" y2="210" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="385" y1="210" x2="415" y2="210" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="385" y1="220" x2="415" y2="220" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="400" y1="220" x2="400" y2="320" stroke="#1a1a1a" stroke-width="2"/>
  <text x="390" y="200" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">+</text>
  <text x="420" y="215" font-size="12" fill="#1a1a1a" text-anchor="start">C1 100 мкФ</text>

  <line x1="500" y1="120" x2="500" y2="210" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="485" y1="210" x2="515" y2="210" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="485" y1="220" x2="515" y2="220" stroke="#1a1a1a" stroke-width="2"/>
