  <text x="180" y="285" font-size="12" fill="#1a1a1a" text-anchor="middle">P+</text>
  <text x="260" y="285" font-size="12" fill="#1a1a1a" text-anchor="middle">P-</text>
  <text x="180" y="315" font-size="12" fill="#1a1a1a" text-anchor="middle">B+</text>
  <text x="260" y="315" font-size="12" fill="#1a1a1a" text-anchor="middle">B-</text>

