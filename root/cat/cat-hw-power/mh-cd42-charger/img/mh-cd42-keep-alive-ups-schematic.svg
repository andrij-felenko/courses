  <text x="520" y="215" font-size="12" fill="#1a1a1a" text-anchor="start">C2 100 нФ</text>

  <circle cx="400" cy="120" r="3" fill="#1a1a1a"/>
  <circle cx="400" cy="320" r="3" fill="#1a1a1a"/>
  <circle cx="500" cy="120" r="3" fill="#1a1a1a"/>
  <circle cx="500" cy="320" r="3" fill="#1a1a1a"/>
  <circle cx="590" cy="120" r="3" fill="#1a1a1a"/>
  <circle cx="590" cy="320" r="3" fill="#1a1a1a"/>

  <circle cx="610" cy="260" r="25" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="610" y1="245" x2="610" y2="275" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="635" y1="260" x2="610" y2="260" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="610" y1="252" x2="590" y2="232" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="590" y1="232" x2="590" y2="200" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="610" y1="268" x2="590" y2="288" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="590" y1="288" x2="590" y2="320" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="590,288 590,280 598,288" fill="#1a1a1a"/>
  <text x="640" y="300" font-size="12" fill="#1a1a1a" text-anchor="start">Q1 (NPN)</text>

  <rect x="585" y="160" width="10" height="40" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="590" y1="120" x2="590" y2="160" stroke="#1a1a1a" stroke-width="2"/>
  <text x="605" y="185" font-size="12" fill="#1a1a1a" text-anchor="start">R2 47 Ом</text>

  <rect x="650" y="255" width="40" height="10" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="635" y1="260" x2="650" y2="260" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="690" y1="260" x2="740" y2="260" stroke="#1a1a1a" stroke-width="2"/>
  <text x="670" y="245" font-size="12" fill="#1a1a1a" text-anchor="middle">R1 1 кОм</text>

  <text x="730" y="252" font-size="12" fill="#2457d6" text-anchor="end">Імпульс від GPIO</text>
  <line x1="570" y1="135" x2="570" y2="185" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <text x="560" y="165" font-size="12" fill="#2457d6" text-anchor="end">Струм 100 мА</text>
