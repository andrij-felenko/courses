<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема джерела безперебійного живлення на MH-CD42 з колом Keep-Alive</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Інтеграція модуля живлення, літієвого акумулятора із захистом та генератора імпульсів струму</text>

  <rect x="30" y="80" width="80" height="160" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="70" y="150" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">USB</text>
  <text x="70" y="170" font-size="13" fill="#6b7280" text-anchor="middle">Живлення</text>
  <text x="105" y="124" font-size="12" fill="#1a1a1a" text-anchor="end">5V</text>
  <text x="105" y="204" font-size="12" fill="#1a1a1a" text-anchor="end">GND</text>
  <line x1="110" y1="120" x2="140" y2="120" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="110" y1="200" x2="140" y2="200" stroke="#1a1a1a" stroke-width="2"/>

  <rect x="140" y="80" width="160" height="160" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="220" y="150" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">MH-CD42</text>
  <text x="220" y="170" font-size="13" fill="#6b7280" text-anchor="middle">Модуль UPS 5V</text>
  
  <text x="148" y="124" font-size="12" fill="#1a1a1a" text-anchor="start">VIN</text>
  <text x="148" y="204" font-size="12" fill="#1a1a1a" text-anchor="start">GND</text>
  <text x="292" y="124" font-size="12" fill="#1a1a1a" text-anchor="end">VOUT</text>
  <text x="292" y="204" font-size="12" fill="#1a1a1a" text-anchor="end">GND</text>
  <text x="180" y="232" font-size="12" fill="#1a1a1a" text-anchor="middle">BAT+</text>
  <text x="260" y="232" font-size="12" fill="#1a1a1a" text-anchor="middle">BAT-</text>

  <rect x="160" y="270" width="120" height="50" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
