  <text x="820" y="230" font-size="13" fill="#6b7280" text-anchor="middle">(ESP32 / STM32)</text>
  <text x="748" y="124" font-size="12" fill="#1a1a1a" text-anchor="start">5V IN</text>
  <text x="748" y="264" font-size="12" fill="#1a1a1a" text-anchor="start">GPIO</text>
  <text x="748" y="324" font-size="12" fill="#1a1a1a" text-anchor="start">GND IN</text>

  <line x1="300" y1="120" x2="740" y2="120" stroke="#1a1a1a" stroke-width="2"/>
