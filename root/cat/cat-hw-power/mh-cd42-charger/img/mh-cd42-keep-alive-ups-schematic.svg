  <text x="220" y="415" font-size="13" fill="#6b7280" text-anchor="middle">3.7 В</text>

  <rect x="740" y="80" width="160" height="280" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
