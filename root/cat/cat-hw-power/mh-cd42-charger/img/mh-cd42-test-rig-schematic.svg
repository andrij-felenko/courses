<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Принципова схема лабораторного стенду для випробування MH-CD42</text>
  <text x="480" y="65" text-anchor="middle" font-size="13" fill="#6b7280">Паразитний опір дротів знижує напругу на навантаженні, а струм 2 А викликає значний нагрів мікросхеми</text>

  <!-- Термограф -->
  <rect x="360" y="50" width="200" height="44" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="460" y="77" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Термограф</text>
  <path d="M 460 94 L 460 225" stroke="#27ae60" stroke-width="2" stroke-dasharray="4 2" marker-end="url(#arr-green)"/>
  <text x="450" y="140" text-anchor="end" font-size="13" fill="#27ae60">Термопара (T<tspan baseline-shift="sub" font-size="11">MAX</tspan>)</text>

  <!-- Джерело живлення -->
  <rect x="40" y="150" width="120" height="160" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="100" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Джерело</text>
  <text x="100" y="235" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">живлення</text>
  <text x="100" y="255" text-anchor="middle" font-size="13" fill="#6b7280">5.0 В</text>

  <!-- Модуль MH-CD42 -->
  <rect x="380" y="150" width="160" height="160" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="460" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Плата MH-CD42</text>
  <rect x="430" y="210" width="60" height="80" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="460" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">SoC</text>
  <circle cx="460" cy="230" r="4" fill="#c0392b"/>

  <!-- Електронне навантаження -->
  <rect x="800" y="150" width="120" height="160" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="860" y="215" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Електронне</text>
  <text x="860" y="235" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">навантаження</text>
  <text x="860" y="255" text-anchor="middle" font-size="13" fill="#c0392b">2.0 А</text>

  <!-- Силові лінії -->
  <path d="M 160 200 L 380 200" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 160 300 L 380 300" stroke="#1a1a1a" stroke-width="2"/>
  
  <path d="M 540 200 L 660 200" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="660" y="192" width="30" height="16" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <path d="M 690 200 L 800 200" stroke="#1a1a1a" stroke-width="2"/>
  
  <path d="M 540 300 L 660 300" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="660" y="292" width="30" height="16" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <path d="M 690 300 L 800 300" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Контактні майданчики -->
  <circle cx="160" cy="200" r="4" fill="#1a1a1a"/>
  <circle cx="160" cy="300" r="4" fill="#1a1a1a"/>
  <circle cx="380" cy="200" r="4" fill="#1a1a1a"/>
  <circle cx="380" cy="300" r="4" fill="#1a1a1a"/>
  <circle cx="540" cy="200" r="4" fill="#1a1a1a"/>
  <circle cx="540" cy="300" r="4" fill="#1a1a1a"/>
  <circle cx="800" cy="200" r="4" fill="#1a1a1a"/>
  <circle cx="800" cy="300" r="4" fill="#1a1a1a"/>

  <!-- Підписи контактів -->
  <text x="150" y="195" text-anchor="end" font-size="12" fill="#6b7280">+</text>
  <text x="150" y="315" text-anchor="end" font-size="12" fill="#6b7280">-</text>
  
  <text x="810" y="195" text-anchor="start" font-size="12" fill="#6b7280">+</text>
  <text x="810" y="315" text-anchor="start" font-size="12" fill="#6b7280">-</text>
  
  <text x="390" y="195" text-anchor="start" font-size="12" fill="#6b7280">VIN+</text>
  <text x="390" y="315" text-anchor="start" font-size="12" fill="#6b7280">VIN-</text>
  <text x="530" y="195" text-anchor="end" font-size="12" fill="#6b7280">VOUT+</text>
  <text x="530" y="315" text-anchor="end" font-size="12" fill="#6b7280">VOUT-</text>

  <!-- Паразитні опори -->
  <text x="675" y="186" text-anchor="middle" font-size="12" fill="#c0392b">R<tspan baseline-shift="sub" font-size="11">дроту</tspan></text>
  <text x="675" y="324" text-anchor="middle" font-size="12" fill="#c0392b">R<tspan baseline-shift="sub" font-size="11">дроту</tspan></text>

  <!-- Напрямок струму -->
  <path d="M 320 190 L 350 190" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="335" y="184" text-anchor="middle" font-size="12" fill="#2457d6">I<tspan baseline-shift="sub" font-size="11">IN</tspan></text>
  
  <path d="M 550 190 L 580 190" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="565" y="184" text-anchor="middle" font-size="12" fill="#2457d6">I<tspan baseline-shift="sub" font-size="11">OUT</tspan></text>

  <!-- Вольтметри -->
  <path d="M 270 234 L 270 200" stroke="#2457d6" stroke-width="2"/>
  <path d="M 270 266 L 270 300" stroke="#2457d6" stroke-width="2"/>
  <circle cx="270" cy="200" r="3" fill="#2457d6"/>
  <circle cx="270" cy="300" r="3" fill="#2457d6"/>
  <circle cx="270" cy="250" r="16" fill="white" stroke="#2457d6" stroke-width="2"/>
  <text x="270" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">V</text>
  <text x="245" y="254" text-anchor="end" font-size="13" fill="#2457d6">U<tspan baseline-shift="sub" font-size="11">IN</tspan></text>

  <path d="M 610 234 L 610 200" stroke="#2457d6" stroke-width="2"/>
  <path d="M 610 266 L 610 300" stroke="#2457d6" stroke-width="2"/>
  <circle cx="610" cy="200" r="3" fill="#2457d6"/>
  <circle cx="610" cy="300" r="3" fill="#2457d6"/>
  <circle cx="610" cy="250" r="16" fill="white" stroke="#2457d6" stroke-width="2"/>
  <text x="610" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">V</text>
  <text x="585" y="254" text-anchor="end" font-size="13" fill="#2457d6">U<tspan baseline-shift="sub" font-size="11">OUT</tspan></text>

  <path d="M 755 234 L 755 200" stroke="#2457d6" stroke-width="2"/>
  <path d="M 755 266 L 755 300" stroke="#2457d6" stroke-width="2"/>
  <circle cx="755" cy="200" r="3" fill="#2457d6"/>
  <circle cx="755" cy="300" r="3" fill="#2457d6"/>
  <circle cx="755" cy="250" r="16" fill="white" stroke="#2457d6" stroke-width="2"/>
  <text x="755" y="255" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">V</text>
  <text x="730" y="254" text-anchor="end" font-size="13" fill="#2457d6">U<tspan baseline-shift="sub" font-size="11">LOAD</tspan></text>

</svg>
