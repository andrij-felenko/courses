<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <style>
      .box { fill: #f8f9fa; stroke: #343a40; stroke-width: 2; rx: 5; ry: 5; }
      .text { font-family: sans-serif; font-size: 14px; fill: #212529; text-anchor: middle; alignment-baseline: middle; }
      .title { font-weight: bold; font-size: 16px; }
      .axis { stroke: #343a40; stroke-width: 2; }
      .line-bad { fill: none; stroke: #dc3545; stroke-width: 3; }
      .line-good { fill: none; stroke: #198754; stroke-width: 3; stroke-dasharray: 6,4; }
      .thresh { fill: none; stroke: #fd7e14; stroke-width: 2; stroke-dasharray: 4,4; }
      .label { font-family: sans-serif; font-size: 13px; fill: #495057; }
      .legend { font-family: sans-serif; font-size: 14px; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#343a40"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="760" height="360" class="box" fill="#ffffff"/>
  <text x="400" y="50" class="text title">Перехідний процес напруги 5 В при перемиканні в режим ДБЖ (UPS)</text>

  <!-- Axes -->
  <line x1="80" y1="320" x2="720" y2="320" class="axis" marker-end="url(#arrow)"/>
  <line x1="80" y1="320" x2="80" y2="80" class="axis" marker-end="url(#arrow)"/>
  <text x="60" y="90" class="text">U (В)</text>
  <text x="710" y="340" class="text">t (мс)</text>

  <!-- Y-Axis Labels -->
  <text x="50" y="120" class="label">5.0</text>
  <text x="50" y="240" class="label">4.2</text>
  <text x="50" y="280" class="label">3.0</text>

  <line x1="75" y1="120" x2="85" y2="120" class="axis"/>
  <line x1="75" y1="240" x2="85" y2="240" class="axis"/>
  <line x1="75" y1="280" x2="85" y2="280" class="axis"/>

  <!-- Critical Threshold (BOD Reset typically happens when 5V drops to ~4.3V causing 3.3V LDO drop) -->
  <line x1="80" y1="220" x2="700" y2="220" class="thresh"/>
  <text x="600" y="210" class="label" fill="#fd7e14">Критична напруга перезапуску MCU</text>

  <!-- Switch Event Line -->
  <line x1="250" y1="80" x2="250" y2="320" stroke="#adb5bd" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="250" y="340" class="label">Знеструмлення мережі</text>

  <!-- Waveform without capacitor (Bad) -->
  <!-- 5V -> drop to 4.2V -> recovery to 5V -->
  <path d="M 80 120 L 250 120 Q 260 250 280 240 Q 300 120 350 120 L 700 120" class="line-bad"/>

  <!-- Waveform with capacitor (Good) -->
  <!-- 5V -> drop to 4.8V -> recovery -->
  <path d="M 80 120 L 250 120 Q 280 160 320 120 L 700 120" class="line-good"/>

  <!-- Annotations -->
  <text x="320" y="260" class="label" fill="#dc3545">Просідання до 4.2–4.5 В</text>

  <!-- Legend -->
  <rect x="450" y="250" width="280" height="60" fill="#f8f9fa" stroke="#ced4da" stroke-width="1" rx="3"/>
  <line x1="460" y1="270" x2="500" y2="270" class="line-bad"/>
  <text x="510" y="270" class="legend" text-anchor="start">Без компенсації (перезапуск)</text>
  
  <line x1="460" y1="295" x2="500" y2="295" class="line-good"/>
  <text x="510" y="295" class="legend" text-anchor="start">З конденсатором 220–470 мкФ</text>

</svg>
