<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Еквівалентна теплова схема тримача запобіжника</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Джерела тепла створюють теплові потоки, які через теплові опори формують сумарний перегрів</text>

  <!-- Формули (як підсумовуються температури) -->
  <rect x="580" y="75" width="350" height="95" rx="6" ry="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="600" y="100" font-size="14" fill="#1a1a1a">ΔT<tspan baseline-shift="sub" font-size="11">case</tspan> = (P<tspan baseline-shift="sub" font-size="11">fuse</tspan> + P<tspan baseline-shift="sub" font-size="11">contacts</tspan>) × R<tspan baseline-shift="sub" font-size="11">th_case</tspan></text>
  <text x="600" y="125" font-size="14" fill="#1a1a1a">ΔT<tspan baseline-shift="sub" font-size="11">fuse</tspan> = P<tspan baseline-shift="sub" font-size="11">fuse</tspan> × R<tspan baseline-shift="sub" font-size="11">th_fuse</tspan></text>
  <text x="600" y="150" font-size="14" font-weight="bold" fill="#1a1a1a">T<tspan baseline-shift="sub" font-size="11" font-weight="bold">fuse</tspan> = T<tspan baseline-shift="sub" font-size="11" font-weight="bold">amb</tspan> + ΔT<tspan baseline-shift="sub" font-size="11" font-weight="bold">case</tspan> + ΔT<tspan baseline-shift="sub" font-size="11" font-weight="bold">fuse</tspan></text>

  <!-- Провідники -->
  <!-- Верхня лінія (Y=190) -->
  <line x1="220" y1="190" x2="320" y2="190" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="380" y1="190" x2="480" y2="190" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="480" y1="190" x2="740" y2="190" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Нижня лінія (Ground, Y=360) -->
  <line x1="180" y1="360" x2="780" y2="360" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- Вертикальні лінії для джерел та резистора -->
  <line x1="220" y1="190" x2="220" y2="255" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="220" y1="305" x2="220" y2="360" stroke="#1a1a1a" stroke-width="2"/>
  
  <line x1="480" y1="190" x2="480" y2="255" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="480" y1="305" x2="480" y2="360" stroke="#1a1a1a" stroke-width="2"/>
  
  <line x1="740" y1="190" x2="740" y2="250" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="740" y1="310" x2="740" y2="360" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Заземлення -->
  <line x1="480" y1="360" x2="480" y2="375" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="465" y1="375" x2="495" y2="375" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="472" y1="381" x2="488" y2="381" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="477" y1="387" x2="483" y2="387" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Компоненти -->
  <!-- R_th_fuse -->
  <rect x="320" y="180" width="60" height="20" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <!-- R_th_case -->
  <rect x="730" y="250" width="20" height="60" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- Джерело P_fuse -->
  <circle cx="220" cy="280" r="25" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="220" y1="295" x2="220" y2="265" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  
  <!-- Джерело P_contacts -->
  <circle cx="480" cy="280" r="25" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="480" y1="295" x2="480" y2="265" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Вузли (точки) -->
  <circle cx="220" cy="190" r="4" fill="#1a1a1a"/>
  <circle cx="480" cy="190" r="4" fill="#1a1a1a"/>
  <circle cx="740" cy="190" r="4" fill="#1a1a1a"/>
  <circle cx="220" cy="360" r="4" fill="#1a1a1a"/>
  <circle cx="480" cy="360" r="4" fill="#1a1a1a"/>
  <circle cx="740" cy="360" r="4" fill="#1a1a1a"/>

  <!-- Підписи вузлів -->
  <text x="220" y="145" text-anchor="middle" font-size="13" fill="#6b7280">Запобіжник</text>
  <text x="220" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">T<tspan baseline-shift="sub" font-size="11" font-weight="bold">fuse</tspan></text>

  <text x="480" y="145" text-anchor="middle" font-size="13" fill="#6b7280">Корпус</text>
  <text x="480" y="165" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">T<tspan baseline-shift="sub" font-size="11" font-weight="bold">case</tspan></text>

  <text x="740" y="395" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">T<tspan baseline-shift="sub" font-size="11" font-weight="bold">amb</tspan></text>
  <text x="740" y="415" text-anchor="middle" font-size="13" fill="#6b7280">Середовище</text>

  <!-- Підписи компонентів -->
  <text x="350" y="145" text-anchor="middle" font-size="13" fill="#6b7280">Опір до корпусу</text>
  <text x="350" y="165" text-anchor="middle" font-size="14" fill="#1a1a1a">R<tspan baseline-shift="sub" font-size="11">th_fuse</tspan></text>

  <text x="175" y="275" text-anchor="end" font-size="14" fill="#1a1a1a">P<tspan baseline-shift="sub" font-size="11">fuse</tspan></text>
  <text x="175" y="295" text-anchor="end" font-size="13" fill="#6b7280">Втрати у вставці</text>

  <text x="435" y="275" text-anchor="end" font-size="14" fill="#1a1a1a">P<tspan baseline-shift="sub" font-size="11">contacts</tspan></text>
  <text x="435" y="295" text-anchor="end" font-size="13" fill="#6b7280">Втрати на клемах</text>

  <text x="770" y="275" text-anchor="start" font-size="14" fill="#1a1a1a">R<tspan baseline-shift="sub" font-size="11">th_case</tspan></text>
  <text x="770" y="295" text-anchor="start" font-size="13" fill="#6b7280">Опір до середовища</text>
</svg>
