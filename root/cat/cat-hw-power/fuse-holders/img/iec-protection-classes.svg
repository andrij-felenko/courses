<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Класи захисту тримачів запобіжників (IEC 60127-6)</text>
  <text x="480" y="65" font-size="13" fill="#6b7280" text-anchor="middle">Відкриті контакти у PC1 проти схованих контактів у PC2 та ізоляції в PC3</text>

  <rect x="60" y="300" width="200" height="10" fill="#f4f6f8" stroke="#d0d7de"/>
  <rect x="126" y="220" width="10" height="80" fill="#2457d6"/>
  <rect x="184" y="220" width="10" height="80" fill="#2457d6"/>
  <rect x="126" y="290" width="68" height="10" fill="#2457d6"/>
  
  <rect x="136" y="90" width="48" height="170" rx="24" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <path d="M 136 240 L 116 230 M 184 240 L 204 230" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>

  <text x="160" y="340" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">PC1: Відкритий тримач</text>
  <text x="160" y="365" font-size="13" fill="#1a1a1a" text-anchor="middle">Палець торкається</text>
  <text x="160" y="390" font-size="13" fill="#1a1a1a" text-anchor="middle">струмовідних частин</text>
  <text x="160" y="415" font-size="13" fill="#c0392b" font-weight="bold" text-anchor="middle">Немає захисту</text>

  <line x1="210" y1="258" x2="194" y2="258" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="215" y="263" font-size="12" fill="#1a1a1a">Відкриті контакти</text>

  <path d="M 390 210 L 470 210 L 470 310 L 440 310 L 440 218 L 390 218 Z" fill="#f4f6f8" stroke="#d0d7de"/>
  <path d="M 490 210 L 570 210 L 570 218 L 520 218 L 520 310 L 490 310 Z" fill="#f4f6f8" stroke="#d0d7de"/>
  <rect x="470" y="290" width="20" height="20" fill="#2457d6"/>

  <rect x="456" y="90" width="48" height="120" rx="24" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>

  <text x="480" y="340" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">PC2: Закритий тримач</text>
  <text x="480" y="365" font-size="13" fill="#1a1a1a" text-anchor="middle">Стандартний палець</text>
  <text x="480" y="390" font-size="13" fill="#1a1a1a" text-anchor="middle">не проходить в отвір</text>
  <text x="480" y="415" font-size="13" fill="#27ae60" font-weight="bold" text-anchor="middle">Захист від дотику</text>

  <line x1="580" y1="190" x2="492" y2="206" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="585" y="194" font-size="12" fill="#1a1a1a">Отвір &lt; 12 мм</text>

  <path d="M 710 210 L 790 210 L 790 310 L 760 310 L 760 218 L 710 218 Z" fill="#f4f6f8" stroke="#d0d7de"/>
  <path d="M 810 210 L 890 210 L 890 218 L 840 218 L 840 310 L 810 310 Z" fill="#f4f6f8" stroke="#d0d7de"/>
  <rect x="790" y="240" width="20" height="6" fill="#1a1a1a"/>
  <rect x="790" y="290" width="20" height="20" fill="#2457d6"/>

  <rect x="798" y="90" width="4" height="150" fill="#27ae60"/>

  <text x="800" y="340" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">PC3: Посилений захист</text>
  <text x="800" y="365" font-size="13" fill="#1a1a1a" text-anchor="middle">Дріт (Ø 1 мм) блокується</text>
  <text x="800" y="390" font-size="13" fill="#1a1a1a" text-anchor="middle">додатковим бар'єром</text>
  <text x="800" y="415" font-size="13" fill="#27ae60" font-weight="bold" text-anchor="middle">Максимальна безпека</text>

  <line x1="895" y1="243" x2="810" y2="243" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="900" y="247" font-size="12" fill="#1a1a1a">Бар'єр</text>
</svg>
