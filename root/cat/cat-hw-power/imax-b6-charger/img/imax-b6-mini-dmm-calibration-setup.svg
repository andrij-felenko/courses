<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <!-- Arrow -->
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="white"/>

  <!-- Battery 6S -->
  <rect x="50" y="250" width="140" height="150" fill="#e0e0e0" stroke="#808080" stroke-width="2" rx="10"/>
  <text x="120" y="280" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Збірка 6S LiPo</text>
  <text x="120" y="300" font-family="sans-serif" font-size="12" text-anchor="middle">(25.2 В)</text>
  
  <!-- Main power cables -->
  <path d="M 120 250 L 120 150 L 250 150" fill="none" stroke="red" stroke-width="6"/>
  <path d="M 90 250 L 90 120 L 250 120" fill="none" stroke="black" stroke-width="6"/>
  <text x="170" y="110" font-family="sans-serif" font-size="12">Головний силовий кабель</text>

  <!-- Balancing connector on battery side -->
  <rect x="60" y="340" width="120" height="20" fill="white" stroke="black" rx="2"/>
  <circle cx="70" cy="350" r="3" fill="black"/>
  <circle cx="85" cy="350" r="3" fill="red"/>
  <circle cx="100" cy="350" r="3" fill="red"/>
  <circle cx="115" cy="350" r="3" fill="red"/>
  <circle cx="130" cy="350" r="3" fill="red"/>
  <circle cx="145" cy="350" r="3" fill="red"/>
  <circle cx="160" cy="350" r="3" fill="red"/>

  <text x="70" y="375" font-family="sans-serif" font-size="10" text-anchor="middle">B-</text>
  <text x="85" y="375" font-family="sans-serif" font-size="10" text-anchor="middle">1+</text>
  <text x="160" y="375" font-family="sans-serif" font-size="10" text-anchor="middle">6+</text>

  <!-- Balancing cables -->
  <path d="M 70 340 L 70 310 L 280 310 L 280 200" fill="none" stroke="black" stroke-width="2"/>
  <path d="M 85 340 L 85 315 L 290 315 L 290 200" fill="none" stroke="#aa0000" stroke-width="2"/>
  <path d="M 100 340 L 100 320 L 300 320 L 300 200" fill="none" stroke="#cc0000" stroke-width="2"/>
  <path d="M 160 340 L 160 335 L 340 335 L 340 200" fill="none" stroke="red" stroke-width="2"/>

  <!-- Charger iMAX B6 -->
  <rect x="250" y="50" width="250" height="150" fill="#2c3e50" stroke="#1a252f" stroke-width="3" rx="8"/>
  <text x="375" y="70" font-family="sans-serif" font-size="16" font-weight="bold" fill="white" text-anchor="middle">iMAX B6 Mini</text>

  <!-- Screen -->
  <rect x="270" y="80" width="130" height="50" fill="#a0d468" stroke="#8cc152" stroke-width="2"/>
  <text x="275" y="95" font-family="monospace" font-size="12" fill="black">1: 4.19  2: 4.20</text>
  <text x="275" y="110" font-family="monospace" font-size="12" fill="black">3: 4.21  V:12.60</text>
  <text x="335" y="145" font-family="sans-serif" font-size="12" fill="white" text-anchor="middle">Меню калібрування</text>

  <!-- Buttons -->
  <rect x="420" y="90" width="20" height="15" fill="#95a5a6" rx="2"/>
  <rect x="445" y="90" width="20" height="15" fill="#95a5a6" rx="2"/>
  <rect x="470" y="90" width="20" height="15" fill="#95a5a6" rx="2"/>
  <rect x="420" y="110" width="70" height="15" fill="#95a5a6" rx="2"/>
  <text x="455" y="121" font-family="sans-serif" font-size="8" fill="black" text-anchor="middle">Enter / Start</text>

  <!-- Ports -->
  <rect x="250" y="110" width="10" height="40" fill="black"/> <!-- Main port -->
  <rect x="280" y="195" width="60" height="10" fill="white"/> <!-- Balance port -->

  <!-- DMM -->
  <rect x="580" y="200" width="150" height="200" fill="#f1c40f" stroke="#d4ac0d" stroke-width="3" rx="5"/>
  <rect x="600" y="220" width="110" height="40" fill="#ecf0f1"/>
  <text x="655" y="250" font-family="monospace" font-size="24" font-weight="bold" fill="black" text-anchor="middle">4.195 V</text>
  <circle cx="655" cy="310" r="30" fill="#34495e"/>
  <line x1="655" y1="310" x2="635" y2="290" stroke="white" stroke-width="3"/>
  
  <!-- DMM Probes -->
  <circle cx="620" cy="370" r="8" fill="black"/>
  <circle cx="690" cy="370" r="8" fill="red"/>

  <text x="655" y="420" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Еталонний мультиметр</text>
  <text x="655" y="435" font-family="sans-serif" font-size="12" text-anchor="middle">(Клас 4.5+ цифр)</text>

  <!-- Probe wires -->
  <path d="M 620 370 Q 550 400 450 380 T 70 350" fill="none" stroke="black" stroke-width="3"/>
  <path d="M 690 370 Q 600 450 480 390 T 85 350" fill="none" stroke="red" stroke-width="3"/>

  <!-- Probe tips -->
  <polygon points="68,355 72,355 70,350" fill="black"/>
  <polygon points="83,355 87,355 85,350" fill="red"/>

  <!-- Labels -->
  <rect x="180" y="380" width="220" height="30" fill="#fff" stroke="black" rx="4"/>
  <text x="290" y="400" font-family="sans-serif" font-size="12" text-anchor="middle">Щупи на балансувальному роз'ємі</text>
  
  <line x1="230" y1="380" x2="100" y2="355" stroke="black" stroke-width="1" stroke-dasharray="2,2"/>
</svg>
