<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Маркери стрілок -->
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Профілі та криві заряду в пристрої SkyRC iMAX B6 Mini</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">LiPo заряджається за двостадійним алгоритмом CC/CV, а NiMH — за методами відсічки Peak (-ΔV) та ΔT/Δt</text>

  <!-- ================= ЛІВА ПАНЕЛЬ: LiPo CC/CV ================= -->
  <rect x="30" y="75" width="435" height="420" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Профіль LiPo / Li-ion (Алгоритм CC/CV)</text>

  <!-- Заголовки фаз -->
  <text x="165" y="123" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Фаза CC (Stg 1)</text>
  <text x="165" y="139" font-size="12" fill="#6b7280" text-anchor="middle">I = const, U зростає</text>
  <text x="310" y="123" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Фаза CV (Stg 2)</text>
  <text x="310" y="139" font-size="12" fill="#6b7280" text-anchor="middle">U = const, I спадає</text>

  <!-- Сітка графіку LiPo -->
  <line x1="95" y1="210" x2="385" y2="210" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <line x1="95" y1="290" x2="385" y2="290" stroke="#e5e7eb" stroke-dasharray="3,3"/>

  <!-- Лінії фазових переходів -->
  <line x1="240" y1="155" x2="240" y2="370" stroke="#2457d6" stroke-dasharray="4,4" stroke-width="1.2"/>
  <line x1="365" y1="155" x2="365" y2="370" stroke="#c0392b" stroke-dasharray="4,4" stroke-width="1.2"/>

  <!-- Осі координат LiPo -->
  <line x1="95" y1="155" x2="95" y2="370" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="385" y1="155" x2="385" y2="370" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="95" y1="370" x2="385" y2="370" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Позначки осей LiPo -->
  <text x="90" y="150" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">U (В)</text>
  <text x="90" y="214" font-size="12" fill="#2457d6" text-anchor="end">4.20V</text>
  <text x="90" y="324" font-size="12" fill="#2457d6" text-anchor="end">3.70V</text>

  <text x="385" y="150" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">I (А), T (°C)</text>
  <text x="390" y="214" font-size="12" fill="#27ae60" text-anchor="start">1.0C</text>
  <text x="390" y="344" font-size="12" fill="#c0392b" text-anchor="start">0.1C</text>

  <text x="240" y="388" font-size="12" fill="#1a1a1a" text-anchor="middle">Час заряду t (хв)</text>

  <!-- Написи пунктів переходу LiPo -->
  <text x="235" y="172" font-size="12" fill="#2457d6" text-anchor="end">U = 4.20V</text>
  <text x="360" y="172" font-size="12" fill="#c0392b" text-anchor="end">I_cut</text>

  <!-- Криві графиків LiPo -->
  <!-- U(t) - Напруга -->
  <path d="M 95,330 C 145,300 195,220 240,210 L 380,210" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <text x="260" y="195" font-size="12" font-weight="bold" fill="#2457d6">U (Напруга)</text>

  <!-- I(t) - Струм -->
  <path d="M 95,210 L 240,210 C 285,220 335,310 365,340 L 380,345" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <text x="130" y="195" font-size="12" font-weight="bold" fill="#27ae60">I (Струм CC)</text>

  <!-- T(t) - Температура -->
  <path d="M 95,355 L 240,340 L 380,345" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="270" y="328" font-size="12" fill="#d97706">T (Температура)</text>

  <!-- Легенда / підсумок LiPo -->
  <rect x="45" y="402" width="405" height="78" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="422" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#2457d6">Критерій відсічки LiPo:</tspan> спад струму до порогу I_cut (≤ 10% I_chg)</text>
  <text x="55" y="442" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#27ae60">Захист iMAX B6 Mini:</tspan> макс. напруга 4.20V ±0.01V, відсічка за часом</text>
  <text x="55" y="462" font-size="12" fill="#6b7280"><tspan font-weight="bold">Балансування:</tspan> вирівнювання комірок через порт JST-XH на фазі CV</text>


  <!-- ================= ПРАВА ПАНЕЛЬ: NiMH Delta-Peak ================= -->
  <rect x="495" y="75" width="435" height="420" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="712" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Профіль NiMH / NiCd (Метод Delta-Peak)</text>

  <!-- Заголовки фаз -->
  <text x="635" y="123" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Основний заряд (CC)</text>
  <text x="635" y="139" font-size="12" fill="#6b7280" text-anchor="middle">I = const, U та T зростають</text>
  <text x="790" y="123" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Зона Delta-Peak (-ΔV)</text>
  <text x="790" y="139" font-size="12" fill="#c0392b" text-anchor="middle">Відсічка -ΔV / ΔT/Δt</text>

  <!-- Сітка графіку NiMH -->
  <line x1="560" y1="210" x2="850" y2="210" stroke="#e5e7eb" stroke-dasharray="3,3"/>
  <line x1="560" y1="290" x2="850" y2="290" stroke="#e5e7eb" stroke-dasharray="3,3"/>

  <!-- Лінія відсічки Delta-Peak -->
  <line x1="790" y1="155" x2="790" y2="370" stroke="#c0392b" stroke-dasharray="4,4" stroke-width="1.2"/>

  <!-- Осі координат NiMH -->
  <line x1="560" y1="155" x2="560" y2="370" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="850" y1="155" x2="850" y2="370" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="560" y1="370" x2="850" y2="370" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Позначки осей NiMH -->
  <text x="555" y="150" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">U (В)</text>
  <text x="555" y="195" font-size="12" fill="#2457d6" text-anchor="end">U_max (~1.45V)</text>
  <text x="555" y="324" font-size="12" fill="#2457d6" text-anchor="end">1.20V</text>

  <text x="850" y="150" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">I (А), T (°C)</text>
  <text x="855" y="240" font-size="12" fill="#c0392b" text-anchor="start">T_max</text>
  <text x="855" y="354" font-size="12" fill="#27ae60" text-anchor="start">I_trickle</text>

  <text x="705" y="388" font-size="12" fill="#1a1a1a" text-anchor="middle">Час заряду t (хв)</text>

  <!-- Написи пунктів переходу NiMH -->
  <text x="785" y="172" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">Спад -ΔV</text>
  <text x="795" y="275" font-size="12" fill="#c0392b" text-anchor="start">Приріст ΔT/Δt</text>

  <!-- Криві графиків NiMH -->
  <!-- U(t) - Напруга -->
  <path d="M 560,320 C 620,295 690,210 760,190 C 775,195 785,200 790,202 L 840,260" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <text x="580" y="235" font-size="12" font-weight="bold" fill="#2457d6">U (Напруга)</text>

  <!-- I(t) - Струм -->
  <path d="M 560,210 L 790,210 L 795,350 L 840,350" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <text x="590" y="195" font-size="12" font-weight="bold" fill="#27ae60">I (Струм)</text>

  <!-- T(t) - Температура -->
  <path d="M 560,350 C 630,345 710,335 745,295 C 770,260 785,242 790,235 L 840,255" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="650" y="325" font-size="12" font-weight="bold" fill="#c0392b">T (Температура)</text>

  <!-- Легенда / підсумок NiMH -->
  <rect x="510" y="402" width="405" height="78" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="520" y="422" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#c0392b">Критерій відсічки NiMH:</tspan> детекція спаду напруги -ΔV або порогу ΔT/Δt</text>
  <text x="520" y="442" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#2457d6">Налаштування B6 Mini:</tspan> чутливість -ΔV = 1..20 мВ/комірку (Default: 7мВ)</text>
  <text x="520" y="462" font-size="12" fill="#6b7280"><tspan font-weight="bold">Підтримка заряду:</tspan> автоматичний перехід у Trickle Charge (50-200 мА)</text>
</svg>
