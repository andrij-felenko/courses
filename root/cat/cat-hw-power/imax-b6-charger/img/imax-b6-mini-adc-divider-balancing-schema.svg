<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <!-- Battery Cell -->
    <g id="cell">
      <line x1="0" y1="10" x2="30" y2="10" stroke="black" stroke-width="2"/>
      <line x1="10" y1="20" x2="20" y2="20" stroke="black" stroke-width="4"/>
    </g>
    <!-- Resistor -->
    <g id="resistor">
      <polyline points="0,0 5,0 10,-5 20,5 30,-5 40,5 45,0 50,0" fill="none" stroke="black" stroke-width="2"/>
    </g>
    <!-- Arrow -->
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="black"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="white"/>

  <!-- Background panels -->
  <rect x="50" y="50" width="100" height="360" fill="#f0f8ff" stroke="#a0c0e0" rx="5"/>
  <rect x="250" y="50" width="180" height="360" fill="#fff0f5" stroke="#e0a0c0" rx="5"/>
  <rect x="520" y="80" width="220" height="300" fill="#f0fff0" stroke="#a0e0c0" rx="5"/>

  <text x="100" y="40" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Збірка (1S-6S)</text>
  <text x="340" y="40" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Дільники напруги</text>
  <text x="630" y="70" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">MCU (iMAX B6 Mini)</text>

  <!-- Ground Line -->
  <line x1="100" y1="380" x2="250" y2="380" stroke="black" stroke-width="2"/>
  <text x="180" y="375" font-family="sans-serif" font-size="12">B- (GND)</text>
  <line x1="250" y1="380" x2="340" y2="380" stroke="black" stroke-width="2"/>
  <line x1="340" y1="380" x2="340" y2="400" stroke="black" stroke-width="2"/>
  <line x1="330" y1="400" x2="350" y2="400" stroke="black" stroke-width="2"/>
  <line x1="335" y1="405" x2="345" y2="405" stroke="black" stroke-width="2"/>
  <line x1="338" y1="410" x2="342" y2="410" stroke="black" stroke-width="2"/>

  <!-- Cells (bottom to top: Cell 1 to Cell 6) -->
  <use href="#cell" x="85" y="340"/>
  <use href="#cell" x="85" y="290"/>
  <use href="#cell" x="85" y="240"/>
  <!-- dots for cell 4,5 -->
  <circle cx="100" cy="200" r="2" fill="black"/>
  <circle cx="100" cy="180" r="2" fill="black"/>
  <circle cx="100" cy="160" r="2" fill="black"/>
  <use href="#cell" x="85" y="110"/>

  <line x1="100" y1="360" x2="100" y2="380" stroke="black" stroke-width="2"/>
  <line x1="100" y1="310" x2="100" y2="340" stroke="black" stroke-width="2"/>
  <line x1="100" y1="260" x2="100" y2="290" stroke="black" stroke-width="2"/>
  <line x1="100" y1="220" x2="100" y2="240" stroke="black" stroke-width="2"/>
  <line x1="100" y1="130" x2="100" y2="140" stroke="black" stroke-width="2"/>
  <line x1="100" y1="80" x2="100" y2="110" stroke="black" stroke-width="2"/>

  <!-- Cell Labels -->
  <text x="60" y="355" font-family="sans-serif" font-size="12">Комірка 1</text>
  <text x="60" y="305" font-family="sans-serif" font-size="12">Комірка 2</text>
  <text x="60" y="125" font-family="sans-serif" font-size="12">Комірка 6</text>

  <!-- Balance Lines and Dividers -->
  <!-- B1+ -->
  <circle cx="100" cy="325" r="3" fill="black"/>
  <line x1="100" y1="325" x2="250" y2="325" stroke="black" stroke-width="2"/>
  <text x="180" y="320" font-family="sans-serif" font-size="12">B1+ (4.2В)</text>
  <use href="#resistor" x="250" y="325" transform="rotate(0, 250, 325)"/> <!-- series R -->
  <line x1="300" y1="325" x2="340" y2="325" stroke="black" stroke-width="2"/>
  <use href="#resistor" x="340" y="325" transform="rotate(90, 340, 325)"/> <!-- parallel R -->
  <line x1="340" y1="375" x2="340" y2="380" stroke="black" stroke-width="2"/>
  <line x1="340" y1="325" x2="430" y2="325" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="275" y="315" font-family="sans-serif" font-size="10">10k</text>
  <text x="355" y="350" font-family="sans-serif" font-size="10">10k</text>

  <!-- B2+ -->
  <circle cx="100" cy="275" r="3" fill="black"/>
  <line x1="100" y1="275" x2="250" y2="275" stroke="black" stroke-width="2"/>
  <text x="180" y="270" font-family="sans-serif" font-size="12">B2+ (8.4В)</text>
  <use href="#resistor" x="250" y="275" transform="rotate(0, 250, 275)"/>
  <line x1="300" y1="275" x2="340" y2="275" stroke="black" stroke-width="2"/>
  <use href="#resistor" x="340" y="275" transform="rotate(90, 340, 275)"/>
  <line x1="340" y1="325" x2="340" y2="325" stroke="black" stroke-width="2"/>
  <circle cx="340" cy="325" r="3" fill="black"/>
  <line x1="340" y1="275" x2="430" y2="275" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- B6+ -->
  <circle cx="100" cy="95" r="3" fill="black"/>
  <line x1="100" y1="95" x2="250" y2="95" stroke="black" stroke-width="2"/>
  <text x="180" y="90" font-family="sans-serif" font-size="12">B6+ (25.2В)</text>
  <use href="#resistor" x="250" y="95" transform="rotate(0, 250, 95)"/>
  <line x1="300" y1="95" x2="340" y2="95" stroke="black" stroke-width="2"/>
  <use href="#resistor" x="340" y="95" transform="rotate(90, 340, 95)"/>
  <line x1="340" y1="145" x2="340" y2="275" stroke="black" stroke-width="2"/>
  <circle cx="340" cy="275" r="3" fill="black"/>
  <line x1="340" y1="95" x2="430" y2="95" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="270" y="85" font-family="sans-serif" font-size="10">200k (велика похибка)</text>
  <text x="355" y="120" font-family="sans-serif" font-size="10">10k</text>

  <!-- MUX & ADC -->
  <rect x="540" y="150" width="80" height="150" fill="#fff" stroke="black" stroke-width="2"/>
  <text x="580" y="225" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle" transform="rotate(-90, 580, 225)">Мультиплексор</text>
  
  <rect x="660" y="170" width="60" height="110" fill="#fff" stroke="black" stroke-width="2"/>
  <text x="690" y="225" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle" transform="rotate(-90, 690, 225)">ADC</text>

  <!-- MUX connections -->
  <line x1="430" y1="325" x2="540" y2="280" stroke="blue" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="430" y1="275" x2="540" y2="240" stroke="blue" stroke-width="1.5" stroke-dasharray="4,2"/>
  <line x1="430" y1="95" x2="540" y2="160" stroke="blue" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- MUX to ADC -->
  <line x1="620" y1="225" x2="660" y2="225" stroke="black" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="215" font-family="sans-serif" font-size="10" text-anchor="middle">CH_SEL</text>

  <text x="630" y="320" font-family="sans-serif" font-size="11" fill="red">Похибка обчислення:</text>
  <text x="630" y="335" font-family="sans-serif" font-size="11" fill="red">V_Cell6 = V_B6 - V_B5</text>
  <text x="630" y="350" font-family="sans-serif" font-size="11" fill="red">Накопичуються % від дільників</text>
</svg>
