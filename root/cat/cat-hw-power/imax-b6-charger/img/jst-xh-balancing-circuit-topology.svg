<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка полотна -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="33" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Топологія багатоканального балансира JST-XH у пристрої iMAX B6 Mini</text>
  <text x="480" y="53" font-size="13" fill="#6b7280" text-anchor="middle">Каскад дільників напруги й MUX вимірюють комірки, а FET-ключі з резисторами шунтують струм</text>

  <!-- БЛОК 1: Збірка 6S та порт JST-XH -->
  <rect x="25" y="68" width="205" height="297" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="35" y="78" width="185" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="127" y="95" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Збірка 6S та порт JST-XH</text>

  <!-- Комірки акумулятора 6S -->
  <rect x="42" y="115" width="62" height="22" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
  <text x="73" y="130" font-size="11" fill="#1a1a1a" text-anchor="middle">C6 (4.20 В)</text>

  <rect x="42" y="143" width="62" height="22" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
  <text x="73" y="158" font-size="11" fill="#1a1a1a" text-anchor="middle">C5 (4.20 В)</text>

  <rect x="42" y="171" width="62" height="22" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
  <text x="73" y="186" font-size="11" fill="#1a1a1a" text-anchor="middle">C4 (4.20 В)</text>

  <rect x="42" y="199" width="62" height="22" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
  <text x="73" y="214" font-size="11" fill="#1a1a1a" text-anchor="middle">C3 (4.20 В)</text>

  <rect x="42" y="227" width="62" height="22" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="73" y="242" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">C2 (4.25 В)</text>

  <rect x="42" y="255" width="62" height="22" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
  <text x="73" y="270" font-size="11" fill="#1a1a1a" text-anchor="middle">C1 (4.15 В)</text>

  <!-- Роз'єм JST-XH (7 пінів) -->
  <rect x="145" y="112" width="70" height="172" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="180" y="126" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="middle">JST-XH</text>

  <!-- Лінії відводів балансування до роз'єму JST-XH -->
  <line x1="104" y1="117" x2="145" y2="135" stroke="#1a1a1a" stroke-width="1"/>
  <text x="160" y="139" font-size="10" fill="#1a1a1a">B6</text>

  <line x1="104" y1="145" x2="145" y2="158" stroke="#1a1a1a" stroke-width="1"/>
  <text x="160" y="162" font-size="10" fill="#1a1a1a">B5</text>

  <line x1="104" y1="173" x2="145" y2="181" stroke="#1a1a1a" stroke-width="1"/>
  <text x="160" y="185" font-size="10" fill="#1a1a1a">B4</text>

  <line x1="104" y1="201" x2="145" y2="204" stroke="#1a1a1a" stroke-width="1"/>
  <text x="160" y="208" font-size="10" fill="#1a1a1a">B3</text>

  <line x1="104" y1="229" x2="145" y2="227" stroke="#27ae60" stroke-width="1.5"/>
  <text x="160" y="231" font-size="10" font-weight="bold" fill="#27ae60">B2</text>

  <line x1="104" y1="257" x2="145" y2="250" stroke="#27ae60" stroke-width="1.5"/>
  <text x="160" y="254" font-size="10" font-weight="bold" fill="#27ae60">B1</text>

  <line x1="104" y1="275" x2="145" y2="273" stroke="#1a1a1a" stroke-width="1"/>
  <text x="160" y="277" font-size="10" fill="#1a1a1a">B0</text>

  <!-- Підписи нижнього блоку 1 -->
  <rect x="35" y="295" width="185" height="58" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="127" y="313" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Загальний порт 6S:</text>
  <text x="127" y="330" font-size="11" fill="#6b7280" text-anchor="middle">7 виводів (B0...B6)</text>
  <text x="127" y="345" font-size="10" fill="#6b7280" text-anchor="middle">Напруга V_total = 25.2 В</text>

  <!-- БЛОК 2: Пасивне шунтування (FET + R_bal) -->
  <rect x="245" y="68" width="225" height="297" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="255" y="78" width="205" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="357" y="95" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Пасивне шунтування (FET + R_bal)</text>

  <!-- Канали шунтування C1...C6 -->
  <!-- Схема активного шунтування комірки C2 -->
  <rect x="260" y="215" width="195" height="52" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="357" y="230" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Шунт комірки C2 (АКТИВНИЙ)</text>

  <!-- Резистор шунтування R_bal2 -->
  <rect x="270" y="238" width="50" height="18" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="295" y="251" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">R_bal2 20Ω</text>

  <!-- MOSFET ключ Q_bal2 -->
  <rect x="335" y="238" width="45" height="18" rx="2" fill="#27ae60"/>
  <text x="357" y="251" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Q2 ON</text>

  <!-- Струм шунтування -->
  <text x="418" y="251" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">I = 200 мА</text>

  <!-- Неактивні канали C1, C3..C6 -->
  <rect x="260" y="115" width="195" height="22" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="357" y="130" font-size="10" fill="#6b7280" text-anchor="middle">Канали C3...C6: Q3...Q6 (OFF), I = 0 мА</text>

  <rect x="260" y="175" width="195" height="22" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="357" y="190" font-size="10" fill="#6b7280" text-anchor="middle">Канал C1: Q1 (OFF), I = 0 мА</text>

  <!-- Нижня картка блоку 2 -->
  <rect x="255" y="295" width="205" height="58" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="357" y="313" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Принцип розряду:</text>
  <text x="357" y="330" font-size="11" fill="#1a1a1a" text-anchor="middle">Скидання надлишку в тепло</text>
  <text x="357" y="345" font-size="10" fill="#6b7280" text-anchor="middle">Потужність P_dis ≈ 0.85 Вт</text>

  <!-- БЛОК 3: Дільники напруги та MUX -->
  <rect x="485" y="68" width="235" height="297" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="495" y="78" width="215" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="602" y="95" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Дільники напруги та MUX</text>

  <!-- Прецизійні дільники напруги -->
  <rect x="495" y="115" width="95" height="165" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="542" y="133" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Дільники 0.1%</text>
  <text x="542" y="152" font-size="10" fill="#6b7280" text-anchor="middle">R1 / R2 масив</text>
  <text x="542" y="172" font-size="10" fill="#1a1a1a" text-anchor="middle">B6: 25.2V → 3.15V</text>
  <text x="542" y="190" font-size="10" fill="#1a1a1a" text-anchor="middle">B5: 21.0V → 2.62V</text>
  <text x="542" y="208" font-size="10" fill="#27ae60" font-weight="bold" text-anchor="middle">B2: 8.4V → 1.05V</text>
  <text x="542" y="226" font-size="10" fill="#27ae60" font-weight="bold" text-anchor="middle">B1: 4.2V → 0.52V</text>
  <text x="542" y="244" font-size="10" fill="#1a1a1a" text-anchor="middle">B0: 0.0V → 0.00V</text>
  <text x="542" y="266" font-size="10" fill="#6b7280" text-anchor="middle">Узгодження АЦП</text>

  <!-- Аналоговий мультиплексор MUX -->
  <rect x="605" y="115" width="105" height="165" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="657" y="133" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">MUX CD4051</text>
  <text x="657" y="152" font-size="10" fill="#1a1a1a" text-anchor="middle">8 каналів вхід</text>
  <text x="657" y="175" font-size="10" fill="#6b7280" text-anchor="middle">Послідовний</text>
  <text x="657" y="190" font-size="10" fill="#6b7280" text-anchor="middle">вибір каналів</text>
  <text x="657" y="215" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="middle">V_out → АЦП</text>
  <text x="657" y="235" font-size="10" fill="#1a1a1a" text-anchor="middle">Такт: 100 мкс</text>
  <text x="657" y="266" font-size="10" fill="#6b7280" text-anchor="middle">Вибір B0...B6</text>

  <!-- Нижня картка блоку 3 -->
  <rect x="495" y="295" width="215" height="58" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="602" y="313" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Метод вимірювання:</text>
  <text x="602" y="330" font-size="11" fill="#1a1a1a" text-anchor="middle">Різниця V_C2 = V_B2 - V_B1</text>
  <text x="602" y="345" font-size="10" fill="#6b7280" text-anchor="middle">Точна диф. обробка</text>

  <!-- БЛОК 4: Мікроконтролер (MCU) -->
  <rect x="735" y="68" width="200" height="297" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="745" y="78" width="180" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="835" y="95" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Мікроконтролер (MCU)</text>

  <!-- Модуль АЦП та обчислень MCU -->
  <rect x="745" y="115" width="180" height="65" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="835" y="132" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">MCU (12-bit ADC)</text>
  <text x="835" y="150" font-size="10" fill="#1a1a1a" text-anchor="middle">V_C2 = 4.250 В (MAX)</text>
  <text x="835" y="167" font-size="10" fill="#27ae60" font-weight="bold" text-anchor="middle">Виявлено дисбаланс ΔV</text>

  <!-- Блок алгоритму балансування -->
  <rect x="745" y="190" width="180" height="90" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="835" y="207" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Алгоритм керування:</text>
  <text x="755" y="225" font-size="10" fill="#1a1a1a">1. Опитування V_C1...V_C6</text>
  <text x="755" y="242" font-size="10" fill="#27ae60" font-weight="bold">2. ΔV_C2 = +0.10 В &gt; 5 мВ</text>
  <text x="755" y="259" font-size="10" fill="#27ae60" font-weight="bold">3. Вмикання Q2 Gate = 1</text>
  <text x="755" y="274" font-size="10" fill="#6b7280">4. Пауза на вимірювання</text>

  <!-- Нижня картка блоку 4 -->
  <rect x="745" y="295" width="180" height="58" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="835" y="313" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Контроль процесів:</text>
  <text x="835" y="330" font-size="11" fill="#1a1a1a" text-anchor="middle">Циклічний моніторинг</text>
  <text x="835" y="345" font-size="10" fill="#6b7280" text-anchor="middle">Захист від перегріву PCB</text>

  <!-- Лінії зв'язку між блоками -->
  <!-- JST-XH -> Шунтування -->
  <line x1="215" y1="240" x2="258" y2="240" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- JST-XH -> Дільники -->
  <line x1="215" y1="140" x2="493" y2="140" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- MUX -> MCU АЦП -->
  <line x1="710" y1="148" x2="743" y2="148" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>

  <!-- MCU Gate -> MOSFET Q2 -->
  <line x1="745" y1="255" x2="382" y2="255" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>

  <!-- Нижній порівняльний блок (Проблема / Розв'язок) -->
  <!-- Ліворуч: Дисбаланс комірок -->
  <rect x="25" y="380" width="445" height="120" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="40" y="400" font-size="13" font-weight="bold" fill="#c0392b">⛔ Небезпека експлуатації без балансування комірок:</text>
  <text x="40" y="422" font-size="12" fill="#1a1a1a">• Перезаряд слабких комірок &gt; 4.25 В розриває хімію та гріє PCB</text>
  <text x="40" y="442" font-size="12" fill="#1a1a1a">• Передчасна зупинка заряду за загальною напругою (недозаряд)</text>
  <text x="40" y="462" font-size="12" fill="#1a1a1a">• Прогресуючий розбаланс глибоко розряджає окремі елементи</text>
  <text x="40" y="488" font-size="12" font-weight="bold" fill="#c0392b">Результат: Деградація 6S акумулятора та ризик займання</text>

  <!-- Праворуч: Балансування JST-XH -->
  <rect x="485" y="380" width="450" height="120" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="500" y="400" font-size="13" font-weight="bold" fill="#27ae60">✓ Ефективність топології балансувального кола iMAX B6 Mini:</text>
  <text x="500" y="422" font-size="12" fill="#1a1a1a">• Поодиноке вимірювання напруг комірок із точністю ±0.005 В</text>
  <text x="500" y="442" font-size="12" fill="#1a1a1a">• Автоматичне шунтування I_bal = 200 мА для елементів із V &gt; V_avg</text>
  <text x="500" y="462" font-size="12" fill="#1a1a1a">• Вирівнювання SOC усіх комірок до єдиного рівня у фазі CV</text>
  <text x="500" y="488" font-size="12" font-weight="bold" fill="#27ae60">Результат: 100% ємності, безпека та тривалий ресурс збірки</text>
</svg>
