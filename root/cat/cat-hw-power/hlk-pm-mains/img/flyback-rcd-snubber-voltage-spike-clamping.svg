<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Захисний RCD-снаббер: гасіння високовольтного викиду ключа</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Демпфер поглинає енергію індуктивності розсіювання, обмежуючи пік напруги нижче 600 В</text>

  <!-- Ліва панель: Схема RCD-снаббера -->
  <rect x="40" y="80" width="410" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="245" y="108" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема підключення RCD-ланцюга</text>

  <!-- Шина V_bus -->
  <line x1="100" y1="135" x2="390" y2="135" stroke="#c0392b" stroke-width="2.5"/>
  <text x="100" y="128" font-size="12" font-weight="bold" fill="#c0392b">+V_bus (310 В)</text>

  <!-- Первинна обмотка трансформатора -->
  <rect x="150" y="160" width="45" height="70" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="172" y="195" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">L_pri</text>
  <line x1="172" y1="135" x2="172" y2="160" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="172" y1="230" x2="172" y2="280" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Паралельний RCD снаббер -->
  <!-- Відгалуження від V_bus -->
  <line x1="310" y1="135" x2="310" y2="160" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Резистор R_snubber -->
  <rect x="270" y="160" width="30" height="50" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="255" y="190" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="end">R_sn</text>

  <!-- Конденсатор C_snubber -->
  <line x1="340" y1="160" x2="340" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="330" y1="180" x2="350" y2="180" stroke="#2457d6" stroke-width="2"/>
  <line x1="330" y1="186" x2="350" y2="186" stroke="#2457d6" stroke-width="2"/>
  <line x1="340" y1="186" x2="340" y2="210" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="355" y="190" font-size="11" font-weight="bold" fill="#2457d6">C_sn</text>

  <!-- З'єднання R та C внизу до діода -->
  <line x1="285" y1="210" x2="340" y2="210" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="310" y1="210" x2="310" y2="225" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Швидкий діод D_snubber (UF4007) -->
  <path d="M 300 240 L 320 240 L 310 225 Z" fill="#27ae60" stroke="#1e8449" stroke-width="1.5"/>
  <line x1="300" y1="225" x2="320" y2="225" stroke="#1e8449" stroke-width="2"/>
  <text x="330" y="238" font-size="11" font-weight="bold" fill="#27ae60">D_sn (Fast)</text>

  <line x1="310" y1="240" x2="310" y2="280" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Спільний вузол зі стоком MOSFET -->
  <line x1="172" y1="280" x2="310" y2="280" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="240" cy="280" r="4" fill="#c0392b"/>
  <text x="240" y="272" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Вузол Drain (Стік)</text>

  <!-- Силовий MOSFET-ключ -->
  <line x1="240" y1="280" x2="240" y2="305" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="220" y="305" width="40" height="35" rx="3" fill="#2c3e50" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="240" y="327" font-size="11" font-weight="bold" fill="white" text-anchor="middle">MOS</text>
  <line x1="240" y1="340" x2="240" y2="365" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="225" y1="365" x2="255" y2="365" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="232" y1="370" x2="248" y2="370" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="240" y="386" font-size="11" fill="#6b7280" text-anchor="middle">GND (Первинна)</text>

  <!-- Підсумок зліва -->
  <rect x="55" y="395" width="380" height="24" rx="4" fill="#eaf0fd"/>
  <text x="245" y="411" font-size="11" fill="#2457d6" text-anchor="middle">RCD розсіює енергію E_leak = (L_leak · I_pk²) / 2 у тепло на резисторі</text>

  <!-- Права панель: Порівняння епюр напруги V_DS -->
  <rect x="480" y="80" width="440" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="700" y="108" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Осцилограма напруги на стоку V_DS</text>

  <!-- Осі графіка -->
  <line x1="530" y1="380" x2="530" y2="125" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="495" y="135" font-size="11" font-weight="bold" fill="#1a1a1a">V_DS, В</text>

  <line x1="530" y1="380" x2="890" y2="380" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="860" y="405" font-size="11" font-weight="bold" fill="#1a1a1a">Час t</text>

  <!-- Рівні напруги -->
  <!-- 850 В (Пробій) y=150 -->
  <line x1="525" y1="150" x2="880" y2="150" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="520" y="154" font-size="11" fill="#c0392b" font-weight="bold" text-anchor="end">850 В</text>

  <!-- 600 В (Межа MOSFET) y=205 -->
  <line x1="525" y1="205" x2="880" y2="205" stroke="#b91c1c" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="520" y="209" font-size="11" fill="#b91c1c" font-weight="bold" text-anchor="end">600 В</text>
  <text x="815" y="200" font-size="10" font-weight="bold" fill="#b91c1c">Межа MOSFET (V_DS max)</text>

  <!-- 500 В (Рівень V_clamp снаббера) y=235 -->
  <line x1="525" y1="235" x2="880" y2="235" stroke="#27ae60" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="520" y="239" font-size="11" fill="#27ae60" font-weight="bold" text-anchor="end">500 В</text>

  <!-- 400 В (V_bus + V_ro) y=285 -->
  <line x1="525" y1="285" x2="880" y2="285" stroke="#6b7280" stroke-width="1"/>
  <text x="520" y="289" font-size="11" fill="#6b7280" text-anchor="end">400 В</text>
  <text x="825" y="280" font-size="10" fill="#6b7280">V_bus + V_ro (відбита)</text>

  <!-- 310 В (V_bus) y=325 -->
  <line x1="525" y1="325" x2="880" y2="325" stroke="#6b7280" stroke-width="1"/>
  <text x="520" y="329" font-size="11" fill="#6b7280" text-anchor="end">310 В</text>

  <!-- 0 В y=380 -->
  <text x="520" y="384" font-size="11" fill="#6b7280" text-anchor="end">0 В</text>

  <!-- Червона крива: БЕЗ снаббера (катастрофічний викид) -->
  <polyline points="540,380 580,380 580,150 595,200 610,165 625,300 650,285 700,285" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="600" y="140" font-size="11" font-weight="bold" fill="#c0392b">Без снаббера: викид &gt; 850 В (Пробій!)</text>

  <!-- Зелена крива: З RCD-снаббером (зрізаний пік) -->
  <polyline points="540,380 720,380 720,235 745,260 765,285 820,285 830,325 870,325" fill="none" stroke="#27ae60" stroke-width="3"/>
  <text x="735" y="225" font-size="11" font-weight="bold" fill="#27ae60">Зі снаббером: зрізано на 500 В (ОК)</text>

  <!-- Пояснення внизу правої панелі -->
  <rect x="500" y="340" width="200" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="600" y="359" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Запас міцності ключа &gt; 100 В</text>
</svg>
