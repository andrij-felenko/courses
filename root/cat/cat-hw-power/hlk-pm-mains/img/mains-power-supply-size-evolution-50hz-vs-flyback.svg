<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Еволюція AC-DC: 50 Гц трансформатор проти імпульсного модуля HLK-PM</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Підвищення частоти комутації до 65 кГц скоротило масу та габарити магнітного вузла у 10 разів</text>

  <!-- Ліва панель: Залізний трансформатор 50 Гц -->
  <rect x="30" y="80" width="435" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247" y="108" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Трансформатор 50 Гц на пластинчастому залізі</text>

  <!-- Малюнок трансформатора 50 Гц -->
  <rect x="135" y="130" width="225" height="150" rx="4" fill="#9ca3af" stroke="#4b5563" stroke-width="2"/>

  <!-- Листи заліза Ш-подібні (пластини) -->
  <line x1="145" y1="130" x2="145" y2="280" stroke="#4b5563" stroke-width="1"/>
  <line x1="160" y1="130" x2="160" y2="280" stroke="#4b5563" stroke-width="1"/>
  <line x1="175" y1="130" x2="175" y2="280" stroke="#4b5563" stroke-width="1"/>
  <line x1="320" y1="130" x2="320" y2="280" stroke="#4b5563" stroke-width="1"/>
  <line x1="335" y1="130" x2="335" y2="280" stroke="#4b5563" stroke-width="1"/>
  <line x1="350" y1="130" x2="350" y2="280" stroke="#4b5563" stroke-width="1"/>

  <!-- Мідна обмотка по центру -->
  <rect x="190" y="145" width="115" height="120" rx="3" fill="#b45309" stroke="#78350f" stroke-width="1.5"/>
  <text x="247" y="200" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Мідні обмотки</text>
  <text x="247" y="218" font-size="11" fill="#fef3c7" text-anchor="middle">тисячі витків</text>

  <!-- Параметри трансформатора 50 Гц -->
  <rect x="50" y="295" width="395" height="120" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="65" y="318" font-size="12" font-weight="bold" fill="#c0392b">Характеристики вузла 50 Гц (потужність 3 Вт):</text>
  <text x="65" y="338" font-size="11" fill="#1a1a1a">• Габарити: 45 × 40 × 35 мм (громіздкий для розетки)</text>
  <text x="65" y="358" font-size="11" fill="#1a1a1a">• Маса: 180–220 г (важкий блок живлення)</text>
  <text x="65" y="378" font-size="11" fill="#1a1a1a">• ККД: лише 50–60% (постійний нагрів заліза)</text>
  <text x="65" y="398" font-size="11" fill="#c0392b">• Потребує зовнішній діодний міст і фільтр</text>

  <!-- Права панель: Модуль HLK-PM01 -->
  <rect x="495" y="80" width="435" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="712" y="108" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Імпульсний модуль HLK-PM01 (Flyback 65 кГц)</text>

  <!-- Малюнок корпусу HLK-PM01 -->
  <rect x="615" y="145" width="195" height="120" rx="6" fill="#111827" stroke="#374151" stroke-width="2"/>
  <text x="712" y="180" font-size="13" font-weight="bold" fill="white" text-anchor="middle">HLK-PM01</text>
  <text x="712" y="200" font-size="11" fill="#9ca3af" text-anchor="middle">Вхід: AC 100-240V</text>
  <text x="712" y="218" font-size="11" fill="#34d399" text-anchor="middle">Вихід: DC 5V / 3W</text>

  <!-- Виводи модуля -->
  <line x1="595" y1="175" x2="615" y2="175" stroke="#9ca3af" stroke-width="3"/>
  <line x1="595" y1="235" x2="615" y2="235" stroke="#9ca3af" stroke-width="3"/>
  <line x1="810" y1="175" x2="830" y2="175" stroke="#9ca3af" stroke-width="3"/>
  <line x1="810" y1="235" x2="830" y2="235" stroke="#9ca3af" stroke-width="3"/>

  <!-- Параметри HLK-PM -->
  <rect x="515" y="295" width="395" height="120" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="530" y="318" font-size="12" font-weight="bold" fill="#27ae60">Характеристики HLK-PM01 (потужність 3 Вт):</text>
  <text x="530" y="338" font-size="11" fill="#1a1a1a">• Габарити: 34 × 20 × 15 мм (поміщається у підрозетник)</text>
  <text x="530" y="358" font-size="11" fill="#1a1a1a">• Маса: всього 20 г (у 10 разів легший!)</text>
  <text x="530" y="378" font-size="11" fill="#1a1a1a">• ККД: понад 70%, мале власне споживання &lt; 0.1 Вт</text>
  <text x="530" y="398" font-size="11" fill="#27ae60">• Всередині: ШІМ, ключ, ферит, випрямляч і фільтр</text>
</svg>
