<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Апаратний та програмний інтерфейс мережевого вузла HLK-PM</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Оптопара фіксує обрив фази за 10 мс, дозволяючи скинути стан у NVS за 25 мс часу утримання конденсаторів</text>

  <!-- ЛІВА ПАНЕЛЬ: Мережа 220 В та блок HLK-PM -->
  <rect x="30" y="70" width="280" height="360" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="42" y="82" width="256" height="32" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="170" y="103" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Мережевий вхід 220 В та захист</text>

  <rect x="45" y="125" width="250" height="65" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="55" y="145" font-size="12" font-weight="bold" fill="#1a1a1a">Обов'язковий вхідний захист:</text>
  <text x="55" y="165" font-size="12" fill="#1a1a1a">Запобіжник 1 А (повільний T1A)</text>
  <text x="55" y="181" font-size="12" fill="#6b7280">Варистор 07D471K (захист від імпульсів)</text>

  <rect x="45" y="200" width="250" height="95" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="55" y="220" font-size="12" font-weight="bold" fill="#1a1a1a">Модуль HLK-PM01 (3 Вт):</text>
  <text x="55" y="240" font-size="12" fill="#2457d6">Ізольований Flyback (ізоляція 3 кВ)</text>
  <text x="55" y="260" font-size="12" fill="#1a1a1a">Вихід: +5 В (струм до 600 мА)</text>
  <text x="55" y="278" font-size="12" fill="#27ae60">Час утримання (Holdup): 20–30 мс</text>

  <rect x="45" y="305" width="250" height="110" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="55" y="325" font-size="12" font-weight="bold" fill="#1a1a1a">Детектор мережі (Zero-Cross):</text>
  <text x="55" y="345" font-size="12" fill="#1a1a1a">Оптопара PC814 (дводіодна)</text>
  <text x="55" y="365" font-size="12" fill="#1a1a1a">Імпульси 100 Гц у переходах нуля</text>
  <text x="55" y="385" font-size="12" fill="#2457d6">Детектує зникнення 220 В за 10 мс</text>
  <text x="55" y="403" font-size="12" fill="#6b7280">Повна ізоляція від логіки MCU</text>

  <!-- ЦЕНТРАЛЬНА ПАНЕЛЬ: Мікроконтролер та алгоритм -->
  <rect x="340" y="70" width="280" height="360" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="352" y="82" width="256" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="103" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Мікроконтролер (Вузол керування)</text>

  <rect x="355" y="125" width="250" height="60" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="365" y="145" font-size="12" font-weight="bold" fill="#1a1a1a">Вхід EXTI (Zero-Cross Pulse):</text>
  <text x="365" y="165" font-size="12" fill="#2457d6">Апаратне переривання кожні 10 мс</text>

  <rect x="355" y="195" width="250" height="135" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="365" y="215" font-size="12" font-weight="bold" fill="#27ae60">Протокол AC Power-Fail:</text>
  <text x="365" y="235" font-size="12" fill="#c0392b">Таймаут &gt; 12 мс: Мережу знеструмлено!</text>
  <text x="365" y="255" font-size="12" fill="#1a1a1a">1. Миттєве скидання реле (0 мс)</text>
  <text x="365" y="275" font-size="12" fill="#1a1a1a">2. Запис лічильників у NVS/EEPROM (8 мс)</text>
  <text x="365" y="295" font-size="12" fill="#1a1a1a">3. Зупинка радіо та сон ядра (12 мс)</text>
  <text x="365" y="315" font-size="12" fill="#27ae60">Запас енергії конденсатора: ще 10 мс!</text>

  <rect x="355" y="340" width="250" height="75" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="365" y="360" font-size="12" font-weight="bold" fill="#1a1a1a">Виходи GPIO реле / навантаження:</text>
  <text x="365" y="380" font-size="12" fill="#1a1a1a">Комутація суворо в мить переходу нуля</text>
  <text x="365" y="398" font-size="12" fill="#6b7280">Усуває іскріння та зварювання контактів</text>

  <!-- ПРАВА ПАНЕЛЬ: Часова діаграма аварійного завершення -->
  <rect x="650" y="70" width="280" height="360" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="662" y="82" width="256" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="790" y="103" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Часова шкала знеструмлення</text>

  <rect x="665" y="125" width="250" height="290" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="675" y="145" font-size="12" font-weight="bold" fill="#c0392b">Вікно збереження (25 мс):</text>

  <!-- Лінія мережі 220 В -->
  <text x="675" y="170" font-size="12" fill="#1a1a1a">Мережа 220 В:</text>
  <line x1="675" y1="185" x2="770" y2="185" stroke="#27ae60" stroke-width="2"/>
  <line x1="770" y1="185" x2="895" y2="185" stroke="#c0392b" stroke-width="2" stroke-dasharray="3,2"/>
  <text x="775" y="180" font-size="12" fill="#c0392b">Аварія (0 мс)</text>

  <!-- Лінія детектора нуля -->
  <text x="675" y="215" font-size="12" fill="#1a1a1a">Імпульси оптопари:</text>
  <line x1="675" y1="230" x2="780" y2="230" stroke="#2457d6" stroke-width="2"/>
  <line x1="780" y1="230" x2="895" y2="230" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="785" y="225" font-size="12" fill="#c0392b">+10 мс: таймаут</text>

  <!-- Лінія живлення 5 В -->
  <text x="675" y="260" font-size="12" fill="#1a1a1a">Шина 5 В HLK-PM:</text>
  <line x1="675" y1="275" x2="840" y2="275" stroke="#27ae60" stroke-width="2"/>
  <line x1="840" y1="275" x2="895" y2="300" stroke="#c0392b" stroke-width="2"/>
  <text x="675" y="295" font-size="12" fill="#27ae60">5.0 В стабільні до +25 мс</text>

  <!-- Секція дій МК -->
  <rect x="675" y="315" width="230" height="85" rx="4" fill="white" stroke="#27ae60"/>
  <text x="685" y="335" font-size="12" font-weight="bold" fill="#27ae60">Успішне збереження NVS:</text>
  <text x="685" y="355" font-size="12" fill="#1a1a1a">Скинуто реле: на 11-й мс</text>
  <text x="685" y="375" font-size="12" fill="#1a1a1a">Записано NVS: на 18-й мс</text>
  <text x="685" y="392" font-size="12" fill="#27ae60">Збережено до падіння живлення!</text>

  <!-- Стрілки зв'язку -->
  <line x1="295" y1="250" x2="355" y2="250" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="295" y1="360" x2="355" y2="155" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
</svg>
