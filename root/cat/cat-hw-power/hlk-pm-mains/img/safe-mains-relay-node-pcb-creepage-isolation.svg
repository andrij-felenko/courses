<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Топологія плати релейного вузла: бар'єри та захисні пропили</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Фрезеровані пази (пропили) у FR-4 усувають поверхневий витік між високою (220 В) та низькою (5 В) сторонами</text>

  <!-- Друкована плата FR-4 -->
  <rect x="50" y="80" width="860" height="350" rx="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>

  <!-- Лівий полігон: Високовольтна зона 220 В -->
  <rect x="70" y="100" width="370" height="310" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="255" y="128" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Високовольтна зона (AC 220 В)</text>
  <text x="255" y="148" font-size="12" fill="#6b7280" text-anchor="middle">Вхідні клеми L/N, Fuse, MOV, контакти реле</text>

  <!-- Правий полігон: Низьковольтна зона 5 В / 3.3 В -->
  <rect x="520" y="100" width="370" height="310" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="705" y="128" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Низьковольтна зона (DC 5 В SELV)</text>
  <text x="705" y="148" font-size="12" fill="#6b7280" text-anchor="middle">Мікроконтролер, сенсори, вихід живлення</text>

  <!-- Фрезеровані сегменти пропилу (Creepage Slot) -->
  <!-- Сегмент 1 (угорі) -->
  <rect x="465" y="100" width="30" height="60" rx="3" fill="white" stroke="#c0392b" stroke-width="2"/>
  <line x1="472" y1="110" x2="488" y2="126" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="472" y1="135" x2="488" y2="151" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Пунктир під оптопарою -->
  <line x1="480" y1="160" x2="480" y2="175" stroke="#c0392b" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- Оптопара PC817 -->
  <rect x="445" y="175" width="70" height="50" rx="4" fill="#2c3e50" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="480" y="205" font-size="11" font-weight="bold" fill="white" text-anchor="middle">PC817</text>

  <!-- Пунктир між оптопарою і HLK-PM01 -->
  <line x1="480" y1="225" x2="480" y2="245" stroke="#c0392b" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- Сегмент 2 (посередині) -->
  <rect x="465" y="245" width="30" height="45" rx="3" fill="white" stroke="#c0392b" stroke-width="2"/>
  <line x1="472" y1="255" x2="488" y2="271" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Пунктир під HLK-PM01 -->
  <line x1="480" y1="290" x2="480" y2="305" stroke="#c0392b" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- HLK-PM01 корпус верхи над бар'єром -->
  <rect x="430" y="305" width="100" height="65" rx="4" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  <text x="480" y="333" font-size="11" font-weight="bold" fill="white" text-anchor="middle">HLK-PM01</text>
  <text x="480" y="350" font-size="10" fill="#9ca3af" text-anchor="middle">Бар'єр 3 кВ</text>

  <!-- Пунктир до нижнього сегмента -->
  <line x1="480" y1="370" x2="480" y2="380" stroke="#c0392b" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- Сегмент 3 (внизу) -->
  <rect x="465" y="380" width="30" height="30" rx="3" fill="white" stroke="#c0392b" stroke-width="2"/>
  <line x1="472" y1="387" x2="488" y2="403" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Ліва картка: Правила для 220 В -->
  <rect x="85" y="170" width="340" height="225" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="100" y="195" font-size="12" font-weight="bold" fill="#c0392b">Вимоги електробезпеки (IEC 60950 / 62368):</text>
  <text x="100" y="220" font-size="11" fill="#1a1a1a">• Повітряний зазор (Clearance): не менше 3.0 мм</text>
  <text x="100" y="242" font-size="11" fill="#1a1a1a">• Шлях струму витоку (Creepage): не менше 6.3 мм</text>
  <text x="100" y="264" font-size="11" fill="#1a1a1a">• Без пропилу пил і волога спричиняють трекінг</text>
  <text x="100" y="286" font-size="11" fill="#1a1a1a">• Пропил 2.0 мм розриває поверхню плати FR-4</text>
  <text x="100" y="308" font-size="11" fill="#1a1a1a">• Відступ міді від краю прорізу: ≥ 1.0 мм</text>
  <text x="100" y="335" font-size="11" font-weight="bold" fill="#27ae60">• Результат: шлях витоку збільшується до 18 мм!</text>
  <text x="100" y="360" font-size="11" fill="#6b7280">• Силові доріжки 10 А ширші за 2.5 мм + лудіння</text>
  <text x="100" y="380" font-size="11" fill="#6b7280">• Навколо отворів кріплення — вільні зони 4 мм</text>

  <!-- Права картка: Безпека низьковольтної зони -->
  <rect x="535" y="170" width="340" height="225" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="550" y="195" font-size="12" font-weight="bold" fill="#2457d6">Правила трасування низьковольтного боку:</text>
  <text x="550" y="220" font-size="11" fill="#1a1a1a">• Суцільний захисний полігон GND для тепловідводу</text>
  <text x="550" y="242" font-size="11" fill="#1a1a1a">• Жодна низьковольтна доріжка не заходить під HLK</text>
  <text x="550" y="264" font-size="11" fill="#1a1a1a">• Розв'язка контактів реле від котушки пропилом</text>
  <text x="550" y="286" font-size="11" fill="#1a1a1a">• Блокувальні конденсатори 100 нФ біля ніжок МК</text>
  <text x="550" y="308" font-size="11" fill="#1a1a1a">• Фільтр LC на виході HLK-PM01 для гасіння пульсацій</text>
  <text x="550" y="335" font-size="11" font-weight="bold" fill="#27ae60">• Повна безпека користувача при торканні сенсорів</text>
  <text x="550" y="360" font-size="11" fill="#6b7280">• Гальванічна міцність ізоляційного шва: 3000 В AC</text>
  <text x="550" y="380" font-size="11" fill="#6b7280">• Надійне розміщення у стандартному підрозетнику</text>
</svg>
