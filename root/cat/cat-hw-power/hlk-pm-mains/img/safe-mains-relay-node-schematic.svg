<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Безпечний мережевий релейний вузол на базі модуля HLK-PM01</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Вхідний каскад захисту Fuse + MOV + NTC та повна оптична і гальванічна розв'язка 220 В</text>

  <!-- Блок 1: Мережевий вхід 220 В та захист -->
  <rect x="30" y="80" width="220" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="140" y="108" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Мережа AC 220 В та захист</text>

  <!-- Клеми AC -->
  <text x="50" y="145" font-size="12" font-weight="bold" fill="#c0392b">Фаза L</text>
  <text x="50" y="245" font-size="12" font-weight="bold" fill="#1e40af">Нуль N</text>

  <!-- Запобіжник Fuse -->
  <line x1="100" y1="140" x2="120" y2="140" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="120" y="128" width="45" height="24" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="120" y1="140" x2="165" y2="140" stroke="#c0392b" stroke-width="1.5"/>
  <text x="142" y="122" font-size="11" fill="#1a1a1a" text-anchor="middle">Fuse 1A</text>

  <!-- Термістор NTC -->
  <line x1="165" y1="140" x2="180" y2="140" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="180" y="128" width="45" height="24" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="202" y="122" font-size="11" fill="#b45309" text-anchor="middle">NTC 5D-9</text>

  <!-- Варистор MOV між L та N -->
  <line x1="150" y1="140" x2="150" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="135" y="175" width="30" height="40" rx="3" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="150" y="200" font-size="11" font-weight="bold" fill="#dc2626" text-anchor="middle">MOV</text>
  <line x1="150" y1="215" x2="150" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="185" y="200" font-size="10" fill="#dc2626">10D471K</text>

  <!-- Лінія N -->
  <line x1="100" y1="240" x2="235" y2="240" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Опис захисту -->
  <rect x="45" y="275" width="190" height="140" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="295" font-size="11" font-weight="bold" fill="#c0392b">Функції захисту:</text>
  <text x="55" y="315" font-size="11" fill="#1a1a1a">• Запобіжник: від КЗ</text>
  <text x="55" y="335" font-size="11" fill="#1a1a1a">• Варистор: зрізає</text>
  <text x="55" y="353" font-size="11" fill="#1a1a1a">  імпульси &gt; 470 В</text>
  <text x="55" y="375" font-size="11" fill="#1a1a1a">• NTC: обмежує струм</text>
  <text x="55" y="393" font-size="11" fill="#1a1a1a">  заряду конденсатора</text>

  <!-- Блок 2: Джерело HLK-PM01 -->
  <rect x="270" y="80" width="170" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="355" y="108" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Модуль HLK-PM01</text>

  <!-- Корпус HLK-PM01 -->
  <rect x="285" y="130" width="140" height="130" rx="6" fill="#111827" stroke="#374151" stroke-width="1.5"/>
  <text x="355" y="160" font-size="12" font-weight="bold" fill="white" text-anchor="middle">HLK-PM01</text>
  <text x="355" y="180" font-size="11" fill="#9ca3af" text-anchor="middle">AC-DC 3 Вт</text>
  <text x="355" y="200" font-size="11" fill="#34d399" text-anchor="middle">Вихід: +5 В DC</text>
  <text x="355" y="218" font-size="11" fill="#60a5fa" text-anchor="middle">Ізоляція 3000 В</text>

  <!-- З'єднання з захистом -->
  <line x1="225" y1="140" x2="285" y2="140" stroke="#c0392b" stroke-width="2"/>
  <line x1="235" y1="240" x2="285" y2="240" stroke="#1a1a1a" stroke-width="2"/>

  <rect x="285" y="275" width="140" height="140" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="295" y="295" font-size="11" font-weight="bold" fill="#2457d6">Параметри живлення:</text>
  <text x="295" y="318" font-size="11" fill="#1a1a1a">• Вхід: 100–240 В AC</text>
  <text x="295" y="340" font-size="11" fill="#1a1a1a">• Вихід: 5 В / 600 мА</text>
  <text x="295" y="362" font-size="11" fill="#1a1a1a">• Залитий компаундом</text>
  <text x="295" y="388" font-size="11" fill="#27ae60">• Сертифікат CE/UL</text>

  <!-- Блок 3: Керування (MCU + Оптрон) -->
  <rect x="460" y="80" width="220" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="570" y="108" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Логіка керування (5 В)</text>

  <!-- MCU -->
  <rect x="480" y="130" width="180" height="75" rx="5" fill="#1e293b" stroke="#0f172a" stroke-width="1.5"/>
  <text x="570" y="155" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Мікроконтролер (ESP / AVR)</text>
  <text x="570" y="173" font-size="11" fill="#38bdf8" text-anchor="middle">Керування реле: GPIO</text>
  <text x="570" y="190" font-size="11" fill="#94a3b8" text-anchor="middle">Вхід: Кнопка вимикача</text>

  <!-- Оптопара PC817 + Ключ -->
  <rect x="480" y="220" width="180" height="85" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="570" y="242" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Опторозв'язка PC817</text>
  <text x="570" y="262" font-size="11" fill="#1a1a1a" text-anchor="middle">+ NPN ключ 2N2222</text>
  <text x="570" y="280" font-size="11" fill="#1a1a1a" text-anchor="middle">+ Діод 1N4148 (захист котушки)</text>

  <!-- Опис логіки -->
  <rect x="480" y="320" width="180" height="95" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="490" y="340" font-size="11" font-weight="bold" fill="#2457d6">Безпека мікроконтролера:</text>
  <text x="490" y="360" font-size="11" fill="#1a1a1a">• Повна оптична ізоляція</text>
  <text x="490" y="378" font-size="11" fill="#1a1a1a">• Захист від імпульсів реле</text>
  <text x="490" y="398" font-size="11" fill="#27ae60">• Спільна земля тільки з HLK</text>

  <!-- Блок 4: Силове реле та навантаження -->
  <rect x="700" y="80" width="230" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="815" y="108" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Силове реле 220 В 10 А</text>

  <!-- Реле -->
  <rect x="720" y="130" width="190" height="120" rx="6" fill="#1e3a8a" stroke="#172554" stroke-width="1.5"/>
  <text x="815" y="155" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Електромагнітне реле</text>
  <text x="815" y="173" font-size="11" fill="#93c5fd" text-anchor="middle">Котушка: 5 В DC</text>
  <text x="815" y="193" font-size="11" font-weight="bold" fill="#fbbf24" text-anchor="middle">Контакти: 250 В AC / 10 А</text>
  <text x="815" y="213" font-size="11" fill="#e2e8f0" text-anchor="middle">COM (Фаза L) → NO (Лампа)</text>
  <text x="815" y="233" font-size="11" fill="#93c5fd" text-anchor="middle">Ізоляція котушка-контакт 4 кВ</text>

  <!-- Навантаження 220 В -->
  <rect x="720" y="265" width="190" height="150" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="730" y="285" font-size="11" font-weight="bold" fill="#c0392b">Мережеве навантаження:</text>
  <text x="730" y="307" font-size="11" fill="#1a1a1a">• Освітлення, розетка, бойлер</text>
  <text x="730" y="327" font-size="11" fill="#1a1a1a">• RC-демпфер (снаббер) 100 Ом</text>
  <text x="730" y="345" font-size="11" fill="#1a1a1a">  + 0.1 мкФ паралельно контактам</text>
  <text x="730" y="367" font-size="11" fill="#1a1a1a">• Проріз у платі під реле ≥ 5 мм</text>
  <text x="730" y="392" font-size="11" font-weight="bold" fill="#27ae60">• Безпечний монтаж у коробку</text>
</svg>
