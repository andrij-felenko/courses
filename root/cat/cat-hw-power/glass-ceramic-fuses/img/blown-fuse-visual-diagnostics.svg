<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" width="720" height="360" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <linearGradient id="capGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b7280"/>
      <stop offset="15%" stop-color="#ffffff"/>
      <stop offset="45%" stop-color="#d0d7de"/>
      <stop offset="85%" stop-color="#f4f6f8"/>
      <stop offset="100%" stop-color="#6b7280"/>
    </linearGradient>
    <radialGradient id="sputter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a1a" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#1a1a1a" stop-opacity="0.8"/>
      <stop offset="80%" stop-color="#1a1a1a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1a1a1a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="720" height="360" fill="white"/>

  <text x="360" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Візуальна діагностика згорілих запобіжників</text>
  <text x="360" y="60" font-size="13" fill="#6b7280" text-anchor="middle">При помірному перевантаженні нитка рветься акуратно, при КЗ — випаровується з темним нальотом</text>

  <!-- Fuse 1: Overload -->
  <g id="fuse1">
    <rect x="150" y="160" width="120" height="40" fill="#eaf0fd" fill-opacity="0.3" stroke="#d0d7de" stroke-width="2"/>
    <path d="M 150 180 L 205 180" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="205" cy="180" r="2.5" fill="#1a1a1a"/>
    <path d="M 215 180 L 270 180" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="215" cy="180" r="2.5" fill="#1a1a1a"/>
    <rect x="150" y="163" width="120" height="6" fill="#ffffff" fill-opacity="0.8"/>
    <rect x="150" y="195" width="120" height="3" fill="#ffffff" fill-opacity="0.5"/>
    <rect x="120" y="155" width="30" height="50" rx="4" fill="url(#capGrad)" stroke="#6b7280" stroke-width="1"/>
    <rect x="270" y="155" width="30" height="50" rx="4" fill="url(#capGrad)" stroke="#6b7280" stroke-width="1"/>
  </g>

  <!-- Fuse 2: Short Circuit -->
  <g id="fuse2">
    <rect x="450" y="160" width="120" height="40" fill="#eaf0fd" fill-opacity="0.3" stroke="#d0d7de" stroke-width="2"/>
    <path d="M 450 180 L 460 178 L 470 183 L 475 180" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <path d="M 570 180 L 560 182 L 550 177 L 545 180" fill="none" stroke="#1a1a1a" stroke-width="2"/>
    <rect x="450" y="161" width="120" height="38" fill="url(#sputter)"/>
    <rect x="450" y="163" width="120" height="6" fill="#ffffff" fill-opacity="0.8"/>
    <rect x="450" y="195" width="120" height="3" fill="#ffffff" fill-opacity="0.5"/>
    <rect x="420" y="155" width="30" height="50" rx="4" fill="url(#capGrad)" stroke="#6b7280" stroke-width="1"/>
    <rect x="570" y="155" width="30" height="50" rx="4" fill="url(#capGrad)" stroke="#6b7280" stroke-width="1"/>
  </g>

  <!-- Labels -->
  <text x="210" y="260" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Помірне перевантаження</text>
  <text x="210" y="280" font-size="12" fill="#6b7280" text-anchor="middle">Акуратний розрив нитки</text>
  <path d="M 210 245 L 210 195" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <text x="510" y="260" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Коротке замикання</text>
  <text x="510" y="280" font-size="12" fill="#c0392b" text-anchor="middle">Металеве напилення на склі</text>
  <path d="M 510 245 L 510 205" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

</svg>
