<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Стрілки-маркери в defs -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часо-струмові характеристики запобіжників 5×20 мм: типи F та T</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">Повільний тип T витримує пускові перевантаження, тоді як швидкий тип F миттєво розмикає коло</text>

  <!-- Зони над графіком -->
  <text x="172" y="82" font-size="12" fill="#6b7280" text-anchor="middle">Перевантаження (1.5×..2×)</text>
  <text x="345" y="82" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Пусковий струм (3×..5×)</text>
  <text x="540" y="82" font-size="12" fill="#c0392b" text-anchor="middle">Коротке замикання (&gt;10×)</text>

  <!-- Горизонтальні лінії сітки (логарифмічний час t) -->
  <line x1="100" y1="155" x2="630" y2="155" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="100" y1="215" x2="630" y2="215" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="100" y1="275" x2="630" y2="275" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="100" y1="335" x2="630" y2="335" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="100" y1="395" x2="630" y2="395" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Вертикальні лінії сітки (кратність номінального струму I / In) -->
  <line x1="172" y1="95" x2="172" y2="455" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="223" y1="95" x2="223" y2="455" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="345" y1="95" x2="345" y2="455" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="507" y1="95" x2="507" y2="455" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Рамка графіка координат -->
  <rect x="100" y="95" width="530" height="360" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Засічки та підписи осі Y (Час спрацьовування t) -->
  <line x1="95" y1="95" x2="100" y2="95" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="88" y="99" font-size="12" fill="#6b7280" text-anchor="end">1000 с</text>

  <line x1="95" y1="155" x2="100" y2="155" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="88" y="159" font-size="12" fill="#6b7280" text-anchor="end">100 с</text>

  <line x1="95" y1="215" x2="100" y2="215" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="88" y="219" font-size="12" fill="#6b7280" text-anchor="end">10 с</text>

  <line x1="95" y1="275" x2="100" y2="275" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="88" y="279" font-size="12" fill="#6b7280" text-anchor="end">1 с</text>

  <line x1="95" y1="335" x2="100" y2="335" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="88" y="339" font-size="12" fill="#6b7280" text-anchor="end">0.1 с</text>

  <line x1="95" y1="395" x2="100" y2="395" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="88" y="399" font-size="12" fill="#6b7280" text-anchor="end">0.01 с</text>

  <line x1="95" y1="455" x2="100" y2="455" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="88" y="459" font-size="12" fill="#6b7280" text-anchor="end">0.001 с</text>

  <text x="88" y="78" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">Час t, с</text>

  <!-- Засічки та підписи осі X (Кратність струму I / In) -->
  <line x1="100" y1="455" x2="100" y2="459" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="100" y="475" font-size="12" fill="#6b7280" text-anchor="middle">1</text>

  <line x1="172" y1="455" x2="172" y2="459" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="172" y="475" font-size="12" fill="#6b7280" text-anchor="middle">1.5</text>

  <line x1="223" y1="455" x2="223" y2="459" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="223" y="475" font-size="12" fill="#6b7280" text-anchor="middle">2</text>

  <line x1="345" y1="455" x2="345" y2="459" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="345" y="475" font-size="12" fill="#6b7280" text-anchor="middle">4</text>

  <line x1="507" y1="455" x2="507" y2="459" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="507" y="475" font-size="12" fill="#6b7280" text-anchor="middle">10</text>

  <line x1="630" y1="455" x2="630" y2="459" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="630" y="475" font-size="12" fill="#6b7280" text-anchor="middle">20</text>

  <text x="365" y="503" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кратність струму I / In (струм перевантаження)</text>

  <!-- Крива типу T (Time-lag, повільний з затримкою, зелений #27ae60) -->
  <path d="M 172 95 C 185 135 205 180 233 200 C 260 220 300 260 345 281 C 400 307 460 340 507 359 C 550 376 590 398 630 413" stroke="#27ae60" stroke-width="3" fill="none"/>

  <!-- Крива типу F (Fast-acting, швидкодіючий, синій #2457d6) -->
  <path d="M 153 95 C 163 130 180 180 204 215 C 220 240 250 290 278 317 C 310 347 330 363 345 371 C 390 393 450 417 507 431 C 540 440 570 450 591 455" stroke="#2457d6" stroke-width="3" fill="none"/>

  <!-- Маркер порівняння при пусковому струмі 4x In -->
  <circle cx="345" cy="281" r="4" fill="#27ae60"/>
  <circle cx="345" cy="371" r="4" fill="#2457d6"/>
  <line x1="345" y1="289" x2="345" y2="363" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Права інформаційна панель -->
  <rect x="660" y="95" width="276" height="435" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Картка 1: Тип T -->
  <rect x="674" y="107" width="248" height="115" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="688" y1="126" x2="712" y2="126" stroke="#27ae60" stroke-width="3.5" stroke-linecap="round"/>
  <text x="722" y="130" font-size="14" font-weight="bold" fill="#1a1a1a">Тип T (Time-lag)</text>
  <text x="688" y="152" font-size="12" fill="#1a1a1a">• Спіраль + М-ефект (олово)</text>
  <text x="688" y="172" font-size="12" fill="#1a1a1a">• При 4×In: час t ≈ 0.8 с</text>
  <text x="688" y="192" font-size="12" fill="#27ae60">Витримує пускові імпульси струму</text>
  <text x="688" y="210" font-size="12" fill="#6b7280">Імпульсні БЖ, мотори, трансформатори</text>

  <!-- Картка 2: Тип F -->
  <rect x="674" y="236" width="248" height="115" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="688" y1="255" x2="712" y2="255" stroke="#2457d6" stroke-width="3.5" stroke-linecap="round"/>
  <text x="722" y="259" font-size="14" font-weight="bold" fill="#1a1a1a">Тип F (Fast-acting)</text>
  <text x="688" y="281" font-size="12" fill="#1a1a1a">• Прямий тонкий дріт</text>
  <text x="688" y="301" font-size="12" fill="#1a1a1a">• При 4×In: час t ≈ 0.025 с (25 мс)</text>
  <text x="688" y="321" font-size="12" fill="#2457d6">Миттєве розмикання кола</text>
  <text x="688" y="339" font-size="12" fill="#6b7280">Резистивні та чутливі схеми</text>

  <!-- Картка 3: Порівняльний висновок -->
  <rect x="674" y="365" width="248" height="150" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="688" y="387" font-size="13" font-weight="bold" fill="#1a1a1a">Порівняння поведінки:</text>
  <text x="688" y="409" font-size="12" font-weight="bold" fill="#1a1a1a">Пуск (3×..5× In):</text>
  <text x="688" y="427" font-size="12" fill="#27ae60">Тип T у ~30× повільніший за F</text>
  <text x="688" y="445" font-size="12" fill="#6b7280">Без хибних спрацьовувань</text>
  <text x="688" y="469" font-size="12" font-weight="bold" fill="#1a1a1a">Коротке замикання (&gt; 10× In):</text>
  <text x="688" y="487" font-size="12" fill="#c0392b">Обидва вимикаються &lt; 20–40 мс</text>
  <text x="688" y="503" font-size="12" fill="#6b7280">Захист від пожежі та руйнування</text>
</svg>
