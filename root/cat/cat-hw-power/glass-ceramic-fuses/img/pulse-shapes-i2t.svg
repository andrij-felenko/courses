<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Визначення маркерів і шаблонів штрихування -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <pattern id="hatch-rect" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2457d6" stroke-width="1.2" stroke-opacity="0.35"/>
    </pattern>
    <pattern id="hatch-sine" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2457d6" stroke-width="1.2" stroke-opacity="0.35"/>
    </pattern>
    <pattern id="hatch-exp" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2457d6" stroke-width="1.2" stroke-opacity="0.35"/>
    </pattern>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="35" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Залежність плавкого інтеграла I²t від геометричної форми імпульсу</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">За однакових пікового струму Ip та тривалості синусоїда й експонента дають удвічі менше тепла (k = 0.5), ніж прямокутник (k = 1.0)</text>

  <!-- ========================================== -->
  <!-- ПАНЕЛЬ 1: Прямокутний сплеск               -->
  <!-- ========================================== -->
  <rect x="24" y="70" width="288" height="368" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Заголовок картки -->
  <rect x="36" y="80" width="264" height="30" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="168" y="100" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Прямокутний сплеск</text>

  <!-- Картка графіка -->
  <rect x="36" y="124" width="264" height="138" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>

  <!-- Заштрихована площа I²t -->
  <path d="M 78,230 L 78,166 L 208,166 L 208,230 Z" fill="#eaf0fd"/>
  <path d="M 78,230 L 78,166 L 208,166 L 208,230 Z" fill="url(#hatch-rect)"/>

  <!-- Крива струму i(t) -->
  <path d="M 78,230 L 78,166 L 208,166 L 208,230" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Позначення функції i(t) -->
  <text x="143" y="150" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">i(t) = Ip</text>

  <!-- Позначка тривалості tp -->
  <line x1="208" y1="230" x2="208" y2="234" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="208" y="248" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">tp</text>

  <!-- Осі координат -->
  <line x1="78" y1="230" x2="78" y2="138" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="78" y1="230" x2="268" y2="230" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Підписи осей -->
  <text x="70" y="142" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">i(t)</text>
  <text x="282" y="234" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">t</text>

  <!-- Рівень Ip на осі i(t) -->
  <line x1="74" y1="166" x2="78" y2="166" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="70" y="170" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Ip</text>

  <!-- Початок відліку 0 -->
  <text x="70" y="244" font-size="12" fill="#6b7280" text-anchor="end">0</text>

  <!-- Картка розрахунку плавкого інтеграла -->
  <rect x="36" y="276" width="264" height="74" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="168" y="296" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">I²t = (Ip)² · tp</text>
  <text x="168" y="316" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Коефіцієнт форми: k = 1.00</text>
  <text x="168" y="336" font-size="12" fill="#6b7280" text-anchor="middle">100% тепла (еталонний максимум)</text>

  <!-- Картка застосування -->
  <rect x="36" y="364" width="264" height="62" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="168" y="384" font-size="12" fill="#6b7280" text-anchor="middle">Де виникає в апаратурі:</text>
  <text x="168" y="406" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Активні стабілізатори, КЗ ліній</text>

  <!-- ========================================== -->
  <!-- ПАНЕЛЬ 2: Синусоїдальна напівхвиля         -->
  <!-- ========================================== -->
  <rect x="336" y="70" width="288" height="368" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Заголовок картки -->
  <rect x="348" y="80" width="264" height="30" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="100" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">2. Синусоїдальна напівхвиля</text>

  <!-- Картка графіка -->
  <rect x="348" y="124" width="264" height="138" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>

  <!-- Заштрихована площа I²t -->
  <path d="M 390,230 C 418,195 440,166 465,166 C 490,166 512,195 540,230 Z" fill="#eaf0fd"/>
  <path d="M 390,230 C 418,195 440,166 465,166 C 490,166 512,195 540,230 Z" fill="url(#hatch-sine)"/>

  <!-- Крива струму i(t) -->
  <path d="M 390,230 C 418,195 440,166 465,166 C 490,166 512,195 540,230" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Пунктирні лінії проекції піку -->
  <line x1="465" y1="166" x2="465" y2="230" stroke="#93c5fd" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="390" y1="166" x2="465" y2="166" stroke="#93c5fd" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Позначення функції i(t) -->
  <text x="465" y="150" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">i(t) = Ip · sin(ωt)</text>

  <!-- Позначки часу tp/2 та tp -->
  <line x1="465" y1="230" x2="465" y2="234" stroke="#6b7280" stroke-width="1.2"/>
  <text x="465" y="248" font-size="12" fill="#6b7280" text-anchor="middle">tp / 2</text>

  <line x1="540" y1="230" x2="540" y2="234" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="540" y="248" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">tp</text>

  <!-- Осі координат -->
  <line x1="390" y1="230" x2="390" y2="138" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="390" y1="230" x2="580" y2="230" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Підписи осей -->
  <text x="382" y="142" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">i(t)</text>
  <text x="594" y="234" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">t</text>

  <!-- Рівень Ip на осі i(t) -->
  <line x1="386" y1="166" x2="390" y2="166" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="382" y="170" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Ip</text>

  <!-- Початок відліку 0 -->
  <text x="382" y="244" font-size="12" fill="#6b7280" text-anchor="end">0</text>

  <!-- Картка розрахунку плавкого інтеграла -->
  <rect x="348" y="276" width="264" height="74" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="296" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">I²t = 0.5 · (Ip)² · tp</text>
  <text x="480" y="316" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Коефіцієнт форми: k = 0.50</text>
  <text x="480" y="336" font-size="12" fill="#27ae60" font-weight="bold" text-anchor="middle">Вдвічі менше тепла (50% від k=1)</text>

  <!-- Картка застосування -->
  <rect x="348" y="364" width="264" height="62" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="384" font-size="12" fill="#6b7280" text-anchor="middle">Де виникає в апаратурі:</text>
  <text x="480" y="406" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мережа AC 230 В, трансформатор</text>

  <!-- ========================================== -->
  <!-- ПАНЕЛЬ 3: Згасаюча експонента              -->
  <!-- ========================================== -->
  <rect x="648" y="70" width="288" height="368" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Заголовок картки -->
  <rect x="660" y="80" width="264" height="30" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="792" y="100" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">3. Згасаюча експонента</text>

  <!-- Картка графіка -->
  <rect x="660" y="124" width="264" height="138" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>

  <!-- Заштрихована площа I²t -->
  <path d="M 702,230 L 702,166 C 725,206 789,229 872,230 Z" fill="#eaf0fd"/>
  <path d="M 702,230 L 702,166 C 725,206 789,229 872,230 Z" fill="url(#hatch-exp)"/>

  <!-- Крива струму i(t) -->
  <line x1="702" y1="230" x2="702" y2="166" stroke="#2457d6" stroke-width="2.5"/>
  <path d="M 702,166 C 725,206 789,229 872,230" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Пунктирна лінія при t = τ -->
  <line x1="747" y1="206" x2="747" y2="230" stroke="#93c5fd" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Позначення функції i(t) -->
  <text x="822" y="150" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">i(t) = Ip · e^(-t/τ)</text>

  <!-- Позначки часу τ та 3τ -->
  <line x1="747" y1="230" x2="747" y2="234" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="747" y="248" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">τ</text>

  <line x1="837" y1="230" x2="837" y2="234" stroke="#6b7280" stroke-width="1.2"/>
  <text x="837" y="248" font-size="12" fill="#6b7280" text-anchor="middle">3τ</text>

  <!-- Осі координат -->
  <line x1="702" y1="230" x2="702" y2="138" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="702" y1="230" x2="892" y2="230" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Підписи осей -->
  <text x="694" y="142" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">i(t)</text>
  <text x="906" y="234" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">t</text>

  <!-- Рівень Ip на осі i(t) -->
  <line x1="698" y1="166" x2="702" y2="166" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="694" y="170" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Ip</text>

  <!-- Початок відліку 0 -->
  <text x="694" y="244" font-size="12" fill="#6b7280" text-anchor="end">0</text>

  <!-- Картка розрахунку плавкого інтеграла -->
  <rect x="660" y="276" width="264" height="74" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="792" y="296" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">I²t = 0.5 · (Ip)² · τ</text>
  <text x="792" y="316" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Коефіцієнт форми: k = 0.50</text>
  <text x="792" y="336" font-size="12" fill="#27ae60" font-weight="bold" text-anchor="middle">Еквівалент імпульсу tp = 0.5 · τ</text>

  <!-- Картка застосування -->
  <rect x="660" y="364" width="264" height="62" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="792" y="384" font-size="12" fill="#6b7280" text-anchor="middle">Де виникає в апаратурі:</text>
  <text x="792" y="406" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Заряд конденсатора фільтра (RC)</text>
</svg>
