<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <pattern id="sand" patternUnits="userSpaceOnUse" width="12" height="12">
      <rect width="12" height="12" fill="#f4f6f8" />
      <circle cx="3" cy="3" r="1.2" fill="#d0d7de" />
      <circle cx="9" cy="8" r="1.5" fill="#d0d7de" />
      <circle cx="4" cy="10" r="0.8" fill="#6b7280" />
      <circle cx="10" cy="2" r="1" fill="#6b7280" />
      <circle cx="7" cy="5" r="0.8" fill="#d0d7de" />
      <circle cx="2" cy="7" r="1" fill="#d0d7de" />
    </pattern>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Будова скляного та керамічного запобіжників</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Керамічна колба заповнена кварцовим піском для безпечного гасіння електричної дуги</text>

  <text x="480" y="95" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Скляний запобіжник (вимикальна здатність L)</text>
  
  <rect x="270" y="140" width="420" height="80" fill="#eaf0fd" stroke="#2457d6" stroke-width="4" />
  
  <path d="M 340 130 L 260 130 L 260 230 L 340 230" fill="none" stroke="#6b7280" stroke-width="6" stroke-linejoin="miter" />
  <path d="M 620 130 L 700 130 L 700 230 L 620 230" fill="none" stroke="#6b7280" stroke-width="6" stroke-linejoin="miter" />

  <line x1="263" y1="180" x2="697" y2="180" stroke="#1a1a1a" stroke-width="2" />
  <circle cx="263" cy="180" r="4" fill="#6b7280" />
  <circle cx="697" cy="180" r="4" fill="#6b7280" />

  <text x="240" y="120" font-size="13" fill="#1a1a1a" text-anchor="end">Металевий ковпачок</text>
  <path d="M 245 116 L 270 135" fill="none" stroke="#1a1a1a" marker-end="url(#arr)"/>

  <text x="480" y="120" font-size="13" fill="#1a1a1a" text-anchor="middle">Скляна прозора колба</text>
  <path d="M 480 125 L 480 140" fill="none" stroke="#1a1a1a" marker-end="url(#arr)"/>

  <text x="480" y="255" font-size="13" fill="#1a1a1a" text-anchor="middle">Плавка нитка в повітрі</text>
  <path d="M 480 240 L 480 185" fill="none" stroke="#1a1a1a" marker-end="url(#arr)"/>

  <text x="480" y="285" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Керамічний запобіжник (вимикальна здатність H)</text>

  <rect x="270" y="320" width="420" height="80" fill="#ffffff" stroke="#d0d7de" stroke-width="8" />
  <rect x="274" y="324" width="412" height="72" fill="url(#sand)" />

  <path d="M 340 310 L 260 310 L 260 410 L 340 410" fill="none" stroke="#6b7280" stroke-width="6" stroke-linejoin="miter" />
  <path d="M 620 310 L 700 310 L 700 410 L 620 410" fill="none" stroke="#6b7280" stroke-width="6" stroke-linejoin="miter" />

  <line x1="263" y1="360" x2="697" y2="360" stroke="#1a1a1a" stroke-width="2" />
  <circle cx="263" cy="360" r="4" fill="#6b7280" />
  <circle cx="697" cy="360" r="4" fill="#6b7280" />

  <text x="280" y="440" font-size="13" fill="#1a1a1a" text-anchor="middle">Міцна керамічна колба</text>
  <path d="M 290 425 L 350 400" fill="none" stroke="#1a1a1a" marker-end="url(#arr)"/>

  <text x="480" y="440" font-size="13" fill="#1a1a1a" text-anchor="middle">Кварцовий пісок (гасить дугу)</text>
  <path d="M 480 425 L 480 380" fill="none" stroke="#1a1a1a" marker-end="url(#arr)"/>

  <text x="650" y="440" font-size="13" fill="#1a1a1a" text-anchor="middle">Плавка нитка</text>
  <path d="M 650 425 L 580 365" fill="none" stroke="#1a1a1a" marker-end="url(#arr)"/>
</svg>
