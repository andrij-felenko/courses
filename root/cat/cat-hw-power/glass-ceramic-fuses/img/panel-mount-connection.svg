<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <linearGradient id="capGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9ca3af"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#d0d7de"/>
      <stop offset="100%" stop-color="#6b7280"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Безпечне підключення панельного тримача запобіжника 5×20 мм</text>
  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Підведення фази L до донного контакту гарантує знеструмлення різьби та каретки під час викручування</text>

  <!-- Card 1: Normal Operation (Closed) -->
  <rect x="20" y="66" width="450" height="374" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="28" y="74" width="434" height="26" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="245" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#2457d6">1. Робочий стан: каретка закручена (коло замкнене)</text>

  <!-- Panel chassis wall -->
  <text x="122" y="122" text-anchor="middle" font-size="12" fill="#6b7280">Панель</text>
  <rect x="116" y="132" width="12" height="34" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>
  <rect x="116" y="234" width="12" height="34" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>

  <!-- Retaining Nut -->
  <rect x="128" y="152" width="14" height="14" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
  <rect x="128" y="234" width="14" height="14" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>

  <!-- Insulated Holder Body (Barrel) in cutaway -->
  <!-- Top body wall -->
  <rect x="128" y="166" width="176" height="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <!-- Bottom body wall -->
  <rect x="128" y="224" width="176" height="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <!-- Rear end wall -->
  <rect x="304" y="166" width="10" height="68" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Thread ridges inside barrel -->
  <line x1="134" y1="176" x2="138" y2="182" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="142" y1="176" x2="146" y2="182" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="150" y1="176" x2="154" y2="182" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="134" y1="224" x2="138" y2="218" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="142" y1="224" x2="146" y2="218" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="150" y1="224" x2="154" y2="218" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Removable Carrier / Cap (Closed) -->
  <path d="M 50 174 L 116 174 L 116 226 L 50 226 Q 44 226 44 220 L 44 180 Q 44 174 50 174 Z" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="52" y="190" width="6" height="20" rx="1" fill="#1a1a1a"/>
  <text x="80" y="146" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Каретка</text>
  <text x="80" y="162" text-anchor="middle" font-size="12" fill="#6b7280">шліц викрутки</text>

  <!-- Fuse 5x20 mm -->
  <rect x="156" y="186" width="22" height="28" rx="2" fill="url(#capGrad)" stroke="#6b7280" stroke-width="1"/>
  <rect x="178" y="188" width="76" height="24" fill="#eaf0fd" fill-opacity="0.4" stroke="#d0d7de" stroke-width="1"/>
  <line x1="178" y1="200" x2="254" y2="200" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="254" y="186" width="22" height="28" rx="2" fill="url(#capGrad)" stroke="#6b7280" stroke-width="1"/>
  <text x="216" y="156" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Вставка 5×20 мм</text>

  <!-- Bottom / Axial Contact (Rear Terminal) -->
  <!-- Spring leaf pressing on rear cap -->
  <path d="M 304 200 L 290 200 L 284 196 L 278 204 L 276 200" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="276" cy="200" r="3" fill="#c0392b"/>
  <!-- Axial Lug -->
  <rect x="314" y="196" width="24" height="8" rx="1" fill="#c0392b" stroke="#c0392b" stroke-width="1"/>
  <line x1="338" y1="200" x2="388" y2="200" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="388" cy="200" r="3.5" fill="#c0392b"/>
  <!-- Wire arrow from supply: Phase L enters holder -->
  <line x1="424" y1="200" x2="388" y2="200" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="390" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">Фаза L (230 В)</text>
  <text x="390" y="188" text-anchor="middle" font-size="12" fill="#6b7280">Вхід мережі</text>

  <!-- Side Contact (Lateral Terminal) -->
  <!-- Internal side contact strip touching front cap -->
  <line x1="156" y1="222" x2="180" y2="222" stroke="#2457d6" stroke-width="3"/>
  <!-- Radial Lug -->
  <rect x="164" y="234" width="8" height="20" rx="1" fill="#2457d6"/>
  <!-- Wire to Load: current exits to circuit -->
  <line x1="168" y1="254" x2="168" y2="284" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="168" cy="284" r="3.5" fill="#2457d6"/>
  <line x1="168" y1="284" x2="228" y2="284" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="240" y="280" text-anchor="start" font-size="13" font-weight="700" fill="#2457d6">Навантаження</text>
  <text x="240" y="296" text-anchor="start" font-size="12" fill="#6b7280">Внутрішня схема</text>

  <!-- Contact Labels in Scheme -->
  <text x="290" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">Донний торець</text>
  <line x1="290" y1="146" x2="290" y2="164" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="2,2"/>

  <text x="210" y="248" text-anchor="start" font-size="12" font-weight="700" fill="#2457d6">Бічний вивід</text>
  <line x1="174" y1="244" x2="204" y2="244" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="2,2"/>

  <!-- Info Box 1 -->
  <rect x="28" y="340" width="434" height="90" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="40" y="359" font-size="12" font-weight="700" fill="#2457d6">✓ Стандарт IEC 60127-6: Фаза L підводиться виключно на торець</text>
  <text x="40" y="377" font-size="12" fill="#1a1a1a">Бічний контакт з'єднується з внутрішньою схемою приладу.</text>
  <text x="40" y="395" font-size="12" fill="#1a1a1a">Шлях струму: Вхід L → донний контакт → запобіжник → бічний вивід.</text>
  <text x="40" y="417" font-size="12" font-weight="700" fill="#27ae60">Результат: нормальне живлення та надійний тепловий контакт</text>


  <!-- Card 2: Unscrewing Carrier (Service / Open) -->
  <rect x="490" y="66" width="450" height="374" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="498" y="74" width="434" height="26" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="715" y="92" text-anchor="middle" font-size="13" font-weight="700" fill="#27ae60">2. Заміна вставки: каретка викручена (безпечний дотик)</text>

  <!-- Panel chassis wall -->
  <text x="612" y="122" text-anchor="middle" font-size="12" fill="#6b7280">Панель</text>
  <rect x="606" y="132" width="12" height="34" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>
  <rect x="606" y="234" width="12" height="34" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>

  <!-- Retaining Nut -->
  <rect x="618" y="152" width="14" height="14" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
  <rect x="618" y="234" width="14" height="14" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>

  <!-- Insulated Holder Body (Barrel) in cutaway -->
  <rect x="618" y="166" width="176" height="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="618" y="224" width="176" height="10" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="794" y="166" width="10" height="68" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Internal barrel threads -->
  <line x1="622" y1="176" x2="626" y2="182" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="630" y1="176" x2="634" y2="182" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="638" y1="176" x2="642" y2="182" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="622" y1="224" x2="626" y2="218" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="630" y1="224" x2="634" y2="218" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="638" y1="224" x2="642" y2="218" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Carrier / Cap withdrawn to the left -->
  <path d="M 506 174 L 566 174 L 566 226 L 506 226 Q 500 226 500 220 L 500 180 Q 500 174 506 174 Z" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="508" y="190" width="6" height="20" rx="1" fill="#27ae60"/>

  <!-- Carrier external threads (unscrewed) -->
  <line x1="570" y1="174" x2="574" y2="180" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="578" y1="174" x2="582" y2="180" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="586" y1="174" x2="590" y2="180" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="594" y1="174" x2="598" y2="180" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="570" y1="226" x2="574" y2="220" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="578" y1="226" x2="582" y2="220" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="586" y1="226" x2="590" y2="220" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="594" y1="226" x2="598" y2="220" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Carrier sleeve holding fuse -->
  <line x1="566" y1="184" x2="606" y2="184" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="566" y1="216" x2="606" y2="216" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="2,2"/>
  <text x="536" y="146" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">Викручена каретка</text>
  <text x="536" y="162" text-anchor="middle" font-size="12" fill="#27ae60">U = 0 В (безпечно)</text>

  <!-- Fuse 5x20 mm pulled out with carrier -->
  <rect x="606" y="186" width="22" height="28" rx="2" fill="url(#capGrad)" stroke="#6b7280" stroke-width="1"/>
  <rect x="628" y="188" width="76" height="24" fill="#eaf0fd" fill-opacity="0.4" stroke="#d0d7de" stroke-width="1"/>
  <line x1="628" y1="200" x2="704" y2="200" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="704" y="186" width="22" height="28" rx="2" fill="url(#capGrad)" stroke="#6b7280" stroke-width="1"/>

  <!-- Disconnected Gap Annotation -->
  <text x="748" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">Розрив кола</text>
  <text x="748" y="158" text-anchor="middle" font-size="12" fill="#c0392b">струм = 0</text>
  <!-- Gap indication bracket -->
  <line x1="728" y1="172" x2="766" y2="172" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="728" y1="168" x2="728" y2="176" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="766" y1="168" x2="766" y2="176" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Bottom Contact (Deep at rear, 230V present but protected) -->
  <path d="M 794 200 L 780 200 L 774 196 L 768 204 L 766 200" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="766" cy="200" r="3" fill="#c0392b"/>
  <!-- Axial Lug -->
  <rect x="804" y="196" width="24" height="8" rx="1" fill="#c0392b" stroke="#c0392b" stroke-width="1"/>
  <line x1="828" y1="200" x2="868" y2="200" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="868" cy="200" r="3.5" fill="#c0392b"/>
  <text x="880" y="172" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">Фаза L (230 В)</text>
  <text x="880" y="188" text-anchor="middle" font-size="12" fill="#6b7280">Схована на дні</text>

  <!-- Side Contact (De-energized, 0V) -->
  <line x1="646" y1="222" x2="670" y2="222" stroke="#6b7280" stroke-width="3"/>
  <rect x="654" y="234" width="8" height="20" rx="1" fill="#6b7280"/>
  <line x1="658" y1="254" x2="658" y2="284" stroke="#6b7280" stroke-width="2.5"/>
  <circle cx="658" cy="284" r="3.5" fill="#6b7280"/>
  <line x1="658" y1="284" x2="710" y2="284" stroke="#6b7280" stroke-width="2" marker-end="url(#arr)"/>
  <text x="722" y="280" text-anchor="start" font-size="13" font-weight="700" fill="#27ae60">U = 0 В (безпечно)</text>
  <text x="722" y="296" text-anchor="start" font-size="12" fill="#6b7280">Різьба знеструмлена</text>

  <!-- Info Box 2 (Warning & Safety) -->
  <rect x="498" y="340" width="434" height="90" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="510" y="359" font-size="12" font-weight="700" fill="#c0392b">⛔ Безпека обслуговування за стандартом IEC 60127-6:</text>
  <text x="510" y="377" font-size="12" fill="#1a1a1a">• Глибина гнізда > 15 мм: контакт 230 В недосяжний для пальця.</text>
  <text x="510" y="395" font-size="12" fill="#1a1a1a">• При відкриванні: торець розмикається першим (0 В на різьбі).</text>
  <text x="510" y="417" font-size="12" font-weight="700" fill="#c0392b">• Ризик помилки: при L на боці напруга 230 В була б на різьбі!</text>

</svg>
