<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Форма напруги до та після фільтра</text>
  <text x="480" y="65" text-anchor="middle" font-size="13" fill="#6b7280">LC-ланцюг ефективно згладжує високочастотні викиди</text>

  <!-- Графік 1: До фільтра -->
  <path d="M 100,350 L 460,350" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 100,350 L 100,130" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="100" y1="250" x2="450" y2="250" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  
  <text x="90" y="254" text-anchor="end" font-size="13" fill="#6b7280">12 В</text>
  <text x="100" y="115" text-anchor="middle" font-size="13" fill="#1a1a1a">U, В</text>
  <text x="460" y="375" text-anchor="middle" font-size="13" fill="#1a1a1a">t</text>
  <text x="280" y="420" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">До фільтра (пульсації та викиди)</text>

  <!-- Сигнал до фільтра -->
  <path d="M 100,250 L 145,265 L 145,180 L 148,320 L 150,250 L 195,265 L 195,180 L 198,320 L 200,250 L 245,265 L 245,180 L 248,320 L 250,250 L 295,265 L 295,180 L 298,320 L 300,250 L 345,265 L 345,180 L 348,320 L 350,250 L 395,265 L 395,180 L 398,320 L 400,250 L 445,265" fill="none" stroke="#c0392b" stroke-width="2" stroke-linejoin="round"/>

  <!-- Вказівник для першого графіка -->
  <path d="M 225,145 L 198,175" fill="none" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="230" y="140" text-anchor="start" font-size="13" fill="#1a1a1a">Високочастотні викиди</text>

  <!-- Графік 2: Після фільтра -->
  <path d="M 520,350 L 880,350" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M 520,350 L 520,130" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="520" y1="250" x2="870" y2="250" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>

  <text x="510" y="254" text-anchor="end" font-size="13" fill="#6b7280">12 В</text>
  <text x="520" y="115" text-anchor="middle" font-size="13" fill="#1a1a1a">U, В</text>
  <text x="880" y="375" text-anchor="middle" font-size="13" fill="#1a1a1a">t</text>
  <text x="700" y="420" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Після LC-фільтра (згладжена напруга)</text>

  <!-- Сигнал після фільтра (гладка крива) -->
  <path d="M 520,250 Q 532.5,248 545,250 T 570,250 T 595,250 T 620,250 T 645,250 T 670,250 T 695,250 T 720,250 T 745,250 T 770,250 T 795,250 T 820,250 T 845,250 T 870,250" fill="none" stroke="#27ae60" stroke-width="2"/>

  <!-- Вказівник для другого графіка -->
  <path d="M 685,190 L 665,248" fill="none" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr)"/>
  <text x="690" y="185" text-anchor="start" font-size="13" fill="#1a1a1a">Залишок пульсацій (мВ)</text>

</svg>
