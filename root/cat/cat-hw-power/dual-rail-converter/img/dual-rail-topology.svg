<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <text x="480" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Архітектура двополярного джерела живлення ±12 В</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Неізольоване розділення 5 В на два шляхи з імпульсним перетворенням та LDO-пострегулюванням</text>

  <path d="M 160 250 L 210 250 L 210 160 L 250 160" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 210 250 L 210 340 L 250 340" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <circle cx="210" cy="250" r="4" fill="#1a1a1a"/>

  <path d="M 440 160 L 550 160" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 440 340 L 550 340" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

  <path d="M 720 160 L 810 160" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <path d="M 720 340 L 810 340" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

  <text x="500" y="150" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="bold">+13 V</text>
  <text x="500" y="174" text-anchor="middle" font-size="12" fill="#c0392b">High Ripple</text>

  <text x="500" y="330" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="bold">-13 V</text>
  <text x="500" y="354" text-anchor="middle" font-size="12" fill="#c0392b">High Ripple</text>

  <text x="765" y="150" text-anchor="middle" font-size="12" fill="#27ae60" font-weight="bold">Clean</text>
  <text x="765" y="330" text-anchor="middle" font-size="12" fill="#27ae60" font-weight="bold">Clean</text>

  <rect x="40" y="220" width="120" height="60" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="100" y="246" text-anchor="middle" font-size="16" fill="#1a1a1a" font-weight="bold">+5 V</text>
  <text x="100" y="266" text-anchor="middle" font-size="12" fill="#2457d6" font-weight="bold">IN</text>

  <rect x="260" y="120" width="180" height="80" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="350" y="156" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="bold">Boost Converter</text>
  <text x="350" y="176" text-anchor="middle" font-size="12" fill="#6b7280">Step-Up DC-DC</text>

  <rect x="260" y="300" width="180" height="80" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="350" y="336" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="bold">Inverting Converter</text>
  <text x="350" y="356" text-anchor="middle" font-size="12" fill="#6b7280">Buck-Boost DC-DC</text>

  <rect x="560" y="120" width="160" height="80" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="640" y="156" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="bold">Positive LDO</text>
  <text x="640" y="176" text-anchor="middle" font-size="12" fill="#6b7280">Post-Regulator</text>

  <rect x="560" y="300" width="160" height="80" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="640" y="336" text-anchor="middle" font-size="14" fill="#1a1a1a" font-weight="bold">Negative LDO</text>
  <text x="640" y="356" text-anchor="middle" font-size="12" fill="#6b7280">Post-Regulator</text>

  <rect x="820" y="130" width="100" height="60" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="870" y="156" text-anchor="middle" font-size="16" fill="#1a1a1a" font-weight="bold">+12 V</text>
  <text x="870" y="176" text-anchor="middle" font-size="12" fill="#27ae60" font-weight="bold">OUT</text>

  <rect x="820" y="310" width="100" height="60" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="870" y="336" text-anchor="middle" font-size="16" fill="#1a1a1a" font-weight="bold">-12 V</text>
  <text x="870" y="356" text-anchor="middle" font-size="12" fill="#27ae60" font-weight="bold">OUT</text>
</svg>
