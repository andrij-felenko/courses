<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" width="720" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="460" fill="white"/>
  <defs>
    <marker id="arr-axis" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <text x="360" y="35" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вихідні напруги від коефіцієнта заповнення ШІМ</text>
  <text x="360" y="55" font-size="13" fill="#6b7280" text-anchor="middle">Реальні втрати обмежують робочий діапазон перетворювача</text>

  <!-- Axes -->
  <line x1="80" y1="240" x2="660" y2="240" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-axis)"/>
  <text x="670" y="244" font-size="14" fill="#1a1a1a">D</text>

  <line x1="80" y1="410" x2="80" y2="80" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-axis)"/>
  <text x="75" y="70" font-size="14" fill="#1a1a1a" text-anchor="end">Vout (В)</text>

  <!-- Y axis ticks -->
  <!-- 0V is at 240, 20V is at 100, -20V is at 380 -->
  <line x1="75" y1="240" x2="80" y2="240" stroke="#1a1a1a" stroke-width="1"/>
  <text x="70" y="244" font-size="12" fill="#1a1a1a" text-anchor="end">0</text>
  
  <line x1="75" y1="170" x2="80" y2="170" stroke="#1a1a1a" stroke-width="1"/>
  <text x="70" y="174" font-size="12" fill="#1a1a1a" text-anchor="end">10</text>
  
  <line x1="75" y1="100" x2="80" y2="100" stroke="#1a1a1a" stroke-width="1"/>
  <text x="70" y="104" font-size="12" fill="#1a1a1a" text-anchor="end">20</text>

  <line x1="75" y1="310" x2="80" y2="310" stroke="#1a1a1a" stroke-width="1"/>
  <text x="70" y="314" font-size="12" fill="#1a1a1a" text-anchor="end">-10</text>

  <line x1="75" y1="380" x2="80" y2="380" stroke="#1a1a1a" stroke-width="1"/>
  <text x="70" y="384" font-size="12" fill="#1a1a1a" text-anchor="end">-20</text>

  <!-- X axis ticks -->
  <line x1="220" y1="240" x2="220" y2="245" stroke="#1a1a1a" stroke-width="1"/>
  <text x="220" y="258" font-size="12" fill="#1a1a1a" text-anchor="middle">0.2</text>

  <line x1="360" y1="240" x2="360" y2="245" stroke="#1a1a1a" stroke-width="1"/>
  <text x="360" y="258" font-size="12" fill="#1a1a1a" text-anchor="middle">0.4</text>

  <line x1="500" y1="240" x2="500" y2="245" stroke="#1a1a1a" stroke-width="1"/>
  <text x="500" y="258" font-size="12" fill="#1a1a1a" text-anchor="middle">0.6</text>

  <line x1="640" y1="240" x2="640" y2="245" stroke="#1a1a1a" stroke-width="1"/>
  <text x="640" y="258" font-size="12" fill="#1a1a1a" text-anchor="middle">0.8</text>

  <!-- Ideal curves -->
  <!-- V+ = 5 / (1-D). 0:5 (y=205), 0.2:6.25 (y=196.25), 0.4:8.33 (y=181.69), 0.6:12.5 (y=152.5), 0.8:25 (y=65) -->
  <path d="M 80 205 Q 360 181.69 640 65" fill="none" stroke="#d0d7de" stroke-width="2" stroke-dasharray="6,4"/>
  
  <!-- V- = -5 / (1-D). -->
  <path d="M 80 275 Q 360 298.31 640 415" fill="none" stroke="#d0d7de" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Real curves -->
  <path d="M 80 205 Q 360 181.69 500 160 Q 600 130 640 180" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <path d="M 80 275 Q 360 298.31 500 320 Q 600 350 640 300" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Labels -->
  <text x="630" y="170" font-size="14" fill="#2457d6" text-anchor="end">Реальна V+</text>
  <text x="630" y="315" font-size="14" fill="#c0392b" text-anchor="end">Реальна V-</text>
  
  <text x="560" y="70" font-size="13" fill="#6b7280" text-anchor="end">Ідеальна V+</text>
  <text x="560" y="415" font-size="13" fill="#6b7280" text-anchor="end">Ідеальна V-</text>
</svg>
