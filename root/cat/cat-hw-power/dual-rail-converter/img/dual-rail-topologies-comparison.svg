  <text x="50" y="480" font-size="13" font-weight="bold" fill="#1a1a1a">Недоліки:</text>
  <text x="50" y="500" font-size="13" fill="#c0392b">• Дуже малий вихідний струм</text>
  <text x="50" y="515" font-size="13" fill="#c0392b">• Високі шуми та пульсації</text>

