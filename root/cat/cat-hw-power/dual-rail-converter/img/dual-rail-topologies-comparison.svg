<svg viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Titles -->
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Топології перетворювачів 5 В → ±12 В</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Порівняння ємнісної, індуктивної та ізольованої схем генерації двополярного живлення</text>

  <!-- Panel 1: Charge Pump -->
