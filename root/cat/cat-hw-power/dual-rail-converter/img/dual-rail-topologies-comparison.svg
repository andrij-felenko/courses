  <text x="670" y="420" font-size="13" font-weight="bold" fill="#1a1a1a">Переваги:</text>
  <text x="670" y="440" font-size="13" fill="#27ae60">• Просте впровадження</text>
  <text x="670" y="455" font-size="13" fill="#27ae60">• Гальванічна ізоляція</text>
