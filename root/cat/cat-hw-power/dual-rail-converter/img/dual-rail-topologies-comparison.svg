  <text x="170" y="120" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Ємнісний помпувач заряду</text>
  <text x="170" y="140" font-size="13" fill="#6b7280" text-anchor="middle">Лише конденсатори, без котушок</text>

