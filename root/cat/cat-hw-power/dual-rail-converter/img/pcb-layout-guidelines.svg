<svg viewBox="0 0 960 560" width="960" height="560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="560" fill="white"/>
  
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Трасування перетворювача 5 В у ±12 В</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Мінімізація площі контурів струму (di/dt) та правильна організація полігонів землі знижують рівень завад</text>

  <!-- Left Side: PCB Layout Scheme -->
  <rect x="50" y="100" width="500" height="420" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="4"/>
  <text x="300" y="130" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Рекомендоване трасування компонентів</text>

  <!-- GND Plane (Bottom) -->
  <rect x="70" y="150" width="460" height="350" fill="#eaf0fd" stroke="#2457d6" stroke-dasharray="4" stroke-width="2" rx="2"/>
  <text x="130" y="175" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">GND Полігон</text>
  <text x="130" y="195" font-size="12" fill="#2457d6" text-anchor="middle">(суцільний)</text>

  <!-- IC -->
  <rect x="260" y="270" width="80" height="80" fill="#1a1a1a" rx="4"/>
  <text x="300" y="315" font-size="14" font-weight="bold" fill="white" text-anchor="middle">IC</text>
  <!-- IC pads for visual effect -->
  <rect x="250" y="280" width="10" height="15" fill="#d0d7de"/>
  <rect x="250" y="305" width="10" height="15" fill="#d0d7de"/>
  <rect x="250" y="330" width="10" height="15" fill="#d0d7de"/>
  <rect x="340" y="280" width="10" height="15" fill="#d0d7de"/>
  <rect x="340" y="305" width="10" height="15" fill="#d0d7de"/>
  <rect x="340" y="330" width="10" height="15" fill="#d0d7de"/>

  <!-- Traces and SW Nodes -->
  <!-- VIN trace -->
  <path d="M 80 310 L 150 310" stroke="#1a1a1a" stroke-width="6" fill="none"/>
  <text x="115" y="300" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">5V IN</text>

  <!-- SW1 Trace -->
  <path d="M 290 270 L 290 220" stroke="#c0392b" stroke-width="12" fill="none"/>
  <path d="M 310 270 L 310 220" stroke="#c0392b" stroke-width="12" fill="none"/>
  <!-- SW2 Trace -->
  <path d="M 290 350 L 290 400" stroke="#c0392b" stroke-width="12" fill="none"/>
  <path d="M 310 350 L 310 400" stroke="#c0392b" stroke-width="12" fill="none"/>

  <!-- Inductors -->
  <rect x="250" y="180" width="100" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="300" y="205" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">L (+12V)</text>

  <rect x="250" y="400" width="100" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="300" y="425" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">L (-12V)</text>

  <!-- Output traces -->
  <path d="M 350 200 L 430 200 L 430 210" stroke="#1a1a1a" stroke-width="6" fill="none"/>
  <path d="M 350 420 L 430 420 L 430 410" stroke="#1a1a1a" stroke-width="6" fill="none"/>

  <!-- Capacitors -->
  <!-- Cin -->
  <rect x="150" y="280" width="30" height="60" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="165" y="315" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Cin</text>
  
  <!-- Cout+ -->
  <rect x="420" y="210" width="30" height="60" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="435" y="245" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Cout+</text>

  <!-- Cout- -->
  <rect x="420" y="350" width="30" height="60" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="435" y="385" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Cout-</text>

  <!-- Output VOUT lines -->
  <path d="M 450 240 L 520 240" stroke="#1a1a1a" stroke-width="6" fill="none"/>
  <text x="485" y="230" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">+12V OUT</text>
  
  <path d="M 450 380 L 520 380" stroke="#1a1a1a" stroke-width="6" fill="none"/>
  <text x="485" y="370" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">-12V OUT</text>

  <!-- FB Trace -->
  <path d="M 500 240 L 500 175 L 360 175 L 360 270" stroke="#6b7280" stroke-width="2" fill="none" stroke-dasharray="2"/>
  <text x="430" y="170" font-size="12" fill="#6b7280" text-anchor="middle">FB trace</text>

  <!-- Annotations / Circles on PCB -->
  <!-- SW Node highlight -->
  <circle cx="300" cy="245" r="25" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4"/>
  <text x="270" y="240" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">SW Node</text>
  <text x="270" y="255" font-size="12" fill="#c0392b" text-anchor="end">(мала площа)</text>
  
  <circle cx="300" cy="375" r="25" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4"/>

  <!-- Vias -->
  <circle cx="165" cy="330" r="4" fill="#2457d6"/>
  <circle cx="435" cy="260" r="4" fill="#2457d6"/>
  <circle cx="435" cy="360" r="4" fill="#2457d6"/>
  <circle cx="300" cy="330" r="4" fill="#2457d6"/>
  <circle cx="280" cy="330" r="4" fill="#2457d6"/>
  <circle cx="320" cy="330" r="4" fill="#2457d6"/>
  
  <text x="200" y="370" font-size="12" fill="#2457d6" text-anchor="middle">Vias to GND</text>
  <path d="M 200 355 L 280 335" stroke="#2457d6" stroke-width="1" marker-end="url(#arr-blue)"/>
  <path d="M 190 355 L 165 338" stroke="#2457d6" stroke-width="1" marker-end="url(#arr-blue)"/>

  <!-- Current loop IN -->
  <path d="M 175 295 Q 215 285 255 295 Q 260 330 210 330 Q 175 330 175 315" fill="none" stroke="#27ae60" stroke-width="3" stroke-dasharray="6" marker-end="url(#arr)"/>
  <text x="215" y="285" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">di/dt IN</text>

  <!-- Right Panel: Rules -->
  <rect x="580" y="100" width="330" height="420" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="4"/>
  <text x="745" y="130" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Ключові правила розводки</text>

  <!-- Rule 1: High di/dt loops -->
  <rect x="600" y="160" width="290" height="70" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="4"/>
  <text x="615" y="180" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="start">1. Контури струму (di/dt)</text>
  <text x="615" y="200" font-size="12" fill="#1a1a1a" text-anchor="start">Вхідний (Cin) та вихідні (Cout+, Cout-)</text>
  <text x="615" y="215" font-size="12" fill="#1a1a1a" text-anchor="start">конденсатори розміщуйте впритул до IC.</text>

  <!-- Rule 2: SW Node -->
  <rect x="600" y="245" width="290" height="70" fill="#fdecea" stroke="#c0392b" stroke-width="2" rx="4"/>
  <text x="615" y="265" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="start">2. Вузли комутації (SW)</text>
  <text x="615" y="285" font-size="12" fill="#1a1a1a" text-anchor="start">Розраховуйте площу міді достатньою</text>
  <text x="615" y="300" font-size="12" fill="#1a1a1a" text-anchor="start">для струму, але мінімальною для завад.</text>

  <!-- Rule 3: Ground Plane -->
  <rect x="600" y="330" width="290" height="70" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="4"/>
  <text x="615" y="350" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="start">3. Суцільний полігон GND</text>
  <text x="615" y="370" font-size="12" fill="#1a1a1a" text-anchor="start">Використовуйте суцільний шар землі</text>
  <text x="615" y="385" font-size="12" fill="#1a1a1a" text-anchor="start">без розривів під силовими контурами.</text>

  <!-- Rule 4: Feedback -->
  <rect x="600" y="415" width="290" height="70" fill="#ffffff" stroke="#d0d7de" stroke-width="2" rx="4"/>
  <text x="615" y="435" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">4. Ланцюг зворотного зв'язку (FB)</text>
  <text x="615" y="455" font-size="12" fill="#6b7280" text-anchor="start">Трасуйте FB якнайдалі від SW-вузлів,</text>
  <text x="615" y="470" font-size="12" fill="#6b7280" text-anchor="start">під захистом земляного полігона.</text>
</svg>
