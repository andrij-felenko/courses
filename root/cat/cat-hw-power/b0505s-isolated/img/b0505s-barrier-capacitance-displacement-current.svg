<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Паразитна бар'єрна ємність C_iso та струм зміщення dV/dt</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Крутий перепад напруги між землями наводить струм витоку i = C_iso · (dV/dt) крізь бар'єр</text>

  <!-- Гальванічний бар'єр -->
  <rect x="420" y="90" width="120" height="240" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6,6"/>
  <text x="480" y="115" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Ізоляційний</text>
  <text x="480" y="132" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">бар'єр 1500 В</text>

  <!-- Паразитна ємність C_iso -->
  <line x1="455" y1="210" x2="455" y2="250" stroke="#c0392b" stroke-width="3"/>
  <line x1="505" y1="210" x2="505" y2="250" stroke="#c0392b" stroke-width="3"/>
  <text x="480" y="195" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">C_iso</text>
  <text x="480" y="275" font-size="12" fill="#6b7280" text-anchor="middle">20–30 пФ</text>

  <!-- Ліва сторона: Первинна земля GND1 -->
  <rect x="50" y="90" width="350" height="240" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="225" y="120" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Первинна сторона (Система 1)</text>

  <line x1="80" y1="160" x2="380" y2="160" stroke="#1a1a1a" stroke-width="2"/>
  <text x="90" y="150" font-size="12" font-weight="bold" fill="#2457d6">+5V (Вхід)</text>

  <line x1="80" y1="230" x2="455" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <text x="90" y="220" font-size="12" font-weight="bold" fill="#1a1a1a">GND1 (Шумна земля)</text>

  <!-- Генератор перешкод dV/dt (імпульсний ключ) -->
  <rect x="180" y="250" width="150" height="60" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="255" y="272" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Імпульсна завада</text>
  <text x="255" y="292" font-size="12" fill="#c0392b" text-anchor="middle">dV/dt = 20–50 кВ/мкс</text>

  <!-- Права сторона: Вторинна ізольована земля GND2 -->
  <rect x="560" y="90" width="350" height="240" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="735" y="120" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Ізольована сторона (Система 2)</text>

  <line x1="580" y1="160" x2="880" y2="160" stroke="#1a1a1a" stroke-width="2"/>
  <text x="870" y="150" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">+5V (Ізольований вихід)</text>

  <line x1="505" y1="230" x2="880" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <text x="870" y="220" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">GND2 (Чиста земля)</text>

  <!-- Навантаження (чутливий АЦП) -->
  <rect x="700" y="250" width="150" height="60" rx="4" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <text x="775" y="272" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Чутливе коло</text>
  <text x="775" y="292" font-size="12" fill="#6b7280" text-anchor="middle">АЦП / Сенсор</text>

  <!-- Струм зміщення через бар'єр (червона стрілка) -->
  <path d="M 330,230 L 450,230" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-red)"/>
  <path d="M 510,230 L 680,230" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-red)"/>
  <text x="480" y="310" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">i_disp = C_iso · (dV/dt)</text>

  <!-- Нижня панель формули й захисту -->
  <rect x="50" y="345" width="860" height="90" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="70" y="372" font-size="13" font-weight="bold" fill="#1a1a1a">Фізичний наслідок паразитної ємності:</text>
  <text x="70" y="396" font-size="12" fill="#1a1a1a">• Навіть при нульовому омічному струмі витоку високочастотний перепад dV/dt пробиває бар'єр у вигляді ємнісного струму.</text>
  <text x="70" y="418" font-size="12" fill="#1a1a1a">• Приклад: C_iso = 25 пФ при dV/dt = 20 В/нс створює імпульсний струм витоку i = 25·10⁻¹² · 20·10⁹ = 0.5 А!</text>
</svg>
