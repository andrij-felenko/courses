<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Апаратний та програмний інтерфейс ізольованого домену B0505S</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Гальванічний бар'єр усуває земляні петлі, а мікроконтролер контролює баластне навантаження та пульс оптопари</text>

  <!-- ЛІВА ПАНЕЛЬ: Первинний домен (MCU) -->
  <rect x="30" y="70" width="280" height="360" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="42" y="82" width="256" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="170" y="103" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Первинний домен (Система / MCU)</text>

  <rect x="45" y="125" width="250" height="58" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="55" y="145" font-size="12" font-weight="bold" fill="#1a1a1a">Вхідне живлення:</text>
  <text x="55" y="165" font-size="12" fill="#6b7280">+5 В первинне та спільна земля GND</text>

  <rect x="45" y="195" width="250" height="75" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="55" y="215" font-size="12" font-weight="bold" fill="#1a1a1a">Керування первинним живленням:</text>
  <text x="55" y="235" font-size="12" fill="#1a1a1a">MOSFET-ключ подачі +5 В на B0505S</text>
  <text x="55" y="255" font-size="12" fill="#6b7280">Soft-start усуває ударний струм пуску</text>

  <rect x="45" y="282" width="250" height="135" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="55" y="302" font-size="12" font-weight="bold" fill="#27ae60">Програмний монітор домену:</text>
  <text x="55" y="322" font-size="12" fill="#1a1a1a">Вхід переривання (Heartbeat Input)</text>
  <text x="55" y="342" font-size="12" fill="#1a1a1a">Фіксація імпульсів здоров'я вторинки</text>
  <text x="55" y="362" font-size="12" fill="#c0392b">Таймаут &gt; 50 мс: ізоляція знеструмлена</text>
  <text x="55" y="382" font-size="12" fill="#6b7280">Дія: блокування UART для захисту шини</text>

  <!-- ЦЕНТРАЛЬНА СМУГА: Гальванічний бар'єр -->
  <rect x="340" y="70" width="270" height="360" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="475" y="95" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">БАР'ЄР ІЗОЛЯЦІЇ (1500 В DC)</text>
  <text x="475" y="112" font-size="12" fill="#c0392b" text-anchor="middle">GND та GND_ISO суворо роз'єднані!</text>

  <!-- Блок B0505S -->
  <rect x="355" y="130" width="240" height="110" rx="4" fill="white" stroke="#c0392b" stroke-width="1.5"/>
  <text x="475" y="152" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Модуль B0505S-1W</text>
  <text x="365" y="175" font-size="12" fill="#1a1a1a">Вхід: Pin 1 (GND), Pin 2 (+Vin)</text>
  <text x="365" y="195" font-size="12" fill="#2457d6">Трансформатор: автогенератор 120 кГц</text>
  <text x="365" y="215" font-size="12" fill="#1a1a1a">Вихід: Pin 3 (GND_ISO), Pin 4 (+Vout)</text>
  <text x="365" y="232" font-size="12" fill="#c0392b">Стеля: 1 Ват (струм до 200 мА)</text>

  <!-- Оптопара зворотного зв'язку -->
  <rect x="355" y="260" width="240" height="85" rx="4" fill="white" stroke="#27ae60"/>
  <text x="475" y="280" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Оптопара PC817 (Heartbeat)</text>
  <text x="365" y="302" font-size="12" fill="#1a1a1a">Світлодіод у вторинному домені</text>
  <text x="365" y="322" font-size="12" fill="#1a1a1a">Фототранзистор у первинному домені</text>
  <text x="365" y="338" font-size="12" fill="#6b7280">Передача статусу без контакту земель</text>

  <!-- Цифровий ізолятор сигналів -->
  <rect x="355" y="360" width="240" height="55" rx="4" fill="white" stroke="#2457d6"/>
  <text x="475" y="380" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Цифровий ізолятор ADuM1201</text>
  <text x="475" y="400" font-size="12" fill="#6b7280" text-anchor="middle">Лінії TXD / RXD без витоку струму</text>

  <!-- ПРАВА ПАНЕЛЬ: Вторинний домен -->
  <rect x="640" y="70" width="290" height="360" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="652" y="82" width="266" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="785" y="103" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Ізольований домен (GND_ISO)</text>

  <rect x="655" y="125" width="260" height="90" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="665" y="145" font-size="12" font-weight="bold" fill="#c0392b">Пастка холостого ходу (&lt; 20 мА):</text>
  <text x="665" y="165" font-size="12" fill="#1a1a1a">Напруга закидається до 6.8–7.2 В!</text>
  <text x="665" y="185" font-size="12" fill="#c0392b">Активний баласт (Dummy Load):</text>
  <text x="665" y="205" font-size="12" fill="#27ae60">Резистор 220 Ом (струм 22 мА) або LDO</text>

  <rect x="655" y="225" width="260" height="75" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="665" y="245" font-size="12" font-weight="bold" fill="#1a1a1a">Ізольовані інтерфейси:</text>
  <text x="665" y="265" font-size="12" fill="#1a1a1a">Трансивер RS-485 (MAX485) / CAN</text>
  <text x="665" y="285" font-size="12" fill="#6b7280">Стійкість до синфазних завад до 1 кВ</text>

  <rect x="655" y="310" width="260" height="105" rx="4" fill="white" stroke="#d0d7de"/>
  <text x="665" y="330" font-size="12" font-weight="bold" fill="#1a1a1a">Генератор пульсу (Heartbeat):</text>
  <text x="665" y="350" font-size="12" fill="#1a1a1a">Апаратний мультивібратор або таймер</text>
  <text x="665" y="370" font-size="12" fill="#27ae60">Частота: 100 Гц при напрузі &gt; 4.75 В</text>
  <text x="665" y="390" font-size="12" fill="#6b7280">Гасне при аварії вторинного живлення</text>

  <!-- Стрілки зв'язку -->
  <line x1="295" y1="210" x2="350" y2="180" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="595" y1="180" x2="650" y2="160" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="655" y1="360" x2="600" y2="305" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="355" y1="305" x2="300" y2="340" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
</svg>
