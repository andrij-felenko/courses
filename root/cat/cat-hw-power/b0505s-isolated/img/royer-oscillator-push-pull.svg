<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Автоколивальний пуш-пульний інвертор Роєра (схема B0505S)</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Перемикання транзисторів Q1/Q2 керується насиченням тороїдального осердя</text>

  <!-- Гальванічний бар'єр -->
  <line x1="570" y1="90" x2="570" y2="420" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,6"/>
  <text x="570" y="105" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Ізоляційний бар'єр 1500 В</text>

  <!-- Первинна сторона -->
  <rect x="40" y="90" width="500" height="330" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="290" y="115" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Первинний контур автогенератора (Вхід 5 В)</text>

  <!-- Вхідні клеми -->
  <circle cx="60" cy="150" r="4" fill="#2457d6"/>
  <text x="60" y="135" font-size="12" font-weight="bold" fill="#2457d6">Vin (5V)</text>

  <circle cx="60" cy="380" r="4" fill="#1a1a1a"/>
  <text x="60" y="405" font-size="12" font-weight="bold" fill="#1a1a1a">GND (0V)</text>

  <!-- Живлення середньої точки первинної обмотки -->
  <line x1="60" y1="150" x2="220" y2="150" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="220" y1="150" x2="400" y2="150" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="400" y1="150" x2="400" y2="210" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Пусковий ланцюг зміщення баз -->
  <line x1="220" y1="150" x2="220" y2="220" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="205" y="220" width="30" height="40" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="220" y="244" font-size="12" fill="#2457d6" text-anchor="middle">Rb</text>
  <line x1="220" y1="260" x2="220" y2="280" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Первинні пів-обмотки трансформатора T1 -->
  <rect x="380" y="210" width="40" height="120" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="400" y="255" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">W1a</text>
  <text x="400" y="285" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">W1b</text>

  <!-- Тороїдальне осердя -->
  <line x1="440" y1="180" x2="440" y2="360" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="448" y1="180" x2="448" y2="360" stroke="#1a1a1a" stroke-width="3"/>
  <text x="444" y="165" font-size="12" fill="#6b7280" text-anchor="middle">Ферит</text>

  <!-- Транзистори Q1 і Q2 -->
  <rect x="280" y="180" width="60" height="45" rx="4" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="310" y="207" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Q1 NPN</text>
  <line x1="340" y1="202" x2="380" y2="202" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="380" y1="202" x2="380" y2="210" stroke="#1a1a1a" stroke-width="2"/>

  <rect x="280" y="295" width="60" height="45" rx="4" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="310" y="322" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Q2 NPN</text>
  <line x1="340" y1="318" x2="380" y2="318" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="380" y1="318" x2="380" y2="330" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Заземлення емітерів -->
  <line x1="310" y1="225" x2="310" y2="280" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="310" y1="340" x2="310" y2="380" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="60" y1="380" x2="310" y2="380" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Вторинна сторона -->
  <rect x="600" y="90" width="320" height="330" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="760" y="115" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Вторинний випрямляч (Вихід 5 В)</text>

  <!-- Вторинна обмотка T1 -->
  <rect x="640" y="210" width="40" height="120" rx="4" fill="white" stroke="#27ae60" stroke-width="2"/>
  <text x="660" y="255" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">W2a</text>
  <text x="660" y="285" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">W2b</text>

  <!-- Діоди випрямляча -->
  <polygon points="710,215 735,225 710,235" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="735" y1="215" x2="735" y2="235" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="680" y1="225" x2="710" y2="225" stroke="#1a1a1a" stroke-width="2"/>

  <polygon points="710,305 735,315 710,325" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="735" y1="305" x2="735" y2="325" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="680" y1="315" x2="710" y2="315" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Об'єднання після діодів на +Vout -->
  <line x1="735" y1="225" x2="765" y2="225" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="735" y1="315" x2="765" y2="315" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="765" y1="225" x2="765" y2="315" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="765" y1="225" x2="880" y2="225" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Конденсатор Cout -->
  <rect x="800" y="250" width="30" height="40" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="815" y="274" font-size="12" fill="#1a1a1a" text-anchor="middle">Cout</text>
  <line x1="815" y1="225" x2="815" y2="250" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="815" y1="290" x2="815" y2="350" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Середня точка вторинної обмотки виведена ліворуч -->
  <line x1="640" y1="270" x2="620" y2="270" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="620" y1="270" x2="620" y2="350" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="620" y1="350" x2="880" y2="350" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Вихідні клеми -->
  <circle cx="880" cy="225" r="4" fill="#27ae60"/>
  <text x="850" y="210" font-size="12" font-weight="bold" fill="#27ae60">+Vout (5V)</text>

  <circle cx="880" cy="350" r="4" fill="#1a1a1a"/>
  <text x="850" y="380" font-size="12" font-weight="bold" fill="#1a1a1a">GNDout (0V)</text>
</svg>
