<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Земляна петля та її розрив гальванічним бар'єром</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Спільна земля створює паразитний струм завад; трансформатор B0505S розриває провідний зв'язок</text>

  <!-- ЛІВА ПАНЕЛЬ: ПРОБЛЕМА -->
  <rect x="30" y="72" width="435" height="364" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="50" y="98" font-size="14" font-weight="bold" fill="#c0392b">1. Проблема: замкнена земляна петля</text>

  <!-- ПК -->
  <rect x="50" y="120" width="130" height="75" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="115" y="150" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Комп'ютер / ПК</text>
  <text x="115" y="172" font-size="12" fill="#6b7280" text-anchor="middle">USB-порт (GND1)</text>

  <!-- Прилад -->
  <rect x="315" y="120" width="130" height="75" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="380" y="150" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Силовий прилад</text>
  <text x="380" y="172" font-size="12" fill="#6b7280" text-anchor="middle">Вимірювач (GND2)</text>

  <!-- Кабель USB між ними -->
  <text x="247" y="132" font-size="12" fill="#2457d6" text-anchor="middle">Сигнали RX / TX</text>
  <line x1="180" y1="140" x2="315" y2="140" stroke="#2457d6" stroke-width="2"/>

  <line x1="180" y1="175" x2="315" y2="175" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="247" y="195" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Спільний провід GND</text>

  <!-- Земляні контури вниз -->
  <line x1="115" y1="195" x2="115" y2="280" stroke="#6b7280" stroke-width="2"/>
  <text x="125" y="245" font-size="12" fill="#6b7280">Захисне заземлення</text>

  <line x1="380" y1="195" x2="380" y2="280" stroke="#6b7280" stroke-width="2"/>
  <text x="260" y="245" font-size="12" fill="#6b7280">Заземлення станка</text>

  <!-- Лінія мережі між заземленнями -->
  <line x1="115" y1="280" x2="380" y2="280" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 4"/>
  <text x="247" y="302" font-size="12" fill="#c0392b" text-anchor="middle">Різниця потенціалів ΔU між точками PE</text>

  <!-- Висновок лівої панелі -->
  <rect x="50" y="335" width="395" height="85" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="65" y="360" font-size="12" font-weight="bold" fill="#c0392b">Наслідок замкненої петлі:</text>
  <text x="65" y="382" font-size="12" fill="#1a1a1a">• Зрівняльний струм тече тонким екраном та землею USB</text>
  <text x="65" y="402" font-size="12" fill="#1a1a1a">• Падіння напруги на GND спотворює дані та палить порт ПК</text>

  <!-- ПРАВА ПАНЕЛЬ: РОЗВ'ЯЗОК -->
  <rect x="495" y="72" width="435" height="364" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="515" y="98" font-size="14" font-weight="bold" fill="#27ae60">2. Розв'язок: гальванічний бар'єр B0505S</text>

  <!-- ПК -->
  <rect x="515" y="120" width="105" height="75" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="567" y="150" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ПК / USB</text>
  <text x="567" y="172" font-size="12" fill="#6b7280" text-anchor="middle">Контур 1 (GND1)</text>

  <!-- Модуль B0505S -->
  <rect x="655" y="110" width="115" height="95" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="712" y="136" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">B0505S-1W</text>
  <text x="712" y="158" font-size="12" fill="#1a1a1a" text-anchor="middle">Трансформатор</text>
  <text x="712" y="186" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Ізоляція 1 кВ</text>

  <!-- Прилад -->
  <rect x="805" y="120" width="105" height="75" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="857" y="150" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вимірювач</text>
  <text x="857" y="172" font-size="12" fill="#6b7280" text-anchor="middle">Контур 2 (GND2)</text>

  <!-- Лінії з'єднання -->
  <line x1="620" y1="145" x2="655" y2="145" stroke="#2457d6" stroke-width="2"/>
  <line x1="620" y1="170" x2="655" y2="170" stroke="#2457d6" stroke-width="2"/>

  <line x1="770" y1="145" x2="805" y2="145" stroke="#27ae60" stroke-width="2"/>
  <line x1="770" y1="170" x2="805" y2="170" stroke="#27ae60" stroke-width="2"/>

  <!-- Земляні контури вниз -->
  <line x1="567" y1="195" x2="567" y2="280" stroke="#6b7280" stroke-width="2"/>
  <text x="577" y="245" font-size="12" fill="#6b7280">Заземлення ПК</text>

  <line x1="857" y1="195" x2="857" y2="280" stroke="#6b7280" stroke-width="2"/>
  <text x="740" y="245" font-size="12" fill="#6b7280">Заземлення плати</text>

  <!-- Розрив між заземленнями -->
  <line x1="567" y1="280" x2="680" y2="280" stroke="#6b7280" stroke-width="2"/>
  <line x1="744" y1="280" x2="857" y2="280" stroke="#6b7280" stroke-width="2"/>
  <line x1="690" y1="270" x2="734" y2="290" stroke="#27ae60" stroke-width="3"/>
  <text x="712" y="312" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Контур розірвано: I_loop = 0</text>

  <!-- Висновок правої панелі -->
  <rect x="515" y="335" width="395" height="85" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="530" y="360" font-size="12" font-weight="bold" fill="#27ae60">Переваги модуля B0505S:</text>
  <text x="530" y="382" font-size="12" fill="#1a1a1a">• Повна відсутність спільного омічного зв'язку між GND1 і GND2</text>
  <text x="530" y="402" font-size="12" fill="#1a1a1a">• Завади інверторів і моторів не потрапляють у цифровий порт</text>
</svg>
