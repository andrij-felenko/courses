<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема зовнішньої фільтрації модуля B0505S-1W</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Вхідна кераміка блокує просідання шини; вихідний П-фільтр та синфазний дросель знижують шум до 10 мВ</text>

  <!-- ГОЛОВНА ПАНЕЛЬ СХЕМИ -->
  <rect x="30" y="72" width="900" height="260" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- ВХІДНІ КЛЕМИ -->
  <text x="50" y="130" font-size="13" font-weight="bold" fill="#2457d6">+5V In</text>
  <text x="50" y="250" font-size="13" font-weight="bold" fill="#6b7280">GND1</text>
  <circle cx="95" cy="125" r="4" fill="#2457d6"/>
  <circle cx="95" cy="245" r="4" fill="#6b7280"/>

  <!-- ВХІДНІ ПРОВІДНИКИ -->
  <line x1="95" y1="125" x2="330" y2="125" stroke="#2457d6" stroke-width="2"/>
  <line x1="95" y1="245" x2="330" y2="245" stroke="#6b7280" stroke-width="2"/>

  <!-- ВХІДНИЙ КОНДЕНСАТОР Cin -->
  <line x1="160" y1="125" x2="160" y2="170" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="160" y1="200" x2="160" y2="245" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="148" y1="170" x2="172" y2="170" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="148" y1="200" x2="172" y2="200" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="180" y="180" font-size="12" font-weight="bold" fill="#1a1a1a">Cin</text>
  <text x="180" y="196" font-size="11" fill="#6b7280">4.7–10 мкФ</text>

  <!-- СИНФАЗНИЙ ДРОСЕЛЬ ВХОДУ L_cm -->
  <rect x="230" y="113" width="45" height="24" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="230" y="233" width="45" height="24" rx="3" fill="#eaf0fd" stroke="#6b7280" stroke-width="1.5"/>
  <text x="252" y="104" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">L_cm (10–47 мкГн)</text>

  <!-- МОДУЛЬ B0505S ПО ЦЕНТРУ -->
  <rect x="330" y="95" width="160" height="180" rx="6" fill="#1a1a1a" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="410" y="125" font-size="14" font-weight="bold" fill="white" text-anchor="middle">B0505S-1W</text>
  <text x="410" y="145" font-size="11" fill="#9ca3af" text-anchor="middle">ISOLATION 1000V</text>

  <!-- Бар'єр всередині модуля -->
  <line x1="410" y1="160" x2="410" y2="260" stroke="#f59f00" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Піни модуля -->
  <text x="345" y="130" font-size="11" fill="#9ca3af">2: +Vin</text>
  <text x="345" y="248" font-size="11" fill="#9ca3af">1: -Vin</text>
  <text x="475" y="130" font-size="11" fill="#9ca3af" text-anchor="end">4: +Vout</text>
  <text x="475" y="248" font-size="11" fill="#9ca3af" text-anchor="end">3: -Vout</text>

  <!-- ВИХІДНІ ЛІНІЇ -->
  <line x1="490" y1="125" x2="840" y2="125" stroke="#27ae60" stroke-width="2"/>
  <line x1="490" y1="245" x2="840" y2="245" stroke="#6b7280" stroke-width="2"/>

  <!-- ВИХІДНИЙ КОНДЕНСАТОР Cout1 -->
  <line x1="530" y1="125" x2="530" y2="170" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="530" y1="200" x2="530" y2="245" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="518" y1="170" x2="542" y2="170" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="518" y1="200" x2="542" y2="200" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="548" y="180" font-size="12" font-weight="bold" fill="#1a1a1a">Cout1</text>
  <text x="548" y="196" font-size="11" fill="#6b7280">10 мкФ</text>

  <!-- ДРОСЕЛЬ L_out (П-ФІЛЬТР) -->
  <rect x="615" y="113" width="45" height="24" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="637" y="104" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">L_out (4.7 мкГн)</text>

  <!-- КОНДЕНСАТОР Cout2 -->
  <line x1="700" y1="125" x2="700" y2="170" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="700" y1="200" x2="700" y2="245" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="688" y1="170" x2="712" y2="170" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="688" y1="200" x2="712" y2="200" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="718" y="180" font-size="12" font-weight="bold" fill="#1a1a1a">Cout2</text>
  <text x="718" y="196" font-size="11" fill="#6b7280">2.2 мкФ</text>

  <!-- БАЛАСТНИЙ РЕЗИСТОР R_dummy -->
  <line x1="785" y1="125" x2="785" y2="165" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="785" y1="205" x2="785" y2="245" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="774" y="165" width="22" height="40" fill="#fff9db" stroke="#f59f00" stroke-width="1.5"/>
  <text x="805" y="180" font-size="11" font-weight="bold" fill="#d97706">R_dummy</text>
  <text x="805" y="196" font-size="11" fill="#6b7280">470 Ом</text>

  <!-- ВИХІДНІ КЛЕМИ -->
  <circle cx="840" cy="125" r="4" fill="#27ae60"/>
  <circle cx="840" cy="245" r="4" fill="#6b7280"/>
  <text x="855" y="130" font-size="13" font-weight="bold" fill="#27ae60">+5V Iso</text>
  <text x="855" y="250" font-size="13" font-weight="bold" fill="#6b7280">GND2</text>

  <!-- НИЖНІ ПОЯСНЮВАЛЬНІ КАРТКИ -->
  <rect x="30" y="345" width="280" height="95" rx="6" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="45" y="370" font-size="12" font-weight="bold" fill="#2457d6">Вхідний каскад фільтрації:</text>
  <text x="45" y="392" font-size="12" fill="#1a1a1a">• Cin (4.7–10 мкФ) поруч із ніжками</text>
  <text x="45" y="412" font-size="12" fill="#1a1a1a">• Гасить пульсації від автогенератора</text>

  <rect x="330" y="345" width="280" height="95" rx="6" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="345" y="370" font-size="12" font-weight="bold" fill="#f59f00">Синфазне придушення:</text>
  <text x="345" y="392" font-size="12" fill="#1a1a1a">• Дросель L_cm блокує синфазні завади</text>
  <text x="345" y="412" font-size="12" fill="#1a1a1a">• Захищає від витоку через C_iso (20 пФ)</text>

  <rect x="630" y="345" width="300" height="95" rx="6" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="645" y="370" font-size="12" font-weight="bold" fill="#27ae60">Вихідний каскад (П-фільтр):</text>
  <text x="645" y="392" font-size="12" fill="#1a1a1a">• Cout1 + L_out + Cout2 зрізають шум</text>
  <text x="645" y="412" font-size="12" fill="#1a1a1a">• R_dummy тримає напругу до 5.2 В</text>
</svg>
