<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Внутрішня структура та цоколівка модуля B0505S-1W</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Автогенератор розгойдує ВЧ-трансформатор; бар'єр 1 кВ надійно розділяє вхідний і вихідний контури</text>

  <!-- ЛІВА ПАНЕЛЬ: ЦОКОЛІВКА КОРПУСУ -->
  <rect x="30" y="72" width="370" height="364" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="50" y="98" font-size="14" font-weight="bold" fill="#1a1a1a">1. Корпус SIP-4 та призначення виводів</text>

  <!-- SIP модуль -->
  <rect x="70" y="125" width="290" height="85" rx="4" fill="#1a1a1a" stroke="#d0d7de" stroke-width="1"/>
  <circle cx="90" cy="145" r="4" fill="#6b7280"/>
  <text x="215" y="155" font-size="14" font-weight="bold" fill="white" text-anchor="middle">B0505S-1W</text>
  <text x="215" y="175" font-size="11" fill="#9ca3af" text-anchor="middle">1W DC-DC CONVERTER (SIP-4)</text>

  <!-- Піни вниз -->
  <rect x="95" y="210" width="10" height="45" fill="#d0d7de" stroke="#6b7280"/>
  <rect x="155" y="210" width="10" height="45" fill="#d0d7de" stroke="#6b7280"/>
  <rect x="255" y="210" width="10" height="45" fill="#d0d7de" stroke="#6b7280"/>
  <rect x="315" y="210" width="10" height="45" fill="#d0d7de" stroke="#6b7280"/>

  <!-- Номери пінів -->
  <text x="100" y="275" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">1</text>
  <text x="100" y="295" font-size="12" fill="#1a1a1a" text-anchor="middle">-Vin (GND)</text>

  <text x="160" y="275" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">2</text>
  <text x="160" y="295" font-size="12" fill="#1a1a1a" text-anchor="middle">+Vin (+5V)</text>

  <text x="260" y="275" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">3</text>
  <text x="260" y="295" font-size="12" fill="#1a1a1a" text-anchor="middle">-Vout (0V)</text>

  <text x="320" y="275" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">4</text>
  <text x="320" y="295" font-size="12" fill="#1a1a1a" text-anchor="middle">+Vout (+5V)</text>

  <!-- Опис зазору -->
  <rect x="50" y="325" width="330" height="95" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="65" y="350" font-size="12" font-weight="bold" fill="#1a1a1a">Особливість цоколівки SIP-4:</text>
  <text x="65" y="372" font-size="12" fill="#6b7280">• Крок між пінами 1-2 та 3-4: 2.54 мм</text>
  <text x="65" y="392" font-size="12" fill="#2457d6">• Зазор між пінами 2 і 3: 5.08 мм (подвійний)</text>
  <text x="65" y="410" font-size="12" fill="#1a1a1a">• Подвійний крок забезпечує бар'єр ізоляції на PCB</text>

  <!-- ПРАВА ПАНЕЛЬ: ФУНКЦІОНАЛЬНА СХЕМА -->
  <rect x="420" y="72" width="510" height="364" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="440" y="98" font-size="14" font-weight="bold" fill="#1a1a1a">2. Функціональна блок-схема всередині модуля</text>

  <!-- Контур 1: Вхід -->
  <rect x="440" y="130" width="130" height="155" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="505" y="155" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Вхідний контур</text>
  <text x="505" y="180" font-size="12" fill="#1a1a1a" text-anchor="middle">Автогенератор</text>
  <text x="505" y="200" font-size="11" fill="#6b7280" text-anchor="middle">(Push-Pull, ~100 кГц)</text>
  <text x="505" y="225" font-size="11" fill="#1a1a1a" text-anchor="middle">Ключові транзистори</text>
  <text x="505" y="245" font-size="11" fill="#6b7280" text-anchor="middle">+ первинна обмотка</text>

  <!-- Вхідні стрілки -->
  <line x1="420" y1="160" x2="440" y2="160" stroke="#2457d6" stroke-width="2"/>
  <line x1="420" y1="240" x2="440" y2="240" stroke="#6b7280" stroke-width="2"/>

  <!-- Гальванічний бар'єр по центру -->
  <rect x="600" y="120" width="60" height="175" rx="4" fill="#fff9db" stroke="#f59f00" stroke-dasharray="4 3"/>
  <text x="630" y="150" font-size="12" font-weight="bold" fill="#f59f00" text-anchor="middle">Бар'єр</text>
  <text x="630" y="170" font-size="11" font-weight="bold" fill="#f59f00" text-anchor="middle">1000 В</text>
  <text x="630" y="205" font-size="11" fill="#1a1a1a" text-anchor="middle">ВЧ тор</text>
  <text x="630" y="235" font-size="11" fill="#6b7280" text-anchor="middle">C_iso</text>
  <text x="630" y="255" font-size="11" fill="#6b7280" text-anchor="middle">~20 пФ</text>

  <!-- Зв'язок через трансформатор -->
  <line x1="570" y1="175" x2="600" y2="175" stroke="#2457d6" stroke-width="2"/>
  <line x1="570" y1="225" x2="600" y2="225" stroke="#2457d6" stroke-width="2"/>
  <line x1="660" y1="175" x2="690" y2="175" stroke="#27ae60" stroke-width="2"/>
  <line x1="660" y1="225" x2="690" y2="225" stroke="#27ae60" stroke-width="2"/>

  <!-- Контур 2: Вихід -->
  <rect x="690" y="130" width="130" height="155" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="755" y="155" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Вихідний контур</text>
  <text x="755" y="180" font-size="12" fill="#1a1a1a" text-anchor="middle">Випрямляч</text>
  <text x="755" y="200" font-size="11" fill="#6b7280" text-anchor="middle">(Діоди Шотткі)</text>
  <text x="755" y="225" font-size="11" fill="#1a1a1a" text-anchor="middle">Вихідний фільтр</text>
  <text x="755" y="245" font-size="11" fill="#6b7280" text-anchor="middle">Керамічні ємності</text>

  <!-- Вихідні стрілки -->
  <line x1="820" y1="160" x2="845" y2="160" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="820" y1="240" x2="845" y2="240" stroke="#6b7280" stroke-width="2"/>
  <text x="855" y="164" font-size="12" font-weight="bold" fill="#27ae60">+5V Out</text>
  <text x="855" y="244" font-size="12" font-weight="bold" fill="#6b7280">0V Out</text>

  <!-- Підпис вхідних пінів праворуч від входу -->
  <text x="430" y="145" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">+5V In</text>
  <text x="430" y="255" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="end">GND In</text>

  <!-- Висновок знизу правої панелі -->
  <rect x="440" y="325" width="470" height="95" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="455" y="350" font-size="12" font-weight="bold" fill="#c0392b">Критична особливість топології:</text>
  <text x="455" y="372" font-size="12" fill="#1a1a1a">• Відсутній оптрон зворотного зв'язку — вихід нестабілізований</text>
  <text x="455" y="392" font-size="12" fill="#1a1a1a">• Вихідна напруга жорстко залежить від навантаження (падіння на діодах і міді)</text>
  <text x="455" y="410" font-size="12" fill="#c0392b">• Без навантаження напруга підстрибує до 6.0–6.5 В (потрібне мін. 10% I_nom)</text>
</svg>
