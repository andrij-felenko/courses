  <rect x="857" y="360" width="32" height="34" rx="3" fill="white" stroke="#c0392b" stroke-width="1"/>
  <text x="858" y="372" font-size="12" font-weight="bold" fill="#c0392b">Voc</text>
  <text x="858" y="387" font-size="12" font-weight="bold" fill="#c0392b">7.2V</text>

  <!-- ==================== BOTTOM SUMMARY BAR ==================== -->
