<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Definitions for Markers -->
  <defs>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-danger" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-success" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Характеристики сонячної панелі 6 В / 2 Вт при різній інсоляції</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Залежність I-V та P-V від інсоляції: зміщення точок MPP, напруги Voc та струму Isc</text>

  <!-- ==================== LEFT PANEL: I-V CURVES ==================== -->
  <rect x="30" y="65" width="435" height="415" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <text x="247.5" y="88" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вольт-амперні криві (I-V)</text>
  <text x="247.5" y="104" font-size="12" fill="#6b7280" text-anchor="middle">Залежність вихідного струму I від напруги V</text>

  <!-- Left Plot Canvas & Grid -->
  <rect x="85" y="140" width="355" height="270" fill="white" stroke="#d0d7de" stroke-width="1"/>

  <text x="85" y="130" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Струм I (mA)</text>

  <!-- Y Grid & Ticks (Current I) -->
  <line x1="85" y1="150" x2="440" y2="150" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="77" y="154" font-size="12" fill="#6b7280" text-anchor="end">400</text>

  <line x1="85" y1="215" x2="440" y2="215" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="77" y="219" font-size="12" fill="#6b7280" text-anchor="end">300</text>

  <line x1="85" y1="280" x2="440" y2="280" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="77" y="284" font-size="12" fill="#6b7280" text-anchor="end">200</text>

  <line x1="85" y1="345" x2="440" y2="345" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="77" y="349" font-size="12" fill="#6b7280" text-anchor="end">100</text>

  <text x="77" y="414" font-size="12" fill="#6b7280" text-anchor="end">0</text>

  <!-- X Grid & Ticks (Voltage V) -->
  <line x1="170" y1="140" x2="170" y2="410" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="170" y="426" font-size="12" fill="#6b7280" text-anchor="middle">2</text>

  <line x1="255" y1="140" x2="255" y2="410" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="255" y="426" font-size="12" fill="#6b7280" text-anchor="middle">4</text>

  <line x1="340" y1="140" x2="340" y2="410" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="340" y="426" font-size="12" fill="#2457d6" font-weight="bold" text-anchor="middle">6 V</text>

  <line x1="391" y1="140" x2="391" y2="410" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="391" y="426" font-size="12" fill="#c0392b" font-weight="bold" text-anchor="middle">7.2 V</text>

  <line x1="425" y1="140" x2="425" y2="410" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="425" y="426" font-size="12" fill="#6b7280" text-anchor="middle">8</text>

  <text x="85" y="426" font-size="12" fill="#6b7280" text-anchor="middle">0</text>

  <text x="262.5" y="448" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Напруга V (V)</text>

  <!-- Left Plot Legend Box -->
  <rect x="93" y="145" width="332" height="24" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <line x1="100" y1="157" x2="115" y2="157" stroke="#2457d6" stroke-width="2.5"/>
  <text x="119" y="161" font-size="12" fill="#1a1a1a">1000 W/m²</text>

  <line x1="186" y1="157" x2="201" y2="157" stroke="#27ae60" stroke-width="2.5"/>
  <text x="205" y="161" font-size="12" fill="#1a1a1a">800 W/m²</text>

  <line x1="266" y1="157" x2="281" y2="157" stroke="#e67e22" stroke-width="2.5"/>
  <text x="285" y="161" font-size="12" fill="#1a1a1a">500 W/m²</text>

  <line x1="346" y1="157" x2="361" y2="157" stroke="#8e44ad" stroke-width="2.5"/>
  <text x="365" y="161" font-size="12" fill="#1a1a1a">200 W/m²</text>

  <!-- I-V Curves -->
  <!-- 1000 W/m² -->
  <path d="M 85,182.5 L 260,182.5 C 310,182.5 330,185 340,193.55 C 360,210 380,310 391,410" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- 800 W/m² -->
  <path d="M 85,228 L 260,228 C 305,228 325,230 335.75,235.8 C 355,250 372,320 382.5,410" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- 500 W/m² -->
  <path d="M 85,296.25 L 250,296.25 C 295,296.25 315,297 327.25,301.45 C 345,315 360,340 369.75,410" fill="none" stroke="#e67e22" stroke-width="2.5"/>

  <!-- 200 W/m² -->
  <path d="M 85,364.5 L 240,364.5 C 280,364.5 300,365 310.25,367.1 C 325,373 340,385 348.5,410" fill="none" stroke="#8e44ad" stroke-width="2.5"/>

