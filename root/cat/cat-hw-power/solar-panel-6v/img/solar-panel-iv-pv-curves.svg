  <path d="M 340,193.55 Q 333,250 310.25,367.1" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- MPP Points (Left Plot) -->
  <circle cx="340" cy="193.55" r="4" fill="#2457d6" stroke="white" stroke-width="1.5"/>
  <circle cx="335.75" cy="235.8" r="4" fill="#27ae60" stroke="white" stroke-width="1.5"/>
  <circle cx="327.25" cy="301.45" r="4" fill="#e67e22" stroke="white" stroke-width="1.5"/>
  <circle cx="310.25" cy="367.1" r="4" fill="#8e44ad" stroke="white" stroke-width="1.5"/>

  <!-- Isc Marker & Callout -->
