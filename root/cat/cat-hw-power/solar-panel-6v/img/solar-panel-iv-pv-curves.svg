  <text x="45" y="533" font-size="12" font-weight="bold" fill="#27ae60">Практичний висновок:</text>
  <text x="186" y="533" font-size="12" fill="#1a1a1a">Для максимальної ефективності та безпечного заряджання акумуляторів потрібен MPPT / DC-DC контролер</text>
