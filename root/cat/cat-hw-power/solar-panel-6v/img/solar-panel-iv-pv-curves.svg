  <rect x="550" y="140" width="355" height="270" fill="white" stroke="#d0d7de" stroke-width="1"/>

  <text x="550" y="130" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Потужність P (W)</text>

  <!-- Y Grid & Ticks (Power P) -->
  <line x1="550" y1="150" x2="905" y2="150" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="542" y="154" font-size="12" fill="#6b7280" text-anchor="end">2.5</text>

  <line x1="550" y1="202" x2="905" y2="202" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="542" y="206" font-size="12" fill="#6b7280" text-anchor="end">2.0</text>

  <line x1="550" y1="254" x2="905" y2="254" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="542" y="258" font-size="12" fill="#6b7280" text-anchor="end">1.5</text>

  <line x1="550" y1="306" x2="905" y2="306" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="542" y="310" font-size="12" fill="#6b7280" text-anchor="end">1.0</text>

  <line x1="550" y1="358" x2="905" y2="358" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="542" y="362" font-size="12" fill="#6b7280" text-anchor="end">0.5</text>

  <text x="542" y="414" font-size="12" fill="#6b7280" text-anchor="end">0.0</text>

  <!-- X Grid & Ticks (Voltage V) -->
  <line x1="635" y1="140" x2="635" y2="410" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="635" y="426" font-size="12" fill="#6b7280" text-anchor="middle">2</text>

  <line x1="720" y1="140" x2="720" y2="410" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="720" y="426" font-size="12" fill="#6b7280" text-anchor="middle">4</text>

  <line x1="805" y1="140" x2="805" y2="410" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="805" y="426" font-size="12" fill="#2457d6" font-weight="bold" text-anchor="middle">6 V</text>

  <line x1="856" y1="140" x2="856" y2="410" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="856" y="426" font-size="12" fill="#c0392b" font-weight="bold" text-anchor="middle">7.2 V</text>

  <line x1="890" y1="140" x2="890" y2="410" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="890" y="426" font-size="12" fill="#6b7280" text-anchor="middle">8</text>

  <text x="550" y="426" font-size="12" fill="#6b7280" text-anchor="middle">0</text>

  <text x="727.5" y="448" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Напруга V (V)</text>

  <!-- Right Plot Legend Box -->
  <rect x="558" y="145" width="332" height="24" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <line x1="565" y1="157" x2="580" y2="157" stroke="#2457d6" stroke-width="2.5"/>
  <text x="584" y="161" font-size="12" fill="#1a1a1a">1000 W/m²</text>

  <line x1="651" y1="157" x2="666" y2="157" stroke="#27ae60" stroke-width="2.5"/>
  <text x="670" y="161" font-size="12" fill="#1a1a1a">800 W/m²</text>

  <line x1="731" y1="157" x2="746" y2="157" stroke="#e67e22" stroke-width="2.5"/>
  <text x="750" y="161" font-size="12" fill="#1a1a1a">500 W/m²</text>

  <line x1="811" y1="157" x2="826" y2="157" stroke="#8e44ad" stroke-width="2.5"/>
  <text x="830" y="161" font-size="12" fill="#1a1a1a">200 W/m²</text>

  <!-- P-V Curves -->
  <!-- 1000 W/m² -->
  <path d="M 550,410 C 635,365 720,290 805,202 C 830,202 848,310 856,410" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- 800 W/m² -->
  <path d="M 550,410 C 635,375 715,315 800.75,245.68 C 823,246 840,330 847.5,410" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- 500 W/m² -->
  <path d="M 550,410 C 630,390 705,350 792.25,311.2 C 813,312 828,360 834.75,410" fill="none" stroke="#e67e22" stroke-width="2.5"/>

  <!-- 200 W/m² -->
  <path d="M 550,410 C 620,402 690,388 775.25,373.6 C 793,374 807,392 813.5,410" fill="none" stroke="#8e44ad" stroke-width="2.5"/>

  <!-- MPP Locus Line (Right Plot) -->
  <path d="M 805,202 Q 798,270 775.25,373.6" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- MPP Points (Right Plot) -->
  <circle cx="805" cy="202" r="4" fill="#2457d6" stroke="white" stroke-width="1.5"/>
  <circle cx="800.75" cy="245.68" r="4" fill="#27ae60" stroke="white" stroke-width="1.5"/>
  <circle cx="792.25" cy="311.2" r="4" fill="#e67e22" stroke="white" stroke-width="1.5"/>
  <circle cx="775.25" cy="373.6" r="4" fill="#8e44ad" stroke="white" stroke-width="1.5"/>

  <!-- Peak Power Pmpp Badge -->
  <rect x="755" y="172" width="100" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="805" y="188" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Pmpp = 2.00 W</text>

  <!-- Fixed 5V Direct Connection Warning Callout -->
  <line x1="762.5" y1="140" x2="762.5" y2="410" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="762.5" cy="237" r="4" fill="#c0392b"/>

  <rect x="568" y="204" width="190" height="48" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="575" y="217" font-size="12" font-weight="bold" fill="#c0392b">Пряме живлення 5V (без MPPT)</text>
  <text x="575" y="231" font-size="12" fill="#c0392b">Втрата потужності ~17%</text>
  <text x="575" y="245" font-size="12" fill="#6b7280">Робоча точка зсунута від MPP</text>
  <line x1="758" y1="228" x2="762" y2="236" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-danger)"/>

