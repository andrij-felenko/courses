  <text x="352" y="196" font-size="12" font-weight="bold" fill="#2457d6">MPP1: 2.0 W</text>
  <text x="352" y="210" font-size="12" fill="#1a1a1a">6.0 V / 333 mA</text>

  <!-- Voc Callout Badge -->
  <circle cx="391" cy="410" r="4" fill="#c0392b"/>
  <rect x="392" y="358" width="32" height="34" rx="3" fill="white" stroke="#c0392b" stroke-width="1"/>
  <text x="393" y="372" font-size="12" font-weight="bold" fill="#c0392b">Voc</text>
  <text x="393" y="387" font-size="12" font-weight="bold" fill="#c0392b">7.2V</text>


  <!-- ==================== RIGHT PANEL: P-V CURVES ==================== -->
  <rect x="495" y="65" width="435" height="415" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <text x="712.5" y="88" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вольт-ватні криві (P-V)</text>
  <text x="712.5" y="104" font-size="12" fill="#6b7280" text-anchor="middle">Залежність вихідної потужності P від напруги V</text>

