<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="960" height="560" fill="white"/>
<defs>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
  </marker>
  <marker id="arr-danger" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
  </marker>
  <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
  </marker>
  <marker id="arr-success" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
  </marker>
</defs>

<!-- Title & Subtitle -->
<text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Порівняння топологій підключення сонячної панелі 6 В / 2 Вт</text>
<text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">MPPT-контролер забезпечує максимальний ККД та безпечне заряджання акумулятора</text>

<!-- Topology 1 -->
<rect x="20" y="75" width="920" height="145" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
<text x="35" y="100" font-size="13" font-weight="700" fill="#1a1a1a">Топологія 1: Пряма (діод Шотткі)</text>
<rect x="35" y="112" width="165" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
<text x="117" y="128" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">НЕ РЕКОМЕНДОВАНО</text>

<rect x="220" y="95" width="130" height="65" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="285" y="122" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Сонячна панель</text>
<text x="285" y="138" font-size="12" fill="#2457d6" text-anchor="middle">6 В / 2 Вт (Vmp=6V)</text>

<line x1="350" y1="127.5" x2="390" y2="127.5" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
<text x="370" y="112" font-size="12" fill="#6b7280" text-anchor="middle">Imp ≈ 0.33A</text>

<rect x="400" y="102" width="105" height="51" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="452.5" y="124" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Діод Шотткі</text>
<text x="452.5" y="140" font-size="12" fill="#6b7280" text-anchor="middle">D1 (блокування)</text>

<line x1="505" y1="127.5" x2="545" y2="127.5" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-danger)"/>
<text x="525" y="112" font-size="12" fill="#c0392b" text-anchor="middle">Vbat ≈ 3.7V</text>

<rect x="555" y="95" width="125" height="65" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="617.5" y="122" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Акумулятор</text>
<text x="617.5" y="138" font-size="12" fill="#6b7280" text-anchor="middle">Li-Ion (3.0–4.2 В)</text>

<rect x="700" y="87" width="225" height="121" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="712" y="105" font-size="12" font-weight="700" fill="#c0392b">Характеристики:</text>
<text x="712" y="125" font-size="12" fill="#1a1a1a">• ККД: 50% – 60% (втрати)</text>
<text x="712" y="145" font-size="12" fill="#1a1a1a">• Просаджує напругу панелі</text>
<text x="712" y="165" font-size="12" fill="#1a1a1a">• Небезпека перезаряджання</text>
<text x="712" y="185" font-size="12" fill="#6b7280">• Без контролю CC/CV</text>

<!-- Topology 2 -->
<rect x="20" y="232" width="920" height="145" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
<text x="35" y="257" font-size="13" font-weight="700" fill="#1a1a1a">Топологія 2: DC-DC + Зарядний IC</text>
<rect x="35" y="269" width="165" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
<text x="117" y="285" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">ОБМЕЖЕНА ЕФЕКТИВНІСТЬ</text>

<rect x="220" y="252" width="115" height="65" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="277.5" y="279" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Сонячна панель</text>
<text x="277.5" y="295" font-size="12" fill="#2457d6" text-anchor="middle">6 В / 2 Вт</text>

<line x1="335" y1="284.5" x2="365" y2="284.5" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
<text x="350" y="269" font-size="12" fill="#6b7280" text-anchor="middle">6V</text>

<rect x="375" y="252" width="105" height="65" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="427.5" y="279" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">DC-DC Buck</text>
<text x="427.5" y="295" font-size="12" fill="#6b7280" text-anchor="middle">6V → 5V фіксов.</text>

<line x1="480" y1="284.5" x2="510" y2="284.5" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
<text x="495" y="269" font-size="12" fill="#6b7280" text-anchor="middle">5V</text>

<rect x="520" y="252" width="100" height="65" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="570" y="279" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Контролер</text>
<text x="570" y="295" font-size="12" fill="#6b7280" text-anchor="middle">Linear (CC/CV)</text>

<line x1="620" y1="284.5" x2="645" y2="284.5" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-success)"/>

<rect x="650" y="252" width="110" height="65" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="705" y="279" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Акумулятор</text>
<text x="705" y="295" font-size="12" fill="#6b7280" text-anchor="middle">Li-Ion / LiFePO4</text>

<rect x="775" y="244" width="150" height="121" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="785" y="262" font-size="12" font-weight="700" fill="#2457d6">Характеристики:</text>
<text x="785" y="282" font-size="12" fill="#1a1a1a">• ККД: 65% – 75%</text>
<text x="785" y="302" font-size="12" fill="#1a1a1a">• Є контроль CC/CV</text>
<text x="785" y="322" font-size="12" fill="#c0392b">• Срив при тіні</text>
<text x="785" y="342" font-size="12" fill="#6b7280">• Без відстеж. MPP</text>

<!-- Topology 3 -->
<rect x="20" y="389" width="920" height="145" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
<text x="35" y="414" font-size="13" font-weight="700" fill="#1a1a1a">Топологія 3: MPPT Контролер</text>
<rect x="35" y="426" width="165" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
<text x="117" y="442" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">ОПТИМАЛЬНИЙ ВИБІР</text>

<rect x="220" y="409" width="130" height="65" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="285" y="436" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Сонячна панель</text>
<text x="285" y="452" font-size="12" fill="#2457d6" text-anchor="middle">6 В / 2 Вт (Vmp=6V)</text>

<line x1="350" y1="441.5" x2="390" y2="441.5" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-success)"/>
<text x="370" y="426" font-size="12" fill="#27ae60" text-anchor="middle">Vp = Vmpp</text>

<rect x="400" y="401" width="130" height="81" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
<text x="465" y="423" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">MPPT Контролер</text>
<text x="465" y="441" font-size="12" fill="#1a1a1a" text-anchor="middle">Динамічне узгодження</text>
<text x="465" y="459" font-size="12" fill="#6b7280" text-anchor="middle">Алгоритм P&amp;O / CC-CV</text>
<text x="465" y="474" font-size="12" fill="#27ae60" text-anchor="middle">Захист від зворот. струму</text>

<line x1="530" y1="441.5" x2="550" y2="441.5" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-success)"/>

<rect x="555" y="409" width="125" height="65" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="617.5" y="436" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Акумулятор + Load</text>
<text x="617.5" y="452" font-size="12" fill="#27ae60" text-anchor="middle">Li-Ion / LiFePO4</text>

<rect x="700" y="401" width="225" height="121" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="712" y="419" font-size="12" font-weight="700" fill="#27ae60">Характеристики:</text>
<text x="712" y="439" font-size="12" fill="#1a1a1a">• ККД: 88% – 95% (макс.)</text>
<text x="712" y="459" font-size="12" fill="#1a1a1a">• Стабільність при тіні</text>
<text x="712" y="479" font-size="12" fill="#1a1a1a">• Повний цикл CC/CV/Top-off</text>
<text x="712" y="499" font-size="12" fill="#27ae60">• Максимальна вироботка</text>
</svg>
