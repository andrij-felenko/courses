<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400">
  <rect width="100%" height="100%" fill="#ffffff" />
  
  <g transform="translate(50, 100)">
    <!-- Solar Panel -->
    <rect x="0" y="50" width="100" height="80" fill="#fff9c4" stroke="#fbc02d" stroke-width="3" rx="5" ry="5"/>
    <text x="50" y="90" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Сонячна</text>
    <text x="50" y="110" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">панель 6В</text>
    
    <!-- Shunt -->
    <rect x="150" y="55" width="60" height="30" fill="#e0e0e0" stroke="#9e9e9e" stroke-width="3" rx="3" ry="3"/>
    <text x="180" y="75" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Шунт</text>
    <text x="180" y="100" font-family="sans-serif" font-size="10" text-anchor="middle">0.1 Ом</text>

    <!-- Charger/Buffer -->
    <rect x="260" y="40" width="110" height="100" fill="#c8e6c9" stroke="#4caf50" stroke-width="3" rx="5" ry="5"/>
    <text x="315" y="80" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Зарядний</text>
    <text x="315" y="100" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">буфер</text>
    
    <!-- Lines from Panel to Shunt to Buffer -->
    <line x1="100" y1="70" x2="150" y2="70" stroke="#333" stroke-width="2"/>
    <line x1="210" y1="70" x2="260" y2="70" stroke="#333" stroke-width="2"/>
    <!-- GND Line -->
    <line x1="100" y1="120" x2="450" y2="120" stroke="#333" stroke-width="2"/>

    <!-- Voltage Divider -->
    <rect x="160" y="150" width="40" height="60" fill="#ffe0b2" stroke="#ff9800" stroke-width="3" rx="3" ry="3"/>
    <text x="180" y="175" font-family="sans-serif" font-size="12" text-anchor="middle">Дільник</text>
    <text x="180" y="195" font-family="sans-serif" font-size="12" text-anchor="middle">напруги</text>
    
    <!-- Connecting Voltage divider to panel + and - -->
    <line x1="180" y1="70" x2="180" y2="150" stroke="#333" stroke-width="2"/>
    <circle cx="180" cy="70" r="4" fill="#333"/>
    
    <line x1="180" y1="210" x2="180" y2="230" stroke="#333" stroke-width="2"/>
    <line x1="180" y1="230" x2="230" y2="230" stroke="#333" stroke-width="2"/>
    <line x1="230" y1="230" x2="230" y2="120" stroke="#333" stroke-width="2"/>
    <circle cx="230" cy="120" r="4" fill="#333"/>
    
    <!-- ESP32 -->
    <rect x="450" y="30" width="140" height="140" fill="#bbdefb" stroke="#2196f3" stroke-width="3" rx="5" ry="5"/>
    <text x="520" y="105" font-family="sans-serif" font-size="18" font-weight="bold" fill="#000" text-anchor="middle">ESP32</text>
    <text x="520" y="125" font-family="sans-serif" font-size="12" fill="#000" text-anchor="middle">(Sleep Node)</text>
    
    <!-- Vout to ESP32 -->
    <line x1="370" y1="70" x2="450" y2="70" stroke="#333" stroke-width="2"/>
    
    <!-- ADC Lines -->
    <!-- Voltage -->
    <line x1="200" y1="180" x2="470" y2="180" stroke="#f44336" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="470" y1="180" x2="470" y2="170" stroke="#f44336" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="350" y="175" font-family="sans-serif" font-size="12" fill="#f44336" text-anchor="middle">ADC (V_panel)</text>
    
    <!-- Current -->
    <line x1="140" y1="55" x2="140" y2="10" stroke="#f44336" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="140" y1="10" x2="480" y2="10" stroke="#f44336" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="480" y1="10" x2="480" y2="30" stroke="#f44336" stroke-width="2" stroke-dasharray="5,5"/>
    
    <line x1="220" y1="55" x2="220" y2="25" stroke="#f44336" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="220" y1="25" x2="500" y2="25" stroke="#f44336" stroke-width="2" stroke-dasharray="5,5"/>
    <line x1="500" y1="25" x2="500" y2="30" stroke="#f44336" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="330" y="20" font-family="sans-serif" font-size="12" fill="#f44336" text-anchor="middle">ADC (I_shunt+, I_shunt-)</text>
    
    <!-- Peripherals / Deep Sleep key -->
    <rect x="630" y="50" width="100" height="80" fill="#e1bee7" stroke="#9c27b0" stroke-width="3" rx="5" ry="5"/>
    <text x="680" y="90" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Периферія</text>
    <text x="680" y="110" font-family="sans-serif" font-size="12" text-anchor="middle">(Датчики)</text>
    
    <!-- Mosfet Key -->
    <rect x="530" y="190" width="50" height="30" fill="#bcaaa4" stroke="#795548" stroke-width="3" rx="2" ry="2"/>
    <text x="555" y="210" font-family="sans-serif" font-size="12" text-anchor="middle">Ключ</text>
    
    <!-- Connect ESP to peripherals via key -->
    <line x1="590" y1="90" x2="630" y2="90" stroke="#333" stroke-width="2"/>
    <text x="610" y="80" font-family="sans-serif" font-size="10" text-anchor="middle">GPIO</text>
    
    <line x1="450" y1="120" x2="630" y2="120" stroke="#333" stroke-width="2"/>
    <circle cx="530" cy="120" r="4" fill="#333"/>
    <line x1="530" y1="120" x2="530" y2="190" stroke="#333" stroke-width="2"/>
    
    <line x1="555" y1="170" x2="555" y2="190" stroke="#f44336" stroke-width="2" stroke-dasharray="5,5"/>
    <text x="585" y="180" font-family="sans-serif" font-size="10" fill="#f44336" text-anchor="middle">Enable</text>
    
  </g>
</svg>
