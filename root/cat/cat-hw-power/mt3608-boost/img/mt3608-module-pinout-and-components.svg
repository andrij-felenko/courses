<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Топологія та компоненти плати підвищувача MT3608</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Розташування силових площадок, дроселя, діода Шотткі, контролера та підлаштовного гвинта</text>

  <!-- Плата модуля (текстоліт) -->
  <rect x="150" y="95" width="660" height="285" rx="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="480" y="365" font-size="12" fill="#2457d6" text-anchor="middle">Габарити друкованої плати: 36 × 17 мм</text>

  <!-- Вхідні контактні площадки IN+, IN- -->
  <rect x="165" y="115" width="55" height="60" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="192" cy="145" r="10" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="192" y="200" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">IN+</text>
  <text x="192" y="218" font-size="12" fill="#6b7280" text-anchor="middle">2–24 В</text>

  <rect x="165" y="295" width="55" height="60" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="192" cy="325" r="10" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="192" y="275" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">IN-</text>
  <text x="192" y="255" font-size="12" fill="#6b7280" text-anchor="middle">GND</text>

  <!-- Вихідні контактні площадки OUT+, OUT- -->
  <rect x="740" y="115" width="55" height="60" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="767" cy="145" r="10" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="767" y="200" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">OUT+</text>
  <text x="767" y="218" font-size="12" fill="#6b7280" text-anchor="middle">до 28 В</text>

  <rect x="740" y="295" width="55" height="60" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="767" cy="325" r="10" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="767" y="275" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">OUT-</text>
  <text x="767" y="255" font-size="12" fill="#6b7280" text-anchor="middle">GND</text>

  <!-- Дросель L1 -->
  <rect x="250" y="130" width="115" height="110" rx="8" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
  <text x="307" y="165" font-size="13" fill="#6b7280" text-anchor="middle">Дросель</text>
  <text x="307" y="190" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">220 (22 мкГн)</text>
  <text x="307" y="215" font-size="12" fill="#2457d6" text-anchor="middle">I_sat ≥ 2 А</text>

  <!-- Вхідний керамічний конденсатор Cin -->
  <rect x="250" y="270" width="45" height="70" rx="4" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="272" y="300" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Cin</text>
  <text x="272" y="320" font-size="12" fill="#6b7280" text-anchor="middle">22 мкФ</text>

  <!-- Діод Шотткі SS34 -->
  <rect x="395" y="130" width="90" height="50" rx="4" fill="#f4f6f8" stroke="#27ae60" stroke-width="2"/>
  <line x1="410" y1="130" x2="410" y2="180" stroke="#27ae60" stroke-width="4"/>
  <text x="450" y="160" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">SS34</text>
  <text x="440" y="205" font-size="12" fill="#6b7280" text-anchor="middle">Діод Шотткі 3 А</text>

  <!-- Мікросхема MT3608 (SOT-23-6) -->
  <rect x="395" y="230" width="90" height="60" rx="4" fill="#f4f6f8" stroke="#2457d6" stroke-width="2"/>
  <text x="440" y="255" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">B628</text>
  <text x="440" y="275" font-size="12" fill="#1a1a1a" text-anchor="middle">(MT3608)</text>
  <text x="440" y="315" font-size="12" fill="#6b7280" text-anchor="middle">ШІМ 1.2 МГц</text>

  <!-- Вихідний конденсатор Cout -->
  <rect x="515" y="270" width="45" height="70" rx="4" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="537" y="300" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Cout</text>
  <text x="537" y="320" font-size="12" fill="#6b7280" text-anchor="middle">22 мкФ</text>

  <!-- Підлаштовний резистор W3296 (Trim Pot) -->
  <rect x="515" y="125" width="195" height="125" rx="6" fill="#2457d6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="612" y="155" font-size="13" font-weight="bold" fill="white" text-anchor="middle">Резистор W3296</text>
  <text x="612" y="178" font-size="12" fill="white" text-anchor="middle">100 кОм (25 обертів)</text>

  <!-- Гвинт підлаштування -->
  <circle cx="680" cy="150" r="14" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="670" y1="150" x2="690" y2="150" stroke="#1a1a1a" stroke-width="2"/>
  <text x="612" y="215" font-size="12" fill="#eaf0fd" text-anchor="middle">Підлаштовний гвинт</text>
  <text x="612" y="235" font-size="12" fill="#eaf0fd" text-anchor="middle">(обертати проти стрілки)</text>
</svg>