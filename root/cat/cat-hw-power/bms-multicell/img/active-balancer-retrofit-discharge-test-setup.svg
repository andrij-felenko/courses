<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Стенд тестування активного балансира під навантаженням</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Активне перекачування заряду до просадженої комірки під час глибокого розряду</text>

  <!-- Блок акумулятора -->
  <rect x="70" y="130" width="160" height="280" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  
  <rect x="80" y="140" width="140" height="65" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="150" y="165" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Комірка 4</text>
  <text x="150" y="185" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">3.60 V</text>

  <rect x="80" y="205" width="140" height="65" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="150" y="228" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Комірка 3</text>
  <text x="150" y="246" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">3.10 V</text>
  <text x="150" y="262" font-size="12" fill="#c0392b" text-anchor="middle">(просадка)</text>

  <rect x="80" y="270" width="140" height="65" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="150" y="295" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Комірка 2</text>
  <text x="150" y="315" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">3.60 V</text>

  <rect x="80" y="335" width="140" height="65" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="150" y="360" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Комірка 1</text>
  <text x="150" y="380" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">3.60 V</text>

  <!-- Балансувальні лінії -->
  <path d="M220,140 L370,140" stroke="#6b7280" stroke-width="1.5"/>
  <path d="M220,205 L370,205" stroke="#6b7280" stroke-width="1.5"/>
  <path d="M220,270 L370,270" stroke="#6b7280" stroke-width="1.5"/>
  <path d="M220,335 L370,335" stroke="#6b7280" stroke-width="1.5"/>
  <path d="M220,400 L370,400" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Вузли на балансувальних лініях -->
  <circle cx="220" cy="140" r="3" fill="#1a1a1a"/>
  <circle cx="220" cy="205" r="3" fill="#1a1a1a"/>
  <circle cx="220" cy="270" r="3" fill="#1a1a1a"/>
  <circle cx="220" cy="335" r="3" fill="#1a1a1a"/>
  <circle cx="220" cy="400" r="3" fill="#1a1a1a"/>

  <!-- Активний балансир -->
  <rect x="370" y="130" width="140" height="280" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="440" y="260" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Активний</text>
  <text x="440" y="280" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">балансир</text>
  
  <text x="380" y="144" font-size="12" fill="#1a1a1a">B+</text>
  <text x="380" y="209" font-size="12" fill="#1a1a1a">B3</text>
  <text x="380" y="274" font-size="12" fill="#1a1a1a">B2</text>
  <text x="380" y="339" font-size="12" fill="#1a1a1a">B1</text>
  <text x="380" y="404" font-size="12" fill="#1a1a1a">B-</text>

  <!-- Стрілки перекачування заряду -->
  <path d="M250,172.5 L330,172.5" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>
  <text x="290" y="165" font-size="12" fill="#2457d6" text-anchor="middle">відбір</text>

  <path d="M330,237.5 L250,237.5" stroke="#27ae60" stroke-width="3" marker-end="url(#arr-green)"/>
  <text x="290" y="230" font-size="12" fill="#27ae60" text-anchor="middle">дозаряд</text>

  <path d="M250,302.5 L330,302.5" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>
  <text x="290" y="295" font-size="12" fill="#2457d6" text-anchor="middle">відбір</text>

  <path d="M250,367.5 L330,367.5" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>
  <text x="290" y="360" font-size="12" fill="#2457d6" text-anchor="middle">відбір</text>

  <!-- Силові лінії (розряд) -->
  <path d="M220,140 L220,110 L800,110 L800,150" stroke="#1a1a1a" stroke-width="3" fill="none"/>
  <path d="M220,400 L220,430 L450,430" stroke="#1a1a1a" stroke-width="3" fill="none"/>
  <path d="M550,430 L800,430 L800,310" stroke="#1a1a1a" stroke-width="3" fill="none"/>

  <!-- Стрілки струму на силових лініях -->
  <path d="M545,104 L557,110 L545,116 Z" fill="#1a1a1a"/>
  <text x="550" y="100" font-size="13" fill="#1a1a1a" text-anchor="middle">Струм розряду</text>

  <path d="M655,424 L643,430 L655,436 Z" fill="#1a1a1a"/>

  <!-- Вимірювальний шунт -->
  <rect x="450" y="415" width="100" height="30" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="500" y="435" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Шунт 50A</text>
  <text x="500" y="465" font-size="13" fill="#6b7280" text-anchor="middle">Контроль струму</text>

  <!-- Електронне навантаження -->
  <rect x="720" y="150" width="160" height="160" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <circle cx="800" cy="150" r="4" fill="#c0392b"/>
  <circle cx="800" cy="310" r="4" fill="#1a1a1a"/>
  
  <text x="800" y="210" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Електронне</text>
  <text x="800" y="230" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">навантаження</text>
  <text x="800" y="260" font-size="13" fill="#c0392b" text-anchor="middle">Глибокий розряд</text>
  
  <!-- Монітор напруг -->
  <rect x="70" y="460" width="160" height="60" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="150" y="485" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Моніторинг напруг</text>
  <text x="150" y="505" font-size="12" fill="#6b7280" text-anchor="middle">окремих комірок</text>

  <path d="M150,410 L150,460" stroke="#6b7280" stroke-width="3" stroke-dasharray="5 5"/>
  <text x="160" y="440" font-size="12" fill="#6b7280">JST-XH</text>

</svg>
