<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>
  
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <text x="480" y="35" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Архітектура багатоклітинної BMS на базі мікросхеми AFE</text>
  <text x="480" y="55" font-size="13" text-anchor="middle" fill="#6b7280">AFE оцифровує напруги кожної комірки, керує балансуванням та забезпечує апаратний захист</text>

  <!-- Power Lines and Components -->
  <polyline points="80,160 80,80 500,80" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  <rect x="500" y="60" width="120" height="40" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="560" y="85" font-size="14" text-anchor="middle" fill="#27ae60">CHG / DSG ключі</text>
  <line x1="620" y1="80" x2="850" y2="80" stroke="#1a1a1a" stroke-width="2"/>
  <text x="860" y="85" font-size="16" font-weight="bold" fill="#1a1a1a">PACK+</text>

  <polyline points="80,440 80,520 390,520" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  <rect x="390" y="510" width="80" height="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="430" y="525" font-size="14" text-anchor="middle" fill="#1a1a1a">R_sense</text>
  <line x1="470" y1="520" x2="850" y2="520" stroke="#1a1a1a" stroke-width="2"/>
  <text x="860" y="525" font-size="16" font-weight="bold" fill="#1a1a1a">PACK-</text>

  <!-- Battery Pack -->
  <text x="60" y="155" text-anchor="end" font-size="14" font-weight="bold" fill="#1a1a1a">B+</text>
  <text x="60" y="445" text-anchor="end" font-size="14" font-weight="bold" fill="#1a1a1a">B-</text>

  <!-- Cell 4 -->
  <line x1="80" y1="160" x2="80" y2="185" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="60" y1="185" x2="100" y2="185" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="70" y1="205" x2="90" y2="205" stroke="#1a1a1a" stroke-width="4"/>
  <line x1="80" y1="205" x2="80" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <text x="45" y="200" text-anchor="end" font-size="14" fill="#1a1a1a">Cell 4</text>

  <!-- Cell 3 -->
  <line x1="80" y1="230" x2="80" y2="255" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="60" y1="255" x2="100" y2="255" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="70" y1="275" x2="90" y2="275" stroke="#1a1a1a" stroke-width="4"/>
  <line x1="80" y1="275" x2="80" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <text x="45" y="270" text-anchor="end" font-size="14" fill="#1a1a1a">Cell 3</text>

  <!-- Cell 2 -->
  <line x1="80" y1="300" x2="80" y2="325" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="60" y1="325" x2="100" y2="325" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="70" y1="345" x2="90" y2="345" stroke="#1a1a1a" stroke-width="4"/>
  <line x1="80" y1="345" x2="80" y2="370" stroke="#1a1a1a" stroke-width="2"/>
  <text x="45" y="340" text-anchor="end" font-size="14" fill="#1a1a1a">Cell 2</text>

  <!-- Cell 1 -->
  <line x1="80" y1="370" x2="80" y2="395" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="60" y1="395" x2="100" y2="395" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="70" y1="415" x2="90" y2="415" stroke="#1a1a1a" stroke-width="4"/>
  <line x1="80" y1="415" x2="80" y2="440" stroke="#1a1a1a" stroke-width="2"/>
  <text x="45" y="410" text-anchor="end" font-size="14" fill="#1a1a1a">Cell 1</text>

  <!-- VC Taps -->
  <circle cx="80" cy="160" r="3" fill="#1a1a1a"/>
  <circle cx="80" cy="230" r="3" fill="#1a1a1a"/>
  <circle cx="80" cy="300" r="3" fill="#1a1a1a"/>
  <circle cx="80" cy="370" r="3" fill="#1a1a1a"/>
  <circle cx="80" cy="440" r="3" fill="#1a1a1a"/>

  <line x1="80" y1="160" x2="270" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="80" y1="230" x2="270" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="80" y1="300" x2="270" y2="300" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="80" y1="370" x2="270" y2="370" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="80" y1="440" x2="270" y2="440" stroke="#1a1a1a" stroke-width="1.5"/>

  <text x="260" y="155" font-size="12" text-anchor="end" fill="#6b7280">VC4</text>
  <text x="260" y="225" font-size="12" text-anchor="end" fill="#6b7280">VC3</text>
  <text x="260" y="295" font-size="12" text-anchor="end" fill="#6b7280">VC2</text>
  <text x="260" y="365" font-size="12" text-anchor="end" fill="#6b7280">VC1</text>
  <text x="260" y="435" font-size="12" text-anchor="end" fill="#6b7280">VC0</text>

  <!-- AFE IC Box -->
  <rect x="270" y="90" width="470" height="380" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="6"/>
  <text x="285" y="115" font-size="14" font-weight="bold" fill="#6b7280">AFE IC</text>

  <!-- VC Lines inside AFE -->
  <line x1="270" y1="160" x2="420" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="270" y1="230" x2="420" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="270" y1="300" x2="420" y2="300" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="270" y1="370" x2="420" y2="370" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="270" y1="440" x2="420" y2="440" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Balancing Box -->
  <rect x="310" y="130" width="80" height="340" fill="none" stroke="#2457d6" stroke-dasharray="4,4" stroke-width="1.5"/>
  <text x="350" y="120" font-size="12" text-anchor="middle" fill="#2457d6">Ключі балансування</text>

  <!-- Switches inside Balancing -->
  <!-- Switch 4 -->
  <circle cx="350" cy="160" r="2.5" fill="#1a1a1a"/>
  <line x1="350" y1="160" x2="350" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="350" cy="180" r="2" fill="#1a1a1a"/>
  <circle cx="350" cy="210" r="2" fill="#1a1a1a"/>
  <line x1="350" y1="210" x2="365" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="350" y1="210" x2="350" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Switch 3 -->
  <circle cx="350" cy="230" r="2.5" fill="#1a1a1a"/>
  <line x1="350" y1="230" x2="350" y2="250" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="350" cy="250" r="2" fill="#1a1a1a"/>
  <circle cx="350" cy="280" r="2" fill="#1a1a1a"/>
  <line x1="350" y1="280" x2="365" y2="250" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="350" y1="280" x2="350" y2="300" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Switch 2 -->
  <circle cx="350" cy="300" r="2.5" fill="#1a1a1a"/>
  <line x1="350" y1="300" x2="350" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="350" cy="320" r="2" fill="#1a1a1a"/>
  <circle cx="350" cy="350" r="2" fill="#1a1a1a"/>
  <line x1="350" y1="350" x2="365" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="350" y1="350" x2="350" y2="370" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Switch 1 -->
  <circle cx="350" cy="370" r="2.5" fill="#1a1a1a"/>
  <line x1="350" y1="370" x2="350" y2="390" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="350" cy="390" r="2" fill="#1a1a1a"/>
  <circle cx="350" cy="420" r="2" fill="#1a1a1a"/>
  <line x1="350" y1="420" x2="365" y2="390" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="350" y1="420" x2="350" y2="440" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="350" cy="440" r="2.5" fill="#1a1a1a"/>

  <!-- MUX -->
  <polygon points="420,140 480,180 480,420 420,460" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="450" y="305" font-size="14" text-anchor="middle" fill="#2457d6">MUX</text>

  <!-- ADC -->
  <rect x="510" y="260" width="60" height="80" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="540" y="305" font-size="14" text-anchor="middle" fill="#27ae60">АЦП</text>

  <!-- Digital Interface -->
  <rect x="610" y="260" width="110" height="80" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="665" y="295" font-size="14" text-anchor="middle" fill="#1a1a1a">Цифровий</text>
  <text x="665" y="315" font-size="14" text-anchor="middle" fill="#1a1a1a">інтерфейс</text>

  <!-- Protection Logic -->
  <rect x="490" y="380" width="130" height="60" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="555" y="405" font-size="14" text-anchor="middle" fill="#c0392b">Логіка захисту</text>
  <text x="555" y="425" font-size="13" text-anchor="middle" fill="#c0392b">(OV, UV, OCD)</text>

  <!-- Gate Drivers -->
  <rect x="490" y="110" width="140" height="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="560" y="130" font-size="14" text-anchor="middle" fill="#2457d6">Керування</text>
  <text x="560" y="150" font-size="14" text-anchor="middle" fill="#2457d6">ключами</text>

  <!-- Internal AFE Connections -->
  <line x1="480" y1="300" x2="501" y2="300" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="570" y1="300" x2="601" y2="300" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="540" y1="340" x2="540" y2="371" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <polyline points="505,380 505,169" stroke="#c0392b" stroke-width="1.5" fill="none" marker-end="url(#arr-red)"/>
  <polyline points="620,410 665,410 665,349" stroke="#1a1a1a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>

  <!-- Gate Drivers to Power FETs -->
  <line x1="540" y1="110" x2="540" y2="109" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="580" y1="110" x2="580" y2="109" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Shunt Sense Lines -->
  <circle cx="370" cy="520" r="3" fill="#1a1a1a"/>
  <polyline points="370,520 370,450 510,450 510,449" stroke="#1a1a1a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="380" y="465" font-size="12" fill="#6b7280">SRP</text>

  <circle cx="490" cy="520" r="3" fill="#1a1a1a"/>
  <polyline points="490,520 490,460 530,460 530,449" stroke="#1a1a1a" stroke-width="1.5" fill="none" marker-end="url(#arr)"/>
  <text x="500" y="475" font-size="12" fill="#6b7280">SRN</text>

  <!-- MCU Box -->
  <rect x="810" y="240" width="120" height="120" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="870" y="290" font-size="14" text-anchor="middle" fill="#1a1a1a">Мікро-</text>
  <text x="870" y="310" font-size="14" text-anchor="middle" fill="#1a1a1a">контролер</text>
  <text x="870" y="330" font-size="14" text-anchor="middle" fill="#1a1a1a">(MCU)</text>

  <!-- Bus AFE to MCU -->
  <line x1="720" y1="280" x2="801" y2="280" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="810" y1="320" x2="729" y2="320" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="765" y="305" font-size="13" text-anchor="middle" fill="#2457d6">I2C / SPI</text>

</svg>
