<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <defs>
    <!-- Arrow Markers -->
    <marker id="arr-dark" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#1a1a1a"/>
    </marker>
    <!-- Shading Gradient for Danger Zones -->
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fdecea" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fdecea" stop-opacity="0.4"/>
    </linearGradient>
  </defs>

  <!-- ================= HEADER ================= -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Дрейф напруг та дисбаланс комірок у 3S Li-ion збірці без BMS</text>
  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Слабша комірка (менша ємність) передчасно досягає аварійних меж перезаряду та глибокого розряду</text>

  <!-- ================= LEFT GRAPH PANEL ================= -->
  <rect x="20" y="65" width="640" height="435" fill="#f4f6f8" stroke="#d0d7de" rx="6" ry="6"/>

  <!-- Danger Zones Backgrounds -->
  <!-- Overcharge Zone (V > 4.25 V) : y=95 to y=135 -->
  <rect x="90" y="95" width="550" height="40" fill="url(#grad-danger)" stroke="#c0392b" stroke-dasharray="3,3" stroke-opacity="0.5"/>
  <text x="100" y="112" font-size="12" font-weight="bold" fill="#c0392b">ЗОНА КРИТИЧНОГО ПЕРЕЗАРЯДУ (U &gt; 4.25 В)</text>

  <!-- Deep Overdischarge Zone (V < 2.80 V) : y=420 to y=465 -->
  <rect x="90" y="420" width="550" height="45" fill="url(#grad-danger)" stroke="#c0392b" stroke-dasharray="3,3" stroke-opacity="0.5"/>
  <text x="100" y="455" font-size="12" font-weight="bold" fill="#c0392b">ЗОНА ГЛИБОКОГО РОЗРЯДУ (U &lt; 2.80 В)</text>

  <!-- Grid Lines & Threshold Voltages -->
  <!-- V_OVP = 4.25 V (y = 135) -->
  <line x1="90" y1="135" x2="640" y2="135" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="82" y="139" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">4.25 В (V_OVP)</text>

  <!-- V_MAX = 4.20 V (y = 155) -->
  <line x1="90" y1="155" x2="640" y2="155" stroke="#95a5a6" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="82" y="159" text-anchor="end" font-size="12" fill="#6b7280">4.20 В (V_MAX)</text>

  <!-- V_NOM = 3.70 V (y = 265) -->
  <line x1="90" y1="265" x2="640" y2="265" stroke="#bdc3c7" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="82" y="269" text-anchor="end" font-size="12" fill="#6b7280">3.70 В (V_NOM)</text>

  <!-- V_MIN = 3.00 V (y = 395) -->
  <line x1="90" y1="395" x2="640" y2="395" stroke="#95a5a6" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="82" y="399" text-anchor="end" font-size="12" fill="#6b7280">3.00 В (V_MIN)</text>

  <!-- V_UVP = 2.80 V (y = 420) -->
  <line x1="90" y1="420" x2="640" y2="420" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="82" y="424" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">2.80 В (V_UVP)</text>

  <!-- Axis Lines -->
  <!-- Y-Axis (Voltage V) -->
  <line x1="90" y1="475" x2="90" y2="90" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>
  <text x="35" y="85" font-size="13" font-weight="bold" fill="#1a1a1a">Напруга U (В)</text>

  <!-- X-Axis (Time t) -->
  <line x1="85" y1="465" x2="645" y2="465" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>
  <text x="640" y="488" text-anchor="end" font-size="13" font-weight="bold" fill="#1a1a1a">Час t</text>

  <!-- Phase Separation Vertical Line (x = 365) -->
  <line x1="365" y1="90" x2="365" y2="465" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Phase Badges -->
  <rect x="170" y="72" width="140" height="20" fill="#eaf0fd" stroke="#2457d6" rx="4" ry="4"/>
  <text x="240" y="86" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">ФАЗА 1: Заряд (I_ch)</text>

  <rect x="440" y="72" width="150" height="20" fill="#eaf0fd" stroke="#2457d6" rx="4" ry="4"/>
  <text x="515" y="86" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">ФАЗА 2: Розряд (I_dis)</text>

  <!-- ================= VOLTAGE CURVES ================= -->

  <!-- CELL 3 (Strongest: C3 = 2200 mAh) - Green line -->
  <path d="M 100 350 Q 230 285 365 195 Q 500 240 630 330" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- CELL 1 (Standard: C1 = 2000 mAh) - Blue line -->
  <path d="M 100 350 Q 230 265 365 166 Q 500 240 630 375" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- CELL 2 (Weakest: C2 = 1800 mAh) - Red line (Thick) -->
  <path d="M 100 350 Q 210 230 315 135 T 365 110 Q 470 200 570 420 T 630 460" fill="none" stroke="#c0392b" stroke-width="3.5"/>

  <!-- Curve Legend Boxes (in Phase 2) -->
  <!-- Cell 2 Legend -->
  <rect x="375" y="125" width="145" height="22" fill="#fdecea" stroke="#c0392b" rx="3" ry="3"/>
  <text x="382" y="140" font-size="11" font-weight="bold" fill="#c0392b">— Комірка 2 (Слабша)</text>

  <!-- Cell 1 Legend -->
  <rect x="375" y="160" width="145" height="22" fill="#eaf0fd" stroke="#2457d6" rx="3" ry="3"/>
  <text x="382" y="175" font-size="11" font-weight="bold" fill="#2457d6">— Комірка 1 (Еталон)</text>

  <!-- Cell 3 Legend -->
  <rect x="375" y="195" width="145" height="22" fill="#e9f7ef" stroke="#27ae60" rx="3" ry="3"/>
  <text x="382" y="210" font-size="11" font-weight="bold" fill="#27ae60">— Комірка 3 (Сильніша)</text>

  <!-- CRITICAL INCIDENT HIGHLIGHTS -->
  <!-- Incident 1: Overcharge crossing at x=315, y=135 -->
  <circle cx="315" cy="135" r="5" fill="#c0392b" stroke="white" stroke-width="1.5"/>
  <line x1="315" y1="135" x2="315" y2="170" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="2,2"/>
  <rect x="175" y="170" width="175" height="44" fill="#fdecea" stroke="#c0392b" rx="4" ry="4"/>
  <text x="182" y="186" font-size="11" font-weight="bold" fill="#c0392b">! Перезаряд комірки 2</text>
  <text x="182" y="204" font-size="11" fill="#1a1a1a">U_sum &lt; 12.6 В (Заряд розд.)</text>

  <!-- Incident 2: Deep discharge crossing at x=570, y=420 -->
  <circle cx="570" cy="420" r="5" fill="#c0392b" stroke="white" stroke-width="1.5"/>
  <line x1="570" y1="365" x2="570" y2="420" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="2,2"/>
  <rect x="460" y="340" width="175" height="44" fill="#fdecea" stroke="#c0392b" rx="4" ry="4"/>
  <text x="467" y="356" font-size="11" font-weight="bold" fill="#c0392b">! Перерозряд комірки 2</text>
  <text x="467" y="374" font-size="11" fill="#1a1a1a">U_sum &gt; 9.0 В (Розряд триває)</text>

  <!-- ================= RIGHT SIDE PANELS ================= -->

  <!-- TOP RIGHT PANEL: Circuit diagram without BMS -->
  <rect x="675" y="65" width="270" height="235" fill="#f4f6f8" stroke="#d0d7de" rx="6" ry="6"/>
  <text x="810" y="85" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Послідовна збірка 3S (БЕЗ BMS)</text>

  <!-- Battery Pack Outline -->
  <rect x="683" y="100" width="140" height="155" fill="white" stroke="#bdc3c7" stroke-width="1.5" rx="4" ry="4"/>

  <!-- Cell 1 Box -->
  <rect x="688" y="108" width="130" height="40" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="3" ry="3"/>
  <text x="693" y="123" font-size="11" font-weight="bold" fill="#2457d6">Комірка 1: 2000 мА·год</text>
  <text x="693" y="138" font-size="11" fill="#6b7280">R_int = 35 мОм</text>

  <!-- Cell 2 Box (Weak) -->
  <rect x="688" y="156" width="130" height="42" fill="#fdecea" stroke="#c0392b" stroke-width="2" rx="3" ry="3"/>
  <text x="693" y="171" font-size="11" font-weight="bold" fill="#c0392b">Комірка 2: 1800 мА·год</text>
  <text x="693" y="188" font-size="11" font-weight="bold" fill="#c0392b">R_int = 55 мОм (СЛАБКА)</text>

  <!-- Cell 3 Box -->
  <rect x="688" y="206" width="130" height="40" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="3" ry="3"/>
  <text x="693" y="221" font-size="11" font-weight="bold" fill="#27ae60">Комірка 3: 2200 мА·год</text>
  <text x="693" y="236" font-size="11" fill="#6b7280">R_int = 30 мОм</text>

  <!-- Connection Wires inside Battery -->
  <line x1="753" y1="100" x2="753" y2="108" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="753" y1="148" x2="753" y2="156" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="753" y1="198" x2="753" y2="206" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="753" y1="246" x2="753" y2="255" stroke="#1a1a1a" stroke-width="2"/>

  <!-- External Lines to Charger -->
  <path d="M 753 100 L 753 95 L 890 95 L 890 130" fill="none" stroke="#2457d6" stroke-width="2"/>
  <path d="M 753 255 L 753 260 L 890 260 L 890 225" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Charger Block -->
  <rect x="845" y="130" width="90" height="95" fill="white" stroke="#2457d6" stroke-width="1.5" rx="4" ry="4"/>
  <text x="890" y="148" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Зарядник /</text>
  <text x="890" y="163" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Навантаж.</text>
  <text x="890" y="183" text-anchor="middle" font-size="11" fill="#1a1a1a">Лише U_sum</text>
  <text x="890" y="199" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">(макс. 12.6В)</text>

  <!-- Bottom Warning Bar in Panel 1 -->
  <rect x="683" y="262" width="252" height="30" fill="#fdecea" stroke="#c0392b" rx="4" ry="4"/>
  <text x="809" y="281" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">! Відсутній індивідуальний контроль</text>

  <!-- BOTTOM RIGHT PANEL: Key Takeaways -->
  <rect x="675" y="310" width="270" height="190" fill="#f4f6f8" stroke="#d0d7de" rx="6" ry="6"/>
  <text x="810" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Фізичні причини дисбалансу</text>

  <!-- Explanation Points -->
  <text x="690" y="355" font-size="11" fill="#1a1a1a">• Струм I єдиний для всіх комірок</text>

  <text x="690" y="380" font-size="11" fill="#1a1a1a">• Швидкість зміни напруги:</text>
  <text x="705" y="398" font-size="11" font-weight="bold" fill="#2457d6">dU/dt = I / C  +  I · dR/dt</text>

  <text x="690" y="425" font-size="11" fill="#1a1a1a">• Слабша комірка C2 дрейфує швидше</text>

  <text x="690" y="450" font-size="11" font-weight="bold" fill="#c0392b">• Без BMS дисбаланс зростає щоциклу</text>
  <text x="705" y="468" font-size="11" font-weight="bold" fill="#c0392b">та нищить слабкий елемент</text>

</svg>