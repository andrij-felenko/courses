    <line x1="690" y1="140" x2="690" y2="180" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="750" y1="140" x2="750" y2="180" stroke="#1a1a1a" stroke-width="2"/>
    
    <text x="570" y="130" font-size="12" text-anchor="middle" fill="#1a1a1a">0V</text>
    <text x="630" y="130" font-size="12" text-anchor="middle" fill="#1a1a1a">3.7V</text>
    <text x="690" y="130" font-size="12" text-anchor="middle" fill="#1a1a1a">7.4V</text>
    <text x="750" y="130" font-size="12" text-anchor="middle" fill="#1a1a1a">11.1V</text>
    <text x="810" y="130" font-size="12" text-anchor="middle" fill="#c0392b">14.8V</text>

    <circle cx="570" cy="180" r="3" fill="#1a1a1a"/>
    <circle cx="630" cy="180" r="3" fill="#1a1a1a"/>
    <circle cx="690" cy="180" r="3" fill="#1a1a1a"/>
    <circle cx="750" cy="180" r="3" fill="#1a1a1a"/>
    <circle cx="810" cy="180" r="3" fill="#c0392b"/>
  </g>

  <rect x="550" y="300" width="340" height="130" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="4"/>
  <text x="720" y="335" font-size="14" font-weight="bold" text-anchor="middle" fill="#27ae60">BMS 4S</text>
  <text x="720" y="360" font-size="13" text-anchor="middle" fill="#6b7280">Роз'єм JST-XH</text>

  <rect x="560" y="285" width="260" height="15" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <circle cx="570" cy="292" r="2" fill="#1a1a1a"/>
  <circle cx="630" cy="292" r="2" fill="#1a1a1a"/>
  <circle cx="690" cy="292" r="2" fill="#1a1a1a"/>
  <circle cx="750" cy="292" r="2" fill="#1a1a1a"/>
  <circle cx="810" cy="292" r="2" fill="#c0392b"/>

  <text x="570" y="320" font-size="12" text-anchor="middle" fill="#1a1a1a">B-</text>
  <text x="630" y="320" font-size="12" text-anchor="middle" fill="#1a1a1a">B1</text>
  <text x="690" y="320" font-size="12" text-anchor="middle" fill="#1a1a1a">B2</text>
  <text x="750" y="320" font-size="12" text-anchor="middle" fill="#1a1a1a">B3</text>
  <text x="810" y="320" font-size="12" text-anchor="middle" fill="#c0392b">B+</text>

  <line x1="570" y1="180" x2="570" y2="285" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="630" y1="180" x2="630" y2="285" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="690" y1="180" x2="690" y2="285" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="750" y1="180" x2="750" y2="285" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="810" y1="180" x2="810" y2="285" stroke="#c0392b" stroke-width="1.5"/>

  <g id="ntc-right">
    <path d="M 860 340 L 880 340 L 880 200" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M 870 340 L 890 340 L 890 200" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <ellipse cx="885" cy="190" rx="6" ry="10" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="900" y="194" font-size="12" text-anchor="start" fill="#1a1a1a">NTC</text>
    <circle cx="860" cy="340" r="2.5" fill="#1a1a1a"/>
    <circle cx="870" cy="340" r="2.5" fill="#1a1a1a"/>
    <text x="865" y="360" font-size="12" text-anchor="middle" fill="#1a1a1a">NTC</text>
  </g>

  <rect x="620" y="415" width="40" height="15" fill="#1a1a1a"/>
  <text x="640" y="410" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">B-</text>

  <rect x="760" y="415" width="60" height="15" fill="#1a1a1a"/>
  <text x="790" y="410" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">P- (C-)</text>

  <path d="M 570 140 L 520 140 L 520 460 L 640 460 L 640 430" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="570" cy="140" r="4" fill="#1a1a1a"/>
  <text x="525" y="135" font-size="12" fill="#6b7280" text-anchor="start">Силовий B-</text>

  <circle cx="810" cy="140" r="4" fill="#c0392b"/>
  <path d="M 810 140 L 940 140 L 940 525 L 895 525 L 895 510" fill="none" stroke="#c0392b" stroke-width="3"/>
  <circle cx="895" cy="510" r="3" fill="#c0392b"/>
  <text x="935" y="135" font-size="12" text-anchor="end" fill="#c0392b">Силовий B+</text>

  <rect x="670" y="480" width="240" height="30" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="790" y="500" font-size="13" text-anchor="middle" fill="#2457d6">Зарядка / Навантаження</text>
  <text x="895" y="500" font-size="14" font-weight="bold" fill="#c0392b">+</text>
  <text x="685" y="500" font-size="14" font-weight="bold" fill="#1a1a1a">-</text>

  <path d="M 790 430 L 790 480" fill="none" stroke="#1a1a1a" stroke-width="3"/>

</svg>
