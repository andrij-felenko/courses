  <text x="260" y="500" font-size="14" font-weight="bold" fill="#1a1a1a">-</text>
  
  <path d="M 190 430 L 190 480" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <path d="M 300 430 L 300 480" fill="none" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Right: Спільний порт -->
  <text x="720" y="100" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Спільний порт (Common Port)</text>

  <g id="cells-right">
    <rect x="570" y="140" width="60" height="40" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
    <text x="600" y="165" font-size="14" text-anchor="middle" fill="#1a1a1a">Cell 1</text>
    <rect x="630" y="140" width="60" height="40" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
