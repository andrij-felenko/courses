  <line x1="210" y1="180" x2="210" y2="285" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="270" y1="180" x2="270" y2="285" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="330" y1="180" x2="330" y2="285" stroke="#c0392b" stroke-width="1.5"/>

  <g id="ntc-left">
    <path d="M 380 340 L 400 340 L 400 200" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M 390 340 L 410 340 L 410 200" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
    <ellipse cx="405" cy="190" rx="6" ry="10" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="420" y="194" font-size="12" text-anchor="start" fill="#1a1a1a">NTC</text>
    <circle cx="380" cy="340" r="2.5" fill="#1a1a1a"/>
    <circle cx="390" cy="340" r="2.5" fill="#1a1a1a"/>
    <text x="385" y="360" font-size="12" text-anchor="middle" fill="#1a1a1a">NTC</text>
  </g>

  <rect x="80" y="415" width="40" height="15" fill="#1a1a1a"/>
  <text x="100" y="410" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">B-</text>
  
  <rect x="170" y="415" width="40" height="15" fill="#1a1a1a"/>
  <text x="190" y="410" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">C-</text>

  <rect x="280" y="415" width="40" height="15" fill="#1a1a1a"/>
  <text x="300" y="410" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">P-</text>

  <path d="M 90 140 L 40 140 L 40 460 L 100 460 L 100 430" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="90" cy="140" r="4" fill="#1a1a1a"/>
  <text x="45" y="135" font-size="12" fill="#6b7280" text-anchor="start">Силовий B-</text>

  <circle cx="330" cy="140" r="4" fill="#c0392b"/>
  <path d="M 330 140 L 450 140 L 450 525 L 222 525 L 222 510" fill="none" stroke="#c0392b" stroke-width="3"/>
  <path d="M 340 525 L 340 510" fill="none" stroke="#c0392b" stroke-width="3"/>
  <circle cx="222" cy="510" r="3" fill="#c0392b"/>
  <circle cx="340" cy="510" r="3" fill="#c0392b"/>
  <circle cx="340" cy="525" r="3" fill="#c0392b"/>
  <text x="445" y="135" font-size="12" text-anchor="end" fill="#c0392b">Силовий B+</text>

  <rect x="150" y="480" width="80" height="30" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="190" y="500" font-size="13" text-anchor="middle" fill="#27ae60">Зарядка</text>
  <text x="222" y="500" font-size="14" font-weight="bold" fill="#c0392b">+</text>
  <text x="160" y="500" font-size="14" font-weight="bold" fill="#1a1a1a">-</text>
  
