<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>
  
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <text x="480" y="35" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Схема підключення 4S BMS (Окремий та Спільний порти)</text>
  <text x="480" y="60" font-size="13" text-anchor="middle" fill="#6b7280">Розпінування балансувального роз'єму JST-XH, клеми та NTC-термістор</text>

  <!-- Left: Окремий порт -->
  <text x="240" y="100" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Окремий порт (Separate Port)</text>

  <g id="cells-left">
    <rect x="90" y="140" width="60" height="40" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
    <text x="120" y="165" font-size="14" text-anchor="middle" fill="#1a1a1a">Cell 1</text>
    <rect x="150" y="140" width="60" height="40" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
    <text x="180" y="165" font-size="14" text-anchor="middle" fill="#1a1a1a">Cell 2</text>
    <rect x="210" y="140" width="60" height="40" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
    <text x="240" y="165" font-size="14" text-anchor="middle" fill="#1a1a1a">Cell 3</text>
    <rect x="270" y="140" width="60" height="40" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
    <text x="300" y="165" font-size="14" text-anchor="middle" fill="#1a1a1a">Cell 4</text>
    
    <line x1="150" y1="140" x2="150" y2="180" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="210" y1="140" x2="210" y2="180" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="270" y1="140" x2="270" y2="180" stroke="#1a1a1a" stroke-width="2"/>
    
    <text x="90" y="130" font-size="12" text-anchor="middle" fill="#1a1a1a">0V</text>
    <text x="150" y="130" font-size="12" text-anchor="middle" fill="#1a1a1a">3.7V</text>
    <text x="210" y="130" font-size="12" text-anchor="middle" fill="#1a1a1a">7.4V</text>
    <text x="270" y="130" font-size="12" text-anchor="middle" fill="#1a1a1a">11.1V</text>
    <text x="330" y="130" font-size="12" text-anchor="middle" fill="#c0392b">14.8V</text>
    
    <circle cx="90" cy="180" r="3" fill="#1a1a1a"/>
    <circle cx="150" cy="180" r="3" fill="#1a1a1a"/>
    <circle cx="210" cy="180" r="3" fill="#1a1a1a"/>
    <circle cx="270" cy="180" r="3" fill="#1a1a1a"/>
    <circle cx="330" cy="180" r="3" fill="#c0392b"/>
  </g>

  <rect x="70" y="300" width="340" height="130" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="4"/>
  <text x="240" y="335" font-size="14" font-weight="bold" text-anchor="middle" fill="#2457d6">BMS 4S</text>
  <text x="240" y="360" font-size="13" text-anchor="middle" fill="#6b7280">Роз'єм JST-XH</text>

  <rect x="80" y="285" width="260" height="15" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <circle cx="90" cy="292" r="2" fill="#1a1a1a"/>
  <circle cx="150" cy="292" r="2" fill="#1a1a1a"/>
  <circle cx="210" cy="292" r="2" fill="#1a1a1a"/>
  <circle cx="270" cy="292" r="2" fill="#1a1a1a"/>
  <circle cx="330" cy="292" r="2" fill="#c0392b"/>
  
  <text x="90" y="320" font-size="12" text-anchor="middle" fill="#1a1a1a">B-</text>
  <text x="150" y="320" font-size="12" text-anchor="middle" fill="#1a1a1a">B1</text>
  <text x="210" y="320" font-size="12" text-anchor="middle" fill="#1a1a1a">B2</text>
  <text x="270" y="320" font-size="12" text-anchor="middle" fill="#1a1a1a">B3</text>
  <text x="330" y="320" font-size="12" text-anchor="middle" fill="#c0392b">B+</text>

  <line x1="90" y1="180" x2="90" y2="285" stroke="#1a1a1a" stroke-width="1.5"/>
