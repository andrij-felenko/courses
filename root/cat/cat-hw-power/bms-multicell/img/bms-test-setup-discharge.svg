<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <text x="480" y="40" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Схема тестування батарейного блоку 4S із BMS</text>
  <text x="480" y="60" font-size="13" text-anchor="middle" fill="#6b7280">Верифікація струмового захисту та вимірювання напруг на комірках під навантаженням</text>

  <!-- Digital Voltmeter -->
  <rect x="440" y="120" width="80" height="40" fill="#1a1a1a" rx="4"/>
  <text x="480" y="145" font-size="16" font-family="monospace" fill="#c0392b" text-anchor="middle">13.2 V</text>
  <text x="480" y="115" font-size="12" fill="#6b7280" text-anchor="middle">Індикатор напруги</text>
  <line x1="450" y1="100" x2="450" y2="120" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="510" y1="160" x2="510" y2="295" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4,4"/>
  
  <!-- Inter-cell links -->
  <line x1="170" y1="200" x2="170" y2="230" stroke="#6b7280" stroke-width="6"/>
  <line x1="170" y1="280" x2="170" y2="310" stroke="#6b7280" stroke-width="6"/>
  <line x1="170" y1="360" x2="170" y2="390" stroke="#6b7280" stroke-width="6"/>

  <!-- Cells -->
  <!-- Cell 4 -->
  <rect x="120" y="150" width="100" height="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="4"/>
  <text x="170" y="170" font-size="14" text-anchor="middle" fill="#1a1a1a">Комірка 4</text>
  <text x="170" y="188" font-size="12" text-anchor="middle" fill="#6b7280">3.2 В</text>
  <text x="130" y="165" font-size="14" font-weight="bold" fill="#c0392b">+</text>
  <text x="130" y="195" font-size="14" font-weight="bold" fill="#1a1a1a">-</text>

  <!-- Cell 3 -->
  <rect x="120" y="230" width="100" height="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="4"/>
  <text x="170" y="250" font-size="14" text-anchor="middle" fill="#1a1a1a">Комірка 3</text>
  <text x="170" y="268" font-size="12" text-anchor="middle" fill="#6b7280">3.2 В</text>
  <text x="130" y="245" font-size="14" font-weight="bold" fill="#c0392b">+</text>
  <text x="130" y="275" font-size="14" font-weight="bold" fill="#1a1a1a">-</text>

  <!-- Cell 2 -->
  <rect x="120" y="310" width="100" height="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="4"/>
  <text x="170" y="330" font-size="14" text-anchor="middle" fill="#1a1a1a">Комірка 2</text>
  <text x="170" y="348" font-size="12" text-anchor="middle" fill="#6b7280">3.2 В</text>
  <text x="130" y="325" font-size="14" font-weight="bold" fill="#c0392b">+</text>
  <text x="130" y="355" font-size="14" font-weight="bold" fill="#1a1a1a">-</text>

  <!-- Cell 1 -->
  <rect x="120" y="390" width="100" height="50" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="4"/>
  <text x="170" y="410" font-size="14" text-anchor="middle" fill="#1a1a1a">Комірка 1</text>
  <text x="170" y="428" font-size="12" text-anchor="middle" fill="#6b7280">3.2 В</text>
  <text x="130" y="405" font-size="14" font-weight="bold" fill="#c0392b">+</text>
  <text x="130" y="435" font-size="14" font-weight="bold" fill="#1a1a1a">-</text>

  <!-- Cell Terminals Dots -->
  <circle cx="170" cy="150" r="4" fill="#c0392b"/>
  <circle cx="170" cy="200" r="4" fill="#1a1a1a"/>
  <circle cx="170" cy="230" r="4" fill="#c0392b"/>
  <circle cx="170" cy="280" r="4" fill="#1a1a1a"/>
  <circle cx="170" cy="310" r="4" fill="#c0392b"/>
  <circle cx="170" cy="360" r="4" fill="#1a1a1a"/>
  <circle cx="170" cy="390" r="4" fill="#c0392b"/>
  <circle cx="170" cy="440" r="4" fill="#1a1a1a"/>

  <!-- Balancing Wires -->
  <line x1="170" y1="150" x2="322" y2="150" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="170" cy="215" r="4" fill="#2457d6"/>
  <line x1="170" y1="215" x2="322" y2="215" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="170" cy="295" r="4" fill="#2457d6"/>
  <line x1="170" y1="295" x2="322" y2="295" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="170" cy="375" r="4" fill="#2457d6"/>
  <line x1="170" y1="375" x2="322" y2="375" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Main B- -->
  <polyline points="170,440 170,450 322,450" fill="none" stroke="#1a1a1a" stroke-width="4"/>
  <text x="240" y="440" font-size="12" text-anchor="middle" fill="#6b7280">Силовий B-</text>

  <!-- BMS Board -->
  <rect x="320" y="140" width="160" height="340" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="4"/>
  <text x="400" y="170" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">BMS 4S 40A</text>
  <text x="400" y="190" font-size="13" text-anchor="middle" fill="#6b7280">Пасивне балансування</text>
  <text x="435" y="225" font-size="12" text-anchor="middle" fill="#2457d6">Пасивні</text>
  <text x="435" y="240" font-size="12" text-anchor="middle" fill="#2457d6">балансири</text>

  <!-- BMS Pads -->
  <rect x="322" y="145" width="10" height="10" fill="#d0d7de"/>
  <text x="336" y="155" font-size="12" fill="#1a1a1a">B4 (12.8V)</text>
  
  <rect x="322" y="210" width="10" height="10" fill="#d0d7de"/>
  <text x="336" y="220" font-size="12" fill="#1a1a1a">B3 (9.6V)</text>
  
  <rect x="322" y="290" width="10" height="10" fill="#d0d7de"/>
  <text x="336" y="300" font-size="12" fill="#1a1a1a">B2 (6.4V)</text>
  
  <rect x="322" y="370" width="10" height="10" fill="#d0d7de"/>
  <text x="336" y="380" font-size="12" fill="#1a1a1a">B1 (3.2V)</text>
  
  <rect x="322" y="445" width="10" height="10" fill="#d0d7de"/>
  <text x="336" y="468" font-size="12" fill="#1a1a1a">B- (0V)</text>

  <rect x="468" y="290" width="10" height="10" fill="#d0d7de"/>
  <text x="464" y="300" font-size="14" text-anchor="end" fill="#1a1a1a">P-</text>

  <!-- Resistors Inside BMS -->
  <path d="M 336,165 L 340,165 L 342,160 L 346,170 L 350,160 L 354,170 L 356,165 L 364,165" fill="none" stroke="#2457d6" stroke-width="1.2"/>
  <path d="M 336,230 L 340,230 L 342,225 L 346,235 L 350,225 L 354,235 L 356,230 L 364,230" fill="none" stroke="#2457d6" stroke-width="1.2"/>
  <path d="M 336,310 L 340,310 L 342,305 L 346,315 L 350,305 L 354,315 L 356,310 L 364,310" fill="none" stroke="#2457d6" stroke-width="1.2"/>
  <path d="M 336,390 L 340,390 L 342,385 L 346,395 L 350,385 L 354,395 L 356,390 L 364,390" fill="none" stroke="#2457d6" stroke-width="1.2"/>

  <!-- NTC Sensor -->
  <polyline points="195,325 195,260 320,260" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
  <polyline points="205,325 205,270 320,270" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
  <rect x="190" y="325" width="20" height="10" fill="#1a1a1a" rx="2"/>
  <text x="235" y="330" font-size="12" fill="#6b7280">NTC</text>
  <text x="332" y="269" font-size="12" fill="#1a1a1a">NTC</text>

  <!-- MOSFET Switch -->
  <polyline points="322,450 400,450 400,295" fill="none" stroke="#1a1a1a" stroke-width="4"/>
  <line x1="400" y1="295" x2="420" y2="295" stroke="#1a1a1a" stroke-width="4"/>
  <line x1="450" y1="295" x2="468" y2="295" stroke="#1a1a1a" stroke-width="4"/>
  <circle cx="420" cy="295" r="3" fill="#1a1a1a"/>
  <circle cx="450" cy="295" r="3" fill="#1a1a1a"/>
  <line x1="420" y1="295" x2="445" y2="280" stroke="#1a1a1a" stroke-width="2"/>
  <text x="435" y="270" font-size="12" text-anchor="middle" fill="#c0392b">Ключі (MOSFET)</text>

  <!-- Main P+ -->
  <polyline points="170,150 170,100 250,100" fill="none" stroke="#c0392b" stroke-width="4"/>
  <rect x="250" y="90" width="60" height="20" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="250" y1="100" x2="310" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="280" y="85" font-size="12" text-anchor="middle" fill="#1a1a1a">Силовий запобіжник</text>
  
  <polyline points="310,100 580,100 580,340 720,340" fill="none" stroke="#c0392b" stroke-width="4"/>
  <text x="400" y="92" font-size="12" text-anchor="middle" fill="#6b7280">Силовий P+ (B+)</text>
  <line x1="580" y1="160" x2="632" y2="160" stroke="#c0392b" stroke-width="4"/>
  <circle cx="580" cy="160" r="4" fill="#c0392b"/>
  
  <!-- Indicator Dots -->
  <circle cx="450" cy="100" r="4" fill="#c0392b"/>
  <circle cx="510" cy="295" r="4" fill="#1a1a1a"/>

  <!-- Main P- -->
  <line x1="478" y1="295" x2="600" y2="295" stroke="#1a1a1a" stroke-width="4"/>
  <text x="540" y="285" font-size="12" text-anchor="middle" fill="#6b7280">Силовий P-</text>
  <circle cx="600" cy="295" r="4" fill="#1a1a1a"/>
  <line x1="600" y1="295" x2="600" y2="220" stroke="#1a1a1a" stroke-width="4"/>
  <line x1="600" y1="220" x2="720" y2="220" stroke="#1a1a1a" stroke-width="4"/>
  <line x1="600" y1="295" x2="600" y2="400" stroke="#1a1a1a" stroke-width="4"/>
  <line x1="600" y1="400" x2="720" y2="400" stroke="#1a1a1a" stroke-width="4"/>

  <!-- Ammeter -->
  <circle cx="650" cy="160" r="18" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="650" y="165" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">A</text>
  <line x1="668" y1="160" x2="720" y2="160" stroke="#c0392b" stroke-width="4"/>

  <!-- Electronic Load -->
  <rect x="720" y="140" width="180" height="100" fill="#fdecea" stroke="#c0392b" stroke-width="2" rx="4"/>
  <text x="810" y="170" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Електронне</text>
  <text x="810" y="188" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">навантаження</text>
  <text x="810" y="210" font-size="12" text-anchor="middle" fill="#c0392b">Тест струмового захисту</text>
  <text x="810" y="225" font-size="12" text-anchor="middle" fill="#c0392b">Iрозр &gt; 40 А</text>
  <text x="730" y="165" font-size="14" font-weight="bold" fill="#c0392b">+</text>
  <text x="730" y="225" font-size="14" font-weight="bold" fill="#1a1a1a">-</text>

  <!-- Charger -->
  <rect x="720" y="320" width="180" height="100" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="4"/>
  <text x="810" y="350" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Зарядний пристрій</text>
  <text x="810" y="370" font-size="13" text-anchor="middle" fill="#6b7280">Активація BMS та заряд</text>
  <text x="810" y="390" font-size="12" text-anchor="middle" fill="#27ae60">14.6 В, 5 А</text>
  <text x="730" y="345" font-size="14" font-weight="bold" fill="#c0392b">+</text>
  <text x="730" y="405" font-size="14" font-weight="bold" fill="#1a1a1a">-</text>

  <!-- Voltmeters V1-V4 -->
  <polyline points="70,159 70,150 120,150" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <polyline points="70,191 70,200 120,200" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="70" cy="175" r="16" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="70" y="180" font-size="12" text-anchor="middle" fill="#1a1a1a">V4</text>

  <polyline points="70,239 70,230 120,230" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <polyline points="70,271 70,280 120,280" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="70" cy="255" r="16" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="70" y="260" font-size="12" text-anchor="middle" fill="#1a1a1a">V3</text>

  <polyline points="70,319 70,310 120,310" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <polyline points="70,351 70,360 120,360" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="70" cy="335" r="16" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="70" y="340" font-size="12" text-anchor="middle" fill="#1a1a1a">V2</text>

  <polyline points="70,399 70,390 120,390" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <polyline points="70,431 70,440 120,440" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="70" cy="415" r="16" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="70" y="420" font-size="12" text-anchor="middle" fill="#1a1a1a">V1</text>

</svg>
