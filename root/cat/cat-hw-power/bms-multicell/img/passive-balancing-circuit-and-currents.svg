<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <text x="480" y="35" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Пасивне балансування: еквівалентна схема та струми</text>
  <text x="480" y="55" font-size="13" fill="#6b7280" text-anchor="middle">Надлишковий заряд ΔQ розсіюється у вигляді тепла на шунтуючому резисторі R_bal</text>

  <!-- Left Half: Circuit -->
  <!-- Main flow -->
  <path d="M150,70 L150,130" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="160" y="105" font-size="14" fill="#1a1a1a" text-anchor="start">I_charge</text>

  <path d="M150,370 L150,430" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="160" y="405" font-size="14" fill="#1a1a1a" text-anchor="start">I_charge</text>

  <!-- Battery Branch -->
  <line x1="150" y1="150" x2="150" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="120" y1="240" x2="180" y2="240" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="135" y1="255" x2="165" y2="255" stroke="#1a1a1a" stroke-width="4"/>
  <line x1="150" y1="255" x2="150" y2="350" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="110" y="252" font-size="14" fill="#1a1a1a" text-anchor="end">U_cell</text>

  <path d="M120,180 L120,220" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="110" y="205" font-size="14" fill="#1a1a1a" text-anchor="end">I_cell</text>

  <!-- Shunt Branch -->
  <polyline points="150,150 350,150 350,170" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="340" y="170" width="20" height="60" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="370" y="205" font-size="14" fill="#1a1a1a" text-anchor="start">R_bal</text>
  
  <line x1="350" y1="230" x2="350" y2="270" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="350" cy="270" r="2.5" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="350" cy="320" r="2.5" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="350" y1="270" x2="330" y2="310" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="320" y="295" font-size="14" fill="#1a1a1a" text-anchor="end">MOSFET</text>
  
  <polyline points="350,320 350,350 150,350" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

  <path d="M315,180 L315,220" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="305" y="205" font-size="14" fill="#2457d6" text-anchor="end">I_bal</text>

  <!-- Nodes -->
  <circle cx="150" cy="150" r="3.5" fill="#1a1a1a"/>
  <circle cx="150" cy="350" r="3.5" fill="#1a1a1a"/>

  <!-- BMS IC -->
  <rect x="220" y="230" width="60" height="35" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="250" y="247" font-size="12" fill="#1a1a1a" text-anchor="middle">BMS IC</text>
  <text x="250" y="260" font-size="12" fill="#6b7280" text-anchor="middle">Comp.</text>

  <line x1="150" y1="240" x2="220" y2="240" stroke="#1a1a1a" stroke-width="1"/>
  <circle cx="150" cy="240" r="2" fill="#1a1a1a"/>
  <line x1="150" y1="255" x2="220" y2="255" stroke="#1a1a1a" stroke-width="1"/>
  <circle cx="150" cy="255" r="2" fill="#1a1a1a"/>

  <path d="M280,247 L295,247 L295,295 L320,295" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-blue)"/>
  <text x="315" y="290" font-size="12" fill="#2457d6" text-anchor="end">ON</text>

  <!-- Formulas Box -->
  <rect x="250" y="370" width="220" height="55" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="260" y="392" font-size="14" fill="#1a1a1a">I_bal = U_cell / R_bal</text>
  <text x="260" y="412" font-size="14" fill="#1a1a1a">P_heat = I_bal² × R_bal</text>

  <!-- Right Half: Time Diagram -->
  <!-- Heat Warning Box -->
  <rect x="640" y="80" width="280" height="60" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="655" y="105" font-size="13" font-weight="bold" fill="#c0392b">Локальний нагрів плати BMS!</text>
  <text x="655" y="125" font-size="13" fill="#c0392b">Теплова потужність: P = I_bal² × R_bal</text>

  <!-- Axes -->
  <path d="M550,350 L900,350" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M550,350 L550,100" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="890" y="375" font-size="14" fill="#1a1a1a" text-anchor="end">Час (t)</text>
  <text x="560" y="110" font-size="14" fill="#1a1a1a" text-anchor="start">Струм I_bal</text>

  <!-- Graph elements -->
  <line x1="550" y1="150" x2="600" y2="150" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="540" y="154" font-size="14" fill="#1a1a1a" text-anchor="end">I_max = U_th / R_bal</text>

  <!-- Curve and Area -->
  <path d="M600,350 L600,150 Q700,220 820,260 L820,350 Z" fill="#eaf0fd"/>
  <path d="M550,350 L600,350 L600,150 Q700,220 820,260 L820,350 L880,350" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Annotations -->
  <line x1="600" y1="150" x2="600" y2="350" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="600" y="375" font-size="12" fill="#1a1a1a" text-anchor="middle">Вмикання</text>
  <text x="600" y="390" font-size="12" fill="#6b7280" text-anchor="middle">(U_cell = U_th)</text>

  <line x1="820" y1="260" x2="820" y2="350" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="820" y="375" font-size="12" fill="#1a1a1a" text-anchor="middle">Вимкнення</text>
  <text x="820" y="390" font-size="12" fill="#6b7280" text-anchor="middle">(U_cell &lt; U_th)</text>

  <text x="690" y="270" font-size="16" font-weight="bold" fill="#2457d6" text-anchor="middle">ΔQ</text>
  <text x="690" y="290" font-size="13" fill="#2457d6" text-anchor="middle">скинутий заряд</text>

  <line x1="600" y1="410" x2="600" y2="420" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="820" y1="410" x2="820" y2="420" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="600" y1="415" x2="820" y2="415" stroke="#1a1a1a" stroke-width="1"/>
  <text x="710" y="410" font-size="13" fill="#1a1a1a" text-anchor="middle">Час балансування (Δt)</text>
</svg>
