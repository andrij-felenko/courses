<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="360" fill="white"/>

  <text x="480" y="40" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Структура UART-кадру Smart BMS</text>
  <text x="480" y="60" font-size="13" text-anchor="middle" fill="#6b7280">Послідовність полів та їх розміри для обміну даними</text>

  <rect x="80" y="160" width="80" height="60" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="120" y="195" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Start</text>

  <rect x="160" y="160" width="80" height="60" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="200" y="195" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Addr</text>

  <rect x="240" y="160" width="80" height="60" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="280" y="195" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Cmd</text>

  <rect x="320" y="160" width="80" height="60" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="360" y="195" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Len</text>

  <rect x="400" y="160" width="360" height="60" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="580" y="195" font-size="14" font-weight="bold" text-anchor="middle" fill="#2457d6">Payload</text>

  <rect x="760" y="160" width="120" height="60" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="820" y="195" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">CRC16</text>

  <text x="120" y="115" font-size="13" text-anchor="middle" fill="#1a1a1a">Стартовий</text>
  <text x="120" y="132" font-size="13" text-anchor="middle" fill="#1a1a1a">байт</text>
  <line x1="120" y1="138" x2="120" y2="160" stroke="#d0d7de" stroke-width="2"/>

  <text x="200" y="132" font-size="13" text-anchor="middle" fill="#1a1a1a">Адреса</text>
  <line x1="200" y1="138" x2="200" y2="160" stroke="#d0d7de" stroke-width="2"/>

  <text x="280" y="132" font-size="13" text-anchor="middle" fill="#1a1a1a">Команда</text>
  <line x1="280" y1="138" x2="280" y2="160" stroke="#d0d7de" stroke-width="2"/>

  <text x="360" y="115" font-size="13" text-anchor="middle" fill="#1a1a1a">Довжина</text>
  <text x="360" y="132" font-size="13" text-anchor="middle" fill="#1a1a1a">даних</text>
  <line x1="360" y1="138" x2="360" y2="160" stroke="#d0d7de" stroke-width="2"/>

  <text x="580" y="115" font-size="13" text-anchor="middle" fill="#1a1a1a">Корисне</text>
  <text x="580" y="132" font-size="13" text-anchor="middle" fill="#1a1a1a">навантаження</text>
  <line x1="580" y1="138" x2="580" y2="160" stroke="#2457d6" stroke-width="2"/>

  <text x="820" y="115" font-size="13" text-anchor="middle" fill="#1a1a1a">Контрольна</text>
  <text x="820" y="132" font-size="13" text-anchor="middle" fill="#1a1a1a">сума</text>
  <line x1="820" y1="138" x2="820" y2="160" stroke="#d0d7de" stroke-width="2"/>

  <text x="120" y="240" font-size="13" text-anchor="middle" fill="#6b7280">1 байт</text>
  <text x="200" y="240" font-size="13" text-anchor="middle" fill="#6b7280">1 байт</text>
  <text x="280" y="240" font-size="13" text-anchor="middle" fill="#6b7280">1 байт</text>
  <text x="360" y="240" font-size="13" text-anchor="middle" fill="#6b7280">1 байт</text>
  <text x="580" y="240" font-size="13" text-anchor="middle" fill="#6b7280">N байтів</text>
  <text x="820" y="240" font-size="13" text-anchor="middle" fill="#6b7280">2 байти</text>

  <polyline points="80,255 80,265 400,265 400,255" fill="none" stroke="#d0d7de" stroke-width="2"/>
  <text x="240" y="285" font-size="13" text-anchor="middle" fill="#6b7280">Заголовок</text>

  <polyline points="400,255 400,265 760,265 760,255" fill="none" stroke="#2457d6" stroke-width="2"/>
  <text x="580" y="285" font-size="13" text-anchor="middle" fill="#2457d6">Дані</text>

  <polyline points="760,255 760,265 880,265 880,255" fill="none" stroke="#d0d7de" stroke-width="2"/>
  <text x="820" y="285" font-size="13" text-anchor="middle" fill="#6b7280">Перевірка</text>
</svg>
