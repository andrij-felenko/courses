<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="510" fill="white"/>

  <!-- Header -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Монтажна схема підключення 4S BMS та балансира JST-XH</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Черговість розпіновки B0..B4, силові термінали B-/P- та захисний запобіжник у колі P+</text>

  <!-- Heavy B+ Cable (top) -->
  <path d="M 65 126 L 65 62 L 842 62 L 842 115" fill="none" stroke="#dc2626" stroke-width="5"/>
  <text x="100" y="55" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">Силовий B+ (+14.8 V)</text>

  <!-- Panel 1: 4S Battery Pack -->
  <rect x="25" y="75" width="230" height="410" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="140" y="95" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Акумуляторний блок 4S (Li-ion)</text>

  <!-- Cell 4 -->
  <rect x="45" y="112" width="190" height="48" rx="6" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="140" y="131" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Комірка 4 (BAT 4)</text>
  <text x="140" y="149" font-size="12" fill="#6b7280" text-anchor="middle">3.7 V (max 4.2 V)</text>
  <circle cx="65" cy="136" r="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="65" y="140" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">+</text>
  <circle cx="215" cy="136" r="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="215" y="140" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">-</text>

  <!-- Busbar 3 (Cell 4 - to Cell 3 +) -->
  <line x1="215" y1="146" x2="215" y2="202" stroke="#d97706" stroke-width="4"/>

  <!-- Cell 3 -->
  <rect x="45" y="192" width="190" height="48" rx="6" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="140" y="211" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Комірка 3 (BAT 3)</text>
  <text x="140" y="229" font-size="12" fill="#6b7280" text-anchor="middle">3.7 V (max 4.2 V)</text>
  <circle cx="65" cy="216" r="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="65" y="220" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">-</text>
  <circle cx="215" cy="216" r="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="215" y="220" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">+</text>

  <!-- Busbar 2 (Cell 3 - to Cell 2 +) -->
  <line x1="65" y1="226" x2="65" y2="282" stroke="#d97706" stroke-width="4"/>

  <!-- NTC Sensor Probe -->
  <rect x="95" y="254" width="90" height="18" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="140" y="267" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">NTC датчик T°</text>

  <!-- Cell 2 -->
  <rect x="45" y="272" width="190" height="48" rx="6" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="140" y="291" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Комірка 2 (BAT 2)</text>
  <text x="140" y="309" font-size="12" fill="#6b7280" text-anchor="middle">3.7 V (max 4.2 V)</text>
  <circle cx="65" cy="296" r="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="65" y="300" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">+</text>
  <circle cx="215" cy="296" r="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="215" y="300" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">-</text>

  <!-- Busbar 1 (Cell 2 - to Cell 1 +) -->
  <line x1="215" y1="306" x2="215" y2="362" stroke="#d97706" stroke-width="4"/>

  <!-- Cell 1 -->
  <rect x="45" y="352" width="190" height="48" rx="6" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="140" y="371" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Комірка 1 (BAT 1)</text>
  <text x="140" y="389" font-size="12" fill="#6b7280" text-anchor="middle">3.7 V (max 4.2 V)</text>
  <circle cx="65" cy="376" r="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="65" y="380" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">-</text>
  <circle cx="215" cy="376" r="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="215" y="380" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">+</text>

  <!-- Balance Wires -->
  <!-- Wire 5: B4 (+14.8V) Red -->
  <path d="M 65 136 L 65 106 L 445 106 L 445 140 L 465 140" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <text x="340" y="98" font-size="12" font-weight="bold" fill="#dc2626" text-anchor="middle">B4: +14.8 V (Червоний)</text>

  <!-- Wire 4: B3 (+11.1V) Green -->
  <path d="M 215 174 L 435 174 L 435 180 L 465 180" fill="none" stroke="#16a34a" stroke-width="2.5"/>
  <text x="330" y="166" font-size="12" font-weight="bold" fill="#16a34a" text-anchor="middle">B3: +11.1 V (Зелений)</text>

  <!-- Wire 3: B2 (+7.4V) Yellow/Amber -->
  <path d="M 65 242 L 425 242 L 425 220 L 465 220" fill="none" stroke="#d97706" stroke-width="2.5"/>
  <text x="330" y="234" font-size="12" font-weight="bold" fill="#d97706" text-anchor="middle">B2: +7.4 V (Жовтий)</text>

  <!-- Wire 2: B1 (+3.7V) Blue -->
  <path d="M 215 334 L 435 334 L 435 260 L 465 260" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <text x="330" y="326" font-size="12" font-weight="bold" fill="#2563eb" text-anchor="middle">B1: +3.7 V (Синій)</text>

  <!-- Wire 1: B0 / B- (0V) Black -->
  <path d="M 65 386 L 65 420 L 445 420 L 445 300 L 465 300" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="330" y="412" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">B0: 0 V / B- (Чорний)</text>

  <!-- JST-XH Plug & Pins -->
  <rect x="465" y="120" width="35" height="200" rx="4" fill="white" stroke="#6b7280" stroke-width="1.5"/>
  <text x="482" y="112" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">JST-XH</text>

  <!-- Pin 5 -->
  <circle cx="482" cy="140" r="7" fill="#dc2626"/>
  <text x="482" y="144" font-size="12" font-weight="bold" fill="white" text-anchor="middle">5</text>

  <!-- Pin 4 -->
  <circle cx="482" cy="180" r="7" fill="#16a34a"/>
  <text x="482" y="184" font-size="12" font-weight="bold" fill="white" text-anchor="middle">4</text>

  <!-- Pin 3 -->
  <circle cx="482" cy="220" r="7" fill="#d97706"/>
  <text x="482" y="224" font-size="12" font-weight="bold" fill="white" text-anchor="middle">3</text>

  <!-- Pin 2 -->
  <circle cx="482" cy="260" r="7" fill="#2563eb"/>
  <text x="482" y="264" font-size="12" font-weight="bold" fill="white" text-anchor="middle">2</text>

  <!-- Pin 1 -->
  <circle cx="482" cy="300" r="7" fill="#1a1a1a"/>
  <text x="482" y="304" font-size="12" font-weight="bold" fill="white" text-anchor="middle">1</text>

  <!-- Lines connecting JST Plug to BMS Socket -->
  <line x1="500" y1="140" x2="515" y2="140" stroke="#dc2626" stroke-width="2.5"/>
  <line x1="500" y1="180" x2="515" y2="180" stroke="#16a34a" stroke-width="2.5"/>
  <line x1="500" y1="220" x2="515" y2="220" stroke="#d97706" stroke-width="2.5"/>
  <line x1="500" y1="260" x2="515" y2="260" stroke="#2563eb" stroke-width="2.5"/>
  <line x1="500" y1="300" x2="515" y2="300" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- Panel 3: BMS 4S Board -->
  <rect x="515" y="75" width="215" height="410" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="622" y="95" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Плата BMS 4S (з балансуванням)</text>

  <!-- JST Socket on BMS -->
  <rect x="515" y="120" width="15" height="200" rx="2" fill="white" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Balancing Circuit Block -->
  <rect x="540" y="120" width="175" height="110" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="627" y="138" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Пасивне балансування</text>

  <!-- Resistors R4..R1 -->
  <rect x="550" y="150" width="26" height="12" rx="2" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="584" y="161" font-size="12" fill="#1a1a1a">R4</text>

  <rect x="550" y="168" width="26" height="12" rx="2" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="584" y="179" font-size="12" fill="#1a1a1a">R3</text>

  <rect x="550" y="186" width="26" height="12" rx="2" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="584" y="197" font-size="12" fill="#1a1a1a">R2</text>

  <rect x="550" y="204" width="26" height="12" rx="2" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="584" y="215" font-size="12" fill="#1a1a1a">R1</text>

  <text x="660" y="175" font-size="12" fill="#6b7280" text-anchor="middle">Шунти ~68 Ом</text>
  <text x="660" y="195" font-size="12" fill="#6b7280" text-anchor="middle">Струм ~60 мА</text>

  <!-- MCU Control Block -->
  <rect x="540" y="240" width="175" height="125" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="550" y="252" width="42" height="36" rx="3" fill="#1a1a1a"/>
  <text x="571" y="274" font-size="12" font-weight="bold" fill="white" text-anchor="middle">MCU</text>
  <text x="645" y="262" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Контролер BMS</text>
  <text x="645" y="280" font-size="12" fill="#6b7280" text-anchor="middle">Захист: U, I, T</text>
  <text x="645" y="298" font-size="12" fill="#6b7280" text-anchor="middle">і коротке замикання</text>

  <!-- NTC line from MCU to NTC Probe -->
  <path d="M 550 270 L 185 270" fill="none" stroke="#c0392b" stroke-dasharray="4,3" stroke-width="1.5"/>

  <!-- MOSFET switches -->
  <rect x="550" y="315" width="72" height="38" rx="3" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="586" y="338" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">FET Заряд</text>

  <rect x="633" y="315" width="72" height="38" rx="3" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="669" y="338" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">FET Розряд</text>

  <!-- BMS Power Terminals (B- and P-) -->
  <rect x="540" y="385" width="75" height="42" rx="4" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="577" y="408" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">B-</text>
  <text x="577" y="445" font-size="12" fill="#6b7280" text-anchor="middle">(Вхід B-)</text>

  <rect x="640" y="385" width="75" height="42" rx="4" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="677" y="408" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">P-</text>
  <text x="677" y="445" font-size="12" fill="#6b7280" text-anchor="middle">(Вихід P-)</text>

  <!-- Heavy Power Wires -->
  <path d="M 65 386 L 65 456 L 577 456 L 577 427" fill="none" stroke="#1a1a1a" stroke-width="5"/>
  <text x="320" y="448" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Силовий кабель B- (0 V)</text>

  <path d="M 677 427 L 677 456 L 842 456 L 842 423" fill="none" stroke="#1a1a1a" stroke-width="5"/>
  <text x="760" y="448" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Силовий P-</text>

  <!-- Panel 4: Output / Load & Charger -->
  <rect x="750" y="75" width="185" height="410" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="842" y="95" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Навантаження / Зарядка</text>

  <!-- Fuse Box -->
  <rect x="770" y="115" width="145" height="45" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="842" y="133" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Запобіжник (Fuse)</text>
  <text x="842" y="150" font-size="12" fill="#c0392b" text-anchor="middle">40 A / 60 A</text>

  <!-- Line from Fuse down to Terminal P+ -->
  <line x1="842" y1="160" x2="842" y2="195" stroke="#dc2626" stroke-width="5"/>

  <!-- Terminal P+ Block -->
  <rect x="770" y="195" width="145" height="60" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="842" cy="210" r="10" fill="#dc2626"/>
  <text x="842" y="214" font-size="14" font-weight="bold" fill="white" text-anchor="middle">+</text>
  <text x="842" y="230" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Термінал P+</text>
  <text x="842" y="248" font-size="12" fill="#6b7280" text-anchor="middle">+14.8 V (max 16.8 V)</text>

  <!-- Common Port Box -->
  <rect x="760" y="275" width="165" height="72" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="842" y="292" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Спільний порт (Common)</text>
  <text x="842" y="309" font-size="12" fill="#1a1a1a" text-anchor="middle">Зарядка: max 16.8 V</text>
  <text x="842" y="326" font-size="12" fill="#1a1a1a" text-anchor="middle">Розрядка: 11.2..16.8 V</text>
  <text x="842" y="343" font-size="12" fill="#6b7280" text-anchor="middle">Єдиний порт (P+/P-)</text>

  <!-- Terminal P- Block -->
  <rect x="770" y="365" width="145" height="58" rx="6" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="842" cy="380" r="10" fill="#1a1a1a"/>
  <text x="842" y="384" font-size="14" font-weight="bold" fill="white" text-anchor="middle">-</text>
  <text x="842" y="400" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Термінал P-</text>
  <text x="842" y="419" font-size="12" fill="#6b7280" text-anchor="middle">0 V / Загальний мінус</text>
</svg>
