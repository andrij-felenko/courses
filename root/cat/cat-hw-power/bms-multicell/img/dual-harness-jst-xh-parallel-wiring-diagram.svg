<svg viewBox="0 0 960 560" width="960" height="560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>
  
  <!-- Headers -->
  <text x="480" y="40" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Паралельне підключення балансувальних шлейфів (JST-XH)</text>
  <text x="480" y="65" font-size="13" text-anchor="middle" fill="#6b7280">Комутація штатної BMS та активного балансира на спільні контакти збірки 4S</text>

  <!-- BMS Board -->
  <rect x="80" y="100" width="240" height="120" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="200" y="130" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Плата захисту BMS</text>
  <text x="200" y="150" font-size="13" text-anchor="middle" fill="#6b7280">(Пасивне балансування)</text>
  <rect x="140" y="180" width="120" height="20" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" rx="2"/>
  <text x="150" y="170" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">B-</text>
  <text x="175" y="170" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">B1</text>
  <text x="200" y="170" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">B2</text>
  <text x="225" y="170" font-size="12" font-weight="bold" text-anchor="middle" fill="#d35400">B3</text>
  <text x="250" y="170" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">B4</text>
  
  <!-- Active Balancer Board -->
  <rect x="640" y="100" width="240" height="120" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="760" y="130" font-size="16" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Активний балансир</text>
  <text x="760" y="150" font-size="13" text-anchor="middle" fill="#6b7280">(Ємнісне вирівнювання)</text>
  <rect x="700" y="180" width="120" height="20" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="2" rx="2"/>
  <text x="710" y="170" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">B-</text>
  <text x="735" y="170" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">B1</text>
  <text x="760" y="170" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">B2</text>
  <text x="785" y="170" font-size="12" font-weight="bold" text-anchor="middle" fill="#d35400">B3</text>
  <text x="810" y="170" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">B4</text>

  <!-- Battery Pack Bounding Box -->
  <rect x="260" y="415" width="410" height="135" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="465" y="535" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Акумуляторна збірка 4S</text>

  <!-- Cells -->
  <rect x="290" y="435" width="80" height="70" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="4"/>
  <text x="330" y="475" font-size="14" font-weight="bold" text-anchor="middle" fill="#2457d6">Осередок 1</text>
  
  <rect x="380" y="435" width="80" height="70" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="4"/>
  <text x="420" y="475" font-size="14" font-weight="bold" text-anchor="middle" fill="#2457d6">Осередок 2</text>
  
  <rect x="470" y="435" width="80" height="70" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="4"/>
  <text x="510" y="475" font-size="14" font-weight="bold" text-anchor="middle" fill="#2457d6">Осередок 3</text>
  
  <rect x="560" y="435" width="80" height="70" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="4"/>
  <text x="600" y="475" font-size="14" font-weight="bold" text-anchor="middle" fill="#2457d6">Осередок 4</text>

  <!-- Terminal Pads -->
  <rect x="270" y="400" width="40" height="15" fill="#d0d7de" stroke="#6b7280" stroke-width="2" rx="3"/>
  <text x="290" y="385" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">B-</text>
  
  <rect x="360" y="400" width="40" height="15" fill="#d0d7de" stroke="#6b7280" stroke-width="2" rx="3"/>
  <text x="380" y="385" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">B1</text>
  
  <rect x="450" y="400" width="40" height="15" fill="#d0d7de" stroke="#6b7280" stroke-width="2" rx="3"/>
  <text x="470" y="385" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">B2</text>
  
  <rect x="540" y="400" width="40" height="15" fill="#d0d7de" stroke="#6b7280" stroke-width="2" rx="3"/>
  <text x="560" y="385" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">B3</text>
  
  <rect x="620" y="400" width="40" height="15" fill="#d0d7de" stroke="#6b7280" stroke-width="2" rx="3"/>
  <text x="640" y="385" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">B4</text>

  <!-- Wires BMS -->
  <path d="M150,200 V240 H285 V407" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="285" cy="407" r="3" fill="#1a1a1a"/>
  
  <path d="M175,200 V250 H375 V407" fill="none" stroke="#2457d6" stroke-width="2"/>
  <circle cx="375" cy="407" r="3" fill="#2457d6"/>
  
  <path d="M200,200 V260 H465 V407" fill="none" stroke="#27ae60" stroke-width="2"/>
  <circle cx="465" cy="407" r="3" fill="#27ae60"/>
  
  <path d="M225,200 V270 H555 V407" fill="none" stroke="#d35400" stroke-width="2"/>
  <circle cx="555" cy="407" r="3" fill="#d35400"/>
  
  <path d="M250,200 V280 H635 V407" fill="none" stroke="#c0392b" stroke-width="2"/>
  <circle cx="635" cy="407" r="3" fill="#c0392b"/>

  <!-- Wires Balancer -->
  <path d="M710,200 V330 H295 V407" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="295" cy="407" r="3" fill="#1a1a1a"/>
  
  <path d="M735,200 V320 H385 V407" fill="none" stroke="#2457d6" stroke-width="2"/>
  <circle cx="385" cy="407" r="3" fill="#2457d6"/>
  
  <path d="M760,200 V310 H475 V407" fill="none" stroke="#27ae60" stroke-width="2"/>
  <circle cx="475" cy="407" r="3" fill="#27ae60"/>
  
  <path d="M785,200 V300 H565 V407" fill="none" stroke="#d35400" stroke-width="2"/>
  <circle cx="565" cy="407" r="3" fill="#d35400"/>
  
  <path d="M810,200 V290 H645 V407" fill="none" stroke="#c0392b" stroke-width="2"/>
  <circle cx="645" cy="407" r="3" fill="#c0392b"/>
</svg>
