  <text x="430" y="394" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Драйвер CHG: керує Q_CHG</text>
  <text x="430" y="414" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Драйвер DSG: керує Q_DSG</text>
  <text x="430" y="438" font-size="12" fill="#1a1a1a" text-anchor="middle">Виходи керування затворами</text>
