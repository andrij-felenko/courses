  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Топологія BMS 4S з AFE та ключами в низьковольтному плечі</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Зустрічні N-MOSFET у колі B- регулюють заряд і розряд під контролем AFE</text>
  <rect x="30" y="75" width="200" height="445" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="130" y="98" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Батарея 4S (Li-ion)</text>
  <rect x="45" y="112" width="170" height="52" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="130" y="132" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Комірка 4 (Cell 4)</text>
  <text x="130" y="150" font-size="12" fill="#6b7280" text-anchor="middle">3.6 V - 4.2 V</text>
