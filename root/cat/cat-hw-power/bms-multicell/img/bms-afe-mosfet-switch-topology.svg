  <text x="130" y="462" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Датчик NTC</text>
  <text x="130" y="480" font-size="12" fill="#6b7280" text-anchor="middle">Термоконтроль збірки</text>
  <rect x="280" y="75" width="300" height="390" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="430" y="98" font-size="14" font-weight="700" fill="#2457d6" text-anchor="middle">Контролер AFE (Analog Front-End)</text>
  <rect x="298" y="112" width="264" height="98" rx="6" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1"/>
  <text x="430" y="132" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Монітор напруг та балансування</text>
  <text x="430" y="152" font-size="12" fill="#2457d6" text-anchor="middle">Контроль кожної комірки VC1..VC4</text>
  <text x="430" y="172" font-size="12" fill="#6b7280" text-anchor="middle">Пасивне шунтування при овервольтажі</text>
  <text x="430" y="192" font-size="12" fill="#27ae60" text-anchor="middle">Захист OVP / UVP</text>
  <rect x="298" y="222" width="264" height="98" rx="6" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1"/>
  <text x="430" y="242" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Вимірювач струму (SRP / SRN)</text>
  <text x="430" y="262" font-size="12" fill="#2457d6" text-anchor="middle">Аналіз спаду на шунті R_shunt</text>
  <text x="430" y="282" font-size="12" fill="#c0392b" text-anchor="middle">Захист OCP (перевантаження)</text>
  <text x="430" y="302" font-size="12" fill="#c0392b" text-anchor="middle">Захист SCD (коротке замикання)</text>
