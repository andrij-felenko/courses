  <rect x="45" y="248" width="170" height="52" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="130" y="268" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Комірка 2 (Cell 2)</text>
  <text x="130" y="286" font-size="12" fill="#6b7280" text-anchor="middle">3.6 V - 4.2 V</text>
  <rect x="45" y="316" width="170" height="52" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="130" y="336" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Комірка 1 (Cell 1)</text>
  <text x="130" y="354" font-size="12" fill="#6b7280" text-anchor="middle">3.6 V - 4.2 V</text>
