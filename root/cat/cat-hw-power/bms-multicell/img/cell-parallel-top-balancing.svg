<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title -->
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Паралельне з'єднання комірок для Top-Balancing</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Усі комірки з'єднані паралельно для вирівнювання напруги заряджанням до 3.65 В</text>

  <!-- Wires -->
  <!-- Positive Wire -->
  <path d="M 250 270 L 350 270 L 350 100 L 850 100" fill="none" stroke="#c0392b" stroke-width="4" />
  <!-- Positive Wire Drops -->
  <line x1="490" y1="100" x2="490" y2="145" stroke="#c0392b" stroke-width="4" />
  <circle cx="490" cy="100" r="4" fill="#c0392b" />
  <line x1="610" y1="100" x2="610" y2="145" stroke="#c0392b" stroke-width="4" />
  <circle cx="610" cy="100" r="4" fill="#c0392b" />
  <line x1="730" y1="100" x2="730" y2="145" stroke="#c0392b" stroke-width="4" />
  <circle cx="730" cy="100" r="4" fill="#c0392b" />
  <line x1="850" y1="100" x2="850" y2="145" stroke="#c0392b" stroke-width="4" />
  <circle cx="850" cy="100" r="4" fill="#c0392b" />

  <!-- Negative Wire -->
  <path d="M 150 270 L 150 340 L 850 340" fill="none" stroke="#2457d6" stroke-width="4" />
  <!-- Negative Wire Drops -->
  <line x1="490" y1="280" x2="490" y2="340" stroke="#2457d6" stroke-width="4" />
  <circle cx="490" cy="340" r="4" fill="#2457d6" />
  <line x1="610" y1="280" x2="610" y2="340" stroke="#2457d6" stroke-width="4" />
  <circle cx="610" cy="340" r="4" fill="#2457d6" />
  <line x1="730" y1="280" x2="730" y2="340" stroke="#2457d6" stroke-width="4" />
  <circle cx="730" cy="340" r="4" fill="#2457d6" />
  <line x1="850" y1="280" x2="850" y2="340" stroke="#2457d6" stroke-width="4" />
  <circle cx="850" cy="340" r="4" fill="#2457d6" />

  <!-- Labels for Wires -->
  <text x="670" y="90" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Паралельна шина (+)</text>
  <text x="670" y="365" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Паралельна шина (-)</text>

  <!-- LPS Label -->
  <text x="200" y="130" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Лабораторний БЖ</text>
  <text x="200" y="320" font-size="12" fill="#6b7280" text-anchor="middle">Режим CC/CV</text>

  <!-- LPS Box -->
  <rect x="100" y="140" width="200" height="160" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  
  <!-- LPS Screen -->
  <rect x="120" y="160" width="160" height="60" rx="4" fill="#1a1a1a" />
  <text x="200" y="185" fill="#27ae60" font-size="20" font-weight="bold" text-anchor="middle" font-family="monospace">3.65 V</text>
  <text x="200" y="210" fill="#27ae60" font-size="20" font-weight="bold" text-anchor="middle" font-family="monospace">2.00 A</text>
  
  <!-- LPS Panel Decoration -->
  <circle cx="160" cy="240" r="6" fill="#d0d7de" />
  <circle cx="180" cy="240" r="6" fill="#d0d7de" />
  <circle cx="200" cy="240" r="6" fill="#d0d7de" />

  <!-- LPS Terminals -->
  <circle cx="150" cy="270" r="10" fill="#2457d6" />
  <circle cx="150" cy="270" r="4" fill="#1a1a1a" />
  <text x="150" y="250" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">-</text>

  <circle cx="250" cy="270" r="10" fill="#c0392b" />
  <circle cx="250" cy="270" r="4" fill="#1a1a1a" />
  <text x="250" y="250" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">+</text>

  <!-- Batteries -->
  <!-- Cell 1 -->
  <rect x="460" y="160" width="60" height="120" rx="4" fill="#eaf0fd" stroke="#d0d7de" stroke-width="2" />
  <rect x="475" y="145" width="30" height="15" rx="2" fill="#d0d7de" stroke="#6b7280" stroke-width="1" />
  <text x="490" y="225" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">32700</text>
  <text x="490" y="245" font-size="12" fill="#6b7280" text-anchor="middle">LiFePO4</text>
  <text x="490" y="175" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">+</text>
  <text x="490" y="270" font-size="16" font-weight="bold" fill="#2457d6" text-anchor="middle">-</text>

  <!-- Cell 2 -->
  <rect x="580" y="160" width="60" height="120" rx="4" fill="#eaf0fd" stroke="#d0d7de" stroke-width="2" />
  <rect x="595" y="145" width="30" height="15" rx="2" fill="#d0d7de" stroke="#6b7280" stroke-width="1" />
  <text x="610" y="225" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">32700</text>
  <text x="610" y="245" font-size="12" fill="#6b7280" text-anchor="middle">LiFePO4</text>
  <text x="610" y="175" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">+</text>
  <text x="610" y="270" font-size="16" font-weight="bold" fill="#2457d6" text-anchor="middle">-</text>

  <!-- Cell 3 -->
  <rect x="700" y="160" width="60" height="120" rx="4" fill="#eaf0fd" stroke="#d0d7de" stroke-width="2" />
  <rect x="715" y="145" width="30" height="15" rx="2" fill="#d0d7de" stroke="#6b7280" stroke-width="1" />
  <text x="730" y="225" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">32700</text>
  <text x="730" y="245" font-size="12" fill="#6b7280" text-anchor="middle">LiFePO4</text>
  <text x="730" y="175" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">+</text>
  <text x="730" y="270" font-size="16" font-weight="bold" fill="#2457d6" text-anchor="middle">-</text>

  <!-- Cell 4 -->
  <rect x="820" y="160" width="60" height="120" rx="4" fill="#eaf0fd" stroke="#d0d7de" stroke-width="2" />
  <rect x="835" y="145" width="30" height="15" rx="2" fill="#d0d7de" stroke="#6b7280" stroke-width="1" />
  <text x="850" y="225" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">32700</text>
  <text x="850" y="245" font-size="12" fill="#6b7280" text-anchor="middle">LiFePO4</text>
  <text x="850" y="175" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">+</text>
  <text x="850" y="270" font-size="16" font-weight="bold" fill="#2457d6" text-anchor="middle">-</text>

  <!-- General Description Block -->
  <text x="670" y="400" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Блок комірок (паралельно)</text>
  <text x="670" y="420" font-size="12" fill="#6b7280" text-anchor="middle">Усі + до +, усі - до -</text>

</svg>
