<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Тло -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема підключення 4S LiFePO4 акумулятора з BMS та балансуванням</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Поділ силових та сигнальних ліній, порядок підключення шлейфа, розташування запобіжника й вольтметра</text>

  <!-- Силові лінії (товсті) -->
  <g fill="none" stroke-width="4">
    <!-- P- -->
    <path d="M 240,140 L 240,80 L 910,80" stroke="#1a1a1a"/>
    <!-- B- від акумулятора до BMS -->
    <path d="M 125,330 L 125,280 L 240,280 L 240,220" stroke="#1a1a1a"/>
    <!-- B+ від акумулятора до запобіжника -->
    <path d="M 605,330 L 605,280 L 700,280 L 700,220" stroke="#c0392b"/>
    <!-- B+ від запобіжника до виходу -->
    <path d="M 700,140 L 700,120 L 910,120" stroke="#c0392b"/>
  </g>

  <!-- Силові перемички (шини) -->
  <g fill="none" stroke="#6b7280" stroke-width="6" stroke-linejoin="round">
    <path d="M 180,330 L 180,300 L 260,300 L 260,330"/>
    <path d="M 320,330 L 320,300 L 400,300 L 400,330"/>
    <path d="M 460,330 L 460,300 L 540,300 L 540,330"/>
  </g>

  <!-- Сигнальні лінії балансування (тонкі) -->
  <g fill="none" stroke="#2457d6" stroke-width="2">
    <path d="M 320,220 L 320,230 L 115,230 L 115,330"/>
    <path d="M 360,220 L 360,245 L 220,245 L 220,300"/>
    <path d="M 400,220 L 400,260 L 360,260 L 360,300"/>
    <path d="M 440,220 L 440,275 L 500,275 L 500,300"/>
    <path d="M 480,220 L 480,295 L 595,295 L 595,330"/>
  </g>

  <!-- Провід термодатчика NTC -->
  <path d="M 530,220 L 530,285 L 355,285 L 355,380" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4 2"/>

  <!-- Проводи вольтметра -->
  <g fill="none" stroke-width="1.5">
    <path d="M 835,240 L 835,80" stroke="#1a1a1a"/>
    <path d="M 865,240 L 865,120" stroke="#c0392b"/>
  </g>

  <!-- Плата BMS -->
  <g>
    <rect x="200" y="140" width="380" height="80" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
    <text x="390" y="170" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Плата BMS 4S 40A</text>
    <text x="390" y="190" font-size="13" fill="#6b7280" text-anchor="middle">Пасивне балансування, захист</text>

    <!-- Контактні майданчики BMS -->
    <rect x="220" y="140" width="40" height="15" fill="#d0d7de"/>
    <text x="270" y="153" font-size="14" font-weight="bold" fill="#1a1a1a">P-</text>
    
    <rect x="220" y="205" width="40" height="15" fill="#d0d7de"/>
    <text x="270" y="218" font-size="14" font-weight="bold" fill="#1a1a1a">B-</text>

    <!-- Балансувальний конектор -->
    <rect x="300" y="210" width="200" height="10" fill="#d0d7de"/>
    <g font-size="12" fill="#1a1a1a" text-anchor="middle">
      <text x="320" y="200">B-</text>
      <text x="360" y="200">B1</text>
      <text x="400" y="200">B2</text>
      <text x="440" y="200">B3</text>
      <text x="480" y="200">B4</text>
      <text x="530" y="200">NTC</text>
    </g>
    <rect x="520" y="210" width="20" height="10" fill="#d0d7de"/>
  </g>

  <!-- Запобіжник -->
  <g>
    <rect x="680" y="140" width="40" height="80" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <path d="M 700,140 L 700,160 M 700,200 L 700,220" stroke="#c0392b" stroke-width="4"/>
    <path d="M 700,160 C 720,170 680,190 700,200" fill="none" stroke="#c0392b" stroke-width="2"/>
    <text x="730" y="175" font-size="13" fill="#1a1a1a">Запобіжник</text>
    <text x="730" y="195" font-size="13" fill="#6b7280">40 A</text>
  </g>

  <!-- Вольтметр -->
  <g>
    <rect x="820" y="240" width="60" height="35" rx="3" fill="#1a1a1a"/>
    <text x="850" y="264" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">13.2 V</text>
    <text x="850" y="295" font-size="12" fill="#6b7280" text-anchor="middle">Вольтметр</text>
  </g>

  <!-- Клеми комірок -->
  <g fill="#1a1a1a">
    <rect x="110" y="330" width="20" height="10"/>
    <rect x="250" y="330" width="20" height="10"/>
    <rect x="390" y="330" width="20" height="10"/>
    <rect x="530" y="330" width="20" height="10"/>
  </g>
  <g fill="#c0392b">
    <rect x="170" y="330" width="20" height="10"/>
    <rect x="310" y="330" width="20" height="10"/>
    <rect x="450" y="330" width="20" height="10"/>
    <rect x="590" y="330" width="20" height="10"/>
  </g>

  <!-- Комірки -->
  <g stroke="#2457d6" stroke-width="2" fill="#eaf0fd">
    <rect x="100" y="340" width="100" height="120" rx="4"/>
    <rect x="240" y="340" width="100" height="120" rx="4"/>
    <rect x="380" y="340" width="100" height="120" rx="4"/>
    <rect x="520" y="340" width="100" height="120" rx="4"/>
  </g>

  <!-- Підписи комірок -->
  <g font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">
    <text x="150" y="390">Комірка 1</text>
    <text x="290" y="390">Комірка 2</text>
    <text x="430" y="390">Комірка 3</text>
    <text x="570" y="390">Комірка 4</text>
  </g>
  <g font-size="13" fill="#6b7280" text-anchor="middle">
    <text x="150" y="415">3.2 В</text>
    <text x="290" y="415">3.2 В</text>
    <text x="430" y="415">3.2 В</text>
    <text x="570" y="415">3.2 В</text>
  </g>

  <!-- Полярність -->
  <g font-size="16" font-weight="bold" text-anchor="middle">
    <text x="120" y="365" fill="#1a1a1a">-</text>
    <text x="180" y="365" fill="#c0392b">+</text>
    
    <text x="260" y="365" fill="#1a1a1a">-</text>
    <text x="320" y="365" fill="#c0392b">+</text>
    
    <text x="400" y="365" fill="#1a1a1a">-</text>
    <text x="460" y="365" fill="#c0392b">+</text>
    
    <text x="540" y="365" fill="#1a1a1a">-</text>
    <text x="600" y="365" fill="#c0392b">+</text>
  </g>

  <!-- Термодатчик NTC -->
  <g>
    <rect x="350" y="380" width="10" height="15" rx="3" fill="#1a1a1a"/>
    <text x="355" y="415" font-size="12" fill="#6b7280" text-anchor="middle">T°C</text>
  </g>

  <!-- Точки підключення -->
  <g fill="#2457d6">
    <circle cx="115" cy="330" r="3"/>
    <circle cx="220" cy="300" r="3"/>
    <circle cx="360" cy="300" r="3"/>
    <circle cx="500" cy="300" r="3"/>
    <circle cx="595" cy="330" r="3"/>
  </g>
  <g fill="#1a1a1a">
    <circle cx="835" cy="80" r="3"/>
    <circle cx="910" cy="80" r="5" stroke="white" stroke-width="1"/>
  </g>
  <g fill="#c0392b">
    <circle cx="865" cy="120" r="3"/>
    <circle cx="910" cy="120" r="5" stroke="white" stroke-width="1"/>
  </g>

  <!-- Виходи навантаження -->
  <text x="910" y="70" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вихід -</text>
  <text x="910" y="110" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Вихід +</text>

</svg>
