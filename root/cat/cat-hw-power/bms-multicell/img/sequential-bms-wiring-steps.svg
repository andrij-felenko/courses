<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="35" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Порядок підключення дротів до BMS (4S)</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Суворе дотримання послідовності від мінуса до плюса запобігає пошкодженню плати</text>

  <!-- Акумуляторна збірка -->
  <rect x="40" y="100" width="230" height="280" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="6" />
  <text x="155" y="90" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Акумуляторна збірка (4S)</text>

  <!-- Внутрішні з'єднання акумулятора -->
  <polyline points="110,122 110,120 270,120" fill="none" stroke="#6b7280" stroke-width="2"/>
  <line x1="110" y1="180" x2="270" y2="180" stroke="#6b7280" stroke-width="2"/>
  <line x1="110" y1="240" x2="270" y2="240" stroke="#6b7280" stroke-width="2"/>
  <line x1="110" y1="300" x2="270" y2="300" stroke="#6b7280" stroke-width="2"/>
  <polyline points="110,358 110,360 270,360" fill="none" stroke="#6b7280" stroke-width="2"/>

  <!-- Послідовні перемички між комірками -->
  <line x1="110" y1="178" x2="110" y2="182" stroke="#6b7280" stroke-width="6"/>
  <line x1="110" y1="238" x2="110" y2="242" stroke="#6b7280" stroke-width="6"/>
  <line x1="110" y1="298" x2="110" y2="302" stroke="#6b7280" stroke-width="6"/>

  <!-- Комірки акумулятора -->
  <rect x="60" y="122" width="100" height="56" fill="#ffffff" stroke="#d0d7de" stroke-width="2" rx="4" />
  <text x="100" y="154" font-size="13" fill="#1a1a1a" text-anchor="middle">Комірка 4</text>
  <text x="145" y="138" font-size="14" fill="#c0392b" font-weight="bold" text-anchor="middle">+</text>
  <text x="145" y="174" font-size="14" fill="#1a1a1a" font-weight="bold" text-anchor="middle">-</text>

  <rect x="60" y="182" width="100" height="56" fill="#ffffff" stroke="#d0d7de" stroke-width="2" rx="4" />
  <text x="100" y="214" font-size="13" fill="#1a1a1a" text-anchor="middle">Комірка 3</text>
  <text x="145" y="198" font-size="14" fill="#c0392b" font-weight="bold" text-anchor="middle">+</text>
  <text x="145" y="234" font-size="14" fill="#1a1a1a" font-weight="bold" text-anchor="middle">-</text>

  <rect x="60" y="242" width="100" height="56" fill="#ffffff" stroke="#d0d7de" stroke-width="2" rx="4" />
  <text x="100" y="274" font-size="13" fill="#1a1a1a" text-anchor="middle">Комірка 2</text>
  <text x="145" y="258" font-size="14" fill="#c0392b" font-weight="bold" text-anchor="middle">+</text>
  <text x="145" y="294" font-size="14" fill="#1a1a1a" font-weight="bold" text-anchor="middle">-</text>

  <rect x="60" y="302" width="100" height="56" fill="#ffffff" stroke="#d0d7de" stroke-width="2" rx="4" />
  <text x="100" y="334" font-size="13" fill="#1a1a1a" text-anchor="middle">Комірка 1</text>
  <text x="145" y="318" font-size="14" fill="#c0392b" font-weight="bold" text-anchor="middle">+</text>
  <text x="145" y="354" font-size="14" fill="#1a1a1a" font-weight="bold" text-anchor="middle">-</text>

  <!-- Підписи виводів акумулятора -->
  <text x="260" y="115" font-size="12" fill="#1a1a1a" text-anchor="end">B+ (14.8V)</text>
  <text x="260" y="175" font-size="12" fill="#1a1a1a" text-anchor="end">B3 (11.1V)</text>
  <text x="260" y="235" font-size="12" fill="#1a1a1a" text-anchor="end">B2 (7.4V)</text>
  <text x="260" y="295" font-size="12" fill="#1a1a1a" text-anchor="end">B1 (3.7V)</text>
  <text x="260" y="355" font-size="12" fill="#1a1a1a" text-anchor="end">B- (0V)</text>

  <!-- Точки виводів акумулятора -->
  <circle cx="270" cy="120" r="4" fill="#c0392b"/>
  <circle cx="270" cy="180" r="4" fill="#2457d6"/>
  <circle cx="270" cy="240" r="4" fill="#2457d6"/>
  <circle cx="270" cy="300" r="4" fill="#2457d6"/>
  <circle cx="270" cy="360" r="4" fill="#1a1a1a"/>


  <!-- Плата BMS -->
  <rect x="690" y="100" width="230" height="280" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="6" />
  <text x="805" y="90" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Плата захисту (BMS)</text>

  <!-- Деталі плати -->
  <rect x="760" y="200" width="40" height="40" fill="#1a1a1a" rx="2"/>
  <rect x="760" y="260" width="20" height="15" fill="#1a1a1a" rx="1"/>
  <rect x="830" y="270" width="20" height="30" fill="#6b7280" rx="1"/>
  <rect x="860" y="270" width="20" height="30" fill="#6b7280" rx="1"/>

  <!-- Виводи BMS (ліворуч) -->
  <text x="705" y="125" font-size="13" font-weight="bold" fill="#1a1a1a">B+</text>
  <text x="705" y="185" font-size="13" fill="#1a1a1a">B3</text>
  <text x="705" y="245" font-size="13" fill="#1a1a1a">B2</text>
  <text x="705" y="305" font-size="13" fill="#1a1a1a">B1</text>
  <text x="705" y="365" font-size="13" font-weight="bold" fill="#1a1a1a">B-</text>

  <circle cx="690" cy="120" r="5" fill="#c0392b"/>
  <circle cx="690" cy="180" r="4" fill="#2457d6"/>
  <circle cx="690" cy="240" r="4" fill="#2457d6"/>
  <circle cx="690" cy="300" r="4" fill="#2457d6"/>
  <circle cx="690" cy="360" r="5" fill="#1a1a1a"/>

  <!-- Виводи BMS (праворуч) -->
  <text x="905" y="165" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">P+</text>
  <text x="905" y="180" font-size="11" fill="#6b7280" text-anchor="end">до навантаження / ЗУ</text>
  <circle cx="920" cy="160" r="5" fill="#c0392b"/>

  <text x="905" y="325" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">P-</text>
  <text x="905" y="340" font-size="11" fill="#6b7280" text-anchor="end">до навантаження / ЗУ</text>
  <circle cx="920" cy="320" r="5" fill="#1a1a1a"/>


  <!-- З'єднувальні лінії та кроки -->
  <!-- Крок 1: B- -->
  <line x1="270" y1="360" x2="680" y2="360" stroke="#1a1a1a" stroke-width="3" marker-end="url(#arr)"/>
  <circle cx="320" cy="360" r="14" fill="#1a1a1a"/>
  <text x="320" y="365" font-size="14" font-weight="bold" fill="white" text-anchor="middle">1</text>
  <text x="500" y="352" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Крок 1. Підключення B- (0V)</text>

  <!-- Крок 2: B1 -->
  <line x1="270" y1="300" x2="680" y2="300" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <circle cx="320" cy="300" r="14" fill="#2457d6"/>
  <text x="320" y="305" font-size="14" font-weight="bold" fill="white" text-anchor="middle">2</text>
  <text x="500" y="292" font-size="13" fill="#1a1a1a" text-anchor="middle">Крок 2. Баланс B1 (3.7V)</text>

  <!-- Крок 3: B2 -->
  <line x1="270" y1="240" x2="680" y2="240" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <circle cx="320" cy="240" r="14" fill="#2457d6"/>
  <text x="320" y="245" font-size="14" font-weight="bold" fill="white" text-anchor="middle">3</text>
  <text x="500" y="232" font-size="13" fill="#1a1a1a" text-anchor="middle">Крок 3. Баланс B2 (7.4V)</text>

  <!-- Крок 4: B3 -->
  <line x1="270" y1="180" x2="680" y2="180" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <circle cx="320" cy="180" r="14" fill="#2457d6"/>
  <text x="320" y="185" font-size="14" font-weight="bold" fill="white" text-anchor="middle">4</text>
  <text x="500" y="172" font-size="13" fill="#1a1a1a" text-anchor="middle">Крок 4. Баланс B3 (11.1V)</text>

  <!-- Крок 5: B+ -->
  <line x1="270" y1="120" x2="680" y2="120" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-red)"/>
  <circle cx="320" cy="120" r="14" fill="#c0392b"/>
  <text x="320" y="125" font-size="14" font-weight="bold" fill="white" text-anchor="middle">5</text>
  <text x="500" y="112" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Крок 5. Підключення B+ (14.8V)</text>

</svg>
