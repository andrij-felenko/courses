<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs>
  <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,1 L7,4 L0,7 Z" fill="#1a1a1a"/>
  </marker>
  <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,1 L7,4 L0,7 Z" fill="#27ae60"/>
  </marker>
  <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
  </marker>
  <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,1 L7,4 L0,7 Z" fill="#c0392b"/>
  </marker>
</defs>

<rect x="0" y="0" width="960" height="460" fill="white"/>

<!-- Title & Subtitle -->
<text x="480" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Архітектура прошивки: кінцевий автомат (FSM) та обробники переривань</text>
<text x="480" y="46" text-anchor="middle" font-size="13" fill="#6b7280">Синхронізація One-Pulse таймера за стробом, фоновий АЦП фотосенсора та аварійні блокування</text>

<!-- ==================== LEFT MAIN CONTAINER (FSM) ==================== -->
<rect x="35" y="75" width="570" height="240" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="35" y="75" width="570" height="28" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="320" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Кінцевий автомат керування лазером (FSM State Machine)</text>

<!-- FSM State 1: IDLE -->
<rect x="55" y="118" width="145" height="68" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="127" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">STATE_IDLE</text>
<text x="127" y="156" text-anchor="middle" font-size="12" fill="#1a1a1a">Очікування стробу</text>
<text x="127" y="172" text-anchor="middle" font-size="12" fill="#6b7280">MOSFET закритий</text>

<!-- FSM State 2: STROBING -->
<rect x="435" y="118" width="155" height="68" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="512" y="138" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">STATE_STROBING</text>
<text x="512" y="156" text-anchor="middle" font-size="12" fill="#1a1a1a">One-Pulse спалах</text>
<text x="512" y="172" text-anchor="middle" font-size="12" fill="#27ae60">MOSFET відкритий</text>

<!-- FSM State 3: COOLDOWN -->
<rect x="435" y="232" width="155" height="68" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
<text x="512" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">STATE_COOLDOWN</text>
<text x="512" y="270" text-anchor="middle" font-size="12" fill="#1a1a1a">Теплова пауза</text>
<text x="512" y="286" text-anchor="middle" font-size="12" fill="#6b7280">MOSFET закритий</text>

<!-- FSM State 4: FAULT -->
<rect x="55" y="232" width="145" height="68" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="127" y="252" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">STATE_FAULT</text>
<text x="127" y="270" text-anchor="middle" font-size="12" fill="#c0392b">Аварійний стан</text>
<text x="127" y="286" text-anchor="middle" font-size="12" fill="#6b7280">Failsafe Lockout</text>

<!-- FSM Transition 1: IDLE -> STROBING -->
<line x1="200" y1="138" x2="430" y2="138" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
<text x="315" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">EXTI: фронт стробу камери</text>

<!-- FSM Transition 2: STROBING -> COOLDOWN -->
<line x1="512" y1="186" x2="512" y2="227" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-black)"/>
<text x="502" y="210" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">TIM: спад стробу</text>

<!-- FSM Transition 3: COOLDOWN -> IDLE -->
<path d="M 435,250 L 360,250 L 360,165 L 205,165" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
<text x="280" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">t_cool минув (D ≤ 5%)</text>

<!-- FSM Transition 4: Fault Trigger (from COOLDOWN/Supervisor into FAULT) -->
<line x1="360" y1="270" x2="205" y2="270" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
<text x="280" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Watchdog / Overheat</text>

<!-- FSM Transition 5: FAULT -> IDLE (Reset) -->
<line x1="95" y1="232" x2="95" y2="191" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
<text x="85" y="212" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">Скидання</text>

<!-- ==================== BOTTOM CARD (TIMING & SAFETY) ==================== -->
<rect x="35" y="330" width="570" height="105" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<text x="47" y="350" font-size="13" font-weight="bold" fill="#1a1a1a">Метрологічні та захисні часові параметри прошивки</text>

<!-- Column 1 -->
<text x="47" y="372" font-size="12" fill="#1a1a1a">• Строб: τ = 50..400 мкс (адаптивний)</text>
<text x="47" y="390" font-size="12" fill="#1a1a1a">• Затримка EXTI: t_lat &lt; 120 нс</text>
<text x="47" y="408" font-size="12" fill="#1a1a1a">• Апаратний таймер One-Pulse TIM1</text>
<text x="47" y="426" font-size="12" fill="#6b7280">• Підстроювання за фотосенсором</text>

<!-- Column 2 -->
<text x="325" y="372" font-size="12" fill="#1a1a1a">• Пауза охолодження: T_cool ≥ 19·τ</text>
<text x="325" y="390" font-size="12" fill="#1a1a1a">• Обмеження шпаруватості: D ≤ 5%</text>
<text x="325" y="408" font-size="12" fill="#1a1a1a">• Сторожовий таймер: t_wdg = 2.0 мс</text>
<text x="325" y="426" font-size="12" fill="#6b7280">• Failsafe блокування затвора</text>

<!-- ==================== RIGHT PANEL ==================== -->
<!-- Card 1: Fast path (Hardware Timers & ISRs) -->
<rect x="625" y="75" width="300" height="170" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="625" y="75" width="300" height="28" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="775" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Швидкий контур: Апаратні ISR</text>

<text x="637" y="120" font-size="12" font-weight="bold" fill="#1a1a1a">• EXTI ISR (Строб-вхід):</text>
<text x="637" y="136" font-size="12" fill="#1a1a1a">  Миттєвий запуск таймера (&lt; 100 нс).</text>
<text x="637" y="156" font-size="12" font-weight="bold" fill="#1a1a1a">• One-Pulse Timer (TIM1_CH1):</text>
<text x="637" y="172" font-size="12" fill="#1a1a1a">  Апаратний спалах на затвор MOSFET.</text>
<text x="637" y="192" font-size="12" font-weight="bold" fill="#1a1a1a">• TIM1 Update ISR (Кінець стробу):</text>
<text x="637" y="208" font-size="12" fill="#1a1a1a">  Переведення FSM у стан COOLDOWN.</text>
<text x="637" y="226" font-size="12" fill="#6b7280">  Запуск захисного таймера паузи.</text>

<!-- Card 2: Slow path (Background loop & ADC) -->
<rect x="625" y="260" width="300" height="175" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="625" y="260" width="300" height="28" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="775" y="279" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Фоновий контур: main() &amp; АЦП</text>

<text x="637" y="306" font-size="12" font-weight="bold" fill="#1a1a1a">• АЦП фотосенсора (Ambient ADC):</text>
<text x="637" y="322" font-size="12" fill="#1a1a1a">  Вимірювання освітленості (10 Гц).</text>
<text x="637" y="342" font-size="12" font-weight="bold" fill="#1a1a1a">• Адаптивна яскравість (EMA):</text>
<text x="637" y="358" font-size="12" fill="#1a1a1a">  Підстроювання тривалості спалаху τ.</text>
<text x="637" y="378" font-size="12" font-weight="bold" fill="#1a1a1a">• Watchdog &amp; Duty Guard:</text>
<text x="637" y="394" font-size="12" fill="#1a1a1a">  Контроль шпаруватості та тайм-ауту.</text>
<text x="637" y="412" font-size="12" fill="#6b7280">  Аварійне блокування при збої зв'язку.</text>

</svg>
