<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-s" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red-s" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue-s" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Біла підкладка полотна -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Принципова схема драйвера автоматичного контролю потужності (APC)</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Оптичний зворотний зв'язок через моніторний фотодіод компенсує температурний дрейф струму лазера</text>

  <!-- ==================== ПАНЕЛЬ 1: ОПОРНА НАПРУГА V_ref ==================== -->
  <rect x="35" y="75" width="180" height="235" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="125" y="97" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Задавання потужності</text>

  <!-- Шина VCC зверху панелі 1 -->
  <line x1="80" y1="120" x2="170" y2="120" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="125" y="114" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">VCC (+5 В)</text>
  <circle cx="125" cy="120" r="3" fill="#1a1a1a"/>

  <!-- Провід до R1 -->
  <line x1="125" y1="120" x2="125" y2="135" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Резистор R1 -->
  <rect x="117" y="135" width="16" height="30" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="142" y="154" font-size="12" fill="#1a1a1a">R1</text>

  <!-- Провід від R1 до R_set -->
  <line x1="125" y1="165" x2="125" y2="185" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="125" cy="185" r="3" fill="#1a1a1a"/>

  <!-- Підлаштовний резистор R_set -->
  <rect x="117" y="185" width="16" height="30" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="142" y="204" font-size="12" fill="#1a1a1a">R_set</text>
  <!-- Стрілка підстроювання R_set -->
  <line x1="105" y1="210" x2="135" y2="190" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-s)"/>

  <!-- Провід від R_set до GND -->
  <line x1="125" y1="215" x2="125" y2="280" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Фільтруючий конденсатор C1 паралельно R_set -->
  <line x1="125" y1="185" x2="75" y2="185" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="75" y1="185" x2="75" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Пластини C1 -->
  <line x1="67" y1="220" x2="83" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="67" y1="226" x2="83" y2="226" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="48" y="227" font-size="12" fill="#6b7280">C1</text>
  <line x1="75" y1="226" x2="75" y2="280" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="75" y1="280" x2="125" y2="280" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Земля панелі 1 -->
  <line x1="125" y1="280" x2="125" y2="295" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="115" y1="295" x2="135" y2="295" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="119" y1="299" x2="131" y2="299" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="123" y1="303" x2="127" y2="303" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Лінія V_ref виходить із вузла (125, 185) до входу ОП (+) на y=240 -->
  <line x1="125" y1="185" x2="175" y2="185" stroke="#27ae60" stroke-width="2"/>
  <line x1="175" y1="185" x2="175" y2="240" stroke="#27ae60" stroke-width="2"/>
  <line x1="175" y1="240" x2="275" y2="240" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="195" y="233" font-size="12" font-weight="700" fill="#27ae60">V_ref</text>

  <!-- ==================== ПАНЕЛЬ 2: ПІДСИЛЮВАЧ ПОХИБКИ ==================== -->
  <rect x="225" y="75" width="205" height="235" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="327" y="97" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Підсилювач похибки</text>

  <!-- Інтегрувальний конденсатор C_int зверху ОП -->
  <line x1="250" y1="200" x2="250" y2="135" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="250" cy="200" r="3" fill="#2457d6"/>
  <line x1="250" y1="135" x2="305" y2="135" stroke="#2457d6" stroke-width="1.5"/>
  <!-- Пластини C_int -->
  <line x1="305" y1="126" x2="305" y2="144" stroke="#2457d6" stroke-width="2"/>
  <line x1="312" y1="126" x2="312" y2="144" stroke="#2457d6" stroke-width="2"/>
  <text x="308" y="120" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">C_int</text>
  <line x1="312" y1="135" x2="375" y2="135" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="375" y1="135" x2="375" y2="220" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="375" cy="220" r="3" fill="#2457d6"/>

  <!-- Вхід V_fb у інвертуючий вхід (-) ОП -->
  <line x1="250" y1="200" x2="275" y2="200" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="245" y="194" font-size="12" font-weight="700" fill="#2457d6" text-anchor="end">V_fb</text>

  <!-- Трикутник операційного підсилювача U1 -->
  <polygon points="275,180 275,260 345,220" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="282" y="204" font-size="14" font-weight="700" fill="#1a1a1a">−</text>
  <text x="282" y="244" font-size="14" font-weight="700" fill="#1a1a1a">+</text>
  <text x="305" y="224" font-size="12" font-weight="700" fill="#2457d6">U1</text>

  <!-- Живлення ОП: V+ і V- -->
  <line x1="310" y1="200" x2="310" y2="168" stroke="#6b7280" stroke-width="1"/>
  <text x="310" y="163" font-size="12" fill="#6b7280" text-anchor="middle">+5 В</text>
  <line x1="310" y1="240" x2="310" y2="272" stroke="#6b7280" stroke-width="1"/>
  <text x="310" y="285" font-size="12" fill="#6b7280" text-anchor="middle">GND</text>

  <!-- Вихід ОП V_err -->
  <line x1="345" y1="220" x2="440" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="390" y="212" font-size="12" fill="#6b7280">V_err</text>

  <!-- ==================== ПАНЕЛЬ 3: ПРОХІДНИЙ ТРАНЗИСТОР ==================== -->
  <rect x="440" y="75" width="180" height="235" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="530" y="97" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Прохідний транзистор</text>

  <!-- Базовий резистор R_b -->
  <line x1="440" y1="220" x2="465" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="465" y="212" width="30" height="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="480" y="205" font-size="12" fill="#1a1a1a" text-anchor="middle">R_b</text>
  <line x1="495" y1="220" x2="520" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Транзистор Q1 (NPN) -->
  <circle cx="535" cy="220" r="22" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <!-- База -->
  <line x1="520" y1="220" x2="528" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="528" y1="206" x2="528" y2="234" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- Колектор -->
  <line x1="528" y1="212" x2="542" y2="202" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="542" y1="202" x2="542" y2="150" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Емітер зі стрілкою -->
  <line x1="528" y1="228" x2="542" y2="238" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="538,241 544,237 544,244" fill="#1a1a1a"/>
  <line x1="542" y1="238" x2="542" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>

  <text x="560" y="216" font-size="12" font-weight="700" fill="#1a1a1a">Q1</text>
  <text x="560" y="230" font-size="12" fill="#6b7280">NPN</text>

  <!-- Емітерний резистор R_e -->
  <rect x="534" y="260" width="16" height="30" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="557" y="279" font-size="12" fill="#1a1a1a">R_e</text>
  <line x1="542" y1="290" x2="542" y2="295" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Земля панелі 3 -->
  <line x1="532" y1="295" x2="552" y2="295" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="536" y1="299" x2="548" y2="299" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="540" y1="303" x2="544" y2="303" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Струм лазера I_LD від LD до колектора Q1 -->
  <line x1="542" y1="150" x2="750" y2="150" stroke="#c0392b" stroke-width="2"/>
  <text x="585" y="142" font-size="12" font-weight="700" fill="#c0392b">Струм I_LD</text>

  <!-- ==================== ПАНЕЛЬ 4: МОДУЛЬ ЛАЗЕРА (TO-18) ==================== -->
  <rect x="630" y="75" width="295" height="235" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="777" y="97" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Лазерний модуль (TO-18, 3 pin)</text>

  <!-- Шина VCC модуля (спільний анод LD і катод PD) -->
  <line x1="680" y1="120" x2="760" y2="120" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="720" y="114" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">VCC (+5 В)</text>
  <circle cx="750" cy="120" r="3" fill="#1a1a1a"/>

  <!-- Захисний діод D_prot антипаралельно LD (розміщений ЛІВОРУЧ від LD на x=690) -->
  <line x1="690" y1="125" x2="690" y2="150" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="690" y1="125" x2="750" y2="125" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="690" y1="150" x2="750" y2="150" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="750" cy="125" r="3" fill="#1a1a1a"/>
  <!-- Діод D_prot стрілкою вгору -->
  <polygon points="683,145 697,145 690,132" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="681" y1="132" x2="699" y2="132" stroke="#6b7280" stroke-width="2"/>
  <text x="650" y="142" font-size="12" fill="#6b7280">D_prot</text>

  <!-- Лазерний діод LD у колонці x=750 -->
  <line x1="750" y1="120" x2="750" y2="135" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Анод зверху, катод знизу -->
  <polygon points="742,135 758,135 750,150" fill="#c0392b" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="740" y1="150" x2="760" y2="150" stroke="#c0392b" stroke-width="2"/>
  <circle cx="750" cy="150" r="3" fill="#1a1a1a"/>
  <text x="720" y="142" font-size="12" font-weight="700" fill="#c0392b">LD</text>

  <!-- ГОЛОВНИЙ ЛАЗЕРНИЙ ПРОМІНЬ (P_opt назовні вправо, повністю вільний простір) -->
  <line x1="760" y1="140" x2="910" y2="140" stroke="#c0392b" stroke-width="4" marker-end="url(#arr-red)"/>
  <text x="840" y="132" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Промінь P_opt</text>

  <!-- ВНУТРІШНІЙ ОПТИЧНИЙ ЗВОРОТНИЙ ЗВ'ЯЗОК ДО PD (вниз) -->
  <line x1="750" y1="155" x2="750" y2="195" stroke="#c0392b" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arr-red-s)"/>
  <text x="758" y="178" font-size="12" fill="#c0392b">Світло (~1%)</text>

  <!-- Моніторний фотодіод PD (нижче LD на x=750) -->
  <line x1="680" y1="120" x2="680" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="680" y1="200" x2="750" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Зворотне ввімкнення: Катод зверху, Анод знизу -->
  <line x1="740" y1="200" x2="760" y2="200" stroke="#2457d6" stroke-width="2"/>
  <polygon points="742,215 758,215 750,200" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="750" y1="215" x2="750" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="715" y="214" font-size="12" font-weight="700" fill="#2457d6">PD</text>

  <!-- Струм фотодіода I_pd -->
  <text x="758" y="228" font-size="12" fill="#2457d6">I_pd</text>

  <!-- Вимірювальне навантаження: R_sense -->
  <circle cx="750" cy="240" r="3" fill="#2457d6"/>
  <text x="715" y="244" font-size="12" font-weight="700" fill="#2457d6">V_fb</text>
  <rect x="742" y="250" width="16" height="30" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="750" y1="240" x2="750" y2="250" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="766" y="269" font-size="12" fill="#1a1a1a">R_sense</text>
  <line x1="750" y1="280" x2="750" y2="295" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Земля панелі 4 -->
  <line x1="740" y1="295" x2="760" y2="295" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="744" y1="299" x2="756" y2="299" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="748" y1="303" x2="752" y2="303" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- ==================== ГОЛОВНА ЛІНІЯ ЗВОРОТНОГО ЗВ'ЯЗКУ (V_fb) ==================== -->
  <path d="M 750,240 L 750,325 L 250,325 L 250,200" fill="none" stroke="#2457d6" stroke-width="2"/>
  <!-- Стрілка напрямку зворотного зв'язку на горизонтальній лінії -->
  <line x1="530" y1="325" x2="490" y2="325" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="510" y="343" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Зворотний зв'язок: V_fb = I_pd · R_sense</text>

  <!-- ==================== ПАНЕЛЬ 5: ПОЯСНЕННЯ ПЕТЛІ ==================== -->
  <rect x="35" y="365" width="890" height="75" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="386" font-size="12" font-weight="700" fill="#2457d6">Петля регулювання APC:</text>
  <text x="210" y="386" font-size="12" fill="#6b7280">підтримання постійної потужності P_opt при зміні температури лазера</text>

  <rect x="55" y="398" width="135" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="122" y="417" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">1. Задання V_ref</text>

  <text x="202" y="417" font-size="14" font-weight="700" fill="#6b7280" text-anchor="middle">→</text>

  <rect x="215" y="398" width="180" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="305" y="417" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">2. ОП порівнює V_ref і V_fb</text>

  <text x="407" y="417" font-size="14" font-weight="700" fill="#6b7280" text-anchor="middle">→</text>

  <rect x="420" y="398" width="160" height="30" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="500" y="417" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">3. Q1 регулює струм I_LD</text>

  <text x="592" y="417" font-size="14" font-weight="700" fill="#6b7280" text-anchor="middle">→</text>

  <rect x="605" y="398" width="150" height="30" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="680" y="417" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">4. LD випромінює P_opt</text>

  <text x="767" y="417" font-size="14" font-weight="700" fill="#6b7280" text-anchor="middle">→</text>

  <rect x="780" y="398" width="135" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="847" y="417" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">5. PD формує V_fb</text>
</svg>
