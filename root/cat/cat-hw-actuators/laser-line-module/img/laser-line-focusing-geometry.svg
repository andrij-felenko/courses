<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="460" fill="#ffffff"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Геометрія розкриття та фокусування лазерної смуги</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Кут віяла задає довжину лінії, а коліматор формує перетяжку з глибиною різкості</text>

  <!-- ВЕРХНЯ ПАНЕЛЬ: Площина віяла (довжина лінії) -->
  <rect x="24" y="68" width="912" height="176" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="38" y="88" font-size="13" font-weight="bold" fill="#1a1a1a">1. Площина віяла (вигляд зверху): кут 2θ та розрахунок довжини лінії L(d)</text>

  <!-- Лазерний модуль з вкладеним блоком лінзи -->
  <rect x="38" y="126" width="106" height="60" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="74" y="152" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Лазерний</text>
  <text x="74" y="168" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">модуль</text>

  <!-- Вкладена оправа лінзи лінії (циліндрична / Павелла) -->
  <rect x="112" y="132" width="26" height="48" rx="2" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M 120 136 Q 134 156 120 176" fill="none" stroke="#2457d6" stroke-width="2"/>
  <text x="125" y="122" font-size="12" fill="#6b7280" text-anchor="middle">Лінза лінії</text>

  <!-- Промінь віяла -->
  <polygon points="144,156 670,104 670,208" fill="#eaf0fd" fill-opacity="0.6"/>
  <line x1="144" y1="156" x2="670" y2="104" stroke="#2457d6" stroke-width="1.8"/>
  <line x1="144" y1="156" x2="670" y2="208" stroke="#2457d6" stroke-width="1.8"/>

  <!-- Оптична вісь -->
  <line x1="144" y1="156" x2="680" y2="156" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Кут віяла 2θ -->
  <path d="M 188 151.7 A 44 44 0 0 1 188 160.3" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <text x="210" y="120" font-size="12" font-weight="bold" fill="#2457d6">Кут віяла 2θ</text>
  <line x1="220" y1="126" x2="194" y2="151" stroke="#2457d6" stroke-width="1" marker-end="url(#arr-blue)"/>

  <!-- Лінія на мішені d1 -->
  <line x1="310" y1="140" x2="310" y2="172" stroke="#2457d6" stroke-width="4" stroke-linecap="round"/>
  <line x1="305" y1="140" x2="315" y2="140" stroke="#2457d6" stroke-width="1"/>
  <line x1="305" y1="172" x2="315" y2="172" stroke="#2457d6" stroke-width="1"/>
  <text x="310" y="132" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">L₁</text>
  <text x="310" y="230" font-size="12" fill="#6b7280" text-anchor="middle">Мішень d₁</text>

  <!-- Лінія на розрахунковій мішені d0 (фокус) -->
  <line x1="480" y1="123" x2="480" y2="189" stroke="#27ae60" stroke-width="2" stroke-linecap="round"/>
  <line x1="475" y1="123" x2="485" y2="123" stroke="#27ae60" stroke-width="1"/>
  <line x1="475" y1="189" x2="485" y2="189" stroke="#27ae60" stroke-width="1"/>
  <text x="480" y="114" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">L₀ (фокус)</text>
  <text x="480" y="222" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Розрахункова мішень d₀</text>
  <text x="480" y="236" font-size="12" fill="#27ae60" text-anchor="middle">(найтонша смуга)</text>

  <!-- Лінія на мішені d2 -->
  <line x1="650" y1="106" x2="650" y2="206" stroke="#2457d6" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="645" y1="106" x2="655" y2="106" stroke="#2457d6" stroke-width="1"/>
  <line x1="645" y1="206" x2="655" y2="206" stroke="#2457d6" stroke-width="1"/>
  <text x="650" y="98" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">L₂</text>
  <text x="650" y="230" font-size="12" fill="#6b7280" text-anchor="middle">Мішень d₂</text>

  <!-- Картка розрахунку довжини смуги -->
  <rect x="706" y="80" width="218" height="150" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="815" y="98" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Геометрія розгортки смуги</text>
  <rect x="718" y="108" width="194" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="815" y="127" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">L(d) = 2 · d · tg(θ)</text>
  <text x="718" y="152" font-size="12" fill="#1a1a1a">• 2θ — повний кут віяла</text>
  <text x="718" y="170" font-size="12" fill="#1a1a1a">• d — відстань до мішені</text>
  <text x="718" y="188" font-size="12" fill="#6b7280">• L зростає лінійно з d</text>
  <text x="718" y="206" font-size="12" fill="#6b7280">• яскравість спадає як 1/d</text>
  <text x="718" y="222" font-size="12" fill="#27ae60">• товщина не залежить від θ</text>

  <!-- Сполучні вертикальні пунктири між панелями -->
  <line x1="310" y1="244" x2="310" y2="256" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="480" y1="244" x2="480" y2="256" stroke="#27ae60" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="650" y1="244" x2="650" y2="256" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- НИЖНЯ ПАНЕЛЬ: Площина фокусування (товщина лінії) -->
  <rect x="24" y="256" width="912" height="182" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="38" y="274" font-size="13" font-weight="bold" fill="#1a1a1a">2. Площина фокусування (вигляд збоку): перетяжка 2w₀, глибина Релея 2z_R та юстування</text>

  <!-- Лазерний діод -->
  <rect x="44" y="336" width="18" height="20" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="53" y="328" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Діод</text>

  <!-- Промені від діода до лінзи коліматора -->
  <line x1="62" y1="344" x2="74" y2="340" stroke="#c0392b" stroke-width="1"/>
  <line x1="62" y1="348" x2="74" y2="352" stroke="#c0392b" stroke-width="1"/>

  <!-- Різьбова оправа коліматора -->
  <rect x="74" y="324" width="68" height="44" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="82" y1="324" x2="82" y2="330" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="82" y1="362" x2="82" y2="368" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="92" y1="324" x2="92" y2="330" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="92" y1="362" x2="92" y2="368" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="102" y1="324" x2="102" y2="330" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="102" y1="362" x2="102" y2="368" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="112" y1="324" x2="112" y2="330" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="112" y1="362" x2="112" y2="368" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 124 328 Q 138 346 124 364 Q 110 346 124 328 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Стрілки та підписи юстування коліматора -->
  <line x1="108" y1="310" x2="84" y2="310" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="108" y1="310" x2="132" y2="310" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="108" y="302" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Різьбова оправа</text>
  <text x="108" y="388" font-size="12" fill="#2457d6" text-anchor="middle">Обертання: ±Δz</text>
  <text x="108" y="404" font-size="12" fill="#6b7280" text-anchor="middle">переміщує фокус</text>

  <!-- Зона Релея (DOF) -->
  <rect x="420" y="326" width="120" height="40" rx="4" fill="#e9f7ef" fill-opacity="0.6" stroke="#27ae60" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Сфокусований промінь коліматора (перетяжка) -->
  <path d="M 144 334 C 250 339, 410 343, 480 343 C 550 343, 610 338, 670 334 L 670 358 C 610 354, 550 349, 480 349 C 410 349, 250 353, 144 358 Z" fill="#eaf0fd" fill-opacity="0.6" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Оптична вісь нижньої панелі -->
  <line x1="50" y1="346" x2="680" y2="346" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Розмірність глибини різкості Релея -->
  <line x1="420" y1="318" x2="540" y2="318" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="420" y1="313" x2="420" y2="323" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="540" y1="313" x2="540" y2="323" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="310" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Глибина різкості Релея 2z_R</text>

  <!-- Вказівник перетяжки 2w0 -->
  <line x1="480" y1="370" x2="480" y2="352" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="480" y="390" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Перетяжка 2w₀</text>
  <text x="480" y="404" font-size="12" fill="#27ae60" text-anchor="middle">найменша товщина</text>
  <text x="480" y="418" font-size="12" fill="#6b7280" text-anchor="middle">2w ≤ √2 · 2w₀ у зоні 2z_R</text>

  <!-- Вказівник недофокусу при d1 -->
  <line x1="310" y1="370" x2="310" y2="355" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="310" y="390" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">2w₁ &gt; 2w₀</text>
  <text x="310" y="404" font-size="12" fill="#c0392b" text-anchor="middle">недофокус</text>
  <text x="310" y="418" font-size="12" fill="#6b7280" text-anchor="middle">(товста смуга)</text>

  <!-- Вказівник перефокусу при d2 -->
  <line x1="650" y1="370" x2="650" y2="358" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="650" y="390" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">2w₂ &gt; 2w₀</text>
  <text x="650" y="404" font-size="12" fill="#c0392b" text-anchor="middle">перефокус</text>
  <text x="650" y="418" font-size="12" fill="#6b7280" text-anchor="middle">(розмита смуга)</text>

  <!-- Картка результатів та юстування -->
  <rect x="706" y="266" width="218" height="162" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="815" y="284" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вигляд смуги та юстування</text>

  <line x1="718" y1="304" x2="738" y2="304" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>
  <text x="748" y="308" font-size="12" fill="#c0392b">d₁: коротка, товста</text>

  <line x1="718" y1="324" x2="738" y2="324" stroke="#27ae60" stroke-width="1.8" stroke-linecap="round"/>
  <text x="748" y="328" font-size="12" font-weight="bold" fill="#27ae60">d₀: різка (фокус 2w₀)</text>

  <line x1="718" y1="344" x2="738" y2="344" stroke="#c0392b" stroke-width="6" stroke-linecap="round"/>
  <text x="748" y="348" font-size="12" fill="#c0392b">d₂: довга, розмита</text>

  <line x1="716" y1="358" x2="914" y2="358" stroke="#d0d7de" stroke-width="0.75"/>

  <text x="718" y="374" font-size="12" font-weight="bold" fill="#1a1a1a">Правило фокусування:</text>
  <text x="718" y="392" font-size="12" fill="#2457d6">• Оправа вперед → фокус далі</text>
  <text x="718" y="410" font-size="12" fill="#2457d6">• Оправа назад → фокус ближче</text>
</svg>
