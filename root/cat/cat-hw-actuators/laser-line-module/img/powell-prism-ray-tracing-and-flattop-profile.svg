<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Біла підкладка полотна -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Хід променів у призмі Павелла та формування Flat-Top профілю</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Асферичний гребінь розсіює надлишок енергії центру на периферію, вирівнюючи інтенсивність лінії</text>

  <!-- ==================== ЛІВА ПАНЕЛЬ: ОПТИЧНЕ ТРАСУВАННЯ ==================== -->
  <rect x="35" y="75" width="545" height="280" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="307" y="98" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">Оптичний хід променів: перерозподіл енергії гребенем</text>

  <!-- Оптична вісь (штрихпунктир) -->
  <line x1="55" y1="200" x2="530" y2="200" stroke="#d0d7de" stroke-width="1" stroke-dasharray="6 3 2 3"/>

  <!-- Вхідний гаусів пучок (заливка) -->
  <polygon points="55,160 195,160 195,240 55,240" fill="#fdecea" opacity="0.45"/>
  <text x="120" y="132" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Вхідний пучок d_вх</text>
  <text x="120" y="148" font-size="12" fill="#6b7280" text-anchor="middle">(гаусів розподіл)</text>

  <!-- Вхідні промені (паралельні) -->
  <line x1="55" y1="160" x2="215" y2="160" stroke="#c0392b" stroke-width="1.2"/>
  <line x1="55" y1="178" x2="204" y2="178" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="55" y1="193" x2="197" y2="193" stroke="#c0392b" stroke-width="2"/>
  <line x1="55" y1="200" x2="195" y2="200" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="55" y1="207" x2="197" y2="207" stroke="#c0392b" stroke-width="2"/>
  <line x1="55" y1="222" x2="204" y2="222" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="55" y1="240" x2="215" y2="240" stroke="#c0392b" stroke-width="1.2"/>

  <!-- Тіло призми Павелла з асферичним дахоподібним гребенем -->
  <path d="M 215,145 Q 202,175 195,200 Q 202,225 215,255 L 250,255 L 250,145 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
  <text x="232" y="137" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Призма Павелла</text>
  <text x="195" y="274" font-size="12" fill="#2457d6" text-anchor="middle">Асферична вершина</text>
  <text x="195" y="290" font-size="12" fill="#6b7280" text-anchor="middle">(висока кривина r_apex)</text>

  <!-- Віяло вихідних променів: заломлення та розгортка -->
  <polygon points="250,145 528,115 528,285 250,255" fill="#e9f7ef" opacity="0.4"/>

  <!-- Заломлені промені всередині та на виході -->
  <!-- Крайові промені (помірне заломлення) -->
  <line x1="250" y1="150" x2="528" y2="115" stroke="#27ae60" stroke-width="1.2"/>
  <line x1="250" y1="250" x2="528" y2="285" stroke="#27ae60" stroke-width="1.2"/>

  <!-- Промені біля центру (сильне заломлення на вершині, викид назовні) -->
  <line x1="250" y1="180" x2="528" y2="145" stroke="#27ae60" stroke-width="1.8"/>
  <line x1="250" y1="220" x2="528" y2="255" stroke="#27ae60" stroke-width="1.8"/>

  <!-- Проміжні промені -->
  <line x1="250" y1="165" x2="528" y2="175" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="250" y1="235" x2="528" y2="225" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Осьовий промінь -->
  <line x1="250" y1="200" x2="528" y2="200" stroke="#27ae60" stroke-width="1.2"/>

  <!-- Екран мішені -->
  <line x1="528" y1="105" x2="528" y2="295" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="528" y1="115" x2="528" y2="285" stroke="#27ae60" stroke-width="5" stroke-linecap="round"/>

  <!-- Картка пояснення зсуву енергії під віялом -->
  <rect x="250" y="306" width="220" height="24" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="360" y="322" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Зсув енергії центру на периферію</text>

  <!-- Підпис екрана -->
  <text x="520" y="314" font-size="12" font-weight="700" fill="#27ae60" text-anchor="end">Екран мішені</text>
  <text x="520" y="330" font-size="12" fill="#6b7280" text-anchor="end">Світлова лінія Flat-Top</text>

  <!-- ==================== ПРАВА ПАНЕЛЬ: ПОРІВНЯННЯ ПРОФІЛІВ ==================== -->
  <rect x="595" y="75" width="330" height="280" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="760" y="98" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Розподіл освітленості на екрані</text>

  <!-- Осі графіка I(x) -->
  <line x1="635" y1="215" x2="905" y2="215" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="635" y1="215" x2="635" y2="115" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="630" y="118" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">I</text>
  <text x="905" y="228" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">x</text>

  <!-- Гаусова крива (циліндрична лінза) - червоний пунктир -->
  <path d="M 645,214 C 690,214 730,205 750,165 C 762,140 766,122 770,122 C 774,122 778,140 790,165 C 810,205 850,214 895,214" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="770" y="114" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Гаусів пік</text>

  <!-- Flat-Top крива (призма Павелла) - зелена суцільна з заливкою -->
  <polygon points="665,214 675,148 865,148 875,214" fill="#e9f7ef" opacity="0.8"/>
  <path d="M 645,214 L 665,214 L 675,148 L 865,148 L 875,214 L 895,214" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Бейдж Flat-Top (праворуч від піка) -->
  <rect x="785" y="125" width="105" height="18" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="837" y="138" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Flat-Top (±5%)</text>

  <!-- Картка 1: Призма Павелла -->
  <rect x="615" y="244" width="290" height="38" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="625" y="260" font-size="12" font-weight="700" fill="#27ae60">Призма Павелла: однорідність ±5%</text>
  <text x="625" y="275" font-size="12" fill="#1a1a1a">Стабільний SNR, точний пошук піку лінії</text>

  <!-- Картка 2: Циліндрична лінза -->
  <rect x="615" y="296" width="290" height="38" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="625" y="312" font-size="12" font-weight="700" fill="#c0392b">Циліндрична лінза: гаусів спад</text>
  <text x="625" y="327" font-size="12" fill="#1a1a1a">Пересвіт центру, темні краї, втрата точності</text>

  <!-- ==================== НИЖНЯ ПАНЕЛЬ: ПОЯСНЕННЯ ==================== -->
  <rect x="35" y="368" width="890" height="72" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="388" font-size="12" font-weight="700" fill="#1a1a1a">Фізичний принцип перерозподілу енергії у призмі Павелла:</text>
  <text x="55" y="407" font-size="12" fill="#6b7280">1. Асферична дахоподібна вершина вносить контрольовану сферичну аберацію: сильно заломлює центральні промені на краї віяла.</text>
  <text x="55" y="425" font-size="12" fill="#6b7280">2. На відміну від звичайної лінзи, надлишок потужності серцевини пучка вирівнює яскравість периферії без втрат на діафрагмуванні.</text>
</svg>
