<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-rev" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- ==================== ЗАГОЛОВОК ТА ПІДЗАГОЛОВОК ==================== -->
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Осцилограма комутаційного імпульсу та калібрування фокуса лінії</text>
  <text x="480" y="48" text-anchor="middle" font-size="13" fill="#6b7280">Апериодичний фронт без викидів захищає діод, а точне юстування формує мінімальну ширину перетяжки</text>

  <!-- ==================== ЛІВА ПАНЕЛЬ: ОСЦИЛОГРАМА СТРУМУ ==================== -->
  <rect x="25" y="65" width="445" height="285" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="86" font-size="13" font-weight="700" fill="#1a1a1a">1. Осцилограма комутаційного імпульсу струму</text>

  <!-- Екран осцилографа -->
  <rect x="40" y="96" width="415" height="152" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Базова лінія 0 мА -->
  <line x1="50" y1="224" x2="435" y2="224" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="440" y="228" font-size="12" font-weight="700" fill="#1a1a1a">t</text>

  <!-- Вісь струму I(t) -->
  <line x1="75" y1="235" x2="75" y2="104" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="75" y="100" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">I</text>

  <!-- Позначки рівнів струму та поділки осі -->
  <line x1="71" y1="124" x2="75" y2="124" stroke="#c0392b" stroke-width="1.5"/>
  <text x="68" y="128" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b">I_max</text>

  <line x1="71" y1="156" x2="75" y2="156" stroke="#2457d6" stroke-width="1.5"/>
  <text x="68" y="160" text-anchor="end" font-size="12" font-weight="700" fill="#2457d6">I_ном</text>

  <line x1="71" y1="224" x2="75" y2="224" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="68" y="228" text-anchor="end" font-size="12" fill="#6b7280">0</text>

  <!-- Пунктир рівня I_max -->
  <line x1="75" y1="124" x2="105" y2="124" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="380" y1="124" x2="435" y2="124" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Крива 1: Недемпфований комутаційний викид і дзвін (Червона) -->
  <path d="M 75,224 L 95,224 L 112,110 L 126,182 L 140,144 L 154,162 L 168,156 L 430,156" fill="none" stroke="#c0392b" stroke-width="1.6"/>
  <text x="175" y="122" font-size="12" font-weight="700" fill="#c0392b">Викид струму (загроза COD кристала)</text>

  <!-- Крива 2: Демпфований апериодичний імпульс (Зелена) -->
  <path d="M 75,224 L 95,224 C 110,224 122,158 150,156 L 430,156" fill="none" stroke="#27ae60" stroke-width="2.2"/>
  <text x="175" y="180" font-size="12" font-weight="700" fill="#27ae60">Демпфований фронт (RC + ферит)</text>

  <!-- Пояснювальний блок у лівій панелі -->
  <rect x="40" y="256" width="415" height="82" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="52" y="274" font-size="12" font-weight="700" fill="#1a1a1a">Вимоги до форми струмового імпульсу:</text>
  <text x="52" y="292" font-size="12" fill="#27ae60">• Відсутність викиду: овершут &lt; 5% захищає оптичні дзеркала діода.</text>
  <text x="52" y="308" font-size="12" fill="#1a1a1a">• Придушення дзвону: RC-ланцюг поглинає енергію паразитної L_пар.</text>
  <text x="52" y="324" font-size="12" fill="#6b7280">• Час наростання: t_r ≈ 10–20 нс забезпечує чіткі імпульси без завалів.</text>

  <!-- ==================== ПРАВА ПАНЕЛЬ: КАЛІБРУВАННЯ ФОКУСА ==================== -->
  <rect x="485" y="65" width="450" height="285" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="505" y="86" font-size="13" font-weight="700" fill="#1a1a1a">2. Стенд оптичного калібрування ширини лінії</text>

  <!-- Стенд оптики та мішені -->
  <rect x="500" y="96" width="420" height="152" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Корпус лазерного модуля -->
  <rect x="512" y="140" width="58" height="48" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.3"/>
  <text x="541" y="168" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Модуль</text>

  <!-- Фокусувальна насадка / кільце М9 -->
  <rect x="570" y="146" width="16" height="36" rx="2" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="578" y="138" text-anchor="middle" font-size="12" fill="#6b7280">Різьба M9</text>

  <!-- Світловий пучок (конвергенція в талію та дивергенція) -->
  <polygon points="586,152 746,161 876,150 876,178 746,167 586,176" fill="#fdecea" fill-opacity="0.8" stroke="#c0392b" stroke-width="1"/>
  <!-- Оптична вісь -->
  <line x1="586" y1="164" x2="880" y2="164" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- Калібрувальна мішень у площині Z = Z_роб -->
  <line x1="746" y1="118" x2="746" y2="208" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="738" y="208" width="16" height="6" fill="#1a1a1a"/>
  <!-- Штрихи шкали мішені -->
  <line x1="742" y1="140" x2="746" y2="140" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="740" y1="150" x2="746" y2="150" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="742" y1="160" x2="746" y2="160" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="742" y1="168" x2="746" y2="168" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="740" y1="178" x2="746" y2="178" stroke="#1a1a1a" stroke-width="1.2"/>

  <!-- Позначення мішені та талії лінії -->
  <text x="746" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Мішень (Z = Z_роб)</text>
  <text x="758" y="140" font-size="12" font-weight="700" fill="#27ae60">Талія 2w_0</text>
  <text x="758" y="154" font-size="12" fill="#27ae60">мін. FWHM</text>

  <!-- Розмірна лінія робочої відстані -->
  <line x1="586" y1="228" x2="746" y2="228" stroke="#1a1a1a" stroke-width="1.2" marker-start="url(#arr-rev)" marker-end="url(#arr)"/>
  <text x="666" y="222" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Робоча дистанція L_роб</text>

  <!-- Пояснювальний блок у правій панелі -->
  <rect x="500" y="256" width="420" height="82" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="512" y="274" font-size="12" font-weight="700" fill="#1a1a1a">Методика юстування ширини лазерної лінії:</text>
  <text x="512" y="292" font-size="12" fill="#27ae60">• Обертання об'єктива фокусує перетяжку 2w_0 точно на мішень.</text>
  <text x="512" y="308" font-size="12" fill="#1a1a1a">• Фіксація положення: різьбова втулка стопориться контргайкою.</text>
  <text x="512" y="324" font-size="12" fill="#6b7280">• Критерій точності: симетричний гауссів профіль без дифракційних вусів.</text>

  <!-- ==================== НИЖНЯ ПАНЕЛЬ: ПІДСУМКОВІ ВИСНОВКИ ==================== -->
  <rect x="25" y="362" width="910" height="78" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="382" font-size="12" font-weight="700" fill="#1a1a1a">Підсумковий інженерний регламент комплексного калібрування:</text>
  <text x="45" y="401" font-size="12" fill="#1a1a1a">1. Електрична валідація: апериодичний фронт без викидів запобігає миттєвій оптичній деградації фасеток діода (COD).</text>
  <text x="45" y="419" font-size="12" fill="#1a1a1a">2. Оптичне фокусування: мінімізація ширини лінії на робочій дистанції забезпечує найвищу точність тріангуляційного алгоритму COG.</text>
  <text x="45" y="435" font-size="12" fill="#6b7280">Лише узгодження електричного демпфування з прецизійним фокусуванням гарантує надійність вимірювального сканера.</text>
</svg>
