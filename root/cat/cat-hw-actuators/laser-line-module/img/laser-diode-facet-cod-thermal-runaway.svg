<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Тепловий розгін і катастрофічне оптичне руйнування грані (COD)</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Позитивний зворотний зв'язок між нагріванням і оптичним поглинанням плавить дзеркало за наносекунди</text>

  <!-- CARD 1: Surface Defects & Recombination -->
  <rect x="30" y="85" width="205" height="230" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="30" y="85" width="205" height="32" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="132" y="106" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Дефекти на грані</text>

  <!-- Card 1 mini-diagram -->
  <rect x="44" y="128" width="112" height="60" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="100" y="152" font-size="12" fill="#1a1a1a" text-anchor="middle">Кристал діода</text>
  <text x="100" y="170" font-size="12" fill="#6b7280" text-anchor="middle">(GaAs / InP)</text>
  <line x1="156" y1="124" x2="156" y2="192" stroke="#2457d6" stroke-width="3"/>
  <circle cx="156" cy="138" r="3.5" fill="#c0392b"/>
  <circle cx="156" cy="158" r="3.5" fill="#c0392b"/>
  <circle cx="156" cy="178" r="3.5" fill="#c0392b"/>
  <text x="166" y="152" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">Пастки</text>
  <text x="166" y="170" font-size="12" fill="#6b7280" text-anchor="start">грані</text>

  <!-- Card 1 text bullets -->
  <text x="42" y="214" font-size="12" font-weight="bold" fill="#1a1a1a">• Обірвані зв'язки грані</text>
  <text x="42" y="234" font-size="12" fill="#1a1a1a">• Пастки в забороненій зоні</text>
  <text x="42" y="254" font-size="12" font-weight="bold" fill="#c0392b">• Безвипромінювальна</text>
  <text x="50" y="272" font-size="12" fill="#c0392b">рекомбінація струму</text>
  <text x="42" y="294" font-size="12" fill="#6b7280">• Локальне виділення тепла</text>

  <!-- Arrow Card 1 -> Card 2 -->
  <line x1="235" y1="185" x2="259" y2="185" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="251" y="175" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Тепло</text>

  <!-- CARD 2: Bandgap Shrinkage -->
  <rect x="267" y="85" width="205" height="230" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="267" y="85" width="205" height="32" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="369" y="106" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">2. Звуження зони Eg</text>

  <!-- Card 2 mini-diagram: band gap comparison -->
  <text x="310" y="132" font-size="12" fill="#6b7280" text-anchor="middle">В об'ємі</text>
  <rect x="282" y="136" width="56" height="10" rx="2" fill="#d0d7de"/>
  <text x="310" y="159" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Eg(0)</text>
  <rect x="282" y="165" width="56" height="10" rx="2" fill="#d0d7de"/>

  <line x1="344" y1="155" x2="368" y2="155" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="356" y="147" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+T</text>

  <text x="418" y="132" font-size="12" fill="#c0392b" text-anchor="middle">На грані</text>
  <rect x="382" y="142" width="72" height="10" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="418" y="160" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Eg(T) ↓</text>
  <rect x="382" y="165" width="72" height="10" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>

  <!-- Card 2 text bullets -->
  <text x="279" y="214" font-size="12" font-weight="bold" fill="#1a1a1a">• Нагрів решітки грані</text>
  <text x="279" y="234" font-size="12" fill="#1a1a1a">• Теплове звуження Eg(T)</text>
  <text x="279" y="254" font-size="12" font-weight="bold" fill="#c0392b">• Умова поглинання:</text>
  <text x="287" y="272" font-size="12" fill="#c0392b">hν (фотони) ≥ Eg(грань)</text>
  <text x="279" y="294" font-size="12" fill="#6b7280">• Грань стає непрозорою</text>

  <!-- Arrow Card 2 -> Card 3 -->
  <line x1="472" y1="185" x2="496" y2="185" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="484" y="175" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">hν ≥ Eg</text>

  <!-- CARD 3: Optical Absorption -->
  <rect x="504" y="85" width="205" height="230" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="504" y="85" width="205" height="32" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="606" y="106" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">3. Оптичне поглинання</text>

  <!-- Card 3 mini-diagram: laser beam absorption -->
  <text x="540" y="132" font-size="12" fill="#c0392b" text-anchor="middle">Лазерний потік</text>
  <line x1="514" y1="145" x2="568" y2="145" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="514" y1="158" x2="568" y2="158" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <line x1="514" y1="171" x2="568" y2="171" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <rect x="574" y="136" width="34" height="46" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="591" y="154" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Q↑↑</text>
  <text x="591" y="170" font-size="12" fill="#c0392b" text-anchor="middle">Тепло</text>

  <line x1="612" y1="158" x2="685" y2="158" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr)"/>
  <text x="650" y="148" font-size="12" fill="#6b7280" text-anchor="middle">Ослаблення</text>

  <!-- Card 3 text bullets -->
  <text x="516" y="214" font-size="12" font-weight="bold" fill="#1a1a1a">• Пряме поглинання світла</text>
  <text x="516" y="234" font-size="12" fill="#1a1a1a">• Щільність &gt; 1 МВт/см²</text>
  <text x="516" y="254" font-size="12" font-weight="bold" fill="#c0392b">• Потужність променя</text>
  <text x="524" y="272" font-size="12" fill="#c0392b">переходить у тепло</text>
  <text x="516" y="294" font-size="12" fill="#6b7280">• Запуск лавинного розгону</text>

  <!-- Arrow Card 3 -> Card 4 -->
  <line x1="709" y1="185" x2="737" y2="185" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="723" y="165" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">T крит</text>
  <text x="723" y="179" font-size="12" fill="#c0392b" text-anchor="middle">&gt;1200°C</text>

  <!-- CARD 4: COD Failure -->
  <rect x="745" y="85" width="185" height="230" rx="8" ry="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <rect x="745" y="85" width="185" height="32" rx="8" fill="#c0392b"/>
  <text x="837" y="106" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">4. Плавлення грані (COD)</text>

  <!-- Card 4 mini-diagram: damage crater -->
  <rect x="758" y="128" width="94" height="58" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <path d="M852,138 C836,146 836,168 852,176 Z" fill="#1a1a1a"/>
  <text x="804" y="152" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">КРАТЕР</text>
  <text x="804" y="168" font-size="12" fill="#c0392b" text-anchor="middle">ПЛАВЛЕННЯ</text>

  <!-- Beam blocked / destroyed indicator -->
  <line x1="868" y1="146" x2="892" y2="170" stroke="#c0392b" stroke-width="3"/>
  <line x1="868" y1="170" x2="892" y2="146" stroke="#c0392b" stroke-width="3"/>
  <text x="880" y="184" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">НЕМАЄ</text>

  <!-- Card 4 text bullets -->
  <text x="755" y="214" font-size="12" font-weight="bold" fill="#c0392b">• Температура &gt; 1200 °C</text>
  <text x="755" y="234" font-size="12" fill="#1a1a1a">• Термічне плавлення</text>
  <text x="755" y="254" font-size="12" fill="#1a1a1a">• Руйнування дзеркала</text>
  <text x="755" y="272" font-size="12" fill="#6b7280">• Зрив оптичного зв'язку</text>
  <text x="755" y="294" font-size="12" font-weight="bold" fill="#c0392b">• Незворотна загибель</text>

  <!-- BOTTOM ROW -->

  <!-- Left Bottom Box: Initial Cause -->
  <rect x="30" y="345" width="205" height="80" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="132" y="369" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ПОЧАТКОВИЙ СТАН</text>
  <text x="132" y="389" font-size="12" fill="#1a1a1a" text-anchor="middle">Струм накачування діода</text>
  <text x="132" y="407" font-size="12" fill="#6b7280" text-anchor="middle">та дефекти обриву ґратки</text>

  <!-- Center Bottom Box: Positive Thermal Feedback Loop -->
  <rect x="267" y="345" width="442" height="80" rx="8" ry="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="488" y="368" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">ПОЗИТИВНИЙ ТЕПЛОВИЙ ЗВОРОТНИЙ ЗВ'ЯЗОК (РОЗГІН)</text>
  <text x="488" y="388" font-size="12" fill="#1a1a1a" text-anchor="middle">Поглинання світла виділяє додаткове тепло → температура грані стрімко зростає</text>
  <text x="488" y="407" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Лавинне звуження Eg триває одиниці наносекунд аж до розплавлення дзеркала</text>

  <!-- Vertical loop arrows connecting Card 3, Feedback Box, and Card 2 -->
  <line x1="606" y1="315" x2="606" y2="339" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="622" y="333" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">+Q оптичне</text>

  <line x1="369" y1="345" x2="369" y2="321" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="353" y="333" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">+ΔT розгону</text>

  <!-- Right Bottom Box: Final State -->
  <rect x="745" y="345" width="185" height="80" rx="8" ry="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="837" y="369" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">КІНЦЕВИЙ СТАН</text>
  <text x="837" y="389" font-size="12" fill="#1a1a1a" text-anchor="middle">Втрата когерентності</text>
  <text x="837" y="407" font-size="12" fill="#6b7280" text-anchor="middle">Перетворення на LED</text>

</svg>
