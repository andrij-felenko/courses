<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Температурний дрейф довжини хвилі діода та дифракційна похибка</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Зсув λ на +0.25 нм/°C змінює кут дифракції DOE, спричиняючи температурне дихання лінії</text>

  <!-- LEFT PANEL: Graph lambda(T) -->
  <rect x="30" y="78" width="435" height="252" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="30" y="78" width="435" height="30" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="247" y="98" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Зсув довжини хвилі діода від температури: λ(T)</text>

  <!-- Axes -->
  <line x1="80" y1="236" x2="445" y2="236" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="95" y1="240" x2="95" y2="120" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="440" y="228" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">T (°C)</text>
  <text x="100" y="132" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">λ (нм)</text>

  <!-- Ticks on X axis -->
  <line x1="145" y1="233" x2="145" y2="239" stroke="#6b7280" stroke-width="1.5"/>
  <text x="145" y="252" font-size="12" fill="#6b7280" text-anchor="middle">20°C</text>

  <line x1="235" y1="233" x2="235" y2="239" stroke="#6b7280" stroke-width="1.5"/>
  <text x="235" y="252" font-size="12" fill="#6b7280" text-anchor="middle">40°C</text>

  <line x1="325" y1="233" x2="325" y2="239" stroke="#6b7280" stroke-width="1.5"/>
  <text x="325" y="252" font-size="12" fill="#6b7280" text-anchor="middle">60°C</text>

  <line x1="415" y1="233" x2="415" y2="239" stroke="#6b7280" stroke-width="1.5"/>
  <text x="415" y="252" font-size="12" fill="#6b7280" text-anchor="middle">80°C</text>

  <!-- Ticks on Y axis -->
  <line x1="92" y1="205" x2="98" y2="205" stroke="#6b7280" stroke-width="1.5"/>
  <text x="88" y="209" font-size="12" fill="#6b7280" text-anchor="end">650</text>

  <line x1="92" y1="175" x2="98" y2="175" stroke="#6b7280" stroke-width="1.5"/>
  <text x="88" y="179" font-size="12" fill="#6b7280" text-anchor="end">655</text>

  <line x1="92" y1="145" x2="98" y2="145" stroke="#6b7280" stroke-width="1.5"/>
  <text x="88" y="149" font-size="12" fill="#6b7280" text-anchor="end">660</text>

  <!-- Delta T and Delta lambda guidelines -->
  <line x1="145" y1="205" x2="325" y2="205" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="325" y1="205" x2="325" y2="145" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- lambda(T) trend line -->
  <line x1="125" y1="212" x2="395" y2="122" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Operating Points -->
  <circle cx="145" cy="205" r="4.5" fill="#2457d6"/>
  <circle cx="325" cy="145" r="4.5" fill="#c0392b"/>

  <!-- Drift Rate Callout Card -->
  <rect x="105" y="132" width="134" height="34" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="172" y="146" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Дрейф спектра:</text>
  <text x="172" y="160" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+0.25 нм / °C</text>

  <!-- Delta lambda label -->
  <text x="335" y="180" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">Δλ = +10 нм</text>

  <!-- Left Panel bottom note -->
  <rect x="42" y="278" width="411" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="247" y="295" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Звуження забороненої зони Eg(T) зсуває спектр:</text>
  <text x="247" y="311" font-size="12" fill="#6b7280" text-anchor="middle">нагрів модуля на 40°C зміщує випромінювання на +10 нм</text>


  <!-- RIGHT PANEL: Diffraction Error on DOE -->
  <rect x="495" y="78" width="435" height="252" rx="8" ry="8" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="495" y="78" width="435" height="30" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="712" y="98" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Кутове відхилення DOE: sin θ = m·λ / d</text>

  <!-- DOE Grating plate -->
  <rect x="545" y="130" width="10" height="70" rx="2" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="545" y1="140" x2="555" y2="140" stroke="#c0392b" stroke-width="1"/>
  <line x1="545" y1="150" x2="555" y2="150" stroke="#c0392b" stroke-width="1"/>
  <line x1="545" y1="160" x2="555" y2="160" stroke="#c0392b" stroke-width="1"/>
  <line x1="545" y1="170" x2="555" y2="170" stroke="#c0392b" stroke-width="1"/>
  <line x1="545" y1="180" x2="555" y2="180" stroke="#c0392b" stroke-width="1"/>
  <line x1="545" y1="190" x2="555" y2="190" stroke="#c0392b" stroke-width="1"/>
  <text x="550" y="122" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">DOE-ґратка</text>
  <text x="550" y="214" font-size="12" fill="#6b7280" text-anchor="middle">період d</text>

  <!-- Input beam -->
  <line x1="505" y1="165" x2="545" y2="165" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Cold diffracted rays (20°C, blue solid) -->
  <line x1="555" y1="165" x2="800" y2="145" stroke="#2457d6" stroke-width="2"/>
  <line x1="555" y1="165" x2="800" y2="185" stroke="#2457d6" stroke-width="2"/>

  <!-- Hot diffracted rays (60°C, red dashed) -->
  <line x1="555" y1="165" x2="800" y2="132" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="555" y1="165" x2="800" y2="198" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Angle divergence annotation -->
  <path d="M 670,149 Q 675,142 670,137" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="685" y="126" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">Δθ &gt; 0</text>

  <!-- Screen -->
  <line x1="805" y1="120" x2="805" y2="210" stroke="#1a1a1a" stroke-width="3"/>
  <text x="805" y="226" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Екран</text>

  <!-- Screen comparison lines -->
  <rect x="812" y="145" width="6" height="40" rx="1" fill="#2457d6"/>
  <rect x="822" y="132" width="6" height="66" rx="1" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Screen labels -->
  <text x="836" y="142" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">+ΔL подовження</text>
  <text x="836" y="160" font-size="12" fill="#2457d6" text-anchor="start">L₁ при 20°C</text>
  <text x="836" y="176" font-size="12" fill="#c0392b" text-anchor="start">L₂ при 60°C</text>
  <text x="836" y="196" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">Дрейф пікселів</text>

  <!-- Right Panel bottom note -->
  <rect x="507" y="278" width="411" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="712" y="295" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Дифракційна помилка: кут розгортки прив'язаний до λ</text>
  <text x="712" y="311" font-size="12" fill="#1a1a1a" text-anchor="middle">Подовження лінії на 1.5–2% калічить тріангуляційні 3D-сканери</text>


  <!-- BOTTOM SECTION: SUMMARY CARDS -->
  <!-- Card 1: Laser Drift -->
  <rect x="30" y="345" width="286" height="90" rx="8" ry="8" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="30" y="345" width="286" height="26" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="173" y="362" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">1. ДРЕЙФ ЛАЗЕРА: dλ/dT</text>
  <text x="42" y="385" font-size="12" fill="#1a1a1a">• Звуження ширини забороненої зони</text>
  <text x="42" y="403" font-size="12" fill="#1a1a1a">• Швидкість зсуву: +0.25 нм на 1°C</text>
  <text x="42" y="421" font-size="12" font-weight="bold" fill="#c0392b">• При ΔT=40°C зсув сягає +10 нм</text>

  <!-- Card 2: DOE Diffraction Error -->
  <rect x="337" y="345" width="286" height="90" rx="8" ry="8" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="337" y="345" width="286" height="26" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="480" y="362" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">2. ДИФРАКЦІЙНА ПОМИЛКА DOE</text>
  <text x="349" y="385" font-size="12" fill="#1a1a1a">• Формула ґратки: sin θ = m·λ / d</text>
  <text x="349" y="403" font-size="12" fill="#1a1a1a">• Нагрів розгортає кут θ ширше</text>
  <text x="349" y="421" font-size="12" font-weight="bold" fill="#c0392b">• Теплове «дихання» довжини лінії</text>

  <!-- Card 3: Powell Prism Stability -->
  <rect x="644" y="345" width="286" height="90" rx="8" ry="8" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="644" y="345" width="286" height="26" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="787" y="362" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">3. СТАБІЛЬНІСТЬ ПРИЗМИ ПАВЕЛЛА</text>
  <text x="656" y="385" font-size="12" fill="#1a1a1a">• Закон Снелліуса: заломлення n(λ)</text>
  <text x="656" y="403" font-size="12" fill="#1a1a1a">• Дисперсія скла dn/dλ мізерна</text>
  <text x="656" y="421" font-size="12" font-weight="bold" fill="#27ae60">• Геометрія стабільна за будь-яких T</text>

</svg>
