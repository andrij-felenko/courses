<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-blue-rev" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка полотна -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Двохосьове формування лазерної лінії з призмою Павелла</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Роздільна оптика: розгортка віяла гребенем призми (вісь X) та фокусування товщини коліматором (вісь Y)</text>

  <!-- ==================== ПАНЕЛЬ 1: ПЛОЩИНА X (РОЗГОРТКА ВІЯЛА) ==================== -->
  <rect x="35" y="70" width="890" height="130" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="90" font-size="13" font-weight="700" fill="#2457d6">Площина X (розгортка віяла): робота асферичного гребеня призми Павелла</text>
  <text x="895" y="90" font-size="12" fill="#6b7280" text-anchor="end">Вигляд зверху (Fan Axis)</text>

  <!-- Оптична вісь (штрихпунктир) -->
  <line x1="76" y1="143" x2="720" y2="143" stroke="#d0d7de" stroke-width="1" stroke-dasharray="6 3 2 3"/>

  <!-- 1. Лазерний діод LD -->
  <rect x="58" y="133" width="18" height="20" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="76" cy="143" r="2.5" fill="#c0392b"/>
  <text x="67" y="124" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">LD</text>

  <!-- Розбіжний пучок від LD до коліматора -->
  <polygon points="76,143 125,136 125,150" fill="#fdecea" opacity="0.6"/>
  <line x1="76" y1="143" x2="125" y2="136" stroke="#c0392b" stroke-width="1.2"/>
  <line x1="76" y1="143" x2="125" y2="150" stroke="#c0392b" stroke-width="1.2"/>

  <!-- 2. Коліматорна лінза -->
  <path d="M 125,130 C 130,135 130,151 125,156 C 120,151 120,135 125,130 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="125" y="174" font-size="12" fill="#2457d6" text-anchor="middle">Коліматор</text>

  <!-- 3. Колімований пучок -->
  <polygon points="127,137 218,137 218,149 127,149" fill="#fdecea" opacity="0.6"/>
  <line x1="127" y1="137" x2="218" y2="137" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="127" y1="149" x2="218" y2="149" stroke="#c0392b" stroke-width="1.5"/>
  <text x="172" y="124" font-size="12" fill="#6b7280" text-anchor="middle">Пучок d_вх</text>

  <!-- 4. Призма Павелла (вигляд зверху: асферичний дахоподібний гребінь) -->
  <path d="M 230,126 Q 223,136 218,143 Q 223,150 230,160 L 255,160 L 255,126 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="242" y="112" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Призма Павелла</text>
  <text x="238" y="174" font-size="12" fill="#2457d6" text-anchor="middle">Асферичний гребінь</text>

  <!-- 5. Віяло променів на виході -->
  <polygon points="255,133 720,102 720,184 255,153" fill="#fdecea" opacity="0.5"/>
  <line x1="255" y1="133" x2="720" y2="102" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="255" y1="138" x2="720" y2="122" stroke="#c0392b" stroke-width="1.2"/>
  <line x1="255" y1="143" x2="720" y2="143" stroke="#c0392b" stroke-width="1"/>
  <line x1="255" y1="148" x2="720" y2="164" stroke="#c0392b" stroke-width="1.2"/>
  <line x1="255" y1="153" x2="720" y2="184" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Позначення кута віяла -->
  <path d="M 292,130 A 42 42 0 0 1 292,156" fill="none" stroke="#2457d6" stroke-width="1.2"/>
  <text x="350" y="116" font-size="12" font-weight="700" fill="#2457d6">Кут віяла θ (розгортка)</text>

  <!-- 6. Екран та лінія на мішені -->
  <line x1="720" y1="96" x2="720" y2="190" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="720" y1="102" x2="720" y2="184" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>

  <!-- Розмір лінії -->
  <line x1="732" y1="104" x2="732" y2="182" stroke="#2457d6" stroke-width="1.2" marker-start="url(#arr-blue-rev)" marker-end="url(#arr-blue)"/>
  <text x="742" y="136" font-size="12" font-weight="700" fill="#2457d6">Довжина лінії L</text>
  <text x="742" y="152" font-size="12" fill="#6b7280">(Flat-Top профіль)</text>

  <!-- ==================== ПАНЕЛЬ 2: ПЛОЩИНА Y (ТОВЩИНА ЛІНІЇ) ==================== -->
  <rect x="35" y="214" width="890" height="130" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="234" font-size="13" font-weight="700" fill="#27ae60">Площина Y (поперечна товщина): фокусування перетяжки коліматором модуля</text>
  <text x="895" y="234" font-size="12" fill="#6b7280" text-anchor="end">Вигляд збоку (Thickness Axis)</text>

  <!-- Оптична вісь (штрихпунктир) -->
  <line x1="76" y1="287" x2="720" y2="287" stroke="#d0d7de" stroke-width="1" stroke-dasharray="6 3 2 3"/>

  <!-- 1. Лазерний діод LD -->
  <rect x="58" y="277" width="18" height="20" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="76" cy="287" r="2.5" fill="#c0392b"/>
  <text x="67" y="268" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">LD</text>

  <!-- Розбіжний пучок від LD до коліматора -->
  <polygon points="76,287 125,280 125,294" fill="#fdecea" opacity="0.6"/>
  <line x1="76" y1="287" x2="125" y2="280" stroke="#c0392b" stroke-width="1.2"/>
  <line x1="76" y1="287" x2="125" y2="294" stroke="#c0392b" stroke-width="1.2"/>

  <!-- 2. Коліматорна лінза -->
  <path d="M 125,274 C 130,279 130,295 125,300 C 120,295 120,279 125,274 Z" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="125" y="322" font-size="12" fill="#27ae60" text-anchor="middle">Коліматор</text>

  <!-- 3. Збіжний пучок до призми -->
  <polygon points="127,281 220,283 220,291 127,293" fill="#e9f7ef" opacity="0.6"/>
  <line x1="127" y1="281" x2="220" y2="283" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="127" y1="293" x2="220" y2="291" stroke="#27ae60" stroke-width="1.5"/>
  <text x="172" y="268" font-size="12" fill="#6b7280" text-anchor="middle">Збіжний пучок</text>

  <!-- 4. Призма Павелла (вигляд збоку: плоскопаралельна пластина) -->
  <rect x="220" y="272" width="35" height="30" rx="1" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="238" y="252" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Призма Павелла</text>
  <text x="238" y="322" font-size="12" fill="#27ae60" text-anchor="middle">Плоска пластина</text>
  <text x="238" y="336" font-size="12" fill="#6b7280" text-anchor="middle">(заломлення = 0)</text>

  <!-- 5. Фокусування на перетяжку крізь повітря -->
  <polygon points="255,283 720,286.5 720,287.5 255,291" fill="#e9f7ef" opacity="0.6"/>
  <line x1="255" y1="283" x2="720" y2="286.5" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="255" y1="291" x2="720" y2="287.5" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="264" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Фокусування перетяжки лінії виконує коліматор</text>

  <!-- 6. Екран та сфокусована перетяжка -->
  <line x1="720" y1="240" x2="720" y2="334" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="720" cy="287" r="3" fill="#27ae60"/>

  <!-- Розмір перетяжки -->
  <line x1="730" y1="282" x2="730" y2="292" stroke="#27ae60" stroke-width="1.2"/>
  <line x1="726" y1="282" x2="734" y2="282" stroke="#27ae60" stroke-width="1"/>
  <line x1="726" y1="292" x2="734" y2="292" stroke="#27ae60" stroke-width="1"/>
  <text x="742" y="284" font-size="12" font-weight="700" fill="#27ae60">Товщина лінії w</text>
  <text x="742" y="300" font-size="12" fill="#6b7280">(перетяжка ~0.5–1 мм)</text>

  <!-- ==================== НИЖНЯ ПАНЕЛЬ: ПОЯСНЕННЯ ==================== -->
  <rect x="35" y="358" width="890" height="82" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="378" font-size="12" font-weight="700" fill="#1a1a1a">Принцип незалежного двохосьового юстування лазерної лінії:</text>
  <text x="55" y="396" font-size="12" fill="#6b7280">1. Довжина та однорідність (вісь X) визначаються кутом віяла призми Павелла і точним центруванням пучка на гребені.</text>
  <text x="55" y="413" font-size="12" fill="#6b7280">2. Товщина перетяжки (вісь Y) налаштовується обертанням фокусувального тубуса коліматора на потрібну робочу відстань.</text>
  <text x="55" y="430" font-size="12" fill="#6b7280">3. Оскільки вздовж осі Y грані призми плоскі, юстування фокуса коліматора не змінює кут розгортки та Flat-Top профіль смуги.</text>
</svg>
