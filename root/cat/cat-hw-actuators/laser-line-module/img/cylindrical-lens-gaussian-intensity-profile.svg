<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Формування лінії циліндричною лінзою: гаусів профіль і дефекти</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Збереження гаусового спаду спричиняє пересвіт сенсора в центрі та втрату країв лінії в шумах</text>

  <!-- LEFT PANEL: Optical Scheme -->
  <rect x="30" y="78" width="425" height="252" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="30" y="78" width="425" height="30" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="242" y="98" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Оптична схема: розгортка круглого пучка</text>

  <!-- Input beam cross-section -->
  <circle cx="75" cy="165" r="22" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="75" cy="165" r="10" fill="#c0392b" fill-opacity="0.3"/>
  <text x="75" y="125" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Круглий пучок</text>
  <text x="75" y="202" font-size="12" fill="#6b7280" text-anchor="middle">Гаусів TEM₀₀</text>

  <!-- Parallel rays entering lens -->
  <line x1="102" y1="152" x2="160" y2="152" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="102" y1="165" x2="160" y2="165" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <line x1="102" y1="178" x2="160" y2="178" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Cylindrical Lens -->
  <path d="M 165,130 L 165,200 Q 192,165 165,130 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="178" y="122" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Циліндрична лінза</text>

  <!-- Diverging rays exiting lens -->
  <line x1="178" y1="165" x2="365" y2="135" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="178" y1="165" x2="365" y2="150" stroke="#c0392b" stroke-width="2"/>
  <line x1="178" y1="165" x2="365" y2="165" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-red)"/>
  <line x1="178" y1="165" x2="365" y2="180" stroke="#c0392b" stroke-width="2"/>
  <line x1="178" y1="165" x2="365" y2="195" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Screen and Line -->
  <line x1="370" y1="128" x2="370" y2="204" stroke="#1a1a1a" stroke-width="3"/>
  <text x="370" y="222" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Екран</text>

  <!-- Line strip on screen with bright center -->
  <rect x="376" y="128" width="8" height="76" rx="2" fill="#c0392b"/>
  <rect x="376" y="158" width="8" height="16" rx="2" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>

  <text x="392" y="140" font-size="12" fill="#6b7280" text-anchor="start">Тьмяно</text>
  <text x="392" y="169" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">Пересвіт</text>
  <text x="392" y="198" font-size="12" fill="#6b7280" text-anchor="start">Тьмяно</text>

  <!-- Left Panel bottom note -->
  <rect x="42" y="278" width="401" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="242" y="295" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Циліндрична лінза розгортає кут, але не перерозподіляє</text>
  <text x="242" y="311" font-size="12" fill="#6b7280" text-anchor="middle">густину енергії: уся пікова потужність лишається по центру</text>


  <!-- RIGHT PANEL: Graph I(x) and Camera Saturation -->
  <rect x="485" y="78" width="445" height="252" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="485" y="78" width="445" height="30" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="707" y="98" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розподіл енергії I(x) та динамічний діапазон камери</text>

  <!-- Axes -->
  <line x1="525" y1="236" x2="905" y2="236" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="545" y1="240" x2="545" y2="120" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="551" y="132" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Інтенсивність I</text>
  <text x="900" y="228" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">x</text>

  <!-- Center tick on X -->
  <line x1="715" y1="233" x2="715" y2="239" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Saturation threshold line (Isat) -->
  <line x1="545" y1="160" x2="885" y2="160" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="551" y="154" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">Поріг Isat</text>

  <!-- Noise threshold line -->
  <line x1="545" y1="216" x2="885" y2="216" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="551" y="210" font-size="12" fill="#6b7280" text-anchor="start">Рівень шуму</text>

  <!-- Gaussian Curve -->
  <path d="M 565,236 C 625,236 660,128 715,128 C 770,128 805,236 865,236" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Saturation area highlight -->
  <path d="M 668,160 C 685,134 700,128 715,128 C 730,128 745,134 762,160 Z" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="715" y="145" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">ПЕРЕСВІТ (255 DN)</text>

  <!-- Flattened clipped camera line -->
  <line x1="668" y1="160" x2="762" y2="160" stroke="#1a1a1a" stroke-width="3"/>
  <text x="715" y="178" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Зрізаний сигнал камери</text>

  <!-- Bottom labels under the X axis (Left wing, Center, Right wing) -->
  <text x="605" y="252" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Тьмяний край</text>
  <text x="605" y="268" font-size="12" fill="#6b7280" text-anchor="middle">(сигнал у шумах)</text>

  <text x="715" y="252" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">x = 0 (центр)</text>
  <text x="715" y="268" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">(зона пересвіту)</text>

  <text x="825" y="252" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Тьмяний край</text>
  <text x="825" y="268" font-size="12" fill="#6b7280" text-anchor="middle">(сигнал у шумах)</text>

  <!-- Right Panel bottom note -->
  <rect x="497" y="278" width="421" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="707" y="295" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Дилема експозиції: неможливо налаштувати камеру —</text>
  <text x="707" y="311" font-size="12" fill="#1a1a1a" text-anchor="middle">або центр у пересвіті, або краї лінії зникають у шумах</text>


  <!-- BOTTOM SECTION: SUMMARY CARDS -->
  <!-- Card 1: Center Saturation -->
  <rect x="30" y="345" width="286" height="90" rx="8" ry="8" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="30" y="345" width="286" height="26" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="173" y="362" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">1. ЦЕНТР: ПЕРЕСВІТ (НАСИЧЕННЯ)</text>
  <text x="42" y="385" font-size="12" fill="#1a1a1a">• Інтенсивність перевищує Isat (255 DN)</text>
  <text x="42" y="403" font-size="12" fill="#1a1a1a">• Блюмінг пікселів матриці камери</text>
  <text x="42" y="421" font-size="12" font-weight="bold" fill="#c0392b">• Втрата субпіксельної точності</text>

  <!-- Card 2: Edge Drop -->
  <rect x="337" y="345" width="286" height="90" rx="8" ry="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="337" y="345" width="286" height="26" rx="8" fill="#f4f6f8" stroke="#6b7280" stroke-width="1"/>
  <text x="480" y="362" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. КРАЇ: ПАДІННЯ ЯСКРАВОСТІ</text>
  <text x="349" y="385" font-size="12" fill="#1a1a1a">• Спад до 5–10% від пікової енергії</text>
  <text x="349" y="403" font-size="12" fill="#1a1a1a">• Сигнал тоне в шумі сенсора камери</text>
  <text x="349" y="421" font-size="12" font-weight="bold" fill="#6b7280">• Розриви лінії при тріангуляції</text>

  <!-- Card 3: Powell Prism Solution -->
  <rect x="644" y="345" width="286" height="90" rx="8" ry="8" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="644" y="345" width="286" height="26" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="787" y="362" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">3. РОЗВ'ЯЗОК: ПРИЗМА ПАВЕЛЛА</text>
  <text x="656" y="385" font-size="12" fill="#1a1a1a">• Асферичний дах розсіює надлишок</text>
  <text x="656" y="403" font-size="12" fill="#1a1a1a">• Перерозподіл енергії центру на краї</text>
  <text x="656" y="421" font-size="12" font-weight="bold" fill="#27ae60">• Рівномірний Flat-Top (Top-Hat)</text>

</svg>
