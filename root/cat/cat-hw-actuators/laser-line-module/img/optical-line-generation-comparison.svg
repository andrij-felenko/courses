<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <!-- Маркери стрілок -->
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <!-- Градієнт лазерної лінії з гаусовим спадом -->
    <linearGradient id="gaussLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c0392b" stop-opacity="0.05"/>
      <stop offset="25%" stop-color="#c0392b" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#c0392b" stop-opacity="1"/>
      <stop offset="75%" stop-color="#c0392b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#c0392b" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="39" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Формування лазерної лінії: циліндрична лінза проти призми Павелла</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Призма Павелла перерозподіляє енергію з центру на краї для однорідної яскравості смуги</text>

  <!-- ==================== ЛІВА ПАНЕЛЬ: ЦИЛІНДРИЧНА ЛІНЗА ==================== -->
  <rect x="24" y="74" width="448" height="364" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Заголовок лівої панелі -->
  <text x="248" y="98" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Циліндрична скляна лінза</text>

  <!-- Бейдж статусу лівої панелі -->
  <rect x="138" y="106" width="220" height="24" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="248" y="122" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Гаусовий спад: яскравий центр</text>

  <!-- Підпис вхідного пучка -->
  <text x="216" y="154" font-size="12" fill="#6b7280" text-anchor="end">Вхідний пучок</text>

  <!-- Вхідні паралельні промені до циліндричної лінзи -->
  <line x1="248" y1="140" x2="248" y2="167" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="244" y1="140" x2="244" y2="167.4" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="252" y1="140" x2="252" y2="167.4" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="240" y1="140" x2="240" y2="168.9" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="256" y1="140" x2="256" y2="168.9" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="236" y1="140" x2="236" y2="171.6" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="260" y1="140" x2="260" y2="171.6" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Циліндрична лінза (поперечний переріз стрижня) -->
  <circle cx="248" cy="185" r="18" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Підписи лінзи -->
  <text x="280" y="180" font-size="12" font-weight="bold" fill="#1a1a1a">Кругова геометрія</text>
  <text x="280" y="196" font-size="12" fill="#6b7280">Без перерозподілу енергії</text>

  <!-- Промені всередині циліндричної лінзи -->
  <line x1="248" y1="167" x2="248" y2="203" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="244" y1="167.4" x2="245" y2="202.6" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="252" y1="167.4" x2="251" y2="202.6" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="240" y1="168.9" x2="241" y2="201.1" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="256" y1="168.9" x2="255" y2="201.1" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="236" y1="171.6" x2="238" y2="198.4" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="260" y1="171.6" x2="258" y2="198.4" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Розбіжні промені (віяло) до мішені: центральні густо, периферійні рідко -->
  <line x1="248" y1="203" x2="248" y2="268" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="245" y1="202.6" x2="230" y2="268" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="251" y1="202.6" x2="266" y2="268" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="241" y1="201.1" x2="203" y2="268" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="255" y1="201.1" x2="293" y2="268" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="238" y1="198.4" x2="138" y2="268" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="258" y1="198.4" x2="358" y2="268" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Площина екрана / мішені -->
  <line x1="120" y1="268" x2="376" y2="268" stroke="#d0d7de" stroke-width="1"/>

  <!-- Світлова лінія на екрані (Гаусова: яскравий центр, розмиті краї) -->
  <rect x="138" y="272" width="220" height="6" rx="3" fill="url(#gaussLine)"/>
  <rect x="238" y="273" width="20" height="4" rx="2" fill="#c0392b"/>

  <!-- Підпис вигляду лінії -->
  <text x="248" y="302" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Яскравий центр, швидкий спад до країв</text>

  <!-- Графік інтенсивності I(x) для циліндричної лінзи -->
  <!-- Осі координат -->
  <line x1="138" y1="395" x2="138" y2="325" stroke="#6b7280" stroke-width="1" marker-end="url(#arr-gray)"/>
  <line x1="130" y1="395" x2="364" y2="395" stroke="#6b7280" stroke-width="1" marker-end="url(#arr-gray)"/>
  <text x="124" y="330" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="end">I</text>
  <text x="378" y="399" font-size="12" font-weight="bold" fill="#6b7280">x</text>

  <!-- Крива розподілу освітленості (Гаусова крива) -->
  <path d="M 138,395 C 190,395 215,335 248,335 C 281,335 306,395 358,395 Z" fill="#fdecea"/>
  <path d="M 138,395 C 190,395 215,335 248,335 C 281,335 306,395 358,395" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Підпис під графіком -->
  <text x="248" y="420" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Гаусовий розподіл освітленості</text>

  <!-- ==================== ПРАВА ПАНЕЛЬ: ПРИЗМА ПАВЕЛЛА ==================== -->
  <rect x="488" y="74" width="448" height="364" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Заголовок правої панелі -->
  <text x="712" y="98" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Асферична призма Павелла</text>

  <!-- Бейдж статусу правої панелі -->
  <rect x="602" y="106" width="220" height="24" rx="12" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712" y="122" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Однорідна лінія (Flat-Top)</text>

  <!-- Підпис вхідного пучка -->
  <text x="680" y="154" font-size="12" fill="#6b7280" text-anchor="end">Вхідний пучок</text>

  <!-- Вхідні паралельні промені до призми Павелла -->
  <line x1="712" y1="140" x2="712" y2="167" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="708" y1="140" x2="708" y2="170" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="716" y1="140" x2="716" y2="170" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="704" y1="140" x2="704" y2="175" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="720" y1="140" x2="720" y2="175" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="700" y1="140" x2="700" y2="183" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="724" y1="140" x2="724" y2="183" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Призма Павелла (асферична конічна вершина + плоска основа) -->
  <path d="M 690,203 L 704,175 Q 712,165 720,175 L 734,203 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Підписи призми Павелла -->
  <text x="748" y="180" font-size="12" font-weight="bold" fill="#1a1a1a">Асферична вершина</text>
  <text x="748" y="196" font-size="12" fill="#6b7280">Перерозподіл на периферію</text>

  <!-- Промені всередині призми Павелла: заломлення на вершині розводить промені -->
  <line x1="712" y1="167" x2="712" y2="203" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="708" y1="170" x2="704" y2="203" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="716" y1="170" x2="720" y2="203" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="704" y1="175" x2="697" y2="203" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="720" y1="175" x2="727" y2="203" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="700" y1="183" x2="691" y2="203" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="724" y1="183" x2="733" y2="203" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Рівномірно розподілені промені до мішені (однаковий крок 37 px) -->
  <line x1="712" y1="203" x2="712" y2="268" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="704" y1="203" x2="675" y2="268" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="720" y1="203" x2="749" y2="268" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="697" y1="203" x2="638" y2="268" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="727" y1="203" x2="786" y2="268" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="691" y1="203" x2="601" y2="268" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="733" y1="203" x2="823" y2="268" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Площина екрана / мішені -->
  <line x1="584" y1="268" x2="840" y2="268" stroke="#d0d7de" stroke-width="1"/>

  <!-- Світлова лінія на екрані (Однорідна смуга з чіткими кінцями) -->
  <rect x="601" y="272" width="222" height="6" rx="2" fill="#27ae60" fill-opacity="0.35"/>
  <rect x="601" y="273" width="222" height="4" rx="2" fill="#27ae60"/>

  <!-- Підпис вигляду лінії -->
  <text x="712" y="302" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Рівномірна лінія з чіткими межами</text>

  <!-- Графік інтенсивності I(x) для призми Павелла -->
  <!-- Осі координат -->
  <line x1="601" y1="395" x2="601" y2="325" stroke="#6b7280" stroke-width="1" marker-end="url(#arr-gray)"/>
  <line x1="593" y1="395" x2="831" y2="395" stroke="#6b7280" stroke-width="1" marker-end="url(#arr-gray)"/>
  <text x="587" y="330" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="end">I</text>
  <text x="845" y="399" font-size="12" font-weight="bold" fill="#6b7280">x</text>

  <!-- Крива розподілу освітленості (Flat-Top профіль) -->
  <path d="M 601,395 Q 607,340 617,340 L 807,340 Q 817,340 823,395 Z" fill="#e9f7ef"/>
  <path d="M 601,395 Q 607,340 617,340 L 807,340 Q 817,340 823,395" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Підпис під графіком -->
  <text x="712" y="420" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Плоский профіль (Flat-Top)</text>
</svg>
