<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка полотна -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Двоконтурний захист лазера: відсічка DC та модель Leaky Bucket</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Апаратний RC-ланцюг блокує постійний струм, а програмна модель лімітує нагрів</text>

  <!-- ==================== ПАНЕЛЬ 1: АПАРАТНИЙ КОНТУР ==================== -->
  <rect x="24" y="76" width="444" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="40" y="102" font-size="14" font-weight="bold" fill="#1a1a1a">Контур 1: Диференціюючий RC-фільтр (апаратний)</text>
  <text x="40" y="120" font-size="12" fill="#6b7280">Захист від заклинювання керуючого виходу МК у логічній одиниці</text>

  <!-- Підпанель 1.1: Схема підключення -->
  <rect x="36" y="132" width="420" height="106" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Блок: Вихід МК -->
  <rect x="46" y="152" width="68" height="36" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="80" y="167" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вихід МК</text>
  <text x="80" y="181" font-size="12" fill="#6b7280" text-anchor="middle">GPIO / ШІМ</text>

  <!-- Провід від МК до конденсатора -->
  <line x1="114" y1="170" x2="148" y2="170" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Конденсатор C_диф -->
  <line x1="148" y1="156" x2="148" y2="184" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="156" y1="156" x2="156" y2="184" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="152" y="148" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">C_диф</text>
  <text x="152" y="200" font-size="12" fill="#6b7280" text-anchor="middle">100 нФ</text>

  <!-- Вузол після C_диф -->
  <line x1="156" y1="170" x2="216" y2="170" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="216" cy="170" r="3" fill="#1a1a1a"/>

  <!-- Резистор R_стяг до GND -->
  <line x1="216" y1="170" x2="216" y2="182" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="210" y="182" width="12" height="26" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="228" y="195" font-size="12" font-weight="bold" fill="#1a1a1a">R_стяг</text>
  <text x="228" y="209" font-size="12" fill="#6b7280">10 кОм</text>
  <line x1="216" y1="208" x2="216" y2="218" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Земля GND -->
  <line x1="208" y1="218" x2="224" y2="218" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="211" y1="222" x2="221" y2="222" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="214" y1="226" x2="218" y2="226" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Провід до N-MOSFET -->
  <line x1="216" y1="170" x2="290" y2="170" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Блок N-MOSFET -->
  <rect x="290" y="152" width="70" height="36" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="325" y="167" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">N-MOSFET</text>
  <text x="325" y="181" font-size="12" fill="#6b7280" text-anchor="middle">Затвор (G)</text>

  <!-- Провід до Лазера -->
  <line x1="360" y1="170" x2="380" y2="170" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- Блок Лазерного діода -->
  <rect x="382" y="152" width="64" height="36" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="414" y="167" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Лазер LD</text>
  <text x="414" y="181" font-size="12" fill="#c0392b" text-anchor="middle">5 мВт</text>

  <!-- Підпис постійної часу -->
  <text x="246" y="232" font-size="12" fill="#2457d6" text-anchor="middle">Постійна часу: τ = R · C ≈ 1.0 мс</text>

  <!-- Підпанель 1.2: Осцилограма аварійного зависання -->
  <rect x="36" y="246" width="420" height="178" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="46" y="264" font-size="12" font-weight="bold" fill="#1a1a1a">Реакція на аварійне заклинювання виходу МК:</text>

  <!-- Підписи сигналів зліва -->
  <text x="46" y="296" font-size="12" font-weight="bold" fill="#2457d6">V_вх (МК)</text>
  <text x="46" y="354" font-size="12" font-weight="bold" fill="#27ae60">V_затвор</text>

  <!-- Горизонтальні осі часу -->
  <line x1="110" y1="304" x2="444" y2="304" stroke="#d0d7de" stroke-width="1"/>
  <line x1="110" y1="362" x2="444" y2="362" stroke="#d0d7de" stroke-width="1"/>

  <!-- Лінія порогу відкривання MOSFET V_th -->
  <line x1="110" y1="344" x2="200" y2="344" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="112" y="340" font-size="12" fill="#6b7280">Поріг V_th</text>

  <!-- Вертикальна лінія моменту збою МК -->
  <line x1="205" y1="270" x2="205" y2="382" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="210" y="278" font-size="12" font-weight="bold" fill="#c0392b">Збій: МК завис у 1</text>

  <!-- Сигнал V_in (МК): 2 імпульси, потім постійний HIGH -->
  <path d="M 110,304 L 125,304 L 125,284 L 145,284 L 145,304 L 165,304 L 165,284 L 185,284 L 185,304 L 205,304 L 205,284 L 444,284" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Плашка HIGH рівня -->
  <rect x="240" y="288" width="194" height="18" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="337" y="302" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Зависання в HIGH (3.3 В)</text>

  <!-- Сигнал V_gate: 2 імпульси, при збої - експоненційний спад до 0 В -->
  <path d="M 110,362 L 125,362 L 125,334 Q 135,338 145,342 L 145,366 L 165,362 L 165,334 Q 175,338 185,342 L 185,366 L 205,362 L 205,334 Q 225,348 245,362 L 444,362" fill="none" stroke="#27ae60" stroke-width="2"/>

  <!-- Плашка V_gate = 0 В -->
  <rect x="255" y="346" width="180" height="18" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="345" y="360" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">V_з = 0 В (Лазер вимкнено)</text>

  <!-- Підсумковий статус контуру 1 -->
  <rect x="46" y="394" width="400" height="22" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="246" y="410" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Постійний струм відсічено, діод гарантовано вимкнений</text>


  <!-- ==================== ПАНЕЛЬ 2: ПРОГРАМНИЙ КОНТУР ==================== -->
  <rect x="492" y="76" width="444" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="508" y="102" font-size="14" font-weight="bold" fill="#1a1a1a">Контур 2: Програмна модель Leaky Bucket</text>
  <text x="508" y="120" font-size="12" fill="#6b7280">Облік тепла кристала та обмеження середньої шпаруватості</text>

  <!-- Підпанель 2.1: Графік заповнення відра теплового бюджету -->
  <rect x="504" y="132" width="420" height="292" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Осі графіка -->
  <line x1="558" y1="155" x2="558" y2="350" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="558" y1="350" x2="840" y2="350" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- Заголовок осі Y -->
  <text x="508" y="150" font-size="12" font-weight="bold" fill="#1a1a1a">Тепло %</text>

  <!-- Позначки та лінії рівнів -->
  <!-- Рівень 100%: Аварійне вимкнення -->
  <line x1="558" y1="175" x2="825" y2="175" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="552" y="179" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">100%</text>
  <text x="832" y="179" font-size="12" font-weight="bold" fill="#c0392b">Trip (100%)</text>

  <!-- Рівень 80%: Поріг тротлінгу -->
  <line x1="558" y1="210" x2="825" y2="210" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="552" y="214" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">80%</text>
  <text x="832" y="214" font-size="12" font-weight="bold" fill="#2457d6">ШІМ-clamp</text>

  <!-- Рівень 60%: Зняття обмеження -->
  <line x1="558" y1="248" x2="825" y2="248" stroke="#27ae60" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="552" y="252" font-size="12" fill="#27ae60" text-anchor="end">60%</text>
  <text x="832" y="252" font-size="12" fill="#27ae60">Норма</text>

  <!-- Базовий рівень 0% -->
  <text x="552" y="354" font-size="12" fill="#6b7280" text-anchor="end">0%</text>

  <!-- Крива теплового навантаження кристала -->
  <path d="M 558,350 C 585,320 610,255 640,210 C 665,192 700,186 735,186 C 765,225 795,285 825,325" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Ключові вузлові точки -->
  <circle cx="640" cy="210" r="4" fill="#2457d6"/>
  <circle cx="735" cy="186" r="4" fill="#2457d6"/>
  <circle cx="780" cy="248" r="4" fill="#27ae60"/>

  <!-- Позначення осі X -->
  <text x="835" y="344" font-size="12" font-weight="bold" fill="#1a1a1a">t</text>

  <!-- Фази процесу вздовж осі часу -->
  <text x="590" y="366" font-size="12" fill="#6b7280" text-anchor="middle">Нагрів</text>
  <text x="685" y="366" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Тротлінг</text>
  <text x="785" y="366" font-size="12" fill="#27ae60" text-anchor="middle">Охолодження</text>

  <!-- Формула балансу моделі Leaky Bucket -->
  <rect x="514" y="384" width="400" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="714" y="402" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ΔТепло = (P · ШІМ · dt) − (Тепло / τ_cool) · dt</text>
</svg>
