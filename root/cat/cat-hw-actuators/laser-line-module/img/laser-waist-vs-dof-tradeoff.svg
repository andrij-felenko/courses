<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- ==================== ЗАГОЛОВОК ТА ПІДЗАГОЛОВОК ==================== -->
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Квадратичний компроміс: товщина лінії 2w₀ проти глибини різкості (DOF)</text>
  <text x="480" y="48" text-anchor="middle" font-size="13" fill="#6b7280">Колапс робочої зони: надтонке фокусування звужує діапазон DOF у квадрат разів (DOF ∝ (2w₀)² / λ)</text>

  <!-- ==================== ЛІВА ПАНЕЛЬ: ГРАФІК ==================== -->
  <rect x="25" y="65" width="590" height="290" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="90" font-size="13" font-weight="700" fill="#1a1a1a">Залежність DOF від товщини лінії 2w₀</text>

  <!-- Легенда кривих угорі графіка -->
  <line x1="315" y1="86" x2="335" y2="86" stroke="#27ae60" stroke-width="2.5"/>
  <text x="341" y="90" font-size="12" font-weight="700" fill="#27ae60">520 нм</text>

  <line x1="400" y1="86" x2="420" y2="86" stroke="#c0392b" stroke-width="2.5"/>
  <text x="426" y="90" font-size="12" font-weight="700" fill="#c0392b">650 нм</text>

  <text x="485" y="90" font-size="12" fill="#6b7280">(DOF ∝ (2w₀)²)</text>

  <!-- Сітка графіка: горизонтальні лінії -->
  <line x1="85" y1="265" x2="565" y2="265" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="85" y1="215" x2="565" y2="215" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="85" y1="165" x2="565" y2="165" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="85" y1="115" x2="565" y2="115" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Сітка графіка: вертикальні лінії -->
  <line x1="205" y1="115" x2="205" y2="315" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="325" y1="115" x2="325" y2="315" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="445" y1="115" x2="445" y2="315" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="565" y1="115" x2="565" y2="315" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Зона колапсу DOF (< 50 мкм) -->
  <rect x="86" y="240" width="118" height="74" rx="4" fill="#fdecea" stroke="#c0392b" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="96" y="259" font-size="12" font-weight="700" fill="#c0392b">Колапс DOF:</text>
  <text x="96" y="277" font-size="12" fill="#c0392b">&lt; 50 мкм →</text>
  <text x="96" y="295" font-size="12" fill="#c0392b">DOF &lt; 6 мм!</text>

  <!-- Крива 520 нм (зелена) -->
  <path d="M 85.0,315.0 L 89.8,315.0 L 94.6,315.0 L 99.4,314.9 L 104.2,314.8 L 109.0,314.7 L 113.8,314.6 L 118.6,314.5 L 123.4,314.4 L 128.2,314.2 L 133.0,314.0 L 137.8,313.8 L 142.6,313.6 L 147.4,313.3 L 152.2,313.0 L 157.0,312.7 L 161.8,312.4 L 166.6,312.1 L 171.4,311.7 L 176.2,311.4 L 181.0,311.0 L 185.8,310.6 L 190.6,310.1 L 195.4,309.7 L 200.2,309.2 L 205.0,308.7 L 209.8,308.2 L 214.6,307.7 L 219.4,307.1 L 224.2,306.5 L 229.0,305.9 L 233.8,305.3 L 238.6,304.7 L 243.4,304.0 L 248.2,303.4 L 253.0,302.7 L 257.8,302.0 L 262.6,301.2 L 267.4,300.5 L 272.2,299.7 L 277.0,298.9 L 281.8,298.1 L 286.6,297.2 L 291.4,296.4 L 296.2,295.5 L 301.0,294.6 L 305.8,293.7 L 310.6,292.8 L 315.4,291.8 L 320.2,290.8 L 325.0,289.8 L 329.8,288.8 L 334.6,287.8 L 339.4,286.7 L 344.2,285.6 L 349.0,284.5 L 353.8,283.4 L 358.6,282.3 L 363.4,281.1 L 368.2,279.9 L 373.0,278.8 L 377.8,277.5 L 382.6,276.3 L 387.4,275.0 L 392.2,273.8 L 397.0,272.5 L 401.8,271.1 L 406.6,269.8 L 411.4,268.4 L 416.2,267.1 L 421.0,265.7 L 425.8,264.2 L 430.6,262.8 L 435.4,261.3 L 440.2,259.9 L 445.0,258.4 L 449.8,256.8 L 454.6,255.3 L 459.4,253.7 L 464.2,252.2 L 469.0,250.6 L 473.8,248.9 L 478.6,247.3 L 483.4,245.6 L 488.2,244.0 L 493.0,242.2 L 497.8,240.5 L 502.6,238.8 L 507.4,237.0 L 512.2,235.2 L 517.0,233.4 L 521.8,231.6 L 526.6,229.8 L 531.4,227.9 L 536.2,226.0 L 541.0,224.1 L 545.8,222.2 L 550.6,220.3 L 555.4,218.3 L 560.2,216.3 L 565.0,214.3" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Крива 650 нм (червона) -->
  <path d="M 85.0,315.0 L 89.8,315.0 L 94.6,315.0 L 99.4,314.9 L 104.2,314.9 L 109.0,314.8 L 113.8,314.7 L 118.6,314.6 L 123.4,314.5 L 128.2,314.3 L 133.0,314.2 L 137.8,314.0 L 142.6,313.8 L 147.4,313.6 L 152.2,313.4 L 157.0,313.2 L 161.8,312.9 L 166.6,312.7 L 171.4,312.4 L 176.2,312.1 L 181.0,311.8 L 185.8,311.4 L 190.6,311.1 L 195.4,310.7 L 200.2,310.4 L 205.0,310.0 L 209.8,309.6 L 214.6,309.1 L 219.4,308.7 L 224.2,308.2 L 229.0,307.8 L 233.8,307.3 L 238.6,306.8 L 243.4,306.2 L 248.2,305.7 L 253.0,305.1 L 257.8,304.6 L 262.6,304.0 L 267.4,303.4 L 272.2,302.7 L 277.0,302.1 L 281.8,301.5 L 286.6,300.8 L 291.4,300.1 L 296.2,299.4 L 301.0,298.7 L 305.8,298.0 L 310.6,297.2 L 315.4,296.4 L 320.2,295.7 L 325.0,294.9 L 329.8,294.0 L 334.6,293.2 L 339.4,292.4 L 344.2,291.5 L 349.0,290.6 L 353.8,289.7 L 358.6,288.8 L 363.4,287.9 L 368.2,287.0 L 373.0,286.0 L 377.8,285.0 L 382.6,284.0 L 387.4,283.0 L 392.2,282.0 L 397.0,281.0 L 401.8,279.9 L 406.6,278.8 L 411.4,277.8 L 416.2,276.6 L 421.0,275.5 L 425.8,274.4 L 430.6,273.2 L 435.4,272.1 L 440.2,270.9 L 445.0,269.7 L 449.8,268.5 L 454.6,267.2 L 459.4,266.0 L 464.2,264.7 L 469.0,263.4 L 473.8,262.1 L 478.6,260.8 L 483.4,259.5 L 488.2,258.2 L 493.0,256.8 L 497.8,255.4 L 502.6,254.0 L 507.4,252.6 L 512.2,251.2 L 517.0,249.8 L 521.8,248.3 L 526.6,246.8 L 531.4,245.3 L 536.2,243.8 L 541.0,242.3 L 545.8,240.8 L 550.6,239.2 L 555.4,237.6 L 560.2,236.0 L 565.0,234.4" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Точки на кривих при 200 мкм -->
  <circle cx="565" cy="114" r="4" fill="#27ae60"/>
  <circle cx="565" cy="154" r="4" fill="#c0392b"/>

  <!-- Осі координат -->
  <line x1="85" y1="315" x2="85" y2="105" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="40" y="105" font-size="12" font-weight="700" fill="#1a1a1a">DOF, мм</text>

  <line x1="85" y1="315" x2="578" y2="315" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="325" y="348" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Товщина смуги в перетяжці 2w₀ (мкм)</text>

  <!-- Позначки на осі Y -->
  <text x="78" y="319" text-anchor="end" font-size="12" fill="#6b7280">0</text>
  <text x="78" y="269" text-anchor="end" font-size="12" fill="#6b7280">30</text>
  <text x="78" y="219" text-anchor="end" font-size="12" fill="#6b7280">60</text>
  <text x="78" y="169" text-anchor="end" font-size="12" fill="#6b7280">90</text>
  <text x="78" y="119" text-anchor="end" font-size="12" fill="#6b7280">120</text>

  <!-- Позначки на осі X -->
  <text x="85" y="330" text-anchor="middle" font-size="12" fill="#6b7280">0</text>
  <text x="205" y="330" text-anchor="middle" font-size="12" fill="#6b7280">50</text>
  <text x="325" y="330" text-anchor="middle" font-size="12" fill="#6b7280">100</text>
  <text x="445" y="330" text-anchor="middle" font-size="12" fill="#6b7280">150</text>
  <text x="565" y="330" text-anchor="middle" font-size="12" fill="#6b7280">200</text>

  <!-- ==================== ПРАВА ПАНЕЛЬ: ФІЗИЧНИЙ КОМПРОМІС ==================== -->
  <rect x="630" y="65" width="305" height="290" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="650" y="90" font-size="13" font-weight="700" fill="#1a1a1a">Фізичний компроміс і розрахунок</text>

  <!-- Картка 1: Формула -->
  <rect x="645" y="105" width="275" height="72" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="660" y="125" font-size="12" font-weight="700" fill="#2457d6">Аналітична залежність:</text>
  <text x="660" y="144" font-size="12" fill="#1a1a1a">DOF = 2 · z_R = π · (2w₀)² / (2λ)</text>
  <text x="660" y="163" font-size="12" fill="#6b7280">Звуження 2w₀ удвічі → падіння DOF у 4 рази</text>

  <!-- Картка 2: Таблиця порівняння -->
  <rect x="645" y="187" width="275" height="154" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="660" y="206" font-size="12" font-weight="700" fill="#1a1a1a">Числове порівняння (650 нм vs 520 нм):</text>

  <line x1="660" y1="214" x2="905" y2="214" stroke="#d0d7de" stroke-width="1"/>
  <text x="660" y="229" font-size="12" font-weight="700" fill="#6b7280">Товщина 2w₀</text>
  <text x="760" y="229" font-size="12" font-weight="700" fill="#c0392b">650 нм</text>
  <text x="835" y="229" font-size="12" font-weight="700" fill="#27ae60">520 нм</text>

  <text x="660" y="249" font-size="12" fill="#1a1a1a">30 мкм</text>
  <text x="760" y="249" font-size="12" font-weight="700" fill="#c0392b">2.2 мм</text>
  <text x="835" y="249" font-size="12" font-weight="700" fill="#27ae60">2.7 мм</text>

  <text x="660" y="269" font-size="12" fill="#1a1a1a">50 мкм</text>
  <text x="760" y="269" font-size="12" font-weight="700" fill="#c0392b">6.0 мм</text>
  <text x="835" y="269" font-size="12" font-weight="700" fill="#27ae60">7.5 мм</text>

  <text x="660" y="289" font-size="12" fill="#1a1a1a">100 мкм</text>
  <text x="760" y="289" font-size="12" font-weight="700" fill="#c0392b">24.2 мм</text>
  <text x="835" y="289" font-size="12" font-weight="700" fill="#27ae60">30.2 мм</text>

  <text x="660" y="309" font-size="12" fill="#1a1a1a">200 мкм</text>
  <text x="760" y="309" font-size="12" font-weight="700" fill="#c0392b">96.7 мм</text>
  <text x="835" y="309" font-size="12" font-weight="700" fill="#27ae60">120.8 мм</text>

  <text x="660" y="329" font-size="12" fill="#2457d6">Зелений лазер дає на +25% більший DOF</text>

  <!-- ==================== НИЖНЯ ПАНЕЛЬ: ПРАВИЛА ПРОЕКТУВАННЯ ==================== -->
  <rect x="25" y="370" width="910" height="75" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="392" font-size="12" font-weight="700" fill="#1a1a1a">Практичні правила проектування лазерних 3D-тріангуляційних систем:</text>
  <text x="45" y="412" font-size="12" fill="#6b7280">1. Фокусування в смугу &lt; 50 мкм практично унеможливлює вимірювання рельєфу: DOF стискається до кількох міліметрів.</text>
  <text x="45" y="430" font-size="12" fill="#6b7280">2. Інженерний оптимум: товщина лінії 80–120 мкм гарантує стабільний DOF 15–35 мм, достатній для більшості сканованих об'єктів.</text>
</svg>
