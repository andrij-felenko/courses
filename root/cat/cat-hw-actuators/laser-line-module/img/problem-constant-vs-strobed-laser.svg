<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs>
  <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
  </marker>
</defs>

<rect x="0" y="0" width="960" height="460" fill="white"/>

<!-- Title & Subtitle -->
<text x="480" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Неперервне випромінювання проти стробоскопічного режиму лазера</text>
<text x="480" y="46" text-anchor="middle" font-size="13" fill="#6b7280">Усунення змазування лінії на рухомому об'єкті (motion blur) та захист очей оператора</text>

<!-- ==================== LEFT COLUMN: CONTINUOUS WAVE (PROBLEM) ==================== -->
<rect x="30" y="65" width="440" height="380" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>

<!-- Left Header -->
<rect x="30" y="65" width="440" height="30" rx="6" fill="#c0392b"/>
<text x="250" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">НЕПЕРЕРВНИЙ РЕЖИМ (ПОСТІЙНЕ СВІТІННЯ CW)</text>

<!-- Tier 1: Visual simulation (Conveyor & Camera) -->
<rect x="45" y="105" width="410" height="115" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

<!-- Conveyor sub-block -->
<line x1="55" y1="185" x2="225" y2="185" stroke="#1a1a1a" stroke-width="2"/>
<circle cx="65" cy="193" r="7" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="215" cy="193" r="7" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>

<!-- Moving part -->
<rect x="85" y="160" width="45" height="25" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>

<!-- Laser module & continuous beam -->
<rect x="98" y="112" width="20" height="12" rx="2" fill="#1a1a1a"/>
<line x1="108" y1="124" x2="108" y2="160" stroke="#c0392b" stroke-width="2.5"/>

<!-- Speed arrow to the right of moving part -->
<line x1="145" y1="172" x2="190" y2="172" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
<text x="168" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">v = 0.5 м/с</text>

<!-- Camera frame view (Blurred line) -->
<rect x="250" y="115" width="190" height="70" rx="3" fill="#1a1a1a"/>
<!-- Motion blur smear on the left side of frame -->
<rect x="265" y="125" width="60" height="50" rx="2" fill="#c0392b" fill-opacity="0.45" stroke="#c0392b" stroke-dasharray="3,3" stroke-width="1"/>
<line x1="295" y1="125" x2="295" y2="175" stroke="#c0392b" stroke-width="3"/>

<!-- Text on the right side of frame -->
<text x="380" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">ЗМАЗУВАННЯ</text>
<text x="380" y="158" text-anchor="middle" font-size="12" fill="#fdecea">Ширина 10 мм</text>

<text x="140" y="210" text-anchor="middle" font-size="12" fill="#6b7280">Рух за час витримки 20 мс</text>
<text x="345" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Motion Blur (розмитий пік)</text>

<!-- Tier 2: Waveforms & Timing -->
<rect x="45" y="230" width="410" height="85" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

<text x="55" y="254" font-size="12" font-weight="bold" fill="#1a1a1a">Витримка</text>
<text x="55" y="268" font-size="12" fill="#6b7280">T_exp = 20 мс</text>

<text x="55" y="292" font-size="12" font-weight="bold" fill="#c0392b">Лазер CW</text>
<text x="55" y="306" font-size="12" fill="#c0392b">100% потужність</text>

<!-- Exposure waveform -->
<path d="M 155,268 L 190,268 L 190,248 L 400,248 L 400,268 L 440,268" fill="none" stroke="#2457d6" stroke-width="1.5"/>
<rect x="190" y="248" width="210" height="20" fill="#eaf0fd" fill-opacity="0.6"/>
<text x="295" y="262" text-anchor="middle" font-size="12" fill="#2457d6">Вікно експозиції сенсора (20 мс)</text>

<!-- Laser waveform (Continuous ON) -->
<line x1="155" y1="292" x2="440" y2="292" stroke="#c0392b" stroke-width="3"/>
<text x="295" y="306" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Постійно увімкнений (5.0 мВт постійно)</text>

<!-- Tier 3: Engineering Metrics Card -->
<rect x="45" y="325" width="410" height="110" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
<text x="55" y="344" font-size="13" font-weight="bold" fill="#c0392b">НАСЛІДКИ НЕПЕРЕРВНОГО ВИПРОМІНЮВАННЯ</text>
<text x="55" y="364" font-size="12" fill="#1a1a1a">• Змазування лінії: Δx = v·T_exp = 0.5 м/с · 20 мс = 10 мм</text>
<text x="55" y="382" font-size="12" fill="#1a1a1a">• Похибка COG зростає в десятки разів через плоский пік.</text>
<text x="55" y="400" font-size="12" fill="#1a1a1a">• Сліпіння персоналу: постійний промінь 5 мВт ріже очі.</text>
<text x="55" y="418" font-size="12" fill="#1a1a1a">• Деградація діода: постійний нагрів прискорює старіння.</text>

<!-- ==================== RIGHT COLUMN: STROBED MODE (SOLUTION) ==================== -->
<rect x="490" y="65" width="440" height="380" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>

<!-- Right Header -->
<rect x="490" y="65" width="440" height="30" rx="6" fill="#27ae60"/>
<text x="710" y="85" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">СТРОБОВАНИЙ РЕЖИМ З АВТОЯСКРАВІСТЮ</text>

<!-- Tier 1: Visual simulation (Conveyor & Camera) -->
<rect x="505" y="105" width="410" height="115" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

<!-- Conveyor sub-block -->
<line x1="515" y1="185" x2="685" y2="185" stroke="#1a1a1a" stroke-width="2"/>
<circle cx="525" cy="193" r="7" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="675" cy="193" r="7" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>

<!-- Moving part -->
<rect x="545" y="160" width="45" height="25" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>

<!-- Laser module & short pulse flash -->
<rect x="558" y="112" width="20" height="12" rx="2" fill="#1a1a1a"/>
<line x1="568" y1="124" x2="568" y2="160" stroke="#c0392b" stroke-width="2.5"/>
<circle cx="568" cy="160" r="3" fill="#c0392b"/>

<!-- Speed arrow to the right of moving part -->
<line x1="605" y1="172" x2="650" y2="172" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
<text x="628" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">v = 0.5 м/с</text>

<!-- Camera frame view (Sharp line) -->
<rect x="710" y="115" width="190" height="70" rx="3" fill="#1a1a1a"/>
<!-- Sharp laser line on the left side of frame -->
<line x1="755" y1="122" x2="755" y2="178" stroke="#c0392b" stroke-width="2"/>
<line x1="755" y1="125" x2="755" y2="175" stroke="#ffffff" stroke-width="1"/>

<!-- Text on the right side of frame -->
<text x="835" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">ЧІТКИЙ ПІК</text>
<text x="835" y="158" text-anchor="middle" font-size="12" fill="#e9f7ef">Ширина 0.1 мм</text>

<text x="600" y="210" text-anchor="middle" font-size="12" fill="#27ae60">Строб-спалах τ = 200 мкс</text>
<text x="805" y="210" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Заморожений рух (Δx &lt; 0.1 мм)</text>

<!-- Tier 2: Waveforms & Timing -->
<rect x="505" y="230" width="410" height="85" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

<text x="515" y="254" font-size="12" font-weight="bold" fill="#1a1a1a">Витримка</text>
<text x="515" y="268" font-size="12" fill="#6b7280">T_exp = 20 мс</text>

<text x="515" y="292" font-size="12" font-weight="bold" fill="#27ae60">Строб ШІМ</text>
<text x="515" y="306" font-size="12" fill="#27ae60">D = 1% (адапт.)</text>

<!-- Exposure waveform -->
<path d="M 615,268 L 650,268 L 650,248 L 860,248 L 860,268 L 900,268" fill="none" stroke="#2457d6" stroke-width="1.5"/>
<rect x="650" y="248" width="210" height="20" fill="#eaf0fd" fill-opacity="0.6"/>
<text x="755" y="262" text-anchor="middle" font-size="12" fill="#2457d6">Вікно експозиції сенсора (20 мс)</text>

<!-- Strobe pulse waveform -->
<path d="M 615,302 L 745,302 L 745,282 L 765,282 L 765,302 L 900,302" fill="none" stroke="#27ae60" stroke-width="2"/>
<rect x="745" y="282" width="20" height="20" fill="#e9f7ef"/>
<text x="755" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">τ = 200 мкс</text>
<text x="835" y="296" text-anchor="middle" font-size="12" fill="#27ae60">Лазер вимкнений 99% часу</text>

<!-- Tier 3: Engineering Metrics Card -->
<rect x="505" y="325" width="410" height="110" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
<text x="515" y="344" font-size="13" font-weight="bold" fill="#27ae60">ПЕРЕВАГИ СИНХРОНІЗОВАНОГО СТРОБУВАННЯ</text>
<text x="515" y="364" font-size="12" fill="#1a1a1a">• Замороження руху: Δx = v·τ = 0.5 м/с · 0.2 мс = 0.1 мм</text>
<text x="515" y="382" font-size="12" fill="#1a1a1a">• Субпіксельна точність COG досягає 0.02..0.05 пікселя.</text>
<text x="515" y="400" font-size="12" fill="#1a1a1a">• Лазерна безпека: середня потужність P_avg &lt; 0.1 мВт.</text>
<text x="515" y="418" font-size="12" fill="#1a1a1a">• Автояскравість: фотосенсор адаптує струм під освітлення.</text>

</svg>
