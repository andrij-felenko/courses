<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="960" height="460" fill="white"/>
<defs>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
  </marker>
  <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
  </marker>
  <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
  </marker>
  <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
  </marker>
</defs>

<!-- Заголовок і підзаголовок -->
<text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Адаптивне керування ШІМ лазера за рівнем освітлення</text>
<text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Логарифмічна крива для ока людини vs лінійний профіль для постійного SNR камери</text>

<!-- Панель 1: Графік характеристик -->
<rect x="24" y="70" width="586" height="368" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
<text x="317" y="94" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Криві регулювання ШІМ залежно від освітленості</text>

<!-- Сітка та допоміжні лінії (Y: 100%, 75%, 50%, 25%) -->
<line x1="85" y1="135" x2="560" y2="135" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="85" y1="196" x2="560" y2="196" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="85" y1="258" x2="560" y2="258" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="85" y1="319" x2="560" y2="319" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

<!-- Зона підпорогового струму (D < 12%) -->
<rect x="85" y="351" width="475" height="29" fill="#fdecea"/>
<line x1="85" y1="351" x2="560" y2="351" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4,3"/>
<text x="210" y="367" font-size="12" font-weight="700" fill="#c0392b">Поріг генерації I_th (D &lt; 12% — згасання лінії)</text>

<!-- Верхня межа 100% -->
<text x="240" y="127" font-size="12" font-weight="700" fill="#c0392b">Максимальна потужність 5 мВт (D = 100%)</text>

<!-- Вісь Y (ШІМ D, %) -->
<line x1="85" y1="380" x2="85" y2="115" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="85" y="108" font-size="12" font-weight="700" fill="#1a1a1a">ШІМ D (%)</text>

<text x="77" y="139" font-size="12" fill="#6b7280" text-anchor="end">100%</text>
<text x="77" y="200" font-size="12" fill="#6b7280" text-anchor="end">75%</text>
<text x="77" y="262" font-size="12" fill="#6b7280" text-anchor="end">50%</text>
<text x="77" y="323" font-size="12" fill="#6b7280" text-anchor="end">25%</text>
<text x="77" y="384" font-size="12" fill="#6b7280" text-anchor="end">0%</text>

<!-- Вісь X (Освітленість E_amb, люкс) -->
<line x1="85" y1="380" x2="575" y2="380" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="575" y="402" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">Освітленість E_amb (люкс)</text>

<!-- Позначки та підписи осі X -->
<line x1="85" y1="380" x2="85" y2="385" stroke="#1a1a1a" stroke-width="1"/>
<text x="85" y="398" font-size="12" fill="#6b7280" text-anchor="middle">10</text>

<line x1="200" y1="380" x2="200" y2="385" stroke="#1a1a1a" stroke-width="1"/>
<text x="200" y="398" font-size="12" fill="#6b7280" text-anchor="middle">100</text>

<line x1="340" y1="380" x2="340" y2="385" stroke="#1a1a1a" stroke-width="1"/>
<text x="340" y="398" font-size="12" fill="#6b7280" text-anchor="middle">1 000</text>

<line x1="480" y1="380" x2="480" y2="385" stroke="#1a1a1a" stroke-width="1"/>
<text x="480" y="398" font-size="12" fill="#6b7280" text-anchor="middle">5 000</text>

<line x1="550" y1="380" x2="550" y2="385" stroke="#1a1a1a" stroke-width="1"/>
<text x="550" y="398" font-size="12" fill="#6b7280" text-anchor="middle">10 000</text>

<!-- Зони умов освітлення -->
<text x="142" y="418" font-size="12" fill="#6b7280" text-anchor="middle">Темрява</text>
<text x="270" y="418" font-size="12" fill="#6b7280" text-anchor="middle">Офіс</text>
<text x="410" y="418" font-size="12" fill="#6b7280" text-anchor="middle">Цех</text>
<text x="515" y="418" font-size="12" fill="#6b7280" text-anchor="middle">Сонце</text>

<!-- Крива 1: Машинний зір (Лінійна, колір #2457d6) -->
<path d="M 85,343 L 200,306 L 340,245 L 480,172 L 540,135 L 560,135" fill="none" stroke="#2457d6" stroke-width="3"/>

<!-- Крива 2: Людське око (Логарифмічна, колір #27ae60) -->
<path d="M 85,343 Q 180,336 240,285 Q 320,215 420,165 Q 480,140 560,135" fill="none" stroke="#27ae60" stroke-width="3"/>

<!-- Маркерні точки на кривих -->
<circle cx="200" cy="306" r="4" fill="#2457d6"/>
<circle cx="340" cy="245" r="4" fill="#2457d6"/>
<circle cx="480" cy="172" r="4" fill="#2457d6"/>

<circle cx="200" cy="318" r="4" fill="#27ae60"/>
<circle cx="340" cy="205" r="4" fill="#27ae60"/>
<circle cx="480" cy="148" r="4" fill="#27ae60"/>

<!-- Легенда графіків -->
<rect x="105" y="146" width="240" height="44" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<line x1="115" y1="160" x2="138" y2="160" stroke="#2457d6" stroke-width="3"/>
<text x="146" y="164" font-size="12" font-weight="700" fill="#2457d6">Камера (SNR = const, лінійна)</text>

<line x1="115" y1="178" x2="138" y2="178" stroke="#27ae60" stroke-width="3"/>
<text x="146" y="182" font-size="12" font-weight="700" fill="#27ae60">Око (Вебер-Фехнер, комфорт)</text>

<!-- Панель 2: Порівняння стратегій -->
<rect x="626" y="70" width="310" height="368" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
<text x="781" y="94" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Порівняння стратегій регулювання</text>

<!-- Картка 1: Око оператора -->
<rect x="638" y="108" width="286" height="96" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
<text x="781" y="126" font-size="13" font-weight="700" fill="#27ae60" text-anchor="middle">1. Візуальний комфорт оператора</text>
<text x="648" y="146" font-size="12" fill="#1a1a1a">• Закон Вебера-Фехнера: S ∝ ln(I)</text>
<text x="648" y="164" font-size="12" fill="#1a1a1a">• У темряві: D ≤ 20% проти засліплення</text>
<text x="648" y="182" font-size="12" fill="#1a1a1a">• При світлі: швидкий підйом контрасту</text>
<text x="648" y="198" font-size="12" fill="#6b7280">→ Запобігає втомі очей оператора</text>

<!-- Картка 2: Машинний зір -->
<rect x="638" y="216" width="286" height="96" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
<text x="781" y="234" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">2. Сенсор камери машинного зору</text>
<text x="648" y="254" font-size="12" fill="#1a1a1a">• Лінійний фотоелектричний відгук КМОН</text>
<text x="648" y="272" font-size="12" fill="#1a1a1a">• Підтримання SNR = const над шумом</text>
<text x="648" y="290" font-size="12" fill="#1a1a1a">• Пропорційне зростання: D ∝ E_amb</text>
<text x="648" y="306" font-size="12" fill="#6b7280">→ Стабільне субпіксельне виявлення</text>

<!-- Картка 3: Обмеження безпеки -->
<rect x="638" y="324" width="286" height="104" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="781" y="342" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle">3. Апаратні обмеження безпеки</text>
<text x="648" y="362" font-size="12" fill="#1a1a1a">• Поріг струму: D ≥ 12% (I &gt; I_th)</text>
<text x="648" y="380" font-size="12" fill="#1a1a1a">• Захист COD: обмеження P_max ≤ 5 мВт</text>
<text x="648" y="398" font-size="12" fill="#1a1a1a">• Тепловий таймер: контроль при D = 100%</text>
<text x="648" y="416" font-size="12" fill="#6b7280">→ Запобігає деградації кристала діода</text>
</svg>
