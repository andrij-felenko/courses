<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- МАРКЕРИ СТРІЛОК -->
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- ЗАГОЛОВОК І ПІДЗАГОЛОВОК -->
  <text x="480" y="25" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Геометрична умова Шаймпфлюга в оптичній лазерній тріангуляції</text>
  <text x="480" y="45" text-anchor="middle" font-size="13" fill="#6b7280">Перетин площини лазерного ножа, головної площини об'єктива та площини сенсора на єдиній осі фокусування</text>

  <!-- ГОЛОВНА ПАНЕЛЬ ОПТИЧНОЇ СХЕМИ -->
  <rect x="30" y="60" width="900" height="272" rx="8" fill="#f8fafc" stroke="#d0d7de"/>

  <!-- ЗОНА ОБ'ЄКТА / ПОВЕРХНЯ ВИМІРЮВАННЯ -->
  <path d="M 60,265 L 140,240 L 220,255 L 300,225 L 380,245 L 430,230" fill="none" stroke="#d0d7de" stroke-width="2"/>
  <text x="75" y="278" font-size="12" fill="#6b7280">Вимірювана поверхня (рельєф)</text>

  <!-- ЛАЗЕРНИЙ МОДУЛЬ -->
  <rect x="80" y="72" width="70" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="115" y="89" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">Лазер</text>

  <!-- ОПТИЧНА ВІСЬ КАМЕРИ -->
  <line x1="140" y1="185" x2="455" y2="185" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="485" y1="185" x2="640" y2="185" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="5,4"/>
  <text x="180" y="202" font-size="12" fill="#6b7280">Оптична вісь</text>

  <!-- ПЛОЩИНА 1: ЛАЗЕРНИЙ НІЖ (ЧЕРВОНИЙ ПУНКТИР) -->
  <line x1="115" y1="98" x2="470" y2="300" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,4"/>
  <text x="145" y="108" font-size="12" font-weight="700" fill="#c0392b">Площина лазера (Laser Plane)</text>

  <!-- ПЛОЩИНА 2: ГОЛОВНА ПЛОЩИНА ОБ'ЄКТИВА (СИНЯ ВІСЬ) -->
  <line x1="470" y1="104" x2="470" y2="295" stroke="#2457d6" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="470" y="82" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Площина об'єктива</text>
  <text x="470" y="96" text-anchor="middle" font-size="12" fill="#6b7280">(Lens Plane)</text>

  <!-- СИМВОЛ ЛІНЗИ ОБ'ЄКТИВА -->
  <path d="M 470,145 C 478,165 478,205 470,225 C 462,205 462,165 470,145 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <circle cx="470" cy="185" r="3.5" fill="#2457d6"/>
  <text x="455" y="158" text-anchor="end" font-size="12" font-weight="700" fill="#2457d6">Лінза камери (O_lens)</text>

  <!-- ПЛОЩИНА 3: ПЛОЩИНА СЕНСОРА (ЗЕЛЕНА ВІСЬ) -->
  <line x1="470" y1="300" x2="685" y2="59" stroke="#27ae60" stroke-width="2" stroke-dasharray="5,4"/>

  <!-- ФІЗИЧНИЙ КМОН-СЕНСОР (МАТРИЦЯ КАМЕРИ) -->
  <line x1="550" y1="210" x2="665" y2="81" stroke="#27ae60" stroke-width="6" stroke-linecap="round"/>
  <text x="690" y="74" font-size="12" font-weight="700" fill="#27ae60">Площина сенсора (Sensor Plane)</text>
  <text x="690" y="90" font-size="12" fill="#27ae60">КМОН-матриця під кутом α</text>

  <!-- ТОЧКА ПЕРЕТИНУ ШАЙМПФЛЮГА S -->
  <circle cx="470" cy="300" r="5.5" fill="#1a1a1a"/>
  <circle cx="470" cy="300" r="9" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="2,2"/>
  <text x="470" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Спільна вісь Шаймпфлюга (точка S)</text>

  <!-- ТОЧКИ НА ЛАЗЕРНІЙ ПЛОЩИНІ -->
  <!-- P_far -->
  <circle cx="167" cy="130" r="4.5" fill="#c0392b"/>
  <text x="180" y="132" font-size="12" font-weight="700" fill="#c0392b">P_far (далека)</text>

  <!-- P_mid -->
  <circle cx="265" cy="185" r="4.5" fill="#c0392b"/>
  <text x="275" y="200" font-size="12" font-weight="700" fill="#c0392b">P_mid (центр)</text>

  <!-- P_near -->
  <circle cx="363" cy="240" r="4.5" fill="#c0392b"/>
  <text x="350" y="258" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b">P_near (близька)</text>

  <!-- СПОЛУЧЕНІ ТОЧКИ НА СЕНСОРІ -->
  <!-- P'_far -->
  <circle cx="558" cy="201" r="4" fill="#27ae60"/>
  <text x="570" y="215" font-size="12" font-weight="700" fill="#27ae60">P'_far (фокус)</text>

  <!-- P'_mid -->
  <circle cx="573" cy="185" r="4" fill="#27ae60"/>

  <!-- P'_near -->
  <circle cx="659" cy="88" r="4" fill="#27ae60"/>
  <text x="645" y="80" text-anchor="end" font-size="12" font-weight="700" fill="#27ae60">P'_near (фокус)</text>

  <!-- ХІД ОПТИЧНИХ ПРОМЕНІВ (ЧЕРЕЗ ЦЕНТР ЛІНЗИ) -->
  <!-- Промінь від P_far -->
  <line x1="167" y1="130" x2="470" y2="185" stroke="#2457d6" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <line x1="470" y1="185" x2="558" y2="201" stroke="#2457d6" stroke-width="1.2"/>

  <!-- Промінь від P_near -->
  <line x1="363" y1="240" x2="470" y2="185" stroke="#27ae60" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <line x1="470" y1="185" x2="659" y2="88" stroke="#27ae60" stroke-width="1.2"/>

  <!-- КУТИ ТА СПІВВІДНОШЕННЯ -->
  <!-- Дуга кута beta (між площиною лінзи і лазером) -->
  <path d="M 470,260 A 40,40 0 0,0 442,266" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <text x="432" y="278" font-size="12" font-weight="700" fill="#c0392b">β</text>

  <!-- Дуга кута alpha (між площиною лінзи і сенсором) -->
  <path d="M 470,250 A 50,50 0 0,1 495,257" fill="none" stroke="#27ae60" stroke-width="1.5"/>
  <text x="500" y="272" font-size="12" font-weight="700" fill="#27ae60">α</text>

  <!-- ПРАВА ІНФО-ПАНЕЛЬ / РЕЗУЛЬТАТ -->
  <rect x="740" y="112" width="176" height="106" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="752" y="132" font-size="12" font-weight="700" fill="#1a1a1a">Результат Шаймпфлюга:</text>
  <text x="752" y="150" font-size="12" font-weight="700" fill="#27ae60">✔ Повна різкість (Full DOF)</text>
  <text x="752" y="167" font-size="12" fill="#1a1a1a">Усі точки лазерної лінії</text>
  <text x="752" y="183" font-size="12" fill="#1a1a1a">сфокусовані одночасно</text>
  <text x="752" y="202" font-size="12" font-weight="700" fill="#2457d6">Перетин площин у точці S</text>

  <!-- НИЖНІ КАРТКИ ПОРІВНЯННЯ -->
  <!-- Картка 1: Паралельна геометрія -->
  <rect x="30" y="346" width="436" height="98" rx="8" fill="#fdecea" stroke="#c0392b"/>
  <text x="46" y="368" font-size="13" font-weight="700" fill="#c0392b">Звичайна паралельна геометрія (сенсор || лінза)</text>
  <text x="46" y="388" font-size="12" fill="#1a1a1a">• Площина фокуса паралельна лінзі, а лазерний ніж нахилений</text>
  <text x="46" y="405" font-size="12" fill="#1a1a1a">• Обмежена глибина різкості (DOF): різкий лише центр P_mid</text>
  <text x="46" y="422" font-size="12" fill="#6b7280">• Краї лінії (P_near, P_far) дефокусовані → розмиття й похибка COG</text>

  <!-- Картка 2: Умова Шаймпфлюга -->
  <rect x="484" y="346" width="436" height="98" rx="8" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="500" y="368" font-size="13" font-weight="700" fill="#27ae60">Умова Шаймпфлюга: tan(α) / tan(β) = M</text>
  <text x="500" y="388" font-size="12" fill="#1a1a1a">• Сенсор нахилено під розрахунковим кутом α до осі лінзи</text>
  <text x="500" y="405" font-size="12" fill="#1a1a1a">• Площина фокуса точно збігається з усією площиною лазера</text>
  <text x="500" y="422" font-size="12" fill="#6b7280">• Бездоганна різкість вздовж усього ножа → субпіксельна точність</text>
</svg>
