<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Призма Павелла проти DOE: рефракція чи дифракція для лазерної лінії</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Рефракційна призма дає стабільний Flat-Top, а DOE створює нульову пляму та температурний дрейф кута</text>

  <!-- LEFT PANEL: Powell Prism -->
  <rect x="30" y="78" width="435" height="252" rx="8" ry="8" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="30" y="78" width="435" height="30" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="247" y="98" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Призма Павелла: Рефракційна асферика (Норма)</text>

  <!-- Left Panel: Input Beam -->
  <circle cx="70" cy="165" r="18" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="70" y="125" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вхідний пучок</text>
  <text x="70" y="202" font-size="12" fill="#6b7280" text-anchor="middle">Колімований</text>

  <!-- Parallel rays -->
  <line x1="95" y1="152" x2="140" y2="152" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="95" y1="165" x2="140" y2="165" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <line x1="95" y1="178" x2="140" y2="178" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Powell Prism -->
  <path d="M 140,132 L 175,165 L 140,198 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="158" y="122" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Призма Павелла</text>
  <text x="158" y="214" font-size="12" fill="#6b7280" text-anchor="middle">Асферичний дах</text>

  <!-- Refracted rays fan -->
  <line x1="175" y1="165" x2="350" y2="135" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="175" y1="165" x2="350" y2="150" stroke="#2457d6" stroke-width="2"/>
  <line x1="175" y1="165" x2="350" y2="165" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <line x1="175" y1="165" x2="350" y2="180" stroke="#2457d6" stroke-width="2"/>
  <line x1="175" y1="165" x2="350" y2="195" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Screen -->
  <line x1="355" y1="128" x2="355" y2="202" stroke="#1a1a1a" stroke-width="3"/>
  <text x="355" y="222" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Екран</text>

  <!-- Continuous uniform line -->
  <rect x="361" y="128" width="8" height="74" rx="2" fill="#27ae60"/>

  <text x="375" y="146" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">Рівномірна</text>
  <text x="375" y="165" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">Flat-Top</text>
  <text x="375" y="184" font-size="12" fill="#6b7280" text-anchor="start">Немає нуля</text>

  <!-- Left Panel bottom note -->
  <rect x="42" y="278" width="411" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="247" y="295" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Закон Снелліуса: заломлення світла без дифракції</text>
  <text x="247" y="311" font-size="12" fill="#1a1a1a" text-anchor="middle">Стабільний кут розгортки при зміні температури діода</text>


  <!-- RIGHT PANEL: DOE -->
  <rect x="495" y="78" width="435" height="252" rx="8" ry="8" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="495" y="78" width="435" height="30" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="712" y="98" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Дифракційний елемент (DOE): Фазова решітка</text>

  <!-- Right Panel: Input Beam -->
  <circle cx="535" cy="165" r="18" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="535" y="125" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вхідний пучок</text>
  <text x="535" y="202" font-size="12" fill="#6b7280" text-anchor="middle">Колімований</text>

  <!-- Parallel rays -->
  <line x1="560" y1="152" x2="600" y2="152" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="560" y1="165" x2="600" y2="165" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <line x1="560" y1="178" x2="600" y2="178" stroke="#c0392b" stroke-width="1.5"/>

  <!-- DOE Plate with grating marks -->
  <rect x="600" y="132" width="10" height="66" rx="2" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="600" y1="142" x2="610" y2="142" stroke="#c0392b" stroke-width="1"/>
  <line x1="600" y1="152" x2="610" y2="152" stroke="#c0392b" stroke-width="1"/>
  <line x1="600" y1="162" x2="610" y2="162" stroke="#c0392b" stroke-width="1"/>
  <line x1="600" y1="172" x2="610" y2="172" stroke="#c0392b" stroke-width="1"/>
  <line x1="600" y1="182" x2="610" y2="182" stroke="#c0392b" stroke-width="1"/>
  <text x="605" y="122" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">DOE-пластина</text>
  <text x="605" y="214" font-size="12" fill="#6b7280" text-anchor="middle">Фазовий рельєф</text>

  <!-- Diffracted rays -->
  <!-- Parasitic higher orders (dashed) -->
  <line x1="610" y1="165" x2="815" y2="125" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="610" y1="165" x2="815" y2="205" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="715" y="134" font-size="12" fill="#c0392b" text-anchor="middle">Паразитні порядки</text>

  <!-- Main line rays -->
  <line x1="610" y1="165" x2="815" y2="145" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="610" y1="165" x2="815" y2="185" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Zero-order central hot ray -->
  <line x1="610" y1="165" x2="815" y2="165" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-red)"/>

  <!-- Screen -->
  <line x1="820" y1="120" x2="820" y2="210" stroke="#1a1a1a" stroke-width="3"/>
  <text x="820" y="226" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Екран</text>

  <!-- Result on screen: line + thermal expansion + zero spot -->
  <!-- Thermal drift expansion outline (dashed) -->
  <rect x="826" y="130" width="8" height="70" rx="2" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- Diffracted line -->
  <rect x="826" y="135" width="8" height="60" rx="2" fill="#c0392b" fill-opacity="0.8"/>
  <!-- Parasitic side dots -->
  <circle cx="830" cy="125" r="2.5" fill="#c0392b"/>
  <circle cx="830" cy="205" r="2.5" fill="#c0392b"/>
  <!-- Zero-order hotspot -->
  <circle cx="830" cy="165" r="5.5" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>

  <text x="842" y="146" font-size="12" fill="#6b7280" text-anchor="start">Дрейф L(T)</text>
  <text x="842" y="169" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">Точка m=0</text>
  <text x="842" y="188" font-size="12" fill="#c0392b" text-anchor="start">Паразити</text>

  <!-- Right Panel bottom note -->
  <rect x="507" y="278" width="411" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="712" y="295" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Дифракція: sin θ = m·λ / d (пряма залежність від λ)</text>
  <text x="712" y="311" font-size="12" fill="#1a1a1a" text-anchor="middle">Нагрів діода на 20°C змінює довжину лінії та розмиває контур</text>


  <!-- BOTTOM SECTION: SUMMARY CARDS -->
  <!-- Card 1: Zero-order spot -->
  <rect x="30" y="345" width="286" height="90" rx="8" ry="8" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="30" y="345" width="286" height="26" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="173" y="362" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">1. НУЛЬОВИЙ ПОРЯДОК (m = 0)</text>
  <text x="42" y="385" font-size="12" fill="#1a1a1a">• Недифрагована пляма в центрі DOE</text>
  <text x="42" y="403" font-size="12" fill="#1a1a1a">• Пересвіт сенсора та спалах камери</text>
  <text x="42" y="421" font-size="12" font-weight="bold" fill="#27ae60">• Призма Павелла: нульовий пік відсутній</text>

  <!-- Card 2: Thermal drift -->
  <rect x="337" y="345" width="286" height="90" rx="8" ry="8" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="337" y="345" width="286" height="26" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="480" y="362" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">2. ТЕМПЕРАТУРНИЙ ДРЕЙФ λ(T)</text>
  <text x="349" y="385" font-size="12" fill="#1a1a1a">• DOE: кут розгортки пливе з довжиною λ</text>
  <text x="349" y="403" font-size="12" fill="#1a1a1a">• «Дихання» довжини при нагріві діода</text>
  <text x="349" y="421" font-size="12" font-weight="bold" fill="#27ae60">• Призма Павелла: стабільна геометрія</text>

  <!-- Card 3: Machine vision accuracy -->
  <rect x="644" y="345" width="286" height="90" rx="8" ry="8" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="644" y="345" width="286" height="26" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="787" y="362" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">3. ТОЧНІСТЬ У 3D-ЗОРІ</text>
  <text x="656" y="385" font-size="12" fill="#1a1a1a">• DOE: паразитні дифракційні фантоми</text>
  <text x="656" y="403" font-size="12" fill="#1a1a1a">• Призма Павелла: висока метрологія</text>
  <text x="656" y="421" font-size="12" font-weight="bold" fill="#27ae60">• Золотий стандарт тріангуляції</text>

</svg>
