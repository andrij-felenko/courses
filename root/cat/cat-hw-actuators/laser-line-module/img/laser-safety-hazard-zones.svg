<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- ЗАГОЛОВОК ТА ПІДЗАГОЛОВОК -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Зони небезпеки лазерного випромінювання класу 3R (650 нм, 5 мВт)</text>
  <text x="480" y="57" text-anchor="middle" font-size="13" fill="#6b7280">Прямий промінь і дзеркальне відбиття уражають сітківку; матові пастки та окуляри 650 нм усувають загрозу</text>

  <!-- ЛАЗЕРНИЙ МОДУЛЬ (ліворуч) -->
  <text x="88" y="193" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Лазерний модуль 3R</text>
  <text x="88" y="208" text-anchor="middle" font-size="12" fill="#6b7280">650 нм • 5 мВт CW</text>
  <!-- Корпус модуля (єдиний прямокутник) -->
  <rect x="35" y="215" width="85" height="50" rx="4" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="50" y1="220" x2="50" y2="260" stroke="#d0d7de" stroke-width="1.2"/>
  <line x1="65" y1="220" x2="65" y2="260" stroke="#d0d7de" stroke-width="1.2"/>
  <line x1="80" y1="220" x2="80" y2="260" stroke="#d0d7de" stroke-width="1.2"/>
  <line x1="95" y1="215" x2="95" y2="265" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="102" y1="220" x2="102" y2="260" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="110" y1="220" x2="110" y2="260" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- Насадка призми Павелла -->
  <polygon points="120,226 130,230 130,250 120,254" fill="#2457d6"/>
  <text x="88" y="283" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Призма Павелла</text>
  <text x="88" y="297" text-anchor="middle" font-size="12" fill="#6b7280">(розгортка лінії)</text>

  <!-- ЗОНА ВІЯЛА СМУГИ (світловий сектор) -->
  <polygon points="130,240 380,125 380,275" fill="#fdecea" fill-opacity="0.45"/>
  <line x1="130" y1="240" x2="380" y2="125" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4,3"/>
  <line x1="130" y1="240" x2="380" y2="275" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4,3"/>
  
  <!-- Напис зони віяла -->
  <text x="205" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Розгорнуте віяло смуги</text>
  <text x="205" y="147" text-anchor="middle" font-size="12" fill="#6b7280">(кут розкриття 60°)</text>

  <!-- ВЕКТОР ПРЯМОГО ВИПРОМІНЮВАННЯ -->
  <line x1="130" y1="240" x2="465" y2="240" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-red)"/>
  <text x="320" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Вектор прямого випромінювання</text>

  <!-- ГЛЯНЦЕВА ДЕТАЛЬ (Дзеркальне відбиття) -->
  <text x="355" y="103" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Глянцева деталь</text>
  <text x="355" y="117" text-anchor="middle" font-size="12" fill="#6b7280">(дзеркальна поверхня)</text>
  <polygon points="375,130 395,130 405,175 385,175" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

  <!-- ТРАЄКТОРІЯ ДЗЕРКАЛЬНОГО ВІДБИТТЯ -->
  <line x1="390" y1="145" x2="560" y2="88" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="475" y="84" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Дзеркальний відблиск</text>

  <!-- СВІТЛОПОГЛИНАЮЧА ПАСТКА (BEAM DUMP) -->
  <rect x="565" y="74" width="95" height="56" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="577" y="84" width="70" height="36" rx="2" fill="#1a1a1a"/>
  <text x="612" y="99" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Пастка</text>
  <text x="612" y="113" text-anchor="middle" font-size="12" fill="#27ae60">Beam Dump</text>
  <text x="612" y="146" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Матова пастка</text>
  <text x="612" y="160" text-anchor="middle" font-size="12" fill="#6b7280">(поглинання &gt; 99%)</text>

  <!-- КАРТКА: КРИТИЧНА ЗАГРОЗА СІТКІВЦІ (вгорі праворуч) -->
  <rect x="675" y="74" width="260" height="98" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="805" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Критична загроза для сітківки</text>
  <text x="690" y="113" font-size="12" fill="#1a1a1a">• Дзеркальний відблиск: колімований</text>
  <text x="690" y="129" font-size="12" fill="#1a1a1a">• 100% густини спрямовано в око</text>
  <text x="690" y="145" font-size="12" fill="#c0392b">• Рефлекс кліпання (0,25 с) не рятує</text>
  <text x="690" y="161" font-size="12" fill="#27ae60">• Пастка обов'язкова на відблиску!</text>

  <!-- МАТОВА ПОВЕРХНЯ ТА ДИФУЗНЕ РОЗСІЮВАННЯ -->
  <text x="480" y="185" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Матова поверхня</text>
  <text x="480" y="199" text-anchor="middle" font-size="12" fill="#6b7280">(робоча мішень)</text>
  <rect x="472" y="206" width="16" height="74" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Дифузні сферичні хвилі розсіювання -->
  <path d="M 488,226 A 14 14 0 0 1 488,254" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3"/>
  <path d="M 488,216 A 24 24 0 0 1 488,264" fill="none" stroke="#27ae60" stroke-width="1.3" stroke-dasharray="3,3"/>
  <path d="M 488,206 A 34 34 0 0 1 488,274" fill="none" stroke="#27ae60" stroke-width="1.1" stroke-dasharray="4,4"/>

  <!-- Напис дифузного розсіювання -->
  <text x="595" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Дифузне розсіювання</text>
  <text x="595" y="238" text-anchor="middle" font-size="12" fill="#1a1a1a">Густина спадає ~ 1/r²</text>
  <text x="595" y="254" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Безпечно: r &gt; 15 см</text>

  <!-- КАРТКА: ПАРАМЕТРИ ПРОМЕНЯ (посередині праворуч) -->
  <rect x="675" y="186" width="260" height="96" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="805" y="206" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Параметри небезпеки (Клас 3R)</text>
  <text x="690" y="226" font-size="12" fill="#c0392b">• Прямий пучок: NOHD = 2,2 м</text>
  <text x="690" y="244" font-size="12" fill="#27ae60">• Дифузне поле: безпечно (r &gt; 15 см)</text>
  <text x="690" y="262" font-size="12" fill="#1a1a1a">• Потрібна кінцева матова пастка</text>

  <!-- НИЖНЯ ЛІВА КАРТКА: БЕЗПЕЧНІ ДИСТАНЦІЇ ТА РЕГЛАМЕНТ -->
  <rect x="25" y="318" width="465" height="114" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="257" y="337" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Безпечні дистанції та регламент зон (Клас 3R)</text>
  <text x="40" y="357" font-size="12" font-weight="bold" fill="#c0392b">• Прямий промінь:</text>
  <text x="165" y="357" font-size="12" fill="#1a1a1a">NOHD = 2,2 м (зона ураження ока)</text>
  <text x="40" y="377" font-size="12" font-weight="bold" fill="#c0392b">• Дзеркальне відбиття:</text>
  <text x="195" y="377" font-size="12" fill="#1a1a1a">зберігає 100% густини, вимагає пастки</text>
  <text x="40" y="397" font-size="12" font-weight="bold" fill="#27ae60">• Дифузне розсіювання:</text>
  <text x="200" y="397" font-size="12" fill="#1a1a1a">безпечно для очей при r &gt; 15 см</text>
  <text x="40" y="416" font-size="12" fill="#6b7280">• Кліпання (0,25 с) не рятує від прямого фокусу</text>

  <!-- НИЖНЯ ПРАВА КАРТКА: ЗАХИСНІ ОКУЛЯРИ ТА КУТИ НОСІННЯ -->
  <rect x="505" y="296" width="430" height="136" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  
  <!-- Піктограма захисних окулярів -->
  <rect x="522" y="332" width="68" height="30" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
  <path d="M 527,337 h 18 a 3 3 0 0 1 3 3 v 12 a 3 3 0 0 1 -3 3 h -18 a 3 3 0 0 1 -3 -3 v -12 a 3 3 0 0 1 3 -3 z" fill="#27ae60" fill-opacity="0.3" stroke="#27ae60" stroke-width="1.2"/>
  <path d="M 561,337 h 18 a 3 3 0 0 1 3 3 v 12 a 3 3 0 0 1 -3 3 h -18 a 3 3 0 0 1 -3 -3 v -12 a 3 3 0 0 1 3 -3 z" fill="#27ae60" fill-opacity="0.3" stroke="#27ae60" stroke-width="1.2"/>
  <polygon points="522,336 514,342 514,354 522,360" fill="#2457d6" fill-opacity="0.35"/>
  <polygon points="590,336 598,342 598,354 590,360" fill="#2457d6" fill-opacity="0.35"/>
  <text x="556" y="380" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Фільтр 650 нм</text>
  <text x="556" y="396" text-anchor="middle" font-size="12" fill="#1a1a1a">OD ≥ 2</text>
  <text x="556" y="412" text-anchor="middle" font-size="12" fill="#6b7280">Бічний захист</text>

  <!-- Текст вимог до окулярів -->
  <text x="612" y="316" font-size="13" font-weight="bold" fill="#2457d6">Вимоги до захисних окулярів (650 нм)</text>
  <text x="612" y="336" font-size="12" fill="#1a1a1a">• Фільтрація: оптична густина OD ≥ 2</text>
  <text x="612" y="354" font-size="12" fill="#1a1a1a">• Ослаблення: &gt; 100× (потужність &lt; 0,05 мВт)</text>
  <text x="612" y="372" font-size="12" fill="#1a1a1a">• Кути захисту: оправа з бічними щитками</text>
  <text x="612" y="390" font-size="12" fill="#1a1a1a">• Перекриття прямих і бічних відблисків</text>
  <text x="612" y="408" font-size="12" fill="#c0392b">• Заборонено прямий погляд в апертуру!</text>
</svg>
