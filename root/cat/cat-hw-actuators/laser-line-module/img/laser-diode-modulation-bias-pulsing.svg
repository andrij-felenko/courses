<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Модуляція лазерного діода: від нуля проти попереднього зміщення</text>
  <text x="480" y="57" font-size="13" fill="#6b7280" text-anchor="middle">Зміщення на рівні порогу (I_bias ≈ I_th) усуває затримку вмикання та небезпечні релаксаційні піки COD</text>

  <!-- Left Panel: Zero-Bias Modulation -->
  <rect x="30" y="75" width="435" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="42" y="87" width="411" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="247" y="104" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">МОДУЛЯЦІЯ ВІД НУЛЯ (I_off = 0)</text>

  <!-- Left Panel: Section Title 1 -->
  <text x="90" y="131" font-size="12" font-weight="bold" fill="#1a1a1a">СТРУМ НАКАЧКИ I(t)</text>

  <!-- Left Oscillogram 1 Frame: Current I(t) -->
  <rect x="90" y="138" width="350" height="72" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="82" y="148" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">I(t)</text>
  <text x="82" y="157" font-size="12" fill="#2457d6" text-anchor="end">I_on</text>
  <text x="82" y="179" font-size="12" fill="#6b7280" text-anchor="end">I_th</text>
  <text x="82" y="204" font-size="12" fill="#6b7280" text-anchor="end">0</text>

  <!-- Left I_th Threshold Line -->
  <line x1="90" y1="175" x2="440" y2="175" stroke="#d0d7de" stroke-dasharray="4 3"/>
  <text x="432" y="171" font-size="12" fill="#6b7280" text-anchor="end">Поріг I_th</text>

  <!-- Vertical Timing Alignment Lines (Left) inside Frame 1 -->
  <line x1="160" y1="138" x2="160" y2="210" stroke="#d0d7de" stroke-dasharray="2 2"/>
  <line x1="340" y1="138" x2="340" y2="210" stroke="#d0d7de" stroke-dasharray="2 2"/>

  <!-- Current Waveform (Left) -->
  <path d="M 110,200 L 160,200 L 163,150 L 340,150 L 343,200 L 420,200" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Left Panel: Section Title 2 -->
  <text x="90" y="231" font-size="12" font-weight="bold" fill="#c0392b">ОПТИЧНИЙ ВІДГУК P_opt(t)</text>

  <!-- Left Oscillogram 2 Frame: Optical Power P(t) -->
  <rect x="90" y="240" width="350" height="72" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="82" y="249" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">P(t)</text>
  <text x="82" y="258" font-size="12" fill="#c0392b" text-anchor="end">P_max</text>
  <text x="82" y="279" font-size="12" fill="#6b7280" text-anchor="end">P_nom</text>
  <text x="82" y="304" font-size="12" fill="#6b7280" text-anchor="end">0</text>

  <!-- Vertical Timing Alignment Lines (Left) inside Frame 2 -->
  <line x1="160" y1="240" x2="160" y2="312" stroke="#d0d7de" stroke-dasharray="2 2"/>
  <line x1="340" y1="240" x2="340" y2="312" stroke="#d0d7de" stroke-dasharray="2 2"/>

  <!-- Nominal Optical Power Line -->
  <line x1="90" y1="275" x2="440" y2="275" stroke="#d0d7de" stroke-dasharray="4 3"/>

  <!-- Optical Waveform with Delay and Ringing (Left) -->
  <path d="M 110,300 L 195,300 Q 200,248 205,248 Q 210,248 215,285 Q 220,285 225,270 Q 230,270 235,277 Q 242,277 250,275 L 340,275 L 346,300 L 420,300" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Turn-on Delay Callout t_d (Left) -->
  <line x1="177" y1="290" x2="162" y2="290" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="178" y1="290" x2="193" y2="290" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="177" y="284" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">t_d</text>

  <!-- Relaxation Oscillations / COD Callouts (Left) -->
  <line x1="246" y1="249" x2="212" y2="249" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="250" y="253" font-size="12" font-weight="bold" fill="#c0392b">Спалах COD!</text>
  <text x="250" y="267" font-size="12" fill="#6b7280">Релаксаційний дзвін</text>

  <!-- Left Bottom Card: Drawbacks -->
  <rect x="42" y="330" width="411" height="95" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <rect x="52" y="338" width="391" height="20" rx="3" fill="#c0392b"/>
  <text x="247" y="352" font-size="12" font-weight="bold" fill="white" text-anchor="middle">НАСЛІДКИ МОДУЛЯЦІЇ БЕЗ ЗМІЩЕННЯ</text>
  <text x="54" y="372" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#c0392b">• Затримка t_d (1–5 нс):</tspan> потрібен час на інверсію носіїв</text>
  <text x="54" y="390" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#c0392b">• Спалахи COD:</tspan> релаксаційний пік перепалює дзеркала</text>
  <text x="54" y="408" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#c0392b">• Джитер:</tspan> сильний фазовий шум і спотворення фронту</text>


  <!-- Right Panel: Threshold Bias Modulation -->
  <rect x="495" y="75" width="435" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="507" y="87" width="411" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712" y="104" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">МОДУЛЯЦІЯ ЗІ ЗМІЩЕННЯМ (I_bias ≈ I_th)</text>

  <!-- Right Panel: Section Title 1 -->
  <text x="555" y="131" font-size="12" font-weight="bold" fill="#1a1a1a">СТРУМ НАКАЧКИ I(t)</text>

  <!-- Right Oscillogram 1 Frame: Current I(t) -->
  <rect x="555" y="138" width="350" height="72" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="547" y="148" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">I(t)</text>
  <text x="547" y="157" font-size="12" fill="#2457d6" text-anchor="end">I_on</text>
  <text x="547" y="179" font-size="12" fill="#27ae60" text-anchor="end">I_th</text>
  <text x="547" y="204" font-size="12" fill="#6b7280" text-anchor="end">0</text>

  <!-- Right Threshold Bias Line -->
  <line x1="555" y1="175" x2="905" y2="175" stroke="#27ae60" stroke-dasharray="4 3" stroke-width="1"/>
  <text x="895" y="171" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">I_bias = I_th</text>
  <!-- Zero level reference line -->
  <line x1="555" y1="200" x2="905" y2="200" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Vertical Timing Alignment Lines (Right) inside Frame 1 -->
  <line x1="625" y1="138" x2="625" y2="210" stroke="#d0d7de" stroke-dasharray="2 2"/>
  <line x1="805" y1="138" x2="805" y2="210" stroke="#d0d7de" stroke-dasharray="2 2"/>

  <!-- Current Waveform with Bias (Right) -->
  <path d="M 575,175 L 625,175 L 628,150 L 805,150 L 808,175 L 885,175" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <text x="640" y="193" font-size="12" font-weight="bold" fill="#27ae60">Постійний струм зміщення I_bias</text>

  <!-- Right Panel: Section Title 2 -->
  <text x="555" y="231" font-size="12" font-weight="bold" fill="#27ae60">ОПТИЧНИЙ ВІДГУК P_opt(t)</text>

  <!-- Right Oscillogram 2 Frame: Optical Power P(t) -->
  <rect x="555" y="240" width="350" height="72" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="547" y="249" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">P(t)</text>
  <text x="547" y="279" font-size="12" fill="#27ae60" text-anchor="end">P_nom</text>
  <text x="547" y="304" font-size="12" fill="#6b7280" text-anchor="end">0</text>

  <!-- Vertical Timing Alignment Lines (Right) inside Frame 2 -->
  <line x1="625" y1="240" x2="625" y2="312" stroke="#d0d7de" stroke-dasharray="2 2"/>
  <line x1="805" y1="240" x2="805" y2="312" stroke="#d0d7de" stroke-dasharray="2 2"/>
  <!-- Nominal Optical Power Line -->
  <line x1="555" y1="275" x2="905" y2="275" stroke="#d0d7de" stroke-dasharray="4 3"/>

  <!-- Optical Waveform with Bias (Right) -->
  <path d="M 575,300 L 625,300 L 628,274 Q 632,272 636,275 L 805,275 L 808,300 L 885,300" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Fast Edge / No COD Callouts (Right) -->
  <text x="645" y="260" font-size="12" font-weight="bold" fill="#27ae60">Швидкий чистий фронт: t_d ≈ 0</text>
  <text x="645" y="292" font-size="12" fill="#6b7280">Без перерегулювання та викидів COD</text>

  <!-- Right Bottom Card: Benefits -->
  <rect x="507" y="330" width="411" height="95" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <rect x="517" y="338" width="391" height="20" rx="3" fill="#27ae60"/>
  <text x="712" y="352" font-size="12" font-weight="bold" fill="white" text-anchor="middle">ПЕРЕВАГИ ЗМІЩЕННЯ НА РІВНІ ПОРОГУ</text>
  <text x="519" y="372" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#27ae60">• Миттєвий старт (t_d ≈ 0):</tspan> носії вже на порозі N_th</text>
  <text x="519" y="390" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#27ae60">• Захист від COD:</tspan> релаксаційні коливання задемпфовані</text>
  <text x="519" y="408" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#27ae60">• Гігагерцова смуга:</tspan> висока швидкість передачі даних</text>
</svg>
