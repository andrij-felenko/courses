<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Головний заголовок та підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Геометрія лазерного віяла: кут розгортки та робоче поле</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Довжина лінії L = 2 · H · tan(θ / 2): ширший кут збільшує охоплення, але знижує щільність потужності</text>

  <!-- ==================== ЛІВА ПАНЕЛЬ: ОПТИЧНА СХЕМА ВІЯЛА ==================== -->
  <rect x="30" y="70" width="500" height="355" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <text x="46" y="94" font-size="14" font-weight="bold" fill="#1a1a1a">Геометрія розгортки лазерної лінії</text>
  <rect x="385" y="80" width="130" height="20" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="450" y="94" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Площина розгортки</text>

  <!-- Корпус лазерного модуля -->
  <rect x="254" y="106" width="32" height="30" rx="2" fill="#1a1a1a"/>
  <text x="296" y="124" font-size="12" fill="#6b7280">Лазерний модуль</text>
  <!-- Призма Павелла на виході -->
  <polygon points="262,136 270,144 278,136" fill="#2457d6"/>

  <!-- Широке віяло (θ2 = 90°) -->
  <polygon points="270,144 104,310 436,310" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- Вузьке віяло (θ1 = 45°) -->
  <polygon points="270,144 201,310 339,310" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Оптична вісь (розрив для відсутності перетину з текстом) -->
  <line x1="270" y1="144" x2="270" y2="165" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="270" y1="225" x2="270" y2="310" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Кутові дуги -->
  <!-- Дуга вузького кута 45° -->
  <path d="M 256,177 A 36,36 0 0,0 284,177" fill="none" stroke="#27ae60" stroke-width="1.5"/>
  <text x="288" y="180" font-size="12" font-weight="bold" fill="#27ae60">θ₁ = 45°</text>

  <!-- Дуга широкого кута 90° -->
  <path d="M 224,190 A 65,65 0 0,0 316,190" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <text x="320" y="196" font-size="12" font-weight="bold" fill="#2457d6">θ₂ = 90°</text>

  <!-- Вимірювальна лінія відстані H -->
  <line x1="48" y1="144" x2="48" y2="310" stroke="#1a1a1a" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="42" y1="144" x2="54" y2="144" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="42" y1="310" x2="54" y2="310" stroke="#1a1a1a" stroke-width="1"/>
  <text x="56" y="222" font-size="12" font-weight="bold" fill="#1a1a1a">H (відстань)</text>

  <!-- Площина об'єкта / мішені -->
  <line x1="60" y1="310" x2="480" y2="310" stroke="#1a1a1a" stroke-width="2"/>
  <text x="480" y="326" font-size="12" fill="#6b7280" text-anchor="end">Площина об'єкта (мішень)</text>

  <!-- Розмірні лінії довжини лінії L1 та L2 -->
  <!-- L1: вузький кут (зелена лінія) -->
  <line x1="201" y1="336" x2="339" y2="336" stroke="#27ae60" stroke-width="1.5" marker-start="url(#arr-green)" marker-end="url(#arr-green)"/>
  <line x1="201" y1="332" x2="201" y2="340" stroke="#27ae60" stroke-width="1"/>
  <line x1="339" y1="332" x2="339" y2="340" stroke="#27ae60" stroke-width="1"/>
  <text x="270" y="352" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">L₁ = 2 · H · tan(22.5°)</text>

  <!-- L2: широкий кут (синя лінія) -->
  <line x1="104" y1="370" x2="436" y2="370" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
  <line x1="104" y1="366" x2="104" y2="374" stroke="#2457d6" stroke-width="1"/>
  <line x1="436" y1="366" x2="436" y2="374" stroke="#2457d6" stroke-width="1"/>
  <text x="270" y="386" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">L₂ = 2 · H · tan(45°) = 2 · H</text>

  <!-- Формульна плашка внизу -->
  <rect x="44" y="398" width="472" height="20" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="280" y="412" font-size="12" fill="#1a1a1a" text-anchor="middle">L = 2 · H · tan(θ / 2)  |  Лінійна потужність p = P_ном / L</text>

  <!-- ==================== ПРАВА ПАНЕЛЬ: КАРТКА 1 ==================== -->
  <rect x="550" y="70" width="380" height="170" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <rect x="565" y="84" width="8" height="18" rx="2" fill="#2457d6"/>
  <text x="582" y="98" font-size="14" font-weight="bold" fill="#1a1a1a">Розрахунок робочого поля та потужності</text>

  <rect x="565" y="110" width="350" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="740" y="125" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Баланс оптичної геометрії та енергетики</text>

  <circle cx="574" cy="146" r="3" fill="#2457d6"/>
  <text x="585" y="150" font-size="12" fill="#1a1a1a">Довжина лінії: L = 2 · H · tan(θ / 2)</text>

  <circle cx="574" cy="164" r="3" fill="#6b7280"/>
  <text x="585" y="168" font-size="12" fill="#1a1a1a">H — робоча відстань, θ — кут розгортки віяла</text>

  <circle cx="574" cy="182" r="3" fill="#27ae60"/>
  <text x="585" y="186" font-size="12" fill="#1a1a1a">Лінійна густина потужності: p = P_ном / L (мВт/мм)</text>

  <circle cx="574" cy="200" r="3" fill="#c0392b"/>
  <text x="585" y="204" font-size="12" fill="#1a1a1a">Подвоєння кута θ збільшує L і вдвічі знижує p</text>

  <circle cx="574" cy="218" r="3" fill="#6b7280"/>
  <text x="585" y="222" font-size="12" fill="#6b7280">Для широкого кута потрібна більша потужність ЛД</text>

  <!-- ==================== ПРАВА ПАНЕЛЬ: КАРТКА 2 ==================== -->
  <rect x="550" y="255" width="380" height="170" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <rect x="565" y="269" width="8" height="18" rx="2" fill="#27ae60"/>
  <text x="582" y="283" font-size="14" font-weight="bold" fill="#1a1a1a">Вибір кута розгортки під задачу</text>

  <rect x="565" y="295" width="350" height="22" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="740" y="310" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Інженерний компроміс: поле проти освітленості</text>

  <circle cx="574" cy="332" r="3" fill="#27ae60"/>
  <text x="585" y="336" font-size="12" font-weight="bold" fill="#1a1a1a">Кут 30° – 45°: компактне поле, висока яскравість</text>

  <text x="585" y="354" font-size="12" fill="#6b7280">Для поглинальних поверхонь, металу й мікроскопії</text>

  <circle cx="574" cy="368" r="3" fill="#2457d6"/>
  <text x="585" y="372" font-size="12" font-weight="bold" fill="#1a1a1a">Кут 60° – 90°: стандартне універсальне віяло</text>

  <text x="585" y="390" font-size="12" fill="#6b7280">Типова 3D-профілометрія, робоче поле 150–500 мм</text>

  <circle cx="574" cy="404" r="3" fill="#c0392b"/>
  <text x="585" y="408" font-size="12" font-weight="bold" fill="#1a1a1a">Кут 110° – 120°: ультраширокі лінії конвеєрів</text>
</svg>
