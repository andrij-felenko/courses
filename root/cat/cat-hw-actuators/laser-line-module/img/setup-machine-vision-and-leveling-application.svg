<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка полотна -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Стенд 3D-профілювання: лазерна триангуляція та синхронізація стробу</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Оптична геометрія зміщення лінії на об'єкті та синхронізація камери з драйвером</text>

  <!-- ==================== ЛІВА ПАНЕЛЬ: ОПТИЧНА СХЕМА СТЕНДУ ==================== -->
  <rect x="24" y="76" width="520" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="40" y="102" font-size="14" font-weight="bold" fill="#1a1a1a">Оптична геометрія триангуляційного сканування</text>
  <text x="40" y="120" font-size="12" fill="#6b7280">Взаємне розташування камери, лазерного ножа та конвеєрної стрічки</text>

  <!-- Біла підпанель креслення -->
  <rect x="36" y="132" width="496" height="292" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Базова відстань B між оптичними центрами лазера і камери -->
  <line x1="102" y1="148" x2="360" y2="148" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="102" y1="142" x2="102" y2="154" stroke="#6b7280" stroke-width="1"/>
  <line x1="360" y1="142" x2="360" y2="154" stroke="#6b7280" stroke-width="1"/>
  <text x="230" y="144" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Базова відстань B</text>

  <!-- Світловий конус зору камери (FOV) -->
  <polygon points="360,214 265,360 455,360" fill="#eaf0fd" opacity="0.4"/>
  <line x1="360" y1="214" x2="265" y2="360" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="360" y1="214" x2="455" y2="360" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Лазерний віяловий промінь (лазерний ніж) -->
  <polygon points="102,192 315,360 365,330" fill="#fdecea" opacity="0.45"/>
  <line x1="102" y1="192" x2="315" y2="360" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="102" y1="192" x2="365" y2="330" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <!-- Центральний лазерний промінь -->
  <line x1="102" y1="192" x2="340" y2="345" stroke="#c0392b" stroke-width="1.8"/>

  <!-- Промислова камера -->
  <rect x="335" y="160" width="50" height="34" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="360" y="181" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Камера</text>
  <!-- Об'єктив камери -->
  <rect x="343" y="194" width="34" height="14" rx="2" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.2"/>
  <!-- Вузькосмуговий оптичний фільтр 650 нм -->
  <rect x="340" y="208" width="40" height="6" rx="1" fill="#c0392b" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Підписи до фільтра камери -->
  <text x="390" y="215" font-size="12" font-weight="bold" fill="#c0392b">Фільтр 650 нм</text>
  <text x="390" y="229" font-size="12" fill="#6b7280">відсічка фону</text>

  <!-- Оптична вісь камери (вертикаль) -->
  <line x1="360" y1="214" x2="360" y2="330" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="365" y="258" font-size="12" fill="#2457d6">Оптична вісь</text>

  <!-- Лазерний модуль 5 мВт -->
  <rect x="75" y="160" width="54" height="26" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="102" y="177" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Лазер</text>
  <!-- Об'єктив / лінза Пауелла лазера -->
  <rect x="94" y="186" width="16" height="6" rx="1" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <text x="46" y="202" font-size="12" fill="#6b7280">Лінза Пауелла</text>

  <!-- Кут триангуляції theta -->
  <path d="M 360,296 A 34,34 0 0,0 338,318" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="325" y="298" font-size="12" font-weight="bold" fill="#1a1a1a">Кут θ</text>

  <!-- Конвеєрна стрічка -->
  <rect x="60" y="360" width="448" height="18" rx="3" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Ролики конвеєра -->
  <circle cx="70" cy="369" r="7" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <circle cx="500" cy="369" r="7" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Досліджувана деталь на стрічці (висота h) -->
  <rect x="324" y="330" width="76" height="30" rx="2" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="362" y="349" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Деталь (h)</text>

  <!-- Зсув лазерної лінії на деталі -->
  <line x1="315" y1="360" x2="315" y2="330" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="315" y1="324" x2="365" y2="324" stroke="#c0392b" stroke-width="1.5"/>
  <text x="375" y="320" font-size="12" font-weight="bold" fill="#c0392b">Δx</text>

  <!-- Напрямок руху конвеєра та енкодер -->
  <line x1="170" y1="394" x2="250" y2="394" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="258" y="398" font-size="12" font-weight="bold" fill="#1a1a1a">Рух стрічки v</text>
  <text x="46" y="398" font-size="12" fill="#6b7280">Енкодер</text>

  <!-- Формула зв'язку зсуву і висоти -->
  <text x="140" y="416" font-size="12" fill="#2457d6">Висота профілю: h = Δx / tg(θ)</text>

  <!-- Пояснення зсуву лінії в безпечній зоні праворуч -->
  <rect x="330" y="386" width="190" height="30" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="425" y="401" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Зсув лінії: Δx = h · tg(θ)</text>
  <text x="425" y="412" font-size="12" fill="#6b7280" text-anchor="middle">визначає висоту точки</text>


  <!-- ==================== ПРАВА ПАНЕЛЬ: АРХІТЕКТУРА ЗВ'ЯЗКІВ ==================== -->
  <rect x="564" y="76" width="372" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="580" y="102" font-size="14" font-weight="bold" fill="#1a1a1a">Архітектура зв'язків стенду</text>
  <text x="580" y="120" font-size="12" fill="#6b7280">Синхронізація стробування, безпека та обробка</text>

  <!-- Біла підпанель схеми зв'язків -->
  <rect x="576" y="132" width="348" height="292" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Блок 1: Промислова камера (джерело стробу) -->
  <rect x="640" y="145" width="220" height="36" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="750" y="161" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Промислова камера</text>
  <text x="750" y="174" font-size="12" fill="#6b7280" text-anchor="middle">Строб-вихід кадру (Strobe Out)</text>

  <!-- Лінія стробу від камери до контролера -->
  <line x1="710" y1="181" x2="710" y2="210" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="642" y="200" font-size="12" font-weight="bold" fill="#2457d6">Строб кадру</text>

  <!-- Центральний блок: Контролер лазера (МК) -->
  <rect x="630" y="210" width="160" height="58" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="710" y="231" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Контролер лазера</text>
  <text x="710" y="247" font-size="12" fill="#6b7280" text-anchor="middle">ШІМ 25 кГц / Захист</text>
  <text x="710" y="261" font-size="12" fill="#6b7280" text-anchor="middle">Leaky Bucket таймер</text>

  <!-- Блок: Лазерний модуль (навантаження) -->
  <rect x="830" y="221" width="82" height="36" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="871" y="237" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Лазер LD</text>
  <text x="871" y="250" font-size="12" fill="#c0392b" text-anchor="middle">5 мВт (імпульс)</text>

  <!-- Зв'язок від МК до лазера -->
  <line x1="790" y1="239" x2="826" y2="239" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Блок: Сенсори та безпека (зліва внизу) -->
  <rect x="586" y="286" width="140" height="46" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="656" y="304" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Сенсор освітлення</text>
  <text x="656" y="320" font-size="12" fill="#6b7280" text-anchor="middle">+ Контур Interlock</text>

  <!-- Зв'язок від сенсорів до МК -->
  <line x1="656" y1="286" x2="656" y2="272" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- Блок: ПК технічного зору (справа внизу) -->
  <rect x="746" y="286" width="166" height="46" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="829" y="304" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">ПК технічного зору</text>
  <text x="829" y="320" font-size="12" fill="#27ae60" text-anchor="middle">Алгоритм COG та 3D-хмара</text>

  <!-- Зв'язок камери з ПК (передача кадрів) -->
  <line x1="810" y1="181" x2="810" y2="282" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="816" y="200" font-size="12" fill="#27ae60">Кадри</text>

  <!-- Підсумкова інформаційна плашка -->
  <rect x="586" y="348" width="328" height="62" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="750" y="367" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Ключові технічні рішення стенду:</text>
  <text x="750" y="384" font-size="12" fill="#2457d6" text-anchor="middle">• Строб лазера строго синхронний з кадровою експозицією</text>
  <text x="750" y="400" font-size="12" fill="#27ae60" text-anchor="middle">• Світлофільтр 650 нм відсікає цехове фонове освітлення</text>
</svg>
