<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка полотна -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <!-- Маркери стрілок -->
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-blue-rev" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>

    <!-- Технічне штрихування металу гільзи під кутом 45 градусів -->
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#d0d7de" stroke-width="1.2"/>
    </pattern>
  </defs>

  <!-- ЗАГОЛОВОК І ПІДЗАГОЛОВОК -->
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Внутрішня будова та оптична схема лазерного модуля</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Пошаровий розріз латунної гільзи, пружинний вибір люфту та лінійна оптика</text>

  <!-- ==================== СВІТЛОВИЙ ПРОМІНЬ (ФОН) ==================== -->
  <!-- 1. Розбіжний пучок від кристала діода до коліматора -->
  <polygon points="178,240 348,223 348,257" fill="#fdecea" opacity="0.85"/>
  <line x1="178" y1="240" x2="348" y2="223" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="4,2"/>
  <line x1="178" y1="240" x2="348" y2="257" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="4,2"/>

  <!-- 2. Колімований пучок між коліматором і лінійною лінзою -->
  <path d="M376,236 L504,236 L504,244 L376,244 Z" fill="#fdecea" opacity="0.9"/>
  <line x1="376" y1="236" x2="504" y2="236" stroke="#c0392b" stroke-width="1.4"/>
  <line x1="376" y1="244" x2="504" y2="244" stroke="#c0392b" stroke-width="1.4"/>

  <!-- 3. Віяло світлової площини після лінійної лінзи -->
  <polygon points="526,240 774,165 774,315" fill="#fdecea" opacity="0.6"/>
  <line x1="526" y1="240" x2="774" y2="165" stroke="#c0392b" stroke-width="1.3"/>
  <line x1="526" y1="240" x2="774" y2="315" stroke="#c0392b" stroke-width="1.3"/>
  <line x1="526" y1="240" x2="774" y2="202" stroke="#c0392b" stroke-width="1" stroke-dasharray="5,3" opacity="0.7"/>
  <line x1="526" y1="240" x2="774" y2="278" stroke="#c0392b" stroke-width="1" stroke-dasharray="5,3" opacity="0.7"/>

  <!-- ==================== КОРПУС: ЛАТУННА ГІЛЬЗА (РОЗРІЗ) ==================== -->
  <!-- Верхня стінка латунної гільзи -->
  <path d="M135,190 L485,190 L485,206 L300,206 L300,210 L195,210 L195,206 L135,206 Z" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
  <path d="M135,190 L485,190 L485,206 L300,206 L300,210 L195,210 L195,206 L135,206 Z" fill="url(#hatch)"/>

  <!-- Нижня стінка латунної гільзи -->
  <path d="M135,290 L485,290 L485,274 L300,274 L300,270 L195,270 L195,274 L135,274 Z" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
  <path d="M135,290 L485,290 L485,274 L300,274 L300,270 L195,270 L195,274 L135,274 Z" fill="url(#hatch)"/>

  <!-- Внутрішня різьба гільзи M9x0.5 -->
  <g stroke="#94a3b8" stroke-width="1.2">
    <path d="M305,206 L307,209 L309,206 M313,206 L315,209 L317,206 M321,206 L323,209 L325,206 M329,206 L331,209 L333,206 M337,206 L339,209 L341,206 M345,206 L347,209 L349,206 M353,206 L355,209 L357,206 M361,206 L363,209 L365,206 M369,206 L371,209 L373,206 M377,206 L379,209 L381,206 M385,206 L387,209 L389,206 M393,206 L395,209 L397,206 M401,206 L403,209 L405,206 M409,206 L411,209 L413,206 M417,206 L419,209 L421,206 M425,206 L427,209 L429,206" fill="none"/>
    <path d="M305,274 L307,271 L309,274 M313,274 L315,271 L317,274 M321,274 L323,271 L325,274 M329,274 L331,271 L333,274 M337,274 L339,271 L341,274 M345,274 L347,271 L349,274 M353,274 L355,271 L357,274 M361,274 L363,271 L365,274 M369,274 L371,271 L373,274 M377,274 L379,271 L381,274 M385,274 L387,271 L389,274 M393,274 L395,271 L397,274 M401,274 L403,271 L405,274 M409,274 L411,271 L413,274 M417,274 L419,271 L421,274 M425,274 L427,271 L429,274" fill="none"/>
  </g>

  <!-- ==================== 1. КОНТАКТНІ ДРОТИ ЖИВЛЕННЯ ==================== -->
  <path d="M38,224 L106,224" stroke="#c0392b" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M38,256 L106,256" stroke="#1a1a1a" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M100,214 L110,214 L110,266 L100,266 Z" fill="#d0d7de" stroke="#6b7280" stroke-width="1.2"/>

  <!-- ==================== 2. ДРУКОВАНА ПЛАТА СТАБІЛІЗАЦІЇ (PCB) ==================== -->
  <path d="M110,210 L120,210 L120,270 L110,270 Z" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <path d="M120,217 L133,217 L133,232 L120,232 Z" fill="#1a1a1a" stroke="#475569" stroke-width="1"/>
  <line x1="118" y1="221" x2="120" y2="221" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="118" y1="228" x2="120" y2="228" stroke="#d0d7de" stroke-width="1.5"/>
  <path d="M120,247 L131,247 L131,259 L120,259 Z" fill="#475569" stroke="#334155" stroke-width="1"/>
  <path d="M120,247 L122.5,247 L122.5,259 L120,259 Z" fill="#d0d7de"/>
  <path d="M128.5,247 L131,247 L131,259 L128.5,259 Z" fill="#d0d7de"/>
  <line x1="126" y1="232" x2="152" y2="232" stroke="#d97706" stroke-width="1.4"/>
  <line x1="126" y1="248" x2="152" y2="248" stroke="#d97706" stroke-width="1.4"/>

  <!-- ==================== 3. ЛАЗЕРНИЙ ДІОД У КОРПУСІ TO-18 (5.6 мм) ==================== -->
  <path d="M152,209 L162,209 L162,271 L152,271 Z" fill="#94a3b8" stroke="#475569" stroke-width="1.4"/>
  <path d="M162,219 L194,219 L194,261 L162,261 Z" fill="#cbd5e1" stroke="#64748b" stroke-width="1.3"/>
  <line x1="194" y1="228" x2="194" y2="252" stroke="#2457d6" stroke-width="2" stroke-linecap="round"/>
  <path d="M172,235 L178,235 L178,245 L172,245 Z" fill="#64748b"/>
  <path d="M176,238 L179.5,238 L179.5,242 L176,242 Z" fill="#c0392b"/>

  <!-- ==================== 4. ПРУЖИНА ВИБОРУ РІЗЬБОВОГО ЛЮФТУ ==================== -->
  <g stroke="#475569" stroke-width="2" fill="#cbd5e1">
    <circle cx="212" cy="214" r="3.2"/>
    <circle cx="232" cy="214" r="3.2"/>
    <circle cx="252" cy="214" r="3.2"/>
    <circle cx="272" cy="214" r="3.2"/>
    <circle cx="292" cy="214" r="3.2"/>
    <circle cx="222" cy="266" r="3.2"/>
    <circle cx="242" cy="266" r="3.2"/>
    <circle cx="262" cy="266" r="3.2"/>
    <circle cx="282" cy="266" r="3.2"/>
    <circle cx="302" cy="266" r="3.2"/>
  </g>
  <g stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,2" opacity="0.6">
    <line x1="212" y1="214" x2="222" y2="266"/>
    <line x1="222" y1="266" x2="232" y2="214"/>
    <line x1="232" y1="214" x2="242" y2="266"/>
    <line x1="242" y1="266" x2="252" y2="214"/>
    <line x1="252" y1="214" x2="262" y2="266"/>
    <line x1="262" y1="266" x2="272" y2="214"/>
    <line x1="272" y1="214" x2="282" y2="266"/>
    <line x1="282" y1="266" x2="292" y2="214"/>
    <line x1="292" y1="214" x2="302" y2="266"/>
  </g>

  <!-- ==================== 5. РУХОМА ОПРАВА КОЛІМАТОРА ==================== -->
  <path d="M302,210 L430,210 L430,204 L446,204 L446,218 L376,218 L348,222 L302,222 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/>
  <path d="M302,270 L430,270 L430,276 L446,276 L446,262 L376,262 L348,258 L302,258 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.4"/>
  <!-- Насічка для обертання -->
  <line x1="434" y1="204" x2="434" y2="218" stroke="#2457d6" stroke-width="1.2"/>
  <line x1="438" y1="204" x2="438" y2="218" stroke="#2457d6" stroke-width="1.2"/>
  <line x1="442" y1="204" x2="442" y2="218" stroke="#2457d6" stroke-width="1.2"/>
  <line x1="434" y1="262" x2="434" y2="276" stroke="#2457d6" stroke-width="1.2"/>
  <line x1="438" y1="262" x2="438" y2="276" stroke="#2457d6" stroke-width="1.2"/>
  <line x1="442" y1="262" x2="442" y2="276" stroke="#2457d6" stroke-width="1.2"/>

  <!-- ==================== 6. КОЛІМАТОРНА ЛІНЗА ==================== -->
  <path d="M348,222 Q366,240 348,258 L376,260 L376,220 Z" fill="#eaf0fd" fill-opacity="0.9" stroke="#2457d6" stroke-width="1.8"/>

  <!-- ==================== 7. ВИХІДНА ЛІНІЙНА ЛІНЗА ТА НАСАДКА ==================== -->
  <path d="M476,192 L524,192 L524,214 L498,214 L498,206 L476,206 Z" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/>
  <path d="M476,192 L524,192 L524,214 L498,214 L498,206 L476,206 Z" fill="url(#hatch)"/>
  <path d="M476,288 L524,288 L524,266 L498,266 L498,274 L476,274 Z" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.4"/>
  <path d="M476,288 L524,288 L524,266 L498,266 L498,274 L476,274 Z" fill="url(#hatch)"/>
  <path d="M504,220 L522,226 L522,254 L504,260 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
  <ellipse cx="504" cy="240" rx="3" ry="20" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

  <!-- ==================== ОПТИЧНА ВІСЬ ==================== -->
  <line x1="25" y1="240" x2="846" y2="240" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="14,4,3,4"/>
  <text x="811" y="222" font-size="12" fill="#2457d6" text-anchor="middle">Оптична</text>
  <text x="811" y="235" font-size="12" fill="#2457d6" text-anchor="middle">вісь</text>

  <!-- ==================== 8. ПРОЕКЦІЯ ЛАЗЕРНОЇ ЛІНІЇ НА МІШЕНІ ==================== -->
  <rect x="848" y="150" width="80" height="180" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="848" y1="240" x2="928" y2="240" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="888" y1="150" x2="888" y2="330" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="888" y1="165" x2="888" y2="315" stroke="#fdecea" stroke-width="8" stroke-linecap="round"/>
  <line x1="888" y1="165" x2="888" y2="315" stroke="#c0392b" stroke-width="3" stroke-linecap="round"/>

  <!-- ==================== ВИНОСКИ ТА ПІДПИСИ ВЕРХНЬОЇ ЗОНИ ==================== -->
  <!-- 1. Контактні дроти: центр X=75 -->
  <line x1="75" y1="162" x2="75" y2="218" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="75" y="138" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Контактні дроти</text>
  <text x="75" y="154" font-size="12" fill="#6b7280" text-anchor="middle">живлення модуля</text>

  <!-- 2. Друкована плата стабілізації струму: центр X=180, ярус Y=84..100 -->
  <path d="M180,108 L180,140 L115,185 L115,206" fill="none" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="180" y="84" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Плата стабілізації</text>
  <text x="180" y="100" font-size="12" fill="#6b7280" text-anchor="middle">SMD-драйвер струму</text>

  <!-- 3. Лазерний діод TO-18: центр X=315, ярус Y=138..154 -->
  <path d="M315,162 L315,180 L175,195 L175,205" fill="none" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="315" y="138" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Лазерний діод TO-18</text>
  <text x="315" y="154" font-size="12" fill="#6b7280" text-anchor="middle">5.6 мм, у гнізді гільзи</text>

  <!-- 4. Рухома оправа коліматора: центр X=435, ярус Y=84..100 -->
  <path d="M435,108 L435,160 L410,185 L410,200" fill="none" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="435" y="84" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Рухома оправа</text>
  <text x="435" y="100" font-size="12" fill="#6b7280" text-anchor="middle">дрібна різьба M9×0.5</text>

  <!-- 5. Вихідна лінійна лінза: центр X=565, ярус Y=138..154 -->
  <path d="M565,162 L565,185 L514,198 L514,215" fill="none" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="565" y="138" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Лінійна лінза</text>
  <text x="565" y="154" font-size="12" fill="#6b7280" text-anchor="middle">циліндрична / Павелла</text>

  <!-- 6. Світлове віяло розгортки: центр X=695, ярус Y=84..100 -->
  <line x1="695" y1="108" x2="695" y2="185" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="695" y="84" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Світлова площина</text>
  <text x="695" y="100" font-size="12" fill="#6b7280" text-anchor="middle">віяло розгортки променя</text>

  <!-- ==================== ВИНОСКИ ТА ПІДПИСИ НИЖНЬОЇ ЗОНИ ==================== -->
  <!-- 1. Латунна гільза: центр X=165, Y=334..350 -->
  <line x1="165" y1="314" x2="165" y2="294" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="165" y="334" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Латунна гільза</text>
  <text x="165" y="350" font-size="12" fill="#6b7280" text-anchor="middle">корпус і тепловідвід</text>

  <!-- 2. Пружина вибору люфту: центр X=255, Y=376..392 -->
  <path d="M255,356 L255,325 L255,295 L255,272" fill="none" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="255" y="376" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Пружина вибору люфту</text>
  <text x="255" y="392" font-size="12" fill="#6b7280" text-anchor="middle">притискає різьбу оправи</text>

  <!-- 3. Коліматорна лінза: центр X=345, Y=334..350 -->
  <line x1="345" y1="314" x2="345" y2="265" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arr-gray)"/>
  <text x="345" y="334" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Коліматорна лінза</text>
  <text x="345" y="350" font-size="12" fill="#6b7280" text-anchor="middle">формує вузький пучок</text>

  <!-- 4. Механіка фокусування (осьовий хід та обертання): центр X=505, Y=340..356 -->
  <line x1="465" y1="318" x2="545" y2="318" stroke="#2457d6" stroke-width="2" marker-start="url(#arr-blue-rev)" marker-end="url(#arr-blue)"/>
  <text x="505" y="340" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">±Δx поздовжній хід</text>
  <text x="505" y="356" font-size="12" fill="#2457d6" text-anchor="middle">обертання по різьбі</text>

  <!-- 5. Лазерна лінія на мішені: центр X=888, Y=364..380 -->
  <line x1="888" y1="345" x2="888" y2="322" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="888" y="364" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Лазерна лінія</text>
  <text x="888" y="380" font-size="12" fill="#6b7280" text-anchor="middle">на мішені</text>

  <!-- ==================== НИЖНЯ ПІДСУМКОВА ПАНЕЛЬ ==================== -->
  <rect x="50" y="405" width="860" height="32" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="426" font-size="12" fill="#1a1a1a" text-anchor="middle">Пружина постійно обирає різьбовий зазор, усуваючи осьовий люфт і зміщення фокусу від вібрацій</text>
</svg>
