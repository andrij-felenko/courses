<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Підключення підлаштовного резистора: захист від обриву повзунка</text>
  <text x="480" y="57" font-size="13" fill="#6b7280" text-anchor="middle">Трививідний подільник із баластним резистором стяжки гарантує безпечне вимкнення (Fail-Safe)</text>

  <!-- Left Panel: Dangerous 2-Wire Rheostat Wiring -->
  <rect x="30" y="75" width="435" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="42" y="87" width="411" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="247" y="104" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">НЕБЕЗПЕЧНО: ДВОВИВІДНИЙ РЕОСТАТ (RHEOSTAT)</text>

  <!-- Left Rails -->
  <!-- VCC Rail (+5V) -->
  <line x1="75" y1="135" x2="420" y2="135" stroke="#c0392b" stroke-width="2"/>
  <circle cx="75" cy="135" r="3.5" fill="white" stroke="#c0392b" stroke-width="2"/>
  <text x="67" y="139" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">+5 В</text>

  <!-- GND Rail (0V) -->
  <line x1="75" y1="310" x2="420" y2="310" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="75" cy="310" r="3.5" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="67" y="314" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">GND</text>

  <!-- Left Divider Stage: R1 and 2-Wire Potentiometer -->
  <!-- R1 Resistor -->
  <line x1="130" y1="135" x2="130" y2="155" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="130" cy="135" r="3" fill="#c0392b"/>
  <rect x="123" y="155" width="14" height="30" rx="2" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="115" y="174" font-size="12" fill="#6b7280" text-anchor="end">R1</text>
  <line x1="130" y1="185" x2="130" y2="205" stroke="#c0392b" stroke-width="2"/>

  <!-- Node V_adj (When Wiper Lifts Off) -->
  <circle cx="130" cy="205" r="3.5" fill="#c0392b"/>
  <text x="115" y="209" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">V_adj = 5 В!</text>

  <!-- Potentiometer R_pot as Rheostat -->
  <line x1="130" y1="205" x2="130" y2="230" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="123" y="230" width="14" height="40" rx="2" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="115" y="254" font-size="12" fill="#6b7280" text-anchor="end">R_pot</text>

  <!-- Floating Pin 3 (Unconnected) -->
  <line x1="130" y1="270" x2="130" y2="285" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="130" cy="285" r="3" fill="white" stroke="#6b7280" stroke-width="1.5"/>
  <text x="120" y="289" font-size="12" fill="#6b7280" text-anchor="end">Вивід 3: NC</text>

  <!-- Wiper Connection with Fault (Lift-off) -->
  <polygon points="127,250 137,247 137,253" fill="#c0392b"/>
  <line x1="137" y1="250" x2="142" y2="250" stroke="#c0392b" stroke-width="1.5"/>
  <!-- Broken Contact Indicator -->
  <line x1="143" y1="246" x2="149" y2="254" stroke="#c0392b" stroke-width="2"/>
  <line x1="143" y1="254" x2="149" y2="246" stroke="#c0392b" stroke-width="2"/>
  <line x1="150" y1="250" x2="150" y2="310" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="150" cy="310" r="3" fill="#1a1a1a"/>
  <text x="158" y="246" font-size="12" font-weight="bold" fill="#c0392b">Обрив повзунка</text>

  <!-- Wire to Op-Amp Non-Inverting Input (+) -->
  <line x1="130" y1="205" x2="285" y2="205" stroke="#c0392b" stroke-width="2"/>
  <text x="207" y="197" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">V_REF = 5 В (MAX)</text>

  <!-- Op-Amp (Left) -->
  <polygon points="285,195 325,215 285,235" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="290" y="209" font-size="12" font-weight="bold" fill="#c0392b">+</text>
  <text x="290" y="230" font-size="12" font-weight="bold" fill="#c0392b">−</text>
  <text x="303" y="218" font-size="12" font-weight="bold" fill="#c0392b">ОП</text>

  <!-- Op-Amp Output -->
  <line x1="325" y1="215" x2="355" y2="215" stroke="#c0392b" stroke-width="2"/>
  <text x="340" y="209" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">100%</text>

  <!-- N-MOSFET Q1 (Left) -->
  <line x1="355" y1="208" x2="355" y2="222" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="361" y1="208" x2="361" y2="222" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="357,215 363,212 363,218" fill="#1a1a1a"/>
  <line x1="361" y1="210" x2="375" y2="210" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="375" y1="185" x2="375" y2="210" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="361" y1="220" x2="375" y2="220" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="375" y1="220" x2="375" y2="255" stroke="#1a1a1a" stroke-width="2"/>
  <text x="385" y="218" font-size="12" font-weight="bold" fill="#c0392b">Q1 (100%)</text>

  <!-- Laser Diode LD (Left: Overdriven & Destroyed) -->
  <line x1="375" y1="135" x2="375" y2="155" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="375" cy="135" r="3" fill="#c0392b"/>
  <polygon points="367,155 383,155 375,169" fill="#c0392b"/>
  <line x1="367" y1="169" x2="383" y2="169" stroke="#c0392b" stroke-width="2"/>
  <line x1="375" y1="169" x2="375" y2="185" stroke="#c0392b" stroke-width="2.5"/>
  <text x="388" y="162" font-size="12" font-weight="bold" fill="#c0392b">LD: COD!</text>
  <text x="388" y="176" font-size="12" fill="#c0392b">I &gt; I_max</text>

  <!-- Sense Resistor R_SENSE (Left) -->
  <line x1="375" y1="255" x2="375" y2="265" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="368" y="265" width="14" height="30" rx="2" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="375" y1="295" x2="375" y2="310" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="375" cy="310" r="3" fill="#1a1a1a"/>
  <text x="388" y="284" font-size="12" fill="#6b7280">R_SENSE</text>

  <!-- Negative Feedback Loop (Left) -->
  <line x1="375" y1="255" x2="270" y2="255" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="270" y1="255" x2="270" y2="225" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="270" y1="225" x2="285" y2="225" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="375" cy="255" r="3" fill="#27ae60"/>

  <!-- Left Bottom Card: Failure Analysis -->
  <rect x="42" y="330" width="411" height="95" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <rect x="52" y="338" width="391" height="20" rx="3" fill="#c0392b"/>
  <text x="247" y="352" font-size="12" font-weight="bold" fill="white" text-anchor="middle">ЧОМУ РЕОСТАТНИЙ РЕЖИМ НЕБЕЗПЕЧНИЙ?</text>
  <text x="54" y="372" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#c0392b">• Обрив повзунка:</tspan> опір на землю стає нескінченним (R → ∞)</text>
  <text x="54" y="390" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#c0392b">• Стрибок напруги:</tspan> потенціал V_REF злітає до VCC (5 В)</text>
  <text x="54" y="408" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#c0392b">• Наслідок COD:</tspan> ОП насичується, струм LD спалює резонатор</text>


  <!-- Right Panel: Safe 3-Wire Potentiometer with Pull-Down Ballast -->
  <rect x="495" y="75" width="435" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="507" y="87" width="411" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712" y="104" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">БЕЗПЕЧНО: ТРИВИВІДНИЙ ПОДІЛЬНИК (FAIL-SAFE)</text>

  <!-- Right Rails -->
  <!-- VCC Rail (+5V) -->
  <line x1="540" y1="135" x2="885" y2="135" stroke="#c0392b" stroke-width="2"/>
  <circle cx="540" cy="135" r="3.5" fill="white" stroke="#c0392b" stroke-width="2"/>
  <text x="532" y="139" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">+5 В</text>

  <!-- GND Rail (0V) -->
  <line x1="540" y1="310" x2="885" y2="310" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="540" cy="310" r="3.5" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="532" y="314" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">GND</text>

  <!-- Right Divider Stage: R_lim, 3-Wire Potentiometer & R_safe -->
  <!-- Limiter Resistor R_lim -->
  <line x1="580" y1="135" x2="580" y2="155" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="580" cy="135" r="3" fill="#c0392b"/>
  <rect x="573" y="155" width="14" height="26" rx="2" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="565" y="172" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">R_lim</text>
  <line x1="580" y1="181" x2="580" y2="195" stroke="#2457d6" stroke-width="1.5"/>

  <!-- 3-Wire Potentiometer R_pot (Pin 1 to Pin 3) -->
  <rect x="573" y="195" width="14" height="50" rx="2" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="565" y="224" font-size="12" fill="#6b7280" text-anchor="end">R_pot</text>
  <!-- Pin 3 Firmly Connected to GND -->
  <line x1="580" y1="245" x2="580" y2="310" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="580" cy="310" r="3" fill="#1a1a1a"/>
  <text x="565" y="275" font-size="12" fill="#6b7280" text-anchor="end">Вивід 3</text>

  <!-- Wiper (Pin 2) with Fault Indicator -->
  <polygon points="577,220 587,217 587,223" fill="#c0392b"/>
  <line x1="587" y1="220" x2="595" y2="220" stroke="#c0392b" stroke-width="1.5"/>
  <!-- Broken Contact Indicator -->
  <line x1="596" y1="216" x2="604" y2="224" stroke="#c0392b" stroke-width="2"/>
  <line x1="596" y1="224" x2="604" y2="216" stroke="#c0392b" stroke-width="2"/>
  <line x1="605" y1="220" x2="630" y2="220" stroke="#27ae60" stroke-width="2"/>
  <circle cx="630" cy="220" r="3" fill="#27ae60"/>
  <text x="605" y="175" font-size="12" font-weight="bold" fill="#c0392b">Обрив повзунка!</text>
  <line x1="612" y1="182" x2="602" y2="213" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Fail-Safe Pull-Down Resistor R_safe (Ballast) -->
  <line x1="630" y1="220" x2="630" y2="250" stroke="#27ae60" stroke-width="2"/>
  <rect x="623" y="250" width="14" height="35" rx="2" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <line x1="630" y1="285" x2="630" y2="310" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="630" cy="310" r="3" fill="#1a1a1a"/>
  <text x="643" y="266" font-size="12" font-weight="bold" fill="#27ae60">R_safe (100 кОм)</text>
  <text x="643" y="280" font-size="12" fill="#27ae60">Стягує вхід до GND</text>

  <!-- Wire from Node to Op-Amp Non-Inverting Input (+) -->
  <line x1="630" y1="220" x2="705" y2="220" stroke="#27ae60" stroke-width="2"/>
  <text x="668" y="213" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">V_REF = 0 В</text>

  <!-- Op-Amp (Right) -->
  <polygon points="705,210 745,230 705,250" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="710" y="224" font-size="12" font-weight="bold" fill="#27ae60">+</text>
  <text x="710" y="245" font-size="12" font-weight="bold" fill="#27ae60">−</text>
  <text x="723" y="233" font-size="12" font-weight="bold" fill="#27ae60">ОП</text>

  <!-- Op-Amp Output -->
  <line x1="745" y1="230" x2="780" y2="230" stroke="#27ae60" stroke-width="2"/>
  <text x="763" y="224" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">0 В</text>

  <!-- N-MOSFET Q1 (Right: Safely Turned OFF) -->
  <line x1="780" y1="223" x2="780" y2="237" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="786" y1="223" x2="786" y2="237" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="782,230 788,227 788,233" fill="#1a1a1a"/>
  <line x1="786" y1="225" x2="800" y2="225" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="800" y1="185" x2="800" y2="225" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="786" y1="235" x2="800" y2="235" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="800" y1="235" x2="800" y2="265" stroke="#1a1a1a" stroke-width="2"/>
  <text x="808" y="233" font-size="12" font-weight="bold" fill="#27ae60">Q1 (ЗАКРИТО)</text>

  <!-- Laser Diode LD (Right: Safely Preserved) -->
  <line x1="800" y1="135" x2="800" y2="155" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="800" cy="135" r="3" fill="#c0392b"/>
  <polygon points="792,155 808,155 800,169" fill="#1a1a1a"/>
  <line x1="792" y1="169" x2="808" y2="169" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="800" y1="169" x2="800" y2="185" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="815" y="162" font-size="12" font-weight="bold" fill="#27ae60">LD: ВИМКНЕНО</text>
  <text x="815" y="176" font-size="12" fill="#27ae60">I_LD = 0 (ЗАХИСТ)</text>

  <!-- Sense Resistor R_SENSE (Right) -->
  <line x1="800" y1="265" x2="800" y2="275" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="793" y="275" width="14" height="25" rx="2" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="800" y1="300" x2="800" y2="310" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="800" cy="310" r="3" fill="#1a1a1a"/>
  <text x="815" y="291" font-size="12" fill="#6b7280">R_SENSE</text>

  <!-- Negative Feedback Loop (Right) -->
  <line x1="800" y1="265" x2="690" y2="265" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="690" y1="265" x2="690" y2="240" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="690" y1="240" x2="705" y2="240" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="800" cy="265" r="3" fill="#27ae60"/>

  <!-- Right Bottom Card: Fail-Safe Benefits -->
  <rect x="507" y="330" width="411" height="95" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <rect x="517" y="338" width="391" height="20" rx="3" fill="#27ae60"/>
  <text x="712" y="352" font-size="12" font-weight="bold" fill="white" text-anchor="middle">ПЕРЕВАГИ FAIL-SAFE ПІДКЛЮЧЕННЯ</text>
  <text x="519" y="372" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#27ae60">• Резистор R_safe:</tspan> 100 кОм стягує керуючий вхід ОП до GND</text>
  <text x="519" y="390" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#27ae60">• При обриві повзунка:</tspan> V_REF падає до 0 В, струм I_LD = 0 мА</text>
  <text x="519" y="408" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#27ae60">• Резистор R_lim:</tspan> обмежує струм у крайньому верхньому стані</text>
</svg>
