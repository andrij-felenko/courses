<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="960" height="460" fill="white"/>
<defs>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
  </marker>
  <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
  </marker>
  <marker id="arr-amber" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#f59e0b"/>
  </marker>
</defs>

<!-- Заголовок і підзаголовок -->
<text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Схема апаратного контуру лазерної безпеки (Interlock)</text>
<text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Апаратне знеструмлення затвора, захист від зависання МК, плавний пуск Soft-Start та індикація</text>

<!-- Панель 1: Принципова схема -->
<rect x="24" y="70" width="576" height="368" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
<text x="312" y="94" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Електрична схема вузла блокування та силового ключа</text>

<!-- Шина живлення +5V DC -->
<line x1="45" y1="115" x2="550" y2="115" stroke="#1a1a1a" stroke-width="2"/>
<circle cx="45" cy="115" r="4" fill="#2457d6"/>
<text x="45" y="106" font-size="12" font-weight="700" fill="#2457d6">V_IN (+5V)</text>

<!-- Контакт безпеки Interlock (кінцевик / E-Stop) -->
<circle cx="70" cy="115" r="3" fill="#1a1a1a"/>
<line x1="70" y1="115" x2="70" y2="155" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="70" cy="155" r="3" fill="#1a1a1a"/>
<circle cx="125" cy="155" r="3" fill="#1a1a1a"/>
<line x1="70" y1="155" x2="118" y2="142" stroke="#c0392b" stroke-width="2.5"/>
<text x="75" y="136" font-size="12" font-weight="700" fill="#c0392b">Кінцевик / E-Stop</text>

<!-- Вузол після вимикача (Node INTERLOCK_OK) -->
<line x1="125" y1="155" x2="145" y2="155" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="145" cy="155" r="3" fill="#1a1a1a"/>

<!-- Підтяжка до землі R_pd -->
<line x1="145" y1="155" x2="145" y2="180" stroke="#1a1a1a" stroke-width="1.2"/>
<rect x="139" y="180" width="12" height="26" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="132" y="197" font-size="12" fill="#6b7280" text-anchor="end">R_pd 100k</text>
<line x1="145" y1="206" x2="145" y2="222" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="139" y1="222" x2="151" y2="222" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="141" y1="225" x2="149" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="143" y1="228" x2="147" y2="228" stroke="#1a1a1a" stroke-width="1.5"/>

<!-- Сигнал Interlock Status до МК -->
<line x1="145" y1="155" x2="185" y2="155" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="185" cy="155" r="3" fill="#1a1a1a"/>
<line x1="185" y1="155" x2="185" y2="290" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="185" y1="290" x2="163" y2="290" stroke="#1a1a1a" stroke-width="1.2"/>
<rect x="138" y="285" width="25" height="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="150" y="278" font-size="12" fill="#6b7280" text-anchor="middle">R_stat 10k</text>
<line x1="138" y1="290" x2="115" y2="290" stroke="#1a1a1a" stroke-width="1.2"/>

<!-- Лінія сигналу INTERLOCK_OK до входу AND -->
<line x1="185" y1="155" x2="220" y2="155" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="220" y1="155" x2="220" y2="335" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="228" y="210" font-size="12" font-weight="700" fill="#27ae60">INTERLOCK_OK</text>
<line x1="220" y1="335" x2="245" y2="335" stroke="#1a1a1a" stroke-width="1.5"/>

<!-- Блок мікроконтролера (MCU) -->
<rect x="30" y="260" width="85" height="125" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="72" y="280" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">МК (MCU)</text>
<text x="38" y="294" font-size="12" fill="#1a1a1a">STATUS_IN</text>
<text x="38" y="355" font-size="12" font-weight="700" fill="#2457d6">PWM_OUT</text>

<!-- Лінія PWM від МК до входу AND -->
<line x1="115" y1="360" x2="245" y2="360" stroke="#2457d6" stroke-width="1.8"/>
<text x="175" y="354" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">ШІМ / Строб</text>

<!-- Апаратний логічний елемент AND (74LVC08) -->
<path d="M 245,325 L 263,325 A 22.5,22.5 0 0,1 263,370 L 245,370 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="259" y="352" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">&amp;</text>
<text x="250" y="318" font-size="12" font-weight="700" fill="#1a1a1a">74LVC08 (AND)</text>

<!-- Вихід AND і резистор затвора R_gate -->
<line x1="286" y1="348" x2="305" y2="348" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="305" y="343" width="28" height="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="319" y="336" font-size="12" fill="#1a1a1a" text-anchor="middle">R_gate</text>

<!-- Вузол затвора та конденсатор Soft-Start -->
<line x1="333" y1="348" x2="355" y2="348" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="355" cy="348" r="3" fill="#1a1a1a"/>

<!-- Конденсатор C_soft -->
<line x1="355" y1="348" x2="355" y2="372" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="345" y1="372" x2="365" y2="372" stroke="#1a1a1a" stroke-width="2"/>
<line x1="345" y1="378" x2="365" y2="378" stroke="#1a1a1a" stroke-width="2"/>
<line x1="355" y1="378" x2="355" y2="405" stroke="#1a1a1a" stroke-width="1.2"/>
<circle cx="355" cy="405" r="3" fill="#1a1a1a"/>
<text x="372" y="374" font-size="12" font-weight="700" fill="#2457d6">C_soft 47nF</text>
<text x="372" y="388" font-size="12" fill="#6b7280">(плавний пуск)</text>

<!-- Лінія до затвора MOSFET -->
<line x1="355" y1="348" x2="465" y2="348" stroke="#1a1a1a" stroke-width="1.5"/>

<!-- Силовий транзистор Q1 N-MOSFET -->
<line x1="465" y1="332" x2="465" y2="364" stroke="#1a1a1a" stroke-width="2"/>
<line x1="471" y1="332" x2="471" y2="340" stroke="#1a1a1a" stroke-width="2.5"/>
<line x1="471" y1="344" x2="471" y2="352" stroke="#1a1a1a" stroke-width="2.5"/>
<line x1="471" y1="356" x2="471" y2="364" stroke="#1a1a1a" stroke-width="2.5"/>
<path d="M 471,348 L 481,344 L 481,352 Z" fill="#1a1a1a"/>

<!-- Стік (Drain) та Витік (Source) -->
<line x1="471" y1="336" x2="490" y2="336" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="490" y1="336" x2="490" y2="275" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="471" y1="360" x2="490" y2="360" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="490" y1="360" x2="490" y2="405" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="490" cy="405" r="3" fill="#1a1a1a"/>

<text x="500" y="344" font-size="12" font-weight="700" fill="#1a1a1a">Q1 IRLML2502</text>
<text x="500" y="358" font-size="12" fill="#6b7280">(N-MOSFET)</text>

<!-- Струмообмежувальний резистор R_lim лазера -->
<circle cx="410" cy="115" r="3" fill="#1a1a1a"/>
<line x1="410" y1="115" x2="410" y2="135" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="405" y="135" width="10" height="26" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="398" y="152" font-size="12" fill="#1a1a1a" text-anchor="end">R_lim</text>
<line x1="410" y1="161" x2="410" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>

<!-- Лазерний діод (LD) -->
<polygon points="402,175 418,175 410,189" fill="#c0392b"/>
<line x1="402" y1="189" x2="418" y2="189" stroke="#1a1a1a" stroke-width="2"/>
<line x1="410" y1="189" x2="410" y2="275" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="410" y1="275" x2="490" y2="275" stroke="#1a1a1a" stroke-width="1.5"/>

<!-- Промені лазера -->
<line x1="402" y1="180" x2="384" y2="172" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
<line x1="402" y1="188" x2="384" y2="180" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
<text x="375" y="180" font-size="12" font-weight="700" fill="#c0392b" text-anchor="end">Лазерний діод</text>
<text x="375" y="194" font-size="12" fill="#1a1a1a" text-anchor="end">5 мВт (650 нм)</text>

<!-- Паралельний TVS діод захисту -->
<circle cx="410" cy="168" r="3" fill="#1a1a1a"/>
<line x1="410" y1="168" x2="445" y2="168" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="445" y1="168" x2="445" y2="182" stroke="#1a1a1a" stroke-width="1.2"/>
<path d="M 437,180 L 439,182 L 451,182 L 453,184" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<polygon points="439,196 451,196 445,182" fill="#6b7280"/>
<line x1="445" y1="196" x2="445" y2="220" stroke="#1a1a1a" stroke-width="1.2"/>
<line x1="445" y1="220" x2="410" y2="220" stroke="#1a1a1a" stroke-width="1.2"/>
<circle cx="410" cy="220" r="3" fill="#1a1a1a"/>
<text x="457" y="193" font-size="12" fill="#6b7280">TVS діод</text>

<!-- Вузол стоку (Drain node) -->
<circle cx="490" cy="275" r="3.5" fill="#1a1a1a"/>

<!-- Паралельна гілка індикатора: Світлодіод попередження -->
<circle cx="550" cy="115" r="3" fill="#1a1a1a"/>
<line x1="550" y1="115" x2="550" y2="135" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="545" y="135" width="10" height="26" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="540" y="152" font-size="12" fill="#6b7280" text-anchor="end">R_led 1k</text>
<line x1="550" y1="161" x2="550" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>

<polygon points="542,175 558,175 550,189" fill="#f59e0b"/>
<line x1="542" y1="189" x2="558" y2="189" stroke="#1a1a1a" stroke-width="2"/>
<line x1="550" y1="189" x2="550" y2="275" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="550" y1="275" x2="490" y2="275" stroke="#1a1a1a" stroke-width="1.5"/>

<line x1="560" y1="179" x2="576" y2="171" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr-amber)"/>
<line x1="560" y1="187" x2="576" y2="179" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arr-amber)"/>
<text x="540" y="215" font-size="12" font-weight="700" fill="#d97706" text-anchor="end">LED індикатор</text>
<text x="540" y="230" font-size="12" fill="#1a1a1a" text-anchor="end">ВИПРОМІНЮВАННЯ</text>

<!-- Загальна шина заземлення (GND) -->
<line x1="30" y1="405" x2="570" y2="405" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="304" y1="405" x2="320" y2="405" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="307" y1="409" x2="317" y2="409" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="310" y1="413" x2="314" y2="413" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="312" y="426" font-size="12" font-weight="700" fill="#6b7280" text-anchor="middle">GND (Спільна земля)</text>

<!-- Панель 2: Принципи безпеки -->
<rect x="614" y="70" width="322" height="368" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
<text x="775" y="94" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Принципи багаторівневої безпеки</text>

<!-- Картка 1: Нормальний режим -->
<rect x="626" y="108" width="298" height="96" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
<text x="775" y="126" font-size="13" font-weight="700" fill="#27ae60" text-anchor="middle">1. Нормальний режим (Замкнено)</text>
<text x="636" y="146" font-size="12" fill="#1a1a1a">• Контур Interlock замкнений (+5 В)</text>
<text x="636" y="164" font-size="12" fill="#1a1a1a">• Елемент AND транслює ШІМ на затвор</text>
<text x="636" y="182" font-size="12" fill="#1a1a1a">• Світлодіод попереджає про випромінювання</text>
<text x="636" y="198" font-size="12" fill="#6b7280">→ Повна готовність до вимірювань</text>

<!-- Картка 2: Аварійний розрив -->
<rect x="626" y="216" width="298" height="96" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="775" y="234" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle">2. Аварійний стан (Розімкнено)</text>
<text x="636" y="254" font-size="12" fill="#1a1a1a">• Відкриття кожуха: R_pd садить вхід на 0 В</text>
<text x="636" y="272" font-size="12" fill="#1a1a1a">• AND блокує затвор MOSFET: V_GS = 0 В</text>
<text x="636" y="290" font-size="12" fill="#1a1a1a">• 100% захист навіть при зависанні МК</text>
<text x="636" y="306" font-size="12" fill="#6b7280">→ Апаратне знеструмлення (Fail-Safe)</text>

<!-- Картка 3: Soft-Start & COD -->
<rect x="626" y="324" width="298" height="104" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
<text x="775" y="342" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">3. Захист кристала (Soft-Start &amp; TVS)</text>
<text x="636" y="362" font-size="12" fill="#1a1a1a">• Ланцюг R_gate + C_soft згладжує dV/dt</text>
<text x="636" y="380" font-size="12" fill="#1a1a1a">• Запобігає сплескам струму накачки (COD)</text>
<text x="636" y="398" font-size="12" fill="#1a1a1a">• TVS демпфує індуктивні викиди кабелю</text>
<text x="636" y="416" font-size="12" fill="#6b7280">→ Збереження ресурсу напівпровідника</text>
</svg>
