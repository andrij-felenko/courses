<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-red-rev" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-blue-rev" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-rev" markerWidth="6" markerHeight="6" refX="1" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M6,0 L0,3 L6,6 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-fwd" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Біла підкладка полотна -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Геометрія проекції лазерного віяла: пряме та похиле падіння</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Розрахунок довжини лінії L = 2d·tg(θ/2) на нормальній площині та її видовження L/cos(α) під кутом триангуляції</text>

  <!-- ==================== ЛІВА ПАНЕЛЬ: ПРЯМЕ ПАДІННЯ ==================== -->
  <rect x="35" y="75" width="435" height="280" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="252" y="98" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">Пряме падіння на нормальну площину (α = 0°)</text>

  <!-- Лазерний модуль -->
  <rect x="55" y="170" width="45" height="20" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="100" y="168" width="10" height="24" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="77" y="162" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Модуль</text>

  <!-- Оптична вісь (штрихпунктир) -->
  <line x1="110" y1="180" x2="330" y2="180" stroke="#6b7280" stroke-width="1" stroke-dasharray="6 3 2 3"/>

  <!-- Лазерне віяло (кут θ) -->
  <polygon points="110,180 330,115 330,245" fill="#eaf0fd" opacity="0.55"/>
  <line x1="110" y1="180" x2="330" y2="115" stroke="#2457d6" stroke-width="1.8"/>
  <line x1="110" y1="180" x2="330" y2="245" stroke="#2457d6" stroke-width="1.8"/>

  <!-- Позначення кута віяла θ -->
  <path d="M 153,167 A 45 45 0 0 1 153,193" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <text x="155" y="136" font-size="12" font-weight="700" fill="#2457d6">Кут θ</text>

  <!-- Нормальна площина мішені -->
  <line x1="330" y1="100" x2="330" y2="255" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="330" y1="115" x2="330" y2="245" stroke="#2457d6" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Розмір L лінії -->
  <line x1="344" y1="117" x2="344" y2="243" stroke="#2457d6" stroke-width="1.2" marker-start="url(#arr-blue-rev)" marker-end="url(#arr-blue)"/>
  <text x="356" y="176" font-size="12" font-weight="700" fill="#2457d6">L = 2d·tg(θ/2)</text>
  <text x="356" y="192" font-size="12" fill="#6b7280">(довжина смуги)</text>

  <!-- Розмір відстані d -->
  <line x1="110" y1="258" x2="330" y2="258" stroke="#1a1a1a" stroke-width="1.2" marker-start="url(#arr-rev)" marker-end="url(#arr-fwd)"/>
  <line x1="110" y1="254" x2="110" y2="262" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="330" y1="254" x2="330" y2="262" stroke="#1a1a1a" stroke-width="1"/>
  <text x="220" y="275" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Робоча відстань d</text>

  <!-- Картка розрахунку -->
  <rect x="50" y="285" width="405" height="56" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="65" y="305" font-size="12" font-weight="700" fill="#2457d6">Розрахунок при прямому падінні (α = 0°):</text>
  <text x="65" y="325" font-size="12" fill="#1a1a1a">При d = 500 мм і θ = 60°: L = 2 · 500 · tg(30°) = 577 мм</text>

  <!-- ==================== ПРАВА ПАНЕЛЬ: ПОХИЛЕ ПАДІННЯ ==================== -->
  <rect x="490" y="75" width="435" height="280" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="707" y="98" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle">Похиле падіння: кут тріангуляції α</text>

  <!-- Лазерний модуль -->
  <rect x="505" y="170" width="45" height="20" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="550" y="168" width="10" height="24" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="527" y="162" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Модуль</text>

  <!-- Оптична вісь (штрихпунктир) -->
  <line x1="560" y1="180" x2="745" y2="180" stroke="#6b7280" stroke-width="1" stroke-dasharray="6 3 2 3"/>

  <!-- Похиле віяло на скошену поверхню -->
  <polygon points="560,180 715,123 795,263" fill="#fdecea" opacity="0.5"/>
  <line x1="560" y1="180" x2="715" y2="123" stroke="#c0392b" stroke-width="1.8"/>
  <line x1="560" y1="180" x2="795" y2="263" stroke="#c0392b" stroke-width="1.8"/>

  <!-- Похила площина об'єкта під кутом α -->
  <line x1="700" y1="98" x2="810" y2="278" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="715" y1="123" x2="795" y2="263" stroke="#c0392b" stroke-width="5" stroke-linecap="round"/>

  <!-- Нормаль для відліку кута α -->
  <line x1="745" y1="140" x2="745" y2="220" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
  <path d="M 745,152 A 28 28 0 0 1 760,156" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <text x="768" y="152" font-size="12" font-weight="700" fill="#c0392b">α</text>

  <!-- Розмір видовженої лінії L_proj -->
  <line x1="727" y1="117" x2="807" y2="257" stroke="#c0392b" stroke-width="1.2" marker-start="url(#arr-red-rev)" marker-end="url(#arr-red)"/>
  <text x="818" y="180" font-size="12" font-weight="700" fill="#c0392b">L_proj</text>
  <text x="818" y="196" font-size="12" fill="#6b7280">≈ L / cos(α)</text>

  <!-- Картка розрахунку похилого падіння -->
  <rect x="505" y="285" width="405" height="56" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="520" y="305" font-size="12" font-weight="700" fill="#c0392b">Ефект тріангуляційного нахилу (α &gt; 0°):</text>
  <text x="520" y="325" font-size="12" fill="#1a1a1a">При α = 45°: видовження +41%, опроміненість падає на 29%</text>

  <!-- ==================== НИЖНЯ ПАНЕЛЬ: ПОЯСНЕННЯ ==================== -->
  <rect x="35" y="368" width="890" height="72" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="388" font-size="12" font-weight="700" fill="#1a1a1a">Правила проекційного розрахунку лазерного віяла для 3D-тріангуляції:</text>
  <text x="55" y="407" font-size="12" fill="#6b7280">1. Довжина лінії L на нормальній площині строго пропорційна відстані d та тангенсу напівкута віяла: L = 2d·tg(θ/2).</text>
  <text x="55" y="425" font-size="12" fill="#6b7280">2. При куті тріангуляції α проекція видовжується як L/cos(α), що пропорційно знижує густину світлового потоку на об'єкті.</text>
</svg>
