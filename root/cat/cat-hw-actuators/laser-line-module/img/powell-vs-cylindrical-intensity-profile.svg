<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <!-- Маркери стрілок -->
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <!-- Градієнт для гаусової смуги циліндричної лінзи -->
    <linearGradient id="grad-cyl" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3a0d0d"/>
      <stop offset="25%" stop-color="#8a1f1f"/>
      <stop offset="50%" stop-color="#ff4d4d"/>
      <stop offset="75%" stop-color="#8a1f1f"/>
      <stop offset="100%" stop-color="#3a0d0d"/>
    </linearGradient>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Порівняння профілів інтенсивності циліндричної лінзи та лінзи Павелла</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Гаусів спад яскравості до країв лінії проти рівномірного flat-top розподілу енергії</text>

  <!-- ЛІВА ПАНЕЛЬ: Графік та вигляд смуг -->
  <rect x="24" y="68" width="606" height="372" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Шапка лівої панелі з легендою -->
  <text x="40" y="92" font-size="13" font-weight="bold" fill="#1a1a1a">Розподіл інтенсивності I / I₀ вздовж лінії</text>
  <line x1="335" y1="88" x2="355" y2="88" stroke="#27ae60" stroke-width="2.5"/>
  <text x="361" y="92" font-size="12" font-weight="bold" fill="#27ae60">Лінза Павелла</text>
  <line x1="470" y1="88" x2="490" y2="88" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 2"/>
  <text x="496" y="92" font-size="12" font-weight="bold" fill="#c0392b">Циліндрична лінза</text>

  <!-- Заливка області flat-top для лінзи Павелла -->
  <polygon points="140,250 162,145 498,145 520,250" fill="#e9f7ef"/>

  <!-- Горизонтальні лінії рівнів інтенсивності -->
  <line x1="85" y1="135" x2="570" y2="135" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="85" y1="192" x2="570" y2="192" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="85" y1="250" x2="575" y2="250" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Вертикальні лінії меж смуги (-L/2, центр, +L/2) -->
  <line x1="150" y1="125" x2="150" y2="250" stroke="#2457d6" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="510" y1="125" x2="510" y2="250" stroke="#2457d6" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- Центральна вісь: залишаємо розрив навколо напису плато (y=155..180) -->
  <line x1="330" y1="138" x2="330" y2="155" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="330" y1="182" x2="330" y2="250" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Значення на осі Y (I / I0) -->
  <text x="80" y="139" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">100%</text>
  <text x="80" y="196" font-size="12" fill="#6b7280" text-anchor="end">50%</text>
  <text x="80" y="254" font-size="12" fill="#1a1a1a" text-anchor="end">0%</text>

  <!-- Крива 1: Лінза Павелла (зелена, flat-top профіль) -->
  <path d="M 100,250 L 138,250 C 146,250 152,152 165,145 L 495,145 C 508,152 514,250 522,250 L 560,250" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Крива 2: Циліндрична лінза (червона пунктирна, гаусів дзвоноподібний профіль) -->
  <path d="M 100,249 C 145,248 195,236 240,195 C 275,158 305,135 330,135 C 355,135 385,158 420,195 C 465,236 515,248 560,249" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 2"/>
  <circle cx="330" cy="135" r="3.5" fill="#c0392b"/>

  <!-- Підписи на графіку (розташовані строго у вільних зонах) -->
  <text x="330" y="122" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Гаусів пік (100%)</text>
  <text x="330" y="172" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Плато ~95%</text>
  <text x="145" y="235" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">~15%</text>
  <text x="515" y="235" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">~15%</text>

  <!-- Позначки на осі X (розділені з запасом, без накладання) -->
  <text x="150" y="268" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">-L/2</text>
  <text x="330" y="268" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">0 (Центр)</text>
  <text x="510" y="268" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">+L/2</text>
  <text x="585" y="246" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">x →</text>

  <!-- ================= СМУГИ НА МАТРИЦІ КАМЕРИ ================= -->
  <!-- Блок 1: Смуга циліндричної лінзи -->
  <text x="150" y="302" font-size="12" font-weight="bold" fill="#c0392b">Циліндрична лінза (пересвічений центр та тьмяні краї):</text>
  <text x="140" y="324" font-size="12" fill="#6b7280" text-anchor="end">-L/2</text>
  <rect x="150" y="311" width="360" height="18" rx="3" fill="url(#grad-cyl)"/>
  <text x="520" y="324" font-size="12" fill="#6b7280" text-anchor="start">+L/2</text>

  <!-- Блок 2: Смуга лінзи Павелла -->
  <text x="150" y="354" font-size="12" font-weight="bold" fill="#27ae60">Лінза Павелла (однакова інтенсивність по всій довжині):</text>
  <text x="140" y="376" font-size="12" fill="#6b7280" text-anchor="end">-L/2</text>
  <rect x="150" y="363" width="360" height="18" rx="3" fill="#c0392b"/>
  <text x="520" y="376" font-size="12" fill="#6b7280" text-anchor="start">+L/2</text>

  <!-- Підпис до смуг -->
  <text x="330" y="406" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Зображення лазерної лінії на КМОН-матриці камери</text>
  <text x="330" y="423" font-size="12" fill="#6b7280" text-anchor="middle">(порівняння оптичного динамічного діапазону)</text>

  <!-- ПРАВА ПАНЕЛЬ: Аналітичні картки -->
  <rect x="646" y="68" width="290" height="372" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Картка 1: Вади циліндричної лінзи -->
  <rect x="660" y="86" width="262" height="152" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="660" y="86" width="262" height="28" rx="6" fill="#fdecea"/>
  <text x="672" y="105" font-size="13" font-weight="bold" fill="#c0392b">1. Вади циліндричної лінзи</text>
  <text x="672" y="128" font-size="12" font-weight="bold" fill="#c0392b">• Гаусів спад енергії:</text>
  <text x="684" y="146" font-size="12" fill="#1a1a1a">Промінь зберігає форму діода,</text>
  <text x="684" y="164" font-size="12" fill="#1a1a1a">на краях яскравість падає до 10%</text>
  <text x="672" y="186" font-size="12" font-weight="bold" fill="#c0392b">• Наслідки для тріангуляції:</text>
  <text x="684" y="204" font-size="12" fill="#1a1a1a">У центрі — пересвіт (кліпінг),</text>
  <text x="684" y="222" font-size="12" fill="#6b7280">на краях — шум і втрата точок COG</text>

  <!-- Картка 2: Переваги лінзи Павелла -->
  <rect x="660" y="250" width="262" height="174" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="660" y="250" width="262" height="28" rx="6" fill="#e9f7ef"/>
  <text x="672" y="269" font-size="13" font-weight="bold" fill="#27ae60">2. Переваги лінзи Павелла</text>
  <text x="672" y="294" font-size="12" font-weight="bold" fill="#27ae60">• Асферична призма (вершина):</text>
  <text x="684" y="312" font-size="12" fill="#1a1a1a">Перерозподіляє енергію з центру</text>
  <text x="684" y="330" font-size="12" fill="#1a1a1a">рівномірно до периферійних країв</text>
  <text x="672" y="352" font-size="12" font-weight="bold" fill="#27ae60">• Результат для 3D-сканування:</text>
  <text x="684" y="370" font-size="12" fill="#1a1a1a">Рівномірний SNR по всьому полю,</text>
  <text x="684" y="388" font-size="12" fill="#1a1a1a">стабільний субрезолюційний COG,</text>
  <text x="684" y="406" font-size="12" fill="#6b7280">максимальна робоча ширина огляду</text>
</svg>
