<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка полотна -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Невідповідність діаметра пучка призмі Павелла: дефекти профілю</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Відхилення діаметра коліматора d_вх від номіналу призми викликає центральний горб або крайові спалахи</text>

  <!-- ==================== ПАНЕЛЬ 1: ЗАВУЗЬКИЙ ПУЧОК ==================== -->
  <rect x="35" y="75" width="280" height="280" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="50" y="87" width="250" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="175" y="103" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Завузький пучок (d &lt; d_ном)</text>

  <!-- Осі графіка -->
  <line x1="60" y1="195" x2="290" y2="195" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="60" y1="195" x2="60" y2="125" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="55" y="128" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">I</text>
  <text x="290" y="207" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">x</text>

  <!-- Гаусова крива центрального горба -->
  <path d="M 75,194 C 110,194 140,185 160,150 C 168,135 171,128 175,128 C 179,128 182,135 190,150 C 210,185 240,194 275,194 L 275,195 L 75,195 Z" fill="#fdecea" opacity="0.8"/>
  <path d="M 75,194 C 110,194 140,185 160,150 C 168,135 171,128 175,128 C 179,128 182,135 190,150 C 210,185 240,194 275,194" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="175" y="120" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Центральний горб</text>

  <!-- Імітація кадру сенсора -->
  <rect x="50" y="220" width="250" height="40" rx="4" fill="#1e232a"/>
  <line x1="75" y1="240" x2="275" y2="240" stroke="#c0392b" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
  <line x1="130" y1="240" x2="220" y2="240" stroke="#e74c3c" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <line x1="155" y1="240" x2="195" y2="240" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>

  <!-- Опис наслідків -->
  <text x="175" y="280" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Ефект недозаповнення:</text>
  <text x="175" y="296" font-size="12" fill="#1a1a1a" text-anchor="middle">Енергія не доходить до країв,</text>
  <text x="175" y="312" font-size="12" fill="#6b7280" text-anchor="middle">пересвіт у центрі лінії</text>
  <text x="175" y="336" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Втрата країв деталі</text>

  <!-- ==================== ПАНЕЛЬ 2: НОМІНАЛЬНИЙ ПУЧОК ==================== -->
  <rect x="340" y="75" width="280" height="280" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="355" y="87" width="250" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="480" y="103" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Номінальний пучок (d = d_ном)</text>

  <!-- Осі графіка -->
  <line x1="365" y1="195" x2="595" y2="195" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="365" y1="195" x2="365" y2="125" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="360" y="128" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">I</text>
  <text x="595" y="207" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">x</text>

  <!-- Flat-Top крива -->
  <polygon points="395,194 405,145 555,145 565,194" fill="#e9f7ef" opacity="0.85"/>
  <path d="M 380,194 L 395,194 L 405,145 L 555,145 L 565,194 L 580,194" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <text x="480" y="137" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Flat-Top (±5%)</text>

  <!-- Імітація кадру сенсора -->
  <rect x="355" y="220" width="250" height="40" rx="4" fill="#1e232a"/>
  <line x1="385" y1="240" x2="575" y2="240" stroke="#27ae60" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
  <line x1="387" y1="240" x2="573" y2="240" stroke="#2ecc71" stroke-width="3.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="390" y1="240" x2="570" y2="240" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Опис наслідків -->
  <text x="480" y="280" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Ідеальне узгодження:</text>
  <text x="480" y="296" font-size="12" fill="#1a1a1a" text-anchor="middle">Однорідна яскравість смуги,</text>
  <text x="480" y="312" font-size="12" fill="#6b7280" text-anchor="middle">чіткі вертикальні межі</text>
  <text x="480" y="336" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Субпіксельна точність</text>

  <!-- ==================== ПАНЕЛЬ 3: ЗАШИРОКИЙ ПУЧОК ==================== -->
  <rect x="645" y="75" width="280" height="280" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="660" y="87" width="250" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="785" y="103" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Заширокий пучок (d &gt; d_ном)</text>

  <!-- Осі графіка -->
  <line x1="670" y1="195" x2="900" y2="195" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="670" y1="195" x2="670" y2="125" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="665" y="128" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">I</text>
  <text x="900" y="207" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">x</text>

  <!-- Крива з собачими вухами (спалахами) -->
  <path d="M 685,194 L 700,194 L 706,140 C 720,150 750,172 785,172 C 820,172 850,150 864,140 L 870,194 L 885,194 L 885,195 L 685,195 Z" fill="#fdecea" opacity="0.8"/>
  <path d="M 685,194 L 700,194 L 706,140 C 720,150 750,172 785,172 C 820,172 850,150 864,140 L 870,194 L 885,194" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="785" y="122" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Спалахи на краях</text>
  <text x="785" y="137" font-size="12" fill="#6b7280" text-anchor="middle">(«собачі вуха»)</text>

  <!-- Імітація кадру сенсора -->
  <rect x="660" y="220" width="250" height="40" rx="4" fill="#1e232a"/>
  <line x1="690" y1="240" x2="870" y2="240" stroke="#c0392b" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <line x1="740" y1="240" x2="820" y2="240" stroke="#c0392b" stroke-width="1.5" stroke-linecap="round" opacity="0.2"/>
  <circle cx="705" cy="240" r="7" fill="#ff6b6b" opacity="0.6"/>
  <circle cx="705" cy="240" r="4.5" fill="#ffffff"/>
  <circle cx="855" cy="240" r="7" fill="#ff6b6b" opacity="0.6"/>
  <circle cx="855" cy="240" r="4.5" fill="#ffffff"/>

  <!-- Опис наслідків -->
  <text x="785" y="280" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Ефект перезаповнення:</text>
  <text x="785" y="296" font-size="12" fill="#1a1a1a" text-anchor="middle">Надлишок світла на кінцях,</text>
  <text x="785" y="312" font-size="12" fill="#6b7280" text-anchor="middle">темний провал посередині</text>
  <text x="785" y="336" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Кліпінг на кінцях лінії</text>

  <!-- ==================== НИЖНЯ ПАНЕЛЬ: ПОЯСНЕННЯ ==================== -->
  <rect x="35" y="368" width="890" height="72" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="388" font-size="12" font-weight="700" fill="#1a1a1a">Чому призма Павелла вимагає точного підбору під діаметр пучка d_вх:</text>
  <text x="55" y="407" font-size="12" fill="#6b7280">1. Асферична кривина вершини розрахована строго на одне значення d_вх; призма не є універсальною деталлю.</text>
  <text x="55" y="425" font-size="12" fill="#6b7280">2. При заміні коліматора або перефокусуванні необхідно перевіряти профіль лінії, щоб уникнути спалахів («собачих вух»).</text>
</svg>
