<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Призма Павелла: геометрія асферичного гребеня та хід променів</text>
  <text x="480" y="57" font-size="13" fill="#6b7280" text-anchor="middle">Змінна кривина вершини розгортає насичений центр гаусового пучка в однорідну flat-top лінію</text>

  <!-- Main Left Panel: Optical Ray Tracing Diagram -->
  <rect x="30" y="75" width="600" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="97" font-size="12" font-weight="bold" fill="#6b7280">ХІД ПРОМЕНІВ ТА ПЕРЕРОЗПОДІЛ СВІТЛА В ПРИЗМІ ПАВЕЛЛА</text>

  <!-- Input Gaussian Profile (Left) -->
  <path d="M 52,190 Q 56,220 75,232 Q 95,240 95,240 Q 95,240 75,248 Q 56,260 52,290 Z" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <!-- Input Gaussian Beam Annotation -->
  <text x="105" y="165" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Вхідний гаусів пучок</text>
  <text x="105" y="179" font-size="12" fill="#6b7280" text-anchor="middle">Колімовані промені</text>

  <!-- Optical Axis (Dashed line) -->
  <line x1="50" y1="240" x2="490" y2="240" stroke="#d0d7de" stroke-dasharray="4 3"/>

  <!-- Ray 4: Optical Axis Ray -->
  <line x1="100" y1="240" x2="205" y2="240" stroke="#c0392b" stroke-width="2"/>
  <line x1="205" y1="240" x2="255" y2="240" stroke="#c0392b" stroke-width="2"/>
  <line x1="255" y1="240" x2="490" y2="240" stroke="#c0392b" stroke-width="2"/>

  <!-- Ray 3: Top Central Ray (High Intensity -> Large Angle) -->
  <path d="M 100,230 L 201,230 L 255,218 L 490,335" fill="none" stroke="#c0392b" stroke-width="2"/>

  <!-- Ray 5: Bottom Central Ray (High Intensity -> Large Angle) -->
  <path d="M 100,250 L 201,250 L 255,262 L 490,145" fill="none" stroke="#c0392b" stroke-width="2"/>

  <!-- Ray 2: Top Intermediate Ray -->
  <path d="M 100,215 L 193,215 L 255,226 L 490,290" fill="none" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Ray 6: Bottom Intermediate Ray -->
  <path d="M 100,265 L 193,265 L 255,254 L 490,190" fill="none" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Ray 1: Top Peripheral Ray (Low Intensity -> Small Angle) -->
  <path d="M 100,200 L 188,200 L 255,234 L 490,252" fill="none" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Ray 7: Bottom Peripheral Ray (Low Intensity -> Small Angle) -->
  <path d="M 100,280 L 188,280 L 255,246 L 490,228" fill="none" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Powell Lens Glass Body -->
  <path d="M 185,150 L 187,180 C 190,205 198,225 205,240 C 198,255 190,275 187,300 L 185,330 L 255,330 L 255,150 Z" fill="#eaf0fd" fill-opacity="0.8" stroke="#2457d6" stroke-width="2"/>

  <!-- Lens Annotations -->
  <text x="220" y="142" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Призма Павелла</text>
  <text x="220" y="127" font-size="12" fill="#6b7280" text-anchor="middle">Скло N-BK7</text>

  <!-- Ridge Vertex Annotation -->
  <line x1="205" y1="240" x2="165" y2="310" stroke="#2457d6" stroke-width="1"/>
  <circle cx="205" cy="240" r="3" fill="#2457d6"/>
  <text x="160" y="325" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вершина R_min</text>
  <text x="160" y="339" font-size="12" fill="#6b7280" text-anchor="middle">Макс. кривина</text>

  <!-- Fan Angle Annotation (Above Beam) -->
  <text x="360" y="128" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Кут розгортки 2θ</text>
  <text x="360" y="142" font-size="12" fill="#6b7280" text-anchor="middle">Віяло світлової лінії</text>

  <!-- Projection Screen (Vertical Bar) -->
  <line x1="490" y1="130" x2="490" y2="350" stroke="#1a1a1a" stroke-width="3"/>
  <text x="490" y="122" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Екран</text>

  <!-- Screen Intensity Profile Graphs -->
  <line x1="510" y1="130" x2="510" y2="350" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Flat-Top Profile (Green Rectangular Hat) -->
  <path d="M 510,135 L 510,145 L 545,145 L 545,335 L 510,335 L 510,345" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>

  <!-- Comparison Gaussian Profile (Red Dashed) -->
  <path d="M 510,145 Q 515,190 535,220 Q 560,240 560,240 Q 535,260 515,290 L 510,335" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Labels for Profiles -->
  <text x="555" y="165" font-size="12" font-weight="bold" fill="#27ae60">Flat-Top</text>
  <text x="555" y="179" font-size="12" fill="#27ae60">Рівномірно</text>
  <text x="555" y="200" font-size="12" fill="#c0392b">Циліндр</text>
  <text x="555" y="213" font-size="12" fill="#6b7280">(гаусів спад)</text>

  <!-- Bottom Explanatory Banner in Main Panel -->
  <rect x="45" y="390" width="570" height="38" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="330" y="405" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Принцип Павелла: висока оптична сила у вершині розсіює центр на краї,</text>
  <text x="330" y="419" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">перетворюючи гаусів дзвін на плоску полицю інтенсивності (Flat-Top)</text>


  <!-- Right Side - Card 1: Mechanism of Energy Redistribution -->
  <rect x="645" y="75" width="285" height="170" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="657" y="87" width="261" height="24" rx="4" fill="#2457d6"/>
  <text x="787" y="103" font-size="12" font-weight="bold" fill="white" text-anchor="middle">МЕХАНІЗМ ПЕРЕРОЗПОДІЛУ СВІТЛА</text>
  <text x="657" y="128" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#2457d6">• Гребінь:</tspan> максимальна кривина R у центрі</text>
  <text x="657" y="148" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#c0392b">• Центр пучка:</tspan> заломлюється на край віяла</text>
  <text x="657" y="168" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#2457d6">• Скати даху:</tspan> пологі, відхиляють слабше</text>
  <text x="657" y="188" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#27ae60">• Периферія:</tspan> спрямовується ближче до осі</text>
  <text x="657" y="208" font-size="12" font-weight="bold" fill="#2457d6">Енергія гаусового піка розсіюється вшир</text>
  <rect x="657" y="220" width="261" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="787" y="234" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Кут розгортки віяла: 10° – 110°</text>

  <!-- Right Side - Card 2: Powell Lens vs Cylindrical Lens -->
  <rect x="645" y="260" width="285" height="180" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="657" y="272" width="261" height="24" rx="4" fill="#27ae60"/>
  <text x="787" y="288" font-size="12" font-weight="bold" fill="white" text-anchor="middle">ПРИЗМА ПАВЕЛЛА VS ЦИЛІНДР</text>
  <text x="657" y="312" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#c0392b">• Циліндр:</tspan> спад за Гаусом, тьмяні краї</text>
  <text x="657" y="332" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#27ae60">• Павелл:</tspan> рівномірність Flat-Top &gt; 90%</text>
  <text x="657" y="352" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#1a1a1a">• Пучок &lt; d_opt:</tspan> лінія повертається до Гауса</text>
  <text x="657" y="372" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#1a1a1a">• Пучок &gt; d_opt:</tspan> яскраві «роги» на краях смуги</text>
  <text x="657" y="392" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#c0392b">• Зсув пучка:</tspan> перекіс яскравості смуги</text>
  <rect x="657" y="412" width="261" height="20" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="787" y="426" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Стандарт для 3D-тріангуляції</text>
</svg>
