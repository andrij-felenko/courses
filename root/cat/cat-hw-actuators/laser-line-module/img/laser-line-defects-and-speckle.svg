  <path d="M 708 296 C 753 296, 768 230, 788 230 C 808 230, 823 296, 868 296" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 3"/>
  <path d="M 718 296 C 738 296, 751 240, 763 236 C 771 236, 778 268, 788 268 C 798 268, 805 242, 813 242 C 823 242, 838 296, 863 296" fill="none" stroke="#c0392b" stroke-width="2"/>
  <rect x="657" y="318" width="265" height="104" rx="6" fill="#fdecea" stroke="#d0d7de" stroke-width="1"/>
  <text x="669" y="342" font-size="12" font-weight="bold" fill="#c0392b">Помилка CV: розрив профілю</text>
  <text x="669" y="364" font-size="12" fill="#1a1a1a">Два роздільних максимуми</text>
  <text x="669" y="386" font-size="12" fill="#1a1a1a">Стрибки алгоритму між піками</text>
  <text x="669" y="408" font-size="12" fill="#6b7280">Грубі фантомні сходинки 3D</text>
