  <text x="916" y="208" font-size="12" fill="#6b7280" text-anchor="end">пунктир — норма</text>
  <line x1="683" y1="296" x2="683" y2="220" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="683" y1="296" x2="900" y2="296" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="667" y="232" font-size="12" fill="#6b7280" text-anchor="end">I</text>
