  <text x="50" y="364" font-size="12" fill="#1a1a1a">Дрібні флуктуації вершини</text>
  <text x="50" y="386" font-size="12" fill="#1a1a1a">Джитер центру лінії: ±1–3 px</text>
  <text x="50" y="408" font-size="12" fill="#6b7280">Зрив параболічного фітингу</text>

  <!-- Panel 2 -->
  <rect x="333" y="84" width="294" height="352" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
