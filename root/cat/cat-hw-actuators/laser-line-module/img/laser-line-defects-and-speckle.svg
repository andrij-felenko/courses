  <line x1="485" y1="255" x2="485" y2="296" stroke="#2457d6" stroke-width="1" stroke-dasharray="2 2"/>
  <rect x="347" y="318" width="266" height="104" rx="6" fill="#fdecea" stroke="#d0d7de" stroke-width="1"/>
  <text x="359" y="342" font-size="12" font-weight="bold" fill="#c0392b">Помилка CV: зміщення осі</text>
  <text x="359" y="364" font-size="12" fill="#1a1a1a">Широкий асиметричний хвіст</text>
  <text x="359" y="386" font-size="12" fill="#1a1a1a">Зсув центроїда (Δx): 2–5 px</text>
  <text x="359" y="408" font-size="12" fill="#6b7280">Систематична похибка глибини</text>

  <!-- Panel 3 -->
  <rect x="643" y="84" width="293" height="352" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="789.5" y="112" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">3. Подвійний пік смуги</text>
  <text x="789.5" y="128" font-size="12" fill="#6b7280" text-anchor="middle">Скол вихідної грані кристала</text>
  <text x="663" y="146" font-size="12" fill="#6b7280">Смуга на матриці камери</text>
  <rect x="659" y="156" width="261" height="28" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <ellipse cx="763" cy="170" rx="6" ry="11" fill="#ef4444" opacity="0.85"/>
  <ellipse cx="763" cy="170" rx="2" ry="9" fill="#ffffff" opacity="0.85"/>
