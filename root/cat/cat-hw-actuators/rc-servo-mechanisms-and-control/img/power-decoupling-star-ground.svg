<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <defs>
    <!-- Arrow Markers -->
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Розділення живлення та «зіркове» заземлення (Star Ground)</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Силові струми сервоприводу замикаються в Star GND і шунтуються конденсаторами, захищаючи МК</text>

  <!-- Panel 1: Power Supply -->
  <rect x="25" y="85" width="150" height="420" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="100" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Джерело живлення</text>
  <text x="100" y="130" text-anchor="middle" font-size="12" fill="#6b7280">5V DC</text>

  <!-- Battery Box inside Panel 1 -->
  <rect x="55" y="220" width="90" height="140" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="85" y="212" width="30" height="8" rx="2" fill="#6b7280"/>
  <text x="100" y="275" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">АКБ / БЖ</text>
  <text x="100" y="295" text-anchor="middle" font-size="11" fill="#6b7280">Спільне DC</text>

  <!-- Internal Connections & Terminal Labels inside Panel 1 -->
  <path d="M 100 212 V 160 H 175" stroke="#c0392b" stroke-width="2.5" fill="none"/>
  <path d="M 100 360 V 460 H 175" stroke="#1a1a1a" stroke-width="3" fill="none"/>
  <text x="165" y="148" text-anchor="end" font-size="11" font-weight="bold" fill="#c0392b">+5V VCC</text>
  <text x="165" y="448" text-anchor="end" font-size="11" font-weight="bold" fill="#1a1a1a">GND (0V)</text>

  <!-- Panel 2: Microcontroller -->
  <rect x="195" y="85" width="230" height="235" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="310" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Мікроконтролер</text>
  <text x="310" y="130" text-anchor="middle" font-size="11" fill="#6b7280">(Логіка / Генератор ШІМ)</text>

  <!-- MCU Chip Box -->
  <rect x="230" y="145" width="160" height="155" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="310" y="200" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">МК (MCU)</text>
  <text x="240" y="175" text-anchor="start" font-size="11" font-weight="bold" fill="#c0392b">VCC</text>
  <text x="380" y="228" text-anchor="end" font-size="11" font-weight="bold" fill="#2457d6">PWM</text>
  <text x="310" y="288" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">GND</text>

  <!-- Panel 3: Star GND Hub Panel -->
  <rect x="195" y="340" width="230" height="165" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="252" y="365" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Точка «Star GND»</text>
  <text x="252" y="382" text-anchor="middle" font-size="10" fill="#6b7280">Єдина точка 0 В</text>

  <text x="368" y="365" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">I_сигнал (чистий)</text>
  <text x="368" y="382" text-anchor="middle" font-size="10" fill="#6b7280">Без силових завад</text>

  <text x="310" y="492" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Мінус джерела живлення (0 В)</text>

  <!-- Star GND Node Visual -->
  <circle cx="310" cy="460" r="10" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <circle cx="310" cy="460" r="4.5" fill="#27ae60"/>

  <!-- Logic GND Line (MCU GND to Star GND) -->
  <path d="M 310 300 V 450" stroke="#2457d6" stroke-width="2" stroke-dasharray="5,3" fill="none"/>

  <!-- Panel 4: Decoupling Circuit -->
  <rect x="445" y="85" width="230" height="420" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="5,5"/>
  <text x="560" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Декуплеризація</text>
  <text x="560" y="130" text-anchor="middle" font-size="11" fill="#6b7280">(Фільтрація та згладжування)</text>

  <!-- Component C1 (Ceramic Capacitor) -->
  <path d="M 495 160 V 245" stroke="#c0392b" stroke-width="2" fill="none"/>
  <path d="M 495 265 V 460" stroke="#27ae60" stroke-width="2" fill="none"/>
  <!-- C1 Plates -->
  <line x1="483" y1="245" x2="507" y2="245" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="483" y1="265" x2="507" y2="265" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="478" y="222" text-anchor="end" font-size="11" font-weight="bold" fill="#1a1a1a">C₁ = 0.1 мкФ</text>
  <text x="478" y="236" text-anchor="end" font-size="10" font-style="italic" fill="#2457d6">Кераміка</text>
  <text x="478" y="282" text-anchor="end" font-size="10" fill="#6b7280">ВЧ-поглинання</text>
  <text x="478" y="296" text-anchor="end" font-size="10" fill="#6b7280">(імпульси)</text>

  <!-- Component C2 (Electrolytic Capacitor) -->
  <path d="M 625 160 V 245" stroke="#c0392b" stroke-width="2" fill="none"/>
  <path d="M 625 265 V 460" stroke="#27ae60" stroke-width="2" fill="none"/>
  <!-- C2 Plates -->
  <line x1="613" y1="245" x2="637" y2="245" stroke="#1a1a1a" stroke-width="2.5"/>
  <path d="M 613 265 Q 625 271 637 265" stroke="#1a1a1a" stroke-width="2.5" fill="none"/>
  <text x="641" y="242" text-anchor="start" font-size="11" font-weight="bold" fill="#c0392b">+</text>
  <text x="641" y="222" text-anchor="start" font-size="11" font-weight="bold" fill="#1a1a1a">C₂ = 470 мкФ</text>
  <text x="641" y="236" text-anchor="start" font-size="10" font-style="italic" fill="#c0392b">Електроліт</text>
  <text x="641" y="282" text-anchor="start" font-size="10" fill="#6b7280">НЧ-згладжування</text>
  <text x="641" y="296" text-anchor="start" font-size="10" fill="#6b7280">(просідання U)</text>

  <!-- Decoupling Badge Box -->
  <rect x="507" y="345" width="106" height="50" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="560" y="365" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Локальний контур</text>
  <text x="560" y="380" text-anchor="middle" font-size="10" fill="#1a1a1a">Шунтування піків</text>

  <!-- Panel 5: RC Servo -->
  <rect x="695" y="85" width="240" height="420" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="815" y="112" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">RC-Сервопривід</text>
  <text x="815" y="130" text-anchor="middle" font-size="11" fill="#6b7280">(Мотор + Плата керування)</text>

  <!-- Motor Housing Box -->
  <rect x="725" y="240" width="180" height="155" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="815" cy="290" r="24" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="815" y="298" text-anchor="middle" font-size="22" font-weight="bold" fill="#c0392b">M</text>
  <text x="815" y="335" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Колекторний мотор</text>
  <text x="815" y="353" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">I_power &gt; 1.5 А (піки)</text>
  <text x="815" y="370" text-anchor="middle" font-size="10" fill="#6b7280">Джерело завад</text>

  <!-- Terminal Labels inside Panel 5 -->
  <text x="705" y="148" text-anchor="start" font-size="11" font-weight="bold" fill="#c0392b">VCC (Червоний)</text>
  <text x="705" y="188" text-anchor="start" font-size="11" font-weight="bold" fill="#2457d6">SIG (Жовтий)</text>
  <text x="705" y="448" text-anchor="start" font-size="11" font-weight="bold" fill="#1a1a1a">GND (Чорний)</text>

  <!-- Main Inter-Block Circuit Connections -->

  <!-- VCC Power Bus (+5V) -->
  <path d="M 175 160 H 695" stroke="#c0392b" stroke-width="3" fill="none"/>
  <!-- Branch to MCU VCC -->
  <circle cx="250" cy="160" r="4" fill="#c0392b"/>
  <!-- Junction dots at C1, C2 -->
  <circle cx="495" cy="160" r="4" fill="#c0392b"/>
  <circle cx="625" cy="160" r="4" fill="#c0392b"/>
  <!-- Label above VCC Bus -->
  <text x="560" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Силова лінія VCC (+5V)</text>

  <!-- PWM Signal Line -->
  <path d="M 390 200 H 695" stroke="#2457d6" stroke-width="2.5" fill="none" marker-end="url(#arr-blue)"/>
  <text x="560" y="188" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">ШІМ-сигнал (0.5 – 2.5 мс)</text>

  <!-- Power Source GND to Star GND -->
  <path d="M 175 460 H 300" stroke="#1a1a1a" stroke-width="3.5" fill="none" marker-end="url(#arr-dark)"/>
  <text x="238" y="448" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">GND БЖ</text>

  <!-- Servo Heavy GND Line to Star GND -->
  <path d="M 695 460 H 320" stroke="#27ae60" stroke-width="3.5" fill="none" marker-end="url(#arr-green)"/>
  <circle cx="495" cy="460" r="4" fill="#27ae60"/>
  <circle cx="625" cy="460" r="4" fill="#27ae60"/>
  <text x="560" y="448" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Силове заземлення I_power (Heavy GND)</text>

  <!-- Internal Servo Connections -->
  <path d="M 695 160 H 815 V 240" stroke="#c0392b" stroke-width="2.5" fill="none"/>
  <path d="M 695 200 H 755 V 240" stroke="#2457d6" stroke-width="2" fill="none" marker-end="url(#arr-blue)"/>
  <path d="M 815 395 V 460 H 695" stroke="#27ae60" stroke-width="3.5" fill="none"/>

</svg>
