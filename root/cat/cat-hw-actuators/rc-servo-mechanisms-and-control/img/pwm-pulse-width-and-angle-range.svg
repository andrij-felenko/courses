<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Залежність кута повороту сервоприводу від тривалості ШІМ-імпульсу</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Вихід тривалості імпульсу за межі 0,5–2,5 мс спричиняє заклинювання редуктора та стрибок струму</text>

  <!-- Panel 1: Main Graph Panel -->
  <rect x="20" y="85" width="920" height="315" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Panel 1 Header & Legend -->
  <text x="35" y="110" font-size="14" font-weight="bold" fill="#1a1a1a">Графік кута повороту (θ) та струму (I) від тривалості імпульсу (t)</text>
  
  <line x1="570" y1="106" x2="595" y2="106" stroke="#2457d6" stroke-width="3"/>
  <text x="602" y="110" font-size="12" font-weight="bold" fill="#2457d6">Кут вала (θ)</text>
  
  <line x1="710" y1="106" x2="735" y2="106" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6 3"/>
  <text x="742" y="110" font-size="12" font-weight="bold" fill="#c0392b">Струм (I)</text>

  <!-- Danger Zones Backgrounds -->
  <!-- Left Danger Zone: t < 0.5 ms -->
  <rect x="120" y="145" width="115" height="200" fill="#fdecea" fill-opacity="0.7"/>

  <!-- Left Danger Zone Badge -->
  <rect x="126" y="192" width="100" height="50" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="176" y="206" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Упор 0°</text>
  <text x="176" y="220" text-anchor="middle" font-size="11" fill="#c0392b">Заклинювання</text>
  <text x="176" y="234" text-anchor="middle" font-size="11" fill="#c0392b">t &lt; 0,5 мс</text>

  <!-- Safe Working Range: 0.5 ms <= t <= 2.5 ms -->
  <rect x="235" y="145" width="460" height="200" fill="#e9f7ef" fill-opacity="0.5"/>
  <rect x="255" y="155" width="200" height="42" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="355" y="172" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Робочий діапазон</text>
  <text x="355" y="187" text-anchor="middle" font-size="11" fill="#27ae60">(0,5 мс ... 2,5 мс)</text>

  <!-- Right Danger Zone: t > 2.5 ms -->
  <rect x="695" y="145" width="115" height="200" fill="#fdecea" fill-opacity="0.7"/>

  <!-- Right Danger Zone Badges -->
  <rect x="702" y="192" width="100" height="50" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="752" y="206" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Упор 180°</text>
  <text x="752" y="220" text-anchor="middle" font-size="11" fill="#c0392b">Заклинювання</text>
  <text x="752" y="234" text-anchor="middle" font-size="11" fill="#c0392b">t &gt; 2,5 мс</text>

  <rect x="702" y="250" width="100" height="38" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="752" y="264" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Стрибок струму!</text>
  <text x="752" y="278" text-anchor="middle" font-size="11" fill="#c0392b">Перегрів і збій</text>

  <!-- Gridlines -->
  <!-- Horizontal gridlines for angles -->
  <line x1="120" y1="195" x2="810" y2="195" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="120" y1="245" x2="810" y2="245" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="120" y1="295" x2="810" y2="295" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Vertical gridlines for key times -->
  <line x1="235" y1="145" x2="235" y2="345" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="350" y1="145" x2="350" y2="345" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="465" y1="145" x2="465" y2="345" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="580" y1="145" x2="580" y2="345" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="695" y1="145" x2="695" y2="345" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Left Y-Axis (Angle theta) -->
  <line x1="120" y1="145" x2="120" y2="345" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="115" y="130" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">Кут θ (°)</text>
  
  <line x1="115" y1="145" x2="120" y2="145" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="112" y="149" text-anchor="end" font-size="12" fill="#1a1a1a">180°</text>
  
  <line x1="115" y1="195" x2="120" y2="195" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="112" y="199" text-anchor="end" font-size="12" fill="#6b7280">135°</text>
  
  <line x1="115" y1="245" x2="120" y2="245" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="112" y="249" text-anchor="end" font-size="12" fill="#1a1a1a">90°</text>
  
  <line x1="115" y1="295" x2="120" y2="295" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="112" y="299" text-anchor="end" font-size="12" fill="#6b7280">45°</text>
  
  <line x1="115" y1="345" x2="120" y2="345" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="112" y="349" text-anchor="end" font-size="12" fill="#1a1a1a">0°</text>

  <!-- Right Y-Axis (Current I) -->
  <line x1="810" y1="145" x2="810" y2="345" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="815" y="130" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">Струм I (А)</text>
  
  <line x1="810" y1="165" x2="815" y2="165" stroke="#c0392b" stroke-width="1.5"/>
  <text x="818" y="169" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">I_закл (~2,0А)</text>
  
  <line x1="810" y1="330" x2="815" y2="330" stroke="#6b7280" stroke-width="1.5"/>
  <text x="818" y="334" text-anchor="start" font-size="12" fill="#6b7280">I_роб (~0,2А)</text>

  <!-- X-Axis (Pulse Width t) -->
  <line x1="120" y1="345" x2="810" y2="345" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="465" y="388" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Тривалість керуючого імпульсу t (мс) [період T = 20 мс / 50 Гц]</text>

  <line x1="120" y1="345" x2="120" y2="350" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="120" y="364" text-anchor="middle" font-size="12" fill="#6b7280">0,0</text>

  <line x1="235" y1="345" x2="235" y2="350" stroke="#27ae60" stroke-width="1.5"/>
  <text x="235" y="364" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">0,5</text>

  <line x1="350" y1="345" x2="350" y2="350" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="350" y="364" text-anchor="middle" font-size="12" fill="#1a1a1a">1,0</text>

  <line x1="465" y1="345" x2="465" y2="350" stroke="#2457d6" stroke-width="1.5"/>
  <text x="465" y="364" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">1,5 (нейтраль)</text>

  <line x1="580" y1="345" x2="580" y2="350" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="580" y="364" text-anchor="middle" font-size="12" fill="#1a1a1a">2,0</text>

  <line x1="695" y1="345" x2="695" y2="350" stroke="#27ae60" stroke-width="1.5"/>
  <text x="695" y="364" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">2,5</text>

  <line x1="810" y1="345" x2="810" y2="350" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="810" y="364" text-anchor="middle" font-size="12" fill="#6b7280">3,0</text>

  <!-- Plot Curves -->
  <!-- Current Curve I(t) -->
  <path d="M 120,165 L 205,165 Q 235,165 235,330 L 695,330 Q 695,165 725,165 L 810,165" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6 3"/>

  <!-- Angle Curve theta(t) -->
  <path d="M 120,345 L 235,345 L 465,245 L 695,145 L 810,145" fill="none" stroke="#2457d6" stroke-width="3.5"/>

  <!-- Angle Curve Key Points & Callouts -->
  <!-- Point 1: 0 deg -->
  <circle cx="235" cy="345" r="5" fill="#2457d6"/>
  <line x1="235" y1="340" x2="232" y2="328" stroke="#2457d6" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="228" y="325" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">0° (t = 0,5 мс)</text>

  <!-- Point 2: 90 deg -->
  <circle cx="465" cy="245" r="5" fill="#2457d6"/>
  <line x1="469" y1="249" x2="480" y2="260" stroke="#2457d6" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="484" y="268" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">90° (t = 1,5 мс)</text>

  <!-- Point 3: 180 deg -->
  <circle cx="695" cy="145" r="5" fill="#2457d6"/>
  <line x1="691" y1="152" x2="683" y2="200" stroke="#2457d6" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="680" y="212" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">180° (t = 2,5 мс)</text>

  <!-- Panel 2: Key Pulse Width States & Cards -->
  <rect x="20" y="415" width="920" height="125" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Card 1: 0.5 ms -->
  <rect x="35" y="427" width="280" height="101" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="175" y="445" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">t = 0,5 мс (Мінімум)</text>
  
  <path d="M 45,482 L 55,482 L 55,466 L 70,466 L 70,482 L 95,482" fill="none" stroke="#2457d6" stroke-width="2"/>
  <text x="62" y="462" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">0,5 мс</text>
  
  <circle cx="255" cy="475" r="18" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="255" y1="475" x2="240" y2="475" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <circle cx="255" cy="475" r="3" fill="#1a1a1a"/>
  
  <text x="175" y="502" text-anchor="middle" font-size="12" fill="#1a1a1a">Положення: 0°</text>
  <text x="175" y="520" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">&lt; 0,5 мс — заклинювання</text>

  <!-- Card 2: 1.5 ms -->
  <rect x="340" y="427" width="280" height="101" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="445" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">t = 1,5 мс (Нейтраль)</text>
  
  <path d="M 350,482 L 360,482 L 360,466 L 405,466 L 405,482 L 430,482" fill="none" stroke="#2457d6" stroke-width="2"/>
  <text x="382" y="462" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">1,5 мс</text>
  
  <circle cx="560" cy="475" r="18" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="560" y1="475" x2="560" y2="460" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <circle cx="560" cy="475" r="3" fill="#1a1a1a"/>
  
  <text x="480" y="502" text-anchor="middle" font-size="12" fill="#1a1a1a">Положення: 90° (центр)</text>
  <text x="480" y="520" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Оптимальний режим</text>

  <!-- Card 3: 2.5 ms -->
  <rect x="645" y="427" width="280" height="101" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="785" y="445" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">t = 2,5 мс (Максимум)</text>
  
  <path d="M 650,482 L 660,482 L 660,466 L 720,466 L 720,482 L 730,482" fill="none" stroke="#2457d6" stroke-width="2"/>
  <text x="685" y="462" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">2,5 мс</text>
  
  <circle cx="865" cy="475" r="18" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="865" y1="475" x2="880" y2="475" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <circle cx="865" cy="475" r="3" fill="#1a1a1a"/>
  
  <text x="785" y="502" text-anchor="middle" font-size="12" fill="#1a1a1a">Положення: 180°</text>
  <text x="785" y="520" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">&gt; 2,5 мс — заклинювання</text>

</svg>
