<svg viewBox="0 0 720 420" width="720" height="420" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="720" height="420" fill="white"/>
  <text x="360" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Електромеханічні характеристики двигуна постійного струму</text>
  <text x="360" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Залежність струму, зворотної ЕРС та тепловиділення від швидкості</text>

  <!-- Legend -->
  <rect x="150" y="70" width="420" height="40" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  
  <line x1="170" y1="90" x2="200" y2="90" stroke="#2457d6" stroke-width="3"/>
  <text x="210" y="94" font-size="12" fill="#1a1a1a">Струм (I)</text>

  <line x1="280" y1="90" x2="310" y2="90" stroke="#27ae60" stroke-width="3"/>
  <text x="320" y="94" font-size="12" fill="#1a1a1a">Зворотна ЕРС (E)</text>

  <line x1="420" y1="90" x2="450" y2="90" stroke="#c0392b" stroke-width="3"/>
  <text x="460" y="94" font-size="12" fill="#1a1a1a">Теплова потужність (P)</text>

  <!-- Plot Area -->
  <rect x="80" y="140" width="560" height="220" fill="#fafbfc" stroke="#d0d7de" stroke-width="1"/>
  
  <!-- Y-axis Left Labels -->
  <text x="70" y="364" font-size="12" fill="#6b7280" text-anchor="end">0</text>
  <text x="70" y="145" font-size="12" fill="#6b7280" text-anchor="end">MAX</text>
  
  <!-- X-axis Labels -->
  <text x="80" y="380" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold">0 (Заклинювання)</text>
  <text x="360" y="380" font-size="12" fill="#6b7280" text-anchor="middle">50%</text>
  <text x="640" y="380" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold">MAX (Холостий хід)</text>

  <!-- X-axis Title -->
  <text x="360" y="405" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кутова швидкість вала (ω)</text>
  
  <!-- Y-axis Left Title -->
  <text x="40" y="250" font-size="13" font-weight="bold" fill="#1a1a1a" transform="rotate(-90 40,250)" text-anchor="middle">Значення параметрів</text>

  <!-- Grid lines -->
  <line x1="80" y1="250" x2="640" y2="250" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="360" y1="140" x2="360" y2="360" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Data Lines -->
  <!-- Current (I): from (80, 150) to (640, 350) assuming idle current is slightly above 0 -->
  <path d="M 80 150 L 640 350" fill="none" stroke="#2457d6" stroke-width="4"/>
  
  <!-- Back EMF (E): from (80, 360) to (640, 150) -->
  <path d="M 80 360 L 640 150" fill="none" stroke="#27ae60" stroke-width="4"/>
  
  <!-- Heat Power (P = I^2): parabola from (80, 150) to (640, 360) 
       If normalized: y = (1-x)^2.
       x=0 -> y=1 (150). x=0.5 -> y=0.25 (307.5). x=1 -> y=0 (360)
       Let's use a bezier curve: M 80 150 Q 360 360 640 360
       Wait, the true parabola for y=(1-x)^2 has its vertex at x=1, y=0.
       Control point for quadratic bezier from (0,1) to (1,0) with vertex at (1,0) is at intersection of tangents.
       Tangent at x=1 is horizontal (y=0), so passes through (x, 0).
       Tangent at x=0 has slope -2, passing through (0,1).
       Intersection: line y=0 and line y = -2x + 1. So 0 = -2x + 1 => x=0.5, y=0.
       So control point is at x=0.5 (360), y=0 (360 in SVG coordinates).
       So Q 360 360 640 360.
       Wait, let's check: mid point is 0.5 * (80 + 2*360 + 640)/4 = 360.
       Y mid point is 0.5 * (150 + 2*360 + 360)/4 = 307.5.
       Perfect!
  -->
  <path d="M 80 150 Q 360 360 640 350" fill="none" stroke="#c0392b" stroke-width="4" stroke-dasharray="6,4"/>

  <!-- Annotations -->
  <text x="140" y="190" font-size="12" fill="#2457d6" font-weight="bold" text-anchor="start">Струм споживання (Stall Current)</text>
  <text x="160" y="345" font-size="12" fill="#27ae60" font-weight="bold" text-anchor="start">Зворотна ЕРС (Back EMF = 0)</text>
  <text x="210" y="240" font-size="12" fill="#c0392b" font-weight="bold" text-anchor="start">Пікове тепловиділення (I²R)</text>

</svg>