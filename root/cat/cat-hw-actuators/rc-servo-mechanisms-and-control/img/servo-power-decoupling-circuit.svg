<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Схема розділення силових і сигнальних кіл RC-сервоприводу</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Спільне заземлення запобігає збоям ШІМ, а розв'язувальний конденсатор гасить піки струму</text>

  <!-- PANEL 1: MCU (Microcontroller) -->
  <rect x="30" y="75" width="210" height="385" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="135" y="100" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Мікроконтролер (MCU)</text>

  <!-- Inner Chip Graphic -->
  <rect x="50" y="118" width="170" height="175" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="135" y="142" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">ATmega / ESP32 / STM32</text>
  
  <!-- Logic Power Pin -->
  <text x="65" y="234" font-size="12" fill="#6b7280" text-anchor="start">+5V (Логіка)</text>
  
  <!-- MCU Pins -->
  <text x="205" y="194" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">D9 (PWM)</text>
  <circle cx="210" cy="190" r="3.5" fill="#2457d6"/>

  <text x="205" y="274" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">GND</text>
  <circle cx="210" cy="270" r="3.5" fill="#1a1a1a"/>

  <!-- MCU Info Box -->
  <rect x="45" y="308" width="180" height="135" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="55" y="328" font-size="12" font-weight="700" fill="#1a1a1a">Стабільна логіка:</text>
  <text x="55" y="348" font-size="12" fill="#6b7280">• Напруга: 3.3V / 5V</text>
  <text x="55" y="368" font-size="12" fill="#6b7280">• Чутлива до завад</text>
  <text x="55" y="388" font-size="12" fill="#6b7280">  та просідань VCC</text>
  <text x="55" y="413" font-size="12" font-weight="700" fill="#c0392b">! Ризик reset при піках</text>

  <!-- PANEL 2: External Power Supply -->
  <rect x="260" y="310" width="220" height="150" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="370" y="332" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Силове джерело</text>
  <text x="370" y="348" font-size="12" fill="#6b7280" text-anchor="middle">(LiPo / BEC / 5V–7.4V)</text>

  <!-- PSU Box -->
  <rect x="272" y="362" width="196" height="85" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="282" y="388" font-size="12" fill="#6b7280">Струм: 2A–5A (пік)</text>
  <text x="282" y="408" font-size="12" fill="#6b7280">Окреме живлення</text>

  <text x="450" y="375" font-size="12" font-weight="700" fill="#c0392b" text-anchor="end">V+</text>
  <circle cx="460" cy="385" r="3.5" fill="#c0392b"/>

  <text x="450" y="415" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">GND (-)</text>
  <circle cx="460" cy="425" r="3.5" fill="#1a1a1a"/>

  <!-- PANEL 3: Decoupling & Filter Node -->
  <rect x="500" y="75" width="210" height="385" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 4" rx="8"/>
  <text x="605" y="100" font-size="14" font-weight="700" fill="#2457d6" text-anchor="middle">Вузол розв'язки та фільтрів</text>

  <!-- PWM Resistor R_sig -->
  <text x="575" y="172" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">R_sig = 220 Ω</text>
  <rect x="555" y="180" width="40" height="20" fill="#ffffff" stroke="#2457d6" stroke-width="2" rx="2"/>
  <text x="575" y="215" font-size="12" fill="#6b7280" text-anchor="middle">Обмеження струму</text>
  <text x="575" y="230" font-size="12" fill="#6b7280" text-anchor="middle">та згладжування завад</text>

  <!-- Decoupling Capacitor C_dec Info Box -->
  <rect x="510" y="285" width="102" height="100" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="515" y="303" font-size="12" font-weight="700" fill="#27ae60">Функція C_dec:</text>
  <text x="515" y="323" font-size="12" fill="#1a1a1a">• Гасить піки I</text>
  <text x="515" y="343" font-size="12" fill="#1a1a1a">• Тримає V_servo</text>
  <text x="515" y="363" font-size="12" fill="#1a1a1a">• Запобігає</text>
  <text x="515" y="378" font-size="12" fill="#1a1a1a">  Brownout Reset</text>

  <!-- Decoupling Capacitor Graphic -->
  <!-- Vertical wire at x=620 -->
  <line x1="620" y1="270" x2="620" y2="308" stroke="#c0392b" stroke-width="2"/>
  <!-- Top Plate (+) -->
  <line x1="605" y1="308" x2="635" y2="308" stroke="#c0392b" stroke-width="3"/>
  <text x="640" y="308" font-size="12" font-weight="700" fill="#c0392b">+</text>
  <!-- Bottom Plate (-) -->
  <line x1="605" y1="318" x2="635" y2="318" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="620" y1="318" x2="620" y2="425" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Capacitor Labels -->
  <text x="642" y="324" font-size="12" font-weight="700" fill="#27ae60">C_dec</text>
  <text x="642" y="339" font-size="12" font-weight="700" fill="#27ae60">470–1000 µF</text>
  <text x="642" y="354" font-size="12" fill="#6b7280">(Електроліт)</text>
  <text x="642" y="369" font-size="12" fill="#6b7280">+ 100 nF (Кераміка)</text>

  <!-- Star Ground Node -->
  <circle cx="540" cy="425" r="5" fill="#1a1a1a"/>
  <text x="605" y="443" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">★ Спільна точка заземлення</text>
  <text x="605" y="456" font-size="12" fill="#27ae60" text-anchor="middle">(Star Ground Node)</text>

  <!-- PANEL 4: RC Servo Motor -->
  <rect x="730" y="75" width="200" height="385" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="830" y="100" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">RC-Сервопривод</text>
  <text x="830" y="116" font-size="12" fill="#6b7280" text-anchor="middle">(Аналоговий / Цифровий)</text>

  <!-- Terminal Pin Labels Inside Servo -->
  <text x="740" y="185" font-size="12" font-weight="700" fill="#2457d6">PWM (Сигнал)</text>
  <circle cx="730" cy="190" r="3.5" fill="#2457d6"/>

  <text x="740" y="265" font-size="12" font-weight="700" fill="#c0392b">VCC (+Живлення)</text>
  <circle cx="730" cy="270" r="3.5" fill="#c0392b"/>

  <text x="740" y="420" font-size="12" font-weight="700" fill="#1a1a1a">GND (Земля)</text>
  <circle cx="730" cy="425" r="3.5" fill="#1a1a1a"/>

  <!-- Internal Servo Electronics -->
  <rect x="745" y="198" width="170" height="52" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="830" y="218" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Плата керування (драйвер)</text>
  <text x="830" y="236" font-size="12" fill="#6b7280" text-anchor="middle">Порівняння ШІМ &amp; Н-міст</text>

  <!-- Internal Motor & Gearbox -->
  <rect x="745" y="285" width="170" height="115" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="830" y="305" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Колекторний DC-двигун</text>
  <text x="830" y="325" font-size="12" fill="#c0392b" text-anchor="middle">! Джерело індуктивних завад</text>
  <text x="830" y="345" font-size="12" fill="#c0392b" text-anchor="middle">! Пусковий струм заклинення</text>
  <text x="830" y="365" font-size="12" fill="#6b7280" text-anchor="middle">Редуктор + Потенціометр</text>
  <text x="830" y="385" font-size="12" fill="#6b7280" text-anchor="middle">(Зворотний зв'язок)</text>

  <!-- WIRES & WIRES LABELS -->

  <!-- 1. PWM Signal Wire (Blue) -->
  <line x1="210" y1="190" x2="555" y2="190" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="595" y1="190" x2="730" y2="190" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="380" y="178" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Сигнал ШІМ (PWM Signal)</text>

  <!-- 2. Signal GND Wire (Black/Gray) from MCU -->
  <polyline points="210,270 240,270 240,425 540,425" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="248" y="350" font-size="12" fill="#6b7280">GND логіки</text>

  <!-- 3. Power V_servo Wire (Red) -->
  <polyline points="460,385 478,385 478,270 730,270" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-red)"/>
  <circle cx="620" cy="270" r="3.5" fill="#c0392b"/>
  <text x="370" y="258" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Силове живлення V_servo (+5V...7.4V)</text>

  <!-- 4. Power GND Wire (Black) from PSU -->
  <line x1="460" y1="425" x2="540" y2="425" stroke="#1a1a1a" stroke-width="3"/>
  <text x="510" y="415" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">GND</text>

  <!-- 5. Servo GND Wire (Black) from Star Ground to Servo -->
  <line x1="540" y1="425" x2="730" y2="425" stroke="#1a1a1a" stroke-width="3" marker-end="url(#arr-black)"/>
  <circle cx="620" cy="425" r="3.5" fill="#1a1a1a"/>

  <!-- BOTTOM SUMMARY BADGES -->
  <rect x="30" y="475" width="900" height="48" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>

  <rect x="40" y="482" width="435" height="34" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="257" y="503" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">✓ Спільне GND: єдиний опорний рівень напруги для ШІМ-сигналу</text>

  <rect x="485" y="482" width="435" height="34" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="702" y="503" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">⚡ Конденсатор C_dec: згладжує піки струму й запобігає Brownout</text>
</svg>
