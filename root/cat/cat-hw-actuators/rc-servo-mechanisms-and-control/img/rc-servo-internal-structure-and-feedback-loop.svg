<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="530" fill="white"/>

  <!-- Header Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Внутрішня будова та контур зворотного зв'язку RC-сервоприводу</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Плата керування порівнює вхідний ШІМ-сигнал з напругою потенціометра й обертає двигун до усунення помилки</text>

  <!-- Outer Servo Housing Container -->
  <rect x="35" y="85" width="890" height="420" rx="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="50" y="108" font-size="13" font-weight="bold" fill="#6b7280">Корпус сервоприводу</text>

  <!-- 1. DC Motor Block -->
  <rect x="60" y="130" width="260" height="150" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="75" y="155" font-size="14" font-weight="bold" fill="#1a1a1a">1. Електродвигун (DC)</text>

  <!-- Motor Stator / Rotor Graphic -->
  <rect x="75" y="170" width="95" height="95" rx="8" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <rect x="70" y="202.5" width="5" height="30" rx="2" fill="#94a3b8"/>
  <rect x="87" y="182.5" width="71" height="70" rx="4" fill="#e2e8f0" stroke="#64748b" stroke-width="1" stroke-dasharray="4,2"/>
  <circle cx="85" cy="190" r="4" fill="#c0392b"/>
  <circle cx="85" cy="245" r="4" fill="#1a1a1a"/>

  <!-- Motor Details Text -->
  <text x="185" y="185" font-size="12" fill="#475569">Колекторний або</text>
  <text x="185" y="201" font-size="12" fill="#475569">безколекторний</text>
  <text x="185" y="240" font-size="12" font-weight="bold" fill="#2457d6">Швидкість ω_in</text>
  <text x="185" y="256" font-size="12" fill="#6b7280">пропорційна U_out</text>

  <!-- Motor Shaft Line to Gearbox -->
  <line x1="320" y1="205" x2="400" y2="205" stroke="#475569" stroke-width="5"/>
  <text x="360" y="190" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вал двигуна</text>

  <!-- 2. Gearbox Block -->
  <rect x="400" y="130" width="490" height="150" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="415" y="155" font-size="14" font-weight="bold" fill="#1a1a1a">2. Механічний редуктор (шестерні)</text>

  <!-- Gear Graphics -->
  <circle cx="445" cy="205" r="18" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <circle cx="485" cy="185" r="28" fill="#f1f5f9" stroke="#475569" stroke-width="1.5"/>
  <circle cx="485" cy="185" r="14" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <circle cx="560" cy="205" r="38" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <circle cx="560" cy="205" r="12" fill="#2457d6"/>
  <path d="M 550,205 L 570,205 L 595,150 L 575,145 Z" fill="#2457d6" opacity="0.9"/>
  <circle cx="582" cy="160" r="2.5" fill="#ffffff"/>
  <circle cx="586" cy="172" r="2.5" fill="#ffffff"/>

  <!-- Gearbox Text Details -->
  <text x="630" y="182" font-size="12" font-weight="bold" fill="#2457d6">Вихідний вал і качалка</text>
  <text x="630" y="200" font-size="12" fill="#1a1a1a">Кут повороту: θ (0°–180°)</text>
  <text x="630" y="218" font-size="12" fill="#1a1a1a">Передавальне число i &gt;&gt; 1</text>
  <text x="630" y="244" font-size="12" font-weight="bold" fill="#2457d6">Момент M_out = M_in × i</text>
  <text x="630" y="260" font-size="12" fill="#6b7280">Зменшує оберти, росте сила</text>

  <!-- Mechanical Shaft to Potentiometer -->
  <line x1="570" y1="280" x2="570" y2="350" stroke="#27ae60" stroke-width="3" stroke-dasharray="5,3" marker-end="url(#arr-green)"/>
  <text x="582" y="315" font-size="12" font-weight="bold" fill="#27ae60">Механічний зв'язок (Кут θ)</text>

  <!-- 3. Potentiometer Block -->
  <rect x="510" y="350" width="380" height="140" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="525" y="375" font-size="14" font-weight="bold" fill="#27ae60">3. Потенціометр (зворотний зв'язок)</text>

  <!-- Potentiometer Graphic Symbol -->
  <rect x="525" y="390" width="90" height="85" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <path d="M 545,445 A 22 22 0 1 1 585,445" fill="none" stroke="#27ae60" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="565" cy="430" r="5" fill="#27ae60"/>
  <line x1="565" y1="430" x2="577" y2="446" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>
  <line x1="545" y1="445" x2="545" y2="465" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="565" y1="436" x2="565" y2="465" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="585" y1="445" x2="585" y2="465" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Potentiometer Text Details -->
  <text x="630" y="398" font-size="12" font-weight="bold" fill="#1a1a1a">Датчик кутового положення</text>
  <text x="630" y="416" font-size="12" fill="#1a1a1a">Жорстко пов'язаний з валом</text>
  <text x="630" y="440" font-size="12" font-weight="bold" fill="#27ae60">Сигнал: V_fb ∝ θ</text>
  <text x="630" y="458" font-size="12" fill="#6b7280">Перетворює кут повороту</text>
  <text x="630" y="474" font-size="12" fill="#6b7280">у напругу зворотного зв'язку</text>

  <!-- 4. Control Board Block -->
  <rect x="60" y="350" width="370" height="140" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="75" y="375" font-size="14" font-weight="bold" fill="#2457d6">4. Плата керування (Контролер серво)</text>

  <!-- Sub-block 4A: Comparator -->
  <rect x="75" y="390" width="165" height="85" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="85" y="408" font-size="12" font-weight="bold" fill="#1a1a1a">Схема порівняння</text>
  <text x="85" y="426" font-size="12" font-weight="bold" fill="#2457d6">ΔV = V_ref − V_fb</text>
  <text x="85" y="446" font-size="12" fill="#6b7280">Обчислює помилку</text>
  <text x="85" y="462" font-size="12" fill="#6b7280">сигналу кута</text>

  <!-- Arrow Comparator to H-Bridge -->
  <line x1="240" y1="432.5" x2="255" y2="432.5" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>

  <!-- Sub-block 4B: H-Bridge -->
  <rect x="255" y="390" width="160" height="85" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="265" y="408" font-size="12" font-weight="bold" fill="#1a1a1a">Силовий H-міст</text>
  <text x="265" y="426" font-size="12" font-weight="bold" fill="#2457d6">Вихід U_out (DC)</text>
  <text x="265" y="446" font-size="12" fill="#6b7280">Зміна полярності</text>
  <text x="265" y="462" font-size="12" fill="#6b7280">реверсує двигун</text>

  <!-- Input Signal Cable Path & Text -->
  <path d="M 35,320 L 50,320 L 50,432 L 75,432" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <text x="45" y="298" font-size="12" font-weight="bold" fill="#2457d6">Вхідний ШІМ-сигнал</text>
  <text x="45" y="313" font-size="12" fill="#6b7280">1–2 мс (задає V_ref)</text>

  <!-- Motor Control Power Line (H-Bridge to Motor) -->
  <path d="M 335,390 L 335,335 L 300,335 L 300,280" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <text x="345" y="325" font-size="12" font-weight="bold" fill="#2457d6">Живлення U_out</text>
  <text x="345" y="340" font-size="12" fill="#6b7280">(струм двигуна)</text>

  <!-- Feedback Electrical Signal Line (Potentiometer to Comparator) -->
  <path d="M 510,470 L 430,470 L 430,480 L 155,480 L 155,475" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="470" y="455" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">V_fb(θ)</text>
  <text x="290" y="498" font-size="12" fill="#27ae60" text-anchor="middle">Сигнал зворотного зв'язку</text>
</svg>
