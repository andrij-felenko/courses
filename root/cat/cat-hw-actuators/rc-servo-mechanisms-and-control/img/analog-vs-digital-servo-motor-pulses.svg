<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow heads -->
    <marker id="arr-end" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#4b5563"/>
    </marker>
    <marker id="arr-start" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M7,1 L0,4 L7,7 Z" fill="#4b5563"/>
    </marker>
    <marker id="arr-green-end" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L6,3.5 L0,6 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-green-start" markerWidth="7" markerHeight="7" refX="1" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M6,1 L0,3.5 L6,6 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Імпульси живлення двигуна: аналоговий vs цифровий сервопривод</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">При малій помилці Δθ цифровий сервопривод частіше живить двигун, забезпечуючи високий момент</text>

  <!-- LEFT PANEL: Analog Servo -->
  <rect x="30" y="80" width="435" height="435" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Left Header -->
  <rect x="45" y="95" width="405" height="36" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="247" y="118" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Аналоговий сервопривод (50 Гц кадри)</text>

  <!-- Left Key Specs -->
  <rect x="45" y="141" width="405" height="50" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="60" y="161" font-size="12" fill="#1a1a1a">• Сигнал двигуна: 1 імпульс на кадр (50 Гц)</text>
  <text x="60" y="179" font-size="12" fill="#6b7280">• Реакція: затримка до 20 мс при зсуві вала</text>

  <!-- Left Plot Card -->
  <rect x="45" y="203" width="405" height="240" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>

  <!-- Left Dimension Line T=20ms -->
  <text x="250" y="222" font-size="12" fill="#4b5563" text-anchor="middle">Період кадру T = 20 мс (50 Гц)</text>
  <line x1="130" y1="227" x2="370" y2="227" stroke="#4b5563" stroke-width="1.2" marker-start="url(#arr-start)" marker-end="url(#arr-end)"/>
  <line x1="130" y1="227" x2="130" y2="265" stroke="#9ca3af" stroke-dasharray="3,3"/>
  <line x1="370" y1="227" x2="370" y2="265" stroke="#9ca3af" stroke-dasharray="3,3"/>

  <!-- Left Trace 1: Input RC PWM -->
  <text x="60" y="257" font-size="12" font-weight="bold" fill="#2457d6">U_вх (RC)</text>
  <line x1="125" y1="265" x2="430" y2="265" stroke="#d0d7de" stroke-width="1"/>
  <path d="M 125 265 H 130 V 240 H 148 V 265 H 370 V 240 H 388 V 265 H 430" stroke="#2457d6" stroke-width="2" fill="none"/>

  <!-- Left Trace 2: Motor Voltage -->
  <text x="60" y="347" font-size="12" font-weight="bold" fill="#c0392b">U_двиг</text>
  <line x1="125" y1="365" x2="430" y2="365" stroke="#d0d7de" stroke-width="1"/>
  <rect x="130" y="325" width="24" height="40" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <rect x="370" y="325" width="24" height="40" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <path d="M 125 365 H 130 V 325 H 154 V 365 H 370 V 325 H 394 V 365 H 430" stroke="#c0392b" stroke-width="2" fill="none"/>

  <!-- Left Plot Annotations -->
  <text x="142" y="393" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">1 імпульс / 20 мс</text>
  <text x="290" y="393" font-size="12" fill="#6b7280" text-anchor="middle">Пауза ~18 мс (вал м'який)</text>
  <text x="250" y="423" font-size="12" fill="#6b7280" text-anchor="middle">Двигун живиться лише ~10% часу кадру</text>

  <!-- Left Result Badge -->
  <rect x="45" y="455" width="405" height="48" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="247" y="473" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Низький момент утримання (м'який вал)</text>
  <text x="247" y="491" font-size="12" fill="#6b7280" text-anchor="middle">Повільне подолання тертя та мертва зона до 5 мкс</text>


  <!-- RIGHT PANEL: Digital Servo -->
  <rect x="495" y="80" width="435" height="435" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Right Header -->
  <rect x="510" y="95" width="405" height="36" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712" y="118" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Цифровий сервопривод (~300 Гц імпульси)</text>

  <!-- Right Key Specs -->
  <rect x="510" y="141" width="405" height="50" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="525" y="161" font-size="12" fill="#1a1a1a">• Сигнал двигуна: серія імпульсів (~300 Гц)</text>
  <text x="525" y="179" font-size="12" fill="#6b7280">• Реакція: миттєвий відгук (~3.3 мс) при зсуві</text>

  <!-- Right Plot Card -->
  <rect x="510" y="203" width="405" height="240" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>

  <!-- Right Dimension Line T=20ms -->
  <text x="715" y="222" font-size="12" fill="#4b5563" text-anchor="middle">Вхідний кадр T = 20 мс</text>
  <line x1="595" y1="227" x2="835" y2="227" stroke="#4b5563" stroke-width="1.2" marker-start="url(#arr-start)" marker-end="url(#arr-end)"/>
  <line x1="595" y1="227" x2="595" y2="265" stroke="#9ca3af" stroke-dasharray="3,3"/>
  <line x1="835" y1="227" x2="835" y2="265" stroke="#9ca3af" stroke-dasharray="3,3"/>

  <!-- Right Trace 1: Input RC PWM -->
  <text x="525" y="257" font-size="12" font-weight="bold" fill="#2457d6">U_вх (RC)</text>
  <line x1="590" y1="265" x2="895" y2="265" stroke="#d0d7de" stroke-width="1"/>
  <path d="M 590 265 H 595 V 240 H 613 V 265 H 835 V 240 H 853 V 265 H 895" stroke="#2457d6" stroke-width="2" fill="none"/>

  <!-- Right Trace 2: Motor Voltage -->
  <text x="525" y="347" font-size="12" font-weight="bold" fill="#27ae60">U_двиг</text>
  <line x1="590" y1="365" x2="895" y2="365" stroke="#d0d7de" stroke-width="1"/>
  <rect x="595" y="325" width="14" height="40" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <rect x="635" y="325" width="14" height="40" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <rect x="675" y="325" width="14" height="40" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <rect x="715" y="325" width="14" height="40" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <rect x="755" y="325" width="14" height="40" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <rect x="795" y="325" width="14" height="40" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <rect x="835" y="325" width="14" height="40" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <path d="M 590 365 H 595 V 325 H 609 V 365 H 635 V 325 H 649 V 365 H 675 V 325 H 689 V 365 H 715 V 325 H 729 V 365 H 755 V 325 H 769 V 365 H 795 V 325 H 809 V 365 H 835 V 325 H 849 V 365 H 895" stroke="#27ae60" stroke-width="2" fill="none"/>

  <!-- Right Plot Internal T_dig Dimension -->
  <text x="615" y="300" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">T_dig ≈ 3.3 мс</text>
  <line x1="595" y1="307" x2="635" y2="307" stroke="#27ae60" stroke-width="1" marker-start="url(#arr-green-start)" marker-end="url(#arr-green-end)"/>

  <!-- Right Plot Annotations -->
  <text x="715" y="393" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Часті короткі імпульси утримання (~300 Гц)</text>
  <text x="715" y="423" font-size="12" fill="#6b7280" text-anchor="middle">Мотор постійно корегує положення вала</text>

  <!-- Right Result Badge -->
  <rect x="510" y="455" width="405" height="48" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712" y="473" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Високий момент утримання (жорсткий вал)</text>
  <text x="712" y="491" font-size="12" fill="#6b7280" text-anchor="middle">Миттєвий відгук та мала мертва зона (1–2 мкс)</text>
</svg>
