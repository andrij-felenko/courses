<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Definitions for Arrow Markers -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-blue-start" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-gray-start" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">ШІМ-керування та зона нечутливості (Deadband) сервоприводу</text>
  <text x="480" y="54" font-size="13" text-anchor="middle" fill="#6b7280">Зміни імпульсу в межах Δt &lt; DB_w ігноруються контролером, запобігаючи дрижанню вала</text>

  <!-- LEFT PANEL: PWM Waveforms & Deadband Structure -->
  <rect x="30" y="75" width="435" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="45" y="100" font-size="14" font-weight="bold" fill="#1a1a1a">А. ШІМ-сигнал та структура зони Deadband</text>
  <text x="45" y="118" font-size="12" fill="#6b7280">Стандартний сигнал 50 Гц (T = 20 мс, імпульс 1000–2000 мкс)</text>

  <!-- Waveform 1: Overview -->
  <rect x="45" y="130" width="405" height="120" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="145" y="144" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">t_pulse = 1000...2000 мкс</text>
  
  <!-- Pulse Width Dimension Arrow -->
  <line x1="95" y1="148" x2="195" y2="148" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue-start)" marker-end="url(#arr-blue)"/>
  
  <!-- Pulse Waveform Path -->
  <path d="M 55,200 L 95,200 L 95,160 L 195,160 L 195,200 L 435,200" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Period T Dimension Arrow -->
  <line x1="95" y1="200" x2="95" y2="228" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="435" y1="200" x2="435" y2="228" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="95" y1="225" x2="435" y2="225" stroke="#6b7280" stroke-width="1.5" marker-start="url(#arr-gray-start)" marker-end="url(#arr-gray)"/>
  <text x="265" y="244" font-size="12" text-anchor="middle" fill="#6b7280">Період T = 20 мс (50 Гц)</text>

  <!-- Waveform 2: Magnified Deadband Detail -->
  <rect x="45" y="260" width="405" height="225" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="60" y="282" font-size="13" font-weight="bold" fill="#1a1a1a">Збільшено: Спадна межа та вікно Deadband</text>

  <!-- Deadband Zone Shading -->
  <rect x="180" y="300" width="80" height="125" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4" rx="4"/>
  <text x="220" y="296" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">Зона DB_w</text>

  <!-- Center Target Line (t_target) -->
  <line x1="220" y1="300" x2="220" y2="425" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Base Pulse Trailing Edge -->
  <path d="M 60,320 L 220,320 L 220,410 L 265,410" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Pulse t1 (Inside DB) - Red Dashed Line -->
  <path d="M 60,320 L 200,320 L 200,410 L 265,410" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="200" cy="365" r="4" fill="#c0392b"/>

  <!-- Pulse t2 (Outside DB) - Green Dashed Line -->
  <path d="M 60,320 L 285,320 L 285,410 L 435,410" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="285" cy="365" r="4" fill="#27ae60"/>

  <!-- DB Width Dimension Line -->
  <line x1="180" y1="440" x2="260" y2="440" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue-start)" marker-end="url(#arr-blue)"/>
  <text x="220" y="458" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">DB_w = 2...8 мкс</text>

  <!-- Labels on Right of Magnified Area -->
  <text x="275" y="340" font-size="12" font-weight="bold" fill="#c0392b">Імпульс t_1 (у межах DB)</text>
  <text x="275" y="356" font-size="12" fill="#c0392b">|t_1 - t_target| &lt; DB_w / 2</text>

  <text x="275" y="390" font-size="12" font-weight="bold" fill="#27ae60">Імпульс t_2 (поза DB)</text>
  <text x="275" y="406" font-size="12" fill="#27ae60">|t_2 - t_target| &gt; DB_w / 2</text>

  <text x="60" y="475" font-size="12" fill="#6b7280">Примітка: DB_w запобігає реакції на шум таймінгу</text>

  <!-- RIGHT PANEL: Controller Response & Shaft Displacement -->
  <rect x="495" y="75" width="435" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="510" y="100" font-size="14" font-weight="bold" fill="#1a1a1a">Б. Реакція контролера та механічний зсув вала</text>
  <text x="510" y="118" font-size="12" fill="#6b7280">Порівняння обробки сигналу в двох режимах</text>

  <!-- Case 1 Card: Inside Deadband (Red / Neutral) -->
  <rect x="510" y="130" width="405" height="170" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="525" y="152" font-size="13" font-weight="bold" fill="#c0392b">1. Сигнал t_1 у межах DB (Δt &lt; DB_w)</text>

  <!-- Controller Block Case 1 -->
  <rect x="525" y="165" width="150" height="55" rx="4" fill="white" stroke="#c0392b" stroke-width="1"/>
  <text x="600" y="186" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">Помилка e &lt; DB</text>
  <text x="600" y="204" font-size="12" text-anchor="middle" fill="#6b7280">Мотор: ЗНЕСТРУМЛЕНО</text>

  <!-- Arrow Case 1 -->
  <line x1="675" y1="192" x2="735" y2="192" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="705" y="184" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">U = 0 В</text>

  <!-- Servo Shaft Case 1 -->
  <circle cx="810" cy="200" r="28" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <circle cx="810" cy="200" r="6" fill="#1a1a1a"/>
  <line x1="810" y1="200" x2="810" y2="155" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>
  <circle cx="810" cy="155" r="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="810" y="248" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">Δθ = 0° (Без руху)</text>

  <!-- Summary Banner Case 1 -->
  <rect x="525" y="260" width="375" height="28" rx="4" fill="#ffffff" stroke="#f5c6cb" stroke-width="1"/>
  <text x="712" y="278" font-size="12" text-anchor="middle" fill="#c0392b">Результат: Немає посмикувань вала та шумів у редукторі</text>

  <!-- Case 2 Card: Outside Deadband (Green / Active) -->
  <rect x="510" y="315" width="405" height="170" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="525" y="337" font-size="13" font-weight="bold" fill="#27ae60">2. Сигнал t_2 поза межами DB (Δt &gt; DB_w)</text>

  <!-- Controller Block Case 2 -->
  <rect x="525" y="350" width="150" height="55" rx="4" fill="white" stroke="#27ae60" stroke-width="1"/>
  <text x="600" y="371" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Помилка e &gt; DB</text>
  <text x="600" y="389" font-size="12" text-anchor="middle" fill="#6b7280">Мотор: АКТИВОВАНО</text>

  <!-- Arrow Case 2 -->
  <line x1="675" y1="377" x2="735" y2="377" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="705" y="369" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">+U_мотора</text>

  <!-- Servo Shaft Case 2 -->
  <circle cx="810" cy="385" r="28" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
  <circle cx="810" cy="385" r="6" fill="#1a1a1a"/>
  <!-- Original Position (dashed line) -->
  <line x1="810" y1="385" x2="810" y2="340" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
  <!-- Rotated Shaft Horn -->
  <line x1="810" y1="385" x2="836" y2="348" stroke="#27ae60" stroke-width="5" stroke-linecap="round"/>
  <circle cx="836" cy="348" r="3" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <!-- Rotation Arc -->
  <path d="M 810,348 A 37 37 0 0 1 829,355" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="862" y="362" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">+Δθ</text>
  <text x="810" y="433" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Δθ = k · (Δt - DB_w/2)</text>

  <!-- Summary Banner Case 2 -->
  <rect x="525" y="445" width="375" height="28" rx="4" fill="#ffffff" stroke="#c3e6cb" stroke-width="1"/>
  <text x="712" y="463" font-size="12" text-anchor="middle" fill="#27ae60">Результат: Точний поворот вала на новий розрахований кут</text>
</svg>
