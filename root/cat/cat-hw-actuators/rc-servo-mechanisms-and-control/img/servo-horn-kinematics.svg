<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-grey" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-grey-start" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Header -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Кінематика сервоважеля: розкладання сили тяги</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Максимальний момент при θ = 90°; відхилення кута створює паразитне радіальне навантаження</text>

  <!-- Servo Housing -->
  <rect x="30" y="180" width="85" height="160" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="72.5" y="245" text-anchor="middle" font-size="12" fill="#6b7280">Корпус</text>
  <text x="72.5" y="261" text-anchor="middle" font-size="12" fill="#6b7280">сервоприводу</text>

  <!-- Servo Shaft / Hub -->
  <circle cx="175" cy="260" r="24" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <circle cx="175" cy="260" r="14" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="175" cy="260" r="5" fill="#1a1a1a"/>
  <text x="175" y="215" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">O (вісь обертання)</text>

  <!-- Servo Horn Arm -->
  <path d="M 175 248 L 350 254 A 8 8 0 0 1 350 266 L 175 272 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <circle cx="220" cy="260" r="3.5" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="255" cy="260" r="3.5" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="290" cy="260" r="3.5" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="325" cy="260" r="3.5" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="355" cy="260" r="6" fill="white" stroke="#2457d6" stroke-width="2"/>

  <!-- Point P Label -->
  <text x="335" y="284" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">P (точка кріплення)</text>

  <!-- Horizontal Axis Extension -->
  <line x1="355" y1="260" x2="475" y2="260" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Angle Theta Arc & Label -->
  <path d="M 400 260 A 45 45 0 0 0 378.6 221.7" fill="none" stroke="#2457d6" stroke-width="2"/>
  <text x="408" y="238" text-anchor="start" font-size="14" font-weight="bold" fill="#2457d6">θ</text>

  <!-- Pushrod Line -->
  <line x1="355" y1="260" x2="475" y2="65" stroke="#9ca3af" stroke-width="5" stroke-linecap="round"/>
  <circle cx="355" cy="260" r="3" fill="#1a1a1a"/>
  <text x="480" y="85" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">Тяга (pushrod)</text>

  <!-- Vector Box Projections (dashed) -->
  <line x1="355" y1="130" x2="435" y2="130" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="435" y1="260" x2="435" y2="130" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Right Angle Indicator between Horn and F_perp -->
  <path d="M 355 248 L 343 248 L 343 260" fill="none" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Perpendicular Force Vector F_perp (Green) -->
  <line x1="355" y1="260" x2="355" y2="130" stroke="#27ae60" stroke-width="3" marker-end="url(#arr-green)"/>
  <text x="342" y="185" text-anchor="end" font-size="13" font-weight="bold" fill="#27ae60">F⊥ = F · sin(θ)</text>
  <text x="342" y="201" text-anchor="end" font-size="12" fill="#27ae60">(корисна сила)</text>

  <!-- Radial Force Vector F_parallel (Red) -->
  <line x1="355" y1="260" x2="435" y2="260" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-red)"/>
  <text x="440" y="285" text-anchor="start" font-size="13" font-weight="bold" fill="#c0392b">F∥ = F · cos(θ)</text>
  <text x="440" y="301" text-anchor="start" font-size="12" fill="#c0392b">(радіальне зусилля)</text>

  <!-- Total Force Vector F (Blue) -->
  <line x1="355" y1="260" x2="435" y2="130" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>
  <text x="448" y="125" text-anchor="start" font-size="13" font-weight="bold" fill="#2457d6">F (повне зусилля)</text>

  <!-- Dimension line for Horn Radius r -->
  <line x1="175" y1="292" x2="175" y2="365" stroke="#d0d7de" stroke-dasharray="3 3"/>
  <line x1="355" y1="292" x2="355" y2="365" stroke="#d0d7de" stroke-dasharray="3 3"/>
  <line x1="175" y1="345" x2="355" y2="345" stroke="#6b7280" stroke-width="1.5" marker-start="url(#arr-grey-start)" marker-end="url(#arr-grey)"/>
  <text x="265" y="338" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">r (плече важеля)</text>
  <text x="265" y="362" text-anchor="middle" font-size="12" fill="#6b7280">відстань O → P</text>

  <!-- Bottom Formula Card -->
  <rect x="30" y="395" width="540" height="65" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="50" y="420" text-anchor="start" font-size="13" font-weight="bold" fill="#1a1a1a">Підсумковий крутний момент:  τ = r · F · sin(θ)</text>
  <text x="50" y="442" text-anchor="start" font-size="12" fill="#6b7280">r — плече важеля,  F — сила на тязі,  θ — кут між важелем і тягою</text>

  <!-- Right Side Analytical Panels -->
  <!-- Panel 1: Useful Torque -->
  <rect x="600" y="80" width="330" height="115" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="615" y="104" font-size="13" font-weight="bold" fill="#27ae60">1. Корисний крутний момент (τ)</text>
  <text x="615" y="126" font-size="12" font-weight="bold" fill="#1a1a1a">• τ = r · F⊥ = r · F · sin(θ)</text>
  <text x="615" y="144" font-size="12" fill="#1a1a1a">• Максимум τ при θ = 90° (sin 90° = 1)</text>
  <text x="615" y="162" font-size="12" fill="#6b7280">• Створює обертальний рух важеля</text>

  <!-- Panel 2: Parasitic Load -->
  <rect x="600" y="210" width="330" height="115" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="615" y="234" font-size="13" font-weight="bold" fill="#c0392b">2. Паразитне навантаження (F∥)</text>
  <text x="615" y="256" font-size="12" font-weight="bold" fill="#1a1a1a">• F∥ = F · cos(θ)</text>
  <text x="615" y="274" font-size="12" fill="#1a1a1a">• Спрямована вздовж важеля до/від осі</text>
  <text x="615" y="292" font-size="12" fill="#6b7280">• Викликає люфт та знос вала й втулок</text>

  <!-- Panel 3: Design Rules -->
  <rect x="600" y="340" width="330" height="120" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="615" y="364" font-size="13" font-weight="bold" fill="#2457d6">3. Правило проектування</text>
  <text x="615" y="386" font-size="12" fill="#1a1a1a">• У нейтральному положенні θ ≈ 90°</text>
  <text x="615" y="404" font-size="12" fill="#1a1a1a">• При θ &lt; 45° втрати зусилля &gt; 29%</text>
  <text x="615" y="422" font-size="12" fill="#6b7280">• Довше плече r збільшує хід, але</text>
  <text x="615" y="438" font-size="12" fill="#6b7280">  зменшує передане корисне зусилля</text>
</svg>
