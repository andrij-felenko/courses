<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1000" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="500.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle" font-weight="700">Родовід самограйного кольорового світлодіода: як автомат переселявся в корпус LED</text>
<line x1="90.0" y1="92.0" x2="910.0" y2="92.0" stroke="#1a1a1a" stroke-width="2.2"/>
<text x="914.0" y="97.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start" font-weight="700">час</text>
<line x1="139.2" y1="84.0" x2="139.2" y2="100.0" stroke="#c0392b" stroke-width="2.4"/>
<circle cx="139.2" cy="92.0" r="5.0" fill="#ffffff" stroke="#c0392b" stroke-width="2.4"/>
<text x="139.2" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">1975</text>
<text x="139.2" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">LM3909</text>
<line x1="368.8" y1="84.0" x2="368.8" y2="100.0" stroke="#b8860b" stroke-width="2.4"/>
<circle cx="368.8" cy="92.0" r="5.0" fill="#ffffff" stroke="#b8860b" stroke-width="2.4"/>
<text x="368.8" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#b8860b" text-anchor="middle" font-weight="700">кін. 1970-х</text>
<text x="368.8" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">флешер У КОРПУСІ</text>
<line x1="606.6" y1="84.0" x2="606.6" y2="100.0" stroke="#27ae60" stroke-width="2.4"/>
<circle cx="606.6" cy="92.0" r="5.0" fill="#ffffff" stroke="#27ae60" stroke-width="2.4"/>
<text x="606.6" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="700">1990–2000-і</text>
<text x="606.6" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">RGB-самограй</text>
<line x1="828.0" y1="84.0" x2="828.0" y2="100.0" stroke="#2457d6" stroke-width="2.4"/>
<circle cx="828.0" cy="92.0" r="5.0" fill="#ffffff" stroke="#2457d6" stroke-width="2.4"/>
<text x="828.0" y="74.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">2013</text>
<text x="828.0" y="58.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">WS2812</text>
<line x1="137.0" y1="100.0" x2="137.0" y2="140.0" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="3,3"/>
<rect x="30.0" y="140.0" width="214.0" height="356.0" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="44.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">National Semiconductor,</text>
<text x="44.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">монолітний флешер.</text>
<text x="44.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Автомат — окрема</text>
<text x="44.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">мікросхема (8 ніжок).</text>
<text x="44.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Ще НЕ в корпусі LED:</text>
<text x="44.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">поряд треба LED,</text>
<text x="44.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">конденсатор, батарея.</text>
<text x="44.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Один колір, миготіння.</text>
<text x="137.0" y="482.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">самограй</text>
<line x1="375.0" y1="100.0" x2="375.0" y2="140.0" stroke="#b8860b" stroke-width="1.4" stroke-dasharray="3,3"/>
<rect x="268.0" y="140.0" width="214.0" height="356.0" rx="12" fill="#fffaf0" stroke="#b8860b" stroke-width="2.0"/>
<text x="282.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Здешевлення КМОН.</text>
<text x="282.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Крихітний автомат</text>
<text x="282.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">переїхав ПІД лінзу</text>
<text x="282.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">самого світлодіода.</text>
<text x="282.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Зовні — дві ноги,</text>
<text x="282.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">як у звичайного LED.</text>
<text x="282.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Один колір; це предок</text>
<text x="282.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">самограйного вогника.</text>
<text x="375.0" y="482.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">самограй</text>
<line x1="619.0" y1="100.0" x2="619.0" y2="140.0" stroke="#27ae60" stroke-width="1.4" stroke-dasharray="3,3"/>
<rect x="512.0" y="140.0" width="214.0" height="356.0" rx="12" fill="#f0faf3" stroke="#27ae60" stroke-width="2.0"/>
<text x="526.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Три кристали R·G·B</text>
<text x="526.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">+ генератор + лічильник</text>
<text x="526.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">+ струмові ключі —</text>
<text x="526.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">усе в одному корпусі.</text>
<text x="526.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Сам перебирає ~7</text>
<text x="526.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">кольорів по колу.</text>
<text x="526.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Копійки; масово: іграшки,</text>
<text x="526.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">гірлянди, набори (KY-034).</text>
<text x="619.0" y="482.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">самограй</text>
<line x1="863.0" y1="100.0" x2="863.0" y2="140.0" stroke="#2457d6" stroke-width="1.4" stroke-dasharray="3,3"/>
<rect x="756.0" y="140.0" width="214.0" height="356.0" rx="12" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/>
<text x="770.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">WorldSemi: у корпус</text>
<text x="770.0" y="196.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">додано ВХІД ДАНИХ.</text>
<text x="770.0" y="222.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Кожному пікселю —</text>
<text x="770.0" y="248.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">24-бітний код кольору</text>
<text x="770.0" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">по одному дроту;</text>
<text x="770.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">решту передає далі.</text>
<text x="770.0" y="326.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">Це вже НЕ самограй:</text>
<text x="770.0" y="352.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="start">керований, каскадований.</text>
<text x="863.0" y="482.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle" font-style="italic">керований по шині</text>
<rect x="175.8" y="519.9" width="648.4" height="44.1" rx="6" fill="#f7f9fc" stroke="#1a1a1a" stroke-width="1.5"/><text x="500.0" y="538.8" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="500.0" dy="0.0">Ліворуч направо автомат дешевшає й переселяється в корпус LED (частка 1–3 — самограй, нуль команд).</tspan><tspan x="500.0" dy="13.7">Праворуч — інша гілка: WS2812 лишає автомат у корпусі, але додає вхід даних — і це вже керований піксель.</tspan></text>
</svg>