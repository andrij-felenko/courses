<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="300" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один такт loop(): від піна S до яскравості L</text><rect x="70.0" y="90.0" width="150.0" height="96.0" rx="10" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/><text x="145.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#2457d6" text-anchor="middle" font-weight="700">1. Читаємо</text><text x="145.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">digitalRead(A), (B)</text><text x="145.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">сирі рівні S</text><text x="145.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(брязкіт!)</text><rect x="270.0" y="90.0" width="150.0" height="96.0" rx="10" fill="#ffffff" stroke="#27ae60" stroke-width="1.8"/><text x="345.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">2. Гасимо</text><text x="345.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">брязкіт:</text><text x="345.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">стабільно 25 мс</text><text x="345.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">→ чистий стан</text><rect x="470.0" y="90.0" width="150.0" height="96.0" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.8"/><text x="545.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">3. Рухаємо</text><text x="545.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">нахил A → level+</text><text x="545.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">нахил B → level−</text><text x="545.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">по 1 за такт</text><rect x="670.0" y="90.0" width="150.0" height="96.0" rx="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="745.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">4. Виводимо</text><text x="745.0" y="136.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">A = level</text><text x="745.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">B = 255 − level</text><text x="745.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">analogWrite(~)</text><line x1="220" y1="138" x2="268" y2="138" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="420" y1="138" x2="468" y2="138" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><line x1="620" y1="138" x2="668" y2="138" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M745 186 L745 236 L145 236 L145 186" fill="none" stroke="#6b7280" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="445.0" y="254.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">наступний такт loop() — за ~4 мс (крок посування рівня)</text>
</svg>