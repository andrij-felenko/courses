<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="820" height="520" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="410.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Один нахил — два способи замкнути коло</text><text x="220.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#c0392b" text-anchor="middle" font-weight="700">ртутний вимикач</text><rect x="153.0" y="108.0" width="134.0" height="44.0" rx="22" fill="#eef1f4" stroke="#1a1a1a" stroke-width="1.6"/><line x1="153.0" y1="121.0" x2="187.0" y2="121.0" stroke="#1a1a1a" stroke-width="2.2"/><line x1="153.0" y1="139.0" x2="187.0" y2="139.0" stroke="#1a1a1a" stroke-width="2.2"/><path d="M157.0 148.0 Q 157.0 122.0 190.0 120.0 L 222.0 126.0 Q 234.0 138.0 234.0 148.0 z" fill="#8a8f98"/><line x1="169.0" y1="154.0" x2="169.0" y2="180.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/><text x="199.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">низький кінець</text><rect x="112.8" y="182.3" width="214.4" height="45.3" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="220.0" y="201.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="220.0" dy="0.0">крапля ртуті стікає на контакти</tspan><tspan x="220.0" dy="14.3">і ЗМОЧУЄ їх → замкнено</tspan></text><text x="600.0" y="70.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">кульковий вимикач</text><rect x="533.0" y="108.0" width="134.0" height="44.0" rx="22" fill="#eef1f4" stroke="#1a1a1a" stroke-width="1.6"/><line x1="533.0" y1="121.0" x2="567.0" y2="121.0" stroke="#1a1a1a" stroke-width="2.2"/><line x1="533.0" y1="139.0" x2="567.0" y2="139.0" stroke="#1a1a1a" stroke-width="2.2"/><circle cx="555.0" cy="130.0" r="13.0" fill="#5a6270" stroke="#1a1a1a" stroke-width="1.4"/><circle cx="551.0" cy="126.0" r="4" fill="#cfd4da"/><line x1="549.0" y1="154.0" x2="549.0" y2="180.0" stroke="#6b7280" stroke-width="1.6" marker-end="url(#arrow)"/><text x="579.0" y="170.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="start">низький кінець</text><rect x="483.4" y="182.3" width="233.2" height="45.3" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/><text x="600.0" y="201.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="600.0" dy="0.0">тверда кулька котиться на контакти</tspan><tspan x="600.0" dy="14.3">й ТОРКАЄТЬСЯ їх → замкнено</tspan></text><line x1="60.0" y1="258.0" x2="760.0" y2="258.0" stroke="#6b7280" stroke-width="1.0" stroke-dasharray="4 4"/><text x="410.0" y="286.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">а що бачить мікроконтролер у мить замикання?</text><text x="220.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">рідина не рветься —</text><text x="220.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle">різкий, чистий фронт</text><line x1="130.0" y1="356.0" x2="214.0" y2="356.0" stroke="#1a1a1a" stroke-width="2.0"/><line x1="214.0" y1="356.0" x2="214.0" y2="400.0" stroke="#1a1a1a" stroke-width="2.0"/><line x1="214.0" y1="400.0" x2="306.0" y2="400.0" stroke="#1a1a1a" stroke-width="2.0"/><text x="170.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1</text><text x="280.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">0</text><text x="600.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">тверді поверхні відскакують —</text><text x="600.0" y="338.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle">коротка «пилка», тоді спокій</text><line x1="470.0" y1="356.0" x2="540.0" y2="356.0" stroke="#1a1a1a" stroke-width="2.0"/><path d="M540.0 356.0 L540.0 400.0 L540.0 400.0 L551.0 364.0 L562.0 400.0 L573.0 370.0 L584.0 400.0 L595.0 376.0 L606.0 400.0" fill="none" stroke="#1a1a1a" stroke-width="2"/><line x1="606.0" y1="400.0" x2="676.0" y2="400.0" stroke="#1a1a1a" stroke-width="2.0"/><text x="504.0" y="348.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">1</text><text x="570.0" y="415.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">брязкіт</text><rect x="193.1" y="457.4" width="433.8" height="45.3" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/><text x="410.0" y="476.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="410.0" dy="0.0">Ртуть замикала безшумно й без брязкоту — тому її колись і ставили.</tspan><tspan x="410.0" dy="14.3">Кулька дешевша й безпечніша, та брязкіт доводиться гасити в коді.</tspan></text>
</svg>