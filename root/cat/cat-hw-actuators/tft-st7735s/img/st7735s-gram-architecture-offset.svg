<svg viewBox="0 0 960 560" width="960" height="560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="560" fill="white"/>
  
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Архітектура GRAM 132x162 та апаратний зсув</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Проекція фізичної матриці 128x160 у пам'ять ST7735S</text>

  <!-- GRAM Box 132x162 -->
  <rect x="250" y="100" width="396" height="405" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
  <text x="640" y="475" font-size="16" fill="#1a1a1a" font-weight="bold" text-anchor="end">GRAM (132 × 162 пікселів)</text>
  
  <!-- Active Area Box 128x160 with offsets (e.g. OffsetX=2, OffsetY=1) -->
  <rect x="270" y="120" width="360" height="375" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="450" y="225" font-size="16" fill="#2457d6" font-weight="bold" text-anchor="middle">Фізична матриця екрана</text>
  <text x="450" y="250" font-size="14" fill="#2457d6" font-weight="bold" text-anchor="middle">(128 × 160 пікселів)</text>

  <!-- Offsets -->
  <line x1="250" y1="140" x2="270" y2="140" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)" marker-start="url(#arr-red)"/>
  <text x="230" y="145" font-size="13" fill="#c0392b" text-anchor="end">Offset X</text>
  
  <line x1="300" y1="100" x2="300" y2="120" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)" marker-start="url(#arr-red)"/>
  <text x="290" y="115" font-size="13" fill="#c0392b" text-anchor="end">Offset Y</text>
  
  <!-- Coordinates -->
  <text x="245" y="90" font-size="12" fill="#1a1a1a" text-anchor="end">GRAM (0,0)</text>
  <text x="650" y="525" font-size="12" fill="#1a1a1a" text-anchor="start">GRAM (131,161)</text>
  
  <circle cx="250" cy="100" r="4" fill="#1a1a1a"/>
  <circle cx="646" cy="505" r="4" fill="#1a1a1a"/>
  
  <text x="275" y="135" font-size="12" fill="#2457d6" text-anchor="start">Вікно (0,0)</text>
  <circle cx="270" cy="120" r="4" fill="#2457d6"/>

  <text x="635" y="490" font-size="12" fill="#2457d6" text-anchor="end">Вікно (127,159)</text>
  <circle cx="630" cy="495" r="4" fill="#2457d6"/>
  
  <!-- Right side description -->
  <text x="680" y="160" font-size="14" fill="#1a1a1a" font-weight="bold">Апаратний зсув координат:</text>
  <text x="680" y="180" font-size="13" fill="#1a1a1a">XS_real = XS + OffsetX</text>
  <text x="680" y="200" font-size="13" fill="#1a1a1a">XE_real = XE + OffsetX</text>
  <text x="680" y="220" font-size="13" fill="#1a1a1a">YS_real = YS + OffsetY</text>
  <text x="680" y="240" font-size="13" fill="#1a1a1a">YE_real = YE + OffsetY</text>

  <rect x="680" y="260" width="220" height="70" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="690" y="280" font-size="12" fill="#c0392b" font-weight="bold">Увага:</text>
  <text x="690" y="300" font-size="12" fill="#c0392b">Якщо не врахувати зсув,</text>
  <text x="690" y="315" font-size="12" fill="#c0392b">зображення "з'їде", а на</text>
  <text x="690" y="330" font-size="12" fill="#c0392b">краях з'явиться сміття.</text>
</svg>