<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" width="960" height="570" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="570" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Логіка керування H-мостом та інтерфейс дискретних MOSFET</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Міжблочне блокування (Interlock) та dead-time запобігають наскрізним струмам короткого замикання</text>

  <!-- PANEL 1: IC Internal Control Logic -->
  <rect x="25" y="75" width="270" height="370" fill="#f4f6f8" stroke="#d0d7de" rx="8"/>
  <rect x="35" y="85" width="250" height="30" fill="#eaf0fd" stroke="#2457d6" rx="4"/>
  <text x="160" y="105" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Внутрішня логіка IC</text>

  <!-- Inputs from Discriminator -->
  <text x="40" y="132" font-size="11" fill="#1a1a1a">Вхід CW (Вперед)</text>
  <rect x="40" y="140" width="70" height="26" fill="#ffffff" stroke="#2457d6" rx="3"/>
  <text x="75" y="157" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="middle">CW [HIGH]</text>
  <path d="M110,153 L125,153" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <text x="40" y="202" font-size="11" fill="#1a1a1a">Вхід CCW (Назад)</text>
  <rect x="40" y="210" width="70" height="26" fill="#ffffff" stroke="#6b7280" rx="3"/>
  <text x="75" y="227" font-size="10" fill="#6b7280" text-anchor="middle">CCW [LOW]</text>
  <path d="M110,223 L125,223" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Interlock & Dead-Time Logic Block -->
  <rect x="125" y="130" width="160" height="300" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="205" y="150" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Логіка Interlock</text>
  <text x="205" y="165" font-size="10" fill="#6b7280" text-anchor="middle">та захисту від KЗ</text>

  <rect x="135" y="180" width="140" height="50" fill="#e9f7ef" stroke="#27ae60" rx="4"/>
  <text x="205" y="198" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Перехресне блокування</text>
  <text x="205" y="216" font-size="10" fill="#1a1a1a" text-anchor="middle">Q1+Q2 / Q3+Q4 = OFF</text>

  <rect x="135" y="240" width="140" height="50" fill="#eaf0fd" stroke="#2457d6" rx="4"/>
  <text x="205" y="258" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Таймер Dead-Time</text>
  <text x="205" y="276" font-size="10" fill="#6b7280" text-anchor="middle">Пауза t_dead (3..10 мкс)</text>

  <text x="205" y="310" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Виходи на драйвери:</text>
  <text x="205" y="330" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">g1: Active LOW [ON]</text>
  <text x="205" y="350" font-size="10" fill="#6b7280" text-anchor="middle">g3: HIGH [OFF]</text>
  <text x="205" y="370" font-size="10" fill="#6b7280" text-anchor="middle">g2: LOW [OFF]</text>
  <text x="205" y="390" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">g4: Active HIGH [ON]</text>

  <!-- PANEL 2: Output Drivers & IC Interface Pins -->
  <rect x="310" y="75" width="235" height="370" fill="#f4f6f8" stroke="#d0d7de" rx="8"/>
  <rect x="320" y="85" width="215" height="30" fill="#eaf0fd" stroke="#2457d6" rx="4"/>
  <text x="427" y="105" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Вихідні драйвери IC</text>

  <line x1="535" y1="80" x2="535" y2="440" stroke="#6b7280" stroke-dasharray="4,4" stroke-width="1.5"/>
  <text x="530" y="98" font-size="10" fill="#6b7280" text-anchor="end">Межа IC</text>

  <!-- Driver P1 -->
  <path d="M285,155 L335,155" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="335" y="140" width="70" height="30" fill="#ffffff" stroke="#2457d6" rx="4"/>
  <text x="370" y="159" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="middle">DRV P1</text>
  <path d="M405,155 L525,155" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="525" cy="155" r="4" fill="#2457d6"/>
  <text x="518" y="148" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="end">OUT_P1</text>

  <!-- Driver P2 -->
  <path d="M285,215 L335,215" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="335" y="200" width="70" height="30" fill="#ffffff" stroke="#6b7280" rx="4"/>
  <text x="370" y="219" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="middle">DRV P2</text>
  <path d="M405,215 L525,215" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="525" cy="215" r="4" fill="#6b7280"/>
  <text x="518" y="208" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="end">OUT_P2</text>

  <!-- Driver N1 -->
  <path d="M285,295 L335,295" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="335" y="280" width="70" height="30" fill="#ffffff" stroke="#6b7280" rx="4"/>
  <text x="370" y="299" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="middle">DRV N1</text>
  <path d="M405,295 L525,295" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="525" cy="295" r="4" fill="#6b7280"/>
  <text x="518" y="288" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="end">OUT_N1</text>

  <!-- Driver N2 -->
  <path d="M285,355 L335,355" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="335" y="340" width="70" height="30" fill="#ffffff" stroke="#2457d6" rx="4"/>
  <text x="370" y="359" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="middle">DRV N2</text>
  <path d="M405,355 L525,355" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="525" cy="355" r="4" fill="#2457d6"/>
  <text x="518" y="348" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="end">OUT_N2</text>

  <!-- PANEL 3: Power H-Bridge Stage -->
  <rect x="560" y="75" width="375" height="370" fill="#f4f6f8" stroke="#d0d7de" rx="8"/>
  <rect x="570" y="85" width="355" height="30" fill="#eaf0fd" stroke="#2457d6" rx="4"/>
  <text x="747" y="105" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Силовий H-міст (Дискретні MOSFET)</text>

  <!-- Power Rails -->
  <text x="747" y="130" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">+V_MOTOR (Силове живлення)</text>
  <line x1="620" y1="138" x2="900" y2="138" stroke="#c0392b" stroke-width="3"/>

  <line x1="620" y1="412" x2="900" y2="412" stroke="#1a1a1a" stroke-width="3"/>
  <text x="747" y="428" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GND (Силова земля)</text>

  <!-- Q1 (P-FET, Active ON) -->
  <line x1="645" y1="138" x2="645" y2="150" stroke="#27ae60" stroke-width="2.5"/>
  <rect x="615" y="150" width="60" height="46" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="4"/>
  <text x="645" y="168" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Q1 [ON]</text>
  <text x="645" y="184" font-size="10" fill="#6b7280" text-anchor="middle">P-Channel</text>

  <!-- Q3 (P-FET, OFF) -->
  <line x1="875" y1="138" x2="875" y2="150" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="845" y="150" width="60" height="46" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" rx="4"/>
  <text x="875" y="168" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Q3 [OFF]</text>
  <text x="875" y="184" font-size="10" fill="#6b7280" text-anchor="middle">P-Channel</text>

  <!-- Q2 (N-FET, OFF) -->
  <rect x="615" y="310" width="60" height="46" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" rx="4"/>
  <text x="645" y="328" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Q2 [OFF]</text>
  <text x="645" y="344" font-size="10" fill="#6b7280" text-anchor="middle">N-Channel</text>
  <line x1="645" y1="356" x2="645" y2="412" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Q4 (N-FET, Active ON) -->
  <rect x="845" y="310" width="60" height="46" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="4"/>
  <text x="875" y="328" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Q4 [ON]</text>
  <text x="875" y="344" font-size="10" fill="#6b7280" text-anchor="middle">N-Channel</text>
  <line x1="875" y1="356" x2="875" y2="412" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Nodes & Motor -->
  <line x1="645" y1="196" x2="645" y2="310" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="645" cy="250" r="4.5" fill="#1a1a1a"/>
  <text x="605" y="254" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="end">Вузол A</text>

  <line x1="875" y1="196" x2="875" y2="310" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="875" cy="250" r="4.5" fill="#1a1a1a"/>
  <text x="885" y="254" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="start">Вузол B</text>

  <line x1="645" y1="250" x2="734" y2="250" stroke="#27ae60" stroke-width="2.5"/>
  <line x1="786" y1="250" x2="875" y2="250" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="760" cy="250" r="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="760" y="246" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">M</text>
  <text x="760" y="261" font-size="10" fill="#6b7280" text-anchor="middle">Двигун</text>

  <path d="M660,232 L720,232" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,2" marker-end="url(#arr-green)"/>
  <text x="690" y="226" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">Струм I_M</text>

  <!-- Gate Routing Lines -->
  <path d="M525,155 L615,155" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M525,215 L545,215 L545,120 L820,120 L820,155 L845,155" stroke="#6b7280" stroke-width="1.5" fill="none"/>
  <path d="M525,295 L555,295 L555,325 L615,325" stroke="#6b7280" stroke-width="1.5" fill="none"/>
  <path d="M525,355 L545,355 L545,435 L820,435 L820,325 L845,325" stroke="#2457d6" stroke-width="1.5" fill="none" marker-end="url(#arr-blue)"/>

  <!-- PANEL 4: Bottom Comparison / Safety Panel -->
  <rect x="25" y="460" width="910" height="85" fill="#f4f6f8" stroke="#d0d7de" rx="8"/>

  <rect x="40" y="472" width="430" height="61" fill="#fdecea" stroke="#c0392b" rx="6"/>
  <rect x="50" y="480" width="115" height="20" fill="#c0392b" rx="3"/>
  <text x="107.5" y="494" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">БЕЗ DEAD-TIME</text>
  <text x="175" y="494" font-size="11" font-weight="bold" fill="#c0392b">Коротке замикання (Shoot-Through)</text>
  <text x="175" y="514" font-size="10" fill="#1a1a1a">Одночасне вмикання Q1+Q2 або Q3+Q4 викликає пробій</text>

  <rect x="490" y="472" width="435" height="61" fill="#e9f7ef" stroke="#27ae60" rx="6"/>
  <rect x="500" y="480" width="105" height="20" fill="#27ae60" rx="3"/>
  <text x="552.5" y="494" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">З INTERLOCK</text>
  <text x="615" y="494" font-size="11" font-weight="bold" fill="#27ae60">Захист Interlock + Dead-Time</text>
  <text x="615" y="514" font-size="10" fill="#1a1a1a">Пауза t_dead (3...10 мкс) усуває наскрізний струм</text>
</svg>
