<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Маркери стрілок -->
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Характеристика дискримінатора: зона спокою та пороги компараторів</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">При |Δt| &lt; t_db H-міст знеструмлений (0 В); при |Δt| &gt; t_db вихідна напруга зростає до ±V_cc</text>

  <!-- ЛІВА ПАНЕЛЬ: Графік залежності -->
  <rect x="30" y="80" width="585" height="435" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="322.5" y="103" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Залежність напруги на моторі V_motor від різниці імпульсів Δt</text>

  <!-- Внутрішнє поле графіка -->
  <rect x="95" y="120" width="490" height="340" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>

  <!-- Зона спокою (Deadband Rect) -->
  <rect x="295" y="145" width="90" height="290" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Текст всередині зони спокою -->
  <text x="340" y="165" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Зона спокою</text>
  <text x="340" y="182" font-size="12" fill="#2457d6" text-anchor="middle">|Δt| &lt; t_db</text>
  <text x="340" y="199" font-size="12" fill="#6b7280" text-anchor="middle">(3...10 мкс)</text>
  <text x="340" y="222" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">H-міст: OFF</text>

  <!-- Горизонтальні пунктирні рівні насичення -->
  <!-- +V_cc рівень на правому боці (Δt > 0) -->
  <line x1="340" y1="175" x2="575" y2="175" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- -V_cc рівень на лівому боці (Δt < 0) -->
  <line x1="105" y1="405" x2="340" y2="405" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Вертикальні пунктирні лінії точок перегину -->
  <!-- -t_sat: від X-осі (290) до нижнього перегину (405) -->
  <line x1="185" y1="290" x2="185" y2="405" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- +t_sat: від верхнього перегину (175) до X-осі (290) -->
  <line x1="495" y1="175" x2="495" y2="290" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Пунктирні засічки до позначок осей -->
  <line x1="185" y1="435" x2="185" y2="445" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="495" y1="435" x2="495" y2="445" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Координатні осі (з розривом Y-осі в зоні тексту заголовка зони спокою) -->
  <line x1="110" y1="290" x2="565" y2="290" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <!-- Верхній відрізок Y-осі зі стрілкою -->
  <line x1="340" y1="150" x2="340" y2="135" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <!-- Нижній відрізок Y-осі -->
  <line x1="340" y1="445" x2="340" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Підписи осей -->
  <text x="565" y="280" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Δt (мкс)</text>
  <text x="348" y="135" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">V_motor (В)</text>

  <!-- Позначки рівнів на осі Y -->
  <text x="565" y="165" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">+V_cc (CW)</text>
  <text x="332" y="304" font-size="12" fill="#6b7280" text-anchor="end">0 В</text>
  <text x="115" y="425" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">-V_cc (CCW)</text>

  <!-- Позначки рівнів на осі X -->
  <text x="185" y="452" font-size="12" fill="#1a1a1a" text-anchor="middle">-t_sat</text>
  <text x="295" y="452" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">-t_db</text>
  <text x="340" y="452" font-size="12" fill="#1a1a1a" text-anchor="middle">0</text>
  <text x="385" y="452" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">+t_db</text>
  <text x="495" y="452" font-size="12" fill="#1a1a1a" text-anchor="middle">+t_sat</text>

  <!-- Передавальна характеристика (синя крива) -->
  <path d="M 120,405 L 185,405 L 295,290 L 385,290 L 495,175 L 560,175" stroke="#2457d6" stroke-width="3" fill="none"/>

  <!-- Точки перегину характеристики -->
  <circle cx="185" cy="405" r="4" fill="#2457d6"/>
  <circle cx="295" cy="290" r="4" fill="#2457d6"/>
  <circle cx="385" cy="290" r="4" fill="#2457d6"/>
  <circle cx="495" cy="175" r="4" fill="#2457d6"/>

  <!-- Виносні блоки пояснень на графіку -->
  <!-- Блок насичення CCW (угорі ліворуч) -->
  <rect x="115" y="135" width="170" height="68" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="200" y="154" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Насичення H-моста (CCW)</text>
  <text x="200" y="172" font-size="12" fill="#1a1a1a" text-anchor="middle">V_out = -V_cc (100% ШІМ)</text>
  <text x="200" y="190" font-size="12" fill="#6b7280" text-anchor="middle">Макс. швидкість назад</text>

  <!-- Блок насичення CW (унизу праворуч) -->
  <rect x="395" y="350" width="170" height="68" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="480" y="369" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Насичення H-моста (CW)</text>
  <text x="480" y="387" font-size="12" fill="#1a1a1a" text-anchor="middle">V_out = +V_cc (100% ШІМ)</text>
  <text x="480" y="405" font-size="12" fill="#6b7280" text-anchor="middle">Макс. швидкість вперед</text>

  <!-- Підписи лінійних зон (розміщені у вільних областях без перетинів з лініями) -->
  <!-- Ліва лінійна зона (над похилою ділянкою CCW) -->
  <text x="240" y="250" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Лінійна зона ШІМ</text>
  <text x="240" y="266" font-size="12" fill="#6b7280" text-anchor="middle">V_motor ∝ -Δt</text>

  <!-- Права лінійна зона (під похилою ділянкою CW) -->
  <text x="440" y="315" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Лінійна зона ШІМ</text>
  <text x="440" y="331" font-size="12" fill="#6b7280" text-anchor="middle">V_motor ∝ +Δt</text>

  <!-- Підпис внизу лівої панелі -->
  <text x="322.5" y="495" font-size="12" fill="#6b7280" text-anchor="middle">Зона спокою усуває мікроколивання вала та знижує енергоспоживання</text>

  <!-- ПРАВА ПАНЕЛЬ: Схема та логіка компараторів -->
  <rect x="635" y="80" width="295" height="435" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="782.5" y="103" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Внутрішня логіка порівняння</text>
  <text x="782.5" y="120" font-size="12" fill="#6b7280" text-anchor="middle">Схема компараторів KC2462 / AA51880</text>

  <!-- Блок 1: Дискримінатор -->
  <rect x="647" y="135" width="271" height="95" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="782.5" y="154" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Часовий дискримінатор</text>
  <text x="657" y="174" font-size="12" fill="#1a1a1a" text-anchor="start">• Вхідний імпульс: t_in (1.0...2.0 мс)</text>
  <text x="657" y="192" font-size="12" fill="#1a1a1a" text-anchor="start">• Внутрішній ПОТ-імпульс: t_fb</text>
  <text x="657" y="210" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">• Різниця: Δt = t_in - t_fb</text>

  <!-- Стрілка 1 -> 2 -->
  <line x1="782.5" y1="230" x2="782.5" y2="248" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Блок 2: Компаратори -->
  <rect x="647" y="250" width="271" height="130" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="782.5" y="269" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">2. Компаратори і зона спокою</text>
  <text x="657" y="289" font-size="12" fill="#1a1a1a" text-anchor="start">• COMP1 (CW): спрацьовує при Δt &gt; +t_db</text>
  <text x="657" y="307" font-size="12" fill="#1a1a1a" text-anchor="start">• COMP2 (CCW): спрацьовує при Δt &lt; -t_db</text>
  <text x="657" y="325" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">• При |Δt| &lt; t_db (3...10 мкс):</text>
  <text x="670" y="343" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">  обидва компаратори ВИМКНЕНІ</text>
  <text x="657" y="363" font-size="12" fill="#6b7280" text-anchor="start">• t_db задається зовнішнім C_db</text>

  <!-- Стрілка 2 -> 3 -->
  <line x1="782.5" y1="380" x2="782.5" y2="396" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Блок 3: H-міст -->
  <rect x="647" y="398" width="271" height="98" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="782.5" y="417" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">3. Вихідний H-міст двигуна</text>
  <text x="657" y="437" font-size="12" fill="#1a1a1a" text-anchor="start">• |Δt| &lt; t_db ➔ Мотор вимкнений (0 В)</text>
  <text x="657" y="455" font-size="12" fill="#1a1a1a" text-anchor="start">• Δt &gt; +t_db ➔ Мотор CW (V_out &gt; 0)</text>
  <text x="657" y="473" font-size="12" fill="#1a1a1a" text-anchor="start">• Δt &lt; -t_db ➔ Мотор CCW (V_out &lt; 0)</text>
</svg>
