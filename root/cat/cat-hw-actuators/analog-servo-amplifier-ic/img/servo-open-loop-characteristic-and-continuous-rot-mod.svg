<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Definitions -->
  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Залежність швидкості ω від тривалості імпульсу t_in (відкрита петля)</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">При фіксованому t_ref = 1.5 ms тривалість t_in задає напрямок обертання та швидкість двигуна</text>

  <!-- ==================== LEFT PANEL: GRAPH ==================== -->
  <rect x="30" y="70" width="540" height="420" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <text x="300" y="94" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Передавальна характеристика сервопідсилювача ω = f(t_in)</text>
  <text x="300" y="112" font-size="12" fill="#6b7280" text-anchor="middle">Нелінійна область з зоною спокою t_dead та насиченням при |Δt| &gt; 0.1 ms</text>

  <!-- Deadband Callout Header (Above plot box, avoiding line y=150) -->
  <text x="310" y="132" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Зона спокою t_dead (3...10 μs)</text>

  <!-- Plot Box Background -->
  <rect x="90" y="150" width="440" height="270" fill="white" stroke="#d0d7de" stroke-width="1"/>

  <!-- Direction Background Highlights -->
  <!-- CCW Zone (Right Upper) -->
  <rect x="316" y="150" width="214" height="135" fill="#eaf0fd" opacity="0.5"/>
  <!-- CW Zone (Left Lower) -->
  <rect x="90" y="285" width="214" height="135" fill="#e9f7ef" opacity="0.5"/>
  <!-- Deadband Zone (Center Vertical) -->
  <rect x="304" y="150" width="12" height="270" fill="#fdecea" opacity="0.85"/>

  <!-- Grid lines -->
  <!-- Horizontal saturation levels -->
  <line x1="90" y1="175" x2="530" y2="175" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="90" y1="395" x2="530" y2="395" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- Vertical linear region markers -->
  <line x1="220" y1="150" x2="220" y2="420" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="400" y1="150" x2="400" y2="420" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Deadband dashed boundary lines -->
  <line x1="304" y1="150" x2="304" y2="420" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="316" y1="150" x2="316" y2="420" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Axes -->
  <!-- X Axis (ω = 0) -->
  <line x1="90" y1="285" x2="535" y2="285" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-main)"/>
  <!-- Y Axis (t_in = 1.5 ms) -->
  <line x1="310" y1="425" x2="310" y2="145" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-main)"/>

  <!-- Characteristic Curve -->
  <!-- Left Saturation -> Linear -> Deadband -> Linear -> Right Saturation -->
  <polyline points="110,395 220,395 304,285 316,285 400,175 510,175" fill="none" stroke="#2457d6" stroke-width="3" stroke-linejoin="round"/>

  <!-- Curve Data Points (Key Transitions) -->
  <circle cx="220" cy="395" r="4" fill="#2457d6"/>
  <circle cx="304" cy="285" r="4" fill="#c0392b"/>
  <circle cx="316" cy="285" r="4" fill="#c0392b"/>
  <circle cx="400" cy="175" r="4" fill="#2457d6"/>

  <!-- Labels on Plot -->
  <!-- Y Axis Label -->
  <text x="90" y="136" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Швидкість обертання ω</text>

  <!-- Y Ticks -->
  <text x="82" y="179" font-size="12" fill="#2457d6" font-weight="bold" text-anchor="end">+ω_max (CCW)</text>
  <text x="82" y="289" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="end">0</text>
  <text x="82" y="399" font-size="12" fill="#27ae60" font-weight="bold" text-anchor="end">-ω_max (CW)</text>

  <!-- X Axis Label -->
  <text x="310" y="460" font-size="12" fill="#1a1a1a" text-anchor="middle">Тривалість вхідного імпульсу t_in (ms)</text>

  <!-- X Ticks -->
  <text x="110" y="438" font-size="12" fill="#6b7280" text-anchor="middle">1.0 ms</text>
  <text x="220" y="438" font-size="12" fill="#6b7280" text-anchor="middle">1.4 ms</text>
  <text x="310" y="438" font-size="12" fill="#1a1a1a" font-weight="bold" text-anchor="middle">1.50 ms (Нейтраль)</text>
  <text x="400" y="438" font-size="12" fill="#6b7280" text-anchor="middle">1.6 ms</text>
  <text x="510" y="438" font-size="12" fill="#6b7280" text-anchor="middle">2.0 ms</text>

  <!-- Region Labels Inside Plot (positioned to avoid grid lines y=175, y=395, x=220, x=400) -->
  <!-- CCW Region -->
  <text x="420" y="205" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">Обертання CCW</text>
  <text x="420" y="221" font-size="11" fill="#6b7280" text-anchor="start">(Проти годинникової)</text>

  <!-- CW Region -->
  <text x="115" y="340" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">Обертання CW</text>
  <text x="115" y="356" font-size="11" fill="#6b7280" text-anchor="start">(За годинниковою стрілкою)</text>

  <!-- Linear Zone Callout -->
  <text x="295" y="255" font-size="11" fill="#1a1a1a" text-anchor="end">Пропорційне регулювання</text>

  <!-- ==================== RIGHT PANEL: CIRCUIT & MODES ==================== -->
  <rect x="590" y="70" width="340" height="420" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <text x="760" y="94" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Структура режиму відкритої петлі</text>
  <text x="760" y="112" font-size="12" fill="#6b7280" text-anchor="middle">Модифікація підсилювача KC2462 / AA51880</text>

  <!-- Top Card: Block Diagram -->
  <rect x="605" y="130" width="310" height="105" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="618" y="148" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">Модифікована схема сервопідсилювача</text>

  <!-- Block 1: PWM In -->
  <rect x="618" y="160" width="80" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="658" y="180" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вхід PWM</text>

  <line x1="698" y1="176" x2="718" y2="176" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-main)"/>

  <!-- Block 2: IC -->
  <rect x="720" y="160" width="85" height="32" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="762.5" y="174" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">KC2462 /</text>
  <text x="762.5" y="187" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">AA51880</text>

  <line x1="805" y1="176" x2="823" y2="176" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-main)"/>

  <!-- Block 3: Motor -->
  <rect x="825" y="160" width="78" height="32" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="864" y="174" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">H-міст і</text>
  <text x="864" y="187" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Двигун</text>

  <text x="760" y="218" font-size="11" fill="#6b7280" text-anchor="middle">Потенціометр від'єднано -&gt; t_ref = const (1.5 ms)</text>

  <!-- Middle Card: Operating States -->
  <rect x="605" y="248" width="310" height="125" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="618" y="268" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Режими роботи та реакція моста</text>

  <!-- State 1 -->
  <rect x="618" y="280" width="10" height="10" rx="2" fill="#c0392b"/>
  <text x="634" y="289" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="start">t_in ≈ 1.50 ms (|Δt| &lt; t_dead):</text>
  <text x="634" y="302" font-size="11" fill="#6b7280" text-anchor="start">Стоп (H-міст вимкнено, ω = 0)</text>

  <!-- State 2 -->
  <rect x="618" y="312" width="10" height="10" rx="2" fill="#2457d6"/>
  <text x="634" y="321" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="start">t_in &gt; 1.50 ms (Δt &gt; 0):</text>
  <text x="634" y="334" font-size="11" fill="#6b7280" text-anchor="start">Обертання CCW (ШИМ пропорційна Δt)</text>

  <!-- State 3 -->
  <rect x="618" y="344" width="10" height="10" rx="2" fill="#27ae60"/>
  <text x="634" y="353" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="start">t_in &lt; 1.50 ms (Δt &lt; 0):</text>
  <text x="634" y="366" font-size="11" fill="#6b7280" text-anchor="start">Обертання CW (реверс напрямку струму)</text>

  <!-- Bottom Card: Summary -->
  <rect x="605" y="385" width="310" height="90" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="618" y="405" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">Ключові особливості модифікації</text>
  <text x="618" y="424" font-size="11" fill="#1a1a1a" text-anchor="start">• Сервоперетворювач стає пропорційним драйвером</text>
  <text x="618" y="440" font-size="11" fill="#1a1a1a" text-anchor="start">• Швидкість задається відхиленням імпульсу від 1.5 ms</text>
  <text x="618" y="456" font-size="11" fill="#1a1a1a" text-anchor="start">• Вузький мертвий хід (t_dead) запобігає дрейфу</text>
</svg>
