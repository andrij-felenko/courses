<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Marker Definitions -->
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#475569"/>
    </marker>
    <marker id="arr-amber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M 0 0 L 8 4 L 0 8 Z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Конструкція та магнітне коло безсердечникового DC-двигуна</text>
  <text x="480" y="52" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Порожнистий ротор обертається у зазорі між внутрішнім магнітом і зовнішнім сталевим статором без залипання</text>

  <!-- PANEL 1: Transverse Cross-Section & Magnetic Circuit (Left) -->
  <rect x="25" y="68" width="445" height="350" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="247" y="90" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Поперечний розріз та магнітне коло</text>
  <text x="247" y="106" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Потік пронизує мідний ротор і замикається через сталевий корпус</text>

  <!-- Panel 1 Graphic Center: cx=210, cy=250 -->
  <!-- 1. Outer Steel Housing Yoke (Ring R_out=110, R_in=92) -->
  <path d="M 210 140 A 110 110 0 1 0 210 360 A 110 110 0 1 0 210 140 M 210 158 A 92 92 0 1 1 210 342 A 92 92 0 1 1 210 158" fill="#e2e8f0" stroke="#475569" stroke-width="1.5" fill-rule="evenodd"/>

  <!-- 2. Outer Air Gap (R_out=92 to R_in=84) - White background ring -->
  <path d="M 210 158 A 92 92 0 1 0 210 342 A 92 92 0 1 0 210 158 M 210 166 A 84 84 0 1 1 210 334 A 84 84 0 1 1 210 166" fill="#ffffff" fill-rule="evenodd"/>

  <!-- 3. Coreless Copper Rotor Basket Ring (R_out=84 to R_in=70) -->
  <path d="M 210 166 A 84 84 0 1 0 210 334 A 84 84 0 1 0 210 166 M 210 180 A 70 70 0 1 1 210 320 A 70 70 0 1 1 210 180" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" fill-rule="evenodd"/>

  <!-- Copper Winding Conductors (Dots around the rotor ring) -->
  <circle cx="210" cy="173" r="3.5" fill="#d97706"/>
  <circle cx="239" cy="179" r="3.5" fill="#d97706"/>
  <circle cx="264" cy="196" r="3.5" fill="#d97706"/>
  <circle cx="281" cy="221" r="3.5" fill="#d97706"/>
  <circle cx="287" cy="250" r="3.5" fill="#d97706"/>
  <circle cx="281" cy="279" r="3.5" fill="#d97706"/>
  <circle cx="264" cy="304" r="3.5" fill="#d97706"/>
  <circle cx="239" cy="321" r="3.5" fill="#d97706"/>
  <circle cx="210" cy="327" r="3.5" fill="#d97706"/>
  <circle cx="181" cy="321" r="3.5" fill="#d97706"/>
  <circle cx="156" cy="304" r="3.5" fill="#d97706"/>
  <circle cx="139" cy="279" r="3.5" fill="#d97706"/>
  <circle cx="133" cy="250" r="3.5" fill="#d97706"/>
  <circle cx="139" cy="221" r="3.5" fill="#d97706"/>
  <circle cx="156" cy="196" r="3.5" fill="#d97706"/>
  <circle cx="181" cy="179" r="3.5" fill="#d97706"/>

  <!-- 4. Inner Air Gap (R_out=70 to R_in=56) - White background ring -->
  <path d="M 210 180 A 70 70 0 1 0 210 320 A 70 70 0 1 0 210 180 M 210 194 A 56 56 0 1 1 210 306 A 56 56 0 1 1 210 194" fill="#ffffff" fill-rule="evenodd"/>

  <!-- 5. Stationary Permanent Magnet (Center R=56, Split Left N / Right S) -->
  <path d="M 210 194 A 56 56 0 0 0 210 306 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
  <path d="M 210 194 A 56 56 0 0 1 210 306 Z" fill="#fdecea" stroke="#c0392b" stroke-width="1.8"/>
  <circle cx="210" cy="250" r="14" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <circle cx="210" cy="250" r="3" fill="#475569"/>

  <!-- Magnet Pole Labels -->
  <text x="180" y="255" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#2457d6" text-anchor="middle">N</text>
  <text x="240" y="255" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#c0392b" text-anchor="middle">S</text>

  <!-- Magnetic Flux Lines (dashed blue paths with arrows) -->
  <!-- Top Loop -->
  <path d="M 172 212 C 150 155, 270 155, 248 212" fill="none" stroke="#2457d6" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <!-- Bottom Loop -->
  <path d="M 172 288 C 150 345, 270 345, 248 288" fill="none" stroke="#2457d6" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <!-- Left Radial Flux -->
  <path d="M 154 250 L 122 250" fill="none" stroke="#2457d6" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <!-- Right Radial Flux -->
  <path d="M 266 250 L 298 250" fill="none" stroke="#2457d6" stroke-width="1.6" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>

  <!-- Panel 1 Callout Pointers & Labels (Placed cleanly to the right of graphics) -->
  <!-- Callout 1: Outer Yoke -->
  <line x1="322" y1="145" x2="285" y2="175" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-dark)"/>
  <text x="330" y="142" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#1a1a1a">Зовнішній статор</text>
  <text x="330" y="156" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280">Сталевий магнітопровід</text>

  <!-- Callout 2: Coreless Rotor -->
  <line x1="322" y1="205" x2="280" y2="220" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-amber)"/>
  <text x="330" y="200" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#d97706">Мідний ротор-кошик</text>
  <text x="330" y="214" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280">Самонесуча обмотка</text>

  <!-- Callout 3: Stationary Magnet -->
  <line x1="322" y1="263" x2="252" y2="263" stroke="#2457d6" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <text x="330" y="258" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2457d6">Нерухомий магніт</text>
  <text x="330" y="272" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280">Внутрішній статор N-S</text>

  <!-- Panel 1 Bottom Highlight Box -->
  <rect x="45" y="348" width="405" height="54" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="6"/>
  <text x="247" y="368" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Головна особливість:</text>
  <text x="247" y="386" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle">Відсутній залізний сердечник — немає залипання</text>

  <!-- PANEL 2: Longitudinal Cutaway Structure (Right) -->
  <rect x="490" y="68" width="445" height="350" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="712" y="90" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Поздовжня будова та вузли двигуна</text>
  <text x="712" y="106" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Конструкція «стакану» з нерухомим магнітом всередині</text>

  <!-- Panel 2 Graphic Center around y=235 -->
  <!-- Axis Center Line -->
  <line x1="515" y1="235" x2="895" y2="235" stroke="#94a3b8" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Shaft (Horizontal rod rendered as path) -->
  <path d="M 525 231 H 885 V 239 H 525 Z" fill="#cbd5e1" stroke="#475569" stroke-width="1.2"/>

  <!-- Commutator Cylinder -->
  <path d="M 560 217 H 580 V 253 H 560 Z" fill="#f59e0b" stroke="#b45309" stroke-width="1.2"/>
  <!-- Brushes -->
  <path d="M 565 200 H 575 V 215 H 565 Z" fill="#334155" stroke="#1e293b" stroke-width="1"/>
  <path d="M 565 255 H 575 V 270 H 565 Z" fill="#334155" stroke="#1e293b" stroke-width="1"/>

  <!-- Front Flange & Bearing -->
  <path d="M 595 145 H 609 V 325 H 595 Z" fill="#94a3b8" stroke="#475569" stroke-width="1.2"/>
  <path d="M 590 215 H 614 V 255 H 590 Z" fill="#cbd5e1" stroke="#475569" stroke-width="1.2"/>

  <!-- Rotor Hub / Disc (Attached to shaft) -->
  <path d="M 625 165 H 637 V 305 H 625 Z" fill="#d97706" stroke="#b45309" stroke-width="1.2"/>

  <!-- Coreless Copper Rotor Basket Cylinder Walls -->
  <!-- Top Wall -->
  <path d="M 637 165 H 815 V 181 H 637 Z" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <!-- Top Winding Lines -->
  <line x1="650" y1="165" x2="665" y2="181" stroke="#d97706" stroke-width="1"/>
  <line x1="680" y1="165" x2="695" y2="181" stroke="#d97706" stroke-width="1"/>
  <line x1="710" y1="165" x2="725" y2="181" stroke="#d97706" stroke-width="1"/>
  <line x1="740" y1="165" x2="755" y2="181" stroke="#d97706" stroke-width="1"/>
  <line x1="770" y1="165" x2="785" y2="181" stroke="#d97706" stroke-width="1"/>
  <line x1="800" y1="165" x2="812" y2="178" stroke="#d97706" stroke-width="1"/>

  <!-- Bottom Wall -->
  <path d="M 637 289 H 815 V 305 H 637 Z" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <!-- Bottom Winding Lines -->
  <line x1="650" y1="289" x2="665" y2="305" stroke="#d97706" stroke-width="1"/>
  <line x1="680" y1="289" x2="695" y2="305" stroke="#d97706" stroke-width="1"/>
  <line x1="710" y1="289" x2="725" y2="305" stroke="#d97706" stroke-width="1"/>
  <line x1="740" y1="289" x2="755" y2="305" stroke="#d97706" stroke-width="1"/>
  <line x1="770" y1="289" x2="785" y2="305" stroke="#d97706" stroke-width="1"/>
  <line x1="800" y1="289" x2="812" y2="302" stroke="#d97706" stroke-width="1"/>

  <!-- Stationary Central Magnet (Inside hollow rotor cup) -->
  <!-- Top Pole N -->
  <path d="M 650 193 H 805 V 235 H 650 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="727" y="218" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Магніт N</text>

  <!-- Bottom Pole S -->
  <path d="M 650 235 H 805 V 277 H 650 Z" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="727" y="260" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Магніт S</text>

  <!-- Outer Steel Housing Yoke -->
  <path d="M 609 145 H 835 V 159 H 609 Z" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <path d="M 609 311 H 835 V 325 H 609 Z" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <path d="M 835 145 H 849 V 325 H 835 Z" fill="#94a3b8" stroke="#475569" stroke-width="1.2"/>
  <path d="M 830 223 H 854 V 247 H 830 Z" fill="#cbd5e1" stroke="#475569" stroke-width="1.2"/>

  <!-- Panel 2 Pointers & Labels -->
  <!-- Label 1: Commutator -->
  <line x1="565" y1="155" x2="570" y2="195" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-dark)"/>
  <text x="515" y="135" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#1a1a1a">Колекторний вузол</text>
  <text x="515" y="148" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280">Колектор і щітки</text>

  <!-- Label 2: Outer Yoke -->
  <line x1="712" y1="138" x2="712" y2="144" stroke="#475569" stroke-width="1.2" marker-end="url(#arr-dark)"/>
  <text x="712" y="135" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle">Сталевий статор (магнітопровід)</text>

  <!-- Label 3: Copper Rotor -->
  <line x1="600" y1="335" x2="670" y2="306" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-amber)"/>
  <text x="580" y="348" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#d97706" text-anchor="middle">Мідний ротор-кошик</text>
  <text x="580" y="361" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(самонесучий циліндр)</text>

  <!-- Label 4: Stationary Magnet -->
  <line x1="780" y1="335" x2="780" y2="278" stroke="#2457d6" stroke-width="1.2" marker-end="url(#arr-blue)"/>
  <text x="780" y="348" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#2457d6" text-anchor="middle">Нерухомий магніт</text>
  <text x="780" y="361" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">(закріплений на статорі)</text>

  <!-- Panel 2 Bottom Highlight Box -->
  <rect x="505" y="378" width="415" height="32" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="6"/>
  <text x="712" y="398" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#27ae60" text-anchor="middle">Результат: Блискавичний відгук та відсутність втрат у роторі</text>

  <!-- BOTTOM 3 FEATURE BADGES -->
  <!-- Badge 1: Ultra-low inertia -->
  <rect x="25" y="428" width="295" height="42" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="172" y="444" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Наднизька інерція ротора</text>
  <text x="172" y="459" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Мала маса, тау відгуку &lt; 5 мс</text>

  <!-- Badge 2: Zero cogging -->
  <rect x="332" y="428" width="296" height="42" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="480" y="444" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Нульове залипання (Cogging)</text>
  <text x="480" y="459" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Ідеально плавний хід обертання</text>

  <!-- Badge 3: Low inductance -->
  <rect x="640" y="428" width="295" height="42" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="787" y="444" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Низька індуктивність</text>
  <text x="787" y="459" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="middle">Потребує високої частоти ШІМ</text>
</svg>
