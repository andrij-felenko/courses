<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="#ffffff"/>

  <!-- Markers -->
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кінематичне викривлення та бічне навантаження при перекосі тяги</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Відхилення кута тяги від 90° зменшує момент, створює силу F_side та асиметрію ходу</text>

  <!-- LEFT PANEL: OPTIMAL ALIGNMENT -->
  <g id="optimal-panel">
    <!-- Panel Box -->
    <rect x="25" y="65" width="445" height="375" rx="8" fill="#f4f6f8" stroke="#27ae60" stroke-width="2"/>
    
    <!-- Banner Header -->
    <rect x="35" y="75" width="425" height="30" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
    <text x="247" y="95" font-size="13" font-weight="bold" fill="#1e7e34" text-anchor="middle">ОПТИМАЛЬНИЙ МОНТАЖ (Кут тяги θ = 90°)</text>

    <!-- Base Reference Line -->
    <line x1="45" y1="285" x2="450" y2="285" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- Servo Body 1 -->
    <rect x="75" y="220" width="80" height="65" rx="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
    <circle cx="115" cy="230" r="10" fill="#6b7280" stroke="#1a1a1a" stroke-width="1.5"/>
    <circle cx="115" cy="230" r="4" fill="#374151"/>
    <text x="115" y="260" font-size="11" fill="#6b7280" text-anchor="middle">Сервопривод</text>

    <!-- Driven Mount 1 -->
    <rect x="360" y="220" width="50" height="65" rx="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
    <circle cx="385" cy="230" r="8" fill="#6b7280" stroke="#1a1a1a" stroke-width="1.5"/>
    <circle cx="385" cy="230" r="3" fill="#374151"/>

    <!-- Neutral Horn 1 (Vertical) -->
    <line x1="115" y1="230" x2="115" y2="150" stroke="#2457d6" stroke-width="6" stroke-linecap="round"/>
    <circle cx="115" cy="176" r="2.5" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
    <circle cx="115" cy="203" r="2.5" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
    <circle cx="115" cy="150" r="5" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>

    <!-- Horn Label -->
    <text x="105" y="190" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">Качалка R</text>

    <!-- Neutral Driven Lever 1 (Vertical) -->
    <line x1="385" y1="230" x2="385" y2="150" stroke="#4b5563" stroke-width="6" stroke-linecap="round"/>
    <circle cx="385" cy="150" r="5" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
    <text x="398" y="190" font-size="12" font-weight="bold" fill="#4b5563" text-anchor="start">Важіль L</text>

    <!-- Pushrod 1 -->
    <line x1="115" y1="150" x2="385" y2="150" stroke="#1a1a1a" stroke-width="3"/>
    <circle cx="115" cy="150" r="3" fill="#1a1a1a"/>
    <circle cx="385" cy="150" r="3" fill="#1a1a1a"/>
    <text x="250" y="136" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Тяга (Pushrod)</text>

    <!-- 90 Degree Right Angle Symbol -->
    <path d="M 115,162 L 127,162 L 127,150" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
    <circle cx="121" cy="156" r="1.5" fill="#27ae60"/>
    <text x="132" y="172" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">θ = 90°</text>

    <!-- Motion Arc and Dashed Angles -->
    <path d="M 75,160.7 A 80,80 0 0,1 155,160.7" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="115" y1="230" x2="75" y2="160.7" stroke="#93c5fd" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="115" y1="230" x2="155" y2="160.7" stroke="#93c5fd" stroke-width="2" stroke-dasharray="3,3"/>

    <!-- Force Vectors -->
    <line x1="115" y1="150" x2="175" y2="150" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
    <text x="180" y="146" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">F_t = F_rod</text>

    <text x="115" y="215" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">F_side = 0 (без бічного зносу)</text>

    <!-- Symmetry Dimension Indicators -->
    <line x1="75" y1="280" x2="115" y2="280" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
    <line x1="155" y1="280" x2="115" y2="280" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
    <text x="125" y="295" font-size="12" font-weight="bold" fill="#1e7e34" text-anchor="middle">Симетричний хід: Δx1 = Δx2</text>

    <!-- Summary Box 1 -->
    <rect x="35" y="310" width="425" height="118" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <text x="50" y="330" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#27ae60">• θ = 90°:</tspan> весь вектор F_rod створює корисний момент F_t</text>
    <text x="50" y="350" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#27ae60">• F_side = 0:</tspan> відсутнє бічне згинальне зусилля на вал серва</text>
    <text x="50" y="370" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#27ae60">• Симетрія ходу:</tspan> однакові повороти дають рівні Δx1 = Δx2</text>
    <text x="50" y="390" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#27ae60">• Надійність:</tspan> мінімальний знос шарнірів та підшипників вала</text>
  </g>

  <!-- RIGHT PANEL: NON-OPTIMAL ALIGNMENT / DISTORTION -->
  <g id="distortion-panel">
    <!-- Panel Box -->
    <rect x="490" y="65" width="445" height="375" rx="8" fill="#f4f6f8" stroke="#c0392b" stroke-width="2"/>
    
    <!-- Banner Header -->
    <rect x="500" y="75" width="425" height="30" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
    <text x="712" y="95" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">НЕОПТИМАЛЬНИЙ КУТ (Перекіс тяги θ ≠ 90°)</text>

    <!-- Base Reference Line -->
    <line x1="510" y1="285" x2="915" y2="285" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>

    <!-- Servo Body 2 -->
    <rect x="540" y="220" width="80" height="65" rx="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
    <!-- Stress / Strain rings around shaft -->
    <circle cx="580" cy="230" r="15" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,2"/>
    <circle cx="580" cy="230" r="10" fill="#6b7280" stroke="#c0392b" stroke-width="2"/>
    <circle cx="580" cy="230" r="4" fill="#374151"/>
    <text x="540" y="260" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="start">Згинання валу!</text>

    <!-- Driven Mount 2 (Offset Down) -->
    <rect x="825" y="240" width="50" height="45" rx="4" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5"/>
    <circle cx="850" cy="250" r="8" fill="#6b7280" stroke="#1a1a1a" stroke-width="1.5"/>
    <circle cx="850" cy="250" r="3" fill="#374151"/>

    <!-- Neutral Horn 2 (Vertical) -->
    <line x1="580" y1="230" x2="580" y2="150" stroke="#2457d6" stroke-width="6" stroke-linecap="round"/>
    <circle cx="580" cy="176" r="2.5" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
    <circle cx="580" cy="203" r="2.5" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
    <circle cx="580" cy="150" r="5" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>

    <!-- Horn Label -->
    <text x="570" y="190" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">Качалка R</text>

    <!-- Driven Lever 2 (Slanted/Offset Target) -->
    <line x1="850" y1="250" x2="830" y2="210" stroke="#4b5563" stroke-width="6" stroke-linecap="round"/>
    <circle cx="830" cy="210" r="5" fill="#ffffff" stroke="#4b5563" stroke-width="2"/>
    <text x="842" y="215" font-size="12" font-weight="bold" fill="#4b5563" text-anchor="start">Важіль L</text>

    <!-- Slanted Pushrod 2 -->
    <line x1="580" y1="150" x2="830" y2="210" stroke="#c0392b" stroke-width="3.5"/>
    <circle cx="580" cy="150" r="3" fill="#c0392b"/>
    <circle cx="830" cy="210" r="3" fill="#c0392b"/>
    <text x="705" y="165" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Перекошена тяга</text>

    <!-- Non-90 Angle Arc Indicator -->
    <path d="M 605,150 A 25,25 0 0,1 600,165" fill="none" stroke="#c0392b" stroke-width="2"/>
    <text x="618" y="142" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">θ ≠ 90° (перекіс)</text>

    <!-- Motion Arc and Dashed Angles -->
    <path d="M 540,160.7 A 80,80 0 0,1 620,160.7" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="580" y1="230" x2="540" y2="160.7" stroke="#93c5fd" stroke-width="2" stroke-dasharray="3,3"/>
    <line x1="580" y1="230" x2="620" y2="160.7" stroke="#93c5fd" stroke-width="2" stroke-dasharray="3,3"/>

    <!-- Force Vectors at Horn Tip -->
    <!-- Total Force along rod F_rod -->
    <line x1="580" y1="150" x2="635" y2="163" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arr-black)"/>
    <text x="642" y="165" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">F_rod</text>

    <!-- Tangential Component F_t -->
    <line x1="580" y1="150" x2="630" y2="150" stroke="#27ae60" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arr-green)"/>
    <text x="635" y="140" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="start">F_t = F_rod · sin(θ)</text>

    <!-- Parasitic Bending Side Force F_side (Downward vector along horn into shaft) -->
    <line x1="580" y1="150" x2="580" y2="205" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-red)"/>
    <text x="592" y="195" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">F_side = F_rod · cos(θ)</text>

    <!-- Asymmetry Dimension Indicators -->
    <line x1="540" y1="280" x2="580" y2="280" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
    <line x1="628" y1="280" x2="580" y2="280" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
    <text x="680" y="295" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Асиметрія ходу: Δx1 ≠ Δx2</text>

    <!-- Summary Box 2 -->
    <rect x="500" y="310" width="425" height="118" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <text x="515" y="330" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#c0392b">• Втрата моменту:</tspan> F_t = F_rod · sin(θ) менше за F_rod</text>
    <text x="515" y="350" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#c0392b">• Бічна сила F_side:</tspan> F_rod · cos(θ) згинає вал сервоприводу</text>
    <text x="515" y="370" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#c0392b">• Нелінійність:</tspan> асиметрія переміщень важеля (Δx1 ≠ Δx2)</text>
    <text x="515" y="390" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#c0392b">• Ризик заклинювання:</tspan> підвищений знос і люфт у шарнірах</text>
  </g>
</svg>
