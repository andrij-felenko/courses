<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Markers for arrows -->
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <!-- Ground Hatching Pattern -->
    <pattern id="hatch" width="6" height="6" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#6b7280" stroke-width="1.2"/>
    </pattern>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Canvas Header -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Кінематика та розклад сил у важільному механізмі сервоприводу</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Передача моменту залежить від кута тяги: максимальна при 90°, з ризиком заклинювання у крайніх положеннях</text>

  <!-- LEFT MAIN DIAGRAM PANEL -->
  <rect x="30" y="68" width="590" height="372" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="92" font-size="14" font-weight="bold" fill="#1a1a1a">Схема кінематичних ланок та векторів сил</text>

  <!-- Reference Axis & Centerlines -->
  <!-- Horizontal reference at O1 -->
  <line x1="80" y1="320" x2="240" y2="320" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 4"/>
  <!-- Horizontal reference at O2 -->
  <line x1="390" y1="250" x2="550" y2="250" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 4"/>
  <!-- Baseline connecting O1 to O2 -->
  <line x1="140" y1="320" x2="490" y2="250" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- FIXED PIVOT MOUNT O1 (Servo Axis) -->
  <!-- Ground hatching base -->
  <rect x="110" y="340" width="60" height="10" fill="url(#hatch)"/>
  <line x1="110" y1="340" x2="170" y2="340" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Hinge Triangle O1 -->
  <polygon points="140,320 126,340 154,340" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <!-- Circle pivot O1 -->
  <circle cx="140" cy="320" r="14" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <circle cx="140" cy="320" r="4" fill="#2457d6"/>

  <!-- FIXED PIVOT MOUNT O2 (Driven Axis) -->
  <!-- Ground hatching base -->
  <rect x="460" y="270" width="60" height="10" fill="url(#hatch)"/>
  <line x1="460" y1="270" x2="520" y2="270" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Hinge Triangle O2 -->
  <polygon points="490,250 476,270 504,270" fill="#eaf0fd" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Circle pivot O2 -->
  <circle cx="490" cy="250" r="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="490" cy="250" r="4" fill="#1a1a1a"/>

  <!-- ANGLE ARCS -->
  <!-- Angle theta1 arc at O1 (radius 38, from 0 deg to 50 deg) -->
  <path d="M 178,320 A 38,38 0 0,0 164.4,290.9" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="190" y="312" font-size="13" font-weight="bold" fill="#2457d6">θ₁</text>

  <!-- Angle theta2 arc at O2 (radius 38, from 180 deg to 128 deg) -->
  <path d="M 452,250 A 38,38 0 0,1 466.6,220" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="435" y="242" font-size="13" font-weight="bold" fill="#2457d6">θ₂</text>

  <!-- Transmission Angle gamma arc at Joint B (radius 28) -->
  <path d="M 393.6,168.3 A 28,28 0 0,1 402.8,137.9" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <text x="412" y="130" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">γ</text>

  <!-- LINKAGE ARMS & PUSHROD -->
  <!-- Driving arm O1-A (r1) -->
  <line x1="140" y1="320" x2="204" y2="243" stroke="#1a1a1a" stroke-width="4.5" stroke-linecap="round"/>
  <text x="155" y="255" font-size="13" font-weight="bold" fill="#1a1a1a">r₁</text>

  <!-- Driven arm O2-B (r2) -->
  <line x1="490" y1="250" x2="420" y2="160" stroke="#1a1a1a" stroke-width="4.5" stroke-linecap="round"/>
  <text x="475" y="185" font-size="13" font-weight="bold" fill="#1a1a1a">r₂</text>

  <!-- Pushrod A-B (L) -->
  <line x1="204" y1="243" x2="420" y2="160" stroke="#2457d6" stroke-width="4" stroke-linecap="round"/>
  <text x="312" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Тяга L</text>

  <!-- JOINTS A & B -->
  <!-- Joint A -->
  <circle cx="204" cy="243" r="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="204" cy="243" r="2" fill="#1a1a1a"/>
  <text x="216" y="240" font-size="12" font-weight="bold" fill="#1a1a1a">A</text>

  <!-- Joint B -->
  <circle cx="420" cy="160" r="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="420" cy="160" r="2" fill="#1a1a1a"/>
  <text x="406" y="160" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">B</text>

  <!-- FORCE VECTORS & MOMENTS -->
  <!-- Torque M1 curved arrow at O1 -->
  <path d="M 118,302 A 25,25 0 0,1 140,295" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="115" y="275" text-anchor="end" font-size="13" font-weight="bold" fill="#2457d6">M₁</text>

  <!-- Tangential force F_t1 at Joint A -->
  <line x1="204" y1="243" x2="174" y2="218" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="115" y="210" font-size="12" font-weight="bold" fill="#27ae60">F_т1</text>

  <!-- Pushrod Force Vector at B -->
  <line x1="360" y1="183" x2="408" y2="164.6" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="350" y="160" font-size="12" font-weight="bold" fill="#2457d6">F_тяг</text>

  <!-- Useful Tangential Force F_t2 at Joint B -->
  <line x1="420" y1="160" x2="455" y2="133" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="465" y="125" font-size="12" font-weight="bold" fill="#27ae60">F_т2 (корисна)</text>

  <!-- Parasite Radial Force F_rad2 at Joint B -->
  <line x1="420" y1="160" x2="451.5" y2="200.5" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="465" y="218" font-size="12" font-weight="bold" fill="#c0392b">F_рад2 (паразитна)</text>

  <!-- Torque M2 curved arrow at O2 -->
  <path d="M 508,232 A 22,22 0 0,1 490,228" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="525" y="260" font-size="13" font-weight="bold" fill="#27ae60">M₂</text>

  <!-- Labels for Pivots -->
  <text x="140" y="375" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Ось O₁ (сервопривід)</text>
  <text x="490" y="305" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Ось O₂ (керований вузол)</text>

  <!-- RIGHT INFORMATIVE PANEL -->
  <rect x="635" y="68" width="295" height="372" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Card 1: Force & Torque Balance -->
  <rect x="645" y="80" width="275" height="105" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="660" y="102" font-size="14" font-weight="bold" fill="#1a1a1a">1. Силовий баланс</text>
  <text x="660" y="124" font-size="12" fill="#1a1a1a">• Дотична сила: F_т1 = M₁ / r₁</text>
  <text x="660" y="144" font-size="12" fill="#1a1a1a">• Сила в тязі: F_тяг = F_т1 / sin(γ₁)</text>
  <text x="660" y="164" font-size="12" font-weight="bold" fill="#27ae60">• Момент: M₂ = F_тяг · r₂ · sin(γ)</text>

  <!-- Card 2: Transmission Efficiency -->
  <rect x="645" y="198" width="275" height="105" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="660" y="220" font-size="14" font-weight="bold" fill="#1a1a1a">2. Ефективність передачі</text>
  <text x="660" y="242" font-size="12" fill="#27ae60">• γ ≈ 90° : max передача моменту M₂</text>
  <text x="660" y="262" font-size="12" fill="#c0392b">• γ &lt; 30° : зростає паразитна F_рад</text>
  <text x="660" y="282" font-size="12" font-weight="bold" fill="#c0392b">• γ → 0°/180° : мертва точка (M₂ → 0)</text>

  <!-- Card 3: Mechanical Risks -->
  <rect x="645" y="316" width="275" height="110" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="4 4"/>
  <text x="660" y="338" font-size="14" font-weight="bold" fill="#c0392b">3. Механічні ризики</text>
  <text x="660" y="360" font-size="12" fill="#1a1a1a">• Згинання вала сервоприводу</text>
  <text x="660" y="380" font-size="12" fill="#1a1a1a">• Нелінійність швидкості ω₂/ω₁</text>
  <text x="660" y="400" font-size="12" fill="#1a1a1a">• Накопичення люфтів у шарнірах</text>
</svg>
