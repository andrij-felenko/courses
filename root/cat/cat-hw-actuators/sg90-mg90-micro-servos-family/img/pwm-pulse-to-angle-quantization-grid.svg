<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Квантування ШІМ-сигналу та зона нечутливості сервопривода</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Крок таймера МК формує дискретні рівні ШІМ, а мертва зона визначає поріг чутливості вала</text>

  <!-- PANEL 1: Left (Overall Quantization Curve) -->
  <rect x="30" y="75" width="430" height="465" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="245" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Залежність кута повороту θ від тривалості імпульсу t</text>
  <text x="245" y="118" text-anchor="middle" font-size="12" fill="#6b7280">Східчаста апроксимація неперервної характеристики</text>

  <!-- Graph 1 Axes -->
  <line x1="90" y1="440" x2="420" y2="440" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="90" y1="440" x2="90" y2="145" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Graph 1 Axis Labels -->
  <text x="420" y="470" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">t_pulse (мкс)</text>
  <text x="85" y="140" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">Кут θ (°)</text>

  <!-- Grid lines & ticks -->
  <line x1="110" y1="440" x2="110" y2="445" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="250" y1="440" x2="250" y2="445" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="390" y1="440" x2="390" y2="445" stroke="#1a1a1a" stroke-width="1"/>

  <text x="110" y="458" text-anchor="middle" font-size="12" fill="#6b7280">500</text>
  <text x="250" y="458" text-anchor="middle" font-size="12" fill="#6b7280">1500</text>
  <text x="390" y="458" text-anchor="middle" font-size="12" fill="#6b7280">2500</text>

  <line x1="85" y1="440" x2="90" y2="440" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="85" y1="300" x2="90" y2="300" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="85" y1="160" x2="90" y2="160" stroke="#1a1a1a" stroke-width="1"/>

  <line x1="90" y1="300" x2="390" y2="300" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="90" y1="160" x2="390" y2="160" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="250" y1="160" x2="250" y2="440" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>

  <text x="82" y="444" text-anchor="end" font-size="12" fill="#6b7280">0°</text>
  <text x="82" y="304" text-anchor="end" font-size="12" fill="#6b7280">90°</text>
  <text x="82" y="164" text-anchor="end" font-size="12" fill="#6b7280">180°</text>

  <!-- Curves -->
  <!-- Ideal Continuous Line -->
  <line x1="110" y1="440" x2="390" y2="160" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Quantized Staircase Path -->
  <path d="M 110,440 L 138,440 L 138,412 L 166,412 L 166,384 L 194,384 L 194,356 L 222,356 L 222,328 L 250,328 L 250,300 L 278,300 L 278,272 L 306,272 L 306,244 L 334,244 L 334,216 L 362,216 L 362,188 L 390,188 L 390,160" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Legend Inside Graph 1 -->
  <text x="140" y="185" text-anchor="start" font-size="12" fill="#6b7280">— — Ідеальна неперервна пряма θ(t)</text>
  <text x="140" y="205" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">─── Східчаста функція (квантування)</text>

  <!-- Zoom Rect & Callout Link -->
  <rect x="230" y="280" width="40" height="40" rx="4" fill="#eaf0fd" fill-opacity="0.6" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="280" y="298" font-size="12" font-weight="bold" fill="#2457d6">Зона збільшення</text>
  <path d="M 270,300 Q 375,250 480,210" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr-blue)"/>

  <!-- Formula Box Panel 1 -->
  <rect x="45" y="488" width="400" height="38" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="245" y="504" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">θ(t) = (t - t_min) × 180° / (t_max - t_min)</text>
  <text x="245" y="519" text-anchor="middle" font-size="12" fill="#6b7280">k = 180° / 2000 мкс = 0.09°/мкс</text>

  <!-- PANEL 2: Right (Microstructure Details) -->
  <rect x="480" y="75" width="450" height="465" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="705" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Мікроструктура: Тік таймера vs Deadband</text>

  <!-- CARD 2A: High Resolution Timer -->
  <rect x="495" y="115" width="420" height="195" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="510" y="135" font-size="13" font-weight="bold" fill="#2457d6">А. Висока розрядність: Δt_timer &lt; Deadband</text>
  <text x="510" y="152" font-size="12" fill="#6b7280">16-бітний таймер (Δt = 0.5 мкс) vs Мертва зона (SG90 ≈ 5 мкс)</text>

  <!-- Card 2A Visual Diagram -->
  <rect x="630" y="175" width="140" height="50" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="700" y="168" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Deadband = 5 мкс (зона нечутливості)</text>

  <line x1="520" y1="215" x2="885" y2="215" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="700" y1="188" x2="700" y2="230" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Ticks -->
  <line x1="644" y1="210" x2="644" y2="220" stroke="#2457d6" stroke-width="1"/>
  <line x1="658" y1="210" x2="658" y2="220" stroke="#2457d6" stroke-width="1"/>
  <line x1="672" y1="210" x2="672" y2="220" stroke="#2457d6" stroke-width="1"/>
  <line x1="686" y1="210" x2="686" y2="220" stroke="#2457d6" stroke-width="1"/>
  <line x1="714" y1="210" x2="714" y2="220" stroke="#2457d6" stroke-width="1"/>
  <line x1="728" y1="210" x2="728" y2="220" stroke="#2457d6" stroke-width="1"/>
  <line x1="742" y1="210" x2="742" y2="220" stroke="#2457d6" stroke-width="1"/>
  <line x1="756" y1="210" x2="756" y2="220" stroke="#2457d6" stroke-width="1"/>

  <line x1="575" y1="202" x2="656" y2="212" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="560" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Δt_timer = 0.5 мкс</text>
  <text x="700" y="245" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">t₀ (поточне)</text>

  <!-- Card 2A Summary Box -->
  <rect x="505" y="258" width="400" height="42" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="705" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Один тік ігнорується сервою (знаходиться в Deadband).</text>
  <text x="705" y="291" text-anchor="middle" font-size="12" fill="#27ae60">Вал повернеться лише після накопичення 10 тіків (Δt ≥ 5 мкс).</text>

  <!-- CARD 2B: Low Resolution Timer -->
  <rect x="495" y="320" width="420" height="205" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="510" y="340" font-size="13" font-weight="bold" fill="#c0392b">Б. Низька розрядність: Δt_timer &gt; Deadband</text>
  <text x="510" y="357" font-size="12" fill="#6b7280">8-бітний ШІМ (Δt = 78 мкс) vs Мертва зона (SG90 ≈ 5 мкс)</text>

  <!-- Card 2B Visual Diagram -->
  <rect x="580" y="388" width="20" height="42" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="590" y="374" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Deadband (5 мкс)</text>

  <line x1="520" y1="415" x2="885" y2="415" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="590" y1="388" x2="590" y2="430" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="750" y1="388" x2="750" y2="430" stroke="#c0392b" stroke-width="2.5"/>

  <line x1="590" y1="402" x2="750" y2="402" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="670" y="395" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Крок 78 мкс (Δθ ≈ 7.0°)</text>

  <text x="590" y="448" text-anchor="middle" font-size="12" fill="#1a1a1a">t₀</text>
  <text x="750" y="448" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">t₀ + 78 мкс</text>

  <!-- Card 2B Summary Box -->
  <rect x="505" y="465" width="400" height="48" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="705" y="481" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Грубе квантування! Крок таймера перевищує мертву зону.</text>
  <text x="705" y="498" text-anchor="middle" font-size="12" fill="#c0392b">Вал рухається ривками ~7°, плавне позиціонування втрачено.</text>
</svg>
