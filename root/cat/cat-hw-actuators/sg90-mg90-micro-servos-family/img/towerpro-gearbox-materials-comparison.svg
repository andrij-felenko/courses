<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Порівняння редукторів сервоприводів: SG90, SG92R та MG90S</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Матеріал шестерень та геометрія зубців визначають міцність, вагу та точність позиціонування</text>

  <!-- КОЛОНКА 1: SG90 (Нейлон) -->
  <rect x="20" y="68" width="296" height="452" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  
  <!-- Заголовок блоку 1 -->
  <rect x="32" y="80" width="272" height="44" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="168" y="99" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">SG90 (POM / Нейлон)</text>
  <text x="168" y="115" font-size="12" fill="#6b7280" text-anchor="middle">Стандартний пластиковий редуктор</text>

  <!-- Схема розрізу редуктора 1 -->
  <rect x="32" y="134" width="272" height="163" fill="white" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="168" y="152" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Пластикова втулка</text>
  <!-- Корпус та осі -->
  <path d="M 52,260 L 52,175 L 180,175 L 180,165 L 260,165 L 260,260" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,2"/>
  <path d="M 206,165 h 28 v 10 h -28 z" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
  <line x1="75" y1="190" x2="75" y2="255" stroke="#cbd5e1" stroke-width="4"/>
  <line x1="135" y1="175" x2="135" y2="255" stroke="#cbd5e1" stroke-width="4"/>
  <line x1="220" y1="165" x2="220" y2="255" stroke="#cbd5e1" stroke-width="7"/>
  <!-- Шестерні -->
  <path d="M 67,230 h 16 v 20 h -16 z" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
  <path d="M 95,232 h 80 v 12 h -80 z" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
  <path d="M 127,205 h 16 v 27 h -16 z" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
  <path d="M 110,207 h 90 v 10 h -90 z" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
  <path d="M 127,185 h 16 v 20 h -16 z" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
  <path d="M 170,185 h 100 v 14 h -100 z" fill="#e2e8f0" stroke="#64748b" stroke-width="1"/>
  <!-- Підпис внизу 1 -->
  <text x="168" y="282" font-size="12" fill="#6b7280" text-anchor="middle">Пластикові осі</text>

  <!-- Зум зубців 1 -->
  <rect x="32" y="305" width="272" height="92" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="168" y="322" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Зубці: тонкі, вразливі до ударів</text>
  <!-- Малюнок зубців SG90 -->
  <path d="M 150,336 L 160,336 L 164,354 L 146,354 Z" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
  <path d="M 166,360 L 176,360 L 180,342 L 162,342 Z" fill="#fee2e2" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="146" y1="354" x2="164" y2="354" stroke="#e11d48" stroke-width="1.5" stroke-dasharray="2,2"/>
  <text x="168" y="375" font-size="12" fill="#c0392b" text-anchor="middle">Вузький корінь зубця</text>
  <text x="168" y="390" font-size="12" fill="#c0392b" text-anchor="middle">Ризик зрізання при заклинюванні</text>

  <!-- Специфікація 1 -->
  <rect x="32" y="405" width="272" height="103" fill="white" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="44" y="424" font-size="12" font-weight="bold" fill="#1a1a1a">Момент:</text>
  <text x="145" y="424" font-size="12" fill="#1a1a1a">1.8 кг·см (при 4.8В)</text>
  <text x="44" y="444" font-size="12" font-weight="bold" fill="#1a1a1a">Вага:</text>
  <text x="145" y="444" font-size="12" fill="#1a1a1a">9.0 г (найлегший)</text>
  <text x="44" y="464" font-size="12" font-weight="bold" fill="#1a1a1a">Опора:</text>
  <text x="145" y="464" font-size="12" fill="#1a1a1a">Пластикова втулка</text>
  <text x="44" y="484" font-size="12" font-weight="bold" fill="#1a1a1a">Навантаження:</text>
  <text x="145" y="484" font-size="12" fill="#1a1a1a">Низькі (без ударів)</text>


  <!-- КОЛОНКА 2: SG92R (Вуглеволокно) -->
  <rect x="332" y="68" width="296" height="452" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  
  <!-- Заголовок блоку 2 -->
  <rect x="344" y="80" width="272" height="44" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="480" y="99" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">SG92R (Carbon Fiber)</text>
  <text x="480" y="115" font-size="12" fill="#6b7280" text-anchor="middle">Армований вуглеволокном полімер</text>

  <!-- Схема розрізу редуктора 2 -->
  <rect x="344" y="134" width="272" height="163" fill="white" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="480" y="152" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Посилена ступиця</text>
  <!-- Корпус та осі -->
  <path d="M 364,260 L 364,175 L 492,175 L 492,165 L 572,165 L 572,260" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="4,2"/>
  <path d="M 518,165 h 28 v 12 h -28 z" fill="#334155" stroke="#1e293b" stroke-width="1"/>
  <line x1="387" y1="190" x2="387" y2="255" stroke="#64748b" stroke-width="5"/>
  <line x1="447" y1="175" x2="447" y2="255" stroke="#64748b" stroke-width="5"/>
  <line x1="532" y1="165" x2="532" y2="255" stroke="#475569" stroke-width="8"/>
  <!-- Шестерні -->
  <path d="M 379,230 h 16 v 20 h -16 z" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
  <path d="M 407,232 h 80 v 12 h -80 z" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
  <path d="M 439,205 h 16 v 27 h -16 z" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
  <path d="M 422,207 h 90 v 10 h -90 z" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
  <path d="M 439,183 h 16 v 20 h -16 z" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
  <path d="M 482,183 h 100 v 16 h -100 z" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
  <path d="M 522,175 h 20 v 8 h -20 z" fill="#1e293b" stroke="#94a3b8" stroke-width="1"/>
  <!-- Підпис внизу 2 -->
  <text x="480" y="282" font-size="12" fill="#6b7280" text-anchor="middle">Карбоновий композит</text>

  <!-- Зум зубців 2 -->
  <rect x="344" y="305" width="272" height="92" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="480" y="322" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Зубці: розширені, висока жорсткість</text>
  <!-- Малюнок зубців SG92R -->
  <path d="M 452,336 L 470,336 L 476,356 L 446,356 Z" fill="#dbeafe" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M 474,360 L 492,360 L 498,340 L 468,340 Z" fill="#dbeafe" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="452" y1="352" x2="466" y2="340" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="480" y="375" font-size="12" fill="#2457d6" text-anchor="middle">Широкий корінь зубця</text>
  <text x="480" y="390" font-size="12" fill="#2457d6" text-anchor="middle">+20% моменту, стійкість до ударів</text>

  <!-- Специфікація 2 -->
  <rect x="344" y="405" width="272" height="103" fill="white" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="356" y="424" font-size="12" font-weight="bold" fill="#1a1a1a">Момент:</text>
  <text x="457" y="424" font-size="12" fill="#1a1a1a">2.5 кг·см (при 4.8В)</text>
  <text x="356" y="444" font-size="12" font-weight="bold" fill="#1a1a1a">Вага:</text>
  <text x="457" y="444" font-size="12" fill="#1a1a1a">11.0 г (середня)</text>
  <text x="356" y="464" font-size="12" font-weight="bold" fill="#1a1a1a">Опора:</text>
  <text x="457" y="464" font-size="12" fill="#1a1a1a">Карбонова втулка</text>
  <text x="356" y="484" font-size="12" font-weight="bold" fill="#1a1a1a">Навантаження:</text>
  <text x="457" y="484" font-size="12" fill="#1a1a1a">Середні (3D-моделі)</text>


  <!-- КОЛОНКА 3: MG90S (Метал) -->
  <rect x="644" y="68" width="296" height="452" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  
  <!-- Заголовок блоку 3 -->
  <rect x="656" y="80" width="272" height="44" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="792" y="99" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">MG90S (Metal Gear)</text>
  <text x="792" y="115" font-size="12" fill="#6b7280" text-anchor="middle">Латунні шестерні + підшипник</text>

  <!-- Схема розрізу редуктора 3 -->
  <rect x="656" y="134" width="272" height="163" fill="white" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="792" y="152" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Кулькопідшипник</text>
  <!-- Корпус та осі -->
  <path d="M 676,260 L 676,175 L 804,175 L 804,165 L 884,165 L 884,260" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,2"/>
  <!-- Підшипник -->
  <path d="M 828,165 h 32 v 12 h -32 z" fill="#cbd5e1" stroke="#334155" stroke-width="1"/>
  <path d="M 834,167 h 20 v 8 h -20 z" fill="#ffffff"/>
  <circle cx="832" cy="171" r="2.5" fill="#475569"/>
  <circle cx="856" cy="171" r="2.5" fill="#475569"/>
  <line x1="699" y1="190" x2="699" y2="255" stroke="#475569" stroke-width="5"/>
  <line x1="759" y1="175" x2="759" y2="255" stroke="#475569" stroke-width="5"/>
  <line x1="844" y1="165" x2="844" y2="255" stroke="#334155" stroke-width="8"/>
  <!-- Шестерні -->
  <path d="M 691,230 h 16 v 20 h -16 z" fill="#94a3b8" stroke="#334155" stroke-width="1"/>
  <path d="M 719,232 h 80 v 12 h -80 z" fill="#d97706" stroke="#78350f" stroke-width="1"/>
  <path d="M 751,205 h 16 v 27 h -16 z" fill="#94a3b8" stroke="#334155" stroke-width="1"/>
  <path d="M 734,207 h 90 v 10 h -90 z" fill="#d97706" stroke="#78350f" stroke-width="1"/>
  <path d="M 751,183 h 16 v 20 h -16 z" fill="#94a3b8" stroke="#334155" stroke-width="1"/>
  <path d="M 794,183 h 100 v 16 h -100 z" fill="#d97706" stroke="#78350f" stroke-width="1"/>
  <!-- Підпис внизу 3 -->
  <text x="792" y="282" font-size="12" fill="#6b7280" text-anchor="middle">Сталеві осі + латунь</text>

  <!-- Зум зубців 3 -->
  <rect x="656" y="305" width="272" height="92" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="792" y="322" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Зубці: металеві, максимальна міцність</text>
  <!-- Малюнок зубців MG90S -->
  <path d="M 762,336 L 782,336 L 789,356 L 755,356 Z" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <path d="M 784,360 L 804,360 L 811,340 L 777,340 Z" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <path d="M 772,348 Q 777,352 782,356" fill="none" stroke="#27ae60" stroke-width="2"/>
  <text x="792" y="375" font-size="12" fill="#27ae60" text-anchor="middle">Високий опір зрізанню</text>
  <text x="792" y="390" font-size="12" fill="#27ae60" text-anchor="middle">Витримує ударні навантаження</text>

  <!-- Специфікація 3 -->
  <rect x="656" y="405" width="272" height="103" fill="white" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="668" y="424" font-size="12" font-weight="bold" fill="#1a1a1a">Момент:</text>
  <text x="769" y="424" font-size="12" fill="#1a1a1a">2.2 кг·см (при 4.8В)</text>
  <text x="668" y="444" font-size="12" font-weight="bold" fill="#1a1a1a">Вага:</text>
  <text x="769" y="444" font-size="12" fill="#1a1a1a">13.4 г (металевий)</text>
  <text x="668" y="464" font-size="12" font-weight="bold" fill="#1a1a1a">Опора:</text>
  <text x="769" y="464" font-size="12" fill="#1a1a1a">Кульковий підшипник</text>
  <text x="668" y="484" font-size="12" font-weight="bold" fill="#1a1a1a">Навантаження:</text>
  <text x="769" y="484" font-size="12" fill="#1a1a1a">Високі (роботи)</text>

</svg>
