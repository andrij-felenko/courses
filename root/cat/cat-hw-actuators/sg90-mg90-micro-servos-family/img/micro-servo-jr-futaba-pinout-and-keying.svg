<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розпіновка роз&#39;єму JR/Futaba та захист від переполюсовки</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Центральний контакт VCC (+5 В) запобігає зворотній полярності при розвороті вилки на 180°</text>

  <!-- ================= ЛІВА ПАНЕЛЬ: РОЗПІНОВКА ТА КОНСТРУКЦІЯ ================= -->
  <rect x="24" y="72" width="440" height="368" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="244" y="96" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Конструкція та розпіновка роз&#39;ємів (крок 2,54 мм)</text>

  <!-- Картка 1A: JR / DuPont -->
  <rect x="36" y="112" width="200" height="112" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="136" y="130" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">JR / DuPont (SG90, MG90S)</text>
  <text x="136" y="146" font-size="12" fill="#6b7280" text-anchor="middle">Скошені фаски або прямий</text>

  <!-- Корпус JR -->
  <rect x="66" y="156" width="140" height="38" rx="3" fill="#2c3e50" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="74" y="162" width="34" height="26" rx="2" fill="#e67e22"/>
  <text x="91" y="179" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>
  <rect x="119" y="162" width="34" height="26" rx="2" fill="#c0392b"/>
  <text x="136" y="179" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="164" y="162" width="34" height="26" rx="2" fill="#795548"/>
  <text x="181" y="179" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>

  <text x="136" y="212" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Без ключа — легкий розворот</text>

  <!-- Картка 1B: Futaba -->
  <rect x="252" y="112" width="200" height="112" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="352" y="130" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Futaba (з поляризатором)</text>
  <text x="352" y="146" font-size="12" fill="#6b7280" text-anchor="middle">Напрямний виступ (ключ)</text>

  <!-- Корпус Futaba з виступом -->
  <rect x="274" y="167" width="8" height="16" rx="1" fill="#2c3e50" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="282" y="156" width="140" height="38" rx="3" fill="#2c3e50" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="290" y="162" width="34" height="26" rx="2" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="307" y="179" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1</text>
  <rect x="335" y="162" width="34" height="26" rx="2" fill="#c0392b"/>
  <text x="352" y="179" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>
  <rect x="380" y="162" width="34" height="26" rx="2" fill="#1a1a1a"/>
  <text x="397" y="179" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>

  <text x="352" y="212" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Ключ блокує помилковий вхід</text>

  <!-- Картка 1C: Таблиця проводів та сигналів -->
  <rect x="36" y="236" width="416" height="190" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="48" y="256" font-size="12" font-weight="bold" fill="#6b7280">Пін</text>
  <text x="100" y="256" font-size="12" font-weight="bold" fill="#6b7280">Сигнал / Рівень</text>
  <text x="238" y="256" font-size="12" font-weight="bold" fill="#6b7280">JR / Tower Pro</text>
  <text x="352" y="256" font-size="12" font-weight="bold" fill="#6b7280">Futaba</text>
  <line x1="46" y1="264" x2="442" y2="264" stroke="#d0d7de" stroke-width="1"/>

  <!-- Рядок 1 -->
  <rect x="48" y="274" width="26" height="18" rx="3" fill="#eaf0fd"/>
  <text x="61" y="287" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">1</text>
  <text x="100" y="282" font-size="12" font-weight="bold" fill="#1a1a1a">PWM (керування)</text>
  <text x="100" y="297" font-size="12" fill="#6b7280">3,3–5,0 В, 50 Гц</text>
  <rect x="238" y="278" width="12" height="12" rx="2" fill="#e67e22"/>
  <text x="256" y="289" font-size="12" fill="#1a1a1a">Помаранчевий</text>
  <rect x="352" y="278" width="12" height="12" rx="2" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="370" y="289" font-size="12" fill="#1a1a1a">Білий</text>
  <line x1="46" y1="307" x2="442" y2="307" stroke="#f0f2f5" stroke-width="1"/>

  <!-- Рядок 2 -->
  <rect x="48" y="316" width="26" height="18" rx="3" fill="#fdecea"/>
  <text x="61" y="329" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">2</text>
  <text x="100" y="324" font-size="12" font-weight="bold" fill="#c0392b">VCC (живлення)</text>
  <text x="100" y="339" font-size="12" fill="#6b7280">4,8–6,0 В (силове)</text>
  <rect x="238" y="320" width="12" height="12" rx="2" fill="#c0392b"/>
  <text x="256" y="331" font-size="12" font-weight="bold" fill="#c0392b">Червоний</text>
  <rect x="352" y="320" width="12" height="12" rx="2" fill="#c0392b"/>
  <text x="370" y="331" font-size="12" font-weight="bold" fill="#c0392b">Червоний</text>
  <line x1="46" y1="349" x2="442" y2="349" stroke="#f0f2f5" stroke-width="1"/>

  <!-- Рядок 3 -->
  <rect x="48" y="358" width="26" height="18" rx="3" fill="#f4f6f8"/>
  <text x="61" y="371" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3</text>
  <text x="100" y="366" font-size="12" font-weight="bold" fill="#1a1a1a">GND (земля)</text>
  <text x="100" y="381" font-size="12" fill="#6b7280">Спільна точка 0 В</text>
  <rect x="238" y="362" width="12" height="12" rx="2" fill="#795548"/>
  <text x="256" y="373" font-size="12" fill="#1a1a1a">Коричневий</text>
  <rect x="352" y="362" width="12" height="12" rx="2" fill="#1a1a1a"/>
  <text x="370" y="373" font-size="12" fill="#1a1a1a">Чорний</text>

  <!-- Підсумкова виноска 1C -->
  <rect x="46" y="394" width="396" height="24" rx="4" fill="#eaf0fd"/>
  <text x="244" y="410" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">VCC завжди в центрі: спільний стандарт для обох систем</text>

  <!-- ================= ПРАВА ПАНЕЛЬ: ДЕМОНСТРАЦІЯ СИМЕТРІЇ ================= -->
  <rect x="488" y="72" width="448" height="368" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="712" y="96" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Симетричне збереження живлення при розвороті на 180°</text>

  <!-- Картка 2A: Штатне підключення -->
  <rect x="500" y="112" width="424" height="142" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="516" y="132" font-size="13" font-weight="bold" fill="#1a1a1a">Штатне підключення: пряма орієнтація</text>
  <rect x="804" y="120" width="108" height="20" rx="3" fill="#e9f7ef"/>
  <text x="858" y="134" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">ШТАТНА РОБОТА</text>

  <!-- Гребінка МК (2A) -->
  <text x="555" y="152" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Гребінка МК</text>
  <rect x="516" y="162" width="78" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="555" y="176" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">1: PWM</text>
  <rect x="516" y="188" width="78" height="20" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="555" y="202" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">2: +5 В</text>
  <rect x="516" y="214" width="78" height="20" rx="3" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1"/>
  <text x="555" y="228" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3: GND</text>

  <!-- З&#39;єднувальні лінії (2A) -->
  <line x1="596" y1="172" x2="654" y2="172" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="596" y1="198" x2="654" y2="198" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <line x1="596" y1="224" x2="654" y2="224" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Вилка серво (2A) -->
  <text x="704" y="152" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Вилка серво</text>
  <rect x="662" y="162" width="84" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="704" y="176" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">1: Сигнал</text>
  <rect x="662" y="188" width="84" height="20" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="704" y="202" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">2: VCC (+5 В)</text>
  <rect x="662" y="214" width="84" height="20" rx="3" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1"/>
  <text x="704" y="228" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3: Земля</text>

  <!-- Результат (2A) -->
  <rect x="756" y="162" width="160" height="72" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="766" y="180" font-size="12" font-weight="bold" fill="#27ae60">Живлення: пряме</text>
  <text x="766" y="198" font-size="12" fill="#1a1a1a">Сигнал: імпульси 50 Гц</text>
  <text x="766" y="216" font-size="12" fill="#1a1a1a">Стан: вал тримає кут</text>

  <!-- Картка 2B: Дзеркальне підключення (розворот на 180°) -->
  <rect x="500" y="268" width="424" height="158" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="516" y="288" font-size="13" font-weight="bold" fill="#1a1a1a">Дзеркальне підключення: розворот вилки на 180°</text>
  <rect x="804" y="276" width="108" height="20" rx="3" fill="#eaf0fd"/>
  <text x="858" y="290" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">БЕЗПЕЧНИЙ СТАН</text>

  <!-- Гребінка МК (2B) — нерухома на платі -->
  <text x="555" y="308" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Гребінка МК</text>
  <rect x="516" y="318" width="78" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="555" y="332" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">1: PWM</text>
  <rect x="516" y="344" width="78" height="20" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="555" y="358" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">2: +5 В</text>
  <rect x="516" y="370" width="78" height="20" rx="3" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1"/>
  <text x="555" y="384" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3: GND</text>

  <!-- З&#39;єднувальні лінії (2B) -->
  <line x1="596" y1="328" x2="654" y2="328" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr)"/>
  <line x1="596" y1="354" x2="654" y2="354" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-red)"/>
  <line x1="596" y1="380" x2="654" y2="380" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr)"/>

  <!-- Вилка серво (2B) — розвернута на 180° -->
  <text x="704" y="308" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Вилка (180°)</text>
  <rect x="662" y="318" width="84" height="20" rx="3" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1"/>
  <text x="704" y="332" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3: Земля</text>
  <rect x="662" y="344" width="84" height="20" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="704" y="358" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">2: VCC (+5 В)</text>
  <rect x="662" y="370" width="84" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="704" y="384" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">1: Сигнал</text>

  <!-- Результат (2B) -->
  <rect x="756" y="318" width="160" height="72" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="766" y="336" font-size="12" font-weight="bold" fill="#2457d6">Полярність: ЗБЕРЕЖЕНО</text>
  <text x="766" y="354" font-size="12" fill="#1a1a1a">VCC не потрапляє на GND</text>
  <text x="766" y="372" font-size="12" fill="#1a1a1a">КЗ немає, плата ціла</text>

  <!-- Підсумкова виноска 2B -->
  <rect x="512" y="396" width="400" height="22" rx="3" fill="#e9f7ef"/>
  <text x="712" y="411" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Висновок: привод не пошкоджується, але не реагує на сигнал</text>
</svg>
