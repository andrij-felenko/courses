  <rect x="0" y="0" width="960" height="560" fill="white"/>
  <text x="480" y="34" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Профілі руху сервопривода: кут, швидкість і прискорення</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Обмеження ривка усуває розриви прискорення та запобігає ударному зносу редуктора</text>
