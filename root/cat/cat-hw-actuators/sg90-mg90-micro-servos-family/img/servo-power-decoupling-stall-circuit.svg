<svg width="960" height="560" viewBox="0 0 960 560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема розділення живлення та розв'язки сервоприводів</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Окремі гілки VCC, Schottky-діод та буферні конденсатори запобігають Brown-out MCU</text>

  <!-- Box A: Power Source -->
  <rect x="40" y="85" width="160" height="130" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="120" y="110" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Джерело живлення</text>
  <text x="120" y="128" font-size="12" fill="#6b7280" text-anchor="middle">5V DC / 3A</text>
  <text x="185" y="134" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">+5V</text>
  <text x="185" y="189" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">GND</text>
  <circle cx="200" cy="130" r="4" fill="#2457d6"/>
  <circle cx="200" cy="185" r="4" fill="#1a1a1a"/>

  <!-- Box B: Microcontroller -->
  <rect x="500" y="85" width="160" height="130" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="580" y="110" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мікроконтролер</text>
  <text x="580" y="128" font-size="12" fill="#6b7280" text-anchor="middle">MCU (Arduino/ESP)</text>
  <text x="515" y="134" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">VCC</text>
  <text x="515" y="189" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">GND</text>
  <text x="645" y="159" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">D9 (ШІМ)</text>
  <circle cx="500" cy="130" r="4" fill="#2457d6"/>
  <circle cx="500" cy="185" r="4" fill="#1a1a1a"/>
  <circle cx="660" cy="155" r="4" fill="#2457d6"/>

  <!-- Box C: Servo Motor -->
  <rect x="760" y="85" width="160" height="210" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="840" y="110" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Сервопривод</text>
  <text x="840" y="128" font-size="12" fill="#6b7280" text-anchor="middle">SG90 / MG90S</text>
  <text x="775" y="159" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">SIG</text>
  <text x="775" y="239" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">VCC</text>
  <text x="775" y="279" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">GND</text>
  <circle cx="760" cy="155" r="4" fill="#2457d6"/>
  <circle cx="760" cy="235" r="4" fill="#c0392b"/>
  <circle cx="760" cy="275" r="4" fill="#1a1a1a"/>
  <!-- Motor Icon inside Servo Box -->
  <circle cx="840" cy="165" r="16" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="840" y="169" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">M</text>
  <text x="840" y="200" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">I_stall ≈ 0.65–1.2A</text>

  <!-- Badges -->
  <!-- V_MCU Stable Badge -->
  <rect x="310" y="80" width="160" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="390" y="95" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Стабільна V_MCU = 5.0V</text>

  <!-- Stall Current Loop Badge -->
  <rect x="535" y="295" width="135" height="22" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="602" y="310" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Локальне коло I_stall</text>

  <!-- Wires & Components -->

  <!-- Power Source to Node P1 -->
  <line x1="200" y1="130" x2="230" y2="130" stroke="#2457d6" stroke-width="2"/>
  <circle cx="230" cy="130" r="4" fill="#2457d6"/>

  <!-- Upper Digital Power Rail (P1 -> Diode D1 -> P2 -> MCU VCC) -->
  <line x1="230" y1="130" x2="255" y2="130" stroke="#2457d6" stroke-width="2"/>
  <!-- Diode D1 Symbol -->
  <polygon points="255,122 255,138 275,130" fill="#2457d6" stroke="#2457d6" stroke-width="1"/>
  <line x1="275" y1="122" x2="275" y2="138" stroke="#2457d6" stroke-width="3"/>
  <text x="265" y="112" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">D1 (1N5819)</text>
  <text x="265" y="152" font-size="11" fill="#6b7280" text-anchor="middle">Шотткі (V_drop ≈ 0.3V)</text>

  <line x1="275" y1="130" x2="370" y2="130" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <circle cx="370" cy="130" r="4" fill="#2457d6"/>
  <line x1="370" y1="130" x2="500" y2="130" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- MCU Decoupling Branch (C1 & C2) -->
  <line x1="370" y1="130" x2="370" y2="165" stroke="#2457d6" stroke-width="2"/>
  <circle cx="370" cy="165" r="3" fill="#2457d6"/>
  <line x1="340" y1="165" x2="400" y2="165" stroke="#2457d6" stroke-width="2"/>

  <!-- C1 (100 uF Electrolytic) -->
  <line x1="340" y1="165" x2="340" y2="195" stroke="#2457d6" stroke-width="2"/>
  <line x1="330" y1="195" x2="350" y2="195" stroke="#2457d6" stroke-width="3"/>
  <text x="323" y="193" font-size="11" font-weight="bold" fill="#2457d6">+</text>
  <line x1="330" y1="205" x2="350" y2="205" stroke="#2457d6" stroke-width="3"/>
  <line x1="340" y1="205" x2="340" y2="340" stroke="#2457d6" stroke-width="2"/>
  <text x="320" y="198" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">C1 (100 µF)</text>
  <text x="320" y="214" font-size="12" fill="#6b7280" text-anchor="end">Електроліт</text>

  <!-- C2 (0.1 uF Ceramic) -->
  <line x1="400" y1="165" x2="400" y2="195" stroke="#2457d6" stroke-width="2"/>
  <line x1="390" y1="195" x2="410" y2="195" stroke="#2457d6" stroke-width="3"/>
  <line x1="390" y1="205" x2="410" y2="205" stroke="#2457d6" stroke-width="3"/>
  <line x1="400" y1="205" x2="400" y2="340" stroke="#2457d6" stroke-width="2"/>
  <text x="420" y="198" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">C2 (0.1 µF)</text>
  <text x="420" y="214" font-size="12" fill="#6b7280" text-anchor="start">Кераміка</text>

  <!-- PWM Signal Line (MCU D9 -> Servo SIG) -->
  <line x1="660" y1="155" x2="685" y2="155" stroke="#2457d6" stroke-width="2"/>
  <rect x="685" y="149" width="30" height="12" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="715" y1="155" x2="760" y2="155" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="700" y="140" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">R_sig (220 Ω)</text>
  <text x="700" y="174" font-size="11" fill="#6b7280" text-anchor="middle">Захист ШІМ</text>

  <!-- Lower Heavy Power Rail (Node P1 -> Servo VCC) -->
  <line x1="230" y1="130" x2="230" y2="235" stroke="#c0392b" stroke-width="3"/>
  <line x1="230" y1="235" x2="760" y2="235" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-red)"/>
  <text x="242" y="256" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">Силова шина V_SERVO</text>

  <!-- Servo Bulk Capacitor C_BULK -->
  <circle cx="695" cy="235" r="4" fill="#c0392b"/>
  <line x1="695" y1="235" x2="695" y2="255" stroke="#c0392b" stroke-width="2"/>
  <line x1="685" y1="255" x2="705" y2="255" stroke="#c0392b" stroke-width="3"/>
  <text x="677" y="253" font-size="11" font-weight="bold" fill="#c0392b">+</text>
  <line x1="685" y1="265" x2="705" y2="265" stroke="#c0392b" stroke-width="3"/>
  <line x1="695" y1="265" x2="695" y2="340" stroke="#c0392b" stroke-width="2"/>
  <text x="675" y="258" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">C_BULK (470–1000 µF)</text>
  <text x="675" y="274" font-size="12" fill="#6b7280" text-anchor="end">Буфер струму I_stall</text>

  <!-- Stall Current Local Loop (Dashed Arc) -->
  <path d="M 760,235 C 730,245 720,280 695,285 C 680,285 675,260 695,245" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Heavy Ground Line (Star Ground Topology) -->
  <line x1="120" y1="185" x2="120" y2="340" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="120" y1="340" x2="840" y2="340" stroke="#1a1a1a" stroke-width="3"/>

  <circle cx="120" cy="340" r="4" fill="#1a1a1a"/>
  <circle cx="340" cy="340" r="4" fill="#1a1a1a"/>
  <circle cx="400" cy="340" r="4" fill="#1a1a1a"/>
  <line x1="500" y1="185" x2="500" y2="340" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="500" cy="340" r="4" fill="#1a1a1a"/>
  <circle cx="695" cy="340" r="4" fill="#1a1a1a"/>
  <line x1="760" y1="275" x2="760" y2="340" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="760" cy="340" r="4" fill="#1a1a1a"/>

  <text x="480" y="365" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Спільна точка заземлення (Star GND)</text>

  <!-- Bottom Informational Cards -->
  <!-- Card 1 -->
  <rect x="40" y="390" width="420" height="150" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="60" y="414" font-size="14" font-weight="bold" fill="#2457d6">Захист мікроконтролера від Brown-out</text>
  <text x="60" y="438" font-size="12" fill="#1a1a1a">• Діод D1 (Шотткі) блокує зворотний розряд C1</text>
  <text x="72" y="454" font-size="12" fill="#1a1a1a">у бік двигуна при пікових просіданнях V_IN.</text>
  <text x="60" y="478" font-size="12" fill="#1a1a1a">• Конденсатори C1 (100 µF) та C2 (0.1 µF) утримують</text>
  <text x="72" y="494" font-size="12" fill="#1a1a1a">напругу VCC MCU під час високочастотних завад.</text>
  <text x="60" y="518" font-size="12" fill="#1a1a1a">• Резистор R_sig (220 Ω) захищає ШІМ-вихід від наводок.</text>

  <!-- Card 2 -->
  <rect x="500" y="390" width="420" height="150" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="520" y="414" font-size="14" font-weight="bold" fill="#27ae60">Живлення сервопривода та Star GND</text>
  <text x="520" y="438" font-size="12" fill="#1a1a1a">• Буферний C_BULK (470–1000 µF) миттєво віддає струм</text>
  <text x="532" y="454" font-size="12" fill="#1a1a1a">заклинювання I_stall (до 1.2A) при старті двигуна.</text>
  <text x="520" y="478" font-size="12" fill="#1a1a1a">• Зіркове заземлення (Star GND) зводить силові й сигнальні</text>
  <text x="532" y="494" font-size="12" fill="#1a1a1a">струми в одну точку, усуваючи тремтіння вала (jitter).</text>
  <text x="520" y="518" font-size="12" fill="#1a1a1a">• Окрема силова шина ізолює цифровий мікроконтролер.</text>

</svg>
