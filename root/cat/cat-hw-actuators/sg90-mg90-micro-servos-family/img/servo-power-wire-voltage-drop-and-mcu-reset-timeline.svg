<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Canvas background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма пускового струму сервопривода та просідання напруги MCU</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Піковий струм I_stall створює падіння ΔV = I · R_wire, що викликає перезавантаження MCU (BOR)</text>

  <!-- Main plot area background panel -->
  <rect x="35" y="70" width="890" height="355" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Shaded MCU Reset Zone (BOR Region) -->
  <rect x="295" y="80" width="170" height="305" rx="6" fill="#fdecea" fill-opacity="0.75" stroke="#c0392b" stroke-dasharray="4,4" stroke-width="1.5"/>
  <text x="380" y="98" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">ЗОНА СКИДАННЯ MCU (BOR)</text>

  <!-- Divider line between plots -->
  <line x1="140" y1="230" x2="860" y2="230" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- ================= TOP PLOT: CURRENT I_servo(t) ================= -->
  <!-- Axes -->
  <line x1="140" y1="95" x2="140" y2="210" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="140" y1="210" x2="865" y2="210" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="130" y="92" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="end">Струм I (A)</text>
  <text x="875" y="214" font-size="12" fill="#6b7280" text-anchor="start">Час (t)</text>

  <!-- Y-axis Ticks & Labels (Current) -->
  <line x1="135" y1="120" x2="140" y2="120" stroke="#6b7280" stroke-width="1"/>
  <text x="130" y="124" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">I_stall (1.2 A)</text>

  <line x1="135" y1="185" x2="140" y2="185" stroke="#6b7280" stroke-width="1"/>
  <text x="130" y="189" font-size="12" fill="#1a1a1a" text-anchor="end">I_run (0.2 A)</text>

  <text x="130" y="214" font-size="12" fill="#6b7280" text-anchor="end">0 A</text>

  <!-- Peak Current Callout Line & Annotation -->
  <line x1="350" y1="120" x2="480" y2="120" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="490" y="116" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">Пусковий кидок струму (I_stall = 1.2 A)</text>

  <!-- Current Curve Path -->
  <path d="M 140 185 L 220 185 Q 260 185 350 120 L 410 120 Q 460 120 510 185 L 850 185" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <text x="600" y="173" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">I_servo(t) — струм сервопривода</text>


  <!-- ================= BOTTOM PLOT: VOLTAGE V_mcu(t) ================= -->
  <!-- Axes -->
  <line x1="140" y1="255" x2="140" y2="385" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="140" y1="385" x2="865" y2="385" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="130" y="252" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="end">Напруга V (V)</text>
  <text x="875" y="389" font-size="12" fill="#6b7280" text-anchor="start">Час (t)</text>

  <!-- V_BOR Threshold Line (Dashed Across Chart) -->
  <line x1="140" y1="305" x2="860" y2="305" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="850" y="298" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">Поріг BOR (4.3 V)</text>

  <!-- Y-axis Ticks & Labels (Voltage) -->
  <line x1="135" y1="268" x2="140" y2="268" stroke="#6b7280" stroke-width="1"/>
  <text x="130" y="272" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">V_cc (5.0 V)</text>

  <line x1="135" y1="305" x2="140" y2="305" stroke="#c0392b" stroke-width="1.5"/>
  <text x="130" y="309" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">V_BOR (4.3 V)</text>

  <line x1="135" y1="350" x2="140" y2="350" stroke="#6b7280" stroke-width="1"/>
  <text x="130" y="354" font-size="12" fill="#c0392b" text-anchor="end">V_min (3.4 V)</text>

  <text x="130" y="389" font-size="12" fill="#6b7280" text-anchor="end">0 V</text>

  <!-- Voltage Drop Delta Arrow & Label -->
  <line x1="530" y1="268" x2="530" y2="350" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <path d="M 530 268 L 526 276 L 534 276 Z" fill="#c0392b"/>
  <path d="M 530 350 L 526 342 L 534 342 Z" fill="#c0392b"/>
  <text x="542" y="313" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">ΔV_wire = I_stall × R_wire (1.6 V)</text>

  <!-- Voltage Curve Path -->
  <path d="M 140 268 L 220 268 Q 260 268 350 350 L 410 350 Q 460 350 510 268 L 850 268" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="600" y="258" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">V_mcu(t) — напруга живлення MCU</text>

  <!-- Intersection Dots with BOR Threshold -->
  <circle cx="310" cy="305" r="4" fill="#c0392b"/>
  <circle cx="450" cy="305" r="4" fill="#27ae60"/>

  <!-- Vertical Event Markers to X-axis -->
  <line x1="220" y1="95" x2="220" y2="385" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="220" y="408" font-size="12" fill="#1a1a1a" text-anchor="middle">t_1 (Пуск)</text>

  <line x1="310" y1="80" x2="310" y2="385" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="310" y="408" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">t_RESET (BOR)</text>

  <line x1="450" y1="80" x2="450" y2="385" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="450" y="408" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">t_OK (OK)</text>


  <!-- ================= BOTTOM PANEL: FORMULAS & SOLUTIONS ================= -->
  <rect x="35" y="440" width="890" height="85" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>

  <!-- Column 1: Cause -->
  <text x="55" y="462" font-size="13" font-weight="bold" fill="#c0392b">Причина просідання:</text>
  <text x="55" y="483" font-size="12" fill="#1a1a1a">R_wire дротів (тонкі/довгі) + I_stall</text>
  <text x="55" y="504" font-size="12" font-weight="bold" fill="#c0392b">V_mcu = V_cc - (I_stall × R_wire) &lt; V_BOR</text>

  <!-- Column 2: Math Formula Box -->
  <rect x="355" y="450" width="230" height="65" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="470" y="469" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Формула спаду напруги</text>
  <text x="470" y="496" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ΔV = I_stall × (2 × R_wire)</text>

  <!-- Column 3: Solutions -->
  <text x="610" y="462" font-size="13" font-weight="bold" fill="#27ae60">Способи запобігання:</text>
  <text x="610" y="483" font-size="12" fill="#1a1a1a">• Окреме живлення MCU та сервопривода</text>
  <text x="610" y="504" font-size="12" fill="#1a1a1a">• Буферний конденсатор C &gt; 470 мкФ біля MCU</text>
</svg>
