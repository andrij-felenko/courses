<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Markers -->
  <defs>
    <marker id="arr-gray-right" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-gray-left" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M7,1 L0,4 L7,7 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-red-right" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-red-left" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M7,1 L0,4 L7,7 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green-right" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-green-left" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M7,1 L0,4 L7,7 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Реакція аналогового та цифрового сервопривода на зовнішнє навантаження</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Аналогова схема оновлює струм мотора лише 50 разів на секунду (що 20 мс), спричиняючи затримку відгуку та м'яке утримання</text>
  <text x="480" y="70" font-size="13" fill="#6b7280" text-anchor="middle">Цифровий контролер генерує імпульси мотора з частотою ~300 Гц (що 3.3 мс), забезпечуючи жорстке утримання позиції</text>

  <!-- Panel 1: Analog Servo -->
  <rect x="30" y="90" width="900" height="215" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  
  <!-- Panel 1 Title & Badge -->
  <text x="50" y="112" font-size="14" font-weight="bold" fill="#c0392b">1. Аналоговий сервопривод (SG90, SG92R, MG90S) — Оновлення 50 Гц</text>
  <rect x="665" y="96" width="250" height="22" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="790" y="112" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Повільний відгук (затримка до 20 мс)</text>

  <!-- Panel 1 Signals -->
  <!-- Signal 1: Input PWM -->
  <text x="50" y="136" font-size="12" font-weight="bold" fill="#1a1a1a">Вхідний ШІМ від МК (50 Гц)</text>
  <path d="M 250,138 L 270,138 L 270,126 L 290,126 L 290,138 L 570,138 L 570,126 L 590,126 L 590,138 L 880,138" fill="none" stroke="#2457d6" stroke-width="2"/>
  <line x1="270" y1="146" x2="570" y2="146" stroke="#6b7280" stroke-width="1" marker-start="url(#arr-gray-left)" marker-end="url(#arr-gray-right)"/>
  <text x="420" y="158" font-size="12" fill="#6b7280" text-anchor="middle">Період T = 20 мс (50 Гц)</text>

  <!-- Signal 2: External Shaft Shift -->
  <text x="480" y="180" font-size="12" fill="#c0392b" text-anchor="middle">Зовнішній зсув вала (t = 8 мс)</text>
  <text x="50" y="192" font-size="12" font-weight="bold" fill="#1a1a1a">Зовнішнє відхилення вала</text>
  <path d="M 250,200 L 390,200 L 390,188 L 570,188 L 590,200 L 880,200" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Signal 3: Motor Power Pulses -->
  <text x="50" y="246" font-size="12" font-weight="bold" fill="#1a1a1a">Імпульси на мотор (50 Гц)</text>
  <path d="M 250,248 L 270,248 L 270,234 L 290,234 L 290,248 L 570,248 L 570,234 L 600,234 L 600,248 L 880,248" fill="none" stroke="#c0392b" stroke-width="2"/>
  
  <!-- Reaction delay annotation -->
  <line x1="390" y1="200" x2="390" y2="258" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="570" y1="200" x2="570" y2="258" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="390" y1="260" x2="570" y2="260" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-red-left)" marker-end="url(#arr-red-right)"/>
  <text x="480" y="274" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Затримка відгуку 12 мс (мотор не отримує живлення до наступного кадру)</text>


  <!-- Panel 2: Digital Servo -->
  <rect x="30" y="325" width="900" height="215" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  
  <!-- Panel 2 Title & Badge -->
  <text x="50" y="347" font-size="14" font-weight="bold" fill="#27ae60">2. Цифровий сервопривод (MG90D) — Оновлення мотора ~300 Гц</text>
  <rect x="665" y="331" width="250" height="22" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="790" y="347" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Миттєвий відгук (затримка &lt; 1 мс)</text>

  <!-- Panel 2 Signals -->
  <!-- Signal 1: Input PWM -->
  <text x="50" y="371" font-size="12" font-weight="bold" fill="#1a1a1a">Вхідний ШІМ від МК (50 Гц)</text>
  <path d="M 250,373 L 270,373 L 270,361 L 290,361 L 290,373 L 570,373 L 570,361 L 590,361 L 590,373 L 880,373" fill="none" stroke="#2457d6" stroke-width="2"/>
  <line x1="270" y1="381" x2="570" y2="381" stroke="#6b7280" stroke-width="1" marker-start="url(#arr-gray-left)" marker-end="url(#arr-gray-right)"/>
  <text x="420" y="393" font-size="12" fill="#6b7280" text-anchor="middle">Період T = 20 мс (50 Гц)</text>

  <!-- Signal 2: External Shaft Shift (Rapidly Corrected) -->
  <text x="480" y="415" font-size="12" fill="#27ae60" text-anchor="middle">Зсув вала долається за ~2.5 мс</text>
  <text x="50" y="427" font-size="12" font-weight="bold" fill="#1a1a1a">Зовнішній зсув вала</text>
  <path d="M 250,435 L 390,435 L 390,423 L 425,423 L 430,435 L 880,435" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3"/>

  <!-- Signal 3: High Frequency Motor Pulses (~300 Hz) -->
  <text x="50" y="481" font-size="12" font-weight="bold" fill="#1a1a1a">Імпульси на мотор (~300 Гц)</text>
  <path d="M 250,483 L 270,483 L 270,469 L 280,469 L 280,483 L 320,483 L 320,469 L 330,469 L 330,483 L 370,483 L 370,469 L 380,469 L 380,483 L 390,483 L 390,469 L 425,469 L 425,483 L 470,483 L 470,469 L 480,469 L 480,483 L 520,483 L 520,469 L 530,469 L 530,483 L 570,483 L 570,469 L 580,469 L 580,483 L 620,483 L 620,469 L 630,469 L 630,483 L 670,483 L 670,469 L 680,469 L 680,483 L 720,483 L 720,469 L 730,469 L 730,483 L 770,483 L 770,469 L 780,469 L 780,483 L 820,483 L 820,469 L 830,469 L 830,483 L 880,483" fill="none" stroke="#27ae60" stroke-width="2"/>

  <!-- Pulse period annotation for 300Hz -->
  <line x1="320" y1="493" x2="370" y2="493" stroke="#27ae60" stroke-width="1" marker-start="url(#arr-green-left)" marker-end="url(#arr-green-right)"/>
  <text x="345" y="505" font-size="12" fill="#27ae60" text-anchor="middle">t = 3.3 мс (300 Гц)</text>
  
  <!-- Rapid reaction annotation -->
  <line x1="390" y1="435" x2="390" y2="493" stroke="#27ae60" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="630" y="521" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Миттєва реакція: сервоконтролер генерує серію високовольтних імпульсів</text>
</svg>
