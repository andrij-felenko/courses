<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="530" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Захищене живлення мікросервоприводів: зіркова земля та локальна LC-фільтрація</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Зіркове об'єднання земель у точці джерела й LC-буфери блокують пускові струми та усувають збої BOR</text>

  <!-- ==================== ПАНЕЛЬ 1: ДЖЕРЕЛО ТА ЗІРКА ==================== -->
  <rect x="24" y="74" width="206" height="310" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="127" y="96" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ДЖЕРЕЛО ТА ВУЗОЛ «ЗІРКА»</text>
  <text x="127" y="112" font-size="12" fill="#6b7280" text-anchor="middle">Топологія Star Ground</text>

  <!-- Блок БЖ -->
  <rect x="36" y="126" width="182" height="66" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="127" y="148" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">БЖ / Акумулятор 5–6 В</text>
  <text x="127" y="166" font-size="12" fill="#6b7280" text-anchor="middle">Струм до 3–5 А (піковий)</text>
  <text x="127" y="182" font-size="12" fill="#c0392b" text-anchor="middle">+V_IN (5–6 В)  |  0 В (GND)</text>

  <!-- Блок LDO -->
  <rect x="36" y="206" width="182" height="74" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="127" y="228" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">LDO-стабілізатор 3.3 В</text>
  <text x="127" y="246" font-size="12" fill="#6b7280" text-anchor="middle">Власна лінія живлення MCU</text>
  <text x="127" y="264" font-size="12" fill="#27ae60" text-anchor="middle">Захист від просідання шини</text>

  <!-- Блок вузла «Зірка» -->
  <rect x="36" y="294" width="182" height="76" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="127" y="314" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Точка Star GND (0 В)</text>
  <text x="127" y="330" font-size="12" fill="#1a1a1a" text-anchor="middle">Єдина точка контакту</text>
  <circle cx="127" cy="350" r="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <circle cx="127" cy="350" r="4" fill="#27ae60"/>

  <!-- ==================== ПАНЕЛЬ 2: МІКРОКОНТРОЛЕР ==================== -->
  <rect x="244" y="74" width="240" height="310" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="364" y="96" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">МІКРОКОНТРОЛЕР (MCU)</text>
  <text x="364" y="112" font-size="12" fill="#6b7280" text-anchor="middle">Логіка 3.3 В та захист BOR</text>

  <!-- Чип MCU -->
  <rect x="260" y="152" width="208" height="152" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="364" y="174" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">MCU (STM32 / ESP32)</text>

  <!-- Детектор BOR всередині MCU -->
  <rect x="274" y="188" width="180" height="38" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="364" y="204" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Детектор BOR (Brown-Out)</text>
  <text x="364" y="218" font-size="12" fill="#27ae60" text-anchor="middle">U_пор = 2.7 В (немає скидань!)</text>

  <!-- Піни MCU -->
  <text x="266" y="246" font-size="12" font-weight="bold" fill="#2457d6">VDD (3.3V)</text>
  <text x="266" y="286" font-size="12" font-weight="bold" fill="#27ae60">GND_мк (0 В)</text>
  <text x="462" y="260" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">PWM_OUT</text>

  <!-- Панель статусу землі логіки -->
  <rect x="256" y="316" width="216" height="54" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="364" y="336" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Чиста опорна земля (I = 0 А)</text>
  <text x="364" y="354" font-size="12" fill="#6b7280" text-anchor="middle">ΔV_GND = 0 В: захист від джитеру</text>

  <!-- ==================== ПАНЕЛЬ 3: ФІЛЬТРИ ТА СЕРВОПРИВОДИ ==================== -->
  <rect x="498" y="74" width="438" height="310" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="717" y="96" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ЛОКАЛЬНІ LC-ФІЛЬТРИ ТА СЕРВОПРИВОДИ</text>
  <text x="717" y="112" font-size="12" fill="#6b7280" text-anchor="middle">Буферизація пікового струму біля споживача</text>

  <!-- Сервопривід 1 (MG90S) -->
  <rect x="760" y="152" width="162" height="152" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="841" y="174" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Сервопривід MG90S</text>
  <text x="841" y="190" font-size="12" fill="#6b7280" text-anchor="middle">Металевий редуктор</text>
  <circle cx="841" cy="226" r="22" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="841" y="232" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">M</text>
  <text x="841" y="264" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">I_stall = 1.0–1.2 А</text>
  <text x="841" y="280" font-size="12" fill="#6b7280" text-anchor="middle">Вал 21 зуб (шліци)</text>

  <!-- Піни роз'єму DuPont на сервоприводі -->
  <text x="766" y="168" font-size="12" font-weight="bold" fill="#c0392b">VCC</text>
  <text x="766" y="260" font-size="12" font-weight="bold" fill="#2457d6">SIG</text>
  <text x="766" y="294" font-size="12" font-weight="bold" fill="#1a1a1a">GND</text>

  <!-- ==================== ПРОВІДНИКИ ТА КОМПОНЕНТИ ==================== -->

  <!-- Силова шина +V_SERVO (верхня червона лінія y=134) -->
  <line x1="218" y1="134" x2="520" y2="134" stroke="#c0392b" stroke-width="2"/>
  <line x1="556" y1="134" x2="760" y2="134" stroke="#c0392b" stroke-width="2"/>
  <text x="364" y="126" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Силова шина +V_SERVO (5–6 В)</text>

  <!-- Дросель L_choke на силовій шині -->
  <path d="M 520,134 q 4,-8 8,0 q 4,-8 8,0 q 4,-8 8,0 q 6,-8 12,0" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="538" y="122" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">L: 2.2 мкГн</text>

  <!-- Лінія живлення LDO від +V_IN -->
  <line x1="218" y1="160" x2="228" y2="160" stroke="#c0392b" stroke-width="1.5"/>
  <path d="M 228,160 L 228,242 L 218,242" fill="none" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Лінія виходу LDO OUT 3.3 В до VDD MCU -->
  <line x1="218" y1="242" x2="260" y2="242" stroke="#2457d6" stroke-width="2"/>

  <!-- Лінія чистої землі GND_logic від Star GND до MCU GND_мк -->
  <path d="M 135,350 L 232,350 L 232,284 L 260,284" fill="none" stroke="#27ae60" stroke-width="2"/>
  <text x="232" y="274" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">I = 0 А</text>

  <!-- Лінія PWM від MCU до сервопривода -->
  <line x1="468" y1="256" x2="502" y2="256" stroke="#2457d6" stroke-width="1.5"/>
  <!-- Резистор R_pwm -->
  <rect x="502" y="250" width="26" height="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="515" y="244" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">R_pwm</text>
  <line x1="528" y1="256" x2="760" y2="256" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="515" y="274" font-size="12" fill="#6b7280" text-anchor="middle">100 Ом</text>
  <text x="615" y="248" font-size="12" fill="#2457d6" text-anchor="middle">ШІМ 50 Гц</text>

  <!-- Блок фільтра: C_bulk та C_hf -->
  <!-- Конденсатор C_bulk (470 мкФ) біля x=570 -->
  <line x1="570" y1="134" x2="570" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="560" y1="200" x2="580" y2="200" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="560" y1="206" x2="580" y2="206" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="570" y1="206" x2="570" y2="368" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="554" y="196" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">C_bulk</text>
  <text x="554" y="210" font-size="12" fill="#1a1a1a" text-anchor="end">470 мкФ</text>
  <text x="554" y="224" font-size="12" fill="#6b7280" text-anchor="end">Low-ESR</text>

  <!-- Конденсатор C_hf (100 нФ) біля x=660 -->
  <line x1="660" y1="134" x2="660" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="650" y1="200" x2="670" y2="200" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="650" y1="206" x2="670" y2="206" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="660" y1="206" x2="660" y2="368" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="676" y="196" font-size="12" font-weight="bold" fill="#2457d6">C_hf</text>
  <text x="676" y="210" font-size="12" fill="#1a1a1a">100 нФ</text>
  <text x="676" y="224" font-size="12" fill="#6b7280">Кераміка</text>

  <!-- З'єднання VCC і GND до сервопривода -->
  <line x1="760" y1="134" x2="760" y2="164" stroke="#c0392b" stroke-width="2"/>
  <line x1="760" y1="294" x2="760" y2="368" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Силова шина PGND (нижня лінія y=368) -->
  <line x1="127" y1="358" x2="127" y2="368" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="127" y1="368" x2="760" y2="368" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="570" cy="368" r="3.5" fill="#1a1a1a"/>
  <circle cx="660" cy="368" r="3.5" fill="#1a1a1a"/>
  <circle cx="760" cy="368" r="3.5" fill="#1a1a1a"/>

  <!-- Стрілка зворотного силового струму по PGND -->
  <line x1="740" y1="358" x2="520" y2="358" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <text x="630" y="380" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Зворотний струм I_stall тече по PGND</text>

  <!-- ==================== ПАНЕЛЬ 4: МЕХАНІЗМ GROUND BOUNCE ==================== -->
  <rect x="24" y="396" width="460" height="114" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="254" y="416" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">❌ ЧОМУ ВИНИКАЄ GROUND BOUNCE (ШЛЕЙФ)</text>
  <text x="40" y="438" font-size="12" font-weight="bold" fill="#1a1a1a">Формула: V_bounce = L_trace · (di/dt) + I_stall · R_trace</text>
  <text x="40" y="458" font-size="12" fill="#1a1a1a">• Спільна земля: струм 1.2 А зміщує нуль МК на 1–2 В вгору</text>
  <text x="40" y="478" font-size="12" fill="#1a1a1a">• Спотворення ШІМ: рівень падає нижче V_IH → джитер вала</text>
  <text x="40" y="498" font-size="12" fill="#c0392b">• Скидання BOR: просідання VDD викликає циклічний рестарт</text>

  <!-- ==================== ПАНЕЛЬ 5: 4 БАР'ЄРИ ЗАХИСТУ ==================== -->
  <rect x="498" y="396" width="438" height="114" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="717" y="416" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">✔ 4 БАР'ЄРИ ЗАХИСТУ МІКРОКОНТРОЛЕРА</text>
  <text x="514" y="438" font-size="12" fill="#1a1a1a">1. Зіркова земля: розрив петель, чистий нуль (ΔV = 0 В)</text>
  <text x="514" y="458" font-size="12" fill="#1a1a1a">2. Роздільні шини: LDO тримає 3.3 В під час пусків серв</text>
  <text x="514" y="478" font-size="12" fill="#1a1a1a">3. LC-буфер (470 мкФ + 100 нФ): згладжує спади й шум щіток</text>
  <text x="514" y="498" font-size="12" fill="#1a1a1a">4. Резистор R_pwm (100 Ом): придушує дзвін і відбиття ШІМ</text>
</svg>
