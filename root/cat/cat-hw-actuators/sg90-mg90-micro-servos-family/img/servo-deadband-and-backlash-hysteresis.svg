<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="960" height="480" fill="white"/>

<defs>
  <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
  </marker>
  <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
  </marker>
  <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
  </marker>
  <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
  </marker>
  <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
  </marker>
</defs>

<!-- Заголовок і підзаголовок -->
<text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Статична передавальна характеристика: зона нечутливості та гістерезис</text>
<text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Вікно нечутливості t_db і механічний люфт θ_backlash формують сумарний коридор похибки Δθ_stat</text>

<!-- ==========================================
     ЛІВА ПАНЕЛЬ: ГРАФІК ХАРАКТЕРИСТИКИ
     ========================================== -->
<rect x="24" y="72" width="580" height="388" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

<!-- Шапка лівої панелі -->
<rect x="36" y="84" width="556" height="28" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="314" y="103" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Залежність кута повороту вала θ від тривалості імпульсу T_pulse</text>

<!-- Сітка та допоміжний фон мертвої зони t_db -->
<path d="M 292,136 L 348,136 L 348,380 L 292,380 Z" fill="#fdecea" fill-opacity="0.6"/>
<line x1="292" y1="136" x2="292" y2="380" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="348" y1="136" x2="348" y2="380" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>

<!-- Тіло петлі гістерезису -->
<path d="M 244,296 L 292,272 L 348,272 L 460,216 L 396,216 L 348,240 L 292,240 L 180,296 Z" fill="#eaf0fd" stroke="none"/>

<!-- Ідеальна лінійна характеристика без люфту -->
<line x1="160" y1="336" x2="480" y2="176" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,4"/>

<!-- Осі координат -->
<line x1="80" y1="380" x2="560" y2="380" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
<line x1="80" y1="380" x2="80" y2="128" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>

<!-- Підписи осей -->
<text x="88" y="124" font-size="12" font-weight="bold" fill="#1a1a1a">Кут вала θ (°)</text>
<text x="320" y="424" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Тривалість вхідного імпульсу T_pulse (мкс) →</text>

<!-- Позначки на осі X -->
<line x1="180" y1="380" x2="180" y2="385" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="180" y="398" font-size="12" fill="#6b7280" text-anchor="middle">T_1</text>

<line x1="320" y1="380" x2="320" y2="385" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="320" y="398" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">T_0</text>

<line x1="460" y1="380" x2="460" y2="385" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="460" y="398" font-size="12" fill="#6b7280" text-anchor="middle">T_2</text>

<!-- Позначки на осі Y -->
<line x1="75" y1="320" x2="80" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="72" y="324" font-size="12" fill="#6b7280" text-anchor="end">θ_1</text>

<line x1="75" y1="256" x2="80" y2="256" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="72" y="260" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">θ_0</text>

<line x1="75" y1="192" x2="80" y2="192" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="72" y="196" font-size="12" fill="#6b7280" text-anchor="end">θ_2</text>

<!-- Прямий хід (збільшення T_pulse) -->
<path d="M 180,296 L 244,296 L 292,272 L 348,272 L 460,216" fill="none" stroke="#27ae60" stroke-width="2.5"/>
<line x1="244" y1="296" x2="270" y2="283" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
<line x1="348" y1="272" x2="406" y2="243" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>

<!-- Зворотний хід (зменшення T_pulse) -->
<path d="M 460,216 L 396,216 L 348,240 L 292,240 L 180,296" fill="none" stroke="#c0392b" stroke-width="2.5"/>
<line x1="396" y1="216" x2="370" y2="229" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
<line x1="292" y1="240" x2="234" y2="269" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>

<!-- Підписи вікна нечутливості t_db -->
<line x1="292" y1="162" x2="348" y2="162" stroke="#c0392b" stroke-width="1.5"/>
<line x1="292" y1="157" x2="292" y2="167" stroke="#c0392b" stroke-width="1.5"/>
<line x1="348" y1="157" x2="348" y2="167" stroke="#c0392b" stroke-width="1.5"/>
<text x="320" y="152" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">t_db</text>
<text x="320" y="180" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">OFF</text>

<!-- Виносний блок формул коридору похибки у вільній зоні -->
<rect x="94" y="136" width="186" height="78" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="104" y="154" font-size="12" font-weight="bold" fill="#1a1a1a">Коридор спокою вала:</text>
<text x="104" y="172" font-size="12" fill="#c0392b">Δθ_db = t_db ÷ K_pulse</text>
<text x="104" y="190" font-size="12" fill="#1a1a1a">θ_backlash (люфт)</text>
<text x="104" y="206" font-size="12" font-weight="bold" fill="#27ae60">Δθ_stat = Δθ_db + θ_backlash</text>

<!-- Легенда на графіку праворуч -->
<line x1="472" y1="140" x2="497" y2="140" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,4"/>
<text x="502" y="144" font-size="12" fill="#6b7280">Ідеальна лінія</text>

<line x1="472" y1="162" x2="497" y2="162" stroke="#27ae60" stroke-width="2.5"/>
<text x="502" y="166" font-size="12" font-weight="bold" fill="#27ae60">Прямий хід</text>

<line x1="472" y1="184" x2="497" y2="184" stroke="#c0392b" stroke-width="2.5"/>
<text x="502" y="188" font-size="12" font-weight="bold" fill="#c0392b">Зворотний хід</text>

<!-- Розмірні лінії люфту θ_backlash та мертвої зони Δθ_db -->
<line x1="462" y1="216" x2="480" y2="216" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
<line x1="462" y1="248" x2="480" y2="248" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
<line x1="462" y1="276" x2="480" y2="276" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>

<!-- Стрілки розмірів -->
<line x1="476" y1="216" x2="476" y2="248" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="472" y1="216" x2="480" y2="216" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="472" y1="248" x2="480" y2="248" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="486" y="236" font-size="12" font-weight="bold" fill="#1a1a1a">θ_backlash</text>

<line x1="476" y1="248" x2="476" y2="276" stroke="#c0392b" stroke-width="1.5"/>
<line x1="472" y1="276" x2="480" y2="276" stroke="#c0392b" stroke-width="1.5"/>
<text x="486" y="266" font-size="12" font-weight="bold" fill="#c0392b">Δθ_db</text>

<!-- Загальний підсумок коридору праворуч -->
<text x="476" y="302" font-size="12" font-weight="bold" fill="#27ae60">↕ Δθ_stat (коридор)</text>

<!-- ==========================================
     ПРАВА ПАНЕЛЬ: РОЗРАХУНОК ТА СКЛАДОВІ
     ========================================== -->
<rect x="620" y="72" width="316" height="388" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

<!-- Шапка правої панелі -->
<rect x="632" y="84" width="292" height="28" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="778" y="103" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Формування похибки позиціювання</text>

<!-- Блок 1: Електрична зона нечутливості -->
<rect x="632" y="122" width="292" height="84" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="644" y="140" font-size="12" font-weight="bold" fill="#c0392b">1. Електрична зона нечутливості t_db</text>
<text x="644" y="158" font-size="12" fill="#1a1a1a">• Вікно компаратора: t_db ≈ 1–5 мкс</text>
<text x="644" y="176" font-size="12" fill="#1a1a1a">• Мотор знеструмлено при |ΔT| ≤ t_db/2</text>
<text x="644" y="194" font-size="12" font-weight="bold" fill="#c0392b">• Мертва зона: Δθ_db = t_db ÷ K_pulse</text>

<!-- Блок 2: Механічний люфт редуктора -->
<rect x="632" y="218" width="292" height="84" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<text x="644" y="236" font-size="12" font-weight="bold" fill="#1a1a1a">2. Механічний люфт θ_backlash</text>
<text x="644" y="254" font-size="12" fill="#1a1a1a">• Зазори зубчастих коліс редуктора</text>
<text x="644" y="272" font-size="12" fill="#1a1a1a">• SG90: 0.8°..1.5° | MG90S: 0.4°..0.8°</text>
<text x="644" y="290" font-size="12" fill="#6b7280">• Ротор крутиться, але вихідний вал стоїть</text>

<!-- Блок 3: Сумарний коридор статичної похибки -->
<rect x="632" y="314" width="292" height="132" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
<text x="644" y="332" font-size="12" font-weight="bold" fill="#27ae60">Сумарний статичний коридор</text>
<text x="644" y="352" font-size="12" font-weight="bold" fill="#1a1a1a">Δθ_stat = Δθ_db + θ_backlash</text>
<text x="644" y="372" font-size="12" fill="#1a1a1a">• При зміні знака ΔT привід не реагує</text>
<text x="644" y="390" font-size="12" fill="#1a1a1a">  до подолання повного зазору Δθ_stat</text>
<text x="644" y="410" font-size="12" fill="#c0392b">• Спроба регулювати з кроком &lt; Δθ_stat</text>
<text x="644" y="428" font-size="12" fill="#c0392b">  викликає тремтіння (hunting) вала</text>
</svg>
