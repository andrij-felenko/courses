  <text x="195" y="394" font-size="12" text-anchor="middle" fill="#c0392b" font-weight="700">Gвих</text>
  <text x="168" y="420" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">Концентрація згину в зубах</text>
  <text x="168" y="436" font-size="12" text-anchor="middle" fill="#1a1a1a">• Крихкий злам зубів при ударі</text>
  <text x="168" y="452" font-size="12" text-anchor="middle" fill="#6b7280">• Граничний момент M = 1.6 кг·см</text>
