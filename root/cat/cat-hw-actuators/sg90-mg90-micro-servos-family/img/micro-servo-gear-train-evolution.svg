  <text x="840" y="368" font-size="12" text-anchor="start" fill="#27ae60">σb ≫ навантаж.</text>
  <text x="696" y="388" font-size="12" text-anchor="middle" fill="#6b7280">M0</text>
  <text x="734" y="388" font-size="12" text-anchor="middle" fill="#6b7280">G1</text>
