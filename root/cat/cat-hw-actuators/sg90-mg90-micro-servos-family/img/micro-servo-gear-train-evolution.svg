  <text x="480" y="222" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">Сухе тертя ковзання вала</text>
  <text x="480" y="246" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">Посилена шийка корпусу</text>
  <text x="480" y="262" font-size="12" text-anchor="middle" fill="#1a1a1a">• Вуглеволокно зменшує зминання</text>
  <text x="480" y="278" font-size="12" text-anchor="middle" fill="#6b7280">• Залишається тертя без підшипника</text>
  <rect x="344" y="302" width="272" height="166" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
