  <text x="463" y="388" font-size="12" text-anchor="middle" fill="#6b7280">G2</text>
  <text x="507" y="394" font-size="12" text-anchor="middle" fill="#2457d6" font-weight="700">Gвих</text>
  <text x="480" y="420" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">Мікроволокна розсіюють піки</text>
  <text x="480" y="436" font-size="12" text-anchor="middle" fill="#1a1a1a">• Пружний вигин зубів без зрізу</text>
  <text x="480" y="452" font-size="12" text-anchor="middle" fill="#6b7280">• Підвищений момент M = 2.0 кг·см</text>
