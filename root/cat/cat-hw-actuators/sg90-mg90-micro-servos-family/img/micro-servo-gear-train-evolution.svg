  <text x="480" y="28" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Еволюція редуктора 9-грамових мікросервоприводів: SG90 → SG92R → MG90S</text>
  <text x="480" y="48" font-size="13" text-anchor="middle" fill="#6b7280">Вуглекомпозит, металевий зубчастий ряд та підшипник усувають зріз зубів і радіальний люфт вала</text>
  <rect x="20" y="66" width="296" height="474" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
