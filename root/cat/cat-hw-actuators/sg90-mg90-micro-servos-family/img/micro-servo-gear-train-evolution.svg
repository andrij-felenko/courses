  <text x="792" y="246" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">Радіальний кулькопідшипник</text>
  <text x="792" y="262" font-size="12" text-anchor="middle" fill="#1a1a1a">• Fr сприймають сталеві кульки</text>
  <text x="792" y="278" font-size="12" text-anchor="middle" fill="#6b7280">• Жорстка вісь та збереження зачеплення</text>
