<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Кінематична схема вимірювального стенда мікросервопривода</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Соосне з'єднання з енкодером усуває радіальні навантаження для точного вимірювання люфту</text>

  <!-- Panel 1: Kinematic Layout -->
  <rect x="30" y="75" width="590" height="425" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="45" y="98" font-size="12" font-weight="bold" fill="#2457d6">КІНЕМАТИЧНА ВУЗЛОВА СХЕМА СТЕНДА</text>

  <!-- Shaft Centerline (rendered behind filled components) -->
  <line x1="45" y1="250" x2="605" y2="250" stroke="#d0d7de" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- Dimension Line L (Arm Length) -->
  <line x1="282" y1="114" x2="282" y2="130" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="282" y1="172" x2="282" y2="185" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="450" y1="114" x2="450" y2="305" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="282" y1="120" x2="450" y2="120" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-black)" marker-end="url(#arr-black)"/>
  <text x="366" y="112" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Довжина плеча L</text>

  <!-- Component 1: DUT (Servo SG90/MG90) -->
  <rect x="50" y="180" width="110" height="140" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" rx="6"/>
  <rect x="160" y="240" width="12" height="20" fill="#2457d6" rx="2"/>
  <line x1="50" y1="205" x2="160" y2="205" stroke="#2457d6" stroke-opacity="0.3" stroke-width="1"/>
  <text x="105" y="225" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Сервопривід</text>
  <text x="105" y="245" text-anchor="middle" font-size="12" fill="#6b7280">(DUT: SG90/MG90)</text>
  <text x="105" y="265" text-anchor="middle" font-size="12" fill="#1a1a1a">випробовуваний</text>

  <!-- DUT Wiring Cable & Label Box -->
  <line x1="105" y1="320" x2="105" y2="385" stroke="#2457d6" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arr-blue)"/>
  <rect x="50" y="390" width="110" height="48" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="105" y="410" text-anchor="middle" font-size="12" fill="#1a1a1a">Керування PWM</text>
  <text x="105" y="428" text-anchor="middle" font-size="12" fill="#6b7280">та живлення</text>

  <!-- Component 2: Flexible Coupling -->
  <line x1="172" y1="250" x2="184" y2="250" stroke="#1a1a1a" stroke-width="3"/>
  <rect x="184" y="228" width="44" height="44" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,2" rx="4"/>
  <path d="M188,250 C194,240 200,260 206,240 C212,260 218,250 224,250" stroke="#2457d6" stroke-width="2" fill="none"/>
  <line x1="228" y1="250" x2="252" y2="250" stroke="#1a1a1a" stroke-width="3"/>
  <text x="206" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Гнучка</text>
  <text x="206" y="205" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">муфта</text>
  <line x1="206" y1="210" x2="206" y2="222" stroke="#2457d6" stroke-width="1" marker-end="url(#arr-blue)"/>
  <text x="206" y="292" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Усуває F_rad</text>
  <text x="206" y="308" text-anchor="middle" font-size="12" fill="#6b7280">(розв'язка)</text>

  <!-- Component 3: Bearing Assembly -->
  <text x="282" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Опорні</text>
  <text x="282" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">підшипники</text>
  <rect x="252" y="185" width="60" height="130" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" rx="4"/>
  <rect x="257" y="192" width="50" height="26" fill="#eaf0fd" stroke="#1a1a1a" stroke-width="1" rx="2"/>
  <circle cx="267" cy="205" r="4" fill="#2457d6"/>
  <circle cx="282" cy="205" r="4" fill="#2457d6"/>
  <circle cx="297" cy="205" r="4" fill="#2457d6"/>
  <rect x="257" y="282" width="50" height="26" fill="#eaf0fd" stroke="#1a1a1a" stroke-width="1" rx="2"/>
  <circle cx="267" cy="295" r="4" fill="#2457d6"/>
  <circle cx="282" cy="295" r="4" fill="#2457d6"/>
  <circle cx="297" cy="295" r="4" fill="#2457d6"/>
  <rect x="252" y="247" width="60" height="6" fill="#1a1a1a" rx="1"/>
  <text x="282" y="338" text-anchor="middle" font-size="12" fill="#1a1a1a">Сприймають</text>
  <text x="282" y="355" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">радіальне F_rad</text>

  <!-- Component 4: Load Arm & Weight -->
  <line x1="312" y1="250" x2="485" y2="250" stroke="#1a1a1a" stroke-width="3"/>
  <rect x="368" y="240" width="12" height="20" fill="#2457d6" rx="2"/>
  <rect x="370" y="260" width="8" height="50" fill="#2457d6" rx="2"/>
  <rect x="370" y="305" width="85" height="8" fill="#2457d6" rx="2"/>
  <line x1="450" y1="313" x2="450" y2="340" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="435" y="340" width="30" height="30" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="3"/>
  <text x="450" y="360" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">m</text>
  <line x1="450" y1="370" x2="450" y2="415" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="450" y="435" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">F_load = m · g</text>
  <text x="450" y="453" text-anchor="middle" font-size="12" fill="#1a1a1a">Момент M = F · L</text>

  <!-- Component 5: Encoder -->
  <rect x="485" y="185" width="110" height="130" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="8"/>
  <text x="540" y="207" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Енкодер</text>
  <circle cx="540" cy="248" r="26" fill="none" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="540" cy="248" r="10" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <circle cx="540" cy="248" r="3" fill="#27ae60"/>
  <line x1="540" y1="222" x2="540" y2="234" stroke="#27ae60" stroke-width="1"/>
  <line x1="540" y1="262" x2="540" y2="274" stroke="#27ae60" stroke-width="1"/>
  <line x1="514" y1="248" x2="526" y2="248" stroke="#27ae60" stroke-width="1"/>
  <line x1="554" y1="248" x2="566" y2="248" stroke="#27ae60" stroke-width="1"/>
  <text x="540" y="298" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">(θ_enc)</text>
  <line x1="540" y1="315" x2="540" y2="385" stroke="#27ae60" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arr-green)"/>
  <rect x="485" y="390" width="110" height="48" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="540" y="410" text-anchor="middle" font-size="12" fill="#27ae60">Телеметрія кута</text>
  <text x="540" y="428" text-anchor="middle" font-size="12" fill="#6b7280">θ_real (0.1°)</text>

  <!-- Panel 2: Analysis & Principles -->
  <rect x="640" y="75" width="290" height="425" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>

  <!-- Sub-box 1: Backlash & Jitter -->
  <rect x="655" y="95" width="260" height="185" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="670" y="117" font-size="13" font-weight="bold" fill="#2457d6">Вимірювання люфту Δθ</text>
  <line x1="720" y1="162" x2="790" y2="162" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="796" y="166" font-size="11" fill="#2457d6">θ_cmd</text>
  <line x1="720" y1="162" x2="785" y2="140" stroke="#27ae60" stroke-width="1.5"/>
  <text x="791" y="138" font-size="11" fill="#27ae60">θ_real</text>
  <path d="M 760,162 A 40,40 0 0,0 756,150" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="768" y="152" font-size="12" font-weight="bold" fill="#c0392b">Δθ</text>
  <text x="670" y="200" font-size="12" font-weight="bold" fill="#1a1a1a">Формула люфту редуктора:</text>
  <text x="670" y="222" font-size="12" font-weight="bold" fill="#c0392b">Δθ = |θ_команди - θ_енкодера|</text>
  <text x="670" y="244" font-size="12" fill="#6b7280">Фіксація брязкання (jitter):</text>
  <text x="670" y="262" font-size="12" fill="#6b7280">запис високої частоти кута</text>

  <!-- Sub-box 2: Mechanical Relief -->
  <rect x="655" y="295" width="260" height="185" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="670" y="317" font-size="13" font-weight="bold" fill="#27ae60">Механічне розвантаження</text>
  <text x="670" y="338" font-size="12" font-weight="bold" fill="#c0392b">❌ Пряме навантаження вала:</text>
  <text x="670" y="356" font-size="12" fill="#1a1a1a">• F_rad зношує втулку серво</text>
  <text x="670" y="374" font-size="12" fill="#1a1a1a">• Перекіс шестерень міняє люфт</text>
  <text x="670" y="398" font-size="12" font-weight="bold" fill="#27ae60">✅ Стенд із підшипниками:</text>
  <text x="670" y="416" font-size="12" fill="#1a1a1a">• F_rad тримають підшипники</text>
  <text x="670" y="434" font-size="12" fill="#1a1a1a">• Чистий момент M на валу DUT</text>
  <text x="670" y="452" font-size="12" fill="#6b7280">• Точна ресурсна телеметрія</text>
</svg>
