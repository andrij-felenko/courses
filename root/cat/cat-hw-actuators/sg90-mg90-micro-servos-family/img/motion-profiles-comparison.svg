<svg width="960" height="560" viewBox="0 0 960 560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Порівняння профілів руху мікросервоприводу (SG90 / MG90S)</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">S-крива усуває пікові стрибки прискорення і ривки, зберігаючи механіку редуктора</text>

  <!-- Left Graph Container Panel -->
  <rect x="40" y="75" width="660" height="465" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Vertical Milestone Alignment Grid Lines -->
  <line x1="150" y1="85" x2="150" y2="495" stroke="#d0d7de" stroke-dasharray="4,4"/>
  <line x1="230" y1="85" x2="230" y2="495" stroke="#e2e8f0" stroke-dasharray="2,4"/>
  <line x1="310" y1="85" x2="310" y2="495" stroke="#d0d7de" stroke-dasharray="4,4"/>
  <line x1="450" y1="85" x2="450" y2="495" stroke="#d0d7de" stroke-dasharray="4,4"/>
  <line x1="530" y1="85" x2="530" y2="495" stroke="#e2e8f0" stroke-dasharray="2,4"/>
  <line x1="610" y1="85" x2="610" y2="495" stroke="#d0d7de" stroke-dasharray="4,4"/>

  <!-- Horizontal Reference Lines -->
  <line x1="120" y1="120" x2="660" y2="120" stroke="#d0d7de" stroke-dasharray="4,4"/>
  <line x1="120" y1="250" x2="660" y2="250" stroke="#d0d7de" stroke-dasharray="4,4"/>
  <line x1="120" y1="390" x2="660" y2="390" stroke="#d0d7de" stroke-dasharray="4,4"/>
  <line x1="120" y1="470" x2="660" y2="470" stroke="#d0d7de" stroke-dasharray="4,4"/>

  <!-- Y-Axis Vertical Line -->
  <line x1="120" y1="85" x2="120" y2="495" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- SUBPLOT 1: POSITION θ(t) -->
  <text x="55" y="95" font-size="13" font-weight="bold" fill="#1a1a1a">1. Положення θ(t) [град]</text>
  <line x1="120" y1="185" x2="675" y2="185" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr-dark)"/>

  <text x="110" y="124" text-anchor="end" font-size="12" fill="#6b7280">θ_target</text>
  <text x="110" y="189" text-anchor="end" font-size="12" fill="#6b7280">θ_0</text>

  <!-- Step Input Position Path -->
  <path d="M 120 185 L 150 185 L 150 120 L 670 120" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6,4" fill="none"/>
  <circle cx="150" cy="120" r="3.5" fill="#c0392b"/>
  <text x="160" y="108" font-size="12" font-weight="bold" fill="#c0392b">Скачок θ_cmd</text>

  <!-- Trapezoid Position Path -->
  <path d="M 120 185 L 150 185 Q 230 185 310 157.5 L 450 147.5 Q 530 120 610 120 L 670 120" stroke="#2457d6" stroke-width="2.5" fill="none"/>
  <text x="290" y="142" font-size="12" font-weight="bold" fill="#2457d6">Трапецеїдальний</text>

  <!-- S-Curve Position Path -->
  <path d="M 120 185 L 150 185 C 200 185, 260 157.5, 310 157.5 L 450 147.5 C 500 147.5, 560 120, 610 120 L 670 120" stroke="#27ae60" stroke-width="2.5" fill="none"/>
  <text x="470" y="168" font-size="12" font-weight="bold" fill="#27ae60">S-крива (плавна)</text>

  <!-- SUBPLOT 2: ANGULAR VELOCITY ω(t) -->
  <text x="55" y="225" font-size="13" font-weight="bold" fill="#1a1a1a">2. Швидкість ω(t) [рад/с]</text>
  <line x1="120" y1="315" x2="675" y2="315" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr-dark)"/>

  <text x="110" y="254" text-anchor="end" font-size="12" fill="#6b7280">ω_max</text>
  <text x="110" y="319" text-anchor="end" font-size="12" fill="#6b7280">0</text>

  <!-- Step Impulse Velocity Arrow -->
  <line x1="150" y1="315" x2="150" y2="240" stroke="#c0392b" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
  <text x="156" y="238" font-size="12" font-weight="bold" fill="#c0392b">δ(t) імпульс</text>

  <!-- Trapezoid Velocity Path -->
  <path d="M 120 315 L 150 315 L 310 250 L 450 250 L 610 315 L 670 315" stroke="#2457d6" stroke-width="2.5" fill="none"/>
  <circle cx="150" cy="315" r="3" fill="#2457d6"/>
  <circle cx="310" cy="250" r="3" fill="#2457d6"/>
  <circle cx="450" cy="250" r="3" fill="#2457d6"/>
  <circle cx="610" cy="315" r="3" fill="#2457d6"/>
  <text x="330" y="242" font-size="12" fill="#2457d6">ω_max (постійна)</text>

  <!-- S-Curve Velocity Path -->
  <path d="M 120 315 L 150 315 C 190 315, 270 250, 310 250 L 450 250 C 490 250, 570 315, 610 315 L 670 315" stroke="#27ae60" stroke-width="2.5" fill="none"/>
  <text x="215" y="242" font-size="12" fill="#27ae60">S-подібний розгін</text>
  <text x="485" y="242" font-size="12" fill="#27ae60">S-подібне гальмування</text>

  <!-- SUBPLOT 3: ANGULAR ACCELERATION a(t) -->
  <text x="55" y="355" font-size="13" font-weight="bold" fill="#1a1a1a">3. Прискорення a(t) [рад/с²]</text>
  <line x1="120" y1="430" x2="675" y2="430" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr-dark)"/>

  <text x="110" y="394" text-anchor="end" font-size="12" fill="#6b7280">+a_max</text>
  <text x="110" y="434" text-anchor="end" font-size="12" fill="#6b7280">0</text>
  <text x="110" y="474" text-anchor="end" font-size="12" fill="#6b7280">-a_max</text>

  <!-- Trapezoid Acceleration Step Path -->
  <path d="M 120 430 L 150 430 L 150 390 L 310 390 L 310 430 L 450 430 L 450 470 L 610 470 L 610 430 L 670 430" stroke="#2457d6" stroke-width="2" fill="none"/>
  <circle cx="150" cy="390" r="3.5" fill="#c0392b"/>
  <circle cx="310" cy="430" r="3.5" fill="#c0392b"/>
  <circle cx="450" cy="470" r="3.5" fill="#c0392b"/>
  <circle cx="610" cy="430" r="3.5" fill="#c0392b"/>
  <text x="160" y="378" font-size="12" font-weight="bold" fill="#c0392b">Стрибок a (ривок j→∞)</text>
  <text x="458" y="488" font-size="12" fill="#c0392b">Стрибок a при гальмуванні</text>

  <!-- S-Curve Acceleration Smooth Path -->
  <path d="M 120 430 L 150 430 C 180 430, 200 390, 230 390 C 260 390, 280 430, 310 430 L 450 430 C 480 430, 500 470, 530 470 C 560 470, 580 430, 610 430 L 670 430" stroke="#27ae60" stroke-width="2.5" fill="none"/>
  <text x="330" y="418" font-size="12" fill="#27ae60">Обмежений ривок j_max</text>

  <!-- BOTTOM TIME AXIS -->
  <line x1="120" y1="495" x2="675" y2="495" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="680" y="499" font-size="12" font-weight="bold" fill="#1a1a1a">Час t [с]</text>

  <!-- Time Axis Ticks -->
  <line x1="150" y1="495" x2="150" y2="500" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="150" y="512" text-anchor="middle" font-size="12" fill="#1a1a1a">t_0</text>

  <line x1="230" y1="495" x2="230" y2="500" stroke="#6b7280" stroke-width="1"/>
  <text x="230" y="512" text-anchor="middle" font-size="12" fill="#6b7280">t_1</text>

  <line x1="310" y1="495" x2="310" y2="500" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="310" y="512" text-anchor="middle" font-size="12" fill="#1a1a1a">t_2</text>

  <line x1="450" y1="495" x2="450" y2="500" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="450" y="512" text-anchor="middle" font-size="12" fill="#1a1a1a">t_3</text>

  <line x1="530" y1="495" x2="530" y2="500" stroke="#6b7280" stroke-width="1"/>
  <text x="530" y="512" text-anchor="middle" font-size="12" fill="#6b7280">t_4</text>

  <line x1="610" y1="495" x2="610" y2="500" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="610" y="512" text-anchor="middle" font-size="12" fill="#1a1a1a">t_5</text>

  <!-- Motion Phase Labels -->
  <text x="230" y="530" text-anchor="middle" font-size="12" fill="#6b7280">Фаза розгону</text>
  <text x="380" y="530" text-anchor="middle" font-size="12" fill="#6b7280">Рух з ω_max</text>
  <text x="530" y="530" text-anchor="middle" font-size="12" fill="#6b7280">Фаза гальмування</text>

  <!-- RIGHT SIDE CHARACTERISTICS & LEGEND PANEL -->
  <rect x="715" y="75" width="225" height="465" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <text x="827" y="98" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Характеристики профілів</text>

  <!-- Card 1: Step Input -->
  <rect x="725" y="110" width="205" height="92" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="737" y="128" font-size="13" font-weight="bold" fill="#c0392b">1. Скачкоподібне (Step)</text>
  <text x="737" y="146" font-size="12" fill="#1a1a1a">• Прямий стрибок ШІМ</text>
  <text x="737" y="164" font-size="12" fill="#1a1a1a">• Нескінченний ривок (j→∞)</text>
  <text x="737" y="182" font-size="12" fill="#c0392b">• Ризик зрізання шестерень</text>

  <!-- Card 2: Trapezoidal -->
  <rect x="725" y="214" width="205" height="106" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="737" y="232" font-size="13" font-weight="bold" fill="#2457d6">2. Трапецеїдальний</text>
  <text x="737" y="250" font-size="12" fill="#1a1a1a">• Лінійне зростання ω(t)</text>
  <text x="737" y="268" font-size="12" fill="#1a1a1a">• Обмежені ω_max та a_max</text>
  <text x="737" y="286" font-size="12" fill="#2457d6">• Стрибки прискорення a(t)</text>
  <text x="737" y="304" font-size="12" fill="#6b7280">• Вібрації при старті/зупинці</text>

  <!-- Card 3: S-Curve -->
  <rect x="725" y="332" width="205" height="106" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="737" y="350" font-size="13" font-weight="bold" fill="#27ae60">3. S-подібний (S-Curve)</text>
  <text x="737" y="368" font-size="12" fill="#1a1a1a">• Неперервне прискорення a(t)</text>
  <text x="737" y="386" font-size="12" fill="#1a1a1a">• Обмежений ривок (j_max)</text>
  <text x="737" y="404" font-size="12" fill="#27ae60">• Плавний вихід на позицію</text>
  <text x="737" y="422" font-size="12" fill="#27ae60">• Захист редуктора SG90</text>

  <!-- Summary Callout -->
  <rect x="725" y="450" width="205" height="76" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="737" y="468" font-size="12" font-weight="bold" fill="#1a1a1a">Висновок драйвера:</text>
  <text x="737" y="486" font-size="12" fill="#6b7280">Для SG90/MG90S S-крива</text>
  <text x="737" y="504" font-size="12" fill="#6b7280">запобігає резонансу й люфтам.</text>
</svg>
