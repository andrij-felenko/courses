<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Передавальна характеристика сервопривода θ(t_PWM) та дефекти позиціонування</text>
  <text x="480" y="55" font-size="13" fill="#6b7280" text-anchor="middle">Безпечний сектор обмежено упорами; енкодер виявляє нелінійність, мертву зону й шум потенціометра</text>

  <!-- ==================== ЛІВА ПАНЕЛЬ: ГОЛОВНИЙ ГРАФІК ==================== -->
  <rect x="24" y="74" width="560" height="426" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="304" y="98" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Характеристика сервопривода: імпульс керування проти кута вала</text>

  <!-- Зонування графіка -->
  <rect x="100" y="146" width="45" height="234" fill="#fdecea"/>
  <rect x="145" y="146" width="342" height="234" fill="#e9f7ef"/>
  <rect x="487" y="146" width="45" height="234" fill="#fdecea"/>

  <!-- Межі зон -->
  <line x1="145" y1="146" x2="145" y2="380" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="487" y1="146" x2="487" y2="380" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Позначка безпечного діапазону -->
  <line x1="149" y1="126" x2="483" y2="126" stroke="#27ae60" stroke-width="1.5" marker-start="url(#arr-green)" marker-end="url(#arr-green)"/>
  <text x="316" y="121" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Безпечний діапазон ходу вала: 550...2450 мкс (0°...180°)</text>

  <!-- Легенда кривих -->
  <rect x="155" y="156" width="175" height="44" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <line x1="165" y1="170" x2="190" y2="170" stroke="#2457d6" stroke-width="2.5"/>
  <text x="196" y="174" font-size="12" font-weight="700" fill="#2457d6">θ_meas (енкодер)</text>
  <line x1="165" y1="188" x2="190" y2="188" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="196" y="192" font-size="12" fill="#6b7280">θ_ideal (ідеальна пряма)</text>

  <!-- Ідеальна лінійна характеристика -->
  <line x1="145" y1="380" x2="487" y2="146" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Фактична виміряна характеристика вала -->
  <path d="M 100 380 L 145 380 C 170 375, 205 345, 235 320 L 240 310 L 244 324 L 249 304 L 254 320 L 259 298 L 264 302 C 285 285, 305 272, 316 263 C 350 240, 390 220, 420 196 C 450 172, 470 154, 487 146 L 532 146" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Точки упору та нейтралі -->
  <circle cx="145" cy="380" r="4" fill="#c0392b" stroke="white" stroke-width="1.5"/>
  <circle cx="487" cy="146" r="4" fill="#c0392b" stroke="white" stroke-width="1.5"/>
  <circle cx="316" cy="263" r="4" fill="#2457d6" stroke="white" stroke-width="1.5"/>

  <!-- Позначення відхилення лінійності -->
  <line x1="390" y1="213" x2="390" y2="231" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
  <rect x="338" y="235" width="134" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="405" y="247" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Відхилення лінійності</text>
  <text x="405" y="259" font-size="12" fill="#1a1a1a" text-anchor="middle">|Δθ_lin| = 3.2°</text>

  <!-- Виділення контактного шуму потенціометра -->
  <rect x="230" y="290" width="40" height="42" rx="3" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,2"/>
  <rect x="175" y="336" width="144" height="30" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="247" y="349" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Сплески шуму (знос)</text>
  <text x="247" y="362" font-size="12" fill="#c0392b" text-anchor="middle">Джитер вала σ_θ = ±2.8°</text>

  <!-- Текстові позначки зон упору -->
  <text x="122" y="250" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Упор 0°</text>
  <text x="122" y="265" font-size="12" fill="#c0392b" text-anchor="middle">Stall</text>
  <text x="122" y="280" font-size="12" fill="#6b7280" text-anchor="middle">I &gt; 650мА</text>

  <text x="509" y="250" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Упор 180°</text>
  <text x="509" y="265" font-size="12" fill="#c0392b" text-anchor="middle">Stall</text>
  <text x="509" y="280" font-size="12" fill="#6b7280" text-anchor="middle">Ризик зрізу</text>

  <!-- Стрілка переходу до мертвої зони -->
  <circle cx="316" cy="263" r="8" fill="none" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="2,2"/>
  <path d="M 324 263 L 350 274" fill="none" stroke="#2457d6" stroke-width="1.2"/>
  <rect x="345" y="276" width="130" height="26" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="410" y="289" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Мертва зона (zoom)</text>
  <text x="410" y="299" font-size="12" fill="#6b7280" text-anchor="middle">деталізація в нейтралі →</text>

  <!-- Осі координат лівого графіка -->
  <line x1="100" y1="380" x2="550" y2="380" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="325" y="430" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Тривалість імпульсу керування t_PWM (мкс)</text>

  <line x1="100" y1="380" x2="100" y2="135" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="100" y="130" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Кут θ (°)</text>

  <!-- Позначки осі X -->
  <line x1="100" y1="380" x2="100" y2="385" stroke="#6b7280" stroke-width="1.2"/>
  <text x="100" y="398" font-size="12" fill="#6b7280" text-anchor="middle">300</text>
  <line x1="145" y1="380" x2="145" y2="385" stroke="#c0392b" stroke-width="1.2"/>
  <text x="145" y="398" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">550</text>
  <line x1="226" y1="380" x2="226" y2="385" stroke="#6b7280" stroke-width="1.2"/>
  <text x="226" y="398" font-size="12" fill="#6b7280" text-anchor="middle">1000</text>
  <line x1="316" y1="380" x2="316" y2="385" stroke="#2457d6" stroke-width="1.2"/>
  <text x="316" y="398" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">1500</text>
  <line x1="406" y1="380" x2="406" y2="385" stroke="#6b7280" stroke-width="1.2"/>
  <text x="406" y="398" font-size="12" fill="#6b7280" text-anchor="middle">2000</text>
  <line x1="487" y1="380" x2="487" y2="385" stroke="#c0392b" stroke-width="1.2"/>
  <text x="487" y="398" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">2450</text>
  <line x1="532" y1="380" x2="532" y2="385" stroke="#6b7280" stroke-width="1.2"/>
  <text x="532" y="398" font-size="12" fill="#6b7280" text-anchor="middle">2700</text>

  <text x="145" y="412" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">T_min</text>
  <text x="316" y="412" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Нейтраль (90°)</text>
  <text x="487" y="412" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">T_max</text>

  <!-- Позначки осі Y -->
  <line x1="95" y1="380" x2="100" y2="380" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="90" y="384" font-size="12" fill="#1a1a1a" text-anchor="end">0°</text>
  <line x1="95" y1="321.5" x2="100" y2="321.5" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="90" y="325.5" font-size="12" fill="#1a1a1a" text-anchor="end">45°</text>
  <line x1="95" y1="263" x2="100" y2="263" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="90" y="267" font-size="12" fill="#1a1a1a" text-anchor="end">90°</text>
  <line x1="95" y1="204.5" x2="100" y2="204.5" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="90" y="208.5" font-size="12" fill="#1a1a1a" text-anchor="end">135°</text>
  <line x1="95" y1="146" x2="100" y2="146" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="90" y="150" font-size="12" fill="#1a1a1a" text-anchor="end">180°</text>

  <!-- Розрахункова картка внизу лівої панелі -->
  <rect x="42" y="446" width="524" height="42" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="56" y="463" font-size="12" font-weight="700" fill="#1a1a1a">Розрахунок крутизни стенда:</text>
  <text x="225" y="463" font-size="12" fill="#2457d6">k_servo = Δθ / Δt = 180° / (2450 − 550 мкс) ≈ 0.095 °/мкс</text>
  <text x="56" y="478" font-size="12" fill="#6b7280">Ціна мікрокроку: 10.55 мкс на 1° повороту вихідного вала енкодера</text>

  <!-- ==================== ПРАВА ВЕРХНЯ ПАНЕЛЬ: DEADBAND ==================== -->
  <rect x="604" y="74" width="332" height="206" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="770" y="98" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Збільшений масштаб: Мертва зона (Deadband)</text>

  <!-- Тло мертвої зони в інсеті -->
  <rect x="735" y="125" width="70" height="80" fill="#eaf0fd"/>
  <line x1="735" y1="125" x2="735" y2="205" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="805" y1="125" x2="805" y2="205" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Осі інсету -->
  <line x1="650" y1="185" x2="890" y2="185" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="890" y="198" font-size="12" fill="#1a1a1a" text-anchor="end">Δt (мкс)</text>
  <line x1="650" y1="210" x2="650" y2="120" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="650" y="115" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Δθ (°)</text>

  <!-- Сходинка мертвої зони -->
  <path d="M 680 205 L 735 185 L 805 185 L 860 145" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="735" cy="185" r="3.5" fill="#2457d6" stroke="white" stroke-width="1"/>
  <circle cx="805" cy="185" r="3.5" fill="#2457d6" stroke="white" stroke-width="1"/>

  <!-- Розмір мертвої зони -->
  <line x1="737" y1="145" x2="803" y2="145" stroke="#2457d6" stroke-width="1.2" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
  <text x="770" y="139" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Δt_db</text>
  <text x="770" y="159" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">8 мкс</text>
  <text x="770" y="177" font-size="12" fill="#2457d6" text-anchor="middle">Δθ = 0</text>

  <!-- Опис поведінки в мертвій зоні -->
  <text x="770" y="238" font-size="12" fill="#1a1a1a" text-anchor="middle">Мікроінкременти |Δt| &lt; 4 мкс ігноруються</text>
  <text x="770" y="256" font-size="12" fill="#6b7280" text-anchor="middle">Усуває дрижання мотора, але обмежує роздільність</text>

  <!-- ==================== ПРАВА НИЖНЯ ПАНЕЛЬ: КРИТЕРІЇ ==================== -->
  <rect x="604" y="294" width="332" height="206" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="770" y="318" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Діагностичні критерії стенда (Pass / Fail)</text>

  <!-- Card 1: Limits -->
  <rect x="616" y="328" width="308" height="38" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="626" y="344" font-size="12" font-weight="700" fill="#27ae60">1. Межі ходу T_min...T_max (Pass)</text>
  <text x="626" y="358" font-size="12" fill="#1a1a1a">Детекція упору при I &gt; 650 мА зберігає шестерні</text>

  <!-- Card 2: Deadband -->
  <rect x="616" y="371" width="308" height="38" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="626" y="387" font-size="12" font-weight="700" fill="#2457d6">2. Мертва зона Δt_db ≤ 8 мкс (Pass)</text>
  <text x="626" y="401" font-size="12" fill="#1a1a1a">SG90: 6–8 мкс; MG90S: 2–4 мкс (понад 12 мкс — люфт)</text>

  <!-- Card 3: Linearity -->
  <rect x="616" y="414" width="308" height="38" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="626" y="430" font-size="12" font-weight="700" fill="#2457d6">3. Лінійність |Δθ_lin| ≤ 3.5° (Pass)</text>
  <text x="626" y="444" font-size="12" fill="#1a1a1a">Максимальне кутове відхилення на секторі 180°</text>

  <!-- Card 4: Pot noise FAIL -->
  <rect x="616" y="457" width="308" height="38" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="626" y="473" font-size="12" font-weight="700" fill="#c0392b">4. Сплески шуму σ_θ &gt; 1.5° (FAIL — БРАК)</text>
  <text x="626" y="487" font-size="12" fill="#c0392b">Знос резистивного шару → джитер і нагрів у спокої</text>
</svg>
