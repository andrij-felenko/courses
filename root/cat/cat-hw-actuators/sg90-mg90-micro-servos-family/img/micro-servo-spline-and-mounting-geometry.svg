<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка полотна -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-rev" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-blue-rev" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Габаритне креслення сервоприводів SG90/MG90 та геометрія шліца 21T</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Монтажна база 28 мм та шліц 21T Ø4,8 мм гарантують точне базування і безлюфтову посадку качалки</text>

  <!-- ЛІВА ПАНЕЛЬ: Монтажні та габаритні розміри корпусу -->
  <rect x="24" y="68" width="456" height="472" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="44" y="92" font-size="14" font-weight="bold" fill="#1a1a1a">1. Монтажні та габаритні розміри корпусу (SG90 / MG90S)</text>

  <!-- Підзаголовок вигляду зверху -->
  <text x="44" y="112" font-size="12" font-weight="bold" fill="#6b7280">Вигляд зверху (монтажні вушка та міжосьова база 28 мм):</text>

  <!-- Розмірна лінія повної довжини 32.2 мм -->
  <line x1="162" y1="138" x2="162" y2="124" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="358" y1="138" x2="358" y2="124" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="162" y1="126" x2="358" y2="126" stroke="#1a1a1a" stroke-width="1.2" marker-start="url(#arr-rev)" marker-end="url(#arr)"/>
  <text x="260" y="122" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">32.2 мм (габарит з вушками)</text>

  <!-- Розмірна лінія міжцентрової відстані 28.0 мм з параметрами отворів -->
  <line x1="176" y1="160" x2="176" y2="142" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="344" y1="160" x2="344" y2="142" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="176" y1="144" x2="344" y2="144" stroke="#2457d6" stroke-width="1.2" marker-start="url(#arr-blue-rev)" marker-end="url(#arr-blue)"/>
  <text x="260" y="140" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">28.0 мм (2× отвори Ø2.2 мм під M2 / M2.5)</text>

  <!-- Вигляд зверху: корпус і вушка -->
  <rect x="190" y="156" width="140" height="64" rx="2" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 162,162 L 190,162 L 190,214 L 162,214 Z" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 330,162 L 358,162 L 358,214 L 330,214 Z" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Кріпильні отвори на вушках -->
  <circle cx="176" cy="188" r="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <circle cx="344" cy="188" r="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>

  <!-- Припливи кришки редуктора зверху -->
  <circle cx="223" cy="188" r="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <circle cx="268" cy="188" r="16" fill="#f4f6f8" stroke="#6b7280" stroke-width="1"/>
  <circle cx="300" cy="188" r="10" fill="#f4f6f8" stroke="#6b7280" stroke-width="1"/>
  <circle cx="223" cy="188" r="14" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="223" cy="188" r="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Розмірна лінія ширини корпусу 12.2 мм -->
  <line x1="330" y1="156" x2="382" y2="156" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="330" y1="220" x2="382" y2="220" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="380" y1="156" x2="380" y2="220" stroke="#1a1a1a" stroke-width="1.2" marker-start="url(#arr-rev)" marker-end="url(#arr)"/>
  <text x="388" y="192" font-size="12" font-weight="bold" fill="#1a1a1a">12.2 мм</text>

  <!-- Розмірна лінія довжини корпусу 22.8 мм -->
  <line x1="190" y1="220" x2="190" y2="236" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="330" y1="220" x2="330" y2="236" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="190" y1="234" x2="330" y2="234" stroke="#1a1a1a" stroke-width="1.2" marker-start="url(#arr-rev)" marker-end="url(#arr)"/>
  <text x="260" y="248" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">22.8 мм (довжина корпусу)</text>

  <!-- Підзаголовок вигляду збоку -->
  <text x="44" y="262" font-size="12" font-weight="bold" fill="#6b7280">Вигляд збоку (профіль корпусу):</text>

  <!-- Зсув осі вала 5.5 мм -->
  <line x1="223" y1="272" x2="223" y2="330" stroke="#2457d6" stroke-width="1" stroke-dasharray="4 2"/>
  <polyline points="223,276 242,262 252,262" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <text x="256" y="266" font-size="12" font-weight="bold" fill="#1a1a1a">Зсув осі вала: 5.5 мм</text>

  <!-- Вигляд збоку: корпус і редуктор -->
  <rect x="190" y="315" width="140" height="75" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="190" y1="375" x2="330" y2="375" stroke="#94a3b8" stroke-width="1"/>

  <!-- Вушка кріплення збоку -->
  <rect x="162" y="338" width="28" height="8" rx="1" fill="#cbd5e1" stroke="#1a1a1a" stroke-width="1.2"/>
  <rect x="330" y="338" width="28" height="8" rx="1" fill="#cbd5e1" stroke="#1a1a1a" stroke-width="1.2"/>

  <!-- Сходинки кришки редуктора -->
  <path d="M 190,315 L 190,296 L 255,296 L 255,305 L 295,305 L 295,315 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Вихідний вал зі шліцами -->
  <rect x="209" y="276" width="28" height="16" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="215" y1="276" x2="215" y2="292" stroke="#ffffff" stroke-width="1"/>
  <line x1="223" y1="276" x2="223" y2="292" stroke="#ffffff" stroke-width="1"/>
  <line x1="231" y1="276" x2="231" y2="292" stroke="#ffffff" stroke-width="1"/>

  <!-- Вихід кабелю (DuPont) -->
  <path d="M 190,378 C 175,378 165,385 156,392" fill="none" stroke="#854d0e" stroke-width="2.5"/>
  <path d="M 190,381 C 175,381 165,388 156,395" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <path d="M 190,384 C 175,384 165,391 156,398" fill="none" stroke="#ea580c" stroke-width="2.5"/>
  <text x="150" y="405" font-size="12" fill="#6b7280" text-anchor="end">Шлейф DuPont</text>

  <!-- Розмірна лінія повної висоти 31.0 мм -->
  <line x1="190" y1="276" x2="108" y2="276" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="190" y1="390" x2="108" y2="390" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="110" y1="276" x2="110" y2="390" stroke="#1a1a1a" stroke-width="1.2" marker-start="url(#arr-rev)" marker-end="url(#arr)"/>
  <text x="102" y="330" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">31.0 мм</text>
  <text x="102" y="344" font-size="12" fill="#6b7280" text-anchor="end">(висота)</text>

  <!-- Розмірна лінія глибини посадки під вушками 16.0 мм -->
  <line x1="330" y1="346" x2="382" y2="346" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="330" y1="390" x2="382" y2="390" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="380" y1="346" x2="380" y2="390" stroke="#2457d6" stroke-width="1.2" marker-start="url(#arr-blue-rev)" marker-end="url(#arr-blue)"/>
  <text x="388" y="364" font-size="12" font-weight="bold" fill="#2457d6">16.0 мм</text>
  <text x="388" y="378" font-size="12" fill="#6b7280">(глибина)</text>

  <!-- Інформаційна плашка монтажу та навантажень -->
  <rect x="38" y="416" width="428" height="110" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="434" font-size="12" font-weight="bold" fill="#1a1a1a">Вимоги монтажу та граничні механічні навантаження:</text>
  <circle cx="58" cy="452" r="4" fill="#27ae60"/>
  <text x="70" y="456" font-size="12" fill="#1a1a1a">Монтаж: гвинти M2/M2.5 з демпферними гумовими втулками</text>
  <circle cx="58" cy="474" r="4" fill="#2457d6"/>
  <text x="70" y="478" font-size="12" fill="#1a1a1a">SG90 (пластикова втулка): радіальне Fr ≤ 5 Н, осьове Fa ≤ 2 Н</text>
  <circle cx="58" cy="496" r="4" fill="#2457d6"/>
  <text x="70" y="500" font-size="12" fill="#1a1a1a">MG90S (кульковий підшипник): радіальне Fr ≤ 12 Н (без люфту)</text>
  <text x="70" y="516" font-size="12" fill="#6b7280">Перевищення осьового навантаження веде до перекосу редуктора</text>

  <!-- ПРАВА ПАНЕЛЬ: Геометрія шліца 21T та посадка качалки -->
  <rect x="496" y="68" width="440" height="472" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="516" y="92" font-size="14" font-weight="bold" fill="#1a1a1a">2. Геометрія шліца 21T Ø4.8 мм та посадка качалки</text>
  <text x="516" y="110" font-size="12" font-weight="bold" fill="#6b7280">Поперечний переріз вихідного вала та сполучення з важелем:</text>

  <!-- Осьові штрихпунктирні лінії перерізу шліца з розривом у центрі під напис M2 -->
  <line x1="536" y1="182" x2="576" y2="182" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 2"/>
  <line x1="604" y1="182" x2="644" y2="182" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 2"/>
  <line x1="590" y1="128" x2="590" y2="170" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 2"/>
  <line x1="590" y1="194" x2="590" y2="236" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 2"/>

  <!-- Контур 21-зубого шліцьового вала -->
  <path d="M 588.4,138.0 L 591.6,138.0 L 594.3,144.2 L 597.0,144.7 L 601.5,139.5 L 604.5,140.4 L 605.2,147.2 L 607.7,148.4 L 613.5,144.8 L 616.1,146.6 L 614.8,153.2 L 616.8,155.1 L 623.4,153.3 L 625.4,155.8 L 622.2,161.8 L 623.6,164.2 L 630.4,164.5 L 631.5,167.4 L 626.7,172.2 L 627.3,174.9 L 633.7,177.1 L 634.0,180.3 L 628.0,183.5 L 627.8,186.2 L 633.2,190.2 L 632.5,193.3 L 625.8,194.6 L 624.9,197.1 L 628.9,202.6 L 627.3,205.4 L 620.5,204.6 L 618.8,206.7 L 621.1,213.2 L 618.8,215.3 L 612.5,212.6 L 610.3,214.1 L 610.5,220.9 L 607.7,222.3 L 602.5,217.9 L 599.9,218.7 L 598.1,225.2 L 595.0,225.7 L 591.4,220.0 L 588.6,220.0 L 585.0,225.7 L 581.9,225.2 L 580.1,218.7 L 577.5,217.9 L 572.3,222.3 L 569.5,220.9 L 569.7,214.1 L 567.5,212.6 L 561.2,215.3 L 558.9,213.2 L 561.2,206.7 L 559.5,204.6 L 552.7,205.4 L 551.1,202.6 L 555.1,197.1 L 554.2,194.6 L 547.5,193.3 L 546.8,190.2 L 552.2,186.2 L 552.0,183.5 L 546.0,180.3 L 546.3,177.1 L 552.7,174.9 L 553.3,172.2 L 548.5,167.4 L 549.6,164.5 L 556.4,164.2 L 557.8,161.8 L 554.6,155.8 L 556.6,153.3 L 563.2,155.1 L 565.2,153.2 L 563.9,146.6 L 566.5,144.8 L 572.3,148.4 L 574.8,147.2 L 575.5,140.4 L 578.5,139.5 L 583.0,144.7 L 585.7,144.2 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Центральний різьбовий отвір під гвинт M2 -->
  <circle cx="590" cy="182" r="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <path d="M 576,182 A 14,14 0 1,1 590,196" fill="none" stroke="#6b7280" stroke-width="1"/>
  <text x="590" y="186" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">M2</text>

  <!-- Розмірна лінія зовнішнього діаметра ⌀4.8 мм -->
  <line x1="546" y1="182" x2="546" y2="238" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="634" y1="182" x2="634" y2="238" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="546" y1="236" x2="634" y2="236" stroke="#2457d6" stroke-width="1.2" marker-start="url(#arr-blue-rev)" marker-end="url(#arr-blue)"/>
  <text x="590" y="250" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">⌀4.8 мм (по вершинах зубів)</text>

  <!-- Специфікація шліца вала -->
  <rect x="676" y="124" width="246" height="124" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="688" y="142" font-size="12" font-weight="bold" fill="#2457d6">Параметри вала (SG90 / MG90S):</text>
  <text x="688" y="162" font-size="12" fill="#1a1a1a">• Шліци: <tspan font-weight="bold">21 зуб (21T, крок 17.14°)</tspan></text>
  <text x="688" y="180" font-size="12" fill="#1a1a1a">• Зовнішній ⌀: <tspan font-weight="bold">4.80 ± 0.05 мм</tspan></text>
  <text x="688" y="198" font-size="12" fill="#1a1a1a">• Внутрішній ⌀: <tspan font-weight="bold">4.40 ± 0.05 мм</tspan></text>
  <text x="688" y="216" font-size="12" fill="#1a1a1a">• Осьовий отвір: <tspan font-weight="bold">різьба M2 (l = 4–5 мм)</tspan></text>
  <text x="688" y="234" font-size="12" fill="#6b7280">• Призначення: фіксація качалки</text>

  <!-- Вузол сполучення сервокачалки з валом -->
  <rect x="510" y="264" width="412" height="136" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="522" y="282" font-size="12" font-weight="bold" fill="#1a1a1a">Поздовжній розріз вузла посадки сервокачалки на вал:</text>

  <!-- Вал сервопривода знизу -->
  <rect x="614" y="324" width="32" height="52" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="622" y1="324" x2="622" y2="376" stroke="#94a3b8" stroke-width="1"/>
  <line x1="630" y1="324" x2="630" y2="376" stroke="#94a3b8" stroke-width="1"/>
  <line x1="638" y1="324" x2="638" y2="376" stroke="#94a3b8" stroke-width="1"/>

  <!-- Сервокачалка (поперечний розріз важеля і маточини) -->
  <path d="M 540,314 L 606,314 L 606,306 L 654,306 L 654,314 L 720,314 L 720,326 L 654,326 L 654,346 L 606,346 L 606,326 L 540,326 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Отвори тяг на плечах качалки -->
  <circle cx="552" cy="320" r="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <circle cx="572" cy="320" r="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <circle cx="688" cy="320" r="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <circle cx="708" cy="320" r="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>

  <!-- Шліцьова зона зачеплення (зубці) -->
  <line x1="614" y1="324" x2="614" y2="346" stroke="#2457d6" stroke-width="2" stroke-dasharray="2 2"/>
  <line x1="646" y1="324" x2="646" y2="346" stroke="#2457d6" stroke-width="2" stroke-dasharray="2 2"/>

  <!-- Фіксувальний осьовий гвинт M2 -->
  <rect x="618" y="294" width="24" height="8" rx="2" fill="#cbd5e1" stroke="#1a1a1a" stroke-width="1.2"/>
  <rect x="626" y="302" width="8" height="28" fill="#e2e8f0" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3 1"/>

  <!-- Виноски до вузла з'єднання (єдиний правий стовпчик) -->
  <polyline points="642,298 734,298" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <text x="740" y="296" font-size="12" font-weight="bold" fill="#1a1a1a">Осьовий гвинт M2 × 4–5 мм</text>
  <text x="740" y="310" font-size="12" fill="#6b7280">(фіксація проти сповзання)</text>

  <polyline points="654,332 734,332" fill="none" stroke="#2457d6" stroke-width="1"/>
  <text x="740" y="330" font-size="12" font-weight="bold" fill="#2457d6">Маточина качалки (21 шліц)</text>
  <text x="740" y="344" font-size="12" fill="#6b7280">(щільна безлюфтова посадка)</text>

  <polyline points="708,326 734,366" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <text x="740" y="366" font-size="12" font-weight="bold" fill="#1a1a1a">Отвори плеча качалки</text>
  <text x="740" y="380" font-size="12" fill="#6b7280">(Ø1.2–1.5 мм під тяги)</text>

  <!-- Порівняльні плашки сумісності стандарту -->
  <!-- Блок ТАК (Штатний 21T) -->
  <rect x="510" y="416" width="200" height="110" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="522" y="436" font-size="12" font-weight="bold" fill="#27ae60">✔ Штатний стандарт: 21T</text>
  <text x="522" y="456" font-size="12" fill="#1a1a1a">• Діаметр вала: ⌀4.8 мм</text>
  <text x="522" y="474" font-size="12" fill="#1a1a1a">• Моделі: SG90, MG90S</text>
  <text x="522" y="492" font-size="12" fill="#1a1a1a">• Посадка: щільна, без люфту</text>
  <text x="522" y="510" font-size="12" font-weight="bold" fill="#27ae60">• Результат: точний кут ходу</text>

  <!-- Блок НЕ ТАК (Несумісні 25T / 24T) -->
