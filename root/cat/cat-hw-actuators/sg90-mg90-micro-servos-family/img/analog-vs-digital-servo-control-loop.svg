<rect x="506" y="458" width="416" height="66" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="518" y="476" font-size="12" font-weight="700" fill="#27ae60">Жорстка фіксація: утримання вала при мікрозміщеннях</text>
<text x="518" y="494" font-size="12" fill="#1a1a1a">Пачки ШІМ 300 Гц повної амплітуди долають сухе тертя.</text>
<text x="518" y="511" font-size="12" fill="#1a1a1a">Зона ±0,15°; миттєвий розвиток повного моменту утримання.</text>

