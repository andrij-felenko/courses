<text x="598" y="186" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">T_ШІМ = 3,3 мс (300 Гц)</text>
<text x="892" y="195" font-size="12" font-weight="700" fill="#27ae60" text-anchor="end">6 пачок ШІМ повної амплітуди</text>

<!-- Вісь часу діаграми -->
<line x1="556" y1="246" x2="892" y2="246" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
<line x1="556" y1="246" x2="556" y2="250" stroke="#1a1a1a" stroke-width="1"/>
<line x1="640" y1="246" x2="640" y2="250" stroke="#1a1a1a" stroke-width="1"/>
