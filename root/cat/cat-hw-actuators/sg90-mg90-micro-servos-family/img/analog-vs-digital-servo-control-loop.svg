<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="960" height="560" fill="white"/>

<defs>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
  </marker>
  <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
  </marker>
  <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
  </marker>
  <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
  </marker>
  <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
  </marker>
</defs>

<!-- Заголовок і підзаголовок -->
<text x="480" y="34" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Аналоговий контур проти цифрового мікроконтролера сервопривода</text>
<text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">50-герцова комутація з мертвою зоною 5–8 мкс проти ШІМ 300 Гц із миттєвим наростанням моменту</text>

<!-- ================================================================= -->
<!-- ЛІВА ПАНЕЛЬ: Аналоговий драйвер (SG90 / MG90S)                    -->
<!-- ================================================================= -->
<rect x="24" y="72" width="444" height="466" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

<!-- Шапка лівої панелі -->
<text x="246" y="94" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Аналоговий драйвер (SG90, SG92R, MG90S)</text>
<text x="246" y="112" font-size="12" fill="#6b7280" text-anchor="middle">Комутація мотора прив'язана до входу: 50 Гц (T = 20 мс)</text>

<!-- Розділ 1: Часова діаграма імпульсів напруги -->
<text x="38" y="132" font-size="12" font-weight="700" fill="#1a1a1a">1. Часова діаграма за період кадру T = 20 мс (f = 50 Гц)</text>

<!-- Трек 1: Вхідний PPM -->
<text x="80" y="158" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">u_вх</text>
<text x="80" y="174" font-size="12" fill="#6b7280" text-anchor="end">0 В</text>
<path d="M 88,174 L 102,174 L 102,154 L 128,154 L 128,174 L 424,174" fill="none" stroke="#1a1a1a" stroke-width="2"/>
<line x1="102" y1="149" x2="128" y2="149" stroke="#2457d6" stroke-width="1.2"/>
<text x="115" y="143" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">1,5 мс</text>
<text x="424" y="166" font-size="12" fill="#6b7280" text-anchor="end">PPM (кадр T = 20 мс, 50 Гц)</text>

<!-- Трек 2: Напруга на моторі u_M при відхиленні 0.5° -->
<text x="80" y="202" font-size="12" font-weight="700" fill="#c0392b" text-anchor="end">u_M</text>
<text x="80" y="216" font-size="12" fill="#c0392b" text-anchor="end">+5 В</text>
<text x="80" y="232" font-size="12" fill="#6b7280" text-anchor="end">0 В</text>
<rect x="102" y="198" width="5" height="32" fill="#fdecea"/>
<path d="M 88,230 L 102,230 L 102,198 L 107,198 L 107,230 L 424,230" fill="none" stroke="#c0392b" stroke-width="2.2"/>
<text x="114" y="195" font-size="12" font-weight="700" fill="#c0392b">t_p ≈ 40 мкс</text>
<line x1="114" y1="214" x2="418" y2="214" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
<text x="266" y="210" font-size="12" fill="#c0392b" text-anchor="middle">Пауза ~19,9 мс без струму (P_сер ≈ 0: двигун стоїть)</text>

<!-- Вісь часу діаграми -->
<line x1="88" y1="246" x2="424" y2="246" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
<line x1="88" y1="246" x2="88" y2="250" stroke="#1a1a1a" stroke-width="1"/>
<line x1="172" y1="246" x2="172" y2="250" stroke="#1a1a1a" stroke-width="1"/>
<line x1="256" y1="246" x2="256" y2="250" stroke="#1a1a1a" stroke-width="1"/>
<line x1="340" y1="246" x2="340" y2="250" stroke="#1a1a1a" stroke-width="1"/>
<line x1="424" y1="246" x2="424" y2="250" stroke="#1a1a1a" stroke-width="1"/>
<text x="88" y="262" font-size="12" fill="#6b7280" text-anchor="middle">0</text>
<text x="172" y="262" font-size="12" fill="#6b7280" text-anchor="middle">5</text>
<text x="256" y="262" font-size="12" fill="#6b7280" text-anchor="middle">10</text>
<text x="340" y="262" font-size="12" fill="#6b7280" text-anchor="middle">15</text>
<text x="424" y="262" font-size="12" fill="#6b7280" text-anchor="middle">20</text>
<text x="432" y="262" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="start">t, мс</text>

<!-- Розділ 2: Відновлювальний крутний момент -->
<text x="38" y="286" font-size="12" font-weight="700" fill="#1a1a1a">2. Відновлювальний момент M(Δθ): мертва зона 5–8 мкс</text>

<!-- Підкладка мертвої зони -->
<rect x="88" y="308" width="235" height="100" fill="#fdecea"/>
<line x1="323" y1="308" x2="323" y2="408" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3,3"/>
<text x="205" y="336" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Мертва зона: 5–8 мкс</text>
<text x="205" y="352" font-size="12" fill="#c0392b" text-anchor="middle">Кут нечутливості ~0,7°</text>
<text x="205" y="368" font-size="12" fill="#c0392b" text-anchor="middle">Живлення OFF, M = 0</text>

<!-- Сітка та осі графіка моменту -->
<line x1="88" y1="308" x2="424" y2="308" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
<line x1="88" y1="408" x2="424" y2="408" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="88" y1="408" x2="88" y2="300" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

<text x="80" y="298" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">M / M_max</text>
<text x="80" y="312" font-size="12" fill="#6b7280" text-anchor="end">100%</text>
<text x="80" y="412" font-size="12" fill="#6b7280" text-anchor="end">0%</text>

<!-- Засічки та підписи осі X -->
<line x1="88" y1="408" x2="88" y2="412" stroke="#1a1a1a" stroke-width="1"/>
<line x1="155" y1="408" x2="155" y2="412" stroke="#1a1a1a" stroke-width="1"/>
<line x1="222" y1="408" x2="222" y2="412" stroke="#1a1a1a" stroke-width="1"/>
<line x1="289" y1="408" x2="289" y2="412" stroke="#1a1a1a" stroke-width="1"/>
<line x1="356" y1="408" x2="356" y2="412" stroke="#1a1a1a" stroke-width="1"/>
<line x1="423" y1="408" x2="423" y2="412" stroke="#1a1a1a" stroke-width="1"/>

<text x="88" y="424" font-size="12" fill="#6b7280" text-anchor="middle">0°</text>
<text x="155" y="424" font-size="12" fill="#6b7280" text-anchor="middle">0,2°</text>
<text x="222" y="424" font-size="12" fill="#6b7280" text-anchor="middle">0,4°</text>
<text x="289" y="424" font-size="12" fill="#6b7280" text-anchor="middle">0,6°</text>
<text x="356" y="424" font-size="12" fill="#6b7280" text-anchor="middle">0,8°</text>
<text x="423" y="424" font-size="12" fill="#6b7280" text-anchor="middle">1,0°</text>
<text x="256" y="440" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Кутове відхилення вала |Δθ| від нейтралі</text>

<!-- Крива аналогового моменту -->
<path d="M 88,408 L 323,408 C 350,408 385,388 423,373" fill="none" stroke="#c0392b" stroke-width="2.5"/>
<text x="335" y="348" font-size="12" font-weight="700" fill="#c0392b">Крива SG90</text>
<text x="335" y="364" font-size="12" fill="#c0392b">M_макс ≈ 35%</text>

<!-- Картка висновку лівої панелі -->
<rect x="38" y="458" width="416" height="66" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="50" y="476" font-size="12" font-weight="700" fill="#c0392b">Піддатливість вала: пружне просідання під навантаженням</text>
<text x="50" y="494" font-size="12" fill="#1a1a1a">Імпульс 50 Гц замалий: двигун не долає тертя редуктора.</text>
<text x="50" y="511" font-size="12" fill="#1a1a1a">Люфт важеля сягає ±0,8°; нульовий опір зміщенню (M = 0).</text>

<!-- ================================================================= -->
<!-- ПРАВА ПАНЕЛЬ: Цифровий мікроконтролер (MG90D)                    -->
<!-- ================================================================= -->
<rect x="492" y="72" width="444" height="466" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

<!-- Шапка правої панелі -->
<text x="714" y="94" font-size="14" font-weight="700" fill="#2457d6" text-anchor="middle">Цифровий мікроконтролер (MG90D)</text>
<text x="714" y="112" font-size="12" fill="#6b7280" text-anchor="middle">Незалежна ШІМ-підкачка мотора: 300 Гц (T = 3,3 мс)</text>

<!-- Розділ 1: Часова діаграма імпульсів напруги -->
<text x="506" y="132" font-size="12" font-weight="700" fill="#2457d6">1. Часова діаграма: ШІМ 300 Гц за період кадру 20 мс</text>

<!-- Трек 1: Вхідний PPM -->
<text x="548" y="158" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">u_вх</text>
<text x="548" y="174" font-size="12" fill="#6b7280" text-anchor="end">0 В</text>
<path d="M 556,174 L 570,174 L 570,154 L 596,154 L 596,174 L 892,174" fill="none" stroke="#1a1a1a" stroke-width="2"/>
<line x1="570" y1="149" x2="596" y2="149" stroke="#2457d6" stroke-width="1.2"/>
<text x="583" y="143" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">1,5 мс</text>
<text x="892" y="166" font-size="12" fill="#6b7280" text-anchor="end">PPM (кадр T = 20 мс, 50 Гц)</text>

<!-- Трек 2: Напруга на моторі u_M при відхиленні 0.5° -->
<text x="548" y="202" font-size="12" font-weight="700" fill="#27ae60" text-anchor="end">u_M</text>
<text x="548" y="216" font-size="12" fill="#27ae60" text-anchor="end">+5 В</text>
<text x="548" y="232" font-size="12" fill="#6b7280" text-anchor="end">0 В</text>

<rect x="570" y="198" width="16" height="32" fill="#e9f7ef"/>
<rect x="626" y="198" width="16" height="32" fill="#e9f7ef"/>
<rect x="682" y="198" width="16" height="32" fill="#e9f7ef"/>
<rect x="738" y="198" width="16" height="32" fill="#e9f7ef"/>
<rect x="794" y="198" width="16" height="32" fill="#e9f7ef"/>
<rect x="850" y="198" width="16" height="32" fill="#e9f7ef"/>

<path d="M 556,230 L 570,230 L 570,198 L 586,198 L 586,230 L 626,230 L 626,198 L 642,198 L 642,230 L 682,230 L 682,198 L 698,198 L 698,230 L 738,230 L 738,198 L 754,198 L 754,230 L 794,230 L 794,198 L 810,198 L 810,230 L 850,230 L 850,198 L 866,198 L 866,230 L 892,230" fill="none" stroke="#27ae60" stroke-width="2.2"/>

<line x1="570" y1="187" x2="570" y2="195" stroke="#2457d6" stroke-width="1.2"/>
<line x1="626" y1="187" x2="626" y2="195" stroke="#2457d6" stroke-width="1.2"/>
