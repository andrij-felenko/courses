<line x1="892" y1="246" x2="892" y2="250" stroke="#1a1a1a" stroke-width="1"/>
<text x="556" y="262" font-size="12" fill="#6b7280" text-anchor="middle">0</text>
<text x="640" y="262" font-size="12" fill="#6b7280" text-anchor="middle">5</text>
<text x="724" y="262" font-size="12" fill="#6b7280" text-anchor="middle">10</text>
<text x="808" y="262" font-size="12" fill="#6b7280" text-anchor="middle">15</text>
<text x="892" y="262" font-size="12" fill="#6b7280" text-anchor="middle">20</text>
<text x="900" y="262" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="start">t, мс</text>

<!-- Розділ 2: Відновлювальний крутний момент -->
<text x="506" y="286" font-size="12" font-weight="700" fill="#2457d6">2. Відновлювальний момент M(Δθ): мертва зона 1–2 мкс</text>

<!-- Підкладка мертвої зони -->
<rect x="556" y="308" width="50" height="100" fill="#e9f7ef"/>
<line x1="606" y1="308" x2="606" y2="408" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3,3"/>
<text x="581" y="364" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Зона</text>
<text x="581" y="380" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">±1 мкс</text>
<text x="581" y="396" font-size="12" fill="#27ae60" text-anchor="middle">0,15°</text>

