<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="100%" height="100%">
  <rect width="840" height="500" fill="#0d1117"/>
  <text x="420" y="34" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Методи первинного заливання (Priming) мікрофлюїдних систем</text>
  <text x="420" y="58" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Порівняльний аналіз технологій витіснення повітря та активації змочуваності каналів</text>

  <!-- Method 1: Dry Self-Priming -->
  <rect x="40" y="85" width="175" height="375" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <rect x="50" y="95" width="155" height="30" rx="4" fill="rgba(248, 81, 73, 0.2)"/>
  <text x="127" y="115" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="13" font-weight="bold" fill="#f85149" text-anchor="middle">Сухий старт</text>

  <text x="55" y="145" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" font-weight="bold" fill="#f0f6fc">Принцип:</text>
  <text x="55" y="165" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#8b949e">Помпа намагається</text>
  <text x="55" y="180" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#8b949e">створити вакуум</text>
  <text x="55" y="195" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#8b949e">перекачуванням повітря.</text>

  <rect x="50" y="215" width="155" height="90" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="60" y="235" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#f85149">Надійність: 15-30%</text>
  <text x="60" y="255" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#8b949e">Стисливість повітря</text>
  <text x="60" y="270" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#8b949e">гасить хід актуатора.</text>
  <text x="60" y="290" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#f85149">Потрібен ε &gt; 0.1</text>

  <rect x="50" y="320" width="155" height="125" rx="4" fill="#21262d" stroke="#f85149"/>
  <text x="60" y="340" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" font-weight="bold" fill="#f85149">Недоліки:</text>
  <text x="60" y="360" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="9" fill="#f0f6fc">• Часті відмови запуску</text>
  <text x="60" y="380" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="9" fill="#f0f6fc">• Залипання пелюсток</text>
  <text x="60" y="400" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="9" fill="#f0f6fc">• Непридатний для</text>
  <text x="60" y="415" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="9" fill="#f0f6fc">  гідрофобних чіпів</text>

  <!-- Method 2: Solvent Displacement (IPA / Ethanol) -->
  <rect x="230" y="85" width="175" height="375" rx="8" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
  <rect x="240" y="95" width="155" height="30" rx="4" fill="rgba(210, 153, 34, 0.2)"/>
  <text x="317" y="115" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="13" font-weight="bold" fill="#d29922" text-anchor="middle">Змивання спиртом</text>

  <text x="245" y="145" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" font-weight="bold" fill="#f0f6fc">Принцип:</text>
  <text x="245" y="165" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#8b949e">Промивка ізопропанолом</text>
  <text x="245" y="180" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#8b949e">(γ = 21 мН/м), потім</text>
  <text x="245" y="195" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#8b949e">заміщення водою.</text>

  <rect x="240" y="215" width="155" height="90" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="250" y="235" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#3fb950">Надійність: 90-95%</text>
  <text x="250" y="255" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#8b949e">Низький поверхневий</text>
  <text x="250" y="270" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#8b949e">натяг змочує всі кути</text>
  <text x="250" y="290" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#3fb950">θ &lt; 10° навіть на PDMS</text>

  <rect x="240" y="320" width="155" height="125" rx="4" fill="#21262d" stroke="#d29922"/>
  <text x="250" y="340" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" font-weight="bold" fill="#d29922">Особливості:</text>
  <text x="250" y="360" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="9" fill="#f0f6fc">• Потрібна фінальна</text>
  <text x="250" y="375" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="9" fill="#f0f6fc">  промивка водою</text>
  <text x="250" y="395" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="9" fill="#f0f6fc">• Ризик сумісності</text>
  <text x="250" y="410" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="9" fill="#f0f6fc">  з білками/клітинами</text>

  <!-- Method 3: Plasma Oxidation (O2 Plasma) -->
  <rect x="420" y="85" width="180" height="375" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
  <rect x="430" y="95" width="160" height="30" rx="4" fill="rgba(88, 166, 255, 0.2)"/>
  <text x="510" y="115" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="13" font-weight="bold" fill="#58a6ff" text-anchor="middle">Киснева плазма</text>

  <text x="435" y="145" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" font-weight="bold" fill="#f0f6fc">Принцип:</text>
  <text x="435" y="165" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#8b949e">Хімічна активація стінок</text>
  <text x="435" y="180" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#8b949e">утворює силанольні</text>
  <text x="435" y="195" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#8b949e">групи Si-OH (супергідрофіл).</text>

  <rect x="430" y="215" width="160" height="90" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="440" y="235" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#3fb950">Надійність: 98%</text>
  <text x="440" y="255" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#8b949e">Капілярний тиск</text>
  <text x="440" y="270" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#8b949e">втягує воду самопливом!</text>
  <text x="440" y="290" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#3fb950">θ &lt; 5°</text>

  <rect x="430" y="320" width="160" height="125" rx="4" fill="#21262d" stroke="#58a6ff"/>
  <text x="440" y="340" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" font-weight="bold" fill="#58a6ff">Особливості:</text>
  <text x="440" y="360" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="9" fill="#f0f6fc">• Гідрофобне відновлення:</text>
  <text x="440" y="375" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="9" fill="#8b949e">  ефект зникає за 2-4 год</text>
  <text x="440" y="395" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="9" fill="#f0f6fc">• Потрібно заливати чіп</text>
  <text x="440" y="410" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="9" fill="#f0f6fc">  одразу після бондінгу</text>

  <!-- Method 4: Vacuum Degassing Priming -->
  <rect x="620" y="85" width="180" height="375" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <rect x="630" y="95" width="160" height="30" rx="4" fill="rgba(63, 185, 80, 0.2)"/>
  <text x="710" y="115" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="13" font-weight="bold" fill="#3fb950" text-anchor="middle">Вакуумне заливання</text>

  <text x="635" y="145" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" font-weight="bold" fill="#f0f6fc">Принцип:</text>
  <text x="635" y="165" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#8b949e">Чіп поміщають у вакуум,</text>
  <text x="635" y="180" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#8b949e">відкачують повітря,</text>
  <text x="635" y="195" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#8b949e">потім подають рідину.</text>

  <rect x="630" y="215" width="160" height="90" rx="4" fill="#0d1117" stroke="#30363d"/>
  <text x="640" y="235" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#3fb950">Надійність: 99.9%</text>
  <text x="640" y="255" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#8b949e">Нульовий залишковий</text>
  <text x="640" y="270" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#8b949e">об'єм бульбашок.</text>
  <text x="640" y="290" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" fill="#3fb950">Атмосфера заштовхує воду</text>

  <rect x="630" y="320" width="160" height="125" rx="4" fill="#21262d" stroke="#3fb950"/>
  <text x="640" y="340" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" font-weight="bold" fill="#3fb950">Переваги:</text>
  <text x="640" y="360" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="9" fill="#f0f6fc">• Промисловий стандарт</text>
  <text x="640" y="380" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="9" fill="#f0f6fc">• Відсутність хімікатів</text>
  <text x="640" y="400" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="9" fill="#f0f6fc">• Заповнення глухих кутів</text>
  <text x="640" y="415" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="9" fill="#3fb950">  і капілярних пасток</text>
</svg>