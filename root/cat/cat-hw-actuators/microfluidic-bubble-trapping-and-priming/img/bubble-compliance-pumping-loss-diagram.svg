<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 500" width="100%" height="100%">
  <rect width="840" height="500" fill="#0d1117"/>
  <text x="420" y="34" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Вплив стисливості бульбашки на об'ємний ККД мікропомпи</text>
  <text x="420" y="58" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Поглинання ходу п'єзоактюатора пружним газовим об'ємом: ΔV_actuator vs ΔV_fluid</text>

  <!-- Left: Ideal Pump (No Bubble, 100% Incompressible Fluid) -->
  <rect x="50" y="90" width="350" height="360" rx="8" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
  <text x="225" y="118" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="15" font-weight="bold" fill="#3fb950" text-anchor="middle">1. Ідеальна мікропомпа (Без газу)</text>

  <!-- Micropump Chamber Cross-section -->
  <rect x="75" y="150" width="300" height="130" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- PZT Actuator on Top -->
  <rect x="110" y="135" width="230" height="20" rx="3" fill="#3fb950"/>
  <text x="225" y="149" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" font-weight="bold" fill="#0d1117" text-anchor="middle">П'єзоелемент (PZT мембрана)</text>

  <!-- Liquid filled -->
  <rect x="77" y="155" width="296" height="123" fill="rgba(88, 166, 255, 0.3)"/>
  <text x="225" y="215" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="13" font-weight="bold" fill="#58a6ff" text-anchor="middle">100% Нестислива рідина</text>
  <text x="225" y="235" font-family="monospace" font-size="11" fill="#f0f6fc" text-anchor="middle">Стисливість β_liquid ≈ 4.5e-10 Па^-1</text>

  <!-- Arrows indicating displacement transfer -->
  <line x1="225" y1="155" x2="225" y2="185" stroke="#3fb950" stroke-width="2.5"/>
  <polygon points="220,185 225,195 230,185" fill="#3fb950"/>

  <rect x="75" y="300" width="300" height="130" rx="6" fill="#0d1117" stroke="#3fb950"/>
  <text x="85" y="325" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12" font-weight="bold" fill="#3fb950">Результат ходу:</text>
  <text x="85" y="347" font-family="monospace" font-size="11" fill="#f0f6fc">ΔV_pump = ΔV_actuator</text>
  <text x="85" y="370" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#8b949e">• Тиск у камері зростає миттєво</text>
  <text x="85" y="390" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#8b949e">• Клапани відкриваються швидко</text>
  <text x="85" y="415" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12" font-weight="bold" fill="#3fb950">Об'ємний ККД: η_vol ≈ 95%</text>

  <!-- Right: Real Pump with Trapped Bubble -->
  <rect x="440" y="90" width="350" height="360" rx="8" fill="#161b22" stroke="#f85149" stroke-width="1.5"/>
  <text x="615" y="118" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="15" font-weight="bold" fill="#f85149" text-anchor="middle">2. З бульбашкою повітря (C_bubble)</text>

  <!-- Micropump Chamber Cross-section with Bubble -->
  <rect x="465" y="150" width="300" height="130" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="2"/>

  <!-- PZT Actuator on Top -->
  <rect x="500" y="135" width="230" height="20" rx="3" fill="#f85149"/>
  <text x="615" y="149" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="10" font-weight="bold" fill="#0d1117" text-anchor="middle">П'єзоелемент (PZT мембрана)</text>

  <!-- Liquid and large Bubble -->
  <rect x="467" y="155" width="296" height="123" fill="rgba(88, 166, 255, 0.2)"/>

  <!-- Compressible Gas Bubble taking up 20% of chamber -->
  <ellipse cx="615" cy="220" rx="70" ry="35" fill="rgba(210, 153, 34, 0.4)" stroke="#d29922" stroke-width="2.5"/>
  <text x="615" y="218" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12" font-weight="bold" fill="#d29922" text-anchor="middle">Стислива бульбашка</text>
  <text x="615" y="236" font-family="monospace" font-size="10" fill="#f0f6fc" text-anchor="middle">C_gas = V_0 / (γ · P_0)</text>

  <rect x="465" y="300" width="300" height="130" rx="6" fill="#0d1117" stroke="#f85149"/>
  <text x="475" y="325" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12" font-weight="bold" fill="#f85149">Деградація подачі:</text>
  <text x="475" y="347" font-family="monospace" font-size="11" fill="#f85149">ΔV_pump = ΔV_act - C_bubble · ΔP</text>
  <text x="475" y="370" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#8b949e">• Газ стискається замість виштовхування</text>
  <text x="475" y="390" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="11" fill="#8b949e">• Не вистачає тиску відкрити клапан</text>
  <text x="475" y="415" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto" font-size="12" font-weight="bold" fill="#f85149">Об'ємний ККД падає до 0..10%!</text>
</svg>