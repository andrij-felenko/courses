<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Marker definitions -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="530" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Зональна обробка ШІМ-сигналу з програмним зсувом нейтралі та зоною нечутливості</text>
  <text x="480" y="50" font-size="13" text-anchor="middle" fill="#6b7280">Програмне зміщення центральної тривалості імпульсу й розширення зони нечутливості усувають дрейф вала</text>

  <!-- PANEL 1: Problem -->
  <rect x="35" y="70" width="890" height="120" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="55" y="94" font-size="13" font-weight="700" fill="#c0392b">Без корекції: Апаратне зміщення потенціометра спричиняє паразитарний дрейф вала</text>

  <!-- Panel 1 Axis -->
  <line x1="140" y1="145" x2="840" y2="145" stroke="#c0392b" stroke-width="2"/>
  
  <!-- Ticks -->
  <line x1="180" y1="140" x2="180" y2="150" stroke="#c0392b" stroke-width="2"/>
  <text x="180" y="165" font-size="12" text-anchor="middle" fill="#1a1a1a">1000 мкс (CCW)</text>

  <line x1="800" y1="140" x2="800" y2="150" stroke="#c0392b" stroke-width="2"/>
  <text x="800" y="165" font-size="12" text-anchor="middle" fill="#1a1a1a">2000 мкс (CW)</text>

  <!-- Nominal Neutral 1500 -->
  <line x1="470" y1="125" x2="470" y2="155" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="470" y="118" font-size="12" font-weight="700" text-anchor="middle" fill="#6b7280">Команда 1500 мкс</text>

  <!-- Actual Hardware Neutral 1535 -->
  <line x1="520" y1="125" x2="520" y2="155" stroke="#c0392b" stroke-width="2"/>
  <circle cx="520" cy="145" r="4" fill="#c0392b"/>
  <text x="520" y="178" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">Реальний нуль потенціометра 1535 мкс</text>

  <!-- Drift Arrow & Label -->
  <path d="M565,125 L530,125" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="575" y="129" font-size="12" font-weight="700" fill="#c0392b">Δt = +35 мкс → Паразитарне обертання!</text>

  <!-- PANEL 2: Solution -->
  <rect x="35" y="205" width="890" height="300" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="55" y="230" font-size="13" font-weight="700" fill="#27ae60">З корекцією: Програмне зміщення центра (Δt_offset) та розширення зони нечутливості (Δt_db)</text>

  <!-- Input Scale Label & Axis -->
  <text x="55" y="260" font-size="12" font-weight="700" fill="#1a1a1a">1. Вхідний сигнал ШІМ (t_in):</text>
  <line x1="250" y1="256" x2="870" y2="256" stroke="#6b7280" stroke-width="2"/>
  
  <line x1="280" y1="251" x2="280" y2="261" stroke="#6b7280" stroke-width="1.5"/>
  <text x="280" y="247" font-size="12" text-anchor="middle" fill="#6b7280">1000 мкс</text>

  <line x1="575" y1="251" x2="575" y2="261" stroke="#6b7280" stroke-width="1.5"/>
  <text x="575" y="247" font-size="12" text-anchor="middle" fill="#6b7280">1500 мкс (Номінал)</text>

  <line x1="840" y1="251" x2="840" y2="261" stroke="#6b7280" stroke-width="1.5"/>
  <text x="840" y="247" font-size="12" text-anchor="middle" fill="#6b7280">2000 мкс</text>

  <!-- Algorithm Box -->
  <rect x="220" y="275" width="520" height="50" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="295" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">Зсув центру: t_neutral = 1500 + Δt_offset = 1535 мкс</text>
  <text x="480" y="313" font-size="12" text-anchor="middle" fill="#1a1a1a">Зона нечутливості: Δt_db = ±15 мкс → Діапазон зупинки [1520 мкс .. 1550 мкс]</text>

  <!-- Arrow down to output zones -->
  <path d="M480,325 L480,348" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Output Scale Label -->
  <text x="55" y="375" font-size="12" font-weight="700" fill="#1a1a1a">2. Результуючі зони:</text>

  <!-- Output Zones -->
  <!-- CCW Zone -->
  <rect x="230" y="360" width="333" height="36" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="396" y="382" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">Реверс CCW (1000 .. 1520 мкс)</text>

  <!-- Deadband Zone -->
  <rect x="563" y="360" width="24" height="36" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>

  <!-- CW Zone -->
  <rect x="587" y="360" width="283" height="36" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="728" y="382" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">Пряме обертання CW (1550 .. 2000 мкс)</text>

  <!-- Deadband Pointer Line & Callout Box -->
  <path d="M575,396 L480,428" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  
  <!-- Summary Cards Left, Middle, Right -->
  <rect x="55" y="430" width="240" height="45" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="70" y="448" font-size="12" font-weight="700" fill="#2457d6">t_in &lt; 1520 мкс</text>
  <text x="70" y="464" font-size="12" fill="#1a1a1a">Швидкість пропорційна (CCW)</text>

  <rect x="340" y="430" width="280" height="45" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="480" y="447" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">1520 мкс ≤ t_in ≤ 1550 мкс</text>
  <text x="480" y="463" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">Повна зупинка мотора (0% ШІМ)</text>

  <rect x="660" y="430" width="240" height="45" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="675" y="448" font-size="12" font-weight="700" fill="#2457d6">t_in &gt; 1550 мкс</text>
  <text x="675" y="464" font-size="12" fill="#1a1a1a">Швидкість пропорційна (CW)</text>

</svg>
