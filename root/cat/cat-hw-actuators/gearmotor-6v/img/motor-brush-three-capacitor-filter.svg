<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-orange" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#e67e22"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Фільтрація іскрових завад колектора: триконденсаторна схема</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Розпайка керамічних конденсаторів між клемами та на корпус мотора з мінімальною довжиною виводів</text>

  <!-- ================= ЛІВА ПАНЕЛЬ: ФІЗИЧНИЙ МОНТАЖ ================= -->
  <rect x="24" y="68" width="484" height="392" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="266" y="94" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Монтаж конденсаторів на задній кришці мотора</text>

  <!-- Корпус мотора (задня кришка) -->
  <!-- Металевий обід стакана двигуна -->
  <circle cx="200" cy="232" r="86" fill="#cbd5e1" stroke="#64748b" stroke-width="3"/>
  <!-- Пластиковий ізолятор задньої кришки -->
  <circle cx="200" cy="232" r="72" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>
  <!-- Центральна втулка підшипника -->
  <circle cx="200" cy="232" r="18" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
  <circle cx="200" cy="232" r="6" fill="#64748b"/>

  <!-- Точки пайки на металевий корпус -->
  <circle cx="140" cy="292" r="6" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <circle cx="260" cy="292" r="6" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>

  <!-- Клеми живлення мотора (латунні пелюстки) -->
  <!-- Ліва клема (+) -->
  <rect x="146" y="218" width="22" height="28" rx="3" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
  <text x="157" y="237" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">+</text>

  <!-- Права клема (-) -->
  <rect x="232" y="218" width="22" height="28" rx="3" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
  <text x="243" y="237" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">−</text>

  <!-- Виводи та пайка C1 (між клемами) -->
  <line x1="157" y1="218" x2="186" y2="182" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="243" y1="218" x2="214" y2="182" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="157" cy="218" r="4.5" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <circle cx="243" cy="218" r="4.5" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>

  <!-- Конденсатор C1 (дисковий помаранчевий) -->
  <circle cx="200" cy="175" r="16" fill="#e67e22" stroke="#b45309" stroke-width="2"/>
  <text x="200" y="179" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">C1</text>

  <!-- Виводи та пайка C2 (клема + на корпус) -->
  <line x1="153" y1="246" x2="147" y2="249" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <line x1="141" y1="277" x2="140" y2="286" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <circle cx="153" cy="246" r="4" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>

  <!-- Конденсатор C2 -->
  <circle cx="142" cy="262" r="15" fill="#e67e22" stroke="#b45309" stroke-width="2"/>
  <text x="142" y="266" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">C2</text>

  <!-- Виводи та пайка C3 (клема - на корпус) -->
  <line x1="247" y1="246" x2="253" y2="249" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <line x1="259" y1="277" x2="260" y2="286" stroke="#64748b" stroke-width="2" stroke-linecap="round"/>
  <circle cx="247" cy="246" r="4" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>

  <!-- Конденсатор C3 -->
  <circle cx="258" cy="262" r="15" fill="#e67e22" stroke="#b45309" stroke-width="2"/>
  <text x="258" y="266" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">C3</text>

  <!-- Виносні підписи для лівої панелі (стовпчик праворуч від мотора) -->
  <!-- 1. Конденсатор C1 -->
  <line x1="218" y1="172" x2="312" y2="136" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="320" y="132" font-size="12" font-weight="bold" fill="#e67e22">C1 (100 нФ, дисковий)</text>
  <text x="320" y="148" font-size="12" fill="#6b7280">Між клемами двигуна</text>

  <!-- 2. Клеми мотора -->
  <line x1="256" y1="226" x2="312" y2="185" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="320" y="180" font-size="12" font-weight="bold" fill="#2457d6">Клеми Motor (+) та (−)</text>
  <text x="320" y="196" font-size="12" fill="#6b7280">Латунні пелюстки під пайку</text>

  <!-- 3. Конденсатори C2, C3 -->
  <line x1="275" y1="262" x2="312" y2="235" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="320" y="230" font-size="12" font-weight="bold" fill="#e67e22">C2, C3 (10–100 нФ)</text>
  <text x="320" y="246" font-size="12" fill="#6b7280">Від кожної клеми на корпус</text>

  <!-- 4. Точки пайки на корпус -->
  <line x1="266" y1="294" x2="312" y2="285" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="320" y="280" font-size="12" font-weight="bold" fill="#1a1a1a">Точки пайки на корпус</text>
  <text x="320" y="296" font-size="12" fill="#6b7280">Зачищений метал корпусу</text>

  <!-- Зелений інформаційний блок унизу лівої панелі -->
  <rect x="38" y="376" width="456" height="68" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="266" y="402" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Правило монтажу: довжина виводів &lt; 5 мм</text>
  <text x="266" y="426" font-size="12" fill="#1a1a1a" text-anchor="middle">Довгі ніжки мають паразитну L ≈ 1 нГн/мм і стають антенами</text>

  <!-- ================= ПРАВА ВЕРХНЯ ПАНЕЛЬ: ЕЛЕКТРИЧНА СХЕМА ================= -->
  <rect x="524" y="68" width="412" height="174" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="730" y="94" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Електрична схема фільтра</text>

  <!-- Вхідні клеми схеми -->
  <circle cx="550" cy="124" r="3.5" fill="#cbd5e1" stroke="#c0392b" stroke-width="1.5"/>
  <text x="548" y="116" font-size="12" font-weight="bold" fill="#c0392b">Клема (+)</text>

  <circle cx="550" cy="206" r="3.5" fill="#cbd5e1" stroke="#2457d6" stroke-width="1.5"/>
  <text x="548" y="224" font-size="12" font-weight="bold" fill="#2457d6">Клема (−)</text>

  <!-- Провідники верхньої та нижньої шин -->
  <line x1="554" y1="124" x2="880" y2="124" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="554" y1="206" x2="880" y2="206" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Вузол C1 (паралельно мотору) -->
  <line x1="650" y1="124" x2="650" y2="162" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="650" y1="168" x2="650" y2="206" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Пластини C1 -->
  <line x1="642" y1="162" x2="658" y2="162" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="642" y1="168" x2="658" y2="168" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Точки з'єднання шин -->
  <circle cx="650" cy="124" r="3" fill="#1a1a1a"/>
  <circle cx="650" cy="206" r="3" fill="#1a1a1a"/>
  <!-- Підпис C1 -->
  <text x="632" y="160" font-size="12" font-weight="bold" fill="#e67e22" text-anchor="end">C1</text>
  <text x="632" y="174" font-size="12" fill="#6b7280" text-anchor="end">100 нФ</text>

  <!-- Вузли C2 та C3 (на корпус мотора) -->
  <line x1="755" y1="124" x2="755" y2="141" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="755" y1="147" x2="755" y2="183" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="755" y1="189" x2="755" y2="206" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Пластини C2 -->
  <line x1="747" y1="141" x2="763" y2="141" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="747" y1="147" x2="763" y2="147" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Пластини C3 -->
  <line x1="747" y1="183" x2="763" y2="183" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="747" y1="189" x2="763" y2="189" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Точки з'єднання C2, C3 на шинах та в центрі -->
  <circle cx="755" cy="124" r="3" fill="#1a1a1a"/>
  <circle cx="755" cy="165" r="3" fill="#1a1a1a"/>
  <circle cx="755" cy="206" r="3" fill="#1a1a1a"/>
  <!-- Підписи C2 та C3 -->
  <text x="738" y="139" font-size="12" font-weight="bold" fill="#e67e22" text-anchor="end">C2</text>
  <text x="738" y="153" font-size="12" fill="#6b7280" text-anchor="end">100 нФ</text>
  <text x="738" y="181" font-size="12" font-weight="bold" fill="#e67e22" text-anchor="end">C3</text>
  <text x="738" y="195" font-size="12" fill="#6b7280" text-anchor="end">100 нФ</text>

  <!-- З'єднання з корпусом мотора (заземлення екрана) -->
  <line x1="755" y1="165" x2="780" y2="165" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="780" y1="157" x2="780" y2="173" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="780" y1="159" x2="787" y2="165" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="780" y1="165" x2="787" y2="171" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="780" y1="171" x2="787" y2="177" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="794" y="163" font-size="12" font-weight="bold" fill="#1a1a1a">Корпус</text>
  <text x="794" y="177" font-size="12" fill="#6b7280">(екран)</text>

  <!-- Мотор DC -->
  <line x1="880" y1="124" x2="880" y2="147" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="880" y1="183" x2="880" y2="206" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Щітки -->
  <rect x="875" y="143" width="10" height="4" fill="#1a1a1a"/>
  <rect x="875" y="183" width="10" height="4" fill="#1a1a1a"/>
  <!-- Коло двигуна -->
  <circle cx="880" cy="165" r="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="880" y="171" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">M</text>
  <text x="880" y="224" font-size="12" fill="#6b7280" text-anchor="middle">Двигун DC</text>

  <!-- ================= ПРАВА НИЖНЯ ПАНЕЛЬ: ПРИЗНАЧЕННЯ КОМПОНЕНТІВ ================= -->
  <rect x="524" y="254" width="412" height="206" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="730" y="278" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Призначення компонентів фільтра</text>

  <!-- Блок 1: C1 -->
  <rect x="538" y="290" width="384" height="42" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="548" y="308" font-size="12" font-weight="bold" fill="#e67e22">C1 (100 нФ):</text>
  <text x="634" y="308" font-size="12" font-weight="bold" fill="#1a1a1a">диференціальний шум (клема–клема)</text>
  <text x="548" y="324" font-size="12" fill="#6b7280">Шунтує високочастотне іскріння між щітками мотора</text>

  <!-- Блок 2: C2, C3 -->
  <rect x="538" y="344" width="384" height="42" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="548" y="362" font-size="12" font-weight="bold" fill="#2457d6">C2, C3 (10–100 нФ):</text>
  <text x="680" y="362" font-size="12" font-weight="bold" fill="#1a1a1a">синфазний шум (на корпус)</text>
  <text x="548" y="378" font-size="12" fill="#6b7280">Скидають завади на металевий екран корпусу двигуна</text>

  <!-- Блок 3: Критичність довжини виводів -->
  <rect x="538" y="398" width="384" height="50" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="548" y="416" font-size="12" font-weight="bold" fill="#c0392b">Критичність довжини: L ≈ 1 нГн/мм виводу</text>
  <text x="548" y="434" font-size="12" fill="#1a1a1a">Довгі виводи перетворюються на випромінюючі антени</text>
</svg>
