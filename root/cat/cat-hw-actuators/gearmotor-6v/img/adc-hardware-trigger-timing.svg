<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
  </marker>
  <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
  </marker>
  <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
  </marker>
</defs>

<rect x="0" y="0" width="960" height="460" fill="white"/>

<!-- Заголовок і підзаголовок -->
<text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Синхронізація вибірки АЦП із центром імпульсу ШІМ</text>
<text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Апаратний запуск за піком лічильника (TRGO) усуває вплив комутаційного шуму ключів</text>

<!-- Головна панель діаграми -->
<rect x="30" y="62" width="900" height="306" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

<!-- Вертикальний розділювач колонок -->
<line x1="235" y1="62" x2="235" y2="368" stroke="#d0d7de" stroke-width="1"/>

<!-- Горизонтальні розділювачі рядків -->
<line x1="30" y1="138" x2="930" y2="138" stroke="#e1e4e8" stroke-width="1"/>
<line x1="30" y1="198" x2="930" y2="198" stroke="#e1e4e8" stroke-width="1"/>
<line x1="30" y1="288" x2="930" y2="288" stroke="#e1e4e8" stroke-width="1"/>

<!-- РЯДОК 1: Лічильник таймера -->
<text x="44" y="92" font-size="13" font-weight="bold" fill="#1a1a1a">1. Лічильник таймера</text>
<text x="44" y="110" font-size="12" fill="#6b7280">Center-aligned (Up-Down)</text>

<!-- Трикутний рахунок -->
<polygon points="280,135 580,87 880,135" fill="#eaf0fd" opacity="0.5"/>
<path d="M 280,135 L 580,87 L 880,135" fill="none" stroke="#2457d6" stroke-width="2.5"/>

<!-- Рівень CCR -->
<line x1="280" y1="111" x2="880" y2="111" stroke="#c0392b" stroke-dasharray="4,4" stroke-width="1.2"/>

<!-- Осі та підписи лічильника -->
<line x1="280" y1="80" x2="280" y2="135" stroke="#b0b8c1" stroke-width="1.2"/>
<line x1="276" y1="87" x2="280" y2="87" stroke="#b0b8c1"/>
<text x="272" y="91" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">ARR</text>
<line x1="276" y1="111" x2="280" y2="111" stroke="#c0392b"/>
<text x="272" y="115" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">CCR</text>
<line x1="276" y1="135" x2="280" y2="135" stroke="#b0b8c1"/>
<text x="272" y="139" font-size="12" fill="#6b7280" text-anchor="end">0</text>

<circle cx="430" cy="111" r="3.5" fill="#c0392b"/>
<circle cx="730" cy="111" r="3.5" fill="#c0392b"/>
<circle cx="580" cy="87" r="4" fill="#2457d6"/>
<text x="580" y="76" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Пік лічильника (ARR)</text>

<!-- Вертикальні пунктири від перетину CCR до фронтів ШІМ -->
<line x1="430" y1="114" x2="430" y2="150" stroke="#c0392b" stroke-dasharray="3,3" stroke-width="1"/>
<line x1="730" y1="114" x2="730" y2="150" stroke="#c0392b" stroke-dasharray="3,3" stroke-width="1"/>

<!-- Вертикальна вісь синхронізації по центру (пік ARR -> імпульс TRGO) -->
<line x1="580" y1="87" x2="580" y2="298" stroke="#27ae60" stroke-dasharray="4,4" stroke-width="1.5"/>

<!-- РЯДОК 2: Сигнал ШІМ -->
<text x="44" y="160" font-size="13" font-weight="bold" fill="#1a1a1a">2. Вихід ШІМ (PWM)</text>
<text x="44" y="178" font-size="12" fill="#6b7280">Керування затвором</text>

<line x1="280" y1="146" x2="280" y2="188" stroke="#b0b8c1" stroke-width="1.2"/>
<line x1="276" y1="150" x2="280" y2="150" stroke="#b0b8c1"/>
<text x="272" y="154" font-size="12" fill="#1a1a1a" text-anchor="end">HIGH</text>
<line x1="276" y1="184" x2="280" y2="184" stroke="#b0b8c1"/>
<text x="272" y="188" font-size="12" fill="#6b7280" text-anchor="end">LOW</text>

<rect x="430" y="150" width="300" height="34" fill="#eaf0fd" opacity="0.6"/>
<path d="M 280,184 L 430,184 L 430,150 L 730,150 L 730,184 L 880,184" fill="none" stroke="#2457d6" stroke-width="2.5"/>

<text x="500" y="171" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Активний стан (ON)</text>
<text x="655" y="171" font-size="12" fill="#2457d6" text-anchor="middle">Ширина імпульсу t_on</text>

<!-- РЯДОК 3: Струм шунта -->
<text x="44" y="234" font-size="13" font-weight="bold" fill="#1a1a1a">3. Струм шунта I_shunt</text>
<text x="44" y="252" font-size="12" fill="#6b7280">Напруга з комутацією</text>

<line x1="280" y1="220" x2="280" y2="276" stroke="#b0b8c1" stroke-width="1.2"/>
<line x1="276" y1="262" x2="280" y2="262" stroke="#b0b8c1"/>
<text x="272" y="266" font-size="12" fill="#6b7280" text-anchor="end">0 A</text>

<!-- Зона 1: Шум увімкнення -->
<rect x="420" y="202" width="70" height="78" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
<text x="455" y="216" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Шум di/dt</text>

<!-- Зона 2: Спокійна зона -->
<rect x="500" y="202" width="210" height="78" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
<text x="536" y="217" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Чистий струм</text>
<text x="536" y="232" font-size="12" fill="#27ae60" text-anchor="middle">Дзвін згас</text>

<text x="648" y="217" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Точка вибірки</text>
<text x="648" y="232" font-size="12" fill="#27ae60" text-anchor="middle">I_мить = I_середнє</text>

<!-- Зона 3: Шум вимкнення -->
<rect x="720" y="202" width="70" height="78" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
<text x="755" y="216" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Шум di/dt</text>

<!-- Форма струму з комутаційним шумом -->
<path d="M 280,262 L 430,262 L 436,226 L 444,272 L 452,238 L 462,266 L 472,252 L 490,256 L 580,251 L 710,246 L 730,245 L 736,274 L 746,230 L 756,268 L 768,258 L 785,262 L 880,262" fill="none" stroke="#1a1a1a" stroke-width="2"/>

<!-- Точка вибірки по центру -->
<circle cx="580" cy="251" r="4.5" fill="#27ae60"/>

<!-- РЯДОК 4: Апаратний тригер TRGO та вибірка АЦП -->
<text x="44" y="320" font-size="13" font-weight="bold" fill="#1a1a1a">4. Тригер TRGO та АЦП</text>
<text x="44" y="338" font-size="12" fill="#6b7280">Вибірка без шуму</text>

<!-- Лінія базового рівня TRGO -->
<line x1="280" y1="314" x2="880" y2="314" stroke="#d0d7de" stroke-width="1.2"/>

<!-- Імпульс TRGO -->
<path d="M 574,314 L 574,298 L 586,298 L 586,314 Z" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
<text x="566" y="308" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">Імпульс TRGO</text>

<!-- Стрілка передачі тригера до АЦП -->
<line x1="580" y1="314" x2="580" y2="326" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

<!-- Блоки таймлайну АЦП -->
<rect x="360" y="328" width="210" height="26" rx="4" fill="#f4f6f8" stroke="#b0b8c1" stroke-width="1"/>
<text x="465" y="345" font-size="12" fill="#6b7280" text-anchor="middle">АЦП в очікуванні тригера</text>

<rect x="580" y="328" width="70" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="615" y="345" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">t_sample</text>

<rect x="650" y="328" width="110" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="705" y="345" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">t_conv (SAR)</text>

<rect x="760" y="328" width="130" height="26" rx="4" fill="#f4f6f8" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,3"/>
<text x="825" y="345" font-size="12" fill="#2457d6" text-anchor="middle">Дані готові (I_avg)</text>

<!-- НИЖНІ КАРТКИ ПОРІВНЯННЯ -->
<rect x="30" y="380" width="438" height="64" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
<text x="46" y="401" font-size="13" font-weight="bold" fill="#c0392b">✗ Запуск на фронті (Edge-Aligned або переривання)</text>
<text x="46" y="419" font-size="12" fill="#1a1a1a">АЦП захоплює комутаційний викид транзистора →</text>
<text x="46" y="435" font-size="12" fill="#1a1a1a">хибне спрацьовування захисту від перевантаження</text>

<rect x="492" y="380" width="438" height="64" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
<text x="508" y="401" font-size="13" font-weight="bold" fill="#27ae60">✓ Апаратний запуск у центрі (Center-Aligned + TRGO)</text>
<text x="508" y="419" font-size="12" fill="#1a1a1a">Дзвін згас, вибірка посередині індуктивних пульсацій →</text>
<text x="508" y="435" font-size="12" fill="#1a1a1a">точне вимірювання середнього струму та захист шестерень</text>
</svg>
