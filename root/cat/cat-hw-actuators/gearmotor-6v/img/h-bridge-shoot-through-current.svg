<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="530" fill="white"/>

  <defs>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Header and Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Наскрізний струм у плечі H-моста (Shoot-Through Current)</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Одночасне відкриття верхнього і нижнього ключів викликає пряме коротке замикання</text>

  <!-- Left Panel: Half-Bridge Circuit -->
  <rect x="25" y="80" width="525" height="420" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="106" font-size="14" font-weight="bold" fill="#1a1a1a">Силове плече H-моста (Half-Bridge)</text>
  <text x="45" y="126" font-size="12" font-weight="bold" fill="#c0392b">Аварійний режим: обидва MOSFET одночасно відкриті</text>

  <!-- VCC Rail -->
  <text x="45" y="164" font-size="13" font-weight="bold" fill="#c0392b">VCC = +6 В</text>
  <circle cx="140" cy="160" r="3" fill="#c0392b"/>
  <line x1="140" y1="160" x2="250" y2="160" stroke="#1a1a1a" stroke-width="2"/>

  <!-- High-Side MOSFET (HS) -->
  <!-- Drain lead -->
  <line x1="205" y1="160" x2="205" y2="195" stroke="#1a1a1a" stroke-width="2"/>
  <!-- HS Transistor symbol -->
  <line x1="205" y1="195" x2="205" y2="205" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="205" y1="205" x2="195" y2="205" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="195" y1="205" x2="195" y2="245" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="195" y1="245" x2="205" y2="245" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="205" y1="245" x2="205" y2="255" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Gate plate -->
  <line x1="188" y1="205" x2="188" y2="245" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="155" y1="225" x2="188" y2="225" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Gate HS Control Box -->
  <rect x="40" y="212" width="115" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="97" y="229" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Gate HS: HIGH</text>

  <!-- HS Status Box -->
  <rect x="235" y="195" width="145" height="54" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="245" y="215" font-size="12" font-weight="bold" fill="#c0392b">Верхній ключ (HS)</text>
  <text x="245" y="235" font-size="12" fill="#c0392b">СТАН: ВІДКРИТИЙ</text>

  <!-- Midpoint Node (OUT) -->
  <line x1="205" y1="255" x2="205" y2="305" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="205" cy="305" r="4" fill="#1a1a1a"/>
  <text x="190" y="309" font-size="12" fill="#6b7280" text-anchor="end">Вузлова точка (OUT)</text>

  <!-- Motor Branch -->
  <line x1="205" y1="305" x2="410" y2="305" stroke="#1a1a1a" stroke-width="2"/>
  <text x="320" y="292" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">I_мотора ≈ 0 А (обхід)</text>

  <circle cx="430" cy="305" r="20" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="430" y="311" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">M</text>
  <text x="430" y="346" font-size="12" fill="#6b7280" text-anchor="middle">Мотор 6 В</text>

  <!-- Danger Callout Box (Shoot-through current info) -->
  <rect x="390" y="145" width="145" height="115" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="462" y="168" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">НАЗВА СТРУМУ:</text>
  <text x="462" y="188" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">I_shoot-through</text>
  <text x="462" y="210" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">&gt;&gt; 20–30 А (КЗ)</text>
  <text x="462" y="230" font-size="12" fill="#c0392b" text-anchor="middle">Прямий струм у GND</text>
  <text x="462" y="248" font-size="12" fill="#6b7280" text-anchor="middle">В обхід мотора!</text>

  <!-- Low-Side MOSFET (LS) -->
  <line x1="205" y1="305" x2="205" y2="345" stroke="#1a1a1a" stroke-width="2"/>
  <!-- LS Transistor symbol -->
  <line x1="205" y1="345" x2="205" y2="355" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="205" y1="355" x2="195" y2="355" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="195" y1="355" x2="195" y2="395" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="195" y1="395" x2="205" y2="395" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="205" y1="395" x2="205" y2="405" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Gate plate -->
  <line x1="188" y1="355" x2="188" y2="395" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="155" y1="375" x2="188" y2="375" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Gate LS Control Box -->
  <rect x="40" y="362" width="115" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="97" y="379" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Gate LS: HIGH</text>

  <!-- LS Status Box -->
  <rect x="235" y="350" width="145" height="54" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="245" y="370" font-size="12" font-weight="bold" fill="#c0392b">Нижній ключ (LS)</text>
  <text x="245" y="390" font-size="12" fill="#c0392b">СТАН: ВІДКРИТИЙ</text>

  <!-- Ground Rail (GND) -->
  <line x1="205" y1="405" x2="205" y2="445" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="150" y1="445" x2="250" y2="445" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="190" y1="451" x2="220" y2="451" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="197" y1="457" x2="213" y2="457" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="202" y1="463" x2="208" y2="463" stroke="#1a1a1a" stroke-width="2"/>
  <text x="45" y="449" font-size="13" font-weight="bold" fill="#1a1a1a">GND (0 В)</text>

  <!-- Massive Red Shoot-Through Current Arrow -->
  <line x1="218" y1="165" x2="218" y2="440" stroke="#c0392b" stroke-width="6" stroke-linecap="round" marker-end="url(#arr-red)"/>

  <!-- Warning Banner at Bottom of Left Panel -->
  <rect x="40" y="472" width="495" height="20" rx="4" fill="#fdecea"/>
  <text x="287" y="486" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">УВАГА: Опір контуру R = 2 · R_ds(on) ≈ 0.1 Ом → миттєвий піковий струм!</text>

  <!-- Right Top Panel: Cause (Dead-Time absence & timing) -->
  <rect x="565" y="80" width="370" height="205" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="585" y="105" font-size="14" font-weight="bold" fill="#1a1a1a">Причина: затримка вимикання ключів</text>
  <text x="585" y="125" font-size="12" fill="#6b7280">Перемикання без захисної паузи Dead-Time:</text>

  <!-- Timing Diagram Waveforms -->
  <!-- HS Gate Signal -->
  <text x="585" y="164" font-size="12" font-weight="bold" fill="#2457d6">Gate HS</text>
  <line x1="645" y1="160" x2="745" y2="160" stroke="#2457d6" stroke-width="2"/>
  <line x1="745" y1="160" x2="745" y2="180" stroke="#2457d6" stroke-width="2"/>
  <line x1="745" y1="180" x2="890" y2="180" stroke="#2457d6" stroke-width="2"/>

  <!-- LS Gate Signal -->
  <text x="585" y="209" font-size="12" font-weight="bold" fill="#2457d6">Gate LS</text>
  <line x1="645" y1="225" x2="745" y2="225" stroke="#2457d6" stroke-width="2"/>
  <line x1="745" y1="225" x2="745" y2="205" stroke="#2457d6" stroke-width="2"/>
  <line x1="745" y1="205" x2="890" y2="205" stroke="#2457d6" stroke-width="2"/>

  <!-- Overlap / Shoot-through Zone Highlight -->
  <rect x="745" y="152" width="50" height="78" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="695" y="248" font-size="12" fill="#6b7280" text-anchor="middle">Лише HS</text>
  <text x="770" y="248" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Зона КЗ (Δt)</text>
  <text x="845" y="248" font-size="12" fill="#6b7280" text-anchor="middle">Лише LS</text>
  <text x="770" y="265" font-size="12" fill="#c0392b" text-anchor="middle">Обидва ON</text>

  <!-- Right Bottom Panel: Consequences -->
  <rect x="565" y="300" width="370" height="200" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="585" y="325" font-size="14" font-weight="bold" fill="#1a1a1a">Руйнівні наслідки наскрізного струму</text>

  <!-- Consequence 1 -->
  <rect x="585" y="338" width="330" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="595" y="354" font-size="12" font-weight="bold" fill="#c0392b">1. Просідання напруги живлення VCC</text>
  <text x="595" y="370" font-size="12" fill="#6b7280">Падіння до ~1 В → рестарт мікроконтролера</text>

  <!-- Consequence 2 -->
  <rect x="585" y="388" width="330" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="595" y="404" font-size="12" font-weight="bold" fill="#c0392b">2. Лавиноподібний тепловий перегрів</text>
  <text x="595" y="420" font-size="12" fill="#6b7280">Імпульсна потужність P = I²·R сягає сотень ват</text>

  <!-- Consequence 3 -->
  <rect x="585" y="438" width="330" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="595" y="454" font-size="12" font-weight="bold" fill="#c0392b">3. Незворотний пробій транзисторів</text>
  <text x="595" y="470" font-size="12" fill="#6b7280">Вигоряння кристалів ключів і мідних доріжок</text>
</svg>
