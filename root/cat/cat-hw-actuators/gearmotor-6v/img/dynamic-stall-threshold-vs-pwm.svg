<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Залежність струму блокування та динамічного порогу від ШІМ</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">Адаптивний поріг масштабується зі шпаруватістю і ліквідує сліпу зону статичного захисту</text>

  <!-- ================= ВЕРХНЯ ЛЕГЕНДА ГРАФІКА ================= -->
  <text x="90" y="96" font-size="13" font-weight="bold" fill="#1a1a1a">Струм, мА</text>

  <!-- Елемент 1: I_stall (червоний) -->
  <line x1="175" y1="92" x2="195" y2="92" stroke="#c0392b" stroke-width="2.5"/>
  <text x="200" y="96" font-size="12" font-weight="bold" fill="#c0392b">I_stall(PWM)</text>

  <!-- Елемент 2: I_динамічний (синій) -->
  <line x1="295" y1="92" x2="315" y2="92" stroke="#2457d6" stroke-width="2.5"/>
  <text x="320" y="96" font-size="12" font-weight="bold" fill="#2457d6">I_динамічний</text>

  <!-- Елемент 3: I_фіксований (сірий пунктир) -->
  <line x1="415" y1="92" x2="435" y2="92" stroke="#6b7280" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="440" y="96" font-size="12" fill="#6b7280">I_фікс (800 мА)</text>

  <!-- ================= ГРАФІК ================= -->
  <!-- 1. Зона вимкненої детекції (ШІМ < 20%): X від 90 до 190 -->
  <rect x="90" y="115" width="100" height="300" fill="#f4f6f8"/>

  <!-- 2. Небезпечна зона невиявленого заклинювання (при фіксованому порозі 800 мА) -->
  <polygon points="190,215 423.3,215 190,355" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- 3. Сітка графіка (горизонтальні лінії) -->
  <line x1="90" y1="365" x2="590" y2="365" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="90" y1="315" x2="590" y2="315" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="90" y1="265" x2="590" y2="265" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="90" y1="215" x2="590" y2="215" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="90" y1="165" x2="590" y2="165" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="90" y1="115" x2="590" y2="115" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Вертикальні лінії сітки (кожні 20% ШІМ) -->
  <line x1="190" y1="115" x2="190" y2="415" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="290" y1="115" x2="290" y2="415" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="390" y1="115" x2="390" y2="415" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="490" y1="115" x2="490" y2="415" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="590" y1="115" x2="590" y2="415" stroke="#d0d7de" stroke-width="1"/>

  <!-- Смуга нормального робочого струму холостого ходу (100-180 мА) -->
  <polygon points="90,390 590,370 590,395 90,405" fill="#e9f7ef" opacity="0.8"/>
  <line x1="90" y1="398" x2="590" y2="382" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="390" y="388" font-size="12" fill="#27ae60" text-anchor="middle">Робочий струм (100–180 мА)</text>

  <!-- Лінія фіксованого статичного порогу (800 мА) -->
  <line x1="90" y1="215" x2="590" y2="215" stroke="#6b7280" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Лінія динамічного адаптивного порогу захисту I_threshold(PWM) = PWM * 900 мА -->
  <line x1="190" y1="370" x2="590" y2="190" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Крива реального струму блокування I_stall(PWM) -->
  <line x1="90" y1="415" x2="190" y2="355" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="190" y1="355" x2="590" y2="115" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Точки на графіку для акценту -->
  <circle cx="423.3" cy="215" r="4" fill="#c0392b"/>
  <circle cx="590" cy="115" r="4" fill="#c0392b"/>
  <circle cx="590" cy="190" r="4" fill="#2457d6"/>

  <!-- Вісь X та Y -->
  <line x1="90" y1="415" x2="590" y2="415" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="90" y1="115" x2="90" y2="415" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Насічки та підписи на осі Y -->
  <line x1="85" y1="415" x2="90" y2="415" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="85" y1="365" x2="90" y2="365" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="85" y1="315" x2="90" y2="315" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="85" y1="265" x2="90" y2="265" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="85" y1="215" x2="90" y2="215" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="85" y1="165" x2="90" y2="165" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="85" y1="115" x2="90" y2="115" stroke="#1a1a1a" stroke-width="1"/>

  <text x="80" y="419" font-size="12" fill="#6b7280" text-anchor="end">0</text>
  <text x="80" y="369" font-size="12" fill="#6b7280" text-anchor="end">200</text>
  <text x="80" y="319" font-size="12" fill="#6b7280" text-anchor="end">400</text>
  <text x="80" y="269" font-size="12" fill="#6b7280" text-anchor="end">600</text>
  <text x="80" y="219" font-size="12" fill="#6b7280" text-anchor="end">800</text>
  <text x="80" y="169" font-size="12" fill="#6b7280" text-anchor="end">1000</text>
  <text x="80" y="119" font-size="12" fill="#6b7280" text-anchor="end">1200</text>

  <!-- Насічки та підписи на осі X -->
  <line x1="90" y1="415" x2="90" y2="420" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="190" y1="415" x2="190" y2="420" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="290" y1="415" x2="290" y2="420" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="390" y1="415" x2="390" y2="420" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="490" y1="415" x2="490" y2="420" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="590" y1="415" x2="590" y2="420" stroke="#1a1a1a" stroke-width="1"/>

  <text x="90" y="435" font-size="12" fill="#6b7280" text-anchor="middle">0%</text>
  <text x="190" y="435" font-size="12" fill="#6b7280" text-anchor="middle">20%</text>
  <text x="290" y="435" font-size="12" fill="#6b7280" text-anchor="middle">40%</text>
  <text x="390" y="435" font-size="12" fill="#6b7280" text-anchor="middle">60%</text>
  <text x="490" y="435" font-size="12" fill="#6b7280" text-anchor="middle">80%</text>
  <text x="590" y="435" font-size="12" fill="#6b7280" text-anchor="middle">100%</text>

  <text x="340" y="466" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Шпаруватість ШІМ (PWM Duty Cycle)</text>
  <text x="340" y="488" font-size="12" fill="#6b7280" text-anchor="middle">Прикладена напруга: V = PWM × 6 В</text>

  <!-- Підписи всередині графіка -->
  <text x="140" y="145" font-size="12" fill="#6b7280" text-anchor="middle">Зона</text>
  <text x="140" y="161" font-size="12" fill="#6b7280" text-anchor="middle">вимкненої</text>
  <text x="140" y="177" font-size="12" fill="#6b7280" text-anchor="middle">детекції</text>
  <text x="140" y="197" font-size="12" fill="#6b7280" text-anchor="middle">(ШІМ &lt; 20%)</text>

  <!-- 2. Напис у небезпечній зоні -->
  <text x="270" y="243" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Невиявлене заклинювання</text>
  <text x="270" y="259" font-size="12" fill="#c0392b" text-anchor="middle">(струм нижче 800 мА)</text>

  <!-- ================= ПРАВА ІНФОРМАЦІЙНА ПАНЕЛЬ ================= -->
  <!-- Картка 1: Фізика струму блокування -->
  <rect x="620" y="105" width="315" height="110" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <line x1="635" y1="125" x2="660" y2="125" stroke="#c0392b" stroke-width="3"/>
  <text x="670" y="129" font-size="13" font-weight="bold" fill="#1a1a1a">Струм блокування I_stall</text>
  <text x="635" y="150" font-size="12" fill="#1a1a1a">• I_stall(PWM) = PWM × (V_живл / R_обм)</text>
  <text x="635" y="170" font-size="12" fill="#1a1a1a">• При 100% ШІМ (6 В): I_stall = 1200 мА</text>
  <text x="635" y="190" font-size="12" fill="#1a1a1a">• При 50% ШІМ (3 В): I_stall = 600 мА</text>
  <text x="635" y="206" font-size="12" fill="#6b7280">  Струм заклинювання падає разом з ШІМ</text>

  <!-- Картка 2: Проблема фіксованого порогу -->
  <rect x="620" y="229" width="315" height="124" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <line x1="635" y1="249" x2="660" y2="249" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="4,3"/>
  <text x="670" y="253" font-size="13" font-weight="bold" fill="#c0392b">Статичний поріг (800 мА)</text>
  <text x="635" y="274" font-size="12" fill="#1a1a1a">• Фіксований поріг діє лише при ШІМ &gt; 67%</text>
  <text x="635" y="294" font-size="12" fill="#1a1a1a">• При ШІМ &lt; 67%: вал повністю заклинено,</text>
  <text x="635" y="314" font-size="12" fill="#c0392b">  але I_stall &lt; 800 мА — аварія не видна!</text>
  <text x="635" y="334" font-size="12" fill="#c0392b">  Двигун перегрівається без захисту.</text>

  <!-- Картка 3: Розв'язок — динамічний поріг -->
  <rect x="620" y="367" width="315" height="128" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <line x1="635" y1="387" x2="660" y2="387" stroke="#2457d6" stroke-width="3"/>
  <text x="670" y="391" font-size="13" font-weight="bold" fill="#2457d6">Динамічний поріг (рішення)</text>
  <text x="635" y="412" font-size="12" fill="#1a1a1a">• I_порогу(PWM) = 0.75 × I_stall(PWM)</text>
  <text x="635" y="432" font-size="12" fill="#1a1a1a">• Відстежує напругу: захист діє скрізь</text>
  <text x="635" y="452" font-size="12" fill="#1a1a1a">• При ШІМ &lt; 20%: детекція вимикається</text>
  <text x="635" y="472" font-size="12" fill="#6b7280">  (струм близький до шуму холостого ходу)</text>
</svg>
