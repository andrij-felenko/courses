<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Геометрична інтерференція та підрізання ніжки зуба (z &lt; 14)</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Чому шестірня не може мати менше 14 зубців: зрізання евольвентного профілю вершиною рейки</text>

  <!-- Ліва панель: Профіль А (z >= 14) -->
  <rect x="36" y="75" width="252" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Заголовна плашка А -->
  <rect x="48" y="87" width="228" height="26" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="162" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#27ae60">z ≥ 14: Нормальне зачеплення</text>
  <text x="162" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">Товста основа ніжки зуба s_f</text>

  <!-- Опорні геометричні лінії А -->
  <text x="46" y="177" font-size="12" font-weight="700" fill="#2457d6">d = m·z</text>
  <line x1="100" y1="185" x2="276" y2="185" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="5,4"/>

  <text x="46" y="202" font-size="12" fill="#6b7280">d_b = d·cos 20°</text>
  <line x1="136" y1="208" x2="276" y2="208" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Контур нормального зуба -->
  <path d="M 52,285 L 52,265 L 105,265 C 115,265 122,255 126,240 C 130,225 133,212 134,208 C 135,198 136,188 138,185 C 141,172 145,158 150,145 L 174,145 C 179,158 183,172 186,185 C 188,188 189,198 190,208 C 191,212 194,225 198,240 C 202,255 209,265 219,265 L 272,265 L 272,285 Z" fill="#e9f7ef" stroke="#27ae60" stroke-width="2.2"/>

  <!-- Позначка міцної основи зуба -->
  <line x1="220" y1="240" x2="202" y2="240" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="224" y="236" font-size="12" font-weight="700" fill="#27ae60">Основа</text>
  <text x="224" y="249" font-size="12" fill="#27ae60">ніжки s_f</text>

  <!-- Блок характеристик А -->
  <rect x="48" y="302" width="228" height="74" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="58" y="319" font-size="12" font-weight="700" fill="#27ae60">Геометрія кореня зуба:</text>
  <text x="58" y="335" font-size="12" fill="#1a1a1a">• Плавний перехід до западини</text>
  <text x="58" y="351" font-size="12" fill="#1a1a1a">• Немає звуження нижче d_b</text>
  <text x="58" y="367" font-size="12" fill="#1a1a1a">• Максимальна згинальна міцність</text>

  <!-- Плашка висновку А -->
  <rect x="48" y="388" width="228" height="54" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="162" y="408" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">z ≥ 14: Міцна основа ніжки</text>
  <text x="162" y="426" text-anchor="middle" font-size="12" fill="#1a1a1a">Повна евольвента, плавне кочення</text>

  <!-- Середня панель: Профіль B (z < 14) -->
  <rect x="304" y="75" width="252" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Заголовна плашка B -->
  <rect x="316" y="87" width="228" height="26" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="430" y="104" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">z &lt; 14: Підрізання (інтерференція)</text>
  <text x="430" y="130" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">Підріз (undercut) — звуження s_crit</text>

  <!-- Опорні геометричні лінії B -->
  <text x="314" y="177" font-size="12" font-weight="700" fill="#2457d6">d = m·z</text>
  <line x1="368" y1="185" x2="544" y2="185" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="5,4"/>

  <text x="314" y="202" font-size="12" fill="#6b7280">d_b = d·cos 20°</text>
  <line x1="404" y1="208" x2="544" y2="208" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,3"/>

  <text x="314" y="221" font-size="12" font-weight="700" fill="#c0392b">Межа N</text>
  <line x1="364" y1="227" x2="544" y2="227" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Пунктирний контур нормального зуба для порівняння -->
  <path d="M 372,265 C 382,265 389,255 393,240 C 397,225 400,212 401,208 C 403,198 404,188 406,185 M 488,265 C 478,265 471,255 467,240 C 463,225 460,212 459,208 C 457,198 456,188 454,185" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Траєкторія вершини інструмента (зона врізання) -->
  <path d="M 368,212 C 384,230 404,248 416,240 C 422,234 426,224 430,222 C 434,224 438,234 444,240 C 456,248 476,230 492,212" fill="none" stroke="#c0392b" stroke-width="1.3" stroke-dasharray="3,3"/>

  <!-- Контур підрізаного зуба -->
  <path d="M 320,285 L 320,265 L 372,265 C 384,265 404,258 416,240 C 419,232 417,218 412,208 C 408,198 405,188 406,185 C 409,172 413,158 418,145 L 442,145 C 447,158 451,172 454,185 C 455,188 452,198 448,208 C 443,218 441,232 444,240 C 456,258 476,265 488,265 L 540,265 L 540,285 Z" fill="#fdecea" stroke="#c0392b" stroke-width="2.2"/>

  <!-- Позначка критичного звуження s_crit -->
  <line x1="478" y1="240" x2="448" y2="240" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="484" y="236" font-size="12" font-weight="700" fill="#c0392b">Зона зламу</text>
  <text x="484" y="249" font-size="12" fill="#c0392b">s_crit</text>

  <!-- Блок характеристик B -->
  <rect x="316" y="302" width="228" height="74" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="326" y="319" font-size="12" font-weight="700" fill="#c0392b">Дефекти підрізання:</text>
  <text x="326" y="335" font-size="12" fill="#1a1a1a">• Звуження ніжки s_crit ≪ s_f</text>
  <text x="326" y="351" font-size="12" fill="#1a1a1a">• Зрізано робочу частину профілю</text>
  <text x="326" y="367" font-size="12" fill="#1a1a1a">• Небезпечний концентратор напруг</text>

  <!-- Плашка висновку B -->
  <rect x="316" y="388" width="228" height="54" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="430" y="408" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">z &lt; 14: Ослаблена ніжка зуба</text>
  <text x="430" y="426" text-anchor="middle" font-size="12" fill="#1a1a1a">Підріз евольвенти, ризик зламу</text>

  <!-- Права колонка: Картка 1 — Математична природа -->
  <rect x="572" y="75" width="352" height="178" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="588" y="98" font-size="14" font-weight="700" fill="#1a1a1a">Математична природа підрізання</text>

  <rect x="588" y="109" width="320" height="58" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="748" y="126" text-anchor="middle" font-size="13" font-weight="700" fill="#2457d6">z_min = 2 · h_a* / sin²(α_0)</text>
  <text x="748" y="143" text-anchor="middle" font-size="12" fill="#1a1a1a">Для α_0 = 20°, h_a* = 1.0:  z_теор ≈ 17.1</text>
  <text x="748" y="159" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">Гранично допустиме число: z = 14</text>

  <text x="588" y="187" font-size="12" font-weight="700" fill="#1a1a1a">Фізична причина явища:</text>
  <text x="588" y="203" font-size="12" fill="#6b7280">Вершина рейки заглиблюється нижче точки N</text>
  <text x="588" y="219" font-size="12" fill="#6b7280">на основному колі d_b і зрізає евольвентну ніжку</text>
  <text x="588" y="235" font-size="12" fill="#6b7280">під час обкату при виготовленні шестірні.</text>

  <!-- Права колонка: Картка 2 — Наслідки для мініатюрних редукторів -->
  <rect x="572" y="266" width="352" height="189" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="588" y="288" font-size="14" font-weight="700" fill="#1a1a1a">Наслідки для мініатюрних редукторів</text>

  <text x="588" y="307" font-size="12" font-weight="700" fill="#c0392b">● Проблема ведучої шестірні (піньйона):</text>
  <text x="602" y="323" font-size="12" fill="#6b7280">Для високого i потрібна шестірня з z &lt; 14,</text>
  <text x="602" y="339" font-size="12" fill="#6b7280">але без корекції її зуби критично тоншають.</text>

  <text x="588" y="359" font-size="12" font-weight="700" fill="#27ae60">● Інженерний розв'язок — коригування x &gt; 0:</text>
  <text x="602" y="375" font-size="12" fill="#6b7280">Додатне зміщення інструмента віддаляє рейку</text>
  <text x="602" y="391" font-size="12" fill="#6b7280">від центра колеса й усуває підрізання ніжки.</text>

  <text x="588" y="411" font-size="12" font-weight="700" fill="#1a1a1a">● Чому дешеві редуктори ламаються:</text>
  <text x="602" y="427" font-size="12" fill="#6b7280">Зуби без корекції сколюються біля кореня</text>
  <text x="602" y="443" font-size="12" fill="#6b7280">при першому ударі або заклинюванні вала.</text>
</svg>
