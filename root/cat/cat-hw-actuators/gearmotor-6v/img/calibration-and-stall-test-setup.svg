<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-rev" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Експериментальний стенд: калібрування шунта та тест блокування</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Еталонний амперметр для градуювання АЦП, фіксація колеса та осцилографічна перевірка відсічки ШІМ</text>

  <!-- ==================== ПАНЕЛЬ 1 ==================== -->
  <rect x="24" y="68" width="290" height="394" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="169" y="90" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Калібрування струму шунта</text>
  <text x="169" y="106" font-size="12" fill="#6b7280" text-anchor="middle">Еталонний DMM та градуювання АЦП</text>

  <!-- Блок 1.1: Лабораторне живлення та DMM -->
  <rect x="36" y="118" width="266" height="66" rx="6" fill="white" stroke="#d0d7de"/>
  <rect x="44" y="126" width="96" height="50" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="92" y="143" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Джерело DC</text>
  <text x="92" y="163" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">+6.0 В / 5 А</text>

  <rect x="194" y="126" width="100" height="50" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="244" y="143" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Еталон DMM</text>
  <text x="244" y="163" font-size="12" fill="#1a1a1a" text-anchor="middle">I_ref (±0.05%)</text>

  <!-- З'єднання між DC і DMM -->
  <line x1="140" y1="146" x2="190" y2="146" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="167" y="166" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+6 В</text>

  <!-- Блок 1.2: Силова плата та шунт -->
  <rect x="36" y="196" width="266" height="112" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="46" y="212" font-size="12" font-weight="bold" fill="#1a1a1a">Силова плата: H-міст і шунт</text>

  <rect x="46" y="222" width="112" height="42" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="102" y="238" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">H-міст мотора</text>
  <text x="102" y="254" font-size="12" fill="#6b7280" text-anchor="middle">ШІМ-керування</text>

  <rect x="178" y="222" width="114" height="42" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="235" y="238" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">АЦП МК (10-біт)</text>
  <text x="235" y="254" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">N_adc (0..1023)</text>

  <rect x="46" y="274" width="246" height="26" rx="3" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="169" y="291" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Шунт R_shunt = 0.10 Ом (1%) → GND</text>

  <!-- Блок 1.3: Градуювальна таблиця -->
  <rect x="36" y="320" width="266" height="132" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="46" y="338" font-size="12" font-weight="bold" fill="#1a1a1a">Градуювання: I_еталон vs АЦП</text>
  <text x="46" y="356" font-size="12" font-weight="bold" fill="#2457d6">I = K_calib × N_adc (K = 3.22 мА/код)</text>

  <text x="46" y="374" font-size="12" font-weight="bold" fill="#6b7280">Режим</text>
  <text x="136" y="374" font-size="12" font-weight="bold" fill="#6b7280">I_ref (DMM)</text>
  <text x="232" y="374" font-size="12" font-weight="bold" fill="#6b7280">АЦП (код)</text>

  <text x="46" y="392" font-size="12" fill="#1a1a1a">Хол. хід</text>
  <text x="136" y="392" font-size="12" fill="#1a1a1a">0.120 А</text>
  <text x="232" y="392" font-size="12" fill="#1a1a1a">37</text>

  <text x="46" y="410" font-size="12" fill="#1a1a1a">Робочий</text>
  <text x="136" y="410" font-size="12" fill="#1a1a1a">0.748 А</text>
  <text x="232" y="410" font-size="12" fill="#1a1a1a">232</text>

  <text x="46" y="428" font-size="12" font-weight="bold" fill="#c0392b">Блокув.</text>
  <text x="136" y="428" font-size="12" font-weight="bold" fill="#c0392b">3.210 А</text>
  <text x="232" y="428" font-size="12" font-weight="bold" fill="#c0392b">992</text>

  <text x="46" y="445" font-size="12" font-weight="bold" fill="#27ae60">✔ Лінійність: похибка вимірювання &lt; 1%</text>

  <!-- ==================== ПАНЕЛЬ 2 ==================== -->
  <rect x="334" y="68" width="292" height="394" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="480" y="90" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Механічна фіксація вала</text>
  <text x="480" y="106" font-size="12" fill="#6b7280" text-anchor="middle">Стенд блокування колеса (Stall test)</text>

  <!-- Блок 2.1: Стенд випробування -->
  <rect x="346" y="118" width="268" height="142" rx="6" fill="white" stroke="#d0d7de"/>
  <text x="358" y="134" font-size="12" font-weight="bold" fill="#1a1a1a">Стенд: мотор, редуктор і колесо</text>

  <!-- Мотор -->
  <rect x="358" y="152" width="58" height="38" rx="4" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="352" y="160" width="6" height="6" fill="#c0392b"/>
  <rect x="352" y="174" width="6" height="6" fill="#1a1a1a"/>
  <text x="387" y="175" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мотор</text>

  <!-- Редуктор -->
  <rect x="416" y="156" width="34" height="30" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="433" y="175" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Ред.</text>

  <!-- Вал -->
  <rect x="450" y="168" width="14" height="6" fill="#6b7280"/>

  <!-- Колесо -->
  <text x="475" y="148" font-size="12" fill="#1a1a1a" text-anchor="middle">D = 65 мм</text>
  <rect x="464" y="152" width="22" height="48" rx="4" fill="#1a1a1a"/>
  <rect x="468" y="160" width="14" height="32" rx="2" fill="#d0d7de"/>
  <rect x="473" y="168" width="4" height="6" fill="#6b7280"/>

  <!-- Упор -->
  <rect x="492" y="154" width="16" height="44" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <rect x="508" y="162" width="44" height="28" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="530" y="180" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">СТОП</text>

  <text x="480" y="222" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Жорсткий упор: вал заблоковано (ω = 0)</text>
  <text x="480" y="242" font-size="12" fill="#6b7280" text-anchor="middle">Вал редуктора нерухомий під напругою 6 В</text>

  <!-- Блок 2.2: Фізика блокування -->
  <rect x="346" y="272" width="268" height="76" rx="6" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="358" y="290" font-size="12" font-weight="bold" fill="#1a1a1a">Електрофізика режиму блокування:</text>
  <text x="358" y="308" font-size="12" fill="#1a1a1a">• Зупинка ротора → Back-EMF (ЕЕР) = 0 В</text>
  <text x="358" y="325" font-size="12" fill="#1a1a1a">• Струм стрибає до максимуму: I = U / R</text>
  <text x="358" y="342" font-size="12" font-weight="bold" fill="#c0392b">• Пік струму I_stall = 3.2 А (ХХ: 0.12 А)</text>

  <!-- Блок 2.3: Попередження про редуктор -->
  <rect x="346" y="360" width="268" height="92" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="358" y="380" font-size="12" font-weight="bold" fill="#c0392b">⚠ Ризик механічного пошкодження</text>
  <text x="358" y="398" font-size="12" fill="#1a1a1a">• Момент блокування перевищує 8 кг·см</text>
  <text x="358" y="416" font-size="12" fill="#1a1a1a">• При t &gt; 200 мс — загроза зрізу зубців</text>
  <text x="358" y="432" font-size="12" fill="#1a1a1a">  пластикових і латунних шестерень</text>
  <text x="358" y="448" font-size="12" font-weight="bold" fill="#c0392b">• Потрібне негайне зняття ШІМ!</text>

  <!-- ==================== ПАНЕЛЬ 3 ==================== -->
  <rect x="646" y="68" width="290" height="394" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="791" y="90" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3. Осцилограма відсічки ШІМ</text>
  <text x="791" y="106" font-size="12" fill="#6b7280" text-anchor="middle">Спрацювання захисту при блокуванні</text>

  <!-- Блок 3.1: Екран осцилографа -->
  <rect x="658" y="118" width="266" height="186" rx="6" fill="white" stroke="#d0d7de"/>

  <!-- Легенда каналів -->
  <rect x="668" y="125" width="12" height="4" fill="#2457d6"/>
  <text x="684" y="132" font-size="12" font-weight="bold" fill="#2457d6">CH1: Струм I_m(t)</text>

  <rect x="796" y="125" width="12" height="4" fill="#27ae60"/>
  <text x="812" y="132" font-size="12" font-weight="bold" fill="#27ae60">CH2: ШІМ (PWM)</text>

  <!-- Сітка осцилографа -->
  <rect x="668" y="142" width="246" height="134" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Поріг спрацювання -->
  <line x1="668" y1="218" x2="914" y2="218" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="672" y="213" font-size="12" font-weight="bold" fill="#c0392b">Поріг</text>
  <text x="826" y="213" font-size="12" font-weight="bold" fill="#c0392b">I_пор = 2.0 А</text>

  <!-- Вертикальні маркери часу -->
  <line x1="724" y1="142" x2="724" y2="276" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="794" y1="142" x2="794" y2="276" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="2,2"/>

  <!-- CH2: ШІМ сигнал (зелений) -->
  <path d="M 668,170 L 668,154 L 679,154 L 679,170 L 682,170 L 682,154 L 693,154 L 693,170 L 696,170 L 696,154 L 707,154 L 707,170 L 710,170 L 710,154 L 721,154 L 721,170 L 724,170 L 724,154 L 735,154 L 735,170 L 738,170 L 738,154 L 749,154 L 749,170 L 752,170 L 752,154 L 763,154 L 763,170 L 766,170 L 766,154 L 777,154 L 777,170 L 780,170 L 780,154 L 791,154 L 791,170 L 794,170 L 914,170" fill="none" stroke="#27ae60" stroke-width="2"/>

  <!-- CH1: Струм мотора (синій) -->
  <path d="M 668,250 L 724,250 Q 734,192 744,190 L 794,190 Q 804,263 818,265 L 914,265" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Підписи на осцилограмі -->
  <text x="672" y="244" font-size="12" fill="#6b7280">0.5 А</text>
  <text x="734" y="206" font-size="12" font-weight="bold" fill="#2457d6">3.2 А</text>
  <text x="840" y="162" font-size="12" font-weight="bold" fill="#27ae60">ШІМ = 0%</text>
  <text x="840" y="258" font-size="12" font-weight="bold" fill="#27ae60">I = 0 А</text>

  <!-- Інтервал часу Δt -->
  <line x1="724" y1="284" x2="794" y2="284" stroke="#1a1a1a" stroke-width="1" marker-start="url(#arr-rev)" marker-end="url(#arr)"/>
  <text x="759" y="299" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Δt = 100 мс</text>

  <!-- Блок 3.2: Хронометраж -->
  <rect x="658" y="316" width="266" height="70" rx="6" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="670" y="334" font-size="12" font-weight="bold" fill="#1a1a1a">Хронометраж реакції алгоритму:</text>
  <text x="670" y="352" font-size="12" fill="#1a1a1a">• t = 0 мс: фіксація I &gt; I_пор (2.0 А)</text>
  <text x="670" y="370" font-size="12" fill="#1a1a1a">• t = 100 мс: відсічка ШІМ (PWM = 0%)</text>

  <!-- Блок 3.3: Підтвердження безпеки -->
  <rect x="658" y="398" width="266" height="54" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="670" y="418" font-size="12" font-weight="bold" fill="#27ae60">✔ Надійність захисту підтверджено</text>
  <text x="670" y="438" font-size="12" fill="#1a1a1a">Час 100 мс &lt; 200 мс: зубці захищено</text>
</svg>
