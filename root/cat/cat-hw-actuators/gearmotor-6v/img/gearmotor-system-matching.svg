<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- 1. White Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Markers for arrows -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Системне узгодження привода та безпечна область роботи H-моста</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Порівняння редукцій 1:100 проти 1:600 та обмеження Safe Operating Area (SOA) при 6 В</text>

  <!-- LEFT PANEL: Gearmotor Matching -->
  <rect x="30" y="80" width="440" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  
  <text x="50" y="105" font-size="15" font-weight="bold" fill="#1a1a1a">Механічне узгодження: 1:100 vs 1:600</text>
  <text x="50" y="123" font-size="12" fill="#6b7280">Баланс потужності привода: P = M · ω = const</text>

  <!-- Card 1: 1:100 Traction -->
  <rect x="46" y="135" width="408" height="125" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="60" y="156" font-size="13" font-weight="bold" fill="#2457d6">Редуктор 1:100 (Тягова модифікація)</text>
  <text x="60" y="178" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">Швидкість:</tspan> ~100 об/хв   |   <tspan font-weight="bold">Момент:</tspan> ~0.8–1.0 кг·см</text>
  <text x="60" y="198" font-size="12" fill="#6b7280">Ступені: 4–5 передач   |   ККД редуктора: ~50%</text>
  <text x="60" y="218" font-size="12" fill="#27ae60">✔ Навантаження: маса платформи до 1.5 кг (підйоми, килими)</text>
  <text x="60" y="238" font-size="12" fill="#c0392b">⚠ Заклинювання: струм ротора I_stall до 1.8–2.0 А</text>

  <!-- Trade-off Balance Indicator -->
  <line x1="56" y1="277" x2="115" y2="277" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="250" y="281" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Компроміс: M ↑ ⇒ ω ↓  |  ω ↑ ⇒ M ↓</text>
  <line x1="385" y1="277" x2="444" y2="277" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Card 2: 1:600 High Speed -->
  <rect x="46" y="295" width="408" height="125" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="60" y="316" font-size="13" font-weight="bold" fill="#2457d6">Редуктор 1:600 (Швидкісна модифікація)</text>
  <text x="60" y="338" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">Швидкість:</tspan> ~600 об/хв   |   <tspan font-weight="bold">Момент:</tspan> ~0.2 кг·см</text>
  <text x="60" y="358" font-size="12" fill="#6b7280">Ступені: 2–3 передачі  |   ККД редуктора: ~75%</text>
  <text x="60" y="378" font-size="12" fill="#c0392b">⚠ Навантаження: маса до 0.3 кг (тільки гладка поверхня)</text>
  <text x="60" y="398" font-size="12" fill="#27ae60">✔ Динаміка: малий момент інерції, швидкий розгін</text>

  <!-- Bottom Left Summary Note -->
  <text x="250" y="441" font-size="12" fill="#6b7280" text-anchor="middle">Редукція визначає робочий струм I_ном і тривалість пуску</text>

  <!-- RIGHT PANEL: Safe Operating Area (SOA) -->
  <rect x="490" y="80" width="440" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <text x="510" y="105" font-size="15" font-weight="bold" fill="#1a1a1a">Область безпечної роботи H-моста (SOA) при 6 В</text>
  <text x="510" y="123" font-size="12" fill="#6b7280">Координати струму й часу: запобігання тепловому пробою</text>

  <!-- SOA Chart Zones -->
  <!-- Blue zone (Starting pulse window) -->
  <rect x="560" y="160" width="120" height="85" fill="#eaf0fd"/>
  <!-- Red zone (Thermal breakdown / stall) -->
  <rect x="680" y="160" width="225" height="85" fill="#fdecea"/>
  <!-- Green zone (DC Continuous SOA) -->
  <rect x="560" y="245" width="345" height="50" fill="#e9f7ef"/>

  <!-- SOA Boundary Line -->
  <path d="M 560 160 L 680 160 L 680 245 L 905 245" fill="none" stroke="#2457d6" stroke-width="2"/>
  <!-- Blanking threshold vertical line -->
  <line x1="680" y1="150" x2="680" y2="245" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Texts inside SOA zones -->
  <text x="620" y="195" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Пуск ≤ 150 мс</text>
  <text x="620" y="215" font-size="12" fill="#2457d6" text-anchor="middle">I до 2.0 А</text>

  <text x="792" y="195" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Червона зона: Блокування</text>
  <text x="792" y="215" font-size="12" fill="#c0392b" text-anchor="middle">I &gt; 0.8 А тривало: перегрів</text>

  <text x="732" y="274" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Зелена зона: I ≤ 0.8 А (DC Continuous SOA)</text>

  <!-- Chart Axes -->
  <line x1="560" y1="150" x2="560" y2="295" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="560" y1="295" x2="905" y2="295" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Y-axis Label & Ticks -->
  <text x="550" y="142" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">I [А]</text>
  <line x1="554" y1="160" x2="560" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="550" y="164" font-size="12" fill="#1a1a1a" text-anchor="end">2.0 А</text>

  <line x1="554" y1="195" x2="560" y2="195" stroke="#6b7280" stroke-width="1"/>
  <text x="550" y="199" font-size="12" fill="#6b7280" text-anchor="end">1.5 А</text>

  <line x1="554" y1="245" x2="560" y2="245" stroke="#27ae60" stroke-width="1.5"/>
  <text x="550" y="249" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">0.8 А</text>

  <line x1="554" y1="295" x2="560" y2="295" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="550" y="299" font-size="12" fill="#1a1a1a" text-anchor="end">0 А</text>

  <!-- X-axis Label & Ticks -->
  <line x1="560" y1="295" x2="560" y2="299" stroke="#1a1a1a" stroke-width="1"/>
  <text x="560" y="315" font-size="12" fill="#6b7280" text-anchor="middle">0</text>

  <line x1="680" y1="295" x2="680" y2="299" stroke="#c0392b" stroke-width="1.5"/>
  <text x="680" y="315" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">150 мс</text>

  <line x1="780" y1="295" x2="780" y2="299" stroke="#6b7280" stroke-width="1"/>
  <text x="780" y="315" font-size="12" fill="#6b7280" text-anchor="middle">300 мс</text>

  <line x1="905" y1="295" x2="905" y2="299" stroke="#27ae60" stroke-width="1.5"/>
  <text x="905" y="315" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">DC (постійно)</text>

  <text x="560" y="332" font-size="12" fill="#6b7280">Час t [мс] →</text>

  <!-- Right Subpanel: Engineering Recommendations -->
  <rect x="506" y="348" width="408" height="92" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="520" y="367" font-size="13" font-weight="bold" fill="#1a1a1a">Рекомендації захисту H-моста при 6 В:</text>
  <text x="520" y="388" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#2457d6">Шунт R = 0.1–0.5 Ом:</tspan> контроль струму в нижньому плечі</text>
  <text x="520" y="407" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#2457d6">Low-ESR C = 100–470 мкФ:</tspan> демпфування просідань шини 6 В</text>
  <text x="520" y="426" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#c0392b">Cut-off за 150 мс:</tspan> аварійне вимкнення при I &gt; 0.8 А</text>
</svg>
