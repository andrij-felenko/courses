<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-amber" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#d97706"/>
    </marker>
  </defs>

  <!-- Підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Електромеханічні характеристики двигуна під навантаженням</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Зростання моменту знижує швидкість і проти-ЕРС: оптимум ККД лежить при 15–25% навантаження</text>

  <!-- ================= ПОЗНАЧКИ ЗОН НАД ГРАФІКОМ ================= -->
  <!-- Плашка 1: Зона макс. ККД -->
  <rect x="137" y="78" width="96" height="22" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="185" y="93" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Зона макс. ККД</text>
  <line x1="185" y1="100" x2="185" y2="108" stroke="#27ae60" stroke-width="1.2" marker-end="url(#arr-green)"/>

  <!-- Плашка 2: Пік потужності -->
  <rect x="260" y="78" width="120" height="22" rx="4" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
  <text x="320" y="93" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">Пік Pвих (50% n)</text>
  <line x1="320" y1="100" x2="320" y2="108" stroke="#d97706" stroke-width="1.2" marker-end="url(#arr-amber)"/>

  <!-- Позначка шкали Y -->
  <text x="88" y="93" font-size="12" fill="#6b7280" text-anchor="end">% від max</text>

  <!-- ================= ОБЛАСТЬ ГРАФІКА ================= -->
  <!-- Тло графіка -->
  <rect x="95" y="110" width="450" height="300" fill="#fafafa" stroke="#d0d7de" stroke-width="1"/>

  <!-- Робоча зона максимального ККД (15-25% Мпуск) -->
  <rect x="162" y="110" width="46" height="300" fill="#e9f7ef" fill-opacity="0.7"/>
  <line x1="162" y1="110" x2="162" y2="410" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="208" y1="110" x2="208" y2="410" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Лінія пікової потужності на 50% моменту -->
  <line x1="320" y1="110" x2="320" y2="410" stroke="#d97706" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Горизонтальні лінії сітки (75%, 50%, 25%) -->
  <line x1="95" y1="185" x2="545" y2="185" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="95" y1="260" x2="545" y2="260" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="95" y1="335" x2="545" y2="335" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Горизонтальна прив'язка 50% швидкості до точки Pmax -->
  <line x1="95" y1="260" x2="320" y2="260" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="2,2"/>

  <!-- ================= КРИВІ ХАРАКТЕРИСТИК ================= -->
  <!-- 1. Проти-ЕРС E та швидкість n (лінійне спадання від 100% до 0%) -->
  <line x1="95" y1="110" x2="545" y2="410" stroke="#2457d6" stroke-width="2.5"/>

  <!-- 2. Споживаний струм I (зростання від струму холостого ходу ~8% до 100% Iпуск) -->
  <line x1="95" y1="386" x2="545" y2="110" stroke="#c0392b" stroke-width="2.5"/>

  <!-- 3. Механічна потужність Pвих (парабола з піком 100% на 50% моменту) -->
  <path d="M 95 410 C 158 275, 235 110, 320 110 C 405 110, 482 275, 545 410" fill="none" stroke="#d97706" stroke-width="2.5"/>

  <!-- 4. ККД двигуна eta (швидкий підйом до піку 72% при 20% моменту, далі плавний спад) -->
  <path d="M 95 410 C 115 290, 150 194, 185 194 C 230 194, 270 240, 320 260 C 395 290, 470 360, 545 410" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- ================= ТОЧКИ ТА МАРКЕРИ ================= -->
  <!-- Пік ККД -->
  <circle cx="185" cy="194" r="4.5" fill="#27ae60" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Точка піку механічної потужності Pmax -->
  <circle cx="320" cy="110" r="5" fill="#d97706" stroke="#ffffff" stroke-width="2"/>

  <!-- Точка 50% швидкості / 50% проти-ЕРС при Pmax -->
  <circle cx="320" cy="260" r="4.5" fill="#2457d6" stroke="#ffffff" stroke-width="1.5"/>

  <!-- ================= ШКАЛА Y (ЛІВОРУЧ ВІД ГРАФІКА) ================= -->
  <text x="88" y="114" font-size="12" fill="#6b7280" text-anchor="end">100%</text>
  <text x="88" y="189" font-size="12" fill="#6b7280" text-anchor="end">75%</text>
  <text x="88" y="264" font-size="12" fill="#6b7280" text-anchor="end">50%</text>
  <text x="88" y="339" font-size="12" fill="#6b7280" text-anchor="end">25%</text>
  <text x="88" y="414" font-size="12" fill="#6b7280" text-anchor="end">0%</text>

  <!-- ================= ШКАЛА X (ЗНИЗУ ГРАФІКА) ================= -->
  <!-- Риски шкали X -->
  <line x1="95" y1="410" x2="95" y2="416" stroke="#6b7280" stroke-width="1"/>
  <line x1="185" y1="410" x2="185" y2="416" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="320" y1="410" x2="320" y2="416" stroke="#d97706" stroke-width="1.5"/>
  <line x1="432" y1="410" x2="432" y2="416" stroke="#6b7280" stroke-width="1"/>
  <line x1="545" y1="410" x2="545" y2="416" stroke="#6b7280" stroke-width="1"/>

  <!-- Числові позначки моменту на осі X -->
  <text x="95" y="430" font-size="12" fill="#6b7280" text-anchor="middle">0</text>
  <text x="185" y="430" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">20%</text>
  <text x="320" y="430" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">50%</text>
  <text x="432" y="430" font-size="12" fill="#6b7280" text-anchor="middle">75%</text>
  <text x="545" y="430" font-size="12" fill="#6b7280" text-anchor="middle">100%</text>

  <!-- Підписи характерних точок осі X -->
  <text x="95" y="448" font-size="12" fill="#6b7280" text-anchor="middle">ХХ</text>
  <text x="185" y="448" font-size="12" fill="#27ae60" text-anchor="middle">Оптимум</text>
  <text x="320" y="448" font-size="12" fill="#b45309" text-anchor="middle">Pmax</text>
  <text x="545" y="448" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Стоп</text>

  <!-- Заголовок осі X -->
  <text x="320" y="474" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Крутний момент на валу M (навантаження) →</text>

  <!-- ================= ПРАВА ПАНЕЛЬ (ПОЯСНЕННЯ КРИВИХ ТА РЕЖИМІВ) ================= -->
  <!-- Тло панелі -->
  <rect x="580" y="78" width="355" height="407" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Заголовок панелі -->
  <text x="596" y="103" font-size="14" font-weight="bold" fill="#1a1a1a">Показники та робочі режими</text>
  <line x1="596" y1="113" x2="919" y2="113" stroke="#d0d7de" stroke-width="1"/>

  <!-- Картка 1: Проти-ЕРС та швидкість -->
  <rect x="596" y="123" width="323" height="48" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <line x1="608" y1="138" x2="628" y2="138" stroke="#2457d6" stroke-width="3"/>
  <text x="636" y="141" font-size="12" font-weight="bold" fill="#2457d6">Проти-ЕРС E та швидкість n</text>
  <text x="608" y="160" font-size="12" fill="#6b7280">E = ke·ω; спадає лінійно до 0 при зупинці вала</text>

  <!-- Картка 2: Споживаний струм -->
  <rect x="596" y="179" width="323" height="48" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <line x1="608" y1="194" x2="628" y2="194" stroke="#c0392b" stroke-width="3"/>
  <text x="636" y="197" font-size="12" font-weight="bold" fill="#c0392b">Споживаний струм I</text>
  <text x="608" y="216" font-size="12" fill="#6b7280">I = (U - E)/R; зростає до струму пуску Iпуск</text>

  <!-- Картка 3: Механічна потужність -->
  <rect x="596" y="235" width="323" height="48" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <line x1="608" y1="250" x2="628" y2="250" stroke="#d97706" stroke-width="3"/>
  <text x="636" y="253" font-size="12" font-weight="bold" fill="#b45309">Вихідна потужність Pвих</text>
  <text x="608" y="272" font-size="12" fill="#6b7280">P = M·ω; максимум при 50% n та 50% моменту</text>

  <!-- Картка 4: ККД -->
  <rect x="596" y="291" width="323" height="48" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <line x1="608" y1="306" x2="628" y2="306" stroke="#27ae60" stroke-width="3"/>
  <text x="636" y="309" font-size="12" font-weight="bold" fill="#27ae60">Коефіцієнт корисної дії η (ККД)</text>
  <text x="608" y="328" font-size="12" fill="#6b7280">η = Pвих/Pел; пік (до 70–75%) при малих струмах</text>

  <!-- Картка 5: Рекомендована робоча зона (зелена) -->
  <rect x="596" y="349" width="323" height="58" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="608" y="367" font-size="12" font-weight="bold" fill="#27ae60">✓ Робоча зона: 15–25% Mпуск (ККД max)</text>
  <text x="608" y="385" font-size="12" fill="#1a1a1a">Тривалий ресурс, помірний нагрів обмоток,</text>
  <text x="608" y="399" font-size="12" fill="#1a1a1a">висока стабільність обертів вихідного вала</text>

  <!-- Картка 6: Зона перевантаження (червона) -->
  <rect x="596" y="415" width="323" height="58" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="608" y="433" font-size="12" font-weight="bold" fill="#c0392b">⚠ Зона перевантаження: &gt; 50% Mпуск</text>
  <text x="608" y="451" font-size="12" fill="#1a1a1a">Падіння ККД, струмовий перегрів двигуна,</text>
  <text x="608" y="465" font-size="12" fill="#1a1a1a">ризик зрізання зубів шестерень редуктора</text>
</svg>
