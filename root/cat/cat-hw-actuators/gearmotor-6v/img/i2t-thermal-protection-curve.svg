<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Теплова захисна характеристика двигуна 6 В (крива I²t)</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">Допустима тривалість перевантаження якірної обмотки: I² · t = const</text>

  <!-- ЗОНА 1: Зелена (Безперервна безпечна робота) -->
  <rect x="85" y="120" width="110" height="300" fill="#e9f7ef"/>

  <!-- ЗОНА 3: Червона (Заборонена зона / Аварійний перегрів) -->
  <path d="M 195,120 C 195,190 215,230 250,247 C 285,264 340,282 415,301 C 490,320 560,332 635,338 L 635,120 Z" fill="#fdecea"/>

  <!-- ЗОНА 2: Синя (Допустиме короткочасне перевантаження) -->
  <path d="M 195,120 C 195,190 215,230 250,247 C 285,264 340,282 415,301 C 490,320 560,332 635,338 L 635,420 L 195,420 Z" fill="#eaf0fd"/>

  <!-- Межа безпечного тривалого режиму (x = 195) -->
  <line x1="195" y1="120" x2="195" y2="420" stroke="#27ae60" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Крива теплової стійкості I²t -->
  <path d="M 195,120 C 195,190 215,230 250,247 C 285,264 340,282 415,301 C 490,320 560,332 635,338" fill="none" stroke="#c0392b" stroke-width="3"/>

  <!-- Точка номіналу та точка блокування вала -->
  <circle cx="195" cy="120" r="4" fill="#27ae60"/>
  <circle cx="635" cy="338" r="4" fill="#c0392b"/>

  <!-- Написи в Зеленій зоні -->
  <text x="140" y="246" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">БЕЗПЕЧНИЙ</text>
  <text x="140" y="262" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">РЕЖИМ</text>
  <text x="140" y="280" font-size="12" fill="#27ae60" text-anchor="middle">I ≤ Iном</text>
  <text x="140" y="296" font-size="12" fill="#27ae60" text-anchor="middle">(t → ∞)</text>

  <!-- Написи в Червоній зоні -->
  <text x="440" y="170" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">ЗАБОРОНЕНА ЗОНА (АВАРІЙНИЙ ПЕРЕГРІВ)</text>
  <text x="440" y="190" font-size="12" fill="#c0392b" text-anchor="middle">тепловий пробій ізоляції обмотки (t ≥ tдоп)</text>

  <!-- Покажчик до кривої I²t -->
  <text x="440" y="246" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Крива стійкості: I² · t = const</text>
  <line x1="440" y1="254" x2="440" y2="295" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Написи в Синій зоні -->
  <text x="360" y="375" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ДОПУСТИМЕ ПЕРЕВАНТАЖЕННЯ</text>
  <text x="360" y="393" font-size="12" fill="#2457d6" text-anchor="middle">короткочасний розгін / маневр (t &lt; tдоп)</text>

  <!-- Осі координат -->
  <!-- Вісь Y -->
  <line x1="85" y1="420" x2="85" y2="105" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="85" y="92" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Час tдоп, с</text>

  <!-- Засічки осі Y -->
  <line x1="80" y1="140" x2="85" y2="140" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="74" y="144" font-size="12" fill="#1a1a1a" text-anchor="end">100 с</text>

  <line x1="80" y1="210" x2="85" y2="210" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="74" y="214" font-size="12" fill="#1a1a1a" text-anchor="end">10 с</text>

  <line x1="80" y1="280" x2="85" y2="280" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="74" y="284" font-size="12" fill="#1a1a1a" text-anchor="end">1 с</text>

  <line x1="80" y1="350" x2="85" y2="350" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="74" y="354" font-size="12" fill="#1a1a1a" text-anchor="end">0.1 с</text>

  <!-- Вісь X -->
  <line x1="85" y1="420" x2="655" y2="420" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Засічки осі X -->
  <line x1="195" y1="420" x2="195" y2="426" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="305" y1="420" x2="305" y2="426" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="415" y1="420" x2="415" y2="426" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="525" y1="420" x2="525" y2="426" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="635" y1="420" x2="635" y2="426" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Підписи засічок осі X: Рядок 1 (кратність) -->
  <text x="195" y="442" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1.0×</text>
  <text x="305" y="442" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2.0×</text>
  <text x="415" y="442" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3.0×</text>
  <text x="525" y="442" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">4.0×</text>
  <text x="635" y="442" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">5.0×</text>

  <!-- Підписи засічок осі X: Рядок 2 (струм у мА) -->
  <text x="195" y="460" font-size="12" fill="#6b7280" text-anchor="middle">200 мА</text>
  <text x="305" y="460" font-size="12" fill="#6b7280" text-anchor="middle">400 мА</text>
  <text x="415" y="460" font-size="12" fill="#6b7280" text-anchor="middle">600 мА</text>
  <text x="525" y="460" font-size="12" fill="#6b7280" text-anchor="middle">800 мА</text>
  <text x="635" y="460" font-size="12" fill="#6b7280" text-anchor="middle">1000 мА</text>

  <!-- Назва осі X -->
  <text x="370" y="492" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кратність струму навантаження I / Iном (Iном = 200 мА, Iпуск = 1000 мА)</text>

  <!-- ПРАВА ІНФОРМАЦІЙНА ПАНЕЛЬ -->
  <rect x="670" y="90" width="265" height="430" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="802" y="115" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ПАРАМЕТРИ ТА ЗОНИ</text>

  <!-- Картка 1: Безперервний режим (Зелена) -->
  <rect x="682" y="130" width="241" height="82" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <rect x="682" y="130" width="4" height="82" rx="2" fill="#27ae60"/>
  <text x="696" y="148" font-size="12" font-weight="bold" fill="#27ae60">Безперервний режим (I ≤ 1.0×)</text>
  <text x="696" y="167" font-size="12" fill="#1a1a1a">• Струм: I ≤ 200 мА (номінал)</text>
  <text x="696" y="185" font-size="12" fill="#6b7280">• Час t: не обмежений (t → ∞)</text>
  <text x="696" y="201" font-size="12" fill="#6b7280">• Баланс тепла: Pнагр = Pрозс</text>

  <!-- Картка 2: Пуск та розгін (Синя) -->
  <rect x="682" y="224" width="241" height="80" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <rect x="682" y="224" width="4" height="80" rx="2" fill="#2457d6"/>
  <text x="696" y="242" font-size="12" font-weight="bold" fill="#2457d6">Пуск та розгін (1.0× – 5.0×)</text>
  <text x="696" y="261" font-size="12" fill="#1a1a1a">• Струм: 200 ... 1000 мА</text>
  <text x="696" y="279" font-size="12" fill="#6b7280">• Час: t &lt; tдоп (частки – одиниці с)</text>
  <text x="696" y="295" font-size="12" fill="#6b7280">• Нагрів міді без пробою лаку</text>

  <!-- Картка 3: Блокування вала (Червона) -->
  <rect x="682" y="316" width="241" height="84" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <rect x="682" y="316" width="4" height="84" rx="2" fill="#c0392b"/>
  <text x="696" y="334" font-size="12" font-weight="bold" fill="#c0392b">Аварійний режим (t &gt; tдоп)</text>
  <text x="696" y="353" font-size="12" fill="#1a1a1a">• Блокування вала: I = 1000 мА</text>
  <text x="696" y="371" font-size="12" fill="#c0392b">• Межа стійкості: tдоп ≈ 0.4 с</text>
  <text x="696" y="389" font-size="12" fill="#6b7280">• Наслідок: перегрів &gt;120°C і КЗ</text>

  <!-- Картка 4: Захист в алгоритмі -->
  <rect x="682" y="412" width="241" height="96" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="696" y="430" font-size="12" font-weight="bold" fill="#1a1a1a">Програмний захист (MCU)</text>
  <text x="696" y="450" font-size="12" fill="#2457d6">• Закон: I² · t = const</text>
  <text x="696" y="468" font-size="12" fill="#6b7280">• Опитування АЦП: кожні 10 мс</text>
  <text x="696" y="486" font-size="12" fill="#6b7280">• Дія: відключення ШІМ моста</text>
</svg>
