<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Типова схема підключення інтегрального H-моста</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Розділення силової та логічної земель, фільтрація завад живлення й струмовий шунт</text>

  <!-- Блок 1: МІКРОКОНТРОЛЕР -->
  <rect x="35" y="95" width="150" height="250" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="110" y="125" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">МІКРОКОНТРОЛЕР</text>
  <text x="110" y="145" font-size="12" fill="#6b7280" text-anchor="middle">(MCU / Логіка)</text>
  <text x="110" y="195" font-size="12" fill="#1a1a1a" text-anchor="middle">Генерація сигналів</text>
  <text x="110" y="213" font-size="12" fill="#6b7280" text-anchor="middle">напрямку обертання</text>
  <text x="110" y="231" font-size="12" fill="#6b7280" text-anchor="middle">та апаратного ШІМ</text>
  <text x="110" y="275" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Чиста сигнальна</text>
  <text x="110" y="293" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">земля без завад</text>

  <!-- Піни MCU -->
  <circle cx="185" cy="130" r="2.5" fill="#2457d6"/>
  <circle cx="185" cy="175" r="2.5" fill="#1a1a1a"/>
  <circle cx="185" cy="220" r="2.5" fill="#1a1a1a"/>
  <circle cx="185" cy="265" r="2.5" fill="#1a1a1a"/>
  <circle cx="185" cy="320" r="2.5" fill="#2457d6"/>

  <!-- Лінії керування MCU -> Driver IC -->
  <!-- VCC -->
  <line x1="185" y1="130" x2="372" y2="130" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="282" y="118" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">VCC (живлення логіки)</text>

  <!-- IN1 -->
  <line x1="185" y1="175" x2="372" y2="175" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="282" y="163" font-size="12" fill="#1a1a1a" text-anchor="middle">IN1 — Напрямок 1 (GPIO)</text>

  <!-- IN2 -->
  <line x1="185" y1="220" x2="372" y2="220" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="282" y="208" font-size="12" fill="#1a1a1a" text-anchor="middle">IN2 — Напрямок 2 (GPIO)</text>

  <!-- PWM -->
  <line x1="185" y1="265" x2="372" y2="265" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="282" y="253" font-size="12" fill="#1a1a1a" text-anchor="middle">PWM — Швидкість (ШІМ)</text>

  <!-- GND -->
  <line x1="185" y1="320" x2="380" y2="320" stroke="#2457d6" stroke-width="2"/>
  <text x="282" y="308" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">GND — Логічна земля</text>

  <!-- Блок 2: ДРАЙВЕР H-МОСТА (IC) -->
  <rect x="380" y="95" width="200" height="250" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="2"/>
  <text x="480" y="118" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ДРАЙВЕР H-МОСТА</text>
  <text x="480" y="134" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">TB6612 / DRV8833</text>

  <!-- Внутрішня логіка чіпа -->
  <text x="480" y="172" font-size="12" fill="#1a1a1a" text-anchor="middle">Керуюча логіка</text>
  <text x="480" y="188" font-size="12" fill="#6b7280" text-anchor="middle">термозахист (TSD)</text>
  <line x1="430" y1="202" x2="530" y2="202" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="222" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Силовий H-міст</text>
  <text x="480" y="238" font-size="12" fill="#2457d6" text-anchor="middle">4 MOSFET-ключі</text>
  <text x="480" y="254" font-size="12" fill="#6b7280" text-anchor="middle">+ зворотні діоди</text>

  <!-- Піни чіпа: ліворуч -->
  <circle cx="380" cy="130" r="2.5" fill="#2457d6"/>
  <circle cx="380" cy="175" r="2.5" fill="#1a1a1a"/>
  <circle cx="380" cy="220" r="2.5" fill="#1a1a1a"/>
  <circle cx="380" cy="265" r="2.5" fill="#1a1a1a"/>
  <circle cx="380" cy="320" r="2.5" fill="#2457d6"/>
  <text x="388" y="134" font-size="12" font-weight="bold" fill="#2457d6">VCC</text>
  <text x="388" y="179" font-size="12" fill="#1a1a1a">IN1</text>
  <text x="388" y="224" font-size="12" fill="#1a1a1a">IN2</text>
  <text x="388" y="269" font-size="12" fill="#1a1a1a">PWM</text>
  <text x="388" y="324" font-size="12" font-weight="bold" fill="#2457d6">GND</text>

  <!-- Піни чіпа: праворуч -->
  <circle cx="580" cy="130" r="2.5" fill="#c0392b"/>
  <circle cx="580" cy="220" r="2.5" fill="#2457d6"/>
  <circle cx="580" cy="265" r="2.5" fill="#2457d6"/>
  <circle cx="580" cy="320" r="2.5" fill="#c0392b"/>
  <text x="572" y="134" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">VM</text>
  <text x="572" y="224" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">OUT1</text>
  <text x="572" y="269" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">OUT2</text>
  <text x="572" y="324" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">ISEN</text>

  <!-- Блок 3: ДЖЕРЕЛО ЖИВЛЕННЯ VM -->
  <rect x="830" y="95" width="95" height="90" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="877" y="118" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ДЖЕРЕЛО</text>
  <text x="877" y="134" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+6 В (VM)</text>
  <text x="877" y="150" font-size="12" fill="#6b7280" text-anchor="middle">Батарея / БЖ</text>
  <text x="840" y="134" font-size="12" font-weight="bold" fill="#c0392b">+</text>
  <text x="840" y="174" font-size="12" font-weight="bold" fill="#1a1a1a">−</text>
  <circle cx="830" cy="130" r="2.5" fill="#c0392b"/>
  <circle cx="830" cy="170" r="2.5" fill="#1a1a1a"/>

  <!-- Лінія силового живлення VM (+6V) -->
  <line x1="830" y1="130" x2="588" y2="130" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <circle cx="750" cy="130" r="3" fill="#c0392b"/>
  <circle cx="640" cy="130" r="3" fill="#c0392b"/>

  <!-- Фільтрація шини VM: C_dec (кераміка) -->
  <text x="640" y="104" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">C_dec 0.1 мкФ</text>
  <text x="640" y="118" font-size="12" fill="#6b7280" text-anchor="middle">кераміка (ВЧ)</text>
  <line x1="640" y1="130" x2="640" y2="147" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="630" y1="147" x2="650" y2="147" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="630" y1="153" x2="650" y2="153" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="640" y1="153" x2="640" y2="170" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="640" cy="170" r="3" fill="#1a1a1a"/>

  <!-- Фільтрація шини VM: C_bulk (електроліт) -->
  <text x="750" y="104" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">C_bulk 220 мкФ</text>
  <text x="750" y="118" font-size="12" fill="#6b7280" text-anchor="middle">електроліт</text>
  <line x1="750" y1="130" x2="750" y2="147" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="740" y1="147" x2="760" y2="147" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="740" y1="153" x2="760" y2="153" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="750" y1="153" x2="750" y2="170" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="765" y="145" font-size="12" font-weight="bold" fill="#c0392b">+</text>
  <circle cx="750" cy="170" r="3" fill="#1a1a1a"/>

  <!-- Верхній сегмент PGND від Power Source через конденсатори -->
  <line x1="640" y1="170" x2="830" y2="170" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="830" cy="170" r="3" fill="#1a1a1a"/>

  <!-- Вертикальна силова шина PGND праворуч -->
  <line x1="830" y1="170" x2="830" y2="390" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- Виходи OUT1, OUT2 і Мотор -->
  <line x1="580" y1="220" x2="705" y2="220" stroke="#2457d6" stroke-width="2"/>
  <line x1="580" y1="265" x2="705" y2="265" stroke="#2457d6" stroke-width="2"/>
  <circle cx="635" cy="220" r="3" fill="#2457d6"/>
  <circle cx="635" cy="265" r="3" fill="#2457d6"/>

  <!-- Фільтрувальний конденсатор на клемах мотора (C_filt) -->
  <text x="635" y="194" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">C_filt 100 нФ</text>
  <text x="635" y="208" font-size="12" fill="#6b7280" text-anchor="middle">фільтр завад</text>
  <line x1="635" y1="220" x2="635" y2="239" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="625" y1="239" x2="645" y2="239" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="625" y1="245" x2="645" y2="245" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="635" y1="245" x2="635" y2="265" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Блок мотора -->
  <rect x="705" y="205" width="95" height="72" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="705" cy="220" r="2.5" fill="#2457d6"/>
  <circle cx="705" cy="265" r="2.5" fill="#2457d6"/>
  <circle cx="752" cy="235" r="18" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="752" y="242" font-size="18" font-weight="bold" fill="#2457d6" text-anchor="middle">M</text>
  <text x="752" y="268" font-size="12" fill="#1a1a1a" text-anchor="middle">DC Мотор 6 В</text>

  <!-- Струмовимірювальний шунт Rsense -->
  <line x1="580" y1="320" x2="650" y2="320" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="650" y="315" width="50" height="10" rx="2" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <line x1="700" y1="320" x2="830" y2="320" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="830" cy="320" r="3.5" fill="#1a1a1a"/>
  <text x="675" y="301" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Rsense 0.15 Ом</text>
  <text x="675" y="350" font-size="12" fill="#6b7280" text-anchor="middle">струмовий шунт моста</text>

  <!-- Розділення земель: лінія GND (сигнальна) -->
  <circle cx="200" cy="320" r="3" fill="#2457d6"/>
  <line x1="200" y1="320" x2="200" y2="390" stroke="#2457d6" stroke-width="2"/>
  <line x1="200" y1="390" x2="480" y2="390" stroke="#2457d6" stroke-width="2"/>
  <text x="345" y="376" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">GND — Сигнальна земля МК</text>

  <!-- Розділення земель: лінія PGND (силова) -->
  <line x1="830" y1="390" x2="480" y2="390" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="655" y="376" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">PGND — Силова земля моста</text>

  <!-- Зіркова точка (Star Ground) -->
  <circle cx="480" cy="390" r="7" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <circle cx="480" cy="390" r="3.5" fill="#27ae60"/>
  <text x="480" y="418" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Зіркова точка (Star Ground)</text>
  <text x="480" y="436" font-size="12" fill="#6b7280" text-anchor="middle">Єдина точка з'єднання земель запобігає проникненню завад мотора в логіку</text>
</svg>
