<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="960" height="520" fill="white"/>

<defs>
  <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
  </marker>
</defs>

<!-- Header -->
<text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розподіл зусиль: годинниковий механізм проти мотор-редуктора</text>
<text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">У годиннику крутний момент спадає до анкера, у мотор-редукторі — лавиноподібно зростає до вихідного вала</text>

<!-- Left Panel: Clockwork -->
<rect x="30" y="70" width="440" height="342" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
<text x="48" y="94" font-size="15" font-weight="bold" fill="#1a1a1a">Годинниковий механізм: підвищувальна передача</text>
<text x="48" y="110" font-size="12" fill="#6b7280">Швидкість зростає (i &lt; 1), крутний момент M стрімко спадає</text>

<!-- Clockwork Kinematic Chain -->
<rect x="48" y="124" width="88" height="62" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="92" y="141" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Барабан</text>
<text x="92" y="157" font-size="12" fill="#1a1a1a" text-anchor="middle">Пружина</text>
<text x="92" y="173" font-size="12" fill="#6b7280" text-anchor="middle">~0.1 об/год</text>

<line x1="138" y1="155" x2="152" y2="155" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

<rect x="154" y="124" width="88" height="62" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
<text x="198" y="141" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Проміжне</text>
<text x="198" y="157" font-size="12" fill="#1a1a1a" text-anchor="middle">Колесо I</text>
<text x="198" y="173" font-size="12" fill="#6b7280" text-anchor="middle">~1 об/год</text>

<line x1="244" y1="155" x2="258" y2="155" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

<rect x="260" y="124" width="88" height="62" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
<text x="304" y="141" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Секундне</text>
<text x="304" y="157" font-size="12" fill="#1a1a1a" text-anchor="middle">Колесо II</text>
<text x="304" y="173" font-size="12" fill="#6b7280" text-anchor="middle">1 об/хв</text>

<line x1="350" y1="155" x2="364" y2="155" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

<rect x="366" y="124" width="88" height="62" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="410" y="141" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Анкерне</text>
<text x="410" y="157" font-size="12" fill="#1a1a1a" text-anchor="middle">Балансир</text>
<text x="410" y="173" font-size="12" fill="#6b7280" text-anchor="middle">5–10 Гц</text>

<!-- Clockwork Epure Section -->
<text x="48" y="208" font-size="12" font-weight="bold" fill="#1a1a1a">Епюра крутного моменту M та окружного зусилля Ft:</text>

<!-- Epure Bars: Clockwork -->
<rect x="60" y="226" width="64" height="60" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="92" y="246" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">M = 100%</text>
<text x="92" y="264" font-size="12" fill="#c0392b" text-anchor="middle">Ft пікове</text>
<text x="92" y="278" font-size="12" fill="#6b7280" text-anchor="middle">(max)</text>

<text x="198" y="250" font-size="12" fill="#6b7280" text-anchor="middle">Ft помірне</text>
<rect x="166" y="262" width="64" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="198" y="278" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">M ~ 12%</text>

<text x="304" y="244" font-size="12" fill="#6b7280" text-anchor="middle">Ft мале</text>
<text x="304" y="262" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">M ~ 1.5%</text>
<rect x="272" y="274" width="64" height="12" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

<text x="410" y="244" font-size="12" fill="#27ae60" text-anchor="middle">Ft мізерне</text>
<text x="410" y="262" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">M &lt; 0.1%</text>
<rect x="378" y="280" width="64" height="6" rx="2" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>

<text x="48" y="306" font-size="12" font-weight="bold" fill="#27ae60">↓ Зусилля спадає:</text>
<text x="166" y="306" font-size="12" fill="#6b7280">колеса працюють у режимі мікронавантажень</text>

<!-- Clockwork Callout -->
<rect x="48" y="324" width="406" height="74" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
<text x="62" y="344" font-size="12" font-weight="bold" fill="#27ae60">Вразливий вузол: пружинний барабан (на вході)</text>
<text x="62" y="363" font-size="12" fill="#1a1a1a">Лише пружина і перший триб несуть статичне навантаження.</text>
<text x="62" y="382" font-size="12" fill="#6b7280">Зуби коліс розвантажені — анкер працює без напружень.</text>

<!-- Right Panel: Gearmotor -->
<rect x="490" y="70" width="440" height="342" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
<text x="508" y="94" font-size="15" font-weight="bold" fill="#1a1a1a">Мотор-редуктор: знижувальна передача</text>
<text x="508" y="110" font-size="12" fill="#6b7280">Швидкість падає (i &gt; 1), крутний момент M стрімко зростає</text>

<!-- Gearmotor Kinematic Chain -->
<rect x="508" y="124" width="88" height="62" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
<text x="552" y="141" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вал мотора</text>
<text x="552" y="157" font-size="12" fill="#1a1a1a" text-anchor="middle">Триб d~1 мм</text>
<text x="552" y="173" font-size="12" fill="#6b7280" text-anchor="middle">10 000 об/хв</text>

<line x1="598" y1="155" x2="612" y2="155" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

<rect x="614" y="124" width="88" height="62" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
<text x="658" y="141" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Ступінь 1</text>
<text x="658" y="157" font-size="12" fill="#1a1a1a" text-anchor="middle">Блок-триб I</text>
<text x="658" y="173" font-size="12" fill="#6b7280" text-anchor="middle">~2 000 об/хв</text>

<line x1="704" y1="155" x2="718" y2="155" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

<rect x="720" y="124" width="88" height="62" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
<text x="764" y="141" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Ступінь 2</text>
<text x="764" y="157" font-size="12" fill="#1a1a1a" text-anchor="middle">Блок-триб II</text>
<text x="764" y="173" font-size="12" fill="#6b7280" text-anchor="middle">~450 об/хв</text>

<line x1="810" y1="155" x2="824" y2="155" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

<rect x="826" y="124" width="88" height="62" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="870" y="141" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Вихідний вал</text>
<text x="870" y="157" font-size="12" fill="#1a1a1a" text-anchor="middle">Колесо D-вала</text>
<text x="870" y="173" font-size="12" fill="#6b7280" text-anchor="middle">100 об/хв</text>

<!-- Gearmotor Epure Section -->
<text x="508" y="208" font-size="12" font-weight="bold" fill="#1a1a1a">Епюра крутного моменту M та окружного зусилля Ft:</text>

<!-- Epure Bars: Gearmotor -->
<text x="552" y="244" font-size="12" fill="#2457d6" text-anchor="middle">Ft мізерне</text>
<text x="552" y="262" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">M ~ 1%</text>
<rect x="520" y="280" width="64" height="6" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

<text x="658" y="244" font-size="12" fill="#6b7280" text-anchor="middle">Ft мале</text>
<text x="658" y="262" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">M ~ 5%</text>
<rect x="626" y="274" width="64" height="12" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

<text x="764" y="250" font-size="12" fill="#6b7280" text-anchor="middle">Ft помірне</text>
<rect x="732" y="262" width="64" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="764" y="278" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">M ~ 22%</text>

<rect x="838" y="226" width="64" height="60" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="870" y="246" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">M = 100%</text>
<text x="870" y="264" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">ПІК Ft</text>
<text x="870" y="278" font-size="12" fill="#6b7280" text-anchor="middle">(max згин)</text>

<text x="508" y="306" font-size="12" font-weight="bold" fill="#c0392b">↑ Момент лавиноподібно зростає:</text>
<text x="726" y="306" font-size="12" fill="#6b7280">вихідні зуби перевантажені</text>

<!-- Gearmotor Callout -->
<rect x="508" y="324" width="406" height="74" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
<text x="522" y="344" font-size="12" font-weight="bold" fill="#c0392b">Вразливий вузол: зуби фінального ступеня (на виході)</text>
<text x="522" y="363" font-size="12" fill="#1a1a1a">Колосальний момент спричиняє піковий згин і втому зубів.</text>
<text x="522" y="382" font-size="12" fill="#6b7280">При заклинюванні (stall) ламаються зуби вихідної шестерні.</text>

<!-- Bottom Summary Card -->
<rect x="30" y="426" width="900" height="74" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
<text x="48" y="446" font-size="13" font-weight="bold" fill="#1a1a1a">Інженерний розрахунок і підбір матеріалів передач:</text>
<text x="48" y="466" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#2457d6">• Годинник (i &lt; 1):</tspan> навантаження спадає — модуль m і товщину вінця b зменшують до анкера для мінімізації інерції.</text>
<text x="48" y="485" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#c0392b">• Мотор-редуктор (i &gt; 1):</tspan> момент лавиноподібно зростає — вихідні ступені вимагають збільшеного модуля m та потовщення зубів.</text>
</svg>
