<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-left-blue" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-right-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-left-red" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-right-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Профіль струму мотора та алгоритм захисту від заклинювання</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Маскування пускового сплеску та аварійне вимкнення H-моста за тайм-аутом</text>

  <!-- Верхні картки етапів -->
  <rect x="132" y="74" width="138" height="34" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="201" y="88" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Пуск мотора</text>
  <text x="201" y="102" font-size="12" fill="#2457d6" text-anchor="middle">Маскування t_blank</text>

  <rect x="284" y="74" width="226" height="34" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="397" y="88" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Штатний рух</text>
  <text x="397" y="102" font-size="12" fill="#6b7280" text-anchor="middle">I_ном &lt; I_поріг (норма)</text>

  <rect x="524" y="74" width="192" height="34" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="620" y="88" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">3. Блокування вала</text>
  <text x="620" y="102" font-size="12" fill="#c0392b" text-anchor="middle">Відлік t_timeout</text>

  <rect x="732" y="74" width="174" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="819" y="88" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">4. Аварійний захист</text>
  <text x="819" y="102" font-size="12" fill="#27ae60" text-anchor="middle">FAULT: міст вимкнено</text>

  <!-- Фонове зонування графіка -->
  <rect x="130" y="118" width="145" height="260" fill="#f8fafd"/>
  <rect x="275" y="118" width="245" height="260" fill="#ffffff"/>
  <rect x="520" y="118" width="210" height="260" fill="#fdf7f7"/>
  <rect x="730" y="118" width="180" height="260" fill="#f6fbf8"/>

  <!-- Вертикальні розділювачі етапів -->
  <line x1="275" y1="118" x2="275" y2="378" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1"/>
  <line x1="520" y1="118" x2="520" y2="378" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1"/>
  <line x1="730" y1="118" x2="730" y2="378" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1"/>

  <!-- Поріг спрацьовування струмового захисту -->
  <line x1="130" y1="258" x2="730" y2="258" stroke="#c0392b" stroke-dasharray="6,4" stroke-width="1.5"/>
  <text x="295" y="248" font-size="12" font-weight="bold" fill="#c0392b">Поріг захисту I_поріг (600 мА)</text>

  <!-- Осі координат -->
  <line x1="130" y1="378" x2="915" y2="378" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <text x="915" y="368" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Час t (мс)</text>

  <line x1="130" y1="378" x2="130" y2="114" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <text x="122" y="110" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Струм I (мА)</text>

  <!-- Поділки та підписи на осі Y -->
  <line x1="124" y1="378" x2="130" y2="378" stroke="#6b7280" stroke-width="1"/>
  <text x="120" y="382" font-size="12" fill="#6b7280" text-anchor="end">0</text>

  <line x1="124" y1="338" x2="130" y2="338" stroke="#6b7280" stroke-width="1"/>
  <text x="120" y="342" font-size="12" fill="#6b7280" text-anchor="end">200</text>

  <line x1="124" y1="258" x2="130" y2="258" stroke="#c0392b" stroke-width="1.5"/>
  <text x="120" y="262" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">600</text>

  <line x1="124" y1="178" x2="130" y2="178" stroke="#6b7280" stroke-width="1"/>
  <text x="120" y="182" font-size="12" fill="#6b7280" text-anchor="end">1000</text>

  <!-- Крива струму I(t) -->
  <path d="M 125,378 L 130,378 C 133,378 140,158 155,158 C 170,158 185,270 215,320 C 235,338 255,338 275,338 L 320,338 Q 325,336 330,338 L 380,338 Q 385,340 390,338 L 440,338 Q 445,336 450,338 L 520,338 C 525,338 535,178 550,178 L 730,178 L 738,378 L 900,378" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Ключові точки подій на кривій -->
  <circle cx="130" cy="378" r="3.5" fill="#2457d6"/>
  <circle cx="520" cy="338" r="3.5" fill="#c0392b"/>
  <circle cx="730" cy="178" r="4" fill="#c0392b"/>

  <!-- Текстові позначки на графіку -->
  <!-- Етап 1 -->
  <text x="145" y="134" font-size="12" font-weight="bold" fill="#2457d6">Пусковий сплеск</text>
  <text x="145" y="148" font-size="12" fill="#6b7280">Inrush (до 1100 мА)</text>

  <!-- Етап 2 -->
  <text x="300" y="312" font-size="12" font-weight="bold" fill="#27ae60">Робочий струм I_ном ≈ 200 мА</text>
  <text x="300" y="326" font-size="12" fill="#6b7280">Безпечна зона (I &lt; I_поріг)</text>

  <!-- Етап 3 -->
  <text x="540" y="142" font-size="12" font-weight="bold" fill="#c0392b">Струм блокування I_stall</text>
  <text x="540" y="156" font-size="12" fill="#c0392b">≈ 1000 мА (вал зупинено)</text>
  <text x="545" y="214" font-size="12" font-weight="bold" fill="#c0392b">Струм вище порога:</text>
  <text x="545" y="228" font-size="12" fill="#6b7280">активний таймер захисту</text>

  <!-- Етап 4 -->
  <text x="750" y="196" font-size="12" font-weight="bold" fill="#27ae60">Аварійний зупин (FAULT)</text>
  <text x="750" y="212" font-size="12" fill="#1a1a1a">• H-міст відключено</text>
  <text x="750" y="228" font-size="12" fill="#1a1a1a">• Струм спадає до 0</text>
  <text x="750" y="244" font-size="12" fill="#1a1a1a">• Обмотки захищено</text>

  <!-- Поділки та мітки часу на осі X -->
  <line x1="130" y1="378" x2="130" y2="384" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="130" y="398" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">t = 0</text>

  <line x1="275" y1="378" x2="275" y2="384" stroke="#2457d6" stroke-width="1.5"/>
  <text x="275" y="398" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">t_blank</text>

  <line x1="520" y1="378" x2="520" y2="384" stroke="#c0392b" stroke-width="1.5"/>
  <text x="520" y="398" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">t_stall</text>

  <line x1="730" y1="378" x2="730" y2="384" stroke="#27ae60" stroke-width="1.5"/>
  <text x="730" y="398" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">t_trip</text>

  <!-- Стрілки та підписи часових інтервалів -->
  <line x1="135" y1="416" x2="270" y2="416" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-left-blue)" marker-end="url(#arr-right-blue)"/>
  <line x1="130" y1="412" x2="130" y2="420" stroke="#2457d6" stroke-width="1"/>
  <line x1="275" y1="412" x2="275" y2="420" stroke="#2457d6" stroke-width="1"/>
  <text x="202" y="432" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">t_blanking (~80 мс)</text>

  <text x="397" y="432" font-size="12" fill="#6b7280" text-anchor="middle">Тривалий штатний рух</text>

  <line x1="525" y1="416" x2="725" y2="416" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-left-red)" marker-end="url(#arr-right-red)"/>
  <line x1="520" y1="412" x2="520" y2="420" stroke="#c0392b" stroke-width="1"/>
  <line x1="730" y1="412" x2="730" y2="420" stroke="#c0392b" stroke-width="1"/>
  <text x="625" y="432" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">t_timeout (~150 мс)</text>

  <text x="819" y="432" font-size="12" fill="#27ae60" text-anchor="middle">Стан захисту FAULT</text>

  <!-- Нижні інформаційні картки реакції алгоритму -->
  <rect x="132" y="448" width="138" height="78" rx="4" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1"/>
  <text x="142" y="466" font-size="12" font-weight="bold" fill="#2457d6">Маскування пуску</text>
  <text x="142" y="484" font-size="12" fill="#1a1a1a">ШІМ подано на міст</text>
  <text x="142" y="502" font-size="12" fill="#6b7280">Струм &gt; I_поріг</text>
  <text x="142" y="520" font-size="12" fill="#2457d6">Захист не реагує</text>

  <rect x="284" y="448" width="226" height="78" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="294" y="466" font-size="12" font-weight="bold" fill="#27ae60">Нормальна робота</text>
  <text x="294" y="484" font-size="12" fill="#1a1a1a">Струм I_ном ≈ 200 мА</text>
  <text x="294" y="502" font-size="12" fill="#6b7280">I &lt; I_поріг (безпечно)</text>
  <text x="294" y="520" font-size="12" fill="#27ae60">Таймер захисту = 0</text>

  <rect x="524" y="448" width="192" height="78" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="534" y="466" font-size="12" font-weight="bold" fill="#c0392b">Детекція блокування</text>
  <text x="534" y="484" font-size="12" fill="#1a1a1a">Вал затиснуто (I_stall)</text>
  <text x="534" y="502" font-size="12" fill="#c0392b">I &gt; I_поріг: лічильник++</text>
  <text x="534" y="520" font-size="12" fill="#6b7280">Очікування t_timeout</text>

  <rect x="732" y="448" width="174" height="78" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="742" y="466" font-size="12" font-weight="bold" fill="#27ae60">Реакція на FAULT</text>
  <text x="742" y="484" font-size="12" fill="#1a1a1a">Тайм-аут вичерпано</text>
  <text x="742" y="502" font-size="12" fill="#27ae60">H-міст вимкнено (I = 0)</text>
  <text x="742" y="520" font-size="12" fill="#6b7280">Захист від перегріву</text>
</svg>
