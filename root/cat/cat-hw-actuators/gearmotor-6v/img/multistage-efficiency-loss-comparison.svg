<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Header -->
  <text x="480" y="30" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Каскадні втрати ККД у багатоступеневому редукторі</text>
  <text x="480" y="50" font-size="13" text-anchor="middle" fill="#6b7280">Мультиплікативне спадання потужності: 600 об/хв (η ≈ 72%) проти 100 об/хв (η ≈ 52%)</text>

  <!-- Upper Section: Power flow cascade -->
  <rect x="30" y="68" width="900" height="172" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="88" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Баланс потужності 4 ступенів: P_вх (100%) = P_вих (52.2%) + Σ ΔP_тертя (47.8%)</text>

  <!-- Flow Blocks Row -->
  <!-- Block 0: Rotor -->
  <rect x="46" y="102" width="118" height="52" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="105" y="122" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Ротор двигуна</text>
  <text x="105" y="142" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">P_вх = 100%</text>

  <line x1="164" y1="128" x2="194" y2="128" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Block 1: Stage 1 -->
  <rect x="196" y="102" width="118" height="52" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="255" y="122" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Ступінь 1</text>
  <text x="255" y="142" font-size="12" fill="#2457d6" text-anchor="middle">η₁ = 0.85 → 85%</text>

  <line x1="314" y1="128" x2="344" y2="128" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Block 2: Stage 2 -->
  <rect x="346" y="102" width="118" height="52" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="405" y="122" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Ступінь 2</text>
  <text x="405" y="142" font-size="12" fill="#2457d6" text-anchor="middle">η₂ = 0.85 → 72%</text>

  <line x1="464" y1="128" x2="494" y2="128" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Block 3: Stage 3 -->
  <rect x="496" y="102" width="118" height="52" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="555" y="122" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Ступінь 3</text>
  <text x="555" y="142" font-size="12" fill="#2457d6" text-anchor="middle">η₃ = 0.85 → 61%</text>

  <line x1="614" y1="128" x2="644" y2="128" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Block 4: Stage 4 -->
  <rect x="646" y="102" width="118" height="52" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="705" y="122" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Ступінь 4</text>
  <text x="705" y="142" font-size="12" fill="#2457d6" text-anchor="middle">η₄ = 0.85 → 52%</text>

  <line x1="764" y1="128" x2="794" y2="128" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Block 5: Output Shaft -->
  <rect x="796" y="102" width="118" height="52" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="855" y="122" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вихідний вал</text>
  <text x="855" y="142" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">P_вих ≈ 52.2%</text>

  <!-- Heat Loss Row -->
  <!-- Card 0: Base info -->
  <rect x="46" y="176" width="118" height="52" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="105" y="196" font-size="12" fill="#6b7280" text-anchor="middle">Вхідна енергія</text>
  <text x="105" y="214" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">100% потужності</text>

  <!-- Arrow 1 down -->
  <line x1="255" y1="154" x2="255" y2="174" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <!-- Card 1: Loss 1 -->
  <rect x="196" y="176" width="118" height="52" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="255" y="196" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">ΔP₁ = 15.0%</text>
  <text x="255" y="214" font-size="12" fill="#c0392b" text-anchor="middle">втрати тертя</text>

  <!-- Arrow 2 down -->
  <line x1="405" y1="154" x2="405" y2="174" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <!-- Card 2: Loss 2 -->
  <rect x="346" y="176" width="118" height="52" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="405" y="196" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">ΔP₂ ≈ 12.8%</text>
  <text x="405" y="214" font-size="12" fill="#c0392b" text-anchor="middle">втрати тертя</text>

  <!-- Arrow 3 down -->
  <line x1="555" y1="154" x2="555" y2="174" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <!-- Card 3: Loss 3 -->
  <rect x="496" y="176" width="118" height="52" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="555" y="196" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">ΔP₃ ≈ 10.8%</text>
  <text x="555" y="214" font-size="12" fill="#c0392b" text-anchor="middle">втрати тертя</text>

  <!-- Arrow 4 down -->
  <line x1="705" y1="154" x2="705" y2="174" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <!-- Card 4: Loss 4 -->
  <rect x="646" y="176" width="118" height="52" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="705" y="196" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">ΔP₄ ≈ 9.2%</text>
  <text x="705" y="214" font-size="12" fill="#c0392b" text-anchor="middle">втрати тертя</text>

  <!-- Card 5: Total Loss -->
  <rect x="796" y="176" width="118" height="52" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="855" y="196" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Σ ΔP ≈ 47.8%</text>
  <text x="855" y="214" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">нагрів і знос</text>

  <!-- Lower Section: Comparative Panels -->
  <!-- Left Card: 600 RPM -->
  <rect x="30" y="252" width="440" height="210" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="31" y="253" width="438" height="30" rx="7" fill="#e9f7ef"/>
  <text x="250" y="273" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Модифікація 600 об/хв (швидкісна, 2 ступені)</text>

  <text x="48" y="302" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">Передавальне число:</tspan> i ≈ 16:1 (2 циліндричні ступені)</text>
  <text x="48" y="320" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">Підсумковий ККД:</tspan> η_заг = 0.85² ≈ 72.2% (втрати 27.8%)</text>

  <!-- Efficiency Bar 600 RPM -->
  <rect x="48" y="328" width="274" height="20" rx="4" fill="#27ae60"/>
  <rect x="322" y="328" width="106" height="20" rx="4" fill="#c0392b"/>
  <text x="185" y="342" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ККД: 72.2% корисна потужність</text>
  <text x="375" y="342" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">27.8% втрати</text>

  <text x="48" y="368" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">Вихідний момент:</tspan> M_вих = 16 · 0.722 · M_вх ≈ 11.5 · M_вх</text>

  <!-- Torque Bar 600 RPM -->
  <rect x="48" y="378" width="380" height="18" rx="4" fill="#eaf0fd"/>
  <rect x="48" y="378" width="73" height="18" rx="4" fill="#2457d6"/>
  <text x="128" y="392" font-size="12" font-weight="bold" fill="#2457d6">11.5 · M_вх</text>
  <text x="422" y="392" font-size="12" fill="#6b7280" text-anchor="end">базова тяга (600 об/хв)</text>

  <text x="48" y="420" font-size="12" fill="#27ae60"><tspan font-weight="bold">Призначення:</tspan> висока швидкість, тривалий ресурс</text>
  <text x="48" y="440" font-size="12" fill="#6b7280">Тепловий режим: помірний нагрів, збереження мастила</text>

  <!-- Right Card: 100 RPM -->
  <rect x="490" y="252" width="440" height="210" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="491" y="253" width="438" height="30" rx="7" fill="#eaf0fd"/>
  <text x="710" y="273" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Модифікація 100 об/хв (силова, 4 ступені)</text>

  <text x="508" y="302" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">Передавальне число:</tspan> i ≈ 100:1 (4 циліндричні ступені)</text>
  <text x="508" y="320" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">Підсумковий ККД:</tspan> η_заг = 0.85⁴ ≈ 52.2% (втрати 47.8%)</text>

  <!-- Efficiency Bar 100 RPM -->
  <rect x="508" y="328" width="198" height="20" rx="4" fill="#2457d6"/>
  <rect x="706" y="328" width="182" height="20" rx="4" fill="#c0392b"/>
  <text x="607" y="342" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ККД: 52.2% корисна</text>
  <text x="797" y="342" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">47.8% втрати тепла</text>

  <text x="508" y="368" font-size="12" fill="#1a1a1a"><tspan font-weight="bold">Вихідний момент:</tspan> M_вих = 100 · 0.522 · M_вх ≈ 52.2 · M_вх</text>

  <!-- Torque Bar 100 RPM -->
  <rect x="508" y="378" width="380" height="18" rx="4" fill="#eaf0fd"/>
  <rect x="508" y="378" width="331" height="18" rx="4" fill="#2457d6"/>
  <text x="673" y="392" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">52.2 · M_вх (+354% тяги)</text>

  <text x="508" y="420" font-size="12" fill="#2457d6"><tspan font-weight="bold">Призначення:</tspan> висока тяга на колесах, круті підйоми</text>
  <text x="508" y="440" font-size="12" fill="#c0392b">Тепловий режим: ризик перегріву мастила при тривалій роботі</text>
</svg>
