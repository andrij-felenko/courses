<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Header -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принципова схема силового вузла: MCU, H-міст та фільтрація</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Повна електрична схема з розділенням живлення, фільтрами завад та контрольними точками осцилографа</text>

  <!-- BLOCK 1: MCU & Logic -->
  <rect x="24" y="68" width="220" height="390" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="134" y="92" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">МІКРОКОНТРОЛЕР (MCU)</text>
  <text x="134" y="108" font-size="12" fill="#6b7280" text-anchor="middle">Керуюча логіка 3.3 В / 5 В</text>

  <!-- MCU Chip -->
  <rect x="44" y="126" width="102" height="152" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="95" y="148" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">MCU Core</text>
  <text x="95" y="164" font-size="12" fill="#6b7280" text-anchor="middle">Таймер ШІМ</text>

  <!-- MCU Pins -->
  <text x="52" y="196" font-size="12" font-weight="bold" fill="#c0392b">VDD</text>
  <text x="52" y="240" font-size="12" font-weight="bold" fill="#2457d6">GND</text>
  <text x="138" y="184" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">PWM_A</text>
  <text x="138" y="224" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">PWM_B</text>
  <text x="138" y="260" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">EN</text>

  <!-- MCU Output Wires -->
  <line x1="146" y1="180" x2="258" y2="180" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="146" y1="220" x2="258" y2="220" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="146" y1="256" x2="258" y2="256" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- TP1 on PWM_A -->
  <circle cx="202" cy="180" r="3" fill="#2457d6"/>
  <line x1="202" y1="180" x2="202" y2="160" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="202" cy="160" r="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="194" y="152" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">TP1</text>
  <text x="194" y="166" font-size="12" fill="#6b7280" text-anchor="end">0..3.3 В</text>

  <!-- Decoupling Panel in Block 1 -->
  <rect x="36" y="292" width="196" height="88" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="134" y="310" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Фільтр живлення логіки</text>
  <path d="M 44,196 L 38,196 L 38,332 L 85,332" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <path d="M 44,240 L 40,240 L 40,356 L 85,356" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="85" y1="332" x2="85" y2="340" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="77" y1="340" x2="93" y2="340" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="77" y1="346" x2="93" y2="346" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="85" y1="346" x2="85" y2="356" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="104" y="336" font-size="12" font-weight="bold" fill="#1a1a1a">C_dec: 100 нФ</text>
  <text x="104" y="352" font-size="12" fill="#6b7280">кераміка біля VDD</text>
  <text x="134" y="372" font-size="12" fill="#27ae60" text-anchor="middle">Пригнічує цифрові завади</text>

  <!-- GND_logic to Star GND -->
  <path d="M 40,356 L 40,435 L 258,435" fill="none" stroke="#2457d6" stroke-width="2"/>
  <text x="46" y="426" font-size="12" font-weight="bold" fill="#2457d6">Шина GND_logic (окремий провід)</text>

  <!-- BLOCK 2: H-Bridge Driver Stage -->
  <rect x="258" y="68" width="456" height="390" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="486" y="92" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">СИЛОВИЙ ДРАЙВЕР H-МІСТ</text>
  <text x="486" y="108" font-size="12" fill="#6b7280" text-anchor="middle">4 MOSFET-ключі, діоди Шотткі 1N5819 та фільтр шини</text>

  <!-- V_motor Rail (+6V) -->
  <line x1="272" y1="140" x2="665" y2="140" stroke="#c0392b" stroke-width="2"/>
  <circle cx="272" cy="140" r="4" fill="#c0392b"/>
  <text x="272" y="130" font-size="12" font-weight="bold" fill="#c0392b">+6V (силове)</text>

  <!-- GND_power Rail -->
  <line x1="340" y1="375" x2="665" y2="375" stroke="#1a1a1a" stroke-width="2"/>
  <text x="662" y="392" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">GND_power</text>

  <!-- TP4 on V_motor -->
  <circle cx="360" cy="140" r="3" fill="#2457d6"/>
  <line x1="360" y1="140" x2="360" y2="124" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="360" cy="124" r="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="370" y="128" font-size="12" font-weight="bold" fill="#2457d6">TP4: +6V (пульсації)</text>

  <!-- Gate Driver IC -->
  <rect x="266" y="170" width="58" height="114" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="295" y="192" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ДРАЙВЕР</text>
  <text x="295" y="206" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ЗАТВОРІВ</text>
  <text x="295" y="228" font-size="12" fill="#6b7280" text-anchor="middle">Dead-time</text>
  <text x="295" y="244" font-size="12" fill="#6b7280" text-anchor="middle">захист від</text>
  <text x="295" y="260" font-size="12" fill="#6b7280" text-anchor="middle">к.з. плеча</text>

  <!-- Bulk Capacitor C_bulk -->
  <line x1="360" y1="140" x2="360" y2="235" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="352" y1="235" x2="368" y2="235" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="352" y1="243" x2="368" y2="243" stroke="#1a1a1a" stroke-width="2"/>
  <text x="345" y="233" font-size="12" font-weight="bold" fill="#c0392b">+</text>
  <line x1="360" y1="243" x2="360" y2="375" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="374" y="235" font-size="12" font-weight="bold" fill="#1a1a1a">C_bulk</text>
  <text x="374" y="250" font-size="12" fill="#1a1a1a">470 мкФ</text>
  <text x="374" y="265" font-size="12" fill="#6b7280">електроліт</text>

  <!-- LEG A: Q1, D1, Q2, D2 -->
  <!-- Q1 (High-side) -->
  <line x1="460" y1="140" x2="460" y2="176" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="452" y1="176" x2="452" y2="204" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="457" y1="176" x2="457" y2="204" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="7,3,7"/>
  <line x1="457" y1="180" x2="460" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="457" y1="200" x2="460" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="457,190 463,187 463,193" fill="#1a1a1a"/>
  <line x1="446" y1="190" x2="452" y2="190" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="460" y1="204" x2="460" y2="235" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="444" y="172" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Q1</text>
  <text x="444" y="186" font-size="12" fill="#6b7280" text-anchor="end">High</text>

  <!-- D1 Schottky -->
  <line x1="520" y1="140" x2="520" y2="182" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="513" y1="182" x2="527" y2="182" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="513" y1="182" x2="513" y2="186" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="527" y1="182" x2="527" y2="178" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="513,198 527,198 520,182" fill="#1a1a1a"/>
  <line x1="520" y1="198" x2="520" y2="235" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="508" y="172" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">D1</text>
  <text x="508" y="186" font-size="12" fill="#6b7280" text-anchor="end">1N5819</text>

  <!-- OUT_A midpoint connection and TP2 -->
  <circle cx="460" cy="235" r="3" fill="#1a1a1a"/>
  <circle cx="520" cy="235" r="3" fill="#1a1a1a"/>
  <circle cx="545" cy="235" r="3" fill="#2457d6"/>
  <line x1="545" y1="235" x2="545" y2="222" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="545" cy="222" r="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="545" y="202" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">TP2</text>
  <text x="545" y="217" font-size="12" fill="#6b7280" text-anchor="middle">OUT_A</text>

  <!-- Q2 (Low-side) -->
  <line x1="460" y1="235" x2="460" y2="306" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="452" y1="306" x2="452" y2="334" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="457" y1="306" x2="457" y2="334" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="7,3,7"/>
  <line x1="457" y1="310" x2="460" y2="310" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="457" y1="330" x2="460" y2="330" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="457,320 463,317 463,323" fill="#1a1a1a"/>
  <line x1="446" y1="320" x2="452" y2="320" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="460" y1="334" x2="460" y2="375" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="444" y="302" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Q2</text>
  <text x="444" y="316" font-size="12" fill="#6b7280" text-anchor="end">Low</text>

  <!-- D2 Schottky -->
  <line x1="513" y1="312" x2="527" y2="312" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="513" y1="312" x2="513" y2="316" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="527" y1="312" x2="527" y2="308" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="513,328 527,328 520,312" fill="#1a1a1a"/>
  <line x1="520" y1="328" x2="520" y2="375" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="460" cy="375" r="3" fill="#1a1a1a"/>
  <circle cx="520" cy="375" r="3" fill="#1a1a1a"/>
  <text x="508" y="302" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">D2</text>
  <text x="508" y="316" font-size="12" fill="#6b7280" text-anchor="end">1N5819</text>

  <!-- LEG B: Q3, D3, Q4, D4 -->
  <!-- Q3 (High-side) -->
  <line x1="600" y1="140" x2="600" y2="176" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="592" y1="176" x2="592" y2="204" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="597" y1="176" x2="597" y2="204" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="7,3,7"/>
  <line x1="597" y1="180" x2="600" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="597" y1="200" x2="600" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="597,190 603,187 603,193" fill="#1a1a1a"/>
  <line x1="586" y1="190" x2="592" y2="190" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="600" y1="204" x2="600" y2="275" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="584" y="172" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Q3</text>
  <text x="584" y="186" font-size="12" fill="#6b7280" text-anchor="end">High</text>

  <!-- D3 Schottky -->
  <line x1="660" y1="140" x2="660" y2="182" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="653" y1="182" x2="667" y2="182" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="653" y1="182" x2="653" y2="186" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="667" y1="182" x2="667" y2="178" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="653,198 667,198 660,182" fill="#1a1a1a"/>
  <line x1="660" y1="198" x2="660" y2="275" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="648" y="172" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">D3</text>
  <text x="648" y="186" font-size="12" fill="#6b7280" text-anchor="end">1N5819</text>

  <!-- OUT_A Wire running across Leg B with jumper arch -->
  <path d="M 460,235 L 594,235 A 6,6 0 0 1 606,235 L 728,235" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- OUT_B midpoint connection and TP3 -->
  <circle cx="600" cy="275" r="3" fill="#1a1a1a"/>
  <circle cx="660" cy="275" r="3" fill="#1a1a1a"/>
  <line x1="600" y1="275" x2="728" y2="275" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="692" cy="275" r="3" fill="#2457d6"/>
  <line x1="692" y1="275" x2="692" y2="295" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="692" cy="295" r="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="692" y="314" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">TP3</text>
  <text x="692" y="328" font-size="12" fill="#6b7280" text-anchor="middle">OUT_B</text>

  <!-- Q4 (Low-side) -->
  <line x1="600" y1="275" x2="600" y2="306" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="592" y1="306" x2="592" y2="334" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="597" y1="306" x2="597" y2="334" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="7,3,7"/>
  <line x1="597" y1="310" x2="600" y2="310" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="597" y1="330" x2="600" y2="330" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="597,320 603,317 603,323" fill="#1a1a1a"/>
  <line x1="586" y1="320" x2="592" y2="320" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="600" y1="334" x2="600" y2="375" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="584" y="302" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Q4</text>
  <text x="584" y="316" font-size="12" fill="#6b7280" text-anchor="end">Low</text>

  <!-- D4 Schottky -->
  <line x1="653" y1="312" x2="667" y2="312" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="653" y1="312" x2="653" y2="316" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="667" y1="312" x2="667" y2="308" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="653,328 667,328 660,312" fill="#1a1a1a"/>
  <line x1="660" y1="328" x2="660" y2="375" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="600" cy="375" r="3" fill="#1a1a1a"/>
  <circle cx="660" cy="375" r="3" fill="#1a1a1a"/>
  <text x="648" y="302" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">D4</text>
  <text x="648" y="316" font-size="12" fill="#6b7280" text-anchor="end">1N5819</text>

  <!-- STAR GND -->
  <!-- GND_power drop to Star GND -->
  <line x1="360" y1="375" x2="360" y2="435" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="360" cy="375" r="3" fill="#1a1a1a"/>

  <!-- Power GND input wire -->
  <line x1="272" y1="435" x2="360" y2="435" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="272" cy="435" r="4" fill="#1a1a1a"/>
  <text x="272" y="426" font-size="12" font-weight="bold" fill="#1a1a1a">GND (живлення)</text>

  <!-- Star GND Node -->
  <circle cx="360" cy="435" r="9" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <circle cx="360" cy="435" r="4" fill="#27ae60"/>
  <text x="378" y="432" font-size="12" font-weight="bold" fill="#27ae60">Точка Star GND (зірка)</text>
  <text x="378" y="448" font-size="12" fill="#6b7280">Спільна точка: запобігає збоям MCU від струмів мотора</text>

  <!-- BLOCK 3: DC Gearmotor & Filter -->
  <rect x="728" y="68" width="208" height="390" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="832" y="92" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">МОТОР-РЕДУКТОР ТА ФІЛЬТР</text>
  <text x="832" y="108" font-size="12" fill="#6b7280" text-anchor="middle">3-конденсаторна ЕМС-схема</text>

  <!-- Motor Chassis / Metal Casing -->
  <rect x="744" y="174" width="176" height="162" rx="8" fill="#ffffff" stroke="#6b7280" stroke-dasharray="4,4" stroke-width="1.5"/>
  <text x="832" y="356" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Корпус мотора (Chassis)</text>
  <text x="832" y="372" font-size="12" fill="#27ae60" text-anchor="middle">Зняття іскрового шуму</text>

  <!-- Motor Symbol -->
  <circle cx="832" cy="255" r="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="832" y="261" font-size="18" font-weight="bold" fill="#2457d6" text-anchor="middle">M</text>
  <text x="832" y="295" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">6 В DC</text>
  <text x="832" y="309" font-size="12" fill="#6b7280" text-anchor="middle">Редуктор</text>

  <!-- Motor Terminal Wires -->
  <line x1="728" y1="235" x2="806" y2="235" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="728" y1="275" x2="806" y2="275" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="806" cy="235" r="3" fill="#1a1a1a"/>
  <circle cx="806" cy="275" r="3" fill="#1a1a1a"/>

  <!-- C1 (between terminals) -->
  <circle cx="770" cy="235" r="3" fill="#1a1a1a"/>
  <circle cx="770" cy="275" r="3" fill="#1a1a1a"/>
  <line x1="770" y1="235" x2="770" y2="252" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="763" y1="252" x2="777" y2="252" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="763" y1="258" x2="777" y2="258" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="770" y1="258" x2="770" y2="275" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="770" y="222" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">C1: 100 нФ</text>

  <!-- C2 (OUT_A to chassis) -->
