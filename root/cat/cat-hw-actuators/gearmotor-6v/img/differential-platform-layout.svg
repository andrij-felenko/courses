<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- 1. Фонова біла підкладка -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- 2. Маркери стрілок -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-rev" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- 3. Головний заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Компонування диференціального шасі: геометрія та розподіл навантаження</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Колія B, поздовжня база L, положення центру мас та реакції опор для максимального зчеплення коліс</text>

  <!-- ==================== ЛІВА ПАНЕЛЬ: ВИГЛЯД ЗГОРИ ==================== -->
  <rect x="24" y="72" width="444" height="388" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <text x="44" y="98" font-size="14" font-weight="bold" fill="#1a1a1a">Вигляд згори: кінематична геометрія</text>
  <text x="44" y="116" font-size="12" fill="#6b7280">Колія B, поздовжні плечі центра мас l_drive та l_caster</text>

  <!-- Вектор напрямку руху вперед -->
  <line x1="195" y1="150" x2="195" y2="124" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="207" y="138" font-size="12" font-weight="bold" fill="#2457d6">Рух вперед</text>

  <!-- Поздовжня вісь симетрії (пунктир з розривами для тексту) -->
  <line x1="195" y1="120" x2="195" y2="160" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="195" y1="188" x2="195" y2="212" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="195" y1="268" x2="195" y2="315" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Контур шасі мобільного робота -->
  <rect x="140" y="156" width="110" height="154" rx="16" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Опорний ролик (caster) та підпис ліворуч від корпусу -->
  <circle cx="195" cy="175" r="12" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="195" cy="175" r="6" fill="#2457d6"/>
  <text x="36" y="170" font-size="12" font-weight="bold" fill="#2457d6">Опорний ролик</text>
  <text x="36" y="185" font-size="12" fill="#6b7280">(кулька/ролик)</text>

  <!-- Центр мас (ЦМ): текст всередині корпусу над маркером -->
  <text x="195" y="228" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Центр мас</text>
  <text x="195" y="242" font-size="12" fill="#c0392b" text-anchor="middle">(зсув до осі)</text>
  <!-- Маркер CoG: коло з перехрестям і 2 зафарбованими секторами -->
  <circle cx="195" cy="257" r="9" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <path d="M195,257 L195,248 A9,9 0 0,1 204,257 Z" fill="#c0392b"/>
  <path d="M195,257 L195,266 A9,9 0 0,1 186,257 Z" fill="#c0392b"/>
  <line x1="184" y1="257" x2="206" y2="257" stroke="#c0392b" stroke-width="1"/>
  <line x1="195" y1="246" x2="195" y2="268" stroke="#c0392b" stroke-width="1"/>

  <!-- Ведуча вісь (пунктир між колесами) -->
  <line x1="115" y1="292" x2="275" y2="292" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="108" y="296" font-size="12" fill="#6b7280" text-anchor="end">Вісь коліс</text>

  <!-- Ліве ведуче колесо -->
  <rect x="115" y="267" width="18" height="50" rx="3" fill="#1a1a1a"/>
  <!-- Праве ведуче колесо -->
  <rect x="257" y="267" width="18" height="50" rx="3" fill="#1a1a1a"/>

  <!-- Підписи коліс -->
  <text x="124" y="334" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Ліве колесо</text>
  <text x="266" y="334" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Праве колесо</text>

  <!-- Розмірна лінія колії B -->
  <line x1="124" y1="340" x2="124" y2="368" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="266" y1="340" x2="266" y2="368" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="128" y1="358" x2="262" y2="358" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-rev)" marker-end="url(#arr)"/>
  <text x="195" y="378" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Колія коліс B</text>
  <text x="195" y="394" font-size="12" fill="#6b7280" text-anchor="middle">відстань між центрами коліс</text>

  <!-- Поздовжні розмірні виносні лінії праворуч -->
  <line x1="260" y1="175" x2="440" y2="175" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="260" y1="257" x2="295" y2="257" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="280" y1="292" x2="440" y2="292" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Розмірна лінія l_caster (від ЦМ до ролика) -->
  <line x1="300" y1="179" x2="300" y2="253" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-rev)" marker-end="url(#arr)"/>
  <text x="308" y="210" font-size="12" font-weight="bold" fill="#2457d6">l_caster</text>
  <text x="308" y="224" font-size="12" fill="#6b7280">≈ 0.70 L</text>

  <!-- Розмірна лінія l_drive (від ЦМ до ведучої осі) -->
  <line x1="300" y1="261" x2="300" y2="288" stroke="#27ae60" stroke-width="1.5" marker-start="url(#arr-rev)" marker-end="url(#arr)"/>
  <text x="308" y="278" font-size="12" font-weight="bold" fill="#27ae60">l_drive <tspan font-weight="normal" fill="#6b7280">(0.30 L)</tspan></text>

  <!-- Розмірна лінія повної бази L -->
  <line x1="380" y1="179" x2="380" y2="288" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-rev)" marker-end="url(#arr)"/>
  <text x="388" y="228" font-size="12" font-weight="bold" fill="#1a1a1a">База L</text>
  <text x="388" y="244" font-size="12" fill="#6b7280">повна</text>
  <text x="388" y="258" font-size="12" fill="#6b7280">довжина</text>

  <!-- Картка формули внизу лівої панелі -->
  <rect x="40" y="408" width="412" height="40" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="246" y="424" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Геометрія: L = l_drive + l_caster  |  B — колія ведучих коліс</text>
  <text x="246" y="439" font-size="12" fill="#27ae60" font-weight="bold" text-anchor="middle">Зсув ЦМ до осі: l_drive ≈ 0.3·L (70% маси на ведучих колесах)</text>


  <!-- ==================== ПРАВА ПАНЕЛЬ: ВИГЛЯД ЗБОКУ ==================== -->
  <rect x="492" y="72" width="444" height="388" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <text x="512" y="98" font-size="14" font-weight="bold" fill="#1a1a1a">Вигляд збоку: баланс сил і зчеплення</text>
  <text x="512" y="116" font-size="12" fill="#6b7280">Нормальні реакції опор N_drive, N_caster та сила тяги F_тяг</text>

  <!-- Підписи реакцій над роботом -->
  <text x="580" y="174" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">N_drive ≈ 70% P</text>
  <text x="580" y="189" font-size="12" fill="#27ae60" text-anchor="middle">максимальний притиск</text>

  <text x="780" y="174" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">N_caster ≈ 30% P</text>
  <text x="780" y="189" font-size="12" fill="#2457d6" text-anchor="middle">мінімальне тертя кочення</text>

  <!-- Вектори нормальних реакцій опор (догори) -->
  <!-- N_drive: довгий зелений вектор -->
  <line x1="580" y1="280" x2="580" y2="202" stroke="#27ae60" stroke-width="3" marker-end="url(#arr-green)"/>
  <!-- N_caster: короткий синій вектор -->
  <line x1="780" y1="280" x2="780" y2="240" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- Горизонтальна лінія опорної поверхні -->
  <line x1="520" y1="280" x2="888" y2="280" stroke="#1a1a1a" stroke-width="2"/>
  <text x="896" y="275" font-size="12" fill="#6b7280">Опора</text>

  <!-- Рама робота (профіль) -->
  <rect x="565" y="250" width="240" height="8" rx="2" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Акумулятор / блок маси (зміщений назад) -->
  <rect x="590" y="230" width="40" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="610" y="244" font-size="12" fill="#2457d6" text-anchor="middle">АКБ</text>

  <!-- Ведуче колесо в профіль (діаметр D = 56) -->
  <circle cx="580" cy="252" r="28" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="580" cy="252" r="16" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="580" cy="252" r="3" fill="#1a1a1a"/>

  <!-- Опорний ролик (caster) в профіль -->
  <path d="M774,258 L774,268 L786,268 L786,258" fill="#d0d7de" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="780" cy="270" r="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <circle cx="780" cy="270" r="3" fill="#2457d6"/>

  <!-- Центр мас (ЦМ) в профіль -->
  <circle cx="640" cy="250" r="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <path d="M640,250 L640,242 A8,8 0 0,1 648,250 Z" fill="#c0392b"/>
  <path d="M640,250 L640,258 A8,8 0 0,1 632,250 Z" fill="#c0392b"/>
  <line x1="630" y1="250" x2="650" y2="250" stroke="#c0392b" stroke-width="1"/>
  <line x1="640" y1="240" x2="640" y2="260" stroke="#c0392b" stroke-width="1"/>

  <!-- Підпис центру мас та ваги P над рамою -->
  <text x="650" y="226" font-size="12" font-weight="bold" fill="#c0392b">ЦМ: P = m·g</text>
  <text x="650" y="240" font-size="12" fill="#6b7280">(вага робота)</text>

  <!-- Вектор сили тяжіння P = m·g (донизу від ЦМ) -->
  <line x1="640" y1="258" x2="640" y2="312" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-red)"/>

  <!-- Вектор сили тяги F_тяг (горизонтально вперед від плями контакту) -->
  <line x1="582" y1="280" x2="630" y2="280" stroke="#27ae60" stroke-width="3" marker-end="url(#arr-green)"/>
  <text x="570" y="302" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Колесо Ø D</text>
  <text x="652" y="302" font-size="12" font-weight="bold" fill="#27ae60">F_тяг = μ · N_drive</text>

  <!-- Розмірна лінія повної бази L під опорною поверхнею -->
  <line x1="580" y1="285" x2="580" y2="326" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="780" y1="285" x2="780" y2="326" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="584" y1="322" x2="776" y2="322" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-rev)" marker-end="url(#arr)"/>
  <text x="680" y="342" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">База L = l_drive + l_caster</text>

  <!-- Пояснювальний блок знизу правої панелі -->
  <rect x="508" y="360" width="412" height="88" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="524" y="378" font-size="12" font-weight="bold" fill="#1a1a1a">Чому розподіл 70% / 30% є оптимальним:</text>

  <circle cx="532" cy="394" r="4" fill="#27ae60"/>
  <text x="544" y="398" font-size="12" font-weight="bold" fill="#27ae60">65–75% на ведучі колеса:</text>
  <text x="544" y="414" font-size="12" fill="#6b7280">висока тяга F_тяг = μ·N_drive, захист від буксування</text>

  <circle cx="532" cy="428" r="4" fill="#2457d6"/>
  <text x="544" y="432" font-size="12" font-weight="bold" fill="#2457d6">25–35% на ролик:</text>
  <text x="655" y="432" font-size="12" fill="#6b7280">захист від перекидання під час розгону</text>
</svg>
