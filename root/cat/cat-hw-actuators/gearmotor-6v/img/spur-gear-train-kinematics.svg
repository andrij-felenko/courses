<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Біла підкладка полотна -->
  <rect width="960" height="460" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кінематична схема триступеневого циліндричного редуктора</text>
  <text x="480" y="63" font-size="13" fill="#6b7280" text-anchor="middle">Почергова зміна напрямку обертання, ступеневе сповільнення швидкості та множення моменту (u = 27:1)</text>

  <!-- ВЕРХНЯ ПАНЕЛЬ: КІНЕМАТИЧНА СХЕМА -->
  <rect x="24" y="76" width="912" height="218" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Назва панелі та бейджі ступенів -->
  <text x="36" y="100" font-size="12" font-weight="bold" fill="#6b7280">КІНЕМАТИЧНА СХЕМА</text>

  <rect x="180" y="86" width="105" height="20" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="232" y="100" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Ступінь 1 (u₁ = 3:1)</text>

  <rect x="390" y="86" width="105" height="20" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="442" y="100" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Ступінь 2 (u₂ = 3:1)</text>

  <rect x="600" y="86" width="105" height="20" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="652" y="100" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Ступінь 3 (u₃ = 3:1)</text>

  <rect x="755" y="86" width="165" height="20" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="837" y="100" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Разом: u = 3×3×3 = 27:1</text>

  <!-- МОТОР (Вхідний привод) -->
  <rect x="36" y="114" width="64" height="36" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="68" y="130" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">МОТОР</text>
  <text x="68" y="144" font-size="12" fill="#6b7280" text-anchor="middle">6 В DC</text>

  <!-- ВАЛ 0 (Вал мотора, y = 132) -->
  <line x1="100" y1="132" x2="210" y2="132" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="254" y1="132" x2="275" y2="132" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Опори (підшипники) Вала 0 -->
  <rect x="116" y="125" width="10" height="14" fill="white" stroke="#6b7280" stroke-width="1"/>
  <line x1="116" y1="125" x2="126" y2="139" stroke="#6b7280" stroke-width="1"/>
  <line x1="116" y1="139" x2="126" y2="125" stroke="#6b7280" stroke-width="1"/>

  <rect x="265" y="125" width="10" height="14" fill="white" stroke="#6b7280" stroke-width="1"/>
  <line x1="265" y1="125" x2="275" y2="139" stroke="#6b7280" stroke-width="1"/>
  <line x1="265" y1="139" x2="275" y2="125" stroke="#6b7280" stroke-width="1"/>

  <!-- Обертання Вала 0 -->
  <path d="M 160,126 A 7 7 0 1 1 172,130" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="168" y="119" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">CW ↻</text>

  <!-- Шестерня z1 (піньйон мотора, 10 зубів) -->
  <rect x="210" y="122" width="44" height="20" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="232" y="136" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">z₁ = 10</text>

  <!-- Точка зачеплення 1 -->
  <circle cx="232" cy="142" r="2.5" fill="#2457d6"/>

  <!-- ВАЛ 1 (Перший проміжний вал, y = 172) -->
  <line x1="254" y1="172" x2="420" y2="172" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Опори (підшипники) Вала 1 -->
  <rect x="192" y="165" width="10" height="14" fill="white" stroke="#6b7280" stroke-width="1"/>
  <line x1="192" y1="165" x2="202" y2="179" stroke="#6b7280" stroke-width="1"/>
  <line x1="192" y1="179" x2="202" y2="165" stroke="#6b7280" stroke-width="1"/>

  <rect x="472" y="165" width="10" height="14" fill="white" stroke="#6b7280" stroke-width="1"/>
  <line x1="472" y1="165" x2="482" y2="179" stroke="#6b7280" stroke-width="1"/>
  <line x1="472" y1="179" x2="482" y2="165" stroke="#6b7280" stroke-width="1"/>

  <!-- Колесо z2 (30 зубів) -->
  <rect x="210" y="142" width="44" height="60" rx="2" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="232" y="176" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">z₂ = 30</text>

  <!-- Обертання Вала 1 -->
  <path d="M 344,166 A 7 7 0 1 1 332,170" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="337" y="159" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">CCW ↺</text>
  <text x="337" y="197" font-size="12" fill="#6b7280" text-anchor="middle">Вал 1 (проміжний)</text>

  <!-- Шестерня z3 (піньйон на валу 1, 10 зубів) -->
  <rect x="420" y="162" width="44" height="20" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="442" y="176" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">z₃ = 10</text>

  <!-- Точка зачеплення 2 -->
  <circle cx="442" cy="182" r="2.5" fill="#2457d6"/>

  <!-- ВАЛ 2 (Другий проміжний вал, y = 212) -->
  <line x1="464" y1="212" x2="630" y2="212" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Опори (підшипники) Вала 2 -->
  <rect x="402" y="205" width="10" height="14" fill="white" stroke="#6b7280" stroke-width="1"/>
  <line x1="402" y1="205" x2="412" y2="219" stroke="#6b7280" stroke-width="1"/>
  <line x1="402" y1="219" x2="412" y2="205" stroke="#6b7280" stroke-width="1"/>

  <rect x="682" y="205" width="10" height="14" fill="white" stroke="#6b7280" stroke-width="1"/>
  <line x1="682" y1="205" x2="692" y2="219" stroke="#6b7280" stroke-width="1"/>
  <line x1="682" y1="219" x2="692" y2="205" stroke="#6b7280" stroke-width="1"/>

