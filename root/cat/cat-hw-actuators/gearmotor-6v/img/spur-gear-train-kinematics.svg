  <rect x="630" y="222" width="44" height="60" rx="2" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="652" y="256" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">z₆ = 30</text>

  <!-- Обертання Вала 3 -->
  <path d="M 776,246 A 7 7 0 1 1 764,250" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="769" y="239" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">CCW ↺</text>
  <text x="769" y="277" font-size="12" fill="#6b7280" text-anchor="middle">Вал 3 (вихідний)</text>

  <!-- ВИХІДНИЙ БЛОК (D-вал) -->
  <rect x="836" y="234" width="74" height="36" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="873" y="250" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">ВИХІД</text>
  <text x="873" y="264" font-size="12" fill="#6b7280" text-anchor="middle">D-вал</text>

  <!-- НИЖНЯ ПАНЕЛЬ: ПОЕТАПНІ ПАРАМЕТРИ ТА СИЛОВЕ ПЕРЕТВОРЕННЯ -->

  <!-- Картка 0: Вхідний вал -->
  <rect x="24" y="308" width="213" height="130" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="130" y="333" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">ВХІД: ВАЛ МОТОРА</text>
  <text x="38" y="354" font-size="12" fill="#1a1a1a">Напрямок:</text>
  <text x="220" y="354" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">CW ↻ (за год.)</text>
  <text x="38" y="375" font-size="12" fill="#1a1a1a">Швидкість:</text>
  <text x="220" y="375" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">6000 об/хв</text>
  <rect x="38" y="383" width="182" height="6" rx="3" fill="#eaf0fd"/>
  <rect x="38" y="383" width="182" height="6" rx="3" fill="#2457d6"/>
  <text x="38" y="407" font-size="12" fill="#1a1a1a">Момент:</text>
  <text x="220" y="407" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">1,0 × T_вх</text>
  <rect x="38" y="415" width="182" height="6" rx="3" fill="#e9f7ef"/>
  <rect x="38" y="415" width="7" height="6" rx="3" fill="#27ae60"/>

  <line x1="240" y1="373" x2="252" y2="373" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Картка 1: Проміжний вал 1 -->
  <rect x="257" y="308" width="213" height="130" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="364" y="333" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ПРОМІЖНИЙ ВАЛ 1</text>
  <text x="271" y="354" font-size="12" fill="#1a1a1a">Напрямок:</text>
  <text x="453" y="354" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">CCW ↺ (проти)</text>
  <text x="271" y="375" font-size="12" fill="#1a1a1a">Швидкість:</text>
  <text x="453" y="375" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">2000 об/хв</text>
  <rect x="271" y="383" width="182" height="6" rx="3" fill="#eaf0fd"/>
  <rect x="271" y="383" width="61" height="6" rx="3" fill="#2457d6"/>
  <text x="271" y="407" font-size="12" fill="#1a1a1a">Момент:</text>
  <text x="453" y="407" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">~3,0 × T_вх</text>
  <rect x="271" y="415" width="182" height="6" rx="3" fill="#e9f7ef"/>
  <rect x="271" y="415" width="20" height="6" rx="3" fill="#27ae60"/>

  <line x1="473" y1="373" x2="485" y2="373" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Картка 2: Проміжний вал 2 -->
  <rect x="490" y="308" width="213" height="130" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="597" y="333" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ПРОМІЖНИЙ ВАЛ 2</text>
  <text x="504" y="354" font-size="12" fill="#1a1a1a">Напрямок:</text>
  <text x="686" y="354" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">CW ↻ (за год.)</text>
  <text x="504" y="375" font-size="12" fill="#1a1a1a">Швидкість:</text>
  <text x="686" y="375" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">667 об/хв</text>
  <rect x="504" y="383" width="182" height="6" rx="3" fill="#eaf0fd"/>
  <rect x="504" y="383" width="20" height="6" rx="3" fill="#2457d6"/>
  <text x="504" y="407" font-size="12" fill="#1a1a1a">Момент:</text>
  <text x="686" y="407" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">~9,0 × T_вх</text>
  <rect x="504" y="415" width="182" height="6" rx="3" fill="#e9f7ef"/>
  <rect x="504" y="415" width="61" height="6" rx="3" fill="#27ae60"/>

  <line x1="706" y1="373" x2="718" y2="373" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Картка 3: Вихідний вал -->
  <rect x="723" y="308" width="213" height="130" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="830" y="333" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">ВИХІД: ВАЛ РЕДУКТОРА</text>
  <text x="737" y="354" font-size="12" fill="#1a1a1a">Напрямок:</text>
  <text x="919" y="354" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">CCW ↺ (проти)</text>
  <text x="737" y="375" font-size="12" fill="#1a1a1a">Швидкість:</text>
  <text x="919" y="375" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">222 об/хв</text>
  <rect x="737" y="383" width="182" height="6" rx="3" fill="#eaf0fd"/>
  <rect x="737" y="383" width="7" height="6" rx="3" fill="#2457d6"/>
  <text x="737" y="407" font-size="12" fill="#1a1a1a">Момент:</text>
  <text x="919" y="407" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">~27 × T_вх</text>
  <rect x="737" y="415" width="182" height="6" rx="3" fill="#e9f7ef"/>
  <rect x="737" y="415" width="182" height="6" rx="3" fill="#27ae60"/>
</svg>
