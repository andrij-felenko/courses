  <rect x="420" y="182" width="44" height="60" rx="2" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="442" y="216" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">z₄ = 30</text>

  <!-- Обертання Вала 2 -->
  <path d="M 539,206 A 7 7 0 1 1 551,210" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="547" y="199" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">CW ↻</text>
  <text x="547" y="237" font-size="12" fill="#6b7280" text-anchor="middle">Вал 2 (проміжний)</text>

  <!-- Шестерня z5 (піньйон на валу 2, 10 зубів) -->
  <rect x="630" y="202" width="44" height="20" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="652" y="216" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">z₅ = 10</text>

  <!-- Точка зачеплення 3 -->
  <circle cx="652" cy="222" r="2.5" fill="#2457d6"/>

  <!-- ВАЛ 3 (Вихідний вал, y = 252) -->
  <line x1="674" y1="252" x2="836" y2="252" stroke="#1a1a1a" stroke-width="4"/>

  <!-- Опори (підшипники) Вала 3 -->
  <rect x="612" y="245" width="10" height="14" fill="white" stroke="#6b7280" stroke-width="1"/>
  <line x1="612" y1="245" x2="622" y2="259" stroke="#6b7280" stroke-width="1"/>
  <line x1="612" y1="259" x2="622" y2="245" stroke="#6b7280" stroke-width="1"/>

  <rect x="692" y="245" width="10" height="14" fill="white" stroke="#6b7280" stroke-width="1"/>
  <line x1="692" y1="245" x2="702" y2="259" stroke="#6b7280" stroke-width="1"/>
  <line x1="692" y1="259" x2="702" y2="245" stroke="#6b7280" stroke-width="1"/>

