<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- 1. Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- 2. Header -->
  <text x="480" y="38" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Розподіл швидкості, колового зусилля та вибір матеріалів у каскаді редуктора</text>
  <text x="480" y="57" font-size="13" text-anchor="middle" fill="#6b7280">Швидкість спадає, а колове зусилля на зубцях лавиноподібно зростає — від пластику POM до зміцненої латуні й сталі</text>

  <!-- 3. Section 0: Stages Bar -->
  <rect x="25" y="72" width="150" height="30" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="100" y="91" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кінематичний ланцюг</text>

  <!-- Stage 0 -->
  <rect x="190" y="72" width="137" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="258.5" y="91" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">0: Вал мотора</text>
  <line x1="331" y1="87" x2="338" y2="87" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Stage 1 -->
  <rect x="342" y="72" width="137" height="30" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="410.5" y="91" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1-й щабель</text>
  <line x1="483" y1="87" x2="490" y2="87" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Stage 2 -->
  <rect x="494" y="72" width="137" height="30" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="562.5" y="91" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2-й щабель</text>
  <line x1="635" y1="87" x2="642" y2="87" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Stage 3 -->
  <rect x="646" y="72" width="137" height="30" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="714.5" y="91" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3-й щабель</text>
  <line x1="787" y1="87" x2="794" y2="87" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Stage 4 -->
  <rect x="798" y="72" width="137" height="30" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="866.5" y="91" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">4: Вихідний вал</text>

  <!-- 4. Tier 1: Kinematics -->
  <rect x="25" y="115" width="150" height="68" rx="4" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="100" y="145" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кінематична схема</text>
  <text x="100" y="163" font-size="12" fill="#6b7280" text-anchor="middle">пари зачеплення</text>

  <rect x="190" y="115" width="745" height="68" rx="4" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Gears -->
  <!-- Stage 0 gear -->
  <rect x="238" y="136" width="10" height="4" rx="1" fill="#6b7280"/>
  <circle cx="258.5" cy="138" r="11" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="258.5" cy="138" r="3.5" fill="#2457d6"/>
  <text x="258.5" y="173" font-size="12" fill="#1a1a1a" text-anchor="middle">Піньйон z₁=9</text>

  <!-- Stage 1 gear -->
  <circle cx="403" cy="138" r="15" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="418" cy="138" r="9" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="418" cy="138" r="3" fill="#2457d6"/>
  <text x="410.5" y="173" font-size="12" fill="#1a1a1a" text-anchor="middle">Блок z₂=29 / z₃=9</text>

  <!-- Stage 2 gear -->
  <circle cx="555" cy="138" r="15" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="570" cy="138" r="9" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="570" cy="138" r="3" fill="#6b7280"/>
  <text x="562.5" y="173" font-size="12" fill="#1a1a1a" text-anchor="middle">Блок z₄=29 / z₅=9</text>

  <!-- Stage 3 gear -->
  <circle cx="707" cy="138" r="15" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="722" cy="138" r="9" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="722" cy="138" r="3" fill="#c0392b"/>
  <text x="714.5" y="173" font-size="12" fill="#1a1a1a" text-anchor="middle">Блок z₆=28 / z₇=9</text>

  <!-- Stage 4 gear -->
  <circle cx="866.5" cy="138" r="16" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <circle cx="866.5" cy="138" r="5" fill="#c0392b"/>
  <line x1="868.5" y1="134" x2="868.5" y2="142" stroke="white" stroke-width="1.5"/>
  <rect x="886" y="136" width="10" height="4" rx="1" fill="#6b7280"/>
  <text x="866.5" y="173" font-size="12" fill="#1a1a1a" text-anchor="middle">Колесо вала z₈=28</text>

  <!-- Kinematic flow links -->
  <path d="M 272,130 C 300,121 345,121 386,130" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="2,2" marker-end="url(#arr-gray)"/>
  <path d="M 430,130 C 458,121 500,121 538,130" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="2,2" marker-end="url(#arr-gray)"/>
  <path d="M 582,130 C 610,121 652,121 690,130" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="2,2" marker-end="url(#arr-gray)"/>
  <path d="M 734,130 C 762,121 805,121 848,130" fill="none" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="2,2" marker-end="url(#arr-gray)"/>

  <!-- 5. Tier 2: Speed n (rpm) -->
  <rect x="25" y="196" width="150" height="68" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="100" y="226" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Частота n, об/хв</text>
  <text x="100" y="246" font-size="12" fill="#2457d6" text-anchor="middle">Стрімке спадання ↓</text>

  <rect x="190" y="196" width="745" height="68" rx="4" fill="#f8fafd" stroke="#d0d7de"/>

  <!-- Values -->
  <text x="258.5" y="215" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">10 000 об/хв</text>
  <text x="410.5" y="215" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">3 100 об/хв</text>
  <text x="562.5" y="215" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">960 об/хв</text>
  <text x="714.5" y="215" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">310 об/хв</text>
  <text x="866.5" y="215" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">100 об/хв</text>

  <!-- Speed Axis & Bars -->
  <line x1="215" y1="256" x2="910" y2="256" stroke="#d0d7de" stroke-width="1"/>
  <rect x="246" y="227" width="25" height="29" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <rect x="398" y="238" width="25" height="18" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <rect x="550" y="245" width="25" height="11" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <rect x="702" y="250" width="25" height="6" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <rect x="854" y="253" width="25" height="3" rx="1.5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>

  <!-- Curve -->
  <path d="M 258.5,227 C 320,234 370,237 410.5,238 C 470,241 520,244 562.5,245 C 620,248 670,250 714.5,250 C 770,251 820,253 866.5,253" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="258.5" cy="227" r="3.5" fill="#2457d6"/>
  <circle cx="410.5" cy="238" r="3.5" fill="#2457d6"/>
  <circle cx="562.5" cy="245" r="3.5" fill="#2457d6"/>
  <circle cx="714.5" cy="250" r="3.5" fill="#2457d6"/>
  <circle cx="866.5" cy="253" r="3.5" fill="#2457d6"/>

  <!-- 6. Tier 3: Tangential Force Ft -->
  <rect x="25" y="277" width="150" height="68" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="100" y="307" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Колове зусилля Ft</text>
  <text x="100" y="327" font-size="12" fill="#c0392b" text-anchor="middle">Лавиноподібне ↑</text>

  <rect x="190" y="277" width="745" height="68" rx="4" fill="#fdf7f7" stroke="#d0d7de"/>

  <!-- Values -->
  <text x="258.5" y="296" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">~0.08 Н</text>
  <text x="410.5" y="296" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">~0.30 Н</text>
  <text x="562.5" y="296" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">~1.00 Н</text>
  <text x="714.5" y="296" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">~3.20 Н</text>
  <text x="866.5" y="296" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">~10 Н (пік >35 Н)</text>

  <!-- Force Axis & Bars -->
  <line x1="215" y1="338" x2="910" y2="338" stroke="#d0d7de" stroke-width="1"/>
  <rect x="246" y="335" width="25" height="3" rx="1.5" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <rect x="398" y="333" width="25" height="5" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <rect x="550" y="328" width="25" height="10" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <rect x="702" y="320" width="25" height="18" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <rect x="854" y="309" width="25" height="29" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>

  <!-- Curve -->
  <path d="M 258.5,335 C 320,334 370,333 410.5,333 C 470,331 520,329 562.5,328 C 620,325 670,322 714.5,320 C 770,317 820,312 866.5,309" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="258.5" cy="335" r="3.5" fill="#c0392b"/>
  <circle cx="410.5" cy="333" r="3.5" fill="#c0392b"/>
  <circle cx="562.5" cy="328" r="3.5" fill="#c0392b"/>
  <circle cx="714.5" cy="320" r="3.5" fill="#c0392b"/>
  <circle cx="866.5" cy="309" r="3.5" fill="#c0392b"/>

  <!-- 7. Tier 4: Materials Zoning -->
  <rect x="25" y="358" width="150" height="68" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="100" y="388" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Матеріал коліс</text>
  <text x="100" y="408" font-size="12" fill="#27ae60" text-anchor="middle">та призначення</text>

  <!-- Panel 1: Polymers (POM) -->
  <rect x="190" y="358" width="289" height="68" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="334.5" y="377" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Поліацеталь (POM / Delrin)</text>
  <text x="334.5" y="395" font-size="12" fill="#1a1a1a" text-anchor="middle">Низький шум, самозмащення, мала інерція</text>
  <text x="334.5" y="413" font-size="12" fill="#6b7280" text-anchor="middle">Зусилля мізерне — знос зубців мінімальний</text>

  <!-- Panel 2: Transition pair -->
  <rect x="494" y="358" width="137" height="68" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="562.5" y="377" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">POM / Латунь</text>
  <text x="562.5" y="395" font-size="12" fill="#6b7280" text-anchor="middle">Перехідна пара</text>
  <text x="562.5" y="413" font-size="12" fill="#6b7280" text-anchor="middle">Середній момент</text>

  <!-- Panel 3: Metals (Brass/Steel) -->
  <rect x="646" y="358" width="289" height="68" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="790.5" y="377" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Пресована латунь / Гартована сталь</text>
  <text x="790.5" y="395" font-size="12" fill="#1a1a1a" text-anchor="middle">Висока контактна міцність проти пітингу</text>
  <text x="790.5" y="413" font-size="12" fill="#6b7280" text-anchor="middle">Стійкість до зрізу вінця при заклинюванні</text>

  <!-- 8. Bottom Summary Panel -->
  <rect x="25" y="439" width="910" height="60" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="38" y="452" width="160" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="118" y="473" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Інженерний баланс</text>
  <text x="215" y="463" font-size="12" fill="#1a1a1a">Гібридний редуктор: початкові пластикові шестерні забезпечують акустичний комфорт і легкий старт,</text>
  <text x="215" y="484" font-size="12" fill="#6b7280">а кінцеві металеві вінці тримають лавиноподібний крутний момент та захищають привід від зрізання зубів.</text>
</svg>
