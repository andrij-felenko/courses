<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Топологія розведення земляних полігонів (Star Ground)</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Розділення Logic GND і Power GND біля роз'єму усуває збої живлення MCU</text>

  <!-- Контур друкованої плати -->
  <rect x="30" y="74" width="900" height="364" rx="8" fill="#f8fafc" stroke="#d0d7de" stroke-width="2"/>
  <text x="48" y="92" font-size="12" font-weight="bold" fill="#6b7280">ДВОШАРОВА ПЛАТА: ВЕРХНІЙ ТА НИЖНІЙ МІДНІ ПОЛІГОНИ ЗЕМЛІ</text>
  <text x="912" y="92" font-size="12" fill="#6b7280" text-anchor="end">Шина 0 В (Return Path)</text>

  <!-- Полігон Logic GND (ліва частина) -->
  <rect x="46" y="104" width="390" height="234" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="58" y="114" width="160" height="24" rx="4" fill="#2457d6"/>
  <text x="138" y="130" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ПОЛІГОН LOGIC GND</text>
  <text x="230" y="130" font-size="12" font-weight="bold" fill="#2457d6">Тиха зона логіки</text>

  <!-- Стабілізатор напруги LDO -->
  <rect x="58" y="150" width="104" height="74" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
  <text x="110" y="172" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">LDO 5В / 3.3В</text>
  <text x="110" y="190" font-size="12" fill="#6b7280" text-anchor="middle">Стабілізатор</text>
  <text x="110" y="208" font-size="12" fill="#2457d6" text-anchor="middle">живлення MCU</text>

  <!-- Блокувальний конденсатор -->
  <rect x="58" y="238" width="104" height="42" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
  <text x="110" y="256" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">C1 100 нФ</text>
  <text x="110" y="272" font-size="12" fill="#6b7280" text-anchor="middle">Фільтр VDD</text>

  <!-- Мікроконтролер (MCU) -->
  <rect x="180" y="150" width="144" height="116" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="252" y="174" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мікроконтролер</text>
  <text x="252" y="194" font-size="12" fill="#6b7280" text-anchor="middle">(MCU: 3.3 В / 5 В)</text>
  <text x="252" y="218" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ШІМ-генератор</text>
  <text x="252" y="238" font-size="12" fill="#6b7280" text-anchor="middle">Soft-start пуск</text>
  <text x="252" y="256" font-size="12" fill="#27ae60" text-anchor="middle">Стабільна опорна GND</text>

  <!-- Інформаційна панель тихої зони -->
  <rect x="180" y="280" width="242" height="46" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
  <text x="301" y="298" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">✓ ЧИСТИЙ ПОТЕНЦІАЛ GND</text>
  <text x="301" y="316" font-size="12" fill="#1a1a1a" text-anchor="middle">Струми мотора сюди не йдуть</text>

  <!-- Тексти ізоляційного зазору (рівня) -->
  <text x="480" y="122" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Ізоляція</text>
  <text x="480" y="138" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">зазор міді</text>
  <text x="480" y="154" font-size="12" fill="#6b7280" text-anchor="middle">(бар'єр)</text>

  <!-- Лінії керування через зазор -->
  <line x1="324" y1="186" x2="536" y2="186" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="324" y1="216" x2="536" y2="216" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="324" y1="246" x2="536" y2="246" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Позначки сигналів у зазорі -->
  <text x="480" y="172" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ШІМ PWM</text>
  <text x="480" y="270" font-size="12" fill="#2457d6" text-anchor="middle">DIR реверс</text>
  <text x="480" y="294" font-size="12" fill="#6b7280" text-anchor="middle">Без струмів</text>
  <text x="480" y="312" font-size="12" fill="#6b7280" text-anchor="middle">повернення</text>

  <!-- Полігон Power GND (права частина) -->
  <rect x="524" y="104" width="390" height="234" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="536" y="114" width="160" height="24" rx="4" fill="#c0392b"/>
  <text x="616" y="130" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ПОЛІГОН POWER GND</text>
  <text x="708" y="130" font-size="12" font-weight="bold" fill="#c0392b">Шумна силова зона</text>

  <!-- Силовий H-міст / Драйвер -->
  <rect x="536" y="150" width="144" height="116" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="608" y="174" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">H-міст / Драйвер</text>
  <text x="608" y="194" font-size="12" fill="#6b7280" text-anchor="middle">(Силові ключі 6 В)</text>
  <text x="608" y="218" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Діоди Шотткі</text>
  <text x="608" y="238" font-size="12" fill="#6b7280" text-anchor="middle">Гасіння проти-ЕРС</text>
  <text x="608" y="256" font-size="12" fill="#c0392b" text-anchor="middle">Комутація до 2 А</text>

  <!-- Електролітичний буферний конденсатор -->
  <rect x="536" y="280" width="144" height="46" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
  <text x="608" y="298" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">C_bulk 470 мкФ</text>
  <text x="608" y="316" font-size="12" fill="#6b7280" text-anchor="middle">Буфер кидків струму</text>

  <!-- Лінії підключення мотора -->
  <line x1="680" y1="184" x2="740" y2="184" stroke="#c0392b" stroke-width="2"/>
  <line x1="680" y1="232" x2="740" y2="232" stroke="#c0392b" stroke-width="2"/>
  <text x="710" y="212" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">M± 6В</text>

  <!-- Вузол мотор-редуктора -->
  <rect x="740" y="150" width="160" height="116" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="820" y="174" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мотор-редуктор 6 В</text>
  <text x="820" y="194" font-size="12" fill="#6b7280" text-anchor="middle">Колекторний двигун</text>
  <text x="820" y="218" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">3×100 нФ фільтр</text>
  <text x="820" y="238" font-size="12" fill="#6b7280" text-anchor="middle">Придушення іскор</text>
  <text x="820" y="256" font-size="12" fill="#6b7280" text-anchor="middle">на клемах і корпусі</text>

  <!-- Інформаційна панель силової зони -->
  <rect x="700" y="280" width="200" height="46" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
  <text x="800" y="298" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">⚠ ШУМНИЙ СТРУМ ДО 2 А</text>
  <text x="800" y="316" font-size="12" fill="#1a1a1a" text-anchor="middle">Замкнений у Power GND</text>

  <!-- Плашка точки Star GND -->
  <rect x="390" y="350" width="180" height="22" rx="4" fill="#27ae60"/>
  <text x="480" y="366" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">★ ТОЧКА STAR GND</text>

  <!-- Лінії розподілу землі від точки Star GND -->
  <line x1="390" y1="361" x2="240" y2="361" stroke="#2457d6" stroke-width="3"/>
  <line x1="240" y1="361" x2="240" y2="338" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>

  <line x1="570" y1="361" x2="720" y2="361" stroke="#c0392b" stroke-width="4"/>
  <line x1="720" y1="338" x2="720" y2="361" stroke="#c0392b" stroke-width="4" marker-end="url(#arr-red)"/>

  <!-- Пояснювальні підписи лівої гілки GND -->
  <text x="200" y="388" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Опорне з'єднання Logic GND</text>
  <text x="200" y="406" font-size="12" fill="#6b7280" text-anchor="middle">Струм споживання MCU: ~30 мА</text>
  <text x="200" y="424" font-size="12" fill="#27ae60" text-anchor="middle">✓ Потенціал чистий і стабільний</text>

  <!-- Пояснювальні підписи правої гілки GND -->
  <text x="760" y="388" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Силове з'єднання Power GND</text>
  <text x="760" y="406" font-size="12" fill="#6b7280" text-anchor="middle">Імпульсний струм мотора: до 2 А</text>
  <text x="760" y="424" font-size="12" fill="#c0392b" text-anchor="middle">⚠ Струм повертається напряму в роз'єм</text>

  <!-- Блок клемника живлення -->
  <rect x="360" y="388" width="240" height="42" rx="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="480" y="404" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">КЛЕМНИК ЖИВЛЕННЯ 6 В</text>

  <!-- Клеми живлення -->
  <rect x="380" y="408" width="70" height="18" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="415" y="422" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+6В VCC</text>

  <rect x="510" y="408" width="70" height="18" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="545" y="422" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">GND 0В</text>

  <!-- З'єднання клеми GND з точкою Star GND -->
  <line x1="545" y1="408" x2="545" y2="372" stroke="#27ae60" stroke-width="3"/>
</svg>
