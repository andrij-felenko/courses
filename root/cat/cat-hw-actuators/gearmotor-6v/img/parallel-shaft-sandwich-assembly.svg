<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#475569"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Конструкція редуктора з паралельними валами типу «сендвіч»</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Багатоступеневий каскад шестерень, бронзові втулки та навантаження на вал</text>

  <!-- Вхід від двигуна -->
  <text x="115" y="74" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вхід (двигун)</text>

  <!-- Підпис верхньої пластини -->
  <text x="290" y="94" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Опорні пластини корпусу «сендвіч» та осі передачі</text>

  <!-- Верхня і нижня пластини сендвіча -->
  <path d="M 46,112 L 474,112 L 474,126 L 46,126 Z" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <path d="M 46,238 L 474,238 L 474,252 L 46,252 Z" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>

  <!-- Дистанційні стяжні стійки -->
  <path d="M 56,126 L 72,126 L 72,238 L 56,238 Z" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
  <path d="M 448,126 L 464,126 L 464,238 L 448,238 Z" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>

  <!-- Гвинти стяжки стійок -->
  <line x1="64" y1="104" x2="64" y2="112" stroke="#475569" stroke-width="3"/>
  <line x1="64" y1="252" x2="64" y2="260" stroke="#475569" stroke-width="3"/>
  <line x1="456" y1="104" x2="456" y2="112" stroke="#475569" stroke-width="3"/>
  <line x1="456" y1="252" x2="456" y2="260" stroke="#475569" stroke-width="3"/>

  <!-- Осьові лінії -->
  <line x1="115" y1="96" x2="115" y2="258" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="195" y1="96" x2="195" y2="258" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="275" y1="96" x2="275" y2="258" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="375" y1="96" x2="375" y2="390" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Сталеві вали та осі -->
  <!-- Вхідний вал (від електродвигуна) -->
  <path d="M 111,88 L 119,88 L 119,240 L 111,240 Z" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <!-- 1-ша проміжна вісь -->
  <path d="M 192,110 L 198,110 L 198,254 L 192,254 Z" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <!-- 2-га проміжна вісь -->
  <path d="M 272,110 L 278,110 L 278,254 L 272,254 Z" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <!-- Потовщений вихідний сталевий вал -->
  <path d="M 367,110 L 383,110 L 383,390 L 367,390 Z" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <!-- Лиска D-cut на вильоті вала -->
  <path d="M 377,310 L 383,310 L 383,390 L 377,390 Z" fill="#ffffff" stroke="#475569" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="367" y1="390" x2="383" y2="390" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Запресовані бронзові втулки ковзання -->
  <!-- Верхні втулки -->
  <path d="M 107,108 L 123,108 L 123,130 L 107,130 Z" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/>
  <line x1="105" y1="108" x2="125" y2="108" stroke="#92400e" stroke-width="2.5"/>

  <path d="M 188,108 L 202,108 L 202,130 L 188,130 Z" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/>
  <line x1="186" y1="108" x2="204" y2="108" stroke="#92400e" stroke-width="2.5"/>

  <path d="M 268,108 L 282,108 L 282,130 L 268,130 Z" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/>
  <line x1="266" y1="108" x2="284" y2="108" stroke="#92400e" stroke-width="2.5"/>

  <path d="M 365,108 L 385,108 L 385,130 L 365,130 Z" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/>
  <line x1="363" y1="108" x2="387" y2="108" stroke="#92400e" stroke-width="2.5"/>

  <!-- Нижні втулки -->
  <path d="M 107,234 L 123,234 L 123,256 L 107,256 Z" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/>
  <path d="M 188,234 L 202,234 L 202,256 L 188,256 Z" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/>
  <path d="M 268,234 L 282,234 L 282,256 L 268,256 Z" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/>

  <!-- Подовжена посилена нижня втулка вихідного вала -->
  <path d="M 363,234 L 387,234 L 387,276 L 363,276 Z" fill="#f59e0b" stroke="#92400e" stroke-width="1.5"/>
  <line x1="359" y1="252" x2="391" y2="252" stroke="#92400e" stroke-width="3"/>

  <!-- Каскад блок-шестерень -->
  <!-- Ярус 1 (верхній): Вхідний піньйон Z1 та колесо Z2 -->
  <path d="M 101,136 L 129,136 L 129,154 L 101,154 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <line x1="108" y1="136" x2="108" y2="154" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="116" y1="136" x2="116" y2="154" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="124" y1="136" x2="124" y2="154" stroke="#93c5fd" stroke-width="1.5"/>

  <path d="M 129,136 L 261,136 L 261,154 L 129,154 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <line x1="145" y1="136" x2="145" y2="154" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="165" y1="136" x2="165" y2="154" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="225" y1="136" x2="225" y2="154" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="245" y1="136" x2="245" y2="154" stroke="#93c5fd" stroke-width="1.5"/>

  <!-- Тіло 1-ї блок-шестерні -->
  <path d="M 187,154 L 203,154 L 203,170 L 187,170 Z" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5"/>

  <!-- Ярус 2 (середній): Піньйон Z3 та колесо Z4 -->
  <path d="M 181,170 L 209,170 L 209,188 L 181,188 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <line x1="188" y1="170" x2="188" y2="188" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="196" y1="170" x2="196" y2="188" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="204" y1="170" x2="204" y2="188" stroke="#93c5fd" stroke-width="1.5"/>

  <path d="M 209,170 L 341,170 L 341,188 L 209,188 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <line x1="225" y1="170" x2="225" y2="188" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="245" y1="170" x2="245" y2="188" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="305" y1="170" x2="305" y2="188" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="325" y1="170" x2="325" y2="188" stroke="#93c5fd" stroke-width="1.5"/>

  <!-- Тіло 2-ї блок-шестерні -->
  <path d="M 267,188 L 283,188 L 283,204 L 267,204 Z" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5"/>

  <!-- Ярус 3 (нижній): Піньйон Z5 та вихідне колесо Z6 -->
  <path d="M 261,204 L 289,204 L 289,222 L 261,222 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <line x1="268" y1="204" x2="268" y2="222" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="276" y1="204" x2="276" y2="222" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="284" y1="204" x2="284" y2="222" stroke="#93c5fd" stroke-width="1.5"/>

  <path d="M 289,204 L 443,204 L 443,222 L 289,222 Z" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
  <line x1="310" y1="204" x2="310" y2="222" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="335" y1="204" x2="335" y2="222" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="415" y1="204" x2="415" y2="222" stroke="#93c5fd" stroke-width="1.5"/>
  <line x1="435" y1="204" x2="435" y2="222" stroke="#93c5fd" stroke-width="1.5"/>

  <!-- Маточина вихідного колеса -->
  <path d="M 363,196 L 387,196 L 387,230 L 363,230 Z" fill="#bfdbfe" stroke="#1d4ed8" stroke-width="1.5"/>

  <!-- Панель опису навантажень на вихідний вал (знизу зліва) -->
  <rect x="46" y="270" width="210" height="156" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="60" y="294" font-size="13" font-weight="bold" fill="#c0392b">Навантаження на вал</text>
  <text x="60" y="316" font-size="12" fill="#1a1a1a">• Радіальна сила F_rad створює</text>
  <text x="60" y="332" font-size="12" fill="#1a1a1a">  згинальний момент M = F_rad × L</text>
  <text x="60" y="352" font-size="12" fill="#1a1a1a">• Викликає перекіс осі вала</text>
  <text x="60" y="368" font-size="12" fill="#1a1a1a">  та знос втулки ковзання</text>
  <text x="60" y="390" font-size="12" fill="#1a1a1a">• Осьова сила F_ax передається</text>
  <text x="60" y="406" font-size="12" fill="#1a1a1a">  через буртик у пластину</text>

  <!-- Стрілка радіального навантаження F_rad -->
  <line x1="274" y1="350" x2="363" y2="350" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-red)"/>
  <text x="318" y="336" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">F_rad</text>

  <!-- Стрілка осьового навантаження F_ax -->
  <line x1="375" y1="430" x2="375" y2="398" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>
  <text x="392" y="416" font-size="13" font-weight="bold" fill="#2457d6">F_ax</text>
  <text x="392" y="432" font-size="12" fill="#6b7280">осьовий упор</text>

  <!-- Панель детального перерізу D-вала -->
  <rect x="486" y="206" width="130" height="220" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="551" y="228" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Переріз D-вала</text>
  <text x="551" y="246" font-size="12" fill="#6b7280" text-anchor="middle">профіль лиски</text>

  <!-- D-подібний переріз -->
  <path d="M 565,284 A 28 28 0 1 0 565,332 Z" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <line x1="565" y1="284" x2="565" y2="332" stroke="#2457d6" stroke-width="2.5"/>
  <!-- Точки концентраторів напружень -->
  <circle cx="565" cy="284" r="3.5" fill="#c0392b"/>
  <circle cx="565" cy="332" r="3.5" fill="#c0392b"/>

  <text x="551" y="374" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Концентратори</text>
  <text x="551" y="390" font-size="12" fill="#c0392b" text-anchor="middle">напружень</text>
  <text x="551" y="408" font-size="12" fill="#6b7280" text-anchor="middle">у кутах зрізу</text>

  <!-- Інформаційні панелі праворуч -->
  <!-- Панель 1: Корпус сендвіч -->
  <rect x="635" y="78" width="300" height="104" rx="6" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="652" y="100" font-size="13" font-weight="bold" fill="#2457d6">Корпус типу «сендвіч»</text>
  <text x="652" y="122" font-size="12" fill="#1a1a1a">• Дві паралельні сталеві пластини</text>
  <text x="652" y="142" font-size="12" fill="#1a1a1a">• Жорстко фіксують міжосьові бази</text>
  <text x="652" y="162" font-size="12" fill="#1a1a1a">• Запобігають перекосу зубчастих пар</text>

  <!-- Панель 2: Опори ковзання -->
  <rect x="635" y="196" width="300" height="104" rx="6" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="652" y="218" font-size="13" font-weight="bold" fill="#d97706">Опори ковзання (втулки)</text>
  <text x="652" y="240" font-size="12" fill="#1a1a1a">• Запресовані пористі бронзові втулки</text>
  <text x="652" y="260" font-size="12" fill="#1a1a1a">• Потребують регулярного змащення</text>
  <text x="652" y="280" font-size="12" fill="#1a1a1a">• F_rad спричиняє овальність і люфт</text>

  <!-- Панель 3: Вихідний D-вал -->
  <rect x="635" y="314" width="300" height="112" rx="6" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="652" y="336" font-size="13" font-weight="bold" fill="#c0392b">Вихідний вал із D-зрізом</text>
  <text x="652" y="358" font-size="12" fill="#1a1a1a">• Лиска фіксує маточину від провороту</text>
  <text x="652" y="378" font-size="12" fill="#1a1a1a">• Потовщений вал тримає крутний момент</text>
  <text x="652" y="398" font-size="12" fill="#1a1a1a">• Кути лиски утворюють концентратори</text>
</svg>
