<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Пригнічення електромагнітних завад (EMI) колекторного мотора</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Три керамічні конденсатори по 0.1 мкФ шунтують диференційні сплески та синфазні завади на корпус</text>

  <!-- Блок драйвера мотора -->
  <rect x="30" y="90" width="170" height="300" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="115" y="120" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Драйвер мотора</text>
  <text x="115" y="138" font-size="12" fill="#6b7280" text-anchor="middle">H-міст / ШІМ 6 В</text>

  <text x="185" y="148" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">OUT1 (+)</text>
  <circle cx="200" cy="160" r="4" fill="#2457d6"/>

  <text x="115" y="225" font-size="12" fill="#1a1a1a" text-anchor="middle">Реверс полярності</text>
  <text x="115" y="245" font-size="12" fill="#6b7280" text-anchor="middle">для зміни напрямку</text>
  <text x="115" y="275" font-size="12" fill="#6b7280" text-anchor="middle">Діапазон: 3–9 В</text>

  <text x="185" y="364" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">OUT2 (-)</text>
  <circle cx="200" cy="340" r="4" fill="#2457d6"/>

  <!-- Заголовки фільтрації у середній зоні -->
  <text x="330" y="125" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Диференційний захист</text>
  <text x="550" y="125" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Синфазний захист</text>

  <!-- Силові лінії живлення -->
  <line x1="200" y1="160" x2="670" y2="160" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="200" y1="340" x2="670" y2="340" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Конденсатор C1 (диференційний) -->
  <line x1="330" y1="160" x2="330" y2="244" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="318" y1="244" x2="342" y2="244" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="318" y1="256" x2="342" y2="256" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="330" y1="256" x2="330" y2="340" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="330" cy="160" r="3.5" fill="#1a1a1a"/>
  <circle cx="330" cy="340" r="3.5" fill="#1a1a1a"/>
  <text x="306" y="242" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="end">C1</text>
  <text x="306" y="264" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">0.1 мкФ</text>

  <!-- Конденсатор C2 (синфазний, клема + на корпус) -->
  <line x1="510" y1="160" x2="510" y2="199" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="498" y1="199" x2="522" y2="199" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="498" y1="211" x2="522" y2="211" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="510" y1="211" x2="510" y2="250" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="510" cy="160" r="3.5" fill="#1a1a1a"/>
  <text x="486" y="197" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="end">C2</text>
  <text x="486" y="217" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">0.1 мкФ</text>

  <!-- Конденсатор C3 (синфазний, клема - на корпус) -->
  <line x1="510" y1="250" x2="510" y2="289" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="498" y1="289" x2="522" y2="289" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="498" y1="301" x2="522" y2="301" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="510" y1="301" x2="510" y2="340" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="510" cy="340" r="3.5" fill="#1a1a1a"/>
  <text x="486" y="287" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="end">C3</text>
  <text x="486" y="307" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">0.1 мкФ</text>

  <!-- Лінія з'єднання на корпус мотора -->
  <circle cx="510" cy="250" r="3.5" fill="#1a1a1a"/>
  <line x1="510" y1="250" x2="670" y2="250" stroke="#1a1a1a" stroke-width="2"/>
  <text x="538" y="236" font-size="12" font-weight="bold" fill="#2457d6">Спільний корпус</text>
  <text x="538" y="274" font-size="12" fill="#6b7280">GND шасі / екран</text>

  <!-- Заземлення корпусу мотора -->
  <circle cx="670" cy="250" r="4" fill="#1a1a1a"/>
  <line x1="670" y1="250" x2="670" y2="280" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="660" y1="280" x2="680" y2="280" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="664" y1="285" x2="676" y2="285" stroke="#1a1a1a" stroke-width="1.8"/>
  <line x1="667" y1="290" x2="673" y2="290" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Блок мотора -->
  <rect x="670" y="90" width="260" height="300" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="800" y="120" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Колекторний мотор 6 В</text>
  <text x="800" y="138" font-size="12" fill="#6b7280" text-anchor="middle">Металевий корпус (екран завад)</text>

  <!-- Клеми живлення всередині мотора -->
  <line x1="670" y1="160" x2="780" y2="160" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="780" y1="160" x2="780" y2="200" stroke="#1a1a1a" stroke-width="2"/>
  <text x="685" y="148" font-size="12" font-weight="bold" fill="#1a1a1a">Клема (+)</text>

  <line x1="670" y1="340" x2="780" y2="340" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="780" y1="340" x2="780" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <text x="685" y="364" font-size="12" font-weight="bold" fill="#1a1a1a">Клема (-)</text>

  <!-- Ротор і щітки -->
  <circle cx="780" cy="250" r="40" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="780" y="258" font-size="24" font-weight="bold" fill="#2457d6" text-anchor="middle">M</text>

  <rect x="770" y="200" width="20" height="10" fill="#1a1a1a"/>
  <text x="838" y="195" font-size="12" fill="#6b7280">Щітка (+)</text>

  <rect x="770" y="290" width="20" height="10" fill="#1a1a1a"/>
  <text x="838" y="305" font-size="12" fill="#6b7280">Щітка (-)</text>

  <!-- Джерело завад (іскріння) -->
  <path d="M823,248 L828,252 L824,254 L829,258" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <text x="838" y="244" font-size="12" font-weight="bold" fill="#c0392b">Іскріння</text>
  <text x="838" y="260" font-size="12" fill="#c0392b">і ВЧ завади</text>

  <text x="800" y="375" font-size="12" fill="#6b7280" text-anchor="middle">Екранує випромінювання ротора</text>

  <!-- Інформаційні картки внизу -->
  <rect x="30" y="410" width="285" height="80" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="432" font-size="13" font-weight="bold" fill="#2457d6">C1: диференційний захист</text>
  <text x="45" y="452" font-size="12" fill="#1a1a1a">Шунтує ВЧ сплески між клемами + та -</text>
  <text x="45" y="472" font-size="12" fill="#6b7280">Гасить іскріння при розмиканні щіток</text>

  <rect x="335" y="410" width="285" height="80" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="350" y="432" font-size="13" font-weight="bold" fill="#2457d6">C2, C3: синфазний захист</text>
  <text x="350" y="452" font-size="12" fill="#1a1a1a">Відводять ВЧ шум на металевий корпус</text>
  <text x="350" y="472" font-size="12" fill="#6b7280">Запобігають випромінюванню дротами</text>

  <rect x="640" y="410" width="285" height="80" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="655" y="432" font-size="13" font-weight="bold" fill="#27ae60">Рекомендації монтажу</text>
  <text x="655" y="452" font-size="12" fill="#1a1a1a">Керамічні конденсатори 3 × 0.1 мкФ</text>
  <text x="655" y="472" font-size="12" fill="#6b7280">Паяти впритул до клем і корпусу мотора</text>
</svg>
