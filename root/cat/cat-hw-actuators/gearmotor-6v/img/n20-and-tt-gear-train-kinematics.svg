<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="960" height="520" fill="white"/>

<!-- Маркери стрілок -->
<defs>
  <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
  </marker>
  <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
  </marker>
  <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
  </marker>
</defs>

<!-- Заголовок і підзаголовок -->
<text x="480" y="27" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кінематика редукторів N20 та TT: каскади передач і формування швидкостей</text>
<text x="480" y="49" font-size="13" fill="#6b7280" text-anchor="middle">Послідовне зачеплення циліндричних пар для отримання 100 та 600 об/хв із високообертового мікромотора</text>

<!-- ЛІВА ПАНЕЛЬ: N20 -->
<rect x="30" y="68" width="440" height="346" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
<text x="46" y="89" font-size="14" font-weight="bold" fill="#1a1a1a">Зубчастий каскад N20 (Metal Micro Gearbox)</text>
<text x="46" y="107" font-size="12" fill="#6b7280">Мікромотор ⌀12 мм · модуль m = 0.2–0.3 мм · латунь і сталь</text>

<!-- N20 Схема -->
<rect x="42" y="116" width="416" height="114" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

<!-- Мотор N20 -->
<rect x="50" y="146" width="44" height="64" rx="4" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="72" y="164" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">N20</text>
<text x="72" y="181" font-size="12" fill="#2457d6" text-anchor="middle">15 000</text>
<text x="72" y="197" font-size="12" fill="#6b7280" text-anchor="middle">об/хв</text>

<!-- Вал мотора і шестірня z1 -->
<line x1="94" y1="188" x2="112" y2="188" stroke="#1a1a1a" stroke-width="2"/>
<rect x="112" y="178" width="12" height="20" rx="1" fill="#2457d6"/>

<!-- Ступінь 1: колесо z2 (верхнє) і вісь -->
<rect x="112" y="138" width="12" height="40" rx="1" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="118" y="132" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">i₁ ≈ 3.1</text>
<rect x="124" y="145" width="30" height="6" fill="#6b7280"/>
<rect x="154" y="138" width="12" height="20" rx="1" fill="#2457d6"/>

<!-- Ступінь 2: колесо z4 (нижнє) -->
<rect x="154" y="158" width="12" height="40" rx="1" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="160" y="214" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">i₂ ≈ 3.2</text>
<rect x="166" y="185" width="30" height="6" fill="#6b7280"/>
<rect x="196" y="178" width="12" height="20" rx="1" fill="#2457d6"/>

<!-- Ступінь 3: колесо z6 (верхнє) -->
<rect x="196" y="138" width="12" height="40" rx="1" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="202" y="132" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">i₃ ≈ 3.2</text>

<!-- Розгалуження конфігурацій N20 -->
<path d="M 216,152 L 236,146" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
<text x="242" y="144" font-size="12" font-weight="bold" fill="#2457d6">3 ст. (i ≈ 1:30)</text>
<text x="242" y="159" font-size="12" fill="#1a1a1a">→ 600 об/хв</text>

<path d="M 216,188 L 236,194" fill="none" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
<text x="242" y="194" font-size="12" font-weight="bold" fill="#27ae60">+2 ст. (i ≈ 1:150)</text>
<text x="242" y="209" font-size="12" fill="#1a1a1a">→ 100 об/хв</text>

<!-- З'єднання з вихідним валом N20 -->
<line x1="344" y1="174" x2="366" y2="174" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-main)"/>

<!-- Вихідний D-вал N20 -->
<rect x="372" y="162" width="70" height="24" rx="3" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="428" y1="162" x2="428" y2="186" stroke="#c0392b" stroke-width="2.5"/>
<text x="407" y="152" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вал зі зрізом</text>
<text x="407" y="204" font-size="12" fill="#6b7280" text-anchor="middle">D-вал ⌀3 мм</text>

<!-- Дві картки швидкостей N20 -->
<rect x="42" y="242" width="202" height="78" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<rect x="42" y="242" width="202" height="22" rx="6" fill="#eaf0fd"/>
<text x="143" y="257" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Конфігурація 600 об/хв</text>
<text x="50" y="278" font-size="12" fill="#1a1a1a">• 3 ступені (i ≈ 1:30)</text>
<text x="50" y="294" font-size="12" fill="#1a1a1a">• n_вих = 500–600 об/хв</text>
<text x="50" y="310" font-size="12" fill="#1a1a1a">• Момент: ~0.2 кг·см</text>

<rect x="256" y="242" width="202" height="78" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<rect x="256" y="242" width="202" height="22" rx="6" fill="#e9f7ef"/>
<text x="357" y="257" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Конфігурація 100 об/хв</text>
<text x="264" y="278" font-size="12" fill="#1a1a1a">• 5 ступенів (i ≈ 1:150)</text>
<text x="264" y="294" font-size="12" fill="#1a1a1a">• n_вих = 80–100 об/хв</text>
<text x="264" y="310" font-size="12" fill="#1a1a1a">• Момент: ~1.5 кг·см</text>

<!-- Нижня плашка N20 -->
<rect x="42" y="332" width="416" height="70" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="52" y="348" font-size="12" font-weight="bold" fill="#1a1a1a">Матеріали та механічні властивості N20:</text>
<text x="52" y="365" font-size="12" fill="#1a1a1a">• Шестерні: латунь і загартована сталь (m = 0.2–0.3 мм)</text>
<text x="52" y="381" font-size="12" fill="#27ae60">• Переваги: висока контактна міцність, мінімальний люфт</text>
<text x="52" y="396" font-size="12" fill="#c0392b">• Обмеження: тонкі осі (⌀1 мм) вразливі до ударів по валу</text>

<!-- ПРАВА ПАНЕЛЬ: TT -->
<rect x="490" y="68" width="440" height="346" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
<text x="506" y="89" font-size="14" font-weight="bold" fill="#1a1a1a">Зубчастий каскад TT (Plastic Gearbox)</text>
<text x="506" y="107" font-size="12" fill="#6b7280">Мотор типорозміру 130 · модуль m ≈ 0.5 мм · пластик POM</text>

<!-- TT Схема -->
<rect x="502" y="116" width="416" height="114" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

<!-- Мотор 130 -->
<rect x="510" y="146" width="44" height="64" rx="4" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="532" y="164" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">DC 130</text>
<text x="532" y="181" font-size="12" fill="#2457d6" text-anchor="middle">10 000</text>
<text x="532" y="197" font-size="12" fill="#6b7280" text-anchor="middle">об/хв</text>

<!-- Вал мотора і шестірня z1 -->
<line x1="554" y1="188" x2="572" y2="188" stroke="#1a1a1a" stroke-width="2"/>
<rect x="572" y="178" width="12" height="20" rx="1" fill="#2457d6"/>

<!-- Ступінь 1 (вісь B): POM z2 + z3 -->
<rect x="572" y="138" width="12" height="40" rx="1" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="578" y="132" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">i₁ = 4.0</text>
<rect x="584" y="145" width="30" height="6" fill="#6b7280"/>
<rect x="614" y="138" width="12" height="20" rx="1" fill="#2457d6"/>

<!-- Ступінь 2 (вісь A): POM z4 + z5 -->
<rect x="614" y="158" width="12" height="40" rx="1" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="620" y="214" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">i₂ = 4.0</text>
<rect x="626" y="185" width="30" height="6" fill="#6b7280"/>
<rect x="656" y="178" width="12" height="20" rx="1" fill="#2457d6"/>

<!-- Ступінь 3: POM z6 -->
<rect x="656" y="138" width="12" height="40" rx="1" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="662" y="132" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">i₃ = 3.0</text>

<!-- Розгалуження конфігурацій TT -->
<path d="M 676,152 L 696,146" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
<text x="702" y="144" font-size="12" font-weight="bold" fill="#2457d6">1:48 (3 ст.)</text>
<text x="702" y="159" font-size="12" fill="#1a1a1a">→ ~180 об/хв</text>

<path d="M 676,188 L 696,194" fill="none" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
<text x="702" y="194" font-size="12" font-weight="bold" fill="#27ae60">1:120 (+1 ст.)</text>
<text x="702" y="209" font-size="12" fill="#1a1a1a">→ ~80 об/хв</text>

<!-- З'єднання з вихідним валом TT -->
<line x1="800" y1="174" x2="816" y2="174" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-main)"/>

<!-- Двосторонній вал TT -->
<rect x="822" y="162" width="82" height="24" rx="3" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="832" y1="162" x2="832" y2="186" stroke="#c0392b" stroke-width="2.5"/>
<line x1="894" y1="162" x2="894" y2="186" stroke="#c0392b" stroke-width="2.5"/>
<text x="863" y="152" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2-бічний вал</text>
<text x="863" y="204" font-size="12" fill="#6b7280" text-anchor="middle">POM ⌀5.4 мм</text>

<!-- Дві картки конфігурацій TT -->
<rect x="502" y="242" width="202" height="78" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<rect x="502" y="242" width="202" height="22" rx="6" fill="#eaf0fd"/>
<text x="603" y="257" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Конфігурація 1:48 (стандарт)</text>
<text x="510" y="278" font-size="12" fill="#1a1a1a">• 3 ступені передач (POM)</text>
<text x="510" y="294" font-size="12" fill="#1a1a1a">• n_вих ≈ 150–200 об/хв</text>
<text x="510" y="310" font-size="12" fill="#1a1a1a">• Стандарт для хобі-шасі</text>

<rect x="716" y="242" width="202" height="78" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<rect x="716" y="242" width="202" height="22" rx="6" fill="#e9f7ef"/>
<text x="817" y="257" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Конфігурація 1:120 (тягова)</text>
<text x="724" y="278" font-size="12" fill="#1a1a1a">• Каскад: 4 ступені передачі</text>
<text x="724" y="294" font-size="12" fill="#1a1a1a">• n_вих ≈ 70–90 об/хв</text>
<text x="724" y="310" font-size="12" fill="#1a1a1a">• Тяговий повільний рух</text>

<!-- Нижня плашка TT -->
<rect x="502" y="332" width="416" height="70" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="512" y="348" font-size="12" font-weight="bold" fill="#1a1a1a">Матеріали та особливості редуктора TT:</text>
<text x="512" y="365" font-size="12" fill="#1a1a1a">• Шестерні: литий поліацеталь POM (модуль m ≈ 0.5 мм)</text>
<text x="512" y="381" font-size="12" fill="#27ae60">• Переваги: самозмащувальний полімер, дуже тихий хід</text>
<text x="512" y="396" font-size="12" fill="#c0392b">• Ризик: зрізання зубців при різкому блокуванні вала</text>

<!-- НИЖНЯ ПАНЕЛЬ: Формули та розмін -->
<rect x="30" y="426" width="900" height="74" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
<text x="45" y="444" font-size="13" font-weight="bold" fill="#2457d6">Кінематичні залежності та закон розміну (швидкість ↔ момент):</text>

<!-- Ліва колонка формул -->
<text x="45" y="464" font-size="12" fill="#1a1a1a">• Передавальне число: i = i₁ · i₂ ... = (z₂/z₁) · (z₄/z₃)...</text>
<text x="45" y="484" font-size="12" fill="#1a1a1a">• Кутова швидкість: ω_вих = ω_вх / i   (n_вих = n_вх / i)</text>

<!-- Права колонка формул -->
<text x="495" y="464" font-size="12" fill="#1a1a1a">• Крутний момент: τ_вих = τ_вх · i · η   (де η — ККД каскаду)</text>
<text x="495" y="484" font-size="12" fill="#1a1a1a">• Розмін: падіння обертів дає ріст моменту (η_ступ ≈ 85–90%)</text>

</svg>
