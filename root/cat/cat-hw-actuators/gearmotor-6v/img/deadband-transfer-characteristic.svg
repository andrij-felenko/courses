<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <defs>
    <!-- Маркери стрілок для осей та вказівників -->
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Статична характеристика компенсації мертвої зони мотор-редуктора</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Відсікання шуму навколо нуля, подолання сухого тертя (PWM_min) та лінійне регулювання</text>

  <!-- ЛІВА ПАНЕЛЬ: Графік характеристики -->
  <rect x="24" y="78" width="560" height="442" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Заголовок панелі графіка -->
  <text x="44" y="104" font-size="14" font-weight="bold" fill="#1a1a1a">Залежність вихідного ШІМ від команди швидкості</text>
  <text x="44" y="122" font-size="12" fill="#6b7280">Нормалізована команда |u| (0...100%) → Вихідний ШІМ моста (0...100%)</text>

  <!-- Області на графіку (затінення) -->
  <!-- 1. Зона відсікання шуму навколо 0 (0% .. 8%) -->
  <rect x="100" y="160" width="36" height="240" fill="#e5e7eb" fill-opacity="0.6"/>

  <!-- 2. Зона заклинювання сухим тертям редуктора (ШІМ &lt; 25%) -->
  <rect x="100" y="340" width="420" height="60" fill="#fdecea" fill-opacity="0.6"/>

  <!-- 3. Зона лінійного корисного регулювання (ШІМ &gt;= 25%, |u| &gt;= 8%) -->
  <polygon points="136,340 520,160 520,340" fill="#eaf0fd" fill-opacity="0.4"/>

  <!-- Горизонтальний поріг PWM_min (25%) -->
  <line x1="95" y1="340" x2="520" y2="340" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Тонка позначка порогу 100% -->
  <line x1="95" y1="160" x2="520" y2="160" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Вертикальна лінія порогу відсікання шуму u_пор (8%) -->
  <line x1="136" y1="160" x2="136" y2="400" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Крива 1: Наївне пряме керування (без компенсації, червоний пунктир) -->
  <line x1="100" y1="400" x2="520" y2="160" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4"/>

  <!-- Крива 2: Компенсована характеристика (синя лінія) -->
  <!-- Відсікання шуму на осі: від 0% до 8% ШІМ = 0% -->
  <line x1="100" y1="400" x2="132" y2="400" stroke="#2457d6" stroke-width="3.5"/>
  <circle cx="136" cy="400" r="3.5" fill="white" stroke="#2457d6" stroke-width="2"/>

  <!-- Стрибок зміщення (PWM_min) -->
  <line x1="136" y1="394" x2="136" y2="347" stroke="#2457d6" stroke-width="2" stroke-dasharray="3 3"/>
  <circle cx="136" cy="340" r="4" fill="#2457d6"/>

  <!-- Лінійна гілка: від (8%, 25%) до (100%, 100%) -->
  <line x1="136" y1="340" x2="520" y2="160" stroke="#2457d6" stroke-width="3.5"/>
  <circle cx="520" cy="160" r="4" fill="#2457d6"/>

  <!-- Осі координат -->
  <!-- Вісь Y: ШІМ -->
  <line x1="95" y1="405" x2="95" y2="148" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="95" y="140" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ШІМ (%)</text>

  <!-- Засічки та підписи на осі Y -->
  <line x1="90" y1="160" x2="95" y2="160" stroke="#1a1a1a" stroke-width="1"/>
  <text x="84" y="164" font-size="12" fill="#6b7280" text-anchor="end">100%</text>

  <line x1="90" y1="220" x2="95" y2="220" stroke="#1a1a1a" stroke-width="1"/>
  <text x="84" y="224" font-size="12" fill="#6b7280" text-anchor="end">75%</text>

  <line x1="90" y1="280" x2="95" y2="280" stroke="#1a1a1a" stroke-width="1"/>
  <text x="84" y="284" font-size="12" fill="#6b7280" text-anchor="end">50%</text>

  <line x1="90" y1="340" x2="95" y2="340" stroke="#2457d6" stroke-width="1.5"/>
  <text x="84" y="334" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">PWM_min</text>
  <text x="84" y="348" font-size="12" fill="#2457d6" text-anchor="end">25%</text>

  <line x1="90" y1="400" x2="95" y2="400" stroke="#1a1a1a" stroke-width="1"/>
  <text x="84" y="404" font-size="12" fill="#6b7280" text-anchor="end">0%</text>

  <!-- Вісь X: Команда |u| -->
  <line x1="95" y1="400" x2="538" y2="400" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- Засічки та підписи на осі X -->
  <line x1="100" y1="400" x2="100" y2="405" stroke="#1a1a1a" stroke-width="1"/>
  <text x="100" y="420" font-size="12" fill="#6b7280" text-anchor="middle">0%</text>

  <line x1="136" y1="400" x2="136" y2="405" stroke="#2457d6" stroke-width="1.5"/>
  <text x="136" y="420" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">8%</text>

  <line x1="205" y1="400" x2="205" y2="405" stroke="#1a1a1a" stroke-width="1"/>
  <text x="205" y="420" font-size="12" fill="#6b7280" text-anchor="middle">25%</text>

  <line x1="310" y1="400" x2="310" y2="405" stroke="#1a1a1a" stroke-width="1"/>
  <text x="310" y="420" font-size="12" fill="#6b7280" text-anchor="middle">50%</text>

  <line x1="415" y1="400" x2="415" y2="405" stroke="#1a1a1a" stroke-width="1"/>
  <text x="415" y="420" font-size="12" fill="#6b7280" text-anchor="middle">75%</text>

  <line x1="520" y1="400" x2="520" y2="405" stroke="#1a1a1a" stroke-width="1"/>
  <text x="520" y="420" font-size="12" fill="#6b7280" text-anchor="middle">100%</text>

  <!-- Підпис осі X -->
  <text x="310" y="438" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вхідна нормалізована команда швидкості |u| (%)</text>

  <!-- Інформаційні плашки на самому графіку (у вільних зонах) -->
  <!-- Плашка робочої лінійної зони (угорі зліва, де нема ліній) -->
  <rect x="150" y="172" width="136" height="56" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="158" y="190" font-size="12" font-weight="bold" fill="#2457d6">Робоча зона</text>
  <text x="158" y="206" font-size="12" fill="#1a1a1a">ШІМ: 25%...100%</text>
  <text x="158" y="221" font-size="12" fill="#27ae60">Вал плавно крутиться</text>

  <!-- Плашка зони сухого тертя (внизу праворуч, під лініями) -->
  <rect x="245" y="356" width="245" height="36" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="253" y="371" font-size="12" font-weight="bold" fill="#c0392b">Зона заклинювання редуктора</text>
  <text x="253" y="386" font-size="12" fill="#6b7280">Вал нерухомий: струм без руху</text>

  <!-- Легенда під графіком -->
  <rect x="44" y="454" width="246" height="48" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <line x1="54" y1="470" x2="74" y2="470" stroke="#2457d6" stroke-width="3"/>
  <text x="82" y="473" font-size="12" font-weight="bold" fill="#2457d6">Компенсований ШІМ</text>
  <text x="82" y="491" font-size="12" fill="#1a1a1a">Миттєвий пуск при |u| &gt; 8%</text>

  <rect x="304" y="454" width="260" height="48" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <line x1="314" y1="470" x2="334" y2="470" stroke="#c0392b" stroke-width="2" stroke-dasharray="5 3"/>
  <text x="342" y="473" font-size="12" font-weight="bold" fill="#c0392b">Наївне пряме керування</text>
  <text x="342" y="491" font-size="12" fill="#1a1a1a">Вал не рухається при ШІМ &lt; 25%</text>

  <!-- ПРАВА ПАНЕЛЬ: 3 функціональні блоки -->
  <!-- Блок 1: Відсікання шуму -->
  <rect x="598" y="78" width="338" height="114" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="612" y="90" width="186" height="22" rx="4" fill="#e5e7eb"/>
  <text x="620" y="105" font-size="12" font-weight="bold" fill="#1a1a1a">1. Відсікання шуму (deadband)</text>
  <text x="612" y="130" font-size="12" fill="#1a1a1a">Діапазон: 0% ≤ |u| ≤ 8%  →  ШІМ = 0%</text>
  <text x="612" y="148" font-size="12" fill="#6b7280">Фільтрує тремтіння джойстика та дрейф АЦП</text>
  <text x="612" y="166" font-size="12" fill="#6b7280">Режим гальмування (BRAKE): вал зафіксовано</text>
  <text x="612" y="184" font-size="12" fill="#6b7280">Виключає нагрів обмоток струмом без руху</text>

  <!-- Блок 2: Зрушуюче зміщення -->
  <rect x="598" y="204" width="338" height="136" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="612" y="216" width="220" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="620" y="231" font-size="12" font-weight="bold" fill="#2457d6">2. Зрушуюче зміщення (PWM_min)</text>
  <text x="612" y="256" font-size="12" fill="#1a1a1a">Поріг страгування: стрибок ШІМ до 25%</text>
  <text x="612" y="274" font-size="12" fill="#6b7280">Долає сухе тертя шестерень редуктора (stiction)</text>
  <text x="612" y="292" font-size="12" fill="#c0392b">Без зміщення: при ШІМ &lt; 25% мотор лише гуде</text>
  <text x="612" y="310" font-size="12" fill="#6b7280">Усуває мертвий хід ручки керування</text>
  <text x="612" y="328" font-size="12" fill="#27ae60">Забезпечує передбачуваний впевнений старт</text>

  <!-- Блок 3: Лінійне регулювання -->
  <rect x="598" y="352" width="338" height="168" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="612" y="364" width="210" height="22" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="620" y="379" font-size="12" font-weight="bold" fill="#27ae60">3. Лінійна робоча зона</text>
  <text x="612" y="403" font-size="12" fill="#1a1a1a">ШІМ масштабується від 25% до 100%:</text>
  
  <rect x="612" y="413" width="310" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="620" y="430" font-size="12" font-family="monospace" fill="#2457d6">k = (100 - PWM_min) / (100 - u_пор)</text>
  <text x="620" y="446" font-size="12" font-family="monospace" fill="#1a1a1a">ШІМ = PWM_min + k · (|u| - u_пор)</text>

  <text x="612" y="473" font-size="12" fill="#6b7280">Знак команди u задає напрямок (DIR):</text>
  <text x="612" y="491" font-size="12" font-weight="bold" fill="#1a1a1a">DIR = (u &gt; 0) ? FORWARD : REVERSE</text>
  <text x="612" y="508" font-size="12" fill="#27ae60">Характеристика для реверсу повністю симетрична</text>
</svg>
