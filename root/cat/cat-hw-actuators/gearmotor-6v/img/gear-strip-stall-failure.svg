<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Механізм аварійного блокування: від перешкоди до зрізу зубців</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Ланцюжок подій під час заклинювання вала: падіння проти-ЕРС, піковий струм I_stall та напруження в редукторі</text>

  <!-- ==================== ПАНЕЛЬ 1: МЕХАНІЧНИЙ УПОР ==================== -->
  <rect x="24" y="78" width="280" height="378" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Бейдж панелі 1 -->
  <rect x="36" y="90" width="256" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="164" y="107" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Механічний упор колеса</text>

  <!-- Графічна картка 1: колесо впирається у стіну -->
  <rect x="36" y="126" width="256" height="112" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <line x1="46" y1="222" x2="282" y2="222" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Стіна / непереборна перешкода -->
  <rect x="205" y="136" width="77" height="86" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
  <text x="243" y="168" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Перешкода</text>
  <text x="243" y="186" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Упор: v = 0</text>

  <!-- Шасі робота -->
  <rect x="46" y="155" width="64" height="55" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="78" y="178" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Шасі</text>
  <text x="78" y="196" font-size="12" fill="#2457d6" text-anchor="middle">робота</text>
  <line x1="110" y1="182" x2="125" y2="182" stroke="#2457d6" stroke-width="3"/>

  <!-- Колесо, затиснуте між приводом і стіною -->
  <circle cx="165" cy="182" r="40" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="165" cy="182" r="32" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="165" cy="182" r="12" fill="#d0d7de" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="165" cy="182" r="3.5" fill="#1a1a1a"/>

  <!-- Заблоковане обертання -->
  <path d="M 150,154 A 18,18 0 0,1 180,154" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="160" y1="147" x2="170" y2="157" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="170" y1="147" x2="160" y2="157" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="205" cy="182" r="4" fill="#c0392b"/>

  <!-- Аналітична картка 1: параметри зупинки -->
  <rect x="36" y="250" width="256" height="92" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="48" y="270" font-size="12" font-weight="bold" fill="#1a1a1a">• Швидкість колеса: ω = 0</text>
  <text x="48" y="290" font-size="12" fill="#6b7280">• Ротор двигуна: n = 0 об/хв</text>
  <text x="48" y="310" font-size="12" font-weight="bold" fill="#c0392b">• Генераторна проти-ЕРС:</text>
  <text x="60" y="328" font-size="12" font-weight="bold" fill="#c0392b">E_b = k_e · ω = 0 В</text>

  <!-- Картка наслідків 1 -->
  <rect x="36" y="354" width="256" height="90" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="48" y="374" font-size="12" font-weight="bold" fill="#c0392b">Наслідок зникнення E_b:</text>
  <text x="48" y="394" font-size="12" fill="#1a1a1a">Зупинений двигун втрачає</text>
  <text x="48" y="412" font-size="12" fill="#1a1a1a">внутрішню саморегуляцію і стає</text>
  <text x="48" y="430" font-size="12" font-weight="bold" fill="#c0392b">простим коротким замиканням</text>


  <!-- ==================== ПАНЕЛЬ 2: СТРУМОВИЙ СТРИБОК ==================== -->
  <rect x="340" y="78" width="280" height="378" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Бейдж панелі 2 -->
  <rect x="352" y="90" width="256" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="480" y="107" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">2. Струмовий стрибок (I_stall)</text>

  <!-- Графічна картка 2: графік струму I(t) -->
  <rect x="352" y="126" width="256" height="112" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Осі координат -->
  <line x1="390" y1="220" x2="390" y2="138" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="385" y1="215" x2="595" y2="215" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="396" y="142" font-size="12" font-weight="bold" fill="#6b7280">I, А</text>
  <text x="590" y="210" font-size="12" fill="#6b7280">t</text>

  <!-- Номінальний струм -->
  <line x1="386" y1="198" x2="390" y2="198" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="390" y1="198" x2="465" y2="198" stroke="#27ae60" stroke-width="2.5"/>
  <text x="396" y="192" font-size="12" font-weight="bold" fill="#27ae60">0.15 А</text>

  <!-- Момент упору і стрибок -->
  <line x1="465" y1="150" x2="465" y2="215" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="465" y="228" font-size="12" fill="#c0392b" text-anchor="middle">упор</text>
  <line x1="465" y1="198" x2="472" y2="158" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="472" y1="158" x2="585" y2="158" stroke="#c0392b" stroke-width="2.5"/>
  <text x="530" y="152" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">I_stall ≈ 2.0 А</text>

  <!-- Плашка масштабу стрибка -->
  <rect x="488" y="172" width="108" height="34" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="542" y="186" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Стрибок струму</text>
  <text x="542" y="200" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">у 10–15 разів!</text>

  <!-- Аналітична картка 2: формула Ома -->
  <rect x="352" y="250" width="256" height="92" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="364" y="270" font-size="12" font-weight="bold" fill="#1a1a1a">Закон Ома для кола двигуна:</text>
  <text x="364" y="290" font-size="12" fill="#6b7280">I = (V_живл – E_b) / R_якоря</text>
  <text x="364" y="310" font-size="12" font-weight="bold" fill="#c0392b">E_b = 0  ⇒  I_stall = V_живл / R_я</text>
  <text x="364" y="328" font-size="12" fill="#1a1a1a">При 6 В та R_я = 3.5 Ом: I ≈ 1.7 А</text>

  <!-- Картка наслідків 2: нагрів і момент -->
  <rect x="352" y="354" width="256" height="90" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="364" y="374" font-size="12" font-weight="bold" fill="#c0392b">Тепловий та силовий удар:</text>
  <text x="364" y="394" font-size="12" fill="#1a1a1a">• Нагрів: P = I²·R (ріст у 150 разів)</text>
  <text x="364" y="412" font-size="12" fill="#1a1a1a">• Момент ротора сягає піку:</text>
  <text x="376" y="430" font-size="12" font-weight="bold" fill="#c0392b">M_дв = k_t · I_stall  (максимум!)</text>


  <!-- ==================== ПАНЕЛЬ 3: РУЙНУВАННЯ ЗУБЦІВ ==================== -->
  <rect x="656" y="78" width="280" height="378" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Бейдж панелі 3 -->
  <rect x="668" y="90" width="256" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="796" y="107" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">3. Механічний зріз зубців</text>

  <!-- Графічна картка 3: контакт пари зубців і напруження -->
  <rect x="668" y="126" width="256" height="112" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Ведучий зуб шестерні (ліворуч) -->
  <path d="M 678,140 L 702,140 L 720,165 L 708,185 L 678,175 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Зуб вихідного колеса редуктора під навантаженням -->
  <path d="M 700,224 L 712,224 C 716,210 717,190 720,165 L 724,144 L 742,144 L 752,195 C 755,210 756,218 764,224 Z" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Сила взаємодії F_t -->
  <line x1="682" y1="165" x2="716" y2="165" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="696" y="158" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">F_t</text>

  <!-- Зона концентрації напруження біля основи зуба -->
  <ellipse cx="715" cy="212" rx="7" ry="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <path d="M 710,213 L 715,210 L 720,214" fill="none" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Пояснювальний текст біля шестерні -->
  <text x="774" y="146" font-size="12" font-weight="bold" fill="#c0392b">Зона концентрації:</text>
  <text x="774" y="164" font-size="12" fill="#1a1a1a">Згин та зріз основи:</text>
  <text x="774" y="182" font-size="12" font-weight="bold" fill="#c0392b">σ_згин &gt; [σ]_граничне</text>
  <text x="774" y="200" font-size="12" fill="#6b7280">Пластична течія</text>
  <text x="774" y="218" font-size="12" font-weight="bold" fill="#c0392b">Зріз зубців шестерні</text>

  <!-- Аналітична картка 3: редуктор і колова сила -->
  <rect x="668" y="250" width="256" height="92" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="680" y="270" font-size="12" font-weight="bold" fill="#1a1a1a">Редуктор множить момент:</text>
  <text x="680" y="290" font-size="12" font-weight="bold" fill="#2457d6">M_вих = M_дв · i · η</text>
  <text x="680" y="308" font-size="12" fill="#6b7280">Для 100 об/хв (i ≈ 150): M ↑ у 100×</text>
  <text x="680" y="328" font-size="12" fill="#1a1a1a">Колова сила: F_t = 2·M_вих / d_діл</text>

  <!-- Картка наслідків 3: механічний колапс -->
  <rect x="668" y="354" width="256" height="90" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="680" y="374" font-size="12" font-weight="bold" fill="#c0392b">Фатальний зріз зубців:</text>
  <text x="680" y="394" font-size="12" fill="#1a1a1a">• На вихідному ступені редуктора</text>
  <text x="680" y="412" font-size="12" fill="#1a1a1a">  сила F_t перевищує межу зсуву</text>
  <text x="680" y="430" font-size="12" font-weight="bold" fill="#c0392b">• Миттєве злизування зубців!</text>


  <!-- ==================== СТРІЛКИ ЗВ'ЯЗКУ МІЖ СТАДІЯМИ ==================== -->
  <!-- Рівень 1: графіка -->
  <line x1="310" y1="182" x2="334" y2="182" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <line x1="626" y1="182" x2="650" y2="182" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>

  <!-- Рівень 2: аналітика -->
  <line x1="310" y1="296" x2="334" y2="296" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <line x1="626" y1="296" x2="650" y2="296" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>

  <!-- Рівень 3: наслідки -->
  <line x1="310" y1="399" x2="334" y2="399" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <line x1="626" y1="399" x2="650" y2="399" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
</svg>
