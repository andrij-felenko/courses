<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Header -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Колесо як механічний важіль: тяга та лінійна швидкість</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Перетворення вихідного моменту й обертів вала: F_тяг = M / R та v = ω · R для різного радіуса R</text>

  <!-- CARD 1: Small wheel (top-left) -->
  <rect x="30" y="75" width="450" height="185" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="45" y="98" font-size="14" font-weight="bold" fill="#1a1a1a">Мале колесо: R₁ = 20 мм (високе тягове зусилля)</text>

  <!-- Ground line Card 1 -->
  <line x1="45" y1="195" x2="225" y2="195" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
  <path d="M 45,200 L 49,195 M 55,200 L 59,195 M 65,200 L 69,195 M 75,200 L 79,195" stroke="#6b7280" stroke-width="1"/>

  <!-- Wheel 1 -->
  <circle cx="105" cy="169" r="26" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="105" cy="169" r="12" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="105" cy="169" r="3.5" fill="#1a1a1a"/>

  <!-- Lever Arm R1 -->
  <line x1="105" y1="169" x2="105" y2="195" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="105" cy="195" r="3" fill="#1a1a1a"/>
  <text x="96" y="185" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">R₁</text>
  <text x="80" y="171" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">O</text>

  <!-- Torque M Card 1 -->
  <path d="M 92,163 A 16,16 0 0,1 119,163" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="105" y="142" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">M, ω</text>

  <!-- Linear Velocity v1 Card 1 -->
  <line x1="105" y1="169" x2="139" y2="169" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="145" y="160" font-size="12" font-weight="bold" fill="#2457d6">v₁ = ω·R₁</text>

  <!-- Traction Force F1 Card 1 -->
  <line x1="105" y1="195" x2="185" y2="195" stroke="#27ae60" stroke-width="3.5" marker-end="url(#arr-green)"/>
  <text x="145" y="218" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">F₁ = M / R₁ (тяга ×2)</text>

  <!-- Card 1 Inner Box -->
  <rect x="240" y="112" width="230" height="135" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="252" y="132" font-size="12" font-weight="bold" fill="#1a1a1a">Параметри при R₁ = 20 мм:</text>
  <text x="252" y="153" font-size="12" fill="#27ae60" font-weight="bold">Тяга F₁ = M/R₁:</text>
  <text x="358" y="153" font-size="12" fill="#1a1a1a" font-weight="bold">100% (макс.)</text>
  <text x="252" y="173" font-size="12" fill="#2457d6" font-weight="bold">Швидкість v₁:</text>
  <text x="358" y="173" font-size="12" fill="#1a1a1a">50% (базова)</text>
  <text x="252" y="196" font-size="12" fill="#1a1a1a">• Впевнено долає круті підйоми</text>
  <text x="252" y="216" font-size="12" fill="#1a1a1a">• Менший ризик перевантаження</text>
  <text x="252" y="236" font-size="12" fill="#6b7280">• Мінус: невисока швидкість ходу</text>

  <!-- CARD 2: Large wheel (bottom-left) -->
  <rect x="30" y="275" width="450" height="185" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="45" y="298" font-size="14" font-weight="bold" fill="#1a1a1a">Велике колесо: R₂ = 40 мм (висока лінійна швидкість)</text>

  <!-- Ground line Card 2 -->
  <line x1="45" y1="420" x2="225" y2="420" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
  <path d="M 45,425 L 49,420 M 55,425 L 59,420 M 65,425 L 69,420 M 75,425 L 79,420" stroke="#6b7280" stroke-width="1"/>

  <!-- Wheel 2 -->
  <circle cx="105" cy="368" r="52" fill="#ffffff" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="105" cy="368" r="24" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="105" cy="368" r="3.5" fill="#1a1a1a"/>

  <!-- Lever Arm R2 -->
  <line x1="105" y1="368" x2="105" y2="420" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="105" cy="420" r="3" fill="#1a1a1a"/>
  <text x="96" y="398" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">R₂</text>
  <text x="80" y="370" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">O</text>

  <!-- Torque M Card 2 -->
  <path d="M 92,362 A 16,16 0 0,1 119,362" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="105" y="341" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">M, ω</text>

  <!-- Linear Velocity v2 Card 2 -->
  <line x1="105" y1="368" x2="173" y2="368" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="178" y="360" font-size="12" font-weight="bold" fill="#2457d6">v₂ = 2·v₁</text>

  <!-- Traction Force F2 Card 2 -->
  <line x1="105" y1="420" x2="145" y2="420" stroke="#27ae60" stroke-width="3.5" marker-end="url(#arr-green)"/>
  <text x="125" y="442" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">F₂ = M / R₂ (тяга −50%)</text>

  <!-- Card 2 Inner Box -->
  <rect x="240" y="312" width="230" height="135" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="252" y="332" font-size="12" font-weight="bold" fill="#1a1a1a">Параметри при R₂ = 40 мм:</text>
  <text x="252" y="353" font-size="12" fill="#c0392b" font-weight="bold">Тяга F₂ = M/R₂:</text>
  <text x="358" y="353" font-size="12" fill="#c0392b" font-weight="bold">50% (F₁ / 2)</text>
  <text x="252" y="373" font-size="12" fill="#2457d6" font-weight="bold">Швидкість v₂:</text>
  <text x="358" y="373" font-size="12" fill="#2457d6" font-weight="bold">200% (2 · v₁)</text>
  <text x="252" y="396" font-size="12" fill="#1a1a1a">• Швидкий рух на прямих ділянках</text>
  <text x="252" y="416" font-size="12" fill="#1a1a1a">• Збільшений кліренс шасі робота</text>
  <text x="252" y="436" font-size="12" fill="#c0392b">• Ризик зупинки мотора на підйомі</text>

  <!-- CARD 3: Equations (top-right) -->
  <rect x="500" y="75" width="435" height="185" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="515" y="98" font-size="14" font-weight="bold" fill="#1a1a1a">Кінематичні та динамічні рівняння</text>

  <!-- Equation 1 -->
  <rect x="515" y="110" width="405" height="40" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="527" y="126" font-size="12" fill="#6b7280">Лінійна швидкість шасі:</text>
  <text x="527" y="142" font-size="13" font-weight="bold" fill="#2457d6">v = ω · R = (2π · n / 60) · R</text>
  <text x="908" y="134" font-size="12" fill="#1a1a1a" text-anchor="end">де n — об/хв вала</text>

  <!-- Equation 2 -->
  <rect x="515" y="158" width="405" height="40" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="527" y="174" font-size="12" fill="#6b7280">Тягове зусилля на контактній плямі:</text>
  <text x="527" y="190" font-size="13" font-weight="bold" fill="#27ae60">F_тяг = M_вих / R</text>
  <text x="908" y="182" font-size="12" fill="#1a1a1a" text-anchor="end">F обернено пропорційна R</text>

  <!-- Equation 3 -->
  <rect x="515" y="206" width="405" height="40" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="527" y="222" font-size="12" fill="#6b7280">Зв'язок через потужність (ідеальна передача):</text>
  <text x="527" y="238" font-size="13" font-weight="bold" fill="#1a1a1a">P_тяг = F_тяг · v = (M / R) · (ω · R) = M · ω</text>

  <!-- CARD 4: Engineering Rules (bottom-right) -->
  <rect x="500" y="275" width="435" height="185" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="515" y="298" font-size="14" font-weight="bold" fill="#1a1a1a">Інженерні правила вибору діаметра колеса</text>

  <!-- Rule 1: Increase radius -->
  <rect x="515" y="310" width="405" height="70" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="527" y="326" font-size="12" font-weight="bold" fill="#2457d6">Збільшення радіуса (R ↑): швидкість ціною тяги</text>
  <text x="527" y="344" font-size="12" fill="#27ae60" font-weight="bold">[+]</text>
  <text x="550" y="344" font-size="12" fill="#1a1a1a">Зростає лінійна швидкість</text>
  <text x="725" y="344" font-size="12" fill="#27ae60" font-weight="bold">[+]</text>
  <text x="748" y="344" font-size="12" fill="#1a1a1a">Кращий кліренс шасі</text>
  <text x="527" y="364" font-size="12" fill="#c0392b" font-weight="bold">[−]</text>
  <text x="550" y="364" font-size="12" fill="#1a1a1a">Падає тяга (перегрів)</text>
  <text x="725" y="364" font-size="12" fill="#c0392b" font-weight="bold">[−]</text>
  <text x="748" y="364" font-size="12" fill="#1a1a1a">Струм розгону ↑</text>

  <!-- Rule 2: Decrease radius -->
  <rect x="515" y="388" width="405" height="60" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="527" y="404" font-size="12" font-weight="bold" fill="#27ae60">Зменшення радіуса (R ↓): тяга ціною швидкості</text>
  <text x="527" y="422" font-size="12" fill="#27ae60" font-weight="bold">[+]</text>
  <text x="550" y="422" font-size="12" fill="#1a1a1a">Максимальна тяга: легкий старт і круті схили</text>
  <text x="527" y="440" font-size="12" fill="#c0392b" font-weight="bold">[−]</text>
  <text x="550" y="440" font-size="12" fill="#1a1a1a">Низька максимальна швидкість пересування</text>
</svg>
