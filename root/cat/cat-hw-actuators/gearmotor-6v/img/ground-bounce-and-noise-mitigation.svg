<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Головний заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Шумозахист H-моста: придушення Ground Bounce та іскор колектора</text>
  <text x="480" y="64" font-size="13" fill="#6b7280" text-anchor="middle">Розділення силової та сигнальної земель «зіркою» усуває стрибки V_bounce = L · (di/dt)</text>

  <!-- ==================== ЛІВА ПАНЕЛЬ: ПРОБЛЕМА ==================== -->
  <rect x="24" y="80" width="446" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Заголовок лівої панелі -->
  <rect x="38" y="92" width="418" height="30" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="247" y="112" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">❌ Спільна земля: паразитна L_trace та стрибок V_bounce</text>

  <!-- Схема: МК -->
  <rect x="42" y="136" width="94" height="68" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="89" y="154" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">МК (MCU)</text>
  <text x="89" y="170" font-size="12" fill="#6b7280" text-anchor="middle">Логіка 3.3 В</text>
  <text x="89" y="190" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">GND_мк</text>

  <!-- Лінія сигналу ШІМ від МК до H-моста -->
  <line x1="136" y1="162" x2="180" y2="162" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="158" y="148" font-size="12" fill="#2457d6" text-anchor="middle">ШІМ</text>

  <!-- Схема: H-міст -->
  <rect x="186" y="136" width="96" height="68" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="234" y="154" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">H-міст</text>
  <text x="234" y="170" font-size="12" fill="#6b7280" text-anchor="middle">Ключі драйвера</text>
  <text x="234" y="190" font-size="12" fill="#1a1a1a" text-anchor="middle">PGND</text>

  <!-- Лінії до мотора -->
  <line x1="282" y1="156" x2="330" y2="156" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="282" y1="176" x2="330" y2="176" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Схема: Мотор без фільтра -->
  <rect x="330" y="136" width="118" height="68" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="389" y="154" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Двигун 6 В</text>
  <text x="389" y="170" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Без фільтра!</text>
  <text x="389" y="190" font-size="12" fill="#c0392b" text-anchor="middle">Іскри щіток (шум)</text>

  <!-- Спільна шина заземлення з паразитною індуктивністю -->
  <!-- Вертикальний спуск від МК GND -->
  <line x1="89" y1="204" x2="89" y2="236" stroke="#c0392b" stroke-width="2"/>
  <circle cx="89" cy="236" r="3.5" fill="#c0392b"/>

  <!-- Вертикальний спуск від PGND H-моста -->
  <line x1="234" y1="204" x2="234" y2="236" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="234" cy="236" r="3.5" fill="#1a1a1a"/>

  <!-- Горизонтальна спільна шина -->
  <line x1="42" y1="236" x2="136" y2="236" stroke="#c0392b" stroke-width="2"/>
  <path d="M 136,236 q 6,-6 12,0 q 6,-6 12,0 q 6,-6 12,0 q 6,-6 12,0" fill="none" stroke="#c0392b" stroke-width="2"/>
  <line x1="184" y1="236" x2="234" y2="236" stroke="#c0392b" stroke-width="2"/>

  <!-- Позначення клеми 0 В живлення -->
  <circle cx="42" cy="236" r="3.5" fill="#1a1a1a"/>
  <text x="42" y="222" font-size="12" font-weight="bold" fill="#1a1a1a">0 В (БЖ)</text>

  <!-- Підпис паразитної індуктивності -->
  <text x="160" y="216" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">L_trace</text>

  <!-- Стрілка імпульсного струму мотора через спільну шину -->
  <line x1="226" y1="248" x2="52" y2="248" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <text x="247" y="272" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Струм комутації мотора di/dt через спільну L_trace</text>

  <!-- Нижня рамка осцилограми (Проблема) -->
  <rect x="38" y="286" width="418" height="142" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="50" y="304" font-size="12" font-weight="bold" fill="#c0392b">Осцилограма: стрибок потенціалу GND та збій логіки</text>

  <!-- Сигнал логіки з просіданням -->
  <text x="96" y="330" font-size="12" fill="#1a1a1a" text-anchor="end">Вхід МК</text>
  <path d="M 108,326 L 195,326 L 200,348 L 204,334 L 208,346 L 214,326 L 430,326" fill="none" stroke="#2457d6" stroke-width="2"/>
  <text x="230" y="354" font-size="12" font-weight="bold" fill="#c0392b">Хибний нуль (V &lt; V_IH)</text>

  <!-- Лінія 0 В та викид на GND -->
  <text x="96" y="402" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">GND_мк</text>
  <line x1="108" y1="398" x2="430" y2="398" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <path d="M 108,398 L 195,398 L 199,380 L 203,414 L 207,384 L 211,406 L 216,398 L 430,398" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="230" y="378" font-size="12" font-weight="bold" fill="#c0392b">V_bounce = L·(di/dt) &gt; 1.5 В</text>

  <!-- Підсумок лівої панелі -->
  <text x="247" y="422" font-size="12" fill="#c0392b" text-anchor="middle">Земля МК підстрибує: хибні спрацьовування та збій процесора</text>

  <!-- ==================== ПРАВА ПАНЕЛЬ: РОЗВ'ЯЗОК ==================== -->
  <rect x="490" y="80" width="446" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Заголовок правої панелі -->
  <rect x="504" y="92" width="418" height="30" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="713" y="112" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">✔ Зіркове заземлення (Star GND) + фільтр іскор 3×C</text>

  <!-- Схема: МК -->
  <rect x="508" y="136" width="94" height="68" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="555" y="154" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">МК (MCU)</text>
  <text x="555" y="170" font-size="12" fill="#6b7280" text-anchor="middle">Логіка 3.3 В</text>
  <text x="555" y="190" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">GND чиста</text>

  <!-- Лінія сигналу ШІМ від МК до H-моста -->
  <line x1="602" y1="162" x2="646" y2="162" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="624" y="148" font-size="12" fill="#2457d6" text-anchor="middle">ШІМ</text>

  <!-- Схема: H-міст -->
  <rect x="652" y="136" width="96" height="68" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="700" y="154" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">H-міст</text>
  <text x="700" y="170" font-size="12" fill="#6b7280" text-anchor="middle">Ключі драйвера</text>
  <text x="700" y="190" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">PGND силова</text>

  <!-- Лінії до мотора з конденсатором C1 -->
  <line x1="748" y1="156" x2="804" y2="156" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="748" y1="176" x2="804" y2="176" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Конденсатор C1 між клемами мотора -->
  <line x1="776" y1="156" x2="776" y2="163" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="770" y1="163" x2="782" y2="163" stroke="#27ae60" stroke-width="2"/>
  <line x1="770" y1="167" x2="782" y2="167" stroke="#27ae60" stroke-width="2"/>
  <line x1="776" y1="167" x2="776" y2="176" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Схема: Мотор з фільтрацією -->
  <rect x="804" y="136" width="124" height="68" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="866" y="154" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Двигун 6 В</text>
  <text x="866" y="170" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">C1: 100 нФ (клеми)</text>
  <text x="866" y="188" font-size="12" fill="#27ae60" text-anchor="middle">C2, C3: на корпус</text>

  <!-- Зіркове заземлення (Star Ground): два окремі провідники -->
  <!-- Зіркова точка -->
  <circle cx="628" cy="236" r="5" fill="#27ae60"/>
  <text x="713" y="272" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Зіркова точка: роздільні траси GND та PGND</text>

  <!-- Провідник 1: Сигнальна чиста земля від МК до зірки -->
  <path d="M 555,204 L 555,236 L 628,236" fill="none" stroke="#27ae60" stroke-width="2"/>

  <!-- Провідник 2: Силова земля PGND від H-моста до зірки -->
  <path d="M 700,204 L 700,236 L 628,236" fill="none" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Підведення від БЖ до зіркової точки -->
  <line x1="508" y1="236" x2="628" y2="236" stroke="#27ae60" stroke-width="2" stroke-dasharray="3,2"/>
  <circle cx="508" cy="236" r="3.5" fill="#1a1a1a"/>
  <text x="508" y="222" font-size="12" font-weight="bold" fill="#1a1a1a">0 В (БЖ)</text>

  <!-- Нижня рамка осцилограми (Розв'язок) -->
  <rect x="504" y="286" width="418" height="142" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="516" y="304" font-size="12" font-weight="bold" fill="#27ae60">Осцилограма: стабільна земля 0 В та чистий сигнал</text>

  <!-- Стабільний сигнал логіки -->
  <text x="562" y="330" font-size="12" fill="#1a1a1a" text-anchor="end">Вхід МК</text>
  <line x1="574" y1="326" x2="896" y2="326" stroke="#2457d6" stroke-width="2"/>
  <text x="710" y="354" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Чистий сигнал 3.3 В (без просідань і шумів)</text>

  <!-- Стабільний GND без стрибків -->
  <text x="562" y="402" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">GND_мк</text>
  <line x1="574" y1="398" x2="896" y2="398" stroke="#27ae60" stroke-width="2"/>
  <text x="710" y="378" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">V(GND) = 0.0 В (стабільна опорна точка)</text>

  <!-- Підсумок правої панелі -->
  <text x="713" y="422" font-size="12" fill="#27ae60" text-anchor="middle">Струм di/dt замкнено на PGND, а іскри щіток зрізано фільтром 3×C</text>
</svg>
