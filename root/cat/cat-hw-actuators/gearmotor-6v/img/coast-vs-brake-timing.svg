<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Підкладка полотна -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <!-- Маркери стрілок для осей -->
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Вільний вибіг (COAST) проти динамічного гальмування (BRAKE)</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Порівняння перехідних процесів напруги, струму якоря, проти-ЕРС та швидкості обертання</text>

  <!-- ==================== ЛІВА ПАНЕЛЬ: COAST ==================== -->
  <rect x="24" y="74" width="444" height="462" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Заголовок режиму COAST -->
  <rect x="36" y="86" width="420" height="32" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="246" y="107" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Режим COAST: розмикання ключів (Hi-Z)</text>

  <!-- Маркер часу відключення t_вимк (COAST) -->
  <text x="180" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">t_вимк</text>
  <line x1="180" y1="136" x2="180" y2="424" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Графік 1 (COAST): Напруга мотора U -->
  <text x="32" y="136" font-size="12" font-weight="bold" fill="#1a1a1a">Напруга U</text>
  <text x="102" y="152" text-anchor="end" font-size="12" fill="#6b7280">+6 В</text>
  <text x="102" y="186" text-anchor="end" font-size="12" fill="#6b7280">0 В</text>
  <line x1="108" y1="144" x2="108" y2="186" stroke="#d0d7de" stroke-width="1"/>
  <line x1="108" y1="186" x2="436" y2="186" stroke="#d0d7de" stroke-width="1"/>
  <path d="M 108,148 L 180,148 L 180,154 Q 250,162 320,176 T 400,186 L 436,186" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <text x="210" y="146" font-size="12" fill="#2457d6">U = e (генерація на вибігу)</text>

  <!-- Графік 2 (COAST): Струм якоря I -->
  <text x="32" y="214" font-size="12" font-weight="bold" fill="#1a1a1a">Струм I</text>
  <text x="102" y="228" text-anchor="end" font-size="12" fill="#6b7280">+Iном</text>
  <text x="102" y="254" text-anchor="end" font-size="12" fill="#6b7280">0</text>
  <line x1="108" y1="222" x2="108" y2="266" stroke="#d0d7de" stroke-width="1"/>
  <line x1="108" y1="250" x2="436" y2="250" stroke="#d0d7de" stroke-width="1"/>
  <path d="M 108,226 L 180,226 L 180,250 L 436,250" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <text x="210" y="236" font-size="12" fill="#2457d6">I = 0 (коло розімкнене)</text>

  <!-- Графік 3 (COAST): Проти-ЕРС e -->
  <text x="32" y="294" font-size="12" font-weight="bold" fill="#1a1a1a">Проти-ЕРС e</text>
  <text x="102" y="308" text-anchor="end" font-size="12" fill="#6b7280">+eном</text>
  <text x="102" y="342" text-anchor="end" font-size="12" fill="#6b7280">0 В</text>
  <line x1="108" y1="302" x2="108" y2="344" stroke="#d0d7de" stroke-width="1"/>
  <line x1="108" y1="342" x2="436" y2="342" stroke="#d0d7de" stroke-width="1"/>
  <path d="M 108,304 L 180,304 Q 250,312 320,328 T 400,342 L 436,342" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <text x="210" y="298" font-size="12" fill="#2457d6">e = k_e · ω (спадає з обертами)</text>

  <!-- Графік 4 (COAST): Швидкість вала ω -->
  <text x="32" y="374" font-size="12" font-weight="bold" fill="#1a1a1a">Швидкість ω</text>
  <text x="102" y="388" text-anchor="end" font-size="12" fill="#6b7280">ωном</text>
  <text x="102" y="422" text-anchor="end" font-size="12" fill="#6b7280">0</text>
  <line x1="108" y1="382" x2="108" y2="424" stroke="#d0d7de" stroke-width="1"/>
  <line x1="108" y1="422" x2="436" y2="422" stroke="#d0d7de" stroke-width="1" marker-end="url(#arr)"/>
  <path d="M 108,384 L 180,384 Q 250,392 320,408 T 400,422 L 436,422" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <text x="210" y="378" font-size="12" font-weight="bold" fill="#2457d6">Тривалий вибіг (t_зуп ≈ 600 мс)</text>
  <text x="436" y="440" text-anchor="end" font-size="12" fill="#6b7280">Час t →</text>

  <!-- Підсумкова картка (COAST) -->
  <rect x="36" y="462" width="420" height="62" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="48" y="482" font-size="12" font-weight="bold" fill="#2457d6">• Стан Hi-Z: міст знеструмлено, струм I = 0</text>
  <text x="48" y="504" font-size="12" fill="#1a1a1a">• Гальмування лише тертям: плавний, тривалий вибіг ротора</text>


  <!-- ==================== ПРАВА ПАНЕЛЬ: BRAKE ==================== -->
  <rect x="492" y="74" width="444" height="462" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Заголовок режиму BRAKE -->
  <rect x="504" y="86" width="420" height="32" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="714" y="107" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Режим BRAKE: закорочення на GND</text>

  <!-- Маркер часу відключення t_вимк (BRAKE) -->
  <text x="648" y="130" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">t_вимк</text>
  <line x1="648" y1="136" x2="648" y2="424" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Графік 1 (BRAKE): Напруга мотора U -->
  <text x="500" y="136" font-size="12" font-weight="bold" fill="#1a1a1a">Напруга U</text>
  <text x="570" y="152" text-anchor="end" font-size="12" fill="#6b7280">+6 В</text>
  <text x="570" y="186" text-anchor="end" font-size="12" fill="#6b7280">0 В</text>
  <line x1="576" y1="144" x2="576" y2="186" stroke="#d0d7de" stroke-width="1"/>
  <line x1="576" y1="186" x2="904" y2="186" stroke="#d0d7de" stroke-width="1"/>
  <path d="M 576,148 L 648,148 L 648,186 L 904,186" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <text x="678" y="146" font-size="12" font-weight="bold" fill="#27ae60">U = 0 В (обмотки закорочено)</text>

  <!-- Графік 2 (BRAKE): Струм якоря I -->
  <text x="500" y="214" font-size="12" font-weight="bold" fill="#1a1a1a">Струм I</text>
  <text x="570" y="228" text-anchor="end" font-size="12" fill="#6b7280">+Iном</text>
  <text x="570" y="250" text-anchor="end" font-size="12" fill="#6b7280">0</text>
  <text x="570" y="274" text-anchor="end" font-size="12" fill="#c0392b">-Iгальм</text>
  <line x1="576" y1="222" x2="576" y2="276" stroke="#d0d7de" stroke-width="1"/>
  <line x1="576" y1="248" x2="904" y2="248" stroke="#d0d7de" stroke-width="1"/>
  <path d="M 576,226 L 648,226 L 648,274 Q 662,266 678,252 T 706,248 L 904,248" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="678" y="226" font-size="12" font-weight="bold" fill="#c0392b">Сплеск I_гальм (гальмівний момент)</text>
  <text x="678" y="240" font-size="12" fill="#6b7280">I_гальм = -e / R_якоря &lt; 0</text>

  <!-- Графік 3 (BRAKE): Проти-ЕРС e -->
  <text x="500" y="294" font-size="12" font-weight="bold" fill="#1a1a1a">Проти-ЕРС e</text>
  <text x="570" y="308" text-anchor="end" font-size="12" fill="#6b7280">+eном</text>
  <text x="570" y="342" text-anchor="end" font-size="12" fill="#6b7280">0 В</text>
  <line x1="576" y1="302" x2="576" y2="344" stroke="#d0d7de" stroke-width="1"/>
  <line x1="576" y1="342" x2="904" y2="342" stroke="#d0d7de" stroke-width="1"/>
  <path d="M 576,304 L 648,304 Q 662,328 680,338 T 706,342 L 904,342" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <text x="718" y="318" font-size="12" font-weight="bold" fill="#27ae60">Стрімкий спад проти-ЕРС</text>

  <!-- Графік 4 (BRAKE): Швидкість вала ω -->
  <text x="500" y="374" font-size="12" font-weight="bold" fill="#1a1a1a">Швидкість ω</text>
  <text x="570" y="388" text-anchor="end" font-size="12" fill="#6b7280">ωном</text>
  <text x="570" y="422" text-anchor="end" font-size="12" fill="#6b7280">0</text>
  <line x1="576" y1="382" x2="576" y2="424" stroke="#d0d7de" stroke-width="1"/>
  <line x1="576" y1="422" x2="904" y2="422" stroke="#d0d7de" stroke-width="1" marker-end="url(#arr)"/>
  <path d="M 576,384 L 648,384 Q 662,408 680,418 T 706,422 L 904,422" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <text x="718" y="394" font-size="12" font-weight="bold" fill="#27ae60">Різкий зупин: t_зуп ≈ 40 мс</text>
  <text x="904" y="440" text-anchor="end" font-size="12" fill="#6b7280">Час t →</text>

  <!-- Підсумкова картка (BRAKE) -->
  <rect x="504" y="462" width="420" height="62" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="516" y="482" font-size="12" font-weight="bold" fill="#27ae60">• Стан BRAKE: обмотки замкнено, діє проти-ЕРС</text>
  <text x="516" y="504" font-size="12" fill="#1a1a1a">• Електродинамічне гальмування: зупинка у 10–15 разів швидша</text>
</svg>
