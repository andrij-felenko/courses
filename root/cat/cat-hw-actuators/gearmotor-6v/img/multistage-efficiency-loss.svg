<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Падіння сумарного ККД редуктора від кількості ступенів</text>
  <text x="480" y="63" font-size="13" text-anchor="middle" fill="#6b7280">При 4–6 ступенях бюджетні передачі втрачають понад половину потужності на нагрів і тертя</text>

  <!-- Y axis title & Legend above plot -->
  <text x="75" y="88" font-size="12" font-weight="bold" fill="#1a1a1a">Сумарний ККД, %</text>

  <!-- Legend Item 1 -->
  <line x1="205" y1="84" x2="220" y2="84" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="212.5" cy="84" r="4" fill="#27ae60"/>
  <text x="226" y="88" font-size="12" font-weight="bold" fill="#27ae60">η = 95%</text>

  <!-- Legend Item 2 -->
  <line x1="295" y1="84" x2="310" y2="84" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="302.5" cy="84" r="4" fill="#2457d6"/>
  <text x="316" y="88" font-size="12" font-weight="bold" fill="#2457d6">η = 90%</text>

  <!-- Legend Item 3 -->
  <line x1="385" y1="84" x2="400" y2="84" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="392.5" cy="84" r="4" fill="#c0392b"/>
  <text x="406" y="88" font-size="12" font-weight="bold" fill="#c0392b">η = 80%</text>

  <!-- Horizontal Gridlines -->
  <line x1="75" y1="110" x2="445" y2="110" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="75" y1="160" x2="445" y2="160" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="75" y1="210" x2="445" y2="210" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="75" y1="235" x2="445" y2="235" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5,4"/>
  <line x1="75" y1="260" x2="445" y2="260" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="75" y1="310" x2="445" y2="310" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Vertical Gridlines -->
  <line x1="120" y1="110" x2="120" y2="360" stroke="#f0f2f5" stroke-width="1"/>
  <line x1="185" y1="110" x2="185" y2="360" stroke="#f0f2f5" stroke-width="1"/>
  <line x1="250" y1="110" x2="250" y2="360" stroke="#f0f2f5" stroke-width="1"/>
  <line x1="315" y1="110" x2="315" y2="360" stroke="#f0f2f5" stroke-width="1"/>
  <line x1="380" y1="110" x2="380" y2="360" stroke="#f0f2f5" stroke-width="1"/>
  <line x1="445" y1="110" x2="445" y2="360" stroke="#f0f2f5" stroke-width="1"/>

  <!-- Axes -->
  <line x1="75" y1="110" x2="75" y2="360" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="75" y1="360" x2="445" y2="360" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Y tick labels -->
  <text x="62" y="114" font-size="12" text-anchor="end" fill="#6b7280">100%</text>
  <text x="62" y="164" font-size="12" text-anchor="end" fill="#6b7280">80%</text>
  <text x="62" y="214" font-size="12" text-anchor="end" fill="#6b7280">60%</text>
  <text x="62" y="239" font-size="12" text-anchor="end" font-weight="bold" fill="#c0392b">50%</text>
  <text x="62" y="264" font-size="12" text-anchor="end" fill="#6b7280">40%</text>
  <text x="62" y="314" font-size="12" text-anchor="end" fill="#6b7280">20%</text>
  <text x="62" y="364" font-size="12" text-anchor="end" fill="#6b7280">0%</text>

  <!-- X tick labels -->
  <text x="120" y="385" font-size="12" text-anchor="middle" fill="#1a1a1a">1</text>
  <text x="185" y="385" font-size="12" text-anchor="middle" fill="#1a1a1a">2</text>
  <text x="250" y="385" font-size="12" text-anchor="middle" fill="#1a1a1a">3</text>
  <text x="315" y="385" font-size="12" text-anchor="middle" fill="#1a1a1a">4</text>
  <text x="380" y="385" font-size="12" text-anchor="middle" fill="#1a1a1a">5</text>
  <text x="445" y="385" font-size="12" text-anchor="middle" fill="#1a1a1a">6</text>

  <!-- X axis title -->
  <text x="282" y="412" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Кількість ступенів редуктора (N)</text>

  <!-- Curve 1: High Quality (95%) -->
  <polyline points="120,122.5 185,135 250,145 315,157.5 380,167.5 445,175" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="120" cy="122.5" r="4.5" fill="#27ae60"/>
  <circle cx="185" cy="135" r="4.5" fill="#27ae60"/>
  <circle cx="250" cy="145" r="4.5" fill="#27ae60"/>
  <circle cx="315" cy="157.5" r="4.5" fill="#27ae60"/>
  <circle cx="380" cy="167.5" r="4.5" fill="#27ae60"/>
  <circle cx="445" cy="175" r="4.5" fill="#27ae60"/>
  <text x="458" y="179" font-size="12" font-weight="bold" fill="#27ae60">74%</text>

  <!-- Curve 2: Typical (90%) -->
  <polyline points="120,135 185,157.5 250,177.5 315,195 380,212.5 445,227.5" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="120" cy="135" r="4.5" fill="#2457d6"/>
  <circle cx="185" cy="157.5" r="4.5" fill="#2457d6"/>
  <circle cx="250" cy="177.5" r="4.5" fill="#2457d6"/>
  <circle cx="315" cy="195" r="4.5" fill="#2457d6"/>
  <circle cx="380" cy="212.5" r="4.5" fill="#2457d6"/>
  <circle cx="445" cy="227.5" r="4.5" fill="#2457d6"/>
  <text x="458" y="231" font-size="12" font-weight="bold" fill="#2457d6">53%</text>

  <!-- Curve 3: Budget (80%) -->
  <polyline points="120,160 185,200 250,232.5 315,257.5 380,277.5 445,295" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="120" cy="160" r="4.5" fill="#c0392b"/>
  <circle cx="185" cy="200" r="4.5" fill="#c0392b"/>
  <circle cx="250" cy="232.5" r="4.5" fill="#c0392b"/>
  <circle cx="315" cy="257.5" r="4.5" fill="#c0392b"/>
  <circle cx="380" cy="277.5" r="4.5" fill="#c0392b"/>
  <circle cx="445" cy="295" r="4.5" fill="#c0392b"/>
  <text x="458" y="299" font-size="12" font-weight="bold" fill="#c0392b">26%</text>

  <!-- CARD 1: Formula -->
  <rect x="520" y="75" width="415" height="110" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="536" y="96" font-size="13" font-weight="bold" fill="#1a1a1a">Формула сумарного ККД редуктора</text>
  <rect x="536" y="104" width="383" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="727" y="125" font-size="14" font-weight="bold" text-anchor="middle" fill="#2457d6">η_total = (η_stage)ᴺ</text>
  <text x="536" y="153" font-size="12" fill="#1a1a1a">Втрати на тертя в кожному зачепленні перемножуються.</text>
  <text x="536" y="171" font-size="12" fill="#6b7280">Що нижча якість виготовлення, то крутіший спад кривої.</text>

  <!-- CARD 2: Conclusion -->
  <rect x="520" y="199" width="415" height="112" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="536" y="220" font-size="13" font-weight="bold" fill="#c0392b">Висновок: критичне падіння ККД</text>
  <text x="536" y="240" font-size="12" fill="#1a1a1a">• 4–6 ступенів у бюджетних серіях (η_ст = 80%)</text>
  <text x="536" y="257" font-size="12" fill="#1a1a1a">  обвалюють ККД до 26–33% (втрати понад 70%).</text>
  <text x="536" y="276" font-size="12" fill="#1a1a1a">• Лінія 50%: нижче неї більшість потужності мотора</text>
  <text x="536" y="293" font-size="12" fill="#1a1a1a">  йде в тепло тертя, спричиняючи швидкий знос зубів.</text>

  <!-- CARD 3: Engineering Advice -->
  <rect x="520" y="325" width="415" height="108" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="536" y="346" font-size="13" font-weight="bold" fill="#27ae60">Інженерні рекомендації</text>
  <text x="536" y="366" font-size="12" fill="#1a1a1a">• Добір мастила: синтетика зменшує тертя ковзання</text>
  <text x="536" y="383" font-size="12" fill="#1a1a1a">  і захищає зачеплення за високих обертів мотора.</text>
  <text x="536" y="402" font-size="12" fill="#1a1a1a">• Оптимізація міжосьових відстаней запобігає</text>
  <text x="536" y="419" font-size="12" fill="#1a1a1a">  заклинюванню зубців і розвантажує втулки валів.</text>
</svg>
