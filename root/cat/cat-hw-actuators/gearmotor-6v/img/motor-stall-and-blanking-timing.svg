<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="36" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Осцилограма струму двигуна: пуск, бланкування та детекція заклинювання</text>
  <text x="480" y="56" font-size="13" text-anchor="middle" fill="#6b7280">Маскування пускового сплеску усуває хибні спрацьовування, а інтегратор надійно виявляє stall</text>

  <!-- Легенда графіка -->
  <line x1="120" y1="78" x2="150" y2="78" stroke="#2457d6" stroke-width="2.5"/>
  <text x="158" y="82" font-size="12" fill="#1a1a1a">Миттєвий струм I(t)</text>

  <line x1="340" y1="78" x2="370" y2="78" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="5 3"/>
  <text x="378" y="82" font-size="12" fill="#1a1a1a">Фільтрований струм Ifilt (БІХ / I²t)</text>

  <line x1="670" y1="78" x2="700" y2="78" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="708" y="82" font-size="12" fill="#1a1a1a">Поріг аварії Itrip (600 мА)</text>

  <!-- Фонове виділення зон осцилограми -->
  <rect x="115" y="105" width="112" height="270" fill="#eaf0fd" fill-opacity="0.45"/>
  <rect x="535" y="105" width="140" height="270" fill="#fdecea" fill-opacity="0.4"/>

  <!-- Горизонтальні лінії сітки -->
  <line x1="105" y1="150" x2="840" y2="150" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="105" y1="195" x2="840" y2="195" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="105" y1="285" x2="840" y2="285" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="105" y1="330" x2="840" y2="330" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- Червона порогова лінія Itrip = 600 мА -->
  <line x1="105" y1="240" x2="840" y2="240" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Вертикальні роздільники фаз та сітка -->
  <line x1="227" y1="105" x2="227" y2="375" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="255" y1="105" x2="255" y2="375" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="395" y1="105" x2="395" y2="375" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2 4"/>
  <line x1="535" y1="105" x2="535" y2="375" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="675" y1="105" x2="675" y2="375" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="815" y1="105" x2="815" y2="375" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2 4"/>

  <!-- Криві струмів -->
  <path d="M 115.0,375.0 L 117.8,296.2 L 122.0,195.0 L 126.2,138.8 L 129.0,127.5 L 133.2,143.2 L 140.2,195.0 L 150.0,244.5 L 164.0,282.8 L 185.0,309.8 L 206.0,323.2 L 227.0,328.9 L 232.6,327.8 L 238.2,334.4 L 243.8,322.0 L 249.4,333.3 L 255.0,326.8 L 260.6,335.5 L 266.2,330.4 L 271.8,328.0 L 277.4,329.8 L 283.0,324.8 L 288.6,336.5 L 294.2,327.3 L 299.8,336.2 L 305.4,323.9 L 311.0,330.5 L 316.6,327.8 L 322.2,331.6 L 327.8,334.7 L 333.4,326.7 L 339.0,332.7 L 344.6,322.2 L 350.2,335.1 L 355.8,327.7 L 361.4,335.7 L 367.0,328.1 L 372.6,327.5 L 378.2,329.7 L 383.8,327.0 L 389.4,337.2 L 395.0,326.7 L 400.6,334.6 L 406.2,322.6 L 411.8,331.9 L 417.4,328.9 L 423.0,333.0 L 428.6,333.0 L 434.2,325.6 L 439.8,331.7 L 445.4,323.5 L 451.0,336.9 L 456.6,327.7 L 462.2,334.9 L 467.8,325.8 L 473.4,328.1 L 479.0,330.4 L 484.6,329.1 L 490.2,336.8 L 495.8,325.4 L 501.4,333.3 L 507.0,322.5 L 512.6,334.0 L 518.2,329.5 L 523.8,333.4 L 529.4,330.7 L 535.0,325.0 L 540.6,331.8 L 535.0,330.0 L 539.2,303.0 L 546.2,253.5 L 554.6,213.0 L 565.8,186.0 L 577.0,174.8 L 591.0,170.2 L 598.0,171.4 L 605.0,170.8 L 612.0,174.3 L 619.0,173.4 L 626.0,170.3 L 633.0,172.5 L 640.0,174.7 L 647.0,171.6 L 654.0,170.7 L 661.0,174.2 L 668.0,173.6 L 675.0,170.3 L 675.0,172.5 L 676.4,262.5 L 679.2,341.2 L 682.0,375.0 L 815.0,375.0" fill="none" stroke="#2457d6" stroke-width="2.2"/>
  <path d="M 115.0,375.0 L 129.0,334.5 L 150.0,298.5 L 171.0,294.0 L 199.0,314.2 L 227.0,327.8 L 255.0,330.0 L 535.0,330.0 L 535.0,330.0 L 549.0,317.2 L 563.0,305.4 L 577.0,294.6 L 591.0,284.7 L 605.0,275.6 L 619.0,267.2 L 633.0,259.5 L 647.0,252.5 L 661.0,246.0 L 675.0,240.0 L 696.0,307.5 L 724.0,352.5 L 752.0,370.5 L 773.0,375.0 L 815.0,375.0" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="6 3"/>

  <!-- Точки-маркери -->
  <circle cx="129" cy="127.5" r="4" fill="#2457d6"/>
  <circle cx="675" cy="240" r="5" fill="#c0392b" stroke="white" stroke-width="2"/>

  <!-- Написи та винесення всередині графіка -->
  <!-- Зона бланкування -->
  <text x="171" y="96" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">tblanking = 80 мс</text>

  <!-- Пусковий пік -->
  <text x="140" y="146" font-size="12" font-weight="bold" fill="#2457d6">Inrush peak (1100 мА)</text>
  <text x="140" y="162" font-size="12" fill="#6b7280">Захист замасковано</text>

  <!-- Штатний режим -->
  <text x="380" y="278" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Штатний хід: Inom ≈ 200 мА</text>
  <text x="380" y="296" font-size="12" fill="#6b7280" text-anchor="middle">Комутаційний шум щіток відфільтровано</text>

  <!-- Блокування вала -->
  <text x="535" y="100" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Блокування вала (Stall)</text>

  <!-- Інтервал затримки фільтра t_filter -->
  <line x1="535" y1="120" x2="675" y2="120" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="535" y1="116" x2="535" y2="124" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="675" y1="116" x2="675" y2="124" stroke="#c0392b" stroke-width="1.5"/>
  <text x="605" y="114" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">tfilter = 100 мс</text>

  <!-- Струм заклинювання -->
  <text x="605" y="215" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Istall ≈ 900 мА</text>

  <!-- Картка аварійного вимкнення FAULT -->
  <rect x="692" y="130" width="156" height="58" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="770" y="148" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">АВАРІЙНИЙ СТОП</text>
  <text x="770" y="164" font-size="12" fill="#1a1a1a" text-anchor="middle">FAULT Shutdown</text>
  <text x="770" y="178" font-size="12" fill="#6b7280" text-anchor="middle">H-міст → High-Z (0 мА)</text>
  <line x1="710" y1="188" x2="682" y2="232" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Поріг Itrip підпис над лінією -->
  <text x="525" y="234" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">Поріг Itrip = 600 мА</text>

  <!-- Осі координат -->
  <line x1="105" y1="105" x2="105" y2="375" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="105" y1="375" x2="850" y2="375" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Підпис осей -->
  <text x="96" y="95" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">I (мА)</text>
  <text x="860" y="379" font-size="12" font-weight="bold" fill="#1a1a1a">Час t (мс)</text>

  <!-- Засічки і підписи осі Y -->
  <line x1="100" y1="105" x2="105" y2="105" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="96" y="109" font-size="12" fill="#6b7280" text-anchor="end">1200</text>

  <line x1="100" y1="150" x2="105" y2="150" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="96" y="154" font-size="12" fill="#6b7280" text-anchor="end">1000</text>

  <line x1="100" y1="195" x2="105" y2="195" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="96" y="199" font-size="12" fill="#6b7280" text-anchor="end">800</text>

  <line x1="100" y1="240" x2="105" y2="240" stroke="#c0392b" stroke-width="1.5"/>
  <text x="96" y="244" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">600</text>

  <line x1="100" y1="285" x2="105" y2="285" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="96" y="289" font-size="12" fill="#6b7280" text-anchor="end">400</text>

  <line x1="100" y1="330" x2="105" y2="330" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="96" y="334" font-size="12" fill="#6b7280" text-anchor="end">200</text>

  <line x1="100" y1="375" x2="105" y2="375" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="96" y="379" font-size="12" fill="#6b7280" text-anchor="end">0</text>

  <!-- Засічки і підписи осі X -->
  <line x1="115" y1="375" x2="115" y2="380" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="115" y="394" font-size="12" fill="#6b7280" text-anchor="middle">0</text>

  <line x1="255" y1="375" x2="255" y2="380" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="255" y="394" font-size="12" fill="#6b7280" text-anchor="middle">100</text>

  <line x1="395" y1="375" x2="395" y2="380" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="395" y="394" font-size="12" fill="#6b7280" text-anchor="middle">200</text>

  <line x1="535" y1="375" x2="535" y2="380" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="535" y="394" font-size="12" fill="#6b7280" text-anchor="middle">300</text>

  <line x1="675" y1="375" x2="675" y2="380" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="675" y="394" font-size="12" fill="#6b7280" text-anchor="middle">400</text>

  <line x1="815" y1="375" x2="815" y2="380" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="815" y="394" font-size="12" fill="#6b7280" text-anchor="middle">500</text>

  <!-- Статусна панель станів драйвера -->
  <text x="100" y="434" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="end">Стан:</text>

  <rect x="115" y="412" width="112" height="36" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="171" y="426" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Бланкування</text>
  <text x="171" y="440" font-size="12" fill="#6b7280" text-anchor="middle">Захист вимкнено</text>

  <rect x="239" y="412" width="284" height="36" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="381" y="426" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Штатний рух (Норма)</text>
  <text x="381" y="440" font-size="12" fill="#6b7280" text-anchor="middle">ШІМ-регулювання, шум щіток ~200 мА</text>

  <rect x="535" y="412" width="128" height="36" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="599" y="426" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Блокування вала</text>
  <text x="599" y="440" font-size="12" fill="#6b7280" text-anchor="middle">Фільтрація tfilter</text>

  <rect x="675" y="412" width="140" height="36" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="745" y="426" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Аварійний STOP</text>
  <text x="745" y="440" font-size="12" fill="#6b7280" text-anchor="middle">Міст у High-Z / 0 мА</text>

  <!-- Підсумкові інженерні картки -->
  <rect x="40" y="462" width="280" height="56" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="52" y="482" font-size="12" font-weight="bold" fill="#2457d6">1. Пусковий сплеск (Inrush)</text>
  <text x="52" y="502" font-size="12" fill="#1a1a1a">Ipeak сягає 1100 мА; tblanking = 80 мс</text>

  <rect x="340" y="462" width="280" height="56" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="352" y="482" font-size="12" font-weight="bold" fill="#27ae60">2. Комутаційний шум щіток</text>
  <text x="352" y="502" font-size="12" fill="#1a1a1a">Пульсації ±25 мА навколо Inom = 200 мА</text>

  <rect x="640" y="462" width="280" height="56" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="652" y="482" font-size="12" font-weight="bold" fill="#c0392b">3. Заклинювання (Stall) і FAULT</text>
  <text x="652" y="502" font-size="12" fill="#1a1a1a">Ifilt &gt; Itrip понад tfilter → STOP моста</text>
</svg>
