  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Комутаційні перенапруги та придушення завад колектора триконденсаторним фільтром</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Порівняння форми напруги на клемі мотора: індуктивні викиди до 30–50 В без захисту проти згладженого ШІМ із фільтром</text>
