<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Canvas background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Динаміка струму приводів: порівняння 100 об/хв та 600 об/хв</text>
  <text x="480" y="58" font-size="13" text-anchor="middle" fill="#6b7280">Осцилограми струму I(t) на різних режимах: пуск, горизонтальний рух, підйом 15° та аварійний stall</text>

  <!-- Phase Header Cards -->
  <rect x="90" y="74" width="154" height="24" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="167" y="90" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Фаза 1: Пуск</text>

  <rect x="256" y="74" width="228" height="24" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="370" y="90" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Фаза 2: Горизонталь</text>

  <rect x="496" y="74" width="228" height="24" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="610" y="90" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Фаза 3: Підйом 15°</text>

  <rect x="736" y="74" width="154" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="813" y="90" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">Фаза 4: Заклинювання</text>

  <!-- Chart Backgrounds per Phase -->
  <rect x="90" y="110" width="160" height="240" fill="#f8fafc"/>
  <rect x="250" y="110" width="240" height="240" fill="#ffffff"/>
  <rect x="490" y="110" width="240" height="240" fill="#f8fafc"/>
  <rect x="730" y="110" width="160" height="240" fill="#fdf5f5"/>

  <!-- Stall Overcurrent Window Highlight (100 ms) -->
  <rect x="731" y="134" width="10" height="96" fill="#c0392b" fill-opacity="0.12"/>

  <!-- Chart Outer Border -->
  <rect x="90" y="110" width="800" height="240" fill="none" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Phase Vertical Dividers -->
  <line x1="250" y1="110" x2="250" y2="350" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="490" y1="110" x2="490" y2="350" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="730" y1="110" x2="730" y2="350" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Safety Threshold Line: 1.0 A -->
  <line x1="90" y1="230" x2="890" y2="230" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- X-Axis Baseline: 0.0 A -->
  <line x1="90" y1="350" x2="890" y2="350" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Y-Axis Ticks -->
  <line x1="84" y1="110" x2="90" y2="110" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="84" y1="158" x2="90" y2="158" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="84" y1="206" x2="90" y2="206" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="84" y1="230" x2="90" y2="230" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="84" y1="254" x2="90" y2="254" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="84" y1="302" x2="90" y2="302" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="84" y1="350" x2="90" y2="350" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Y-Axis Labels -->
  <text x="80" y="92" font-size="12" font-weight="bold" text-anchor="end" fill="#1a1a1a">I, А</text>
  <text x="80" y="114" font-size="12" text-anchor="end" fill="#6b7280">2.0</text>
  <text x="80" y="162" font-size="12" text-anchor="end" fill="#6b7280">1.6</text>
  <text x="80" y="210" font-size="12" text-anchor="end" fill="#6b7280">1.2</text>
  <text x="80" y="234" font-size="12" font-weight="bold" text-anchor="end" fill="#c0392b">1.0</text>
  <text x="80" y="258" font-size="12" text-anchor="end" fill="#6b7280">0.8</text>
  <text x="80" y="306" font-size="12" text-anchor="end" fill="#6b7280">0.4</text>
  <text x="80" y="354" font-size="12" text-anchor="end" fill="#6b7280">0.0</text>

  <!-- X-Axis Ticks -->
  <line x1="90" y1="350" x2="90" y2="355" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="170" y1="350" x2="170" y2="355" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="250" y1="350" x2="250" y2="355" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="330" y1="350" x2="330" y2="355" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="410" y1="350" x2="410" y2="355" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="490" y1="350" x2="490" y2="355" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="570" y1="350" x2="570" y2="355" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="650" y1="350" x2="650" y2="355" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="730" y1="350" x2="730" y2="355" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="810" y1="350" x2="810" y2="355" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="890" y1="350" x2="890" y2="355" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Time Labels -->
  <text x="90" y="368" font-size="12" text-anchor="middle" fill="#6b7280">0</text>
  <text x="170" y="368" font-size="12" text-anchor="middle" fill="#6b7280">1</text>
  <text x="250" y="368" font-size="12" text-anchor="middle" fill="#6b7280">2</text>
  <text x="330" y="368" font-size="12" text-anchor="middle" fill="#6b7280">3</text>
  <text x="410" y="368" font-size="12" text-anchor="middle" fill="#6b7280">4</text>
  <text x="490" y="368" font-size="12" text-anchor="middle" fill="#6b7280">5</text>
  <text x="570" y="368" font-size="12" text-anchor="middle" fill="#6b7280">6</text>
  <text x="650" y="368" font-size="12" text-anchor="middle" fill="#6b7280">7</text>
  <text x="730" y="368" font-size="12" text-anchor="middle" fill="#6b7280">8</text>
  <text x="810" y="368" font-size="12" text-anchor="middle" fill="#6b7280">9</text>
  <text x="890" y="368" font-size="12" text-anchor="middle" fill="#6b7280">10 с</text>

  <!-- X-Axis Title -->
  <text x="490" y="388" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Час t, секунди (хронологія навантажувальних режимів)</text>

  <!-- Threshold Label (Phase 1) -->
  <text x="115" y="222" font-size="12" font-weight="bold" fill="#c0392b">Поріг Iпор = 1.0 А</text>

  <!-- Phase 1: Annotations -->
  <text x="115" y="142" font-size="12" font-weight="bold" fill="#1a1a1a">Пусковий пік:</text>
  <text x="115" y="158" font-size="12" fill="#6b7280">1.5–1.7 А (~40 мс)</text>
  <text x="115" y="174" font-size="12" fill="#6b7280">заряд і розгін ротора</text>
  <line x1="112" y1="146" x2="96" y2="148" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Phase 2: Annotations -->
  <text x="268" y="142" font-size="12" font-weight="bold" fill="#1a1a1a">Горизонтальний рух:</text>
  <text x="268" y="162" font-size="12" font-weight="bold" fill="#2457d6">600 об/хв: ~250 мА</text>
  <text x="268" y="178" font-size="12" fill="#6b7280">високі оберти, пульсації щіток</text>
  <text x="268" y="198" font-size="12" font-weight="bold" fill="#27ae60">100 об/хв: ~150 мА</text>
  <text x="268" y="214" font-size="12" fill="#6b7280">плавний хід, високий ККД</text>

  <!-- Phase 3: Annotations -->
  <text x="508" y="142" font-size="12" font-weight="bold" fill="#1a1a1a">Підйом на ухил 15°:</text>
  <text x="508" y="162" font-size="12" font-weight="bold" fill="#2457d6">600 об/хв: стрибок до ~900 мА</text>
  <text x="508" y="178" font-size="12" fill="#6b7280">брак моменту, нагрів мотора</text>
  <text x="508" y="198" font-size="12" font-weight="bold" fill="#27ae60">100 об/хв: сталі ~420 мА</text>
  <text x="508" y="214" font-size="12" fill="#6b7280">запас тяги редуктора 1:120</text>
  <text x="508" y="274" font-size="12" fill="#c0392b">небезпечна зона: ~90% від Iпор</text>

  <!-- Phase 4: Protection Callout Panel -->
  <rect x="746" y="134" width="138" height="74" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="815" y="152" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">Аварійний Stall</text>
  <text x="815" y="169" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">пік до 1.8 А &gt; Iпор</text>
  <text x="815" y="186" font-size="12" text-anchor="middle" fill="#6b7280">відсічка за 100 мс</text>
  <text x="815" y="201" font-size="12" text-anchor="middle" fill="#27ae60">захист шестерень</text>

  <line x1="760" y1="222" x2="746" y2="228" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <text x="815" y="278" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">I = 0.0 А (відсічка)</text>
  <text x="815" y="296" font-size="12" text-anchor="middle" fill="#6b7280">живлення вимкнено</text>
  <text x="815" y="312" font-size="12" text-anchor="middle" fill="#6b7280">зубці редуктора цілі</text>

  <!-- Curve: 100 rpm (Green) -->
  <path d="M 90,350 
           C 91,300 92,190 93.5,164 
           C 95,175 98,270 108,322 
           C 118,332 125,332 135,332 
           L 250,332 
           L 490,332 
           C 500,332 510,300 525,300 
           L 730,300 
           L 732,152 
           L 740,152 
           L 743,350 
           L 890,350" 
        fill="none" stroke="#27ae60" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Curve: 600 rpm (Blue) -->
  <path d="M 90,350 
           C 91,280 92,170 93.5,146 
           C 95,160 98,250 108,308 
           C 118,318 125,320 135,320 
           Q 150,318 165,321 Q 180,318 195,322 Q 210,319 225,321 Q 240,318 250,320 
           Q 270,318 290,322 Q 310,318 330,322 Q 350,318 370,322 Q 390,318 410,322 Q 430,318 450,322 Q 470,318 490,320 
           C 502,320 514,242 530,242 
           Q 550,240 570,244 Q 590,239 610,244 Q 630,240 650,244 Q 670,239 690,244 Q 710,240 730,242 
           L 732,134 
           L 740,134 
           L 743,348 
           L 890,348" 
        fill="none" stroke="#2457d6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Key event points -->
  <circle cx="93.5" cy="164" r="3" fill="#27ae60"/>
  <circle cx="93.5" cy="146" r="3" fill="#2457d6"/>
  <circle cx="732" cy="152" r="3" fill="#27ae60"/>
  <circle cx="732" cy="134" r="3" fill="#2457d6"/>
  <circle cx="731" cy="230" r="3.5" fill="#c0392b"/>
  <circle cx="741" cy="230" r="3" fill="#c0392b"/>

  <!-- Bottom Legend Panel -->
  <rect x="90" y="410" width="800" height="46" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  
  <line x1="105" y1="433" x2="135" y2="433" stroke="#27ae60" stroke-width="3"/>
  <circle cx="120" cy="433" r="3" fill="#27ae60"/>
  <text x="142" y="437" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#27ae60">100 об/хв:</tspan> редуктор 1:120 (висока тяга)</text>

  <line x1="390" y1="433" x2="420" y2="433" stroke="#2457d6" stroke-width="3"/>
  <circle cx="405" cy="433" r="3" fill="#2457d6"/>
  <text x="428" y="437" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#2457d6">600 об/хв:</tspan> редуктор 1:20 (висока швидкість)</text>

  <line x1="680" y1="433" x2="710" y2="433" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="718" y="437" font-size="12" font-weight="bold" fill="#c0392b">Поріг захисту (1.0 А)</text>
</svg>
