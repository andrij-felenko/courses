<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка на все полотно -->
  <rect width="960" height="460" fill="white"/>

  <defs>
    <!-- Маркери стрілок для осей -->
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Стрибок напруги живлення (voltage pumping) під час гальмування</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Буферний конденсатор 470 мкФ поглинає енергію рекуперації та запобігає пробою драйвера</text>

  <!-- ================= ЛІВА ЧАСТИНА: ОСЦИЛОГРАМА ================= -->
  <!-- Фонова панель осцилограми -->
  <rect x="35" y="75" width="540" height="252" rx="6" fill="#fcfdfe" stroke="#d0d7de" stroke-width="1"/>

  <!-- Горизонтальні лінії рівнів напруги -->
  <!-- Рівень 14 В (піковий орієнтир перенапруги) -->
  <line x1="90" y1="108" x2="550" y2="108" stroke="#f0f2f5" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="82" y="112" font-size="12" fill="#6b7280" text-anchor="end">14 В</text>

  <!-- Рівень 11.0 В (Abs Max драйвера) -->
  <line x1="90" y1="152" x2="550" y2="152" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="6,4"/>
  <text x="82" y="156" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">11 В</text>
  <text x="545" y="139" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">Abs Max = 11.0 В (поріг пробою IC)</text>

  <!-- Рівень 7.0 В (безпечний робочий запас) -->
  <line x1="90" y1="206" x2="550" y2="206" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,4" stroke-opacity="0.85"/>
  <text x="82" y="210" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">7 В</text>
  <text x="545" y="193" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">7.0 В — безпечний робочий запас</text>

  <!-- Рівень 6.0 В (V_nom — робоча напруга живлення) -->
  <line x1="90" y1="246" x2="550" y2="246" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="82" y="250" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">6 В</text>
  <text x="96" y="231" font-size="12" font-weight="bold" fill="#1a1a1a">V_nom = 6.0 В</text>

  <!-- Рівень 0 В (GND) -->
  <text x="82" y="304" font-size="12" fill="#6b7280" text-anchor="end">0 В (GND)</text>

  <!-- Вертикальна лінія моменту гальмування t_brake -->
  <line x1="195" y1="100" x2="195" y2="300" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="195" y="88" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">t_brake</text>

  <!-- Осцилограма 1: Небезпечний випадок (C = 10 мкФ, лінія кольору #c0392b) -->
  <path d="M 90,246 L 195,246 C 205,240 215,115 225,108 C 235,104 245,160 255,185 C 265,210 275,236 290,244 C 305,246 325,246 345,246 L 550,246" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="225" cy="108" r="3.5" fill="#c0392b"/>
  <text x="240" y="92" font-size="12" font-weight="bold" fill="#c0392b">C = 10 мкФ: стрибок до 13.8 В (пробій!)</text>

  <!-- Осцилограма 2: Безпечний випадок (C = 470 мкФ, лінія кольору #27ae60) -->
  <path d="M 90,246 L 195,246 C 215,246 235,211 255,211 C 275,211 300,246 340,246 L 550,246" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="255" cy="211" r="3.5" fill="#27ae60"/>
  <text x="235" y="271" font-size="12" font-weight="bold" fill="#27ae60">C = 470 мкФ: плавний підйом до 6.9 В (безпечно)</text>

  <!-- Осі координат -->
  <!-- Вісь V_bus (вертикальна) -->
  <line x1="90" y1="300" x2="90" y2="98" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="90" y="82" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">V_bus (В)</text>

  <!-- Вісь Час t (горизонтальна) -->
  <line x1="90" y1="300" x2="560" y2="300" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="560" y="324" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Час t (мс)</text>

  <!-- ================= СМУГА СТАНУ ПРИВОДУ (ЗНИЗУ ЛІВОРУЧ) ================= -->
  <text x="45" y="352" font-size="12" font-weight="bold" fill="#1a1a1a">Стан приводу та режим комутації H-моста:</text>

  <!-- Блок 1: Прямий хід -->
  <rect x="45" y="365" width="142" height="60" rx="5" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="116" y="382" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Прямий хід</text>
  <text x="116" y="399" font-size="12" fill="#6b7280" text-anchor="middle">Живлення від шини</text>
  <text x="116" y="416" font-size="12" fill="#6b7280" text-anchor="middle">V_bus = 6.0 В</text>

  <!-- Блок 2: Гальмування / Рекуперація -->
  <rect x="200" y="365" width="176" height="60" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="288" y="382" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">2. Гальмо / Реверс</text>
  <text x="288" y="399" font-size="12" fill="#c0392b" text-anchor="middle">Струм через body-діоди</text>
  <text x="288" y="416" font-size="12" fill="#6b7280" text-anchor="middle">Генераторне накачування</text>

  <!-- Блок 3: Зупинка -->
  <rect x="389" y="365" width="176" height="60" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="477" y="382" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">3. Ротор зупинено</text>
  <text x="477" y="399" font-size="12" fill="#27ae60" text-anchor="middle">Рекуперація згасла</text>
  <text x="477" y="416" font-size="12" fill="#6b7280" text-anchor="middle">V_bus стабільно 6.0 В</text>

  <!-- ================= ПРАВА ЧАСТИНА: ПОЯСНЮВАЛЬНІ КАРТКИ ================= -->
  <!-- Картка 1: Причина явища -->
  <rect x="600" y="75" width="335" height="106" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <text x="615" y="96" font-size="13" font-weight="bold" fill="#2457d6">1. Фізична причина явища</text>
  <text x="615" y="116" font-size="12" fill="#1a1a1a">Кінетична енергія ротора перетворюється</text>
  <text x="615" y="133" font-size="12" fill="#1a1a1a">на електричну (Back-EMF генератор):</text>
  <rect x="615" y="143" width="305" height="26" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="767" y="160" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ΔE = ½ · C · (V_peak² − V_nom²)</text>

  <!-- Картка 2: Небезпека малої ємності -->
  <rect x="600" y="194" width="335" height="106" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="615" y="214" font-size="13" font-weight="bold" fill="#c0392b">2. Наслідки малої ємності (10 мкФ)</text>
  <text x="615" y="233" font-size="12" fill="#1a1a1a">• Перенапруга (voltage pumping) &gt; 13.8 В</text>
  <text x="615" y="251" font-size="12" fill="#1a1a1a">• Перевищення Abs Max драйвера (11.0 В)</text>
  <text x="615" y="269" font-size="12" fill="#1a1a1a">• Пробій MOSFET H-моста або скидання MCU</text>
  <text x="615" y="287" font-size="12" font-weight="bold" fill="#c0392b">• Спрацьовування захисту OVP драйвера</text>

  <!-- Картка 3: Вирішення -->
  <rect x="600" y="313" width="335" height="112" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="615" y="333" font-size="13" font-weight="bold" fill="#27ae60">3. Схемотехнічне вирішення</text>
  <text x="615" y="353" font-size="12" font-weight="bold" fill="#1a1a1a">• Буферний Low-ESR електроліт 470 мкФ</text>
  <text x="615" y="371" font-size="12" fill="#1a1a1a">• Кераміка 0.1 мкФ біля самих виводів IC</text>
  <text x="615" y="389" font-size="12" fill="#1a1a1a">• Підйом лише до ~6.9 В (&lt; 7.0 В)</text>
  <text x="615" y="407" font-size="12" font-weight="bold" fill="#27ae60">• Гарантований запас надійності драйвера</text>
</svg>
