<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Main Header -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Топологія заземлення: земляна петля проти схеми «Зірка» (Star GND)</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Розділення силового контуру мотора та логіки мікроконтролера для запобігання апаратним збоям</text>

  <!-- ==================== LEFT PANEL: WRONG (DAISY-CHAIN) ==================== -->
  <rect x="24" y="72" width="448" height="388" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="248" y="98" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">⛔ Помилка: Шлейфова земля (Daisy-Chain)</text>

  <!-- Source Box -->
  <rect x="36" y="122" width="60" height="82" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="66" y="152" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Джерело</text>
  <text x="66" y="172" font-size="12" fill="#6b7280" text-anchor="middle">АКБ 6 В</text>

  <!-- MCU Box -->
  <rect x="196" y="122" width="80" height="82" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="236" y="152" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">MCU</text>
  <text x="236" y="172" font-size="12" fill="#6b7280" text-anchor="middle">(Логіка)</text>

  <!-- H-Bridge Box -->
  <rect x="360" y="122" width="56" height="82" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="388" y="152" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">H-міст</text>
  <text x="388" y="172" font-size="12" fill="#6b7280" text-anchor="middle">Драйвер</text>

  <!-- Motor -->
  <circle cx="446" cy="163" r="16" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="446" y="168" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">M</text>
  <text x="446" y="196" font-size="12" fill="#6b7280" text-anchor="middle">Мотор</text>
  <line x1="416" y1="156" x2="430" y2="156" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="416" y1="170" x2="430" y2="170" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Left Power Rails (+6V) -->
  <line x1="96" y1="140" x2="196" y2="140" stroke="#c0392b" stroke-width="2"/>
  <text x="146" y="133" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+6V</text>
  <line x1="276" y1="140" x2="360" y2="140" stroke="#c0392b" stroke-width="2"/>
  <text x="318" y="133" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+6V</text>

  <!-- Left Control Signal (PWM) -->
  <line x1="276" y1="175" x2="352" y2="175" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="318" y="169" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ШІМ</text>

  <!-- Left Ground Line (Daisy Chain) -->
  <line x1="96" y1="186" x2="114" y2="186" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="114" y1="186" x2="114" y2="236" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="114" y1="236" x2="146" y2="236" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Parasitic Resistor R_gnd -->
  <rect x="146" y="230" width="24" height="12" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="158" y="224" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">R_gnd</text>
  <!-- Line from resistor to MCU GND -->
  <line x1="170" y1="236" x2="236" y2="236" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="236" y1="204" x2="236" y2="236" stroke="#c0392b" stroke-width="2"/>
  <circle cx="236" cy="236" r="3.5" fill="#c0392b"/>
  <!-- Continuing Ground trace to H-Bridge -->
  <line x1="236" y1="236" x2="388" y2="236" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="388" y1="204" x2="388" y2="236" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="388" cy="236" r="3.5" fill="#1a1a1a"/>

  <!-- Left Pulsed Current Arrow -->
  <line x1="210" y1="254" x2="124" y2="254" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="167" y="272" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">I_пік до 1.5 А</text>
  <text x="167" y="288" font-size="12" fill="#c0392b" text-anchor="middle">Імпульсний зворотний струм</text>

  <!-- Left Ground Bounce Callout -->
  <line x1="240" y1="240" x2="252" y2="250" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <rect x="254" y="246" width="112" height="58" rx="6" fill="white" stroke="#c0392b" stroke-width="1.5"/>
  <text x="310" y="264" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">ΔV = I · R_gnd</text>
  <text x="310" y="280" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Ground Bounce</text>
  <text x="310" y="296" font-size="12" fill="#c0392b" text-anchor="middle">Зсув рівня нуля</text>

  <!-- Left Bottom Summary Card -->
  <rect x="38" y="332" width="420" height="116" rx="6" fill="white" stroke="#c0392b" stroke-width="1.5"/>
  <text x="52" y="352" font-size="13" font-weight="bold" fill="#c0392b">Наслідки шлейфового заземлення:</text>
  <text x="52" y="372" font-size="12" fill="#1a1a1a">• Brownout Reset: просідання живлення перезавантажує MCU</text>
  <text x="52" y="392" font-size="12" fill="#1a1a1a">• Збої логіки: спотворення ШІМ та інтерфейсів зв'язку</text>
  <text x="52" y="412" font-size="12" fill="#1a1a1a">• Шуми сенсорів: хибні спрацьовування цифрових входів</text>
  <text x="52" y="434" font-size="12" font-weight="bold" fill="#c0392b">Причина: струм мотора зміщує нульовий потенціал MCU</text>

  <!-- ==================== RIGHT PANEL: STAR GND ==================== -->
  <rect x="488" y="72" width="448" height="388" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="712" y="98" font-size="15" font-weight="bold" fill="#27ae60" text-anchor="middle">✔ Правильно: Топологія «Зірка» (Star GND)</text>

  <!-- Source Box -->
  <rect x="500" y="122" width="60" height="82" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="530" y="152" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Джерело</text>
  <text x="530" y="172" font-size="12" fill="#6b7280" text-anchor="middle">АКБ 6 В</text>

  <!-- MCU Box -->
  <rect x="660" y="122" width="80" height="82" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="700" y="152" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">MCU</text>
  <text x="700" y="172" font-size="12" fill="#6b7280" text-anchor="middle">(Логіка)</text>

  <!-- H-Bridge Box -->
  <rect x="824" y="122" width="56" height="82" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="852" y="152" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">H-міст</text>
  <text x="852" y="172" font-size="12" fill="#6b7280" text-anchor="middle">Драйвер</text>

  <!-- Motor -->
  <circle cx="910" cy="163" r="16" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="910" y="168" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">M</text>
  <text x="910" y="196" font-size="12" fill="#6b7280" text-anchor="middle">Мотор</text>
  <line x1="880" y1="156" x2="894" y2="156" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="880" y1="170" x2="894" y2="170" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Right Motor Power Rail (V_motor) bypasses MCU -->
  <polyline points="545,122 545,110 852,110 852,122" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <text x="590" y="126" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">V_motor</text>

  <!-- Right Logic Power Rail (V_logic) -->
  <line x1="560" y1="140" x2="660" y2="140" stroke="#27ae60" stroke-width="2"/>
  <text x="590" y="156" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">V_logic</text>

  <!-- Right Control Signal (PWM) -->
  <line x1="740" y1="175" x2="816" y2="175" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="764" y="169" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ШІМ</text>

  <!-- Right Capacitors -->
  <!-- 100 nF ceramic near MCU -->
  <circle cx="635" cy="140" r="2.5" fill="#27ae60"/>
  <line x1="635" y1="140" x2="635" y2="158" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="629" y1="158" x2="641" y2="158" stroke="#27ae60" stroke-width="2"/>
  <line x1="629" y1="164" x2="641" y2="164" stroke="#27ae60" stroke-width="2"/>
  <line x1="635" y1="164" x2="635" y2="236" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="635" cy="236" r="2.5" fill="#27ae60"/>
  <text x="635" y="133" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">100 нФ</text>

  <!-- 470 uF electrolytic near H-Bridge -->
  <circle cx="798" cy="110" r="2.5" fill="#2457d6"/>
  <line x1="798" y1="110" x2="798" y2="148" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="790" y1="148" x2="806" y2="148" stroke="#2457d6" stroke-width="2"/>
  <line x1="790" y1="154" x2="806" y2="154" stroke="#2457d6" stroke-width="2"/>
  <line x1="798" y1="154" x2="798" y2="276" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="798" cy="276" r="2.5" fill="#1a1a1a"/>
  <text x="792" y="133" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">470 мкФ</text>

  <!-- Right Star Ground Topology -->
  <!-- Lead from Source (-) at (560, 186) to Star Point (570, 236) -->
  <polyline points="560,186 570,186 570,236" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="570" cy="236" r="5" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="582" y="254" font-size="12" font-weight="bold" fill="#27ae60">★ Точка Star GND</text>

  <!-- Star Branch 1: GND_logic to MCU -->
  <line x1="570" y1="236" x2="700" y2="236" stroke="#27ae60" stroke-width="2"/>
  <line x1="700" y1="236" x2="700" y2="204" stroke="#27ae60" stroke-width="2"/>
  <circle cx="700" cy="236" r="3" fill="#27ae60"/>
  <text x="664" y="230" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">GND_logic (0.0 В)</text>

  <!-- Star Branch 2: GND_power to H-Bridge -->
  <polyline points="570,236 570,276 852,276 852,204" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="852" cy="276" r="3.5" fill="#1a1a1a"/>
  <text x="730" y="270" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GND_power (силовий струм 1.5 А)</text>
  <text x="712" y="294" font-size="12" fill="#27ae60" text-anchor="middle">✔ Окремий зворотний провід не створює перешкод для MCU</text>

  <!-- Right Bottom Summary Card -->
  <rect x="502" y="332" width="420" height="116" rx="6" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <text x="516" y="352" font-size="13" font-weight="bold" fill="#27ae60">Результат схеми «Зірка» (Star GND):</text>
  <text x="516" y="372" font-size="12" fill="#1a1a1a">• Чиста земля: струм мотора оминає цифрову шину (GND = 0 В)</text>
  <text x="516" y="392" font-size="12" fill="#1a1a1a">• Стабільна логіка: надійний захист від Brownout Reset</text>
  <text x="516" y="412" font-size="12" fill="#1a1a1a">• Подвійний фільтр: 470 мкФ для мотора + 100 нФ біля MCU</text>
  <text x="516" y="434" font-size="12" font-weight="bold" fill="#27ae60">Перевага: нульовий вплив комутації мотора на мікроконтролер</text>
</svg>
