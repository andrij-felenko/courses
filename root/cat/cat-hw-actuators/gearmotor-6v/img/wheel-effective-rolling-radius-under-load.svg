<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="960" height="480" fill="white"/>

<defs>
  <!-- Markers for arrows -->
  <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
  </marker>
  <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
  </marker>
  <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
  </marker>
  <marker id="arr-green-rev" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M8,0 L0,4 L8,8 Z" fill="#27ae60"/>
  </marker>
  <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
  </marker>
  <marker id="arr-red-rev" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M8,0 L0,4 L8,8 Z" fill="#c0392b"/>
  </marker>
</defs>

<!-- Header -->
<text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Деформація протектора та динамічний радіус кочення</text>
<text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Зменшення радіуса R до R_dyn під вагою шасі: вплив на лінійну швидкість v та силу тяги F_тяг</text>

<!-- Road surface line -->
<line x1="45" y1="375" x2="530" y2="375" stroke="#1a1a1a" stroke-width="2.5"/>
<text x="50" y="367" font-size="12" font-weight="bold" fill="#6b7280">Опорна поверхня (дорога)</text>

<!-- Road ground hatching -->
<line x1="50" y1="375" x2="42" y2="383" stroke="#d0d7de" stroke-width="1.5"/>
<line x1="66" y1="375" x2="58" y2="383" stroke="#d0d7de" stroke-width="1.5"/>
<line x1="82" y1="375" x2="74" y2="383" stroke="#d0d7de" stroke-width="1.5"/>
<line x1="98" y1="375" x2="90" y2="383" stroke="#d0d7de" stroke-width="1.5"/>
<line x1="114" y1="375" x2="106" y2="383" stroke="#d0d7de" stroke-width="1.5"/>
<line x1="130" y1="375" x2="122" y2="383" stroke="#d0d7de" stroke-width="1.5"/>
<line x1="146" y1="375" x2="138" y2="383" stroke="#d0d7de" stroke-width="1.5"/>
<line x1="162" y1="375" x2="154" y2="383" stroke="#d0d7de" stroke-width="1.5"/>
<line x1="178" y1="375" x2="170" y2="383" stroke="#d0d7de" stroke-width="1.5"/>
<line x1="194" y1="375" x2="186" y2="383" stroke="#d0d7de" stroke-width="1.5"/>

<line x1="380" y1="375" x2="372" y2="383" stroke="#d0d7de" stroke-width="1.5"/>
<line x1="396" y1="375" x2="388" y2="383" stroke="#d0d7de" stroke-width="1.5"/>
<line x1="412" y1="375" x2="404" y2="383" stroke="#d0d7de" stroke-width="1.5"/>
<line x1="428" y1="375" x2="420" y2="383" stroke="#d0d7de" stroke-width="1.5"/>
<line x1="444" y1="375" x2="436" y2="383" stroke="#d0d7de" stroke-width="1.5"/>
<line x1="460" y1="375" x2="452" y2="383" stroke="#d0d7de" stroke-width="1.5"/>
<line x1="476" y1="375" x2="468" y2="383" stroke="#d0d7de" stroke-width="1.5"/>
<line x1="492" y1="375" x2="484" y2="383" stroke="#d0d7de" stroke-width="1.5"/>
<line x1="508" y1="375" x2="500" y2="383" stroke="#d0d7de" stroke-width="1.5"/>
<line x1="524" y1="375" x2="516" y2="383" stroke="#d0d7de" stroke-width="1.5"/>

<!-- Undeformed dipped arc zone (deformation volume below road) -->
<path d="M 214.29,375 A 135 135 0 0 0 355.71,375 Z" fill="#fdecea" stroke="#2457d6" stroke-width="2" stroke-dasharray="6,4"/>

<!-- Deformed tire contour (circular above, flat along contact patch) -->
<path d="M 214.29,375 A 135 135 0 1 1 355.71,375 L 214.29,375 Z" fill="#f8fafc" stroke="#1a1a1a" stroke-width="2.5"/>

<!-- Undeformed reference circle (upper dashed perimeter) -->
<circle cx="285" cy="260" r="135" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="6,4"/>

<!-- Contact patch on road surface -->
<line x1="214.29" y1="375" x2="355.71" y2="375" stroke="#27ae60" stroke-width="4"/>

<!-- Wheel rim and hub -->
<circle cx="285" cy="260" r="48" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<circle cx="285" cy="260" r="14" fill="#e5e7eb" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="285" cy="260" r="4" fill="#1a1a1a"/>

<!-- Axle center O label -->
<text x="268" y="255" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">O</text>

<!-- Forward platform speed vector v -->
<line x1="245" y1="92" x2="310" y2="92" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-black)"/>
<text x="318" y="96" font-size="12" font-weight="bold" fill="#1a1a1a">v (рух платформи)</text>

<!-- Motor output torque M_вих curved arrow -->
<path d="M 256.8,249.7 A 30 30 0 0 1 285,230" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-black)"/>
<text x="248" y="236" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">M_вих</text>
<text x="248" y="249" text-anchor="end" font-size="12" fill="#6b7280">(момент)</text>

<!-- Chassis normal load F_N -->
<line x1="285" y1="155" x2="285" y2="222" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arr-black)"/>
<text x="145" y="195" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">F_N = m·g / k</text>
<text x="145" y="210" text-anchor="end" font-size="12" fill="#6b7280">навантаження шасі</text>
<line x1="150" y1="200" x2="278" y2="200" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>

<!-- Undeformed geometric radius R_0 -->
<line x1="285" y1="260" x2="395.6" y2="182.6" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
<text x="406" y="178" font-size="12" font-weight="bold" fill="#2457d6">R₀ (паспортний)</text>
<text x="406" y="193" font-size="12" fill="#2457d6">геометричний радіус</text>
<text x="406" y="208" font-size="12" fill="#6b7280">(без навантаження)</text>

<!-- Dynamic rolling radius R_dyn -->
<line x1="285" y1="260" x2="285" y2="371" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
<text x="430" y="248" font-size="12" font-weight="bold" fill="#27ae60">R_dyn (динамічний)</text>
<text x="430" y="263" font-size="12" fill="#27ae60">радіус під вагою шасі</text>
<text x="430" y="278" font-size="12" fill="#6b7280">R_dyn = R₀ − Δr</text>
<line x1="425" y1="263" x2="290" y2="315" stroke="#27ae60" stroke-width="1" stroke-dasharray="3,3"/>

<!-- Traction force F_тяг -->
<line x1="285" y1="360" x2="380" y2="360" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
<text x="390" y="348" font-size="12" font-weight="bold" fill="#27ae60">F_тяг = M_вих / R_dyn</text>
<text x="390" y="363" font-size="12" fill="#27ae60">сила тяги на контакті</text>

<!-- Radial deflection Δr dimensioning -->
<line x1="285" y1="395" x2="405" y2="395" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3,3"/>
<line x1="400" y1="375" x2="400" y2="395" stroke="#c0392b" stroke-width="1.8" marker-start="url(#arr-red-rev)" marker-end="url(#arr-red)"/>
<text x="412" y="388" font-size="12" font-weight="bold" fill="#c0392b">Δr = R₀ − R_dyn</text>
<text x="412" y="402" font-size="12" fill="#6b7280">радіальний прогин</text>

<!-- Contact patch 2b dimensioning -->
<line x1="214.29" y1="378" x2="214.29" y2="426" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="2,2"/>
<line x1="355.71" y1="378" x2="355.71" y2="426" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="2,2"/>
<line x1="216" y1="422" x2="354" y2="422" stroke="#27ae60" stroke-width="1.5" marker-start="url(#arr-green-rev)" marker-end="url(#arr-green)"/>
<text x="285" y="440" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Контактна пляма 2b ≈ 141 мм</text>
<text x="285" y="455" text-anchor="middle" font-size="12" fill="#6b7280">зона передачі зчеплення і сили тяги</text>

<!-- RIGHT PANEL CARDS -->
<!-- Card 1: Kinematics and Forces -->
<rect x="575" y="75" width="365" height="180" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
<text x="595" y="98" font-size="14" font-weight="bold" fill="#1a1a1a">Кінематичні та силові співвідношення</text>
<line x1="595" y1="108" x2="920" y2="108" stroke="#d0d7de" stroke-width="1"/>

<text x="595" y="126" font-size="12" font-weight="bold" fill="#2457d6">● Динамічний радіус під навантаженням:</text>
<text x="610" y="142" font-size="12" fill="#1a1a1a">R_dyn = R₀ − Δr = R₀ − (F_N / C_шин)</text>

<text x="595" y="164" font-size="12" font-weight="bold" fill="#27ae60">● Фактична лінійна швидкість шасі:</text>
<text x="610" y="180" font-size="12" fill="#1a1a1a">v = ω · R_dyn = (2π · n_вих · R_dyn) / 60</text>
<text x="610" y="196" font-size="12" fill="#6b7280">(Падіння v на 3–8% через радіальний прогин)</text>

<text x="595" y="218" font-size="12" font-weight="bold" fill="#1a1a1a">● Реальна сила тяги колеса:</text>
<text x="610" y="234" font-size="12" fill="#1a1a1a">F_тяг = (M_вих · η) / R_dyn  (менше плече → більша тяга)</text>

<!-- Card 2: Engineering Consequences -->
<rect x="575" y="270" width="365" height="185" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
<text x="595" y="293" font-size="14" font-weight="bold" fill="#1a1a1a">Інженерні наслідки для платформи</text>
<line x1="595" y1="303" x2="920" y2="303" stroke="#d0d7de" stroke-width="1"/>

<text x="595" y="321" font-size="12" font-weight="bold" fill="#c0392b">● Похибка колісної одометрії:</text>
<text x="610" y="337" font-size="12" fill="#1a1a1a">s_помилка = 2π · Δr на кожен оберт колеса</text>
<text x="610" y="352" font-size="12" fill="#6b7280">(Паспортний R₀ накопичує похибку розрахунку шляху)</text>

<text x="595" y="373" font-size="12" font-weight="bold" fill="#1a1a1a">● Додатковий опір коченню:</text>
<text x="610" y="389" font-size="12" fill="#6b7280">Гістерезис у плямі 2b збільшує f_roll і струм мотора</text>

<text x="595" y="410" font-size="12" font-weight="bold" fill="#27ae60">● Інженерна рекомендація:</text>
<text x="610" y="426" font-size="12" fill="#1a1a1a">Калібрувати R_dyn експериментально під повною</text>
<text x="610" y="442" font-size="12" fill="#1a1a1a">масою шасі (тестовий заїзд на 10 обертів)</text>

</svg>
