<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Будова та монтажні інтерфейси: прецизійний N20 проти доступного TT</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Відкритий латунний сендвіч під точне приладобудування проти закритого пластикового корпусу під іграшкові шасі</text>

  <!-- ЛІВА ПАНЕЛЬ: N20 -->
  <rect x="30" y="70" width="440" height="344" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Заголовок лівої панелі -->
  <rect x="42" y="78" width="416" height="42" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="54" y="95" font-size="13" font-weight="700" fill="#2457d6">Мікромотор-редуктор N20 (Micro Metal Gearmotor)</text>
  <text x="54" y="111" font-size="12" fill="#475569">Відкритий латунний сендвіч • Торцеві 2×M1.6 • D-вал Ø3 мм</text>

  <!-- Креслярський контейнер N20 -->
  <rect x="42" y="126" width="416" height="114" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Підписи креслення N20 -->
  <text x="140" y="139" font-size="12" font-weight="700" fill="#996515" text-anchor="middle">Відкритий латунний редуктор</text>
  <text x="140" y="223" font-size="12" fill="#64748b" text-anchor="middle">Мотор 12×10 мм • Сталеві осі</text>

  <!-- Деталі мотора N20 -->
  <line x1="52" y1="168" x2="58" y2="168" stroke="#78909c" stroke-width="2"/>
  <line x1="52" y1="184" x2="58" y2="184" stroke="#78909c" stroke-width="2"/>
  <rect x="58" y="158" width="8" height="36" rx="2" fill="#37474f"/>
  <rect x="66" y="152" width="48" height="48" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="90" y="179" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">N20</text>

  <!-- Редуктор N20: латунний сендвіч -->
  <rect x="114" y="148" width="6" height="56" rx="1" fill="#d4a340" stroke="#996515" stroke-width="1.2"/>
  <rect x="120" y="152" width="40" height="48" fill="#fffdf5"/>
  <line x1="120" y1="160" x2="160" y2="160" stroke="#94a3b8" stroke-width="2"/>
  <line x1="120" y1="176" x2="160" y2="176" stroke="#94a3b8" stroke-width="2"/>
  <line x1="120" y1="192" x2="160" y2="192" stroke="#94a3b8" stroke-width="2"/>

  <!-- Шестерні N20 -->
  <rect x="121" y="168" width="5" height="14" rx="1" fill="#d4a340" stroke="#996515" stroke-width="1"/>
  <rect x="128" y="154" width="6" height="24" rx="1" fill="#f5e1a4" stroke="#c59733" stroke-width="1"/>
  <rect x="136" y="166" width="6" height="28" rx="1" fill="#f5e1a4" stroke="#c59733" stroke-width="1"/>
  <rect x="144" y="156" width="6" height="30" rx="1" fill="#f5e1a4" stroke="#c59733" stroke-width="1"/>
  <rect x="152" y="164" width="6" height="34" rx="1" fill="#d4a340" stroke="#996515" stroke-width="1"/>

  <!-- Передня пластина й вихідний вал N20 -->
  <rect x="160" y="148" width="7" height="56" rx="1" fill="#d4a340" stroke="#996515" stroke-width="1.2"/>
  <rect x="167" y="170" width="5" height="12" fill="#c59733" stroke="#8c620e" stroke-width="1"/>
  <rect x="172" y="172" width="36" height="8" rx="1" fill="#cbd5e1" stroke="#475569" stroke-width="1.2"/>
  <rect x="180" y="176" width="28" height="4" fill="#f1f5f9"/>
  <line x1="180" y1="176" x2="208" y2="176" stroke="#64748b" stroke-width="1"/>

  <!-- Торцевий фланець N20 (вигляд спереду) -->
  <rect x="218" y="148" width="46" height="56" rx="3" fill="#fef3c7" stroke="#996515" stroke-width="1.5"/>
  <circle cx="241" cy="158" r="3.5" fill="#334155" stroke="#996515" stroke-width="1"/>
  <circle cx="241" cy="194" r="3.5" fill="#334155" stroke="#996515" stroke-width="1"/>
  <circle cx="241" cy="176" r="7" fill="#d4a340" stroke="#996515" stroke-width="1"/>
  <path d="M 238,173 A 4.5,4.5 0 1,1 245,173 L 245,179 L 238,179 Z" fill="#94a3b8" stroke="#334155" stroke-width="1"/>

  <!-- Міні-картка параметрів N20 -->
  <rect x="276" y="128" width="172" height="106" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="286" y="146" font-size="12" font-weight="700" fill="#2457d6">Монтажний фланець N20:</text>
  <text x="286" y="164" font-size="12" fill="#475569">• 2× отвори з різьбою M1.6</text>
  <text x="286" y="182" font-size="12" fill="#475569">• Міжцентрова база: 9.0 мм</text>
  <text x="286" y="200" font-size="12" fill="#475569">• Сталевий D-вал Ø3 мм</text>
  <text x="286" y="218" font-size="12" fill="#64748b">• Лиска 2.5 мм під стопор</text>

  <!-- 4 картки параметрів N20 -->
  <rect x="42" y="248" width="416" height="32" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="54" y="269" font-size="12" font-weight="700" fill="#1a1a1a">Анатомія:</text>
  <text x="124" y="269" font-size="12" fill="#475569">відкритий латунний сендвіч, сталеві осі, метал</text>

  <rect x="42" y="287" width="416" height="32" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="54" y="308" font-size="12" font-weight="700" fill="#1a1a1a">Монтаж:</text>
  <text x="124" y="308" font-size="12" fill="#475569">2× різьбові отвори M1.6 у торці (міжцентр 9 мм)</text>

  <rect x="42" y="326" width="416" height="32" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="54" y="347" font-size="12" font-weight="700" fill="#1a1a1a">Вал:</text>
  <text x="124" y="347" font-size="12" fill="#475569">гартований сталевий D-вал Ø3 мм (лиска 2.5 мм)</text>

  <rect x="42" y="365" width="416" height="32" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="54" y="386" font-size="12" font-weight="700" fill="#1a1a1a">Ніша:</text>
  <text x="124" y="386" font-size="12" fill="#475569">кодові замки, мікродозатори, точна робототехніка</text>

  <!-- ПРАВА ПАНЕЛЬ: TT MOTOR -->
  <rect x="490" y="70" width="440" height="344" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Заголовок правої панелі -->
  <rect x="502" y="78" width="416" height="42" rx="6" fill="#fef2f2" stroke="#c0392b" stroke-width="1.2"/>
  <text x="514" y="95" font-size="13" font-weight="700" fill="#c0392b">Мотор-редуктор TT (Yellow Plastic TT Motor)</text>
  <text x="514" y="111" font-size="12" fill="#475569">Двостулковий ABS на защіпках • Наскрізні M3 • Вал Double-Flat</text>

  <!-- Креслярський контейнер TT -->
  <rect x="502" y="126" width="416" height="114" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Підписи креслення TT -->
  <text x="615" y="139" font-size="12" font-weight="700" fill="#ca8a04" text-anchor="middle">Корпус ABS на защіпках</text>
  <text x="615" y="223" font-size="12" fill="#64748b" text-anchor="middle">Шестерні POM • Пластикові втулки</text>

  <!-- Корпус TT і мотор 130 -->
  <line x1="512" y1="168" x2="518" y2="168" stroke="#78909c" stroke-width="2"/>
  <line x1="512" y1="184" x2="518" y2="184" stroke="#78909c" stroke-width="2"/>
  <rect x="518" y="150" width="136" height="50" rx="6" fill="#fde047" stroke="#ca8a04" stroke-width="1.5"/>

  <!-- Защіпки корпусу TT -->
  <rect x="572" y="147" width="10" height="4" rx="1" fill="#ca8a04"/>
  <rect x="622" y="147" width="10" height="4" rx="1" fill="#ca8a04"/>
  <rect x="572" y="199" width="10" height="4" rx="1" fill="#ca8a04"/>
  <rect x="622" y="199" width="10" height="4" rx="1" fill="#ca8a04"/>

  <!-- Мотор 130 усередині -->
  <rect x="522" y="154" width="40" height="42" rx="3" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="542" y="174" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">130</text>

  <!-- Відсік редуктора TT -->
  <rect x="566" y="154" width="84" height="42" fill="#fef9c3"/>
  <rect x="570" y="162" width="7" height="26" rx="1.5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="580" y="156" width="7" height="32" rx="1.5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="590" y="164" width="8" height="24" rx="1.5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>
  <rect x="601" y="156" width="10" height="38" rx="2" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Наскрізні отвори під M3 -->
  <circle cx="634" cy="165" r="4.5" fill="#ffffff" stroke="#ca8a04" stroke-width="1.5"/>
  <circle cx="550" cy="190" r="4.5" fill="#ffffff" stroke="#ca8a04" stroke-width="1.5"/>

  <!-- Вал TT Double-Flat -->
  <rect x="654" y="170" width="28" height="10" rx="1" fill="#f8fafc" stroke="#64748b" stroke-width="1.2"/>
  <line x1="656" y1="172" x2="680" y2="172" stroke="#94a3b8" stroke-width="1"/>
  <line x1="656" y1="178" x2="680" y2="178" stroke="#94a3b8" stroke-width="1"/>

  <!-- Переріз вала TT -->
  <path d="M 692,170 L 700,170 A 5,5 0 0,1 700,180 L 692,180 A 5,5 0 0,1 692,170 Z" fill="#ffffff" stroke="#475569" stroke-width="1.2"/>

  <!-- Міні-картка параметрів TT -->
  <rect x="724" y="128" width="184" height="106" rx="4" fill="#fef2f2" stroke="#fecaca" stroke-width="1"/>
  <text x="734" y="146" font-size="12" font-weight="700" fill="#c0392b">Монтажний інтерфейс TT:</text>
  <text x="734" y="164" font-size="12" fill="#475569">• 2× наскрізні отвори M3</text>
  <text x="734" y="182" font-size="12" fill="#475569">• Стяжка крізь корпус 22 мм</text>
  <text x="734" y="200" font-size="12" fill="#475569">• Двосторонній плаский вал</text>
  <text x="734" y="218" font-size="12" fill="#64748b">• Лиски 5.4 мм під колесо</text>

  <!-- 4 картки параметрів TT -->
  <rect x="502" y="248" width="416" height="32" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="514" y="269" font-size="12" font-weight="700" fill="#1a1a1a">Анатомія:</text>
  <text x="584" y="269" font-size="12" fill="#475569">двостулковий ABS на защіпках, шестерні з POM</text>

  <rect x="502" y="287" width="416" height="32" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="514" y="308" font-size="12" font-weight="700" fill="#1a1a1a">Монтаж:</text>
  <text x="584" y="308" font-size="12" fill="#475569">2× наскрізні отвори під гвинти M3 крізь корпус</text>

  <rect x="502" y="326" width="416" height="32" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="514" y="347" font-size="12" font-weight="700" fill="#1a1a1a">Вал:</text>
  <text x="584" y="347" font-size="12" fill="#475569">двосторонній пластиковий вал з 2 лисками (Double-Flat)</text>

  <rect x="502" y="365" width="416" height="32" rx="5" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="514" y="386" font-size="12" font-weight="700" fill="#1a1a1a">Ніша:</text>
  <text x="584" y="386" font-size="12" fill="#475569">дитячі іграшки, базові навчальні шасі 2WD/4WD</text>

  <!-- НИЖНЯ ІНФОРМАЦІЙНА ПЛАШКА -->
  <rect x="30" y="430" width="900" height="70" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="48" y="448" font-size="13" font-weight="700" fill="#2457d6">Інженерне коріння: стандарти комерційної електроніки та іграшок, а не спеціальні розробки під Arduino</text>
  <text x="48" y="469" font-size="12" fill="#1a1a1a">• N20 створено для портативної аудіотехніки (деки Walkman), замків і камер — звідси суцільнометалевий ресурс.</text>
  <text x="48" y="488" font-size="12" fill="#1a1a1a">• TT Motor розроблено для радіокерованих іграшок; Maker-спільнота адаптувала його через мінімальну вартість.</text>
</svg>
