<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок (поля >= 20px від країв) -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Вихідні каскади H-моста: біполярні ключі (L298N) проти MOSFET</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">При живленні 6 В MOSFET зберігає до 96% напруги, тоді як BJT втрачає понад 30% у тепло</text>

  <!-- ==================== ПАНЕЛЬ 1: BJT DARLINGTON ==================== -->
  <rect x="24" y="74" width="290" height="364" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Заголовок панелі 1 -->
  <rect x="36" y="84" width="266" height="42" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="169" y="101" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">BJT Дарлінгтон (тип L298N)</text>
  <text x="169" y="118" text-anchor="middle" font-size="12" fill="#6b7280">Фіксоване V_drop = 1,4...2,0 В</text>

  <!-- Схема живлення BJT -->
  <text x="125" y="143" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">+V_CC = 6,0 В</text>
  <line x1="85" y1="149" x2="165" y2="149" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="125" y1="149" x2="125" y2="161" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Верхній ключ BJT -->
  <rect x="55" y="161" width="140" height="36" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="125" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Q1: BJT Дарлінгтон</text>
  <text x="125" y="190" text-anchor="middle" font-size="12" fill="#c0392b">спад ΔV₁ ≈ 0,9 В</text>

  <!-- З'єднання до мотора -->
  <line x1="125" y1="197" x2="125" y2="208" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Двигун -->
  <circle cx="125" cy="224" r="16" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="125" y="229" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">M</text>

  <!-- Напруга на двигуні BJT -->
  <text x="152" y="220" font-size="12" font-weight="bold" fill="#c0392b">V_мотор ≈ 4,2 В</text>
  <text x="152" y="235" font-size="12" fill="#6b7280">(втрата 30% напруги)</text>

  <!-- З'єднання від мотора до нижнього ключа -->
  <line x1="125" y1="240" x2="125" y2="251" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Нижній ключ BJT -->
  <rect x="55" y="251" width="140" height="36" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="125" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Q2: BJT Дарлінгтон</text>
  <text x="125" y="280" text-anchor="middle" font-size="12" fill="#c0392b">спад ΔV₂ ≈ 0,9 В</text>

  <!-- З'єднання до GND -->
  <line x1="125" y1="287" x2="125" y2="299" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="95" y1="299" x2="155" y2="299" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="125" y="314" text-anchor="middle" font-size="12" fill="#6b7280">GND (0 В)</text>

  <!-- Підсумок BJT -->
  <rect x="36" y="328" width="266" height="98" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="46" y="347" font-size="12" font-weight="bold" fill="#c0392b">• Сумарний спад: ~1,8 В (фікс.)</text>
  <text x="46" y="365" font-size="12" fill="#1a1a1a">• На моторі: 4,2 В із 6,0 В (70%)</text>
  <text x="46" y="383" font-size="12" fill="#1a1a1a">• Втрати: P_loss = I × V_drop</text>
  <text x="46" y="401" font-size="12" font-weight="bold" fill="#c0392b">• При 1,0 А: 1,8 Вт у тепло!</text>
  <text x="46" y="417" font-size="12" fill="#6b7280">• Потребує великого радіатора</text>


  <!-- ==================== ПАНЕЛЬ 2: MOSFET ==================== -->
  <rect x="335" y="74" width="290" height="364" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Заголовок панелі 2 -->
  <rect x="347" y="84" width="266" height="42" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="480" y="101" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">MOSFET (TB6612 / DRV8833)</text>
  <text x="480" y="118" text-anchor="middle" font-size="12" fill="#6b7280">Омічний спад: I × R_DS(on)</text>

  <!-- Схема живлення MOSFET -->
  <text x="435" y="143" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">+V_CC = 6,0 В</text>
  <line x1="395" y1="149" x2="475" y2="149" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="435" y1="149" x2="435" y2="161" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Верхній ключ MOSFET -->
  <rect x="365" y="161" width="140" height="36" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="435" y="176" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Q1: N/P-MOSFET</text>
  <text x="435" y="190" text-anchor="middle" font-size="12" fill="#27ae60">R_DS(on) ≈ 0,15 Ом</text>

  <!-- З'єднання до мотора -->
  <line x1="435" y1="197" x2="435" y2="208" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Двигун -->
  <circle cx="435" cy="224" r="16" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="435" y="229" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">M</text>

  <!-- Напруга на двигуні MOSFET -->
  <text x="462" y="220" font-size="12" font-weight="bold" fill="#27ae60">V_мотор ≈ 5,7 В</text>
  <text x="462" y="235" font-size="12" fill="#6b7280">(збережено 95% напруги)</text>

  <!-- З'єднання від мотора до нижнього ключа -->
  <line x1="435" y1="240" x2="435" y2="251" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Нижній ключ MOSFET -->
  <rect x="365" y="251" width="140" height="36" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="435" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Q2: N-MOSFET</text>
  <text x="435" y="280" text-anchor="middle" font-size="12" fill="#27ae60">R_DS(on) ≈ 0,15 Ом</text>

  <!-- З'єднання до GND -->
  <line x1="435" y1="287" x2="435" y2="299" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="405" y1="299" x2="465" y2="299" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="435" y="314" text-anchor="middle" font-size="12" fill="#6b7280">GND (0 В)</text>

  <!-- Підсумок MOSFET -->
  <rect x="347" y="328" width="266" height="98" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="357" y="347" font-size="12" font-weight="bold" fill="#27ae60">• Омічний спад: ~0,3 В при 1 А</text>
  <text x="357" y="365" font-size="12" fill="#1a1a1a">• На моторі: 5,7 В із 6,0 В (95%)</text>
  <text x="357" y="383" font-size="12" fill="#1a1a1a">• Втрати: P_loss = I² × 2R_DS</text>
  <text x="357" y="401" font-size="12" font-weight="bold" fill="#27ae60">• При 1,0 А: лише 0,3 Вт тепла</text>
  <text x="357" y="417" font-size="12" fill="#6b7280">• Працює без радіатора (холодний)</text>


  <!-- ==================== ПАНЕЛЬ 3: ГРАФІК ВТРАТ ==================== -->
  <rect x="646" y="74" width="290" height="364" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Заголовок панелі 3 -->
  <rect x="658" y="84" width="266" height="42" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="791" y="101" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Теплові втрати P_loss(I)</text>
  <text x="791" y="118" text-anchor="middle" font-size="12" fill="#6b7280">Порівняння нагріву при 0...2 А</text>

  <!-- Сітка графіка -->
  <line x1="690" y1="170" x2="870" y2="170" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="690" y1="194" x2="870" y2="194" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="690" y1="218" x2="870" y2="218" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="690" y1="242" x2="870" y2="242" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Пунктирна вертикаль робочого струму 1 А -->
  <text x="774" y="156" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">у 5× менше втрат</text>
  <line x1="780" y1="162" x2="780" y2="266" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Крива BJT (червона) -->
  <path d="M 690 266 L 735 245 L 780 223 L 825 197 L 870 170" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="780" cy="223" r="3.5" fill="#c0392b"/>
  <circle cx="870" cy="170" r="3.5" fill="#c0392b"/>
  <text x="876" y="174" font-size="12" font-weight="bold" fill="#c0392b">BJT</text>

  <!-- Крива MOSFET (зелена) -->
  <path d="M 690 266 Q 745 265 780 257 T 870 233" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="780" cy="257" r="3.5" fill="#27ae60"/>
  <circle cx="870" cy="233" r="3.5" fill="#27ae60"/>
  <text x="876" y="237" font-size="12" font-weight="bold" fill="#27ae60">MOSFET</text>

  <!-- Осі координат -->
  <!-- Вісь Y -->
  <text x="690" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">P, Вт</text>
  <line x1="690" y1="266" x2="690" y2="150" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Значення осі Y -->
  <text x="682" y="174" text-anchor="end" font-size="12" fill="#6b7280">4</text>
  <text x="682" y="198" text-anchor="end" font-size="12" fill="#6b7280">3</text>
  <text x="682" y="222" text-anchor="end" font-size="12" fill="#6b7280">2</text>
  <text x="682" y="246" text-anchor="end" font-size="12" fill="#6b7280">1</text>
  <text x="682" y="270" text-anchor="end" font-size="12" fill="#6b7280">0</text>

  <!-- Вісь X -->
  <line x1="690" y1="266" x2="880" y2="266" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="898" y="270" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">I, А</text>
  <!-- Засічки і значення осі X -->
  <line x1="735" y1="266" x2="735" y2="269" stroke="#1a1a1a" stroke-width="1"/>
  <text x="735" y="284" text-anchor="middle" font-size="12" fill="#6b7280">0,5</text>

  <line x1="780" y1="266" x2="780" y2="269" stroke="#1a1a1a" stroke-width="1"/>
  <text x="780" y="284" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">1,0</text>

  <line x1="825" y1="266" x2="825" y2="269" stroke="#1a1a1a" stroke-width="1"/>
  <text x="825" y="284" text-anchor="middle" font-size="12" fill="#6b7280">1,5</text>

  <line x1="870" y1="266" x2="870" y2="269" stroke="#1a1a1a" stroke-width="1"/>
  <text x="870" y="284" text-anchor="middle" font-size="12" fill="#6b7280">2,0</text>

  <!-- Підсумок панелі 3 (Легенда та висновок) -->
  <rect x="658" y="328" width="266" height="98" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <line x1="668" y1="344" x2="688" y2="344" stroke="#c0392b" stroke-width="3"/>
  <text x="694" y="348" font-size="12" font-weight="bold" fill="#c0392b">BJT: P = I × V_sat (лінійні)</text>

  <line x1="668" y1="364" x2="688" y2="364" stroke="#27ae60" stroke-width="3"/>
  <text x="694" y="368" font-size="12" font-weight="bold" fill="#27ae60">MOSFET: P = I² × R_DS (квадр.)</text>

  <text x="668" y="390" font-size="12" fill="#1a1a1a">• При 1 А: BJT гріється у 5× сильніше</text>
  <text x="668" y="408" font-size="12" font-weight="bold" fill="#2457d6">• ККД напруги: 70% (BJT) vs 95% (MOS)</text>
</svg>
