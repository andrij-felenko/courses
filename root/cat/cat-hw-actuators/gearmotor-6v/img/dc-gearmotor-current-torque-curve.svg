<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="540" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Механічні та струмові характеристики мотор-редуктора 6 В</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">Лінійне зростання струму до блокування та баланс швидкості й моменту для версій 100 і 600 об/хв</text>

  <!-- Загальна легенда -->
  <line x1="120" y1="84" x2="145" y2="84" stroke="#2457d6" stroke-width="3"/>
  <text x="153" y="88" font-size="12" font-weight="bold" fill="#2457d6">Швидкість n (об/хв)</text>

  <line x1="315" y1="84" x2="340" y2="84" stroke="#c0392b" stroke-width="3"/>
  <text x="348" y="88" font-size="12" font-weight="bold" fill="#c0392b">Струм I (мА)</text>

  <circle cx="475" cy="84" r="5" fill="#27ae60"/>
  <text x="488" y="88" font-size="12" font-weight="bold" fill="#27ae60">Номінальний режим (тривалий)</text>

  <circle cx="715" cy="84" r="5" fill="#c0392b"/>
  <text x="728" y="88" font-size="12" font-weight="bold" fill="#c0392b">Блокування (Stall, небезпека!)</text>

  <!-- ПАНЕЛЬ 1: Версія 600 об/хв -->
  <rect x="25" y="108" width="445" height="410" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="247" y="131" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Модифікація 600 об/хв (редуктор ~1:30)</text>
  <text x="247" y="149" font-size="12" fill="#6b7280" text-anchor="middle">Холостий хід: 600 об/хв | Блокування: 0,40 кг·см, 500 мА</text>

  <!-- Області графіка 1 -->
  <rect x="75" y="188" width="82.5" height="200" fill="#e9f7ef" opacity="0.7"/>
  <rect x="322.5" y="188" width="82.5" height="200" fill="#fdecea" opacity="0.7"/>

  <!-- Сітка графіка 1 -->
  <line x1="75" y1="238" x2="405" y2="238" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="75" y1="288" x2="405" y2="288" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="75" y1="338" x2="405" y2="338" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Криві характеристик 1 -->
