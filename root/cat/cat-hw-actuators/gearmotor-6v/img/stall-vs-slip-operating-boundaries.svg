<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-axis" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- 1. Фонова підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- 2. Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Межі стійкого руху: зчеплення коліс проти блокування двигуна</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Границя пробуксовки F_grip(α) та межі тяги редуктора: робочі зони для версій 100 і 600 об/хв</text>

  <!-- 3. Ліва частина: Графік залежностей і меж -->
  <!-- Безпечна зона 100 об/хв (широкий робочий діапазон) -->
  <rect x="70" y="280" width="340" height="145" fill="#e9f7ef" opacity="0.55"/>

  <!-- Безпечна зона 600 об/хв (вузький робочий діапазон) -->
  <rect x="70" y="375" width="75" height="50" fill="#eaf0fd" opacity="0.85"/>
  <path d="M 70,375 L 145,375 L 145,425" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Координатні осі -->
  <line x1="70" y1="425" x2="545" y2="425" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-axis)"/>
  <line x1="70" y1="425" x2="70" y2="88" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-axis)"/>

  <!-- Назви осей -->
  <text x="70" y="80" font-size="12" font-weight="bold" fill="#1a1a1a">Сила тяги F (Н)</text>
  <text x="300" y="458" font-size="12" fill="#1a1a1a" text-anchor="middle">Кут нахилу поверхні α (°)</text>

  <!-- Позначки осі Y -->
  <g font-size="12" fill="#6b7280" text-anchor="end">
    <text x="56" y="429">0</text>
    <text x="56" y="379">5</text>
    <text x="56" y="324">10</text>
    <text x="56" y="269">15</text>
    <text x="56" y="214">20</text>
    <text x="56" y="159">25</text>
    <text x="56" y="104">30</text>
  </g>

  <!-- Позначки осі X -->
  <g font-size="12" fill="#6b7280" text-anchor="middle">
    <text x="70" y="442">0°</text>
    <text x="185" y="442">10°</text>
    <text x="300" y="442">20°</text>
    <text x="415" y="442">30°</text>
    <text x="530" y="442">40°</text>
  </g>

  <!-- Лінія F_stall (100 об/хв) -->
  <line x1="70" y1="125" x2="530" y2="125" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="85" y="114" font-size="12" font-weight="bold" fill="#c0392b">F_stall (100 об/хв) = 26 Н — аварійне блокування</text>

  <!-- Картка фізичного парадоксу -->
  <rect x="100" y="138" width="425" height="52" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="115" y="157" font-size="12" font-weight="bold" fill="#c0392b">Парадокс: F_stall (100 об/хв) &gt; F_grip (зчеплення)</text>
  <text x="115" y="177" font-size="12" fill="#1a1a1a">Колеса буксують до зламу шестерень (природний захист)</text>

  <!-- Лінія границі зчеплення F_grip(α) -->
  <path d="M 70,235 Q 300,245 530,275" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="115" y="220" font-size="12" font-weight="bold" fill="#c0392b">Границя зчеплення коліс F_grip(α) = μ · m·g · cos(α)</text>

  <!-- Крива потрібної сили тяги F_потр(α) -->
  <path d="M 70,405 C 200,360 350,305 530,255" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="525" y="244" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">F_потр (потрібна тяга)</text>

  <!-- Лінія F_ном (100 об/хв) -->
  <line x1="70" y1="280" x2="410" y2="280" stroke="#27ae60" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="410" y1="280" x2="410" y2="425" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="410" cy="280" r="4" fill="#27ae60"/>
  <text x="85" y="268" font-size="12" font-weight="bold" fill="#27ae60">F_ном (100 об/хв) = 12 Н</text>

  <!-- Лінія F_stall (600 об/хв) -->
  <line x1="70" y1="346" x2="190" y2="346" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="190" y1="346" x2="190" y2="425" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="190" cy="346" r="3.5" fill="#c0392b"/>
  <text x="85" y="334" font-size="12" font-weight="bold" fill="#c0392b">F_stall (600) = 5 Н</text>

  <!-- Лінія F_ном (600 об/хв) -->
  <line x1="70" y1="375" x2="145" y2="375" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="145" y1="375" x2="145" y2="425" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,2"/>
  <circle cx="145" cy="375" r="3.5" fill="#2457d6"/>
  <text x="85" y="363" font-size="12" font-weight="bold" fill="#2457d6">F_ном (600) = 4 Н</text>

  <!-- Підписи безпечних робочих зон усередині графіка -->
  <text x="107" y="402" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Зона 600</text>
  <text x="107" y="416" font-size="12" fill="#2457d6" text-anchor="middle">0°–6°</text>

  <text x="290" y="394" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Робоча зона 100 об/хв</text>
  <text x="290" y="410" font-size="12" fill="#27ae60" text-anchor="middle">Підйом без зупинки до α ≈ 28°</text>

  <!-- 4. Права частина: Інформаційні картки -->
  <!-- Картка 1: Фізичні межі та критерії -->
  <rect x="570" y="75" width="365" height="185" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="585" y="98" font-size="14" font-weight="bold" fill="#1a1a1a">Фізичні межі та критерії</text>

  <rect x="580" y="107" width="345" height="40" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="592" y="122" font-size="12" fill="#6b7280">Границя зчеплення з поверхнею (пробуксовка):</text>
  <text x="592" y="139" font-size="12" font-weight="bold" fill="#c0392b">F_grip(α) = μ · m · g · cos(α)</text>

  <rect x="580" y="159" width="345" height="40" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="592" y="174" font-size="12" fill="#6b7280">Межа тяги при блокуванні ротора (stall):</text>
  <text x="592" y="191" font-size="12" font-weight="bold" fill="#2457d6">F_stall = k · (M_stall · η) / R_к</text>

  <rect x="580" y="211" width="345" height="40" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="592" y="226" font-size="12" fill="#6b7280">Потрібна сила тяги для подолання підйому:</text>
  <text x="592" y="243" font-size="12" font-weight="bold" fill="#1a1a1a">F_рух(α) = m·g·sin(α) + f_roll · m·g·cos(α)</text>

  <!-- Картка 2: Порівняння поведінки шасі -->
  <rect x="570" y="273" width="365" height="182" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="585" y="296" font-size="14" font-weight="bold" fill="#1a1a1a">Порівняння поведінки шасі</text>

  <rect x="580" y="306" width="345" height="62" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="592" y="323" font-size="12" font-weight="bold" fill="#c0392b">Модифікація 600 об/хв (швидкісна):</text>
  <text x="592" y="341" font-size="12" fill="#1a1a1a">• F_stall &lt; F_grip: не вистачає тяги на підйомі</text>
  <text x="592" y="358" font-size="12" fill="#6b7280">• Ризик: двигун зупиняється (stall) при α &gt; 8°</text>

  <rect x="580" y="381" width="345" height="62" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="592" y="398" font-size="12" font-weight="bold" fill="#27ae60">Модифікація 100 об/хв (тягова):</text>
  <text x="592" y="416" font-size="12" fill="#1a1a1a">• F_stall &gt; F_grip: тяги більше, ніж зчеплення</text>
  <text x="592" y="433" font-size="12" fill="#6b7280">• Ефект: пробуксовка захищає редуктор від зламу</text>
</svg>
