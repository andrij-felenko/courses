<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Сирий сигнал струму шунта та цифровий БІХ-фільтр</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Придушення комутаційного шуму та захист від заклинювання без хибних спрацьовувань</text>

  <!-- Панель легенди -->
  <rect x="60" y="72" width="840" height="30" rx="5" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <line x1="75" y1="87" x2="100" y2="87" stroke="#c0392b" stroke-width="1.5"/>
  <text x="108" y="91" font-size="12" fill="#1a1a1a">Сирий струм (комутаційні голки)</text>

  <line x1="345" y1="87" x2="370" y2="87" stroke="#2457d6" stroke-width="2.5"/>
  <text x="378" y="91" font-size="12" fill="#1a1a1a">БІХ-фільтр (експоненційне згладжування)</text>

  <line x1="655" y1="87" x2="680" y2="87" stroke="#c0392b" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="688" y="91" font-size="12" fill="#1a1a1a">Поріг аварійного захисту I_trip</text>

  <!-- Заголовки фаз над графіком -->
  <text x="290" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">ФАЗА 1: НОМІНАЛЬНИЙ ХІД (0…110 мс)</text>
  <text x="625" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">ФАЗА 2: ЗАКЛИНЮВАННЯ (110…165 мс)</text>
  <text x="815" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">ФАЗА 3: ВІДСІЧКА</text>

  <!-- Одиниці виміру осі Y -->
  <text x="72" y="126" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">I (мА)</text>

  <!-- Поле графіка та кольорові зони -->
  <rect x="80" y="140" width="800" height="275" fill="#fafbfc" stroke="#d0d7de" stroke-width="1"/>
  <rect x="520" y="140" width="220" height="275" fill="#fdecea" opacity="0.4"/>
  <rect x="740" y="140" width="140" height="275" fill="#e9f7ef" opacity="0.45"/>

  <!-- Вертикальні розділювачі фаз -->
  <line x1="520" y1="140" x2="520" y2="415" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="740" y1="140" x2="740" y2="415" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>

