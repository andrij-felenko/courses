  <text x="886" y="239" font-size="12" font-weight="bold" fill="#c0392b">I_trip</text>

  <!-- Підписи значень по осі Y -->
  <text x="72" y="179" text-anchor="end" font-size="12" fill="#6b7280">600</text>
  <text x="72" y="219" text-anchor="end" font-size="12" fill="#6b7280">500</text>
  <text x="72" y="259" text-anchor="end" font-size="12" fill="#6b7280">400</text>
