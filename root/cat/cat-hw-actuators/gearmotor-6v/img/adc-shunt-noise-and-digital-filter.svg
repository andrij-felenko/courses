  <text x="74" y="462" font-size="12" font-weight="bold" fill="#c0392b">1. Сирий струм (норма)</text>
  <text x="74" y="478" font-size="12" fill="#1a1a1a">• Шум щіток сягає 500–600 мА</text>
  <text x="74" y="494" font-size="12" fill="#1a1a1a">• Голки ШІМ перетинають I_trip</text>
  <text x="74" y="508" font-size="12" fill="#6b7280">• Без фільтра — хибні тривоги</text>

  <rect x="347" y="444" width="265" height="72" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="361" y="462" font-size="12" font-weight="bold" fill="#2457d6">2. Цифровий БІХ-фільтр</text>
  <text x="361" y="478" font-size="12" fill="#1a1a1a">• Придушення імпульсних завад</text>
  <text x="361" y="494" font-size="12" fill="#1a1a1a">• Плавний відгук на заклинювання</text>
  <text x="361" y="508" font-size="12" fill="#6b7280">• Точний перетин I_trip на 160 мс</text>

  <rect x="635" y="444" width="265" height="72" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="649" y="462" font-size="12" font-weight="bold" fill="#27ae60">3. Захисне відключення</text>
