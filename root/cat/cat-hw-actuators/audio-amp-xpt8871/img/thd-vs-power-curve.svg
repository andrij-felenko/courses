<svg viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Залежність коефіцієнта THD+N від вихідної потужності (XPT8871)</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">RL = 4 Ом, VDD = 5 В: чистий звук до 2.3 Вт (THD &lt; 0.1%), паспортні 5 Вт — глибокий кліпінг (THD = 10%)</text>

  <!-- Панель 1: Зона якісного звуку -->
  <rect x="600" y="88" width="335" height="100" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="616" y="110" font-size="13" font-weight="bold" fill="#27ae60">1. Зона якісного звуку (0.2 – 2.3 Вт)</text>
  <text x="616" y="130" font-size="12" fill="#1a1a1a">• THD+N &lt; 0.1% — чисте неспотворене звучання</text>
  <text x="616" y="148" font-size="12" fill="#1a1a1a">• Синусоїдальний сигнал без зрізання верхівок</text>
  <text x="616" y="166" font-size="12" fill="#1a1a1a">• Відсутність компресії та перегріву котушки</text>
  <path d="M 878,106 Q 885,96 892,106 T 906,106" fill="none" stroke="#27ae60" stroke-width="2"/>

  <!-- Панель 2: Коліно кліпінгу -->
  <rect x="600" y="200" width="335" height="100" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="616" y="222" font-size="13" font-weight="bold" fill="#2457d6">2. «Коліно» кліпінгу (2.5 – 2.8 Вт)</text>
  <text x="616" y="242" font-size="12" fill="#1a1a1a">• Розмах напруги сягає рівня живлення VDD</text>
  <text x="616" y="260" font-size="12" fill="#1a1a1a">• Початок насичення транзисторів BTL-моста</text>
  <text x="616" y="278" font-size="12" fill="#1a1a1a">• Стрімке лавиноподібне зростання гармонік</text>

  <!-- Панель 3: Маркетингова межа -->
  <rect x="600" y="312" width="335" height="114" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="616" y="334" font-size="13" font-weight="bold" fill="#c0392b">3. Маркетингова межа 5 Вт (THD = 10%)</text>
  <text x="616" y="354" font-size="12" fill="#1a1a1a">• Паспортна цифра «5 Вт» у заголовку даташиту</text>
  <text x="616" y="372" font-size="12" fill="#1a1a1a">• Глибокий кліпінг: синусоїда зрізана у меандр</text>
  <text x="616" y="390" font-size="12" fill="#1a1a1a">• Потужність гармонік перегріває динамік</text>
  <text x="616" y="408" font-size="12" fill="#6b7280">  (сигнал непридатний для якісної музики)</text>
  <path d="M 876,334 H 880 L 883,324 H 893 L 896,334 H 899 L 902,344 H 912 L 915,334 H 918" fill="none" stroke="#c0392b" stroke-width="2"/>

  <!-- Область графіка -->
  <rect x="105" y="110" width="182" height="270" fill="#27ae60" fill-opacity="0.07"/>
  <rect x="105" y="110" width="460" height="270" fill="none" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Назва осі Y -->
  <text x="105" y="96" font-size="12" font-weight="bold" fill="#1a1a1a">THD+N (%)</text>

  <!-- Горизонтальні лінії сітки -->
  <line x1="105" y1="137" x2="565" y2="137" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="105" y1="227" x2="565" y2="227" stroke="#e5e7eb" stroke-dasharray="3 3"/>
  <line x1="105" y1="317" x2="565" y2="317" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="105" y1="344" x2="565" y2="344" stroke="#f0f2f5" stroke-dasharray="2 2"/>

  <!-- Підписи значень осі Y -->
  <text x="97" y="114" font-size="12" fill="#6b7280" text-anchor="end">20 %</text>
  <text x="97" y="141" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">10 %</text>
  <text x="97" y="231" font-size="12" fill="#6b7280" text-anchor="end">1.0 %</text>
  <text x="97" y="321" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">0.1 %</text>
  <text x="97" y="348" font-size="12" fill="#6b7280" text-anchor="end">0.05 %</text>
  <text x="97" y="380" font-size="12" fill="#6b7280" text-anchor="end">0.02 %</text>

  <!-- Вертикальні лінії сітки та межі -->
  <line x1="174" y1="110" x2="174" y2="380" stroke="#f0f2f5"/>
  <line x1="287" y1="110" x2="287" y2="380" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="348" y1="110" x2="348" y2="380" stroke="#f0f2f5"/>
  <line x1="435" y1="110" x2="435" y2="380" stroke="#f0f2f5"/>
  <line x1="522" y1="110" x2="522" y2="380" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Підписи осі X -->
  <text x="105" y="400" font-size="12" fill="#6b7280" text-anchor="middle">0.2</text>
  <text x="174" y="400" font-size="12" fill="#6b7280" text-anchor="middle">1.0</text>
  <text x="287" y="400" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">2.3</text>
  <text x="348" y="400" font-size="12" fill="#6b7280" text-anchor="middle">3.0</text>
  <text x="435" y="400" font-size="12" fill="#6b7280" text-anchor="middle">4.0</text>
  <text x="522" y="400" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">5.0</text>
  <text x="565" y="400" font-size="12" fill="#6b7280" text-anchor="middle">5.5</text>

  <!-- Назва осі X -->
  <text x="335" y="425" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вихідна потужність P_out (Вт), навантаження RL = 4 Ом</text>

  <!-- Крива THD+N від потужності -->
  <path d="M 105.0,340.5 L 110.8,343.4 L 116.6,346.1 L 122.5,348.5 L 128.3,350.5 L 134.1,352.0 L 139.9,352.9 L 145.8,353.5 L 151.6,354.0 L 157.4,354.4 L 163.2,354.7 L 169.1,354.9 L 174.9,354.9 L 180.7,354.8 L 186.5,354.5 L 192.3,354.0 L 198.2,353.5 L 204.0,352.8 L 209.8,352.1 L 215.6,351.3 L 221.5,350.5 L 227.3,349.5 L 233.1,348.3 L 238.9,346.9 L 244.7,345.3 L 250.6,343.6 L 256.4,341.6 L 262.2,339.4 L 268.0,336.6 L 273.9,333.1 L 279.7,328.8 L 285.5,323.8 L 291.3,317.0 L 297.2,307.2 L 303.0,296.8 L 308.8,287.4 L 314.6,277.9 L 320.4,268.7 L 326.3,260.0 L 332.1,252.4 L 337.9,245.5 L 343.7,239.1 L 349.6,233.0 L 355.4,227.3 L 361.2,222.0 L 367.0,217.0 L 372.8,212.2 L 378.7,207.6 L 384.5,203.2 L 390.3,199.0 L 396.1,195.0 L 402.0,191.2 L 407.8,187.5 L 413.6,183.9 L 419.4,180.5 L 425.3,177.2 L 431.1,174.0 L 436.9,171.0 L 442.7,168.0 L 448.5,165.2 L 454.4,162.4 L 460.2,159.8 L 466.0,157.3 L 471.8,154.8 L 477.7,152.6 L 483.5,150.6 L 489.3,148.7 L 495.1,146.8 L 500.9,145.0 L 506.8,143.0 L 512.6,140.9 L 518.4,138.5 L 524.2,135.8 L 530.1,132.7 L 535.9,129.2 L 541.7,125.6 L 547.5,121.8 L 553.4,118.1 L 559.2,114.1 L 565.0,110.0" fill="none" stroke="#2457d6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Маркери ключових точок -->
  <circle cx="287.3" cy="322.1" r="5" fill="#27ae60" stroke="white" stroke-width="2"/>
  <circle cx="330.7" cy="254.2" r="4.5" fill="#2457d6" stroke="white" stroke-width="1.5"/>
  <circle cx="521.6" cy="137.1" r="5" fill="#c0392b" stroke="white" stroke-width="2"/>

  <!-- Позначки всередині графіка -->
  <text x="195" y="275" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Плато чистого звуку</text>
  <text x="195" y="293" font-size="12" fill="#27ae60" text-anchor="middle">THD &lt; 0.1% (до 2.3 Вт)</text>
  <text x="195" y="309" font-size="12" fill="#6b7280" text-anchor="middle">робочий діапазон Hi-Fi</text>

  <text x="315" y="170" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">«Коліно» кліпінгу</text>
  <text x="315" y="186" font-size="12" fill="#6b7280" text-anchor="middle">2.5–2.8 Вт</text>
  <line x1="315" y1="192" x2="324" y2="242" stroke="#2457d6" stroke-width="1.2" marker-end="url(#arr-blue)"/>

  <text x="510" y="130" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">5.0 Вт @ 10% THD (кліпінг)</text>

</svg>
