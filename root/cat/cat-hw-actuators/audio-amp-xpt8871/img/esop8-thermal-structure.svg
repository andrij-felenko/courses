<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs>
  <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
  </marker>
  <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
  </marker>
  <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
  </marker>
</defs>
<rect x="0" y="0" width="960" height="460" fill="white"/>

<!-- Заголовок і підзаголовок -->
<text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Конструктивний розріз: стандартний SOIC-8 проти ESOP-8</text>
<text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Exposed Pad і теплові отвори знижують тепловий опір θ_JA з 140 до 45 °C/Вт</text>

<!-- ================= ЛІВА ПАНЕЛЬ: SOIC-8 ================= -->
<rect x="28" y="78" width="442" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

<!-- Бейдж лівої панелі -->
<rect x="42" y="88" width="414" height="28" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
<text x="249" y="107" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">SOIC-8: замкнений кристал без тепловідводу</text>

<!-- Підпис над корпусом -->
<text x="249" y="136" font-size="12" fill="#6b7280" text-anchor="middle">Пластиковий корпус (k ≈ 0.7 Вт/(м·К))</text>

<!-- Корпус SOIC-8 -->
<rect x="159" y="144" width="180" height="54" rx="4" fill="#e5e7eb" stroke="#64748b" stroke-width="1.5"/>

<!-- Кристал кремнію -->
<rect x="214" y="150" width="70" height="13" rx="2" fill="#2457d6" stroke="#1d4ed8" stroke-width="1"/>
<text x="249" y="161" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Кристал IC</text>

<!-- Кристалотримач (Paddle) -->
<rect x="204" y="163" width="90" height="6" rx="1" fill="#d97706" stroke="#b45309" stroke-width="0.8"/>

<!-- Шар пластику під кристалом (бар'єр) -->
<rect x="163" y="171" width="172" height="25" rx="2" fill="#fee2e2" stroke="#fca5a5" stroke-dasharray="3,3" stroke-width="1"/>
<text x="249" y="188" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Шар пластику (бар'єр)</text>

<!-- Виводи мікросхеми SOIC-8 (ніжки крило чайки) -->
<path d="M 204,166 L 142,166 L 132,214 L 112,214" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
<path d="M 294,166 L 356,166 L 366,214 L 386,214" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>

<!-- Слабкий відтік тепла по ніжках (стрілки) -->
<line x1="168" y1="162" x2="146" y2="162" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arr-red)"/>
<line x1="330" y1="162" x2="352" y2="162" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arr-red)"/>

<!-- Контактні площадки під ніжками на платі -->
<rect x="106" y="214" width="30" height="4" rx="1" fill="#b45309"/>
<rect x="362" y="214" width="30" height="4" rx="1" fill="#b45309"/>
<ellipse cx="121" cy="213" rx="8" ry="3" fill="#94a3b8"/>
<ellipse cx="377" cy="213" rx="8" ry="3" fill="#94a3b8"/>

<!-- Повітряний зазор -->
<text x="249" y="211" font-size="12" fill="#9ca3af" text-anchor="middle">Повітряний зазор (без контакту)</text>

<!-- Друкована плата SOIC-8 -->
<rect x="58" y="218" width="382" height="38" rx="2" fill="#e2ece4" stroke="#85a392" stroke-width="1.2"/>
<text x="249" y="241" font-size="12" fill="#4b5563" text-anchor="middle">Друкована плата (FR-4, k ≈ 0.25 Вт/(м·К))</text>

<!-- Підпис під платою SOIC-8 -->
<text x="249" y="276" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Тепло заблоковане: немає прямого шляху на плату</text>

<!-- Нижній інфоблок SOIC-8 -->
<rect x="42" y="292" width="414" height="134" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<rect x="56" y="302" width="386" height="22" rx="4" fill="#fdecea"/>
<text x="66" y="318" font-size="12" font-weight="bold" fill="#c0392b">Тепловий опір: θ_JA ≈ 140 °C/Вт (критично високий)</text>
<text x="66" y="340" font-size="12" fill="#1a1a1a">Шлях розсіювання: лише через 8 тонких ніжок рамки</text>
<text x="66" y="362" font-size="12" fill="#1a1a1a">Тепловий бар'єр: епоксидний пластик ізолює кристал</text>
<text x="66" y="384" font-size="12" fill="#1a1a1a">Макс. тривала потужність: до 0.8–1.0 Вт</text>
<rect x="56" y="396" width="386" height="20" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
<text x="249" y="411" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">НАСЛІДОК: перегрів та хрип при потужності > 1 Вт</text>


<!-- ================= ПРАВА ПАНЕЛЬ: ESOP-8 ================= -->
<rect x="490" y="78" width="442" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

<!-- Бейдж правої панелі -->
<rect x="504" y="88" width="414" height="28" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
<text x="711" y="107" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">ESOP-8: відкритий Exposed Pad і перехідні отвори</text>

<!-- Підпис над корпусом -->
<text x="711" y="136" font-size="12" fill="#6b7280" text-anchor="middle">Корпус ESOP-8 з відкритим мідним днищем</text>

<!-- Корпус ESOP-8 -->
<rect x="621" y="144" width="180" height="54" rx="4" fill="#e5e7eb" stroke="#64748b" stroke-width="1.5"/>

<!-- Кристал кремнію -->
<rect x="676" y="150" width="70" height="13" rx="2" fill="#2457d6" stroke="#1d4ed8" stroke-width="1"/>
<text x="711" y="161" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Кристал IC</text>

<!-- Відкритий мідний Exposed Pad -->
<rect x="666" y="163" width="90" height="35" rx="1" fill="#d97706" stroke="#b45309" stroke-width="1"/>
<text x="711" y="184" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Exposed Pad</text>

<!-- Паяний шов (припій під черевом) -->
<rect x="666" y="198" width="90" height="16" fill="#94a3b8" stroke="#64748b" stroke-width="1"/>
<text x="711" y="210" font-size="12" font-weight="bold" fill="#1e293b" text-anchor="middle">Припій</text>

<!-- Виводи мікросхеми ESOP-8 -->
<path d="M 666,166 L 604,166 L 594,214 L 574,214" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>
<path d="M 756,166 L 818,166 L 828,214 L 848,214" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"/>

<!-- Контактні площадки під ніжками на платі -->
<rect x="568" y="214" width="30" height="4" rx="1" fill="#b45309"/>
<rect x="824" y="214" width="30" height="4" rx="1" fill="#b45309"/>
<ellipse cx="583" cy="213" rx="8" ry="3" fill="#94a3b8"/>
<ellipse cx="839" cy="213" rx="8" ry="3" fill="#94a3b8"/>

<!-- Друкована плата ESOP-8 -->
<rect x="520" y="218" width="382" height="38" rx="2" fill="#e2ece4" stroke="#85a392" stroke-width="1.2"/>

<!-- Верхній мідний майданчик (Top Pad) -->
<rect x="660" y="214" width="102" height="4" rx="1" fill="#b45309"/>

<!-- Нижній мідний полігон (GND / Thermal Plane) -->
<rect x="610" y="256" width="202" height="5" rx="1" fill="#b45309"/>

<!-- 4 теплові перехідні отвори (Thermal Vias) -->
<rect x="678" y="218" width="8" height="38" fill="#b45309"/>
<rect x="680" y="218" width="4" height="38" fill="#cbd5e1"/>

<rect x="700" y="218" width="8" height="38" fill="#b45309"/>
<rect x="702" y="218" width="4" height="38" fill="#cbd5e1"/>

<rect x="722" y="218" width="8" height="38" fill="#b45309"/>
<rect x="724" y="218" width="4" height="38" fill="#cbd5e1"/>

<rect x="744" y="218" width="8" height="38" fill="#b45309"/>
<rect x="746" y="218" width="4" height="38" fill="#cbd5e1"/>

<!-- Стрілки розсіювання тепла по нижньому мідному полігону -->
<line x1="660" y1="258" x2="625" y2="258" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
<line x1="762" y1="258" x2="797" y2="258" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

<!-- Підписи на платі праворуч і ліворуч від vias -->
<text x="590" y="241" font-size="12" fill="#4b5563" text-anchor="middle">Плата FR-4</text>
<text x="830" y="241" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Thermal Vias</text>

<!-- Підпис під платою ESOP-8 -->
<text x="711" y="276" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Нижній мідний тепловідвідний полігон GND</text>

<!-- Нижній інфоблок ESOP-8 -->
<rect x="504" y="292" width="414" height="134" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
<rect x="518" y="302" width="386" height="22" rx="4" fill="#e9f7ef"/>
<text x="528" y="318" font-size="12" font-weight="bold" fill="#27ae60">Тепловий опір: θ_JA ≈ 45–50 °C/Вт (утричі нижчий)</text>
<text x="528" y="340" font-size="12" fill="#1a1a1a">Шлях тепла: Pad → Припій → Vias → Нижній полігон</text>
<text x="528" y="362" font-size="12" fill="#1a1a1a">Прямий металевий термоміст без пластикового бар'єру</text>
<text x="528" y="384" font-size="12" fill="#1a1a1a">Макс. тривала потужність: до 2.0–2.5 Вт</text>
<rect x="518" y="396" width="386" height="20" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
<text x="711" y="411" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">НОРМА: стабільна робота на 4 Ом без перегріву</text>
</svg>
