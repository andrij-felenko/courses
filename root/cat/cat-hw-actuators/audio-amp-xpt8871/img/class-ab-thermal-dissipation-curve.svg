  <line x1="157.8" y1="359.3" x2="157.8" y2="430" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="2,3"/>
  <line x1="230.7" y1="288.5" x2="230.7" y2="430" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="2,3"/>
  <line x1="376.3" y1="147.1" x2="376.3" y2="430" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="2,3"/>
  <!-- Криві PD(Pout) для трьох навантажень -->
  <path d="M 85.0,430.0 L 90.8,356.1 L 96.5,328.8 L 102.2,309.1 L 108.0,293.4 L 113.8,280.2 L 119.5,268.8 L 125.2,258.8 L 131.0,249.9 L 136.8,241.8 L 142.5,234.5 L 148.2,227.8 L 154.0,221.7 L 159.8,216.0 L 165.5,210.8 L 171.2,205.9 L 177.0,201.4 L 182.8,197.2 L 188.5,193.3 L 194.2,189.6 L 200.0,186.2 L 205.8,183.0 L 211.5,180.0 L 217.3,177.2 L 223.0,174.6 L 228.8,172.2 L 234.5,169.9 L 240.2,167.8 L 246.0,165.8 L 251.8,163.9 L 257.5,162.2 L 263.2,160.6 L 269.0,159.1 L 274.8,157.7 L 280.5,156.4 L 286.2,155.2 L 292.0,154.1 L 297.8,153.1 L 303.5,152.2 L 309.2,151.4 L 315.0,150.7 L 320.8,150.0 L 326.5,149.4 L 332.2,148.9 L 338.0,148.5 L 343.8,148.1 L 349.5,147.8 L 355.2,147.5 L 361.0,147.3 L 366.8,147.2 L 372.5,147.2 L 378.2,147.1 L 384.0,147.2 L 389.8,147.3 L 395.5,147.4 L 401.2,147.6 L 407.0,147.9 L 412.7,148.2 L 418.5,148.5 L 424.2,148.9 L 430.0,149.3 L 435.8,149.8 L 441.5,150.3 L 447.2,150.9 L 453.0,151.5 L 458.8,152.1 L 464.5,152.8 L 470.2,153.5 L 476.0,154.3 L 481.7,155.0 L 487.5,155.9 L 493.2,156.7 L 499.0,157.6 L 504.8,158.5 L 510.5,159.5 L 516.2,160.4 L 522.0,161.4 L 527.8,162.5 L 533.5,163.6 L 539.2,164.6 L 545.0,165.8 L 550.8,166.9 L 556.5,168.1 L 562.2,169.3 L 568.0,170.6 L 573.8,171.8 L 579.5,173.1 L 585.2,174.4 L 591.0,175.7 L 596.8,177.1 L 602.5,178.5 L 608.2,179.9 L 614.0,181.3 L 619.8,182.8 L 625.5,184.2 L 631.2,185.7 L 637.0,187.3 L 642.8,188.8 L 648.5,190.4 L 654.2,191.9 L 660.0,193.5" fill="none" stroke="#c0392b" stroke-width="3"/>
  <path d="M 85.0,430.0 L 90.8,379.4 L 96.5,361.7 L 102.2,349.4 L 108.0,339.9 L 113.8,332.2 L 119.5,325.8 L 125.2,320.4 L 131.0,315.7 L 136.8,311.6 L 142.5,308.1 L 148.2,305.0 L 154.0,302.3 L 159.8,299.9 L 165.5,297.9 L 171.2,296.1 L 177.0,294.5 L 182.8,293.2 L 188.5,292.1 L 194.2,291.1 L 200.0,290.3 L 205.8,289.7 L 211.5,289.2 L 217.3,288.9 L 223.0,288.7 L 228.8,288.6 L 234.5,288.6 L 240.2,288.7 L 246.0,288.9 L 251.8,289.3 L 257.5,289.7 L 263.2,290.2 L 269.0,290.7 L 274.8,291.4 L 280.5,292.1 L 286.2,292.9 L 292.0,293.8 L 297.8,294.7 L 303.5,295.7 L 309.2,296.8 L 315.0,297.9 L 320.8,299.1 L 326.5,300.3 L 332.2,301.5 L 338.0,302.9 L 343.8,304.2 L 349.5,305.7 L 355.2,307.1 L 361.0,308.6 L 366.8,310.2 L 372.5,311.8 L 378.3,313.4 L 384.0,315.1 L 389.8,316.8 L 395.5,318.5 L 401.2,320.3 L 407.0,322.1 L 412.8,323.9 L 418.5,325.8 L 424.2,327.7 L 430.0,329.7 L 435.8,331.6 L 441.5,333.6 L 447.3,335.7 L 453.0,337.7" fill="none" stroke="#2457d6" stroke-width="3"/>
  <path d="M 85.0,430.0 L 88.2,403.4 L 91.4,394.2 L 94.7,387.9 L 97.9,383.0 L 101.1,379.1 L 104.3,375.9 L 107.5,373.2 L 110.8,370.9 L 114.0,368.9 L 117.2,367.2 L 120.4,365.8 L 123.6,364.5 L 126.9,363.4 L 130.1,362.5 L 133.3,361.7 L 136.5,361.1 L 139.7,360.5 L 143.0,360.1 L 146.2,359.8 L 149.4,359.5 L 152.6,359.4 L 155.8,359.3 L 159.1,359.3 L 162.3,359.4 L 165.5,359.5 L 168.7,359.7 L 171.9,359.9 L 175.2,360.2 L 178.4,360.5 L 181.6,360.9 L 184.8,361.3 L 188.0,361.8 L 191.3,362.3 L 194.5,362.9 L 197.7,363.5 L 200.9,364.1 L 204.1,364.8 L 207.4,365.5 L 210.6,366.2 L 213.8,367.0 L 217.0,367.8 L 220.2,368.6 L 223.5,369.4 L 226.7,370.3 L 229.9,371.2 L 233.1,372.1 L 236.3,373.1 L 239.6,374.0 L 242.8,375.0 L 246.0,376.0" fill="none" stroke="#27ae60" stroke-width="3"/>
  <!-- Маркери точок пікового розсіювання -->
  <circle cx="376.3" cy="147.1" r="5" fill="#c0392b" stroke="white" stroke-width="2"/>
  <circle cx="230.7" cy="288.5" r="5" fill="#2457d6" stroke="white" stroke-width="2"/>
  <circle cx="157.8" cy="359.3" r="5" fill="#27ae60" stroke="white" stroke-width="2"/>
  <text x="376.3" y="135.1" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">2 Ом (пік 2.53 Вт)</text>
  <text x="230.7" y="276.5" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">4 Ом (пік 1.27 Вт)</text>
  <text x="157.8" y="347.3" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">8 Ом (пік 0.63 Вт)</text>
  <!-- Шкала Y: розсіювана потужність PD -->
  <text x="75" y="434.0" font-size="12" fill="#6b7280" text-anchor="end">0.0</text>
  <text x="75" y="378.2" font-size="12" fill="#6b7280" text-anchor="end">0.5</text>
  <text x="75" y="322.3" font-size="12" fill="#6b7280" text-anchor="end">1.0</text>
  <text x="75" y="266.5" font-size="12" fill="#6b7280" text-anchor="end">1.5</text>
  <text x="75" y="210.7" font-size="12" fill="#6b7280" text-anchor="end">2.0</text>
  <text x="75" y="154.8" font-size="12" fill="#6b7280" text-anchor="end">2.5</text>
  <text x="75" y="99.0" font-size="12" fill="#6b7280" text-anchor="end">3.0</text>
  <text x="85" y="83.0" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="start">PD, розсіювана теплова потужність на кристалі (Вт)</text>
  <!-- Шкала X: вихідна корисна потужність Pout -->
  <text x="85.0" y="448" font-size="12" fill="#6b7280" text-anchor="middle">0</text>
  <text x="200.0" y="448" font-size="12" fill="#6b7280" text-anchor="middle">1 Вт</text>
  <text x="315.0" y="448" font-size="12" fill="#6b7280" text-anchor="middle">2 Вт</text>
  <text x="430.0" y="448" font-size="12" fill="#6b7280" text-anchor="middle">3 Вт</text>
  <text x="545.0" y="448" font-size="12" fill="#6b7280" text-anchor="middle">4 Вт</text>
  <text x="660.0" y="448" font-size="12" fill="#6b7280" text-anchor="middle">5 Вт</text>
  <text x="372.5" y="472" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Pout, вихідна потужність звукового сигналу в навантаженні (Вт)</text>
  <text x="372.5" y="490" font-size="12" fill="#6b7280" text-anchor="middle">Напруга VDD = 5.0 В, синусоїдальний сигнал, мостова схема підключення (BTL)</text>
  <!-- Права панель: опис кривих навантаження -->
  <rect x="680" y="82" width="260" height="176" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="694" y="104" font-size="13" font-weight="700" fill="#1a1a1a">Криві навантаження (динаміки)</text>
  <line x1="694" y1="124" x2="716" y2="124" stroke="#c0392b" stroke-width="3"/>
  <circle cx="705" cy="124" r="3.5" fill="#c0392b"/>
  <text x="724" y="128" font-size="12" font-weight="700" fill="#c0392b">RL = 2 Ом (пік PD = 2.53 Вт)</text>
  <text x="724" y="143" font-size="12" fill="#6b7280">Критичний нагрів: лише ESOP-8</text>
  <line x1="694" y1="168" x2="716" y2="168" stroke="#2457d6" stroke-width="3"/>
  <circle cx="705" cy="168" r="3.5" fill="#2457d6"/>
  <text x="724" y="172" font-size="12" font-weight="700" fill="#2457d6">RL = 4 Ом (пік PD = 1.27 Вт)</text>
  <text x="724" y="187" font-size="12" fill="#6b7280">Перегрів у SOP-8 при Pout ≈ 1.3 Вт</text>
  <line x1="694" y1="212" x2="716" y2="212" stroke="#27ae60" stroke-width="3"/>
  <circle cx="705" cy="212" r="3.5" fill="#27ae60"/>
  <text x="724" y="216" font-size="12" font-weight="700" fill="#27ae60">RL = 8 Ом (пік PD = 0.63 Вт)</text>
  <text x="724" y="231" font-size="12" fill="#6b7280">Безпечно для будь-якого корпусу</text>
  <!-- Права панель: теплові пороги та формула піка -->
  <rect x="680" y="270" width="260" height="225" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="694" y="292" font-size="13" font-weight="700" fill="#1a1a1a">Теплові пороги корпусів (160 °C)</text>
  <rect x="694" y="306" width="232" height="42" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="702" y="322" font-size="12" font-weight="700" fill="#c0392b">Захист: TJ ≥ 160 °C (аварійне вимкнення)</text>
  <text x="702" y="338" font-size="12" fill="#c0392b">PD &gt; 2.5 Вт викликає тепловий тротлінг</text>
  <line x1="694" y1="364" x2="716" y2="364" stroke="#c0392b" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="724" y="368" font-size="12" font-weight="700" fill="#1a1a1a">ESOP-8: PD,max ≈ 2.5–3.0 Вт</text>
  <text x="724" y="383" font-size="12" fill="#6b7280">З відкритим падом на мідний полігон</text>
  <line x1="694" y1="410" x2="716" y2="410" stroke="#d97706" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="724" y="414" font-size="12" font-weight="700" fill="#1a1a1a">SOP-8: PD,max ≈ 1.1–1.2 Вт</text>
  <text x="724" y="429" font-size="12" fill="#6b7280">Стандартний корпус без тепловідводу</text>
  <text x="694" y="458" font-size="12" font-weight="700" fill="#2457d6">Формула піка нагріву BTL:</text>
  <text x="694" y="475" font-size="12" font-weight="700" fill="#1a1a1a">PD,max = 2 · VDD² / (π² · RL)</text>
  <text x="694" y="489" font-size="12" fill="#6b7280">Настає при Pout = (4 / π²) · Pmax</text>
</svg>
