  <line x1="85" y1="206.7" x2="660" y2="206.7" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="85" y1="150.8" x2="660" y2="150.8" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="85" y1="95.0" x2="660" y2="95.0" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="200.0" y1="95.0" x2="200.0" y2="430" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="315.0" y1="95.0" x2="315.0" y2="430" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="430.0" y1="95.0" x2="430.0" y2="430" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="545.0" y1="95.0" x2="545.0" y2="430" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="660.0" y1="95.0" x2="660.0" y2="430" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,3"/>
