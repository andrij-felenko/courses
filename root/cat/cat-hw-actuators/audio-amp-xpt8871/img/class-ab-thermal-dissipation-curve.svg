<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="520" fill="white"/>
  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Розсіювана теплова потужність XPT8871 залежно від вихідної потужності</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Максимум нагріву досягається при Pout ≈ 40% Pmax; навантаження 4 Ом та 2 Ом перегрівають SOP-8</text>
  <!-- Тло графіка та зони нагріву -->
