<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-left" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок (поля зверху >= 20 px) -->
  <text x="480" y="38" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Часова послідовність керування XPT8871 для усунення клацання</text>
  <text x="480" y="56" font-size="13" text-anchor="middle" fill="#6b7280">Затримка SHDN після стабілізації ЦАП і плавний заряд BYPASS утримують вихід на нулі</text>

  <!-- Основна панель -->
  <rect x="24" y="68" width="912" height="336" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Вкладена панель часового графіка -->
  <rect x="200" y="92" width="724" height="312" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Заголовок лівої колонки -->
  <text x="36" y="84" font-size="12" font-weight="bold" fill="#6b7280">СИГНАЛ / ЛІНІЯ</text>

  <!-- Заголовки фаз угорі -->
  <text x="245" y="84" font-size="12" font-weight="bold" text-anchor="middle" fill="#6b7280">1. Сон</text>
  <text x="355" y="84" font-size="12" font-weight="bold" text-anchor="middle" fill="#6b7280">2. Старт ЦАП</text>
  <text x="495" y="84" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">3. Пуск SHDN</text>
  <text x="665" y="84" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">4. Звук (DMA)</text>
  <text x="835" y="84" font-size="12" font-weight="bold" text-anchor="middle" fill="#6b7280">5. Вимкнення</text>

  <!-- Вертикальні розділювачі фаз -->
  <line x1="290" y1="92" x2="290" y2="404" stroke="#d0d7de" stroke-dasharray="4 3" stroke-width="1"/>
  <line x1="420" y1="92" x2="420" y2="404" stroke="#d0d7de" stroke-dasharray="4 3" stroke-width="1"/>
  <line x1="570" y1="92" x2="570" y2="404" stroke="#d0d7de" stroke-dasharray="4 3" stroke-width="1"/>
  <line x1="760" y1="92" x2="760" y2="404" stroke="#d0d7de" stroke-dasharray="4 3" stroke-width="1"/>

  <!-- Горизонтальні розділювачі доріжок -->
  <line x1="24" y1="170" x2="924" y2="170" stroke="#d0d7de" stroke-width="1"/>
  <line x1="24" y1="248" x2="924" y2="248" stroke="#d0d7de" stroke-width="1"/>
  <line x1="24" y1="326" x2="924" y2="326" stroke="#d0d7de" stroke-width="1"/>

  <!-- Ліва колонка: Назви сигналів -->
  <!-- Доріжка 1: ЦАП -->
  <text x="36" y="124" font-size="13" font-weight="bold" fill="#1a1a1a">ЦАП МК (V_DAC)</text>
  <text x="36" y="142" font-size="12" fill="#6b7280">вихід аудіосигналу</text>

  <!-- Доріжка 2: SHDN -->
  <text x="36" y="202" font-size="13" font-weight="bold" fill="#1a1a1a">Вхід SHDN</text>
  <text x="36" y="220" font-size="12" fill="#6b7280">дозвіл роботи (актив. 0)</text>

  <!-- Доріжка 3: BYPASS -->
  <text x="36" y="280" font-size="13" font-weight="bold" fill="#1a1a1a">Вивід BYPASS</text>
  <text x="36" y="298" font-size="12" fill="#6b7280">опорна напруга VDD/2</text>

  <!-- Доріжка 4: V_OUT -->
  <text x="36" y="358" font-size="13" font-weight="bold" fill="#27ae60">V_OUT (диференц.)</text>
  <text x="36" y="376" font-size="12" fill="#6b7280">напруга Vo+ − Vo−</text>

  <!-- ================= ДОРІЖКА 1: ЦАП ================= -->
  <line x1="200" y1="152" x2="924" y2="152" stroke="#edf2f7" stroke-width="1"/>
  <path d="M 200 152 L 290 152 L 290 126 L 570 126 C 581.4 116, 590.3 116, 601.7 126 C 613.1 136, 621.9 136, 633.3 126 C 644.7 116, 653.6 116, 665.0 126 C 676.4 136, 685.2 136, 696.7 126 C 708.1 116, 717.0 116, 728.4 126 C 739.8 136, 748.6 136, 760.0 126 L 850 126 L 850 152 L 910 152" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <text x="245" y="144" font-size="12" fill="#6b7280" text-anchor="middle">0 В (сон)</text>
  <text x="355" y="116" font-size="12" fill="#1a1a1a" text-anchor="middle">Зміщення VDD/2</text>
  <line x1="295" y1="150" x2="415" y2="150" stroke="#6b7280" stroke-width="1" marker-start="url(#arr-left)" marker-end="url(#arr-gray)"/>
  <text x="355" y="145" font-size="12" fill="#6b7280" text-anchor="middle">t_precharge</text>
  <text x="495" y="116" font-size="12" fill="#6b7280" text-anchor="middle">ЦАП стабільний</text>
  <text x="665" y="108" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Звуковий потік (DMA)</text>
  <text x="805" y="116" font-size="12" fill="#6b7280" text-anchor="middle">VDD/2</text>
  <text x="880" y="144" font-size="12" fill="#6b7280" text-anchor="middle">0 В</text>

  <!-- ================= ДОРІЖКА 2: SHDN ================= -->
  <path d="M 200 190 L 420 190 L 420 228 L 760 228 L 760 190 L 910 190" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="245" y="212" font-size="12" fill="#6b7280" text-anchor="middle">Сон</text>
  <text x="355" y="210" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">SHDN = 1 (Сон)</text>
  <text x="355" y="228" font-size="12" fill="#6b7280" text-anchor="middle">вихід заблоковано</text>
  <text x="495" y="198" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">SHDN = 0 (Старт)</text>
  <text x="495" y="216" font-size="12" fill="#6b7280" text-anchor="middle">дозвіл роботи УНЧ</text>
  <text x="665" y="216" font-size="12" fill="#6b7280" text-anchor="middle">Підсилювач активний</text>
  <text x="835" y="210" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">SHDN = 1 (Сон)</text>
  <text x="835" y="228" font-size="12" fill="#6b7280" text-anchor="middle">вимикання до ЦАП</text>

  <!-- ================= ДОРІЖКА 3: BYPASS ================= -->
  <line x1="200" y1="310" x2="924" y2="310" stroke="#edf2f7" stroke-width="1"/>
  <path d="M 200 310 L 420 310 C 455 310, 485 270, 530 270 L 570 270 L 760 270 C 805 270, 845 310, 890 310 L 910 310" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <text x="355" y="300" font-size="12" fill="#6b7280" text-anchor="middle">0 В (розряджено)</text>
  <text x="495" y="264" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Заряд C_bypass</text>
  <text x="495" y="320" font-size="12" fill="#6b7280" text-anchor="middle">експонента до VDD/2</text>
  <text x="665" y="294" font-size="12" fill="#6b7280" text-anchor="middle">Опорний рівень VDD/2</text>
  <text x="835" y="264" font-size="12" fill="#6b7280" text-anchor="middle">Розряд C_bypass</text>

  <!-- ================= ДОРІЖКА 4: V_OUT(диф) ================= -->
  <line x1="200" y1="366" x2="924" y2="366" stroke="#d0d7de" stroke-dasharray="3 3" stroke-width="1"/>
  <path d="M 200 366 L 570 366 C 581.4 348, 590.3 348, 601.7 366 C 613.1 384, 621.9 384, 633.3 366 C 644.7 348, 653.6 348, 665.0 366 C 676.4 384, 685.2 384, 696.7 366 C 708.1 348, 717.0 348, 728.4 366 C 739.8 384, 748.6 384, 760.0 366 L 910 366" fill="none" stroke="#27ae60" stroke-width="3"/>
  <text x="245" y="356" font-size="12" fill="#6b7280" text-anchor="middle">0 В</text>
  <text x="355" y="356" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">V_OUT = 0 В</text>
  <text x="355" y="386" font-size="12" fill="#6b7280" text-anchor="middle">тиша (УНЧ уві сні)</text>
  <text x="495" y="356" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Сплеск = 0 В (тиша)</text>
  <text x="495" y="386" font-size="12" fill="#6b7280" text-anchor="middle">Vo+ = Vo− (баланс BTL)</text>
  <text x="665" y="342" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Аудіосигнал (BTL)</text>
  <text x="835" y="356" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Тиша під час сну</text>
  <text x="835" y="386" font-size="12" fill="#6b7280" text-anchor="middle">0 В (клацання немає)</text>

  <!-- Підсумковий банер унизу (поля знизу >= 20 px) -->
  <rect x="24" y="414" width="912" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="480" y="430" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Результат: диференційна напруга під час перехідних процесів V_OUT(диф) = 0 В — клацання усунено</text>
</svg>
