  <text x="664" y="99" font-size="13" font-weight="bold" fill="#1a1a1a">Однополярні виходи (SE):</text>
  <text x="664" y="120" font-size="12" font-weight="bold" fill="#2457d6">• V_OUT+: фаза 0°, розмах 4,2 Vpp</text>
  <text x="664" y="140" font-size="12" font-weight="bold" fill="#c0392b">• V_OUT-: фаза 180° (протифаза)</text>
  <text x="664" y="160" font-size="12" fill="#1a1a1a">• Зсув робочої точки: VDD/2 = 2,5 В</text>
  <text x="664" y="180" font-size="12" fill="#6b7280">• Межі насичення: від 0,4 В до 4,6 В</text>
  <text x="664" y="200" font-size="12" fill="#c0392b">• До GND потрібен ємний C_out (DC!)</text>

