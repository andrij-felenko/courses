  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мостовий вихід (BTL): подвоєння розмаху напруги та компенсація зміщення</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Протифазні виходи усувають постійну складову навантаження та дають у 4 рази вищу потужність</text>

  <!-- ================= ВЕРХНЯ ПАНЕЛЬ: ПЛЕЧІ МОСТА (SE) ================= -->
  <rect x="24" y="68" width="912" height="158" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Заголовок верхньої панелі -->
  <text x="40" y="87" font-size="13" font-weight="bold" fill="#1a1a1a">1. Напруги виходів V_OUT+ та V_OUT- відносно землі (однополярне живлення VDD = 5 В)</text>

  <!-- Легенда верхнього графіка -->
  <line x1="40" y1="100" x2="62" y2="100" stroke="#2457d6" stroke-width="2.5"/>
  <text x="68" y="104" font-size="12" font-weight="bold" fill="#2457d6">V_OUT+ (прямий)</text>

  <line x1="185" y1="100" x2="207" y2="100" stroke="#c0392b" stroke-width="2.5"/>
  <text x="213" y="104" font-size="12" font-weight="bold" fill="#c0392b">V_OUT- (інверсний, 180°)</text>

  <line x1="385" y1="100" x2="407" y2="100" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="413" y="104" font-size="12" fill="#6b7280">VDD/2 = 2,5 В (зміщення)</text>

  <!-- Осцилографічний екран верхнього графіка -->
  <rect x="90" y="114" width="540" height="96" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Мітки осі Y -->
  <text x="84" y="126" font-size="12" fill="#6b7280" text-anchor="end">+5,0 В</text>
  <text x="84" y="166" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">+2,5 В</text>
  <text x="84" y="206" font-size="12" fill="#6b7280" text-anchor="end">0,0 В</text>

