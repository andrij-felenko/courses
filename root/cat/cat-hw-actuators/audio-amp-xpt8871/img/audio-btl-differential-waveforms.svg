  <text x="664" y="273" font-size="13" font-weight="bold" fill="#27ae60">Диференційний вихід (BTL):</text>
  <text x="664" y="296" font-size="12" font-weight="bold" fill="#1a1a1a">• Подвоєний розмах: V_pp = 8,4 В</text>
  <text x="664" y="318" font-size="12" fill="#1a1a1a">• V_DIFF = V_OUT+ − V_OUT-</text>
  <text x="664" y="340" font-size="12" font-weight="bold" fill="#27ae60">• Зсув V_DC = 0 В: дифузор у спокої</text>
