<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Послідовна інструментальна діагностика модуля XPT8871</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Перевірка DC-балансу захищає динамік, а осцилограма розрізняє кліпінг і самозбудження</text>

  <!-- ==================== ЕТАП 1: МУЛЬТИМЕТР ==================== -->
  <rect x="25" y="70" width="475" height="28" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="262" y="89" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">ЕТАП 1. Мультиметр: статичні потенціали виводів</text>

  <!-- Крок 1: VDD -->
  <rect x="25" y="110" width="225" height="66" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="137" y="127" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Живлення VDD (вивід 6)</text>
  <text x="137" y="145" font-size="12" fill="#1a1a1a" text-anchor="middle">Вимір: VDD відносно GND</text>
  <text x="137" y="163" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Умова: 2.0 В ≤ VDD ≤ 5.5 В?</text>

  <line x1="250" y1="143" x2="295" y2="143" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="272" y="136" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Ні</text>

  <rect x="295" y="110" width="205" height="66" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="397" y="127" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Збій живлення (&lt; 2.0 В)</text>
  <text x="397" y="145" font-size="12" fill="#1a1a1a" text-anchor="middle">Джерело слабке або просідає</text>
  <text x="397" y="163" font-size="12" fill="#1a1a1a" text-anchor="middle">Дія: C_VDD ≥ 10 мкФ + 0.1 мкФ</text>

  <line x1="137" y1="176" x2="137" y2="198" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="154" y="191" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">Так</text>

  <!-- Крок 2: SHDN -->
  <rect x="25" y="198" width="225" height="66" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="137" y="215" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">2. Керування SHDN (вивід 1)</text>
  <text x="137" y="233" font-size="12" fill="#1a1a1a" text-anchor="middle">Вимір: напруга на виводі 1</text>
  <text x="137" y="251" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Умова: V(SHDN) ≤ 0.4 В (LOW)?</text>

  <line x1="250" y1="231" x2="295" y2="231" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="272" y="224" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Ні</text>

  <rect x="295" y="198" width="205" height="66" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="397" y="215" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">SHDN ≥ 1.4 В (режим сну)</text>
  <text x="397" y="233" font-size="12" fill="#1a1a1a" text-anchor="middle">Мікросхема спить (I &lt; 1 мкА)</text>
  <text x="397" y="251" font-size="12" fill="#1a1a1a" text-anchor="middle">Дія: притягнути SHDN до GND</text>

  <line x1="137" y1="264" x2="137" y2="286" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="154" y="279" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">Так</text>

  <!-- Крок 3: BYPASS -->
  <rect x="25" y="286" width="225" height="66" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="137" y="303" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">3. Опора BYPASS (вивід 2)</text>
  <text x="137" y="321" font-size="12" fill="#1a1a1a" text-anchor="middle">Вимір: вивід 2 відносно GND</text>
  <text x="137" y="339" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Умова: V(BYPASS) ≈ VDD / 2?</text>

  <line x1="250" y1="319" x2="295" y2="319" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="272" y="312" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Ні</text>

  <rect x="295" y="286" width="205" height="66" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="397" y="303" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Збій опори (0 В або = VDD)</text>
  <text x="397" y="321" font-size="12" fill="#1a1a1a" text-anchor="middle">Пробій CB або подільника</text>
  <text x="397" y="339" font-size="12" fill="#1a1a1a" text-anchor="middle">Дія: перевірити CB (1 мкФ) / IC</text>

  <line x1="137" y1="352" x2="137" y2="374" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="154" y="367" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">Так</text>

  <!-- Крок 4: Баланс виходів VO1, VO2 -->
  <rect x="25" y="374" width="225" height="66" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="137" y="391" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">4. Виходи VO1, VO2 (вив. 5, 8)</text>
  <text x="137" y="409" font-size="12" fill="#1a1a1a" text-anchor="middle">Вимір: DC на виводах 5 і 8</text>
  <text x="137" y="427" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Умова: обидва VDD/2 та ΔV≈0?</text>

  <line x1="250" y1="407" x2="295" y2="407" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="272" y="400" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Ні</text>

  <rect x="295" y="374" width="205" height="66" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="397" y="391" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Зсув DC: постійний струм!</text>
  <text x="397" y="409" font-size="12" fill="#1a1a1a" text-anchor="middle">Заборонено заземлювати виходи</text>
  <text x="397" y="427" font-size="12" fill="#1a1a1a" text-anchor="middle">Дія: зняти динамік, IC несправна</text>

  <line x1="137" y1="440" x2="137" y2="462" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="154" y="455" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">Так</text>

  <!-- Підсумок DC: перехід до ETAP 2 -->
  <rect x="25" y="462" width="475" height="76" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.4"/>
  <text x="262" y="484" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">✓ Усі DC-напруги в нормі: симетрія VDD/2 збережена</text>
  <text x="262" y="505" font-size="12" fill="#1a1a1a" text-anchor="middle">Постійна складова на виходах відсутня (ΔV = 0 В) — динамік у безпеці</text>
  <text x="262" y="525" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Переходьте до контролю форми сигналу під навантаженням (ЕТАП 2) →</text>

  <!-- Зв'язок між Етапом 1 та Етапом 2 -->
  <path d="M 500,501 L 510,501 L 510,137 L 518,137" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- ==================== ЕТАП 2: ОСЦИЛОГРАФ ==================== -->
  <rect x="520" y="70" width="415" height="28" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="727" y="89" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">ЕТАП 2. Осцилограф: динамічний сигнал на динаміку</text>

  <!-- Тестовий стенд -->
  <rect x="520" y="110" width="415" height="54" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="727" y="132" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вхід: тестовий синус 1 кГц | Навантаження: динамік 4–8 Ом</text>
  <text x="727" y="151" font-size="12" fill="#6b7280" text-anchor="middle">Контроль форми сигналу осцилографом на виводах VO1 і VO2</text>

  <!-- Картка 1: Норма -->
  <rect x="520" y="184" width="415" height="104" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <rect x="532" y="196" width="90" height="80" rx="4" fill="#1a1a1a"/>
  <line x1="534" y1="236" x2="620" y2="236" stroke="#334155" stroke-dasharray="2,2" stroke-width="1"/>
  <line x1="577" y1="198" x2="577" y2="274" stroke="#334155" stroke-dasharray="2,2" stroke-width="1"/>
  <path d="M 542,236 C 551,198 568,198 577,236 C 586,274 603,274 612,236" fill="none" stroke="#27ae60" stroke-width="2.2" stroke-linecap="round"/>

  <text x="635" y="206" font-size="13" font-weight="bold" fill="#27ae60">1. Норма: чиста синусоїда</text>
  <text x="635" y="226" font-size="12" fill="#1a1a1a">Форма: симетричний неспотворений сигнал</text>
  <text x="635" y="246" font-size="12" fill="#1a1a1a">Стан: мікросхема та її обв'язка справні</text>
  <text x="635" y="266" font-size="12" font-weight="bold" fill="#27ae60">Дія: тракт повністю готовий до роботи</text>

  <!-- Картка 2: Кліпінг -->
  <rect x="520" y="306" width="415" height="104" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <rect x="532" y="318" width="90" height="80" rx="4" fill="#1a1a1a"/>
  <line x1="534" y1="358" x2="620" y2="358" stroke="#334155" stroke-dasharray="2,2" stroke-width="1"/>
  <line x1="577" y1="320" x2="577" y2="396" stroke="#334155" stroke-dasharray="2,2" stroke-width="1"/>
  <path d="M 542,358 L 551,336 L 568,336 L 577,358 L 586,380 L 603,380 L 612,358" fill="none" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="635" y="328" font-size="13" font-weight="bold" fill="#c0392b">2. Кліпінг: зрізання верхівок синуса</text>
  <text x="635" y="348" font-size="12" fill="#1a1a1a">Причина: перевантаження входу або зависокий Av</text>
  <text x="635" y="368" font-size="12" fill="#1a1a1a">Симптом: хрип на піках, нестача напруги VDD</text>
  <text x="635" y="388" font-size="12" font-weight="bold" fill="#c0392b">Дія: зменшити сигнал, знизити Av або підняти VDD</text>

  <!-- Картка 3: Самозбудження -->
  <rect x="520" y="428" width="415" height="104" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <rect x="532" y="440" width="90" height="80" rx="4" fill="#1a1a1a"/>
  <line x1="534" y1="480" x2="620" y2="480" stroke="#334155" stroke-dasharray="2,2" stroke-width="1"/>
  <line x1="577" y1="442" x2="577" y2="518" stroke="#334155" stroke-dasharray="2,2" stroke-width="1"/>
  <path d="M 542,480 Q 547,455 553,465 Q 559,445 565,475 Q 571,450 577,480 Q 583,510 589,485 Q 595,515 601,495 Q 607,505 612,480" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-linecap="round"/>

  <text x="635" y="450" font-size="13" font-weight="bold" fill="#c0392b">3. Самозбудження: ВЧ-генерація / «шуба»</text>
  <text x="635" y="470" font-size="12" fill="#1a1a1a">Причина: відсутній C_VDD 0.1 мкФ біля виводу 6</text>
  <text x="635" y="490" font-size="12" fill="#1a1a1a">Симптом: миттєвий перегрів IC навіть без звуку</text>
  <text x="635" y="510" font-size="12" font-weight="bold" fill="#c0392b">Дія: додати кераміку на VDD, вкоротити проводи</text>
</svg>
