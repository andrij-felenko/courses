<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кінцевий автомат керування живленням аудіоплеєра на XPT8871</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">Таймаути стабілізації та відкладений сон усувають клацання і заощаджують енергію</text>

  <!-- 1. Стан SLEEP (Top-Left) -->
  <rect x="50" y="85" width="260" height="120" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="65" y="108" font-size="14" font-weight="bold" fill="#1a1a1a">1. SLEEP</text>
  <text x="135" y="108" font-size="12" fill="#6b7280">(глибокий сон)</text>
  <line x1="65" y1="117" x2="295" y2="117" stroke="#d0d7de" stroke-width="1"/>
  <text x="65" y="135" font-size="12" fill="#1a1a1a">• SHDN = 0 (підсилювач вимкнено)</text>
  <text x="65" y="153" font-size="12" fill="#1a1a1a">• Споживання: I &lt; 1 мкА</text>
  <text x="65" y="171" font-size="12" fill="#6b7280">• Аудіобуфер порожній, ЦАП off</text>
  <text x="65" y="189" font-size="12" fill="#6b7280">• Очікування запиту на звук</text>

  <!-- 2. Стан WAKING (Top-Right) -->
  <rect x="650" y="85" width="260" height="120" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="665" y="108" font-size="14" font-weight="bold" fill="#2457d6">2. WAKING</text>
  <text x="745" y="108" font-size="12" fill="#6b7280">(прокидання)</text>
  <line x1="665" y1="117" x2="895" y2="117" stroke="#2457d6" stroke-opacity="0.3" stroke-width="1"/>
  <text x="665" y="135" font-size="12" fill="#1a1a1a">• SHDN = 1 (активація живлення)</text>
  <text x="665" y="153" font-size="12" fill="#1a1a1a">• Заряд C_bypass до VDD/2</text>
  <text x="665" y="171" font-size="12" fill="#2457d6">• Preload аудіобуфера (DMA)</text>
  <text x="665" y="189" font-size="12" fill="#6b7280">• Очікування таймауту T_wake</text>

  <!-- 3. Стан PLAYING (Bottom-Right) -->
  <rect x="650" y="315" width="260" height="120" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="665" y="338" font-size="14" font-weight="bold" fill="#27ae60">3. PLAYING</text>
  <text x="755" y="338" font-size="12" fill="#6b7280">(відтворення)</text>
  <line x1="665" y1="347" x2="895" y2="347" stroke="#27ae60" stroke-opacity="0.3" stroke-width="1"/>
  <text x="665" y="365" font-size="12" fill="#1a1a1a">• SHDN = 1 (підсилювач активний)</text>
  <text x="665" y="383" font-size="12" fill="#1a1a1a">• Потік семплів: DMA / ISR таймер</text>
  <text x="665" y="401" font-size="12" fill="#27ae60">• Динамік 4–8 Ом (потужність до 5 Вт)</text>
  <text x="665" y="419" font-size="12" fill="#6b7280">• Безперервне поповнення буфера</text>

  <!-- 4. Стан IDLE_DRAIN (Bottom-Left) -->
  <rect x="50" y="315" width="260" height="120" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="65" y="338" font-size="14" font-weight="bold" fill="#1a1a1a">4. IDLE_DRAIN</text>
  <text x="175" y="338" font-size="12" fill="#6b7280">(очікування)</text>
  <line x1="65" y1="347" x2="295" y2="347" stroke="#d0d7de" stroke-width="1"/>
  <text x="65" y="365" font-size="12" fill="#1a1a1a">• SHDN = 1 (живлення НЕ знімається)</text>
  <text x="65" y="383" font-size="12" fill="#1a1a1a">• Вихід ЦАП: рівень тиші (VDD/2)</text>
  <text x="65" y="401" font-size="12" fill="#6b7280">• Відлік таймауту паузи T_idle</text>
  <text x="65" y="419" font-size="12" fill="#6b7280">• Захист від клацання між треками</text>

  <!-- Центральна інфопанель послідовності Anti-Pop -->
  <rect x="330" y="215" width="300" height="60" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="237" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Послідовність усунення клацання («Anti-Pop»):</text>
  <text x="480" y="257" font-size="12" fill="#2457d6" text-anchor="middle">1. Preload буфера → 2. SHDN = 1 → 3. T_wake → 4. Аудіо</text>

  <!-- Перехід 1: SLEEP -> WAKING (Top horizontal) -->
  <line x1="310" y1="130" x2="642" y2="130" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <text x="480" y="99" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Подія: виклик play() / надходження семплів</text>
  <text x="480" y="115" font-size="12" fill="#2457d6" text-anchor="middle">Дія: заповнення буфера (preload), SHDN = 1</text>
  <text x="480" y="154" font-size="12" fill="#1a1a1a" text-anchor="middle">Вмикання аналогової частини перед звуком</text>
  <text x="480" y="170" font-size="12" fill="#6b7280" text-anchor="middle">усуває пускове клацання («click-and-pop»)</text>

  <!-- Перехід 2: WAKING -> PLAYING (Right vertical) -->
  <line x1="700" y1="205" x2="700" y2="307" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="715" y="242" font-size="12" font-weight="bold" fill="#1a1a1a">Таймаут T_wake (30–50 мс)</text>
  <text x="715" y="260" font-size="12" fill="#6b7280">V_bias (VDD/2) стабільна</text>
  <text x="715" y="278" font-size="12" fill="#27ae60">Дія: запуск DMA / ШІМ</text>

  <!-- Перехід 3: PLAYING -> IDLE_DRAIN (Bottom horizontal, lower, right-to-left) -->
  <line x1="650" y1="405" x2="318" y2="405" stroke="#6b7280" stroke-width="2" marker-end="url(#arr-gray)"/>
  <text x="480" y="374" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Подія: аудіопотік завершено (кінець треку / EOF)</text>
  <text x="480" y="390" font-size="12" fill="#6b7280" text-anchor="middle">Дія: зупинка потоку DMA, запуск таймера T_idle</text>

  <!-- Перехід 4: IDLE_DRAIN -> PLAYING (Bottom horizontal, upper, left-to-right) -->
  <line x1="310" y1="345" x2="642" y2="345" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="480" y="314" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Швидкий старт: новий play() до таймауту</text>
  <text x="480" y="330" font-size="12" fill="#1a1a1a" text-anchor="middle">Миттєвий запуск: SHDN уже 1, без затримки T_wake</text>

  <!-- Перехід 5: IDLE_DRAIN -> SLEEP (Left vertical) -->
  <line x1="110" y1="315" x2="110" y2="213" stroke="#6b7280" stroke-width="2" marker-end="url(#arr-gray)"/>
  <text x="125" y="242" font-size="12" font-weight="bold" fill="#1a1a1a">Таймаут T_idle (2–3 с)</text>
  <text x="125" y="260" font-size="12" fill="#6b7280">Пауза: звук відсутній</text>
  <text x="125" y="278" font-size="12" fill="#1a1a1a">Дія: SHDN = 0 (I &lt; 1 мкА)</text>
</svg>
