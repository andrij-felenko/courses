<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="960" height="460" fill="white"/>

<!-- Заголовок і підзаголовок -->
<text x="480" y="38" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Синтезована принципова схема аудіокаскаду XPT8871 (BTL, 5 Вт)</text>
<text x="480" y="58" font-size="13" text-anchor="middle" fill="#6b7280">Мостове диференціальне ввімкнення 4 Ом динаміка до ЦАП ESP32 без вихідного конденсатора</text>

<!-- БЛОК 1: ESP32 -->
<rect x="30" y="85" width="115" height="210" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<text x="87" y="112" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">ESP32</text>
<text x="87" y="129" font-size="12" text-anchor="middle" fill="#6b7280">Контролер</text>

<!-- Піни ESP32 -->
<text x="135" y="146" font-size="12" text-anchor="end" fill="#6b7280">SHDN Ctrl</text>
<text x="135" y="161" font-size="12" font-weight="bold" text-anchor="end" fill="#1a1a1a">GPIO22</text>
<line x1="145" y1="156" x2="165" y2="156" stroke="#1a1a1a" stroke-width="2"/>

<text x="135" y="209" font-size="12" font-weight="bold" text-anchor="end" fill="#6b7280">GND</text>
<line x1="145" y1="205" x2="165" y2="205" stroke="#1a1a1a" stroke-width="2"/>
<line x1="165" y1="205" x2="165" y2="215" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="158" y1="215" x2="172" y2="215" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="161" y1="219" x2="169" y2="219" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="163" y1="223" x2="167" y2="223" stroke="#1a1a1a" stroke-width="1.5"/>

<text x="135" y="254" font-size="12" text-anchor="end" fill="#6b7280">DAC1 Out</text>
<text x="135" y="269" font-size="12" font-weight="bold" text-anchor="end" fill="#2457d6">GPIO25</text>
<line x1="145" y1="265" x2="165" y2="265" stroke="#2457d6" stroke-width="2"/>

<!-- ЛІНІЯ SHDN ТА PULL-UP -->
<line x1="165" y1="156" x2="360" y2="156" stroke="#1a1a1a" stroke-width="2"/>
<circle cx="230" cy="156" r="3" fill="#1a1a1a"/>
<line x1="230" y1="156" x2="230" y2="136" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="224" y="104" width="12" height="32" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="230" y1="104" x2="230" y2="92" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="230" cy="92" r="2.5" fill="#2457d6"/>
<text x="230" y="85" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">+3.3V</text>
<text x="242" y="124" font-size="12" fill="#6b7280">R_PU 100 кОм</text>
<text x="295" y="149" font-size="12" text-anchor="middle" fill="#1a1a1a">SHDN (EN)</text>

<!-- АУДІО ВХІД: C_IN ТА R_IN -->
<line x1="165" y1="265" x2="185" y2="265" stroke="#2457d6" stroke-width="2"/>

<!-- C_IN (0.47 мкФ) -->
<line x1="191" y1="253" x2="191" y2="277" stroke="#1a1a1a" stroke-width="2"/>
<line x1="197" y1="253" x2="197" y2="277" stroke="#1a1a1a" stroke-width="2"/>
<line x1="185" y1="265" x2="191" y2="265" stroke="#1a1a1a" stroke-width="2"/>
<line x1="197" y1="265" x2="235" y2="265" stroke="#1a1a1a" stroke-width="2"/>
<text x="194" y="244" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">C_IN</text>
<text x="194" y="294" font-size="12" text-anchor="middle" fill="#2457d6">0.47 мкФ</text>

<!-- R_IN (20 кОм) -->
<rect x="235" y="259" width="36" height="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="271" y1="265" x2="310" y2="265" stroke="#1a1a1a" stroke-width="2"/>
<text x="253" y="244" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">R_IN</text>
<text x="253" y="294" font-size="12" text-anchor="middle" fill="#2457d6">20 кОм</text>

<!-- Вузол зворотного зв'язку N_IN -->
<circle cx="310" cy="265" r="3" fill="#1a1a1a"/>
<line x1="310" y1="265" x2="360" y2="265" stroke="#1a1a1a" stroke-width="2"/>
<line x1="310" y1="265" x2="310" y2="315" stroke="#1a1a1a" stroke-width="2"/>

<!-- BYPASS ТА C_BYP -->
<line x1="360" y1="190" x2="320" y2="190" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="360" y1="225" x2="320" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="320" y1="190" x2="320" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="320" cy="207" r="2.5" fill="#1a1a1a"/>
<line x1="320" y1="207" x2="285" y2="207" stroke="#1a1a1a" stroke-width="1.5"/>

<!-- Конденсатор C_BYP -->
<line x1="285" y1="197" x2="285" y2="217" stroke="#1a1a1a" stroke-width="2"/>
<line x1="279" y1="197" x2="279" y2="217" stroke="#1a1a1a" stroke-width="2"/>
<line x1="279" y1="207" x2="260" y2="207" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="260" y1="200" x2="260" y2="214" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="256" y1="203" x2="256" y2="211" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="252" y1="205" x2="252" y2="209" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="282" y="190" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">C_BYP</text>
<text x="282" y="232" font-size="12" text-anchor="middle" fill="#2457d6">1.0 мкФ</text>

<!-- БЛОК МІКРОСХЕМИ XPT8871 (ESOP-8) -->
<rect x="360" y="95" width="220" height="190" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
<text x="470" y="122" font-size="15" font-weight="bold" text-anchor="middle" fill="#1a1a1a">U1: XPT8871</text>
<text x="470" y="139" font-size="12" text-anchor="middle" fill="#6b7280">ESOP-8 Мостовий BTL 5 Вт</text>

<!-- Thermal Pad (EPAD) -->
<rect x="430" y="160" width="80" height="66" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="470" y="180" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">EXPOSED PAD</text>
<text x="470" y="196" font-size="12" text-anchor="middle" fill="#27ae60">Тепловий пад</text>
<text x="470" y="212" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Полігон GND</text>

<!-- Піни XPT8871: Ліва сторона -->
<text x="368" y="160" font-size="12" font-weight="bold" fill="#1a1a1a">1 SHDN</text>
<text x="368" y="194" font-size="12" font-weight="bold" fill="#1a1a1a">2 BYPASS</text>
<text x="368" y="229" font-size="12" font-weight="bold" fill="#1a1a1a">3 IN+</text>
<text x="368" y="269" font-size="12" font-weight="bold" fill="#1a1a1a">4 IN-</text>

<!-- Піни XPT8871: Права сторона -->
<text x="572" y="160" font-size="12" font-weight="bold" text-anchor="end" fill="#1a1a1a">VO- 8</text>
<text x="572" y="194" font-size="12" font-weight="bold" text-anchor="end" fill="#1a1a1a">GND 7</text>
<text x="572" y="229" font-size="12" font-weight="bold" text-anchor="end" fill="#1a1a1a">VDD 6</text>
<text x="572" y="269" font-size="12" font-weight="bold" text-anchor="end" fill="#1a1a1a">VO+ 5</text>

<!-- КОЛО ЗВОРОТНОГО ЗВ'ЯЗКУ R_F -->
<line x1="310" y1="315" x2="445" y2="315" stroke="#1a1a1a" stroke-width="2"/>
<rect x="445" y="309" width="40" height="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="485" y1="315" x2="615" y2="315" stroke="#1a1a1a" stroke-width="2"/>
<line x1="615" y1="315" x2="615" y2="265" stroke="#1a1a1a" stroke-width="2"/>
<circle cx="615" cy="265" r="3" fill="#1a1a1a"/>
<text x="465" y="304" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">R_F = 20 кОм</text>
<text x="465" y="333" font-size="12" text-anchor="middle" fill="#6b7280">Зворотний зв'язок (Av = 2)</text>

<!-- ВИХОДИ НА ДИНАМІК ТА ЖИВЛЕННЯ -->
<!-- Pin 8 (VO-) до динаміка -->
<line x1="580" y1="156" x2="745" y2="156" stroke="#2457d6" stroke-width="2"/>
<line x1="745" y1="156" x2="745" y2="192" stroke="#2457d6" stroke-width="2"/>
<line x1="745" y1="192" x2="760" y2="192" stroke="#2457d6" stroke-width="2"/>
<text x="660" y="148" font-size="12" font-weight="bold" fill="#2457d6">VO- (Фаза 180°)</text>

<!-- Pin 5 (VO+) до динаміка -->
<line x1="580" y1="265" x2="615" y2="265" stroke="#1a1a1a" stroke-width="2"/>
<line x1="615" y1="265" x2="745" y2="265" stroke="#2457d6" stroke-width="2"/>
<line x1="745" y1="265" x2="745" y2="228" stroke="#2457d6" stroke-width="2"/>
<line x1="745" y1="228" x2="760" y2="228" stroke="#2457d6" stroke-width="2"/>
<text x="660" y="280" font-size="12" font-weight="bold" fill="#2457d6">VO+ (Фаза 0°)</text>

<!-- Pin 7 (GND) та Pin 6 (VDD) шини -->
<line x1="580" y1="190" x2="705" y2="190" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="580" y1="225" x2="705" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>

<!-- C_VDD1 (10 мкФ тантал) -->
<circle cx="635" cy="190" r="2.5" fill="#1a1a1a"/>
<circle cx="635" cy="225" r="2.5" fill="#1a1a1a"/>
<line x1="635" y1="190" x2="635" y2="204" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="627" y1="204" x2="643" y2="204" stroke="#1a1a1a" stroke-width="2"/>
<line x1="627" y1="210" x2="643" y2="210" stroke="#1a1a1a" stroke-width="2"/>
<line x1="635" y1="210" x2="635" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="646" y="215" font-size="12" fill="#1a1a1a">+</text>
<text x="635" y="182" font-size="12" text-anchor="middle" fill="#1a1a1a">10 мкФ</text>
<text x="635" y="240" font-size="12" text-anchor="middle" fill="#6b7280">тантал</text>

<!-- C_VDD2 (0.1 мкФ кераміка) -->
<circle cx="675" cy="190" r="2.5" fill="#1a1a1a"/>
<circle cx="675" cy="225" r="2.5" fill="#1a1a1a"/>
<line x1="675" y1="190" x2="675" y2="204" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="667" y1="204" x2="683" y2="204" stroke="#1a1a1a" stroke-width="2"/>
<line x1="667" y1="210" x2="683" y2="210" stroke="#1a1a1a" stroke-width="2"/>
<line x1="675" y1="210" x2="675" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="675" y="182" font-size="12" text-anchor="middle" fill="#1a1a1a">0.1 мкФ</text>
<text x="675" y="240" font-size="12" text-anchor="middle" fill="#6b7280">кераміка</text>

<!-- Клеми живлення +5V та GND -->
<circle cx="705" cy="225" r="2.5" fill="#2457d6"/>
<text x="712" y="229" font-size="12" font-weight="bold" fill="#2457d6">+5V (VDD)</text>

<line x1="705" y1="190" x2="718" y2="190" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="718" y1="183" x2="718" y2="197" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="722" y1="186" x2="722" y2="194" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="726" y1="188" x2="726" y2="192" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="712" y="177" font-size="12" text-anchor="middle" fill="#6b7280">GND</text>

<!-- ДИНАМІК (НАВАНТАЖЕННЯ 4 ОМ) -->
<rect x="760" y="185" width="22" height="50" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<polygon points="782,192 815,170 815,250 782,228" fill="#eaf0fd" stroke="#1a1a1a" stroke-width="1.5"/>
<path d="M 823 194 A 20 20 0 0 1 823 226" fill="none" stroke="#2457d6" stroke-width="2" stroke-linecap="round"/>
<path d="M 830 186 A 32 32 0 0 1 830 234" fill="none" stroke="#2457d6" stroke-width="2" stroke-linecap="round"/>

<text x="815" y="138" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">SPK1: Динамік 4 Ом</text>
<text x="815" y="154" font-size="12" text-anchor="middle" fill="#2457d6">3–5 Вт (BTL навантаження)</text>

<text x="815" y="272" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Без вихідного C</text>
<text x="815" y="289" font-size="12" text-anchor="middle" fill="#6b7280">V_diff = 2 · V_peak</text>

<!-- НИЖНІ ПЛАШКИ З ФОРМУЛАМИ ТА РОЗРАХУНКАМИ -->
<!-- Плашка 1: Підсилення -->
<rect x="25" y="346" width="290" height="92" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<text x="40" y="366" font-size="13" font-weight="bold" fill="#1a1a1a">Коефіцієнт підсилення (Av)</text>
<text x="40" y="386" font-size="12" font-weight="bold" fill="#2457d6">Av = 2 · (R_F / R_IN) = 2 · 1 = 2 (6 дБ)</text>
<text x="40" y="406" font-size="12" fill="#1a1a1a">Мостовий BTL подвоює розмах напруги</text>
<text x="40" y="426" font-size="12" fill="#6b7280">R_F = 20 кОм задає підсилення Av = 2</text>

<!-- Плашка 2: Гранична частота -->
<rect x="335" y="346" width="290" height="92" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<text x="350" y="366" font-size="13" font-weight="bold" fill="#1a1a1a">Нижня частота зрізу (fc)</text>
<text x="350" y="386" font-size="12" font-weight="bold" fill="#2457d6">fc = 1 / (2π · R_IN · C_IN)</text>
<text x="350" y="406" font-size="12" fill="#1a1a1a">= 1 / (2π · 20 кОм · 0.47 мкФ) ≈ 16.9 Гц</text>
<text x="350" y="426" font-size="12" fill="#6b7280">Пропускає повний спектр аудіо від 17 Гц</text>

<!-- Плашка 3: Потужність -->
<rect x="645" y="346" width="290" height="92" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<text x="660" y="366" font-size="13" font-weight="bold" fill="#1a1a1a">Вихідна потужність (P_BTL)</text>
<text x="660" y="386" font-size="12" font-weight="bold" fill="#2457d6">P_BTL ≈ (VDD - 2·V_sat)² / (2 · R_L)</text>
<text x="660" y="406" font-size="12" fill="#1a1a1a">≈ 5² / (2 · 4 Ом) = 3.12 Вт (THD = 1%)</text>
<text x="660" y="426" font-size="12" font-weight="bold" fill="#27ae60">До 5.0 Вт при THD = 10% (4 Ом, 5 В)</text>
</svg>
