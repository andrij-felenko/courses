<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="28" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Підключення XPT8871 до мікроконтролера з RC-фільтром та SHDN</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Відновлювальний фільтр усуває ШІМ-шум, а керування SHDN запобігає клацанням (click-and-pop)</text>

  <!-- Блок 1: Мікроконтролер (MCU) -->
  <rect x="35" y="70" width="140" height="290" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="105" y="92" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">МІКРОКОНТРОЛЕР</text>
  <text x="105" y="106" font-size="12" fill="#6b7280" text-anchor="middle">(ESP32 / STM32 / AVR)</text>

  <text x="160" y="129" font-size="12" font-weight="700" fill="#c0392b" text-anchor="end">5V (VCC)</text>
  <circle cx="175" cy="125" r="3" fill="#c0392b"/>

  <text x="160" y="199" font-size="12" font-weight="700" fill="#2457d6" text-anchor="end">DAC / PWM</text>
  <circle cx="175" cy="195" r="3" fill="#2457d6"/>

  <text x="160" y="284" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">GPIO SHDN</text>
  <circle cx="175" cy="280" r="3" fill="#1a1a1a"/>

  <text x="160" y="344" font-size="12" font-weight="700" fill="#6b7280" text-anchor="end">GND</text>
  <circle cx="175" cy="340" r="3" fill="#6b7280"/>

  <!-- Заголовки середньої секції -->
  <text x="395" y="92" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">КОЛА ФІЛЬТРАЦІЇ ТА УЗГОДЖЕННЯ</text>
  <text x="395" y="106" font-size="12" fill="#6b7280" text-anchor="middle">Відновлювальний ФНЧ + розв'язка DC + Pulldown SHDN</text>

  <!-- Лінія 1: Живлення 5V (Y = 125) -->
  <line x1="175" y1="125" x2="615" y2="125" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="230" y1="125" x2="260" y2="125" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="330" y="144" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">+5V (VDD живлення)</text>

  <!-- Лінія 2: Аудіотракт (Y = 195) -->
  <!-- MCU -> R_filter -->
  <line x1="175" y1="195" x2="222" y2="195" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="185" y1="195" x2="210" y2="195" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- R_filter (1 кОм) -->
  <rect x="222" y="188" width="36" height="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="240" y="174" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">R_filter</text>
  <text x="240" y="158" font-size="12" fill="#6b7280" text-anchor="middle">1 кОм</text>

  <!-- R_filter -> Node C_filter (x = 330) -->
  <line x1="258" y1="195" x2="330" y2="195" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="330" cy="195" r="3.5" fill="#1a1a1a"/>

  <!-- C_filter відгалуження до GND -->
  <line x1="330" y1="195" x2="330" y2="228" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="318" y1="228" x2="342" y2="228" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="318" y1="236" x2="342" y2="236" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="330" y1="236" x2="330" y2="340" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="330" cy="340" r="3.5" fill="#1a1a1a"/>

  <text x="354" y="228" font-size="12" font-weight="700" fill="#1a1a1a">C_filter</text>
  <text x="354" y="244" font-size="12" fill="#6b7280">22 нФ</text>

  <!-- Node -> C_in (x = 440) -->
  <line x1="330" y1="195" x2="436" y2="195" stroke="#2457d6" stroke-width="1.5"/>

  <!-- C_in (0.22 мкФ) -->
  <line x1="436" y1="185" x2="436" y2="205" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="444" y1="185" x2="444" y2="205" stroke="#1a1a1a" stroke-width="2"/>
  <text x="440" y="171" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">C_in</text>
  <text x="440" y="155" font-size="12" fill="#6b7280" text-anchor="middle">0.22 мкФ</text>

  <!-- C_in -> Pin 4 IN- (x = 615) -->
  <line x1="444" y1="195" x2="615" y2="195" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="545" y1="195" x2="580" y2="195" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Лінія 3: Керування SHDN (Y = 280) -->
  <line x1="175" y1="280" x2="615" y2="280" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="230" y1="280" x2="260" y2="280" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="420" y="265" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Лінія SHDN (Active HIGH)</text>

  <!-- R_pull (100 кОм) на SHDN до GND (x = 515) -->
  <circle cx="515" cy="280" r="3.5" fill="#1a1a1a"/>
  <line x1="515" y1="280" x2="515" y2="294" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="508" y="294" width="14" height="26" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="515" y1="320" x2="515" y2="340" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="515" cy="340" r="3.5" fill="#1a1a1a"/>

  <text x="534" y="304" font-size="12" font-weight="700" fill="#1a1a1a">R_pull</text>
  <text x="534" y="320" font-size="12" fill="#6b7280">100 кОм</text>

  <!-- Лінія 4: Спільна земля GND (Y = 340) -->
  <line x1="175" y1="340" x2="615" y2="340" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Символ заземлення (GND) -->
  <line x1="420" y1="340" x2="420" y2="352" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="408" y1="352" x2="432" y2="352" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="413" y1="356" x2="427" y2="356" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="417" y1="360" x2="423" y2="360" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="445" y="362" font-size="12" font-weight="700" fill="#6b7280">GND (земля)</text>

  <!-- Блок 2: Модуль підсилювача XPT8871 -->
  <rect x="615" y="70" width="180" height="290" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="705" y="92" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">МОДУЛЬ XPT8871</text>
  <text x="705" y="106" font-size="12" fill="#6b7280" text-anchor="middle">Підсилювач 5 Вт (SOP-8)</text>

  <!-- Вхідні виводи XPT8871 -->
  <circle cx="615" cy="125" r="3" fill="#c0392b"/>
  <text x="630" y="129" font-size="12" font-weight="700" fill="#c0392b">Pin 6: VDD</text>

  <circle cx="615" cy="195" r="3" fill="#2457d6"/>
  <text x="630" y="199" font-size="12" font-weight="700" fill="#2457d6">Pin 4: IN−</text>

  <text x="630" y="242" font-size="12" font-weight="700" fill="#1a1a1a">Pin 2: BYPASS</text>
  <text x="630" y="258" font-size="12" fill="#6b7280">└─ C_bp (1 мкФ) → GND</text>

  <circle cx="615" cy="280" r="3" fill="#1a1a1a"/>
  <text x="630" y="284" font-size="12" font-weight="700" fill="#1a1a1a">Pin 1: SHDN</text>

  <circle cx="615" cy="340" r="3" fill="#6b7280"/>
  <text x="630" y="344" font-size="12" font-weight="700" fill="#6b7280">Pin 7: GND</text>

  <!-- Вихід BTL XPT8871 -->
  <text x="775" y="180" font-size="12" font-weight="700" fill="#2457d6" text-anchor="end">Pin 5 (VO+)</text>
  <circle cx="795" cy="195" r="3" fill="#2457d6"/>

  <text x="775" y="228" font-size="12" font-weight="700" fill="#2457d6" text-anchor="end">BTL вихід</text>

  <text x="775" y="277" font-size="12" font-weight="700" fill="#2457d6" text-anchor="end">Pin 8 (VO−)</text>
  <circle cx="795" cy="255" r="3" fill="#2457d6"/>

  <!-- Блок 3: Динамік (BTL навантаження) -->
  <!-- Лінії від VO+ та VO- до динаміка -->
  <line x1="795" y1="195" x2="855" y2="195" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="795" y1="255" x2="855" y2="255" stroke="#2457d6" stroke-width="1.5"/>

  <rect x="855" y="180" width="14" height="90" rx="2" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="869,190 905,160 905,290 869,260" fill="#eaf0fd" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Хвилі звуку -->
  <path d="M915,205 Q925,225 915,245" fill="none" stroke="#2457d6" stroke-width="2" stroke-linecap="round"/>
  <path d="M925,195 Q938,225 925,255" fill="none" stroke="#2457d6" stroke-width="2" stroke-linecap="round"/>

  <text x="890" y="128" font-size="12" fill="#6b7280" text-anchor="middle">8 Ом (0.5–3 Вт)</text>
  <text x="890" y="144" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Динамік</text>

  <text x="890" y="314" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Диференційний</text>
  <text x="890" y="330" font-size="12" fill="#6b7280" text-anchor="middle">Без C_out (0 В DC)</text>

  <!-- Блок 4: Нижні акцентні інженерні плашки -->
  <rect x="35" y="380" width="438" height="68" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="50" y="401" font-size="12" font-weight="700" fill="#2457d6">RC-фільтр низьких частот (R_filter = 1 кОм, C_filter = 22 нФ):</text>
  <text x="50" y="417" font-size="12" fill="#1a1a1a">Зрізає ВЧ-носійну ШІМ (fc ≈ 7.2 кГц), згладжуючи імпульси в чистий звук,</text>
  <text x="50" y="433" font-size="12" fill="#6b7280">а розв'язувальний конденсатор Cin (0.22 мкФ) відсікає постійне зміщення DC.</text>

  <rect x="487" y="380" width="438" height="68" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="502" y="401" font-size="12" font-weight="700" fill="#27ae60">Керування SHDN та захист від пускових клацань (Anti-Pop):</text>
  <text x="502" y="417" font-size="12" fill="#1a1a1a">R_pull (100 кОм) утримує режим сну (SHDN = LOW) під час ресету МК.</text>
  <text x="502" y="433" font-size="12" fill="#6b7280">МК вмикає SHDN = HIGH лише після старту ЦАП і стабілізації VDD/2.</text>
</svg>
