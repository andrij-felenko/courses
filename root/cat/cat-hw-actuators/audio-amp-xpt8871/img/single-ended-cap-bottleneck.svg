<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Проблема однотактного виходу (Single-Ended) з розділовим конденсатором</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Постійне зміщення Vdd/2 вимагає громіздкого Cout, породжує пусковий тріск і зрізає баси</text>

  <!-- 1. Ліва панель: принципова схема -->
  <rect x="24" y="74" width="416" height="366" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="232" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принципова схема однотактного каскаду</text>
  <text x="232" y="115" font-size="12" fill="#6b7280" text-anchor="middle">Однополярне живлення 5 В: постійна напруга 2.5 В на виході</text>

  <!-- Схема: вхід і підсилювач -->
  <text x="36" y="182" font-size="12" fill="#6b7280" text-anchor="start">Vin</text>
  <line x1="36" y1="190" x2="75" y2="190" stroke="#2457d6" stroke-width="2"/>
  <polygon points="75,160 75,220 125,190" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>

  <!-- Живлення підсилювача -->
  <line x1="95" y1="173" x2="95" y2="146" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="85" y1="146" x2="105" y2="146" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="95" y="138" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">+5 В (Vdd)</text>

  <line x1="95" y1="207" x2="95" y2="234" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="87" y1="234" x2="103" y2="234" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="90" y1="238" x2="100" y2="238" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="93" y1="242" x2="97" y2="242" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="95" y="258" font-size="12" fill="#6b7280" text-anchor="middle">GND</text>

  <!-- Вихід підсилювача та зміщення Vdd/2 -->
  <line x1="125" y1="190" x2="204" y2="190" stroke="#2457d6" stroke-width="2"/>
  <circle cx="160" cy="190" r="3.5" fill="#c0392b"/>
  <text x="160" y="168" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">V_вих = 2.5 В</text>
  <text x="160" y="182" font-size="12" fill="#6b7280" text-anchor="middle">(зміщення Vdd/2)</text>

  <!-- Конденсатор Cout -->
  <line x1="204" y1="172" x2="204" y2="208" stroke="#c0392b" stroke-width="3"/>
  <text x="198" y="180" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">+</text>
  <path d="M 214,172 A 18,18 0 0,0 214,208" fill="none" stroke="#6b7280" stroke-width="3"/>
  <text x="209" y="226" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">C_out</text>
  <text x="209" y="240" font-size="12" fill="#1a1a1a" text-anchor="middle">220–470 мкФ</text>
  <text x="209" y="254" font-size="12" fill="#6b7280" text-anchor="middle">(електроліт)</text>

  <!-- Точка після конденсатора і динамік -->
  <line x1="216" y1="190" x2="310" y2="190" stroke="#2457d6" stroke-width="2"/>
  <circle cx="265" cy="190" r="3.5" fill="#27ae60"/>
  <text x="265" y="168" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">V_дин = 0 В</text>
  <text x="265" y="182" font-size="12" fill="#6b7280" text-anchor="middle">(тільки AC)</text>

  <line x1="310" y1="190" x2="310" y2="182" stroke="#2457d6" stroke-width="2"/>
  <line x1="310" y1="182" x2="325" y2="182" stroke="#2457d6" stroke-width="2"/>

  <!-- Корпус динаміка -->
  <rect x="325" y="174" width="16" height="32" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <polygon points="341,180 365,160 365,220 341,200" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M 371,182 A 14,14 0 0,1 371,198" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M 377,174 A 24,24 0 0,1 377,206" fill="none" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Заземлення динаміка -->
  <line x1="325" y1="198" x2="310" y2="198" stroke="#2457d6" stroke-width="2"/>
  <line x1="310" y1="198" x2="310" y2="234" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="302" y1="234" x2="318" y2="234" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="305" y1="238" x2="315" y2="238" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="308" y1="242" x2="312" y2="242" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="310" y="258" font-size="12" fill="#6b7280" text-anchor="middle">GND</text>

  <text x="353" y="238" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Динамік</text>
  <text x="353" y="252" font-size="12" fill="#6b7280" text-anchor="middle">R_н = 4–8 Ом</text>

  <!-- Плашка недоліків схеми -->
  <rect x="38" y="276" width="388" height="150" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="50" y="296" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="start">Обмеження однотактної архітектури:</text>
  <text x="50" y="318" font-size="12" fill="#1a1a1a" text-anchor="start">1. Габарити: C_out (h &gt; 10 мм) не влазить у тонкі плати</text>
  <text x="50" y="340" font-size="12" fill="#1a1a1a" text-anchor="start">2. DC pop: заряд C_out б'є по динаміку під час старту</text>
  <text x="50" y="362" font-size="12" fill="#1a1a1a" text-anchor="start">3. Зріз басів: ланцюг C_out + R_н зрізає низькі частоти</text>
  <text x="50" y="384" font-size="12" fill="#1a1a1a" text-anchor="start">4. Мала потужність: максимум 0.4 Вт (при 5 В на 8 Ом)</text>
  <text x="50" y="408" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">→ Рішення: диференційний міст BTL (без конденсатора)</text>

  <!-- 2. Права верхня панель: DC Pop -->
  <rect x="458" y="74" width="478" height="174" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="697" y="96" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Пусковий імпульс струму через динамік (DC Pop)</text>

  <!-- Осі графіка пуску -->
  <line x1="510" y1="175" x2="915" y2="175" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="922" y="179" font-size="12" fill="#6b7280" text-anchor="start">t</text>
  <line x1="520" y1="215" x2="520" y2="115" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="520" y="110" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">I_дин</text>
  <text x="512" y="179" font-size="12" fill="#6b7280" text-anchor="end">0</text>

  <!-- Момент увімкнення t_on -->
  <line x1="575" y1="122" x2="575" y2="195" stroke="#6b7280" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="575" y="206" font-size="12" fill="#6b7280" text-anchor="middle">t_увімк</text>

  <!-- Крива струму -->
  <path d="M 575,175 L 575,126 C 590,128 630,168 700,175 Z" fill="#fdecea"/>
  <path d="M 520,175 L 575,175 L 575,126 C 590,128 630,168 700,175 L 905,175" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="575" cy="126" r="3.5" fill="#c0392b"/>

  <text x="585" y="124" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">I_пік = (Vdd/2) / R_н ≈ 0.6 А</text>
  <text x="640" y="148" font-size="12" fill="#c0392b" text-anchor="start">Різкий удар по котушці</text>
  <text x="640" y="164" font-size="12" fill="#6b7280" text-anchor="start">акустичне клацання (DC Pop)</text>

  <text x="710" y="196" font-size="12" fill="#27ae60" text-anchor="start">C_out заряджений → I = 0</text>
  <text x="710" y="212" font-size="12" fill="#6b7280" text-anchor="start">(робочий стан без зміщення)</text>

  <!-- 3. Права нижня панель: АЧХ ФВЧ -->
  <rect x="458" y="266" width="478" height="174" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="697" y="288" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">АЧХ вихідного кола: фільтр високих частот (C_out + R_н)</text>

  <!-- Осі АЧХ -->
  <line x1="510" y1="390" x2="915" y2="390" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="922" y="394" font-size="12" fill="#6b7280" text-anchor="start">f</text>
  <line x1="520" y1="410" x2="520" y2="305" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="520" y="302" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">дБ</text>

  <!-- Рівні 0 дБ та -3 дБ -->
  <line x1="520" y1="328" x2="905" y2="328" stroke="#d0d7de" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="512" y="332" font-size="12" fill="#6b7280" text-anchor="end">0 дБ</text>
  <line x1="520" y1="343" x2="640" y2="343" stroke="#c0392b" stroke-dasharray="3,3" stroke-width="1"/>
  <text x="512" y="347" font-size="12" fill="#c0392b" text-anchor="end">-3 дБ</text>

  <!-- Частота зрізу -->
  <line x1="640" y1="343" x2="640" y2="390" stroke="#c0392b" stroke-dasharray="3,3" stroke-width="1.5"/>
  <circle cx="640" cy="343" r="3.5" fill="#c0392b"/>

  <!-- Заливка і крива АЧХ -->
  <path d="M 520,390 L 525,398 C 555,388 605,360 640,343 L 640,390 Z" fill="#fdecea"/>
  <path d="M 525,398 C 555,388 605,360 640,343 C 670,331 710,328 905,328" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Підписи на осі частоти -->
  <text x="540" y="406" font-size="12" fill="#6b7280" text-anchor="middle">20 Гц</text>
  <text x="640" y="406" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">f_c ≈ 90–180 Гц</text>
  <text x="640" y="420" font-size="12" fill="#6b7280" text-anchor="middle">(частота зрізу)</text>
  <text x="800" y="406" font-size="12" fill="#6b7280" text-anchor="middle">1 кГц</text>
  <text x="890" y="406" font-size="12" fill="#6b7280" text-anchor="middle">20 кГц</text>

  <!-- Пояснення АЧХ -->
  <text x="535" y="320" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">Завал басів (&lt; 100 Гц)</text>
  <text x="670" y="352" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Частота зрізу ФВЧ:</text>
  <text x="670" y="368" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">f_c = 1 / (2π · R_н · C_out)</text>
  <text x="670" y="384" font-size="12" fill="#6b7280" text-anchor="start">Нижче f_c: спад басів -20 дБ/дек</text>
</svg>
