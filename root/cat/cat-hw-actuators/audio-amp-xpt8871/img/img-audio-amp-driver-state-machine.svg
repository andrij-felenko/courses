<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Діаграма станів драйвера аудіопідсилювача XPT8871</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Затримка twu до старту аудіо та Soft-Mute перед вимкненням усувають щиглики (anti-pop)</text>

  <!-- Стан 1: SHUTDOWN -->
  <rect x="40" y="85" width="340" height="140" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="56" y="112" font-size="14" font-weight="700" fill="#1a1a1a">1. SHUTDOWN (Очікування)</text>
  <rect x="250" y="96" width="116" height="22" rx="4" fill="#e5e7eb"/>
  <text x="308" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#4b5563">СТРУМ: ~0.1 мкА</text>
  <line x1="56" y1="126" x2="366" y2="126" stroke="#d0d7de" stroke-width="1"/>
  <text x="56" y="145" font-size="12" fill="#1a1a1a">Вивід SHDN: LOW (0 В, підсилювач спить)</text>
  <text x="56" y="165" font-size="12" fill="#1a1a1a">Конденсатор BYPASS: 0 В (розряджений)</text>
  <text x="56" y="185" font-size="12" fill="#1a1a1a">Аудіосигнал: вимкнено / MUTE (тиша)</text>
  <text x="56" y="205" font-size="12" fill="#6b7280">Споживання: мінімальне (глибокий сон)</text>

  <!-- Стан 2: POWER-UP -->
  <rect x="580" y="85" width="340" height="140" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="596" y="112" font-size="14" font-weight="700" fill="#2457d6">2. POWER-UP (Заряд BYPASS)</text>
  <rect x="804" y="96" width="102" height="22" rx="4" fill="#2457d6"/>
  <text x="855" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">ТАЙМЕР: twu</text>
  <line x1="596" y1="126" x2="906" y2="126" stroke="#c7d7f9" stroke-width="1"/>
  <text x="596" y="145" font-size="12" fill="#1a1a1a">Вивід SHDN: HIGH (активація аналогового тракту)</text>
  <text x="596" y="165" font-size="12" fill="#1a1a1a">Конденсатор BYPASS: заряд 0 В -&gt; VDD/2</text>
  <text x="596" y="185" font-size="12" fill="#c0392b">Аудіосигнал: СУВОРО MUTE (звук заблоковано!)</text>
  <text x="596" y="205" font-size="12" fill="#2457d6">Anti-Pop захист: очікування затримки twu</text>

  <!-- Стан 3: ACTIVE PLAYBACK -->
  <rect x="580" y="295" width="340" height="140" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="596" y="322" font-size="14" font-weight="700" fill="#27ae60">3. ACTIVE (Відтворення)</text>
  <rect x="786" y="306" width="120" height="22" rx="4" fill="#27ae60"/>
  <text x="846" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">ЗВУК АКТИВНИЙ</text>
  <line x1="596" y1="336" x2="906" y2="336" stroke="#a3e4d7" stroke-width="1"/>
  <text x="596" y="355" font-size="12" fill="#1a1a1a">Вивід SHDN: HIGH (підсилювач увімкнено)</text>
  <text x="596" y="375" font-size="12" fill="#1a1a1a">Конденсатор BYPASS: стабільна середина VDD/2</text>
  <text x="596" y="395" font-size="12" fill="#1a1a1a">Аудіопотік: I2S DMA / ЦАП транслює звук</text>
  <text x="596" y="415" font-size="12" fill="#27ae60">Штатне підсилення сигналу на динамік</text>

  <!-- Стан 4: POWER-DOWN -->
  <rect x="40" y="295" width="340" height="140" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="56" y="322" font-size="14" font-weight="700" fill="#c0392b">4. POWER-DOWN (Зупинка)</text>
  <rect x="256" y="306" width="110" height="22" rx="4" fill="#c0392b"/>
  <text x="311" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#ffffff">SOFT-MUTE</text>
  <line x1="56" y1="336" x2="366" y2="336" stroke="#fadbd8" stroke-width="1"/>
  <text x="56" y="355" font-size="12" fill="#1a1a1a">Аудіосигнал: Soft-Mute (плавний спад до 0)</text>
  <text x="56" y="375" font-size="12" fill="#1a1a1a">Аудіопотік: зупинка DMA після тиші</text>
  <text x="56" y="395" font-size="12" fill="#1a1a1a">Вивід SHDN: переведення в LOW ПІСЛЯ тиші</text>
  <text x="56" y="415" font-size="12" fill="#c0392b">Anti-Pop захист: запобігання щиглику</text>

  <!-- Перехід 1: SHUTDOWN -> POWER-UP (вгорі) -->
  <text x="480" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Подія: amp_wake()</text>
  <text x="480" y="143" text-anchor="middle" font-size="12" fill="#1a1a1a">SHDN = HIGH (пробудження)</text>
  <line x1="385" y1="155" x2="572" y2="155" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="480" y="173" text-anchor="middle" font-size="12" fill="#2457d6">Заряд BYPASS до VDD/2</text>
  <text x="480" y="191" text-anchor="middle" font-size="12" fill="#6b7280">Таймер затримки twu</text>

  <!-- Перехід 2: POWER-UP -> ACTIVE PLAYBACK (праворуч) -->
  <line x1="630" y1="230" x2="630" y2="287" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="650" y="252" font-size="12" font-weight="700" fill="#27ae60">Умова: t &gt;= twu (VDD/2 готова)</text>
  <text x="650" y="272" font-size="12" fill="#1a1a1a">Старт ЦАП / DMA, зняття MUTE</text>

  <!-- Перехід 3: ACTIVE PLAYBACK -> POWER-DOWN (внизу) -->
  <text x="480" y="335" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">Подія: amp_sleep() / stop</text>
  <text x="480" y="353" text-anchor="middle" font-size="12" fill="#1a1a1a">Soft-Mute: плавний спад до 0</text>
  <line x1="575" y1="365" x2="388" y2="365" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="480" y="385" text-anchor="middle" font-size="12" fill="#c0392b">Зупинка аудіопотоку DMA</text>
  <text x="480" y="403" text-anchor="middle" font-size="12" fill="#6b7280">Амплітуда зафіксована на 0</text>

  <!-- Перехід 4: POWER-DOWN -> SHUTDOWN (ліворуч) -->
  <line x1="330" y1="290" x2="330" y2="233" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>
  <text x="310" y="252" text-anchor="end" font-size="12" font-weight="700" fill="#1a1a1a">Умова: аудіо зупинено</text>
  <text x="310" y="272" text-anchor="end" font-size="12" fill="#6b7280">SHDN = LOW (глибокий сон)</text>
</svg>
