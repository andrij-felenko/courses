<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="520" fill="white"/>
  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Монтажна схема підключення модуля XPT8871 до мікроконтролера</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Пін-у-пін з'єднання, відновлювальний RC-фільтр, підтяжка сну SHDN та суворе табу на заземлення динаміка</text>
  <!-- БЛОК 1: Мікроконтролер (ESP32 / RP2040) -->
  <rect x="45" y="80" width="155" height="335" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="55" y="90" width="135" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="122.5" y="111" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">Мікроконтролер</text>
  <text x="122.5" y="142" font-size="12" fill="#6b7280" text-anchor="middle">ESP32 / RP2040 / STM32</text>
  <rect x="188" y="105" width="12" height="20" rx="2" fill="#c0392b"/>
  <text x="182" y="119" font-size="12" font-weight="700" fill="#c0392b" text-anchor="end">5V (VBUS)</text>
  <rect x="188" y="165" width="12" height="20" rx="2" fill="#1a1a1a"/>
  <text x="182" y="179" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">GND</text>
  <rect x="188" y="245" width="12" height="20" rx="2" fill="#2457d6"/>
  <text x="182" y="259" font-size="12" font-weight="700" fill="#2457d6" text-anchor="end">DAC / PWM</text>
  <rect x="188" y="340" width="12" height="20" rx="2" fill="#8e44ad"/>
  <text x="182" y="354" font-size="12" font-weight="700" fill="#8e44ad" text-anchor="end">GPIO (SHDN)</text>
  <!-- БЛОК 2: Модуль підсилювача XPT8871 -->
  <rect x="440" y="80" width="230" height="335" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="450" y="90" width="210" height="32" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="555.0" y="111" font-size="13" font-weight="700" fill="#27ae60" text-anchor="middle">Модуль XPT8871 (BTL)</text>
  <rect x="512" y="160" width="86" height="150" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="555.0" y="184" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">XPT8871</text>
  <text x="555.0" y="202" font-size="12" fill="#6b7280" text-anchor="middle">BTL 5W</text>
  <rect x="527" y="218" width="56" height="26" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="555" y="235" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">VO1 (+)</text>
  <rect x="527" y="254" width="56" height="26" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="555" y="271" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">VO2 (−)</text>
  <text x="555.0" y="298" font-size="12" fill="#6b7280" text-anchor="middle">ESOP-8</text>
  <text x="555.0" y="345" font-size="12" fill="#6b7280" text-anchor="middle">Cbypass = 1.0 мкФ (VDD/2)</text>
  <text x="555.0" y="363" font-size="12" fill="#6b7280" text-anchor="middle">Cin = 0.47 мкФ (розділовий)</text>
  <rect x="440" y="105" width="12" height="20" rx="2" fill="#c0392b"/>
  <text x="458" y="119" font-size="12" font-weight="700" fill="#c0392b" text-anchor="start">VDD</text>
  <rect x="440" y="165" width="12" height="20" rx="2" fill="#1a1a1a"/>
  <text x="458" y="179" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="start">GND</text>
  <rect x="440" y="245" width="12" height="20" rx="2" fill="#2457d6"/>
  <text x="458" y="259" font-size="12" font-weight="700" fill="#2457d6" text-anchor="start">IN+</text>
  <rect x="440" y="340" width="12" height="20" rx="2" fill="#8e44ad"/>
  <text x="458" y="354" font-size="12" font-weight="700" fill="#8e44ad" text-anchor="start">SHDN</text>
  <rect x="658" y="175" width="12" height="20" rx="2" fill="#27ae60"/>
  <text x="652" y="189" font-size="12" font-weight="700" fill="#27ae60" text-anchor="end">OUT+</text>
  <rect x="658" y="255" width="12" height="20" rx="2" fill="#2457d6"/>
  <text x="652" y="269" font-size="12" font-weight="700" fill="#2457d6" text-anchor="end">OUT−</text>
  <!-- БЛОК 3: Динамік 4..8 Ом -->
  <polygon points="825,170 780,135 780,315 825,280" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="825" y="195" width="30" height="60" rx="3" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="780" y1="125" x2="780" y2="325" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="780" cy="185" r="4" fill="#27ae60"/>
  <circle cx="780" cy="265" r="4" fill="#2457d6"/>
  <text x="790" y="189" font-size="12" font-weight="700" fill="#27ae60">+</text>
  <text x="790" y="269" font-size="12" font-weight="700" fill="#2457d6">−</text>
  <text x="820" y="120" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Динамік 4–8 Ом</text>
  <text x="820" y="137" font-size="12" fill="#6b7280" text-anchor="middle">Потужність 3–5 Вт</text>
  <!-- Провідники до динаміка -->
  <line x1="670" y1="185" x2="780" y2="185" stroke="#27ae60" stroke-width="2.5"/>
  <line x1="670" y1="265" x2="780" y2="265" stroke="#2457d6" stroke-width="2.5"/>
  <text x="680" y="177" font-size="12" fill="#27ae60">VO1 (фаза +)</text>
  <text x="680" y="257" font-size="12" fill="#2457d6">VO2 (фаза −)</text>
  <!-- Попередження: табу на заземлення динаміка -->
  <line x1="735" y1="265" x2="735" y2="305" stroke="#c0392b" stroke-width="2" stroke-dasharray="3,3"/>
  <line x1="727" y1="305" x2="743" y2="305" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="730" y1="309" x2="740" y2="309" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="733" y1="313" x2="737" y2="313" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="726" y1="275" x2="744" y2="295" stroke="#c0392b" stroke-width="3"/>
  <line x1="744" y1="275" x2="726" y2="295" stroke="#c0392b" stroke-width="3"/>
  <rect x="685" y="325" width="250" height="90" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="695" y="345" font-size="12" font-weight="700" fill="#c0392b">ТАБУ НА ЗАЗЕМЛЕННЯ ДИНАМІКА!</text>
  <text x="695" y="363" font-size="12" fill="#1a1a1a">Виходи VO1 та VO2 мають постійну</text>
  <text x="695" y="379" font-size="12" fill="#1a1a1a">напругу зміщення VDD / 2 = 2.5 В.</text>
  <text x="695" y="395" font-size="12" font-weight="700" fill="#c0392b">Замикання на GND — це КЗ плеча!</text>
  <!-- Лінії живлення та пасивні компоненти -->
  <line x1="200" y1="115" x2="440" y2="115" stroke="#c0392b" stroke-width="2.5"/>
  <text x="210" y="107" font-size="12" font-weight="700" fill="#c0392b">Лінія живлення VDD (+5V)</text>
  <line x1="200" y1="175" x2="440" y2="175" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="210" y="195" font-size="12" font-weight="700" fill="#1a1a1a">Лінія GND (Зіркова земля)</text>
  <!-- Локальні фільтрувальні конденсатори живлення -->
  <line x1="375" y1="115" x2="375" y2="135" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="365" y="135" width="20" height="20" rx="2" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="375" y="149" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">+</text>
  <line x1="375" y1="155" x2="375" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="362" y="132" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">100 мкФ</text>
  <circle cx="375" cy="115" r="3" fill="#c0392b"/>
  <circle cx="375" cy="175" r="3" fill="#1a1a1a"/>
  <line x1="410" y1="115" x2="410" y2="137" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="403" y1="137" x2="417" y2="137" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="403" y1="143" x2="417" y2="143" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="410" y1="143" x2="410" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="420" y="144" font-size="12" fill="#6b7280">0.1 мкФ</text>
  <circle cx="410" cy="115" r="3" fill="#c0392b"/>
  <circle cx="410" cy="175" r="3" fill="#1a1a1a"/>
  <!-- Аудіолінія та відновлювальний RC-фільтр -->
  <line x1="200" y1="255" x2="255" y2="255" stroke="#2457d6" stroke-width="2.5"/>
  <rect x="255" y="247" width="40" height="16" rx="2" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="275" y="240" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">R = 1 кОм</text>
  <line x1="295" y1="255" x2="440" y2="255" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="330" cy="255" r="3" fill="#2457d6"/>
  <line x1="330" y1="255" x2="330" y2="275" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="323" y1="275" x2="337" y2="275" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="323" y1="281" x2="337" y2="281" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="330" y1="281" x2="330" y2="293" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="322" y1="293" x2="338" y2="293" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="325" y1="297" x2="335" y2="297" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="328" y1="301" x2="332" y2="301" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="342" y="282" font-size="12" font-weight="700" fill="#2457d6">C = 10 нФ</text>
  <text x="210" y="280" font-size="12" fill="#6b7280">RC-фільтр: fc ≈ 16 кГц</text>
  <!-- Лінія SHDN та резистор підтяжки до VDD -->
  <line x1="200" y1="350" x2="440" y2="350" stroke="#8e44ad" stroke-width="2.5"/>
  <text x="210" y="375" font-size="12" font-weight="700" fill="#8e44ad">Керування SHDN</text>
  <circle cx="345" cy="350" r="3" fill="#8e44ad"/>
  <line x1="345" y1="350" x2="345" y2="332" stroke="#8e44ad" stroke-width="1.5"/>
  <rect x="337" y="304" width="16" height="28" rx="2" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="345" y1="304" x2="345" y2="292" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="337" y1="292" x2="353" y2="292" stroke="#c0392b" stroke-width="2"/>
  <text x="345" y="286" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">+5V</text>
  <text x="358" y="318" font-size="12" font-weight="700" fill="#c0392b">100 кОм</text>
  <text x="358" y="334" font-size="12" fill="#6b7280">(pull-up)</text>
  <!-- Нижня панель інженерних правил -->
  <rect x="45" y="430" width="890" height="75" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="61" y="452" font-size="12" font-weight="700" fill="#c0392b">1. Роздільне живлення</text>
  <text x="61" y="470" font-size="12" fill="#1a1a1a">Окремі траси 5V/GND від джерела,</text>
  <text x="61" y="486" font-size="12" fill="#6b7280">локальний буфер 100 мкФ біля VDD.</text>
  <text x="285" y="452" font-size="12" font-weight="700" fill="#2457d6">2. Фільтрація аудіо</text>
  <text x="285" y="470" font-size="12" fill="#1a1a1a">RC-ланка (1 кОм + 10 нФ) пригнічує</text>
  <text x="285" y="486" font-size="12" fill="#6b7280">високочастотний шум ШІМ/ЦАП.</text>
  <text x="520" y="452" font-size="12" font-weight="700" fill="#8e44ad">3. Підтяжка сну SHDN</text>
  <text x="520" y="470" font-size="12" fill="#1a1a1a">Резистор 100 кОм до VDD тримає</text>
  <text x="520" y="486" font-size="12" fill="#6b7280">підсилювач у сні під час бутлоадера.</text>
  <text x="745" y="452" font-size="12" font-weight="700" fill="#c0392b">4. Мостовий вихід BTL</text>
  <text x="745" y="470" font-size="12" fill="#1a1a1a">Динамік суто між VO1 і VO2:</text>
  <text x="745" y="486" font-size="12" font-weight="700" fill="#c0392b">жоден контакт не з'єднувати з GND!</text>
</svg>
