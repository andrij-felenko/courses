<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Однотактний вихід (SE): спад АЧХ через C_out та зміщення дифузора</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">C_out дає спад -3 дБ на частоті f_c; без нього постійний струм веде до кліпінгу на X_max</text>

  <!-- ==================== LEFT PANEL ==================== -->
  <rect x="24" y="74" width="444" height="366" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Left Header -->
  <text x="40" y="98" font-size="14" font-weight="bold" fill="#1a1a1a">АЧХ однотактного виходу з конденсатором C_out</text>
  <text x="40" y="116" font-size="12" fill="#6b7280">Фільтр верхніх частот: спад -20 дБ/дек на низьких частотах</text>

  <!-- Left Plot Canvas -->
  <rect x="40" y="128" width="412" height="248" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Left Plot Header Titles -->
  <text x="56" y="142" font-size="12" font-weight="bold" fill="#1a1a1a">дБ</text>
  <text x="440" y="142" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">f, Гц</text>

  <!-- Left Plot Area Labels -->
  <text x="150" y="156" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Спад -20 дБ/дек</text>
  <text x="320" y="156" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Смуга пропускання (0 дБ)</text>

  <!-- Left Grid lines -->
  <!-- 0 dB line -->
  <line x1="90" y1="166" x2="440" y2="166" stroke="#d0d7de" stroke-dasharray="3,3" stroke-width="1"/>
  <!-- -3 dB line -->
  <line x1="90" y1="192" x2="220" y2="192" stroke="#2457d6" stroke-dasharray="3,3" stroke-width="1"/>
  <!-- -10 dB line -->
  <line x1="90" y1="253" x2="246" y2="253" stroke="#d0d7de" stroke-dasharray="2,2" stroke-width="1"/>
  <!-- Vertical cutoff f_c line -->
  <line x1="220" y1="192" x2="220" y2="340" stroke="#2457d6" stroke-dasharray="3,3" stroke-width="1.2"/>
  <!-- 0.1 f_c decade line -->
  <line x1="120" y1="166" x2="120" y2="340" stroke="#d0d7de" stroke-dasharray="2,2" stroke-width="1"/>

  <!-- Left Axes -->
  <!-- Y-axis -->
  <line x1="90" y1="340" x2="90" y2="148" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- X-axis -->
  <line x1="90" y1="340" x2="440" y2="340" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Y-axis Labels -->
  <text x="84" y="170" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">0 дБ</text>
  <text x="84" y="196" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">-3 дБ</text>
  <text x="84" y="257" font-size="12" fill="#6b7280" text-anchor="end">-10 дБ</text>
  <text x="84" y="344" font-size="12" fill="#6b7280" text-anchor="end">-20 дБ</text>

  <!-- X-axis Labels -->
  <text x="120" y="358" font-size="12" fill="#6b7280" text-anchor="middle">0.1 f_c</text>
  <text x="220" y="358" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">f_c</text>
  <text x="320" y="358" font-size="12" fill="#6b7280" text-anchor="middle">10 f_c</text>
  <text x="420" y="358" font-size="12" fill="#6b7280" text-anchor="middle">100 f_c</text>

  <!-- Left Bode Curve -->
  <path d="M 100.0,375.0 L 105.0,366.3 L 110.0,357.6 L 115.0,349.0 L 120.0,340.4 L 125.0,331.8 L 130.0,323.2 L 135.0,314.6 L 140.0,306.1 L 145.0,297.7 L 150.0,289.3 L 155.0,280.9 L 160.0,272.7 L 165.0,264.6 L 170.0,256.6 L 175.0,248.8 L 180.0,241.2 L 185.0,233.8 L 190.0,226.7 L 195.0,219.9 L 200.0,213.5 L 205.0,207.4 L 210.0,201.9 L 215.0,196.8 L 220.0,192.2 L 225.0,188.1 L 230.0,184.5 L 235.0,181.3 L 240.0,178.7 L 245.0,176.4 L 250.0,174.5 L 255.0,172.9 L 260.0,171.6 L 265.0,170.5 L 270.0,169.6 L 275.0,168.9 L 280.0,168.3 L 285.0,167.8 L 290.0,167.5 L 295.0,167.2 L 300.0,166.9 L 305.0,166.7 L 310.0,166.6 L 315.0,166.5 L 320.0,166.4 L 325.0,166.3 L 330.0,166.2 L 335.0,166.2 L 340.0,166.2 L 345.0,166.1 L 350.0,166.1 L 355.0,166.1 L 360.0,166.1 L 365.0,166.0 L 370.0,166.0 L 375.0,166.0 L 380.0,166.0 L 385.0,166.0 L 390.0,166.0 L 395.0,166.0 L 400.0,166.0 L 405.0,166.0 L 410.0,166.0 L 415.0,166.0 L 420.0,166.0 L 425.0,166.0 L 430.0,166.0" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="220" cy="192" r="4.5" fill="#2457d6"/>

  <!-- Formula Card inside Left Plot -->
  <rect x="246" y="206" width="196" height="110" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="256" y="226" font-size="12" font-weight="bold" fill="#1a1a1a">Частота зрізу (-3 дБ):</text>
  <text x="256" y="248" font-size="13" font-weight="bold" fill="#2457d6">f_c = 1 / (2π·R_L·C_out)</text>
  <text x="256" y="270" font-size="12" fill="#6b7280">R_L = 4 Ом, C = 470 мкФ</text>
  <text x="256" y="292" font-size="12" font-weight="bold" fill="#27ae60">f_c ≈ 85 Гц (зріз басу)</text>
  <text x="256" y="308" font-size="12" fill="#c0392b">R_C зростає при f &lt; f_c</text>

  <!-- Left Bottom Pill -->
  <rect x="40" y="388" width="412" height="40" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="52" y="404" font-size="12" font-weight="bold" fill="#2457d6">C_out блокує постійний струм V_DD/2, але обмежує баси</text>
  <text x="52" y="420" font-size="12" fill="#1a1a1a">Для f_c = 40 Гц на 4 Ом потрібен C_out = 1000 мкФ</text>

  <!-- ==================== RIGHT PANEL ==================== -->
  <rect x="492" y="74" width="444" height="366" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Right Header -->
  <text x="508" y="98" font-size="14" font-weight="bold" fill="#1a1a1a">Пряме підключення без C_out: зміщення котушки</text>
  <text x="508" y="116" font-size="12" fill="#c0392b">Постійний струм I_DC зміщує дифузор до упору +X_max</text>

  <!-- Right Plot Canvas -->
  <rect x="508" y="128" width="412" height="248" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Right Plot Header Titles -->
  <text x="522" y="142" font-size="12" font-weight="bold" fill="#1a1a1a">x, мм</text>
  <text x="896" y="142" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">t, мс</text>

  <!-- Right Danger Zone -->
  <rect x="566" y="146" width="174" height="30" fill="#fdecea" opacity="0.6"/>
  <text x="653" y="164" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Кліпінг на +X_max</text>

  <!-- Right Grid Lines -->
  <!-- +X_max line -->
  <line x1="566" y1="176" x2="740" y2="176" stroke="#c0392b" stroke-dasharray="4,4" stroke-width="1.5"/>
  <!-- +x_DC bias line -->
  <line x1="566" y1="216" x2="740" y2="216" stroke="#c0392b" stroke-dasharray="3,3" stroke-width="1.2"/>
  <!-- x = 0 neutral line -->
  <line x1="566" y1="258" x2="740" y2="258" stroke="#6b7280" stroke-width="1.5"/>
  <!-- -X_max line / X-axis -->
  <line x1="566" y1="340" x2="906" y2="340" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Right Axes -->
  <!-- Y-axis -->
  <line x1="566" y1="340" x2="566" y2="148" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Y-axis Labels -->
  <text x="560" y="180" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">+X_max</text>
  <text x="560" y="220" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">+x_DC</text>
  <text x="560" y="262" font-size="12" fill="#6b7280" font-weight="bold" text-anchor="end">x = 0</text>
  <text x="560" y="344" font-size="12" fill="#6b7280" text-anchor="end">-X_max</text>

  <!-- X-axis Labels -->
  <text x="580" y="358" font-size="12" fill="#6b7280" text-anchor="middle">0</text>
  <text x="670" y="358" font-size="12" fill="#6b7280" text-anchor="middle">T</text>
  <text x="715" y="358" font-size="12" fill="#6b7280" text-anchor="middle">1.5T</text>

