<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-alert" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-success" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Внутрішня функціональна структура аудіопідсилювача</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">Трикаскадний аналоговий тракт із Miller-корекцією, термозахистом TSD і логікою Shutdown</text>

  <!-- Корпус мікросхеми (IC boundary) -->
  <rect x="110" y="82" width="740" height="350" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="126" y="102" font-size="13" font-weight="bold" fill="#2457d6">Кристал монолітного аудіопідсилювача (IC)</text>

  <!-- ВХІДНІ ЛІНІЇ ТА ВИВОДИ (ЗЛІВА) -->
  <!-- Вивід IN+ -->
  <text x="36" y="152" font-size="12" font-weight="bold" fill="#1a1a1a">IN+</text>
  <line x1="36" y1="164" x2="138" y2="164" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="110" cy="164" r="3.5" fill="#2457d6" stroke="#1a1a1a"/>

  <!-- Вивід IN- -->
  <text x="36" y="184" font-size="12" font-weight="bold" fill="#1a1a1a">IN-</text>
  <line x1="36" y1="196" x2="138" y2="196" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="110" cy="196" r="3.5" fill="#2457d6" stroke="#1a1a1a"/>

  <!-- Вивід SHDN -->
  <text x="36" y="361" font-size="12" font-weight="bold" fill="#1a1a1a">SHDN</text>
  <line x1="36" y1="373" x2="138" y2="373" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="110" cy="373" r="3.5" fill="#c0392b" stroke="#1a1a1a"/>

  <!-- КАСКАД 1: Вхідний диференційний каскад -->
  <rect x="126" y="118" width="220" height="178" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="236" y="138" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вхідний дифкаскад</text>

  <rect x="138" y="146" width="196" height="58" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="236" y="164" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Диференційна пара Q1/Q2</text>
  <text x="236" y="180" font-size="12" fill="#6b7280" text-anchor="middle">Активне навантаження</text>
  <text x="236" y="196" font-size="12" fill="#1a1a1a" text-anchor="middle">Придушення завад CMRR</text>

  <rect x="138" y="218" width="196" height="64" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="236" y="236" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Джерело струму хвоста</text>
  <text x="236" y="254" font-size="12" fill="#2457d6" text-anchor="middle">I_tail (зміщення пари)</text>
  <text x="236" y="272" font-size="12" fill="#6b7280" text-anchor="middle">Стабілізація робочої точки</text>

  <!-- Зв'язок Каскад 1 -> Каскад 2 -->
  <line x1="346" y1="175" x2="370" y2="175" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>

  <!-- КАСКАД 2: Проміжний підсилювач напруги (VAS) -->
  <rect x="370" y="118" width="220" height="178" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="138" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Підсилювач напруги (VAS)</text>

  <rect x="382" y="146" width="196" height="58" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="164" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Каскад посилення Av</text>
  <text x="480" y="180" font-size="12" fill="#1a1a1a" text-anchor="middle">Високий вихідний опір Ro</text>
  <text x="480" y="196" font-size="12" fill="#6b7280" text-anchor="middle">Джерело навантаження I_vas</text>

  <rect x="382" y="218" width="196" height="64" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="236" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Міллерівська корекція Cc</text>
  <text x="480" y="254" font-size="12" fill="#1a1a1a" text-anchor="middle">Домінантний полюс стійкості</text>
  <text x="480" y="272" font-size="12" fill="#27ae60" text-anchor="middle">Запобігання самозбудженню</text>

  <!-- Зв'язок Каскад 2 -> Каскад 3 -->
  <line x1="590" y1="175" x2="614" y2="175" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>

  <!-- КАСКАД 3: Вихідний каскад класу AB -->
  <rect x="614" y="118" width="220" height="178" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="724" y="138" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вихідний каскад класу AB</text>

  <rect x="626" y="146" width="196" height="66" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="724" y="164" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Комплементарна пара FET</text>
  <text x="724" y="182" font-size="12" fill="#1a1a1a" text-anchor="middle">Піковий струм до 1.5 А</text>
  <text x="724" y="200" font-size="12" fill="#6b7280" text-anchor="middle">Низький опір Rds_on &lt; 0.4 Ом</text>

  <rect x="626" y="226" width="196" height="56" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="724" y="246" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Зміщення класу AB</text>
  <text x="724" y="264" font-size="12" fill="#1a1a1a" text-anchor="middle">Усунення «сходинки»</text>

  <!-- ВИХІДНИЙ СИГНАЛ ТА НАВАНТАЖЕННЯ (СПРАВА) -->
  <line x1="822" y1="175" x2="890" y2="175" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="850" cy="175" r="3.5" fill="#2457d6" stroke="#1a1a1a"/>
  <text x="860" y="163" font-size="12" font-weight="bold" fill="#1a1a1a">OUT / VO</text>

  <!-- Навантаження (динамік) -->
  <line x1="890" y1="175" x2="890" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="864" y="200" width="68" height="40" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="898" y="218" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Динамік</text>
  <text x="898" y="233" font-size="12" fill="#6b7280" text-anchor="middle">4–8 Ом</text>
  <line x1="890" y1="240" x2="890" y2="258" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="882" y1="258" x2="898" y2="258" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="885" y1="262" x2="895" y2="262" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="888" y1="266" x2="892" y2="266" stroke="#1a1a1a" stroke-width="1"/>
  <text x="898" y="282" font-size="12" fill="#6b7280" text-anchor="middle">GND</text>

  <!-- БЛОК 4: Логіка Shutdown -->
  <rect x="126" y="330" width="220" height="90" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="236" y="348" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Логіка Shutdown</text>

  <rect x="138" y="356" width="196" height="54" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="236" y="373" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Режим очікування &lt; 0.1 мкА</text>
  <text x="236" y="389" font-size="12" fill="#1a1a1a" text-anchor="middle">Блокування вихідних ключів</text>
  <text x="236" y="403" font-size="12" fill="#6b7280" text-anchor="middle">Захист від щигликів Pop-Click</text>

  <!-- Зв'язок Shutdown -> Bias -->
  <line x1="346" y1="373" x2="370" y2="373" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-alert)"/>

  <!-- БЛОК 5: Джерела зміщення та Bypass -->
  <rect x="370" y="330" width="220" height="90" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="348" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Джерела зміщення та Bypass</text>

  <rect x="382" y="356" width="196" height="54" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="373" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Опорний рівень VDD/2</text>
  <text x="480" y="389" font-size="12" fill="#1a1a1a" text-anchor="middle">Струмові дзеркала I_bias</text>
  <text x="480" y="403" font-size="12" fill="#27ae60" text-anchor="middle">Фільтрація шумів живлення</text>

  <!-- Зв'язок Bias -> VAS -->
  <line x1="480" y1="330" x2="480" y2="296" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <text x="490" y="316" font-size="12" font-weight="bold" fill="#2457d6">I_bias</text>

  <!-- БЛОК 6: Термозахист TSD -->
  <rect x="614" y="330" width="220" height="90" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="724" y="348" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Термозахист TSD (~150 °C)</text>

  <rect x="626" y="356" width="196" height="54" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="724" y="373" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Датчик температури кристала</text>
  <text x="724" y="389" font-size="12" fill="#1a1a1a" text-anchor="middle">Поріг вимкнення: Tj &gt; 150 °C</text>
  <text x="724" y="403" font-size="12" fill="#27ae60" text-anchor="middle">Автоскидання: Tj &lt; 135 °C</text>

  <!-- Зв'язок Каскад 3 <-> TSD -->
  <line x1="676" y1="296" x2="676" y2="330" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 3" marker-end="url(#arr-alert)"/>
  <text x="666" y="316" font-size="12" fill="#6b7280" text-anchor="end">Тепло</text>

  <line x1="724" y1="330" x2="724" y2="296" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-alert)"/>
  <text x="734" y="316" font-size="12" font-weight="bold" fill="#c0392b">Вимкнення</text>
</svg>
