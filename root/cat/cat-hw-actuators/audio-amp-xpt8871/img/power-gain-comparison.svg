  <text x="260" y="371" font-size="12" fill="#1a1a1a">V_pk = Vdd = 5.0 В (2×)</text>
  <text x="260" y="389" font-size="12" fill="#1a1a1a">V_pp = 10.0 В (протифазне)</text>
  <text x="260" y="407" font-size="12" fill="#6b7280">Без вихідного конденсатора</text>
