  <text x="48" y="352" font-size="13" font-weight="bold" fill="#c0392b">Однотактна (SE)</text>
  <text x="48" y="371" font-size="12" fill="#1a1a1a">V_pk = Vdd / 2 = 2.5 В (1×)</text>
  <text x="48" y="389" font-size="12" fill="#1a1a1a">V_pp = 5.0 В (однополярне)</text>
  <text x="48" y="407" font-size="12" fill="#6b7280">Вимагає роздід. C_out</text>
