  <rect x="0" y="0" width="960" height="560" fill="white"/>
  <text x="480" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Принципова електрична схема аудіомодуля XPT8871 (BTL моно-підсилювач)</text>
  <text x="480" y="46" text-anchor="middle" font-size="13" fill="#6b7280">Внутрішні функціональні каскади ОП і зміщення, зовнішня обв'язка (CIN, RI, RF, CBYPASS, CS) та контактні майданчики</text>
  <!-- Друкована плата модуля -->
  <rect x="24" y="58" width="912" height="486" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="36" y="66" width="220" height="20" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="146" y="80" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">ПЛАТА МОДУЛЯ XPT8871</text>
  <!-- Підсумкові картки характеристик -->
  <rect x="36" y="494" width="260" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="46" y="509" font-size="12" font-weight="700" fill="#2457d6">Підсилення: |Av| = 2·(RF/RI) = 2 (+6 дБ)</text>
  <text x="46" y="525" font-size="12" fill="#1a1a1a">Зміщення: V_REF = VDD/2 (нуль DC)</text>
  <rect x="312" y="494" width="336" height="40" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="322" y="509" font-size="12" font-weight="700" fill="#1a1a1a">Фільтр НЧ: f_L = 1 / (2π · RI · CIN) ≈ 8 Гц</text>
  <text x="322" y="525" font-size="12" fill="#6b7280">Вхід SHDN: 0 = робота, 1 = сон (IQ &lt; 0.1 мкА)</text>
  <rect x="664" y="494" width="260" height="40" rx="6" fill="#e9f7ef" stroke="#a3d9b8" stroke-width="1"/>
  <text x="674" y="509" font-size="12" font-weight="700" fill="#27ae60">Вихідна BTL-потужність: P = VDD² / (2·RL)</text>
  <text x="674" y="525" font-size="12" fill="#1a1a1a">VDD = 5 В, RL = 4 Ом: P ≈ 3.1 Вт (5 Вт @ 2 Ом)</text>
  <!-- Мікросхема XPT8871 (SOP-8) -->
  <rect x="320" y="92" width="340" height="348" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M475,92 A15,15 0 0,0 505,92 Z" fill="#e2e8f0" stroke="#1a1a1a" stroke-width="1.5"/>
