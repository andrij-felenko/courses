<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Подвійна буферизація (Ping-Pong) аудіопотоку</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Почергова робота процесора та DMA усуває затримки й забезпечує безперервний звук</text>

  <!-- ================= ВЕРХНІЙ БЛОК: СХЕМА ПОТОКУ ================= -->

  <!-- Блок: Головний процесор (Producer) -->
  <rect x="35" y="74" width="210" height="202" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="140" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Головний процесор</text>
  <text x="140" y="117" font-size="12" fill="#6b7280" text-anchor="middle">Джерело (Producer)</text>

  <rect x="47" y="128" width="186" height="136" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="57" y="150" font-size="12" font-weight="bold" fill="#1a1a1a">Завдання у фоні:</text>
  <text x="57" y="172" font-size="12" fill="#1a1a1a">• Обчислення семплів</text>
  <text x="57" y="192" font-size="12" fill="#1a1a1a">• Декодування звуку</text>
  <text x="57" y="212" font-size="12" fill="#1a1a1a">• Запис у вільний буфер</text>
  <text x="57" y="236" font-size="12" font-weight="bold" fill="#27ae60">Не блокує відтворення</text>
  <text x="57" y="254" font-size="12" fill="#6b7280">Чекає прапорця / IRQ</text>

  <!-- Блок: Подвійний буфер ОЗП -->
  <rect x="295" y="74" width="340" height="202" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="465" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ОЗП: подвійна буферизація</text>
  <text x="465" y="117" font-size="12" fill="#6b7280" text-anchor="middle">Два незалежні масиви в SRAM (Ping-Pong)</text>

  <!-- Буфер A -->
  <rect x="307" y="128" width="316" height="64" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="319" y="149" font-size="13" font-weight="bold" fill="#2457d6">Буфер A (Ping) — 512 байтів</text>
  <text x="319" y="168" font-size="12" fill="#1a1a1a">Стан: Читання апаратним DMA</text>
  <text x="319" y="184" font-size="12" fill="#2457d6">Потокове виведення семплів</text>

  <!-- Буфер B -->
  <rect x="307" y="198" width="316" height="64" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="319" y="219" font-size="13" font-weight="bold" fill="#27ae60">Буфер B (Pong) — 512 байтів</text>
  <text x="319" y="238" font-size="12" fill="#1a1a1a">Стан: Запис процесором (CPU)</text>
  <text x="319" y="254" font-size="12" fill="#27ae60">Підготовка наступних семплів</text>

  <!-- Блок: Споживач (DMA / Timer) -->
  <rect x="685" y="74" width="240" height="202" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="805" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">DMA / Апаратний таймер</text>
  <text x="805" y="117" font-size="12" fill="#6b7280" text-anchor="middle">Споживач (Consumer)</text>

  <rect x="697" y="128" width="216" height="136" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="709" y="150" font-size="12" font-weight="bold" fill="#1a1a1a">Апаратне виведення:</text>
  <text x="709" y="172" font-size="12" fill="#1a1a1a">• Передача без участі CPU</text>
  <text x="709" y="192" font-size="12" fill="#1a1a1a">• Частота: 16 / 44.1 кГц</text>
  <text x="709" y="212" font-size="12" fill="#1a1a1a">• На ЦАП / ШІМ -> XPT8871</text>
  <text x="709" y="236" font-size="12" font-weight="bold" fill="#2457d6">Стабільний джитер = 0</text>
  <text x="709" y="254" font-size="12" fill="#c0392b">Генерує IRQ перемикання</text>

  <!-- Зв'язки (стрілки) -->
  <!-- Запис CPU -> Буфер B -->
  <line x1="245" y1="230" x2="305" y2="230" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="275" y="222" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Запис</text>

  <!-- Читання Буфер A -> DMA -->
  <line x1="623" y1="160" x2="683" y2="160" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="654" y="150" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Потік</text>

  <!-- ================= НИЖНІЙ БЛОК: ЧАСОВА ДІАГРАМА ================= -->
  <rect x="35" y="290" width="890" height="154" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="48" y="310" font-size="13" font-weight="bold" fill="#1a1a1a">Часова діаграма: синхронізація чергування буферів у часі (t)</text>

  <!-- Підписи сигналів зліва -->
  <text x="48" y="354" font-size="12" font-weight="bold" fill="#1a1a1a">CPU (Producer):</text>
  <text x="48" y="384" font-size="12" font-weight="bold" fill="#1a1a1a">DMA (Consumer):</text>
  <text x="48" y="423" font-size="12" font-weight="bold" fill="#2457d6">Звук на XPT8871:</text>

  <!-- Заголовки тактів -->
  <text x="362" y="330" font-size="12" fill="#6b7280" text-anchor="middle">Такт 1: виведення A, підготовка B</text>
  <text x="732" y="330" font-size="12" fill="#6b7280" text-anchor="middle">Такт 2: виведення B, підготовка A</text>

  <!-- Мітка події IRQ -->
  <text x="547" y="328" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Перемикання (IRQ)</text>
  <line x1="547" y1="334" x2="547" y2="394" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Такт 1: Блоки -->
  <rect x="185" y="338" width="355" height="22" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="362" y="354" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Заповнення Буфера B (обчислення наступних семплів)</text>

  <rect x="185" y="368" width="355" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="362" y="384" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Передача Буфера A в ЦАП (звучання поточних семплів)</text>

  <!-- Такт 2: Блоки -->
  <rect x="555" y="338" width="355" height="22" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="732" y="354" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Заповнення Буфера A (обчислення наступних семплів)</text>

  <rect x="555" y="368" width="355" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="732" y="384" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Передача Буфера B в ЦАП (звучання поточних семплів)</text>

  <!-- Безперервний звук унизу -->
  <rect x="185" y="406" width="725" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="547" y="423" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Безперервний моно-звук через XPT8871 (динамік 4–8 Ом): жодних пауз, клацань чи тріску</text>
</svg>
