<rect x="38" y="106" width="416" height="118" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="50" y="122" font-size="12" font-weight="700" fill="#6b7280">СХЕМНА ОБВ'ЯЗКА ТА РАДІОМОДУЛЬ</text>

