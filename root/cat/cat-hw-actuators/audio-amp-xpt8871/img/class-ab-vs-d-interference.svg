</defs>

<!-- Фонова підкладка -->
<rect x="0" y="0" width="960" height="460" fill="white"/>

<!-- Заголовок і підзаголовок -->
<text x="480" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Електромагнітні завади (EMI) та обв'язка: клас AB проти класу D</text>
<text x="480" y="48" text-anchor="middle" font-size="13" fill="#6b7280">Лінійний підсилювач не випромінює ВЧ-завад, тоді як ШІМ-комутація створює гармоніки в радіоефірі</text>

<!-- ==================== ЛІВА ПАНЕЛЬ: КЛАС AB ==================== -->
<rect x="24" y="64" width="444" height="382" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

<!-- Заголовок панелі та бейдж -->
