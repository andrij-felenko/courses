<!-- Секція 3: Підсумок -->
<rect x="38" y="384" width="416" height="50" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
<text x="50" y="403" font-size="12" font-weight="700" fill="#27ae60">✔ Чистий ефір: нуль EMI, радіомодуль поруч працює без завад</text>
<text x="50" y="422" font-size="12" fill="#1a1a1a">✔ Проста обв'язка: пряме з'єднання, без важких котушок індуктивності</text>

<!-- ==================== ПРАВА ПАНЕЛЬ: КЛАС D ==================== -->
<rect x="492" y="64" width="444" height="382" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

