<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="960" height="460" fill="white"/>

<defs>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
  </marker>
  <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
  </marker>
</defs>

<!-- Заголовок і підзаголовок -->
<text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Протікання струму в мостовому підсилювачі (BTL) за напівперіодами</text>
<text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Диференціальний вихід подвоює розмах напруги (±VDD) та піковий струм, забезпечуючи 4-кратну потужність</text>

<!-- ========================= ЛІВА ПАНЕЛЬ ========================= -->
<rect x="24" y="70" width="444" height="368" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
<text x="246" y="94" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Додатний напівперіод: фаза 90° (t = T/4)</text>
<text x="246" y="112" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Плече 1: VO1 = +VDD (+5 В)  |  Плече 2: VO2 = 0 В (GND)</text>

<!-- Живлення VDD і шина живлення -->
<text x="246" y="134" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">VDD = +5 В</text>
<line x1="120" y1="142" x2="372" y2="142" stroke="#d0d7de" stroke-width="2"/>
<!-- Активна ділянка шини VDD до Плеча 1 -->
<line x1="246" y1="142" x2="135" y2="142" stroke="#2457d6" stroke-width="3"/>
<line x1="210" y1="142" x2="175" y2="142" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>
<circle cx="246" cy="142" r="3.5" fill="#2457d6"/>

<!-- Плече 1: Верхній ключ 1A (ЗАМКНЕНО) -->
<line x1="135" y1="142" x2="135" y2="156" stroke="#2457d6" stroke-width="3"/>
<circle cx="135" cy="156" r="3" fill="#2457d6"/>
<line x1="135" y1="156" x2="135" y2="204" stroke="#2457d6" stroke-width="3"/>
<line x1="135" y1="168" x2="135" y2="188" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>
<circle cx="135" cy="204" r="3" fill="#2457d6"/>
<line x1="135" y1="204" x2="135" y2="218" stroke="#2457d6" stroke-width="3"/>

<text x="122" y="174" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Ключ 1A</text>
<text x="122" y="188" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">ЗАМКНЕНО</text>

<!-- Плече 1: Нижній ключ 1B (РОЗІМКНЕНО) -->
<line x1="135" y1="218" x2="135" y2="232" stroke="#d0d7de" stroke-width="2" stroke-dasharray="3,3"/>
<circle cx="135" cy="232" r="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<line x1="135" y1="280" x2="124" y2="244" stroke="#6b7280" stroke-width="2"/>
<circle cx="135" cy="280" r="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<line x1="135" y1="280" x2="135" y2="294" stroke="#d0d7de" stroke-width="2" stroke-dasharray="3,3"/>

<text x="112" y="252" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="end">Ключ 1B</text>
<text x="112" y="266" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">РОЗІМКНЕНО</text>

<!-- Вузол VO1 -->
<circle cx="135" cy="218" r="4" fill="#2457d6"/>
<text x="122" y="222" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">VO1 = +5 В</text>

<!-- Плече 2: Верхній ключ 2A (РОЗІМКНЕНО) -->
<line x1="357" y1="142" x2="357" y2="156" stroke="#d0d7de" stroke-width="2" stroke-dasharray="3,3"/>
<circle cx="357" cy="156" r="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<line x1="357" y1="204" x2="368" y2="168" stroke="#6b7280" stroke-width="2"/>
<circle cx="357" cy="204" r="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<line x1="357" y1="204" x2="357" y2="218" stroke="#d0d7de" stroke-width="2" stroke-dasharray="3,3"/>

<text x="378" y="174" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="start">Ключ 2A</text>
<text x="378" y="188" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">РОЗІМКНЕНО</text>

<!-- Плече 2: Нижній ключ 2B (ЗАМКНЕНО) -->
<line x1="357" y1="218" x2="357" y2="232" stroke="#2457d6" stroke-width="3"/>
<circle cx="357" cy="232" r="3" fill="#2457d6"/>
<line x1="357" y1="232" x2="357" y2="280" stroke="#2457d6" stroke-width="3"/>
<line x1="357" y1="244" x2="357" y2="264" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>
<circle cx="357" cy="280" r="3" fill="#2457d6"/>
<line x1="357" y1="280" x2="357" y2="294" stroke="#2457d6" stroke-width="3"/>

<text x="372" y="252" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Ключ 2B</text>
<text x="372" y="266" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">ЗАМКНЕНО</text>

<!-- Вузол VO2 -->
<circle cx="357" cy="218" r="4" fill="#2457d6"/>
<text x="370" y="222" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="start">VO2 = 0 В</text>

<!-- Струмова петля: горизонтальний провідник і динамік -->
<line x1="135" y1="218" x2="210" y2="218" stroke="#2457d6" stroke-width="3"/>
<line x1="155" y1="218" x2="185" y2="218" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>

<rect x="210" y="196" width="72" height="44" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
<text x="246" y="214" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">RL = 4 Ом</text>
<text x="246" y="230" font-size="12" fill="#6b7280" text-anchor="middle">Динамік</text>

<line x1="282" y1="218" x2="357" y2="218" stroke="#2457d6" stroke-width="3"/>
<line x1="305" y1="218" x2="335" y2="218" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>

<!-- Бейджі струму й напруги -->
<rect x="171" y="158" width="150" height="26" rx="13" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="246" y="175" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">I_peak = +1.25 А →</text>

<rect x="171" y="252" width="150" height="24" rx="12" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="246" y="268" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">V_load = +5 В (+VDD)</text>

<!-- Шина GND і зворотний струм -->
<line x1="120" y1="294" x2="372" y2="294" stroke="#d0d7de" stroke-width="2"/>
<line x1="357" y1="294" x2="246" y2="294" stroke="#2457d6" stroke-width="3"/>
<line x1="320" y1="294" x2="285" y2="294" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>
<circle cx="246" cy="294" r="3.5" fill="#2457d6"/>
<text x="246" y="314" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">GND (0 В)</text>

<!-- Підсумкова картка з розрахунками -->
<rect x="36" y="326" width="420" height="98" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="48" y="345" font-size="12" font-weight="bold" fill="#1a1a1a">Диференціальна напруга: V_load = VO1 − VO2 = +5 В</text>
<text x="48" y="365" font-size="12" font-weight="bold" fill="#2457d6">Піковий струм: I_peak = +VDD / RL = +5 В / 4 Ом = +1.25 А</text>
<text x="48" y="386" font-size="12" fill="#6b7280">В однотактній схемі (SE): V_max = 2.5 В → I_SE = 0.625 А</text>
<text x="48" y="406" font-size="12" font-weight="bold" fill="#27ae60">Висновок: струм подвоєно (2×), потужність зросла в 4 рази</text>

<!-- ========================= ПРАВА ПАНЕЛЬ ========================= -->
<rect x="492" y="70" width="444" height="368" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
<text x="714" y="94" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Від'ємний напівперіод: фаза 270° (t = 3T/4)</text>
<text x="714" y="112" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Плече 1: VO1 = 0 В (GND)  |  Плече 2: VO2 = +VDD (+5 В)</text>

<!-- Живлення VDD і шина живлення -->
<text x="714" y="134" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">VDD = +5 В</text>
<line x1="588" y1="142" x2="840" y2="142" stroke="#d0d7de" stroke-width="2"/>
<!-- Активна ділянка шини VDD до Плеча 2 -->
<line x1="714" y1="142" x2="825" y2="142" stroke="#2457d6" stroke-width="3"/>
<line x1="750" y1="142" x2="785" y2="142" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>
<circle cx="714" cy="142" r="3.5" fill="#2457d6"/>

<!-- Плече 1: Верхній ключ 1A (РОЗІМКНЕНО) -->
<line x1="603" y1="142" x2="603" y2="156" stroke="#d0d7de" stroke-width="2" stroke-dasharray="3,3"/>
<circle cx="603" cy="156" r="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<line x1="603" y1="204" x2="592" y2="168" stroke="#6b7280" stroke-width="2"/>
<circle cx="603" cy="204" r="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<line x1="603" y1="204" x2="603" y2="218" stroke="#d0d7de" stroke-width="2" stroke-dasharray="3,3"/>

<text x="580" y="174" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="end">Ключ 1A</text>
<text x="580" y="188" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">РОЗІМКНЕНО</text>

<!-- Плече 1: Нижній ключ 1B (ЗАМКНЕНО) -->
<line x1="603" y1="218" x2="603" y2="232" stroke="#2457d6" stroke-width="3"/>
<circle cx="603" cy="232" r="3" fill="#2457d6"/>
<line x1="603" y1="232" x2="603" y2="280" stroke="#2457d6" stroke-width="3"/>
<line x1="603" y1="244" x2="603" y2="264" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>
<circle cx="603" cy="280" r="3" fill="#2457d6"/>
<line x1="603" y1="280" x2="603" y2="294" stroke="#2457d6" stroke-width="3"/>

<text x="590" y="252" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Ключ 1B</text>
<text x="590" y="266" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">ЗАМКНЕНО</text>

<!-- Вузол VO1 -->
<circle cx="603" cy="218" r="4" fill="#2457d6"/>
<text x="590" y="222" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="end">VO1 = 0 В</text>

<!-- Плече 2: Верхній ключ 2A (ЗАМКНЕНО) -->
<line x1="825" y1="142" x2="825" y2="156" stroke="#2457d6" stroke-width="3"/>
<circle cx="825" cy="156" r="3" fill="#2457d6"/>
<line x1="825" y1="156" x2="825" y2="204" stroke="#2457d6" stroke-width="3"/>
<line x1="825" y1="168" x2="825" y2="188" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>
<circle cx="825" cy="204" r="3" fill="#2457d6"/>
<line x1="825" y1="204" x2="825" y2="218" stroke="#2457d6" stroke-width="3"/>

<text x="838" y="174" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Ключ 2A</text>
<text x="838" y="188" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">ЗАМКНЕНО</text>

<!-- Плече 2: Нижній ключ 2B (РОЗІМКНЕНО) -->
<line x1="825" y1="218" x2="825" y2="232" stroke="#d0d7de" stroke-width="2" stroke-dasharray="3,3"/>
<circle cx="825" cy="232" r="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<line x1="825" y1="280" x2="836" y2="244" stroke="#6b7280" stroke-width="2"/>
<circle cx="825" cy="280" r="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
<line x1="825" y1="280" x2="825" y2="294" stroke="#d0d7de" stroke-width="2" stroke-dasharray="3,3"/>

<text x="848" y="252" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="start">Ключ 2B</text>
<text x="848" y="266" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">РОЗІМКНЕНО</text>

<!-- Вузол VO2 -->
<circle cx="825" cy="218" r="4" fill="#2457d6"/>
<text x="838" y="222" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">VO2 = +5 В</text>

<!-- Струмова петля: горизонтальний провідник і динамік -->
<line x1="825" y1="218" x2="750" y2="218" stroke="#2457d6" stroke-width="3"/>
<line x1="800" y1="218" x2="770" y2="218" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>

<rect x="678" y="196" width="72" height="44" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
<text x="714" y="214" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">RL = 4 Ом</text>
<text x="714" y="230" font-size="12" fill="#6b7280" text-anchor="middle">Динамік</text>

<line x1="678" y1="218" x2="603" y2="218" stroke="#2457d6" stroke-width="3"/>
<line x1="655" y1="218" x2="625" y2="218" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>

<!-- Бейджі струму й напруги -->
<rect x="639" y="158" width="150" height="26" rx="13" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="714" y="175" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">← I_peak = −1.25 А</text>

<rect x="639" y="252" width="150" height="24" rx="12" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="714" y="268" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">V_load = −5 В (−VDD)</text>

<!-- Шина GND і зворотний струм -->
<line x1="588" y1="294" x2="840" y2="294" stroke="#d0d7de" stroke-width="2"/>
<line x1="603" y1="294" x2="714" y2="294" stroke="#2457d6" stroke-width="3"/>
<line x1="640" y1="294" x2="675" y2="294" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>
<circle cx="714" cy="294" r="3.5" fill="#2457d6"/>
<text x="714" y="314" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">GND (0 В)</text>

<!-- Підсумкова картка з розрахунками -->
<rect x="504" y="326" width="420" height="98" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="516" y="345" font-size="12" font-weight="bold" fill="#1a1a1a">Диференціальна напруга: V_load = VO1 − VO2 = −5 В</text>
<text x="516" y="365" font-size="12" font-weight="bold" fill="#2457d6">Піковий струм: I_peak = −VDD / RL = −5 В / 4 Ом = −1.25 А</text>
<text x="516" y="386" font-size="12" fill="#6b7280">Повний розмах: V_pp = 2·VDD = 10 В (удвічі більший за SE)</text>
<text x="516" y="406" font-size="12" font-weight="bold" fill="#27ae60">Пікова потужність: P = V²/RL = 6.25 Вт (у 4 рази вища за SE)</text>

</svg>
