  <!-- ==================== ПРАВА ПАНЕЛЬ (ПОЯСНЕННЯ) ==================== -->
  <!-- Картка 1: Параметри імпедансу -->
  <rect x="620" y="75" width="315" height="112" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="635" y="96" font-size="13" font-weight="bold" fill="#1a1a1a">Характерні зони імпедансу</text>
  <text x="635" y="118" font-size="12" fill="#1a1a1a">• Re = 3.6 Ом: опір котушки на DC (f → 0)</text>
  <text x="635" y="138" font-size="12" fill="#1a1a1a">• fs = 180 Гц: резонанс (Zmax = 32 Ом)</text>
  <text x="635" y="158" font-size="12" fill="#1a1a1a">• Znom = 4 Ом: мінімум (500–1000 Гц)</text>
  <text x="635" y="178" font-size="12" fill="#1a1a1a">• 2πf·Le: індуктивний підйом на ВЧ</text>

  <!-- Картка 2: Тепловий режим -->
  <rect x="620" y="201" width="315" height="112" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="635" y="222" font-size="13" font-weight="bold" fill="#c0392b">Тепловий режим (XPT8871)</text>
  <text x="635" y="244" font-size="12" fill="#1a1a1a">• Найважчий режим: плато Zmin ≈ 4 Ом</text>
  <text x="635" y="264" font-size="12" fill="#1a1a1a">• Макс. струм спричиняє нагрів чіпа:</text>
  <text x="635" y="284" font-size="12" fill="#1a1a1a">  Pdiss = (2·Vdd·Ipeak)/π − Pout</text>
  <text x="635" y="304" font-size="12" fill="#1a1a1a">• На частоті fs струм мінімальний</text>

  <!-- Картка 3: Ланцюг Цобеля -->
  <rect x="620" y="327" width="315" height="112" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="635" y="348" font-size="13" font-weight="bold" fill="#27ae60">Ланцюг Цобеля (R-C компенсація)</text>
  <text x="635" y="370" font-size="12" fill="#1a1a1a">• R-C шунт паралельно динаміку</text>
  <text x="635" y="390" font-size="12" fill="#1a1a1a">• Параметри: R ≈ Znom (4 Ом), C ≈ Le/R²</text>
  <text x="635" y="410" font-size="12" fill="#1a1a1a">• Стабілізує |Z| ≈ 4 Ом на частотах &gt;5 кГц</text>
  <text x="635" y="430" font-size="12" fill="#1a1a1a">• Запобігає ВЧ-збудженню підсилювача</text>
</svg>
