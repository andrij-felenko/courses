<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вузол опорної напруги Bypass та плавний пуск аудіопідсилювача</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Плавний заряд C_BYPASS усуває клацання звукової котушки під час увімкнення живлення</text>

  <!-- Ліва панель: Схема -->
  <rect x="24" y="70" width="444" height="370" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="246" y="96" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема вузла опорної напруги (Bypass)</text>

  <!-- Мікросхема XPT8871 (межа IC) -->
  <rect x="36" y="112" width="286" height="258" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="6,4"/>
  <rect x="44" y="120" width="144" height="20" rx="3" fill="#eaf0fd"/>
  <text x="116" y="134" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Мікросхема XPT8871</text>

  <!-- Подільник напруги -->
  <text x="74" y="153" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">VDD (+5 В)</text>
  <circle cx="74" cy="159" r="3.5" fill="#1a1a1a"/>
  <line x1="74" y1="159" x2="74" y2="172" stroke="#1a1a1a" stroke-width="1.5"/>

  <rect x="66" y="172" width="16" height="28" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="88" y="190" font-size="12" fill="#1a1a1a">R1 = 50 кОм</text>
  <line x1="74" y1="200" x2="74" y2="242" stroke="#1a1a1a" stroke-width="1.5"/>

  <circle cx="74" cy="221" r="3.5" fill="#1a1a1a"/>
  <text x="105" y="217" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">VDD/2</text>

  <rect x="66" y="242" width="16" height="28" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="88" y="260" font-size="12" fill="#1a1a1a">R2 = 50 кОм</text>
  <line x1="74" y1="270" x2="74" y2="302" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- GND подільника -->
  <line x1="64" y1="302" x2="84" y2="302" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="68" y1="306" x2="80" y2="306" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="71" y1="310" x2="77" y2="310" stroke="#1a1a1a" stroke-width="1"/>
  <text x="74" y="324" font-size="12" fill="#6b7280" text-anchor="middle">GND</text>

  <!-- З'єднання з буфером -->
  <line x1="74" y1="221" x2="168" y2="221" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="168" cy="221" r="3" fill="#1a1a1a"/>
  <line x1="168" y1="221" x2="168" y2="201" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="168" y1="201" x2="182" y2="201" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Буфер Ku=1 -->
  <path d="M 182,187 L 224,213 L 182,239 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="185" y="209" font-size="12" font-weight="bold" fill="#2457d6">+</text>
  <text x="185" y="231" font-size="12" font-weight="bold" fill="#2457d6">−</text>
  <text x="203" y="181" font-size="12" fill="#6b7280" text-anchor="middle">Буфер Ku=1</text>

  <!-- Зворотний зв'язок ОП -->
  <line x1="224" y1="213" x2="238" y2="213" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="238" cy="213" r="3" fill="#1a1a1a"/>
  <line x1="238" y1="213" x2="238" y2="246" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="238" y1="246" x2="174" y2="246" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="174" y1="246" x2="174" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="174" y1="225" x2="182" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Вихід V_REF -->
  <line x1="238" y1="213" x2="305" y2="213" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="246" y="175" font-size="12" font-weight="bold" fill="#27ae60">Опора V_REF</text>
  <text x="246" y="190" font-size="12" fill="#6b7280">(R_вих ≈ 0)</text>
  <text x="246" y="208" font-size="12" font-weight="bold" fill="#27ae60">VDD/2</text>

  <!-- Вивід BYPASS -->
  <line x1="168" y1="221" x2="168" y2="300" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="168" y1="300" x2="322" y2="300" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="322" cy="300" r="4.5" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="314" y="282" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">BYPASS</text>
  <text x="314" y="296" font-size="12" fill="#6b7280" text-anchor="end">Pin 2</text>

  <!-- C_BYPASS зовнішній -->
  <line x1="327" y1="300" x2="368" y2="300" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="368" y1="300" x2="368" y2="318" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="354" y1="318" x2="382" y2="318" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="354" y1="325" x2="382" y2="325" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="368" y1="325" x2="368" y2="343" stroke="#1a1a1a" stroke-width="1.5"/>

  <line x1="358" y1="343" x2="378" y2="343" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="362" y1="347" x2="374" y2="347" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="365" y1="351" x2="371" y2="351" stroke="#1a1a1a" stroke-width="1"/>
  <text x="368" y="365" font-size="12" fill="#6b7280" text-anchor="middle">GND</text>

  <text x="390" y="322" font-size="12" font-weight="bold" fill="#1a1a1a">C_BYPASS</text>
  <text x="390" y="337" font-size="12" fill="#2457d6">0.1...1 мкФ</text>
  <text x="390" y="352" font-size="12" fill="#6b7280">(зовнішній)</text>

  <!-- Плашка формули -->
  <rect x="36" y="382" width="420" height="48" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="48" y="401" font-size="12" font-weight="bold" fill="#2457d6">Постійна часу заряду: τ = (R1 || R2) · C_BYPASS</text>
  <text x="48" y="418" font-size="12" fill="#1a1a1a">τ = 25 кОм · 1 мкФ = 25 мс: плавне зростання VDD/2 без кидків</text>

  <!-- Права панель: Часові діаграми -->
  <rect x="492" y="70" width="444" height="370" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="714" y="96" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма пуску та струм динаміка</text>

  <!-- Графік 1: Напруги -->
  <line x1="550" y1="240" x2="550" y2="125" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="542" y="130" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">U (В)</text>

  <line x1="550" y1="240" x2="915" y2="240" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="915" y="254" font-size="12" fill="#1a1a1a" text-anchor="end">t</text>

  <line x1="546" y1="145" x2="550" y2="145" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="542" y="149" font-size="12" fill="#6b7280" text-anchor="end">5 В</text>
  <line x1="550" y1="145" x2="890" y2="145" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <line x1="546" y1="185" x2="550" y2="185" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="542" y="189" font-size="12" fill="#2457d6" text-anchor="end">2.5 В</text>
  <line x1="550" y1="185" x2="890" y2="185" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="542" y="244" font-size="12" fill="#6b7280" text-anchor="end">0 В</text>

  <line x1="610" y1="130" x2="610" y2="240" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="610" y="254" font-size="12" fill="#6b7280" text-anchor="middle">t_ON</text>

  <path d="M 550,240 L 610,240 L 610,145 L 890,145" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="625" y="138" font-size="12" fill="#6b7280">VDD (+5 В): миттєвий стрибок</text>

  <path d="M 550,240 L 610,240 C 650,240 700,186 850,185 L 890,185" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <text x="660" y="174" font-size="12" font-weight="bold" fill="#2457d6">V_BYPASS (експонента, τ = 25 мс)</text>

  <text x="735" y="222" font-size="12" fill="#27ae60">Синфазність: ΔV_OUT ≈ 0 В</text>

  <!-- Графік 2: Струм динаміка -->
  <line x1="550" y1="388" x2="550" y2="280" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="542" y="285" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">I_дин</text>

  <line x1="550" y1="345" x2="915" y2="345" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="915" y="358" font-size="12" fill="#1a1a1a" text-anchor="end">t</text>

  <line x1="546" y1="305" x2="550" y2="305" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="542" y="309" font-size="12" fill="#c0392b" text-anchor="end">+1 А</text>

  <text x="542" y="349" font-size="12" fill="#6b7280" text-anchor="end">0 А</text>

  <line x1="546" y1="375" x2="550" y2="375" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="542" y="379" font-size="12" fill="#c0392b" text-anchor="end">−0.5 А</text>

  <line x1="610" y1="285" x2="610" y2="388" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>

  <path d="M 550,345 L 610,345 L 620,305 L 635,375 L 655,338 L 675,347 L 690,345 L 890,345" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="635" y="298" font-size="12" font-weight="bold" fill="#c0392b">Клацання ("POP")</text>

  <line x1="550" y1="345" x2="890" y2="345" stroke="#27ae60" stroke-width="2.5"/>
  <text x="700" y="336" font-size="12" font-weight="bold" fill="#27ae60">Плавний пуск: I_дин = 0 мА (ТИША)</text>

  <!-- Порівняльні блоки -->
  <rect x="502" y="396" width="206" height="34" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="605" y="410" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">БЕЗ C_BYPASS (клацання):</text>
  <text x="605" y="423" font-size="12" fill="#c0392b" text-anchor="middle">кидок струму (удар котушки)</text>

  <rect x="720" y="396" width="206" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="823" y="410" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">З C_BYPASS (тихий старт):</text>
  <text x="823" y="423" font-size="12" fill="#27ae60" text-anchor="middle">I_дин ≈ 0 мА (дифузор у спокої)</text>
</svg>
