<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Посадкове місце ESOP-8 з матрицею отворів і зворотним полігоном</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Матриця 2×3 перехідних отворів Ø0.3 мм скидає тепло на зворотний мідний шар</text>

  <!-- Ліва панель: Топологія посадкового місця -->
  <rect x="30" y="75" width="435" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="247" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Топологія посадкового місця (вид зверху)</text>
  <text x="247" y="118" font-size="12" fill="#6b7280" text-anchor="middle">Верхня мідь (Top Layer) та межа нижнього полігона GND</text>

  <!-- Зворотний полігон GND (пунктирний контур / підкладка) -->
  <rect x="50" y="135" width="395" height="205" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="60" y="152" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">Зворотний шар (Bottom Layer): мідний полігон GND</text>
  <text x="60" y="168" font-size="12" fill="#6b7280" text-anchor="start">Суцільна мідь без термобар'єрів (площа ≥ 200 мм²)</text>

  <!-- Контур корпусу мікросхеми ESOP-8 (шовкографія) -->
  <rect x="177" y="188" width="140" height="144" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="190" cy="198" r="3.5" fill="#1a1a1a"/>
  <text x="252" y="202" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Корпус ESOP-8</text>

  <!-- Виводи 1..4 (ліворуч) -->
  <rect x="142" y="212" width="30" height="18" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="136" y="225" font-size="12" fill="#1a1a1a" text-anchor="end">1: SHDN</text>

  <rect x="142" y="242" width="30" height="18" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="136" y="255" font-size="12" fill="#1a1a1a" text-anchor="end">2: BYPASS</text>

  <rect x="142" y="272" width="30" height="18" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="136" y="285" font-size="12" fill="#1a1a1a" text-anchor="end">3: IN+</text>

  <rect x="142" y="302" width="30" height="18" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="136" y="315" font-size="12" fill="#1a1a1a" text-anchor="end">4: IN−</text>

  <!-- Виводи 8..5 (праворуч) -->
  <rect x="322" y="212" width="30" height="18" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="358" y="225" font-size="12" fill="#1a1a1a" text-anchor="start">8: VO2</text>

  <rect x="322" y="242" width="30" height="18" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="358" y="255" font-size="12" fill="#1a1a1a" text-anchor="start">7: GND</text>

  <rect x="322" y="272" width="30" height="18" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="358" y="285" font-size="12" fill="#1a1a1a" text-anchor="start">6: VDD</text>

  <rect x="322" y="302" width="30" height="18" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="358" y="315" font-size="12" fill="#1a1a1a" text-anchor="start">5: VO1</text>

  <!-- Центральний тепловідвідний майданчик (Exposed Pad) -->
  <rect x="205" y="212" width="84" height="108" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Матриця 2×3 перехідних отворів Ø0.3 мм -->
  <!-- Стовпчик 1 (x=232) -->
  <circle cx="232" cy="236" r="7" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="232" cy="236" r="3.5" fill="#2457d6"/>

  <circle cx="232" cy="266" r="7" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="232" cy="266" r="3.5" fill="#2457d6"/>

  <circle cx="232" cy="296" r="7" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="232" cy="296" r="3.5" fill="#2457d6"/>

  <!-- Стовпчик 2 (x=262) -->
  <circle cx="262" cy="236" r="7" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="262" cy="236" r="3.5" fill="#2457d6"/>

  <circle cx="262" cy="266" r="7" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="262" cy="266" r="3.5" fill="#2457d6"/>

  <circle cx="262" cy="296" r="7" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="262" cy="296" r="3.5" fill="#2457d6"/>

  <!-- Пояснення внизу лівої панелі -->
  <text x="247" y="360" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Матриця 2×3: отвори Ø0.3 мм, крок 1.0–1.2 мм</text>
  <text x="247" y="380" font-size="12" fill="#1a1a1a" text-anchor="middle">Exposed Pad 2.4 × 3.3 мм припаяний до міді Top Layer</text>
  <text x="247" y="400" font-size="12" fill="#1a1a1a" text-anchor="middle">Діаметр 0.3 мм запобігає витіканню припою крізь отвори</text>
  <text x="247" y="420" font-size="12" fill="#6b7280" text-anchor="middle">Зворотний полігон GND з'єднаний суцільною міддю</text>

  <!-- Права панель: Поперечний розріз плати -->
  <rect x="495" y="75" width="435" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="712" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Поперечний розріз плати (відведення тепла)</text>
  <text x="712" y="118" font-size="12" fill="#6b7280" text-anchor="middle">Шлях тепла: кристал → Exposed Pad → отвори → полігон</text>

  <!-- Виводи мікросхеми (gull-wing) ліворуч і праворуч -->
  <path d="M600,158 L578,158 L578,184 L562,184" fill="none" stroke="#6b7280" stroke-width="2.5"/>
  <path d="M824,158 L846,158 L846,184 L862,184" fill="none" stroke="#6b7280" stroke-width="2.5"/>

  <!-- Бічні контактні площадки виводів Top Layer -->
  <rect x="554" y="184" width="16" height="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <rect x="854" y="184" width="16" height="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>

  <!-- Корпус мікросхеми ESOP-8 (пластик) -->
  <rect x="600" y="138" width="224" height="38" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Кремнієвий кристал (нагрів) -->
  <rect x="620" y="144" width="184" height="22" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="712" y="160" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Кристал XPT8871 (нагрів)</text>

  <!-- Металевий Exposed Pad мікросхеми -->
  <rect x="630" y="172" width="164" height="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <!-- Паяний шов (припій) -->
  <rect x="630" y="178" width="164" height="6" fill="#d0d7de" stroke="#6b7280" stroke-width="0.75"/>
  <!-- Верхній шар міді (Top Copper / Thermal Pad) -->
  <rect x="625" y="184" width="174" height="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>

  <!-- Діелектрик плати FR-4 -->
  <rect x="515" y="190" width="394" height="66" rx="2" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Текстові підписи всередині FR-4 (ліворуч від отворів) -->
  <text x="525" y="216" font-size="12" fill="#6b7280" text-anchor="start">FR-4 (h = 1.6 мм)</text>
  <text x="525" y="236" font-size="12" fill="#c0392b" text-anchor="start">λ = 0.3 Вт/(м·К)</text>

  <!-- Текстові підписи всередині FR-4 (праворуч від отворів) -->
  <text x="780" y="216" font-size="12" fill="#2457d6" text-anchor="start">Мідь стінок отвору</text>
  <text x="780" y="236" font-size="12" fill="#2457d6" text-anchor="start">λ = 385 Вт/(м·К)</text>

  <!-- 3 перехідні отвори у розрізі (ряд матриці 2×3) -->
  <!-- Отвір 1 (x=660) -->
  <line x1="654" y1="184" x2="654" y2="264" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="666" y1="184" x2="666" y2="264" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="660" y1="196" x2="660" y2="246" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Отвір 2 (x=712) -->
  <line x1="706" y1="184" x2="706" y2="264" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="718" y1="184" x2="718" y2="264" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="712" y1="196" x2="712" y2="246" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Отвір 3 (x=764) -->
  <line x1="758" y1="184" x2="758" y2="264" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="770" y1="184" x2="770" y2="264" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="764" y1="196" x2="764" y2="246" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Нижній шар міді (Зворотний мідний полігон GND) -->
  <rect x="515" y="256" width="394" height="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>

  <!-- Стрілки розтікання тепла по зворотній міді -->
  <line x1="645" y1="274" x2="540" y2="274" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="779" y1="274" x2="884" y2="274" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Стрілки розсіювання тепла в повітря -->
  <line x1="600" y1="268" x2="600" y2="288" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="712" y1="268" x2="712" y2="288" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="824" y1="268" x2="824" y2="288" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Підписи зворотного полігона -->
  <text x="712" y="310" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Зворотний мідний полігон GND (розсіювання тепла)</text>
  <text x="712" y="328" font-size="12" fill="#1a1a1a" text-anchor="middle">Тепловий міст: кристал → припій → 6 отворів → полігон</text>

  <!-- Порівняльні картки внизу правої панелі -->
  <!-- Картка 1: Без отворів -->
  <rect x="515" y="348" width="190" height="72" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="610" y="368" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Без отворів (тільки FR-4)</text>
  <text x="610" y="386" font-size="12" fill="#1a1a1a" text-anchor="middle">RθJA ≈ 80–90 °C/W</text>
  <text x="610" y="404" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Перегрів > 150 °C при 2 Вт</text>

  <!-- Картка 2: З матрицею 2×3 та полігоном -->
  <rect x="720" y="348" width="190" height="72" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="815" y="368" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Матриця 2×3 + полігон</text>
  <text x="815" y="386" font-size="12" fill="#1a1a1a" text-anchor="middle">RθJA ≈ 25–30 °C/W</text>
  <text x="815" y="404" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Стабільна робота 5 Вт</text>
</svg>
