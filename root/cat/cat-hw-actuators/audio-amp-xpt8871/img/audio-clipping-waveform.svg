<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Полотно -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Кліпування вихідного сигналу та спектр гармонік в XPT8871</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Зрізання верхівок синусоїди на межах VDD і GND породжує сплеск непарних гармонік</text>

  <!-- ЛІВА ПАНЕЛЬ: ЧАСОВА ОБЛАСТЬ -->
  <rect x="24" y="70" width="444" height="388" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="44" y="96" font-size="14" font-weight="700" fill="#1a1a1a">Форма сигналу в часі (обмеження розмаху)</text>
  <text x="44" y="114" font-size="12" fill="#6b7280">Вихідна напруга Vout упирається в рейки живлення VDD та GND</text>

  <!-- Графік лівої панелі -->
  <rect x="94" y="128" width="354" height="196" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>

  <!-- Мітки осі напруги ліворуч від графіка -->
  <text x="44" y="142" font-size="12" font-weight="700" fill="#1a1a1a">U, В</text>
  <text x="88" y="156" font-size="12" font-weight="700" fill="#c0392b" text-anchor="end">VDD</text>
  <text x="88" y="230" font-size="12" fill="#6b7280" text-anchor="end">VDD/2</text>
  <text x="88" y="304" font-size="12" font-weight="700" fill="#c0392b" text-anchor="end">GND</text>

  <!-- Лінії рівнів живлення -->
  <line x1="94" y1="152" x2="448" y2="152" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="94" y1="226" x2="438" y2="226" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="438" y1="226" x2="446" y2="226" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="442" y="220" font-size="12" fill="#6b7280" text-anchor="end">t</text>
  <line x1="94" y1="300" x2="448" y2="300" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Затінення зрізаних верхівок (втрачена енергія) -->
  <path d="M 146.2,152 Q 165,136 183.8,152 Z" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="2 2"/>
  <path d="M 246.2,300 Q 265,316 283.8,300 Z" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="2 2"/>
  <path d="M 346.2,152 Q 365,136 383.8,152 Z" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Ідеальна синусоїда (пунктир) -->
  <path d="M 115,226 C 135,170 145,136 165,136 C 185,136 195,170 215,226 C 235,282 245,316 265,316 C 285,316 295,282 315,226 C 335,170 345,136 365,136 C 385,136 395,170 415,226" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Реальний кліпований сигнал (товста лінія) -->
  <path d="M 115,226 C 128,190 137,163 146.2,152 L 183.8,152 C 193,163 202,190 215,226 C 228,262 237,289 246.2,300 L 283.8,300 C 293,289 302,262 315,226 C 328,190 337,163 346.2,152 L 383.8,152 C 393,163 402,190 415,226" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Легенда лівої панелі -->
  <line x1="44" y1="344" x2="74" y2="344" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="82" y="348" font-size="12" fill="#2457d6">Ідеальний синус (розрахунковий)</text>
  <line x1="264" y1="344" x2="294" y2="344" stroke="#c0392b" stroke-width="2.5"/>
  <text x="302" y="348" font-size="12" font-weight="700" fill="#c0392b">Кліпований вихід</text>

  <!-- Картка висновку лівої панелі -->
  <rect x="44" y="368" width="404" height="74" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="58" y="392" font-size="12" font-weight="700" fill="#c0392b">Кліпування верхівок (насичення вихідних ключів)</text>
  <text x="58" y="412" font-size="12" fill="#1a1a1a">Коли розмах перевищує напругу живлення VDD, транзистори</text>
  <text x="58" y="430" font-size="12" fill="#1a1a1a">входять у насичення, перетворюючи синус на жорстку трапецію.</text>

  <!-- Стрілка переходу від форми сигналу до спектра -->
  <line x1="472" y1="226" x2="486" y2="226" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- ПРАВА ПАНЕЛЬ: ЧАСТОТНА ОБЛАСТЬ -->
  <rect x="492" y="70" width="444" height="388" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="512" y="96" font-size="14" font-weight="700" fill="#1a1a1a">Частотна область: спектр гармонік (FFT)</text>
  <text x="512" y="114" font-size="12" fill="#6b7280">Симетричне зрізання генерує масив непарних гармонік</text>

  <!-- Графік правої панелі -->
  <rect x="562" y="128" width="354" height="196" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>

  <!-- Мітки осі рівня дБ ліворуч від графіка -->
  <text x="512" y="142" font-size="12" font-weight="700" fill="#1a1a1a">Рівень</text>
  <text x="550" y="164" font-size="12" fill="#6b7280" text-anchor="end">0 дБ</text>
  <text x="550" y="199" font-size="12" fill="#6b7280" text-anchor="end">-10 дБ</text>
  <text x="550" y="234" font-size="12" fill="#6b7280" text-anchor="end">-20 дБ</text>
  <text x="550" y="269" font-size="12" fill="#6b7280" text-anchor="end">-30 дБ</text>
  <text x="550" y="304" font-size="12" fill="#6b7280" text-anchor="end">-40 дБ</text>

  <!-- Засічки осі Y -->
  <line x1="556" y1="160" x2="562" y2="160" stroke="#6b7280" stroke-width="1"/>
  <line x1="556" y1="195" x2="562" y2="195" stroke="#6b7280" stroke-width="1"/>
  <line x1="556" y1="230" x2="562" y2="230" stroke="#6b7280" stroke-width="1"/>
  <line x1="556" y1="265" x2="562" y2="265" stroke="#6b7280" stroke-width="1"/>
  <line x1="556" y1="300" x2="562" y2="300" stroke="#6b7280" stroke-width="1"/>

  <!-- Базова лінія спектра зі стрілкою -->
  <line x1="562" y1="300" x2="910" y2="300" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="904" y1="300" x2="914" y2="300" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="910" y="294" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">f</text>

  <!-- Плашка над непарними гармоніками -->
  <rect x="644" y="136" width="248" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="768" y="153" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Сплеск непарних гармонік</text>

  <!-- Стовпчики гармонік (9 гармонік f0..9f0) -->
  <!-- f0: 1 кГц (корисний сигнал) -->
  <rect x="580" y="160" width="16" height="140" fill="#2457d6" rx="2"/>
  <text x="588" y="152" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">f₀</text>

  <!-- 2f0: парна (пригнічена ≈ 0) -->
  <rect x="616" y="296" width="16" height="4" fill="#d0d7de" rx="1"/>
  <text x="624" y="290" font-size="12" fill="#6b7280" text-anchor="middle">≈0</text>

  <!-- 3f0: непарна (сплеск -10 дБ) -->
  <rect x="652" y="195" width="16" height="105" fill="#c0392b" rx="2"/>
  <text x="660" y="187" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">3f₀</text>

  <!-- 4f0: парна (пригнічена ≈ 0) -->
  <rect x="688" y="296" width="16" height="4" fill="#d0d7de" rx="1"/>
  <text x="696" y="290" font-size="12" fill="#6b7280" text-anchor="middle">≈0</text>

  <!-- 5f0: непарна (сплеск -18 дБ) -->
  <rect x="724" y="222" width="16" height="78" fill="#c0392b" rx="2"/>
  <text x="732" y="214" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">5f₀</text>

  <!-- 6f0: парна (пригнічена ≈ 0) -->
  <rect x="760" y="296" width="16" height="4" fill="#d0d7de" rx="1"/>
  <text x="768" y="290" font-size="12" fill="#6b7280" text-anchor="middle">≈0</text>

  <!-- 7f0: непарна (сплеск -24 дБ) -->
  <rect x="796" y="244" width="16" height="56" fill="#c0392b" rx="2"/>
  <text x="804" y="236" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">7f₀</text>

  <!-- 8f0: парна (пригнічена ≈ 0) -->
  <rect x="832" y="296" width="16" height="4" fill="#d0d7de" rx="1"/>
  <text x="840" y="290" font-size="12" fill="#6b7280" text-anchor="middle">≈0</text>

  <!-- 9f0: непарна (сплеск -29 дБ) -->
  <rect x="868" y="260" width="16" height="40" fill="#c0392b" rx="2"/>
  <text x="876" y="252" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">9f₀</text>

  <!-- Легенда правої панелі -->
  <rect x="512" y="338" width="12" height="12" fill="#2457d6" rx="2"/>
  <text x="530" y="348" font-size="12" fill="#2457d6">Основний тон (f₀)</text>
  <rect x="664" y="338" width="12" height="12" fill="#c0392b" rx="2"/>
  <text x="682" y="348" font-size="12" font-weight="700" fill="#c0392b">Непарні гармоніки (3f₀, 5f₀...)</text>

  <!-- Картка висновку правої панелі -->
  <rect x="512" y="368" width="404" height="74" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="526" y="392" font-size="12" font-weight="700" fill="#c0392b">Спектральний сплеск: лавиноподібне зростання THD</text>
  <text x="526" y="412" font-size="12" fill="#1a1a1a">Симетричний зріз діє як меандр — генерує ряд 1/n гармонік.</text>
  <text x="526" y="430" font-size="12" fill="#1a1a1a">Високочастотна енергія створює брязкіт і перегріває динамік.</text>
</svg>
