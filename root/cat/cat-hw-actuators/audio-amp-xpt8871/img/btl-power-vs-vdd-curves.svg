<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Залежність вихідної потужності BTL-підсилювача від напруги: PRMS = VDD² / (2·RL)</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Квадратична залежність P ~ VDD²: при 5 В динамік 4 Ом дає оптимум 3.1 Вт, а 2 Ом загрожує перегрівом</text>

  <!-- Рамка графіка -->
  <rect x="85" y="105" width="420" height="280" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.2" rx="4"/>

  <!-- Сітка Y (горизонтальні лінії) -->
  <!-- 7 W: починається після легенди x=315 -->
  <line x1="315" y1="140" x2="505" y2="140" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- 6 W: починається після легенди x=315 -->
  <line x1="315" y1="175" x2="505" y2="175" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- 5 W (паспортна межа XPT8871): виділена лінія -->
  <line x1="85" y1="210" x2="505" y2="210" stroke="#fca5a5" stroke-width="1.2" stroke-dasharray="4,3"/>
  <!-- 4 W -->
  <line x1="85" y1="245" x2="505" y2="245" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- 3 W -->
  <line x1="85" y1="280" x2="505" y2="280" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- 2 W -->
  <line x1="85" y1="315" x2="505" y2="315" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- 1 W -->
  <line x1="85" y1="350" x2="505" y2="350" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Вертикальні опорні лінії VDD -->
  <!-- VDD = 3.7 В (Li-ion): x = 253 (йде від низу легенди y=198 до осі X) -->
  <line x1="253" y1="198" x2="253" y2="385" stroke="#cbd5e1" stroke-width="1.2" stroke-dasharray="4,4"/>
  <!-- VDD = 5.0 В (USB): x = 435 -->
  <line x1="435" y1="105" x2="435" y2="385" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4,4"/>
  <text x="435" y="98" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">VDD = 5.0 В (USB)</text>

  <!-- Криві залежності потужності -->
  <!-- 2 Ом -->
  <path d="M 85.0,330.3 L 92.0,328.1 L 99.0,325.9 L 106.0,323.6 L 113.0,321.2 L 120.0,318.8 L 127.0,316.4 L 134.0,313.9 L 141.0,311.4 L 148.0,308.9 L 155.0,306.2 L 162.0,303.6 L 169.0,300.9 L 176.0,298.2 L 183.0,295.4 L 190.0,292.6 L 197.0,289.7 L 204.0,286.8 L 211.0,283.9 L 218.0,280.9 L 225.0,277.8 L 232.0,274.7 L 239.0,271.6 L 246.0,268.4 L 253.0,265.2 L 260.0,262.0 L 267.0,258.6 L 274.0,255.3 L 281.0,251.9 L 288.0,248.5 L 295.0,245.0 L 302.0,241.5 L 309.0,237.9 L 316.0,234.3 L 323.0,230.7 L 330.0,227.0 L 337.0,223.2 L 344.0,219.4 L 351.0,215.6 L 358.0,211.7 L 365.0,207.8 L 372.0,203.9 L 379.0,199.9 L 386.0,195.8 L 393.0,191.7 L 400.0,187.6 L 407.0,183.4 L 414.0,179.2 L 421.0,174.9 L 428.0,170.6 L 435.0,166.2 L 442.0,161.9 L 449.0,157.4 L 456.0,152.9 L 463.0,148.4 L 470.0,143.8 L 477.0,139.2 L 484.0,134.6 L 491.0,129.8 L 498.0,125.1 L 505.0,120.3" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <!-- 4 Ом -->
  <path d="M 85.0,357.7 L 92.0,356.6 L 99.0,355.4 L 106.0,354.3 L 113.0,353.1 L 120.0,351.9 L 127.0,350.7 L 134.0,349.5 L 141.0,348.2 L 148.0,346.9 L 155.0,345.6 L 162.0,344.3 L 169.0,343.0 L 176.0,341.6 L 183.0,340.2 L 190.0,338.8 L 197.0,337.4 L 204.0,335.9 L 211.0,334.4 L 218.0,332.9 L 225.0,331.4 L 232.0,329.9 L 239.0,328.3 L 246.0,326.7 L 253.0,325.1 L 260.0,323.5 L 267.0,321.8 L 274.0,320.2 L 281.0,318.5 L 288.0,316.7 L 295.0,315.0 L 302.0,313.2 L 309.0,311.5 L 316.0,309.7 L 323.0,307.8 L 330.0,306.0 L 337.0,304.1 L 344.0,302.2 L 351.0,300.3 L 358.0,298.4 L 365.0,296.4 L 372.0,294.4 L 379.0,292.4 L 386.0,290.4 L 393.0,288.4 L 400.0,286.3 L 407.0,284.2 L 414.0,282.1 L 421.0,280.0 L 428.0,277.8 L 435.0,275.6 L 442.0,273.4 L 449.0,271.2 L 456.0,269.0 L 463.0,266.7 L 470.0,264.4 L 477.0,262.1 L 484.0,259.8 L 491.0,257.4 L 498.0,255.1 L 505.0,252.7" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <!-- 8 Ом -->
  <path d="M 85.0,371.3 L 92.0,370.8 L 99.0,370.2 L 106.0,369.6 L 113.0,369.1 L 120.0,368.5 L 127.0,367.9 L 134.0,367.2 L 141.0,366.6 L 148.0,366.0 L 155.0,365.3 L 162.0,364.7 L 169.0,364.0 L 176.0,363.3 L 183.0,362.6 L 190.0,361.9 L 197.0,361.2 L 204.0,360.5 L 211.0,359.7 L 218.0,359.0 L 225.0,358.2 L 232.0,357.4 L 239.0,356.6 L 246.0,355.9 L 253.0,355.1 L 260.0,354.2 L 267.0,353.4 L 274.0,352.6 L 281.0,351.7 L 288.0,350.9 L 295.0,350.0 L 302.0,349.1 L 309.0,348.2 L 316.0,347.3 L 323.0,346.4 L 330.0,345.5 L 337.0,344.6 L 344.0,343.6 L 351.0,342.6 L 358.0,341.7 L 365.0,340.7 L 372.0,339.7 L 379.0,338.7 L 386.0,337.7 L 393.0,336.7 L 400.0,335.6 L 407.0,334.6 L 414.0,333.5 L 421.0,332.5 L 428.0,331.4 L 435.0,330.3 L 442.0,329.2 L 449.0,328.1 L 456.0,327.0 L 463.0,325.9 L 470.0,324.7 L 477.0,323.6 L 484.0,322.4 L 491.0,321.2 L 498.0,320.0 L 505.0,318.8" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Точки на 3.7 В -->
  <circle cx="253" cy="265.2" r="3.5" fill="#c0392b"/>
  <circle cx="253" cy="325.1" r="3.5" fill="#2457d6"/>
  <circle cx="253" cy="355.1" r="3.5" fill="#27ae60"/>

  <!-- Точки на 5.0 В -->
  <circle cx="435" cy="166.2" r="4.5" fill="#c0392b" stroke="white" stroke-width="1.5"/>
  <circle cx="435" cy="275.6" r="4.5" fill="#2457d6" stroke="white" stroke-width="1.5"/>
  <circle cx="435" cy="330.3" r="4.5" fill="#27ae60" stroke="white" stroke-width="1.5"/>

  <!-- Підписи на кінцях кривих праворуч -->
  <text x="512" y="124" font-size="12" font-weight="700" fill="#c0392b">2 Ом</text>
  <text x="512" y="256" font-size="12" font-weight="700" fill="#2457d6">4 Ом</text>
  <text x="512" y="322" font-size="12" font-weight="700" fill="#27ae60">8 Ом</text>

  <!-- Підписи осі Y -->
  <text x="76" y="109" font-size="12" fill="#6b7280" text-anchor="end">8</text>
  <text x="76" y="144" font-size="12" fill="#6b7280" text-anchor="end">7</text>
  <text x="76" y="179" font-size="12" fill="#6b7280" text-anchor="end">6</text>
  <text x="76" y="214" font-size="12" font-weight="700" fill="#c0392b" text-anchor="end">5</text>
  <text x="76" y="249" font-size="12" fill="#6b7280" text-anchor="end">4</text>
  <text x="76" y="284" font-size="12" fill="#6b7280" text-anchor="end">3</text>
  <text x="76" y="319" font-size="12" fill="#6b7280" text-anchor="end">2</text>
  <text x="76" y="354" font-size="12" fill="#6b7280" text-anchor="end">1</text>
  <text x="76" y="389" font-size="12" fill="#6b7280" text-anchor="end">0</text>

  <!-- Засічки осі Y -->
  <line x1="80" y1="105" x2="85" y2="105" stroke="#94a3b8" stroke-width="1"/>
  <line x1="80" y1="140" x2="85" y2="140" stroke="#94a3b8" stroke-width="1"/>
  <line x1="80" y1="175" x2="85" y2="175" stroke="#94a3b8" stroke-width="1"/>
  <line x1="80" y1="210" x2="85" y2="210" stroke="#c0392b" stroke-width="1.2"/>
  <line x1="80" y1="245" x2="85" y2="245" stroke="#94a3b8" stroke-width="1"/>
  <line x1="80" y1="280" x2="85" y2="280" stroke="#94a3b8" stroke-width="1"/>
  <line x1="80" y1="315" x2="85" y2="315" stroke="#94a3b8" stroke-width="1"/>
  <line x1="80" y1="350" x2="85" y2="350" stroke="#94a3b8" stroke-width="1"/>
  <line x1="80" y1="385" x2="85" y2="385" stroke="#94a3b8" stroke-width="1"/>

  <!-- Назва осі Y -->
  <text x="85" y="90" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">PRMS (Вт)</text>

  <!-- Засічки осі X -->
  <line x1="85" y1="385" x2="85" y2="390" stroke="#94a3b8" stroke-width="1"/>
  <line x1="155" y1="385" x2="155" y2="390" stroke="#94a3b8" stroke-width="1"/>
  <line x1="225" y1="385" x2="225" y2="390" stroke="#94a3b8" stroke-width="1"/>
  <line x1="253" y1="385" x2="253" y2="390" stroke="#94a3b8" stroke-width="1"/>
  <line x1="295" y1="385" x2="295" y2="390" stroke="#94a3b8" stroke-width="1"/>
  <line x1="365" y1="385" x2="365" y2="390" stroke="#94a3b8" stroke-width="1"/>
  <line x1="435" y1="385" x2="435" y2="390" stroke="#94a3b8" stroke-width="1"/>
  <line x1="505" y1="385" x2="505" y2="390" stroke="#94a3b8" stroke-width="1"/>

  <!-- Підписи осі X -->
  <text x="85" y="405" font-size="12" fill="#6b7280" text-anchor="middle">2.5</text>
  <text x="155" y="405" font-size="12" fill="#6b7280" text-anchor="middle">3.0</text>
  <text x="225" y="405" font-size="12" fill="#6b7280" text-anchor="middle">3.5</text>
  <text x="253" y="405" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">3.7</text>
  <text x="295" y="405" font-size="12" fill="#6b7280" text-anchor="middle">4.0</text>
  <text x="365" y="405" font-size="12" fill="#6b7280" text-anchor="middle">4.5</text>
  <text x="435" y="405" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">5.0</text>
  <text x="505" y="405" font-size="12" fill="#6b7280" text-anchor="middle">5.5</text>

  <!-- Назва осі X -->
  <text x="295" y="432" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Напруга живлення VDD (В)</text>

  <!-- Легенда всередині графіка (порожній лівий верхній кут) -->
  <rect x="95" y="114" width="210" height="78" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="105" y="129" font-size="12" font-weight="700" fill="#1a1a1a">Потужність PRMS при 5.0 В:</text>
  <circle cx="112" cy="144" r="4" fill="#c0392b"/>
  <text x="122" y="148" font-size="12" font-weight="700" fill="#c0392b">2 Ом: 6.25 Вт (макс. 5 Вт)</text>
  <circle cx="112" cy="162" r="4" fill="#2457d6"/>
  <text x="122" y="166" font-size="12" font-weight="700" fill="#2457d6">4 Ом: 3.13 Вт (чистий звук)</text>
  <circle cx="112" cy="180" r="4" fill="#27ae60"/>
  <text x="122" y="184" font-size="12" font-weight="700" fill="#27ae60">8 Ом: 1.56 Вт (холодний)</text>

  <!-- Праві картки -->
  <!-- Картка 1: 2 Ом -->
  <rect x="560" y="80" width="375" height="80" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="575" y="100" font-size="13" font-weight="700" fill="#c0392b">RL = 2 Ом: Небезпека перегріву корпусу</text>
  <text x="575" y="120" font-size="12" fill="#1a1a1a">• При 5.0 В: теор. 6.25 Вт / реал. до 5.0 Вт (THD 10%)</text>
  <text x="575" y="140" font-size="12" fill="#6b7280">• Критичний струм: ESOP-8 вимагає радіатора або міді</text>

  <!-- Картка 2: 4 Ом -->
  <rect x="560" y="170" width="375" height="80" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="575" y="190" font-size="13" font-weight="700" fill="#2457d6">RL = 4 Ом: Рекомендований оптимум (Hi-Fi)</text>
  <text x="575" y="210" font-size="12" fill="#1a1a1a">• При 5.0 В: теор. 3.13 Вт / чистий звук 2.5–3.0 Вт</text>
  <text x="575" y="230" font-size="12" fill="#6b7280">• Штатний режим: збалансований КНІ та стабільне Т°</text>

  <!-- Картка 3: 8 Ом -->
  <rect x="560" y="260" width="375" height="80" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="575" y="280" font-size="13" font-weight="700" fill="#27ae60">RL = 8 Ом: Холодний безпечний режим</text>
  <text x="575" y="300" font-size="12" fill="#1a1a1a">• При 5.0 В: теор. 1.56 Вт / чистий звук ~1.4 Вт</text>
  <text x="575" y="320" font-size="12" fill="#6b7280">• Холодний чіп: ідеально для Li-ion акумулятора 3.7 В</text>

  <!-- Картка 4: Формула BTL -->
  <rect x="560" y="350" width="375" height="85" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="575" y="370" font-size="13" font-weight="700" fill="#1a1a1a">Математика BTL (Bridge-Tied Load)</text>
  <text x="575" y="389" font-size="12" fill="#1a1a1a">• Подвоєний розмах: Vout(BTL) = 2 · Vpeak ≈ 2 · VDD</text>
  <text x="575" y="407" font-size="12" fill="#1a1a1a">• Діюча напруга: VRMS = 2·VDD / (2·√2) = VDD / √2</text>
  <text x="575" y="425" font-size="12" font-weight="700" fill="#2457d6">• Потужність: PRMS = VRMS² / RL = VDD² / (2 · RL)</text>
</svg>
