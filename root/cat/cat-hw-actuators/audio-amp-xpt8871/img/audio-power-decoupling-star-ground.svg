<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="540" fill="white"/>
  <text x="480" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Схема організації живлення та зіркового заземлення (Star Ground)</text>
  <text x="480" y="46" text-anchor="middle" font-size="13" fill="#6b7280">Роздільні гілки VDD/GND, єдина точка Star Ground та локальний тандем конденсаторів біля XPT8871</text>
  <!-- Ліва панель: Джерело живлення та Star Ground -->
  <rect x="24" y="66" width="196" height="370" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="34" y="76" width="176" height="22" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="122" y="91" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">ДЖЕРЕЛО ЖИВЛЕННЯ</text>
  <rect x="80" y="115" width="50" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="105" y="131" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">+5 В</text>
  <text x="105" y="110" text-anchor="middle" font-size="12" fill="#6b7280">Вихід V_IN</text>
  <rect x="80" y="345" width="50" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="105" y="361" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">GND</text>
  <text x="105" y="382" text-anchor="middle" font-size="12" fill="#6b7280">0 В джерела</text>
  <!-- Головний буферний накопичувач C_MAIN -->
  <line x1="80" y1="127" x2="55" y2="127" stroke="#c0392b" stroke-width="2"/>
  <line x1="55" y1="127" x2="55" y2="205" stroke="#c0392b" stroke-width="2"/>
  <rect x="43" y="205" width="24" height="46" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="43" y1="215" x2="67" y2="215" stroke="#c0392b" stroke-width="1.5"/>
  <text x="49" y="213" font-size="12" font-weight="700" fill="#c0392b">+</text>
  <line x1="55" y1="251" x2="55" y2="357" stroke="#27ae60" stroke-width="2"/>
  <line x1="55" y1="357" x2="80" y2="357" stroke="#27ae60" stroke-width="2"/>
  <text x="75" y="225" font-size="12" font-weight="700" fill="#1a1a1a">C_MAIN</text>
  <text x="75" y="241" font-size="12" fill="#6b7280">1000 мкФ</text>
  <!-- Вузол Star Ground -->
  <line x1="130" y1="357" x2="175" y2="357" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="175" cy="357" r="12" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <circle cx="175" cy="357" r="4.5" fill="#27ae60"/>
  <rect x="34" y="394" width="176" height="32" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="122" y="408" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">ТОЧКА «STAR GROUND»</text>
  <text x="122" y="420" text-anchor="middle" font-size="12" fill="#1a1a1a">Спільний центр земель 0 В</text>
  <!-- Гілка DVDD -->
  <line x1="130" y1="127" x2="310" y2="127" stroke="#c0392b" stroke-width="2"/>
  <!-- Гілка DGND -->
  <path d="M175,357 L195,357 L195,170 L470,170" fill="none" stroke="#27ae60" stroke-width="2"/>
  <!-- Гілка PVDD -->
  <circle cx="150" cy="127" r="3" fill="#c0392b"/>
  <path d="M150,127 L150,285 L390,285" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <!-- Гілка PGND -->
  <path d="M175,357 L175,385 L390,385" fill="none" stroke="#27ae60" stroke-width="3"/>
  <!-- Верхня права панель: Цифрова підсистема -->
  <rect x="260" y="66" width="676" height="138" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="272" y="74" width="250" height="20" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="397" y="88" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">ЦИФРОВА ПІДСИСТЕМА (MCU / DAC)</text>
  <text x="280" y="122" font-size="12" font-weight="700" fill="#c0392b">DVDD</text>
  <text x="280" y="165" font-size="12" font-weight="700" fill="#27ae60">DGND</text>
  <rect x="310" y="121" width="36" height="12" rx="2" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="328" y="117" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">FB</text>
  <text x="328" y="145" text-anchor="middle" font-size="12" fill="#6b7280">Ферит</text>
  <line x1="346" y1="127" x2="470" y2="127" stroke="#c0392b" stroke-width="2"/>
  <circle cx="390" cy="127" r="3" fill="#c0392b"/>
  <line x1="390" y1="127" x2="390" y2="143" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="380" y1="143" x2="400" y2="143" stroke="#2457d6" stroke-width="2"/>
  <line x1="380" y1="149" x2="400" y2="149" stroke="#2457d6" stroke-width="2"/>
  <line x1="390" y1="149" x2="390" y2="170" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="390" cy="170" r="3" fill="#27ae60"/>
  <text x="408" y="144" font-size="12" font-weight="700" fill="#2457d6">C_DIG</text>
  <text x="408" y="158" font-size="12" fill="#6b7280">0.1 мкФ</text>
  <!-- Блок мікроконтролера -->
  <rect x="470" y="98" width="220" height="92" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.8"/>
  <text x="580" y="118" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Мікроконтролер (MCU / DAC)</text>
  <text x="580" y="134" text-anchor="middle" font-size="12" fill="#6b7280">ESP32 / STM32 / RP2040</text>
  <text x="478" y="131" font-size="12" font-weight="700" fill="#c0392b">DVDD</text>
  <text x="478" y="174" font-size="12" font-weight="700" fill="#27ae60">DGND</text>
  <text x="682" y="154" text-anchor="end" font-size="12" font-weight="700" fill="#2457d6">DAC_OUT</text>
  <line x1="690" y1="150" x2="740" y2="150" stroke="#2457d6" stroke-width="2"/>
  <line x1="740" y1="150" x2="740" y2="280" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="752" y="212" font-size="12" font-weight="700" fill="#2457d6">Аудіосигнал</text>
  <text x="752" y="226" font-size="12" fill="#6b7280">DAC до CIN</text>
  <rect x="710" y="98" width="210" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="815" y="115" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Чисте цифрове живлення</text>
  <text x="815" y="130" text-anchor="middle" font-size="12" fill="#1a1a1a">Без струмів баса підсилювача</text>
  <!-- Нижня права панель: Силовий аудіотракт -->
  <rect x="260" y="216" width="676" height="220" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="272" y="224" width="280" height="20" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="412" y="238" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">СИЛОВИЙ АУДІОТРАКТ (ПІДСИЛЮВАЧ XPT8871)</text>
  <text x="272" y="280" font-size="12" font-weight="700" fill="#c0392b">PVDD (+5 В)</text>
  <text x="272" y="402" font-size="12" font-weight="700" fill="#27ae60">PGND (Силова земля)</text>
  <!-- Тандем конденсаторів розв'язки біля ніжок IC -->
  <rect x="375" y="260" width="165" height="160" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="457" y="276" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">ТАНДЕМ РОЗВ'ЯЗКИ</text>
  <circle cx="415" cy="285" r="3" fill="#c0392b"/>
  <line x1="415" y1="285" x2="415" y2="308" stroke="#c0392b" stroke-width="2"/>
  <rect x="403" y="308" width="24" height="44" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="403" y1="318" x2="427" y2="318" stroke="#c0392b" stroke-width="1.5"/>
  <text x="408" y="316" font-size="12" font-weight="700" fill="#c0392b">+</text>
  <line x1="415" y1="352" x2="415" y2="385" stroke="#27ae60" stroke-width="2"/>
  <circle cx="415" cy="385" r="3" fill="#27ae60"/>
  <text x="398" y="332" text-anchor="end" font-size="12" font-weight="700" fill="#1a1a1a">C_BULK</text>
  <text x="398" y="348" text-anchor="end" font-size="12" fill="#6b7280">470 мкФ</text>
  <circle cx="475" cy="285" r="3" fill="#c0392b"/>
  <line x1="475" y1="285" x2="475" y2="322" stroke="#c0392b" stroke-width="2"/>
  <line x1="465" y1="322" x2="485" y2="322" stroke="#2457d6" stroke-width="2"/>
  <line x1="465" y1="328" x2="485" y2="328" stroke="#2457d6" stroke-width="2"/>
  <line x1="475" y1="328" x2="475" y2="385" stroke="#27ae60" stroke-width="2"/>
  <circle cx="475" cy="385" r="3" fill="#27ae60"/>
  <text x="490" y="324" font-size="12" font-weight="700" fill="#2457d6">C_CER</text>
  <text x="490" y="338" font-size="12" fill="#6b7280">0.1 мкФ</text>
  <text x="490" y="352" font-size="12" fill="#6b7280">SMD X7R</text>
  <text x="457" y="408" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">&lt; 2 мм до виводів IC!</text>
  <line x1="475" y1="285" x2="555" y2="285" stroke="#c0392b" stroke-width="2"/>
  <line x1="475" y1="385" x2="555" y2="385" stroke="#27ae60" stroke-width="2.5"/>
  <!-- Мікросхема XPT8871 -->
  <rect x="555" y="265" width="150" height="150" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="630" y="284" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">XPT8871 (SOP-8)</text>
  <text x="563" y="299" font-size="12" font-weight="700" fill="#c0392b">Pin 6 VDD</text>
  <text x="563" y="381" font-size="12" font-weight="700" fill="#27ae60">Pin 7 GND</text>
  <text x="563" y="340" font-size="12" font-weight="700" fill="#2457d6">Pin 4 -IN</text>
  <path d="M740,280 L740,336 L625,336" fill="none" stroke="#2457d6" stroke-width="1.8"/>
  <line x1="650" y1="328" x2="650" y2="344" stroke="#2457d6" stroke-width="2"/>
  <line x1="656" y1="328" x2="656" y2="344" stroke="#2457d6" stroke-width="2"/>
  <text x="653" y="322" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">CIN</text>
  <text x="697" y="320" text-anchor="end" font-size="12" font-weight="700" fill="#27ae60">VO- 8</text>
  <text x="697" y="360" text-anchor="end" font-size="12" font-weight="700" fill="#2457d6">VO+ 5</text>
  <line x1="705" y1="316" x2="745" y2="316" stroke="#27ae60" stroke-width="2"/>
  <line x1="705" y1="356" x2="745" y2="356" stroke="#2457d6" stroke-width="2"/>
  <!-- Динамік -->
  <line x1="745" y1="316" x2="755" y2="316" stroke="#27ae60" stroke-width="2"/>
  <line x1="755" y1="316" x2="755" y2="326" stroke="#27ae60" stroke-width="2"/>
  <line x1="745" y1="356" x2="755" y2="356" stroke="#2457d6" stroke-width="2"/>
  <line x1="755" y1="356" x2="755" y2="346" stroke="#2457d6" stroke-width="2"/>
  <rect x="748" y="326" width="16" height="20" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/>
  <path d="M756,328 L772,314 L772,358 L756,344 Z" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="782" y="326" font-size="12" font-weight="700" fill="#1a1a1a">Динамік 4..8 Ом</text>
  <text x="782" y="342" font-size="12" font-weight="700" fill="#c0392b">Струм до 1.5 А</text>
  <text x="782" y="358" font-size="12" fill="#6b7280">BTL подвоєння</text>
  <rect x="725" y="386" width="195" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="822" y="403" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">Струм замикається на C_BULK!</text>
  <!-- Нижні картки ключових інженерних правил -->
  <rect x="24" y="450" width="290" height="66" rx="6" fill="#e9f7ef" stroke="#a3d9b8" stroke-width="1"/>
  <text x="36" y="468" font-size="12" font-weight="700" fill="#27ae60">1. Зіркова земля (Star Ground):</text>
  <text x="36" y="485" font-size="12" fill="#1a1a1a">Окремі шини DGND і PGND сходяться в одній</text>
  <text x="36" y="501" font-size="12" fill="#6b7280">точці біля C_MAIN. Спільний опір = 0 Ом!</text>
  <rect x="326" y="450" width="318" height="66" rx="6" fill="#eaf0fd" stroke="#a5bbf7" stroke-width="1"/>
  <text x="338" y="468" font-size="12" font-weight="700" fill="#2457d6">2. Роздільні гілки живлення:</text>
  <text x="338" y="485" font-size="12" fill="#1a1a1a">Шина DVDD фільтрується FB. Стрибки струму</text>
  <text x="338" y="501" font-size="12" fill="#6b7280">до 1.5 А на PVDD не перезавантажують MCU.</text>
  <rect x="656" y="450" width="280" height="66" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="668" y="468" font-size="12" font-weight="700" fill="#1a1a1a">3. Тандем біля ніжок IC (&lt; 2 мм):</text>
  <text x="668" y="485" font-size="12" fill="#1a1a1a">470 мкФ живить басові атаки, а 0.1 мкФ</text>
  <text x="668" y="501" font-size="12" fill="#6b7280">кераміка шунтує ВЧ-шуми комутації.</text>
</svg>
