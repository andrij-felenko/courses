<text x="480.0" y="28.0" font-size="18" text-anchor="middle" fill="#1a1a1a" font-weight="bold">АЧХ вхідного фільтра Rin-Cin та акустичне узгодження з динаміком</text>
<text x="480.0" y="48.0" font-size="13" text-anchor="middle" fill="#6b7280">Фільтр відсікає інфразвук нижче 170 Гц, захищаючи котушку від перегріву та дифузор від перевищення Xmax</text>
<text x="165.0" y="68.0" font-size="12" fill="#2457d6" font-weight="bold">АЧХ фільтра Rin-Cin (fc = 170 Гц, спад −20 дБ/дек)</text>
<text x="565.0" y="68.0" font-size="12" fill="#27ae60" font-weight="bold">Акустична віддача мініатюрного динаміка</text>
<text x="232.0" y="92.0" font-size="12" text-anchor="middle" fill="#c0392b" font-weight="bold">Зона ризику: перегрів і Xmax (&lt; 170 Гц)</text>
<text x="638.0" y="92.0" font-size="12" text-anchor="middle" fill="#27ae60" font-weight="bold">Робоча смуга динаміка (200 Гц – 20 кГц)</text>
<text x="78.0" y="88.0" font-size="12" text-anchor="end" fill="#1a1a1a" font-weight="bold">дБ</text>
<text x="78.0" y="112.0" font-size="12" text-anchor="end" fill="#1a1a1a">0 дБ</text>
<text x="78.0" y="130.0" font-size="12" text-anchor="end" fill="#2457d6" font-weight="bold">−3 дБ</text>
<text x="78.0" y="172.0" font-size="12" text-anchor="end" fill="#6b7280">−10 дБ</text>
<text x="78.0" y="232.0" font-size="12" text-anchor="end" fill="#6b7280">−20 дБ</text>
<text x="78.0" y="292.0" font-size="12" text-anchor="end" fill="#6b7280">−30 дБ</text>
<text x="85.0" y="314.0" font-size="12" text-anchor="middle" fill="#1a1a1a">10 Гц</text>
<text x="158.0" y="314.0" font-size="12" text-anchor="middle" fill="#6b7280">20 Гц</text>
<text x="327.3" y="314.0" font-size="12" text-anchor="middle" fill="#1a1a1a">100 Гц</text>
<text x="383.2" y="314.0" font-size="12" text-anchor="middle" fill="#2457d6" font-weight="bold">170 Гц</text>
<text x="569.7" y="314.0" font-size="12" text-anchor="middle" fill="#1a1a1a">1 кГц</text>
<text x="812.0" y="314.0" font-size="12" text-anchor="middle" fill="#1a1a1a">10 кГц</text>
<text x="885.0" y="314.0" font-size="12" text-anchor="middle" fill="#1a1a1a">20 кГц</text>
<text x="408.0" y="151.0" font-size="12" fill="#2457d6" font-weight="bold">Точка зрізу fc ≈ 170 Гц</text>
<text x="408.0" y="165.0" font-size="12" fill="#1a1a1a">Рівень: −3 дБ (0,707 Uin)</text>
<text x="408.0" y="178.0" font-size="12" fill="#6b7280">fc = 1 / (2·π · Rin · Cin)</text>
<text x="184.0" y="249.0" font-size="12" fill="#2457d6" font-weight="bold">Спад: −20 дБ / дек.</text>
<text x="184.0" y="262.0" font-size="12" fill="#6b7280">(ФВЧ 1-го порядку)</text>
<text x="184.0" y="275.0" font-size="12" fill="#1a1a1a">Блокування DC і рокоту</text>
<text x="102.0" y="149.0" font-size="12" fill="#c0392b" font-weight="bold">Завал віддачі динаміка</text>
<text x="102.0" y="162.0" font-size="12" fill="#1a1a1a">Дифузор не звучить</text>
<text x="102.0" y="175.0" font-size="12" fill="#c0392b">Струм гріє котушку (Xmax)</text>
<text x="626.0" y="157.0" font-size="12" fill="#27ae60" font-weight="bold">Корисний звуковий діапазон</text>
<text x="626.0" y="172.0" font-size="12" fill="#1a1a1a">• Підсилення тракту: 0 дБ (номінал)</text>
<text x="626.0" y="187.0" font-size="12" fill="#1a1a1a">• Ефективне випромінювання звуку</text>
<text x="52.0" y="360.0" font-size="13" fill="#2457d6" font-weight="bold">Параметри вхідного ФВЧ</text>
<text x="52.0" y="378.0" font-size="12" fill="#1a1a1a">Rin = 20 кОм, Cin = 47 нФ</text>
<text x="52.0" y="396.0" font-size="12" fill="#1a1a1a">Зріз: fc = 1 / (2·π·Rin·Cin) ≈ 170 Гц</text>
<text x="52.0" y="414.0" font-size="12" fill="#2457d6">Спад 20 дБ/дек блокує постійну складову</text>
<text x="352.0" y="360.0" font-size="13" fill="#c0392b" font-weight="bold">Зона ризику (&lt; 170 Гц): без звуку</text>
<text x="352.0" y="378.0" font-size="12" fill="#1a1a1a">Динамік акустично не випромінює</text>
<text x="352.0" y="396.0" font-size="12" fill="#1a1a1a">Вся потужність іде в нагрів котушки</text>
<text x="352.0" y="414.0" font-size="12" fill="#c0392b" font-weight="bold">Небезпека виходу за межі ходу Xmax</text>
<text x="652.0" y="360.0" font-size="13" fill="#27ae60" font-weight="bold">Робоча смуга (200 Гц – 20 кГц)</text>
<text x="652.0" y="378.0" font-size="12" fill="#1a1a1a">Коефіцієнт передачі стабільний: 0 дБ</text>
<text x="652.0" y="396.0" font-size="12" fill="#1a1a1a">Висока акустична віддача випромінювача</text>
<text x="652.0" y="414.0" font-size="12" fill="#27ae60" font-weight="bold">Чистий звук без перевантаження тракту</text>
</svg>
