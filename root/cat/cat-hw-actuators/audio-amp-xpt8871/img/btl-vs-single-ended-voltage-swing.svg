  <line x1="798" y1="305" x2="798" y2="385" stroke="#27ae60" stroke-width="1.5" marker-start="url(#arr-green)" marker-end="url(#arr-green)"/>
  <text x="808" y="338" font-size="12" font-weight="700" fill="#27ae60">V_PP = 2·VDD</text>
  <text x="808" y="354" font-size="12" font-weight="700" fill="#27ae60">ПОДВОЄННЯ!</text>
  <text x="808" y="370" font-size="12" fill="#1a1a1a">V_DC = 0 В (нуль DC)</text>

  <!-- Підсумок BTL -->
  <rect x="504" y="412" width="420" height="58" rx="6" fill="#e9f7ef" stroke="#a3d9b8" stroke-width="1"/>
  <text x="516" y="430" font-size="12" font-weight="700" fill="#27ae60">Макс. потужність: P_BTL = VDD² / (2·RL) = 4 × P_SE</text>
  <text x="516" y="446" font-size="12" fill="#1a1a1a">Для VDD = 5 В, RL = 4 Ом: P_BTL ≈ 3.1 Вт (у 4 рази потужніше!)</text>
  <text x="516" y="460" font-size="12" fill="#6b7280">Перевага: нульовий постійний струм через динамік і чистий бас до 20 Гц</text>
