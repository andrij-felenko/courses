<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Конструктивний переріз електродинамічного гучномовця</text>
  <text x="480" y="46" text-anchor="middle" font-size="13" fill="#6b7280">Магнітна система, пружний підвіс та фіксація звукової котушки в робочому зазорі</text>

  <!-- ЛІВА КОЛОНКА: Виносні лінії та підписи рухомої системи -->
  <text x="24" y="84" font-size="13" font-weight="bold" fill="#1a1a1a">Верхній пружний підвіс</text>
  <text x="24" y="99" font-size="12" fill="#6b7280">герметизує та повертає дифузор</text>
  <line x1="225" y1="91" x2="282" y2="91" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <text x="24" y="126" font-size="13" font-weight="bold" fill="#1a1a1a">Кошик-дифузоротримач</text>
  <text x="24" y="141" font-size="12" fill="#6b7280">несуча сталева рама з вікнами</text>
  <line x1="225" y1="133" x2="276" y2="133" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <text x="24" y="168" font-size="13" font-weight="bold" fill="#1a1a1a">Конусний дифузор</text>
  <text x="24" y="183" font-size="12" fill="#6b7280">випромінює звукові хвилі</text>
  <line x1="195" y1="175" x2="340" y2="175" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <text x="24" y="210" font-size="13" font-weight="bold" fill="#1a1a1a">Центруюча шайба (спайдер)</text>
  <text x="24" y="225" font-size="12" fill="#6b7280">утримує котушку строго по осі</text>
  <line x1="225" y1="217" x2="370" y2="238" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <!-- ЛІВА НИЖНЯ ПАНЕЛЬ: Механіка та фіксація -->
  <rect x="24" y="250" width="230" height="185" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="24" y="250" width="230" height="28" rx="8" fill="#eaf0fd"/>
  <text x="36" y="269" font-size="13" font-weight="bold" fill="#2457d6">Механічна фіксація в зазорі</text>
  
  <text x="36" y="296" font-size="12" font-weight="bold" fill="#1a1a1a">1. Двоточковий підвіс</text>
  <text x="36" y="311" font-size="12" fill="#6b7280">Підвіс угорі + спайдер унизу</text>
  <text x="36" y="325" font-size="12" fill="#6b7280">блокують бічний перекіс.</text>
  
  <text x="36" y="348" font-size="12" font-weight="bold" fill="#1a1a1a">2. Безконтактний рух</text>
  <text x="36" y="363" font-size="12" fill="#6b7280">Зазор 0,2–0,4 мм виключає</text>
  <text x="36" y="377" font-size="12" fill="#6b7280">тертя котушки об метал.</text>
  
  <text x="36" y="400" font-size="12" font-weight="bold" fill="#1a1a1a">3. Канал декомпресії</text>
  <text x="36" y="415" font-size="12" fill="#6b7280">Керн скидає тиск під банею</text>
  <text x="36" y="429" font-size="12" fill="#6b7280">та охолоджує котушку.</text>

  <!-- ЦЕНТР: ПЕРЕРІЗ ГУЧНОМОВЦЯ -->
  <!-- Вісь симетрії (пунктирні ділянки, що не перетинають текст) -->
  <line x1="450" y1="65" x2="450" y2="105" stroke="#94a3b8" stroke-width="1" stroke-dasharray="8,3,2,3"/>
  <line x1="450" y1="180" x2="450" y2="260" stroke="#94a3b8" stroke-width="1" stroke-dasharray="8,3,2,3"/>
  <line x1="450" y1="265" x2="450" y2="390" stroke="#94a3b8" stroke-width="1" stroke-dasharray="8,3,2,3"/>

  <!-- Нижня пластина (фланець) і керн (сталь #e2e8f0) -->
  <!-- Ліва частина ярма та керна -->
  <path d="M 350,390 L 444,390 L 444,265 L 432,265 L 432,365 L 350,365 Z" fill="#e2e8f0" stroke="#475569" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Права частина ярма та керна -->
  <path d="M 550,390 L 456,390 L 456,265 L 468,265 L 468,365 L 550,365 Z" fill="#e2e8f0" stroke="#475569" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Кільцевий постійний магніт (ферит #64748b) -->
  <rect x="350" y="308" width="58" height="57" fill="#64748b" stroke="#334155" stroke-width="1.5"/>
  <text x="379" y="326" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">N</text>
  <text x="379" y="354" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">S</text>

  <rect x="492" y="308" width="58" height="57" fill="#64748b" stroke="#334155" stroke-width="1.5"/>
  <text x="521" y="326" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">N</text>
  <text x="521" y="354" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">S</text>

  <!-- Верхній фланець (#e2e8f0) -->
  <rect x="350" y="278" width="64" height="30" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>
  <rect x="486" y="278" width="64" height="30" fill="#e2e8f0" stroke="#475569" stroke-width="1.5"/>

  <!-- Магнітні лінії в зазорі гучномовця -->
  <line x1="414" y1="288" x2="430" y2="288" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr-blue)"/>
  <line x1="414" y1="298" x2="430" y2="298" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr-blue)"/>
  <line x1="486" y1="288" x2="470" y2="288" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr-blue)"/>
  <line x1="486" y1="298" x2="470" y2="298" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,2" marker-end="url(#arr-blue)"/>

  <!-- Кошик-дифузоротримач (рама) -->
  <!-- Ліва верхня полиця і стійка -->
  <path d="M 260 90 L 295 90 L 295 96 L 270 96 L 270 102 L 260 102 Z" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <circle cx="278" cy="93" r="2.5" fill="white" stroke="#475569" stroke-width="1"/>
  <path d="M 270 102 L 340 240 L 340 248 L 350 278" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="335" y="240" width="12" height="6" fill="#cbd5e1" stroke="#475569" stroke-width="1.2"/>

  <!-- Права верхня полиця і стійка -->
  <path d="M 640 90 L 605 90 L 605 96 L 630 96 L 630 102 L 640 102 Z" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <circle cx="622" cy="93" r="2.5" fill="white" stroke="#475569" stroke-width="1"/>
  <path d="M 630 102 L 560 240 L 560 248 L 550 278" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="553" y="240" width="12" height="6" fill="#cbd5e1" stroke="#475569" stroke-width="1.2"/>

  <!-- Циліндричний каркас звукової котушки -->
  <rect x="423" y="215" width="2" height="112" fill="#cbd5e1" stroke="#475569" stroke-width="0.8"/>
  <rect x="475" y="215" width="2" height="112" fill="#cbd5e1" stroke="#475569" stroke-width="0.8"/>

  <!-- Обмотка звукової котушки (мідні витки) -->
  <rect x="418" y="278" width="5" height="42" rx="1" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>
  <rect x="477" y="278" width="5" height="42" rx="1" fill="#f59e0b" stroke="#b45309" stroke-width="1"/>

  <!-- Центруюча шайба (спайдер, хвилястий профіль) -->
  <path d="M 345 240 Q 358 232, 365 240 Q 372 248, 385 240 Q 398 232, 405 240 Q 412 248, 423 240" stroke="#d97706" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 555 240 Q 542 232, 535 240 Q 528 248, 515 240 Q 502 232, 495 240 Q 488 248, 477 240" stroke="#d97706" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Конусний дифузор -->
  <path d="M 295 92 L 423 222" stroke="#374151" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M 605 92 L 475 222" stroke="#374151" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Верхній пружний підвіс (гумовий напівтор) -->
  <path d="M 275 92 C 275 74, 295 74, 295 92" fill="none" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>
  <path d="M 605 92 C 605 74, 625 74, 625 92" fill="none" stroke="#1f2937" stroke-width="4" stroke-linecap="round"/>

  <!-- Пилозахисний ковпачок -->
  <path d="M 412 212 C 420 172, 480 172, 488 212" fill="none" stroke="#374151" stroke-width="3" stroke-linecap="round"/>

  <!-- Гнучкий струмопідвід -->
  <path d="M 423 225 Q 380 215, 345 228" stroke="#d97706" stroke-width="1.5" stroke-dasharray="3,2" fill="none"/>

  <!-- Стрілка осьового коливання (±хід) -->
  <line x1="450" y1="155" x2="450" y2="135" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="450" y1="145" x2="450" y2="165" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="450" y="125" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">±Хід</text>

  <!-- Підпис нижнього фланця з керном -->
  <text x="450" y="414" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Нижній фланець із керном (полюс S)</text>
  <text x="450" y="430" font-size="12" fill="#6b7280" text-anchor="middle">масивне сталеве ярмо з вентиляційним каналом</text>

  <!-- ПРАВА ВЕРХНЯ ЧАСТИНА: Підписи з виносними лініями -->
  <text x="660" y="84" font-size="13" font-weight="bold" fill="#1a1a1a">Пилозахисний ковпачок</text>
  <text x="660" y="99" font-size="12" fill="#6b7280">захищає зазор від бруду й пилу</text>
  <line x1="655" y1="91" x2="475" y2="180" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <text x="660" y="126" font-size="13" font-weight="bold" fill="#1a1a1a">Каркас звукової котушки</text>
  <text x="660" y="141" font-size="12" fill="#6b7280">жаростійкий каптон / алюміній</text>
  <line x1="655" y1="133" x2="478" y2="225" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <text x="660" y="168" font-size="13" font-weight="bold" fill="#1a1a1a">Верхній фланець (полюс N)</text>
  <text x="660" y="183" font-size="12" fill="#6b7280">концентрує радіальний потік</text>
  <line x1="655" y1="175" x2="535" y2="285" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <text x="660" y="210" font-size="13" font-weight="bold" fill="#1a1a1a">Кільцевий постійний магніт</text>
  <line x1="655" y1="206" x2="535" y2="330" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <!-- Проекційні лінії масштабування до збільшеного вузла -->
  <line x1="486" y1="278" x2="650" y2="224" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>
  <line x1="486" y1="308" x2="650" y2="250" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>

  <!-- ПРАВА НИЖНЯ ПАНЕЛЬ: Збільшений вузол робочого зазору -->
  <rect x="650" y="224" width="286" height="211" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="650" y="224" width="286" height="26" rx="8" fill="#eaf0fd"/>
  <text x="793" y="242" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Вузол робочого зазору (збільшено)</text>

  <!-- Керн у збільшеному вигляді (S) -->
  <rect x="660" y="258" width="46" height="118" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="683" y="312" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Керн</text>
  <text x="683" y="328" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">(S)</text>

  <!-- Верхній фланець у збільшеному вигляді (N) -->
  <rect x="868" y="258" width="60" height="118" rx="3" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <text x="898" y="306" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Верхній</text>
  <text x="898" y="322" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">фланець</text>
  <text x="898" y="338" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">(N)</text>

  <!-- Магнітне поле B у збільшеному зазорі -->
  <text x="787" y="271" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Поле B (N → S)</text>
  <line x1="868" y1="286" x2="712" y2="286" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <line x1="868" y1="310" x2="712" y2="310" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <line x1="868" y1="334" x2="712" y2="334" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <line x1="868" y1="358" x2="712" y2="358" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>

  <!-- Каркас котушки -->
  <rect x="756" y="256" width="5" height="122" fill="#f8fafc" stroke="#64748b" stroke-width="1"/>

  <!-- Мідні витки обмотки котушки зі струмом ⊙ -->
  <circle cx="769" cy="286" r="5" fill="#f59e0b" stroke="#b45309" stroke-width="1.2"/>
  <circle cx="769" cy="286" r="1.5" fill="#b45309"/>

  <circle cx="769" cy="302" r="5" fill="#f59e0b" stroke="#b45309" stroke-width="1.2"/>
  <circle cx="769" cy="302" r="1.5" fill="#b45309"/>

  <circle cx="769" cy="318" r="5" fill="#f59e0b" stroke="#b45309" stroke-width="1.2"/>
  <circle cx="769" cy="318" r="1.5" fill="#b45309"/>

  <circle cx="769" cy="334" r="5" fill="#f59e0b" stroke="#b45309" stroke-width="1.2"/>
  <circle cx="769" cy="334" r="1.5" fill="#b45309"/>

  <circle cx="769" cy="350" r="5" fill="#f59e0b" stroke="#b45309" stroke-width="1.2"/>
  <circle cx="769" cy="350" r="1.5" fill="#b45309"/>

  <circle cx="769" cy="366" r="5" fill="#f59e0b" stroke="#b45309" stroke-width="1.2"/>
  <circle cx="769" cy="366" r="1.5" fill="#b45309"/>

  <!-- Вектор сили Лоренца F -->
  <line x1="800" y1="355" x2="800" y2="295" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <line x1="800" y1="305" x2="800" y2="365" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <!-- Пояснення сили та руху в зазорі -->
  <text x="793" y="398" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Сила Лоренца F = I · (L × B)</text>
  <text x="793" y="415" font-size="12" fill="#1a1a1a" text-anchor="middle">осьовий рух котушки без тертя</text>
</svg>
