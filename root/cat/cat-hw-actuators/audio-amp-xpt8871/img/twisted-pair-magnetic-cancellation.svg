<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка полотна -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="28" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Просторова геометрія витої пари: взаємна компенсація магнітної завади</text>
  <text x="480" y="47" font-size="13" fill="#6b7280" text-anchor="middle">Чергування просторової орієнтації напіввитків наводить протифазні ЕРС: сумарний шум у парі прямує до нуля</text>

  <!-- Панель 1: Геометрія витої пари у просторі -->
  <rect x="24" y="60" width="912" height="216" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <text x="40" y="80" font-size="13" font-weight="700" fill="#1a1a1a">1. Геометрія чергування орієнтації петель в однорідному магнітному полі B</text>

  <!-- Легенда провідників -->
  <line x1="600" y1="76" x2="624" y2="76" stroke="#2457d6" stroke-width="3" stroke-linecap="round"/>
  <text x="630" y="80" font-size="12" font-weight="700" fill="#2457d6">Провідник IN+</text>

  <line x1="750" y1="76" x2="774" y2="76" stroke="#475569" stroke-width="3" stroke-linecap="round"/>
  <text x="780" y="80" font-size="12" font-weight="700" fill="#475569">Провідник IN−</text>

  <!-- Крок скрутки p (розмірні лінії) -->
  <line x1="134" y1="96" x2="459" y2="96" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 2"/>
  <line x1="134" y1="92" x2="134" y2="100" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="459" y1="92" x2="459" y2="100" stroke="#6b7280" stroke-width="1.2"/>
  <text x="296" y="93" font-size="12" fill="#6b7280" text-anchor="middle">Крок скрутки p (2 напіввитки = 1 повний період)</text>

  <line x1="459" y1="96" x2="784" y2="96" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4 2"/>
  <line x1="784" y1="92" x2="784" y2="100" stroke="#6b7280" stroke-width="1.2"/>
  <text x="621" y="93" font-size="12" fill="#6b7280" text-anchor="middle">Наступний крок скрутки p</text>

  <!-- Вектори зовнішнього магнітного поля B -->
  <text x="40" y="111" font-size="12" font-weight="700" fill="#c0392b">Поле завади B(t) ↓</text>
  <line x1="215" y1="104" x2="215" y2="116" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="223" y="114" font-size="12" font-weight="700" fill="#c0392b">B</text>

  <line x1="378" y1="104" x2="378" y2="116" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="386" y="114" font-size="12" font-weight="700" fill="#c0392b">B</text>

  <line x1="540" y1="104" x2="540" y2="116" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="548" y="114" font-size="12" font-weight="700" fill="#c0392b">B</text>

  <line x1="702" y1="104" x2="702" y2="116" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="710" y="114" font-size="12" font-weight="700" fill="#c0392b">B</text>

  <!-- Блок «Джерело сигналу» -->
  <rect x="38" y="120" width="86" height="86" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="81" y="138" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Джерело</text>
  <text x="81" y="154" font-size="12" fill="#6b7280" text-anchor="middle">сигналу</text>
  <text x="81" y="172" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">OUT+</text>
  <text x="81" y="192" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">OUT−</text>
  <circle cx="124" cy="168" r="3" fill="#2457d6"/>
  <circle cx="124" cy="188" r="3" fill="#475569"/>

  <!-- Блок «Підсилювач XPT8871» -->
  <rect x="794" y="120" width="128" height="86" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="858" y="138" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">XPT8871</text>
  <text x="858" y="154" font-size="12" fill="#6b7280" text-anchor="middle">Диференц. вхід</text>
  <text x="858" y="172" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">CMRR &gt; 60 дБ</text>
  <text x="858" y="192" font-size="12" fill="#1a1a1a" text-anchor="middle">U_диф = 0 В</text>
  <circle cx="794" cy="168" r="3" fill="#2457d6"/>
  <circle cx="794" cy="188" r="3" fill="#475569"/>

  <!-- З'єднувальні виводи -->
  <line x1="124" y1="168" x2="134" y2="168" stroke="#2457d6" stroke-width="3"/>
  <line x1="124" y1="188" x2="134" y2="168" stroke="#475569" stroke-width="3"/>
  <line x1="784" y1="168" x2="794" y2="168" stroke="#2457d6" stroke-width="3"/>
  <line x1="784" y1="168" x2="794" y2="188" stroke="#475569" stroke-width="3"/>

  <!-- Підписи наведеної ЕРС над верхніми дугами -->
  <text x="215" y="132" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">← наведена ЕРС (−e)</text>
  <text x="378" y="132" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">← наведена ЕРС (−e)</text>
  <text x="540" y="132" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">← наведена ЕРС (−e)</text>
  <text x="702" y="132" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">← наведена ЕРС (−e)</text>

  <!-- Провідники витої пари (сплетіння з урахуванням накладання) -->
  <!-- Петля 1 -->
  <path d="M 134 168 C 178 136, 252 136, 296 168" fill="none" stroke="#2457d6" stroke-width="3"/>
  <path d="M 134 168 C 178 200, 252 200, 296 168" fill="none" stroke="#475569" stroke-width="3"/>

  <!-- Петля 2: задня лінія Wire B, передня лінія Wire A -->
  <path d="M 296 168 C 340 136, 415 136, 459 168" fill="none" stroke="#475569" stroke-width="3"/>
  <!-- Перетин 1 (x=296): Wire A поверх Wire B -->
  <path d="M 288 162 C 294 166, 298 170, 304 174" fill="none" stroke="#f4f6f8" stroke-width="7" stroke-linecap="round"/>
  <path d="M 296 168 C 340 200, 415 200, 459 168" fill="none" stroke="#2457d6" stroke-width="3"/>

  <!-- Петля 3: задня лінія Wire A, передня лінія Wire B -->
  <path d="M 459 168 C 503 136, 577 136, 621 168" fill="none" stroke="#2457d6" stroke-width="3"/>
  <!-- Перетин 2 (x=459): Wire B поверх Wire A -->
  <path d="M 451 162 C 457 166, 461 170, 467 174" fill="none" stroke="#f4f6f8" stroke-width="7" stroke-linecap="round"/>
  <path d="M 459 168 C 503 200, 577 200, 621 168" fill="none" stroke="#475569" stroke-width="3"/>

  <!-- Петля 4: задня лінія Wire B, передня лінія Wire A -->
  <path d="M 621 168 C 665 136, 740 136, 784 168" fill="none" stroke="#475569" stroke-width="3"/>
  <!-- Перетин 3 (x=621): Wire A поверх Wire B -->
  <path d="M 613 162 C 619 166, 623 170, 629 174" fill="none" stroke="#f4f6f8" stroke-width="7" stroke-linecap="round"/>
  <path d="M 621 168 C 665 200, 740 200, 784 168" fill="none" stroke="#2457d6" stroke-width="3"/>

  <!-- Орієнтація нормалей просторових контурів (n1..n4) всередині петель -->
  <!-- Петля 1: n1 (+z, на спостерігача) -->
  <circle cx="202" cy="168" r="7" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="202" cy="168" r="2" fill="#2457d6"/>
  <text x="214" y="172" font-size="12" font-weight="700" fill="#2457d6">n₁ (+z)</text>

  <!-- Петля 2: n2 (-z, від спостерігача) -->
  <circle cx="365" cy="168" r="7" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="361" y1="164" x2="369" y2="172" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="369" y1="164" x2="361" y2="172" stroke="#2457d6" stroke-width="1.5"/>
  <text x="377" y="172" font-size="12" font-weight="700" fill="#2457d6">n₂ (−z)</text>

  <!-- Петля 3: n3 (+z, на спостерігача) -->
  <circle cx="527" cy="168" r="7" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="527" cy="168" r="2" fill="#2457d6"/>
  <text x="539" y="172" font-size="12" font-weight="700" fill="#2457d6">n₃ (+z)</text>

  <!-- Петля 4: n4 (-z, від спостерігача) -->
  <circle cx="689" cy="168" r="7" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="685" y1="164" x2="693" y2="172" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="693" y1="164" x2="685" y2="172" stroke="#2457d6" stroke-width="1.5"/>
  <text x="701" y="172" font-size="12" font-weight="700" fill="#2457d6">n₄ (−z)</text>

  <!-- Підписи наведеної ЕРС під нижніми дугами -->
  <text x="215" y="208" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">наведена ЕРС (+e) →</text>
  <text x="378" y="208" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">наведена ЕРС (+e) →</text>
  <text x="540" y="208" font-size="12" font-weight="700" fill="#475569" text-anchor="middle">наведена ЕРС (+e) →</text>
  <text x="702" y="208" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">наведена ЕРС (+e) →</text>

  <!-- Блоки параметрів петель у нижній частині панелі 1 -->
  <rect x="145" y="222" width="140" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="215" y="238" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Петля 1 (S₁ = +S)</text>
  <text x="215" y="254" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">e₁ = +e_завади</text>

  <rect x="308" y="222" width="140" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="378" y="238" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Петля 2 (S₂ = −S)</text>
  <text x="378" y="254" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">e₂ = −e_завади</text>

  <rect x="470" y="222" width="140" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="540" y="238" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Петля 3 (S₃ = +S)</text>
  <text x="540" y="254" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">e₃ = +e_завади</text>

  <rect x="632" y="222" width="140" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="702" y="238" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Петля 4 (S₄ = −S)</text>
  <text x="702" y="254" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">e₄ = −e_завади</text>

  <!-- Панель 2: Покрокова взаємна компенсація вздовж лінії -->
  <rect x="24" y="288" width="912" height="156" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <text x="40" y="306" font-size="13" font-weight="700" fill="#1a1a1a">2. Покрокова взаємна компенсація наведених ЕРС уздовж провідників</text>

  <!-- Індикатор балансу зліва -->
  <rect x="38" y="318" width="86" height="74" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="81" y="338" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Кумулятивна</text>
  <text x="81" y="354" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">сума завади</text>
  <text x="81" y="372" font-size="12" fill="#6b7280" text-anchor="middle">Σ e_ind(x)</text>

  <!-- Стрілка 0 -> 1 -->
  <line x1="128" y1="355" x2="141" y2="355" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Крок 1 -->
  <rect x="145" y="318" width="140" height="74" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="215" y="336" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Крок 1: петля 1</text>
  <text x="215" y="352" font-size="12" fill="#6b7280" text-anchor="middle">e₁ = +e</text>
  <rect x="156" y="362" width="118" height="20" rx="4" fill="#fdecea"/>
  <text x="215" y="376" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Σ e = +e (завада)</text>

  <!-- Стрілка 1 -> 2 -->
  <line x1="289" y1="355" x2="304" y2="355" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Крок 2 (Компенсація витка 1) -->
  <rect x="308" y="318" width="140" height="74" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="378" y="336" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Крок 2: петля 2</text>
  <text x="378" y="352" font-size="12" fill="#1a1a1a" text-anchor="middle">e₂ = −e (протифаза)</text>
  <rect x="319" y="362" width="118" height="20" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="378" y="376" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Σ e = +e − e = 0 В</text>

  <!-- Стрілка 2 -> 3 -->
  <line x1="452" y1="355" x2="466" y2="355" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Крок 3 -->
  <rect x="470" y="318" width="140" height="74" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="540" y="336" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Крок 3: петля 3</text>
  <text x="540" y="352" font-size="12" fill="#6b7280" text-anchor="middle">e₃ = +e</text>
  <rect x="481" y="362" width="118" height="20" rx="4" fill="#fdecea"/>
  <text x="540" y="376" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Σ e = 0 + e = +e</text>

  <!-- Стрілка 3 -> 4 -->
  <line x1="614" y1="355" x2="628" y2="355" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Крок 4 (Компенсація витка 2) -->
  <rect x="632" y="318" width="140" height="74" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="702" y="336" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Крок 4: петля 4</text>
  <text x="702" y="352" font-size="12" fill="#1a1a1a" text-anchor="middle">e₄ = −e (протифаза)</text>
  <rect x="643" y="362" width="118" height="20" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="702" y="376" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Σ e = +e − e = 0 В</text>

  <!-- Стрілка 4 -> Receiver -->
  <line x1="776" y1="355" x2="790" y2="355" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Результат на вході XPT8871 -->
  <rect x="794" y="318" width="128" height="74" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="858" y="338" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">На вході XPT8871</text>
  <text x="858" y="356" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">U_диф = 0 В</text>
  <text x="858" y="374" font-size="12" fill="#27ae60" text-anchor="middle">Шум компенсовано</text>

  <!-- Нижній висновок-банер -->
  <rect x="38" y="406" width="884" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="423" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Фізичний принцип: за кожні два напіввитки Σ e = 0. У прямій парі завада росте лінійно з довжиною: U_завади = N · e</text>
</svg>
