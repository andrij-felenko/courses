<svg viewBox="0 0 960 460" width="960" height="460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма ШІМ-сигналу SG92R</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Керування позицією вала та безпечні межі імпульсу (T = 20 ms, 50 Hz)</text>

  <!-- Axes -->
  <path d="M 100 150 L 800 150" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 100 250 L 800 250" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 100 350 L 800 350" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Waveform 1: 1.0ms (0 degrees) -->
  <path d="M 100 150 L 100 110 L 150 110 L 150 150 L 400 150" fill="none" stroke="#2457d6" stroke-width="3"/>
  <text x="125" y="100" font-size="12" fill="#1a1a1a" text-anchor="middle">1.0 ms</text>
  <text x="420" y="150" font-size="14" fill="#1a1a1a" font-weight="bold" text-anchor="start">0° (Крайня ліва)</text>
  
  <!-- Waveform 2: 1.5ms (90 degrees) -->
  <path d="M 100 250 L 100 210 L 175 210 L 175 250 L 400 250" fill="none" stroke="#27ae60" stroke-width="3"/>
  <text x="137" y="200" font-size="12" fill="#1a1a1a" text-anchor="middle">1.5 ms</text>
  <text x="420" y="250" font-size="14" fill="#1a1a1a" font-weight="bold" text-anchor="start">90° (Нейтраль)</text>

  <!-- Waveform 3: 2.0ms (180 degrees) -->
  <path d="M 100 350 L 100 310 L 200 310 L 200 350 L 400 350" fill="none" stroke="#c0392b" stroke-width="3"/>
  <text x="150" y="300" font-size="12" fill="#1a1a1a" text-anchor="middle">2.0 ms</text>
  <text x="420" y="350" font-size="14" fill="#1a1a1a" font-weight="bold" text-anchor="start">180° (Крайня права)</text>

  <!-- Safe zones vs Danger zones -->
  <rect x="50" y="380" width="100" height="40" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="100" y="405" font-size="12" fill="#1a1a1a" text-anchor="middle">&lt; 0.5 ms</text>
  <text x="100" y="435" font-size="12" fill="#c0392b" text-anchor="middle">Небезпечно!</text>
  
  <rect x="150" y="380" width="150" height="40" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="225" y="405" font-size="12" fill="#1a1a1a" text-anchor="middle">0.5 ms - 2.5 ms</text>
  <text x="225" y="435" font-size="12" fill="#27ae60" text-anchor="middle">Робоча зона</text>
  
  <rect x="300" y="380" width="100" height="40" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="350" y="405" font-size="12" fill="#1a1a1a" text-anchor="middle">&gt; 2.5 ms</text>
  <text x="350" y="435" font-size="12" fill="#c0392b" text-anchor="middle">Небезпечно!</text>

  <!-- Period indication -->
  <path d="M 100 80 L 100 60" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <path d="M 400 80 L 400 60" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <path d="M 100 70 L 400 70" fill="none" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="250" y="60" font-size="12" fill="#1a1a1a" text-anchor="middle">T = 20 ms</text>

</svg>