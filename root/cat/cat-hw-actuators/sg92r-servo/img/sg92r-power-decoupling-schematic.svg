<svg viewBox="0 0 960 460" width="960" height="460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Електрична схема підключення SG92R</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Принципова схема з розділеними шинами живлення</text>

  <!-- Power Source -->
  <rect x="50" y="150" width="140" height="80" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="120" y="185" font-size="14" fill="#1a1a1a" font-weight="bold" text-anchor="middle">Джерело живлення</text>
  <text x="120" y="205" font-size="12" fill="#6b7280" text-anchor="middle">5.0V DC</text>

  <!-- Nodes and lines -->
  <path d="M 190 170 L 300 170" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 190 210 L 800 210" fill="none" stroke="#1a1a1a" stroke-width="2"/> <!-- GND line -->
  
  <text x="250" y="205" font-size="12" fill="#1a1a1a" text-anchor="middle">GND</text>
  <text x="250" y="160" font-size="12" fill="#1a1a1a" text-anchor="middle">VCC</text>

  <!-- MCU Logic -->
  <path d="M 300 170 L 300 100 L 400 100" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="340" y="90" width="40" height="20" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 360 90 L 360 110" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="360" y="80" font-size="12" fill="#1a1a1a" text-anchor="middle">D1</text>
  
  <rect x="400" y="60" width="140" height="80" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="470" y="95" font-size="14" fill="#1a1a1a" font-weight="bold" text-anchor="middle">MCU</text>
  <text x="470" y="115" font-size="12" fill="#6b7280" text-anchor="middle">Логіка</text>

  <path d="M 470 140 L 470 210" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Servo Logic -->
  <path d="M 300 170 L 600 170" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- Capacitor -->
  <path d="M 500 170 L 500 210" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="480" y="180" width="40" height="5" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="480" y="195" width="40" height="5" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/>
  <text x="450" y="195" font-size="12" fill="#1a1a1a" text-anchor="middle">C1 470uF</text>

  <!-- Servo Component -->
  <rect x="600" y="130" width="140" height="120" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="670" y="170" font-size="14" fill="#1a1a1a" font-weight="bold" text-anchor="middle">SG92R</text>
  <text x="670" y="190" font-size="12" fill="#6b7280" text-anchor="middle">Привід</text>
  
  <path d="M 670 250 L 670 210" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  
  <path d="M 540 100 L 670 100 L 670 130" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="600" y="90" font-size="12" fill="#1a1a1a" text-anchor="middle">ШІМ Сигнал</text>
</svg>