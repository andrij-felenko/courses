<svg viewBox="0 0 960 460" width="960" height="460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Внутрішній устрій та редуктор SG92R</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Деталізація колекторного двигуна, вуглеволоконних шестерень та потенціометра</text>

  <!-- Component blocks -->
  <!-- Motor -->
  <rect x="150" y="200" width="160" height="80" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="230" y="235" font-size="14" fill="#1a1a1a" font-weight="bold" text-anchor="middle">Колекторний двигун</text>
  <text x="230" y="255" font-size="12" fill="#6b7280" text-anchor="middle">DC мотор, 12000 об/хв</text>

  <!-- Gearbox -->
  <rect x="400" y="100" width="160" height="280" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="480" y="130" font-size="14" fill="#1a1a1a" font-weight="bold" text-anchor="middle">Редуктор SG92R</text>
  <text x="480" y="150" font-size="12" fill="#6b7280" text-anchor="middle">Вуглеволоконний композит</text>
  
  <rect x="420" y="170" width="120" height="40" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="195" font-size="12" fill="#1a1a1a" text-anchor="middle">Ступінь 1 (POM)</text>
  
  <rect x="420" y="220" width="120" height="40" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="245" font-size="12" fill="#1a1a1a" text-anchor="middle">Ступінь 2 (CF)</text>
  
  <rect x="420" y="270" width="120" height="40" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="295" font-size="12" fill="#1a1a1a" text-anchor="middle">Ступінь 3 (CF)</text>

  <rect x="420" y="320" width="120" height="40" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="345" font-size="12" fill="#1a1a1a" text-anchor="middle">Ступінь 4 (Вихідна)</text>

  <!-- Output Shaft -->
  <rect x="650" y="200" width="160" height="80" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="730" y="235" font-size="14" fill="#1a1a1a" font-weight="bold" text-anchor="middle">Вихідний вал</text>
  <text x="730" y="255" font-size="12" fill="#6b7280" text-anchor="middle">Поворот на 180°</text>

  <!-- Potentiometer -->
  <rect x="650" y="300" width="160" height="80" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="730" y="335" font-size="14" fill="#1a1a1a" font-weight="bold" text-anchor="middle">Потенціометр</text>
  <text x="730" y="355" font-size="12" fill="#6b7280" text-anchor="middle">Зворотний зв'язок</text>

  <!-- Arrows -->
  <path d="M 310 240 L 390 240" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="350" y="230" font-size="12" fill="#1a1a1a" text-anchor="middle">Обертання</text>

  <path d="M 560 240 L 640 240" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="600" y="230" font-size="12" fill="#1a1a1a" text-anchor="middle">2.5 kg·cm</text>

  <path d="M 730 280 L 730 290" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
</svg>