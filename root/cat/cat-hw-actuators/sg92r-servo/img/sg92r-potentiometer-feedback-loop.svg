<svg viewBox="0 0 960 460" width="960" height="460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Замкнена петля зворотного зв'язку SG92R</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Порівняння ШІМ-сигналу та напруги потенціометра</text>

  <!-- Blocks -->
  <rect x="50" y="200" width="140" height="80" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="120" y="235" font-size="14" fill="#1a1a1a" font-weight="bold" text-anchor="middle">ШІМ Сигнал</text>
  <text x="120" y="255" font-size="12" fill="#6b7280" text-anchor="middle">t = 1.0 - 2.0 ms</text>

  <rect x="250" y="200" width="140" height="80" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="320" y="235" font-size="14" fill="#1a1a1a" font-weight="bold" text-anchor="middle">Контролер (IC)</text>
  <text x="320" y="255" font-size="12" fill="#6b7280" text-anchor="middle">Перетворювач в Vref</text>

  <circle cx="460" cy="240" r="20" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
  <text x="460" y="245" font-size="18" fill="#1a1a1a" text-anchor="middle">-</text>

  <rect x="540" y="200" width="120" height="80" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="600" y="235" font-size="14" fill="#1a1a1a" font-weight="bold" text-anchor="middle">H-Міст</text>
  <text x="600" y="255" font-size="12" fill="#6b7280" text-anchor="middle">Драйвер мотора</text>

  <rect x="720" y="200" width="180" height="80" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="810" y="235" font-size="14" fill="#1a1a1a" font-weight="bold" text-anchor="middle">DC Мотор + Редуктор</text>
  <text x="810" y="255" font-size="12" fill="#6b7280" text-anchor="middle">Вал (кут θ)</text>

  <rect x="400" y="320" width="140" height="60" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="470" y="345" font-size="14" fill="#1a1a1a" font-weight="bold" text-anchor="middle">Потенціометр</text>
  <text x="470" y="365" font-size="12" fill="#6b7280" text-anchor="middle">Вимірювач кута Vpot</text>

  <!-- Arrows -->
  <path d="M 190 240 L 240 240" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  
  <path d="M 390 240 L 430 240" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="410" y="230" font-size="12" fill="#1a1a1a" text-anchor="middle">Vref</text>

  <path d="M 480 240 L 530 240" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="505" y="230" font-size="12" fill="#1a1a1a" text-anchor="middle">Похибка</text>

  <path d="M 660 240 L 710 240" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  
  <path d="M 810 280 L 810 350 L 540 350" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  
  <path d="M 460 320 L 460 260" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="480" y="290" font-size="12" fill="#1a1a1a" text-anchor="middle">Vpot</text>
