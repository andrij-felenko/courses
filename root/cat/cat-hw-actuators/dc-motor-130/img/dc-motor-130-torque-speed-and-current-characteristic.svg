<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Стрілки для осей -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Характеристика DC-двигуна 130: швидкість, струм та момент</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Зі зростанням навантаження M швидкість n падає, а струм I зростає до струму блокування I_stall</text>

  <!-- Назви осей -->
  <text x="120" y="90" text-anchor="start" font-size="13" font-weight="bold" fill="#2457d6">n (Швидкість, об/хв)</text>
  <text x="660" y="90" text-anchor="end" font-size="13" font-weight="bold" fill="#c0392b">I (Струм споживання, А)</text>

  <!-- Тло графіка -->
  <rect x="120" y="115" width="540" height="320" fill="#fafafa" rx="4" stroke="#d0d7de" stroke-width="1"/>

  <!-- Підсвічені зони робочих режимів -->
  <!-- Номінальна робоча зона -->
  <rect x="195" y="115" width="90" height="320" fill="#e9f7ef" opacity="0.75"/>
  <text x="240" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Номінальна зона</text>
  <text x="240" y="146" text-anchor="middle" font-size="11" fill="#27ae60">(Max ККД η)</text>

  <!-- Зона небезпечного навантаження / заклинювання -->
  <rect x="530" y="115" width="130" height="320" fill="#fdecea" opacity="0.75"/>
  <text x="595" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Зона заклинювання</text>
  <text x="595" y="146" text-anchor="middle" font-size="11" fill="#c0392b">(Перегрів / знос)</text>

  <!-- Сітка графіка (горизонтальні лінії) -->
  <line x1="120" y1="195" x2="660" y2="195" stroke="#e5e7eb" stroke-dasharray="4,4"/>
  <line x1="120" y1="275" x2="660" y2="275" stroke="#e5e7eb" stroke-dasharray="4,4"/>
  <line x1="120" y1="355" x2="660" y2="355" stroke="#e5e7eb" stroke-dasharray="4,4"/>

  <!-- Крива ККД (η) - зелена пунктирна -->
  <path d="M 120 435 C 160 250 210 220 240 230 C 320 250 480 380 660 435" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="250" y="210" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">η (ККД)</text>

  <!-- Лінія швидкості n(M) - синя -->
  <line x1="120" y1="160" x2="660" y2="435" stroke="#2457d6" stroke-width="3.5" stroke-linecap="round"/>
  <text x="330" y="245" text-anchor="start" font-size="13" font-weight="bold" fill="#2457d6">n(M) — Оберти вала</text>

  <!-- Лінія струму I(M) - червона -->
  <line x1="120" y1="400" x2="660" y2="160" stroke="#c0392b" stroke-width="3.5" stroke-linecap="round"/>
  <text x="330" y="325" text-anchor="start" font-size="13" font-weight="bold" fill="#c0392b">I(M) — Струм споживання</text>

  <!-- Вертикальна проекція номінальної точки -->
  <line x1="240" y1="115" x2="240" y2="435" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Точки на кривих -->
  <!-- Холостий хід -->
  <circle cx="120" cy="160" r="5" fill="#2457d6"/>
  <circle cx="120" cy="400" r="5" fill="#c0392b"/>

  <!-- Номінальна робоча точка -->
  <circle cx="240" cy="221" r="5" fill="#2457d6"/>
  <circle cx="240" cy="230" r="5" fill="#27ae60"/>
  <circle cx="240" cy="347" r="5" fill="#c0392b"/>

  <!-- Точка заклинювання -->
  <circle cx="660" cy="435" r="5" fill="#2457d6"/>
  <circle cx="660" cy="160" r="5" fill="#c0392b"/>

  <!-- Осі координат -->
  <!-- Ліва вісь Y (Швидкість) -->
  <line x1="120" y1="435" x2="120" y2="102" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Права вісь Y (Струм) -->
  <line x1="660" y1="435" x2="660" y2="102" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <!-- Вісь X (Момент) -->
  <line x1="120" y1="435" x2="675" y2="435" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Позначки на осі Y (ліва) -->
  <line x1="115" y1="160" x2="120" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="112" y="164" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">n_0</text>

  <line x1="115" y1="221" x2="120" y2="221" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="112" y="225" text-anchor="end" font-size="12" fill="#2457d6">n_ном</text>

  <text x="112" y="439" text-anchor="end" font-size="12" fill="#1a1a1a">0</text>

  <!-- Позначки на осі Y (права) -->
  <line x1="660" y1="160" x2="665" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="668" y="164" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">I_stall</text>

  <line x1="660" y1="347" x2="665" y2="347" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="668" y="351" text-anchor="start" font-size="12" fill="#c0392b">I_ном</text>

  <line x1="660" y1="400" x2="665" y2="400" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="668" y="404" text-anchor="start" font-size="12" fill="#c0392b">I_0 (ХХ)</text>

  <!-- Позначки на осі X -->
  <line x1="120" y1="435" x2="120" y2="440" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="120" y="455" text-anchor="middle" font-size="12" fill="#1a1a1a">0</text>

  <line x1="240" y1="435" x2="240" y2="440" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="240" y="455" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">M_ном</text>

  <line x1="660" y1="435" x2="660" y2="440" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="660" y="455" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">M_stall (блокування)</text>

  <!-- Підпис осі X -->
  <text x="390" y="476" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Механічний момент на валу M (мН·м)</text>

  <!-- Нижня рамка-порада -->
  <rect x="120" y="492" width="540" height="28" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="390" y="510" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">💡 Силовий ключ та H-міст обирають за струмом заклинювання I_stall, а не I_0!</text>

  <!-- Права інформаційна панель -->
  <!-- Картка 1: Холостий хід -->
  <rect x="730" y="95" width="210" height="110" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="742" y="114" font-size="12" font-weight="bold" fill="#2457d6">1. Холостий хід (M ≈ 0)</text>
  <text x="742" y="134" font-size="11.5" fill="#1a1a1a">• Швидкість max (n = n_0)</text>
  <text x="742" y="152" font-size="11.5" fill="#1a1a1a">• Струм min (I = I_0)</text>
  <text x="742" y="170" font-size="11.5" fill="#6b7280">• Подолання тертя щіток</text>
  <text x="742" y="186" font-size="11.5" fill="#6b7280">  та втулок ротора</text>

  <!-- Картка 2: Робоча точка -->
  <rect x="730" y="220" width="210" height="115" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="742" y="239" font-size="12" font-weight="bold" fill="#27ae60">2. Робоча точка (M_ном)</text>
  <text x="742" y="259" font-size="11.5" fill="#1a1a1a">• Момент ≈ 15–25% M_stall</text>
  <text x="742" y="277" font-size="11.5" fill="#1a1a1a">• Максимальний ККД η</text>
  <text x="742" y="295" font-size="11.5" fill="#1a1a1a">• Помірне нагрівання</text>
  <text x="742" y="313" font-size="11.5" font-weight="bold" fill="#27ae60">• Рекомендований режим</text>

  <!-- Картка 3: Заклинювання / Блокування -->
  <rect x="730" y="350" width="210" height="130" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="742" y="369" font-size="12" font-weight="bold" fill="#c0392b">3. Блокування (M_stall)</text>
  <text x="742" y="389" font-size="11.5" fill="#1a1a1a">• Вал зупинено (n = 0)</text>
  <text x="742" y="407" font-size="11.5" font-weight="bold" fill="#c0392b">• Піковий струм I_stall</text>
  <text x="742" y="425" font-size="11.5" fill="#1a1a1a">• Швидкий перегрів (I²R)</text>
  <text x="742" y="443" font-size="11.5" fill="#c0392b">• Іскріння, руйнування</text>
  <text x="742" y="459" font-size="11.5" fill="#c0392b">  щоб та колектора</text>
</svg>
