<svg width="960" height="560" viewBox="0 0 960 560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>

    <linearGradient id="grad-current" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2457d6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#2457d6" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="grad-danger" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c0392b" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#c0392b" stop-opacity="0.30"/>
    </linearGradient>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Осцилограма пускового струму та просідання шини живлення DC-двигуна</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Пусковий надструм і заклинювання вала спричиняють просідання шини V_CC та ризик збою логіки</text>

  <!-- Main Graph Panel -->
  <rect x="40" y="72" width="880" height="388" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>

  <!-- Phase Headers -->
  <text x="180" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">Пауза</text>
  <text x="300" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Пусковий режим</text>
  <text x="440" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Усталений режим</text>
  <text x="670" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Режим заклинювання (Stall)</text>

  <!-- Vertical Phase Divider Lines -->
  <line x1="220" y1="72" x2="220" y2="432" stroke="#d0d7de" stroke-dasharray="3 3"/>
  <line x1="380" y1="72" x2="380" y2="432" stroke="#d0d7de" stroke-dasharray="3 3"/>
  <line x1="500" y1="72" x2="500" y2="432" stroke="#d0d7de" stroke-dasharray="3 3"/>
  <line x1="840" y1="72" x2="840" y2="432" stroke="#d0d7de" stroke-dasharray="3 3"/>

  <!-- Section Titles -->
  <text x="145" y="118" font-size="13" font-weight="bold" fill="#2457d6">Струм споживання I_motor (A)</text>
  <text x="145" y="285" font-size="13" font-weight="bold" fill="#c0392b">Напруга шини живлення U_bus (V)</text>

  <!-- Y-Axis Grid Lines & Labels (Current) -->
  <line x1="140" y1="134" x2="860" y2="134" stroke="#d0d7de" stroke-dasharray="4 4"/>
  <text x="135" y="138" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">I_stall (1.8 A)</text>

  <line x1="140" y1="232" x2="860" y2="232" stroke="#d0d7de" stroke-dasharray="4 4"/>
  <text x="135" y="236" text-anchor="end" font-size="12" fill="#1a1a1a">I_роб. (0.2 A)</text>

  <line x1="140" y1="248" x2="860" y2="248" stroke="#6b7280" stroke-width="1.5"/>
  <text x="135" y="252" text-anchor="end" font-size="12" fill="#6b7280">0 A</text>

  <!-- Y-Axis Grid Lines & Labels (Voltage) -->
  <line x1="140" y1="301" x2="860" y2="301" stroke="#27ae60" stroke-dasharray="4 4" opacity="0.6"/>
  <text x="135" y="305" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">U_ном (5.0 V)</text>

  <line x1="140" y1="368" x2="860" y2="368" stroke="#c0392b" stroke-dasharray="4 3" stroke-width="1.5"/>
  <text x="135" y="372" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">U_пор. MCU (3.8 V)</text>

  <line x1="140" y1="418" x2="860" y2="418" stroke="#6b7280" stroke-width="1.5"/>
  <text x="135" y="422" text-anchor="end" font-size="12" fill="#6b7280">0 V</text>

  <!-- Waveform Fills & Lines -->
  <!-- Current Fill & Stroke -->
  <path d="M 140 248 L 220 248 L 228 134 C 260 170, 310 232, 380 232 L 500 232 L 508 134 L 840 134 L 845 248 L 860 248 L 140 248 Z" fill="url(#grad-current)"/>
  <path d="M 140 248 L 220 248 L 228 134 C 260 170, 310 232, 380 232 L 500 232 L 508 134 L 840 134 L 845 248 L 860 248" fill="none" stroke="#2457d6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Voltage Fill & Stroke -->
  <path d="M 506 368 L 508 388 L 840 388 L 842 368 Z" fill="url(#grad-danger)"/>
  <path d="M 140 301 L 220 301 L 228 328 C 260 315, 310 301, 380 301 L 500 301 L 508 388 L 840 388 L 845 301 L 860 301" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Callouts & Badges -->
  <!-- Badge 1: Inrush Peak -->
  <rect x="245" y="130" width="140" height="38" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="252" y="145" font-size="12" font-weight="bold" fill="#2457d6">I_пуск = I_stall</text>
  <text x="252" y="160" font-size="12" fill="#1a1a1a">(E = 0 при пуску)</text>
  <line x1="245" y1="145" x2="232" y2="137" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Back-EMF Decay Note -->
  <text x="320" y="190" font-size="12" font-weight="bold" fill="#2457d6">Проти-ЕРС E ∝ ω ↑</text>
  <text x="320" y="206" font-size="12" fill="#6b7280">I = (U - E) / R_обм</text>

  <!-- Badge 2: Stall Current -->
  <rect x="530" y="130" width="175" height="38" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="537" y="145" font-size="12" font-weight="bold" fill="#c0392b">Тривалий струм I_stall</text>
  <text x="537" y="160" font-size="12" fill="#1a1a1a">(Вал заблоковано, E = 0)</text>
  <line x1="530" y1="149" x2="512" y2="140" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Voltage Dip 1 Note -->
  <text x="245" y="325" font-size="12" fill="#6b7280">Просідання ΔU_пуск</text>
  <line x1="238" y1="301" x2="238" y2="328" stroke="#6b7280" stroke-width="1" marker-end="url(#arr-gray)"/>

  <!-- Badge 3: Voltage Sag Stall / MCU Reset Danger -->
  <rect x="530" y="348" width="230" height="38" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="537" y="363" font-size="12" font-weight="bold" fill="#c0392b">Глибоке просідання U_bus &lt; U_пор</text>
  <text x="537" y="378" font-size="12" fill="#1a1a1a">Загроза збою / перезапуску MCU</text>
  <line x1="530" y1="367" x2="512" y2="380" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Time Axis -->
  <line x1="140" y1="432" x2="860" y2="432" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="868" y="436" font-size="12" font-weight="bold" fill="#1a1a1a">Час t</text>

  <line x1="220" y1="428" x2="220" y2="436" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="380" y1="428" x2="380" y2="436" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="500" y1="428" x2="500" y2="436" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="840" y1="428" x2="840" y2="436" stroke="#1a1a1a" stroke-width="1.5"/>

  <text x="220" y="448" text-anchor="middle" font-size="12" fill="#6b7280">Пуск</text>
  <text x="380" y="448" text-anchor="middle" font-size="12" fill="#6b7280">Усталення</text>
  <text x="500" y="448" text-anchor="middle" font-size="12" fill="#6b7280">Заклинювання</text>
  <text x="840" y="448" text-anchor="middle" font-size="12" fill="#6b7280">Вимкнення</text>

  <!-- Summary Cards -->
  <!-- Left Card: Filtering & MCU Protection -->
  <rect x="40" y="475" width="425" height="65" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="52" y="494" font-size="13" font-weight="bold" fill="#27ae60">✔ Фільтрація та резервування живлення MCU</text>
  <text x="52" y="511" font-size="12" fill="#1a1a1a">• Конденсатори C_bulk (100–470 мкФ) згладжують просідання.</text>
  <text x="52" y="527" font-size="12" fill="#6b7280">• Діод Шотткі відсікає зворотний струм розряду в мотор.</text>

  <!-- Right Card: Stall Protection -->
  <rect x="495" y="475" width="425" height="65" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <text x="507" y="494" font-size="13" font-weight="bold" fill="#c0392b">⚠ Захист ключів та двигуна від заклинювання</text>
  <text x="507" y="511" font-size="12" fill="#1a1a1a">• Струмовий сенсор (Current Sense) вимикає H-міст за таймаутом.</text>
  <text x="507" y="527" font-size="12" fill="#6b7280">• Запобігає вигоранню MOSFET і перегріву колекторних щіток.</text>
</svg>
