<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Схема навчального стенду пригнічення EMI колекторного двигуна 130</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Поділ ліній VCC_MOTOR / VCC_MCU LC-фільтром, діод Шотткі D1 та керамічне тріо C1–C3</text>

  <!-- PANEL 1: Decoupling LC Filter & MCU Domain -->
  <rect x="25" y="65" width="410" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="40" y="77" width="380" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="230" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">1. Фільтрація та розділення живлення</text>

  <!-- PANEL 2: Motor Power Circuit & EMI Suppression Triad -->
  <rect x="450" y="65" width="485" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="465" y="77" width="300" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="615" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">2. Комутування двигуна та пригнічення EMI</text>

  <!-- COMMON GROUND RAIL (GND) -->
  <line x1="45" y1="475" x2="915" y2="475" stroke="#1a1a1a" stroke-width="2.5"/>
  <!-- Ground Symbol at x=480 -->
  <line x1="480" y1="475" x2="480" y2="487" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="468" y1="487" x2="492" y2="487" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="473" y1="492" x2="487" y2="492" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="477" y1="497" x2="483" y2="497" stroke="#1a1a1a" stroke-width="2"/>
  <text x="480" y="515" text-anchor="middle" font-size="12" fill="#6b7280">Спільна шина заземлення (GND / Корпус)</text>

  <!-- ==================== PANEL 1 SCHEMATIC ==================== -->

  <!-- Input Power Connection -->
  <circle cx="45" cy="140" r="4" fill="#2457d6"/>
  <text x="45" y="122" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">V_IN (+12V)</text>
  <text x="45" y="158" text-anchor="start" font-size="12" fill="#6b7280">(Джерело)</text>

  <!-- Wire V_IN to Node N1 at (100, 140) -->
  <line x1="45" y1="140" x2="100" y2="140" stroke="#2457d6" stroke-width="2"/>
  <circle cx="100" cy="140" r="3.5" fill="#1a1a1a"/>

  <!-- VCC_MOTOR line going across top to Panel 2 -->
  <line x1="100" y1="140" x2="450" y2="140" stroke="#c0392b" stroke-width="2.5"/>
  <text x="240" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Шина VCC_MOTOR (+12V)</text>

  <!-- VCC_MCU Filter Branch: Down from (100, 140) to (100, 195), then right to L1 -->
  <line x1="100" y1="140" x2="100" y2="195" stroke="#2457d6" stroke-width="2"/>
  <line x1="100" y1="195" x2="130" y2="195" stroke="#2457d6" stroke-width="2"/>

  <!-- Inductor L1 (47 µH) horizontal from (130, 195) to (190, 195) -->
  <text x="160" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">L1 (47 µH)</text>
  <text x="160" y="220" text-anchor="middle" font-size="12" fill="#6b7280">Дросель розв'язки</text>
  <path d="M 130,195 A 7.5,7.5 0 0,1 145,195 A 7.5,7.5 0 0,1 160,195 A 7.5,7.5 0 0,1 175,195 A 7.5,7.5 0 0,1 190,195" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Line after L1 to Nodes and MCU (385, 195) -->
  <line x1="190" y1="195" x2="385" y2="195" stroke="#2457d6" stroke-width="2"/>
  <circle cx="240" cy="195" r="3.5" fill="#2457d6"/>
  <circle cx="290" cy="195" r="3.5" fill="#2457d6"/>
  <circle cx="385" cy="195" r="3.5" fill="#2457d6"/>
  <text x="290" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Шина VCC_MCU (+5V)</text>

  <!-- C_FILT1 (100 µF Electrolytic) at x=240 -->
  <line x1="240" y1="195" x2="240" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="228" y1="240" x2="252" y2="240" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="228" y1="248" x2="252" y2="248" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="240" y1="248" x2="240" y2="475" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="240" cy="475" r="3" fill="#1a1a1a"/>
  <text x="228" y="242" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">C_FILT1</text>
  <text x="228" y="256" text-anchor="end" font-size="12" fill="#6b7280">100 µF</text>
  <text x="228" y="270" text-anchor="end" font-size="12" fill="#6b7280">Електроліт</text>
  <text x="254" y="238" font-size="12" font-weight="bold" fill="#2457d6">+</text>

  <!-- C_FILT2 (0.1 µF Ceramic) at x=290 -->
  <line x1="290" y1="195" x2="290" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="278" y1="240" x2="302" y2="240" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="278" y1="248" x2="302" y2="248" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="290" y1="248" x2="290" y2="475" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="290" cy="475" r="3" fill="#1a1a1a"/>
  <text x="302" y="242" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">C_FILT2</text>
  <text x="302" y="256" text-anchor="start" font-size="12" fill="#6b7280">0.1 µF</text>
  <text x="302" y="270" text-anchor="start" font-size="12" fill="#6b7280">Кераміка</text>

  <!-- MCU Box & Connections (x=315..420) -->
  <line x1="385" y1="195" x2="385" y2="375" stroke="#2457d6" stroke-width="2"/>

  <!-- MCU Box -->
  <rect x="315" y="375" width="105" height="85" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="320" y="381" width="95" height="22" rx="3" fill="#eaf0fd"/>
  <text x="367.5" y="396" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">MCU (STM32/AVR)</text>

  <!-- MCU VCC & GND Pins -->
  <circle cx="385" cy="375" r="3" fill="#2457d6"/>
  <text x="385" y="412" text-anchor="middle" font-size="12" fill="#6b7280">VCC</text>

  <line x1="335" y1="460" x2="335" y2="475" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="335" cy="475" r="3" fill="#1a1a1a"/>
  <text x="335" y="445" text-anchor="middle" font-size="12" fill="#6b7280">GND</text>

  <!-- PWM Output Pin -->
  <line x1="420" y1="415" x2="435" y2="415" stroke="#1a1a1a" stroke-width="2"/>
  <text x="410" y="432" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">PWM Out</text>

  <!-- Probe CH2 Callout Card (Clean MCU Supply) -->
  <rect x="40" y="300" width="175" height="85" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="127.5" y="320" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">CH2: Осцилограф</text>
  <text x="127.5" y="337" text-anchor="middle" font-size="12" fill="#1a1a1a">Чисте VCC_MCU</text>
  <text x="127.5" y="354" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Шум &lt; 30 mV (ОК!)</text>

  <!-- Mini Waveform CH2 (Clean DC) -->
  <path d="M 55,368 L 200,368" fill="none" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Dashed line to Probe CH2 connection point -->
  <line x1="215" y1="340" x2="240" y2="195" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="240" cy="195" r="4" fill="#27ae60"/>

  <!-- ==================== PANEL 2 SCHEMATIC ==================== -->

  <!-- VCC_MOTOR Line extending across Panel 2 -->
  <line x1="450" y1="140" x2="835" y2="140" stroke="#c0392b" stroke-width="2.5"/>

  <!-- EMI Triad Badge / Annotation -->
  <rect x="780" y="82" width="135" height="42" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="847.5" y="99" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Керамічне тріо</text>
  <text x="847.5" y="115" text-anchor="middle" font-size="12" fill="#1a1a1a">Пригнічення EMI</text>

  <!-- Probe CH1 Callout Card (Inductive Noise & Spikes) -->
  <rect x="465" y="265" width="140" height="85" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="535" y="285" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">CH1: Осцилограф</text>
  <text x="535" y="302" text-anchor="middle" font-size="12" fill="#1a1a1a">Шина VCC_MOTOR</text>
  <text x="535" y="319" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Сплески U &gt; 60V!</text>

  <!-- Mini Waveform CH1 (Spikes & EMI Ringing) -->
  <path d="M 475,337 L 490,337 L 494,315 L 497,342 L 500,332 L 503,339 L 506,337 L 520,337 L 524,315 L 527,342 L 530,332 L 533,339 L 555,337" fill="none" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Dashed line to Probe CH1 connection point -->
  <line x1="535" y1="265" x2="535" y2="140" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <circle cx="535" cy="140" r="4" fill="#c0392b"/>

  <!-- Schottky Diode D1 (Anti-parallel across Motor) -->
  <line x1="605" y1="140" x2="605" y2="185" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="605" cy="140" r="3.5" fill="#c0392b"/>

  <!-- Schottky Cathode Bar (bent ends) at y=185 -->
  <path d="M 593,181 L 593,185 L 617,185 L 617,189" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Anode Triangle pointing UP to Cathode -->
  <polygon points="605,185 593,207 617,207" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1"/>
  <!-- Wire from Diode Anode to Drain line -->
  <line x1="605" y1="207" x2="605" y2="360" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Diode Labels -->
  <text x="622" y="190" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">D1 (Шотткі)</text>
  <text x="622" y="205" text-anchor="start" font-size="12" fill="#6b7280">1N5819 / SS14</text>
  <text x="622" y="220" text-anchor="start" font-size="12" fill="#c0392b">Гасіння -L(di/dt)</text>

  <!-- Metal Case Grounding Tag & Wire at x=715 -->
  <line x1="715" y1="170" x2="715" y2="475" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="715" cy="475" r="3" fill="#6b7280"/>
  <text x="710" y="248" text-anchor="end" font-size="12" font-weight="bold" fill="#6b7280">Металевий корпус</text>
  <text x="710" y="263" text-anchor="end" font-size="12" fill="#6b7280">(Екран заземлено)</text>

  <!-- Motor 130 Assembly -->
  <line x1="765" y1="140" x2="765" y2="226.5" stroke="#c0392b" stroke-width="2"/>
  <circle cx="765" cy="140" r="3.5" fill="#c0392b"/>

  <!-- Metal Case Box Outline -->
  <rect x="730" y="185" width="70" height="135" rx="8" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Case connection to vertical wire -->
  <line x1="730" y1="252.5" x2="715" y2="252.5" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Motor Circle M130 -->
  <circle cx="765" cy="252.5" r="26" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="765" y="247" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">M</text>
  <text x="765" y="264" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">130 DC</text>

  <!-- Capacitor C2 (T1 to Metal Case) at y=170 -->
  <line x1="765" y1="170" x2="715" y2="170" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="765" cy="170" r="3" fill="#1a1a1a"/>
  <line x1="736" y1="162" x2="736" y2="178" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="744" y1="162" x2="744" y2="178" stroke="#1a1a1a" stroke-width="2"/>
  <text x="760" y="158" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">C2 (47 nF)</text>

  <!-- Capacitor C3 (T2 to Metal Case) at y=325 -->
  <line x1="765" y1="325" x2="715" y2="325" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="765" cy="325" r="3" fill="#1a1a1a"/>
  <line x1="736" y1="317" x2="736" y2="333" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="744" y1="317" x2="744" y2="333" stroke="#1a1a1a" stroke-width="2"/>
  <text x="710" y="338" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">C3 (47 nF)</text>

  <!-- Connection from Motor Bottom Terminal T2 to Drain Node -->
  <line x1="765" y1="278.5" x2="765" y2="360" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="605" y1="360" x2="835" y2="360" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="605" cy="360" r="3.5" fill="#1a1a1a"/>
  <circle cx="765" cy="360" r="3.5" fill="#1a1a1a"/>

  <!-- Capacitor C1 (100 nF Ceramic - Inter-terminal) -->
  <line x1="835" y1="140" x2="835" y2="241" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="835" cy="140" r="3.5" fill="#c0392b"/>
  <line x1="823" y1="241" x2="847" y2="241" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="823" y1="249" x2="847" y2="249" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="835" y1="249" x2="835" y2="360" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="835" cy="360" r="3.5" fill="#1a1a1a"/>
  <text x="852" y="245" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">C1 (100 nF)</text>
  <text x="852" y="260" text-anchor="start" font-size="12" fill="#6b7280">Між виводами</text>

  <!-- MOSFET Transistor Q1 (Low-side switch) -->
  <!-- Drain Line -->
  <line x1="765" y1="360" x2="765" y2="395" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Channel bar -->
  <line x1="765" y1="395" x2="765" y2="425" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="755" y1="395" x2="765" y2="395" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="755" y1="425" x2="765" y2="425" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Gate bar -->
  <line x1="748" y1="395" x2="748" y2="425" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="560" y1="415" x2="748" y2="415" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Source Line to GND -->
  <line x1="765" y1="425" x2="765" y2="475" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="765" cy="475" r="3.5" fill="#1a1a1a"/>

  <!-- MOSFET Labels -->
  <text x="780" y="410" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">Q1 (N-MOSFET)</text>
  <text x="780" y="425" text-anchor="start" font-size="12" fill="#6b7280">IRLZ44N / AO3400</text>
  <text x="780" y="440" text-anchor="start" font-size="12" fill="#6b7280">Ключ ШІМ</text>

  <!-- Resistors R_G (Gate Series) & R_PD (Pulldown) -->
  <!-- Wire PWM Out from MCU (435, 415) to R_G (525, 415) -->
  <line x1="435" y1="415" x2="525" y2="415" stroke="#1a1a1a" stroke-width="2"/>
  <text x="472.5" y="403" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Сигнал ШІМ</text>

  <!-- Resistor R_G (525..560, y=415) -->
  <rect x="525" y="408" width="35" height="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="542.5" y="398" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">R_G (220 Ω)</text>

  <!-- Resistor R_PD (Pulldown to GND at x=600) -->
  <circle cx="600" cy="415" r="3" fill="#1a1a1a"/>
  <line x1="600" y1="415" x2="600" y2="430" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="593" y="430" width="14" height="25" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="600" y1="455" x2="600" y2="475" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="600" cy="475" r="3" fill="#1a1a1a"/>
  <text x="613" y="448" text-anchor="start" font-size="12" fill="#6b7280">R_PD (10 kΩ)</text>

</svg>
