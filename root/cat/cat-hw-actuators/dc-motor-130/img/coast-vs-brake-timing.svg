<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка полотна -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Режими зупинки DC-двигуна: вибіг (COAST) проти гальмування (BRAKE)</text>
  <text x="480" y="53" font-size="13" text-anchor="middle" fill="#6b7280">Плавне згасання в Hi-Z за рахунок тертя проти різкого зупину вала зустрічним струмом проти-ЕРС</text>

  <!-- Шапки колонок -->
  <rect x="30" y="68" width="435" height="42" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247" y="85" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Режим COAST (вільний вибіг / стан Hi-Z)</text>
  <text x="247" y="101" font-size="12" text-anchor="middle" fill="#6b7280">Ключі розімкнено: обмотка відключена, струм розірвано</text>

  <rect x="495" y="68" width="435" height="42" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="712" y="85" font-size="14" font-weight="bold" text-anchor="middle" fill="#2457d6">Режим BRAKE (динамічне гальмування)</text>
  <text x="712" y="101" font-size="12" text-anchor="middle" fill="#6b7280">Ключі закорочено: замкнений контур для проти-ЕРС</text>

  <!-- ==================== ЛІВА ПАНЕЛЬ: COAST ==================== -->
  <rect x="30" y="124" width="435" height="354" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Вертикальний маркер перемикання t0 -->
  <line x1="165" y1="146" x2="165" y2="440" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Стани ключів (COAST) -->
  <text x="127" y="140" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">Хід (ON)</text>
  <text x="305" y="140" font-size="12" font-weight="bold" text-anchor="middle" fill="#6b7280">COAST: стан Hi-Z (ключі OFF)</text>

  <!-- ТРЕК 1: Напруга на клемах u(t) -->
  <line x1="86" y1="158" x2="90" y2="158" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="86" y1="196" x2="90" y2="196" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="90" y1="158" x2="165" y2="158" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="90" y1="196" x2="445" y2="196" stroke="#d0d7de" stroke-width="1"/>
  <text x="82" y="144" font-size="12" font-weight="bold" text-anchor="end" fill="#2457d6">u(t), В</text>
  <text x="82" y="162" font-size="12" text-anchor="end" fill="#6b7280">+Uном</text>
  <text x="82" y="200" font-size="12" text-anchor="end" fill="#6b7280">0 В</text>
  <path d="M 90,158 L 165,158 L 167,166 C 230,169 310,187 410,196 L 445,196" fill="none" stroke="#2457d6" stroke-width="2.2" stroke-linecap="round"/>
  <text x="210" y="158" font-size="12" fill="#2457d6">u(t) = e(t) (проти-ЕРС вибігу)</text>

  <!-- ТРЕК 2: Струм якоря i(t) -->
  <line x1="86" y1="242" x2="90" y2="242" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="86" y1="267" x2="90" y2="267" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="90" y1="242" x2="165" y2="242" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="90" y1="267" x2="445" y2="267" stroke="#d0d7de" stroke-width="1"/>
  <text x="82" y="226" font-size="12" font-weight="bold" text-anchor="end" fill="#c0392b">i(t), А</text>
  <text x="82" y="246" font-size="12" text-anchor="end" fill="#6b7280">+Iном</text>
  <text x="82" y="271" font-size="12" text-anchor="end" fill="#6b7280">0 А</text>
  <path d="M 90,242 L 165,242 L 165,267 L 445,267" fill="none" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="210" y="255" font-size="12" fill="#6b7280">i = 0 А (струм розірвано, Hi-Z)</text>

  <!-- ТРЕК 3: Кутова швидкість w(t) -->
  <line x1="86" y1="354" x2="90" y2="354" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="86" y1="398" x2="90" y2="398" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="90" y1="354" x2="165" y2="354" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="90" y1="398" x2="445" y2="398" stroke="#d0d7de" stroke-width="1"/>
  <text x="82" y="336" font-size="12" font-weight="bold" text-anchor="end" fill="#27ae60">ω(t), рад/с</text>
  <text x="82" y="358" font-size="12" text-anchor="end" fill="#6b7280">ω₀</text>
  <text x="82" y="402" font-size="12" text-anchor="end" fill="#6b7280">0</text>
  <path d="M 90,354 L 165,354 C 230,356 310,385 410,398 L 445,398" fill="none" stroke="#27ae60" stroke-width="2.2" stroke-linecap="round"/>
  <text x="210" y="345" font-size="12" fill="#27ae60">Вільний вибіг вала за інерцією</text>

  <!-- Тривалість вибігу (COAST) -->
  <line x1="165" y1="418" x2="410" y2="418" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="165" y1="413" x2="165" y2="423" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="410" y1="413" x2="410" y2="423" stroke="#6b7280" stroke-width="1.2"/>
  <text x="287" y="434" font-size="12" text-anchor="middle" fill="#6b7280">t_вибігу ≈ 500–800 мс (довгий зупин)</text>

  <!-- Вісь часу (COAST) -->
  <line x1="90" y1="445" x2="445" y2="445" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="90" y1="445" x2="90" y2="450" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="165" y1="445" x2="165" y2="450" stroke="#1a1a1a" stroke-width="1"/>
  <text x="90" y="462" font-size="12" text-anchor="middle" fill="#6b7280">0</text>
  <text x="165" y="462" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">t₀ (STOP)</text>
  <text x="445" y="462" font-size="12" font-weight="bold" text-anchor="end" fill="#1a1a1a">Час t</text>

  <!-- ==================== ПРАВА ПАНЕЛЬ: BRAKE ==================== -->
  <rect x="495" y="124" width="435" height="354" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Вертикальний маркер перемикання t0 -->
  <line x1="630" y1="146" x2="630" y2="440" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Стани ключів (BRAKE) -->
  <text x="592" y="140" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">Хід (ON)</text>
  <text x="770" y="140" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">BRAKE: ключі закорочено на GND</text>

  <!-- ТРЕК 1: Напруга на клемах u(t) -->
  <line x1="551" y1="158" x2="555" y2="158" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="551" y1="196" x2="555" y2="196" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="555" y1="158" x2="630" y2="158" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="555" y1="196" x2="910" y2="196" stroke="#d0d7de" stroke-width="1"/>
  <text x="547" y="144" font-size="12" font-weight="bold" text-anchor="end" fill="#2457d6">u(t), В</text>
  <text x="547" y="162" font-size="12" text-anchor="end" fill="#6b7280">+Uном</text>
  <text x="547" y="200" font-size="12" text-anchor="end" fill="#6b7280">0 В</text>
  <path d="M 555,158 L 630,158 L 630,196 L 910,196" fill="none" stroke="#2457d6" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="660" y="177" font-size="12" font-weight="bold" fill="#2457d6">u = 0 В (клеми закорочено ключами)</text>

  <!-- ТРЕК 2: Струм якоря i(t) -->
  <line x1="551" y1="242" x2="555" y2="242" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="551" y1="267" x2="555" y2="267" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="551" y1="307" x2="555" y2="307" stroke="#c0392b" stroke-width="1.2"/>
  <line x1="555" y1="242" x2="630" y2="242" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="555" y1="267" x2="910" y2="267" stroke="#d0d7de" stroke-width="1"/>
  <line x1="555" y1="307" x2="634" y2="307" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="547" y="226" font-size="12" font-weight="bold" text-anchor="end" fill="#c0392b">i(t), А</text>
  <text x="547" y="246" font-size="12" text-anchor="end" fill="#6b7280">+Iном</text>
  <text x="547" y="271" font-size="12" text-anchor="end" fill="#6b7280">0 А</text>
  <text x="547" y="311" font-size="12" font-weight="bold" text-anchor="end" fill="#c0392b">-Iгальм</text>
  <path d="M 630,267 L 634,307 C 645,304 670,274 695,267 Z" fill="#fdecea" stroke="none"/>
  <path d="M 555,242 L 630,242 L 634,307 C 645,304 670,274 695,267 L 910,267" fill="none" stroke="#c0392b" stroke-width="2.2" stroke-linecap="round"/>
  <text x="705" y="287" font-size="12" font-weight="bold" fill="#c0392b">Зустрічний струм проти-ЕРС</text>
  <text x="705" y="303" font-size="12" fill="#6b7280">I = -e(t) / R (гальмівний момент)</text>

  <!-- ТРЕК 3: Кутова швидкість w(t) -->
  <line x1="551" y1="354" x2="555" y2="354" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="551" y1="398" x2="555" y2="398" stroke="#6b7280" stroke-width="1.2"/>
  <line x1="555" y1="354" x2="630" y2="354" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="555" y1="398" x2="910" y2="398" stroke="#d0d7de" stroke-width="1"/>
  <text x="547" y="336" font-size="12" font-weight="bold" text-anchor="end" fill="#27ae60">ω(t), рад/с</text>
  <text x="547" y="358" font-size="12" text-anchor="end" fill="#6b7280">ω₀</text>
  <text x="547" y="402" font-size="12" text-anchor="end" fill="#6b7280">0</text>
  <path d="M 555,354 L 630,354 C 640,365 665,395 695,398 L 910,398" fill="none" stroke="#27ae60" stroke-width="2.2" stroke-linecap="round"/>
  <text x="710" y="365" font-size="12" font-weight="bold" fill="#27ae60">Різкий зупин вала</text>
  <text x="710" y="380" font-size="12" fill="#6b7280">динамічне електрогальмування</text>

  <!-- Тривалість гальмування (BRAKE) -->
  <line x1="630" y1="418" x2="695" y2="418" stroke="#2457d6" stroke-width="1.2"/>
  <line x1="630" y1="413" x2="630" y2="423" stroke="#2457d6" stroke-width="1.2"/>
  <line x1="695" y1="413" x2="695" y2="423" stroke="#2457d6" stroke-width="1.2"/>
  <text x="662" y="434" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">t_гальм ≈ 30–50 мс</text>
  <text x="760" y="434" font-size="12" fill="#27ae60">вал надійно зафіксовано</text>

  <!-- Вісь часу (BRAKE) -->
  <line x1="555" y1="445" x2="910" y2="445" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="555" y1="445" x2="555" y2="450" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="630" y1="445" x2="630" y2="450" stroke="#1a1a1a" stroke-width="1"/>
  <text x="555" y="462" font-size="12" text-anchor="middle" fill="#6b7280">0</text>
  <text x="630" y="462" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">t₀ (STOP)</text>
  <text x="910" y="462" font-size="12" font-weight="bold" text-anchor="end" fill="#1a1a1a">Час t</text>

  <!-- Підсумкові картки висновків -->
  <rect x="30" y="494" width="435" height="46" rx="5" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="247" y="513" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">COAST: струм розірвано (I = 0), гальмування лише тертям</text>
  <text x="247" y="529" font-size="12" text-anchor="middle" fill="#6b7280">Ключі розвантажені, але зупинка повільна й неконтрольована</text>

  <rect x="495" y="494" width="435" height="46" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="712" y="512" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">BRAKE: сплеск -I_проти-ЕРС створює зустрічний момент</text>
  <text x="712" y="528" font-size="12" text-anchor="middle" fill="#1a1a1a">Миттєва зупинка вала, кінетична енергія гаситься в теплі</text>
</svg>
