<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow markers -->
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-text" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>

  <!-- Title & Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема 3-конденсаторного фільтра для колекторного двигуна 130</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Конденсатори C₂ і C₃ шунтують ВЧ-завади на металевий корпус, пригнічуючи випромінювання EMI</text>

  <!-- LEFT PANEL: PHYSICAL SOLDERING DIAGRAM -->
  <rect x="30" y="85" width="435" height="405" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="248" y="112" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Фізичне розміщення та розпайка елементів</text>

  <!-- Terminal labels -->
  <text x="175" y="128" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+ M+</text>
  <text x="248" y="128" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">C₁ (100 nF)</text>
  <text x="321" y="128" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">– M–</text>

  <!-- Terminal brass tabs -->
  <rect x="175" y="137" width="26" height="25" rx="3" fill="#d97706" stroke="#92400e" stroke-width="1.5"/>
  <circle cx="188" cy="148" r="4" fill="#f4f6f8"/>
  <rect x="295" y="137" width="26" height="25" rx="3" fill="#d97706" stroke="#92400e" stroke-width="1.5"/>
  <circle cx="308" cy="148" r="4" fill="#f4f6f8"/>

  <!-- Capacitor C1 (across terminals) -->
  <rect x="232" y="137" width="32" height="20" rx="4" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
  <line x1="201" y1="149" x2="232" y2="149" stroke="#475569" stroke-width="2"/>
  <line x1="264" y1="149" x2="295" y2="149" stroke="#475569" stroke-width="2"/>

  <!-- Rear plastic endbell -->
  <rect x="155" y="162" width="186" height="33" rx="6" fill="#334155" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Metal canister body -->
  <rect x="155" y="195" width="186" height="180" rx="10" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
  <rect x="175" y="195" width="35" height="180" fill="#f1f5f9" opacity="0.5"/>

  <!-- Wires from terminals to C2 and C3 -->
  <line x1="188" y1="162" x2="188" y2="215" stroke="#c0392b" stroke-width="2"/>
  <line x1="308" y1="162" x2="308" y2="215" stroke="#2457d6" stroke-width="2"/>

  <!-- Capacitor C2 (left) and C3 (right) -->
  <rect x="175" y="215" width="26" height="20" rx="4" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
  <text x="165" y="229" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">C₂ (10–47 nF)</text>

  <rect x="295" y="215" width="26" height="20" rx="4" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
  <text x="331" y="229" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">C₃ (10–47 nF)</text>

  <!-- Wires from C2, C3 to chassis solder spot -->
  <path d="M188,235 L188,260 L234,260" fill="none" stroke="#475569" stroke-width="2"/>
  <path d="M308,235 L308,260 L262,260" fill="none" stroke="#475569" stroke-width="2"/>

  <!-- Chassis solder spot on metal body -->
  <ellipse cx="248" cy="260" rx="14" ry="10" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>
  <ellipse cx="245" cy="258" rx="8" ry="5" fill="#e2e8f0"/>

  <!-- Chassis Ground Symbol -->
  <line x1="248" y1="270" x2="248" y2="282" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="238" y1="282" x2="258" y2="282" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="241" y1="286" x2="255" y2="286" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="244" y1="290" x2="252" y2="290" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="248" y="310" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Корпус двигуна (GND)</text>

  <!-- Output shaft -->
  <rect x="235" y="375" width="26" height="25" rx="2" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
  <text x="248" y="415" font-size="12" fill="#6b7280" text-anchor="middle">Вал двигуна 130</text>

  <!-- Rule / Recommendation Box -->
  <rect x="45" y="428" width="405" height="50" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="248" y="446" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">✓ Головне правило ВЧ-монтажу</text>
  <text x="248" y="465" font-size="12" fill="#1a1a1a" text-anchor="middle">Виводи C₂ та C₃ мають бути найкоротшими (&lt; 5 мм)</text>


  <!-- RIGHT PANEL: ELECTRICAL EQUIVALENT SCHEMATIC -->
  <rect x="495" y="85" width="435" height="405" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="712" y="112" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Електрична схема та шляхи струмів ВЧ</text>

  <!-- Power Lines -->
  <!-- Top Line (M+) -->
  <line x1="535" y1="170" x2="825" y2="170" stroke="#c0392b" stroke-width="2"/>
  <text x="535" y="158" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">+V (M+)</text>

  <!-- Bottom Line (M-) -->
  <line x1="535" y1="320" x2="825" y2="320" stroke="#2457d6" stroke-width="2"/>
  <text x="535" y="338" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">–V (M–)</text>

  <!-- Chassis Shield Line (Middle) -->
  <line x1="605" y1="245" x2="825" y2="245" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4"/>
  <text x="605" y="233" font-size="12" font-weight="bold" fill="#475569" text-anchor="start">Корпус (GND)</text>

  <!-- C1 (Differential mode capacitor between M+ and M-) -->
  <line x1="590" y1="170" x2="590" y2="237" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="578" y1="237" x2="602" y2="237" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="578" y1="243" x2="602" y2="243" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="590" y1="243" x2="590" y2="320" stroke="#1a1a1a" stroke-width="2"/>
  <text x="574" y="236" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">C₁</text>
  <text x="574" y="252" font-size="12" fill="#6b7280" text-anchor="end">100 nF</text>

  <!-- C2 (Common mode capacitor M+ to Chassis) -->
  <line x1="690" y1="170" x2="690" y2="202" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="678" y1="202" x2="702" y2="202" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="678" y1="208" x2="702" y2="208" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="690" y1="208" x2="690" y2="245" stroke="#1a1a1a" stroke-width="2"/>
  <text x="708" y="202" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">C₂</text>
  <text x="708" y="218" font-size="12" fill="#6b7280" text-anchor="start">47 nF</text>

  <!-- C3 (Common mode capacitor M- to Chassis) -->
  <line x1="690" y1="245" x2="690" y2="277" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="678" y1="277" x2="702" y2="277" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="678" y1="283" x2="702" y2="283" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="690" y1="283" x2="690" y2="320" stroke="#1a1a1a" stroke-width="2"/>
  <text x="708" y="277" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">C₃</text>
  <text x="708" y="293" font-size="12" fill="#6b7280" text-anchor="start">47 nF</text>

  <!-- Motor Armature & Commutator -->
  <line x1="825" y1="170" x2="825" y2="211" stroke="#c0392b" stroke-width="2"/>
  <line x1="825" y1="279" x2="825" y2="320" stroke="#2457d6" stroke-width="2"/>
  <rect x="817" y="211" width="16" height="6" fill="#334155"/>
  <rect x="817" y="273" width="16" height="6" fill="#334155"/>
  <circle cx="825" cy="245" r="28" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="825" y="251" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">M</text>

  <!-- Spark icon and text -->
  <path d="M843,207 L849,212 L843,217 L849,222" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="854" y="218" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">Іскра</text>

  <!-- HF Noise Loop Label and Arrows -->
  <text x="730" y="148" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Шлях ВЧ-струму i_EMI</text>
  <path d="M815,162 Q690,142 690,165" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>

  <!-- Summary Badges in Right Panel -->
  <rect x="510" y="355" width="405" height="36" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="712" y="377" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">✓ ВЧ-завади замкнені в короткому контурі двигуна</text>

  <rect x="510" y="401" width="405" height="77" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="522" y="420" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">C₁ (диференціальний):</text>
  <text x="668" y="420" font-size="12" fill="#1a1a1a" text-anchor="start">шунтує завади між M+ і M–</text>
  <text x="522" y="442" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">C₂, C₃ (синфазні):</text>
  <text x="648" y="442" font-size="12" fill="#1a1a1a" text-anchor="start">скидають ВЧ-струми на корпус</text>
  <text x="522" y="464" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="start">Результат:</text>
  <text x="595" y="464" font-size="12" fill="#1a1a1a" text-anchor="start">захист мікроконтролера від зависань</text>
</svg>
