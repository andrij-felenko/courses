<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow markers -->
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема захисту та фільтрації колекторного двигуна 130</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Керамічні конденсатори гасять ВЧ-іскріння, зворотний діод зрізає ЕРС, LC-фільтр захищає живлення</text>

  <!-- Main Circuit Panel -->
  <rect x="30" y="68" width="900" height="372" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Main Power Rails -->
  <!-- VCC Rail (+V_M) -->
  <path d="M 70 120 L 190 120" stroke="#2457d6" stroke-width="2.5"/>
  <path d="M 250 120 L 720 120" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="70" cy="120" r="4" fill="#2457d6"/>
  <text x="50" y="96" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Вхід живлення +V_M</text>

  <!-- GND Rail -->
  <path d="M 70 400 L 890 400" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="70" cy="400" r="4" fill="#1a1a1a"/>
  <text x="50" y="424" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="start">Спільна земля (GND)</text>

  <!-- Component 1: Inductor L_f -->
  <path d="M 190 120 A 7.5 7.5 0 0 1 205 120 A 7.5 7.5 0 0 1 220 120 A 7.5 7.5 0 0 1 235 120 A 7.5 7.5 0 0 1 250 120" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <text x="220" y="96" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">L_f (10–100 µH)</text>

  <!-- Component 2: Power Filter Capacitor C_f -->
  <path d="M 300 120 L 300 210" stroke="#2457d6" stroke-width="2"/>
  <path d="M 288 210 L 312 210" stroke="#2457d6" stroke-width="2.5"/>
  <path d="M 288 222 L 312 222" stroke="#2457d6" stroke-width="2.5"/>
  <path d="M 300 222 L 300 400" stroke="#2457d6" stroke-width="2"/>
  <circle cx="300" cy="120" r="3" fill="#2457d6"/>
  <circle cx="300" cy="400" r="3" fill="#1a1a1a"/>
  <text x="318" y="204" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">C_f (100 µF)</text>
  <text x="318" y="222" font-size="12" fill="#6b7280" text-anchor="start">+ 0.1 µF ВЧ</text>
  <text x="318" y="240" font-size="12" fill="#6b7280" text-anchor="start">Фільтр живлення</text>

  <!-- Component 3: Low-Side MOSFET Q1 Switch & Gate Control -->
  <!-- PWM Control Input -->
  <path d="M 140 340 L 330 340" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="210" y="324" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ШІМ керування</text>

  <!-- Gate Resistor R_g -->
  <rect x="330" y="334" width="28" height="12" rx="2" ry="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 358 340 L 382 340" stroke="#1a1a1a" stroke-width="2"/>
  <text x="344" y="362" font-size="12" fill="#6b7280" text-anchor="middle">R_g = 100 Ω</text>

  <!-- MOSFET Box & Symbol -->
  <rect x="382" y="315" width="36" height="50" rx="4" ry="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Drain connection -->
  <path d="M 400 280 L 400 315" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Source connection -->
  <path d="M 400 365 L 400 400" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="400" cy="400" r="3" fill="#1a1a1a"/>
  <!-- Gate, Drain, Source internal indicators -->
  <path d="M 390 325 L 390 355" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 395 325 L 395 333 M 395 336 L 395 344 M 395 347 L 395 355" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 395 329 L 400 329 M 395 351 L 400 351" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- MOSFET Q1 Labels -->
  <text x="430" y="336" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Q1 (MOSFET)</text>
  <text x="430" y="354" font-size="12" fill="#6b7280" text-anchor="start">Силовий ключ</text>

  <!-- Drain line continuation to Motor M- -->
  <path d="M 400 280 L 720 280" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- Component 4: Flyback Diode D1 -->
  <!-- Wire from VCC (y=120) to Drain (y=280) -->
  <path d="M 520 120 L 520 185" stroke="#c0392b" stroke-width="2"/>
  <path d="M 520 215 L 520 280" stroke="#c0392b" stroke-width="2"/>
  <circle cx="520" cy="120" r="3" fill="#2457d6"/>
  <circle cx="520" cy="280" r="3" fill="#1a1a1a"/>

  <!-- Diode Symbol (Cathode bar at top y=185, Triangle pointing UP) -->
  <path d="M 508 185 L 532 185" stroke="#c0392b" stroke-width="2.5"/>
  <path d="M 520 185 L 508 215 L 532 215 Z" fill="#c0392b" stroke="#c0392b"/>

  <!-- Flyback Diode D1 Labels -->
  <text x="540" y="190" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">D1 (Зворотний діод)</text>
  <text x="540" y="208" font-size="12" fill="#c0392b" text-anchor="start">Гасить ЕРС самоіндукції</text>
  <text x="540" y="226" font-size="12" fill="#6b7280" text-anchor="start">(1N4007 / Schottky)</text>

  <!-- Flyback Current Loop Path (Dashed Red Loop) -->
  <path d="M 710 270 Q 520 270 520 230" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4,3" marker-end="url(#arr-red)"/>
  <path d="M 520 170 Q 520 130 710 130" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4,3"/>

  <!-- Component 5: Differential EMI Capacitor C1 -->
  <!-- Wire from M+ (y=120) to M- (y=280) -->
  <path d="M 670 120 L 670 185" stroke="#27ae60" stroke-width="2"/>
  <path d="M 658 185 L 682 185" stroke="#27ae60" stroke-width="2.5"/>
  <path d="M 658 197 L 682 197" stroke="#27ae60" stroke-width="2.5"/>
  <path d="M 670 197 L 670 280" stroke="#27ae60" stroke-width="2"/>
  <circle cx="670" cy="120" r="3" fill="#2457d6"/>
  <circle cx="670" cy="280" r="3" fill="#1a1a1a"/>

  <!-- C1 Labels (Below M- line) -->
  <text x="670" y="308" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">C₁ (10–100 nF)</text>
  <text x="670" y="326" font-size="12" fill="#6b7280" text-anchor="middle">Диф. ВЧ-фільтр</text>

  <!-- Component 6: Motor 130 Assembly Box -->
  <rect x="720" y="90" width="200" height="290" rx="8" ry="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="5,4"/>

  <!-- Motor Box Headers -->
  <text x="820" y="114" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Двигун 130</text>
  <text x="820" y="132" font-size="12" fill="#6b7280" text-anchor="middle">(Металевий корпус)</text>

  <!-- M+ Wire entering Motor Box to Rotor -->
  <path d="M 720 120 L 750 120 M 750 120 L 750 204 M 750 204 L 765 204" stroke="#2457d6" stroke-width="2"/>
  <text x="730" y="112" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">M+</text>

  <!-- M- Wire entering Motor Box to Rotor -->
  <path d="M 720 280 L 750 280 M 750 280 L 750 256 M 750 256 L 765 256" stroke="#1a1a1a" stroke-width="2"/>
  <text x="730" y="296" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">M-</text>

  <!-- Motor Rotor Circle -->
  <circle cx="770" cy="230" r="24" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <!-- Brushes -->
  <rect x="765" y="202" width="10" height="4" fill="#1a1a1a"/>
  <rect x="765" y="254" width="10" height="4" fill="#1a1a1a"/>
  <text x="770" y="236" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">M</text>

  <!-- Common-Mode Filtering Capacitors C2 and C3 to Case Ground -->
  <!-- Metal Case Ground Bar inside Motor Box -->
  <path d="M 870 160 L 870 300" stroke="#6b7280" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- Capacitor C2 (M+ branch to Case) -->
  <path d="M 750 160 L 810 160" stroke="#27ae60" stroke-width="2"/>
  <path d="M 810 151 L 810 169" stroke="#27ae60" stroke-width="2.5"/>
  <path d="M 822 151 L 822 169" stroke="#27ae60" stroke-width="2.5"/>
  <path d="M 822 160 L 870 160" stroke="#27ae60" stroke-width="2"/>
  <circle cx="750" cy="160" r="3" fill="#2457d6"/>
  <text x="816" y="142" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">C₂ (10–47 nF)</text>

  <!-- Capacitor C3 (M- branch to Case) -->
  <path d="M 750 300 L 810 300" stroke="#27ae60" stroke-width="2"/>
  <path d="M 810 291 L 810 309" stroke="#27ae60" stroke-width="2.5"/>
  <path d="M 822 291 L 822 309" stroke="#27ae60" stroke-width="2.5"/>
  <path d="M 822 300 L 870 300" stroke="#27ae60" stroke-width="2"/>
  <circle cx="750" cy="300" r="3" fill="#1a1a1a"/>
  <text x="816" y="326" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">C₃ (10–47 nF)</text>

  <!-- Metal Case Ground Output Wire to Main GND -->
  <path d="M 870 270 L 890 270 M 890 270 L 890 400" stroke="#6b7280" stroke-width="2"/>
  <circle cx="890" cy="400" r="3" fill="#1a1a1a"/>
  <text x="825" y="276" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Корпус (GND)</text>

  <!-- Bottom 3 Summary Mechanism Cards -->
  <!-- Card 1: LC Decoupling Filter -->
  <rect x="30" y="455" width="285" height="85" rx="6" ry="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="45" y="476" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="start">1. LC-фільтр живлення</text>
  <text x="45" y="496" font-size="12" fill="#1a1a1a" text-anchor="start">• L_f блокує високочастотні завади</text>
  <text x="45" y="514" font-size="12" fill="#1a1a1a" text-anchor="start">• C_f згладжує просідання напруги</text>

  <!-- Card 2: Flyback Protection Diode D1 -->
  <rect x="337" y="455" width="285" height="85" rx="6" ry="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="352" y="476" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="start">2. Зворотний діод D1</text>
  <text x="352" y="496" font-size="12" fill="#1a1a1a" text-anchor="start">• Гасить сплески ЕРС самоіндукції</text>
  <text x="352" y="514" font-size="12" fill="#1a1a1a" text-anchor="start">• Захищає MOSFET від пробою (V = L·di/dt)</text>

  <!-- Card 3: EMI Spark Filtering (C1, C2, C3) -->
  <rect x="645" y="455" width="285" height="85" rx="6" ry="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="660" y="476" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="start">3. ВЧ-фільтри C₁, C₂, C₃</text>
  <text x="660" y="496" font-size="12" fill="#1a1a1a" text-anchor="start">• C₁ шунтує диф. завади між клемами</text>
  <text x="660" y="514" font-size="12" fill="#1a1a1a" text-anchor="start">• C₂, C₃ скидають завади на корпус</text>
</svg>
