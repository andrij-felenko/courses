<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background canvas -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Markers -->
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-start-green" markerWidth="9" markerHeight="9" refX="1" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-end-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма перемикання H-мосту та захисний інтервал (Dead Time)</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Пауза t_dead між вимкненням одного ключа та увімкненням протилежного запобігає наскрізному струму</text>

  <!-- Main Container Panel -->
  <rect x="30" y="70" width="900" height="450" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>

  <!-- Dead Time Vertical Shading Zones -->
  <!-- Zone 1 (t1 .. t2) -->
  <rect x="370" y="85" width="100" height="255" fill="#e9f7ef" fill-opacity="0.8" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,4"/>
  <!-- Zone 2 (t3 .. t4) -->
  <rect x="630" y="85" width="100" height="255" fill="#e9f7ef" fill-opacity="0.8" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Phase Header Titles -->
  <text x="290" y="80" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Прямий хід</text>
  <text x="290" y="94" font-size="11" fill="#6b7280" text-anchor="middle">Q1=1, Q4=1</text>

  <text x="420" y="80" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Пауза t_dead</text>
  <text x="420" y="94" font-size="11" fill="#27ae60" text-anchor="middle">Q1..Q4 = 0</text>

  <text x="550" y="80" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Реверсний хід</text>
  <text x="550" y="94" font-size="11" fill="#6b7280" text-anchor="middle">Q2=1, Q3=1</text>

  <text x="680" y="80" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Пауза t_dead</text>
  <text x="680" y="94" font-size="11" fill="#27ae60" text-anchor="middle">Q1..Q4 = 0</text>

  <text x="810" y="80" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Прямий хід</text>
  <text x="810" y="94" font-size="11" fill="#6b7280" text-anchor="middle">Q1=1, Q4=1</text>

  <!-- Horizontal Grid / Baselines -->
  <!-- Trace 1 baselines -->
  <line x1="210" y1="108" x2="890" y2="108" stroke="#d0d7de" stroke-dasharray="2,2"/>
  <line x1="210" y1="135" x2="890" y2="135" stroke="#d0d7de" stroke-dasharray="2,2"/>

  <!-- Trace 2 baselines -->
  <line x1="210" y1="168" x2="890" y2="168" stroke="#d0d7de" stroke-dasharray="2,2"/>
  <line x1="210" y1="195" x2="890" y2="195" stroke="#d0d7de" stroke-dasharray="2,2"/>

  <!-- Trace 3 baselines -->
  <line x1="210" y1="228" x2="890" y2="228" stroke="#d0d7de" stroke-dasharray="2,2"/>
  <line x1="210" y1="255" x2="890" y2="255" stroke="#d0d7de" stroke-dasharray="2,2"/>

  <!-- Trace 4 baselines -->
  <line x1="210" y1="288" x2="890" y2="288" stroke="#d0d7de" stroke-dasharray="2,2"/>
  <line x1="210" y1="315" x2="890" y2="315" stroke="#d0d7de" stroke-dasharray="2,2"/>

  <!-- Signal Label Cards (Left side) -->
  <rect x="45" y="100" width="145" height="42" fill="white" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="55" y="117" font-size="13" font-weight="bold" fill="#1a1a1a">Q1 (High Side A)</text>
  <text x="55" y="133" font-size="11" fill="#6b7280">Верхній лівий ключ</text>

  <rect x="45" y="160" width="145" height="42" fill="white" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="55" y="177" font-size="13" font-weight="bold" fill="#1a1a1a">Q2 (Low Side A)</text>
  <text x="55" y="193" font-size="11" fill="#6b7280">Нижній лівий ключ</text>

  <rect x="45" y="220" width="145" height="42" fill="white" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="55" y="237" font-size="13" font-weight="bold" fill="#1a1a1a">Q3 (High Side B)</text>
  <text x="55" y="253" font-size="11" fill="#6b7280">Верхній правий ключ</text>

  <rect x="45" y="280" width="145" height="42" fill="white" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="55" y="297" font-size="13" font-weight="bold" fill="#1a1a1a">Q4 (Low Side B)</text>
  <text x="55" y="313" font-size="11" fill="#6b7280">Нижній правий ключ</text>

  <!-- Waveform Traces -->
  <!-- Trace 1 (Q1) -->
  <path d="M 210,108 L 370,108 L 370,135 L 730,135 L 730,108 L 890,108" fill="none" stroke="#2457d6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Trace 2 (Q2) -->
  <path d="M 210,195 L 470,195 L 470,168 L 630,168 L 630,195 L 890,195" fill="none" stroke="#2457d6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Trace 3 (Q3) -->
  <path d="M 210,255 L 470,255 L 470,228 L 630,228 L 630,255 L 890,255" fill="none" stroke="#2457d6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Trace 4 (Q4) -->
  <path d="M 210,288 L 370,288 L 370,315 L 730,315 L 730,288 L 890,288" fill="none" stroke="#2457d6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Dead Time Dimension Lines & Labels -->
  <line x1="370" y1="340" x2="470" y2="340" stroke="#27ae60" stroke-width="1.5" marker-start="url(#arr-start-green)" marker-end="url(#arr-end-green)"/>
  <text x="420" y="362" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">t_dead</text>

  <line x1="630" y1="340" x2="730" y2="340" stroke="#27ae60" stroke-width="1.5" marker-start="url(#arr-start-green)" marker-end="url(#arr-end-green)"/>
  <text x="680" y="362" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">t_dead</text>

  <!-- Time Axis -->
  <line x1="195" y1="380" x2="905" y2="380" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <text x="912" y="384" font-size="13" font-weight="bold" fill="#1a1a1a">t</text>

  <!-- Vertical Ticks and Tick Labels -->
  <line x1="210" y1="376" x2="210" y2="384" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="210" y="398" font-size="11" fill="#6b7280" text-anchor="middle">t0</text>

  <line x1="370" y1="376" x2="370" y2="384" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="370" y="398" font-size="11" fill="#6b7280" text-anchor="middle">t1</text>

  <line x1="470" y1="376" x2="470" y2="384" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="470" y="398" font-size="11" fill="#6b7280" text-anchor="middle">t2</text>

  <line x1="630" y1="376" x2="630" y2="384" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="630" y="398" font-size="11" fill="#6b7280" text-anchor="middle">t3</text>

  <line x1="730" y1="376" x2="730" y2="384" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="730" y="398" font-size="11" fill="#6b7280" text-anchor="middle">t4</text>

  <line x1="890" y1="376" x2="890" y2="384" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="890" y="398" font-size="11" fill="#6b7280" text-anchor="middle">t5</text>

  <!-- Explanatory Callout Cards at Bottom -->
  <!-- Card 1: Safe Dead Time -->
  <rect x="45" y="415" width="415" height="90" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="6"/>
  <text x="60" y="437" font-size="13" font-weight="bold" fill="#27ae60">✓ Захисний інтервал (Dead Time):</text>
  <text x="60" y="458" font-size="12" fill="#1a1a1a">• Пауза гарантує повне закриття ключів (з урахуванням t_off)</text>
  <text x="60" y="476" font-size="12" fill="#1a1a1a">• Струм мотора замкнений через протиіндукційні діоди</text>
  <text x="60" y="494" font-size="12" fill="#1a1a1a">• Керується апаратно таймером МК (Advanced Timers)</text>

  <!-- Card 2: Shoot-through Risk -->
  <rect x="475" y="415" width="445" height="90" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="6"/>
  <text x="490" y="437" font-size="13" font-weight="bold" fill="#c0392b">⚠ Ризик без Dead Time (t_dead = 0):</text>
  <text x="490" y="458" font-size="12" fill="#1a1a1a">• Наскрізний струм (Shoot-Through): одночасне відкриття Q1 і Q2</text>
  <text x="490" y="476" font-size="12" fill="#1a1a1a">• Коротке замикання шини живлення VCC на землю GND</text>
  <text x="490" y="494" font-size="12" fill="#1a1a1a">• Перегрів та миттєвий вихід з ладу силових транзисторів</text>
</svg>
