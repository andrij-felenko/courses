<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кінематична схема прямозубого редуктора TT з мотором 130</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Ступеневе сповільнення швидкості (48:1), помноження моменту та критичні зони навантаження зубців</text>

  <!-- ВЕРХНЯ ПАНЕЛЬ: КІНЕМАТИЧНА СХЕМА ТА КОРПУС TT -->
  <rect x="20" y="70" width="920" height="216" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Назва панелі -->
  <text x="36" y="92" font-size="12" font-weight="bold" fill="#6b7280">НАПІВПРОЗОРИЙ КОРПУС ТА КАСКАД ШЕСТЕРЕНЬ TT</text>

  <!-- Бейджі передавальних чисел ступенів -->
  <rect x="420" y="78" width="104" height="20" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="472" y="92" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Ступінь 1 (u₁ = 3:1)</text>

  <rect x="536" y="78" width="104" height="20" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="588" y="92" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Ступінь 2 (u₂ = 4:1)</text>

  <rect x="652" y="78" width="104" height="20" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="704" y="92" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Ступінь 3 (u₃ = 4:1)</text>

  <rect x="768" y="78" width="156" height="20" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="846" y="92" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Разом: i = 48:1 (η ≈ 65%)</text>

  <!-- МОТОР 130 (Скошений статор, клеми, втулка) -->
  <line x1="28" y1="124" x2="36" y2="124" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="28" y1="148" x2="36" y2="148" stroke="#1a1a1a" stroke-width="2.5"/>
  <path d="M 44,112 L 92,112 L 100,120 L 100,152 L 92,160 L 44,160 L 36,152 L 36,120 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="68" y="132" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">МОТОР 130</text>
  <text x="68" y="148" font-size="12" fill="#6b7280" text-anchor="middle">3–6 В DC</text>

  <!-- Передня втулка вала мотора -->
  <rect x="100" y="130" width="8" height="12" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>

  <!-- ВАЛ 0 (Вал ротора, y = 136) -->
  <line x1="108" y1="136" x2="206" y2="136" stroke="#1a1a1a" stroke-width="3"/>
  <path d="M 148,130 A 7 7 0 1 1 160,134" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="154" y="122" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">CW ↻</text>
  <text x="154" y="152" font-size="12" fill="#6b7280" text-anchor="middle">Вал якоря</text>

  <!-- Триб z1 (піньйон на валу якоря, 9 зубців) -->
  <rect x="206" y="126" width="44" height="20" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="228" y="140" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">z₁ = 9</text>
  <text x="228" y="118" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Триб</text>

  <!-- Точка зачеплення 1 -->
  <circle cx="228" cy="146" r="2.5" fill="#2457d6"/>

  <!-- ВАЛ 1 (Перший проміжний вал, y = 174) -->
  <line x1="250" y1="174" x2="416" y2="174" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Опори (підшипники) Вала 1 -->
  <rect x="256" y="168" width="8" height="12" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
  <!-- Колесо z2 (27 зубів) -->
  <rect x="206" y="146" width="44" height="56" rx="2" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="228" y="178" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">z₂ = 27</text>
  <!-- Обертання Вала 1 -->
  <path d="M 334,168 A 7 7 0 1 1 322,172" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="328" y="160" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">CCW ↺</text>
  <text x="328" y="190" font-size="12" fill="#6b7280" text-anchor="middle">Вал 1 (проміжний)</text>
  <!-- Піньйон z3 (9 зубців) -->
  <rect x="416" y="164" width="44" height="20" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="438" y="178" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">z₃ = 9</text>

  <!-- Точка зачеплення 2 -->
  <circle cx="438" cy="184" r="2.5" fill="#2457d6"/>

  <!-- ВАЛ 2 (Другий проміжний вал, y = 214) -->
  <line x1="460" y1="214" x2="626" y2="214" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Опора Вала 2 -->
  <rect x="466" y="208" width="8" height="12" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
  <!-- Колесо z4 (36 зубів) -->
  <rect x="416" y="184" width="44" height="60" rx="2" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="438" y="218" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">z₄ = 36</text>
  <!-- Обертання Вала 2 -->
  <path d="M 538,208 A 7 7 0 1 1 550,212" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="544" y="200" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">CW ↻</text>
  <text x="544" y="230" font-size="12" fill="#6b7280" text-anchor="middle">Вал 2 (проміжний)</text>
  <!-- Піньйон z5 (9 зубців, напружений) -->
  <rect x="626" y="204" width="44" height="20" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="648" y="218" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">z₅ = 9</text>

  <!-- Точка зачеплення 3 -->
  <circle cx="648" cy="224" r="3" fill="#c0392b"/>

  <!-- ВАЛ 3 (Вихідний вал, y = 252) -->
  <line x1="670" y1="252" x2="800" y2="252" stroke="#1a1a1a" stroke-width="4"/>
  <!-- Колесо z6 (36 зубів, зона максимального моменту) -->
  <rect x="626" y="224" width="44" height="56" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="648" y="256" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">z₆ = 36</text>
  <!-- Обертання Вала 3 -->
  <path d="M 742,246 A 7 7 0 1 1 730,250" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="736" y="238" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">CCW ↺</text>
  <text x="736" y="268" font-size="12" fill="#6b7280" text-anchor="middle">Вал 3 (вихідний)</text>

  <!-- КРИТИЧНА ЗОНА НАВАНТАЖЕННЯ: Картка-застереження над парою z5-z6 -->
  <rect x="520" y="114" width="254" height="42" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="647" y="131" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">КРИТИЧНА ЗОНА НАВАНТАЖЕННЯ</text>
  <text x="647" y="147" font-size="12" fill="#c0392b" text-anchor="middle">F_t = max: ризик зрізу зубців при блокуванні</text>
  <line x1="648" y1="156" x2="648" y2="200" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arr-red)"/>

  <!-- ВИХІДНИЙ ДВОСТОРОННІЙ ВАЛ (D-вал під колеса) -->
  <rect x="806" y="126" width="118" height="146" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="865" y="146" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">ВИХІДНИЙ ВАЛ</text>
  <text x="865" y="162" font-size="12" fill="#1a1a1a" text-anchor="middle">Двосторонній</text>

  <!-- D-вал вертикальний силует -->
  <rect x="857" y="174" width="16" height="48" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="857" y1="184" x2="873" y2="184" stroke="#6b7280" stroke-width="1"/>
  <line x1="857" y1="212" x2="873" y2="212" stroke="#6b7280" stroke-width="1"/>
  <text x="865" y="242" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Лиски D-профілю</text>
  <text x="865" y="258" font-size="12" fill="#6b7280" text-anchor="middle">під 2 колеса робота</text>

  <!-- НИЖНЯ ПАНЕЛЬ: 4 КАРТКИ ПОЕТАПНОЇ КІНЕМАТИКИ ТА СИЛИ -->

  <!-- Картка 0: Мотор 130 -->
  <rect x="20" y="298" width="218" height="140" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="129" y="320" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">ВХІД: МОТОР 130</text>
  <text x="32" y="340" font-size="12" fill="#1a1a1a">Швидкість:</text>
  <text x="226" y="340" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">12 000 об/хв</text>
  <rect x="32" y="347" width="194" height="6" rx="3" fill="#eaf0fd"/>
  <rect x="32" y="347" width="194" height="6" rx="3" fill="#2457d6"/>
  <text x="32" y="372" font-size="12" fill="#1a1a1a">Момент:</text>
  <text x="226" y="372" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">1,0 мН·м (10 г·см)</text>
  <rect x="32" y="379" width="194" height="6" rx="3" fill="#e9f7ef"/>
  <rect x="32" y="379" width="6" height="6" rx="3" fill="#27ae60"/>
  <text x="32" y="404" font-size="12" fill="#1a1a1a">Сила F_t:</text>
  <text x="226" y="404" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">мінімальна (тертя)</text>
  <text x="129" y="424" font-size="12" fill="#6b7280" text-anchor="middle">Вал ⌀2 мм · триб z₁ = 9</text>

  <!-- Стрілка 0 -> 1 -->
  <line x1="242" y1="368" x2="250" y2="368" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Картка 1: Проміжний вал 1 -->
  <rect x="254" y="298" width="218" height="140" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="363" y="320" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">СТУПІНЬ 1 (u₁ = 3:1)</text>
  <text x="266" y="340" font-size="12" fill="#1a1a1a">Швидкість:</text>
  <text x="460" y="340" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">4 000 об/хв</text>
  <rect x="266" y="347" width="194" height="6" rx="3" fill="#eaf0fd"/>
  <rect x="266" y="347" width="65" height="6" rx="3" fill="#2457d6"/>
  <text x="266" y="372" font-size="12" fill="#1a1a1a">Момент:</text>
  <text x="460" y="372" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">~2,6 мН·м (×2,6)</text>
  <rect x="266" y="379" width="194" height="6" rx="3" fill="#e9f7ef"/>
  <rect x="266" y="379" width="16" height="6" rx="3" fill="#27ae60"/>
  <text x="266" y="404" font-size="12" fill="#1a1a1a">Сила F_t:</text>
  <text x="460" y="404" font-size="12" fill="#6b7280" text-anchor="end">помірна (F_t ~3×)</text>
  <text x="363" y="424" font-size="12" fill="#6b7280" text-anchor="middle">Колесо z₂ = 27 · триб z₃ = 9</text>

  <!-- Стрілка 1 -> 2 -->
  <line x1="476" y1="368" x2="484" y2="368" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Картка 2: Проміжний вал 2 -->
  <rect x="488" y="298" width="218" height="140" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="597" y="320" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">СТУПІНЬ 2 (u₂ = 4:1)</text>
  <text x="500" y="340" font-size="12" fill="#1a1a1a">Швидкість:</text>
  <text x="694" y="340" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">1 000 об/хв</text>
  <rect x="500" y="347" width="194" height="6" rx="3" fill="#eaf0fd"/>
  <rect x="500" y="347" width="16" height="6" rx="3" fill="#2457d6"/>
  <text x="500" y="372" font-size="12" fill="#1a1a1a">Момент:</text>
  <text x="694" y="372" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">~9,2 мН·м (×9,2)</text>
  <rect x="500" y="379" width="194" height="6" rx="3" fill="#e9f7ef"/>
  <rect x="500" y="379" width="58" height="6" rx="3" fill="#27ae60"/>
  <text x="500" y="404" font-size="12" fill="#1a1a1a">Сила F_t:</text>
  <text x="694" y="404" font-size="12" fill="#6b7280" text-anchor="end">висока (F_t ~9×)</text>
  <text x="597" y="424" font-size="12" fill="#6b7280" text-anchor="middle">Колесо z₄ = 36 · триб z₅ = 9</text>

  <!-- Стрілка 2 -> 3 -->
  <line x1="710" y1="368" x2="718" y2="368" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Картка 3: Вихідний вал -->
  <rect x="722" y="298" width="218" height="140" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="831" y="320" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">ВИХІД: РЕДУКТОР TT</text>
  <text x="734" y="340" font-size="12" fill="#1a1a1a">Швидкість:</text>
  <text x="928" y="340" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">250 об/хв</text>
  <rect x="734" y="347" width="194" height="6" rx="3" fill="#eaf0fd"/>
  <rect x="734" y="347" width="5" height="6" rx="3" fill="#2457d6"/>
  <text x="734" y="372" font-size="12" fill="#1a1a1a">Момент:</text>
  <text x="928" y="372" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">31 мН·м (×31, η=65%)</text>
  <rect x="734" y="379" width="194" height="6" rx="3" fill="#e9f7ef"/>
  <rect x="734" y="379" width="194" height="6" rx="3" fill="#27ae60"/>
  <text x="734" y="404" font-size="12" fill="#1a1a1a">Сила F_t:</text>
  <text x="928" y="404" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">ПІК F_max (зріз!)</text>
  <text x="831" y="424" font-size="12" fill="#6b7280" text-anchor="middle">Колесо z₆ = 36 · тяга F ≈ 0,94 Н</text>
</svg>
