<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>
  <!-- Заголовок і підзаголовок -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розподіл сил і тяговий баланс колісного шасі на похилій площині</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Сумарна тяга коліс k·F_тяг має перевершувати суму сил опору: скочування m·g·sin(α), опору коченню F_roll та розгону m·a</text>
  <!-- Картка 1: Рушійна тяга -->
  <rect x="596" y="72" width="340" height="106" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="614" y="94" font-size="13" font-weight="bold" fill="#27ae60">Рушійна тяга колісного рушія</text>
  <text x="614" y="116" font-size="12" fill="#1a1a1a">Корисна тяга колеса: <tspan font-weight="bold" fill="#27ae60">F_тяг = M_out / R</tspan></text>
  <text x="614" y="138" font-size="12" fill="#1a1a1a">Сумарна тяга шасі: <tspan font-weight="bold" fill="#27ae60">F_тяг_сум = k · F_тяг</tspan></text>
  <text x="614" y="158" font-size="12" fill="#6b7280">k — к-ть ведучих коліс, R — радіус, M_out — момент вала</text>
  <!-- Картка 2: Гальмівне навантаження -->
  <rect x="596" y="190" width="340" height="126" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="614" y="212" font-size="13" font-weight="bold" fill="#c0392b">Гальмівні навантаження на схилі</text>
  <text x="614" y="234" font-size="12" fill="#1a1a1a">Скочувальна сила: <tspan font-weight="bold" fill="#c0392b">F_slope = m · g · sin(α)</tspan></text>
  <text x="614" y="254" font-size="12" fill="#1a1a1a">Опір коченню шин: <tspan font-weight="bold" fill="#c0392b">F_roll = f_roll · m·g·cos(α)</tspan></text>
  <text x="614" y="274" font-size="12" fill="#1a1a1a">Інерція прискорення: <tspan font-weight="bold" fill="#c0392b">F_acc = m · a</tspan></text>
  <text x="614" y="296" font-size="12" fill="#6b7280">f_roll — коеф. тертя кочення, a — лінійне прискорення</text>
  <!-- Картка 3: Силовий баланс та момент -->
  <rect x="596" y="328" width="340" height="112" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="614" y="350" font-size="13" font-weight="bold" fill="#2457d6">Умова підйому та момент редуктора</text>
  <text x="614" y="372" font-size="12" font-weight="bold" fill="#1a1a1a">k · F_тяг ≥ m·g·sin(α) + F_roll + m·a</text>
  <text x="614" y="394" font-size="12" fill="#1a1a1a">Мінімальний момент: <tspan font-weight="bold" fill="#2457d6">M_out_min = F_опір · R / k</tspan></text>
  <text x="614" y="416" font-size="12" fill="#6b7280">При M_out &lt; M_min привід звалюється в заклинювання</text>
  <!-- Панель схеми -->
  <rect x="24" y="72" width="556" height="368" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="302" y="96" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Векторна діаграма сил на колісному шасі</text>
  <!-- Основа та клин похилої площини -->
  <line x1="44" y1="396" x2="556" y2="396" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="60,396 511.8,249.2 511.8,396" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="60" y1="396" x2="511.8" y2="249.2" stroke="#334155" stroke-width="2.5"/>
  <path d="M 125,396 A 65 65 0 0 0 121.8,375.9" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="136" y="390" font-size="14" fill="#1a1a1a">α</text>
  <!-- Колеса -->
  <circle cx="194.6" cy="324.9" r="26" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="194.6" cy="324.9" r="14" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="194.6" cy="324.9" r="3.5" fill="#1a1a1a"/>
  <circle cx="346.8" cy="275.5" r="26" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="346.8" cy="275.5" r="14" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="346.8" cy="275.5" r="3.5" fill="#1a1a1a"/>
  <!-- Корпус платформи -->
  <polygon points="164.2,328.5 373.5,260.5 364.2,232.0 155.0,300.0" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <!-- Центр мас і сили тяжіння -->
  <circle cx="264.2" cy="280.2" r="4.5" fill="#1a1a1a"/>
  <text x="272.2" y="272.2" font-size="12" font-weight="bold" fill="#1a1a1a">C (m)</text>
  <line x1="264.2" y1="280.2" x2="264.2" y2="380.2" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="272.2" y="384.2" font-size="13" font-weight="bold" fill="#1a1a1a">m·g</text>
  <line x1="264.2" y1="280.2" x2="293.6" y2="370.7" stroke="#6b7280" stroke-width="2" marker-end="url(#arr-gray)"/>
  <text x="303.6" y="372.7" font-size="12" fill="#6b7280">m·g·cos(α)</text>
  <line x1="264.2" y1="280.2" x2="234.8" y2="289.8" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="185.0" y="298.0" font-size="12" font-weight="bold" fill="#c0392b">m·g·sin(α)</text>
  <line x1="293.6" y1="370.7" x2="264.2" y2="380.2" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="234.8" y1="289.8" x2="264.2" y2="380.2" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="258.7" y1="263.1" x2="214.9" y2="277.3" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="134.9" y="271.3" font-size="12" font-weight="bold" fill="#c0392b">F_acc = m·a</text>
  <line x1="264.2" y1="280.2" x2="244.1" y2="218.4" stroke="#6b7280" stroke-width="1.8" marker-end="url(#arr-gray)"/>
  <text x="145.0" y="206.0" font-size="12" fill="#6b7280">N = m·g·cos(α)</text>
  <line x1="262.6" y1="242.9" x2="319.7" y2="224.4" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="265.0" y="212.0" font-size="12" font-weight="bold" fill="#2457d6">Рух і прискорення a</text>
  <!-- Сили на колесі та в контактній плямі -->
  <line x1="194.6" y1="324.9" x2="202.7" y2="349.6" stroke="#2457d6" stroke-width="1.8"/>
  <text x="204.6" y="340.9" font-size="13" font-weight="bold" fill="#2457d6">R</text>
  <path d="M 182.4,335.2 A 16 16 0 0 1 208.5,316.9" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="175.0" y="308.0" font-size="13" font-weight="bold" fill="#2457d6">M_out</text>
  <line x1="202.7" y1="349.6" x2="250.2" y2="334.2" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="206.7" y="369.6" font-size="13" font-weight="bold" fill="#27ae60">k·F_тяг</text>
  <line x1="202.7" y1="349.6" x2="159.9" y2="363.6" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="117.9" y="383.6" font-size="12" font-weight="bold" fill="#c0392b">F_roll</text>
</svg>
