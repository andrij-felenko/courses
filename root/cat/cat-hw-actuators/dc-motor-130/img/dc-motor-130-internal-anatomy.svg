<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-alert" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-success" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-bronze" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Внутрішня будова та електромеханічні вузли двигуна типорозміру 130</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Сталевий корпус зі скошеними гранями 15 мм, ферити статора, триполюсний якір і вузол комутації</text>

  <!-- ЛІВА ПАНЕЛЬ: Поперечний розріз -->
  <rect x="30" y="68" width="370" height="366" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="215" y="92" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Поперечний розріз (геометрія 130)</text>
  <text x="215" y="109" font-size="12" fill="#6b7280" text-anchor="middle">Скошені грані 15 мм, дугові магніти й три полюси (120°)</text>

  <!-- Розмірна лінія 15 мм -->
  <line x1="168" y1="185" x2="168" y2="137" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="262" y1="185" x2="262" y2="137" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="168" y1="140" x2="262" y2="140" stroke="#1a1a1a" stroke-width="1.2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="215" y="133" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">грані 15 мм</text>

  <!-- Зовнішній сталевий корпус 130 -->
  <path d="M 168 190.1 A 63 63 0 0 1 215 169 A 63 63 0 0 1 262 190.1 L 262 273.9 A 63 63 0 0 1 215 295 A 63 63 0 0 1 168 273.9 Z" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.8"/>
  <!-- Внутрішня порожнина статора -->
  <path d="M 173 192 A 58 58 0 0 1 215 174 A 58 58 0 0 1 257 192 L 257 272 A 58 58 0 0 1 215 290 A 58 58 0 0 1 173 272 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>

  <!-- Верхній магніт статора (полюс N) -->
  <path d="M 174 193 A 58 58 0 0 1 215 174 A 58 58 0 0 1 256 193 L 246 201 A 44 44 0 0 0 215 188 A 44 44 0 0 0 184 201 Z" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Нижній магніт статора (полюс S) -->
  <path d="M 174 271 A 58 58 0 0 0 215 290 A 58 58 0 0 0 256 271 L 246 263 A 44 44 0 0 1 215 276 A 44 44 0 0 1 184 263 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Ротор: шихтоване осердя 3 полюси (120°) -->
  <circle cx="215" cy="232" r="14" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>

  <!-- Полюс 1 (вгору) -->
  <path d="M 210 202 L 220 202 L 220 226 L 210 226 Z" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
  <path d="M 203 206 L 227 206 L 227 220 L 203 220 Z" fill="#fed7aa" stroke="#d97706" stroke-width="1.2"/>
  <path d="M 200 203 A 40 40 0 0 1 230 203 L 227 206 A 37 37 0 0 0 203 206 Z" fill="#94a3b8" stroke="#475569" stroke-width="1"/>

  <!-- Полюс 2 (вниз-вправо, 30 град) -->
  <path d="M 222 239 L 246 253 L 240 259 L 217 243 Z" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
  <polygon points="228,238 245,248 238,258 221,248" fill="#fed7aa" stroke="#d97706" stroke-width="1.2"/>
  <path d="M 243 246 A 40 40 0 0 1 254 263 L 250 264 A 37 37 0 0 0 240 248 Z" fill="#94a3b8" stroke="#475569" stroke-width="1"/>

  <!-- Полюс 3 (вниз-вліво, 150 град) -->
  <path d="M 208 239 L 184 253 L 190 259 L 213 243 Z" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
  <polygon points="202,238 185,248 192,258 209,248" fill="#fed7aa" stroke="#d97706" stroke-width="1.2"/>
  <path d="M 187 246 A 40 40 0 0 0 176 263 L 180 264 A 37 37 0 0 1 190 248 Z" fill="#94a3b8" stroke="#475569" stroke-width="1"/>

  <!-- Вал ротора в центрі -->
  <circle cx="215" cy="232" r="6" fill="#e2e8f0" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Підписи лівої панелі -->
  <text x="44" y="156" font-size="12" font-weight="bold" fill="#1a1a1a">Сталевий корпус</text>
  <text x="44" y="170" font-size="12" fill="#6b7280">(магнітопровід)</text>
  <line x1="140" y1="162" x2="168" y2="205" stroke="#6b7280" stroke-width="1" marker-end="url(#arr)"/>

  <text x="44" y="196" font-size="12" font-weight="bold" fill="#c0392b">Ферит статора (N)</text>
  <text x="44" y="210" font-size="12" fill="#6b7280">дуговий магніт</text>
  <line x1="145" y1="200" x2="180" y2="195" stroke="#c0392b" stroke-width="1" marker-end="url(#arr-alert)"/>

  <text x="44" y="306" font-size="12" font-weight="bold" fill="#1a1a1a">Якір (ротор)</text>
  <text x="44" y="320" font-size="12" fill="#6b7280">3 полюси (120°)</text>
  <line x1="124" y1="312" x2="182" y2="256" stroke="#6b7280" stroke-width="1" marker-end="url(#arr)"/>

  <text x="44" y="344" font-size="12" font-weight="bold" fill="#d97706">Мідні котушки</text>
  <text x="44" y="358" font-size="12" fill="#6b7280">обмотка полюсів</text>

  <text x="286" y="224" font-size="12" font-weight="bold" fill="#1a1a1a">Вал ротора</text>
  <text x="286" y="238" font-size="12" fill="#2457d6">⌀2.0 мм сталь</text>
  <line x1="283" y1="230" x2="225" y2="232" stroke="#2457d6" stroke-width="1.2" marker-end="url(#arr-accent)"/>

  <text x="286" y="274" font-size="12" font-weight="bold" fill="#2457d6">Ферит статора (S)</text>
  <text x="286" y="288" font-size="12" fill="#6b7280">дуговий магніт</text>
  <line x1="283" y1="278" x2="250" y2="274" stroke="#2457d6" stroke-width="1" marker-end="url(#arr-accent)"/>

  <!-- Бейдж внизу лівої панелі -->
  <rect x="42" y="370" width="346" height="54" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="52" y="390" font-size="12" font-weight="bold" fill="#1a1a1a">Особливості форми 130:</text>
  <text x="52" y="405" font-size="12" fill="#6b7280">· Плоскі грані 15 мм фіксують мотор у гнізді</text>
  <text x="52" y="419" font-size="12" fill="#6b7280">· 3 полюси усувають мертві точки пуску</text>

  <!-- ПРАВА ПАНЕЛЬ: Поздовжній розріз -->
  <rect x="415" y="68" width="515" height="366" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="672" y="92" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Поздовжній осьовий розріз мотора 130</text>
  <text x="672" y="109" font-size="12" fill="#6b7280" text-anchor="middle">Шлях струму: клеми → бронзові щітки → ламелі → обмотки</text>

  <!-- Сталевий вал ⌀2 мм -->
  <path d="M 472 228 L 885 228 L 885 236 L 472 236 Z" fill="#e2e8f0" stroke="#334155" stroke-width="1.2"/>
  <text x="840" y="212" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вихідний вал</text>
  <text x="840" y="225" font-size="12" fill="#2457d6" text-anchor="middle">⌀2.0 мм</text>

  <!-- Передній фланець корпусу зі сталі -->
  <rect x="755" y="169" width="20" height="126" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="775" y="216" width="25" height="32" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Передня втулка ковзання -->
  <rect x="777" y="222" width="20" height="20" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="787" y="325" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">Втулка ковзання</text>
  <text x="787" y="339" font-size="12" fill="#6b7280" text-anchor="middle">бронза, ⌀2 мм</text>
  <line x1="787" y1="313" x2="787" y2="246" stroke="#b45309" stroke-width="1" marker-end="url(#arr-bronze)"/>

  <!-- Сталевий корпус (гільза) -->
  <rect x="505" y="169" width="250" height="6" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.2"/>
  <rect x="505" y="289" width="250" height="6" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="680" y="138" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Сталевий корпус (магнітопровід)</text>

  <!-- Феритові магніти статора -->
  <rect x="580" y="175" width="150" height="22" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="655" y="190" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Магніт статора (N)</text>

  <rect x="580" y="267" width="150" height="22" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="655" y="282" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Магніт статора (S)</text>

  <!-- Якір: осердя й обмотки -->
  <rect x="585" y="203" width="140" height="58" rx="2" fill="#ffedd5" stroke="#ea580c" stroke-width="1.5"/>
  <text x="655" y="221" font-size="12" font-weight="bold" fill="#ea580c" text-anchor="middle">Обмотка ротора</text>
  <text x="655" y="252" font-size="12" fill="#1a1a1a" text-anchor="middle">шихтоване осердя</text>

  <!-- Задня пластикова кришка -->
  <rect x="465" y="169" width="40" height="126" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <rect x="465" y="216" width="25" height="32" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>

  <!-- Задня втулка ковзання -->
  <rect x="467" y="222" width="20" height="20" fill="#fde68a" stroke="#b45309" stroke-width="1.5"/>
  <text x="477" y="325" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">Втулка ковзання</text>
  <text x="477" y="339" font-size="12" fill="#6b7280" text-anchor="middle">бронза, ⌀2 мм</text>
  <line x1="477" y1="313" x2="477" y2="246" stroke="#b45309" stroke-width="1" marker-end="url(#arr-bronze)"/>

  <text x="478" y="145" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Задня кришка</text>
  <text x="478" y="159" font-size="12" fill="#6b7280" text-anchor="middle">(пластик)</text>

  <!-- Клеми живлення -->
  <rect x="428" y="196" width="37" height="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="422" y="203" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">Клема (+)</text>

  <rect x="428" y="260" width="37" height="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <text x="422" y="267" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">Клема (−)</text>

  <!-- Колектор -->
  <path d="M 528 219 L 554 219 L 554 245 L 528 245 Z" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
  <rect x="528" y="219" width="26" height="4" fill="#d97706" stroke="#b45309" stroke-width="1"/>
  <rect x="528" y="241" width="26" height="4" fill="#d97706" stroke="#b45309" stroke-width="1"/>
  <text x="541" y="155" font-size="12" font-weight="bold" fill="#d97706" text-anchor="middle">Колектор</text>
  <text x="541" y="169" font-size="12" fill="#6b7280" text-anchor="middle">3 ламелі</text>

  <!-- Провідники від ламелей до ротора -->
  <line x1="554" y1="221" x2="585" y2="221" stroke="#ea580c" stroke-width="2"/>
  <line x1="554" y1="243" x2="585" y2="243" stroke="#ea580c" stroke-width="2"/>

  <!-- Бронзові щітки (пружні пелюстки) -->
  <line x1="465" y1="200" x2="534" y2="219" stroke="#b45309" stroke-width="2.5"/>
  <line x1="465" y1="264" x2="534" y2="245" stroke="#b45309" stroke-width="2.5"/>
  <text x="500" y="188" font-size="12" font-weight="bold" fill="#b45309">Бронзові щітки</text>

  <!-- Струм комутації (стрілки) -->
  <line x1="432" y1="200" x2="456" y2="200" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <line x1="475" y1="203" x2="508" y2="212" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <line x1="556" y1="221" x2="580" y2="221" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <line x1="580" y1="243" x2="556" y2="243" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <line x1="508" y1="252" x2="475" y2="261" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <line x1="456" y1="264" x2="432" y2="264" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>

  <!-- Бейдж внизу правої панелі -->
  <rect x="430" y="370" width="485" height="54" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="442" y="390" font-size="12" font-weight="bold" fill="#1a1a1a">Механічна комутація та струм:</text>
  <text x="442" y="405" font-size="12" fill="#6b7280">Струм від клем через пружні бронзові пелюстки потрапляє на ламелі колектора.</text>
  <text x="442" y="419" font-size="12" fill="#6b7280">При обертанні ротора ламелі чергуються, циклічно перемикаючи якірні котушки.</text>

  <!-- НИЖНЯ ПАНЕЛЬ: Шлях струму -->
  <rect x="30" y="448" width="900" height="88" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="466" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Послідовність комутації: шлях проходження струму крізь вузли мотора 130</text>

  <!-- Блок 1 -->
  <rect x="45" y="474" width="154" height="50" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="122" y="493" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">1. Клеми на кришці</text>
  <text x="122" y="510" font-size="12" fill="#6b7280" text-anchor="middle">Підведення напруги</text>
  <line x1="199" y1="499" x2="220" y2="499" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arr-accent)"/>

  <!-- Блок 2 -->
  <rect x="224" y="474" width="154" height="50" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="301" y="493" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">2. Бронзові щітки</text>
  <text x="301" y="510" font-size="12" fill="#6b7280" text-anchor="middle">Пружний ковзний контакт</text>
  <line x1="378" y1="499" x2="399" y2="499" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arr-accent)"/>

  <!-- Блок 3 -->
  <rect x="403" y="474" width="154" height="50" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="493" font-size="12" font-weight="bold" fill="#d97706" text-anchor="middle">3. Мідний колектор</text>
  <text x="480" y="510" font-size="12" fill="#6b7280" text-anchor="middle">3 ламелі, крок 60°</text>
  <line x1="557" y1="499" x2="578" y2="499" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arr-accent)"/>

  <!-- Блок 4 -->
  <rect x="582" y="474" width="154" height="50" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="659" y="493" font-size="12" font-weight="bold" fill="#ea580c" text-anchor="middle">4. Обмотки якоря</text>
  <text x="659" y="510" font-size="12" fill="#6b7280" text-anchor="middle">Струм створює B_ротора</text>
  <line x1="736" y1="499" x2="757" y2="499" stroke="#27ae60" stroke-width="1.8" marker-end="url(#arr-success)"/>

  <!-- Блок 5 -->
  <rect x="761" y="474" width="154" height="50" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="838" y="493" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">5. Сила Лоренца F</text>
  <text x="838" y="510" font-size="12" fill="#1a1a1a" text-anchor="middle">Крутний момент вала</text>

</svg>
