<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 530" width="960" height="530" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<rect x="0" y="0" width="960" height="530" fill="white"/>

<defs>
  <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
  </marker>
</defs>

<!-- Заголовок і підзаголовок -->
<text x="480" y="34" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Динаміка нестаціонарного нагріву обмотки двигуна типорозміру 130</text>
<text x="480" y="56" font-size="13" text-anchor="middle" fill="#6b7280">Аварійне блокування ротора спричиняє адіабатичний стрибок до руйнування вузлів за одиниці секунд</text>

<!-- Графік T(t): область X: 80..560, Y: 85..450 -->

<!-- Фонова небезпечна зона T >= 135 °C -->
<rect x="80" y="95" width="480" height="65" fill="#fdecea" opacity="0.45"/>

<!-- Фонова зона ризику щіткотримача 75...135 °C -->
<rect x="80" y="160" width="480" height="152" fill="#fff7e6" opacity="0.35"/>

<!-- Фонова зона тривалої безпечної роботи T < 75 °C -->
<rect x="80" y="312" width="480" height="138" fill="#e9f7ef" opacity="0.30"/>

<!-- Лінія порогу деградації ізоляції (130-150 °C) -->
<line x1="80" y1="160" x2="560" y2="160" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="552" y="152" font-size="12" font-weight="bold" text-anchor="end" fill="#c0392b">T_ізол = 130–150 °C: деградація лаку, міжвиткове КЗ</text>

<!-- Лінія порогу розм'якшення кришки та щіткотримача (70-80 °C) -->
<line x1="80" y1="312" x2="560" y2="312" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6,4"/>
<text x="552" y="304" font-size="12" font-weight="bold" text-anchor="end" fill="#c0392b">T_крит = 70–80 °C: деформація кришки зі щіткотримачем</text>

<!-- Пунктир t_crit до точки аварії (142, 312) -->
<line x1="142" y1="312" x2="142" y2="450" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
<circle cx="142" cy="312" r="4" fill="#c0392b"/>
<text x="150" y="328" font-size="12" font-weight="bold" fill="#c0392b">t_крит = 2.6 с</text>

<!-- Пунктир t при досягненні 140 °C (236, 160) -->
<line x1="236" y1="160" x2="236" y2="450" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
<circle cx="236" cy="160" r="4" fill="#c0392b"/>
<text x="244" y="176" font-size="12" font-weight="bold" fill="#c0392b">t ≈ 6.5 с</text>

<!-- Крива 1: Аварійне блокування ротора I_stall -->
<path d="M 80 438 C 95 365, 120 316, 175 220 S 236 160, 270 98" stroke="#c0392b" stroke-width="3" fill="none"/>
<text x="280" y="112" font-size="12" font-weight="bold" fill="#c0392b">Аварійне блокування (I_stall)</text>
<text x="280" y="126" font-size="12" fill="#c0392b">e = 0, струм блокування, P ≈ 15 Вт</text>

<!-- Дотична лінія: Адіабатичний стрибок dT/dt = const -->
<line x1="80" y1="438" x2="185" y2="215" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
<text x="195" y="240" font-size="12" font-weight="bold" fill="#6b7280">Адіабатичний стрибок</text>
<text x="195" y="254" font-size="12" fill="#6b7280">dT/dt = P_stall / C_th ≈ 19 К/с</text>

<!-- Крива 2: Номінальне навантаження I_nom -->
<path d="M 80 438 Q 160 388, 240 373 T 400 368 T 560 368" stroke="#27ae60" stroke-width="2.5" fill="none"/>
<text x="250" y="360" font-size="12" font-weight="bold" fill="#27ae60">Номінальне навантаження (I_ном)</text>
<text x="250" y="375" font-size="12" fill="#27ae60">Теплова рівновага ≈ 52 °C (безпечний нагрів)</text>

<!-- Крива 3: Робота з ШІМ (D = 50%) -->
<path d="M 80 438 Q 150 412, 230 406 T 390 404 T 560 404" stroke="#2457d6" stroke-width="2" fill="none"/>
<text x="270" y="420" font-size="12" font-weight="bold" fill="#2457d6">ШІМ 50% (D = 0.5): рівновага ≈ 38 °C</text>

<!-- Зелена смужка інтервалу захисту t_вимк ≤ 1.5 с -->
<rect x="80" y="445" width="36" height="5" fill="#27ae60"/>

<!-- Осі координат -->
<line x1="80" y1="450" x2="80" y2="82" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
<line x1="80" y1="450" x2="570" y2="450" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

<!-- Підпис осі Y -->
<text x="75" y="75" font-size="13" font-weight="bold" text-anchor="end" fill="#1a1a1a">T, °C</text>

<!-- Засічки осі Y -->
<line x1="75" y1="438" x2="80" y2="438" stroke="#1a1a1a" stroke-width="1"/>
<text x="72" y="442" font-size="12" text-anchor="end" fill="#6b7280">25°</text>

<line x1="75" y1="368" x2="80" y2="368" stroke="#1a1a1a" stroke-width="1"/>
<text x="72" y="372" font-size="12" text-anchor="end" fill="#6b7280">52°</text>

<line x1="73" y1="312" x2="80" y2="312" stroke="#c0392b" stroke-width="1.5"/>
<text x="72" y="316" font-size="12" font-weight="bold" text-anchor="end" fill="#c0392b">75°</text>

<line x1="75" y1="250" x2="80" y2="250" stroke="#1a1a1a" stroke-width="1"/>
<text x="72" y="254" font-size="12" text-anchor="end" fill="#6b7280">100°</text>

<line x1="73" y1="160" x2="80" y2="160" stroke="#c0392b" stroke-width="1.5"/>
<text x="72" y="164" font-size="12" font-weight="bold" text-anchor="end" fill="#c0392b">140°</text>

<line x1="75" y1="100" x2="80" y2="100" stroke="#1a1a1a" stroke-width="1"/>
<text x="72" y="104" font-size="12" text-anchor="end" fill="#6b7280">165°</text>

<!-- Засічки осі X -->
<line x1="80" y1="450" x2="80" y2="455" stroke="#1a1a1a" stroke-width="1"/>
<text x="80" y="468" font-size="12" text-anchor="middle" fill="#6b7280">0</text>

<!-- Позначка t_вимк -->
<line x1="116" y1="450" x2="116" y2="456" stroke="#27ae60" stroke-width="1.5"/>
<text x="116" y="468" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">1.5 с</text>

<!-- Позначка t_крит на другому рівні Y -->
<line x1="142" y1="450" x2="142" y2="460" stroke="#c0392b" stroke-width="1.5"/>
<text x="142" y="482" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">2.6 с</text>

<!-- Регулярні позначки часу -->
<line x1="200" y1="450" x2="200" y2="455" stroke="#1a1a1a" stroke-width="1"/>
<text x="200" y="468" font-size="12" text-anchor="middle" fill="#6b7280">5</text>

<line x1="320" y1="450" x2="320" y2="455" stroke="#1a1a1a" stroke-width="1"/>
<text x="320" y="468" font-size="12" text-anchor="middle" fill="#6b7280">10</text>

<line x1="440" y1="450" x2="440" y2="455" stroke="#1a1a1a" stroke-width="1"/>
<text x="440" y="468" font-size="12" text-anchor="middle" fill="#6b7280">15</text>

<line x1="560" y1="450" x2="560" y2="455" stroke="#1a1a1a" stroke-width="1"/>
<text x="560" y="468" font-size="12" text-anchor="middle" fill="#6b7280">20</text>

<!-- Підпис осі X -->
<text x="350" y="504" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Час перехідного процесу t, с</text>


<!-- Права область: Інформаційні панелі (X: 590..935, ширина 345) -->

<!-- Панель 1: Фізика перехідного нагріву -->
<rect x="590" y="85" width="345" height="195" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
<text x="605" y="108" font-size="14" font-weight="bold" fill="#2457d6">Тепловий баланс двигуна 130</text>

<text x="605" y="132" font-size="12" font-weight="bold" fill="#1a1a1a">• Джоулеві втрати в міді обмотки:</text>
<text x="617" y="148" font-size="12" fill="#1a1a1a">P = I² · R(T),   R(T) = R₀ · (1 + α_Cu · ΔT)</text>

<text x="605" y="172" font-size="12" font-weight="bold" fill="#1a1a1a">• Диференціальне рівняння балансу:</text>
<text x="617" y="188" font-size="12" fill="#2457d6">C_th · (dT/dt) + (T − T_amb) / R_th = P</text>

<text x="605" y="212" font-size="12" font-weight="bold" fill="#1a1a1a">• Адіабатичний стрибок блокування:</text>
<text x="617" y="228" font-size="12" fill="#c0392b">dT/dt = P_stall / C_th ≈ 15 Вт / 0.8 Дж/К ≈ 19 К/с</text>
<text x="617" y="244" font-size="12" fill="#6b7280">(на перших секундах тепловідвід нульовий)</text>

<text x="605" y="266" font-size="12" fill="#6b7280">Стала часу корпусу: τ_th = C_th · R_th ≈ 40–60 с</text>

<!-- Панель 2: Пороги деградації та безпечний захист -->
<rect x="590" y="295" width="345" height="210" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
<text x="605" y="318" font-size="14" font-weight="bold" fill="#c0392b">Критичні пороги та безпечний захист</text>

<text x="605" y="342" font-size="12" font-weight="bold" fill="#c0392b">1. Оплавлення щіткотримача (70–80 °C):</text>
<text x="617" y="358" font-size="12" fill="#1a1a1a">Термопластик задньої кришки деформується за:</text>
<text x="617" y="374" font-size="12" font-weight="bold" fill="#c0392b">t_крит = (T_крит − T_amb) · C_th / P_stall ≈ 2.6 с</text>

<text x="605" y="398" font-size="12" font-weight="bold" fill="#c0392b">2. Деградація лакової ізоляції (130–150 °C):</text>
<text x="617" y="414" font-size="12" fill="#1a1a1a">Міжвитковий пробій котушок за 6–8 с блокування</text>

<text x="605" y="438" font-size="12" font-weight="bold" fill="#27ae60">3. Безпечний захист привода (t_вимк):</text>
<text x="617" y="454" font-size="12" fill="#1a1a1a">Програмний таймаут драйвера двигуна:</text>
<text x="617" y="470" font-size="12" font-weight="bold" fill="#27ae60">t_вимк = 1.0–1.5 с &lt; t_крит  (вимкнення H-моста)</text>
<text x="617" y="488" font-size="12" fill="#6b7280">Гарантує знеструмлення до перегріву понад 55 °C</text>

</svg>
