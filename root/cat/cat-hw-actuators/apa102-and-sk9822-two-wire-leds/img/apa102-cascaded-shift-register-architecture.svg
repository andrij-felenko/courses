<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
    <defs>
        <marker id="arr" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
            <polygon points="0,0 6,2 0,4" fill="#1a1a1a"/>
        </marker>
        <marker id="arr-blue" markerWidth="6" markerHeight="4" refX="5" refY="2" orient="auto">
            <polygon points="0,0 6,2 0,4" fill="#2457d6"/>
        </marker>
    </defs>
    <rect x="0" y="0" width="960" height="460" fill="white"/>
    
    <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема каскадного з'єднання світлодіодів APA102/SK9822</text>
    <text x="480" y="65" font-size="13" fill="#6b7280" text-anchor="middle">Передача сигналів через внутрішні зсувні регістри від чипа до чипа</text>
    
    <!-- MCU -->
    <rect x="30" y="150" width="100" height="180" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
    <text x="80" y="180" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">MCU</text>
    
    <text x="120" y="235" font-size="12" fill="#1a1a1a" text-anchor="end">SDO</text>
    <line x1="130" y1="240" x2="170" y2="240" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
    
    <text x="120" y="275" font-size="12" fill="#1a1a1a" text-anchor="end">CKO</text>
    <line x1="130" y1="280" x2="170" y2="280" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
    
    <!-- LED 1 -->
    <rect x="170" y="150" width="230" height="180" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
    <text x="285" y="175" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">LED 1 (APA102)</text>
    
    <rect x="210" y="200" width="150" height="50" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <text x="285" y="230" font-size="12" fill="#1a1a1a" text-anchor="middle">Зсувний регістр 32-біт</text>
    
    <text x="175" y="235" font-size="12" fill="#1a1a1a">SDI</text>
    <text x="395" y="235" font-size="12" fill="#1a1a1a" text-anchor="end">SDO</text>
    
    <text x="175" y="275" font-size="12" fill="#1a1a1a">CKI</text>
    <text x="395" y="275" font-size="12" fill="#1a1a1a" text-anchor="end">CKO</text>
    
    <!-- Connection LED1 to LED2 -->
    <line x1="400" y1="240" x2="440" y2="240" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
    <line x1="400" y1="280" x2="440" y2="280" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
    
    <!-- LED 2 -->
    <rect x="440" y="150" width="230" height="180" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
    <text x="555" y="175" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">LED 2 (APA102)</text>
    
    <rect x="480" y="200" width="150" height="50" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <text x="555" y="230" font-size="12" fill="#1a1a1a" text-anchor="middle">Зсувний регістр 32-біт</text>
    
    <text x="445" y="235" font-size="12" fill="#1a1a1a">SDI</text>
    <text x="665" y="235" font-size="12" fill="#1a1a1a" text-anchor="end">SDO</text>
    
    <text x="445" y="275" font-size="12" fill="#1a1a1a">CKI</text>
    <text x="665" y="275" font-size="12" fill="#1a1a1a" text-anchor="end">CKO</text>
    
    <!-- Connection LED2 to LED n -->
    <line x1="670" y1="240" x2="730" y2="240" stroke="#2457d6" stroke-width="2" stroke-dasharray="4" marker-end="url(#arr-blue)"/>
    <line x1="670" y1="280" x2="730" y2="280" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="4" marker-end="url(#arr)"/>
    
    <!-- LED n -->
    <rect x="730" y="150" width="200" height="180" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
    <text x="830" y="175" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">LED N</text>
    
    <rect x="770" y="200" width="120" height="50" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <text x="830" y="230" font-size="12" fill="#1a1a1a" text-anchor="middle">Регістр 32-біт</text>
    
    <text x="735" y="235" font-size="12" fill="#1a1a1a">SDI</text>
    <text x="735" y="275" font-size="12" fill="#1a1a1a">CKI</text>
    
    <!-- Explanation Text -->
    <rect x="50" y="370" width="860" height="60" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
    <text x="480" y="395" font-size="13" fill="#1a1a1a" text-anchor="middle">Дані заповнюють регістр першого чипа, після чого наступні тактові імпульси</text>
    <text x="480" y="415" font-size="13" fill="#1a1a1a" text-anchor="middle">виштовхують попередні біти до наступного світлодіода у каскаді (SDO -> SDI).</text>
</svg>