<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 500" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="1080" height="500" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="540.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">ККД множиться, а не додається: кожен ступінь бере свою частку моменту</text>
<line x1="150.0" y1="390.0" x2="970.0" y2="390.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="150.0" y1="390.0" x2="150.0" y2="100.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<text x="970.0" y="418.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="end" font-weight="700">після скількох ступенів (пар шестерень)</text>
<text x="54.0" y="110.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="54.0" dy="0.0">частка</tspan><tspan x="54.0" dy="14.3">ідеального</tspan><tspan x="54.0" dy="14.3">моменту</tspan></text>
<line x1="150.0" y1="123.2" x2="970.0" y2="123.2" stroke="#d1d5db" stroke-width="1.0" stroke-dasharray="4,4"/>
<text x="970.0" y="115.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="end">100 % — ідеал (ККД = 1, без тертя)</text>
<rect x="268.8" y="149.9" width="104.0" height="240.1" rx="4" fill="#eef3fb" stroke="#27ae60" stroke-width="2.0"/>
<text x="320.8" y="139.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#27ae60" text-anchor="middle" font-weight="700">90 %</text>
<text x="320.8" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">1 ступ.</text>
<text x="320.8" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">0.90</text>
<rect x="441.6" y="173.9" width="104.0" height="216.1" rx="4" fill="#eef3fb" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="493.6" y="163.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">81 %</text>
<text x="493.6" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">2 ступ.</text>
<text x="493.6" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">0.90²</text>
<rect x="614.4" y="195.5" width="104.0" height="194.5" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="666.4" y="185.5" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">73 %</text>
<text x="666.4" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">3 ступ.</text>
<text x="666.4" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">0.90³</text>
<rect x="787.2" y="215.0" width="104.0" height="175.0" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/>
<text x="839.2" y="205.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#c0392b" text-anchor="middle" font-weight="700">66 %</text>
<text x="839.2" y="412.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">4 ступ.</text>
<text x="839.2" y="430.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">0.90⁴</text>
<line x1="150.0" y1="450.0" x2="970.0" y2="450.0" stroke="#e5e7eb" stroke-width="1.0"/>
<text x="540.0" y="474.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">3 ступені по 90 %  →  0.90³ ≈ 0.73:  до виходу доходить лише ~73 % ідеального моменту</text>
<text x="540.0" y="494.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle">дорожчий, точніший редуктор тримає більший ККД на ступінь — тому й дорожчий</text>
</svg>