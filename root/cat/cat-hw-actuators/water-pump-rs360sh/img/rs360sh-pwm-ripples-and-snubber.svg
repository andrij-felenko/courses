<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Схема заміщення обмотки RS-360SH та часові діаграми ШІМ-пульсацій</text>
  <text x="480" y="50" font-size="13" text-anchor="middle" fill="#6b7280">Частота ШІМ визначає пульсації струму ΔI, а діод і RC-демпфер обмежують викиди напруги -L(di/dt)</text>

  <!-- TOP LEFT PANEL: Equivalent Circuit -->
  <rect x="20" y="70" width="570" height="215" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="35" y="92" font-size="13" font-weight="700" fill="#1a1a1a">Еквівалентна схема заміщення двигуна RS-360SH із ключем та захистом</text>

  <!-- Power Rail +12V -->
  <line x1="40" y1="115" x2="560" y2="115" stroke="#c0392b" stroke-width="2"/>
  <text x="45" y="106" font-size="12" font-weight="700" fill="#c0392b">+12V DC</text>

  <!-- Decoupling Cap C_dec -->
  <line x1="75" y1="115" x2="75" y2="173" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="65" y1="173" x2="85" y2="173" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="65" y1="181" x2="85" y2="181" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="75" y1="181" x2="75" y2="255" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="90" y="181" font-size="12" fill="#1a1a1a">C_dec 470µF</text>

  <!-- Current Arrow i_L -->
  <line x1="105" y1="115" x2="135" y2="115" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="120" y="106" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">i_L(t)</text>

  <!-- Motor Armature Equivalent Branch (Ra + La + Ebemf) -->
  <rect x="145" y="125" width="145" height="55" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="217" y="195" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">Двигун RS-360SH</text>

  <line x1="135" y1="115" x2="155" y2="115" stroke="#2457d6" stroke-width="2"/>
  <line x1="155" y1="115" x2="155" y2="151" stroke="#2457d6" stroke-width="2"/>

  <!-- Resistor Ra -->
  <rect x="162" y="144" width="22" height="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="173" y="138" font-size="12" text-anchor="middle" fill="#1a1a1a">R_a</text>
  <line x1="155" y1="151" x2="162" y2="151" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="184" y1="151" x2="195" y2="151" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Inductor La -->
  <path d="M195,151 Q200,141 205,151 Q210,141 215,151 Q220,141 225,151 Q230,141 235,151" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="215" y="138" font-size="12" text-anchor="middle" fill="#1a1a1a">L_a</text>
  <line x1="235" y1="151" x2="248" y2="151" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Back-EMF Source Ebemf -->
  <circle cx="258" cy="151" r="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="258" y="155" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">E</text>
  <text x="258" y="138" font-size="12" text-anchor="middle" fill="#1a1a1a">E_bemf</text>
  <line x1="268" y1="151" x2="280" y2="151" stroke="#1a1a1a" stroke-width="1.5"/>

  <line x1="280" y1="151" x2="320" y2="151" stroke="#2457d6" stroke-width="2"/>
  <line x1="320" y1="151" x2="320" y2="200" stroke="#2457d6" stroke-width="2"/>

  <!-- Flyback Diode D1 Branch -->
  <line x1="410" y1="115" x2="410" y2="145" stroke="#27ae60" stroke-width="1.5"/>
  <polygon points="410,145 402,165 418,165" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="400" y1="145" x2="420" y2="145" stroke="#27ae60" stroke-width="2"/>
  <line x1="410" y1="165" x2="410" y2="200" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="410" y1="115" x2="320" y2="115" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="410" y1="200" x2="320" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="424" y="158" font-size="12" font-weight="700" fill="#27ae60">D1 (SS34)</text>

  <!-- RC Snubber Branch -->
  <line x1="510" y1="115" x2="510" y2="135" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="503" y="135" width="14" height="25" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="523" y="152" font-size="12" fill="#1a1a1a">R_s 10Ω</text>
  <line x1="510" y1="160" x2="510" y2="173" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="500" y1="173" x2="520" y2="173" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="500" y1="181" x2="520" y2="181" stroke="#1a1a1a" stroke-width="2"/>
  <text x="523" y="181" font-size="12" fill="#1a1a1a">C_s 10nF</text>
  <line x1="510" y1="181" x2="510" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="510" y1="115" x2="410" y2="115" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="510" y1="200" x2="410" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- MOSFET Switch S1 -->
  <line x1="320" y1="200" x2="320" y2="215" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="305" y1="225" x2="315" y2="225" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="315" y1="215" x2="315" y2="235" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="320" y1="215" x2="330" y2="215" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="320" y1="235" x2="330" y2="235" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="330" y1="215" x2="330" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="330" y1="235" x2="330" y2="255" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Gate Drive Input -->
  <line x1="230" y1="225" x2="305" y2="225" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="267" y="217" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">V_GS (ШІМ)</text>
  <text x="342" y="230" font-size="12" font-weight="700" fill="#1a1a1a">MOSFET S1</text>

  <!-- GND Rail -->
  <line x1="40" y1="255" x2="560" y2="255" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="330" y1="235" x2="330" y2="255" stroke="#1a1a1a" stroke-width="2"/>
  <text x="45" y="270" font-size="12" font-weight="700" fill="#1a1a1a">GND (0V)</text>


  <!-- TOP RIGHT PANEL: Physical Equations & Rules -->
  <rect x="605" y="70" width="335" height="215" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="772" y="94" font-size="13" font-weight="700" text-anchor="middle" fill="#2457d6">Ключові рівняння та правила</text>

  <!-- Equation 1: Ripple -->
  <rect x="620" y="106" width="305" height="36" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="630" y="122" font-size="12" font-weight="700" fill="#1a1a1a">Пульсації струму якоря:</text>
  <text x="630" y="136" font-size="12" fill="#2457d6">ΔI = [(V_DD - E_bemf) / L_a] · D · T_PWM</text>

  <!-- Equation 2: Voltage Spike -->
  <rect x="620" y="148" width="305" height="36" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="630" y="164" font-size="12" font-weight="700" fill="#1a1a1a">Індуктивний викид напруги:</text>
  <text x="630" y="178" font-size="12" fill="#c0392b">V_spike = V_DD + L_a · (di / dt)</text>

  <!-- Recommendation rules -->
  <rect x="620" y="190" width="305" height="82" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="630" y="208" font-size="12" font-weight="700" fill="#27ae60">• Вибір f_PWM:</text>
  <text x="720" y="208" font-size="12" fill="#1a1a1a">15–20 кГц (без акуст. шуму)</text>
  <text x="630" y="228" font-size="12" font-weight="700" fill="#27ae60">• Діод D1:</text>
  <text x="720" y="228" font-size="12" fill="#1a1a1a">Schottky (t_rr &lt; 50 нс, I_peak ≥ 4A)</text>
  <text x="630" y="248" font-size="12" font-weight="700" fill="#27ae60">• RC-демпфер:</text>
  <text x="720" y="248" font-size="12" fill="#1a1a1a">гасить ВЧ-дзвін розсіювання L_σ</text>
  <text x="630" y="264" font-size="12" font-weight="700" fill="#27ae60">• Конденсатор C_dec:</text>
  <text x="770" y="264" font-size="12" fill="#1a1a1a">компенсує L_wire дротів</text>


  <!-- BOTTOM LEFT PANEL: Current Ripple Time Diagram -->
  <rect x="20" y="300" width="450" height="225" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="245" y="322" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">1. Пульсації струму якоря i_L(t) залежно від частоти ШІМ</text>

  <!-- Legend above plot area -->
  <text x="65" y="344" font-size="12" font-weight="700" fill="#c0392b">Низька f_PWM: великі ΔI_1</text>
  <text x="272" y="344" font-size="12" font-weight="700" fill="#27ae60">Висока f_PWM: малі ΔI_2</text>

  <!-- Axes -->
  <line x1="60" y1="485" x2="440" y2="485" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <text x="445" y="489" font-size="12" font-weight="700" fill="#1a1a1a">t</text>

  <line x1="60" y1="485" x2="60" y2="355" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <text x="60" y="350" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">i_L</text>

  <!-- I_avg reference line -->
  <line x1="60" y1="420" x2="430" y2="420" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="52" y="424" font-size="12" text-anchor="end" fill="#6b7280">I_avg</text>

  <!-- Low PWM Frequency Waveform (Large Ripple, Red) -->
  <path d="M60,460 L140,380 L220,460 L300,380 L380,460 L420,420" fill="none" stroke="#c0392b" stroke-width="2"/>

  <!-- High PWM Frequency Waveform (Small Ripple, Green) -->
  <path d="M60,428 L80,412 L100,428 L120,412 L140,428 L160,412 L180,428 L200,412 L220,428 L240,412 L260,428 L280,412 L300,428 L320,412 L340,428 L360,412 L380,428 L400,412 L420,428" fill="none" stroke="#27ae60" stroke-width="2"/>

  <!-- Delta I double arrow indicator -->
  <line x1="220" y1="380" x2="220" y2="460" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="225" y1="380" x2="225" y2="460" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-red)" marker-end="url(#arr-red)"/>
  <text x="232" y="375" font-size="12" font-weight="700" fill="#c0392b">ΔI_1</text>

  <text x="245" y="508" font-size="12" text-anchor="middle" fill="#6b7280">Висока частота ШІМ згладжує струм за рахунок індуктивності L_a</text>


  <!-- BOTTOM RIGHT PANEL: Drain Voltage Time Diagram -->
  <rect x="490" y="300" width="450" height="225" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="715" y="322" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">2. Динаміка напруги стоку V_DS(t) при вимкненні ключа</text>

  <!-- Axes -->
  <line x1="530" y1="485" x2="910" y2="485" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <text x="915" y="489" font-size="12" font-weight="700" fill="#1a1a1a">t</text>

  <line x1="530" y1="485" x2="530" y2="340" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <text x="530" y="335" font-size="12" font-weight="700" text-anchor="middle" fill="#1a1a1a">V_DS</text>

  <!-- V_DD level line -->
  <line x1="530" y1="425" x2="900" y2="425" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="522" y="429" font-size="12" text-anchor="end" fill="#6b7280">V_DD</text>

  <!-- Switching instant t_off -->
  <line x1="610" y1="345" x2="610" y2="485" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="610" y="500" font-size="12" text-anchor="middle" fill="#6b7280">t_off (розмикання)</text>

  <!-- Unsnubbed Spike Waveform (Red) -->
  <path d="M530,480 L610,480 L612,350 L620,440 L630,410 L640,430 L650,425 L900,425" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="640" y="360" font-size="12" font-weight="700" fill="#c0392b">Без діода: V_spike &gt; V_BR (пробій)</text>

  <!-- Snubbed & Clamped Waveform (Green) -->
  <path d="M530,482 L610,482 L614,412 L625,420 L635,423 L645,425 L900,425" fill="none" stroke="#27ae60" stroke-width="2"/>
  <text x="650" y="395" font-size="12" font-weight="700" fill="#27ae60">З діодом D1: фіксація на V_DD + V_F</text>

  <text x="715" y="516" font-size="12" text-anchor="middle" fill="#6b7280">Діод гасить основний індуктивний імпульс, RC-демпфер зрізає ВЧ-дзвін</text>
</svg>
