<svg viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Визначення маркерів стрілок -->
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Діаграма станів програмного драйвера помпи RS-360SH</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Логіка м'якого пуску, калібрування витрати та захисту від сухого ходу (I &lt; I_min)</text>

  <!-- Переходи / Стрілки -->

  <!-- Початковий стан -> STATE_IDLE -->
  <circle cx="40" cy="165" r="7" fill="#1a1a1a"/>
  <path d="M 47,165 L 80,165" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>

  <!-- 1. IDLE -> SOFT_START (cmd_start) -->
  <path d="M 240,145 L 360,145" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="300" y="135" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">cmd_start</text>

  <!-- 2. SOFT_START -> IDLE (cmd_stop / abort) -->
  <path d="M 360,185 L 240,185" stroke="#6b7280" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arr-gray)"/>
  <text x="300" y="202" font-size="12" fill="#6b7280" text-anchor="middle">cmd_stop</text>

  <!-- 3. SOFT_START -> RUNNING (Ramp complete) -->
  <path d="M 540,145 L 680,145" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="610" y="135" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Рамп завершено</text>
  <text x="610" y="168" font-size="12" fill="#6b7280" text-anchor="middle">(PWM = Target)</text>

  <!-- 4. RUNNING -> IDLE (Normal stop top loop) -->
  <path d="M 780,120 L 780,80 L 160,80 L 160,120" stroke="#6b7280" stroke-width="2" stroke-dasharray="4,4" fill="none" marker-end="url(#arr-gray)"/>
  <text x="470" y="73" font-size="12" fill="#6b7280" text-anchor="middle">cmd_stop / вимкнення помпи</text>

  <!-- 5. IDLE -> CALIB (cmd_calib) -->
  <path d="M 160,210 L 160,395 L 360,395" stroke="#2457d6" stroke-width="2" fill="none" marker-end="url(#arr-blue)"/>
  <text x="285" y="385" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">cmd_calib</text>

  <!-- 6. CALIB -> IDLE (calib complete) -->
  <path d="M 450,350 L 450,250 L 200,250 L 200,210" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>
  <text x="320" y="242" font-size="12" fill="#27ae60" text-anchor="middle">калібрування завершено</text>

  <!-- 7. RUNNING -> DRY_RUN_FAULT (I < I_min) -->
  <path d="M 780,210 L 780,350" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="795" y="272" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">I &lt; I_min (або датчик)</text>
  <text x="795" y="292" font-size="12" fill="#c0392b" text-anchor="start">Виявлено сухий хід!</text>

  <!-- 8. SOFT_START -> DRY_RUN_FAULT (I < I_min during ramp) -->
  <path d="M 480,210 L 480,295 L 710,295 L 710,350" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arr-red)"/>
  <text x="595" y="287" font-size="12" fill="#c0392b" text-anchor="middle">I &lt; I_min при пуску</text>

  <!-- 9. DRY_RUN_FAULT -> IDLE (Reset / Timeout loop) -->
  <path d="M 780,440 L 780,485 L 120,485 L 120,210" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,4" fill="none" marker-end="url(#arr-red)"/>
  <text x="450" y="477" font-size="12" fill="#c0392b" text-anchor="middle">скидання помилки (cmd_reset / timeout)</text>

  <!-- Блоки станів (Rectangles & Inside Text) -->

  <!-- Блок 1: STATE_IDLE -->
  <rect x="80" y="120" width="160" height="90" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="160" y="145" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">STATE_IDLE</text>
  <text x="160" y="165" font-size="12" fill="#6b7280" text-anchor="middle">Очікування команди</text>
  <text x="160" y="185" font-size="12" fill="#1a1a1a" text-anchor="middle">ШІМ = 0% | I = 0 A</text>

  <!-- Блок 2: STATE_SOFT_START -->
  <rect x="360" y="120" width="180" height="90" rx="8" ry="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="450" y="145" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">STATE_SOFT_START</text>
  <text x="450" y="165" font-size="12" fill="#1a1a1a" text-anchor="middle">Плавний пуск (Ramp)</text>
  <text x="450" y="185" font-size="12" fill="#2457d6" text-anchor="middle">ШІМ: 0% → Duty_target</text>

  <!-- Блок 3: STATE_RUNNING -->
  <rect x="680" y="120" width="200" height="90" rx="8" ry="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="780" y="145" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">STATE_RUNNING</text>
  <text x="780" y="165" font-size="12" fill="#1a1a1a" text-anchor="middle">Робочий режим помпи</text>
  <text x="780" y="185" font-size="12" fill="#27ae60" text-anchor="middle">Контроль Q (мл/хв) &amp; I</text>

  <!-- Блок 4: STATE_CALIB -->
  <rect x="360" y="350" width="180" height="90" rx="8" ry="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="450" y="375" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">STATE_CALIB</text>
  <text x="450" y="395" font-size="12" fill="#1a1a1a" text-anchor="middle">Калібрування помпи</text>
  <text x="450" y="415" font-size="12" fill="#2457d6" text-anchor="middle">Визначення мл / ШІМ%</text>

  <!-- Блок 5: STATE_DRY_RUN_FAULT -->
  <rect x="680" y="350" width="200" height="90" rx="8" ry="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="780" y="375" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">STATE_DRY_RUN_FAULT</text>
  <text x="780" y="395" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Аварія: Сухий хід!</text>
  <text x="780" y="415" font-size="12" fill="#1a1a1a" text-anchor="middle">ШІМ = 0% | Захисне блокування</text>
</svg>
