    <polygon points="700,270 520,270 500,278 460,286 430,282 400,286 370,282 340,286 320,278 280,278 280,260 340,260 340,268 380,260 400,260 400,268 440,260 460,260 460,268 500,260 520,250 700,250" fill="#eaf0fd" stroke="#2457d6" stroke-width="2" stroke-linejoin="round"/>

