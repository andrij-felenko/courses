<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <!-- Arrow markers -->
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-red-rev" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- HEADER & SUBTITLE -->
  <text x="480" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Робоча точка помпи RS-360SH у гідравлічній мережі</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Перетин характеристики помпи H(Q) та опору мережі H_net(Q) визначає робочу точку (Q₀, H₀)</text>

  <!-- GRAPH BACKGROUND & SHADED HYDRAULIC POWER AREA -->
  <rect x="140" y="250" width="220" height="200" fill="#27ae60" fill-opacity="0.08" stroke="none"/>
  <text x="230" y="420" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">P_hyd = ρ·g·Q₀·H₀</text>

  <!-- GRID LINES & PROJECTIONS -->
  <!-- H_max horizontal grid line -->
  <line x1="140" y1="160" x2="560" y2="160" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/>
  <!-- H0 operating head line -->
  <line x1="140" y1="250" x2="395" y2="250" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- H_st static head line -->
  <line x1="140" y1="370" x2="360" y2="370" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 4" stroke-opacity="0.6"/>

  <!-- Q0 projection line -->
  <line x1="360" y1="250" x2="360" y2="450" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- Q_max projection line -->
  <line x1="540" y1="160" x2="540" y2="450" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- DYNAMIC LOSSES DIMENSION LINE (at x=345, between H0 and H_st) -->
  <line x1="345" y1="254" x2="345" y2="366" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 2" marker-start="url(#arr-red-rev)" marker-end="url(#arr-red)"/>

  <!-- CURVES -->
  <!-- Pump Curve Hp(Q) - Blue -->
  <path d="M 140 160 Q 340 160 540 450" fill="none" stroke="#2457d6" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Network Resistance Curve Hnet(Q) - Red -->
  <path d="M 140 370 Q 300 370 450 120" fill="none" stroke="#c0392b" stroke-width="3.5" stroke-linecap="round"/>

  <!-- MAIN AXES -->
  <!-- Y-Axis -->
  <line x1="140" y1="450" x2="140" y2="100" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <!-- X-Axis -->
  <line x1="140" y1="450" x2="600" y2="450" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- AXIS TITLES -->
  <text x="130" y="105" text-anchor="end" font-size="13" font-weight="bold" fill="#1a1a1a">H [м], p [кПа]</text>
  <text x="130" y="122" text-anchor="end" font-size="12" fill="#6b7280">(Напір / Тиск)</text>
  <text x="600" y="485" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Q [л/хв]</text>

  <!-- Y-AXIS TICKS & LABELS -->
  <line x1="135" y1="160" x2="140" y2="160" stroke="#2457d6" stroke-width="1.5"/>
  <text x="125" y="164" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">H_max</text>

  <line x1="135" y1="250" x2="140" y2="250" stroke="#27ae60" stroke-width="2"/>
  <text x="125" y="254" text-anchor="end" font-size="13" font-weight="bold" fill="#27ae60">H₀</text>

  <line x1="135" y1="370" x2="140" y2="370" stroke="#c0392b" stroke-width="1.5"/>
  <text x="125" y="374" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">H_st</text>

  <text x="125" y="454" text-anchor="end" font-size="12" fill="#6b7280">0</text>

  <!-- X-AXIS TICKS & LABELS -->
  <line x1="360" y1="450" x2="360" y2="455" stroke="#27ae60" stroke-width="2"/>
  <text x="360" y="472" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Q₀</text>
  <text x="360" y="490" text-anchor="middle" font-size="12" fill="#6b7280">(робоча витрата)</text>

  <line x1="540" y1="450" x2="540" y2="455" stroke="#2457d6" stroke-width="1.5"/>
  <text x="540" y="472" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Q_max</text>

  <!-- ON-GRAPH ANNOTATION BOXES -->
  <!-- Pump Curve Label Box -->
  <rect x="165" y="78" width="165" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="247" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">H_p(Q) — Помпа RS-360SH</text>
  <line x1="247" y1="104" x2="247" y2="162" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- Network Curve Label Box -->
  <rect x="355" y="78" width="165" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="437" y="95" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">H_net(Q) — Опір мережі</text>
  <line x1="437" y1="104" x2="437" y2="132" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- Operating Point A Box -->
  <rect x="395" y="215" width="165" height="58" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="477" y="233" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Точка рівноваги A</text>
  <text x="477" y="249" text-anchor="middle" font-size="12" fill="#1a1a1a">Q₀ = 2.4 л/хв, H₀ = 9 м</text>
  <text x="477" y="265" text-anchor="middle" font-size="12" fill="#c0392b">ΔH_dyn = k·Q₀²</text>
  <line x1="395" y1="244" x2="368" y2="250" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- OPERATING POINT CIRCLE -->
  <circle cx="360" cy="250" r="6" fill="#27ae60" stroke="#ffffff" stroke-width="2"/>

  <!-- RIGHT SIDE EXPLANATORY PANEL -->
  <rect x="635" y="78" width="295" height="452" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <rect x="650" y="90" width="265" height="32" rx="4" fill="#eaf0fd"/>
  <text x="782" y="111" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Гідравлічний баланс</text>

  <rect x="650" y="132" width="265" height="78" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="662" y="152" font-size="12" font-weight="bold" fill="#2457d6">Характеристика помпи H_p(Q):</text>
  <text x="662" y="172" font-size="12" fill="#1a1a1a">H_p(Q) = H_max - k_p · Q²</text>
  <text x="662" y="194" font-size="12" fill="#6b7280">Спадає зі зростанням витрати Q</text>

  <rect x="650" y="220" width="265" height="78" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="662" y="240" font-size="12" font-weight="bold" fill="#c0392b">Опір мережі H_net(Q):</text>
  <text x="662" y="260" font-size="12" fill="#1a1a1a">H_net(Q) = H_st + k_net · Q²</text>
  <text x="662" y="282" font-size="12" fill="#6b7280">H_st — статичний напір (підйом)</text>

  <rect x="650" y="308" width="265" height="98" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="662" y="328" font-size="12" font-weight="bold" fill="#27ae60">Робоча точка A (Q₀, H₀):</text>
  <text x="662" y="348" font-size="12" fill="#1a1a1a">H_p(Q₀) = H_net(Q₀) = H₀</text>
  <text x="662" y="368" font-size="12" fill="#1a1a1a">Гідравлічна потужність:</text>
  <text x="662" y="390" font-size="12" font-weight="bold" fill="#27ae60">P_hyd = ρ · g · Q₀ · H₀</text>

  <rect x="650" y="416" width="265" height="98" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="662" y="436" font-size="12" font-weight="bold" fill="#1a1a1a">Параметри RS-360SH:</text>
  <text x="662" y="456" font-size="12" fill="#6b7280">Зміна напруги/ШІМ зміщує H_p</text>
  <text x="662" y="476" font-size="12" fill="#6b7280">Момент на валу: M ~ Δp · V_rev</text>
  <text x="662" y="496" font-size="12" fill="#6b7280">RS-360SH: U_nom = 12 В</text>

</svg>
