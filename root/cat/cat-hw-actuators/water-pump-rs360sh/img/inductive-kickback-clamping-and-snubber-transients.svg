<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Комутаційні перехідні процеси помпи RS-360SH та демпфування</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Діод Шотткі обмежує індуктивний викид, а RC-снубер пригнічує високочастотний дзвін</text>

  <!-- ================= ЛІВА ПАНЕЛЬ: СХЕМА КАСКАДУ ================= -->
  <rect x="24" y="74" width="416" height="422" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Шапка лівої панелі -->
  <rect x="36" y="82" width="392" height="36" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="232" y="98" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Схема силового каскаду комутації помпи</text>
  <text x="232" y="112" font-size="12" fill="#6b7280" text-anchor="middle">RS-360SH + діод вільного ходу + RC-снубер + N-MOSFET</text>

  <!-- Шина живлення +12 В -->
  <line x1="60" y1="152" x2="360" y2="152" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="60" cy="152" r="3.5" fill="#c0392b"/>
  <text x="60" y="142" font-size="12" font-weight="700" fill="#c0392b" text-anchor="start">+U_bus (+12 В)</text>

  <!-- Гілка 1: Мотор RS-360SH -->
  <line x1="90" y1="152" x2="90" y2="194" stroke="#1a1a1a" stroke-width="1.8"/>
  <!-- Стрілка струму I_L -->
  <line x1="90" y1="162" x2="90" y2="182" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arr-blue)"/>
  <text x="80" y="174" font-size="12" font-weight="700" fill="#2457d6" text-anchor="end">I_L</text>

  <!-- Коло мотора -->
  <circle cx="90" cy="218" r="24" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="90" y="224" font-size="16" font-weight="700" fill="#2457d6" text-anchor="middle">M</text>
  <line x1="90" y1="242" x2="90" y2="296" stroke="#1a1a1a" stroke-width="1.8"/>

  <!-- Параметри мотора -->
  <text x="122" y="210" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="start">RS-360SH</text>
  <text x="122" y="225" font-size="12" fill="#6b7280" text-anchor="start">L_a = 450 мкГн</text>
  <text x="122" y="240" font-size="12" fill="#6b7280" text-anchor="start">R_a = 3.2 Ом</text>

  <!-- Гілка 2: Діод Шотткі SS34 -->
  <line x1="210" y1="152" x2="210" y2="204" stroke="#1a1a1a" stroke-width="1.8"/>
  <!-- Стрілка зворотного струму I_fly -->
  <line x1="210" y1="184" x2="210" y2="164" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arr-green)"/>
  <text x="200" y="176" font-size="12" font-weight="700" fill="#27ae60" text-anchor="end">I_fly</text>

  <!-- Катодний штрих Шотткі -->
  <line x1="198" y1="204" x2="222" y2="204" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="198" y1="204" x2="198" y2="210" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="222" y1="204" x2="222" y2="198" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Трикутник анода -->
  <polygon points="210,204 198,234 222,234" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
  <line x1="210" y1="234" x2="210" y2="296" stroke="#1a1a1a" stroke-width="1.8"/>

  <!-- Підписи діода -->
  <text x="230" y="210" font-size="12" font-weight="700" fill="#2457d6" text-anchor="start">SS34</text>
  <text x="230" y="225" font-size="12" fill="#6b7280" text-anchor="start">Шотткі</text>
  <text x="230" y="240" font-size="12" fill="#27ae60" text-anchor="start">V_f ≈ 0.4 В</text>

  <!-- Гілка 3: RC-снубер -->
  <line x1="330" y1="152" x2="330" y2="186" stroke="#1a1a1a" stroke-width="1.8"/>
  <rect x="322" y="186" width="16" height="26" rx="2" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.6"/>
  <line x1="330" y1="212" x2="330" y2="226" stroke="#1a1a1a" stroke-width="1.8"/>

  <!-- Конденсатор снубера -->
  <line x1="320" y1="226" x2="340" y2="226" stroke="#27ae60" stroke-width="2"/>
  <line x1="320" y1="232" x2="340" y2="232" stroke="#27ae60" stroke-width="2"/>
  <line x1="330" y1="232" x2="330" y2="296" stroke="#1a1a1a" stroke-width="1.8"/>

  <!-- Підписи снубера -->
  <text x="348" y="196" font-size="12" font-weight="700" fill="#27ae60" text-anchor="start">R_s = 4.3 Ом</text>
  <text x="348" y="210" font-size="12" fill="#6b7280" text-anchor="start">(0805)</text>
  <text x="348" y="228" font-size="12" font-weight="700" fill="#27ae60" text-anchor="start">C_s = 2.2 нФ</text>
  <text x="348" y="242" font-size="12" fill="#27ae60" text-anchor="start">Q ≈ 1 (RC)</text>

  <!-- Спільна шина стоку (Drain) -->
  <line x1="90" y1="296" x2="330" y2="296" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="90" cy="296" r="3" fill="#1a1a1a"/>
  <circle cx="210" cy="296" r="3" fill="#1a1a1a"/>
  <circle cx="330" cy="296" r="3" fill="#1a1a1a"/>

  <!-- Провід до стоку MOSFET -->
  <line x1="210" y1="296" x2="210" y2="344" stroke="#1a1a1a" stroke-width="2"/>
  <text x="198" y="316" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">Стік (Drain) V_DS</text>
  <text x="198" y="330" font-size="12" fill="#6b7280" text-anchor="end">C_oss ≈ 180 пФ</text>

  <!-- Символ MOSFET -->
  <line x1="210" y1="344" x2="216" y2="344" stroke="#1a1a1a" stroke-width="1.8"/>
  <line x1="210" y1="368" x2="216" y2="368" stroke="#1a1a1a" stroke-width="1.8"/>
  <line x1="216" y1="340" x2="216" y2="372" stroke="#1a1a1a" stroke-width="2.4"/>
  <line x1="208" y1="340" x2="208" y2="372" stroke="#2457d6" stroke-width="2"/>
  <line x1="208" y1="356" x2="150" y2="356" stroke="#2457d6" stroke-width="1.6"/>
  <circle cx="150" cy="356" r="3" fill="#2457d6"/>

  <text x="142" y="352" font-size="12" font-weight="700" fill="#2457d6" text-anchor="end">ШІМ (Gate)</text>
  <text x="142" y="367" font-size="12" fill="#6b7280" text-anchor="end">0 / 3.3 В</text>

  <text x="228" y="352" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="start">N-MOSFET</text>
  <text x="228" y="367" font-size="12" fill="#6b7280" text-anchor="start">V_BR(DSS) = 60 В</text>
  <text x="228" y="382" font-size="12" fill="#6b7280" text-anchor="start">R_DS(on) = 35 мОм</text>

  <!-- Витік (Source) на землю GND -->
  <line x1="210" y1="368" x2="210" y2="406" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="198" y1="406" x2="222" y2="406" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="202" y1="410" x2="218" y2="410" stroke="#1a1a1a" stroke-width="1.6"/>
  <line x1="206" y1="414" x2="214" y2="414" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="228" y="410" font-size="12" fill="#6b7280" text-anchor="start">GND (0 В)</text>

  <!-- Блок пояснення внизу лівої панелі -->
  <rect x="36" y="434" width="392" height="48" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="232" y="452" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Фізичний механізм демпфування:</text>
  <text x="232" y="468" font-size="12" fill="#2457d6" text-anchor="middle">1) D_fly скидає струм в шину | 2) RC-снубер гасить L_par·C_oss</text>

  <!-- ================= ПРАВА ПАНЕЛЬ: ОСЦИЛОГРАМИ ================= -->
  <rect x="456" y="74" width="480" height="422" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Шапка правої панелі -->
  <rect x="468" y="82" width="456" height="36" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="696" y="98" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Форма напруги на стоці V_DS(t) при розмиканні ключа</text>
  <text x="696" y="112" font-size="12" fill="#6b7280" text-anchor="middle">Порівняння перехідних процесів для 3 схемних варіантів</text>

  <!-- КАРТКА 1: БЕЗ ЗАХИСТУ -->
  <rect x="468" y="132" width="456" height="102" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="478" y="148" font-size="12" font-weight="700" fill="#c0392b" text-anchor="start">1. Без захисту: небезпечний викид V_DS >> V_BR(DSS)</text>
  <text x="478" y="162" font-size="12" fill="#6b7280" text-anchor="start">Лавинний пробій (>80 В), перегрів кристала MOSFET, загроза аварії</text>

  <!-- Шкала напруги картки 1 -->
  <text x="536" y="178" font-size="12" font-weight="700" fill="#c0392b" text-anchor="end">60 В</text>
  <text x="536" y="202" font-size="12" fill="#6b7280" text-anchor="end">12 В</text>
  <text x="536" y="224" font-size="12" fill="#6b7280" text-anchor="end">0 В</text>

  <!-- Опорні лінії картки 1 -->
  <line x1="544" y1="174" x2="600" y2="174" stroke="#c0392b" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="544" y1="198" x2="600" y2="198" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Осцилограма 1 -->
  <path d="M 544,222 L 610,222 L 614,170 L 642,170 C 652,170 658,222 668,222 C 678,222 684,196 694,196 C 704,196 710,202 720,198 L 910,198" fill="none" stroke="#c0392b" stroke-width="2.2"/>
  <text x="736" y="182" font-size="12" font-weight="700" fill="#c0392b" text-anchor="start">Лавинний пробій > 80 В</text>
  <text x="736" y="222" font-size="12" fill="#6b7280" text-anchor="start">Руйнування кристала</text>

  <!-- КАРТКА 2: ТІЛЬКИ ДІОД ШОТТКІ -->
  <rect x="468" y="248" width="456" height="102" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="478" y="264" font-size="12" font-weight="700" fill="#2457d6" text-anchor="start">2. Тільки діод Шотткі: фіксація напруги + резонансний дзвін</text>
  <text x="478" y="277" font-size="12" fill="#6b7280" text-anchor="start">V_clamp = U_bus + V_f ≈ 12.4 В; контур L_par–C_oss генерує завади EMI</text>

  <!-- Шкала напруги картки 2 -->
  <text x="536" y="316" font-size="12" font-weight="700" fill="#2457d6" text-anchor="end">12.4 В</text>
  <text x="536" y="338" font-size="12" fill="#6b7280" text-anchor="end">0 В</text>

  <line x1="544" y1="312" x2="600" y2="312" stroke="#2457d6" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Осцилограма 2 -->
  <path d="M 544,336 L 610,336 L 614,294 L 620,328 L 626,300 L 632,324 L 638,308 L 644,318 L 650,312 L 656,316 L 662,314 L 720,314 L 740,318 L 910,318" fill="none" stroke="#2457d6" stroke-width="2"/>
  <text x="680" y="296" font-size="12" font-weight="700" fill="#c0392b" text-anchor="start">ВЧ дзвін (ringing > 25 МГц)</text>
  <text x="680" y="338" font-size="12" fill="#6b7280" text-anchor="start">Шум і випромінювання EMI</text>

  <!-- КАРТКА 3: ДІОД ШОТТКІ + RC-ДЕМПФЕР -->
  <rect x="468" y="364" width="456" height="102" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="478" y="380" font-size="12" font-weight="700" fill="#27ae60" text-anchor="start">3. Діод Шотткі + RC-демпфер: оптимальне критичне заспокоєння</text>
  <text x="478" y="393" font-size="12" fill="#6b7280" text-anchor="start">R_snub = √(L_par/C_snub) повністю гасить резонансний дзвін (Q ≈ 1)</text>

  <!-- Шкала напруги картки 3 -->
  <text x="536" y="432" font-size="12" font-weight="700" fill="#27ae60" text-anchor="end">12.4 В</text>
  <text x="536" y="454" font-size="12" fill="#6b7280" text-anchor="end">0 В</text>

  <line x1="544" y1="428" x2="600" y2="428" stroke="#27ae60" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Осцилограма 3 -->
  <path d="M 544,452 L 610,452 C 614,452 618,428 626,428 L 720,428 C 728,428 732,432 740,432 L 910,432" fill="none" stroke="#27ae60" stroke-width="2.4"/>
  <text x="680" y="414" font-size="12" font-weight="700" fill="#27ae60" text-anchor="start">Дзвін повністю усунуто</text>
  <text x="680" y="452" font-size="12" fill="#6b7280" text-anchor="start">Плавний безпечний перехід</text>

  <!-- Вертикальна лінія розмикання t_off у кожній картці -->
  <line x1="610" y1="168" x2="610" y2="230" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 2"/>
  <line x1="610" y1="284" x2="610" y2="346" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 2"/>
  <line x1="610" y1="400" x2="610" y2="462" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 2"/>
  <line x1="610" y1="468" x2="610" y2="480" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 2"/>

  <!-- Вісь часу внизу -->
  <line x1="544" y1="480" x2="904" y2="480" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="912" y="484" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="start">Час t</text>
  <text x="610" y="496" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">t_off (розмикання)</text>
</svg>
