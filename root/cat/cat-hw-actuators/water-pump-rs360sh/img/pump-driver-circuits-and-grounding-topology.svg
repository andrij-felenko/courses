<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="35" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схеми драйверів помпи RS-360SH та зіркова топологія Star GND</text>
  <text x="480" y="55" font-size="13" fill="#6b7280" text-anchor="middle">Топологія Star GND ізолює імпульсні струми від МК, а демпфер і фільтр ЕМЗ гасять викиди ЕРС та іскріння</text>

  <!-- ==================== ЛІВА ПАНЕЛЬ ==================== -->
  <rect x="24" y="72" width="446" height="392" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247" y="96" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Низькосторонній N-MOSFET (односпрямований пуск / ШІМ)</text>
  <text x="247" y="112" font-size="12" fill="#6b7280" text-anchor="middle">Керування продуктивністю через ШІМ та плавний пуск (soft-start)</text>

  <!-- МК зліва -->
  <rect x="36" y="145" width="76" height="105" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="74" y="166" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">МК (MCU)</text>
  <text x="74" y="185" font-size="12" fill="#27ae60" text-anchor="middle">VDD 3.3V</text>
  <text x="106" y="214" font-size="12" fill="#1a1a1a" text-anchor="end">ШІМ</text>
  <circle cx="112" cy="210" r="2.5" fill="#1a1a1a"/>
  <text x="74" y="242" font-size="12" fill="#6b7280" text-anchor="middle">DGND</text>
  <circle cx="74" cy="250" r="2.5" fill="#1a1a1a"/>

  <!-- Резистор затвора Rg -->
  <line x1="112" y1="210" x2="130" y2="210" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="130" y="203" width="34" height="14" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="147" y="196" font-size="12" fill="#1a1a1a" text-anchor="middle">Rg 100 Ом</text>

  <!-- Провід від Rg до вузла затвора -->
  <line x1="164" y1="210" x2="185" y2="210" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="185" cy="210" r="3" fill="#1a1a1a"/>
  <line x1="185" y1="210" x2="210" y2="210" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Резистор підтяжки Rpd -->
  <line x1="185" y1="210" x2="185" y2="228" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="178" y="228" width="14" height="32" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="172" y="248" font-size="12" fill="#6b7280" text-anchor="end">Rpd 10k</text>
  <line x1="185" y1="260" x2="185" y2="282" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="185" y1="282" x2="230" y2="282" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- N-MOSFET Q1 -->
  <line x1="210" y1="200" x2="210" y2="220" stroke="#1a1a1a" stroke-width="1.8"/>
  <line x1="216" y1="196" x2="216" y2="224" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="6,3"/>
  <line x1="216" y1="198" x2="228" y2="198" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="228" y1="198" x2="228" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="216" y1="222" x2="228" y2="222" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="228" y1="222" x2="228" y2="282" stroke="#c0392b" stroke-width="2"/>
  <text x="234" y="210" font-size="12" font-weight="bold" fill="#1a1a1a">Q1 IRLZ44N</text>
  <text x="234" y="226" font-size="12" fill="#6b7280">N-MOSFET</text>

  <!-- Демпферний діод Шотткі (х=295) -->
  <line x1="228" y1="180" x2="295" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="295" y1="180" x2="295" y2="168" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="289,168 301,168 295,156" fill="#27ae60" stroke="#27ae60" stroke-width="1"/>
  <line x1="287" y1="156" x2="303" y2="156" stroke="#27ae60" stroke-width="1.8"/>
  <line x1="287" y1="156" x2="287" y2="152" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="303" y1="156" x2="303" y2="160" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="295" y1="156" x2="295" y2="135" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="283" y="162" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">1N5822</text>
  <text x="283" y="176" font-size="12" fill="#6b7280" text-anchor="end">Шотткі</text>

  <!-- Блок мотора з триконденсаторним фільтром ЕМЗ (х=326..460) -->
  <rect x="326" y="136" width="134" height="154" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="393" y="154" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Помпа RS-360SH</text>
  <circle cx="393" cy="208" r="18" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
  <text x="393" y="214" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">M</text>
  <line x1="393" y1="190" x2="393" y2="174" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="393" y1="226" x2="393" y2="242" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="401" y="183" font-size="12" font-weight="bold" fill="#c0392b">(+)</text>
  <text x="401" y="238" font-size="12" font-weight="bold" fill="#1a1a1a">(-)</text>

  <!-- C1 між клемами (х=354) -->
  <line x1="393" y1="174" x2="354" y2="174" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="393" y1="242" x2="354" y2="242" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="354" y1="174" x2="354" y2="204" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="354" y1="212" x2="354" y2="242" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="348" y1="204" x2="360" y2="204" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="348" y1="212" x2="360" y2="212" stroke="#2457d6" stroke-width="1.5"/>
  <text x="332" y="205" font-size="12" fill="#2457d6">C1</text>
  <text x="332" y="219" font-size="12" fill="#2457d6">100n</text>

  <!-- C2 і C3 на корпус (х=432) -->
  <line x1="393" y1="174" x2="432" y2="174" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="393" y1="242" x2="432" y2="242" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="432" y1="174" x2="432" y2="186" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="432" y1="192" x2="432" y2="208" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="426" y1="186" x2="438" y2="186" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="426" y1="192" x2="438" y2="192" stroke="#2457d6" stroke-width="1.5"/>
  <text x="440" y="185" font-size="12" fill="#2457d6">C2</text>
  <text x="440" y="197" font-size="12" fill="#2457d6">47n</text>

  <line x1="432" y1="208" x2="432" y2="224" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="432" y1="230" x2="432" y2="242" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="426" y1="224" x2="438" y2="224" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="426" y1="230" x2="438" y2="230" stroke="#2457d6" stroke-width="1.5"/>
  <text x="440" y="225" font-size="12" fill="#2457d6">C3</text>
  <text x="440" y="237" font-size="12" fill="#2457d6">47n</text>

  <!-- Введення живлення в мотор (обхід заголовка зліва) -->
  <line x1="295" y1="135" x2="340" y2="135" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="340" y1="135" x2="340" y2="174" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="340" y1="174" x2="354" y2="174" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="295" y1="180" x2="326" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="326" y1="180" x2="326" y2="242" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="326" y1="242" x2="354" y2="242" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="393" y="278" font-size="12" fill="#6b7280" text-anchor="middle">Корпус мотора (екран ЕМЗ)</text>

  <!-- Джерело 12 В -->
  <rect x="36" y="298" width="92" height="62" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="82" y="318" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Джерело 12 В</text>
  <text x="120" y="334" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">+12V</text>
  <circle cx="124" cy="330" r="2.5" fill="#c0392b"/>
  <text x="120" y="350" font-size="12" fill="#1a1a1a" text-anchor="end">GND</text>
  <circle cx="124" cy="346" r="2.5" fill="#1a1a1a"/>

  <!-- Шина +12 В від джерела -->
  <line x1="124" y1="330" x2="134" y2="330" stroke="#c0392b" stroke-width="1.8"/>
  <line x1="134" y1="330" x2="134" y2="135" stroke="#c0392b" stroke-width="1.8"/>
  <line x1="134" y1="135" x2="310" y2="135" stroke="#c0392b" stroke-width="1.8"/>
  <text x="140" y="128" font-size="12" font-weight="bold" fill="#c0392b">+12 В (VM)</text>

  <!-- C_bulk розташований на х=310 (між діодом і мотором) -->
  <line x1="310" y1="135" x2="310" y2="310" stroke="#c0392b" stroke-width="1.2"/>
  <rect x="303" y="310" width="14" height="20" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="324" y="322" font-size="12" font-weight="bold" fill="#1a1a1a">C_bulk 1000 мкФ</text>
  <text x="324" y="336" font-size="12" fill="#6b7280">+ C_dec 100 нФ</text>
  <line x1="310" y1="330" x2="310" y2="346" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="310" y1="346" x2="230" y2="346" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Star GND зв'язки -->
  <line x1="74" y1="250" x2="74" y2="285" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="74" y1="285" x2="230" y2="285" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="230" y1="285" x2="230" y2="346" stroke="#2457d6" stroke-width="1.5"/>
  <text x="152" y="281" font-size="12" fill="#2457d6" text-anchor="middle">Чиста DGND (I ≈ 0)</text>

  <line x1="124" y1="346" x2="230" y2="346" stroke="#1a1a1a" stroke-width="2"/>

  <line x1="228" y1="282" x2="230" y2="282" stroke="#c0392b" stroke-width="2"/>
  <text x="224" y="304" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">Силова PGND</text>
  <text x="224" y="318" font-size="12" fill="#c0392b" text-anchor="end">струм до 3–4 А</text>

  <circle cx="230" cy="346" r="6" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.8"/>
  <text x="230" y="370" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Зіркова точка (Star GND)</text>

  <rect x="36" y="396" width="422" height="54" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="247" y="418" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Перевага топології Star GND:</text>
  <text x="247" y="436" font-size="12" fill="#1a1a1a" text-anchor="middle">Пускові імпульси помпи не протікають по доріжках цифрової землі МК</text>

  <!-- ==================== ПРАВА ПАНЕЛЬ ==================== -->
  <rect x="490" y="72" width="446" height="392" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="713" y="96" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Повномостовий H-драйвер (реверсивне перекачування)</text>
  <text x="713" y="112" font-size="12" fill="#6b7280" text-anchor="middle">Зміна полярності на клемах мотора для двоспрямованого потоку рідини</text>

  <rect x="504" y="155" width="74" height="95" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="541" y="175" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">МК (MCU)</text>
  <text x="572" y="200" font-size="12" fill="#1a1a1a" text-anchor="end">IN1</text>
  <circle cx="575" cy="196" r="2.5" fill="#1a1a1a"/>
  <text x="572" y="226" font-size="12" fill="#1a1a1a" text-anchor="end">IN2</text>
  <circle cx="575" cy="222" r="2.5" fill="#1a1a1a"/>
  <text x="541" y="242" font-size="12" fill="#6b7280" text-anchor="middle">DGND</text>
  <circle cx="541" cy="250" r="2.5" fill="#1a1a1a"/>

  <rect x="612" y="136" width="308" height="230" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="766" y="154" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мікросхема H-моста (L298N / DRV8871)</text>

  <line x1="630" y1="136" x2="630" y2="124" stroke="#c0392b" stroke-width="1.8"/>
  <text x="630" y="120" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+12 В (VM)</text>
  <line x1="630" y1="136" x2="630" y2="170" stroke="#c0392b" stroke-width="1.8"/>
  <line x1="630" y1="170" x2="870" y2="170" stroke="#c0392b" stroke-width="1.8"/>

  <line x1="575" y1="196" x2="612" y2="196" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="575" y1="222" x2="612" y2="222" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Q1 -->
  <rect x="644" y="182" width="32" height="24" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="660" y="198" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Q1</text>
  <line x1="660" y1="170" x2="660" y2="182" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="660" y1="206" x2="660" y2="245" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Q3 -->
  <rect x="644" y="260" width="32" height="24" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="660" y="276" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Q3</text>
  <line x1="660" y1="245" x2="660" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="660" y1="284" x2="660" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Q2 -->
  <rect x="854" y="182" width="32" height="24" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="870" y="198" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Q2</text>
  <line x1="870" y1="170" x2="870" y2="182" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="870" y1="206" x2="870" y2="245" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Q4 -->
  <rect x="854" y="260" width="32" height="24" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="870" y="276" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Q4</text>
  <line x1="870" y1="245" x2="870" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="870" y1="284" x2="870" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>

  <line x1="660" y1="320" x2="870" y2="320" stroke="#1a1a1a" stroke-width="1.8"/>

  <circle cx="660" cy="245" r="3" fill="#1a1a1a"/>
  <text x="638" y="249" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">OUT1</text>
  <circle cx="870" cy="245" r="3" fill="#1a1a1a"/>
  <text x="892" y="249" font-size="12" font-weight="bold" fill="#1a1a1a">OUT2</text>

  <line x1="660" y1="245" x2="747" y2="245" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="783" y1="245" x2="870" y2="245" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="765" cy="245" r="18" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.8"/>
  <text x="765" y="251" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">M</text>
  <text x="765" y="220" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Помпа RS-360SH</text>
  <text x="765" y="270" font-size="12" fill="#6b7280" text-anchor="middle">Фільтр ЕМЗ (C1, C2, C3)</text>

  <text x="765" y="294" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Прямий хід: Q1 + Q4 ON</text>
  <text x="765" y="308" font-size="12" fill="#2457d6" text-anchor="middle">Реверс: Q2 + Q3 ON</text>

  <text x="765" y="346" font-size="12" fill="#6b7280" text-anchor="middle">Вбудовані діоди гасять ЕРС в обох напрямках</text>

  <line x1="660" y1="320" x2="660" y2="385" stroke="#1a1a1a" stroke-width="1.8"/>
  <line x1="541" y1="250" x2="541" y2="385" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="541" y1="385" x2="660" y2="385" stroke="#2457d6" stroke-width="1.5"/>

  <circle cx="660" cy="385" r="6" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.8"/>
  <text x="674" y="389" font-size="12" font-weight="bold" fill="#27ae60">Star GND (PGND + DGND)</text>

  <rect x="504" y="405" width="418" height="46" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="713" y="423" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Перевага мостового драйвера:</text>
  <text x="713" y="439" font-size="12" fill="#1a1a1a" text-anchor="middle">Забезпечує самовсмоктування та реверсивну промивку гідросистеми</text>

  <!-- ==================== НИЖНІ КАРТКИ ==================== -->
  <rect x="24" y="476" width="219" height="62" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="133" y="495" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Буфер C_bulk (1000 мкФ)</text>
  <text x="133" y="512" font-size="12" fill="#1a1a1a" text-anchor="middle">Гасить пусковий струм 3–4 А</text>
  <text x="133" y="527" font-size="12" fill="#6b7280" text-anchor="middle">Усуває просідання шини VM</text>

  <rect x="255" y="476" width="219" height="62" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="364" y="495" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">2. Діод Шотткі (Flyback)</text>
