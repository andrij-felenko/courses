<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-prob" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>
  
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Профіль струму в циклі дозування</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Динаміка споживання помпи та межі спрацьовування апаратних захистів</text>
  
  <!-- Threshold lines -->
  <line x1="100" y1="115" x2="900" y2="115" stroke="#c0392b" stroke-width="1" stroke-dasharray="6,6"/>
  <text x="890" y="105" text-anchor="end" font-size="12" fill="#c0392b">Аварійне заклинювання (I_max)</text>
  
  <line x1="100" y1="235" x2="900" y2="235" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="890" y="225" text-anchor="end" font-size="12" fill="#6b7280">Номінальний струм (I_nom)</text>
  
  <line x1="100" y1="295" x2="900" y2="295" stroke="#c0392b" stroke-width="1" stroke-dasharray="6,6"/>
  <text x="890" y="285" text-anchor="end" font-size="12" fill="#c0392b">Сухий хід (I_min)</text>
  
  <!-- Blind zones -->
  <line x1="100" y1="90" x2="150" y2="90" stroke="#6b7280" stroke-width="1"/>
  <line x1="100" y1="85" x2="100" y2="95" stroke="#6b7280" stroke-width="1"/>
  <line x1="150" y1="85" x2="150" y2="95" stroke="#6b7280" stroke-width="1"/>
  <text x="125" y="80" text-anchor="middle" font-size="12" fill="#6b7280">Сліпа зона</text>
  
  <line x1="555" y1="90" x2="580" y2="90" stroke="#6b7280" stroke-width="1"/>
  <line x1="555" y1="85" x2="555" y2="95" stroke="#6b7280" stroke-width="1"/>
  <line x1="580" y1="85" x2="580" y2="95" stroke="#6b7280" stroke-width="1"/>
  <text x="567.5" y="80" text-anchor="middle" font-size="12" fill="#6b7280">Сліпа зона</text>
  
  <!-- Axes -->
  <line x1="100" y1="355" x2="920" y2="355" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="915" y="345" text-anchor="end" font-size="13" fill="#1a1a1a">Час t</text>
  
  <line x1="100" y1="355" x2="100" y2="85" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="90" y="75" text-anchor="end" font-size="13" fill="#1a1a1a">Струм I</text>
  
  <!-- Main current profile -->
  <path d="M 100 355 L 105 135 Q 115 135, 150 235 L 550 235 L 550 355 L 555 355 L 560 155 Q 565 155, 580 255 L 650 255 L 650 355 L 900 355" fill="none" stroke="#2457d6" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Anomaly: Dry run -->
  <path d="M 220 235 Q 240 235, 260 310 L 280 310 L 280 355 L 320 355" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="215" y="315" text-anchor="end" font-size="12" fill="#c0392b">Повітря (струм падає)</text>
  <line x1="220" y1="310" x2="255" y2="305" stroke="#c0392b" stroke-width="1" marker-end="url(#arr-prob)"/>
  <text x="290" y="345" font-size="12" fill="#c0392b">Вимкнення</text>
  
  <!-- Anomaly: Stall -->
  <path d="M 400 235 Q 410 235, 430 100 L 450 100 L 450 355 L 480 355" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="390" y="95" text-anchor="end" font-size="12" fill="#c0392b">Заклинювання</text>
  <line x1="395" y1="90" x2="425" y2="95" stroke="#c0392b" stroke-width="1" marker-end="url(#arr-prob)"/>
  <text x="460" y="345" font-size="12" fill="#c0392b">Вимкнення</text>
  
  <!-- Callouts -->
  <text x="165" y="135" font-size="12" fill="#1a1a1a">Пусковий струм</text>
  <line x1="160" y1="130" x2="110" y2="135" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr)"/>
  
  <text x="570" y="135" font-size="12" fill="#1a1a1a">Струм реверсу</text>
  <line x1="570" y1="140" x2="560" y2="150" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr)"/>
  
  <!-- Phase blocks -->
  <rect x="175" y="375" width="300" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="325" y="393" text-anchor="middle" font-size="13" fill="#2457d6">Нагнітання (дозування)</text>
  
  <rect x="560" y="375" width="80" height="26" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="600" y="393" text-anchor="middle" font-size="13" fill="#1a1a1a">Реверс</text>
  
  <rect x="675" y="375" width="200" height="26" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="775" y="393" text-anchor="middle" font-size="13" fill="#6b7280">Пауза (охолодження)</text>
  
  <!-- Dimension lines at bottom -->
  <path d="M 100 420 L 100 430 M 100 425 L 550 425 M 550 420 L 550 430" stroke="#6b7280" stroke-width="1"/>
  <text x="325" y="440" text-anchor="middle" font-size="12" fill="#6b7280">Заданий об'єм (час дозування)</text>
  
  <path d="M 552 420 L 552 430 M 552 425 L 650 425 M 650 420 L 650 430" stroke="#6b7280" stroke-width="1"/>
  <text x="601" y="440" text-anchor="middle" font-size="12" fill="#6b7280">Час реверсу</text>
  
  <path d="M 652 420 L 652 430 M 652 425 L 900 425 M 900 420 L 900 430" stroke="#6b7280" stroke-width="1"/>
  <text x="776" y="440" text-anchor="middle" font-size="12" fill="#6b7280">Шпаруватість (охолодження)</text>
</svg>
