<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs>
  <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
  </marker>
</defs>

<!-- РџС–РґРєР»Р°РґРєР° -->
<rect x="0" y="0" width="960" height="560" fill="white"/>

<!-- Title -->
<text x="480" y="80" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема низькостороннього драйвера помпи з фільтрацією</text>
<text x="480" y="100" font-size="13" fill="#6b7280" text-anchor="middle">N-канальний MOSFET, захист від проти-ЕРС та 3-конденсаторний фільтр завад</text>

<!-- MCU -->
<rect x="95" y="300" width="100" height="100" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="4"/>
<text x="145" y="350" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">MCU</text>
<text x="185" y="345" font-size="12" fill="#1a1a1a" text-anchor="end">PWM</text>
<text x="145" y="390" font-size="12" fill="#1a1a1a" text-anchor="middle">GND</text>
<!-- MCU Pins -->
<line x1="195" y1="340" x2="240" y2="340" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="145" y1="400" x2="145" y2="460" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="145" y1="460" x2="420" y2="460" stroke="#1a1a1a" stroke-width="1.5"/>

<!-- Gate Resistor -->
<rect x="240" y="332" width="40" height="16" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="260" y="320" font-size="12" fill="#1a1a1a" text-anchor="middle">R1 (100 Ω)</text>

<!-- Gate Line -->
<line x1="280" y1="340" x2="405" y2="340" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="340" cy="340" r="3" fill="#1a1a1a"/>

<!-- Pulldown Resistor -->
<line x1="340" y1="340" x2="340" y2="370" stroke="#1a1a1a" stroke-width="1.5"/>
<rect x="332" y="370" width="16" height="40" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="340" y1="410" x2="340" y2="460" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="340" cy="460" r="3" fill="#1a1a1a"/>
<text x="322" y="395" font-size="12" fill="#1a1a1a" text-anchor="end">R2 (10 kΩ)</text>

<!-- MOSFET -->
<circle cx="420" cy="340" r="40" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
<!-- Gate -->
<line x1="405" y1="320" x2="405" y2="360" stroke="#1a1a1a" stroke-width="2"/>
<!-- Channel -->
<line x1="412" y1="315" x2="412" y2="327" stroke="#1a1a1a" stroke-width="2"/>
<line x1="412" y1="334" x2="412" y2="346" stroke="#1a1a1a" stroke-width="2"/>
<line x1="412" y1="353" x2="412" y2="365" stroke="#1a1a1a" stroke-width="2"/>
<!-- Drain/Source/Bulk wires -->
<polyline points="420,315 420,321 412,321" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<polyline points="420,365 420,359 412,359" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="412" y1="340" x2="420" y2="340" stroke="#1a1a1a" stroke-width="1.5"/>
<!-- Bulk arrow -->
<polygon points="418,337 412,340 418,343" fill="#1a1a1a"/>
<!-- Bulk to Source tie -->
<polyline points="420,340 430,340 430,365 420,365" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="420" cy="365" r="3" fill="#1a1a1a"/>

<!-- Body Diode -->
<polyline points="420,355 445,355 445,345" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<polyline points="445,335 445,325 420,325" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<polygon points="440,345 450,345 445,335" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="439" y1="335" x2="451" y2="335" stroke="#1a1a1a" stroke-width="1.5"/>
<!-- Diode dots -->
<circle cx="420" cy="355" r="2" fill="#1a1a1a"/>
<circle cx="420" cy="325" r="2" fill="#1a1a1a"/>

<!-- MOSFET Labels -->
<text x="470" y="330" font-size="12" font-weight="bold" fill="#1a1a1a">Q1</text>
<text x="470" y="345" font-size="12" fill="#1a1a1a">IRLZ44N</text>
<text x="470" y="360" font-size="12" fill="#6b7280">N-CH</text>

<!-- Heavy Power Lines (Drain to Motor, Source to GND) -->
<line x1="420" y1="260" x2="420" y2="315" stroke="#1a1a1a" stroke-width="3"/>
<line x1="420" y1="365" x2="420" y2="460" stroke="#1a1a1a" stroke-width="3"/>

<!-- Star GND -->
<circle cx="420" cy="460" r="5" fill="#1a1a1a"/>
<text x="420" y="485" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Спільна точка заземлення («Зірка»)</text>

<!-- Power Rails -->
<line x1="420" y1="460" x2="800" y2="460" stroke="#1a1a1a" stroke-width="3"/>
<line x1="420" y1="160" x2="800" y2="160" stroke="#1a1a1a" stroke-width="3"/>
<circle cx="800" cy="160" r="5" fill="#1a1a1a"/>
<circle cx="800" cy="460" r="5" fill="#1a1a1a"/>
<text x="800" y="150" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">+12V (Силове)</text>
<text x="800" y="450" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GND (Силове)</text>

<!-- Ground line labels -->
<text x="242" y="450" font-size="12" fill="#6b7280" text-anchor="middle">Логічна земля (без завад)</text>
<text x="610" y="450" font-size="12" fill="#6b7280" text-anchor="middle">Силова земля (імпульсні струми)</text>

<!-- Motor -->
<circle cx="420" cy="210" r="30" fill="white" stroke="#1a1a1a" stroke-width="2"/>
<text x="420" y="210" font-size="24" font-weight="bold" fill="#1a1a1a" text-anchor="middle" dominant-baseline="central">M</text>
<text x="420" y="145" font-size="12" fill="#6b7280" text-anchor="middle">RS-360SH</text>
<!-- Motor lines to main rails -->
<line x1="420" y1="160" x2="420" y2="180" stroke="#1a1a1a" stroke-width="3"/>
<line x1="420" y1="240" x2="420" y2="260" stroke="#1a1a1a" stroke-width="3"/>
<circle cx="420" cy="160" r="4" fill="#1a1a1a"/>
<circle cx="420" cy="260" r="4" fill="#1a1a1a"/>

<!-- Diode and Filter lines -->
<!-- Motor- extension to right -->
<line x1="420" y1="260" x2="560" y2="260" stroke="#1a1a1a" stroke-width="3"/>
<line x1="560" y1="260" x2="680" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="560" cy="260" r="4" fill="#1a1a1a"/>
<!-- Motor+ extension to right -->
<line x1="420" y1="160" x2="680" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="560" cy="160" r="4" fill="#1a1a1a"/>

<!-- Flyback Diode -->
<line x1="560" y1="160" x2="560" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="560" y1="260" x2="560" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>
<polygon points="550,220 570,220 560,200" fill="#1a1a1a"/>
<polyline points="550,205 550,200 570,200 570,195" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="580" y="215" font-size="12" fill="#1a1a1a">D1 (Шотткі)</text>

<!-- C1 (parallel filter) -->
<line x1="420" y1="160" x2="330" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="420" y1="260" x2="330" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="330" cy="160" r="3" fill="#1a1a1a"/>
<circle cx="330" cy="260" r="3" fill="#1a1a1a"/>
<line x1="330" y1="160" x2="330" y2="205" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="330" y1="260" x2="330" y2="215" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="315" y1="205" x2="345" y2="205" stroke="#1a1a1a" stroke-width="2"/>
<line x1="315" y1="215" x2="345" y2="215" stroke="#1a1a1a" stroke-width="2"/>
<text x="315" y="185" font-size="12" fill="#1a1a1a" text-anchor="end">C1 (100 nF)</text>

<!-- C2, C3 to Case -->
<line x1="680" y1="160" x2="680" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="665" y1="180" x2="695" y2="180" stroke="#1a1a1a" stroke-width="2"/>
<line x1="665" y1="190" x2="695" y2="190" stroke="#1a1a1a" stroke-width="2"/>
<line x1="680" y1="190" x2="680" y2="210" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="700" y="185" font-size="12" fill="#1a1a1a">C2 (10 nF)</text>

<line x1="680" y1="260" x2="680" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="665" y1="240" x2="695" y2="240" stroke="#1a1a1a" stroke-width="2"/>
<line x1="665" y1="230" x2="695" y2="230" stroke="#1a1a1a" stroke-width="2"/>
<line x1="680" y1="230" x2="680" y2="210" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="700" y="245" font-size="12" fill="#1a1a1a">C3 (10 nF)</text>

<circle cx="680" cy="210" r="4" fill="#1a1a1a"/>
<text x="700" y="215" font-size="12" font-weight="bold" fill="#1a1a1a">Корпус двигуна</text>
<circle cx="680" cy="160" r="3" fill="#1a1a1a"/>
<circle cx="680" cy="260" r="3" fill="#1a1a1a"/>

<!-- Arrows for current flow -->
<!-- Flyback (Diode) -->
<path d="M 460,230 L 460,190" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
<text x="470" y="205" font-size="12" fill="#27ae60" text-anchor="start">Струм</text>
<text x="470" y="220" font-size="12" fill="#27ae60" text-anchor="start">самоіндукції</text>

<!-- Noise (C1) -->
<path d="M 290,195 L 290,235" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
<text x="280" y="220" font-size="12" fill="#27ae60" text-anchor="end">ВЧ завади</text>

<!-- Noise (C2, C3) -->
<path d="M 660,165 L 660,185" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
<path d="M 660,255 L 660,235" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
<text x="650" y="215" font-size="12" fill="#27ae60" text-anchor="end">На корпус</text>
</svg>
