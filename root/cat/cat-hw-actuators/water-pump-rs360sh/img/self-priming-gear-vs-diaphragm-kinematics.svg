<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-prob" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-sol" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <text x="480" y="40" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Кінематика сухого всмоктування: об'ємні проти відцентрових помп</text>
  <text x="480" y="60" font-size="13" text-anchor="middle" fill="#6b7280">Об'ємні насоси примусово витісняють повітря для підйому рідини, відцентрові — марно обертають його</text>

  <!-- Panel 1: Centrifugal -->
  <rect x="30" y="90" width="280" height="440" fill="#fdecea" stroke="#c0392b" stroke-width="2" rx="8"/>
  <text x="170" y="125" font-size="14" font-weight="bold" text-anchor="middle" fill="#c0392b">Відцентрова помпа</text>
  <text x="170" y="145" font-size="12" text-anchor="middle" fill="#c0392b">(Динамічний принцип)</text>
  
  <circle cx="170" cy="260" r="60" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 180 202 L 180 170 L 210 170 L 210 215" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="170" cy="260" r="50" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <path d="M 170 260 Q 190 250 215 250" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <path d="M 170 260 Q 185 275 195 300" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <path d="M 170 260 Q 160 280 160 305" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <path d="M 170 260 Q 150 270 125 270" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <path d="M 170 260 Q 155 245 145 220" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <path d="M 170 260 Q 180 240 180 215" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <circle cx="170" cy="260" r="8" fill="#1a1a1a"/>
  <path d="M 140 230 A 40 40 0 0 1 200 230" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arr-prob)"/>
  <path d="M 200 290 A 40 40 0 0 1 140 290" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arr-prob)"/>

  <text x="170" y="380" font-size="13" text-anchor="middle" fill="#1a1a1a">Повітря проковзує між лопатями</text>
  <text x="170" y="398" font-size="13" text-anchor="middle" fill="#1a1a1a">через низьку щільність фази</text>
  <text x="170" y="440" font-size="14" font-weight="bold" text-anchor="middle" fill="#c0392b">Вакуум не утворюється</text>
  <text x="170" y="490" font-size="14" font-weight="bold" text-anchor="middle" fill="#c0392b">Насос не всмоктує</text>

  <!-- Panel 2: Gear -->
  <rect x="340" y="90" width="280" height="440" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="8"/>
  <text x="480" y="125" font-size="14" font-weight="bold" text-anchor="middle" fill="#27ae60">Шестеренчаста помпа</text>
  <text x="480" y="145" font-size="12" text-anchor="middle" fill="#27ae60">(Об'ємне витіснення)</text>
  
  <text x="480" y="365" font-size="12" text-anchor="middle" fill="#6b7280">Вхід</text>
  <text x="480" y="165" font-size="12" text-anchor="middle" fill="#6b7280">Вихід</text>
  
  <path d="M 440 200 L 520 200 A 60 60 0 0 1 580 260 A 60 60 0 0 1 520 320 L 440 320 A 60 60 0 0 1 380 260 A 60 60 0 0 1 440 200 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="440" cy="260" r="40" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="520" cy="260" r="40" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="440" cy="260" r="6" fill="#1a1a1a"/>
  <circle cx="520" cy="260" r="6" fill="#1a1a1a"/>
  
  <path d="M 400 260 L 390 260 M 440 220 L 440 210 M 440 300 L 440 310 M 412 232 L 405 225 M 412 288 L 405 295" stroke="#1a1a1a" stroke-width="3"/>
  <path d="M 560 260 L 570 260 M 520 220 L 520 210 M 520 300 L 520 310 M 548 232 L 555 225 M 548 288 L 555 295" stroke="#1a1a1a" stroke-width="3"/>
  <path d="M 472 245 L 488 255 L 472 265 L 488 275" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <path d="M 480 335 L 480 305" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <path d="M 440 320 A 60 60 0 0 1 380 260 A 60 60 0 0 1 440 200" fill="none" stroke="#2457d6" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arr-blue)"/>
  <path d="M 520 320 A 60 60 0 0 0 580 260 A 60 60 0 0 0 520 200" fill="none" stroke="#2457d6" stroke-width="3" stroke-dasharray="6,4" marker-end="url(#arr-blue)"/>
  <path d="M 480 215 L 480 185" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  
  <path d="M 420 235 A 25 25 0 0 1 460 235" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-black)"/>
  <path d="M 500 235 A 25 25 0 0 0 540 235" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-black)"/>

  <text x="480" y="380" font-size="13" text-anchor="middle" fill="#1a1a1a">Розмикання зубів збільшує</text>
  <text x="480" y="398" font-size="13" text-anchor="middle" fill="#1a1a1a">об'єм, створюючи розрідження</text>
  <text x="480" y="425" font-size="13" text-anchor="middle" fill="#1a1a1a">Герметичні порожнини між</text>
  <text x="480" y="442" font-size="13" text-anchor="middle" fill="#1a1a1a">зубами переносять повітря</text>
  <text x="480" y="490" font-size="14" font-weight="bold" text-anchor="middle" fill="#27ae60">Відбувається всмоктування</text>

  <!-- Panel 3: Diaphragm -->
  <rect x="650" y="90" width="280" height="440" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="8"/>
  <text x="790" y="125" font-size="14" font-weight="bold" text-anchor="middle" fill="#27ae60">Діафрагмова помпа</text>
  <text x="790" y="145" font-size="12" text-anchor="middle" fill="#27ae60">(Об'ємне витіснення)</text>
  
  <text x="755" y="165" font-size="12" text-anchor="middle" fill="#6b7280">Вхід</text>
  <text x="825" y="165" font-size="12" text-anchor="middle" fill="#6b7280">Вихід</text>
  
  <rect x="730" y="210" width="120" height="80" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 730 290 Q 790 330 850 290" fill="#eaf0fd" stroke="#2457d6" stroke-width="4"/>
  <path d="M 730 290 L 850 290" fill="none" stroke="#d0d7de" stroke-width="2" stroke-dasharray="4,4"/>
  
  <rect x="785" y="310" width="10" height="35" fill="#d0d7de" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="790" cy="345" r="15" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="790" cy="345" r="4" fill="#1a1a1a"/>
  <path d="M 810 300 L 810 325" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-black)"/>
  
  <rect x="745" y="200" width="20" height="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 745 210 L 760 225" fill="none" stroke="#27ae60" stroke-width="3"/>
  <path d="M 755 180 L 755 205" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  
  <rect x="815" y="200" width="20" height="10" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 815 210 L 835 210" fill="none" stroke="#c0392b" stroke-width="3"/>
  
  <path d="M 755 230 L 755 250 Q 755 270 780 270 L 800 270" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <text x="790" y="380" font-size="13" text-anchor="middle" fill="#1a1a1a">Прогин еластомірної мембрани</text>
  <text x="790" y="398" font-size="13" text-anchor="middle" fill="#1a1a1a">збільшує об'єм камери</text>
  <text x="790" y="425" font-size="13" text-anchor="middle" fill="#1a1a1a">Пелюсткові клапани задають</text>
  <text x="790" y="442" font-size="13" text-anchor="middle" fill="#1a1a1a">односторонній рух повітря</text>
  <text x="790" y="490" font-size="14" font-weight="bold" text-anchor="middle" fill="#27ae60">Відбувається всмоктування</text>
</svg>
