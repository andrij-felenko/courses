<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Marker Definitions -->
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="500" fill="#ffffff"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема силового каскаду керування помпою RS-360SH на N-MOSFET</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">ШІМ-сигнал МК керує затвором ключа, D₁ гасить ЕРС самоіндукції, C₁ і C₂ фільтрують завади</text>

  <!-- ==================== FUNCTIONAL ZONE 1: MICROCONTROLLER ==================== -->
  <rect x="25" y="72" width="210" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="130" y="94" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Мікроконтролер (МК)</text>
  <text x="130" y="110" font-size="12" fill="#6b7280" text-anchor="middle">Логічний рівень 3.3V / 5V</text>

  <!-- MCU IC Chip Box -->
  <rect x="45" y="125" width="170" height="160" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="130" y="146" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ESP32 / STM32</text>

  <!-- GPIO Pin Box & Label -->
  <text x="58" y="192" font-size="12" fill="#1a1a1a">Сигнал:</text>
  <rect x="115" y="175" width="85" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="157.5" y="192" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">GPIO (PWM)</text>

  <!-- MCU GND Pin Box & Label -->
  <text x="58" y="252" font-size="12" fill="#6b7280">Земля:</text>
  <rect x="115" y="235" width="85" height="26" rx="4" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.2"/>
  <text x="157.5" y="252" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">GND</text>

  <!-- MCU Panel Footer Annotations -->
  <text x="130" y="330" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Плавний пуск</text>
  <text x="130" y="348" font-size="12" fill="#6b7280" text-anchor="middle">(Soft Start)</text>
  <text x="130" y="366" font-size="12" fill="#6b7280" text-anchor="middle">без гідроударів</text>

  <!-- ==================== FUNCTIONAL ZONE 2: MOSFET SWITCH ==================== -->
  <rect x="260" y="72" width="280" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="400" y="94" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Каскад ключа (MOSFET)</text>
  <text x="400" y="110" font-size="12" fill="#6b7280" text-anchor="middle">Комутація струму помпи</text>

  <!-- MOSFET Chip Header -->
  <text x="400" y="136" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">IRLZ44N (N-MOSFET)</text>
  <text x="400" y="152" font-size="12" fill="#6b7280" text-anchor="middle">Logic-Level керування</text>

  <!-- Gate Series Resistor R_G -->
  <text x="292.5" y="170" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">R_G = 100 Ω</text>
  <rect x="270" y="178" width="45" height="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="292.5" y="214" font-size="12" fill="#6b7280" text-anchor="middle">Захист МК</text>
  <line x1="315" y1="188" x2="360" y2="188" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Gate Pull-down Resistor R_GS -->
  <text x="342" y="252" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">R_GS = 10 kΩ</text>
  <text x="342" y="270" font-size="12" fill="#6b7280" text-anchor="end">Фіксація OFF</text>
  <rect x="350" y="235" width="20" height="45" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="360" y1="188" x2="360" y2="235" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- MOSFET Schematic Symbol -->
  <!-- Gate Plate -->
  <line x1="390" y1="175" x2="390" y2="201" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Channel Plate -->
  <line x1="396" y1="175" x2="396" y2="201" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Gate Input Wire & Pin Label -->
  <line x1="360" y1="188" x2="390" y2="188" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="360" cy="188" r="3.5" fill="#1a1a1a"/>
  <text x="382" y="182" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">G</text>

  <!-- Substrate Connection & Arrow -->
  <polygon points="396,188 406,184 406,192" fill="#1a1a1a"/>
  <line x1="406" y1="188" x2="416" y2="188" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="416" y1="188" x2="416" y2="201" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Drain Line out & Pin Label -->
  <line x1="396" y1="175" x2="425" y2="175" stroke="#1a1a1a" stroke-width="2"/>
  <text x="432" y="172" font-size="12" font-weight="bold" fill="#1a1a1a">D</text>

  <!-- Source Line out & Pin Label -->
  <line x1="396" y1="201" x2="425" y2="201" stroke="#1a1a1a" stroke-width="2"/>
  <text x="434" y="214" font-size="12" font-weight="bold" fill="#1a1a1a">S</text>

  <!-- Integrated Body Diode -->
  <line x1="425" y1="175" x2="450" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="450" y1="175" x2="450" y2="183" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="443" y1="183" x2="457" y2="183" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="450,183 443,195 457,195" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="450" y1="195" x2="450" y2="201" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="425" y1="201" x2="450" y2="201" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="464" y="192" font-size="12" fill="#6b7280">Body Diode</text>

  <!-- Panel 2 Footer Annotations -->
  <text x="325" y="338" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Керування V_GS</text>
  <text x="325" y="356" font-size="12" fill="#6b7280" text-anchor="middle">3.3V / 5V (Logic)</text>
  <text x="325" y="374" font-size="12" fill="#6b7280" text-anchor="middle">повне відкриття</text>

  <!-- ==================== FUNCTIONAL ZONE 3: LOAD & PROTECTION ==================== -->
  <rect x="565" y="72" width="375" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="752.5" y="94" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Навантаження та захист</text>
  <text x="752.5" y="110" font-size="12" fill="#6b7280" text-anchor="middle">Гідравлічна помпа та фільтри</text>

  <!-- Power Rail (+12V DC) -->
  <line x1="580" y1="145" x2="915" y2="145" stroke="#c0392b" stroke-width="2.5"/>
  <rect x="840" y="123" width="75" height="22" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="877.5" y="138" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+12V DC</text>

  <!-- Self-Induction Loop Arrow (Green Dashed) -->
  <path d="M 680,145 C 680,128 590,128 590,145" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arr-green)"/>
  <text x="635" y="123" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Струм самоіндукції I_L</text>

  <!-- Branch 1: Flyback Schottky Diode D_1 -->
  <line x1="590" y1="145" x2="590" y2="185" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="590" y1="205" x2="590" y2="275" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="590" cy="145" r="3.5" fill="#1a1a1a"/>
  <circle cx="590" cy="275" r="3.5" fill="#1a1a1a"/>

  <!-- Schottky Diode Symbol -->
  <line x1="580" y1="185" x2="600" y2="185" stroke="#27ae60" stroke-width="2.5"/>
  <line x1="580" y1="185" x2="580" y2="191" stroke="#27ae60" stroke-width="2"/>
  <line x1="600" y1="185" x2="600" y2="179" stroke="#27ae60" stroke-width="2"/>
  <polygon points="590,185 580,205 600,205" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>

  <!-- Diode Labels -->
  <text x="598" y="192" font-size="12" font-weight="bold" fill="#27ae60">D₁ (SS34)</text>
  <text x="598" y="208" font-size="12" fill="#6b7280">Демпфер</text>
  <text x="598" y="222" font-size="12" fill="#6b7280">ЕРС</text>

  <!-- Branch 2: Motor RS-360SH -->
  <line x1="680" y1="145" x2="680" y2="185" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="680" y1="229" x2="680" y2="275" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="680" cy="145" r="3.5" fill="#1a1a1a"/>
  <circle cx="680" cy="275" r="3.5" fill="#1a1a1a"/>

  <!-- Motor Circle Symbol -->
  <circle cx="680" cy="207" r="22" fill="#ffffff" stroke="#2457d6" stroke-width="2.5"/>
  <text x="680" y="213" font-size="16" font-weight="bold" fill="#2457d6" text-anchor="middle">M</text>
  <text x="666" y="172" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="end">+</text>
  <text x="666" y="244" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="end">−</text>

  <!-- Motor Labels -->
  <text x="680" y="298" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Помпа RS-360SH</text>
  <text x="680" y="316" font-size="12" fill="#6b7280" text-anchor="middle">Індуктивне навантаження</text>

  <!-- Branch 3: Ceramic Decoupling Capacitor C_1 -->
  <line x1="770" y1="145" x2="770" y2="196" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="770" y1="206" x2="770" y2="275" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="770" cy="145" r="3.5" fill="#1a1a1a"/>
  <circle cx="770" cy="275" r="3.5" fill="#1a1a1a"/>

  <!-- Ceramic Capacitor Plates -->
  <line x1="760" y1="196" x2="780" y2="196" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="760" y1="206" x2="780" y2="206" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- C_1 Labels -->
  <text x="778" y="175" font-size="12" font-weight="bold" fill="#1a1a1a">C₁ = 0.1 µF</text>
  <text x="778" y="189" font-size="12" fill="#6b7280">ВЧ-фільтр</text>

  <!-- Branch 4: Bulk Electrolytic Capacitor C_2 -->
  <line x1="860" y1="145" x2="860" y2="196" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="860" y1="206" x2="860" y2="440" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="860" cy="145" r="3.5" fill="#1a1a1a"/>
  <circle cx="860" cy="440" r="3.5" fill="#1a1a1a"/>

  <!-- Electrolytic Capacitor Plates -->
  <line x1="850" y1="196" x2="870" y2="196" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="850" y1="206" x2="870" y2="206" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="874" y="188" font-size="12" font-weight="bold" fill="#c0392b">+</text>

  <!-- C_2 Labels -->
  <text x="874" y="204" font-size="12" font-weight="bold" fill="#1a1a1a">C₂ = 220 µF</text>
  <text x="874" y="220" font-size="12" fill="#6b7280">Електроліт</text>

  <!-- Panel 3 Footer Annotations -->
  <text x="752.5" y="348" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Захист ключа від V_spikes</text>
  <text x="752.5" y="366" font-size="12" fill="#6b7280" text-anchor="middle">шунтування викидів ЕРС</text>

  <!-- ==================== INTER-PANEL WIRES & SIGNALS ==================== -->
  <!-- PWM Connection Line from MCU GPIO to R_G -->
  <line x1="200" y1="188" x2="270" y2="188" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="235" y="180" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ШІМ</text>

  <!-- Drain Bus Line (MOSFET D -> Panel 3 Load Node) -->
  <line x1="425" y1="175" x2="590" y2="175" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="590" y1="175" x2="590" y2="275" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="590" y1="275" x2="770" y2="275" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="590" cy="175" r="3.5" fill="#2457d6"/>
  <circle cx="590" cy="275" r="3.5" fill="#2457d6"/>
  <text x="490" y="166" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вузол D (Drain)</text>

  <!-- Ground Line Connections to Common GND Rail -->
  <!-- MCU GND Line -->
  <line x1="157.5" y1="261" x2="157.5" y2="295" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="157.5" y1="295" x2="42" y2="295" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="42" y1="295" x2="42" y2="440" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="42" cy="440" r="3.5" fill="#1a1a1a"/>

  <!-- MOSFET Source & R_GS GND Line -->
  <line x1="360" y1="280" x2="360" y2="295" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="360" y1="295" x2="425" y2="295" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="425" y1="201" x2="425" y2="440" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="425" cy="295" r="3.5" fill="#1a1a1a"/>
  <circle cx="425" cy="440" r="3.5" fill="#1a1a1a"/>

  <!-- Common Ground Bus Rail (GND) -->
  <line x1="35" y1="440" x2="925" y2="440" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- Ground Symbol Center -->
  <line x1="480" y1="440" x2="480" y2="452" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="465" y1="452" x2="495" y2="452" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="471" y1="457" x2="489" y2="457" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="477" y1="462" x2="483" y2="462" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Common GND Text Label -->
  <text x="480" y="478" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Спільна шина заземлення (Common GND)</text>
</svg>
