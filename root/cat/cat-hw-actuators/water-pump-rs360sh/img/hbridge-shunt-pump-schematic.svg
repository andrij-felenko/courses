<svg viewBox="0 0 960 560" width="960" height="560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <text x="480" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Принципова електрична схема керування помпою</text>
  <text x="480" y="65" text-anchor="middle" font-size="13" fill="#6b7280">Реверсивний H-міст із шунтом струму, RC-фільтром та індикацією</text>

  <!-- Microcontroller -->
  <rect x="40" y="100" width="160" height="370" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="120" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">MCU</text>
  
  <text x="190" y="155" text-anchor="end" font-size="14" fill="#1a1a1a">IN1</text>
  <text x="190" y="185" text-anchor="end" font-size="14" fill="#1a1a1a">IN2</text>
  <text x="190" y="215" text-anchor="end" font-size="14" fill="#1a1a1a">PWM</text>
  <text x="190" y="285" text-anchor="end" font-size="14" fill="#1a1a1a">ADC_IN</text>
  <text x="190" y="375" text-anchor="end" font-size="14" fill="#1a1a1a">STATUS</text>
  <text x="190" y="425" text-anchor="end" font-size="14" fill="#1a1a1a">ALARM</text>

  <!-- H-Bridge -->
  <rect x="360" y="110" width="140" height="150" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="430" y="140" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">H-Bridge</text>
  
  <text x="370" y="155" font-size="14" fill="#1a1a1a">IN1</text>
  <text x="370" y="185" font-size="14" fill="#1a1a1a">IN2</text>
  <text x="370" y="215" font-size="14" fill="#1a1a1a">PWM</text>
  
  <text x="490" y="175" text-anchor="end" font-size="14" fill="#1a1a1a">OUT1</text>
  <text x="490" y="215" text-anchor="end" font-size="14" fill="#1a1a1a">OUT2</text>
  
  <text x="440" y="125" font-size="14" fill="#1a1a1a">VMOT</text>
  <text x="440" y="250" font-size="14" fill="#1a1a1a">GND</text>

  <!-- Control Wires MCU to H-Bridge -->
  <line x1="200" y1="160" x2="360" y2="160" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="200" y1="190" x2="360" y2="190" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="200" y1="220" x2="360" y2="220" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Power Supply -->
  <line x1="430" y1="90" x2="430" y2="110" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="430" cy="90" r="3" fill="#1a1a1a"/>
  <text x="430" y="80" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">+12V</text>

  <!-- Motor -->
  <circle cx="700" cy="200" r="45" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="700" y="208" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a1a1a">M</text>
  <text x="700" y="270" text-anchor="middle" font-size="14" fill="#6b7280">RS-360SH</text>

  <line x1="500" y1="180" x2="655" y2="180" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="500" y1="220" x2="655" y2="220" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Current Flow Indicators -->
  <line x1="415" y1="95" x2="415" y2="125" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="405" y="105" text-anchor="end" font-size="14" font-style="italic" fill="#2457d6">I<tspan baseline-shift="sub" font-size="10">mot</tspan></text>

  <line x1="530" y1="165" x2="570" y2="165" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="570" y1="235" x2="530" y2="235" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  
  <line x1="450" y1="270" x2="450" y2="305" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="460" y="295" font-size="14" font-style="italic" fill="#2457d6">I<tspan baseline-shift="sub" font-size="10">shunt</tspan></text>

  <!-- Shunt Resistor -->
  <line x1="430" y1="260" x2="430" y2="320" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="415" y="320" width="30" height="60" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="460" y="355" font-size="14" font-weight="bold" fill="#2457d6">R_shunt</text>
  <line x1="430" y1="380" x2="430" y2="420" stroke="#1a1a1a" stroke-width="2"/>
  
  <line x1="410" y1="420" x2="450" y2="420" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="418" y1="428" x2="442" y2="428" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="426" y1="436" x2="434" y2="436" stroke="#1a1a1a" stroke-width="2"/>

  <!-- RC Filter -->
  <circle cx="430" cy="290" r="4" fill="#1a1a1a"/>
  <line x1="430" y1="290" x2="360" y2="290" stroke="#1a1a1a" stroke-width="2"/>
  
  <rect x="310" y="280" width="50" height="20" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
  <text x="335" y="270" text-anchor="middle" font-size="14" fill="#1a1a1a">R_filt</text>
  
  <line x1="310" y1="290" x2="280" y2="290" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="280" cy="290" r="4" fill="#1a1a1a"/>
  
  <line x1="280" y1="290" x2="240" y2="290" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="240" cy="290" r="4" fill="#1a1a1a"/>
  
  <line x1="240" y1="290" x2="200" y2="290" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Capacitor C_filt -->
  <line x1="280" y1="290" x2="280" y2="340" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="265" y1="340" x2="295" y2="340" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="265" y1="348" x2="295" y2="348" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="280" y1="348" x2="280" y2="390" stroke="#1a1a1a" stroke-width="2"/>
  <text x="298" y="330" font-size="14" fill="#1a1a1a">C_filt</text>
  
  <line x1="265" y1="390" x2="295" y2="390" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="272" y1="398" x2="288" y2="398" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="278" y1="406" x2="282" y2="406" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Zener Diode 3.3V -->
  <line x1="240" y1="290" x2="240" y2="330" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="225" y1="330" x2="255" y2="330" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M225,335 L225,330 L255,330 L255,325" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  <polygon points="240,330 228,348 252,348" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="240" y1="348" x2="240" y2="390" stroke="#1a1a1a" stroke-width="2"/>
  <text x="220" y="335" text-anchor="end" font-size="14" fill="#1a1a1a">3.3V Zener</text>
  
  <line x1="225" y1="390" x2="255" y2="390" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="232" y1="398" x2="248" y2="398" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="238" y1="406" x2="242" y2="406" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Status LED (Green) -->
  <line x1="200" y1="380" x2="240" y2="380" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="240" y="370" width="30" height="20" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="270" y1="380" x2="290" y2="380" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="290,370 290,390 310,380" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <line x1="310" y1="370" x2="310" y2="390" stroke="#27ae60" stroke-width="2"/>
  
  <line x1="298" y1="365" x2="304" y2="359" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="305" y1="365" x2="311" y2="359" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  
  <line x1="310" y1="380" x2="330" y2="380" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="330" y1="380" x2="330" y2="400" stroke="#1a1a1a" stroke-width="2"/>
  
  <line x1="320" y1="400" x2="340" y2="400" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="324" y1="408" x2="336" y2="408" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="328" y1="416" x2="332" y2="416" stroke="#1a1a1a" stroke-width="2"/>
  
  <text x="350" y="385" font-size="14" font-weight="bold" fill="#27ae60">Status</text>

  <!-- Alarm LED (Red) -->
  <line x1="200" y1="430" x2="240" y2="430" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="240" y="420" width="30" height="20" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="270" y1="430" x2="290" y2="430" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="290,420 290,440 310,430" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <line x1="310" y1="420" x2="310" y2="440" stroke="#c0392b" stroke-width="2"/>
  
  <line x1="298" y1="415" x2="304" y2="409" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="305" y1="415" x2="311" y2="409" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  
  <line x1="310" y1="430" x2="330" y2="430" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="330" y1="430" x2="330" y2="450" stroke="#1a1a1a" stroke-width="2"/>
  
  <line x1="320" y1="450" x2="340" y2="450" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="324" y1="458" x2="336" y2="458" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="328" y1="466" x2="332" y2="466" stroke="#1a1a1a" stroke-width="2"/>
  
  <text x="350" y="435" font-size="14" font-weight="bold" fill="#c0392b">Alarm</text>

</svg>
