<svg viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Електрична схема підключення помпи RS-360SH</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Підключення вимагає захисту від зворотного струму, гасіння іскор та струмового запасу ключа до 3 А</text>

  <!-- Left Panel -->
  <rect x="50" y="120" width="360" height="230" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="70" y="150" font-size="14" font-weight="bold" fill="#1a1a1a">Струми навантаження (при 12 В)</text>

  <rect x="70" y="170" width="320" height="40" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="85" y="195" font-size="13" fill="#6b7280">Холостий хід (без води):</text>
  <text x="375" y="195" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="end">0.2 – 0.3 А</text>

  <rect x="70" y="220" width="320" height="40" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="85" y="245" font-size="13" fill="#6b7280">Номінальне (прокачування):</text>
  <text x="375" y="245" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="end">0.5 – 1.0 А</text>

  <rect x="70" y="270" width="320" height="40" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="85" y="295" font-size="13" fill="#c0392b" font-weight="bold">Пуск / заклинювання:</text>
  <text x="375" y="295" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="end">2.5 – 3.0 А</text>

  <text x="230" y="335" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Блок живлення і ключ повинні мати запас до 3 А</text>

  <!-- Circuit VCC -->
  <line x1="700" y1="100" x2="700" y2="140" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="700" cy="96" r="4" fill="#c0392b"/>
  <text x="700" y="85" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">+12 В</text>

  <!-- Top Line -->
  <line x1="560" y1="140" x2="820" y2="140" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="560" cy="140" r="3" fill="#1a1a1a"/>
  <circle cx="700" cy="140" r="3" fill="#1a1a1a"/>
  <circle cx="820" cy="140" r="3" fill="#1a1a1a"/>

  <!-- Bottom Line -->
  <line x1="560" y1="240" x2="820" y2="240" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="560" cy="240" r="3" fill="#1a1a1a"/>
  <circle cx="700" cy="240" r="3" fill="#1a1a1a"/>
  <circle cx="820" cy="240" r="3" fill="#1a1a1a"/>

  <!-- Diode -->
  <line x1="560" y1="140" x2="560" y2="180" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="560" y1="200" x2="560" y2="240" stroke="#1a1a1a" stroke-width="2"/>
  <polygon points="550,200 570,200 560,180" fill="#1a1a1a"/>
  <line x1="545" y1="180" x2="575" y2="180" stroke="#1a1a1a" stroke-width="2"/>
  <text x="540" y="195" font-size="12" fill="#6b7280" text-anchor="end">Захисний діод</text>
  <text x="540" y="210" font-size="12" fill="#6b7280" text-anchor="end">зворотного струму</text>

  <!-- Motor -->
  <line x1="700" y1="140" x2="700" y2="160" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="700" y1="220" x2="700" y2="240" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="700" cy="190" r="30" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="700" y="197" font-size="20" font-weight="bold" fill="#1a1a1a" text-anchor="middle">M</text>
  <text x="715" y="155" font-size="16" font-weight="bold" fill="#c0392b">+</text>
  <text x="740" y="185" font-size="13" font-weight="bold" fill="#1a1a1a">Помпа</text>
  <text x="740" y="200" font-size="13" fill="#1a1a1a">RS-360SH</text>

  <!-- Capacitor -->
  <line x1="820" y1="140" x2="820" y2="185" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="820" y1="195" x2="820" y2="240" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="805" y1="185" x2="835" y2="185" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="805" y1="195" x2="835" y2="195" stroke="#1a1a1a" stroke-width="2"/>
  <text x="845" y="190" font-size="12" fill="#6b7280">Керамічний</text>
  <text x="845" y="205" font-size="12" fill="#6b7280">конденсатор</text>
  <text x="845" y="220" font-size="12" fill="#6b7280">(гасіння іскор)</text>

  <!-- MOSFET Block -->
  <line x1="700" y1="240" x2="700" y2="270" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="660" y="270" width="80" height="60" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="700" y="295" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">N-CH</text>
  <text x="700" y="315" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">MOSFET</text>

  <text x="710" y="265" font-size="12" fill="#6b7280">D</text>
  <text x="710" y="345" font-size="12" fill="#6b7280">S</text>
  <text x="640" y="290" font-size="12" fill="#6b7280">G</text>

  <!-- GND Connection -->
  <line x1="700" y1="330" x2="700" y2="360" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="680" y1="360" x2="720" y2="360" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="690" y1="365" x2="710" y2="365" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="695" y1="370" x2="705" y2="370" stroke="#1a1a1a" stroke-width="2"/>

  <!-- MCU Control Block -->
  <rect x="480" y="285" width="140" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="550" y="305" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">MCU (ШІМ / GPIO)</text>

  <!-- Control Line -->
  <line x1="620" y1="300" x2="660" y2="300" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
</svg>
