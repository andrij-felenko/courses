<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Навантажувальні характеристики помпи RS-360SH: Q(H) та I(H) при 6 В, 9 В і 12 В</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Зі зростанням напору H витрата Q спадає до нуля, а опір ротора знижує проти-ЕРС eb і збільшує струм I</text>

  <!-- Верхня плашка легенди графіка -->
  <rect x="85" y="74" width="420" height="28" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <line x1="97" y1="88" x2="117" y2="88" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="122" y="92" font-size="12" font-weight="700" fill="#1a1a1a">Q (суцільна)</text>
  <line x1="205" y1="88" x2="225" y2="88" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="230" y="92" font-size="12" font-weight="700" fill="#1a1a1a">I (пунктир)</text>
  <circle cx="315" cy="88" r="4" fill="#2457d6"/>
  <text x="323" y="92" font-size="12" font-weight="700" fill="#2457d6">12 В</text>
  <circle cx="375" cy="88" r="4" fill="#27ae60"/>
  <text x="383" y="92" font-size="12" font-weight="700" fill="#27ae60">9 В</text>
  <circle cx="430" cy="88" r="4" fill="#c0392b"/>
  <text x="438" y="92" font-size="12" font-weight="700" fill="#c0392b">6 В</text>

  <!-- Рамка графіка -->
  <rect x="85" y="115" width="420" height="270" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.2" rx="4"/>

  <!-- Сітка графіка горизонтальна (Q та I) -->
  <line x1="85" y1="169" x2="505" y2="169" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="85" y1="223" x2="505" y2="223" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="85" y1="277" x2="505" y2="277" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="85" y1="331" x2="505" y2="331" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Сітка графіка вертикальна (H) -->
  <line x1="160" y1="115" x2="160" y2="385" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="235" y1="115" x2="235" y2="385" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="310" y1="115" x2="310" y2="385" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="385" y1="115" x2="385" y2="385" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Вертикальні лінії зв'язку: нульовий потік Q=0 до макс. робочого струму -->
  <line x1="460" y1="128.5" x2="460" y2="385" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line x1="362.5" y1="196" x2="362.5" y2="385" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="4,4"/>
  <line x1="257.5" y1="250" x2="257.5" y2="385" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4,4"/>

  <!-- Криві витрати Q(H) - суцільні -->
  <!-- 12 В -->
  <path d="M 85,142 C 160,176 310,264 460,385" fill="none" stroke="#2457d6" stroke-width="2.6"/>
  <!-- 9 В -->
  <path d="M 85,202.8 C 160,239 270,305 362.5,385" fill="none" stroke="#27ae60" stroke-width="2.6"/>
  <!-- 6 В -->
  <path d="M 85,263.5 C 140,295 200,340 257.5,385" fill="none" stroke="#c0392b" stroke-width="2.6"/>

  <!-- Криві струму I(H) - пунктирні -->
  <!-- 12 В -->
  <path d="M 85,290.5 C 160,263.5 310,201 460,128.5" fill="none" stroke="#2457d6" stroke-width="2.2" stroke-dasharray="6,4"/>
  <!-- 9 В -->
  <path d="M 85,309.4 C 160,282.4 270,240 362.5,196" fill="none" stroke="#27ae60" stroke-width="2.2" stroke-dasharray="6,4"/>
  <!-- 6 В -->
  <path d="M 85,325.6 C 140,300 200,275 257.5,250" fill="none" stroke="#c0392b" stroke-width="2.2" stroke-dasharray="6,4"/>

  <!-- Маркери робочих точок: вільний потік (H = 0) -->
  <circle cx="85" cy="142" r="4" fill="#2457d6"/>
  <circle cx="85" cy="202.8" r="4" fill="#27ae60"/>
  <circle cx="85" cy="263.5" r="4" fill="#c0392b"/>

  <circle cx="85" cy="290.5" r="3.5" fill="#2457d6"/>
  <circle cx="85" cy="309.4" r="3.5" fill="#27ae60"/>
  <circle cx="85" cy="325.6" r="3.5" fill="#c0392b"/>

  <!-- Маркери робочих точок: піковий струм при макс. напорі -->
  <circle cx="460" cy="128.5" r="4" fill="#2457d6"/>
  <circle cx="362.5" cy="196" r="4" fill="#27ae60"/>
  <circle cx="257.5" cy="250" r="4" fill="#c0392b"/>

  <!-- Маркери точок нульового потоку Q = 0 (H_max) -->
  <circle cx="460" cy="385" r="4.5" fill="#2457d6" stroke="white" stroke-width="1.5"/>
  <circle cx="362.5" cy="385" r="4.5" fill="#27ae60" stroke="white" stroke-width="1.5"/>
  <circle cx="257.5" cy="385" r="4.5" fill="#c0392b" stroke="white" stroke-width="1.5"/>

  <!-- Ліва вісь Y: Q (витрата) -->
  <text x="85" y="108" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Q (л/хв)</text>
  <line x1="80" y1="115" x2="85" y2="115" stroke="#94a3b8" stroke-width="1"/>
  <line x1="80" y1="182.5" x2="85" y2="182.5" stroke="#94a3b8" stroke-width="1"/>
  <line x1="80" y1="250" x2="85" y2="250" stroke="#94a3b8" stroke-width="1"/>
  <line x1="80" y1="317.5" x2="85" y2="317.5" stroke="#94a3b8" stroke-width="1"/>
  <line x1="80" y1="385" x2="85" y2="385" stroke="#94a3b8" stroke-width="1"/>

  <text x="75" y="119" font-size="12" fill="#6b7280" text-anchor="end">2.0</text>
  <text x="75" y="186.5" font-size="12" fill="#6b7280" text-anchor="end">1.5</text>
  <text x="75" y="254" font-size="12" fill="#6b7280" text-anchor="end">1.0</text>
  <text x="75" y="321.5" font-size="12" fill="#6b7280" text-anchor="end">0.5</text>
  <text x="75" y="389" font-size="12" fill="#6b7280" text-anchor="end">0.0</text>

  <!-- Права вісь Y: I (струм) -->
  <text x="505" y="108" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">I (А)</text>
  <line x1="505" y1="115" x2="510" y2="115" stroke="#94a3b8" stroke-width="1"/>
  <line x1="505" y1="169" x2="510" y2="169" stroke="#94a3b8" stroke-width="1"/>
  <line x1="505" y1="223" x2="510" y2="223" stroke="#94a3b8" stroke-width="1"/>
  <line x1="505" y1="277" x2="510" y2="277" stroke="#94a3b8" stroke-width="1"/>
  <line x1="505" y1="331" x2="510" y2="331" stroke="#94a3b8" stroke-width="1"/>
  <line x1="505" y1="385" x2="510" y2="385" stroke="#94a3b8" stroke-width="1"/>

  <text x="515" y="119" font-size="12" fill="#6b7280" text-anchor="start">1.0</text>
  <text x="515" y="173" font-size="12" fill="#6b7280" text-anchor="start">0.8</text>
  <text x="515" y="227" font-size="12" fill="#6b7280" text-anchor="start">0.6</text>
  <text x="515" y="281" font-size="12" fill="#6b7280" text-anchor="start">0.4</text>
  <text x="515" y="335" font-size="12" fill="#6b7280" text-anchor="start">0.2</text>
  <text x="515" y="389" font-size="12" fill="#6b7280" text-anchor="start">0.0</text>

  <!-- Нижня вісь X: H (напір) -->
  <line x1="85" y1="385" x2="85" y2="390" stroke="#94a3b8" stroke-width="1"/>
  <line x1="160" y1="385" x2="160" y2="390" stroke="#94a3b8" stroke-width="1"/>
  <line x1="235" y1="385" x2="235" y2="390" stroke="#94a3b8" stroke-width="1"/>
  <line x1="257.5" y1="385" x2="257.5" y2="390" stroke="#c0392b" stroke-width="1.2"/>
  <line x1="310" y1="385" x2="310" y2="390" stroke="#94a3b8" stroke-width="1"/>
  <line x1="362.5" y1="385" x2="362.5" y2="390" stroke="#27ae60" stroke-width="1.2"/>
  <line x1="385" y1="385" x2="385" y2="390" stroke="#94a3b8" stroke-width="1"/>
  <line x1="460" y1="385" x2="460" y2="390" stroke="#2457d6" stroke-width="1.2"/>
  <line x1="505" y1="385" x2="505" y2="390" stroke="#94a3b8" stroke-width="1"/>

  <text x="85" y="405" font-size="12" fill="#6b7280" text-anchor="middle">0</text>
  <text x="160" y="405" font-size="12" fill="#6b7280" text-anchor="middle">0.5</text>
  <text x="235" y="405" font-size="12" fill="#6b7280" text-anchor="middle">1.0</text>
  <text x="257.5" y="405" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">1.15</text>
  <text x="310" y="405" font-size="12" fill="#6b7280" text-anchor="middle">1.5</text>
  <text x="362.5" y="405" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">1.85</text>
  <text x="385" y="405" font-size="12" fill="#6b7280" text-anchor="middle">2.0</text>
  <text x="460" y="405" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">2.5</text>
  <text x="505" y="405" font-size="12" fill="#6b7280" text-anchor="middle">2.8</text>

  <text x="295" y="428" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Створюваний напір H, м (висота підйому водяного стовпа)</text>

  <!-- Стрілка напрямку зростання опору -->
  <line x1="120" y1="448" x2="470" y2="448" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>
  <text x="295" y="468" font-size="12" fill="#6b7280" text-anchor="middle">Напрямок зростання гідравлічного опору магістралі (протитиску)</text>

  <!-- Праві інформаційні картки -->
  <!-- Картка 1: 12 В -->
  <rect x="560" y="74" width="375" height="88" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="575" y="95" font-size="13" font-weight="700" fill="#2457d6">Живлення 12 В: Номінальний робочий режим</text>
  <text x="575" y="115" font-size="12" fill="#1a1a1a">• Вільний вилив (H = 0 м): потік Q = 1.8 л/хв, струм I = 0.35 А</text>
  <text x="575" y="134" font-size="12" fill="#1a1a1a">• Макс. напір (H = 2.5 м): точка Q = 0 л/хв, струм I = 0.95 А</text>
  <text x="575" y="152" font-size="12" fill="#6b7280">• Оптимальний ККД гідравліки; пусковий надструм до 2.8 А</text>

  <!-- Картка 2: 9 В -->
  <rect x="560" y="174" width="375" height="88" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="575" y="195" font-size="13" font-weight="700" fill="#27ae60">Живлення 9 В: Проміжний щадний режим</text>
  <text x="575" y="215" font-size="12" fill="#1a1a1a">• Вільний вилив (H = 0 м): потік Q = 1.35 л/хв, струм I = 0.28 А</text>
  <text x="575" y="234" font-size="12" fill="#1a1a1a">• Макс. напір (H = 1.85 м): точка Q = 0 л/хв, струм I = 0.70 А</text>
  <text x="575" y="252" font-size="12" fill="#6b7280">• Знижене теплове навантаження на обмотки мотора та сальники</text>

  <!-- Картка 3: 6 В -->
  <rect x="560" y="274" width="375" height="88" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="575" y="295" font-size="13" font-weight="700" fill="#c0392b">Живлення 6 В: Нижній робочий поріг помпи</text>
  <text x="575" y="315" font-size="12" fill="#1a1a1a">• Вільний вилив (H = 0 м): потік Q = 0.9 л/хв, струм I = 0.22 А</text>
  <text x="575" y="334" font-size="12" fill="#1a1a1a">• Макс. напір (H = 1.15 м): точка Q = 0 л/хв, струм I = 0.50 А</text>
  <text x="575" y="352" font-size="12" fill="#6b7280">• Нижче 6 В — різке падіння ККД: момент не долає тертя камери</text>

  <!-- Картка 4: Фізичний закон навантаження -->
  <rect x="560" y="374" width="375" height="96" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="575" y="395" font-size="13" font-weight="700" fill="#1a1a1a">Електродинаміка навантаження двигуна</text>
  <text x="575" y="415" font-size="12" fill="#1a1a1a">• Рівняння струму: I = (U - eb) / Ra (де eb ~ ω — проти-ЕРС)</text>
  <text x="575" y="434" font-size="12" fill="#1a1a1a">• Опір потоку (↑H) уповільнює ротор (↓ω) → спад eb → зростання I</text>
  <text x="575" y="453" font-size="12" font-weight="700" fill="#c0392b">• Заклинювання шестерень: ротор стоїть (eb = 0) → I до 3.0 А</text>
</svg>
