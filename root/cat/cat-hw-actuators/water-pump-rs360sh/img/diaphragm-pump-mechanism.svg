<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принцип роботи діафрагмової помпи RS-360SH</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Ексцентрик перетворює обертання вала у рух мембрани, керуючи клапанами</text>

  <!-- ==================== PANEL 1: INTAKE PHASE ==================== -->
  <rect x="30" y="75" width="435" height="390" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Title Badge 1 -->
  <rect x="45" y="88" width="405" height="30" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="247.5" y="108" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">ФАЗА 1: Всмоктування (розширення камери)</text>
  <text x="247.5" y="132" font-size="12" fill="#1a1a1a" text-anchor="middle">Тиск у камері P &lt; P_вх  ⇒  Вхідний клапан відкривається</text>

  <!-- Inlet/Outlet Pipe Housing Top Panel 1 -->
  <!-- Left Pipe (Inlet) -->
  <rect x="70" y="155" width="90" height="30" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="115" y="148" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вхід рідини</text>

  <!-- Right Pipe (Outlet) -->
  <rect x="335" y="155" width="90" height="30" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="380" y="148" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Вихід заблоковано</text>
  <!-- Blocked Cross -->
  <path d="M 373,163 L 387,177 M 387,163 L 373,177" stroke="#c0392b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Pump Main Housing & Cavity Panel 1 -->
  <!-- Expanded Chamber Water Fill -->
  <path d="M 160,185 L 160,245 C 160,280 335,280 335,245 L 335,185 Z" fill="#eaf0fd" stroke="none"/>
  <!-- Housing Walls -->
  <path d="M 70,155 L 160,155 L 160,185 M 70,185 L 160,185 L 160,245 M 335,245 L 335,185 L 425,185 M 335,185 L 335,155 L 425,155" fill="none" stroke="#6b7280" stroke-width="2"/>

  <!-- Valve Seats and Valves Panel 1 -->
  <!-- Inlet Valve (OPEN) -->
  <line x1="160" y1="185" x2="178" y2="202" stroke="#27ae60" stroke-width="3.5" stroke-linecap="round"/>
  <text x="115" y="200" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Вхідний клапан</text>
  <text x="115" y="215" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">ВІДКРИТИЙ</text>
  <!-- Flow Arrow entering chamber -->
  <path d="M 80,170 L 155,170 Q 175,170 175,192 L 175,230" fill="none" stroke="#2457d6" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arr-blue)"/>

  <!-- Outlet Valve (CLOSED) -->
  <line x1="335" y1="185" x2="308" y2="185" stroke="#c0392b" stroke-width="3.5" stroke-linecap="round"/>
  <text x="380" y="200" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Вихідний клапан</text>
  <text x="380" y="215" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">ЗАКРИТИЙ</text>

  <!-- Pressure Status Inside Chamber -->
  <text x="247.5" y="205" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Розрядження (P &lt; P_вх)</text>

  <!-- Flexible Diaphragm Panel 1 (Pulled DOWN) -->
  <path d="M 160,245 Q 247.5,280 335,245" fill="none" stroke="#2457d6" stroke-width="4" stroke-linecap="round"/>
  <text x="247.5" y="240" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Еластична мембрана</text>

  <!-- Plunger & Rod Panel 1 -->
  <rect x="235" y="270" width="25" height="8" rx="2" fill="#1a1a1a"/>
  <line x1="247.5" y1="275" x2="247.5" y2="385" stroke="#1a1a1a" stroke-width="3.5"/>

  <!-- Rod Motion Arrow Panel 1 -->
  <line x1="140" y1="280" x2="140" y2="325" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="140" y="340" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Рух штока ↓</text>

  <!-- Eccentric Drive Panel 1 -->
  <circle cx="247.5" cy="365" r="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="247.5" cy="365" r="4" fill="#6b7280"/>
  <!-- Pin at bottom position -->
  <circle cx="247.5" cy="385" r="4.5" fill="#2457d6"/>
  <!-- Eccentric Label Pointer -->
  <line x1="269.5" y1="365" x2="310" y2="365" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="315" y="369" font-size="12" fill="#6b7280" text-anchor="start">Ексцентрик</text>

  <!-- Rotation Arc -->
  <path d="M 233,355 A 18 18 0 0 1 262,355" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- DC Motor Box Panel 1 -->
  <rect x="180" y="415" width="135" height="30" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="247.5" y="435" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">DC-мотор RS-360SH</text>

  <!-- ==================== PANEL 2: DISCHARGE PHASE ==================== -->
  <rect x="495" y="75" width="435" height="390" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Title Badge 2 -->
  <rect x="510" y="88" width="405" height="30" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="712.5" y="108" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">ФАЗА 2: Нагнітання (стискання камери)</text>
  <text x="712.5" y="132" font-size="12" fill="#1a1a1a" text-anchor="middle">Тиск у камері P &gt; P_вих  ⇒  Вихідний клапан відкривається</text>

  <!-- Inlet/Outlet Pipe Housing Top Panel 2 -->
  <!-- Left Pipe (Inlet Blocked) -->
  <rect x="535" y="155" width="90" height="30" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="580" y="148" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Вхід заблоковано</text>
  <!-- Blocked Cross -->
  <path d="M 573,163 L 587,177 M 587,163 L 573,177" stroke="#c0392b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Right Pipe (Outlet Active) -->
  <rect x="800" y="155" width="90" height="30" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="845" y="148" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вихід рідини</text>

  <!-- Pump Main Housing & Cavity Panel 2 -->
  <!-- Compressed Chamber Water Fill -->
  <path d="M 625,185 L 625,245 C 625,220 800,220 800,245 L 800,185 Z" fill="#eaf0fd" stroke="none"/>
  <!-- Housing Walls -->
  <path d="M 535,155 L 625,155 L 625,185 M 535,185 L 625,185 L 625,245 M 800,245 L 800,185 L 890,185 M 800,185 L 800,155 L 890,155" fill="none" stroke="#6b7280" stroke-width="2"/>

  <!-- Valve Seats and Valves Panel 2 -->
  <!-- Inlet Valve (CLOSED) -->
  <line x1="625" y1="185" x2="652" y2="185" stroke="#c0392b" stroke-width="3.5" stroke-linecap="round"/>
  <text x="580" y="200" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Вхідний клапан</text>
  <text x="580" y="215" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">ЗАКРИТИЙ</text>

  <!-- Outlet Valve (OPEN) -->
  <line x1="800" y1="185" x2="782" y2="202" stroke="#27ae60" stroke-width="3.5" stroke-linecap="round"/>
  <text x="845" y="200" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Вихідний клапан</text>
  <text x="845" y="215" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">ВІДКРИТИЙ</text>
  <!-- Flow Arrow exiting chamber -->
  <path d="M 712,225 Q 785,225 785,198 L 785,170 L 860,170" fill="none" stroke="#2457d6" stroke-width="2.5" stroke-dasharray="5 3" marker-end="url(#arr-blue)"/>

  <!-- Pressure Status Inside Chamber -->
  <text x="712.5" y="195" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Тиск (P &gt; P_вих)</text>

  <!-- Flexible Diaphragm Panel 2 (Pushed UP) -->
  <path d="M 625,245 Q 712.5,220 800,245" fill="none" stroke="#2457d6" stroke-width="4" stroke-linecap="round"/>
  <text x="712.5" y="260" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Еластична мембрана</text>

  <!-- Plunger & Rod Panel 2 -->
  <rect x="700" y="218" width="25" height="8" rx="2" fill="#1a1a1a"/>
  <line x1="712.5" y1="223" x2="712.5" y2="345" stroke="#1a1a1a" stroke-width="3.5"/>

  <!-- Rod Motion Arrow Panel 2 -->
  <line x1="605" y1="325" x2="605" y2="280" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="605" y="340" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Рух штока ↑</text>

  <!-- Eccentric Drive Panel 2 -->
  <circle cx="712.5" cy="365" r="22" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="712.5" cy="365" r="4" fill="#6b7280"/>
  <!-- Pin at top position -->
  <circle cx="712.5" cy="345" r="4.5" fill="#27ae60"/>
  <!-- Eccentric Label Pointer -->
  <line x1="734.5" y1="365" x2="775" y2="365" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="780" y="369" font-size="12" fill="#6b7280" text-anchor="start">Ексцентрик</text>

  <!-- Rotation Arc -->
  <path d="M 698,355 A 18 18 0 0 1 727,355" fill="none" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- DC Motor Box Panel 2 -->
  <rect x="645" y="415" width="135" height="30" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="712.5" y="435" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">DC-мотор RS-360SH</text>
</svg>
