<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Definitions for Markers -->
  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-sig" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-pwr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-noise" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Топологія заземлення «Зірка» на платі драйвера помпи</text>
  <text x="480" y="52" font-size="13" text-anchor="middle" fill="#6b7280">Відокремлення силового струму від сигнальної землі запобігає збоям мікроконтролера</text>

  <!-- Outer PCB Container -->
  <rect x="20" y="70" width="920" height="450" rx="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>

  <!-- PCB Badge -->
  <rect x="35" y="80" width="180" height="24" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="125" y="96" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Друкована плата (PCB)</text>

  <!-- LEFT ZONE: Signal Zone (GND_SIG) -->
  <rect x="35" y="115" width="355" height="320" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="102" y="125" width="220" height="26" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="212" y="142" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">СИГНАЛЬНА ЗОНА (GND_SIG)</text>

  <!-- MCU Block -->
  <rect x="50" y="165" width="135" height="135" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="117" y="188" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Мікроконтролер</text>
  <text x="117" y="206" font-size="12" text-anchor="middle" fill="#6b7280">(MCU / ESP32)</text>

  <!-- MCU Pins -->
  <circle cx="185" cy="240" r="4" fill="#2457d6"/>
  <text x="175" y="244" font-size="12" font-weight="bold" text-anchor="end" fill="#2457d6">ШІМ (PWM)</text>

  <circle cx="117" cy="285" r="4" fill="#2457d6"/>
  <text x="117" y="273" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">GND_MCU</text>

  <!-- Resistor R_in Box -->
  <rect x="195" y="230" width="30" height="20" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="210" y="244" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">R_in</text>

  <!-- PWM Traces: MCU -> R_in -> Optocoupler -->
  <line x1="185" y1="240" x2="195" y2="240" stroke="#2457d6" stroke-width="2"/>
  <line x1="225" y1="240" x2="245" y2="240" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-sig)"/>

  <!-- Optocoupler PC817 Block -->
  <rect x="235" y="165" width="140" height="135" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="305" y="188" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Оптопара PC817</text>
  <text x="305" y="206" font-size="12" text-anchor="middle" fill="#6b7280">(Розв'язка)</text>

  <!-- Optocoupler Internal LED & Isolation Barrier -->
  <circle cx="245" cy="240" r="3.5" fill="#2457d6"/>
  <line x1="245" y1="240" x2="257" y2="240" stroke="#2457d6" stroke-width="2"/>
  <polygon points="257,235 257,245 267,240" fill="#2457d6"/>
  <line x1="267" y1="235" x2="267" y2="245" stroke="#2457d6" stroke-width="2"/>
  <line x1="267" y1="240" x2="275" y2="240" stroke="#2457d6" stroke-width="2"/>
  <line x1="275" y1="240" x2="275" y2="285" stroke="#2457d6" stroke-width="2"/>
  <circle cx="275" cy="285" r="4" fill="#2457d6"/>

  <!-- Isolation Barrier Line & Box -->
  <line x1="305" y1="215" x2="305" y2="245" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 3"/>
  <rect x="280" y="245" width="50" height="18" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="0.8"/>
  <text x="305" y="258" font-size="12" text-anchor="middle" fill="#6b7280">Бар'єр</text>
  <line x1="305" y1="263" x2="305" y2="290" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Optocoupler Secondary Output Pin -->
  <circle cx="365" cy="240" r="3.5" fill="#2457d6"/>

  <!-- Signal Ground Traces (GND_SIG) -->
  <line x1="117" y1="285" x2="117" y2="330" stroke="#2457d6" stroke-width="3.5"/>
  <line x1="275" y1="285" x2="275" y2="330" stroke="#2457d6" stroke-width="3.5"/>
  <path d="M 117 330 L 480 330" fill="none" stroke="#2457d6" stroke-width="3.5"/>

  <!-- Signal Ground Description Box -->
  <rect x="50" y="360" width="325" height="55" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="212" y="382" font-size="13" font-weight="bold" text-anchor="middle" fill="#2457d6">Сигнальна земля (GND_SIG)</text>
  <text x="212" y="401" font-size="12" text-anchor="middle" fill="#6b7280">Чистий потенціал: 0 А силового струму</text>

  <!-- Interconnect PWM Gate Signal Line & Label Box -->
  <path d="M 365 240 L 585 240" fill="none" stroke="#2457d6" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#arr-sig)"/>
  <rect x="425" y="205" width="110" height="24" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="221" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">ШІМ Сигнал</text>

  <!-- RIGHT ZONE: Power Zone (GND_PWR) -->
  <rect x="570" y="115" width="355" height="320" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="637" y="125" width="220" height="26" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="747" y="142" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">СИЛОВА ЗОНА (GND_PWR)</text>

  <!-- MOSFET Block -->
  <rect x="585" y="165" width="140" height="135" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
  <text x="655" y="188" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Силовий MOSFET</text>
  <text x="655" y="206" font-size="12" text-anchor="middle" fill="#6b7280">(IRLZ44N)</text>

  <circle cx="585" cy="240" r="4" fill="#2457d6"/>
  <text x="595" y="235" font-size="12" font-weight="bold" fill="#1a1a1a">Gate (G)</text>

  <circle cx="655" cy="285" r="4" fill="#27ae60"/>
  <text x="655" y="273" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">Source (S)</text>

  <circle cx="725" cy="240" r="4" fill="#c0392b"/>
  <text x="715" y="235" font-size="12" font-weight="bold" text-anchor="end" fill="#1a1a1a">Drain (D)</text>

  <!-- Water Pump RS-360SH Block -->
  <rect x="775" y="165" width="140" height="135" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <text x="845" y="186" font-size="13" font-weight="bold" text-anchor="middle" fill="#c0392b">Помпа RS-360SH</text>
  <text x="845" y="204" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">+ Діод Шотткі D1</text>
  <text x="845" y="220" font-size="12" text-anchor="middle" fill="#6b7280">(Гасіння ЕРС)</text>

  <!-- Motor Symbol -->
  <circle cx="845" cy="260" r="16" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="845" y="265" font-size="13" font-weight="bold" text-anchor="middle" fill="#c0392b">M</text>

  <!-- Drain Connection Line -->
  <line x1="725" y1="240" x2="775" y2="240" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-noise)"/>

  <!-- Power Ground Traces (GND_PWR) -->
  <line x1="655" y1="285" x2="655" y2="330" stroke="#27ae60" stroke-width="7"/>
  <path d="M 655 330 L 480 330" fill="none" stroke="#27ae60" stroke-width="7"/>

  <!-- Power Ground Description Box -->
  <rect x="585" y="360" width="325" height="55" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="747" y="382" font-size="13" font-weight="bold" text-anchor="middle" fill="#27ae60">Силова земля (GND_PWR)</text>
  <text x="747" y="401" font-size="12" text-anchor="middle" fill="#6b7280">ШІМ-струм помпи (до 2–3 А)</text>

  <!-- CENTER AREA: Star Point & Power Connector -->
  <!-- Star Ground Box -->
  <rect x="390" y="265" width="180" height="46" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
  <text x="480" y="283" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">ТОЧКА «ЗІРКА» (STAR GND)</text>
  <text x="480" y="301" font-size="12" text-anchor="middle" fill="#1a1a1a">Єдина точка з'єднання</text>

  <line x1="480" y1="311" x2="480" y2="315" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-pwr)"/>

  <!-- Star Node Circle -->
  <circle cx="480" cy="330" r="14" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <circle cx="480" cy="330" r="6" fill="#27ae60"/>

  <!-- Filter Capacitor C_in -->
  <rect x="400" y="380" width="90" height="22" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
  <text x="445" y="395" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">C_in (100 µF)</text>

  <!-- Power Supply Connector -->
  <rect x="410" y="420" width="140" height="80" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="480" y="438" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Вхід живлення</text>

  <!-- VCC (+12V) and GND Terminals -->
  <circle cx="445" cy="460" r="5" fill="#c0392b"/>
  <text x="445" y="488" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">+12V</text>

  <circle cx="515" cy="460" r="5" fill="#27ae60"/>
  <text x="515" y="488" font-size="12" font-weight="bold" text-anchor="middle" fill="#27ae60">GND (0V)</text>

  <!-- Power Supply Connector GND to Star Point Trace -->
  <path d="M 515 455 L 532 455 L 532 330 L 494 330" fill="none" stroke="#1a1a1a" stroke-width="4"/>

  <!-- VCC +12V Trace to Pump Block -->
  <path d="M 445 460 L 425 460 L 425 510 L 895 510 L 895 240 L 875 240" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6 3"/>
  <rect x="635" y="482" width="90" height="22" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="680" y="497" font-size="12" font-weight="bold" text-anchor="middle" fill="#c0392b">+12V VCC</text>
</svg>
