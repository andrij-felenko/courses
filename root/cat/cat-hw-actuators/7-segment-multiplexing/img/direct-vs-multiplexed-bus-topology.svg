<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="510" fill="white"/>

  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Порівняння прямого та мультиплексованого підключення індикаторів</text>
  <text x="480" y="65" font-size="13" fill="#6b7280" text-anchor="middle">Скорочення кількості ліній керування з 32 до 12 за рахунок спільних сегментних шин</text>

  <!-- Left Panel: Direct Connection -->
  <rect x="40" y="85" width="420" height="400" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="8"/>
  <text x="250" y="115" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Пряме підключення</text>
  
  <rect x="150" y="130" width="200" height="24" rx="4" fill="#fdecea"/>
  <text x="250" y="147" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">32 лінії керування</text>

  <!-- Left Panel Displays -->
  <text x="145" y="178" font-size="12" fill="#6b7280" text-anchor="middle">Розряд 1</text>
  <rect x="120" y="190" width="50" height="70" fill="white" stroke="#d0d7de" stroke-width="2" rx="4"/>
  <text x="145" y="235" font-size="28" font-weight="bold" fill="#d0d7de" text-anchor="middle">8.</text>

  <text x="215" y="178" font-size="12" fill="#6b7280" text-anchor="middle">Розряд 2</text>
  <rect x="190" y="190" width="50" height="70" fill="white" stroke="#d0d7de" stroke-width="2" rx="4"/>
  <text x="215" y="235" font-size="28" font-weight="bold" fill="#d0d7de" text-anchor="middle">8.</text>

  <text x="285" y="178" font-size="12" fill="#6b7280" text-anchor="middle">Розряд 3</text>
  <rect x="260" y="190" width="50" height="70" fill="white" stroke="#d0d7de" stroke-width="2" rx="4"/>
  <text x="285" y="235" font-size="28" font-weight="bold" fill="#d0d7de" text-anchor="middle">8.</text>

  <text x="355" y="178" font-size="12" fill="#6b7280" text-anchor="middle">Розряд 4</text>
  <rect x="330" y="190" width="50" height="70" fill="white" stroke="#d0d7de" stroke-width="2" rx="4"/>
  <text x="355" y="235" font-size="28" font-weight="bold" fill="#d0d7de" text-anchor="middle">8.</text>

  <!-- Left Panel MCU -->
  <rect x="80" y="380" width="340" height="80" fill="white" stroke="#1a1a1a" stroke-width="2" rx="6"/>
  <text x="250" y="420" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мікроконтролер</text>
  <text x="250" y="440" font-size="13" fill="#6b7280" text-anchor="middle">4 порти × 8 ліній (всього 32 виводи)</text>

  <!-- Left Panel Wiring -->
  <path d="M145,380 L145,260" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="135" y1="330" x2="155" y2="320" stroke="#1a1a1a" stroke-width="2"/>
  <text x="160" y="328" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">8</text>
  <text x="152" y="275" font-size="12" fill="#1a1a1a" text-anchor="start">SEG 1</text>

  <path d="M215,380 L215,260" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="205" y1="330" x2="225" y2="320" stroke="#1a1a1a" stroke-width="2"/>
  <text x="230" y="328" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">8</text>
  <text x="222" y="275" font-size="12" fill="#1a1a1a" text-anchor="start">SEG 2</text>

  <path d="M285,380 L285,260" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="275" y1="330" x2="295" y2="320" stroke="#1a1a1a" stroke-width="2"/>
  <text x="300" y="328" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">8</text>
  <text x="292" y="275" font-size="12" fill="#1a1a1a" text-anchor="start">SEG 3</text>

  <path d="M355,380 L355,260" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="345" y1="330" x2="365" y2="320" stroke="#1a1a1a" stroke-width="2"/>
  <text x="370" y="328" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">8</text>
  <text x="362" y="275" font-size="12" fill="#1a1a1a" text-anchor="start">SEG 4</text>

  <!-- Right Panel: Multiplexed Connection -->
  <rect x="500" y="85" width="420" height="400" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="8"/>
  <text x="710" y="115" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мультиплексована шина</text>
  
  <rect x="610" y="130" width="200" height="24" rx="4" fill="#e9f7ef"/>
  <text x="710" y="147" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">12 ліній керування</text>

  <!-- Right Panel Displays -->
  <text x="605" y="178" font-size="12" fill="#6b7280" text-anchor="middle">Розряд 1</text>
  <rect x="580" y="190" width="50" height="70" fill="white" stroke="#d0d7de" stroke-width="2" rx="4"/>
  <text x="605" y="235" font-size="28" font-weight="bold" fill="#d0d7de" text-anchor="middle">8.</text>

  <text x="675" y="178" font-size="12" fill="#6b7280" text-anchor="middle">Розряд 2</text>
  <rect x="650" y="190" width="50" height="70" fill="white" stroke="#d0d7de" stroke-width="2" rx="4"/>
  <text x="675" y="235" font-size="28" font-weight="bold" fill="#d0d7de" text-anchor="middle">8.</text>

  <text x="745" y="178" font-size="12" fill="#6b7280" text-anchor="middle">Розряд 3</text>
  <rect x="720" y="190" width="50" height="70" fill="white" stroke="#d0d7de" stroke-width="2" rx="4"/>
  <text x="745" y="235" font-size="28" font-weight="bold" fill="#d0d7de" text-anchor="middle">8.</text>

  <text x="815" y="178" font-size="12" fill="#6b7280" text-anchor="middle">Розряд 4</text>
  <rect x="790" y="190" width="50" height="70" fill="white" stroke="#d0d7de" stroke-width="2" rx="4"/>
  <text x="815" y="235" font-size="28" font-weight="bold" fill="#d0d7de" text-anchor="middle">8.</text>

  <!-- Right Panel MCU -->
  <rect x="540" y="380" width="340" height="80" fill="white" stroke="#1a1a1a" stroke-width="2" rx="6"/>
  <text x="710" y="420" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мікроконтролер</text>
  <text x="710" y="440" font-size="13" fill="#6b7280" text-anchor="middle">8 сегментів + 4 розряди (всього 12)</text>

  <!-- Right Panel Wiring: Segment Bus (Blue) -->
  <path d="M545,380 L545,310 L805,310" stroke="#2457d6" stroke-width="3" fill="none"/>
  
  <line x1="535" y1="350" x2="555" y2="340" stroke="#2457d6" stroke-width="2"/>
  <text x="530" y="348" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="end">8</text>
  <text x="580" y="340" font-size="12" fill="#2457d6" text-anchor="middle">
    <tspan x="580" dy="0">Шина</tspan>
    <tspan x="580" dy="14">сегментів</tspan>
    <tspan x="580" dy="14">(8 ліній)</tspan>
  </text>

  <!-- Right Panel Wiring: Segment Branches -->
  <path d="M595,310 L595,260" stroke="#2457d6" stroke-width="3" fill="none" marker-end="url(#arr-blue)"/>
  <line x1="585" y1="290" x2="605" y2="280" stroke="#2457d6" stroke-width="2"/>
  <text x="580" y="288" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="end">8</text>
  <text x="590" y="275" font-size="12" fill="#2457d6" text-anchor="end">SEG</text>

  <path d="M665,310 L665,260" stroke="#2457d6" stroke-width="3" fill="none" marker-end="url(#arr-blue)"/>
  <line x1="655" y1="290" x2="675" y2="280" stroke="#2457d6" stroke-width="2"/>
  <text x="650" y="288" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="end">8</text>
  <text x="660" y="275" font-size="12" fill="#2457d6" text-anchor="end">SEG</text>

  <path d="M735,310 L735,260" stroke="#2457d6" stroke-width="3" fill="none" marker-end="url(#arr-blue)"/>
  <line x1="725" y1="290" x2="745" y2="280" stroke="#2457d6" stroke-width="2"/>
  <text x="720" y="288" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="end">8</text>
  <text x="730" y="275" font-size="12" fill="#2457d6" text-anchor="end">SEG</text>

  <path d="M805,310 L805,260" stroke="#2457d6" stroke-width="3" fill="none" marker-end="url(#arr-blue)"/>
  <line x1="795" y1="290" x2="815" y2="280" stroke="#2457d6" stroke-width="2"/>
  <text x="790" y="288" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="end">8</text>
  <text x="800" y="275" font-size="12" fill="#2457d6" text-anchor="end">SEG</text>

  <!-- Right Panel Wiring: COM Lines (Green) -->
  <!-- White bridges over the blue segment bus -->
  <line x1="615" y1="315" x2="615" y2="305" stroke="white" stroke-width="6"/>
  <line x1="685" y1="315" x2="685" y2="305" stroke="white" stroke-width="6"/>
  <line x1="755" y1="315" x2="755" y2="305" stroke="white" stroke-width="6"/>

  <path d="M615,380 L615,260" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>
  <text x="620" y="275" font-size="12" fill="#27ae60" text-anchor="start">COM1</text>

  <path d="M685,380 L685,260" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>
  <text x="690" y="275" font-size="12" fill="#27ae60" text-anchor="start">COM2</text>

  <path d="M755,380 L755,260" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>
  <text x="760" y="275" font-size="12" fill="#27ae60" text-anchor="start">COM3</text>

  <path d="M825,380 L825,260" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>
  <text x="830" y="275" font-size="12" fill="#27ae60" text-anchor="start">COM4</text>
</svg>
