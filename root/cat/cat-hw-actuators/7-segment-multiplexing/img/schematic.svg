<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Заголовок -->
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мультиплексування семисегментного індикатора</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Резистори обмежують струм сегментів, а транзистори комутують спільні виводи розрядів</text>

  <!-- MCU -->
  <rect x="40" y="100" width="140" height="380" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
