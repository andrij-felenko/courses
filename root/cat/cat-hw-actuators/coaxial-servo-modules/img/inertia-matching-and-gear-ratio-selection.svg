<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="510" fill="white"/>

  <!-- Маркери стрілок -->
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Інерційне узгодження та вибір передавального відношення N</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Оптимальне співвідношення N²·J_m ≈ J_L забезпечує максимальне прискорення та зворотну прозорість</text>

  <!-- ЛІВА ЧАСТИНА: ГРАФІК ДИНАМІЧНОГО ВІДГУКУ -->

  <!-- Фон зон графіку -->
  <!-- Зона 1: Під-редукція -->
  <rect x="95" y="105" width="130" height="280" fill="#fdecea" fill-opacity="0.6" stroke="#c0392b" stroke-dasharray="3,3" stroke-width="1"/>
  <!-- Зона 2: Оптимальна зона QDD -->
  <rect x="225" y="105" width="170" height="280" fill="#e9f7ef" fill-opacity="0.8" stroke="#27ae60" stroke-width="1.5"/>
  <!-- Зона 3: Над-редукція -->
  <rect x="395" y="105" width="170" height="280" fill="#fdecea" fill-opacity="0.6" stroke="#c0392b" stroke-dasharray="3,3" stroke-width="1"/>

  <!-- Бейджі назв зон у верхній частині графіку -->
  <rect x="101" y="112" width="118" height="22" rx="4" fill="white" stroke="#c0392b" stroke-width="1"/>
  <text x="160" y="127" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">λ &gt;&gt; 1 (N &lt; N_opt)</text>

  <rect x="235" y="112" width="150" height="22" rx="4" fill="#27ae60"/>
  <text x="310" y="127" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Оптимальна зона QDD</text>

  <rect x="411" y="112" width="138" height="22" rx="4" fill="white" stroke="#c0392b" stroke-width="1"/>
  <text x="480" y="127" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">λ &lt;&lt; 1 (N &gt;&gt; N_opt)</text>

  <!-- Пунктирна лінія піку N_opt -->
  <line x1="310" y1="165" x2="310" y2="385" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Осі графіку -->
  <line x1="90" y1="385" x2="570" y2="385" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="330" y="424" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Передавальне відношення N (та співвідношення інерцій λ = J_L / (N²·J_m))</text>

  <line x1="95" y1="390" x2="95" y2="90" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="103" y="82" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Динамічний відгук суглоба</text>

  <!-- Засічки та підписи осі X -->
  <line x1="160" y1="385" x2="160" y2="390" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="160" y="404" font-size="12" fill="#6b7280" text-anchor="middle">Мале N</text>

  <line x1="310" y1="385" x2="310" y2="390" stroke="#27ae60" stroke-width="2"/>
  <text x="310" y="404" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">N_opt (λ = 1)</text>

  <line x1="480" y1="385" x2="480" y2="390" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="480" y="404" font-size="12" fill="#6b7280" text-anchor="middle">Велике N</text>

  <!-- Крива 1: Кутове прискорення (синя) -->
  <path d="M 95 370 C 160 340, 240 165, 310 165 C 380 165, 460 340, 565 370" fill="none" stroke="#2457d6" stroke-width="3"/>
  <circle cx="310" cy="165" r="5" fill="#2457d6" stroke="white" stroke-width="2"/>
  <text x="310" y="153" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Макс. прискорення α_max</text>

  <!-- Крива 2: Зворотна прозорість (зелена пунктирна) -->
  <path d="M 95 160 C 180 165, 270 210, 310 250 C 360 300, 450 360, 565 370" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="6,3"/>

  <!-- Легенда графіку -->
  <rect x="402" y="150" width="156" height="52" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <line x1="410" y1="166" x2="426" y2="166" stroke="#2457d6" stroke-width="3"/>
  <text x="431" y="170" font-size="12" fill="#1a1a1a" text-anchor="start">Прискорення α</text>
  <line x1="410" y1="188" x2="426" y2="188" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="6,3"/>
  <text x="431" y="192" font-size="12" fill="#1a1a1a" text-anchor="start">Зворотна прозорість</text>

  <!-- Аннотації обмежень всередині зон (розміщені строго ПОЗА лініями графіку) -->
  <text x="150" y="220" font-size="12" fill="#c0392b" text-anchor="middle">Низький момент,</text>
  <text x="150" y="236" font-size="12" fill="#c0392b" text-anchor="middle">перегрів двигуна</text>

  <text x="490" y="226" font-size="12" fill="#c0392b" text-anchor="middle">Домінує інерція N²·J_m,</text>
  <text x="490" y="242" font-size="12" fill="#c0392b" text-anchor="middle">високі удари при кроці</text>

  <!-- Нижній блок з формулою під графіком -->
  <rect x="50" y="442" width="525" height="42" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="312" y="468" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Умова інерційного узгодження: N_opt = √(J_L / J_m)   ⇒   N²·J_m = J_L</text>

  <!-- ПРАВА ЧАСТИНА: АНАЛІТИЧНІ КАРТКИ -->

  <!-- Картка 1: Під-редукція -->
  <rect x="595" y="100" width="340" height="110" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="610" y="122" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="start">1. Під-редукція (N &lt; N_opt, λ &gt;&gt; 1)</text>
  <text x="610" y="142" font-size="12" fill="#1a1a1a" text-anchor="start">• Момент двигуна замалий для J_L</text>
  <text x="610" y="162" font-size="12" fill="#1a1a1a" text-anchor="start">• Великий струм I_q ⇒ перегрів</text>
  <text x="610" y="182" font-size="12" fill="#6b7280" text-anchor="start">• Висока прозорість, слабка динаміка</text>

  <!-- Картка 2: Зона QDD -->
  <rect x="595" y="225" width="340" height="135" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="610" y="246" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="start">2. Зона QDD (N²·J_m ≈ J_L, λ ≈ 1)</text>
  <text x="610" y="266" font-size="12" fill="#1a1a1a" text-anchor="start">• Передавальне відношення N ≈ 5:1...10:1</text>
  <text x="610" y="286" font-size="12" fill="#1a1a1a" text-anchor="start">• Максимальне прискорення ланки α_max</text>
  <text x="610" y="306" font-size="12" fill="#1a1a1a" text-anchor="start">• Оцінка моменту за фазним струмом I_q</text>
  <text x="610" y="326" font-size="12" fill="#1a1a1a" text-anchor="start">• Низький удар при контакті з землею</text>
  <text x="610" y="346" font-size="12" fill="#27ae60" font-weight="bold" text-anchor="start">• Ідеально для роботів, що бігають</text>

  <!-- Картка 3: Над-редукція -->
  <rect x="595" y="375" width="340" height="110" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="610" y="397" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="start">3. Над-редукція (N &gt;&gt; N_opt, λ &lt;&lt; 1)</text>
  <text x="610" y="417" font-size="12" fill="#1a1a1a" text-anchor="start">• Інерція N²·J_m домінує над J_L</text>
  <text x="610" y="437" font-size="12" fill="#1a1a1a" text-anchor="start">• Втрата зворотної прозорості</text>
  <text x="610" y="457" font-size="12" fill="#6b7280" text-anchor="start">• Великі удари по зубцях редуктора</text>
</svg>
