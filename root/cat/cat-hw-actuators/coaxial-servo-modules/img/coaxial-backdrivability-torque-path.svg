<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Маркери стрілок -->
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Фізичний шлях передачі моменту та вимірювання за фазними струмами</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Зворотна прозорість передає момент T_ext від вала через редуктор N на ротор BLDC та струм I_q</text>

  <!-- СТРІЛКИ ЗВ'ЯЗКУ МІЖ ПАНЕЛЯМИ -->
  <path d="M 244 193 L 254 193" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <path d="M 472 193 L 482 193" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <path d="M 700 193 L 710 193" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- ПАНЕЛЬ 1: ЗОВНІШНЄ НАВАНТАЖЕННЯ -->
  <rect x="32" y="82" width="212" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="44" y="96" width="188" height="28" rx="4" fill="#2457d6"/>
  <text x="138" y="115" font-size="13" font-weight="700" fill="white" text-anchor="middle">1. Вихідне навантаження</text>

  <rect x="44" y="138" width="188" height="110" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="138" y="160" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">Момент реакції T_ext</text>
  <text x="54" y="182" font-size="12" fill="#1a1a1a">• Зовнішня сила від опори</text>
  <text x="54" y="200" font-size="12" fill="#1a1a1a">• Діє на вихідну ланку</text>
  <text x="54" y="218" font-size="12" fill="#1a1a1a">• Без тензодатчика</text>
  <text x="54" y="236" font-size="12" fill="#6b7280">(прямий механічний вплив)</text>

  <rect x="44" y="260" width="188" height="186" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="138" y="282" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Порожнистий вал</text>
  <text x="54" y="304" font-size="12" fill="#1a1a1a">• Коаксіальна геометрія</text>
  <text x="54" y="322" font-size="12" fill="#1a1a1a">• Прохідний отвір (кабелі)</text>
  <text x="54" y="340" font-size="12" fill="#1a1a1a">• Передача моменту на</text>
  <text x="54" y="356" font-size="12" fill="#1a1a1a">  водило редуктора</text>
  <text x="54" y="385" font-size="12" font-weight="700" fill="#2457d6">• Вихідний момент:</text>
  <text x="54" y="405" font-size="13" font-weight="700" fill="#2457d6">  T_out = T_ext</text>


  <!-- ПАНЕЛЬ 2: РЕДУКЦІЯ ТА ЗВОРОТНИЙ ХІД -->
  <rect x="260" y="82" width="212" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="272" y="96" width="188" height="28" rx="4" fill="#27ae60"/>
  <text x="366" y="115" font-size="13" font-weight="700" fill="white" text-anchor="middle">2. Редукція (Зворотний хід)</text>

  <rect x="272" y="138" width="188" height="110" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="366" y="160" font-size="13" font-weight="700" fill="#27ae60" text-anchor="middle">Формула ротора</text>
  <text x="366" y="185" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">T_rot = T_ext / (N · η_b)</text>
  <text x="282" y="210" font-size="12" fill="#1a1a1a">• N = 6...10 (QDD привід)</text>
  <text x="282" y="228" font-size="12" fill="#1a1a1a">• η_b ≈ 0.85...0.92 (ККД)</text>
  <text x="282" y="244" font-size="12" fill="#27ae60">(висока прозорість)</text>

  <rect x="272" y="260" width="188" height="186" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="366" y="282" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle">Вимога прозорості</text>
  <text x="282" y="304" font-size="12" fill="#c0392b">• Низьке N (QDD/Direct):</text>
  <text x="292" y="322" font-size="12" fill="#1a1a1a">легкий зворотний рух</text>
  <text x="282" y="344" font-size="12" fill="#c0392b">• Якщо N &gt; 50 (хвильові):</text>
  <text x="292" y="362" font-size="12" fill="#1a1a1a">тертя блокує вал</text>
  <text x="292" y="380" font-size="12" fill="#1a1a1a">момент не доходить</text>
  <text x="292" y="398" font-size="12" fill="#1a1a1a">до ротора двигуна</text>
  <text x="366" y="426" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Втрата Backdrivability</text>


  <!-- ПАНЕЛЬ 3: РОТОР ТА ЕЛЕКТРОМАГНІТ -->
  <rect x="488" y="82" width="212" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="500" y="96" width="188" height="28" rx="4" fill="#2457d6"/>
  <text x="594" y="115" font-size="13" font-weight="700" fill="white" text-anchor="middle">3. Ротор та Електромагніт</text>

  <rect x="500" y="138" width="188" height="110" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="594" y="160" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">Баланс моментів</text>
  <text x="594" y="185" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">T_rot = T_em = K_t · I_q</text>
  <text x="510" y="210" font-size="12" fill="#1a1a1a">• K_t — константа моменту</text>
  <text x="510" y="228" font-size="12" fill="#1a1a1a">• I_q — моментний струм</text>
  <text x="510" y="244" font-size="12" fill="#2457d6">(проти-ЕРС та магніти)</text>

  <rect x="500" y="260" width="188" height="186" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="594" y="282" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Безкорпусний BLDC</text>
  <text x="510" y="304" font-size="12" fill="#1a1a1a">• Зовнішній ротор/статор</text>
  <text x="510" y="322" font-size="12" fill="#1a1a1a">• Обертання змінює</text>
  <text x="510" y="340" font-size="12" fill="#1a1a1a">  вектор магнітного поля</text>
  <text x="510" y="365" font-size="12" fill="#1a1a1a">• Викликає реактивний</text>
  <text x="510" y="383" font-size="12" fill="#1a1a1a">  струм у фазах A, B, C</text>
  <text x="510" y="410" font-size="12" font-weight="700" fill="#2457d6">• Струмовий відгук:</text>
  <text x="510" y="430" font-size="13" font-weight="700" fill="#2457d6">  I_phase ~ T_rot</text>


  <!-- ПАНЕЛЬ 4: ОБЧИСЛЕННЯ МОМЕНТУ В FOC -->
  <rect x="716" y="82" width="212" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="728" y="96" width="188" height="28" rx="4" fill="#27ae60"/>
  <text x="822" y="115" font-size="13" font-weight="700" fill="white" text-anchor="middle">4. Обчислення моменту</text>

  <rect x="728" y="138" width="188" height="110" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="822" y="160" font-size="13" font-weight="700" fill="#27ae60" text-anchor="middle">Вихідний розрахунок</text>
  <text x="822" y="185" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">T_est = I_q · K_t · N · η_b</text>
  <text x="738" y="210" font-size="12" fill="#1a1a1a">• Оцифрування шунтами</text>
  <text x="738" y="228" font-size="12" fill="#1a1a1a">• Трансформація Парка</text>
  <text x="738" y="244" font-size="12" fill="#27ae60">T_est ≈ T_ext (точно!)</text>

  <rect x="728" y="260" width="188" height="186" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="822" y="282" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Вбудований FOC</text>
  <text x="738" y="304" font-size="12" fill="#1a1a1a">• Магнітний енкодер (θ)</text>
  <text x="738" y="322" font-size="12" fill="#1a1a1a">• Фазні шунти (I_a, I_b)</text>
  <text x="738" y="340" font-size="12" fill="#1a1a1a">• Векторне керування</text>
  <text x="738" y="365" font-size="12" fill="#1a1a1a">• Замінює тензодатчик</text>
  <text x="738" y="383" font-size="12" fill="#1a1a1a">  та захищає редуктор</text>
  <text x="738" y="410" font-size="12" font-weight="700" fill="#27ae60">• Вихід зворотного зв'язку:</text>
  <text x="738" y="430" font-size="13" font-weight="700" fill="#27ae60">  Torque Feedback Loop</text>
</svg>
