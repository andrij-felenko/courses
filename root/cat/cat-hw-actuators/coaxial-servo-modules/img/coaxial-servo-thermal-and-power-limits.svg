<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Теплові та струмові обмеження коаксіальних сервомодулів</text>
  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Тепловідведення через корпус визначає тривалий момент S1, а термічна постійна часу обмоток обмежує пікові режими S3</text>

  <!-- LEFT PANEL: Thermal Model -->
  <rect x="25" y="75" width="440" height="420" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="37" y="87" width="416" height="32" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="245" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#2457d6">1. Шляхи тепловідведення та термічна схема</text>

  <!-- Sub-block 1: Loss Sources -->
  <rect x="37" y="130" width="416" height="100" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="245" y="148" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Внутрішні джерела тепловиділення (P_total)</text>

  <!-- Winding Losses Box -->
  <rect x="47" y="158" width="190" height="62" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="142" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">Обмотки статора (T_stator)</text>
  <text x="142" y="194" text-anchor="middle" font-size="11" fill="#1a1a1a">P_Cu = 3 · I_RMS² · R_ph</text>
  <text x="142" y="210" text-anchor="middle" font-size="11" fill="#6b7280">Литво в епоксид (T_max = 130 °C)</text>

  <!-- MOSFET Losses Box -->
  <rect x="251" y="158" width="190" height="62" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="346" y="176" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">MOSFET FOC-плати (T_j)</text>
  <text x="346" y="194" text-anchor="middle" font-size="11" fill="#1a1a1a">P_MOS = I² · R_ds(on) + P_sw</text>
  <text x="346" y="210" text-anchor="middle" font-size="11" fill="#6b7280">Теплопідклад (T_j max = 105 °C)</text>

  <!-- Sub-block 2: Thermal Resistance Chain -->
  <rect x="37" y="240" width="416" height="125" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="245" y="258" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Еквівалентна схема теплових опорів (R_th)</text>

  <!-- Aluminum Case Bar -->
  <rect x="47" y="270" width="396" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="245" y="290" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Алюмінієвий корпус мотора (T_case ≤ 70 °C)</text>

  <!-- Flange Conduction Box -->
  <rect x="47" y="308" width="190" height="47" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="142" y="325" text-anchor="middle" font-size="11" font-weight="700" fill="#27ae60">Основний шлях (80% тепла)</text>
  <text x="142" y="343" text-anchor="middle" font-size="11" fill="#1a1a1a">R_th,flange → Фланець ланки робота</text>

  <!-- Ambient Convection Box -->
  <rect x="251" y="308" width="190" height="47" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="346" y="325" text-anchor="middle" font-size="11" font-weight="700" fill="#6b7280">Вторинний шлях (20% тепла)</text>
  <text x="346" y="343" text-anchor="middle" font-size="11" fill="#1a1a1a">R_th,amb → Повітря (T_amb = 25 °C)</text>

  <!-- Sub-block 3: Thermal Rule -->
  <rect x="37" y="375" width="416" height="105" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="245" y="396" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">Правило розрахунку охолодження:</text>
  <text x="245" y="417" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">T_stator = T_amb + P_total · (R_th,case + R_th,flange)</text>
  <text x="245" y="438" text-anchor="middle" font-size="11" fill="#1a1a1a">Монтаж на алюмінієву ланку знижує R_th у 3–4 рази</text>
  <text x="245" y="458" text-anchor="middle" font-size="11" fill="#6b7280">Без тепловідводу тривалий момент S1 падає на 40–50%</text>

  <!-- Heat Flow Arrows -->
  <line x1="142" y1="220" x2="142" y2="268" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="346" y1="220" x2="346" y2="268" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="142" y1="300" x2="142" y2="306" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="346" y1="300" x2="346" y2="306" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- RIGHT PANEL: Torque-Speed Operating Zones -->
  <rect x="495" y="75" width="440" height="420" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="507" y="87" width="416" height="32" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="715" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#2457d6">2. Діаграма робочих зон: Момент (M) vs Швидкість (ω)</text>

  <!-- Graph Container Box -->
  <rect x="507" y="130" width="416" height="230" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>

  <!-- Graph Zones (Fills) -->
  <!-- Prohibited / Overheat Zone (Red) -->
  <polygon points="560,145 890,145 890,320 860,320 790,250 730,180 560,180" fill="#fdecea"/>

  <!-- Intermittent / Peak Zone S3 (Blue) -->
  <polygon points="560,180 730,180 790,250 560,250" fill="#eaf0fd"/>

  <!-- Continuous Zone S1 (Green) -->
  <polygon points="560,250 790,250 860,320 560,320" fill="#e9f7ef"/>

  <!-- Limit Lines -->
  <!-- Peak Torque Line M_peak -->
  <line x1="560" y1="180" x2="730" y2="180" stroke="#c0392b" stroke-width="2"/>
  <text x="565" y="173" text-anchor="start" font-size="11" font-weight="700" fill="#c0392b">M_peak (Піковий момент, I_max)</text>

  <!-- Continuous Torque Line M_cont -->
  <line x1="560" y1="250" x2="790" y2="250" stroke="#27ae60" stroke-width="2"/>
  <text x="565" y="243" text-anchor="start" font-size="11" font-weight="700" fill="#27ae60">M_cont (Тривалий момент S1)</text>

  <!-- Back-EMF Slope Line (U_DC) -->
  <path d="M 730,180 L 790,250 L 860,320" stroke="#2457d6" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="805" y="235" text-anchor="start" font-size="11" font-weight="700" fill="#2457d6">Межа U_DC (ЕРС)</text>

  <!-- Zone Text Labels inside Graph -->
  <text x="780" y="165" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">Зона перегріву (I²t захист)</text>
  <text x="640" y="215" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Зона S3 (Пікова, t ≤ τ_th)</text>
  <text x="650" y="288" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">Зона S1 (Безперервна)</text>

  <!-- Axes -->
  <!-- X Axis -->
  <line x1="550" y1="320" x2="890" y2="320" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="890" y="342" text-anchor="end" font-size="12" font-weight="700" fill="#1a1a1a">Швидкість ω (об/хв)</text>

  <!-- Y Axis -->
  <line x1="560" y1="330" x2="560" y2="145" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="565" y="152" text-anchor="start" font-size="12" font-weight="700" fill="#1a1a1a">Момент M (Н·м) / Струм I</text>

  <!-- Sub-block 2: Protection Info Box -->
  <rect x="507" y="375" width="416" height="105" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="715" y="395" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Алгоритми термозахисту в FOC-контролері:</text>
  <text x="520" y="417" text-anchor="start" font-size="11" fill="#1a1a1a">• I²t-монітор: обмеження струму при накопиченні тепла в обмотках</text>
  <text x="520" y="437" text-anchor="start" font-size="11" fill="#1a1a1a">• NTC/PT100 давач: аварійне вимкнення при T_stator &gt; 120 °C</text>
  <text x="520" y="457" text-anchor="start" font-size="11" fill="#6b7280">• Захист редуктора: демпфування ударних навантажень та піків моменту</text>
</svg>
