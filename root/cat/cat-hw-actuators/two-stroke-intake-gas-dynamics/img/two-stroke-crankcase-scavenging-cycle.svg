<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="900" height="520" fill="url(#bg1)" rx="12" stroke="#30363d" stroke-width="1.5"/>

  <text x="450" y="38" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">
    Цикл картерного продування та газодинаміки двотактного ДВЗ
  </text>
  <text x="450" y="62" fill="#8b949e" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">
    Фаза 1: Рух поршня вгору (впуск і стиснення) | Фаза 2: Рух поршня вниз (первинний тиск і продування)
  </text>

  <!-- Panel 1: Piston Upstroke (Intake) -->
  <g transform="translate(30, 85)">
    <rect width="405" height="395" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect width="405" height="35" rx="10" fill="#1f242c"/>
    <text x="202" y="24" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">
      Фаза 1: Впуск у картер (рух ВМТ)
    </text>

    <!-- Cylinder walls -->
    <line x1="110" y1="60" x2="110" y2="210" stroke="#f0f6fc" stroke-width="3"/>
    <line x1="290" y1="60" x2="290" y2="210" stroke="#f0f6fc" stroke-width="3"/>

    <!-- Piston moving UP -->
    <rect x="116" y="75" width="168" height="60" rx="4" fill="#30363d" stroke="#58a6ff" stroke-width="2"/>
    <text x="200" y="110" fill="#f0f6fc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Поршень (до ВМТ)</text>
    
    <!-- Upward arrow -->
    <line x1="200" y1="160" x2="200" y2="138" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/>
    <polygon points="200,132 195,142 205,142" fill="#58a6ff"/>

    <!-- Crankcase chamber -->
    <circle cx="200" cy="285" r="85" fill="#0d1117" stroke="#8b949e" stroke-width="2.5"/>
    <!-- Crankshaft & rod -->
    <circle cx="200" cy="285" r="12" fill="#d29922"/>
    <line x1="200" y1="285" x2="180" y2="235" stroke="#d29922" stroke-width="4" stroke-linecap="round"/>
    <line x1="180" y1="235" x2="200" y2="135" stroke="#8b949e" stroke-width="3" stroke-linecap="round"/>

    <!-- Intake runner with reed valve -->
    <path d="M 40 280 L 115 280 L 115 260 L 40 260 Z" fill="#1f242c" stroke="#58a6ff" stroke-width="1.5"/>
    <!-- Reed valve open -->
    <line x1="115" y1="260" x2="135" y2="250" stroke="#3fb950" stroke-width="3" stroke-linecap="round"/>
    <line x1="115" y1="280" x2="135" y2="290" stroke="#3fb950" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Flow arrow into crankcase -->
    <path d="M 45 270 Q 90 270 145 275" fill="none" stroke="#3fb950" stroke-width="3" stroke-dasharray="5 3"/>
    <polygon points="155,276 142,270 144,282" fill="#3fb950"/>
    <text x="75" y="252" fill="#3fb950" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Паливна суміш</text>

    <!-- Pressure label in crankcase -->
    <rect x="135" y="325" width="130" height="36" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1"/>
    <text x="200" y="340" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Розрідження в картері</text>
    <text x="200" y="354" fill="#8b949e" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">P менше P_atm (впуск)</text>
    
    <text x="200" y="382" fill="#f0f6fc" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Впуск відкритий, перепуск закритий</text>
  </g>

  <!-- Panel 2: Piston Downstroke (Scavenging) -->
  <g transform="translate(465, 85)">
    <rect width="405" height="395" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect width="405" height="35" rx="10" fill="#1f242c"/>
    <text x="202" y="24" fill="#3fb950" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">
      Фаза 2: Продування циліндра (рух НМТ)
    </text>

    <!-- Cylinder walls with ports -->
    <line x1="110" y1="60" x2="110" y2="160" stroke="#f0f6fc" stroke-width="3"/>
    <!-- Transfer port on left -->
    <line x1="110" y1="190" x2="110" y2="210" stroke="#f0f6fc" stroke-width="3"/>
    
    <line x1="290" y1="60" x2="290" y2="140" stroke="#f0f6fc" stroke-width="3"/>
    <!-- Exhaust port on right -->
    <line x1="290" y1="175" x2="290" y2="210" stroke="#f0f6fc" stroke-width="3"/>

    <!-- Piston moving DOWN -->
    <rect x="116" y="165" width="168" height="60" rx="4" fill="#30363d" stroke="#3fb950" stroke-width="2"/>
    <text x="200" y="200" fill="#f0f6fc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Поршень (до НМТ)</text>
    
    <!-- Downward arrow -->
    <line x1="200" y1="120" x2="200" y2="145" stroke="#3fb950" stroke-width="3" stroke-linecap="round"/>
    <polygon points="200,152 195,142 205,142" fill="#3fb950"/>

    <!-- Transfer duct bypass from crankcase to cylinder -->
    <path d="M 95 240 Q 60 210 95 175 L 110 175" fill="none" stroke="#39c5cf" stroke-width="4"/>
    <polygon points="120,175 108,170 108,180" fill="#39c5cf"/>
    <text x="45" y="165" fill="#39c5cf" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Перепуск</text>

    <!-- Exhaust discharge out right -->
    <path d="M 290 155 L 345 155" fill="none" stroke="#f85149" stroke-width="4"/>
    <polygon points="355,155 343,150 343,160" fill="#f85149"/>
    <text x="320" y="145" fill="#f85149" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Вихлоп</text>

    <!-- Crankcase chamber -->
    <circle cx="200" cy="285" r="85" fill="#0d1117" stroke="#8b949e" stroke-width="2.5"/>
    <circle cx="200" cy="285" r="12" fill="#d29922"/>
    <line x1="200" y1="285" x2="220" y2="325" stroke="#d29922" stroke-width="4" stroke-linecap="round"/>
    <line x1="220" y1="325" x2="200" y2="225" stroke="#8b949e" stroke-width="3" stroke-linecap="round"/>

    <!-- Intake runner with reed valve CLOSED -->
    <path d="M 40 280 L 115 280 L 115 260 L 40 260 Z" fill="#1f242c" stroke="#8b949e" stroke-width="1.5"/>
    <!-- Reed valve tightly closed -->
    <line x1="115" y1="260" x2="115" y2="280" stroke="#f85149" stroke-width="3" stroke-linecap="round"/>
    <text x="48" y="252" fill="#f85149" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">Клапан закрито</text>

    <!-- Compression label in crankcase -->
    <rect x="135" y="325" width="130" height="36" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1"/>
    <text x="200" y="340" fill="#3fb950" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Стиснення в картері</text>
    <text x="200" y="354" fill="#8b949e" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">P більше P_cyl (+40 кПа)</text>

    <text x="200" y="382" fill="#f0f6fc" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Продування камери згоряння петлевим потоком</text>
  </g>
</svg>