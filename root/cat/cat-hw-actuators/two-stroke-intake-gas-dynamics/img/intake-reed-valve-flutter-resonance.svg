<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
  </defs>

  <rect width="900" height="480" fill="url(#bg2)" rx="12" stroke="#30363d" stroke-width="1.5"/>

  <text x="450" y="36" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">
    Динаміка пелюстки клапана: нормальне відкриття vs флаттер (автоколивання)
  </text>
  <text x="450" y="60" fill="#8b949e" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">
    Підйом пелюстки h(t), тиск впуску ΔP та запізніле закриття на високих обертах
  </text>

  <!-- Left: Reed valve mechanism -->
  <g transform="translate(35, 90)">
    <rect width="280" height="355" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect width="280" height="32" rx="10" fill="#1f242c"/>
    <text x="140" y="22" fill="#58a6ff" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Конструкція клапана</text>

    <!-- Base seat -->
    <polygon points="50,150 120,70 120,270 50,220" fill="#0d1117" stroke="#8b949e" stroke-width="2"/>
    <text x="75" y="190" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Сідло (піраміда)</text>

    <!-- Petal (Carbon/Fiberglass) -->
    <!-- Open state -->
    <path d="M 120 100 Q 180 110 210 145" fill="none" stroke="#3fb950" stroke-width="3.5" stroke-linecap="round"/>
    <text x="225" y="145" fill="#3fb950" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">h_max</text>

    <!-- Stopper -->
    <path d="M 120 85 Q 175 95 210 120" fill="none" stroke="#d29922" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 3"/>
    <text x="175" y="80" fill="#d29922" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Стопер пелюстки</text>

    <!-- Closed state -->
    <line x1="120" y1="100" x2="120" y2="220" stroke="#8b949e" stroke-width="2" stroke-dasharray="3 3"/>

    <text x="140" y="300" fill="#f0f6fc" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Частота власних коливань:</text>
    <rect x="20" y="312" width="240" height="30" rx="6" fill="#0d1117" stroke="#58a6ff" stroke-width="1"/>
    <text x="140" y="332" fill="#58a6ff" font-family="monospace" font-size="11" text-anchor="middle">f_0 = (0.56 / L^2) * sqrt(E*t^2 / rho)</text>
  </g>

  <!-- Right: Oscillogram Graph -->
  <g transform="translate(340, 90)">
    <rect width="525" height="355" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <rect width="525" height="32" rx="10" fill="#1f242c"/>
    <text x="262" y="22" fill="#39c5cf" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" text-anchor="middle">Осцилограма підйому пелюстки h(t) vs Кут ПКВ</text>

    <!-- Axis -->
    <line x1="50" y1="260" x2="490" y2="260" stroke="#8b949e" stroke-width="1.5"/>
    <line x1="50" y1="260" x2="50" y2="60" stroke="#8b949e" stroke-width="1.5"/>
    <text x="480" y="285" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">Кут ПКВ (град)</text>
    <text x="40" y="50" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">Підйом h(t)</text>

    <!-- Grid lines -->
    <line x1="160" y1="60" x2="160" y2="260" stroke="#30363d" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="270" y1="60" x2="270" y2="260" stroke="#30363d" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="380" y1="60" x2="380" y2="260" stroke="#30363d" stroke-width="1" stroke-dasharray="4 4"/>
    <text x="160" y="275" fill="#8b949e" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">90°</text>
    <text x="270" y="275" fill="#8b949e" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">180° (ВМТ)</text>
    <text x="380" y="275" fill="#8b949e" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">270°</text>

    <!-- Ideal/Normal opening wave (Green) -->
    <path d="M 60 260 C 100 250, 120 110, 200 110 C 260 110, 290 200, 310 260" fill="none" stroke="#3fb950" stroke-width="2.5"/>
    <circle cx="200" cy="110" r="4" fill="#3fb950"/>
    <text x="210" y="100" fill="#3fb950" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Штатне відкриття (6000 об/хв)</text>

    <!-- High RPM Flutter / Bouncing wave (Red) -->
    <path d="M 60 260 C 90 230, 110 130, 140 100 C 160 80, 175 160, 195 105 C 220 85, 235 170, 260 110 C 285 80, 310 190, 340 220 C 365 240, 380 255, 410 260" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="5 2"/>
    <text x="290" y="75" fill="#f85149" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Резонансний флаттер (12000 об/хв)</text>

    <!-- Legend box -->
    <rect x="55" y="295" width="440" height="45" rx="6" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <circle cx="75" cy="312" r="5" fill="#3fb950"/>
    <text x="88" y="316" fill="#f0f6fc" font-family="system-ui, sans-serif" font-size="11">Плавний цикл: своєчасне закриття без зворотного викиду (spit-back)</text>
    <circle cx="75" cy="330" r="5" fill="#f85149"/>
    <text x="88" y="334" fill="#8b949e" font-family="system-ui, sans-serif" font-size="11">Флаттер: відрив пелюстки від сідла, втрата компресії та зворотний викид</text>
  </g>
</svg>