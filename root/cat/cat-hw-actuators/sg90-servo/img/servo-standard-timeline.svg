<text x="802.5" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="700">Digicon 1962</text>
<text x="802.5" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="802.5" dy="0.0">ШИРИНА імпульсу 1..2 мс,</tspan><tspan x="802.5" dy="11.6">нейтраль 1.5 мс, 50 Гц</tspan></text>
<line x1="734.0" y1="340.0" x2="871.0" y2="340.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="802.5" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#2457d6" text-anchor="middle" font-weight="700">справді пропорційно</text>
<line x1="255.0" y1="310.0" x2="280.0" y2="310.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="445.0" y1="310.0" x2="500.0" y2="310.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="665.0" y1="310.0" x2="720.0" y2="310.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="40.0" y="417.4" width="820.0" height="45.3" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="436.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">Спільною мовою серв стала не частота й не напруга, а тривалість «високого»:</tspan><tspan x="450.0" dy="14.3">домовленість 1962 року (Спренґ і Метіс, Digicon) пережила лампи, транзистори й цифру — їй кориться й дешевий SG90.</tspan></text>
