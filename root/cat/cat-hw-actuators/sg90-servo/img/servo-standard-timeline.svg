<text x="582.5" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">Galloping Ghost</text>
<text x="582.5" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="582.5" dy="0.0">один канал миготить —</tspan><tspan x="582.5" dy="11.6">середнє дає плавність</tspan></text>
<line x1="514.0" y1="340.0" x2="651.0" y2="340.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="582.5" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#27ae60" text-anchor="middle" font-weight="700">квазі-плавно, дрижить</text>
