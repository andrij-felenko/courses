<text x="172.5" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">Escapement</text>
<text x="172.5" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="172.5" dy="0.0">гумовий джгут, кілька</tspan><tspan x="172.5" dy="11.6">дискретних позицій керма</tspan></text>
<line x1="104.0" y1="340.0" x2="241.0" y2="340.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="172.5" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#c0392b" text-anchor="middle" font-weight="700">ліво · центр · право</text>
<rect x="280.0" y="250.0" width="165.0" height="120.0" rx="11" fill="#fff6e5" stroke="#8a6d00" stroke-width="1.9"/>
<text x="362.5" y="274.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#8a6d00" text-anchor="middle" font-weight="700">Reed / рід</text>
<text x="362.5" y="296.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#1a1a1a" text-anchor="middle"><tspan x="362.5" dy="0.0">тонові канали, кермо</tspan><tspan x="362.5" dy="11.6">смикають «блимаючи»</tspan></text>
<line x1="294.0" y1="340.0" x2="431.0" y2="340.0" stroke="#6b7280" stroke-width="1.0"/>
<text x="362.5" y="358.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#8a6d00" text-anchor="middle" font-weight="700">набір увімк/вимк</text>
