<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Як команда до серва ставала пропорційною: чотири покоління</text>
<line x1="70.0" y1="150.0" x2="830.0" y2="150.0" stroke="#1a1a1a" stroke-width="2.0"/>
