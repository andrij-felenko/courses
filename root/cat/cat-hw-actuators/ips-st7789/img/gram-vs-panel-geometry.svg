<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Геометрія фреймбуфера GRAM проти фізичної матриці 240×240</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">Розміщення активного вікна 240×240 у відеопам'яті 240×320 та 80 апаратно прихованих рядків</text>

  <!-- 1. Ліва панель: Схема накладання у відеопам'яті ST7789 -->
  <rect x="24" y="80" width="456" height="332" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="252" y="104" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Схема накладання у просторі відеопам'яті ST7789</text>

  <!-- Вісь X (стовпчики 0..239) -->
  <line x1="110" y1="138" x2="282" y2="138" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="110" y1="133" x2="110" y2="143" stroke="#2457d6" stroke-width="1.5"/>
  <text x="196" y="130" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">X: 0 .. 239 (240 колонок, CASET)</text>

  <!-- Вісь Y (рядки 0..319) -->
  <line x1="98" y1="150" x2="98" y2="384" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="93" y1="150" x2="103" y2="150" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="93" y1="322" x2="103" y2="322" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="93" y1="326" x2="103" y2="326" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="93" y1="384" x2="103" y2="384" stroke="#6b7280" stroke-width="1.5"/>
  <text x="88" y="154" font-size="12" font-weight="700" fill="#2457d6" text-anchor="end">Y = 0</text>
  <text x="88" y="322" font-size="12" font-weight="700" fill="#2457d6" text-anchor="end">Y = 239</text>
  <text x="88" y="338" font-size="12" font-weight="700" fill="#c0392b" text-anchor="end">Y = 240</text>
  <text x="88" y="386" font-size="12" font-weight="700" fill="#c0392b" text-anchor="end">Y = 319</text>

  <!-- Зовнішній контур GRAM 240×320 -->
  <rect x="108" y="148" width="176" height="238" rx="4" fill="none" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Активна зона 240×240 -->
  <rect x="110" y="150" width="172" height="172" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="196" y="214" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Активна зона IPS 240×240</text>
  <text x="196" y="234" font-size="12" fill="#1a1a1a" text-anchor="middle">Фізична матриця дисплея</text>
  <text x="196" y="254" font-size="12" fill="#6b7280" text-anchor="middle">240 колонок × 240 рядків</text>
  <text x="196" y="274" font-size="12" fill="#2457d6" text-anchor="middle">(підключено до кристала)</text>

  <!-- Прихована зона 80 рядків -->
  <rect x="110" y="326" width="172" height="58" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="196" y="350" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">80 непідключених рядків</text>
  <text x="196" y="368" font-size="12" fill="#c0392b" text-anchor="middle">GRAM (апаратно приховані)</text>

  <!-- Розмірні лінії праворуч від матриці -->
  <line x1="296" y1="152" x2="296" y2="320" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="291" y1="152" x2="301" y2="152" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="291" y1="320" x2="301" y2="320" stroke="#2457d6" stroke-width="1.5"/>
  <text x="308" y="228" font-size="12" font-weight="700" fill="#2457d6">240 рядків (0..239)</text>
  <text x="308" y="246" font-size="12" fill="#1a1a1a">Активна зона матриці</text>
  <text x="308" y="264" font-size="12" fill="#6b7280">Підключено до скла</text>

  <line x1="296" y1="328" x2="296" y2="382" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="291" y1="328" x2="301" y2="328" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="291" y1="382" x2="301" y2="382" stroke="#c0392b" stroke-width="1.5"/>
  <text x="308" y="348" font-size="12" font-weight="700" fill="#c0392b">+80 рядків (240..319)</text>
  <text x="308" y="366" font-size="12" fill="#c0392b">Непідключена GRAM</text>

  <!-- Підпис внизу лівої панелі -->
  <text x="252" y="402" font-size="12" fill="#6b7280" text-anchor="middle">Внутрішній розмір GRAM ST7789: 240 стовпчиків × 320 рядків</text>

  <!-- 2. Права панель: Математика прив'язки координат та команди вікна -->
  <rect x="504" y="80" width="432" height="332" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="720" y="104" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Математика прив'язки координат та команди вікна</text>

  <!-- Картка 1: Віконні команди CASET і RASET -->
  <rect x="518" y="118" width="404" height="92" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="532" y="136" font-size="12" font-weight="700" fill="#2457d6">1. Адресація активного вікна (команди ST7789)</text>
  <text x="532" y="156" font-size="12" fill="#1a1a1a">• CASET (0x2A): X_start = 0,  X_end = 239  (стовпчики матриці)</text>
  <text x="532" y="176" font-size="12" fill="#2457d6">• RASET (0x2B): Y_start = Y + Offset,  Y_end = Y + H - 1 + Offset</text>
  <text x="532" y="196" font-size="12" fill="#6b7280">  де (X, Y) — логічні координати, W та H — розміри вікна</text>

  <!-- Картка 2: Апаратний зсув рядків -->
  <rect x="518" y="222" width="404" height="92" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="532" y="240" font-size="12" font-weight="700" fill="#27ae60">2. Апаратний зсув рядків (Row Offset)</text>
  <text x="532" y="260" font-size="12" fill="#1a1a1a">• Для матриці 240×240: Offset становить 0, 20 або 80 рядків</text>
  <text x="532" y="280" font-size="12" fill="#1a1a1a">• Залежить від кута MADCTL (0°, 90°, 180°, 270°) та версії плати</text>
  <text x="532" y="300" font-size="12" fill="#27ae60">• Типово для модулів 1.3″ IPS: Offset = 0 або Offset = 80</text>

  <!-- Картка 3: Попередження про зсув -->
  <rect x="518" y="326" width="404" height="78" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="532" y="344" font-size="12" font-weight="700" fill="#c0392b">3. Наслідки відсутності програмного зсуву</text>
  <text x="532" y="364" font-size="12" fill="#1a1a1a">• Запис без зсуву відправляє 80 рядків у непідключену пам'ять</text>
  <text x="532" y="384" font-size="12" fill="#c0392b">• Результат: зрізаний край зображення та сміття/чорна смуга</text>

  <!-- 3. Підсумкова смуга внизу -->
  <rect x="24" y="424" width="912" height="34" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="445" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Фреймбуфер ST7789 має 240×320 точок; робота з матрицею 240×240 потребує програмного зсуву RASET (Row Offset)</text>
</svg>
