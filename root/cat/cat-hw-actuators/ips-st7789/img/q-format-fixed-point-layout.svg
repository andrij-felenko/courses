<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <!-- Arrow markers -->
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Формати чисел із фіксованою комою Q5.10 та Q1.15 для графіки ST7789</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Бітова структура, розподіл розрядів та арифметика зсувів без використання FPU</text>

  <!-- ==================== LEFT: BIT LAYOUTS & OPERATIONS ==================== -->

  <!-- BLOCK 1: Q5.10 Format Layout -->
  <rect x="60" y="76" width="510" height="92" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="74" y="92" font-size="13" font-weight="bold" fill="#1a1a1a">1. Формат Q5.10 (int16_t: кути, координати, загальна геометрія)</text>

  <!-- Block 1 Labels above cells -->
  <text x="89" y="107" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Знак</text>
  <text x="179" y="107" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Ціла частина (5 бітів)</text>
  <text x="404" y="107" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Дробова частина (10 бітів)</text>

  <!-- Block 1 Bit Cells (16 bits, width = 30 px each) -->
  <!-- Bit 15: Sign -->
  <rect x="74" y="112" width="30" height="26" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="89" y="129" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">S</text>

  <!-- Bits 14..10: Integer (5 bits) -->
  <rect x="104" y="112" width="30" height="26" rx="1" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="119" y="129" font-size="12" fill="#2457d6" text-anchor="middle">14</text>
  <rect x="134" y="112" width="30" height="26" rx="1" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="149" y="129" font-size="12" fill="#2457d6" text-anchor="middle">13</text>
  <rect x="164" y="112" width="30" height="26" rx="1" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="179" y="129" font-size="12" fill="#2457d6" text-anchor="middle">12</text>
  <rect x="194" y="112" width="30" height="26" rx="1" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="209" y="129" font-size="12" fill="#2457d6" text-anchor="middle">11</text>
  <rect x="224" y="112" width="30" height="26" rx="1" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="239" y="129" font-size="12" fill="#2457d6" text-anchor="middle">10</text>

  <!-- Comma Divider Line -->
  <line x1="254" y1="112" x2="254" y2="138" stroke="#c0392b" stroke-width="2"/>

  <!-- Bits 9..0: Fraction (10 bits) -->
  <rect x="254" y="112" width="30" height="26" rx="1" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="269" y="129" font-size="12" fill="#27ae60" text-anchor="middle">9</text>
  <rect x="284" y="112" width="30" height="26" rx="1" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="299" y="129" font-size="12" fill="#27ae60" text-anchor="middle">8</text>
  <rect x="314" y="112" width="30" height="26" rx="1" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="329" y="129" font-size="12" fill="#27ae60" text-anchor="middle">7</text>
  <rect x="344" y="112" width="30" height="26" rx="1" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="359" y="129" font-size="12" fill="#27ae60" text-anchor="middle">6</text>
  <rect x="374" y="112" width="30" height="26" rx="1" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="389" y="129" font-size="12" fill="#27ae60" text-anchor="middle">5</text>
  <rect x="404" y="112" width="30" height="26" rx="1" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="419" y="129" font-size="12" fill="#27ae60" text-anchor="middle">4</text>
  <rect x="434" y="112" width="30" height="26" rx="1" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="449" y="129" font-size="12" fill="#27ae60" text-anchor="middle">3</text>
  <rect x="464" y="112" width="30" height="26" rx="1" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="479" y="129" font-size="12" fill="#27ae60" text-anchor="middle">2</text>
  <rect x="494" y="112" width="30" height="26" rx="1" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="509" y="129" font-size="12" fill="#27ae60" text-anchor="middle">1</text>
  <rect x="524" y="112" width="30" height="26" rx="1" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="539" y="129" font-size="12" fill="#27ae60" text-anchor="middle">0</text>

  <!-- Block 1 Info Row -->
  <text x="74" y="156" font-size="12" fill="#6b7280">Діапазон: [-32.0 .. +31.999] | Крок сітки: 1/1024 ≈ 0.000976 (0.056° для кутів)</text>

  <!-- BLOCK 2: Q1.15 Format Layout -->
  <rect x="60" y="180" width="510" height="92" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="74" y="196" font-size="13" font-weight="bold" fill="#1a1a1a">2. Формат Q1.15 (int16_t: тригонометрія sin / cos для стрілок)</text>

  <!-- Block 2 Labels above cells -->
  <text x="89" y="211" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Знак</text>
  <text x="329" y="211" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Дробова частина: 15 бітів (ваги від 2⁻¹ до 2⁻¹⁵)</text>

  <!-- Block 2 Bit Cells -->
  <!-- Bit 15: Sign -->
  <rect x="74" y="216" width="30" height="26" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="89" y="233" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">S</text>

  <!-- Comma Divider Line -->
  <line x1="104" y1="216" x2="104" y2="242" stroke="#c0392b" stroke-width="2"/>

  <!-- Bits 14..0: Fraction (15 bits) -->
  <rect x="104" y="216" width="30" height="26" rx="1" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="119" y="233" font-size="12" fill="#27ae60" text-anchor="middle">14</text>
  <rect x="134" y="216" width="30" height="26" rx="1" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="149" y="233" font-size="12" fill="#27ae60" text-anchor="middle">13</text>
  <rect x="164" y="216" width="30" height="26" rx="1" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="179" y="233" font-size="12" fill="#27ae60" text-anchor="middle">12</text>
  <rect x="194" y="216" width="30" height="26" rx="1" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="209" y="233" font-size="12" fill="#27ae60" text-anchor="middle">11</text>
  <rect x="224" y="216" width="30" height="26" rx="1" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="239" y="233" font-size="12" fill="#27ae60" text-anchor="middle">10</text>
  <rect x="254" y="216" width="30" height="26" rx="1" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="269" y="233" font-size="12" fill="#27ae60" text-anchor="middle">9</text>
  <rect x="284" y="216" width="30" height="26" rx="1" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="299" y="233" font-size="12" fill="#27ae60" text-anchor="middle">8</text>
  <rect x="314" y="216" width="30" height="26" rx="1" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="329" y="233" font-size="12" fill="#27ae60" text-anchor="middle">7</text>
  <rect x="344" y="216" width="30" height="26" rx="1" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="359" y="233" font-size="12" fill="#27ae60" text-anchor="middle">6</text>
  <rect x="374" y="216" width="30" height="26" rx="1" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="389" y="233" font-size="12" fill="#27ae60" text-anchor="middle">5</text>
  <rect x="404" y="216" width="30" height="26" rx="1" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="419" y="233" font-size="12" fill="#27ae60" text-anchor="middle">4</text>
  <rect x="434" y="216" width="30" height="26" rx="1" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="449" y="233" font-size="12" fill="#27ae60" text-anchor="middle">3</text>
  <rect x="464" y="216" width="30" height="26" rx="1" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="479" y="233" font-size="12" fill="#27ae60" text-anchor="middle">2</text>
  <rect x="494" y="216" width="30" height="26" rx="1" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="509" y="233" font-size="12" fill="#27ae60" text-anchor="middle">1</text>
  <rect x="524" y="216" width="30" height="26" rx="1" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="539" y="233" font-size="12" fill="#27ae60" text-anchor="middle">0</text>

  <!-- Block 2 Info Row -->
  <text x="74" y="260" font-size="12" fill="#6b7280">Діапазон: [-1.0 .. +0.99997] | Крок сітки: 1/32768 ≈ 0.0000305 (ідеально для sin/cos)</text>

  <!-- BLOCK 3: Arithmetic Shift Operations -->
  <rect x="60" y="284" width="510" height="112" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.2"/>
  <rect x="60" y="284" width="510" height="24" rx="6" fill="#eaf0fd"/>
  <text x="74" y="301" font-size="13" font-weight="bold" fill="#2457d6">3. Базові операції зсуву та множення у Q-форматах</text>

  <!-- Row 1: int -> Q -->
  <rect x="74" y="314" width="114" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="131" y="328" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">int → Q (x &lt;&lt; N)</text>
  <line x1="194" y1="324" x2="216" y2="324" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="224" y="328" font-size="12" font-weight="bold" fill="#1a1a1a">fp = val &lt;&lt; 10</text>
  <text x="340" y="328" font-size="12" fill="#6b7280">Масштабування цілого: множення на 2ᴺ</text>

  <!-- Row 2: Q -> int -->
  <rect x="74" y="340" width="114" height="20" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="131" y="354" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Q → int (x &gt;&gt; N)</text>
  <line x1="194" y1="350" x2="216" y2="350" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="224" y="354" font-size="12" font-weight="bold" fill="#1a1a1a">val = fp &gt;&gt; 10</text>
  <text x="340" y="354" font-size="12" fill="#6b7280">Відкидання дробу: округлення до цілого</text>

  <!-- Row 3: Q x Q -->
  <rect x="74" y="366" width="114" height="20" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="131" y="380" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Q × Q ((a*b)&gt;&gt;N)</text>
  <line x1="194" y1="376" x2="216" y2="376" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="224" y="380" font-size="12" font-weight="bold" fill="#1a1a1a">(int32_t)a * b &gt;&gt; 15</text>
  <text x="368" y="380" font-size="12" fill="#6b7280">Вирівнювання розрядності Q15×Q15=Q30</text>

  <!-- Bottom Result Banner -->
  <rect x="60" y="408" width="510" height="28" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="315" y="426" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Висновок: обчислення без FPU в Q-форматі виконуються за 1 такт і прискорюють FPS у 20–50 разів</text>

  <!-- ==================== RIGHT: ENGINEERING CARDS ==================== -->

  <!-- Card 1: Performance without FPU -->
  <rect x="590" y="76" width="340" height="112" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.2"/>
  <rect x="590" y="76" width="340" height="26" rx="6" fill="#eaf0fd"/>
  <text x="602" y="94" font-size="13" font-weight="bold" fill="#2457d6">1. Фіксована кома проти float (без FPU)</text>

  <text x="602" y="118" font-size="12" font-weight="bold" fill="#1a1a1a">Швидкодія на Cortex-M0 / AVR</text>
  <text x="602" y="136" font-size="12" fill="#6b7280">Мікроконтролери без апаратного FPU емулюють</text>
  <text x="602" y="154" font-size="12" fill="#6b7280">float програмно (бібліотека soft-float, 100+ тактів).</text>
  <text x="602" y="172" font-size="12" font-weight="bold" fill="#2457d6">Q-арифметика — це звичайний int (1 такт CPU!).</text>

  <!-- Card 2: Q5.10 vs Q1.15 Trade-off -->
  <rect x="590" y="200" width="340" height="112" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.2"/>
  <rect x="590" y="200" width="340" height="26" rx="6" fill="#e9f7ef"/>
  <text x="602" y="218" font-size="13" font-weight="bold" fill="#27ae60">2. Баланс діапазону та точності</text>

  <text x="602" y="242" font-size="12" font-weight="bold" fill="#1a1a1a">Спеціалізація форматів під задачі</text>
  <text x="602" y="260" font-size="12" fill="#6b7280">Q5.10: діапазон ±32.0, точність ~0.001 (координати,</text>
  <text x="602" y="278" font-size="12" fill="#6b7280">радіуси, положення стрілок приладу на 240×240).</text>
  <text x="602" y="296" font-size="12" font-weight="bold" fill="#27ae60">Q1.15: діапазон ±1.0, крок 0.00003 (таблиці sin/cos).</text>

  <!-- Card 3: Multiplication Overflow Protection -->
  <rect x="590" y="324" width="340" height="112" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.2"/>
  <rect x="590" y="324" width="340" height="26" rx="6" fill="#fdecea"/>
  <text x="602" y="342" font-size="13" font-weight="bold" fill="#c0392b">3. Множення та розрядна сітка</text>

  <text x="602" y="366" font-size="12" font-weight="bold" fill="#1a1a1a">Подвоєння розрядності дробу</text>
  <text x="602" y="384" font-size="12" fill="#6b7280">При множенні Q15 × Q15 отримуємо формат Q30.</text>
  <text x="602" y="402" font-size="12" fill="#6b7280">Обов'язковий каст до (int32_t) перед множенням,</text>
  <text x="602" y="420" font-size="12" font-weight="bold" fill="#c0392b">а потім зсув &gt;&gt; 15 повертає результат у Q1.15.</text>
</svg>
