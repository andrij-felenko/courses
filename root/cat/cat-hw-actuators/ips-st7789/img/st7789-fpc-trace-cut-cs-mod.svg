<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Defs: Markers -->
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Апаратна модифікація 7-пінового модуля ST7789 для виведення лінії CS</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">Перерізання доріжки заземлення та припаювання провідника CS повертає сумісність зі спільною шиною</text>

  <!-- ==================== LEFT PANEL ==================== -->
  <rect x="24" y="80" width="444" height="376" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="246" y="106" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Конструкція 7-пінового модуля (зворотний бік)</text>

  <!-- PCB Body -->
  <rect x="42" y="122" width="408" height="216" rx="6" fill="#1b2a32" stroke="#2d4352" stroke-width="1.5"/>

  <!-- 7-Pin Header Strip -->
  <rect x="54" y="130" width="384" height="42" rx="4" fill="#0f172a" stroke="#1e293b"/>

  <!-- Header Pins: 7 real pins + 1 missing CS indicator -->
  <circle cx="76" cy="142" r="6.5" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
  <circle cx="76" cy="142" r="3" fill="#020617"/>
  <text x="76" y="163" font-size="10" font-weight="bold" fill="#e2e8f0" text-anchor="middle">GND</text>

  <circle cx="122" cy="142" r="6.5" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
  <circle cx="122" cy="142" r="3" fill="#020617"/>
  <text x="122" y="163" font-size="10" font-weight="bold" fill="#e2e8f0" text-anchor="middle">VCC</text>

  <circle cx="168" cy="142" r="6.5" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
  <circle cx="168" cy="142" r="3" fill="#020617"/>
  <text x="168" y="163" font-size="10" font-weight="bold" fill="#e2e8f0" text-anchor="middle">SCL</text>

  <circle cx="214" cy="142" r="6.5" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
  <circle cx="214" cy="142" r="3" fill="#020617"/>
  <text x="214" y="163" font-size="10" font-weight="bold" fill="#e2e8f0" text-anchor="middle">SDA</text>

  <circle cx="260" cy="142" r="6.5" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
  <circle cx="260" cy="142" r="3" fill="#020617"/>
  <text x="260" y="163" font-size="10" font-weight="bold" fill="#e2e8f0" text-anchor="middle">RES</text>

  <circle cx="306" cy="142" r="6.5" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
  <circle cx="306" cy="142" r="3" fill="#020617"/>
  <text x="306" y="163" font-size="10" font-weight="bold" fill="#e2e8f0" text-anchor="middle">DC</text>

  <circle cx="352" cy="142" r="6.5" fill="#f59e0b" stroke="#d97706" stroke-width="1"/>
  <circle cx="352" cy="142" r="3" fill="#020617"/>
  <text x="352" y="163" font-size="10" font-weight="bold" fill="#e2e8f0" text-anchor="middle">BLK</text>

  <circle cx="400" cy="142" r="6.5" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="2,2"/>
  <text x="400" y="163" font-size="10" font-weight="bold" fill="#ef4444" text-anchor="middle">НЕМАЄ</text>

  <!-- Warning Banner -->
  <rect x="54" y="178" width="384" height="20" rx="3" fill="#fdecea" stroke="#c0392b"/>
  <text x="246" y="192" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">Вивід CS не виведений на гребінку — він схований на платі!</text>

  <!-- PCB Solder Pads (Interface to FPC) -->
  <rect x="94" y="210" width="12" height="14" fill="#f59e0b" stroke="#b45309"/>
  <rect x="124" y="210" width="12" height="14" fill="#f59e0b" stroke="#b45309"/>
  <rect x="154" y="210" width="12" height="14" fill="#f59e0b" stroke="#b45309"/>
  <rect x="184" y="210" width="12" height="14" fill="#f59e0b" stroke="#b45309"/>
  <rect x="214" y="210" width="12" height="14" fill="#f59e0b" stroke="#b45309"/>
  <rect x="244" y="210" width="12" height="14" fill="#f59e0b" stroke="#b45309"/>
  <rect x="274" y="210" width="12" height="14" fill="#ef4444" stroke="#b91c1c" stroke-width="1.5"/>

  <!-- Trace from CS Pad to GND Polygon -->
  <line x1="286" y1="217" x2="330" y2="217" stroke="#ef4444" stroke-width="2.5"/>

  <!-- GND Polygon on PCB -->
  <rect x="330" y="204" width="96" height="38" rx="3" fill="#164e63" stroke="#0891b2"/>
  <text x="378" y="220" font-size="10" font-weight="bold" fill="#67e8f9" text-anchor="middle">Полігон GND</text>
  <text x="378" y="235" font-size="10" fill="#a5f3fc" text-anchor="middle">(земля 0 В)</text>

  <!-- FPC Flexible Ribbon -->
  <rect x="84" y="224" width="220" height="54" rx="4" fill="#d97706" stroke="#92400e" stroke-width="1.5"/>
  <text x="160" y="255" font-size="11" font-weight="bold" fill="#fef3c7" text-anchor="middle">Шлейф FPC</text>

  <!-- Internal hardware CS trace on FPC ribbon -->
  <line x1="280" y1="224" x2="280" y2="294" stroke="#fde047" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Callout for factory short -->
  <rect x="322" y="250" width="116" height="66" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="380" y="268" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">Вивід CS шлейфа</text>
  <text x="380" y="284" font-size="10" fill="#c0392b" text-anchor="middle">закорочений на</text>
  <text x="380" y="300" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">полігон GND!</text>
  <path d="M 322,260 L 310,260 L 310,222" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- LCD Glass with ST7789 COG -->
  <rect x="84" y="286" width="220" height="42" rx="4" fill="#0f172a" stroke="#475569"/>
  <rect x="109" y="294" width="170" height="26" rx="3" fill="#1e293b" stroke="#38bdf8"/>
  <text x="194" y="311" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle">Контролер ST7789 (скло)</text>

  <!-- Left Bottom Problem Box -->
  <rect x="42" y="352" width="408" height="90" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="56" y="371" font-size="12" font-weight="bold" fill="#c0392b">Апаратна проблема 7-пінової плати:</text>
  <text x="56" y="391" font-size="11" fill="#1a1a1a">• Вивід CS заземлений — ST7789 постійно активний на шині SPI</text>
  <text x="56" y="410" font-size="11" fill="#1a1a1a">• Спільна шина SPI не працює (колізії з SD-картами й сенсорами)</text>
  <text x="56" y="429" font-size="11" fill="#1a1a1a">• Будь-який чужий пакет викликає артефакти або збій дисплея</text>

  <!-- ==================== RIGHT PANEL ==================== -->
  <rect x="492" y="80" width="444" height="376" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="714" y="106" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Зона модифікації шлейфа FPC (макро-вигляд)</text>

  <!-- Macro Diagram Box -->
  <rect x="510" y="122" width="408" height="216" rx="6" fill="#1b2a32" stroke="#2d4352" stroke-width="1.5"/>

  <!-- Left: GND Polygon in Macro -->
  <rect x="524" y="134" width="86" height="120" rx="4" fill="#164e63" stroke="#0891b2" stroke-width="1.5"/>
  <text x="567" y="160" font-size="11" font-weight="bold" fill="#67e8f9" text-anchor="middle">Полігон</text>
  <text x="567" y="176" font-size="11" font-weight="bold" fill="#67e8f9" text-anchor="middle">GND</text>
  <text x="567" y="196" font-size="10" fill="#a5f3fc" text-anchor="middle">(заземлення)</text>

  <!-- Right: FPC Ribbon in Macro -->
  <rect x="744" y="134" width="160" height="120" rx="4" fill="#d97706" stroke="#92400e" stroke-width="1.5"/>
  <text x="824" y="156" font-size="11" font-weight="bold" fill="#fef3c7" text-anchor="middle">Шлейф FPC</text>
  <text x="824" y="172" font-size="10" fill="#fde68a" text-anchor="middle">(контакти дисплея)</text>

  <!-- Stub of copper from GND polygon -->
  <rect x="610" y="198" width="34" height="24" fill="#164e63" stroke="#0891b2"/>

  <!-- Cut Line (Red dashed) & Scalpel Marker -->
  <text x="649" y="174" font-size="10" font-weight="bold" fill="#ef4444" text-anchor="middle">РІЗ</text>
  <line x1="649" y1="184" x2="649" y2="236" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4,2"/>
  <path d="M 645,178 L 649,184 L 653,178" fill="none" stroke="#ef4444" stroke-width="2"/>

  <!-- Isolated CS Solder Pad -->
  <rect x="655" y="196" width="84" height="28" rx="4" fill="#15803d" stroke="#22c55e" stroke-width="1.5"/>
  <text x="692" y="214" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Вивід CS</text>

  <!-- Solder Droplet -->
  <circle cx="724" cy="210" r="7" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="722" cy="208" r="2.5" fill="#ffffff"/>

  <!-- Thin enameled wire -->
  <path d="M 724,210 C 740,210 748,192 766,192 L 896,192" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="824" y="210" font-size="10" font-weight="bold" fill="#10b981" text-anchor="middle">Новий дріт CS (0.1 мм)</text>
  <text x="824" y="226" font-size="10" fill="#a7f3d0" text-anchor="middle">➔ до вільного піна GPIO МК</text>

  <!-- Callout 1: Cut Line -->
  <rect x="524" y="266" width="186" height="60" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="617" y="284" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">Лінія різу скальпелем:</text>
  <text x="617" y="299" font-size="10" fill="#c0392b" text-anchor="middle">Повна ізоляція контакту CS</text>
  <text x="617" y="314" font-size="10" fill="#c0392b" text-anchor="middle">від земляного полігону GND</text>
  <line x1="649" y1="266" x2="649" y2="240" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Callout 2: Solder Point & Wire -->
  <rect x="724" y="266" width="186" height="60" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="817" y="284" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">Точка пайки та новий CS:</text>
  <text x="817" y="299" font-size="10" fill="#27ae60" text-anchor="middle">Припаяно емальований дріт</text>
  <text x="817" y="314" font-size="10" fill="#27ae60" text-anchor="middle">0.1 мм до виводу CS дисплея</text>
  <line x1="740" y1="266" x2="726" y2="224" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Right Bottom Solution Box -->
  <rect x="510" y="352" width="408" height="90" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="524" y="371" font-size="12" font-weight="bold" fill="#27ae60">Результат апаратної модифікації:</text>
  <text x="524" y="391" font-size="11" fill="#1a1a1a">• Вивід CS відрізано від GND і виведено на окремий GPIO</text>
  <text x="524" y="410" font-size="11" fill="#1a1a1a">• При CS = HIGH: ST7789 ігнорує всі сторонні транзакції SPI</text>
  <text x="524" y="429" font-size="11" fill="#1a1a1a">• Спільна шина вільна для SD-карт, флеш-пам'яті та сенсорів</text>

</svg>
