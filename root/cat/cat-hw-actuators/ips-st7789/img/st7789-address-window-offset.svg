<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Апаратні зміщення пам'яті ST7789 (240×320) під матрицю 1.3″ (240×240)</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Відображення вікна адресації CASET/RASET та зміщення X/Y-offset залежно від регістра MADCTL і кута повороту</text>

  <!-- ==================== ПАНЕЛЬ 1: GDDRAM ТА АКТИВНА МАТРИЦЯ (ЗЛІВА) ==================== -->
  <rect x="35" y="75" width="440" height="355" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="255" y="99" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Простір пам'яті GDDRAM та вікно 240×240</text>
  <text x="255" y="117" font-size="12" fill="#6b7280" text-anchor="middle">Буфер ST7789 (240×320) проти фізичної матриці 1.3″ (240×240)</text>

  <!-- Рамка GDDRAM (240x320) -->
  <!-- Активна зона 240x240 точок -->
  <rect x="155" y="148" width="180" height="180" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="245" y="228" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Видима матриця 1.3″</text>
  <text x="245" y="246" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">240 × 240 точок (IPS)</text>
  <text x="245" y="264" font-size="12" fill="#6b7280" text-anchor="middle">Активна область показу</text>

  <!-- Невикористовувана область 240x80 точок -->
  <rect x="155" y="328" width="180" height="60" fill="#ffffff" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="245" y="354" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Невикористовувана пам'ять</text>
  <text x="245" y="372" font-size="12" fill="#6b7280" text-anchor="middle">80 рядків (240×80 точок)</text>

  <!-- Координати CASET (вгорі) -->
  <text x="155" y="141" font-size="12" font-weight="bold" fill="#1a1a1a">Col 0</text>
  <text x="335" y="141" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Col 239</text>
  <line x1="195" y1="137" x2="275" y2="137" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="235" y="132" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">CASET</text>

  <!-- Координати RASET (ліворуч) -->
  <text x="147" y="155" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Row 0</text>
  <text x="147" y="325" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">Row 239</text>
  <text x="147" y="385" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">Row 319</text>

  <line x1="85" y1="165" x2="85" y2="305" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="80" y="232" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">RASET</text>
  <text x="80" y="248" font-size="12" fill="#6b7280" text-anchor="end">YS..YE</text>

  <!-- Розмірні лінії праворуч від матриці -->
  <line x1="345" y1="148" x2="345" y2="328" stroke="#2457d6" stroke-width="1.5"/>
  <text x="353" y="235" font-size="12" font-weight="bold" fill="#2457d6">H = 240 px</text>
  <text x="353" y="252" font-size="12" fill="#6b7280">Y_offset = 0</text>

  <line x1="345" y1="328" x2="345" y2="388" stroke="#c0392b" stroke-width="1.5"/>
  <text x="353" y="354" font-size="12" font-weight="bold" fill="#c0392b">ΔY = 80 px</text>
  <text x="353" y="371" font-size="12" fill="#6b7280">Зсув адреси</text>

  <!-- Підсумок внизу панелі 1 -->
  <text x="255" y="412" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вікно адресації: W = 240, H = 240 (ST7789 CASET / RASET)</text>


  <!-- ==================== ПАНЕЛЬ 2: РЕЖИМИ ОРІЄНТАЦІЇ (СПРАВА) ==================== -->
  <rect x="495" y="75" width="430" height="355" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="710" y="99" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Зміщення осей при зміні орієнтації (MADCTL 0x36)</text>
  <text x="710" y="117" font-size="12" fill="#6b7280" text-anchor="middle">Корекція X_offset та Y_offset для утримання зображення на матриці</text>

  <!-- КАРТКА 1: 0° Книжкова (Top Left) -->
  <rect x="510" y="132" width="195" height="102" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="522" y="152" font-size="12" font-weight="bold" fill="#2457d6">0° (Портрет)</text>
  <text x="522" y="170" font-size="12" fill="#6b7280">MADCTL: 0x00</text>
  <text x="522" y="189" font-size="12" font-weight="bold" fill="#1a1a1a">X_offset = 0 px</text>
  <text x="522" y="207" font-size="12" font-weight="bold" fill="#1a1a1a">Y_offset = 0 px</text>
  <text x="522" y="225" font-size="12" fill="#27ae60">Стандартний зсув</text>

  <!-- Міні-схема 0° -->
  <rect x="648" y="145" width="45" height="60" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="648" y="145" width="45" height="45" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="670" y="172" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">F</text>


  <!-- КАРТКА 2: 90° Альбомна (Top Right) -->
  <rect x="718" y="132" width="195" height="102" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="730" y="152" font-size="12" font-weight="bold" fill="#2457d6">90° (Альбомна)</text>
  <text x="730" y="170" font-size="12" fill="#6b7280">MADCTL: 0x70 (MV=1)</text>
  <text x="730" y="189" font-size="12" font-weight="bold" fill="#1a1a1a">X_offset = 0 px</text>
  <text x="730" y="207" font-size="12" font-weight="bold" fill="#1a1a1a">Y_offset = 0 px</text>
  <text x="730" y="225" font-size="12" fill="#2457d6">Обмін осей X ↔ Y</text>

  <!-- Міні-схема 90° -->
  <rect x="852" y="152" width="50" height="38" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="852" y="152" width="38" height="38" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="871" y="176" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Ⅎ</text>


  <!-- КАРТКА 3: 180° Портрет реверс (Bottom Left) -->
  <rect x="510" y="244" width="195" height="102" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="522" y="264" font-size="12" font-weight="bold" fill="#c0392b">180° (Портрет реверс)</text>
  <text x="522" y="282" font-size="12" fill="#6b7280">MADCTL: 0xC0 (MX=MY=1)</text>
  <text x="522" y="301" font-size="12" font-weight="bold" fill="#1a1a1a">X_offset = 0 px</text>
  <text x="522" y="319" font-size="12" font-weight="bold" fill="#c0392b">Y_offset = 80 px</text>
  <text x="522" y="337" font-size="12" fill="#c0392b">Компенсація 80 рядків</text>

  <!-- Міні-схема 180° -->
  <rect x="648" y="258" width="45" height="60" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="648" y="273" width="45" height="45" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="670" y="300" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Ⅎ</text>


  <!-- КАРТКА 4: 270° Альбомна реверс (Bottom Right) -->
  <rect x="718" y="244" width="195" height="102" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="730" y="264" font-size="12" font-weight="bold" fill="#c0392b">270° (Альбомна реверс)</text>
  <text x="730" y="282" font-size="12" fill="#6b7280">MADCTL: 0xA0 (MV=MY=1)</text>
  <text x="730" y="301" font-size="12" font-weight="bold" fill="#c0392b">X_offset = 80 px</text>
  <text x="730" y="319" font-size="12" font-weight="bold" fill="#1a1a1a">Y_offset = 0 px</text>
  <text x="730" y="337" font-size="12" fill="#c0392b">Компенсація по осі X</text>

  <!-- Міні-схема 270° -->
  <rect x="852" y="264" width="50" height="38" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="864" y="264" width="38" height="38" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="883" y="288" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">F</text>


  <!-- НИЖНЯ КАРТКА: ФОРМУЛА АДРЕСАЦІЇ ДРАЙВЕРА -->
  <rect x="510" y="356" width="403" height="60" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="711" y="378" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">CASET: [X + X_offset, X + W - 1 + X_offset]</text>
  <text x="711" y="398" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">RASET: [Y + Y_offset, Y + H - 1 + Y_offset]</text>
</svg>
