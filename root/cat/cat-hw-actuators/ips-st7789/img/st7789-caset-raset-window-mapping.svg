<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Відображення координат LVGL у віконні команди CASET/RASET (ST7789)</text>
  <text x="480" y="48" text-anchor="middle" font-size="13" fill="#6b7280">Трансляція прямокутника lv_area_t у GRAM 240×320 з компенсацією апаратного зміщення (Offset)</text>

  <!-- Панель 1: Логічний екран LVGL -->
  <rect x="24" y="66" width="260" height="248" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="36" y="86" font-size="13" font-weight="bold" fill="#1a1a1a">1. Логічний екран LVGL (240×240)</text>

  <!-- Екран 240x240 -->
  <rect x="36" y="98" width="136" height="136" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="58" y="115" width="68" height="45" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="92" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Оновлення</text>

  <text x="180" y="112" font-size="12" fill="#6b7280">X: 0..239</text>
  <text x="180" y="130" font-size="12" fill="#6b7280">Y: 0..239</text>

  <!-- Підписи координат -->
  <text x="36" y="254" font-size="12" font-weight="bold" fill="#2457d6">lv_area_t (dirty area):</text>
  <text x="36" y="272" font-size="12" fill="#1a1a1a">• x1 = 40,  y1 = 30 (лівий верх)</text>
  <text x="36" y="290" font-size="12" fill="#1a1a1a">• x2 = 160, y2 = 110 (правий низ)</text>

  <!-- Стрілка 1 -> 2 -->
  <line x1="284" y1="170" x2="296" y2="170" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Панель 2: Обчислення в disp_flush -->
  <rect x="300" y="66" width="342" height="248" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="312" y="86" font-size="13" font-weight="bold" fill="#1a1a1a">2. Трансляція в disp_flush() &amp; SPI</text>

  <!-- Блок формул -->
  <rect x="312" y="96" width="318" height="62" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="322" y="114" font-size="12" font-weight="bold" fill="#1a1a1a">Додавання апаратного офсету:</text>
  <text x="322" y="132" font-size="12" fill="#1a1a1a">XS = 40 + X_OFF(0) = <tspan font-weight="bold" fill="#2457d6">40</tspan>; XE = <tspan font-weight="bold" fill="#2457d6">160</tspan></text>
  <text x="322" y="150" font-size="12" fill="#1a1a1a">YS = 30 + Y_OFF(80) = <tspan font-weight="bold" fill="#27ae60">110</tspan>; YE = <tspan font-weight="bold" fill="#27ae60">190</tspan></text>

  <!-- Блок команд SPI -->
  <rect x="312" y="166" width="318" height="138" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="322" y="184" font-size="12" font-weight="bold" fill="#2457d6">Формування пакетів шини SPI:</text>
  <text x="322" y="204" font-size="12" font-weight="bold" fill="#1a1a1a">1. CASET (0x2A) — координати X [4 байти]:</text>
  <text x="336" y="222" font-size="12" fill="#2457d6">[ 0x00, 40 (XS), 0x00, 160 (XE) ]</text>
  <text x="322" y="244" font-size="12" font-weight="bold" fill="#1a1a1a">2. RASET (0x2B) — координати Y [4 байти]:</text>
  <text x="336" y="262" font-size="12" fill="#27ae60">[ 0x00, 110 (YS), 0x00, 190 (YE) ]</text>
  <text x="322" y="284" font-size="12" font-weight="bold" fill="#1a1a1a">3. RAMWR (0x2C) ➔ запис масиву пікселів</text>

  <!-- Стрілка 2 -> 3 -->
  <line x1="642" y1="170" x2="654" y2="170" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Панель 3: ST7789 GRAM -->
  <rect x="658" y="66" width="278" height="248" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="670" y="86" font-size="13" font-weight="bold" fill="#1a1a1a">3. Масив ST7789 GRAM (240×320)</text>

  <!-- GRAM рамка 240x320 -->
  <rect x="670" y="98" width="116" height="154" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Невидимий офсет 80 рядків -->
  <rect x="670" y="98" width="116" height="38" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="728" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Зсув 80 рядків</text>

  <!-- Видима зона скла 240x240 -->
  <rect x="670" y="136" width="116" height="116" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Прямокутник запису в GRAM -->
  <rect x="689" y="150" width="58" height="39" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="718" y="174" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">RAMWR</text>

  <!-- Підписи праворуч від GRAM -->
  <text x="796" y="118" font-size="12" fill="#c0392b">Невидима зона</text>
  <text x="796" y="134" font-size="12" fill="#6b7280">(рядки 0..79)</text>

  <text x="796" y="174" font-size="12" font-weight="bold" fill="#27ae60">Видиме скло</text>
  <text x="796" y="190" font-size="12" fill="#6b7280">(рядки 80..319)</text>

  <text x="670" y="274" font-size="12" font-weight="bold" fill="#27ae60">Результат: точна посадка вікна</text>
  <text x="670" y="292" font-size="12" fill="#1a1a1a">без зрізання пікселів чи артефактів!</text>

  <!-- Нижні картки -->
  <!-- Картка 1: Код функції -->
  <rect x="24" y="324" width="450" height="116" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="24" y="324" width="450" height="24" rx="8" fill="#eaf0fd"/>
  <text x="36" y="340" font-size="12" font-weight="bold" fill="#2457d6">Реалізація встановлення вікна в драйвері C:</text>
  <text x="36" y="360" font-size="12" fill="#1a1a1a">void st7789_set_window(uint16_t x1, uint16_t y1, uint16_t x2, uint16_t y2) {{</text>
  <text x="48" y="376" font-size="12" fill="#2457d6">  st7789_cmd(0x2A); st7789_data16(x1 + X_OFF); st7789_data16(x2 + X_OFF);</text>
  <text x="48" y="392" font-size="12" fill="#27ae60">  st7789_cmd(0x2B); st7789_data16(y1 + Y_OFF); st7789_data16(y2 + Y_OFF);</text>
  <text x="48" y="408" font-size="12" fill="#1a1a1a">  st7789_cmd(0x2C); // Контролер готовий приймати потік пікселів</text>
  <text x="36" y="424" font-size="12" fill="#1a1a1a">}}</text>

  <!-- Картка 2: Чому 240x240 у 240x320? -->
  <rect x="486" y="324" width="450" height="116" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="486" y="324" width="450" height="24" rx="8" fill="#e9f7ef"/>
  <text x="498" y="340" font-size="12" font-weight="bold" fill="#27ae60">Причина зміщення 240×240 у буфері 240×320 GRAM:</text>
  <text x="498" y="362" font-size="12" fill="#1a1a1a">• Контролер ST7789 апаратно містить відеопам'ять 240×320 точок.</text>
  <text x="498" y="380" font-size="12" fill="#1a1a1a">• Дисплей 1.3" IPS використовує фізично меншу матрицю 240×240.</text>
  <text x="498" y="398" font-size="12" fill="#1a1a1a">• Залежно від орієнтації (MADCTL), скло прив'язане до рядків 80..319.</text>
  <text x="498" y="418" font-size="12" font-weight="bold" fill="#c0392b">Без врахування офсету: графік зсувається, виникає білий шум!</text>
</svg>
