<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-red-rev" markerWidth="8" markerHeight="8" refX="0.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M7,0 L0,3.5 L7,7 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6.5" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="26" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Часова діаграма 4-дротового інтерфейсу SPI контролера ST7789</text>
  <text x="480" y="46" font-size="13" text-anchor="middle" fill="#6b7280">Керування лінією D/C (Data/Command), стробування тактовим сигналом SCK і захисний інтервал перед зміною стану</text>

  <!-- ГОЛОВНА ПАНЕЛЬ ЧАСОВОЇ ДІАГРАМИ -->
  <rect x="18" y="60" width="924" height="262" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Біле поле сигналів -->
  <rect x="160" y="70" width="770" height="242" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- ПІДПИСИ ЛІНІЙ ЛІВОРУЧ -->
  <text x="30" y="104" font-size="13" font-weight="700" fill="#2457d6">CS</text>
  <text x="30" y="118" font-size="12" fill="#6b7280">Chip Select</text>

  <text x="30" y="156" font-size="13" font-weight="700" fill="#c0392b">D/C</text>
  <text x="30" y="170" font-size="12" fill="#6b7280">Data / Cmd</text>

  <text x="30" y="214" font-size="13" font-weight="700" fill="#1a1a1a">SCK</text>
  <text x="30" y="228" font-size="12" fill="#6b7280">SPI Clock</text>

  <text x="30" y="268" font-size="13" font-weight="700" fill="#27ae60">MOSI</text>
  <text x="30" y="282" font-size="12" fill="#6b7280">SDA (Дані)</text>

  <!-- ЗОНА ЗАХИСНОГО ІНТЕРВАЛУ t_hold -->
  <rect x="444" y="74" width="66" height="216" fill="#fdecea" opacity="0.6"/>
  <line x1="444" y1="74" x2="444" y2="290" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="510" y1="74" x2="510" y2="290" stroke="#c0392b" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Стрілка та напис t_hold -->
  <line x1="446" y1="84" x2="508" y2="84" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-red-rev)" marker-end="url(#arr-red)"/>
  <text x="477" y="100" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">t_hold &gt; 10 нс</text>
  <text x="477" y="114" font-size="12" text-anchor="middle" fill="#c0392b">(BSY = 0)</text>

  <!-- СИГНАЛ 1: CS (Chip Select, активний LOW) -->
  <path d="M 166,94 L 186,94 L 194,116 L 860,116 L 868,94 L 920,94" fill="none" stroke="#2457d6" stroke-width="2.2"/>
  <text x="210" y="110" font-size="12" font-weight="700" fill="#2457d6">CS = 0 (активний)</text>

  <!-- СИГНАЛ 2: D/C (Data / Command) -->
  <!-- Low під час команди (до x = 510), потім High під час даних -->
  <path d="M 166,146 L 190,146 L 198,168 L 504,168 L 512,146 L 920,146" fill="none" stroke="#c0392b" stroke-width="2.2"/>
  <text x="220" y="162" font-size="12" font-weight="700" fill="#c0392b">D/C = 0 (Команда 0x2C)</text>
  <text x="540" y="140" font-size="12" font-weight="700" fill="#27ae60">D/C = 1 (Дані пікселів)</text>

  <!-- СИГНАЛ 3: SCK (Serial Clock, SPI Mode 0) -->
  <!-- 8 тактів для команди (x = 220..444) -->
  <path d="M 166,226 L 220,226 
           L 220,204 L 234,204 L 234,226 L 248,226 
           L 248,204 L 262,204 L 262,226 L 276,226 
           L 276,204 L 290,204 L 290,226 L 304,226 
           L 304,204 L 318,204 L 318,226 L 332,226 
           L 332,204 L 346,204 L 346,226 L 360,226 
           L 360,204 L 374,204 L 374,226 L 388,226 
           L 388,204 L 402,204 L 402,226 L 416,226 
           L 416,204 L 430,204 L 430,226 L 444,226 
           L 530,226 
           L 530,204 L 544,204 L 544,226 L 558,226 
           L 558,204 L 572,204 L 572,226 L 586,226 
           L 586,204 L 600,204 L 600,226 L 614,226 
           L 614,204 L 628,204 L 628,226 L 642,226 
           L 642,204 L 656,204 L 656,226 L 670,226 
           L 670,204 L 684,204 L 684,226 L 698,226 
           L 698,204 L 712,204 L 712,226 L 726,226 
           L 726,204 L 740,204 L 740,226 L 754,226 
           L 754,204 L 768,204 L 768,226 L 782,226 
           L 782,204 L 796,204 L 796,226 L 810,226 
           L 810,204 L 824,204 L 824,226 L 838,226 
           L 838,204 L 852,204 L 852,226 L 920,226" 
        fill="none" stroke="#1a1a1a" stroke-width="1.8"/>

  <!-- СИГНАЛ 4: MOSI (Дані на лінії) -->
  <!-- Байт команди: 0x2C = 0010 1100b -->
  <rect x="220" y="254" width="224" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="332" y="271" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">Команда: 0x2C (RAMWR — запис у пам'ять)</text>

  <!-- Байти даних: Піксель RGB565 -->
  <rect x="530" y="254" width="322" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="691" y="271" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">Дані пікселів: Байт 1 [R:G] + Байт 2 [G:B]</text>

  <!-- Спільна вісь часу внизу -->
  <line x1="170" y1="300" x2="904" y2="300" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="912" y="304" font-size="12" font-weight="700" fill="#1a1a1a">t</text>

  <!-- КАРТКА 1: Помилка передчасного D/C (Ліворуч) -->
  <rect x="18" y="332" width="452" height="96" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="32" y="354" font-size="13" font-weight="700" fill="#c0392b">Апаратна помилка: передчасне підняття лінії D/C</text>
  <text x="32" y="374" font-size="12" fill="#1a1a1a">• Зміна D/C у 1 до спаду 8-го такту SCK спотворює останній біт команди</text>
  <text x="32" y="392" font-size="12" fill="#1a1a1a">• Виклик GPIO_SetBits(DC) одразу після spi_send() без очікування BSY=0</text>
  <text x="32" y="410" font-size="12" fill="#6b7280">• Наслідок: ST7789 не розпізнає 0x2C, відсутнє зображення на екрані</text>

  <!-- КАРТКА 2: Коректне керування D/C (Праворуч) -->
  <rect x="490" y="332" width="452" height="96" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="504" y="354" font-size="13" font-weight="700" fill="#27ae60">Правильне керування: синхронізація за прапорцем BSY</text>
  <text x="504" y="374" font-size="12" fill="#1a1a1a">• Обов'язкове очікування завершення зсуву: while (SPI-&gt;SR &amp; SPI_SR_BSY);</text>
  <text x="504" y="392" font-size="12" fill="#1a1a1a">• Витримка t_hold &gt; 10 нс гарантує фіксацію команди контролером ST7789</text>
  <text x="504" y="410" font-size="12" fill="#6b7280">• Безперервний потік пікселів DMA після підняття лінії D/C у високий стан</text>
</svg>
