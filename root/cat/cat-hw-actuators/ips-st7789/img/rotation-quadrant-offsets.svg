<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Підкладка полотна -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Зсуви активного вікна 240×240 у просторі GRAM 240×320 (ST7789)</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Невикористані 80 точок зміщують початок адресації (Δcol, Δrow) лише при поворотах на 180° та 270°</text>

  <!-- ==================== КВАДРАНТ 1: 0° ==================== -->
  <rect x="24" y="70" width="216" height="388" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="132" y="94" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0° · Книжкова</text>
  <text x="132" y="110" font-size="12" fill="#6b7280" text-anchor="middle">Portrait</text>
  <rect x="48" y="118" width="168" height="22" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="132" y="133" font-size="12" font-weight="600" fill="#2457d6" text-anchor="middle">MY=0  MX=0  MV=0</text>

  <!-- GRAM схема 0° -->
  <rect x="78" y="150" width="108" height="108" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <rect x="78" y="258" width="108" height="36" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="90" cy="162" r="2.5" fill="#2457d6"/>
  <line x1="90" y1="162" x2="122" y2="162" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <text x="127" y="166" font-size="12" font-weight="bold" fill="#2457d6">X</text>
  <line x1="90" y1="162" x2="90" y2="194" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <text x="96" y="194" font-size="12" font-weight="bold" fill="#2457d6">Y</text>
  <text x="132" y="226" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">240 × 240</text>
  <text x="132" y="242" font-size="12" fill="#2457d6" text-anchor="middle">Дисплей</text>
  <text x="132" y="280" font-size="12" font-weight="600" fill="#c0392b" text-anchor="middle">80 px (RAM)</text>

  <!-- Зсуви 0° -->
  <rect x="38" y="304" width="188" height="52" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <line x1="132" y1="308" x2="132" y2="352" stroke="#d0d7de" stroke-width="1"/>
  <text x="85" y="322" font-size="12" fill="#6b7280" text-anchor="middle">Зсув X (col)</text>
  <text x="85" y="344" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Δcol = 0</text>
  <text x="179" y="322" font-size="12" fill="#6b7280" text-anchor="middle">Зсув Y (row)</text>
  <text x="179" y="344" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Δrow = 0</text>

  <!-- Адресація 0° -->
  <text x="132" y="376" font-size="12" font-weight="600" fill="#1a1a1a" text-anchor="middle">Адреси у фреймбуфері:</text>
  <text x="132" y="394" font-size="12" fill="#1a1a1a" text-anchor="middle">CASET: 0 .. 239</text>
  <text x="132" y="412" font-size="12" fill="#1a1a1a" text-anchor="middle">RASET: 0 .. 239</text>
  <text x="132" y="432" font-size="12" fill="#6b7280" text-anchor="middle">Невидимі: рядки 240..319</text>
  <text x="132" y="448" font-size="12" fill="#6b7280" text-anchor="middle">Зсув не потрібен</text>

  <!-- ==================== КВАДРАНТ 2: 90° ==================== -->
  <rect x="256" y="70" width="216" height="388" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="364" y="94" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">90° · Альбомна</text>
  <text x="364" y="110" font-size="12" fill="#6b7280" text-anchor="middle">Landscape</text>
  <rect x="280" y="118" width="168" height="22" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="364" y="133" font-size="12" font-weight="600" fill="#2457d6" text-anchor="middle">MY=0  MX=1  MV=1</text>

  <!-- GRAM схема 90° -->
  <rect x="292" y="168" width="108" height="108" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <rect x="400" y="168" width="36" height="108" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="304" cy="180" r="2.5" fill="#2457d6"/>
  <line x1="304" y1="180" x2="336" y2="180" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <text x="340" y="184" font-size="12" font-weight="bold" fill="#2457d6">X</text>
  <line x1="304" y1="180" x2="304" y2="212" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <text x="310" y="212" font-size="12" font-weight="bold" fill="#2457d6">Y</text>
  <text x="346" y="244" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">240 × 240</text>
  <text x="346" y="260" font-size="12" fill="#2457d6" text-anchor="middle">Дисплей</text>
  <text x="418" y="218" font-size="12" font-weight="600" fill="#c0392b" text-anchor="middle">80 px</text>
  <text x="418" y="234" font-size="12" fill="#c0392b" text-anchor="middle">RAM</text>

  <!-- Зсуви 90° -->
  <rect x="270" y="304" width="188" height="52" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <line x1="364" y1="308" x2="364" y2="352" stroke="#d0d7de" stroke-width="1"/>
  <text x="317" y="322" font-size="12" fill="#6b7280" text-anchor="middle">Зсув X (col)</text>
  <text x="317" y="344" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Δcol = 0</text>
  <text x="411" y="322" font-size="12" fill="#6b7280" text-anchor="middle">Зсув Y (row)</text>
  <text x="411" y="344" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Δrow = 0</text>

  <!-- Адресація 90° -->
  <text x="364" y="376" font-size="12" font-weight="600" fill="#1a1a1a" text-anchor="middle">Діапазони адрес GRAM:</text>
  <text x="364" y="394" font-size="12" fill="#1a1a1a" text-anchor="middle">CASET: 0 .. 239</text>
  <text x="364" y="412" font-size="12" fill="#1a1a1a" text-anchor="middle">RASET: 0 .. 239</text>
  <text x="364" y="432" font-size="12" fill="#6b7280" text-anchor="middle">Невидимі: стовпчики 240..319</text>
  <text x="364" y="448" font-size="12" fill="#6b7280" text-anchor="middle">Зсув не потрібен</text>

  <!-- ==================== КВАДРАНТ 3: 180° ==================== -->
  <rect x="488" y="70" width="216" height="388" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="596" y="94" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">180° · Перевернута</text>
  <text x="596" y="110" font-size="12" fill="#6b7280" text-anchor="middle">Inverted Portrait</text>
  <rect x="512" y="118" width="168" height="22" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="596" y="133" font-size="12" font-weight="600" fill="#2457d6" text-anchor="middle">MY=1  MX=1  MV=0</text>

  <!-- GRAM схема 180° -->
  <rect x="542" y="150" width="108" height="36" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="542" y="186" width="108" height="108" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="596" y="172" font-size="12" font-weight="600" fill="#c0392b" text-anchor="middle">80 px (RAM)</text>
  <circle cx="554" cy="198" r="2.5" fill="#2457d6"/>
  <line x1="554" y1="198" x2="586" y2="198" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <text x="590" y="202" font-size="12" font-weight="bold" fill="#2457d6">X</text>
  <line x1="554" y1="198" x2="554" y2="230" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <text x="560" y="230" font-size="12" font-weight="bold" fill="#2457d6">Y</text>
  <text x="596" y="262" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">240 × 240</text>
  <text x="596" y="278" font-size="12" fill="#2457d6" text-anchor="middle">Дисплей</text>

  <!-- Зсуви 180° -->
  <rect x="502" y="304" width="188" height="52" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="596" y1="308" x2="596" y2="352" stroke="#d0d7de" stroke-width="1"/>
  <text x="549" y="322" font-size="12" fill="#6b7280" text-anchor="middle">Зсув X (col)</text>
  <text x="549" y="344" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Δcol = 0</text>
  <text x="643" y="322" font-size="12" fill="#27ae60" font-weight="600" text-anchor="middle">Зсув Y (row)</text>
  <text x="643" y="344" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Δrow = 80</text>

  <!-- Адресація 180° -->
  <text x="596" y="376" font-size="12" font-weight="600" fill="#1a1a1a" text-anchor="middle">Діапазони адрес GRAM:</text>
  <text x="596" y="394" font-size="12" fill="#1a1a1a" text-anchor="middle">CASET: 0 .. 239</text>
  <text x="596" y="412" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">RASET: 80 .. 319</text>
  <text x="596" y="432" font-size="12" fill="#6b7280" text-anchor="middle">Невидимі: рядки 0..79</text>
  <text x="596" y="448" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Зсув рядків +80</text>

  <!-- ==================== КВАДРАНТ 4: 270° ==================== -->
  <rect x="720" y="70" width="216" height="388" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="828" y="94" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">270° · Перевернута</text>
  <text x="828" y="110" font-size="12" fill="#6b7280" text-anchor="middle">Inverted Landscape</text>
  <rect x="744" y="118" width="168" height="22" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="828" y="133" font-size="12" font-weight="600" fill="#2457d6" text-anchor="middle">MY=1  MX=0  MV=1</text>

  <!-- GRAM схема 270° -->
  <rect x="756" y="168" width="36" height="108" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4 3"/>
  <rect x="792" y="168" width="108" height="108" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="774" y="218" font-size="12" font-weight="600" fill="#c0392b" text-anchor="middle">80 px</text>
  <text x="774" y="234" font-size="12" fill="#c0392b" text-anchor="middle">RAM</text>
  <circle cx="804" cy="180" r="2.5" fill="#2457d6"/>
  <line x1="804" y1="180" x2="836" y2="180" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <text x="840" y="184" font-size="12" font-weight="bold" fill="#2457d6">X</text>
  <line x1="804" y1="180" x2="804" y2="212" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <text x="810" y="212" font-size="12" font-weight="bold" fill="#2457d6">Y</text>
  <text x="846" y="244" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">240 × 240</text>
  <text x="846" y="260" font-size="12" fill="#2457d6" text-anchor="middle">Дисплей</text>

  <!-- Зсуви 270° -->
  <rect x="734" y="304" width="188" height="52" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="828" y1="308" x2="828" y2="352" stroke="#d0d7de" stroke-width="1"/>
  <text x="781" y="322" font-size="12" fill="#27ae60" font-weight="600" text-anchor="middle">Зсув X (col)</text>
  <text x="781" y="344" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Δcol = 80</text>
  <text x="875" y="322" font-size="12" fill="#6b7280" text-anchor="middle">Зсув Y (row)</text>
  <text x="875" y="344" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Δrow = 0</text>

  <!-- Адресація 270° -->
  <text x="828" y="376" font-size="12" font-weight="600" fill="#1a1a1a" text-anchor="middle">Діапазони адрес GRAM:</text>
  <text x="828" y="394" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">CASET: 80 .. 319</text>
  <text x="828" y="412" font-size="12" fill="#1a1a1a" text-anchor="middle">RASET: 0 .. 239</text>
  <text x="828" y="432" font-size="12" fill="#6b7280" text-anchor="middle">Невидимі: стовпчики 0..79</text>
  <text x="828" y="448" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Зсув стовпчиків +80</text>
</svg>
