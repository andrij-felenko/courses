<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Фізика заряду комірки TFT: імпульси VGH/VGL та спад напруги витоку</text>
  <text x="480" y="48" text-anchor="middle" font-size="13" fill="#6b7280">Автономна регенерація 60 Гц (T = 16.6 мс) компенсує витік C_LC + C_st та запобігає мерехтінню пікселя</text>

  <!-- Ліва колонка: Схема + Осцилограми -->
  <!-- Схема TFT -->
  <rect x="24" y="66" width="540" height="88" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="36" y="84" font-size="13" font-weight="bold" fill="#1a1a1a">Еквівалентна схема субпікселя TFT (рідкий кристал + C_st)</text>

  <!-- Лінії схеми -->
  <line x1="36" y1="116" x2="94" y2="116" stroke="#2457d6" stroke-width="2"/>
  <text x="36" y="104" font-size="12" font-weight="bold" fill="#2457d6">V_data</text>

  <!-- Транзистор TFT -->
  <rect x="94" y="106" width="36" height="20" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="112" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">TFT</text>
  <line x1="112" y1="92" x2="112" y2="106" stroke="#c0392b" stroke-width="1.5"/>
  <text x="116" y="100" font-size="12" font-weight="bold" fill="#c0392b">Gate</text>

  <!-- Вузол V_pixel -->
  <line x1="130" y1="116" x2="180" y2="116" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="156" cy="116" r="3" fill="#1a1a1a"/>
  <text x="146" y="104" font-size="12" font-weight="bold" fill="#1a1a1a">V_pixel</text>

  <!-- Відгалуження на C_LC та C_st -->
  <line x1="180" y1="116" x2="310" y2="116" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Конденсатор C_LC -->
  <line x1="220" y1="116" x2="220" y2="124" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="210" y1="124" x2="230" y2="124" stroke="#2457d6" stroke-width="2"/>
  <line x1="210" y1="129" x2="230" y2="129" stroke="#2457d6" stroke-width="2"/>
  <line x1="220" y1="129" x2="220" y2="138" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="236" y="128" font-size="12" font-weight="bold" fill="#2457d6">C_LC</text>

  <!-- Конденсатор C_st -->
  <line x1="300" y1="116" x2="300" y2="124" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="290" y1="124" x2="310" y2="124" stroke="#27ae60" stroke-width="2"/>
  <line x1="290" y1="129" x2="310" y2="129" stroke="#27ae60" stroke-width="2"/>
  <line x1="300" y1="129" x2="300" y2="138" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="316" y="128" font-size="12" font-weight="bold" fill="#27ae60">C_st</text>

  <!-- Шина V_com -->
  <line x1="190" y1="138" x2="330" y2="138" stroke="#6b7280" stroke-width="1.5"/>
  <text x="336" y="142" font-size="12" fill="#6b7280">V_com</text>

  <!-- Пояснення праворуч у схемі -->
  <text x="400" y="112" font-size="12" fill="#1a1a1a">R_off ≈ 10¹² Ом (витік TFT)</text>
  <text x="400" y="130" font-size="12" fill="#c0392b">C_st утримує напругу кадру</text>

  <!-- Осцилограми -->
  <rect x="24" y="162" width="540" height="278" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="36" y="180" font-size="13" font-weight="bold" fill="#1a1a1a">Часові осцилограми затвора V_gate та пікселя V_pixel</text>

  <!-- Осі V_gate -->
  <text x="70" y="202" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">+13 В (VGH)</text>
  <text x="70" y="226" text-anchor="end" font-size="12" fill="#6b7280">-10 В (VGL)</text>
  <line x1="76" y1="222" x2="520" y2="222" stroke="#d0d7de" stroke-width="1"/>

  <!-- Імпульси затвора V_gate -->
  <path d="M 76,222 L 86,222 L 86,198 L 100,198 L 100,222 L 290,222 L 290,198 L 304,198 L 304,222 L 520,222" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="108" y="196" font-size="12" font-weight="bold" fill="#c0392b">Імпульс вибірки (~15 мкс)</text>

  <!-- Розділювач осцилограм -->
  <line x1="76" y1="236" x2="520" y2="236" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Осі V_pixel -->
  <text x="70" y="258" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">+4.5 В</text>
  <text x="70" y="318" text-anchor="end" font-size="12" fill="#6b7280">0 В (Vcom)</text>
  <text x="70" y="378" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">-4.5 В</text>

  <line x1="76" y1="314" x2="520" y2="314" stroke="#d0d7de" stroke-width="1"/>

  <!-- Криві V_pixel -->
  <!-- Кадр 1: Позитивна полярність -->
  <!-- Заряд до +4.5 В -->
  <path d="M 76,314 L 86,314 L 92,256 L 100,256" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- 60 Гц спад (зелений) -->
  <path d="M 100,256 L 290,261" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <text x="140" y="250" font-size="12" font-weight="bold" fill="#27ae60">60 Гц: стабільний заряд (спад &lt;2%)</text>

  <!-- &lt;30 Гц глибокий спад (червоний пунктир) -->
  <path d="M 100,256 Q 200,262 290,290" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,4"/>
  <text x="96" y="286" font-size="12" font-weight="bold" fill="#c0392b">&lt;30 Гц: спад ΔV (мерехтіння)</text>

  <!-- Кадр 2: Інверсія полярності до -4.5 В -->
  <!-- Заряд до -4.5 В -->
  <path d="M 290,261 L 292,314 L 298,372 L 304,372" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- 60 Гц утримання на -4.5 В -->
  <path d="M 304,372 L 500,367" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <text x="320" y="360" font-size="12" font-weight="bold" fill="#2457d6">Інверсія полярності (-4.5 В, AC Drive)</text>

  <!-- Часові позначки знизу -->
  <line x1="86" y1="400" x2="290" y2="400" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="188" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Кадр 1: T = 16.6 мс (60 Гц)</text>

  <line x1="290" y1="400" x2="494" y2="400" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="392" y="418" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Кадр 2: T = 16.6 мс (інверсія)</text>

  <!-- Права колонка: Інженерні картки -->
  <!-- Картка 1: Чому оновлення необхідне -->
  <rect x="578" y="66" width="358" height="114" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="578" y="66" width="358" height="24" rx="8" fill="#eaf0fd"/>
  <text x="590" y="82" font-size="12" font-weight="bold" fill="#2457d6">Динамічна пам'ять рідкого кристала:</text>
  <text x="590" y="104" font-size="12" fill="#1a1a1a">• Кожен субпіксель є конденсатором C_LC || C_st.</text>
  <text x="590" y="122" font-size="12" fill="#1a1a1a">• Навіть при статичній картинці ємність розряджається</text>
  <text x="590" y="140" font-size="12" fill="#1a1a1a">  через струм витоку закритого TFT (R_off ≈ 10¹² Ом).</text>
  <text x="590" y="160" font-size="12" font-weight="bold" fill="#27ae60">• ST7789 оновлює скло на 60 Гц автономно з GRAM!</text>

  <!-- Картка 2: Помпи VGH / VGL -->
  <rect x="578" y="192" width="358" height="116" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <rect x="578" y="192" width="358" height="24" rx="8" fill="#fdecea"/>
  <text x="590" y="208" font-size="12" font-weight="bold" fill="#c0392b">Навіщо напруги VGH (+13 В) та VGL (-10 В)?</text>
  <text x="590" y="230" font-size="12" fill="#1a1a1a">• VGH (+13 В): миттєвий заряд C_st за час рядка (~15 мкс)</text>
  <text x="590" y="248" font-size="12" fill="#1a1a1a">  через високий внутрішній опір каналу TFT.</text>
  <text x="590" y="266" font-size="12" fill="#1a1a1a">• VGL (-10 В): надійно замикає затвор під час фази Hold,</text>
  <text x="590" y="286" font-size="12" font-weight="bold" fill="#c0392b">  мінімізуючи витік та спад напруги пікселя.</text>

  <!-- Картка 3: Роль C_st та інверсії -->
  <rect x="578" y="320" width="358" height="120" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="590" y="340" font-size="12" font-weight="bold" fill="#27ae60">Захист від мерехтіння та деградації:</text>
  <text x="590" y="360" font-size="12" fill="#1a1a1a">1. Конденсатор C_st збільшує ємність у 4–5 разів,</text>
  <text x="590" y="378" font-size="12" fill="#1a1a1a">   без нього напруга спадала б миттєво (чорний екран).</text>
  <text x="590" y="398" font-size="12" fill="#1a1a1a">2. Інверсія полярності (AC Drive): постійний струм (DC)</text>
  <text x="590" y="416" font-size="12" font-weight="bold" fill="#27ae60">   руйнує кристали. Зміна знака щокадру рятує скло!</text>
</svg>
