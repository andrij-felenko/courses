<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <!-- Arrow markers -->
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Залежність частоти кадрів (FPS) від тактової частоти шини SPI (ST7789, 240×240)</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Теоретична швидкість DMA для 16-біт RGB565 (921 600 біт/кадр) та обмеження фізичного монтажу</text>

  <!-- ==================== LEFT: CHART AREA ==================== -->

  <!-- Zone Badges above Plot -->
  <rect x="90" y="74" width="102" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="141" y="91" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">≤ 12 МГц: Макетка</text>

  <rect x="204" y="74" width="86" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="247" y="91" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">12–20: Демпфер</text>

  <rect x="302" y="74" width="238" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="421" y="91" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">20–60 МГц: Тільки PCB (GND-полігон)</text>

  <!-- Plot Background Tinted Zones -->
  <!-- Zone 1: Breadboard Safe (0..12 MHz) -->
  <rect x="90" y="114" width="90" height="266" fill="#e9f7ef"/>
  <!-- Zone 2: Transitional / Ringing (12..20 MHz) -->
  <rect x="180" y="114" width="60" height="266" fill="#fdecea"/>
  <!-- Zone 3: High-speed PCB (20..60 MHz) -->
  <rect x="240" y="114" width="300" height="266" fill="#eaf0fd"/>

  <!-- Plot Outer Border -->
  <rect x="90" y="114" width="450" height="266" fill="none" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Zone Divider Vertical Dashed Lines -->
  <line x1="180" y1="114" x2="180" y2="380" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="240" y1="114" x2="240" y2="380" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Target 60 FPS Horizontal Reference Line -->
  <line x1="90" y1="164" x2="505" y2="164" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3,3"/>

  <!-- Theoretical Linear FPS Curve (0 to 60 MHz) -->
  <line x1="90" y1="380" x2="540" y2="146" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Calculation Points on the Curve -->
  <!-- Point 1: 8 MHz (~8.7 FPS) -->
  <circle cx="150" cy="349" r="4.5" fill="#27ae60" stroke="white" stroke-width="1.5"/>
  <text x="135" y="328" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">8 МГц</text>
  <text x="135" y="342" font-size="12" fill="#27ae60" text-anchor="middle">8.7 FPS</text>

  <!-- Point 2: 16 MHz (~17.4 FPS) -->
  <circle cx="210" cy="318" r="4.5" fill="#c0392b" stroke="white" stroke-width="1.5"/>
  <text x="210" y="292" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">16 МГц</text>
  <text x="210" y="306" font-size="12" fill="#c0392b" text-anchor="middle">17.4 FPS</text>

  <!-- Point 3: 24 MHz (~26.0 FPS) -->
  <circle cx="270" cy="286" r="4" fill="#2457d6" stroke="white" stroke-width="1.5"/>
  <text x="270" y="260" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">24 МГц</text>
  <text x="270" y="274" font-size="12" fill="#2457d6" text-anchor="middle">26 FPS</text>

  <!-- Point 4: 32 MHz (~34.7 FPS) -->
  <circle cx="330" cy="255" r="4" fill="#2457d6" stroke="white" stroke-width="1.5"/>
  <text x="330" y="228" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">32 МГц</text>
  <text x="330" y="242" font-size="12" fill="#2457d6" text-anchor="middle">34.7 FPS</text>

  <!-- Point 5: 40 MHz (~43.4 FPS) -->
  <circle cx="390" cy="224" r="4" fill="#2457d6" stroke="white" stroke-width="1.5"/>
  <text x="390" y="198" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">40 МГц</text>
  <text x="390" y="212" font-size="12" fill="#2457d6" text-anchor="middle">43.4 FPS</text>

  <!-- Point 6: 55.3 MHz (60.0 FPS Target) -->
  <circle cx="505" cy="164" r="5" fill="#27ae60" stroke="white" stroke-width="1.5"/>
  <text x="480" y="142" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">55.3 МГц</text>
  <text x="480" y="156" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">60 FPS (Ціль)</text>

  <!-- Zone 3 PCB High-Speed Callout Box -->
  <rect x="310" y="300" width="220" height="64" rx="5" fill="#f4f6f8" stroke="#2457d6" stroke-width="1"/>
  <text x="320" y="318" font-size="12" font-weight="bold" fill="#2457d6">Високошвидкісний режим PCB:</text>
  <text x="320" y="336" font-size="12" fill="#1a1a1a">• Суцільний GND, траси &lt; 5 см</text>
  <text x="320" y="354" font-size="12" fill="#27ae60">• Стабільні 60 FPS без артефактів</text>

  <!-- Y-Axis (FPS) Labels and Ticks -->
  <text x="82" y="168" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">60 FPS</text>
  <text x="82" y="204" font-size="12" fill="#6b7280" text-anchor="end">50</text>
  <text x="82" y="240" font-size="12" fill="#6b7280" text-anchor="end">40</text>
  <text x="82" y="276" font-size="12" fill="#6b7280" text-anchor="end">30</text>
  <text x="82" y="312" font-size="12" fill="#6b7280" text-anchor="end">20</text>
  <text x="82" y="348" font-size="12" fill="#6b7280" text-anchor="end">10</text>
  <text x="82" y="384" font-size="12" fill="#6b7280" text-anchor="end">0</text>
  <text x="84" y="118" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">FPS</text>

  <!-- X-Axis (Frequency) Labels and Ticks -->
  <line x1="90" y1="380" x2="90" y2="384" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="165" y1="380" x2="165" y2="384" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="240" y1="380" x2="240" y2="384" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="315" y1="380" x2="315" y2="384" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="390" y1="380" x2="390" y2="384" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="465" y1="380" x2="465" y2="384" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="540" y1="380" x2="540" y2="384" stroke="#1a1a1a" stroke-width="1.2"/>

  <text x="90" y="398" font-size="12" fill="#6b7280" text-anchor="middle">0</text>
  <text x="165" y="398" font-size="12" fill="#6b7280" text-anchor="middle">10</text>
  <text x="240" y="398" font-size="12" fill="#6b7280" text-anchor="middle">20</text>
  <text x="315" y="398" font-size="12" fill="#6b7280" text-anchor="middle">30</text>
  <text x="390" y="398" font-size="12" fill="#6b7280" text-anchor="middle">40</text>
  <text x="465" y="398" font-size="12" fill="#6b7280" text-anchor="middle">50</text>
  <text x="540" y="398" font-size="12" fill="#6b7280" text-anchor="middle">60</text>

  <!-- X-Axis Title -->
  <text x="315" y="416" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Тактова частота шини SPI, f_SPI (МГц)</text>

  <!-- ==================== RIGHT: ENGINEERING CARDS ==================== -->

  <!-- Card 1: Safe Breadboard Zone -->
  <rect x="570" y="80" width="360" height="112" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.2"/>
  <rect x="570" y="80" width="360" height="26" rx="6" fill="#e9f7ef"/>
  <text x="582" y="98" font-size="13" font-weight="bold" fill="#27ae60">1. Безпечна зона: f_SPI ≤ 12 МГц (макетка)</text>

  <text x="582" y="122" font-size="12" font-weight="bold" fill="#1a1a1a">Робота на безпайкових макетних платах</text>
  <text x="582" y="140" font-size="12" fill="#6b7280">Допустима довжина з'єднувальних дротів 10–20 см.</text>
  <text x="582" y="158" font-size="12" fill="#6b7280">Паразитна ємність контактів (2–5 пФ) не руйнує</text>
  <text x="582" y="176" font-size="12" font-weight="bold" fill="#27ae60">фронти сигналу SCK. Швидкість: до 13 FPS.</text>

  <!-- Card 2: Transitional Zone -->
  <rect x="570" y="204" width="360" height="112" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.2"/>
  <rect x="570" y="204" width="360" height="26" rx="6" fill="#fdecea"/>
  <text x="582" y="222" font-size="13" font-weight="bold" fill="#c0392b">2. Перехідна зона: 12–20 МГц (дзвін SCK)</text>

  <text x="582" y="246" font-size="12" font-weight="bold" fill="#1a1a1a">Небезпека помилкового тактування</text>
  <text x="582" y="264" font-size="12" fill="#6b7280">Індуктивність дротів спричиняє викиди напруги.</text>
  <text x="582" y="282" font-size="12" fill="#6b7280">Обов'язкові демпферні резистори 22–47 Ом на SCK/MOSI</text>
  <text x="582" y="300" font-size="12" font-weight="bold" fill="#c0392b">та вкорочення дротів до &lt; 10 см. Швидкість: 13–21 FPS.</text>

  <!-- Card 3: High-Speed PCB Zone -->
  <rect x="570" y="328" width="360" height="112" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.2"/>
  <rect x="570" y="328" width="360" height="26" rx="6" fill="#eaf0fd"/>
  <text x="582" y="346" font-size="13" font-weight="bold" fill="#2457d6">3. Зона PCB: 20–60 МГц (суцільний GND)</text>

  <text x="582" y="370" font-size="12" font-weight="bold" fill="#1a1a1a">Робота на друкованій платі (PCB)</text>
  <text x="582" y="388" font-size="12" fill="#6b7280">Контрольований хвильовий опір трас (50 Ом) та GND.</text>
  <text x="582" y="406" font-size="12" fill="#6b7280">На макетці: гарантований зрив фази SPI та сміття.</text>
  <text x="582" y="424" font-size="12" font-weight="bold" fill="#2457d6">При f_SPI = 55.3 МГц досягається повноцінний 60 FPS.</text>
</svg>
