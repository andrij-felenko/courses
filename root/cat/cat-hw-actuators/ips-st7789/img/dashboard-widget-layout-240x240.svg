<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біле полотно -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Структурно-геометричне макетування екрана 240×240 (LVGL)</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Компонування віджетів, координатна сітка та мінімізація зони оновлення Dirty Area</text>

  <!-- ЛІВА ПАНЕЛЬ: Геометричний макет матриці -->
  <rect x="24" y="75" width="420" height="385" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="44" y="100" font-size="14" font-weight="bold" fill="#1a1a1a">Геометричний макет матриці ST7789 (240×240)</text>

  <!-- Виносна лінія загальної висоти зліва -->
  <line x1="85" y1="230" x2="85" y2="136" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="85" y1="270" x2="85" y2="364" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="70" y="246" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">240 px</text>
  <text x="70" y="262" text-anchor="end" font-size="12" fill="#6b7280">висота</text>

  <!-- Екран дисплея 240×240 -->
  <rect x="100" y="130" width="240" height="240" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>

  <!-- 1. Верхній рядок стану (Status Bar, h = 24) -->
  <rect x="100" y="130" width="240" height="24" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="110" y="146" font-size="12" font-weight="bold" fill="#1a1a1a">12:45</text>
  <text x="220" y="146" text-anchor="middle" font-size="12" fill="#2457d6">BLE ON</text>
  <text x="328" y="146" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">[85%]</text>

  <!-- 2. Середня секція приладів (h = 126) -->
  <text x="220" y="168" text-anchor="middle" font-size="12" fill="#6b7280">Секція приладів (126 px)</text>

  <!-- Лівий прилад: lv_arc (температура) -->
  <path d="M 130 225 A 28 28 0 1 1 170 225" fill="none" stroke="#eaf0fd" stroke-width="6" stroke-linecap="round"/>
  <path d="M 130 225 A 28 28 0 0 1 158 178" fill="none" stroke="#2457d6" stroke-width="6" stroke-linecap="round"/>
  <circle cx="158" cy="178" r="4.5" fill="#2457d6"/>
  <circle cx="150" cy="205" r="14" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <line x1="150" y1="198" x2="150" y2="207" stroke="#2457d6" stroke-width="2" stroke-linecap="round"/>
  <circle cx="150" cy="208" r="3" fill="#2457d6"/>
  <text x="150" y="244" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">lv_arc (T)</text>
  <text x="150" y="258" text-anchor="middle" font-size="12" fill="#6b7280">-10..+50°C</text>

  <!-- Центральний цифровий бейдж: lv_label -->
  <rect x="188" y="178" width="64" height="48" rx="4" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <text x="220" y="196" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">23.5 °C</text>
  <text x="220" y="214" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">58 % RH</text>
  <text x="220" y="244" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">lv_label</text>

  <!-- Правий прилад: lv_arc (вологість) -->
  <path d="M 270 225 A 28 28 0 1 1 310 225" fill="none" stroke="#e9f7ef" stroke-width="6" stroke-linecap="round"/>
  <path d="M 270 225 A 28 28 0 0 1 300 179" fill="none" stroke="#27ae60" stroke-width="6" stroke-linecap="round"/>
  <circle cx="300" cy="179" r="4.5" fill="#27ae60"/>
  <circle cx="290" cy="205" r="14" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <circle cx="290" cy="206" r="4" fill="#27ae60"/>
  <text x="290" y="244" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">lv_arc (H)</text>
  <text x="290" y="258" text-anchor="middle" font-size="12" fill="#6b7280">0..100%</text>

  <!-- 3. Нижня секція графіка (h = 80) -->
  <line x1="100" y1="280" x2="340" y2="280" stroke="#d0d7de" stroke-width="1"/>
  <rect x="110" y="286" width="220" height="66" rx="3" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <line x1="110" y1="308" x2="330" y2="308" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="110" y1="330" x2="330" y2="330" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3,3"/>
  <path d="M 116 338 Q 145 342 170 326 T 225 316 T 280 324 T 324 300" fill="none" stroke="#2457d6" stroke-width="2"/>
  <circle cx="170" cy="326" r="2.5" fill="#2457d6"/>
  <circle cx="225" cy="316" r="2.5" fill="#2457d6"/>
  <circle cx="280" cy="324" r="2.5" fill="#2457d6"/>
  <circle cx="324" cy="300" r="2.5" fill="#2457d6"/>
  <text x="118" y="300" font-size="12" font-weight="bold" fill="#1a1a1a">lv_chart (H = 80)</text>
  <text x="322" y="346" text-anchor="end" font-size="12" fill="#6b7280">24h тренд</text>

  <!-- Розмірні лінії висот секцій праворуч -->
  <line x1="358" y1="142" x2="358" y2="134" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="358" y1="142" x2="358" y2="150" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="372" y="146" font-size="12" fill="#1a1a1a">24 px</text>

  <line x1="358" y1="217" x2="358" y2="158" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="358" y1="217" x2="358" y2="276" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="372" y="221" font-size="12" fill="#1a1a1a">126 px</text>

  <line x1="358" y1="320" x2="358" y2="284" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="358" y1="320" x2="358" y2="356" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="372" y="324" font-size="12" fill="#1a1a1a">80 px</text>

  <!-- Розмірна лінія ширини знизу -->
  <line x1="220" y1="377" x2="106" y2="377" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <line x1="220" y1="377" x2="334" y2="377" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="220" y="399" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Ширина матриці: 240 px</text>

  <!-- Інженерна примітка внизу лівої панелі -->
  <rect x="36" y="413" width="396" height="35" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="46" y="427" font-size="12" fill="#1a1a1a">Формат пікселів: RGB565 (16 біт / 2 байти на піксель)</text>
  <text x="46" y="441" font-size="12" fill="#6b7280">Повний кадр: 240×240×2 = 115 200 байт (112.5 КБ)</text>

  <!-- ПРАВА ПАНЕЛЬ: Ієрархія LVGL та Dirty Area -->
  <rect x="464" y="75" width="472" height="385" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="484" y="100" font-size="14" font-weight="bold" fill="#1a1a1a">Компонувальна ієрархія LVGL та Dirty Area</text>

  <!-- Верхній блок: Дерево віджетів -->
  <rect x="480" y="115" width="440" height="150" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="496" y="135" font-size="12" font-weight="bold" fill="#2457d6">ДЕРЕВО ОБ'ЄКТІВ (lv_obj_t hierarchy)</text>

  <!-- Корінь дерева -->
  <rect x="496" y="145" width="180" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="586" y="161" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">lv_scr_act() [240×240]</text>
  <text x="696" y="161" font-size="12" fill="#6b7280">Базовий екран дашборду</text>

  <!-- Лінії зв'язку від кореня -->
  <line x1="586" y1="169" x2="586" y2="176" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="586" y1="176" x2="812" y2="176" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="586" y1="176" x2="586" y2="181" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="812" y1="176" x2="812" y2="181" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Картки віджетів -->
  <rect x="496" y="182" width="200" height="32" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="504" y="196" font-size="12" font-weight="bold" fill="#1a1a1a">status_bar (lv_obj)</text>
  <text x="504" y="208" font-size="12" fill="#6b7280">W: 240, H: 24 | рядок стану</text>

  <rect x="496" y="226" width="200" height="32" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="504" y="240" font-size="12" font-weight="bold" fill="#1a1a1a">chart_trend (lv_chart)</text>
  <text x="504" y="252" font-size="12" fill="#6b7280">W: 220, H: 80 | графік тренду</text>

  <rect x="712" y="182" width="200" height="32" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="720" y="196" font-size="12" font-weight="bold" fill="#1a1a1a">arc_temp, arc_hum (lv_arc)</text>
  <text x="720" y="208" font-size="12" fill="#6b7280">W: 100, H: 100 | дуги шкал</text>

  <rect x="712" y="226" width="200" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="720" y="240" font-size="12" font-weight="bold" fill="#2457d6">label_temp_val (lv_label)</text>
  <text x="720" y="252" font-size="12" fill="#2457d6">LV_ALIGN_CENTER | значення</text>

  <!-- Нижній блок: Dirty Area -->
  <rect x="480" y="280" width="440" height="165" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="496" y="300" font-size="12" font-weight="bold" fill="#1a1a1a">ОПТИМІЗАЦІЯ РЕНДЕРИНГУ: МЕХАНІЗМ DIRTY AREA</text>

  <!-- Проблема: повне перемальовування -->
  <rect x="496" y="308" width="200" height="124" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="506" y="326" font-size="12" font-weight="bold" fill="#c0392b">Повний рендер (наївно)</text>
  <text x="506" y="344" font-size="12" fill="#1a1a1a">Зона: весь екран 240×240</text>
  <text x="506" y="362" font-size="12" fill="#1a1a1a">Обсяг: 57 600 пікс (115 КБ)</text>
  <text x="506" y="380" font-size="12" fill="#1a1a1a">SPI 40 МГц: ~23 мс на кадр</text>
  <text x="506" y="398" font-size="12" fill="#c0392b">Перевантажує шину SPI</text>
  <text x="506" y="416" font-size="12" fill="#c0392b">Спричиняє помітні фризи</text>

  <!-- Розв'язок: LVGL Dirty Area -->
  <rect x="712" y="308" width="200" height="124" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="722" y="326" font-size="12" font-weight="bold" fill="#27ae60">LVGL Dirty Area (норма)</text>
  <text x="722" y="344" font-size="12" fill="#1a1a1a">Зона: лише label (60×24)</text>
  <text x="722" y="362" font-size="12" fill="#1a1a1a">Обсяг: 1 440 пікс (2.9 КБ)</text>
  <text x="722" y="380" font-size="12" fill="#1a1a1a">SPI 40 МГц: ~0.6 мс на кадр</text>
  <text x="722" y="398" font-size="12" fill="#27ae60">Економія трафіку в 40 разів</text>
  <text x="722" y="416" font-size="12" fill="#27ae60">disp_flush(): лише 1 зріз</text>
</svg>
