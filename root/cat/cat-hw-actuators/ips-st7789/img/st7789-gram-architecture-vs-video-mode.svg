<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Внутрішній GRAM контролера проти прямого безбуферного відеопотоку</text>
  <text x="480" y="62" text-anchor="middle" font-size="13" fill="#6b7280">Автономна регенерація растру звільняє шину й оперативну пам'ять мікроконтролера</text>

  <!-- ЛІВА ПАНЕЛЬ: Прямий відеопотік без буфера -->
  <rect x="24" y="80" width="444" height="328" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Заголовок лівої панелі -->
  <rect x="36" y="92" width="420" height="30" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="246" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Прямий відеопотік без буфера (DPI / RGB)</text>

  <!-- Блок MCU (Ліва панель) -->
  <rect x="36" y="134" width="420" height="60" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="50" y="152" font-size="13" font-weight="bold" fill="#1a1a1a">Мікроконтролер (MCU)</text>
  <text x="50" y="170" font-size="12" fill="#c0392b">• Повний фреймбуфер у RAM: 115.2 КБ (240×240 RGB565)</text>
  <text x="50" y="186" font-size="12" fill="#6b7280">• Безперервна генерація растру через DMA / CPU без зупинки</text>

  <!-- Канал передачі відеопотоку -->
  <rect x="36" y="206" width="420" height="42" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="56" y1="211" x2="56" y2="243" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <line x1="436" y1="211" x2="436" y2="243" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="246" y="223" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Безперервний потік 60 Гц (~7 МБ/с)</text>
  <text x="246" y="239" text-anchor="middle" font-size="12" fill="#6b7280">16-біт шина RGB + VSYNC, HSYNC, DOTCLK</text>

  <!-- Дисплей без пам'яті -->
  <rect x="36" y="260" width="420" height="80" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="50" y="280" font-size="13" font-weight="bold" fill="#1a1a1a">Дисплейний модуль без GRAM (DPI / RGB)</text>
  <text x="50" y="301" font-size="12" fill="#c0392b">• Відсутня власна пам'ять: кожен піксель мусить іти на льоту</text>
  <text x="50" y="321" font-size="12" fill="#6b7280">• Екран миттєво гасне, якщо потік від МК переривається</text>

  <!-- Наслідок (Ліва панель) -->
  <rect x="36" y="352" width="420" height="46" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="50" y="370" font-size="12" font-weight="bold" fill="#c0392b">Наслідок: критичне навантаження на систему</text>
  <text x="50" y="387" font-size="12" fill="#1a1a1a">Шина й CPU зайняті на 100%; непридатний для МК із малою RAM</text>

  <!-- ПРАВА ПАНЕЛЬ: Автономна регенерація з GRAM -->
  <rect x="492" y="80" width="444" height="328" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Заголовок правої панелі -->
  <rect x="504" y="92" width="420" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="714" y="112" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Автономна регенерація з GRAM (ST7789)</text>

  <!-- Блок MCU (Права панель) -->
  <rect x="504" y="134" width="420" height="60" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="518" y="152" font-size="13" font-weight="bold" fill="#1a1a1a">Мікроконтролер (MCU)</text>
  <text x="518" y="170" font-size="12" fill="#27ae60">• Не потребує повного буфера в RAM (достатньо 0–480 байтів)</text>
  <text x="518" y="186" font-size="12" fill="#6b7280">• Передає по SPI лише окремі зміни («Запис за подією»)</text>

  <!-- Канал SPI -->
  <rect x="504" y="206" width="420" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="524" y1="211" x2="524" y2="243" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="540" y="223" font-size="12" font-weight="bold" fill="#2457d6">Шина SPI: передача лише за подією (команди / нові пікселі)</text>
  <text x="540" y="239" font-size="12" fill="#6b7280">У стані спокою: 0 МБ/с, шина вільна для інших датчиків</text>

  <!-- Модуль ST7789 з інтегрованою пам'яттю -->
  <rect x="504" y="260" width="420" height="80" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="714" y="276" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Контролер ST7789 з інтегрованою пам'яттю</text>

  <!-- Підблок GRAM -->
  <rect x="514" y="282" width="136" height="50" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="582" y="301" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Внутрішня GRAM</text>
  <text x="582" y="319" text-anchor="middle" font-size="12" fill="#1a1a1a">240×320×18 біт</text>

  <!-- Підблок IPS-матриця -->
  <rect x="778" y="282" width="136" height="50" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="846" y="301" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">IPS-матриця</text>
  <text x="846" y="319" text-anchor="middle" font-size="12" fill="#27ae60">240×240 растр</text>

  <!-- Автономний растр між GRAM та IPS -->
  <line x1="656" y1="292" x2="770" y2="292" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="714" y="310" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Апаратний растр</text>
  <text x="714" y="326" text-anchor="middle" font-size="12" fill="#27ae60">60 Гц без МК</text>

  <!-- Перевага (Права панель) -->
  <rect x="504" y="352" width="420" height="46" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="518" y="370" font-size="12" font-weight="bold" fill="#27ae60">Перевага: 0% навантаження шини МК у стані спокою</text>
  <text x="518" y="387" font-size="12" fill="#1a1a1a">Повна сумісність із дешевими МК, що мають лише 2–4 КБ RAM</text>

  <!-- ПІДСУМКОВА СМУГА ВНИЗУ -->
  <rect x="24" y="422" width="912" height="36" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="445" text-anchor="middle" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#2457d6">Висновок:</tspan> наявність GRAM перетворює ST7789 на автономний графічний пристрій і розвантажує обчислювальне ядро</text>
</svg>
