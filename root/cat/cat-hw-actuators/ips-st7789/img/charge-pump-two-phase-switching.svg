<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Двофазна комутація ключів ємнісної помпи заряду</text>
  <text x="480" y="60" font-size="13" text-anchor="middle" fill="#6b7280">Перемикання C_fly між паралельним зарядом від VDD та послідовним додаванням формує 2×VDD</text>

  <!-- ==================== ЛІВА ПАНЕЛЬ: ФАЗА 1 ==================== -->
  <rect x="30" y="78" width="435" height="322" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Шапка фази 1 -->
  <rect x="45" y="92" width="200" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="145" y="108" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ФАЗА 1: ЗАРЯДЖАННЯ C_fly</text>
  <text x="260" y="108" font-size="12" fill="#1a1a1a">Такти: <tspan font-weight="bold" fill="#27ae60">Φ1 = 1</tspan>, <tspan fill="#6b7280">Φ2 = 0</tspan></text>

  <!-- Шина VDD -->
  <line x1="75" y1="160" x2="75" y2="295" stroke="#2457d6" stroke-width="2.5"/>
  <text x="75" y="140" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">VDD</text>
  <text x="75" y="154" font-size="12" fill="#6b7280" text-anchor="middle">+3.3 В</text>

  <!-- Струм заряду I_chg позначка -->
  <text x="152" y="132" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Струм заряду I_chg →</text>

  <!-- Верхній дріт: від VDD до S1 -->
  <line x1="75" y1="180" x2="115" y2="180" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="75" y1="180" x2="105" y2="180" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- Ключ S1 (ЗАМКНЕНО) -->
  <circle cx="115" cy="180" r="3" fill="#27ae60"/>
  <circle cx="160" cy="180" r="3" fill="#27ae60"/>
  <line x1="115" y1="180" x2="160" y2="180" stroke="#27ae60" stroke-width="3"/>
  <text x="137" y="168" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">S1: замкн.</text>

  <!-- Від S1 до вузла A -->
  <line x1="160" y1="180" x2="220" y2="180" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="160" y1="180" x2="195" y2="180" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- Вузол A -->
  <circle cx="220" cy="180" r="3.5" fill="#1a1a1a"/>
  <text x="220" y="168" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">A: +3.3 В</text>

  <!-- Конденсатор C_fly -->
  <line x1="220" y1="180" x2="220" y2="212" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="220" y1="180" x2="220" y2="202" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <!-- Обкладка 1 -->
  <line x1="202" y1="212" x2="238" y2="212" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Обкладка 2 -->
  <line x1="202" y1="224" x2="238" y2="224" stroke="#1a1a1a" stroke-width="3"/>
  <text x="194" y="215" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="end">+</text>
  <text x="194" y="227" font-size="13" font-weight="bold" fill="#6b7280" text-anchor="end">−</text>
  <text x="246" y="215" font-size="13" font-weight="bold" fill="#1a1a1a">C_fly</text>
  <text x="246" y="229" font-size="12" fill="#2457d6">VC = 3.3 В</text>

  <!-- Від C_fly до вузла B -->
  <line x1="220" y1="224" x2="220" y2="265" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Вузол B -->
  <circle cx="220" cy="265" r="3.5" fill="#1a1a1a"/>
  <text x="232" y="269" font-size="12" fill="#6b7280">B: 0 В (GND)</text>

  <!-- Ключ S3 (РОЗІМКНЕНО) від VDD до B -->
  <line x1="75" y1="265" x2="115" y2="265" stroke="#d0d7de" stroke-width="2"/>
  <circle cx="115" cy="265" r="3" fill="#6b7280"/>
  <circle cx="160" cy="265" r="3" fill="#6b7280"/>
  <!-- Розімкнений контакт під кутом вгору -->
  <line x1="115" y1="265" x2="152" y2="246" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="160" y1="265" x2="220" y2="265" stroke="#d0d7de" stroke-width="2"/>
  <text x="137" y="286" font-size="12" fill="#c0392b" text-anchor="middle">S3: розімкн.</text>

  <!-- Від вузла B через S2 до GND -->
  <line x1="220" y1="265" x2="220" y2="285" stroke="#2457d6" stroke-width="2.5"/>
  <!-- Ключ S2 (ЗАМКНЕНО) -->
  <circle cx="220" cy="285" r="3" fill="#27ae60"/>
  <circle cx="220" cy="325" r="3" fill="#27ae60"/>
  <line x1="220" y1="285" x2="220" y2="325" stroke="#27ae60" stroke-width="3"/>
  <text x="208" y="308" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">S2: замкн.</text>

  <!-- Від S2 до шини GND -->
  <line x1="220" y1="325" x2="220" y2="350" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="220" y1="325" x2="220" y2="345" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- Ключ S4 (РОЗІМКНЕНО) від A до V_OUT -->
  <line x1="220" y1="180" x2="270" y2="180" stroke="#d0d7de" stroke-width="2"/>
  <circle cx="270" cy="180" r="3" fill="#6b7280"/>
  <circle cx="315" cy="180" r="3" fill="#6b7280"/>
  <line x1="270" y1="180" x2="307" y2="161" stroke="#c0392b" stroke-width="2.5"/>
  <text x="292" y="202" font-size="12" fill="#c0392b" text-anchor="middle">S4: розімкн.</text>
  <line x1="315" y1="180" x2="360" y2="180" stroke="#d0d7de" stroke-width="2"/>

  <!-- Вихідний вузол і C_out -->
  <circle cx="360" cy="180" r="3.5" fill="#1a1a1a"/>
  <line x1="360" y1="180" x2="360" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Обкладки C_out -->
  <line x1="345" y1="230" x2="375" y2="230" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="345" y1="242" x2="375" y2="242" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="360" y1="242" x2="360" y2="350" stroke="#1a1a1a" stroke-width="2"/>
  <text x="384" y="233" font-size="12" font-weight="bold" fill="#1a1a1a">C_out</text>
  <text x="384" y="247" font-size="12" fill="#6b7280">фільтр</text>
  <text x="384" y="263" font-size="12" fill="#6b7280">живить вихід</text>

  <!-- Вихідна клема V_OUT -->
  <line x1="360" y1="180" x2="420" y2="180" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="420" cy="180" r="4" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="420" y="156" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">V_OUT</text>
  <text x="420" y="170" font-size="12" fill="#6b7280" text-anchor="middle">~2×VDD</text>

  <!-- Шина GND -->
  <line x1="160" y1="350" x2="400" y2="350" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Символ заземлення -->
  <line x1="210" y1="355" x2="230" y2="355" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="214" y1="360" x2="226" y2="360" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="217" y1="365" x2="223" y2="365" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="175" y="366" font-size="12" fill="#6b7280" text-anchor="middle">GND (0 В)</text>

  <!-- Статусна плашка фази 1 -->
  <rect x="45" y="368" width="405" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="247" y="384" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Результат: C_fly заряджено до напруги VDD (3.3 В)</text>


  <!-- ==================== ПРАВА ПАНЕЛЬ: ФАЗА 2 ==================== -->
  <rect x="495" y="78" width="435" height="322" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Шапка фази 2 -->
  <rect x="510" y="92" width="225" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="622" y="108" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ФАЗА 2: ПІДСУМОВУВАННЯ (2×VDD)</text>
  <text x="748" y="108" font-size="12" fill="#1a1a1a">Такти: <tspan fill="#6b7280">Φ1 = 0</tspan>, <tspan font-weight="bold" fill="#27ae60">Φ2 = 1</tspan></text>

  <!-- Шина VDD -->
  <line x1="540" y1="160" x2="540" y2="295" stroke="#2457d6" stroke-width="2.5"/>
  <text x="540" y="140" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">VDD</text>
  <text x="540" y="154" font-size="12" fill="#6b7280" text-anchor="middle">+3.3 В</text>

  <!-- Позначка струму перенесення -->
  <text x="760" y="132" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Перенесення заряду I_pump →</text>

  <!-- Верхній дріт: від VDD до S1 (РОЗІМКНЕНО) -->
  <line x1="540" y1="180" x2="580" y2="180" stroke="#d0d7de" stroke-width="2"/>
  <circle cx="580" cy="180" r="3" fill="#6b7280"/>
  <circle cx="625" cy="180" r="3" fill="#6b7280"/>
  <line x1="580" y1="180" x2="617" y2="161" stroke="#c0392b" stroke-width="2.5"/>
  <text x="602" y="202" font-size="12" fill="#c0392b" text-anchor="middle">S1: розімкн.</text>
  <line x1="625" y1="180" x2="685" y2="180" stroke="#d0d7de" stroke-width="2"/>

  <!-- Вузол A -->
  <circle cx="685" cy="180" r="3.5" fill="#1a1a1a"/>
  <text x="685" y="168" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">A: +6.6 В (2×VDD)</text>

  <!-- Конденсатор C_fly -->
  <line x1="685" y1="180" x2="685" y2="212" stroke="#2457d6" stroke-width="2.5"/>
  <!-- Обкладка 1 -->
  <line x1="667" y1="212" x2="703" y2="212" stroke="#1a1a1a" stroke-width="3"/>
  <!-- Обкладка 2 -->
  <line x1="667" y1="224" x2="703" y2="224" stroke="#1a1a1a" stroke-width="3"/>
  <text x="659" y="215" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="end">+</text>
  <text x="659" y="227" font-size="13" font-weight="bold" fill="#6b7280" text-anchor="end">−</text>
  <text x="711" y="215" font-size="13" font-weight="bold" fill="#1a1a1a">C_fly</text>
  <text x="711" y="229" font-size="12" fill="#27ae60">VC = 3.3 В</text>

  <!-- Струм вгору через C_fly (підсумовування напруг) -->
  <line x1="685" y1="265" x2="685" y2="224" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="685" y1="260" x2="685" y2="238" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- Вузол B -->
  <circle cx="685" cy="265" r="3.5" fill="#1a1a1a"/>
  <text x="697" y="269" font-size="12" font-weight="bold" fill="#2457d6">B: +3.3 В (VDD)</text>

  <!-- Ключ S3 (ЗАМКНЕНО) від VDD до B -->
  <line x1="540" y1="265" x2="580" y2="265" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="540" y1="265" x2="570" y2="265" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <circle cx="580" cy="265" r="3" fill="#27ae60"/>
  <circle cx="625" cy="265" r="3" fill="#27ae60"/>
  <line x1="580" y1="265" x2="625" y2="265" stroke="#27ae60" stroke-width="3"/>
  <text x="602" y="286" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">S3: замкн.</text>
  <line x1="625" y1="265" x2="685" y2="265" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="625" y1="265" x2="660" y2="265" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- Від вузла B через S2 до GND (РОЗІМКНЕНО) -->
  <line x1="685" y1="265" x2="685" y2="285" stroke="#d0d7de" stroke-width="2"/>
  <!-- Ключ S2 (РОЗІМКНЕНО) -->
  <circle cx="685" cy="285" r="3" fill="#6b7280"/>
  <circle cx="685" cy="325" r="3" fill="#6b7280"/>
  <line x1="685" y1="285" x2="666" y2="320" stroke="#c0392b" stroke-width="2.5"/>
  <text x="650" y="308" font-size="12" fill="#c0392b" text-anchor="end">S2: розімкн.</text>
  <line x1="685" y1="325" x2="685" y2="350" stroke="#d0d7de" stroke-width="2"/>

  <!-- Ключ S4 (ЗАМКНЕНО) від A до V_OUT -->
  <line x1="685" y1="180" x2="735" y2="180" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="685" y1="180" x2="715" y2="180" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <circle cx="735" cy="180" r="3" fill="#27ae60"/>
  <circle cx="780" cy="180" r="3" fill="#27ae60"/>
  <line x1="735" y1="180" x2="780" y2="180" stroke="#27ae60" stroke-width="3"/>
  <text x="757" y="202" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">S4: замкн.</text>
  <line x1="780" y1="180" x2="825" y2="180" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="780" y1="180" x2="810" y2="180" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- Вихідний вузол і C_out -->
  <circle cx="825" cy="180" r="3.5" fill="#1a1a1a"/>
  <line x1="825" y1="180" x2="825" y2="230" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="825" y1="180" x2="825" y2="210" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <!-- Обкладки C_out -->
  <line x1="810" y1="230" x2="840" y2="230" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="810" y1="242" x2="840" y2="242" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="825" y1="242" x2="825" y2="350" stroke="#1a1a1a" stroke-width="2"/>
  <text x="849" y="233" font-size="12" font-weight="bold" fill="#1a1a1a">C_out</text>
  <text x="849" y="247" font-size="12" fill="#6b7280">фільтр</text>
  <text x="849" y="263" font-size="12" fill="#27ae60">заряд до 2×VDD</text>

  <!-- Вихідна клема V_OUT -->
  <line x1="825" y1="180" x2="885" y2="180" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="825" y1="180" x2="865" y2="180" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <circle cx="885" cy="180" r="4" fill="white" stroke="#27ae60" stroke-width="2.5"/>
  <text x="885" y="156" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">V_OUT</text>
  <text x="885" y="170" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">+6.6 В</text>

  <!-- Шина GND -->
  <line x1="625" y1="350" x2="865" y2="350" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Символ заземлення -->
  <line x1="675" y1="355" x2="695" y2="355" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="679" y1="360" x2="691" y2="360" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="682" y1="365" x2="688" y2="365" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="640" y="366" font-size="12" fill="#6b7280" text-anchor="middle">GND (0 В)</text>

  <!-- Статусна плашка фази 2 -->
  <rect x="510" y="368" width="405" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712" y="384" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Результат: V_OUT = VB + VC = VDD + VDD = 2×VDD</text>


  <!-- ==================== НИЖНЯ ПАНЕЛЬ: ПОЯСНЕННЯ ==================== -->
  <rect x="30" y="415" width="900" height="65" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="480" y1="425" x2="480" y2="470" stroke="#d0d7de" stroke-width="1"/>

  <text x="50" y="435" font-size="12" font-weight="bold" fill="#1a1a1a">Неперекривні такти (Non-overlapping clock):</text>
  <text x="50" y="452" font-size="12" fill="#6b7280">Пауза (dead time) між Φ1 і Φ2 усуває наскрізні струми VDD → GND</text>
  <text x="50" y="468" font-size="12" fill="#6b7280">і захищає транзистори ключів від перевантаження та деградації.</text>

  <text x="500" y="435" font-size="12" font-weight="bold" fill="#1a1a1a">Формування напруг затворів TFT у контролері ST7789:</text>
  <text x="500" y="452" font-size="12" fill="#6b7280">Каскади ємнісних помп генерують VGH (+12...+15 В) і VGL (-10 В),</text>
  <text x="500" y="468" font-size="12" fill="#6b7280">необхідні для повного відмикання й замикання транзисторів пікселів.</text>
</svg>
