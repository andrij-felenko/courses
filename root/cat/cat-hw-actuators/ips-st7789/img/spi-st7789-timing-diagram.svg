<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-rev" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-blue-rev" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма шини SPI для контролера ST7789</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">Стробування бітів по висхідному фронту SCL, часові параметри та порогові напруги</text>

  <!-- Головна панель діаграми -->
  <rect x="30" y="76" width="900" height="272" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- ==================== СИГНАЛ DC ==================== -->
  <rect x="42" y="92" width="46" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="65" y="109" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">DC</text>
  <text x="98" y="108" font-size="12" fill="#6b7280">Команда / Дані</text>

  <!-- DC рівні та форма хвилі -->
  <text x="250" y="100" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">DATA</text>
  <text x="250" y="124" font-size="12" fill="#6b7280" text-anchor="end">CMD</text>
  <line x1="258" y1="96" x2="880" y2="96" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="258" y1="120" x2="300" y2="120" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  <polyline points="258,120 300,120 320,96 880,96" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- ==================== ВЕРТИКАЛЬНІ СТРОБИ SCL ==================== -->
  <!-- Строб 1 -->
  <line x1="440" y1="132" x2="440" y2="278" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="440,282 436,274 444,274" fill="#2457d6"/>
  <circle cx="440" cy="282" r="3.5" fill="#2457d6"/>
  <text x="440" y="128" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Строб 1</text>

  <!-- Строб 2 -->
  <line x1="690" y1="132" x2="690" y2="278" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
  <polygon points="690,282 686,274 694,274" fill="#6b7280"/>
  <circle cx="690" cy="282" r="3.5" fill="#6b7280"/>
  <text x="690" y="128" font-size="12" fill="#6b7280" text-anchor="middle">Строб 2</text>

  <!-- ==================== ВЕРХНІ ІНТЕРВАЛИ (t_ast, t_cycw, t_wrh) ==================== -->
  <!-- t_ast: x = 320 .. 440 -->
  <line x1="320" y1="96" x2="320" y2="150" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="320" y1="144" x2="440" y2="144" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue-rev)" marker-end="url(#arr-blue)"/>
  <text x="380" y="139" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">t_ast</text>

  <!-- t_cycw: x = 440 .. 690 -->
  <line x1="440" y1="144" x2="690" y2="144" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-rev)" marker-end="url(#arr)"/>
  <text x="565" y="139" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">t_cycw</text>

  <!-- t_wrh: x = 445 .. 555 -->
  <line x1="445" y1="164" x2="445" y2="186" stroke="#d0d7de" stroke-width="1"/>
  <line x1="555" y1="164" x2="555" y2="186" stroke="#d0d7de" stroke-width="1"/>
  <line x1="445" y1="168" x2="555" y2="168" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-rev)" marker-end="url(#arr)"/>
  <text x="500" y="163" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">t_wrh</text>

  <!-- ==================== СИГНАЛ SCL ==================== -->
  <rect x="42" y="186" width="46" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="65" y="203" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">SCL</text>
  <text x="98" y="203" font-size="12" fill="#6b7280">Тактовий сигнал</text>

  <!-- Порогові рівні SCL -->
  <text x="250" y="201" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="end">V_IH</text>
  <text x="250" y="215" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="end">V_IL</text>
  <line x1="258" y1="197" x2="880" y2="197" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="258" y1="211" x2="880" y2="211" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Форма SCL -->
  <polyline points="258,222 430,222 450,186 550,186 570,222 680,222 700,186 800,186 820,222 880,222" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- ==================== СЕРЕДНІ ІНТЕРВАЛИ (t_dst, t_dht, t_wrl) ==================== -->
  <!-- t_dst: x = 355 .. 440 -->
  <line x1="355" y1="248" x2="355" y2="282" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="355" y1="252" x2="440" y2="252" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue-rev)" marker-end="url(#arr-blue)"/>
  <text x="397" y="247" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">t_dst</text>

  <!-- t_dht: x = 440 .. 510 -->
  <line x1="510" y1="248" x2="510" y2="282" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="440" y1="252" x2="510" y2="252" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue-rev)" marker-end="url(#arr-blue)"/>
  <text x="475" y="247" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">t_dht</text>

  <!-- t_wrl: x = 570 .. 680 -->
  <line x1="570" y1="222" x2="570" y2="256" stroke="#d0d7de" stroke-width="1"/>
  <line x1="680" y1="222" x2="680" y2="256" stroke="#d0d7de" stroke-width="1"/>
  <line x1="570" y1="252" x2="680" y2="252" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-rev)" marker-end="url(#arr)"/>
  <text x="625" y="247" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">t_wrl</text>

  <!-- ==================== СИГНАЛ SDA ==================== -->
  <rect x="42" y="282" width="46" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="65" y="299" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">SDA</text>
  <text x="98" y="299" font-size="12" fill="#6b7280">Послідовні дані</text>

  <!-- Порогові рівні SDA -->
  <text x="250" y="297" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="end">V_IH</text>
  <text x="250" y="311" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="end">V_IL</text>
  <line x1="258" y1="293" x2="880" y2="293" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="258" y1="307" x2="880" y2="307" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Форма SDA (шина) -->
  <polyline points="258,282 330,282 355,318 510,318 535,282 760,282 785,318 880,318" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <polyline points="258,318 330,318 355,282 510,282 535,318 760,318 785,282 880,282" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Підписи бітів під SDA шиною -->
  <text x="432" y="336" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">D7 (MSB)</text>
  <text x="647" y="336" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">D6</text>
  <text x="832" y="336" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">D5</text>

  <!-- ==================== НИЖНЯ ПАНЕЛЬ ОПИСУ ПАРАМЕТРІВ ==================== -->
  <rect x="30" y="360" width="900" height="78" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Картка 1: Тактування -->
  <rect x="42" y="368" width="270" height="62" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="54" y="385" font-size="12" font-weight="bold" fill="#1a1a1a">Тактування SCL</text>
  <text x="54" y="403" font-size="12" fill="#1a1a1a">t_cycw : період циклу запису</text>
  <text x="54" y="421" font-size="12" fill="#6b7280">t_wrh / t_wrl : тривалість H / L</text>

  <!-- Картка 2: Встановлення та утримання -->
  <rect x="324" y="368" width="292" height="62" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="336" y="385" font-size="12" font-weight="bold" fill="#2457d6">Встановлення та утримання</text>
  <text x="336" y="403" font-size="12" fill="#1a1a1a">t_ast : випередження DC до SCL</text>
  <text x="336" y="421" font-size="12" fill="#6b7280">t_dst / t_dht : дані SDA до/після фронту</text>

  <!-- Картка 3: Порогові рівні -->
  <rect x="628" y="368" width="290" height="62" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="640" y="385" font-size="12" font-weight="bold" fill="#27ae60">Порогові рівні напруги</text>
  <text x="640" y="403" font-size="12" fill="#1a1a1a">V_IH ≥ 0,7 · VDD (поріг лог. 1)</text>
  <text x="640" y="421" font-size="12" fill="#6b7280">V_IL ≤ 0,3 · VDD (поріг лог. 0)</text>
</svg>
