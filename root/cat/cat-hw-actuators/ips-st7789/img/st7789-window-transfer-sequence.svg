<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Трансляція кадру ST7789 по SPI: налаштування вікна та піксельний потік</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">11 байтів налаштування вікна (0,01%) відкривають вікно для 115 200 байтів DMA-потоку (99,99%)</text>

  <!-- Головна панель: часова та протокольна діаграма -->
  <rect x="25" y="74" width="910" height="264" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Заголовки фаз передачі -->
  <!-- Фаза 1: CASET -->
  <rect x="135" y="86" width="188" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="229" y="102" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">CASET (0x2A) • 5 байтів</text>

  <!-- Фаза 2: RASET -->
  <rect x="335" y="86" width="188" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="429" y="102" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">RASET (0x2B) • 5 байтів</text>

  <!-- Фаза 3: RAMWR -->
  <rect x="535" y="86" width="46" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="558" y="102" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">0x2C</text>

  <!-- Розрив шкали -->
  <rect x="593" y="86" width="30" height="24" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="608" y="102" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">···</text>

  <!-- Фаза 4: Потік пікселів -->
  <rect x="635" y="86" width="280" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="775" y="102" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Потік RGB565: 115 200 байтів через DMA</text>

  <!-- Ліва колонка: позначення сигналів -->
  <text x="38" y="141" font-size="13" font-weight="bold" fill="#1a1a1a">CS#</text>
  <text x="38" y="154" font-size="12" fill="#6b7280">вибір чіпа</text>

  <text x="38" y="193" font-size="13" font-weight="bold" fill="#1a1a1a">D/C#</text>
  <text x="38" y="206" font-size="12" fill="#6b7280">0=CMD / 1=DAT</text>

  <text x="38" y="247" font-size="13" font-weight="bold" fill="#1a1a1a">MOSI</text>
  <text x="38" y="260" font-size="12" fill="#6b7280">шина SPI</text>

  <!-- Сигнал CS# (активний низький, утримується весь кадр) -->
  <path d="M 124,130 L 135,130 L 135,150 L 593,150 L 603,150 L 606,142 L 612,158 L 615,150 L 635,150 L 898,150 L 898,130 L 915,130" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Сигнал D/C# (Data / Command) -->
  <path d="M 124,182 L 135,182 L 135,204 L 175,204 L 175,182 L 335,182 L 335,204 L 375,204 L 375,182 L 535,182 L 535,204 L 581,204 L 581,182 L 593,182 L 603,182 L 606,174 L 612,190 L 615,182 L 635,182 L 915,182" fill="none" stroke="#1a1a1a" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Сигнал MOSI: байти даних -->
  <!-- CASET байти -->
  <rect x="135" y="236" width="40" height="28" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="155" y="254" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">0x2A</text>

  <rect x="177" y="236" width="35" height="28" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="194.5" y="254" font-size="12" fill="#2457d6" text-anchor="middle">0x00</text>

  <rect x="214" y="236" width="35" height="28" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="231.5" y="254" font-size="12" fill="#2457d6" text-anchor="middle">0x00</text>

  <rect x="251" y="236" width="35" height="28" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="268.5" y="254" font-size="12" fill="#2457d6" text-anchor="middle">0x00</text>

  <rect x="288" y="236" width="35" height="28" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="305.5" y="254" font-size="12" fill="#2457d6" text-anchor="middle">0xEF</text>

  <!-- RASET байти -->
  <rect x="335" y="236" width="40" height="28" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="355" y="254" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">0x2B</text>

  <rect x="377" y="236" width="35" height="28" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="394.5" y="254" font-size="12" fill="#2457d6" text-anchor="middle">0x00</text>

  <rect x="414" y="236" width="35" height="28" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="431.5" y="254" font-size="12" fill="#2457d6" text-anchor="middle">0x00</text>

  <rect x="451" y="236" width="35" height="28" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="468.5" y="254" font-size="12" fill="#2457d6" text-anchor="middle">0x00</text>

  <rect x="488" y="236" width="35" height="28" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="505.5" y="254" font-size="12" fill="#2457d6" text-anchor="middle">0xEF</text>

  <!-- RAMWR байт -->
  <rect x="535" y="236" width="46" height="28" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="558" y="254" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">0x2C</text>

  <!-- Розрив у MOSI -->
  <polyline points="593,250 603,250 606,238 612,262 615,250 635,250" fill="none" stroke="#6b7280" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Потік пікселів RGB565 -->
  <rect x="635" y="236" width="40" height="28" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="655" y="254" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">P0_H</text>

  <rect x="679" y="236" width="40" height="28" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="699" y="254" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">P0_L</text>

  <rect x="723" y="236" width="84" height="28" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="765" y="254" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">···</text>

  <rect x="811" y="236" width="40" height="28" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="831" y="254" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">PN_H</text>

  <rect x="855" y="236" width="40" height="28" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="875" y="254" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">PN_L</text>

  <!-- Рядок 1 під MOSI: назви параметрів та пікселів -->
  <text x="155" y="280" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">CMD</text>
  <text x="194.5" y="280" font-size="12" fill="#6b7280" text-anchor="middle">XS_H</text>
  <text x="231.5" y="280" font-size="12" fill="#6b7280" text-anchor="middle">XS_L</text>
  <text x="268.5" y="280" font-size="12" fill="#6b7280" text-anchor="middle">XE_H</text>
  <text x="305.5" y="280" font-size="12" fill="#6b7280" text-anchor="middle">XE_L</text>

  <text x="355" y="280" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">CMD</text>
  <text x="394.5" y="280" font-size="12" fill="#6b7280" text-anchor="middle">YS_H</text>
  <text x="431.5" y="280" font-size="12" fill="#6b7280" text-anchor="middle">YS_L</text>
  <text x="468.5" y="280" font-size="12" fill="#6b7280" text-anchor="middle">YE_H</text>
  <text x="505.5" y="280" font-size="12" fill="#6b7280" text-anchor="middle">YE_L</text>

  <text x="558" y="280" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">CMD</text>

  <text x="677" y="280" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Піксель 0</text>
  <text x="765" y="280" font-size="12" fill="#6b7280" text-anchor="middle">DMA потік</text>
  <text x="853" y="280" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Піксель 57 599</text>

  <!-- Рядок 2 під MOSI: логічний зміст та адреси -->
  <text x="229" y="298" font-size="12" fill="#1a1a1a" text-anchor="middle">Колонки X: 0..239 (5 B)</text>
  <text x="429" y="298" font-size="12" fill="#1a1a1a" text-anchor="middle">Рядки Y: 0..239 (5 B)</text>
  <text x="558" y="298" font-size="12" fill="#1a1a1a" text-anchor="middle">Старт (1 B)</text>
  <text x="765" y="298" font-size="12" fill="#1a1a1a" text-anchor="middle">240 × 240 × 2 = 115 200 байтів RGB565</text>

  <!-- Рядок 3: співвідношення обсягів -->
  <text x="358" y="322" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">◀ Протокольні накладні витрати: 11 байтів (~0,01%) ▶</text>
  <text x="765" y="322" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">◀ Тіло кадру: 115 200 байтів (~99,99%) ▶</text>

  <!-- Нижня секція: порівняльні картки підсумку -->
  <!-- Картка 1: Протокольне налаштування вікна -->
  <rect x="25" y="352" width="390" height="102" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="42" y="373" font-size="13" font-weight="bold" fill="#c0392b">Налаштування вікна (CASET + RASET + RAMWR)</text>
  <text x="42" y="394" font-size="12" fill="#1a1a1a">• Обсяг: <tspan font-weight="bold" fill="#c0392b">11 байтів</tspan> (~0,01% загального трафіку)</text>
  <text x="42" y="414" font-size="12" fill="#1a1a1a">• Керування: CPU тактує та перемикає D/C</text>
  <text x="42" y="434" font-size="12" fill="#6b7280">• Тривалість: &lt; 3 мкс (при 40 МГц) — непомітна частка</text>

  <!-- Картка 2: Корисне тіло кадру -->
  <rect x="431" y="352" width="504" height="102" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="448" y="373" font-size="13" font-weight="bold" fill="#27ae60">Тіло кадру: піксельний потік RGB565 (240 × 240)</text>
  <text x="448" y="394" font-size="12" fill="#1a1a1a">• Обсяг: <tspan font-weight="bold" fill="#27ae60">115 200 байтів</tspan> (99,99% трафіку кадру)</text>
  <text x="448" y="414" font-size="12" fill="#1a1a1a">• Керування: безперервний потік DMA, D/C=1 без перемикань</text>
  <text x="448" y="434" font-size="12" fill="#6b7280">• Тривалість: 23,04 мс (при 40 МГц) → 43,4 FPS, CPU 100% вільний</text>
</svg>
