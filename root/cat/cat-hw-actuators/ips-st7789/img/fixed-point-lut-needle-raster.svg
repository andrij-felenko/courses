<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="3.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L7,3.5 L0,7 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Цілочисельна растеризація стрілки: таблиця LUT та DDA ребер</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Повний розрахунок геометрії та сканлайнів у Q15/Q16 без ділення та float</text>

  <!-- ЛІВА ПАНЕЛЬ: LUT ТА ТРИГОНОМЕТРІЯ -->
  <rect x="24" y="74" width="444" height="314" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="40" y="98" font-size="14" font-weight="bold" fill="#1a1a1a">1. Таблиця LUT кутів (Zero-float тригонометрія)</text>

  <!-- Кругова шкала кутів -->
  <circle cx="104" cy="186" r="48" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3 3"/>
  <circle cx="104" cy="186" r="3" fill="#1a1a1a"/>

  <!-- Позначки кутів на колі -->
  <line x1="104" y1="138" x2="104" y2="144" stroke="#6b7280" stroke-width="1"/>
  <text x="104" y="128" text-anchor="middle" font-size="11" fill="#6b7280">192 (270°)</text>

  <line x1="152" y1="186" x2="146" y2="186" stroke="#6b7280" stroke-width="1"/>
  <text x="158" y="190" font-size="11" fill="#6b7280">0</text>

  <line x1="104" y1="234" x2="104" y2="228" stroke="#6b7280" stroke-width="1"/>
  <text x="104" y="250" text-anchor="middle" font-size="11" fill="#6b7280">64 (90°)</text>

  <line x1="56" y1="186" x2="62" y2="186" stroke="#6b7280" stroke-width="1"/>
  <text x="50" y="190" text-anchor="end" font-size="11" fill="#6b7280">128</text>

  <!-- Вектор стрілки під кутом theta -->
  <line x1="104" y1="186" x2="136" y2="152" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <circle cx="140" cy="148" r="3" fill="#2457d6"/>
  <text x="146" y="146" font-size="11" font-weight="bold" fill="#2457d6">Tip</text>

  <text x="104" y="270" text-anchor="middle" font-size="11" fill="#1a1a1a">Коло: 256 кутів</text>

  <!-- Flash LUT блок -->
  <rect x="200" y="114" width="256" height="158" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="212" y="132" font-size="12" font-weight="bold" fill="#2457d6">Flash: sin_q15[256], cos_q15[256]</text>
  <line x1="200" y1="140" x2="456" y2="140" stroke="#d0d7de" stroke-width="1"/>

  <text x="212" y="158" font-size="11" fill="#1a1a1a">• Формат Q15: int16_t (-1.0 .. +0.999)</text>
  <text x="212" y="178" font-size="11" fill="#1a1a1a">• Flash: 256 × 2 B = 512 байтів таблиці</text>
  <text x="212" y="198" font-size="11" fill="#2457d6">• cos_val = cos_q15[angle_idx]</text>
  <text x="212" y="218" font-size="11" fill="#2457d6">• sin_val = sin_q15[angle_idx]</text>
  <text x="212" y="238" font-size="11" fill="#27ae60">• Вибірка значення за 1 такт CPU</text>
  <text x="212" y="258" font-size="11" fill="#27ae60">• Нуль операцій FPU та викликів sinf()</text>

  <!-- Розрахунок вершини стрілки -->
  <rect x="36" y="286" width="420" height="90" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="48" y="306" font-size="12" font-weight="bold" fill="#2457d6">Координати вершини (Tip) без ділення та float:</text>
  <text x="48" y="328" font-size="12" font-family="Consolas, monospace" fill="#1a1a1a">tip_x = cx + ((length * cos_q15[idx]) &gt;&gt; 15);</text>
  <text x="48" y="348" font-size="12" font-family="Consolas, monospace" fill="#1a1a1a">tip_y = cy + ((length * sin_q15[idx]) &gt;&gt; 15);</text>
  <text x="48" y="366" font-size="11" fill="#27ae60">✓ Множення int16 та зсув &gt;&gt; 15 замість ділення на 32768</text>

  <!-- ПРАВА ПАНЕЛЬ: DDA РАСТЕРИЗАЦІЯ РЕБЕР -->
  <rect x="492" y="74" width="444" height="314" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="508" y="98" font-size="14" font-weight="bold" fill="#1a1a1a">2. Інкрементальна растеризація ребер (DDA без ділення)</text>

  <!-- Візуалізація стрілки і сканлайна -->
  <rect x="504" y="114" width="196" height="158" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Фонова сітка сканлайнів -->
  <line x1="512" y1="142" x2="692" y2="142" stroke="#f0f2f5" stroke-width="1"/>
  <line x1="512" y1="164" x2="692" y2="164" stroke="#f0f2f5" stroke-width="1"/>
  <line x1="512" y1="208" x2="692" y2="208" stroke="#f0f2f5" stroke-width="1"/>
  <line x1="512" y1="230" x2="692" y2="230" stroke="#f0f2f5" stroke-width="1"/>

  <!-- Трикутник стрілки -->
  <polygon points="595,142 545,230 645,230" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="595" cy="142" r="3" fill="#2457d6"/>
  <text x="595" y="132" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Tip</text>

  <circle cx="545" cy="230" r="3" fill="#1a1a1a"/>
  <text x="545" y="250" text-anchor="middle" font-size="11" fill="#1a1a1a">Base_L</text>

  <circle cx="645" cy="230" r="3" fill="#1a1a1a"/>
  <text x="645" y="250" text-anchor="middle" font-size="11" fill="#1a1a1a">Base_R</text>

  <!-- Поточний сканлайн Y = y -->
  <line x1="512" y1="186" x2="550" y2="186" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3 2"/>
  <line x1="640" y1="186" x2="692" y2="186" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3 2"/>
  <line x1="570" y1="186" x2="620" y2="186" stroke="#2457d6" stroke-width="4"/>

  <circle cx="570" cy="186" r="3" fill="#c0392b"/>
  <circle cx="620" cy="186" r="3" fill="#c0392b"/>

  <text x="512" y="150" font-size="11" font-weight="bold" fill="#2457d6">Рядок Y</text>
  <text x="552" y="180" text-anchor="end" font-size="11" font-weight="bold" fill="#c0392b">x_l</text>
  <text x="638" y="180" text-anchor="start" font-size="11" font-weight="bold" fill="#c0392b">x_r</text>
  <text x="595" y="206" text-anchor="middle" font-size="11" fill="#2457d6">пікселі</text>

  <!-- Блок алгоритму DDA Q16 -->
  <rect x="712" y="114" width="212" height="158" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="722" y="132" font-size="12" font-weight="bold" fill="#2457d6">Інкремент Q16 (DDA без /)</text>
  <line x1="712" y1="140" x2="924" y2="140" stroke="#d0d7de" stroke-width="1"/>

  <text x="722" y="156" font-size="11" fill="#6b7280">1 раз на кадр (нахил ребра):</text>
  <text x="722" y="172" font-size="11" font-family="Consolas, monospace" fill="#1a1a1a">dx_l_q16 = (Δx_l &lt;&lt; 16) / h;</text>
  <text x="722" y="188" font-size="11" font-family="Consolas, monospace" fill="#1a1a1a">dx_r_q16 = (Δx_r &lt;&lt; 16) / h;</text>

  <text x="722" y="208" font-size="11" font-weight="bold" fill="#27ae60">Для кожного сканлайна Y:</text>
  <text x="722" y="224" font-size="11" font-family="Consolas, monospace" fill="#1a1a1a">x_l_q16 += dx_l_q16; // ADD</text>
  <text x="722" y="240" font-size="11" font-family="Consolas, monospace" fill="#1a1a1a">x_r_q16 += dx_r_q16; // ADD</text>
  <text x="722" y="258" font-size="11" font-family="Consolas, monospace" fill="#2457d6">fill_span(x_l&gt;&gt;16, x_r&gt;&gt;16);</text>

  <!-- Підсумок DDA -->
  <rect x="504" y="286" width="420" height="90" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="516" y="306" font-size="12" font-weight="bold" fill="#27ae60">Ефективність растеризації рядків у циклі:</text>
  <text x="516" y="326" font-size="11" fill="#1a1a1a">• 1 такт цілочисельного додавання (ADD) на кожне ребро</text>
  <text x="516" y="344" font-size="11" fill="#1a1a1a">• Жодного ділення (/) чи float у внутрішньому циклі рядків</text>
  <text x="516" y="362" font-size="11" fill="#2457d6">• Дробова частина Q16 (16 біт) гарантує субпіксельну плавність</text>

  <!-- НИЖНІЙ БАНЕР: ПОРІВНЯННЯ ВИГОДИ -->
  <rect x="24" y="402" width="912" height="58" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <line x1="476" y1="408" x2="476" y2="454" stroke="#d0d7de" stroke-width="1"/>

  <text x="40" y="424" font-size="12" font-weight="bold" fill="#c0392b">✗ Звичайний підхід (float, sinf(), ділення в рядку):</text>
  <text x="40" y="444" font-size="11" fill="#1a1a1a">Десятки тактів на крок, виклики soft-float, падіння до &lt; 15 FPS</text>

  <text x="492" y="424" font-size="12" font-weight="bold" fill="#27ae60">✓ Оптимізований підхід (Flash LUT Q15 + DDA Q16):</text>
  <text x="492" y="444" font-size="11" fill="#1a1a1a">1 такт ADD на ребро, лічені мкс на 240 рядків, стабільні 45+ FPS</text>
</svg>
