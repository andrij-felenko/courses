<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="33" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Схема підключення модуля IPS 1.3″ до мікроконтролера</text>
  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#6b7280">З'єднання ліній SPI, живлення та резистивні дільники для узгодження рівнів 5 В / 3.3 В</text>

  <!-- Блок MCU (зліва) -->
  <rect x="30" y="64" width="190" height="354" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="30" y1="98" x2="220" y2="98" stroke="#d0d7de" stroke-width="1"/>
  <text x="125" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Мікроконтролер (5V)</text>
  <text x="125" y="94" text-anchor="middle" font-size="12" fill="#6b7280">Arduino / AVR (рівні 5 В)</text>

  <!-- Піни MCU -->
  <text x="42" y="126" text-anchor="start" font-size="12" fill="#6b7280">Живлення</text>
  <text x="210" y="126" text-anchor="end" font-size="12" font-weight="600" fill="#1a1a1a">5V / 3.3V</text>
  <circle cx="220" cy="122" r="4" fill="#c0392b"/>

  <text x="42" y="162" text-anchor="start" font-size="12" fill="#6b7280">Спільна земля</text>
  <text x="210" y="162" text-anchor="end" font-size="12" font-weight="600" fill="#1a1a1a">GND</text>
  <circle cx="220" cy="158" r="4" fill="#27ae60"/>

  <text x="42" y="216" text-anchor="start" font-size="12" fill="#6b7280">Тактування</text>
  <text x="210" y="216" text-anchor="end" font-size="12" font-weight="600" fill="#1a1a1a">SCK (D13)</text>
  <circle cx="220" cy="212" r="4" fill="#2457d6"/>

  <text x="42" y="254" text-anchor="start" font-size="12" fill="#6b7280">Дані SPI</text>
  <text x="210" y="254" text-anchor="end" font-size="12" font-weight="600" fill="#1a1a1a">MOSI (D11)</text>
  <circle cx="220" cy="250" r="4" fill="#2457d6"/>

  <text x="42" y="292" text-anchor="start" font-size="12" fill="#6b7280">Вибір чипа</text>
  <text x="210" y="292" text-anchor="end" font-size="12" font-weight="600" fill="#1a1a1a">CS (D10)</text>
  <circle cx="220" cy="288" r="4" fill="#2457d6"/>

  <text x="42" y="330" text-anchor="start" font-size="12" fill="#6b7280">Команда/дані</text>
  <text x="210" y="330" text-anchor="end" font-size="12" font-weight="600" fill="#1a1a1a">DC (D9)</text>
  <circle cx="220" cy="326" r="4" fill="#2457d6"/>

  <text x="42" y="368" text-anchor="start" font-size="12" fill="#6b7280">Скидання</text>
  <text x="210" y="368" text-anchor="end" font-size="12" font-weight="600" fill="#1a1a1a">RST (D8)</text>
  <circle cx="220" cy="364" r="4" fill="#2457d6"/>

  <text x="42" y="406" text-anchor="start" font-size="12" fill="#6b7280">Підсвітка</text>
  <text x="210" y="406" text-anchor="end" font-size="12" font-weight="600" fill="#1a1a1a">BLK (D7)</text>
  <circle cx="220" cy="402" r="4" fill="#2457d6"/>

  <!-- Блок Дисплея (справа) -->
  <rect x="740" y="64" width="190" height="354" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="740" y1="98" x2="930" y2="98" stroke="#d0d7de" stroke-width="1"/>
  <text x="835" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#1a1a1a">Модуль IPS 1.3″</text>
  <text x="835" y="94" text-anchor="middle" font-size="12" fill="#6b7280">ST7789 (240×240, 3.3 В)</text>

  <!-- Піни Дисплея -->
  <circle cx="740" cy="122" r="4" fill="#c0392b"/>
  <text x="750" y="126" text-anchor="start" font-size="12" font-weight="600" fill="#1a1a1a">VCC</text>
  <text x="918" y="126" text-anchor="end" font-size="12" fill="#6b7280">3.3 В живл.</text>

  <circle cx="740" cy="158" r="4" fill="#27ae60"/>
  <text x="750" y="162" text-anchor="start" font-size="12" font-weight="600" fill="#1a1a1a">GND</text>
  <text x="918" y="162" text-anchor="end" font-size="12" fill="#6b7280">0 В земля</text>

  <circle cx="740" cy="212" r="4" fill="#2457d6"/>
  <text x="750" y="216" text-anchor="start" font-size="12" font-weight="600" fill="#1a1a1a">SCL (SCK)</text>
  <text x="918" y="216" text-anchor="end" font-size="12" fill="#6b7280">Тактування</text>

  <circle cx="740" cy="250" r="4" fill="#2457d6"/>
  <text x="750" y="254" text-anchor="start" font-size="12" font-weight="600" fill="#1a1a1a">SDA (MOSI)</text>
  <text x="918" y="254" text-anchor="end" font-size="12" fill="#6b7280">Дані від MCU</text>

  <circle cx="740" cy="288" r="4" fill="#2457d6"/>
  <text x="750" y="292" text-anchor="start" font-size="12" font-weight="600" fill="#1a1a1a">CS</text>
  <text x="918" y="292" text-anchor="end" font-size="12" fill="#6b7280">Вибір дисплея</text>

  <circle cx="740" cy="326" r="4" fill="#2457d6"/>
  <text x="750" y="330" text-anchor="start" font-size="12" font-weight="600" fill="#1a1a1a">DC</text>
  <text x="918" y="330" text-anchor="end" font-size="12" fill="#6b7280">Вибір D / C</text>

  <circle cx="740" cy="364" r="4" fill="#2457d6"/>
  <text x="750" y="368" text-anchor="start" font-size="12" font-weight="600" fill="#1a1a1a">RES (RST)</text>
  <text x="918" y="368" text-anchor="end" font-size="12" fill="#6b7280">Скидання</text>

  <circle cx="740" cy="402" r="4" fill="#2457d6"/>
  <text x="750" y="406" text-anchor="start" font-size="12" font-weight="600" fill="#1a1a1a">BLK</text>
  <text x="918" y="406" text-anchor="end" font-size="12" fill="#6b7280">Керування LED</text>

  <!-- Лінія живлення VCC -->
  <line x1="220" y1="122" x2="740" y2="122" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="480" y="112" text-anchor="middle" font-size="12" font-weight="600" fill="#c0392b">Шина живлення 3.3 В (пряме підключення до VCC модуля)</text>

  <!-- Лінія GND -->
  <line x1="220" y1="158" x2="740" y2="158" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="480" y="148" text-anchor="middle" font-size="12" font-weight="600" fill="#27ae60">Спільна земля GND (0 В, спільний опорний потенціал)</text>

  <!-- Зона узгодження рівнів -->
  <rect x="236" y="176" width="488" height="242" rx="8" fill="#f8fafc" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="480" y="193" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Зона узгодження рівнів 5 В ➔ 3.3 В (резистивні дільники напруги)</text>

  <!-- Канал SCK (y = 212) -->
  <line x1="220" y1="212" x2="248" y2="212" stroke="#c0392b" stroke-width="2"/>
  <rect x="248" y="203" width="32" height="18" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="264" y="216" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">5В</text>
  <line x1="280" y1="212" x2="304" y2="212" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="304" y="200" width="352" height="24" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
  <rect x="312" y="203" width="120" height="18" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="372" y="216" text-anchor="middle" font-size="12" font-weight="600" fill="#2457d6">R1 = 1.5 кОм</text>
  <text x="450" y="216" text-anchor="middle" font-size="13" font-weight="700" fill="#6b7280">+</text>
  <rect x="468" y="203" width="180" height="18" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="558" y="216" text-anchor="middle" font-size="12" font-weight="600" fill="#27ae60">R2 = 3.0 кОм (на GND)</text>
  <line x1="656" y1="212" x2="676" y2="212" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="676" y="203" width="40" height="18" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="696" y="216" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">3.3В</text>
  <line x1="716" y1="212" x2="740" y2="212" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Канал MOSI (y = 250) -->
  <line x1="220" y1="250" x2="248" y2="250" stroke="#c0392b" stroke-width="2"/>
  <rect x="248" y="241" width="32" height="18" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="264" y="254" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">5В</text>
  <line x1="280" y1="250" x2="304" y2="250" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="304" y="238" width="352" height="24" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
  <rect x="312" y="241" width="120" height="18" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="372" y="254" text-anchor="middle" font-size="12" font-weight="600" fill="#2457d6">R1 = 1.5 кОм</text>
  <text x="450" y="254" text-anchor="middle" font-size="13" font-weight="700" fill="#6b7280">+</text>
  <rect x="468" y="241" width="180" height="18" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="558" y="254" text-anchor="middle" font-size="12" font-weight="600" fill="#27ae60">R2 = 3.0 кОм (на GND)</text>
  <line x1="656" y1="250" x2="676" y2="250" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="676" y="241" width="40" height="18" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="696" y="254" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">3.3В</text>
  <line x1="716" y1="250" x2="740" y2="250" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Канал CS (y = 288) -->
  <line x1="220" y1="288" x2="248" y2="288" stroke="#c0392b" stroke-width="2"/>
  <rect x="248" y="279" width="32" height="18" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="264" y="292" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">5В</text>
  <line x1="280" y1="288" x2="304" y2="288" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="304" y="276" width="352" height="24" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
  <rect x="312" y="279" width="120" height="18" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="372" y="292" text-anchor="middle" font-size="12" font-weight="600" fill="#2457d6">R1 = 1.5 кОм</text>
  <text x="450" y="292" text-anchor="middle" font-size="13" font-weight="700" fill="#6b7280">+</text>
  <rect x="468" y="279" width="180" height="18" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="558" y="292" text-anchor="middle" font-size="12" font-weight="600" fill="#27ae60">R2 = 3.0 кОм (на GND)</text>
  <line x1="656" y1="288" x2="676" y2="288" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="676" y="279" width="40" height="18" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="696" y="292" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">3.3В</text>
  <line x1="716" y1="288" x2="740" y2="288" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Канал DC (y = 326) -->
  <line x1="220" y1="326" x2="248" y2="326" stroke="#c0392b" stroke-width="2"/>
  <rect x="248" y="317" width="32" height="18" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="264" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">5В</text>
  <line x1="280" y1="326" x2="304" y2="326" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="304" y="314" width="352" height="24" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
  <rect x="312" y="317" width="120" height="18" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="372" y="330" text-anchor="middle" font-size="12" font-weight="600" fill="#2457d6">R1 = 1.5 кОм</text>
  <text x="450" y="330" text-anchor="middle" font-size="13" font-weight="700" fill="#6b7280">+</text>
  <rect x="468" y="317" width="180" height="18" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="558" y="330" text-anchor="middle" font-size="12" font-weight="600" fill="#27ae60">R2 = 3.0 кОм (на GND)</text>
  <line x1="656" y1="326" x2="676" y2="326" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="676" y="317" width="40" height="18" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="696" y="330" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">3.3В</text>
  <line x1="716" y1="326" x2="740" y2="326" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Канал RST (y = 364) -->
  <line x1="220" y1="364" x2="248" y2="364" stroke="#c0392b" stroke-width="2"/>
  <rect x="248" y="355" width="32" height="18" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="264" y="368" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">5В</text>
  <line x1="280" y1="364" x2="304" y2="364" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="304" y="352" width="352" height="24" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
  <rect x="312" y="355" width="120" height="18" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="372" y="368" text-anchor="middle" font-size="12" font-weight="600" fill="#2457d6">R1 = 1.5 кОм</text>
  <text x="450" y="368" text-anchor="middle" font-size="13" font-weight="700" fill="#6b7280">+</text>
  <rect x="468" y="355" width="180" height="18" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="558" y="368" text-anchor="middle" font-size="12" font-weight="600" fill="#27ae60">R2 = 3.0 кОм (на GND)</text>
  <line x1="656" y1="364" x2="676" y2="364" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="676" y="355" width="40" height="18" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="696" y="368" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">3.3В</text>
  <line x1="716" y1="364" x2="740" y2="364" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Канал BLK (y = 402) -->
  <line x1="220" y1="402" x2="248" y2="402" stroke="#c0392b" stroke-width="2"/>
  <rect x="248" y="393" width="32" height="18" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="264" y="406" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">5В</text>
  <line x1="280" y1="402" x2="304" y2="402" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <rect x="304" y="390" width="352" height="24" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
  <rect x="312" y="393" width="120" height="18" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="372" y="406" text-anchor="middle" font-size="12" font-weight="600" fill="#2457d6">R1 = 1.5 кОм</text>
  <text x="450" y="406" text-anchor="middle" font-size="13" font-weight="700" fill="#6b7280">+</text>
  <rect x="468" y="393" width="180" height="18" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="558" y="406" text-anchor="middle" font-size="12" font-weight="600" fill="#27ae60">R2 = 3.0 кОм (на GND)</text>
  <line x1="656" y1="402" x2="676" y2="402" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="676" y="393" width="40" height="18" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="696" y="406" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">3.3В</text>
  <line x1="716" y1="402" x2="740" y2="402" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Пояснення внизу -->
  <text x="480" y="438" text-anchor="middle" font-size="12" fill="#6b7280">Розрахунок дільника: V_out = 5 В × 3.0 кОм / (1.5 кОм + 3.0 кОм) ≈ 3.33 В • ST7789 не толерантний до 5 В (макс. 3.6 В)</text>
</svg>
