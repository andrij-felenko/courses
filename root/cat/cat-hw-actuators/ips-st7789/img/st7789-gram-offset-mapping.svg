<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="28" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Карта адресації вікна 240×240 у пам&apos;яті GRAM 240×320 (ST7789)</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Апаратні зміщення рядків і стовпців для чотирьох кутів орієнтації (0°, 90°, 180°, 270°)</text>

  <!-- ==================== КАРТКА 1: 0° ==================== -->
  <rect x="24" y="66" width="216" height="378" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="132" y="88" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">0° · Нормальна</text>
  <text x="132" y="104" font-size="12" fill="#6b7280" text-anchor="middle">GRAM 240×320 (MV=0)</text>

  <!-- Бейдж зміщення -->
  <rect x="37" y="114" width="190" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="132" y="131" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Зсув: X(Col)=0 │ Y(Row)=0</text>

  <!-- Координати X угорі -->
  <text x="78" y="163" font-size="12" fill="#6b7280" text-anchor="start">X: 0</text>
  <text x="186" y="163" font-size="12" fill="#6b7280" text-anchor="end">239</text>

  <!-- Координати Y ліворуч -->
  <text x="70" y="186" font-size="12" fill="#6b7280" text-anchor="end">Y: 0</text>
  <text x="70" y="283" font-size="12" fill="#6b7280" text-anchor="end">239</text>
  <text x="70" y="319" font-size="12" fill="#6b7280" text-anchor="end">319</text>

  <!-- Активне вікно 240x240 (gx=78, gy=175, w=108, h=108) -->
  <rect x="78" y="175" width="108" height="108" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="132" y="224" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">ЕКРАН</text>
  <text x="132" y="242" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">240 × 240</text>

  <!-- Невикористані рядки 80 px (gx=78, gy=283, w=108, h=36) -->
  <rect x="78" y="283" width="108" height="36" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="132" y="305" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">80 рядків N/C</text>

  <!-- Рамка GRAM 240x320 -->
  <rect x="78" y="175" width="108" height="144" fill="none" stroke="#6b7280" stroke-width="0.75"/>

  <!-- Нижня інформаційна панель -->
  <rect x="34" y="336" width="196" height="96" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="132" y="354" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Активне вікно 240×240</text>
  <text x="132" y="370" font-size="12" fill="#1a1a1a" text-anchor="middle">X: 0..239  │  Y: 0..239</text>
  <line x1="44" y1="382" x2="220" y2="382" stroke="#e1e4e8" stroke-width="1"/>
  <text x="132" y="400" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Невикористана зона</text>
  <text x="132" y="416" font-size="12" fill="#6b7280" text-anchor="middle">Рядки Y: 240..319 (80 px)</text>


  <!-- ==================== КАРТКА 2: 90° ==================== -->
  <rect x="256" y="66" width="216" height="378" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="364" y="88" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">90° · За годинниковою</text>
  <text x="364" y="104" font-size="12" fill="#6b7280" text-anchor="middle">GRAM 320×240 (MV=1)</text>

  <!-- Бейдж зміщення -->
  <rect x="269" y="114" width="190" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="364" y="131" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Зсув: X(Col)=0 │ Y(Row)=0</text>

  <!-- Координати X угорі -->
  <text x="296" y="163" font-size="12" fill="#6b7280" text-anchor="start">X: 0</text>
  <text x="400" y="163" font-size="12" font-weight="700" fill="#2457d6" text-anchor="end">239</text>
  <text x="440" y="163" font-size="12" fill="#c0392b" text-anchor="end">319</text>

  <!-- Координати Y ліворуч -->
  <text x="288" y="186" font-size="12" fill="#6b7280" text-anchor="end">Y: 0</text>
  <text x="288" y="283" font-size="12" fill="#6b7280" text-anchor="end">239</text>

  <!-- Активне вікно 240x240 (gx=296, gy=175, w=108, h=108) -->
  <rect x="296" y="175" width="108" height="108" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="350" y="224" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">ЕКРАН</text>
  <text x="350" y="242" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">240 × 240</text>

  <!-- Невикористані стовпці 80 px (gx=404, gy=175, w=36, h=108) -->
  <rect x="404" y="175" width="36" height="108" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="422" y="212" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">80</text>
  <text x="422" y="230" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">px</text>
  <text x="422" y="248" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">N/C</text>

  <!-- Рамка GRAM 320x240 -->
  <rect x="296" y="175" width="144" height="108" fill="none" stroke="#6b7280" stroke-width="0.75"/>

  <!-- Пояснення осей -->
  <text x="364" y="308" font-size="12" fill="#6b7280" text-anchor="middle">Обмін осей X↔Y (MV=1)</text>

  <!-- Нижня інформаційна панель -->
  <rect x="266" y="336" width="196" height="96" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="364" y="354" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Активне вікно 240×240</text>
  <text x="364" y="370" font-size="12" fill="#1a1a1a" text-anchor="middle">X: 0..239  │  Y: 0..239</text>
  <line x1="276" y1="382" x2="452" y2="382" stroke="#e1e4e8" stroke-width="1"/>
  <text x="364" y="400" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Невикористана зона</text>
  <text x="364" y="416" font-size="12" fill="#6b7280" text-anchor="middle">Стовпці X: 240..319 (80 px)</text>


  <!-- ==================== КАРТКА 3: 180° ==================== -->
  <rect x="488" y="66" width="216" height="378" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="596" y="88" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">180° · Перевернута</text>
  <text x="596" y="104" font-size="12" fill="#6b7280" text-anchor="middle">GRAM 240×320 (MV=0)</text>

  <!-- Бейдж зміщення -->
  <rect x="501" y="114" width="190" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="596" y="131" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Зсув: X(Col)=0 │ Y(Row)=80</text>

  <!-- Координати X угорі -->
  <text x="542" y="163" font-size="12" fill="#6b7280" text-anchor="start">X: 0</text>
  <text x="650" y="163" font-size="12" fill="#6b7280" text-anchor="end">239</text>

  <!-- Координати Y ліворуч -->
  <text x="534" y="186" font-size="12" fill="#c0392b" text-anchor="end">Y: 0</text>
  <text x="534" y="215" font-size="12" font-weight="700" fill="#2457d6" text-anchor="end">80</text>
  <text x="534" y="319" font-size="12" fill="#6b7280" text-anchor="end">319</text>

  <!-- Невикористані рядки 80 px (gx=542, gy=175, w=108, h=36) -->
  <rect x="542" y="175" width="108" height="36" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="596" y="197" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">80 рядків N/C</text>

  <!-- Активне вікно 240x240 (gx=542, gy=211, w=108, h=108) -->
  <rect x="542" y="211" width="108" height="108" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="596" y="260" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">ЕКРАН</text>
  <text x="596" y="278" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">240 × 240</text>

  <!-- Рамка GRAM 240x320 -->
  <rect x="542" y="175" width="108" height="144" fill="none" stroke="#6b7280" stroke-width="0.75"/>

  <!-- Нижня інформаційна панель -->
  <rect x="498" y="336" width="196" height="96" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="596" y="354" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Активне вікно 240×240</text>
  <text x="596" y="370" font-size="12" fill="#1a1a1a" text-anchor="middle">X: 0..239  │  Y: 80..319</text>
  <line x1="508" y1="382" x2="684" y2="382" stroke="#e1e4e8" stroke-width="1"/>
  <text x="596" y="400" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Невикористана зона</text>
  <text x="596" y="416" font-size="12" fill="#6b7280" text-anchor="middle">Рядки Y: 0..79 (зсув +80 px)</text>


  <!-- ==================== КАРТКА 4: 270° ==================== -->
  <rect x="720" y="66" width="216" height="378" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="828" y="88" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">270° · Проти годинникової</text>
  <text x="828" y="104" font-size="12" fill="#6b7280" text-anchor="middle">GRAM 320×240 (MV=1)</text>

  <!-- Бейдж зміщення -->
  <rect x="733" y="114" width="190" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="828" y="131" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Зсув: X(Col)=80 │ Y(Row)=0</text>

  <!-- Координати X угорі -->
  <text x="760" y="163" font-size="12" fill="#c0392b" text-anchor="start">X: 0</text>
  <text x="796" y="163" font-size="12" font-weight="700" fill="#2457d6" text-anchor="start">80</text>
  <text x="904" y="163" font-size="12" fill="#6b7280" text-anchor="end">319</text>

  <!-- Координати Y ліворуч -->
  <text x="752" y="186" font-size="12" fill="#6b7280" text-anchor="end">Y: 0</text>
  <text x="752" y="283" font-size="12" fill="#6b7280" text-anchor="end">239</text>

  <!-- Невикористані стовпці 80 px (gx=760, gy=175, w=36, h=108) -->
  <rect x="760" y="175" width="36" height="108" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="778" y="212" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">80</text>
  <text x="778" y="230" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">px</text>
  <text x="778" y="248" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">N/C</text>

  <!-- Активне вікно 240x240 (gx=796, gy=175, w=108, h=108) -->
  <rect x="796" y="175" width="108" height="108" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="850" y="224" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">ЕКРАН</text>
  <text x="850" y="242" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">240 × 240</text>

  <!-- Рамка GRAM 320x240 -->
  <rect x="760" y="175" width="144" height="108" fill="none" stroke="#6b7280" stroke-width="0.75"/>

  <!-- Пояснення осей -->
  <text x="828" y="308" font-size="12" fill="#6b7280" text-anchor="middle">Обмін осей X↔Y (MV=1)</text>

  <!-- Нижня інформаційна панель -->
  <rect x="730" y="336" width="196" height="96" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="828" y="354" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Активне вікно 240×240</text>
  <text x="828" y="370" font-size="12" fill="#1a1a1a" text-anchor="middle">X: 80..319  │  Y: 0..239</text>
  <line x1="740" y1="382" x2="916" y2="382" stroke="#e1e4e8" stroke-width="1"/>
  <text x="828" y="400" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Невикористана зона</text>
  <text x="828" y="416" font-size="12" fill="#6b7280" text-anchor="middle">Стовпці X: 0..79 (зсув +80 px)</text>
</svg>
