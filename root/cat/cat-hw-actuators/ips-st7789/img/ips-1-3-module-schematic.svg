<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принципова електрична схема модуля IPS 1.3″ (ST7789)</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Стабілізатор 3.3 В, блокувальні конденсатори, ключ підсвічування та інтерфейс SPI</text>

  <!-- ================= БЛОК 1: Вхідний роз'єм модуля ================= -->
  <rect x="24" y="82" width="156" height="350" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="102" y="102" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">РОЗ'ЄМ J1</text>
  <text x="102" y="117" font-size="12" fill="#6b7280" text-anchor="middle">8 контактів</text>

  <!-- Піни роз'єму J1 -->
  <text x="36" y="142" font-size="12" font-weight="bold" fill="#27ae60">1 VCC</text>
  <text x="90" y="142" font-size="12" fill="#6b7280">3.3–5 В</text>
  <circle cx="180" cy="138" r="3.5" fill="white" stroke="#27ae60" stroke-width="1.5"/>

  <text x="36" y="172" font-size="12" font-weight="bold" fill="#6b7280">2 GND</text>
  <text x="90" y="172" font-size="12" fill="#6b7280">Земля 0В</text>
  <circle cx="180" cy="168" r="3.5" fill="white" stroke="#6b7280" stroke-width="1.5"/>

  <text x="36" y="206" font-size="12" font-weight="bold" fill="#2457d6">3 SCL</text>
  <text x="90" y="206" font-size="12" fill="#6b7280">Тактування</text>
  <circle cx="180" cy="202" r="3.5" fill="white" stroke="#2457d6" stroke-width="1.5"/>

  <text x="36" y="231" font-size="12" font-weight="bold" fill="#2457d6">4 SDA</text>
  <text x="90" y="231" font-size="12" fill="#6b7280">Дані MOSI</text>
  <circle cx="180" cy="227" r="3.5" fill="white" stroke="#2457d6" stroke-width="1.5"/>

  <text x="36" y="256" font-size="12" font-weight="bold" fill="#2457d6">5 RES</text>
  <text x="90" y="256" font-size="12" fill="#6b7280">Скидання</text>
  <circle cx="180" cy="252" r="3.5" fill="white" stroke="#2457d6" stroke-width="1.5"/>

  <text x="36" y="281" font-size="12" font-weight="bold" fill="#2457d6">6 DC</text>
  <text x="90" y="281" font-size="12" fill="#6b7280">Дані/Ком.</text>
  <circle cx="180" cy="277" r="3.5" fill="white" stroke="#2457d6" stroke-width="1.5"/>

  <text x="36" y="306" font-size="12" font-weight="bold" fill="#2457d6">7 CS</text>
  <text x="90" y="306" font-size="12" fill="#6b7280">Вибір чіпа</text>
  <circle cx="180" cy="302" r="3.5" fill="white" stroke="#2457d6" stroke-width="1.5"/>

  <text x="36" y="384" font-size="12" font-weight="bold" fill="#1a1a1a">8 BLK</text>
  <text x="90" y="384" font-size="12" fill="#6b7280">Підсвітка</text>
  <circle cx="180" cy="380" r="3.5" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- ================= БЛОК 2: Стабілізатор 3.3 В (LDO) ================= -->
  <rect x="195" y="82" width="495" height="98" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="210" y="100" font-size="12" font-weight="bold" fill="#27ae60">СТАБІЛІЗАТОР ЖИВЛЕННЯ (LDO 3.3V) ТА ФІЛЬТРАЦІЯ</text>
  <text x="525" y="100" font-size="12" fill="#6b7280">Вхід 3.3–5В → 3.3В</text>

  <!-- Дріт живлення VCC від піна 1 до стабілізатора -->
  <line x1="183.5" y1="138" x2="305" y2="138" stroke="#27ae60" stroke-width="2"/>
  <circle cx="240" cy="138" r="3" fill="#27ae60"/>

  <!-- Вхідний конденсатор C1 -->
  <line x1="240" y1="138" x2="240" y2="148" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="232" y1="148" x2="248" y2="148" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="232" y1="154" x2="248" y2="154" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="240" y1="154" x2="240" y2="168" stroke="#6b7280" stroke-width="1.5"/>
  <text x="252" y="147" font-size="12" fill="#1a1a1a">C1</text>
  <text x="252" y="161" font-size="12" fill="#6b7280">10 мкФ</text>

  <!-- Чип стабілізатора U1 6206A -->
  <rect x="305" y="120" width="85" height="36" rx="4" ry="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="348" y="135" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">6206A</text>
  <text x="348" y="149" font-size="12" fill="#1a1a1a" text-anchor="middle">3.3V LDO</text>
  <line x1="348" y1="156" x2="348" y2="168" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="348" cy="168" r="3" fill="#6b7280"/>

  <!-- Вихідний дріт VOUT (+3.3V) -->
  <line x1="390" y1="138" x2="705" y2="138" stroke="#27ae60" stroke-width="2"/>
  <circle cx="425" cy="138" r="3" fill="#27ae60"/>
  <text x="500" y="132" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">+3.3V (VDD)</text>

  <!-- Вихідний конденсатор C2 -->
  <line x1="425" y1="138" x2="425" y2="148" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="417" y1="148" x2="433" y2="148" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="417" y1="154" x2="433" y2="154" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="425" y1="154" x2="425" y2="168" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="425" cy="168" r="3" fill="#6b7280"/>
  <text x="437" y="147" font-size="12" fill="#1a1a1a">C2</text>
  <text x="437" y="161" font-size="12" fill="#6b7280">10 мкФ</text>

  <!-- Блокувальний конденсатор C3 -->
  <circle cx="550" cy="138" r="3" fill="#27ae60"/>
  <line x1="550" y1="138" x2="550" y2="148" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="542" y1="148" x2="558" y2="148" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="542" y1="154" x2="558" y2="154" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="550" y1="154" x2="550" y2="168" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="550" cy="168" r="3" fill="#6b7280"/>
  <text x="562" y="147" font-size="12" fill="#1a1a1a">C3</text>
  <text x="562" y="161" font-size="12" fill="#6b7280">100 нФ</text>

  <!-- Блокувальний конденсатор C4 -->
  <circle cx="625" cy="138" r="3" fill="#27ae60"/>
  <line x1="625" y1="138" x2="625" y2="148" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="617" y1="148" x2="633" y2="148" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="617" y1="154" x2="633" y2="154" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="625" y1="154" x2="625" y2="168" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="625" cy="168" r="3" fill="#6b7280"/>
  <text x="637" y="147" font-size="12" fill="#1a1a1a">C4</text>
  <text x="637" y="161" font-size="12" fill="#6b7280">100 нФ</text>

  <!-- Загальна шина землі GND -->
  <line x1="183.5" y1="168" x2="705" y2="168" stroke="#6b7280" stroke-width="2"/>
  <text x="205" y="160" font-size="12" font-weight="bold" fill="#6b7280">GND</text>
  <circle cx="240" cy="168" r="3" fill="#6b7280"/>

  <!-- ================= СИГНАЛЬНІ ЛІНІЇ ШИНИ SPI ================= -->
  <!-- SCL -->
  <line x1="183.5" y1="202" x2="701.5" y2="202" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <!-- SDA -->
  <line x1="183.5" y1="227" x2="701.5" y2="227" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <!-- RES -->
  <line x1="183.5" y1="252" x2="701.5" y2="252" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <!-- DC -->
  <line x1="183.5" y1="277" x2="701.5" y2="277" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <!-- CS -->
  <line x1="183.5" y1="302" x2="701.5" y2="302" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- ================= БЛОК 4: Ключ підсвічування BLK ================= -->
  <rect x="195" y="325" width="495" height="107" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="210" y="344" font-size="12" font-weight="bold" fill="#1a1a1a">КЛЮЧ ПІДСВІЧУВАННЯ (BLK)</text>
  <text x="400" y="344" font-size="12" fill="#6b7280">ШІМ (PWM) або сигнал 0/3.3В</text>

  <!-- Сигнал від піна 8 BLK до резистора R1 -->
  <line x1="183.5" y1="380" x2="240" y2="380" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Базовий резистор R1 -->
  <rect x="240" y="375" width="40" height="10" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="260" y="369" font-size="12" fill="#1a1a1a" text-anchor="middle">R1</text>
  <text x="260" y="400" font-size="12" fill="#6b7280" text-anchor="middle">1 кОм</text>
  <line x1="280" y1="380" x2="315" y2="380" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- NPN-транзистор Q1 (S8050) -->
  <line x1="315" y1="370" x2="315" y2="390" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="315" y1="375" x2="335" y2="363" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="335" y1="363" x2="335" y2="360" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="315" y1="385" x2="335" y2="397" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="335" y1="397" x2="335" y2="412" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="328,390 335,397 325,397" fill="#1a1a1a"/>
  <!-- Земля емітера -->
  <line x1="328" y1="412" x2="342" y2="412" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="331" y1="416" x2="339" y2="416" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="333" y1="420" x2="337" y2="420" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="345" y="385" font-size="12" font-weight="bold" fill="#1a1a1a">Q1 (NPN)</text>
  <text x="345" y="401" font-size="12" fill="#6b7280">S8050</text>

  <!-- Лінія від колектора Q1 до катода LED -->
  <line x1="335" y1="360" x2="460" y2="360" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Світлодіод підсвічування LED (катод ліворуч, анод праворуч) -->
  <polygon points="460,360 480,352 480,368" fill="#eaf0fd" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="460" y1="352" x2="460" y2="368" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Стрілки випромінювання світла -->
  <line x1="468" y1="350" x2="460" y2="341" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="476" y1="348" x2="468" y2="339" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="470" y="380" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">LED-підсвітка</text>
  <text x="470" y="396" font-size="12" fill="#6b7280" text-anchor="middle">(в дисплеї)</text>

  <!-- Лінія від анода LED до струмообмежувального резистора R_LED -->
  <line x1="480" y1="360" x2="535" y2="360" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Резистор R_LED -->
  <rect x="535" y="355" width="40" height="10" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="555" y="348" font-size="12" fill="#1a1a1a" text-anchor="middle">R_LED</text>
  <text x="555" y="380" font-size="12" fill="#6b7280" text-anchor="middle">20–33 Ом</text>

  <!-- Підключення до живлення +3.3V -->
  <line x1="575" y1="360" x2="610" y2="360" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="610" cy="360" r="3" fill="#27ae60"/>
  <text x="620" y="364" font-size="12" font-weight="bold" fill="#27ae60">+3.3V</text>
  <text x="620" y="379" font-size="12" fill="#6b7280">(анод LED)</text>

  <!-- ================= БЛОК 5: Контролер ST7789 та IPS-матриця ================= -->
  <rect x="705" y="82" width="231" height="350" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="820" y="102" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">МОДУЛЬ ДИСПЛЕЯ ST7789</text>
  <text x="820" y="117" font-size="12" fill="#6b7280" text-anchor="middle">IPS-матриця 240×240 точок</text>

  <!-- Вхідні контакти на чипі ST7789 -->
  <circle cx="705" cy="138" r="3.5" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <text x="716" y="142" font-size="12" font-weight="bold" fill="#27ae60">VDD (3.3V)</text>

  <circle cx="705" cy="168" r="3.5" fill="white" stroke="#6b7280" stroke-width="1.5"/>
  <text x="716" y="172" font-size="12" font-weight="bold" fill="#6b7280">GND (0V)</text>

  <circle cx="705" cy="202" r="3.5" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="716" y="206" font-size="12" font-weight="bold" fill="#2457d6">SCL (CLK)</text>

  <circle cx="705" cy="227" r="3.5" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="716" y="231" font-size="12" font-weight="bold" fill="#2457d6">SDA (MOSI)</text>

  <circle cx="705" cy="252" r="3.5" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="716" y="256" font-size="12" font-weight="bold" fill="#2457d6">RES (Reset)</text>

  <circle cx="705" cy="277" r="3.5" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="716" y="281" font-size="12" font-weight="bold" fill="#2457d6">DC (Дані/Ком)</text>

  <circle cx="705" cy="302" r="3.5" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="716" y="306" font-size="12" font-weight="bold" fill="#2457d6">CS (Chip Sel)</text>

  <!-- Графічне представлення IPS-екрана -->
  <rect x="814" y="130" width="112" height="182" rx="6" ry="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="820" y="136" width="100" height="100" rx="4" ry="4" fill="#1a1a1a"/>
  <rect x="824" y="140" width="92" height="92" rx="2" ry="2" fill="#eaf0fd"/>
  <text x="870" y="172" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">IPS 1.3″</text>
  <text x="870" y="190" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">240×240</text>
  <text x="870" y="208" font-size="12" fill="#6b7280" text-anchor="middle">RGB565</text>

  <text x="870" y="255" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">IPS-МАТРИЦЯ</text>
  <text x="870" y="272" font-size="12" fill="#6b7280" text-anchor="middle">Широкі кути 178°</text>
  <text x="870" y="289" font-size="12" fill="#6b7280" text-anchor="middle">SPI до 60 МГц</text>
  <text x="870" y="305" font-size="12" fill="#27ae60" text-anchor="middle">Живлення 3.3 В</text>

  <!-- Блок характеристик драйвера ST7789 -->
  <rect x="716" y="324" width="210" height="98" rx="6" ry="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="821" y="344" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ДРАЙВЕР ST7789</text>
  <text x="726" y="364" font-size="12" fill="#1a1a1a">• Пам'ять GRAM: 240×320</text>
  <text x="726" y="384" font-size="12" fill="#c0392b">• Апаратний зсув вікна</text>
  <text x="726" y="404" font-size="12" fill="#6b7280">• Логіка 3.3В (VDDI)</text>
</svg>
