<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Синхронізація кадру за сигналом TE: усунення розриву зображення (Tearing)</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Запуск передачі DMA по передньому фронту TE (V-Blank) запобігає перетинанню покажчиків запису та розгортки</text>

  <!-- ЛІВА ПАНЕЛЬ: Часова діаграма TE та покажчиків -->
  <rect x="24" y="68" width="530" height="376" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="289" y="90" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Діаграма розгортки матриці (Scan) та запису DMA (Host Write)</text>

  <!-- Сигнал TE -->
  <text x="75" y="129" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">TE (V-Sync)</text>
  <polyline points="80,116 105,116 105,136 300,136 300,116 325,116 325,136 520,136" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Позначки V-Blank -->
  <text x="92" y="108" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">V-Blank</text>
  <text x="312" y="108" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">V-Blank</text>

  <!-- Позначки осі Y -->
  <text x="75" y="164" font-size="12" fill="#6b7280" text-anchor="end">Рядок 0</text>
  <text x="75" y="246" font-size="12" fill="#6b7280" text-anchor="end">Рядок 120</text>
  <text x="75" y="328" font-size="12" fill="#6b7280" text-anchor="end">Рядок 239</text>

  <!-- Вісі координат графіка -->
  <line x1="80" y1="160" x2="80" y2="325" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="80" y1="325" x2="530" y2="325" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Горизонтальні пунктирні рівні сітки -->
  <line x1="80" y1="160" x2="520" y2="160" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="80" y1="242" x2="520" y2="242" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Вертикальні межі кадрів -->
  <line x1="300" y1="140" x2="300" y2="325" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="520" y1="140" x2="520" y2="325" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Траєкторія розгортки дисплея (Display Scan Line) - Чорна пунктирна -->
  <line x1="105" y1="160" x2="300" y2="325" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="6 3"/>
  <line x1="325" y1="160" x2="520" y2="325" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="6 3"/>

  <!-- Безпечний запис DMA (Зелена лінія) -->
  <line x1="85" y1="160" x2="215" y2="325" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Небезпечний запис без синхронізації (Червона лінія) -->
  <line x1="150" y1="160" x2="270" y2="325" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Точка перетину / розриву -->
  <circle cx="222" cy="259" r="4.5" fill="#c0392b"/>

  <!-- Позначки часу на осі X -->
  <text x="80" y="340" font-size="12" fill="#6b7280" text-anchor="middle">0 мс</text>
  <text x="300" y="340" font-size="12" fill="#6b7280" text-anchor="middle">16.6 мс (Кадр 1)</text>
  <text x="520" y="340" font-size="12" fill="#6b7280" text-anchor="middle">33.3 мс (Кадр 2)</text>

  <!-- Легенда та опис внизу панелі -->
  <text x="40" y="360" font-size="12" font-weight="bold" fill="#27ae60">• Безпечний запуск (Зелена лінія):</text>
  <text x="250" y="360" font-size="12" fill="#1a1a1a">старт по TE; DMA завершує запис раніше розгортки</text>

  <text x="40" y="380" font-size="12" font-weight="bold" fill="#c0392b">• Розрив кадру (Червона лінія):</text>
  <text x="250" y="380" font-size="12" fill="#1a1a1a">запис перетинає розгортку — на екрані зсув (Tearing)</text>

  <rect x="40" y="396" width="498" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="289" y="412" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Правило: T_write &lt; T_frame (SPI ≥ 40 МГц) + старт суворо за сигналом TE</text>

  <text x="289" y="434" font-size="12" fill="#6b7280" text-anchor="middle">Гарантує плавні 60 FPS без візуальних артефактів та мерехтіння</text>

  <!-- ПРАВА СТОРОНА: 3 картки -->
  <!-- Картка 1: Регістр TEON -->
  <rect x="570" y="68" width="366" height="116" rx="8" fill="#eaf0fd" stroke="#2457d6"/>
  <rect x="582" y="78" width="342" height="24" rx="4" fill="#ffffff" stroke="#2457d6"/>
  <text x="753" y="94" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Регістр TEON (команда 0x35)</text>
  <text x="586" y="118" font-size="12" font-weight="bold" fill="#1a1a1a">• Режим 1 (V-Blank Only, параметр 0x00):</text>
  <text x="598" y="134" font-size="12" fill="#6b7280">Вивід TE генерує імпульс HIGH лише під час V-Blank.</text>
  <text x="586" y="152" font-size="12" font-weight="bold" fill="#2457d6">• Частота та тривалість:</text>
  <text x="598" y="168" font-size="12" fill="#1a1a1a">T_frame ≈ 16.6 мс (60 Гц), імпульс V-Blank ≈ 0.8 мс.</text>

  <!-- Картка 2: EXTI переривання -->
  <rect x="570" y="198" width="366" height="132" rx="8" fill="#e9f7ef" stroke="#27ae60"/>
  <rect x="582" y="208" width="342" height="24" rx="4" fill="#ffffff" stroke="#27ae60"/>
  <text x="753" y="225" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">2. Архітектура конвеєра з EXTI</text>
  <text x="586" y="248" font-size="12" font-weight="bold" fill="#1a1a1a">• Зовнішнє переривання по лінії TE:</text>
  <text x="598" y="266" font-size="12" fill="#6b7280">МК конфігурує EXTI на висхідний фронт (Rising Edge).</text>
  <text x="586" y="286" font-size="12" font-weight="bold" fill="#27ae60">• Обробник переривання ISR:</text>
  <text x="598" y="304" font-size="12" fill="#1a1a1a">void EXTI_IRQHandler() &#123; start_dma_transfer(); &#125;</text>
  <text x="598" y="320" font-size="12" font-weight="bold" fill="#27ae60">Нульовий джиттер запуску відносно кадру!</text>

  <!-- Картка 3: Умови без розриву -->
  <rect x="570" y="344" width="366" height="100" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>
  <rect x="582" y="354" width="342" height="22" rx="4" fill="#ffffff" stroke="#1a1a1a"/>
  <text x="753" y="370" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3. Розрахунок пропускної здатності</text>
  <text x="586" y="390" font-size="12" font-weight="bold" fill="#1a1a1a">• Об'єм кадру: 240 × 240 × 2 = 115 200 байтів</text>
  <text x="598" y="406" font-size="12" fill="#6b7280">При SPI 50 МГц: час запису T_write = 18.4 мс.</text>
  <text x="586" y="422" font-size="12" font-weight="bold" fill="#2457d6">• Частковий флеш (Partial Window Update):</text>
  <text x="598" y="438" font-size="12" fill="#1a1a1a">Оновлення зони 240×80 займає лише 6.1 мс &lt;&lt; 16.6 мс!</text>
</svg>
