<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Колізія на спільній шині SPI при заземленому контакті CS</text>
  <text x="480" y="62" font-size="13" fill="#6b7280" text-anchor="middle">ST7789 без вибору кристала паразитно зчитує чужі такти й спотворює лічильник байтів</text>

  <!-- СЕКЦІЯ 1: Топологія підключення пристроїв -->
  <!-- Блок 1: Мікроконтролер (Master) -->
  <rect x="30" y="78" width="230" height="74" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="42" y="98" font-size="13" font-weight="bold" fill="#1a1a1a">Мікроконтролер (Master)</text>
  <text x="42" y="118" font-size="11" fill="#2457d6">Спільні лінії: SCK, MOSI</text>
  <text x="42" y="136" font-size="11" fill="#27ae60">Керований GPIO: CS_SD</text>

  <!-- Шина між MCU та SD-картою -->
  <line x1="260" y1="100" x2="371" y2="100" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="315" y="93" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="middle">SCK, MOSI</text>
  <line x1="260" y1="132" x2="371" y2="132" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="315" y="125" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">CS_SD (активний 0)</text>

  <!-- Блок 2: SD-карта (Slave 1) -->
  <rect x="380" y="78" width="210" height="74" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="392" y="98" font-size="13" font-weight="bold" fill="#27ae60">SD-карта (Slave 1)</text>
  <text x="392" y="118" font-size="11" fill="#1a1a1a">CS_SD = 0 -> сеанс читання 512 Б</text>
  <text x="392" y="136" font-size="11" fill="#6b7280">CS_SD = 1 -> шина звільнена</text>

  <!-- Шина між SD-картою та ST7789 -->
  <line x1="590" y1="100" x2="696" y2="100" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="647" y="93" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="middle">Спільні SCK, MOSI</text>
  <text x="647" y="125" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">CS не виведено на роз'єм!</text>
  <text x="647" y="138" font-size="10" fill="#6b7280" text-anchor="middle">на платі лише 7 контактів</text>

  <!-- Блок 3: ST7789 (Slave 2) -->
  <rect x="705" y="78" width="225" height="74" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="717" y="98" font-size="13" font-weight="bold" fill="#c0392b">ST7789 1.3″ (Slave 2)</text>
  <text x="717" y="118" font-size="11" font-weight="bold" fill="#c0392b">⚠️ CS = GND (заземлений!)</text>
  <text x="717" y="136" font-size="11" fill="#1a1a1a">Завжди активний приймач</text>

  <!-- СЕКЦІЯ 2: Часова діаграма -->
  <!-- Тло діаграми -->
  <rect x="30" y="166" width="900" height="248" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Підсвічування активного вікна транзакції SD -->
  <rect x="270" y="166" width="495" height="248" fill="#ffffff" fill-opacity="0.6"/>

  <!-- Вертикальні розділювачі -->
  <line x1="160" y1="166" x2="160" y2="414" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="270" y1="166" x2="270" y2="414" stroke="#c0392b" stroke-dasharray="4,4" stroke-width="1.2"/>
  <line x1="765" y1="166" x2="765" y2="414" stroke="#c0392b" stroke-dasharray="4,4" stroke-width="1.2"/>

  <!-- Заголовки фаз -->
  <text x="95" y="183" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="middle">Сигнал / Фаза</text>
  <text x="215" y="183" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="middle">1. Пауза шини</text>
  <text x="517" y="183" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">2. Сеанс читання SD-карти: 512 байтів (чужі такти для дисплея)</text>
  <text x="847" y="183" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="middle">3. Кінець сеансу</text>

  <!-- РЯДОК 1: CS_SD -->
  <text x="42" y="210" font-size="12" font-weight="bold" fill="#27ae60">CS_SD</text>
  <text x="42" y="224" font-size="10" fill="#6b7280">вибір SD</text>

  <path d="M 168 200 H 270 V 224 H 765 V 200 H 922" fill="none" stroke="#27ae60" stroke-width="2"/>
  <text x="215" y="195" font-size="10" fill="#27ae60" text-anchor="middle">3.3 В (SD спить)</text>
  <text x="517" y="217" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Рівень 0 В: SD-карта активована мікроконтролером</text>
  <text x="847" y="195" font-size="10" fill="#27ae60" text-anchor="middle">3.3 В (SD вільна)</text>

  <!-- РЯДОК 2: CS_ST7789 -->
  <text x="42" y="250" font-size="12" font-weight="bold" fill="#c0392b">CS_ST7789</text>
  <text x="42" y="264" font-size="10" fill="#c0392b">вибір дисплея</text>

  <line x1="168" y1="264" x2="922" y2="264" stroke="#c0392b" stroke-width="2.5"/>
  <text x="215" y="255" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">0 В (GND)</text>
  <text x="517" y="255" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">⚠️ CS жорстко на GND! Постійно 0 В — дисплей неможливо вимкнути з шини</text>
  <text x="847" y="255" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">0 В (GND)</text>

  <!-- РЯДОК 3: SCK -->
  <text x="42" y="292" font-size="12" font-weight="bold" fill="#2457d6">SCK</text>
  <text x="42" y="306" font-size="10" fill="#6b7280">тактовий сигнал</text>

  <path d="M 168 308 H 270
           V 286 H 276 V 308 H 282
           V 286 H 288 V 308 H 294
           V 286 H 300 V 308 H 306
           V 286 H 312 V 308 H 318
           V 286 H 324 V 308 H 330
           V 286 H 336 V 308 H 342
           V 286 H 348 V 308 H 354
           V 286 H 360 V 308 H 366
           H 390"
        fill="none" stroke="#2457d6" stroke-width="1.8"/>

  <text x="517" y="295" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">... 4096 тактових імпульсів SPI (512 байт × 8 біт) ...</text>
  <line x1="395" y1="308" x2="640" y2="308" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4"/>

  <path d="M 645 308 H 668
           V 286 H 674 V 308 H 680
           V 286 H 686 V 308 H 692
           V 286 H 698 V 308 H 704
           V 286 H 710 V 308 H 716
           V 286 H 722 V 308 H 728
           V 286 H 734 V 308 H 740
           V 286 H 746 V 308 H 752
           V 286 H 758 V 308 H 765
           H 922"
        fill="none" stroke="#2457d6" stroke-width="1.8"/>
  <text x="215" y="303" font-size="10" fill="#6b7280" text-anchor="middle">Тиша (0 В)</text>
  <text x="847" y="303" font-size="10" fill="#6b7280" text-anchor="middle">Тиша (0 В)</text>

  <!-- РЯДОК 4: MOSI -->
  <text x="42" y="336" font-size="12" font-weight="bold" fill="#2457d6">MOSI</text>
  <text x="42" y="350" font-size="10" fill="#6b7280">лінія даних</text>

  <line x1="168" y1="337" x2="270" y2="337" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="215" y="331" font-size="10" fill="#6b7280" text-anchor="middle">Лінія вільна</text>

  <rect x="274" y="324" width="84" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="316" y="341" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="middle">CMD17 (6 Б)</text>

  <rect x="372" y="324" width="300" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="522" y="341" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="middle">Дані SD-карти: блок 512 байтів</text>

  <rect x="686" y="324" width="72" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="722" y="341" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="middle">CRC16</text>

  <line x1="765" y1="337" x2="922" y2="337" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="847" y="331" font-size="10" fill="#6b7280" text-anchor="middle">Лінія вільна</text>

  <!-- РЯДОК 5: Стан ST7789 -->
  <text x="42" y="380" font-size="12" font-weight="bold" fill="#c0392b">ST7789 стан</text>
  <text x="42" y="394" font-size="10" fill="#6b7280">зсувний регістр</text>

  <rect x="168" y="366" width="92" height="36" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="214" y="381" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="middle">Очікування</text>
  <text x="214" y="394" font-size="10" fill="#6b7280" text-anchor="middle">16-біт RGB</text>

  <rect x="274" y="366" width="484" height="36" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="516" y="381" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">⚠️ Паразитно зчитує 512 байтів даних SD -> десинхронізація лічильника пікселів</text>
  <text x="516" y="395" font-size="10" fill="#c0392b" text-anchor="middle">Зсувний регістр збиває 16-бітну фазу байтів; хибні команди та хаос у GRAM</text>

  <rect x="772" y="366" width="150" height="36" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="847" y="381" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="middle">Збій адресації GRAM</text>
  <text x="847" y="394" font-size="10" fill="#c0392b" text-anchor="middle">артефакти та «сніг»</text>

  <!-- СЕКЦІЯ 3: Підсумковий висновок -->
  <rect x="30" y="426" width="900" height="32" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="45" y="446" font-size="11" font-weight="bold" fill="#c0392b">Апаратний наслідок:</text>
  <text x="175" y="446" font-size="11" fill="#1a1a1a">Шина SPI не має адрес. Без фронту CS дисплей не скидає лічильник байтів і безперервно зчитує чужий трафік.</text>
</svg>
