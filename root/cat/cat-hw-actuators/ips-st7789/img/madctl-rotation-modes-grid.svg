<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Режими орієнтації координатної сітки ST7789 у регістрі MADCTL (0x36)</text>
  <text x="480" y="54" font-size="13" text-anchor="middle" fill="#6b7280">Поворот сітки на кожні 90° задається обміном осей (MV) та інверсією напрямків (MY, MX)</text>

  <!-- ==================== КАРТКА 1: 0° ==================== -->
  <rect x="24" y="70" width="447" height="216" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Фізичні осі зовні екрана -->
  <text x="132" y="88" font-size="12" text-anchor="middle" fill="#6b7280">Col 0 → 239</text>
  <line x1="84" y1="94" x2="180" y2="94" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="58" y="114" font-size="12" text-anchor="end" fill="#6b7280">Row 0</text>
  <line x1="64" y1="120" x2="64" y2="212" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="58" y="222" font-size="12" text-anchor="end" fill="#6b7280">239</text>

  <!-- Фізичний екран -->
  <rect x="72" y="104" width="120" height="120" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="1"/>
  <rect x="82" y="114" width="100" height="100" rx="2" fill="#ffffff"/>
  <!-- Шлейф FPC -->
  <rect x="112" y="224" width="40" height="6" rx="1" fill="#d97706" stroke="#b45309" stroke-width="1"/>
  <text x="132" y="244" font-size="12" text-anchor="middle" fill="#6b7280">FPC (низ)</text>

  <!-- Сітка та гліф 'F' в центрі -->
  <line x1="84" y1="164" x2="180" y2="164" stroke="#f1f5f9" stroke-dasharray="2 2"/>
  <line x1="132" y1="116" x2="132" y2="212" stroke="#f1f5f9" stroke-dasharray="2 2"/>
  <!-- Гліф 'F' (0° нормальний) -->
  <path d="M 124,152 L 142,152 L 142,157 L 129,157 L 129,162 L 139,162 L 139,167 L 129,167 L 129,178 L 124,178 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Логічні осі (0°) -->
  <circle cx="92" cy="124" r="4" fill="#2457d6" stroke="#ffffff" stroke-width="1.5"/>
  <text x="98" y="138" font-size="12" font-weight="bold" fill="#2457d6">(0,0)</text>
  <line x1="92" y1="124" x2="168" y2="124" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="168" y="140" font-size="12" font-weight="bold" fill="#2457d6">X</text>
  <line x1="92" y1="124" x2="92" y2="200" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="100" y="202" font-size="12" font-weight="bold" fill="#2457d6">Y</text>

  <!-- Інформаційна панель праворуч -->
  <text x="228" y="92" font-size="15" font-weight="bold" fill="#1a1a1a">0° · Портретна (норма)</text>
  <rect x="228" y="104" width="126" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="291" y="120" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">MADCTL = 0x00</text>

  <!-- Біти -->
  <rect x="228" y="134" width="68" height="22" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="262" y="150" font-size="12" text-anchor="middle" fill="#6b7280">MY = 0</text>
  <rect x="304" y="134" width="68" height="22" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="338" y="150" font-size="12" text-anchor="middle" fill="#6b7280">MX = 0</text>
  <rect x="380" y="134" width="68" height="22" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="414" y="150" font-size="12" text-anchor="middle" fill="#6b7280">MV = 0</text>

  <text x="228" y="174" font-size="12" fill="#1a1a1a">• MY=0: рядки згори вниз</text>
  <text x="228" y="192" font-size="12" fill="#1a1a1a">• MX=0: стовпці зліва направо</text>
  <text x="228" y="210" font-size="12" fill="#1a1a1a">• MV=0: без обміну (X=Col, Y=Row)</text>

  <line x1="228" y1="226" x2="228" y2="260" stroke="#2457d6" stroke-width="2.5" stroke-linecap="round"/>
  <text x="236" y="238" font-size="12" font-weight="bold" fill="#2457d6">Початок (0, 0): верхній лівий</text>
  <text x="236" y="258" font-size="12" fill="#6b7280">Осі: X → праворуч, Y ↓ донизу</text>


  <!-- ==================== КАРТКА 2: 90° ==================== -->
  <rect x="489" y="70" width="447" height="216" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Фізичні осі зовні екрана -->
  <text x="597" y="88" font-size="12" text-anchor="middle" fill="#6b7280">Col 0 → 239</text>
  <line x1="549" y1="94" x2="645" y2="94" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="523" y="114" font-size="12" text-anchor="end" fill="#6b7280">Row 0</text>
  <line x1="529" y1="120" x2="529" y2="212" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="523" y="222" font-size="12" text-anchor="end" fill="#6b7280">239</text>

  <!-- Фізичний екран -->
  <rect x="537" y="104" width="120" height="120" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="1"/>
  <rect x="547" y="114" width="100" height="100" rx="2" fill="#ffffff"/>
  <!-- Шлейф FPC -->
  <rect x="577" y="224" width="40" height="6" rx="1" fill="#d97706" stroke="#b45309" stroke-width="1"/>
  <text x="597" y="244" font-size="12" text-anchor="middle" fill="#6b7280">FPC (низ)</text>

  <!-- Сітка та гліф 'F' в центрі (повернутий на 90° за годинниковою) -->
  <line x1="549" y1="164" x2="645" y2="164" stroke="#f1f5f9" stroke-dasharray="2 2"/>
  <line x1="597" y1="116" x2="597" y2="212" stroke="#f1f5f9" stroke-dasharray="2 2"/>
  <!-- Гліф 'F' (90° CW) -->
  <path d="M 611,156 L 611,174 L 606,174 L 606,161 L 601,161 L 601,171 L 596,171 L 596,161 L 585,161 L 585,156 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Логічні осі (90°) -->
  <circle cx="637" cy="124" r="4" fill="#2457d6" stroke="#ffffff" stroke-width="1.5"/>
  <text x="631" y="138" font-size="12" font-weight="bold" text-anchor="end" fill="#2457d6">(0,0)</text>
  <line x1="637" y1="124" x2="637" y2="200" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="623" y="202" font-size="12" font-weight="bold" text-anchor="end" fill="#2457d6">X</text>
  <line x1="637" y1="124" x2="561" y2="124" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="561" y="140" font-size="12" font-weight="bold" fill="#2457d6">Y</text>

  <!-- Інформаційна панель праворуч -->
  <text x="693" y="92" font-size="15" font-weight="bold" fill="#1a1a1a">90° · Альбомна (за годинниковою)</text>
  <rect x="693" y="104" width="126" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="756" y="120" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">MADCTL = 0x60</text>

  <!-- Біти -->
  <rect x="693" y="134" width="68" height="22" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="727" y="150" font-size="12" text-anchor="middle" fill="#6b7280">MY = 0</text>
  <rect x="769" y="134" width="68" height="22" rx="4" fill="#2457d6" stroke="#2457d6" stroke-width="1"/>
  <text x="803" y="150" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">MX = 1</text>
  <rect x="845" y="134" width="68" height="22" rx="4" fill="#2457d6" stroke="#2457d6" stroke-width="1"/>
  <text x="879" y="150" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">MV = 1</text>

  <text x="693" y="174" font-size="12" fill="#1a1a1a">• MY=0: рядки згори вниз</text>
  <text x="693" y="192" font-size="12" fill="#1a1a1a">• MX=1: стовпці справа наліво</text>
  <text x="693" y="210" font-size="12" fill="#1a1a1a">• MV=1: обмін осей (X=Row, Y=Col)</text>

  <line x1="693" y1="226" x2="693" y2="260" stroke="#2457d6" stroke-width="2.5" stroke-linecap="round"/>
  <text x="701" y="238" font-size="12" font-weight="bold" fill="#2457d6">Початок (0, 0): верхній правий</text>
  <text x="701" y="258" font-size="12" fill="#6b7280">Осі: X ↓ донизу, Y ← ліворуч</text>


  <!-- ==================== КАРТКА 3: 180° ==================== -->
  <rect x="24" y="302" width="447" height="216" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Фізичні осі зовні екрана -->
  <text x="132" y="320" font-size="12" text-anchor="middle" fill="#6b7280">Col 0 → 239</text>
  <line x1="84" y1="326" x2="180" y2="326" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="58" y="346" font-size="12" text-anchor="end" fill="#6b7280">Row 0</text>
  <line x1="64" y1="352" x2="64" y2="444" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="58" y="454" font-size="12" text-anchor="end" fill="#6b7280">239</text>

  <!-- Фізичний екран -->
  <rect x="72" y="336" width="120" height="120" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="1"/>
  <rect x="82" y="346" width="100" height="100" rx="2" fill="#ffffff"/>
  <!-- Шлейф FPC -->
  <rect x="112" y="456" width="40" height="6" rx="1" fill="#d97706" stroke="#b45309" stroke-width="1"/>
  <text x="132" y="476" font-size="12" text-anchor="middle" fill="#6b7280">FPC (низ)</text>

  <!-- Сітка та гліф 'F' в центрі (повернутий на 180°) -->
  <line x1="84" y1="396" x2="180" y2="396" stroke="#f1f5f9" stroke-dasharray="2 2"/>
  <line x1="132" y1="348" x2="132" y2="444" stroke="#f1f5f9" stroke-dasharray="2 2"/>
  <!-- Гліф 'F' (180°) -->
  <path d="M 140,404 L 122,404 L 122,399 L 135,399 L 135,394 L 125,394 L 125,389 L 135,389 L 135,378 L 140,378 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Логічні осі (180°) -->
  <circle cx="172" cy="436" r="4" fill="#2457d6" stroke="#ffffff" stroke-width="1.5"/>
  <text x="166" y="422" font-size="12" font-weight="bold" text-anchor="end" fill="#2457d6">(0,0)</text>
  <line x1="172" y1="436" x2="96" y2="436" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="96" y="424" font-size="12" font-weight="bold" fill="#2457d6">X</text>
  <line x1="172" y1="436" x2="172" y2="360" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="158" y="368" font-size="12" font-weight="bold" text-anchor="end" fill="#2457d6">Y</text>

  <!-- Інформаційна панель праворуч -->
  <text x="228" y="324" font-size="15" font-weight="bold" fill="#1a1a1a">180° · Перевернута (портрет)</text>
  <rect x="228" y="336" width="126" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="291" y="352" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">MADCTL = 0xC0</text>

  <!-- Біти -->
  <rect x="228" y="366" width="68" height="22" rx="4" fill="#2457d6" stroke="#2457d6" stroke-width="1"/>
  <text x="262" y="382" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">MY = 1</text>
  <rect x="304" y="366" width="68" height="22" rx="4" fill="#2457d6" stroke="#2457d6" stroke-width="1"/>
  <text x="338" y="382" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">MX = 1</text>
  <rect x="380" y="366" width="68" height="22" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="414" y="382" font-size="12" text-anchor="middle" fill="#6b7280">MV = 0</text>

  <text x="228" y="406" font-size="12" fill="#1a1a1a">• MY=1: рядки знизу вгору</text>
  <text x="228" y="424" font-size="12" fill="#1a1a1a">• MX=1: стовпці справа наліво</text>
  <text x="228" y="442" font-size="12" fill="#1a1a1a">• MV=0: без обміну (X=Col, Y=Row)</text>

  <line x1="228" y1="458" x2="228" y2="492" stroke="#2457d6" stroke-width="2.5" stroke-linecap="round"/>
  <text x="236" y="470" font-size="12" font-weight="bold" fill="#2457d6">Початок (0, 0): нижній правий</text>
  <text x="236" y="490" font-size="12" fill="#6b7280">Осі: X ← ліворуч, Y ↑ догори</text>


  <!-- ==================== КАРТКА 4: 270° ==================== -->
  <rect x="489" y="302" width="447" height="216" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Фізичні осі зовні екрана -->
  <text x="597" y="320" font-size="12" text-anchor="middle" fill="#6b7280">Col 0 → 239</text>
  <line x1="549" y1="326" x2="645" y2="326" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="523" y="346" font-size="12" text-anchor="end" fill="#6b7280">Row 0</text>
  <line x1="529" y1="352" x2="529" y2="444" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="523" y="454" font-size="12" text-anchor="end" fill="#6b7280">239</text>

  <!-- Фізичний екран -->
  <rect x="537" y="336" width="120" height="120" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="1"/>
  <rect x="547" y="346" width="100" height="100" rx="2" fill="#ffffff"/>
  <!-- Шлейф FPC -->
  <rect x="577" y="456" width="40" height="6" rx="1" fill="#d97706" stroke="#b45309" stroke-width="1"/>
  <text x="597" y="476" font-size="12" text-anchor="middle" fill="#6b7280">FPC (низ)</text>

  <!-- Сітка та гліф 'F' в центрі (повернутий на 270° CW / 90° CCW) -->
  <line x1="549" y1="396" x2="645" y2="396" stroke="#f1f5f9" stroke-dasharray="2 2"/>
  <line x1="597" y1="348" x2="597" y2="444" stroke="#f1f5f9" stroke-dasharray="2 2"/>
  <!-- Гліф 'F' (270° CW) -->
  <path d="M 583,398 L 583,380 L 588,380 L 588,393 L 593,393 L 593,383 L 598,383 L 598,393 L 609,393 L 609,398 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Логічні осі (270°) -->
  <circle cx="557" cy="436" r="4" fill="#2457d6" stroke="#ffffff" stroke-width="1.5"/>
  <text x="563" y="422" font-size="12" font-weight="bold" fill="#2457d6">(0,0)</text>
  <line x1="557" y1="436" x2="557" y2="360" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="565" y="368" font-size="12" font-weight="bold" fill="#2457d6">X</text>
  <line x1="557" y1="436" x2="633" y2="436" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="633" y="424" font-size="12" font-weight="bold" fill="#2457d6">Y</text>

  <!-- Інформаційна панель праворуч -->
  <text x="693" y="324" font-size="15" font-weight="bold" fill="#1a1a1a">270° · Альбомна (проти стрілки)</text>
  <rect x="693" y="336" width="126" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="756" y="352" font-size="12" font-weight="bold" text-anchor="middle" fill="#2457d6">MADCTL = 0xA0</text>

  <!-- Біти -->
  <rect x="693" y="366" width="68" height="22" rx="4" fill="#2457d6" stroke="#2457d6" stroke-width="1"/>
  <text x="727" y="382" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">MY = 1</text>
  <rect x="769" y="366" width="68" height="22" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="803" y="382" font-size="12" text-anchor="middle" fill="#6b7280">MX = 0</text>
  <rect x="845" y="366" width="68" height="22" rx="4" fill="#2457d6" stroke="#2457d6" stroke-width="1"/>
  <text x="879" y="382" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">MV = 1</text>

  <text x="693" y="406" font-size="12" fill="#1a1a1a">• MY=1: рядки знизу вгору</text>
  <text x="693" y="424" font-size="12" fill="#1a1a1a">• MX=0: стовпці зліва направо</text>
  <text x="693" y="442" font-size="12" fill="#1a1a1a">• MV=1: обмін осей (X=Row, Y=Col)</text>

  <line x1="693" y1="458" x2="693" y2="492" stroke="#2457d6" stroke-width="2.5" stroke-linecap="round"/>
  <text x="701" y="470" font-size="12" font-weight="bold" fill="#2457d6">Початок (0, 0): нижній лівий</text>
  <text x="701" y="490" font-size="12" fill="#6b7280">Осі: X ↑ догори, Y → праворуч</text>
</svg>
