<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-rev-gray" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Форма тактового сигналу SPI: пасивний подільник проти буфера 74LVC245</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Паразитна ємність лінії затягує RC-фронти: на 40 МГц подільник зриває тактування ST7789</text>

  <!-- Ліва панель: Пасивний подільник -->
  <rect x="24" y="80" width="444" height="378" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Шапка лівої панелі -->
  <rect x="38" y="92" width="416" height="40" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="50" y="108" font-size="13" font-weight="bold" fill="#c0392b">Пасивний резистивний подільник (1 кОм / 2 кОм)</text>
  <text x="50" y="124" font-size="12" fill="#6b7280">R_вих ≈ 667 Ом · C_нав ≈ 25 пФ · постійна часу τ = R·C ≈ 17 нс</text>

  <!-- Осцилограма 1: 10 МГц -->
  <rect x="38" y="144" width="416" height="116" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="160" font-size="12" font-weight="bold" fill="#1a1a1a">10 МГц (T = 100 нс)</text>
  <text x="442" y="160" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">tr ≈ 37 нс · межа норми</text>

  <text x="88" y="180" text-anchor="end" font-size="12" fill="#6b7280">3.3В</text>
  <text x="88" y="198" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">V_IH</text>
  <text x="88" y="240" text-anchor="end" font-size="12" fill="#6b7280">0.0В</text>

  <line x1="94" y1="176" x2="442" y2="176" stroke="#d0d7de" stroke-dasharray="2,2"/>
  <line x1="94" y1="194" x2="442" y2="194" stroke="#c0392b" stroke-dasharray="3,3" stroke-width="1.2"/>
  <line x1="94" y1="236" x2="442" y2="236" stroke="#d0d7de" stroke-width="1"/>

  <path d="M 100 236 C 118 190, 144 179, 184 179 C 202 225, 228 236, 268 233 C 286 190, 312 179, 352 179 C 370 225, 396 236, 436 233" stroke="#2457d6" stroke-width="2.5" fill="none"/>

  <line x1="100" y1="236" x2="100" y2="254" stroke="#d0d7de" stroke-dasharray="2,2"/>
  <line x1="268" y1="236" x2="268" y2="254" stroke="#d0d7de" stroke-dasharray="2,2"/>
  <line x1="102" y1="250" x2="142" y2="250" stroke="#6b7280" marker-start="url(#arr-rev-gray)"/>
  <text x="184" y="254" text-anchor="middle" font-size="12" fill="#6b7280">T = 100 нс</text>
  <line x1="226" y1="250" x2="266" y2="250" stroke="#6b7280" marker-end="url(#arr-gray)"/>
  <text x="352" y="254" text-anchor="middle" font-size="12" fill="#2457d6">Розмах ≈ 3.2 В &gt; V_IH</text>

  <!-- Осцилограма 2: 40 МГц -->
  <rect x="38" y="272" width="416" height="116" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="288" font-size="12" font-weight="bold" fill="#1a1a1a">40 МГц (T = 25 нс)</text>
  <text x="442" y="288" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">V_max &lt; V_IH — зрив SPI!</text>

  <text x="88" y="308" text-anchor="end" font-size="12" fill="#6b7280">3.3В</text>
  <text x="88" y="326" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">V_IH</text>
  <text x="88" y="368" text-anchor="end" font-size="12" fill="#6b7280">0.0В</text>

  <line x1="94" y1="304" x2="442" y2="304" stroke="#d0d7de" stroke-dasharray="2,2"/>
  <line x1="94" y1="322" x2="442" y2="322" stroke="#c0392b" stroke-dasharray="3,3" stroke-width="1.2"/>
  <line x1="94" y1="364" x2="442" y2="364" stroke="#d0d7de" stroke-width="1"/>

  <path d="M 100 344 C 114 335, 128 331, 142 331 C 156 340, 170 344, 184 344 C 198 335, 212 331, 226 331 C 240 340, 254 344, 268 344 C 282 335, 296 331, 310 331 C 324 340, 338 344, 352 344 C 366 335, 380 331, 394 331 C 408 340, 422 344, 436 344" stroke="#c0392b" stroke-width="2.5" fill="none"/>

  <line x1="100" y1="364" x2="100" y2="382" stroke="#d0d7de" stroke-dasharray="2,2"/>
  <line x1="184" y1="364" x2="184" y2="382" stroke="#d0d7de" stroke-dasharray="2,2"/>
  <line x1="102" y1="378" x2="114" y2="378" stroke="#6b7280" marker-start="url(#arr-rev-gray)"/>
  <text x="142" y="382" text-anchor="middle" font-size="12" fill="#6b7280">T = 25 нс</text>
  <line x1="170" y1="378" x2="182" y2="378" stroke="#6b7280" marker-end="url(#arr-gray)"/>
  <text x="310" y="382" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Пилкоподібний: V_max ≈ 1.8 В &lt; V_IH</text>

  <!-- Підсумок лівої панелі -->
  <rect x="38" y="400" width="416" height="44" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="50" y="418" font-size="12" font-weight="bold" fill="#c0392b">Підсумок: подільник непридатний для 40 МГц</text>
  <text x="50" y="435" font-size="12" fill="#6b7280">Через затягнуті фронти тактовий сигнал втрачається (збій)</text>

  <!-- Права панель: Активний буфер -->
  <rect x="492" y="80" width="444" height="378" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Шапка правої панелі -->
  <rect x="506" y="92" width="416" height="40" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="518" y="108" font-size="13" font-weight="bold" fill="#27ae60">Активний транслятор рівнів 74LVC245 (Push-Pull)</text>
  <text x="518" y="124" font-size="12" fill="#6b7280">R_вих ≈ 30 Ом · потужний драйвер · фронти перемикання tr &lt; 2 нс</text>

  <!-- Осцилограма 1: 10 МГц -->
  <rect x="506" y="144" width="416" height="116" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="518" y="160" font-size="12" font-weight="bold" fill="#1a1a1a">10 МГц (T = 100 нс)</text>
  <text x="910" y="160" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">tr &lt; 2 нс · ідеальний прямокутник</text>

  <text x="556" y="180" text-anchor="end" font-size="12" fill="#6b7280">3.3В</text>
  <text x="556" y="198" text-anchor="end" font-size="12" fill="#27ae60">V_IH</text>
  <text x="556" y="240" text-anchor="end" font-size="12" fill="#6b7280">0.0В</text>

  <line x1="562" y1="176" x2="910" y2="176" stroke="#d0d7de" stroke-dasharray="2,2"/>
  <line x1="562" y1="194" x2="910" y2="194" stroke="#27ae60" stroke-dasharray="3,3" stroke-width="1.2"/>
  <line x1="562" y1="236" x2="910" y2="236" stroke="#d0d7de" stroke-width="1"/>

  <path d="M 568 236 L 572 176 L 650 176 L 654 236 L 736 236 L 740 176 L 818 176 L 822 236 L 904 236" stroke="#27ae60" stroke-width="2.5" fill="none"/>

  <line x1="568" y1="236" x2="568" y2="254" stroke="#d0d7de" stroke-dasharray="2,2"/>
  <line x1="736" y1="236" x2="736" y2="254" stroke="#d0d7de" stroke-dasharray="2,2"/>
  <line x1="570" y1="250" x2="610" y2="250" stroke="#6b7280" marker-start="url(#arr-rev-gray)"/>
  <text x="652" y="254" text-anchor="middle" font-size="12" fill="#6b7280">T = 100 нс</text>
  <line x1="694" y1="250" x2="734" y2="250" stroke="#6b7280" marker-end="url(#arr-gray)"/>
  <text x="820" y="254" text-anchor="middle" font-size="12" fill="#27ae60">Розмах = 3.3 В (запас)</text>

  <!-- Осцилограма 2: 40 МГц -->
  <rect x="506" y="272" width="416" height="116" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="518" y="288" font-size="12" font-weight="bold" fill="#1a1a1a">40 МГц (T = 25 нс)</text>
  <text x="910" y="288" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">Повний розмах 3.3 В · стабільно</text>

  <text x="556" y="308" text-anchor="end" font-size="12" fill="#6b7280">3.3В</text>
  <text x="556" y="326" text-anchor="end" font-size="12" fill="#27ae60">V_IH</text>
  <text x="556" y="368" text-anchor="end" font-size="12" fill="#6b7280">0.0В</text>

  <line x1="562" y1="304" x2="910" y2="304" stroke="#d0d7de" stroke-dasharray="2,2"/>
  <line x1="562" y1="322" x2="910" y2="322" stroke="#27ae60" stroke-dasharray="3,3" stroke-width="1.2"/>
  <line x1="562" y1="364" x2="910" y2="364" stroke="#d0d7de" stroke-width="1"/>

  <path d="M 568 364 L 574 304 L 608 304 L 614 364 L 652 364 L 658 304 L 692 304 L 698 364 L 736 364 L 742 304 L 776 304 L 782 364 L 820 364 L 826 304 L 860 304 L 866 364 L 904 364" stroke="#27ae60" stroke-width="2.5" fill="none"/>

  <line x1="568" y1="364" x2="568" y2="382" stroke="#d0d7de" stroke-dasharray="2,2"/>
  <line x1="652" y1="364" x2="652" y2="382" stroke="#d0d7de" stroke-dasharray="2,2"/>
  <line x1="570" y1="378" x2="582" y2="378" stroke="#6b7280" marker-start="url(#arr-rev-gray)"/>
  <text x="610" y="382" text-anchor="middle" font-size="12" fill="#6b7280">T = 25 нс</text>
  <line x1="638" y1="378" x2="650" y2="378" stroke="#6b7280" marker-end="url(#arr-gray)"/>
  <text x="778" y="382" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Розмах = 3.3 В, круті перепади</text>

  <!-- Підсумок правої панелі -->
  <rect x="506" y="400" width="416" height="44" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="518" y="418" font-size="12" font-weight="bold" fill="#27ae60">Підсумок: буфер гарантує надійність на 40+ МГц</text>
  <text x="518" y="435" font-size="12" fill="#6b7280">Круті фронти зберігають форму такту, виключаючи збої ST7789</text>
</svg>
