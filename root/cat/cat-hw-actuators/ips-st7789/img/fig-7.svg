<svg viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-blue-rev" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
    </marker>
  </defs>
  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Спотворення тактового сигналу SPI (10 МГц) резистивним дільником</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Паразитна ємність та опір дільника завалюють фронти й блокують перемикання тригера Шмітта</text>
  <!-- Ліва панель: Еквівалентна схема та розрахунки -->
  <rect x="24" y="72" width="272" height="368" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="160" y="94" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Еквівалентна RC-схема дільника</text>
  <!-- Схема дільника -->
  <rect x="36" y="106" width="248" height="134" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <rect x="44" y="118" width="46" height="24" rx="3" fill="#f4f6f8" stroke="#6b7280" stroke-width="1"/>
  <text x="67" y="134" font-size="12" fill="#1a1a1a" text-anchor="middle">MCU</text>
  <text x="67" y="156" font-size="12" fill="#6b7280" text-anchor="middle">5 В</text>
  <line x1="90" y1="130" x2="110" y2="130" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="110" y="122" width="36" height="16" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="128" y="135" font-size="12" fill="#1a1a1a" text-anchor="middle">R1</text>
  <line x1="146" y1="130" x2="170" y2="130" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="170" cy="130" r="3" fill="#1a1a1a"/>
  <line x1="170" y1="130" x2="214" y2="130" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="214" y="114" width="62" height="46" rx="4" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.2"/>
  <text x="245" y="131" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ST7789</text>
  <text x="245" y="147" font-size="12" fill="#1a1a1a" text-anchor="middle">SCK</text>
  <text x="245" y="176" font-size="12" fill="#1a1a1a" text-anchor="middle">Тригер</text>
  <text x="245" y="192" font-size="12" fill="#1a1a1a" text-anchor="middle">Шмітта</text>
