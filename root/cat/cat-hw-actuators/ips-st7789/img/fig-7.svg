  <!-- Трек 2: Логічний сигнал після тригера Шмітта -->
  <text x="326" y="254" font-size="12" font-weight="bold" fill="#1a1a1a">2. Логічний рівень на виході тригера Шмітта (внутрішній CLK)</text>
  <text x="422" y="280" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">Буфер</text>
