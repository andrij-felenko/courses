  <rect x="36" y="254" width="248" height="80" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="46" y="272" font-size="12" font-weight="bold" fill="#2457d6">Низькоомний: R1=1к, R2=2к</text>
  <text x="46" y="290" font-size="12" fill="#1a1a1a">R_екв = 667 Ом, C_екв = 30 пФ</text>
  <text x="46" y="308" font-size="12" fill="#1a1a1a">τ = 20 нс (затримка Δt = 19 нс)</text>
  <text x="46" y="324" font-size="12" font-weight="bold" fill="#27ae60">✓ Працює, але звужує строб</text>
  <!-- Картка 2: Високоомний дільник -->
  <rect x="36" y="348" width="248" height="80" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
