  <line x1="188" y1="177" x2="188" y2="206" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="152" y1="206" x2="188" y2="206" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="170" y1="206" x2="170" y2="214" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="162" y1="214" x2="178" y2="214" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="165" y1="217" x2="175" y2="217" stroke="#1a1a1a" stroke-width="1.2"/>
