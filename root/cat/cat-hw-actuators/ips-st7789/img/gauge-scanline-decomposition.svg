<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Розкладання циферблата індикатора на рядки (Scanline Decomposition)</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">Генерація 240 пікселів рядка на льоту усуває потребу у фреймбуфері на 115,2 КБ</text>

  <!-- Ліва панель: 2D модель циферблата -->
  <rect x="24" y="74" width="436" height="382" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="40" y="98" font-size="14" font-weight="bold" fill="#1a1a1a">1. Модель циферблата та перетин сканлайна Y</text>

  <!-- Осі координат та область екрана 240x240 -->
  <text x="76" y="118" font-size="12" fill="#6b7280">0</text>
  <text x="196" y="118" text-anchor="middle" font-size="12" fill="#6b7280">Вісь X (0 .. 239)</text>
  <text x="316" y="118" text-anchor="end" font-size="12" fill="#6b7280">239</text>

  <text x="70" y="136" text-anchor="end" font-size="12" fill="#6b7280">0</text>
  <text x="70" y="172" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">y = 44</text>
  <text x="70" y="248" text-anchor="end" font-size="12" fill="#6b7280">Y0=120</text>
  <text x="70" y="364" text-anchor="end" font-size="12" fill="#6b7280">239</text>

  <!-- Екран IPS 240x240 -->
  <rect x="76" y="124" width="240" height="240" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Зовнішнє та внутрішнє кола шкали -->
  <circle cx="196" cy="244" r="96" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="196" cy="244" r="66" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Радіальні поділки шкали -->
  <line x1="139" y1="277" x2="113" y2="292" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="130" y1="244" x2="100" y2="244" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="139" y1="211" x2="113" y2="196" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="163" y1="187" x2="148" y2="161" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="196" y1="178" x2="196" y2="148" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="229" y1="187" x2="244" y2="161" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="253" y1="211" x2="279" y2="196" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="262" y1="244" x2="292" y2="244" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="253" y1="277" x2="279" y2="292" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Стрілка індикатора -->
  <polygon points="191,246 226,161 201,242" fill="#c0392b" stroke="#c0392b" stroke-width="1"/>
  <circle cx="196" cy="244" r="4" fill="#1a1a1a"/>
  <circle cx="196" cy="244" r="1.5" fill="#ffffff"/>
  <text x="202" y="260" font-size="12" fill="#6b7280">(X0, Y0)</text>

  <!-- Скануючий рядок Scanline Y = y_curr -->
  <line x1="76" y1="168" x2="316" y2="168" stroke="#2457d6" stroke-width="2" stroke-dasharray="5,3"/>

  <!-- Точки перетину на сканлайні -->
  <circle cx="137" cy="168" r="3.5" fill="#2457d6"/>
  <circle cx="223" cy="168" r="3.5" fill="#c0392b"/>
  <circle cx="255" cy="168" r="3.5" fill="#2457d6"/>

  <text x="137" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">x_in1</text>
  <text x="223" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">x_needle</text>
  <text x="255" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">x_in2</text>

  <!-- Виноски радіусів праворуч від циферблата -->
  <path d="M332,192 L286,198" stroke="#2457d6" stroke-width="1" marker-end="url(#arr-blue)"/>
  <text x="336" y="190" font-size="12" font-weight="bold" fill="#2457d6">R_out = 96</text>
  <text x="336" y="204" font-size="12" fill="#6b7280">зовнішній</text>

  <path d="M332,232 L264,240" stroke="#6b7280" stroke-width="1" marker-end="url(#arr-gray)"/>
  <text x="336" y="230" font-size="12" font-weight="bold" fill="#1a1a1a">R_in = 66</text>
  <text x="336" y="244" font-size="12" fill="#6b7280">внутрішній</text>

  <text x="336" y="274" font-size="12" font-weight="bold" fill="#c0392b">Стрілка</text>
  <text x="336" y="288" font-size="12" fill="#6b7280">трикутник</text>

  <!-- Пояснювальний блок унизу лівої панелі -->
  <rect x="40" y="378" width="404" height="64" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="52" y="398" font-size="12" font-weight="bold" fill="#1a1a1a">Поточний рядок Y = y_curr:</text>
  <text x="52" y="416" font-size="12" fill="#6b7280">• [0..x_in1] та [x_in2..239] — пікселі тла (поза колом R_out)</text>
  <text x="52" y="432" font-size="12" fill="#6b7280">• [x_in1..x_in2] — сектор шкали; x_needle — тіло стрілки</text>

  <!-- Права верхня панель: 1D буфер сканлайна -->
  <rect x="476" y="74" width="460" height="200" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="492" y="98" font-size="14" font-weight="bold" fill="#1a1a1a">2. Сегментація 240 пікселів рядка Y (1D-буфер)</text>

  <!-- 1D смужка сегментів рядка -->
  <rect x="496" y="114" width="107" height="28" fill="#ffffff" stroke="#d0d7de"/>
  <text x="549" y="132" text-anchor="middle" font-size="12" fill="#6b7280">Фон</text>

  <rect x="603" y="114" width="147" height="28" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="676" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Шкала циферблата</text>

  <rect x="750" y="114" width="16" height="28" fill="#c0392b" stroke="#c0392b"/>

  <rect x="766" y="114" width="47" height="28" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="789" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Шкала</text>

  <rect x="813" y="114" width="103" height="28" fill="#ffffff" stroke="#d0d7de"/>
  <text x="864" y="132" text-anchor="middle" font-size="12" fill="#6b7280">Фон</text>

  <!-- Позначки піксельних координат під 1D смужкою -->
  <line x1="496" y1="142" x2="496" y2="147" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="603" y1="142" x2="603" y2="147" stroke="#2457d6" stroke-width="1"/>
  <line x1="758" y1="142" x2="758" y2="147" stroke="#c0392b" stroke-width="1"/>
  <line x1="813" y1="142" x2="813" y2="147" stroke="#2457d6" stroke-width="1"/>
  <line x1="916" y1="142" x2="916" y2="147" stroke="#1a1a1a" stroke-width="1"/>

  <text x="496" y="158" text-anchor="middle" font-size="12" fill="#1a1a1a">0</text>
  <text x="603" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">x_in1</text>
  <text x="758" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">x_needle</text>
  <text x="813" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">x_in2</text>
  <text x="916" y="158" text-anchor="middle" font-size="12" fill="#1a1a1a">239</text>

  <!-- Правила заповнення сегментів -->
  <rect x="496" y="170" width="420" height="26" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <circle cx="508" cy="183" r="4.5" fill="#6b7280"/>
  <text x="522" y="187" font-size="12" fill="#1a1a1a">[0 .. x_in1], [x_in2 .. 239]: фонові пікселі (Background)</text>

  <rect x="496" y="202" width="420" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <circle cx="508" cy="215" r="4.5" fill="#2457d6"/>
  <text x="522" y="219" font-size="12" fill="#1a1a1a">[x_in1..x_needle_l], [x_needle_r..x_in2]: сектор шкали</text>

  <rect x="496" y="234" width="420" height="26" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <circle cx="508" cy="247" r="4.5" fill="#c0392b"/>
  <text x="522" y="251" font-size="12" fill="#1a1a1a">[x_needle_l .. x_needle_r]: тіло стрілки (Needle body)</text>

  <!-- Права нижня панель: DMA конвеєр і подвійна буферизація -->
  <rect x="476" y="288" width="460" height="168" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="492" y="310" font-size="14" font-weight="bold" fill="#1a1a1a">3. Подвійна рядкова буферизація (Double Buffering)</text>

  <!-- Буфери: Line Buffer 0 та Line Buffer 1 -->
  <rect x="496" y="322" width="195" height="52" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="506" y="340" font-size="12" font-weight="bold" fill="#27ae60">Line Buffer 0 (480 байтів)</text>
  <text x="506" y="356" font-size="12" fill="#1a1a1a">DMA передає у ST7789 по SPI</text>

  <rect x="721" y="322" width="195" height="52" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="731" y="340" font-size="12" font-weight="bold" fill="#2457d6">Line Buffer 1 (480 байтів)</text>
  <text x="731" y="356" font-size="12" fill="#1a1a1a">CPU рахує рядок Y+1 на льоту</text>

  <!-- Стрілки паралельної роботи -->
  <path d="M697,344 L715,344" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <path d="M715,354 L697,354" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Порівняння RAM: повний кадровий буфер проти рядкового -->
  <rect x="496" y="384" width="420" height="60" rx="5" fill="#ffffff" stroke="#d0d7de"/>

  <text x="508" y="404" font-size="12" font-weight="bold" fill="#c0392b">Кадровий буфер:</text>
  <text x="508" y="420" font-size="12" fill="#1a1a1a">240 × 240 × 2 Б = 115 200 Б</text>
  <text x="508" y="434" font-size="12" fill="#6b7280">115,2 КБ (дефіцит RAM)</text>

  <line x1="696" y1="390" x2="696" y2="438" stroke="#d0d7de" stroke-width="1"/>

  <text x="708" y="404" font-size="12" font-weight="bold" fill="#27ae60">Подвійний буфер рядка:</text>
  <text x="708" y="420" font-size="12" fill="#1a1a1a">2 × 240 × 2 Б = 960 байтів</text>
  <text x="708" y="434" font-size="12" font-weight="bold" fill="#27ae60">Економія 99,2% RAM (0,94 КБ)</text>
</svg>
