<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-prob" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-succ" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Підключення РК-матриці: пряме керування проти контролера-драйвера</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Контролер із вбудованою GRAM бере на себе регенерацію зображення й звільняє ядро MCU</text>

  <!-- ЛІВА ПАНЕЛЬ: Пряме керування -->
  <rect x="24" y="74" width="444" height="426" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Заголовок лівої панелі -->
  <rect x="38" y="88" width="416" height="32" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="246" y="109" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Пряме керування: сотні ліній і 100% навантаження ядра</text>

  <!-- Блок MCU (лівий) -->
  <rect x="38" y="132" width="154" height="216" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="115" y="152" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мікроконтролер</text>

  <rect x="46" y="164" width="138" height="64" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="115" y="183" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Обчислювальне ядро</text>
  <text x="115" y="201" font-size="12" fill="#c0392b" text-anchor="middle">100% CPU зайнято</text>
  <text x="115" y="219" font-size="12" fill="#6b7280" text-anchor="middle">неперервна розгортка</text>

  <rect x="46" y="238" width="138" height="52" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="115" y="258" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Периферія і таймери</text>
  <text x="115" y="276" font-size="12" fill="#6b7280" text-anchor="middle">HSYNC, VSYNC, CLK</text>

  <text x="115" y="310" font-size="12" fill="#6b7280" text-anchor="middle">SRAM кадру: ~150 КБ</text>
  <text x="115" y="328" font-size="12" fill="#c0392b" text-anchor="middle">Дефіцит пам'яті MCU</text>

  <!-- Зв'язок (лівий): сотні ліній -->
  <text x="246" y="160" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Шина розгортки</text>
  <text x="246" y="176" font-size="12" fill="#c0392b" text-anchor="middle">Сотні з'єднань</text>

  <line x1="198" y1="192" x2="292" y2="192" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-prob)"/>
  <line x1="198" y1="204" x2="292" y2="204" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-prob)"/>
  <line x1="198" y1="216" x2="292" y2="216" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-prob)"/>

  <text x="246" y="238" font-size="12" fill="#c0392b" text-anchor="middle">HSYNC / VSYNC</text>
  <text x="246" y="256" font-size="12" fill="#6b7280" text-anchor="middle">CLK + RGB-дані</text>
  <text x="246" y="274" font-size="12" fill="#6b7280" text-anchor="middle">потік 60 кадр/с</text>

  <!-- Блок РК-панелі (лівий) -->
  <rect x="300" y="132" width="154" height="216" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="377" y="152" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">РК-панель (гола)</text>

  <rect x="308" y="164" width="138" height="64" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="377" y="183" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">IPS-матриця 240×240</text>
  <text x="377" y="201" font-size="12" fill="#6b7280" text-anchor="middle">240 рядків (Gate)</text>
  <text x="377" y="219" font-size="12" fill="#6b7280" text-anchor="middle">720 стовпців (RGB)</text>

  <rect x="308" y="238" width="138" height="52" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="377" y="258" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Немає власної GRAM</text>
  <text x="377" y="276" font-size="12" fill="#c0392b" text-anchor="middle">Згасає без оновлення</text>

  <text x="377" y="310" font-size="12" fill="#6b7280" text-anchor="middle">Потрібні +15V / -10V</text>
  <text x="377" y="328" font-size="12" fill="#c0392b" text-anchor="middle">Зовнішні помпи/ЦАП</text>

  <!-- Підсумок лівої панелі -->
  <rect x="38" y="360" width="416" height="124" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="52" y="382" font-size="13" font-weight="bold" fill="#c0392b">Недоліки прямого керування:</text>
  <text x="52" y="404" font-size="12" fill="#1a1a1a">• 100% часу ядра витрачається на формування розгортки</text>
  <text x="52" y="424" font-size="12" fill="#1a1a1a">• Буфер кадру 150 КБ вичерпує всю RAM мікроконтролера</text>
  <text x="52" y="444" font-size="12" fill="#1a1a1a">• Складне розведення сотень ліній або паралельної шини</text>
  <text x="52" y="464" font-size="12" fill="#1a1a1a">• Необхідні складні зовнішні помпи напруг (+15V, -10V)</text>

  <!-- ПРАВА ПАНЕЛЬ: З контролером-драйвером -->
  <rect x="492" y="74" width="444" height="426" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Заголовок правої панелі -->
  <rect x="506" y="88" width="416" height="32" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="714" y="109" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">З контролером ST7789: 4–5 ліній і вільне ядро MCU</text>

  <!-- Блок MCU (правий) -->
  <rect x="506" y="132" width="104" height="216" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="558" y="152" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">MCU</text>

  <rect x="512" y="164" width="92" height="64" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="558" y="183" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Ядро вільне</text>
  <text x="558" y="201" font-size="12" fill="#27ae60" text-anchor="middle">&lt; 1% CPU</text>
  <text x="558" y="219" font-size="12" fill="#6b7280" text-anchor="middle">для задач</text>

  <rect x="512" y="238" width="92" height="52" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="558" y="258" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Блок SPI</text>
  <text x="558" y="276" font-size="12" fill="#6b7280" text-anchor="middle">або DMA</text>

  <text x="558" y="310" font-size="12" fill="#6b7280" text-anchor="middle">RAM вільна</text>
  <text x="558" y="328" font-size="12" fill="#27ae60" text-anchor="middle">Тільки команди</text>

  <!-- Зв'язок (правий): шина SPI -->
  <text x="650" y="160" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Шина SPI</text>
  <text x="650" y="176" font-size="12" fill="#2457d6" text-anchor="middle">4–5 ліній</text>

  <line x1="616" y1="192" x2="682" y2="192" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <line x1="616" y1="204" x2="682" y2="204" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <line x1="616" y1="216" x2="682" y2="216" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>

  <text x="650" y="238" font-size="12" fill="#1a1a1a" text-anchor="middle">SCL, SDA</text>
  <text x="650" y="256" font-size="12" fill="#1a1a1a" text-anchor="middle">CS, DC, RES</text>
  <text x="650" y="274" font-size="12" fill="#27ae60" text-anchor="middle">за викликом</text>

  <!-- Блок модуля дисплея (ST7789 + Матриця) -->
  <rect x="690" y="132" width="232" height="216" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="806" y="152" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Модуль дисплея (IPS 1.3″)</text>

  <!-- Кристал ST7789 -->
  <rect x="698" y="164" width="124" height="174" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="760" y="180" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Контролер ST7789</text>

  <rect x="704" y="190" width="112" height="42" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="760" y="207" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вбудована GRAM</text>
  <text x="760" y="223" font-size="12" fill="#1a1a1a" text-anchor="middle">буфер кадру</text>

  <rect x="704" y="238" width="112" height="42" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="760" y="255" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Автономний скан</text>
  <text x="760" y="271" font-size="12" fill="#6b7280" text-anchor="middle">розгортка 60 Гц</text>

  <rect x="704" y="286" width="112" height="42" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="760" y="303" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Помпи напруги</text>
  <text x="760" y="319" font-size="12" fill="#6b7280" text-anchor="middle">VGH / VGL / VCOM</text>

  <!-- Внутрішній зв'язок ST7789 -> Матриця -->
  <line x1="822" y1="211" x2="838" y2="211" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <line x1="822" y1="259" x2="838" y2="259" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <line x1="822" y1="307" x2="838" y2="307" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>

  <!-- Матриця на склі -->
  <rect x="840" y="164" width="74" height="174" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="877" y="184" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">IPS</text>
  <text x="877" y="200" font-size="12" fill="#1a1a1a" text-anchor="middle">матриця</text>
  <text x="877" y="218" font-size="12" fill="#6b7280" text-anchor="middle">240×240</text>

  <rect x="846" y="234" width="62" height="60" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="877" y="258" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Світіння</text>
  <text x="877" y="276" font-size="12" fill="#27ae60" text-anchor="middle">без паузи</text>

  <text x="877" y="318" font-size="12" fill="#6b7280" text-anchor="middle">автономно</text>

  <!-- Підсумок правої панелі -->
  <rect x="506" y="360" width="416" height="124" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="520" y="382" font-size="13" font-weight="bold" fill="#27ae60">Переваги контролера-драйвера:</text>
  <text x="520" y="404" font-size="12" fill="#1a1a1a">• Ядро вільне для коду застосунку (&lt; 1% навантаження CPU)</text>
  <text x="520" y="424" font-size="12" fill="#1a1a1a">• Буфер кадру розміщено у власній пам'яті GRAM дисплея</text>
  <text x="520" y="444" font-size="12" fill="#1a1a1a">• Компактне підключення: всього 4–5 сигнальних ліній SPI</text>
  <text x="520" y="464" font-size="12" fill="#1a1a1a">• Вбудовані помпи напруг формують VGH/VGL на кристалі</text>
</svg>
