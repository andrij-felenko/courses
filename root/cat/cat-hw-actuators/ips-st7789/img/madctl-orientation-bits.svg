<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Керування орієнтацією дисплея ST7789: біти регістру MADCTL (0x36)</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Вплив бітів MY (Row Order), MX (Column Order), MV (Row/Col Exchange) та розкладки RGB/BGR на систему координат</text>

  <!-- ==================== ВЕРХНІЙ РЯД: 4 КАРТКИ ОРІЄНТАЦІЇ ==================== -->

  <!-- КАРТКА 1: 0° (Портрет) -->
  <rect x="35" y="75" width="205" height="215" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <text x="137" y="96" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">0° (Портрет)</text>
  <text x="137" y="112" font-size="12" fill="#6b7280" text-anchor="middle">MADCTL: 0x00</text>

  <!-- Екран 0° -->
  <rect x="97" y="122" width="80" height="80" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <!-- Початок (0,0) -->
  <circle cx="103" cy="128" r="4" fill="#27ae60"/>
  <text x="97" y="118" font-size="12" font-weight="bold" fill="#27ae60">(0,0)</text>
  <!-- Вісь X -->
  <line x1="108" y1="128" x2="162" y2="128" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="165" y="132" font-size="12" font-weight="bold" fill="#2457d6">X</text>
  <!-- Вісь Y -->
  <line x1="103" y1="133" x2="103" y2="187" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="103" y="199" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Y</text>
  <!-- Гліф F -->
  <path d="M 132,175 L 132,148 L 152,148 M 132,160 L 146,160" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- Текст під екраном 1 -->
  <text x="137" y="222" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">MY=0, MX=0, MV=0</text>
  <text x="137" y="240" font-size="12" fill="#6b7280" text-anchor="middle">X: 0..239 (вправо)</text>
  <text x="137" y="258" font-size="12" fill="#6b7280" text-anchor="middle">Y: 0..239 (донизу)</text>
  <text x="137" y="276" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Базова орієнтація</text>


  <!-- КАРТКА 2: 90° (Альбомна) -->
  <rect x="260" y="75" width="205" height="215" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="362" y="96" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">90° (Альбомна)</text>
  <text x="362" y="112" font-size="12" fill="#6b7280" text-anchor="middle">MADCTL: 0x70</text>

  <!-- Екран 90° -->
  <rect x="322" y="122" width="80" height="80" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <!-- Початок (0,0) у правому верхньому кутку -->
  <circle cx="396" cy="128" r="4" fill="#27ae60"/>
  <text x="396" y="118" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">(0,0)</text>
  <!-- Вісь X (донизу) -->
  <line x1="396" y1="133" x2="396" y2="187" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="396" y="199" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">X</text>
  <!-- Вісь Y (вліво) -->
  <line x1="391" y1="128" x2="337" y2="128" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="330" y="132" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">Y</text>
  <!-- Гліф F (повернутий на 90° CW) -->
  <path d="M 347,157 L 374,157 M 374,157 L 374,177 M 362,157 L 362,171" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- Текст під екраном 2 -->
  <text x="362" y="222" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">MY=0, MX=1, MV=1</text>
  <text x="362" y="240" font-size="12" fill="#6b7280" text-anchor="middle">Обмін осей X ↔ Y</text>
  <text x="362" y="258" font-size="12" fill="#6b7280" text-anchor="middle">Дзеркало по X</text>
  <text x="362" y="276" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Поворот за стрілкою</text>


  <!-- КАРТКА 3: 180° (Портрет реверс) -->
  <rect x="485" y="75" width="205" height="215" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="587" y="96" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">180° (Портрет реверс)</text>
  <text x="587" y="112" font-size="12" fill="#6b7280" text-anchor="middle">MADCTL: 0xC0</text>

  <!-- Екран 180° -->
  <rect x="547" y="122" width="80" height="80" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <!-- Початок (0,0) у правому нижньому кутку -->
  <circle cx="621" cy="196" r="4" fill="#27ae60"/>
  <text x="621" y="211" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">(0,0)</text>
  <!-- Вісь X (вліво) -->
  <line x1="616" y1="196" x2="562" y2="196" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="555" y="200" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">X</text>
  <!-- Вісь Y (догори) -->
  <line x1="621" y1="191" x2="621" y2="137" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="621" y="132" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Y</text>
  <!-- Гліф F (перевернутий 180°) -->
  <path d="M 595,148 L 595,175 L 575,175 M 595,163 L 581,163" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- Текст під екраном 3 -->
  <text x="587" y="222" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">MY=1, MX=1, MV=0</text>
  <text x="587" y="240" font-size="12" fill="#6b7280" text-anchor="middle">Дзеркало по X та Y</text>
  <text x="587" y="258" font-size="12" fill="#6b7280" text-anchor="middle">Зсув Y_offset = 80 px</text>
  <text x="587" y="276" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Перевернутий екран</text>


  <!-- КАРТКА 4: 270° (Альбомна реверс) -->
  <rect x="710" y="75" width="205" height="215" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="812" y="96" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">270° (Альбомна реверс)</text>
  <text x="812" y="112" font-size="12" fill="#6b7280" text-anchor="middle">MADCTL: 0xA0</text>

  <!-- Екран 270° -->
  <rect x="772" y="122" width="80" height="80" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <!-- Початок (0,0) у лівому нижньому кутку -->
  <circle cx="778" cy="196" r="4" fill="#27ae60"/>
  <text x="778" y="211" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">(0,0)</text>
  <!-- Вісь X (догори) -->
  <line x1="778" y1="191" x2="778" y2="137" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="778" y="132" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">X</text>
  <!-- Вісь Y (вправо) -->
  <line x1="783" y1="196" x2="837" y2="196" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="845" y="200" font-size="12" font-weight="bold" fill="#c0392b">Y</text>
  <!-- Гліф F (повернутий 270° CW) -->
  <path d="M 822,166 L 795,166 M 795,166 L 795,146 M 807,166 L 807,152" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- Текст під екраном 4 -->
  <text x="812" y="222" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">MY=1, MX=0, MV=1</text>
  <text x="812" y="240" font-size="12" fill="#6b7280" text-anchor="middle">Обмін осей X ↔ Y</text>
  <text x="812" y="258" font-size="12" fill="#6b7280" text-anchor="middle">Зсув X_offset = 80 px</text>
  <text x="812" y="276" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Поворот 90° проти годинника</text>


  <!-- ==================== НИЖНІЙ РЯД: БІТИ MADCTL ТА СУБПІКСЕЛІ ==================== -->

  <!-- Ліва панель: Регістр MADCTL -->
  <rect x="35" y="305" width="520" height="135" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="295" y="325" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Регістр MADCTL (0x36) — біти керування доступом до пам'яті</text>

  <!-- 8 комірок бітів -->
  <!-- D7: MY -->
  <rect x="71" y="333" width="56" height="38" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="99" y="349" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">D7: MY</text>
  <text x="99" y="364" font-size="12" fill="#6b7280" text-anchor="middle">Рядки</text>

  <!-- D6: MX -->
  <rect x="127" y="333" width="56" height="38" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="155" y="349" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">D6: MX</text>
  <text x="155" y="364" font-size="12" fill="#6b7280" text-anchor="middle">Колонки</text>

  <!-- D5: MV -->
  <rect x="183" y="333" width="56" height="38" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="211" y="349" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">D5: MV</text>
  <text x="211" y="364" font-size="12" fill="#6b7280" text-anchor="middle">Обмін</text>

  <!-- D4: ML -->
  <rect x="239" y="333" width="56" height="38" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="267" y="349" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">D4: ML</text>
  <text x="267" y="364" font-size="12" fill="#6b7280" text-anchor="middle">Розгортка</text>

  <!-- D3: RGB -->
  <rect x="295" y="333" width="56" height="38" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="323" y="349" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">D3: RGB</text>
  <text x="323" y="364" font-size="12" fill="#6b7280" text-anchor="middle">Колір</text>

  <!-- D2: MH -->
  <rect x="351" y="333" width="56" height="38" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="379" y="349" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">D2: MH</text>
  <text x="379" y="364" font-size="12" fill="#6b7280" text-anchor="middle">Горизонт</text>

  <!-- D1: 0 -->
  <rect x="407" y="333" width="56" height="38" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="435" y="349" font-size="12" fill="#6b7280" text-anchor="middle">D1: 0</text>
  <text x="435" y="364" font-size="12" fill="#6b7280" text-anchor="middle">Резерв</text>

  <!-- D0: 0 -->
  <rect x="463" y="333" width="56" height="38" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="491" y="349" font-size="12" fill="#6b7280" text-anchor="middle">D0: 0</text>
  <text x="491" y="364" font-size="12" fill="#6b7280" text-anchor="middle">Резерв</text>

  <!-- Текстовий опис під комірками -->
  <text x="295" y="394" font-size="12" fill="#1a1a1a" text-anchor="middle">MY: дзеркало рядків | MX: дзеркало колонок | MV: обмін осей X ↔ Y</text>
  <text x="295" y="414" font-size="12" fill="#6b7280" text-anchor="middle">Зміна MADCTL миттєво повертає екран без перезапису GDDRAM</text>


  <!-- Права панель: Розкладка субпікселів (D3) -->
  <rect x="575" y="305" width="340" height="135" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="745" y="325" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розкладка субпікселів (біт D3 в MADCTL)</text>

  <!-- Картка D3 = 0 (RGB) -->
  <rect x="590" y="335" width="145" height="52" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="598" y="354" width="12" height="24" rx="2" fill="#c0392b"/>
  <rect x="613" y="354" width="12" height="24" rx="2" fill="#27ae60"/>
  <rect x="628" y="354" width="12" height="24" rx="2" fill="#2457d6"/>
  <text x="647" y="353" font-size="12" font-weight="bold" fill="#27ae60">D3 = 0: RGB</text>
  <text x="647" y="371" font-size="12" fill="#6b7280">Стандарт</text>

  <!-- Картка D3 = 1 (BGR) -->
  <rect x="755" y="335" width="145" height="52" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="763" y="354" width="12" height="24" rx="2" fill="#2457d6"/>
  <rect x="778" y="354" width="12" height="24" rx="2" fill="#27ae60"/>
  <rect x="793" y="354" width="12" height="24" rx="2" fill="#c0392b"/>
  <text x="812" y="353" font-size="12" font-weight="bold" fill="#c0392b">D3 = 1: BGR</text>
  <text x="812" y="371" font-size="12" fill="#6b7280">Реверс R↔B</text>

  <!-- Застереження про інверсію кольорів -->
  <text x="745" y="412" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Помилка біта D3 призводить до заміни червоного на синій</text>
</svg>
