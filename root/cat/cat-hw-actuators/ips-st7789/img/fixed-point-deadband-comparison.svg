<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Згладжування руху стрілки: цілочисельне ділення проти фіксованої коми Q8</text>
  <text x="480" y="48" text-anchor="middle" font-size="13" fill="#6b7280">Утинання дробової частини в int створює мертву зону (deadband): накопичувач Q8 забезпечує точність 1/256°</text>

  <!-- Ліва панель: Графік -->
  <rect x="24" y="66" width="536" height="374" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="44" y="90" font-size="14" font-weight="bold" fill="#1a1a1a">Збіжність кута стрілки до цілі (0° ➔ 90°)</text>

  <!-- Легенда -->
  <rect x="44" y="104" width="12" height="12" rx="2" fill="#27ae60"/>
  <text x="62" y="115" font-size="12" font-weight="bold" fill="#27ae60">Накопичувач Q8 (плавно ➔ 90.0°)</text>

  <rect x="300" y="104" width="12" height="12" rx="2" fill="#c0392b"/>
  <text x="318" y="115" font-size="12" font-weight="bold" fill="#c0392b">Цілочисельне int (мертва зона 87°)</text>

  <!-- Підкладка мертвої зони -->
  <rect x="208" y="150" width="308" height="6.7" fill="#fdecea"/>

  <!-- Горизонтальні лінії сітки -->
  <line x1="76" y1="150" x2="516" y2="150" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="70" y="154" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">90°</text>

  <line x1="76" y1="217" x2="516" y2="217" stroke="#d0d7de" stroke-width="1"/>
  <text x="70" y="221" text-anchor="end" font-size="12" fill="#6b7280">60°</text>

  <line x1="76" y1="283" x2="516" y2="283" stroke="#d0d7de" stroke-width="1"/>
  <text x="70" y="287" text-anchor="end" font-size="12" fill="#6b7280">30°</text>

  <line x1="76" y1="350" x2="516" y2="350" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="70" y="354" text-anchor="end" font-size="12" fill="#1a1a1a">0°</text>

  <!-- Вісь Y -->
  <line x1="76" y1="140" x2="76" y2="350" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Засічки на осі X замість наскрізних ліній -->
  <line x1="164" y1="350" x2="164" y2="355" stroke="#1a1a1a" stroke-width="1"/>
  <text x="164" y="368" text-anchor="middle" font-size="12" fill="#6b7280">10</text>

  <line x1="252" y1="350" x2="252" y2="355" stroke="#1a1a1a" stroke-width="1"/>
  <text x="252" y="368" text-anchor="middle" font-size="12" fill="#6b7280">20</text>

  <line x1="340" y1="350" x2="340" y2="355" stroke="#1a1a1a" stroke-width="1"/>
  <text x="340" y="368" text-anchor="middle" font-size="12" fill="#6b7280">30</text>

  <line x1="428" y1="350" x2="428" y2="355" stroke="#1a1a1a" stroke-width="1"/>
  <text x="428" y="368" text-anchor="middle" font-size="12" fill="#6b7280">40</text>

  <line x1="516" y1="350" x2="516" y2="355" stroke="#1a1a1a" stroke-width="1"/>
  <text x="516" y="368" text-anchor="middle" font-size="12" fill="#6b7280">50</text>

  <!-- Криві -->
  <path d="M 76.0,350.0 L 84.8,350.0 L 84.8,301.1 L 93.6,301.1 L 93.6,263.3 L 102.4,263.3 L 102.4,236.7 L 111.2,236.7 L 111.2,216.7 L 120.0,216.7 L 120.0,201.1 L 128.8,201.1 L 128.8,190.0 L 137.6,190.0 L 137.6,181.1 L 146.4,181.1 L 146.4,174.4 L 155.2,174.4 L 155.2,170.0 L 164.0,170.0 L 164.0,165.6 L 172.8,165.6 L 172.8,163.3 L 181.6,163.3 L 181.6,161.1 L 190.4,161.1 L 190.4,158.9 L 199.2,158.9 L 199.2,156.7 L 208.0,156.7 L 208.0,156.7 L 216.8,156.7 L 216.8,156.7 L 225.6,156.7 L 225.6,156.7 L 234.4,156.7 L 234.4,156.7 L 243.2,156.7 L 243.2,156.7 L 252.0,156.7 L 252.0,156.7 L 260.8,156.7 L 260.8,156.7 L 269.6,156.7 L 269.6,156.7 L 278.4,156.7 L 278.4,156.7 L 287.2,156.7 L 287.2,156.7 L 296.0,156.7 L 296.0,156.7 L 304.8,156.7 L 304.8,156.7 L 313.6,156.7 L 313.6,156.7 L 322.4,156.7 L 322.4,156.7 L 331.2,156.7 L 331.2,156.7 L 340.0,156.7 L 340.0,156.7 L 348.8,156.7 L 348.8,156.7 L 357.6,156.7 L 357.6,156.7 L 366.4,156.7 L 366.4,156.7 L 375.2,156.7 L 375.2,156.7 L 384.0,156.7 L 384.0,156.7 L 392.8,156.7 L 392.8,156.7 L 401.6,156.7 L 401.6,156.7 L 410.4,156.7 L 410.4,156.7 L 419.2,156.7 L 419.2,156.7 L 428.0,156.7 L 428.0,156.7 L 436.8,156.7 L 436.8,156.7 L 445.6,156.7 L 445.6,156.7 L 454.4,156.7 L 454.4,156.7 L 463.2,156.7 L 463.2,156.7 L 472.0,156.7 L 472.0,156.7 L 480.8,156.7 L 480.8,156.7 L 489.6,156.7 L 489.6,156.7 L 498.4,156.7 L 498.4,156.7 L 507.2,156.7 L 507.2,156.7 L 516.0,156.7 L 516.0,156.7" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <path d="M 76.0,350.0 L 84.8,300.0 L 93.6,262.5 L 102.4,234.4 L 111.2,213.3 L 120.0,197.5 L 128.8,185.6 L 137.6,176.7 L 146.4,170.0 L 155.2,165.0 L 164.0,161.3 L 172.8,158.5 L 181.6,156.4 L 190.4,154.8 L 199.2,153.6 L 208.0,152.7 L 216.8,152.0 L 225.6,151.5 L 234.4,151.1 L 243.2,150.9 L 252.0,150.7 L 260.8,150.5 L 269.6,150.4 L 278.4,150.3 L 287.2,150.2 L 296.0,150.2 L 304.8,150.1 L 313.6,150.1 L 322.4,150.1 L 331.2,150.1 L 340.0,150.1 L 348.8,150.0 L 357.6,150.0 L 366.4,150.0 L 375.2,150.0 L 384.0,150.0 L 392.8,150.0 L 401.6,150.0 L 410.4,150.0 L 419.2,150.0 L 428.0,150.0 L 436.8,150.0 L 445.6,150.0 L 454.4,150.0 L 463.2,150.0 L 472.0,150.0 L 480.8,150.0 L 489.6,150.0 L 498.4,150.0 L 507.2,150.0 L 516.0,150.0" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Стрілка та пояснення мертвої зони на графіку -->
  <line x1="226" y1="172" x2="226" y2="157" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="240" y="180" font-size="12" font-weight="bold" fill="#c0392b">Мертва зона: зупинка на 87° (недоліт 3°)</text>
  <text x="240" y="198" font-size="12" fill="#6b7280">При різниці 3°: (90 - 87) / 4 == 0 (усікання в 0)</text>

  <!-- Підпис осі X -->
  <text x="296" y="394" text-anchor="middle" font-size="12" fill="#1a1a1a">Кількість ітерацій / кадрів оновлення стрілки (t)</text>
  <text x="296" y="414" text-anchor="middle" font-size="12" fill="#2457d6">Цільовий кут 90.0° досягається лише накопичувачем Q8</text>

  <!-- Права колонка: Інженерні картки -->
  <!-- Картка 1: Проблема int -->
  <rect x="574" y="66" width="362" height="114" rx="8" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="574" y="66" width="362" height="26" rx="8" fill="#fdecea"/>
  <text x="586" y="84" font-size="12" font-weight="bold" fill="#c0392b">❌ Проблема: цілочисельне усікання до 0</text>
  <text x="586" y="106" font-size="12" font-weight="bold" fill="#1a1a1a">angle += (target - angle) / 4;</text>
  <text x="586" y="124" font-size="12" fill="#1a1a1a">• Коли різниця менша за дільник: 3 / 4 == 0</text>
  <text x="586" y="142" font-size="12" fill="#1a1a1a">• Стрілка завмирає на 87° і не рухається до цілі</text>
  <text x="586" y="160" font-size="12" fill="#c0392b">• Виникає статична похибка (deadband) у 3°!</text>

  <!-- Картка 2: Рішення Q8 -->
  <rect x="574" y="192" width="362" height="114" rx="8" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="574" y="192" width="362" height="26" rx="8" fill="#e9f7ef"/>
  <text x="586" y="210" font-size="12" font-weight="bold" fill="#27ae60">✔ Рішення: 8-бітний накопичувач Q8</text>
  <text x="586" y="232" font-size="12" font-weight="bold" fill="#1a1a1a">angle_q8 += (target_q8 - angle_q8) &gt;&gt; 2;</text>
  <text x="586" y="250" font-size="12" fill="#1a1a1a">• 8 молодших бітів зберігають дріб (крок 1/256°)</text>
  <text x="586" y="268" font-size="12" fill="#1a1a1a">• Дробовий залишок поступово додає цілі градуси</text>
  <text x="586" y="286" font-size="12" fill="#27ae60">• Рендеринг на екран: angle = angle_q8 &gt;&gt; 8;</text>

  <!-- Картка 3: Підсумок -->
  <rect x="574" y="318" width="362" height="122" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="586" y="338" font-size="12" font-weight="bold" fill="#2457d6">Переваги для індикаторів ST7789:</text>
  <text x="586" y="358" font-size="12" fill="#1a1a1a">1. Відсутність мертвої зони без повільного float</text>
  <text x="586" y="376" font-size="12" fill="#1a1a1a">2. Плавний рух стрілки на 50–60 FPS без ривків</text>
  <text x="586" y="394" font-size="12" fill="#1a1a1a">3. Детермінований час обчислень для DMA-буфера</text>
  <text x="586" y="414" font-size="12" font-weight="bold" fill="#2457d6">Точне позиціювання стрілки без FPU!</text>
</svg>
