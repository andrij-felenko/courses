<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма 4-провідного SPI Mode 0 контролера ST7789</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Передача команди (D/C=0) та даних (D/C=1): фіксація бітів на висхідному фронті SCK</text>

  <!-- ЛІВА ПАНЕЛЬ: Часова діаграма -->
  <rect x="24" y="68" width="550" height="376" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="299" y="90" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Осцилограма шини: Байт команди (0x2A) → Байт даних (0x00)</text>

  <!-- Банери байтів зверху -->
  <rect x="100" y="104" width="192" height="22" rx="3" fill="#fdecea" stroke="#c0392b"/>
  <text x="196" y="119" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">БАЙТ КОМАНДИ: 0x2A (CASET)</text>

  <rect x="330" y="104" width="192" height="22" rx="3" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="426" y="119" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">БАЙТ ДАНИХ: 0x00 (XS[15..8])</text>

  <!-- Підписи сигналів зліва -->
  <text x="68" y="162" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">CS</text>
  <text x="68" y="212" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">D/C</text>
  <text x="68" y="262" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">SCK</text>
  <text x="68" y="312" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">MOSI</text>

  <!-- Сигнал 1: CS -->
  <polyline points="80,146 95,146 95,168 535,168 535,146 550,146" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Сигнал 2: D/C -->
  <polyline points="80,218 316,218 322,196 550,196" fill="none" stroke="#2457d6" stroke-width="2"/>
  <text x="196" y="234" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">D/C = LOW (0)</text>
  <text x="426" y="212" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">D/C = HIGH (1)</text>

  <!-- Пунктирні лінії вибірки (Sample) -->
  <line x1="106" y1="242" x2="106" y2="288" stroke="#2457d6" stroke-width="1" stroke-dasharray="2 2"/>\n  <line x1="130" y1="242" x2="130" y2="288" stroke="#2457d6" stroke-width="1" stroke-dasharray="2 2"/>\n  <line x1="154" y1="242" x2="154" y2="288" stroke="#2457d6" stroke-width="1" stroke-dasharray="2 2"/>\n  <line x1="178" y1="242" x2="178" y2="288" stroke="#2457d6" stroke-width="1" stroke-dasharray="2 2"/>\n  <line x1="202" y1="242" x2="202" y2="288" stroke="#2457d6" stroke-width="1" stroke-dasharray="2 2"/>\n  <line x1="226" y1="242" x2="226" y2="288" stroke="#2457d6" stroke-width="1" stroke-dasharray="2 2"/>\n  <line x1="250" y1="242" x2="250" y2="288" stroke="#2457d6" stroke-width="1" stroke-dasharray="2 2"/>\n  <line x1="274" y1="242" x2="274" y2="288" stroke="#2457d6" stroke-width="1" stroke-dasharray="2 2"/>\n  <line x1="336" y1="242" x2="336" y2="288" stroke="#27ae60" stroke-width="1" stroke-dasharray="2 2"/>\n  <line x1="360" y1="242" x2="360" y2="288" stroke="#27ae60" stroke-width="1" stroke-dasharray="2 2"/>\n  <line x1="384" y1="242" x2="384" y2="288" stroke="#27ae60" stroke-width="1" stroke-dasharray="2 2"/>\n  <line x1="408" y1="242" x2="408" y2="288" stroke="#27ae60" stroke-width="1" stroke-dasharray="2 2"/>\n  <line x1="432" y1="242" x2="432" y2="288" stroke="#27ae60" stroke-width="1" stroke-dasharray="2 2"/>\n  <line x1="456" y1="242" x2="456" y2="288" stroke="#27ae60" stroke-width="1" stroke-dasharray="2 2"/>\n  <line x1="480" y1="242" x2="480" y2="288" stroke="#27ae60" stroke-width="1" stroke-dasharray="2 2"/>\n  <line x1="504" y1="242" x2="504" y2="288" stroke="#27ae60" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Сигнал 3: SCK -->
  <path d="M 80,270 L 100,270 L 106,270 L 106,246 L 118,246 L 118,270 L 130,270 L 130,246 L 142,246 L 142,270 L 154,270 L 154,246 L 166,246 L 166,270 L 178,270 L 178,246 L 190,246 L 190,270 L 202,270 L 202,246 L 214,246 L 214,270 L 226,270 L 226,246 L 238,246 L 238,270 L 250,270 L 250,246 L 262,246 L 262,270 L 274,270 L 274,246 L 286,246 L 286,270 L 310,270 L 336,270 L 336,246 L 348,246 L 348,270 L 360,270 L 360,246 L 372,246 L 372,270 L 384,270 L 384,246 L 396,246 L 396,270 L 408,270 L 408,246 L 420,246 L 420,270 L 432,270 L 432,246 L 444,246 L 444,270 L 456,270 L 456,246 L 468,246 L 468,270 L 480,270 L 480,246 L 492,246 L 492,270 L 504,270 L 504,246 L 516,246 L 516,270 L 545,270" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="106" y="240" font-size="12" fill="#2457d6" text-anchor="middle">↑ Sample</text>
  <text x="336" y="240" font-size="12" fill="#27ae60" text-anchor="middle">↑ Sample</text>

  <!-- Сигнал 4: MOSI -->
  <line x1="100" y1="296" x2="104" y2="320" stroke="#2457d6" stroke-width="1.5"/>\n  <line x1="100" y1="320" x2="104" y2="296" stroke="#2457d6" stroke-width="1.5"/>\n  <line x1="104" y1="296" x2="124" y2="296" stroke="#2457d6" stroke-width="1.5"/>\n  <line x1="104" y1="320" x2="124" y2="320" stroke="#2457d6" stroke-width="1.5"/>\n  <line x1="124" y1="296" x2="128" y2="320" stroke="#2457d6" stroke-width="1.5"/>\n  <line x1="124" y1="320" x2="128" y2="296" stroke="#2457d6" stroke-width="1.5"/>\n  <line x1="128" y1="296" x2="148" y2="296" stroke="#2457d6" stroke-width="1.5"/>\n  <line x1="128" y1="320" x2="148" y2="320" stroke="#2457d6" stroke-width="1.5"/>\n  <line x1="148" y1="296" x2="152" y2="320" stroke="#2457d6" stroke-width="1.5"/>\n  <line x1="148" y1="320" x2="152" y2="296" stroke="#2457d6" stroke-width="1.5"/>\n  <line x1="152" y1="296" x2="172" y2="296" stroke="#2457d6" stroke-width="1.5"/>\n  <line x1="152" y1="320" x2="172" y2="320" stroke="#2457d6" stroke-width="1.5"/>\n  <line x1="172" y1="296" x2="176" y2="320" stroke="#2457d6" stroke-width="1.5"/>\n  <line x1="172" y1="320" x2="176" y2="296" stroke="#2457d6" stroke-width="1.5"/>\n  <line x1="176" y1="296" x2="196" y2="296" stroke="#2457d6" stroke-width="1.5"/>\n  <line x1="176" y1="320" x2="196" y2="320" stroke="#2457d6" stroke-width="1.5"/>\n  <line x1="196" y1="296" x2="200" y2="320" stroke="#2457d6" stroke-width="1.5"/>\n  <line x1="196" y1="320" x2="200" y2="296" stroke="#2457d6" stroke-width="1.5"/>\n  <line x1="200" y1="296" x2="220" y2="296" stroke="#2457d6" stroke-width="1.5"/>\n  <line x1="200" y1="320" x2="220" y2="320" stroke="#2457d6" stroke-width="1.5"/>\n  <line x1="220" y1="296" x2="224" y2="320" stroke="#2457d6" stroke-width="1.5"/>\n  <line x1="220" y1="320" x2="224" y2="296" stroke="#2457d6" stroke-width="1.5"/>\n  <line x1="224" y1="296" x2="244" y2="296" stroke="#2457d6" stroke-width="1.5"/>\n  <line x1="224" y1="320" x2="244" y2="320" stroke="#2457d6" stroke-width="1.5"/>\n  <line x1="244" y1="296" x2="248" y2="320" stroke="#2457d6" stroke-width="1.5"/>\n  <line x1="244" y1="320" x2="248" y2="296" stroke="#2457d6" stroke-width="1.5"/>\n  <line x1="248" y1="296" x2="268" y2="296" stroke="#2457d6" stroke-width="1.5"/>\n  <line x1="248" y1="320" x2="268" y2="320" stroke="#2457d6" stroke-width="1.5"/>\n  <line x1="268" y1="296" x2="272" y2="320" stroke="#2457d6" stroke-width="1.5"/>\n  <line x1="268" y1="320" x2="272" y2="296" stroke="#2457d6" stroke-width="1.5"/>\n  <line x1="272" y1="296" x2="292" y2="296" stroke="#2457d6" stroke-width="1.5"/>\n  <line x1="272" y1="320" x2="292" y2="320" stroke="#2457d6" stroke-width="1.5"/>\n  <line x1="292" y1="296" x2="296" y2="320" stroke="#2457d6" stroke-width="1.5"/>\n  <line x1="292" y1="320" x2="296" y2="296" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="330" y1="296" x2="334" y2="320" stroke="#27ae60" stroke-width="1.5"/>\n  <line x1="330" y1="320" x2="334" y2="296" stroke="#27ae60" stroke-width="1.5"/>\n  <line x1="334" y1="296" x2="354" y2="296" stroke="#27ae60" stroke-width="1.5"/>\n  <line x1="334" y1="320" x2="354" y2="320" stroke="#27ae60" stroke-width="1.5"/>\n  <line x1="354" y1="296" x2="358" y2="320" stroke="#27ae60" stroke-width="1.5"/>\n  <line x1="354" y1="320" x2="358" y2="296" stroke="#27ae60" stroke-width="1.5"/>\n  <line x1="358" y1="296" x2="378" y2="296" stroke="#27ae60" stroke-width="1.5"/>\n  <line x1="358" y1="320" x2="378" y2="320" stroke="#27ae60" stroke-width="1.5"/>\n  <line x1="378" y1="296" x2="382" y2="320" stroke="#27ae60" stroke-width="1.5"/>\n  <line x1="378" y1="320" x2="382" y2="296" stroke="#27ae60" stroke-width="1.5"/>\n  <line x1="382" y1="296" x2="402" y2="296" stroke="#27ae60" stroke-width="1.5"/>\n  <line x1="382" y1="320" x2="402" y2="320" stroke="#27ae60" stroke-width="1.5"/>\n  <line x1="402" y1="296" x2="406" y2="320" stroke="#27ae60" stroke-width="1.5"/>\n  <line x1="402" y1="320" x2="406" y2="296" stroke="#27ae60" stroke-width="1.5"/>\n  <line x1="406" y1="296" x2="426" y2="296" stroke="#27ae60" stroke-width="1.5"/>\n  <line x1="406" y1="320" x2="426" y2="320" stroke="#27ae60" stroke-width="1.5"/>\n  <line x1="426" y1="296" x2="430" y2="320" stroke="#27ae60" stroke-width="1.5"/>\n  <line x1="426" y1="320" x2="430" y2="296" stroke="#27ae60" stroke-width="1.5"/>\n  <line x1="430" y1="296" x2="450" y2="296" stroke="#27ae60" stroke-width="1.5"/>\n  <line x1="430" y1="320" x2="450" y2="320" stroke="#27ae60" stroke-width="1.5"/>\n  <line x1="450" y1="296" x2="454" y2="320" stroke="#27ae60" stroke-width="1.5"/>\n  <line x1="450" y1="320" x2="454" y2="296" stroke="#27ae60" stroke-width="1.5"/>\n  <line x1="454" y1="296" x2="474" y2="296" stroke="#27ae60" stroke-width="1.5"/>\n  <line x1="454" y1="320" x2="474" y2="320" stroke="#27ae60" stroke-width="1.5"/>\n  <line x1="474" y1="296" x2="478" y2="320" stroke="#27ae60" stroke-width="1.5"/>\n  <line x1="474" y1="320" x2="478" y2="296" stroke="#27ae60" stroke-width="1.5"/>\n  <line x1="478" y1="296" x2="498" y2="296" stroke="#27ae60" stroke-width="1.5"/>\n  <line x1="478" y1="320" x2="498" y2="320" stroke="#27ae60" stroke-width="1.5"/>\n  <line x1="498" y1="296" x2="502" y2="320" stroke="#27ae60" stroke-width="1.5"/>\n  <line x1="498" y1="320" x2="502" y2="296" stroke="#27ae60" stroke-width="1.5"/>\n  <line x1="502" y1="296" x2="522" y2="296" stroke="#27ae60" stroke-width="1.5"/>\n  <line x1="502" y1="320" x2="522" y2="320" stroke="#27ae60" stroke-width="1.5"/>\n  <line x1="522" y1="296" x2="526" y2="320" stroke="#27ae60" stroke-width="1.5"/>\n  <line x1="522" y1="320" x2="526" y2="296" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Біти MOSI -->
  <text x="114" y="312" font-size="12" fill="#1a1a1a" text-anchor="middle">D7</text>\n  <text x="138" y="312" font-size="12" fill="#1a1a1a" text-anchor="middle">D6</text>\n  <text x="162" y="312" font-size="12" fill="#1a1a1a" text-anchor="middle">D5</text>\n  <text x="186" y="312" font-size="12" fill="#1a1a1a" text-anchor="middle">D4</text>\n  <text x="210" y="312" font-size="12" fill="#1a1a1a" text-anchor="middle">D3</text>\n  <text x="234" y="312" font-size="12" fill="#1a1a1a" text-anchor="middle">D2</text>\n  <text x="258" y="312" font-size="12" fill="#1a1a1a" text-anchor="middle">D1</text>\n  <text x="282" y="312" font-size="12" fill="#1a1a1a" text-anchor="middle">D0</text>
  <text x="344" y="312" font-size="12" fill="#1a1a1a" text-anchor="middle">D7</text>\n  <text x="368" y="312" font-size="12" fill="#1a1a1a" text-anchor="middle">D6</text>\n  <text x="392" y="312" font-size="12" fill="#1a1a1a" text-anchor="middle">D5</text>\n  <text x="416" y="312" font-size="12" fill="#1a1a1a" text-anchor="middle">D4</text>\n  <text x="440" y="312" font-size="12" fill="#1a1a1a" text-anchor="middle">D3</text>\n  <text x="464" y="312" font-size="12" fill="#1a1a1a" text-anchor="middle">D2</text>\n  <text x="488" y="312" font-size="12" fill="#1a1a1a" text-anchor="middle">D1</text>\n  <text x="512" y="312" font-size="12" fill="#1a1a1a" text-anchor="middle">D0</text>

  <!-- Пояснення внизу лівої панелі -->
  <text x="40" y="348" font-size="12" font-weight="bold" fill="#2457d6">• Режим Mode 0 (CPOL=0, CPHA=0):</text>
  <text x="260" y="348" font-size="12" fill="#1a1a1a">SCK спокійний LOW; вибірка на передньому фронті</text>

  <text x="40" y="368" font-size="12" font-weight="bold" fill="#c0392b">• Байт команди (D/C = 0):</text>
  <text x="260" y="368" font-size="12" fill="#1a1a1a">0x2A розпізнається як опкод запису вікна (CASET)</text>

  <text x="40" y="388" font-size="12" font-weight="bold" fill="#27ae60">• Байт даних (D/C = 1):</text>
  <text x="260" y="388" font-size="12" fill="#1a1a1a">передає значення параметра (XS[15..8] = 0x00)</text>

  <rect x="40" y="404" width="518" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="299" y="420" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Зміна D/C виконується ДО висхідного фронту SCK (t_setup ≥ 10 нс)</text>

  <!-- ПРАВА ПАНЕЛЬ: 3 картки -->
  <!-- Картка 1: SPI Mode 0 -->
  <rect x="590" y="68" width="346" height="116" rx="8" fill="#eaf0fd" stroke="#2457d6"/>
  <rect x="602" y="78" width="322" height="24" rx="4" fill="#ffffff" stroke="#2457d6"/>
  <text x="763" y="94" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">1. Параметри SPI Mode 0</text>
  <text x="606" y="118" font-size="12" font-weight="bold" fill="#1a1a1a">• CPOL = 0 (Clock Polarity):</text>
  <text x="618" y="134" font-size="12" fill="#6b7280">Лінія SCK у стані спокою має рівень LOW (0 В).</text>
  <text x="606" y="152" font-size="12" font-weight="bold" fill="#2457d6">• CPHA = 0 (Clock Phase):</text>
  <text x="618" y="168" font-size="12" fill="#1a1a1a">Вибірка даних — на 1-му (висхідному) фронті SCK.</text>

  <!-- Картка 2: Часові інтервали D/C -->
  <rect x="590" y="198" width="346" height="132" rx="8" fill="#e9f7ef" stroke="#27ae60"/>
  <rect x="602" y="208" width="322" height="24" rx="4" fill="#ffffff" stroke="#27ae60"/>
  <text x="763" y="225" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">2. Часові інтервали лінії D/C</text>
  <text x="606" y="248" font-size="12" font-weight="bold" fill="#1a1a1a">• Час встановлення (t_setup ≥ 10 нс):</text>
  <text x="618" y="266" font-size="12" fill="#6b7280">Рівень D/C фіксується до першого такту SCK.</text>
  <text x="606" y="286" font-size="12" font-weight="bold" fill="#27ae60">• Час утримання (t_hold ≥ 10 нс):</text>
  <text x="618" y="304" font-size="12" fill="#1a1a1a">D/C не можна перемикати під час передачі 8 біт.</text>
  <text x="618" y="320" font-size="12" font-weight="bold" fill="#27ae60">Запобігає розпізнаванню даних як команд.</text>

  <!-- Картка 3: Керування в драйвері -->
  <rect x="590" y="344" width="346" height="100" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>
  <rect x="602" y="354" width="322" height="22" rx="4" fill="#ffffff" stroke="#1a1a1a"/>
  <text x="763" y="370" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3. Керування в коді драйвера</text>
  <text x="606" y="390" font-size="12" font-weight="bold" fill="#1a1a1a">• Передача байта команди:</text>
  <text x="618" y="406" font-size="12" fill="#c0392b">gpio_set_low(DC); spi_write_byte(cmd);</text>
  <text x="606" y="422" font-size="12" font-weight="bold" fill="#1a1a1a">• Передача байтів даних / DMA:</text>
  <text x="618" y="438" font-size="12" fill="#27ae60">gpio_set_high(DC); spi_write_stream(buf);</text>
</svg>
