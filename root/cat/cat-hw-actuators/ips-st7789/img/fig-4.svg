<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <!-- Arrow markers -->
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Порівняння 7-вивідного та 8-вивідного модулів IPS 1.3″ ST7789</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Апаратне заземлення CS на 7-вивідній платі проти повноцінного вибору кристала для мультиплексування SPI</text>

  <!-- ==================== LEFT: MODULE COMPARISON ==================== -->

  <!-- PANEL 1: 7-Pin Module (CS Hardwired to GND) -->
  <rect x="50" y="76" width="255" height="316" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.2"/>
  <rect x="50" y="76" width="255" height="26" rx="6" fill="#fdecea"/>
  <text x="177" y="94" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">7-вивідна плата (CS на GND)</text>

  <!-- 7-Pin Header Rows -->
  <rect x="62" y="110" width="56" height="18" rx="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="90" y="124" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. GND</text>

  <rect x="62" y="132" width="56" height="18" rx="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="90" y="146" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. VCC</text>

  <rect x="62" y="154" width="56" height="18" rx="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="90" y="168" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3. SCL</text>

  <rect x="62" y="176" width="56" height="18" rx="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="90" y="190" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">4. SDA</text>

  <rect x="62" y="198" width="56" height="18" rx="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="90" y="212" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">5. RES</text>

  <rect x="62" y="220" width="56" height="18" rx="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="90" y="234" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">6. DC</text>

  <rect x="62" y="242" width="56" height="18" rx="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="90" y="256" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">7. BLK</text>

  <!-- ST7789 Controller Box (Panel 1) -->
  <rect x="140" y="110" width="150" height="150" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="215" y="128" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Контролер ST7789</text>
  <text x="215" y="146" font-size="12" fill="#6b7280" text-anchor="middle">Внутрішня розводка</text>

  <!-- CS to GND Short Circuit Scheme -->
  <rect x="150" y="194" width="38" height="20" rx="3" fill="#fdecea" stroke="#c0392b"/>
  <text x="169" y="209" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">CS</text>

  <rect x="238" y="194" width="42" height="20" rx="3" fill="#f4f6f8" stroke="#1a1a1a"/>
  <text x="259" y="209" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GND</text>

  <!-- Copper Trace Bridge -->
  <line x1="188" y1="204" x2="238" y2="204" stroke="#c0392b" stroke-width="3"/>
  <circle cx="213" cy="204" r="3.5" fill="#c0392b"/>

  <text x="215" y="234" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Доріжка на GND</text>
  <text x="215" y="248" font-size="12" fill="#6b7280" text-anchor="middle">CS = 0 постійно</text>

  <!-- Warning Box 7-Pin -->
  <rect x="58" y="278" width="239" height="104" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="177" y="296" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">⛔ Неможливість спільної шини</text>
  <text x="177" y="314" font-size="12" fill="#1a1a1a" text-anchor="middle">ST7789 постійно активний і слухає SCK.</text>
  <text x="177" y="332" font-size="12" fill="#6b7280" text-anchor="middle">При роботі з SD-картою екран сприймає</text>
  <text x="177" y="350" font-size="12" fill="#6b7280" text-anchor="middle">її дані як графіку (хаос і зрив кадру).</text>
  <text x="177" y="368" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Вимагає окремої виділеної шини SPI.</text>

  <!-- PANEL 2: 8-Pin Module (Dedicated CS Pin) -->
  <rect x="325" y="76" width="255" height="316" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.2"/>
  <rect x="325" y="76" width="255" height="26" rx="6" fill="#e9f7ef"/>
  <text x="452" y="94" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">8-вивідна плата (Окремий CS)</text>

  <!-- 8-Pin Header Rows -->
  <rect x="337" y="108" width="56" height="18" rx="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="365" y="122" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. GND</text>

  <rect x="337" y="128" width="56" height="18" rx="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="365" y="142" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. VCC</text>

  <rect x="337" y="148" width="56" height="18" rx="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="365" y="162" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3. SCL</text>

  <rect x="337" y="168" width="56" height="18" rx="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="365" y="182" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">4. SDA</text>

  <rect x="337" y="188" width="56" height="18" rx="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="365" y="202" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">5. RES</text>

  <rect x="337" y="208" width="56" height="18" rx="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="365" y="222" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">6. DC</text>

  <!-- Pin 7 CS (Highlighted in Green) -->
  <rect x="337" y="228" width="56" height="18" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="365" y="242" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">7. CS</text>

  <rect x="337" y="248" width="56" height="18" rx="3" fill="#ffffff" stroke="#d0d7de"/>
  <text x="365" y="262" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">8. BLK</text>

  <!-- ST7789 Controller Box (Panel 2) -->
  <rect x="415" y="108" width="150" height="158" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="490" y="126" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Контролер ST7789</text>
  <text x="490" y="144" font-size="12" fill="#6b7280" text-anchor="middle">Вільне керування CS</text>

  <!-- CS Trace to Header -->
  <rect x="425" y="206" width="38" height="20" rx="3" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="444" y="221" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">CS</text>

  <path d="M 393,237 L 409,237 L 409,216 L 425,216" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <text x="495" y="236" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Виведено на гребінку</text>
  <text x="495" y="252" font-size="12" fill="#6b7280" text-anchor="middle">CS = 0 (увімк), 1 (вимк)</text>

  <!-- Success Box 8-Pin -->
  <rect x="333" y="278" width="239" height="104" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="452" y="296" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">✓ Повне мультиплексування SPI</text>
  <text x="452" y="314" font-size="12" fill="#1a1a1a" text-anchor="middle">При CS = 1 дисплей ігнорує SCL та SDA.</text>
  <text x="452" y="332" font-size="12" fill="#6b7280" text-anchor="middle">Спільна шина SPI легко ділиться з:</text>
  <text x="452" y="350" font-size="12" fill="#6b7280" text-anchor="middle">SD-картою, флеш-пам'яттю, сенсорами.</text>
  <text x="452" y="368" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Економія 3 GPIO пінів мікроконтролера!</text>

  <!-- Bottom Result Banner -->
  <rect x="50" y="404" width="530" height="30" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="315" y="424" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Рекомендація: для проєктів із кількома SPI-пристроями обирайте лише 8-вивідну версію</text>

  <!-- ==================== RIGHT: ENGINEERING CARDS ==================== -->

  <!-- Card 1: 7-Pin Trap -->
  <rect x="600" y="76" width="330" height="110" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1.2"/>
  <rect x="600" y="76" width="330" height="26" rx="6" fill="#fdecea"/>
  <text x="612" y="94" font-size="13" font-weight="bold" fill="#c0392b">1. Апаратна пастка 7-вивідної плати</text>

  <text x="612" y="118" font-size="12" font-weight="bold" fill="#1a1a1a">Постійно активний вибір кристала</text>
  <text x="612" y="136" font-size="12" fill="#6b7280">Виробник зекономив 1 пін, запаявши CS</text>
  <text x="612" y="154" font-size="12" fill="#6b7280">на землю на зворотній стороні плати.</text>
  <text x="612" y="172" font-size="12" font-weight="bold" fill="#c0392b">Колізії шини неминучі при додаванні SD-карти.</text>

  <!-- Card 2: SPI Multiplexing -->
  <rect x="600" y="198" width="330" height="110" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.2"/>
  <rect x="600" y="198" width="330" height="26" rx="6" fill="#e9f7ef"/>
  <text x="612" y="216" font-size="13" font-weight="bold" fill="#27ae60">2. Мультиплексування шини SPI</text>

  <text x="612" y="240" font-size="12" font-weight="bold" fill="#1a1a1a">Ізоляція через високий рівень CS</text>
  <text x="612" y="258" font-size="12" fill="#6b7280">В 8-вивідній версії CS керується GPIO.</text>
  <text x="612" y="276" font-size="12" fill="#6b7280">Коли CS = 1, вхідний буфер дисплея закрито,</text>
  <text x="612" y="294" font-size="12" font-weight="bold" fill="#27ae60">що дозволяє безпечний обмін з іншими чипами.</text>

  <!-- Card 3: Hardware Hack -->
  <rect x="600" y="320" width="330" height="110" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.2"/>
  <rect x="600" y="320" width="330" height="26" rx="6" fill="#eaf0fd"/>
  <text x="602" y="338" font-size="13" font-weight="bold" fill="#2457d6">3. Апаратне доопрацювання (хак)</text>

  <text x="602" y="362" font-size="12" font-weight="bold" fill="#1a1a1a">Як врятувати 7-вивідну плату</text>
  <text x="602" y="380" font-size="12" fill="#6b7280">Потрібно скальпелем перерізати доріжку</text>
  <text x="602" y="398" font-size="12" fill="#6b7280">між контактом CS шлейфа матриці та GND</text>
  <text x="602" y="416" font-size="12" font-weight="bold" fill="#2457d6">і підпаяти тонкий емальований дріт до MCU.</text>
</svg>
