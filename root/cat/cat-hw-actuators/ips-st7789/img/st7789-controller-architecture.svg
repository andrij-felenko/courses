<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Внутрішня структура контролера ST7789 та мапінг матриці 240×240</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Пам'ять 240×320 містить 80 непідключених рядків — джерело апаратного зсуву адресації (offset 80)</text>

  <!-- ================= 1. МІКРОКОНТРОЛЕР ХОСТА ================= -->
  <rect x="24" y="80" width="112" height="424" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="80" y="103" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Хост (MCU)</text>

  <!-- Призначення пінів хоста -->
  <text x="80" y="148" font-size="12" fill="#6b7280" text-anchor="middle">Шина керування</text>

  <text x="122" y="196" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">SCLK</text>
  <text x="122" y="238" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">MOSI</text>
  <text x="122" y="280" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">CS</text>
  <text x="122" y="322" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">DC</text>
  <text x="122" y="364" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">RST</text>

  <text x="80" y="444" font-size="12" fill="#6b7280" text-anchor="middle">Швидкісний SPI</text>
  <text x="80" y="464" font-size="12" fill="#6b7280" text-anchor="middle">до 62.5 МГц</text>
  <text x="80" y="484" font-size="12" fill="#6b7280" text-anchor="middle">Рівні 3.3 В</text>

  <!-- Лінії зв'язку Host -> ST7789 -->
  <line x1="136" y1="192" x2="194" y2="192" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="136" y1="234" x2="194" y2="234" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="136" y1="276" x2="194" y2="276" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="136" y1="318" x2="194" y2="318" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="136" y1="360" x2="194" y2="360" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- ================= 2. КРИСТАЛ ST7789 ================= -->
  <rect x="186" y="80" width="496" height="424" fill="#f8fafc" stroke="#2457d6" stroke-width="1.5" rx="8"/>
  <text x="202" y="103" font-size="13" font-weight="bold" fill="#2457d6">Кристал контролера ST7789 (масив 240RGB × 320)</text>

  <!-- 2.1 Інтерфейс хоста та декодер команд -->
  <rect x="198" y="118" width="142" height="114" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="5"/>
  <text x="269" y="138" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Інтерфейс хоста</text>
  <text x="269" y="156" font-size="12" fill="#6b7280" text-anchor="middle">4-провідний SPI</text>
  <text x="269" y="176" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Декодер команд</text>
  <text x="269" y="196" font-size="12" fill="#1a1a1a" text-anchor="middle">CASET, RASET, RAMWR</text>
  <text x="269" y="216" font-size="12" fill="#6b7280" text-anchor="middle">Регістри та логіка</text>

  <!-- 2.2 Схема живлення та помножувачі -->
  <rect x="198" y="244" width="142" height="122" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="5"/>
  <text x="269" y="264" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема живлення</text>
  <text x="269" y="282" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Помножувачі напруги</text>
  <text x="269" y="302" font-size="12" fill="#1a1a1a" text-anchor="middle">Виходи VGH (+15 В)</text>
  <text x="269" y="320" font-size="12" fill="#1a1a1a" text-anchor="middle">Виходи VGL (-10 В)</text>
  <text x="269" y="338" font-size="12" fill="#1a1a1a" text-anchor="middle">Регулятор VCOM</text>
  <text x="269" y="356" font-size="12" fill="#6b7280" text-anchor="middle">Живлення матриці IPS</text>

  <!-- 2.3 Контролер TCON і таймінги -->
  <rect x="198" y="378" width="142" height="114" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="5"/>
  <text x="269" y="400" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Контролер TCON</text>
  <text x="269" y="420" font-size="12" fill="#6b7280" text-anchor="middle">RC-генератор такту</text>
  <text x="269" y="440" font-size="12" fill="#1a1a1a" text-anchor="middle">Таймінги розгортки</text>
  <text x="269" y="460" font-size="12" fill="#1a1a1a" text-anchor="middle">Формування кадрів</text>
  <text x="269" y="480" font-size="12" fill="#6b7280" text-anchor="middle">Лічильник рядків</text>

  <!-- Зв'язок Інтерфейс хоста -> GRAM -->
  <line x1="340" y1="172" x2="354" y2="172" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- 2.4 Драйвери стовпців (Source Drivers) -->
  <rect x="356" y="118" width="150" height="48" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="5"/>
  <text x="431" y="138" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Драйвери стовпців</text>
  <text x="431" y="154" font-size="12" fill="#1a1a1a" text-anchor="middle">Source: 240 × RGB</text>

  <!-- 2.5 GRAM - Активна зона 240 рядків (0..239) -->
  <rect x="356" y="180" width="150" height="234" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="5"/>
  <text x="431" y="202" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Відеопам'ять GRAM</text>
  <text x="431" y="220" font-size="12" fill="#6b7280" text-anchor="middle">Разом 240×320×18 біт</text>
  <text x="431" y="240" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Активна: 240 × 240</text>
  <text x="431" y="258" font-size="12" fill="#27ae60" text-anchor="middle">Рядки Y = 0 ... 239</text>
  <text x="431" y="282" font-size="12" fill="#6b7280" text-anchor="middle">Формати кольору:</text>
  <text x="431" y="300" font-size="12" fill="#1a1a1a" text-anchor="middle">RGB565 (16 біт/пікс)</text>
  <text x="431" y="318" font-size="12" fill="#1a1a1a" text-anchor="middle">RGB666 (18 біт/пікс)</text>
  <text x="431" y="346" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Адресні покажчики</text>
  <text x="431" y="364" font-size="12" fill="#1a1a1a" text-anchor="middle">CASET: 0 → 239</text>
  <text x="431" y="382" font-size="12" fill="#1a1a1a" text-anchor="middle">RASET: 0 → 239</text>
  <text x="431" y="402" font-size="12" fill="#27ae60" text-anchor="middle">Повний збіг зі склом</text>

  <!-- 2.6 GRAM - Невикористана зона 80 рядків (240..319) -->
  <rect x="356" y="426" width="150" height="66" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3" rx="5"/>
  <text x="431" y="446" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Надлишкова пам'ять</text>
  <text x="431" y="464" font-size="12" fill="#1a1a1a" text-anchor="middle">240 × 80 × 18 біт</text>
  <text x="431" y="482" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Рядки Y = 240 ... 319</text>

  <!-- 2.7 Драйвери рядків (Gate Drivers) - Активні 240 ліній -->
  <rect x="524" y="180" width="144" height="234" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="5"/>
  <text x="596" y="202" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Драйвери рядків</text>
  <text x="596" y="220" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Gate Drivers 0..239</text>
  <text x="596" y="246" font-size="12" fill="#27ae60" text-anchor="middle">240 активних ліній</text>
  <text x="596" y="270" font-size="12" fill="#1a1a1a" text-anchor="middle">Почерковий вибір</text>
  <text x="596" y="288" font-size="12" fill="#1a1a1a" text-anchor="middle">Рядки G0 ... G239</text>
  <text x="596" y="316" font-size="12" fill="#6b7280" text-anchor="middle">Комутація TFT</text>
  <text x="596" y="334" font-size="12" fill="#6b7280" text-anchor="middle">Рівні VGH / VGL</text>
  <text x="596" y="368" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Підключено до скла</text>
  <text x="596" y="388" font-size="12" fill="#6b7280" text-anchor="middle">через шлейф FPC</text>
  <text x="596" y="404" font-size="12" fill="#27ae60" text-anchor="middle">240 ліній розгортки</text>

  <!-- 2.8 Драйвери рядків - Непідключені 80 ліній -->
  <rect x="524" y="426" width="144" height="66" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3" rx="5"/>
  <text x="596" y="446" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Gate Drivers 240..319</text>
  <text x="596" y="464" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">80 виходів NC (обрив)</text>
  <text x="596" y="482" font-size="12" fill="#6b7280" text-anchor="middle">Не виведені на скло</text>

  <!-- Зв'язок GRAM -> Gate Drivers -->
  <line x1="506" y1="298" x2="522" y2="298" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="506" y1="460" x2="522" y2="460" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>

  <!-- ================= 3. МОДУЛЬ IPS-МАТРИЦІ ================= -->
  <rect x="716" y="80" width="220" height="424" fill="#f8fafc" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="732" y="103" font-size="13" font-weight="bold" fill="#1a1a1a">Модуль IPS 1.3″ (240×240)</text>

  <!-- 3.1 Приймач стовпців модуля -->
  <rect x="726" y="118" width="200" height="48" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="5"/>
  <text x="826" y="138" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Контактний шлейф FPC</text>
  <text x="826" y="154" font-size="12" fill="#1a1a1a" text-anchor="middle">Вхід 240 стовпців RGB</text>

  <!-- Шина даних Source -> IPS Panel -->
  <line x1="506" y1="142" x2="724" y2="142" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="612" y="134" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">240 × RGB стовпців</text>

  <!-- 3.2 Активна зона екрана (240x240) -->
  <rect x="726" y="180" width="200" height="234" fill="#ffffff" stroke="#27ae60" stroke-width="2" rx="5"/>
  <rect x="726" y="180" width="200" height="26" fill="#e9f7ef" rx="5"/>
  <text x="826" y="198" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Активне поле відображення</text>

  <text x="826" y="228" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">240 стовпців × 240 рядків</text>
  <text x="826" y="246" font-size="12" fill="#6b7280" text-anchor="middle">Фізичне скло дисплея</text>
  <text x="826" y="272" font-size="12" fill="#1a1a1a" text-anchor="middle">Кути огляду 178° (IPS)</text>
  <text x="826" y="290" font-size="12" fill="#1a1a1a" text-anchor="middle">True Color RGB565 / 65K</text>
  <text x="826" y="318" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Gate 0..239 керують TFT</text>
  <text x="826" y="338" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Source 0..239 несуть дані</text>
  <text x="826" y="370" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Видиме зображення</text>
  <text x="826" y="388" font-size="12" fill="#1a1a1a" text-anchor="middle">Координати: (0,0) → (239,239)</text>
  <text x="826" y="404" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Без апаратного зсуву</text>

  <!-- 3.3 Фізично відсутня зона екрана (область 80 рядків) -->
  <rect x="726" y="426" width="200" height="66" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3" rx="5"/>
  <text x="826" y="446" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Фізично ВІДСУТНЯ зона</text>
  <text x="826" y="464" font-size="12" fill="#c0392b" text-anchor="middle">Скло має лише 240 рядків</text>
  <text x="826" y="482" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Апаратний зсув: offset 80</text>

  <!-- Лінії Gate 0..239 -> IPS Display -->
  <line x1="668" y1="240" x2="724" y2="240" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="668" y1="298" x2="724" y2="298" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="668" y1="360" x2="724" y2="360" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Лінія непідключених 80 рядків із хрестиком розриву -->
  <line x1="668" y1="460" x2="702" y2="460" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="706" y1="454" x2="718" y2="466" stroke="#c0392b" stroke-width="2"/>
  <line x1="718" y1="454" x2="706" y2="466" stroke="#c0392b" stroke-width="2"/>
</svg>
