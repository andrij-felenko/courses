<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка полотна -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Механічні напруження та радіус вигину шлейфа FPC</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Розтяг і стиск у шарах полііміду, нейтральна лінія міді та захист кромки скла</text>

  <!-- ==================== ПАНЕЛЬ 1 ==================== -->
  <rect x="24" y="72" width="285" height="366" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="166" y="94" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Структура FPC та епюра σ</text>
  <text x="166" y="111" font-size="12" fill="#6b7280" text-anchor="middle">Мідь Cu на нейтральній осі (σ = 0)</text>

  <!-- Блок діаграми шарів та епюри -->
  <rect x="36" y="124" width="261" height="144" rx="6" ry="6" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Шари сендвіча -->
  <rect x="46" y="140" width="106" height="22" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="99" y="156" font-size="12" fill="#1a1a1a" text-anchor="middle">Coverlay (PI)</text>

  <rect x="46" y="162" width="106" height="16" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="99" y="174" font-size="12" fill="#6b7280" text-anchor="middle">Адгезив</text>

  <rect x="46" y="178" width="106" height="24" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="99" y="195" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Cu фольга 18 мкм</text>

  <rect x="46" y="202" width="106" height="16" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="99" y="214" font-size="12" fill="#6b7280" text-anchor="middle">Адгезив</text>

  <rect x="46" y="218" width="106" height="22" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="99" y="234" font-size="12" fill="#1a1a1a" text-anchor="middle">Base PI (основа)</text>

  <!-- Епюра напружень σ -->
  <text x="202" y="137" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">σ = 0</text>
  <line x1="202" y1="139" x2="202" y2="241" stroke="#6b7280" stroke-dasharray="2 2"/>

  <!-- Трикутник розтягу (σ > 0) -->
  <polygon points="202,190 232,140 202,140" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <line x1="202" y1="152" x2="228" y2="152" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="238" y="149" font-size="12" font-weight="bold" fill="#c0392b">σ &gt; 0</text>
  <text x="238" y="163" font-size="12" fill="#c0392b">Розтяг</text>

  <!-- Нейтральна лінія -->
  <line x1="152" y1="190" x2="230" y2="190" stroke="#2457d6" stroke-dasharray="3 3"/>
  <text x="238" y="187" font-size="12" font-weight="bold" fill="#1a1a1a">Нейтр.</text>
  <text x="238" y="201" font-size="12" fill="#6b7280">лінія</text>

  <!-- Трикутник стиску (σ < 0) -->
  <polygon points="202,190 172,240 202,240" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <line x1="202" y1="228" x2="176" y2="228" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="238" y="225" font-size="12" font-weight="bold" fill="#2457d6">σ &lt; 0</text>
  <text x="238" y="239" font-size="12" fill="#2457d6">Стиск</text>

  <!-- Блок пояснень до панелі 1 -->
  <rect x="36" y="282" width="261" height="142" rx="6" ry="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="48" y="302" font-size="13" font-weight="bold" fill="#1a1a1a">Фізика вигину шлейфа:</text>

  <circle cx="52" cy="320" r="3" fill="#2457d6"/>
  <text x="62" y="324" font-size="12" font-weight="bold" fill="#1a1a1a">Нейтральна вісь (σ = 0):</text>
  <text x="62" y="339" font-size="12" fill="#6b7280">Деформація ε = 0, зсуву нема</text>

  <circle cx="52" cy="359" r="3" fill="#27ae60"/>
  <text x="62" y="363" font-size="12" font-weight="bold" fill="#1a1a1a">Мідь Cu — у центрі пакета:</text>
  <text x="62" y="378" font-size="12" fill="#6b7280">Симетрія PI захищає провідник</text>

  <circle cx="52" cy="398" r="3" fill="#c0392b"/>
  <text x="62" y="402" font-size="12" font-weight="bold" fill="#1a1a1a">Зовнішні шари (поліімід):</text>
  <text x="62" y="417" font-size="12" fill="#6b7280">Приймають макс. розтяг і стиск</text>

  <!-- ==================== ПАНЕЛЬ 2 ==================== -->
  <rect x="325" y="72" width="295" height="366" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="472" y="94" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Радіус вигину: норма vs перегин</text>
  <text x="472" y="111" font-size="12" fill="#6b7280" text-anchor="middle">Вимога R ≥ 10×h для ресурсу &gt; 100k</text>

  <!-- Картка «Так» (правильний вигин) -->
  <rect x="337" y="124" width="271" height="144" rx="6" ry="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="347" y="130" width="62" height="18" rx="3" ry="3" fill="#27ae60"/>
  <text x="378" y="143" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ТАК</text>
  <text x="417" y="143" font-size="12" font-weight="bold" fill="#27ae60">R ≥ 1.0–1.5 мм</text>

  <!-- Схема плавного вигину -->
  <!-- Тіло шлейфа (поліімід) -->
  <path d="M 436,170 L 392,170 A 30 30 0 0 0 392,230 L 436,230 L 436,218 L 392,218 A 18 18 0 0 1 392,182 L 436,182 Z" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <!-- Мідна доріжка всередині -->
  <path d="M 436,176 L 392,176 A 24 24 0 0 0 392,224 L 436,224" fill="none" stroke="#2457d6" stroke-width="2"/>
  <!-- Радіус стрілка -->
  <circle cx="392" cy="200" r="2" fill="#27ae60"/>
  <line x1="392" y1="200" x2="376" y2="200" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="408" y="204" font-size="12" font-weight="bold" fill="#27ae60">R</text>

  <!-- Текстовий опис для «Так» -->
  <text x="444" y="167" font-size="12" font-weight="bold" fill="#1a1a1a">R ≥ 10 × h (товщини)</text>
  <text x="444" y="185" font-size="12" fill="#27ae60">ε &lt; 0.3% — пружна зона</text>
  <text x="444" y="203" font-size="12" fill="#1a1a1a">Мідь не втомлюється</text>
  <text x="444" y="223" font-size="12" font-weight="bold" fill="#27ae60">Ресурс: &gt; 100 000</text>
  <text x="444" y="239" font-size="12" fill="#6b7280">циклів вигинання</text>

  <!-- Картка «Не так» (гострий перегин) -->
  <rect x="337" y="282" width="271" height="142" rx="6" ry="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="347" y="290" width="62" height="18" rx="3" ry="3" fill="#c0392b"/>
  <text x="378" y="303" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">НЕ ТАК</text>
  <text x="417" y="303" font-size="12" font-weight="bold" fill="#c0392b">Перегин (R ≈ 0)</text>

  <!-- Схема зламу шлейфа -->
  <!-- Тіло шлейфа зі зламом -->
  <path d="M 436,334 L 372,354 L 436,374 L 436,362 L 386,354 L 436,346 Z" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <!-- Тріщина в міді -->
  <path d="M 436,340 L 382,354" fill="none" stroke="#2457d6" stroke-width="2"/>
  <path d="M 436,368 L 382,354" fill="none" stroke="#2457d6" stroke-width="2"/>
  <!-- Маркер концентрації напружень -->
  <circle cx="372" cy="354" r="8" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="2 2"/>
  <text x="350" y="338" font-size="12" font-weight="bold" fill="#c0392b">Злам</text>
  <line x1="362" y1="340" x2="370" y2="348" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Текстовий опис для «Не так» -->
  <text x="444" y="327" font-size="12" font-weight="bold" fill="#c0392b">R &lt; 0.5 мм (зминання)</text>
  <text x="444" y="345" font-size="12" fill="#c0392b">ε &gt;&gt; 0.3% — пластичність</text>
  <text x="444" y="363" font-size="12" fill="#1a1a1a">Мікротріщини у фользі</text>
  <text x="444" y="383" font-size="12" font-weight="bold" fill="#c0392b">Швидкий обрив ліній</text>
  <text x="444" y="399" font-size="12" fill="#6b7280">Втрата SPI або живлення</text>

  <!-- ==================== ПАНЕЛЬ 3 ==================== -->
  <rect x="636" y="72" width="300" height="366" rx="8" ry="8" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="786" y="94" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3. Вузол ACF та кромка скла</text>
  <text x="786" y="111" font-size="12" fill="#6b7280" text-anchor="middle">Зріз на кромці та фіксація шлейфа</text>

  <!-- Схема вузла монтажу -->
  <rect x="648" y="124" width="276" height="144" rx="6" ry="6" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Скляна підкладка дисплея -->
  <rect x="660" y="150" width="126" height="24" rx="2" ry="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="708" y="166" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Скло дисплея</text>

  <!-- ACF майданчик -->
  <rect x="746" y="144" width="40" height="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="766" y="138" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">ACF</text>

  <!-- FPC шлейф навколо кромки -->
  <path d="M 746,140 L 794,140 A 20 20 0 0 1 814,160 L 814,178 A 18 18 0 0 1 796,196 L 664,196 L 664,186 L 796,186 A 8 8 0 0 0 804,178 L 804,160 A 10 10 0 0 0 794,150 L 746,150 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>

  <!-- Мідна доріжка у шлейфі -->
  <path d="M 746,145 L 794,145 A 15 15 0 0 1 809,160 L 809,178 A 13 13 0 0 1 796,191 L 664,191" fill="none" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Клейка стрічка фіксації до тилу дисплея -->
  <rect x="674" y="196" width="76" height="8" rx="1" ry="1" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="712" y1="210" x2="712" y2="205" stroke="#27ae60" stroke-width="1.2" marker-end="url(#arr-green)"/>
  <text x="712" y="224" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Фіксуюча стрічка</text>

  <!-- Позначення кромки скла -->
  <circle cx="786" cy="174" r="5" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <text x="826" y="152" font-size="12" font-weight="bold" fill="#c0392b">Кромка:</text>
  <text x="826" y="167" font-size="12" fill="#c0392b">ризик зрізу</text>
  <text x="826" y="182" font-size="12" fill="#c0392b">та відриву</text>
  <line x1="820" y1="165" x2="793" y2="172" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arr-red)"/>

  <!-- Блок рекомендацій до панелі 3 -->
  <rect x="648" y="282" width="276" height="142" rx="6" ry="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="660" y="302" font-size="13" font-weight="bold" fill="#1a1a1a">Захист переходу на скло:</text>

  <circle cx="664" cy="320" r="3" fill="#c0392b"/>
  <text x="674" y="324" font-size="12" font-weight="bold" fill="#1a1a1a">Кромка скла — концентратор:</text>
  <text x="674" y="339" font-size="12" fill="#6b7280">Гострий край зрізає шари FPC</text>

  <circle cx="664" cy="359" r="3" fill="#2457d6"/>
  <text x="674" y="363" font-size="12" font-weight="bold" fill="#1a1a1a">З'єднання ACF крихке:</text>
  <text x="674" y="378" font-size="12" fill="#6b7280">Не витримує сил на відрив</text>

  <circle cx="664" cy="398" r="3" fill="#27ae60"/>
  <text x="674" y="402" font-size="12" font-weight="bold" fill="#1a1a1a">Обов'язкова стрічка до тилу:</text>
  <text x="674" y="417" font-size="12" fill="#6b7280">Знімає натяг з кореня шлейфа</text>
</svg>
