<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <linearGradient id="curve-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2457d6" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#2457d6" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Температурна залежність часу відгуку рідкокристалічної матриці IPS</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Експоненційне зростання обертальної в'язкості нематика при охолодженні спричиняє шлейфи та затримку кадрів</text>

  <!-- Фонове зонування графіка -->
  <rect x="80" y="100" width="120" height="270" fill="#fdecea" fill-opacity="0.55"/>
  <rect x="200" y="100" width="120" height="270" fill="#eaf0fd" fill-opacity="0.55"/>
  <rect x="320" y="100" width="300" height="270" fill="#e9f7ef" fill-opacity="0.55"/>

  <!-- Межі температурних зон -->
  <line x1="200" y1="100" x2="200" y2="370" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="320" y1="100" x2="320" y2="370" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Горизонтальні допоміжні лінії сітки -->
  <line x1="80" y1="145" x2="620" y2="145" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="80" y1="190" x2="620" y2="190" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="80" y1="235" x2="620" y2="235" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="80" y1="280" x2="620" y2="280" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="80" y1="325" x2="620" y2="325" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Поріг 60 Гц (16.7 мс) -->
  <line x1="80" y1="355" x2="620" y2="355" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="90" y="349" font-size="12" font-weight="bold" fill="#d97706">Поріг 60 Гц (16.7 мс — 1 кадр)</text>

  <!-- Затінення під кривою -->
  <path d="M 80.0 100.0 C 85.0 109.8, 100.0 141.2, 110.0 158.5 C 120.0 175.8, 130.0 190.0, 140.0 203.5 C 150.0 217.0, 160.0 229.0, 170.0 239.5 C 180.0 250.0, 190.0 258.2, 200.0 266.5 C 210.0 274.8, 220.0 282.2, 230.0 289.0 C 240.0 295.8, 245.0 300.6, 260.0 307.0 C 275.0 313.4, 300.0 322.1, 320.0 327.7 C 340.0 333.2, 365.0 337.3, 380.0 340.3 C 395.0 343.3, 400.0 344.4, 410.0 345.7 C 420.0 347.0, 425.0 347.3, 440.0 348.4 C 455.0 349.4, 480.0 350.8, 500.0 352.0 C 520.0 353.2, 540.0 354.6, 560.0 355.6 C 580.0 356.7, 610.0 357.9, 620.0 358.3 L 620 370 L 80 370 Z" fill="url(#curve-grad)"/>

  <!-- Основна крива часу відгуку -->
  <path d="M 80.0 100.0 C 85.0 109.8, 100.0 141.2, 110.0 158.5 C 120.0 175.8, 130.0 190.0, 140.0 203.5 C 150.0 217.0, 160.0 229.0, 170.0 239.5 C 180.0 250.0, 190.0 258.2, 200.0 266.5 C 210.0 274.8, 220.0 282.2, 230.0 289.0 C 240.0 295.8, 245.0 300.6, 260.0 307.0 C 275.0 313.4, 300.0 322.1, 320.0 327.7 C 340.0 333.2, 365.0 337.3, 380.0 340.3 C 395.0 343.3, 400.0 344.4, 410.0 345.7 C 420.0 347.0, 425.0 347.3, 440.0 348.4 C 455.0 349.4, 480.0 350.8, 500.0 352.0 C 520.0 353.2, 540.0 354.6, 560.0 355.6 C 580.0 356.7, 610.0 357.9, 620.0 358.3" fill="none" stroke="#2457d6" stroke-width="3" stroke-linecap="round"/>

  <!-- Легенда графіка -->
  <rect x="360" y="115" width="245" height="72" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="375" y="135" font-size="12" font-weight="bold" fill="#1a1a1a">Позначення на графіку:</text>
  <line x1="375" y1="151" x2="400" y2="151" stroke="#2457d6" stroke-width="3"/>
  <circle cx="387.5" cy="151" r="3.5" fill="#2457d6"/>
  <text x="408" y="155" font-size="12" fill="#1a1a1a">t_total = t_on + t_off (відгук)</text>
  <line x1="375" y1="171" x2="400" y2="171" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="408" y="175" font-size="12" fill="#d97706">Ліміт 60 Гц: 16.7 мс (1 кадр)</text>

  <!-- Точки даних на кривій та підписи значень -->
  <circle cx="80" cy="100" r="4.5" fill="#c0392b" stroke="white" stroke-width="1.5"/>
  <text x="92" y="118" font-size="12" font-weight="bold" fill="#c0392b">300 мс</text>

  <circle cx="140" cy="203.5" r="4.5" fill="#c0392b" stroke="white" stroke-width="1.5"/>
  <text x="152" y="210" font-size="12" font-weight="bold" fill="#c0392b">185 мс</text>

  <circle cx="260" cy="307" r="4.5" fill="#2457d6" stroke="white" stroke-width="1.5"/>
  <text x="260" y="299" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">70 мс</text>

  <circle cx="410" cy="345.7" r="4.5" fill="#27ae60" stroke="white" stroke-width="1.5"/>
  <text x="410" y="338" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">27 мс</text>

  <circle cx="620" cy="358.3" r="4.5" fill="#27ae60" stroke="white" stroke-width="1.5"/>
  <text x="608" y="342" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">13 мс</text>

  <!-- Рамка та осі графіка -->
  <rect x="80" y="100" width="540" height="270" fill="none" stroke="#d0d7de" stroke-width="1"/>
  <line x1="80" y1="100" x2="80" y2="370" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="80" y1="370" x2="620" y2="370" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Поділки та значення осі Y -->
  <line x1="75" y1="100" x2="80" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="70" y="104" font-size="12" fill="#1a1a1a" text-anchor="end">300 мс</text>
  <line x1="75" y1="145" x2="80" y2="145" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="70" y="149" font-size="12" fill="#1a1a1a" text-anchor="end">250 мс</text>
  <line x1="75" y1="190" x2="80" y2="190" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="70" y="194" font-size="12" fill="#1a1a1a" text-anchor="end">200 мс</text>
  <line x1="75" y1="235" x2="80" y2="235" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="70" y="239" font-size="12" fill="#1a1a1a" text-anchor="end">150 мс</text>
  <line x1="75" y1="280" x2="80" y2="280" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="70" y="284" font-size="12" fill="#1a1a1a" text-anchor="end">100 мс</text>
  <line x1="75" y1="325" x2="80" y2="325" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="70" y="329" font-size="12" fill="#1a1a1a" text-anchor="end">50 мс</text>
  <line x1="75" y1="370" x2="80" y2="370" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="70" y="374" font-size="12" fill="#1a1a1a" text-anchor="end">0 мс</text>

  <!-- Поділки та значення осі X -->
  <line x1="80" y1="370" x2="80" y2="376" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="80" y="394" font-size="12" fill="#1a1a1a" text-anchor="middle">-30 °C</text>
  <line x1="140" y1="370" x2="140" y2="376" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="140" y="394" font-size="12" fill="#1a1a1a" text-anchor="middle">-20 °C</text>
  <line x1="200" y1="370" x2="200" y2="376" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="200" y="394" font-size="12" fill="#1a1a1a" text-anchor="middle">-10 °C</text>
  <line x1="260" y1="370" x2="260" y2="376" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="260" y="394" font-size="12" fill="#1a1a1a" text-anchor="middle">0 °C</text>
  <line x1="320" y1="370" x2="320" y2="376" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="320" y="394" font-size="12" fill="#1a1a1a" text-anchor="middle">+10 °C</text>
  <line x1="380" y1="370" x2="380" y2="376" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="380" y="394" font-size="12" fill="#1a1a1a" text-anchor="middle">+20 °C</text>
  <line x1="500" y1="370" x2="500" y2="376" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="500" y="394" font-size="12" fill="#1a1a1a" text-anchor="middle">+40 °C</text>
  <line x1="620" y1="370" x2="620" y2="376" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="620" y="394" font-size="12" fill="#1a1a1a" text-anchor="middle">+60 °C</text>

  <!-- Назви осей -->
  <text x="80" y="82" font-size="13" font-weight="bold" fill="#1a1a1a">Час відгуку, мс</text>
  <text x="350" y="424" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Температура навколишнього середовища, °C</text>

  <!-- Бічні картки температурних режимів -->
  <!-- Картка 1: Норма -->
  <rect x="660" y="85" width="275" height="98" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="675" y="107" font-size="13" font-weight="bold" fill="#27ae60">Нормальна робота (+10 … +60 °C)</text>
  <text x="675" y="129" font-size="12" fill="#1a1a1a">• Час відгуку: 12–47 мс (миттєвий)</text>
  <text x="675" y="149" font-size="12" fill="#6b7280">• 60 к/с без змазування зображення</text>
  <text x="675" y="169" font-size="12" fill="#6b7280">• Оптимальна в'язкість рідких кристалів</text>

  <!-- Картка 2: Поява шлейфів -->
  <rect x="660" y="201" width="275" height="98" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="675" y="223" font-size="13" font-weight="bold" fill="#2457d6">Поява шлейфів (-10 … +10 °C)</text>
  <text x="675" y="245" font-size="12" fill="#1a1a1a">• Час відгуку: 47–115 мс (&gt; 16.7 мс)</text>
  <text x="675" y="265" font-size="12" fill="#6b7280">• Ghosting: шлейфи за рухомими об'єктами</text>
  <text x="675" y="285" font-size="12" fill="#6b7280">• Затримка зміни стану на 3–7 кадрів</text>

  <!-- Картка 3: Мороз -->
  <rect x="660" y="317" width="275" height="98" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="675" y="339" font-size="13" font-weight="bold" fill="#c0392b">Критичний мороз (-30 … -10 °C)</text>
  <text x="675" y="361" font-size="12" fill="#1a1a1a">• Час відгуку: 115–300+ мс</text>
  <text x="675" y="381" font-size="12" fill="#6b7280">• Важке розмиття та затримка інтерфейсу</text>
  <text x="675" y="401" font-size="12" fill="#6b7280">• Експоненційне зростання в'язкості</text>
</svg>
