<svg viewBox="0 0 960 560" width="960" height="560" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>
  
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Архітектура силового каскаду FOC та формування обертового поля</text>
  <text x="480" y="56" text-anchor="middle" font-size="13" fill="#6b7280">FOC регулює струми i_d, i_q через 3-фазний міст MOSFET для синфазного обертання поля статора B_s</text>

  <!-- Panel 1: FOC Controller -->
  <rect x="30" y="85" width="230" height="445" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="145" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Блок FOC-перетворення</text>

  <!-- PI Regulators -->
  <rect x="45" y="130" width="200" height="55" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="145" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">PI-регулятори i_d, i_q</text>
  <text x="145" y="170" text-anchor="middle" font-size="12" fill="#6b7280">Задання напруг V_d, V_q</text>

  <!-- Arrow PI -> Inv Park -->
  <line x1="145" y1="185" x2="145" y2="210" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Inv Park & Clarke -->
  <rect x="45" y="210" width="200" height="55" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="145" y="232" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Inv. Park &amp; Clarke</text>
  <text x="145" y="250" text-anchor="middle" font-size="12" fill="#6b7280">(V_d, V_q, θ) → V_α, V_β → V_ABC</text>

  <!-- Arrow Inv Park -> SVPWM -->
  <line x1="145" y1="265" x2="145" y2="290" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- SVPWM Modulator -->
  <rect x="45" y="290" width="200" height="75" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="145" y="312" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Модулятор SVPWM</text>
  <text x="145" y="332" text-anchor="middle" font-size="12" fill="#1a1a1a">6 ШІМ-сигналів управління</text>
  <text x="145" y="350" text-anchor="middle" font-size="12" fill="#6b7280">H_A, L_A, H_B, L_B, H_C, L_C</text>

  <!-- Feedback Processing Block -->
  <rect x="45" y="380" width="200" height="135" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="145" y="402" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Зворотний зв'язок FOC</text>
  <text x="145" y="422" text-anchor="middle" font-size="12" fill="#6b7280">Вимірювання струмів i_A, i_B, i_C</text>
  <text x="145" y="442" text-anchor="middle" font-size="12" fill="#6b7280">Пряме перетворення Clarke/Park</text>
  <text x="145" y="462" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Обчислення струмів i_d, i_q</text>
  <text x="145" y="482" text-anchor="middle" font-size="12" fill="#6b7280">Кут ротора θ з енкодера</text>

  <!-- Feedback up-arrow inside Panel 1 -->
  <path d="M 45,462 L 35,462 L 35,152 L 45,152" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-blue)"/>

  <!-- Panel 2: 3-Phase Inverter Bridge -->
  <rect x="280" y="85" width="360" height="445" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="460" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Трифазний силовий міст MOSFET</text>

  <!-- V_DC Rail -->
  <line x1="300" y1="145" x2="620" y2="145" stroke="#c0392b" stroke-width="2.5"/>
  <text x="460" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Шина живлення V_DC (+24V..48V)</text>

  <!-- GND Rail -->
  <line x1="300" y1="465" x2="620" y2="465" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="460" y="483" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Загальна шина GND (0V)</text>

  <!-- Bulk Capacitor C_bulk -->
  <line x1="315" y1="145" x2="315" y2="295" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="315" y1="305" x2="315" y2="465" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="307" y1="295" x2="323" y2="295" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="307" y1="305" x2="323" y2="305" stroke="#1a1a1a" stroke-width="2"/>
  <text x="328" y="304" text-anchor="start" font-size="12" fill="#6b7280">C_bulk</text>

  <!-- Gate Driver Sub-block -->
  <rect x="290" y="325" width="48" height="50" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="314" y="345" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Gate</text>
  <text x="314" y="361" text-anchor="middle" font-size="12" fill="#2457d6">Driver</text>

  <!-- PWM Input Line from SVPWM -->
  <line x1="245" y1="350" x2="290" y2="350" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Leg A (Phase A) -->
  <line x1="370" y1="145" x2="370" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="345" y="175" width="50" height="46" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="370" y="193" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Q_HA</text>
  <text x="370" y="208" text-anchor="middle" font-size="12" fill="#6b7280">MOSFET</text>

  <line x1="370" y1="221" x2="370" y2="385" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="370" cy="280" r="4" fill="#2457d6"/>
  <text x="358" y="275" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">A</text>

  <rect x="345" y="385" width="50" height="46" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="370" y="403" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Q_LA</text>
  <text x="370" y="418" text-anchor="middle" font-size="12" fill="#6b7280">MOSFET</text>
  <line x1="370" y1="431" x2="370" y2="465" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Leg B (Phase B) -->
  <line x1="460" y1="145" x2="460" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="435" y="175" width="50" height="46" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="460" y="193" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Q_HB</text>
  <text x="460" y="208" text-anchor="middle" font-size="12" fill="#6b7280">MOSFET</text>

  <line x1="460" y1="221" x2="460" y2="385" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="460" cy="280" r="4" fill="#2457d6"/>
  <text x="448" y="275" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">B</text>

  <rect x="435" y="385" width="50" height="46" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="460" y="403" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Q_LB</text>
  <text x="460" y="418" text-anchor="middle" font-size="12" fill="#6b7280">MOSFET</text>
  <line x1="460" y1="431" x2="460" y2="465" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Leg C (Phase C) -->
  <line x1="550" y1="145" x2="550" y2="175" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="525" y="175" width="50" height="46" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="550" y="193" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Q_HC</text>
  <text x="550" y="208" text-anchor="middle" font-size="12" fill="#6b7280">MOSFET</text>

  <line x1="550" y1="221" x2="550" y2="385" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="550" cy="280" r="4" fill="#2457d6"/>
  <text x="538" y="275" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">C</text>

  <rect x="525" y="385" width="50" height="46" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="550" y="403" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Q_LC</text>
  <text x="550" y="418" text-anchor="middle" font-size="12" fill="#6b7280">MOSFET</text>
  <line x1="550" y1="431" x2="550" y2="465" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Phase Output Lines from Nodes to Sensors -->
  <path d="M 370,280 L 370,210 L 578,210" fill="none" stroke="#2457d6" stroke-width="2"/>
  <path d="M 460,280 L 460,250 L 578,250" fill="none" stroke="#2457d6" stroke-width="2"/>
  <path d="M 550,280 L 550,290 L 578,290" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Current Sensors -->
  <rect x="578" y="200" width="24" height="20" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="590" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">i_A</text>

  <rect x="578" y="240" width="24" height="20" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="590" y="232" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">i_B</text>

  <rect x="578" y="280" width="24" height="20" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="590" y="272" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">i_C</text>

  <!-- Lines from sensors extending to Motor -->
  <line x1="602" y1="210" x2="660" y2="210" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="602" y1="250" x2="660" y2="250" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="602" y1="290" x2="660" y2="290" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Panel 3: BLDC Motor Stator & Vector Fields -->
  <rect x="660" y="85" width="270" height="445" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="795" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Статор BLDC та Вектор поля</text>

  <!-- Sub-panel 3A: Stator Windings (Star) -->
  <rect x="672" y="130" width="246" height="175" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="795" y="148" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Схема обмоток статора (Зірка)</text>

  <!-- Phase A Line & Winding -->
  <path d="M 660,210 L 685,210 L 685,175 L 795,175" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <text x="795" y="163" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Фаза A</text>
  <line x1="795" y1="175" x2="795" y2="205" stroke="#2457d6" stroke-width="2" stroke-dasharray="4,2"/>

  <!-- Phase B Line & Winding -->
  <path d="M 660,250 L 735,250 L 735,260" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <text x="725" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Фаза B</text>
  <line x1="735" y1="260" x2="772" y2="238" stroke="#2457d6" stroke-width="2" stroke-dasharray="4,2"/>

  <!-- Phase C Line & Winding -->
  <path d="M 660,290 L 685,290 L 685,260 L 855,260" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <text x="865" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Фаза C</text>
  <line x1="855" y1="260" x2="818" y2="238" stroke="#2457d6" stroke-width="2" stroke-dasharray="4,2"/>

  <!-- Rotor Permanent Magnet -->
  <rect x="779" y="217" width="16" height="16" rx="2" fill="#c0392b"/>
  <rect x="795" y="217" width="16" height="16" rx="2" fill="#2457d6"/>
  <text x="787" y="229" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">N</text>
  <text x="803" y="229" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">S</text>

  <!-- Rotation arrow -->
  <path d="M 820,210 A 22,22 0 0,1 820,240" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="828" y="202" text-anchor="middle" font-size="12" font-style="italic" fill="#2457d6">ω</text>

  <!-- Sub-panel 3B: FOC Vector Diagram -->
  <rect x="672" y="318" width="246" height="198" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="795" y="336" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Векторна діаграма FOC</text>

  <!-- Stationary Axes alpha, beta -->
  <line x1="795" y1="425" x2="890" y2="425" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="898" y="428" text-anchor="start" font-size="12" font-style="italic" fill="#6b7280">α</text>

  <line x1="795" y1="425" x2="795" y2="355" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="795" y="348" text-anchor="middle" font-size="12" font-style="italic" fill="#6b7280">β</text>

  <!-- Rotating Frame d-axis -->
  <line x1="795" y1="425" x2="870" y2="382" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="876" y="378" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">d (ψ_r)</text>

  <!-- Rotating Frame q-axis -->
  <line x1="795" y1="425" x2="750" y2="348" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="742" y="348" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">q (τ)</text>

  <!-- Stator Current Vector I_s = i_q -->
  <line x1="795" y1="425" x2="762" y2="368" stroke="#27ae60" stroke-width="3.5" marker-end="url(#arr-green)"/>
  <text x="722" y="380" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">I_s = i_q</text>

  <!-- Angle theta arc -->
  <path d="M 825,425 A 30,30 0 0,0 821,410" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <text x="826" y="415" text-anchor="middle" font-size="12" font-style="italic" fill="#c0392b">θ</text>

  <!-- Explanatory Text inside Sub-panel 3B -->
  <text x="795" y="478" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">i_q створює обертальний момент τ</text>
  <text x="795" y="496" text-anchor="middle" font-size="12" fill="#6b7280">i_d = 0 (максимальна ефективність)</text>

  <!-- Main Feedback Loop Line (Bottom) -->
  <path d="M 590,300 L 590,495 L 245,495" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-blue)"/>
  <text x="460" y="525" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Сигнали зворотного зв'язку: струми i_A, i_B, i_C та кут ротора θ</text>

</svg>
