<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Часова діаграма 1 кГц циклу синхронного керування CAN</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Широкомовний SYNC фіксує координати осей без фазового зсуву, впорядковуючи уставки, телеметрію та E-Stop</text>

  <!-- ==================== СЕКЦІЯ 1: РОЗПОДІЛ ТРАФІКУ НА ШИНІ CAN ==================== -->
  <rect x="24" y="70" width="912" height="136" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="40" y="88" font-size="14" font-weight="700" fill="#1a1a1a">1. Розподіл трафіку на шині CAN (період T = 1000 мкс)</text>
  <text x="920" y="88" font-size="12" fill="#6b7280" text-anchor="end">CAN 1 Мбіт/с · Трафік 66% · Резерв 34%</text>

  <!-- Шкала часу -->
  <line x1="160" y1="108" x2="910" y2="108" stroke="#6b7280" stroke-width="1"/>
  <line x1="160" y1="108" x2="160" y2="114" stroke="#6b7280" stroke-width="1"/>
  <text x="160" y="103" font-size="12" fill="#6b7280" text-anchor="middle">0 мкс</text>
  <line x1="310" y1="108" x2="310" y2="114" stroke="#6b7280" stroke-width="1"/>
  <text x="310" y="103" font-size="12" fill="#6b7280" text-anchor="middle">200 мкс</text>
  <line x1="460" y1="108" x2="460" y2="114" stroke="#6b7280" stroke-width="1"/>
  <text x="460" y="103" font-size="12" fill="#6b7280" text-anchor="middle">400 мкс</text>
  <line x1="610" y1="108" x2="610" y2="114" stroke="#6b7280" stroke-width="1"/>
  <text x="610" y="103" font-size="12" fill="#6b7280" text-anchor="middle">600 мкс</text>
  <line x1="760" y1="108" x2="760" y2="114" stroke="#6b7280" stroke-width="1"/>
  <text x="760" y="103" font-size="12" fill="#6b7280" text-anchor="middle">800 мкс</text>
  <line x1="910" y1="108" x2="910" y2="114" stroke="#6b7280" stroke-width="1"/>
  <text x="910" y="103" font-size="12" fill="#6b7280" text-anchor="middle">1000 мкс (1 мс)</text>
  <text x="40" y="134" font-size="13" font-weight="700" fill="#1a1a1a">Шина CAN</text>
  <text x="40" y="149" font-size="12" fill="#6b7280">Трафік кадрів</text>
  <!-- SYNC кадр -->
  <rect x="160" y="118" width="44" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="182" y="134" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">SYNC</text>
  <text x="182" y="149" font-size="12" fill="#1a1a1a" text-anchor="middle">0x080</text>
  <!-- Уставки CMD 1..3 -->
  <rect x="210" y="118" width="48" height="42" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
  <text x="234" y="134" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">CMD 1</text>
  <text x="234" y="149" font-size="12" fill="#6b7280" text-anchor="middle">θ1, τ1</text>
  <rect x="262" y="118" width="48" height="42" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
  <text x="286" y="134" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">CMD 2</text>
  <text x="286" y="149" font-size="12" fill="#6b7280" text-anchor="middle">θ2, τ2</text>
  <rect x="314" y="118" width="48" height="42" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
  <text x="338" y="134" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">CMD 3</text>
  <text x="338" y="149" font-size="12" fill="#6b7280" text-anchor="middle">θ3, τ3</text>
  <!-- Слоти телеметрії -->
  <rect x="385" y="118" width="82" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="426" y="134" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">TELE 1</text>
  <text x="426" y="149" font-size="12" fill="#1a1a1a" text-anchor="middle">θ, ω, Iq, T</text>
  <rect x="475" y="118" width="82" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="516" y="134" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">TELE 2</text>
  <text x="516" y="149" font-size="12" fill="#1a1a1a" text-anchor="middle">θ, ω, Iq, T</text>
  <rect x="565" y="118" width="82" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="606" y="134" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">TELE 3</text>
  <text x="606" y="149" font-size="12" fill="#1a1a1a" text-anchor="middle">θ, ω, Iq, T</text>
  <!-- Резерв шини -->
  <rect x="655" y="118" width="255" height="42" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="782" y="134" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Вільний резервний інтервал шини</text>
  <text x="782" y="149" font-size="12" fill="#1a1a1a" text-anchor="middle">34% запасу: без черг пакетів і колізій</text>
  <!-- Підписи секцій трафіку -->
  <text x="182" y="178" font-size="12" fill="#2457d6" text-anchor="middle">Синхроімпульс</text>
  <text x="286" y="178" font-size="12" fill="#2457d6" text-anchor="middle">Цільові уставки хоста</text>
  <text x="516" y="178" font-size="12" fill="#2457d6" text-anchor="middle">Часові слоти відповіді телеметрії (TDM)</text>
  <text x="782" y="178" font-size="12" fill="#27ae60" text-anchor="middle">Запас пропускної здатності</text>
  <text x="182" y="194" font-size="12" fill="#6b7280" text-anchor="middle">t = 0 мкс</text>
  <text x="286" y="194" font-size="12" fill="#6b7280" text-anchor="middle">65..265 мкс</text>
  <text x="516" y="194" font-size="12" fill="#6b7280" text-anchor="middle">385..647 мкс</text>
  <text x="782" y="194" font-size="12" fill="#6b7280" text-anchor="middle">655..1000 мкс</text>

  <!-- ==================== СЕКЦІЯ 2: УСУНЕННЯ ФАЗОВОГО ЗСУВУ ==================== -->
  <rect x="24" y="218" width="912" height="212" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="40" y="236" font-size="14" font-weight="700" fill="#1a1a1a">2. Усунення фазового зсуву та внутрішній таймінг вузлів</text>
  <text x="920" y="236" font-size="12" fill="#6b7280" text-anchor="end">Апаратний Latch у t = 0 (нульовий зсув Δt = 0)</text>

  <!-- Вертикальна лінія синхронізації t = 0 -->
  <line x1="160" y1="246" x2="160" y2="374" stroke="#27ae60" stroke-width="2" stroke-dasharray="4 2"/>
  <!-- Суглоб 1 -->
  <text x="40" y="263" font-size="13" font-weight="700" fill="#1a1a1a">Суглоб 1</text>
  <text x="40" y="277" font-size="12" fill="#6b7280">Вісь 1 (Node 1)</text>
  <rect x="160" y="248" width="44" height="36" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="182" y="263" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Latch</text>
  <text x="182" y="277" font-size="12" fill="#27ae60" text-anchor="middle">θ1 (0)</text>
  <rect x="210" y="248" width="48" height="36" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="234" y="263" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">RX</text>
  <text x="234" y="277" font-size="12" fill="#6b7280" text-anchor="middle">CMD 1</text>
  <rect x="264" y="248" width="115" height="36" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="321" y="263" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Контур FOC</text>
  <text x="321" y="277" font-size="12" fill="#6b7280" text-anchor="middle">струм + швидкість</text>
  <rect x="385" y="248" width="82" height="36" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="426" y="263" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">TX TELE 1</text>
  <text x="426" y="277" font-size="12" fill="#1a1a1a" text-anchor="middle">θ1, ω1, I1, T1</text>
  <rect x="473" y="248" width="437" height="36" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="691" y="270" font-size="12" fill="#6b7280" text-anchor="middle">ШІМ-комутація інвертора та відпрацювання траєкторії до наступного SYNC</text>

  <!-- Суглоб 2 -->
  <text x="40" y="307" font-size="13" font-weight="700" fill="#1a1a1a">Суглоб 2</text>
  <text x="40" y="321" font-size="12" fill="#6b7280">Вісь 2 (Node 2)</text>
  <rect x="160" y="292" width="44" height="36" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="182" y="307" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Latch</text>
  <text x="182" y="321" font-size="12" fill="#27ae60" text-anchor="middle">θ2 (0)</text>
  <rect x="262" y="292" width="48" height="36" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="286" y="307" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">RX</text>
  <text x="286" y="321" font-size="12" fill="#6b7280" text-anchor="middle">CMD 2</text>
  <rect x="316" y="292" width="153" height="36" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="392" y="307" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Розрахунок FOC</text>
  <text x="392" y="321" font-size="12" fill="#6b7280" text-anchor="middle">регулювання моменту</text>
  <rect x="475" y="292" width="82" height="36" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="516" y="307" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">TX TELE 2</text>
  <text x="516" y="321" font-size="12" fill="#1a1a1a" text-anchor="middle">θ2, ω2, I2, T2</text>
  <rect x="563" y="292" width="347" height="36" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="736" y="314" font-size="12" fill="#6b7280" text-anchor="middle">ШІМ-комутація інвертора та очікування наступного SYNC</text>

  <!-- Суглоб 3 -->
  <text x="40" y="351" font-size="13" font-weight="700" fill="#1a1a1a">Суглоб 3</text>
  <text x="40" y="365" font-size="12" fill="#6b7280">Вісь 3 (Node 3)</text>
  <rect x="160" y="336" width="44" height="36" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="182" y="351" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Latch</text>
  <text x="182" y="365" font-size="12" fill="#27ae60" text-anchor="middle">θ3 (0)</text>
  <rect x="314" y="336" width="48" height="36" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="338" y="351" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">RX</text>
  <text x="338" y="365" font-size="12" fill="#6b7280" text-anchor="middle">CMD 3</text>
  <rect x="368" y="336" width="191" height="36" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="463" y="351" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Розрахунок FOC</text>
  <text x="463" y="365" font-size="12" fill="#6b7280" text-anchor="middle">регулювання швидкості й струму</text>
  <rect x="565" y="336" width="82" height="36" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="606" y="351" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">TX TELE 3</text>
  <text x="606" y="365" font-size="12" fill="#1a1a1a" text-anchor="middle">θ3, ω3, I3, T3</text>
  <rect x="653" y="336" width="257" height="36" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="781" y="358" font-size="12" fill="#6b7280" text-anchor="middle">ШІМ-комутація інвертора</text>

  <!-- Лінія E-Stop -->
  <text x="40" y="397" font-size="13" font-weight="700" fill="#c0392b">Кадр E-Stop</text>
  <text x="40" y="411" font-size="12" fill="#6b7280">ID: 0x000</text>
  <rect x="160" y="382" width="750" height="36" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="175" y="397" font-size="12" font-weight="700" fill="#c0392b">Аварійний кадр E-Stop (ID: 0x000, найвищий пріоритет за домінантним нулем):</text>
  <text x="175" y="411" font-size="12" fill="#1a1a1a">Миттєвий виграш арбітражу шини за 0 мкс; негайний перехід усіх інверторів у Safe Torque Off (STO)</text>

  <!-- ==================== СЕКЦІЯ 3: ПІДСУМКОВІ КАРТКИ ==================== -->
  <rect x="24" y="440" width="292" height="98" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="36" y="460" font-size="13" font-weight="700" fill="#27ae60">1. Усунення фазового зсуву (Δt = 0)</text>
  <text x="36" y="479" font-size="12" fill="#1a1a1a">Широкомовний SYNC фіксує енкодери всіх</text>
  <text x="36" y="497" font-size="12" fill="#1a1a1a">осей в один мікросекундний зріз часу.</text>
  <text x="36" y="515" font-size="12" fill="#6b7280">Без SYNC зсув до 700 мкс спотворює контур.</text>
  <rect x="334" y="440" width="292" height="98" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="346" y="460" font-size="13" font-weight="700" fill="#2457d6">2. Уставки та слоти телеметрії (TDM)</text>
  <text x="346" y="479" font-size="12" fill="#1a1a1a">Хост видає CMD 1..3 (положення θ, момент τ).</text>
  <text x="346" y="497" font-size="12" fill="#1a1a1a">Телеметрія (θ, ω, Iq, T) надходить у слотах</text>
  <text x="346" y="515" font-size="12" fill="#6b7280">без колізій і затримок шинного арбітражу.</text>
  <rect x="644" y="440" width="292" height="98" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="656" y="460" font-size="13" font-weight="700" fill="#c0392b">3. Пріоритет E-Stop та безпека</text>
  <text x="656" y="479" font-size="12" fill="#1a1a1a">Кадр E-Stop (ID 0x000) домінує на шині,</text>
  <text x="656" y="497" font-size="12" fill="#1a1a1a">перериваючи обмін при збої за 0 мкс.</text>
  <text x="656" y="515" font-size="12" fill="#6b7280">Watchdog (2..5 мс) знеструмлює при обриві.</text>

</svg>
