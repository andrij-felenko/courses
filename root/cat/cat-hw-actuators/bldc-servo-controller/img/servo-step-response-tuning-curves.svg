<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-bad" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Головний заголовок та підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Налаштування контурів швидкості та позиції: перехідні процеси відгуку на сходинку</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Завищений Kp зумовлює вібрації, занижений — млявість; критичне демпфування (σ ≤ 5%) дає динамічну жорсткість</text>

  <!-- ==================== ПАНЕЛЬ 1: КОНТУР ШВИДКОСТІ ==================== -->
  <rect x="24" y="68" width="446" height="470" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247" y="92" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">1. Контур швидкості: реакція кутової швидкості ω(t)</text>

  <!-- Біла підкладка графіка -->
  <rect x="38" y="106" width="418" height="226" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="88" y="124" font-size="12" font-weight="700" fill="#1a1a1a">Перехідний процес швидкості ω(t)</text>

  <!-- Легенда графіка швидкості -->
  <line x1="260" y1="140" x2="280" y2="140" stroke="#c0392b" stroke-width="2.2"/>
  <text x="288" y="144" font-size="12" font-weight="700" fill="#c0392b">Завищений Kp (дзвін)</text>

  <line x1="260" y1="158" x2="280" y2="158" stroke="#27ae60" stroke-width="2.4"/>
  <text x="288" y="162" font-size="12" font-weight="700" fill="#27ae60">Оптимальний (σ ≤ 5%)</text>

  <line x1="260" y1="176" x2="280" y2="176" stroke="#2457d6" stroke-width="2.2"/>
  <text x="288" y="180" font-size="12" font-weight="700" fill="#2457d6">Занижений (млявий)</text>

  <!-- Осі координат -->
  <line x1="78" y1="296" x2="442" y2="296" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="78" y1="296" x2="78" y2="130" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="72" y="132" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">ω</text>
  <text x="444" y="316" font-size="12" fill="#6b7280" text-anchor="end">t (мс)</text>
  <text x="72" y="300" font-size="12" fill="#6b7280" text-anchor="end">0</text>

  <!-- Позначка 1.0 та уставка -->
  <line x1="75" y1="216" x2="78" y2="216" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="72" y="220" font-size="12" font-weight="700" fill="#2457d6" text-anchor="end">1.0</text>
  <line x1="78" y1="216" x2="434" y2="216" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="434" y="210" font-size="12" fill="#6b7280" text-anchor="end">ω_ref (уставка)</text>

  <!-- Позначки часу на осі X -->
  <line x1="148" y1="296" x2="148" y2="300" stroke="#1a1a1a" stroke-width="1"/>
  <text x="148" y="314" font-size="12" fill="#6b7280" text-anchor="middle">10</text>
  <line x1="218" y1="296" x2="218" y2="300" stroke="#1a1a1a" stroke-width="1"/>
  <text x="218" y="314" font-size="12" fill="#6b7280" text-anchor="middle">20</text>
  <line x1="288" y1="296" x2="288" y2="300" stroke="#1a1a1a" stroke-width="1"/>
  <text x="288" y="314" font-size="12" fill="#6b7280" text-anchor="middle">30</text>
  <line x1="358" y1="296" x2="358" y2="300" stroke="#1a1a1a" stroke-width="1"/>
  <text x="358" y="314" font-size="12" fill="#6b7280" text-anchor="middle">40</text>

  <!-- Криві перехідних процесів швидкості -->
  <!-- 1. Завищений Kp (червона, дзвін) -->
  <path d="M 78,296 C 88,296 98,245 110,216 C 118,196 123,186 130,186 C 140,186 156,236 169,236 C 180,236 195,202 207,202 C 220,202 234,226 246,226 C 258,226 273,210 284,210 C 297,210 311,220 323,220 C 334,220 345,214 354,214 C 365,214 375,216 388,216 L 430,216" fill="none" stroke="#c0392b" stroke-width="2.2"/>
  <text x="130" y="172" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">σ = +38%</text>
  <line x1="130" y1="176" x2="130" y2="184" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arr-bad)"/>

  <!-- 2. Оптимальний Kp (зелена, σ ≤ 5%) -->
  <path d="M 78,296 C 92,296 112,238 134,216 C 144,206 150,213 158,213 C 170,213 182,216 197,216 L 430,216" fill="none" stroke="#27ae60" stroke-width="2.4"/>

  <!-- 3. Занижений Kp (синя, млявий) -->
  <path d="M 78,296 C 115,296 145,268 185,250 C 235,228 320,222 430,218" fill="none" stroke="#2457d6" stroke-width="2.2"/>

  <!-- Картки станів швидкості -->
  <rect x="38" y="344" width="418" height="56" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="48" y="363" font-size="12" font-weight="700" fill="#c0392b">Завищений Kp: недодемпфування (перерегулювання σ &gt; 35%)</text>
  <text x="48" y="385" font-size="12" fill="#1a1a1a">Високочастотні коливання й дзвін, пульсації струму, перегрів</text>

  <rect x="38" y="412" width="418" height="56" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="48" y="431" font-size="12" font-weight="700" fill="#27ae60">Оптимальний Kp: критичне демпфування (перерегулювання σ ≤ 5%)</text>
  <text x="48" y="453" font-size="12" fill="#1a1a1a">Короткий час наростання t_r, плавний вихід без вібрацій</text>

  <rect x="38" y="480" width="418" height="52" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="48" y="498" font-size="12" font-weight="700" fill="#2457d6">Занижений Kp: передемпфування (затягнута реакція)</text>
  <text x="48" y="519" font-size="12" fill="#1a1a1a">Повільний розгін, мляве відновлення під навантаженням</text>

  <!-- ==================== ПАНЕЛЬ 2: КОНТУР ПОЗИЦІЇ ==================== -->
  <rect x="490" y="68" width="446" height="470" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="713" y="92" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">2. Контур позиції: реакція кутового положення θ(t)</text>

  <!-- Біла підкладка графіка -->
  <rect x="504" y="106" width="418" height="226" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="554" y="124" font-size="12" font-weight="700" fill="#1a1a1a">Перехідний процес позиції θ(t)</text>

  <!-- Легенда графіка позиції -->
  <line x1="726" y1="140" x2="746" y2="140" stroke="#c0392b" stroke-width="2.2"/>
  <text x="754" y="144" font-size="12" font-weight="700" fill="#c0392b">Завищений Kp (переліт)</text>

  <line x1="726" y1="158" x2="746" y2="158" stroke="#27ae60" stroke-width="2.4"/>
  <text x="754" y="162" font-size="12" font-weight="700" fill="#27ae60">Оптимальний (σ ≤ 5%)</text>

  <line x1="726" y1="176" x2="746" y2="176" stroke="#2457d6" stroke-width="2.2"/>
  <text x="754" y="180" font-size="12" font-weight="700" fill="#2457d6">Занижений (млявий)</text>

  <!-- Осі координат -->
  <line x1="544" y1="296" x2="908" y2="296" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="544" y1="296" x2="544" y2="130" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="538" y="132" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">θ</text>
  <text x="910" y="316" font-size="12" fill="#6b7280" text-anchor="end">t (мс)</text>
  <text x="538" y="300" font-size="12" fill="#6b7280" text-anchor="end">0</text>

  <!-- Позначка 1.0 та уставка -->
  <line x1="541" y1="216" x2="544" y2="216" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="538" y="220" font-size="12" font-weight="700" fill="#2457d6" text-anchor="end">1.0</text>
  <line x1="544" y1="216" x2="900" y2="216" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="900" y="210" font-size="12" fill="#6b7280" text-anchor="end">θ_ref (уставка)</text>

  <!-- Позначки часу на осі X -->
  <line x1="614" y1="296" x2="614" y2="300" stroke="#1a1a1a" stroke-width="1"/>
  <text x="614" y="314" font-size="12" fill="#6b7280" text-anchor="middle">10</text>
  <line x1="684" y1="296" x2="684" y2="300" stroke="#1a1a1a" stroke-width="1"/>
  <text x="684" y="314" font-size="12" fill="#6b7280" text-anchor="middle">20</text>
  <line x1="754" y1="296" x2="754" y2="300" stroke="#1a1a1a" stroke-width="1"/>
  <text x="754" y="314" font-size="12" fill="#6b7280" text-anchor="middle">30</text>
  <line x1="824" y1="296" x2="824" y2="300" stroke="#1a1a1a" stroke-width="1"/>
  <text x="824" y="314" font-size="12" fill="#6b7280" text-anchor="middle">40</text>

  <!-- Криві перехідних процесів позиції -->
  <!-- 1. Завищений Kp (червона, переліт) -->
  <path d="M 544,296 C 562,296 580,240 595,216 C 610,192 622,189 635,189 C 660,189 685,231 712,231 C 738,231 760,208 782,208 C 804,208 822,219 838,219 C 854,219 865,216 880,216 L 900,216" fill="none" stroke="#c0392b" stroke-width="2.2"/>
  <text x="635" y="172" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">σ = +34%</text>
  <line x1="635" y1="176" x2="635" y2="187" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arr-bad)"/>

  <!-- 2. Оптимальний Kp (зелена, σ ≤ 5%) -->
  <path d="M 544,296 C 564,296 590,236 614,216 C 626,206 634,213 642,213 C 656,213 672,216 691,216 L 900,216" fill="none" stroke="#27ae60" stroke-width="2.4"/>

  <!-- 3. Занижений Kp (синя, млявий) -->
  <path d="M 544,296 C 585,296 615,268 655,250 C 705,228 790,222 900,218" fill="none" stroke="#2457d6" stroke-width="2.2"/>

  <!-- Картки станів позиції -->
  <rect x="504" y="344" width="418" height="56" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="514" y="363" font-size="12" font-weight="700" fill="#c0392b">Завищений Kp: недодемпфування (перерегулювання σ &gt; 30%)</text>
  <text x="514" y="385" font-size="12" fill="#1a1a1a">Проліт кута, позиційний шум, ударні навантаження на вал</text>

  <rect x="504" y="412" width="418" height="56" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="514" y="431" font-size="12" font-weight="700" fill="#27ae60">Оптимальний Kp: критичне демпфування (перерегулювання σ ≤ 5%)</text>
  <text x="514" y="453" font-size="12" fill="#1a1a1a">Швидке прибуття в цільову точку, жорстке утримання кута θ</text>

  <rect x="504" y="480" width="418" height="52" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="514" y="498" font-size="12" font-weight="700" fill="#2457d6">Занижений Kp: передемпфування (затягнута реакція)</text>
  <text x="514" y="519" font-size="12" fill="#1a1a1a">Тривале «доповзання» до цілі, кутовий люфт під моментом</text>
</svg>
