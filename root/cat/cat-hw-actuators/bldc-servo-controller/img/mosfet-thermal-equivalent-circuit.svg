<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Еквівалентна теплова схема силового MOSFET</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Тепловий потік Ploss відповідає джерелу струму, а потенціали Tj, Tc, Ts, Ta — температурам вузлів</text>

  <!-- Panel 1: Physical Structure -->
  <rect x="40" y="68" width="880" height="122" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="88" font-size="13" font-weight="bold" fill="#1a1a1a">Конструктивні шари теплопередачі</text>

  <!-- Layer Blocks -->
  <!-- Block 1: Die -->
  <rect x="170" y="102" width="120" height="60" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="230" y="126" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Кристал (Die)</text>
  <text x="230" y="146" font-size="12" fill="#1a1a1a" text-anchor="middle">Зона нагріву Tj</text>

  <!-- Flow 1: Rth,jc -->
  <line x1="295" y1="132" x2="363" y2="132" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <text x="330" y="120" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Rθjc</text>
  <text x="330" y="150" font-size="12" fill="#6b7280" text-anchor="middle">перехід</text>

  <!-- Block 2: Case -->
  <rect x="370" y="102" width="120" height="60" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="430" y="126" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Корпус (Case)</text>
  <text x="430" y="146" font-size="12" fill="#6b7280" text-anchor="middle">Поверхня Tc</text>

  <!-- Flow 2: Rth,cs -->
  <line x1="495" y1="132" x2="563" y2="132" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <text x="530" y="120" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Rθcs</text>
  <text x="530" y="150" font-size="12" fill="#6b7280" text-anchor="middle">TIM / паста</text>

  <!-- Block 3: Heatsink -->
  <rect x="570" y="102" width="120" height="60" rx="6" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="630" y="126" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Радіатор (Sink)</text>
  <text x="630" y="146" font-size="12" fill="#6b7280" text-anchor="middle">Поверхня Ts</text>

  <!-- Flow 3: Rth,sa -->
  <line x1="695" y1="132" x2="763" y2="132" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <text x="730" y="120" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Rθsa</text>
  <text x="730" y="150" font-size="12" fill="#6b7280" text-anchor="middle">конвекція</text>

  <!-- Block 4: Ambient -->
  <rect x="770" y="102" width="120" height="60" rx="6" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="830" y="126" font-size="13" font-weight="bold" fill="#0284c7" text-anchor="middle">Довкілля (Air)</text>
  <text x="830" y="146" font-size="12" fill="#6b7280" text-anchor="middle">Повітря Ta</text>

  <!-- Vertical projections connecting physical nodes to circuit nodes -->
  <line x1="230" y1="162" x2="230" y2="242" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="430" y1="162" x2="430" y2="242" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="630" y1="162" x2="630" y2="242" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="830" y1="162" x2="830" y2="242" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Panel 2: Electrical Equivalent Circuit -->
  <rect x="40" y="205" width="880" height="235" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="226" font-size="13" font-weight="bold" fill="#1a1a1a">Електрична схема</text>
  <text x="55" y="242" font-size="12" fill="#6b7280">(теплова Cauer-модель)</text>

  <!-- Main Top Rail wires -->
  <line x1="110" y1="295" x2="300" y2="295" stroke="#2457d6" stroke-width="2"/>
  <line x1="360" y1="295" x2="500" y2="295" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="560" y1="295" x2="700" y2="295" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="760" y1="295" x2="830" y2="295" stroke="#0284c7" stroke-width="2"/>

  <!-- Resistors -->
  <!-- Rth,jc -->
  <rect x="300" y="286" width="60" height="18" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="330" y="260" font-size="12" fill="#6b7280" text-anchor="middle">перехід-корпус</text>
  <text x="330" y="278" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Rθjc</text>

  <!-- Rth,cs -->
  <rect x="500" y="286" width="60" height="18" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="530" y="260" font-size="12" fill="#6b7280" text-anchor="middle">корпус-радіатор</text>
  <text x="530" y="278" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Rθcs</text>

  <!-- Rth,sa -->
  <rect x="700" y="286" width="60" height="18" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="730" y="260" font-size="12" fill="#6b7280" text-anchor="middle">радіатор-довкілля</text>
  <text x="730" y="278" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Rθsa</text>

  <!-- Nodes (Dots & Labels) -->
  <!-- Heat Flow Ploss Label -->
  <text x="110" y="260" font-size="12" fill="#6b7280" text-anchor="middle">Тепловий потік</text>
  <text x="110" y="278" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Ploss</text>

  <!-- Node Tj -->
  <circle cx="230" cy="295" r="4" fill="#2457d6"/>
  <text x="230" y="260" font-size="12" fill="#6b7280" text-anchor="middle">перехід</text>
  <text x="230" y="278" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Tj</text>

  <!-- Node Tc -->
  <circle cx="430" cy="295" r="4" fill="#1a1a1a"/>
  <text x="430" y="260" font-size="12" fill="#6b7280" text-anchor="middle">корпус</text>
  <text x="430" y="278" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Tc</text>

  <!-- Node Ts -->
  <circle cx="630" cy="295" r="4" fill="#1a1a1a"/>
  <text x="630" y="260" font-size="12" fill="#6b7280" text-anchor="middle">радіатор</text>
  <text x="630" y="278" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Ts</text>

  <!-- Node Ta -->
  <circle cx="830" cy="295" r="4" fill="#0284c7"/>
  <text x="830" y="260" font-size="12" fill="#6b7280" text-anchor="middle">довкілля</text>
  <text x="830" y="278" font-size="14" font-weight="bold" fill="#0284c7" text-anchor="middle">Ta</text>

  <!-- Current Source Ploss -->
  <line x1="110" y1="295" x2="110" y2="325" stroke="#2457d6" stroke-width="2"/>
  <circle cx="110" cy="343" r="18" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <line x1="110" y1="355" x2="110" y2="333" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <line x1="110" y1="361" x2="110" y2="390" stroke="#1a1a1a" stroke-width="2"/>
  <text x="85" y="347" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">I = Ploss</text>

  <!-- Capacitors -->
  <!-- Cth,j -->
  <line x1="230" y1="295" x2="230" y2="334" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="215" y1="334" x2="245" y2="334" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="215" y1="342" x2="245" y2="342" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="230" y1="342" x2="230" y2="390" stroke="#1a1a1a" stroke-width="2"/>
  <text x="252" y="336" font-size="12" font-weight="bold" fill="#1a1a1a">Cth,j</text>
  <text x="252" y="350" font-size="12" fill="#6b7280">ємність кристала</text>

  <!-- Cth,c -->
  <line x1="430" y1="295" x2="430" y2="334" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="415" y1="334" x2="445" y2="334" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="415" y1="342" x2="445" y2="342" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="430" y1="342" x2="430" y2="390" stroke="#1a1a1a" stroke-width="2"/>
  <text x="452" y="336" font-size="12" font-weight="bold" fill="#1a1a1a">Cth,c</text>
  <text x="452" y="350" font-size="12" fill="#6b7280">ємність корпусу</text>

  <!-- Cth,s -->
  <line x1="630" y1="295" x2="630" y2="334" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="615" y1="334" x2="645" y2="334" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="615" y1="342" x2="645" y2="342" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="630" y1="342" x2="630" y2="390" stroke="#1a1a1a" stroke-width="2"/>
  <text x="652" y="336" font-size="12" font-weight="bold" fill="#1a1a1a">Cth,s</text>
  <text x="652" y="350" font-size="12" fill="#6b7280">радіатор</text>

  <!-- Voltage Source Ta -->
  <line x1="830" y1="295" x2="830" y2="329" stroke="#0284c7" stroke-width="2"/>
  <circle cx="830" cy="343" r="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="830" y="339" font-size="11" font-weight="bold" fill="#0284c7" text-anchor="middle">+</text>
  <text x="830" y="352" font-size="11" font-weight="bold" fill="#0284c7" text-anchor="middle">−</text>
  <line x1="830" y1="357" x2="830" y2="390" stroke="#1a1a1a" stroke-width="2"/>
  <text x="810" y="338" font-size="12" font-weight="bold" fill="#0284c7" text-anchor="end">V(Ta)</text>
  <text x="810" y="352" font-size="12" fill="#6b7280" text-anchor="end">опора 25 °C</text>

  <!-- Ground Rail & Earth Ground -->
  <line x1="110" y1="390" x2="830" y2="390" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="480" y1="390" x2="480" y2="398" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="470" y1="398" x2="490" y2="398" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="474" y1="403" x2="486" y2="403" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="478" y1="408" x2="482" y2="408" stroke="#1a1a1a" stroke-width="2"/>
  <text x="480" y="426" font-size="12" fill="#6b7280" text-anchor="middle">Спільний потенціал відліку (GND = 0 °C)</text>
</svg>
