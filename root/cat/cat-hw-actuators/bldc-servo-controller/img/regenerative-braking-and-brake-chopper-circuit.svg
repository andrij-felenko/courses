<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Регенеративне гальмування та баластний переривач (Brake Chopper)</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Генераторний струм мотора заряджає шину DC; надлишок енергії скидається в тепло на R_brake</text>

  <!-- ==================== TOP PANEL: CIRCUIT SCHEMATIC ==================== -->
  <rect x="22" y="70" width="916" height="258" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Top Panel Header -->
  <text x="40" y="90" font-size="14" font-weight="bold" fill="#1a1a1a">Принципова схема кіл регенерації та гальмівного баласту (Brake Chopper)</text>
  <text x="40" y="108" font-size="12" fill="#6b7280">Інерційне обертання ротора формує зворотний струм через діоди інвертора; компаратор відкриває ключ баласту</text>

  <!-- DC Bus Rails -->
  <!-- +U_bus Rail -->
  <line x1="45" y1="138" x2="685" y2="138" stroke="#c0392b" stroke-width="2.5"/>
  <text x="50" y="130" font-size="12" font-weight="bold" fill="#c0392b">+U_bus (+24 В)</text>

  <!-- GND Rail -->
  <line x1="45" y1="295" x2="685" y2="295" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="50" y="313" font-size="12" font-weight="bold" fill="#1a1a1a">GND (0 В)</text>

  <!-- Power Supply (БЖ) -->
  <line x1="85" y1="138" x2="85" y2="178" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="52" y="178" width="66" height="60" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <text x="85" y="202" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">БЖ DC</text>
  <text x="85" y="220" text-anchor="middle" font-size="12" fill="#6b7280">+24 В</text>
  <line x1="85" y1="238" x2="85" y2="295" stroke="#6b7280" stroke-width="1.5"/>
  <text x="96" y="265" font-size="12" font-weight="bold" fill="#c0392b">⛔ I_rev = 0</text>
  <text x="96" y="279" font-size="12" fill="#6b7280">(БЖ блокує)</text>

  <!-- Buffer Capacitor C_bus -->
  <line x1="160" y1="138" x2="160" y2="195" stroke="#2457d6" stroke-width="2"/>
  <line x1="148" y1="195" x2="172" y2="195" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="148" y1="203" x2="172" y2="203" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="160" y1="203" x2="160" y2="295" stroke="#2457d6" stroke-width="2"/>
  <line x1="160" y1="150" x2="160" y2="175" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="178" y="170" font-size="12" font-weight="bold" fill="#2457d6">I_ch ↓</text>
  <text x="178" y="196" font-size="12" font-weight="bold" fill="#2457d6">C_bus</text>
  <text x="178" y="210" font-size="12" fill="#6b7280">1000 мкФ</text>
  <text x="178" y="226" font-size="12" fill="#c0392b">Буфер шини</text>

  <!-- Brake Chopper Module Box -->
  <rect x="245" y="122" width="160" height="194" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="325" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Brake Chopper</text>

  <!-- Resistor R_brake branch -->
  <line x1="285" y1="138" x2="285" y2="152" stroke="#c0392b" stroke-width="2"/>
  <rect x="277" y="152" width="16" height="36" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <!-- Heatsink fins -->
  <line x1="263" y1="158" x2="277" y2="158" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="263" y1="170" x2="277" y2="170" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="263" y1="182" x2="277" y2="182" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="263" y1="154" x2="263" y2="186" stroke="#6b7280" stroke-width="1.5"/>
  <text x="300" y="160" font-size="12" font-weight="bold" fill="#c0392b">R_brake</text>
  <text x="300" y="174" font-size="12" fill="#6b7280">2.2 Ом</text>
  <text x="300" y="188" font-size="12" fill="#6b7280">Радіатор</text>
  <text x="300" y="202" font-size="12" font-weight="bold" fill="#c0392b">♨ Тепло</text>

  <!-- Wire between Resistor and MOSFET Q_brake -->
  <line x1="285" y1="188" x2="285" y2="230" stroke="#27ae60" stroke-width="2.5"/>
  <line x1="285" y1="196" x2="285" y2="216" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <!-- MOSFET Q_brake -->
  <line x1="285" y1="230" x2="281" y2="234" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="281" y1="234" x2="281" y2="261" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="277" y1="238" x2="277" y2="257" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="281" y1="261" x2="285" y2="265" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="285" y1="265" x2="285" y2="295" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Gate connection to Comparator -->
  <line x1="330" y1="247" x2="277" y2="247" stroke="#2457d6" stroke-width="1.5"/>
  <polygon points="358,233 358,261 330,247" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="344" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Компаратор</text>

  <!-- Sense inputs to Comparator -->
  <line x1="358" y1="239" x2="385" y2="239" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="385" y1="239" x2="385" y2="138" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="2 2"/>
  <text x="388" y="160" font-size="12" fill="#2457d6">U_bus</text>
  <line x1="358" y1="255" x2="376" y2="255" stroke="#6b7280" stroke-width="1.5"/>
  <text x="378" y="259" font-size="12" fill="#6b7280">28В</text>

  <text x="300" y="278" font-size="12" font-weight="bold" fill="#27ae60">Q_brake (ВКЛ)</text>
  <text x="300" y="292" font-size="12" fill="#6b7280">MOSFET скидання</text>

  <!-- Regenerative Current Flow Labels on Rails -->
  <line x1="470" y1="138" x2="410" y2="138" stroke="#27ae60" stroke-width="3.5" marker-end="url(#arr-green)"/>
  <text x="438" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">I_regen ←</text>

  <line x1="310" y1="295" x2="520" y2="295" stroke="#27ae60" stroke-width="3.5" marker-end="url(#arr-green)"/>
  <text x="415" y="313" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">→ Повернення струму GND</text>

  <!-- 3-Phase Inverter Bridge Header -->
  <text x="545" y="128" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Трифазний міст MOSFET</text>

  <!-- Phase Leg U (x = 470) -->
  <!-- Upper Diode D1 (ACTIVE GREEN) -->
  <line x1="470" y1="138" x2="470" y2="160" stroke="#27ae60" stroke-width="2.5"/>
  <line x1="463" y1="160" x2="477" y2="160" stroke="#27ae60" stroke-width="2"/>
  <polygon points="463,174 477,174 470,160" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="470" y1="174" x2="470" y2="216" stroke="#27ae60" stroke-width="2.5"/>
  <line x1="470" y1="195" x2="470" y2="178" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="456" y="172" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">D1</text>
  <!-- Switch Q1 (Open) -->
  <line x1="486" y1="145" x2="486" y2="168" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="486" y1="195" x2="479" y2="170" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="486" y1="195" x2="486" y2="216" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="470" y1="145" x2="486" y2="145" stroke="#6b7280" stroke-width="1"/>
  <line x1="470" y1="216" x2="486" y2="216" stroke="#6b7280" stroke-width="1"/>
  <text x="494" y="172" font-size="12" fill="#6b7280">Q1</text>

  <!-- Node U -->
  <circle cx="470" cy="216" r="3.5" fill="#27ae60"/>
  <text x="458" y="218" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">U</text>

  <!-- Lower Diode D2 (Off) -->
  <line x1="470" y1="216" x2="470" y2="240" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="463" y1="240" x2="477" y2="240" stroke="#9ca3af" stroke-width="1.5"/>
  <polygon points="463,254 477,254 470,240" fill="#f4f6f8" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="470" y1="254" x2="470" y2="295" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="456" y="252" text-anchor="end" font-size="12" fill="#6b7280">D2</text>
  <!-- Switch Q2 (Open) -->
  <line x1="486" y1="222" x2="486" y2="246" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="486" y1="272" x2="479" y2="248" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="486" y1="272" x2="486" y2="295" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="470" y1="295" x2="486" y2="295" stroke="#6b7280" stroke-width="1"/>
  <text x="494" y="252" font-size="12" fill="#6b7280">Q2</text>

  <!-- Phase Leg V (x = 545) -->
  <!-- Upper Diode D3 (Off) -->
  <line x1="545" y1="138" x2="545" y2="160" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="538" y1="160" x2="552" y2="160" stroke="#9ca3af" stroke-width="1.5"/>
  <polygon points="538,174 552,174 545,160" fill="#f4f6f8" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="545" y1="174" x2="545" y2="216" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="531" y="172" text-anchor="end" font-size="12" fill="#6b7280">D3</text>
  <!-- Switch Q3 (Open) -->
  <line x1="561" y1="145" x2="561" y2="168" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="561" y1="195" x2="554" y2="170" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="561" y1="195" x2="561" y2="216" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="545" y1="145" x2="561" y2="145" stroke="#6b7280" stroke-width="1"/>
  <line x1="545" y1="216" x2="561" y2="216" stroke="#6b7280" stroke-width="1"/>
  <text x="569" y="172" font-size="12" fill="#6b7280">Q3</text>

  <!-- Node V -->
  <circle cx="545" cy="216" r="3.5" fill="#27ae60"/>
  <text x="533" y="218" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">V</text>

  <!-- Lower Diode D4 (ACTIVE GREEN) -->
  <line x1="545" y1="216" x2="545" y2="240" stroke="#27ae60" stroke-width="2.5"/>
  <line x1="538" y1="240" x2="552" y2="240" stroke="#27ae60" stroke-width="2"/>
  <polygon points="538,254 552,254 545,240" fill="#27ae60" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="545" y1="254" x2="545" y2="295" stroke="#27ae60" stroke-width="2.5"/>
  <line x1="545" y1="280" x2="545" y2="260" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="531" y="252" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">D4</text>
  <text x="555" y="272" font-size="12" font-weight="bold" fill="#27ae60">I_V ↑</text>
  <!-- Switch Q4 (Open) -->
  <line x1="561" y1="222" x2="561" y2="246" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="561" y1="272" x2="554" y2="248" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="561" y1="272" x2="561" y2="295" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="545" y1="295" x2="561" y2="295" stroke="#6b7280" stroke-width="1"/>
  <text x="569" y="252" font-size="12" fill="#6b7280">Q4</text>

  <!-- Phase Leg W (x = 620) -->
  <!-- Upper Diode D5 (Off) -->
  <line x1="620" y1="138" x2="620" y2="160" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="613" y1="160" x2="627" y2="160" stroke="#9ca3af" stroke-width="1.5"/>
  <polygon points="613,174 627,174 620,160" fill="#f4f6f8" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="620" y1="174" x2="620" y2="216" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="606" y="172" text-anchor="end" font-size="12" fill="#6b7280">D5</text>
  <!-- Switch Q5 (Open) -->
  <line x1="636" y1="145" x2="636" y2="168" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="636" y1="195" x2="629" y2="170" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="636" y1="195" x2="636" y2="216" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="620" y1="145" x2="636" y2="145" stroke="#6b7280" stroke-width="1"/>
  <line x1="620" y1="216" x2="636" y2="216" stroke="#6b7280" stroke-width="1"/>
  <text x="644" y="172" font-size="12" fill="#6b7280">Q5</text>

  <!-- Node W -->
  <circle cx="620" cy="216" r="3.5" fill="#1a1a1a"/>
  <text x="608" y="218" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">W</text>

  <!-- Lower Diode D6 (Off) -->
  <line x1="620" y1="216" x2="620" y2="240" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="613" y1="240" x2="627" y2="240" stroke="#9ca3af" stroke-width="1.5"/>
  <polygon points="613,254 627,254 620,240" fill="#f4f6f8" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="620" y1="254" x2="620" y2="295" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="606" y="252" text-anchor="end" font-size="12" fill="#6b7280">D6</text>
  <!-- Switch Q6 (Open) -->
  <line x1="636" y1="222" x2="636" y2="246" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="636" y1="272" x2="629" y2="248" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="636" y1="272" x2="636" y2="295" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="620" y1="295" x2="636" y2="295" stroke="#6b7280" stroke-width="1"/>
  <text x="644" y="252" font-size="12" fill="#6b7280">Q6</text>

  <!-- Phase Lines to Motor -->
  <line x1="470" y1="204" x2="748" y2="204" stroke="#27ae60" stroke-width="2.5"/>
  <line x1="470" y1="216" x2="470" y2="204" stroke="#27ae60" stroke-width="2.5"/>
  <line x1="710" y1="204" x2="670" y2="204" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="690" y="194" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">I_U ←</text>

  <line x1="545" y1="216" x2="748" y2="216" stroke="#27ae60" stroke-width="2.5"/>
  <line x1="670" y1="216" x2="710" y2="216" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <line x1="620" y1="228" x2="748" y2="228" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="620" y1="216" x2="620" y2="228" stroke="#6b7280" stroke-width="1.5"/>

  <!-- BLDC Motor -->
  <circle cx="790" cy="216" r="42" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <circle cx="790" cy="216" r="22" fill="#eaf0fd" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="774" y="206" width="16" height="20" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="782" y="221" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">N</text>
  <rect x="790" y="206" width="16" height="20" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="798" y="221" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">S</text>
  <path d="M 764,196 A 30 30 0 0 1 816,196" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="790" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">ω, J</text>

  <!-- Motor Labels -->
  <text x="790" y="148" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">BLDC Мотор</text>
  <text x="790" y="164" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">ГЕНЕРАТОРНИЙ РЕЖИМ</text>
  <text x="790" y="278" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">E_kin = (J · ω²) / 2</text>
  <text x="790" y="294" text-anchor="middle" font-size="12" fill="#6b7280">Гальмування: E_ЕРС &gt; U_bus</text>

  <!-- ==================== BOTTOM LEFT PANEL: GRAPH ==================== -->
  <rect x="22" y="342" width="446" height="176" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="38" y="362" font-size="14" font-weight="bold" fill="#1a1a1a">Динаміка напруги шини U_bus під час гальмування</text>
  <text x="38" y="378" font-size="12" fill="#6b7280">Поріг U_trip запобігає аварійному пробою ключів інвертора</text>

  <!-- Graph Axes -->
  <line x1="115" y1="478" x2="295" y2="478" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="300" y="482" font-size="12" font-weight="bold" fill="#1a1a1a">t</text>
  <line x1="115" y1="478" x2="115" y2="392" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="115" y="388" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">U</text>

  <!-- Voltage Threshold Lines -->
  <!-- 36V Max breakdown -->
  <line x1="115" y1="405" x2="285" y2="405" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="110" y="409" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">36 В (U_max)</text>

  <!-- 28V Trip chopper threshold -->
  <line x1="115" y1="430" x2="285" y2="430" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3 3"/>
  <text x="110" y="434" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">28 В (U_trip)</text>

  <!-- 24V Nominal bus -->
  <line x1="115" y1="455" x2="285" y2="455" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 2"/>
  <text x="110" y="459" text-anchor="end" font-size="12" fill="#6b7280">24 В (U_nom)</text>

  <!-- Time Ticks -->
  <line x1="145" y1="478" x2="145" y2="483" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="145" y="495" text-anchor="middle" font-size="12" fill="#6b7280">t_гальм</text>
  <line x1="255" y1="478" x2="255" y2="483" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="255" y="495" text-anchor="middle" font-size="12" fill="#6b7280">t_зуп</text>

  <!-- Curve Without Chopper (Red dashed) -->
  <path d="M 115,455 L 145,455 Q 165,455 180,415 T 205,395" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 3"/>

  <!-- Curve With Chopper (Green solid) -->
  <path d="M 115,455 L 145,455 Q 155,455 165,430 L 235,430 Q 245,430 255,455 L 285,455" fill="none" stroke="#27ae60" stroke-width="3"/>

  <!-- Status Cards on Graph -->
  <rect x="308" y="395" width="150" height="36" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="314" y="410" font-size="12" font-weight="bold" fill="#c0392b">БЕЗ баласту: &gt;45 В</text>
  <text x="314" y="424" font-size="12" fill="#c0392b">Пробій MOSFET і C_bus</text>

  <rect x="308" y="444" width="150" height="36" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="314" y="458" font-size="12" font-weight="bold" fill="#27ae60">З баластом: 28 В</text>
  <text x="314" y="472" font-size="12" fill="#27ae60">Скидання надлишку в R</text>

  <!-- ==================== BOTTOM RIGHT PANEL: PHYSICS ==================== -->
  <rect x="488" y="342" width="450" height="176" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="504" y="364" font-size="14" font-weight="bold" fill="#1a1a1a">Фізичний механізм та розрахунок енергії</text>

  <!-- Point 1 -->
  <text x="504" y="386" font-size="12" font-weight="bold" fill="#2457d6">1. Генераторний стрибок: U_peak = √(U_bus² + J·ω² / C)</text>
  <text x="504" y="402" font-size="12" fill="#1a1a1a">Кінетична енергія E_kin заряджає конденсатори C_bus без повернення в БЖ.</text>

  <!-- Point 2 -->
  <text x="504" y="426" font-size="12" font-weight="bold" fill="#27ae60">2. Поріг спрацьовування: U_bus ≥ U_trip (28 В)</text>
  <text x="504" y="442" font-size="12" fill="#1a1a1a">Компаратор вмикає Q_brake: струм скидається на резистор R_brake.</text>

  <!-- Point 3 -->
  <text x="504" y="466" font-size="12" font-weight="bold" fill="#c0392b">3. Потужність у теплі: P_peak = U_trip² / R_brake</text>
  <text x="504" y="482" font-size="12" fill="#1a1a1a">Для 28 В і 2.2 Ом: P_peak ≈ 356 Вт — потрібен масивний радіатор.</text>
  <text x="504" y="500" font-size="12" fill="#6b7280">Захищає MOSFET моста від перенапруги вище граничних 36 В.</text>
