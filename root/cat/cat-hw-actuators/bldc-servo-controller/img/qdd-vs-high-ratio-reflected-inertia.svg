<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>
  <text x="480" y="34" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Порівняння архітектур привода: геометрія ротора, зведена інерція та удар</text>
  <text x="480" y="55" text-anchor="middle" font-size="13" fill="#6b7280">Квазіпрямий привід (QDD) мінімізує зведену інерцію J_ref, рятуючи шестерні та забезпечуючи пропріоцепцію</text>
  <!-- КОЛОНКА 1 КОРПУС -->
  <rect x="24" y="74" width="288" height="464" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="66" y="88" width="204" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="168" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">ВИСОКОРЕДУКТОРНИЙ (N ≫ 1)</text>
  <text x="168" y="124" text-anchor="middle" font-size="12" fill="#6b7280">Довгий ротор + редуктор N = 100:1</text>
  <rect x="34" y="132" width="268" height="108" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="34" y="248" width="268" height="106" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
  <rect x="34" y="362" width="268" height="166" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <!-- КОЛОНКА 2 КОРПУС -->
  <rect x="336" y="74" width="288" height="464" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="382" y="88" width="196" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">ПРЯМИЙ (DIRECT DRIVE)</text>
  <text x="480" y="124" text-anchor="middle" font-size="12" fill="#6b7280">Дисковий ротор без передач N = 1:1</text>
  <rect x="346" y="132" width="268" height="108" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="346" y="248" width="268" height="106" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <rect x="346" y="362" width="268" height="166" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.2"/>
  <!-- КОЛОНКА 3 КОРПУС -->
  <rect x="648" y="74" width="288" height="464" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="706" y="88" width="172" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="792" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">КВАЗІПРЯМИЙ (QDD)</text>
  <text x="792" y="124" text-anchor="middle" font-size="12" fill="#6b7280">Ротор-млинець + планетарка N ≤ 9</text>
  <rect x="658" y="132" width="268" height="108" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="658" y="248" width="268" height="106" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
  <rect x="658" y="362" width="268" height="166" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <rect x="44" y="162" width="64" height="28" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="76" y="180" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Ротор</text>
  <line x1="108" y1="176" x2="122" y2="176" stroke="#1a1a1a" stroke-width="2.5"/>
  <rect x="122" y="152" width="60" height="48" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="152" y="171" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">Редуктор</text>
  <text x="152" y="189" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">N=100:1</text>
  <line x1="182" y1="176" x2="212" y2="176" stroke="#1a1a1a" stroke-width="3.5" marker-end="url(#arr-red)"/>
  <text x="222" y="162" font-size="12" fill="#1a1a1a">D_m: малий</text>
  <text x="222" y="180" font-size="12" fill="#1a1a1a">L_m: довгий</text>
  <text x="222" y="198" font-size="12" font-weight="700" fill="#c0392b">J_m: мала</text>
  <text x="168" y="226" text-anchor="middle" font-size="12" fill="#6b7280">Форма: «довгий циліндр», N ≫ 1</text>
  <text x="168" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">J_ref = J_m · N²</text>
  <rect x="48" y="278" width="240" height="12" rx="3" fill="#fdecea" stroke="#d0d7de" stroke-width="1"/>
  <rect x="48" y="278" width="240" height="12" rx="3" fill="#c0392b"/>
  <text x="168" y="306" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">N = 100 → J_ref = 10 000 · J_m</text>
  <text x="168" y="324" text-anchor="middle" font-size="12" fill="#6b7280">Інерція ротора зростає в 10 000 разів</text>
  <text x="168" y="342" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">✖ Заблокований вал (нуль реверсу)</text>
  <text x="168" y="380" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">Контактний удар (F_impulse)</text>
  <rect x="42" y="390" width="252" height="22" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="168" y="405" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">Зрізання зубців шестерень (злам)</text>
  <text x="44" y="428" font-size="12" fill="#1a1a1a">• J_ref блокує ротор від провертання</text>
  <text x="44" y="448" font-size="12" fill="#1a1a1a">• Імпульс сили сколює тонкі зубці</text>
  <text x="44" y="468" font-size="12" fill="#6b7280">• Тертя спотворює контактні сили</text>
  <text x="44" y="494" font-size="12" font-weight="700" fill="#c0392b">✖ Пропріоцепція неможлива:</text>
  <text x="44" y="514" font-size="12" fill="#c0392b">  тертя глушить сигнал сили на Iq</text>
  <rect x="358" y="145" width="28" height="62" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="396" y="160" font-size="12" font-weight="700" fill="#2457d6">Ротор-млинець</text>
  <text x="396" y="174" font-size="12" fill="#6b7280">багато полюсів</text>
  <line x1="386" y1="190" x2="524" y2="190" stroke="#1a1a1a" stroke-width="3.5" marker-end="url(#arr-blue)"/>
  <text x="396" y="208" font-size="12" font-weight="700" fill="#2457d6">Прямий вал (без ред.)</text>
  <text x="534" y="162" font-size="12" fill="#1a1a1a">D_m: великий</text>
  <text x="534" y="180" font-size="12" fill="#1a1a1a">L_m: плаский</text>
  <text x="534" y="198" font-size="12" font-weight="700" fill="#2457d6">N = 1:1</text>
  <text x="480" y="226" text-anchor="middle" font-size="12" fill="#6b7280">Форма: «диск-млинець», без редуктора</text>
  <text x="480" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">J_ref = J_m · 1² = J_m</text>
  <rect x="360" y="278" width="240" height="12" rx="3" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1"/>
  <rect x="360" y="278" width="14" height="12" rx="3" fill="#2457d6"/>
  <text x="480" y="306" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">N = 1 → J_ref = 1 · J_m</text>
  <text x="480" y="324" text-anchor="middle" font-size="12" fill="#6b7280">Інерція не множиться, але маса M ≫</text>
  <text x="480" y="342" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280">✔ Реверсивний, але важкий суглоб</text>
  <text x="480" y="380" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">Контактний удар (F_impulse)</text>
  <rect x="354" y="390" width="252" height="22" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
  <text x="480" y="405" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Зубців немає — нуль зламу шестерень</text>
  <text x="356" y="428" font-size="12" fill="#1a1a1a">• Пряме провертання ротора мотора</text>
  <text x="356" y="448" font-size="12" fill="#1a1a1a">• Момент передається безпосередньо</text>
  <text x="356" y="468" font-size="12" fill="#6b7280">• Але мотор важкий: ≫ маса кінцівки</text>
  <text x="356" y="494" font-size="12" font-weight="700" fill="#6b7280">~ Пропріоцепція працює,</text>
  <text x="356" y="514" font-size="12" fill="#6b7280">  але динаміка ноги обмежена масою</text>
  <rect x="668" y="145" width="28" height="62" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="696" y1="176" x2="712" y2="176" stroke="#1a1a1a" stroke-width="2.5"/>
  <rect x="712" y="152" width="84" height="48" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="754" y="171" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">Планетарка</text>
  <text x="754" y="189" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">N = 6..9:1</text>
  <line x1="796" y1="176" x2="836" y2="176" stroke="#1a1a1a" stroke-width="3.5" marker-end="url(#arr-green)"/>
  <text x="846" y="162" font-size="12" fill="#1a1a1a">D_m: великий</text>
  <text x="846" y="180" font-size="12" fill="#1a1a1a">L_m: плаский</text>
  <text x="846" y="198" font-size="12" font-weight="700" fill="#27ae60">N = 6..9:1</text>
  <text x="792" y="226" text-anchor="middle" font-size="12" fill="#6b7280">Форма: «млинець» + низька передача</text>
  <text x="792" y="268" text-anchor="middle" font-size="13" font-weight="700" fill="#27ae60">J_ref = J_m · N²</text>
  <rect x="672" y="278" width="240" height="12" rx="3" fill="#e9f7ef" stroke="#d0d7de" stroke-width="1"/>
  <rect x="672" y="278" width="38" height="12" rx="3" fill="#27ae60"/>
  <text x="792" y="306" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">N = 6..9 → J_ref = (36..81) · J_m</text>
  <text x="792" y="324" text-anchor="middle" font-size="12" fill="#6b7280">Зростання лише в 36–81 раз (не 10 000!)</text>
  <text x="792" y="342" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">✔ Повна зворотна прозорість за силами</text>
  <text x="792" y="380" text-anchor="middle" font-size="13" font-weight="700" fill="#27ae60">Контактний удар (F_impulse)</text>
  <rect x="666" y="390" width="252" height="22" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="792" y="405" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">Вільне пружне провертання (захист)</text>
  <text x="668" y="428" font-size="12" fill="#1a1a1a">• Мала J_ref дає ротору провернутись</text>
  <text x="668" y="448" font-size="12" fill="#1a1a1a">• Енергія розсіюється, редуктор цілий</text>
  <text x="668" y="468" font-size="12" fill="#1a1a1a">• Пружна зворотна механічна реакція</text>
  <text x="668" y="494" font-size="12" font-weight="700" fill="#27ae60">✔ Пропріоцептивний відгук:</text>
  <text x="668" y="514" font-size="12" font-weight="700" fill="#27ae60">  FOC детектує силу реакції через Iq</text>
</svg>
