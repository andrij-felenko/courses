<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Векторні перетворення Кларк і Парка у керуванні FOC</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Декомпозиція трифазних струмів статора на потік Id та момент Iq з кутом 90° до магнітів ротора</text>

  <!-- ==================== ПАНЕЛЬ 1: ПЕРЕТВОРЕННЯ КЛАРК ==================== -->
  <rect x="20" y="68" width="296" height="352" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="160" y="88" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Перетворення Кларк</text>
  <text x="160" y="104" font-size="12" fill="#6b7280" text-anchor="middle">Трифазні (a, b, c) → Двофазні (α, β)</text>

  <!-- Трифазні осі статора (120°) -->
  <line x1="160" y1="205" x2="128" y2="149" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="122" y="145" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="end">фаза b (+120°)</text>

  <line x1="160" y1="205" x2="128" y2="261" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="122" y="268" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="end">фаза c (-120°)</text>

  <!-- Нерухомі ортогональні осі α і β -->
  <line x1="160" y1="205" x2="235" y2="205" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="245" y="204" font-size="12" font-weight="bold" fill="#1a1a1a">α</text>
  <text x="245" y="218" font-size="12" fill="#6b7280">(фаза a)</text>

  <line x1="160" y1="205" x2="160" y2="138" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="160" y="126" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">β</text>

  <!-- Центр координат -->
  <circle cx="160" cy="205" r="3" fill="#1a1a1a"/>

  <!-- Проекції вектора струму Is -->
  <line x1="200" y1="160" x2="200" y2="205" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="160" y1="205" x2="200" y2="205" stroke="#2457d6" stroke-width="2.5"/>
  <text x="180" y="222" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Iα</text>

  <line x1="200" y1="160" x2="160" y2="160" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="160" y1="205" x2="160" y2="160" stroke="#2457d6" stroke-width="2.5"/>
  <text x="145" y="152" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Iβ</text>

  <!-- Просторовий вектор струму Is -->
  <line x1="160" y1="205" x2="200" y2="160" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="208" y="156" font-size="13" font-weight="bold" fill="#2457d6">Is</text>

  <!-- Внутрішня картка перетворення Кларк -->
  <rect x="28" y="298" width="280" height="112" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="160" y="316" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Пряма трансформація Кларк:</text>
  <text x="38" y="336" font-size="12" fill="#1a1a1a">Iα = Ia</text>
  <text x="38" y="354" font-size="12" fill="#1a1a1a">Iβ = (Ia + 2·Ib) / √3</text>
  <text x="38" y="376" font-size="12" fill="#6b7280">• Двофазна нерухома система статора</text>
  <text x="38" y="394" font-size="12" fill="#6b7280">• Рівновага струмів: Ia + Ib + Ic = 0</text>

  <!-- ==================== ПАНЕЛЬ 2: ПЕРЕТВОРЕННЯ ПАРКА ==================== -->
  <rect x="332" y="68" width="296" height="352" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="88" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Перетворення Парка</text>
  <text x="480" y="104" font-size="12" fill="#6b7280" text-anchor="middle">Нерухомі (α, β) → Обертові (d, q)</text>

  <!-- Базова вісь α (пунктир для відліку кута) -->
  <line x1="480" y1="205" x2="550" y2="205" stroke="#d0d7de" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="558" y="209" font-size="12" fill="#9ca3af">α</text>

  <!-- Обертова вісь d (магнітний потік ротора) -->
  <line x1="480" y1="205" x2="533" y2="168" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="542" y="164" font-size="12" font-weight="bold" fill="#27ae60">d (потік)</text>
  <text x="542" y="178" font-size="12" fill="#27ae60">Ψ_r ротора</text>

  <!-- Дуга електричного кута ротора θ_e -->
  <path d="M 516,205 A 36 36 0 0 0 510,184" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="524" y="198" font-size="12" font-weight="bold" fill="#1a1a1a">θ_e</text>

  <!-- Позначка прямого кута 90° між d і q -->
  <polyline points="490,198 483,188 473,195" stroke="#c0392b" stroke-width="1.5" fill="none"/>
  <text x="485" y="177" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">90°</text>

  <!-- Обертова вісь q (струм моменту Is = Iq) -->
  <line x1="480" y1="205" x2="443" y2="152" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="435" y="140" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">q (момент)</text>
  <text x="435" y="156" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">Is = Iq</text>
  <text x="435" y="172" font-size="12" fill="#2457d6" text-anchor="end">B_s ⊥ Ψ_r</text>

  <!-- Центр координат і точка Id = 0 -->
  <circle cx="480" cy="205" r="3" fill="#1a1a1a"/>
  <text x="496" y="224" font-size="12" font-weight="bold" fill="#27ae60">Id = 0 (потік)</text>

  <!-- Внутрішня картка перетворення Парка -->
  <rect x="340" y="298" width="280" height="112" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="316" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Пряма трансформація Парка:</text>
  <text x="350" y="336" font-size="12" fill="#1a1a1a">Id =  Iα·cos θ_e + Iβ·sin θ_e  →  0</text>
  <text x="350" y="354" font-size="12" fill="#1a1a1a">Iq = −Iα·sin θ_e + Iβ·cos θ_e  →  Is</text>
  <text x="350" y="376" font-size="12" fill="#27ae60">• Id = 0: нульове розмагнічування</text>
  <text x="350" y="394" font-size="12" fill="#2457d6">• Iq: максимальний момент (M ~ Iq)</text>

  <!-- ==================== ПАНЕЛЬ 3: СИНТЕЗ НАПРУГ SVPWM ==================== -->
  <rect x="644" y="68" width="296" height="352" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="792" y="88" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3. Синтез напруг SVPWM</text>
  <text x="792" y="104" font-size="12" fill="#6b7280" text-anchor="middle">(Vα, Vβ) → 6 ключів інвертора</text>

  <!-- Шестикутник базових векторів напруги -->
  <polygon points="852,205 822,153 762,153 732,205 762,257 822,257" fill="#eaf0fd" fill-opacity="0.4" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Базові вектори Сектора I: V1 та V2 -->
  <line x1="792" y1="205" x2="852" y2="205" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <line x1="792" y1="205" x2="822" y2="153" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- Вписане коло максимальної лінійної напруги -->
  <circle cx="792" cy="205" r="52" fill="none" stroke="#27ae60" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Підписи базових векторів -->
  <text x="858" y="209" font-size="12" font-weight="bold" fill="#2457d6">V1(100)</text>
  <text x="826" y="145" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">V2(110)</text>
  <text x="758" y="145" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">V3(010)</text>
  <text x="726" y="209" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">V4(011)</text>
  <text x="758" y="272" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">V5(001)</text>
  <text x="826" y="272" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">V6(101)</text>

  <!-- Нульові вектори у центрі -->
  <circle cx="792" cy="205" r="3" fill="#1a1a1a"/>
  <text x="792" y="224" font-size="12" fill="#6b7280" text-anchor="middle">V0, V7</text>

  <!-- Сектор I -->
  <text x="860" y="160" font-size="12" font-weight="bold" fill="#6b7280">Сектор I</text>

  <!-- Бажаний вектор напруги Vs* і проекції -->
  <line x1="831" y1="184" x2="818" y2="205" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="831" y1="184" x2="805" y2="184" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="792" y1="205" x2="831" y2="184" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="838" y="180" font-size="13" font-weight="bold" fill="#c0392b">Vs*</text>

  <!-- Внутрішня картка алгоритму SVPWM -->
  <rect x="652" y="298" width="280" height="112" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="792" y="316" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Алгоритм синтезу SVPWM:</text>
  <text x="662" y="336" font-size="12" fill="#1a1a1a">Vs* = (T1/Tp)·V1 + (T2/Tp)·V2</text>
  <text x="662" y="354" font-size="12" fill="#1a1a1a">T0 = Tp − T1 − T2  (вектори V0, V7)</text>
  <text x="662" y="376" font-size="12" fill="#27ae60">• +15.5% використання шини V_dc</text>
  <text x="662" y="394" font-size="12" fill="#6b7280">• Мінімум гармонік і пульсацій моменту</text>

  <!-- ==================== НИЖНЯ ПАНЕЛЬ: НАСКРІЗНИЙ ЛАНЦЮГ FOC ==================== -->
  <rect x="20" y="434" width="920" height="104" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="452" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Наскрізний контур векторного керування (FOC) у сервоконтролері</text>

  <!-- Блок 1: Датчики струму -->
  <rect x="40" y="464" width="156" height="62" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="118" y="482" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Датчики струму</text>
  <text x="118" y="498" font-size="12" fill="#2457d6" text-anchor="middle">Ia, Ib, Ic (три фази)</text>
  <text x="118" y="514" font-size="12" fill="#6b7280" text-anchor="middle">Шунти + вибірка АЦП</text>

  <!-- Стрілка 1 -> 2 -->
  <line x1="198" y1="495" x2="214" y2="495" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Блок 2: Кларк -->
  <rect x="216" y="464" width="156" height="62" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="294" y="482" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Кларк: (a,b,c)→(α,β)</text>
  <text x="294" y="498" font-size="12" fill="#2457d6" text-anchor="middle">Iα, Iβ (нерухомі осі)</text>
  <text x="294" y="514" font-size="12" fill="#6b7280" text-anchor="middle">Вектор струму Is</text>

  <!-- Стрілка 2 -> 3 -->
  <line x1="374" y1="495" x2="390" y2="495" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Блок 3: Парк (FOC ядро) -->
  <rect x="392" y="464" width="176" height="62" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="482" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">3. Парк: θ_e енкодера</text>
  <text x="480" y="498" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Id = 0 та Iq (момент)</text>
  <text x="480" y="514" font-size="12" fill="#27ae60" text-anchor="middle">Кут 90° між Is та Ψ_r</text>

  <!-- Стрілка 3 -> 4 -->
  <line x1="570" y1="495" x2="586" y2="495" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Блок 4: PI-регулятори -->
  <rect x="588" y="464" width="156" height="62" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="666" y="482" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">4. Регулятори PI</text>
  <text x="666" y="498" font-size="12" fill="#c0392b" text-anchor="middle">Vd*, Vq* → Об. Парк</text>
  <text x="666" y="514" font-size="12" fill="#6b7280" text-anchor="middle">Напруги Vα*, Vβ*</text>

  <!-- Стрілка 4 -> 5 -->
  <line x1="746" y1="495" x2="762" y2="495" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Блок 5: SVPWM -->
  <rect x="764" y="464" width="156" height="62" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="842" y="482" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">5. Модуляція SVPWM</text>
  <text x="842" y="498" font-size="12" fill="#27ae60" text-anchor="middle">6 ШІМ-сигналів моста</text>
  <text x="842" y="514" font-size="12" fill="#6b7280" text-anchor="middle">Комутація U, V, W</text>
</svg>
