<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>
  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>
  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Демпфування рекуперативного викиду напруги шини DC модулем Brake Chopper</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Пилкоподібне утримання напруги у вікні гістерезису усуває спрацьовування OVP та високочастотне деренчання</text>
  <!-- Фази процесу -->
  <rect x="110" y="72" width="140" height="24" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="180" y="88" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Номінальний хід</text>
  <rect x="262" y="72" width="436" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="88" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">2. Рекуперативне гальмування маховика (скидання енергії в баласт)</text>
  <rect x="710" y="72" width="200" height="24" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="810" y="88" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3. Зупинка / Норма</text>
  <!-- Канал 1: Напруга шини U_DC -->
  <rect x="110" y="106" width="800" height="174" fill="none" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="260" y="176" width="390" height="30" fill="#e9f7ef" stroke="none"/>
  <line x1="260" y1="106" x2="260" y2="280" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="710" y1="106" x2="710" y2="280" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="110" y1="136" x2="910" y2="136" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <line x1="110" y1="176" x2="910" y2="176" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="110" y1="206" x2="910" y2="206" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="110" y1="236" x2="910" y2="236" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="104" y="116" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">CH1: U_DC</text>
  <text x="104" y="140" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">32 В (OVP)</text>
  <text x="104" y="180" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">28 В (V_ON)</text>
  <text x="104" y="210" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">26 В (V_OFF)</text>
  <text x="104" y="240" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">24 В (ном.)</text>
  <text x="104" y="272" font-size="12" fill="#6b7280" text-anchor="end">20 В</text>
  <line x1="104" y1="106" x2="110" y2="106" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="104" y1="136" x2="110" y2="136" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="104" y1="176" x2="110" y2="176" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="104" y1="206" x2="110" y2="206" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="104" y1="236" x2="110" y2="236" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="104" y1="268" x2="110" y2="268" stroke="#6b7280" stroke-width="1.5"/>
  <text x="120" y="126" font-size="12" font-weight="bold" fill="#c0392b">Поріг OVP = 32 В</text>
  <text x="120" y="162" font-size="12" font-weight="bold" fill="#27ae60">Поріг V_ON = 28 В</text>
  <text x="120" y="196" font-size="12" font-weight="bold" fill="#27ae60">Поріг V_OFF = 26 В</text>
  <text x="120" y="226" font-size="12" fill="#6b7280">U_DC = 24 В (ном.)</text>
  <!-- Крива без баласту (аварійний викид) -->
  <path d="M 260,236 C 275,236 290,180 305,136 C 310,122 315,116 320,116" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="6,3" stroke-linecap="round"/>
  <circle cx="305" cy="136" r="4" fill="#c0392b"/>
  <rect x="330" y="108" width="150" height="24" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="405" y="124" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Без баласту: OVP аварія</text>
  <line x1="330" y1="120" x2="322" y2="116" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <!-- Крива з Brake Chopper (пилкоподібне утримання) -->
  <path d="M 110,236 L 260,236 L 285,176 L 315,206 L 350,176 L 385,206 L 425,176 L 465,206 L 515,176 L 560,206 L 615,182 L 645,206 C 665,225 685,236 710,236 L 910,236" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="285" cy="176" r="3" fill="#27ae60"/>
  <circle cx="350" cy="176" r="3" fill="#27ae60"/>
  <circle cx="425" cy="176" r="3" fill="#27ae60"/>
  <circle cx="515" cy="176" r="3" fill="#27ae60"/>
  <rect x="500" y="146" width="195" height="22" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="597" y="161" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Демпфування: вікно 26...28 В</text>
  <text x="810" y="226" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Маховик зупинено (24.0 В)</text>
  <!-- Канал 2: Струм баласту I_R -->
  <rect x="110" y="296" width="800" height="110" fill="none" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="260" y1="296" x2="260" y2="406" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="710" y1="296" x2="710" y2="406" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="110" y1="326" x2="910" y2="326" stroke="#2457d6" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="110" y1="386" x2="910" y2="386" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="104" y="306" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">CH2: I_R</text>
  <text x="104" y="330" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">8.5 А (пік)</text>
  <text x="104" y="390" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">0 А</text>
  <line x1="104" y1="296" x2="110" y2="296" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="104" y1="326" x2="110" y2="326" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="104" y1="386" x2="110" y2="386" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="285" y="326" width="30" height="60" fill="#eaf0fd" stroke="none"/>
  <rect x="350" y="326" width="35" height="60" fill="#eaf0fd" stroke="none"/>
  <rect x="425" y="326" width="40" height="60" fill="#eaf0fd" stroke="none"/>
  <rect x="515" y="326" width="45" height="60" fill="#eaf0fd" stroke="none"/>
  <rect x="615" y="326" width="30" height="60" fill="#eaf0fd" stroke="none"/>
  <path d="M 110,386 L 285,386 L 285,326 L 315,326 L 315,386 L 350,386 L 350,326 L 385,326 L 385,386 L 425,386 L 425,326 L 465,326 L 465,386 L 515,386 L 515,326 L 560,326 L 560,386 L 615,386 L 615,326 L 645,326 L 645,386 L 910,386" fill="none" stroke="#2457d6" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
  <text x="185" y="372" font-size="12" fill="#6b7280" text-anchor="middle">I_R = 0 А (MOSFET OFF)</text>
  <text x="480" y="316" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Імпульси струму баласту I_R ≈ 8.5 А (скидання енергії маховика)</text>
  <text x="810" y="356" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Чисті прямокутні фронти</text>
  <text x="810" y="372" font-size="12" fill="#6b7280" text-anchor="middle">ВЧ-деренчання усунуто</text>
  <!-- Вісь часу -->
  <line x1="110" y1="406" x2="110" y2="411" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="110" y="424" font-size="12" fill="#6b7280" text-anchor="middle">0</text>
  <line x1="210" y1="406" x2="210" y2="411" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="210" y="424" font-size="12" fill="#6b7280" text-anchor="middle">20</text>
  <line x1="310" y1="406" x2="310" y2="411" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="310" y="424" font-size="12" fill="#6b7280" text-anchor="middle">40</text>
  <line x1="410" y1="406" x2="410" y2="411" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="410" y="424" font-size="12" fill="#6b7280" text-anchor="middle">60</text>
  <line x1="510" y1="406" x2="510" y2="411" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="510" y="424" font-size="12" fill="#6b7280" text-anchor="middle">80</text>
  <line x1="610" y1="406" x2="610" y2="411" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="610" y="424" font-size="12" fill="#6b7280" text-anchor="middle">100</text>
  <line x1="710" y1="406" x2="710" y2="411" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="710" y="424" font-size="12" fill="#6b7280" text-anchor="middle">120</text>
  <line x1="810" y1="406" x2="810" y2="411" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="810" y="424" font-size="12" fill="#6b7280" text-anchor="middle">140</text>
  <line x1="910" y1="406" x2="910" y2="411" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="910" y="424" font-size="12" fill="#6b7280" text-anchor="middle">160 мс</text>
  <text x="510" y="444" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Час t, мілісекунди (хронологія рекуперативного гальмування)</text>
  <!-- Підсумкові картки -->
  <rect x="110" y="462" width="250" height="52" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="235" y="482" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">БЕЗ БАЛАСТУ (OVP аварія):</text>
  <text x="235" y="500" font-size="12" fill="#1a1a1a" text-anchor="middle">Стрибок &gt; 32 В, спрацьовує захист БЖ</text>
  <rect x="372" y="462" width="276" height="52" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="510" y="482" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">З BRAKE CHOPPER (гістерезис):</text>
  <text x="510" y="500" font-size="12" fill="#1a1a1a" text-anchor="middle">Пилкоподібне утримання у вікні 26...28 В</text>
  <rect x="660" y="462" width="250" height="52" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="785" y="482" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ВЧ-ДЕРЕНЧАННЯ УСУНУТО:</text>
  <text x="785" y="500" font-size="12" fill="#1a1a1a" text-anchor="middle">Чисті фронти струму, MOSFET не гріється</text>
</svg>
