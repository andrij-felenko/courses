<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розведення шини CAN шлейфом та схемотехнічний захист вузлів</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Узгодження лінії резисторами 120 Ом на краях та придушення шуму інверторів дроселями й TVS</text>

  <!-- ==================== ВЕРХНЯ ПАНЕЛЬ: ТОПОЛОГІЯ ШЛЕЙФУ ==================== -->
  <rect x="20" y="66" width="920" height="142" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="36" y="86" font-size="13" font-weight="bold" fill="#1a1a1a">Топологія магістралі «шлейф» (Daisy-Chain) та узгодження лінії</text>
  <text x="924" y="86" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">Rекв = 120 Ω || 120 Ω = 60 Ω</text>

  <!-- Вузол 1: Хост-контролер -->
  <rect x="36" y="98" width="180" height="98" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="126" y="116" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Хост-контролер</text>
  <text x="126" y="132" font-size="12" fill="#6b7280" text-anchor="middle">Крайня точка 1 (Master)</text>
  <rect x="46" y="140" width="160" height="22" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="126" y="156" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">RTERM = 120 Ω (УВІМКН)</text>
  <text x="126" y="182" font-size="12" fill="#1a1a1a" text-anchor="middle">Трансивер + TVS + CMC</text>

  <!-- Кабель між Хостом і Сервоприводом 1 -->
  <line x1="216" y1="142" x2="360" y2="142" stroke="#2457d6" stroke-width="2"/>
  <line x1="216" y1="158" x2="360" y2="158" stroke="#27ae60" stroke-width="2"/>
  <line x1="216" y1="174" x2="360" y2="174" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="288" y="118" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вита пара CAN</text>
  <text x="288" y="132" font-size="12" fill="#6b7280" text-anchor="middle">Z0 = 120 Ω + GND</text>
  <text x="288" y="192" font-size="12" fill="#6b7280" text-anchor="middle">CAN_GND</text>

  <!-- Вузол 2: Сервопривід 1 (проміжний) -->
  <rect x="360" y="98" width="240" height="98" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="116" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Сервопривід 1 (проміжний)</text>
  <text x="480" y="132" font-size="12" fill="#2457d6" text-anchor="middle">Наскрізні клеми IN / OUT (Lstub ≈ 0)</text>
  <rect x="375" y="140" width="210" height="22" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="480" y="156" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">RTERM: НЕМАЄ (резистор вимкнено)</text>
  <text x="480" y="182" font-size="12" fill="#1a1a1a" text-anchor="middle">Захисний бар'єр TVS + CMC</text>

  <!-- Кабель між Сервоприводом 1 і Сервоприводом N -->
  <line x1="600" y1="142" x2="744" y2="142" stroke="#2457d6" stroke-width="2"/>
  <line x1="600" y1="158" x2="744" y2="158" stroke="#27ae60" stroke-width="2"/>
  <line x1="600" y1="174" x2="744" y2="174" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="672" y="118" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Шлейф до суглоба N</text>
  <text x="672" y="132" font-size="12" fill="#6b7280" text-anchor="middle">Без відгалужень (stubs)</text>
  <text x="672" y="192" font-size="12" fill="#6b7280" text-anchor="middle">CAN_GND</text>

  <!-- Вузол 3: Сервопривід N (кінцевий) -->
  <rect x="744" y="98" width="180" height="98" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="834" y="116" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Сервопривід N (кінцевий)</text>
  <text x="834" y="132" font-size="12" fill="#6b7280" text-anchor="middle">Крайня точка 2 (Joint N)</text>
  <rect x="754" y="140" width="160" height="22" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="834" y="156" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">RTERM = 120 Ω (УВІМКН)</text>
  <text x="834" y="182" font-size="12" fill="#1a1a1a" text-anchor="middle">Трансивер + TVS + CMC</text>

  <!-- ==================== НИЖНЯ ПАНЕЛЬ: СХЕМОТЕХНІКА ЗАХИСТУ ==================== -->
  <rect x="20" y="218" width="920" height="326" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="36" y="238" font-size="13" font-weight="bold" fill="#1a1a1a">Схемотехніка вузла захисту інтерфейсу CAN у сервоприводі</text>
  <text x="924" y="238" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">Вхідний бар'єр: TVS + синфазний дросель (CMC) + трансивер</text>

  <!-- Блок 1: Здвоєний роз'єм CAN (шлейф без відгалужень) -->
  <rect x="36" y="252" width="144" height="172" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
  <text x="108" y="270" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Здвоєний роз'єм CAN</text>
  <text x="68" y="288" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вхід IN</text>
  <text x="148" y="288" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вихід OUT</text>

  <!-- Піни роз'єму IN -->
  <circle cx="68" cy="308" r="3.5" fill="#2457d6"/>
  <circle cx="68" cy="336" r="3.5" fill="#27ae60"/>
  <circle cx="68" cy="364" r="3.5" fill="#6b7280"/>
  <text x="44" y="312" font-size="12" fill="#2457d6">H</text>
  <text x="44" y="340" font-size="12" fill="#27ae60">L</text>
  <text x="40" y="368" font-size="12" fill="#6b7280">G</text>

  <!-- Піни роз'єму OUT -->
  <circle cx="148" cy="308" r="3.5" fill="#2457d6"/>
  <circle cx="148" cy="336" r="3.5" fill="#27ae60"/>
  <circle cx="148" cy="364" r="3.5" fill="#6b7280"/>
  <text x="160" y="312" font-size="12" fill="#2457d6">H</text>
  <text x="160" y="340" font-size="12" fill="#27ae60">L</text>
  <text x="160" y="368" font-size="12" fill="#6b7280">G</text>

  <!-- Наскрізні доріжки між IN і OUT прямо на платі -->
  <line x1="68" y1="308" x2="148" y2="308" stroke="#2457d6" stroke-width="2"/>
  <line x1="68" y1="336" x2="148" y2="336" stroke="#27ae60" stroke-width="2"/>
  <line x1="68" y1="364" x2="148" y2="364" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Відгалуження до внутрішньої схеми (Lstub ≈ 0) -->
  <circle cx="108" cy="308" r="2.5" fill="#2457d6"/>
  <circle cx="108" cy="336" r="2.5" fill="#27ae60"/>
  <circle cx="108" cy="364" r="2.5" fill="#6b7280"/>

  <text x="108" y="394" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">✔ Шлейф на платі</text>
  <text x="108" y="410" font-size="12" fill="#6b7280" text-anchor="middle">Lstub ≈ 0 (без відростка)</text>

  <!-- Лінії від роз'єму до TVS -->
  <line x1="108" y1="308" x2="204" y2="308" stroke="#2457d6" stroke-width="2"/>
  <line x1="108" y1="336" x2="204" y2="336" stroke="#27ae60" stroke-width="2"/>
  <line x1="108" y1="364" x2="204" y2="364" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Блок 2: TVS-діоди (супресори перенапруг) -->
  <rect x="204" y="252" width="144" height="172" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
  <text x="276" y="270" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">TVS-супресори</text>
  <text x="276" y="286" font-size="12" fill="#6b7280" text-anchor="middle">PESD2CAN (двоспрямовані)</text>

  <!-- Лінії через блок TVS -->
  <line x1="204" y1="308" x2="348" y2="308" stroke="#2457d6" stroke-width="2"/>
  <line x1="204" y1="336" x2="348" y2="336" stroke="#27ae60" stroke-width="2"/>
  <line x1="204" y1="364" x2="348" y2="364" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Збірка супресорів SOT-23 -->
  <rect x="238" y="298" width="76" height="54" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="276" y="316" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">TVS Array</text>
  <text x="276" y="332" font-size="12" fill="#1a1a1a" text-anchor="middle">24 В супресор</text>
  <text x="276" y="346" font-size="12" fill="#6b7280" text-anchor="middle">ESD ±15 кВ</text>

  <circle cx="238" cy="308" r="2.5" fill="#2457d6"/>
  <circle cx="238" cy="336" r="2.5" fill="#27ae60"/>
  <line x1="276" y1="352" x2="276" y2="364" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="276" cy="364" r="2.5" fill="#6b7280"/>

  <text x="276" y="394" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Захист від ESD/сплесків</text>
  <text x="276" y="410" font-size="12" fill="#6b7280" text-anchor="middle">Зрізання імпульсів &gt; 24 В</text>

  <!-- Лінії від TVS до CMC -->
  <line x1="348" y1="308" x2="376" y2="308" stroke="#2457d6" stroke-width="2"/>
  <line x1="348" y1="336" x2="376" y2="336" stroke="#27ae60" stroke-width="2"/>
  <line x1="348" y1="364" x2="376" y2="364" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Блок 3: Синфазний дросель (CMC) -->
  <rect x="376" y="252" width="154" height="172" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
  <text x="453" y="270" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Синфазний дросель (CMC)</text>
  <text x="453" y="286" font-size="12" fill="#6b7280" text-anchor="middle">L = 51...100 мкГн (фільтр ШІМ)</text>

  <!-- Котушка CANH -->
  <line x1="376" y1="308" x2="400" y2="308" stroke="#2457d6" stroke-width="2"/>
  <path d="M 400,308 A 6,6 0 0,1 412,308 A 6,6 0 0,1 424,308 A 6,6 0 0,1 436,308 A 6,6 0 0,1 448,308 L 458,308" fill="none" stroke="#2457d6" stroke-width="2"/>
  <line x1="458" y1="308" x2="530" y2="308" stroke="#2457d6" stroke-width="2"/>

  <!-- Котушка CANL -->
  <line x1="376" y1="336" x2="400" y2="336" stroke="#27ae60" stroke-width="2"/>
  <path d="M 400,336 A 6,6 0 0,1 412,336 A 6,6 0 0,1 424,336 A 6,6 0 0,1 436,336 A 6,6 0 0,1 448,336 L 458,336" fill="none" stroke="#27ae60" stroke-width="2"/>
  <line x1="458" y1="336" x2="530" y2="336" stroke="#27ae60" stroke-width="2"/>

  <!-- Осердя дроселя -->
  <line x1="400" y1="320" x2="456" y2="320" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="400" y1="323" x2="456" y2="323" stroke="#1a1a1a" stroke-width="1.2"/>

  <!-- Точки фазування обмоток -->
  <circle cx="403" cy="301" r="2" fill="#1a1a1a"/>
  <circle cx="403" cy="343" r="2" fill="#1a1a1a"/>

  <!-- Земля крізь CMC -->
  <line x1="376" y1="364" x2="530" y2="364" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>

  <text x="453" y="394" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Придушення синфазного шуму</text>
  <text x="453" y="410" font-size="12" fill="#6b7280" text-anchor="middle">ШІМ інвертора гаситься в CMC</text>

  <!-- Лінії від CMC до трансивера -->
  <line x1="530" y1="308" x2="556" y2="308" stroke="#2457d6" stroke-width="2"/>
  <line x1="530" y1="336" x2="556" y2="336" stroke="#27ae60" stroke-width="2"/>
  <line x1="530" y1="364" x2="556" y2="364" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Блок 4: Трансивер CAN -->
  <rect x="556" y="252" width="144" height="172" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="628" y="270" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Трансивер CAN</text>
  <text x="628" y="286" font-size="12" fill="#6b7280" text-anchor="middle">TJA1051 / SN65HVD230</text>

  <!-- Вхідні піни трансивера -->
  <circle cx="556" cy="308" r="3" fill="#2457d6"/>
  <circle cx="556" cy="336" r="3" fill="#27ae60"/>
  <circle cx="556" cy="364" r="3" fill="#6b7280"/>
  <text x="564" y="312" font-size="12" fill="#2457d6">CANH</text>
  <text x="564" y="340" font-size="12" fill="#27ae60">CANL</text>
  <text x="564" y="368" font-size="12" fill="#6b7280">GND</text>

  <!-- Схема диф. приймача -->
  <polygon points="610,314 638,326 610,338" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="618" y="329" font-size="12" font-weight="bold" fill="#2457d6">Diff</text>

  <!-- Вихідні цифрові піни -->
  <text x="690" y="322" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">RXD</text>
  <text x="690" y="350" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">TXD</text>
  <circle cx="700" cy="318" r="3" fill="#27ae60"/>
  <circle cx="700" cy="346" r="3" fill="#2457d6"/>

  <text x="628" y="394" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Диференціальний прийом</text>
  <text x="628" y="410" font-size="12" fill="#6b7280" text-anchor="middle">Логічні рівні 3.3 В до MCU</text>

  <!-- Лінії зв'язку трансивер <-> MCU -->
  <line x1="700" y1="318" x2="728" y2="318" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <line x1="728" y1="346" x2="700" y2="346" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Блок 5: BLDC Контролер та інвертор (джерело шуму) -->
  <rect x="728" y="252" width="196" height="172" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
  <text x="826" y="270" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">BLDC Сервоконтролер</text>
  <text x="826" y="286" font-size="12" fill="#6b7280" text-anchor="middle">Джерело комутаційного шуму</text>

  <!-- Внутрішній MCU -->
  <rect x="736" y="296" width="80" height="58" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="776" y="314" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">MCU ядра</text>
  <text x="776" y="330" font-size="12" fill="#1a1a1a" text-anchor="middle">CAN-модуль</text>
  <text x="776" y="344" font-size="12" fill="#6b7280" text-anchor="middle">FOC алгоритм</text>

  <!-- Внутрішній інвертор BLDC -->
  <rect x="824" y="296" width="92" height="58" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="870" y="314" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">ШІМ-інвертор</text>
  <text x="870" y="330" font-size="12" fill="#1a1a1a" text-anchor="middle">6 MOSFET</text>
  <text x="870" y="344" font-size="12" fill="#c0392b" text-anchor="middle">Фази U, V, W</text>

  <line x1="816" y1="325" x2="824" y2="325" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Зона завад від комутації -->
  <rect x="736" y="364" width="180" height="48" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="826" y="382" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Комутація інвертора (dV/dt)</text>
  <text x="826" y="400" font-size="12" fill="#1a1a1a" text-anchor="middle">ШІМ 20–40 кГц • синфазні наводки</text>

  <!-- ==================== ПІДСУМКОВІ КАРТКИ З ПРАВИЛАМИ ==================== -->
  <!-- Картка 1: Шлейф -->
  <rect x="36" y="440" width="280" height="84" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="48" y="460" font-size="12" font-weight="bold" fill="#27ae60">✔ Топологія: послідовний шлейф</text>
  <text x="48" y="478" font-size="12" fill="#1a1a1a">• 120 Ω лише на 2 фізичних кінцях (Rекв=60 Ω)</text>
  <text x="48" y="496" font-size="12" fill="#1a1a1a">• Наскрізні клеми: відгалуження Lstub ≈ 0</text>
  <text x="48" y="514" font-size="12" fill="#6b7280">• Усуває відбиття та стоячі хвилі в лінії</text>

  <!-- Картка 2: Дросель CMC -->
  <rect x="336" y="440" width="290" height="84" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="348" y="460" font-size="12" font-weight="bold" fill="#2457d6">✔ Фільтрація: синфазний дросель (CMC)</text>
  <text x="348" y="478" font-size="12" fill="#1a1a1a">• Індуктивність 51–100 мкГн на кожному вузлі</text>
  <text x="348" y="496" font-size="12" fill="#1a1a1a">• Пропускає протифазний корисний сигнал</text>
  <text x="348" y="514" font-size="12" fill="#6b7280">• Блокує синфазні перешкоди ШІМ-інвертора</text>

  <!-- Картка 3: TVS та заземлення -->
  <rect x="646" y="440" width="278" height="84" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="658" y="460" font-size="12" font-weight="bold" fill="#c0392b">✔ Захист: TVS-діоди та CAN_GND</text>
  <text x="658" y="478" font-size="12" fill="#1a1a1a">• Двоспрямовані TVS гасять ESD до ±15 кВ</text>
  <text x="658" y="496" font-size="12" fill="#1a1a1a">• Захист від сплесків рекуперації мотора</text>
