<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Топологія шини CAN / CAN FD та формат обміну даними з сервоприводами</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Шлейфове підключення з термінаторами 120 Ом усуває відбиття, а кадри синхронізують рух і телеметрію</text>

  <!-- ==================== ВЕРХНЯ ПАНЕЛЬ: ФІЗИЧНА ТОПОЛОГІЯ ==================== -->
  <rect x="24" y="70" width="912" height="216" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <text x="40" y="92" font-size="14" font-weight="700" fill="#1a1a1a">Фізичне розведення шини: послідовна топологія «шлейф» (Daisy-Chain)</text>
  <text x="920" y="92" font-size="12" fill="#6b7280" text-anchor="end">Диференційна пара CANH / CANL · Відгалуження ≤ 0.3 м</text>

  <!-- Лівий термінатор 120 Ом -->
  <line x1="50" y1="138" x2="74" y2="138" stroke="#2457d6" stroke-width="2"/>
  <line x1="50" y1="152" x2="74" y2="152" stroke="#27ae60" stroke-width="2"/>
  <line x1="50" y1="138" x2="50" y2="152" stroke="#c0392b" stroke-width="2"/>
  <rect x="42" y="140" width="16" height="10" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="50" y="126" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">120 Ω</text>
  <text x="50" y="170" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">R_term</text>
  <text x="50" y="184" font-size="12" fill="#6b7280" text-anchor="middle">(лівий)</text>

  <!-- Блок: Хост-контролер -->
  <rect x="74" y="106" width="160" height="168" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="74" y="106" width="160" height="24" rx="6" fill="#eaf0fd"/>
  <text x="154" y="122" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Хост-контролер (Master)</text>

  <!-- Внутрішні шини CANH / CANL у хості -->
  <line x1="74" y1="138" x2="234" y2="138" stroke="#2457d6" stroke-width="2"/>
  <line x1="74" y1="152" x2="234" y2="152" stroke="#27ae60" stroke-width="2"/>

  <!-- Відгалуження до трансивера хоста -->
  <line x1="135" y1="138" x2="135" y2="162" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="173" y1="152" x2="173" y2="162" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="135" cy="138" r="2.5" fill="#2457d6"/>
  <circle cx="173" cy="152" r="2.5" fill="#27ae60"/>

  <rect x="85" y="162" width="138" height="34" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="154" y="183" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Трансивер CAN (PHY)</text>

  <!-- Tx / Rx між трансивером і процесором -->
  <line x1="135" y1="196" x2="135" y2="206" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="173" y1="206" x2="173" y2="196" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="79" y="206" width="150" height="62" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="154" y="224" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Головний процесор</text>
  <text x="154" y="242" font-size="12" fill="#1a1a1a" text-anchor="middle">Планувальник траєкторій</text>
  <text x="154" y="259" font-size="12" fill="#6b7280" text-anchor="middle">Цикл опитування 1 кГц</text>

  <!-- Шина між Хостом і Сервоприводом 1 -->
  <line x1="234" y1="138" x2="284" y2="138" stroke="#2457d6" stroke-width="2"/>
  <line x1="234" y1="152" x2="284" y2="152" stroke="#27ae60" stroke-width="2"/>
  <text x="259" y="126" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">CANH</text>
  <text x="259" y="170" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">CANL</text>

  <!-- Блок: Сервопривід 1 -->
  <rect x="284" y="106" width="170" height="168" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="284" y="106" width="170" height="24" rx="6" fill="#eaf0fd"/>
  <text x="369" y="122" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Сервопривід 1 (ID 0x01)</text>

  <!-- Наскрізний шлейф шини в сервоприводі 1 -->
  <line x1="284" y1="138" x2="454" y2="138" stroke="#2457d6" stroke-width="2"/>
  <line x1="284" y1="152" x2="454" y2="152" stroke="#27ae60" stroke-width="2"/>

  <!-- Відгалуження до трансивера сервоприводу 1 -->
  <line x1="350" y1="138" x2="350" y2="162" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="388" y1="152" x2="388" y2="162" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="350" cy="138" r="2.5" fill="#2457d6"/>
  <circle cx="388" cy="152" r="2.5" fill="#27ae60"/>

  <rect x="300" y="162" width="138" height="34" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="369" y="183" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Трансивер CAN (PHY)</text>

  <!-- Tx / Rx -->
  <line x1="350" y1="196" x2="350" y2="206" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="388" y1="206" x2="388" y2="196" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="294" y="206" width="150" height="62" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="369" y="224" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">FOC Сервоконтролер</text>
  <text x="369" y="242" font-size="12" fill="#1a1a1a" text-anchor="middle">MCU + Міст MOSFET</text>
  <text x="369" y="259" font-size="12" fill="#6b7280" text-anchor="middle">BLDC мотор + Енкодер</text>

  <!-- Шина між Сервоприводом 1 і Сервоприводом 2 -->
  <line x1="454" y1="138" x2="504" y2="138" stroke="#2457d6" stroke-width="2"/>
  <line x1="454" y1="152" x2="504" y2="152" stroke="#27ae60" stroke-width="2"/>
  <text x="479" y="126" font-size="12" fill="#6b7280" text-anchor="middle">шлейф</text>
  <text x="479" y="170" font-size="12" fill="#6b7280" text-anchor="middle">120 Ω</text>

  <!-- Блок: Сервопривід 2 -->
  <rect x="504" y="106" width="170" height="168" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="504" y="106" width="170" height="24" rx="6" fill="#eaf0fd"/>
  <text x="589" y="122" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Сервопривід 2 (ID 0x02)</text>

  <!-- Наскрізний шлейф шини в сервоприводі 2 -->
  <line x1="504" y1="138" x2="674" y2="138" stroke="#2457d6" stroke-width="2"/>
  <line x1="504" y1="152" x2="674" y2="152" stroke="#27ae60" stroke-width="2"/>

  <!-- Відгалуження до трансивера сервоприводу 2 -->
  <line x1="570" y1="138" x2="570" y2="162" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="608" y1="152" x2="608" y2="162" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="570" cy="138" r="2.5" fill="#2457d6"/>
  <circle cx="608" cy="152" r="2.5" fill="#27ae60"/>

  <rect x="520" y="162" width="138" height="34" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="589" y="183" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Трансивер CAN (PHY)</text>

  <!-- Tx / Rx -->
  <line x1="570" y1="196" x2="570" y2="206" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="608" y1="206" x2="608" y2="196" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="514" y="206" width="150" height="62" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="589" y="224" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">FOC Сервоконтролер</text>
  <text x="589" y="242" font-size="12" fill="#1a1a1a" text-anchor="middle">MCU + Міст MOSFET</text>
  <text x="589" y="259" font-size="12" fill="#6b7280" text-anchor="middle">BLDC мотор + Енкодер</text>

  <!-- Проміжок з крапками до вузла N -->
  <line x1="674" y1="138" x2="690" y2="138" stroke="#2457d6" stroke-width="2" stroke-dasharray="3,3"/>
  <line x1="708" y1="138" x2="724" y2="138" stroke="#2457d6" stroke-width="2" stroke-dasharray="3,3"/>
  <line x1="674" y1="152" x2="690" y2="152" stroke="#27ae60" stroke-width="2" stroke-dasharray="3,3"/>
  <line x1="708" y1="152" x2="724" y2="152" stroke="#27ae60" stroke-width="2" stroke-dasharray="3,3"/>
  <text x="699" y="148" font-size="14" font-weight="700" fill="#6b7280" text-anchor="middle">···</text>
  <text x="699" y="185" font-size="12" fill="#6b7280" text-anchor="middle">Вузли 3..N-1</text>

  <!-- Блок: Сервопривід N -->
  <rect x="724" y="106" width="160" height="168" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="724" y="106" width="160" height="24" rx="6" fill="#eaf0fd"/>
  <text x="804" y="122" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Сервопривід N (ID 0x0N)</text>

  <!-- Наскрізний шлейф шини в сервоприводі N -->
  <line x1="724" y1="138" x2="884" y2="138" stroke="#2457d6" stroke-width="2"/>
  <line x1="724" y1="152" x2="884" y2="152" stroke="#27ae60" stroke-width="2"/>

  <!-- Відгалуження до трансивера сервоприводу N -->
  <line x1="785" y1="138" x2="785" y2="162" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="823" y1="152" x2="823" y2="162" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="785" cy="138" r="2.5" fill="#2457d6"/>
  <circle cx="823" cy="152" r="2.5" fill="#27ae60"/>

  <rect x="735" y="162" width="138" height="34" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="804" y="183" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Трансивер CAN (PHY)</text>

  <!-- Tx / Rx -->
  <line x1="785" y1="196" x2="785" y2="206" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="823" y1="206" x2="823" y2="196" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>

  <rect x="729" y="206" width="150" height="62" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="804" y="224" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">FOC Сервоконтролер</text>
  <text x="804" y="242" font-size="12" fill="#1a1a1a" text-anchor="middle">MCU + Міст MOSFET</text>
  <text x="804" y="259" font-size="12" fill="#6b7280" text-anchor="middle">BLDC мотор + Енкодер</text>

  <!-- Правий термінатор 120 Ом -->
  <line x1="884" y1="138" x2="906" y2="138" stroke="#2457d6" stroke-width="2"/>
  <line x1="884" y1="152" x2="906" y2="152" stroke="#27ae60" stroke-width="2"/>
  <line x1="906" y1="138" x2="906" y2="152" stroke="#c0392b" stroke-width="2"/>
  <rect x="898" y="140" width="16" height="10" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="906" y="126" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">120 Ω</text>
  <text x="906" y="170" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">R_term</text>
  <text x="906" y="184" font-size="12" fill="#6b7280" text-anchor="middle">(правий)</text>

  <!-- ==================== НИЖНЯ ПАНЕЛЬ: КАДРИ ТА ОБМІН ==================== -->
  <rect x="24" y="300" width="912" height="236" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <text x="40" y="322" font-size="14" font-weight="700" fill="#1a1a1a">Логіка синхронного обміну та формат пакетів CAN</text>
  <text x="920" y="322" font-size="12" fill="#6b7280" text-anchor="end">Цикл T_cycle = 1.0 мс · 1 Мбіт/с</text>

  <!-- РЯДОК 1: КАДР КЕРУВАННЯ -->
  <rect x="38" y="336" width="130" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="103" y="353" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Кадр керування</text>
  <text x="103" y="369" font-size="12" fill="#2457d6" text-anchor="middle">Хост → Серво</text>

  <rect x="176" y="336" width="130" height="42" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="241" y="353" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Node ID (11 біт)</text>
  <text x="241" y="369" font-size="12" fill="#1a1a1a" text-anchor="middle">0x140 + ID серва</text>

  <rect x="314" y="336" width="140" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="384" y="353" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Код команди (1 Б)</text>
  <text x="384" y="369" font-size="12" fill="#6b7280" text-anchor="middle">0xA2 (Цільовий кут)</text>

  <rect x="462" y="336" width="200" height="42" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="562" y="353" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Цільове положення (4 Б)</text>
  <text x="562" y="369" font-size="12" fill="#1a1a1a" text-anchor="middle">θ_cmd (int32, 0.01° / LSB)</text>

  <rect x="670" y="336" width="160" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="750" y="353" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Профіль руху (2 Б)</text>
  <text x="750" y="369" font-size="12" fill="#6b7280" text-anchor="middle">ω_max / I_max ліміти</text>

  <rect x="838" y="336" width="84" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="880" y="353" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">CRC / ACK</text>
  <text x="880" y="369" font-size="12" fill="#6b7280" text-anchor="middle">15 біт</text>

  <!-- РЯДОК 2: КАДР ТЕЛЕМЕТРІЇ -->
  <rect x="38" y="394" width="130" height="42" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="103" y="411" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Кадр телеметрії</text>
  <text x="103" y="427" font-size="12" fill="#27ae60" text-anchor="middle">Серво → Хост</text>

  <rect x="176" y="394" width="120" height="42" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="236" y="411" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Node ID (11 біт)</text>
  <text x="236" y="427" font-size="12" fill="#1a1a1a" text-anchor="middle">0x240 + ID серва</text>

  <rect x="304" y="394" width="170" height="42" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="389" y="411" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Фактичний кут (2 Б)</text>
  <text x="389" y="427" font-size="12" fill="#1a1a1a" text-anchor="middle">θ_act (магнітний енкодер)</text>

  <rect x="482" y="394" width="140" height="42" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="552" y="411" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Струм фаз (2 Б)</text>
  <text x="552" y="427" font-size="12" fill="#1a1a1a" text-anchor="middle">I_q (вимір моменту FOC)</text>

  <rect x="630" y="394" width="130" height="42" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="695" y="411" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Температура (1 Б)</text>
  <text x="695" y="427" font-size="12" fill="#1a1a1a" text-anchor="middle">T_FET / мотора (°C)</text>

  <rect x="768" y="394" width="154" height="42" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="845" y="411" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Код помилок (1 Б)</text>
  <text x="845" y="427" font-size="12" fill="#1a1a1a" text-anchor="middle">OverVolt · Temp · Encoder</text>

  <!-- РЯДОК 3: ЧАСОВА ДІАГРАМА ОБМІНУ -->
  <rect x="38" y="454" width="130" height="64" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="103" y="474" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Синхронний цикл</text>
  <text x="103" y="492" font-size="12" fill="#2457d6" text-anchor="middle">T_cycle = 1.0 мс</text>
  <text x="103" y="508" font-size="12" fill="#6b7280" text-anchor="middle">f_sync = 1000 Гц</text>

  <!-- Пакетні блоки на шкалі часу -->
  <rect x="176" y="456" width="90" height="26" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="221" y="473" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">CMD (ID 01)</text>

  <line x1="268" y1="469" x2="276" y2="469" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arr-gray)"/>

  <rect x="278" y="456" width="90" height="26" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="323" y="473" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">ТЕЛЕМ (01)</text>

  <rect x="384" y="456" width="90" height="26" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="429" y="473" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">CMD (ID 02)</text>

  <line x1="476" y1="469" x2="484" y2="469" stroke="#6b7280" stroke-width="1.2" marker-end="url(#arr-gray)"/>

