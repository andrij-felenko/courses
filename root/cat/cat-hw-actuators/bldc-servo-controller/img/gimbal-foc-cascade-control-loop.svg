<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Markers -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Каскадна структура FOC-керування BLDC-сервоприводом</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Двоконтурна система: зовнішній контур положення та внутрішній векторний контур струму</text>

  <!-- Structural Panels -->
  <!-- Panel 1: Position Loop -->
  <rect x="25" y="75" width="210" height="435" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="130" y="96" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">ЗОВНІШНІЙ КОНТУР (ПОЛОЖЕННЯ)</text>

  <!-- Panel 2: Current Loop & FOC -->
  <rect x="250" y="75" width="485" height="435" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="492" y="96" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">ВНУТРІШНІЙ КОНТУР СТРУМУ (FOC)</text>

  <!-- Panel 3: Motor & Sensors -->
  <rect x="750" y="75" width="185" height="435" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="842" y="96" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ОБ'ЄКТ І ДАВАЧІ</text>

  <!-- PANEL 1 CONTENT: POSITION LOOP -->
  <!-- Reference Input theta_ref -->
  <path d="M 30,160 L 56,160" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="44" y="148" font-size="12" fill="#1a1a1a" text-anchor="middle">θ_ref</text>

  <!-- Position Summing Junction -->
  <circle cx="72" cy="160" r="14" fill="white" stroke="#2457d6" stroke-width="2"/>
  <line x1="72" y1="146" x2="72" y2="174" stroke="#d0d7de" stroke-width="1"/>
  <line x1="58" y1="160" x2="86" y2="160" stroke="#d0d7de" stroke-width="1"/>
  <text x="56" y="154" font-size="12" font-weight="bold" fill="#27ae60">+</text>
  <text x="76" y="186" font-size="12" font-weight="bold" fill="#c0392b">-</text>

  <!-- Position Controller Box -->
  <path d="M 86,160 L 98,160" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <rect x="100" y="130" width="125" height="60" rx="6" fill="white" stroke="#2457d6" stroke-width="2"/>
  <text x="162" y="153" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Регулятор кута</text>
  <text x="162" y="173" font-size="12" fill="#6b7280" text-anchor="middle">(P / PID контур)</text>

  <!-- Output Iq* Signal Arrow -->
  <path d="M 225,160 L 263,160" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <text x="244" y="148" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">I_q*</text>

  <!-- PANEL 2 CONTENT: CURRENT LOOPS & FOC TRANSFORMS -->
  <!-- Iq Summing Junction -->
  <circle cx="278" cy="160" r="13" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="278" y1="147" x2="278" y2="173" stroke="#d0d7de" stroke-width="1"/>
  <line x1="265" y1="160" x2="291" y2="160" stroke="#d0d7de" stroke-width="1"/>
  <text x="262" y="154" font-size="12" font-weight="bold" fill="#27ae60">+</text>
  <text x="282" y="185" font-size="12" font-weight="bold" fill="#c0392b">-</text>

  <!-- PI Iq Controller -->
  <path d="M 291,160 L 303,160" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <rect x="305" y="135" width="95" height="50" rx="5" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="352" y="155" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ПІ-регулятор</text>
  <text x="352" y="172" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">струму I_q</text>

  <!-- Vq* Signal Arrow -->
  <path d="M 400,160 L 438,160" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="419" y="148" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">V_q*</text>

  <!-- Id* Reference & Junction -->
  <path d="M 238,240 L 263,240" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-gray)"/>
  <text x="250" y="228" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">I_d*=0</text>

  <!-- Id Summing Junction -->
  <circle cx="278" cy="240" r="13" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="278" y1="227" x2="278" y2="253" stroke="#d0d7de" stroke-width="1"/>
  <line x1="265" y1="240" x2="291" y2="240" stroke="#d0d7de" stroke-width="1"/>
  <text x="262" y="234" font-size="12" font-weight="bold" fill="#27ae60">+</text>
  <text x="282" y="265" font-size="12" font-weight="bold" fill="#c0392b">-</text>

  <!-- PI Id Controller -->
  <path d="M 291,240 L 303,240" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <rect x="305" y="215" width="95" height="50" rx="5" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="352" y="235" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ПІ-регулятор</text>
  <text x="352" y="252" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">струму I_d</text>

  <!-- Vd* Signal Arrow -->
  <path d="M 400,240 L 438,240" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="419" y="228" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">V_d*</text>

  <!-- Inverse Park Transform Box -->
  <rect x="440" y="125" width="110" height="145" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="495" y="148" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Обернений Park</text>
  <text x="495" y="168" font-size="12" fill="#1a1a1a" text-anchor="middle">(dq → αβ)</text>
  <text x="495" y="193" font-size="12" fill="#6b7280" text-anchor="middle">Перетворення</text>
  <text x="495" y="210" font-size="12" fill="#6b7280" text-anchor="middle">координат</text>
  <text x="495" y="245" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">V_α, V_β</text>

  <!-- Voltage Alpha/Beta Output Lines to SVPWM -->
  <path d="M 550,160 L 598,160" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <text x="575" y="148" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">V_α</text>

  <path d="M 550,240 L 598,240" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <text x="575" y="228" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">V_β</text>

  <!-- SVPWM Box -->
  <rect x="600" y="125" width="120" height="145" rx="6" fill="white" stroke="#2457d6" stroke-width="2"/>
  <text x="660" y="148" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Модулятор SVPWM</text>
  <text x="660" y="168" font-size="12" fill="#6b7280" text-anchor="middle">(αβ → ШІМ)</text>
  <text x="660" y="195" font-size="12" fill="#1a1a1a" text-anchor="middle">Генератор</text>
  <text x="660" y="212" font-size="12" fill="#1a1a1a" text-anchor="middle">ШІМ-сигналів</text>
  <text x="660" y="245" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">PWM_A, B, C</text>

  <!-- PANEL 3 CONTENT: ACTUATOR & SENSORS -->
  <!-- PWM Lines to Inverter -->
  <path d="M 720,155 L 768,155" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <path d="M 720,165 L 768,165" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <path d="M 720,175 L 768,175" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <text x="745" y="148" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ШІМ</text>

  <!-- 3-Phase Inverter -->
  <rect x="770" y="130" width="145" height="65" rx="6" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="842" y="155" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3-фазний інвертор</text>
  <text x="842" y="175" font-size="12" fill="#6b7280" text-anchor="middle">(місток MOSFET)</text>

  <!-- Phase Lines to Motor -->
  <path d="M 822,195 L 822,230" stroke="#2457d6" stroke-width="2"/>
  <path d="M 842,195 L 842,230" stroke="#27ae60" stroke-width="2"/>
  <path d="M 862,195 L 862,230" stroke="#c0392b" stroke-width="2"/>
  <text x="878" y="215" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">u, v, w</text>

  <!-- BLDC Motor Circle -->
  <circle cx="842" cy="260" r="30" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.5"/>
  <text x="842" y="255" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">BLDC</text>
  <text x="842" y="272" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Двигун</text>

  <!-- Dashed Phase Lines to Current Sensors -->
  <path d="M 822,290 L 822,325" stroke="#2457d6" stroke-dasharray="2,2"/>
  <path d="M 842,290 L 842,325" stroke="#27ae60" stroke-dasharray="2,2"/>
  <path d="M 862,290 L 862,325" stroke="#c0392b" stroke-dasharray="2,2"/>

  <!-- Current Sensors Box -->
  <rect x="770" y="325" width="145" height="65" rx="6" fill="white" stroke="#27ae60" stroke-width="1.5"/>
  <text x="842" y="348" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Давачі струму</text>
  <text x="842" y="368" font-size="12" fill="#6b7280" text-anchor="middle">I_a, I_b, I_c (шунти)</text>

  <!-- Shaft Coupling Line to Angle Sensor -->
  <path d="M 842,390 L 842,415" stroke="#6b7280" stroke-dasharray="3,3"/>

  <!-- Angle Sensors / IMU Box -->
  <rect x="770" y="415" width="145" height="70" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="842" y="435" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Давачі кута / IMU</text>
  <text x="842" y="453" font-size="12" fill="#1a1a1a" text-anchor="middle">Енкодер (ротор)</text>
  <text x="842" y="470" font-size="12" fill="#6b7280" text-anchor="middle">+ 6-осьовий IMU</text>

  <!-- FEEDBACK TRANSFORMATIONS & SIGNALS -->
  <!-- Phase Currents to Forward Clarke -->
  <path d="M 770,360 L 722,360" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="745" y="348" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">I_a,b,c</text>

  <!-- Forward Clarke Transform Box -->
  <rect x="600" y="325" width="120" height="70" rx="6" fill="white" stroke="#2457d6" stroke-width="1.5"/>
  <text x="660" y="348" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Прямий Clarke</text>
  <text x="660" y="365" font-size="12" fill="#6b7280" text-anchor="middle">(abc → αβ)</text>
  <text x="660" y="383" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">I_α, I_β</text>

  <!-- Forward Clarke to Forward Park Signal -->
  <path d="M 600,360 L 552,360" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <text x="575" y="348" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">I_α, I_β</text>

  <!-- Forward Park Transform Box -->
  <rect x="440" y="325" width="110" height="70" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="495" y="348" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Прямий Park</text>
  <text x="495" y="365" font-size="12" fill="#6b7280" text-anchor="middle">(αβ → dq)</text>
  <text x="495" y="383" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">I_d, I_q</text>

  <!-- Rotor Angle theta_e Routing from Angle Sensor to Park Blocks -->
  <path d="M 770,448 L 495,448 L 495,397" stroke="#2457d6" stroke-width="1.5" fill="none" marker-end="url(#arr-accent)"/>
  <path d="M 495,325 L 495,272" stroke="#2457d6" stroke-width="1.5" fill="none" marker-end="url(#arr-accent)"/>
  <text x="630" y="436" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Кут ротора θ_e</text>
  <text x="507" y="300" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">θ_e</text>

  <!-- Iq Current Feedback Line to Iq Summing Junction -->
  <path d="M 440,345 L 258,345 L 258,190 L 278,190 L 278,175" stroke="#2457d6" stroke-width="1.5" fill="none" marker-end="url(#arr-accent)"/>
  <text x="360" y="333" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Струм I_q</text>

  <!-- Id Current Feedback Line to Id Summing Junction -->
  <path d="M 440,375 L 278,375 L 278,255" stroke="#6b7280" stroke-width="1.5" fill="none" marker-end="url(#arr-gray)"/>
  <text x="360" y="388" font-size="12" fill="#6b7280" text-anchor="middle">Струм I_d</text>

  <!-- Position Angle Feedback Line theta from Sensor/IMU to Position Junction -->
  <path d="M 842,485 L 842,500 L 72,500 L 72,176" stroke="#27ae60" stroke-width="2" fill="none" marker-end="url(#arr-green)"/>
  <text x="250" y="488" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">Зворотний зв'язок за кутом θ (з IMU / енкодера)</text>

  <!-- Bottom Legend Bar -->
  <rect x="25" y="520" width="910" height="30" rx="4" fill="#eaf0fd" stroke="#d0d7de"/>
  <text x="45" y="540" font-size="12" font-weight="bold" fill="#2457d6">■ FOC Перетворення (Park/Clarke)</text>
  <text x="340" y="540" font-size="12" font-weight="bold" fill="#27ae60">■ Зворотний зв'язок (Кут θ / Струми I_abc)</text>
  <text x="680" y="540" font-size="12" fill="#6b7280">Оптимізовано для Gimbal Direct-Drive</text>
</svg>
