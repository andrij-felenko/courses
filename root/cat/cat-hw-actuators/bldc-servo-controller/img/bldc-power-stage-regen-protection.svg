<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Силовий каскад BLDC-контролера з регенеративним захистом</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">При V_BUS &gt; V_th ключ Brake Chopper скидає регенеративну енергію ротора на R_brake</text>

  <!-- PANEL 1: Power Supply & Brake Chopper -->
  <rect x="30" y="75" width="265" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="162.5" y="96" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Живлення та Brake Chopper</text>
  <text x="162.5" y="114" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Схема регенеративного захисту</text>

  <!-- Power Bus Lines in Panel 1 -->
  <line x1="45" y1="135" x2="285" y2="135" stroke="#c0392b" stroke-width="2"/>
  <text x="45" y="127" font-size="12" font-weight="bold" fill="#c0392b">+V_BUS (+48V)</text>

  <line x1="45" y1="380" x2="285" y2="380" stroke="#1a1a1a" stroke-width="2"/>
  <text x="45" y="397" font-size="12" font-weight="bold" fill="#1a1a1a">GND (0V)</text>

  <!-- Bulk Capacitor C_BUS -->
  <line x1="80" y1="135" x2="80" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="68" y1="160" x2="92" y2="160" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="68" y1="172" x2="92" y2="172" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="80" y1="172" x2="80" y2="380" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="98" y="163" font-size="12" font-weight="bold" fill="#1a1a1a">C_BUS</text>
  <text x="98" y="178" font-size="12" fill="#6b7280">1000 µF</text>

  <!-- Brake Chopper Sub-panel -->
  <rect x="145" y="145" width="140" height="225" rx="6" fill="#fdecea" fill-opacity="0.3" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="215" y="160" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Brake Chopper</text>

  <!-- Current flow arrow I_regen -->
  <line x1="160" y1="170" x2="160" y2="205" stroke="#c0392b" stroke-width="2" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
  <text x="156" y="190" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">I_regen</text>

  <!-- Resistor R_brake -->
  <line x1="180" y1="135" x2="180" y2="170" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="172" y="170" width="16" height="36" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <line x1="180" y1="206" x2="180" y2="230" stroke="#c0392b" stroke-width="1.5"/>
  <text x="194" y="183" font-size="12" font-weight="bold" fill="#c0392b">R_brake</text>
  <text x="194" y="197" font-size="12" fill="#c0392b">4.7 Ω</text>

  <!-- Q_brake MOSFET -->
  <rect x="172" y="230" width="16" height="36" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="180" y1="266" x2="180" y2="380" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="194" y="245" font-size="12" font-weight="bold" fill="#1a1a1a">Q_brake</text>
  <text x="194" y="259" font-size="12" fill="#6b7280">(Power FET)</text>

  <!-- Voltage Sense line -->
  <line x1="272" y1="135" x2="272" y2="295" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Comparator Box -->
  <rect x="152" y="295" width="126" height="65" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="215" y="312" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Компаратор V_BUS</text>
  <text x="215" y="328" font-size="12" fill="#1a1a1a" text-anchor="middle">Поріг V_th = 52V</text>
  <text x="215" y="344" font-size="12" fill="#6b7280" text-anchor="middle">V_BUS &gt; 52V → High</text>

  <!-- Gate Drive connection from Comparator to Q_brake Gate -->
  <path d="M 152 327 L 135 327 L 135 248 L 172 248" stroke="#c0392b" stroke-width="1.5" fill="none" marker-end="url(#arr-red)"/>

  <!-- Status Box -->
  <rect x="45" y="402" width="235" height="52" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="162.5" y="422" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Статус: Chopper ON (V_BUS &gt; V_th)</text>
  <text x="162.5" y="440" font-size="12" fill="#27ae60" text-anchor="middle">Скидання енергії на R_brake</text>

  <!-- PANEL 2: 3-Phase Inverter Bridge -->
  <rect x="315" y="75" width="355" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="492.5" y="96" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Трифазний мостовий інвертор (FOC)</text>
  <text x="492.5" y="114" font-size="12" fill="#6b7280" text-anchor="middle">6 силових MOSFET + вимірювання струмів</text>

  <!-- Power Bus Lines in Panel 2 -->
  <line x1="285" y1="135" x2="645" y2="135" stroke="#c0392b" stroke-width="2"/>
  <line x1="285" y1="380" x2="645" y2="380" stroke="#1a1a1a" stroke-width="2"/>

  <!-- PHASE A (U) BRANCH -->
  <line x1="365" y1="135" x2="365" y2="155" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="357" y="155" width="16" height="36" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="350" y="177" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Q_AH</text>
  <!-- Diode A High -->
  <path d="M 380 160 L 380 186 M 374 168 L 386 168 L 380 178 Z" stroke="#1a1a1a" stroke-width="1" fill="#1a1a1a"/>

  <!-- Midpoint A -->
  <line x1="365" y1="191" x2="365" y2="265" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="365" cy="200" r="3" fill="#2457d6"/>

  <rect x="357" y="265" width="16" height="36" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="350" y="287" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Q_AL</text>
  <!-- Diode A Low -->
  <path d="M 380 270 L 380 296 M 374 278 L 386 278 L 380 288 Z" stroke="#1a1a1a" stroke-width="1" fill="#1a1a1a"/>

  <!-- Shunt A -->
  <line x1="365" y1="301" x2="365" y2="325" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="359" y="325" width="12" height="25" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="378" y="340" font-size="12" font-weight="bold" fill="#6b7280">R_shA</text>
  <line x1="365" y1="350" x2="365" y2="380" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- PHASE B (V) BRANCH -->
  <line x1="475" y1="135" x2="475" y2="155" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="467" y="155" width="16" height="36" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="460" y="177" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Q_BH</text>
  <!-- Diode B High -->
  <path d="M 490 160 L 490 186 M 484 168 L 496 168 L 490 178 Z" stroke="#1a1a1a" stroke-width="1" fill="#1a1a1a"/>

  <!-- Midpoint B -->
  <line x1="475" y1="191" x2="475" y2="265" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="475" cy="220" r="3" fill="#27ae60"/>

  <rect x="467" y="265" width="16" height="36" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="460" y="287" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Q_BL</text>
  <!-- Diode B Low -->
  <path d="M 490 270 L 490 296 M 484 278 L 496 278 L 490 288 Z" stroke="#1a1a1a" stroke-width="1" fill="#1a1a1a"/>

  <!-- Shunt B -->
  <line x1="475" y1="301" x2="475" y2="325" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="469" y="325" width="12" height="25" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="488" y="340" font-size="12" font-weight="bold" fill="#6b7280">R_shB</text>
  <line x1="475" y1="350" x2="475" y2="380" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- PHASE C (W) BRANCH -->
  <line x1="585" y1="135" x2="585" y2="155" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="577" y="155" width="16" height="36" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="570" y="177" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Q_CH</text>
  <!-- Diode C High -->
  <path d="M 600 160 L 600 186 M 594 168 L 606 168 L 600 178 Z" stroke="#1a1a1a" stroke-width="1" fill="#1a1a1a"/>

  <!-- Midpoint C -->
  <line x1="585" y1="191" x2="585" y2="265" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="585" cy="240" r="3" fill="#c0392b"/>

  <rect x="577" y="265" width="16" height="36" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="570" y="287" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">Q_CL</text>
  <!-- Diode C Low -->
  <path d="M 600 270 L 600 296 M 594 278 L 606 278 L 600 288 Z" stroke="#1a1a1a" stroke-width="1" fill="#1a1a1a"/>

  <!-- Shunt C -->
  <line x1="585" y1="301" x2="585" y2="325" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="579" y="325" width="12" height="25" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="598" y="340" font-size="12" font-weight="bold" fill="#6b7280">R_shC</text>
  <line x1="585" y1="350" x2="585" y2="380" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- MCU / Gate Driver Box -->
  <rect x="330" y="402" width="325" height="52" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="492.5" y="422" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Драйвер затворів &amp; MCU (FOC)</text>
  <text x="492.5" y="440" font-size="12" fill="#6b7280" text-anchor="middle">6-ШІМ сигналів + Опитування енкодера</text>

  <!-- PANEL 3: BLDC Motor & Magnetic Encoder -->
  <rect x="690" y="75" width="240" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="810" y="96" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3. Двигун та Енкодер</text>
  <text x="810" y="114" font-size="12" fill="#6b7280" text-anchor="middle">BLDC з магнітним енкодером</text>

  <!-- Stator Circle -->
  <circle cx="810" cy="175" r="42" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Stator Windings -->
  <!-- Phase U (Top, 12 o'clock) -->
  <circle cx="810" cy="133" r="10" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="810" y="137" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">U</text>

  <!-- Phase V (Right, 4 o'clock) -->
  <circle cx="846" cy="196" r="10" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="846" y="200" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">V</text>

  <!-- Phase W (Left, 8 o'clock) -->
  <circle cx="774" cy="196" r="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="774" y="200" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">W</text>

  <!-- Rotor & Permanent Magnets -->
  <circle cx="810" cy="175" r="22" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 788 175 A 22 22 0 0 1 832 175 Z" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <path d="M 788 175 A 22 22 0 0 0 832 175 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="810" y="166" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">N</text>
  <text x="810" y="188" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">S</text>

  <!-- Motor Shaft -->
  <line x1="810" y1="197" x2="810" y2="258" stroke="#1a1a1a" stroke-width="3" stroke-dasharray="5,2"/>
  <text x="825" y="232" font-size="12" fill="#6b7280">Вал ротора</text>

  <!-- Shaft Magnet -->
  <rect x="792" y="258" width="36" height="16" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="792" y="258" width="18" height="16" fill="#c0392b"/>
  <rect x="810" y="258" width="18" height="16" fill="#2457d6"/>
  <text x="801" y="270" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">N</text>
  <text x="819" y="270" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">S</text>
  <text x="836" y="270" font-size="12" font-weight="bold" fill="#1a1a1a">Магніт</text>

  <!-- Air Gap -->
  <text x="810" y="293" font-size="12" fill="#6b7280" text-anchor="middle">Зазор 0.5–1.0 мм</text>

  <!-- Encoder IC Box -->
  <rect x="710" y="308" width="200" height="62" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="810" y="325" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Абсолютний енкодер (IC)</text>
  <text x="810" y="341" font-size="12" fill="#1a1a1a" text-anchor="middle">Протокол: SPI / BiSS-C</text>
  <text x="810" y="357" font-size="12" fill="#6b7280" text-anchor="middle">Роздільна здатність: 14 біт</text>

  <!-- WIRES & BUS CONNECTIONS -->

  <!-- Phase Output Wires (Panel 2 to Panel 3) -->
  <!-- Phase U (Blue) -->
  <path d="M 365 200 L 730 200 L 730 133 L 798 133" stroke="#2457d6" stroke-width="2.5" fill="none" marker-end="url(#arr-blue)"/>
  <text x="385" y="188" font-size="12" font-weight="bold" fill="#2457d6">Фаза U</text>

  <!-- Phase V (Green) -->
  <path d="M 475 220 L 748 220 L 748 114 L 872 114 L 872 196 L 858 196" stroke="#27ae60" stroke-width="2.5" fill="none" marker-end="url(#arr-green)"/>
  <text x="495" y="208" font-size="12" font-weight="bold" fill="#27ae60">Фаза V</text>

  <!-- Phase W (Red) -->
  <path d="M 585 240 L 715 240 L 715 196 L 762 196" stroke="#c0392b" stroke-width="2.5" fill="none" marker-end="url(#arr-red)"/>
  <text x="605" y="228" font-size="12" font-weight="bold" fill="#c0392b">Фаза W</text>

  <!-- Digital Encoder Feedback Bus (Panel 3 to Panel 2) -->
  <path d="M 710 339 L 670 339 L 670 428 L 657 428" stroke="#2457d6" stroke-width="2" stroke-dasharray="4,2" fill="none" marker-end="url(#arr-blue)"/>
  <text x="660" y="396" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">Кут ротора θ (SPI)</text>

  <!-- BOTTOM SUMMARY BANNER -->
  <rect x="30" y="485" width="900" height="52" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="505" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Алгоритм захисту від зворотної ЕРС (Regeneration Sequence):</text>
  <text x="480" y="524" font-size="12" fill="#1a1a1a" text-anchor="middle">1. Гальмування ротора → 2. V_BUS перевищує V_th (52V) → 3. Компаратор вмикає Q_brake → 4. Енергія розсіюється на R_brake</text>
</svg>
