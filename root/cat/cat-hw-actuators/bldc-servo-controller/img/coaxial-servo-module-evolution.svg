<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Header & Subheader -->
  <text x="480" y="32" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Еволюція сервоприводів: від дискретної системи до коаксіального модуля</text>
  <text x="480" y="55" font-size="13" text-anchor="middle" fill="#6b7280">Інтеграція силової електроніки, енкодера та контролера в корпус мотора усуває джгути та мініатюризує вузол</text>

  <!-- LEFT PANEL: Discrete System -->
  <rect x="25" y="75" width="420" height="400" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  
  <rect x="40" y="90" width="390" height="32" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="235" y="111" font-size="14" font-weight="bold" text-anchor="middle" fill="#c0392b">1. Дискретна сервосистема (Трапецеїдальна / Холл)</text>
  <text x="235" y="137" font-size="12" text-anchor="middle" fill="#6b7280">Окремі вузли, з'єднані зовнішніми джгутами проводів</text>

  <!-- Driver Block -->
  <rect x="45" y="160" width="130" height="115" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="110" y="180" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Драйвер / МК</text>
  <text x="55" y="200" font-size="11" fill="#6b7280">• Окрема плата</text>
  <text x="55" y="218" font-size="11" fill="#6b7280">• Силові ключі</text>
  <text x="55" y="236" font-size="11" fill="#6b7280">• 6-кроковий ШІМ</text>
  <text x="55" y="254" font-size="11" fill="#6b7280">• Радіатор</text>

  <!-- Cable Harness -->
  <text x="235" y="172" font-size="11" font-weight="bold" text-anchor="middle" fill="#c0392b">Джгут проводів</text>
  
  <!-- Phase wires -->
  <line x1="175" y1="182" x2="295" y2="182" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="175" y1="190" x2="295" y2="190" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,2"/>
  <line x1="175" y1="198" x2="295" y2="198" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="235" y="212" font-size="10" text-anchor="middle" fill="#c0392b">3× фазові провідники</text>

  <!-- Sensor wires -->
  <line x1="175" y1="226" x2="295" y2="226" stroke="#6b7280" stroke-width="1"/>
  <line x1="175" y1="232" x2="295" y2="232" stroke="#6b7280" stroke-width="1"/>
  <line x1="175" y1="238" x2="295" y2="238" stroke="#6b7280" stroke-width="1"/>
  <line x1="175" y1="244" x2="295" y2="244" stroke="#6b7280" stroke-width="1"/>
  <line x1="175" y1="250" x2="295" y2="250" stroke="#6b7280" stroke-width="1"/>
  <text x="235" y="266" font-size="10" text-anchor="middle" fill="#c0392b">5× датчики Холла</text>

  <!-- Motor Block -->
  <rect x="295" y="160" width="130" height="115" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="360" y="180" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">BLDC Мотор</text>
  <text x="305" y="200" font-size="11" fill="#6b7280">• Окремий корпус</text>
  <text x="305" y="218" font-size="11" fill="#c0392b">• 3× датчики Холла</text>
  <text x="305" y="236" font-size="11" fill="#6b7280">• Дискретність 60°</text>
  <text x="305" y="254" font-size="11" fill="#6b7280">• Пульсації моменту</text>

  <!-- Left Summary Box -->
  <rect x="40" y="290" width="390" height="170" rx="6" fill="#ffffff" stroke="#c0392b" stroke-dasharray="3,3"/>
  <text x="55" y="310" font-size="12" font-weight="bold" fill="#c0392b">Недоліки дискретної системи:</text>
  <text x="55" y="332" font-size="11" fill="#1a1a1a">✕ Високий рівень EMI від довгих фазних проводів</text>
  <text x="55" y="354" font-size="11" fill="#1a1a1a">✕ Обмежена точність (датчики Холла з кроком 60°)</text>
  <text x="55" y="376" font-size="11" fill="#1a1a1a">✕ Громіздкі джгути погіршують рухливість суглобів</text>
  <text x="55" y="398" font-size="11" fill="#1a1a1a">✕ Пульсації моменту й шум при 6-кроковій комутації</text>
  <text x="55" y="420" font-size="11" fill="#1a1a1a">✕ Ризик обриву зв'язку й пошкодження роз'ємів</text>
  <text x="55" y="442" font-size="11" fill="#1a1a1a">✕ Низька енергоефективність і значні втрати</text>

  <!-- CENTRAL TRANSITION -->
  <rect x="450" y="170" width="60" height="34" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="184" font-size="10" font-weight="bold" text-anchor="middle" fill="#2457d6">FOC &amp;</text>
  <text x="480" y="197" font-size="10" font-weight="bold" text-anchor="middle" fill="#2457d6">SMD Encoders</text>
  
  <line x1="452" y1="225" x2="502" y2="225" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-accent)"/>

  <rect x="450" y="340" width="60" height="44" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="356" font-size="10" font-weight="bold" text-anchor="middle" fill="#2457d6">Еволюційний</text>
  <text x="480" y="372" font-size="10" font-weight="bold" text-anchor="middle" fill="#2457d6">стрибок</text>

  <!-- RIGHT PANEL: Integrated Coaxial Module -->
  <rect x="515" y="75" width="420" height="400" rx="8" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/>
  
  <rect x="530" y="90" width="390" height="32" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="725" y="111" font-size="14" font-weight="bold" text-anchor="middle" fill="#27ae60">2. Коаксіальний сервомодуль (Сучасний FOC)</text>
  <text x="725" y="137" font-size="12" text-anchor="middle" fill="#6b7280">Монолітна конструкція: мотор + плата FOC + енкодер</text>

  <!-- Integrated Shell -->
  <rect x="530" y="155" width="390" height="120" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="725" y="172" font-size="11" font-weight="bold" text-anchor="middle" fill="#2457d6">Єдиний коаксіальний корпус сервоприводу</text>

  <!-- Sub-block 1: FOC Board -->
  <rect x="540" y="182" width="115" height="83" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="597" y="197" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Плата FOC</text>
  <text x="548" y="213" font-size="10" fill="#6b7280">• МК Clarke/Park</text>
  <text x="548" y="227" font-size="10" fill="#6b7280">• MOSFET / GaN</text>
  <text x="548" y="241" font-size="10" fill="#27ae60">• Бездротові фази</text>
  <text x="548" y="255" font-size="10" fill="#6b7280">• Швидкий ШІМ</text>

  <!-- Sub-block 2: Magnetic Encoder -->
  <rect x="667" y="182" width="115" height="83" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="725" y="197" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Магнітний енкодер</text>
  <text x="675" y="213" font-size="10" fill="#6b7280">• Абсолютний (14b)</text>
  <text x="675" y="227" font-size="10" fill="#6b7280">• Магніт на валу</text>
  <text x="675" y="241" font-size="10" fill="#27ae60">• Висока точність</text>
  <text x="675" y="255" font-size="10" fill="#6b7280">• Безконтактний</text>

  <!-- Sub-block 3: BLDC/PMSM Motor -->
  <rect x="795" y="182" width="115" height="83" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="852" y="197" font-size="11" font-weight="bold" text-anchor="middle" fill="#1a1a1a">BLDC / PMSM</text>
  <text x="803" y="213" font-size="10" fill="#6b7280">• Порожнистий вал</text>
  <text x="803" y="227" font-size="10" fill="#6b7280">• Прямий привод</text>
  <text x="803" y="241" font-size="10" fill="#27ae60">• Синусоїдний струм</text>
  <text x="803" y="255" font-size="10" fill="#6b7280">• Плавний момент</text>

  <!-- Right Summary Box -->
  <rect x="530" y="290" width="390" height="170" rx="6" fill="#ffffff" stroke="#27ae60" stroke-dasharray="3,3"/>
  <text x="545" y="310" font-size="12" font-weight="bold" fill="#27ae60">Переваги коаксіального сервомодуля:</text>
  <text x="545" y="332" font-size="11" fill="#1a1a1a">✓ Мінімальна довжина фаз: відсутність EMI завад</text>
  <text x="545" y="354" font-size="11" fill="#1a1a1a">✓ Висока точність позиціонування (14–16 біт енкодер)</text>
  <text x="545" y="376" font-size="11" fill="#1a1a1a">✓ Плавний момент без пульсацій і безшумна робота</text>
  <text x="545" y="398" font-size="11" fill="#1a1a1a">✓ Скорочення маси та об'єму системи на 50–70%</text>
  <text x="545" y="420" font-size="11" fill="#1a1a1a">✓ Просте підключення цифровою шиною (CAN/EtherCAT)</text>
  <text x="545" y="442" font-size="11" fill="#1a1a1a">✓ Високий ККД і надійність суцільної конструкції</text>
</svg>
