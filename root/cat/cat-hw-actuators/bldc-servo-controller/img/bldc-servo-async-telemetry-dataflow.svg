<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Асинхронний потік даних телеметрії сервоконтролера</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">DMA і кільцевий буфер приймають сирі кадри, а подвійна буферизація усуває затримки в головному циклі</text>

  <!-- ==================== ЕТАП 1: АПАРАТНИЙ ПРИЙОМ ==================== -->
  <rect x="21" y="74" width="216" height="384" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="29" y="82" width="200" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="129" y="99" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">1. АПАРАТНИЙ ПРИЙОМ</text>

  <!-- Блок 1.1: Шина зв'язку -->
  <rect x="29" y="118" width="200" height="66" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="129" y="136" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Шина CAN / UART</text>
  <text x="129" y="154" font-size="12" fill="#2457d6" text-anchor="middle">Кадри телеметрії 500–1000 Гц</text>
  <text x="129" y="172" font-size="12" fill="#6b7280" text-anchor="middle">ID, Data[0..7], CRC</text>

  <!-- Стрілка 1.1 -> 1.2 -->
  <line x1="129" y1="184" x2="129" y2="198" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Блок 1.2: Периферія RX FIFO -->
  <rect x="29" y="198" width="200" height="66" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="129" y="216" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Апаратний RX FIFO</text>
  <text x="129" y="234" font-size="12" fill="#6b7280" text-anchor="middle">Приймальний буфер вузла</text>
  <text x="129" y="252" font-size="12" fill="#6b7280" text-anchor="middle">Апаратна фільтрація ID привода</text>

  <!-- Стрілка 1.2 -> 1.3 -->
  <line x1="129" y1="264" x2="129" y2="278" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Блок 1.3: Захоплення DMA / ISR -->
  <rect x="29" y="278" width="200" height="84" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="129" y="296" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Канал DMA / RX ISR</text>
  <text x="129" y="314" font-size="12" fill="#1a1a1a" text-anchor="middle">Захоплення байтів без затримок</text>
  <text x="129" y="332" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">0% витрат часу CPU</text>
  <text x="129" y="350" font-size="12" fill="#6b7280" text-anchor="middle">Прямий запис у RAM драйвера</text>

  <!-- Стрілка 1.3 -> 1.4 -->
  <line x1="129" y1="362" x2="129" y2="374" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Блок 1.4: Апаратна автономність -->
  <rect x="29" y="374" width="200" height="34" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="129" y="395" font-size="12" fill="#1a1a1a" text-anchor="middle">Фоновий неблокуючий трансфер</text>

  <!-- Статус-бейдж 1 -->
  <rect x="29" y="416" width="200" height="34" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="129" y="437" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">✓ Апаратне розвантаження</text>

  <!-- З'єднувач 1 -> 2 -->
  <line x1="237" y1="320" x2="255" y2="320" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- ==================== ЕТАП 2: КІЛЬЦЕВИЙ БУФЕР ==================== -->
  <rect x="255" y="74" width="216" height="384" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="263" y="82" width="200" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="363" y="99" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">2. КІЛЬЦЕВИЙ БУФЕР (FIFO)</text>

  <!-- Блок 2.1: Візуалізація пам'яті -->
  <rect x="263" y="118" width="200" height="152" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="363" y="136" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">rx_ring_buffer[256]</text>

  <!-- Комірки буфера -->
  <rect x="273" y="148" width="28" height="24" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="287" y="164" font-size="12" fill="#2457d6" text-anchor="middle">0xAA</text>

  <rect x="304" y="148" width="28" height="24" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="318" y="164" font-size="12" fill="#2457d6" text-anchor="middle">0x14</text>

  <rect x="335" y="148" width="28" height="24" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="349" y="164" font-size="12" fill="#2457d6" text-anchor="middle">0x82</text>

  <rect x="366" y="148" width="28" height="24" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="380" y="164" font-size="12" fill="#2457d6" text-anchor="middle">0x0F</text>

  <rect x="397" y="148" width="28" height="24" rx="2" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="411" y="164" font-size="12" fill="#6b7280" text-anchor="middle">··</text>

  <rect x="428" y="148" width="28" height="24" rx="2" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="442" y="164" font-size="12" fill="#6b7280" text-anchor="middle">··</text>

  <!-- Вказівники на комірки -->
  <line x1="287" y1="190" x2="287" y2="176" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="287" y="202" font-size="12" fill="#1a1a1a" text-anchor="middle">read_ptr</text>

  <line x1="411" y1="190" x2="411" y2="176" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="411" y="202" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">write_ptr</text>

  <text x="363" y="222" font-size="12" fill="#2457d6" text-anchor="middle">write_ptr рухає DMA / ISR</text>
  <text x="363" y="240" font-size="12" fill="#1a1a1a" text-anchor="middle">read_ptr рухає update()</text>
  <text x="363" y="258" font-size="12" fill="#27ae60" text-anchor="middle">FIFO ємністю 256 байтів</text>

  <!-- Стрілка 2.1 -> 2.2 -->
  <line x1="363" y1="270" x2="363" y2="284" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Блок 2.2: Властивості FIFO -->
  <rect x="263" y="284" width="200" height="78" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="363" y="302" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Темпоральна розв'язка</text>
  <text x="363" y="322" font-size="12" fill="#27ae60" text-anchor="middle">✓ Згладжує сплески шини</text>
  <text x="363" y="340" font-size="12" fill="#27ae60" text-anchor="middle">✓ Захист від втрати пакетів</text>
  <text x="363" y="356" font-size="12" fill="#6b7280" text-anchor="middle">Асинхронний поділ потоків</text>

  <!-- Стрілка 2.2 -> 2.3 -->
  <line x1="363" y1="362" x2="363" y2="374" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Блок 2.3: Поділ середовищ -->
  <rect x="263" y="374" width="200" height="34" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="363" y="395" font-size="12" fill="#1a1a1a" text-anchor="middle">Ізоляція заліза від логіки</text>

  <!-- Статус-бейдж 2 -->
  <rect x="263" y="416" width="200" height="34" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="363" y="437" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">✓ Буферизований потік FIFO</text>

  <!-- З'єднувач 2 -> 3 -->
  <line x1="471" y1="166" x2="489" y2="166" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- ==================== ЕТАП 3: РОЗБІР І SERVOTELEMETRY ==================== -->
  <rect x="489" y="74" width="216" height="384" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="497" y="82" width="200" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="597" y="99" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">3. РОЗБІР І SERVOTELEMETRY</text>

  <!-- Блок 3.1: Парсер update() -->
  <rect x="497" y="118" width="200" height="96" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="597" y="136" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розбір кадру (update)</text>
  <text x="597" y="154" font-size="12" fill="#27ae60" text-anchor="middle">✓ Валідація SOF та CRC</text>
  <text x="597" y="172" font-size="12" fill="#2457d6" text-anchor="middle">Масштабування fixed → SI</text>
  <text x="597" y="190" font-size="12" fill="#1a1a1a" text-anchor="middle">Скидання таймауту watchdog</text>
  <text x="597" y="206" font-size="12" fill="#6b7280" text-anchor="middle">Десеріалізація пакетів</text>

  <!-- Стрілка 3.1 -> 3.2 -->
  <line x1="597" y1="214" x2="597" y2="228" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Блок 3.2: Подвійна буферизація -->
  <rect x="497" y="228" width="200" height="178" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Вкладений тіньовий буфер -->
  <rect x="507" y="238" width="180" height="42" rx="3" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="597" y="254" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">Тіньовий буфер (Shadow)</text>
  <text x="597" y="270" font-size="12" fill="#1a1a1a" text-anchor="middle">Парсер пише свіжі поля</text>

  <!-- Індикатор атомарного обміну -->
  <text x="597" y="298" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Атомарний swap покажчиків</text>

  <!-- Вкладений активний буфер -->
  <rect x="507" y="310" width="180" height="86" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="597" y="328" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Активна ServoTelemetry</text>
  <text x="597" y="346" font-size="12" fill="#1a1a1a" text-anchor="middle">Кут θ (рад), швидкість ω (рад/с)</text>
  <text x="597" y="364" font-size="12" fill="#1a1a1a" text-anchor="middle">Струм I_q (А), напруга U_bus (В)</text>
  <text x="597" y="382" font-size="12" fill="#6b7280" text-anchor="middle">Температура T_inv, fault_flags</text>

  <!-- Статус-бейдж 3 -->
  <rect x="497" y="416" width="200" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="597" y="437" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">hasNewTelemetry = true</text>

  <!-- З'єднувач 3 -> 4 -->
  <line x1="705" y1="353" x2="723" y2="353" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- ==================== ЕТАП 4: ГОЛОВНИЙ ЦИКЛ MCU ==================== -->
  <rect x="723" y="74" width="216" height="384" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="731" y="82" width="200" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="831" y="99" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">4. ГОЛОВНИЙ ЦИКЛ MCU</text>

  <!-- Блок 4.1: Головний цикл -->
  <rect x="731" y="118" width="200" height="86" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="831" y="136" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Основний цикл (Main Loop)</text>
  <text x="831" y="154" font-size="12" fill="#2457d6" text-anchor="middle">driver.update();</text>
  <text x="831" y="172" font-size="12" fill="#1a1a1a" text-anchor="middle">if (driver.hasNewTelemetry())</text>
  <text x="831" y="190" font-size="12" fill="#6b7280" text-anchor="middle">Частота циклу: 100–1000 Гц</text>

  <!-- Стрілка 4.1 -> 4.2 -->
  <line x1="831" y1="204" x2="831" y2="218" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Блок 4.2: Споживання даних -->
  <rect x="731" y="218" width="200" height="106" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="831" y="236" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">getTelemetry() → const&amp;</text>
  <text x="831" y="254" font-size="12" fill="#2457d6" text-anchor="middle">Атомарна вибірка зрізу</text>
  <text x="831" y="272" font-size="12" fill="#1a1a1a" text-anchor="middle">• Контури положення й швидкості</text>
  <text x="831" y="290" font-size="12" fill="#1a1a1a" text-anchor="middle">• Детекція перевантажень і stall</text>
  <text x="831" y="308" font-size="12" fill="#6b7280" text-anchor="middle">• Перевірка аварійних прапорців</text>

  <!-- Стрілка 4.2 -> 4.3 -->
  <line x1="831" y1="324" x2="831" y2="338" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Блок 4.3: Підсумок / Гарантія -->
  <rect x="731" y="338" width="200" height="68" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="831" y="356" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">0 мкс очікування на шині</text>
  <text x="831" y="374" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Детермінізм реального часу</text>
  <text x="831" y="392" font-size="12" fill="#6b7280" text-anchor="middle">Повний захист від Data Race</text>

  <!-- Статус-бейдж 4 -->
  <rect x="731" y="416" width="200" height="34" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="831" y="437" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">✓ Неблокуюче опитування</text>
</svg>
