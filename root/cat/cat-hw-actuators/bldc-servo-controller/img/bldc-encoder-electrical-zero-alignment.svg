<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-acc" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-ok" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-err" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-sec" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Просторове узгодження координат та калібрування нуля енкодера</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Подання струму Id вздовж фази статора фіксує ротор для прив'язки відліку енкодера θ_m до осей d-q</text>

  <!-- ЛІВА ПАНЕЛЬ: Фізичне калібрування -->
  <rect x="24" y="74" width="444" height="426" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="246" y="96" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">1. Подання опорного струму Id на статор</text>
  <text x="246" y="114" font-size="12" fill="#6b7280" text-anchor="middle">Вектор поля фіксує ненавантажений ротор у фазі A (θ_e = 0)</text>

  <!-- Статус ненавантаженого вала -->
  <text x="246" y="136" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Вільний вал: ротор повертається магнітною силою</text>

  <!-- Зовнішнє кільце статора -->
  <circle cx="246" cy="222" r="80" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Повітряний зазор -->
  <circle cx="246" cy="222" r="50" fill="none" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Фазні котушки статора -->
  <!-- Фаза A (0°) -->
  <rect x="306" y="208" width="28" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="320" y="226" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">A</text>
  <text x="342" y="214" font-size="12" font-weight="700" fill="#2457d6">+Id</text>
  <text x="342" y="230" font-size="12" fill="#6b7280">(фаза A)</text>

  <!-- Фаза B (+120°) -->
  <rect x="197" y="147" width="28" height="28" rx="4" fill="#f4f6f8" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="211" y="165" font-size="12" font-weight="700" fill="#6b7280" text-anchor="middle">B</text>
  <text x="187" y="157" font-size="12" font-weight="700" fill="#6b7280" text-anchor="end">-Id/2</text>
  <text x="187" y="173" font-size="12" fill="#6b7280" text-anchor="end">(фаза B)</text>

  <!-- Фаза C (-120°) -->
  <rect x="197" y="269" width="28" height="28" rx="4" fill="#f4f6f8" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="211" y="287" font-size="12" font-weight="700" fill="#6b7280" text-anchor="middle">C</text>
  <text x="187" y="279" font-size="12" font-weight="700" fill="#6b7280" text-anchor="end">-Id/2</text>
  <text x="187" y="295" font-size="12" fill="#6b7280" text-anchor="end">(фаза C)</text>

  <!-- Вісь фази A (лінія від котушки праворуч) -->
  <line x1="392" y1="222" x2="446" y2="222" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-acc)"/>
  <text x="446" y="206" font-size="12" font-weight="700" fill="#2457d6" text-anchor="end">Вісь α (фаза A)</text>
  <text x="446" y="238" font-size="12" fill="#2457d6" text-anchor="end">B_s || +Id</text>

  <!-- Тіло ротора -->
  <circle cx="246" cy="222" r="42" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Постійний магніт ротора (S-N), вирівняний по осі A -->
  <rect x="210" y="212" width="34" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="227" y="227" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">S</text>

  <rect x="248" y="212" width="34" height="20" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="265" y="227" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">N</text>

  <!-- Вал ротора -->
  <circle cx="246" cy="222" r="5" fill="#1a1a1a"/>

  <!-- Підпис магнітного потоку ротора -->
  <text x="246" y="196" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">d || B_s (потік Ψ_m)</text>

  <!-- Підпис рівноваги під мотором -->
  <text x="246" y="316" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Рівновага: B_s паралельне Ψ_m → Момент T = 0, Iq = 0</text>

  <!-- Картка 1 лівої панелі -->
  <rect x="38" y="334" width="416" height="68" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="50" y="352" font-size="12" font-weight="700" fill="#2457d6">Подання опорного струму: Id &gt; 0, Iq = 0</text>
  <text x="50" y="370" font-size="12" fill="#1a1a1a">Контролер вмикає постійний струм: Ia = +Id, Ib = Ic = -Id/2.</text>
  <text x="50" y="386" font-size="12" fill="#1a1a1a">Вектор поля статора B_s фіксується вздовж магнітної осі фази A.</text>

  <!-- Картка 2 лівої панелі -->
  <rect x="38" y="416" width="416" height="68" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="50" y="434" font-size="12" font-weight="700" fill="#27ae60">Фізична фіксація ротора в електричному нулі (θ_e = 0)</text>
  <text x="50" y="452" font-size="12" fill="#1a1a1a">На ненавантаженому валу магніти ротора втягуються у вісь поля B_s.</text>
  <text x="50" y="468" font-size="12" fill="#1a1a1a">Осі d і фази A збігаються — вал зафіксовано в нулі відліку.</text>

  <!-- ПРАВА ПАНЕЛЬ: Узгодження координат -->
  <rect x="492" y="74" width="444" height="426" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="714" y="96" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">2. Зв'язок кута енкодера θ_m, зсуву θ_offset та осей d-q</text>
  <text x="714" y="114" font-size="12" fill="#6b7280" text-anchor="middle">Прив'язка механічного відліку сенсора до електричної системи FOC</text>

  <!-- Осі координат: центр (714, 222) -->
  <!-- Базова вісь фази A статора (електричний нуль θ_e = 0) -->
  <line x1="714" y1="222" x2="840" y2="222" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-sec)"/>
  <text x="846" y="218" font-size="12" font-weight="700" fill="#1a1a1a">Вісь фази A (α)</text>
  <text x="846" y="232" font-size="12" fill="#6b7280">θ_e = 0</text>

  <!-- Базова лінія нуля енкодера (під кутом +30°) -->
  <line x1="714" y1="222" x2="806" y2="275" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="812" y="278" font-size="12" font-weight="700" fill="#6b7280">
    <tspan x="812" dy="0">Нуль енкодера</tspan>
    <tspan x="812" dy="14">(θ_m = 0)</tspan>
  </text>

  <!-- Дуга зміщення нуля θ_offset (від +30° до 0°) -->
  <path d="M 748.6,242.0 A 40 40 0 0 0 754.0,222.0" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="758" y="240" font-size="12" font-weight="700" fill="#c0392b">θ_offset</text>

  <!-- Обертова вісь ротора +d (під кутом -48°) -->
  <line x1="714" y1="222" x2="801" y2="125" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-ok)"/>
  <text x="808" y="122" font-size="13" font-weight="700" fill="#27ae60">+d (потік Ψ_m)</text>

  <!-- Обертова вісь ротора +q (під кутом -138°, 90° до d) -->
  <line x1="714" y1="222" x2="632" y2="148" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-acc)"/>
  <text x="626" y="142" font-size="13" font-weight="700" fill="#2457d6" text-anchor="end">+q (момент Iq)</text>

  <!-- Позначка прямого кута 90° між d і q -->
  <polyline points="724.7,210.1 712.8,199.4 702.1,211.3" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="712" y="190" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">90°</text>

  <!-- Дуга електричного кута θ_e (від 0° до -48°) -->
  <path d="M 784.0,222.0 A 70 70 0 0 0 760.8,170.0" fill="none" stroke="#27ae60" stroke-width="2"/>
  <text x="768" y="186" font-size="12" font-weight="700" fill="#27ae60">θ_e</text>

  <!-- Дуга масштабованого кута енкодера p · θ_m (від +30° до -48°, двома дугами) -->
  <path d="M 816.3,281.0 A 118 118 0 0 0 830.5,203.5 A 118 118 0 0 0 793.0,134.1" fill="none" stroke="#2457d6" stroke-width="2" stroke-dasharray="4,3"/>
  <text x="846" y="166" font-size="12" font-weight="700" fill="#2457d6">p · θ_m</text>
  <text x="846" y="180" font-size="12" fill="#6b7280">(відлік)</text>

  <!-- Центр координат -->
  <circle cx="714" cy="222" r="4" fill="#1a1a1a"/>

  <!-- Основна формула під діаграмою -->
  <text x="714" y="316" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Основне рівняння узгодження: θ_e = p · θ_m - θ_offset</text>

  <!-- Картка 1 правої панелі -->
  <rect x="506" y="334" width="416" height="68" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="518" y="352" font-size="12" font-weight="700" fill="#2457d6">Масштабування кута та фіксація зміщення нуля</text>
  <text x="518" y="370" font-size="12" fill="#1a1a1a">Число пар полюсів p переводить механічний кут в електричний.</text>
  <text x="518" y="386" font-size="12" fill="#1a1a1a">При θ_e = 0 зсув фіксується у Flash: θ_offset = p · θ_align.</text>

  <!-- Картка 2 правої панелі -->
  <rect x="506" y="416" width="416" height="68" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="518" y="434" font-size="12" font-weight="700" fill="#27ae60">Орієнтація поля FOC для максимального моменту</text>
  <text x="518" y="452" font-size="12" fill="#1a1a1a">Контур FOC подає струм строго у вісь q під кутом 90° до осі d.</text>
  <text x="518" y="468" font-size="12" fill="#1a1a1a">Це формує максимальний момент T = kt · Iq без зайвого нагріву.</text>
</svg>
