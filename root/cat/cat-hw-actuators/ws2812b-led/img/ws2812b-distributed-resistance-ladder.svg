<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розподілений опір та градієнт падіння напруги U(x) у стрічці WS2812B</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Омічний опір R_line мідних шин VCC і GND спричиняє параболічне просідання напруги U(x) при однобічному живленні</text>

  <!-- ВЕРХНЯ ПАНЕЛЬ: Еквівалентна схема драбини опорів -->
  <rect x="24" y="68" width="912" height="236" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="40" y="92" font-size="14" font-weight="bold" fill="#1a1a1a">А. Еквівалентна електрична схема драбини опорів (Distributed Resistance Ladder)</text>

  <!-- Блок джерела живлення БЖ 5V -->
  <rect x="40" y="112" width="90" height="170" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="85" y="134" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Джерело</text>
  <text x="85" y="150" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">живлення</text>
  <text x="85" y="172" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">5.0 V DC</text>
  
  <circle cx="120" cy="195" r="4" fill="#c0392b"/>
  <text x="112" y="199" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">+5V</text>
  
  <circle cx="120" cy="255" r="4" fill="#1a1a1a"/>
  <text x="112" y="259" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">GND</text>

  <!-- Дроти від БЖ до стрічки -->
  <line x1="120" y1="195" x2="190" y2="195" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="120" y1="255" x2="190" y2="255" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- ВУЗОЛ 0 (Pixel 1) -->
  <text x="200" y="116" font-size="12" fill="#6b7280" text-anchor="middle">Вузол 0 (Pixel 1)</text>
  <rect x="168" y="122" width="64" height="22" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="200" y="137" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">5.0 V</text>
  <line x1="200" y1="144" x2="200" y2="195" stroke="#27ae60" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="200" cy="195" r="3.5" fill="#c0392b"/>
  <circle cx="200" cy="255" r="3.5" fill="#1a1a1a"/>

  <!-- Вузол 0: Струм I_px0 -->
  <line x1="190" y1="195" x2="190" y2="211" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="190" cy="225" r="14" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="190" y1="217" x2="190" y2="231" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="190" y1="239" x2="190" y2="255" stroke="#2457d6" stroke-width="1.5"/>
  <text x="172" y="229" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">I_px0</text>

  <!-- Вузол 0: Конденсатор C1 -->
  <line x1="210" y1="195" x2="210" y2="221" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="204" y1="221" x2="216" y2="221" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="204" y1="227" x2="216" y2="227" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="210" y1="227" x2="210" y2="255" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="220" y="228" font-size="12" fill="#6b7280">C1</text>

  <!-- СЕГМЕНТ 1 (між Вузлом 0 та 1) -->
  <!-- Опір R_vcc1 -->
  <line x1="200" y1="195" x2="255" y2="195" stroke="#c0392b" stroke-width="2"/>
  <rect x="255" y="186" width="60" height="18" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="285" y="176" font-size="12" fill="#c0392b" text-anchor="middle">R_line</text>
  <line x1="315" y1="195" x2="380" y2="195" stroke="#c0392b" stroke-width="2"/>

  <!-- Опір R_gnd1 -->
  <line x1="200" y1="255" x2="255" y2="255" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="255" y="246" width="60" height="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="285" y="278" font-size="12" fill="#6b7280" text-anchor="middle">R_line</text>
  <line x1="315" y1="255" x2="380" y2="255" stroke="#1a1a1a" stroke-width="2"/>

  <!-- ВУЗОЛ 1 (Pixel 30) -->
  <text x="380" y="116" font-size="12" fill="#6b7280" text-anchor="middle">Вузол 1 (Pixel 30)</text>
  <rect x="348" y="122" width="64" height="22" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="380" y="137" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">4.5 V</text>
  <line x1="380" y1="144" x2="380" y2="195" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="380" cy="195" r="3.5" fill="#c0392b"/>
  <circle cx="380" cy="255" r="3.5" fill="#1a1a1a"/>

  <!-- Вузол 1: Струм I_px30 -->
  <line x1="370" y1="195" x2="370" y2="211" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="370" cy="225" r="14" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="370" y1="217" x2="370" y2="231" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="370" y1="239" x2="370" y2="255" stroke="#2457d6" stroke-width="1.5"/>
  <text x="352" y="229" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">I_px30</text>

  <!-- Вузол 1: Конденсатор C30 -->
  <line x1="390" y1="195" x2="390" y2="221" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="384" y1="221" x2="396" y2="221" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="384" y1="227" x2="396" y2="227" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="390" y1="227" x2="390" y2="255" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="400" y="228" font-size="12" fill="#6b7280">C30</text>

  <!-- СЕГМЕНТ 2 (між Вузлом 1 та 2) -->
  <!-- Опір R_vcc2 -->
  <line x1="380" y1="195" x2="435" y2="195" stroke="#c0392b" stroke-width="2"/>
  <rect x="435" y="186" width="60" height="18" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="465" y="176" font-size="12" fill="#c0392b" text-anchor="middle">R_line</text>
  <line x1="495" y1="195" x2="560" y2="195" stroke="#c0392b" stroke-width="2"/>

  <!-- Опір R_gnd2 -->
  <line x1="380" y1="255" x2="435" y2="255" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="435" y="246" width="60" height="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="465" y="278" font-size="12" fill="#6b7280" text-anchor="middle">R_line</text>
  <line x1="495" y1="255" x2="560" y2="255" stroke="#1a1a1a" stroke-width="2"/>

  <!-- ВУЗОЛ 2 (Pixel 60) -->
  <text x="560" y="116" font-size="12" fill="#6b7280" text-anchor="middle">Вузол 2 (Pixel 60)</text>
  <rect x="528" y="122" width="64" height="22" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="560" y="137" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">4.0 V</text>
  <line x1="560" y1="144" x2="560" y2="195" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="560" cy="195" r="3.5" fill="#c0392b"/>
  <circle cx="560" cy="255" r="3.5" fill="#1a1a1a"/>

  <!-- Вузол 2: Струм I_px60 -->
  <line x1="550" y1="195" x2="550" y2="211" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="550" cy="225" r="14" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="550" y1="217" x2="550" y2="231" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="550" y1="239" x2="550" y2="255" stroke="#2457d6" stroke-width="1.5"/>
  <text x="532" y="229" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">I_px60</text>

  <!-- Вузол 2: Конденсатор C60 -->
  <line x1="570" y1="195" x2="570" y2="221" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="564" y1="221" x2="576" y2="221" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="564" y1="227" x2="576" y2="227" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="570" y1="227" x2="570" y2="255" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="580" y="228" font-size="12" fill="#6b7280">C60</text>

  <!-- СЕГМЕНТ 3 (між Вузлом 2 та N) -->
  <!-- Опір R_vccN -->
  <line x1="560" y1="195" x2="615" y2="195" stroke="#c0392b" stroke-width="2"/>
  <rect x="615" y="186" width="60" height="18" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="645" y="176" font-size="12" fill="#c0392b" text-anchor="middle">R_line</text>
  <line x1="675" y1="195" x2="740" y2="195" stroke="#c0392b" stroke-width="2"/>

  <!-- Опір R_gndN -->
  <line x1="560" y1="255" x2="615" y2="255" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="615" y="246" width="60" height="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="645" y="278" font-size="12" fill="#6b7280" text-anchor="middle">R_line</text>
  <line x1="675" y1="255" x2="740" y2="255" stroke="#1a1a1a" stroke-width="2"/>

  <!-- ВУЗОЛ N (Pixel 100) -->
  <text x="740" y="116" font-size="12" fill="#c0392b" text-anchor="middle">Вузол N (Pixel 100)</text>
  <rect x="708" y="122" width="64" height="22" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="740" y="137" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">3.5 V</text>
  <line x1="740" y1="144" x2="740" y2="195" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="740" cy="195" r="3.5" fill="#c0392b"/>
  <circle cx="740" cy="255" r="3.5" fill="#1a1a1a"/>

  <!-- Вузол N: Струм I_pxN -->
  <line x1="730" y1="195" x2="730" y2="211" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="730" cy="225" r="14" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="730" y1="217" x2="730" y2="231" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="730" y1="239" x2="730" y2="255" stroke="#2457d6" stroke-width="1.5"/>
  <text x="712" y="229" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">I_pxN</text>

  <!-- Вузол N: Конденсатор CN -->
  <line x1="750" y1="195" x2="750" y2="221" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="744" y1="221" x2="756" y2="221" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="744" y1="227" x2="756" y2="227" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="750" y1="227" x2="750" y2="255" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="760" y="228" font-size="12" fill="#6b7280">CN</text>

  <!-- Кінець стрічки / попередження -->
  <line x1="740" y1="195" x2="800" y2="195" stroke="#c0392b" stroke-width="2" stroke-dasharray="4,3"/>
  <line x1="740" y1="255" x2="800" y2="255" stroke="#1a1a1a" stroke-width="2" stroke-dasharray="4,3"/>

  <rect x="805" y="190" width="115" height="70" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="862" y="210" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Критичне</text>
  <text x="862" y="226" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">просідання ΔV!</text>
  <text x="862" y="246" font-size="12" fill="#6b7280" text-anchor="middle">(Red Shift / Збій)</text>

  <!-- НИЖНЯ ПАНЕЛЬ: Графік U(x) та Формули -->
  <rect x="24" y="316" width="912" height="188" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="40" y="338" font-size="14" font-weight="bold" fill="#1a1a1a">Б. Профіль падіння напруги U(x) та необхідність додаткової інжекції живлення</text>

  <!-- ГРАФІК U(x) (Ліворуч) -->
  <!-- Вісь Y -->
  <line x1="100" y1="475" x2="100" y2="360" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <text x="92" y="379" font-size="12" fill="#27ae60" text-anchor="end">5.0 V</text>
  <text x="92" y="404" font-size="12" fill="#6b7280" text-anchor="end">4.5 V</text>
  <text x="92" y="429" font-size="12" fill="#6b7280" text-anchor="end">4.0 V</text>
  <text x="92" y="454" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">3.5 V</text>
  <text x="92" y="358" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">U(x)</text>

  <!-- Вісь X -->
  <line x1="100" y1="475" x2="470" y2="475" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <line x1="100" y1="475" x2="100" y2="480" stroke="#6b7280" stroke-width="1.5"/>
  <text x="100" y="494" font-size="12" fill="#6b7280" text-anchor="middle">0 m</text>
  
  <line x1="190" y1="475" x2="190" y2="480" stroke="#6b7280" stroke-width="1.5"/>
  <text x="190" y="494" font-size="12" fill="#6b7280" text-anchor="middle">1 m</text>
  
  <line x1="280" y1="475" x2="280" y2="480" stroke="#6b7280" stroke-width="1.5"/>
  <text x="280" y="494" font-size="12" fill="#6b7280" text-anchor="middle">2 m</text>
  
  <line x1="370" y1="475" x2="370" y2="480" stroke="#6b7280" stroke-width="1.5"/>
  <text x="370" y="494" font-size="12" fill="#6b7280" text-anchor="middle">3 m</text>
  
  <line x1="450" y1="475" x2="450" y2="480" stroke="#6b7280" stroke-width="1.5"/>
  <text x="450" y="494" font-size="12" fill="#6b7280" text-anchor="middle">4 m</text>
  <text x="475" y="494" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">x</text>

  <!-- Критична лінія порогової напруги U_min = 3.7 V -->
  <line x1="100" y1="444" x2="460" y2="444" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="108" y="438" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">U_min = 3.7 V (Поріг збоїв)</text>

  <!-- Зафарбована зона критичного просідання -->
  <path d="M 330 444 Q 380 455, 450 470 L 450 444 Z" fill="#fdecea" opacity="0.7"/>

  <!-- Крива падіння напруги U(x) -->
  <path d="M 100 375 Q 270 410, 450 470" stroke="#2457d6" stroke-width="2.5" fill="none"/>

  <!-- Точки на кривій -->
  <circle cx="100" cy="375" r="4" fill="#27ae60"/>
  <circle cx="190" cy="400" r="4" fill="#2457d6"/>
  <circle cx="280" cy="425" r="4" fill="#c0392b"/>
  <circle cx="370" cy="450" r="4" fill="#c0392b"/>

  <!-- БЛОК ФОРМУЛ ТА ІНЖЕНЕРНИХ РІШЕНЬ (Праворуч) -->
  <rect x="510" y="352" width="410" height="64" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="522" y="370" font-size="12" font-weight="bold" fill="#1a1a1a">Формула падіння напруги вздовж стрічки:</text>
  <text x="522" y="388" font-size="12" font-weight="bold" fill="#2457d6">ΔU(x) = I_pixel · R_line · x · (x + 1) / 2</text>
  <text x="522" y="404" font-size="12" fill="#6b7280">При однорідному споживанні ΔU(x) зростає квадратично (~ x²)</text>

  <rect x="510" y="424" width="410" height="68" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="522" y="443" font-size="12" font-weight="bold" fill="#27ae60">Інженерне рішення: Додаткова інжекція живлення</text>
  <text x="522" y="461" font-size="12" fill="#1a1a1a">• Підключати +5V та GND кожні 2–3 м (або 50–60 світлодіодів)</text>
  <text x="522" y="478" font-size="12" fill="#1a1a1a">• Конденсатори C = 100 nF на кожен піксель згладжують ШІМ-кидки</text>
</svg>
