<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Каскадна передача даних та засувка (RESET) у WS2812B</text>
  <text x="480" y="57" font-size="13" fill="#6b7280" text-anchor="middle">Кожен LED захоплює перші 24 біти, ретранслює решту на DOUT, а пауза RESET оновлює всі виходи</text>

  <!-- Section 1: Cascade Shift Diagram -->
  <rect x="20" y="72" width="920" height="210" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="35" y="93" font-size="14" font-weight="bold" fill="#1a1a1a">1. Апаратно-каскадне розподілення потоку кадрів між LED</text>

  <!-- Controller Block -->
  <rect x="40" y="105" width="110" height="165" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="95" y="125" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Контролер</text>
  <text x="95" y="147" font-size="11" fill="#1a1a1a" text-anchor="middle">Формує потік:</text>
  <text x="95" y="169" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">D1 + D2 + D3</text>
  <text x="95" y="189" font-size="11" fill="#6b7280" text-anchor="middle">(3 × 24 біти)</text>
  <text x="95" y="219" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">+ t_RESET</text>
  <text x="95" y="239" font-size="11" fill="#27ae60" text-anchor="middle">(пауза &gt;50 мкс)</text>
  <text x="95" y="257" font-size="11" fill="#6b7280" text-anchor="middle">сигнал Latch</text>

  <!-- Arrow Controller -> LED 1 -->
  <line x1="150" y1="165" x2="190" y2="165" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="170" y="154" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">DIN</text>

  <!-- LED 1 Chip -->
  <rect x="190" y="105" width="220" height="165" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="300" y="124" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">LED 1 (Перший у ланцюжку)</text>

  <rect x="200" y="133" width="200" height="42" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="300" y="150" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Зсувний регістр (24 біти)</text>
  <text x="300" y="167" font-size="11" fill="#1a1a1a" text-anchor="middle">Захоплено: Кадр D1 (GRB)</text>

  <rect x="200" y="182" width="200" height="80" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="300" y="200" font-size="11" fill="#1a1a1a" text-anchor="middle">1. Захоплює перші 24 біти</text>
  <text x="300" y="219" font-size="11" fill="#2457d6" text-anchor="middle">2. Блокує DOUT1 під час D1</text>
  <text x="300" y="238" font-size="11" fill="#1a1a1a" text-anchor="middle">3. Ретранслює D2, D3 далі</text>
  <text x="300" y="255" font-size="11" fill="#6b7280" text-anchor="middle">4. Очікує паузу RESET</text>

  <!-- Arrow LED 1 -> LED 2 -->
  <line x1="410" y1="165" x2="450" y2="165" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="430" y="154" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">DOUT1</text>

  <!-- LED 2 Chip -->
  <rect x="450" y="105" width="220" height="165" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="560" y="124" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">LED 2 (Другий у ланцюжку)</text>

  <rect x="460" y="133" width="200" height="42" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="560" y="150" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Зсувний регістр (24 біти)</text>
  <text x="560" y="167" font-size="11" fill="#1a1a1a" text-anchor="middle">Захоплено: Кадр D2 (GRB)</text>

  <rect x="460" y="182" width="200" height="80" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="560" y="200" font-size="11" fill="#1a1a1a" text-anchor="middle">1. Пропускає 24 біти (D1)</text>
  <text x="560" y="219" font-size="11" fill="#2457d6" text-anchor="middle">2. Захоплює 2-гі 24 біти (D2)</text>
  <text x="560" y="238" font-size="11" fill="#1a1a1a" text-anchor="middle">3. Ретранслює D3 далі</text>
  <text x="560" y="255" font-size="11" fill="#6b7280" text-anchor="middle">4. Очікує паузу RESET</text>

  <!-- Arrow LED 2 -> LED 3 -->
  <line x1="670" y1="165" x2="710" y2="165" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="690" y="154" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">DOUT2</text>

  <!-- LED 3 Chip -->
  <rect x="710" y="105" width="220" height="165" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="820" y="124" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">LED 3 (Третій у ланцюжку)</text>

  <rect x="720" y="133" width="200" height="42" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="820" y="150" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Зсувний регістр (24 біти)</text>
  <text x="820" y="167" font-size="11" fill="#1a1a1a" text-anchor="middle">Захоплено: Кадр D3 (GRB)</text>

  <rect x="720" y="182" width="200" height="80" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="820" y="200" font-size="11" fill="#1a1a1a" text-anchor="middle">1. Пропускає 48 біт (D1+D2)</text>
  <text x="820" y="219" font-size="11" fill="#2457d6" text-anchor="middle">2. Захоплює 3-ті 24 біти (D3)</text>
  <text x="820" y="238" font-size="11" fill="#1a1a1a" text-anchor="middle">3. Збережено кадр D3</text>
  <text x="820" y="255" font-size="11" fill="#6b7280" text-anchor="middle">4. Очікує паузу RESET</text>

  <!-- Section 2: Timing Sequence Diagram -->
  <rect x="20" y="297" width="920" height="200" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="35" y="318" font-size="14" font-weight="bold" fill="#1a1a1a">2. Часова діаграма сигналів та синхронне оновлення (RESET)</text>

  <!-- Column Headers -->
  <text x="277" y="338" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Кадр D1 (24 біти)</text>
  <text x="462" y="338" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Кадр D2 (24 біти)</text>
  <text x="647" y="338" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Кадр D3 (24 біти)</text>
  <text x="835" y="338" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">RESET (&gt;50 мкс)</text>

  <!-- Row Labels -->
  <text x="35" y="366" font-size="12" font-weight="bold" fill="#1a1a1a">DIN (вхід LED1):</text>
  <text x="35" y="400" font-size="12" font-weight="bold" fill="#1a1a1a">DOUT1 (вхід LED2):</text>
  <text x="35" y="434" font-size="12" font-weight="bold" fill="#1a1a1a">DOUT2 (вхід LED3):</text>

  <!-- Row 1: DIN -->
  <rect x="190" y="350" width="175" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="277" y="366" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Дані D1 (для LED 1)</text>

  <rect x="375" y="350" width="175" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="462" y="366" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Дані D2 (для LED 2)</text>

  <rect x="560" y="350" width="175" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="647" y="366" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Дані D3 (для LED 3)</text>

  <rect x="745" y="350" width="180" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="835" y="366" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Пауза LOW (RESET)</text>

  <!-- Row 2: DOUT1 -->
  <rect x="190" y="384" width="175" height="24" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-dasharray="3,3" stroke-width="1.5"/>
  <text x="277" y="400" font-size="11" fill="#6b7280" text-anchor="middle">Блоковано (LOW)</text>

  <rect x="375" y="384" width="175" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="462" y="400" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Дані D2 (для LED 2)</text>

  <rect x="560" y="384" width="175" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="647" y="400" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Дані D3 (для LED 3)</text>

  <rect x="745" y="384" width="180" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="835" y="400" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Пауза LOW (RESET)</text>

  <!-- Row 3: DOUT2 -->
  <rect x="190" y="418" width="360" height="24" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-dasharray="3,3" stroke-width="1.5"/>
  <text x="370" y="434" font-size="11" fill="#6b7280" text-anchor="middle">Блоковано (LOW на 48 бітів)</text>

  <rect x="560" y="418" width="175" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="647" y="434" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Дані D3 (для LED 3)</text>

  <rect x="745" y="418" width="180" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="835" y="434" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Пауза LOW (RESET)</text>

  <!-- Latch Banner -->
  <rect x="190" y="452" width="735" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="557" y="469" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Фіксація (Latch): Під час RESET дані зі зсувних регістрів одночасно переносяться в PWM-регістри всіх LED</text>
</svg>
