<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Figure Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ВПЛИВ ДЕМПФУВАЛЬНОГО РЕЗИСТОРА НА ФРОНТИ СИГНАЛУ DIN WS2812B</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Резистор 330 Ом усуває хвильовий дзвін і викиди напруги, захищаючи вхід першого світлодіода</text>

  <!-- LEFT PANEL: Problem (Without resistor) -->
  <g id="left-panel">
    <rect x="30" y="75" width="435" height="385" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

    <!-- Badge -->
    <rect x="45" y="90" width="405" height="32" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
    <text x="247" y="111" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">БЕЗ РЕЗИСТОРА: ДЗВІН ТА СИЛЬНІ ВІДБИТТЯ</text>

    <!-- Schematic Box -->
    <rect x="45" y="130" width="405" height="60" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    
    <!-- ESP32 block -->
    <rect x="55" y="140" width="70" height="40" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="90" y="164" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ESP32</text>
    
    <!-- WS2812B block -->
    <rect x="370" y="140" width="70" height="40" rx="4" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="405" y="164" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">WS2812B</text>

    <!-- Wire -->
    <line x1="125" y1="160" x2="368" y2="160" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
    <text x="247" y="148" font-size="12" fill="#c0392b" text-anchor="middle">Лінія DIN (пряме з'єднання)</text>
    <text x="247" y="178" font-size="12" fill="#6b7280" text-anchor="middle">Z_out &lt;&lt; Z_line (неузгодженість)</text>

    <!-- Scope Screen -->
    <rect x="45" y="200" width="405" height="215" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

    <!-- Grid lines -->
    <line x1="120" y1="230" x2="435" y2="230" stroke="#c0392b" stroke-dasharray="4,4" stroke-width="1"/>
    <text x="52" y="234" font-size="11" fill="#c0392b" text-anchor="start">5.0V (VDD)</text>

    <line x1="120" y1="270" x2="435" y2="270" stroke="#6b7280" stroke-dasharray="4,4" stroke-width="1"/>
    <text x="52" y="274" font-size="11" fill="#6b7280" text-anchor="start">3.3V (MCU)</text>

    <line x1="120" y1="360" x2="435" y2="360" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="52" y="364" font-size="11" fill="#1a1a1a" text-anchor="start">0.0V (GND)</text>

    <line x1="120" y1="390" x2="435" y2="390" stroke="#c0392b" stroke-dasharray="4,4" stroke-width="1"/>
    <text x="52" y="394" font-size="11" fill="#c0392b" text-anchor="start">-0.5V</text>

    <!-- Ringing Waveform (Red) -->
    <path d="M 120 360 L 140 360 L 146 215 L 154 300 L 162 245 L 170 285 L 178 260 L 186 270 L 255 270 L 260 395 L 268 340 L 276 375 L 284 355 L 292 362 L 300 360 L 435 360" stroke="#c0392b" stroke-width="2.5" fill="none" stroke-linejoin="round"/>

    <!-- Callouts -->
    <circle cx="146" cy="215" r="4" fill="none" stroke="#c0392b" stroke-width="1.5"/>
    <text x="156" y="218" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">Викид &gt; 5 В (Овершут)</text>

    <line x1="220" y1="245" x2="172" y2="252" stroke="#c0392b" stroke-width="1" marker-end="url(#arr-red)"/>
    <text x="225" y="247" font-size="12" fill="#c0392b" text-anchor="start">Високочастотний дзвін</text>

    <circle cx="260" cy="395" r="4" fill="none" stroke="#c0392b" stroke-width="1.5"/>
    <text x="270" y="407" font-size="12" fill="#c0392b" text-anchor="start">Від'ємний спад (&lt; 0 В)</text>

    <!-- Bottom Warning Banner -->
    <rect x="45" y="423" width="405" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
    <text x="247" y="440" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">⚠️ Помилкові спрацьовування та ризик пробою ESD</text>
  </g>

  <!-- RIGHT PANEL: Solution (With 330 Ohm resistor) -->
  <g id="right-panel">
    <rect x="495" y="75" width="435" height="385" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

    <!-- Badge -->
    <rect x="510" y="90" width="405" height="32" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
    <text x="712" y="111" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">З РЕЗИСТОРОМ 330 ОМ: ЧИСТИЙ ТА ГЛАДКИЙ ФРОНТ</text>

    <!-- Schematic Box -->
    <rect x="510" y="130" width="405" height="60" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

    <!-- ESP32 block -->
    <rect x="520" y="140" width="70" height="40" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="555" y="164" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ESP32</text>

    <!-- Resistor box -->
    <rect x="680" y="150" width="65" height="20" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
    <text x="712" y="164" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">330 Ом</text>

    <!-- Wires -->
    <line x1="590" y1="160" x2="680" y2="160" stroke="#27ae60" stroke-width="2"/>
    <line x1="745" y1="160" x2="833" y2="160" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

    <!-- WS2812B block -->
    <rect x="835" y="140" width="70" height="40" rx="4" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="870" y="164" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">WS2812B</text>

    <!-- Labels Above and Below Schematic -->
    <text x="712" y="144" font-size="12" fill="#27ae60" text-anchor="middle">R_d = 330 Ом (демпфер)</text>
    <text x="712" y="182" font-size="12" fill="#6b7280" text-anchor="middle">Z_out + R_d ≈ Z_line (узгодження)</text>

    <!-- Scope Screen -->
    <rect x="510" y="200" width="405" height="215" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

    <!-- Grid lines -->
    <line x1="585" y1="230" x2="900" y2="230" stroke="#d0d7de" stroke-dasharray="4,4" stroke-width="1"/>
    <text x="517" y="234" font-size="11" fill="#6b7280" text-anchor="start">5.0V (VDD)</text>

    <line x1="585" y1="270" x2="900" y2="270" stroke="#6b7280" stroke-dasharray="4,4" stroke-width="1"/>
    <text x="517" y="274" font-size="11" fill="#6b7280" text-anchor="start">3.3V (MCU)</text>

    <line x1="585" y1="360" x2="900" y2="360" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="517" y="364" font-size="11" fill="#1a1a1a" text-anchor="start">0.0V (GND)</text>

    <!-- Smooth Waveform (Green) -->
    <path d="M 585 360 L 610 360 C 625 360, 635 270, 650 270 L 740 270 C 755 270, 765 360, 780 360 L 900 360" stroke="#27ae60" stroke-width="2.5" fill="none" stroke-linejoin="round"/>

    <!-- Callouts -->
    <line x1="620" y1="222" x2="628" y2="280" stroke="#27ae60" stroke-width="1" marker-end="url(#arr-green)"/>
    <text x="590" y="218" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">Гладкий фронт без викидів</text>

    <line x1="750" y1="256" x2="760" y2="295" stroke="#27ae60" stroke-width="1" marker-end="url(#arr-green)"/>
    <text x="660" y="252" font-size="12" fill="#27ae60" text-anchor="start">Поглинання відбитої хвилі</text>

    <text x="895" y="385" font-size="12" fill="#27ae60" text-anchor="end">Стабільний нуль без зворотного дзвону</text>

    <!-- Bottom Success Banner -->
    <rect x="510" y="423" width="405" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
    <text x="712" y="440" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">✓ Надійна передача даних без збоїв та глітчів</text>
  </g>
</svg>
