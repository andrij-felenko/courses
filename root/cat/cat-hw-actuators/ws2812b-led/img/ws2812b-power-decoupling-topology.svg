<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Canvas Header -->
  <text x="480" y="24" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Топологія живлення та фільтрації стрічки WS2812B</text>
  <text x="480" y="42" font-size="13" fill="#6b7280" text-anchor="middle">Вхідний фільтр C1+C2 та зіркоподібне заземлення запобігають збоям і шумам</text>

  <!-- Main VCC Bus line (+5V) -->
  <path d="M 205,135 L 205,62 L 938,62" fill="none" stroke="#c0392b" stroke-width="3.5"/>
  <text x="220" y="55" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">Шина +5V (VCC)</text>

  <!-- VCC Branch Drops in clear corridors -->
  <!-- Drop to 74AHCT125 VCC (corridor x=490) -->
  <path d="M 490,62 L 490,115 L 430,115" fill="none" stroke="#c0392b" stroke-width="2"/>
  <!-- Drop to Filter C1 + C2 (corridor x=558) -->
  <path d="M 558,62 L 558,150 L 675,150" fill="none" stroke="#c0392b" stroke-width="2"/>
  <!-- Drop to Pixel 1 VCC (corridor x=880) -->
  <path d="M 880,62 L 880,145" fill="none" stroke="#c0392b" stroke-width="2"/>
  <!-- Drop to Pixel 2 VCC (corridor x=938) -->
  <path d="M 938,62 L 938,360 L 910,360" fill="none" stroke="#c0392b" stroke-width="2"/>

  <!-- ==================== PANEL 1A: POWER SUPPLY BLOCK ==================== -->
  <rect x="25" y="75" width="180" height="155" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="8"/>
  <text x="115" y="97" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Блок живлення</text>
  <text x="115" y="115" font-size="12" fill="#6b7280" text-anchor="middle">5V DC / 5A+</text>

  <!-- PSU Internal Symbol -->
  <rect x="40" y="130" width="90" height="85" fill="white" stroke="#d0d7de" stroke-width="1.5" rx="4"/>
  <text x="85" y="155" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">AC/DC</text>
  <text x="85" y="175" font-size="12" fill="#6b7280" text-anchor="middle">5V 5A</text>
  <text x="85" y="195" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">25W</text>

  <!-- Terminals -->
  <circle cx="205" cy="135" r="5" fill="#c0392b"/>
  <text x="195" y="139" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">+5V</text>

  <circle cx="205" cy="195" r="5" fill="#1a1a1a"/>
  <text x="195" y="199" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">GND</text>

  <!-- ==================== PANEL 1B: ASSEMBLY RULES ==================== -->
  <rect x="25" y="245" width="180" height="295" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="8"/>
  <text x="115" y="270" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Правила монтажу</text>

  <text x="35" y="295" font-size="12" font-weight="bold" fill="#1a1a1a">1. Буфер рівнів:</text>
  <text x="45" y="313" font-size="12" fill="#6b7280">3.3В ➔ 5.0В (74HCT)</text>

  <text x="35" y="345" font-size="12" font-weight="bold" fill="#1a1a1a">2. Резистор R_damp:</text>
  <text x="45" y="363" font-size="12" fill="#6b7280">330–470 Ом на DIN</text>

  <text x="35" y="395" font-size="12" font-weight="bold" fill="#1a1a1a">3. Фільтр C1 + C2:</text>
  <text x="45" y="413" font-size="12" fill="#6b7280">біля входу стрічки</text>

  <text x="35" y="445" font-size="12" font-weight="bold" fill="#27ae60">4. Точка Star GND:</text>
  <text x="45" y="463" font-size="12" fill="#6b7280">в одній точці схем</text>
  <text x="45" y="481" font-size="12" fill="#6b7280">без спільних петель</text>
  <text x="45" y="499" font-size="12" fill="#6b7280">точки заземлення</text>

  <!-- ==================== PANEL 2A: CONTROLLER & LEVEL SHIFTER ==================== -->
  <rect x="225" y="75" width="300" height="240" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="8"/>
  <text x="375" y="97" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Контролер і узгоджувач рівнів</text>

  <!-- MCU Box -->
  <rect x="240" y="115" width="110" height="110" fill="white" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="295" y="138" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мікроконтролер</text>
  <text x="295" y="158" font-size="12" fill="#6b7280" text-anchor="middle">ESP32 / STM32</text>
  <text x="295" y="180" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">3.3V Logic</text>

  <circle cx="350" cy="160" r="4" fill="#2457d6"/>
  <circle cx="295" cy="225" r="4" fill="#2457d6"/>

  <!-- Level Shifter Box (74AHCT125) -->
  <rect x="380" y="115" width="100" height="110" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="430" y="138" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">74AHCT125</text>
  <text x="430" y="158" font-size="12" fill="#2457d6" text-anchor="middle">Буфер рівнів</text>
  <text x="430" y="180" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">3.3V ➔ 5.0V</text>

  <circle cx="380" cy="160" r="4" fill="#2457d6"/>
  <circle cx="480" cy="160" r="4" fill="#27ae60"/>
  <circle cx="430" cy="115" r="4" fill="#c0392b"/>

  <!-- 3.3V Logic Signal Wire (MCU to Level Shifter) -->
  <path d="M 350,160 L 380,160" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Damping Resistor (R_damp) on 5.0V Data Line -->
  <path d="M 480,160 L 490,160" fill="none" stroke="#27ae60" stroke-width="2"/>
  <rect x="490" y="145" width="30" height="30" fill="white" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="505" y="164" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">R_damp</text>
  <text x="505" y="138" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">330–470 Ом</text>
  <text x="505" y="195" font-size="12" fill="#6b7280" text-anchor="middle">Антидзвін</text>

  <!-- 5V Data Wire from R_damp to Pixel 1 DIN -->
  <path d="M 520,160 L 735,160" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- MCU Signal GND Wire to Star GND -->
  <path d="M 295,225 L 295,435" fill="none" stroke="#2457d6" stroke-width="2.5" stroke-dasharray="6 3"/>
  <text x="303" y="265" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">GND MCU (сигнал)</text>

  <!-- ==================== PANEL 2B: STAR GND NODE & PANEL ==================== -->
  <rect x="225" y="330" width="300" height="210" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="8"/>
  <text x="375" y="352" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Зірковий вузол заземлення (Star GND)</text>

  <!-- PSU GND Wire to Star Node -->
  <path d="M 205,195 L 215,195 L 215,435 L 375,435" fill="none" stroke="#1a1a1a" stroke-width="3.5"/>
  <text x="295" y="422" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GND БЖ</text>

  <!-- Strip GND Wire to Star Node -->
  <path d="M 930,490 L 930,435 L 375,435" fill="none" stroke="#1a1a1a" stroke-width="3.5"/>
  <text x="465" y="422" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GND стрічки</text>

  <!-- Star GND Node Graphic -->
  <circle cx="375" cy="435" r="14" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3 2"/>
  <circle cx="375" cy="435" r="7" fill="#27ae60" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Star GND Explanatory Notes -->
  <text x="375" y="475" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Єдина точка з'єднання заземлень</text>
  <text x="375" y="495" font-size="12" fill="#6b7280" text-anchor="middle">Усуває падіння напруги та сигнальні глітчі</text>
  <text x="375" y="513" font-size="12" fill="#6b7280" text-anchor="middle">Запобігає утворенню замкнених петель</text>

  <!-- ==================== PANEL 3: WS2812B LED STRIP & FILTER ==================== -->
  <rect x="545" y="75" width="390" height="465" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2" rx="8"/>
  <text x="740" y="97" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Світлодіодна стрічка WS2812B</text>

  <!-- Sub-panel: Decoupling Filter Stage -->
  <rect x="555" y="110" width="160" height="415" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="5 3" rx="6"/>
  <text x="635" y="130" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Вхідний фільтр</text>

  <!-- Filter GND Wire (outer edge at x=558) -->
  <path d="M 590,162 L 558,162 L 558,435 L 375,435" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Capacitor C1 (Electrolytic 470–1000 µF) -->
  <line x1="578" y1="150" x2="602" y2="150" stroke="#27ae60" stroke-width="3"/>
  <text x="606" y="148" font-size="12" font-weight="bold" fill="#27ae60">+</text>
  <line x1="578" y1="162" x2="602" y2="162" stroke="#1a1a1a" stroke-width="3"/>

  <!-- C1 Labels -->
  <text x="590" y="185" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">C1: Електроліт</text>
  <text x="590" y="202" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">470–1000 µF</text>
  <text x="590" y="218" font-size="11" fill="#6b7280" text-anchor="middle">Буфер струму</text>

  <!-- Capacitor C2 (Ceramic 0.1 µF) -->
  <line x1="663" y1="150" x2="687" y2="150" stroke="#27ae60" stroke-width="3"/>
  <line x1="663" y1="162" x2="687" y2="162" stroke="#1a1a1a" stroke-width="3"/>
  <path d="M 675,162 L 558,162" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- C2 Labels -->
  <text x="675" y="185" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">C2: Кераміка</text>
  <text x="675" y="202" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">0.1 µF</text>
  <text x="675" y="218" font-size="11" fill="#6b7280" text-anchor="middle">ВЧ фільтр</text>

  <!-- Filter Placement Guidance Card -->
  <rect x="565" y="245" width="140" height="265" fill="white" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="635" y="268" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Монтаж ємностей:</text>
  <text x="635" y="290" font-size="12" fill="#1a1a1a" text-anchor="middle">Впритул до входу</text>
  <text x="635" y="310" font-size="12" fill="#1a1a1a" text-anchor="middle">першого пікселя</text>
  <text x="635" y="330" font-size="12" fill="#1a1a1a" text-anchor="middle">стрічки WS2812B</text>
  <text x="635" y="360" font-size="12" fill="#6b7280" text-anchor="middle">Мінімальна довжина</text>
  <text x="635" y="380" font-size="12" fill="#6b7280" text-anchor="middle">провідників живлення</text>
  <text x="635" y="410" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Захист від піків</text>
  <text x="635" y="430" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">і просідань VCC</text>
  <text x="635" y="460" font-size="11" fill="#6b7280" text-anchor="middle">Згладжує кидки</text>
  <text x="635" y="478" font-size="11" fill="#6b7280" text-anchor="middle">струму споживання</text>

  <!-- ==================== PIXEL 1 (WS2812B #1) ==================== -->
  <rect x="730" y="110" width="190" height="175" fill="white" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="825" y="132" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">WS2812B №1 (Піксель 1)</text>
  <rect x="740" y="145" width="170" height="130" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="4"/>

  <!-- Local Decoupling Cap inside Pixel 1 -->
  <rect x="750" y="180" width="36" height="42" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="3"/>
  <text x="768" y="197" font-size="11" fill="#6b7280" text-anchor="middle">C_loc</text>
  <text x="768" y="213" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">0.1µF</text>

  <!-- RGB LED Chip Pixel 1 -->
  <circle cx="845" cy="200" r="22" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="845" y="205" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">RGB LED</text>

  <!-- Pins & Terminals -->
  <circle cx="735" cy="160" r="4" fill="#2457d6"/>
  <text x="745" y="158" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">DIN</text>

  <circle cx="910" cy="240" r="4" fill="#2457d6"/>
  <text x="902" y="236" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">DOUT</text>

  <circle cx="880" cy="145" r="4" fill="#c0392b"/>
  <text x="872" y="142" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="end">+5V</text>

  <circle cx="880" cy="275" r="4" fill="#1a1a1a"/>
  <path d="M 880,275 L 930,275" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Data Cascade Line: Pixel 1 DOUT -> Pixel 2 DIN -->
  <path d="M 910,240 L 920,240 L 920,305 L 725,305 L 725,375 L 735,375" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="822.5" y="296" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Каскад даних (DOUT ➔ DIN)</text>

  <!-- ==================== PIXEL 2 (WS2812B #2) ==================== -->
  <rect x="730" y="325" width="190" height="175" fill="white" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="825" y="347" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">WS2812B №2 (Піксель 2)</text>
  <rect x="740" y="360" width="170" height="130" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="4"/>

  <!-- Local Decoupling Cap inside Pixel 2 -->
  <rect x="750" y="395" width="36" height="42" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="3"/>
  <text x="768" y="412" font-size="11" fill="#6b7280" text-anchor="middle">C_loc</text>
  <text x="768" y="428" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">0.1µF</text>

  <!-- RGB LED Chip Pixel 2 -->
  <circle cx="845" cy="415" r="22" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="845" y="420" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">RGB LED</text>

  <!-- Pins & Terminals -->
  <circle cx="735" cy="375" r="4" fill="#2457d6"/>
  <text x="745" y="373" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">DIN</text>

  <circle cx="910" cy="360" r="4" fill="#c0392b"/>

  <circle cx="880" cy="490" r="4" fill="#1a1a1a"/>
  <path d="M 880,490 L 930,490" fill="none" stroke="#1a1a1a" stroke-width="2"/>
</svg>
