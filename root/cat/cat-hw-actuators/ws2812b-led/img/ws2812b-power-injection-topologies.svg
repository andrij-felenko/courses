  <line x1="65" y1="410" x2="300" y2="410" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="182" y="432" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Відстань x (м)</text>

