  <rect x="30" y="452" width="276" height="76" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="168" y="473" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">⚠️ Просідання U(x) &gt; 2.0 V</text>
  <text x="168" y="493" text-anchor="middle" font-size="12" fill="#1a1a1a">• Зміщення кольору (червоніння)</text>
  <text x="168" y="511" text-anchor="middle" font-size="12" fill="#1a1a1a">• Стрічка &gt; 2-3 м збоїть і висне</text>

