  <line x1="377" y1="312.5" x2="612" y2="312.5" stroke="#e5e7eb" stroke-width="1"/>
  <text x="370" y="316.5" text-anchor="end" font-size="12" fill="#6b7280">4.5V</text>

  <line x1="377" y1="377.5" x2="612" y2="377.5" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
