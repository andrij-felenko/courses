<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrowhead markers -->
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Canvas background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Топології інжекції живлення 5V для масивів WS2812B</text>
  <text x="480" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Порівняння розподілу напруги U(x) та ефективності зниження падіння напруги</text>

  <!-- ==================== PANEL 1: SINGLE-SIDED INJECTION ==================== -->
  <rect x="20" y="70" width="296" height="470" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Panel 1 Header -->
  <text x="168" y="94" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">1. Однобічна інжекція</text>
  <text x="168" y="112" text-anchor="middle" font-size="12" font-weight="600" fill="#c0392b">Живлення тільки з початку</text>

  <!-- Panel 1 Schematic -->
  <!-- PSU Box -->
  <rect x="35" y="154" width="55" height="44" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="62.5" y="173" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">БЖ 5V</text>
  <text x="62.5" y="188" text-anchor="middle" font-size="11" fill="#6b7280">(PSU)</text>

  <!-- Strip Body & Title -->
  <text x="210" y="148" text-anchor="middle" font-size="12" fill="#6b7280">Світлодіодна стрічка</text>
  <rect x="120" y="160" width="180" height="36" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- LED Modules -->
  <rect x="130" y="166" width="24" height="24" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="142" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">D1</text>

  <rect x="175" y="166" width="24" height="24" rx="3" fill="#fff9e6" stroke="#f39c12" stroke-width="1.5"/>
  <text x="187" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#f39c12">D2</text>

  <rect x="220" y="166" width="24" height="24" rx="3" fill="#fdecea" stroke="#e74c3c" stroke-width="1.5"/>
  <text x="232" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#e74c3c">D3</text>

  <rect x="265" y="166" width="24" height="24" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="277" y="182" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">DN</text>

  <!-- Wires -->
  <path d="M 90 164 L 120 164" stroke="#c0392b" stroke-width="2.5" fill="none"/>
  <text x="105" y="156" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">+5V</text>

  <path d="M 90 188 L 120 188" stroke="#4b5563" stroke-width="2.5" fill="none"/>
  <text x="105" y="203" text-anchor="middle" font-size="11" font-weight="bold" fill="#4b5563">GND</text>

  <!-- Distance axis markers under strip -->
  <line x1="120" y1="224" x2="300" y2="224" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="120" y1="220" x2="120" y2="228" stroke="#9ca3af" stroke-width="1"/>
  <line x1="210" y1="220" x2="210" y2="228" stroke="#9ca3af" stroke-width="1"/>
  <line x1="300" y1="220" x2="300" y2="228" stroke="#9ca3af" stroke-width="1"/>
  <text x="120" y="244" text-anchor="middle" font-size="12" fill="#6b7280">x = 0</text>
  <text x="210" y="244" text-anchor="middle" font-size="12" fill="#6b7280">L / 2</text>
  <text x="300" y="244" text-anchor="middle" font-size="12" fill="#6b7280">x = L</text>

  <!-- Graph U(x) Panel 1 -->
  <text x="65" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">U (В)</text>

  <!-- Grid lines & Y ticks -->
  <line x1="65" y1="280" x2="300" y2="280" stroke="#e5e7eb" stroke-width="1"/>
  <text x="58" y="284" text-anchor="end" font-size="12" fill="#1a1a1a">5.0V</text>

  <line x1="65" y1="312.5" x2="300" y2="312.5" stroke="#e5e7eb" stroke-width="1"/>
  <text x="58" y="316.5" text-anchor="end" font-size="12" fill="#6b7280">4.5V</text>

  <line x1="65" y1="377.5" x2="300" y2="377.5" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="58" y="381.5" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">3.5V</text>
  <text x="298" y="370" text-anchor="end" font-size="11" font-weight="bold" fill="#c0392b">U_min = 3.5В</text>

  <line x1="65" y1="410" x2="300" y2="410" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="58" y="414" text-anchor="end" font-size="12" fill="#6b7280">3.0V</text>

  <!-- Shaded danger area below 3.5V -->
  <path d="M 210 377.5 Q 255 410, 300 422 L 300 410 L 210 410 Z" fill="#fdecea" opacity="0.7"/>

  <!-- Curve U(x) -->
  <path d="M 65 280 Q 182 340, 300 422" stroke="#c0392b" stroke-width="3" fill="none"/>
  <circle cx="65" cy="280" r="4" fill="#c0392b"/>

  <circle cx="300" cy="422" r="4" fill="#c0392b"/>
  <text x="298" y="402" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">~2.9В</text>

