<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="26" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Кінематичні профілі руху за S-кривою: позиція, швидкість, прискорення та ривок</text>
  <text x="480" y="46" font-size="13" text-anchor="middle" fill="#6b7280">Обмеження ривка (jerk-limited) забезпечує неперервне прискорення та усуває ударні навантаження на редуктор</text>

  <!-- ГОЛОВНА ПАНЕЛЬ -->
  <rect x="24" y="60" width="912" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Підписи рядків зліва від графіка -->
  <text x="36" y="118" font-size="13" font-weight="700" fill="#1a1a1a">Положення</text>
  <text x="36" y="134" font-size="12" fill="#6b7280">θ(t), C²-плавне</text>

  <text x="36" y="194" font-size="13" font-weight="700" fill="#27ae60">Швидкість</text>
  <text x="36" y="210" font-size="12" fill="#6b7280">ω(t), плато</text>

  <text x="36" y="272" font-size="13" font-weight="700" fill="#2457d6">Прискорення</text>
  <text x="36" y="288" font-size="12" fill="#6b7280">α(t), неперервне</text>

  <text x="36" y="352" font-size="13" font-weight="700" fill="#c0392b">Ривок (Jerk)</text>
  <text x="36" y="368" font-size="12" fill="#6b7280">j(t) = dα/dt</text>

  <!-- Фазові мітки над графіком -->
  <text x="223" y="76" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">T1</text>
  <text x="293" y="76" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">T2</text>
  <text x="363" y="76" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">T3</text>
  <text x="458" y="76" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">T4 (ω = const)</text>
  <text x="553" y="76" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">T5</text>
  <text x="623" y="76" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">T6</text>
  <text x="693" y="76" font-size="12" font-weight="700" text-anchor="middle" fill="#c0392b">T7</text>

  <!-- Біле поле графіків -->
  <rect x="136" y="84" width="784" height="340" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Вертикальні роздільники фаз T1..T7 -->
  <line x1="188" y1="84" x2="188" y2="398" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="258" y1="84" x2="258" y2="398" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="328" y1="84" x2="328" y2="398" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="398" y1="84" x2="398" y2="398" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="518" y1="84" x2="518" y2="398" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="588" y1="84" x2="588" y2="398" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="658" y1="84" x2="658" y2="398" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="728" y1="84" x2="728" y2="398" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- ОСІ ТА ПОЗНАЧКИ РЯДКА 1: Положення θ(t) -->
  <line x1="188" y1="100" x2="736" y2="100" stroke="#f0f0f0" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="182" y="104" font-size="12" text-anchor="end" fill="#1a1a1a">θ_end</text>
  <text x="182" y="150" font-size="12" text-anchor="end" fill="#6b7280">θ_0</text>
  <!-- Траєкторія θ(t) -->
  <path d="M 188,146 C 223,146 258,142 328,131 C 398,120 458,116 518,111 C 588,106 658,100 728,100 L 736,100" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- ОСІ ТА ПОЗНАЧКИ РЯДКА 2: Швидкість ω(t) -->
  <line x1="188" y1="176" x2="736" y2="176" stroke="#f0f0f0" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="182" y="180" font-size="12" text-anchor="end" fill="#27ae60">ω_max</text>
  <text x="182" y="220" font-size="12" text-anchor="end" fill="#6b7280">0</text>
  <line x1="188" y1="216" x2="736" y2="216" stroke="#e2e8f0" stroke-width="1"/>
  <!-- Траєкторія ω(t) -->
  <path d="M 188,216 C 223,216 238,206 258,206 L 328,186 C 348,186 363,176 398,176 L 518,176 C 553,176 568,186 588,186 L 658,206 C 678,206 693,216 728,216 L 736,216" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- ОСІ ТА ПОЗНАЧКИ РЯДКА 3: Прискорення α(t) -->
  <line x1="188" y1="250" x2="736" y2="250" stroke="#f0f0f0" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="182" y="254" font-size="12" text-anchor="end" fill="#2457d6">+α_max</text>
  <text x="182" y="280" font-size="12" text-anchor="end" fill="#6b7280">0</text>
  <line x1="188" y1="276" x2="736" y2="276" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="188" y1="302" x2="736" y2="302" stroke="#f0f0f0" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="182" y="306" font-size="12" text-anchor="end" fill="#2457d6">-α_max</text>
  <!-- Траєкторія α(t) -->
  <path d="M 188,276 L 258,250 L 328,250 L 398,276 L 518,276 L 588,302 L 658,302 L 728,276 L 736,276" fill="none" stroke="#2457d6" stroke-width="2.2"/>

  <!-- ОСІ ТА ПОЗНАЧКИ РЯДКА 4: Ривок j(t) -->
  <line x1="188" y1="334" x2="736" y2="334" stroke="#f0f0f0" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="182" y="338" font-size="12" text-anchor="end" fill="#c0392b">+J_max</text>
  <text x="182" y="360" font-size="12" text-anchor="end" fill="#6b7280">0</text>
  <line x1="188" y1="356" x2="736" y2="356" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="188" y1="378" x2="736" y2="378" stroke="#f0f0f0" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="182" y="382" font-size="12" text-anchor="end" fill="#c0392b">-J_max</text>
  <!-- Прямокутні імпульси j(t) з заливкою -->
  <polygon points="188,356 188,334 258,334 258,356" fill="#fdecea"/>
  <polygon points="328,356 328,378 398,378 398,356" fill="#fdecea"/>
  <polygon points="518,356 518,378 588,378 588,356" fill="#fdecea"/>
  <polygon points="658,356 658,334 728,334 728,356" fill="#fdecea"/>
  <!-- Лінія контуру j(t) -->
  <path d="M 188,356 L 188,334 L 258,334 L 258,356 L 328,356 L 328,378 L 398,378 L 398,356 L 518,356 L 518,378 L 588,378 L 588,356 L 658,356 L 658,334 L 728,334 L 728,356 L 736,356" fill="none" stroke="#c0392b" stroke-width="2"/>

  <!-- СПІЛЬНА ВІСЬ ЧАСУ ВНИЗУ -->
  <line x1="188" y1="398" x2="744" y2="398" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="188" y1="398" x2="188" y2="403" stroke="#1a1a1a" stroke-width="1"/>
  <text x="188" y="415" font-size="12" text-anchor="middle" fill="#6b7280">0</text>
  <line x1="398" y1="398" x2="398" y2="403" stroke="#1a1a1a" stroke-width="1"/>
  <text x="398" y="415" font-size="12" text-anchor="middle" fill="#6b7280">t_розгін</text>
  <line x1="518" y1="398" x2="518" y2="403" stroke="#1a1a1a" stroke-width="1"/>
  <text x="518" y="415" font-size="12" text-anchor="middle" fill="#6b7280">t_гальмування</text>
  <line x1="728" y1="398" x2="728" y2="403" stroke="#1a1a1a" stroke-width="1"/>
  <text x="728" y="415" font-size="12" text-anchor="middle" fill="#6b7280">T_руху</text>
  <text x="752" y="402" font-size="12" font-weight="700" fill="#1a1a1a">t (час)</text>

  <!-- ПРАВІ ІНФОРМАЦІЙНІ КАРТКИ -->
  <rect x="748" y="98" width="156" height="48" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="758" y="118" font-size="12" font-weight="700" fill="#1a1a1a">Траєкторія кута:</text>
  <text x="758" y="134" font-size="12" fill="#27ae60">C²-гладка без зламів</text>

  <rect x="748" y="172" width="156" height="48" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="758" y="192" font-size="12" font-weight="700" fill="#27ae60">Швидкість ω_max:</text>
  <text x="758" y="208" font-size="12" fill="#1a1a1a">Плавне колоколоподібне</text>

  <rect x="748" y="254" width="156" height="48" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="758" y="274" font-size="12" font-weight="700" fill="#2457d6">Прискорення α(t):</text>
  <text x="758" y="290" font-size="12" fill="#1a1a1a">Неперервне, без стрибків</text>

  <rect x="748" y="334" width="156" height="48" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="758" y="354" font-size="12" font-weight="700" fill="#c0392b">Ривок j(t) = dα/dt:</text>
  <text x="758" y="370" font-size="12" fill="#c0392b">Суворий ліміт ±J_max</text>
</svg>
