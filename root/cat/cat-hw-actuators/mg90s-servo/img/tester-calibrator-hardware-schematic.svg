<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-dark" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Схема автономного стенда-калібратора MG90S V2</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Розділене живлення, буферні конденсатори C1-C2 та шунт R_shunt захищають МК і вимірюють струми I_start/I_stall</text>

  <!-- ==================== TOP ROW BLOCKS ==================== -->

  <!-- Block 1: Power Supply (x=30..190, y=80..230) -->
  <rect x="30" y="80" width="160" height="150" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="110" y="102" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Джерело живлення</text>
  <text x="110" y="120" font-size="12" fill="#6b7280" text-anchor="middle">5V DC / 2.5A...3A</text>

  <rect x="42" y="140" width="136" height="46" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <circle cx="56" cy="154" r="4" fill="#2457d6"/>
  <text x="66" y="158" font-size="12" font-weight="700" fill="#2457d6">+5V PWR (2.5A)</text>
  <circle cx="56" cy="172" r="4" fill="#1a1a1a"/>
  <text x="66" y="176" font-size="12" font-weight="700" fill="#1a1a1a">GND (Спільна)</text>
  <text x="110" y="206" font-size="12" fill="#6b7280" text-anchor="middle">Силовий канал серво</text>

  <!-- Block 2: Power Buffer & Shunt (x=210..405, y=80..230) -->
  <rect x="210" y="80" width="195" height="150" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="307" y="102" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Буфер та шунт струму</text>

  <!-- C1 Label & Capacitor -->
  <text x="245" y="120" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">C1 470µF</text>
  <line x1="245" y1="135" x2="245" y2="157" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="237" y1="157" x2="253" y2="157" stroke="#2457d6" stroke-width="2"/>
  <line x1="237" y1="163" x2="253" y2="163" stroke="#2457d6" stroke-width="2"/>
  <line x1="245" y1="163" x2="245" y2="190" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="245" y="210" font-size="12" fill="#6b7280" text-anchor="middle">Low-ESR</text>

  <!-- C2 Label & Capacitor -->
  <text x="305" y="120" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">C2 0.1µF</text>
  <line x1="305" y1="135" x2="305" y2="157" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="297" y1="157" x2="313" y2="157" stroke="#2457d6" stroke-width="2"/>
  <line x1="297" y1="163" x2="313" y2="163" stroke="#2457d6" stroke-width="2"/>
  <line x1="305" y1="163" x2="305" y2="190" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="305" y="210" font-size="12" fill="#6b7280" text-anchor="middle">ВЧ фільтр</text>

  <!-- R_shunt Resistor on GND Line -->
  <text x="355" y="174" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">R_shunt 0.1 Ом</text>
  <rect x="340" y="183" width="30" height="14" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Block 3: MCU Control Unit (x=430..650, y=80..500) -->
  <rect x="430" y="80" width="220" height="420" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="2"/>
  <text x="540" y="105" font-size="16" font-weight="700" fill="#2457d6" text-anchor="middle">Мікроконтролер (MCU)</text>
  <text x="540" y="123" font-size="12" fill="#6b7280" text-anchor="middle">Генератор ШІМ + АЦП струму</text>

  <!-- Sub-block 3.1: Timer1 PWM Generator -->
  <rect x="448" y="138" width="184" height="52" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="540" y="156" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">Timer1 (16-bit PWM)</text>
  <text x="540" y="174" font-size="12" fill="#1a1a1a" text-anchor="middle">Крок: 1 µs, Частота: 50 Hz</text>

  <!-- Sub-block 3.2: Differential ADC -->
  <rect x="448" y="200" width="184" height="52" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="540" y="218" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle">Диференційний АЦП</text>
  <text x="540" y="236" font-size="12" fill="#1a1a1a" text-anchor="middle">Обчислення I = U_shunt / R</text>

  <!-- Sub-block 3.3: Firmware Modes -->
  <rect x="448" y="262" width="184" height="118" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="540" y="280" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Режими прошивки</text>
  <text x="460" y="300" font-size="12" font-weight="700" fill="#27ae60">1. Ручний (1 µs / 10 µs)</text>
  <text x="460" y="320" font-size="12" font-weight="700" fill="#2457d6">2. Нейтраль (1500 µs)</text>
  <text x="460" y="340" font-size="12" font-weight="700" fill="#c0392b">3. Автоскан (0°...180°)</text>
  <text x="460" y="360" font-size="12" fill="#6b7280">4. Пошук Dead-band</text>

  <!-- Sub-block 3.4: Calibration Limits Table -->
  <rect x="448" y="390" width="184" height="95" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="540" y="408" font-size="13" font-weight="700" fill="#27ae60" text-anchor="middle">Межі калібрування</text>
  <text x="460" y="428" font-size="12" fill="#1a1a1a">t_min: 500 µs (Кут 0°)</text>
  <text x="460" y="447" font-size="12" fill="#1a1a1a">t_max: 2500 µs (Кут 180°)</text>
  <text x="460" y="466" font-size="12" font-weight="700" fill="#c0392b">I_cutoff: 800 mA (Захист)</text>

  <!-- Block 4: MG90S Servo Under Test (x=680..930, y=80..230) -->
  <rect x="680" y="80" width="250" height="150" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="805" y="103" font-size="15" font-weight="700" fill="#2457d6" text-anchor="middle">Сервопривод MG90S V2</text>
  <text x="805" y="121" font-size="12" fill="#6b7280" text-anchor="middle">Металевий редуктор + Micro Servo</text>

  <rect x="695" y="132" width="220" height="86" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="805" y="150" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Електричні характеристики:</text>
  <text x="705" y="169" font-size="12" fill="#1a1a1a">• Напруга живлення: 4.8V...6.0V</text>
  <text x="705" y="187" font-size="12" fill="#1a1a1a">• Робочий ШІМ: 500...2500 µs</text>
  <text x="705" y="205" font-size="12" font-weight="700" fill="#c0392b">• Пусковий струм: до 750 mA</text>


  <!-- ==================== BOTTOM ROW BLOCKS ==================== -->

  <!-- Block 5: MCU Power Isolation & Filter (x=30..190, y=250..500) -->
  <rect x="30" y="250" width="160" height="250" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="110" y="273" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Фільтр живлення МК</text>
  <text x="110" y="291" font-size="12" fill="#6b7280" text-anchor="middle">Розв'язка силового кола</text>

  <rect x="42" y="305" width="136" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="110" y="322" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">D1 Шотткі 1N5819</text>
  <text x="110" y="338" font-size="12" fill="#6b7280" text-anchor="middle">Захист від просідань</text>

  <rect x="42" y="357" width="136" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="110" y="374" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">C3 100µF + C4 0.1µF</text>
  <text x="110" y="390" font-size="12" fill="#6b7280" text-anchor="middle">Фільтр завад двигуна</text>

  <rect x="42" y="410" width="136" height="78" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="110" y="428" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Ефект розв'язки:</text>
  <text x="110" y="446" font-size="12" fill="#1a1a1a" text-anchor="middle">МК не перезаванта-</text>
  <text x="110" y="462" font-size="12" fill="#1a1a1a" text-anchor="middle">жується при пуску</text>
  <text x="110" y="478" font-size="12" fill="#1a1a1a" text-anchor="middle">сервопривода</text>

  <!-- Block 6A: OLED Display (x=210..405, y=250..365) -->
  <rect x="210" y="250" width="195" height="115" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="307" y="268" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">OLED-Дисплей (I2C)</text>
  <rect x="222" y="276" width="170" height="80" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="230" y="293" font-size="12" font-weight="700" fill="#2457d6">MANUAL  t:1500µs</text>
  <text x="230" y="311" font-size="12" font-weight="700" fill="#27ae60">ANGLE:  90.0 deg</text>
  <text x="230" y="329" font-size="12" fill="#1a1a1a">I_now:  145 mA</text>
  <text x="230" y="347" font-size="12" font-weight="700" fill="#c0392b">I_peak: 680 mA</text>

  <!-- Block 6B: Rotary Encoder (x=210..405, y=380..500) -->
  <rect x="210" y="380" width="195" height="120" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="307" y="398" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Енкодер керування</text>
  <circle cx="245" cy="445" r="20" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <line x1="245" y1="445" x2="245" y2="429" stroke="#2457d6" stroke-width="2.5" stroke-linecap="round"/>
  <text x="330" y="420" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Крок 1µs / 10µs</text>
  <text x="330" y="438" font-size="12" fill="#1a1a1a" text-anchor="middle">Кнопка SW:</text>
  <text x="330" y="454" font-size="12" fill="#6b7280" text-anchor="middle">зміна режиму</text>
  <text x="330" y="470" font-size="12" fill="#6b7280" text-anchor="middle">і точністі</text>
  <text x="307" y="492" font-size="12" fill="#27ae60" text-anchor="middle">Апаратний антидребезг</text>

  <!-- Block 7: Legend & Practical Rules (x=680..930, y=250..500) -->
  <rect x="680" y="250" width="250" height="250" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="805" y="273" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Позначення та методика</text>

  <line x1="700" y1="298" x2="735" y2="298" stroke="#2457d6" stroke-width="3.5"/>
  <text x="745" y="302" font-size="12" font-weight="700" fill="#1a1a1a">Силове +5V (V_PWR)</text>

  <line x1="700" y1="322" x2="735" y2="322" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="745" y="326" font-size="12" font-weight="700" fill="#1a1a1a">Спільний мінус GND</text>

  <line x1="700" y1="346" x2="735" y2="346" stroke="#27ae60" stroke-width="2.5"/>
  <text x="745" y="350" font-size="12" font-weight="700" fill="#1a1a1a">ШІМ-сигнал (50 Hz PWM)</text>

  <line x1="700" y1="370" x2="735" y2="370" stroke="#c0392b" stroke-width="2"/>
  <text x="745" y="374" font-size="12" font-weight="700" fill="#1a1a1a">Вимірювальне коло U_shunt</text>

  <rect x="695" y="390" width="220" height="98" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="805" y="408" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Алгоритм калібрування MG90S:</text>
  <text x="705" y="427" font-size="12" fill="#1a1a1a">1. Знайти t_min при 0° (струм &lt; 200mA)</text>
  <text x="705" y="445" font-size="12" fill="#1a1a1a">2. Знайти t_max при 180°</text>
  <text x="705" y="463" font-size="12" fill="#c0392b">3. Зона заклинювання: I &gt; 700mA!</text>
  <text x="705" y="481" font-size="12" fill="#27ae60">4. Записати калібрування в EEPROM</text>


  <!-- ==================== WIRING & CONNECTIONS ==================== -->

  <!-- Power Bus (+5V PWR) from Power Supply to Buffer to MCU to Servo -->
  <line x1="190" y1="135" x2="430" y2="135" stroke="#2457d6" stroke-width="3.5"/>
  <line x1="650" y1="135" x2="672" y2="135" stroke="#2457d6" stroke-width="3.5" marker-end="url(#arr-blue)"/>

  <!-- Ground Bus (GND) -->
  <line x1="190" y1="190" x2="340" y2="190" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="370" y1="190" x2="430" y2="190" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="650" y1="190" x2="672" y2="190" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arr-dark)"/>

  <!-- U_shunt Differential Sense Lines -->
  <!-- Tap before R_shunt (x=330, y=190) -> MCU Pin A0 (x=430, y=225) -->
  <path d="M 330,190 L 330,225 L 422,225" fill="none" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arr-red)"/>
  <circle cx="330" cy="190" r="3" fill="#c0392b"/>

  <!-- Tap after R_shunt (x=380, y=190) -> MCU Pin A1 (x=430, y=242) -->
  <path d="M 380,190 L 380,242 L 422,242" fill="none" stroke="#c0392b" stroke-width="1.8" marker-end="url(#arr-red)"/>
  <circle cx="380" cy="190" r="3" fill="#c0392b"/>

  <!-- PWM Output Signal (MCU D9 -> Servo PWM) -->
  <line x1="650" y1="160" x2="672" y2="160" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <!-- OLED I2C Bus Wires (Display -> MCU A4, A5) -->
  <line x1="405" y1="290" x2="422" y2="290" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <line x1="405" y1="320" x2="422" y2="320" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arr-blue)"/>

  <!-- Rotary Encoder Wires (Encoder -> MCU D2, D3, D4) -->
  <line x1="405" y1="410" x2="422" y2="410" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr-dark)"/>
  <line x1="405" y1="440" x2="422" y2="440" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr-dark)"/>
  <line x1="405" y1="470" x2="422" y2="470" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr-dark)"/>

  <!-- MCU Filtered Isolated Power Wire (Block 5 -> MCU VCC Filter) -->
  <path d="M 190,322 L 200,322 L 200,140 L 430,140" fill="none" stroke="#2457d6" stroke-width="1.8" stroke-dasharray="5,3"/>

</svg>
