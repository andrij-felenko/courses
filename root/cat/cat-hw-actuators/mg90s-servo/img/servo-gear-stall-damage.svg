<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Механіка руйнування редуктора MG90S при впиранні в кінцевий упор</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Контакт стопорного штифта з обмежувачем корпусу, концентрація напружень і зрізання зубців проміжної шестерні</text>

  <!-- ПАНЕЛЬ 1: Кінематика редуктора та упор (зліва) -->
  <rect x="35" y="75" width="495" height="355" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="282" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кінематика редуктора та кінцевий упор</text>
  <text x="282" y="118" font-size="12" fill="#6b7280" text-anchor="middle">Схематичний розріз кришки редуктора MG90S (вигляд згори)</text>

  <!-- Внутрішня біла карта редуктора -->
  <rect x="55" y="132" width="455" height="280" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Шестерня 1: Вихідне зубчасте колесо (Output Gear) -->
  <circle cx="360" cy="275" r="85" fill="#f4f6f8" stroke="#2457d6" stroke-width="2"/>
  <!-- Зубці вихідного колеса (схематичний пунктир вінця) -->
  <circle cx="360" cy="275" r="89" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="5 4"/>
  <!-- Вал сервопривода (шліцьовий хаб) -->
  <circle cx="360" cy="275" r="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="360" y="279" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вал серви</text>

  <!-- Стрілка обертання вихідного вала -->
  <path d="M 330,200 A 80 80 0 0 0 285,275" fill="none" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="355" y="175" font-size="12" font-weight="bold" fill="#2457d6">Обертання CCW</text>

  <!-- Обмежувач корпусу (Mechanical Stop) у кришці -->
  <rect x="235" y="185" width="40" height="28" rx="3" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="255" y="168" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Упор корпусу</text>
  <text x="255" y="180" font-size="12" fill="#6b7280" text-anchor="middle">(пластик)</text>

  <!-- Стопорний штифт вихідного колеса (Limit Pin) -->
  <circle cx="285" cy="199" r="10" fill="#1a1a1a" stroke="#6b7280" stroke-width="1.5"/>
  <text x="315" y="196" font-size="12" font-weight="bold" fill="#1a1a1a">Штифт вала</text>

  <!-- Точка контакту: спалах / удар -->
  <circle cx="275" cy="199" r="6" fill="#c0392b"/>
  <circle cx="275" cy="199" r="12" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="2 2"/>
  <text x="220" y="225" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">Точка удару (Stall)</text>

  <!-- Вектор сили реакції упору F_упору -->
  <line x1="260" y1="205" x2="290" y2="205" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="220" y="239" font-size="12" fill="#c0392b" text-anchor="end">F_упору (реакція)</text>

  <!-- Мотор та вхідний піньйон -->
  <circle cx="120" cy="335" r="22" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="120" cy="335" r="6" fill="#c0392b"/>
  <text x="120" y="372" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мотор DC</text>
  <text x="120" y="388" font-size="12" fill="#6b7280" text-anchor="middle">Латунний піньйон</text>

  <!-- Проміжний блок шестерень (Intermediate Gears) -->
  <circle cx="195" cy="295" r="42" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 3"/>
  <circle cx="195" cy="295" r="18" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="195" cy="295" r="4" fill="#2457d6"/>
  <text x="195" y="352" font-size="12" fill="#6b7280" text-anchor="middle">Проміжна вісь</text>

  <!-- Зона критичного зачеплення (Mesh failure zone) -->
  <rect x="145" y="270" width="30" height="40" rx="4" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="3 2"/>
  <text x="110" y="276" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">Зона зрізу</text>
  <text x="110" y="290" font-size="12" fill="#c0392b" text-anchor="end">зубців</text>

  <!-- Вектор моменту редукції -->
  <text x="360" y="390" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">M_вихід до 2.2 кг·см (i ≈ 300:1)</text>
  <text x="360" y="405" font-size="12" fill="#6b7280" text-anchor="middle">Вал заблоковано, мотор продовжує тиск</text>


  <!-- ПАНЕЛЬ 2: Зрізання зубців при заклинюванні (справа) -->
  <rect x="545" y="75" width="380" height="355" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="735" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вузол зрізання зубців шестерні</text>
  <text x="735" y="118" font-size="12" fill="#6b7280" text-anchor="middle">Зубчасте зачеплення піньйона та проміжної шестерні</text>

  <!-- Внутрішня біла карта деталізації зуба -->
  <rect x="565" y="132" width="340" height="280" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Схематичний профіль зубчастого зачеплення -->
  <!-- Тіло ведучої шестерні (ліворуч) -->
  <rect x="585" y="150" width="45" height="150" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="607" y="145" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Ведучий</text>

  <!-- Ведучий зубець (тисне вправо) -->
  <path d="M 630,200 L 685,215 L 685,245 L 630,260 Z" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <!-- Сила тиску мотора F_зуб -->
  <line x1="610" y1="230" x2="675" y2="230" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-red)"/>
  <text x="645" y="222" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">F_зуб</text>

  <!-- Тіло веденої шестерні (праворуч, заблокована упором) -->
  <rect x="745" y="150" width="45" height="150" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <text x="767" y="145" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Ведений</text>

  <!-- Ведений зубець: деформований / сколений -->
  <!-- Тіло веденого зуба з тріщиною біля основи -->
  <path d="M 745,200 L 690,215 L 690,245 L 745,260 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>

  <!-- Лінія зрізу / тріщина біля кореня зуба -->
  <line x1="740" y1="202" x2="740" y2="258" stroke="#c0392b" stroke-width="3" stroke-dasharray="4 2"/>
  <!-- Тріщина відриву -->
  <path d="M 735,210 L 740,225 L 736,238 L 740,250" fill="none" stroke="#c0392b" stroke-width="2"/>

  <!-- Напруження зрізу Тау -->
  <text x="800" y="215" font-size="12" font-weight="bold" fill="#c0392b">τ_зрізу > τ_плинності</text>
  <text x="800" y="233" font-size="12" fill="#c0392b">Злам біля основи</text>
  <text x="800" y="251" font-size="12" fill="#6b7280">Викришування зубів</text>

  <!-- Стрілка деформації / зрізу -->
  <line x1="710" y1="250" x2="710" y2="280" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="718" y="278" font-size="12" font-weight="bold" fill="#c0392b">Зсув</text>

  <!-- Пояснення та фізика руйнування внизу панелі 2 -->
  <rect x="585" y="315" width="300" height="85" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="600" y="336" font-size="12" font-weight="bold" fill="#1a1a1a">Причина пошкодження редуктора:</text>
  <text x="600" y="354" font-size="12" fill="#6b7280">• Удар штифта об упор зупиняє вихідний вал</text>
  <text x="600" y="371" font-size="12" fill="#6b7280">• Мотор через редуктор 1:300 створює надзусилля</text>
  <text x="600" y="388" font-size="12" fill="#27ae60">• Захист: калібрування діапазону ШІМ 500–2400 мкс</text>
</svg>
