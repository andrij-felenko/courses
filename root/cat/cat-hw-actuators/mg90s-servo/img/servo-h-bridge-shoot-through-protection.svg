<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-green-rev" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- ==================== ЗАГОЛОВОК ТА ПІДЗАГОЛОВОК ==================== -->
  <text x="480" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Захист H-моста сервоприводу від наскрізних струмів (Dead-Time)</text>
  <text x="480" y="48" text-anchor="middle" font-size="13" fill="#6b7280">Пауза перемикання виключає коротке замикання стійки, а зворотні діоди скидають енергію індуктивності</text>

  <!-- ==================== ЛІВА ПАНЕЛЬ: СХЕМА H-МОСТА ==================== -->
  <rect x="25" y="65" width="445" height="285" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="86" font-size="13" font-weight="700" fill="#1a1a1a">1. Схема H-моста та рекуперація індуктивного струму</text>

  <!-- Поле схеми -->
  <rect x="40" y="96" width="415" height="152" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Шини живлення: +V_mot (5 В) та GND -->
  <line x1="90" y1="108" x2="310" y2="108" stroke="#c0392b" stroke-width="1.8"/>
  <text x="200" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#c0392b">+V_mot (5 В)</text>

  <line x1="90" y1="236" x2="310" y2="236" stroke="#1a1a1a" stroke-width="1.8"/>
  <text x="200" y="246" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">GND (0 В)</text>

  <!-- Ліва стійка А (Q1 зверху, Q3 знизу) -->
  <line x1="125" y1="108" x2="125" y2="122" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="110" y="122" width="30" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="125" y="136" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Q1</text>

  <line x1="125" y1="142" x2="125" y2="192" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="110" y="192" width="30" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="125" y="206" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Q3</text>
  <line x1="125" y1="212" x2="125" y2="236" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Зворотні діоди D1 та D3 -->
  <line x1="85" y1="142" x2="85" y2="122" stroke="#6b7280" stroke-width="1.2"/>
  <polygon points="81,134 89,134 85,126" fill="#6b7280"/>
  <line x1="81" y1="126" x2="89" y2="126" stroke="#6b7280" stroke-width="1.2"/>
  <text x="74" y="134" text-anchor="end" font-size="12" fill="#6b7280">D1</text>

  <line x1="85" y1="212" x2="85" y2="192" stroke="#6b7280" stroke-width="1.2"/>
  <polygon points="81,204 89,204 85,196" fill="#6b7280"/>
  <line x1="81" y1="196" x2="89" y2="196" stroke="#6b7280" stroke-width="1.2"/>
  <text x="74" y="204" text-anchor="end" font-size="12" fill="#6b7280">D3</text>

  <!-- З'єднання діодів до шин -->
  <line x1="85" y1="122" x2="125" y2="122" stroke="#6b7280" stroke-width="1"/>
  <line x1="85" y1="142" x2="125" y2="142" stroke="#6b7280" stroke-width="1"/>
  <line x1="85" y1="192" x2="125" y2="192" stroke="#6b7280" stroke-width="1"/>
  <line x1="85" y1="212" x2="125" y2="212" stroke="#6b7280" stroke-width="1"/>

  <!-- Права стійка B (Q2 зверху, Q4 знизу) -->
  <line x1="275" y1="108" x2="275" y2="122" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="260" y="122" width="30" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="275" y="136" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Q2</text>

  <line x1="275" y1="142" x2="275" y2="192" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="260" y="192" width="30" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="275" y="206" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Q4</text>
  <line x1="275" y1="212" x2="275" y2="236" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Зворотні діоди D2 та D4 -->
  <line x1="315" y1="142" x2="315" y2="122" stroke="#6b7280" stroke-width="1.2"/>
  <polygon points="311,134 319,134 315,126" fill="#6b7280"/>
  <line x1="311" y1="126" x2="319" y2="126" stroke="#6b7280" stroke-width="1.2"/>
  <text x="325" y="134" font-size="12" fill="#6b7280">D2</text>

  <line x1="315" y1="212" x2="315" y2="192" stroke="#6b7280" stroke-width="1.2"/>
  <polygon points="311,204 319,204 315,196" fill="#6b7280"/>
  <line x1="311" y1="196" x2="319" y2="196" stroke="#6b7280" stroke-width="1.2"/>
  <text x="325" y="204" font-size="12" fill="#6b7280">D4</text>

  <!-- З'єднання діодів до правої стійки -->
  <line x1="275" y1="122" x2="315" y2="122" stroke="#6b7280" stroke-width="1"/>
  <line x1="275" y1="142" x2="315" y2="142" stroke="#6b7280" stroke-width="1"/>
  <line x1="275" y1="192" x2="315" y2="192" stroke="#6b7280" stroke-width="1"/>
  <line x1="275" y1="212" x2="315" y2="212" stroke="#6b7280" stroke-width="1"/>

  <!-- Діагональ мотора М між вузлами А і В -->
  <line x1="125" y1="168" x2="182" y2="168" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="218" y1="168" x2="275" y2="168" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="200" cy="168" r="17" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="200" y="172" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">M</text>

  <circle cx="125" cy="168" r="2.5" fill="#1a1a1a"/>
  <circle cx="275" cy="168" r="2.5" fill="#1a1a1a"/>
  <text x="133" y="164" font-size="12" font-weight="700" fill="#2457d6">A</text>
  <text x="267" y="164" text-anchor="end" font-size="12" font-weight="700" fill="#2457d6">B</text>

  <!-- Картки статусів праворуч у схемі -->
  <rect x="345" y="112" width="100" height="52" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="395" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">Dead-Time</text>
  <text x="395" y="142" text-anchor="middle" font-size="12" fill="#1a1a1a">Q1, Q3 = ВИМК</text>
  <text x="395" y="156" text-anchor="middle" font-size="12" fill="#6b7280">Струм к.з. = 0</text>

  <rect x="345" y="174" width="100" height="56" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="395" y="190" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Діоди D1–D4</text>
  <text x="395" y="206" text-anchor="middle" font-size="12" fill="#1a1a1a">Рекуперація</text>
  <text x="395" y="220" text-anchor="middle" font-size="12" fill="#6b7280">Скид L·di/dt</text>

  <!-- Пояснювальний блок унизу лівої панелі -->
  <rect x="40" y="256" width="415" height="82" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="52" y="274" font-size="12" font-weight="700" fill="#1a1a1a">Захист стійки моста від наскрізного струму:</text>
  <text x="52" y="292" font-size="12" fill="#c0392b">• Shoot-through: одночасний стан ON у Q1 і Q3 коротить стійку.</text>
  <text x="52" y="308" font-size="12" fill="#27ae60">• Dead-time: пауза вимкнення Q1 перед стартом Q3 блокує к.з.</text>
  <text x="52" y="324" font-size="12" fill="#6b7280">• Зворотні діоди: струм котушки L·di/dt скидається через D3 і D2.</text>

  <!-- ==================== ПРАВА ПАНЕЛЬ: ЧАСОВІ ДІАГРАМИ ==================== -->
  <rect x="485" y="65" width="450" height="285" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="505" y="86" font-size="13" font-weight="700" fill="#1a1a1a">2. Часові діаграми: Dead-Time проти Shoot-Through</text>

  <!-- Поле осцилограм -->
  <rect x="500" y="96" width="420" height="152" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- 1. Сигнал керування Q1 (High-side Gate) -->
  <text x="560" y="120" text-anchor="end" font-size="12" font-weight="700" fill="#2457d6">Q1 Gate</text>
  <line x1="565" y1="126" x2="890" y2="126" stroke="#d0d7de" stroke-width="1"/>
  <polyline points="565,110 650,110 650,126 890,126" fill="none" stroke="#2457d6" stroke-width="1.8"/>

  <!-- 2. Сигнал керування Q3 (Low-side Gate) з паузою Dead-Time -->
  <text x="560" y="172" text-anchor="end" font-size="12" font-weight="700" fill="#2457d6">Q3 Gate</text>
  <line x1="565" y1="176" x2="890" y2="176" stroke="#d0d7de" stroke-width="1"/>
  <polyline points="565,176 710,176 710,160 890,160" fill="none" stroke="#2457d6" stroke-width="1.8"/>

  <!-- Виділення інтервалу Dead-Time t_dt (між x=650 та x=710) -->
  <rect x="650" y="106" width="60" height="74" fill="#e9f7ef" fill-opacity="0.5"/>
  <line x1="650" y1="106" x2="650" y2="180" stroke="#27ae60" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="710" y1="106" x2="710" y2="180" stroke="#27ae60" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="650" y1="148" x2="710" y2="148" stroke="#27ae60" stroke-width="1.5" marker-start="url(#arr-green-rev)" marker-end="url(#arr-green)"/>
  <text x="680" y="143" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">t_dt</text>

  <!-- 3. Силовий струм стійки I_стойки -->
  <text x="560" y="214" text-anchor="end" font-size="12" font-weight="700" fill="#1a1a1a">I_стійки</text>
  <line x1="565" y1="218" x2="890" y2="218" stroke="#d0d7de" stroke-width="1"/>

  <!-- Безпечний струм з t_dt (зелена суцільна лінія на нулі) -->
  <line x1="565" y1="218" x2="890" y2="218" stroke="#27ae60" stroke-width="2"/>

  <!-- Небезпечний пік наскрізного струму Shoot-through без t_dt (червоний сплеск) -->
  <path d="M 645,218 L 660,192 L 675,218" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="3,2"/>

  <!-- Позначення піка та норми праворуч -->
  <text x="735" y="196" font-size="12" font-weight="700" fill="#c0392b">Shoot-Through (без t_dt)</text>
  <text x="735" y="210" font-size="12" font-weight="700" fill="#27ae60">З t_dt: струм к.з. = 0</text>

  <!-- Вісь часу t -->
  <line x1="565" y1="234" x2="895" y2="234" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="902" y="238" font-size="12" font-weight="700" fill="#1a1a1a">t</text>

  <!-- Пояснювальний блок унизу правої панелі -->
  <rect x="500" y="256" width="420" height="82" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="512" y="274" font-size="12" font-weight="700" fill="#1a1a1a">Вимоги до тривалості мертвого часу t_dt:</text>
  <text x="512" y="292" font-size="12" fill="#27ae60">• Умова безпеки: t_dt &gt; t_off (запас на розряд ємності затвора).</text>
  <text x="512" y="308" font-size="12" fill="#c0392b">• Надлишковий t_dt: перегріває діоди та знижує лінійність ШІМ.</text>
  <text x="512" y="324" font-size="12" fill="#6b7280">• Оптимум: t_dt ≈ 150–250 нс повністю гасить наскрізний струм.</text>

  <!-- ==================== НИЖНЯ ПАНЕЛЬ: ІНЖЕНЕРНІ ВИСНОВКИ ==================== -->
  <rect x="25" y="362" width="910" height="78" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="382" font-size="12" font-weight="700" fill="#1a1a1a">Інженерний висновок щодо надійності силового каскаду сервоприводу:</text>
  <text x="45" y="401" font-size="12" fill="#1a1a1a">1. Апаратний генератор Dead-Time: логіка контролера формує затримку апаратно, виключаючи збої від зависання мікропрограми.</text>
  <text x="45" y="419" font-size="12" fill="#1a1a1a">2. Локалізація струмів: блокувальний конденсатор 10–47 мкФ безпосередньо біля моста гасить просідання напруги живлення під час реверсу.</text>
  <text x="45" y="435" font-size="12" fill="#6b7280">3. Тепловий режим: наскрізний струм навіть протягом 50 нс спричиняє швидкий перегрів чипа та лавинний пробій вихідних MOSFET.</text>
</svg>
