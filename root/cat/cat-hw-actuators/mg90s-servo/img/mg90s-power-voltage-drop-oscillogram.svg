<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Header -->
  <text x="480" y="26" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Осцилограма просідання шини живлення та струму сервопривода при Brownout</text>
  <text x="480" y="46" text-anchor="middle" font-size="13" fill="#6b7280">Пусковий сплеск струму блокування (I_stall ≈ 800 мА) викликає просідання VCC нижче порогу V_BOR і скидання MCU</text>

  <!-- Oscilloscope Main Panel -->
  <rect x="24" y="66" width="636" height="294" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="36" y="86" font-size="14" font-weight="700" fill="#1a1a1a">Осцилограма перехідного процесу (VCC та I_servo)</text>
  <text x="36" y="103" font-size="12" font-weight="700" fill="#1a1a1a">Канал 1 (VCC):</text>
  <text x="132" y="103" font-size="12" font-weight="700" fill="#c0392b">— Без буфера (&lt; V_BOR)</text>
  <text x="300" y="103" font-size="12" font-weight="700" fill="#27ae60">— З буфером 470..1000 мкФ</text>
  <text x="485" y="103" font-size="12" font-weight="700" fill="#c0392b">-- Поріг V_BOR = 4.3 В</text>
  <rect x="84" y="112" width="560" height="96" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="195" y="136" width="95" height="72" fill="#fdecea" opacity="0.6"/>
  <line x1="84" y1="136" x2="644" y2="136" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4,4"/>
  <text x="78" y="120" text-anchor="end" font-size="12" fill="#6b7280">5.0 В</text>
  <text x="78" y="140" text-anchor="end" font-size="12" font-weight="700" fill="#c0392b">4.3 В</text>
  <text x="78" y="174" text-anchor="end" font-size="12" fill="#6b7280">3.2 В</text>
  <text x="78" y="208" text-anchor="end" font-size="12" fill="#6b7280">0 В</text>
  <path d="M 84,116 L 180,116 C 188,116 195,122 205,122 C 215,122 225,116 240,116 L 644,116" fill="none" stroke="#27ae60" stroke-width="2"/>
  <path d="M 84,116 L 180,116 C 185,116 190,145 195,155 C 202,170 215,170 225,170 C 235,170 245,160 260,140 C 275,120 290,116 310,116 L 360,116 C 365,116 370,145 375,155 C 382,170 395,170 405,170 C 415,170 425,160 440,140 C 455,120 470,116 490,116 L 644,116" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="36" y="226" font-size="12" font-weight="700" fill="#1a1a1a">Канал 2 (I_servo):</text>
  <text x="160" y="226" font-size="12" font-weight="700" fill="#2457d6">— Струм сервопривода (пусковий імпульс 800 мА)</text>
  <rect x="84" y="234" width="560" height="96" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="78" y="246" text-anchor="end" font-size="12" font-weight="700" fill="#2457d6">800 мА</text>
  <text x="78" y="270" text-anchor="end" font-size="12" fill="#6b7280">500 мА</text>
  <text x="78" y="294" text-anchor="end" font-size="12" fill="#6b7280">200 мА</text>
  <text x="78" y="330" text-anchor="end" font-size="12" fill="#6b7280">0 мА</text>
  <path d="M 84,326 L 180,326 L 185,242 L 225,242 L 228,326 L 360,326 L 365,242 L 405,242 L 408,326 L 644,326" fill="none" stroke="#2457d6" stroke-width="2"/>
  <line x1="180" y1="112" x2="180" y2="330" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="225" y1="112" x2="225" y2="330" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="84" y="348" font-size="12" fill="#6b7280">0</text>
  <text x="180" y="348" text-anchor="middle" font-size="12" fill="#6b7280">10 мс</text>
  <text x="276" y="348" text-anchor="middle" font-size="12" fill="#6b7280">20 мс</text>
  <text x="372" y="348" text-anchor="middle" font-size="12" fill="#6b7280">30 мс</text>
  <text x="468" y="348" text-anchor="middle" font-size="12" fill="#6b7280">40 мс</text>
  <text x="564" y="348" text-anchor="middle" font-size="12" fill="#6b7280">50 мс</text>
  <text x="644" y="348" text-anchor="end" font-size="12" font-weight="700" fill="#1a1a1a">t, мс</text>

  <!-- Bottom Chronological Steps -->
  <rect x="24" y="372" width="200" height="66" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="36" y="392" font-size="12" font-weight="700" fill="#2457d6">1. Пусковий сплеск</text>
  <text x="36" y="408" font-size="12" fill="#1a1a1a">I_stall стрибає до 800 мА</text>
  <text x="36" y="424" font-size="12" fill="#6b7280">при старті мотора за &lt;1 мс</text>
  <rect x="238" y="372" width="204" height="66" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="250" y="392" font-size="12" font-weight="700" fill="#c0392b">2. Провал шини VCC</text>
  <text x="250" y="408" font-size="12" fill="#1a1a1a">VCC падає нижче V_BOR (4.3 В)</text>
  <text x="250" y="424" font-size="12" fill="#6b7280">через опір джерела та дротів</text>
  <rect x="456" y="372" width="204" height="66" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="468" y="392" font-size="12" font-weight="700" fill="#c0392b">3. MCU Reset (Brownout)</text>
  <text x="468" y="408" font-size="12" fill="#1a1a1a">Скидання MCU, зняття ШІМ,</text>
  <text x="468" y="424" font-size="12" fill="#6b7280">VCC зростає → вічний ребут!</text>

  <!-- Right Side Panel -->
  <rect x="676" y="66" width="260" height="134" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="688" y="88" font-size="13" font-weight="700" fill="#c0392b">Причина збою (Brownout)</text>
  <text x="688" y="108" font-size="12" font-weight="700" fill="#1a1a1a">ΔV = I_stall · (R_src + R_wire)</text>
  <text x="688" y="126" font-size="12" fill="#1a1a1a">Струм 800 мА на опорі 1–2 Ом</text>
  <text x="688" y="144" font-size="12" fill="#6b7280">дає провал напруги на 0.8–1.6 В.</text>
  <text x="688" y="164" font-size="12" font-weight="700" fill="#c0392b">Шина 5 В падає нижче 4.3 В,</text>
  <text x="688" y="182" font-size="12" fill="#6b7280">що активує апаратне скидання MCU.</text>
  <rect x="676" y="214" width="260" height="224" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="688" y="236" font-size="13" font-weight="700" fill="#27ae60">Як усунути просідання:</text>
  <text x="688" y="258" font-size="12" font-weight="700" fill="#27ae60">1. Буферний конденсатор</text>
  <text x="688" y="276" font-size="12" fill="#1a1a1a">470–1000 мкФ (Low-ESR)</text>
  <text x="688" y="294" font-size="12" fill="#6b7280">безпосередньо біля роз’єму серва.</text>
  <text x="688" y="318" font-size="12" font-weight="700" fill="#27ae60">2. Роздільне живлення</text>
  <text x="688" y="336" font-size="12" fill="#1a1a1a">Окремий DC-DC (5–6 В) для</text>
  <text x="688" y="354" fill="#6b7280" font-size="12">сервопривода, спільна лише GND.</text>
  <text x="688" y="378" font-size="12" font-weight="700" fill="#27ae60">3. Slew-Rate Limiting</text>
  <text x="688" y="396" font-size="12" fill="#1a1a1a">Програмне обмеження dθ/dt</text>
  <text x="688" y="414" font-size="12" fill="#6b7280">згладжує піковий струм розгону.</text>
</svg>
