<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <!-- Arrow markers -->
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <!-- Blue arrow markers -->
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <!-- Green arrow markers -->
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <!-- Red arrow markers -->
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Електромеханічна характеристика та корисна потужність MG90S</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Спад моменту за швидкістю при 4.8 В / 6.0 В, зона безпечного навантаження (25–35%) та пік потужності P_max</text>

  <!-- ==================== TOP LEGEND STRIP ==================== -->
  <text x="80" y="74" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Момент M (кг·см)</text>
  <text x="560" y="74" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Потужність P (Вт)</text>

  <rect x="156" y="62" width="328" height="22" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <line x1="166" y1="73" x2="186" y2="73" stroke="#2457d6" stroke-width="3"/>
  <text x="190" y="77" font-size="12" font-weight="bold" fill="#2457d6">6.0 В</text>

  <line x1="230" y1="73" x2="250" y2="73" stroke="#2457d6" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="254" y="77" font-size="12" fill="#2457d6">4.8 В</text>

  <line x1="294" y1="73" x2="314" y2="73" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="4,3"/>
  <text x="318" y="77" font-size="12" font-weight="bold" fill="#27ae60">P_mech (потужність)</text>

  <!-- ==================== COORDINATE PLOT ==================== -->
  <!-- Continuous Duty Zone Highlight (y = 287 to 311) -->
  <rect x="80" y="287" width="480" height="24" fill="#e9f7ef" opacity="0.6"/>

  <!-- Stall / Overload Zone Highlight (y = 132 to 208, x = 80 to 150) -->
  <rect x="80" y="132" width="70" height="76" fill="#fdecea" opacity="0.5"/>

  <!-- Horizontal Grid Lines -->
  <line x1="80" y1="100" x2="560" y2="100" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="80" y1="154" x2="560" y2="154" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="80" y1="208" x2="560" y2="208" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="80" y1="262" x2="560" y2="262" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="80" y1="316" x2="560" y2="316" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Vertical Grid Lines -->
  <line x1="160" y1="100" x2="160" y2="370" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="240" y1="100" x2="240" y2="370" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- At x=320: dashed line from peak (y=163) down to x-axis (y=370) -->
  <line x1="320" y1="163" x2="320" y2="370" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="400" y1="100" x2="400" y2="370" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="480" y1="100" x2="480" y2="370" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Left Y-axis line (Torque) -->
  <line x1="80" y1="375" x2="80" y2="88" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Right Y-axis line (Power) -->
  <line x1="560" y1="375" x2="560" y2="88" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- X-axis line (Speed) -->
  <line x1="75" y1="370" x2="585" y2="370" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Left Y-axis ticks and labels (Torque M) -->
  <line x1="75" y1="100" x2="80" y2="100" stroke="#2457d6" stroke-width="1.5"/>
  <text x="70" y="104" font-size="12" fill="#2457d6" text-anchor="end">2,5</text>

  <line x1="75" y1="154" x2="80" y2="154" stroke="#2457d6" stroke-width="1.5"/>
  <text x="70" y="158" font-size="12" fill="#2457d6" text-anchor="end">2,0</text>

  <line x1="75" y1="208" x2="80" y2="208" stroke="#2457d6" stroke-width="1.5"/>
  <text x="70" y="212" font-size="12" fill="#2457d6" text-anchor="end">1,5</text>

  <line x1="75" y1="262" x2="80" y2="262" stroke="#2457d6" stroke-width="1.5"/>
  <text x="70" y="266" font-size="12" fill="#2457d6" text-anchor="end">1,0</text>

  <line x1="75" y1="316" x2="80" y2="316" stroke="#2457d6" stroke-width="1.5"/>
  <text x="70" y="320" font-size="12" fill="#2457d6" text-anchor="end">0,5</text>

  <text x="70" y="374" font-size="12" fill="#6b7280" text-anchor="end">0,0</text>

  <!-- Right Y-axis ticks and labels (Power P) -->
  <line x1="560" y1="100" x2="565" y2="100" stroke="#27ae60" stroke-width="1.5"/>
  <text x="570" y="104" font-size="12" fill="#27ae60">1,5</text>

  <line x1="560" y1="154" x2="565" y2="154" stroke="#27ae60" stroke-width="1.5"/>
  <text x="570" y="158" font-size="12" fill="#27ae60">1,2</text>

  <line x1="560" y1="208" x2="565" y2="208" stroke="#27ae60" stroke-width="1.5"/>
  <text x="570" y="212" font-size="12" fill="#27ae60">0,9</text>

  <line x1="560" y1="262" x2="565" y2="262" stroke="#27ae60" stroke-width="1.5"/>
  <text x="570" y="266" font-size="12" fill="#27ae60">0,6</text>

  <line x1="560" y1="316" x2="565" y2="316" stroke="#27ae60" stroke-width="1.5"/>
  <text x="570" y="320" font-size="12" fill="#27ae60">0,3</text>

  <!-- X-axis ticks and labels (Speed omega) -->
  <line x1="80" y1="370" x2="80" y2="375" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="80" y="388" font-size="12" fill="#6b7280" text-anchor="middle">0</text>

  <line x1="160" y1="370" x2="160" y2="375" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="160" y="388" font-size="12" fill="#6b7280" text-anchor="middle">100</text>

  <line x1="240" y1="370" x2="240" y2="375" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="240" y="388" font-size="12" fill="#6b7280" text-anchor="middle">200</text>

  <line x1="320" y1="370" x2="320" y2="375" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="320" y="388" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">300</text>

  <line x1="400" y1="370" x2="400" y2="375" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="400" y="388" font-size="12" fill="#6b7280" text-anchor="middle">400</text>

  <line x1="480" y1="370" x2="480" y2="375" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="480" y="388" font-size="12" fill="#6b7280" text-anchor="middle">500</text>

  <line x1="560" y1="370" x2="560" y2="375" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="560" y="388" font-size="12" fill="#6b7280" text-anchor="middle">600</text>

  <!-- X-axis title -->
  <text x="320" y="408" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кутова швидкість вала ω (град/с)</text>

  <!-- CURVE 1: Torque at 6.0V (from (80, 132) to (560, 370)) -->
  <line x1="80" y1="132" x2="560" y2="370" stroke="#2457d6" stroke-width="3"/>
  <circle cx="80" cy="132" r="4" fill="#2457d6"/>
  <circle cx="560" cy="370" r="4" fill="#2457d6"/>

  <!-- CURVE 2: Torque at 4.8V (from (80, 176) to (480, 370)) -->
  <line x1="80" y1="176" x2="480" y2="370" stroke="#2457d6" stroke-width="2" stroke-dasharray="6,3"/>
  <circle cx="80" cy="176" r="4" fill="#2457d6"/>
  <circle cx="480" cy="370" r="4" fill="#2457d6"/>

  <!-- CURVE 3: Mechanical Power Parabola P_mech(omega) at 6.0V -->
  <path d="M80,370 C160,255 240,186 320,163 C400,186 480,255 560,370" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="5,4"/>
  <circle cx="320" cy="163" r="5" fill="#27ae60" stroke="white" stroke-width="2"/>

  <!-- Peak P_max Callout at (320, 163) -->
  <rect x="250" y="112" width="140" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="320" y="128" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">P_max ≈ 1,15 Вт</text>
  <line x1="320" y1="136" x2="320" y2="155" stroke="#27ae60" stroke-width="1.2" marker-end="url(#arr-green)"/>

  <!-- Bottom Strip under Chart -->
  <rect x="80" y="422" width="480" height="20" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="90" y="436" font-size="12" fill="#6b7280">Безпечна зона: 25–35% M_stall (0,55–0,77 кг·см) | Холостий хід: 600°/с (6.0В)</text>

  <!-- ==================== RIGHT COLUMN: 3 CARDS ==================== -->
  <!-- Card 1: Continuous Duty Zone (Green) -->
  <rect x="635" y="68" width="300" height="114" rx="6" fill="#f4f6f8" stroke="#27ae60" stroke-width="1"/>
  <rect x="635" y="68" width="300" height="26" rx="6" fill="#e9f7ef"/>
  <text x="645" y="86" font-size="13" font-weight="bold" fill="#27ae60">Безпечна зона (25–35% M_stall)</text>

  <text x="645" y="110" font-size="12" font-weight="bold" fill="#1a1a1a">Тривале навантаження: 0,55–0,77 кг·см</text>
  <text x="645" y="128" font-size="12" fill="#6b7280">Забезпечує циклічний рух без перегріву</text>
  <text x="645" y="146" font-size="12" fill="#6b7280">обмоток ротора та транзисторів H-моста.</text>
  <text x="645" y="166" font-size="12" fill="#27ae60">Ресурс редуктора перевищує 50 000 циклів</text>

  <!-- Card 2: Peak Power P_max (Blue) -->
  <rect x="635" y="196" width="300" height="114" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1"/>
  <rect x="635" y="196" width="300" height="26" rx="6" fill="#eaf0fd"/>
  <text x="645" y="214" font-size="13" font-weight="bold" fill="#2457d6">Пік потужності P_max (50% ω, 50% M)</text>

  <text x="645" y="238" font-size="12" font-weight="bold" fill="#1a1a1a">Максимум динамічної роботи: P ≈ 1,15 Вт</text>
  <text x="645" y="256" font-size="12" fill="#6b7280">Досягається при ω = 300°/с та M = 1,1 кг·см.</text>
  <text x="645" y="274" font-size="12" fill="#6b7280">Оптимальний режим для найшвидшого</text>
  <text x="645" y="294" font-size="12" fill="#2457d6">переміщення навантаження за мінімальний час.</text>

  <!-- Card 3: Stall Zone / Thermal Barrier (Red) -->
  <rect x="635" y="324" width="300" height="116" rx="6" fill="#f4f6f8" stroke="#c0392b" stroke-width="1"/>
  <rect x="635" y="324" width="300" height="26" rx="6" fill="#fdecea"/>
  <text x="645" y="342" font-size="13" font-weight="bold" fill="#c0392b">Тепловий бар'єр блокування (Stall)</text>

  <text x="645" y="366" font-size="12" font-weight="bold" fill="#1a1a1a">Струм блокування: I_stall ≈ 1,0 А</text>
  <text x="645" y="384" font-size="12" fill="#6b7280">Швидкість ω = 0, корисна потужність P = 0.</text>
  <text x="645" y="402" font-size="12" fill="#6b7280">100% енергії перетворюється на тепло Джоуля.</text>
  <text x="645" y="422" font-size="12" font-weight="bold" fill="#c0392b">Граничний час утримання: t &lt; 3–5 секунд!</text>
</svg>
