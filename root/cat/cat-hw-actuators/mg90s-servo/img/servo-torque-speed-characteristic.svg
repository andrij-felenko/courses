<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="28" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Електромеханічна характеристика сервопривода MG90S</text>
  <text x="480" y="48" font-size="13" text-anchor="middle" fill="#6b7280">Залежність моменту від швидкості при 4.8 В і 6.0 В та зона безпечного тривалого навантаження</text>

  <!-- ЛІВА ПАНЕЛЬ: Графік характеристики M(ω) -->
  <rect x="30" y="64" width="538" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="90" font-size="14" font-weight="700" fill="#1a1a1a">Характеристика M(ω): момент проти швидкості</text>

  <!-- Біла підкладка графіка -->
  <rect x="50" y="105" width="498" height="320" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Зона безпечного тривалого навантаження (Continuous Duty) -->
  <polygon points="110,380 500,380 376,310 110,310" fill="#e9f7ef" opacity="0.8"/>
  <line x1="110" y1="310" x2="376" y2="310" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="5 3"/>

  <!-- Зона короткочасного блокування (Stall Zone) -->
  <polygon points="110,160 210,216 110,216" fill="#fdecea" opacity="0.7"/>

  <!-- Допоміжна координатна сітка -->
  <line x1="110" y1="200" x2="435" y2="200" stroke="#f0f0f0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="240" y1="380" x2="240" y2="130" stroke="#f0f0f0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="370" y1="380" x2="370" y2="130" stroke="#f0f0f0" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Спадні криві моменту M(ω) -->
  <!-- 4.8 В: від (110, 200) до (435, 380) -->
  <line x1="110" y1="200" x2="435" y2="380" stroke="#6b7280" stroke-width="2.2" stroke-dasharray="6 3"/>
  <circle cx="110" cy="200" r="4" fill="#6b7280"/>
  <circle cx="435" cy="380" r="4" fill="#6b7280"/>

  <!-- 6.0 В: від (110, 160) до (500, 380) -->
  <line x1="110" y1="160" x2="500" y2="380" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="110" cy="160" r="4" fill="#2457d6"/>
  <circle cx="500" cy="380" r="4" fill="#2457d6"/>

  <!-- Осі координат -->
  <!-- Вісь Y (Момент) -->
  <line x1="110" y1="380" x2="110" y2="120" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="60" y="122" font-size="12" font-weight="700" fill="#1a1a1a">M (кг·см)</text>

  <!-- Вісь X (Швидкість) -->
  <line x1="110" y1="380" x2="525" y2="380" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="440" y="416" font-size="12" font-weight="700" fill="#1a1a1a">Швидкість ω (град/с)</text>

  <!-- Позначки та підписи на осі Y -->
  <line x1="105" y1="160" x2="110" y2="160" stroke="#1a1a1a" stroke-width="1"/>
  <text x="103" y="164" font-size="12" font-weight="700" text-anchor="end" fill="#2457d6">2.2 (6V)</text>

  <line x1="105" y1="200" x2="110" y2="200" stroke="#1a1a1a" stroke-width="1"/>
  <text x="103" y="204" font-size="12" font-weight="700" text-anchor="end" fill="#6b7280">1.8 (4.8V)</text>

  <line x1="105" y1="310" x2="110" y2="310" stroke="#1a1a1a" stroke-width="1"/>
  <text x="103" y="314" font-size="12" font-weight="700" text-anchor="end" fill="#27ae60">0.7</text>

  <text x="103" y="384" font-size="12" font-weight="700" text-anchor="end" fill="#6b7280">0</text>

  <!-- Позначки та підписи на осі X -->
  <line x1="240" y1="380" x2="240" y2="385" stroke="#1a1a1a" stroke-width="1"/>
  <text x="240" y="398" font-size="12" text-anchor="middle" fill="#6b7280">200</text>

  <line x1="370" y1="380" x2="370" y2="385" stroke="#1a1a1a" stroke-width="1"/>
  <text x="370" y="398" font-size="12" text-anchor="middle" fill="#6b7280">400</text>

  <line x1="435" y1="380" x2="435" y2="385" stroke="#1a1a1a" stroke-width="1"/>
  <text x="435" y="398" font-size="12" font-weight="700" text-anchor="middle" fill="#6b7280">500 (4.8V)</text>

  <line x1="500" y1="380" x2="500" y2="385" stroke="#1a1a1a" stroke-width="1"/>
  <text x="500" y="398" font-size="12" font-weight="700" text-anchor="middle" fill="#2457d6">600 (6V)</text>

  <!-- Підписи кривих (розташовані у вільному полі вище кривих) -->
  <text x="270" y="228" font-size="12" font-weight="700" fill="#2457d6">6.0 В: M_stall = 2,2 кг·см</text>
  <text x="270" y="246" font-size="12" font-weight="700" fill="#6b7280">4.8 В: M_stall = 1,8 кг·см</text>

  <!-- Підписи зон на графіку -->
  <text x="125" y="140" font-size="12" font-weight="700" fill="#c0392b">Зона блокування (Stall)</text>
  <text x="125" y="156" font-size="12" fill="#c0392b">I_stall ≈ 0,8–1,0 А</text>

  <text x="125" y="342" font-size="12" font-weight="700" fill="#27ae60">Тривала робота (25–35% M_stall)</text>
  <text x="125" y="360" font-size="12" fill="#27ae60">M &lt; 0,7 кг·см, безпечний тепловий режим</text>

  <!-- ПРАВА ПАНЕЛЬ: Пояснювальні картки -->
  <rect x="580" y="64" width="350" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="600" y="90" font-size="14" font-weight="700" fill="#1a1a1a">Аналіз робочих режимів сервопривода</text>

  <!-- Картка 1: Точки блокування -->
  <rect x="595" y="105" width="320" height="98" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="610" y="126" font-size="13" font-weight="700" fill="#c0392b">1. Точки блокування вала (Stall Torque)</text>
  <text x="610" y="146" font-size="12" fill="#1a1a1a">• 4.8 В: 1,8 кг·см | 6.0 В: 2,2 кг·см (при ω = 0)</text>
  <text x="610" y="166" font-size="12" fill="#1a1a1a">• Струм блокування досягає 0,8–1,0 А</text>
  <text x="610" y="186" font-size="12" fill="#6b7280">• Утримання понад 2–3 с перегріває двигун і міст</text>

  <!-- Картка 2: Тривала робота -->
  <rect x="595" y="215" width="320" height="98" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="610" y="236" font-size="13" font-weight="700" fill="#27ae60">2. Зона тривалої роботи (Continuous Duty)</text>
  <text x="610" y="256" font-size="12" fill="#1a1a1a">• Безпечне навантаження: 25–35% від M_stall</text>
  <text x="610" y="276" font-size="12" fill="#1a1a1a">• Робочий діапазон: 0,5–0,7 кг·см при ω &gt; 350°/с</text>
  <text x="610" y="296" font-size="12" fill="#6b7280">• Забезпечує тривалий ресурс металевих шестерень</text>

  <!-- Картка 3: Вплив напруги -->
  <rect x="595" y="325" width="320" height="98" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="610" y="346" font-size="13" font-weight="700" fill="#2457d6">3. Вплив напруги живлення (4.8 В vs 6.0 В)</text>
  <text x="610" y="366" font-size="12" fill="#1a1a1a">• Зростання моменту: 1,8 → 2,2 кг·см (+22%)</text>
  <text x="610" y="386" font-size="12" fill="#1a1a1a">• Зростання швидкості: 500 → 600°/с (+20%)</text>
  <text x="610" y="406" font-size="12" fill="#6b7280">• Час повороту на 60° зменшується з 0,12 до 0,10 с</text>
</svg>
