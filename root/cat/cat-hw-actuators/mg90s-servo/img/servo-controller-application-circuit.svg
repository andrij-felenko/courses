<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка полотна -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принципова схема ввімкнення сервоконтролера (AA51880 / M51660L)</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Обв'язка мертвої зони, подовжувача імпульсів, фільтрації шуму та іскрогасіння</text>

  <!-- ==================== ГОЛОВНА ПАНЕЛЬ СХЕМИ ==================== -->
  <rect x="24" y="76" width="912" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Внутрішня біла область монтажної схеми -->
  <rect x="36" y="88" width="888" height="256" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- ==================== ЦЕНТРАЛЬНА МІКРОСХЕМА U1 ==================== -->
  <rect x="385" y="102" width="190" height="226" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="2"/>
  <text x="480" y="124" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">U1: AA51880 / M51660L</text>
  <text x="480" y="139" font-size="12" fill="#6b7280" text-anchor="middle">Сервоконтролер (SOP-14)</text>

  <!-- Ліві виводи мікросхеми -->
  <!-- Пін 1: IN -->
  <line x1="330" y1="160" x2="385" y2="160" stroke="#2457d6" stroke-width="1.5"/>
  <text x="392" y="164" font-size="12" font-weight="bold" fill="#1a1a1a">1: IN</text>

  <!-- Пін 2: STRETCH -->
  <line x1="330" y1="195" x2="385" y2="195" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="392" y="199" font-size="12" font-weight="bold" fill="#1a1a1a">2: STRETCH</text>

  <!-- Пін 3: DEADBAND -->
  <line x1="330" y1="230" x2="385" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="392" y="234" font-size="12" font-weight="bold" fill="#1a1a1a">3: DEADBAND</text>

  <!-- Пін 4: POT_IN -->
  <line x1="330" y1="265" x2="385" y2="265" stroke="#c0392b" stroke-width="1.5"/>
  <text x="392" y="269" font-size="12" font-weight="bold" fill="#1a1a1a">4: POT_IN</text>

  <!-- Пін 7: GND -->
  <line x1="330" y1="300" x2="385" y2="300" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="392" y="304" font-size="12" font-weight="bold" fill="#1a1a1a">7: GND</text>

  <!-- Праві виводи мікросхеми -->
  <!-- Пін 14: VCC -->
  <line x1="575" y1="160" x2="630" y2="160" stroke="#c0392b" stroke-width="1.5"/>
  <text x="568" y="164" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">14: VCC</text>

  <!-- Пін 5: M+ -->
  <line x1="575" y1="195" x2="770" y2="195" stroke="#2457d6" stroke-width="1.8"/>
  <text x="568" y="199" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">5: M+</text>

  <!-- Пін 6: M- -->
  <line x1="575" y1="230" x2="770" y2="230" stroke="#2457d6" stroke-width="1.8"/>
  <text x="568" y="234" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">6: M−</text>

  <!-- Пін 10: V_REF -->
  <line x1="575" y1="265" x2="630" y2="265" stroke="#27ae60" stroke-width="1.5"/>
  <text x="568" y="269" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">10: V_REF</text>

  <!-- Пін 8: REF_C -->
  <line x1="575" y1="300" x2="630" y2="300" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="568" y="304" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="end">8: REF_C</text>


  <!-- ==================== ОБВ'ЯЗКА ЗЛІВА ==================== -->
  <!-- Вхідний роз'єм ШІМ -->
  <rect x="46" y="146" width="76" height="28" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="84" y="164" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вхід ШІМ</text>
  <line x1="122" y1="160" x2="330" y2="160" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- Підтяжка входу R_in (100 кОм) до GND -->
  <line x1="160" y1="160" x2="160" y2="188" stroke="#1a1a1a" stroke-width="1.2"/>
  <rect x="154" y="168" width="12" height="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="172" y="182" font-size="12" fill="#6b7280">100 кОм</text>
  <!-- Земля GND для R_in -->
  <line x1="152" y1="188" x2="168" y2="188" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="155" y1="192" x2="165" y2="192" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Конденсатор розтягувача C_str на піні 2 -->
  <line x1="220" y1="195" x2="220" y2="218" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="212" y1="205" x2="228" y2="205" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="212" y1="209" x2="228" y2="209" stroke="#1a1a1a" stroke-width="2"/>
  <text x="234" y="206" font-size="12" font-weight="bold" fill="#1a1a1a">C_str</text>
  <text x="234" y="218" font-size="12" fill="#6b7280">33 нФ</text>
  <!-- Земля для C_str -->
  <line x1="214" y1="218" x2="226" y2="218" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Резистор мертвої зони R_db на піні 3 -->
  <line x1="300" y1="230" x2="300" y2="252" stroke="#1a1a1a" stroke-width="1.2"/>
  <rect x="294" y="235" width="12" height="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="312" y="244" font-size="12" font-weight="bold" fill="#1a1a1a">R_db</text>
  <text x="312" y="258" font-size="12" fill="#6b7280">180 кОм</text>
  <!-- Земля для R_db -->
  <line x1="294" y1="255" x2="306" y2="255" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Потенціометр зворотного зв'язку -->
  <rect x="46" y="246" width="96" height="58" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="94" y="266" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Потенціометр</text>
  <text x="94" y="281" font-size="12" fill="#1a1a1a" text-anchor="middle">5 кОм (зворотний)</text>
  <text x="94" y="295" font-size="12" fill="#6b7280" text-anchor="middle">Вал редуктора</text>

  <!-- ФНЧ сигнал потенціометра: R_filt та C_filt -->
  <line x1="142" y1="265" x2="330" y2="265" stroke="#c0392b" stroke-width="1.5"/>
  <!-- Резистор R_filt -->
  <rect x="160" y="259" width="24" height="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="172" y="254" font-size="12" fill="#6b7280" text-anchor="middle">10 кОм</text>
  <!-- Конденсатор C_filt до GND -->
  <line x1="210" y1="265" x2="210" y2="288" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="202" y1="278" x2="218" y2="278" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="202" y1="282" x2="218" y2="282" stroke="#1a1a1a" stroke-width="2"/>
  <text x="224" y="284" font-size="12" fill="#6b7280">10 нФ</text>
  <line x1="204" y1="288" x2="216" y2="288" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Загальна земля GND піна 7 -->
  <line x1="330" y1="300" x2="310" y2="300" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="306" y1="294" x2="306" y2="306" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="298" y="304" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">GND</text>


  <!-- ==================== ОБВ'ЯЗКА СПРАВА ==================== -->
  <!-- Шина живлення +5В та блокувальні конденсатори -->
  <rect x="630" y="104" width="70" height="26" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="665" y="121" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+5В (VCC)</text>

  <!-- Провід від шини живлення до піна 14 -->
  <line x1="665" y1="130" x2="665" y2="160" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="665" y1="160" x2="630" y2="160" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Керамічний блокувальний конденсатор 100 нФ -->
  <line x1="715" y1="130" x2="715" y2="165" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="707" y1="144" x2="723" y2="144" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="707" y1="148" x2="723" y2="148" stroke="#1a1a1a" stroke-width="2"/>
  <text x="730" y="150" font-size="12" fill="#6b7280">100 нФ</text>
  <line x1="709" y1="165" x2="721" y2="165" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Двигун постійного струму DC -->
  <rect x="770" y="180" width="136" height="74" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="838" y="202" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Двигун DC</text>
  <text x="838" y="218" font-size="12" fill="#1a1a1a" text-anchor="middle">Колекторний мотор</text>
  <text x="838" y="233" font-size="12" fill="#6b7280" text-anchor="middle">Іскрогасники 3×100нФ</text>

  <!-- Іскрогасний конденсатор C_m (100 нФ) між клемами мотора -->
  <line x1="720" y1="195" x2="720" y2="230" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="712" y1="210" x2="728" y2="210" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="712" y1="214" x2="728" y2="214" stroke="#1a1a1a" stroke-width="2"/>
  <text x="734" y="216" font-size="12" font-weight="bold" fill="#27ae60">100 нФ</text>

  <!-- Пін 8: REF_C конденсатор 10 нФ -->
  <line x1="630" y1="300" x2="660" y2="300" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="660" y1="294" x2="660" y2="306" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="664" y1="294" x2="664" y2="306" stroke="#1a1a1a" stroke-width="2"/>
  <text x="672" y="304" font-size="12" fill="#6b7280">10 нФ (C_ref)</text>


  <!-- ==================== НИЖНЯ ІНФОРМАЦІЙНА ПЛАШКА ==================== -->
  <rect x="36" y="356" width="888" height="68" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <text x="180" y="380" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Часова обв'язка</text>
  <text x="180" y="396" font-size="12" fill="#1a1a1a" text-anchor="middle">R_db: поріг нечутливості 2..4 мкс</text>
  <text x="180" y="410" font-size="12" fill="#6b7280" text-anchor="middle">C_str: коефіцієнт розтягу імпульсу</text>

  <text x="480" y="380" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Фільтрація потенціометра</text>
  <text x="480" y="396" font-size="12" fill="#1a1a1a" text-anchor="middle">R_filt + C_filt: ФНЧ від брязкоту</text>
  <text x="480" y="410" font-size="12" fill="#6b7280" text-anchor="middle">Пригнічує контактний шум щітки</text>

  <text x="780" y="380" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Іскрогасіння та живлення</text>
  <text x="780" y="396" font-size="12" fill="#1a1a1a" text-anchor="middle">3×100 нФ на моторі гасять EMI</text>
  <text x="780" y="410" font-size="12" fill="#6b7280" text-anchor="middle">Блокувальний C_dec гасить завади</text>
</svg>
