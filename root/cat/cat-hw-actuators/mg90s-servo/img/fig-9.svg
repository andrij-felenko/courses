<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="27" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Земляні петлі та вимірювання струму: Ground Bounce vs Star-GND</text>
  <text x="480" y="47" text-anchor="middle" font-size="13" fill="#6b7280">Вплив паразитного опору спільної шини на джитер ШІМ та коректна схема підключення шунта</text>

  <!-- ======================================================== -->
  <!-- ЛІВА ПАНЕЛЬ: Неправильна схема (Ground Bounce)           -->
  <!-- ======================================================== -->
  <rect x="24" y="62" width="446" height="382" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">⛔ Помилка: спільна земля та Ground Bounce</text>
  <text x="247" y="101" text-anchor="middle" font-size="12" fill="#6b7280">Силовий струм мотора спотворює потенціал землі логіки MCU</text>

  <!-- Блок MCU (Логіка) -->
  <rect x="38" y="120" width="100" height="96" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="88" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">MCU</text>
  <text x="88" y="159" text-anchor="middle" font-size="12" fill="#6b7280">Логіка 3.3V</text>
  <text x="130" y="174" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">PWM</text>
  <text x="130" y="204" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">GND</text>

  <!-- Блок Servo (MG90S) -->
  <rect x="355" y="120" width="100" height="150" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="405" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">MG90S</text>
  <text x="405" y="159" text-anchor="middle" font-size="12" fill="#6b7280">Сервопривод</text>
  <text x="365" y="174" font-size="12" font-weight="bold" fill="#2457d6">PWM</text>
  <text x="365" y="209" font-size="12" font-weight="bold" fill="#c0392b">VCC</text>
  <text x="365" y="244" font-size="12" font-weight="bold" fill="#1a1a1a">GND</text>

  <!-- Блок живлення (Power DC) -->
  <rect x="38" y="234" width="100" height="76" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="88" y="254" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Джерело</text>
  <text x="88" y="270" text-anchor="middle" font-size="12" fill="#6b7280">5V DC (2A)</text>
  <text x="130" y="289" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">+5V</text>
  <text x="130" y="304" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">0V</text>

  <!-- Провідник ШІМ -->
  <line x1="138" y1="170" x2="353" y2="170" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="246" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">ШІМ (V_pwm = 3.3 В)</text>

  <!-- Силовий провідник живлення +5V -->
  <polyline points="138,285 180,285 180,205 353,205" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="266" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">VCC (+5 В)</text>

  <!-- Спільний провідник землі з паразитним опором R_wire -->
  <polyline points="138,200 160,200 160,305" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="160" cy="305" r="3" fill="#1a1a1a"/>
  <line x1="138" y1="305" x2="220" y2="305" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Символ паразитного опору R_wire -->
  <rect x="220" y="300" width="36" height="10" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="238" y="289" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">R_wire ≈ 0.4 Ом</text>

  <polyline points="256,305 320,305 320,240 353,240" fill="none" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>

  <!-- Зсув потенціалу землі -->
  <text x="238" y="322" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">ΔV_gnd = I · R_wire ≈ 0.36 В</text>
  <text x="238" y="338" text-anchor="middle" font-size="12" fill="#6b7280">V_eff = 3.3 - 0.36 = 2.94 В (зсув нуля)</text>

  <!-- Підсумкова картка наслідків -->
  <rect x="38" y="349" width="418" height="84" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="50" y="367" font-size="13" font-weight="bold" fill="#c0392b">Наслідки Ground Bounce:</text>
  <text x="50" y="386" font-size="12" fill="#1a1a1a">• Підйом потенціалу землі плаває синхронно зі струмом мотора</text>
  <text x="50" y="404" font-size="12" fill="#1a1a1a">• Зсув порогів логіки викликає тремтіння тривалості імпульсу (джитер)</text>
  <text x="50" y="422" font-size="12" fill="#1a1a1a">• Сервопривод хаотично сіпається (hunting) навіть за стабільного коду</text>

  <!-- ======================================================== -->
  <!-- ПРАВА ПАНЕЛЬ: Правильна схема (Star-GND та шунт)         -->
  <!-- ======================================================== -->
  <rect x="490" y="62" width="446" height="382" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="713" y="84" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">✓ Правильно: Star-GND та фільтрований шунт</text>
  <text x="713" y="101" text-anchor="middle" font-size="12" fill="#6b7280">Роздільне повернення силового струму та чисте вимірювання через RC</text>

  <!-- Блок MCU (Логіка) -->
  <rect x="504" y="120" width="100" height="110" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="554" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">MCU</text>
  <text x="554" y="159" text-anchor="middle" font-size="12" fill="#6b7280">Логіка 3.3V</text>
  <text x="596" y="174" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">PWM</text>
  <text x="596" y="200" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">GND</text>
  <text x="596" y="222" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">ADC</text>

  <!-- Блок Servo (MG90S) -->
  <rect x="820" y="120" width="100" height="150" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="870" y="142" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">MG90S</text>
  <text x="870" y="159" text-anchor="middle" font-size="12" fill="#6b7280">Сервопривод</text>
  <text x="830" y="174" font-size="12" font-weight="bold" fill="#2457d6">PWM</text>
  <text x="830" y="209" font-size="12" font-weight="bold" fill="#c0392b">VCC</text>
  <text x="830" y="244" font-size="12" font-weight="bold" fill="#1a1a1a">GND</text>

  <!-- Блок живлення (Power DC) -->
  <rect x="504" y="245" width="100" height="75" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="554" y="265" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Джерело</text>
  <text x="554" y="281" text-anchor="middle" font-size="12" fill="#6b7280">5V DC</text>
  <text x="596" y="295" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">+5V</text>
  <text x="596" y="310" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">0V</text>

  <!-- Провідник ШІМ -->
  <line x1="604" y1="170" x2="818" y2="170" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="712" y="158" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">ШІМ (чистий відлік від GND)</text>

  <!-- Силовий провідник живлення +5V -->
  <polyline points="604,295 625,295 625,205 818,205" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="712" y="195" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">VCC (+5 В)</text>

  <!-- Струмовимірювальний шунт R_shunt (0.1 Ом) на зворотній лінії серво -->
  <line x1="818" y1="230" x2="785" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="750" y="225" width="35" height="10" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="767" y="217" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">R_shunt = 0.1 Ом</text>

  <!-- Від шунта до точки Star-GND -->
  <polyline points="750,230 655,230 655,305" fill="none" stroke="#27ae60" stroke-width="2"/>

  <!-- Зіркова точка заземлення Star-GND -->
  <circle cx="655" cy="310" r="4" fill="#27ae60"/>
  <text x="655" y="328" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Star-GND</text>
  <line x1="604" y1="310" x2="651" y2="310" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Чиста лінія землі MCU до Star-GND -->
  <polyline points="604,196 638,196 638,310 651,310" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Модуль RC-фільтра для АЦП -->
  <rect x="628" y="246" width="168" height="48" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3 3"/>
  <text x="712" y="266" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">RC-фільтр: 1 кОм / 100 нФ</text>
  <text x="712" y="284" text-anchor="middle" font-size="12" fill="#6b7280">Пригнічення завад щіток</text>

  <!-- Сигнальна лінія вимірювання струму через фільтр до MCU ADC -->
  <polyline points="785,230 796,230 796,270" fill="none" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="628" y1="270" x2="604" y2="270" stroke="#27ae60" stroke-width="1.5"/>
  <polyline points="604,270 604,226" fill="none" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Підсумкова картка переваг -->
  <rect x="504" y="349" width="418" height="84" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="516" y="367" font-size="13" font-weight="bold" fill="#27ae60">Переваги схеми Star-GND з RC-фільтром:</text>
  <text x="516" y="386" font-size="12" fill="#1a1a1a">• Силовий струм повертається виключно в точку Star-GND</text>
  <text x="516" y="404" font-size="12" fill="#1a1a1a">• Земля MCU вільна від пульсацій — нульовий джитер ШІМ</text>
  <text x="516" y="422" font-size="12" fill="#1a1a1a">• Фільтр 1 кОм / 100 нФ зрізає комутаційний шум щіток на АЦП</text>
</svg>
