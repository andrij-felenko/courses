<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs>
  <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,1 L7,4 L0,7 Z" fill="#1a1a1a"/>
  </marker>
  <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
  </marker>
</defs>

<rect x="0" y="0" width="960" height="460" fill="white"/>

<!-- Title & Subtitle -->
<text x="480" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Криві навантажувальної нелінійності потенціометра сервоприводу</text>
<text x="480" y="46" text-anchor="middle" font-size="13" fill="#6b7280">Вплив вхідного опору АЦП (R_in) на прогинання характеристики V_out(θ) та кутову похибку</text>

<!-- ==================== LEFT PANEL: V_OUT(THETA) FAMILY ==================== -->
<rect x="30" y="68" width="430" height="262" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="30" y="68" width="430" height="26" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="245" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">1. Передавальні характеристики V_out(θ) при навантаженні</text>

<!-- Legend badges at top of Left Panel (safe from grid lines) -->
<text x="45" y="112" font-size="12" font-weight="bold" fill="#27ae60">— R_in ≫ R_pot</text>
<text x="175" y="112" font-size="12" font-weight="bold" fill="#2457d6">— 10·R_pot</text>
<text x="268" y="112" font-size="12" font-weight="bold" fill="#6b7280">— 3·R_pot</text>
<text x="355" y="112" font-size="12" font-weight="bold" fill="#c0392b">— 1·R_pot</text>

<!-- Y axis labels -->
<text x="88" y="124" text-anchor="end" font-size="12" fill="#1a1a1a">5.0 В</text>
<text x="88" y="164" text-anchor="end" font-size="12" fill="#6b7280">3.75 В</text>
<text x="88" y="204" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">2.5 В</text>
<text x="88" y="244" text-anchor="end" font-size="12" fill="#6b7280">1.25 В</text>
<text x="88" y="284" text-anchor="end" font-size="12" fill="#1a1a1a">0.0 В</text>

<!-- Horizontal Grid lines -->
<line x1="95" y1="120" x2="435" y2="120" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="2,2"/>
<line x1="95" y1="160" x2="435" y2="160" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="2,2"/>
<line x1="95" y1="200" x2="435" y2="200" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="2,2"/>
<line x1="95" y1="240" x2="435" y2="240" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="2,2"/>
<line x1="95" y1="280" x2="435" y2="280" stroke="#1a1a1a" stroke-width="1.5"/>

<!-- Vertical Grid lines -->
<line x1="95" y1="120" x2="95" y2="280" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="180" y1="120" x2="180" y2="280" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="2,2"/>
<line x1="265" y1="120" x2="265" y2="280" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="2,2"/>
<line x1="350" y1="120" x2="350" y2="280" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="2,2"/>
<line x1="435" y1="120" x2="435" y2="280" stroke="#1a1a1a" stroke-width="1.5"/>

<!-- V_out Curves -->
<polyline points="95.0,280.0 113.9,271.1 132.8,262.2 151.7,253.3 170.6,244.4 189.4,235.6 208.3,226.7 227.2,217.8 246.1,208.9 265.0,200.0 283.9,191.1 302.8,182.2 321.7,173.3 340.6,164.4 359.4,155.6 378.3,146.7 397.2,137.8 416.1,128.9 435.0,120.0" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="4,3"/>
<polyline points="95.0,280.0 113.9,271.2 132.8,262.4 151.7,253.7 170.6,245.0 189.4,236.4 208.3,227.8 227.2,219.2 246.1,210.6 265.0,202.0 283.9,193.3 302.8,184.5 321.7,175.7 340.6,166.7 359.4,157.7 378.3,148.5 397.2,139.2 416.1,129.7 435.0,120.0" fill="none" stroke="#2457d6" stroke-width="2"/>
<polyline points="95.0,280.0 113.9,271.3 132.8,262.8 151.7,254.5 170.6,246.4 189.4,238.3 208.3,230.3 227.2,222.3 246.1,214.3 265.0,206.2 283.9,197.9 302.8,189.4 321.7,180.7 340.6,171.7 359.4,162.3 378.3,152.6 397.2,142.3 416.1,131.5 435.0,120.0" fill="none" stroke="#6b7280" stroke-width="2"/>
<polyline points="95.0,280.0 113.9,271.6 132.8,263.8 151.7,256.6 170.6,249.7 189.4,243.0 208.3,236.4 227.2,229.7 246.1,223.0 265.0,216.0 283.9,208.7 302.8,201.0 321.7,192.7 340.6,183.8 359.4,173.9 378.3,162.9 397.2,150.6 416.1,136.4 435.0,120.0" fill="none" stroke="#c0392b" stroke-width="2.5"/>

<!-- X axis labels -->
<text x="95" y="296" text-anchor="middle" font-size="12" fill="#6b7280">0°</text>
<text x="180" y="296" text-anchor="middle" font-size="12" fill="#6b7280">45°</text>
<text x="265" y="296" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">90°</text>
<text x="350" y="296" text-anchor="middle" font-size="12" fill="#6b7280">135°</text>
<text x="435" y="296" text-anchor="middle" font-size="12" fill="#6b7280">180°</text>
<text x="265" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Кут повороту вала θ [град]</text>

<!-- ==================== RIGHT PANEL: SCHEMATIC & ANGULAR ERROR ==================== -->
<rect x="480" y="68" width="450" height="262" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="480" y="68" width="450" height="26" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="705" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">2. Схема шунтування та кутова похибка Δθ(θ)</text>

<!-- Upper Sub-block: Equivalent Shunt Circuit (y: 100..185) -->
<!-- Potentiometer vertical branch -->
<line x1="515" y1="106" x2="515" y2="114" stroke="#c0392b" stroke-width="2"/>
<circle cx="515" cy="106" r="3" fill="#c0392b"/>
<text x="507" y="110" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">+5V</text>

<rect x="508" y="114" width="14" height="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="500" y="129" text-anchor="end" font-size="12" fill="#6b7280">R1</text>

<line x1="515" y1="134" x2="515" y2="148" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="515" cy="141" r="3" fill="#1a1a1a"/>

<rect x="508" y="148" width="14" height="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="500" y="163" text-anchor="end" font-size="12" fill="#6b7280">R2</text>

<line x1="515" y1="168" x2="515" y2="176" stroke="#1a1a1a" stroke-width="2"/>
<circle cx="515" cy="176" r="3" fill="#1a1a1a"/>
<text x="507" y="180" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">GND</text>

<!-- Wiper wire to load resistor R_in -->
<line x1="515" y1="141" x2="570" y2="141" stroke="#2457d6" stroke-width="2"/>
<circle cx="570" cy="141" r="3" fill="#2457d6"/>

<rect x="563" y="148" width="14" height="20" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="585" y="163" font-size="12" font-weight="bold" fill="#c0392b">R_in</text>

<line x1="570" y1="141" x2="570" y2="148" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="570" y1="168" x2="570" y2="176" stroke="#1a1a1a" stroke-width="2"/>
<line x1="515" y1="176" x2="570" y2="176" stroke="#1a1a1a" stroke-width="2"/>

<!-- Wiper output line -->
<line x1="570" y1="141" x2="610" y2="141" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
<text x="618" y="145" font-size="12" font-weight="bold" fill="#2457d6">V_out</text>

<!-- Formula card next to schematic -->
<rect x="670" y="104" width="245" height="74" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<text x="792" y="122" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Ефект паралельного шунтування:</text>
<text x="682" y="142" font-size="12" fill="#1a1a1a">R2_екв = (R2 · R_in) / (R2 + R_in) &lt; R2</text>
<text x="682" y="162" font-size="12" font-weight="bold" fill="#c0392b">Макс. спад ΔV при θ = 90°: ΔV ∝ 1/(4·k)</text>

<!-- Lower Sub-block: Angular Error Plot Delta_theta(theta) (y: 195..325) -->
<!-- Axis Y for Error -->
<text x="532" y="214" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">18°</text>
<text x="532" y="259" text-anchor="end" font-size="12" fill="#6b7280">9°</text>
<text x="532" y="304" text-anchor="end" font-size="12" fill="#1a1a1a">0°</text>

<!-- Grid lines for error plot -->
<line x1="540" y1="210" x2="890" y2="210" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="2,2"/>
<line x1="540" y1="255" x2="890" y2="255" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="2,2"/>
<line x1="540" y1="300" x2="890" y2="300" stroke="#1a1a1a" stroke-width="1.5"/>

<!-- Vertical lines for error plot -->
<line x1="540" y1="210" x2="540" y2="300" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="715" y1="210" x2="715" y2="300" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="2,2"/>
<line x1="890" y1="210" x2="890" y2="300" stroke="#1a1a1a" stroke-width="1.5"/>

<!-- Error Curves -->
<polyline points="540.0,300.0 559.4,300.0 578.9,300.0 598.3,300.0 617.8,300.0 637.2,300.0 656.7,300.0 676.1,300.0 695.6,300.0 715.0,300.0 734.4,300.0 753.9,300.0 773.3,300.0 792.8,300.0 812.2,300.0 831.7,300.0 851.1,300.0 870.6,300.0 890.0,300.0" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="4,3"/>
<polyline points="540.0,300.0 559.4,299.8 578.9,299.1 598.3,298.2 617.8,296.9 637.2,295.6 656.7,294.1 676.1,292.7 695.6,291.3 715.0,290.1 734.4,289.2 753.9,288.5 773.3,288.3 792.8,288.5 812.2,289.3 831.7,290.8 851.1,293.0 870.6,296.0 890.0,300.0" fill="none" stroke="#2457d6" stroke-width="2"/>
<polyline points="540.0,300.0 559.4,299.2 578.9,297.1 598.3,294.0 617.8,290.2 637.2,285.9 656.7,281.4 676.1,276.9 695.6,272.6 715.0,268.8 734.4,265.8 753.9,263.7 773.3,262.8 792.8,263.3 812.2,265.7 831.7,270.1 851.1,277.1 870.6,286.9 890.0,300.0" fill="none" stroke="#6b7280" stroke-width="2"/>
<polyline points="540.0,300.0 559.4,297.8 578.9,291.9 598.3,283.5 617.8,273.5 637.2,262.4 656.7,250.9 676.1,239.5 695.6,228.7 715.0,219.0 734.4,210.9 753.9,205.0 773.3,201.8 792.8,202.2 812.2,207.2 831.7,217.7 851.1,235.3 870.6,261.9 890.0,300.0" fill="none" stroke="#c0392b" stroke-width="2.5"/>

<!-- Error labels positioned safely -->
<text x="725" y="222" font-size="12" font-weight="bold" fill="#c0392b">R_in = R_pot (Δθ = 18.0°)</text>
<text x="725" y="262" font-size="12" fill="#6b7280">R_in = 3·R_pot (Δθ = 6.9°)</text>
<text x="725" y="284" font-size="12" font-weight="bold" fill="#2457d6">R_in = 10·R_pot (Δθ = 2.2°)</text>

<!-- X axis labels for error plot -->
<text x="540" y="312" text-anchor="middle" font-size="12" fill="#6b7280">0°</text>
<text x="715" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">90°</text>
<text x="890" y="312" text-anchor="middle" font-size="12" fill="#6b7280">180°</text>
<text x="715" y="323" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Похибка позиціювання Δθ(θ) [град]</text>

<!-- ==================== BOTTOM CARDS ==================== -->
<rect x="30" y="342" width="285" height="100" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<text x="42" y="360" font-size="13" font-weight="bold" fill="#2457d6">1. Фізика шунтування (R_in || R2)</text>
<text x="42" y="378" font-size="12" fill="#1a1a1a">• Опір входу R_in шунтує нижнє плече R2.</text>
<text x="42" y="396" font-size="12" fill="#1a1a1a">• R2_екв = (R2·R_in)/(R2 + R_in) &lt; R2 завжди.</text>
<text x="42" y="414" font-size="12" fill="#1a1a1a">• Вихідна напруга V_out просідає вниз.</text>
<text x="42" y="432" font-size="12" fill="#6b7280">• Максимальний прогин — при θ ≈ 90°.</text>

<rect x="330" y="342" width="290" height="100" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<text x="342" y="360" font-size="13" font-weight="bold" fill="#c0392b">2. Похибка позиціювання Δθ</text>
<text x="342" y="378" font-size="12" fill="#1a1a1a">• Зниження V_out трактується як менший кут.</text>
<text x="342" y="396" font-size="12" fill="#1a1a1a">• Сервопривод помилково довертає вал.</text>
<text x="342" y="414" font-size="12" fill="#1a1a1a">• При R_in = 10·R_pot кутова похибка 2.2°.</text>
<text x="342" y="432" font-size="12" fill="#6b7280">• При R_in = 1·R_pot похибка сягає 18.0°.</text>

<rect x="635" y="342" width="295" height="100" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<text x="647" y="360" font-size="13" font-weight="bold" fill="#27ae60">3. Інженерне узгодження</text>
<text x="647" y="378" font-size="12" fill="#1a1a1a">• Правило 100+: обирати R_in ≥ 100·R_pot.</text>
<text x="647" y="396" font-size="12" fill="#1a1a1a">• Для R_pot = 5 кОм слід брати R_in ≥ 500 кОм.</text>
<text x="647" y="414" font-size="12" fill="#1a1a1a">• Обов'язковий ОП-буфер (повторювач).</text>
<text x="647" y="432" font-size="12" fill="#6b7280">• Або калібрування корекції в прошивці MCU.</text>

</svg>
