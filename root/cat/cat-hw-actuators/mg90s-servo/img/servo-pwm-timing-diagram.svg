<svg viewBox="0 0 960 480" width="960" height="480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-both" markerWidth="9" markerHeight="9" refX="1.5" refY="4" orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Заголовок -->
  <text x="480" y="40" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма ШІМ-сигналу сервопривода</text>
  <text x="480" y="60" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Робоча смуга керування займає від 2.5% до 12.5% коефіцієнта заповнення в межах кадру 20 мс</text>

  <!-- Row 1: 0 degrees, 0.5ms -->
  <text x="100" y="125" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="end">Кут 0°</text>
  <path d="M 120 160 L 120 100 L 140 100 L 140 160 L 880 160" fill="none" stroke="#2457d6" stroke-width="3" stroke-linejoin="round"/>
  <rect x="120" y="100" width="20" height="60" fill="#eaf0fd" stroke="none"/>
  <path d="M 120 160 L 120 100 L 140 100 L 140 160 L 880 160" fill="none" stroke="#2457d6" stroke-width="3" stroke-linejoin="round"/>
  
  <line x1="120" y1="90" x2="120" y2="80" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="140" y1="90" x2="140" y2="80" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="120" y1="85" x2="140" y2="85" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-both)" marker-end="url(#arr)"/>
  <text x="150" y="89" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start">0.5 мс (2.5% заповнення)</text>

  <!-- Row 2: 90 degrees, 1.5ms -->
  <text x="100" y="245" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="end">Кут 90°</text>
  <path d="M 120 280 L 120 220 L 180 220 L 180 280 L 880 280" fill="none" stroke="#2457d6" stroke-width="3" stroke-linejoin="round"/>
  <rect x="120" y="220" width="60" height="60" fill="#eaf0fd" stroke="none"/>
  <path d="M 120 280 L 120 220 L 180 220 L 180 280 L 880 280" fill="none" stroke="#2457d6" stroke-width="3" stroke-linejoin="round"/>

  <line x1="120" y1="210" x2="120" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="180" y1="210" x2="180" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="120" y1="205" x2="180" y2="205" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-both)" marker-end="url(#arr)"/>
  <text x="190" y="209" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start">1.5 мс (7.5% заповнення)</text>

  <!-- Row 3: 180 degrees, 2.5ms -->
  <text x="100" y="365" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="end">Кут 180°</text>
  <path d="M 120 400 L 120 340 L 220 340 L 220 400 L 880 400" fill="none" stroke="#2457d6" stroke-width="3" stroke-linejoin="round"/>
  <rect x="120" y="340" width="100" height="60" fill="#eaf0fd" stroke="none"/>
  <path d="M 120 400 L 120 340 L 220 340 L 220 400 L 880 400" fill="none" stroke="#2457d6" stroke-width="3" stroke-linejoin="round"/>

  <line x1="120" y1="330" x2="120" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="220" y1="330" x2="220" y2="320" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="120" y1="325" x2="220" y2="325" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-both)" marker-end="url(#arr)"/>
  <text x="230" y="329" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="start">2.5 мс (12.5% заповнення)</text>

  <!-- X axis (20ms) -->
  <line x1="120" y1="435" x2="120" y2="445" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="880" y1="435" x2="880" y2="445" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="120" y1="440" x2="880" y2="440" stroke="#1a1a1a" stroke-width="2" marker-start="url(#arr-both)" marker-end="url(#arr)"/>
  <text x="500" y="430" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#1a1a1a" text-anchor="middle">Період кадру ШІМ: 20 мс (частота 50 Гц)</text>

  <text x="120" y="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">0 мс</text>
  <text x="880" y="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#6b7280" text-anchor="middle">20 мс</text>
</svg>
