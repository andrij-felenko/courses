<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs>
  <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,1 L7,4 L0,7 Z" fill="#1a1a1a"/>
  </marker>
  <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
  </marker>
</defs>

<rect x="0" y="0" width="960" height="460" fill="white"/>

<!-- Title & Subtitle -->
<text x="480" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Потенціометр зворотного зв'язку сервоприводу як дільник напруги</text>
<text x="480" y="46" text-anchor="middle" font-size="13" fill="#6b7280">Схема підключення до АЦП/компаратора та лінійна характеристика V_out(θ) від кута вала</text>

<!-- ==================== LEFT PANEL: SCHEMATIC ==================== -->
<rect x="35" y="75" width="435" height="250" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="35" y="75" width="435" height="28" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="252" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Схема дільника зворотного зв'язку (MG90S)</text>

<!-- +5V Power Rail -->
<line x1="125" y1="115" x2="160" y2="115" stroke="#c0392b" stroke-width="2"/>
<circle cx="125" cy="115" r="3.5" fill="#c0392b"/>
<text x="117" y="119" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">+5V (VCC)</text>

<!-- GND Bus -->
<line x1="125" y1="275" x2="310" y2="275" stroke="#1a1a1a" stroke-width="2"/>
<circle cx="125" cy="275" r="3.5" fill="#1a1a1a"/>
<text x="117" y="279" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">GND (0V)</text>

<!-- Potentiometer Body (Vertical track) -->
<line x1="160" y1="115" x2="160" y2="135" stroke="#1a1a1a" stroke-width="2"/>
<rect x="152" y="135" width="16" height="120" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="160" y1="255" x2="160" y2="275" stroke="#1a1a1a" stroke-width="2"/>
<circle cx="160" cy="275" r="3" fill="#1a1a1a"/>

<!-- Track labels -->
<text x="144" y="155" text-anchor="end" font-size="12" fill="#6b7280">R1(θ)</text>
<text x="144" y="198" text-anchor="end" font-size="13" font-weight="bold" fill="#1a1a1a">R_pot 5k</text>
<text x="144" y="240" text-anchor="end" font-size="12" fill="#6b7280">R2(θ)</text>

<!-- Wiper (contact arrow) -->
<polygon points="168,195 180,189 180,201" fill="#2457d6"/>
<line x1="180" y1="195" x2="250" y2="195" stroke="#2457d6" stroke-width="2"/>
<circle cx="250" cy="195" r="3.5" fill="#2457d6"/>

<!-- Mechanical Shaft coupling -->
<path d="M 180,190 L 195,155 L 220,155" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>
<circle cx="220" cy="155" r="3" fill="#2457d6"/>
<text x="215" y="138" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">Вал сервоприводу</text>
<text x="215" y="151" text-anchor="start" font-size="12" fill="#6b7280">θ = 0°..180°</text>

<!-- Filter Capacitor C_f (10 nF) -->
<line x1="250" y1="195" x2="250" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="238" y1="225" x2="262" y2="225" stroke="#1a1a1a" stroke-width="2"/>
<line x1="238" y1="235" x2="262" y2="235" stroke="#1a1a1a" stroke-width="2"/>
<line x1="250" y1="235" x2="250" y2="275" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="250" cy="275" r="3" fill="#1a1a1a"/>

<text x="268" y="226" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">C_f 10 нФ</text>
<text x="268" y="240" text-anchor="start" font-size="12" fill="#6b7280">фільтр шуму</text>

<!-- Wire to Servo IC -->
<line x1="250" y1="195" x2="335" y2="195" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

<!-- Servo Controller IC Box -->
<rect x="335" y="135" width="125" height="120" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<rect x="335" y="135" width="125" height="24" rx="4" fill="#eaf0fd"/>
<text x="397" y="151" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Контролер IC</text>
<text x="397" y="174" text-anchor="middle" font-size="12" fill="#1a1a1a">Вхід АЦП</text>
<text x="397" y="190" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">V_out = V(θ)</text>
<text x="397" y="208" text-anchor="middle" font-size="12" fill="#6b7280">R_fs 1M pull-down</text>
<text x="397" y="224" text-anchor="middle" font-size="12" fill="#c0392b">Захист обриву</text>
<text x="397" y="242" text-anchor="middle" font-size="12" fill="#6b7280">AA51880 / MCU</text>

<!-- ==================== RIGHT PANEL: TRANSFER PLOT ==================== -->
<rect x="495" y="75" width="430" height="250" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="495" y="75" width="430" height="28" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="710" y="94" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Графік функції перетворення V_out від кута вала</text>

<!-- Header above plot (No lines cross here) -->
<text x="508" y="116" font-size="12" font-weight="bold" fill="#1a1a1a">V_out [В]</text>
<text x="720" y="116" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Чутливість: S ≈ 25 мВ/град (лінійність &lt; 1%)</text>

<!-- Y axis labels -->
<text x="552" y="129" text-anchor="end" font-size="12" fill="#1a1a1a">5.0 В</text>
<text x="552" y="164" text-anchor="end" font-size="12" fill="#6b7280">3.75 В</text>
<text x="552" y="199" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">2.5 В</text>
<text x="552" y="234" text-anchor="end" font-size="12" fill="#6b7280">1.25 В</text>
<text x="552" y="269" text-anchor="end" font-size="12" fill="#1a1a1a">0.0 В</text>

<!-- Grid lines Y -->
<line x1="560" y1="125" x2="880" y2="125" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="2,2"/>
<line x1="560" y1="160" x2="880" y2="160" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="2,2"/>
<line x1="560" y1="195" x2="880" y2="195" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="2,2"/>
<line x1="560" y1="230" x2="880" y2="230" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="2,2"/>
<line x1="560" y1="265" x2="880" y2="265" stroke="#1a1a1a" stroke-width="1.5"/>

<!-- Grid lines X -->
<line x1="570" y1="125" x2="570" y2="265" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="645" y1="125" x2="645" y2="265" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="2,2"/>
<line x1="720" y1="125" x2="720" y2="265" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="2,2"/>
<line x1="795" y1="125" x2="795" y2="265" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="2,2"/>
<line x1="870" y1="125" x2="870" y2="265" stroke="#1a1a1a" stroke-width="1.5"/>

<!-- Dead Zones -->
<rect x="570" y="125" width="18" height="140" fill="#fdecea"/>
<text x="579" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">МЗ</text>

<rect x="852" y="125" width="18" height="140" fill="#fdecea"/>
<text x="861" y="252" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">МЗ</text>

<!-- Characteristic Line V_out(θ) -->
<line x1="570" y1="258" x2="588" y2="258" stroke="#c0392b" stroke-width="2"/>
<line x1="588" y1="258" x2="852" y2="132" stroke="#2457d6" stroke-width="3"/>
<line x1="852" y1="132" x2="870" y2="132" stroke="#c0392b" stroke-width="2"/>

<!-- Neutral Point (90°, 2.5V) -->
<circle cx="720" cy="195" r="4.5" fill="#2457d6" stroke="#ffffff" stroke-width="1.5"/>
<!-- Placed inside open cell [728..792, 198..225] where NO line passes -->
<text x="730" y="214" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">90°: 2.5 В</text>

<!-- X-axis labels -->
<text x="570" y="282" text-anchor="middle" font-size="12" fill="#6b7280">0°</text>
<text x="645" y="282" text-anchor="middle" font-size="12" fill="#6b7280">45°</text>
<text x="720" y="282" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">90°</text>
<text x="795" y="282" text-anchor="middle" font-size="12" fill="#6b7280">135°</text>
<text x="870" y="282" text-anchor="middle" font-size="12" fill="#6b7280">180°</text>
<text x="720" y="302" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Кут повороту вихідного вала сервоприводу θ</text>

<!-- ==================== BOTTOM CARDS ==================== -->
<rect x="35" y="340" width="285" height="100" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<text x="47" y="358" font-size="13" font-weight="bold" fill="#2457d6">1. Дільник напруги (5 кОм)</text>
<text x="47" y="376" font-size="12" fill="#1a1a1a">• R_pot (5 кОм) формує дільник VCC/GND.</text>
<text x="47" y="394" font-size="12" fill="#1a1a1a">• Струм доріжки: I = 5 В / 5 кОм = 1.0 мА.</text>
<text x="47" y="412" font-size="12" fill="#1a1a1a">• R_in входу АЦП (&gt; 10 МОм) усуває спад.</text>
<text x="47" y="430" font-size="12" fill="#6b7280">• Лінійний опір: R2(θ) = R_pot·(θ/180°).</text>

<rect x="335" y="340" width="290" height="100" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<text x="347" y="358" font-size="13" font-weight="bold" fill="#27ae60">2. Робочий хід і мертві зони</text>
<text x="347" y="376" font-size="12" fill="#1a1a1a">• Робочий сектор: 10°..170° (0.25..4.75 В).</text>
<text x="347" y="394" font-size="12" fill="#1a1a1a">• Чутливість виходу: S = 25.0 мВ / 1° вала.</text>
<text x="347" y="412" font-size="12" fill="#1a1a1a">• Мертві зони (МЗ) виключають КЗ повзунка.</text>
<text x="347" y="430" font-size="12" fill="#6b7280">• Механічний упор редуктора захищає край.</text>

<rect x="640" y="340" width="285" height="100" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<text x="652" y="358" font-size="13" font-weight="bold" fill="#c0392b">3. Захист від зносу та шуму</text>
<text x="652" y="376" font-size="12" fill="#1a1a1a">• Багатопелюстковий контакт знижує знос.</text>
<text x="652" y="394" font-size="12" fill="#1a1a1a">• Фільтр C_f (10 нФ) гасить брязкіт вала.</text>
<text x="652" y="412" font-size="12" fill="#1a1a1a">• R_fs (1 МОм) фіксує 0 В при обриві цепу.</text>
<text x="652" y="430" font-size="12" fill="#6b7280">• Запобігає розгону мотора у крайній упор.</text>

</svg>
