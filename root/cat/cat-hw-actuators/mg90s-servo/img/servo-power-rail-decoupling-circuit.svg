<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="28" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Схема роздільного живлення та розв'язки кіл сервопривода MG90S</text>
  <text x="480" y="48" font-size="13" text-anchor="middle" fill="#6b7280">Ізоляція логічної шини MCU від силових кидків струму, зіркове уземлення та буферний Low-ESR конденсатор</text>

  <!-- ЛІВА ПАНЕЛЬ: Принципова схема розв'язки -->
  <rect x="30" y="64" width="538" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="90" font-size="14" font-weight="700" fill="#1a1a1a">Принципова схема розв'язки живлення</text>

  <!-- Біла підкладка схеми -->
  <rect x="50" y="105" width="498" height="320" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Блок 1: Силове джерело живлення -->
  <rect x="65" y="125" width="115" height="72" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="122" y="146" font-size="13" font-weight="700" text-anchor="middle" fill="#2457d6">Джерело живлення</text>
  <text x="122" y="166" font-size="12" text-anchor="middle" fill="#1a1a1a">5.0–6.0 В DC (3 А)</text>
  <text x="122" y="184" font-size="12" text-anchor="middle" fill="#6b7280">Buck / Батарея</text>

  <!-- Блок 2: Мікроконтролер MCU -->
  <rect x="65" y="225" width="115" height="72" rx="6" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
  <text x="122" y="246" font-size="13" font-weight="700" text-anchor="middle" fill="#1a1a1a">Контролер MCU</text>
  <text x="122" y="266" font-size="12" text-anchor="middle" fill="#6b7280">Логіка 3.3 В / 5 В</text>
  <text x="122" y="284" font-size="12" text-anchor="middle" fill="#c0392b">BOD = 4.2 В</text>

  <!-- Блок 3: Сервопривід MG90S -->
  <rect x="425" y="125" width="110" height="172" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="148" font-size="13" font-weight="700" text-anchor="middle" fill="#2457d6">Сервопривід</text>
  <text x="480" y="168" font-size="13" font-weight="700" text-anchor="middle" fill="#2457d6">MG90S V2</text>
  <text x="480" y="235" font-size="12" text-anchor="middle" fill="#6b7280">I_stall ≈ 1 А</text>
  <text x="480" y="255" font-size="12" text-anchor="middle" fill="#6b7280">Роз'єм JR</text>

  <!-- Клеми сервопривода (рознесені по висоті) -->
  <circle cx="425" cy="188" r="3.5" fill="#c0392b"/>
  <text x="432" y="192" font-size="12" font-weight="700" fill="#c0392b">VCC</text>

  <circle cx="425" cy="214" r="3.5" fill="#d97706"/>
  <text x="432" y="218" font-size="12" font-weight="700" fill="#d97706">PWM</text>

  <circle cx="425" cy="285" r="3.5" fill="#1a1a1a"/>
  <text x="432" y="289" font-size="12" font-weight="700" fill="#1a1a1a">GND</text>

  <!-- ПРОВІДНИКИ ЖИВЛЕННЯ ТА СИГНАЛУ -->
  <!-- 1) Силова шина живлення +V_servo (червона) -->
  <!-- Від джерела (180, 145) горизонтально до (395, 145), потім вниз до (395, 188) -> (425, 188) -->
  <polyline points="180,145 395,145 395,188 425,188" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="180" cy="145" r="3.5" fill="#c0392b"/>
  <text x="195" y="138" font-size="12" font-weight="700" fill="#c0392b">+V_servo (5–6 В)</text>

  <!-- 2) Сигнальна лінія ШІМ (помаранчева) від MCU до сервопривода -->
  <!-- MCU пін (180, 240) -> (195, 240) -> (195, 214) -> (425, 214) -->
  <polyline points="180,240 195,240 195,214 425,214" fill="none" stroke="#d97706" stroke-width="2"/>
  <circle cx="180" cy="240" r="3.5" fill="#d97706"/>
  <text x="205" y="208" font-size="12" font-weight="700" fill="#d97706">ШІМ (лінія 50 Гц)</text>

  <!-- 3) Точка зіркового уземлення (Star Ground) біля джерела -->
  <circle cx="180" cy="180" r="5" fill="#1a1a1a"/>
  <text x="195" y="172" font-size="12" font-weight="700" fill="#1a1a1a">Зіркова точка</text>
  <text x="195" y="186" font-size="12" fill="#6b7280">(Star GND)</text>

  <!-- З'єднання з клемою мінуса джерела -->
  <line x1="180" y1="175" x2="180" y2="180" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Провідник цифрової землі до MCU -->
  <line x1="180" y1="180" x2="180" y2="275" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="180" cy="275" r="3.5" fill="#1a1a1a"/>

  <!-- Силовий зворотний провідник землі до сервопривода (Star GND -> Servo GND) -->
  <!-- Від (180, 180) вниз до (180, 285) -> (425, 285) -->
  <polyline points="180,180 180,285 425,285" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="200" y="280" font-size="12" font-weight="700" fill="#1a1a1a">GND_servo</text>

  <!-- БУФЕРНІ КОНДЕНСАТОРИ БІЛЯ СЕРВОПРИВОДА -->
  <!-- Конденсатор C1 (Електролітичний Low-ESR 470-1000 мкФ) -->
  <!-- Включений між +V (y=145) та GND (y=285) на позиції x = 320 -->
  <line x1="320" y1="145" x2="320" y2="168" stroke="#27ae60" stroke-width="1.8"/>
  <line x1="320" y1="176" x2="320" y2="285" stroke="#27ae60" stroke-width="1.8"/>
  <!-- Обкладки C1 -->
  <line x1="310" y1="168" x2="330" y2="168" stroke="#1a1a1a" stroke-width="2.2"/>
  <line x1="310" y1="176" x2="330" y2="176" stroke="#1a1a1a" stroke-width="2.2"/>
  <circle cx="320" cy="145" r="3" fill="#27ae60"/>
  <circle cx="320" cy="285" r="3" fill="#27ae60"/>

  <text x="320" y="125" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">C1: Low-ESR (470–1000 мкФ)</text>

  <!-- Конденсатор C2 (Керамічний 100 нФ) на позиції x = 365 -->
  <line x1="365" y1="145" x2="365" y2="168" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="365" y1="176" x2="365" y2="285" stroke="#6b7280" stroke-width="1.5"/>
  <!-- Обкладки C2 -->
  <line x1="357" y1="168" x2="373" y2="168" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="357" y1="176" x2="373" y2="176" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="365" cy="145" r="3" fill="#6b7280"/>
  <circle cx="365" cy="285" r="3" fill="#6b7280"/>

  <text x="365" y="138" font-size="12" font-weight="700" text-anchor="middle" fill="#6b7280">C2: 100 нФ</text>

  <!-- Підсумковий банер у нижній частині схеми -->
  <rect x="65" y="318" width="470" height="92" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="80" y="340" font-size="12" font-weight="700" fill="#27ae60">Переваги роздільного зіркового живлення:</text>
  <text x="80" y="360" font-size="12" fill="#1a1a1a">• Зворотний пусковий струм 1 А протікає виключно силовою парою шин</text>
  <text x="80" y="380" font-size="12" fill="#1a1a1a">• Конденсатор C1 віддає локальний струм за мікросекунди без просідання дроту</text>
  <text x="80" y="400" font-size="12" fill="#6b7280">• Логічна напруга MCU залишається стабільною: захист від brownout-скиду BOD</text>

  <!-- ПРАВА ПАНЕЛЬ: Інженерний аналіз -->
  <rect x="580" y="64" width="350" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="600" y="90" font-size="14" font-weight="700" fill="#1a1a1a">Інженерний аналіз кіл живлення</text>

  <!-- Картка 1: Причина Brownout -->
  <rect x="595" y="105" width="320" height="98" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="610" y="126" font-size="13" font-weight="700" fill="#c0392b">1. Причина Brownout-перезавантажень</text>
  <text x="610" y="146" font-size="12" fill="#1a1a1a">• Пусковий струм сервомотора сягає 0,8–1,0 А</text>
  <text x="610" y="166" font-size="12" fill="#1a1a1a">• Падіння напруги на дротах: ΔV = I_stall · R_wire</text>
  <text x="610" y="186" font-size="12" fill="#6b7280">• При падінні &lt; 4.2 В спрацьовує ресет компаратора BOD</text>

  <!-- Картка 2: Low-ESR конденсатор -->
  <rect x="595" y="215" width="320" height="98" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="610" y="236" font-size="13" font-weight="700" fill="#27ae60">2. Роль Low-ESR конденсатора біля серво</text>
  <text x="610" y="256" font-size="12" fill="#1a1a1a">• Миттєво віддає заряд при старті за мікросекунди</text>
  <text x="610" y="276" font-size="12" fill="#1a1a1a">• Електроліт 470–1000 мкФ стабілізує шину VCC</text>
  <text x="610" y="296" font-size="12" fill="#6b7280">• Кераміка 100 нФ фільтрує високочастотний шум щіток</text>

  <!-- Картка 3: Зіркове уземлення -->
  <rect x="595" y="325" width="320" height="98" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="610" y="346" font-size="13" font-weight="700" fill="#2457d6">3. Зіркова топологія уземлення (Star GND)</text>
  <text x="610" y="366" font-size="12" fill="#1a1a1a">• Спільна точка землі лише на виході джерела живлення</text>
  <text x="610" y="386" font-size="12" fill="#1a1a1a">• Силовий струм не створює падіння на цифровій землі</text>
  <text x="610" y="406" font-size="12" fill="#6b7280">• Запобігає зміщенню опорного нуля ШІМ і збоям логіки</text>
</svg>
