<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принципова схема роздільного живлення системи Pan-Tilt на сервоприводах MG90S</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Розділення силової та логічної ліній 5V, зіркове заземлення (Star GND) та буферизація пускових струмів</text>

  <!-- 1. БЛОК MCU (Мікроконтролер) -->
  <rect x="35" y="80" width="180" height="150" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="125" y="104" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Мікроконтролер</text>
  <text x="125" y="122" font-size="12" fill="#6b7280" text-anchor="middle">(MCU / Логіка 5V)</text>

  <rect x="155" y="136" width="50" height="20" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="180" y="150" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">GND</text>

  <rect x="135" y="166" width="70" height="20" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="170" y="180" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">GPIO 9</text>

  <rect x="135" y="196" width="70" height="20" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="170" y="210" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">GPIO 10</text>

  <!-- 2. БЛОК СИЛОВОГО ЖИВЛЕННЯ (PSU) -->
  <rect x="35" y="260" width="180" height="160" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="125" y="286" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Джерело живлення</text>
  <text x="125" y="304" font-size="12" fill="#6b7280" text-anchor="middle">(Servo PSU 5V / 3–5A)</text>
  <text x="125" y="322" font-size="12" fill="#6b7280" text-anchor="middle">Step-Down Buck</text>

  <rect x="145" y="340" width="60" height="22" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="175" y="356" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+5V</text>

  <rect x="145" y="376" width="60" height="22" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
  <text x="175" y="392" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GND</text>

  <!-- 3. ТОЧКА ЗІРКОВОГО ЗАЗЕМЛЕННЯ (Star GND) -->
  <circle cx="310" cy="387" r="14" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <circle cx="310" cy="387" r="5" fill="#27ae60"/>
  <text x="310" y="418" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Точка Star GND</text>
  <text x="310" y="434" font-size="12" fill="#6b7280" text-anchor="middle">(спільна земля)</text>

  <!-- Дріт від MCU GND до Star GND -->
  <line x1="205" y1="146" x2="310" y2="146" stroke="#2457d6" stroke-width="2"/>
  <line x1="310" y1="146" x2="310" y2="373" stroke="#2457d6" stroke-width="2"/>
  <text x="260" y="138" font-size="12" fill="#2457d6">GND MCU</text>

  <!-- Дріт від PSU GND до Star GND -->
  <line x1="205" y1="387" x2="296" y2="387" stroke="#1a1a1a" stroke-width="3"/>
  <text x="240" y="378" font-size="12" fill="#1a1a1a">GND PSU</text>

  <!-- 4. ФІЛЬТРАЦІЙНО-БУФЕРНИЙ БЛОК -->
  <rect x="365" y="80" width="290" height="340" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="510" y="106" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Буферний фільтр живлення</text>
  <text x="510" y="124" font-size="12" fill="#6b7280" text-anchor="middle">Монтаж біля роз'ємів серв</text>

  <!-- Силова шина +5V через фільтр -->
  <line x1="205" y1="351" x2="345" y2="351" stroke="#c0392b" stroke-width="3"/>
  <line x1="345" y1="351" x2="345" y2="160" stroke="#c0392b" stroke-width="3"/>
  <line x1="345" y1="160" x2="690" y2="160" stroke="#c0392b" stroke-width="3"/>
  <text x="240" y="344" font-size="12" font-weight="bold" fill="#c0392b">VCC_SERVO</text>

  <!-- Силова шина GND через фільтр -->
  <line x1="324" y1="387" x2="690" y2="387" stroke="#1a1a1a" stroke-width="3"/>
  <text x="335" y="378" font-size="12" font-weight="bold" fill="#1a1a1a">GND_SERVO</text>

  <!-- Конденсатор C1: Електролітичний 1000–2200 мкФ -->
  <line x1="405" y1="160" x2="405" y2="220" stroke="#c0392b" stroke-width="2"/>
  <!-- Обкладки C1 -->
  <line x1="390" y1="220" x2="420" y2="220" stroke="#c0392b" stroke-width="3"/>
  <text x="380" y="215" font-size="14" font-weight="bold" fill="#c0392b">+</text>
  <path d="M 390,230 Q 405,238 420,230" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="405" y1="233" x2="405" y2="387" stroke="#1a1a1a" stroke-width="2"/>
  <text x="430" y="215" font-size="13" font-weight="bold" fill="#1a1a1a">C1</text>
  <text x="430" y="233" font-size="12" font-weight="bold" fill="#c0392b">1000 мкФ</text>
  <text x="430" y="251" font-size="12" fill="#6b7280">Low-ESR</text>
  <text x="430" y="269" font-size="12" fill="#6b7280">Пуски до 1А</text>

  <!-- Конденсатор C2: Керамічний 0.1 мкФ (100 нФ) -->
  <line x1="535" y1="160" x2="535" y2="220" stroke="#c0392b" stroke-width="2"/>
  <!-- Обкладки C2 -->
  <line x1="520" y1="220" x2="550" y2="220" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="520" y1="228" x2="550" y2="228" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="535" y1="228" x2="535" y2="387" stroke="#1a1a1a" stroke-width="2"/>
  <text x="560" y="215" font-size="13" font-weight="bold" fill="#1a1a1a">C2</text>
  <text x="560" y="233" font-size="12" font-weight="bold" fill="#2457d6">0.1 мкФ</text>
  <text x="560" y="251" font-size="12" fill="#6b7280">Кераміка</text>
  <text x="560" y="269" font-size="12" fill="#6b7280">ВЧ-завади</text>

  <!-- Вузли з'єднання на шинах (dots) -->
  <circle cx="405" cy="160" r="4" fill="#c0392b"/>
  <circle cx="535" cy="160" r="4" fill="#c0392b"/>
  <circle cx="405" cy="387" r="4" fill="#1a1a1a"/>
  <circle cx="535" cy="387" r="4" fill="#1a1a1a"/>

  <!-- 5. СЕРВОПРИВОД 1: PAN (MG90S) -->
  <rect x="690" y="80" width="235" height="150" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <text x="807" y="106" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Сервопривод Pan (MG90S)</text>
  <text x="807" y="124" font-size="12" fill="#6b7280" text-anchor="middle">Горизонтальна вісь турелі</text>

  <rect x="705" y="136" width="60" height="20" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="735" y="151" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">VCC</text>

  <rect x="705" y="164" width="60" height="20" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
  <text x="735" y="179" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GND</text>

  <rect x="705" y="192" width="60" height="20" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="735" y="207" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">PWM</text>

  <!-- 6. СЕРВОПРИВОД 2: TILT (MG90S) -->
  <rect x="690" y="260" width="235" height="160" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <text x="807" y="286" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Сервопривод Tilt (MG90S)</text>
  <text x="807" y="304" font-size="12" fill="#6b7280" text-anchor="middle">Вертикальний нахил турелі</text>

  <rect x="705" y="320" width="60" height="20" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="735" y="335" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">VCC</text>

  <rect x="705" y="348" width="60" height="20" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="1"/>
  <text x="735" y="363" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GND</text>

  <rect x="705" y="376" width="60" height="20" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="735" y="391" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">PWM</text>

  <!-- З'єднання VCC до сервоприводів -->
  <line x1="690" y1="160" x2="705" y2="146" stroke="#c0392b" stroke-width="2"/>
  <circle cx="690" cy="160" r="4" fill="#c0392b"/>
  <line x1="690" y1="160" x2="690" y2="330" stroke="#c0392b" stroke-width="2"/>
  <line x1="690" y1="330" x2="705" y2="330" stroke="#c0392b" stroke-width="2"/>

  <!-- З'єднання GND до сервоприводів -->
  <line x1="690" y1="387" x2="705" y2="358" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="690" cy="387" r="4" fill="#1a1a1a"/>
  <line x1="690" y1="387" x2="680" y2="174" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="680" y1="174" x2="705" y2="174" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Сигнал PWM Pan: GPIO 9 -> Pan PWM -->
  <line x1="205" y1="176" x2="330" y2="176" stroke="#2457d6" stroke-width="2"/>
  <line x1="330" y1="176" x2="330" y2="68" stroke="#2457d6" stroke-width="2"/>
  <line x1="330" y1="68" x2="675" y2="68" stroke="#2457d6" stroke-width="2"/>
  <line x1="675" y1="68" x2="675" y2="202" stroke="#2457d6" stroke-width="2"/>
  <line x1="675" y1="202" x2="705" y2="202" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="500" y="64" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Сигнал Pan PWM (50 Гц, 500–2400 мкс)</text>

  <!-- Сигнал PWM Tilt: GPIO 10 -> Tilt PWM -->
  <line x1="205" y1="206" x2="320" y2="206" stroke="#2457d6" stroke-width="2"/>
  <line x1="320" y1="206" x2="320" y2="445" stroke="#2457d6" stroke-width="2"/>
  <line x1="320" y1="445" x2="675" y2="445" stroke="#2457d6" stroke-width="2"/>
  <line x1="675" y1="445" x2="675" y2="386" stroke="#2457d6" stroke-width="2"/>
  <line x1="675" y1="386" x2="705" y2="386" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="500" y="440" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Сигнал Tilt PWM (50 Гц, 500–2400 мкс)</text>
</svg>
