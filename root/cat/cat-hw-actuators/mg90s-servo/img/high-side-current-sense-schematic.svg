<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="30" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Схема High-Side моніторингу струму сервопривода MG90S на базі INA180</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Вимірювальний шунт 0.1 Ом у плюсовій шині 5V, підсилювач струму та фільтрація сигналу для АЦП мікроконтролера</text>

  <!-- 1. Джерело живлення 5V -->
  <rect x="30" y="78" width="115" height="105" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="87" y="102" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle">Джерело 5V</text>
  <text x="87" y="120" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">5.0 В DC</text>
  <text x="87" y="138" font-size="12" font-weight="700" fill="#6b7280" text-anchor="middle">&gt;= 2.0 A</text>
  <text x="87" y="155" font-size="12" fill="#6b7280" text-anchor="middle">Живлення</text>
  <text x="87" y="172" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">GND</text>

  <!-- Джерело GND провід вниз -->
  <line x1="87" y1="183" x2="87" y2="355" stroke="#1a1a1a" stroke-width="2"/>

  <!-- 2. Шина живлення +5V -->
  <!-- Від джерела до шунта -->
  <line x1="145" y1="100" x2="220" y2="100" stroke="#c0392b" stroke-width="2"/>
  <!-- Шунт R_shunt -->
  <rect x="220" y="88" width="65" height="24" rx="3" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="252" y="104" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">0.1 Ом</text>
  <text x="252" y="78" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">R_shunt (1%, 1 Вт)</text>
  <!-- Шина +5V після шунта -->
  <line x1="285" y1="100" x2="860" y2="100" stroke="#c0392b" stroke-width="2"/>
  <text x="350" y="92" font-size="12" font-weight="700" fill="#c0392b">Шина +5V (після шунта)</text>

  <!-- Відвід V+ живлення підсилювача INA180 -->
  <circle cx="150" cy="100" r="3" fill="#c0392b"/>
  <line x1="150" y1="100" x2="150" y2="230" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="150" y1="230" x2="185" y2="230" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Відвід IN+ (до шунта) -->
  <circle cx="205" cy="100" r="3.5" fill="#2457d6"/>
  <line x1="205" y1="100" x2="205" y2="175" stroke="#2457d6" stroke-width="1.5"/>
  <text x="198" y="140" font-size="12" font-weight="700" fill="#2457d6" text-anchor="end">IN+</text>

  <!-- Відвід IN- (після шунта) -->
  <circle cx="300" cy="100" r="3.5" fill="#2457d6"/>
  <line x1="300" y1="100" x2="300" y2="175" stroke="#2457d6" stroke-width="1.5"/>
  <text x="307" y="140" font-size="12" font-weight="700" fill="#2457d6" text-anchor="start">IN-</text>

  <!-- 3. Підсилювач струму INA180 -->
  <rect x="185" y="175" width="135" height="110" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="252" y="202" font-size="14" font-weight="700" fill="#2457d6" text-anchor="middle">INA180A1</text>
  <text x="252" y="220" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Підсилювач</text>
  <text x="252" y="237" font-size="12" fill="#6b7280" text-anchor="middle">Ku = 20 В/В</text>
  <text x="252" y="254" font-size="12" fill="#6b7280" text-anchor="middle">2.0 В при 1.0 А</text>
  <text x="252" y="271" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Висока точність</text>

  <!-- Піни INA180 всередині -->
  <text x="193" y="234" font-size="12" font-weight="700" fill="#c0392b">V+</text>
  <text x="312" y="234" font-size="12" font-weight="700" fill="#27ae60" text-anchor="end">OUT</text>

  <!-- INA180 GND -->
  <line x1="252" y1="285" x2="252" y2="355" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="252" cy="355" r="3" fill="#1a1a1a"/>
  <text x="244" y="325" font-size="12" fill="#1a1a1a" text-anchor="end">GND</text>

  <!-- 4. Фільтр низьких частот (ФНЧ) для АЦП -->
  <line x1="320" y1="230" x2="340" y2="230" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="340" y="223" width="38" height="14" rx="2" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="359" y="215" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">R 1k</text>
  <line x1="378" y1="230" x2="400" y2="230" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="400" cy="230" r="3" fill="#27ae60"/>

  <!-- Конденсатор ФНЧ -->
  <line x1="400" y1="230" x2="400" y2="265" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="390" y1="265" x2="410" y2="265" stroke="#27ae60" stroke-width="2"/>
  <line x1="390" y1="271" x2="410" y2="271" stroke="#27ae60" stroke-width="2"/>
  <line x1="400" y1="271" x2="400" y2="355" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="400" cy="355" r="3" fill="#1a1a1a"/>
  <!-- Підписи конденсатора зліва, де вільно -->
  <text x="382" y="268" font-size="12" font-weight="700" fill="#27ae60" text-anchor="end">C 100нФ</text>
  <text x="382" y="283" font-size="12" fill="#6b7280" text-anchor="end">ФНЧ 1.6кГц</text>

  <!-- Сигнал в АЦП -->
  <line x1="400" y1="230" x2="445" y2="230" stroke="#27ae60" stroke-width="1.5"/>
  <text x="422" y="215" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">V_ADC</text>

  <!-- 5. Мікроконтролер (MCU) -->
  <rect x="445" y="140" width="140" height="150" rx="6" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <text x="515" y="165" font-size="14" font-weight="700" fill="#2457d6" text-anchor="middle">Мікроконтролер</text>
  <text x="515" y="182" font-size="12" fill="#6b7280" text-anchor="middle">STM32 / ESP32</text>
  <text x="515" y="200" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">АЦП: 0..2.0 В</text>
  <text x="515" y="215" font-size="12" fill="#27ae60" text-anchor="middle">0..1.0 А струм</text>
  <text x="453" y="238" font-size="12" font-weight="700" fill="#27ae60">ADC</text>
  <text x="577" y="238" font-size="12" font-weight="700" fill="#b45309" text-anchor="end">PWM</text>
  <text x="515" y="258" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">ШІМ: 50 Гц</text>
  <text x="515" y="274" font-size="12" fill="#b45309" text-anchor="middle">500..2400 мкс</text>

  <!-- MCU GND -->
  <line x1="515" y1="290" x2="515" y2="355" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="515" cy="355" r="3" fill="#1a1a1a"/>
  <text x="507" y="325" font-size="12" fill="#1a1a1a" text-anchor="end">GND</text>

  <!-- ШІМ лінія до серво -->
  <line x1="585" y1="230" x2="640" y2="230" stroke="#b45309" stroke-width="1.5"/>
  <text x="612" y="220" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">PWM</text>

  <!-- 6. Сервопривод MG90S -->
  <rect x="640" y="130" width="145" height="160" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="712" y="156" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">Серво MG90S</text>
  <text x="712" y="174" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">V2 Metal Gear</text>
  <text x="712" y="196" font-size="12" fill="#6b7280" text-anchor="middle">Хід: ~100 мА</text>
  <text x="712" y="213" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Stall: до 1.0 А</text>
  <text x="648" y="234" font-size="12" font-weight="700" fill="#b45309">PWM</text>

  <!-- Серво VCC (+5V) зверху -->
  <circle cx="712" cy="100" r="3.5" fill="#c0392b"/>
  <line x1="712" y1="100" x2="712" y2="130" stroke="#c0392b" stroke-width="2"/>
  <text x="704" y="118" font-size="12" font-weight="700" fill="#c0392b" text-anchor="end">+5V (Черв)</text>

  <!-- Серво GND знизу -->
  <line x1="712" y1="290" x2="712" y2="355" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="712" cy="355" r="3.5" fill="#1a1a1a"/>
  <text x="704" y="325" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">GND (Корич)</text>

  <!-- 7. Буферні фільтрувальні конденсатори -->
  <rect x="805" y="75" width="130" height="270" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="870" y="93" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Фільтр живлення</text>

  <!-- Спільна шина 5V до конденсаторів зверху -->
  <line x1="815" y1="130" x2="905" y2="130" stroke="#c0392b" stroke-width="1.5"/>
  <!-- Спільна шина GND від конденсаторів знизу -->
  <line x1="815" y1="205" x2="905" y2="205" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Вертикальний спуск GND по лівому краю блоку -->
  <line x1="815" y1="205" x2="815" y2="355" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="815" cy="355" r="3" fill="#1a1a1a"/>

  <!-- Зв'язок 5V з шиною -->
  <circle cx="815" cy="100" r="3" fill="#c0392b"/>
  <line x1="815" y1="100" x2="815" y2="130" stroke="#c0392b" stroke-width="1.5"/>

  <!-- C_bulk 470 мкФ -->
  <circle cx="850" cy="130" r="2.5" fill="#c0392b"/>
  <line x1="850" y1="130" x2="850" y2="160" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="840" y1="160" x2="860" y2="160" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="840" y1="167" x2="860" y2="167" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="864" y="158" font-size="12" font-weight="700" fill="#c0392b">+</text>
  <line x1="850" y1="167" x2="850" y2="205" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="850" cy="205" r="2.5" fill="#1a1a1a"/>

  <!-- C_cer 100 нФ -->
  <circle cx="895" cy="130" r="2.5" fill="#c0392b"/>
  <line x1="895" y1="130" x2="895" y2="160" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="885" y1="160" x2="905" y2="160" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="885" y1="166" x2="905" y2="166" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="895" y1="166" x2="895" y2="205" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="895" cy="205" r="2.5" fill="#1a1a1a"/>

  <!-- Підписи конденсаторів у вільній зоні нижче y=205 -->
  <text x="874" y="230" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">470 мкФ Low-ESR</text>
  <text x="874" y="247" font-size="12" fill="#6b7280" text-anchor="middle">+ 100 нФ кераміка</text>
  <text x="874" y="268" font-size="12" fill="#6b7280" text-anchor="middle">Фільтрація піків</text>
  <text x="874" y="285" font-size="12" fill="#6b7280" text-anchor="middle">та шуму щіток</text>

  <!-- Спільна шина GND -->
  <line x1="87" y1="355" x2="860" y2="355" stroke="#1a1a1a" stroke-width="2"/>
  <text x="350" y="374" font-size="12" font-weight="700" fill="#1a1a1a">Спільна нерозривна шина GND (0 В)</text>

  <!-- Умовні позначення землі (3 риски) -->
  <line x1="77" y1="362" x2="97" y2="362" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="81" y1="366" x2="93" y2="366" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="85" y1="370" x2="89" y2="370" stroke="#1a1a1a" stroke-width="1.5"/>

  <line x1="702" y1="362" x2="722" y2="362" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="706" y1="366" x2="718" y2="366" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="710" y1="370" x2="714" y2="370" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Нижня інформаційна плашка -->
  <rect x="30" y="398" width="900" height="46" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="417" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Перевага High-Side вимірювання: збереження нерозривної та стабільної шини GND</text>
  <text x="480" y="433" font-size="12" fill="#6b7280" text-anchor="middle">Шунт у шині +5V усуває стрибки земляного потенціалу (Ground Bounce), захищаючи логіку ШІМ від спотворень при пускових струмах до 1.0 А</text>
</svg>
