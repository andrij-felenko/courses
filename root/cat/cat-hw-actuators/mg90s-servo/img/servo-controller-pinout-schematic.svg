<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Тло полотна -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 1 1 L 7 4 L 1 7 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="26" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Розпіновка та функціональні ланцюги сервоконтролера (SOP-14)</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Призначення контактів спеціалізованої ІС, вузли таймінгу, сенсорного зворотного зв'язку та H-моста</text>

  <!-- ЛІВА ПАНЕЛЬ: Принципова схема розпіновки та обв'язки -->
  <rect x="20" y="65" width="540" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="290" y="86" font-size="13" font-weight="700" fill="#1a1a1a" text-anchor="middle">Принципова схема підключення контролера</text>

  <!-- Корпус мікросхеми SOP-14 -->
  <rect x="220" y="98" width="140" height="304" rx="6" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Ключ / виїмка корпусу вгорі -->
  <path d="M 276 98 A 14 14 0 0 0 304 98" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Маркер виводу 1 (точка) -->
  <circle cx="236" cy="114" r="3.5" fill="#6b7280"/>

  <!-- Маркування мікросхеми в центрі вгорі та внизу -->
  <text x="290" y="117" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">AA51880</text>
  <text x="290" y="394" font-size="12" fill="#6b7280" text-anchor="middle">SOP-14 IC</text>

  <!-- Ніжки ліворуч (виводи 1..7, x=202..220) -->
  <rect x="202" y="126" width="18" height="8" rx="1" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>
  <rect x="202" y="166" width="18" height="8" rx="1" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>
  <rect x="202" y="206" width="18" height="8" rx="1" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>
  <rect x="202" y="246" width="18" height="8" rx="1" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>
  <rect x="202" y="286" width="18" height="8" rx="1" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>
  <rect x="202" y="326" width="18" height="8" rx="1" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>
  <rect x="202" y="366" width="18" height="8" rx="1" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>

  <!-- Ніжки праворуч (виводи 14..8, x=360..378) -->
  <rect x="360" y="126" width="18" height="8" rx="1" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>
  <rect x="360" y="166" width="18" height="8" rx="1" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>
  <rect x="360" y="206" width="18" height="8" rx="1" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>
  <rect x="360" y="246" width="18" height="8" rx="1" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>
  <rect x="360" y="286" width="18" height="8" rx="1" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>
  <rect x="360" y="326" width="18" height="8" rx="1" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>
  <rect x="360" y="366" width="18" height="8" rx="1" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>

  <!-- Текстові позначки виводів усередині корпусу -->
  <!-- Лівий ряд: номер та назва сигналу -->
  <text x="228" y="134" font-size="12" font-weight="700" fill="#2457d6">1</text>
  <text x="240" y="134" font-size="12" fill="#1a1a1a">IN</text>

  <text x="228" y="174" font-size="12" font-weight="700" fill="#2457d6">2</text>
  <text x="240" y="174" font-size="12" fill="#1a1a1a">POT_IN</text>

  <text x="228" y="214" font-size="12" font-weight="700" fill="#2457d6">3</text>
  <text x="240" y="214" font-size="12" fill="#1a1a1a">V_REF</text>

  <text x="228" y="254" font-size="12" font-weight="700" fill="#2457d6">4</text>
  <text x="240" y="254" font-size="12" fill="#1a1a1a">DEAD</text>

  <text x="228" y="294" font-size="12" font-weight="700" fill="#2457d6">5</text>
  <text x="240" y="294" font-size="12" fill="#1a1a1a">STRETCH</text>

  <text x="228" y="334" font-size="12" font-weight="700" fill="#2457d6">6</text>
  <text x="240" y="334" font-size="12" fill="#1a1a1a">OSC</text>

  <text x="228" y="374" font-size="12" font-weight="700" fill="#2457d6">7</text>
  <text x="240" y="374" font-size="12" fill="#1a1a1a">GND</text>

  <!-- Правий ряд: назва сигналу та номер -->
  <text x="338" y="134" font-size="12" fill="#1a1a1a" text-anchor="end">TEST</text>
  <text x="345" y="134" font-size="12" font-weight="700" fill="#2457d6">14</text>

  <text x="338" y="174" font-size="12" fill="#1a1a1a" text-anchor="end">N.C.</text>
  <text x="345" y="174" font-size="12" font-weight="700" fill="#2457d6">13</text>

  <text x="338" y="214" font-size="12" fill="#1a1a1a" text-anchor="end">REG</text>
  <text x="345" y="214" font-size="12" font-weight="700" fill="#2457d6">12</text>

  <text x="338" y="254" font-size="12" fill="#1a1a1a" text-anchor="end">COMP</text>
  <text x="345" y="254" font-size="12" font-weight="700" fill="#2457d6">11</text>

  <text x="338" y="294" font-size="12" fill="#1a1a1a" text-anchor="end">M+</text>
  <text x="345" y="294" font-size="12" font-weight="700" fill="#2457d6">10</text>

  <text x="338" y="334" font-size="12" fill="#1a1a1a" text-anchor="end">M−</text>
  <text x="345" y="334" font-size="12" font-weight="700" fill="#2457d6">9</text>

  <text x="338" y="374" font-size="12" fill="#1a1a1a" text-anchor="end">VCC</text>
  <text x="345" y="374" font-size="12" font-weight="700" fill="#2457d6">8</text>

  <!-- ==================== ПЕРИФЕРІЙНІ ЛАНЦЮГИ ==================== -->

  <!-- 1. Вхідний ланцюг ШІМ (Pin 1) -->
  <line x1="80" y1="130" x2="202" y2="130" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="80" cy="130" r="4" fill="#2457d6"/>
  <text x="32" y="125" font-size="12" font-weight="700" fill="#2457d6">ШІМ Вхід</text>
  <text x="32" y="141" font-size="12" fill="#6b7280">1..2 мс</text>

  <!-- 2. Ланцюг зворотного зв'язку потенціометра (Pin 2, Pin 3) -->
  <line x1="110" y1="210" x2="202" y2="210" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="125" y1="170" x2="202" y2="170" stroke="#1a1a1a" stroke-width="1.5"/>
  
  <line x1="110" y1="185" x2="110" y2="210" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="105" y="185" width="10" height="30" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="125" y1="170" x2="125" y2="200" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="125" y1="200" x2="116" y2="200" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <line x1="110" y1="215" x2="110" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  
  <text x="32" y="196" font-size="12" font-weight="700" fill="#1a1a1a">Потенціометр</text>
  <text x="32" y="212" font-size="12" fill="#6b7280">R = 5 кОм</text>

  <!-- 3. Зовнішні пасивні елементи таймінгу (Pins 4, 5, 6) -->
  <!-- Pin 4: DEADBAND -> Resistor R_db (180 k) to GND -->
  <line x1="165" y1="250" x2="202" y2="250" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="155" y="244" width="10" height="12" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="155" y1="250" x2="140" y2="250" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="136" y="245" font-size="12" fill="#1a1a1a" text-anchor="end">R_db 180к</text>

  <!-- Pin 5: STRETCH -> Capacitor C_str (33 nF) to GND -->
  <line x1="165" y1="290" x2="202" y2="290" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="165" y1="284" x2="165" y2="296" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="161" y1="284" x2="161" y2="296" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="161" y1="290" x2="140" y2="290" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="136" y="286" font-size="12" fill="#1a1a1a" text-anchor="end">C_str 33нФ</text>

  <!-- Pin 6: OSC -> Capacitor C_osc (10 nF) to GND -->
  <line x1="165" y1="330" x2="202" y2="330" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="165" y1="324" x2="165" y2="336" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="161" y1="324" x2="161" y2="336" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="161" y1="330" x2="140" y2="330" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="136" y="326" font-size="12" fill="#1a1a1a" text-anchor="end">C_osc 10нФ</text>

  <!-- Шина GND ліворуч (об'єднує низи елементів і Pin 7) -->
  <line x1="140" y1="230" x2="140" y2="370" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="110" y1="230" x2="140" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="140" y1="370" x2="202" y2="370" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="75" y1="370" x2="140" y2="370" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Символ GND -->
  <line x1="75" y1="362" x2="75" y2="378" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="70" y1="365" x2="70" y2="375" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="65" y1="368" x2="65" y2="372" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="32" y="365" font-size="12" font-weight="700" fill="#1a1a1a">GND</text>
  <text x="32" y="381" font-size="12" fill="#6b7280">Маса</text>

  <!-- 4. Виходи на мотор H-моста (Pin 10 M+, Pin 9 M-) -->
  <line x1="378" y1="290" x2="455" y2="290" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="378" y1="330" x2="455" y2="330" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Снуберний конденсатор 100 нФ між M+ та M- -->
  <line x1="415" y1="290" x2="415" y2="306" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="409" y1="306" x2="421" y2="306" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="409" y1="310" x2="421" y2="310" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="415" y1="310" x2="415" y2="330" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="426" y="312" font-size="12" fill="#1a1a1a">100нФ</text>

  <!-- Мотор DC -->
  <circle cx="485" cy="310" r="22" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="485" y="315" font-size="14" font-weight="700" fill="#2457d6" text-anchor="middle">M</text>
  <line x1="455" y1="290" x2="470" y2="293" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="455" y1="330" x2="470" y2="327" stroke="#2457d6" stroke-width="1.5"/>
  <text x="485" y="278" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Двигун DC</text>
  <text x="485" y="348" font-size="12" fill="#6b7280" text-anchor="middle">H-міст</text>

  <!-- 5. Живлення VCC (Pin 8) -->
  <line x1="378" y1="370" x2="520" y2="370" stroke="#c0392b" stroke-width="2"/>
  <circle cx="520" cy="370" r="4" fill="#c0392b"/>
  <text x="525" y="365" font-size="12" font-weight="700" fill="#c0392b">VCC</text>
  <text x="525" y="381" font-size="12" fill="#6b7280">+5 В</text>

  <!-- Фільтруючий конденсатор на лінії VCC -->
  <line x1="440" y1="370" x2="440" y2="388" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="434" y1="388" x2="446" y2="388" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="434" y1="392" x2="446" y2="392" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="440" y1="392" x2="440" y2="406" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="434" y1="406" x2="446" y2="406" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="452" y="394" font-size="12" fill="#1a1a1a">100нФ</text>

  <!-- 6. Решта виводів праворуч (Pins 11, 12, 13, 14) -->
  <line x1="378" y1="250" x2="425" y2="250" stroke="#6b7280" stroke-width="1.2"/>
  <text x="430" y="254" font-size="12" fill="#6b7280">RC контуру</text>

  <line x1="378" y1="210" x2="425" y2="210" stroke="#6b7280" stroke-width="1.2"/>
  <text x="430" y="214" font-size="12" fill="#6b7280">C_reg 100нФ</text>

  <line x1="378" y1="170" x2="415" y2="170" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="420" y="174" font-size="12" fill="#6b7280">Вільний</text>

  <line x1="378" y1="130" x2="415" y2="130" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="420" y="134" font-size="12" fill="#6b7280">Тестовий</text>


  <!-- ПРАВА ПАНЕЛЬ: Картки функціональних груп контактів -->
  <!-- Картка 1: Вхідний тракт і потенціометр -->
  <rect x="580" y="65" width="360" height="84" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="590" y="73" width="94" height="18" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="0.8"/>
  <text x="637" y="86" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Вхід і сенсор</text>
  <text x="694" y="86" font-size="13" font-weight="700" fill="#1a1a1a">Виводи 1, 2, 3</text>
  <text x="592" y="107" font-size="12" fill="#1a1a1a">· Pin 1 (IN): вхід імпульсів ШІМ 50 Гц (1.0..2.0 мс)</text>
  <text x="592" y="124" font-size="12" fill="#1a1a1a">· Pin 2 (POT_IN): напруга повзунка сенсора вала</text>
  <text x="592" y="141" font-size="12" fill="#1a1a1a">· Pin 3 (V_REF): опора +2.5 В для лінійності моста</text>

  <!-- Картка 2: Силовий драйвер мотора -->
  <rect x="580" y="159" width="360" height="84" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="590" y="167" width="102" height="18" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="0.8"/>
  <text x="641" y="180" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Силовий міст</text>
  <text x="702" y="180" font-size="13" font-weight="700" fill="#1a1a1a">Виводи 8, 9, 10</text>
  <text x="592" y="201" font-size="12" fill="#1a1a1a">· Pin 8 (VCC), Pin 7 (GND): шина живлення 4.8..6 В</text>
  <text x="592" y="218" font-size="12" fill="#1a1a1a">· Pin 9, 10 (M−, M+): виходи вбудованого H-моста</text>
  <text x="592" y="235" font-size="12" fill="#1a1a1a">· Снубер 100 нФ гасить іскріння щіток колектора</text>

  <!-- Картка 3: Таймінг та мертва зона -->
  <rect x="580" y="253" width="360" height="84" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="590" y="261" width="112" height="18" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="0.8"/>
  <text x="646" y="274" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Вузли таймінгу</text>
  <text x="712" y="274" font-size="13" font-weight="700" fill="#1a1a1a">Виводи 4, 5, 6</text>
  <text x="592" y="295" font-size="12" fill="#1a1a1a">· Pin 4 (DEAD): резистор 180 кОм мертвої зони вала</text>
  <text x="592" y="312" font-size="12" fill="#1a1a1a">· Pin 5 (STRETCH): ємність 33 нФ розтяжки імпульсу</text>
  <text x="592" y="329" font-size="12" fill="#1a1a1a">· Pin 6 (OSC): ємність 10 нФ опорного генератора</text>

  <!-- Картка 4: Рекомендації трасування друкованої плати -->
  <rect x="580" y="347" width="360" height="98" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="590" y="355" width="108" height="18" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="0.8"/>
  <text x="644" y="368" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Трасування PCB</text>
  <text x="708" y="368" font-size="13" font-weight="700" fill="#1a1a1a">Захист від завад</text>
  <text x="592" y="389" font-size="12" fill="#1a1a1a">· Розділення силової PGND і сигнальної AGND</text>
  <text x="592" y="406" font-size="12" fill="#1a1a1a">· Кераміка 100 нФ впритул до виводів VCC і GND</text>
  <text x="592" y="423" font-size="12" fill="#1a1a1a">· Захист лінії POT від наведень струмів H-моста</text>
</svg>
