<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="28" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Граф переходів скінченного автомата (FSM) стенда-калібратора сервоприводів</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Стани інтерфейсу, автоматичного калібрування, циклічного тестування та аварійного захисту від перевантаження</text>

  <!-- ==================== РЯДОК 1: СТАНИ (y: 78..190) ==================== -->

  <!-- 1. STATE_MENU (Top-Left: 45..275) -->
  <rect x="45" y="78" width="230" height="112" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="1.5"/>
  <text x="160" y="100" font-size="14" font-weight="700" fill="#2457d6" text-anchor="middle">STATE_MENU</text>
  <text x="160" y="118" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Головне меню вибору</text>
  <text x="160" y="136" font-size="12" fill="#6b7280" text-anchor="middle">Опитування енкодера</text>
  <text x="160" y="153" font-size="12" fill="#6b7280" text-anchor="middle">ШІМ вимкнено (0 мкс)</text>
  <text x="160" y="170" font-size="12" fill="#6b7280" text-anchor="middle">Очікування вибору режиму</text>

  <!-- 2. STATE_MANUAL (Top-Center: 365..595) -->
  <rect x="365" y="78" width="230" height="112" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="100" font-size="14" font-weight="700" fill="#2457d6" text-anchor="middle">STATE_MANUAL</text>
  <text x="480" y="118" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Ручне позиціонування</text>
  <text x="480" y="136" font-size="12" fill="#6b7280" text-anchor="middle">Крок енкодера: ±5 мкс</text>
  <text x="480" y="153" font-size="12" fill="#6b7280" text-anchor="middle">ШІМ: 500..2400 мкс</text>
  <text x="480" y="170" font-size="12" fill="#2457d6" text-anchor="middle">Живий струм АЦП (мА)</text>

  <!-- 3. STATE_AUTO_CALIB (Top-Right: 685..915) -->
  <rect x="685" y="78" width="230" height="112" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="800" y="100" font-size="14" font-weight="700" fill="#27ae60" text-anchor="middle">STATE_AUTO_CALIB</text>
  <text x="800" y="118" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Автопошук меж ШІМ</text>
  <text x="800" y="136" font-size="12" fill="#6b7280" text-anchor="middle">Інкремент: +2 мкс / 20 мс</text>
  <text x="800" y="153" font-size="12" fill="#6b7280" text-anchor="middle">Упор: I &gt; 800 мА (Stall)</text>
  <text x="800" y="170" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Відкат 25 мкс -&gt; EEPROM</text>

  <!-- ==================== РЯДОК 2: СТАНИ (y: 266..378) ==================== -->

  <!-- 6. STATE_FAULT_OVERLOAD (Bottom-Left: 45..275) -->
  <rect x="45" y="266" width="230" height="112" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="160" y="288" font-size="14" font-weight="700" fill="#c0392b" text-anchor="middle">STATE_FAULT_OVERLOAD</text>
  <text x="160" y="306" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Аварійний захист</text>
  <text x="160" y="324" font-size="12" fill="#1a1a1a" text-anchor="middle">ШІМ негайно вимкнено</text>
  <text x="160" y="341" font-size="12" fill="#6b7280" text-anchor="middle">Захист від заклинювання</text>
  <text x="160" y="358" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">I &gt; 1.2 A або перегрів</text>

  <!-- 5. STATE_STRESS_TEST (Bottom-Center: 365..595) -->
  <rect x="365" y="266" width="230" height="112" rx="8" fill="#fdf6ec" stroke="#b45309" stroke-width="1.5"/>
  <text x="480" y="288" font-size="14" font-weight="700" fill="#b45309" text-anchor="middle">STATE_STRESS_TEST</text>
  <text x="480" y="306" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Стрес-тест ресурсу</text>
  <text x="480" y="324" font-size="12" fill="#6b7280" text-anchor="middle">Коливання: 0° &lt;-&gt; 180°</text>
  <text x="480" y="341" font-size="12" fill="#6b7280" text-anchor="middle">Контроль температури</text>
  <text x="480" y="358" font-size="12" font-weight="700" fill="#b45309" text-anchor="middle">Лічильник циклів N++</text>

  <!-- 4. STATE_HOLD_MEASURE (Bottom-Right: 685..915) -->
  <rect x="685" y="266" width="230" height="112" rx="8" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="800" y="288" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">STATE_HOLD_MEASURE</text>
  <text x="800" y="306" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Вимірювання Deadband</text>
  <text x="800" y="324" font-size="12" fill="#6b7280" text-anchor="middle">Струм утримання I_hold</text>
  <text x="800" y="341" font-size="12" fill="#6b7280" text-anchor="middle">Мікрокроки біля центру</text>
  <text x="800" y="358" font-size="12" fill="#1a1a1a" text-anchor="middle">Поріг рушання вала</text>

  <!-- ==================== ПЕРЕХОДИ ТА СТРІЛКИ ==================== -->

  <!-- Перехід 1: MENU -> MANUAL (вправо, y=115) -->
  <line x1="275" y1="115" x2="365" y2="115" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="320" y="105" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Вибір [клік]</text>

  <!-- Перехід 2: MANUAL -> MENU (вліво, y=155) -->
  <line x1="365" y1="155" x2="275" y2="155" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="320" y="148" font-size="12" fill="#1a1a1a" text-anchor="middle">Назад [Hold]</text>

  <!-- Перехід 3: MANUAL -> AUTO_CALIB (вправо, y=135) -->
  <line x1="595" y1="135" x2="685" y2="135" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="640" y="125" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Автопошук</text>

  <!-- Перехід 4: AUTO_CALIB -> HOLD_MEASURE (вниз, x=800) -->
  <line x1="800" y1="190" x2="800" y2="266" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="790" y="222" font-size="12" font-weight="700" fill="#27ae60" text-anchor="end">Межі знайдено</text>
  <text x="790" y="238" font-size="12" fill="#6b7280" text-anchor="end">відкат backoff</text>

  <!-- Перехід 5: HOLD_MEASURE -> STRESS_TEST (вліво, y=322) -->
  <line x1="685" y1="322" x2="595" y2="322" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="640" y="312" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Старт стрес</text>

  <!-- Перехід 6: STRESS_TEST -> MANUAL (вгору, x=480) -->
  <line x1="480" y1="266" x2="480" y2="190" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="470" y="222" font-size="12" font-weight="700" fill="#2457d6" text-anchor="end">Тест завершено</text>
  <text x="470" y="238" font-size="12" fill="#6b7280" text-anchor="end">або Стоп [клік]</text>

  <!-- Перехід 7: Аварія STRESS_TEST -> FAULT_OVERLOAD (вліво, y=322) -->
  <line x1="365" y1="322" x2="275" y2="322" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="320" y="312" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">I &gt; 1.2 A</text>

  <!-- Перехід 8: FAULT_OVERLOAD -> MENU (вгору, x=160) -->
  <line x1="160" y1="266" x2="160" y2="190" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>
  <text x="170" y="222" font-size="12" font-weight="700" fill="#1a1a1a">Скидання</text>
  <text x="170" y="238" font-size="12" fill="#6b7280">клік Reset</text>

  <!-- Нижня інформаційна плашка -->
  <rect x="45" y="402" width="870" height="46" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="480" y="421" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Детермінована логіка FSM: гарантований захист металевого редуктора й обмоток двигуна</text>
  <text x="480" y="437" font-size="12" fill="#6b7280" text-anchor="middle">Аварійний стан FAULT_OVERLOAD має найвищий пріоритет і миттєво знімає ШІМ при перевищенні 1.2 А або заклинюванні</text>
</svg>
