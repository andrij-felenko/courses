<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Біла підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="27" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Осцилограма профілю споживання струму сервоприводом MG90S</text>
  <text x="480" y="47" text-anchor="middle" font-size="13" fill="#6b7280">Характерні фази струму: спокій (10 мА), пусковий стрибок (1 А), холостий хід (100 мА) та заклинювання (1 А)</text>

  <!-- ======================================================== -->
  <!-- ЛІВА ПАНЕЛЬ: Осцилограма струму споживання               -->
  <!-- ======================================================== -->
  <rect x="24" y="66" width="516" height="378" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Зони виділення фаз (фонове тонування) -->
  <rect x="120" y="145" width="35" height="235" fill="#eaf0fd" opacity="0.6"/>
  <rect x="155" y="145" width="130" height="235" fill="#e9f7ef" opacity="0.4"/>
  <rect x="350" y="145" width="135" height="235" fill="#fdecea" opacity="0.6"/>

  <!-- Вертикальні межі фаз -->
  <line x1="120" y1="145" x2="120" y2="380" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="155" y1="145" x2="155" y2="380" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="285" y1="145" x2="285" y2="380" stroke="#6b7280" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="350" y1="145" x2="350" y2="380" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 3"/>
  <line x1="485" y1="145" x2="485" y2="380" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3 3"/>

  <!-- Підписи фаз угорі осцилограми -->
  <text x="137" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Пуск</text>
  <text x="220" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Вільний рух</text>
  <text x="317" y="142" text-anchor="middle" font-size="12" fill="#6b7280">Спокій</text>
  <text x="417" y="142" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Клин (Stall)</text>

  <!-- Горизонтальна опорна лінія струму блокування (1.0 А) -->
  <line x1="85" y1="160" x2="485" y2="160" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- Осі координат -->
  <!-- Вісь X: Час t (мс) -->
  <line x1="75" y1="380" x2="510" y2="380" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="515" y="384" font-size="12" font-weight="bold" fill="#1a1a1a">t (мс)</text>

  <!-- Вісь Y: Струм I (мА) -->
  <line x1="85" y1="390" x2="85" y2="130" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="80" y="118" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">Струм I (мА)</text>

  <!-- Засічки та мітки осі Y -->
  <line x1="81" y1="160" x2="85" y2="160" stroke="#c0392b" stroke-width="1.5"/>
  <text x="78" y="164" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">1.0 А</text>

  <line x1="81" y1="270" x2="85" y2="270" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="78" y="274" text-anchor="end" font-size="12" fill="#6b7280">500</text>

  <line x1="81" y1="314" x2="85" y2="314" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="78" y="318" text-anchor="end" font-size="12" fill="#6b7280">300</text>

  <line x1="81" y1="358" x2="85" y2="358" stroke="#2457d6" stroke-width="1.5"/>
  <text x="78" y="362" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">100</text>

  <line x1="81" y1="380" x2="85" y2="380" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="78" y="384" text-anchor="end" font-size="12" fill="#1a1a1a">0</text>

  <!-- Засічки та мітки осі X -->
  <line x1="85" y1="380" x2="85" y2="384" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="85" y="398" text-anchor="middle" font-size="12" fill="#1a1a1a">0</text>

  <line x1="120" y1="380" x2="120" y2="384" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="120" y="398" text-anchor="middle" font-size="12" fill="#1a1a1a">20</text>

  <line x1="155" y1="380" x2="155" y2="384" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="155" y="398" text-anchor="middle" font-size="12" fill="#1a1a1a">40</text>

  <line x1="285" y1="380" x2="285" y2="384" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="285" y="398" text-anchor="middle" font-size="12" fill="#1a1a1a">120</text>

  <line x1="350" y1="380" x2="350" y2="384" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="350" y="398" text-anchor="middle" font-size="12" fill="#1a1a1a">160</text>

  <line x1="485" y1="380" x2="485" y2="384" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="485" y="398" text-anchor="middle" font-size="12" fill="#1a1a1a">240</text>

  <!-- ОСЦИЛОГРАМА СТРУМУ (Крива I(t)) -->
  <!-- Робоча крива: спокій -> пуск -> рух -> спокій -->
  <polyline points="85,377 120,377 125,200 127,160 132,240 138,314 146,346 155,358 165,356 175,360 185,357 195,359 205,356 215,360 225,357 235,359 245,356 255,360 265,357 275,359 285,358 295,377 350,377" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Аварійна ділянка: заклинювання вала -->
  <polyline points="350,377 355,160 485,160" fill="none" stroke="#c0392b" stroke-width="3"/>

  <!-- Текстові пояснення безпосередньо на графіку -->
  <!-- Пусковий пік -->
  <text x="137" y="125" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">I_пуск ≈ 1.0 А</text>
  <line x1="130" y1="128" x2="127" y2="155" stroke="#2457d6" stroke-width="1.2" marker-end="url(#arr-blue)"/>

  <!-- Робочий рух -->
  <text x="220" y="330" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">I_руху ≈ 80–120 мА</text>
  <text x="220" y="346" text-anchor="middle" font-size="12" fill="#6b7280">Пульсації колектора</text>

  <!-- Спокій -->
  <text x="317" y="368" text-anchor="middle" font-size="12" fill="#6b7280">≈ 12 мА</text>

  <!-- Заклинювання -->
  <text x="417" y="180" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">I_stall ≈ 0.9–1.0 А</text>
  <text x="417" y="196" text-anchor="middle" font-size="12" fill="#c0392b">Перегрів H-моста!</text>

  <!-- Підсумкова плашка внизу панелі -->
  <rect x="38" y="408" width="488" height="26" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="282" y="425" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Вимога до БЖ: запас струму ≥ 1.5–2.0 А на одне серво MG90S</text>

  <!-- ======================================================== -->
  <!-- ПРАВА ПАНЕЛЬ: Аналітичні інформаційні картки             -->
  <!-- ======================================================== -->
  <!-- Картка 1: Пусковий струм -->
  <rect x="560" y="66" width="376" height="116" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="574" y="88" font-size="13" font-weight="bold" fill="#2457d6">1. Пусковий струм (Inrush current):</text>
  <text x="574" y="108" font-size="12" fill="#1a1a1a">• Розгін ротора з нуля: швидкість ω = 0, проти-ЕРС E = 0</text>
  <text x="574" y="126" font-size="12" fill="#1a1a1a">• Опір обмотки якоря R_coil ≈ 5–6 Ом (активне навантаження)</text>
  <text x="574" y="144" font-size="12" fill="#1a1a1a">• Стрибок I = V / R до 0.9–1.0 А триває 3–8 мс</text>
  <text x="574" y="162" font-size="12" fill="#2457d6">• Необхідний локальний конденсатор 470–1000 мкФ</text>

  <!-- Картка 2: Динамічний рух -->
  <rect x="560" y="196" width="376" height="116" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="574" y="218" font-size="13" font-weight="bold" fill="#27ae60">2. Динамічний рух (Холостий хід):</text>
  <text x="574" y="238" font-size="12" fill="#1a1a1a">• З появою обертання проти-ЕРС E гасить напругу якоря</text>
  <text x="574" y="256" font-size="12" fill="#1a1a1a">• Струм падає до 80–120 мА (подолання тертя редуктора)</text>
  <text x="574" y="274" font-size="12" fill="#1a1a1a">• Пульсації на графіку — комутація ламелей колектора</text>
  <text x="574" y="292" font-size="12" fill="#27ae60">• Утримання цільової позиції споживає лише 10–15 мА</text>

  <!-- Картка 3: Заклинювання вала -->
  <rect x="560" y="326" width="376" height="118" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="574" y="348" font-size="13" font-weight="bold" fill="#c0392b">3. Струм заклинювання (Stall current):</text>
  <text x="574" y="368" font-size="12" fill="#1a1a1a">• Вал заблокований: ω = 0, проти-ЕРС падає до нуля</text>
  <text x="574" y="386" font-size="12" fill="#1a1a1a">• Повний струм блокування ~1.0 А триває безперервно</text>
  <text x="574" y="404" font-size="12" fill="#1a1a1a">• Потужність P ≈ 5 Вт перетворюється на чисте тепло</text>
  <text x="574" y="422" font-size="12" fill="#c0392b">• Ризик вигоряння ключів H-моста та деградації щіток</text>
</svg>
