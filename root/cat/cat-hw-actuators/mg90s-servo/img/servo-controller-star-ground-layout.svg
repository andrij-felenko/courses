<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs>
  <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,1 L7,4 L0,7 Z" fill="#1a1a1a"/>
  </marker>
  <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
  </marker>
  <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,1 L7,4 L0,7 Z" fill="#27ae60"/>
  </marker>
  <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
    <path d="M0,1 L7,4 L0,7 Z" fill="#c0392b"/>
  </marker>
</defs>

<rect x="0" y="0" width="960" height="460" fill="white"/>

<!-- Title & Subtitle -->
<text x="480" y="26" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Зіркоподібне розведення землі (Star Ground) контролера сервоприводу</text>
<text x="480" y="46" text-anchor="middle" font-size="13" fill="#6b7280">Розділення силової (PGND) та сигнальної (AGND) шин усуває наведення імпульсних струмів мотора й апаратний джитер</text>

<!-- ==================== LEFT PANEL: SCHEMATIC & TOPOLOGY ==================== -->
<rect x="30" y="68" width="540" height="262" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="30" y="68" width="540" height="26" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="300" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">1. Принципова схема та топологія розділення шин (Star Ground)</text>

<!-- Input Terminals on left -->
<circle cx="50" cy="115" r="3.5" fill="#c0392b"/>
<text x="42" y="112" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">+5V</text>

<circle cx="50" cy="168" r="3" fill="#2457d6"/>
<text x="42" y="165" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">ШІМ</text>

<circle cx="50" cy="205" r="3.5" fill="#1a1a1a"/>
<text x="42" y="209" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">GND</text>

<!-- Wire from connector to Bulk Cap -->
<line x1="50" y1="115" x2="100" y2="115" stroke="#c0392b" stroke-width="2"/>
<line x1="50" y1="168" x2="310" y2="168" stroke="#2457d6" stroke-width="1.5"/>
<line x1="50" y1="205" x2="100" y2="205" stroke="#1a1a1a" stroke-width="2"/>

<!-- Bulk Capacitor C_in -->
<line x1="100" y1="115" x2="100" y2="140" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="92" y1="140" x2="108" y2="140" stroke="#1a1a1a" stroke-width="2"/>
<line x1="92" y1="146" x2="108" y2="146" stroke="#1a1a1a" stroke-width="2"/>
<line x1="100" y1="146" x2="100" y2="205" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="88" y="136" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">C_вхід</text>
<text x="88" y="148" text-anchor="end" font-size="12" fill="#6b7280">100 мкФ</text>

<!-- STAR GROUND POINT at (100, 205) -->
<circle cx="100" cy="205" r="5" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="110" y="216" font-size="12" font-weight="bold" fill="#27ae60">Точка «Зірка»</text>

<!-- ==================== BRANCH 1: POWER GND (PGND) ==================== -->
<!-- Red thick trace going down and right to H-Bridge -->
<polyline points="100,205 100,265 480,265" fill="none" stroke="#c0392b" stroke-width="3"/>
<text x="290" y="279" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Силова земля PGND (струм мотора до 2 А)</text>
<line x1="410" y1="258" x2="350" y2="258" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

<!-- ==================== BRANCH 2: SIGNAL AGND ==================== -->
<!-- Green clean trace going right for sensitive circuitry -->
<polyline points="100,205 100,185 365,185" fill="none" stroke="#27ae60" stroke-width="2.5"/>
<text x="230" y="198" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Сигнальна земля AGND (чистий 0.0 В)</text>

<!-- LC Filter for Analog Supply -->
<line x1="100" y1="115" x2="140" y2="115" stroke="#2457d6" stroke-width="2"/>
<rect x="140" y="110" width="30" height="10" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="155" y="105" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">L_ф 10 мкГн</text>

<line x1="170" y1="115" x2="250" y2="115" stroke="#2457d6" stroke-width="2"/>

<!-- Filter Capacitor C_f -->
<line x1="195" y1="115" x2="195" y2="138" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="187" y1="138" x2="203" y2="138" stroke="#1a1a1a" stroke-width="2"/>
<line x1="187" y1="144" x2="203" y2="144" stroke="#1a1a1a" stroke-width="2"/>
<line x1="195" y1="144" x2="195" y2="185" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="195" cy="185" r="3" fill="#27ae60"/>
<text x="208" y="142" font-size="12" fill="#2457d6">C_ф</text>

<!-- Potentiometer R_pot -->
<rect x="243" y="125" width="14" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="235" y="148" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">R_pot</text>
<line x1="250" y1="165" x2="250" y2="185" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="250" cy="185" r="3" fill="#27ae60"/>

<!-- Wiper wire V_fb to Controller IC -->
<line x1="257" y1="145" x2="310" y2="145" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
<text x="282" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">V_fb</text>

<!-- Controller IC Box -->
<rect x="310" y="115" width="95" height="60" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
<text x="357" y="132" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Контролер IC</text>
<text x="357" y="148" text-anchor="middle" font-size="12" fill="#1a1a1a">АЦП / Логіка</text>
<text x="357" y="164" text-anchor="middle" font-size="12" fill="#27ae60">AGND Pin</text>
<line x1="357" y1="175" x2="357" y2="185" stroke="#27ae60" stroke-width="2"/>
<circle cx="357" cy="185" r="3" fill="#27ae60"/>

<!-- Raw Power V_CC wire directly to H-Bridge -->
<path d="M 100,115 L 100,98 L 415,98 L 415,115 L 435,115" fill="none" stroke="#c0392b" stroke-width="2.5"/>
<text x="260" y="94" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Пряма силова шина V_CC</text>

<!-- Gate drive lines from Controller to H-Bridge -->
<line x1="405" y1="135" x2="435" y2="135" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
<text x="420" y="130" text-anchor="middle" font-size="12" fill="#2457d6">Кер</text>

<!-- H-Bridge Box -->
<rect x="435" y="110" width="115" height="110" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="492" y="126" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Силовий H-міст</text>
<text x="492" y="140" text-anchor="middle" font-size="12" fill="#1a1a1a">4x MOSFET</text>

<!-- Motor inside H-Bridge section -->
<circle cx="492" cy="168" r="14" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="492" y="172" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">M</text>
<text x="492" y="196" text-anchor="middle" font-size="12" fill="#6b7280">C_щіток</text>

<!-- Connection from H-Bridge to PGND -->
<line x1="492" y1="220" x2="492" y2="265" stroke="#c0392b" stroke-width="3"/>
<circle cx="492" cy="265" r="3.5" fill="#c0392b"/>

<!-- Left Panel Bottom Summary -->
<text x="300" y="312" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Струм мотора повертається виключно в PGND, не зачіпаючи шину AGND</text>

<!-- ==================== RIGHT PANEL: COMMON IMPEDANCE COUPLING ==================== -->
<rect x="585" y="68" width="345" height="262" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<rect x="585" y="68" width="345" height="26" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
<text x="757" y="86" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">2. Небезпека спільної петлі (Common Impedance)</text>

<!-- Sub-block 1: Bad Chained Ground Loop -->
<rect x="598" y="102" width="318" height="96" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
<text x="757" y="119" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">ПОМИЛКА: Спільна земляна шина</text>
<text x="608" y="136" font-size="12" fill="#1a1a1a">• Опір доріжки плати: R_trace ≈ 0.05 Ом</text>
<text x="608" y="153" font-size="12" font-weight="bold" fill="#c0392b">• Стрибок: ΔV = I_mot · R_trace ≈ 75..100 мВ</text>
<text x="608" y="170" font-size="12" fill="#1a1a1a">• Зміщення опорного нуля датчика на 2%</text>
<text x="608" y="188" font-size="12" font-weight="bold" fill="#c0392b">• Наслідок: апаратний джитер вала Δθ ≈ 3°!</text>

<!-- Sub-block 2: Solution Star Ground -->
<rect x="598" y="208" width="318" height="110" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
<text x="757" y="226" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">РОЗВ'ЯЗОК: Точка «Зірка» (Star Ground)</text>
<text x="608" y="244" font-size="12" fill="#1a1a1a">• PGND та AGND розділені до виводу C_вхід</text>
<text x="608" y="262" font-size="12" font-weight="bold" fill="#27ae60">• Струм мотора не протікає по доріжці AGND</text>
<text x="608" y="280" font-size="12" fill="#1a1a1a">• Опорний нуль потенціометра стабільний (0 В)</text>
<text x="608" y="299" font-size="12" font-weight="bold" fill="#27ae60">• Повна відсутність джитеру й автоколивань</text>

<!-- ==================== BOTTOM CARDS ==================== -->
<rect x="30" y="342" width="285" height="100" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<text x="42" y="360" font-size="13" font-weight="bold" fill="#2457d6">1. Фізика паразитного зв'язку</text>
<text x="42" y="378" font-size="12" fill="#1a1a1a">• Комутація H-моста дає піки до 2.0 А.</text>
<text x="42" y="396" font-size="12" fill="#1a1a1a">• На спільній доріжці виникає падіння ΔV.</text>
<text x="42" y="414" font-size="12" fill="#1a1a1a">• Стрибок на 50 мВ зсуває нуль на 1°..2°.</text>
<text x="42" y="432" font-size="12" fill="#6b7280">• Компаратор викликає паразитний джитер.</text>

<rect x="330" y="342" width="290" height="100" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<text x="342" y="360" font-size="13" font-weight="bold" fill="#27ae60">2. Топологія точки «Зірка»</text>
<text x="342" y="378" font-size="12" fill="#1a1a1a">• Силова PGND та аналогова AGND розділені.</text>
<text x="342" y="396" font-size="12" fill="#1a1a1a">• Точка зірки — на мінусі конденсатора C_вхід.</text>
<text x="342" y="414" font-size="12" fill="#1a1a1a">• Контур струму мотора замкнений окремо.</text>
<text x="342" y="432" font-size="12" fill="#6b7280">• Сигнальний нуль ізольовано від завад.</text>

<rect x="635" y="342" width="295" height="100" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
<text x="647" y="360" font-size="13" font-weight="bold" fill="#c0392b">3. Фільтрація LC та щіток мотора</text>
<text x="647" y="378" font-size="12" fill="#1a1a1a">• LC-фільтр (10 мкГн + C_ф) живить датчик.</text>
<text x="647" y="396" font-size="12" fill="#1a1a1a">• Придушує пульсації напруги по шині VCC.</text>
<text x="647" y="414" font-size="12" fill="#1a1a1a">• Конденсатори щіток гасять іскріння ротора.</text>
<text x="647" y="432" font-size="12" fill="#6b7280">• Захищає вхід компаратора від ВЧ-завад.</text>

</svg>
