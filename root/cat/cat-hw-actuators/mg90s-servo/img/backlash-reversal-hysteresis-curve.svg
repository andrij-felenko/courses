<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-axis" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="7" markerHeight="7" refX="5" refY="2.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L5,2.5 L0,5 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Canvas background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title and subtitle -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Кутовий гістерезис редуктора MG90S та компенсація мертвої зони (Backlash)</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Усунення мертвої плями люфту (Δθ_backlash ≈ 1.2°–1.8°) шляхом динамічного додавання кутового зміщення offset при реверсі</text>

  <!-- Central coordinate plane -->
  <rect x="50" y="70" width="860" height="265" rx="6" fill="#f8fafc" stroke="#d0d7de" stroke-width="1"/>

  <!-- Grid lines (behind curves, avoid intersecting text) -->
  <line x1="140" y1="250" x2="680" y2="250" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="140" y1="205" x2="680" y2="205" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="140" y1="160" x2="680" y2="160" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="140" y1="115" x2="680" y2="115" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>

  <line x1="320" y1="100" x2="320" y2="295" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="440" y1="100" x2="440" y2="295" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="560" y1="100" x2="560" y2="295" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="680" y1="100" x2="680" y2="295" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Ideal reference line (theta_actual = theta_set) -->
  <line x1="200" y1="295" x2="680" y2="115" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Hysteresis filled area (deadband zone) -->
  <polygon points="280,265 600,145 536,145 216,265" fill="#fdecea" fill-opacity="0.6"/>

  <!-- Curve 1: Uncompensated hysteresis loop (Red) -->
  <!-- Forward branch (280,265) -> (600,145) -->
  <line x1="280" y1="265" x2="600" y2="145" stroke="#c0392b" stroke-width="2.5"/>
  <!-- Top plateau (reversal deadband) (600,145) -> (536,145) -->
  <line x1="600" y1="145" x2="536" y2="145" stroke="#c0392b" stroke-width="3.5"/>
  <!-- Reverse branch (536,145) -> (216,265) -->
  <line x1="536" y1="145" x2="216" y2="265" stroke="#c0392b" stroke-width="2.5"/>
  <!-- Bottom plateau (reversal deadband) (216,265) -> (280,265) -->
  <line x1="216" y1="265" x2="280" y2="265" stroke="#c0392b" stroke-width="3.5"/>

  <!-- Characteristic key points (circles) -->
  <circle cx="600" cy="145" r="3.5" fill="#c0392b"/>
  <circle cx="536" cy="145" r="3.5" fill="#c0392b"/>
  <circle cx="216" cy="265" r="3.5" fill="#c0392b"/>
  <circle cx="280" cy="265" r="3.5" fill="#c0392b"/>

  <!-- Direction arrows on uncompensated loop -->
  <!-- Forward arrow (up-right) -->
  <line x1="430" y1="208" x2="455" y2="199" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <!-- Top plateau arrow (left) -->
  <line x1="580" y1="145" x2="555" y2="145" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <!-- Reverse arrow (down-left) -->
  <line x1="385" y1="202" x2="360" y2="211" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <!-- Bottom plateau arrow (right) -->
  <line x1="235" y1="265" x2="260" y2="265" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>

  <!-- Curve 2: Compensated curve with offset (Green) -->
  <!-- Traces ideal line without plateau: instant gap pick-up at reversal -->
  <line x1="280" y1="265" x2="600" y2="145" stroke="#27ae60" stroke-width="2.5" stroke-dasharray="6 3"/>
  <!-- Bidirectional arrows for compensated line -->
  <line x1="480" y1="190" x2="505" y2="181" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <line x1="505" y1="181" x2="480" y2="190" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <!-- Dimension line for backlash gap Delta-theta -->
  <line x1="536" y1="128" x2="600" y2="128" stroke="#c0392b" stroke-width="1.2"/>
  <line x1="536" y1="124" x2="536" y2="132" stroke="#c0392b" stroke-width="1.2"/>
  <line x1="600" y1="124" x2="600" y2="132" stroke="#c0392b" stroke-width="1.2"/>
  <text x="568" y="122" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Δθ ≈ 1.5°</text>

  <!-- Leader lines to badges -->
  <line x1="600" y1="130" x2="615" y2="130" stroke="#c0392b" stroke-width="1.2"/>
  <line x1="570" y1="165" x2="615" y2="185" stroke="#27ae60" stroke-width="1.2"/>

  <!-- Coordinate axes -->
  <!-- X axis -->
  <line x1="140" y1="295" x2="880" y2="295" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-axis)"/>
  <!-- Y axis -->
  <line x1="140" y1="295" x2="140" y2="85" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-axis)"/>

  <!-- Axis labels -->
  <text x="150" y="93" font-size="12" font-weight="700" fill="#1a1a1a">θ_actual (°), фактичне положення вала</text>
  <text x="875" y="286" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">θ_set (°)</text>

  <!-- Y axis ticks -->
  <line x1="135" y1="295" x2="140" y2="295" stroke="#1a1a1a" stroke-width="1"/>
  <text x="128" y="299" font-size="12" fill="#6b7280" text-anchor="end">0°</text>

  <line x1="135" y1="250" x2="140" y2="250" stroke="#1a1a1a" stroke-width="1"/>
  <text x="128" y="254" font-size="12" fill="#6b7280" text-anchor="end">45°</text>

  <line x1="135" y1="205" x2="140" y2="205" stroke="#1a1a1a" stroke-width="1"/>
  <text x="128" y="209" font-size="12" fill="#6b7280" text-anchor="end">90°</text>

  <line x1="135" y1="160" x2="140" y2="160" stroke="#1a1a1a" stroke-width="1"/>
  <text x="128" y="164" font-size="12" fill="#6b7280" text-anchor="end">135°</text>

  <line x1="135" y1="115" x2="140" y2="115" stroke="#1a1a1a" stroke-width="1"/>
  <text x="128" y="119" font-size="12" fill="#6b7280" text-anchor="end">180°</text>

  <!-- X axis ticks -->
  <line x1="200" y1="295" x2="200" y2="300" stroke="#1a1a1a" stroke-width="1"/>
  <text x="200" y="314" font-size="12" fill="#6b7280" text-anchor="middle">0°</text>

  <line x1="320" y1="295" x2="320" y2="300" stroke="#1a1a1a" stroke-width="1"/>
  <text x="320" y="314" font-size="12" fill="#6b7280" text-anchor="middle">45°</text>

  <line x1="440" y1="295" x2="440" y2="300" stroke="#1a1a1a" stroke-width="1"/>
  <text x="440" y="314" font-size="12" fill="#6b7280" text-anchor="middle">90°</text>

  <line x1="560" y1="295" x2="560" y2="300" stroke="#1a1a1a" stroke-width="1"/>
  <text x="560" y="314" font-size="12" fill="#6b7280" text-anchor="middle">135°</text>

  <line x1="680" y1="295" x2="680" y2="300" stroke="#1a1a1a" stroke-width="1"/>
  <text x="680" y="314" font-size="12" fill="#6b7280" text-anchor="middle">180°</text>

  <text x="730" y="314" font-size="12" font-weight="700" fill="#6b7280">(заданий кут)</text>

  <!-- Callout badges / plaques -->
  <!-- Red badge: Backlash deadband -->
  <rect x="615" y="105" width="280" height="48" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="625" y="123" font-size="12" font-weight="700" fill="#c0392b">Зона мертвого ходу (Backlash: Δθ ≈ 1.5°)</text>
  <text x="625" y="141" font-size="12" fill="#1a1a1a">Холосте плато при зміні напрямку руху</text>

  <!-- Green badge: Compensated curve -->
  <rect x="615" y="170" width="280" height="48" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="625" y="188" font-size="12" font-weight="700" fill="#27ae60">Скомпенсована характеристика з offset</text>
  <text x="625" y="206" font-size="12" fill="#1a1a1a">Динамічна поправка: лінійний реверс</text>

  <!-- Bottom cards -->
  <!-- Card 1: Backlash nature -->
  <rect x="50" y="350" width="420" height="92" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="68" y="373" font-size="13" font-weight="700" fill="#c0392b">Природа люфту (Backlash: без компенсації)</text>
  <text x="68" y="393" font-size="12" fill="#1a1a1a">Зазор між зубами редуктора MG90S утворює мертву зону 1.2°–1.8°</text>
  <text x="68" y="411" font-size="12" fill="#1a1a1a">При зміні напрямку мотор крутить вхолосту, а вал завмирає</text>
  <text x="68" y="429" font-size="12" fill="#6b7280">Виникає горизонтальне плато затримки та петля гістерезису</text>

  <!-- Card 2: Offset software compensation -->
  <rect x="490" y="350" width="420" height="92" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="508" y="373" font-size="13" font-weight="700" fill="#27ae60">Програмна компенсація offset (з поправкою)</text>
  <text x="508" y="393" font-size="12" fill="#1a1a1a">Контролер відстежує зміну знака кутової швидкості (реверс)</text>
  <text x="508" y="411" font-size="12" fill="#1a1a1a">Миттєвий імпульс ±offset вибирає механічний зазор зачеплення</text>
  <text x="508" y="429" font-size="12" fill="#6b7280">Передача відновлюється без плато: відгук вала стає лінійним</text>
</svg>
