<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <!-- Dark arrow markers -->
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <!-- Blue arrow markers -->
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <!-- Red arrow markers -->
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Лінійна інтерполяція кута повороту MG90S у тривалість ШІМ-імпульсу</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Залежність: t_pulse(θ) = 500 мкс + θ · 11,11 мкс/° (діапазон 0°...180°)</text>

  <!-- ==================== LEFT: COORDINATE SYSTEM ==================== -->
  <!-- Y-axis title -->
  <text x="40" y="82" font-size="13" font-weight="bold" fill="#1a1a1a">Тривалість імпульсу t (мкс)</text>

  <!-- Grid lines (horizontal) -->
  <line x1="110" y1="100" x2="590" y2="100" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="110" y1="165" x2="590" y2="165" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="110" y1="230" x2="590" y2="230" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="110" y1="295" x2="590" y2="295" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="110" y1="360" x2="590" y2="360" stroke="#d0d7de" stroke-width="1"/>

  <!-- Grid lines (vertical) -->
  <line x1="110" y1="100" x2="110" y2="360" stroke="#d0d7de" stroke-width="1"/>
  <line x1="230" y1="100" x2="230" y2="360" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="350" y1="100" x2="350" y2="360" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="470" y1="100" x2="470" y2="360" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="590" y1="100" x2="590" y2="360" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Y-axis line -->
  <line x1="110" y1="365" x2="110" y2="90" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- X-axis line -->
  <line x1="105" y1="360" x2="615" y2="360" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Y-axis ticks and labels -->
  <line x1="105" y1="100" x2="110" y2="100" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="100" y="104" font-size="12" fill="#6b7280" text-anchor="end">2500</text>

  <line x1="105" y1="165" x2="110" y2="165" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="100" y="169" font-size="12" fill="#6b7280" text-anchor="end">2000</text>

  <line x1="105" y1="230" x2="110" y2="230" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="100" y="234" font-size="12" fill="#6b7280" text-anchor="end">1500</text>

  <line x1="105" y1="295" x2="110" y2="295" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="100" y="299" font-size="12" fill="#6b7280" text-anchor="end">1000</text>

  <line x1="105" y1="360" x2="110" y2="360" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="100" y="364" font-size="12" fill="#6b7280" text-anchor="end">500</text>

  <!-- X-axis ticks and labels -->
  <line x1="110" y1="360" x2="110" y2="365" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="110" y="380" font-size="12" fill="#6b7280" text-anchor="middle">0°</text>

  <line x1="230" y1="360" x2="230" y2="365" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="230" y="380" font-size="12" fill="#6b7280" text-anchor="middle">45°</text>

  <line x1="350" y1="360" x2="350" y2="365" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="350" y="380" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">90°</text>

  <line x1="470" y1="360" x2="470" y2="365" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="470" y="380" font-size="12" fill="#6b7280" text-anchor="middle">135°</text>

  <line x1="590" y1="360" x2="590" y2="365" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="590" y="380" font-size="12" fill="#6b7280" text-anchor="middle">180°</text>

  <!-- X-axis title -->
  <text x="350" y="405" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Цільовий кут повороту вихідного вала θ (градуси)</text>

  <!-- Slope Triangle (between 90° and 180°) -->
  <polygon points="350,230 590,230 590,100" fill="#eaf0fd" opacity="0.6"/>
  <line x1="350" y1="230" x2="590" y2="230" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="590" y1="230" x2="590" y2="100" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="410" y="248" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Δθ = 90°</text>
  <text x="600" y="170" font-size="12" font-weight="bold" fill="#2457d6">Δt = 1000 мкс</text>

  <!-- Interpolation Line -->
  <line x1="110" y1="360" x2="590" y2="100" stroke="#2457d6" stroke-width="3"/>

  <!-- ==================== KEY POINTS & CALLOUTS ==================== -->
  <!-- Point 1: 0° / 500 us -->
  <circle cx="110" cy="360" r="5" fill="#2457d6" stroke="white" stroke-width="2"/>
  <rect x="120" y="240" width="100" height="38" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="170" y="256" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Лівий: 0°</text>
  <text x="170" y="271" font-size="12" fill="#1a1a1a" text-anchor="middle">500 мкс (2,5%)</text>
  <line x1="145" y1="279" x2="114" y2="355" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arr-red)"/>

  <!-- Point 2: 90° / 1500 us -->
  <circle cx="350" cy="230" r="5" fill="#2457d6" stroke="white" stroke-width="2"/>
  <rect x="238" y="172" width="102" height="38" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="289" y="188" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Нейтраль: 90°</text>
  <text x="289" y="203" font-size="12" fill="#1a1a1a" text-anchor="middle">1500 мкс (7,5%)</text>
  <line x1="341" y1="205" x2="347" y2="224" stroke="#2457d6" stroke-width="1.2" marker-end="url(#arr-blue)"/>

  <!-- Point 3: 180° / 2500 us -->
  <circle cx="590" cy="100" r="5" fill="#2457d6" stroke="white" stroke-width="2"/>
  <rect x="415" y="62" width="170" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="500" y="78" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Правий упор: 180° / 2500 мкс</text>
  <line x1="570" y1="87" x2="586" y2="97" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arr-red)"/>

  <!-- Bottom Info Strip under Chart -->
  <rect x="40" y="420" width="560" height="20" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="435" font-size="12" fill="#6b7280">Діапазон: 0°...180° відповідає зміні тривалості Δt = 2000 мкс (500...2500 мкс)</text>

  <!-- ==================== RIGHT COLUMN: CARDS ==================== -->
  <!-- Card 1: Slope and Direct Formula -->
  <rect x="696" y="74" width="240" height="152" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="696" y="74" width="240" height="30" rx="6" fill="#eaf0fd"/>
  <text x="708" y="94" font-size="13" font-weight="bold" fill="#2457d6">Кутовий коефіцієнт і нахил</text>

  <text x="708" y="122" font-size="12" fill="#1a1a1a">Кутовий коефіцієнт k:</text>
  <text x="708" y="142" font-size="13" font-weight="bold" fill="#2457d6">k = 2000 мкс / 180°</text>
  <text x="708" y="162" font-size="13" font-weight="bold" fill="#2457d6">k ≈ 11,11 мкс/°</text>
  <text x="708" y="186" font-size="12" fill="#1a1a1a">Функція інтерполяції:</text>
  <text x="708" y="208" font-size="12" font-weight="bold" fill="#1a1a1a">t(θ) = 500 + 11,11 · θ [мкс]</text>

  <!-- Card 2: Inverse Formula and Calibration -->
  <rect x="696" y="238" width="240" height="152" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="696" y="238" width="240" height="30" rx="6" fill="#e9f7ef"/>
  <text x="708" y="258" font-size="13" font-weight="bold" fill="#27ae60">Обернений розрахунок</text>

  <text x="708" y="286" font-size="12" fill="#1a1a1a">Кут за тривалістю:</text>
  <text x="708" y="306" font-size="13" font-weight="bold" fill="#27ae60">θ = (t - 500) / 11,11 [°]</text>
  <text x="708" y="332" font-size="12" fill="#1a1a1a">Калібрування меж:</text>
  <text x="708" y="352" font-size="12" fill="#6b7280">t_min і t_max калібрують</text>
  <text x="708" y="370" font-size="12" fill="#6b7280">для захисту редуктора.</text>

  <!-- Right bottom note -->
  <rect x="696" y="398" width="240" height="40" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="706" y="416" font-size="12" fill="#2457d6" font-weight="bold">Зона нечутливості:</text>
  <text x="706" y="432" font-size="12" fill="#6b7280">Deadband ≈ 5 мкс (0,45°)</text>
</svg>
