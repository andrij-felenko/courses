<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Двоточкове калібрування та цифрова фільтрація сигналу зворотного зв'язку</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Компенсація кутового зсуву й масштабу за опорними точками та пригнічення шуму фільтром EMA</text>

  <!-- КОНВЕЄР СИГНАЛУ (SIGNAL FLOW) -->
  <rect x="30" y="74" width="900" height="54" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Вузол 1: Вал і дільник -->
  <rect x="42" y="82" width="156" height="38" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="120" y="97" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вал сервоприводу</text>
  <text x="120" y="112" font-size="12" fill="#6b7280" text-anchor="middle">Кут θ ∈ [-90°..+90°]</text>

  <!-- Стрілка 1 -->
  <line x1="200" y1="101" x2="226" y2="101" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Вузол 2: Модуль АЦП -->
  <rect x="228" y="82" width="144" height="38" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="300" y="97" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">1. Модуль АЦП</text>
  <text x="300" y="112" font-size="12" fill="#c0392b" text-anchor="middle">Сирий код N_ADC</text>

  <!-- Стрілка 2 -->
  <line x1="374" y1="101" x2="400" y2="101" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Вузол 3: Калібратор -->
  <rect x="402" y="82" width="160" height="38" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="482" y="97" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">2. Калібратор (a, b)</text>
  <text x="482" y="112" font-size="12" fill="#2457d6" text-anchor="middle">Кут θ_cal = a·ADC + b</text>

  <!-- Стрілка 3 -->
  <line x1="564" y1="101" x2="590" y2="101" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Вузол 4: EMA-фільтр -->
  <rect x="592" y="82" width="156" height="38" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="670" y="97" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">3. EMA-фільтр (α)</text>
  <text x="670" y="112" font-size="12" fill="#27ae60" text-anchor="middle">Згладжений кут θ_filt</text>

  <!-- Стрілка 4 -->
  <line x1="750" y1="101" x2="776" y2="101" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Вузол 5: Контур регулювання -->
  <rect x="778" y="82" width="140" height="38" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="848" y="97" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">PID-регулятор</text>
  <text x="848" y="112" font-size="12" fill="#6b7280" text-anchor="middle">Контур положення</text>

  <!-- ПАНЕЛЬ 1: ДО КАЛІБРУВАННЯ (СИРИЙ СИГНАЛ) -->
  <rect x="30" y="140" width="286" height="400" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Бейдж 1 -->
  <rect x="42" y="152" width="262" height="32" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="173" y="172" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">ЕТАП 1: Сирий сигнал АЦП</text>

  <!-- Математичний блок 1 -->
  <rect x="42" y="192" width="262" height="72" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="173" y="210" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">N_raw = floor((θ / θ_max) · 1023)</text>
  <text x="173" y="228" font-size="12" fill="#c0392b" text-anchor="middle">Зсув нуля: b_err ≈ +15° (+85 LSB)</text>
  <text x="173" y="246" font-size="12" fill="#c0392b" text-anchor="middle">Похибка масштабу: a ≠ номінал</text>

  <!-- Графік 1: До калібрування -->
  <rect x="42" y="274" width="262" height="180" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Осі та сітка графіка 1 -->
  <line x1="84" y1="294" x2="84" y2="424" stroke="#d0d7de" stroke-width="1"/>
  <line x1="84" y1="424" x2="292" y2="424" stroke="#d0d7de" stroke-width="1"/>
  <line x1="84" y1="359" x2="292" y2="359" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Позначки осі Y графіка 1 -->
  <text x="80" y="313" font-size="12" fill="#6b7280" text-anchor="end">+90°</text>
  <text x="80" y="363" font-size="12" fill="#6b7280" text-anchor="end">0°</text>
  <text x="80" y="413" font-size="12" fill="#6b7280" text-anchor="end">-90°</text>

  <!-- Підпис осі X графіка 1 -->
  <text x="188" y="444" font-size="12" fill="#6b7280" text-anchor="middle">Час t (положення вала)</text>

  <!-- Ідеальна траєкторія (пунктир) 1 -->
  <path d="M 90,409 L 120,409 L 160,359 L 210,359 L 250,309 L 286,309" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Зашумлена крива зі зсувом вгору на 18px (червона) -->
  <path d="M 90,391 L 96,388 L 101,394 L 107,389 L 113,393 L 118,387 L 124,392 L 132,382 L 140,372 L 148,362 L 154,352 L 160,341 L 167,338 L 173,344 L 179,339 L 186,343 L 192,338 L 199,343 L 205,339 L 211,342 L 219,332 L 227,322 L 235,312 L 243,302 L 250,291 L 257,288 L 263,294 L 270,289 L 276,293 L 281,288 L 286,292" fill="none" stroke="#c0392b" stroke-width="1.8"/>

  <!-- Позначки дефектів у графіку 1 -->
  <text x="92" y="310" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">Зсув: b_err = +15°</text>
  <text x="92" y="326" font-size="12" fill="#c0392b" text-anchor="start">Шум: ±15 LSB</text>
  <text x="286" y="388" font-size="12" fill="#6b7280" text-anchor="end">Похибка крайніх точок</text>
  <text x="286" y="404" font-size="12" fill="#6b7280" text-anchor="end">та дрижання вала</text>

  <!-- Підсумковий блок 1 -->
  <rect x="42" y="464" width="262" height="64" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.2"/>
  <text x="173" y="484" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Результат: НЕПРИДАТНИЙ</text>
  <text x="173" y="502" font-size="12" fill="#1a1a1a" text-anchor="middle">• Похибка нейтралі через зсув</text>
  <text x="173" y="520" font-size="12" fill="#6b7280" text-anchor="middle">• Постійний писк і нагрів мотора</text>


  <!-- ПАНЕЛЬ 2: ПІСЛЯ КАЛІБРУВАННЯ (ЛІНЕАРИЗАЦІЯ) -->
  <rect x="337" y="140" width="286" height="400" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Бейдж 2 -->
  <rect x="349" y="152" width="262" height="32" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="480" y="172" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">ЕТАП 2: Двоточкове калібрування</text>

  <!-- Математичний блок 2 -->
  <rect x="349" y="192" width="262" height="72" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="210" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">a = (θ₂ - θ₁) / (ADC₂ - ADC₁)</text>
  <text x="480" y="228" font-size="12" fill="#2457d6" text-anchor="middle">b = θ₁ - a · ADC₁  (зсув = 0°)</text>
  <text x="480" y="246" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">θ_cal = a · N_raw + b  (кут вала)</text>

  <!-- Графік 2: Після калібрування -->
  <rect x="349" y="274" width="262" height="180" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Осі та сітка графіка 2 -->
  <line x1="391" y1="294" x2="391" y2="424" stroke="#d0d7de" stroke-width="1"/>
  <line x1="391" y1="424" x2="599" y2="424" stroke="#d0d7de" stroke-width="1"/>
  <line x1="391" y1="359" x2="599" y2="359" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Позначки осі Y графіка 2 -->
  <text x="387" y="313" font-size="12" fill="#6b7280" text-anchor="end">+90°</text>
  <text x="387" y="363" font-size="12" fill="#6b7280" text-anchor="end">0°</text>
  <text x="387" y="413" font-size="12" fill="#6b7280" text-anchor="end">-90°</text>

  <!-- Підпис осі X графіка 2 -->
  <text x="495" y="444" font-size="12" fill="#6b7280" text-anchor="middle">Час t (після перерахунку)</text>

  <!-- Ідеальна траєкторія (пунктир) 2 -->
  <path d="M 397,409 L 427,409 L 467,359 L 517,359 L 557,309 L 593,309" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Зашумлена відкалібрована крива (центрована, синя) -->
  <path d="M 397,409 L 403,406 L 408,412 L 414,407 L 420,411 L 425,405 L 431,410 L 439,400 L 447,390 L 455,380 L 461,370 L 467,359 L 474,356 L 480,362 L 486,357 L 493,361 L 499,356 L 506,361 L 512,357 L 518,360 L 526,350 L 534,340 L 542,330 L 550,320 L 557,309 L 564,306 L 570,312 L 577,307 L 583,311 L 588,306 L 593,310" fill="none" stroke="#2457d6" stroke-width="1.8"/>

  <!-- Опорні точки P1 та P2 -->
  <circle cx="414" cy="409" r="4.5" fill="#2457d6" stroke="#ffffff" stroke-width="1.5"/>
  <circle cx="577" cy="309" r="4.5" fill="#2457d6" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Позначки у графіку 2 -->
  <text x="399" y="306" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">Зсув усунено: b = 0°</text>
  <text x="399" y="322" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">Масштаб вирівняно</text>
  <text x="593" y="388" font-size="12" fill="#2457d6" text-anchor="end">Опорні точки P₁, P₂</text>
  <text x="593" y="404" font-size="12" fill="#c0392b" text-anchor="end">Шум ковзача лишився</text>

  <!-- Підсумковий блок 2 -->
  <rect x="349" y="464" width="262" height="64" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
  <text x="480" y="484" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Результат: ЧАСТКОВИЙ</text>
  <text x="480" y="502" font-size="12" fill="#1a1a1a" text-anchor="middle">• Точний масштаб і нуль</text>
  <text x="480" y="520" font-size="12" fill="#c0392b" text-anchor="middle">• Дрижання вала не усунуто</text>


  <!-- ПАНЕЛЬ 3: ПІСЛЯ ФІЛЬТРАЦІЇ (EMA) -->
  <rect x="644" y="140" width="286" height="400" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Бейдж 3 -->
  <rect x="656" y="152" width="262" height="32" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="787" y="172" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">ЕТАП 3: Цифрова EMA-фільтрація</text>

  <!-- Математичний блок 3 -->
  <rect x="656" y="192" width="262" height="72" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="787" y="210" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">y[k] = α · x[k] + (1 - α) · y[k-1]</text>
  <text x="787" y="228" font-size="12" fill="#27ae60" text-anchor="middle">Коефіцієнт згладжування: α = 0.25</text>
  <text x="787" y="246" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">θ_filt = y[k]  (сигнал для PID)</text>

  <!-- Графік 3: Після EMA-фільтрації -->
  <rect x="656" y="274" width="262" height="180" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Зона нечутливості навколо нуля (deadband) -->
  <rect x="698" y="353" width="208" height="12" fill="#27ae60" opacity="0.12"/>
  <line x1="698" y1="353" x2="906" y2="353" stroke="#27ae60" stroke-width="0.8" stroke-dasharray="2 2"/>
  <line x1="698" y1="365" x2="906" y2="365" stroke="#27ae60" stroke-width="0.8" stroke-dasharray="2 2"/>

  <!-- Осі та сітка графіка 3 -->
  <line x1="698" y1="294" x2="698" y2="424" stroke="#d0d7de" stroke-width="1"/>
  <line x1="698" y1="424" x2="906" y2="424" stroke="#d0d7de" stroke-width="1"/>
  <line x1="698" y1="359" x2="906" y2="359" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Позначки осі Y графіка 3 -->
  <text x="694" y="313" font-size="12" fill="#6b7280" text-anchor="end">+90°</text>
  <text x="694" y="363" font-size="12" fill="#6b7280" text-anchor="end">0°</text>
  <text x="694" y="413" font-size="12" fill="#6b7280" text-anchor="end">-90°</text>

  <!-- Підпис осі X графіка 3 -->
  <text x="802" y="444" font-size="12" fill="#6b7280" text-anchor="middle">Час t (відфільтрований сигнал)</text>

  <!-- Ідеальна траєкторія (пунктир) 3 -->
  <path d="M 704,409 L 734,409 L 774,359 L 824,359 L 864,309 L 900,309" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- Відфільтрована чиста крива (зелена гладка) -->
  <path d="M 704,409 L 734,409 Q 742,409 754,384 T 774,359 L 824,359 Q 832,359 844,334 T 864,309 L 900,309" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Позначки у графіку 3 -->
  <text x="706" y="306" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">Шум пригнічено (EMA)</text>
  <text x="706" y="322" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">Плавний сигнал для PID</text>
  <text x="900" y="388" font-size="12" fill="#27ae60" text-anchor="end">Зона нечутливості ±δ_db</text>
  <text x="900" y="404" font-size="12" fill="#6b7280" text-anchor="end">Стабільний спокій вала</text>

  <!-- Підсумковий блок 3 -->
  <rect x="656" y="464" width="262" height="64" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.2"/>
  <text x="787" y="484" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Результат: ОПТИМАЛЬНИЙ</text>
  <text x="787" y="502" font-size="12" fill="#1a1a1a" text-anchor="middle">• Відсутність дрижання вала</text>
  <text x="787" y="520" font-size="12" fill="#27ae60" text-anchor="middle">• Точне позиціонування мотора</text>
</svg>