<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Standard arrow markers -->
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>

    <!-- Linear gradients for realistic technical styling -->
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eaf0fd"/>
      <stop offset="100%" stop-color="#d4e2fb"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Механізм потенціометричного зворотного зв'язку сервоприводу</text>
  <text x="480" y="62" text-anchor="middle" font-size="13" fill="#6b7280">Кутовий зсув вала θ змінює положення повзунка на резистивній доріжці, формуючи вихідну напругу V_out</text>

  <!-- Panel 1: Сервопривод та вал редуктора -->
  <rect x="40" y="85" width="420" height="245" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="60" y="110" font-size="14" font-weight="bold" fill="#1a1a1a">1. Сервопривод та вал редуктора</text>

  <!-- Gearbox Housing -->
  <rect x="70" y="135" width="160" height="175" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="150" y="155" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">Редуктор сервоприводу</text>
  <text x="150" y="172" text-anchor="middle" font-size="12" fill="#6b7280">(зубчаста передача)</text>

  <!-- Internal Gears -->
  <!-- Motor Pinion -->
  <circle cx="105" cy="210" r="18" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 2"/>
  <circle cx="105" cy="210" r="5" fill="#6b7280"/>

  <!-- Intermediate Gear -->
  <circle cx="125" cy="255" r="24" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 2"/>
  <circle cx="125" cy="255" r="6" fill="#6b7280"/>

  <!-- Output Gear (Servomotor Output Shaft Gear) -->
  <circle cx="150" cy="240" r="36" fill="url(#gearGrad)" stroke="#2457d6" stroke-width="2"/>
  <circle cx="150" cy="240" r="12" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="150" y="244" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Вал редуктора</text>

  <!-- Main Shaft Extension -->
  <rect x="230" y="235" width="70" height="10" rx="2" fill="#2457d6" opacity="0.85"/>
  <line x1="186" y1="240" x2="300" y2="240" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Shaft Rotation Indicator -->
  <path d="M 235 220 A 20 20 0 0 1 265 220" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <text x="250" y="205" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Кут повороту θ</text>

  <!-- Mechanical Coupling Sleeve -->
  <rect x="300" y="228" width="44" height="24" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="322" y="244" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Муфта</text>

  <!-- Coupling Connection Arrow & Label -->
  <line x1="344" y1="240" x2="490" y2="240" stroke="#2457d6" stroke-width="2" stroke-dasharray="6 3" marker-end="url(#arr-accent)"/>
  <rect x="300" y="272" width="130" height="24" rx="4" fill="#ffffff" stroke="#d0d7de"/>
  <text x="365" y="288" text-anchor="middle" font-size="12" fill="#1a1a1a">Механічний зв'язок 1:1</text>

  <!-- Panel 2: Потенціометричний датчик положення -->
  <rect x="500" y="85" width="420" height="245" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="520" y="110" font-size="14" font-weight="bold" fill="#1a1a1a">2. Потенціометричний датчик положення</text>

  <!-- Total Angle Range Arc (θ_max = 270°) -->
  <path d="M 608 277 A 88 88 0 1 1 732 277" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="670" y="125" text-anchor="middle" font-size="12" fill="#6b7280">Робочий кут θ_max (напр. 270°)</text>

  <!-- Circular Resistive Track (Outer Carbon Layer) -->
  <path d="M 624 261 A 65 65 0 1 1 716 261" fill="none" stroke="#2d3748" stroke-width="16" stroke-linecap="round"/>
  <path d="M 624 261 A 65 65 0 1 1 716 261" fill="none" stroke="#4a5568" stroke-width="12" stroke-linecap="round"/>

  <!-- Angle Segment Arc θ (from 135° to wiper position 240°) -->
  <path d="M 640 245 A 42 42 0 0 1 649 185" fill="none" stroke="#2457d6" stroke-width="2" stroke-dasharray="3 3" marker-end="url(#arr-accent)"/>
  <text x="620" y="210" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">θ</text>

  <!-- Track Section Labels R1 and R2 -->
  <text x="575" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">R_1(θ)</text>
  <text x="765" y="170" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">R_2 = R_total - R_1</text>

  <!-- Wiper Arm & Central Shaft Hub -->
  <line x1="670" y1="215" x2="638" y2="159" stroke="#2457d6" stroke-width="4" stroke-linecap="round"/>
  <circle cx="638" cy="159" r="5" fill="#2457d6"/>
  <circle cx="670" cy="215" r="14" fill="#ffffff" stroke="#2457d6" stroke-width="3"/>
  <!-- Wiper Label & Arrow -->
  <text x="580" y="142" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">Повзунок</text>
  <line x1="586" y1="145" x2="630" y2="155" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>

  <!-- Electrical Terminals & Lines -->
  <!-- GND Terminal (Left, 0V) -->
  <circle cx="624" cy="261" r="6" fill="#c0392b"/>
  <line x1="624" y1="261" x2="570" y2="300" stroke="#c0392b" stroke-width="2"/>
  <rect x="535" y="300" width="70" height="22" rx="4" fill="#fdecea" stroke="#c0392b"/>
  <text x="570" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">GND (0 V)</text>

  <!-- Vout Wiper Terminal (Center, Signal) -->
  <line x1="670" y1="229" x2="670" y2="300" stroke="#2457d6" stroke-width="2"/>
  <rect x="630" y="300" width="80" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6"/>
  <text x="670" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">V_out (АЦП)</text>

  <!-- Vcc Terminal (Right, +5V) -->
  <circle cx="716" cy="261" r="6" fill="#27ae60"/>
  <line x1="716" y1="261" x2="770" y2="300" stroke="#27ae60" stroke-width="2"/>
  <rect x="735" y="300" width="70" height="22" rx="4" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="770" y="316" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">V_cc (+5 V)</text>

  <!-- Panel 3: Математична та електрична модель дільника -->
  <rect x="40" y="345" width="880" height="95" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="60" y="368" font-size="13" font-weight="bold" fill="#2457d6">Математична модель потенціометричного зворотного зв'язку:</text>

  <!-- Block A: Вихідна напруга дільника -->
  <text x="60" y="392" font-size="12" font-weight="bold" fill="#1a1a1a">Вихідна напруга дільника:</text>
  <text x="60" y="415" font-size="13" font-weight="bold" fill="#2457d6">V_out(θ) = V_cc × (θ / θ_max)</text>

  <!-- Vertical Separator 1 -->
  <line x1="330" y1="360" x2="330" y2="430" stroke="#d0d7de" stroke-width="1"/>

  <!-- Block B: Ділення опору доріжки -->
  <text x="350" y="392" font-size="12" font-weight="bold" fill="#1a1a1a">Ділення опору доріжки:</text>
  <text x="350" y="415" font-size="13" font-weight="bold" fill="#1a1a1a">R_1(θ) / R_total = θ / θ_max</text>

  <!-- Vertical Separator 2 -->
  <line x1="630" y1="360" x2="630" y2="430" stroke="#d0d7de" stroke-width="1"/>

  <!-- Block C: Логометричний код АЦП -->
  <text x="650" y="392" font-size="12" font-weight="bold" fill="#1a1a1a">Логометричний код АЦП:</text>
  <text x="650" y="415" font-size="13" font-weight="bold" fill="#27ae60">N_ADC = N_max × (θ / θ_max)</text>
</svg>
