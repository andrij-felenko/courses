<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Капілярне залипання пелюсткового клапана в мікромасштабі</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">У субмікронному зазорі тиск Лапласа та сила меніска переважають пружність пелюстки (F_cap ≫ F_el)</text>

  <!-- ==================== LEFT PANEL: MENISCUS PHYSICS ==================== -->
  <rect x="30" y="75" width="435" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="50" y="102" font-size="14" font-weight="bold" fill="#1a1a1a">1. Утворення меніска в субмікронному зазорі</text>

  <!-- Reed upper body -->
  <rect x="50" y="118" width="395" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="247" y="136" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Тонка пружна пелюстка (кремній / поліімід, h_p ≈ 1–3 мкм)</text>

  <!-- Liquid Bridge with Concave Menisci -->
  <path d="M 120 146 Q 140 180.5 120 215 L 375 215 Q 355 180.5 375 146 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="247" y="174" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Водяний місток (конденсат)</text>
  <text x="247" y="192" font-size="12" fill="#c0392b" text-anchor="middle">ΔP_Laplace &gt; 0 (вакуумний ефект)</text>

  <!-- Meniscus annotations: gap h on the left -->
  <line x1="75" y1="163" x2="75" y2="148" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
  <line x1="75" y1="198" x2="75" y2="213" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="75" y="184" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">h ≈ 50 нм</text>

  <!-- Curvature and contact angle labels -->
  <text x="145" y="163" font-size="12" fill="#2457d6">θ &lt; 90°</text>
  <text x="325" y="163" font-size="12" fill="#2457d6">r ≈ h / 2</text>

  <!-- Valve seat lower body -->
  <rect x="50" y="215" width="395" height="32" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247" y="236" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Плоске відполіроване сідло клапана</text>

  <!-- Left Card 1: Laplace Formula -->
  <rect x="45" y="265" width="405" height="102" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="60" y="286" font-size="13" font-weight="bold" fill="#1a1a1a">Тиск Лапласа в рідинному меніску:</text>
  <text x="60" y="309" font-size="13" font-weight="bold" fill="#c0392b">ΔP = (2 · γ · cos θ) / h</text>
  <text x="60" y="331" font-size="12" fill="#6b7280">• γ = 0.073 Н/м — поверхневий натяг води / конденсату</text>
  <text x="60" y="351" font-size="12" fill="#6b7280">• θ &lt; 90° — кут змочування поверхні (змочувальний контакт)</text>

  <!-- Left Card 2: Pressure Surge -->
  <rect x="45" y="380" width="405" height="106" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="60" y="401" font-size="13" font-weight="bold" fill="#c0392b">Колосальне розрідження при h → 0:</text>
  <text x="60" y="423" font-size="12" fill="#1a1a1a">• При субмікронному зазорі h = 50 нм тиск сягає:</text>
  <text x="75" y="444" font-size="13" font-weight="bold" fill="#c0392b">ΔP ≈ 2.74 МПа  (понад 27 атмосфер розрідження!)</text>
  <text x="60" y="466" font-size="12" fill="#6b7280">• Меніск діє як мікроскопічна надпотужна присоска</text>

  <!-- ==================== RIGHT PANEL: FORCE BALANCE & STICTION ==================== -->
  <rect x="495" y="75" width="435" height="425" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="515" y="102" font-size="14" font-weight="bold" fill="#1a1a1a">2. Домінування капілярної сили та стикція</text>

  <!-- Clamp Block -->
  <rect x="515" y="135" width="30" height="85" rx="3" fill="#6b7280" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="530" y="126" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Затиск</text>

  <!-- Seat substrate -->
  <rect x="545" y="195" width="365" height="35" rx="3" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Inlet Orifice in Seat -->
  <rect x="735" y="195" width="60" height="35" fill="white" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Micropump flow arrow and label -->
  <line x1="755" y1="255" x2="755" y2="208" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="768" y="248" font-size="12" font-weight="bold" fill="#2457d6">Тиск помпи ΔP_p</text>

  <!-- Bent / Stuck Reed -->
  <path d="M 545 150 Q 640 158 680 187 L 890 187 L 890 195 L 680 195 Q 640 166 545 158 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Liquid film highlight between reed and seat -->
  <rect x="685" y="193" width="200" height="4" fill="#2457d6"/>

  <!-- Upward elastic force arrow -->
  <line x1="620" y1="178" x2="620" y2="145" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="620" y="135" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">F_el ≈ 0.002 Н</text>

  <!-- Downward capillary force arrow -->
  <line x1="710" y1="135" x2="710" y2="181" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-red)"/>
  <text x="710" y="126" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">F_cap ≈ 0.69 Н</text>

  <!-- Right Card 1: Scaling Breakdown -->
  <rect x="510" y="265" width="405" height="102" rx="6" fill="white" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="525" y="286" font-size="13" font-weight="bold" fill="#1a1a1a">Закони масштабування (Scaling Breakdown):</text>
  <text x="525" y="308" font-size="12" fill="#1a1a1a">• Пружна сила балки:  F_el ∝ E · b · (h_p / L)³  (спадає як L³)</text>
  <text x="525" y="328" font-size="12" fill="#1a1a1a">• Капілярна сила:      F_cap ∝ (γ · cos θ / h) · A  (зростає як 1/h)</text>
  <text x="525" y="348" font-size="12" fill="#6b7280">• У макро: F_el ≫ F_cap.  У мікро (MEMS): F_cap ≫ F_el у 300+ разів!</text>

  <!-- Right Card 2: Stiction Result -->
  <rect x="510" y="380" width="405" height="106" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="525" y="401" font-size="13" font-weight="bold" fill="#c0392b">Наслідок: незворотне залипання (Stiction)</text>
  <text x="525" y="423" font-size="12" fill="#1a1a1a">• F_cap (0.69 Н) повністю блокує F_el (0.002 Н) + F_act (0.01 Н)</text>
  <text x="525" y="444" font-size="12" fill="#1a1a1a">• Пелюстка намертво прилипає до сідла: клапан паралізовано</text>
  <text x="525" y="466" font-size="12" fill="#2457d6">• Розв'язок MEMS: димпли (мікроопори), гідрофобізація SAM, поліімід</text>
</svg>
