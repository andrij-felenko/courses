<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-prob-right" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-prob-left" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Header -->
  <text x="480" y="35" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Динаміка закриття пелюсткового клапана та зворотне витікання</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Затримка посадки пелюстки на сідло спричиняє зворотний перетік рідини та втрату ККД</text>

  <!-- Left Main Panel: Timing Waveforms -->
  <rect x="25" y="75" width="620" height="405" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Shaded Zone for Closing Delay Phase -->
  <rect x="320" y="104" width="150" height="344" fill="#fdecea" opacity="0.35"/>

  <!-- Vertical Phase Boundary Lines -->
  <!-- t_0 boundary -->
  <line x1="320" y1="104" x2="320" y2="448" stroke="#c0392b" stroke-dasharray="4,3" stroke-width="1.2"/>
  <text x="320" y="93" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">t_0 (реверс тиску)</text>

  <!-- t_close boundary -->
  <line x1="470" y1="104" x2="470" y2="448" stroke="#27ae60" stroke-dasharray="4,3" stroke-width="1.2"/>
  <text x="470" y="93" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">t_close (посадка)</text>

  <!-- Track 1: Pressure Differential Δp(t) -->
  <text x="38" y="125" font-size="12" font-weight="700" fill="#1a1a1a">Перепад тиску</text>
  <text x="38" y="141" font-size="12" fill="#2457d6">Δp(t) [кПа]</text>
  <text x="135" y="115" font-size="12" fill="#6b7280" text-anchor="end">+Δp</text>
  <text x="135" y="154" font-size="12" fill="#6b7280" text-anchor="end">0</text>
  <text x="135" y="180" font-size="12" fill="#6b7280" text-anchor="end">-Δp</text>

  <!-- Track 1 Zero Line -->
  <line x1="145" y1="150" x2="615" y2="150" stroke="#d0d7de" stroke-dasharray="3,3" stroke-width="1"/>

  <!-- Track 1 Curve -->
  <!-- Positive phase from 160 to 320, crossing zero at (320, 150), negative plateau at 172 to 600 -->
  <path d="M 160 120 C 220 120 260 124 285 133 C 302 140 312 146 320 150 C 330 155 350 172 380 172 L 600 172" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="320" cy="150" r="3.5" fill="#c0392b"/>
  <text x="230" y="110" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Прямий перепад (+Δp)</text>
  <text x="535" y="165" font-size="12" fill="#6b7280" text-anchor="middle">Зворотний перепад (-Δp)</text>

  <!-- Closing Delay Dimension Arrow between Track 1 and Track 2 -->
  <text x="395" y="196" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Затримка закриття Δt_close</text>
  <line x1="326" y1="205" x2="464" y2="205" stroke="#c0392b" stroke-width="1.2" marker-start="url(#arr-prob-left)" marker-end="url(#arr-prob-right)"/>

  <!-- Track 2: Reed Deflection / Gap h(t) -->
  <text x="38" y="240" font-size="12" font-weight="700" fill="#1a1a1a">Підйом пелюстки</text>
  <text x="38" y="256" font-size="12" fill="#27ae60">h(t) [мкм]</text>
  <text x="135" y="224" font-size="12" fill="#6b7280" text-anchor="end">h_max</text>
  <text x="135" y="274" font-size="12" fill="#6b7280" text-anchor="end">0 (сідло)</text>

  <!-- Track 2 Reference Lines -->
  <line x1="145" y1="220" x2="615" y2="220" stroke="#d0d7de" stroke-dasharray="3,3" stroke-width="1"/>
  <line x1="145" y1="270" x2="615" y2="270" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Track 2 Curve -->
  <!-- Open h_max at 220 until ~270, then decays past t_0 (320, 238), decelerates near seat due to squeeze-film, hits seat at (470, 270) -->
  <path d="M 160 220 L 270 220 C 290 220 305 230 320 238 C 360 258 410 268 470 270 L 600 270" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <circle cx="470" cy="270" r="3.5" fill="#27ae60"/>
  <text x="215" y="210" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Пелюстка відкрита (h = h_max)</text>
  <text x="535" y="260" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Клапан закритий (h = 0)</text>

  <!-- Track 3: Volumetric Flow Rate Q(t) -->
  <text x="38" y="350" font-size="12" font-weight="700" fill="#1a1a1a">Витрата рідини</text>
  <text x="38" y="366" font-size="12" fill="#c0392b">Q(t) [мл/хв]</text>
  <text x="135" y="334" font-size="12" fill="#6b7280" text-anchor="end">+Q</text>
  <text x="135" y="374" font-size="12" fill="#6b7280" text-anchor="end">0</text>
  <text x="135" y="412" font-size="12" fill="#6b7280" text-anchor="end">-Q</text>

  <!-- Track 3 Zero Line -->
  <line x1="145" y1="370" x2="615" y2="370" stroke="#1a1a1a" stroke-width="1.2"/>

  <!-- Backflow Shaded Region -->
  <!-- Enclosed area between zero line (y=370) and Q(t) from x=320 to x=470 -->
  <path d="M 320 370 C 345 395 375 410 405 410 C 435 410 455 390 470 370 Z" fill="#fdecea" stroke="none"/>

  <!-- Track 3 Curve -->
  <!-- Positive flow 160-320, dips negative 320-470, then zero 470-600 -->
  <path d="M 160 332 C 210 332 260 336 290 350 C 305 358 314 365 320 370 C 345 395 375 410 405 410 C 435 410 455 390 470 370 L 600 370" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="320" cy="370" r="3.5" fill="#c0392b"/>
  <circle cx="470" cy="370" r="3.5" fill="#27ae60"/>

  <text x="230" y="322" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Прямий потік (+Q)</text>
  <text x="395" y="432" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">V_back (зворотний витік)</text>
  <text x="535" y="360" font-size="12" fill="#6b7280" text-anchor="middle">Потік перекрито (Q = 0)</text>

  <!-- Bottom Time Axis -->
  <line x1="145" y1="450" x2="612" y2="450" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="620" y="454" font-size="12" font-weight="700" fill="#1a1a1a">t</text>

  <!-- Upward Ticks on Time Axis -->
  <line x1="160" y1="446" x2="160" y2="450" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="320" y1="446" x2="320" y2="450" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="470" y1="446" x2="470" y2="450" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="600" y1="446" x2="600" y2="450" stroke="#1a1a1a" stroke-width="1.2"/>

  <text x="160" y="468" font-size="12" fill="#6b7280" text-anchor="middle">0</text>
  <text x="320" y="468" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">t_0</text>
  <text x="470" y="468" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">t_close</text>
  <text x="600" y="468" font-size="12" fill="#6b7280" text-anchor="middle">T</text>

  <!-- Right Side Column: Explanatory Cards -->

  <!-- Card 1: Cycle Phases -->
  <rect x="660" y="75" width="275" height="122" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="675" y="96" font-size="13" font-weight="700" fill="#1a1a1a">Фази динамічного циклу</text>
  <text x="675" y="116" font-size="12" font-weight="700" fill="#2457d6">● [0..t_0]: Прямий потік</text>
  <text x="690" y="131" font-size="12" fill="#6b7280">Δp &gt; 0, h = h_max, Q &gt; 0</text>
  <text x="675" y="150" font-size="12" font-weight="700" fill="#c0392b">● [t_0..t_close]: Затримка закриття</text>
  <text x="690" y="165" font-size="12" fill="#6b7280">Δp &lt; 0, h &gt; 0, Q &lt; 0 (реверс)</text>
  <text x="675" y="184" font-size="12" font-weight="700" fill="#27ae60">● [t &gt; t_close]: Клапан закрито (Q = 0)</text>

  <!-- Card 2: Physical Causes -->
  <rect x="660" y="212" width="275" height="126" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="675" y="232" font-size="13" font-weight="700" fill="#c0392b">Причини затримки Δt_close</text>
  <text x="675" y="252" font-size="12" font-weight="700" fill="#1a1a1a">1. Приєднана маса рідини:</text>
  <text x="690" y="267" font-size="12" fill="#6b7280">m_eff = m_reed + m_fluid</text>
  <text x="675" y="287" font-size="12" font-weight="700" fill="#1a1a1a">2. Стиснений шар (squeeze-film):</text>
  <text x="690" y="302" font-size="12" fill="#6b7280">В'язкий опір зростає як 1/h³ при h → 0</text>
  <text x="675" y="322" font-size="12" font-weight="700" fill="#1a1a1a">3. Гідродинамічна інерція потоку</text>

  <!-- Card 3: Engineering Optimization -->
  <rect x="660" y="353" width="275" height="127" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="675" y="373" font-size="13" font-weight="700" fill="#27ae60">Наслідки та мінімізація втрат</text>
  <text x="675" y="393" font-size="12" font-weight="700" fill="#1a1a1a">Втрата об'ємного ККД:</text>
  <text x="690" y="408" font-size="12" fill="#c0392b">V_back = ∫ |Q(t)| dt → падіння η_vol</text>
  <text x="675" y="428" font-size="12" font-weight="700" fill="#1a1a1a">Шляхи скорочення затримки:</text>
  <text x="690" y="443" font-size="12" fill="#27ae60">↑ жорсткість k (вища власна частота f_0)</text>
  <text x="690" y="459" font-size="12" fill="#27ae60">↓ хід h_max (обмежувач підйому пелюстки)</text>
</svg>
