<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вузол безклейової фіксації та базування пелюсткового клапана</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Штифти dowel pins усувають кутовий перекіс, а жорстка фланка з R_clamp вирівнює контактний тиск</text>

  <!-- Left Panel: Assembly Cross-Section and Pressure Profile -->
  <rect x="25" y="75" width="445" height="440" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="247" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Поздовжній розріз вузла фіксації A-A</text>
  <text x="247" y="115" font-size="12" fill="#6b7280" text-anchor="middle">Притискна фланка з R_clamp та епюра контактного тиску</text>

  <!-- Assembly Cross-Section Elements -->
  <!-- Base Plate / Seat Body -->
  <rect x="45" y="215" width="215" height="85" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="320" y="215" width="125" height="85" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="110" y="285" font-size="12" fill="#6b7280" text-anchor="middle">Плата сідла</text>
  <text x="385" y="285" font-size="12" fill="#6b7280" text-anchor="middle">Поясок сідла</text>

  <!-- Orifice Flow Channel -->
  <line x1="290" y1="280" x2="290" y2="230" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="290" y="304" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Отвір d₀ = 1.0 мм</text>

  <!-- Dowel Pin in Cross Section (Visible part in flange, dashed in base plate) -->
  <rect x="72" y="150" width="16" height="61" fill="#eaf0fd" stroke="#1a1a1a" stroke-width="1.2"/>
  <!-- Hidden hole in base plate -->
  <line x1="72" y1="215" x2="72" y2="265" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="3 2"/>
  <line x1="88" y1="215" x2="88" y2="265" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="3 2"/>
  <line x1="72" y1="265" x2="88" y2="265" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="3 2"/>
  <line x1="80" y1="140" x2="80" y2="270" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 2 1 2"/>
  <text x="80" y="136" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Штифт Ø1.2</text>

  <!-- Clamping Screw M1.6 -->
  <rect x="150" y="140" width="26" height="10" rx="1" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.2"/>
  <!-- Screw shank in flange hole -->
  <rect x="157" y="150" width="12" height="61" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.2"/>
  <!-- Thread in base plate -->
  <line x1="157" y1="215" x2="157" y2="265" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="2 2"/>
  <line x1="169" y1="215" x2="169" y2="265" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="2 2"/>
  <line x1="157" y1="265" x2="169" y2="265" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="2 2"/>
  <line x1="163" y1="130" x2="163" y2="270" stroke="#6b7280" stroke-width="1" stroke-dasharray="4 2 1 2"/>
  <line x1="163" y1="124" x2="163" y2="136" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-black)"/>
  <text x="176" y="132" font-size="12" font-weight="bold" fill="#1a1a1a">F_bolt</text>

  <!-- Clamping Flange with Rounded Edge R_clamp -->
  <path d="M 45,150 L 225,150 L 225,195 A 16,16 0 0,1 209,211 L 45,211 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="118" y="180" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Фланка t = 2.0 мм</text>

  <!-- R_clamp Callout -->
  <polyline points="220,203 245,165 260,165" fill="none" stroke="#27ae60" stroke-width="1.2"/>
  <text x="268" y="155" font-size="12" font-weight="bold" fill="#27ae60">R_clamp ≥ 5·h</text>
  <text x="268" y="171" font-size="12" fill="#27ae60">(0.2–0.5 мм)</text>
  <text x="268" y="187" font-size="12" fill="#6b7280">Без концентратора</text>

  <!-- Flexible Reed -->
  <rect x="55" y="211" width="315" height="4" fill="#2457d6" stroke="#1a1a1a" stroke-width="0.8"/>
  <polyline points="370,213 385,190 395,190" fill="none" stroke="#2457d6" stroke-width="1.2"/>
  <text x="400" y="185" font-size="12" font-weight="bold" fill="#2457d6">Пелюстка</text>
  <text x="400" y="201" font-size="12" fill="#6b7280">h = 30 мкм</text>

  <!-- Lower Box: Pressure Profile Diagram -->
  <rect x="38" y="325" width="418" height="175" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="52" y="345" font-size="12" font-weight="bold" fill="#1a1a1a">Епюра контактного тиску затиснення p_clamp вздовж фланки</text>

  <!-- Axes -->
  <line x1="75" y1="435" x2="245" y2="435" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr-black)"/>
  <text x="248" y="440" font-size="12" fill="#1a1a1a">x</text>
  <line x1="75" y1="435" x2="75" y2="360" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr-black)"/>
  <text x="75" y="356" font-size="12" fill="#1a1a1a" text-anchor="middle">p, МПа</text>
  <line x1="70" y1="390" x2="75" y2="390" stroke="#1a1a1a" stroke-width="1"/>
  <text x="68" y="394" font-size="12" fill="#1a1a1a" text-anchor="end">20</text>
  <line x1="70" y1="435" x2="75" y2="435" stroke="#1a1a1a" stroke-width="1"/>
  <text x="68" y="439" font-size="12" fill="#1a1a1a" text-anchor="end">0</text>

  <!-- Rigid Flange Profile (Green Area) -->
  <path d="M 80,435 L 90,390 L 210,390 Q 222,395 228,435 Z" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="250" y="380" font-size="12" font-weight="bold" fill="#27ae60">Жорстка фланка (t = 2.0 мм):</text>
  <text x="250" y="396" font-size="12" fill="#27ae60">p ≈ 20 МПа, прогин δ &lt; 0.1 мкм</text>
  <text x="250" y="412" font-size="12" fill="#6b7280">Рівномірний притиск без клею</text>

  <!-- Thin Flange Profile (Red Dashed) -->
  <path d="M 80,435 Q 110,430 130,418 Q 155,378 175,418 Q 200,430 228,435" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4 3"/>
  <text x="52" y="465" font-size="12" font-weight="bold" fill="#c0392b">Тонка фланка (t = 0.5 мм):</text>
  <text x="52" y="482" font-size="12" fill="#c0392b">Прогин фланки → спад тиску p &lt; 5 МПа між гвинтами → витік рідини!</text>

  <!-- Right Panel: Datum and Anti-skew Mechanism -->
  <rect x="490" y="75" width="445" height="440" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="712" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Базування пелюстки та захист від перекосу</text>
  <text x="712" y="115" font-size="12" fill="#6b7280" text-anchor="middle">Вигляд зверху: штифти dowel pins сприймають крутний момент</text>

  <!-- Top View Assembly Box -->
  <rect x="508" y="130" width="410" height="180" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Centerline -->
  <line x1="515" y1="220" x2="910" y2="220" stroke="#6b7280" stroke-width="1" stroke-dasharray="6 3 2 3"/>

  <!-- Reed Shape Top View -->
  <path d="M 525,155 L 680,155 L 680,195 L 860,195 L 860,245 L 680,245 L 680,285 L 525,285 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Flange Outline Top View -->
  <rect x="520" y="150" width="160" height="140" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="5 3"/>
  <line x1="680" y1="150" x2="680" y2="290" stroke="#27ae60" stroke-width="2.5"/>
  <text x="680" y="145" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Лінія притиску R_clamp</text>

  <!-- Orifice under reed tip -->
  <circle cx="800" cy="220" r="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2" stroke-dasharray="3 3"/>
  <circle cx="800" cy="220" r="24" fill="none" stroke="#27ae60" stroke-width="1.2"/>
  <text x="800" y="165" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Отвір d₀ = 1.0 мм</text>
  <text x="800" y="180" font-size="12" fill="#27ae60" text-anchor="middle">Поясок seat land</text>

  <!-- Pins -->
  <!-- Pin 1: Round Hole -->
  <circle cx="550" cy="180" r="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <circle cx="550" cy="180" r="7" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="550" y="150" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Штифт 1 (Ø1.2)</text>

  <!-- Pin 2: Slot Hole -->
  <rect x="543" y="248" width="14" height="24" rx="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <circle cx="550" cy="260" r="7" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="550" y="300" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Штифт 2 (паз)</text>

  <!-- Screws -->
  <circle cx="630" cy="180" r="11" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="621" y1="180" x2="639" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 620,172 A 12,12 0 0,1 640,172" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="630" y="165" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Гвинт M1.6</text>

  <circle cx="630" cy="260" r="11" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="621" y1="260" x2="639" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="630" y="280" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Гвинт M1.6</text>

  <!-- Reaction forces -->
  <line x1="541" y1="180" x2="527" y2="180" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <line x1="559" y1="260" x2="573" y2="260" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="525" y="224" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">F_react</text>

  <!-- Anti-skew text placed nicely inside free zone -->
  <text x="740" y="270" font-size="12" font-weight="bold" fill="#27ae60">Перекіс Δθ &lt; 0.15°</text>
  <text x="740" y="286" font-size="12" fill="#6b7280">Безпечно для seat land</text>

  <!-- Lower Blocks: Specifications -->
  <!-- Card 1 -->
  <rect x="508" y="325" width="198" height="175" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="518" y="347" font-size="12" font-weight="bold" fill="#1a1a1a">Базування dowel pins</text>
  <text x="518" y="369" font-size="12" font-weight="bold" fill="#2457d6">• Штифт 1 (круглий):</text>
  <text x="528" y="385" font-size="12" fill="#1a1a1a">База X, Y (початок)</text>
  <text x="528" y="401" font-size="12" fill="#6b7280">Посадка m6 / h6</text>
  <text x="518" y="423" font-size="12" font-weight="bold" fill="#2457d6">• Штифт 2 (овальний паз):</text>
  <text x="528" y="439" font-size="12" fill="#1a1a1a">База кута θ, люфт на ΔL</text>
  <text x="528" y="455" font-size="12" fill="#6b7280">Усуває гіперстатичність</text>
  <text x="518" y="477" font-size="12" font-weight="bold" fill="#27ae60">• Сприймає момент гвинтів</text>

  <!-- Card 2 -->
  <rect x="720" y="325" width="198" height="175" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="730" y="347" font-size="12" font-weight="bold" fill="#1a1a1a">Вимоги затискання</text>
  <text x="730" y="369" font-size="12" font-weight="bold" fill="#2457d6">• Товщина t_flange:</text>
  <text x="740" y="385" font-size="12" fill="#1a1a1a">1.5–2.5 мм (AISI 316L)</text>
  <text x="740" y="401" font-size="12" fill="#6b7280">Прогин δ &lt; 0.1 мкм</text>
  <text x="730" y="423" font-size="12" font-weight="bold" fill="#2457d6">• Кромка R_clamp:</text>
  <text x="740" y="439" font-size="12" fill="#1a1a1a">R ≥ 5·h (0.2–0.5 мм)</text>
  <text x="740" y="455" font-size="12" fill="#6b7280">σ_peak менше на 45%</text>
  <text x="730" y="477" font-size="12" font-weight="bold" fill="#27ae60">• Тиск p_clamp = 20 МПа</text>
</svg>
