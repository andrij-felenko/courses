<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Гідравлічний випробувальний стенд пелюсткового клапана</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Вимірювання тиску відкриття, гідравлічного опору та зворотного витоку</text>

  <!-- Panels / Blocks -->
  <!-- Pressure Source -->
  <rect x="40" y="140" width="140" height="100" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="110" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Джерело тиску</text>
  <text x="110" y="195" text-anchor="middle" font-size="12" fill="#6b7280">Регульований</text>
  <text x="110" y="212" text-anchor="middle" font-size="12" fill="#6b7280">насос / тиск P</text>

  <!-- Flow meter / control -->
  <rect x="230" y="140" width="140" height="100" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="300" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Витратомір</text>
  <text x="300" y="195" text-anchor="middle" font-size="12" fill="#6b7280">Мікрофлюїдний</text>
  <text x="300" y="212" text-anchor="middle" font-size="12" fill="#6b7280">Q (витрата)</text>

  <!-- Test Cell / Valve fixture -->
  <rect x="420" y="120" width="180" height="140" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="510" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Тестова комірка</text>
  <text x="510" y="170" text-anchor="middle" font-size="12" fill="#1a1a1a">Пелюстковий клапан</text>
  
  <!-- Mini schematic inside test cell: sідло та пелюстка -->
  <rect x="460" y="185" width="100" height="50" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <path d="M470,210 L510,210 M520,210 L550,200" stroke="#2457d6" stroke-width="3" fill="none"/>
  <text x="510" y="225" text-anchor="middle" font-size="11" fill="#6b7280">сідло &amp; пелюстка</text>

  <!-- Differential Manometer -->
  <rect x="650" y="140" width="140" height="100" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="720" y="175" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Диф. манометр</text>
  <text x="720" y="195" text-anchor="middle" font-size="12" fill="#6b7280">Вимірювання ΔP</text>
  <text x="720" y="212" text-anchor="middle" font-size="12" fill="#6b7280">тестування герметичності</text>

  <!-- Reservoir / Drain -->
  <rect x="830" y="140" width="90" height="100" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="875" y="180" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Резервуар</text>
  <text x="875" y="200" text-anchor="middle" font-size="12" fill="#6b7280">Злив / Витік</text>

  <!-- Connectors / Piping arrows -->
  <!-- Source to Flowmeter -->
  <path d="M180,190 L222,190" stroke="#2457d6" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <text x="201" y="180" text-anchor="middle" font-size="12" fill="#2457d6">p₁</text>

  <!-- Flowmeter to Test Cell -->
  <path d="M370,190 L412,190" stroke="#2457d6" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <text x="391" y="180" text-anchor="middle" font-size="12" fill="#2457d6">Q</text>

  <!-- Test Cell to Manometer / Reservoir -->
  <path d="M600,190 L642,190" stroke="#2457d6" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>
  <text x="621" y="180" text-anchor="middle" font-size="12" fill="#2457d6">p₂</text>

  <path d="M790,190 L822,190" stroke="#2457d6" stroke-width="2.5" fill="none" marker-end="url(#arr)"/>

  <!-- Manometer taps (differential connections) -->
  <path d="M510,120 L510,95 L720,95 L720,132" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4" fill="none" marker-end="url(#arr-dark)"/>
  <text x="615" y="88" text-anchor="middle" font-size="12" fill="#6b7280">ΔP = p₁ - p₂</text>

  <!-- Bottom Data Output / Metrics Cards -->
  <rect x="230" y="300" width="150" height="90" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="305" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Тиск відкриття</text>
  <text x="305" y="355" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">P_op</text>
  <text x="305" y="375" text-anchor="middle" font-size="11" fill="#6b7280">фіксація початку потоку</text>

  <rect x="440" y="300" width="150" height="90" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="515" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Гідравлічний опір</text>
  <text x="515" y="355" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">R_hyd = ΔP / Q</text>
  <text x="515" y="375" text-anchor="middle" font-size="11" fill="#6b7280">характеристика потоку</text>

  <rect x="650" y="300" width="150" height="90" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="725" y="330" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Коеф. герметичності</text>
  <text x="725" y="355" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a1a1a">Q_leak / Q_nom</text>
  <text x="725" y="375" text-anchor="middle" font-size="11" fill="#6b7280">контроль зворотного витоку</text>

  <!-- Connecting lines to metrics -->
  <path d="M510,260 L510,285 L305,285 L305,295" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>
  <path d="M510,260 L510,295" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>
  <path d="M510,260 L510,285 L725,285 L725,295" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>

</svg>
