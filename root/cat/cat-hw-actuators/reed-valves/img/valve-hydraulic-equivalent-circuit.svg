<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Еквівалентна гідродинамічна схема пелюсткового клапана</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Послідовний опір отвору сідла та нелінійний кубічний опір щілини з кривою рівноваги</text>

  <!-- Панель схеми (зліва) -->
  <rect x="30" y="80" width="520" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="290" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Гідравлічна еквівалентна схема</text>

  <!-- Елементи схеми -->
  <!-- Вхідний тиск p_1 -->
  <text x="60" y="245" font-size="14" font-weight="bold" fill="#1a1a1a">p₁</text>
  <line x1="80" y1="240" x2="120" y2="240" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- Опір отвору сідла R_s -->
  <rect x="120" y="215" width="80" height="50" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="160" y="245" font-size="13" fill="#1a1a1a" text-anchor="middle">R_s (отвір)</text>

  <!-- Проміжний тиск p_s -->
  <line x1="200" y1="240" x2="260" y2="240" stroke="#2457d6" stroke-width="2"/>
  <text x="230" y="225" font-size="12" fill="#6b7280" text-anchor="middle">p_s</text>
  <circle cx="230" cy="240" r="3" fill="#2457d6"/>

  <!-- Нелінійний кубічний опір щілини R_v(Q) -->
  <rect x="260" y="215" width="110" height="50" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="315" y="238" font-size="12" fill="#1a1a1a" text-anchor="middle">R_v(Q) ~ Q³</text>
  <text x="315" y="254" font-size="11" fill="#6b7280" text-anchor="middle">щілина</text>

  <!-- Вихід на злив p_2 -->
  <line x1="370" y1="240" x2="430" y2="240" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="445" y="245" font-size="14" font-weight="bold" fill="#1a1a1a">p₂ (0)</text>

  <!-- Пояснення внизу схеми -->
  <rect x="50" y="300" width="480" height="110" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="70" y="325" font-size="13" font-weight="bold" fill="#1a1a1a">Рівняння балансу тисків:</text>
  <text x="70" y="350" font-size="13" fill="#1a1a1a">Δp = p₁ - p₂ = Δp_s + Δp_v</text>
  <text x="70" y="375" font-size="12" fill="#6b7280">Δp_s = R_s · Q  (лінійний опір)</text>
  <text x="70" y="395" font-size="12" fill="#6b7280">Δp_v = R_v(h) · Q³  (гідравлічна щілина)</text>

  <!-- Панель графіку (справа) -->
  <rect x="570" y="80" width="360" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="750" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Крива рівноваги</text>

  <!-- Осі графіку -->
  <line x1="610" y1="370" x2="890" y2="370" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="610" y1="370" x2="610" y2="130" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="890" y="390" font-size="12" fill="#1a1a1a" text-anchor="middle">Витрата Q</text>
  <text x="590" y="130" font-size="12" fill="#1a1a1a" text-anchor="middle">Тиск p</text>

  <!-- Крива пружних сил та гідравлічного моменту -->
  <!-- Пружна сила балки (лінійна) -->
  <line x1="610" y1="370" x2="850" y2="180" stroke="#27ae60" stroke-width="2"/>
  <text x="760" y="255" font-size="12" font-weight="bold" fill="#27ae60">Пружна сила F_el</text>

  <!-- Гідравлічна сила (нелінійна кубічна) -->
  <path d="M 610 370 Q 720 365 850 150" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <text x="780" y="335" font-size="12" font-weight="bold" fill="#2457d6">Гідравлічна сила F_hyd</text>

  <!-- Точка стабільної рівноваги -->
  <circle cx="760" cy="245" r="5" fill="#c0392b"/>
  <text x="760" y="215" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Робоча точка</text>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>
</svg>
