<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#d0d7de" stroke-width="1.5"/>
    </pattern>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <text x="480" y="35" text-anchor="middle" font-weight="bold" font-size="18" fill="#1a1a1a">Пелюстковий клапан: робочі стани та герметизація</text>
  <text x="480" y="55" text-anchor="middle" font-size="13" fill="#6b7280">Омивання відкритої пелюстки потоком (ліворуч) та лінія ущільнення при закритті (праворуч)</text>

  <!-- Left Panel -->
  <rect x="40" y="80" width="420" height="340" fill="#f4f6f8" rx="8" stroke="#d0d7de" stroke-width="1"/>
  
  <text x="250" y="110" text-anchor="middle" font-weight="bold" font-size="14" fill="#1a1a1a">Відкритий стан: прямий потік</text>
  <text x="250" y="130" text-anchor="middle" fill="#2457d6" font-size="13">P<tspan dy="2" font-size="11">in</tspan><tspan dy="-2"> &gt; P</tspan><tspan dy="2" font-size="11">out</tspan></text>

  <path d="M 80 316 L 200 316 C 250 316, 300 252, 360 242 L 360 210 L 80 210 Z" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 80 320 L 200 320 L 200 380 L 80 380 Z" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 280 320 L 400 320 L 400 380 L 280 380 Z" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="2"/>
  
  <path d="M 80 318 L 200 318 C 250 318, 300 252, 360 242" fill="none" stroke="#1a1a1a" stroke-width="4"/>

  <path d="M 218 395 L 218 320 C 218 298, 238 288, 270 288 L 330 288" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <path d="M 262 395 L 262 320 C 262 280, 280 262, 310 262 L 380 262" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <text x="140" y="180" fill="#6b7280" font-size="12" text-anchor="middle">Обмежувач ходу</text>
  <path d="M 140 185 L 140 210" fill="none" stroke="#6b7280" stroke-width="1" marker-end="url(#arr-gray)"/>
  
  <text x="380" y="230" fill="#1a1a1a" font-size="12" text-anchor="middle">Пелюстка</text>
  <path d="M 380 235 L 362 242" fill="none" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr-black)"/>
  
  <text x="140" y="410" fill="#6b7280" font-size="12" text-anchor="middle">Сідло клапана</text>
  <path d="M 140 395 L 140 380" fill="none" stroke="#6b7280" stroke-width="1" marker-end="url(#arr-gray)"/>

  <text x="240" y="370" fill="#2457d6" font-size="14" font-weight="bold" text-anchor="middle">P<tspan dy="3" font-size="11">in</tspan></text>
  <text x="400" y="200" fill="#6b7280" font-size="14" font-weight="bold" text-anchor="middle">P<tspan dy="3" font-size="11">out</tspan></text>

  <!-- Right Panel -->
  <rect x="500" y="80" width="420" height="340" fill="#f4f6f8" rx="8" stroke="#d0d7de" stroke-width="1"/>
  
  <text x="710" y="110" text-anchor="middle" font-weight="bold" font-size="14" fill="#1a1a1a">Закритий стан: герметизація</text>
  <text x="710" y="130" text-anchor="middle" fill="#c0392b" font-size="13">P<tspan dy="2" font-size="11">out</tspan><tspan dy="-2"> &gt; P</tspan><tspan dy="2" font-size="11">in</tspan></text>

  <path d="M 540 316 L 660 316 C 710 316, 760 252, 820 242 L 820 210 L 540 210 Z" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 540 320 L 660 320 L 660 380 L 540 380 Z" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 740 320 L 860 320 L 860 380 L 740 380 Z" fill="url(#hatch)" stroke="#1a1a1a" stroke-width="2"/>
  
  <path d="M 540 318 L 820 318" fill="none" stroke="#1a1a1a" stroke-width="4"/>

  <path d="M 640 210 L 640 310" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <path d="M 680 210 L 680 310" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <path d="M 720 210 L 720 310" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <path d="M 760 210 L 760 310" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <path d="M 800 210 L 800 310" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <text x="720" y="195" fill="#c0392b" font-size="12" text-anchor="middle">Тиск рідини притискає пелюстку</text>

  <circle cx="660" cy="319" r="6" fill="none" stroke="#27ae60" stroke-width="2"/>
  <circle cx="740" cy="319" r="6" fill="none" stroke="#27ae60" stroke-width="2"/>

  <text x="700" y="410" fill="#27ae60" font-size="12" font-weight="bold" text-anchor="middle">Лінії ущільнення (контакт із сідлом)</text>
  <path d="M 680 395 L 665 330" fill="none" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <path d="M 720 395 L 735 330" fill="none" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  
  <text x="850" y="295" fill="#1a1a1a" font-size="12" text-anchor="middle">Пелюстка</text>
  <path d="M 850 300 L 825 316" fill="none" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr-black)"/>

  <text x="820" y="200" fill="#c0392b" font-size="14" font-weight="bold" text-anchor="middle">P<tspan dy="3" font-size="11">out</tspan></text>
  <text x="700" y="370" fill="#6b7280" font-size="14" font-weight="bold" text-anchor="middle">P<tspan dy="3" font-size="11">in</tspan></text>

</svg>
