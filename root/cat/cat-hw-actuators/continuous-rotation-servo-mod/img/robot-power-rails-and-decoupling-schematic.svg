<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принципова схема системи розділеного живлення робота</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Понижувальний DC-DC, буферний C_bulk Low ESR та зіркова земля (Star GND) запобігають збоям MCU</text>

  <!-- ==================== СЕКЦІЯ 1: ДЖЕРЕЛО ЖИВЛЕННЯ (АКУМУЛЯТОР ТА SW1) ==================== -->
  <rect x="24" y="74" width="164" height="376" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="106" y="96" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ДЖЕРЕЛО ЖИВЛЕННЯ</text>
  <text x="106" y="112" font-size="12" fill="#6b7280" text-anchor="middle">Li-Ion батарея 2S</text>

  <!-- Акумуляторний блок -->
  <rect x="36" y="126" width="140" height="142" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="106" y="144" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Li-Ion 7.4 В (2S)</text>
  <text x="106" y="160" font-size="12" fill="#6b7280" text-anchor="middle">2× 18650 (7.4...8.4 В)</text>

  <!-- Схематичний символ батареї -->
  <line x1="106" y1="170" x2="106" y2="180" stroke="#c0392b" stroke-width="2"/>
  <line x1="84" y1="180" x2="128" y2="180" stroke="#c0392b" stroke-width="3"/>
  <line x1="94" y1="188" x2="118" y2="188" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="106" y1="188" x2="106" y2="198" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="84" y1="198" x2="128" y2="198" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="94" y1="206" x2="118" y2="206" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="106" y1="206" x2="106" y2="218" stroke="#1a1a1a" stroke-width="2"/>

  <text x="134" y="184" font-size="12" font-weight="bold" fill="#c0392b">BAT+</text>
  <text x="134" y="210" font-size="12" font-weight="bold" fill="#1a1a1a">BAT−</text>
  <text x="106" y="238" font-size="12" fill="#27ae60" text-anchor="middle">Висока струмовіддача</text>
  <text x="106" y="254" font-size="12" fill="#6b7280" text-anchor="middle">I_max до 15...20 А</text>

  <!-- Вимикач SW1 -->
  <rect x="36" y="282" width="140" height="96" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="106" y="302" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ВИМИКАЧ SW1</text>
  <text x="106" y="318" font-size="12" fill="#6b7280" text-anchor="middle">Головний вимикач</text>

  <!-- Схематичний символ вимикача -->
  <circle cx="68" cy="342" r="3.5" fill="#c0392b"/>
  <circle cx="144" cy="342" r="3.5" fill="#c0392b"/>
  <line x1="70" y1="340" x2="138" y2="326" stroke="#c0392b" stroke-width="2.5"/>
  <text x="106" y="364" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Power ON/OFF</text>

  <!-- ==================== СЕКЦІЯ 2: СИЛОВЕ ЖИВЛЕННЯ (DC-DC ТА C_BULK) ==================== -->
  <!-- Панель DC-DC Step-Down -->
  <rect x="210" y="74" width="144" height="176" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="282" y="96" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">DC-DC STEP-DOWN</text>
  <text x="282" y="112" font-size="12" fill="#6b7280" text-anchor="middle">Понижувач для моторів</text>

  <rect x="222" y="122" width="120" height="114" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
  <text x="282" y="142" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Buck Converter</text>
  <text x="282" y="162" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">ККД &gt; 90%</text>
  <text x="282" y="180" font-size="12" fill="#1a1a1a" text-anchor="middle">I_out до 3 А</text>
  <text x="282" y="198" font-size="12" fill="#6b7280" text-anchor="middle">MP1584 / LM2596</text>
  <text x="282" y="222" font-size="12" fill="#2457d6" text-anchor="middle">Без нагрівання</text>

  <text x="234" y="132" font-size="12" font-weight="bold" fill="#c0392b">VIN</text>
  <text x="330" y="132" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">VOUT</text>
  <text x="330" y="206" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">PGND</text>
  <text x="242" y="244" font-size="12" font-weight="bold" fill="#1a1a1a">GND</text>

  <!-- Панель буфера Low ESR C_bulk -->
  <rect x="374" y="74" width="156" height="176" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="452" y="96" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">БУФЕР LOW ESR</text>
  <text x="452" y="112" font-size="12" fill="#6b7280" text-anchor="middle">Біля клем живлення</text>

  <rect x="386" y="122" width="132" height="114" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
  <!-- Схематичний символ C_bulk + C_dec -->
  <line x1="424" y1="136" x2="424" y2="150" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="416" y1="150" x2="432" y2="150" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="416" y1="156" x2="432" y2="156" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="424" y1="156" x2="424" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="410" y="148" font-size="12" font-weight="bold" fill="#c0392b">+</text>

  <line x1="480" y1="136" x2="480" y2="150" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="472" y1="150" x2="488" y2="150" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="472" y1="156" x2="488" y2="156" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="480" y1="156" x2="480" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>

  <line x1="424" y1="136" x2="480" y2="136" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="424" y1="180" x2="480" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="452" cy="136" r="2.5" fill="#c0392b"/>
  <circle cx="452" cy="180" r="2.5" fill="#1a1a1a"/>

  <!-- З'єднання з шинами поза центром тексту -->
  <line x1="452" y1="180" x2="452" y2="186" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="452" y1="186" x2="502" y2="186" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="502" y1="186" x2="502" y2="210" stroke="#1a1a1a" stroke-width="1.5"/>

  <text x="452" y="202" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1000 мкФ + 100 нФ</text>
  <text x="452" y="222" font-size="12" fill="#27ae60" text-anchor="middle">Гасить I_stall піки</text>

  <!-- ==================== СЕКЦІЯ 3: СЕРВОПРИВОДИ ПОСТІЙНОГО ОБЕРТАННЯ ==================== -->
  <!-- Сервопривід 1 (Ліве колесо) -->
  <rect x="550" y="74" width="180" height="176" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="640" y="96" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">СЕРВОПРИВІД 1</text>
  <text x="640" y="112" font-size="12" fill="#6b7280" text-anchor="middle">Ліве колесо (Wheel L)</text>

  <rect x="562" y="122" width="156" height="114" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <circle cx="640" cy="154" r="20" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="640" y="159" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">M1</text>
  <text x="640" y="186" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Постійне обертання</text>
  <text x="640" y="202" font-size="12" fill="#6b7280" text-anchor="middle">MG90S / SG90 mod</text>

  <text x="574" y="132" font-size="12" font-weight="bold" fill="#c0392b">V+</text>
  <text x="574" y="218" font-size="12" font-weight="bold" fill="#1a1a1a">GND</text>
  <text x="640" y="230" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">PWM_L</text>

  <!-- Сервопривід 2 (Праве колесо) -->
  <rect x="750" y="74" width="186" height="176" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="843" y="96" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">СЕРВОПРИВІД 2</text>
  <text x="843" y="112" font-size="12" fill="#6b7280" text-anchor="middle">Праве колесо (Wheel R)</text>

  <rect x="762" y="122" width="162" height="114" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <circle cx="843" cy="154" r="20" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="843" y="159" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">M2</text>
  <text x="843" y="186" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Постійне обертання</text>
  <text x="843" y="202" font-size="12" fill="#6b7280" text-anchor="middle">MG90S / SG90 mod</text>

  <text x="774" y="132" font-size="12" font-weight="bold" fill="#c0392b">V+</text>
  <text x="774" y="218" font-size="12" font-weight="bold" fill="#1a1a1a">GND</text>
  <text x="843" y="230" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">PWM_R</text>

  <!-- ==================== СЕКЦІЯ 4: ЛОГІКА ТА МІКРОКОНТРОЛЕР ==================== -->
  <!-- Панель LDO 3.3 В -->
  <rect x="210" y="274" width="144" height="176" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="282" y="296" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">LDO РЕГУЛЯТОР</text>
  <text x="282" y="312" font-size="12" fill="#6b7280" text-anchor="middle">Живлення MCU 3.3 В</text>

  <rect x="222" y="322" width="120" height="114" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.2"/>
  <text x="282" y="342" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">AMS1117-3.3</text>
  <text x="282" y="362" font-size="12" fill="#1a1a1a" text-anchor="middle">Чисті 3.3 В</text>
  <text x="282" y="380" font-size="12" fill="#6b7280" text-anchor="middle">C_in, C_out 10 мкФ</text>
  <text x="282" y="398" font-size="12" fill="#27ae60" text-anchor="middle">Ізолює від шуму</text>
  <text x="282" y="420" font-size="12" fill="#6b7280" text-anchor="middle">I_mcu &lt; 80 мА</text>

  <text x="234" y="332" font-size="12" font-weight="bold" fill="#c0392b">VIN</text>
  <text x="330" y="332" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">VDD</text>
  <text x="242" y="444" font-size="12" font-weight="bold" fill="#1a1a1a">GND</text>

  <!-- Панель MCU -->
  <rect x="374" y="274" width="356" height="176" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="490" y="296" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">МІКРОКОНТРОЛЕР (MCU)</text>
  <text x="490" y="312" font-size="12" fill="#6b7280" text-anchor="middle">ESP32 / STM32 — диференціальне керування</text>

  <rect x="386" y="322" width="332" height="114" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.2"/>
  <text x="476" y="344" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">MCU Core &amp; Timers</text>
  <text x="476" y="364" font-size="12" fill="#1a1a1a" text-anchor="middle">Апаратний ШІМ 50 Гц (період 20 мс)</text>
  <text x="476" y="384" font-size="12" fill="#27ae60" text-anchor="middle">Ширина: 1000...2000 мкс (1500 мкс = Стоп)</text>
  <text x="476" y="404" font-size="12" fill="#6b7280" text-anchor="middle">Програмний рампінг (плавний розгін / реверс)</text>
  <text x="476" y="424" font-size="12" fill="#2457d6" text-anchor="middle">Диференціальна кінематика (v, omega)</text>

  <text x="398" y="332" font-size="12" font-weight="bold" fill="#27ae60">VDD (3.3 В)</text>
  <text x="398" y="428" font-size="12" font-weight="bold" fill="#1a1a1a">SGND</text>
  <text x="640" y="338" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">PWM_L</text>
  <text x="702" y="338" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">PWM_R</text>

  <!-- Панель захисту від Brown-out -->
  <rect x="750" y="274" width="186" height="176" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="843" y="296" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">ЗАХИСТ ВІД ЗБОЇВ</text>
  <text x="843" y="312" font-size="12" fill="#6b7280" text-anchor="middle">Чому МК не ресетиться</text>

  <rect x="762" y="322" width="162" height="114" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="843" y="342" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Розділені шини</text>
  <text x="843" y="358" font-size="12" fill="#6b7280" text-anchor="middle">DC-DC не просаджує LDO</text>
  <text x="843" y="378" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Буфер C_bulk</text>
  <text x="843" y="394" font-size="12" fill="#6b7280" text-anchor="middle">Бере на себе піки струму</text>
  <text x="843" y="414" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">3. Star GND: нуль зсуву</text>
  <text x="843" y="430" font-size="12" fill="#27ae60" text-anchor="middle">BOR ресети виключено</text>

  <!-- ==================== ПРОВОДИ ТА ШИНИ ==================== -->
  <!-- BAT+ від батареї до вимикача SW1 -->
  <line x1="106" y1="170" x2="106" y2="166" stroke="#c0392b" stroke-width="2"/>
  <line x1="106" y1="166" x2="52" y2="166" stroke="#c0392b" stroke-width="2"/>
  <line x1="52" y1="166" x2="52" y2="342" stroke="#c0392b" stroke-width="2"/>
  <line x1="52" y1="342" x2="64" y2="342" stroke="#c0392b" stroke-width="2"/>

  <!-- Після SW1: вихід на шину V_BAT (+7.4 В) -->
  <line x1="148" y1="342" x2="198" y2="342" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="198" cy="342" r="3.5" fill="#c0392b"/>

  <!-- Шина V_BAT розгалужується: вгору до DC-DC VIN і вниз до LDO VIN -->
  <line x1="198" y1="342" x2="198" y2="136" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="198" y1="136" x2="222" y2="136" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <line x1="198" y1="336" x2="222" y2="336" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <circle cx="198" cy="336" r="3.5" fill="#c0392b"/>

  <!-- СИЛОВА ШИНА V_servo (+6.0 В) -->
  <line x1="342" y1="136" x2="386" y2="136" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="386" y1="136" x2="518" y2="136" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="518" y1="136" x2="562" y2="136" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <line x1="562" y1="136" x2="762" y2="136" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <circle cx="452" cy="136" r="3" fill="#c0392b"/>
  <circle cx="562" cy="136" r="3" fill="#c0392b"/>
  <circle cx="762" cy="136" r="3" fill="#c0392b"/>

  <!-- СИЛОВА ЗЕМЛЯ PGND -->
  <line x1="762" y1="210" x2="562" y2="210" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="562" y1="210" x2="502" y2="210" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="502" y1="210" x2="386" y2="210" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="386" y1="210" x2="342" y2="210" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="762" cy="210" r="3" fill="#1a1a1a"/>
  <circle cx="562" cy="210" r="3" fill="#1a1a1a"/>
  <circle cx="502" cy="210" r="3" fill="#1a1a1a"/>
  <circle cx="342" cy="210" r="3" fill="#1a1a1a"/>

  <!-- ЛОГІЧНА ШИНА VDD (+3.3 В) -->
  <line x1="342" y1="336" x2="386" y2="336" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <!-- СИГНАЛИ КЕРУВАННЯ ШІМ (PWM) ВІД MCU ДО СЕРВОПРИВОДІВ -->
  <!-- PWM_L до Серво 1 (Ліве) -->
  <line x1="640" y1="322" x2="640" y2="236" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <circle cx="640" cy="322" r="3" fill="#2457d6"/>
  <text x="634" y="260" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">PWM 1</text>

  <!-- PWM_R до Серво 2 (Праве) -->
  <path d="M 702,322 L 702,260 L 843,260 L 843,236" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <circle cx="702" cy="322" r="3" fill="#2457d6"/>
  <text x="851" y="260" font-size="12" font-weight="bold" fill="#2457d6">PWM 2</text>

  <!-- ==================== СЕКЦІЯ 5: ЗІРКОВА ЗЕМЛЯ (STAR GND) ==================== -->
  <!-- BAT- від батареї до шини Star GND -->
  <line x1="106" y1="218" x2="106" y2="476" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="106" y1="476" x2="282" y2="476" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="106" cy="218" r="3" fill="#1a1a1a"/>

  <!-- Силова земля PGND від DC-DC до Star GND -->
  <line x1="250" y1="236" x2="250" y2="476" stroke="#1a1a1a" stroke-width="2.5"/>
  <circle cx="250" cy="236" r="3" fill="#1a1a1a"/>

  <!-- Логічна земля GND від LDO до Star GND -->
  <line x1="266" y1="436" x2="266" y2="476" stroke="#27ae60" stroke-width="2"/>
  <circle cx="266" cy="436" r="2.5" fill="#27ae60"/>

  <!-- Чиста сигнальна земля SGND від MCU до Star GND -->
  <path d="M 386,424 L 316,424 L 316,476" fill="none" stroke="#27ae60" stroke-width="2"/>
  <circle cx="386" cy="424" r="3" fill="#27ae60"/>
