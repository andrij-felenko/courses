<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Підкладка полотна -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Маркери стрілок -->
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Головний заголовок і підзаголовок -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Апаратне калібрування нейтралі: тримерний дільник та шунтування</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Схемотехніка штучної нейтралі VCC/2: компенсація розкиду резисторів та усунення повзучого дрейфу</text>

  <!-- ==================== ЛІВА ПАНЕЛЬ: ВАРІАНТ А (ТРИМЕР) ==================== -->
  <rect x="24" y="70" width="446" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Заголовок лівої панелі -->
  <text x="40" y="94" font-size="14" font-weight="bold" fill="#1a1a1a">Варіант А: Дільник із тримером R_trim</text>
  <text x="40" y="110" font-size="12" fill="#6b7280">Послідовне включення між постійними плечима дільника</text>
  <rect x="316" y="80" width="142" height="22" rx="4" fill="#eaf0fd"/>
  <text x="387" y="95" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Плавне регулювання</text>

  <!-- СХЕМА ВАРІАНТА А -->
  <!-- Шина живлення +VCC -->
  <text x="135" y="132" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+VCC (+5 В)</text>
  <circle cx="135" cy="138" r="2.5" fill="#c0392b"/>
  <line x1="135" y1="138" x2="135" y2="156" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Верхній резистор R1 -->
  <text x="118" y="171" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">R1 (фіксоване)</text>
  <text x="118" y="186" font-size="12" fill="#6b7280" text-anchor="end">2.2 кОм (±1%)</text>
  <rect x="126" y="156" width="18" height="36" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Провідник від R1 до R_trim -->
  <line x1="135" y1="192" x2="135" y2="210" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Багатообертовий тример R_trim -->
  <text x="116" y="230" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">R_trim</text>
  <text x="116" y="245" font-size="12" fill="#6b7280" text-anchor="end">100–200 Ом</text>
  <text x="116" y="260" font-size="12" fill="#6b7280" text-anchor="end">(багатооберт.)</text>
  <rect x="124" y="210" width="22" height="52" rx="2" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <!-- IEC позначення тримера (діагональна стрілка регулювання) -->
  <line x1="118" y1="258" x2="152" y2="214" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="152" y1="214" x2="158" y2="214" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Повзунок тримера та вихід V_out -->
  <path d="M152,232 L146,236 L152,240" fill="none" stroke="#27ae60" stroke-width="1.8"/>
  <line x1="146" y1="236" x2="190" y2="236" stroke="#27ae60" stroke-width="2"/>
  <text x="168" y="224" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">V_out</text>
  <text x="168" y="252" font-size="12" fill="#6b7280" text-anchor="middle">нейтраль</text>

  <!-- Вхідний контакт мікросхеми сервопривода (FB) -->
  <rect x="190" y="224" width="32" height="24" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="206" y="240" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">FB</text>

  <!-- Провідник від R_trim до R2 -->
  <line x1="135" y1="262" x2="135" y2="278" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Нижній резистор R2 -->
  <text x="118" y="293" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">R2 (фіксоване)</text>
  <text x="118" y="308" font-size="12" fill="#6b7280" text-anchor="end">2.2 кОм (±1%)</text>
  <rect x="126" y="278" width="18" height="36" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Провідник до землі GND -->
  <line x1="135" y1="314" x2="135" y2="330" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="123" y1="330" x2="147" y2="330" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="127" y1="334" x2="143" y2="334" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="131" y1="338" x2="139" y2="338" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="135" y="352" font-size="12" fill="#6b7280" text-anchor="middle">GND (0 В)</text>

  <!-- ПРАВА ЧАСТИНА ЛІВОЇ ПАНЕЛІ: ДІАПАЗОН ПІДСТРОЮВАННЯ -->
  <rect x="232" y="132" width="226" height="94" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="244" y="150" font-size="12" font-weight="bold" fill="#1a1a1a">Діапазон підстроювання V_out:</text>
  <text x="345" y="165" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">VCC/2 = 2.50 В (нейтраль)</text>
  <rect x="244" y="172" width="202" height="16" rx="3" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="305" y="173" width="80" height="14" rx="2" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <line x1="345" y1="169" x2="345" y2="191" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="2,2"/>
  <text x="305" y="202" font-size="12" fill="#6b7280" text-anchor="middle">2.39 В</text>
  <text x="385" y="202" font-size="12" fill="#6b7280" text-anchor="middle">2.61 В</text>
  <text x="345" y="217" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">ΔV_max = ±114 мВ (±4.5%)</text>

  <!-- Картка параметрів варіанта А -->
  <rect x="232" y="234" width="226" height="112" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="244" y="253" font-size="12" font-weight="bold" fill="#2457d6">Розрахункові параметри:</text>
  <text x="244" y="271" font-size="12" fill="#1a1a1a">• Умова: R_trim ≪ R_fixed (200 Ом ≪ 2.2 к)</text>
  <text x="244" y="289" font-size="12" fill="#1a1a1a">• Запас: R_trim ≥ 2 · k_zap · δ_max · R_fix</text>
  <text x="244" y="307" font-size="12" fill="#1a1a1a">• Точність: &lt; 0.5 мкс ШІМ на оберт гвинта</text>
  <text x="244" y="325" font-size="12" fill="#27ae60">• Результат: нуль повзучого дрейфу вала</text>
  <text x="244" y="339" font-size="12" fill="#6b7280">• Формула: ΔV ≈ ± VCC · R_trim / (4 · R_fix)</text>

  <!-- Нижня зведена картка варіанта А -->
  <rect x="36" y="358" width="422" height="128" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="48" y="368" width="168" height="20" rx="3" fill="#eaf0fd"/>
  <text x="132" y="382" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Властивості топології А</text>
  <text x="48" y="404" font-size="12" font-weight="bold" fill="#27ae60">✓ Перевага:</text>
  <text x="126" y="404" font-size="12" fill="#1a1a1a">плавне балансування викруткою під час роботи</text>
  <text x="48" y="424" font-size="12" font-weight="bold" fill="#c0392b">✗ Недолік:</text>
  <text x="120" y="424" font-size="12" fill="#1a1a1a">рухомий повзунок чутливий до вібрацій і ударів</text>
  <text x="48" y="444" font-size="12" fill="#1a1a1a">• Габарити: потребує монтажного простору під тример 3296W</text>
  <text x="48" y="464" font-size="12" fill="#6b7280">• Застосування: лабораторні прототипи та стенди налагодження</text>

  <!-- ==================== ПРАВА ПАНЕЛЬ: ВАРІАНТ Б (ПАРАЛЕЛЬНИЙ ШУНТ) ==================== -->
  <rect x="490" y="70" width="446" height="430" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Заголовок правої панелі -->
  <text x="506" y="94" font-size="14" font-weight="bold" fill="#1a1a1a">Варіант Б: Компенсація шунтом R_shunt</text>
  <text x="506" y="110" font-size="12" fill="#6b7280">Паралельний високоомний шунт до більшого плеча</text>
  <rect x="782" y="80" width="142" height="22" rx="4" fill="#e9f7ef"/>
  <text x="853" y="95" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Висока вібростійкість</text>

  <!-- СХЕМА ВАРІАНТА Б -->
  <!-- Шина живлення +VCC -->
  <text x="595" y="132" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+VCC (+5 В)</text>
  <circle cx="595" cy="138" r="2.5" fill="#c0392b"/>
  <line x1="595" y1="138" x2="595" y2="156" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Верхній резистор R1 -->
  <text x="578" y="171" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">R1 = 2.22 кОм</text>
  <text x="578" y="186" font-size="12" fill="#c0392b" text-anchor="end">(+1% розкид)</text>
  <rect x="586" y="156" width="18" height="36" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- З'єднання R1 до середньої точки -->
  <line x1="595" y1="192" x2="595" y2="226" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="595" cy="226" r="3.5" fill="#27ae60"/>

  <!-- Вихідний сигнал V_out до входу FB -->
  <line x1="595" y1="226" x2="656" y2="226" stroke="#27ae60" stroke-width="2"/>
  <text x="626" y="218" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">V_out</text>
  <text x="626" y="240" font-size="12" fill="#6b7280" text-anchor="middle">VCC/2</text>
  <rect x="656" y="214" width="32" height="24" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="672" y="230" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">FB</text>

  <!-- Розгалуження на R2 та R_shunt -->
  <line x1="595" y1="226" x2="595" y2="252" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="595" cy="252" r="2.5" fill="#1a1a1a"/>
  <!-- Горизонтальна шина розгалуження -->
  <line x1="560" y1="252" x2="630" y2="252" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="560" y1="252" x2="560" y2="268" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="630" y1="252" x2="630" y2="268" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Резистор R2 (основне плече) -->
  <text x="544" y="283" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">R2 = 2.22 кОм</text>
  <text x="544" y="298" font-size="12" fill="#6b7280" text-anchor="end">основне плече</text>
  <rect x="551" y="268" width="18" height="36" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Резистор R_shunt (паралельний шунт) -->
  <rect x="621" y="268" width="18" height="36" rx="2" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="646" y="283" font-size="12" font-weight="bold" fill="#27ae60">R_shunt</text>
  <text x="646" y="298" font-size="12" fill="#6b7280">100 кОм</text>

  <!-- Зведення гілок після R2 та R_shunt -->
  <line x1="560" y1="304" x2="560" y2="318" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="630" y1="304" x2="630" y2="318" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="560" y1="318" x2="630" y2="318" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="595" cy="318" r="2.5" fill="#1a1a1a"/>

  <!-- З'єднання до GND -->
  <line x1="595" y1="318" x2="595" y2="330" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="583" y1="330" x2="607" y2="330" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="587" y1="334" x2="603" y2="334" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="591" y1="338" x2="599" y2="338" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="595" y="352" font-size="12" fill="#6b7280" text-anchor="middle">GND (0 В)</text>

  <!-- ПРАВА ЧАСТИНА ПРАВОЇ ПАНЕЛІ: ДІАПАЗОН ПІДСТРОЮВАННЯ -->
  <rect x="698" y="132" width="226" height="94" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="710" y="150" font-size="12" font-weight="bold" fill="#1a1a1a">Діапазон зміщення V_out:</text>
  <text x="811" y="165" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">VCC/2 = 2.50 В (нейтраль)</text>
  <rect x="710" y="172" width="202" height="16" rx="3" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="791" y="173" width="40" height="14" rx="2" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <line x1="811" y1="169" x2="811" y2="191" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="2,2"/>
  <text x="778" y="202" font-size="12" fill="#6b7280" text-anchor="middle">2.47 В</text>
  <text x="844" y="202" font-size="12" fill="#6b7280" text-anchor="middle">2.53 В</text>
  <text x="811" y="217" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">ΔV = ±27.5 мВ (мікрозсув)</text>

  <!-- Картка параметрів варіанта Б -->
  <rect x="698" y="234" width="226" height="112" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="710" y="253" font-size="12" font-weight="bold" fill="#27ae60">Розрахункові параметри:</text>
  <text x="710" y="271" font-size="12" fill="#1a1a1a">• Умова: R_shunt ≫ R (100 кОм ≫ 2.2 к)</text>
  <text x="710" y="289" font-size="12" fill="#1a1a1a">• Еквівалент: R_eq = (R · R_sh)/(R + R_sh)</text>
  <text x="710" y="307" font-size="12" fill="#1a1a1a">• Крок корекції: ΔR ≈ R² / R_shunt ≈ 48 Ом</text>
  <text x="710" y="325" font-size="12" fill="#27ae60">• Результат: фіксація нейтралі на платі</text>
  <text x="710" y="339" font-size="12" fill="#6b7280">• Формула: ΔV ≈ ± VCC · R / (4 · R_shunt)</text>

  <!-- Нижня зведена картка варіанта Б -->
  <rect x="502" y="358" width="422" height="128" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="514" y="368" width="168" height="20" rx="3" fill="#e9f7ef"/>
  <text x="598" y="382" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Властивості топології Б</text>
  <text x="514" y="404" font-size="12" font-weight="bold" fill="#27ae60">✓ Перевага:</text>
  <text x="592" y="404" font-size="12" fill="#1a1a1a">абсолютна надійність, нуль рухомих деталей</text>
  <text x="514" y="424" font-size="12" font-weight="bold" fill="#c0392b">✗ Недолік:</text>
  <text x="586" y="424" font-size="12" fill="#1a1a1a">дискретний підбір (потребує паяння шунта)</text>
  <text x="514" y="444" font-size="12" fill="#1a1a1a">• Габарити: мініатюрний SMD-резистор 0603/0805 на платі</text>
  <text x="514" y="464" font-size="12" fill="#6b7280">• Застосування: серійні плати, бойові та мобільні роботи</text>
</svg>
