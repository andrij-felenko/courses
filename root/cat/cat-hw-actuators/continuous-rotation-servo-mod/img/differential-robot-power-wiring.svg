<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Header Section -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема силового живлення диференціального робота</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Розділення шин VCC, спільне заземлення Star GND та фільтрація перехідних процесів</text>

  <!-- Block 1: Battery -->
  <rect x="30" y="75" width="170" height="130" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="115" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Акумулятор</text>
  <text x="115" y="116" font-size="12" fill="#6b7280" text-anchor="middle">LiPo 2S (7.4 V)</text>
  <text x="115" y="134" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Джерело V_BAT</text>
  <!-- Battery Icon -->
  <rect x="50" y="152" width="36" height="36" rx="3" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="62" y="147" width="12" height="5" rx="1" fill="#6b7280"/>
  <rect x="55" y="159" width="26" height="8" rx="1" fill="#27ae60"/>
  <rect x="55" y="172" width="26" height="8" rx="1" fill="#27ae60"/>
  <!-- Terminals inside Block 1 -->
  <text x="175" y="154" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="end">+ V_BAT</text>
  <text x="175" y="189" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="end">- GND</text>
  <circle cx="190" cy="150" r="4" fill="#c0392b"/>
  <circle cx="190" cy="185" r="4" fill="#1a1a1a"/>

  <!-- Block 2: DC-DC Converter -->
  <rect x="240" y="75" width="180" height="130" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="330" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">DC-DC Стабілізатор</text>
  <text x="330" y="116" font-size="12" fill="#6b7280" text-anchor="middle">Step-Down (5V)</text>
  <text x="330" y="134" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Вихід: +5V VCC_MCU</text>
  <!-- DC-DC Symbol -->
  <rect x="310" y="150" width="40" height="24" rx="3" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="322" cy="162" r="4" fill="#2457d6"/>
  <rect x="335" y="157" width="10" height="10" rx="1" fill="#1a1a1a"/>
  <!-- Terminals inside Block 2 -->
  <text x="252" y="154" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="start">IN+</text>
  <text x="408" y="154" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="end">OUT+</text>
  <text x="370" y="190" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GND</text>
  <circle cx="240" cy="150" r="4" fill="#c0392b"/>
  <circle cx="420" cy="150" r="4" fill="#27ae60"/>
  <circle cx="370" cy="205" r="4" fill="#1a1a1a"/>

  <!-- Block 3: Microcontroller -->
  <rect x="460" y="75" width="200" height="130" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="560" y="98" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Мікроконтролер</text>
  <text x="560" y="116" font-size="12" fill="#6b7280" text-anchor="middle">(Arduino / ESP32)</text>
  <!-- MCU Chip -->
  <rect x="530" y="130" width="60" height="40" rx="4" fill="#1a1a1a"/>
  <text x="560" y="155" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">MCU</text>
  <!-- Terminals inside Block 3 -->
  <text x="472" y="154" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="start">5V IN</text>
  <text x="648" y="139" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="end">D9 (PWM L)</text>
  <text x="648" y="184" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="end">D10 (PWM R)</text>
  <text x="590" y="190" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GND</text>
  <circle cx="460" cy="150" r="4" fill="#27ae60"/>
  <circle cx="660" cy="135" r="4" fill="#2457d6"/>
  <circle cx="660" cy="180" r="4" fill="#2457d6"/>
  <circle cx="590" cy="205" r="4" fill="#1a1a1a"/>

  <!-- Block 4: Left Servo Motor -->
  <rect x="710" y="75" width="220" height="130" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="820" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Сервопривод (Лівий)</text>
  <text x="820" y="116" font-size="12" fill="#6b7280" text-anchor="middle">Постійне обертання</text>
  <!-- Left Servo Graphic -->
  <rect x="835" y="130" width="55" height="55" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="862" cy="157" r="15" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M 854,149 A 10,10 0 1,1 870,149" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <!-- Terminals inside Block 4 -->
  <text x="722" y="139" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="start">SIG (Жовтий)</text>
  <text x="722" y="169" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="start">VCC (Червоний)</text>
  <text x="722" y="194" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="start">GND (Чорний)</text>
  <circle cx="710" cy="135" r="4" fill="#2457d6"/>
  <circle cx="710" cy="165" r="4" fill="#c0392b"/>
  <circle cx="710" cy="190" r="4" fill="#1a1a1a"/>

  <!-- Block 5: Filter & Star GND Module -->
  <rect x="240" y="235" width="420" height="140" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="450" y="256" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Модуль фільтрації та Star GND</text>

  <!-- VCC_SERVO Power Rail -->
  <line x1="240" y1="285" x2="660" y2="285" stroke="#c0392b" stroke-width="2.5"/>
  <text x="450" y="274" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Силова шина VCC_SERVO (+7.4V)</text>

  <!-- Capacitor C1 (Electrolytic) -->
  <line x1="320" y1="285" x2="320" y2="298" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="310" y1="298" x2="330" y2="298" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="304" y="298" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="end">+</text>
  <path d="M 310,305 Q 320,309 330,305" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="320" y1="307" x2="320" y2="345" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="320" cy="345" r="3.5" fill="#1a1a1a"/>
  <text x="295" y="308" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="end">C1</text>
  <text x="295" y="322" font-size="11" fill="#6b7280" text-anchor="end">470–1000 µF</text>

  <!-- Capacitor C2 (Ceramic) -->
  <line x1="530" y1="285" x2="530" y2="298" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="520" y1="298" x2="540" y2="298" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="520" y1="305" x2="540" y2="305" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="530" y1="305" x2="530" y2="345" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="530" cy="345" r="3.5" fill="#1a1a1a"/>
  <text x="550" y="308" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="start">C2</text>
  <text x="550" y="322" font-size="11" fill="#6b7280" text-anchor="start">0.1 µF</text>

  <!-- Star GND Node -->
  <circle cx="450" cy="345" r="6" fill="#27ae60" stroke="#ffffff" stroke-width="2"/>
  <text x="450" y="365" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Спільне заземлення (Star GND)</text>

  <!-- Block 6: Right Servo Motor -->
  <rect x="710" y="235" width="220" height="140" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="820" y="258" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Сервопривод (Правий)</text>
  <text x="820" y="276" font-size="12" fill="#6b7280" text-anchor="middle">Постійне обертання</text>
  <!-- Right Servo Graphic -->
  <rect x="835" y="290" width="55" height="55" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <circle cx="862" cy="317" r="15" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M 854,309 A 10,10 0 1,1 870,309" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <!-- Terminals inside Block 6 -->
  <text x="722" y="299" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="start">SIG (Жовтий)</text>
  <text x="722" y="329" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="start">VCC (Червоний)</text>
  <text x="722" y="354" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="start">GND (Чорний)</text>
  <circle cx="710" cy="295" r="4" fill="#2457d6"/>
  <circle cx="710" cy="325" r="4" fill="#c0392b"/>
  <circle cx="710" cy="350" r="4" fill="#1a1a1a"/>

  <!-- Card 1: Problem / Warnings -->
  <rect x="30" y="405" width="430" height="135" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="45" y="425" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">⚠️ Наслідки відсутності розділення та фільтрації:</text>
  <text x="45" y="445" font-size="11" fill="#1a1a1a" text-anchor="start">• Кидки струму моторів просаджують VCC_MCU</text>
  <text x="45" y="461" font-size="11" fill="#1a1a1a" text-anchor="start">  та викликають перезавантаження (Reset МК)</text>
  <text x="45" y="481" font-size="11" fill="#1a1a1a" text-anchor="start">• Без C1 виникають просідання при пуску сервоприводів</text>
  <text x="45" y="501" font-size="11" fill="#1a1a1a" text-anchor="start">• Без Star GND виникає дрейф нуля та збої PWM</text>

  <!-- Card 2: Solutions / Rules -->
  <rect x="490" y="405" width="440" height="135" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="505" y="425" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">✅ Ключові інженерні правила силової розводки:</text>
  <text x="505" y="445" font-size="11" fill="#1a1a1a" text-anchor="start">1. Розділення VCC: Живлення логіки (+5V) окремо</text>
  <text x="505" y="461" font-size="11" fill="#1a1a1a" text-anchor="start">   від силової шини сервоприводів (+7.4V)</text>
  <text x="505" y="481" font-size="11" fill="#1a1a1a" text-anchor="start">2. Фільтрація: C1 (електроліт) буферизує струм,</text>
  <text x="505" y="497" font-size="11" fill="#1a1a1a" text-anchor="start">   C2 (кераміка) гасить високочастотні завади</text>
  <text x="505" y="517" font-size="11" fill="#1a1a1a" text-anchor="start">3. Star GND: Усі земляні лінії сходяться в 1 точці</text>

  <!-- WIRING LINES -->

  <!-- NET 1: V_BAT (Red) -->
  <line x1="190" y1="150" x2="210" y2="150" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="210" cy="150" r="4" fill="#c0392b"/>
  <!-- Branch 1A: V_BAT -> DC-DC IN+ -->
  <line x1="210" y1="150" x2="240" y2="150" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="225" y="142" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">V_BAT</text>
  <!-- Branch 1B: V_BAT -> Block 5 VCC_SERVO Rail -->
  <path d="M 210,150 L 210,285 L 240,285" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- VCC_SERVO Output from Block 5 (660, 285) to Servos -->
  <path d="M 660,285 L 685,285" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="685" cy="285" r="4" fill="#c0392b"/>
  <!-- Branch to Left Servo VCC -->
  <path d="M 685,285 L 685,165 L 710,165" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="697" y="157" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">VCC</text>
  <!-- Branch to Right Servo VCC -->
  <path d="M 685,285 L 685,325 L 710,325" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="697" y="317" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">VCC</text>

  <!-- NET 2: MCU +5V Power (Green) DC-DC OUT+ (420, 150) -> MCU 5V IN (460, 150) -->
  <line x1="420" y1="150" x2="460" y2="150" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="440" y="142" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">+5V</text>

  <!-- NET 3: Star GND Lines (Dark) -->
  <!-- Battery GND -> Block 5 Star GND Bus -->
  <path d="M 190,185 L 210,185 L 210,345 L 240,345" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="225" y="337" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GND</text>
  <!-- Bus inside Block 5 from battery GND (240, 345) to Star GND node (450, 345) -->
  <line x1="240" y1="345" x2="450" y2="345" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- DC-DC GND -> Star GND Bus -->
  <path d="M 370,205 L 370,345" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="370" cy="345" r="3.5" fill="#1a1a1a"/>

  <!-- MCU GND -> Star GND Bus -->
  <path d="M 590,205 L 590,345" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="590" cy="345" r="3.5" fill="#1a1a1a"/>

  <!-- Servos GND -> Star GND Bus -->
  <path d="M 710,190 L 685,190 L 685,345" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M 710,350 L 685,350 L 685,345" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="685" cy="345" r="3.5" fill="#1a1a1a"/>
  <line x1="685" y1="345" x2="450" y2="345" stroke="#1a1a1a" stroke-width="2.5"/>
  <text x="697" y="342" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GND</text>

  <!-- NET 4: Signal D9 PWM L (Blue) MCU D9 (660, 135) -> Left Servo SIG (710, 135) -->
  <line x1="660" y1="135" x2="710" y2="135" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="685" y="127" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">PWM L</text>

  <!-- NET 5: Signal D10 PWM R (Blue) MCU D10 (660, 180) -> Right Servo SIG (710, 295) -->
  <path d="M 660,180 L 675,180 L 675,295 L 710,295" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="690" y="287" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">PWM R</text>
</svg>
