<svg viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Модифікація SG90: заміна потенціометра резистивним дільником</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Дільник з двох однакових резисторів подає Vcc / 2 на вхід зворотного зв'язку</text>

  <!-- LEFT PANEL: Original Potentiometer -->
  <g id="panel-original">
    <rect x="25" y="75" width="445" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="40" y="90" width="415" height="34" rx="5" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
    <text x="247" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">Оригінал: Потенціометричний зворотний зв'язок</text>

    <!-- Schematic Area Left -->
    <!-- Power Rails -->
    <text x="150" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Vcc (+5V)</text>
    <line x1="55" y1="150" x2="280" y2="150" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="150" cy="150" r="4" fill="#1a1a1a"/>

    <line x1="55" y1="315" x2="280" y2="315" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="150" cy="315" r="4" fill="#1a1a1a"/>
    <text x="150" y="331" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">GND (0V)</text>

    <!-- Motor Shaft Mechanical Link -->
    <text x="60" y="198" text-anchor="start" font-size="12" fill="#6b7280">Вал двигуна</text>
    <line x1="60" y1="210" x2="135" y2="210" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr)"/>

    <!-- Potentiometer Body -->
    <rect x="140" y="195" width="20" height="75" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="150" y1="150" x2="150" y2="195" stroke="#1a1a1a" stroke-width="2"/>
    <line x1="150" y1="270" x2="150" y2="315" stroke="#1a1a1a" stroke-width="2"/>

    <text x="130" y="225" text-anchor="end" font-size="12" font-weight="bold" fill="#1a1a1a">Rpot</text>
    <text x="130" y="242" text-anchor="end" font-size="12" fill="#6b7280">5 кОм</text>

    <!-- Wiper Output Line -->
    <line x1="160" y1="232" x2="280" y2="232" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
    <polygon points="140,232 148,227 148,237" fill="#c0392b"/>
    <text x="220" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Vfb (змінна)</text>

    <!-- Controller IC Box -->
    <rect x="280" y="150" width="160" height="165" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="360" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Контролер SG90</text>
    <text x="360" y="192" text-anchor="middle" font-size="12" fill="#6b7280">(Аналогова плата)</text>

    <!-- Pin Connections -->
    <text x="288" y="160" text-anchor="start" font-size="12" fill="#1a1a1a">VCC</text>
    <text x="288" y="224" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">Вхід FB</text>
    <text x="288" y="306" text-anchor="start" font-size="12" fill="#1a1a1a">GND</text>

    <rect x="292" y="238" width="136" height="48" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <text x="360" y="256" text-anchor="middle" font-size="12" fill="#1a1a1a">Порівнює Vpwm</text>
    <text x="360" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">із напругою Vfb</text>

    <!-- Description Box Bottom -->
    <rect x="40" y="345" width="415" height="100" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <text x="55" y="365" font-size="13" font-weight="bold" fill="#c0392b">Особливості оригінальної схеми:</text>
    <text x="55" y="385" font-size="12" fill="#1a1a1a">• Потенціометр видає Vfb залежно від кута вала</text>
    <text x="55" y="405" font-size="12" fill="#1a1a1a">• Мотор повертає вал, поки Vfb не дорівнюватиме Vpwm</text>
    <text x="55" y="425" font-size="12" fill="#6b7280">• Обмежений кут руху (зазвичай 0°...180°)</text>
  </g>

  <!-- RIGHT PANEL: Resistor Divider -->
  <g id="panel-modified">
    <rect x="490" y="75" width="445" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
    <rect x="505" y="90" width="415" height="34" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
    <text x="712" y="112" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">Модифікація: Резистивний дільник напруги</text>

    <!-- Schematic Area Right -->
    <!-- Power Rails -->
    <text x="615" y="138" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Vcc (+5V)</text>
    <line x1="520" y1="150" x2="745" y2="150" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="615" cy="150" r="4" fill="#1a1a1a"/>

    <line x1="520" y1="315" x2="745" y2="315" stroke="#1a1a1a" stroke-width="2"/>
    <circle cx="615" cy="315" r="4" fill="#1a1a1a"/>
    <text x="615" y="331" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">GND (0V)</text>

    <!-- Resistors Divider R1 & R2 -->
    <!-- Wire Top to R1 -->
    <line x1="615" y1="150" x2="615" y2="175" stroke="#1a1a1a" stroke-width="2"/>

    <!-- Resistor R1 -->
    <rect x="605" y="175" width="20" height="40" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
    <text x="595" y="190" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">R1</text>
    <text x="595" y="206" text-anchor="end" font-size="12" fill="#1a1a1a">2.2 кОм</text>

    <!-- Wire R1 to R2 -->
    <line x1="615" y1="215" x2="615" y2="250" stroke="#1a1a1a" stroke-width="2"/>

    <!-- Resistor R2 -->
    <rect x="605" y="250" width="20" height="40" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
    <text x="595" y="265" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">R2</text>
    <text x="595" y="281" text-anchor="end" font-size="12" fill="#1a1a1a">2.2 кОм</text>

    <!-- Wire R2 to GND -->
    <line x1="615" y1="290" x2="615" y2="315" stroke="#1a1a1a" stroke-width="2"/>

    <!-- Middle Junction Node -->
    <circle cx="615" cy="232" r="4" fill="#27ae60"/>
    <line x1="615" y1="232" x2="745" y2="232" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
    <text x="680" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Vfb = Vcc/2 = 2.5V</text>

    <!-- Controller IC Box -->
    <rect x="745" y="150" width="160" height="165" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="825" y="174" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Контролер SG90</text>
    <text x="825" y="192" text-anchor="middle" font-size="12" fill="#6b7280">(Фіксований сигнал)</text>

    <!-- Pin Connections -->
    <text x="753" y="160" text-anchor="start" font-size="12" fill="#1a1a1a">VCC</text>
    <text x="753" y="224" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">Вхід FB</text>
    <text x="753" y="306" text-anchor="start" font-size="12" fill="#1a1a1a">GND</text>

    <rect x="757" y="238" width="136" height="48" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
    <text x="825" y="256" text-anchor="middle" font-size="12" fill="#1a1a1a">Сприймає як</text>
    <text x="825" y="274" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">«Вал у центрі»</text>

    <!-- Description Box Bottom -->
    <rect x="505" y="345" width="415" height="100" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <text x="520" y="365" font-size="13" font-weight="bold" fill="#27ae60">Переваги модифікованого дільника:</text>
    <text x="520" y="385" font-size="12" fill="#1a1a1a">• Два одинакових резистори дають точні 2.5V</text>
    <text x="520" y="405" font-size="12" fill="#1a1a1a">• Імпульс 1.5 мс = стоп; &lt;1.5 мс / &gt;1.5 мс = рух</text>
    <text x="520" y="425" font-size="12" fill="#2457d6">• Безперервне обертання 360° в обох напрямках</text>
  </g>
</svg>
