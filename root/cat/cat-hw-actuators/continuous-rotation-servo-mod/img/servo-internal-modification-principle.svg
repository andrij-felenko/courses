<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>

  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принцип внутрішньої модифікації сервопривода</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Вилучення обмежувача та заміна потенціометра дільником перетворюють ШІМ-позиціонування на керування швидкістю</text>

  <rect x="30" y="72" width="435" height="448" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="30" y="72" width="435" height="36" rx="8" fill="#fdecea"/>
  <rect x="30" y="96" width="435" height="12" fill="#fdecea"/>
  <rect x="30" y="72" width="435" height="36" rx="8" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <text x="247" y="95" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">1. Стандартний позиційний сервопривод (180°)</text>

  <rect x="45" y="118" width="405" height="120" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="58" y="136" font-size="12" font-weight="bold" fill="#1a1a1a">Механіка: обмежувач кута обертання</text>
  
  <g transform="translate(0, 0)">
    <circle cx="120" cy="178" r="26" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <circle cx="120" cy="178" r="7" fill="#2457d6"/>
    <circle cx="120" cy="178" r="23" fill="none" stroke="#2457d6" stroke-width="1" stroke-dasharray="4,4"/>
    <rect x="135" y="158" width="10" height="12" rx="1" fill="#c0392b"/>
    <rect x="141" y="144" width="12" height="14" rx="1" fill="#1a1a1a"/>
    <path d="M 143 154 L 149 160 M 149 154 L 143 160" stroke="#c0392b" stroke-width="1.5"/>
    <path d="M 98 166 A 24 24 0 0 1 138 186" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-red)"/>
    <text x="120" y="224" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Кут обмежено: 0°–180°</text>
  </g>
  
  <rect x="210" y="142" width="225" height="82" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="220" y="160" font-size="12" font-weight="bold" fill="#c0392b">Механічний упор (стопор)</text>
  <text x="220" y="179" font-size="12" fill="#1a1a1a">Зуб на вихідній шестерні</text>
  <text x="220" y="197" font-size="12" fill="#1a1a1a">впирається в виступ корпусу,</text>
  <text x="220" y="215" font-size="12" fill="#6b7280">блокуючи обертання понад 180°</text>

  <rect x="45" y="250" width="405" height="120" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="58" y="268" font-size="12" font-weight="bold" fill="#1a1a1a">Електроніка: потенціометр зворотного зв'язку</text>

  <text x="90" y="286" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">V_CC</text>
  <line x1="95" y1="282" x2="115" y2="282" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M 115 282 L 115 288 L 121 292 L 109 300 L 121 308 L 109 316 L 121 324 L 115 328 L 115 336" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="115" y1="336" x2="115" y2="342" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="105" y1="342" x2="125" y2="342" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="109" y1="346" x2="121" y2="346" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="112" y1="350" x2="118" y2="350" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="90" y="346" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="end">GND</text>

  <path d="M 148 308 L 123 308" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="154" y="312" font-size="12" font-weight="bold" fill="#2457d6">V_fb(α)</text>

  <path d="M 115 238 L 115 270" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="122" y="256" font-size="12" fill="#6b7280">зв'язок</text>

  <rect x="210" y="274" width="225" height="84" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="220" y="292" font-size="12" font-weight="bold" fill="#c0392b">Змінна напруга V_fb(α)</text>
  <text x="220" y="311" font-size="12" fill="#1a1a1a">Потенціометр R_pot обертається</text>
  <text x="220" y="329" font-size="12" fill="#1a1a1a">разом з валом. Плата вимикає</text>
  <text x="220" y="347" font-size="12" fill="#6b7280">мотор при досягненні V_fb = V_target</text>

  <rect x="45" y="382" width="405" height="126" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="58" y="400" font-size="12" font-weight="bold" fill="#1a1a1a">Характеристика керування: кутова позиція вала</text>

  <text x="58" y="420" font-size="12" fill="#1a1a1a">• ШІМ 1,0 мс (5%):</text>
  <text x="200" y="420" font-size="12" font-weight="bold" fill="#1a1a1a">Кут α = 0° (крайнє ліве)</text>

  <text x="58" y="439" font-size="12" fill="#1a1a1a">• ШІМ 1,5 мс (7.5%):</text>
  <text x="200" y="439" font-size="12" font-weight="bold" fill="#2457d6">Кут α = 90° (нейтраль)</text>

  <text x="58" y="458" font-size="12" fill="#1a1a1a">• ШІМ 2,0 мс (10%):</text>
  <text x="200" y="458" font-size="12" font-weight="bold" fill="#1a1a1a">Кут α = 180° (крайнє праве)</text>

  <rect x="55" y="472" width="385" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="247" y="489" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Результат: Тривалість ШІМ задає КУТ ВАЛА</text>


  <!-- ================= RIGHT PANEL: MODIFIED SERVO ================= -->
  <rect x="495" y="72" width="435" height="448" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="495" y="72" width="435" height="36" rx="8" fill="#e9f7ef"/>
  <rect x="495" y="96" width="435" height="12" fill="#e9f7ef"/>
  <rect x="495" y="72" width="435" height="36" rx="8" fill="none" stroke="#27ae60" stroke-width="1.5"/>
  <text x="712" y="95" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">2. Модифікований сервопривод (постійне обертання)</text>

  <rect x="510" y="118" width="405" height="120" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="523" y="136" font-size="12" font-weight="bold" fill="#1a1a1a">Механіка: безперервне обертання 360°</text>

  <g transform="translate(0, 0)">
    <circle cx="585" cy="178" r="26" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
    <circle cx="585" cy="178" r="7" fill="#27ae60"/>
    <circle cx="585" cy="178" r="23" fill="none" stroke="#27ae60" stroke-width="1" stroke-dasharray="4,4"/>
    <rect x="600" y="158" width="10" height="12" rx="1" fill="none" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
    <path d="M 598 156 L 612 172 M 612 156 L 598 172" stroke="#c0392b" stroke-width="1.5"/>
    <path d="M 585 146 A 32 32 0 1 1 584 146" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
    <text x="585" y="224" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Обертання: 360° (безмежне)</text>
  </g>

  <rect x="675" y="142" width="225" height="82" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="685" y="160" font-size="12" font-weight="bold" fill="#27ae60">Обмежувач спиляно / вилучено</text>
  <text x="685" y="179" font-size="12" fill="#1a1a1a">Зрізано механічний зуб шестерні.</text>
  <text x="685" y="197" font-size="12" fill="#1a1a1a">Вал приводу може вільно</text>
  <text x="685" y="215" font-size="12" fill="#6b7280">обертатися на необмежений кут</text>

  <rect x="510" y="250" width="405" height="120" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="523" y="268" font-size="12" font-weight="bold" fill="#1a1a1a">Електроніка: розрив зворотного зв'язку (R1 = R2)</text>

  <text x="555" y="286" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">V_CC</text>
  <line x1="560" y1="282" x2="580" y2="282" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="574" y="288" width="12" height="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="568" y="301" font-size="12" fill="#6b7280" text-anchor="end">R1</text>
  <line x1="580" y1="282" x2="580" y2="288" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="580" y1="306" x2="580" y2="312" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="580" y1="309" x2="605" y2="309" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="585" y="297" font-size="12" font-weight="bold" fill="#27ae60">V_fb = V_CC/2</text>
  <rect x="574" y="312" width="12" height="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="568" y="326" font-size="12" fill="#6b7280" text-anchor="end">R2</text>
  <line x1="580" y1="330" x2="580" y2="336" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="570" y1="336" x2="590" y2="336" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="574" y1="340" x2="586" y2="340" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="577" y1="344" x2="583" y2="344" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="555" y="340" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="end">GND</text>

  <path d="M 580 238 L 580 258" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <path d="M 574 252 L 586 264 M 586 252 L 574 264" stroke="#c0392b" stroke-width="1.5"/>

  <rect x="675" y="274" width="225" height="84" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="685" y="292" font-size="12" font-weight="bold" fill="#27ae60">Фіксована напруга V_CC / 2</text>
  <text x="685" y="311" font-size="12" fill="#1a1a1a">Дільник R1=R2 (2.2 кОм) фіксує</text>
  <text x="685" y="329" font-size="12" fill="#1a1a1a">V_fb у нейтралі. Плата вважає,</text>
  <text x="685" y="347" font-size="12" fill="#6b7280">що вал не досяг цілі, і крутить далі</text>

  <rect x="510" y="382" width="405" height="126" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="523" y="400" font-size="12" font-weight="bold" fill="#1a1a1a">Характеристика керування: напрямок і швидкість</text>

  <text x="523" y="420" font-size="12" fill="#1a1a1a">• ШІМ &lt; 1,5 мс (1,0 мс):</text>
  <text x="695" y="420" font-size="12" font-weight="bold" fill="#1a1a1a">Обертання CCW (проти годин.)</text>

  <text x="523" y="439" font-size="12" fill="#1a1a1a">• ШІМ = 1,5 мс (нейтраль):</text>
  <text x="695" y="439" font-size="12" font-weight="bold" fill="#27ae60">Стоп (зона нейтралі / 0 об/хв)</text>

  <text x="523" y="458" font-size="12" fill="#1a1a1a">• ШІМ &gt; 1,5 мс (2,0 мс):</text>
  <text x="695" y="458" font-size="12" font-weight="bold" fill="#1a1a1a">Обертання CW (за годинником)</text>

  <rect x="520" y="472" width="385" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712" y="489" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Результат: ШІМ задає НАПРЯМОК І ШВИДКІСТЬ</text>

</svg>
