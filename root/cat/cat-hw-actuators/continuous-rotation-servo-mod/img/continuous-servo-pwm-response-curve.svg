<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>

  <!-- Header -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Характеристика керування сервоприводом постійного обертання</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Залежність кутової швидкості ω та напрямку обертання від тривалості імпульсу t_p</text>

  <!-- Left Panel: Waveforms -->
  <rect x="25" y="75" width="445" height="440" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Часові діаграми ШІМ-сигналу (T = 20 мс)</text>

  <!-- Sub-block 1: tp = 1.0 ms -->
  <rect x="40" y="112" width="415" height="110" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="52" y="132" font-size="12" font-weight="bold" fill="#c0392b">t_p = 1.0 мс — Максимальна швидкість CCW (Реверс)</text>

  <rect x="105" y="158" width="16" height="40" fill="#fdecea"/>
  <line x1="105" y1="150" x2="105" y2="202" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="121" y1="150" x2="121" y2="202" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="113" y="149" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">1.0 мс</text>

  <path d="M 75,198 L 105,198 L 105,158 L 121,158 L 121,198 L 320,198" fill="none" stroke="#c0392b" stroke-width="2"/>
  <line x1="75" y1="198" x2="325" y2="198" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>

  <circle cx="355" cy="178" r="18" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <path d="M 367,178 A 12 12 0 1 0 355,190" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="382" y="174" font-size="13" font-weight="bold" fill="#c0392b">↺ -ω_max</text>
  <text x="382" y="190" font-size="11" fill="#6b7280">Макс. CCW</text>

  <!-- Sub-block 2: tp = 1.5 ms -->
  <rect x="40" y="232" width="415" height="110" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="52" y="252" font-size="12" font-weight="bold" fill="#2457d6">t_p = 1.5 мс — Нейтральне положення (ω = 0, Стоп)</text>

  <rect x="105" y="278" width="24" height="40" fill="#eaf0fd"/>
  <line x1="105" y1="270" x2="105" y2="322" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="129" y1="270" x2="129" y2="322" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="117" y="269" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">1.5 мс</text>

  <path d="M 75,318 L 105,318 L 105,278 L 129,278 L 129,318 L 320,318" fill="none" stroke="#2457d6" stroke-width="2"/>
  <line x1="75" y1="318" x2="325" y2="318" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>

  <circle cx="355" cy="298" r="18" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="355" cy="298" r="5" fill="#2457d6"/>
  <text x="382" y="294" font-size="13" font-weight="bold" fill="#2457d6">ω = 0</text>
  <text x="382" y="310" font-size="11" fill="#6b7280">Вал нерухомий</text>

  <!-- Sub-block 3: tp = 2.0 ms -->
  <rect x="40" y="352" width="415" height="110" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="52" y="372" font-size="12" font-weight="bold" fill="#27ae60">t_p = 2.0 мс — Максимальна швидкість CW (Вперед)</text>

  <rect x="105" y="398" width="32" height="40" fill="#e9f7ef"/>
  <line x1="105" y1="390" x2="105" y2="442" stroke="#27ae60" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="137" y1="390" x2="137" y2="442" stroke="#27ae60" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="121" y="389" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">2.0 мс</text>

  <path d="M 75,438 L 105,438 L 105,398 L 137,398 L 137,438 L 320,438" fill="none" stroke="#27ae60" stroke-width="2"/>
  <line x1="75" y1="438" x2="325" y2="438" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>

  <circle cx="355" cy="418" r="18" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <path d="M 343,418 A 12 12 0 1 1 355,430" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="382" y="414" font-size="13" font-weight="bold" fill="#27ae60">↻ +ω_max</text>
  <text x="382" y="430" font-size="11" fill="#6b7280">Макс. CW</text>

  <!-- Left Panel Footer -->
  <rect x="40" y="472" width="415" height="30" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="247" y="491" text-anchor="middle" font-size="11" fill="#6b7280">Період ШІМ T = 20 мс (частота f = 50 Гц)</text>

  <!-- Right Panel: Response Curve -->
  <rect x="490" y="75" width="445" height="440" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="712" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Залежність кутової швидкості ω від тривалості t_p</text>

  <!-- Graph Container -->
  <rect x="515" y="115" width="395" height="345" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Deadband Shaded Band -->
  <rect x="710" y="186" width="25" height="240" fill="#2457d6" opacity="0.12"/>
  <line x1="710" y1="186" x2="710" y2="426" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="735" y1="186" x2="735" y2="426" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Grid lines -->
  <line x1="565" y1="165" x2="870" y2="165" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="565" y1="405" x2="870" y2="405" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2,2"/>

  <line x1="615" y1="285" x2="615" y2="426" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="830" y1="165" x2="830" y2="285" stroke="#e5e7eb" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Axes -->
  <!-- Y axis -->
  <line x1="565" y1="430" x2="565" y2="140" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="530" y="138" font-size="12" font-weight="bold" fill="#1a1a1a">ω (швидкість)</text>

  <!-- X axis (y = 285) -->
  <line x1="555" y1="285" x2="885" y2="285" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="895" y="302" text-anchor="end" font-size="11" font-weight="bold" fill="#1a1a1a">t_p (мс)</text>

  <!-- Y Ticks -->
  <line x1="560" y1="165" x2="565" y2="165" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="555" y="169" text-anchor="end" font-size="11" font-weight="bold" fill="#27ae60">+ω_max</text>

  <text x="555" y="289" text-anchor="end" font-size="11" font-weight="bold" fill="#6b7280">0</text>

  <line x1="560" y1="405" x2="565" y2="405" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="555" y="409" text-anchor="end" font-size="11" font-weight="bold" fill="#c0392b">-ω_max</text>

  <!-- X Ticks & Labels -->
  <line x1="615" y1="285" x2="615" y2="290" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="615" y="445" text-anchor="middle" font-size="11" fill="#1a1a1a">1.0</text>

  <line x1="722" y1="285" x2="722" y2="290" stroke="#2457d6" stroke-width="1.5"/>
  <text x="722" y="445" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">1.5</text>

  <line x1="830" y1="285" x2="830" y2="290" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="830" y="445" text-anchor="middle" font-size="11" fill="#1a1a1a">2.0</text>

  <!-- Response Curve Line -->
  <path d="M 580,405 L 615,405 L 710,285 L 735,285 L 830,165 L 865,165" fill="none" stroke="#2457d6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Key Data Points -->
  <circle cx="615" cy="405" r="4" fill="#c0392b"/>
  <circle cx="710" cy="285" r="4" fill="#2457d6"/>
  <circle cx="735" cy="285" r="4" fill="#2457d6"/>
  <circle cx="830" cy="165" r="4" fill="#27ae60"/>

  <!-- Deadband Callout Box -->
  <rect x="660" y="140" width="125" height="46" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="722" y="157" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Мертва зона</text>
  <text x="722" y="173" text-anchor="middle" font-size="11" fill="#2457d6">1.45 мс – 1.55 мс</text>

  <!-- Region Badges -->
  <!-- CCW Proportional Badge -->
  <rect x="600" y="325" width="90" height="32" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="0.8"/>
  <text x="645" y="339" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Пропорційна</text>
  <text x="645" y="351" text-anchor="middle" font-size="11" fill="#c0392b">зони CCW</text>

  <!-- CW Proportional Badge -->
  <rect x="755" y="215" width="90" height="32" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="0.8"/>
  <text x="800" y="229" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Пропорційна</text>
  <text x="800" y="241" text-anchor="middle" font-size="11" fill="#27ae60">зони CW</text>

  <!-- Saturation Annotations -->
  <text x="590" y="390" font-size="11" font-style="italic" fill="#c0392b">Насичення</text>
  <text x="840" y="185" font-size="11" font-style="italic" fill="#27ae60">Насичення</text>

  <!-- Right Panel Footer -->
  <rect x="505" y="472" width="415" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="712" y="491" text-anchor="middle" font-size="11" fill="#1a1a1a">ШІМ задає <tspan font-weight="bold" fill="#2457d6">швидкість та напрямок</tspan>, а не позиційний кут</text>
</svg>
