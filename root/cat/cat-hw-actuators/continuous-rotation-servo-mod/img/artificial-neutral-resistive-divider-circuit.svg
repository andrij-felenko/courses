<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="42" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема штучної нейтралі на симетричному дільнику напруги</text>
  <text x="480" y="65" font-size="13" fill="#6b7280" text-anchor="middle">Заміна потенціометра опорами R₁ = R₂ фіксує нейтраль, але дрейф ΔR зміщує її за мертву зону</text>

  <!-- PANEL 1: Electrical Schematic -->
  <rect x="40" y="90" width="430" height="390" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="255" y="120" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Електрична схема дільника напруги</text>

  <!-- Top Rail Vcc -->
  <text x="190" y="152" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">V_CC (+5V)</text>
  <line x1="140" y1="162" x2="240" y2="162" stroke="#2457d6" stroke-width="2"/>
  <circle cx="190" cy="162" r="3.5" fill="#2457d6"/>

  <!-- Wire top rail to R1 -->
  <line x1="190" y1="162" x2="190" y2="190" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Resistor R1 -->
  <rect x="176" y="190" width="28" height="60" rx="2" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="190" y="226" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">R₁</text>
  <text x="165" y="215" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">R₁ = R</text>
  <text x="165" y="233" font-size="12" fill="#6b7280" text-anchor="end">(10 kΩ, 1%)</text>

  <!-- Wire R1 to Node Vn -->
  <line x1="190" y1="250" x2="190" y2="270" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Node Vn -->
  <circle cx="190" cy="270" r="4.5" fill="#2457d6"/>

  <!-- Wire Node Vn to R2 -->
  <line x1="190" y1="270" x2="190" y2="290" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Resistor R2 -->
  <rect x="176" y="290" width="28" height="60" rx="2" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <text x="190" y="326" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">R₂</text>
  <text x="165" y="315" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">R₂ = R</text>
  <text x="165" y="333" font-size="12" fill="#6b7280" text-anchor="end">(10 kΩ, 1%)</text>

  <!-- Wire R2 to GND rail -->
  <line x1="190" y1="350" x2="190" y2="375" stroke="#1a1a1a" stroke-width="2"/>

  <!-- GND Symbol -->
  <line x1="170" y1="375" x2="210" y2="375" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="177" y1="380" x2="203" y2="380" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="184" y1="385" x2="196" y2="385" stroke="#1a1a1a" stroke-width="2"/>
  <text x="190" y="405" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GND (0V)</text>

  <!-- Output wire to error amplifier -->
  <text x="246" y="255" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">V_N = 2.50 V</text>
  <line x1="190" y1="270" x2="302" y2="270" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Error Amplifier IC Box -->
  <rect x="305" y="215" width="140" height="110" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="375" y="242" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Підсилювач</text>
  <text x="375" y="260" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">помилки (FB)</text>
  <text x="375" y="278" font-size="12" fill="#6b7280" text-anchor="middle">(плата серво)</text>
  <text x="312" y="300" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Вхід нейтралі</text>

  <!-- Panel 1 Solution Callout -->
  <rect x="55" y="425" width="400" height="38" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="255" y="449" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">✔ R₁ = R₂ фіксують 50% V_CC без потенціометра</text>

  <!-- PANEL 2: Temperature Drift & Neutral Shift -->
  <rect x="490" y="90" width="430" height="390" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="705" y="120" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Вплив температурного дрейфу на нейтраль</text>

  <!-- Section 2A Title -->
  <text x="510" y="140" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">Шкала напруги нейтралі та зона самоходу:</text>

  <!-- Deadband Zone Rect -->
  <rect x="630" y="148" width="100" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="680" y="165" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Мертва зона</text>

  <!-- Self-rotation Zone Rect -->
  <rect x="736" y="148" width="154" height="26" rx="4" fill="#fdecea" stroke="#c0392b" stroke-dasharray="3,3" stroke-width="1.5"/>
  <text x="813" y="165" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Зона самоходу (ω &gt; 0)</text>

  <!-- Drift Text and Arrow -->
  <text x="728" y="191" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">ΔV_N (дрейф)</text>
  <line x1="684" y1="198" x2="767" y2="198" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Voltage Axis Line & Ticks -->
  <line x1="510" y1="206" x2="890" y2="206" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="530" y1="201" x2="530" y2="211" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="680" y1="199" x2="680" y2="213" stroke="#27ae60" stroke-width="2"/>
  <line x1="775" y1="199" x2="775" y2="213" stroke="#c0392b" stroke-width="2"/>
  <line x1="870" y1="201" x2="870" y2="211" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Neutral Points Dots -->
  <circle cx="680" cy="206" r="4.5" fill="#27ae60"/>
  <circle cx="775" cy="206" r="4.5" fill="#c0392b"/>

  <!-- Voltage Labels Under Axis -->
  <text x="640" y="226" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">V_N = 2.50 V (25°C)</text>
  <text x="795" y="226" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">V_N' = 2.56 V (60°C)</text>

  <!-- Box A: Math Formula -->
  <rect x="510" y="245" width="390" height="105" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="525" y="266" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">Математика температурного дрейфу:</text>
  <text x="705" y="289" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">V_N(T) = V_CC · [ R₂(T) / ( R₁(T) + R₂(T) ) ]</text>
  <text x="705" y="312" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">ΔV_N ≈ (V_CC / 4) · ( α₂ - α₁ ) · ΔT</text>
  <text x="705" y="334" font-size="12" fill="#6b7280" text-anchor="middle">де α₁, α₂ — температурні коефіцієнти опору (TCR)</text>

  <!-- Box B: Engineering Solution Bullets -->
  <rect x="510" y="365" width="390" height="100" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="525" y="386" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="start">Як мінімізувати дрейф нейтралі:</text>
  <text x="525" y="407" font-size="12" fill="#1a1a1a" text-anchor="start">• Резистори з однієї партії (однаковий TCR: α₁ ≈ α₂)</text>
  <text x="525" y="426" font-size="12" fill="#1a1a1a" text-anchor="start">• Прецизійні опори 1% або 0.1% (TCR ≤ 25 ppm/°C)</text>
  <text x="525" y="445" font-size="12" fill="#1a1a1a" text-anchor="start">• Програмне розширення мертвих зон на контролері</text>
</svg>
