<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розв'язка живлення та зіркова земля (Star GND) для сервоприводів</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Роздільні шини 5–6 В і 3.3 В з буферним C_buf захищають MCU від просідань і струмових петель</text>

  <!-- ==================== ЛІВА ПАНЕЛЬ: ТОПОЛОГІЯ ТА СХЕМА ==================== -->
  <rect x="24" y="74" width="536" height="426" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Заголовок лівої панелі -->
  <rect x="36" y="86" width="512" height="26" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="292" y="104" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Топологічна схема: розв'язка шин, Star GND та буфер C_buf</text>

  <!-- Виділена зона силового контуру -->
  <rect x="250" y="306" width="298" height="136" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="5,4"/>
  <text x="328" y="322" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Контур струму I_servo</text>

  <!-- Блок: Мікроконтролер MCU 3.3 В -->
  <rect x="42" y="124" width="124" height="80" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="104" y="146" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">МК (MCU)</text>
  <text x="104" y="164" font-size="12" fill="#6b7280" text-anchor="middle">Логіка 3.3 В</text>
  <text x="104" y="190" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">GND_mcu (чиста)</text>

  <!-- Блок: Стабілізатор LDO 3.3 В -->
  <rect x="42" y="224" width="124" height="72" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="104" y="246" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">LDO 3.3 В</text>
  <text x="104" y="264" font-size="12" fill="#6b7280" text-anchor="middle">Стабілізатор</text>
  <text x="104" y="284" font-size="12" fill="#27ae60" text-anchor="middle">V_logic = 3.3 В</text>

  <!-- Блок: Джерело живлення 5–6 В -->
  <rect x="42" y="316" width="124" height="78" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="104" y="338" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Джерело 5–6 В</text>
  <text x="104" y="356" font-size="12" fill="#6b7280" text-anchor="middle">Батарея / БЖ</text>
  <text x="104" y="380" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">V_ext (+5...6 В)</text>

  <!-- Зіркова точка (Star GND) -->
  <circle cx="210" cy="372" r="6" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="210" y="394" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Star GND</text>

  <!-- Блок: Буферний конденсатор C_buf -->
  <rect x="264" y="330" width="124" height="96" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="326" y="350" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Буфер C_buf</text>
  <text x="326" y="370" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1000 мкФ Low-ESR</text>
  <text x="326" y="390" font-size="12" fill="#6b7280" text-anchor="middle">+ 0.1 мкФ кераміка</text>
  <text x="326" y="412" font-size="12" fill="#27ae60" text-anchor="middle">Гасить піки струму</text>

  <!-- Блок: Сервопривід 1 -->
  <rect x="418" y="124" width="128" height="80" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="482" y="146" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Сервопривід 1</text>
  <text x="482" y="164" font-size="12" fill="#6b7280" text-anchor="middle">Постійне обертання</text>
  <text x="482" y="190" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">V+ | PGND | PWM1</text>

  <!-- Блок: Сервопривід 2 -->
  <rect x="418" y="224" width="128" height="80" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="482" y="246" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Сервопривід 2</text>
  <text x="482" y="264" font-size="12" fill="#6b7280" text-anchor="middle">Постійне обертання</text>
  <text x="482" y="290" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">V+ | PGND | PWM2</text>

  <!-- ==================== ПРОВОДИ ТА З'ЄДНАННЯ ЛІВОЇ ПАНЕЛІ ==================== -->
  <!-- Живлення 3.3 В: від LDO до MCU -->
  <line x1="84" y1="224" x2="84" y2="204" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Живлення LDO від БЖ: +5-6 В -->
  <line x1="84" y1="316" x2="84" y2="296" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Чиста земля GND_mcu від Star GND до MCU та LDO -->
  <path d="M 210,366 L 210,214 L 166,214 L 136,214 L 136,204" fill="none" stroke="#27ae60" stroke-width="2"/>
  <line x1="136" y1="214" x2="136" y2="224" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Силова шина +5...6 В від БЖ до C_buf і Сервоприводів -->
  <path d="M 166,336 L 264,336" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <path d="M 388,336 L 408,336 L 408,180 L 418,180" fill="none" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <path d="M 408,280 L 418,280" fill="none" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>

  <!-- З'єднання 0 В від БЖ до Star GND -->
  <line x1="166" y1="372" x2="204" y2="372" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- Силова земля PGND від Star GND до C_buf та Сервоприводів -->
  <path d="M 216,372 L 264,372" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <path d="M 388,372 L 414,372 L 414,196 L 418,196" fill="none" stroke="#1a1a1a" stroke-width="3"/>
  <path d="M 414,296 L 418,296" fill="none" stroke="#1a1a1a" stroke-width="3"/>

  <!-- Керувальні лінії ШІМ від MCU до Сервоприводів -->
  <path d="M 166,138 L 418,138" fill="none" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <text x="290" y="132" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ШІМ 1 (50 Гц)</text>

  <path d="M 166,158 L 248,158 L 248,238 L 418,238" fill="none" stroke="#2457d6" stroke-width="1.8" marker-end="url(#arr-blue)"/>
  <text x="334" y="232" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ШІМ 2 (50 Гц)</text>

  <!-- Підпис чистої землі -->
  <text x="170" y="210" font-size="12" font-weight="bold" fill="#27ae60">I_mcu ≈ 0 A</text>

  <!-- Підсумок лівої панелі -->
  <rect x="36" y="454" width="512" height="34" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="292" y="475" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">✔ Силові струми замикаються в C_buf і Star GND, захищаючи логіку</text>

  <!-- ==================== ПРАВА ПАНЕЛЬ: ОСЦИЛОГРАМИ ==================== -->
  <rect x="576" y="74" width="360" height="426" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Заголовок правої панелі -->
  <rect x="588" y="86" width="336" height="26" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="756" y="104" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Осцилограми пуску: струми та стабільність напруги</text>

  <!-- Графік 1: Пусковий струм I_servo -->
  <text x="646" y="126" font-size="12" font-weight="bold" fill="#1a1a1a">Струм сервоприводів I_servo</text>
  <rect x="646" y="132" width="274" height="74" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="640" y="146" font-size="12" fill="#6b7280" text-anchor="end">2.0 А</text>
  <text x="640" y="172" font-size="12" fill="#6b7280" text-anchor="end">1.0 А</text>
  <text x="640" y="198" font-size="12" fill="#6b7280" text-anchor="end">0.0 А</text>

  <!-- Сітка графіка 1 -->
  <line x1="646" y1="168" x2="920" y2="168" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="646" y1="194" x2="920" y2="194" stroke="#d0d7de" stroke-width="1"/>

  <!-- Крива струму I_servo -->
  <path d="M 650,194 L 720,194 L 724,142 L 738,150 L 758,182 L 790,186 L 916,186" fill="none" stroke="#2457d6" stroke-width="2.2"/>
  <circle cx="724" cy="142" r="3.5" fill="#c0392b"/>
  <text x="734" y="142" font-size="12" font-weight="bold" fill="#c0392b">Пік пуску: 1.9 А</text>
  <text x="810" y="180" font-size="12" fill="#6b7280">I_run ≈ 0.4 А</text>

  <!-- Графік 2: Силова напруга V_servo -->
  <text x="646" y="224" font-size="12" font-weight="bold" fill="#1a1a1a">Силова напруга V_servo (5–6 В)</text>
  <rect x="646" y="230" width="274" height="74" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="640" y="244" font-size="12" fill="#6b7280" text-anchor="end">5.0 В</text>
  <text x="640" y="270" font-size="12" fill="#6b7280" text-anchor="end">4.0 В</text>
  <text x="640" y="296" font-size="12" fill="#6b7280" text-anchor="end">3.0 В</text>

  <!-- Сітка графіка 2 -->
  <line x1="646" y1="266" x2="920" y2="266" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="646" y1="292" x2="920" y2="292" stroke="#d0d7de" stroke-width="1"/>

  <!-- Криві V_servo: з C_buf та без C_buf -->
  <!-- Зелена: з C_buf -->
  <path d="M 650,244 L 720,244 L 732,252 L 754,246 L 916,246" fill="none" stroke="#27ae60" stroke-width="2.2"/>
  <text x="738" y="260" font-size="12" font-weight="bold" fill="#27ae60">З C_buf: ΔV ≈ 0.4 В</text>

  <!-- Червона пунктирна: без C_buf -->
  <path d="M 650,244 L 720,244 L 726,290 L 744,278 L 766,256 L 916,256" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4,3"/>
  <text x="734" y="284" font-size="12" font-weight="bold" fill="#c0392b">Без C_buf: спад до 3.1 В</text>

  <!-- Графік 3: Логічна напруга MCU V_mcu та поріг V_BOR -->
  <text x="646" y="322" font-size="12" font-weight="bold" fill="#1a1a1a">Логічна напруга MCU V_mcu (3.3 В)</text>
  <rect x="646" y="328" width="274" height="74" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="640" y="344" font-size="12" fill="#6b7280" text-anchor="end">3.3 В</text>
  <text x="640" y="368" font-size="12" fill="#6b7280" text-anchor="end">2.7 В</text>
  <text x="640" y="394" font-size="12" fill="#6b7280" text-anchor="end">0.0 В</text>

  <!-- Поріг Brown-out Reset (2.7 В) -->
  <line x1="646" y1="364" x2="920" y2="364" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3,3"/>
  <text x="826" y="360" font-size="12" fill="#c0392b">V_BOR (2.7 В)</text>

  <!-- Зелена лінія: чисті 3.3 В зі Star GND -->
  <line x1="650" y1="344" x2="916" y2="344" stroke="#27ae60" stroke-width="2.2"/>
  <text x="774" y="340" font-size="12" font-weight="bold" fill="#27ae60">Зі Star GND: 3.3 В</text>

  <!-- Червона пунктирна лінія: без Star GND (скидання) -->
  <path d="M 650,344 L 720,344 L 726,376 L 734,394 L 752,394 L 766,344 L 916,344" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="4,3"/>
  <text x="770" y="390" font-size="12" font-weight="bold" fill="#c0392b">Ресет (V &lt; V_BOR)</text>

  <!-- Загальна вісь часу / мітка пуску -->
  <line x1="720" y1="132" x2="720" y2="408" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="720" y="422" font-size="12" fill="#6b7280" text-anchor="middle">t_пуск</text>
  <text x="820" y="422" font-size="12" fill="#6b7280" text-anchor="middle">Час t (мс)</text>

  <!-- Підсумок правої панелі -->
  <rect x="588" y="454" width="336" height="34" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="756" y="475" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Star GND і C_buf усувають просідання та збої MCU</text>
</svg>
