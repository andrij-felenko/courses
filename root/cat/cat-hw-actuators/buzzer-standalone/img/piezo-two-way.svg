<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="940" height="560" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="470.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="16" fill="#1a1a1a" text-anchor="middle" font-weight="700">Два боки одного ефекту — і хто який відкрив</text>
<rect x="48.0" y="60.0" width="400.0" height="300.0" rx="12" fill="#fffaf0" stroke="#d6a419" stroke-width="1.8"/>
<text x="248.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#9a7400" text-anchor="middle" font-weight="700">Прямий ефект</text>
<text x="248.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">тиск  →  заряд</text>
<path d="M 170.0 210.0 Q 248.0 210.0 326.0 210.0" fill="none" stroke="#9aa4b0" stroke-width="5"/>
<path d="M 182.0 201.0 Q 248.0 201.0 314.0 201.0" fill="none" stroke="#d6a419" stroke-width="9"/>
<line x1="202.0" y1="148.0" x2="202.0" y2="186.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<line x1="294.0" y1="148.0" x2="294.0" y2="186.0" stroke="#c0392b" stroke-width="2.4" marker-end="url(#arrow)"/>
<text x="248.0" y="140.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">стиск</text>
<circle cx="156.0" cy="206.0" r="11.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="156.0" y="210.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<circle cx="340.0" cy="206.0" r="11.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="340.0" y="210.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<text x="248.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle">стиснув кристал → на гранях виступає заряд</text>
<rect x="98.0" y="310.8" width="300.0" height="30.5" rx="6" fill="#fff6e0" stroke="#d6a419" stroke-width="1.5"/><text x="248.0" y="329.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="248.0" dy="0.0">запальничка, мікрофон, датчик удару</tspan></text>
<rect x="492.0" y="60.0" width="400.0" height="300.0" rx="12" fill="#eef2f8" stroke="#2457d6" stroke-width="1.8"/>
<text x="692.0" y="90.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="14" fill="#2457d6" text-anchor="middle" font-weight="700">Зворотний ефект</text>
<text x="692.0" y="112.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700">напруга  →  деформація</text>
<path d="M 614.0 210.0 Q 692.0 180.0 770.0 210.0" fill="none" stroke="#9aa4b0" stroke-width="5"/>
<path d="M 626.0 201.0 Q 692.0 166.5 758.0 201.0" fill="none" stroke="#d6a419" stroke-width="9"/>
<circle cx="596.0" cy="204.0" r="11.0" fill="#fdecea" stroke="#c0392b" stroke-width="2.0"/><text x="596.0" y="208.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#c0392b" text-anchor="middle" font-weight="700">+</text>
<circle cx="596.0" cy="232.0" r="11.0" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.0"/><text x="596.0" y="236.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="19" fill="#2457d6" text-anchor="middle" font-weight="700">−</text>
<line x1="608.0" y1="204.0" x2="632.0" y2="204.0" stroke="#c0392b" stroke-width="1.8"/>
<line x1="608.0" y1="232.0" x2="632.0" y2="232.0" stroke="#2457d6" stroke-width="1.8"/>
<text x="596.0" y="256.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">напруга</text>
<text x="788.0" y="184.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#c0392b" text-anchor="middle" font-weight="700">↑ вигин</text>
<text x="692.0" y="294.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">подав напругу → диск сам вигинається, штовхає повітря</text>
<rect x="542.0" y="310.5" width="300.0" height="31.0" rx="6" fill="#dfeafc" stroke="#2457d6" stroke-width="1.5"/><text x="692.0" y="329.9" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="692.0" dy="0.0">ЗУМЕР — саме цей бік</tspan></text>
<line x1="454.0" y1="210.0" x2="486.0" y2="210.0" stroke="#6b7280" stroke-width="2.6" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
<text x="470.0" y="198.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle" font-weight="700">оборотно</text>
<text x="470.0" y="400.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle" font-weight="700">Хто що зробив — честь спільна</text>
<rect x="85.0" y="426.3" width="250.0" height="71.4" rx="6" fill="#fffaf0" stroke="#d6a419" stroke-width="1.5"/><text x="210.0" y="445.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="210.0" dy="0.0">БРАТИ КЮРІ, 1880</tspan><tspan x="210.0" dy="13.7">(французи, Париж)</tspan><tspan x="210.0" dy="13.7">прямий ефект:</tspan><tspan x="210.0" dy="13.7">ідея з симетрії + дослід</tspan></text>
<rect x="345.0" y="426.3" width="250.0" height="71.4" rx="6" fill="#eef2f8" stroke="#2457d6" stroke-width="1.5"/><text x="470.0" y="445.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="470.0" dy="0.0">ЛІППМАН, 1881</tspan><tspan x="470.0" dy="13.7">передбачив зворотний</tspan><tspan x="470.0" dy="13.7">ефект — із термодинаміки</tspan><tspan x="470.0" dy="13.7">(на папері, не руками)</tspan></text>
<rect x="605.0" y="426.3" width="250.0" height="71.4" rx="6" fill="#fffaf0" stroke="#d6a419" stroke-width="1.5"/><text x="730.0" y="445.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle"><tspan x="730.0" dy="0.0">БРАТИ КЮРІ, 1881</tspan><tspan x="730.0" dy="13.7">підтвердили зворотний</tspan><tspan x="730.0" dy="13.7">дослідом і довели</tspan><tspan x="730.0" dy="13.7">повну оборотність</tspan></text>
</svg>