<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Header -->
  <text x="480" y="38" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Температурно-часовий графік зневоднення (Hydrogen Relief Baking) високоміцних болтів</text>
  <text x="480" y="60" font-size="13" text-anchor="middle" fill="#6b7280">Термічна витримка 190–230 °C протягом 4–24 годин витискає атомарний водень до появи мікротріщин</text>

  <!-- Graph Area Container -->
  <rect x="60" y="90" width="560" height="300" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>

  <!-- Grid Lines & Y-Axis Labels -->
  <!-- Y: 250 °C (y=110) -->
  <line x1="90" y1="110" x2="590" y2="110" stroke="#d0d7de" stroke-dasharray="4 4" stroke-width="1"/>
  <text x="82" y="114" font-size="11" text-anchor="end" fill="#6b7280">250°C</text>

  <!-- Y: 200 °C (y=170) - Baking zone top -->
  <line x1="90" y1="170" x2="590" y2="170" stroke="#27ae60" stroke-opacity="0.4" stroke-dasharray="4 4" stroke-width="1"/>
  <text x="82" y="174" font-size="11" text-anchor="end" fill="#6b7280">200°C</text>

  <!-- Y: 100 °C (y=270) -->
  <line x1="90" y1="270" x2="590" y2="270" stroke="#d0d7de" stroke-dasharray="4 4" stroke-width="1"/>
  <text x="82" y="274" font-size="11" text-anchor="end" fill="#6b7280">100°C</text>

  <!-- Y: 0 °C (y=370) -->
  <line x1="90" y1="370" x2="590" y2="370" stroke="#1a1a1a" stroke-width="1"/>
  <text x="82" y="374" font-size="11" text-anchor="end" fill="#6b7280">0°C</text>

  <!-- Baking Zone Highlight Area (190-230C) -->
  <rect x="200" y="130" width="360" height="80" fill="#e9f7ef" opacity="0.6"/>
  <text x="380" y="148" font-size="11" font-weight="bold" text-anchor="middle" fill="#27ae60">Зона витримки Hydrogen Relief Baking (190–230 °C)</text>

  <!-- X-Axis Labels & Ticks -->
  <!-- 0h -->
  <line x1="90" y1="370" x2="90" y2="376" stroke="#1a1a1a" stroke-width="1"/>
  <text x="90" y="405" font-size="11" text-anchor="middle" fill="#6b7280">0 год</text>

  <!-- 1h -->
  <line x1="130" y1="370" x2="130" y2="376" stroke="#1a1a1a" stroke-width="1"/>
  <text x="130" y="405" font-size="11" text-anchor="middle" fill="#6b7280">1 год</text>

  <!-- 2h -->
  <line x1="170" y1="370" x2="170" y2="376" stroke="#1a1a1a" stroke-width="1"/>
  <text x="170" y="405" font-size="11" text-anchor="middle" fill="#6b7280">2 год</text>

  <!-- 4h - Critical Window Limit -->
  <line x1="200" y1="90" x2="200" y2="370" stroke="#c0392b" stroke-dasharray="3 3" stroke-width="1.5"/>
  <line x1="210" y1="370" x2="210" y2="376" stroke="#1a1a1a" stroke-width="1"/>
  <text x="210" y="405" font-size="11" text-anchor="middle" fill="#6b7280">4 год</text>

  <!-- 8h -->
  <line x1="290" y1="370" x2="290" y2="376" stroke="#1a1a1a" stroke-width="1"/>
  <text x="290" y="405" font-size="11" text-anchor="middle" fill="#6b7280">8 год</text>

  <!-- 16h -->
  <line x1="450" y1="370" x2="450" y2="376" stroke="#1a1a1a" stroke-width="1"/>
  <text x="450" y="405" font-size="11" text-anchor="middle" fill="#6b7280">16 год</text>

  <!-- 24h -->
  <line x1="560" y1="370" x2="560" y2="376" stroke="#1a1a1a" stroke-width="1"/>
  <text x="560" y="405" font-size="11" text-anchor="middle" fill="#6b7280">24 год</text>

  <!-- Axis Titles -->
  <text x="340" y="428" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Час процесу (годин)</text>
  <text x="32" y="240" font-size="12" font-weight="bold" text-anchor="middle" fill="#1a1a1a" transform="rotate(-90 32 240)">Температура (°C)</text>

  <!-- Process Curve / Stages -->
  <!-- Stage 1: Plating / Pickling (x=90..140, y=370) -> Hydrogen intake -->
  <path d="M 90 370 L 140 370" fill="none" stroke="#c0392b" stroke-width="3"/>
  <circle cx="115" cy="370" r="5" fill="#c0392b"/>
  <text x="115" y="348" font-size="10" font-weight="bold" text-anchor="middle" fill="#c0392b">Стадія 1: Гальванічне цинкування</text>

  <!-- Stage 2: Critical window / Transfer (x=140..200, y=370) -->
  <path d="M 140 370 L 200 370" fill="none" stroke="#2457d6" stroke-width="3" stroke-dasharray="5 3"/>
  <text x="170" y="308" font-size="10" font-weight="bold" text-anchor="middle" fill="#2457d6">Стадія 2: Вікно (&lt;4 год)</text>

  <!-- Stage 3: Baking / Heat Treatment (x=200..560, y=200..150) -->
  <path d="M 200 370 C 205 180, 215 160, 230 160 L 530 160 C 545 160, 555 180, 560 370" fill="none" stroke="#27ae60" stroke-width="3"/>
  <text x="380" y="225" font-size="11" font-weight="bold" text-anchor="middle" fill="#27ae60">Стадія 3: Дегазація в печі (190–230 °C, 4–24 год)</text>

  <!-- Stage 4: Cooling (x=560..590) -->
  <path d="M 560 370 L 590 370" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="575" y="348" font-size="10" text-anchor="middle" fill="#6b7280">Охолодження</text>

  <!-- Right Information Panel -->
  <!-- Block 1: Mechanism & Risks -->
  <rect x="635" y="90" width="295" height="135" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="6"/>
  <text x="650" y="112" font-size="13" font-weight="bold" fill="#c0392b">Механізм проникнення та ризики</text>
  <text x="650" y="132" font-size="11" fill="#1a1a1a">• Болти класів міцності 10.9 та 12.9</text>
  <text x="650" y="152" font-size="11" fill="#1a1a1a">• Атомарний водень дифундує в метал</text>
  <text x="650" y="172" font-size="11" fill="#1a1a1a">• Накопичення в дефектах ґратки під напругою</text>
  <text x="650" y="192" font-size="11" fill="#1a1a1a">• Ризик раптового крихкого руйнування</text>

  <!-- Block 2: Regulations / ISO 9588 -->
  <rect x="635" y="240" width="295" height="150" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="6"/>
  <text x="650" y="262" font-size="13" font-weight="bold" fill="#27ae60">Регламент (ISO 9588 / ASTM F1941)</text>
  <text x="650" y="282" font-size="11" fill="#1a1a1a">• Температура витримки: 200–220 °C</text>
  <text x="650" y="302" font-size="11" fill="#1a1a1a">• Час витримки: від 4 до 24 годин</text>
  <text x="650" y="322" font-size="11" fill="#1a1a1a">• Витискання водню до мікротріщин</text>
  <text x="650" y="342" font-size="11" fill="#1a1a1a">• Обов'язковий контроль proof load</text>
</svg>
