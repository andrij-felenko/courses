<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Діаграма «напруження–деформація» для сталей класів 8.8, 10.9 та 12.9</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Висока міцність класу 12.9 зменшує пластичний резерв проти витягування сталі класу 8.8</text>

  <rect x="100" y="90" width="550" height="370" fill="#f4f6f8" rx="6" stroke="#d0d7de" stroke-width="1"/>

  <line x1="100" y1="409" x2="650" y2="409" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="100" y1="357" x2="650" y2="357" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="100" y1="306" x2="650" y2="306" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="100" y1="254" x2="650" y2="254" stroke="#27ae60" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="100" y1="203" x2="650" y2="203" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="100" y1="151" x2="650" y2="151" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>

  <line x1="180" y1="90" x2="180" y2="460" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="260" y1="90" x2="260" y2="460" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="340" y1="90" x2="340" y2="460" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="420" y1="90" x2="420" y2="460" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="500" y1="90" x2="500" y2="460" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="580" y1="90" x2="580" y2="460" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>

  <line x1="100" y1="460" x2="100" y2="78" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="100" y="68" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">σ, МПа</text>

  <text x="92" y="464" text-anchor="end" font-size="12" fill="#6b7280">0</text>
  <text x="92" y="310" text-anchor="end" font-size="12" fill="#6b7280">600</text>
  <text x="92" y="258" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">800</text>
  <text x="92" y="207" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">1000</text>
  <text x="92" y="155" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">1200</text>

  <line x1="100" y1="460" x2="662" y2="460" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="650" y="496" text-anchor="end" font-size="13" font-weight="bold" fill="#1a1a1a">ε, % (відносна деформація)</text>

  <text x="100" y="478" text-anchor="middle" font-size="12" fill="#6b7280">0</text>
  <text x="180" y="478" text-anchor="middle" font-size="12" fill="#6b7280">2%</text>
  <text x="260" y="478" text-anchor="middle" font-size="12" fill="#6b7280">4%</text>
  <text x="340" y="478" text-anchor="middle" font-size="12" fill="#6b7280">6%</text>
  <text x="420" y="478" text-anchor="middle" font-size="12" fill="#6b7280">8%</text>
  <text x="500" y="478" text-anchor="middle" font-size="12" fill="#6b7280">10%</text>
  <text x="580" y="478" text-anchor="middle" font-size="12" fill="#6b7280">12%</text>

  <path d="M 100 460 L 112 295 C 160 254 250 254 340 254 C 430 254 520 270 580 300" fill="none" stroke="#27ae60" stroke-width="3"/>
  <circle cx="112" cy="295" r="4" fill="#27ae60"/>
  <circle cx="340" cy="254" r="4" fill="#27ae60"/>
  <circle cx="580" cy="300" r="5" fill="#27ae60" stroke="#ffffff" stroke-width="1.5"/>

  <path d="M 100 460 L 116 229 C 150 203 210 203 270 203 C 340 203 410 215 460 240" fill="none" stroke="#2457d6" stroke-width="3"/>
  <circle cx="116" cy="229" r="4" fill="#2457d6"/>
  <circle cx="270" cy="203" r="4" fill="#2457d6"/>
  <circle cx="460" cy="240" r="5" fill="#2457d6" stroke="#ffffff" stroke-width="1.5"/>

  <path d="M 100 460 L 120 182 C 145 151 185 151 230 151 C 290 151 360 170 420 195" fill="none" stroke="#c0392b" stroke-width="3"/>
  <circle cx="120" cy="182" r="4" fill="#c0392b"/>
  <circle cx="230" cy="151" r="4" fill="#c0392b"/>
  <circle cx="420" cy="195" r="5" fill="#c0392b" stroke="#ffffff" stroke-width="1.5"/>

  <text x="230" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">12.9 (R_m = 1200 МПа)</text>
  <text x="420" y="178" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Крихкий розрив (8%)</text>

  <text x="310" y="193" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">10.9 (R_m = 1000 МПа)</text>
  <text x="475" y="226" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">Розрив (9%)</text>

  <text x="340" y="240" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">8.8 (R_m = 800 МПа)</text>
  <text x="575" y="316" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">Пластичний розрив (12%)</text>

  <line x1="120" y1="182" x2="160" y2="170" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="165" y="172" text-anchor="start" font-size="12" fill="#1a1a1a">R_p0.2 (межа плинності)</text>

  <rect x="100" y="506" width="550" height="30" fill="#e9f7ef" rx="4" stroke="#27ae60" stroke-width="1"/>
  <text x="375" y="525" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Пластичний резерв сталі 8.8 на 50% більший за клас 12.9 (сигнал перевищення навантаження)</text>

  <rect x="680" y="90" width="260" height="446" fill="#f4f6f8" rx="8" stroke="#d0d7de" stroke-width="1"/>

  <rect x="690" y="100" width="240" height="30" fill="#2457d6" rx="4"/>
  <text x="810" y="120" text-anchor="middle" font-size="13" font-weight="bold" fill="#ffffff">Порівняння класів міцності</text>

  <rect x="690" y="140" width="240" height="110" fill="#ffffff" rx="6" stroke="#c0392b" stroke-width="1.5"/>
  <text x="702" y="160" font-size="13" font-weight="bold" fill="#c0392b">Клас 12.9 (Макс. міцність)</text>
  <text x="702" y="178" font-size="12" fill="#1a1a1a">• R_m = 1200 МПа, R_p0.2 = 1080 МПа</text>
  <text x="702" y="196" font-size="12" fill="#1a1a1a">• Подовження A ≈ 8% (найменше)</text>
  <text x="702" y="214" font-size="12" fill="#c0392b">• Ризик: крихке руйнування</text>
  <text x="712" y="232" font-size="12" fill="#c0392b">без витягування різьби</text>

  <rect x="690" y="260" width="240" height="100" fill="#ffffff" rx="6" stroke="#2457d6" stroke-width="1.5"/>
  <text x="702" y="280" font-size="13" font-weight="bold" fill="#2457d6">Клас 10.9 (Висока міцність)</text>
  <text x="702" y="298" font-size="12" fill="#1a1a1a">• R_m = 1000 МПа, R_p0.2 = 900 МПа</text>
  <text x="702" y="316" font-size="12" fill="#1a1a1a">• Подовження A ≈ 9%</text>
  <text x="702" y="334" font-size="12" fill="#6b7280">• Оптимальний для автопрому</text>

  <rect x="690" y="370" width="240" height="154" fill="#ffffff" rx="6" stroke="#27ae60" stroke-width="1.5"/>
  <text x="702" y="390" font-size="13" font-weight="bold" fill="#27ae60">Клас 8.8 (Стандартний в'язкий)</text>
  <text x="702" y="408" font-size="12" fill="#1a1a1a">• R_m = 800 МПа, R_p0.2 = 640 МПа</text>
  <text x="702" y="426" font-size="12" fill="#1a1a1a">• Подовження A ≈ 12% (найбільше)</text>
  <text x="702" y="444" font-size="12" fill="#27ae60">• Запобігає раптовому зрізу:</text>
  <text x="712" y="462" font-size="12" fill="#27ae60">помітне пластичне витягування</text>
  <text x="712" y="480" font-size="12" fill="#27ae60">дає можливість помітити</text>
  <text x="712" y="498" font-size="12" fill="#27ae60">перевантаження вузла</text>
</svg>
