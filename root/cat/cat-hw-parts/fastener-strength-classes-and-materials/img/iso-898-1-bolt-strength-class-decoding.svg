<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Дешифрування маркування класу міцності болтів за ISO 898-1</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Значення першого та другого чисел визначають границю міцності Rm та границю текучості Re</text>

  <!-- Блок ліворуч: Головка болта з маркуванням -->
  <g transform="translate(40, 80)">
    <!-- Рамка для головки болта -->
    <rect x="0" y="0" width="300" height="295" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
    
    <text x="150" y="28" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Маркування на головці болта</text>

    <!-- Шестигранник головки болта -->
    <g transform="translate(150, 130)">
      <!-- Шестигранник (повернутий) -->
      <polygon points="0,-60 52,-30 52,30 0,60 -52,30 -52,-30" fill="#e2e8f0" stroke="#64748b" stroke-width="3"/>
      <!-- Внутрішнє коло або фаска -->
      <circle cx="0" cy="0" r="42" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      
      <!-- Текст маркування -->
      <text x="0" y="10" font-size="32" font-weight="bold" fill="#1a1a1a" text-anchor="middle" letter-spacing="2">10.9</text>
    </g>

    <!-- Вказівники (стрілки) від цифр -->
    <!-- Стрілка до першого числа "10" -->
    <path d="M 125 105 L 85 90" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
    <rect x="25" y="70" width="60" height="26" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
    <text x="55" y="87" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">«10»</text>

    <!-- Стрілка до другого числа ".9" -->
    <path d="M 175 105 L 215 90" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
    <rect x="215" y="70" width="60" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
    <text x="245" y="87" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">«.9»</text>

    <text x="150" y="228" font-size="12" fill="#6b7280" text-anchor="middle">Приклад класу міцності: 10.9</text>
    <text x="150" y="246" font-size="12" fill="#6b7280" text-anchor="middle">(високоміцні леговані сталі)</text>
  </g>

  <!-- Панель для першого числа «10» (x=360..630, y=90..385) -->
  <g transform="translate(360, 80)">
    <rect x="0" y="0" width="270" height="295" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    
    <!-- Шапка панелі -->
    <rect x="0" y="0" width="270" height="42" rx="8" fill="#2457d6"/>
    <text x="135" y="26" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Перше число: «10»</text>

    <!-- Вміст панелі -->
    <text x="20" y="72" font-size="13" font-weight="bold" fill="#1a1a1a">Номінальний тимчасовий</text>
    <text x="20" y="90" font-size="13" font-weight="bold" fill="#1a1a1a">опір розриву (Tensile strength)</text>

    <!-- Формула блок -->
    <rect x="20" y="110" width="230" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <text x="135" y="135" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Rm = 10 × 100 = 1000 МПа</text>
    <text x="135" y="157" font-size="12" fill="#6b7280" text-anchor="middle">(еквівалентно 1000 Н/мм²)</text>

    <!-- Пояснення -->
    <text x="20" y="195" font-size="12" fill="#1a1a1a">Множення першого числа на</text>
    <text x="20" y="213" font-size="12" fill="#1a1a1a">100 дає мінімальну межу міцності</text>
    <text x="20" y="231" font-size="12" fill="#1a1a1a">на розрив матеріалу болта в</text>
    <text x="20" y="249" font-size="12" fill="#1a1a1a">мегапаскалях.</text>

    <text x="20" y="280" font-size="11" font-weight="bold" fill="#2457d6">Витримує величезні навантаження</text>
  </g>

  <!-- Панель для другого числа «.9» (x=650..920, y=90..385) -->
  <g transform="translate(650, 80)">
    <rect x="0" y="0" width="270" height="295" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
    
    <!-- Шапка панелі -->
    <rect x="0" y="0" width="270" height="42" rx="8" fill="#27ae60"/>
    <text x="135" y="26" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">Друге число: «.9»</text>

    <!-- Вміст панелі -->
    <text x="20" y="72" font-size="13" font-weight="bold" fill="#1a1a1a">Границя текучості</text>
    <text x="20" y="90" font-size="13" font-weight="bold" fill="#1a1a1a">(Yield strength, 90% від Rm)</text>

    <!-- Формула блок -->
    <rect x="20" y="110" width="230" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
    <text x="135" y="135" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Re = Rm × 0.9 = 900 МПа</text>
    <text x="135" y="157" font-size="12" fill="#6b7280" text-anchor="middle">(90% від 1000 МПа)</text>

    <!-- Пояснення -->
    <text x="20" y="195" font-size="12" fill="#1a1a1a">Добуток першого та другого</text>
    <text x="20" y="213" font-size="12" fill="#1a1a1a">чисел, помножений на 10, дає</text>
    <text x="20" y="231" font-size="12" fill="#1a1a1a">границю текучості (напруження,</text>
    <text x="20" y="249" font-size="12" fill="#1a1a1a">що викликає пластичну деформацію).</text>

    <text x="20" y="280" font-size="11" font-weight="bold" fill="#27ae60">Висока опірність деформаціям</text>
  </g>

  <!-- Блок внизу: приклади інших класів (y=390..445) -->
  <g transform="translate(40, 390)">
    <rect x="0" y="0" width="880" height="52" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
    <text x="20" y="31" font-size="13" font-weight="bold" fill="#1a1a1a">Приклади інших класів міцності за ISO 898-1:</text>
    
    <!-- Бейджі прикладів -->
    <g transform="translate(320, 14)">
      <!-- 8.8 -->
      <rect x="0" y="0" width="160" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="80" y="16" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan font-weight="bold">8.8</tspan> → 800 / 640 МПа</text>
    </g>

    <g transform="translate(500, 14)">
      <!-- 10.9 -->
      <rect x="0" y="0" width="160" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="80" y="16" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan font-weight="bold">10.9</tspan> → 1000 / 900 МПа</text>
    </g>

    <g transform="translate(680, 14)">
      <!-- 12.9 -->
      <rect x="0" y="0" width="160" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <text x="80" y="16" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan font-weight="bold">12.9</tspan> → 1200 / 1080 МПа</text>
    </g>
  </g>

</svg>
