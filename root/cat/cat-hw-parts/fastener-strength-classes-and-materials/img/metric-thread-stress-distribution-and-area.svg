<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <!-- Маркери стрілок -->
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-start" markerWidth="9" markerHeight="9" refX="1.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#1a1a1a"/>
    </marker>
    <!-- Штриховка для площі As -->
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45 0 0)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#2457d6" stroke-width="1.5" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Геометрія метричної різьби та розрахункова площа перерізу As</text>
  <text x="480" y="60" font-size="13" text-anchor="middle" fill="#6b7280">Співвідношення номінального d, середнього d2 і внутрішнього d3 діаметрів та осьові напруження розтягу</text>

  <!-- ЛІВА ЧАСТИНА: Профіль різьби та стержень болта -->
  <!-- Вісь симетрії болта -->
  <line x1="100" y1="90" x2="100" y2="430" stroke="#6b7280" stroke-dasharray="6,4" stroke-width="1.5"/>
  <text x="100" y="445" font-size="12" text-anchor="middle" fill="#6b7280">Вісь болта</text>

  <!-- Стержень болта нижче різьби (виділена розрахункова площа As) -->
  <rect x="100" y="330" width="60" height="70" fill="url(#hatch)" stroke="#2457d6" stroke-width="2"/>
  <rect x="100" y="240" width="60" height="90" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Стрілки осьових напружень розтягу (sigma_z) у стержні -->
  <line x1="120" y1="385" x2="120" y2="345" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <line x1="140" y1="385" x2="140" y2="345" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="130" y="320" font-size="13" font-weight="700" text-anchor="middle" fill="#2457d6">σ_z (розтяг)</text>

  <!-- Профіль витків метричної різьби зверху (від y=90 до y=240) -->
  <path d="M 160,240 
           L 195,215 L 175,200 L 195,185 L 175,170 L 195,155 L 160,130
           L 160,90 L 100,90" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
  
  <path d="M 160,130 L 195,155 L 175,170 L 195,185 L 175,200 L 195,215 L 160,240" fill="none" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Розмірні лінії діаметрів -->
  <!-- Зовнішній діаметр d -->
  <line x1="195" y1="155" x2="235" y2="155" stroke="#6b7280" stroke-width="1"/>
  <line x1="225" y1="100" x2="225" y2="210" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-start)" marker-end="url(#arr)"/>
  <text x="235" y="160" font-size="13" font-weight="700" fill="#1a1a1a">d (зовн.)</text>

  <!-- Середній діаметр d2 -->
  <line x1="177" y1="170" x2="265" y2="170" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="270" y="174" font-size="13" font-weight="700" fill="#2457d6">d₂ (серед.)</text>

  <!-- Внутрішній діаметр d3 (западини) -->
  <line x1="160" y1="215" x2="295" y2="215" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="300" y="219" font-size="13" font-weight="700" fill="#c0392b">d₃ (внутр.)</text>

  <!-- Позначення площі As -->
  <text x="170" y="370" font-size="13" font-weight="700" fill="#2457d6">A_s (пл.)</text>

  <!-- ПРАВА ЧАСТИНА: Інформаційна панель з формулами та поясненнями -->
  <rect x="490" y="90" width="440" height="330" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <text x="515" y="125" font-size="16" font-weight="700" fill="#1a1a1a">Параметри та розрахунок різьби:</text>

  <!-- Формула d2 -->
  <rect x="510" y="145" width="400" height="42" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="525" y="171" font-size="13" font-weight="700" fill="#1a1a1a">Середній діаметр:</text>
  <text x="730" y="171" font-size="13" fill="#2457d6">d₂ = d - 0.6495 · p</text>

  <!-- Формула d3 -->
  <rect x="510" y="195" width="400" height="42" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="525" y="221" font-size="13" font-weight="700" fill="#1a1a1a">Внутрішній діаметр:</text>
  <text x="730" y="221" font-size="13" fill="#c0392b">d₃ = d - 1.2268 · p</text>

  <!-- Формула ds -->
  <rect x="510" y="245" width="400" height="42" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="525" y="271" font-size="13" font-weight="700" fill="#1a1a1a">Розрахунковий діаметр:</text>
  <text x="730" y="271" font-size="13" fill="#1a1a1a">d_s = (d₂ + d₃) / 2</text>

  <!-- Формула As -->
  <rect x="510" y="295" width="400" height="48" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="525" y="324" font-size="14" font-weight="700" fill="#2457d6">Розрахункова площа A_s:</text>
  <text x="730" y="324" font-size="14" font-weight="700" fill="#2457d6">A_s = (π / 4) · d_s²</text>

  <!-- Пояснення напружень -->
  <rect x="510" y="351" width="400" height="52" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="525" y="374" font-size="13" font-weight="700" fill="#27ae60">Осьові напруження розтягу:</text>
  <text x="525" y="394" font-size="12" fill="#1a1a1a">σ_z = F_p / A_s (діють у перерізі стержня)</text>

</svg>
