<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  <defs>
    <marker id="arr-axis" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розрахунок об'єму комірки та крива релаксації заряду ESD</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Врахування випадкового насипного пакування φ_pack та експоненційного згасання заряду за IEC 61340-5-1</text>

  <!-- Left Panel -->
  <rect x="30" y="70" width="430" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="245" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Геометричний розріз комірки органайзера</text>
  <text x="245" y="116" font-size="12" fill="#6b7280" text-anchor="middle">Заповнення насипом деталей та ергономічний простір</text>

  <!-- Upper ergonomic zone -->
  <rect x="60" y="140" width="180" height="70" fill="#e9f7ef" stroke="none"/>
  <!-- Lower bulk parts zone -->
  <rect x="60" y="210" width="180" height="140" fill="#eaf0fd" stroke="none"/>
  
  <!-- Cell outer walls -->
  <path d="M 60 140 L 60 350 L 240 350 L 240 140" fill="none" stroke="#2457d6" stroke-width="3"/>
  <line x1="60" y1="210" x2="240" y2="210" stroke="#2457d6" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Bulk components representations -->
  <rect x="80" y="230" width="24" height="12" rx="2" fill="#2457d6" opacity="0.7"/>
  <rect x="120" y="240" width="20" height="10" rx="2" fill="#2457d6" opacity="0.7"/>
  <circle cx="175" cy="245" r="8" fill="#2457d6" opacity="0.7"/>
  <rect x="90" y="270" width="28" height="10" rx="2" fill="#2457d6" opacity="0.7"/>
  <circle cx="145" cy="280" r="9" fill="#2457d6" opacity="0.7"/>
  <rect x="180" y="275" width="22" height="12" rx="2" fill="#2457d6" opacity="0.7"/>
  <circle cx="85" cy="320" r="8" fill="#2457d6" opacity="0.7"/>
  <rect x="120" y="315" width="26" height="12" rx="2" fill="#2457d6" opacity="0.7"/>
  <circle cx="170" cy="320" r="9" fill="#2457d6" opacity="0.7"/>
  <rect x="205" y="315" width="20" height="10" rx="2" fill="#2457d6" opacity="0.7"/>

  <!-- Annotations on left panel -->
  <text x="260" y="170" font-size="12" font-weight="bold" fill="#27ae60">k_ergo = 1.3...1.5</text>
  <text x="260" y="188" font-size="11" fill="#6b7280">Запас для пальців / пінцета</text>

  <text x="260" y="260" font-size="12" font-weight="bold" fill="#2457d6">φ_pack ≈ 0.45...0.55</text>
  <text x="260" y="278" font-size="11" fill="#6b7280">Коефіцієнт насипу (порожнеча 50%)</text>
  <text x="260" y="294" font-size="11" fill="#6b7280">V_fill = N · V_part / φ_pack</text>

  <text x="245" y="395" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">V_cell = (N · V_part / φ_pack) · k_ergo</text>
  <text x="245" y="413" font-size="11" fill="#6b7280" text-anchor="middle">Загальний об'єм комірки для безпечного зберігання</text>

  <!-- Right Panel -->
  <rect x="490" y="70" width="440" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="710" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Експоненційне стікання заряду V(t)</text>
  <text x="710" y="116" font-size="12" fill="#6b7280" text-anchor="middle">Залежність швидкості розсіювання від матеріалу касети</text>

  <!-- Graph Axes -->
  <line x1="545" y1="330" x2="885" y2="330" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-axis)"/>
  <line x1="545" y1="330" x2="545" y2="135" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arr-axis)"/>

  <text x="535" y="148" font-size="11" fill="#6b7280" text-anchor="end">1000 В</text>
  <text x="535" y="215" font-size="11" fill="#6b7280" text-anchor="end">500 В</text>
  <text x="535" y="285" font-size="11" fill="#27ae60" font-weight="bold" text-anchor="end">100 В</text>
  <text x="535" y="334" font-size="11" fill="#6b7280" text-anchor="end">0 В</text>

  <text x="545" y="348" font-size="11" fill="#6b7280" text-anchor="middle">0</text>
  <text x="615" y="348" font-size="11" fill="#6b7280" text-anchor="middle">1 с</text>
  <text x="685" y="348" font-size="11" fill="#6b7280" text-anchor="middle">2 с</text>
  <text x="755" y="348" font-size="11" fill="#6b7280" text-anchor="middle">3 с</text>
  <text x="825" y="348" font-size="11" fill="#6b7280" text-anchor="middle">4 с</text>

  <!-- Safe Limit line -->
  <line x1="545" y1="282" x2="870" y2="282" stroke="#27ae60" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="875" y="285" font-size="10" fill="#27ae60">IEC &lt; 100 В</text>

  <!-- Insulator curve -->
  <path d="M 545 145 C 640 150, 750 160, 860 175" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="680" y="145" font-size="11" font-weight="bold" fill="#c0392b">Звичайний діелектрик</text>
  <text x="680" y="160" font-size="10" fill="#6b7280">R_s &gt; 10¹² Ом/кв, τ &gt; 100 с (небезпечно)</text>

  <!-- Dissipative curve -->
  <path d="M 545 145 C 565 240, 595 315, 660 326 L 860 328" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <text x="605" y="215" font-size="11" font-weight="bold" fill="#27ae60">Дисипативний ESD-пластик</text>
  <text x="605" y="230" font-size="10" fill="#6b7280">R_s = 10⁵...10⁹ Ом/кв, t_decay &lt; 1 с</text>

  <!-- Formula at bottom -->
  <text x="710" y="395" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">V(t) = V_0 · exp(-t / τ),  τ = R_s · C_eff</text>
  <text x="710" y="413" font-size="11" fill="#6b7280" text-anchor="middle">Експоненційне стікання заряду за часовою константою</text>
</svg>
