<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  
  <!-- Header -->
  <text x="480" y="38" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Зонування робочого простору за частотою використання деталей</text>
  <text x="480" y="60" font-family="Arial, sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Первинна робоча зона (ручний доступ), вторинна зона (перфопанелі) та третинна зона (касети й кейси)</text>

  <!-- Zone 1: Desktop (Left) -->
  <rect x="30" y="85" width="280" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <!-- Status pill/badge background -->
  <rect x="46" y="105" width="248" height="28" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="56" y="123" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#27ae60">Зона 1: Робочий стіл (R ≤ 40 см)</text>

  <!-- Component item 1 -->
  <rect x="46" y="143" width="248" height="75" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="58" y="163" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a">Висока частота звернення</text>
  <text x="58" y="181" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">Доступ кожні 1–5 хвилин під час роботи.</text>
  <text x="58" y="198" font-family="Arial, sans-serif" font-size="11" fill="#27ae60">Частота: постійний потік</text>

  <!-- Component item 2 -->
  <rect x="46" y="228" width="248" height="92" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="58" y="248" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a">Компоненти:</text>
  <text x="58" y="266" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">• Gridfinity базові пластини на столі</text>
  <text x="58" y="284" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">• Лотки з паяльним флюсом, припоєм</text>
  <text x="58" y="302" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">• Ходові гвинти М3, базові інструменти</text>

  <!-- Ergonomics -->
  <rect x="46" y="330" width="248" height="84" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="58" y="350" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a">Ергономіка:</text>
  <text x="58" y="368" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">Доступ однією рукою без зміни</text>
  <text x="58" y="386" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">пози тіла монтажника на робочому</text>
  <text x="58" y="404" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">місці біля стільниці.</text>


  <!-- Zone 2: Wall Panel (Center) -->
  <rect x="330" y="85" width="300" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <!-- Status pill/badge background -->
  <rect x="346" y="105" width="268" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="356" y="123" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2457d6">Зона 2: Настінна панель (R = 40–80 см)</text>

  <!-- Component item 1 -->
  <rect x="346" y="143" width="268" height="75" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="358" y="163" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a">Середня частота звернення</text>
  <text x="358" y="181" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">Доступ 1–5 разів на годину під час збору.</text>
  <text x="358" y="198" font-family="Arial, sans-serif" font-size="11" fill="#2457d6">Частота: періодична ручна вибірка</text>

  <!-- Component item 2 -->
  <rect x="346" y="228" width="268" height="92" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="358" y="248" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a">Компоненти:</text>
  <text x="358" y="266" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">• Настінна перфопанель (Louvered Panel)</text>
  <text x="358" y="284" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">• Навісні лотки (типорозміри 1–3)</text>
  <text x="358" y="302" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">• Тримачі викруток, щипців і кабелів</text>

  <!-- Ergonomics -->
  <rect x="346" y="330" width="268" height="84" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="358" y="350" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a">Ергономіка:</text>
  <text x="358" y="368" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">Доступ на відстані витягнутої</text>
  <text x="358" y="386" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">руки, звільнення корисного</text>
  <text x="358" y="404" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">простору стільниці.</text>


  <!-- Zone 3: Cabinets & Cases (Right) -->
  <rect x="650" y="85" width="280" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <!-- Status pill/badge background -->
  <rect x="666" y="105" width="248" height="28" rx="4" fill="#fdf2e9" stroke="#e67e22" stroke-width="1"/>
  <text x="676" y="123" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e67e22">Зона 3: Касетні шафи та кейси (R &gt; 80 см)</text>

  <!-- Component item 1 -->
  <rect x="666" y="143" width="248" height="75" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="678" y="163" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#1a1a1a">Низька частота звернення</text>
  <text x="678" y="181" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">Доступ раз на зміну або проєкт.</text>
  <text x="678" y="198" font-family="Arial, sans-serif" font-size="11" fill="#e67e22">Частота: резервне сховище</text>

  <!-- Component item 2 -->
  <rect x="666" y="228" width="248" height="92" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="678" y="248" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a">Компоненти:</text>
  <text x="678" y="266" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">• Багатоярусні касетні шафи з шухлядами</text>
  <text x="678" y="284" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">• Повний ряд резисторів E24, запас М2–М6</text>
  <text x="678" y="302" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">• Переносні мобільні кейси</text>

  <!-- Ergonomics -->
  <rect x="666" y="330" width="248" height="84" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="678" y="350" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a">Ергономіка:</text>
  <text x="678" y="368" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">Тривале зберігання, максимальна</text>
  <text x="678" y="386" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">щільність пакування номенклатури</text>
  <text x="678" y="404" font-family="Arial, sans-serif" font-size="11" fill="#6b7280">деталей та кріплення.</text>
</svg>
