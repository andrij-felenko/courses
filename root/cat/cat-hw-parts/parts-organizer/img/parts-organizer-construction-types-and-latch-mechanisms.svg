<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Конструктивні типи органайзерів та захист від пересортиці</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Касетні висувні лотки, кейси зі знімними перегородками та замкові ребра кришки</text>

  <!-- COLUMN 1: Касетний висувний лоток (Drawer Bin) -->
  <rect x="30" y="85" width="280" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="170" y="112" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Касетний висувний лоток</text>
  
  <!-- Drawer Graphics -->
  <!-- Outer housing -->
  <rect x="48" y="130" width="244" height="150" fill="white" stroke="#d0d7de" stroke-width="1.5" rx="4"/>
  <!-- Guide rails -->
  <line x1="48" y1="160" x2="292" y2="160" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="48" y1="220" x2="292" y2="220" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>
  
  <!-- Sliding Bin / Drawer -->
  <rect x="70" y="140" width="150" height="70" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="3"/>
  <!-- Handle with label pocket -->
  <rect x="225" y="155" width="35" height="40" fill="white" stroke="#2457d6" stroke-width="1" rx="2"/>
  <rect x="230" y="163" width="25" height="20" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Rear stop tab -->
  <path d="M70,140 L70,132 L82,132" fill="none" stroke="#2457d6" stroke-width="2"/>
  <text x="88" y="138" font-size="11" fill="#2457d6">Стопор</text>

  <!-- Internal partitions inside drawer -->
  <line x1="120" y1="140" x2="120" y2="210" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="170" y1="140" x2="170" y2="210" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Labels & Descriptions for Column 1 -->
  <text x="45" y="295" font-size="12" font-weight="bold" fill="#1a1a1a">Особливості конструкції:</text>
  <text x="45" y="315" font-size="12" fill="#1a1a1a">• Напрямні рейки для плавного ходу</text>
  <text x="45" y="335" font-size="12" fill="#1a1a1a">• Задній стопор проти випадання</text>
  <text x="45" y="355" font-size="12" fill="#1a1a1a">• Ручка з кишенею під паперовий ярлик</text>
  <text x="45" y="380" font-size="12" font-weight="bold" fill="#2457d6">Призначення:</text>
  <text x="45" y="400" font-size="11" fill="#6b7280">Стаціонарне зберігання радіодеталей,</text>
  <text x="45" y="415" font-size="11" fill="#6b7280">швидкий доступ однією рукою.</text>


  <!-- COLUMN 2: Кейс зі знімними перегородками (Assortment Box) -->
  <rect x="330" y="85" width="300" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="112" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кейс зі знімними перегородками</text>

  <!-- Case Graphics -->
  <rect x="348" y="138" width="264" height="142" fill="white" stroke="#d0d7de" stroke-width="1.5" rx="4"/>
  <!-- Handle on top -->
  <path d="M440,138 C440,126 520,126 520,138" fill="none" stroke="#1a1a1a" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Snap Latches (separated nicely from handle and box) -->
  <rect x="370" y="135" width="20" height="5" fill="#2457d6" rx="1"/>
  <rect x="570" y="135" width="20" height="5" fill="#2457d6" rx="1"/>

  <!-- Internal modular compartments -->
  <line x1="420" y1="138" x2="420" y2="280" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="510" y1="138" x2="510" y2="280" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="348" y1="200" x2="612" y2="200" stroke="#d0d7de" stroke-width="1.5"/>
  <!-- Removable dovetail partitions (dashed) -->
  <line x1="465" y1="138" x2="465" y2="200" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="348" y1="240" x2="420" y2="240" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Labels & Descriptions for Column 2 -->
  <text x="345" y="295" font-size="12" font-weight="bold" fill="#1a1a1a">Особливості конструкції:</text>
  <text x="345" y="315" font-size="12" fill="#1a1a1a">• Модульні перегородки «ластівчин хвіст»</text>
  <text x="345" y="335" font-size="12" fill="#1a1a1a">• Надійні бічні та фронтальні засувки</text>
  <text x="345" y="355" font-size="12" fill="#1a1a1a">• Трансформація комірок під довгі інструменти</text>
  <text x="345" y="380" font-size="12" font-weight="bold" fill="#2457d6">Призначення:</text>
  <text x="345" y="400" font-size="11" fill="#6b7280">Польовий сервіс, мобільне перенесення</text>
  <text x="345" y="415" font-size="11" fill="#6b7280">металовиробів та кріплення.</text>


  <!-- COLUMN 3: Механізм захисту від пересортиці (Anti-Migration Ribs) -->
  <rect x="650" y="85" width="280" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="790" y="112" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Захист від пересортиці</text>

  <!-- Comparison boxes -->
  <!-- Bad case -->
  <rect x="665" y="130" width="118" height="75" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="724" y="148" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Плоска кришка</text>
  <!-- Flat lid graphic -->
  <line x1="675" y1="160" x2="773" y2="160" stroke="#c0392b" stroke-width="2"/>
  <line x1="700" y1="160" x2="700" y2="195" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="748" y1="160" x2="748" y2="195" stroke="#6b7280" stroke-width="1.5"/>
  <text x="724" y="182" font-size="10" fill="#c0392b" text-anchor="middle">зазор &gt; 1 мм</text>
  <text x="724" y="198" font-size="10" fill="#c0392b" text-anchor="middle">Ризик пересипання!</text>

  <!-- Good case -->
  <rect x="797" y="130" width="118" height="75" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="856" y="148" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Профільована сітка</text>
  <!-- Rib lid graphic -->
  <path d="M805,160 L830,160 L830,166 L882,166 L882,160 L907,160" fill="none" stroke="#27ae60" stroke-width="2"/>
  <line x1="830" y1="166" x2="830" y2="195" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="882" y1="166" x2="882" y2="195" stroke="#6b7280" stroke-width="1.5"/>
  <text x="856" y="182" font-size="10" fill="#27ae60" text-anchor="middle">зазор h &lt; 0.3 мм</text>
  <text x="856" y="198" font-size="10" fill="#27ae60" text-anchor="middle">100% герметичність</text>

  <!-- Detailed zoom-in graphic of Labyrinth seal -->
  <rect x="665" y="215" width="250" height="65" fill="white" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <path d="M680,245 L730,245 L730,230 L760,230 L760,245 L810,245" fill="none" stroke="#2457d6" stroke-width="2"/>
  <path d="M745,260 L745,230" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="775" y="240" font-size="10" fill="#1a1a1a">U-подібний гребінь кришки</text>
  <text x="775" y="255" font-size="10" fill="#6b7280">охоплює стінку перегородки</text>

  <!-- Labels & Descriptions for Column 3 -->
  <text x="665" y="295" font-size="12" font-weight="bold" fill="#1a1a1a">Особливості захисту:</text>
  <text x="665" y="315" font-size="12" fill="#1a1a1a">• Лабіринтний гребінь на кришці</text>
  <text x="665" y="335" font-size="12" fill="#1a1a1a">• Щільне змикання стінок комірок</text>
  <text x="665" y="355" font-size="12" fill="#1a1a1a">• Неможливість проскакування SMD 0805</text>
  <text x="665" y="380" font-size="12" font-weight="bold" fill="#27ae60">Результат:</text>
  <text x="665" y="400" font-size="11" fill="#6b7280">Відсутність пересортиці дрібного</text>
  <text x="665" y="415" font-size="11" fill="#6b7280">металовиробу при транспортуванні.</text>
</svg>
