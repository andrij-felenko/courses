<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Організація зон зберігання та вузли кріплення органайзерів</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Оперативна й буферна зони робочого місця та конструктивні замки French Cleat і DIN EN 60715</text>

  <!-- Panel 1: Left (30..480, 85..430) -->
  <rect x="30" y="85" width="450" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="255" y="112" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Зонування простору та рух оператора</text>

  <!-- Operational Zone Box -->
  <rect x="50" y="126" width="410" height="136" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="70" cy="148" r="7" fill="#27ae60"/>
  <text x="86" y="153" font-size="13" font-weight="bold" fill="#27ae60">Оперативна зона (R &lt;= 40 см)</text>
  <text x="55" y="178" font-size="12" fill="#1a1a1a">• Настільні касети, пряма видимість, час доступу &lt; 2 с.</text>
  <text x="55" y="200" font-size="12" fill="#1a1a1a">• Траєкторія руху руки мінімальна (без нахилів і вставання).</text>
  <text x="55" y="222" font-size="12" fill="#6b7280">Часто використовувані компоненти (E24 базовий ряд).</text>

  <!-- Buffer Zone Box -->
  <rect x="50" y="272" width="410" height="136" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="70" cy="294" r="7" fill="#2457d6"/>
  <text x="86" y="299" font-size="13" font-weight="bold" fill="#2457d6">Буферна зона (Настінна / Стелажна)</text>
  <text x="55" y="324" font-size="12" fill="#1a1a1a">• Настінні органайзери та висувні шафи з повним рядом E24.</text>
  <text x="55" y="346" font-size="12" fill="#1a1a1a">• Скорочення хаотичних рухів оператора на 70%.</text>
  <text x="55" y="368" font-size="12" fill="#6b7280">Зберігання запасів, рідкісні номінали, зручна логістика.</text>

  <!-- Panel 2: Right (500..930, 85..430) -->
  <rect x="500" y="85" width="430" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="715" y="112" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Конструкція вузлів монтажу</text>

  <!-- Node 1: French Cleat -->
  <rect x="520" y="126" width="390" height="136" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="535" y="148" font-size="13" font-weight="bold" fill="#1a1a1a">Вузол 1: Французька планка (French Cleat)</text>
  <text x="535" y="168" font-size="11" fill="#6b7280">Скошені під 45° планки на стіні та органайзері</text>
  <text x="535" y="193" font-size="12" fill="#1a1a1a">• Самозаклинювання під власною вагою.</text>
  <text x="535" y="215" font-size="12" fill="#1a1a1a">• Миттєве зняття для перенесення.</text>

  <!-- Node 2: DIN Rail -->
  <rect x="520" y="272" width="390" height="136" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="535" y="294" font-size="13" font-weight="bold" fill="#1a1a1a">Вузол 2: Монтаж на рейку DIN EN 60715</text>
  <text x="535" y="314" font-size="11" fill="#6b7280">Омега-профіль 35 мм та пружна засувка лотка</text>
  <text x="535" y="339" font-size="12" fill="#1a1a1a">• Стандартизована надійна фіксація.</text>
  <text x="535" y="361" font-size="12" fill="#1a1a1a">• Швидкий монтаж в шафах і стендах.</text>

</svg>
