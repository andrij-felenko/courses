<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Модульні растри та профілі пазів промислових органайзерів</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Порівняння геометрії євроконтейнерів (400×300 мм), касет Raaco та відкритої системи Gridfinity (42 мм)</text>

  <!-- CARD 1: Eurocontainer 400x300 -->
  <rect x="40" y="75" width="275" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="52" y="88" width="251" height="30" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="177" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#2457d6">Євроконтейнери (VDA 4500)</text>

  <!-- Drawing: 400x300 grid (4 separated modular bins) -->
  <rect x="70" y="130" width="215" height="110" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="78" y="138" width="94" height="43" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <rect x="183" y="138" width="94" height="43" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <rect x="78" y="189" width="94" height="43" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <rect x="183" y="189" width="94" height="43" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>

  <!-- Profile sketch: divider slot -->
  <path d="M120,265 L150,265 L150,285 L160,285 L160,265 L190,265" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="177" y="310" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Паз перегородки: 2.5 мм</text>
  <text x="177" y="335" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">База: 400 × 300 мм</text>
  <text x="177" y="365" text-anchor="middle" font-size="11" fill="#1a1a1a">Поліпропілен високої міцності</text>
  <text x="177" y="385" text-anchor="middle" font-size="11" fill="#1a1a1a">Штабелювання та фіксація дна</text>
  <text x="177" y="415" text-anchor="middle" font-size="11" font-weight="700" fill="#2457d6">Складське зберігання вузлів</text>

  <!-- CARD 2: Raaco Standard -->
  <rect x="342" y="75" width="275" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="354" y="88" width="251" height="30" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="479" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#2457d6">Касетні системи Raaco</text>

  <!-- Drawing: Cassette drawers -->
  <rect x="372" y="130" width="215" height="110" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="382" y="138" width="90" height="43" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <rect x="487" y="138" width="90" height="43" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <rect x="382" y="189" width="90" height="43" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <rect x="487" y="189" width="90" height="43" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>

  <!-- Profile: slide runner -->
  <path d="M420,265 L460,265 L460,285 L445,285 L445,295 L495,295" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <text x="479" y="310" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Профіль напрямних 150 мм</text>
  <text x="479" y="335" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Касетні секції 55 мм</text>
  <text x="479" y="365" text-anchor="middle" font-size="11" fill="#1a1a1a">Шухляди з упором проти випадіння</text>
  <text x="479" y="385" text-anchor="middle" font-size="11" fill="#1a1a1a">Прозорий ударостійкий пластик</text>
  <text x="479" y="415" text-anchor="middle" font-size="11" font-weight="700" fill="#2457d6">Промислові стенди та шафи</text>

  <!-- CARD 3: Gridfinity Standard -->
  <rect x="645" y="75" width="275" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="657" y="88" width="251" height="30" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="782" y="108" text-anchor="middle" font-size="13" font-weight="700" fill="#27ae60">Стандарт Gridfinity (42 мм)</text>

  <!-- Drawing: Gridfinity base profile -->
  <rect x="675" y="130" width="215" height="110" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <circle cx="725" cy="185" r="14" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="725" y="189" text-anchor="middle" font-size="10" font-weight="700" fill="#2457d6">Ø6</text>
  <circle cx="835" cy="185" r="14" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="835" y="189" text-anchor="middle" font-size="10" font-weight="700" fill="#2457d6">Ø6</text>

  <!-- Profile: 45 degree chamfer -->
  <path d="M720,265 L740,265 L755,285 L810,285 L825,265 L845,265" fill="none" stroke="#27ae60" stroke-width="1.5"/>
  <text x="782" y="310" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">Фаска 45° та замковий східець</text>
  <text x="782" y="335" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">Крок сітки: 42.0 мм</text>
  <text x="782" y="365" text-anchor="middle" font-size="11" fill="#1a1a1a">Оптимізовано під 3D-друк</text>
  <text x="782" y="385" text-anchor="middle" font-size="11" fill="#1a1a1a">Гнізда під неодимові магніти</text>
  <text x="782" y="415" text-anchor="middle" font-size="11" font-weight="700" fill="#27ae60">Організація робочих місць</text>
</svg>
