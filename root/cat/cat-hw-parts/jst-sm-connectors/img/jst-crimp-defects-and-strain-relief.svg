<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- White background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Дефекти обтиску контакту та правила розвантаження натягу джгута JST-SM</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Деформація вусика і недотиск призводять до випадання пінів; фіксація хомутом запобігає обриву жили</text>

  <!-- Section A Panel -->
  <rect x="20" y="70" width="920" height="205" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="35" y="92" font-size="14" font-weight="bold" fill="#1a1a1a">А. Помилки обтискання штирового / гніздового контакту</text>

  <!-- Card A1: Lance Distortion -->
  <rect x="35" y="102" width="435" height="160" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="45" y="122" font-size="13" font-weight="bold" fill="#c0392b">1. Деформація фіксуючого вусика (Lance Distortion)</text>

  <!-- Drawing A1 Terminal -->
  <!-- Wire entering terminal -->
  <rect x="50" y="156" width="30" height="8" fill="#ef4444" rx="2"/>
  <!-- Bare copper strands -->
  <path d="M 80,158 L 105,158 M 80,160 L 105,160 M 80,162 L 105,162" stroke="#d97706" stroke-width="1.5"/>
  <!-- Insulation crimp wings -->
  <path d="M 70,148 C 70,142 82,142 85,148 L 85,172 C 82,178 70,178 70,172 Z" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <!-- Wire crimp wings -->
  <path d="M 95,148 C 95,142 107,142 110,148 L 110,172 C 107,178 95,178 95,172 Z" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <!-- Main terminal body -->
  <rect x="110" y="152" width="70" height="16" fill="#e2e8f0" stroke="#475569" stroke-width="1.5" rx="1"/>

  <!-- Ideal lance position (dashed) -->
  <path d="M 140,152 L 152,138 L 160,152" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3" fill="none"/>
  <text x="145" y="134" font-size="12" fill="#c0392b">Норма</text>

  <!-- Crushed lance position (solid thick red) -->
  <path d="M 140,152 L 160,153" stroke="#c0392b" stroke-width="3" fill="none"/>

  <!-- Red callout line & text for crushed lance -->
  <line x1="115" y1="220" x2="148" y2="162" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="45" y="240" font-size="12" font-weight="bold" fill="#c0392b">Вусик вдавлений!</text>

  <!-- Card A1 Text Explanation -->
  <text x="200" y="146" font-size="12" font-weight="bold" fill="#1a1a1a">Причина:</text>
  <text x="200" y="162" font-size="12" fill="#6b7280">Натиск невідповідним інструментом</text>
  <text x="200" y="182" font-size="12" font-weight="bold" fill="#c0392b">Наслідок:</text>
  <text x="200" y="198" font-size="12" fill="#c0392b">Вусик не чіпляється за корпус SM-H</text>
  <text x="200" y="214" font-size="12" fill="#c0392b">Пін випадає з роз'єму при з'єднанні</text>

  <!-- Card A2: Insulation Crimp Defect -->
  <rect x="490" y="102" width="435" height="160" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="500" y="122" font-size="13" font-weight="bold" fill="#c0392b">2. Помилка обтиску ізоляції (Insulation Crimp Defect)</text>

  <!-- Drawing A2 Terminal -->
  <!-- Insulation extending TOO FAR -->
  <rect x="505" y="156" width="75" height="8" fill="#ef4444" rx="2"/>
  <!-- Insulation crimp wings -->
  <path d="M 525,148 C 525,142 537,142 540,148 L 540,172 C 537,178 525,178 525,172 Z" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <!-- Wire crimp wings OVER INSULATION -->
  <path d="M 555,148 C 555,142 567,142 570,148 L 570,172 C 567,178 555,178 555,172 Z" fill="#cbd5e1" stroke="#c0392b" stroke-width="2"/>
  <!-- Main terminal body -->
  <rect x="570" y="152" width="70" height="16" fill="#e2e8f0" stroke="#475569" stroke-width="1.5" rx="1"/>

  <!-- Red circle highlighting crimp on insulation -->
  <circle cx="562" cy="160" r="14" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="2,2"/>

  <!-- Red callout line & text -->
  <line x1="560" y1="225" x2="562" y2="178" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="515" y="240" font-size="12" font-weight="bold" fill="#c0392b">Обтиск по ізоляції!</text>

  <!-- Card A2 Text Explanation -->
  <text x="655" y="146" font-size="12" font-weight="bold" fill="#1a1a1a">Причина:</text>
  <text x="655" y="162" font-size="12" fill="#6b7280">Занадто глибоке вставлення провідника</text>
  <text x="655" y="182" font-size="12" font-weight="bold" fill="#c0392b">Наслідок:</text>
  <text x="655" y="198" font-size="12" fill="#c0392b">Ізоляція під жильним обтиском</text>
  <text x="655" y="214" font-size="12" fill="#c0392b">Немає ел. контакту / плаваючий опір</text>

  <!-- Section B Panel -->
  <rect x="20" y="290" width="920" height="205" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="35" y="312" font-size="14" font-weight="bold" fill="#1a1a1a">Б. Вплив розвантаження натягу на надійність з'єднання JST-SM</text>

  <!-- Card B1: Bad Practice -->
  <rect x="35" y="322" width="435" height="165" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="45" y="342" font-size="13" font-weight="bold" fill="#c0392b">❌ Без розвантаження натягу (Прямий натяг)</text>

  <!-- Drawing B1 Connector & Wires -->
  <!-- Housing -->
  <rect x="55" y="365" width="75" height="80" fill="#334155" rx="4"/>
  <rect x="50" y="380" width="5" height="50" fill="#1e293b"/>
  <rect x="120" y="375" width="10" height="16" fill="#64748b"/>
  <rect x="120" y="397" width="10" height="16" fill="#64748b"/>
  <rect x="120" y="419" width="10" height="16" fill="#64748b"/>

  <!-- Wires -->
  <line x1="130" y1="383" x2="235" y2="383" stroke="#ef4444" stroke-width="4"/>
  <!-- Middle wire being pulled out -->
  <line x1="155" y1="405" x2="235" y2="405" stroke="#10b981" stroke-width="4"/>
  <!-- Exposed contact / pulled terminal -->
  <rect x="130" y="401" width="25" height="8" fill="#d97706" stroke="#c0392b" stroke-width="1"/>
  <line x1="130" y1="427" x2="235" y2="427" stroke="#3b82f6" stroke-width="4"/>

  <!-- Pull Force Arrow -->
  <line x1="210" y1="405" x2="250" y2="405" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="245" y="398" font-size="12" font-weight="bold" fill="#c0392b">F_pull</text>

  <!-- Callout for pin pullout -->
  <line x1="170" y1="432" x2="142" y2="410" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="135" y="446" font-size="12" font-weight="bold" fill="#c0392b">Випадання піна!</text>

  <!-- Card B1 Explanation Text -->
  <text x="280" y="375" font-size="12" font-weight="bold" fill="#c0392b">Пряме навантаження:</text>
  <text x="280" y="395" font-size="12" fill="#c0392b">• Сила на контакті</text>
  <text x="280" y="415" font-size="12" fill="#c0392b">• Виривання піна</text>
  <text x="280" y="435" font-size="12" fill="#c0392b">• Обрив мідних жил</text>

  <!-- Card B2: Good Practice -->
  <rect x="490" y="322" width="435" height="165" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="500" y="342" font-size="13" font-weight="bold" fill="#27ae60">✓ З розвантаженням натягу (Фіксація хомутом)</text>

  <!-- Drawing B2 Connector & Wires & Clamp -->
  <!-- Housing -->
  <rect x="510" y="365" width="75" height="80" fill="#334155" rx="4"/>
  <rect x="505" y="380" width="5" height="50" fill="#1e293b"/>
  <rect x="575" y="375" width="10" height="16" fill="#64748b"/>
  <rect x="575" y="397" width="10" height="16" fill="#64748b"/>
  <rect x="575" y="419" width="10" height="16" fill="#64748b"/>

  <!-- Wires from connector to clamp -->
  <line x1="585" y1="383" x2="630" y2="383" stroke="#ef4444" stroke-width="4"/>
  <line x1="585" y1="405" x2="630" y2="405" stroke="#10b981" stroke-width="4"/>
  <line x1="585" y1="427" x2="630" y2="427" stroke="#3b82f6" stroke-width="4"/>

  <!-- Zero tension indicator -->
  <text x="575" y="365" font-size="12" font-weight="bold" fill="#27ae60">F = 0</text>

  <!-- Cable tie clamp & mounting bracket -->
  <rect x="628" y="376" width="12" height="58" fill="#0f172a" rx="2"/>
  <path d="M 634,434 L 634,465 L 595,465" stroke="#475569" stroke-width="3" fill="none"/>
  <circle cx="605" cy="465" r="4" fill="#94a3b8"/>

  <!-- Wires continuing past clamp -->
  <line x1="640" y1="383" x2="685" y2="383" stroke="#ef4444" stroke-width="4"/>
  <line x1="640" y1="405" x2="685" y2="405" stroke="#10b981" stroke-width="4"/>
  <line x1="640" y1="427" x2="685" y2="427" stroke="#3b82f6" stroke-width="4"/>

  <!-- Pull Force Arrow on cable past clamp -->
  <line x1="660" y1="405" x2="700" y2="405" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="680" y="398" font-size="12" font-weight="bold" fill="#2457d6">F_pull</text>

  <!-- Reaction Force Arrow at chassis mount -->
  <line x1="645" y1="465" x2="605" y2="465" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="600" y="480" font-size="12" font-weight="bold" fill="#27ae60">F_реакції</text>

  <!-- Card B2 Explanation Text -->
  <text x="730" y="375" font-size="12" font-weight="bold" fill="#27ae60">Розвантажено:</text>
  <text x="730" y="395" font-size="12" fill="#27ae60">• Сила гаситься хомутом</text>
  <text x="730" y="415" font-size="12" fill="#27ae60">• Нульовий натяг на пінах</text>
  <text x="730" y="435" font-size="12" fill="#27ae60">• Стійкість до вібрацій</text>
</svg>
