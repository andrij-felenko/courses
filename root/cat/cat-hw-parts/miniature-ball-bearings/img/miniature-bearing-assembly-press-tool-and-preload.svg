<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Header -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Монтажний вузол мініатюрного підшипника: оправка, дистанцер і натяг</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Передача монтажного зусилля F виключно на запресоване кільце та вибірка осьового люфту хвилястою пружиною</text>

  <!-- Panel 1: Left (x=30..480, y=85..430) -->
  <rect x="30" y="85" width="450" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="255" y="112" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Правильність прикладання монтажного зусилля</text>

  <!-- Left sub-box: CORRECT -->
  <rect x="42" y="125" width="210" height="295" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="147" y="148" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">ПРАВИЛЬНО</text>
  
  <!-- Schematic: Correct pressing -->
  <rect x="120" y="210" width="54" height="150" fill="#d0d7de" stroke="#1a1a1a"/>
  <rect x="100" y="240" width="20" height="80" fill="#2457d6" opacity="0.3" stroke="#1a1a1a"/>
  <circle cx="95" cy="260" r="6" fill="#6b7280"/>
  <circle cx="95" cy="280" r="6" fill="#6b7280"/>
  <circle cx="95" cy="300" r="6" fill="#6b7280"/>
  <rect x="80" y="240" width="12" height="80" fill="#6b7280" opacity="0.3" stroke="#1a1a1a"/>
  <path d="M100 170 L124 170 L124 235 L120 235 L120 238 L100 238 Z" fill="#2457d6" opacity="0.8" stroke="#1a1a1a"/>
  <line x1="112" y1="150" x2="112" y2="168" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>
  <text x="112" y="142" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">F</text>

  <text x="147" y="365" font-size="11" fill="#1a1a1a" text-anchor="middle">Оправка тисне СТРОГО на</text>
  <text x="147" y="380" font-size="11" fill="#1a1a1a" text-anchor="middle">внутрішнє кільце. Кульки</text>
  <text x="147" y="395" font-size="11" fill="#1a1a1a" text-anchor="middle">не навантажені (без вм'ятин).</text>

  <!-- Right sub-box: INCORRECT -->
  <rect x="258" y="125" width="210" height="295" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="363" y="148" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">НЕПРАВИЛЬНО</text>

  <!-- Schematic: Incorrect pressing -->
  <rect x="336" y="210" width="54" height="150" fill="#d0d7de" stroke="#1a1a1a"/>
  <rect x="316" y="240" width="20" height="80" fill="#2457d6" opacity="0.3" stroke="#1a1a1a"/>
  <circle cx="311" cy="260" r="6" fill="#c0392b"/>
  <circle cx="311" cy="280" r="6" fill="#c0392b"/>
  <circle cx="311" cy="300" r="6" fill="#c0392b"/>
  <rect x="296" y="240" width="12" height="80" fill="#6b7280" opacity="0.3" stroke="#1a1a1a"/>
  <path d="M294 170 L324 170 L324 238 L296 238 Z" fill="#c0392b" opacity="0.8" stroke="#1a1a1a"/>
  <text x="309" y="142" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">F</text>
  <line x1="309" y1="150" x2="309" y2="168" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

  <text x="363" y="365" font-size="11" fill="#1a1a1a" text-anchor="middle">Зусилля йде через кульки!</text>
  <text x="363" y="380" font-size="11" fill="#1a1a1a" text-anchor="middle">Виникає бринелювання</text>
  <text x="363" y="395" font-size="11" fill="#1a1a1a" text-anchor="middle">(вм'ятинки на доріжках).</text>


  <!-- Panel 2: Right (x=500..930, y=85..430) -->
  <rect x="500" y="85" width="430" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="715" y="112" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Складальний вузол з дистанцером і хвилястою пружиною</text>

  <!-- Housing & Shaft cross section -->
  <path d="M 530 140 L 900 140 L 900 395 L 530 395" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="530" y="228" width="370" height="44" fill="#d0d7de" stroke="#1a1a1a"/>

  <!-- Fixed bearing (Left) -->
  <rect x="580" y="170" width="16" height="56" fill="#6b7280" opacity="0.4" stroke="#1a1a1a"/>
  <circle cx="588" cy="195" r="3.5" fill="#1a1a1a"/>
  <circle cx="588" cy="207" r="3.5" fill="#1a1a1a"/>
  <rect x="600" y="170" width="16" height="56" fill="#2457d6" opacity="0.4" stroke="#1a1a1a"/>

  <rect x="580" y="274" width="16" height="56" fill="#6b7280" opacity="0.4" stroke="#1a1a1a"/>
  <circle cx="588" cy="295" r="3.5" fill="#1a1a1a"/>
  <circle cx="588" cy="307" r="3.5" fill="#1a1a1a"/>
  <rect x="600" y="274" width="16" height="56" fill="#2457d6" opacity="0.4" stroke="#1a1a1a"/>

  <!-- Spacer sleeve -->
  <rect x="616" y="195" width="134" height="31" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="616" y="274" width="134" height="31" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Floating bearing (Right) -->
  <rect x="750" y="170" width="16" height="56" fill="#6b7280" opacity="0.4" stroke="#1a1a1a"/>
  <circle cx="758" cy="195" r="3.5" fill="#1a1a1a"/>
  <circle cx="758" cy="207" r="3.5" fill="#1a1a1a"/>
  <rect x="770" y="170" width="16" height="56" fill="#2457d6" opacity="0.4" stroke="#1a1a1a"/>

  <rect x="750" y="274" width="16" height="56" fill="#6b7280" opacity="0.4" stroke="#1a1a1a"/>
  <circle cx="758" cy="295" r="3.5" fill="#1a1a1a"/>
  <circle cx="758" cy="307" r="3.5" fill="#1a1a1a"/>
  <rect x="770" y="274" width="16" height="56" fill="#2457d6" opacity="0.4" stroke="#1a1a1a"/>

  <!-- Wave spring -->
  <path d="M 738 170 Q 744 162 750 170 Q 756 178 762 170 Q 768 162 774 170" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="756" y="152" font-size="11" fill="#c0392b" text-anchor="middle">Хвиляста пружина (F_preload)</text>

  <!-- Labels -->
  <text x="683" y="348" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Дистанційна втулка</text>
  <text x="683" y="363" font-size="11" fill="#6b7280" text-anchor="middle">пирається на торці кілець</text>

  <text x="715" y="405" font-size="11" fill="#1a1a1a" text-anchor="middle">Плаваючий та фіксований підшипники з натягом 0.5–2% C0</text>

</svg>
