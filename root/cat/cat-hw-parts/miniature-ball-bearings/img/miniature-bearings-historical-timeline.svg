<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Еволюція мініатюрних підшипників: від авіаприладів до 3D-друку</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Хронологічний розвиток технологій прецизійної обробки, стандартизації та масового застосування</text>

  <!-- Timeline connector line (moved down to y=140 to avoid any text crossing) -->
  <line x1="30" y1="140" x2="930" y2="140" stroke="#d0d7de" stroke-width="3" stroke-linecap="round"/>

  <!-- Milestone 1: 1940-ві -->
  <rect x="30" y="90" width="205" height="335" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <!-- Year badge / header -->
  <rect x="50" y="105" width="165" height="30" rx="4" fill="#eaf0fd"/>
  <text x="132" y="125" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">1940-ві: Приладові опори</text>

  <circle cx="55" cy="172" r="4" fill="#2457d6"/>
  <text x="68" y="176" font-size="12" font-weight="bold" fill="#1a1a1a">Гіроскопи та приціли</text>
  <text x="50" y="200" font-size="11" fill="#1a1a1a">Ручне доведення сапфірових</text>
  <text x="50" y="216" font-size="11" fill="#1a1a1a">і кулькових опор, точність</text>
  <text x="50" y="232" font-size="11" fill="#1a1a1a">класу ABEC 5/7.</text>

  <circle cx="55" cy="270" r="4" fill="#2457d6"/>
  <text x="68" y="274" font-size="12" font-weight="bold" fill="#1a1a1a">Авіаційний виклик</text>
  <text x="50" y="298" font-size="11" fill="#1a1a1a">Мініатюризація для</text>
  <text x="50" y="314" font-size="11" fill="#1a1a1a">авіаційних гіроскопів</text>
  <text x="50" y="330" font-size="11" fill="#1a1a1a">Другої світової війни.</text>

  <!-- Milestone 2: 1960–70-ті -->
  <rect x="255" y="90" width="210" height="335" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="275" y="105" width="170" height="30" rx="4" fill="#eaf0fd"/>
  <text x="360" y="125" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">1960–70-ті: Шліфування</text>

  <circle cx="280" cy="172" r="4" fill="#2457d6"/>
  <text x="293" y="176" font-size="12" font-weight="bold" fill="#1a1a1a">Автоматизація NSK/NMB</text>
  <text x="275" y="200" font-size="11" fill="#1a1a1a">Поява автоматичних</text>
  <text x="275" y="216" font-size="11" fill="#1a1a1a">шліфувальних верстатів</text>
  <text x="275" y="232" font-size="11" fill="#1a1a1a">NSK та NMB (Японія).</text>

  <circle cx="280" cy="270" r="4" fill="#2457d6"/>
  <text x="293" y="274" font-size="12" font-weight="bold" fill="#1a1a1a">ISO стандартизація</text>
  <text x="275" y="298" font-size="11" fill="#1a1a1a">Стандартизація ISO/DIN</text>
  <text x="275" y="314" font-size="11" fill="#1a1a1a">для серій 62x та 68x,</text>
  <text x="275" y="330" font-size="11" fill="#1a1a1a">прилади і відеомагнітофони.</text>

  <!-- Milestone 3: 1980–90-ті -->
  <rect x="485" y="90" width="215" height="335" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="505" y="105" width="175" height="30" rx="4" fill="#eaf0fd"/>
  <text x="592" y="125" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">1980–90-ті: Ера HDD</text>

  <circle cx="510" cy="172" r="4" fill="#2457d6"/>
  <text x="523" y="176" font-size="12" font-weight="bold" fill="#1a1a1a">Мільйонні тиражі</text>
  <text x="505" y="200" font-size="11" fill="#1a1a1a">Підшипники шпинделів</text>
  <text x="505" y="216" font-size="11" fill="#1a1a1a">вінчестерів та крокових</text>
  <text x="505" y="232" font-size="11" fill="#1a1a1a">моторів.</text>

  <circle cx="510" cy="270" r="4" fill="#2457d6"/>
  <text x="523" y="274" font-size="12" font-weight="bold" fill="#1a1a1a">Лазер і мастила</text>
  <text x="505" y="298" font-size="11" fill="#1a1a1a">Впровадження лазерного</text>
  <text x="505" y="314" font-size="11" fill="#1a1a1a">балансування, ущільнень</text>
  <text x="505" y="330" font-size="11" fill="#1a1a1a">2RS та мастил.</text>

  <!-- Milestone 4: 2010-ті+ -->
  <rect x="720" y="90" width="210" height="335" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="740" y="105" width="170" height="30" rx="4" fill="#eaf0fd"/>
  <text x="825" y="125" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">2010-ті+: 3D-друк і дроти</text>

  <circle cx="745" cy="172" r="4" fill="#2457d6"/>
  <text x="758" y="176" font-size="12" font-weight="bold" fill="#1a1a1a">Відкриті 3D-принтери</text>
  <text x="740" y="200" font-size="11" fill="#1a1a1a">Типорозміри 608, 623,</text>
  <text x="740" y="216" font-size="11" fill="#1a1a1a">625 у принтерах RepRap,</text>
  <text x="740" y="232" font-size="11" fill="#1a1a1a">Creality, Voron.</text>

  <circle cx="745" cy="270" r="4" fill="#2457d6"/>
  <text x="758" y="274" font-size="12" font-weight="bold" fill="#1a1a1a">Дрони та BLDC мотори</text>
  <text x="740" y="298" font-size="11" fill="#1a1a1a">Тонкостінні підшипники</text>
  <text x="740" y="314" font-size="11" fill="#1a1a1a">685/686 у BLDC-моторах</text>
  <text x="740" y="330" font-size="11" fill="#1a1a1a">безпілотників.</text>
</svg>
