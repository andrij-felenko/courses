<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Визначення маркерів -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Внутрішня будова та кінематика мініатюрного кулькового підшипника</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Внутрішнє та зовнішнє кільця, сепаратор, тіла кочення та контактна заміна тертя ковзання на тертя кочення</text>

  <!-- Ліва панель: Конструктивний розріз -->
  <rect x="30" y="75" width="470" height="350" fill="#f4f6f8" stroke="#d0d7de" rx="6"/>
  <text x="265" y="102" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Конструктивний розріз радіального підшипника</text>

  <!-- Підшипник схема у розрізі (центр x=265, y=250) -->
  <!-- Зовнішнє кільце -->
  <path d="M 300,165 L 340,165 L 340,335 L 300,335 L 300,285 A 35,35 0 0,0 300,215 Z" fill="#e2e8f0" stroke="#6b7280" stroke-width="2"/>
  <!-- Внутрішнє кільце -->
  <path d="M 230,165 L 200,165 L 200,335 L 230,335 L 230,285 A 35,35 0 0,1 230,215 Z" fill="#e2e8f0" stroke="#6b7280" stroke-width="2"/>
  <!-- Кулька качення -->
  <circle cx="265" cy="250" r="24" fill="#eaf0fd" stroke="#2457d6" stroke-width="2.5"/>
  <ellipse cx="265" cy="250" rx="8" ry="12" fill="none" stroke="#2457d6" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Сепаратор (фрагмент зверху та знизу) -->
  <rect x="250" y="160" width="30" height="18" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  <rect x="250" y="322" width="30" height="18" rx="3" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>

  <!-- Позначення виносні (розміщені у вільних зонах без перетину з лініями) -->
  <text x="360" y="160" font-size="12" fill="#1a1a1a">Зовнішнє кільце</text>
  <line x1="340" y1="165" x2="355" y2="160" stroke="#6b7280" stroke-width="1"/>

  <text x="85" y="160" font-size="12" fill="#1a1a1a">Внутрішнє кільце</text>
  <line x1="200" y1="165" x2="185" y2="160" stroke="#6b7280" stroke-width="1"/>

  <text x="360" y="340" font-size="12" fill="#1a1a1a">Сепаратор</text>
  <line x1="280" y1="330" x2="355" y2="340" stroke="#6b7280" stroke-width="1"/>

  <text x="85" y="340" font-size="12" fill="#1a1a1a">Захисна шайба (Shield)</text>
  <line x1="200" y1="330" x2="185" y2="340" stroke="#6b7280" stroke-width="1"/>

  <text x="265" y="395" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Кулька качення (ШХ15 / 100Cr6) — точковий контакт</text>
  <text x="265" y="415" font-size="11" fill="#6b7280" text-anchor="middle">Радіальний зазор Gr та мастильна плівка в зоні контакту</text>


  <!-- Права панель: Трибологія та механіка -->
  <rect x="520" y="75" width="410" height="350" fill="#f4f6f8" stroke="#d0d7de" rx="6"/>

  <!-- Блок 1: Фізика кочення -->
  <rect x="535" y="90" width="380" height="150" fill="#e9f7ef" stroke="#27ae60" rx="4"/>
  <text x="550" y="115" font-size="14" font-weight="bold" fill="#27ae60">1. Фізика кочення (зелений блок)</text>
  <text x="550" y="138" font-size="12" fill="#1a1a1a">• Коефіцієнт тертя кочення μ_roll ≈ 0.001–0.0015</text>
  <text x="550" y="160" font-size="12" fill="#1a1a1a">  (у 50–100 разів нижче тертя ковзання втулок μ ≈ 0.1!)</text>
  <text x="550" y="182" font-size="12" fill="#1a1a1a">• Пружний контакт Герца: еліптична контактна площадка</text>
  <text x="550" y="204" font-size="12" fill="#1a1a1a">• Мікроплівка мастила h_0 > 0.1 мкм у гідродинамічному клині</text>

  <!-- Блок 2: Сепаратор та відмови -->
  <rect x="535" y="255" width="380" height="155" fill="#fdecea" stroke="#c0392b" rx="4"/>
  <text x="550" y="280" font-size="14" font-weight="bold" fill="#c0392b">2. Роль сепаратора та причини відмов</text>
  <text x="550" y="303" font-size="12" fill="#1a1a1a">• Без сепаратора: кульки торкаються зустрічно з</text>
  <text x="550" y="325" font-size="12" fill="#1a1a1a">  подвоєною швидкістю 2·v_c → миттєвий клин та задир!</text>
  <text x="550" y="347" font-size="12" fill="#1a1a1a">• Абразивні частки > 5 мкм руйнують доріжку (пітинг)</text>
  <text x="550" y="369" font-size="12" fill="#1a1a1a">• Рівномірний розподіл тіл кочення по кутовій кроці</text>

</svg>
