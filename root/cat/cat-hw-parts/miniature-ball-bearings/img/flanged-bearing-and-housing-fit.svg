<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Аксіальне базування вузла з фланцевим підшипником F625</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Упорний фланець D_f = 18 мм, товщина фланця C = 1.2 мм, дистанційні втулки та плаваюча опора</text>

  <!-- ЛІВА ПАНЕЛЬ -->
  <rect x="30" y="80" width="480" height="350" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="270" y="104" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Поздовжній розріз вузла складання</text>

  <!-- Вал d = 5 мм (y=222..258) -->
  <rect x="50" y="222" width="440" height="36" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="430" y="212" font-size="12" fill="#2457d6" text-anchor="middle">Вал d = 5 мм</text>

  <!-- Стінки корпусу (Housing) -->
  <rect x="150" y="125" width="45" height="40" fill="#d0d7de" stroke="#6b7280" stroke-width="1.2"/>
  <rect x="150" y="315" width="45" height="40" fill="#d0d7de" stroke="#6b7280" stroke-width="1.2"/>
  <text x="172" y="118" font-size="12" fill="#475569" text-anchor="middle">Стінка корпусу</text>

  <!-- Фланець підшипника F625 (x=138..150) -->
  <rect x="138" y="145" width="12" height="45" fill="#94a3b8" stroke="#1a1a1a" stroke-width="1.2"/>
  <rect x="138" y="290" width="12" height="45" fill="#94a3b8" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="95" y="140" font-size="12" fill="#1a1a1a" text-anchor="middle">Фланець D_f=18</text>
  <line x1="95" y1="145" x2="135" y2="160" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Тіло підшипника F625 (x=150..195, y=165..222 та y=258..315) -->
  <rect x="150" y="165" width="45" height="57" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <rect x="150" y="258" width="45" height="57" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
  <!-- Кульки підшипника -->
  <circle cx="172" cy="193" r="11" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="172" cy="287" r="11" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="172" y="380" font-size="12" fill="#1a1a1a" text-anchor="middle">Підшипник F625</text>

  <!-- Дистанційна втулка (x=210..285, y=212..222 та y=258..268) -->
  <rect x="210" y="212" width="75" height="10" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <rect x="210" y="258" width="75" height="10" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="247" y="195" font-size="12" fill="#27ae60" text-anchor="middle">Дистанційна втулка</text>
  <line x1="247" y1="200" x2="247" y2="210" stroke="#27ae60" stroke-width="1" marker-end="url(#arr-green)"/>

  <!-- Гайка / фіксатор (верх і низ окремо від вала: x=300..325, y=190..222 та y=258..290) -->
  <rect x="300" y="190" width="25" height="32" fill="#cbd5e1" stroke="#334155" stroke-width="1.2"/>
  <rect x="300" y="258" width="25" height="32" fill="#cbd5e1" stroke="#334155" stroke-width="1.2"/>
  <text x="312" y="180" font-size="12" fill="#334155" text-anchor="middle">Гайка</text>

  <!-- Стрілка осьової сили (чисто вільний простір угорі) -->
  <line x1="430" y1="160" x2="360" y2="160" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="445" y="164" font-size="12" font-weight="bold" fill="#c0392b">Осьова сила F_a</text>


  <!-- ПРАВА ПАНЕЛЬ -->
  <rect x="530" y="80" width="400" height="350" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="730" y="104" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема парного базування та застереження</text>

  <!-- Блок 1 -->
  <rect x="545" y="118" width="370" height="88" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="560" y="138" font-size="13" font-weight="bold" fill="#27ae60">1. Фіксована опора (Fixed Support)</text>
  <text x="560" y="158" font-size="12" fill="#1a1a1a">• Фланцевий F625 сприймає двосторонні радіальні</text>
  <text x="560" y="176" font-size="12" fill="#1a1a1a">  та односторонні осьові навантаження через фланець.</text>
  <text x="560" y="194" font-size="12" fill="#1a1a1a">• Спрощує корпус: наскрізний отвір без внутрішнього уступу.</text>

  <!-- Блок 2 -->
  <rect x="545" y="214" width="370" height="88" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="560" y="234" font-size="13" font-weight="bold" fill="#2457d6">2. Плаваюча опора та температурний зазор</text>
  <text x="560" y="254" font-size="12" fill="#1a1a1a">• Другий підшипник без фланця із зазором Delta_L = 0.5–1.0 мм.</text>
  <text x="560" y="272" font-size="12" fill="#1a1a1a">• Вільне осьове розширення вала при циклічному нагріві</text>
  <text x="560" y="290" font-size="12" fill="#1a1a1a">  (повністю усуває ризик осьового заклинювання кульок).</text>

  <!-- Блок 3 -->
  <rect x="545" y="310" width="370" height="106" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="560" y="330" font-size="13" font-weight="bold" fill="#c0392b">3. Критичне застереження монтажу</text>
  <text x="560" y="350" font-size="12" fill="#1a1a1a">• Шайба або шків, що торкаються одночасно внутрішнього</text>
  <text x="560" y="368" font-size="12" fill="#1a1a1a">  та зовнішнього кілець, повністю блокують обертання!</text>
  <text x="560" y="386" font-size="12" fill="#1a1a1a">• Втулка повинна контактувати ВИКЛЮЧНО з торцем</text>
  <text x="560" y="404" font-size="12" fill="#1a1a1a">  внутрішнього кільця (зазор до сепаратора ≥ 0.5 мм).</text>

</svg>
