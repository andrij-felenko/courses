<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Порівняння захисних шайб ZZ та контактних ущільнень 2RS</text>
  <text x="480" y="60" font-size="13" text-anchor="middle" fill="#6b7280">Безконтактний лабіринтний зазор металевих шайб ZZ проти еластомірної контактної кромки ущільнень 2RS</text>

  <!-- Left Panel: ZZ Shielded -->
  <rect x="30" y="85" width="440" height="335" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="250" y="115" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1a1a">Металева захисна шайба ZZ (Shielded)</text>

  <text x="50" y="145" font-size="12" fill="#1a1a1a"><tspan font-weight="700">Конструкція:</tspan> Тонкостінна профільована сталева шайба,</text>
  <text x="50" y="163" font-size="12" fill="#1a1a1a">завальцьована в канавку на зовнішньому кільці підшипника.</text>
  <text x="50" y="186" font-size="12" fill="#1a1a1a"><tspan font-weight="700">Зазор:</tspan> Безконтактний лабіринт Δ_gap ≈ 0.1–0.2 мм між</text>
  <text x="50" y="204" font-size="12" fill="#1a1a1a">шайбою та циліндричним буртиком внутрішнього кільця.</text>

  <!-- Green Box ZZ Properties -->
  <rect x="45" y="222" width="410" height="85" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="60" y="243" font-size="13" font-weight="700" fill="#27ae60">Властивості та переваги:</text>
  <text x="60" y="264" font-size="12" fill="#1a1a1a">• Нульове додаткове тертя (n_max до 100%, до 40–60 тис. об/хв)</text>
  <text x="60" y="284" font-size="12" fill="#1a1a1a">• Висока термостійкість матеріалу (робоча температура до +120°C)</text>

  <!-- Red Box ZZ Limitations -->
  <rect x="45" y="318" width="410" height="85" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="60" y="339" font-size="13" font-weight="700" fill="#c0392b">Обмеження:</text>
  <text x="60" y="360" font-size="12" fill="#1a1a1a">• Не герметичний: пропускає дрібний пил і вологу</text>
  <text x="60" y="380" font-size="12" fill="#1a1a1a">• Не призначений для роботи під струменями води або рідин</text>


  <!-- Right Panel: 2RS Rubber Sealed -->
  <rect x="490" y="85" width="440" height="335" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="710" y="115" font-size="15" font-weight="700" text-anchor="middle" fill="#1a1a1a">Гумове контактне ущільнення 2RS (Rubber)</text>

  <text x="510" y="145" font-size="12" fill="#1a1a1a"><tspan font-weight="700">Конструкція:</tspan> Еластомір NBR (бутадієн-нітрильний</text>
  <text x="510" y="163" font-size="12" fill="#1a1a1a">каучук), армований сталевою пластиною всередині.</text>
  <text x="510" y="186" font-size="12" fill="#1a1a1a"><tspan font-weight="700">Кромка:</tspan> Пружна контактна губа притискається до</text>
  <text x="510" y="204" font-size="12" fill="#1a1a1a">спеціальної проточки на буртику внутрішнього кільця.</text>

  <!-- Green Box 2RS Properties -->
  <rect x="505" y="222" width="410" height="85" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="520" y="243" font-size="13" font-weight="700" fill="#27ae60">Властивості та переваги:</text>
  <text x="520" y="264" font-size="12" fill="#1a1a1a">• Повний герметичний захист від пилу, бруду та бризок (IP65+)</text>
  <text x="520" y="284" font-size="12" fill="#1a1a1a">• Надійне утримання консистентного мастила всередині вузла</text>

  <!-- Red Box 2RS Limitations -->
  <rect x="505" y="318" width="410" height="85" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="520" y="339" font-size="13" font-weight="700" fill="#c0392b">Обмеження:</text>
  <text x="520" y="360" font-size="12" fill="#1a1a1a">• Механічне тертя кромки: втрата швидкості на 20–30% (n_max 70%)</text>
  <text x="520" y="380" font-size="12" fill="#1a1a1a">• Нагрів при обертанні та обмеження температури до +80..+100°C</text>

</svg>
