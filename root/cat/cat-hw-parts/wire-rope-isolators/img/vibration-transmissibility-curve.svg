<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Амплітудно-частотна характеристика та зони віброізоляції</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">При f / fn &gt; 1.414 починається гасіння вібрацій; демпфування обмежує резонансний пік</text>

  <!-- Left Main Panel (Graph Container) -->
  <rect x="30" y="70" width="620" height="445" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>

  <!-- Right Info Panel -->
  <rect x="665" y="70" width="265" height="445" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>

  <!-- Inside Graph Panel: Zone Backgrounds -->
  <rect x="110" y="120" width="236" height="310" fill="#fdecea" rx="4"/>
  <rect x="346" y="120" width="264" height="310" fill="#e9f7ef" rx="4"/>

  <!-- Gridlines -->
  <line x1="110" y1="343" x2="610" y2="343" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="110" y1="256" x2="610" y2="256" stroke="#d0d7de" stroke-dasharray="3,3"/>
  <line x1="110" y1="170" x2="610" y2="170" stroke="#d0d7de" stroke-dasharray="3,3"/>

  <!-- Vertical Grid & Thresholds -->
  <line x1="193" y1="120" x2="193" y2="430" stroke="#d0d7de" stroke-dasharray="3,3"/>
  <line x1="277" y1="120" x2="277" y2="430" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="346" y1="120" x2="346" y2="430" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="443" y1="120" x2="443" y2="430" stroke="#d0d7de" stroke-dasharray="3,3"/>
  <line x1="610" y1="120" x2="610" y2="430" stroke="#d0d7de" stroke-dasharray="3,3"/>

  <!-- Axis Titles -->
  <text x="45" y="88" font-size="13" font-weight="bold" fill="#1a1a1a">Коефіцієнт передачі T (Vout / Vin)</text>

  <!-- Zone Badges inside Graph -->
  <rect x="120" y="365" width="215" height="44" fill="#ffffff" stroke="#c0392b" stroke-width="1" rx="4"/>
  <text x="227" y="383" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Зона підсилення (T &gt; 1)</text>
  <text x="227" y="400" font-size="12" fill="#c0392b" text-anchor="middle">f / fn &lt; 1.414 — підсилення вібрацій</text>

  <rect x="365" y="135" width="235" height="44" fill="#ffffff" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="482" y="153" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Зона віброізоляції (T &lt; 1)</text>
  <text x="482" y="170" font-size="12" fill="#27ae60" text-anchor="middle">f / fn &gt; 1.414 — ефективне гасіння</text>

  <!-- Curves -->
  <!-- Low Damping (zeta = 0.05) -->
  <path d="M 110 343 C 150 343, 175 330, 193 313 C 220 288, 250 200, 277 135 C 295 190, 320 290, 346 343 C 380 400, 440 405, 610 420" fill="none" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Wire Rope Isolator (zeta = 0.20) -->
  <path d="M 110 343 C 150 343, 175 332, 193 318 C 220 295, 252 230, 277 208 C 295 225, 322 305, 346 343 C 380 380, 440 390, 610 409" fill="none" stroke="#2457d6" stroke-width="3"/>

  <!-- Silicone / High Damping (zeta = 0.50) -->
  <path d="M 110 343 C 150 343, 175 335, 193 328 C 230 316, 255 312, 277 312 C 300 312, 325 328, 346 343 C 380 360, 440 373, 610 391" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Invariant Intersection Point (346, 343) -->
  <circle cx="346" cy="343" r="5" fill="#1a1a1a"/>

  <!-- Invariant Point Callout Badge -->
  <rect x="350" y="270" width="185" height="38" fill="#ffffff" stroke="#1a1a1a" stroke-width="1" rx="4"/>
  <text x="442" y="285" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Точка інваріантності T = 1</text>
  <text x="442" y="302" font-size="12" fill="#6b7280" text-anchor="middle">Не залежить від демпфування</text>
  <line x1="365" y1="308" x2="348" y2="338" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Axes lines -->
  <line x1="110" y1="430" x2="110" y2="105" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-main)"/>
  <line x1="110" y1="430" x2="622" y2="430" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-main)"/>

  <!-- Y Ticks & Labels -->
  <text x="102" y="174" font-size="12" fill="#6b7280" text-anchor="end">3.0</text>
  <text x="102" y="260" font-size="12" fill="#6b7280" text-anchor="end">2.0</text>
  <text x="102" y="347" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">1.0</text>
  <text x="102" y="434" font-size="12" fill="#6b7280" text-anchor="end">0.0</text>

  <!-- X Ticks & Labels -->
  <text x="110" y="448" font-size="12" fill="#6b7280" text-anchor="middle">0</text>
  <text x="193" y="448" font-size="12" fill="#6b7280" text-anchor="middle">0.5</text>
  <text x="277" y="448" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">1.0</text>
  <text x="346" y="448" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1.414</text>
  <text x="443" y="448" font-size="12" fill="#6b7280" text-anchor="middle">2.0</text>
  <text x="610" y="448" font-size="12" fill="#6b7280" text-anchor="middle">3.0</text>

  <!-- X Axis Main Label -->
  <text x="360" y="475" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Співвідношення частот збудження та власної частоти, f / fn</text>

  <!-- Resonance Peak Annotation -->
  <text x="277" y="108" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Резонанс (f = fn)</text>

  <!-- Right Info Panel Cards -->
  <!-- Card 1: Damping Legend -->
  <rect x="680" y="85" width="235" height="195" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="695" y="108" font-size="14" font-weight="bold" fill="#1a1a1a">Коефіцієнт демпфування ζ</text>

  <!-- Item 1: Low -->
  <rect x="695" y="122" width="14" height="14" fill="#c0392b" rx="2"/>
  <text x="717" y="134" font-size="12" font-weight="bold" fill="#c0392b">ζ = 0.05 — Мале гасіння</text>
  <text x="717" y="150" font-size="12" fill="#6b7280">Пружини (високий пік)</text>

  <!-- Item 2: Wire Rope -->
  <rect x="695" y="170" width="14" height="14" fill="#2457d6" rx="2"/>
  <text x="717" y="182" font-size="12" font-weight="bold" fill="#2457d6">ζ = 0.20 — Wire Rope</text>
  <text x="717" y="198" font-size="12" fill="#6b7280">Тросові (сухе тертя жил)</text>

  <!-- Item 3: Silicone -->
  <rect x="695" y="218" width="14" height="14" fill="#27ae60" rx="2"/>
  <text x="717" y="230" font-size="12" font-weight="bold" fill="#27ae60">ζ = 0.50 — Високе гасіння</text>
  <text x="717" y="246" font-size="12" fill="#6b7280">Силіконові демпфери</text>

  <!-- Card 2: Key Engineering Takeaways -->
  <rect x="680" y="295" width="235" height="205" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="695" y="318" font-size="14" font-weight="bold" fill="#1a1a1a">Інженерні правила</text>

  <text x="695" y="340" font-size="12" font-weight="bold" fill="#c0392b">1. Зона f / fn &lt; 1.414:</text>
  <text x="705" y="356" font-size="12" fill="#1a1a1a">Підсилення вібрацій (T &gt; 1).</text>
  <text x="705" y="372" font-size="12" fill="#6b7280">Демпфування знижує пік.</text>

  <text x="695" y="396" font-size="12" font-weight="bold" fill="#27ae60">2. Зона f / fn &gt; 1.414:</text>
  <text x="705" y="412" font-size="12" fill="#1a1a1a">Ізоляція вібрацій (T &lt; 1).</text>
  <text x="705" y="428" font-size="12" fill="#6b7280">Низьке ζ покращує гасіння.</text>

  <text x="695" y="452" font-size="12" font-weight="bold" fill="#2457d6">3. Баланс Wire Rope:</text>
  <text x="705" y="468" font-size="12" fill="#1a1a1a">Гасить пік у резонансі</text>
  <text x="705" y="484" font-size="12" fill="#6b7280">та ізолює на високих f.</text>
</svg>
