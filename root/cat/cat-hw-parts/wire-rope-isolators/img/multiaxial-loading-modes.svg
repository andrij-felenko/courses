<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Режими багатоосьового навантаження тросових та силіконових віброізоляторів</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Жорсткість залежить від осі деформації: @@en|compression mode@@ — макс., @@en|shear mode@@ — найбільший хід</text>

  <!-- ================= CARD 1: COMPRESSION ================= -->
  <rect x="20" y="70" width="218" height="450" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="30" y="80" width="198" height="40" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="129" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">1. Стиск (@@en|Compression@@)</text>
  <text x="129" y="112" text-anchor="middle" font-size="12" fill="#1a1a1a">Осьова сила -F_z</text>

  <!-- Diagram Box 1 -->
  <rect x="30" y="126" width="198" height="150" rx="5" fill="#ffffff" stroke="#e1e4e8" stroke-width="1"/>
  <text x="79" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Трос (Wire)</text>
  <text x="179" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Силікон</text>

  <!-- Plates 1 -->
  <rect x="35" y="182" width="88" height="6" rx="1" fill="#cbd5e1" stroke="#64748b" stroke-width="0.75"/>
  <rect x="35" y="236" width="88" height="6" rx="1" fill="#94a3b8" stroke="#475569" stroke-width="0.75"/>
  <rect x="135" y="182" width="88" height="6" rx="1" fill="#cbd5e1" stroke="#64748b" stroke-width="0.75"/>
  <rect x="135" y="236" width="88" height="6" rx="1" fill="#94a3b8" stroke="#475569" stroke-width="0.75"/>

  <!-- Wire Rope Compressed 1 -->
  <path d="M 79,188 C 38,198 38,226 79,236" fill="none" stroke="#2457d6" stroke-width="3"/>
  <path d="M 79,188 C 48,201 48,223 79,236" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <line x1="79" y1="148" x2="79" y2="174" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="88" y="164" font-size="12" font-weight="bold" fill="#c0392b">-F_z</text>

  <!-- Silicone Compressed 1 -->
  <path d="M 162,188 Q 150,212 162,236 L 196,236 Q 208,212 196,188 Z" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <line x1="179" y1="148" x2="179" y2="174" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="170" y="164" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">-F_z</text>

  <!-- Summary Box 1 -->
  <rect x="30" y="286" width="198" height="224" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="42" y="304" font-size="12" font-weight="bold" fill="#2457d6">Жорсткість: k_z = MAX</text>
  <text x="42" y="322" font-size="12" fill="#1a1a1a">Робочий хід: низький</text>
  <text x="42" y="340" font-size="12" fill="#1a1a1a">Гасіння: помірне</text>
  <text x="42" y="358" font-size="12" fill="#1a1a1a">Ризик пробою: високий</text>
  <line x1="38" y1="368" x2="220" y2="368" stroke="#d0d7de" stroke-width="1"/>

  <text x="42" y="384" font-size="12" font-weight="bold" fill="#2457d6">Поведінка троса:</text>
  <text x="42" y="400" font-size="12" fill="#1a1a1a">• Ущільнення жил троса</text>
  <text x="42" y="416" font-size="12" fill="#1a1a1a">• Зростання тертя</text>

  <text x="42" y="434" font-size="12" font-weight="bold" fill="#27ae60">Поведінка силікону:</text>
  <text x="42" y="450" font-size="12" fill="#1a1a1a">• Бокове випинання</text>
  <text x="42" y="466" font-size="12" fill="#1a1a1a">• Нелінійна жорсткість</text>

  <rect x="38" y="476" width="182" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="129" y="492" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Ризик: @@en|bottoming out@@</text>

  <!-- ================= CARD 2: TENSION ================= -->
  <rect x="254" y="70" width="218" height="450" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="264" y="80" width="198" height="40" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="363" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">2. Розтяг (@@en|Tension@@)</text>
  <text x="363" y="112" text-anchor="middle" font-size="12" fill="#1a1a1a">Відривна сила +F_z</text>

  <!-- Diagram Box 2 -->
  <rect x="264" y="126" width="198" height="150" rx="5" fill="#ffffff" stroke="#e1e4e8" stroke-width="1"/>
  <text x="313" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Трос (Wire)</text>
  <text x="413" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Силікон</text>

  <!-- Plates 2 -->
  <rect x="269" y="172" width="88" height="6" rx="1" fill="#cbd5e1" stroke="#64748b" stroke-width="0.75"/>
  <rect x="269" y="236" width="88" height="6" rx="1" fill="#94a3b8" stroke="#475569" stroke-width="0.75"/>
  <rect x="369" y="172" width="88" height="6" rx="1" fill="#cbd5e1" stroke="#64748b" stroke-width="0.75"/>
  <rect x="369" y="236" width="88" height="6" rx="1" fill="#94a3b8" stroke="#475569" stroke-width="0.75"/>

  <!-- Wire Rope Tension 2 -->
  <path d="M 313,178 C 295,193 295,221 313,236" fill="none" stroke="#2457d6" stroke-width="3"/>
  <path d="M 313,178 C 302,196 302,218 313,236" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <line x1="313" y1="168" x2="313" y2="148" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="322" y="162" font-size="12" font-weight="bold" fill="#2457d6">+F_z</text>

  <!-- Silicone Tension 2 -->
  <path d="M 396,178 Q 407,207 396,236 L 430,236 Q 419,207 430,178 Z" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <line x1="413" y1="168" x2="413" y2="148" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="404" y="162" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">+F_z</text>

  <!-- Summary Box 2 -->
  <rect x="264" y="286" width="198" height="224" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="276" y="304" font-size="12" font-weight="bold" fill="#2457d6">Жорсткість: k_t ≈ 0.7 k_z</text>
  <text x="276" y="322" font-size="12" fill="#1a1a1a">Робочий хід: середній</text>
  <text x="276" y="340" font-size="12" fill="#1a1a1a">Гасіння: знижене</text>
  <text x="276" y="358" font-size="12" fill="#1a1a1a">Ризик: розрив силікону</text>
  <line x1="272" y1="368" x2="454" y2="368" stroke="#d0d7de" stroke-width="1"/>

  <text x="276" y="384" font-size="12" font-weight="bold" fill="#2457d6">Поведінка троса:</text>
  <text x="276" y="400" font-size="12" fill="#1a1a1a">• Витягування петель</text>
  <text x="276" y="416" font-size="12" fill="#1a1a1a">• Падіння тертя жил</text>

  <text x="276" y="434" font-size="12" font-weight="bold" fill="#27ae60">Поведінка силікону:</text>
  <text x="276" y="450" font-size="12" fill="#1a1a1a">• Потоншення центру</text>
  <text x="276" y="466" font-size="12" fill="#1a1a1a">• Загроза відшарування</text>

  <rect x="272" y="476" width="182" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="363" y="492" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Захист від розриву</text>

  <!-- ================= CARD 3: SHEAR ================= -->
  <rect x="488" y="70" width="218" height="450" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="498" y="80" width="198" height="40" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="597" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">3. Зсув (@@en|Shear@@)</text>
  <text x="597" y="112" text-anchor="middle" font-size="12" fill="#1a1a1a">Поперечна сила F_x</text>

  <!-- Diagram Box 3 -->
  <rect x="498" y="126" width="198" height="150" rx="5" fill="#ffffff" stroke="#e1e4e8" stroke-width="1"/>
  <text x="547" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Трос (Wire)</text>
  <text x="647" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Силікон</text>

  <!-- Plates 3 (Sheared) -->
  <rect x="518" y="172" width="78" height="6" rx="1" fill="#cbd5e1" stroke="#64748b" stroke-width="0.75"/>
  <rect x="503" y="236" width="88" height="6" rx="1" fill="#94a3b8" stroke="#475569" stroke-width="0.75"/>
  <rect x="620" y="172" width="72" height="6" rx="1" fill="#cbd5e1" stroke="#64748b" stroke-width="0.75"/>
  <rect x="603" y="236" width="88" height="6" rx="1" fill="#94a3b8" stroke="#475569" stroke-width="0.75"/>

  <!-- Wire Rope Shear 3 -->
  <path d="M 560,178 C 520,190 510,224 547,236" fill="none" stroke="#27ae60" stroke-width="3"/>
  <path d="M 560,178 C 532,194 522,220 547,236" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <line x1="525" y1="160" x2="548" y2="160" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="502" y="164" font-size="12" font-weight="bold" fill="#27ae60">F_x</text>

  <!-- Silicone Shear 3 -->
  <path d="M 643,178 L 685,178 L 665,236 L 623,236 Z" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <line x1="625" y1="160" x2="647" y2="160" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="602" y="164" font-size="12" font-weight="bold" fill="#27ae60">F_x</text>

  <!-- Summary Box 3 -->
  <rect x="498" y="286" width="198" height="224" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="510" y="304" font-size="12" font-weight="bold" fill="#27ae60">Жорсткість: k_x ≈ 0.25 k_z</text>
  <text x="510" y="322" font-size="12" fill="#1a1a1a">Робочий хід: максимум</text>
  <text x="510" y="340" font-size="12" fill="#1a1a1a">Гасіння: макс. η ≈ 0.25</text>
  <text x="510" y="358" font-size="12" fill="#1a1a1a">Пробивання: відсутнє</text>
  <line x1="506" y1="368" x2="688" y2="368" stroke="#d0d7de" stroke-width="1"/>

  <text x="510" y="384" font-size="12" font-weight="bold" fill="#2457d6">Поведінка троса:</text>
  <text x="510" y="400" font-size="12" fill="#1a1a1a">• Зсув жил без блоку</text>
  <text x="510" y="416" font-size="12" fill="#1a1a1a">• М'яке поглинання</text>

  <text x="510" y="434" font-size="12" font-weight="bold" fill="#27ae60">Поведінка силікону:</text>
  <text x="510" y="450" font-size="12" fill="#1a1a1a">• Зсувна релаксація</text>
  <text x="510" y="466" font-size="12" fill="#1a1a1a">• Низький опір зсуву G</text>

  <rect x="506" y="476" width="182" height="24" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="597" y="492" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Оптимальна віброізоляція</text>

  <!-- ================= CARD 4: ROLL ================= -->
  <rect x="722" y="70" width="218" height="450" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="732" y="80" width="198" height="40" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="831" y="96" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">4. Крен (@@en|Roll Mode@@)</text>
  <text x="831" y="112" text-anchor="middle" font-size="12" fill="#1a1a1a">Момент скручування M_θ</text>

  <!-- Diagram Box 4 -->
  <rect x="732" y="126" width="198" height="150" rx="5" fill="#ffffff" stroke="#e1e4e8" stroke-width="1"/>
  <text x="781" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Трос (Wire)</text>
  <text x="881" y="140" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Силікон</text>

  <!-- Plates 4 (Tilted) -->
  <polygon points="737,178 825,166 825,172 737,184" fill="#cbd5e1" stroke="#64748b" stroke-width="0.75"/>
  <rect x="737" y="236" width="88" height="6" rx="1" fill="#94a3b8" stroke="#475569" stroke-width="0.75"/>
  <polygon points="837,178 925,166 925,172 837,184" fill="#cbd5e1" stroke="#64748b" stroke-width="0.75"/>
  <rect x="837" y="236" width="88" height="6" rx="1" fill="#94a3b8" stroke="#475569" stroke-width="0.75"/>

  <!-- Wire Rope Roll 4 -->
  <path d="M 781,171 C 742,185 745,225 781,236" fill="none" stroke="#2457d6" stroke-width="3"/>
  <path d="M 781,171 C 754,192 757,218 781,236" fill="none" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 755,153 A 12,12 0 0,1 782,156" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="787" y="158" font-size="12" font-weight="bold" fill="#c0392b">M_θ</text>

  <!-- Silicone Roll 4 -->
  <path d="M 855,175 L 907,168 L 907,236 L 855,236 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>

  <!-- Summary Box 4 -->
  <rect x="732" y="286" width="198" height="224" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="744" y="304" font-size="12" font-weight="bold" fill="#2457d6">Жорсткість: k_θ (комбін.)</text>
  <text x="744" y="322" font-size="12" fill="#1a1a1a">Кутовий хід: θ до 20°</text>
  <text x="744" y="340" font-size="12" fill="#1a1a1a">Гасіння: нерівномірне</text>
  <text x="744" y="358" font-size="12" fill="#1a1a1a">Особливість: зсув осей</text>
  <line x1="740" y1="368" x2="922" y2="368" stroke="#d0d7de" stroke-width="1"/>

  <text x="744" y="384" font-size="12" font-weight="bold" fill="#2457d6">Поведінка троса:</text>
  <text x="744" y="400" font-size="12" fill="#1a1a1a">• Асиметричний згин</text>
  <text x="744" y="416" font-size="12" fill="#1a1a1a">• Перерозподіл тертя</text>

  <text x="744" y="434" font-size="12" font-weight="bold" fill="#27ae60">Поведінка силікону:</text>
  <text x="744" y="450" font-size="12" fill="#1a1a1a">• Клиновидна деформація</text>
  <text x="744" y="466" font-size="12" fill="#1a1a1a">• Крайові напруження</text>

  <rect x="740" y="476" width="182" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="831" y="492" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Монтаж під кутом 45°</text>
</svg>
