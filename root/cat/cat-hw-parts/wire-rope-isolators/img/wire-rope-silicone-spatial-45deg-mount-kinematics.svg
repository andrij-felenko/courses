<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Кінематика та векторний розподіл сил у просторовому підвісі під кутом 45°</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Орієнтація ізоляторів у режимі зсув-стиск вирівнює просторову жорсткість та усуває кволі резонанси</text>

  <!-- ЛІВА ПАНЕЛЬ: Просторова геометрія монтажу підвісу -->
  <rect x="30" y="70" width="435" height="390" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="50" y="96" font-size="14" font-weight="bold" fill="#1a1a1a">1. Схема просторового монтажу корисного навантаження</text>

  <!-- Зовнішня рама (база) -->
  <rect x="65" y="120" width="365" height="280" rx="6" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="80" y="138" font-size="11" fill="#6b7280">Несуча рама апарата (Base Frame)</text>

  <!-- Внутрішнє корисне навантаження (Payload) -->
  <rect x="155" y="195" width="185" height="130" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="247" y="245" text-anchor="middle" font-size="14" font-weight="bold" fill="#2457d6">Корисне навантаження</text>
  <text x="247" y="265" text-anchor="middle" font-size="12" fill="#2457d6">Payload (маса M)</text>
  <text x="247" y="285" text-anchor="middle" font-size="11" fill="#6b7280">Камера / IMU / Лідар</text>

  <!-- 4 підвіси під 45° -->
  <!-- Верхній лівий -->
  <line x1="85" y1="140" x2="155" y2="210" stroke="#27ae60" stroke-width="5" stroke-linecap="round"/>
  <text x="75" y="195" font-size="11" font-weight="bold" fill="#27ae60">45°</text>

  <!-- Верхній правий -->
  <line x1="410" y1="140" x2="340" y2="210" stroke="#27ae60" stroke-width="5" stroke-linecap="round"/>
  <text x="390" y="195" font-size="11" font-weight="bold" fill="#27ae60">45°</text>

  <!-- Нижній лівий -->
  <line x1="85" y1="380" x2="155" y2="310" stroke="#27ae60" stroke-width="5" stroke-linecap="round"/>
  <text x="75" y="335" font-size="11" font-weight="bold" fill="#27ae60">45°</text>

  <!-- Нижній правий -->
  <line x1="410" y1="380" x2="340" y2="310" stroke="#27ae60" stroke-width="5" stroke-linecap="round"/>
  <text x="390" y="335" font-size="11" font-weight="bold" fill="#27ae60">45°</text>

  <!-- Позначення підвісу -->
  <text x="247" y="425" text-anchor="middle" font-size="12" fill="#1a1a1a">Комбіновані ізолятори: сталевий трос + силіконовий демпфер</text>
  <text x="247" y="445" text-anchor="middle" font-size="11" fill="#6b7280">Працюють одночасно на зсув (shear) та стиск (compression)</text>

  <!-- ПРАВА ПАНЕЛЬ: Векторне розкладання сил та еквівалентна жорсткість -->
  <rect x="485" y="70" width="445" height="390" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="505" y="96" font-size="14" font-weight="bold" fill="#1a1a1a">2. Векторне розкладання сил жорсткості вузла</text>

  <!-- Векторна діаграма -->
  <!-- Осі глобальні X та Z -->
  <line x1="530" y1="210" x2="680" y2="210" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-main)"/>
  <text x="685" y="214" font-size="12" font-weight="bold" fill="#1a1a1a">X (зсув)</text>

  <line x1="530" y1="210" x2="530" y2="105" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-main)"/>
  <text x="535" y="115" font-size="12" font-weight="bold" fill="#1a1a1a">Z (стиск)</text>

  <!-- Вісь підвісу під 45° -->
  <line x1="530" y1="210" x2="650" y2="120" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="655" y="125" font-size="11" fill="#6b7280">Вісь ізолятора (45°)</text>

  <!-- Вектор сили нормального стиску F_c -->
  <line x1="530" y1="210" x2="615" y2="146" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="625" y="150" font-size="12" font-weight="bold" fill="#2457d6">F_c (стиск)</text>

  <!-- Вектор сили тангенціального зсуву F_s -->
  <line x1="530" y1="210" x2="590" y2="270" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="600" y="275" font-size="12" font-weight="bold" fill="#c0392b">F_s (зсув)</text>

  <!-- Розрахунковий блок -->
  <rect x="505" y="300" width="405" height="145" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="520" y="322" font-size="12" font-weight="bold" fill="#1a1a1a">Формули еквівалентної жорсткості підвісу:</text>
  
  <text x="520" y="344" font-size="12" fill="#2457d6">K_z = K_c · sin²(45°) + K_s · cos²(45°) = 0.5 · (K_c + K_s)</text>
  <text x="520" y="366" font-size="12" fill="#c0392b">K_x = K_c · cos²(45°) + K_s · sin²(45°) = 0.5 · (K_c + K_s)</text>

  <line x1="520" y1="380" x2="895" y2="380" stroke="#e1e4e8" stroke-width="1"/>

  <text x="520" y="402" font-size="12" font-weight="bold" fill="#27ae60">Головний висновок: K_z = K_x (повна ізотропність)</text>
  <text x="520" y="424" font-size="11" fill="#6b7280">Кут 45° повністю ліквідує перекоси та паразитні обертальні моди блоку</text>
</svg>
