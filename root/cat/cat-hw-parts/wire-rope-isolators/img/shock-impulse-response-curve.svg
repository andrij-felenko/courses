<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Полотно -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часовий відгук на ударний імпульс та явище пробивання</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Перевищення робочого ходу демпфера x_limit викликає жорсткий контакт і піковий стрибок прискорення</text>

  <!-- ЛІВА ПАНЕЛЬ: Графік часового відгуку -->
  <rect x="25" y="68" width="500" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="45" y="94" font-size="15" font-weight="bold" fill="#1a1a1a">Відгук системи SDOF на напівсинусоїду удару</text>

  <!-- Графічна область -->
  <rect x="45" y="112" width="460" height="260" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Осі координат -->
  <!-- Горизонтальна вісь часу t -->
  <line x1="75" y1="280" x2="485" y2="280" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr-black)"/>
  <text x="485" y="300" font-size="11" fill="#1a1a1a" text-anchor="end">Час t (мс)</text>

  <!-- Вертикальна вісь прискорення a(t) -->
  <line x1="75" y1="355" x2="75" y2="125" stroke="#1a1a1a" stroke-width="1.8" marker-end="url(#arr-black)"/>
  <text x="80" y="128" font-size="11" fill="#1a1a1a">Прискорення a(t)</text>

  <!-- Вхідний імпульс удару a_in(t) (напівсинусоїда червоного кольору) -->
  <path d="M75,280 C85,280 100,180 120,180 C140,180 155,280 165,280" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="120" y="298" font-size="10" fill="#64748b" text-anchor="middle">Вхідний удар a_in</text>

  <!-- Лінія межі ходу демпфера (упор / bottoming out limit) -->
  <line x1="75" y1="160" x2="485" y2="160" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4,3"/>
  <text x="480" y="152" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="end">Межа ходу ізолятора (упор)</text>

  <!-- Крива 1: Нормальна амортизація без пробивання (синя плавна згасаюча синусоїда) -->
  <path d="M75,280 C110,280 140,200 180,200 C230,200 270,330 310,330 C350,330 380,265 410,265 C440,265 460,285 480,280" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <text x="210" y="215" font-size="11" font-weight="bold" fill="#2457d6">Нормальна розв'язка</text>
  <text x="210" y="228" font-size="10" fill="#6b7280">(плавне згасання)</text>

  <!-- Крива 2: Пробивання ізолятора (Bottoming out) - катастрофічний сплеск прискорення -->
  <path d="M75,280 C100,280 125,220 145,160 L155,132 L165,190 C180,270 200,310 230,280" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="155" cy="132" r="4.5" fill="#c0392b"/>
  <text x="165" y="140" font-size="11" font-weight="bold" fill="#c0392b">Сплеск a_peak (удар об метал)</text>

  <!-- Пояснення внизу лівої панелі -->
  <text x="275" y="390" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Явище пробивання множить пікове перевантаження у 3–5 разів</text>
  <text x="275" y="408" font-size="11" fill="#6b7280" text-anchor="middle">Коли трос вибирає хід, плавний демпфер миттєво перетворюється на жорсткий зв'язок</text>


  <!-- ПРАВА ПАНЕЛЬ: Фізика удару та правила розрахунку -->
  <rect x="545" y="68" width="390" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="565" y="94" font-size="15" font-weight="bold" fill="#1a1a1a">Критерії розрахунку та захисту від пробивання</text>

  <!-- Картка 1: Динамічний хід -->
  <rect x="565" y="112" width="350" height="98" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="580" y="134" font-size="12" font-weight="bold" fill="#2457d6">Оцінка пікового динамічного ходу x_max:</text>
  <text x="580" y="154" font-size="13" font-weight="bold" fill="#1a1a1a">x_max ≈ (2 · A_in · τ_shock) / (π · ω_n)</text>
  <text x="580" y="174" font-size="11" fill="#1a1a1a">• τ_shock — тривалість удару (стандарт MIL-STD-810: 11 мс)</text>
  <text x="580" y="190" font-size="11" fill="#6b7280">• ω_n = √(k/m) — кругова власна частота системи</text>

  <!-- Картка 2: Небезпека Bottoming Out -->
  <rect x="565" y="220" width="350" height="105" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="580" y="242" font-size="12" font-weight="bold" fill="#c0392b">Фізичний механізм механічного пробою:</text>
  <text x="580" y="262" font-size="11" fill="#1a1a1a">• При x &gt; x_stroke петлі троса торкаються планок кріплення</text>
  <text x="580" y="278" font-size="11" fill="#1a1a1a">• Динамічна жорсткість стрибкоподібно зростає в сотні разів</text>
  <text x="580" y="294" font-size="11" fill="#c0392b">• Відбувається зріз пайки BGA-чипів і розрив Pogo Pins</text>
  <text x="580" y="310" font-size="10" fill="#6b7280">• Ударний спектр (SRS) отримує високочастотний резонанс</text>

  <!-- Картка 3: Інженерний запас -->
  <rect x="565" y="335" width="350" height="115" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="580" y="357" font-size="12" font-weight="bold" fill="#27ae60">Правила безпечного проектування підвісу:</text>
  <text x="580" y="377" font-size="11" fill="#1a1a1a">• Запас ходу: x_stroke_allowable ≥ 1.5–2.0 × x_max</text>
  <text x="580" y="393" font-size="11" fill="#1a1a1a">• Використання нелінійно прогресивної жорсткості троса</text>
  <text x="580" y="409" font-size="11" fill="#1a1a1a">• Додатковий силіконовий бампер для м'якого обмеження</text>
  <text x="580" y="427" font-size="11" font-weight="bold" fill="#27ae60">Гарантує 100% збереження авіоніки та оптики підвісу</text>
</svg>
