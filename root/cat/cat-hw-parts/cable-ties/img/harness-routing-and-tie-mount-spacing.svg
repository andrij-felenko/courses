<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Правила розрахунку кроку та фіксації кабельного джгута</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Нормований крок фіксації та просторове розділення ліній запобігають перенапруженню ізоляції</text>

  <!-- Панель схеми -->
  <rect x="40" y="80" width="880" height="340" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Базова поверхня / кронштейн -->
  <rect x="70" y="320" width="820" height="16" fill="#d0d7de" rx="3"/>
  <text x="480" y="352" font-size="12" fill="#6b7280" text-anchor="middle">Монтажна поверхня / шасі</text>

  <!-- Кабельні майданчики (Cable Tie Mounts) -->
  <!-- Mount 1 -->
  <rect x="180" y="295" width="40" height="25" fill="#ffffff" stroke="#2457d6" stroke-width="2" rx="3"/>
  <path d="M190,295 C190,285 210,285 210,295" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Mount 2 -->
  <rect x="460" y="295" width="40" height="25" fill="#ffffff" stroke="#2457d6" stroke-width="2" rx="3"/>
  <path d="M470,295 C470,285 490,285 490,295" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Mount 3 -->
  <rect x="740" y="295" width="40" height="25" fill="#ffffff" stroke="#2457d6" stroke-width="2" rx="3"/>
  <path d="M750,295 C750,285 770,285 770,295" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Джгут дротів (Harness Bundle) -->
  <path d="M100,240 Q 320,200 480,240 Q 640,280 860,230" fill="none" stroke="#2457d6" stroke-width="28" stroke-linecap="round" opacity="0.15"/>
  <path d="M100,240 Q 320,200 480,240 Q 640,280 860,230" fill="none" stroke="#1a1a1a" stroke-width="4" stroke-linecap="round"/>

  <!-- Силові лінії та сигнальні виті пари -->
  <path d="M100,230 Q 320,190 480,230 Q 640,270 860,220" fill="none" stroke="#c0392b" stroke-width="3"/>
  <path d="M100,250 Q 320,210 480,250 Q 640,290 860,240" fill="none" stroke="#27ae60" stroke-width="3" stroke-dasharray="4,4"/>

  <!-- Хомути (Cable Ties) -->
  <rect x="193" y="222" width="14" height="76" fill="#2457d6" rx="2"/>
  <rect x="473" y="222" width="14" height="76" fill="#2457d6" rx="2"/>
  <rect x="753" y="215" width="14" height="83" fill="#2457d6" rx="2"/>

  <!-- Розмір кроку L (Pitch) -->
  <line x1="200" y1="160" x2="480" y2="160" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="340" y="150" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Крок фіксації (L)</text>

  <!-- Розмір кроку L між другим і третім -->
  <line x1="480" y1="160" x2="760" y2="160" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="620" y="150" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Крок фіксації (L)</text>

  <!-- Пояснювальні підписи -->
  <text x="200" y="115" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Кабельний майданчик</text>
  <text x="200" y="132" font-size="12" fill="#6b7280" text-anchor="middle">Cable tie mount</text>

  <text x="830" y="125" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Силові лінії</text>
  <text x="830" y="142" font-size="12" fill="#6b7280" text-anchor="middle">(електроживлення)</text>

  <text x="830" y="185" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Сигнальні виті пари</text>
  <text x="830" y="202" font-size="12" fill="#6b7280" text-anchor="middle">(захист від завад)</text>

  <!-- Підписи натягу та обрізки -->
  <rect x="360" y="380" width="240" height="30" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="480" y="400" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Нормований натяг і зріз заподлице</text>

</svg>
