<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Standard arrow -->
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <!-- Accent blue arrow -->
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <!-- Red arrow -->
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <!-- Green arrow -->
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>

  <!-- Header -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Порівняння методів обрізання та натягу нейлонових хомутів</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Використання натяжного пістолета або кусачок заподлице запобігає порізам та пошкодженню кабелів</text>

  <!-- ================= PANEL 1: Звичайні бокорізи ================= -->
  <rect x="24" y="80" width="288" height="440" rx="8" fill="#fdecea" stroke="#f5c6cb" stroke-width="1.5"/>

  <!-- Panel 1 Header Badge -->
  <rect x="36" y="94" width="264" height="34" rx="4" fill="#c0392b"/>
  <text x="168" y="116" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">1. Звичайні бокорізи</text>

  <!-- Panel 1 Graphic Box -->
  <rect x="36" y="138" width="264" height="70" rx="6" fill="#ffffff" stroke="#f5c6cb"/>
  <!-- Cable Bundle -->
  <circle cx="85" cy="173" r="24" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="78" cy="167" r="8" fill="#cbd5e1" stroke="#64748b"/>
  <circle cx="92" cy="167" r="8" fill="#cbd5e1" stroke="#64748b"/>
  <circle cx="85" cy="181" r="8" fill="#cbd5e1" stroke="#64748b"/>
  <!-- Cable Tie Strap & Lock Head -->
  <circle cx="85" cy="173" r="26" fill="none" stroke="#334155" stroke-width="4"/>
  <rect x="109" y="160" width="18" height="26" rx="2" fill="#334155"/>
  <!-- Protruding Tail -->
  <path d="M 127,173 L 165,173 L 175,165 L 168,181 Z" fill="#94a3b8" stroke="#c0392b" stroke-width="1.5"/>
  <path d="M 165,173 L 175,165 L 168,181 Z" fill="#c0392b"/>
  <!-- Cutter Jaws -->
  <path d="M 152,145 L 162,168 L 158,172 L 148,150 Z" fill="#64748b"/>
  <path d="M 172,145 L 162,168 L 166,172 L 176,150 Z" fill="#64748b"/>
  <!-- Callout line & text -->
  <path d="M 200,168 L 172,168" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="235" y="156" font-size="12" fill="#c0392b" text-anchor="middle">Зріз під кутом</text>
  <text x="235" y="190" font-size="12" fill="#6b7280" text-anchor="middle">від замка</text>

  <!-- Panel 1 Zoom Detail -->
  <rect x="36" y="216" width="264" height="70" rx="6" fill="#ffffff" stroke="#f5c6cb"/>
  <rect x="52" y="226" width="18" height="50" rx="2" fill="#334155"/>
  <path d="M 70,241 L 102,241 L 114,231 L 105,261 L 70,261 Z" fill="#cbd5e1" stroke="#334155" stroke-width="1.5"/>
  <path d="M 102,241 L 114,231 L 105,261 Z" fill="#c0392b"/>
  <line x1="140" y1="240" x2="116" y2="234" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="146" y="243" font-size="12" font-weight="bold" fill="#c0392b">Гострий задирок!</text>
  <text x="146" y="260" font-size="12" fill="#6b7280">Виступ: 1–3 мм</text>

  <!-- Panel 1 Bullets -->
  <rect x="36" y="294" width="264" height="212" rx="6" fill="#ffffff" stroke="#f5c6cb"/>
  <rect x="36" y="294" width="264" height="26" rx="4" fill="#fdecea"/>
  <text x="168" y="311" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">НАСЛІДКИ ТА ОСОБЛИВОСТІ</text>
  <text x="48" y="334" font-size="12" fill="#1a1a1a">• Натяг "на око" (некалібрований)</text>
  <text x="48" y="354" font-size="12" fill="#1a1a1a">• Ризик перетискання кабелю</text>
  <text x="48" y="374" font-size="12" fill="#1a1a1a">• Виступаючий задирок (1–3 мм)</text>
  <text x="48" y="394" font-size="12" fill="#1a1a1a">• Високий ризик травмування рук</text>
  <text x="48" y="414" font-size="12" fill="#1a1a1a">• Пошкодження ізоляції джгутів</text>
  <text x="48" y="434" font-size="12" fill="#1a1a1a">• Зачіпання при протягуванні</text>
  <text x="48" y="454" font-size="12" fill="#1a1a1a">• Нестабільне зусилля фіксації</text>
  <text x="48" y="474" font-size="12" fill="#c0392b" font-weight="bold">✗ Не рекомендовано для ВЧ/мереж</text>

  <!-- ================= PANEL 2: Кусачки заподлице ================= -->
  <rect x="336" y="80" width="288" height="440" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Panel 2 Header Badge -->
  <rect x="348" y="94" width="264" height="34" rx="4" fill="#475569"/>
  <text x="480" y="116" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">2. Кусачки заподлице</text>

  <!-- Panel 2 Graphic Box -->
  <rect x="348" y="138" width="264" height="70" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <!-- Cable Bundle -->
  <circle cx="397" cy="173" r="24" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="390" cy="167" r="8" fill="#cbd5e1" stroke="#64748b"/>
  <circle cx="404" cy="167" r="8" fill="#cbd5e1" stroke="#64748b"/>
  <circle cx="397" cy="181" r="8" fill="#cbd5e1" stroke="#64748b"/>
  <!-- Cable Tie Strap & Lock Head -->
  <circle cx="397" cy="173" r="26" fill="none" stroke="#334155" stroke-width="4"/>
  <rect x="421" y="160" width="18" height="26" rx="2" fill="#334155"/>
  <!-- Flush Cut Line -->
  <line x1="439" y1="158" x2="439" y2="188" stroke="#27ae60" stroke-width="2" stroke-dasharray="2,2"/>
  <!-- Flush Cutter Jaw -->
  <path d="M 440,145 L 440,188 L 448,188 L 452,145 Z" fill="#64748b"/>
  <path d="M 442,145 L 442,188" stroke="#27ae60" stroke-width="2"/>
  <!-- Callout line & text -->
  <path d="M 495,168 L 448,168" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <text x="547" y="156" font-size="12" fill="#27ae60" text-anchor="middle">Плоска сторона</text>
  <text x="547" y="190" font-size="12" fill="#6b7280" text-anchor="middle">упритул до замка</text>

  <!-- Panel 2 Zoom Detail -->
  <rect x="348" y="216" width="264" height="70" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="364" y="226" width="18" height="50" rx="2" fill="#334155"/>
  <rect x="382" y="241" width="12" height="20" fill="#cbd5e1" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="382" y1="222" x2="382" y2="280" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="410" y="243" font-size="12" font-weight="bold" fill="#27ae60">Гладкий зріз</text>
  <text x="410" y="260" font-size="12" fill="#6b7280">Виступ: 0 мм (врівень)</text>

  <!-- Panel 2 Bullets -->
  <rect x="348" y="294" width="264" height="212" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="348" y="294" width="264" height="26" rx="4" fill="#f4f6f8"/>
  <text x="480" y="311" font-size="12" font-weight="bold" fill="#475569" text-anchor="middle">ОСОБЛИВОСТІ ТА ВЛАСТИВОСТІ</text>
  <text x="360" y="334" font-size="12" fill="#1a1a1a">• Леза без зовнішньої фаски</text>
  <text x="360" y="354" font-size="12" fill="#1a1a1a">• Зріз прямо по грані замка</text>
  <text x="360" y="374" font-size="12" fill="#1a1a1a">• Повна відсутність гострого шипа</text>
  <text x="360" y="394" font-size="12" fill="#1a1a1a">• Безпечно для обслуговування</text>
  <text x="360" y="414" font-size="12" fill="#1a1a1a">• Ручний натяг перед зрізом</text>
  <text x="360" y="434" font-size="12" fill="#1a1a1a">• Дводійний процес (натяг + зріз)</text>
  <text x="360" y="454" font-size="12" fill="#1a1a1a">• Оптимально для невеликих робіт</text>
  <text x="360" y="474" font-size="12" fill="#27ae60" font-weight="bold">✓ Дозволено за стандартами</text>

  <!-- ================= PANEL 3: Натяжний пістолет ================= -->
  <rect x="648" y="80" width="288" height="440" rx="8" fill="#eaf0fd" stroke="#b4c6fc" stroke-width="1.5"/>

  <!-- Panel 3 Header Badge -->
  <rect x="660" y="94" width="264" height="34" rx="4" fill="#2457d6"/>
  <text x="792" y="116" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">3. Натяжний пістолет</text>

  <!-- Panel 3 Graphic Box -->
  <rect x="660" y="138" width="264" height="70" rx="6" fill="#ffffff" stroke="#b4c6fc"/>
  <!-- Cable Bundle -->
  <circle cx="705" cy="173" r="24" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="698" cy="167" r="8" fill="#cbd5e1" stroke="#64748b"/>
  <circle cx="712" cy="167" r="8" fill="#cbd5e1" stroke="#64748b"/>
  <circle cx="705" cy="181" r="8" fill="#cbd5e1" stroke="#64748b"/>
  <!-- Cable Tie Strap & Lock Head -->
  <circle cx="705" cy="173" r="26" fill="none" stroke="#334155" stroke-width="4"/>
  <rect x="729" y="160" width="18" height="26" rx="2" fill="#334155"/>
  <!-- Tensioning Tool Body -->
  <rect x="747" y="152" width="60" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <!-- Pulling Arrow Fn -->
  <line x1="755" y1="172" x2="792" y2="172" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-accent)"/>
  <text x="774" y="160" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Натяг Fn</text>
  <!-- Dial icon -->
  <circle cx="795" cy="182" r="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="795" y1="182" x2="798" y2="178" stroke="#2457d6" stroke-width="1.5"/>
  <!-- Callout line & text -->
  <path d="M 825,168 L 808,168" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>
  <text x="865" y="156" font-size="12" fill="#2457d6" text-anchor="middle">Авто-зріз</text>
  <text x="865" y="190" font-size="12" fill="#6b7280" text-anchor="middle">при досягненні Fn</text>

  <!-- Panel 3 Zoom Detail -->
  <rect x="660" y="216" width="264" height="70" rx="6" fill="#ffffff" stroke="#b4c6fc"/>
  <rect x="676" y="226" width="18" height="50" rx="2" fill="#334155"/>
  <rect x="694" y="241" width="12" height="20" fill="#cbd5e1" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="694" y1="222" x2="694" y2="280" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="722" y="243" font-size="12" font-weight="bold" fill="#2457d6">Ідеальний зріз + Fn</text>
  <text x="722" y="260" font-size="12" fill="#6b7280">Авто-обрізання заподлице</text>

  <!-- Panel 3 Bullets -->
  <rect x="660" y="294" width="264" height="212" rx="6" fill="#ffffff" stroke="#b4c6fc"/>
  <rect x="660" y="294" width="264" height="26" rx="4" fill="#eaf0fd"/>
  <text x="792" y="311" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ПЕРЕВАГИ ПРОФЕСІЙНОГО МЕТОДУ</text>
  <text x="672" y="334" font-size="12" fill="#1a1a1a">• Точне регулювання зусилля (Fn)</text>
  <text x="672" y="354" font-size="12" fill="#1a1a1a">• Запобігання роздавлюванню кабелів</text>
  <text x="672" y="374" font-size="12" fill="#1a1a1a">• Автоматичне спрацьовування леза</text>
  <text x="672" y="434" font-size="12" fill="#1a1a1a">• 100% повторюваність результату</text>
  <text x="672" y="414" font-size="12" fill="#1a1a1a">• Автоматичний зріз заподлице</text>
  <text x="672" y="394" font-size="12" fill="#1a1a1a">• Однодійний швидкий монтаж</text>
  <text x="672" y="454" font-size="12" fill="#1a1a1a">• Захист від імпедансних деформацій</text>
  <text x="672" y="474" font-size="12" fill="#2457d6" font-weight="bold">★ Професійний стандарт</text>
</svg>
