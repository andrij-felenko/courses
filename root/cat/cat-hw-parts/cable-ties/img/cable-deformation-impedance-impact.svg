<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Деформація кабелю стяжкою та її вплив на хвильовий імпеданс</text>
  <text x="480" y="62" text-anchor="middle" font-size="13" fill="#6b7280">Перетискання змінює геометрію діелектрика, викликаючи провал імпедансу Z та відбиття сигналу</text>

  <!-- Panel 1 (Left): Impedance Profile & Geometry -->
  <rect x="30" y="80" width="435" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="45" y="105" font-size="14" font-weight="bold" fill="#1a1a1a">1. Механічна деформація та профіль імпедансу</text>

  <!-- Cable Longitudinal Profile -->
  <path d="M 55 145 L 170 145 C 190 145 198 156 215 156 C 232 156 240 145 260 145 L 430 145 L 430 185 L 260 185 C 240 185 232 174 215 174 C 198 174 190 185 170 185 L 55 185 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M 55 155 L 170 155 C 190 155 198 162 215 162 C 232 162 240 155 260 155 L 430 155" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <path d="M 55 175 L 170 175 C 190 175 198 168 215 168 C 232 168 240 175 260 175 L 430 175" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Cable Tie Pinch Clamp -->
  <rect x="206" y="148" width="18" height="34" rx="2" fill="#4b5563" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="209" y="144" width="12" height="6" rx="1" fill="#1a1a1a"/>

  <!-- Inward Force Arrows -->
  <line x1="215" y1="126" x2="215" y2="142" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="215" y1="204" x2="215" y2="188" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="215" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Зусилля F</text>

  <!-- Cable Section Labels -->
  <text x="112" y="133" text-anchor="middle" font-size="12" fill="#1a1a1a">Нормальний стан (S₀)</text>
  <text x="345" y="133" text-anchor="middle" font-size="12" fill="#1a1a1a">Оболонка кабелю</text>
  <text x="215" y="222" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Перетискання (S' &lt; S₀)</text>

  <!-- Impedance Graph Z(x) -->
  <line x1="75" y1="330" x2="425" y2="330" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <line x1="75" y1="330" x2="75" y2="242" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="60" y="242" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Z, Ом</text>
  <text x="410" y="348" text-anchor="end" font-size="12" fill="#6b7280">Довжина кабелю x</text>

  <!-- Nominal Z0 Line -->
  <line x1="75" y1="270" x2="420" y2="270" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4 4"/>
  <text x="330" y="264" font-size="12" fill="#6b7280">Z₀ = 100 Ом (норма)</text>

  <!-- Impedance Curve Z(x) -->
  <path d="M 75 270 L 170 270 C 190 270 200 310 215 310 C 230 310 240 270 260 270 L 420 270" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="215" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">Провал Z &lt; Z₀ (неузгодження)</text>

  <!-- Signal Waves -->
  <line x1="90" y1="285" x2="165" y2="285" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="127" y="298" text-anchor="middle" font-size="12" fill="#2457d6">Прямий сигнал</text>

  <line x1="165" y1="255" x2="90" y2="255" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3 3" marker-end="url(#arr-red)"/>
  <text x="127" y="248" text-anchor="middle" font-size="12" fill="#c0392b">Відбита хвиля</text>

  <!-- Summary Box Panel 1 -->
  <rect x="45" y="365" width="405" height="95" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="383" font-size="12" font-weight="bold" fill="#1a1a1a">Формула хвильового імпедансу крученої пари:</text>
  <text x="55" y="405" font-size="13" font-weight="bold" fill="#2457d6">Z = (120 / √εᵣ) · ln(2S / d)</text>
  <text x="55" y="427" font-size="12" fill="#6b7280">Зменшення S при стисканні ⇒ локальне падіння Z</text>
  <text x="55" y="447" font-size="12" fill="#c0392b">Наслідок: зростання Return Loss та зсуву фаз</text>

  <!-- Panel 2 (Right): Standards and Installation Rules -->
  <rect x="495" y="80" width="435" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="510" y="105" font-size="14" font-weight="bold" fill="#1a1a1a">2. Допустима деформація та норми монтажу</text>

  <!-- OK Mounting Box -->
  <rect x="510" y="120" width="405" height="165" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="525" y="142" font-size="13" font-weight="bold" fill="#27ae60">✔ Правильна фіксація (деформація ≤ 5%)</text>

  <!-- OK Cross section diagram -->
  <circle cx="575" cy="210" r="30" fill="#ffffff" stroke="#27ae60" stroke-width="2"/>
  <circle cx="575" cy="210" r="34" fill="none" stroke="#1a1a1a" stroke-width="2.5"/>
  <rect x="568" y="172" width="14" height="10" rx="2" fill="#1a1a1a"/>
  <!-- 4 Pairs inside -->
  <circle cx="563" cy="198" r="7" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="587" cy="198" r="7" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="563" cy="222" r="7" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="587" cy="222" r="7" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

  <!-- OK Text list -->
  <text x="630" y="172" font-size="12" font-weight="bold" fill="#1a1a1a">Геометрія перерізу збережена</text>
  <text x="630" y="194" font-size="12" fill="#1a1a1a">• Зміна діаметра ΔD / D₀ ≤ 5%</text>
  <text x="630" y="216" font-size="12" fill="#1a1a1a">• Хвильовий імпеданс Z ≈ Z₀</text>
  <text x="630" y="238" font-size="12" fill="#1a1a1a">• Відсутність зсуву провідників</text>
  <text x="630" y="260" font-size="12" font-weight="bold" fill="#27ae60">Критерій: хомут прокручується від руки</text>

  <!-- NOT OK Mounting Box -->
  <rect x="510" y="295" width="405" height="170" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="525" y="317" font-size="13" font-weight="bold" fill="#c0392b">✖ Неприпустиме перетискання (деформація &gt; 10%)</text>

  <!-- NOT OK Cross section diagram -->
  <ellipse cx="575" cy="385" rx="35" ry="18" fill="#ffffff" stroke="#c0392b" stroke-width="2"/>
  <ellipse cx="575" cy="385" rx="38" ry="21" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <rect x="568" y="360" width="14" height="8" rx="2" fill="#c0392b"/>
  <!-- Force arrows -->
  <line x1="575" y1="348" x2="575" y2="360" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <line x1="575" y1="422" x2="575" y2="410" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <!-- 4 Squished Pairs inside -->
  <ellipse cx="558" cy="380" rx="7" ry="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <ellipse cx="592" cy="380" rx="7" ry="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <ellipse cx="558" cy="390" rx="7" ry="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <ellipse cx="592" cy="390" rx="7" ry="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>

  <!-- NOT OK Text list -->
  <text x="630" y="347" font-size="12" font-weight="bold" fill="#1a1a1a">Локальна сплющеність оболонки</text>
  <text x="630" y="369" font-size="12" fill="#1a1a1a">• Деформація ΔD / D₀ &gt; 10–15%</text>
  <text x="630" y="391" font-size="12" fill="#1a1a1a">• Локальне Z &lt; Z₀ (відбиття імпульсів)</text>
  <text x="630" y="413" font-size="12" fill="#1a1a1a">• Помилки CRC, деградація Cat5e/6/6A</text>
  <text x="630" y="435" font-size="12" font-weight="bold" fill="#c0392b">Використовувати пістолет з відсіканням</text>
</svg>
