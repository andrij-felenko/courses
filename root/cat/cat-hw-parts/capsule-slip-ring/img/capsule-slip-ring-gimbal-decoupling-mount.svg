<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Механічна розв'язка капсульного ковзного кільця в підвісі</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Плаваюче кріплення ротора й еластомірний фіксатор статора компенсують радіальне биття та знімають аксіальні напруження</text>

  <!-- Left Panel: Rigid Mount (Problem) -->
  <rect x="40" y="85" width="425" height="345" fill="#fdecea" stroke="#d0d7de" rx="8"/>
  <text x="252" y="115" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">Жорсткий монтаж (Неправильно)</text>
  
  <!-- Graphics for Left Panel -->
  <g transform="translate(60, 135)">
    <!-- Axis / Gimbal Frame -->
    <rect x="25" y="20" width="340" height="35" fill="#d0d7de" rx="4"/>
    <text x="195" y="43" font-size="13" fill="#1a1a1a" text-anchor="middle">Вісь підвісу (гнучка / з биттям)</text>

    <!-- Rigid housing -->
    <rect x="145" y="55" width="100" height="150" fill="#f4f6f8" stroke="#c0392b" stroke-width="2" rx="4"/>
    <text x="195" y="135" font-size="13" fill="#1a1a1a" text-anchor="middle">Корпус</text>
    <text x="195" y="152" font-size="12" fill="#6b7280" text-anchor="middle">ковзного кільця</text>

    <!-- Misalignment / Radial runout forces -->
    <path d="M130,90 L145,95" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-red)"/>
    <path d="M260,165 L245,160" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-red)"/>
    
    <text x="195" y="235" font-size="12" fill="#c0392b" text-anchor="middle">⚠ Радіальне биття та перекіс</text>
    <text x="195" y="253" font-size="12" fill="#c0392b" text-anchor="middle">→ Знос щіток і зрив сигналу</text>
  </g>

  <!-- Right Panel: Floating Decoupling Mount (Solution) -->
  <rect x="495" y="85" width="425" height="345" fill="#e9f7ef" stroke="#d0d7de" rx="8"/>
  <text x="707" y="115" font-size="16" font-weight="bold" fill="#27ae60" text-anchor="middle">Плаваюча розв'язка (Правильно)</text>

  <!-- Graphics for Right Panel -->
  <g transform="translate(515, 135)">
    <!-- Axis / Gimbal Frame -->
    <rect x="25" y="20" width="340" height="35" fill="#d0d7de" rx="4"/>
    <text x="195" y="43" font-size="13" fill="#1a1a1a" text-anchor="middle">Вісь підвісу</text>

    <!-- Elastomer damper / floating mount -->
    <rect x="125" y="55" width="140" height="150" fill="#f4f6f8" stroke="#27ae60" stroke-width="2" rx="6"/>
    
    <!-- Elastomer rings top & bottom -->
    <rect x="135" y="60" width="120" height="14" fill="#27ae60" opacity="0.3" rx="3"/>
    <rect x="135" y="186" width="120" height="14" fill="#27ae60" opacity="0.3" rx="3"/>
    <text x="195" y="71" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="bold">Еластомірний демпфер</text>
    <text x="195" y="197" font-size="11" fill="#27ae60" text-anchor="middle" font-weight="bold">Еластомірний демпфер</text>

    <!-- Slip ring capsule -->
    <rect x="145" y="85" width="100" height="90" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="4"/>
    <text x="195" y="125" font-size="13" fill="#1a1a1a" text-anchor="middle">Капсульне</text>
    <text x="195" y="142" font-size="12" fill="#6b7280" text-anchor="middle">ковзне кільце</text>

    <!-- Floating / decoupling arrows -->
    <path d="M130,125 L145,125" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
    <path d="M260,125 L245,125" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

    <text x="195" y="235" font-size="12" fill="#27ae60" text-anchor="middle">✓ Компенсація биття і напружень</text>
    <text x="195" y="253" font-size="12" fill="#27ae60" text-anchor="middle">→ Стабільний контакт і зв'язок</text>
  </g>

</svg>
