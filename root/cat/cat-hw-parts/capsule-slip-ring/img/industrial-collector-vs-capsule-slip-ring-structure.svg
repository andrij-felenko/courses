<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Промисловий струмознімач проти капсульного ковзного кільця</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Порівняння конструктивної геометрії, площі контакту та технології знімання сигналу</text>

  <!-- Ліва панель: Промисловий струмознімач -->
  <rect x="40" y="80" width="420" height="340" rx="8" fill="#fdecea" stroke="#d0d7de" stroke-width="1"/>
  <text x="250" y="110" font-size="16" font-weight="bold" fill="#c0392b" text-anchor="middle">Промисловий струмознімач (Collector)</text>
  
  <!-- Схема ліворуч: масивне кільце і щітка -->
  <!-- Барабан / кільце -->
  <rect x="180" y="180" width="140" height="120" rx="10" fill="#d0d7de" stroke="#1a1a1a" stroke-width="2"/>
  <text x="250" y="245" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мідне кільце</text>

  <!-- Вугільна щітка -->
  <rect x="210" y="130" width="80" height="50" rx="4" fill="#4a5568" stroke="#1a1a1a" stroke-width="2"/>
  <text x="250" y="160" font-size="12" fill="white" text-anchor="middle">Вугільна щітка</text>

  <!-- Позначки проблем -->
  <text x="250" y="335" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Великий знос та іскріння</text>
  <text x="250" y="355" font-size="12" fill="#6b7280" text-anchor="middle">Велика площа контакту, високий тертя</text>
  <text x="250" y="375" font-size="12" fill="#6b7280" text-anchor="middle">Низька частота сигналів (силове живлення)</text>
  <text x="250" y="395" font-size="12" fill="#c0392b" text-anchor="middle">Динамічний шум та окиснення</text>

  <!-- Права панель: Капсульне ковзне кільце -->
  <rect x="500" y="80" width="420" height="340" rx="8" fill="#e9f7ef" stroke="#d0d7de" stroke-width="1"/>
  <text x="710" y="110" font-size="16" font-weight="bold" fill="#27ae60" text-anchor="middle">Капсульне ковзне кільце (Capsule Slip Ring)</text>

  <!-- Схема праворуч: капсула і багатониткові золоті щітки -->
  <!-- Корпус капсули -->
  <rect x="620" y="150" width="180" height="140" rx="12" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="710" y="170" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Захисний корпус</text>

  <!-- Золоті кільця всередині -->
  <rect x="660" y="185" width="100" height="20" rx="4" fill="#f1c40f" stroke="#b7950b" stroke-width="1"/>
  <rect x="660" y="225" width="100" height="20" rx="4" fill="#f1c40f" stroke="#b7950b" stroke-width="1"/>
  <text x="710" y="297" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Золоті доріжки й волокна</text>

  <!-- Позначки рішень -->
  <text x="710" y="335" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Мінімальний знос та ресурс</text>
  <text x="710" y="355" font-size="12" fill="#6b7280" text-anchor="middle">Золоті контакти та волоконні щітки</text>
  <text x="710" y="375" font-size="12" fill="#6b7280" text-anchor="middle">Передача швидкісних даних (Ethernet, USB)</text>
  <text x="710" y="395" font-size="12" fill="#27ae60" text-anchor="middle">Низький контактний опір і безшумність</text>

</svg>
