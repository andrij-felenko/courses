<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Насосний ефект (Pump Effect) у герметичному корпусі без вентиляції</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Зміна температури створює перепад тиску, що змушує корпус «вдихати» вологу через мікрощілини</text>

  <!-- LEFT PANEL: Phase 1 (Heating) -->
  <rect x="50" y="85" width="410" height="335" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="70" y="105" width="370" height="40" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="255" y="130" font-size="15" font-weight="bold" fill="#2457d6" text-anchor="middle">Фаза 1: Нагрівання приладу (День / Робота)</text>

  <!-- Device Box Left -->
  <rect x="110" y="170" width="290" height="210" rx="6" fill="white" stroke="#d0d7de" stroke-width="2"/>
  <text x="255" y="195" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Герметичний корпус</text>

  <!-- Internal Air & Heat -->
  <text x="255" y="235" font-size="13" fill="#2457d6" text-anchor="middle">Повітря всередині розширюється</text>
  <text x="255" y="255" font-size="12" fill="#6b7280" text-anchor="middle">Надлишковий тиск (P > P₀)</text>

  <!-- Heat waves icon / text -->
  <text x="255" y="295" font-size="22" fill="#c0392b" text-anchor="middle">🔥</text>
  <text x="255" y="325" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Внутрішнє нагрівання</text>

  <!-- Leakage / escaping air arrow -->
  <path d="M 400 240 Q 430 240 455 240" fill="none" stroke="#2457d6" stroke-width="3" marker-end="url(#arr-blue)"/>
  <text x="428" y="225" font-size="12" fill="#2457d6" text-anchor="middle">Витік повітря</text>
  <text x="428" y="265" font-size="11" fill="#6b7280" text-anchor="middle">через мікрощілини</text>


  <!-- RIGHT PANEL: Phase 2 (Cooling) -->
  <rect x="500" y="85" width="410" height="335" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="520" y="105" width="370" height="40" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="705" y="130" font-size="15" font-weight="bold" fill="#c0392b" text-anchor="middle">Фаза 2: Охолодження (Ніч / Дощ)</text>

  <!-- Device Box Right -->
  <rect x="560" y="170" width="290" height="210" rx="6" fill="white" stroke="#d0d7de" stroke-width="2"/>
  <text x="705" y="195" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Герметичний корпус</text>

  <!-- Internal Air & Vacuum -->
  <text x="705" y="235" font-size="13" fill="#c0392b" text-anchor="middle">Повітря стискається</text>
  <text x="705" y="255" font-size="12" fill="#6b7280" text-anchor="middle">Розрідження / Вакуум (P &lt; P₀)</text>

  <!-- Cold / drops icon / text -->
  <text x="705" y="295" font-size="22" fill="#2457d6" text-anchor="middle">💧</text>
  <text x="705" y="325" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Всмоктування вологи</text>

  <!-- Suction arrow entering -->
  <path d="M 505 240 Q 532 240 555 240" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#arr-red)"/>
  <text x="530" y="225" font-size="12" fill="#c0392b" text-anchor="middle">Засмоктування</text>
  <text x="530" y="265" font-size="11" fill="#6b7280" text-anchor="middle">вологи та крапель</text>

</svg>
