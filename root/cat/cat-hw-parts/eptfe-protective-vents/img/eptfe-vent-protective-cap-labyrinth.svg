<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-water" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-air" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Захисний клапан з лабіринтними каналами (розріз)</text>
  <text x="480" y="60" font-size="13" font-weight="400" text-anchor="middle" fill="#6b7280">Лабіринт відхиляє високонапірний струмінь води (IP69K), а ePTFE-мембрана забезпечує дихання</text>

  <!-- Background panels / Legend boxes -->
  <!-- Water jet description box -->
  <rect x="30" y="85" width="280" height="90" rx="6" fill="#fdecea" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="110" font-size="14" font-weight="700" fill="#c0392b">Високонапірний струмінь (IP69K)</text>
  <text x="45" y="132" font-size="12" fill="#1a1a1a">Ударяє в ковпачок та відхиляється</text>
  <text x="45" y="150" font-size="12" fill="#1a1a1a">лабіринтом назовні (без прямого тиску)</text>

  <!-- Air flow description box -->
  <rect x="650" y="85" width="280" height="90" rx="6" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1"/>
  <text x="665" y="110" font-size="14" font-weight="700" fill="#2457d6">Вільний шлях повітря</text>
  <text x="665" y="132" font-size="12" fill="#1a1a1a">Вирівнювання тиску (дихання)</text>
  <text x="665" y="150" font-size="12" fill="#1a1a1a">через пористу ePTFE-мембрану</text>

  <!-- Valve housing structure (cross section center around x=480, y=260) -->
  <!-- Outer housing body -->
  <path d="M380,200 L580,200 L580,380 L540,380 L540,410 L420,410 L420,380 L380,380 Z" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  
  <!-- Metallic / Solid body walls (left and right cross-section) -->
  <rect x="380" y="200" width="50" height="180" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="530" y="200" width="50" height="180" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Threaded base at bottom -->
  <path d="M420,380 L420,410 L395,410 L395,395 L420,380 Z" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <path d="M540,380 L540,410 L565,410 L565,395 L540,380 Z" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="420" y="385" width="120" height="25" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Inner cavity / air chamber -->
  <rect x="430" y="260" width="100" height="115" fill="white" stroke="#1a1a1a" stroke-width="1"/>

  <!-- ePTFE Membrane at top of inner chamber -->
  <rect x="430" y="245" width="100" height="15" fill="#27ae60" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="480" y="256" font-size="11" font-weight="700" text-anchor="middle" fill="white">ePTFE-мембрана</text>

  <!-- Protective Cap with Labyrinth channels -->
  <path d="M360,200 L360,165 C360,150 375,140 400,140 L560,140 C585,140 600,150 600,165 L600,200 Z" fill="#d0d7de" stroke="#1a1a1a" stroke-width="2"/>
  
  <!-- Labyrinth baffles / grooves inside cap -->
  <rect x="445" y="170" width="70" height="15" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="415" y="190" width="130" height="10" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Water Jet (Red) hitting the cap and deflecting -->
  <path d="M160,230 L330,170" stroke="#c0392b" stroke-width="4" fill="none" marker-end="url(#arr-water)"/>
  <path d="M330,170 L350,140" stroke="#c0392b" stroke-width="3" fill="none" marker-end="url(#arr-water)"/>
  <path d="M330,170 L340,220" stroke="#c0392b" stroke-width="3" fill="none" marker-end="url(#arr-water)"/>
  <text x="160" y="250" font-size="13" font-weight="700" fill="#c0392b">Струмінь води (IP69K)</text>

  <!-- Air Flow (Blue) entering from sides/bottom and passing through labyrinth and membrane -->
  <path d="M320,320 L425,320" stroke="#2457d6" stroke-width="3" fill="none" marker-end="url(#arr-air)"/>
  <path d="M480,310 L480,265" stroke="#2457d6" stroke-width="3" fill="none" marker-end="url(#arr-air)"/>
  <path d="M480,240 L480,215" stroke="#2457d6" stroke-width="3" fill="none" marker-end="url(#arr-air)"/>
  <text x="210" y="275" font-size="13" font-weight="700" fill="#2457d6">Повітря (дихання)</text>

  <!-- Labels pointing to components (adjusted pointer lines to avoid crossing text boxes) -->
  <text x="635" y="165" font-size="12" font-weight="700" fill="#1a1a1a">Захисний ковпачок</text>
  <path d="M605,160 L630,160" stroke="#1a1a1a" stroke-width="1"/>

  <text x="635" y="195" font-size="12" font-weight="700" fill="#1a1a1a">Лабіринтний канал</text>
  <path d="M545,195 L630,195" stroke="#1a1a1a" stroke-width="1"/>

  <text x="635" y="325" font-size="12" font-weight="700" fill="#1a1a1a">Корпус клапана</text>
  <path d="M535,325 L630,325" stroke="#1a1a1a" stroke-width="1"/>

  <text x="330" y="435" font-size="12" font-weight="700" text-anchor="end" fill="#1a1a1a">Різьбове з'єднання</text>
  <path d="M395,400 L335,425" stroke="#1a1a1a" stroke-width="1"/>

</svg>
