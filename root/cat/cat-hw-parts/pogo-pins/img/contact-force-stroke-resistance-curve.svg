<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Marker definitions for arrows -->
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-red-down" markerWidth="9" markerHeight="9" refX="4" refY="7.5" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L4,8 L8,0 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Canvas background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Title and Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Характеристики Pogo Pin: сила притиску та перехідний опір</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Стабільний опір R_c досягається в робочому діапазоні (Working Stroke) до перетискання</text>

  <!-- Legend Box -->
  <rect x="310" y="74" width="320" height="34" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <line x1="325" y1="91" x2="350" y2="91" stroke="#2457d6" stroke-width="3"/>
  <text x="356" y="95" font-size="12" fill="#1a1a1a">Сила притиску F (Н)</text>
  <line x1="495" y1="91" x2="520" y2="91" stroke="#c0392b" stroke-width="3"/>
  <text x="526" y="95" font-size="12" fill="#1a1a1a">Опір R_c (мОм)</text>

  <!-- Plot Background & Zones -->
  <!-- Zone 1: Pre-travel -->
  <rect x="120" y="140" width="190" height="290" fill="#f4f6f8" opacity="0.6"/>
  <!-- Zone 2: Working Stroke -->
  <rect x="310" y="140" width="360" height="290" fill="#e9f7ef" opacity="0.8"/>
  <rect x="310" y="140" width="360" height="290" fill="none" stroke="#27ae60" stroke-dasharray="4 4" stroke-width="1.5"/>
  <!-- Zone 3: Over-stroke -->
  <rect x="670" y="140" width="170" height="290" fill="#fdecea" opacity="0.8"/>
  <rect x="670" y="140" width="170" height="290" fill="none" stroke="#c0392b" stroke-dasharray="4 4" stroke-width="1.5"/>

  <!-- Zone Headers / Banners -->
  <rect x="130" y="148" width="170" height="26" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="215" y="165" font-size="12" fill="#6b7280" text-anchor="middle">Первинний хід (Pre-travel)</text>

  <rect x="325" y="148" width="330" height="26" fill="#27ae60" rx="4"/>
  <text x="490" y="165" font-size="12" font-weight="bold" fill="white" text-anchor="middle">РОБОЧИЙ ДІАПАЗОН ХОДУ (Working Stroke)</text>

  <rect x="680" y="148" width="150" height="26" fill="#c0392b" rx="4"/>
  <text x="755" y="165" font-size="12" font-weight="bold" fill="white" text-anchor="middle">ПЕРЕТИСКАННЯ</text>

  <!-- Horizontal Grid Lines -->
  <line x1="120" y1="360" x2="840" y2="360" stroke="#d0d7de" stroke-dasharray="3 3"/>
  <line x1="120" y1="290" x2="680" y2="290" stroke="#d0d7de" stroke-dasharray="3 3"/>
  <line x1="835" y1="290" x2="840" y2="290" stroke="#d0d7de" stroke-dasharray="3 3"/>
  <line x1="120" y1="180" x2="840" y2="180" stroke="#d0d7de" stroke-dasharray="3 3"/>

  <!-- Vertical Guide Lines at Key Points -->
  <line x1="310" y1="174" x2="310" y2="430" stroke="#6b7280" stroke-dasharray="3 3" stroke-width="1"/>
  <line x1="490" y1="174" x2="490" y2="375" stroke="#6b7280" stroke-dasharray="3 3" stroke-width="1"/>
  <line x1="490" y1="419" x2="490" y2="430" stroke="#6b7280" stroke-dasharray="3 3" stroke-width="1"/>
  <line x1="670" y1="174" x2="670" y2="430" stroke="#6b7280" stroke-dasharray="3 3" stroke-width="1"/>
  <line x1="840" y1="174" x2="840" y2="430" stroke="#c0392b" stroke-dasharray="2 2" stroke-width="1.5"/>

  <!-- Curves -->
  <!-- Resistance Curve R_c (Red #c0392b) -->
  <path d="M 120,180 C 160,270 220,355 310,360 L 490,362 L 670,365 Q 760,370 840,385" fill="none" stroke="#c0392b" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Force Curve F (Blue #2457d6) -->
  <path d="M 120,430 L 310,370 L 490,300 L 670,230 Q 750,200 840,160" fill="none" stroke="#2457d6" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Curve Data Points / Highlights -->
  <!-- Nominal point -->
  <circle cx="490" cy="300" r="5" fill="#2457d6"/>
  <circle cx="490" cy="362" r="5" fill="#c0392b"/>

  <!-- Axes -->
  <!-- Left Y-Axis (Force) -->
  <line x1="120" y1="430" x2="120" y2="130" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="120" y="118" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Сила F (Н)</text>
  <text x="108" y="434" font-size="12" fill="#6b7280" text-anchor="end">0</text>
  <text x="108" y="294" font-size="12" fill="#2457d6" text-anchor="end">1.0 Н</text>
  <text x="108" y="184" font-size="12" fill="#2457d6" text-anchor="end">2.0 Н</text>

  <!-- Right Y-Axis (Resistance) -->
  <line x1="840" y1="430" x2="840" y2="130" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="840" y="118" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Опір R_c (мОм)</text>
  <text x="852" y="434" font-size="12" fill="#6b7280" text-anchor="start">0</text>
  <text x="852" y="364" font-size="12" fill="#c0392b" text-anchor="start">20 мОм</text>
  <text x="852" y="184" font-size="12" fill="#c0392b" text-anchor="start">200 мОм</text>

  <!-- X-Axis -->
  <line x1="120" y1="430" x2="855" y2="430" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>
  <text x="480" y="486" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Величина ходу плунжера s (Stroke, мм)</text>

  <!-- X Ticks and Labels -->
  <line x1="120" y1="430" x2="120" y2="436" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="120" y="448" font-size="12" fill="#1a1a1a" text-anchor="middle">0</text>
  <text x="120" y="462" font-size="11" fill="#6b7280" text-anchor="middle">(Вільний стан)</text>

  <line x1="310" y1="430" x2="310" y2="436" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="310" y="448" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">s_min (0.5 мм)</text>

  <line x1="490" y1="430" x2="490" y2="436" stroke="#27ae60" stroke-width="2"/>
  <text x="490" y="448" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">s_nom (1.2 мм)</text>

  <line x1="670" y1="430" x2="670" y2="436" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="670" y="448" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">s_max (1.8 мм)</text>

  <line x1="840" y1="430" x2="840" y2="436" stroke="#c0392b" stroke-width="2"/>
  <text x="840" y="448" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">s_solid (2.2 мм)</text>
  <text x="840" y="462" font-size="11" fill="#c0392b" text-anchor="middle">(Упор)</text>

  <!-- Annotations / Callout Cards -->
  <!-- Callout 1: Oxide breakdown -->
  <rect x="135" y="215" width="155" height="46" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <line x1="212" y1="261" x2="212" y2="305" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="2 2" marker-end="url(#arr-red-down)"/>
  <text x="212" y="233" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Руйнування оксидів</text>
  <text x="212" y="249" font-size="11" fill="#6b7280" text-anchor="middle">Різке падіння R_c</text>

  <!-- Callout 2: Stable zone box -->
  <rect x="350" y="375" width="280" height="44" fill="#ffffff" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="490" y="393" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Мінімальний стабільний опір R_c</text>
  <text x="490" y="409" font-size="11" fill="#1a1a1a" text-anchor="middle">Оптимальна площа мікроконтактів та тиск</text>

  <!-- Callout 3: Mechanical limit -->
  <rect x="685" y="245" width="145" height="62" fill="#ffffff" stroke="#c0392b" stroke-width="1.5" rx="4"/>
  <text x="757" y="263" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Механічний упор</text>
  <text x="757" y="279" font-size="11" fill="#c0392b" text-anchor="middle">Різке зростання F</text>
  <text x="757" y="295" font-size="11" fill="#6b7280" text-anchor="middle">Фретинг-знос покриття</text>

  <!-- Bottom Summary Card -->
  <rect x="40" y="504" width="880" height="30" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="4"/>
  <text x="55" y="523" font-size="12" font-weight="bold" fill="#27ae60">✓ Робоча зона:</text>
  <text x="152" y="523" font-size="12" fill="#1a1a1a">Забезпечує стабільний опір R_c і компенсацію допусків висоти</text>
  <text x="580" y="523" font-size="12" font-weight="bold" fill="#c0392b">⚠ Перетискання:</text>
  <text x="678" y="523" font-size="12" fill="#1a1a1a">Ризик зносу та мікророзривів</text>
</svg>
