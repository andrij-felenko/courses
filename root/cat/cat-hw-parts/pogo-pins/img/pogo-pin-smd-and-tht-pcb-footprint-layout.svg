<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Посадкові місця PCB для монтажу Pogo Pins: SMD проти THT</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Геометрія паяльних площадок, термобар'єри та механічна стійкість до зсувних навантажень</text>

  <!-- ЛІВА ПАНЕЛЬ: SMD МОНТАЖ -->
  <rect x="40" y="85" width="420" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="40" y="85" width="420" height="34" rx="8" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="250" y="107" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">ПОВЕРХНЕВИЙ МОНТАЖ (SMD FOOTPRINT)</text>

  <!-- Вигляд зверху: Footprint з термобар'єром -->
  <rect x="60" y="135" width="160" height="150" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <!-- Мідний полігон (зовнішній квадрат) -->
  <rect x="75" y="150" width="130" height="120" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <!-- Зазор термобар'єру -->
  <circle cx="140" cy="210" r="45" fill="#ffffff"/>
  <!-- 4 спиці термобар'єру -->
  <rect x="135" y="165" width="10" height="90" fill="#fdecea"/>
  <rect x="95" y="205" width="90" height="10" fill="#fdecea"/>
  <!-- Центральний круглий паяльний майданчик (мідь) -->
  <circle cx="140" cy="210" r="32" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <!-- Контур гільзи штифта (пунктир) -->
  <circle cx="140" cy="210" r="22" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="3,3"/>
  
  <!-- Розмірні лінії для SMD площадки -->
  <line x1="235" y1="178" x2="235" y2="242" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="172" y1="178" x2="240" y2="178" stroke="#2457d6" stroke-width="1"/>
  <line x1="172" y1="242" x2="240" y2="242" stroke="#2457d6" stroke-width="1"/>
  <text x="246" y="214" font-size="12" font-weight="bold" fill="#2457d6">D_pad = D_b + 0.4 мм</text>

  <text x="246" y="155" font-size="12" fill="#1a1a1a">Термобар'єр (4 спиці):</text>
  <text x="246" y="172" font-size="12" fill="#6b7280">ширина спиці 0.4 мм</text>
  <text x="246" y="240" font-size="12" fill="#1a1a1a">Паяльний меніск:</text>
  <text x="246" y="258" font-size="12" fill="#6b7280">висота галтелі 0.2-0.3 мм</text>

  <!-- Картка параметрів SMD -->
  <rect x="60" y="300" width="380" height="145" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="75" y="322" font-size="12" font-weight="bold" fill="#1a1a1a">Конструктивні норми SMD монтажу:</text>
  <text x="75" y="342" font-size="12" fill="#1a1a1a">• Оптимально для: двосторонніх плат і високої щільності</text>
  <text x="75" y="362" font-size="12" fill="#1a1a1a">• Паяння: стандартне оплавлення пасти в печі (Reflow)</text>
  <text x="75" y="382" font-size="12" fill="#c0392b" font-weight="bold">• Стійкість до зсуву: F_shear до 15–20 Н (ризик відриву)</text>
  <text x="75" y="402" font-size="12" fill="#6b7280">• Вимоги до корпусу: необхідні напрямні штифти роз'єму</text>
  <text x="75" y="422" font-size="12" fill="#2457d6">• Паяльна маска: NSMD (зазор маски 0.075 мм навколо)</text>

  <!-- ПРАВА ПАНЕЛЬ: THT МОНТАЖ -->
  <rect x="500" y="85" width="420" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="500" y="85" width="420" height="34" rx="8" fill="#e9f7ef" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="710" y="107" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">НАСКРІЗНИЙ МОНТАЖ (THT FOOTPRINT)</text>

  <!-- Вигляд зверху: PTH Footprint -->
  <rect x="520" y="135" width="160" height="150" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <!-- Мідний полігон -->
  <rect x="535" y="150" width="130" height="120" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <!-- Зазор термобар'єру -->
  <circle cx="600" cy="210" r="45" fill="#ffffff"/>
  <!-- Спиці термобар'єру -->
  <rect x="595" y="165" width="10" height="90" fill="#eaf0fd"/>
  <rect x="555" y="205" width="90" height="10" fill="#eaf0fd"/>
  <!-- Зовнішній паяльний поясок (Annular Ring) -->
  <circle cx="600" cy="210" r="34" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <!-- Металізований наскрізний отвір (PTH) -->
  <circle cx="600" cy="210" r="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <!-- Хвостовик гільзи (заливка) -->
  <circle cx="600" cy="210" r="12" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Розмірні лінії для THT отвору -->
  <line x1="695" y1="192" x2="695" y2="228" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="618" y1="192" x2="700" y2="192" stroke="#27ae60" stroke-width="1"/>
  <line x1="618" y1="228" x2="700" y2="228" stroke="#27ae60" stroke-width="1"/>
  <text x="706" y="214" font-size="12" font-weight="bold" fill="#27ae60">D_hole = D_pin + 0.15 мм</text>

  <text x="706" y="155" font-size="12" fill="#1a1a1a">Поясок (Annular ring):</text>
  <text x="706" y="172" font-size="12" fill="#6b7280">ширина w_ring >= 0.25 мм</text>
  <text x="706" y="240" font-size="12" fill="#1a1a1a">Товщина міді отвору:</text>
  <text x="706" y="258" font-size="12" fill="#6b7280">гальванічна мідь >= 25 мкм</text>

  <!-- Картка параметрів THT -->
  <rect x="520" y="300" width="380" height="145" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="535" y="322" font-size="12" font-weight="bold" fill="#1a1a1a">Конструктивні норми THT монтажу:</text>
  <text x="535" y="342" font-size="12" fill="#1a1a1a">• Оптимально для: силових контактів, зарядних станцій</text>
  <text x="535" y="362" font-size="12" fill="#1a1a1a">• Паяння: селективна пайка, хвиля припою або ручна</text>
  <text x="535" y="382" font-size="12" fill="#27ae60" font-weight="bold">• Стійкість до зсуву: F_shear > 60 Н (висока міцність)</text>
  <text x="535" y="402" font-size="12" fill="#6b7280">• Механічний анкер: хвостовик утримується тілом плати</text>
  <text x="535" y="422" font-size="12" fill="#2457d6">• Струмове навантаження: до 5–10 А на контакт</text>
</svg>
