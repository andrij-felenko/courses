<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка полотна -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Маркери стрілок для розмірних ліній та векторів -->
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Геометрія та допуски позиціонування Pogo Pin відносно Target Pad</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Розрахунок мінімального діаметра майданчика для компенсації радіального зміщення Δxy та кутового перекосу θ</text>

  <!-- ==================== ПАНЕЛЬ 1: ІДЕАЛЬНА СПІВВІСНІСТЬ ==================== -->
  <rect x="25" y="82" width="290" height="340" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="35" y="92" width="270" height="28" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="170" y="111" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">1. Співвісний контакт (Δxy = 0, θ = 0)</text>

  <!-- Осі та напрямні в Панелі 1 -->
  <line x1="170" y1="125" x2="170" y2="310" stroke="#6b7280" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- Pogo Pin у Панелі 1 (Гільза, Шток, Сферична голівка) -->
  <rect x="140" y="130" width="60" height="75" fill="#d1d5db" stroke="#374151" stroke-width="1.5"/>
  <rect x="152" y="205" width="36" height="40" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  <!-- Сферична голівка R=30, шарнір від y=245 до y=275 -->
  <path d="M 140,245 A 30,30 0 0,0 200,245 Z" fill="#fef08a" stroke="#b45309" stroke-width="1.5"/>
  <!-- Точка контакту -->
  <circle cx="170" cy="275" r="4" fill="#27ae60"/>

  <!-- Контактний майданчик PCB у Панелі 1 -->
  <rect x="45" y="291" width="250" height="15" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>
  <rect x="70" y="283" width="200" height="8" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
  <!-- Паяльна маска (Solder Mask) -->
  <rect x="45" y="279" width="25" height="12" fill="#059669" stroke="#047857" stroke-width="1"/>
  <rect x="270" y="279" width="25" height="12" fill="#059669" stroke="#047857" stroke-width="1"/>

  <!-- Розмірні лінії в Панелі 1 -->
  <!-- D_head -->
  <line x1="140" y1="195" x2="200" y2="195" stroke="#1a1a1a" stroke-width="1" marker-start="url(#arr-dark)" marker-end="url(#arr-dark)"/>
  <text x="170" y="188" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">D_head</text>

  <!-- D_pad -->
  <line x1="70" y1="322" x2="270" y2="322" stroke="#1a1a1a" stroke-width="1" marker-start="url(#arr-dark)" marker-end="url(#arr-dark)"/>
  <text x="170" y="338" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">D_pad (майданчик)</text>

  <!-- Інфо-блок у Панелі 1 -->
  <rect x="35" y="355" width="270" height="55" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="170" y="375" font-size="12" fill="#1a1a1a" text-anchor="middle">Точка контакту чітко по центру</text>
  <text x="170" y="396" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Мінімальний опір R_contact</text>


  <!-- ==================== ПАНЕЛЬ 2: РАДІАЛЬНЕ ЗМІЩЕННЯ ==================== -->
  <rect x="337" y="82" width="290" height="340" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="347" y="92" width="270" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="482" y="111" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">2. Радіальний зсув (Δxy &gt; 0, θ = 0)</text>

  <!-- Осі в Панелі 2: Ось майданчика (сіра) та Ось плунжера (синя) -->
  <line x1="482" y1="125" x2="482" y2="310" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="517" y1="125" x2="517" y2="310" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- Зсув Δxy між осями над корпусом -->
  <line x1="482" y1="132" x2="517" y2="132" stroke="#2457d6" stroke-width="1.2" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
  <text x="500" y="127" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Δxy</text>

  <!-- Pogo Pin у Панелі 2 (зсунутий на +35px) -->
  <rect x="487" y="140" width="60" height="65" fill="#d1d5db" stroke="#374151" stroke-width="1.5"/>
  <rect x="499" y="205" width="36" height="40" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  <path d="M 487,245 A 30,30 0 0,0 547,245 Z" fill="#fef08a" stroke="#b45309" stroke-width="1.5"/>
  <!-- Точка контакту зсунута -->
  <circle cx="517" cy="275" r="4" fill="#2457d6"/>

  <!-- Контактний майданчик PCB у Панелі 2 -->
  <rect x="357" y="291" width="250" height="15" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>
  <rect x="382" y="283" width="200" height="8" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
  <rect x="357" y="279" width="25" height="12" fill="#059669" stroke="#047857" stroke-width="1"/>
  <rect x="582" y="279" width="25" height="12" fill="#059669" stroke="#047857" stroke-width="1"/>

  <!-- Запас відстані до краю m_edge -->
  <line x1="517" y1="322" x2="582" y2="322" stroke="#6b7280" stroke-width="1" marker-start="url(#arr-gray)" marker-end="url(#arr-gray)"/>
  <text x="550" y="338" font-size="12" fill="#6b7280" text-anchor="middle">m_edge</text>

  <!-- Інфо-блок у Панелі 2 -->
  <rect x="347" y="355" width="270" height="55" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="482" y="375" font-size="12" fill="#1a1a1a" text-anchor="middle">Зсув точкового контакту вбік</text>
  <text x="482" y="396" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вимога: Δxy &lt; (D_pad - D_head)/2</text>


  <!-- ==================== ПАНЕЛЬ 3: КУТОВИЙ ПЕРЕКІС ТА КРИТИЧНИЙ ЗСУВ ==================== -->
  <rect x="649" y="82" width="290" height="340" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="659" y="92" width="270" height="28" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="794" y="111" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">3. Перекіс (θ &gt; 0) + Зсув</text>

  <!-- Осі в Панелі 3: Вертикаль (сіра) та Похила вісь (червона) -->
  <line x1="794" y1="125" x2="794" y2="310" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="3,3"/>
  <line x1="785" y1="130" x2="865" y2="280" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- Позначення кута перекосу θ -->
  <path d="M 794,155 A 25,25 0 0,1 806,158" fill="none" stroke="#c0392b" stroke-width="1.5"/>
  <text x="835" y="145" font-size="12" font-weight="bold" fill="#c0392b">θ</text>

  <!-- Додатковий кутовий зсув Δθ -->
  <line x1="794" y1="185" x2="825" y2="185" stroke="#c0392b" stroke-width="1" marker-start="url(#arr-red)" marker-end="url(#arr-red)"/>
  <text x="836" y="189" font-size="12" fill="#c0392b" text-anchor="start">Δθ = h_c·tan(θ)</text>

  <!-- Pogo Pin у Панелі 3 (tilted & shifted right) -->
  <polygon points="765,130 822,143 806,204 749,191" fill="#d1d5db" stroke="#374151" stroke-width="1.5"/>
  <polygon points="772,204 807,212 798,247 763,239" fill="#e5e7eb" stroke="#374151" stroke-width="1.5"/>
  <path d="M 760,240 A 30,30 0 0,0 818,252 Z" fill="#fef08a" stroke="#b45309" stroke-width="1.5"/>

  <!-- Критична точка контакту (червона) біля самого краю майданчика -->
  <circle cx="865" cy="275" r="4" fill="#c0392b"/>

  <!-- Контактний майданчик PCB у Панелі 3 -->
  <rect x="669" y="291" width="250" height="15" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1"/>
  <rect x="694" y="283" width="200" height="8" fill="#f59e0b" stroke="#b45309" stroke-width="1.5"/>
  <rect x="669" y="279" width="25" height="12" fill="#059669" stroke="#047857" stroke-width="1"/>
  <rect x="894" y="279" width="25" height="12" fill="#059669" stroke="#047857" stroke-width="1"/>

  <!-- Попереджувальне виділення ризику зіскоку/зносу -->
  <circle cx="880" cy="281" r="14" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Інфо-блок у Панелі 3 -->
  <rect x="659" y="355" width="270" height="55" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="794" y="375" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">НЕБЕЗПЕКА: Сповзання / Фретинг</text>
  <text x="794" y="396" font-size="12" fill="#1a1a1a" text-anchor="middle">Контакт на краю маски малуватий</text>


  <!-- ==================== НИЖНЯ ПАНЕЛЬ: ФОРМУЛА ТА КРИТЕРІЇ ==================== -->
  <rect x="25" y="436" width="914" height="100" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Лівий шильдик / Заголовок критерію -->
  <rect x="40" y="448" width="170" height="76" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="125" y="472" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Критерій надійності</text>
  <text x="125" y="495" font-size="12" fill="#1a1a1a" text-anchor="middle">@@en|target pad geometry@@</text>

  <!-- Головна формула -->
  <text x="575" y="468" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">D_pad ≥ D_head + 2·Δxy + 2·h_c·tan(θ) + 2·m_edge</text>

  <!-- 3 колонки з розшифровкою параметрів -->
  <text x="340" y="502" font-size="12" fill="#1a1a1a" text-anchor="middle">• Δxy — точність монтажу PCB</text>
  <text x="575" y="502" font-size="12" fill="#1a1a1a" text-anchor="middle">• h_c·tan(θ) — кутовий зсув</text>
  <text x="800" y="502" font-size="12" fill="#1a1a1a" text-anchor="middle">• m_edge — відступ від маски</text>

</svg>
