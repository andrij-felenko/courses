<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Залежність зусилля притиску та опору від ходу Pogo Pin</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Оптимальний робочий діапазон ходу між зоною нестабільного контакту та жорстким упором</text>

  <!-- ЗОНИ НА ГРАФІКУ (Підкладка) -->
  <!-- Верхня плашка заголовків зон -->
  <rect x="100" y="95" width="130" height="24" fill="#fdecea" stroke="#d0d7de" stroke-width="1"/>
  <text x="165" y="111" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Недотиск</text>

  <rect x="230" y="95" width="260" height="24" fill="#e9f7ef" stroke="#d0d7de" stroke-width="1"/>
  <text x="360" y="111" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Робочий хід (Working Stroke)</text>

  <rect x="490" y="95" width="130" height="24" fill="#fdecea" stroke="#d0d7de" stroke-width="1"/>
  <text x="555" y="111" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Жорсткий упор</text>

  <!-- Зональні фони самого графіка від y=120 до 375 -->
  <rect x="100" y="120" width="130" height="255" fill="#fdecea"/>
  <rect x="230" y="120" width="260" height="255" fill="#e9f7ef"/>
  <rect x="490" y="120" width="130" height="255" fill="#fdecea"/>

  <!-- Сітка графіка -->
  <line x1="100" y1="375" x2="620" y2="375" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="100" y1="120" x2="100" y2="375" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="620" y1="120" x2="620" y2="375" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Горизонтальні лінії сітки -->
  <line x1="100" y1="305" x2="620" y2="305" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="100" y1="245" x2="620" y2="245" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="100" y1="185" x2="620" y2="185" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Позначки осі X (Хід плунжера x, мм) -->
  <text x="100" y="393" font-size="12" fill="#1a1a1a" text-anchor="middle">0.0</text>
  <text x="230" y="393" font-size="12" fill="#1a1a1a" text-anchor="middle">0.5</text>
  <text x="360" y="393" font-size="12" fill="#1a1a1a" text-anchor="middle">1.0 (ном.)</text>
  <text x="490" y="393" font-size="12" fill="#1a1a1a" text-anchor="middle">1.5</text>
  <text x="620" y="393" font-size="12" fill="#1a1a1a" text-anchor="middle">2.0</text>
  <text x="360" y="415" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Хід стиснення плунжера x (мм)</text>

  <!-- Позначки лівої осі Y: Сила F (Н) [Синій] -->
  <text x="92" y="378" font-size="11" fill="#2457d6" text-anchor="end">0.0</text>
  <text x="92" y="308" font-size="11" fill="#2457d6" text-anchor="end">0.5</text>
  <text x="92" y="248" font-size="11" fill="#2457d6" text-anchor="end">1.0</text>
  <text x="92" y="188" font-size="11" fill="#2457d6" text-anchor="end">1.5</text>
  <text x="92" y="128" font-size="11" fill="#2457d6" text-anchor="end">2.0</text>
  <text x="100" y="85" font-size="12" font-weight="bold" fill="#2457d6">Сила F (Н)</text>

  <!-- Позначки правої осі Y: Опір R (мОм) [Зелений] -->
  <text x="626" y="378" font-size="11" fill="#27ae60">0</text>
  <text x="626" y="308" font-size="11" fill="#27ae60">30</text>
  <text x="626" y="248" font-size="11" fill="#27ae60">60</text>
  <text x="626" y="188" font-size="11" fill="#27ae60">90</text>
  <text x="626" y="128" font-size="11" fill="#27ae60">120</text>
  <text x="620" y="85" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">Опір R (мОм)</text>

  <!-- Крива сили F(x) = F_preload + k * x (Синя пряма, переходить у різкий зріст при упорі) -->
  <path d="M100,345 L490,165 Q520,150 540,126" fill="none" stroke="#2457d6" stroke-width="3"/>
  <circle cx="360" cy="225" r="4" fill="#2457d6"/>
  <text x="280" y="215" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">F_nom = 1.1 Н</text>

  <!-- Крива опору R(x) (Зелена гіперболічна крива) -->
  <path d="M100,135 Q140,170 180,270 Q230,340 360,350 L620,352" fill="none" stroke="#27ae60" stroke-width="3"/>
  <circle cx="360" cy="350" r="4" fill="#27ae60"/>
  <text x="360" y="330" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">R_nom = 15 мОм</text>

  <!-- ПРАВА ПАНЕЛЬ: ПОЯСНЕННЯ ЗОН ТА ФОРМУЛ -->
  <rect x="660" y="85" width="260" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="660" y="85" width="260" height="34" rx="8" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="790" y="107" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">ІНЖЕНЕРНИЙ РОЗРАХУНОК</text>

  <!-- Картка 1: Сила пружини -->
  <rect x="675" y="130" width="230" height="95" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="687" y="150" font-size="12" font-weight="bold" fill="#2457d6">Закон Гука для штифта:</text>
  <text x="687" y="170" font-size="12" font-weight="bold" fill="#1a1a1a">F(x) = F_preload + k · x</text>
  <text x="687" y="188" font-size="12" fill="#6b7280">• F_preload = 0.2 ... 0.4 Н</text>
  <text x="687" y="206" font-size="12" fill="#6b7280">• k_spring = 0.8 ... 1.2 Н/мм</text>

  <!-- Картка 2: Опір Гольма -->
  <rect x="675" y="235" width="230" height="105" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="687" y="255" font-size="12" font-weight="bold" fill="#27ae60">Опір звуження (Гольм):</text>
  <text x="687" y="275" font-size="12" font-weight="bold" fill="#1a1a1a">R_c = ρ / (2 · a_contact)</text>
  <text x="687" y="295" font-size="12" fill="#1a1a1a">• При F &gt; 0.8 Н опір R &lt; 20 мОм</text>
  <text x="687" y="313" font-size="12" fill="#6b7280">• Руйнування оксидів золотом</text>
  <text x="687" y="331" font-size="12" fill="#27ae60" font-weight="bold">• Стабільний струм до 3 А</text>

  <!-- Картка 3: Попередження -->
  <rect x="675" y="350" width="230" height="95" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="687" y="372" font-size="12" font-weight="bold" fill="#c0392b">Запобігання перестисканню:</text>
  <text x="687" y="392" font-size="12" fill="#1a1a1a">• x_max &lt; 80% повного ходу</text>
  <text x="687" y="410" font-size="12" fill="#6b7280">• При упорі виникає пластична</text>
  <text x="687" y="428" font-size="12" fill="#c0392b">втома та зминання гільзи</text>
</svg>
