<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Крива фретинг-зносу та деградації контактного опору Pogo Pin</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Зростання опору контакту від кількості циклів мікровібрацій та утворення оксидного шламу</text>

  <!-- ЗОНИ НА ГРАФІКУ (Верхня плашка) -->
  <rect x="100" y="95" width="200" height="24" fill="#e9f7ef" stroke="#d0d7de" stroke-width="1"/>
  <text x="200" y="111" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">1. Золото (R &lt; 20 мОм)</text>

  <rect x="300" y="95" width="160" height="24" fill="#fef9e7" stroke="#d0d7de" stroke-width="1"/>
  <text x="380" y="111" font-size="11" font-weight="bold" fill="#f39c12" text-anchor="middle">2. Протирання до Ni</text>

  <rect x="460" y="95" width="160" height="24" fill="#fdecea" stroke="#d0d7de" stroke-width="1"/>
  <text x="540" y="111" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">3. Оксидний шлам</text>

  <!-- Зональні фони самого графіка від y=120 до 375 -->
  <rect x="100" y="120" width="200" height="255" fill="#e9f7ef"/>
  <rect x="300" y="120" width="160" height="255" fill="#fef9e7"/>
  <rect x="460" y="120" width="160" height="255" fill="#fdecea"/>

  <!-- Сітка графіка -->
  <line x1="100" y1="375" x2="620" y2="375" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="100" y1="120" x2="100" y2="375" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Горизонтальні лінії рівнів опору -->
  <line x1="100" y1="340" x2="620" y2="340" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="100" y1="280" x2="620" y2="280" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="100" y1="200" x2="620" y2="200" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="100" y1="140" x2="620" y2="140" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Текст порогу відмови R_crit = 50 мОм -->
  <text x="105" y="274" font-size="11" font-weight="bold" fill="#c0392b">Поріг відмови R_crit = 50 мОм</text>

  <!-- Позначки осі X (Кількість циклів N) -->
  <text x="100" y="393" font-size="12" fill="#1a1a1a" text-anchor="middle">10²</text>
  <text x="200" y="393" font-size="12" fill="#1a1a1a" text-anchor="middle">10³</text>
  <text x="300" y="393" font-size="12" fill="#1a1a1a" text-anchor="middle">10⁴</text>
  <text x="420" y="393" font-size="12" fill="#1a1a1a" text-anchor="middle">10⁵</text>
  <text x="540" y="393" font-size="12" fill="#1a1a1a" text-anchor="middle">10⁶</text>
  <text x="620" y="393" font-size="12" fill="#1a1a1a" text-anchor="middle">10⁷</text>
  <text x="360" y="415" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кількість циклів вібрації N (амплітуда 10–50 мкм)</text>

  <!-- Позначки осі Y: Опір R (мОм) -->
  <text x="92" y="344" font-size="11" fill="#1a1a1a" text-anchor="end">15</text>
  <text x="92" y="284" font-size="11" fill="#c0392b" text-anchor="end">50</text>
  <text x="92" y="204" font-size="11" fill="#1a1a1a" text-anchor="end">200</text>
  <text x="92" y="144" font-size="11" fill="#1a1a1a" text-anchor="end">1000</text>
  <text x="100" y="85" font-size="12" font-weight="bold" fill="#1a1a1a">Опір R_contact (мОм)</text>

  <!-- Крива фретингу (Червоно-синя лінія деградації) -->
  <path d="M100,342 L300,340 Q380,335 440,290 Q470,250 510,145 Q530,135 620,130" fill="none" stroke="#c0392b" stroke-width="3"/>
  <circle cx="300" cy="340" r="4" fill="#27ae60"/>
  <circle cx="440" cy="290" r="4" fill="#f39c12"/>
  <circle cx="510" cy="145" r="4" fill="#c0392b"/>

  <text x="210" y="330" font-size="12" font-weight="bold" fill="#27ae60">R ≈ 15 мОм</text>
  <text x="370" y="175" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Катастрофічний стрибок опору</text>

  <!-- ПРАВА ПАНЕЛЬ: ПОЯСНЕННЯ ЕТАПІВ -->
  <rect x="660" y="85" width="260" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="660" y="85" width="260" height="34" rx="8" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="790" y="107" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">ЕТАПИ ФРЕТИНГ-ДЕГРАДАЦІЇ</text>

  <!-- Картка 1: Стабільна зона -->
  <rect x="675" y="130" width="230" height="95" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="687" y="150" font-size="12" font-weight="bold" fill="#27ae60">1. Металевий контакт (Au-Au):</text>
  <text x="687" y="170" font-size="12" fill="#1a1a1a">• N &lt; 10⁴ циклів мікрозсувів</text>
  <text x="687" y="188" font-size="12" fill="#6b7280">• Шар золота 0.5 мкм цілий</text>
  <text x="687" y="206" font-size="12" fill="#27ae60" font-weight="bold">• Опір стабільний: R &lt; 20 мОм</text>

  <!-- Картка 2: Протирання -->
  <rect x="675" y="235" width="230" height="95" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="687" y="255" font-size="12" font-weight="bold" fill="#f39c12">2. Стирання до нікелю:</text>
  <text x="687" y="275" font-size="12" fill="#1a1a1a">• N = 10⁴ ... 10⁵ циклів</text>
  <text x="687" y="293" font-size="12" fill="#6b7280">• Оголення підшару Ni (1.5 мкм)</text>
  <text x="687" y="311" font-size="12" fill="#f39c12">• Фретинг-корозія та окиснення</text>

  <!-- Картка 3: Оксидний шлам -->
  <rect x="675" y="340" width="230" height="105" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="687" y="360" font-size="12" font-weight="bold" fill="#c0392b">3. Накопичення оксидів:</text>
  <text x="687" y="380" font-size="12" fill="#1a1a1a">• N &gt; 10⁵ циклів мікровібрацій</text>
  <text x="687" y="398" font-size="12" fill="#6b7280">• Чорний порошок оксидів NiO/CuO</text>
  <text x="687" y="416" font-size="12" fill="#c0392b" font-weight="bold">• Стрибок R &gt; 1 Ом (відмова вузла)</text>
  <text x="687" y="434" font-size="12" fill="#6b7280">• Захист: Biased скіс + мастило</text>
</svg>
