<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Геометрія Target Pad та допуски позиціонування Pogo Pin</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Розрахунок мінімального діаметра майданчика з урахуванням радіального биття, перекосу та допусків плати</text>

  <!-- ЛІВА ПАНЕЛЬ: ВИГЛЯД ЗВЕРХУ -->
  <rect x="40" y="85" width="430" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="40" y="85" width="430" height="34" rx="8" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="255" y="107" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">ЗОНА КОНТАКТУ ТА ЗСУВ ОСЕЙ (TOP VIEW)</text>

  <!-- Target pad - круглий майданчик -->
  <!-- Зовнішній край мідного майданчика (Pad) -->
  <circle cx="180" cy="225" r="85" fill="#ffffff" stroke="#2457d6" stroke-width="2.5"/>
  <!-- Крайовий запас безпеки (Margin ring) -->
  <circle cx="180" cy="225" r="70" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Номінальний центр майданчика -->
  <line x1="85" y1="225" x2="275" y2="225" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="180" y1="130" x2="180" y2="320" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <circle cx="180" cy="225" r="3" fill="#6b7280"/>

  <!-- Зсунутий плунжер (діаметр наконечника D_tip) -->
  <circle cx="215" cy="195" r="28" fill="#eaf0fd" stroke="#c0392b" stroke-width="2"/>
  <circle cx="215" cy="195" r="3" fill="#c0392b"/>
  <!-- Вектор зміщення Delta_r -->
  <line x1="180" y1="225" x2="212" y2="198" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="175" y="200" font-size="12" font-weight="bold" fill="#c0392b">Δr</text>

  <!-- Позначення зон ліворуч/праворуч -->
  <text x="280" y="160" font-size="12" font-weight="bold" fill="#2457d6">D_pad (зовнішній)</text>
  <text x="280" y="178" font-size="12" fill="#6b7280">позолота ENIG / Hard Au</text>

  <text x="280" y="215" font-size="12" font-weight="bold" fill="#27ae60">Гарантована зона</text>
  <text x="280" y="233" font-size="12" fill="#6b7280">d_margin >= 0.25 мм</text>

  <text x="280" y="270" font-size="12" font-weight="bold" fill="#c0392b">Плунжер D_tip</text>
  <text x="280" y="288" font-size="12" fill="#6b7280">радіус сфери R_tip</text>

  <!-- Нижня картка формули -->
  <rect x="55" y="335" width="400" height="110" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="70" y="358" font-size="12" font-weight="bold" fill="#1a1a1a">Інженерний розрахунок діаметра Target Pad:</text>
  <text x="70" y="380" font-size="12" font-weight="bold" fill="#2457d6">D_pad = D_tip + 2·(δ_pcb + δ_mech + h·tan θ) + 2·d_margin</text>
  <text x="70" y="402" font-size="12" fill="#1a1a1a">• Гарантує контакт при найгіршому збігу виробничих допусків</text>
  <text x="70" y="422" font-size="12" fill="#6b7280">• Запобігає зісковзуванню плунжера на діелектрик плати</text>

  <!-- ПРАВА ПАНЕЛЬ: БОКОВИЙ ПРОФІЛЬ -->
  <rect x="490" y="85" width="430" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="490" y="85" width="430" height="34" rx="8" fill="#e9f7ef" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="705" y="107" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">КУТОВИЙ ПЕРЕКІС ТА ДОПУСКИ (SECTION VIEW)</text>

  <!-- Друкована плата (профіль) -->
  <rect x="515" y="260" width="380" height="24" rx="2" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <text x="525" y="276" font-size="11" font-weight="bold" fill="#1a1a1a">FR4 PCB</text>
  <!-- Мідний шар Target Pad -->
  <rect x="620" y="254" width="170" height="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="705" y="248" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Target Pad (Au/Ni/Cu)</text>

  <!-- Гільза Pogo Pin (похилена під кутом theta) -->
  <!-- Вертикальна вісь майданчика -->
  <line x1="705" y1="130" x2="705" y2="254" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <!-- Нахилений корпус гільзи -->
  <rect x="685" y="130" width="30" height="65" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Плунжер, висунутий до контакту -->
  <path d="M693,195 L693,248 Q693,254 700,254 Q707,254 707,248 L707,195 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  
  <!-- Кут перекосу theta -->
  <line x1="700" y1="130" x2="700" y2="254" stroke="#c0392b" stroke-width="1.2"/>
  <text x="725" y="160" font-size="12" font-weight="bold" fill="#c0392b">Кут θ до 1.5°</text>
  <text x="725" y="177" font-size="12" fill="#6b7280">висота вильоту h</text>

  <!-- Таблиця складових похибки -->
  <rect x="515" y="300" width="380" height="145" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="530" y="322" font-size="12" font-weight="bold" fill="#1a1a1a">Бюджет похибок позиціонування:</text>
  <text x="530" y="342" font-size="12" fill="#1a1a1a">• δ_pcb (свердління й монтаж SMD): ±0.08 ... 0.12 мм</text>
  <text x="530" y="362" font-size="12" fill="#1a1a1a">• δ_mech (радіальний люфт гільзи): ±0.03 ... 0.05 мм</text>
  <text x="530" y="382" font-size="12" fill="#1a1a1a">• h·tan θ (зсув через кутовий перекіс): ±0.05 ... 0.08 мм</text>
  <text x="530" y="402" font-size="12" fill="#27ae60" font-weight="bold">• Рекомендований D_pad: від 1.8 до 2.5 × D_tip</text>
  <text x="530" y="422" font-size="12" fill="#6b7280">• Опір контакту: R_contact менше 30 мОм притиску</text>
</svg>
