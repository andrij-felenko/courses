<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Динаміка мікророзриву Pogo Pin при вібраційному та шоковому навантаженні</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">При перевищенні інерційною силою F_in = m·a сили попереднього стиснення пружини F_sp виникає відрив контакту</text>

  <!-- Маркери стрілок -->
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-danger" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-success" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- ==================== ПАНЕЛЬ 1: МЕХАНІЧНА МОДЕЛЬ (ЛІВОРУЧ) ==================== -->
  <rect x="30" y="75" width="435" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="247" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Механіка контакту: Норма проти Відриву</text>

  <!-- Блок 1.1: Стабільний контакт -->
  <rect x="45" y="112" width="405" height="150" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="60" y="132" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="start">Стабільний контакт (F_sp &gt; F_in)</text>

  <!-- Схема Pogo Pin: Норма -->
  <rect x="60" y="235" width="130" height="8" rx="2" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>
  <text x="125" y="254" font-size="11" fill="#6b7280" text-anchor="middle">Target Pad (Контакт)</text>

  <rect x="95" y="145" width="40" height="65" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M105,175 L125,175 L125,227 L115,235 L105,227 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M108,150 L122,154 L108,158 L122,162 L108,166 L122,170 L108,174" fill="none" stroke="#2457d6" stroke-width="1.5"/>

  <line x1="148" y1="155" x2="148" y2="200" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-success)"/>
  <text x="156" y="180" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">F_sp</text>

  <!-- Опис 1.1 -->
  <text x="205" y="156" font-size="12" fill="#1a1a1a" text-anchor="start">• Притиск: F_sp = k · x_preload</text>
  <text x="205" y="176" font-size="12" fill="#1a1a1a" text-anchor="start">• Перехідний опір: R_c ≈ 20 мОм</text>
  <text x="205" y="196" font-size="12" fill="#1a1a1a" text-anchor="start">• Замкнене коло (безперервний струм)</text>

  <rect x="205" y="212" width="230" height="24" rx="4" fill="#27ae60"/>
  <text x="320" y="228" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">СУЦІЛЬНИЙ ЕЛЕКТРИЧНИЙ КОНТАКТ</text>

  <!-- Блок 1.2: Мікророзрив при шоку -->
  <rect x="45" y="277" width="405" height="158" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="60" y="297" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="start">Мікророзрив при шоку (F_in &gt; F_sp)</text>

  <!-- Схема Pogo Pin: Відрив -->
  <text x="62" y="375" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">a_vib</text>
  <line x1="62" y1="422" x2="62" y2="385" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-danger)"/>

  <rect x="80" y="400" width="110" height="8" rx="2" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>
  <text x="135" y="419" font-size="11" fill="#6b7280" text-anchor="middle">Target Pad</text>

  <rect x="95" y="308" width="40" height="65" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M105,330 L125,330 L125,382 L115,390 L105,382 Z" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>

  <rect x="105" y="390" width="20" height="10" fill="#c0392b" fill-opacity="0.2" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="132" y="398" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="start">δg &gt; 0 (Відрив)</text>

  <line x1="148" y1="365" x2="148" y2="325" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-danger)"/>
  <text x="156" y="345" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">F_in</text>

  <line x1="142" y1="330" x2="142" y2="355" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-success)"/>

  <!-- Опис 1.2 -->
  <text x="210" y="320" font-size="12" fill="#1a1a1a" text-anchor="start">• Інерційна сила: F_in = m · a</text>
  <text x="210" y="340" font-size="12" fill="#1a1a1a" text-anchor="start">• Повний відрив: F_in &gt; F_sp</text>
  <text x="210" y="360" font-size="12" fill="#1a1a1a" text-anchor="start">• Опір контакту: R_c → ∞ (Обрив)</text>

  <rect x="210" y="378" width="225" height="24" rx="4" fill="#c0392b"/>
  <text x="322" y="394" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">МІКРОРОЗРИВ ЕЛЕКТРИЧНОГО КОЛА</text>

  <!-- ==================== ПАНЕЛЬ 2: ХРОНОГРАМА (ПРАВОРУЧ) ==================== -->
  <rect x="495" y="75" width="435" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="712" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Хронограма процесу мікророзриву</text>

  <!-- Зона мікророзриву (вертикальна смуга) -->
  <rect x="665" y="112" width="90" height="280" fill="#fdecea" fill-opacity="0.6" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Трек 1: Прискорення a(t) -->
  <line x1="545" y1="115" x2="545" y2="185" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="540" y="122" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">a(t)</text>
  <line x1="545" y1="138" x2="890" y2="138" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="895" y="142" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="start">a_crit</text>
  <line x1="545" y1="175" x2="890" y2="175" stroke="#6b7280" stroke-width="1"/>
  <path d="M545,175 L610,175 Q640,175 665,138 Q710,115 755,138 Q780,175 810,175 L890,175" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Трек 2: Сила притиску F_c(t) -->
  <line x1="545" y1="205" x2="545" y2="275" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="540" y="212" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">F_c(t)</text>
  <line x1="545" y1="220" x2="890" y2="220" stroke="#27ae60" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="895" y="224" font-size="11" fill="#27ae60" text-anchor="start">F_sp</text>
  <line x1="545" y1="260" x2="890" y2="260" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="895" y="264" font-size="11" fill="#c0392b" text-anchor="start">0 (Відрив)</text>
  <path d="M545,220 L610,220 Q640,220 665,260 L755,260 Q770,210 785,225 Q795,218 810,220 L890,220" fill="none" stroke="#27ae60" stroke-width="2"/>

  <!-- Трек 3: Опір R_c(t) -->
  <line x1="545" y1="295" x2="545" y2="365" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="540" y="302" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">R_c(t)</text>
  <text x="895" y="312" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="start">R_c → ∞</text>
  <text x="895" y="358" font-size="11" fill="#27ae60" text-anchor="start">R_0</text>
  <path d="M545,355 L665,355 L665,308 L755,308 L755,355 L890,355" fill="none" stroke="#c0392b" stroke-width="2"/>

  <!-- Інтервал тривалості розриву -->
  <line x1="665" y1="378" x2="755" y2="378" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-danger)" marker-end="url(#arr-danger)"/>
  <text x="710" y="373" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Δt_disc (Мікророзрив)</text>

  <!-- Вісь часу -->
  <line x1="545" y1="398" x2="890" y2="398" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="890" y="415" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="end">Час (t)</text>

  <line x1="665" y1="112" x2="665" y2="398" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="665" y="415" font-size="11" fill="#c0392b" text-anchor="middle">t_1 (відрив)</text>

  <line x1="755" y1="112" x2="755" y2="398" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="755" y="415" font-size="11" fill="#27ae60" text-anchor="middle">t_2 (відновлення)</text>

  <!-- ==================== ПАНЕЛЬ 3: ПІДСУМОК (НИЗ) ==================== -->
  <rect x="30" y="462" width="900" height="78" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>

  <text x="45" y="482" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">Умова безвідривного контакту:</text>
  <text x="45" y="501" font-size="12" fill="#1a1a1a" text-anchor="start">a_max &lt; a_crit = F_sp / m_plunger</text>
  <text x="45" y="522" font-size="12" fill="#1a1a1a" text-anchor="start">Запас вібростійкості: K_v = F_sp / (m_plunger · a_max) ≥ 1.5...2.0</text>

  <line x1="465" y1="472" x2="465" y2="530" stroke="#d0d7de" stroke-width="1"/>

  <text x="485" y="482" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">Методи запобігання мікророзривам:</text>
  <text x="485" y="501" font-size="12" fill="#1a1a1a" text-anchor="start">1. Зменшення маси плунжера m_plunger та збільшення преднатягу F_sp</text>
  <text x="485" y="522" font-size="12" fill="#1a1a1a" text-anchor="start">2. Плунжер зі скосом (Bias Ball / Canted) для постійного тертя об гільзу</text>
</svg>
