<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Полотно -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розподіл радіальних та кільцевих напружень за моделлю Ламе</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Кільцеве розтяжне напруження σ_θ є максимальним на внутрішній стінці босу й спадає до зовнішнього радіуса</text>

  <!-- ЛІВА ПАНЕЛЬ: Переріз товстостінного босу -->
  <rect x="25" y="68" width="500" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="45" y="94" font-size="15" font-weight="bold" fill="#1a1a1a">Переріз циліндричного босу під внутрішнім тиском P_i</text>

  <!-- Центр кіл: xc=275, yc=260 -->
  <!-- Зовнішнє коло босу ro=120 -->
  <circle cx="275" cy="260" r="120" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <!-- Внутрішнє коло (отвір під втулку) ri=50 -->
  <circle cx="275" cy="260" r="50" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>

  <!-- Металева футорка в отворі (штриховий контур або латунний тон) -->
  <circle cx="275" cy="260" r="48" fill="#fef3c7" stroke="#d97706" stroke-width="1.5"/>
  <circle cx="275" cy="260" r="28" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="275" y="264" font-size="11" font-weight="bold" fill="#92400e" text-anchor="middle">Втулка</text>

  <!-- Радіальні стрілки внутрішнього тиску P_i від втулки на стінку (червоні) -->
  <line x1="275" y1="212" x2="275" y2="198" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="275" y1="308" x2="275" y2="322" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="227" y1="260" x2="213" y2="260" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <line x1="323" y1="260" x2="337" y2="260" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Кільцеві розтяжні напруження (тангенційні стрілки σ_θ) -->
  <path d="M275,185 A75,75 0 0,1 335,215" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <path d="M275,335 A75,75 0 0,1 215,305" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Підписи на лівій панелі -->
  <!-- Радіуси r_i та r_o -->
  <line x1="275" y1="260" x2="395" y2="260" stroke="#1a1a1a" stroke-width="1.2"/>
  <circle cx="325" cy="260" r="3" fill="#c0392b"/>
  <circle cx="395" cy="260" r="3" fill="#475569"/>
  <text x="330" y="252" font-size="11" font-weight="bold" fill="#c0392b">r_i</text>
  <text x="400" y="264" font-size="11" font-weight="bold" fill="#475569">r_o</text>

  <!-- Товщина стінки t_wall -->
  <line x1="155" y1="260" x2="225" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="155" y1="252" x2="155" y2="268" stroke="#1a1a1a" stroke-width="1.2"/>
  <line x1="225" y1="252" x2="225" y2="268" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="190" y="252" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">t_wall</text>

  <!-- Пояснення внизу лівої панелі -->
  <text x="275" y="415" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Зона найвищого ризику: σ_θ_max на радіусі r_i</text>
  <text x="275" y="435" font-size="11" fill="#6b7280" text-anchor="middle">При перевищенні межі плинності виникає поздовжня тріщина босу</text>


  <!-- ПРАВА ПАНЕЛЬ: Графік спадання напружень за Ламе -->
  <rect x="545" y="68" width="390" height="395" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="565" y="94" font-size="15" font-weight="bold" fill="#1a1a1a">Епюра напружень Ламе по товщині стінки</text>

  <!-- Графік напружень -->
  <rect x="565" y="110" width="350" height="170" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  
  <!-- Осі координат -->
  <!-- Вісь радіуса r (горизонтальна) -->
  <line x1="610" y1="205" x2="890" y2="205" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <text x="895" y="209" font-size="11" fill="#1a1a1a">r</text>
  <!-- Вісь напруження σ (вертикальна) -->
  <line x1="640" y1="260" x2="640" y2="125" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <text x="630" y="122" font-size="11" fill="#1a1a1a">σ</text>

  <!-- Позначки r_i та r_o на осі r -->
  <line x1="660" y1="200" x2="660" y2="210" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="660" y="222" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">r_i</text>
  <line x1="860" y1="200" x2="860" y2="210" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="860" y="222" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">r_o</text>

  <!-- Крива кільцевого розтягу σ_θ(r) > 0 (синя) -->
  <path d="M660,135 Q720,165 860,185" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <text x="665" y="145" font-size="11" font-weight="bold" fill="#2457d6">σ_θ_max (розтяг)</text>
  <text x="850" y="175" font-size="10" fill="#2457d6">σ_θ_min</text>

  <!-- Крива радіального стиску σ_r(r) < 0 (червона) -->
  <path d="M660,250 Q730,230 860,205" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="665" y="258" font-size="10" fill="#c0392b">-P_i (стиск σ_r)</text>
  <text x="840" y="235" font-size="10" fill="#c0392b">σ_r = 0</text>

  <!-- Картка формул Ламе -->
  <rect x="565" y="290" width="350" height="85" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="580" y="310" font-size="12" font-weight="bold" fill="#2457d6">Рівняння Ламе для кільцевого напруження:</text>
  <text x="580" y="330" font-size="12" font-weight="bold" fill="#1a1a1a">σ_θ(r) = P_i · r_i² / (r_o² - r_i²) · [1 + (r_o / r)²]</text>
  <text x="580" y="348" font-size="11" fill="#1a1a1a">• При r = r_i досягається пікове розтяжне напруження σ_θ_max</text>
  <text x="580" y="364" font-size="11" fill="#6b7280">• Збільшення r_o знижує пік за гіперболічною залежністю</text>

  <!-- Картка інженерного правила -->
  <rect x="565" y="385" width="350" height="65" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="580" y="405" font-size="12" font-weight="bold" fill="#27ae60">Критерій безпеки стінки босу:</text>
  <text x="580" y="423" font-size="11" fill="#1a1a1a">• Рекомендовано: t_wall ≥ 1.0–1.2 × D_insert (або r_o ≥ 2 · r_i)</text>
  <text x="580" y="439" font-size="11" fill="#27ae60">• Гарантує умову міцності: σ_θ_max &lt; σ_yield полімеру</text>
</svg>
