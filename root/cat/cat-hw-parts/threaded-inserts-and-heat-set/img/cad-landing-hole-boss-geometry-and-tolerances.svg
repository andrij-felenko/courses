<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-rev" markerWidth="8" markerHeight="8" refX="0" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M6,0 L0,3 L6,6 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Header -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Геометрія посадкового отвору та бобишки під нарізну втулку</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Співвідношення діаметра d, глибини отвору H, фаски 45° та мінімальної товщини стінки t_wall</text>

  <!-- Left Panel: Boss Cross-Section -->
  <rect x="40" y="75" width="470" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="275" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Переріз посадкової бобишки (CAD-модель)</text>

  <!-- Plastic Boss Hatching/Body -->
  <!-- Base plate -->
  <rect x="60" y="380" width="430" height="55" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Main boss column -->
  <path d="M 160,380 L 160,170 Q 160,160 170,160 L 220,160 L 235,175 L 235,340 L 315,340 L 315,175 L 330,160 L 380,160 Q 390,160 390,170 L 390,380 Z" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Hole cavity (air / white) -->
  <path d="M 220,160 L 235,175 L 235,340 L 315,340 L 315,175 L 330,160 Z" fill="white" stroke="#64748b" stroke-width="1.5"/>
  <!-- Overflow reservoir at bottom -->
  <rect x="236" y="300" width="78" height="39" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="275" y="324" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="bold">Зона розплаву</text>

  <!-- Brass Insert (Ghosted in place) -->
  <rect x="237" y="175" width="76" height="125" rx="2" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" stroke-dasharray="4,2"/>
  <!-- Thread indication inside insert -->
  <line x1="255" y1="185" x2="255" y2="290" stroke="#b45309" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="295" y1="185" x2="295" y2="290" stroke="#b45309" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="275" y="240" font-size="12" fill="#b45309" text-anchor="middle" font-weight="bold">Втулка</text>
  <text x="275" y="256" font-size="11" fill="#b45309" text-anchor="middle">L_insert</text>

  <!-- Dimension 1: Outer Boss Diameter D_boss -->
  <line x1="160" y1="120" x2="390" y2="120" stroke="#1a1a1a" stroke-width="1" marker-start="url(#arr-rev)" marker-end="url(#arr)"/>
  <line x1="160" y1="115" x2="160" y2="160" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="390" y1="115" x2="390" y2="160" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="275" y="114" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold">D_boss ≥ 2.0 · d_hole</text>

  <!-- Dimension 2: Hole diameter d_hole -->
  <line x1="235" y1="140" x2="315" y2="140" stroke="#2457d6" stroke-width="1" marker-start="url(#arr-rev)" marker-end="url(#arr-blue)"/>
  <line x1="235" y1="135" x2="235" y2="175" stroke="#93c5fd" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="315" y1="135" x2="315" y2="175" stroke="#93c5fd" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="275" y="135" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="bold">d_hole</text>

  <!-- Dimension 3: Wall thickness t_wall -->
  <line x1="160" y1="220" x2="235" y2="220" stroke="#1a1a1a" stroke-width="1" marker-start="url(#arr-rev)" marker-end="url(#arr)"/>
  <text x="197" y="213" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="bold">t_wall</text>

  <!-- Dimension 4: Depth H_hole -->
  <line x1="415" y1="160" x2="415" y2="340" stroke="#1a1a1a" stroke-width="1" marker-start="url(#arr-rev)" marker-end="url(#arr)"/>
  <line x1="380" y1="160" x2="425" y2="160" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="315" y1="340" x2="425" y2="340" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="455" y="254" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="bold">H_hole</text>

  <!-- Chamfer callout -->
  <path d="M 224,164 L 140,140" stroke="#2457d6" stroke-width="1" marker-start="url(#arr-blue)"/>
  <text x="135" y="134" font-size="11" fill="#2457d6" text-anchor="end" font-weight="bold">Фаска 45°</text>
  <text x="135" y="148" font-size="10" fill="#6b7280" text-anchor="end">0.5–0.8 мм</text>

  <!-- Right Panel: Design Rules -->
  <rect x="530" y="75" width="390" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="725" y="102" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Інженерні норми розрахунку CAD-геометрії</text>

  <!-- Card 1 -->
  <rect x="545" y="116" width="360" height="68" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="560" y="136" font-size="13" font-weight="bold" fill="#2457d6">1. Вхідна фаска (Lead-in Chamfer)</text>
  <text x="560" y="154" font-size="11" fill="#1a1a1a">Кут 45° на глибину 0.5–0.8 мм полегшує первинне</text>
  <text x="560" y="170" font-size="11" fill="#6b7280">центрування втулки та запобігає задирам пластику.</text>

  <!-- Card 2 -->
  <rect x="545" y="194" width="360" height="68" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="560" y="214" font-size="13" font-weight="bold" fill="#27ae60">2. Товщина стінки бобишки (t_wall)</text>
  <text x="560" y="232" font-size="11" fill="#1a1a1a">Норма: t_wall ≥ (0.8–1.2) · d_insert (або D_boss ≥ 2 · d).</text>
  <text x="560" y="248" font-size="11" fill="#6b7280">Тонша стінка лускає від напружень при монтажі.</text>

  <!-- Card 3 -->
  <rect x="545" y="272" width="360" height="68" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="560" y="292" font-size="13" font-weight="bold" fill="#2457d6">3. Глибина отвору та резервуар</text>
  <text x="560" y="310" font-size="11" fill="#1a1a1a">H_hole = L_insert + (1.0–1.5) мм. Дно отвору</text>
  <text x="560" y="326" font-size="11" fill="#6b7280">приймає надлишок розплаву без блокування різьби.</text>

  <!-- Card 4 -->
  <rect x="545" y="350" width="360" height="68" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="560" y="370" font-size="13" font-weight="bold" fill="#1a1a1a">4. Конусність отвору (Draft Angle)</text>
  <text x="560" y="388" font-size="11" fill="#1a1a1a">Для 3D-друку отвір проектують циліндричним;</text>
  <text x="560" y="404" font-size="11" fill="#6b7280">для лиття кут ухилу не більше 0.5°–1.0°.</text>
</svg>
