<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Стенди верифікації нарізних термовставок: виривання та зрив різьби</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Вимірювання осьового зусилля F_po через тензодатчик HX711 та крутного моменту T_to ключем</text>

  <!-- ЛІВА ПАНЕЛЬ: Осьове виривання (Pull-out test) -->
  <rect x="30" y="75" width="440" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="250" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Випробування на осьове виривання (Pull-Out)</text>

  <!-- Схема стенда виривання -->
  <rect x="50" y="120" width="400" height="180" rx="6" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Силовий гвинт і маховик тяги зверху -->
  <rect x="180" y="132" width="140" height="16" rx="3" fill="#d0d7de" stroke="#1a1a1a"/>
  <line x1="250" y1="148" x2="250" y2="168" stroke="#1a1a1a" stroke-width="2.5"/>

  <!-- Балковий тензодатчик (Load cell) -->
  <rect x="195" y="168" width="110" height="32" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="250" y="188" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">Тензодатчик 100 кг</text>

  <!-- АЦП HX711 поруч із тензодатчиком -->
  <rect x="325" y="168" width="105" height="32" rx="3" fill="#e9f7ef" stroke="#27ae60"/>
  <text x="377" y="188" text-anchor="middle" font-size="10" font-weight="bold" fill="#27ae60">АЦП HX711 (24 біт)</text>

  <!-- Тяговий шток до зразка -->
  <line x1="250" y1="200" x2="250" y2="235" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <text x="260" y="222" font-size="11" font-weight="bold" fill="#c0392b">Тяга F_po</text>

  <!-- Опорне кільце / плита фіксації зразка -->
  <rect x="130" y="248" width="240" height="10" rx="2" fill="#6b7280"/>

  <!-- Зразок пластикової деталі з бобишкою -->
  <rect x="170" y="258" width="160" height="32" rx="3" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Впаяна латунна втулка по центру зразка -->
  <rect x="238" y="258" width="24" height="24" rx="2" fill="#d0d7de" stroke="#2457d6" stroke-width="1.5"/>
  <text x="250" y="274" text-anchor="middle" font-size="10" font-weight="bold" fill="#2457d6">M3</text>

  <text x="70" y="268" font-size="11" fill="#1a1a1a">Упорна плита</text>
  <text x="70" y="284" font-size="10" fill="#6b7280">фіксації зразка</text>

  <!-- Інженерний блок виривання -->
  <rect x="50" y="312" width="400" height="108" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="65" y="332" font-size="12" font-weight="bold" fill="#1a1a1a">Параметри вимірювання F_po:</text>
  <text x="65" y="352" font-size="11" fill="#1a1a1a">• Модель: F_po = tau_shear * pi * d_ext * L_insert</text>
  <text x="65" y="372" font-size="11" fill="#2457d6">• Типові значення (M3x4): 450-650 Н (PLA/PETG)</text>
  <text x="65" y="392" font-size="11" fill="#27ae60">• Реєстрація: UART потік 80 Гц для виявлення деформації</text>
  <text x="65" y="410" font-size="10" fill="#6b7280">Критерій: точка перегину кривої позначає початок випливання</text>

  <!-- ПРАВА ПАНЕЛЬ: Крутний момент зриву (Torque-out test) -->
  <rect x="490" y="75" width="440" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="710" y="102" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a1a1a">Випробування на крутний момент (Torque-Out)</text>

  <!-- Схема стенда крутного моменту -->
  <rect x="510" y="120" width="400" height="180" rx="6" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Динамометричний ключ зверху -->
  <rect x="560" y="135" width="220" height="18" rx="4" fill="#2457d6"/>
  <text x="670" y="149" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Динамометричний ключ</text>

  <!-- Індикатор моменту -->
  <rect x="790" y="132" width="85" height="24" rx="3" fill="#ffffff" stroke="#2457d6"/>
  <text x="832" y="148" text-anchor="middle" font-size="10" font-weight="bold" fill="#2457d6">T_max (Н*м)</text>

  <!-- Вертикальний адаптер-біта з гвинтом 12.9 -->
  <line x1="600" y1="153" x2="600" y2="210" stroke="#1a1a1a" stroke-width="4"/>
  <text x="615" y="185" font-size="11" font-weight="bold" fill="#1a1a1a">Гвинт 12.9</text>

  <!-- Кругова стрілка моменту навколо осі -->
  <path d="M 580,185 A 25,25 0 1,1 620,185" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="635" y="200" font-size="11" font-weight="bold" fill="#c0392b">Момент T_to</text>

  <!-- Зразок, затиснутий у лещатах -->
  <rect x="540" y="210" width="120" height="30" rx="3" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <!-- Впаяна втулка по центру -->
  <rect x="588" y="210" width="24" height="24" rx="2" fill="#d0d7de" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Губки лещат/струбцини з обох боків -->
  <rect x="520" y="215" width="18" height="50" rx="2" fill="#6b7280"/>
  <rect x="662" y="215" width="18" height="50" rx="2" fill="#6b7280"/>
  <text x="590" y="260" font-size="10" fill="#6b7280">Затиск зразка</text>

  <!-- Опис насічки праворуч -->
  <text x="710" y="225" font-size="11" font-weight="bold" fill="#1a1a1a">Спротив провертанню:</text>
  <text x="710" y="242" font-size="10" fill="#2457d6">• Діагональна насічка</text>
  <text x="710" y="258" font-size="10" fill="#2457d6">• Зубчасті канавки</text>

  <!-- Інженерний блок крутного моменту -->
  <rect x="510" y="312" width="400" height="108" rx="6" fill="#ffffff" stroke="#d0d7de"/>
  <text x="525" y="332" font-size="12" font-weight="bold" fill="#1a1a1a">Параметри вимірювання T_to:</text>
  <text x="525" y="352" font-size="11" fill="#1a1a1a">• Границя зриву для M3: T_to = 2.2 - 3.5 Н*м</text>
  <text x="525" y="372" font-size="11" fill="#27ae60">• Робочий момент затяжки: T_rec = 0.6 - 1.0 Н*м</text>
  <text x="525" y="392" font-size="11" fill="#c0392b">• Коефіцієнт безпеки: k_safe = T_to / T_rec &gt;= 2.5</text>
  <text x="525" y="410" font-size="10" fill="#6b7280">Виключає провертання втулки при вібраціях і термоциклах</text>
</svg>
