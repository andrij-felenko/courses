<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Анатомія та геометрія латунної нарізної втулки</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Конструктивні елементи різьбової футорки та профілі механічного зачеплення в полімері</text>

  <!-- Ліва панель: креслення втулки в розрізі -->
  <rect x="30" y="75" width="480" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="270" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Конструктивні елементи та розміри втулки</text>

  <!-- Тіло латунної втулки (переріз) -->
  <!-- Ліва стінка втулки -->
  <path d="M 180 140 L 220 140 L 220 380 L 195 380 L 180 355 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <!-- Права стінка втулки -->
  <path d="M 320 140 L 360 140 L 360 355 L 345 380 L 320 380 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>

  <!-- Центральний отвір із різьбою -->
  <rect x="220" y="140" width="100" height="240" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="270" y="245" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Різьба d</text>
  <text x="270" y="265" text-anchor="middle" font-size="12" fill="#6b7280">(М2 — М8)</text>

  <!-- Насічки накатки на зовнішніх гранях -->
  <!-- Ліва сторона -->
  <line x1="165" y1="160" x2="180" y2="155" stroke="#2457d6" stroke-width="2"/>
  <line x1="165" y1="180" x2="180" y2="175" stroke="#2457d6" stroke-width="2"/>
  <line x1="165" y1="200" x2="180" y2="195" stroke="#2457d6" stroke-width="2"/>
  <line x1="165" y1="220" x2="180" y2="215" stroke="#2457d6" stroke-width="2"/>
  <!-- Центральна кільцева канавка піднутрення -->
  <rect x="172" y="235" width="8" height="30" fill="#2457d6"/>
  <rect x="360" y="235" width="8" height="30" fill="#2457d6"/>
  <!-- Нижня зустрічна накатка -->
  <line x1="165" y1="280" x2="180" y2="285" stroke="#2457d6" stroke-width="2"/>
  <line x1="165" y1="300" x2="180" y2="305" stroke="#2457d6" stroke-width="2"/>
  <line x1="165" y1="320" x2="180" y2="325" stroke="#2457d6" stroke-width="2"/>
  <line x1="165" y1="340" x2="180" y2="345" stroke="#2457d6" stroke-width="2"/>

  <!-- Права сторона -->
  <line x1="360" y1="155" x2="375" y2="160" stroke="#2457d6" stroke-width="2"/>
  <line x1="360" y1="175" x2="375" y2="180" stroke="#2457d6" stroke-width="2"/>
  <line x1="360" y1="195" x2="375" y2="200" stroke="#2457d6" stroke-width="2"/>
  <line x1="360" y1="215" x2="375" y2="220" stroke="#2457d6" stroke-width="2"/>
  <!-- Нижня зустрічна накатка права -->
  <line x1="360" y1="285" x2="375" y2="280" stroke="#2457d6" stroke-width="2"/>
  <line x1="360" y1="305" x2="375" y2="300" stroke="#2457d6" stroke-width="2"/>
  <line x1="360" y1="325" x2="375" y2="320" stroke="#2457d6" stroke-width="2"/>
  <line x1="360" y1="345" x2="375" y2="340" stroke="#2457d6" stroke-width="2"/>

  <!-- Розмірні лінії -->
  <!-- Висота втулки L справа -->
  <line x1="400" y1="140" x2="400" y2="380" stroke="#1a1a1a" stroke-width="1.2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="360" y1="140" x2="410" y2="140" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="345" y1="380" x2="410" y2="380" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="420" y="265" font-size="12" font-weight="bold" fill="#1a1a1a">L (довжина)</text>

  <!-- Зовнішній діаметр D зверху -->
  <line x1="180" y1="125" x2="360" y2="125" stroke="#1a1a1a" stroke-width="1.2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="180" y1="120" x2="180" y2="140" stroke="#6b7280" stroke-width="1"/>
  <line x1="360" y1="120" x2="360" y2="140" stroke="#6b7280" stroke-width="1"/>
  <text x="270" y="120" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">D (зовнішній діаметр)</text>

  <!-- Напрямна фаска знизу -->
  <line x1="195" y1="400" x2="345" y2="400" stroke="#1a1a1a" stroke-width="1.2" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="195" y1="380" x2="195" y2="408" stroke="#6b7280" stroke-width="1"/>
  <line x1="345" y1="380" x2="345" y2="408" stroke="#6b7280" stroke-width="1"/>
  <text x="270" y="420" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">d_pilot (пілотний діаметр)</text>

  <!-- Виноска на кут фаски -->
  <line x1="187" y1="368" x2="140" y2="390" stroke="#2457d6" stroke-width="1.2"/>
  <text x="135" y="405" text-anchor="end" font-size="11" fill="#2457d6">Фаска 45°</text>

  <!-- Виноска на канавку піднутрення -->
  <line x1="172" y1="250" x2="110" y2="250" stroke="#2457d6" stroke-width="1.2"/>
  <text x="105" y="254" text-anchor="end" font-size="11" fill="#2457d6">Кільцеве піднутрення</text>

  <!-- Права панель: типи накатки та функції елементів -->
  <rect x="530" y="75" width="400" height="380" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="730" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Профілі накатки та механіка фіксації</text>

  <!-- Підпанель 1: Спіральна / ромбічна накатка -->
  <rect x="550" y="120" width="360" height="95" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="565" y="142" font-size="13" font-weight="bold" fill="#2457d6">1. Зустрічна похила накатка (Helical)</text>
  <text x="565" y="162" font-size="12" fill="#1a1a1a">• Напрямок зубів під кутом ±30°–45°</text>
  <text x="565" y="180" font-size="12" fill="#1a1a1a">• Сприймає крутний момент затягування T_max</text>
  <text x="565" y="198" font-size="12" fill="#6b7280">• Запобігає прокручуванню втулки в полімері</text>

  <!-- Підпанель 2: Кільцеві канавки піднутрення -->
  <rect x="550" y="225" width="360" height="95" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="565" y="247" font-size="13" font-weight="bold" fill="#27ae60">2. Кільцеві канавки (Undercut Grooves)</text>
  <text x="565" y="267" font-size="12" fill="#1a1a1a">• Глибокі проточки між поясками накатки</text>
  <text x="565" y="285" font-size="12" fill="#1a1a1a">• Заповнюються розплавленим пластиком</text>
  <text x="565" y="303" font-size="12" fill="#6b7280">• Створюють опір осьовому вириванню F_pull</text>

  <!-- Підпанель 3: Напрямний буртик/фаска -->
  <rect x="550" y="330" width="360" height="95" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="565" y="352" font-size="13" font-weight="bold" fill="#1a1a1a">3. Напрямна фаска (Lead-in Pilot)</text>
  <text x="565" y="372" font-size="12" fill="#1a1a1a">• Гладка конічна ділянка на нижньому торці</text>
  <text x="565" y="390" font-size="12" fill="#1a1a1a">• Центрує втулку в отворі перед нагріванням</text>
  <text x="565" y="408" font-size="12" fill="#6b7280">• Гарантує строгу співвісність різьби без перекосу</text>
</svg>
