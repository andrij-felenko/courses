  <rect x="657" y="410" width="261" height="90" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="787.5" y="428" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Результат з'єднання:</text>
  <text x="787.5" y="447" font-size="12" fill="#1a1a1a" text-anchor="middle">• 100% заповнення насічок</text>
  <text x="787.5" y="465" font-size="12" fill="#1a1a1a" text-anchor="middle">• Захист різьби від затікання</text>
  <text x="787.5" y="483" font-size="12" fill="#6b7280" text-anchor="middle">• Максимальний опір вириву</text>
