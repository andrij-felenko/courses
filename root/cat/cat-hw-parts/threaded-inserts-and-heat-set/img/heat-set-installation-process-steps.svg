<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow Markers -->
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-orange" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#ea580c"/>
    </marker>
    
    <!-- Gradients -->
    <linearGradient id="brass-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="tip-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="50%" stop-color="#6b7280"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>

    <linearGradient id="tip-heat-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <linearGradient id="plastic-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Main Header -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Послідовність термічного впаювання нарізної втулки (Heat-Set Insert)</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Стадії позиціонування, формування розплаву, збереження соосності та захисту різьби</text>

  <!-- ==================== PANEL 1 ==================== -->
  <rect x="30" y="70" width="285" height="445" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  
  <!-- Panel 1 Header Box -->
  <rect x="42" y="80" width="261" height="46" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="172.5" y="99" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Позиціонування та соосність</text>
  <text x="172.5" y="116" font-size="12" fill="#6b7280" text-anchor="middle">Установка втулки на фаску босу</text>

  <!-- Panel 1 Centerline -->
  <line x1="172.5" y1="135" x2="172.5" y2="390" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- Panel 1 Soldering Tip -->
  <rect x="160.5" y="140" width="24" height="28" fill="url(#tip-grad)" stroke="#374151" stroke-width="1"/>
  <polygon points="160.5,168 184.5,168 178.5,198 166.5,198" fill="url(#tip-grad)" stroke="#374151" stroke-width="1"/>
  <rect x="167.5" y="198" width="10" height="30" fill="url(#tip-grad)" stroke="#374151" stroke-width="1"/>

  <!-- Panel 1 Insert -->
  <rect x="150.5" y="230" width="14" height="38" fill="url(#brass-grad)" stroke="#b45309" stroke-width="1"/>
  <rect x="180.5" y="230" width="14" height="38" fill="url(#brass-grad)" stroke="#b45309" stroke-width="1"/>
  <line x1="150.5" y1="240" x2="164.5" y2="240" stroke="#78350f" stroke-width="1.5"/>
  <line x1="150.5" y1="250" x2="164.5" y2="250" stroke="#78350f" stroke-width="1.5"/>
  <line x1="150.5" y1="260" x2="164.5" y2="260" stroke="#78350f" stroke-width="1.5"/>
  <line x1="180.5" y1="240" x2="194.5" y2="240" stroke="#78350f" stroke-width="1.5"/>
  <line x1="180.5" y1="250" x2="194.5" y2="250" stroke="#78350f" stroke-width="1.5"/>
  <line x1="180.5" y1="260" x2="194.5" y2="260" stroke="#78350f" stroke-width="1.5"/>
  <polygon points="150.5,268 164.5,268 161.5,275 153.5,275" fill="url(#brass-grad)" stroke="#b45309" stroke-width="1"/>
  <polygon points="180.5,268 194.5,268 191.5,275 183.5,275" fill="url(#brass-grad)" stroke="#b45309" stroke-width="1"/>

  <!-- Panel 1 Thermoplastic Boss -->
  <path d="M 102.5,275 L 148.5,275 L 155.5,285 L 155.5,390 L 102.5,390 Z" fill="url(#plastic-grad)" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 242.5,275 L 196.5,275 L 189.5,285 L 189.5,390 L 242.5,390 Z" fill="url(#plastic-grad)" stroke="#64748b" stroke-width="1.5"/>
  <line x1="102.5" y1="305" x2="155.5" y2="305" stroke="#94a3b8" stroke-width="0.75" stroke-dasharray="4,2"/>
  <line x1="102.5" y1="325" x2="155.5" y2="325" stroke="#94a3b8" stroke-width="0.75" stroke-dasharray="4,2"/>
  <line x1="102.5" y1="345" x2="155.5" y2="345" stroke="#94a3b8" stroke-width="0.75" stroke-dasharray="4,2"/>
  <line x1="102.5" y1="365" x2="155.5" y2="365" stroke="#94a3b8" stroke-width="0.75" stroke-dasharray="4,2"/>
  <line x1="189.5" y1="305" x2="242.5" y2="305" stroke="#94a3b8" stroke-width="0.75" stroke-dasharray="4,2"/>
  <line x1="189.5" y1="325" x2="242.5" y2="325" stroke="#94a3b8" stroke-width="0.75" stroke-dasharray="4,2"/>
  <line x1="189.5" y1="345" x2="242.5" y2="345" stroke="#94a3b8" stroke-width="0.75" stroke-dasharray="4,2"/>
  <line x1="189.5" y1="365" x2="242.5" y2="365" stroke="#94a3b8" stroke-width="0.75" stroke-dasharray="4,2"/>

  <!-- Panel 1 Labels & Leader lines -->
  <text x="98" y="154" font-size="12" font-weight="600" fill="#1a1a1a" text-anchor="end">
    <tspan x="98" y="154">Термо-</tspan>
    <tspan x="98" y="168">насадка</tspan>
  </text>
  <path d="M 104,161 L 158,161" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr-dark)"/>

  <text x="247" y="244" font-size="12" font-weight="600" fill="#1a1a1a" text-anchor="start">
    <tspan x="247" y="244">Нарізна</tspan>
    <tspan x="247" y="258">втулка</tspan>
  </text>
  <path d="M 242,251 L 198,251" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr-dark)"/>

  <text x="98" y="272" font-size="12" fill="#1a1a1a" text-anchor="end">
    <tspan x="98" y="272">Фаска</tspan>
    <tspan x="98" y="286">босу</tspan>
  </text>
  <path d="M 104,278 L 146,278" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr-dark)"/>

  <!-- Panel 1 Summary Box -->
  <rect x="42" y="410" width="261" height="90" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="172.5" y="428" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Вимоги до стадії 1:</text>
  <text x="172.5" y="447" font-size="12" fill="#1a1a1a" text-anchor="middle">• Соосність насадки та босу</text>
  <text x="172.5" y="465" font-size="12" fill="#1a1a1a" text-anchor="middle">• Діаметр отвору d_hole &lt; D_out</text>
  <text x="172.5" y="483" font-size="12" fill="#6b7280" text-anchor="middle">• Вхідна фаска під кутом 8°–15°</text>

  <!-- ==================== PANEL 2 ==================== -->
  <rect x="338" y="70" width="284" height="445" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>

