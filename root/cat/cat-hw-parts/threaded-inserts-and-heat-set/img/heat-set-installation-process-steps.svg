  <text x="480" y="428" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Параметри процесу:</text>
  <text x="480" y="447" font-size="12" fill="#1a1a1a" text-anchor="middle">• T_насадки = T_melt + 30–50°C</text>
  <text x="480" y="465" font-size="12" fill="#1a1a1a" text-anchor="middle">• Рівномірний притиск без перекосу</text>
  <text x="480" y="483" font-size="12" fill="#6b7280" text-anchor="middle">• Швидкість занурення 2–5 мм/с</text>

  <!-- ==================== PANEL 3 ==================== -->
  <rect x="645" y="70" width="285" height="445" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>

