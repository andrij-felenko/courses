  <line x1="458" y1="260" x2="472" y2="260" stroke="#78350f" stroke-width="1.5"/>
  <line x1="458" y1="270" x2="472" y2="270" stroke="#78350f" stroke-width="1.5"/>
  <line x1="458" y1="280" x2="472" y2="280" stroke="#78350f" stroke-width="1.5"/>
  <line x1="488" y1="260" x2="502" y2="260" stroke="#78350f" stroke-width="1.5"/>
  <line x1="488" y1="270" x2="502" y2="270" stroke="#78350f" stroke-width="1.5"/>
  <line x1="488" y1="280" x2="502" y2="280" stroke="#78350f" stroke-width="1.5"/>

  <!-- Panel 2 Polymer Melt Zone -->
  <rect x="450" y="250" width="8" height="42" fill="#ea580c" opacity="0.85" rx="2"/>
  <rect x="502" y="250" width="8" height="42" fill="#ea580c" opacity="0.85" rx="2"/>

  <!-- Panel 2 Thermoplastic Boss -->
  <path d="M 410,275 L 450,275 L 450,250 L 458,250 L 458,390 L 410,390 Z" fill="url(#plastic-grad)" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 550,275 L 510,275 L 510,250 L 502,250 L 502,390 L 550,390 Z" fill="url(#plastic-grad)" stroke="#64748b" stroke-width="1.5"/>

