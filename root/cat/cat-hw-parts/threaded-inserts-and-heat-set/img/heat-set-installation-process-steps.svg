  <rect x="657" y="80" width="261" height="46" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="6"/>
  <text x="787.5" y="99" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">3. Фіксація та захист різьби</text>
  <text x="787.5" y="116" font-size="12" fill="#1a1a1a" text-anchor="middle">Охолодження та полімерний замок</text>

  <!-- Panel 3 Centerline -->
  <line x1="787.5" y1="135" x2="787.5" y2="390" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>

