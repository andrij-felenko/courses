  <rect x="809.5" y="280" width="8" height="42" fill="#27ae60" opacity="0.9" rx="2"/>

  <!-- Panel 3 Thermoplastic Boss -->
  <path d="M 717.5,280 L 757.5,280 L 757.5,322 L 765.5,322 L 765.5,390 L 717.5,390 Z" fill="url(#plastic-grad)" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 857.5,280 L 817.5,280 L 817.5,322 L 809.5,322 L 809.5,390 L 857.5,390 Z" fill="url(#plastic-grad)" stroke="#64748b" stroke-width="1.5"/>

  <!-- Layer lines -->
  <line x1="717.5" y1="305" x2="757.5" y2="305" stroke="#94a3b8" stroke-width="0.75" stroke-dasharray="4,2"/>
  <line x1="717.5" y1="325" x2="765.5" y2="325" stroke="#94a3b8" stroke-width="0.75" stroke-dasharray="4,2"/>
  <line x1="717.5" y1="345" x2="765.5" y2="345" stroke="#94a3b8" stroke-width="0.75" stroke-dasharray="4,2"/>
  <line x1="717.5" y1="365" x2="765.5" y2="365" stroke="#94a3b8" stroke-width="0.75" stroke-dasharray="4,2"/>
  <line x1="817.5" y1="305" x2="857.5" y2="305" stroke="#94a3b8" stroke-width="0.75" stroke-dasharray="4,2"/>
  <line x1="809.5" y1="325" x2="857.5" y2="325" stroke="#94a3b8" stroke-width="0.75" stroke-dasharray="4,2"/>
  <line x1="809.5" y1="345" x2="857.5" y2="345" stroke="#94a3b8" stroke-width="0.75" stroke-dasharray="4,2"/>
  <line x1="809.5" y1="365" x2="857.5" y2="365" stroke="#94a3b8" stroke-width="0.75" stroke-dasharray="4,2"/>

  <!-- Panel 3 Labels & Leader lines -->
  <text x="710" y="272" font-size="12" font-weight="600" fill="#1a1a1a" text-anchor="end">
    <tspan x="710" y="272">Посадка</tspan>
    <tspan x="710" y="286">врівень</tspan>
  </text>
  <path d="M 716,279 L 762,279" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr-dark)"/>

  <text x="864" y="296" font-size="12" font-weight="600" fill="#2457d6" text-anchor="start">
    <tspan x="864" y="296">Чиста</tspan>
    <tspan x="864" y="310">різьба</tspan>
  </text>
  <path d="M 858,303 L 798,303" stroke="#2457d6" stroke-width="1" marker-end="url(#arr-blue)"/>

  <text x="710" y="332" font-size="12" font-weight="600" fill="#27ae60" text-anchor="end">
