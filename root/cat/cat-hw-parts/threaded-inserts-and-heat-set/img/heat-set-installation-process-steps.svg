  <rect x="795.5" y="280" width="14" height="42" fill="url(#brass-grad)" stroke="#b45309" stroke-width="1"/>
  <line x1="765.5" y1="290" x2="779.5" y2="290" stroke="#78350f" stroke-width="1.5"/>
  <line x1="765.5" y1="300" x2="779.5" y2="300" stroke="#78350f" stroke-width="1.5"/>
  <line x1="765.5" y1="310" x2="779.5" y2="310" stroke="#78350f" stroke-width="1.5"/>
  <line x1="795.5" y1="290" x2="809.5" y2="290" stroke="#78350f" stroke-width="1.5"/>
  <line x1="795.5" y1="300" x2="809.5" y2="300" stroke="#78350f" stroke-width="1.5"/>
  <line x1="795.5" y1="310" x2="809.5" y2="310" stroke="#78350f" stroke-width="1.5"/>

  <!-- Internal Thread Protection Zone -->
  <rect x="779.5" y="280" width="16" height="42" fill="#eaf0fd" stroke="#2457d6" stroke-width="0.75" stroke-dasharray="2,2"/>
  <path d="M 779.5,286 L 782.5,290 L 779.5,294 M 779.5,298 L 782.5,302 L 779.5,306 M 779.5,310 L 782.5,314 L 779.5,318" stroke="#2457d6" stroke-width="1.2" fill="none"/>
  <path d="M 795.5,286 L 792.5,290 L 795.5,294 M 795.5,298 L 792.5,302 L 795.5,306 M 795.5,310 L 792.5,314 L 795.5,318" stroke="#2457d6" stroke-width="1.2" fill="none"/>

  <!-- Solidified Polymer Mechanical Interlock -->
