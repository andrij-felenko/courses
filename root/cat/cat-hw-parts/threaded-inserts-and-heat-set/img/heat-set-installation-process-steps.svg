  <line x1="410" y1="305" x2="458" y2="305" stroke="#94a3b8" stroke-width="0.75" stroke-dasharray="4,2"/>
  <line x1="410" y1="325" x2="458" y2="325" stroke="#94a3b8" stroke-width="0.75" stroke-dasharray="4,2"/>
  <line x1="410" y1="345" x2="458" y2="345" stroke="#94a3b8" stroke-width="0.75" stroke-dasharray="4,2"/>
  <line x1="410" y1="365" x2="458" y2="365" stroke="#94a3b8" stroke-width="0.75" stroke-dasharray="4,2"/>
  <line x1="502" y1="305" x2="550" y2="305" stroke="#94a3b8" stroke-width="0.75" stroke-dasharray="4,2"/>
  <line x1="502" y1="325" x2="550" y2="325" stroke="#94a3b8" stroke-width="0.75" stroke-dasharray="4,2"/>
  <line x1="502" y1="345" x2="550" y2="345" stroke="#94a3b8" stroke-width="0.75" stroke-dasharray="4,2"/>
  <line x1="502" y1="365" x2="550" y2="365" stroke="#94a3b8" stroke-width="0.75" stroke-dasharray="4,2"/>

