<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
<defs>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
        <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
</defs>

<!-- Background -->
<rect x="0" y="0" width="720" height="400" fill="white"/>

<!-- Title -->
<text x="360" y="30" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Обв'язка буфера 74AHCT: живлення та узгодження лінії</text>
<text x="360" y="50" text-anchor="middle" font-size="13" fill="#6b7280">Розв'язувальний конденсатор фільтрує завади, а послідовний резистор гасить відбиття сигналу</text>

<!-- Power Rails -->
<line x1="170" y1="120" x2="310" y2="120" stroke="#1a1a1a" stroke-width="2"/>
<line x1="310" y1="120" x2="310" y2="180" stroke="#1a1a1a" stroke-width="2"/>

<line x1="170" y1="320" x2="310" y2="320" stroke="#1a1a1a" stroke-width="2"/>
<line x1="310" y1="320" x2="310" y2="260" stroke="#1a1a1a" stroke-width="2"/>

<!-- Power Rail Terminals -->
<circle cx="170" cy="120" r="4" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
<circle cx="170" cy="320" r="4" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="155" y="124" text-anchor="end" font-size="12" fill="#1a1a1a">+5 В</text>
<text x="155" y="324" text-anchor="end" font-size="12" fill="#1a1a1a">GND</text>

<!-- Capacitor -->
<line x1="240" y1="120" x2="240" y2="160" stroke="#1a1a1a" stroke-width="2"/>
<line x1="225" y1="160" x2="255" y2="160" stroke="#1a1a1a" stroke-width="2"/>
<line x1="225" y1="175" x2="255" y2="175" stroke="#1a1a1a" stroke-width="2"/>
<line x1="240" y1="175" x2="240" y2="320" stroke="#1a1a1a" stroke-width="2"/>
<circle cx="240" cy="120" r="3" fill="#1a1a1a"/>
<circle cx="240" cy="320" r="3" fill="#1a1a1a"/>
<text x="215" y="190" text-anchor="end" font-size="12" fill="#1a1a1a">100 нФ</text>

<!-- Green annotation (Capacitor) -->
<rect x="20" y="80" width="140" height="45" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
<text x="90" y="98" text-anchor="middle" font-size="12" fill="#1a1a1a">Фільтрація завад</text>
<text x="90" y="116" text-anchor="middle" font-size="12" fill="#6b7280">по живленню</text>
<path d="M 90 125 L 90 167 L 215 167" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arr-green)"/>

<!-- IC 74AHCT -->
<rect x="260" y="180" width="100" height="80" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
<text x="310" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">74AHCT</text>

<!-- Input Line -->
<circle cx="80" cy="220" r="4" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
<line x1="84" y1="220" x2="260" y2="220" stroke="#1a1a1a" stroke-width="2"/>
<text x="100" y="212" font-size="12" fill="#6b7280">Від логіки 3.3 В</text>

<!-- Output Line and Resistor -->
<line x1="360" y1="220" x2="390" y2="220" stroke="#1a1a1a" stroke-width="2"/>
<rect x="390" y="212" width="40" height="16" fill="white" stroke="#1a1a1a" stroke-width="2"/>
<text x="410" y="205" text-anchor="middle" font-size="14" fill="#1a1a1a">R<tspan baseline-shift="sub" font-size="10">S</tspan></text>
<line x1="430" y1="220" x2="460" y2="220" stroke="#1a1a1a" stroke-width="2"/>

<!-- Blue annotation (Resistor) -->
<rect x="330" y="130" width="140" height="45" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
<text x="400" y="148" text-anchor="middle" font-size="12" fill="#1a1a1a">Гасіння відбиттів</text>
<text x="400" y="166" text-anchor="middle" font-size="12" fill="#6b7280">узгодженням лінії</text>
<path d="M 400 175 L 400 190 L 390 190 L 390 205" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 2" marker-end="url(#arr-blue)"/>

<!-- Transmission Line -->
<rect x="460" y="216" width="110" height="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
<text x="515" y="205" text-anchor="middle" font-size="12" fill="#2457d6">Довга лінія</text>
<text x="515" y="240" text-anchor="middle" font-size="12" fill="#6b7280">Z<tspan baseline-shift="sub" font-size="10">0</tspan></text>

<!-- Receiver -->
<line x1="570" y1="220" x2="600" y2="220" stroke="#1a1a1a" stroke-width="2"/>
<rect x="600" y="180" width="80" height="80" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
<text x="640" y="225" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Приймач</text>

</svg>
