  <text x="514" y="416" font-size="12" fill="#1a1a1a">OE# = 0, DIR = 1: <tspan font-weight="700" fill="#2457d6">Потік A → B</tspan> (3.3V → 5V)</text>
  <text x="514" y="434" font-size="12" fill="#1a1a1a">OE# = 0, DIR = 0: <tspan font-weight="700" fill="#27ae60">Потік B → A</tspan> (приймання)</text>
  <text x="514" y="452" font-size="12" fill="#6b7280">OE# = 1: A, B = Hi-Z (ізоляція шини)</text>
