<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Header -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Підключення каналу 74AHCT125 як логічного рівня 3.3V -> 5V</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Правильне розведення живлення, підтяжка OE та вихідне узгодження для надійної роботи</text>

  <!-- MCU Side (3.3V) -->
  <rect x="40" y="110" width="160" height="280" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="120" y="138" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">МК (3.3V)</text>
  
  <rect x="60" y="180" width="120" height="36" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="120" y="203" font-size="13" fill="#1a1a1a" text-anchor="middle">SPI_MOSI / GPIO</text>

  <!-- 74AHCT125 IC Channel -->
  <rect x="340" y="100" width="280" height="300" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="2"/>
  <text x="480" y="130" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">74AHCT125 (1/4 IC)</text>
  <text x="480" y="148" font-size="12" fill="#6b7280" text-anchor="middle">Живлення VCC = 5.0V</text>

  <!-- IC Buffer Symbol inside -->
  <polygon points="410,180 530,220 410,260" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="450" y="225" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">BUF</text>

  <!-- OE Pin Control -->
  <line x1="280" y1="320" x2="410" y2="320" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="345" y="312" font-size="12" fill="#6b7280" text-anchor="middle">/OE (Актив. LOW)</text>
  
  <!-- Pull-down resistor for OE -->
  <rect x="295" y="335" width="24" height="40" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="335" y="360" font-size="12" fill="#1a1a1a" text-anchor="start">10k</text>
  <line x1="307" y1="320" x2="307" y2="335" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="307" y1="375" x2="307" y2="390" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="307" y="402" font-size="12" fill="#6b7280" text-anchor="middle">GND</text>

  <!-- Decoupling Capacitor -->
  <line x1="560" y1="160" x2="560" y2="190" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="552" y1="190" x2="568" y2="190" stroke="#2457d6" stroke-width="2"/>
  <line x1="552" y1="198" x2="568" y2="198" stroke="#2457d6" stroke-width="2"/>
  <line x1="560" y1="198" x2="560" y2="220" stroke="#2457d6" stroke-width="1.5"/>
  <text x="590" y="198" font-size="12" fill="#2457d6" text-anchor="start">100nF кераміка</text>
  <text x="590" y="214" font-size="11" fill="#6b7280" text-anchor="start">(біля виводів VCC/GND)</text>

  <!-- Connections In -->
  <line x1="200" y1="198" x2="410" y2="220" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="300" y="190" font-size="12" fill="#2457d6" text-anchor="middle">3.3V Logic</text>

  <!-- Output Side (5V Peripheral) -->
  <rect x="730" y="110" width="190" height="280" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="825" y="138" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Периферія (5V)</text>

  <!-- Damping Resistor -->
  <line x1="530" y1="220" x2="650" y2="220" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="650" y="210" width="40" height="20" fill="white" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="670" y="202" font-size="12" fill="#1a1a1a" text-anchor="middle">33..220Ω</text>
  <text x="670" y="248" font-size="11" fill="#6b7280" text-anchor="middle">Демпфір. резистор</text>

  <line x1="690" y1="220" x2="780" y2="220" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="760" y="202" width="130" height="36" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="825" y="225" font-size="13" fill="#1a1a1a" text-anchor="middle">DIN / SPI_IN (5V)</text>

  <!-- Ground reference notes -->
  <text x="480" y="380" font-size="12" fill="#27ae60" font-weight="bold" text-anchor="middle">✓ Узгодження рівнів та блокування завад забезпечено</text>
</svg>
