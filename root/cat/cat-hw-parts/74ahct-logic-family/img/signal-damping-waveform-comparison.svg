<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Порівняння осцилограм сигналу з демпфуванням і без нього</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Послідовний резистор ефективно усуває перерегулювання та дзвін на фронтах імпульсу</text>

  <!-- Блок 1: Без демпфування (Проблема) -->
  <rect x="40" y="85" width="425" height="340" rx="8" fill="#fdecea" stroke="#d0d7de" stroke-width="1"/>
  <rect x="60" y="105" width="385" height="40" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="252" y="130" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Без демпфування (швидкий фронт)</text>

  <!-- Графік без демпфування -->
  <g transform="translate(60, 160)">
    <!-- Сітка та осі -->
    <line x1="0" y1="180" x2="385" y2="180" stroke="#d0d7de" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="180" stroke="#d0d7de" stroke-width="1"/>
    <text x="25" y="15" font-size="12" fill="#6b7280" text-anchor="end">5V</text>
    <line x1="-5" y1="10" x2="0" y2="10" stroke="#6b7280" stroke-width="1"/>
    <text x="25" y="184" font-size="12" fill="#6b7280" text-anchor="end">0V</text>

    <!-- Осцилограма дзвону -->
    <path d="M 0 170 L 40 170 Q 55 170 65 120 Q 75 10, 85 5 Q 95 0, 105 40 Q 115 80, 125 15 Q 135 -10, 145 25 Q 160 60, 180 10 L 385 10" fill="none" stroke="#c0392b" stroke-width="2.5"/>

    <!-- Анотація перерегулювання -->
    <line x1="125" y1="5" x2="125" y2="35" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="135" y="20" font-size="12" fill="#c0392b">Перерегулювання (&gt;6V)</text>
  </g>

  <!-- Висновок проблеми -->
  <text x="252" y="395" font-size="13" fill="#c0392b" text-anchor="middle">Резонансний дзвін, загроза пробою входу</text>

  <!-- Блок 2: З демпфуванням (Рішення) -->
  <rect x="495" y="85" width="425" height="340" rx="8" fill="#e9f7ef" stroke="#d0d7de" stroke-width="1"/>
  <rect x="515" y="105" width="385" height="40" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="707" y="130" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">З послідовним резистором (R ≈ 33 Ом)</text>

  <!-- Графік з демпфуванням -->
  <g transform="translate(515, 160)">
    <!-- Сітка та осі -->
    <line x1="0" y1="180" x2="385" y2="180" stroke="#d0d7de" stroke-width="1"/>
    <line x1="0" y1="0" x2="0" y2="180" stroke="#d0d7de" stroke-width="1"/>
    <text x="25" y="15" font-size="12" fill="#6b7280" text-anchor="end">5V</text>
    <line x1="-5" y1="10" x2="0" y2="10" stroke="#6b7280" stroke-width="1"/>
    <text x="25" y="184" font-size="12" fill="#6b7280" text-anchor="end">0V</text>

    <!-- Осцилограма плавна -->
    <path d="M 0 170 L 50 170 C 80 170, 95 15, 130 10 L 385 10" fill="none" stroke="#27ae60" stroke-width="2.5"/>

    <!-- Анотація плавного фронту -->
    <line x1="130" y1="10" x2="130" y2="50" stroke="#1a1a1a" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="140" y="35" font-size="12" fill="#27ae60">Чистий фронт без викидів</text>
  </g>

  <!-- Висновок рішення -->
  <text x="707" y="395" font-size="13" fill="#27ae60" text-anchor="middle">Повністю стабільний сигнал 5 В</text>

</svg>
