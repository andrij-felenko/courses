<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" width="960" height="510" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Підкладка на все полотно -->
  <rect x="0" y="0" width="960" height="510" fill="white"/>

  <!-- Маркери стрілок -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Порівняння логічних рівнів: вихід 3,3 В MCU проти входів 5 В 74HC та 74AHCT</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Вихід 3,3 В потрапляє в невизначену зону 74HC (V_IH = 3,5 В), але впевнено перекриває поріг 74AHCT (V_IH = 2,0 В)</text>

  <!-- Загальна шкала напруги ліворуч -->
  <line x1="75" y1="400" x2="75" y2="133" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="75" y="118" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">U (В)</text>

  <!-- Позначки на шкалі напруги (50 px на 1 Вольт) -->
  <line x1="69" y1="150" x2="75" y2="150" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="64" y="154" text-anchor="end" font-size="12" fill="#6b7280">5,0</text>

  <line x1="69" y1="200" x2="75" y2="200" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="64" y="204" text-anchor="end" font-size="12" fill="#6b7280">4,0</text>

  <line x1="69" y1="250" x2="75" y2="250" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="64" y="254" text-anchor="end" font-size="12" fill="#6b7280">3,0</text>

  <line x1="69" y1="300" x2="75" y2="300" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="64" y="304" text-anchor="end" font-size="12" fill="#6b7280">2,0</text>

  <line x1="69" y1="350" x2="75" y2="350" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="64" y="354" text-anchor="end" font-size="12" fill="#6b7280">1,0</text>

  <line x1="69" y1="400" x2="75" y2="400" stroke="#1a1a1a" stroke-width="1.2"/>
  <text x="64" y="404" text-anchor="end" font-size="12" fill="#6b7280">0,0</text>

  <!-- ======================================================== -->
  <!-- КОЛОНКА 1: Вихід 3,3 В мікроконтролера                  -->
  <!-- ======================================================== -->
  <rect x="88" y="78" width="268" height="410" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="222" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Вихід 3,3 В MCU</text>
  <text x="222" y="120" text-anchor="middle" font-size="12" fill="#6b7280">Джерело сигналу (V_DD = 3,3 В)</text>
  <line x1="102" y1="130" x2="342" y2="130" stroke="#d0d7de" stroke-width="1"/>

  <!-- Стовпчик рівнів MCU (x = 106..170, w = 64) -->
  <!-- Зона понад 3,3 В (y = 150..235, h = 85) -->
  <rect x="106" y="150" width="64" height="85" fill="#f4f6f8" stroke="#d0d7de" stroke-dasharray="3,3"/>
  <text x="138" y="196" text-anchor="middle" font-size="12" fill="#6b7280">&gt; 3,3 В</text>
  <text x="178" y="188" font-size="12" fill="#6b7280">Поза живленням</text>
  <text x="178" y="204" font-size="12" fill="#6b7280">V_DD = 3,3 В</text>

  <!-- Гарантований високий рівень V_OH (2,4 В .. 3,3 В, y = 235..280, h = 45) -->
  <rect x="106" y="235" width="64" height="45" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="138" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">V_OH</text>
  <text x="178" y="251" font-size="12" font-weight="bold" fill="#2457d6">Високий рівень «1»</text>
  <text x="178" y="267" font-size="12" fill="#1a1a1a">2,4 В ... 3,3 В</text>

  <!-- Зона перемикання / фронту (0,4 В .. 2,4 В, y = 280..380, h = 100) -->
  <rect x="106" y="280" width="64" height="100" fill="#ffffff" stroke="#d0d7de"/>
  <text x="138" y="334" text-anchor="middle" font-size="12" fill="#6b7280">Фронт</text>
  <text x="178" y="324" font-size="12" fill="#6b7280">Перехідний стан</text>
  <text x="178" y="340" font-size="12" fill="#6b7280">(фронт імпульсу)</text>

  <!-- Гарантований низький рівень V_OL (0,0 В .. 0,4 В, y = 380..400, h = 20) -->
  <rect x="106" y="380" width="64" height="20" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="138" y="395" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">0</text>
  <text x="178" y="395" font-size="12" fill="#1a1a1a">Низький «0»: ≤ 0,4 В</text>

  <!-- Підсумок колонки 1 -->
  <rect x="100" y="416" width="244" height="58" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="222" y="438" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Вихідний каскад MCU</text>
  <text x="222" y="458" text-anchor="middle" font-size="12" fill="#2457d6">V_OH = 2,4 ... 3,3 В (HIGH)</text>

  <!-- Проміжок 1: зʼєднувальний шлейф до 74HC (x = 356..374) -->
  <polygon points="356,235 374,235 374,280 356,280" fill="#fdecea"/>
  <line x1="356" y1="235" x2="374" y2="235" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="356" y1="280" x2="374" y2="280" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="356" y1="257" x2="372" y2="257" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- ======================================================== -->
  <!-- КОЛОНКА 2: Вхід 5 В CMOS (серія 74HC)                   -->
  <!-- ======================================================== -->
  <rect x="374" y="78" width="268" height="410" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="508" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Вхід 74HC (5 В CMOS)</text>
  <text x="508" y="120" text-anchor="middle" font-size="12" fill="#6b7280">V_CC = 5,0 В (чистий CMOS)</text>
  <line x1="388" y1="130" x2="628" y2="130" stroke="#d0d7de" stroke-width="1"/>

  <!-- Стовпчик рівнів 74HC (x = 392..456, w = 64) -->
  <!-- Гарантована одиниця V_IH >= 3,5 В (y = 150..225, h = 75) -->
  <rect x="392" y="150" width="64" height="75" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="424" y="191" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">HIGH</text>
  <text x="466" y="180" font-size="12" font-weight="bold" fill="#27ae60">Гарантована «1»</text>
  <text x="466" y="196" font-size="12" fill="#1a1a1a">V_IH ≥ 3,5 В (0,7·V_CC)</text>

  <!-- Невизначена зона 1,5 В .. 3,5 В (y = 225..325, h = 100) -->
  <rect x="392" y="225" width="64" height="100" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <!-- Проєкція виходу MCU всередину невизначеної зони (y = 235..280) -->
  <rect x="396" y="235" width="56" height="45" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="424" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">V_OH</text>
  <text x="466" y="241" font-size="12" font-weight="bold" fill="#c0392b">НЕВИЗНАЧЕНА ЗОНА</text>
  <text x="466" y="257" font-size="12" fill="#c0392b">1,5 В ... 3,5 В</text>
  <text x="466" y="277" font-size="12" font-weight="bold" fill="#c0392b">Вихід МК нижче V_IH!</text>
  <text x="466" y="293" font-size="12" fill="#6b7280">Дефіцит: -1,1 В (2,4 &lt; 3,5)</text>
  <text x="466" y="309" font-size="12" fill="#c0392b">Наскрізний струм PMOS/NMOS</text>

  <!-- Гарантований нуль V_IL <= 1,5 В (y = 325..400, h = 75) -->
  <rect x="392" y="325" width="64" height="75" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="424" y="366" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">LOW</text>
  <text x="466" y="360" font-size="12" font-weight="bold" fill="#27ae60">Гарантований «0»</text>
  <text x="466" y="376" font-size="12" fill="#1a1a1a">V_IL ≤ 1,5 В (0,3·V_CC)</text>

  <!-- Підсумок колонки 2 -->
  <rect x="386" y="416" width="244" height="58" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="508" y="438" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">⛔ ПРЯМА НЕСУМІСНІСТЬ</text>
  <text x="508" y="458" text-anchor="middle" font-size="12" fill="#c0392b">Дефіцит 1,1 В → наскрізний струм і збої</text>

  <!-- Проміжок 2: зʼєднувальний шлейф до 74AHCT (x = 642..660) -->
  <polygon points="642,235 660,235 660,280 642,280" fill="#e9f7ef"/>
  <line x1="642" y1="235" x2="660" y2="235" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="642" y1="280" x2="660" y2="280" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,2"/>
  <line x1="642" y1="257" x2="658" y2="257" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- ======================================================== -->
  <!-- КОЛОНКА 3: Вхід 5 В TTL-сумісний (серія 74AHCT)         -->
  <!-- ======================================================== -->
  <rect x="660" y="78" width="268" height="410" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="794" y="102" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Вхід 74AHCT (5 В TTL)</text>
  <text x="794" y="120" text-anchor="middle" font-size="12" fill="#6b7280">V_CC = 5,0 В (TTL пороги)</text>
  <line x1="674" y1="130" x2="914" y2="130" stroke="#d0d7de" stroke-width="1"/>

  <!-- Стовпчик рівнів 74AHCT (x = 678..742, w = 64) -->
  <!-- Гарантована одиниця V_IH >= 2,0 В (y = 150..300, h = 150) -->
  <rect x="678" y="150" width="64" height="150" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <!-- Проєкція виходу MCU всередину зони HIGH (y = 235..280) -->
  <rect x="682" y="235" width="56" height="45" rx="3" fill="#ffffff" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="710" y="262" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">V_OH</text>
  <text x="710" y="191" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">HIGH</text>
  <text x="752" y="180" font-size="12" font-weight="bold" fill="#27ae60">Гарантована «1»</text>
  <text x="752" y="196" font-size="12" fill="#1a1a1a">V_IH ≥ 2,0 В (TTL поріг)</text>
  <text x="752" y="241" font-size="12" font-weight="bold" fill="#27ae60">Вихід МК надійно в «1»!</text>
  <text x="752" y="257" font-size="12" fill="#27ae60">Запас: +0,4 ... +1,3 В</text>
  <text x="752" y="273" font-size="12" fill="#6b7280">(2,4 В &gt; 2,0 В)</text>
  <text x="752" y="291" font-size="12" fill="#27ae60">Поріг V_IH = 2,0 В</text>

  <!-- Невизначена зона 0,8 В .. 2,0 В (y = 300..360, h = 60) -->
  <rect x="678" y="300" width="64" height="60" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="710" y="334" text-anchor="middle" font-size="12" fill="#c0392b">?</text>
  <text x="752" y="326" font-size="12" fill="#c0392b">Невизначена зона</text>
  <text x="752" y="342" font-size="12" fill="#6b7280">0,8 В ... 2,0 В (вузька)</text>

  <!-- Гарантований нуль V_IL <= 0,8 В (y = 360..400, h = 40) -->
  <rect x="678" y="360" width="64" height="40" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="710" y="385" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">LOW</text>
  <text x="752" y="376" font-size="12" font-weight="bold" fill="#27ae60">Гарантований «0»</text>
  <text x="752" y="392" font-size="12" fill="#1a1a1a">V_IL ≤ 0,8 В (TTL поріг)</text>

  <!-- Підсумок колонки 3 -->
  <rect x="672" y="416" width="244" height="58" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="794" y="438" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">✔ ВПЕВНЕНА СУМІСНІСТЬ</text>
  <text x="794" y="458" text-anchor="middle" font-size="12" fill="#27ae60">Запас +0,4...+1,3 В над V_IH = 2,0 В</text>
</svg>
