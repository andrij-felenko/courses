<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#dc2626"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#16a34a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Типові інженерні помилки монтажу болтів М5/М6 та шайб М3/М4</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Аналіз дефектів посадки шайб, порядку елементів пакета та глибини зачеплення різьби</text>

  <!-- Panel 1: Перекіс шайби та згин стержня -->
  <rect x="25" y="75" width="440" height="210" rx="8" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="40" y="98" font-size="14" font-weight="bold" fill="#be123c">1. Помилка: перекіс шайби через задирки отвору</text>

  <!-- Plate with burr -->
  <rect x="50" y="160" width="160" height="25" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 120,160 L 124,154 L 128,160 Z" fill="#e11d48"/>
  <text x="135" y="152" font-size="10" font-weight="bold" fill="#e11d48">Задирка</text>

  <!-- Washer tilted -->
  <g transform="rotate(-6 110 148)">
    <rect x="65" y="142" width="90" height="8" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="1.5"/>
  </g>

  <!-- Bolt tilted with bending moment -->
  <g transform="rotate(-6 110 148)">
    <path d="M 85,124 L 135,124 L 130,142 L 90,142 Z" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>
    <rect x="104" y="142" width="12" height="70" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>
  </g>

  <!-- Bending curve indicator -->
  <path d="M 100,165 Q 95,185 106,205" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-dasharray="3,3"/>
  <line x1="70" y1="195" x2="95" y2="185" stroke="#dc2626" stroke-width="1.5" marker-end="url(#arr-red)"/>
  <text x="40" y="210" font-size="10" font-weight="bold" fill="#dc2626">Вигин стержня!</text>

  <!-- Description 1 -->
  <text x="225" y="130" font-size="11" font-weight="bold" fill="#1e293b">Наслідок:</text>
  <text x="225" y="146" font-size="11" fill="#334155">• Несиметричний контактний тиск.</text>
  <text x="225" y="162" font-size="11" fill="#334155">• Концентрація напружень під галтеллю.</text>
  <text x="225" y="178" font-size="11" fill="#dc2626">• Втомний відрив головки болта.</text>
  <text x="225" y="202" font-size="11" font-weight="bold" fill="#16a34a">Норма: зняття фаски з отвору.</text>

  <!-- Panel 2: Неправильний порядок шайб (Гровер прямо на деталь) -->
  <rect x="495" y="75" width="440" height="210" rx="8" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="510" y="98" font-size="14" font-weight="bold" fill="#be123c">2. Помилка: шайба Гровера без плоскої шайби</text>

  <!-- Soft/painted plate damaged -->
  <rect x="520" y="160" width="160" height="25" fill="#fef08a" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="600" y="177" font-size="10" text-anchor="middle" fill="#854d0e">М'який алюміній / фарба</text>

  <!-- Grover washer biting into plate directly -->
  <rect x="555" y="146" width="90" height="14" rx="2" fill="#cbd5e1" stroke="#dc2626" stroke-width="2"/>
  <line x1="595" y1="146" x2="605" y2="160" stroke="#dc2626" stroke-width="2"/>
  <!-- Scratch grooves -->
  <line x1="560" y1="160" x2="565" y2="165" stroke="#b91c1c" stroke-width="2"/>
  <line x1="640" y1="160" x2="645" y2="165" stroke="#b91c1c" stroke-width="2"/>

  <!-- Bolt head above Grover -->
  <path d="M 570,126 L 630,126 L 625,146 L 575,146 Z" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>

  <!-- Description 2 -->
  <text x="695" y="130" font-size="11" font-weight="bold" fill="#1e293b">Наслідок:</text>
  <text x="695" y="146" font-size="11" fill="#334155">• Гострі кути Гровера здирають шар.</text>
  <text x="695" y="162" font-size="11" fill="#334155">• Врізання в пластик/алюміній.</text>
  <text x="695" y="178" font-size="11" fill="#dc2626">• Швидка релаксація натягу вузла.</text>
  <text x="695" y="202" font-size="11" font-weight="bold" fill="#16a34a">Норма: Головка → Гровер → Плоска.</text>

  <!-- Panel 3: Недостатня довжина зачеплення різьби (L_eng) -->
  <rect x="25" y="300" width="440" height="215" rx="8" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="40" y="323" font-size="14" font-weight="bold" fill="#be123c">3. Помилка: мала глибина вкручування (L_eng &lt; 1.0d)</text>

  <!-- Housing cutaway with short thread engagement -->
  <rect x="50" y="340" width="160" height="85" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <rect x="110" y="340" width="40" height="70" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="2,2"/>

  <!-- Bolt inserted too shallow (only 2 threads engaged) -->
  <rect x="122" y="330" width="16" height="35" fill="#94a3b8" stroke="#334155" stroke-width="1.5"/>
  <text x="145" y="355" font-size="10" font-weight="bold" fill="#dc2626">Лише 2 витки!</text>
  <!-- Stripped thread symbols -->
  <path d="M 118,348 L 126,348 M 118,354 L 126,354" stroke="#dc2626" stroke-width="2"/>

  <!-- Description 3 -->
  <text x="225" y="350" font-size="11" font-weight="bold" fill="#1e293b">Наслідок:</text>
  <text x="225" y="368" font-size="11" fill="#dc2626">• Зріз внутрішньої нарізки детали.</text>
  <text x="225" y="386" font-size="11" fill="#334155">• Неможливість досягти натягу F.</text>
  <text x="225" y="410" font-size="11" font-weight="bold" fill="#16a34a">Норма глибини зачеплення L_eng:</text>
  <text x="225" y="426" font-size="11" fill="#15803d">• Сталь / чавун: L ≥ 1.0 · d (М6 ≥ 6 мм)</text>
  <text x="225" y="442" font-size="11" fill="#15803d">• Алюміній / магній: L ≥ 1.5..2.0 · d</text>

  <!-- Panel 4: Болт уперся в дно глухого отвору -->
  <rect x="495" y="300" width="440" height="215" rx="8" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.5"/>
  <text x="510" y="323" font-size="14" font-weight="bold" fill="#be123c">4. Помилка: задовгий болт у глухому отворі</text>

  <!-- Blind hole cutaway -->
  <path d="M 520,340 L 680,340 L 680,440 L 520,440 Z" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
  <path d="M 580,340 L 620,340 L 620,410 L 600,425 L 580,410 Z" fill="#ffffff" stroke="#94a3b8"/>
  <text x="600" y="437" font-size="10" text-anchor="middle" fill="#64748b">Дно отвору</text>

  <!-- Plates above with gap -->
  <rect x="520" y="332" width="160" height="8" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
  <!-- Gap between head and plate -->
  <rect x="550" y="318" width="100" height="12" fill="#fee2e2" stroke="#ef4444" stroke-dasharray="2,2"/>
  <text x="600" y="327" font-size="10" text-anchor="middle" font-weight="bold" fill="#b91c1c">Зазор пакета!</text>

  <!-- Bolt bottomed out -->
  <rect x="594" y="310" width="12" height="103" fill="#94a3b8" stroke="#dc2626" stroke-width="2"/>
  <circle cx="600" cy="413" r="5" fill="#ef4444"/>

  <!-- Description 4 -->
  <text x="695" y="350" font-size="11" font-weight="bold" fill="#1e293b">Наслідок:</text>
  <text x="695" y="368" font-size="11" fill="#dc2626">• Болт уперся в дно до затиску.</text>
  <text x="695" y="386" font-size="11" fill="#334155">• Динамометр клацає хибно (F = 0!).</text>
  <text x="695" y="404" font-size="11" fill="#dc2626">• Деталі бовтаються, віброруйнування.</text>
  <text x="695" y="428" font-size="11" font-weight="bold" fill="#16a34a">Норма: запас глибини 2–3 витки.</text>
</svg>
