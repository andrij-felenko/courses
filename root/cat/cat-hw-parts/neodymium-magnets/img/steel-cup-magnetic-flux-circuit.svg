<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Концентрація магнітного потоку в сталевій чашці</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Замикання зворотного потоку феромагнітною чашкою, подвоєння робочої сили та екранування тильного боку</text>

  <!-- Left Panel: Free Disk Magnet -->
  <g>
    <rect x="30" y="85" width="450" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>
    <text x="255" y="112" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вільний дисковий магніт (Розсіяне поле)</text>

    <!-- Magnet graphic (x: 180..330, y: 195..245) -->
    <!-- North Pole (Top) -->
    <rect x="180" y="195" width="150" height="25" fill="#2457d6" rx="2"/>
    <text x="255" y="212" font-size="12" font-weight="bold" fill="white" text-anchor="middle">N</text>

    <!-- South Pole (Bottom) -->
    <rect x="180" y="220" width="150" height="25" fill="#c0392b" rx="2"/>
    <text x="255" y="237" font-size="12" font-weight="bold" fill="white" text-anchor="middle">S</text>

    <!-- Magnetic field lines (loops around) -->
    <!-- Left loop -->
    <path d="M 180 205 C 100 205, 100 235, 180 235" fill="none" stroke="#2457d6" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arr-blue)"/>
    <!-- Outer wide loop left -->
    <path d="M 195 195 C 70 180, 70 260, 195 245" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr-blue)"/>
    <!-- Outer wide loop right -->
    <path d="M 315 195 C 440 180, 440 260, 315 245" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr-blue)"/>
    <!-- Top arc -->
    <path d="M 230 195 C 230 140, 280 140, 280 195" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr-blue)"/>
    <!-- Bottom arc -->
    <path d="M 230 245 C 230 300, 280 300, 280 245" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arr-blue)"/>

    <!-- Disadvantages box -->
    <rect x="45" y="315" width="420" height="100" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
    <text x="57" y="335" font-size="12" font-weight="bold" fill="#c0392b">Недоліки вільного диска:</text>
    <text x="57" y="355" font-size="11" fill="#1a1a1a">• Значне розсіювання магнітного потоку в навколишній простір.</text>
    <text x="57" y="375" font-size="11" fill="#1a1a1a">• Небезпека наведення перешкод на чутливу електроніку та магнітометри ззаду.</text>
    <text x="57" y="395" font-size="11" fill="#1a1a1a">• Робоча сила утримання використовує лише половину потенціалу магніту.</text>
  </g>

  <!-- Right Panel: Magnet in Steel Cup -->
  <g>
    <rect x="500" y="85" width="430" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>
    <text x="715" y="112" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Магніт у сталевій чашці (Замкнений контур)</text>

    <!-- Steel cup graphic (AISI 1010) -->
    <!-- Cup body: Bottom & Sides surrounding magnet -->
    <!-- Outer cup: x: 615..815, y: 175..265 -->
    <path d="M 615 185 L 615 255 L 815 255 L 815 185 L 795 185 L 795 235 L 635 235 L 635 185 Z" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2"/>
    <!-- Label for steel cup -->
    <text x="715" y="165" font-size="11" fill="#6b7280" text-anchor="middle">Сталева чашка (AISI 1010)</text>

    <!-- Magnet inside cup (x: 635..795, y: 195..245) -->
    <!-- North Pole (Top, flush with cup rim) -->
    <rect x="635" y="195" width="160" height="25" fill="#2457d6" rx="1"/>
    <text x="715" y="212" font-size="12" font-weight="bold" fill="white" text-anchor="middle">N (Робочий полюс)</text>

    <!-- South Pole (Bottom, touching steel cup base) -->
    <rect x="635" y="220" width="160" height="25" fill="#c0392b" rx="1"/>
    <text x="715" y="237" font-size="12" font-weight="bold" fill="white" text-anchor="middle">S</text>

    <!-- Magnetic field lines: closed loop through steel cup -->
    <!-- From S pole down into cup base, through side walls, exiting at rim next to N pole -->
    <path d="M 715 235 C 715 265, 830 265, 825 210" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
    <path d="M 715 235 C 715 280, 850 280, 835 205" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arr-green)"/>
    <!-- Top bridge field lines -->
    <path d="M 670 195 C 670 170, 760 170, 760 195" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

    <!-- Advantages box -->
    <rect x="515" y="315" width="400" height="100" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
    <text x="527" y="335" font-size="12" font-weight="bold" fill="#27ae60">Переваги сталевої чашки:</text>
    <text x="527" y="355" font-size="11" fill="#1a1a1a">• Сила відриву F_pull зростає у 2–3 рази порівняно з відкритим диском!</text>
    <text x="527" y="375" font-size="11" fill="#1a1a1a">• Задня та бічні стінки екрановані (зовнішнє поле близьке до нуля).</text>
    <text x="527" y="395" font-size="11" fill="#1a1a1a">• Сталеві борти захищають крихкий сплав NdFeB від ударів та сколів.</text>
  </g>
</svg>
