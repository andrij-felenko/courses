<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вектори сил утримання неодимового магніту: відрив проти зсуву</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Сила зсуву F_shear = mu·F_pull (mu ≈ 0.15–0.20) та нелінійне падіння сили від зазору і товщини якоря</text>

  <!-- Panel 1: Left (Forces & Contact) -->
  <rect x="30" y="85" width="450" height="335" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="50" y="112" font-size="14" font-weight="bold" fill="#1a1a1a">1. Вектори сил при контакті зі сталевою плитою</text>

  <!-- Steel base plate -->
  <rect x="60" y="270" width="390" height="40" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="255" y="295" font-size="12" fill="#2457d6" text-anchor="middle" font-weight="bold">Сталева опорна плита (t ≥ 3 мм)</text>

  <!-- Neodymium magnet N42 -->
  <rect x="160" y="195" width="190" height="75" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="255" y="237" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="bold">Неодимовий магніт N42</text>

  <!-- Force Pull Vector (Green upwards) -->
  <line x1="255" y1="195" x2="255" y2="125" stroke="#27ae60" stroke-width="3.5" marker-end="url(#arr-green)"/>
  <text x="270" y="155" font-size="13" font-weight="bold" fill="#27ae60">F_pull (100%, 50 Н)</text>

  <!-- Force Shear Vector (Red rightwards) -->
  <line x1="350" y1="232" x2="425" y2="232" stroke="#c0392b" stroke-width="3.5" marker-end="url(#arr-red)"/>
  <text x="360" y="220" font-size="12" font-weight="bold" fill="#c0392b">F_shear (15-20%)</text>

  <!-- Warning box for shear -->
  <rect x="50" y="330" width="410" height="70" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="255" y="355" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Увага до зсувних навантажень!</text>
  <text x="255" y="378" font-size="11" fill="#1a1a1a" text-anchor="middle">Для фіксації на зсув обов'язковий механічний упор або кишеня,</text>
  <text x="255" y="394" font-size="11" fill="#1a1a1a" text-anchor="middle">інакше магніт легко зісковзує через гладке покриття Ni-Cu-Ni!</text>

  <!-- Panel 2: Right (Gap & Thickness Curves) -->
  <rect x="500" y="85" width="430" height="335" rx="8" fill="#f4f6f8" stroke="#d0d7de"/>
  <text x="520" y="112" font-size="14" font-weight="bold" fill="#1a1a1a">2. Вплив зазору z та товщини якоря t</text>

  <!-- Graph background -->
  <rect x="525" y="130" width="380" height="155" rx="4" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Graph axes -->
  <line x1="565" y1="250" x2="880" y2="250" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <line x1="565" y1="250" x2="565" y2="150" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- Axis labels -->
  <text x="885" y="254" font-size="11" fill="#1a1a1a">z (мм)</text>
  <text x="555" y="145" font-size="11" fill="#1a1a1a" text-anchor="end">F (%)</text>

  <!-- Grid marks & labels for Z -->
  <line x1="635" y1="246" x2="635" y2="254" stroke="#1a1a1a" stroke-width="1"/>
  <text x="635" y="268" font-size="10" fill="#6b7280" text-anchor="middle">0.5</text>
  <line x1="705" y1="246" x2="705" y2="254" stroke="#1a1a1a" stroke-width="1"/>
  <text x="705" y="268" font-size="10" fill="#6b7280" text-anchor="middle">1.0</text>
  <line x1="775" y1="246" x2="775" y2="254" stroke="#1a1a1a" stroke-width="1"/>
  <text x="775" y="268" font-size="10" fill="#6b7280" text-anchor="middle">2.0</text>
  <text x="565" y="268" font-size="10" fill="#6b7280" text-anchor="middle">0</text>

  <!-- Grid marks & labels for F -->
  <line x1="561" y1="170" x2="569" y2="170" stroke="#1a1a1a" stroke-width="1"/>
  <text x="555" y="174" font-size="10" fill="#6b7280" text-anchor="end">100%</text>
  <line x1="561" y1="210" x2="569" y2="210" stroke="#1a1a1a" stroke-width="1"/>
  <text x="555" y="214" font-size="10" fill="#6b7280" text-anchor="end">50%</text>

  <!-- Curve for F_pull(z): sharp drop -->
  <path d="M565,170 Q590,210 635,210 T705,235 T830,245" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Points on curve -->
  <circle cx="565" cy="170" r="3.5" fill="#2457d6"/>
  <circle cx="635" cy="210" r="3.5" fill="#2457d6"/>
  <circle cx="705" cy="235" r="3.5" fill="#2457d6"/>

  <!-- Annotations on graph -->
  <text x="645" y="200" font-size="11" font-weight="bold" fill="#2457d6">z=0.5мм: F≈50%</text>
  <text x="715" y="225" font-size="11" fill="#6b7280">z=1.0мм: F≈25%</text>

  <!-- Thickness note box -->
  <rect x="525" y="295" width="380" height="110" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="715" y="318" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Вплив товщини сталевого якоря (t)</text>
  <text x="535" y="340" font-size="11" fill="#1a1a1a">• t ≥ 3 мм: повне замикання магнітного потоку (100% сили).</text>
  <text x="535" y="362" font-size="11" fill="#1a1a1a">• t ≤ 0.8 мм: магнітне насичення сталі (B = B_sat ≈ 1.8 Тл) →</text>
  <text x="547" y="382" font-size="11" fill="#1a1a1a">потік виходить назовні, втрата сили утримання до 50%!</text>
</svg>
