<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Температурні класи неодимових магнітів NdFeB та криві розмагнічування</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Максимальні робочі температури T_max від 80°C до 220°C, коерцитивна сила H_cj та зміщення точки перегину</text>

  <!-- Панель 1: Стовпчикова шкала робочих температур (ліворуч x=30..460) -->
  <rect x="30" y="80" width="430" height="340" fill="#f4f6f8" rx="6" stroke="#d0d7de" stroke-width="1"/>
  <text x="245" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Максимальна робоча температура за класом (T_max)</text>

  <!-- Бари температур -->
  <!-- N: 80C -->
  <text x="45" y="138" font-size="12" font-weight="bold" fill="#1a1a1a">N</text>
  <text x="75" y="138" font-size="11" fill="#6b7280">Standard (80°C)</text>
  <rect x="180" y="126" width="70" height="18" fill="#2457d6" rx="3"/>
  <text x="260" y="139" font-size="11" font-weight="bold" fill="#1a1a1a">80°C</text>

  <!-- M: 100C -->
  <text x="45" y="172" font-size="12" font-weight="bold" fill="#1a1a1a">M</text>
  <text x="75" y="172" font-size="11" fill="#6b7280">Medium (100°C)</text>
  <rect x="180" y="160" width="90" height="18" fill="#2457d6" rx="3"/>
  <text x="280" y="173" font-size="11" font-weight="bold" fill="#1a1a1a">100°C</text>

  <!-- H: 120C -->
  <text x="45" y="206" font-size="12" font-weight="bold" fill="#1a1a1a">H</text>
  <text x="75" y="206" font-size="11" fill="#6b7280">High (120°C)</text>
  <rect x="180" y="194" width="110" height="18" fill="#2457d6" rx="3"/>
  <text x="300" y="207" font-size="11" font-weight="bold" fill="#1a1a1a">120°C</text>

  <!-- SH: 150C -->
  <text x="45" y="240" font-size="12" font-weight="bold" fill="#1a1a1a">SH</text>
  <text x="75" y="240" font-size="11" fill="#6b7280">Super High (150°C)</text>
  <rect x="180" y="228" width="135" height="18" fill="#27ae60" rx="3"/>
  <text x="325" y="241" font-size="11" font-weight="bold" fill="#1a1a1a">150°C</text>

  <!-- UH: 180C -->
  <text x="45" y="274" font-size="12" font-weight="bold" fill="#1a1a1a">UH</text>
  <text x="75" y="274" font-size="11" fill="#6b7280">Ultra High (180°C)</text>
  <rect x="180" y="262" width="160" height="18" fill="#27ae60" rx="3"/>
  <text x="350" y="275" font-size="11" font-weight="bold" fill="#1a1a1a">180°C</text>

  <!-- EH: 200C -->
  <text x="45" y="308" font-size="12" font-weight="bold" fill="#1a1a1a">EH</text>
  <text x="75" y="308" font-size="11" fill="#6b7280">Extra High (200°C)</text>
  <rect x="180" y="296" width="180" height="18" fill="#c0392b" rx="3"/>
  <text x="370" y="309" font-size="11" font-weight="bold" fill="#1a1a1a">200°C</text>

  <!-- AH: 220C -->
  <text x="45" y="342" font-size="12" font-weight="bold" fill="#1a1a1a">AH</text>
  <text x="75" y="342" font-size="11" fill="#6b7280">Automotive (220°C)</text>
  <rect x="180" y="330" width="200" height="18" fill="#c0392b" rx="3"/>
  <text x="390" y="343" font-size="11" font-weight="bold" fill="#1a1a1a">220°C</text>

  <text x="245" y="380" font-size="11" fill="#6b7280" text-anchor="middle">* Вищі класи мають більшу коерцитивність H_cj (до 35 кЕ)</text>
  <text x="245" y="400" font-size="11" fill="#c0392b" text-anchor="middle">Перевищення T_max призводить до незворотної втрати намагніченості</text>

  <!-- Панель 2: B-H криві розмагнічування (праворуч x=490..930) -->
  <rect x="490" y="80" width="440" height="340" fill="#f4f6f8" rx="6" stroke="#d0d7de" stroke-width="1"/>
  <text x="710" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Криві розмагнічування у 2-му квадранті (B vs -H)</text>

  <!-- Графік координати -->
  <!-- Осі -->
  <line x1="540" y1="360" x2="880" y2="360" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="540" y1="130" x2="540" y2="370" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Підписи осей -->
  <text x="885" y="364" font-size="11" fill="#1a1a1a">-H (кЕ)</text>
  <text x="535" y="122" font-size="11" fill="#1a1a1a" text-anchor="middle">B (Тл)</text>

  <!-- Мітки осі Y -->
  <text x="525" y="145" font-size="11" fill="#6b7280" text-anchor="end">1.4</text>
  <line x1="536" y1="142" x2="540" y2="142" stroke="#6b7280"/>
  <text x="525" y="215" font-size="11" fill="#6b7280" text-anchor="end">0.9</text>
  <line x1="536" y1="212" x2="540" y2="212" stroke="#6b7280"/>
  <text x="525" y="285" font-size="11" fill="#6b7280" text-anchor="end">0.5</text>
  <line x1="536" y1="282" x2="540" y2="282" stroke="#6b7280"/>
  <text x="525" y="364" font-size="11" fill="#6b7280" text-anchor="end">0.0</text>

  <!-- Мітки осі X -->
  <text x="540" y="378" font-size="11" fill="#6b7280" text-anchor="middle">0</text>
  <text x="650" y="378" font-size="11" fill="#6b7280" text-anchor="middle">5</text>
  <text x="760" y="378" font-size="11" fill="#6b7280" text-anchor="middle">10</text>
  <text x="870" y="378" font-size="11" fill="#6b7280" text-anchor="middle">15</text>

  <!-- Лінія навантаження Pc -->
  <line x1="540" y1="360" x2="820" y2="160" stroke="#9ca3af" stroke-width="1.2" stroke-dasharray="4,4"/>
  <text x="790" y="185" font-size="11" fill="#6b7280">Pc = 2.0</text>

  <!-- Крива 20C (зелена #27ae60) -->
  <path d="M 540 160 Q 560 160 620 165 Q 750 175 870 180" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <text x="810" y="152" font-size="11" font-weight="bold" fill="#27ae60">20°C</text>

  <!-- Крива 80C (синя #2457d6) -->
  <path d="M 540 195 Q 560 195 640 210 Q 720 230 780 290 Q 820 330 850 360" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <text x="710" y="220" font-size="11" font-weight="bold" fill="#2457d6">80°C (N)</text>

  <!-- Крива 120C (червона #c0392b) -->
  <path d="M 540 240 Q 560 240 600 250 Q 640 280 670 330 Q 685 350 710 360" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <text x="620" y="275" font-size="11" font-weight="bold" fill="#c0392b">120°C (N)</text>

  <!-- Пояснювальний блок знизу правої панелі -->
  <text x="710" y="405" font-size="11" fill="#c0392b" text-anchor="middle">Перетин коліна з лінією навантаження викликає незворотну демагнетизацію!</text>
</svg>
