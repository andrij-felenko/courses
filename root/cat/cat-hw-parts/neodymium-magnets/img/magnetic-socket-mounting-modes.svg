<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Конструктивні варіанти монтажу неодимових магнітів</text>
  <text x="480" y="60" font-size="13" text-anchor="middle" fill="#6b7280">Потайний гвинт з демпфуванням, клейове гніздо з дренажем та геометричний замок у пластику</text>

  <!-- Panel 1: Countersunk Screw -->
  <rect x="30" y="85" width="280" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="170" y="112" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Зенкування під DIN 7991</text>
  <text x="170" y="130" font-size="11" text-anchor="middle" fill="#6b7280">із осьовим зазором та демпфером</text>

  <!-- Panel 1 Visual Graphics -->
  <!-- Plastic housing block background representation -->
  <path d="M 50 150 L 290 150 L 290 270 L 50 270 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <!-- Countersunk hole & screw -->
  <polygon points="135,150 205,150 185,185 155,185" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>
  <!-- Damper washer -->
  <polygon points="145,182 195,182 190,192 150,192" fill="#27ae60" stroke="#1e8449" stroke-width="1"/>
  <!-- Screw head DIN 7991 M3 -->
  <polygon points="150,160 190,160 180,182 160,182" fill="#7f8c8d" stroke="#34495e" stroke-width="1"/>
  <line x1="170" y1="160" x2="170" y2="240" stroke="#34495e" stroke-width="3"/>
  <!-- Ring magnet NdFeB -->
  <path d="M 120,200 L 220,200 L 210,250 L 130,250 Z" fill="#2c3e50" stroke="#1a1a1a" stroke-width="1"/>
  <path d="M 155,200 L 185,200 L 180,250 L 160,250 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>

  <!-- Panel 1 Text Annotations -->
  <text x="50" y="292" font-size="11" fill="#c0392b">Радіальний та осьовий зазор 0.2–0.3 мм</text>
  <text x="50" y="315" font-size="11" fill="#1a1a1a">Обмеження моменту затягування: M ≤ 0.3 Н·м</text>
  <text x="50" y="355" font-size="11" font-weight="bold" fill="#27ae60">Переваги:</text>
  <text x="50" y="375" font-size="11" fill="#1a1a1a">Еластомірний демпфер запобігає</text>
  <text x="50" y="395" font-size="11" fill="#1a1a1a">розколюванню крихкого сплаву NdFeB.</text>


  <!-- Panel 2: Adhesive Socket -->
  <rect x="330" y="85" width="300" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="112" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Клейове гніздо з фаскою</text>
  <text x="480" y="130" font-size="11" text-anchor="middle" fill="#6b7280">з дренажним каналом та зазором</text>

  <!-- Panel 2 Visual Graphics -->
  <path d="M 350,150 L 610,150 L 610,270 L 350,270 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <!-- Entry chamfer -->
  <path d="M 430,150 L 440,160 L 520,160 L 530,150 Z" fill="#f4f6f8" stroke="#2457d6" stroke-width="1"/>
  <!-- Disc magnet -->
  <rect x="440" y="175" width="80" height="40" rx="3" fill="#2c3e50" stroke="#1a1a1a" stroke-width="1"/>
  <!-- Glue layer & drainage hole -->
  <rect x="438" y="215" width="84" height="6" fill="#e59866" opacity="0.7"/>
  <circle cx="480" cy="245" r="5" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>

  <!-- Panel 2 Text Annotations -->
  <text x="350" y="295" font-size="11" fill="#2457d6">Вхідна напрямна фаска 0.5×45°</text>
  <text x="350" y="318" font-size="11" fill="#6b7280">Клейовий зазор 0.05–0.1 мм (анаероб/епоксид)</text>
  <text x="350" y="355" font-size="11" font-weight="bold" fill="#2457d6">Переваги:</text>
  <text x="350" y="375" font-size="11" fill="#1a1a1a">Клей рівномірно розподіляє навантаження,</text>
  <text x="350" y="395" font-size="11" fill="#1a1a1a">дренаж виводить надлишок повітря.</text>


  <!-- Panel 3: Geometric Snap-Fit Lock -->
  <rect x="650" y="85" width="280" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="790" y="112" font-size="14" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Геометричний замок</text>
  <text x="790" y="130" font-size="11" text-anchor="middle" fill="#6b7280">фіксація буртиками у пластику</text>

  <!-- Panel 3 Visual Graphics -->
  <path d="M 670,150 L 910,150 L 910,270 L 670,270 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <!-- Disc magnet -->
  <rect x="750" y="180" width="80" height="45" rx="3" fill="#2c3e50" stroke="#1a1a1a" stroke-width="1"/>
  <!-- Elastic retention ribs / snap fit clips -->
  <path d="M 740,175 L 755,175 L 755,225 L 740,225 Z" fill="#c0392b" stroke="#78281f" stroke-width="1"/>
  <path d="M 825,175 L 840,175 L 840,225 L 825,225 Z" fill="#c0392b" stroke="#78281f" stroke-width="1"/>

  <!-- Panel 3 Text Annotations -->
  <text x="670" y="295" font-size="11" fill="#c0392b">Бічні упори сприймають зсув (F_shear)</text>
  <text x="670" y="318" font-size="11" fill="#1a1a1a">Монтаж без гвинтів і клею, нуль напружень</text>
  <text x="670" y="355" font-size="11" font-weight="bold" fill="#c0392b">Застереження:</text>
  <text x="670" y="375" font-size="11" fill="#1a1a1a">Необхідна жорстка фіксація магніту</text>
  <text x="670" y="395" font-size="11" fill="#1a1a1a">від вібраційного люфту та зносу.</text>
</svg>
