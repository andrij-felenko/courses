<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Хронологія винаходу та технології виробництва NdFeB (1982–1984)</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Порівняння методів швидкого загартування (General Motors) та орієнтованого спікання (Sumitomo)</text>

  <!-- Common historical background strip at top -->
  <rect x="40" y="75" width="880" height="45" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="94" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">1978–1982: Кобальтова криза в Заїрі та дефіцит SmCo → Пошук високоенергетичного сплаву Nd-Fe-B</text>
  <text x="480" y="110" text-anchor="middle" font-size="11" fill="#6b7280">Дві незалежні наукові групи одночасно синтезували фазу Nd₂Fe₁₄B різними фізичними методами</text>

  <!-- LEFT PANEL: General Motors (Melt Spinning) -->
  <rect x="40" y="130" width="425" height="305" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="55" y="145" width="395" height="30" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="252" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#2457d6">General Motors (США, Джон Кроат, 1982)</text>

  <!-- Process block -->
  <rect x="55" y="185" width="395" height="65" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="252" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Метод: Швидке загартування розплаву (Melt Spinning)</text>
  <text x="252" y="225" text-anchor="middle" font-size="11" fill="#6b7280">Струмінь рідкого Nd-Fe-B на мідне охолоджуване колесо</text>
  <text x="252" y="240" text-anchor="middle" font-size="11" fill="#2457d6">Швидкість охолодження понад 10⁶ °C/с (аморфні стрічки)</text>

  <!-- Product and specs -->
  <text x="252" y="275" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Бренд: Magnequench (зв'язані магніти)</text>
  <text x="252" y="300" text-anchor="middle" font-size="11" fill="#1a1a1a">Стрічки подрібнюються і змішуються з полімером</text>
  <text x="252" y="320" text-anchor="middle" font-size="11" fill="#1a1a1a">Магнітна структура: ізотропна (довільна орієнтація)</text>
  <text x="252" y="350" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Енергія: (BH)_max ≈ 80–120 кДж/м³</text>
  <text x="252" y="375" text-anchor="middle" font-size="11" fill="#6b7280">Перевага: формування складних тонкостінних форм</text>
  <text x="252" y="415" text-anchor="middle" font-size="11" font-weight="700" fill="#2457d6">Застосування: прецизійні ротори кулерів і датчиків</text>

  <!-- RIGHT PANEL: Sumitomo (Sintering) -->
  <rect x="495" y="130" width="425" height="305" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="510" y="145" width="395" height="30" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="707" y="165" text-anchor="middle" font-size="13" font-weight="700" fill="#27ae60">Sumitomo Special Metals (Японія, Масато Сагава, 1983)</text>

  <!-- Process block -->
  <rect x="510" y="185" width="395" height="65" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="707" y="205" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Метод: Порошкове спікання в магнітному полі</text>
  <text x="707" y="225" text-anchor="middle" font-size="11" fill="#6b7280">Дрібний помел сплаву до мікронних зерен Nd₂Fe₁₄B</text>
  <text x="707" y="240" text-anchor="middle" font-size="11" fill="#27ae60">Орієнтація доменів зовнішнім полем та вакуумне спікання</text>

  <!-- Product and specs -->
  <text x="707" y="275" text-anchor="middle" font-size="12" font-weight="700" fill="#27ae60">Бренд: Neomax (спечені суцільні магніти)</text>
  <text x="707" y="300" text-anchor="middle" font-size="11" fill="#1a1a1a">Щільний металевий моноліт максимальної густини</text>
  <text x="707" y="320" text-anchor="middle" font-size="11" fill="#1a1a1a">Магнітна структура: анізотропна (висока коерцитивність)</text>
  <text x="707" y="350" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a1a">Енергія: (BH)_max ≈ 280–420 кДж/м³</text>
  <text x="707" y="375" text-anchor="middle" font-size="11" fill="#6b7280">Перевага: максимальна сила тяжіння на одиницю маси</text>
  <text x="707" y="415" text-anchor="middle" font-size="11" font-weight="700" fill="#27ae60">Застосування: серводвигуни, крокові мотори, потужні фіксатори</text>
</svg>
