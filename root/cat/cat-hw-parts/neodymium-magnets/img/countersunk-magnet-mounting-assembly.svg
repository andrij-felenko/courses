<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Монтаж кільцевого магніту гвинтом DIN 7991 та посадка диска на клей</text>
  <text x="480" y="60" font-size="13" text-anchor="middle" fill="#6b7280">Запобігання розколюванню крихкого сплаву NdFeB еластомірною прокладкою та дренажні канавки для клею</text>

  <!-- PANEL 1: Left (DIN 7991 Screw Mounting) -->
  <rect x="30" y="85" width="450" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="115" font-size="14" font-weight="bold" fill="#1a1a1a">1. Кріплення кільцевого магніту гвинтом</text>

  <!-- Neodymium Ring Magnet (Left and Right halves) -->
  <path d="M70,160 L210,160 L235,190 L235,225 L70,225 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="140" y="200" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Магніт NdFeB</text>

  <path d="M440,160 L300,160 L275,190 L275,225 L440,225 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="370" y="200" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Магніт NdFeB</text>

  <!-- Damping washer (green) -->
  <polygon points="210,160 235,190 231,193 206,163" fill="#27ae60"/>
  <polygon points="300,160 275,190 279,193 304,163" fill="#27ae60"/>

  <!-- Screw DIN 7991 (Single path) -->
  <path d="M205,140 L305,140 L266,190 L266,285 L244,285 L244,190 L205,140 Z" fill="#bdc3c7" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="255" y="132" font-size="11" fill="#1a1a1a" text-anchor="middle">Гвинт DIN 7991</text>

  <!-- Housing Wall (Left and Right halves) -->
  <path d="M50,240 L230,240 L230,275 L50,275 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="140" y="262" font-size="11" fill="#2457d6" font-weight="bold" text-anchor="middle">Стінка корпусу</text>

  <path d="M280,240 L460,240 L460,275 L280,275 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="370" y="262" font-size="11" fill="#2457d6" font-weight="bold" text-anchor="middle">Стінка корпусу</text>

  <!-- Explanatory Callouts Panel 1 -->
  <rect x="50" y="305" width="410" height="48" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="65" y="325" font-size="11" font-weight="bold" fill="#27ae60">Еластомірна прокладка (0.5 мм):</text>
  <text x="65" y="342" font-size="10" fill="#1a1a1a">Розподіляє напруження та виключає розтріскування крихкого сплаву</text>

  <rect x="50" y="365" width="410" height="48" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="65" y="385" font-size="11" font-weight="bold" fill="#c0392b">Жорсткий контакт без амортизатора:</text>
  <text x="65" y="402" font-size="10" fill="#1a1a1a">Концентрація напружень на конусі призводить до сколювання граней</text>

  <!-- PANEL 2: Right (Disk Socket & Glue Mounting) -->
  <rect x="500" y="85" width="430" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="520" y="115" font-size="14" font-weight="bold" fill="#1a1a1a">2. Посадка диска в клейове гніздо</text>

  <!-- Housing with pocket -->
  <path d="M525,180 L905,180 L905,275 L525,275 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="715" y="265" font-size="11" fill="#2457d6" font-weight="bold" text-anchor="middle">Корпус приладу</text>

  <!-- Disk Magnet -->
  <path d="M600,160 L830,160 L830,215 L600,215 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="715" y="192" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Дисковий магніт</text>

  <!-- Drain Relief Grooves -->
  <path d="M640,215 L670,215 L670,230 L640,230 Z" fill="#27ae60"/>
  <path d="M760,215 L790,215 L790,230 L760,230 Z" fill="#27ae60"/>
  <text x="715" y="228" font-size="10" fill="#27ae60" font-weight="bold" text-anchor="middle">Канавки для клею</text>

  <!-- Dimension line above magnet -->
  <line x1="590" y1="145" x2="840" y2="145" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="715" y="138" font-size="11" fill="#6b7280" text-anchor="middle">Посадковий зазор: Delta = 0.1–0.15 мм</text>

  <!-- Explanatory Callouts Panel 2 -->
  <rect x="520" y="305" width="390" height="48" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="535" y="325" font-size="11" font-weight="bold" fill="#27ae60">Дренажні канали (relief channels):</text>
  <text x="535" y="342" font-size="10" fill="#1a1a1a">Забезпечують вихід надлишку клею та запобігають гідроклину</text>

  <rect x="520" y="365" width="390" height="48" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="535" y="385" font-size="11" font-weight="bold" fill="#c0392b">Глухий монтаж без канавок:</text>
  <text x="535" y="402" font-size="10" fill="#1a1a1a">Повітряна подушка виштовхує магніт над монтажною площиною</text>
</svg>
