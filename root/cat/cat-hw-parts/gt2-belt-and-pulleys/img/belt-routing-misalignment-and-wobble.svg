<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Трасування пасової петлі та вирівнювання ідлерів</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Орієнтація зубчастої сторони відносно ролика та паралельність гілок для запобігання похибкам ходу</text>

  <!-- Панель 1: Ліворуч (x=30..470) -->
  <rect x="30" y="80" width="440" height="350" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="250" y="108" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Взаємодія сторони паса з роликом</text>

  <!-- Підпанель "Правильно" (зелена) -->
  <rect x="50" y="125" width="200" height="285" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="150" y="148" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Правильно</text>

  <!-- Ілюстрація правильного контакту: Зубчастий шків + зуб -->
  <g transform="translate(90, 195)">
    <!-- Зубчастий шків (сектор) -->
    <circle cx="0" cy="0" r="35" fill="none" stroke="#1a1a1a" stroke-width="3" stroke-dasharray="6,4"/>
    <path d="M-35,0 A35,35 0 0,1 35,0 Z" fill="#d0d7de"/>
    <text x="0" y="6" font-size="11" fill="#1a1a1a" text-anchor="middle">Шків</text>
  </g>
  <g transform="translate(180, 195)">
    <!-- Пас із зубами -->
    <path d="M-30,-10 L30,-10 L30,10 L-30,10 Z" fill="#2457d6"/>
    <!-- Зуби паса вниз -->
    <path d="M-20,10 L-15,18 L-10,10 M-5,10 L0,18 L5,10 M10,10 L15,18 L20,10" fill="none" stroke="#2457d6" stroke-width="2"/>
    <text x="0" y="2" font-size="10" fill="white" text-anchor="middle">Зубці</text>
  </g>
  <text x="150" y="260" font-size="12" fill="#1a1a1a" text-anchor="middle">Зубці паса — у зубці шківа</text>

  <!-- Ілюстрація гладкого ролика зі спинкою -->
  <g transform="translate(90, 335)">
    <circle cx="0" cy="0" r="25" fill="#d0d7de" stroke="#1a1a1a" stroke-width="2"/>
    <text x="0" y="4" font-size="11" fill="#1a1a1a" text-anchor="middle">Ідлер</text>
  </g>
  <g transform="translate(180, 335)">
    <path d="M-30,-8 L30,-8 L30,8 L-30,8 Z" fill="#2457d6"/>
    <text x="0" y="3" font-size="10" fill="white" text-anchor="middle">Спинка</text>
  </g>
  <text x="150" y="385" font-size="12" fill="#1a1a1a" text-anchor="middle">Гладка спинка — на ідлер</text>

  <!-- Підпанель "Помилка" (червона) -->
  <rect x="260" y="125" width="190" height="285" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="355" y="148" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Помилка</text>

  <!-- Ілюстрація помилки: Зубці на гладкому ідлері -->
  <g transform="translate(355, 220)">
    <circle cx="0" cy="0" r="28" fill="#d0d7de" stroke="#c0392b" stroke-width="2"/>
    <text x="0" y="4" font-size="11" fill="#1a1a1a" text-anchor="middle">Гладкий</text>
  </g>
  <g transform="translate(355, 305)">
    <path d="M-25,-10 L25,-10 L25,10 L-25,10 Z" fill="#2457d6"/>
    <!-- Зуби до ролика -->
    <path d="M-15,-10 L-10,-18 L-5,-10 M0,-10 L5,-18 L10,-10" fill="none" stroke="#c0392b" stroke-width="2"/>
  </g>
  <text x="355" y="360" font-size="12" fill="#c0392b" text-anchor="middle">Зубці на гладкому роликi</text>
  <text x="355" y="380" font-size="11" fill="#6b7280" text-anchor="middle">Вібрація, полігональний ефект</text>


  <!-- Панель 2: Праворуч (x=490..930) -->
  <rect x="490" y="80" width="440" height="350" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="710" y="108" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Паралельність гілок паса</text>

  <!-- Підпанель "Паралельні гілки" (зелена) -->
  <rect x="510" y="125" width="200" height="285" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="610" y="148" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Паралельні гілки</text>

  <g transform="translate(530, 200)">
    <line x1="0" y1="0" x2="160" y2="0" stroke="#2457d6" stroke-width="4"/>
    <line x1="0" y1="50" x2="160" y2="50" stroke="#2457d6" stroke-width="4"/>
    <line x1="80" y1="0" x2="80" y2="50" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="80" y="28" font-size="11" fill="#27ae60" text-anchor="middle">const L, N</text>
  </g>
  <text x="610" y="310" font-size="12" fill="#1a1a1a" text-anchor="middle">Постійна довжина та</text>
  <text x="610" y="330" font-size="12" fill="#1a1a1a" text-anchor="middle">сталий натяг гілок</text>
  <text x="610" y="375" font-size="11" fill="#27ae60" text-anchor="middle">Точне позиціонування</text>

  <!-- Підпанель "Непаралельні гілки" (червона) -->
  <rect x="720" y="125" width="190" height="285" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="815" y="148" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Непаралельні гілки</text>

  <g transform="translate(740, 200)">
    <!-- Перекіс під кутом theta -->
    <line x1="0" y1="15" x2="150" y2="0" stroke="#2457d6" stroke-width="4"/>
    <line x1="0" y1="50" x2="150" y2="50" stroke="#2457d6" stroke-width="4"/>
    <path d="M30,12 A20,20 0 0,0 35,48" fill="none" stroke="#c0392b" stroke-width="1.5"/>
    <text x="48" y="32" font-size="12" fill="#c0392b">θ</text>
  </g>
  <text x="815" y="310" font-size="12" fill="#1a1a1a" text-anchor="middle">Довжина ~ cos(θ)</text>
  <text x="815" y="330" font-size="12" fill="#c0392b" text-anchor="middle">Циклічна зміна натягу</text>
  <text x="815" y="375" font-size="11" fill="#c0392b" text-anchor="middle">Похибки ходу та знос</text>

</svg>
