<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Маркери стрілок -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Характерні види зносу та дефекти зачеплення паса GT2</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Абразивне стирання нейлону, руйнування корду та вплив перекосу осей на кінематичний люфт</text>

  <!-- Три колонки / панелі -->
  <!-- 1) Стирання нейлонової тканини (x: 30..315) -->
  <rect x="30" y="80" width="285" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="45" y="95" width="255" height="40" rx="6" fill="#eaf0fd"/>
  <text x="172" y="120" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Стирання нейлону (Fabric wear)</text>

  <!-- Ілюстрація 1: Шків та профіль зуба з оголеною гумою -->
  <g transform="translate(0,0)">
    <!-- Шків зубчастий -->
    <circle cx="172" cy="205" r="45" fill="none" stroke="#6b7280" stroke-width="3" stroke-dasharray="4,4"/>
    <path d="M 140,175 L 204,175 L 172,210 Z" fill="#d0d7de"/>
    <!-- Зуб паса з червоним акцентом зносу -->
    <path d="M 120,240 Q 172,230 224,240 L 210,270 L 134,270 Z" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <rect x="145" y="245" width="54" height="12" rx="3" fill="#c0392b"/>
    <text x="172" y="253" font-size="11" fill="white" font-weight="bold" text-anchor="middle">Оголене осердя</text>
  </g>

  <!-- Текстовий опис панелі 1 -->
  <text x="45" y="295" font-size="12" fill="#1a1a1a">• Контакт зуба зі шківом під</text>
  <text x="45" y="313" font-size="12" fill="#1a1a1a">надмірним натягу або заклинюванні.</text>
  <text x="45" y="337" font-size="12" fill="#c0392b" font-weight="bold">• Стирання нейлону до гуми.</text>
  <text x="45" y="365" font-size="12" fill="#1a1a1a">Наслідок:</text>
  <text x="45" y="383" font-size="12" fill="#6b7280">Зміна геометрії зуба, виникнення</text>
  <text x="45" y="401" font-size="12" fill="#6b7280">мертвого ходу (backlash) при реверсі.</text>


  <!-- 2) Втомне руйнування корду (x: 335..620) -->
  <rect x="335" y="80" width="285" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="350" y="95" width="255" height="40" rx="6" fill="#fdecea"/>
  <text x="477" y="120" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">Руйнування корду (Cord fatigue)</text>

  <!-- Ілюстрація 2: Малий ролик та розшарування корду -->
  <g transform="translate(0,0)">
    <!-- Малий ідлер -->
    <circle cx="477" cy="195" r="22" fill="#d0d7de" stroke="#6b7280" stroke-width="2"/>
    <circle cx="477" cy="195" r="8" fill="white"/>
    <!-- Ремінь із розшаруванням -->
    <path d="M 380,230 C 420,230 460,225 500,240 C 530,250 560,260 590,250" fill="none" stroke="#1a1a1a" stroke-width="16" stroke-linecap="round"/>
    <!-- Нитки корду з мікротріщинами (червоні акценти) -->
    <line x1="420" y1="228" x2="450" y2="228" stroke="#c0392b" stroke-width="3"/>
    <line x1="465" y1="233" x2="495" y2="238" stroke="#c0392b" stroke-width="3"/>
    <text x="515" y="200" font-size="11" fill="#c0392b" font-weight="bold">R &lt; 15 мм</text>
    <path d="M 485,210 L 505,222" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>
  </g>

  <!-- Текстовий опис панелі 2 -->
  <text x="350" y="295" font-size="12" fill="#1a1a1a">• Перегин паса на роликах занадто</text>
  <text x="350" y="313" font-size="12" fill="#1a1a1a">малого радіуса (&lt; 15 мм) чи удари.</text>
  <text x="350" y="337" font-size="12" fill="#c0392b" font-weight="bold">• Мікротріщини корду, розтяг.</text>
  <text x="350" y="365" font-size="12" fill="#1a1a1a">Наслідок:</text>
  <text x="350" y="383" font-size="12" fill="#6b7280">Прогресуюча втрата жорсткості</text>
  <text x="350" y="401" font-size="12" fill="#6b7280">осів та пропуск кроків двигуна.</text>


  <!-- 3) Непаралельність осей (x: 640..925) -->
  <rect x="640" y="80" width="285" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="655" y="95" width="255" height="40" rx="6" fill="#eaf0fd"/>
  <text x="782" y="120" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Перекіс осей (Misalignment)</text>

  <!-- Ілюстрація 3: Перекіс шківа та зрізання кромок -->
  <g transform="translate(0,0)">
    <!-- Шків під кутом -->
    <ellipse cx="782" cy="195" rx="12" ry="28" fill="#d0d7de" stroke="#1a1a1a" stroke-width="2" transform="rotate(15, 782, 195)"/>
    <line x1="782" y1="160" x2="782" y2="230" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
    <!-- Вісь перекосу альфа -->
    <path d="M 782,175 A 20,20 0 0,1 792,205" fill="none" stroke="#c0392b" stroke-width="1.5"/>
    <text x="802" y="195" font-size="11" fill="#c0392b" font-weight="bold">α</text>
    <!-- Пас із бічним зносом -->
    <path d="M 680,245 C 730,240 830,250 880,240" fill="none" stroke="#1a1a1a" stroke-width="14" stroke-linecap="round"/>
    <path d="M 755,236 L 805,244" fill="none" stroke="#c0392b" stroke-width="4"/>
  </g>

  <!-- Текстовий опис панелі 3 -->
  <text x="655" y="295" font-size="12" fill="#1a1a1a">• Кутовий або осьовий перекіс шківа</text>
  <text x="655" y="313" font-size="12" fill="#1a1a1a">відносно руху паса (кут перекосу α).</text>
  <text x="655" y="337" font-size="12" fill="#c0392b" font-weight="bold">• Набігання на буртик, зріз кромки.</text>
  <text x="655" y="365" font-size="12" fill="#1a1a1a">Наслідок:</text>
  <text x="655" y="383" font-size="12" fill="#6b7280">Нерівномірний опір, ривки та</text>
  <text x="655" y="401" font-size="12" fill="#6b7280">діагональні смуги на поверхні.</text>
</svg>
