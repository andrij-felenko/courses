<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Практичне вимірювання та налаштування натягу паса GT2</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Позиціонування мікрофона біля вільної вітки, виділення частоти f_0 та калібрування натягу контурів</text>

  <!-- Panel 1: Left (x=30..490, y=85..445) -->
  <rect x="30" y="85" width="460" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="110" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="start">Вимірювальний стенд та датчик</text>

  <!-- Portal guide beam -->
  <rect x="60" y="130" width="400" height="16" rx="4" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>
  <text x="260" y="141" font-size="11" fill="#1a1a1a" text-anchor="middle">Напрямна балка порталу</text>

  <!-- Pulleys -->
  <circle cx="100" cy="180" r="22" fill="#6b7280" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="100" cy="180" r="8" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1"/>
  <text x="100" y="214" font-size="11" fill="#6b7280" text-anchor="middle">Мотор</text>

  <circle cx="420" cy="180" r="22" fill="#6b7280" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="420" cy="180" r="8" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1"/>
  <text x="420" y="214" font-size="11" fill="#6b7280" text-anchor="middle">Ідлер</text>

  <!-- GT2 Belt branches -->
  <line x1="120" y1="173" x2="400" y2="173" stroke="#1a1a1a" stroke-width="4"/>
  <line x1="120" y1="187" x2="400" y2="187" stroke="#1a1a1a" stroke-width="4"/>
  <text x="260" y="162" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вільна вітка L = 150 мм</text>

  <!-- Smartphone / Microphone -->
  <rect x="235" y="225" width="50" height="75" rx="6" fill="#2457d6" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="241" y="233" width="38" height="52" fill="white" rx="2"/>
  <circle cx="260" cy="230" r="2" fill="white"/>
  <text x="260" y="262" font-size="10" fill="#2457d6" text-anchor="middle">Mic</text>
  <text x="260" y="315" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мікрофон (d = 5–10 мм)</text>

  <!-- Sound wave reflection / acoustic disturbance arrows -->
  <path d="M260,205 Q260,215 260,223" fill="none" stroke="#2457d6" stroke-width="2" marker-start="url(#arr-blue)"/>
  <path d="M260,200 Q280,190 260,180" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="260" y="345" font-size="12" fill="#c0392b" text-anchor="middle">Акустичне збурення: легкий щипок пальцем</text>

  <text x="260" y="375" font-size="12" fill="#6b7280" text-anchor="middle">Безконтактне вимірювання коливань повітря</text>
  <text x="260" y="395" font-size="12" fill="#6b7280" text-anchor="middle">частоти вільних коливань паса</text>


  <!-- Panel 2: Right (x=510..930, y=85..445) -->
  <rect x="510" y="85" width="420" height="360" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="530" y="110" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="start">Спектрограма та перерахунок натягу</text>

  <!-- Spectrogram Graph Box -->
  <rect x="530" y="125" width="380" height="135" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="540" y="140" font-size="11" fill="#6b7280" text-anchor="start">Ампл.</text>
  <!-- Axes -->
  <line x1="550" y1="240" x2="890" y2="240" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="550" y1="145" x2="550" y2="240" stroke="#6b7280" stroke-width="1.5"/>
  <!-- Axis labels -->
  <text x="720" y="255" font-size="11" fill="#6b7280" text-anchor="middle">Частота (Гц)</text>
  
  <!-- Frequency Curve with Peak at 110.5 Hz -->
  <path d="M550,238 Q630,238 670,235 Q710,210 720,150 Q730,210 770,236 Q830,238 890,238" fill="none" stroke="#2457d6" stroke-width="2"/>
  <!-- Peak annotation -->
  <line x1="720" y1="150" x2="720" y2="240" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <circle cx="720" cy="150" r="4" fill="#c0392b"/>
  <text x="760" y="165" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">f_0 = 110.5 Гц</text>

  <!-- Tension calculation box -->
  <rect x="530" y="272" width="380" height="42" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="720" y="298" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">T = 4 * μ * L^2 * f^2 = 14.8 Н (Оптимально)</text>

  <!-- CoreXY sync panel -->
  <rect x="530" y="324" width="380" height="106" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="550" y="346" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="start">Синхронізація контурів CoreXY:</text>
  <text x="550" y="369" font-size="12" fill="#1a1a1a" text-anchor="start">Контур A: f_A = 110 Гц (T_A = 15.0 Н)</text>
  <text x="550" y="389" font-size="12" fill="#1a1a1a" text-anchor="start">Контур B: f_B = 110 Гц (T_B = 15.0 Н)</text>
  <text x="550" y="412" font-size="11" fill="#27ae60" text-anchor="start">|f_A - f_B| &lt;= 2 Гц: гарантує відсутність перекосу каретки</text>
</svg>
