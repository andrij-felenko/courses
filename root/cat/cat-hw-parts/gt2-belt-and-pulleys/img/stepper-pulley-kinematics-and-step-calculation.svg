<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Markers -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Titles -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кінематика пасової передачі GT2 та розрахунок коефіцієнта steps_per_mm</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Зв'язок кута кроку мотора (1.8°), мікрокрокування (1/16) та кількості зубів шківа GT2 (z=20, крок 2 мм)</text>

  <!-- Left Panel: Kinematic Schema (x=30..490, y=85..430) -->
  <rect x="30" y="85" width="460" height="345" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="112" font-size="14" font-weight="bold" fill="#1a1a1a">1. Кінематична схема пасового приводу</text>

  <!-- Stepper Motor Body (NEMA 17) -->
  <rect x="45" y="145" width="75" height="70" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="82" y="175" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">NEMA 17</text>
  <text x="82" y="192" font-size="11" fill="#6b7280" text-anchor="middle">θ = 1.8°</text>

  <!-- Motor Shaft & Pulley -->
  <circle cx="155" cy="180" r="24" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <circle cx="155" cy="180" r="18" fill="none" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="155" y="176" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="middle">Pulley</text>
  <text x="155" y="188" font-size="10" fill="#2457d6" text-anchor="middle">z = 20</text>

  <!-- Pulley diameter dimension annotation -->
  <line x1="131" y1="138" x2="179" y2="138" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="155" y="130" font-size="11" fill="#6b7280" text-anchor="middle">D_pitch ≈ 12.73 мм</text>

  <!-- Belt path (Top and bottom runs) -->
  <rect x="155" y="240" width="315" height="7" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="155" y="268" width="315" height="7" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <text x="312" y="228" font-size="11" fill="#1a1a1a" text-anchor="middle">Зубчастий пас GT2 (P = 2.0 мм)</text>

  <!-- Carriage / Clamp block -->
  <!-- Carriage rect is y=230 to 290. Text inside: y=253 and y=268. Let's place carriage outside belt or adjust belt/carriage positions so no rect/line overlaps text! -->
  <rect x="330" y="295" width="60" height="35" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="360" y="312" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Каретка x(t)</text>

  <!-- Linear movement arrow -->
  <line x1="310" y1="345" x2="420" y2="345" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="365" y="362" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Лінійне переміщення</text>

  <text x="260" y="388" font-size="11" fill="#1a1a1a" text-anchor="middle">S_rev = z * P = 20 * 2.0 = 40.0 мм/оберт</text>
  <text x="260" y="408" font-size="11" fill="#6b7280" text-anchor="middle">Мікрокрок: 1/16 (3200 имп/об), delta_x = 0.0125 мм</text>

  <!-- Right Panel: Formulas & Firmware Params (x=510..930, y=85..430) -->
  <rect x="510" y="85" width="420" height="345" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="530" y="112" font-size="14" font-weight="bold" fill="#1a1a1a">2. Розрахунок формул та конфігурація</text>

  <!-- Formula Card 1 -->
  <rect x="525" y="130" width="390" height="75" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="540" y="152" font-size="12" font-weight="bold" fill="#2457d6">Коефіцієнт steps_per_mm (Marlin):</text>
  <text x="540" y="172" font-size="12" fill="#1a1a1a">steps_per_mm = (кроків_двигуна * мікрокрок) / (z * P)</text>
  <text x="540" y="192" font-size="12" fill="#6b7280">= (200 * 16) / (20 * 2.0) = 3200 / 40 = 80.0 кроків/мм</text>

  <!-- Formula Card 2 -->
  <rect x="525" y="215" width="390" height="60" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="540" y="237" font-size="12" font-weight="bold" fill="#2457d6">Параметр rotation_distance (Klipper):</text>
  <text x="540" y="258" font-size="12" fill="#1a1a1a">rotation_distance = z * P = 20 * 2.0 = 40.0 мм</text>

  <!-- G-code Config Card -->
  <rect x="525" y="285" width="390" height="85" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="540" y="307" font-size="12" font-weight="bold" fill="#1a1a1a">Конфігурація G-code та точність:</text>
  <text x="540" y="327" font-size="12" fill="#27ae60">M92 X80.00 Y80.00  →  M500 (збереження в EEPROM)</text>
  <text x="540" y="347" font-size="11" fill="#6b7280">Дискретність переміщення: delta_x = 1 / 80.0 = 0.0125 мм (12.5 мкм)</text>

  <!-- Summary Note -->
  <rect x="525" y="380" width="390" height="36" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="720" y="403" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Висновок: збільшення z підвищує швидкість, але знижує тягу</text>
</svg>
