<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  
  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Епюра натягу та розподіл навантаження в підвісному кабелі</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">100% гравітаційного зусилля сприймає сталевий трос за нульового напруження мідних провідників</text>
  
  <!-- Left Panel: F_tension vs H -->
  <rect x="30" y="80" width="440" height="345" fill="#f4f6f8" rx="8" stroke="#d0d7de" stroke-width="1"/>
  <text x="250" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Епюра натягу вздовж висоти підвісу</text>
  
  <!-- Axis for Left Panel -->
  <line x1="80" y1="380" x2="420" y2="380" stroke="#d0d7de" stroke-width="2"/>
  <line x1="80" y1="130" x2="80" y2="380" stroke="#d0d7de" stroke-width="2"/>
  <text x="80" y="398" font-size="11" fill="#6b7280" text-anchor="middle">0</text>
  <text x="420" y="398" font-size="11" fill="#6b7280" text-anchor="middle">F_max</text>
  <text x="60" y="135" font-size="11" fill="#6b7280" text-anchor="middle">H (Верх)</text>
  <text x="60" y="380" font-size="11" fill="#6b7280" text-anchor="middle">0 (Низ)</text>
  
  <!-- Tension polygon (Steel core) -->
  <polygon points="80,380 380,140 80,140" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <line x1="80" y1="140" x2="380" y2="140" stroke="#2457d6" stroke-width="2" stroke-dasharray="4,4"/>
  
  <!-- Labels inside left panel -->
  <text x="210" y="270" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Сталевий трос: 100% навантаження</text>
  <text x="230" y="300" font-size="11" fill="#1a1a1a" text-anchor="start">F_max = (M + m*H)*(g + a)</text>
  <text x="230" y="320" font-size="11" fill="#1a1a1a" text-anchor="start">F_min = M * (g + a)</text>
  
  <!-- Copper wire sigma box -->
  <rect x="90" y="335" width="220" height="35" fill="#e9f7ef" rx="4" stroke="#27ae60" stroke-width="1"/>
  <text x="200" y="357" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Мідні жили: σ = 0 МПа (S-петля)</text>

  <!-- Right Panel: Geometry & Anchoring -->
  <rect x="490" y="80" width="440" height="345" fill="#f4f6f8" rx="8" stroke="#d0d7de" stroke-width="1"/>
  <text x="710" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Геометрія вигину та анкерні точки</text>
  
  <!-- Anchor schematic representation -->
  <rect x="670" y="125" width="80" height="20" fill="#d0d7de" rx="3"/>
  <text x="710" y="139" font-size="10" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Кран-балка</text>
  
  <line x1="710" y1="145" x2="710" y2="240" stroke="#1a1a1a" stroke-width="4"/>
  <line x1="706" y1="145" x2="714" y2="145" stroke="#2457d6" stroke-width="3"/>
  <text x="755" y="195" font-size="11" fill="#1a1a1a" text-anchor="start">Коуш + затискач</text>
  
  <!-- Bending radius calls -->
  <rect x="510" y="255" width="190" height="50" fill="#eaf0fd" rx="4" stroke="#2457d6" stroke-width="1"/>
  <text x="605" y="275" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">R_stat ≥ 10 × D_cable</text>
  <text x="605" y="293" font-size="10" fill="#6b7280" text-anchor="middle">Статичний радіус вигину</text>
  
  <rect x="510" y="315" width="190" height="50" fill="#fdecea" rx="4" stroke="#c0392b" stroke-width="1"/>
  <text x="605" y="335" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">R_dyn ≥ 20 × D_cable</text>
  <text x="605" y="353" font-size="10" fill="#6b7280" text-anchor="middle">Динамічний радіус під гойдання</text>
  
  <!-- Service loop / warning -->
  <rect x="715" y="255" width="195" height="110" fill="#e9f7ef" rx="4" stroke="#27ae60" stroke-width="1"/>
  <text x="812" y="275" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Компенсаційна петля</text>
  <text x="812" y="295" font-size="10" fill="#1a1a1a" text-anchor="middle">(Service Loop біля пульта)</text>
  <text x="812" y="315" font-size="10" fill="#27ae60" text-anchor="middle">• Захист від зрізу</text>
  <text x="812" y="335" font-size="10" fill="#27ae60" text-anchor="middle">• Зняття осьових напружень</text>
  <text x="812" y="355" font-size="10" fill="#c0392b" text-anchor="middle">Увага: R &lt; R_min — розрив жил</text>

</svg>
