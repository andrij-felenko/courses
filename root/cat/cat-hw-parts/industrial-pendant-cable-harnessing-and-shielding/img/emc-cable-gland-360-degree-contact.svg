<svg viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="#ffffff"/>

  <!-- Markers & Patterns -->
  <defs>
    <!-- Arrow Red (Noise / Bottleneck Current) -->
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <!-- Arrow Green (Low-Inductance 360° Current Path) -->
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <!-- Braid Pattern for Shield Layer -->
    <pattern id="braid" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0,4 L4,0 L8,4 L4,8 Z" fill="none" stroke="#94a3b8" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">360-градусний заземлювальний контакт EMC-кабельного вводу</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Круговий притиск екрана забезпечує мінімальну індуктивність і шунтує завади на корпус</text>

  <!-- ==================== LEFT PANEL: PIGTAIL PROBLEM ==================== -->
  <rect x="30" y="80" width="435" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  
  <!-- Left Header Badge -->
  <rect x="45" y="95" width="405" height="32" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="247" y="116" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">❌ Традиційний вивід («Pigtail» / скрутка)</text>

  <!-- Left Card 1: Pigtail Info -->
  <rect x="45" y="140" width="225" height="64" rx="4" fill="#ffffff" stroke="#f5c6cb" stroke-width="1"/>
  <text x="55" y="158" font-size="12" font-weight="bold" fill="#c0392b">Скручена коса («Pigtail»)</text>
  <text x="55" y="176" font-size="12" fill="#1a1a1a">Висока індуктивність L</text>
  <text x="55" y="194" font-size="12" fill="#6b7280">Великий опір Z = ω·L для ВЧ</text>

  <!-- Left Panel Drawing (Pigtail setup) -->
  <!-- Cabinet Enclosure Wall -->
  <rect x="340" y="215" width="14" height="50" fill="#64748b" stroke="#334155" stroke-width="1"/>
  <rect x="340" y="315" width="14" height="50" fill="#64748b" stroke="#334155" stroke-width="1"/>
  <!-- Hole / Grommet -->
  <rect x="336" y="265" width="22" height="50" fill="#334155" rx="2"/>

  <!-- Cable Outer Sheath -->
  <rect x="55" y="275" width="110" height="30" rx="3" fill="#334155" stroke="#1e293b"/>
  <text x="110" y="260" font-size="12" fill="#6b7280" text-anchor="middle">Кабель пульта</text>

  <!-- Braid Exposure -->
  <rect x="165" y="278" width="30" height="24" fill="url(#braid)" stroke="#64748b" stroke-width="0.5"/>

  <!-- Pigtail Wire going up to screw -->
  <path d="M 180 278 C 180 240, 260 235, 340 235" fill="none" stroke="#78716c" stroke-width="4" stroke-linecap="round"/>
  <path d="M 180 278 C 180 240, 260 235, 340 235" fill="none" stroke="#d6d3d1" stroke-width="2" stroke-dasharray="3,2" stroke-linecap="round"/>

  <!-- Grounding Screw on Wall -->
  <circle cx="340" cy="235" r="7" fill="#475569" stroke="#1e293b" stroke-width="1"/>
  <circle cx="340" cy="235" r="3" fill="#94a3b8"/>
  <text x="360" y="232" font-size="12" font-weight="bold" fill="#1a1a1a">Гвинт PE</text>

  <!-- Grounding symbol near screw -->
  <path d="M 325 235 L 310 235 M 315 229 L 315 241 M 312 231 L 312 239 M 309 233 L 309 237" fill="none" stroke="#1a1a1a" stroke-width="1.2"/>

  <!-- HF Current Arrows bottlenecking up pigtail -->
  <path d="M 195 265 L 215 252" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <path d="M 255 242 L 285 238" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="190" y="215" font-size="12" font-weight="bold" fill="#c0392b">I_ВЧ (звуження екрана)</text>

  <!-- Inner Signal Wires extending right into cabinet -->
  <path d="M 195 282 L 440 282" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <path d="M 195 290 L 440 290" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <path d="M 195 298 L 440 298" fill="none" stroke="#16a34a" stroke-width="2.5"/>

  <!-- EM Noise Radiation Arcs (Red Waves) -->
  <path d="M 230 255 A 20 20 0 0 1 250 275" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,2"/>
  <path d="M 240 245 A 35 35 0 0 1 275 280" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,2"/>
  <path d="M 250 235 A 50 50 0 0 1 300 285" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Noise Interference Overlay on Wires inside cabinet -->
  <path d="M 365 274 Q 375 270, 385 274 T 405 274 T 425 274" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="400" y="254" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">V_завади</text>
  <text x="400" y="268" font-size="12" fill="#c0392b" text-anchor="middle">(наведення)</text>

  <text x="347" y="372" font-size="12" fill="#6b7280" text-anchor="middle">Стінка пульта</text>

  <!-- Left Card 2: Problem Summary -->
  <rect x="45" y="380" width="405" height="60" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="55" y="398" font-size="12" font-weight="bold" fill="#c0392b">⚠️ Паразитне випромінювання завад</text>
  <text x="55" y="414" font-size="12" fill="#1a1a1a">Скрутка працює як антена: наводить ВЧ-струм</text>
  <text x="55" y="430" font-size="12" fill="#1a1a1a">на незахищені сигнальні жили всередині</text>

  <!-- ==================== RIGHT PANEL: 360° EMC GLAND SOLUTION ==================== -->
  <rect x="495" y="80" width="435" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  
  <!-- Right Header Badge -->
  <rect x="510" y="95" width="405" height="32" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712" y="116" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">✓ 360° EMC-затиск (низькоіндуктивний контакт)</text>

  <!-- Right Card 1: Spring Contact Info -->
  <rect x="510" y="140" width="200" height="62" rx="4" fill="#ffffff" stroke="#c3e6cb" stroke-width="1"/>
  <text x="520" y="156" font-size="12" font-weight="bold" fill="#27ae60">Пружинна цанга 360°</text>
  <text x="520" y="174" font-size="12" fill="#1a1a1a">Суцільний притиск екрана</text>
  <text x="520" y="192" font-size="12" fill="#6b7280">Мінімальний опір Z ≈ 0 Ом</text>

  <!-- Right Card 2: Locknut Info -->
  <rect x="720" y="140" width="195" height="62" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="730" y="156" font-size="12" font-weight="bold" fill="#1a1a1a">Гайка з зубцями</text>
  <text x="730" y="174" font-size="12" fill="#6b7280">Прорізає фарбу/окис</text>
  <text x="730" y="192" font-size="12" fill="#1a1a1a">Контакт 360° із шафою</text>

  <!-- Right Panel Drawing (360° EMC Gland Cross-Section) -->
  <!-- Wall Section -->
  <rect x="780" y="215" width="14" height="48" fill="#64748b" stroke="#334155" stroke-width="1"/>
  <rect x="780" y="315" width="14" height="48" fill="#64748b" stroke="#334155" stroke-width="1"/>

  <!-- EMC Gland Metallic Body (Upper half) -->
  <path d="M 590 265 L 620 255 L 620 265 L 765 265 L 765 248 L 780 248 L 780 265 L 808 265 L 808 273 L 590 273 Z" fill="#cbd5e1" stroke="#334155" stroke-width="1"/>
  <!-- EMC Gland Metallic Body (Lower half) -->
  <path d="M 590 315 L 620 325 L 620 315 L 765 315 L 765 332 L 780 332 L 780 315 L 808 315 L 808 307 L 590 307 Z" fill="#cbd5e1" stroke="#334155" stroke-width="1"/>

  <!-- Locknut with Contact Teeth (Inner wall side x=780..796) -->
  <path d="M 780 248 L 796 248 L 796 265 L 780 265 Z" fill="#94a3b8" stroke="#334155" stroke-width="1"/>
  <path d="M 780 332 L 796 332 L 796 315 L 780 315 Z" fill="#94a3b8" stroke="#334155" stroke-width="1"/>
  <!-- Teeth biting wall -->
  <polygon points="780,251 777,254 780,257" fill="#334155"/>
  <polygon points="780,323 777,326 780,329" fill="#334155"/>

  <!-- Cable Outer Sheath entering gland -->
  <rect x="520" y="275" width="120" height="30" rx="3" fill="#334155" stroke="#1e293b"/>
  <text x="580" y="260" font-size="12" fill="#6b7280" text-anchor="middle">EMC-сальник</text>

  <!-- Exposed Braided Shield under 360° Ring -->
  <rect x="640" y="278" width="70" height="24" fill="url(#braid)" stroke="#64748b" stroke-width="0.5"/>

  <!-- 360° Spring / Iris Contact Ring (Pressing on braid top and bottom) -->
  <rect x="665" y="267" width="20" height="11" rx="2" fill="#d97706" stroke="#b45309" stroke-width="1"/>
  <rect x="665" y="302" width="20" height="11" rx="2" fill="#d97706" stroke="#b45309" stroke-width="1"/>
  <circle cx="675" cy="272.5" r="3" fill="#fef08a"/>
  <circle cx="675" cy="307.5" r="3" fill="#fef08a"/>

  <!-- Green HF Current Flow Arrows (Symmetrical 360° low inductance path) -->
  <!-- Top flow: along shield -> up into ring -> gland body -> wall -->
  <path d="M 625 273.5 L 660 273.5" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <path d="M 675 272 L 675 257 L 760 257 L 775 257" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <!-- Bottom flow: along shield -> down into ring -> gland body -> wall -->
  <path d="M 625 306.5 L 660 306.5" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <path d="M 675 308 L 675 323 L 760 323 L 775 323" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Inner Clean Signal Wires continuing straight right -->
  <path d="M 710 282 L 905 282" fill="none" stroke="#dc2626" stroke-width="2.5"/>
  <path d="M 710 290 L 905 290" fill="none" stroke="#2563eb" stroke-width="2.5"/>
  <path d="M 710 298 L 905 298" fill="none" stroke="#16a34a" stroke-width="2.5"/>

  <text x="787" y="372" font-size="12" fill="#6b7280" text-anchor="middle">Стінка пульта</text>

  <!-- Right Card 3: Solution Summary -->
  <rect x="510" y="380" width="405" height="60" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="520" y="398" font-size="12" font-weight="bold" fill="#27ae60">🛡️ Суцільне екранування (без розриву)</text>
  <text x="520" y="414" font-size="12" fill="#1a1a1a">Струми ВЧ рівномірно шунтуються на корпус</text>
  <text x="520" y="430" font-size="12" fill="#1a1a1a">Сигнальні кола всередині повністю захищені</text>

  <!-- ==================== BOTTOM SUMMARY BAR ==================== -->
  <rect x="30" y="465" width="900" height="42" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="491" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Висновок: 360° EMC-ввід створює малоіндуктивний шлях заземлення екрана без ефекту pigtail</text>
</svg>
