<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="480" fill="#ffffff"/>

  <!-- Header -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Вузол механічного розвантаження та компенсаційна петля кабелю</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Сталевий трос сприймає магістральне натяжне зусилля (F), захищаючи кабель від зламу</text>

  <!-- Panel A: Assembly Diagram -->
  <rect x="30" y="85" width="530" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="45" y="112" font-size="14" font-weight="bold" fill="#1a1a1a">Схема фіксації троса та компенсаційної петлі</text>

  <!-- Top Support Bracket -->
  <rect x="110" y="125" width="100" height="20" rx="3" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="160" y="139" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a1a1a">Верхній анкер</text>
  <text x="330" y="139" text-anchor="middle" font-size="11" fill="#6b7280">Трос та кабель від шафи керування</text>

  <!-- Steel Tension Wire -->
  <line x1="160" y1="145" x2="160" y2="290" stroke="#4a5568" stroke-width="4"/>
  <circle cx="160" cy="145" r="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="160" cy="290" r="5" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Tension Force Arrow on Wire -->
  <line x1="160" y1="170" x2="160" y2="230" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr-red)"/>
  <rect x="45" y="175" width="100" height="38" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="95" y="191" text-anchor="middle" font-size="11" font-weight="bold" fill="#c0392b">Сила F</text>
  <text x="95" y="205" text-anchor="middle" font-size="11" fill="#c0392b">100% натягу</text>

  <!-- Electrical Flexible Cable (Loop) -->
  <path d="M 160,145 C 160,250 210,275 270,275 C 330,275 380,250 380,290" fill="none" stroke="#2457d6" stroke-width="8" stroke-linecap="round"/>
  <path d="M 160,145 C 160,250 210,275 270,275 C 330,275 380,250 380,290" fill="none" stroke="#eaf0fd" stroke-width="2" stroke-dasharray="6,4" stroke-linecap="round"/>

  <!-- Bending Radius Indication -->
  <path d="M 215,245 A 60,60 0 0,0 325,245" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="270" y1="210" x2="270" y2="270" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>
  <rect x="225" y="175" width="90" height="26" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="270" y="192" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">R ≥ R_min</text>

  <!-- Unloaded Cable Badge -->
  <rect x="400" y="200" width="150" height="42" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="408" y="217" font-size="11" font-weight="bold" fill="#27ae60">Розвантажений кабель</text>
  <text x="408" y="233" font-size="11" fill="#27ae60">F_кабелю = 0 (без натягу)</text>
  <line x1="400" y1="221" x2="382" y2="226" stroke="#27ae60" stroke-width="1.2" stroke-dasharray="3,2" marker-end="url(#arr-green)"/>

  <!-- Wire Anchor Clamp Callout -->
  <text x="45" y="272" font-size="11" font-weight="bold" fill="#1a1a1a">Затискач троса</text>
  <text x="45" y="286" font-size="11" fill="#6b7280">(фіксує трос)</text>
  <line x1="122" y1="280" x2="138" y2="295" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr-black)"/>

  <!-- EMC Cable Gland Callout -->
  <text x="420" y="272" font-size="11" font-weight="bold" fill="#1a1a1a">EMC-кабельний ввод</text>
  <text x="420" y="286" font-size="11" fill="#6b7280">(герметизація 360°)</text>
  <line x1="415" y1="280" x2="398" y2="293" stroke="#1a1a1a" stroke-width="1.2" marker-end="url(#arr-black)"/>

  <!-- Anchor Block & Cable Gland Hardware -->
  <rect x="140" y="290" width="40" height="25" rx="3" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="360" y="290" width="40" height="25" rx="3" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="365" y1="298" x2="395" y2="298" stroke="#2457d6" stroke-width="1"/>
  <line x1="365" y1="307" x2="395" y2="307" stroke="#2457d6" stroke-width="1"/>

  <!-- Pendant Enclosure Main Body -->
  <rect x="110" y="315" width="340" height="130" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  
  <!-- Internal Structural Supports & Terminals -->
  <rect x="134" y="315" width="52" height="40" rx="3" fill="#9ca3af" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="160" y="339" text-anchor="middle" font-size="11" font-weight="bold" fill="#ffffff">Стійка</text>

  <path d="M 380,315 L 380,360" fill="none" stroke="#2457d6" stroke-width="4" stroke-dasharray="4,3"/>
  <rect x="345" y="360" width="70" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="380" y="381" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">Клеми</text>

  <text x="280" y="412" text-anchor="middle" font-size="13" font-weight="bold" fill="#2457d6">Корпус пульта оператора</text>
  <text x="280" y="430" text-anchor="middle" font-size="11" fill="#6b7280">Механічно розвантажена зона клем</text>

  <!-- Panel B: Rules and Guidelines -->
  <rect x="580" y="85" width="350" height="375" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="595" y="112" font-size="14" font-weight="bold" fill="#1a1a1a">Правила монтажу та розрахунку</text>

  <!-- Card 1: Length Ratio -->
  <rect x="595" y="125" width="320" height="95" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="610" y="145" font-size="12" font-weight="bold" fill="#27ae60">1. Довжина троса (L_троса &lt; L_петлі)</text>
  <text x="610" y="165" font-size="11" fill="#1a1a1a">• Трос коротший за електричний кабель.</text>
  <text x="610" y="183" font-size="11" fill="#1a1a1a">• Усі ривки та вага пульта передаються</text>
  <text x="610" y="201" font-size="11" fill="#1a1a1a">  виключно на сталевий корд / трос.</text>

  <!-- Card 2: Bending Radius -->
  <rect x="595" y="232" width="320" height="95" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2"/>
  <text x="610" y="252" font-size="12" font-weight="bold" fill="#2457d6">2. Мінімальний радіус вигину (R_min)</text>
  <text x="610" y="272" font-size="11" fill="#1a1a1a">• R_min ≈ (10 ... 12) × d_кабелю.</text>
  <text x="610" y="290" font-size="11" fill="#1a1a1a">• Запобігає мікротріщинам у мідних жилах</text>
  <text x="610" y="308" font-size="11" fill="#1a1a1a">  та розриву екранувального сплетіння.</text>

  <!-- Card 3: Critical Errors -->
  <rect x="595" y="339" width="320" height="112" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="610" y="359" font-size="12" font-weight="bold" fill="#c0392b">3. Критичні помилки монтажу</text>
  <text x="610" y="379" font-size="11" fill="#1a1a1a">• Фіксація кабелю без компенсаційної петлі.</text>
  <text x="610" y="397" font-size="11" fill="#1a1a1a">• Натяг вириває клеми та руйнує EMC-ввод.</text>
  <text x="610" y="415" font-size="11" fill="#1a1a1a">• Закріплення троса за електричні жили.</text>
  <text x="610" y="433" font-size="11" fill="#1a1a1a">• Радіус R &lt; R_min викликає втому металу.</text>
</svg>
