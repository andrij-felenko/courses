<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Модель передавального імпедансу екрана (Transfer Impedance Z_t)</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Механізм проникнення струму завади крізь екран та формування поздовжньої ЕРС на сигнальній жилі</text>

  <!-- Left Panel: Physical Model (x=30..470, y=85..430) -->
  <rect x="30" y="85" width="440" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="250" y="110" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Фізична модель та структура екрана</text>

  <!-- Cable Cutaway Schematic inside Left Panel -->
  <!-- Outer shield current -->
  <path d="M 60 160 L 440 160" stroke="#c0392b" stroke-width="6" fill="none" marker-end="url(#arr-red)"/>
  <text x="250" y="145" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Зовнішній поверхневий струм завади I_shield (скін-ефект)</text>

  <!-- Cable layers representation -->
  <!-- Outer jacket / shield layer box -->
  <rect x="60" y="175" width="380" height="125" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  
  <text x="250" y="195" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Екран: Фольга + Оплітка (K_opt, товщина d)</text>

  <!-- Diffusion & aperture penetration arrows -->
  <path d="M 120 235 L 170 235" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <path d="M 220 235 L 270 235" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <path d="M 320 235 L 370 235" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="250" y="265" font-size="11" fill="#6b7280" text-anchor="middle">Дифузія поля (товщина d) та магнітний зв'язок крізь пори (M_12)</text>

  <!-- Inner dielectric & signal core -->
  <rect x="60" y="315" width="380" height="75" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <line x1="60" y1="352" x2="440" y2="352" stroke="#27ae60" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="250" y="333" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Внутрішня сигнальна жила</text>
  <text x="250" y="375" font-size="11" fill="#27ae60" font-weight="bold" text-anchor="middle">Наведена ЕРС: dV_inner / dz = Z_t * I_shield</text>


  <!-- Right Panel: Equivalent Circuit & Frequency Response (x=490..930, y=85..430) -->
  <rect x="490" y="85" width="440" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="710" y="110" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Формула та частотна залежність Z_t(f)</text>

  <!-- Formula box -->
  <rect x="510" y="125" width="400" height="42" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="710" y="151" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Z_t = R_diff(f) + j * omega * M_12</text>

  <!-- Frequency response plot area -->
  <rect x="510" y="180" width="400" height="175" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  
  <!-- Axes -->
  <line x1="540" y1="325" x2="880" y2="325" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <line x1="540" y1="325" x2="540" y2="200" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  
  <text x="885" y="340" font-size="11" fill="#1a1a1a" text-anchor="end">log f</text>
  <text x="530" y="205" font-size="11" fill="#1a1a1a" text-anchor="end">log Z_t</text>

  <!-- Z_t curve components -->
  <!-- R_dc / diffusion drop -->
  <path d="M 540 230 Q 640 280 710 305" stroke="#2457d6" stroke-width="2.5" fill="none"/>
  <!-- Inductive coupling rise (j*omega*M_12) -->
  <path d="M 710 305 Q 790 305 870 235" stroke="#c0392b" stroke-width="2.5" fill="none"/>

  <!-- Annotations on plot (placed well above/away from curves) -->
  <text x="610" y="225" font-size="11" fill="#2457d6" text-anchor="middle">R_dc (активний опір)</text>
  <text x="800" y="225" font-size="11" fill="#c0392b" text-anchor="middle">j*omega*M_12 (пори)</text>

  <!-- Highlights / Key takeaway boxes at bottom of right panel -->
  <rect x="510" y="365" width="400" height="50" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="710" y="385" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Подвійний екран (фольга + плетіння 85%): Z_t &lt; 10 мОм/м на 10 МГц</text>
  <text x="710" y="403" font-size="11" fill="#6b7280" text-anchor="middle">Рідке плетіння (50%) має великий M_12 і високий рівень завад</text>
</svg>
