<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вузол компенсатора натягу підвісного кабелю</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Фіксація силового троса та формування компенсаційної петлі слабини провідників</text>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Панель 1: Ліворуч (x=30..470) -->
  <rect x="30" y="80" width="440" height="350" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="105" font-size="14" font-weight="bold" fill="#1a1a1a">1. Механічний вузол фіксації</text>

  <!-- Корпус / гермоввід -->
  <rect x="50" y="130" width="60" height="40" rx="4" fill="#e0e0e0" stroke="#a0a0a0" stroke-width="1"/>
  <text x="80" y="155" font-size="11" fill="#1a1a1a" text-anchor="middle">Ввід</text>

  <!-- Стінка корпусу (шасі) -->
  <path d="M 110 120 L 170 120 L 170 400 L 110 400" fill="none" stroke="#6b7280" stroke-width="3"/>
  <text x="140" y="112" font-size="12" fill="#6b7280" text-anchor="middle">Шасі</text>

  <!-- Кронштейн -->
  <rect x="220" y="180" width="25" height="110" rx="3" fill="#d0d7de" stroke="#6b7280" stroke-width="1"/>

  <!-- Трос -->
  <line x1="50" y1="150" x2="220" y2="210" stroke="#2457d6" stroke-width="4"/>

  <!-- Затискач (зміщений праворуч від кронштейна, без перетину) -->
  <rect x="221" y="220" width="22" height="25" rx="2" fill="#2457d6" opacity="0.9"/>

  <!-- Вектор натягу -->
  <line x1="10" y1="150" x2="40" y2="150" stroke="#c0392b" stroke-width="2.5" marker-end="url(#arr)"/>
  <text x="25" y="138" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">F</text>

  <!-- Пояснення довжин -->
  <rect x="260" y="130" width="195" height="120" rx="4" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1"/>
  <text x="270" y="150" font-size="12" font-weight="bold" fill="#2457d6">Співвідношення довжин:</text>
  <text x="270" y="175" font-size="12" fill="#1a1a1a">• L_rope строго коротша</text>
  <text x="270" y="198" font-size="12" fill="#1a1a1a">• Зусилля F сприймається</text>
  <text x="270" y="220" font-size="12" fill="#1a1a1a">  металевим шасі корпусу</text>

  <!-- Жили кабелю -->
  <path d="M 110 160 Q 140 280 180 320 Q 220 350 250 380" fill="none" stroke="#6b7280" stroke-width="2.5" stroke-dasharray="4,4"/>
  <text x="260" y="385" font-size="12" fill="#6b7280">Жили (L_wire)</text>


  <!-- Панель 2: Праворуч (x=490..930) -->
  <rect x="490" y="80" width="440" height="350" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="510" y="105" font-size="14" font-weight="bold" fill="#1a1a1a">2. Захист електричних кіл</text>

  <!-- S-петля -->
  <rect x="510" y="125" width="200" height="165" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="525" y="148" font-size="12" font-weight="bold" fill="#27ae60">Service loop (S-петля)</text>
  <path d="M 520 200 Q 550 160 590 200 Q 630 240 670 180" fill="none" stroke="#27ae60" stroke-width="3"/>
  <text x="525" y="235" font-size="12" fill="#1a1a1a">Повна слабина жил</text>
  <text x="525" y="257" font-size="12" fill="#1a1a1a">F_contacts = 0 Н</text>

  <!-- Колодка -->
  <rect x="720" y="125" width="195" height="165" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="735" y="148" font-size="12" font-weight="bold" fill="#1a1a1a">Контактні клеми</text>
  <rect x="735" y="162" width="165" height="25" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="745" y="179" font-size="11" fill="#27ae60">Emergency Stop / RS-485</text>
  <rect x="735" y="197" width="165" height="25" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="745" y="214" font-size="11" fill="#27ae60">Силові та сигнальні кола</text>

  <!-- Червоний блок -->
  <rect x="510" y="300" width="405" height="120" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="525" y="325" font-size="13" font-weight="bold" fill="#c0392b">Порівняння / застереження без петлі:</text>
  <text x="525" y="350" font-size="12" fill="#1a1a1a">• Динамічні ривки пульта рвуть тонкі жили контактів</text>
  <text x="525" y="375" font-size="12" fill="#1a1a1a">• Відмова ланцюгів Emergency Stop та ліній RS-485</text>
  <text x="525" y="398" font-size="12" fill="#1a1a1a">• Відсутність компенсації викликає аварію обладнання</text>
</svg>
