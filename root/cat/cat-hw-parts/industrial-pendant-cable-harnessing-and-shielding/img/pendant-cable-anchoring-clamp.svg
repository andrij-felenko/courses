<svg viewBox="0 0 960 460" width="960" height="460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  
  <text x="480" y="38" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Анкерування несучого троса підвісного кабелю пульта</text>
  <text x="480" y="60" font-size="13" text-anchor="middle" fill="#6b7280">Перерозподіл гравітаційного натягу на силовий трос та захист електричних клем від механічного напруження</text>

  <!-- Left Panel -->
  <rect x="30" y="85" width="440" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="250" y="112" font-size="15" font-weight="700" text-anchor="middle" fill="#c0392b">1. Помилковий монтаж (тільки гермоввід)</text>

  <!-- Left diagram graphics -->
  <!-- Metal structure top -->
  <rect x="180" y="130" width="140" height="20" fill="#d0d7de" rx="3"/>
  <text x="250" y="145" font-size="11" text-anchor="middle" fill="#1a1a1a">Корпус поста / шафи</text>

  <!-- Cable gland -->
  <rect x="220" y="150" width="60" height="25" fill="#6b7280" rx="3"/>
  <text x="250" y="167" font-size="11" text-anchor="middle" fill="white">M25</text>

  <!-- Cable hanging down (straight, under tension) -->
  <rect x="235" y="175" width="30" height="95" fill="#1a1a1a"/>
  <!-- Inner copper wires stretched -->
  <line x1="245" y1="180" x2="245" y2="265" stroke="#c0392b" stroke-width="3" stroke-dasharray="4,2"/>
  <line x1="255" y1="180" x2="255" y2="265" stroke="#c0392b" stroke-width="3" stroke-dasharray="4,2"/>
  <text x="310" y="215" font-size="12" fill="#c0392b" font-weight="700">Натяг жил!</text>
  <path d="M305,215 L270,215" fill="none" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Warning Box -->
  <rect x="45" y="285" width="410" height="130" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="60" y="310" font-size="13" font-weight="700" fill="#c0392b">Наслідки невірного кріплення:</text>
  <text x="60" y="332" font-size="12" fill="#1a1a1a">• Кабель утримується лише затискною муфтою гермовводу</text>
  <text x="60" y="352" font-size="12" fill="#1a1a1a">• Силовий трос відсутній або не заанкеровано</text>
  <text x="60" y="372" font-size="12" fill="#1a1a1a">• Повзучість оболонки, ризик виривання дротів з клем</text>
  <text x="60" y="392" font-size="12" fill="#1a1a1a">• Обрив кола Stop та загроза аварійної ситуації</text>

  <!-- Right Panel -->
  <rect x="490" y="85" width="440" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="710" y="112" font-size="15" font-weight="700" text-anchor="middle" fill="#27ae60">2. Правильне анкерування (EN 60204-1)</text>

  <!-- Right diagram graphics -->
  <!-- Metal structure top with eyebolt -->
  <rect x="640" y="130" width="140" height="20" fill="#d0d7de" rx="3"/>
  <text x="710" y="145" font-size="11" text-anchor="middle" fill="#1a1a1a">Ригель / Рим-болт</text>

  <!-- Eyebolt loop -->
  <circle cx="710" cy="162" r="8" fill="none" stroke="#2457d6" stroke-width="3"/>

  <!-- Steel wire anchored to eyebolt -->
  <path d="M710,170 L710,210" fill="none" stroke="#2457d6" stroke-width="3"/>
  <text x="735" y="195" font-size="11" fill="#2457d6" font-weight="700">Силовий трос</text>

  <!-- Cable gland for outer jacket (loose / strain-free) -->
  <rect x="680" y="215" width="60" height="20" fill="#6b7280" rx="3"/>
  <text x="710" y="229" font-size="10" text-anchor="middle" fill="white">Гермоввід</text>

  <!-- Cable continuing down with slack electrical wires -->
  <path d="M695,235 L695,260 Q680,270 695,280 L695,290" fill="none" stroke="#1a1a1a" stroke-width="6"/>
  <text x="745" y="265" font-size="12" fill="#27ae60" font-weight="700">Петля слабини</text>
  <path d="M738,265 L705,265" fill="none" stroke="#27ae60" stroke-width="1.5" marker-end="url(#arr-green)"/>

  <!-- Success Box -->
  <rect x="505" y="285" width="410" height="130" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="520" y="310" font-size="13" font-weight="700" fill="#27ae60">Переваги правильної схеми:</text>
  <text x="520" y="332" font-size="12" fill="#1a1a1a">• Силовий трос огинає коуш і затиснутий дуплексним затискачем</text>
  <text x="520" y="352" font-size="12" fill="#1a1a1a">• 100% ваги пульта приймає на себе сталевий трос</text>
  <text x="520" y="372" font-size="12" fill="#1a1a1a">• Електричні жили заходять у клеми з помітною слабиною</text>
  <text x="520" y="392" font-size="12" fill="#1a1a1a">• Повний захист контактів і відповідність EN 60204-1</text>

  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>
</svg>
