<svg width="960" height="540" viewBox="0 0 960 540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" xmlns="http://www.w3.org/2000/svg">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Marker Definitions -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Title and Subtitle -->
  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вирівнювання потенціалів між шафою керування та рухомим пультом</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Окремий провідник PE низького опору відводить вирівнювальний струм I_eq</text>

  <!-- ================= LEFT PANEL: BAD ================= -->
  <rect x="30" y="85" width="435" height="430" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="45" y="98" width="405" height="32" rx="4" fill="#c0392b"/>
  <text x="247" y="119" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">БЕЗ ПАРАЛЕЛЬНОГО PE (НЕПРАВИЛЬНО)</text>

  <!-- Left Cabinet -->
  <rect x="50" y="145" width="115" height="215" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="107" y="170" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Шафа керування</text>
  <text x="107" y="188" font-size="12" fill="#6b7280" text-anchor="middle">Потенціал V₁</text>

  <!-- Left Cabinet GND -->
  <line x1="107" y1="360" x2="107" y2="385" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="95" y1="385" x2="119" y2="385" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="99" y1="390" x2="115" y2="390" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="103" y1="395" x2="111" y2="395" stroke="#1a1a1a" stroke-width="2"/>
  <text x="107" y="415" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GND 1</text>

  <!-- Left Pendant -->
  <rect x="330" y="145" width="115" height="215" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="387" y="170" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Рухомий пульт</text>
  <text x="387" y="188" font-size="12" fill="#6b7280" text-anchor="middle">Потенціал V₂</text>

  <!-- Left Pendant GND -->
  <line x1="387" y1="360" x2="387" y2="385" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="375" y1="385" x2="399" y2="385" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="379" y1="390" x2="395" y2="390" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="383" y1="395" x2="391" y2="395" stroke="#1a1a1a" stroke-width="2"/>
  <text x="387" y="415" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GND 2</text>

  <!-- Left Cable & Shield -->
  <text x="247" y="202" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Екран кабелю (360°)</text>
  <rect x="165" y="210" width="165" height="95" rx="4" fill="#ffffff" stroke="#c0392b" stroke-dasharray="4,3" stroke-width="1.5"/>
  <line x1="165" y1="238" x2="330" y2="238" stroke="#2457d6" stroke-width="2"/>
  <line x1="165" y1="278" x2="330" y2="278" stroke="#2457d6" stroke-width="2"/>
  <text x="247" y="262" font-size="12" fill="#2457d6" text-anchor="middle">Сигнальні жили</text>

  <!-- Left Fault Current Flow -->
  <path d="M 107,340 L 107,300 L 165,300" fill="none" stroke="#c0392b" stroke-width="2"/>
  <path d="M 165,300 L 330,300" fill="none" stroke="#c0392b" stroke-width="3.5" marker-end="url(#arr-red)"/>
  <path d="M 330,300 L 387,300 L 387,340" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="247" y="332" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Струм I_eq крізь екран</text>

  <!-- Left Warning Box -->
  <rect x="45" y="435" width="405" height="65" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="247" y="458" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">⚠️ Струм I_eq повністю тече через тонкий екран</text>
  <text x="247" y="480" font-size="12" fill="#1a1a1a" text-anchor="middle">Перегрів екрана та високий рівень наведених завад</text>


  <!-- ================= RIGHT PANEL: GOOD ================= -->
  <rect x="495" y="85" width="435" height="430" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="510" y="98" width="405" height="32" rx="4" fill="#27ae60"/>
  <text x="712" y="119" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">З ПАРАЛЕЛЬНИМ ПРОВІДНИКОМ PE (ПРАВИЛЬНО)</text>

  <!-- Right Cabinet -->
  <rect x="515" y="145" width="115" height="215" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="572" y="170" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Шафа керування</text>
  <text x="572" y="188" font-size="12" fill="#6b7280" text-anchor="middle">Потенціал V₁</text>

  <!-- Right Cabinet GND -->
  <line x1="572" y1="360" x2="572" y2="385" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="560" y1="385" x2="584" y2="385" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="564" y1="390" x2="580" y2="390" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="568" y1="395" x2="576" y2="395" stroke="#1a1a1a" stroke-width="2"/>
  <text x="572" y="415" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GND 1</text>

  <!-- Right Pendant -->
  <rect x="795" y="145" width="115" height="215" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="852" y="170" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Рухомий пульт</text>
  <text x="852" y="188" font-size="12" fill="#6b7280" text-anchor="middle">Потенціал V₂</text>

  <!-- Right Pendant GND -->
  <line x1="852" y1="360" x2="852" y2="385" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="840" y1="385" x2="864" y2="385" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="844" y1="390" x2="860" y2="390" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="848" y1="395" x2="856" y2="395" stroke="#1a1a1a" stroke-width="2"/>
  <text x="852" y="415" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">GND 2</text>

  <!-- Right Cable & Shield -->
  <text x="712" y="192" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Екран кабелю (360°)</text>
  <rect x="630" y="200" width="165" height="85" rx="4" fill="#ffffff" stroke="#2457d6" stroke-dasharray="4,3" stroke-width="1.5"/>
  <line x1="630" y1="222" x2="795" y2="222" stroke="#2457d6" stroke-width="2"/>
  <line x1="630" y1="258" x2="795" y2="258" stroke="#2457d6" stroke-width="2"/>
  <text x="712" y="244" font-size="12" fill="#2457d6" text-anchor="middle">Сигнальні жили</text>
  <text x="712" y="276" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Струм екрана I_sh ≈ 0</text>

  <!-- Right Parallel PE Bonding Wire -->
  <text x="712" y="306" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Провідник PE (R_PE ≪ R_sh)</text>
  <path d="M 572,340 L 572,322 L 630,322" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <path d="M 630,322 L 785,322" fill="none" stroke="#27ae60" stroke-width="4.5" marker-end="url(#arr-green)"/>
  <path d="M 785,322 L 852,322 L 852,340" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <text x="712" y="342" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Струм I_PE ≈ I_eq</text>

  <!-- Right Solution Box -->
  <rect x="510" y="435" width="405" height="65" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="712" y="458" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">✓ Низький опір PE шунтує вирівнювальний струм</text>
  <text x="712" y="480" font-size="12" fill="#1a1a1a" text-anchor="middle">Екран виконує тільки захист від високочастотних завад</text>
</svg>
