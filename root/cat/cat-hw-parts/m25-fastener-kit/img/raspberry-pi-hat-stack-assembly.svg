<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Header -->
  <text x="480" y="38" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Складальне креслення монтажу Raspberry Pi та плати розширення HAT</text>
  <text x="480" y="60" font-size="13" font-weight="400" text-anchor="middle" fill="#6b7280">Стійки М2.5 (H = 11 мм), 40-піновий роз'єм GPIO, поліамідні шайби та запобігання перекосу контактів</text>

  <!-- LEFT PANEL: Exploded Assembly View (x=30..530, y=85..435) -->
  <rect x="30" y="85" width="500" height="350" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="280" y="112" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a1a">Повний конструктивний розріз стека (Exploded View)</text>

  <!-- Exploded View Elements -->
  <!-- Top screw & washer -->
  <rect x="205" y="125" width="30" height="8" rx="2" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <text x="310" y="132" font-size="12" fill="#1a1a1a">Гвинт М2.5 DIN 7985</text>
  <line x1="235" y1="129" x2="300" y2="129" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>

  <rect x="200" y="138" width="40" height="3" rx="1" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="310" y="145" font-size="12" fill="#6b7280">Шайба верхня</text>

  <!-- Top Board HAT -->
  <rect x="150" y="148" width="140" height="12" rx="2" fill="#27ae60" fill-opacity="0.2" stroke="#27ae60" stroke-width="1.5"/>
  <text x="310" y="157" font-size="12" font-weight="600" fill="#1a1a1a">Плата HAT (1.6 мм)</text>
  <line x1="290" y1="154" x2="302" y2="154" stroke="#6b7280" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Thermal gap & SoC -->
  <rect x="200" y="164" width="40" height="18" rx="2" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="310" y="177" font-size="12" fill="#c0392b">Тепловий зазор Δh ≥ 4 мм (радіатор)</text>
  <line x1="240" y1="173" x2="300" y2="173" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Standoff M2.5 (H = 11mm) -->
  <rect x="202" y="185" width="36" height="105" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="310" y="240" font-size="12" font-weight="600" fill="#2457d6">Стійка М2.5 (H = 11.0 мм)</text>
  <line x1="238" y1="237" x2="300" y2="237" stroke="#2457d6" stroke-width="1" marker-end="url(#arr-blue)"/>

  <!-- GPIO 40-pin header connector -->
  <rect x="120" y="200" width="30" height="75" rx="2" fill="#1a1a1a" fill-opacity="0.1" stroke="#1a1a1a" stroke-width="1"/>
  <text x="310" y="235" font-size="12" fill="#1a1a1a">Роз'єм GPIO 40-pin</text>
  <text x="310" y="250" font-size="12" fill="#6b7280">Висота пластику 8.5 мм</text>
  <line x1="150" y1="237" x2="198" y2="237" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Bottom Board Raspberry Pi -->
  <rect x="140" y="293" width="160" height="12" rx="2" fill="#c0392b" fill-opacity="0.2" stroke="#c0392b" stroke-width="1.5"/>
  <text x="310" y="302" font-size="12" font-weight="600" fill="#1a1a1a">Плата Raspberry Pi (1.6 мм)</text>
  <line x1="300" y1="299" x2="308" y2="299" stroke="#6b7280" stroke-width="1" marker-end="url(#arr)"/>

  <!-- Polyamide washer -->
  <rect x="195" y="308" width="50" height="4" rx="1" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="310" y="313" font-size="12" fill="#2457d6">Поліамідна шайба (діелектрик)</text>
  <line x1="245" y1="310" x2="300" y2="310" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Bottom screw -->
  <rect x="205" y="315" width="30" height="8" rx="2" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <text x="310" y="322" font-size="12" fill="#1a1a1a">Нижній гвинт М2.5 DIN 7985</text>
  <line x1="235" y1="319" x2="300" y2="319" stroke="#6b7280" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Dimension indicators left side -->
  <line x1="105" y1="148" x2="105" y2="305" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="100" y1="148" x2="110" y2="148" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="100" y1="305" x2="110" y2="305" stroke="#1a1a1a" stroke-width="1"/>
  <text x="95" y="230" font-size="12" font-weight="700" text-anchor="end" fill="#1a1a1a">11 мм</text>

  <!-- RIGHT PANEL: Installation rules & issues (x=550..930, y=85..435) -->
  <rect x="550" y="85" width="380" height="350" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="740" y="112" font-size="14" font-weight="700" text-anchor="middle" fill="#1a1a1a">Порядок затягування та норми</text>

  <!-- Cross-tightening scheme box -->
  <rect x="565" y="125" width="350" height="95" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="580" y="145" font-size="12" font-weight="700" fill="#1a1a1a">Схема перехресного затягування 4 гвинтів:</text>
  <text x="580" y="165" font-size="11" fill="#6b7280">Діагональний порядок усуває кутовий перекіс GPIO:</text>
  <text x="580" y="190" font-size="12" font-weight="700" fill="#2457d6">1 (верх-л) ➔ 2 (низ-п) ➔ 3 (верх-п) ➔ 4 (низ-л)</text>

  <!-- Green torque control box -->
  <rect x="565" y="230" width="350" height="90" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.2"/>
  <text x="580" y="250" font-size="12" font-weight="700" fill="#27ae60">Контроль зусилля та крутного моменту:</text>
  <text x="580" y="270" font-size="11" fill="#1a1a1a">• Момент затягування: M = 0.20–0.25 Н·м (латунь)</text>
  <text x="580" y="290" font-size="11" fill="#1a1a1a">• Використовувати динамометричну викрутку</text>

  <!-- Red misalignment risks box -->
  <rect x="565" y="330" width="350" height="90" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.2"/>
  <text x="580" y="350" font-size="12" font-weight="700" fill="#c0392b">Наслідки перекосу та надмірного тиску:</text>
  <text x="580" y="370" font-size="11" fill="#1a1a1a">• Перекіс θ &gt; 1.5° викликає втрату контакту пінів</text>
  <text x="580" y="390" font-size="11" fill="#1a1a1a">• Наслідок: перезавантаження, збої шин, пошкодження</text>
</svg>
