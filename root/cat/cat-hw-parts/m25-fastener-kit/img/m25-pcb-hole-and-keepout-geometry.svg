<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Геометрія отвору під кріплення М2.5 та зона відчуження Keepout</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Діаметр отвору D_hole = 2.7 мм за DIN EN 20273, діаметр зони відчуження D_keepout = 5.6 мм (R = 2.8 мм) для захисту міді та маски</text>

  <!-- Left Panel: Top View PCB Pad (x=30..510, y=85..435) -->
  <rect x="30" y="85" width="480" height="350" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="270" y="112" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Топологічне креслення посадкового місця (Top View)</text>

  <!-- Drawing area for PCB Pad (Center at x=270, y=260) -->
  <!-- Keepout Zone circle: D=160px (~5.6mm) -> R=80px -->
  <circle cx="270" cy="260" r="80" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="6,4"/>
  
  <!-- Solder Mask Clearance circle: D=140px -> R=70px -->
  <circle cx="270" cy="260" r="70" fill="none" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Copper pad / Washer circle: D=120px (~4.5-5.0mm head) -> R=60px -->
  <circle cx="270" cy="260" r="60" fill="#d0d7de" fill-opacity="0.5" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Hex standoff outline (circumscribed D ~ 110px, S = 4.5-5.0mm) -->
  <polygon points="270,205 317,232 317,288 270,315 223,288 223,232" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Drill hole: D = 78px (~2.7mm) -> R = 39px -->
  <circle cx="270" cy="260" r="39" fill="white" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Dimensions & Callouts (Left Panel) -->
  <!-- D_hole dimension (horizontal leader at bottom of hole y=299) -->
  <line x1="231" y1="330" x2="309" y2="330" stroke="#1a1a1a" stroke-width="1" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="270" y="348" font-size="12" fill="#1a1a1a" text-anchor="middle">d = 2.70 мм (+0.1/-0.05)</text>

  <!-- D_keepout dimension (top-right radius leader) -->
  <line x1="270" y1="260" x2="350" y2="180" stroke="#2457d6" stroke-width="1" marker-end="url(#arr-blue)"/>
  <text x="362" y="177" font-size="12" fill="#2457d6" text-anchor="start">R_keepout = 2.8 мм</text>

  <!-- Keepout text prohibition note inside panel -->
  <text x="50" y="380" font-size="11" fill="#c0392b">⛔ Заборона: всередині зони відчуження</text>
  <text x="50" y="396" font-size="11" fill="#c0392b">немає трас, перехідних отворів та компонентів!</text>
  <text x="50" y="415" font-size="11" fill="#6b7280">DIN 7985 / DIN 912 | Ключ S = 4.5–5.0 мм</text>

  <!-- Right Panel: Comparison & Warning (x=530..930, y=85..435) -->
  <rect x="530" y="85" width="390" height="350" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="725" y="112" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Порівняння виконання та ризики</text>

  <!-- Sub-block 1: PTH (Green) -->
  <rect x="545" y="125" width="360" height="75" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="560" y="148" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="start">Металізований отвір (PTH) — заземлення</text>
  <text x="560" y="167" font-size="12" fill="#1a1a1a" text-anchor="start">• Гальванічна мідь 25–35 мкм на стінках отвору.</text>
  <text x="560" y="185" font-size="12" fill="#1a1a1a" text-anchor="start">• Зв'язок із внутрішніми шарами GND (термобар'єр).</text>

  <!-- Sub-block 2: NPTH (Blue) -->
  <rect x="545" y="210" width="360" height="75" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="560" y="233" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="start">Неметалізований отвір (NPTH) — ізоляція</text>
  <text x="560" y="252" font-size="12" fill="#1a1a1a" text-anchor="start">• Чистий склотекстоліт без міді на стінках.</text>
  <text x="560" y="270" font-size="12" fill="#1a1a1a" text-anchor="start">• Відступ міді ≥ 0.5 мм для повної розв'язки шасі.</text>

  <!-- Sub-block 3: Warning (Red) -->
  <rect x="545" y="295" width="360" height="125" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="560" y="318" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="start">Застереження щодо пошкодження маски</text>
  <text x="560" y="339" font-size="12" fill="#1a1a1a" text-anchor="start">Затягування сталевого гвинта з моментом M &gt; 0.4 Н·м</text>
  <text x="560" y="357" font-size="12" fill="#1a1a1a" text-anchor="start">при R_keepout &lt; 2.5 мм розтріскує паяльну маску,</text>
  <text x="560" y="375" font-size="12" fill="#1a1a1a" text-anchor="start">оголює мідні доріжки та викликає коротке</text>
  <text x="560" y="393" font-size="12" fill="#1a1a1a" text-anchor="start">замикання на монтажне шасі та корпус!</text>
</svg>
