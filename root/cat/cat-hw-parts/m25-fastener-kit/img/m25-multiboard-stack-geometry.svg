<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Геометрія поперечного розрізу міжплатного стека М2.5</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Висота стійки H_gap унеможливлює контакт виводів THT із компонентами та виключає механічний натяг</text>

  <!-- Рамки панелей -->
  <rect x="30" y="80" width="530" height="350" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="580" y="80" width="350" height="350" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Заголовки панелей -->
  <text x="55" y="105" font-size="14" font-weight="bold" fill="#1a1a1a">Поперечний розріз двоярусного стека плат</text>
  <text x="605" y="105" font-size="14" font-weight="bold" fill="#1a1a1a">Розрахунок та правила монтажу</text>

  <!-- Схема (Ліва панель) -->
  <!-- Нижня плата (Base PCB) -->
  <rect x="70" y="320" width="450" height="16" rx="2" fill="#27ae60" opacity="0.85"/>
  <text x="85" y="332" font-size="11" font-weight="bold" fill="#ffffff">Base PCB (FR-4, T = 1.6 мм)</text>

  <!-- Верхня плата (Top HAT) -->
  <rect x="70" y="180" width="450" height="16" rx="2" fill="#27ae60" opacity="0.85"/>
  <text x="85" y="192" font-size="11" font-weight="bold" fill="#ffffff">Top HAT (FR-4, T = 1.6 мм)</text>

  <!-- Стійки М2.5 (зліва та справа) -->
  <!-- Ліва стійка -->
  <rect x="100" y="196" width="24" height="124" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="105" y="150" width="14" height="30" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="95" y="336" width="34" height="8" fill="#6b7280" stroke="#1a1a1a" stroke-width="1"/>
  <circle cx="112" cy="350" r="6" fill="#6b7280" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Права стійка -->
  <rect x="446" y="196" width="24" height="124" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="451" y="150" width="14" height="30" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <rect x="441" y="336" width="34" height="8" fill="#6b7280" stroke="#1a1a1a" stroke-width="1"/>
  <circle cx="458" cy="350" r="6" fill="#6b7280" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Конденсатор на нижній платі -->
  <rect x="200" y="270" width="40" height="50" rx="4" fill="#2457d6" opacity="0.85" stroke="#1a1a1a" stroke-width="1"/>
  <text x="220" y="298" font-size="11" fill="#ffffff" text-anchor="middle">h = 8.5</text>

  <!-- Роз'єм GPIO -->
  <rect x="290" y="290" width="100" height="30" fill="#1a1a1a" rx="2"/>
  <text x="340" y="309" font-size="11" fill="#ffffff" text-anchor="middle">GPIO 40-pin</text>

  <!-- Паяні виводи THT на верхній платі -->
  <rect x="205" y="196" width="10" height="12" fill="#6b7280"/>
  <rect x="225" y="196" width="10" height="12" fill="#6b7280"/>
  <text x="220" y="222" font-size="11" fill="#1a1a1a" text-anchor="middle">THT ніжки 2 мм</text>

  <!-- Розміри та виносні лінії -->
  <line x1="530" y1="196" x2="530" y2="320" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <line x1="525" y1="196" x2="535" y2="196" stroke="#c0392b" stroke-width="1.5"/>
  <line x1="525" y1="320" x2="535" y2="320" stroke="#c0392b" stroke-width="1.5"/>
  <text x="515" y="263" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">H = 12</text>

  <!-- Повітряний проміжок Δh_safe -->
  <line x1="220" y1="230" x2="220" y2="265" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="2,2"/>
  <line x1="215" y1="230" x2="225" y2="230" stroke="#27ae60" stroke-width="1.5"/>
  <line x1="215" y1="265" x2="225" y2="265" stroke="#27ae60" stroke-width="1.5"/>
  <text x="185" y="250" font-size="11" fill="#27ae60" text-anchor="end">Δh ≥ 1.0</text>

  <!-- Права панель (Формули та правила) -->
  <text x="600" y="135" font-size="12" font-weight="bold" fill="#1a1a1a">1. Розрахунок мінімального зазору:</text>
  <text x="610" y="155" font-size="11" fill="#1a1a1a">H_min = h_comp + h_lead + Δh_safe</text>
  <text x="610" y="175" font-size="11" fill="#1a1a1a">= 8.5 + 2.0 + 1.0 = 11.5 мм</text>
  <text x="610" y="195" font-size="11" font-weight="bold" fill="#27ae60">→ Вибір стандартної стійки: 12 мм</text>

  <text x="600" y="230" font-size="12" font-weight="bold" fill="#1a1a1a">2. Глибина внутрішньої різьби стійки:</text>
  <text x="610" y="250" font-size="11" fill="#1a1a1a">L_hole_min = L_thread - T_pcb + P</text>
  <text x="610" y="270" font-size="11" fill="#1a1a1a">= 6.0 - 1.6 + 0.45 = 4.85 мм</text>

  <text x="600" y="305" font-size="12" font-weight="bold" fill="#1a1a1a">3. Захист друкованої плати:</text>
  <text x="610" y="325" font-size="11" fill="#6b7280">• Шайба DIN 125 розподіляє притискне</text>
  <text x="610" y="342" font-size="11" fill="#6b7280">  зусилля (зовнішній діаметр d2 = 5.0 мм).</text>
  <text x="610" y="362" font-size="11" fill="#6b7280">• Жорсткий каркас повністю розвантажує</text>
  <text x="610" y="379" font-size="11" fill="#6b7280">  40-контактний роз'єм GPIO від зусиль</text>
  <text x="610" y="396" font-size="11" fill="#6b7280">  стикування (20–40 Н).</text>
</svg>
