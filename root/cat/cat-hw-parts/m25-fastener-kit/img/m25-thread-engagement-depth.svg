<svg width="960" height="460" viewBox="0 0 960 460" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Глибина зачеплення різьби М2.5 у міжплатному з'єднанні</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Крок витків P = 0.45 мм, робоча глибина закручування L_eng ≥ 3–4 витки (1.5–2.0 мм) та запобігання зриву різьби в латуні</text>

  <!-- ЛІВА ПАНЕЛЬ: Поздовжній розріз -->
  <rect x="30" y="80" width="480" height="350" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="108" font-size="14" font-weight="bold" fill="#1a1a1a">Поздовжній розріз різьбового вузла зачеплення</text>

  <!-- Верхня стійка (Male Standoff Body) -->
  <rect x="195" y="125" width="50" height="40" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="220" y="150" font-size="11" fill="#1a1a1a" text-anchor="middle">Male Stud</text>

  <!-- Шпилька M2.5 (зовнішня різьба d = 2.5 мм) проходить крізь отвір плати -->
  <rect x="210" y="165" width="20" height="65" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Плата PCB з монтажним отвором (ліва та права частина розрізу) -->
  <rect x="70" y="170" width="130" height="18" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="240" y="170" width="130" height="18" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="75" y="162" font-size="11" fill="#27ae60" font-weight="bold">Плата FR-4 (1.6 мм)</text>
  <text x="305" y="162" font-size="11" fill="#6b7280">Отвір 2.7 мм</text>

  <!-- Нижня стійка з внутрішньою різьбою (розріз корпусу ліворуч і праворуч) -->
  <rect x="180" y="188" width="25" height="85" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="235" y="188" width="25" height="85" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="180" y1="273" x2="260" y2="273" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Виносна лінія зачеплення L_eng = 3.9 мм -->
  <line x1="265" y1="188" x2="305" y2="188" stroke="#2457d6" stroke-width="1"/>
  <line x1="265" y1="230" x2="305" y2="230" stroke="#2457d6" stroke-width="1"/>
  <line x1="290" y1="188" x2="290" y2="230" stroke="#2457d6" stroke-width="1" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
  <text x="312" y="213" font-size="12" font-weight="bold" fill="#2457d6">L_eng = 3.9 мм</text>

  <!-- Текстові пояснення в нижній вільній зоні (y=295..420) -->
  <rect x="45" y="295" width="450" height="120" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="60" y="322" font-size="12" font-weight="bold" fill="#1a1a1a">Розрахунок активних витків зачеплення:</text>
  <text x="60" y="346" font-size="12" fill="#1a1a1a">• Активні витки: N = L_eng / P = 3.9 / 0.45 ≈ 8.6 витків</text>
  <text x="60" y="370" font-size="12" fill="#1a1a1a">• Норма стандарту: N ≥ 3–4 витки (запас міцності більше 2.0)</text>
  <text x="60" y="394" font-size="12" fill="#6b7280">• Перші 3 витки сприймають до 70% усього осьового навантаження</text>

  <!-- ПРАВА ПАНЕЛЬ: Розрахунки та крутний момент -->
  <rect x="530" y="80" width="400" height="350" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="550" y="108" font-size="14" font-weight="bold" fill="#1a1a1a">Механічні розрахунки та обмеження</text>

  <!-- Зелений блок: Мінімальна глибина -->
  <rect x="550" y="125" width="360" height="95" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="565" y="148" font-size="13" font-weight="bold" fill="#27ae60">Мінімальна нормативна глибина зачеплення:</text>
  <text x="565" y="170" font-size="12" fill="#1a1a1a">• Сталеві деталі: L_min ≥ 1.0 · d = 2.5 мм (~5.5 витків)</text>
  <text x="565" y="192" font-size="12" fill="#1a1a1a">• Латунні деталі: L_min ≥ 1.5 · d = 3.75 мм (~8 витків)</text>

  <!-- Червоний блок: Ризики та крутний момент -->
  <rect x="550" y="235" width="360" height="180" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="565" y="258" font-size="13" font-weight="bold" fill="#c0392b">Крутний момент та ризики:</text>
  <text x="565" y="280" font-size="12" fill="#1a1a1a">• Латунь CuZn39Pb3: T_max = 0.25–0.30 Н·м (25–30 Н·см)</text>
  <text x="565" y="302" font-size="12" fill="#1a1a1a">• Нержавіюча сталь (A2-70): T_max = 0.45–0.50 Н·м</text>
  <text x="565" y="324" font-size="12" fill="#1a1a1a">• Нейлон (Polyamide 66): T_max = 0.10–0.12 Н·м</text>
  <text x="565" y="354" font-size="12" fill="#c0392b" font-weight="bold">⚠ Застереження:</text>
  <text x="565" y="376" font-size="11" fill="#1a1a1a">- L_eng &lt; 1.0 мм (менш ніж 2 витки) призводить до зрізання!</text>
  <text x="565" y="396" font-size="11" fill="#1a1a1a">- Довга шпилька без плати викликає перекіс (bottoming out).</text>
</svg>
