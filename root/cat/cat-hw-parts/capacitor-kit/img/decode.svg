<line x1="450.0" y1="304.0" x2="450.0" y2="338.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<line x1="730.0" y1="304.0" x2="450.0" y2="338.0" stroke="#333333" stroke-width="1.4" marker-end="url(#arrow)"/>
<rect x="230.0" y="344.2" width="440.0" height="35.5" rx="6" fill="#e8f0ff" stroke="#2457d6" stroke-width="1.5"/><text x="450.0" y="366.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">одне число в пФ  →  показ як пФ / нФ / мкФ</tspan></text>
<rect x="230.0" y="402.8" width="440.0" height="30.5" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/><text x="450.0" y="422.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">пастка:  код 100 = 10 · 10⁰ = 10 пФ  (а НЕ 100 пФ)</tspan></text>
</svg>