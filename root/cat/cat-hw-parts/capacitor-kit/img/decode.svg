<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="32.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Розбір маркування: три гілки, одне число в пФ</text>
<rect x="170.0" y="56.2" width="560.0" height="35.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="78.7" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">напис на корпусі:  104   ·   0.1   ·   4n7   ·   470µF 25V</tspan></text>
<rect x="205.0" y="123.0" width="490.0" height="30.0" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="142.2" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">спершу відрізати напругу (…V) і літеру-допуск (J/K/M) — в окремі поля</tspan></text>
<line x1="450.0" y1="92.0" x2="450.0" y2="122.0" stroke="#333333" stroke-width="1.8" marker-end="url(#arrow)"/>
<line x1="450.0" y1="158.0" x2="170.0" y2="204.0" stroke="#2457d6" stroke-width="1.6" marker-end="url(#arrow)"/>
