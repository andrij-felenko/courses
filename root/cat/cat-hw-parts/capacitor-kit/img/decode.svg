<text x="170.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">104  →  10 · 10⁴</text>
<text x="170.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="170.0" dy="0.0">дві цифри × 10^третя,</tspan><tspan x="170.0" dy="13.7">в пікофарадах</tspan></text>
<line x1="450.0" y1="158.0" x2="450.0" y2="204.0" stroke="#27ae60" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="345.0" y="211.8" width="210.0" height="28.5" rx="6" fill="#eef7f0" stroke="#27ae60" stroke-width="1.5"/><text x="450.0" y="230.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="450.0" dy="0.0">ПРЯМЕ МАРКУВАННЯ</tspan></text>
<text x="450.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">0.1  →  0.1 · 10⁶</text>
<text x="450.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="450.0" dy="0.0">число × одиниця:</tspan><tspan x="450.0" dy="13.7">мкФ=10⁶, нФ=10³, пФ=1</tspan></text>
<line x1="450.0" y1="158.0" x2="730.0" y2="204.0" stroke="#b8860b" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="625.0" y="211.8" width="210.0" height="28.5" rx="6" fill="#fdf6e8" stroke="#b8860b" stroke-width="1.5"/><text x="730.0" y="230.4" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#1a1a1a" text-anchor="middle" font-weight="700"><tspan x="730.0" dy="0.0">БУКВА ЗАМІСТЬ КОМИ</tspan></text>
<text x="730.0" y="262.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="13" fill="#1a1a1a" text-anchor="middle" font-weight="700">4n7  →  4.7 нФ</text>
<text x="730.0" y="282.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#6b7280" text-anchor="middle"><tspan x="730.0" dy="0.0">цифри до/після літери,</tspan><tspan x="730.0" dy="13.7">літера дає одиницю</tspan></text>
