<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  
  <!-- Main Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" font-family="sans-serif" text-anchor="middle" fill="#1a1a1a">Монтажний стенд контролю повітряного зазору та биття валів</text>
  <text x="480" y="60" font-size="13" font-family="sans-serif" text-anchor="middle" fill="#6b7280">Схема взаємного розташування валів усередині муфти та точки дотику щупа індикатора годинникового типу</text>

  <!-- Panel 1: Left (x=30..470, y=80..430) -->
  <rect x="30" y="80" width="440" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="250" y="108" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle" fill="#1a1a1a">Розріз муфти та повітряний зазор</text>

  <!-- Lead Screw Shaft (top: y=130..195) -->
  <rect x="235" y="130" width="30" height="65" rx="3" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="235" y1="145" x2="265" y2="155" stroke="#6b7280" stroke-width="1"/>
  <line x1="235" y1="165" x2="265" y2="175" stroke="#6b7280" stroke-width="1"/>

  <!-- Flexible Coupling Body (y=195..285) -->
  <rect x="215" y="195" width="70" height="90" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <path d="M215 215 L250 225 L215 235 L250 245 L215 255" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <path d="M285 220 L250 230 L285 240 L250 250 L285 260" fill="none" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Motor Shaft (bottom: y=285..390) -->
  <rect x="235" y="285" width="30" height="105" rx="3" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Air gap between shaft ends inside coupling -->
  <rect x="237" y="215" width="26" height="55" fill="#fdecea" stroke="#c0392b" stroke-dasharray="3,3" stroke-width="1"/>

  <!-- Labels & Pointers for Left Panel -->
  <line x1="263" y1="242" x2="310" y2="242" stroke="#c0392b" stroke-width="1.5"/>
  <circle cx="263" cy="242" r="3" fill="#c0392b"/>
  <text x="315" y="246" font-size="11" font-weight="bold" font-family="sans-serif" fill="#c0392b">Зазор 1.5–2 мм</text>

  <line x1="235" y1="162" x2="80" y2="162" stroke="#1a1a1a" stroke-width="1"/>
  <circle cx="235" cy="162" r="3" fill="#1a1a1a"/>
  <text x="85" y="157" font-size="11" font-family="sans-serif" fill="#1a1a1a">Вал гвинта Tr8x8 (Ø5)</text>

  <line x1="235" y1="330" x2="80" y2="330" stroke="#1a1a1a" stroke-width="1"/>
  <circle cx="235" cy="330" r="3" fill="#1a1a1a"/>
  <text x="85" y="325" font-size="11" font-family="sans-serif" fill="#1a1a1a">Вал двигуна NEMA 17 (Ø5)</text>


  <!-- Panel 2: Right (x=490..930, y=80..430) -->
  <rect x="490" y="80" width="440" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="710" y="108" font-size="14" font-weight="bold" font-family="sans-serif" text-anchor="middle" fill="#1a1a1a">Контроль биття та неспіввісності</text>

  <rect x="695" y="130" width="30" height="65" rx="3" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="675" y="195" width="70" height="90" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <rect x="695" y="285" width="30" height="105" rx="3" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Magnetic stand base -->
  <rect x="510" y="350" width="60" height="40" rx="4" fill="#1a1a1a"/>
  <text x="540" y="375" font-size="11" font-weight="bold" font-family="sans-serif" text-anchor="middle" fill="white">Стійка</text>
  
  <line x1="540" y1="350" x2="540" y2="175" stroke="#6b7280" stroke-width="5" stroke-linecap="round"/>
  <!-- Arm 1 -->
  <line x1="540" y1="175" x2="630" y2="175" stroke="#6b7280" stroke-width="4" stroke-linecap="round"/>
  <line x1="630" y1="175" x2="630" y2="200" stroke="#6b7280" stroke-width="3"/>

  <!-- Dial Indicator 1 -->
  <circle cx="630" cy="200" r="15" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="630" y="204" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle" fill="#27ae60">IND</text>
  <line x1="645" y1="200" x2="675" y2="200" stroke="#27ae60" stroke-width="2"/>
  <circle cx="675" cy="200" r="4" fill="#c0392b"/>

  <!-- Label Point 1 -->
  <line x1="675" y1="200" x2="760" y2="150" stroke="#c0392b" stroke-width="1"/>
  <text x="765" y="146" font-size="11" font-weight="bold" font-family="sans-serif" fill="#c0392b">Точка 1: Биття муфти (&lt;=0.05)</text>
  <text x="765" y="160" font-size="10" font-family="sans-serif" fill="#6b7280">Радіальний контроль</text>

  <!-- Arm 2 -->
  <line x1="540" y1="225" x2="600" y2="225" stroke="#6b7280" stroke-width="4" stroke-linecap="round"/>
  <line x1="600" y1="225" x2="600" y2="250" stroke="#6b7280" stroke-width="3"/>

  <!-- Dial Indicator 2 -->
  <circle cx="600" cy="250" r="15" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <text x="600" y="254" font-size="10" font-weight="bold" font-family="sans-serif" text-anchor="middle" fill="#27ae60">IND</text>
  <line x1="615" y1="250" x2="695" y2="250" stroke="#27ae60" stroke-width="2"/>
  <circle cx="695" cy="250" r="4" fill="#c0392b"/>

  <!-- Label Point 2 -->
  <line x1="695" y1="250" x2="760" y2="310" stroke="#c0392b" stroke-width="1"/>
  <text x="765" y="306" font-size="11" font-weight="bold" font-family="sans-serif" fill="#c0392b">Точка 2: Шийка гвинта</text>
  <text x="765" y="320" font-size="10" font-family="sans-serif" fill="#6b7280">Контроль неспіввісності</text>

</svg>
