<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Цоколівка та корпуси шинного буфера 74LVC1G125</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Призначення виводів у 5-вивідних SOT-23-5, SC-70-5 та надкомпактному безвивідному XSON-6</text>

  <!-- ДЕФІНІЦІЇ МАРКЕРІВ -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- ==================== ПАНЕЛЬ 1: SOT-23-5 / SC-70-5 (x=30..310) ==================== -->
  <rect x="30" y="80" width="280" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="170" y="108" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. SOT-23-5 / SC-70-5</text>
  <text x="170" y="126" font-size="12" fill="#6b7280" text-anchor="middle">SOT753 / SOT353 (5 виводів)</text>

  <!-- Корпус SOT-23 / SC-70 -->
  <rect x="120" y="165" width="100" height="120" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="170" y="230" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">74LVC</text>
  <text x="170" y="248" font-size="11" fill="#6b7280" text-anchor="middle">1G125</text>
  <!-- Ключ (Pin 1 dot) -->
  <circle cx="135" cy="180" r="4" fill="#6b7280"/>

  <!-- Виводи ліворуч (Pins 1, 2, 3) -->
  <rect x="90" y="180" width="30" height="8" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <text x="82" y="187" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">1</text>
  <text x="105" y="168" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">/OE</text>

  <rect x="90" y="221" width="30" height="8" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <text x="82" y="228" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">2</text>
  <text x="105" y="209" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">A</text>

  <rect x="90" y="262" width="30" height="8" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <text x="82" y="269" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">3</text>
  <text x="105" y="250" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">GND</text>

  <!-- Виводи праворуч (Pins 4, 5) -->
  <rect x="220" y="262" width="30" height="8" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <text x="258" y="269" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">4</text>
  <text x="235" y="250" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Y</text>

  <rect x="220" y="180" width="30" height="8" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <text x="258" y="187" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">5</text>
  <text x="235" y="168" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">VCC</text>

  <text x="170" y="325" font-size="12" fill="#1a1a1a" text-anchor="middle">Вигляд зверху (Top view)</text>
  <text x="170" y="345" font-size="11" fill="#6b7280" text-anchor="middle">Штирьові виводи по 2 зліва, 3 справа</text>
  <text x="170" y="365" font-size="11" fill="#6b7280" text-anchor="middle">Корпус шириною 2.9 мм</text>
  <text x="170" y="395" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Стандартний ручний/панельний монтаж</text>


  <!-- ==================== ПАНЕЛЬ 2: XSON-6 (x=340..620) ==================== -->
  <rect x="340" y="80" width="280" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="480" y="108" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. XSON-6 (Leadless)</text>
  <text x="480" y="126" font-size="12" fill="#6b7280" text-anchor="middle">SOT886 / DFN6 (1.45 × 1.0 мм)</text>

  <!-- Корпус XSON-6 -->
  <rect x="420" y="165" width="120" height="120" rx="3" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="480" y="230" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">XSON6</text>
  <text x="480" y="248" font-size="11" fill="#6b7280" text-anchor="middle">1.45×1.0 мм</text>
  <!-- Ключ (Pin 1 dot у кутку) -->
  <circle cx="435" cy="180" r="3" fill="#6b7280"/>

  <!-- Контактні майданчики ліворуч (Pins 1, 2, 3) -->
  <rect x="412" y="175" width="8" height="16" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <text x="400" y="187" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">1</text>
  <text x="400" y="160" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="end">/OE</text>

  <rect x="412" y="217" width="8" height="16" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <text x="400" y="229" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">2</text>
  <text x="400" y="202" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="end">A</text>

  <rect x="412" y="259" width="8" height="16" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <text x="400" y="271" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">3</text>
  <text x="400" y="244" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="end">GND</text>

  <!-- Контактні майданчики праворуч (Pins 4, 5, 6) -->
  <rect x="540" y="259" width="8" height="16" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <text x="560" y="271" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">4</text>
  <text x="560" y="244" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="start">Y</text>

  <rect x="540" y="217" width="8" height="16" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <text x="560" y="229" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">5</text>
  <text x="560" y="202" font-size="11" font-weight="bold" fill="#6b7280" text-anchor="start">n.c.</text>

  <rect x="540" y="175" width="8" height="16" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1"/>
  <text x="560" y="187" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">6</text>
  <text x="560" y="160" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="start">VCC</text>

  <text x="480" y="325" font-size="12" fill="#1a1a1a" text-anchor="middle">Безвивідні контактні майданчики (DFN)</text>
  <text x="480" y="345" font-size="11" fill="#6b7280" text-anchor="middle">Pin 5 не підключено (n.c. / SMT pad)</text>
  <text x="480" y="365" font-size="11" fill="#6b7280" text-anchor="middle">Економія площі друкованої плати</text>
  <text x="480" y="395" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Ультракомпактний поверхневий монтаж</text>


  <!-- ==================== ПАНЕЛЬ 3: ТАБЛИЦЯ ІСТИННОСТІ (x=650..930) ==================== -->
  <rect x="650" y="80" width="280" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="790" y="108" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3. Таблиця істинності</text>
  <text x="790" y="126" font-size="12" fill="#6b7280" text-anchor="middle">Логіка роботи буфера 74LVC1G125</text>

  <!-- Таблиця (фоновий прямокутник) -->
  <rect x="665" y="145" width="250" height="155" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  
  <!-- Заголовок таблиці -->
  <line x1="665" y1="175" x2="915" y2="175" stroke="#d0d7de" stroke-width="1"/>
  <text x="705" y="164" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">/OE</text>
  <text x="755" y="164" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">A</text>
  <text x="835" y="164" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Y (Вихід)</text>

  <!-- Рядок 1 -->
  <line x1="665" y1="210" x2="915" y2="210" stroke="#f4f6f8" stroke-width="1"/>
  <text x="705" y="195" font-size="12" fill="#27ae60" font-weight="bold" text-anchor="middle">L</text>
  <text x="755" y="195" font-size="12" fill="#1a1a1a" text-anchor="middle">L</text>
  <text x="835" y="195" font-size="12" fill="#27ae60" font-weight="bold" text-anchor="middle">L (Активний)</text>

  <!-- Рядок 2 -->
  <line x1="665" y1="245" x2="915" y2="245" stroke="#f4f6f8" stroke-width="1"/>
  <text x="705" y="230" font-size="12" fill="#27ae60" font-weight="bold" text-anchor="middle">L</text>
  <text x="755" y="230" font-size="12" fill="#1a1a1a" text-anchor="middle">H</text>
  <text x="835" y="230" font-size="12" fill="#27ae60" font-weight="bold" text-anchor="middle">H (Активний)</text>

  <!-- Рядок 3 -->
  <text x="705" y="268" font-size="12" fill="#c0392b" font-weight="bold" text-anchor="middle">H</text>
  <text x="755" y="268" font-size="12" fill="#6b7280" text-anchor="middle">X</text>
  <text x="835" y="268" font-size="12" fill="#c0392b" font-weight="bold" text-anchor="middle">Z (Hi-Z, ізольовано)</text>

  <!-- Вертикальні роздільники таблиці -->
  <line x1="735" y1="145" x2="735" y2="300" stroke="#d0d7de" stroke-width="1"/>
  <line x1="785" y1="145" x2="785" y2="300" stroke="#d0d7de" stroke-width="1"/>
  <line x1="665" y1="300" x2="915" y2="300" stroke="#d0d7de" stroke-width="1"/>

  <!-- Примітки під таблицею -->
  <text x="790" y="325" font-size="11" fill="#1a1a1a" text-anchor="middle">• Інверсний дозвіл (/OE = LOW активує)</text>
  <text x="790" y="345" font-size="11" fill="#1a1a1a" text-anchor="middle">• Входи толерантні до 5.5 В (довільна VCC)</text>
  <text x="790" y="365" font-size="11" fill="#6b7280" text-anchor="middle">• Захист від зворотного струму (I_off)</text>
  <text x="790" y="395" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Ідеально для мультиплексування шин</text>

</svg>
