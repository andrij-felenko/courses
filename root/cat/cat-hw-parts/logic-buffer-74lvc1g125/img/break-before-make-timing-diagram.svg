<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Комутація каналів за алгоритмом Break-Before-Make</text>
  <text x="480" y="60" font-size="13" text-anchor="middle" fill="#6b7280">Захисний часовий інтервал t_dead між вимкненням буфера 1 та ввімкненням буфера 2 унеможливлює Bus Contention</text>

  <!-- Дефініції стрілок -->
  <defs>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- 1) ЛІВА ПАНЕЛЬ: Коректне перемикання (Break-Before-Make) -->
  <rect x="30" y="80" width="570" height="350" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="105" font-size="14" font-weight="700" fill="#1a1a1a">Коректне перемикання (Break-Before-Make)</text>

  <!-- Епюри на лівій панелі -->
  <!-- Трек 1: /OE1 -->
  <text x="50" y="138" font-size="12" font-weight="700" fill="#1a1a1a">/OE1</text>
  <path d="M120,135 L240,135 L260,155 L420,155" fill="none" stroke="#2457d6" stroke-width="2"/>
  <text x="170" y="130" font-size="12" fill="#6b7280">LOW (active)</text>
  <text x="320" y="170" font-size="12" fill="#6b7280">HIGH (disabled)</text>

  <!-- Трек 2: Y1 -->
  <text x="50" y="193" font-size="12" font-weight="700" fill="#1a1a1a">Вихід Y1</text>
  <path d="M120,180 L240,180 M120,200 L240,200" fill="none" stroke="#2457d6" stroke-width="2"/>
  <path d="M240,180 L280,190 L320,190" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
  <path d="M240,200 L280,190 L320,200" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="160" y="175" font-size="12" fill="#2457d6">Data 1</text>
  <text x="270" y="180" font-size="11" fill="#6b7280">t_dis</text>
  <text x="340" y="195" font-size="12" fill="#6b7280">Hi-Z</text>

  <!-- Трек 3: Захисний інтервал t_dead -->
  <text x="50" y="248" font-size="12" font-weight="700" fill="#27ae60">Захисний t_dead</text>
  <rect x="280" y="225" width="100" height="36" fill="#e9f7ef" rx="4" stroke="#27ae60" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="330" y="248" font-size="12" font-weight="700" text-anchor="middle" fill="#27ae60">t_dead > t_dis</text>

  <!-- Трек 4: /OE2 -->
  <text x="50" y="303" font-size="12" font-weight="700" fill="#1a1a1a">/OE2</text>
  <path d="M120,295 L380,295 L400,315 L540,315" fill="none" stroke="#2457d6" stroke-width="2"/>
  <text x="220" y="290" font-size="12" fill="#6b7280">HIGH (disabled)</text>
  <text x="450" y="330" font-size="12" fill="#6b7280">LOW (active)</text>

  <!-- Трек 5: Y2 -->
  <text x="50" y="358" font-size="12" font-weight="700" fill="#1a1a1a">Вихід Y2</text>
  <path d="M120,350 L380,350 M120,370 L380,370" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>
  <text x="220" y="365" font-size="12" fill="#6b7280">Hi-Z</text>
  <path d="M380,360 L420,350 L540,350" fill="none" stroke="#27ae60" stroke-width="2"/>
  <path d="M380,360 L420,370 L540,370" fill="none" stroke="#27ae60" stroke-width="2"/>
  <text x="460" y="365" font-size="12" fill="#27ae60">Data 2</text>
  <text x="390" y="340" font-size="11" fill="#6b7280">t_en</text>

  <!-- Трек 6: Shared BUS -->
  <text x="50" y="410" font-size="12" font-weight="700" fill="#27ae60">Shared BUS</text>
  <path d="M120,400 L240,400 M120,420 L240,420" fill="none" stroke="#2457d6" stroke-width="2"/>
  <path d="M240,410 L380,410" fill="none" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="2,2"/>
  <path d="M380,400 L540,400 M380,420 L540,420" fill="none" stroke="#27ae60" stroke-width="2"/>
  <text x="290" y="405" font-size="11" fill="#27ae60">Pull-up</text>
  <text x="160" y="415" font-size="11" fill="#2457d6">D1</text>
  <text x="460" y="415" font-size="11" fill="#27ae60">D2</text>

  <!-- 2) ПРАВА ПАНЕЛЬ: Помилка Make-Before-Break -->
  <rect x="630" y="80" width="300" height="350" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="650" y="105" font-size="14" font-weight="700" fill="#c0392b">Make-Before-Break (КЗ)</text>

  <text x="650" y="140" font-size="12" font-weight="700" fill="#1a1a1a">Порушення черговості:</text>
  <text x="650" y="165" font-size="12" fill="#1a1a1a">/OE1 і /OE2 одночасно LOW!</text>

  <rect x="650" y="185" width="260" height="65" rx="4" fill="white" stroke="#c0392b" stroke-width="1"/>
  <text x="665" y="208" font-size="12" font-weight="700" fill="#c0392b">Наскрізний струм (Bus Contention):</text>
  <text x="665" y="228" font-size="12" fill="#1a1a1a">Y1 (3.3V) та Y2 (0V) замкнені накоротко</text>
  <text x="665" y="244" font-size="12" font-weight="700" fill="#c0392b">I_short > 150 мА!</text>

  <rect x="650" y="265" width="260" height="70" rx="4" fill="white" stroke="#c0392b" stroke-width="1"/>
  <text x="665" y="288" font-size="12" font-weight="700" fill="#1a1a1a">Фізичні наслідки:</text>
  <text x="665" y="308" font-size="12" fill="#6b7280">• Падіння напруги шини до V_CC / 2</text>
  <text x="665" y="325" font-size="12" fill="#6b7280">• Термічний стрес та ризик пробою</text>

  <rect x="650" y="350" width="260" height="60" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="665" y="373" font-size="12" font-weight="700" fill="#27ae60">Захист:</text>
  <text x="665" y="393" font-size="12" fill="#1a1a1a">t_dead гарантує 100% безпеку шини</text>

</svg>
