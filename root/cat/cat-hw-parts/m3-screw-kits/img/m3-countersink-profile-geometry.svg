<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Геометрія посадкового місця потайного гвинта М3 DIN 7991</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#6b7280">Кут зенкування 90°, діаметри d_k = 6.0 мм і d_h = 3.4 мм, глибина h_c = 1.30 мм та циліндричний поясок t_cyl</text>

  <!-- Panel 1: Left (x=40..500) -->
  <rect x="40" y="80" width="460" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="270" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Поздовжній розріз отвору в матеріалі</text>

  <!-- Center symmetry line -->
  <line x1="270" y1="115" x2="270" y2="415" stroke="#6b7280" stroke-width="1" stroke-dasharray="6,3,2,3"/>

  <!-- Material Plate (t = 3.0 mm -> 120px, y: 160 to 280) -->
  <!-- Left block: x from 90 to 202, top chamfer from 150,160 to 202,212 -->
  <path d="M90,160 L150,160 L202,212 L202,280 L90,280 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <!-- Right block: x from 338 to 450, top chamfer from 390,160 to 338,212 -->
  <path d="M450,160 L390,160 L338,212 L338,280 L450,280 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>

  <!-- Hatching lines for material representation -->
  <g stroke="#2457d6" stroke-width="0.8" opacity="0.4">
    <line x1="100" y1="280" x2="140" y2="160"/>
    <line x1="125" y1="280" x2="165" y2="160"/>
    <line x1="150" y1="280" x2="190" y2="160"/>
    <line x1="175" y1="280" x2="202" y2="210"/>
    
    <line x1="350" y1="280" x2="390" y2="160"/>
    <line x1="375" y1="280" x2="415" y2="160"/>
    <line x1="400" y1="280" x2="440" y2="160"/>
  </g>

  <!-- Screw head illustration hint (dashed outline) -->
  <polygon points="270,145 200,160 340,160" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,2"/>
  <path d="M210,160 L202,212 L338,212 L330,160" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,2"/>

  <!-- Dimensions -->
  <!-- Total thickness t = 3.0 on far left (line at x=60, text at x=55 end) -->
  <line x1="60" y1="160" x2="60" y2="210" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="60" y1="280" x2="60" y2="230" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="90" y1="160" x2="55" y2="160" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="2,2"/>
  <line x1="90" y1="280" x2="55" y2="280" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="55" y="224" text-anchor="end" font-size="11" font-weight="bold" fill="#1a1a1a">t=3.0</text>

  <!-- d_k dimension (top, width = 6.0 mm -> 240px from 150 to 390 at y=132) -->
  <line x1="150" y1="132" x2="255" y2="132" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="390" y1="132" x2="285" y2="132" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="150" y1="122" x2="150" y2="162" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="2,2"/>
  <line x1="390" y1="122" x2="390" y2="162" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="270" y="136" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">d_k = 6.0 мм</text>

  <!-- d_h dimension (lower through hole, width = 3.4 mm -> 136px from 202 to 338 at y=305) -->
  <line x1="202" y1="305" x2="255" y2="305" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="338" y1="305" x2="285" y2="305" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="202" y1="280" x2="202" y2="315" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="2,2"/>
  <line x1="338" y1="280" x2="338" y2="315" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="270" y="309" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">d_h = 3.4 мм</text>

  <!-- h_c and t_cyl on the right side (line at x=475, text at x=480 start) -->
  <!-- h_c dimension (y 160 to 212) -->
  <line x1="475" y1="160" x2="475" y2="182" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="475" y1="212" x2="475" y2="190" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="450" y1="160" x2="485" y2="160" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="2,2"/>
  <line x1="450" y1="212" x2="485" y2="212" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="480" y="190" text-anchor="start" font-size="11" font-weight="bold" fill="#1a1a1a">h_c=1.30</text>

  <!-- t_cyl dimension (y 212 to 280) -->
  <line x1="475" y1="212" x2="475" y2="238" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="475" y1="280" x2="475" y2="254" stroke="#1a1a1a" stroke-width="1" marker-end="url(#arr)"/>
  <line x1="450" y1="280" x2="485" y2="280" stroke="#6b7280" stroke-width="0.8" stroke-dasharray="2,2"/>
  <text x="480" y="250" text-anchor="start" font-size="11" font-weight="bold" fill="#1a1a1a">t_cyl=1.70</text>

  <!-- Angle 90° arc / label -->
  <path d="M270,185 A25,25 0 0,1 252,170" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <text x="290" y="180" text-anchor="start" font-size="12" font-weight="bold" fill="#1a1a1a">90°</text>

  <!-- Panel 2: Right (x=520..920) -->
  <rect x="520" y="80" width="400" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="720" y="105" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a1a1a">Інженерний розрахунок та допуски</text>

  <!-- Green block: Normative parameters -->
  <rect x="540" y="120" width="360" height="130" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="560" y="145" font-size="13" font-weight="bold" fill="#27ae60">Нормативні параметри DIN 7991 (ISO 10642)</text>
  <text x="560" y="172" font-size="12" fill="#1a1a1a">• Діаметр головки d_k: 5.70–6.00 мм (номінал 6.0)</text>
  <text x="560" y="197" font-size="12" fill="#1a1a1a">• Висота головки k_max = 1.70 мм (вкл. плоский торець)</text>
  <text x="560" y="222" font-size="12" fill="#1a1a1a">• Формула h_c = (d_k - d_h) / 2 = (6.0 - 3.4) / 2 = 1.30 мм</text>

  <!-- Red block: Warnings & issues -->
  <rect x="540" y="265" width="360" height="150" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="560" y="290" font-size="13" font-weight="bold" fill="#c0392b">Типові дефекти та застереження</text>
  <text x="560" y="317" font-size="12" fill="#1a1a1a">• Недозенкування (h_c &lt; 1.3 мм): виступ головки над</text>
  <text x="560" y="337" font-size="12" fill="#1a1a1a">  поверхнею, блокування прилягання деталей.</text>
  <text x="560" y="362" font-size="12" fill="#1a1a1a">• Перезенкування (h_c &gt; 1.7 мм): втрата циліндричного</text>
  <text x="560" y="382" font-size="12" fill="#1a1a1a">  пояска (t_cyl = 0), утворення гострої бритвеної кромки.</text>

</svg>
