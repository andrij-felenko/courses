<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Titles -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Геометричні параметри 90-градусного зенкування під гвинт М3 DIN 7991</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Кут конуса 90°, розрахунок глибини h_k = (d_k - d_h)/2 та безпечна залишкова товщина стінки t_rem ≥ 0.5·t_plate</text>

  <!-- Panel 1: Left (x=30..510) Longitudinal section -->
  <rect x="30" y="80" width="480" height="350" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="270" y="106" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Поздовжній розріз отвору в матеріалі</text>

  <!-- Centerline (x=270, y=125 to 405) -->
  <line x1="270" y1="125" x2="270" y2="405" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6,4,2,4"/>

  <!-- Material Plate: Left block (x=110 to 220), Right block (x=320 to 430) -->
  <!-- scale = 30 px/mm. t_plate = 3.0 mm -> 90 px height (y=160 to 250). -->
  <!-- h_k = 1.30 mm -> 39 px depth (y=160 to 199). t_rem = 1.70 mm -> 51 px thickness (y=199 to 250). -->
  <!-- d_k = 6.0 mm -> radius = 3.0 mm -> 90 px from center. Left edge: 180. Right: 360. -->
  <!-- d_h = 3.4 mm -> radius = 1.7 mm -> 51 px from center. Left hole: 219. Right hole: 321. -->
  <polygon points="110,160 180,160 219,199 219,250 110,250" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <polygon points="321,199 360,160 430,160 430,250 321,250" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>

  <!-- Hatching lines -->
  <line x1="120" y1="240" x2="140" y2="220" stroke="#2457d6" stroke-width="1" opacity="0.4"/>
  <line x1="140" y1="240" x2="160" y2="220" stroke="#2457d6" stroke-width="1" opacity="0.4"/>
  <line x1="160" y1="240" x2="180" y2="220" stroke="#2457d6" stroke-width="1" opacity="0.4"/>
  <line x1="180" y1="240" x2="200" y2="220" stroke="#2457d6" stroke-width="1" opacity="0.4"/>

  <line x1="340" y1="240" x2="360" y2="220" stroke="#2457d6" stroke-width="1" opacity="0.4"/>
  <line x1="360" y1="240" x2="380" y2="220" stroke="#2457d6" stroke-width="1" opacity="0.4"/>
  <line x1="380" y1="240" x2="400" y2="220" stroke="#2457d6" stroke-width="1" opacity="0.4"/>
  <line x1="400" y1="240" x2="420" y2="220" stroke="#2457d6" stroke-width="1" opacity="0.4"/>

  <!-- Dimensions on Left Panel -->
  <!-- 1. Diameter d_k = 6.0 mm -->
  <line x1="180" y1="142" x2="180" y2="157" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="360" y1="142" x2="360" y2="157" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="180" y1="149" x2="255" y2="149" stroke="#1a1a1a" stroke-width="1" marker-start="url(#arr)"/>
  <line x1="360" y1="149" x2="285" y2="149" stroke="#1a1a1a" stroke-width="1" marker-start="url(#arr)"/>
  <text x="270" y="140" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">d_k = 6.0 мм</text>

  <!-- 2. Diameter d_h = 3.4 mm -->
  <line x1="219" y1="205" x2="219" y2="225" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="321" y1="205" x2="321" y2="225" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="219" y1="215" x2="252" y2="215" stroke="#1a1a1a" stroke-width="1" marker-start="url(#arr)"/>
  <line x1="321" y1="215" x2="288" y2="215" stroke="#1a1a1a" stroke-width="1" marker-start="url(#arr)"/>
  <text x="270" y="238" font-size="12" fill="#1a1a1a" text-anchor="middle">d_h = 3.4 мм</text>

  <!-- 3. Depth h_k = 1.30 mm -->
  <line x1="72" y1="160" x2="115" y2="160" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="72" y1="199" x2="115" y2="199" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="82" y1="160" x2="82" y2="173" stroke="#1a1a1a" stroke-width="1" marker-start="url(#arr)"/>
  <line x1="82" y1="199" x2="82" y2="186" stroke="#1a1a1a" stroke-width="1" marker-start="url(#arr)"/>
  <text x="50" y="183" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">h_k = 1.30</text>

  <!-- 4. Residual thickness t_rem = 1.70 mm -->
  <line x1="72" y1="250" x2="115" y2="250" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="82" y1="199" x2="82" y2="210" stroke="#1a1a1a" stroke-width="1" marker-start="url(#arr)"/>
  <line x1="82" y1="250" x2="82" y2="239" stroke="#1a1a1a" stroke-width="1" marker-start="url(#arr)"/>
  <text x="48" y="228" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">t_rem = 1.70</text>

  <!-- 5. Total plate thickness t = 3.0 mm -->
  <line x1="425" y1="160" x2="455" y2="160" stroke="#6b7280" stroke-width="1"/>
  <line x1="425" y1="250" x2="455" y2="250" stroke="#6b7280" stroke-width="1"/>
  <line x1="440" y1="160" x2="440" y2="195" stroke="#6b7280" stroke-width="1" marker-start="url(#arr)"/>
  <line x1="440" y1="250" x2="440" y2="215" stroke="#6b7280" stroke-width="1" marker-start="url(#arr)"/>
  <text x="477" y="209" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">t = 3.0 мм</text>

  <!-- Angle 90° arc/text -->
  <path d="M255,178 A20,20 0 0,1 285,178" fill="none" stroke="#2457d6" stroke-width="1.5"/>
  <text x="270" y="172" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">90°</text>

  <!-- Panel 2: Right (x=530..930) Mathematical model & criteria -->
  <rect x="530" y="80" width="400" height="350" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="730" y="106" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Математична модель та критерії безпеки</text>

  <!-- Green block: Depth formula & calculation -->
  <rect x="550" y="120" width="360" height="92" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="730" y="142" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Формула глибини конуса та розрахунок</text>
  <text x="730" y="164" font-size="13" fill="#1a1a1a" text-anchor="middle">h_k = (d_k - d_h) / (2 · tan 45°)</text>
  <text x="730" y="188" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">h_k = (6.0 - 3.4) / 2 = 1.30 мм</text>

  <!-- Green block 2: Residual thickness criterion -->
  <rect x="550" y="222" width="360" height="92" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="730" y="244" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Критерій залишкової товщини (алюміній/пластик)</text>
  <text x="730" y="266" font-size="13" fill="#1a1a1a" text-anchor="middle">t_rem = t_plate - h_k ≥ 0.5 · t_plate</text>
  <text x="730" y="290" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">1.70 мм = 3.0 - 1.30 ≥ 1.50 мм (Безпечно)</text>

  <!-- Red block: Critical destruction zone -->
  <rect x="550" y="324" width="360" height="92" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="730" y="346" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Зона критичного руйнування (t_plate &lt; 1.5 мм)</text>
  <text x="730" y="368" font-size="13" fill="#1a1a1a" text-anchor="middle">t_rem &lt; 0.2 мм або виродження в ножовий край</text>
  <text x="730" y="392" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Ризик виривання конуса під натягом F_p</text>
</svg>
