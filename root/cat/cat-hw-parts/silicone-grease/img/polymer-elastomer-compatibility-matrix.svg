<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Матриця сумісності силіконової змазки SI-180 з пластиками та еластомерами</text>
  <text x="480" y="50" font-size="13" fill="#6b7280" text-anchor="middle">Повна інертність до POM, ABS, нейлону та кілець EPDM/NBR проти руйнування від мінеральних мастил</text>

  <!-- Outer Table Container -->
  <rect x="25" y="70" width="910" height="305" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Table Header Row -->
  <rect x="35" y="80" width="90" height="28" rx="4" fill="#eaf0fd"/>
  <rect x="135" y="80" width="220" height="28" rx="4" fill="#eaf0fd"/>
  <rect x="365" y="80" width="230" height="28" rx="4" fill="#e9f7ef"/>
  <rect x="605" y="80" width="330" height="28" rx="4" fill="#fdecea"/>

  <text x="80" y="99" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Матеріал</text>
  <text x="245" y="99" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Типовий вузол застосування</text>
  <text x="480" y="99" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Силіконова змазка SI-180</text>
  <text x="770" y="99" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Мінеральне мастило (Lithium/Grease)</text>

  <!-- Row 1: POM (Delrin) -->
  <rect x="35" y="116" width="90" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="135" y="116" width="220" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="365" y="116" width="230" height="42" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <rect x="605" y="116" width="330" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <text x="80" y="134" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">POM</text>
  <text x="80" y="148" font-size="10" fill="#6b7280" text-anchor="middle">(Поліацеталь)</text>
  <text x="145" y="134" font-size="11" fill="#1a1a1a">Зубчасті колеса, шестерні,</text>
  <text x="145" y="148" font-size="11" fill="#1a1a1a">гайки ходових гвинтів 3D-принтера</text>
  <text x="480" y="134" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">ВІДМІННО (Повна інертність)</text>
  <text x="480" y="148" font-size="10" fill="#27ae60" text-anchor="middle">Нульове розбухання, низьке тертя</text>
  <text x="615" y="134" font-size="11" fill="#6b7280">Допустимо, але загусники можуть</text>
  <text x="615" y="148" font-size="10" fill="#6b7280">підвищувати зношення при налипанні пилу</text>

  <!-- Row 2: ABS & Polycarbonate -->
  <rect x="35" y="166" width="90" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="135" y="166" width="220" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="365" y="166" width="230" height="42" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <rect x="605" y="166" width="330" height="42" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>

  <text x="80" y="184" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ABS / PC</text>
  <text x="80" y="198" font-size="10" fill="#6b7280" text-anchor="middle">(Аморфні)</text>
  <text x="145" y="184" font-size="11" fill="#1a1a1a">Корпусні деталі, каретки,</text>
  <text x="145" y="198" font-size="11" fill="#1a1a1a">панелі оптичних датчиків</text>
  <text x="480" y="184" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">ВІДМІННО (Безпечно)</text>
  <text x="480" y="198" font-size="10" fill="#27ae60" text-anchor="middle">Жодного ризику розтріскування (ESCR)</text>
  <text x="615" y="184" font-size="11" font-weight="bold" fill="#c0392b">КРИТИЧНО НЕБЕЗПЕЧНО</text>
  <text x="615" y="198" font-size="10" fill="#c0392b">Корозійне розтріскування під напругою (ESCR)</text>

  <!-- Row 3: PA6 / PA66 (Nylon) -->
  <rect x="35" y="216" width="90" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="135" y="216" width="220" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="365" y="216" width="230" height="42" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <rect x="605" y="216" width="330" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <text x="80" y="234" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">PA (Нейлон)</text>
  <text x="80" y="248" font-size="10" fill="#6b7280" text-anchor="middle">(Поліамід)</text>
  <text x="145" y="234" font-size="11" fill="#1a1a1a">Ковзні втулки, ролики напрямних,</text>
  <text x="145" y="248" font-size="11" fill="#1a1a1a">кулачкові механізми</text>
  <text x="480" y="234" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">ВІДМІННО (Стабільність)</text>
  <text x="480" y="248" font-size="10" fill="#27ae60" text-anchor="middle">Зберігає ковзання в парі зі сталлю</text>
  <text x="615" y="234" font-size="11" fill="#6b7280">Задовільно, проте мінеральні оливи</text>
  <text x="615" y="248" font-size="10" fill="#6b7280">вимивають пластифікатори за високої T</text>

  <!-- Row 4: EPDM / NBR (Rubber O-rings) -->
  <rect x="35" y="266" width="90" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="135" y="266" width="220" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="365" y="266" width="230" height="42" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <rect x="605" y="266" width="330" height="42" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>

  <text x="80" y="284" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">NBR / EPDM</text>
  <text x="80" y="298" font-size="10" fill="#6b7280" text-anchor="middle">(Гуми O-ring)</text>
  <text x="145" y="284" font-size="11" fill="#1a1a1a">Ущільнювальні кільця O-ring,</text>
  <text x="145" y="298" font-size="11" fill="#1a1a1a">демпфери, захисні мембрани</text>
  <text x="480" y="284" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">ВІДМІННО (Захист еластомеру)</text>
  <text x="480" y="298" font-size="10" fill="#27ae60" text-anchor="middle">Запобігає пересиханню і розтріскуванню</text>
  <text x="615" y="284" font-size="11" font-weight="bold" fill="#c0392b">КРИТИЧНО ДЛЯ EPDM</text>
  <text x="615" y="298" font-size="10" fill="#c0392b">Руйнівне розбухання (&gt;50%) та втрата форми</text>

  <!-- Row 5: Silicone Rubber (VMQ) -->
  <rect x="35" y="316" width="90" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="135" y="316" width="220" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <rect x="365" y="316" width="230" height="42" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <rect x="605" y="316" width="330" height="42" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <text x="80" y="334" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">VMQ</text>
  <text x="80" y="348" font-size="10" fill="#6b7280" text-anchor="middle">(Силікон)</text>
  <text x="145" y="334" font-size="11" fill="#1a1a1a">Силіконові мембрани, трубки,</text>
  <text x="145" y="348" font-size="11" fill="#1a1a1a">прозорі силіконові ущільнювачі</text>
  <text x="480" y="334" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">НЕСУМІСНО (Розбухання)</text>
  <text x="480" y="348" font-size="10" fill="#c0392b" text-anchor="middle">Полімер розчиняється у власній оливі</text>
  <text x="615" y="334" font-size="11" fill="#27ae60">Стійкий до більшості мінеральних мастил,</text>
  <text x="615" y="348" font-size="10" fill="#27ae60">але потребує перевірки на присадки</text>

  <!-- Bottom Summary Note Panel -->
  <rect x="25" y="388" width="910" height="52" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="408" font-size="12" font-weight="bold" fill="#2457d6">Золоте правило сумісності:</text>
  <text x="215" y="408" font-size="12" fill="#1a1a1a">SI-180 хімічно нейтральна до конструкційних пластиків (POM, ABS, PA) та нафтостійких гум (NBR, EPDM).</text>
  <text x="45" y="428" font-size="11" fill="#c0392b">Застереження:</text>
  <text x="145" y="428" font-size="11" fill="#6b7280">Категорично заборонено змащувати силіконові ущільнювачі (VMQ) силіконовою змазкою через розбухання («подібне розчиняє подібне»).</text>
</svg>
