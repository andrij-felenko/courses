<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Хімічна структура ПДМС та температурна стабільність в'язкості SI-180</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Силоксановий ланцюг забезпечує збереження в'язкості від -40°C до +180°C проти мінеральних мастил</text>

  <!-- Left Panel: Molecular Structure -->
  <rect x="25" y="70" width="445" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="247" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Молекулярна структура полідиметилсилоксану (ПДМС)</text>

  <!-- Sub-box for Chemical Formula -->
  <rect x="45" y="115" width="405" height="175" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Repeat unit brackets -->
  <path d="M125,135 L105,135 L105,265 L125,265" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <path d="M370,135 L390,135 L390,265 L370,265" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <text x="400" y="272" font-size="14" font-weight="bold" fill="#6b7280">n</text>

  <!-- Atoms & Bonds -->
  <line x1="85" y1="200" x2="135" y2="200" stroke="#1a1a1a" stroke-width="2"/>

  <!-- O atom 1 -->
  <circle cx="150" cy="200" r="15" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="150" y="205" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">O</text>

  <!-- Bond O - Si -->
  <line x1="165" y1="200" x2="224" y2="200" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Si atom -->
  <circle cx="240" cy="200" r="16" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="240" y="205" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Si</text>

  <!-- Methyl group top -->
  <line x1="240" y1="184" x2="240" y2="152" stroke="#1a1a1a" stroke-width="2"/>
  <text x="240" y="146" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">CH3</text>

  <!-- Methyl group bottom -->
  <line x1="240" y1="216" x2="240" y2="248" stroke="#1a1a1a" stroke-width="2"/>
  <text x="240" y="262" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">CH3</text>

  <!-- Bond Si - O -->
  <line x1="256" y1="200" x2="315" y2="200" stroke="#1a1a1a" stroke-width="2"/>

  <!-- O atom 2 -->
  <circle cx="330" cy="200" r="15" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="330" y="205" font-size="14" font-weight="bold" fill="#c0392b" text-anchor="middle">O</text>

  <!-- Outgoing bond -->
  <line x1="345" y1="200" x2="410" y2="200" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Annotations in left panel -->
  <rect x="45" y="300" width="405" height="120" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="322" font-size="12" font-weight="bold" fill="#2457d6">• Силоксановий зв'язок Si-O-Si: висока енергія (445 кДж/моль)</text>
  <text x="55" y="342" font-size="12" fill="#1a1a1a">• Великий валентний кут (~143°) та гнучкість полімерного ланцюга</text>
  <text x="55" y="362" font-size="12" fill="#1a1a1a">• Метильні групи -CH3 екранують кістяк: гідрофобність і хімічна інертність</text>
  <text x="55" y="382" font-size="12" fill="#27ae60">• Не викликає розбухання чи деградації пластиків (POM, нейлон, PC)</text>
  <text x="55" y="402" font-size="12" fill="#6b7280">• Температура склування Tg = -125°C: відсутність крихкості на холоді</text>

  <!-- Right Panel: Viscosity vs Temperature Graph -->
  <rect x="490" y="70" width="445" height="365" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="712" y="98" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">В'язкість залежно від температури (VI &gt; 300)</text>

  <!-- Inner Graph Box -->
  <rect x="510" y="115" width="405" height="235" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <!-- Temperature Operating Band indicator at top -->
  <line x1="580" y1="130" x2="820" y2="130" stroke="#27ae60" stroke-width="2"/>
  <line x1="580" y1="126" x2="580" y2="134" stroke="#27ae60" stroke-width="2"/>
  <line x1="820" y1="126" x2="820" y2="134" stroke="#27ae60" stroke-width="2"/>
  <text x="700" y="145" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Робочий діапазон SI-180: від -40°C до +180°C</text>

  <!-- Axes (origin at x=560, y=310) -->
  <line x1="560" y1="310" x2="895" y2="310" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="560" y1="310" x2="560" y2="150" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Axis titles -->
  <text x="898" y="328" font-size="11" font-weight="bold" fill="#1a1a1a">T, °C</text>
  <text x="532" y="148" font-size="11" font-weight="bold" fill="#1a1a1a">η, Па·с</text>

  <!-- X ticks & labels (clearing axis) -->
  <line x1="580" y1="310" x2="580" y2="315" stroke="#1a1a1a" stroke-width="1"/>
  <text x="580" y="328" font-size="10" fill="#6b7280" text-anchor="middle">-40</text>

  <line x1="640" y1="310" x2="640" y2="315" stroke="#1a1a1a" stroke-width="1"/>
  <text x="640" y="328" font-size="10" fill="#6b7280" text-anchor="middle">0</text>

  <line x1="700" y1="310" x2="700" y2="315" stroke="#1a1a1a" stroke-width="1"/>
  <text x="700" y="328" font-size="10" fill="#6b7280" text-anchor="middle">+60</text>

  <line x1="760" y1="310" x2="760" y2="315" stroke="#1a1a1a" stroke-width="1"/>
  <text x="760" y="328" font-size="10" fill="#6b7280" text-anchor="middle">+120</text>

  <line x1="820" y1="310" x2="820" y2="315" stroke="#1a1a1a" stroke-width="1"/>
  <text x="820" y="328" font-size="10" fill="#6b7280" text-anchor="middle">+180</text>

  <!-- Curve 1: Mineral oil (steep fall, freezes early) -->
  <path d="M585,160 Q620,240 680,275 T770,298" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-dasharray="5,3"/>
  <circle cx="770" cy="298" r="3.5" fill="#c0392b"/>

  <!-- Curve 2: Silicone SI-180 / PDMS (gentle slope, stays liquid from -40 to +180) -->
  <path d="M575,200 Q660,225 750,242 T865,258" fill="none" stroke="#2457d6" stroke-width="3"/>

  <!-- Direct labels near curves with clear space -->
  <text x="760" y="195" font-size="11" font-weight="bold" fill="#2457d6">Силікон SI-180 (VI &gt; 300)</text>
  <text x="760" y="210" font-size="10" fill="#2457d6">стабільна плівка</text>

  <text x="630" y="172" font-size="11" font-weight="bold" fill="#c0392b">Мінеральне мастило</text>
  <text x="630" y="186" font-size="10" fill="#c0392b">загусання / деградація</text>

  <!-- Legend / Notes below Graph -->
  <rect x="510" y="360" width="405" height="60" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="520" y="380" font-size="11" font-weight="bold" fill="#1a1a1a">• Нижче -20°C: мінеральна основа гусне і блокує пластикові передачі</text>
  <text x="520" y="398" font-size="11" font-weight="bold" fill="#c0392b">• Вище +100°C: мінеральне масло окислюється та випаровується</text>
  <text x="520" y="414" font-size="11" font-weight="bold" fill="#27ae60">• SI-180 зберігає рухливість плівки та мастильну здатність до +180°C</text>
</svg>
