<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Аніонна полімеризація ціаноакрилату та вплив зазору</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Реакція ініціюється поверхневою вологою, а оптимальний зазор становить до 0.05–0.1 мм</text>

  <!-- Left Panel: Molecular Reaction / Mechanism -->
  <rect x="40" y="80" width="420" height="340" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="250" y="110" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Механізм аніонної полімеризації</text>

  <!-- Reaction steps boxes -->
  <rect x="60" y="130" width="380" height="70" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="80" y="155" font-size="13" font-weight="bold" fill="#2457d6">1. Ініціювання (Surface Moisture)</text>
  <text x="80" y="175" font-size="12" fill="#1a1a1a">OH⁻ (від вологи) атакує подвійний зв'язок мономеру CH₂=C(CN)COOR</text>

  <rect x="60" y="215" width="380" height="70" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="80" y="240" font-size="13" font-weight="bold" fill="#2457d6">2. Ланцюгове зростання (Propagation)</text>
  <text x="80" y="260" font-size="12" fill="#1a1a1a">Швидке приєднання наступних молекул мономеру, утворення ниток</text>

  <rect x="60" y="300" width="380" height="70" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="80" y="325" font-size="13" font-weight="bold" fill="#27ae60">3. Затвердіння (Polymer Network)</text>
  <text x="80" y="345" font-size="12" fill="#1a1a1a">Формування міцного просторового полімерного каркаса</text>

  <!-- Right Panel: Gap Effect -->
  <rect x="500" y="80" width="420" height="340" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="710" y="110" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вплив товщини зазору на полімеризацію</text>

  <!-- Optimal Gap Box -->
  <rect x="520" y="135" width="380" height="110" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="540" y="160" font-size="14" font-weight="bold" fill="#27ae60">Оптимальний зазор: δ &lt; 0.05–0.1 мм</text>
  <text x="540" y="185" font-size="12" fill="#1a1a1a">• Швидке поширення вологи з повітря та поверхонь</text>
  <text x="540" y="205" font-size="12" fill="#1a1a1a">• Максимальна швидкість затвердіння та висока міцність</text>
  <text x="540" y="225" font-size="12" fill="#1a1a1a">• Рівномірне утворення міцного клейового шва</text>

  <!-- Excessive Gap Box -->
  <rect x="520" y="260" width="380" height="110" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="540" y="285" font-size="14" font-weight="bold" fill="#c0392b">Великий зазор: δ &gt; 0.15–0.2 мм</text>
  <text x="540" y="310" font-size="12" fill="#1a1a1a">• Нестача вологи всередині об'єму краплі</text>
  <text x="540" y="330" font-size="12" fill="#1a1a1a">• Різке уповільнення реакції або неповне затвердіння</text>
  <text x="540" y="350" font-size="12" fill="#1a1a1a">• Потреба у застосуванні активаторів / праймерів</text>

</svg>
