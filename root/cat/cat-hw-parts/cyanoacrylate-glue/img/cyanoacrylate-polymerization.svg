<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Аніонна полімеризація ціаноакрилату</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Від молекули мономеру та атаки гідроксид-іона до утворення полімерного ланцюга</text>

  <!-- Panel 1: Monomer -->
  <rect x="40" y="85" width="260" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="170" y="115" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Мономер ціаноакрилату</text>

  <rect x="60" y="135" width="220" height="230" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  
  <text x="170" y="165" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">CH₂ = C(CN)(COOCH₃)</text>
  
  <rect x="75" y="185" width="190" height="70" rx="4" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1"/>
  <text x="85" y="207" font-size="12" fill="#1a1a1a">• Подвійний зв'язок C=C</text>
  <text x="85" y="225" font-size="12" fill="#1a1a1a">• Цианогрупа (-CN)</text>
  <text x="85" y="243" font-size="12" fill="#1a1a1a">• Естерна група (-COOR)</text>

  <text x="170" y="285" font-size="12" fill="#6b7280" text-anchor="middle">Сильно поляризована</text>
  <text x="170" y="303" font-size="12" fill="#6b7280" text-anchor="middle">молекула (електрофільний</text>
  <text x="170" y="321" font-size="12" fill="#6b7280" text-anchor="middle">центр на вуглеці)</text>

  <text x="170" y="390" font-size="12" fill="#1a1a1a" text-anchor="middle">Вихідний рідкий мономер</text>

  <!-- Arrow 1 to 2 -->
  <line x1="300" y1="260" x2="332" y2="260" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Panel 2: Initiation -->
  <rect x="340" y="85" width="260" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="470" y="115" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Ініціація (атака OH⁻)</text>

  <rect x="360" y="135" width="220" height="230" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <rect x="375" y="150" width="190" height="85" rx="4" fill="#fdecea" stroke="#d0d7de" stroke-width="1"/>
  <text x="470" y="172" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Волога з поверхні</text>
  <text x="385" y="195" font-size="12" fill="#1a1a1a">Гідроксид-іон (OH⁻)</text>
  <text x="385" y="213" font-size="12" fill="#1a1a1a">атакує вуглець C=C</text>

  <text x="470" y="258" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">OH⁻ + CH₂=C(CN)...</text>
  <text x="470" y="285" font-size="12" fill="#1a1a1a" text-anchor="middle">Відкриття подвійного</text>
  <text x="470" y="303" font-size="12" fill="#1a1a1a" text-anchor="middle">зв'язку та утворення</text>
  <text x="470" y="321" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">активного карбаніону</text>

  <text x="470" y="390" font-size="12" fill="#1a1a1a" text-anchor="middle">Миттєвий старт реакції</text>

  <!-- Arrow 2 to 3 -->
  <line x1="600" y1="260" x2="632" y2="260" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Panel 3: Polymerization -->
  <rect x="640" y="85" width="280" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="780" y="115" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">3. Полімеризація ланцюга</text>

  <rect x="660" y="135" width="240" height="230" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

  <rect x="675" y="150" width="210" height="85" rx="4" fill="#e9f7ef" stroke="#d0d7de" stroke-width="1"/>
  <text x="780" y="172" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Швидке ланцюгове зростання</text>
  <text x="685" y="195" font-size="12" fill="#1a1a1a">Карбаніон атакує</text>
  <text x="685" y="213" font-size="12" fill="#1a1a1a">наступний мономер</text>

  <text x="780" y="258" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">-[-CH₂-C(CN)(COOR)-]ₙ-</text>
  <text x="780" y="285" font-size="12" fill="#1a1a1a" text-anchor="middle">Формування міцного</text>
  <text x="780" y="303" font-size="12" fill="#1a1a1a" text-anchor="middle">полімерного каркаса</text>
  <text x="780" y="321" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">тверде з'єднання</text>

  <text x="780" y="390" font-size="12" fill="#1a1a1a" text-anchor="middle">Полімеризація завершена</text>

</svg>
