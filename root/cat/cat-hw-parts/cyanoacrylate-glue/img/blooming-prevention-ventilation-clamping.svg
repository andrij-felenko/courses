<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Запобігання побілінню ціаноакрилатного шва (Blooming)</text>
  <text x="480" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Вплив випарів мономеру, концентрації вологи та вентиляції на якість склеювання</text>

  <!-- Left Panel: Problem (No ventilation) -->
  <rect x="30" y="80" width="435" height="345" rx="8" fill="#fdecea" stroke="#d0d7de" stroke-width="1"/>
  <rect x="50" y="100" width="395" height="40" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="247" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">Без вентиляції: Утворення білого нальоту</text>

  <!-- Details / Schematic Left -->
  <!-- Part 1 Top -->
  <rect x="90" y="180" width="315" height="35" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="247" y="202" text-anchor="middle" font-size="12" fill="#1a1a1a">Верхня деталі корпусу</text>

  <!-- Glue joint left -->
  <rect x="235" y="215" width="75" height="8" fill="#2457d6"/>
  
  <!-- Part 2 Bottom -->
  <rect x="90" y="223" width="315" height="35" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="247" y="245" text-anchor="middle" font-size="12" fill="#1a1a1a">Нижня деталі корпусу</text>

  <!-- Vapor cloud / blooming particles -->
  <circle cx="180" cy="170" r="14" fill="#ffffff" opacity="0.8" stroke="#c0392b" stroke-dasharray="2,2"/>
  <circle cx="320" cy="165" r="18" fill="#ffffff" opacity="0.8" stroke="#c0392b" stroke-dasharray="2,2"/>
  <circle cx="210" cy="155" r="10" fill="#ffffff" opacity="0.8" stroke="#c0392b" stroke-dasharray="2,2"/>
  <text x="247" y="160" text-anchor="middle" font-size="12" fill="#c0392b">Випари мономеру</text>

  <!-- Arrows indicating deposition -->
  <path d="M190,185 L210,210" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <path d="M305,185 L285,210" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <text x="247" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#c0392b">Осадження нальоту навколо шва</text>
  <text x="247" y="322" text-anchor="middle" font-size="12" fill="#1a1a1a">Мономер випаровується у повітря та полімеризується</text>
  <text x="247" y="340" text-anchor="middle" font-size="12" fill="#1a1a1a">на поверхнях під дією вологи, утворюючи</text>
  <text x="247" y="358" text-anchor="middle" font-size="12" fill="#1a1a1a">характерний білий матовий наліт (Blooming).</text>

  <!-- Warning box -->
  <rect x="50" y="380" width="395" height="30" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="247" y="400" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">⚠ Естетичний дефект та ослаблення з'єднання</text>


  <!-- Right Panel: Solution (Ventilation & Clamping) -->
  <rect x="495" y="80" width="435" height="345" rx="8" fill="#e9f7ef" stroke="#d0d7de" stroke-width="1"/>
  <rect x="515" y="100" width="395" height="40" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="712" y="125" text-anchor="middle" font-size="14" font-weight="bold" fill="#27ae60">З вентиляцією та правильним притиском</text>

  <!-- Details / Schematic Right -->
  <!-- Part 1 Top -->
  <rect x="555" y="180" width="315" height="35" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="712" y="202" text-anchor="middle" font-size="12" fill="#1a1a1a">Верхня деталі корпусу</text>

  <!-- Clamping arrows -->
  <path d="M712,158 L712,176" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <path d="M712,260 L712,242" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="755" y="170" font-size="12" font-weight="bold" fill="#2457d6">Притиск</text>

  <!-- Glue joint right -->
  <rect x="700" y="215" width="25" height="8" fill="#27ae60"/>

  <!-- Part 2 Bottom -->
  <rect x="555" y="223" width="315" height="35" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="712" y="245" text-anchor="middle" font-size="12" fill="#1a1a1a">Нижня деталі корпусу</text>

  <!-- Airflow / Ventilation arrow -->
  <path d="M510,197 L545,197" fill="none" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <path d="M875,197 L910,197" fill="none" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>
  <text x="712" y="160" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Примусовий обдування / витяжка</text>

  <text x="712" y="300" text-anchor="middle" font-size="13" font-weight="bold" fill="#27ae60">Чистий і міцний шов без нальоту</text>
  <text x="712" y="322" text-anchor="middle" font-size="12" fill="#1a1a1a">Рух повітря швидко видаляє випари мономеру,</text>
  <text x="712" y="340" text-anchor="middle" font-size="12" fill="#1a1a1a">а стабільний механічний притиск забезпечує</text>
  <text x="712" y="358" text-anchor="middle" font-size="12" fill="#1a1a1a">мінімальний технологічний зазор і високу міцність.</text>

  <!-- Success box -->
  <rect x="515" y="380" width="395" height="30" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="712" y="400" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">✓ Естетична досконалість та надійність з'єднання</text>

</svg>
