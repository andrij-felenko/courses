<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Titles -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Латунні та нейлонові стійки: заземлення проти ізоляції</text>
  <text x="480" y="52" text-anchor="middle" font-size="13" fill="#6b7280">Низькоімпедансний контакт GND на металеве шасі проти гальванічного діелектричного барʼєра</text>

  <!-- PANEL 1: Brass Grounding -->
  <rect x="30" y="75" width="435" height="355" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="2"/>
  <rect x="45" y="87" width="190" height="24" rx="4" fill="#eaf0fd"/>
  <text x="140" y="103" text-anchor="middle" font-size="11" font-weight="bold" fill="#2457d6">ЗАЗЕМЛЕННЯ НА ШАСІ (GND)</text>

  <text x="45" y="132" font-size="14" font-weight="bold" fill="#1a1a1a">Латунна стійка CW614N</text>
  <text x="45" y="150" font-size="12" fill="#6b7280">Прямий електричний звʼязок сигнальної землі з корпусом</text>

  <!-- Diagram 1 -->
  <!-- Upper PCB -->
  <rect x="70" y="170" width="120" height="12" fill="#27ae60"/>
  <rect x="235" y="170" width="120" height="12" fill="#27ae60"/>
  <text x="70" y="164" font-size="11" font-weight="bold" fill="#27ae60">Плата FR4</text>

  <!-- Exposed Copper Pad on PCB -->
  <rect x="160" y="168" width="30" height="16" fill="#fef5e7" stroke="#b7950b" stroke-width="1"/>
  <rect x="235" y="168" width="30" height="16" fill="#fef5e7" stroke="#b7950b" stroke-width="1"/>
  <text x="315" y="164" font-size="11" fill="#b7950b">Майданчик GND</text>

  <!-- Brass Standoff Body -->
  <rect x="175" y="185" width="75" height="90" fill="#fef5e7" stroke="#b7950b" stroke-width="2"/>
  <line x1="200" y1="185" x2="200" y2="275" stroke="#b7950b" stroke-width="1"/>
  <line x1="225" y1="185" x2="225" y2="275" stroke="#b7950b" stroke-width="1"/>
  <text x="212" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Латунь</text>

  <!-- Metal Chassis -->
  <rect x="55" y="278" width="315" height="16" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="70" y="310" font-size="11" font-weight="bold" fill="#1a1a1a">Металеве шасі корпусу</text>

  <!-- Current Path Arrows -->
  <line x1="140" y1="185" x2="140" y2="270" stroke="#2457d6" stroke-width="2.5" stroke-dasharray="4 2" marker-end="url(#arr-blue)"/>
  <text x="130" y="230" text-anchor="end" font-size="11" font-weight="bold" fill="#2457d6">Струм GND</text>

  <!-- Ground symbol -->
  <line x1="285" y1="295" x2="315" y2="295" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="290" y1="300" x2="310" y2="300" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="295" y1="305" x2="305" y2="305" stroke="#1a1a1a" stroke-width="2"/>
  <text x="325" y="303" font-size="11" font-weight="bold" fill="#1a1a1a">GND</text>

  <!-- Bottom Badges 1 -->
  <rect x="45" y="330" width="405" height="34" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="351" font-size="12" fill="#1a1a1a">Опір переходу: R &lt; 0.01 Ом | Захист від ESD та завад</text>

  <rect x="45" y="375" width="405" height="34" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="247" y="396" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Спільний низькоімпедансний контур</text>


  <!-- PANEL 2: Nylon Isolation -->
  <rect x="495" y="75" width="435" height="355" rx="8" fill="#f4f6f8" stroke="#27ae60" stroke-width="2"/>
  <rect x="510" y="87" width="190" height="24" rx="4" fill="#e9f7ef"/>
  <text x="605" y="103" text-anchor="middle" font-size="11" font-weight="bold" fill="#27ae60">ГАЛЬВАНІЧНА РОЗВʼЯЗКА</text>

  <text x="510" y="132" font-size="14" font-weight="bold" fill="#1a1a1a">Нейлонова стійка PA66</text>
  <text x="510" y="150" font-size="12" fill="#6b7280">Повна електрична ізоляція плати від металевого шасі</text>

  <!-- Diagram 2 -->
  <!-- Upper PCB with Keepout Zone -->
  <rect x="535" y="170" width="120" height="12" fill="#27ae60"/>
  <rect x="700" y="170" width="120" height="12" fill="#27ae60"/>
  <text x="535" y="164" font-size="11" font-weight="bold" fill="#27ae60">Плата FR4</text>
  <text x="740" y="164" font-size="11" fill="#6b7280">Зона keepout</text>

  <!-- Nylon Standoff Body -->
  <rect x="640" y="185" width="75" height="90" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="665" y1="185" x2="665" y2="275" stroke="#d0d7de" stroke-width="1.5"/>
  <line x1="690" y1="185" x2="690" y2="275" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="677" y="235" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">Нейлон</text>

  <!-- Metal Chassis -->
  <rect x="520" y="278" width="315" height="16" fill="#d0d7de" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="535" y="310" font-size="11" font-weight="bold" fill="#1a1a1a">Металеве шасі корпусу</text>

  <!-- Isolation Barrier Symbol -->
  <line x1="600" y1="215" x2="620" y2="245" stroke="#c0392b" stroke-width="3"/>
  <line x1="608" y1="215" x2="628" y2="245" stroke="#c0392b" stroke-width="3"/>
  <text x="590" y="235" text-anchor="end" font-size="11" font-weight="bold" fill="#c0392b">Ізолятор</text>

  <!-- Bottom Badges 2 -->
  <rect x="510" y="330" width="405" height="34" rx="4" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="520" y="351" font-size="12" fill="#1a1a1a">Опір ізоляції: R &gt; 10¹² Ом | Міцність: 15–20 кВ/мм</text>

  <rect x="510" y="375" width="405" height="34" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712" y="396" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">Запобігання земляним петлям і пробоям</text>
</svg>
