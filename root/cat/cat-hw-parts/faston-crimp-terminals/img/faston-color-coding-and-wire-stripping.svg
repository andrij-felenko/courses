<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-start" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Header -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Колірне маркування та геометрія зачищення клем Faston</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Відповідність колірного коду перерізу провідника та правила підготовки жили</text>

  <!-- Left Panel: Color Coding -->
  <rect x="30" y="75" width="435" height="445" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Колірне маркування за перерізом провідника</text>

  <!-- Card 1: Red -->
  <g id="card-red">
    <rect x="45" y="115" width="405" height="110" rx="6" fill="#ffffff" stroke="#e1e4e8" stroke-width="1"/>
    <rect x="55" y="125" width="10" height="90" rx="3" fill="#e74c3c"/>
    
    <!-- Red Terminal Graphic -->
    <g transform="translate(0, 0)">
      <!-- Wire -->
      <rect x="75" y="162" width="20" height="16" rx="2" fill="#34495e"/>
      <line x1="95" y1="166" x2="105" y2="166" stroke="#d35400" stroke-width="2"/>
      <line x1="95" y1="170" x2="105" y2="170" stroke="#f39c12" stroke-width="2"/>
      <line x1="95" y1="174" x2="105" y2="174" stroke="#d35400" stroke-width="2"/>
      <!-- Red Sleeve -->
      <rect x="105" y="152" width="42" height="36" rx="4" fill="#e74c3c"/>
      <!-- Metal Tab -->
      <path d="M 147,160 L 175,160 L 175,180 L 147,180 Z" fill="#b0bec5" stroke="#78909c" stroke-width="1"/>
      <circle cx="165" cy="170" r="2.5" fill="#ffffff"/>
    </g>

    <!-- Red Details -->
    <text x="185" y="140" font-size="14" font-weight="bold" fill="#c0392b">Червоний маркер (Red)</text>
    <text x="185" y="162" font-size="13" fill="#1a1a1a">Переріз жили: <tspan font-weight="bold">0,5 – 1,5 мм²</tspan></text>
    <text x="185" y="182" font-size="13" fill="#6b7280">Калібр дроту: <tspan fill="#1a1a1a" font-weight="bold">AWG 22 – 16</tspan></text>
    <text x="185" y="202" font-size="12" fill="#6b7280">Максимальний струм: <tspan fill="#1a1a1a">до 10 A – 15 A</tspan></text>
  </g>

  <!-- Card 2: Blue -->
  <g id="card-blue">
    <rect x="45" y="237" width="405" height="110" rx="6" fill="#ffffff" stroke="#e1e4e8" stroke-width="1"/>
    <rect x="55" y="247" width="10" height="90" rx="3" fill="#2980b9"/>
    
    <!-- Blue Terminal Graphic -->
    <g transform="translate(0, 0)">
      <!-- Wire -->
      <rect x="75" y="284" width="20" height="16" rx="2" fill="#34495e"/>
      <line x1="95" y1="288" x2="105" y2="288" stroke="#d35400" stroke-width="2.5"/>
      <line x1="95" y1="292" x2="105" y2="292" stroke="#f39c12" stroke-width="2.5"/>
      <line x1="95" y1="296" x2="105" y2="296" stroke="#d35400" stroke-width="2.5"/>
      <!-- Blue Sleeve -->
      <rect x="105" y="274" width="42" height="36" rx="4" fill="#2980b9"/>
      <!-- Metal Tab -->
      <path d="M 147,282 L 175,282 L 175,302 L 147,302 Z" fill="#b0bec5" stroke="#78909c" stroke-width="1"/>
      <circle cx="165" cy="292" r="2.5" fill="#ffffff"/>
    </g>

    <!-- Blue Details -->
    <text x="185" y="262" font-size="14" font-weight="bold" fill="#1f618d">Синій маркер (Blue)</text>
    <text x="185" y="284" font-size="13" fill="#1a1a1a">Переріз жили: <tspan font-weight="bold">1,5 – 2,5 мм²</tspan></text>
    <text x="185" y="304" font-size="13" fill="#6b7280">Калібр дроту: <tspan fill="#1a1a1a" font-weight="bold">AWG 16 – 14</tspan></text>
    <text x="185" y="324" font-size="12" fill="#6b7280">Максимальний струм: <tspan fill="#1a1a1a">до 15 A – 20 A</tspan></text>
  </g>

  <!-- Card 3: Yellow -->
  <g id="card-yellow">
    <rect x="45" y="359" width="405" height="110" rx="6" fill="#ffffff" stroke="#e1e4e8" stroke-width="1"/>
    <rect x="55" y="369" width="10" height="90" rx="3" fill="#f39c12"/>
    
    <!-- Yellow Terminal Graphic -->
    <g transform="translate(0, 0)">
      <!-- Wire -->
      <rect x="75" y="406" width="20" height="16" rx="2" fill="#34495e"/>
      <line x1="95" y1="410" x2="105" y2="410" stroke="#d35400" stroke-width="3"/>
      <line x1="95" y1="414" x2="105" y2="414" stroke="#f39c12" stroke-width="3"/>
      <line x1="95" y1="418" x2="105" y2="418" stroke="#d35400" stroke-width="3"/>
      <!-- Yellow Sleeve -->
      <rect x="105" y="396" width="42" height="36" rx="4" fill="#f39c12"/>
      <!-- Metal Tab -->
      <path d="M 147,404 L 175,404 L 175,424 L 147,424 Z" fill="#b0bec5" stroke="#78909c" stroke-width="1"/>
      <circle cx="165" cy="414" r="2.5" fill="#ffffff"/>
    </g>

    <!-- Yellow Details -->
    <text x="185" y="384" font-size="14" font-weight="bold" fill="#b7950b">Жовтий маркер (Yellow)</text>
    <text x="185" y="406" font-size="13" fill="#1a1a1a">Переріз жили: <tspan font-weight="bold">4,0 – 6,0 мм²</tspan></text>
    <text x="185" y="426" font-size="13" fill="#6b7280">Калібр дроту: <tspan fill="#1a1a1a" font-weight="bold">AWG 12 – 10</tspan></text>
    <text x="185" y="446" font-size="12" fill="#6b7280">Максимальний струм: <tspan fill="#1a1a1a">до 24 A – 30 A</tspan></text>
  </g>

  <!-- Panel 1 Note -->
  <rect x="45" y="476" width="405" height="34" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="247" y="497" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Типорозміри контактів Faston: 2,8 мм • 4,8 мм • 6,3 мм</text>

  <!-- Right Panel: Stripping & Crimp Geometry -->
  <rect x="495" y="75" width="435" height="445" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="712" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Геометрія зачищення та зони опресування</text>

  <!-- Sub-panel A: Stripping Geometry -->
  <rect x="510" y="115" width="405" height="170" rx="6" fill="#ffffff" stroke="#e1e4e8" stroke-width="1"/>
  <text x="525" y="135" font-size="13" font-weight="bold" fill="#2457d6">А. Геометрія підготовки провідника</text>

  <!-- Wire Graphic A -->
  <g transform="translate(0, 0)">
    <!-- Insulated Wire -->
    <rect x="530" y="177" width="120" height="36" rx="4" fill="#34495e"/>
    <line x1="530" y1="184" x2="650" y2="184" stroke="#4a6572" stroke-width="1.5"/>
    <line x1="530" y1="206" x2="650" y2="206" stroke="#21272b" stroke-width="1.5"/>
    
    <!-- Bare Strands -->
    <rect x="650" y="184" width="110" height="22" fill="#d35400"/>
    <line x1="650" y1="188" x2="760" y2="188" stroke="#f39c12" stroke-width="1.5"/>
    <line x1="650" y1="192" x2="760" y2="192" stroke="#e67e22" stroke-width="1.5"/>
    <line x1="650" y1="196" x2="760" y2="196" stroke="#f39c12" stroke-width="1.5"/>
    <line x1="650" y1="200" x2="760" y2="200" stroke="#e67e22" stroke-width="1.5"/>
    <line x1="650" y1="204" x2="760" y2="204" stroke="#f39c12" stroke-width="1.5"/>
  </g>

  <!-- Dimension Line L_strip -->
  <line x1="650" y1="218" x2="650" y2="236" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="760" y1="208" x2="760" y2="236" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="650" y1="230" x2="760" y2="230" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-start)" marker-end="url(#arr)"/>
  <text x="705" y="252" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Довжина зачищення L<tspan font-size="10" dy="2">strip</tspan><tspan font-size="12" dy="-2"> = 5,0 – 7,0 мм (L<tspan font-size="10" dy="2">обтиску</tspan><tspan font-size="12" dy="-2"> + 1 мм)</tspan></text>

  <!-- Annotations A -->
  <path d="M 575,160 L 645,175" stroke="#27ae60" stroke-width="1.2" fill="none" marker-end="url(#arr-green)"/>
  <text x="575" y="153" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Рівний зріз ізоляції</text>

  <path d="M 815,160 L 755,182" stroke="#27ae60" stroke-width="1.2" fill="none" marker-end="url(#arr-green)"/>
  <text x="815" y="153" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Непошкоджені жили</text>

  <!-- Sub-panel B: Position & Crimp Zones -->
  <rect x="510" y="297" width="405" height="213" rx="6" fill="#ffffff" stroke="#e1e4e8" stroke-width="1"/>
  <text x="525" y="317" font-size="13" font-weight="bold" fill="#2457d6">Б. Позиціонування дроту в наконечнику</text>

  <!-- Terminal & Wire Graphic B -->
  <g transform="translate(0, 0)">
    <!-- Wire entering terminal -->
    <rect x="525" y="377" width="80" height="26" rx="3" fill="#34495e"/>
    
    <!-- Outer Translucent Sleeve -->
    <rect x="595" y="366" width="135" height="48" rx="5" fill="#2457d6" fill-opacity="0.12" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4 2"/>
    
    <!-- Insulation Crimp Barrel -->
    <rect x="600" y="372" width="35" height="36" rx="3" fill="#b0bec5" stroke="#546e7a" stroke-width="1.2"/>
    <!-- Wire Crimp Barrel -->
    <rect x="650" y="375" width="45" height="30" rx="2" fill="#b0bec5" stroke="#546e7a" stroke-width="1.2"/>
    <!-- Mating Socket Part -->
    <rect x="705" y="373" width="65" height="34" rx="2" fill="#cfd8dc" stroke="#546e7a" stroke-width="1.5"/>
    <line x1="705" y1="390" x2="770" y2="390" stroke="#78909c" stroke-width="1"/>

    <!-- Copper Wire inside -->
    <rect x="600" y="380" width="25" height="20" rx="2" fill="#34495e"/>
    <rect x="625" y="383" width="85" height="14" fill="#d35400"/>
    <line x1="625" y1="386" x2="710" y2="386" stroke="#f39c12" stroke-width="1"/>
    <line x1="625" y1="390" x2="710" y2="390" stroke="#e67e22" stroke-width="1"/>
    <line x1="625" y1="394" x2="710" y2="394" stroke="#f39c12" stroke-width="1"/>
  </g>

  <!-- Callouts B -->
  <!-- Insulation Crimp Callout -->
  <path d="M 575,358 L 615,370" stroke="#1a1a1a" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <text x="575" y="340" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Обтиск по ізоляції</text>
  <text x="575" y="354" font-size="11" fill="#6b7280" text-anchor="middle">(механічна фіксація)</text>

  <!-- Wire Crimp Callout -->
  <path d="M 730,358 L 675,373" stroke="#1a1a1a" stroke-width="1.2" fill="none" marker-end="url(#arr)"/>
  <text x="730" y="340" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Обтиск по жилі</text>
  <text x="730" y="354" font-size="11" fill="#6b7280" text-anchor="middle">(електричний контакт)</text>

  <!-- Wire Protrusion Callout -->
  <path d="M 815,388 L 715,390" stroke="#27ae60" stroke-width="1.2" fill="none" marker-end="url(#arr-green)"/>
  <text x="850" y="382" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Виступ жили</text>
  <text x="850" y="396" font-size="11" fill="#27ae60" text-anchor="middle">0,5 – 1,0 мм</text>

  <!-- Checklist Box -->
  <rect x="520" y="432" width="385" height="68" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="530" y="450" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#27ae60">✓</tspan> Ізоляція кабелю заходить у манжету фіксації</text>
  <text x="530" y="468" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#27ae60">✓</tspan> Жили охоплені металом без зламу та підрізання</text>
  <text x="530" y="486" font-size="12" fill="#1a1a1a"><tspan font-weight="bold" fill="#27ae60">✓</tspan> Опресування проводиться храповим кримпером</text>
</svg>
