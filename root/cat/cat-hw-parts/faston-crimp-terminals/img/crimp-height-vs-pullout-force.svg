<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="460" fill="white"/>
  
  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="700" text-anchor="middle" fill="#1a1a1a">Залежність зусилля виривання та електричного опору від висоти обтискання</text>
  <text x="480" y="60" font-size="13" text-anchor="middle" fill="#6b7280">Технологічне вікно: баланс між недостатнім обтисканням та перерізанням жили</text>

  <!-- Graphic Area Background & Axes -->
  <rect x="80" y="90" width="570" height="300" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="4"/>

  <!-- Optimal Zone (Central Band) -->
  <rect x="300" y="90" width="140" height="300" fill="#e9f7ef" opacity="0.8"/>
  <line x1="300" y1="90" x2="300" y2="390" stroke="#27ae60" stroke-dasharray="4,4" stroke-width="1.5"/>
  <line x1="440" y1="90" x2="440" y2="390" stroke="#27ae60" stroke-dasharray="4,4" stroke-width="1.5"/>

  <!-- Grid lines Y -->
  <line x1="80" y1="165" x2="650" y2="165" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="80" y1="240" x2="650" y2="240" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="80" y1="315" x2="650" y2="315" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Curves -->
  <!-- Curve 1: Pull-out Force (#27ae60) -->
  <path d="M80,350 C180,340 280,150 370,130 C460,110 550,280 650,360" fill="none" stroke="#27ae60" stroke-width="3"/>
  
  <!-- Curve 2: Resistance (#c0392b) -->
  <path d="M80,260 C180,320 280,350 370,355 C460,340 550,220 650,110" fill="none" stroke="#c0392b" stroke-width="3"/>

  <!-- Axis labels & ticks -->
  <text x="85" y="108" font-size="12" font-weight="700" fill="#27ae60">Зусилля F (Н)</text>
  <text x="545" y="108" font-size="12" font-weight="700" fill="#c0392b">Опір R (мОм)</text>

  <text x="365" y="412" font-size="13" text-anchor="middle" fill="#1a1a1a">Висота обтискання (Crimp Height, CH) ➔</text>
  <text x="130" y="432" font-size="11" fill="#c0392b">Перетискання (мала CH)</text>
  <text x="370" y="432" font-size="11" text-anchor="middle" fill="#27ae60">Оптимум</text>
  <text x="570" y="432" font-size="11" fill="#c0392b">Недотискання (велика CH)</text>

  <!-- Right Info Panel -->
  <rect x="680" y="90" width="240" height="300" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="700" y="118" font-size="14" font-weight="700" fill="#1a1a1a">Зони обтискання:</text>

  <!-- Block 3: Over-compression -->
  <rect x="690" y="130" width="220" height="72" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="700" y="150" font-size="12" font-weight="700" fill="#c0392b">Зона перетискання</text>
  <text x="700" y="167" font-size="11" fill="#1a1a1a">Витончення та підрізання жил,</text>
  <text x="700" y="182" font-size="11" fill="#1a1a1a">втомне руйнування від вібрації.</text>

  <!-- Block 2: Optimal zone -->
  <rect x="690" y="212" width="220" height="72" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="700" y="232" font-size="12" font-weight="700" fill="#27ae60">Оптимальна зона</text>
  <text x="700" y="249" font-size="11" fill="#1a1a1a">Газощільний контакт, максимальне</text>
  <text x="700" y="264" font-size="11" fill="#1a1a1a">утримання жил за UL 486A.</text>

  <!-- Block 1: Under-compression -->
  <rect x="690" y="294" width="220" height="72" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="700" y="314" font-size="12" font-weight="700" fill="#c0392b">Зона недотискання</text>
  <text x="700" y="331" font-size="11" fill="#1a1a1a">Високий опір, нагрів, висмикування</text>
  <text x="700" y="346" font-size="11" fill="#1a1a1a">жили (Pull-out failure).</text>
</svg>
