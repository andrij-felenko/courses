<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Позиціонування клеми Faston та провідника у матриці крімпера</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Посадка в профільоване гніздо, виліт жили (1.0–1.5 мм) та фіксація ізоляційної манжети</text>

  <!-- Left Panel: Matrix View (x=40..460, y=90..390) -->
  <rect x="40" y="90" width="420" height="300" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="60" y="120" font-size="14" font-weight="bold" fill="#1a1a1a">Матриця крімпера (розріз)</text>

  <!-- Matrix Jaws representation -->
  <!-- Upper Jaw -->
  <path d="M 80,180 L 220,180 L 240,150 L 380,150 L 380,190 L 240,190 L 220,210 L 80,210 Z" fill="#d0d7de" stroke="#6b7280" stroke-width="1.5"/>
  <!-- Lower Jaw -->
  <path d="M 80,310 L 220,310 L 240,290 L 380,290 L 380,330 L 240,330 L 220,300 L 80,300 Z" fill="#d0d7de" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Color dots for socket sizes (Red, Blue, Yellow) -->
  <circle cx="100" cy="195" r="8" fill="#e74c3c" stroke="#fff" stroke-width="1.5"/>
  <circle cx="125" cy="195" r="8" fill="#2980b9" stroke="#fff" stroke-width="1.5"/>
  <circle cx="150" cy="195" r="8" fill="#f1c40f" stroke="#fff" stroke-width="1.5"/>

  <!-- Ratchet closing arrow -->
  <path d="M 390,215 C 420,230 420,270 390,285" fill="none" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <text x="390" y="255" font-size="12" fill="#2457d6" text-anchor="middle">Ratchet</text>

  <!-- Labels on left panel -->
  <text x="60" y="155" font-size="12" fill="#1a1a1a">Верхня губка (punch)</text>
  <text x="60" y="355" font-size="12" fill="#1a1a1a">Нижня губка (anvil)</text>
  <text x="210" y="235" font-size="12" fill="#6b7280">Провідниковий &amp; ізоляційний барелі</text>

  <!-- Right Panel: Correct wire & terminal position (x=500..920, y=90..390) -->
  <rect x="500" y="90" width="420" height="300" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="520" y="120" font-size="14" font-weight="bold" fill="#2457d6">Правильне положення в клемі Faston</text>

  <!-- Terminal cross-section representation -->
  <!-- Conductor barrel -->
  <path d="M 580,200 L 700,200 L 700,250 L 580,250 Z" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1.5"/>
  <!-- Insulation barrel -->
  <path d="M 720,190 L 830,190 L 830,260 L 720,260 Z" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1.5"/>
  <!-- Inspection window gap -->
  <rect x="700" y="210" width="20" height="30" fill="#eaf0fd" stroke="#2457d6" stroke-dasharray="2,2"/>

  <!-- Stripped wire & insulation -->
  <!-- Insulation part -->
  <path d="M 830,205 L 890,205 L 890,245 L 830,245 Z" fill="#2ecc71" opacity="0.3" stroke="#27ae60" stroke-width="1.5"/>
  <text x="860" y="228" font-size="12" fill="#27ae60" text-anchor="middle">Ізоляція</text>

  <!-- Stripped copper strands / wire brush -->
  <path d="M 540,210 L 680,210 L 680,240 L 540,240 Z" fill="#e67e22" opacity="0.8" stroke="#d35400" stroke-width="1.5"/>
  <text x="610" y="228" font-size="12" fill="#ffffff" text-anchor="middle">Мідні жили</text>

  <!-- Wire brush protrusion (1.0 - 1.5 mm) -->
  <line x1="680" y1="180" x2="700" y2="180" stroke="#27ae60" stroke-width="1.5" marker-start="url(#arr-green)" marker-end="url(#arr-green)"/>
  <text x="690" y="172" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">1.0–1.5 мм</text>

  <!-- Annotations on right panel -->
  <text x="520" y="290" font-size="12" fill="#1a1a1a">• Вихід мідних жил у провідникову зону (Wire brush)</text>
  <text x="520" y="315" font-size="12" fill="#1a1a1a">• Зріз ізоляції у вікні між барелями</text>
  <text x="520" y="340" font-size="12" fill="#1a1a1a">• Ізоляція повністю під ізоляційним барелем</text>

  <!-- Bottom Info Summary -->
  <text x="480" y="425" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Повний хід храпового механізму гарантує каліброване зусилля стискання та запобігає недотисканню.</text>
</svg>
