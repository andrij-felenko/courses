<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Колірне маркування ізоляції клем Faston та переріз провідника</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Стандарт DIN 46245: червоний (0.5–1.5 мм²), синій (1.5–2.5 мм²), жовтий (4.0–6.0 мм²)</text>

  <!-- 1) Червона зона (Red) -->
  <g>
    <rect x="40" y="100" width="270" height="300" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
    <!-- Іконка або плашка заголовка -->
    <rect x="40" y="100" width="270" height="48" rx="8" fill="#c0392b"/>
    <text x="175" y="130" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Червона манжета (Red)</text>
    
    <!-- Вміст панелі -->
    <text x="60" y="175" font-size="14" font-weight="bold" fill="#1a1a1a">Переріз провідника:</text>
    <text x="60" y="200" font-size="14" fill="#c0392b" font-weight="bold">0.5 – 1.5 мм²</text>
    <text x="60" y="222" font-size="13" fill="#6b7280">(AWG 22 – 16)</text>

    <text x="60" y="262" font-size="14" font-weight="bold" fill="#1a1a1a">Максимальний струм:</text>
    <text x="60" y="287" font-size="14" fill="#1a1a1a">до 10 А <tspan font-size="12" fill="#6b7280">(для 6.3 мм)</tspan></text>

    <text x="60" y="327" font-size="14" font-weight="bold" fill="#1a1a1a">Діаметр ізоляції дроту:</text>
    <text x="60" y="352" font-size="14" fill="#1a1a1a">до 3.3 мм</text>
  </g>

  <!-- 2) Синя зона (Blue) -->
  <g>
    <rect x="345" y="100" width="270" height="300" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
    <rect x="345" y="100" width="270" height="48" rx="8" fill="#2457d6"/>
    <text x="480" y="130" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Синя манжета (Blue)</text>
    
    <text x="365" y="175" font-size="14" font-weight="bold" fill="#1a1a1a">Переріз провідника:</text>
    <text x="365" y="200" font-size="14" fill="#2457d6" font-weight="bold">1.5 – 2.5 мм²</text>
    <text x="365" y="222" font-size="13" fill="#6b7280">(AWG 16 – 14)</text>

    <text x="365" y="262" font-size="14" font-weight="bold" fill="#1a1a1a">Максимальний струм:</text>
    <text x="365" y="287" font-size="14" fill="#1a1a1a">до 15 А <tspan font-size="12" fill="#6b7280">(для 6.3 мм)</tspan></text>

    <text x="365" y="327" font-size="14" font-weight="bold" fill="#1a1a1a">Діаметр ізоляції дроту:</text>
    <text x="365" y="352" font-size="14" fill="#1a1a1a">до 4.3 мм</text>
  </g>

  <!-- 3) Жовта зона (Yellow) -->
  <g>
    <rect x="650" y="100" width="270" height="300" rx="8" fill="#fef9e7" stroke="#d4ac0d" stroke-width="2"/>
    <rect x="650" y="100" width="270" height="48" rx="8" fill="#b7950b"/>
    <text x="785" y="130" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Жовта манжета (Yellow)</text>
    
    <text x="670" y="175" font-size="14" font-weight="bold" fill="#1a1a1a">Переріз провідника:</text>
    <text x="670" y="200" font-size="14" fill="#b7950b" font-weight="bold">4.0 – 6.0 мм²</text>
    <text x="670" y="222" font-size="13" fill="#6b7280">(AWG 12 – 10)</text>

    <text x="670" y="262" font-size="14" font-weight="bold" fill="#1a1a1a">Максимальний струм:</text>
    <text x="670" y="287" font-size="14" fill="#1a1a1a">до 24 А <tspan font-size="12" fill="#6b7280">(для 6.3 мм)</tspan></text>

    <text x="670" y="327" font-size="14" font-weight="bold" fill="#1a1a1a">Діаметр ізоляції дроту:</text>
    <text x="670" y="352" font-size="14" fill="#1a1a1a">до 6.2 мм</text>
  </g>

  <!-- Примітка внизу -->
  <text x="480" y="425" font-size="12" fill="#6b7280" text-anchor="middle">Увага: Не допускається недотискання тонких жил у широких манжетах або підрізання жил під час зачистки.</text>
</svg>
