<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Цоколівка та підключення 4-канального модуля перетворювача на BSS138</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Призначення виводів модуля, підключення шин живлення LV (3.3 В) / HV (5 В) та ліній I2C</text>

  <!-- Left Panel: PCB Module Layout (x=30..490, y=85..430) -->
  <rect x="30" y="85" width="460" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="260" y="112" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Топологія та піни плати модуля</text>

  <!-- PCB board drawing -->
  <rect x="130" y="130" width="260" height="270" rx="6" fill="#1e293b" stroke="#0f172a" stroke-width="2"/>
  <text x="260" y="155" font-size="13" font-weight="bold" fill="#94a3b8" text-anchor="middle">4-CH I2C Level Shifter</text>

  <!-- Left Header (LV side) -->
  <rect x="140" y="170" width="30" height="215" rx="3" fill="#334155"/>
  <!-- Pins LV: LV1, LV2, LV3, LV4, LV, GND -->
  <!-- Pin 1 -->
  <circle cx="155" cy="185" r="7" fill="#f1f5f9" stroke="#2457d6" stroke-width="2"/>
  <text x="120" y="190" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="end">LV1 (SDA)</text>

  <!-- Pin 2 -->
  <circle cx="155" cy="220" r="7" fill="#f1f5f9" stroke="#2457d6" stroke-width="2"/>
  <text x="120" y="225" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="end">LV2 (SCL)</text>

  <!-- Pin 3 -->
  <circle cx="155" cy="255" r="7" fill="#f1f5f9" stroke="#2457d6" stroke-width="2"/>
  <text x="120" y="260" font-size="11" fill="#6b7280" text-anchor="end">LV3</text>

  <!-- Pin 4 -->
  <circle cx="155" cy="290" r="7" fill="#f1f5f9" stroke="#2457d6" stroke-width="2"/>
  <text x="120" y="295" font-size="11" fill="#6b7280" text-anchor="end">LV4</text>

  <!-- Pin 5 LV power -->
  <circle cx="155" cy="325" r="7" fill="#2457d6" stroke="#1d4ed8" stroke-width="2"/>
  <text x="120" y="330" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="end">LV (3.3V)</text>

  <!-- Pin 6 GND -->
  <circle cx="155" cy="360" r="7" fill="#475569" stroke="#1e293b" stroke-width="2"/>
  <text x="120" y="365" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="end">GND</text>

  <!-- Central Components on PCB -->
  <!-- 4 MOSFETs -->
  <rect x="235" y="180" width="40" height="20" rx="2" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="255" y="194" font-size="11" fill="#f8fafc" text-anchor="middle">BSS138</text>

  <rect x="235" y="215" width="40" height="20" rx="2" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="255" y="229" font-size="11" fill="#f8fafc" text-anchor="middle">BSS138</text>

  <rect x="235" y="250" width="40" height="20" rx="2" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="255" y="264" font-size="11" fill="#f8fafc" text-anchor="middle">BSS138</text>

  <rect x="235" y="285" width="40" height="20" rx="2" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
  <text x="255" y="299" font-size="11" fill="#f8fafc" text-anchor="middle">BSS138</text>

  <text x="255" y="340" font-size="11" fill="#94a3b8" text-anchor="middle">Резистори 10 кОм</text>
  <text x="255" y="360" font-size="11" fill="#64748b" text-anchor="middle">(вбудована підтяжка)</text>

  <!-- Right Header (HV side) -->
  <rect x="350" y="170" width="30" height="215" rx="3" fill="#334155"/>
  <!-- Pins HV: HV1, HV2, HV3, HV4, HV, GND -->
  <!-- Pin 1 -->
  <circle cx="365" cy="185" r="7" fill="#f1f5f9" stroke="#c0392b" stroke-width="2"/>
  <text x="400" y="190" font-size="11" font-weight="bold" fill="#c0392b">HV1 (SDA)</text>

  <!-- Pin 2 -->
  <circle cx="365" cy="220" r="7" fill="#f1f5f9" stroke="#c0392b" stroke-width="2"/>
  <text x="400" y="225" font-size="11" font-weight="bold" fill="#c0392b">HV2 (SCL)</text>

  <!-- Pin 3 -->
  <circle cx="365" cy="255" r="7" fill="#f1f5f9" stroke="#c0392b" stroke-width="2"/>
  <text x="400" y="260" font-size="11" fill="#6b7280">HV3</text>

  <!-- Pin 4 -->
  <circle cx="365" cy="290" r="7" fill="#f1f5f9" stroke="#c0392b" stroke-width="2"/>
  <text x="400" y="295" font-size="11" fill="#6b7280">HV4</text>

  <!-- Pin 5 HV power -->
  <circle cx="365" cy="325" r="7" fill="#c0392b" stroke="#991b1b" stroke-width="2"/>
  <text x="400" y="330" font-size="11" font-weight="bold" fill="#c0392b">HV (5.0V)</text>

  <!-- Pin 6 GND -->
  <circle cx="365" cy="360" r="7" fill="#475569" stroke="#1e293b" stroke-width="2"/>
  <text x="400" y="365" font-size="11" font-weight="bold" fill="#1a1a1a">GND</text>


  <!-- Right Panel: Connection Rules & I2C Wiring (x=510..930, y=85..430) -->
  <rect x="510" y="85" width="420" height="345" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="720" y="112" font-size="15" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Схема підключення до шини I2C</text>

  <!-- Green specs box -->
  <rect x="530" y="130" width="380" height="135" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="545" y="152" font-size="12" font-weight="bold" fill="#27ae60">Правила підключення та живлення:</text>
  <text x="545" y="174" font-size="11" fill="#1a1a1a">• LV: живлення низьковольтного домену (1.8 В або 3.3 В)</text>
  <text x="545" y="194" font-size="11" fill="#1a1a1a">• HV: живлення високовольтного домену (5.0 В)</text>
  <text x="545" y="214" font-size="11" fill="#1a1a1a">• GND: спільна точка заземлення для обох сторін</text>
  <text x="545" y="234" font-size="11" fill="#1a1a1a">• Підтяжка: вбудовані 10 кОм на канал (LV1..4 та HV1..4)</text>
  <text x="545" y="252" font-size="11" fill="#27ae60">Повна двонапрямність: підтримка арбітражу та clock stretching</text>

  <!-- Technical characteristics -->
  <rect x="530" y="275" width="380" height="60" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="545" y="297" font-size="11" font-weight="bold" fill="#1a1a1a">Параметри транзистора BSS138 (N-канал):</text>
  <text x="545" y="317" font-size="11" fill="#6b7280">V_GS(th) = 0.8–1.5 В, R_DS(on) ≈ 3.5 Ом, f_max ≈ 400 кГц (I2C Fast Mode)</text>

  <!-- Warning Box -->
  <rect x="530" y="345" width="380" height="70" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="545" y="367" font-size="11" font-weight="bold" fill="#c0392b">Критичне правило безпеки (Полярність напруг):</text>
  <text x="545" y="387" font-size="11" fill="#1a1a1a">Напруга LV ЗАВЖДИ має бути строго меншою або рівною HV (V_LV ≤ V_HV)!</text>
  <text x="545" y="403" font-size="11" fill="#c0392b">Інакше відкривається внутрішній боді-діод MOSFET, випалюючи шину 3.3 В.</text>

</svg>
