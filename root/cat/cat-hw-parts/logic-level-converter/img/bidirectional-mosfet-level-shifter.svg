<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Header -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Двонапрямний перетворювач рівнів на N-канальному польовому транзисторі</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Шляхи струмів розряду та потенціали електродів MOSFET (BSS138) при передачі сигналів між 3.3 В та 5.0 В</text>

  <!-- Left Panel: 3V -> 5V -->
  <rect x="30" y="80" width="445" height="355" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="105" font-size="14" font-weight="bold" fill="#1a1a1a">1) Передача нуля з низьковольтного боку (3.3V → 5V)</text>
  
  <text x="55" y="135" font-size="12" fill="#1a1a1a">V_LV = 3.3V</text>
  <line x1="125" y1="131" x2="160" y2="131" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M160,131 l5,-5 l10,10 l10,-10 l10,10 l10,-10 l10,10 l5,-5" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="170" y="122" font-size="11" fill="#6b7280">R_LV = 10k</text>
  <line x1="220" y1="131" x2="260" y2="131" stroke="#1a1a1a" stroke-width="2"/>
  
  <text x="140" y="170" font-size="12" fill="#2457d6">Gate G = 3.3V</text>
  <line x1="260" y1="131" x2="260" y2="200" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="260" y1="200" x2="300" y2="200" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="260" cy="165" r="3" fill="#1a1a1a"/>
  
  <line x1="330" y1="131" x2="330" y2="215" stroke="#1a1a1a" stroke-width="2"/>
  <text x="340" y="145" font-size="12" fill="#1a1a1a">D (HV)</text>
  
  <line x1="330" y1="285" x2="330" y2="350" stroke="#1a1a1a" stroke-width="2"/>
  <text x="340" y="340" font-size="12" fill="#1a1a1a">S (LV)</text>

  <line x1="310" y1="230" x2="330" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="310" y1="250" x2="330" y2="250" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="310" y1="270" x2="330" y2="270" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="310" y1="215" x2="310" y2="285" stroke="#1a1a1a" stroke-width="3"/>
  <path d="M310,250 L290,250 L290,235 L280,235 L300,235 Z" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  
  <line x1="300" y1="200" x2="300" y2="250" stroke="#1a1a1a" stroke-width="2"/>

  <line x1="330" y1="131" x2="410" y2="131" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M360,131 l5,-5 l10,10 l10,-10 l10,10 l10,-10 l5,5" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="365" y="122" font-size="11" fill="#6b7280">R_HV = 10k</text>
  <text x="415" y="135" font-size="12" fill="#1a1a1a">5.0V</text>

  <line x1="330" y1="350" x2="330" y2="385" stroke="#1a1a1a" stroke-width="2"/>
  <text x="250" y="395" font-size="12" fill="#2457d6">MCU = 0V (Low)</text>
  <line x1="315" y1="385" x2="345" y2="385" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="322" y1="391" x2="338" y2="391" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="327" y1="397" x2="333" y2="397" stroke="#1a1a1a" stroke-width="1"/>

  <text x="50" y="235" font-size="12" fill="#1a1a1a">• V_GS = 3.3V > V_th (відкрито)</text>
  <text x="50" y="260" font-size="12" fill="#1a1a1a">• Прямий струм розряду тече на землю</text>
  <text x="50" y="285" font-size="12" fill="#1a1a1a">• Стік D (HV) притягується до 0 В</text>

  <!-- Right Panel: 5V -> 3.3V -->
  <rect x="485" y="80" width="445" height="355" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="505" y="105" font-size="14" font-weight="bold" fill="#1a1a1a">2) Передача нуля з високовольтного боку (5V → 3.3V)</text>

  <text x="510" y="135" font-size="12" fill="#1a1a1a">V_LV = 3.3V</text>
  <line x1="580" y1="131" x2="615" y2="131" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M615,131 l5,-5 l10,10 l10,-10 l10,10 l10,-10 l10,10 l5,-5" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="625" y="122" font-size="11" fill="#6b7280">R_LV = 10k</text>
  <line x1="675" y1="131" x2="715" y2="131" stroke="#1a1a1a" stroke-width="2"/>

  <text x="590" y="170" font-size="12" fill="#2457d6">Gate G = 3.3V</text>
  <line x1="715" y1="131" x2="715" y2="200" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="715" y1="200" x2="755" y2="200" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="715" cy="165" r="3" fill="#1a1a1a"/>

  <line x1="785" y1="131" x2="785" y2="215" stroke="#1a1a1a" stroke-width="2"/>
  <text x="795" y="145" font-size="12" fill="#c0392b">D = 0V (екстернал)</text>

  <line x1="785" y1="285" x2="785" y2="350" stroke="#1a1a1a" stroke-width="2"/>
  <text x="795" y="340" font-size="12" fill="#1a1a1a">S (LV)</text>

  <line x1="765" y1="230" x2="785" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="765" y1="250" x2="785" y2="250" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="765" y1="270" x2="785" y2="270" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="765" y1="215" x2="765" y2="285" stroke="#1a1a1a" stroke-width="3"/>
  <path d="M765,250 L745,250 L745,235 L735,235 L755,235 Z" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>

  <line x1="755" y1="200" x2="755" y2="250" stroke="#1a1a1a" stroke-width="2"/>

  <line x1="785" y1="131" x2="865" y2="131" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M815,131 l5,-5 l10,10 l10,-10 l10,10 l10,-10 l5,5" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="820" y="122" font-size="11" fill="#6b7280">R_HV = 10k</text>
  <text x="870" y="135" font-size="12" fill="#1a1a1a">5.0V</text>

  <text x="505" y="225" font-size="12" fill="#1a1a1a">• Діод підкладки знижує S до 0.7В</text>
  <text x="505" y="250" font-size="12" fill="#1a1a1a">• V_GS = 3.3В - 0.7В = 2.6В > V_th</text>
  <text x="505" y="275" font-size="12" fill="#1a1a1a">• Транзистор повністю відкривається</text>
  <text x="505" y="300" font-size="12" fill="#1a1a1a">• Шунтування діода: S падає до 0 В</text>
  <text x="505" y="335" font-size="12" fill="#27ae60">• Спокій (1/1): V_GS = 0В, закритий</text>
</svg>
