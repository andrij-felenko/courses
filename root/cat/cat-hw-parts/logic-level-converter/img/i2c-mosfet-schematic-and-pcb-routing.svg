<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 460" width="960" height="460" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="38" font-size="18" font-weight="bold" text-anchor="middle" fill="#1a1a1a">Принципова схема каналу MOSFET BSS138 та топологія друкованої плати</text>
  <text x="480" y="60" font-size="13" text-anchor="middle" fill="#6b7280">Двонапрямне узгодження I2C SDA/SCL, підтяжки 10 кОм і рекомендації щодо трасування трас</text>

  <!-- ЛІВА ПАНЕЛЬ: Принципова схема (x=30..480) -->
  <rect x="30" y="80" width="450" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="255" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принципова схема 1-го каналу</text>

  <!-- Шини живлення та лінії -->
  <line x1="60" y1="140" x2="220" y2="140" stroke="#2457d6" stroke-width="2"/>
  <text x="60" y="132" font-size="11" fill="#6b7280">+3.3V (LV)</text>

  <line x1="290" y1="140" x2="450" y2="140" stroke="#c0392b" stroke-width="2"/>
  <text x="390" y="132" font-size="11" fill="#6b7280">+5.0V (HV)</text>

  <!-- Резистори R1 та R2 -->
  <line x1="135" y1="140" x2="135" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M135,160 L130,165 L140,171 L130,177 L140,183 L130,189 L135,194 L135,210" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="148" y="180" font-size="11" fill="#1a1a1a">R1 10k</text>

  <line x1="375" y1="140" x2="375" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M375,160 L370,165 L380,171 L370,177 L380,183 L370,189 L375,194 L375,210" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="388" y="180" font-size="11" fill="#1a1a1a">R2 10k</text>

  <!-- Сигнальні лінії LV1 та HV1 -->
  <line x1="60" y1="210" x2="210" y2="210" stroke="#2457d6" stroke-width="2"/>
  <text x="60" y="202" font-size="11" fill="#1a1a1a">LV1 (SDA/SCL)</text>

  <line x1="290" y1="210" x2="450" y2="210" stroke="#c0392b" stroke-width="2"/>
  <text x="365" y="202" font-size="11" fill="#1a1a1a">HV1 (SDA/SCL)</text>

  <!-- MOSFET BSS138 та затвор -->
  <line x1="255" y1="140" x2="255" y2="195" stroke="#2457d6" stroke-width="1.5"/>
  <text x="265" y="170" font-size="11" fill="#2457d6">G (+3.3V)</text>

  <!-- Транзистор Q1 символічно -->
  <rect x="225" y="195" width="60" height="50" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="255" y="225" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Q1 BSS138</text>
  <text x="255" y="275" font-size="11" fill="#6b7280" text-anchor="middle">Body Diode (S → D)</text>

  <!-- З'єднання витоку та стоку -->
  <line x1="210" y1="210" x2="225" y2="210" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="285" y1="210" x2="290" y2="210" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- GND шина -->
  <line x1="60" y1="310" x2="450" y2="310" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="60" y="302" font-size="11" fill="#6b7280">GND (Спільна шина)</text>

  <!-- Режими роботи -->
  <text x="45" y="338" font-size="11" font-weight="bold" fill="#1a1a1a">Режими роботи:</text>
  <text x="45" y="358" font-size="11" fill="#6b7280">1. Спокій: V_GS = 0 В (транзистор закритий)</text>
  <text x="45" y="378" font-size="11" fill="#6b7280">2. 3.3V → 5V: V_GS = 3.3 В (канал відкритий)</text>
  <text x="45" y="398" font-size="11" fill="#6b7280">3. 5V → 3.3V: через body diode до відкриття каналу</text>

  <!-- ПРАВА ПАНЕЛЬ: Топологія та трасування PCB (x=500..930) -->
  <rect x="500" y="80" width="430" height="350" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="715" y="105" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Топологія та трасування PCB</text>

  <!-- Плата PCB -->
  <rect x="530" y="125" width="370" height="150" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="4,2"/>
  <text x="715" y="145" font-size="11" fill="#1a1a1a" text-anchor="middle">Плата PCB (SOT-23, 0805)</text>

  <!-- Компоненти на платі -->
  <rect x="585" y="175" width="30" height="20" rx="3" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1"/>
  <text x="600" y="190" font-size="11" fill="#1a1a1a" text-anchor="middle">R1</text>

  <rect x="815" y="175" width="30" height="20" rx="3" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1"/>
  <text x="830" y="190" font-size="11" fill="#1a1a1a" text-anchor="middle">R2</text>

  <circle cx="715" cy="205" r="15" fill="#f4f6f8" stroke="#27ae60" stroke-width="1.5"/>
  <text x="715" y="209" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Q1</text>

  <!-- Траси та полігон -->
  <line x1="560" y1="230" x2="870" y2="230" stroke="#27ae60" stroke-width="2" stroke-dasharray="2,2"/>
  <text x="715" y="255" font-size="11" fill="#27ae60" text-anchor="middle">Суцільний полігон GND під сигнальним шаром</text>

  <!-- Правила трасування -->
  <text x="515" y="295" font-size="12" font-weight="bold" fill="#1a1a1a">Правила трасування сигналів:</text>
  <text x="515" y="320" font-size="11" fill="#1a1a1a">• SDA/SCL: паралельні траси, зазор S ≥ 2W (crosstalk)</text>
  <text x="515" y="345" font-size="11" fill="#1a1a1a">• Суцільний полігон землі (GND Plane) безпосередньо під шаром</text>
  <text x="515" y="370" font-size="11" fill="#1a1a1a">• Довжина трас l &lt; 50 мм (C_trace &lt; 10–15 пФ)</text>
  <text x="515" y="395" font-size="11" fill="#1a1a1a">• Блокувальні конденсатори C1, C2 якомога ближче до виводів</text>
</svg>
