<svg xmlns="http://www.w3.org/2000/svg" width="960" height="460" viewBox="0 0 960 460">
  <rect x="0" y="0" width="960" height="460" fill="white"/>

  <!-- Заголовок -->
  <text x="480" y="38" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Невідповідність логічних порогів: 3.3V CMOS, 5V TTL та 5V CMOS</text>
  <text x="480" y="60" font-family="sans-serif" font-size="13" fill="#6b7280" text-anchor="middle">Вихід 3.3V CMOS потрапляє у заборонену сіру зону невизначеності входу 5V CMOS</text>

  <!-- Панель 1: Порівняння шкал напруг (x=30..530) -->
  <rect x="30" y="80" width="500" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="108" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a">1. Порівняння шкал та вхідних порогів</text>

  <!-- Шкала 1: 5V TTL (y base = 160) -->
  <text x="50" y="145" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2457d6">5V TTL рівні</text>
  <line x1="140" y1="141" x2="500" y2="141" stroke="#d0d7de" stroke-width="8" stroke-linecap="round"/>
  <!-- TTL thresholds: V_IL=0.8V, V_IH=2.0V, V_OL=0.4V, V_OH=2.4V -->
  <line x1="140" y1="141" x2="190" y2="141" stroke="#27ae60" stroke-width="8" stroke-linecap="round"/>
  <line x1="190" y1="141" x2="280" y2="141" stroke="#e67e22" stroke-width="8" stroke-linecap="round"/>
  <line x1="280" y1="141" x2="420" y2="141" stroke="#27ae60" stroke-width="8" stroke-linecap="round"/>
  <text x="510" y="145" font-family="sans-serif" font-size="11" fill="#6b7280">0..5V</text>

  <text x="140" y="160" font-family="sans-serif" font-size="10" fill="#6b7280">0V</text>
  <text x="190" y="160" font-family="sans-serif" font-size="10" fill="#6b7280">0.8V(IL)</text>
  <text x="280" y="160" font-family="sans-serif" font-size="10" fill="#6b7280">2.0V(IH)</text>
  <text x="420" y="160" font-family="sans-serif" font-size="10" fill="#6b7280">2.4V(OH)</text>
  <text x="500" y="160" font-family="sans-serif" font-size="10" fill="#6b7280">5V</text>


  <!-- Шкала 2: 3.3V CMOS (y base = 220) -->
  <text x="50" y="205" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2457d6">3.3V CMOS рівні</text>
  <line x1="140" y1="201" x2="500" y2="201" stroke="#d0d7de" stroke-width="8" stroke-linecap="round"/>
  <line x1="140" y1="201" x2="190" y2="201" stroke="#27ae60" stroke-width="8" stroke-linecap="round"/>
  <line x1="190" y1="201" x2="280" y2="201" stroke="#e67e22" stroke-width="8" stroke-linecap="round"/>
  <line x1="280" y1="201" x2="440" y2="201" stroke="#27ae60" stroke-width="8" stroke-linecap="round"/>
  <text x="510" y="205" font-family="sans-serif" font-size="11" fill="#6b7280">0..3.3V</text>

  <text x="140" y="220" font-family="sans-serif" font-size="10" fill="#6b7280">0V</text>
  <text x="190" y="220" font-family="sans-serif" font-size="10" fill="#6b7280">0.8V</text>
  <text x="280" y="220" font-family="sans-serif" font-size="10" fill="#6b7280">2.0V</text>
  <text x="440" y="220" font-family="sans-serif" font-size="10" fill="#6b7280">2.8V(OH)</text>


  <!-- Шкала 3: 5V CMOS (y base = 280) -->
  <text x="50" y="265" font-family="sans-serif" font-size="12" font-weight="bold" fill="#c0392b">5V CMOS рівні (критично!)</text>
  <line x1="140" y1="261" x2="500" y2="261" stroke="#d0d7de" stroke-width="8" stroke-linecap="round"/>
  <!-- 5V CMOS: V_IL=1.5V (30%), V_IH=3.5V (70%), V_OH=4.5V -->
  <line x1="140" y1="261" x2="230" y2="261" stroke="#27ae60" stroke-width="8" stroke-linecap="round"/>
  <!-- Сіра зона невизначеності: 1.5V до 3.5V -->
  <rect x="230" y="254" width="160" height="14" fill="#e74c3c" opacity="0.3"/>
  <line x1="230" y1="261" x2="390" y2="261" stroke="#c0392b" stroke-width="8" stroke-linecap="round"/>
  <line x1="390" y1="261" x2="480" y2="261" stroke="#27ae60" stroke-width="8" stroke-linecap="round"/>
  <text x="510" y="265" font-family="sans-serif" font-size="11" fill="#6b7280">0..5V</text>

  <text x="140" y="282" font-family="sans-serif" font-size="10" fill="#6b7280">0V</text>
  <text x="230" y="282" font-family="sans-serif" font-size="10" fill="#c0392b" font-weight="bold">1.5V(IL)</text>
  <text x="310" y="296" font-family="sans-serif" font-size="11" font-weight="bold" fill="#c0392b">СІРА ЗОНА (1.5V - 3.5V)</text>
  <text x="390" y="282" font-family="sans-serif" font-size="10" fill="#c0392b" font-weight="bold">3.5V(IH)</text>
  <text x="480" y="282" font-family="sans-serif" font-size="10" fill="#6b7280">4.5V(OH)</text>

  <!-- Пояснення в лівій панелі -->
  <rect x="45" y="315" width="470" height="95" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="335" font-family="sans-serif" font-size="12" font-weight="bold" fill="#1a1a1a">У чому проблема невідповідності?</text>
  <text x="55" y="355" font-family="sans-serif" font-size="11" fill="#6b7280">• 3.3V CMOS видає V_OH ≈ 3.3V на високому рівні.</text>
  <text x="55" y="375" font-family="sans-serif" font-size="11" fill="#6b7280">• 5V CMOS вимагає для логічної одиниці мінімум V_IH = 3.5V.</text>
  <text x="55" y="395" font-family="sans-serif" font-size="11" font-weight="bold" fill="#c0392b">• 3.3V потрапляє прямо в небезпечну сіру зону невизначеності!</text>


  <!-- Панель 2: Наслідки та вирішення (x=550..930) -->
  <rect x="546" y="80" width="384" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="566" y="108" font-family="sans-serif" font-size="15" font-weight="bold" fill="#1a1a1a">2. Наслідки та рішення</text>

  <!-- Блок 1: Пряме з'єднання (Небезпечно) -->
  <rect x="562" y="125" width="352" height="85" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="576" y="145" font-family="sans-serif" font-size="12" font-weight="bold" fill="#c0392b">Пряме з'єднання: 3.3V Вихід → 5V CMOS Вхід</text>
  <text x="576" y="165" font-family="sans-serif" font-size="11" fill="#1a1a1a">V_OH(3.3V) = 3.3V &lt; V_IH(5V CMOS) = 3.5V</text>
  <text x="576" y="185" font-family="sans-serif" font-size="11" fill="#6b7280">Наслідки: зависання сигналу, наскрізний струм PMOS+NMOS,</text>
  <text x="576" y="200" font-family="sans-serif" font-size="11" fill="#6b7280">надмірне нагрівання мікросхеми та збої бітів.</text>

  <!-- Блок 2: Сумісність з TTL -->
  <rect x="562" y="220" width="352" height="60" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="576" y="240" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2457d6">З'єднання з 5V TTL входом</text>
  <text x="576" y="260" font-family="sans-serif" font-size="11" fill="#1a1a1a">V_OH(3.3V) = 3.3V &gt; V_IH(TTL) = 2.0V</text>
  <text x="576" y="274" font-family="sans-serif" font-size="11" fill="#27ae60" font-weight="bold">Сумісність повністю гарантована!</text>

  <!-- Блок 3: Правильне рішення -->
  <rect x="562" y="290" width="352" height="125" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="576" y="310" font-family="sans-serif" font-size="12" font-weight="bold" fill="#27ae60">Вирішення для 5V CMOS систем</text>
  <text x="576" y="330" font-family="sans-serif" font-size="11" fill="#1a1a1a">1. Активний перетворювач рівнів (напр. 74AHCT125)</text>
  <text x="576" y="350" font-family="sans-serif" font-size="11" fill="#6b7280">   Має TTL-сумісні входи (V_IH = 2.0V) при живленні 5V.</text>
  <text x="576" y="370" font-family="sans-serif" font-size="11" fill="#1a1a1a">2. Двонаправлений MOSFET транзистор (напр. BSS138)</text>
  <text x="576" y="390" font-family="sans-serif" font-size="11" fill="#6b7280">   Ідеально узгоджує шини I2C / SPI без втрати швидкості.</text>

</svg>
