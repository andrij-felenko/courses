<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="curveFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="960" height="520" fill="url(#bgGrad3)"/>

  <!-- Title -->
  <text x="480" y="35" font-family="system-ui, sans-serif" font-size="21" font-weight="700" fill="#f8fafc" text-anchor="middle">Вплив фактора квантування (QS 0x44) на розмір кадру та якість</text>
  <text x="480" y="58" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Компроміс між пропускною здатністю шини, розміром буфера SRAM та артефактами стиснення</text>

  <!-- Left Chart: QS vs File Size curve -->
  <g transform="translate(45, 80)" filter="url(#shadow3)">
    <rect width="450" height="395" rx="8" fill="#111827" stroke="#334155"/>
    <text x="225" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">Залежність розміру кадру (UXGA 1600×1200) від значення QS</text>

    <!-- Axes -->
    <line x1="60" y1="340" x2="420" y2="340" stroke="#64748b" stroke-width="1.5"/>
    <line x1="60" y1="340" x2="60" y2="60" stroke="#64748b" stroke-width="1.5"/>

    <!-- Y-axis labels (KB) -->
    <text x="50" y="70" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="end">250 KB</text>
    <line x1="56" y1="65" x2="420" y2="65" stroke="#1f2937" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="50" y="130" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="end">180 KB</text>
    <line x1="56" y1="125" x2="420" y2="125" stroke="#1f2937" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="50" y="195" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="end">100 KB</text>
    <line x1="56" y1="190" x2="420" y2="190" stroke="#1f2937" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="50" y="260" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="end">40 KB</text>
    <line x1="56" y1="255" x2="420" y2="255" stroke="#1f2937" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="50" y="325" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="end">15 KB</text>
    <line x1="56" y1="320" x2="420" y2="320" stroke="#1f2937" stroke-width="1" stroke-dasharray="2,2"/>

    <!-- X-axis labels (QS hex/dec) -->
    <text x="80" y="358" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">0x02</text>
    <text x="140" y="358" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">0x06</text>
    <text x="200" y="358" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">0x0A</text>
    <text x="260" y="358" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">0x10</text>
    <text x="320" y="358" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">0x18</text>
    <text x="380" y="358" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">0x28</text>
    <text x="420" y="358" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">QS</text>

    <!-- Shaded Quality Zones -->
    <!-- High Quality: 60 to 170 -->
    <rect x="60" y="60" width="105" height="280" fill="#10b981" fill-opacity="0.08"/>
    <text x="112" y="80" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">Висока якість</text>

    <!-- Balanced: 165 to 275 -->
    <rect x="165" y="60" width="110" height="280" fill="#3b82f6" fill-opacity="0.08"/>
    <text x="220" y="80" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#60a5fa" text-anchor="middle">Оптимальний баланс</text>

    <!-- Extreme: 275 to 420 -->
    <rect x="275" y="60" width="145" height="280" fill="#f59e0b" fill-opacity="0.08"/>
    <text x="345" y="80" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fbbf24" text-anchor="middle">Висока компресія</text>

    <!-- Curve Area -->
    <path d="M 80 80 Q 120 180 200 240 T 380 325 L 380 340 L 80 340 Z" fill="url(#curveFill)"/>
    <!-- Curve Line -->
    <path d="M 80 80 Q 120 180 200 240 T 380 325" stroke="#38bdf8" stroke-width="3" fill="none"/>

    <!-- Key Points on Curve -->
    <circle cx="80" cy="80" r="4" fill="#38bdf8"/>
    <circle cx="140" cy="180" r="4" fill="#38bdf8"/>
    <circle cx="200" cy="240" r="5" fill="#facc15" stroke="#fff" stroke-width="1.5"/>
    <text x="200" y="228" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#facc15" text-anchor="middle">~60 KB (QS 0x0A)</text>
    <circle cx="320" cy="305" r="4" fill="#38bdf8"/>
    <circle cx="380" cy="325" r="4" fill="#38bdf8"/>

    <!-- Bottom note -->
    <text x="240" y="382" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Рекомендовано для ESP32-CAM / STM32: QS = 0x08 ... 0x0C (40–80 КБ)</text>
  </g>

  <!-- Right Panel: Comparison Table and Configuration -->
  <g transform="translate(515, 80)" filter="url(#shadow3)">
    <rect width="400" height="395" rx="8" fill="#111827" stroke="#334155"/>
    <text x="200" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#e2e8f0" text-anchor="middle">Порівняння форматів передачі кадру UXGA</text>

    <!-- Table Header -->
    <rect x="15" y="45" width="370" height="26" rx="4" fill="#1f2937"/>
    <text x="70" y="62" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">Формат</text>
    <text x="160" y="62" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">Розмір кадру</text>
    <text x="260" y="62" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">Потік при 15 fps</text>
    <text x="345" y="62" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">Сумісність</text>

    <!-- Row 1: RGB565 -->
    <rect x="15" y="77" width="370" height="34" rx="4" fill="#1e293b"/>
    <text x="70" y="98" font-family="monospace" font-size="11" fill="#f87171" text-anchor="middle">RGB565</text>
    <text x="160" y="98" font-family="monospace" font-size="11" fill="#f8fafc" text-anchor="middle">3.84 МБ</text>
    <text x="260" y="98" font-family="monospace" font-size="11" fill="#f87171" text-anchor="middle">57.6 МБ/с</text>
    <text x="345" y="98" font-family="system-ui, sans-serif" font-size="10" fill="#ef4444" text-anchor="middle">Неможливо</text>

    <!-- Row 2: YUV422 -->
    <rect x="15" y="117" width="370" height="34" rx="4" fill="#1e293b"/>
    <text x="70" y="138" font-family="monospace" font-size="11" fill="#fb923c" text-anchor="middle">YUV422</text>
    <text x="160" y="138" font-family="monospace" font-size="11" fill="#f8fafc" text-anchor="middle">3.84 МБ</text>
    <text x="260" y="138" font-family="monospace" font-size="11" fill="#fb923c" text-anchor="middle">57.6 МБ/с</text>
    <text x="345" y="138" font-family="system-ui, sans-serif" font-size="10" fill="#ef4444" text-anchor="middle">Переповнення</text>

    <!-- Row 3: JPEG (QS=4) -->
    <rect x="15" y="157" width="370" height="34" rx="4" fill="#1e293b"/>
    <text x="70" y="178" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="middle">JPEG QS=4</text>
    <text x="160" y="178" font-family="monospace" font-size="11" fill="#f8fafc" text-anchor="middle">~150 КБ</text>
    <text x="260" y="178" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="middle">2.25 МБ/с</text>
    <text x="345" y="178" font-family="system-ui, sans-serif" font-size="10" fill="#34d399" text-anchor="middle">PSRAM / DMA</text>

    <!-- Row 4: JPEG (QS=10) -->
    <rect x="15" y="197" width="370" height="34" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="70" y="218" font-family="monospace" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="middle">JPEG QS=10</text>
    <text x="160" y="218" font-family="monospace" font-size="11" font-weight="700" fill="#ecfdf5" text-anchor="middle">~60 КБ</text>
    <text x="260" y="218" font-family="monospace" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="middle">0.90 МБ/с</text>
    <text x="345" y="218" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">Ідеально (WiFi)</text>

    <!-- Row 5: JPEG (QS=25) -->
    <rect x="15" y="237" width="370" height="34" rx="4" fill="#1e293b"/>
    <text x="70" y="258" font-family="monospace" font-size="11" fill="#fbbf24" text-anchor="middle">JPEG QS=25</text>
    <text x="160" y="258" font-family="monospace" font-size="11" fill="#f8fafc" text-anchor="middle">~25 КБ</text>
    <text x="260" y="258" font-family="monospace" font-size="11" fill="#fbbf24" text-anchor="middle">0.37 МБ/с</text>
    <text x="345" y="258" font-family="system-ui, sans-serif" font-size="10" fill="#fbbf24" text-anchor="middle">IoT / BLE</text>

    <!-- Code config snippet -->
    <rect x="15" y="285" width="370" height="98" rx="6" fill="#0b0f19" stroke="#1e293b"/>
    <text x="25" y="303" font-family="monospace" font-size="10" fill="#94a3b8">// Налаштування QS в Банку 0 (DSP):</text>
    <text x="25" y="320" font-family="monospace" font-size="10" fill="#60a5fa">sccb_write(0xFF, 0x00);</text>
    <text x="180" y="320" font-family="monospace" font-size="10" fill="#64748b">// Bank 0 (DSP)</text>
    <text x="25" y="337" font-family="monospace" font-size="10" fill="#60a5fa">sccb_write(0x44, quality);</text>
    <text x="180" y="337" font-family="monospace" font-size="10" fill="#64748b">// QS: 0x04 (HQ) .. 0x20 (LQ)</text>
    <text x="25" y="354" font-family="monospace" font-size="10" fill="#60a5fa">sccb_write(0xDA, 0x10);</text>
    <text x="180" y="354" font-family="monospace" font-size="10" fill="#64748b">// IMAGE_MODE[4]=1 (JPEG On)</text>
    <text x="25" y="371" font-family="monospace" font-size="10" fill="#60a5fa">sccb_write(0xE0, 0x00);</text>
    <text x="180" y="371" font-family="monospace" font-size="10" fill="#64748b">// Reset FIFO &amp; apply</text>
  </g>
</svg>