<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="boxGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="boxGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="boxGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#701a75"/>
      <stop offset="100%" stop-color="#86198f"/>
    </linearGradient>
    <linearGradient id="boxGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#bgGrad)"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#f8fafc" text-anchor="middle">Апаратний конвеєр JPEG-компресії сенсора OV2640</text>
  <text x="480" y="62" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8" text-anchor="middle">Трансформація піксельних даних від Bayer-матриці 1600x1200 до стандартизованого бітового потоку ISO JPEG</text>

  <!-- Flow pipeline: Row 1 (Sensor to DCT) -->
  <!-- Step 1: Bayer Array -->
  <g transform="translate(40, 90)" filter="url(#shadow)">
    <rect width="180" height="150" rx="8" fill="url(#boxGrad1)" stroke="#6366f1" stroke-width="2"/>
    <rect x="0" y="0" width="180" height="28" rx="8" fill="#4338ca"/>
    <text x="90" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1. CMOS Матриця</text>
    
    <text x="90" y="55" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#c7d2fe" text-anchor="middle">UXGA 1600×1200</text>
    <text x="90" y="75" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Bayer RGB Pattern (RGGB)</text>
    <text x="90" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">10-бітний паралельний АЦП</text>
    <text x="90" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">15 кадр/с UXGA / 30 SVGA</text>
    <rect x="25" y="125" width="130" height="16" rx="4" fill="#312e81"/>
    <text x="90" y="137" font-family="monospace" font-size="10" fill="#a5b4fc" text-anchor="middle">Raw Data: ~3.84 MB</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 220 165 L 255 165" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow)" fill="none"/>
  <polygon points="260,165 252,160 252,170" fill="#38bdf8"/>

  <!-- Step 2: ISP Engine -->
  <g transform="translate(265, 90)" filter="url(#shadow)">
    <rect width="190" height="150" rx="8" fill="url(#boxGrad1)" stroke="#6366f1" stroke-width="2"/>
    <rect x="0" y="0" width="190" height="28" rx="8" fill="#4338ca"/>
    <text x="95" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2. ISP Обробка та YUV</text>

    <text x="95" y="55" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#c7d2fe" text-anchor="middle">Дебайєризація / Demosaic</text>
    <text x="95" y="75" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">AEC / AGC / AWB баланс</text>
    <text x="95" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">RGB → YCbCr 4:2:2 колір</text>
    <text x="95" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Гамма-корекція, різкість</text>
    <rect x="25" y="125" width="140" height="16" rx="4" fill="#312e81"/>
    <text x="95" y="137" font-family="monospace" font-size="10" fill="#a5b4fc" text-anchor="middle">Формування MCU блоків</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 455 165 L 490 165" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
  <polygon points="495,165 487,160 487,170" fill="#38bdf8"/>

  <!-- Step 3: Block Partitioning & Level Shift -->
  <g transform="translate(500, 90)" filter="url(#shadow)">
    <rect width="190" height="150" rx="8" fill="url(#boxGrad2)" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="190" height="28" rx="8" fill="#047857"/>
    <text x="95" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3. Блоки 8×8 та Зсув</text>

    <text x="95" y="55" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#a7f3d0" text-anchor="middle">MCU: 16×8 (Y0, Y1, Cb, Cr)</text>
    <text x="95" y="75" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Зсув рівня: P - 128</text>
    <text x="95" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Діапазон: [-128 .. +127]</text>
    <text x="95" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Поканальна дискретизація</text>
    <rect x="25" y="125" width="140" height="16" rx="4" fill="#064e3b"/>
    <text x="95" y="137" font-family="monospace" font-size="10" fill="#6ee7b7" text-anchor="middle">8×8 Матриця пікселів</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 690 165 L 725 165" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
  <polygon points="730,165 722,160 722,170" fill="#38bdf8"/>

  <!-- Step 4: 2D DCT Engine -->
  <g transform="translate(735, 90)" filter="url(#shadow)">
    <rect width="185" height="150" rx="8" fill="url(#boxGrad2)" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="185" height="28" rx="8" fill="#047857"/>
    <text x="92" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4. 2D ДКП (DCT) Ядро</text>

    <text x="92" y="55" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#a7f3d0" text-anchor="middle">Дискретне косинус-перетв.</text>
    <text x="92" y="75" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Просторова → Частотна обл.</text>
    <text x="92" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">F(0,0): DC-коефіцієнт (яскр.)</text>
    <text x="92" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">F(u,v): 63 AC-коефіцієнти</text>
    <rect x="20" y="125" width="145" height="16" rx="4" fill="#064e3b"/>
    <text x="92" y="137" font-family="monospace" font-size="10" fill="#6ee7b7" text-anchor="middle">Апаратні помножувачі</text>
  </g>

  <!-- Connective bend from Step 4 down to Step 5 -->
  <path d="M 827 240 L 827 280 L 130 280 L 130 320" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6,4" fill="none"/>
  <polygon points="130,325 125,317 135,317" fill="#f59e0b"/>

  <!-- Row 2: Quantization, Zigzag/Huffman, Bitstream Pack, DVP Interface -->

  <!-- Step 5: Quantization & QS Register -->
  <g transform="translate(40, 330)" filter="url(#shadow)">
    <rect width="185" height="150" rx="8" fill="url(#boxGrad3)" stroke="#c026d3" stroke-width="2"/>
    <rect x="0" y="0" width="185" height="28" rx="8" fill="#9333ea"/>
    <text x="92" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">5. Квантування (QS)</text>

    <text x="92" y="55" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f5d0fe" text-anchor="middle">Регістр 0x44: QS[5:0]</text>
    <text x="92" y="75" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Q(u,v) = Round(F / (Qtab*QS))</text>
    <text x="92" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Таблиці DQT (яскр./колір)</text>
    <text x="92" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Відсікання ВЧ-шумів → 0</text>
    <rect x="20" y="125" width="145" height="16" rx="4" fill="#701a75"/>
    <text x="92" y="137" font-family="monospace" font-size="10" fill="#f0abfc" text-anchor="middle">Основна втрата інформ.</text>
  </g>

  <!-- Arrow 5 -> 6 -->
  <path d="M 225 405 L 260 405" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
  <polygon points="265,405 257,400 257,410" fill="#38bdf8"/>

  <!-- Step 6: Zigzag & Huffman Coding -->
  <g transform="translate(270, 330)" filter="url(#shadow)">
    <rect width="195" height="150" rx="8" fill="url(#boxGrad3)" stroke="#c026d3" stroke-width="2"/>
    <rect x="0" y="0" width="195" height="28" rx="8" fill="#9333ea"/>
    <text x="97" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">6. Зигзаг + Хаффман</text>

    <text x="97" y="55" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f5d0fe" text-anchor="middle">Зигзаг-сканування 8×8</text>
    <text x="97" y="75" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Групування довгих серій нулів</text>
    <text x="97" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">RLE кодування AC-довжин</text>
    <text x="97" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Ентропійні таблиці DHT</text>
    <rect x="25" y="125" width="145" height="16" rx="4" fill="#701a75"/>
    <text x="97" y="137" font-family="monospace" font-size="10" fill="#f0abfc" text-anchor="middle">Макс. стиснення без втрат</text>
  </g>

  <!-- Arrow 6 -> 7 -->
  <path d="M 465 405 L 500 405" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
  <polygon points="505,405 497,400 497,410" fill="#38bdf8"/>

  <!-- Step 7: JPEG Marker Generator & Packer -->
  <g transform="translate(510, 330)" filter="url(#shadow)">
    <rect width="190" height="150" rx="8" fill="url(#boxGrad4)" stroke="#ea580c" stroke-width="2"/>
    <rect x="0" y="0" width="190" height="28" rx="8" fill="#c2410c"/>
    <text x="95" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">7. Генератор Маркерів</text>

    <text x="95" y="55" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#fed7aa" text-anchor="middle">Вставка заголовків JFIF</text>
    <text x="95" y="75" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">SOI (FF D8), DQT (FF DB)</text>
    <text x="95" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">SOF0 (FF C0), DHT (FF C4)</text>
    <text x="95" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">SOS (FF DA) ... EOI (FF D9)</text>
    <rect x="25" y="125" width="140" height="16" rx="4" fill="#7c2d12"/>
    <text x="95" y="137" font-family="monospace" font-size="10" fill="#fdba74" text-anchor="middle">Повноцінний .jpg файл</text>
  </g>

  <!-- Arrow 7 -> 8 -->
  <path d="M 700 405 L 735 405" stroke="#38bdf8" stroke-width="2.5" fill="none"/>
  <polygon points="740,405 732,400 732,410" fill="#38bdf8"/>

  <!-- Step 8: Output FIFO & DVP Interface -->
  <g transform="translate(745, 330)" filter="url(#shadow)">
    <rect width="180" height="150" rx="8" fill="url(#boxGrad4)" stroke="#ea580c" stroke-width="2"/>
    <rect x="0" y="0" width="180" height="28" rx="8" fill="#c2410c"/>
    <text x="90" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">8. Вихідний DVP Інтерфейс</text>

    <text x="90" y="55" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#fed7aa" text-anchor="middle">Внутрішній FIFO буфер</text>
    <text x="90" y="75" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Шина D[7:0] паралельна</text>
    <text x="90" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Такти PCLK (до 24 МГц)</text>
    <text x="90" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">Строби VSYNC та HREF</text>
    <rect x="20" y="125" width="140" height="16" rx="4" fill="#7c2d12"/>
    <text x="90" y="137" font-family="monospace" font-size="10" fill="#fdba74" text-anchor="middle">Розмір: ~30-150 КБ</text>
  </g>

  <!-- Bottom Annotation Bar -->
  <rect x="40" y="495" width="885" height="30" rx="6" fill="#1e293b" stroke="#334155"/>
  <text x="480" y="515" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">Режими стиснення регулюються регістрами Банку DSP (0xFF=0x00): компресор зменшує трафік шини у 20–50 разів порівняно з RGB565.</text>
</svg>