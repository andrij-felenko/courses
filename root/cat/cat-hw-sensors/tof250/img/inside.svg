<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="900" height="470" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="450.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="17" fill="#1a1a1a" text-anchor="middle" font-weight="700">Усередині: давач ST + власний мікроконтролер</text>
<rect x="60.0" y="90.0" width="200.0" height="300.0" rx="12" fill="#fafbfc" stroke="#6b7280" stroke-width="1.7"/>
<text x="160.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle" font-weight="700">чип ST (клас VL53L0X)</text>
<rect x="84.0" y="144.0" width="152.0" height="60.0" rx="8" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
<text x="160.0" y="168.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">VCSEL-лазер 940 нм</text>
<text x="160.0" y="186.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">невидимий спалах</text>
<rect x="84.0" y="222.0" width="152.0" height="60.0" rx="8" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.6"/>
<text x="160.0" y="246.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">SPAD-матриця</text>
<text x="160.0" y="264.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">лічить фотони, що вернулись</text>
<rect x="84.0" y="300.0" width="152.0" height="54.0" rx="8" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
<text x="160.0" y="322.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle" font-weight="700">таймер: скільки летіло</text>
<text x="160.0" y="340.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">→ сира відстань</text>
<rect x="340.0" y="150.0" width="180.0" height="180.0" rx="12" fill="#eef6ef" stroke="#27ae60" stroke-width="1.9"/>
<text x="430.0" y="180.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="12" fill="#27ae60" text-anchor="middle" font-weight="700">власний МК</text>
<text x="430.0" y="204.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">модуля</text>
<text x="430.0" y="240.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">фільтрує, усереднює,</text>
<text x="430.0" y="258.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">перекладає в міліметри,</text>
<text x="430.0" y="276.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">віддає готове число</text>
<line x1="260.0" y1="240.0" x2="340.0" y2="240.0" stroke="#1a1a1a" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="640.0" y="131.0" width="210.0" height="68.0" rx="10" fill="#ffffff" stroke="#2457d6" stroke-width="1.7"/>
<text x="745.0" y="153.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#2457d6" text-anchor="middle" font-weight="700">I2C  (адреса 0x52)</text>
<text x="745.0" y="173.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">регістр 0x00 → 2 байти</text>
<text x="745.0" y="189.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">старший·молодший = мм</text>
<rect x="640.0" y="266.0" width="210.0" height="68.0" rx="10" fill="#ffffff" stroke="#c0392b" stroke-width="1.7"/>
<text x="745.0" y="288.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#c0392b" text-anchor="middle" font-weight="700">UART  115200 8N1</text>
<text x="745.0" y="308.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#1a1a1a" text-anchor="middle">текст ASCII: «748mm»</text>
<text x="745.0" y="324.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="9" fill="#6b7280" text-anchor="middle">сам шле щомиті</text>
<line x1="520.0" y1="190.0" x2="640.0" y2="165.0" stroke="#2457d6" stroke-width="2.0" marker-end="url(#arrow)"/>
<line x1="520.0" y1="290.0" x2="640.0" y2="300.0" stroke="#c0392b" stroke-width="2.0" marker-end="url(#arrow)"/>
<rect x="145.0" y="430.2" width="609.9" height="31.5" rx="6" fill="#f4f6f8" stroke="#333333" stroke-width="1.5"/><text x="450.0" y="450.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="450.0" dy="0.0">МК ховає всю фізику: назовні виходить готова відстань у міліметрах — двома різними шляхами</tspan></text>
</svg>