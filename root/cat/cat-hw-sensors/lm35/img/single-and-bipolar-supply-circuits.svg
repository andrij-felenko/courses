<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схеми живлення LM35DZ: базове та повнодіапазонне підключення</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Однополярна схема вимірює лише T ≥ 0 °C, а підтяжка R_S до -V_S забезпечує вимірювання від -55 °C</text>

  <!-- PANEL A: Single Supply -->
  <rect x="30" y="75" width="435" height="445" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="45" y="90" width="405" height="34" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="247" y="112" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Схема 1: Однополярне живлення (T ≥ 0 °C)</text>

  <!-- Power rail +Vs -->
  <line x1="120" y1="160" x2="250" y2="160" stroke="#2457d6" stroke-width="2"/>
  <text x="185" y="150" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">+V_S (+4 В ... +30 В)</text>
  <line x1="185" y1="160" x2="185" y2="195" stroke="#1a1a1a" stroke-width="2"/>

  <!-- LM35 IC Box Panel A -->
  <rect x="135" y="195" width="130" height="115" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
  <text x="200" y="236" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">LM35DZ</text>
  <text x="200" y="274" font-size="11" fill="#6b7280" text-anchor="middle">(Аналоговий давач)</text>
  <text x="185" y="214" font-size="11" fill="#6b7280" text-anchor="middle">1 (+V_S)</text>
  <text x="257" y="254" font-size="11" fill="#6b7280" text-anchor="end">2 (V_OUT)</text>
  <text x="185" y="298" font-size="11" fill="#6b7280" text-anchor="middle">3 (GND)</text>

  <!-- GND Connection Panel A -->
  <line x1="185" y1="310" x2="185" y2="345" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="170" y1="345" x2="200" y2="345" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="176" y1="350" x2="194" y2="350" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="182" y1="355" x2="188" y2="355" stroke="#1a1a1a" stroke-width="2"/>
  <text x="208" y="352" font-size="11" fill="#6b7280" text-anchor="start">GND (0 В)</text>

  <!-- Vout Signal Output Panel A -->
  <line x1="265" y1="252" x2="415" y2="252" stroke="#2457d6" stroke-width="2"/>
  <circle cx="415" cy="252" r="4" fill="#2457d6"/>
  <text x="280" y="240" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">V_OUT = +10 мВ/°C × T</text>

  <!-- Current Arrow Panel A -->
  <line x1="280" y1="266" x2="345" y2="266" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <text x="280" y="280" font-size="11" fill="#2457d6" text-anchor="start">I_out &gt; 0 (витікає з давача)</text>

  <!-- Explanation Box Panel A -->
  <rect x="45" y="370" width="405" height="135" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="60" y="392" font-size="13" font-weight="bold" fill="#1a1a1a">Особливості однополярного живлення:</text>
  <text x="60" y="413" font-size="12" fill="#1a1a1a">• Діапазон вимірювання: від 0 °C до +100 °C (+150 °C)</text>
  <text x="60" y="433" font-size="12" fill="#2457d6">• Вихідна напруга: 0 мВ (0 °C) ... +1000 мВ (+100 °C)</text>
  <text x="60" y="453" font-size="12" font-weight="bold" fill="#c0392b">• При T &lt; 0 °C: V_OUT = 0 В (каскад не тягне нижче GND)</text>
  <text x="60" y="473" font-size="12" fill="#6b7280">• Власний струм споживання: I_S ≈ 60 мкА</text>
  <text x="60" y="493" font-size="11" fill="#6b7280">• Використовується в більшості кімнатних давачів</text>


  <!-- PANEL B: Full Range Bipolar with Pull-Down -->
  <rect x="495" y="75" width="435" height="445" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="510" y="90" width="405" height="34" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="712" y="112" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Схема 2: Повний діапазон (-55 °C ... +150 °C)</text>

  <!-- Power rail +Vs Panel B -->
  <line x1="590" y1="160" x2="720" y2="160" stroke="#27ae60" stroke-width="2"/>
  <text x="655" y="150" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">+V_S (+4 В ... +30 В)</text>
  <line x1="655" y1="160" x2="655" y2="195" stroke="#1a1a1a" stroke-width="2"/>

  <!-- LM35 IC Box Panel B -->
  <rect x="605" y="195" width="130" height="115" rx="6" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="2"/>
  <text x="670" y="236" font-size="16" font-weight="bold" fill="#1a1a1a" text-anchor="middle">LM35DZ</text>
  <text x="670" y="274" font-size="11" fill="#6b7280" text-anchor="middle">(Повний діапазон)</text>
  <text x="655" y="214" font-size="11" fill="#6b7280" text-anchor="middle">1 (+V_S)</text>
  <text x="727" y="254" font-size="11" fill="#6b7280" text-anchor="end">2 (V_OUT)</text>
  <text x="655" y="298" font-size="11" fill="#6b7280" text-anchor="middle">3 (GND)</text>

  <!-- GND Connection Panel B -->
  <line x1="655" y1="310" x2="655" y2="345" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="640" y1="345" x2="670" y2="345" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="646" y1="350" x2="664" y2="350" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="652" y1="355" x2="658" y2="355" stroke="#1a1a1a" stroke-width="2"/>
  <text x="678" y="352" font-size="11" fill="#6b7280" text-anchor="start">GND (0 В)</text>

  <!-- Vout Signal Output Panel B -->
  <line x1="735" y1="252" x2="880" y2="252" stroke="#27ae60" stroke-width="2"/>
  <circle cx="795" cy="252" r="3.5" fill="#1a1a1a"/>
  <circle cx="880" cy="252" r="4" fill="#27ae60"/>
  <text x="745" y="240" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">V_OUT (-550 мВ ... +1500 мВ)</text>

  <!-- Pull-down Resistor Rs -->
  <line x1="795" y1="252" x2="795" y2="275" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="787" y="275" width="16" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="795" y1="315" x2="795" y2="345" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Negative rail -Vs -->
  <line x1="755" y1="345" x2="835" y2="345" stroke="#c0392b" stroke-width="2"/>
  <text x="795" y="362" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">-V_S (-5 В або від'ємне зміщення)</text>

  <!-- Resistor Annotations -->
  <text x="812" y="286" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="start">R_S = -V_S / 50 мкА</text>
  <text x="812" y="302" font-size="10" fill="#6b7280" text-anchor="start">(100 кОм при -5 В)</text>
  <text x="812" y="318" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="start">I_pull при T &lt; 0 °C</text>

  <!-- Dashed current arrow for sub-zero -->
  <line x1="778" y1="260" x2="778" y2="330" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,2" marker-end="url(#arr-red)"/>
  <text x="772" y="295" font-size="10" font-weight="bold" fill="#c0392b" text-anchor="end">I_pull</text>

  <!-- Explanation Box Panel B -->
  <rect x="510" y="370" width="405" height="135" rx="6" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="525" y="392" font-size="13" font-weight="bold" fill="#1a1a1a">Особливості повнодіапазонного живлення:</text>
  <text x="525" y="413" font-size="12" fill="#1a1a1a">• Повний діапазон: від -55 °C до +150 °C</text>
  <text x="525" y="433" font-size="12" font-weight="bold" fill="#27ae60">• Вихідна напруга: -550 мВ (-55 °C) ... +1500 мВ (+150 °C)</text>
  <text x="525" y="453" font-size="12" fill="#1a1a1a">• R_S витягує струм 50 мкА з V_OUT в -V_S при T &lt; 0 °C</text>
  <text x="525" y="473" font-size="12" fill="#6b7280">• Забезпечує лінійність 10 мВ/°C по всьому діапазону</text>
  <text x="525" y="493" font-size="11" fill="#6b7280">• Використовується для вулиці, морозильників, вузлів ОВК</text>
</svg>
