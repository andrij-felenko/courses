<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Аналоговий тракт LM35 для вимірювання від'ємних і додатних температур</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Зсув рівня на операційному підсилювачі узгоджує двополярний сигнал (-0.55 В...+1.5 В) із діапазоном АЦП (0...3.3 В)</text>

  <!-- Panel 1: Sensor & Negative Bias Source -->
  <rect x="30" y="75" width="270" height="315" fill="#f4f6f8" stroke="#d0d7de" rx="6"/>
  <text x="165" y="100" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">1. Сенсор LM35 (-55...+150 °C)</text>

  <!-- LM35 Component Body -->
  <rect x="45" y="125" width="125" height="85" fill="#ffffff" stroke="#2457d6" stroke-width="2" rx="4"/>
  <text x="107" y="152" font-size="13" font-weight="700" fill="#2457d6" text-anchor="middle">LM35DZ</text>
  <text x="107" y="172" font-size="12" fill="#6b7280" text-anchor="middle">10 мВ/°C</text>
  <text x="107" y="192" font-size="12" fill="#1a1a1a" text-anchor="middle">Давач температури</text>

  <!-- LM35 Pins & Power -->
  <!-- Pin 1: +5V -->
  <path d="M70,125 L70,115" stroke="#2457d6" stroke-width="2"/>
  <text x="70" y="108" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">+5 В</text>

  <!-- Pin 3: GND -->
  <path d="M107,210 L107,230" stroke="#1a1a1a" stroke-width="1.5"/>
  <path d="M97,230 L117,230 M101,234 L113,234 M105,238 L109,238" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="107" y="252" font-size="12" fill="#6b7280" text-anchor="middle">GND (0 В)</text>

  <!-- Pin 2: V_OUT -->
  <path d="M170,167 L210,167" stroke="#2457d6" stroke-width="2"/>
  <circle cx="210" cy="167" r="3" fill="#2457d6"/>

  <!-- Pull-down Resistor R_S -->
  <path d="M210,167 L210,195" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="200" y="195" width="20" height="40" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" rx="2"/>
  <text x="210" y="219" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">R_S</text>
  <path d="M210,235 L210,255" stroke="#c0392b" stroke-width="1.5"/>
  <text x="210" y="272" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">-V_S (-5 В)</text>
  <text x="245" y="219" font-size="12" fill="#6b7280" text-anchor="middle">18 кОм</text>

  <!-- Output Voltage specs box -->
  <rect x="42" y="285" width="246" height="92" fill="#eaf0fd" stroke="#2457d6" rx="4"/>
  <text x="165" y="305" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Вихідний сигнал V_OUT:</text>
  <text x="52" y="327" font-size="12" fill="#1a1a1a">• При -55 °C ➔ V_OUT = -0.55 В</text>
  <text x="52" y="347" font-size="12" fill="#1a1a1a">• При   0 °C ➔ V_OUT =  0.00 В</text>
  <text x="52" y="367" font-size="12" fill="#1a1a1a">• При +150 °C ➔ V_OUT = +1.50 В</text>

  <!-- Signal Arrow Panel 1 -> Panel 2 -->
  <path d="M210,167 L320,167" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="265" y="155" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">V_OUT (-0.55 В...+1.5 В)</text>

  <!-- Panel 2: Level Shifter Op-Amp Circuit -->
  <rect x="330" y="75" width="330" height="315" fill="#f4f6f8" stroke="#d0d7de" rx="6"/>
  <text x="495" y="100" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">2. Схема зсуву рівня (Op-Amp)</text>

  <!-- Op-Amp Triangle -->
  <polygon points="440,135 440,215 510,175" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="448" y="157" font-size="13" font-weight="700" fill="#1a1a1a">+</text>
  <text x="448" y="199" font-size="13" font-weight="700" fill="#1a1a1a">-</text>

  <!-- Input resistor R1 to (+) terminal -->
  <path d="M330,167 L355,167" stroke="#2457d6" stroke-width="2"/>
  <rect x="355" y="157" width="40" height="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" rx="2"/>
  <text x="375" y="171" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">R1</text>
  <path d="M395,167 L440,167" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Reference Voltage V_REF input to (-) terminal -->
  <rect x="340" y="215" width="60" height="30" fill="#e9f7ef" stroke="#27ae60" rx="3"/>
  <text x="370" y="234" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">V_REF</text>
  <text x="370" y="258" font-size="12" fill="#6b7280" text-anchor="middle">+1.0 В</text>

  <path d="M400,230 L415,230" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="415" y="220" width="20" height="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" rx="2"/>
  <text x="425" y="234" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">R2</text>
  <path d="M435,230 L440,230 L440,195" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Feedback Resistor R_F (split wire around resistor/text) -->
  <path d="M510,175 L525,175 L525,275 L495,275" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="460" y="265" width="35" height="20" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" rx="2"/>
  <text x="477" y="279" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">R_F</text>
  <path d="M460,275 L430,275 L430,240" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Math & Formula Box -->
  <rect x="342" y="295" width="306" height="82" fill="#e9f7ef" stroke="#27ae60" rx="4"/>
  <text x="495" y="315" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Рівняння перетворення зсуву:</text>
  <text x="352" y="337" font-size="12" fill="#1a1a1a">• V_ADC = V_OUT + V_REF  (при R1 = R2 = R_F)</text>
  <text x="352" y="360" font-size="12" fill="#27ae60" font-weight="700">• V_ADC = -0.55 В + 1.00 В = +0.45 В (додатна!)</text>

  <!-- Signal Arrow Panel 2 -> Panel 3 -->
  <path d="M510,175 L670,175" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="590" y="162" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">V_ADC (+0.45 В...+2.5 В)</text>

  <!-- Panel 3: MCU ADC & Software Processing -->
  <rect x="680" y="75" width="250" height="315" fill="#f4f6f8" stroke="#d0d7de" rx="6"/>
  <text x="805" y="100" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">3. Однополярний АЦП MCU</text>

  <!-- ADC Input Pin Box -->
  <rect x="695" y="125" width="220" height="42" fill="#e9f7ef" stroke="#27ae60" rx="4"/>
  <text x="805" y="143" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Вхід ADC_IN (0...3.3 В)</text>
  <text x="805" y="159" font-size="12" fill="#1a1a1a" text-anchor="middle">Безпечна напруга &gt; 0 В</text>

  <!-- Software Calculation Block -->
  <rect x="695" y="180" width="220" height="197" fill="#ffffff" stroke="#d0d7de" rx="4"/>
  <text x="805" y="200" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Алгоритм у мікроконтролері:</text>
  <text x="705" y="222" font-size="12" fill="#1a1a1a">1. N_ADC = read_adc_raw()</text>
  <text x="705" y="244" font-size="12" fill="#1a1a1a">2. V_ADC = N_ADC × 3.3 / 4095</text>
  <text x="705" y="266" font-size="12" fill="#1a1a1a">3. V_OUT = V_ADC - V_SHIFT</text>
  <text x="705" y="288" font-size="12" font-weight="700" fill="#2457d6">4. T (°C) = V_OUT / 0.010 В</text>

  <!-- Calibration Badge -->
  <rect x="705" y="305" width="200" height="60" fill="#eaf0fd" stroke="#2457d6" rx="3"/>
  <text x="805" y="325" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Двоточкове калібрування</text>
  <text x="805" y="343" font-size="12" fill="#6b7280" text-anchor="middle">Корекція offset та gain</text>
  <text x="805" y="358" font-size="12" fill="#1a1a1a" text-anchor="middle">для точності ±0.5 °C</text>

  <!-- Panel 4: Problem (No Level Shift) -->
  <rect x="30" y="405" width="435" height="110" fill="#fdecea" stroke="#c0392b" rx="6"/>
  <text x="247" y="427" font-size="13" font-weight="700" fill="#c0392b" text-anchor="middle">⛔ Пряме підключення: Без зсуву рівня напруги</text>
  <text x="247" y="450" font-size="12" fill="#1a1a1a" text-anchor="middle">При T &lt; 0 °C вихідна напруга LM35 від'ємна (до -0.55 В).</text>
  <text x="247" y="472" font-size="12" fill="#1a1a1a" text-anchor="middle">Однополярний АЦП мікроконтролера не зчитує напругу нижче 0 В.</text>
  <text x="247" y="495" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Результат: Втрата даних від'ємного діапазону та ризик виходу АЦП з ладу</text>

  <!-- Panel 5: Solution (With Level Shift) -->
  <rect x="495" y="405" width="435" height="110" fill="#e9f7ef" stroke="#27ae60" rx="6"/>
  <text x="712" y="427" font-size="13" font-weight="700" fill="#27ae60" text-anchor="middle">✓ Зі зсувом рівня: Нормований вимірювальний тракт</text>
  <text x="712" y="450" font-size="12" fill="#1a1a1a" text-anchor="middle">Увесь температурний діапазон (-55...+150 °C) мапується в +0.45 В...+2.50 В.</text>
  <text x="712" y="472" font-size="12" fill="#1a1a1a" text-anchor="middle">АЦП працює в оптимальному лінійному режимі без насичення.</text>
  <text x="712" y="495" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Результат: Надійний моніторинг від'ємних і додатних температур</text>
</svg>
