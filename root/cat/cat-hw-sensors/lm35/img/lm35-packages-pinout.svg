<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="500" fill="#ffffff"/>

  <!-- Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Розводка виводів LM35 у корпусах TO-92, TO-220 та SOIC-8</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Призначення ліній VCC, VOUT, GND та відмінності між вивідним і поверхневим монтажем</text>

  <!-- PANEL 1: TO-92 (LM35DZ) -->
  <g id="panel-to92">
    <rect x="30" y="72" width="280" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
    
    <!-- Panel Header -->
    <rect x="45" y="84" width="250" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
    <text x="170" y="104" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">TO-92 (LM35DZ)</text>
    <text x="170" y="128" font-size="12" fill="#6b7280" text-anchor="middle">Вивідний корпус (THT)</text>

    <!-- Visual Body Drawing -->
    <text x="170" y="148" font-size="11" fill="#6b7280" text-anchor="middle">Вид спереду (з боку зрізу)</text>
    
    <!-- Body TO-92 -->
    <rect x="130" y="158" width="80" height="75" rx="4" fill="#2c3e50" stroke="#1a1a1a" stroke-width="1.5"/>
    <path d="M 134 162 L 206 162" stroke="#4a6572" stroke-width="1.5"/>
    <text x="170" y="202" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">LM35DZ</text>

    <!-- Pins -->
    <line x1="145" y1="233" x2="145" y2="270" stroke="#7f8c8d" stroke-width="3"/>
    <line x1="170" y1="233" x2="170" y2="270" stroke="#7f8c8d" stroke-width="3"/>
    <line x1="195" y1="233" x2="195" y2="270" stroke="#7f8c8d" stroke-width="3"/>

    <!-- Pin Number Badges -->
    <circle cx="145" cy="270" r="9" fill="#c0392b"/>
    <text x="145" y="273.5" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

    <circle cx="170" cy="270" r="9" fill="#2457d6"/>
    <text x="170" y="273.5" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>

    <circle cx="195" cy="270" r="9" fill="#27ae60"/>
    <text x="195" y="273.5" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>

    <!-- Pinout Details Table Box -->
    <rect x="42" y="292" width="256" height="118" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

    <!-- Row 1: Pin 1 -->
    <rect x="50" y="302" width="20" height="20" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
    <text x="60" y="316" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">1</text>
    <text x="78" y="316" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="start">+VS</text>
    <text x="125" y="316" font-size="12" fill="#6b7280" text-anchor="start">Живлення (+4...+30 В)</text>

    <!-- Row 2: Pin 2 -->
    <rect x="50" y="331" width="20" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
    <text x="60" y="345" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">2</text>
    <text x="78" y="345" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="start">VOUT</text>
    <text x="125" y="345" font-size="12" fill="#6b7280" text-anchor="start">Вихід (10 мВ/°C)</text>

    <!-- Row 3: Pin 3 -->
    <rect x="50" y="360" width="20" height="20" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
    <text x="60" y="374" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">3</text>
    <text x="78" y="374" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="start">GND</text>
    <text x="125" y="374" font-size="12" fill="#6b7280" text-anchor="start">Земля (0 В)</text>

    <!-- Row 4: Note -->
    <text x="50" y="399" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="start">Стандартне розташування 1-2-3</text>
  </g>

  <!-- PANEL 2: TO-220 (LM35DT) -->
  <g id="panel-to220">
    <rect x="340" y="72" width="280" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
    
    <!-- Panel Header -->
    <rect x="355" y="84" width="250" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
    <text x="480" y="104" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">TO-220 (LM35DT)</text>
    <text x="480" y="128" font-size="12" fill="#6b7280" text-anchor="middle">Потужний з фланцем (THT)</text>

    <!-- Visual Body Drawing -->
    <text x="480" y="145" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">Металевий фланець = GND</text>
    
    <!-- Metal Tab -->
    <rect x="445" y="150" width="70" height="30" rx="3" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1.5"/>
    <circle cx="480" cy="165" r="7" fill="#f4f6f8" stroke="#7f8c8d" stroke-width="1.5"/>

    <!-- Plastic Body -->
    <rect x="440" y="180" width="80" height="53" rx="2" fill="#2c3e50" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="480" y="212" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">LM35DT</text>

    <!-- Pins -->
    <line x1="455" y1="233" x2="455" y2="270" stroke="#7f8c8d" stroke-width="3"/>
    <line x1="480" y1="233" x2="480" y2="270" stroke="#7f8c8d" stroke-width="3"/>
    <line x1="505" y1="233" x2="505" y2="270" stroke="#7f8c8d" stroke-width="3"/>

    <!-- Pin Number Badges -->
    <circle cx="455" cy="270" r="9" fill="#c0392b"/>
    <text x="455" y="273.5" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

    <circle cx="480" cy="270" r="9" fill="#27ae60"/>
    <text x="480" y="273.5" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>

    <circle cx="505" cy="270" r="9" fill="#2457d6"/>
    <text x="505" y="273.5" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>

    <!-- Pinout Details Table Box -->
    <rect x="352" y="292" width="256" height="118" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

    <!-- Row 1: Pin 1 -->
    <rect x="360" y="302" width="20" height="20" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
    <text x="370" y="316" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">1</text>
    <text x="388" y="316" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="start">+VS</text>
    <text x="435" y="316" font-size="12" fill="#6b7280" text-anchor="start">Живлення (+4...+30 В)</text>

    <!-- Row 2: Pin 2 -->
    <rect x="360" y="331" width="20" height="20" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
    <text x="370" y="345" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">2</text>
    <text x="388" y="345" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="start">GND</text>
    <text x="435" y="345" font-size="12" fill="#6b7280" text-anchor="start">Земля (з'єднана з Tab)</text>

    <!-- Row 3: Pin 3 -->
    <rect x="360" y="360" width="20" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
    <text x="370" y="374" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">3</text>
    <text x="388" y="374" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="start">VOUT</text>
    <text x="435" y="374" font-size="12" fill="#6b7280" text-anchor="start">Вихід (10 мВ/°C)</text>

    <!-- Row 4: Warning -->
    <rect x="358" y="386" width="244" height="18" rx="3" fill="#fdecea"/>
    <text x="364" y="399" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="start">⚠️ Увага: GND на Pin 2 (перераховано!)</text>
  </g>

  <!-- PANEL 3: SOIC-8 (LM35M) -->
  <g id="panel-soic8">
    <rect x="650" y="72" width="280" height="350" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
    
    <!-- Panel Header -->
    <rect x="665" y="84" width="250" height="30" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
    <text x="790" y="104" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">SOIC-8 (LM35M)</text>
    <text x="790" y="128" font-size="12" fill="#6b7280" text-anchor="middle">Поверхневий монтаж (SMD)</text>

    <!-- Visual Body Drawing -->
    <text x="790" y="145" font-size="11" fill="#6b7280" text-anchor="middle">8-вивідний планарний корпус</text>
    
    <!-- SOIC-8 Body -->
    <rect x="745" y="155" width="90" height="120" rx="4" fill="#2c3e50" stroke="#1a1a1a" stroke-width="1.5"/>
    
    <!-- Orientation Key (Notch + Dot) -->
    <path d="M 783 155 A 7 7 0 0 0 797 155 Z" fill="#f4f6f8" stroke="#1a1a1a" stroke-width="1"/>
    <circle cx="758" cy="168" r="3.5" fill="#ffffff"/>

    <text x="790" y="220" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">LM35M</text>

    <!-- Left Pins (1-4) -->
    <rect x="725" y="167" width="20" height="6" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="712" cy="170" r="8" fill="#2457d6"/>
    <text x="712" y="173.5" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">1</text>

    <rect x="725" y="195" width="20" height="6" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="712" cy="198" r="8" fill="#95a5a6"/>
    <text x="712" y="201.5" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">2</text>

    <rect x="725" y="223" width="20" height="6" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="712" cy="226" r="8" fill="#95a5a6"/>
    <text x="712" y="229.5" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">3</text>

    <rect x="725" y="251" width="20" height="6" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="712" cy="254" r="8" fill="#27ae60"/>
    <text x="712" y="257.5" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">4</text>

    <!-- Right Pins (8-5) -->
    <rect x="835" y="167" width="20" height="6" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="868" cy="170" r="8" fill="#c0392b"/>
    <text x="868" y="173.5" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>

    <rect x="835" y="195" width="20" height="6" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="868" cy="198" r="8" fill="#95a5a6"/>
    <text x="868" y="201.5" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">7</text>

    <rect x="835" y="223" width="20" height="6" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="868" cy="226" r="8" fill="#95a5a6"/>
    <text x="868" y="229.5" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">6</text>

    <rect x="835" y="251" width="20" height="6" fill="#bdc3c7" stroke="#7f8c8d" stroke-width="1"/>
    <circle cx="868" cy="254" r="8" fill="#95a5a6"/>
    <text x="868" y="257.5" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>

    <!-- Pinout Details Table Box -->
    <rect x="662" y="292" width="256" height="118" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>

    <!-- Row 1: Pin 8 -->
    <rect x="670" y="302" width="20" height="20" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
    <text x="680" y="316" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">8</text>
    <text x="698" y="316" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="start">+VS</text>
    <text x="745" y="316" font-size="12" fill="#6b7280" text-anchor="start">Живлення (+4...+30 В)</text>

    <!-- Row 2: Pin 1 -->
    <rect x="670" y="331" width="20" height="20" rx="3" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
    <text x="680" y="345" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">1</text>
    <text x="698" y="345" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="start">VOUT</text>
    <text x="745" y="345" font-size="12" fill="#6b7280" text-anchor="start">Вихід (10 мВ/°C)</text>

    <!-- Row 3: Pin 4 -->
    <rect x="670" y="360" width="20" height="20" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
    <text x="680" y="374" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">4</text>
    <text x="698" y="374" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="start">GND</text>
    <text x="745" y="374" font-size="12" fill="#6b7280" text-anchor="start">Земля (0 В)</text>

    <!-- Row 4: NC -->
    <rect x="670" y="388" width="20" height="16" rx="3" fill="#f4f6f8" stroke="#95a5a6" stroke-width="1"/>
    <text x="680" y="400" font-size="10" font-weight="bold" fill="#6b7280" text-anchor="middle">NC</text>
    <text x="698" y="399" font-size="11" fill="#6b7280" text-anchor="start">2, 3, 5, 6, 7 — Не підключати</text>
  </g>

  <!-- Bottom Banner -->
  <rect x="30" y="434" width="900" height="38" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="480" y="458" font-size="13" fill="#1a1a1a" text-anchor="middle">Напруга живлення +VS: від +4 В до +30 В | Чутливість: 10 мВ/°C | Струм споживання: ~60 мкА</text>
</svg>
