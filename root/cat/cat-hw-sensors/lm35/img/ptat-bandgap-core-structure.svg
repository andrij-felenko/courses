<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Внутрішня структура ядра PTAT та масштабування напруги LM35</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Різниця напруг ΔV_BE пропорційна температурі K та перетворюється на вихід 10 мВ/°C</text>

  <!-- Left Panel: PTAT Core -->
  <rect x="30" y="75" width="410" height="305" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="235" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Генератор напруги PTAT (ΔV_BE)</text>

  <!-- Power Rail +V_S -->
  <line x1="65" y1="125" x2="405" y2="125" stroke="#1a1a1a" stroke-width="2"/>
  <text x="60" y="129" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">+V_S</text>

  <!-- Current Sources I1 & I2 -->
  <line x1="110" y1="125" x2="110" y2="140" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="80" y="140" width="60" height="32" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="110" y="160" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">I1 = I</text>
  <line x1="110" y1="172" x2="110" y2="205" stroke="#1a1a1a" stroke-width="1.5"/>

  <line x1="350" y1="125" x2="350" y2="140" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="320" y="140" width="60" height="32" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" rx="4"/>
  <text x="350" y="160" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">I2 = I</text>
  <line x1="350" y1="172" x2="350" y2="205" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Transistor Q1 (Area 1x) -->
  <circle cx="110" cy="225" r="18" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="100" y1="215" x2="100" y2="235" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="70" y1="225" x2="100" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="100" y1="218" x2="110" y2="207" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="100" y1="232" x2="110" y2="243" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="107,238 110,243 104,243" fill="#1a1a1a"/>

  <!-- Diode connection Q1 (Collector to Base) -->
  <line x1="110" y1="205" x2="110" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="110" cy="225" r="3" fill="#1a1a1a"/>

  <text x="45" y="198" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Q1 (1×)</text>
  <text x="45" y="213" font-size="12" fill="#6b7280" text-anchor="start">V_BE1</text>

  <!-- Transistor Q2 (Area N=10) -->
  <circle cx="350" cy="225" r="18" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <line x1="340" y1="215" x2="340" y2="235" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="320" y1="225" x2="340" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="340" y1="218" x2="350" y2="207" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="340" y1="232" x2="350" y2="243" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="347,238 350,243 344,243" fill="#1a1a1a"/>

  <text x="378" y="198" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">Q2 (N=10)</text>
  <text x="378" y="213" font-size="12" fill="#6b7280" text-anchor="start">V_BE2</text>

  <!-- Base Connection Wire -->
  <line x1="70" y1="225" x2="320" y2="225" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Q1 Emitter Wire to GND -->
  <line x1="110" y1="243" x2="110" y2="340" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Q2 Emitter Wire through Resistor R1 -->
  <line x1="350" y1="243" x2="350" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="335" y="260" width="30" height="36" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="374" y="282" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">R1</text>
  <line x1="350" y1="296" x2="350" y2="340" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- ΔV_BE Arrow across R1 & Formula -->
  <line x1="290" y1="260" x2="290" y2="296" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="280" y="273" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">ΔV_BE</text>
  <text x="280" y="289" font-size="12" fill="#c0392b" text-anchor="end">= V_BE1 - V_BE2</text>

  <!-- GND Rail -->
  <line x1="65" y1="340" x2="405" y2="340" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="230" y1="340" x2="230" y2="348" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="215" y1="348" x2="245" y2="348" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="220" y1="352" x2="240" y2="352" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="225" y1="356" x2="235" y2="356" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="230" y="370" font-size="12" fill="#6b7280" text-anchor="middle">GND (0 V)</text>

  <!-- Inter-panel PTAT signal line -->
  <line x1="350" y1="190" x2="570" y2="190" stroke="#2457d6" stroke-width="2.5" marker-end="url(#arr-blue)"/>
  <circle cx="350" cy="190" r="3" fill="#2457d6"/>
  <text x="460" y="164" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">I_PTAT = ΔV_BE / R1</text>
  <text x="460" y="180" font-size="12" fill="#2457d6" text-anchor="middle">∝ T (K)</text>

  <!-- Right Panel: Scaling & Offset Stage -->
  <rect x="510" y="75" width="420" height="305" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="720" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Підсилення та калібрування Цельсія</text>

  <!-- Operational Amplifier -->
  <polygon points="570,165 570,265 650,215" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="580" y="195" font-size="14" font-weight="bold" fill="#1a1a1a">+</text>
  <text x="580" y="245" font-size="14" font-weight="bold" fill="#1a1a1a">–</text>
  <text x="610" y="219" font-size="12" font-weight="bold" fill="#6b7280" text-anchor="middle">LM35 Amp</text>

  <!-- Feedback loop (R_FB) -->
  <line x1="685" y1="215" x2="685" y2="145" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="685" cy="215" r="3" fill="#1a1a1a"/>
  <line x1="685" y1="145" x2="655" y2="145" stroke="#1a1a1a" stroke-width="1.5"/>
  <rect x="605" y="133" width="50" height="24" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5" rx="3"/>
  <text x="630" y="149" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">R_FB</text>
  <text x="630" y="124" font-size="12" fill="#6b7280" text-anchor="middle">Масштабування A</text>
  <line x1="605" y1="145" x2="545" y2="145" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="545" y1="145" x2="545" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="545" y1="240" x2="570" y2="240" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Zero Offset Compensation Box -->
  <rect x="540" y="300" width="200" height="52" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="640" y="320" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Компенсація 0 °C</text>
  <text x="640" y="338" font-size="12" fill="#6b7280" text-anchor="middle">–V_BG (віднімає 273.15 K)</text>
  <line x1="545" y1="300" x2="545" y2="240" stroke="#2457d6" stroke-width="1.5"/>
  <circle cx="545" cy="240" r="3" fill="#1a1a1a"/>

  <!-- Output Line to V_OUT -->
  <line x1="685" y1="215" x2="800" y2="215" stroke="#27ae60" stroke-width="2.5" marker-end="url(#arr-green)"/>

  <!-- V_OUT Output Box -->
  <rect x="805" y="190" width="105" height="50" fill="#e9f7ef" stroke="#27ae60" stroke-width="2" rx="6"/>
  <text x="857" y="211" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">V_OUT</text>
  <text x="857" y="229" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">10 мВ/°C</text>

  <!-- Bottom Panel: Formulas & Key Relationships -->
  <rect x="30" y="400" width="900" height="115" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="8"/>
  <text x="50" y="423" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="start">Ключові співвідношення перетворення:</text>

  <!-- Column 1 -->
  <text x="175" y="446" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">1. Напруга PTAT:</text>
  <text x="175" y="465" font-size="12" fill="#1a1a1a" text-anchor="middle">ΔV_BE = (k · T / q) · ln(N)</text>
  <text x="175" y="484" font-size="12" fill="#6b7280" text-anchor="middle">≈ +0.198 мВ/K (при N=10)</text>

  <!-- Divider 1 -->
  <line x1="320" y1="432" x2="320" y2="502" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Column 2 -->
  <text x="465" y="446" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">2. Струм ядра:</text>
  <text x="465" y="465" font-size="12" fill="#1a1a1a" text-anchor="middle">I_PTAT = ΔV_BE / R1 ∝ T (K)</text>
  <text x="465" y="484" font-size="12" fill="#6b7280" text-anchor="middle">Пряма пропорційність Кельвіну</text>

  <!-- Divider 2 -->
  <line x1="610" y1="432" x2="610" y2="502" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Column 3 -->
  <text x="765" y="446" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">3. Вихідна напруга LM35:</text>
  <text x="765" y="465" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">V_OUT = 10 мВ/°C · T(°C)</text>
  <text x="765" y="484" font-size="12" fill="#27ae60" text-anchor="middle">0 мВ при 0 °C  |  +250 мВ при +25 °C</text>
</svg>
