<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Двоточкове калібрування характеристики LM35</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Корекція зміщення нуля (Offset) та коефіцієнта нахилу (Gain) за двома опорними точками</text>

  <!-- Ліва панель: Графік -->
  <rect x="30" y="75" width="580" height="400" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="100" font-size="14" font-weight="700" fill="#1a1a1a">Залежність виходу АЦП від температури T</text>

  <!-- Сітка графіку -->
  <line x1="100" y1="350" x2="560" y2="350" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="100" y1="280" x2="560" y2="280" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="100" y1="210" x2="560" y2="210" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="100" y1="140" x2="560" y2="140" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="3,3"/>

  <line x1="180" y1="120" x2="180" y2="420" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="340" y1="120" x2="340" y2="420" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="500" y1="120" x2="500" y2="420" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Осі координат -->
  <line x1="90" y1="420" x2="565" y2="420" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <line x1="100" y1="430" x2="100" y2="115" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>

  <!-- Позначки та підписи осей -->
  <text x="565" y="445" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">Температура T (°C)</text>
  <text x="100" y="106" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Напруга V (В)</text>

  <!-- Засічки осі X -->
  <line x1="180" y1="420" x2="180" y2="425" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="180" y="440" font-size="12" fill="#1a1a1a" font-weight="700" text-anchor="middle">0 (T₁)</text>

  <line x1="340" y1="420" x2="340" y2="425" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="340" y="440" font-size="12" fill="#6b7280" text-anchor="middle">50</text>

  <line x1="500" y1="420" x2="500" y2="425" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="500" y="440" font-size="12" fill="#1a1a1a" font-weight="700" text-anchor="middle">100 (T₂)</text>

  <!-- Засічки осі Y -->
  <line x1="95" y1="350" x2="100" y2="350" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="88" y="354" font-size="12" fill="#1a1a1a" font-weight="700" text-anchor="end">V₁</text>

  <line x1="95" y1="140" x2="100" y2="140" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="88" y="144" font-size="12" fill="#1a1a1a" font-weight="700" text-anchor="end">V₂</text>

  <!-- Лінії характеристик -->
  <!-- Ідеальна характеристика (пунктир) -->
  <line x1="120" y1="389" x2="540" y2="114" stroke="#6b7280" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Некалібрована характеристика (червона) -->
  <line x1="140" y1="352" x2="530" y2="66" stroke="#c0392b" stroke-width="2.5"/>

  <!-- Калібрована характеристика (зелена) -->
  <line x1="140" y1="376" x2="530" y2="120" stroke="#27ae60" stroke-width="3"/>

  <!-- Позначення похибки Offset (зсув нуля) -->
  <line x1="180" y1="324" x2="180" y2="346" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-red)" marker-end="url(#arr-red)"/>
  <rect x="195" y="323" width="135" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="262" y="339" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Зміщення нуля (Offset)</text>

  <!-- Позначення похибки Gain (нахил) -->
  <line x1="500" y1="94" x2="500" y2="136" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-red)" marker-end="url(#arr-red)"/>
  <rect x="365" y="98" width="130" height="24" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="430" y="114" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Похибка нахилу (Gain)</text>

  <!-- Точки калібрування P1 та P2 -->
  <circle cx="180" cy="350" r="6" fill="#2457d6" stroke="white" stroke-width="2"/>
  <rect x="125" y="370" width="110" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="180" y="385" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Точка P₁ (V₁, T₁)</text>

  <circle cx="500" cy="140" r="6" fill="#2457d6" stroke="white" stroke-width="2"/>
  <rect x="445" y="160" width="110" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="500" y="175" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Точка P₂ (V₂, T₂)</text>

  <!-- Легенда напрямків/прямих -->
  <rect x="290" y="225" width="275" height="85" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <line x1="305" y1="242" x2="335" y2="242" stroke="#c0392b" stroke-width="2.5"/>
  <text x="345" y="246" font-size="12" fill="#1a1a1a">До калібрування (з похибкою)</text>

  <line x1="305" y1="266" x2="335" y2="266" stroke="#27ae60" stroke-width="2.5"/>
  <text x="345" y="270" font-size="12" fill="#1a1a1a">Після калібрування (реальна)</text>

  <line x1="305" y1="290" x2="335" y2="290" stroke="#6b7280" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="345" y="294" font-size="12" fill="#6b7280">Ідеальна характеристика</text>

  <!-- Права верхня панель: Формули -->
  <rect x="630" y="75" width="300" height="190" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="645" y="100" font-size="14" font-weight="700" fill="#1a1a1a">Математична модель</text>
  <text x="645" y="120" font-size="12" fill="#6b7280">Рівняння лінійного перетворення:</text>

  <rect x="645" y="130" width="270" height="34" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="780" y="152" font-size="14" font-weight="700" fill="#2457d6" text-anchor="middle">T = K × V_ADC + B</text>

  <text x="645" y="186" font-size="12" fill="#1a1a1a"><tspan font-weight="700" fill="#27ae60">K (Gain):</tspan> (T₂ - T₁) / (V₂ - V₁)</text>
  <text x="645" y="210" font-size="12" fill="#1a1a1a"><tspan font-weight="700" fill="#c0392b">B (Offset):</tspan> T₁ - K × V₁</text>
  <text x="645" y="240" font-size="12" fill="#6b7280">де V — вихід АЦП, T — температура</text>

  <!-- Права нижня панель: Алгоритм -->
  <rect x="630" y="280" width="300" height="195" rx="8" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="645" y="305" font-size="14" font-weight="700" fill="#27ae60">Алгоритм двоточкової настройки</text>

  <text x="645" y="332" font-size="12" font-weight="700" fill="#1a1a1a">1. Вимірювання у двох точках:</text>
  <text x="660" y="350" font-size="12" fill="#6b7280">P₁ (напр. 0 °C) та P₂ (напр. 100 °C)</text>

  <text x="645" y="375" font-size="12" font-weight="700" fill="#1a1a1a">2. Обчислення коефіцієнтів:</text>
  <text x="660" y="393" font-size="12" fill="#6b7280">Розрахунок K (нахил) та B (зсув)</text>

  <text x="645" y="418" font-size="12" font-weight="700" fill="#1a1a1a">3. Програмна корекція:</text>
  <text x="660" y="436" font-size="12" fill="#6b7280">Застосування K та B до показів АЦП</text>
</svg>
