<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="500" fill="#ffffff"/>

  <!-- Definitions for Arrows & Markers -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-up-green" markerWidth="8" markerHeight="8" refX="4" refY="1" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,7 L4,0 L8,7 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-down-green" markerWidth="8" markerHeight="8" refX="4" refY="7" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L4,7 L8,0 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Header: Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Принцип формування PTAT-напруги у комірці Відлара (Widlar Bandgap)</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Різниця напруг Vbe двох транзисторів із різною густиною струмів пропорційна абсолютній температурі</text>

  <!-- Left Panel: Schematic -->
  <rect x="24" y="70" width="440" height="410" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="40" y="96" font-size="14" font-weight="bold" fill="#1a1a1a">1. Схемотехніка комірки Відлара (PTAT)</text>

  <!-- VCC Rail -->
  <line x1="70" y1="120" x2="418" y2="120" stroke="#1a1a1a" stroke-width="2"/>
  <text x="244" y="114" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">+Vcc (Живлення)</text>

  <!-- Current Mirror Box -->
  <rect x="60" y="130" width="368" height="75" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.2" stroke-dasharray="5,4" rx="6"/>
  <text x="244" y="148" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Дзеркало струму (I₁ = I₂ = I)</text>

  <!-- PNP Q3 (Left) -->
  <line x1="130" y1="120" x2="130" y2="155" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="130" y1="155" x2="142" y2="168" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M131,162 L138,155 L140,165 Z" fill="#1a1a1a"/>
  <line x1="142" y1="165" x2="142" y2="195" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="142" y1="192" x2="130" y2="205" stroke="#1a1a1a" stroke-width="2"/>
  <text x="72" y="180" font-size="12" fill="#6b7280">Q3 (PNP)</text>

  <!-- PNP Q4 (Right) -->
  <line x1="350" y1="120" x2="350" y2="155" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="350" y1="155" x2="338" y2="168" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M349,162 L342,155 L340,165 Z" fill="#1a1a1a"/>
  <line x1="338" y1="165" x2="338" y2="195" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="338" y1="192" x2="350" y2="205" stroke="#1a1a1a" stroke-width="2"/>
  <text x="358" y="180" font-size="12" fill="#6b7280">Q4 (PNP)</text>

  <!-- Base Connection Q3-Q4 & Diode-connection Q3 -->
  <line x1="142" y1="180" x2="338" y2="180" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="130" y1="195" x2="142" y2="180" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="142" cy="180" r="3" fill="#1a1a1a"/>

  <!-- Collector outputs from Current Mirror -->
  <line x1="130" y1="205" x2="130" y2="250" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="350" y1="205" x2="350" y2="250" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Current Arrows & Labels -->
  <line x1="130" y1="215" x2="130" y2="240" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="72" y="232" font-size="12" font-weight="bold" fill="#2457d6">I₁ = I</text>

  <line x1="350" y1="215" x2="350" y2="240" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="362" y="232" font-size="12" font-weight="bold" fill="#2457d6">I₂ = I</text>

  <!-- NPN Transistor Q1 (Left) -->
  <line x1="130" y1="250" x2="130" y2="275" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="130" y1="275" x2="142" y2="282" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="142" y1="275" x2="142" y2="305" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="142" y1="298" x2="130" y2="305" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M132,301 L130,309 L137,307 Z" fill="#1a1a1a"/>
  <line x1="130" y1="305" x2="130" y2="430" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="130" cy="430" r="3" fill="#1a1a1a"/>

  <!-- Q1 Labels -->
  <text x="72" y="275" font-size="13" font-weight="bold" fill="#1a1a1a">Q1</text>
  <text x="45" y="293" font-size="12" fill="#6b7280">Площа = 1×</text>
  <text x="45" y="310" font-size="12" fill="#6b7280">J₁ = I / A₁</text>

  <!-- NPN Transistor Q2 (Right) -->
  <line x1="350" y1="250" x2="350" y2="275" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="350" y1="275" x2="338" y2="282" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="338" y1="275" x2="338" y2="305" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="338" y1="298" x2="350" y2="305" stroke="#1a1a1a" stroke-width="2"/>
  <path d="M348,301 L350,309 L343,307 Z" fill="#1a1a1a"/>
  <line x1="350" y1="305" x2="350" y2="345" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Q2 Labels -->
  <text x="362" y="275" font-size="13" font-weight="bold" fill="#27ae60">Q2</text>
  <text x="362" y="293" font-size="12" font-weight="bold" fill="#27ae60">Площа = n×</text>
  <text x="362" y="310" font-size="12" fill="#6b7280">J₂ = I / (n·A₁)</text>

  <!-- Base Connection Q1-Q2 & Diode-connection Q1 -->
  <line x1="142" y1="290" x2="338" y2="290" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="130" y1="260" x2="142" y2="290" stroke="#1a1a1a" stroke-width="1.5"/>
  <circle cx="130" cy="260" r="3" fill="#1a1a1a"/>

  <!-- Vbe1 and Vbe2 Text Labels above Base Line -->
  <text x="160" y="283" font-size="12" fill="#6b7280">Vbe1</text>
  <text x="300" y="283" font-size="12" fill="#6b7280" text-anchor="end">Vbe2</text>

  <!-- Resistor RE under Q2 -->
  <rect x="343" y="345" width="14" height="45" fill="#ffffff" stroke="#1a1a1a" stroke-width="2" rx="2"/>
  <line x1="350" y1="390" x2="350" y2="430" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="350" cy="430" r="3" fill="#1a1a1a"/>
  <text x="365" y="372" font-size="13" font-weight="bold" fill="#1a1a1a">RE</text>

  <!-- Delta Vbe Arrow & Label -->
  <line x1="275" y1="345" x2="275" y2="390" stroke="#27ae60" stroke-width="2" marker-start="url(#arr-up-green)" marker-end="url(#arr-down-green)"/>
  <line x1="343" y1="345" x2="275" y2="345" stroke="#27ae60" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="343" y1="390" x2="275" y2="390" stroke="#27ae60" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="265" y="363" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">ΔVbe = VT · ln(n)</text>
  <text x="265" y="378" font-size="11" fill="#27ae60" text-anchor="end">= Vbe1 - Vbe2</text>

  <!-- Ground Rail & Symbol -->
  <line x1="70" y1="430" x2="418" y2="430" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="244" y1="430" x2="244" y2="442" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="229" y1="442" x2="259" y2="442" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="234" y1="446" x2="254" y2="446" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="239" y1="450" x2="249" y2="450" stroke="#1a1a1a" stroke-width="1"/>
  <text x="244" y="466" font-size="12" fill="#6b7280" text-anchor="middle">GND (0 В)</text>

  <!-- Right Panel: Math & Temperature Graph -->
  <rect x="480" y="70" width="456" height="410" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="496" y="96" font-size="14" font-weight="bold" fill="#1a1a1a">2. Принцип роботи та термохарактеристики</text>

  <!-- Card 1: Physics & Math -->
  <rect x="494" y="108" width="428" height="162" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="510" y="126" font-size="13" font-weight="bold" fill="#2457d6">Математичне обґрунтування PTAT:</text>

  <text x="510" y="146" font-size="12" fill="#1a1a1a">1. Напруга p-n переходу: <tspan fill="#2457d6" font-weight="bold">Vbe = VT · ln(I / Is)</tspan></text>
  <text x="510" y="166" font-size="12" fill="#1a1a1a">2. Термічний потенціал: <tspan fill="#2457d6" font-weight="bold">VT = (k · T) / q</tspan> ≈ 25.8 мВ (при 300 K)</text>
  <text x="510" y="186" font-size="12" fill="#1a1a1a">3. Різниця напруг: <tspan fill="#27ae60" font-weight="bold">ΔVbe = Vbe1 - Vbe2 = VT · ln(n)</tspan></text>
  <text x="510" y="206" font-size="12" fill="#1a1a1a">4. Струм комірки: <tspan fill="#27ae60" font-weight="bold">I_PTAT = ΔVbe / RE = (k·ln(n) / (q·RE)) · T</tspan></text>

  <rect x="506" y="222" width="404" height="36" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="514" y="244" font-size="12" font-weight="bold" fill="#27ae60">Висновок: ΔVbe та I_PTAT строго лінійні до температури T (K)</text>

  <!-- Card 2: Graph -->
  <rect x="494" y="280" width="428" height="184" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="510" y="298" font-size="13" font-weight="bold" fill="#1a1a1a">3. Залежність напруг від температури T (K)</text>

  <!-- Graph Axes -->
  <line x1="545" y1="425" x2="875" y2="425" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="885" y="429" font-size="12" font-weight="bold" fill="#1a1a1a">T (K)</text>

  <line x1="545" y1="425" x2="545" y2="308" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="538" y="308" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">V (В)</text>

  <!-- Bandgap Reference Line (Blue Dashed) -->
  <line x1="545" y1="325" x2="865" y2="325" stroke="#2457d6" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="700" y="318" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Vbg ≈ 1.25 В (Bandgap Reference)</text>

  <!-- CTAT Curve (Red Line Vbe) -->
  <path d="M 545,325 L 745,385 L 845,410" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="555" y="365" font-size="12" font-weight="bold" fill="#c0392b">Vbe (CTAT)</text>
  <text x="555" y="378" font-size="11" fill="#c0392b">-2 мВ/°C</text>

  <!-- PTAT Curve (Green Line K*Delta Vbe) -->
  <path d="M 545,425 L 745,385 L 845,370" fill="none" stroke="#27ae60" stroke-width="2"/>
  <text x="855" y="344" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">K·ΔVbe (PTAT)</text>
  <text x="855" y="358" font-size="11" fill="#27ae60" text-anchor="end">+2 мВ/°C</text>

  <!-- Intersection Marker & Formula -->
  <circle cx="745" cy="385" r="4" fill="#2457d6"/>
  <text x="745" y="375" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Vbg = Vbe + K·ΔVbe</text>

  <!-- X Ticks & Labels -->
  <line x1="545" y1="425" x2="545" y2="430" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="545" y="444" font-size="11" fill="#6b7280" text-anchor="middle">0 K</text>

  <line x1="745" y1="425" x2="745" y2="430" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="745" y="444" font-size="11" fill="#6b7280" text-anchor="middle">300 K (+27°C)</text>

  <line x1="845" y1="425" x2="845" y2="430" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="845" y="444" font-size="11" fill="#6b7280" text-anchor="middle">400 K</text>
</svg>
