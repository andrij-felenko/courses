<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Markers -->
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Формування опорної напруги V_ref ≈ 1.25 В у схемі Bandgap</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Сумування спадної V_BE (CTAT) та зростаючої K·ΔV_BE (PTAT) формує стабільні 1.25 В</text>

  <!-- Left Main Plot Container -->
  <rect x="95" y="80" width="560" height="380" fill="#f4f6f8" rx="8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Plot Grid Lines -->
  <!-- Horizontal Grid Lines -->
  <line x1="150" y1="360" x2="630" y2="360" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="150" y1="310" x2="630" y2="310" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="150" y1="260" x2="630" y2="260" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="150" y1="210" x2="630" y2="210" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="150" y1="160" x2="630" y2="160" stroke="#eaf0fd" stroke-width="1"/>
  <line x1="150" y1="110" x2="630" y2="110" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Vertical Grid Lines -->
  <line x1="270" y1="110" x2="270" y2="410" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="390" y1="110" x2="390" y2="410" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="630" y1="110" x2="630" y2="410" stroke="#e1e4e8" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Room Temp Highlight Line (300 K) -->
  <line x1="510" y1="110" x2="510" y2="410" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Axes -->
  <!-- Y Axis -->
  <line x1="150" y1="415" x2="150" y2="100" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <!-- X Axis -->
  <line x1="145" y1="410" x2="645" y2="410" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Y Axis Ticks & Labels -->
  <line x1="144" y1="110" x2="150" y2="110" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="140" y="114" font-size="12" fill="#6b7280" text-anchor="end">1.50 В</text>

  <line x1="144" y1="160" x2="150" y2="160" stroke="#2457d6" stroke-width="2"/>
  <text x="140" y="164" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">1.25 В</text>

  <line x1="144" y1="210" x2="150" y2="210" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="140" y="214" font-size="12" fill="#6b7280" text-anchor="end">1.00 В</text>

  <line x1="144" y1="260" x2="150" y2="260" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="140" y="264" font-size="12" fill="#6b7280" text-anchor="end">0.75 В</text>

  <line x1="144" y1="310" x2="150" y2="310" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="140" y="314" font-size="12" fill="#6b7280" text-anchor="end">0.50 В</text>

  <line x1="144" y1="360" x2="150" y2="360" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="140" y="364" font-size="12" fill="#6b7280" text-anchor="end">0.25 В</text>

  <text x="140" y="414" font-size="12" fill="#6b7280" text-anchor="end">0.00 В</text>

  <text x="140" y="96" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="end">Напруга, V (В)</text>

  <!-- X Axis Ticks & Labels -->
  <line x1="150" y1="410" x2="150" y2="416" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="150" y="430" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0 K</text>
  <text x="150" y="445" font-size="12" fill="#6b7280" text-anchor="middle">-273 °C</text>

  <line x1="270" y1="410" x2="270" y2="416" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="270" y="430" font-size="12" fill="#1a1a1a" text-anchor="middle">100 K</text>
  <text x="270" y="445" font-size="12" fill="#6b7280" text-anchor="middle">-173 °C</text>

  <line x1="390" y1="410" x2="390" y2="416" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="390" y="430" font-size="12" fill="#1a1a1a" text-anchor="middle">200 K</text>
  <text x="390" y="445" font-size="12" fill="#6b7280" text-anchor="middle">-73 °C</text>

  <line x1="510" y1="410" x2="510" y2="416" stroke="#2457d6" stroke-width="2"/>
  <text x="510" y="430" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">300 K</text>
  <text x="510" y="445" font-size="12" fill="#2457d6" text-anchor="middle">+27 °C</text>

  <line x1="630" y1="410" x2="630" y2="416" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="630" y="430" font-size="12" fill="#1a1a1a" text-anchor="middle">400 K</text>
  <text x="630" y="445" font-size="12" fill="#6b7280" text-anchor="middle">+127 °C</text>

  <text x="390" y="468" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Температура, T (Кельвін / °C)</text>

  <!-- Plot Curves -->
  <!-- 1. Vref Line (Horizontal blue line at 1.25V / Y=160) -->
  <line x1="150" y1="160" x2="630" y2="160" stroke="#2457d6" stroke-width="3.5"/>

  <!-- 2. CTAT Line (Red line from (150,160) to (630,320)) -->
  <line x1="150" y1="160" x2="630" y2="320" stroke="#c0392b" stroke-width="3"/>

  <!-- 3. PTAT Line (Green line from (150,410) to (630,250)) -->
  <line x1="150" y1="410" x2="630" y2="250" stroke="#27ae60" stroke-width="3"/>

  <!-- Key Operating Dots -->
  <circle cx="150" cy="160" r="5" fill="#2457d6"/>
  <circle cx="150" cy="410" r="5" fill="#27ae60"/>
  <circle cx="510" cy="160" r="5" fill="#2457d6"/>
  <circle cx="510" cy="280" r="4.5" fill="#c0392b"/>
  <circle cx="510" cy="290" r="4.5" fill="#27ae60"/>

  <!-- On-Plot Curve Text Labels -->
  <text x="300" y="148" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">V_ref = V_BE + K·ΔV_BE ≈ 1.25 В</text>

  <text x="440" y="220" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="start">V_BE (CTAT): -2.0 мВ/K</text>

  <text x="440" y="360" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="start">K·ΔV_BE (PTAT): +2.0 мВ/K</text>

  <!-- Right Panel Cards -->
  <!-- Card 1: Math Model -->
  <rect x="675" y="80" width="260" height="194" fill="#f4f6f8" rx="8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="675" y="80" width="260" height="34" fill="#eaf0fd" rx="8" stroke="#d0d7de" stroke-width="1"/>
  <text x="805" y="102" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Математична модель</text>

  <text x="690" y="128" font-size="13" font-weight="bold" fill="#1a1a1a">V_ref = V_BE + K · ΔV_BE</text>
  <text x="690" y="152" font-size="12" font-weight="bold" fill="#c0392b">1. CTAT (V_BE - база-емітер):</text>
  <text x="702" y="170" font-size="12" fill="#6b7280">• ∂V_BE / ∂T ≈ -2.0 мВ/K</text>
  <text x="690" y="194" font-size="12" font-weight="bold" fill="#27ae60">2. PTAT (K·ΔV_BE - різниця):</text>
  <text x="702" y="212" font-size="12" fill="#6b7280">• ΔV_BE = (k·T/q) · ln(N)</text>
  <text x="702" y="230" font-size="12" fill="#6b7280">• K · ∂ΔV_BE / ∂T ≈ +2.0 мВ/K</text>
  <text x="690" y="254" font-size="12" font-weight="bold" fill="#2457d6">3. Результуючий дрейф = 0</text>

  <!-- Card 2: Bandgap Features -->
  <rect x="675" y="288" width="260" height="172" fill="#f4f6f8" rx="8" stroke="#d0d7de" stroke-width="1"/>
  <rect x="675" y="288" width="260" height="34" fill="#e9f7ef" rx="8" stroke="#d0d7de" stroke-width="1"/>
  <text x="805" y="310" font-size="14" font-weight="bold" fill="#27ae60" text-anchor="middle">Особливості в LM35DZ</text>

  <text x="690" y="336" font-size="12" font-weight="bold" fill="#1a1a1a">• Екстраполяція до 0 K:</text>
  <text x="702" y="354" font-size="12" fill="#6b7280">V_ref = V_g0 ≈ 1.25 В (Si bandgap)</text>
  <text x="690" y="378" font-size="12" font-weight="bold" fill="#1a1a1a">• Масштабування виходу:</text>
  <text x="702" y="396" font-size="12" fill="#6b7280">V_out = PTAT · A_v = 10 мВ/°C</text>
  <text x="690" y="420" font-size="12" font-weight="bold" fill="#1a1a1a">• Зсув рівня нуля:</text>
  <text x="702" y="438" font-size="12" fill="#6b7280">0 В при 0 °C (273.15 K)</text>

  <!-- Bottom Takeaway Bar -->
  <rect x="95" y="475" width="840" height="30" fill="#eaf0fd" rx="6" stroke="#2457d6" stroke-width="1"/>
  <text x="515" y="495" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Висновок: Сума двох напруг протилежного нахилу утворює опорний потенціал V_ref ≈ 1.25 В з нульовим дрейфом</text>
</svg>
