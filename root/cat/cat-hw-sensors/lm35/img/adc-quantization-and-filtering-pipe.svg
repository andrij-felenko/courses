<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Main Title & Subtitle -->
  <text x="480" y="30" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Обробка сигналу LM35DZ: квантування АЦП та фільтрація</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Вибір Vref = 1.1 В покращує роздільну здатність до 0.11°C, а ковзне середнє придушує шум</text>

  <!-- Panel 1: Top Pipeline Block Diagram -->
  <rect x="40" y="72" width="880" height="130" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="94" font-size="13" font-weight="bold" fill="#1a1a1a">Тракт вимірювання та обробки аналогового сигналу</text>

  <!-- Block 1: LM35DZ Sensor -->
  <rect x="60" y="110" width="150" height="76" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="135" y="130" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">LM35DZ</text>
  <text x="135" y="148" font-size="12" fill="#1a1a1a" text-anchor="middle">10 мВ / °C</text>
  <text x="135" y="168" font-size="12" fill="#6b7280" text-anchor="middle">Аналоговий вихід</text>

  <!-- Arrow 1 -->
  <text x="240" y="138" font-size="12" fill="#2457d6" text-anchor="middle">Vout</text>
  <line x1="210" y1="148" x2="265" y2="148" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- Block 2: ADC -->
  <rect x="270" y="110" width="235" height="76" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="387.5" y="130" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">АЦП мікроконтролера</text>
  <text x="387.5" y="148" font-size="12" fill="#c0392b" text-anchor="middle">Vref = 5.0 В (LSB = 4.88 мВ)</text>
  <text x="387.5" y="168" font-size="12" fill="#27ae60" text-anchor="middle">Vref = 1.1 В (LSB = 1.07 мВ)</text>

  <!-- Arrow 2 -->
  <text x="532.5" y="138" font-size="12" fill="#1a1a1a" text-anchor="middle">N_ADC</text>
  <line x1="505" y1="148" x2="555" y2="148" stroke="#1a1a1a" stroke-width="2" marker-end="url(#arr-dark)"/>

  <!-- Block 3: Digital Filter -->
  <rect x="560" y="110" width="210" height="76" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="665" y="130" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Програмна фільтрація</text>
  <text x="665" y="148" font-size="12" fill="#1a1a1a" text-anchor="middle">Ковзне середнє (N=16)</text>
  <text x="665" y="168" font-size="12" fill="#6b7280" text-anchor="middle">Придушення шуму</text>

  <!-- Arrow 3 -->
  <text x="792.5" y="138" font-size="12" fill="#27ae60" text-anchor="middle">T (°C)</text>
  <line x1="770" y1="148" x2="815" y2="148" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- Block 4: Output -->
  <rect x="820" y="110" width="85" height="76" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="862.5" y="138" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">Результат</text>
  <text x="862.5" y="158" font-size="12" fill="#1a1a1a" text-anchor="middle">T_out (°C)</text>

  <!-- Panel 2 (Bottom Left): Graph 1 Quantization -->
  <rect x="40" y="220" width="430" height="315" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="55" y="242" font-size="13" font-weight="bold" fill="#1a1a1a">1. Дискретизація та вплив опорної напруги Vref</text>

  <!-- Graph 1 Legend Box -->
  <rect x="235" y="252" width="220" height="58" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <line x1="243" y1="266" x2="263" y2="266" stroke="#c0392b" stroke-width="2"/>
  <text x="268" y="270" font-size="12" fill="#c0392b">Vref = 5.0 В (LSB ≈ 0.49°C)</text>
  <line x1="243" y1="284" x2="263" y2="284" stroke="#27ae60" stroke-width="1.5"/>
  <text x="268" y="288" font-size="12" fill="#27ae60">Vref = 1.1 В (LSB ≈ 0.11°C)</text>
  <line x1="243" y1="302" x2="263" y2="302" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="268" y="306" font-size="12" fill="#2457d6">Вхідний сигнал Vout(t)</text>

  <!-- Graph 1 Grid Lines -->
  <line x1="95" y1="418" x2="405" y2="418" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="95" y1="372" x2="405" y2="372" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="255" y1="465" x2="255" y2="325" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="405" y1="465" x2="405" y2="325" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Graph 1 Axes -->
  <line x1="95" y1="465" x2="95" y2="280" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <line x1="95" y1="465" x2="445" y2="465" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="105" y="272" font-size="12" font-weight="bold" fill="#1a1a1a">Код АЦП N_ADC</text>
  <text x="445" y="510" font-size="12" fill="#1a1a1a" text-anchor="end">Vout (мВ) / Температура (°C)</text>

  <!-- Graph 1 Curves -->
  <!-- Blue Continuous Ideal Input Signal -->
  <line x1="105" y1="465" x2="405" y2="325" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Green Staircase (Fine Quantization: Vref = 1.1V) -->
  <path d="M 105,465 L 125,465 L 125,455.67 L 145,455.67 L 145,446.33 L 165,446.33 L 165,437 L 185,437 L 185,427.67 L 205,427.67 L 205,418.33 L 225,418.33 L 225,409 L 245,409 L 245,399.67 L 265,399.67 L 265,390.33 L 285,390.33 L 285,381 L 305,381 L 305,371.67 L 325,371.67 L 325,362.33 L 345,362.33 L 345,353 L 365,353 L 365,343.67 L 385,343.67 L 385,334.33 L 405,334.33 L 405,325" fill="none" stroke="#27ae60" stroke-width="1.5"/>

  <!-- Red Staircase (Coarse Quantization: Vref = 5.0V) -->
  <path d="M 105,465 L 205,465 L 205,418.33 L 305,418.33 L 305,371.67 L 405,371.67 L 405,325" fill="none" stroke="#c0392b" stroke-width="2"/>

  <!-- Graph 1 Callouts & Ticks -->
  <!-- Red LSB step indicator callout line & text -->
  <line x1="258" y1="442" x2="208" y2="442" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="260" y="445" font-size="12" fill="#c0392b">Крок LSB (5V) ≈ 0.49°C</text>

  <!-- Green LSB step indicator callout line & text -->
  <line x1="185" y1="348" x2="185" y2="425" stroke="#27ae60" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="105" y="340" font-size="12" fill="#27ae60">Крок LSB (1.1V) ≈ 0.11°C</text>

  <!-- X-Axis Ticks -->
  <line x1="105" y1="465" x2="105" y2="470" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="105" y="484" font-size="12" fill="#6b7280" text-anchor="middle">20°C (200мВ)</text>

  <line x1="255" y1="465" x2="255" y2="470" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="255" y="484" font-size="12" fill="#6b7280" text-anchor="middle">25°C (250мВ)</text>

  <line x1="405" y1="465" x2="405" y2="470" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="405" y="484" font-size="12" fill="#6b7280" text-anchor="middle">30°C (300мВ)</text>

  <!-- Panel 3 (Bottom Right): Graph 2 Filtering -->
  <rect x="490" y="220" width="430" height="315" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="505" y="242" font-size="13" font-weight="bold" fill="#1a1a1a">2. Програмне усереднення (ковзне середнє)</text>

  <!-- Graph 2 Legend Box -->
  <rect x="685" y="252" width="225" height="58" rx="4" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <line x1="693" y1="266" x2="713" y2="266" stroke="#c0392b" stroke-width="1.5"/>
  <text x="718" y="270" font-size="12" fill="#c0392b">Сирий зашумлений сигнал</text>
  <line x1="693" y1="284" x2="713" y2="284" stroke="#27ae60" stroke-width="2.5"/>
  <text x="718" y="288" font-size="12" fill="#27ae60">Фільтрований сигнал (N=16)</text>
  <line x1="693" y1="302" x2="713" y2="302" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="718" y="306" font-size="12" fill="#6b7280">Реальна температура T</text>

  <!-- Graph 2 Grid Lines -->
  <line x1="545" y1="415" x2="885" y2="415" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="545" y1="365" x2="885" y2="365" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Graph 2 Axes -->
  <line x1="545" y1="465" x2="545" y2="280" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <line x1="545" y1="465" x2="895" y2="465" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-dark)"/>
  <text x="555" y="272" font-size="12" font-weight="bold" fill="#1a1a1a">Температура T (°C)</text>
  <text x="895" y="510" font-size="12" fill="#1a1a1a" text-anchor="end">Час t (відліки)</text>

  <!-- Graph 2 Curves -->
  <!-- True Temperature Baseline -->
  <path d="M 555,410 C 660,400 770,375 885,350" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Raw Noisy Signal (Red Jagged Polyline) -->
  <polyline points="555,410 570,390 585,425 600,380 615,415 630,375 645,420 660,385 675,410 690,370 705,405 720,365 735,415 750,360 765,395 780,355 795,385 810,350 825,380 840,345 855,375 870,345 885,350" fill="none" stroke="#c0392b" stroke-width="1.5"/>

  <!-- Filtered Smooth Trend (Green Thick Curve) -->
  <path d="M 555,410 C 630,402 730,380 885,350" fill="none" stroke="#27ae60" stroke-width="2.5"/>

  <!-- Graph 2 Annotations -->
  <!-- Red Noise Leader Line & Label -->
  <line x1="600" y1="375" x2="600" y2="345" stroke="#c0392b" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="555" y="335" font-size="12" fill="#c0392b">Шуми та імпульсні наводки</text>

  <!-- Green Smooth Leader Line & Label -->
  <line x1="740" y1="378" x2="740" y2="423" stroke="#27ae60" stroke-width="1" stroke-dasharray="2,2"/>
  <text x="670" y="442" font-size="12" fill="#27ae60">Згладжений тренд (ковзне середнє)</text>
</svg>
