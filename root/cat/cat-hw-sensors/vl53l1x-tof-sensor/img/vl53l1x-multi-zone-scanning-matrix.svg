<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="880" height="500" fill="url(#bgGrad4)" rx="12" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="440" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    Просторове оптичне сканування без рухомих механізмів
  </text>
  <text x="440" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">
    Динамічне переміщення оптичного центра ROI по матриці SPAD для побудови 2D/3D карти глибини
  </text>

  <!-- Left: Matrix with 4 zones -->
  <g transform="translate(60, 95)">
    <rect width="360" height="360" rx="8" fill="#111827" stroke="#475569" stroke-width="1.5"/>
    <text x="180" y="28" fill="#f8fafc" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">
      Матриця SPAD 16×16 із 4 секторами сканування
    </text>

    <!-- 4 Sub-zones -->
    <!-- Zone 1: Top-Left -->
    <rect x="40" y="50" width="130" height="130" rx="4" fill="#3b82f6" fill-opacity="0.3" stroke="#60a5fa" stroke-width="2"/>
    <circle cx="105" cy="115" r="5" fill="#60a5fa"/>
    <text x="105" y="110" fill="#dbeafe" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">Зона 1 (Ліво-Вгору)</text>

    <!-- Zone 2: Top-Right -->
    <rect x="190" y="50" width="130" height="130" rx="4" fill="#10b981" fill-opacity="0.3" stroke="#34d399" stroke-width="2"/>
    <circle cx="255" cy="115" r="5" fill="#34d399"/>
    <text x="255" y="110" fill="#d1fae5" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">Зона 2 (Право-Вгору)</text>

    <!-- Zone 3: Bottom-Left -->
    <rect x="40" y="200" width="130" height="130" rx="4" fill="#f59e0b" fill-opacity="0.3" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="105" cy="265" r="5" fill="#fbbf24"/>
    <text x="105" y="260" fill="#fef3c7" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">Зона 3 (Ліво-Низ)</text>

    <!-- Zone 4: Bottom-Right -->
    <rect x="190" y="200" width="130" height="130" rx="4" fill="#a855f7" fill-opacity="0.3" stroke="#c084fc" stroke-width="2"/>
    <circle cx="255" cy="265" r="5" fill="#c084fc"/>
    <text x="255" y="260" fill="#f3e8ff" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">Зона 4 (Право-Низ)</text>
  </g>

  <!-- Right: Resulting Spatial Map -->
  <g transform="translate(470, 95)">
    <rect width="360" height="360" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="180" y="28" fill="#f8fafc" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">
      Результат: 4-зонна карта перешкод робота
    </text>

    <!-- Visual 4 distance gauges -->
    <g transform="translate(30, 50)">
      <rect width="300" height="55" rx="5" fill="#0f172a" stroke="#60a5fa" stroke-width="1"/>
      <text x="15" y="25" fill="#60a5fa" font-family="system-ui" font-size="11" font-weight="bold">Зона 1 (Лівий сектор):</text>
      <text x="15" y="45" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold">Дистанція: 1240 мм</text>
    </g>

    <g transform="translate(30, 115)">
      <rect width="300" height="55" rx="5" fill="#0f172a" stroke="#34d399" stroke-width="1"/>
      <text x="15" y="25" fill="#34d399" font-family="system-ui" font-size="11" font-weight="bold">Зона 2 (Правий сектор):</text>
      <text x="15" y="45" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold">Дистанція: 2450 мм</text>
    </g>

    <g transform="translate(30, 180)">
      <rect width="300" height="55" rx="5" fill="#0f172a" stroke="#fbbf24" stroke-width="1"/>
      <text x="15" y="25" fill="#fbbf24" font-family="system-ui" font-size="11" font-weight="bold">Зона 3 (Лівий низ):</text>
      <text x="15" y="45" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold">Дистанція: 480 мм (Увага!)</text>
    </g>

    <g transform="translate(30, 245)">
      <rect width="300" height="55" rx="5" fill="#0f172a" stroke="#c084fc" stroke-width="1"/>
      <text x="15" y="25" fill="#c084fc" font-family="system-ui" font-size="11" font-weight="bold">Зона 4 (Правий низ):</text>
      <text x="15" y="45" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold">Дистанція: 510 мм</text>
    </g>

    <text x="180" y="335" fill="#a7f3d0" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">
      Повноцінний Solid-State LiDAR без жодної рухомої деталі!
    </text>
  </g>
</svg>