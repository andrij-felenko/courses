<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="880" height="500" fill="url(#bgGrad2)" rx="12" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="440" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    Геометрія програмного звуження кута огляду (FoV) у VL53L1X
  </text>
  <text x="440" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">
    Порівняння стандартного кута 27° (матриця 16×16) та звуженого кута 15° (підматриця 4×4)
  </text>

  <!-- Left: Wide FoV 27 deg (16x16) -->
  <g transform="translate(50, 90)">
    <rect width="360" height="370" rx="8" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="180" y="30" fill="#38bdf8" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">
      Широкий конус: Повний масив 16×16 (FoV = 27°)
    </text>

    <!-- Cone visual -->
    <path d="M 180 320 L 70 80 L 290 80 Z" fill="#0284c7" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1.5"/>

    <!-- Sensor Module at bottom -->
    <rect x="130" y="320" width="100" height="30" rx="4" fill="#1e293b" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="180" y="340" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">VL53L1X</text>

    <!-- Obstacle on side (problem) -->
    <rect x="60" y="110" width="40" height="90" rx="3" fill="#ef4444" stroke="#f87171" stroke-width="1.5"/>
    <text x="80" y="160" fill="#ffffff" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle" transform="rotate(-90 80 160)">Стінка труби</text>

    <text x="180" y="250" fill="#fca5a5" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">
      Хибне відбиття від бокових стінок!
    </text>
  </g>

  <!-- Right: Narrow FoV 15 deg (4x4 ROI) -->
  <g transform="translate(470, 90)">
    <rect width="360" height="370" rx="8" fill="#111827" stroke="#10b981" stroke-width="1.5"/>
    <text x="180" y="30" fill="#34d399" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">
      Звужений конус: Активна ROI 4×4 (FoV = 15°)
    </text>

    <!-- Narrow Cone visual -->
    <path d="M 180 320 L 120 80 L 240 80 Z" fill="#059669" fill-opacity="0.2" stroke="#10b981" stroke-width="2"/>

    <!-- Sensor Module at bottom -->
    <rect x="130" y="320" width="100" height="30" rx="4" fill="#1e293b" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="180" y="340" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">VL53L1X</text>

    <!-- Obstacle on side (missed cleanly) -->
    <rect x="60" y="110" width="40" height="90" rx="3" fill="#334155" stroke="#64748b" stroke-width="1"/>
    <text x="80" y="160" fill="#94a3b8" font-family="system-ui" font-size="10" text-anchor="middle" transform="rotate(-90 80 160)">Стінка труби</text>

    <!-- Target reached -->
    <rect x="130" y="70" width="100" height="15" rx="2" fill="#facc15"/>
    <text x="180" y="60" fill="#fde047" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">Цільовий об&#39;єкт</text>

    <text x="180" y="250" fill="#a7f3d0" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">
      Промінь проходить крізь вузький отвір!
    </text>
  </g>
</svg>