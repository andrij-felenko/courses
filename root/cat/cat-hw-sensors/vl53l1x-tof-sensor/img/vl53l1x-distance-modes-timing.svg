<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="880" height="500" fill="url(#bgGrad3)" rx="12" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="440" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    Режими вимірювання VL53L1X: Short Mode vs Long Mode
  </text>
  <text x="440" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">
    Оптимізація частоти випромінювання та стійкості до сонячного засвічення
  </text>

  <!-- Panel 1: Short Distance Mode -->
  <g transform="translate(50, 90)">
    <rect width="360" height="370" rx="8" fill="#111827" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="180" y="30" fill="#38bdf8" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">
      Short Mode (Коротка дистанція)
    </text>

    <rect x="25" y="55" width="310" height="110" rx="6" fill="#1e293b" stroke="#0284c7" stroke-width="1"/>
    <text x="35" y="80" fill="#e2e8f0" font-family="system-ui" font-size="12" font-weight="bold">• Максимальна дистанція: до 1.3 м</text>
    <text x="35" y="105" fill="#e2e8f0" font-family="system-ui" font-size="12" font-weight="bold">• Стійкість до сонця: НАЙВИЩА</text>
    <text x="35" y="130" fill="#e2e8f0" font-family="system-ui" font-size="11.5">• Частота модулювальних імпульсів: висока</text>
    <text x="35" y="150" fill="#e2e8f0" font-family="system-ui" font-size="11.5">• Час накопичення фотонів: короткий (20 мс)</text>

    <!-- Timing diagram pulses -->
    <rect x="25" y="185" width="310" height="85" rx="5" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="35" y="205" fill="#94a3b8" font-family="system-ui" font-size="10.5">Висока частота імпульсів VCSEL:</text>
    <!-- Pulses close together -->
    <line x1="40" y1="250" x2="320" y2="250" stroke="#64748b" stroke-width="1.5"/>
    <rect x="50" y="220" width="12" height="30" fill="#38bdf8"/>
    <rect x="80" y="220" width="12" height="30" fill="#38bdf8"/>
    <rect x="110" y="220" width="12" height="30" fill="#38bdf8"/>
    <rect x="140" y="220" width="12" height="30" fill="#38bdf8"/>
    <rect x="170" y="220" width="12" height="30" fill="#38bdf8"/>
    <rect x="200" y="220" width="12" height="30" fill="#38bdf8"/>
    <rect x="230" y="220" width="12" height="30" fill="#38bdf8"/>
    <rect x="260" y="220" width="12" height="30" fill="#38bdf8"/>
    <rect x="290" y="220" width="12" height="30" fill="#38bdf8"/>

    <rect x="25" y="290" width="310" height="60" rx="5" fill="#082f49"/>
    <text x="35" y="312" fill="#7dd3fc" font-family="system-ui" font-size="11" font-weight="bold">Рекомендація застосування:</text>
    <text x="35" y="330" fill="#cbd5e1" font-family="system-ui" font-size="10.5">Вуличні умови, яскраве сонце (до 100 клк).</text>
  </g>

  <!-- Panel 2: Long Distance Mode -->
  <g transform="translate(470, 90)">
    <rect width="360" height="370" rx="8" fill="#111827" stroke="#10b981" stroke-width="1.5"/>
    <text x="180" y="30" fill="#34d399" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">
      Long Mode (Довга дистанція)
    </text>

    <rect x="25" y="55" width="310" height="110" rx="6" fill="#1e293b" stroke="#059669" stroke-width="1"/>
    <text x="35" y="80" fill="#e2e8f0" font-family="system-ui" font-size="12" font-weight="bold">• Максимальна дистанція: до 4.0 м</text>
    <text x="35" y="105" fill="#e2e8f0" font-family="system-ui" font-size="12" font-weight="bold">• Стійкість до сонця: помірна (приміщення)</text>
    <text x="35" y="130" fill="#e2e8f0" font-family="system-ui" font-size="11.5">• Частота модулювальних імпульсів: знижена</text>
    <text x="35" y="150" fill="#e2e8f0" font-family="system-ui" font-size="11.5">• Більший часовий інтервал для ToF (4 м)</text>

    <!-- Timing diagram pulses -->
    <rect x="25" y="185" width="310" height="85" rx="5" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="35" y="205" fill="#94a3b8" font-family="system-ui" font-size="10.5">Збільшений інтервал між імпульсами:</text>
    <line x1="40" y1="250" x2="320" y2="250" stroke="#64748b" stroke-width="1.5"/>
    <rect x="60" y="220" width="12" height="30" fill="#10b981"/>
    <rect x="140" y="220" width="12" height="30" fill="#10b981"/>
    <rect x="220" y="220" width="12" height="30" fill="#10b981"/>
    <rect x="300" y="220" width="12" height="30" fill="#10b981"/>

    <rect x="25" y="290" width="310" height="60" rx="5" fill="#064e3b"/>
    <text x="35" y="312" fill="#6ee7b7" font-family="system-ui" font-size="11" font-weight="bold">Рекомендація застосування:</text>
    <text x="35" y="330" fill="#cbd5e1" font-family="system-ui" font-size="10.5">Внутрішні приміщення, навігація роботів.</text>
  </g>
</svg>