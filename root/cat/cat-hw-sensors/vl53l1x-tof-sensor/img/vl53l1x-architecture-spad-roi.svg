<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="vcselGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
  </defs>

  <rect width="880" height="520" fill="url(#bgGrad)" rx="12" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="440" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    Архітектура сенсора другого покоління VL53L1X
  </text>
  <text x="440" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">
    Лазер VCSEL 940 нм, розширена матриця SPAD 16×16 та програмне керування зоною ROI
  </text>

  <!-- Left: VCSEL Emitter Tx -->
  <g transform="translate(50, 95)">
    <rect width="230" height="380" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="115" y="30" fill="#c7d2fe" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">
      Оптичний передавач Tx
    </text>

    <!-- VCSEL -->
    <rect x="25" y="60" width="180" height="70" rx="6" fill="url(#vcselGrad)" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="115" y="90" fill="#ffffff" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">VCSEL Лазер 940 нм</text>
    <text x="115" y="110" fill="#fee2e2" font-family="system-ui" font-size="11" text-anchor="middle">Class 1 Невидимий ІЧ</text>

    <!-- Driver & Timing -->
    <rect x="25" y="150" width="180" height="60" rx="5" fill="#312e81" stroke="#6366f1" stroke-width="1"/>
    <text x="115" y="175" fill="#e0e7ff" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">Драйвер імпульсів</text>
    <text x="115" y="195" fill="#a5b4fc" font-family="system-ui" font-size="10.5" text-anchor="middle">Модуляція до 50 МГц</text>

    <!-- Range Specs -->
    <rect x="25" y="230" width="180" height="120" rx="5" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="115" y="255" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">Параметри дальності:</text>
    <text x="35" y="280" fill="#cbd5e1" font-family="system-ui" font-size="11">• Діапазон: 4 ... 400 см</text>
    <text x="35" y="302" fill="#cbd5e1" font-family="system-ui" font-size="11">• Частота: до 50 Гц</text>
    <text x="35" y="324" fill="#cbd5e1" font-family="system-ui" font-size="11">• Роздільність: 1 мм</text>
  </g>

  <!-- Middle: SPAD Array 16x16 & ROI Selection -->
  <g transform="translate(310, 95)">
    <rect width="280" height="380" rx="8" fill="#083344" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="140" y="30" fill="#a5f3fc" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">
      Матриця SPAD 16×16 (Rx)
    </text>

    <!-- 16x16 Grid representation -->
    <rect x="30" y="55" width="220" height="220" rx="4" fill="#0e7490" stroke="#0891b2" stroke-width="1"/>

    <!-- Full array FoV label -->
    <text x="140" y="48" fill="#67e8f9" font-family="system-ui" font-size="10" text-anchor="middle">Повний масив: 256 SPAD (FoV = 27°)</text>

    <!-- Sub-matrix ROI 4x4 active in center -->
    <rect x="90" y="115" width="100" height="100" rx="3" fill="#f59e0b" fill-opacity="0.3" stroke="#f59e0b" stroke-width="2.5"/>
    <circle cx="140" cy="165" r="4" fill="#f59e0b"/>
    <text x="140" y="155" fill="#fef08a" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">Активна ROI</text>
    <text x="140" y="180" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">4×4 пікселі</text>
    <text x="140" y="195" fill="#fef08a" font-family="system-ui" font-size="10" text-anchor="middle">(FoV = 15°)</text>

    <!-- ROI Info -->
    <rect x="20" y="290" width="240" height="70" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="130" y="312" fill="#38bdf8" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">Програмне зонування:</text>
    <text x="30" y="330" fill="#cbd5e1" font-family="system-ui" font-size="10.5">• Розмір: від 4×4 до 16×16</text>
    <text x="30" y="348" fill="#cbd5e1" font-family="system-ui" font-size="10.5">• Зсув центра: оптичне сканування</text>
  </g>

  <!-- Right: Digital DSP & Interface -->
  <g transform="translate(615, 95)">
    <rect width="215" height="380" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
    <text x="107" y="30" fill="#bbf7d0" font-family="system-ui" font-size="14" font-weight="bold" text-anchor="middle">
      DSP та інтерфейси
    </text>

    <rect x="20" y="55" width="175" height="65" rx="5" fill="#166534"/>
    <text x="107" y="80" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">TDC + Гістограма</text>
    <text x="107" y="100" fill="#dcfce7" font-family="system-ui" font-size="10" text-anchor="middle">Квантування пікосекунд</text>

    <rect x="20" y="135" width="175" height="75" rx="5" fill="#166534"/>
    <text x="107" y="160" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">Режими дистанції</text>
    <text x="107" y="180" fill="#fef08a" font-family="system-ui" font-size="10.5" text-anchor="middle">Short Mode (до 1.3 м)</text>
    <text x="107" y="196" fill="#fef08a" font-family="system-ui" font-size="10.5" text-anchor="middle">Long Mode (до 4.0 м)</text>

    <rect x="20" y="225" width="175" height="130" rx="5" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="107" y="250" fill="#34d399" font-family="system-ui" font-size="11.5" font-weight="bold" text-anchor="middle">Шина та виводи</text>
    <text x="30" y="275" fill="#cbd5e1" font-family="monospace" font-size="10.5">• I2C Fast (400 кГц)</text>
    <text x="30" y="295" fill="#cbd5e1" font-family="monospace" font-size="10.5">• XSHUT (Power/Reset)</text>
    <text x="30" y="315" fill="#cbd5e1" font-family="monospace" font-size="10.5">• GPIO1 (Переривання)</text>
    <text x="30" y="335" fill="#cbd5e1" font-family="monospace" font-size="10.5">• Живлення 2.8 ... 3.3 В</text>
  </g>
</svg>