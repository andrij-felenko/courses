<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="470" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Апаратний конвеєр стиснення JPEG у сенсорі OV2640</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Послідовна обробка YUV422 зменшує обсяг кадрових даних перед передачею через шину DVP</text>

  <!-- Main Engine Container -->
  <rect x="25" y="75" width="910" height="375" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Container Header -->
  <text x="45" y="100" font-size="14" font-weight="bold" fill="#1a1a1a">Внутрішній модуль кодування JPEG (OV2640 DSP / Compressor)</text>
  <rect x="710" y="85" width="205" height="22" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="812.5" y="100" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Паралельний потік DVP</text>

  <!-- Stage 1: Segmentation -->
  <rect x="45" y="125" width="190" height="205" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="53" y="137" width="55" height="20" rx="3" fill="#eaf0fd"/>
  <text x="80.5" y="151" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ЕТАП 1</text>
  <text x="53" y="175" font-size="14" font-weight="bold" fill="#1a1a1a">Сегментація 8×8</text>
  <text x="53" y="194" font-size="12" fill="#6b7280">Вхід: потік YUV422</text>
  <text x="53" y="218" font-size="12" fill="#1a1a1a">• Поділ на блоки 8×8</text>
  <text x="53" y="236" font-size="12" fill="#1a1a1a">• Компоненти Y, Cb, Cr</text>
  <text x="53" y="254" font-size="12" fill="#6b7280">• 16 біт на піксель</text>
  <rect x="53" y="275" width="174" height="45" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="140" y="292" font-size="12" fill="#6b7280" text-anchor="middle">Обсяг даних</text>
  <text x="140" y="310" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">100% (без стиснення)</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="235" y1="227" x2="271" y2="227" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <text x="255" y="215" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">8×8</text>

  <!-- Stage 2: FDCT -->
  <rect x="275" y="125" width="190" height="205" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="283" y="137" width="55" height="20" rx="3" fill="#eaf0fd"/>
  <text x="310.5" y="151" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">ЕТАП 2</text>
  <text x="283" y="175" font-size="14" font-weight="bold" fill="#1a1a1a">Пряме ДКП (FDCT)</text>
  <text x="283" y="194" font-size="12" fill="#6b7280">Частотна трансформація</text>
  <text x="283" y="218" font-size="12" fill="#1a1a1a">• Блок 8×8 → 64 частоти</text>
  <text x="283" y="236" font-size="12" fill="#1a1a1a">• Виділення DC і AC</text>
  <text x="283" y="254" font-size="12" fill="#6b7280">• Енергія у низьких f</text>
  <rect x="283" y="275" width="174" height="45" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="370" y="292" font-size="12" fill="#6b7280" text-anchor="middle">Втрати інформації</text>
  <text x="370" y="310" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0% (математично точне)</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="465" y1="227" x2="501" y2="227" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <text x="485" y="215" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">F[u,v]</text>

  <!-- Stage 3: Quantization -->
  <rect x="505" y="125" width="190" height="205" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <rect x="513" y="137" width="55" height="20" rx="3" fill="#2457d6"/>
  <text x="540.5" y="151" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ЕТАП 3</text>
  <text x="513" y="175" font-size="14" font-weight="bold" fill="#2457d6">Квантування</text>
  <text x="513" y="194" font-size="12" fill="#2457d6">Матричне ділення Q</text>
  <text x="513" y="218" font-size="12" fill="#1a1a1a">• Ділення на матрицю Q</text>
  <text x="513" y="236" font-size="12" fill="#1a1a1a">• Обнулення високих f</text>
  <text x="513" y="254" font-size="12" font-weight="bold" fill="#c0392b">• Основні втрати даних</text>
  <rect x="513" y="275" width="174" height="45" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="600" y="292" font-size="12" fill="#2457d6" text-anchor="middle">Рівень стиснення</text>
  <text x="600" y="310" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">~5× ... 10×</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="695" y1="227" x2="731" y2="227" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <text x="715" y="215" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Q-коде</text>

  <!-- Stage 4: Huffman Coding -->
  <rect x="735" y="125" width="190" height="205" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <rect x="743" y="137" width="55" height="20" rx="3" fill="#27ae60"/>
  <text x="770.5" y="151" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">ЕТАП 4</text>
  <text x="743" y="175" font-size="14" font-weight="bold" fill="#27ae60">Кодування Гаффмана</text>
  <text x="743" y="194" font-size="12" fill="#6b7280">Ентропійне стиснення</text>
  <text x="743" y="218" font-size="12" fill="#1a1a1a">• Зигзаг-сканування</text>
  <text x="743" y="236" font-size="12" fill="#1a1a1a">• RLE-стиснення нулів</text>
  <text x="743" y="254" font-size="12" fill="#27ae60">• Коди змінної довжини</text>
  <rect x="743" y="275" width="174" height="45" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1"/>
  <text x="830" y="292" font-size="12" fill="#27ae60" text-anchor="middle">Підсумковий потік</text>
  <text x="830" y="310" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">~10× ... 20×</text>

  <!-- Bottom Panel: Output Interface & Performance Impact -->
  <rect x="45" y="345" width="880" height="90" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>

  <!-- Left Column: DVP Output Signals -->
  <text x="60" y="368" font-size="13" font-weight="bold" fill="#1a1a1a">Вихідний інтерфейс DVP та кадрування JPEG</text>
  <rect x="60" y="382" width="185" height="24" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="152.5" y="398" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">SOI (0xFFD8) ... EOI (0xFFD9)</text>
  <rect x="255" y="382" width="205" height="24" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="357.5" y="398" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">PCLK, VSYNC, HREF, Y[9:2]</text>
  <text x="60" y="422" font-size="12" fill="#6b7280">• Побайтна передача стиснутого кадрованого бітстриму</text>

  <!-- Column Divider -->
  <line x1="475" y1="355" x2="475" y2="425" stroke="#d0d7de" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Right Column: Framing Performance Impact -->
  <text x="495" y="368" font-size="13" font-weight="bold" fill="#27ae60">Ефективність стиснення кадру (UXGA 1600×1200)</text>
  <rect x="495" y="380" width="170" height="44" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="580" y="396" font-size="12" fill="#c0392b" text-anchor="middle">Кадр YUV422 (Raw)</text>
  <text x="580" y="414" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">~3,84 МБайт / кадр</text>

  <line x1="673" y1="402" x2="702" y2="402" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="687.5" y="395" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">JPEG</text>

  <rect x="710" y="380" width="200" height="44" rx="4" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="810" y="396" font-size="12" fill="#27ae60" text-anchor="middle">Кадр JPEG (Стиснутий)</text>
  <text x="810" y="414" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">~150–300 КБайт / кадр</text>
</svg>
