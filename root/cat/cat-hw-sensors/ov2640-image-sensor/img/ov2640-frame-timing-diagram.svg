<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" width="960" height="550" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-blue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L7,4 L1,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-blue-start" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M7,1 L1,4 L7,7 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L7,4 L1,7 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-red-start" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M7,1 L1,4 L7,7 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-dark" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L7,4 L1,7 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-dark-start" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M7,1 L1,4 L7,7 Z" fill="#1a1a1a"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="550" fill="white"/>

  <!-- Main Header -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма кадру та часова структура DVP сенсора OV2640</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Співвідношення сигналів VSYNC, HREF, PCLK і кадру з інтервалами H-Blanking та V-Blanking</text>

  <!-- SECTION 1: Spatial Frame Structure & Equations -->
  <rect x="30" y="75" width="900" height="205" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="96" font-size="14" font-weight="bold" fill="#1a1a1a">1. Просторова структура кадру (Active Region + H/V-Blanking)</text>

  <!-- Frame Matrix Diagram -->
  <!-- Outer Total Frame Box -->
  <rect x="60" y="115" width="360" height="145" rx="4" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Active Region -->
  <rect x="60" y="115" width="270" height="105" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="195" y="155" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Активна зона кадру</text>
  <text x="195" y="175" font-size="12" fill="#1a1a1a" text-anchor="middle">N_active = 1600 × 1200 (UXGA)</text>

  <!-- H-Blanking Area -->
  <rect x="330" y="115" width="90" height="105" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="375" y="155" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">H-Blanking</text>
  <text x="375" y="175" font-size="12" fill="#c0392b" text-anchor="middle">t_HBLANK</text>

  <!-- V-Blanking Area -->
  <rect x="60" y="220" width="360" height="40" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="240" y="244" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">V-Blanking (інтервал між кадрами, t_VBLANK)</text>

  <!-- Formulas Panel -->
  <rect x="460" y="115" width="450" height="145" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="475" y="136" font-size="13" font-weight="bold" fill="#1a1a1a">Математична модель кадрового тактування:</text>
  <text x="475" y="160" font-size="12" fill="#1a1a1a">• Тривалість рядка:  t_LINE = t_HREF + t_HBLANK</text>
  <text x="475" y="182" font-size="12" fill="#1a1a1a">• Кадровий період:   t_FRAME = N_lines × t_LINE</text>
  <text x="475" y="204" font-size="12" font-weight="bold" fill="#2457d6">• Кадрова частота:   FPS = PCLK / (N_pclk × N_lines)</text>
  <text x="475" y="226" font-size="12" font-weight="bold" fill="#27ae60">• Смуга DVP шини:     Data_Rate = PCLK × Bytes_per_pixel</text>
  <text x="475" y="248" font-size="12" fill="#6b7280">• DMA буфер:          Size_DMA ≥ 2 × N_pclk_line × Bytes</text>

  <!-- SECTION 2: DVP Signal Waveforms -->
  <rect x="30" y="295" width="900" height="240" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="45" y="316" font-size="14" font-weight="bold" fill="#1a1a1a">2. Часові діаграми сигналів паралельного інтерфейсу DVP</text>

  <!-- Vertical Guidelines -->
  <line x1="210" y1="330" x2="210" y2="518" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="470" y1="370" x2="470" y2="518" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="570" y1="370" x2="570" y2="518" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="830" y1="370" x2="830" y2="518" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- Signal Channel 1: VSYNC -->
  <text x="45" y="348" font-size="13" font-weight="bold" fill="#1a1a1a">VSYNC</text>
  <text x="45" y="362" font-size="12" fill="#6b7280">(кадр)</text>
  <path d="M 140,338 L 200,338 L 200,358 L 840,358 L 840,338 L 890,338" fill="none" stroke="#c0392b" stroke-width="2"/>
  <text x="170" y="332" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">t_VBLANK</text>

  <!-- Signal Channel 2: HREF -->
  <text x="45" y="398" font-size="13" font-weight="bold" fill="#1a1a1a">HREF</text>
  <text x="45" y="412" font-size="12" fill="#6b7280">(рядок)</text>
  <path d="M 140,403 L 210,403 L 210,383 L 470,383 L 470,403 L 570,403 L 570,383 L 830,383 L 830,403 L 890,403" fill="none" stroke="#2457d6" stroke-width="2"/>

  <!-- Dimension arrows above HREF -->
  <line x1="216" y1="374" x2="464" y2="374" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue-start)" marker-end="url(#arr-blue)"/>
  <text x="340" y="370" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Активна частина рядка t_HREF</text>

  <line x1="476" y1="374" x2="564" y2="374" stroke="#c0392b" stroke-width="1.5" marker-start="url(#arr-red-start)" marker-end="url(#arr-red)"/>
  <text x="520" y="370" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">t_HBLANK</text>

  <!-- Signal Channel 3: PCLK -->
  <text x="45" y="448" font-size="13" font-weight="bold" fill="#1a1a1a">PCLK</text>
  <text x="45" y="462" font-size="12" fill="#6b7280">(такт)</text>
  <path d="M 140,448 L 140,433 L 150,433 L 150,448 L 160,448 L 160,433 L 170,433 L 170,448 L 180,448 L 180,433 L 190,433 L 190,448 L 200,448 L 200,433 L 210,433 L 210,448 L 220,448 L 220,433 L 230,433 L 230,448 L 240,448 L 240,433 L 250,433 L 250,448 L 260,448 L 260,433 L 270,433 L 270,448 L 280,448 L 280,433 L 290,433 L 290,448 L 300,448 L 300,433 L 310,433 L 310,448 L 320,448 L 320,433 L 330,433 L 330,448 L 340,448 L 340,433 L 350,433 L 350,448 L 360,448 L 360,433 L 370,433 L 370,448 L 380,448 L 380,433 L 390,433 L 390,448 L 400,448 L 400,433 L 410,433 L 410,448 L 420,448 L 420,433 L 430,433 L 430,448 L 440,448 L 440,433 L 450,433 L 450,448 L 460,448 L 460,433 L 470,433 L 470,448 L 480,448 L 480,433 L 490,433 L 490,448 L 500,448 L 500,433 L 510,433 L 510,448 L 520,448 L 520,433 L 530,433 L 530,448 L 540,448 L 540,433 L 550,433 L 550,448 L 560,448 L 560,433 L 570,433 L 570,448 L 580,448 L 580,433 L 590,433 L 590,448 L 600,448 L 600,433 L 610,433 L 610,448 L 620,448 L 620,433 L 630,433 L 630,448 L 640,448 L 640,433 L 650,433 L 650,448 L 660,448 L 660,433 L 670,433 L 670,448 L 680,448 L 680,433 L 690,433 L 690,448 L 700,448 L 700,433 L 710,433 L 710,448 L 720,448 L 720,433 L 730,433 L 730,448 L 740,448 L 740,433 L 750,433 L 750,448 L 760,448 L 760,433 L 770,433 L 770,448 L 780,448 L 780,433 L 790,433 L 790,448 L 800,448 L 800,433 L 810,433 L 810,448 L 820,448 L 820,433 L 830,433 L 830,448 L 840,448 L 840,433 L 850,433 L 850,448 L 860,448 L 860,433 L 870,433 L 870,448 L 880,448 L 880,433 L 890,433 L 890,448" fill="none" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Signal Channel 4: D[9:0] -->
  <text x="45" y="496" font-size="13" font-weight="bold" fill="#1a1a1a">D[9:0]</text>
  <text x="45" y="510" font-size="12" fill="#6b7280">(байти)</text>

  <!-- Idle lines for Data Bus -->
  <line x1="140" y1="485.5" x2="210" y2="485.5" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="470" y1="485.5" x2="570" y2="485.5" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="830" y1="485.5" x2="890" y2="485.5" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- Line 1 Data Bytes -->
  <polygon points="210,485.5 214,478 256,478 260,485.5 256,493 214,493" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="235" y="490" font-size="12" fill="#2457d6" text-anchor="middle">Y0 / R1</text>

  <polygon points="260,485.5 264,478 306,478 310,485.5 306,493 264,493" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="285" y="490" font-size="12" fill="#2457d6" text-anchor="middle">Cb / G1</text>

  <polygon points="310,485.5 314,478 356,478 360,485.5 356,493 314,493" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="335" y="490" font-size="12" fill="#2457d6" text-anchor="middle">Y1 / B1</text>

  <polygon points="360,485.5 364,478 406,478 410,485.5 406,493 364,493" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="385" y="490" font-size="12" fill="#2457d6" text-anchor="middle">Cr / R2</text>

  <polygon points="410,485.5 414,478 466,478 470,485.5 466,493 414,493" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="440" y="490" font-size="12" fill="#2457d6" text-anchor="middle">...</text>

  <!-- Line 2 Data Bytes -->
  <polygon points="570,485.5 574,478 616,478 620,485.5 616,493 574,493" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="595" y="490" font-size="12" fill="#2457d6" text-anchor="middle">Y0 / R1</text>

  <polygon points="620,485.5 624,478 666,478 670,485.5 666,493 624,493" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="645" y="490" font-size="12" fill="#2457d6" text-anchor="middle">Cb / G1</text>

  <polygon points="670,485.5 674,478 726,478 730,485.5 726,493 674,493" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="700" y="490" font-size="12" fill="#2457d6" text-anchor="middle">...</text>

  <polygon points="730,485.5 734,478 826,478 830,485.5 826,493 734,493" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="780" y="490" font-size="12" fill="#2457d6" text-anchor="middle">Y_N / B_N</text>

  <!-- Line Period Dimension Arrow Below Data Bus -->
  <line x1="216" y1="514" x2="564" y2="514" stroke="#1a1a1a" stroke-width="1.5" marker-start="url(#arr-dark-start)" marker-end="url(#arr-dark)"/>
  <text x="390" y="526" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Повний період рядка t_LINE = t_HREF + t_HBLANK</text>

</svg>
