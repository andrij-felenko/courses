<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-accent" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Потік даних MJPEG-стрімінгу від OV2640 до Web-клієнта</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Захоплення JPEG-кадрів через DVP/DMA у буфери PSRAM та їх кільцева передача за HTTP multipart/x-mixed-replace</text>

  <!-- Column 1: OV2640 Sensor -->
  <rect x="25" y="85" width="180" height="405" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="115" y="112" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Матриця OV2640</text>
  <text x="115" y="130" font-size="12" fill="#6b7280" text-anchor="middle">Сенсор зображення</text>

  <!-- Inner Rect 1.1: CMOS Matrix -->
  <rect x="40" y="145" width="150" height="55" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="115" y="168" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">CMOS Матриця</text>
  <text x="115" y="186" font-size="12" fill="#6b7280" text-anchor="middle">Захоплення UXGA/VGA</text>

  <!-- Arrow CMOS to JPEG -->
  <path d="M115,200 L115,217" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-accent)"/>

  <!-- Inner Rect 1.2: Hardware JPEG Encoder -->
  <rect x="40" y="225" width="150" height="65" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="6"/>
  <text x="115" y="246" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">JPEG-кодер</text>
  <text x="115" y="264" font-size="12" fill="#1a1a1a" text-anchor="middle">Апаратне стиснення</text>
  <text x="115" y="280" font-size="10" fill="#6b7280" text-anchor="middle">Формування кадрів</text>

  <!-- Inner Rect 1.3: DVP Interfaces -->
  <rect x="40" y="305" width="150" height="170" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="115" y="326" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Інтерфейси OV2640</text>
  <text x="52" y="352" font-size="11" fill="#1a1a1a">• D0–D7: Дані DVP</text>
  <text x="52" y="377" font-size="11" fill="#1a1a1a">• PCLK: Такти пікселя</text>
  <text x="52" y="402" font-size="11" fill="#1a1a1a">• VSYNC / HREF</text>
  <text x="52" y="427" font-size="11" fill="#1a1a1a">• SIOC / SIOD (SCCB)</text>
  <text x="52" y="452" font-size="11" fill="#1a1a1a">• XCLK: Тактування</text>

  <!-- Inter-Block Gap 1-2 Connections -->
  <!-- DVP Data Arrow -->
  <path d="M205,350 L257,350" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <text x="235" y="338" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="middle">DVP Дані</text>

  <!-- SCCB Control Arrow -->
  <path d="M265,425 L213,425" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-dark)"/>
  <text x="235" y="443" font-size="10" fill="#6b7280" text-anchor="middle">Шина SCCB</text>

  <!-- Column 2: ESP32 Microcontroller + PSRAM -->
  <rect x="265" y="85" width="445" height="405" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="487.5" y="112" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Мікроконтролер ESP32 + PSRAM</text>
  <text x="487.5" y="130" font-size="12" fill="#6b7280" text-anchor="middle">Драйвер esp32-camera, DMA та асинхронний веб-сервер</text>

  <!-- Sub-panel A: PSRAM Buffers -->
  <rect x="280" y="145" width="170" height="330" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="365" y="168" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Буфери кадрів (PSRAM)</text>
  <text x="365" y="185" font-size="11" fill="#6b7280" text-anchor="middle">Подвійна буферизація</text>

  <!-- Buffer 0 -->
  <rect x="290" y="200" width="150" height="70" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="5"/>
  <text x="365" y="222" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Frame Buffer 0</text>
  <text x="365" y="240" font-size="11" fill="#1a1a1a" text-anchor="middle">Статус: Готовий кадр</text>
  <text x="365" y="258" font-size="11" font-weight="bold" fill="#27ae60" text-anchor="middle">ЧИТАННЯ ДЛЯ HTTP</text>

  <!-- Buffer 1 -->
  <rect x="290" y="285" width="150" height="70" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="5"/>
  <text x="365" y="307" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Frame Buffer 1</text>
  <text x="365" y="325" font-size="11" fill="#1a1a1a" text-anchor="middle">Статус: Запис з DVP</text>
  <text x="365" y="343" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">ЗАХОПЛЕННЯ DMA</text>

  <!-- Buffer Management -->
  <rect x="290" y="370" width="150" height="90" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="5"/>
  <text x="365" y="388" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Управління буфером</text>
  <text x="365" y="408" font-size="10" fill="#2457d6" text-anchor="middle">esp_camera_fb_get()</text>
  <text x="365" y="426" font-size="10" fill="#2457d6" text-anchor="middle">esp_camera_fb_return()</text>
  <text x="365" y="444" font-size="10" fill="#6b7280" text-anchor="middle">Повернення в чергу</text>

  <!-- Inter-Subpanel Gap A-B Connections -->
  <!-- Pointer to HTTP Server -->
  <path d="M450,235 L507,235" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <text x="482.5" y="223" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="middle">Вказівник</text>

  <!-- fb_return to Buffer Management -->
  <path d="M515,415 L458,415" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>
  <text x="482.5" y="433" font-size="10" fill="#6b7280" text-anchor="middle">fb_return</text>

  <!-- Sub-panel B: HTTP Server -->
  <rect x="515" y="145" width="180" height="330" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="605" y="168" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">HTTP Stream Server</text>
  <text x="605" y="185" font-size="11" fill="#6b7280" text-anchor="middle">Обробник потоку метод GET</text>

  <!-- Multipart Box -->
  <rect x="525" y="200" width="160" height="75" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="5"/>
  <text x="605" y="220" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Multipart Форматування</text>
  <text x="605" y="237" font-size="10" fill="#1a1a1a" text-anchor="middle">multipart/x-mixed-replace</text>
  <text x="605" y="252" font-size="10" fill="#6b7280" text-anchor="middle">boundary=123456789...</text>
  <text x="605" y="266" font-size="10" fill="#6b7280" text-anchor="middle">Content-Type: image/jpeg</text>

  <!-- Chunk Transmit Box -->
  <rect x="525" y="285" width="160" height="70" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5" rx="5"/>
  <text x="605" y="307" font-size="11" font-weight="bold" fill="#2457d6" text-anchor="middle">Передавання кадрів</text>
  <text x="605" y="325" font-size="11" fill="#1a1a1a" text-anchor="middle">httpd_resp_send_chunk()</text>
  <text x="605" y="343" font-size="10" fill="#6b7280" text-anchor="middle">Потокова відправка байтів</text>

  <!-- Wi-Fi & Power Box -->
  <rect x="525" y="365" width="160" height="95" fill="#fdecea" stroke="#c0392b" stroke-width="1.5" rx="5"/>
  <text x="605" y="385" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Wi-Fi Радіопередавач</text>
  <text x="605" y="403" font-size="11" fill="#1a1a1a" text-anchor="middle">TCP/IP Потік даних</text>
  <text x="605" y="423" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">⚠ Пік струму 310–500 mA</text>
  <text x="605" y="443" font-size="10" font-weight="bold" fill="#27ae60" text-anchor="middle">✔ Стабілізація: C ≥ 470 мкФ</text>

  <!-- Inter-Block Gap 2-3 Connections -->
  <!-- HTTP Stream Arrow -->
  <path d="M710,310 L762,310" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-accent)"/>
  <text x="740" y="296" font-size="10" font-weight="bold" fill="#2457d6" text-anchor="middle">HTTP Потік</text>

  <!-- GET Request Arrow -->
  <path d="M770,390 L718,390" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-dark)"/>
  <text x="740" y="408" font-size="10" fill="#6b7280" text-anchor="middle">GET запит</text>

  <!-- Column 3: Web-Client -->
  <rect x="770" y="85" width="165" height="405" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>
  <text x="852.5" y="112" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Web-клієнт</text>
  <text x="852.5" y="130" font-size="12" fill="#6b7280" text-anchor="middle">Браузер / Дисплей</text>

  <!-- Browser Mockup -->
  <rect x="780" y="145" width="145" height="190" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <rect x="780" y="145" width="145" height="24" fill="#eaf0fd" stroke="#d0d7de" stroke-width="1" rx="0"/>
  <circle cx="790" cy="157" r="3" fill="#c0392b"/>
  <circle cx="798" cy="157" r="3" fill="#f39c12"/>
  <circle cx="806" cy="157" r="3" fill="#27ae60"/>
  <text x="862" y="161" font-size="10" fill="#6b7280" text-anchor="middle">http://192.168.4.1</text>

  <!-- Video Box -->
  <rect x="790" y="178" width="125" height="145" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5" rx="4"/>
  <text x="852.5" y="202" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">MJPEG Стрім</text>
  <text x="852.5" y="220" font-size="11" fill="#1a1a1a" text-anchor="middle">Відео 30 FPS</text>
  <text x="852.5" y="237" font-size="11" fill="#6b7280" text-anchor="middle">640x480 VGA</text>
  <rect x="822.5" y="252" width="60" height="22" fill="#27ae60" rx="11"/>
  <text x="852.5" y="267" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">• LIVE</text>
  <text x="852.5" y="296" font-size="10" fill="#27ae60" text-anchor="middle">Авто-оновлення</text>
  <text x="852.5" y="312" font-size="10" fill="#6b7280" text-anchor="middle">без перезавантаження</text>

  <!-- HTML Box -->
  <rect x="780" y="350" width="145" height="125" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5" rx="6"/>
  <text x="852.5" y="370" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">HTML Код клієнта</text>
  <text x="852.5" y="392" font-size="10" fill="#2457d6" text-anchor="middle">&lt;img src=&quot;/stream&quot;&gt;</text>
  <text x="852.5" y="412" font-size="10" fill="#6b7280" text-anchor="middle">Без JavaScript</text>
  <text x="852.5" y="430" font-size="10" fill="#6b7280" text-anchor="middle">Браузер самостійно</text>
  <text x="852.5" y="448" font-size="10" fill="#6b7280" text-anchor="middle">декодує JPEG-потік</text>
</svg>
