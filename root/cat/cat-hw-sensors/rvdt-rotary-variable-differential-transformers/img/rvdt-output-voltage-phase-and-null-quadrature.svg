<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="880" height="500" fill="url(#bgGrad2)" rx="12" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="440" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    Осцилограми напруг вторинних обмоток та квадратурна складова нуля
  </text>
  <text x="440" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">
    Інверсія фази на 180° при переході через нуль та векторне розкладення V_null
  </text>

  <!-- Left: Waveforms -->
  <g transform="translate(50, 95)">
    <rect width="420" height="360" rx="8" fill="#111827" stroke="#374151" stroke-width="1.5"/>
    <text x="210" y="28" fill="#f8fafc" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">
      Вихідні сигнали вторинних обмоток
    </text>

    <!-- Sub-waveform 1: V_s1 and V_s2 -->
    <g transform="translate(30, 45)">
      <line x1="0" y1="40" x2="360" y2="40" stroke="#475569" stroke-width="1"/>
      <!-- S1 (large) -->
      <path d="M 0 40 Q 45 5, 90 40 T 180 40 T 270 40 T 360 40" fill="none" stroke="#22c55e" stroke-width="2"/>
      <!-- S2 (small) -->
      <path d="M 0 40 Q 45 22, 90 40 T 180 40 T 270 40 T 360 40" fill="none" stroke="#eab308" stroke-width="2"/>
      <text x="365" y="35" fill="#22c55e" font-family="system-ui" font-size="10" font-weight="bold">V_s1</text>
      <text x="365" y="48" fill="#eab308" font-family="system-ui" font-size="10" font-weight="bold">V_s2</text>
      <text x="10" y="18" fill="#cbd5e1" font-family="system-ui" font-size="10.5">Відхилення θ &gt; 0 (V_s1 &gt; V_s2)</text>
    </g>

    <!-- Sub-waveform 2: V_diff (In phase) -->
    <g transform="translate(30, 140)">
      <line x1="0" y1="40" x2="360" y2="40" stroke="#475569" stroke-width="1"/>
      <path d="M 0 40 Q 45 15, 90 40 T 180 40 T 270 40 T 360 40" fill="none" stroke="#38bdf8" stroke-width="2.5"/>
      <text x="365" y="44" fill="#38bdf8" font-family="system-ui" font-size="10.5" font-weight="bold">V_diff</text>
      <text x="10" y="18" fill="#7dd3fc" font-family="system-ui" font-size="10.5">Фаза 0° (відносно V_exc)</text>
    </g>

    <!-- Sub-waveform 3: V_diff (Inverted Phase for theta < 0) -->
    <g transform="translate(30, 235)">
      <line x1="0" y1="40" x2="360" y2="40" stroke="#475569" stroke-width="1"/>
      <path d="M 0 40 Q 45 65, 90 40 T 180 40 T 270 40 T 360 40" fill="none" stroke="#f43f5e" stroke-width="2.5"/>
      <text x="365" y="44" fill="#f43f5e" font-family="system-ui" font-size="10.5" font-weight="bold">V_diff</text>
      <text x="10" y="18" fill="#fca5a5" font-family="system-ui" font-size="10.5">Відхилення θ &lt; 0: Фаза інвертована на 180°!</text>
    </g>
  </g>

  <!-- Right: Vector Diagram of Null Voltage -->
  <g transform="translate(500, 95)">
    <rect width="330" height="360" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="165" y="28" fill="#f8fafc" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">
      Векторна діаграма залишкового нуля
    </text>

    <!-- Coordinate Plane for Vectors -->
    <g transform="translate(60, 170)">
      <!-- Horizontal Axis: In-phase -->
      <line x1="0" y1="0" x2="200" y2="0" stroke="#64748b" stroke-width="1.5"/>
      <polygon points="200,0 192,-4 192,4" fill="#64748b"/>
      <text x="205" y="4" fill="#94a3b8" font-family="system-ui" font-size="11">Синфазна вісь (0°)</text>

      <!-- Vertical Axis: Quadrature -->
      <line x1="0" y1="0" x2="0" y2="-120" stroke="#64748b" stroke-width="1.5"/>
      <polygon points="0,-120 -4,-112 4,-112" fill="#64748b"/>
      <text x="5" y="-120" fill="#94a3b8" font-family="system-ui" font-size="11">Квадратура (90°)</text>

      <!-- Vector V_inphase -->
      <line x1="0" y1="0" x2="70" y2="0" stroke="#22c55e" stroke-width="3"/>
      <polygon points="70,0 62,-4 62,4" fill="#22c55e"/>
      <text x="35" y="15" fill="#86efac" font-family="monospace" font-size="10.5" font-weight="bold">V_inphase</text>

      <!-- Vector V_quad -->
      <line x1="0" y1="0" x2="0" y2="-70" stroke="#ef4444" stroke-width="3"/>
      <polygon points="0,-70 -4,-62 4,-62" fill="#ef4444"/>
      <text x="-65" y="-35" fill="#fca5a5" font-family="monospace" font-size="10.5" font-weight="bold">V_quad</text>

      <!-- Resulting Vector V_null -->
      <line x1="0" y1="0" x2="70" y2="-70" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="3 2"/>
      <polygon points="70,-70 60,-66 66,-60" fill="#f59e0b"/>
      <text x="75" y="-72" fill="#fde047" font-family="monospace" font-size="11" font-weight="bold">V_null</text>
    </g>

    <!-- Explanatory Text Box -->
    <rect x="20" y="235" width="290" height="105" rx="5" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="30" y="258" fill="#f8fafc" font-family="system-ui" font-size="11.5" font-weight="bold">Джерела напруги нуля:</text>
    <text x="30" y="278" fill="#cbd5e1" font-family="system-ui" font-size="10.5">• V_inphase: асиметрія витків котушок статора</text>
    <text x="30" y="298" fill="#fca5a5" font-family="system-ui" font-size="10.5">• V_quad: паразитна міжобмоткова ємність C_ps</text>
    <text x="30" y="318" fill="#cbd5e1" font-family="system-ui" font-size="10.5">• Не усувається механічним поворотом ротора!</text>
  </g>
</svg>