<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="900" height="500" fill="url(#bgGrad3)" rx="12" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="450" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    Структурна схема фазочутливої раціометричної демодуляції RVDT
  </text>
  <text x="450" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">
    Повне усунення квадратурного залишку та температурного дрейфу через обчислення (Va - Vb)/(Va + Vb)
  </text>

  <!-- Block 1: RVDT Sensor -->
  <g transform="translate(40, 95)">
    <rect width="140" height="360" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
    <text x="70" y="30" fill="#c7d2fe" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">
      Датчик RVDT
    </text>

    <!-- Excitation input -->
    <rect x="20" y="60" width="100" height="40" rx="4" fill="#312e81"/>
    <text x="70" y="85" fill="#fef08a" font-family="system-ui" font-size="10.5" font-weight="bold" text-anchor="middle">V_exc (2.5 кГц)</text>

    <!-- Secondary Outputs S1 & S2 -->
    <rect x="20" y="140" width="100" height="50" rx="4" fill="#065f46" stroke="#34d399" stroke-width="1"/>
    <text x="70" y="165" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">Канал S1</text>
    <text x="70" y="180" fill="#a7f3d0" font-family="monospace" font-size="10" text-anchor="middle">V_s1(θ)</text>

    <rect x="20" y="240" width="100" height="50" rx="4" fill="#065f46" stroke="#34d399" stroke-width="1"/>
    <text x="70" y="265" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">Канал S2</text>
    <text x="70" y="280" fill="#a7f3d0" font-family="monospace" font-size="10" text-anchor="middle">V_s2(θ)</text>
  </g>

  <!-- Connectors from RVDT -->
  <line x1="180" y1="260" x2="220" y2="260" stroke="#34d399" stroke-width="2"/>
  <line x1="180" y1="360" x2="220" y2="360" stroke="#34d399" stroke-width="2"/>

  <!-- Block 2: Differential & Sum Stage -->
  <g transform="translate(220, 95)">
    <rect width="200" height="360" rx="8" fill="#083344" stroke="#06b6d4" stroke-width="1.5"/>
    <text x="100" y="30" fill="#a5f3fc" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">
      Фронтенд підсилювач
    </text>

    <!-- Difference Amp -->
    <rect x="20" y="70" width="160" height="70" rx="5" fill="#155e75"/>
    <text x="100" y="98" fill="#ffffff" font-family="system-ui" font-size="11.5" font-weight="bold" text-anchor="middle">Диференційний вузол</text>
    <text x="100" y="120" fill="#cffafe" font-family="monospace" font-size="11" text-anchor="middle">V_diff = V_s1 - V_s2</text>

    <!-- Sum Amp -->
    <rect x="20" y="210" width="160" height="70" rx="5" fill="#155e75"/>
    <text x="100" y="238" fill="#ffffff" font-family="system-ui" font-size="11.5" font-weight="bold" text-anchor="middle">Суматорний вузол</text>
    <text x="100" y="260" fill="#cffafe" font-family="monospace" font-size="11" text-anchor="middle">V_sum = V_s1 + V_s2</text>
  </g>

  <!-- Connectors -->
  <line x1="420" y1="200" x2="460" y2="200" stroke="#38bdf8" stroke-width="2"/>
  <line x1="420" y1="340" x2="460" y2="340" stroke="#38bdf8" stroke-width="2"/>

  <!-- Block 3: Phase-Sensitive Demodulator & LPF -->
  <g transform="translate(460, 95)">
    <rect width="210" height="360" rx="8" fill="#14532d" stroke="#22c55e" stroke-width="1.5"/>
    <text x="105" y="30" fill="#bbf7d0" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">
      Синхронний демодулятор
    </text>

    <!-- Multiplier with V_ref -->
    <rect x="20" y="70" width="170" height="60" rx="5" fill="#166534"/>
    <text x="105" y="95" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">Множення на V_ref(t)</text>
    <text x="105" y="115" fill="#bbf7d0" font-family="system-ui" font-size="10" text-anchor="middle">Пригнічення квадратури</text>

    <!-- Low Pass Filter -->
    <rect x="20" y="150" width="170" height="60" rx="5" fill="#166534"/>
    <text x="105" y="175" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">Активний ФНЧ (LPF)</text>
    <text x="105" y="195" fill="#bbf7d0" font-family="system-ui" font-size="10" text-anchor="middle">Зріз подвоєної несучої</text>

    <rect x="20" y="240" width="170" height="90" rx="5" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
    <text x="105" y="265" fill="#86efac" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">Результат демодуляції:</text>
    <text x="105" y="288" fill="#ffffff" font-family="monospace" font-size="10.5" text-anchor="middle">ΔV_dc = 0.5 · V_sig</text>
    <text x="105" y="310" fill="#fde047" font-family="monospace" font-size="10.5" text-anchor="middle">V_quad повністю = 0</text>
  </g>

  <!-- Connectors -->
  <line x1="670" y1="275" x2="710" y2="275" stroke="#38bdf8" stroke-width="2.5"/>

  <!-- Block 4: Ratiometric Divider Output -->
  <g transform="translate(710, 95)">
    <rect width="150" height="360" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="75" y="30" fill="#fde68a" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">
      Раціометричне ділення
    </text>

    <rect x="15" y="70" width="120" height="100" rx="5" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="75" y="95" fill="#fbbf24" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">ΔV / ΣV</text>
    <text x="75" y="125" fill="#cbd5e1" font-family="system-ui" font-size="10" text-anchor="middle">V_exc скорочується!</text>
    <text x="75" y="145" fill="#a7f3d0" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">0% дрейфу живлення</text>

    <rect x="15" y="200" width="120" height="130" rx="5" fill="#111827"/>
    <text x="75" y="230" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">Вихідний код:</text>
    <text x="75" y="255" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold" text-anchor="middle">θ = K · Ratio</text>
    <text x="75" y="285" fill="#cbd5e1" font-family="system-ui" font-size="10" text-anchor="middle">Лінійний вихід</text>
    <text x="75" y="305" fill="#cbd5e1" font-family="system-ui" font-size="10" text-anchor="middle">до АЦП / RDC</text>
  </g>
</svg>