<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="880" height="500" fill="url(#bgGrad5)" rx="12" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="440" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    Вплив радіального ексцентриситету ротора на повітряні зазори статора
  </text>
  <text x="440" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">
    Зсув осі обертання Δr породжує сталий дисбаланс індуктивностей та паразитну амплітудну модуляцію
  </text>

  <!-- Left: Concentric (Ideal) Alignment -->
  <g transform="translate(60, 95)">
    <rect width="360" height="360" rx="8" fill="#111827" stroke="#10b981" stroke-width="1.5"/>
    <text x="180" y="28" fill="#34d399" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">
      Ідеальне співвісне центрування (Δr = 0)
    </text>

    <!-- Stator circle -->
    <circle cx="180" cy="180" r="110" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <circle cx="180" cy="180" r="60" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>

    <!-- Centers aligned -->
    <circle cx="180" cy="180" r="4" fill="#f8fafc"/>
    <text x="180" y="165" fill="#ffffff" font-family="system-ui" font-size="10" text-anchor="middle">Центр спільний</text>

    <!-- Symmetric gaps -->
    <line x1="70" y1="180" x2="120" y2="180" stroke="#34d399" stroke-width="2"/>
    <text x="95" y="172" fill="#a7f3d0" font-family="system-ui" font-size="10" text-anchor="middle">g1 = g0</text>

    <line x1="240" y1="180" x2="290" y2="180" stroke="#34d399" stroke-width="2"/>
    <text x="265" y="172" fill="#a7f3d0" font-family="system-ui" font-size="10" text-anchor="middle">g2 = g0</text>

    <text x="180" y="325" fill="#a7f3d0" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">
      Симетрія магнітних опорів у нулі: V_null ≈ 0
    </text>
  </g>

  <!-- Right: Eccentric Misalignment -->
  <g transform="translate(460, 95)">
    <rect width="360" height="360" rx="8" fill="#111827" stroke="#ef4444" stroke-width="1.5"/>
    <text x="180" y="28" fill="#f87171" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">
      Радіальний ексцентриситет (Δr &gt; 0)
    </text>

    <!-- Stator circle -->
    <circle cx="180" cy="180" r="110" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <!-- Rotor shifted to left by 25px -->
    <circle cx="155" cy="180" r="60" fill="#b91c1c" stroke="#f87171" stroke-width="2"/>

    <!-- Two distinct centers -->
    <circle cx="180" cy="180" r="3" fill="#38bdf8"/>
    <circle cx="155" cy="180" r="3" fill="#f59e0b"/>
    <line x1="155" y1="180" x2="180" y2="180" stroke="#f59e0b" stroke-width="2"/>
    <text x="167" y="165" fill="#fde047" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Δr</text>

    <!-- Asymmetric gaps -->
    <line x1="70" y1="180" x2="95" y2="180" stroke="#ef4444" stroke-width="3"/>
    <text x="82" y="172" fill="#fca5a5" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">g1 мала</text>

    <line x1="215" y1="180" x2="290" y2="180" stroke="#ef4444" stroke-width="3"/>
    <text x="252" y="172" fill="#fca5a5" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">g2 велика</text>

    <rect x="25" y="280" width="310" height="60" rx="5" fill="#450a0a" stroke="#f87171" stroke-width="1"/>
    <text x="180" y="302" fill="#fecdd3" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle">
      Наслідки ексцентриситету:
    </text>
    <text x="180" y="322" fill="#fee2e2" font-family="system-ui" font-size="10" text-anchor="middle">
      Поява великої напруги нуля V_null та похибки кута
    </text>
  </g>
</svg>