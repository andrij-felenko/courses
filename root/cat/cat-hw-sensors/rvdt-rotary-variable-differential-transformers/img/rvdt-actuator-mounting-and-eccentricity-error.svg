<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>

  <rect width="880" height="500" fill="url(#bgGrad4)" rx="12" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="440" y="35" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">
    Механічна інтеграція RVDT у сервопривод та підключення до RDC
  </text>
  <text x="440" y="58" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="13" text-anchor="middle">
    Безлюфтова сильфонна муфта вала актуатора та слідкуючий перетворювач резольвер-код RDC
  </text>

  <!-- Left: Actuator & Coupling Mechanics -->
  <g transform="translate(60, 95)">
    <rect width="420" height="360" rx="8" fill="#111827" stroke="#374151" stroke-width="1.5"/>
    <text x="210" y="28" fill="#f8fafc" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">
      Механічне сполучення вала актуатора з RVDT
    </text>

    <!-- Actuator Shaft -->
    <rect x="40" y="70" width="80" height="180" rx="4" fill="#334155" stroke="#64748b"/>
    <text x="80" y="165" fill="#cbd5e1" font-family="system-ui" font-size="11" font-weight="bold" text-anchor="middle" transform="rotate(-90 80 165)">Вал привода</text>

    <!-- Flexible Bellows Coupling -->
    <g transform="translate(130, 130)">
      <rect width="50" height="60" rx="3" fill="#b45309" stroke="#f59e0b" stroke-width="1.5"/>
      <line x1="15" y1="0" x2="15" y2="60" stroke="#fde047" stroke-width="1.5"/>
      <line x1="35" y1="0" x2="35" y2="60" stroke="#fde047" stroke-width="1.5"/>
      <text x="25" y="80" fill="#fde68a" font-family="system-ui" font-size="10" font-weight="bold" text-anchor="middle">Сильфонна муфта</text>
    </g>

    <!-- RVDT Sensor Unit -->
    <g transform="translate(190, 70)">
      <rect width="180" height="180" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
      <text x="90" y="30" fill="#38bdf8" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">RVDT Сенсор</text>
      
      <!-- Bearings -->
      <rect x="20" y="60" width="20" height="60" fill="#475569" stroke="#94a3b8"/>
      <rect x="140" y="60" width="20" height="60" fill="#475569" stroke="#94a3b8"/>

      <!-- Inner Rotor on shaft -->
      <line x1="0" y1="90" x2="180" y2="90" stroke="#cbd5e1" stroke-width="6"/>
      <ellipse cx="90" cy="90" rx="30" ry="20" fill="#0284c7" stroke="#7dd3fc" stroke-width="1.5"/>
      <text x="90" y="150" fill="#cbd5e1" font-family="system-ui" font-size="10.5" text-anchor="middle">Фланцевий монтаж</text>
    </g>

    <!-- Bottom Alignment Rules -->
    <rect x="25" y="270" width="370" height="70" rx="5" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
    <text x="35" y="292" fill="#34d399" font-family="system-ui" font-size="11" font-weight="bold">Вимоги до центрування:</text>
    <text x="35" y="310" fill="#cbd5e1" font-family="system-ui" font-size="10.5">• Неспіввісність &lt; 10 мкм для виключення похибки ексцентриситету</text>
    <text x="35" y="328" fill="#cbd5e1" font-family="system-ui" font-size="10.5">• Безлюфтова муфта усуває осьові й радіальні навантаження</text>
  </g>

  <!-- Right: Tracking RDC Block -->
  <g transform="translate(510, 95)">
    <rect width="320" height="360" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="160" y="28" fill="#f8fafc" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">
      Підключення до мікросхеми RDC
    </text>

    <!-- RDC Chip -->
    <rect x="30" y="60" width="260" height="160" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1.5"/>
    <text x="160" y="90" fill="#c7d2fe" font-family="system-ui" font-size="13" font-weight="bold" text-anchor="middle">RDC (AD2S1210 / PGA411)</text>

    <text x="50" y="125" fill="#a5b4fc" font-family="monospace" font-size="11">• Tracking Loop Архітектура</text>
    <text x="50" y="145" fill="#a5b4fc" font-family="monospace" font-size="11">• Роздільність 10–16 біт</text>
    <text x="50" y="165" fill="#a5b4fc" font-family="monospace" font-size="11">• Вбудований генератор збудження</text>
    <text x="50" y="185" fill="#a5b4fc" font-family="monospace" font-size="11">• Вихід швидкості (Velocity)</text>

    <!-- Digital Bus Out -->
    <rect x="30" y="240" width="260" height="90" rx="6" fill="#14532d" stroke="#22c55e" stroke-width="1"/>
    <text x="160" y="265" fill="#86efac" font-family="system-ui" font-size="12" font-weight="bold" text-anchor="middle">Цифровий інтерфейс до MCU:</text>
    <text x="50" y="290" fill="#dcfce7" font-family="system-ui" font-size="11">• Послідовний SPI / BiSS-C порт</text>
    <text x="50" y="310" fill="#dcfce7" font-family="system-ui" font-size="11">• Інкрементний емулятор A/B/Z енкодера</text>
  </g>
</svg>