<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <rect width="960" height="480" fill="#0d1117" rx="12"/>
  <text x="480" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f0f6fc" text-anchor="middle">Бенчмарк продуктивності: Soft-Float проти Fixed-Point Q16.16</text>
  <text x="480" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Такти CPU ядра ARM Cortex-M0/M3 (без FPU) на базові математичні операції</text>

  <!-- Bar Chart -->
  <g transform="translate(100, 95)">
    <!-- Axes -->
    <line x1="0" y1="260" x2="760" y2="260" stroke="#30363d" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="260" stroke="#30363d" stroke-width="2"/>

    <!-- Y labels (Clock Cycles) -->
    <text x="-15" y="265" font-family="sans-serif" font-size="10" fill="#8b949e" text-anchor="end">0</text>
    <text x="-15" y="200" font-family="sans-serif" font-size="10" fill="#8b949e" text-anchor="end">25 таків</text>
    <text x="-15" y="135" font-family="sans-serif" font-size="10" fill="#8b949e" text-anchor="end">50 тактів</text>
    <text x="-15" y="70" font-family="sans-serif" font-size="10" fill="#8b949e" text-anchor="end">75 тактів</text>
    <text x="-15" y="15" font-family="sans-serif" font-size="10" fill="#8b949e" text-anchor="end">100 тактів</text>

    <!-- Grid lines -->
    <line x1="0" y1="195" x2="760" y2="195" stroke="#21262d" stroke-dasharray="4 4"/>
    <line x1="0" y1="130" x2="760" y2="130" stroke="#21262d" stroke-dasharray="4 4"/>
    <line x1="0" y1="65" x2="760" y2="65" stroke="#21262d" stroke-dasharray="4 4"/>

    <!-- Operation 1: Addition (+) -->
    <!-- Soft float: ~35 cycles, Fixed: 1 cycle -->
    <g transform="translate(40, 0)">
      <rect x="0" y="170" width="45" height="90" rx="3" fill="#f85149" fill-opacity="0.8"/>
      <text x="22" y="160" font-family="sans-serif" font-size="10" fill="#f85149" text-anchor="middle">35</text>
      
      <rect x="50" y="257" width="45" height="3" rx="1" fill="#3fb950"/>
      <text x="72" y="250" font-family="sans-serif" font-size="10" font-weight="bold" fill="#3fb950" text-anchor="middle">1</text>
      
      <text x="47" y="280" font-family="sans-serif" font-size="11" fill="#f0f6fc" text-anchor="middle">Додавання (+)</text>
      <text x="47" y="295" font-family="sans-serif" font-size="9" fill="#3fb950" text-anchor="middle">Прискорення: 35x</text>
    </g>

    <!-- Operation 2: Multiplication (*) -->
    <!-- Soft float: ~45 cycles, Fixed: 3 cycles (SMULL + shift) -->
    <g transform="translate(220, 0)">
      <rect x="0" y="145" width="45" height="115" rx="3" fill="#f85149" fill-opacity="0.8"/>
      <text x="22" y="135" font-family="sans-serif" font-size="10" fill="#f85149" text-anchor="middle">45</text>
      
      <rect x="50" y="252" width="45" height="8" rx="1" fill="#3fb950"/>
      <text x="72" y="245" font-family="sans-serif" font-size="10" font-weight="bold" fill="#3fb950" text-anchor="middle">3</text>
      
      <text x="47" y="280" font-family="sans-serif" font-size="11" fill="#f0f6fc" text-anchor="middle">Множення (*)</text>
      <text x="47" y="295" font-family="sans-serif" font-size="9" fill="#3fb950" text-anchor="middle">Прискорення: 15x</text>
    </g>

    <!-- Operation 3: Division (/) -->
    <!-- Soft float: ~95 cycles, Fixed: 12-18 cycles (SDIV) -->
    <g transform="translate(400, 0)">
      <rect x="0" y="15" width="45" height="245" rx="3" fill="#f85149" fill-opacity="0.8"/>
      <text x="22" y="10" font-family="sans-serif" font-size="10" fill="#f85149" text-anchor="middle">95</text>
      
      <rect x="50" y="220" width="45" height="40" rx="1" fill="#3fb950"/>
      <text x="72" y="212" font-family="sans-serif" font-size="10" font-weight="bold" fill="#3fb950" text-anchor="middle">15</text>
      
      <text x="47" y="280" font-family="sans-serif" font-size="11" fill="#f0f6fc" text-anchor="middle">Ділення (/)</text>
      <text x="47" y="295" font-family="sans-serif" font-size="9" fill="#3fb950" text-anchor="middle">Прискорення: 6x</text>
    </g>

    <!-- Operation 4: Complete IIR Filter Step -->
    <!-- Soft float: ~120 cycles, Fixed: 8 cycles -->
    <g transform="translate(580, 0)">
      <rect x="0" y="2" width="45" height="258" rx="3" fill="#f85149" fill-opacity="0.8"/>
      <text x="22" y="-5" font-family="sans-serif" font-size="10" fill="#f85149" text-anchor="middle">120</text>
      
      <rect x="50" y="240" width="45" height="20" rx="1" fill="#3fb950"/>
      <text x="72" y="232" font-family="sans-serif" font-size="10" font-weight="bold" fill="#3fb950" text-anchor="middle">8</text>
      
      <text x="47" y="280" font-family="sans-serif" font-size="11" fill="#f0f6fc" text-anchor="middle">Крок ФНЧ (IIR)</text>
      <text x="47" y="295" font-family="sans-serif" font-size="9" fill="#3fb950" text-anchor="middle">Прискорення: 15x</text>
    </g>
  </g>

  <!-- Legend & ROM savings -->
  <g transform="translate(100, 410)">
    <rect width="760" height="50" rx="6" fill="#161b22" stroke="#30363d"/>
    <rect x="30" y="18" width="16" height="16" rx="2" fill="#f85149"/>
    <text x="55" y="31" font-family="sans-serif" font-size="11" fill="#f0f6fc">Програмна емуляція Float (+2.5..6 КБ Flash пам'яті)</text>
    
    <rect x="420" y="18" width="16" height="16" rx="2" fill="#3fb950"/>
    <text x="445" y="31" font-family="sans-serif" font-size="11" fill="#f0f6fc">Цілочисельний Q16.16 (0 КБ бібліотек, 100% детермінізм)</text>
  </g>
</svg>