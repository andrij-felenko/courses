<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <rect width="960" height="480" fill="#0d1117" rx="12"/>
  <text x="480" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="700" fill="#f0f6fc" text-anchor="middle">Конвеєр множення Q16.16 з 64-бітним проміжним акумулятором</text>
  <text x="480" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#8b949e" text-anchor="middle">Запобігання втраті значущості та переповненню: інструкція SMULL ядра ARM</text>

  <!-- Step 1: Inputs -->
  <g transform="translate(60, 95)">
    <rect width="180" height="85" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <text x="90" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="#58a6ff" text-anchor="middle">1. Вхідні операнди</text>
    <text x="90" y="50" font-family="monospace" font-size="11" fill="#f0f6fc" text-anchor="middle">int32_t a_q16</text>
    <text x="90" y="70" font-family="monospace" font-size="11" fill="#f0f6fc" text-anchor="middle">int32_t b_q16</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="240" y1="137" x2="280" y2="137" stroke="#58a6ff" stroke-width="2"/>
  <polygon points="280,137 270,132 270,142" fill="#58a6ff"/>

  <!-- Step 2: 64-bit Multiplication -->
  <g transform="translate(280, 95)">
    <rect width="210" height="85" rx="6" fill="#161b22" stroke="#3fb950" stroke-width="1.5"/>
    <text x="105" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="#3fb950" text-anchor="middle">2. Добуток у 64 біти</text>
    <text x="105" y="50" font-family="monospace" font-size="10" fill="#f0f6fc" text-anchor="middle">int64_t prod =</text>
    <text x="105" y="70" font-family="monospace" font-size="10" fill="#3fb950" text-anchor="middle">(int64_t)a_q16 * b_q16</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="490" y1="137" x2="530" y2="137" stroke="#3fb950" stroke-width="2"/>
  <polygon points="530,137 520,132 520,142" fill="#3fb950"/>

  <!-- Step 3: Rounding Offset Addition -->
  <g transform="translate(530, 95)">
    <rect width="190" height="85" rx="6" fill="#161b22" stroke="#d29922" stroke-width="1.5"/>
    <text x="95" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="#d29922" text-anchor="middle">3. Округлення до найближчого</text>
    <text x="95" y="50" font-family="monospace" font-size="10" fill="#f0f6fc" text-anchor="middle">prod += (1LL &lt;&lt; 15)</text>
    <text x="95" y="70" font-family="sans-serif" font-size="10" fill="#8b949e" text-anchor="middle">(Додаємо 0.5 LSB)</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <line x1="720" y1="137" x2="760" y2="137" stroke="#d29922" stroke-width="2"/>
  <polygon points="760,137 750,132 750,142" fill="#d29922"/>

  <!-- Step 4: Truncate & Scale Down -->
  <g transform="translate(760, 95)">
    <rect width="140" height="85" rx="6" fill="#161b22" stroke="#bc8cff" stroke-width="1.5"/>
    <text x="70" y="25" font-family="sans-serif" font-size="12" font-weight="bold" fill="#bc8cff" text-anchor="middle">4. Зсув &gt;&gt; 16</text>
    <text x="70" y="50" font-family="monospace" font-size="11" fill="#f0f6fc" text-anchor="middle">prod &gt;&gt; 16</text>
    <text x="70" y="70" font-family="sans-serif" font-size="10" fill="#3fb950" text-anchor="middle">Формат Q16</text>
  </g>

  <!-- Bit Representation Visual in 64-bit space -->
  <g transform="translate(60, 220)">
    <rect width="840" height="220" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="420" y="28" font-family="sans-serif" font-size="14" font-weight="bold" fill="#f0f6fc" text-anchor="middle">Розподіл розрядів у проміжному 64-бітному числі (Q30.32)</text>

    <!-- Big 64-bit bar -->
    <rect x="30" y="50" width="780" height="45" rx="4" fill="#0d1117" stroke="#30363d"/>
    
    <!-- Top 16 bits (discarded or checked for overflow) -->
    <rect x="30" y="50" width="190" height="45" fill="#da3633" fill-opacity="0.2"/>
    <text x="125" y="78" font-family="sans-serif" font-size="11" fill="#f85149" text-anchor="middle">Біти [63:47] Перевірка Overflow</text>

    <!-- Selected 32 bits (our new int32 result) -->
    <rect x="220" y="50" width="390" height="45" fill="#238636" fill-opacity="0.3" stroke="#3fb950" stroke-width="2"/>
    <text x="415" y="78" font-family="sans-serif" font-size="12" font-weight="bold" fill="#3fb950" text-anchor="middle">Біти [47:16] — Цільове число Q16.16</text>

    <!-- Low 16 bits (discarded fractions) -->
    <rect x="610" y="50" width="200" height="45" fill="#d29922" fill-opacity="0.2"/>
    <text x="710" y="78" font-family="sans-serif" font-size="11" fill="#d29922" text-anchor="middle">Біти [15:0] Відкидаються</text>

    <!-- Explanatory rules -->
    <text x="40" y="130" font-family="sans-serif" font-size="11" fill="#f0f6fc">
      <tspan font-weight="bold" fill="#3fb950">• Чому потрібен int64_t:</tspan> Два числа по 16 біт дробу дають 32 біти дробу (16 + 16).
    </text>
    <text x="40" y="152" font-family="sans-serif" font-size="11" fill="#f0f6fc">
      Якщо результат не помістити в 64-бітну змінну перед зсувом, старші цілі біти будуть безповоротно втрачені.
    </text>
    <text x="40" y="180" font-family="sans-serif" font-size="11" fill="#8b949e">
      • В ядрі ARM Cortex-M3/M4/M7 цей конвеєр виконується єдиною інструкцією: <tspan font-family="monospace" fill="#58a6ff">SMMULR r0, r1, r2</tspan>
    </text>
  </g>
</svg>