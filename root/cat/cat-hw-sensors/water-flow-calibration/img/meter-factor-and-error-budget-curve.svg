<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
<rect width="940" height="430" fill="#0d1117"/>
<text x="470" y="30" font-size="18" fill="#f0f6fc" text-anchor="middle" font-weight="700">Трубка похибки та коефіцієнт лічильника (Meter Factor)</text>

<!-- Graph: Error Band [%] vs Flow Rate Q -->
<rect x="60" y="65" width="820" height="230" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.8"/>

<!-- Zero error line -->
<line x1="120" y1="180" x2="840" y2="180" stroke="#8b949e" stroke-width="2"/>
<text x="850" y="185" font-size="12" fill="#3fb950" font-weight="700">0.0%</text>

<!-- Error Bands: +/- 1% (Class 1.0) -->
<line x1="120" y1="140" x2="840" y2="140" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="110" y="145" font-size="11" fill="#3fb950" text-anchor="end">+1.0%</text>

<line x1="120" y1="220" x2="840" y2="220" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="110" y="225" font-size="11" fill="#3fb950" text-anchor="end">−1.0%</text>

<!-- Error Bands: +/- 5% (Budget limit) -->
<line x1="120" y1="90" x2="840" y2="90" stroke="#f85149" stroke-width="1" stroke-dasharray="3 3"/>
<text x="110" y="95" font-size="11" fill="#f85149" text-anchor="end">+5.0%</text>

<line x1="120" y1="270" x2="840" y2="270" stroke="#f85149" stroke-width="1" stroke-dasharray="3 3"/>
<text x="110" y="275" font-size="11" fill="#f85149" text-anchor="end">−5.0%</text>

<!-- Actual Calibrated Flowmeter Error Curve (Green line within 1%) -->
<path d="M 140 250 Q 200 170 300 185 T 500 175 T 700 182 T 820 170" fill="none" stroke="#3fb950" stroke-width="3"/>
<text x="450" y="165" font-size="12" fill="#3fb950" font-weight="700" text-anchor="middle">Відкалібрований прилад (похибка &lt; ±1.0%)</text>

<!-- Uncalibrated Flowmeter Error Curve (Red dashed line, wanders up to -15%) -->
<path d="M 140 285 Q 180 255 260 215 T 450 155 T 700 120 T 820 100" fill="none" stroke="#f85149" stroke-width="2" stroke-dasharray="4 4"/>
<text x="320" y="250" font-size="11" fill="#f85149" font-weight="700">Без калібрування (дрейф до −15%)</text>

<!-- X-axis labels Flow Q -->
<text x="140" y="295" font-size="11" fill="#8b949e" text-anchor="middle">Q_min (1 л/хв)</text>
<text x="320" y="295" font-size="11" fill="#8b949e" text-anchor="middle">Q_trans (5 л/хв)</text>
<text x="580" y="295" font-size="11" fill="#8b949e" text-anchor="middle">Q_nom (15 л/хв)</text>
<text x="820" y="295" font-size="11" fill="#8b949e" text-anchor="middle">Q_max (30 л/хв)</text>

<!-- Bottom Explanations -->
<rect x="60" y="315" width="820" height="95" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="80" y="340" font-size="13" fill="#58a6ff" font-weight="700">Метрологічний бюджет похибок турбінного датчика:</text>
<text x="80" y="365" font-size="12" fill="#f0f6fc">• <tspan fill="#d29922" font-weight="700">Коефіцієнт витратоміра (Meter Factor):</tspan> MF = V_дійсний / V_показаний. Для точного лічильника MF = 1.000 ± 0.005.</text>
<text x="80" y="390" font-size="12" fill="#f0f6fc">• <tspan fill="#3fb950" font-weight="700">Повторюваність (Repeatability):</tspan> здатність видавати те саме число імпульсів при незмінній витраті (у YF-S201 краще 0.5%).</text>
</svg>