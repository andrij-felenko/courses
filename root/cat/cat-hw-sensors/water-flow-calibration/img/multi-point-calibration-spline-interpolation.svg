<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 430" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif">
<rect width="940" height="430" fill="#0d1117"/>
<text x="470" y="30" font-size="18" fill="#f0f6fc" text-anchor="middle" font-weight="700">Багатоточкове калібрування K-фактора та кусочно-лінійна інтерполяція</text>

<!-- Graph area left -->
<rect x="50" y="65" width="460" height="300" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1.8"/>

<!-- Grid lines -->
<line x1="110" y1="110" x2="480" y2="110" stroke="#21262d" stroke-dasharray="3 3"/>
<line x1="110" y1="160" x2="480" y2="160" stroke="#21262d" stroke-dasharray="3 3"/>
<line x1="110" y1="210" x2="480" y2="210" stroke="#21262d" stroke-dasharray="3 3"/>
<line x1="110" y1="260" x2="480" y2="260" stroke="#21262d" stroke-dasharray="3 3"/>
<line x1="110" y1="310" x2="480" y2="310" stroke="#21262d" stroke-dasharray="3 3"/>

<!-- Axes -->
<line x1="110" y1="70" x2="110" y2="320" stroke="#8b949e" stroke-width="2"/>
<line x1="110" y1="320" x2="490" y2="320" stroke="#8b949e" stroke-width="2"/>

<!-- Y-axis: K-factor value -->
<text x="100" y="115" font-size="11" fill="#8b949e" text-anchor="end">8.5</text>
<text x="100" y="165" font-size="11" fill="#8b949e" text-anchor="end">8.0</text>
<text x="100" y="215" font-size="11" fill="#8b949e" text-anchor="end">7.5</text>
<text x="100" y="265" font-size="11" fill="#8b949e" text-anchor="end">7.0</text>
<text x="100" y="315" font-size="11" fill="#8b949e" text-anchor="end">6.5</text>
<text x="65" y="195" font-size="13" fill="#3fb950" font-weight="700" transform="rotate(-90 65 195)" text-anchor="middle">Коефіцієнт K [Гц / (л/хв)]</text>

<!-- X-axis: Frequency f [Hz] -->
<text x="110" y="340" font-size="11" fill="#8b949e" text-anchor="middle">0</text>
<text x="180" y="340" font-size="11" fill="#8b949e" text-anchor="middle">25</text>
<text x="260" y="340" font-size="11" fill="#8b949e" text-anchor="middle">75</text>
<text x="340" y="340" font-size="11" fill="#8b949e" text-anchor="middle">125</text>
<text x="420" y="340" font-size="11" fill="#8b949e" text-anchor="middle">175</text>
<text x="475" y="340" font-size="11" fill="#8b949e" text-anchor="middle">220</text>
<text x="300" y="360" font-size="13" fill="#58a6ff" font-weight="700" text-anchor="middle">Частота імпульсів f [Гц]</text>

<!-- Interpolated Piecewise Segments (Orange curve with points) -->
<!-- Calibration Points -->
<!-- P1 (15 Hz, 6.7) -->
<circle cx="150" cy="290" r="6" fill="#f85149" stroke="#ffffff" stroke-width="1.5"/>
<!-- P2 (40 Hz, 7.2) -->
<circle cx="210" cy="240" r="6" fill="#f85149" stroke="#ffffff" stroke-width="1.5"/>
<!-- P3 (90 Hz, 7.55) -->
<circle cx="280" cy="205" r="6" fill="#f85149" stroke="#ffffff" stroke-width="1.5"/>
<!-- P4 (150 Hz, 7.7) -->
<circle cx="370" cy="190" r="6" fill="#f85149" stroke="#ffffff" stroke-width="1.5"/>
<!-- P5 (210 Hz, 7.85) -->
<circle cx="460" cy="175" r="6" fill="#f85149" stroke="#ffffff" stroke-width="1.5"/>

<!-- Connecting Lines -->
<line x1="150" y1="290" x2="210" y2="240" stroke="#f0883e" stroke-width="2.5"/>
<line x1="210" y1="240" x2="280" y2="205" stroke="#f0883e" stroke-width="2.5"/>
<line x1="280" y1="205" x2="370" y2="190" stroke="#f0883e" stroke-width="2.5"/>
<line x1="370" y1="190" x2="460" y2="175" stroke="#f0883e" stroke-width="2.5"/>

<!-- Flat line showing nominal 7.5 -->
<line x1="110" y1="210" x2="480" y2="210" stroke="#3fb950" stroke-width="1.5" stroke-dasharray="4 4"/>
<text x="440" y="202" font-size="10" fill="#3fb950">Номінал K=7.50</text>

<!-- Right Side Calibration Table -->
<rect x="540" y="65" width="360" height="300" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
<text x="720" y="95" font-size="15" fill="#f0883e" font-weight="700" text-anchor="middle">Калібрувальна матриця в EEPROM</text>

<text x="560" y="130" font-size="12" fill="#f0f6fc">Масив опорних точок у прошивці:</text>

<rect x="560" y="145" width="320" height="110" rx="5" fill="#0d1117" stroke="#30363d"/>
<text x="575" y="168" font-size="11" fill="#3fb950" font-family="Consolas, monospace">Point 1: {  15.0 Hz, 6.70 }</text>
<text x="575" y="188" font-size="11" fill="#3fb950" font-family="Consolas, monospace">Point 2: {  40.0 Hz, 7.20 }</text>
<text x="575" y="208" font-size="11" fill="#3fb950" font-family="Consolas, monospace">Point 3: {  90.0 Hz, 7.55 }</text>
<text x="575" y="228" font-size="11" fill="#3fb950" font-family="Consolas, monospace">Point 4: { 150.0 Hz, 7.70 }</text>
<text x="575" y="248" font-size="11" fill="#3fb950" font-family="Consolas, monospace">Point 5: { 210.0 Hz, 7.85 }</text>

<text x="560" y="280" font-size="12" fill="#58a6ff" font-weight="700">Перевага кусочної інтерполяції:</text>
<text x="560" y="300" font-size="11" fill="#8b949e">Знижує похибку обліку води з ±12% до ±1.2%</text>
<text x="560" y="318" font-size="11" fill="#8b949e">на всьому діапазоні витрат від 1.5 до 25 л/хв.</text>

<!-- Footer -->
<rect x="50" y="380" width="850" height="26" rx="4" fill="#21262d"/>
<text x="475" y="397" font-size="11" fill="#8b949e" text-anchor="middle">
  Лінійна інтерполяція між сусідніми точками обчислюється однією парою множення та ділення
</text>
</svg>