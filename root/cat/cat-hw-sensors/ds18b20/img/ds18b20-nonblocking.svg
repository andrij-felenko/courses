<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif"><rect width="960" height="400" fill="#ffffff"/>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#333333"/></marker></defs>
<text x="480.0" y="30.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="15" fill="#1a1a1a" text-anchor="middle" font-weight="700">Неблокуюче читання: конверсія триває сама, поки МК зайнятий іншим</text>
<line x1="90.0" y1="130.0" x2="880.0" y2="130.0" stroke="#1a1a1a" stroke-width="2.0"/>
<text x="884.0" y="134.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#6b7280" text-anchor="start">час</text>
<line x1="130.0" y1="124.0" x2="130.0" y2="136.0" stroke="#2457d6" stroke-width="2.0"/>
<text x="130.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle" font-weight="700"><tspan x="130.0" dy="0.0">requestTemperatures()</tspan><tspan x="130.0" dy="13.7">(не чекаємо!)</tspan></text>
<line x1="600.0" y1="124.0" x2="600.0" y2="136.0" stroke="#27ae60" stroke-width="2.0"/>
<text x="600.0" y="114.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle" font-weight="700"><tspan x="600.0" dy="0.0">≥750 мс минуло →</tspan><tspan x="600.0" dy="13.7">getTempC(): забрати</tspan></text>
<rect x="130.0" y="170.0" width="470.0" height="34.0" rx="8" fill="#eef7ee" stroke="#27ae60" stroke-width="1.6"/>
<text x="365.0" y="192.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#27ae60" text-anchor="middle">давач сам робить перетворення (нам платити нічого)</text>
<rect x="130.0" y="222.0" width="470.0" height="34.0" rx="8" fill="#eef2ff" stroke="#2457d6" stroke-width="1.6"/>
<text x="365.0" y="244.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="10" fill="#2457d6" text-anchor="middle">МК тим часом: читає кнопки, крутить дисплей, рахує ПІД, опитує інші шини</text>
<line x1="600.0" y1="130.0" x2="880.0" y2="130.0" stroke="#1a1a1a" stroke-width="2.0" stroke-dasharray="4 4"/>
<text x="480.0" y="300.0" font-family="'Segoe UI', 'DejaVu Sans', Arial, sans-serif" font-size="11" fill="#1a1a1a" text-anchor="middle"><tspan x="480.0" dy="0.0">Замість delay(750) на кожен вимір — запусти конверсію й повертайся аж коли час минув. Одна лінія коду (перевірка millis) звільняє три чверті секунди на кожен давач.</tspan></text>
</svg>