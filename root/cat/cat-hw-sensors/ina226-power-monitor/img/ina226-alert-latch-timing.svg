<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" width="960" height="500" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="500" fill="white"/>

  <!-- Header: Title & Subtitle -->
  <text x="480" y="36" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Часова діаграма апаратного захисту INA226 у режимі Latch</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Сигнал /ALERT фіксується у низькому стані до зчитування регістру Mask/Enable</text>

  <!-- Definitions -->
  <defs>
    <marker id="arr-right" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-left" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M7,1 L0,4 L7,7 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,1 L7,4 L0,7 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Main Diagram Panel -->
  <rect x="40" y="80" width="880" height="390" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Vertical Divider separating labels from timing plot -->
  <line x1="195" y1="95" x2="195" y2="455" stroke="#d0d7de" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- Left Column: Signal Names -->
  <!-- Signal 1: Current -->
  <text x="55" y="132" font-size="13" font-weight="bold" fill="#1a1a1a">Струм шунта</text>
  <text x="55" y="148" font-size="12" fill="#c0392b">I_load (А)</text>

  <!-- Signal 2: ALERT pin -->
  <text x="55" y="222" font-size="13" font-weight="bold" fill="#1a1a1a">Вивід /ALERT</text>
  <text x="55" y="238" font-size="12" fill="#6b7280">(Latch mode)</text>

  <!-- Signal 3: MOSFET -->
  <text x="55" y="322" font-size="13" font-weight="bold" fill="#1a1a1a">Ключ MOSFET</text>
  <text x="55" y="338" font-size="12" fill="#6b7280">(Живлення)</text>

  <!-- Signal 4: Events / I2C -->
  <text x="55" y="412" font-size="13" font-weight="bold" fill="#1a1a1a">Події / I²C</text>
  <text x="55" y="428" font-size="12" fill="#6b7280">(Статус МК)</text>

  <!-- Vertical Time Grid Lines -->
  <!-- t1 line (Overcurrent start) -->
  <line x1="350" y1="95" x2="350" y2="390" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <text x="350" y="103" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">t1</text>

  <!-- t2 line (ALERT asserted LOW) -->
  <line x1="460" y1="95" x2="460" y2="390" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3" opacity="0.8"/>
  <text x="460" y="103" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">t2</text>

  <!-- t3 line (MOSFET turned OFF, I=0) -->
  <line x1="580" y1="95" x2="580" y2="390" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,3" opacity="0.8"/>
  <text x="580" y="103" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">t3</text>

  <!-- t4 line (I2C Read, Latch cleared) -->
  <line x1="760" y1="95" x2="760" y2="390" stroke="#27ae60" stroke-width="1" stroke-dasharray="3,3" opacity="0.8"/>
  <text x="760" y="103" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">t4</text>

  <!-- SIGNAL 1: CURRENT WAVEFORM -->
  <!-- Shading under current curve -->
  <!-- Normal area -->
  <polygon points="210,185 210,165 350,165 350,185" fill="#eaf0fd" opacity="0.7"/>
  <!-- Overcurrent area -->
  <polygon points="350,185 350,165 365,135 580,135 585,185" fill="#fdecea" opacity="0.8"/>

  <!-- Horizontal Threshold line I_limit -->
  <line x1="210" y1="120" x2="890" y2="120" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="215" y="113" font-size="12" font-weight="bold" fill="#c0392b">Поріг I_limit</text>

  <!-- Baseline I = 0 -->
  <line x1="210" y1="185" x2="890" y2="185" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Waveform paths -->
  <!-- Normal segment -->
  <path d="M 210,165 L 350,165" stroke="#2457d6" stroke-width="2.5" fill="none"/>
  <!-- Fault segment -->
  <path d="M 350,165 L 365,135 L 580,135" stroke="#c0392b" stroke-width="3" fill="none"/>
  <!-- Drop to zero segment -->
  <path d="M 580,135 L 585,185 L 890,185" stroke="#6b7280" stroke-width="2" fill="none"/>

  <!-- Signal 1 Annotations -->
  <text x="280" y="158" font-size="12" fill="#2457d6" text-anchor="middle">I_norm (Робочий струм)</text>
  <text x="465" y="148" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">I_fault > I_limit</text>
  <text x="760" y="178" font-size="12" fill="#6b7280" text-anchor="middle">I = 0 А (Струм відсутній)</text>

  <!-- SIGNAL 2: ALERT PIN WAVEFORM (LATCH MODE) -->
  <!-- Highlight region for Latched LOW state -->
  <rect x="460" y="210" width="300" height="58" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3" opacity="0.4"/>

  <!-- Baseline LOW y=260 -->
  <line x1="210" y1="260" x2="890" y2="260" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Waveform paths -->
  <!-- HIGH initially -->
  <path d="M 210,220 L 460,220" stroke="#27ae60" stroke-width="2.5" fill="none"/>
  <!-- Falling edge and LOW latched state -->
  <path d="M 460,220 L 460,260 L 760,260" stroke="#c0392b" stroke-width="3" fill="none"/>
  <!-- Rising edge and restored HIGH -->
  <path d="M 760,260 L 760,220 L 890,220" stroke="#27ae60" stroke-width="2.5" fill="none"/>

  <!-- Signal 2 Annotations -->
  <text x="330" y="213" font-size="12" fill="#27ae60" text-anchor="middle">HIGH (Норма)</text>
  <text x="610" y="253" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">LOW (Утримування LATCH)</text>
  <text x="825" y="213" font-size="12" fill="#27ae60" text-anchor="middle">HIGH (Скинуто)</text>

  <!-- LATCH callout badge -->
  <rect x="525" y="272" width="170" height="20" rx="3" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="610" y="286" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">I_load = 0, але ALERT = LOW!</text>

  <!-- SIGNAL 3: MOSFET GATE CONTROL -->
  <!-- Baseline OFF y=355 -->
  <line x1="210" y1="355" x2="890" y2="355" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Waveform paths -->
  <!-- ON state -->
  <path d="M 210,320 L 580,320" stroke="#2457d6" stroke-width="2.5" fill="none"/>
  <!-- Falling edge and OFF state -->
  <path d="M 580,320 L 580,355 L 890,355" stroke="#6b7280" stroke-width="2.5" fill="none"/>

  <!-- Signal 3 Annotations -->
  <text x="380" y="313" font-size="12" fill="#2457d6" text-anchor="middle">УВІМК (Живлення подано)</text>
  <text x="735" y="348" font-size="12" fill="#6b7280" text-anchor="middle">ВИМК (Навантаження відключено)</text>

  <!-- TIME INTERVALS & TIME AXIS -->
  <!-- Time axis arrow line -->
  <line x1="210" y1="388" x2="885" y2="388" stroke="#6b7280" stroke-width="1" marker-end="url(#arr-gray)"/>
  <text x="888" y="392" font-size="12" font-style="italic" fill="#6b7280">t</text>

  <!-- t_conv arrow (t1 to t2) -->
  <line x1="355" y1="377" x2="455" y2="377" stroke="#1a1a1a" stroke-width="1.2" marker-start="url(#arr-left)" marker-end="url(#arr-right)"/>
  <text x="405" y="372" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">t_conv (INA226)</text>

  <!-- delta_t_resp arrow (t2 to t3) -->
  <line x1="465" y1="377" x2="575" y2="377" stroke="#1a1a1a" stroke-width="1.2" marker-start="url(#arr-left)" marker-end="url(#arr-right)"/>
  <text x="520" y="372" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Δt_resp (ESP32)</text>

  <!-- EVENT CARDS AT THE BOTTOM -->
  <!-- Card 1: ALERT asserted -->
  <rect x="395" y="400" width="120" height="44" rx="5" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="455" y="416" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">1. Аварія /ALERT</text>
  <text x="455" y="433" font-size="11" fill="#6b7280" text-anchor="middle">Сигнал упав у 0 В</text>

  <!-- Card 2: MCU Protection triggered -->
  <rect x="527" y="400" width="120" height="44" rx="5" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="587" y="416" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">2. Захист МК</text>
  <text x="587" y="433" font-size="11" fill="#6b7280" text-anchor="middle">Вимкнення MOSFET</text>

  <!-- Card 3: I2C Read Reset -->
  <rect x="690" y="400" width="140" height="44" rx="5" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="760" y="416" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">3. Зчитування I²C</text>
  <text x="760" y="433" font-size="11" fill="#6b7280" text-anchor="middle">Скидання LATCH</text>
</svg>
