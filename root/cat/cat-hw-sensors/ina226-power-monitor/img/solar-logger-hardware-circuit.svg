<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <defs>
    <!-- Arrow Markers -->
    <marker id="arr-dark" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Схема підключення INA226 у сонячно-акумуляторній системі</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Двонапрямлене вимірювання струму шунтом R_SHUNT та передача даних I2C / Alert на МК</text>

  <!-- COL 1: Power Domain Panel -->
  <rect x="30" y="75" width="190" height="445" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="125" y="96" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Силове коло живлення</text>

  <!-- Solar Panel Box -->
  <rect x="42" y="110" width="166" height="95" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="125" y="130" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Сонячна панель</text>
  <text x="125" y="148" font-size="12" fill="#1a1a1a" text-anchor="middle">V_PV = 18...22 B</text>
  <text x="125" y="166" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Заряд (Charge)</text>
  <text x="125" y="184" font-size="12" fill="#6b7280" text-anchor="middle">Джерело струму</text>

  <!-- Battery Box -->
  <rect x="42" y="220" width="166" height="95" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="125" y="240" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">АКБ (LiFePO4)</text>
  <text x="125" y="258" font-size="12" fill="#1a1a1a" text-anchor="middle">V_BAT = 12.8 B</text>
  <text x="125" y="276" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Двонапрямлений потік</text>
  <text x="125" y="294" font-size="12" fill="#6b7280" text-anchor="middle">Накопичувач ємності</text>

  <!-- Load Box -->
  <rect x="42" y="330" width="166" height="95" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="125" y="350" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">Навантаження</text>
  <text x="125" y="368" font-size="12" fill="#1a1a1a" text-anchor="middle">12 B DC / Споживач</text>
  <text x="125" y="386" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">Розряд (Discharge)</text>
  <text x="125" y="404" font-size="12" fill="#6b7280" text-anchor="middle">I_LOAD споживання</text>

  <!-- Ground Bar & Symbol -->
  <line x1="42" y1="470" x2="208" y2="470" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="110" y1="476" x2="140" y2="476" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="116" y1="482" x2="134" y2="482" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="122" y1="488" x2="128" y2="488" stroke="#1a1a1a" stroke-width="2"/>
  <text x="125" y="506" font-size="12" fill="#6b7280" text-anchor="middle">Спільне заземлення (GND)</text>

  <!-- COL 2: Power Bus & INA226 Panel -->
  <line x1="208" y1="130" x2="350" y2="130" stroke="#2457d6" stroke-width="3"/>
  <line x1="490" y1="130" x2="600" y2="130" stroke="#2457d6" stroke-width="3"/>

  <!-- Shunt Resistor Box -->
  <rect x="350" y="112" width="140" height="36" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="420" y="134" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">R_SHUNT = 2 мОм</text>

  <!-- Charge / Discharge Flow Arrows -->
  <line x1="320" y1="88" x2="520" y2="88" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="420" y="81" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">I_CHARGE -&gt; (+ струм заряджання)</text>

  <line x1="520" y1="178" x2="320" y2="178" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="420" y="164" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">&lt;- I_DISCHARGE (- струм розряджання)</text>

  <!-- Bus Taps (Node A and Node B) -->
  <circle cx="275" cy="130" r="4" fill="#2457d6"/>
  <circle cx="320" cy="130" r="4" fill="#2457d6"/>
  <circle cx="520" cy="130" r="4" fill="#2457d6"/>

  <!-- Tap Wires down to INA226 Pins -->
  <line x1="275" y1="130" x2="275" y2="210" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="320" y1="130" x2="320" y2="210" stroke="#2457d6" stroke-width="1.5"/>
  <line x1="520" y1="130" x2="520" y2="210" stroke="#2457d6" stroke-width="1.5"/>

  <!-- Top Pin Labels for INA226 -->
  <text x="262" y="198" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">VBUS</text>
  <text x="330" y="198" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">IN+</text>
  <text x="530" y="198" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">IN-</text>

  <!-- INA226 Main Box -->
  <rect x="250" y="210" width="340" height="310" rx="8" fill="#ffffff" stroke="#2457d6" stroke-width="2"/>
  <text x="420" y="232" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Цифровий монітор INA226</text>
  <text x="420" y="248" font-size="12" fill="#6b7280" text-anchor="middle">Двонапрямлений вимірювач V_BUS та V_SENSE</text>

  <!-- INA226 Sub-block 1: PGA + Current ADC -->
  <rect x="265" y="260" width="148" height="76" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="339" y="278" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Диф. підсилювач (PGA)</text>
  <text x="339" y="294" font-size="12" fill="#1a1a1a" text-anchor="middle">16-біт ADC струму</text>
  <text x="339" y="310" font-size="12" fill="#6b7280" text-anchor="middle">V_SENSE = ±81.92 мВ</text>
  <text x="339" y="326" font-size="12" fill="#27ae60" text-anchor="middle">LSB = 2.5 мкВ</text>

  <!-- INA226 Sub-block 2: Bus Voltage ADC -->
  <rect x="265" y="344" width="148" height="62" rx="5" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="339" y="362" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">ADC V_BUS Напруги</text>
  <text x="339" y="378" font-size="12" fill="#6b7280" text-anchor="middle">Діапазон 0...36 B</text>
  <text x="339" y="394" font-size="12" fill="#6b7280" text-anchor="middle">LSB = 1.25 мВ</text>

  <!-- INA226 Sub-block 3: Math Engine & Registers -->
  <rect x="425" y="260" width="150" height="146" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="500" y="278" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Множник і Регістри</text>
  <text x="500" y="296" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Power = Current × V_BUS</text>
  <text x="500" y="314" font-size="12" fill="#1a1a1a" text-anchor="middle">Регістр калібрування</text>
  <text x="500" y="332" font-size="12" fill="#1a1a1a" text-anchor="middle">Регістри струму &amp; Вт</text>
  <text x="500" y="350" font-size="12" fill="#1a1a1a" text-anchor="middle">Поріг тривоги Alert</text>
  <text x="500" y="368" font-size="12" fill="#6b7280" text-anchor="middle">Апаратне множення</text>
  <text x="500" y="384" font-size="12" fill="#6b7280" text-anchor="middle">без навантаження МК</text>

  <!-- INA226 Sub-block 4: Interface Controller -->
  <rect x="265" y="414" width="285" height="95" rx="5" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="407" y="432" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Контролер інтерфейсів I2C / Alert</text>
  <text x="407" y="450" font-size="12" fill="#6b7280" text-anchor="middle">I2C адресація (A0, A1)</text>
  <text x="407" y="468" font-size="12" fill="#6b7280" text-anchor="middle">Швидкість до 2.94 МГц</text>

  <!-- Internal INA226 Signal Pin Labels on Right Edge -->
  <text x="580" y="444" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">SCL</text>
  <text x="580" y="474" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">SDA</text>
  <text x="580" y="504" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">ALERT</text>

  <!-- COL 3: Pull-Up Panel & MCU Panel -->

  <!-- Top Pull-Up Resistors Panel -->
  <rect x="620" y="75" width="310" height="115" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="775" y="95" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Блок підтяжки ліній (Pull-Up)</text>

  <!-- 3.3V Rail Line in Pull-Up Panel -->
  <line x1="640" y1="112" x2="910" y2="112" stroke="#c0392b" stroke-width="2"/>
  <text x="775" y="104" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">+3.3V VCC (Живлення логіки)</text>

  <!-- Pull-Up Resistor R1 (SCL) -->
  <line x1="660" y1="112" x2="660" y2="122" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="652" y="122" width="16" height="26" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <polyline points="660,148 660,165 600,165 600,440" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="644" y="134" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">R1</text>
  <text x="644" y="148" font-size="12" fill="#6b7280" text-anchor="end">4.7k</text>

  <!-- Pull-Up Resistor R2 (SDA) -->
  <line x1="755" y1="112" x2="755" y2="122" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="747" y="122" width="16" height="26" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <polyline points="755,148 755,172 608,172 608,470" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="739" y="134" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">R2</text>
  <text x="739" y="148" font-size="12" fill="#6b7280" text-anchor="end">4.7k</text>

  <!-- Pull-Up Resistor R3 (ALERT) -->
  <line x1="850" y1="112" x2="850" y2="122" stroke="#c0392b" stroke-width="1.5"/>
  <rect x="842" y="122" width="16" height="26" rx="2" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
  <polyline points="850,148 850,179 616,179 616,500" stroke="#27ae60" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="834" y="134" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">R3</text>
  <text x="834" y="148" font-size="12" fill="#6b7280" text-anchor="end">10k</text>

  <!-- Bottom MCU Panel -->
  <rect x="620" y="210" width="310" height="310" rx="8" fill="#f4f6f8" stroke="#2457d6" stroke-width="2"/>
  <text x="775" y="232" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">Мікроконтролер (MCU)</text>
  <text x="775" y="248" font-size="12" fill="#6b7280" text-anchor="middle">Обчислювач ємності та логер даних</text>

  <!-- MCU Pin Labels on Left Edge -->
  <text x="628" y="444" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">SCL</text>
  <text x="628" y="474" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">SDA</text>
  <text x="628" y="504" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">ALERT</text>

  <!-- MCU Sub-block 1: I2C Master Driver -->
  <rect x="655" y="260" width="260" height="58" rx="5" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="785" y="276" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">I2C Master Драйвер</text>
  <text x="785" y="292" font-size="12" fill="#6b7280" text-anchor="middle">Зчитування I_shunt, V_bus, P_bus</text>
  <text x="785" y="306" font-size="12" fill="#2457d6" text-anchor="middle">Запис конфігурації та калібрування</text>

  <!-- MCU Sub-block 2: Integration -->
  <rect x="655" y="326" width="260" height="78" rx="5" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="785" y="342" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">Дискретне інтегрування за часом</text>
  <text x="785" y="358" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Q = ∑ (I · Δt) [А·год] (Ємність)</text>
  <text x="785" y="374" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">E = ∑ (P · Δt) [Вт·год] (Енергія)</text>
  <text x="785" y="390" font-size="12" fill="#27ae60" text-anchor="middle">Окремий облік заряду (+) та розряду (-)</text>

  <!-- MCU Sub-block 3: Power Management -->
  <rect x="655" y="412" width="260" height="96" rx="5" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="785" y="428" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="middle">Енергозбереження (Deep Sleep)</text>
  <text x="785" y="444" font-size="12" fill="#1a1a1a" text-anchor="middle">МК у сплячому режимі (I_mcu &lt; 10 мкА)</text>
  <text x="785" y="460" font-size="12" fill="#1a1a1a" text-anchor="middle">Пробудження за ALERT або таймером RTC</text>
  <text x="785" y="476" font-size="12" fill="#6b7280" text-anchor="middle">Збереження лічильників в NVS</text>

  <!-- Interconnecting Signal Lines (INA226 <-> MCU) -->
  <!-- SCL Bus Wire -->
  <line x1="590" y1="440" x2="620" y2="440" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <circle cx="600" cy="440" r="3.5" fill="#2457d6"/>

  <!-- SDA Bus Wire -->
  <line x1="590" y1="470" x2="620" y2="470" stroke="#2457d6" stroke-width="2" marker-start="url(#arr-blue)" marker-end="url(#arr-blue)"/>
  <circle cx="608" cy="470" r="3.5" fill="#2457d6"/>

  <!-- ALERT Line -->
  <line x1="590" y1="500" x2="620" y2="500" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <circle cx="616" cy="500" r="3.5" fill="#27ae60"/>

  <!-- Power GND Wire (INA226 to GND Bar) -->
  <line x1="250" y1="470" x2="208" y2="470" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="250" cy="470" r="3" fill="#1a1a1a"/>

  <!-- MCU GND Wire (MCU to GND Line) -->
  <polyline points="620,310 610,310 610,520 208,520 208,470" stroke="#1a1a1a" stroke-width="1.5" stroke-dasharray="4,3"/>

</svg>
