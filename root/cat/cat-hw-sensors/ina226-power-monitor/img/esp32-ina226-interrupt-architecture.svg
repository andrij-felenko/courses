<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <!-- White Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Markers -->
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Апаратна архітектура обробки переривань INA226 на ESP32</text>
  <text x="480" y="58" font-size="13" fill="#6b7280" text-anchor="middle">Сигнал ALERT миттєво змикає захист і передає події у FreeRTOS без опитування I²C</text>

  <!-- PANEL 1: INA226 & Power Stage -->
  <rect x="24" y="82" width="270" height="438" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="36" y="94" width="246" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="159" y="112" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">INA226 + Силовий ключ</text>

  <!-- Power Stage Box -->
  <rect x="40" y="128" width="238" height="92" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="146" font-size="12" font-weight="bold" fill="#1a1a1a">Силова лінія живлення</text>
  <line x1="50" y1="178" x2="80" y2="178" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="140" y1="178" x2="165" y2="178" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="230" y1="178" x2="268" y2="178" stroke="#1a1a1a" stroke-width="2"/>
  
  <rect x="80" y="161" width="60" height="34" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="110" y="182" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">R_shunt</text>
  
  <rect x="165" y="161" width="65" height="34" rx="3" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
  <text x="197.5" y="182" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">MOSFET</text>
  
  <text x="48" y="208" font-size="12" fill="#6b7280">V_IN</text>
  <text x="268" y="208" font-size="12" fill="#6b7280" text-anchor="end">V_OUT</text>

  <!-- INA226 Chip Container -->
  <rect x="40" y="232" width="238" height="276" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <rect x="40" y="232" width="238" height="28" rx="6" fill="#eaf0fd"/>
  <text x="50" y="251" font-size="13" font-weight="bold" fill="#2457d6">Чип INA226</text>

  <!-- ADC Sub-block -->
  <rect x="50" y="270" width="218" height="50" rx="4" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="60" y="289" font-size="12" font-weight="bold" fill="#1a1a1a">16-біт АЦП (ADC)</text>
  <text x="60" y="307" font-size="12" fill="#6b7280">Входи: V_SHUNT, V_BUS</text>

  <!-- Alert Logic Sub-block -->
  <rect x="50" y="332" width="218" height="72" rx="4" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="60" y="351" font-size="12" font-weight="bold" fill="#c0392b">Компаратор &amp; Mask/Enable</text>
  <text x="60" y="369" font-size="12" fill="#1a1a1a">Поріг: ALERT Limit (SOL/POL)</text>
  <text x="60" y="387" font-size="12" fill="#6b7280">Прапорець: CVRF / SOL Flag</text>

  <!-- ALERT Pin Block -->
  <rect x="50" y="416" width="218" height="36" rx="4" fill="#ffffff" stroke="#c0392b" stroke-width="1"/>
  <text x="60" y="439" font-size="12" font-weight="bold" fill="#c0392b">Вивід ALERT (Open-Drain)</text>

  <!-- I2C Pin Block -->
  <rect x="50" y="464" width="218" height="36" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1"/>
  <text x="60" y="487" font-size="12" font-weight="bold" fill="#2457d6">Інтерфейс I²C (SDA/SCL)</text>

  <!-- PANEL 2: ESP32 Microcontroller -->
  <rect x="324" y="82" width="310" height="438" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="336" y="94" width="286" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="479" y="112" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">Мікроконтролер ESP32 (Ядро / ISR)</text>

  <!-- GPIO 19 Unit -->
  <rect x="340" y="128" width="278" height="65" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="350" y="146" font-size="12" font-weight="bold" fill="#1a1a1a">GPIO 19 (Вхід ALERT + Pull-Up)</text>
  <text x="350" y="164" font-size="12" fill="#c0392b">Детектор спаду (FALLING Edge)</text>
  <text x="350" y="181" font-size="12" fill="#6b7280">Апаратний тригер переривання</text>

  <!-- Hardware ISR Block -->
  <rect x="340" y="205" width="278" height="146" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="350" y="223" font-size="13" font-weight="bold" fill="#c0392b">Обробник переривання (ISR)</text>
  <text x="350" y="239" font-size="12" fill="#6b7280">Виконується у контексті IRAM (&lt; 10 µs)</text>

  <!-- Action 1: MOSFET Cutoff -->
  <rect x="350" y="247" width="258" height="42" rx="4" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="360" y="264" font-size="12" font-weight="bold" fill="#27ae60">1. Апаратна відсічка (GPIO OUT)</text>
  <text x="360" y="280" font-size="12" fill="#1a1a1a">Сигнал LOW на MOSFET Gate (&lt; 10 µs)</text>

  <!-- Action 2: FreeRTOS Queue Send -->
  <rect x="350" y="297" width="258" height="46" rx="4" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="360" y="315" font-size="12" font-weight="bold" fill="#2457d6">2. Передача події у чергу</text>
  <text x="360" y="333" font-size="12" fill="#1a1a1a">xQueueSendFromISR(alert_queue)</text>

  <!-- I2C Master Engine Block -->
  <rect x="340" y="363" width="278" height="145" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
  <text x="350" y="381" font-size="12" font-weight="bold" fill="#2457d6">Апаратний драйвер I²C Master</text>
  <text x="350" y="399" font-size="12" fill="#1a1a1a">Контролер шини (Fast Mode 400 кГц)</text>
  <text x="350" y="419" font-size="12" fill="#6b7280">• Зчитування Current / Bus Volt</text>
  <text x="350" y="437" font-size="12" fill="#c0392b">• Скидання прапорця Mask/Enable</text>
  <text x="350" y="455" font-size="12" fill="#2457d6">• Передача у metric_queue</text>
  <text x="350" y="487" font-size="12" fill="#6b7280">Фоновий обмін без блокування CPU</text>

  <!-- PANEL 3: FreeRTOS Subsystem -->
  <rect x="664" y="82" width="272" height="438" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <rect x="676" y="94" width="248" height="28" rx="4" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="800" y="112" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">ОС FreeRTOS / Задачі</text>

  <!-- alert_queue -->
  <rect x="678" y="128" width="244" height="60" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
  <text x="688" y="146" font-size="12" font-weight="bold" fill="#c0392b">Черга аварій (alert_queue)</text>
  <text x="688" y="162" font-size="12" fill="#1a1a1a">Буфер подій струмової аварії</text>
  <text x="688" y="178" font-size="12" fill="#6b7280">Подія з ISR без блокування</text>

  <!-- Connection: alert_queue -> PowerEmergencyTask -->
  <line x1="800" y1="188" x2="800" y2="201" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- PowerEmergencyTask -->
  <rect x="678" y="203" width="244" height="105" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
  <text x="688" y="221" font-size="12" font-weight="bold" fill="#c0392b">PowerEmergencyTask (High Priority)</text>
  <text x="688" y="239" font-size="12" fill="#1a1a1a">1. xQueueReceive(alert_queue)</text>
  <text x="688" y="257" font-size="12" fill="#1a1a1a">2. Читання регістрів INA226 (I²C)</text>
  <text x="688" y="275" font-size="12" fill="#1a1a1a">3. Логування аварії &amp; перезапуск</text>
  <text x="688" y="295" font-size="12" fill="#6b7280">Розблоковується миттєво по події</text>

  <!-- metric_queue -->
  <rect x="678" y="320" width="244" height="60" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
  <text x="688" y="338" font-size="12" font-weight="bold" fill="#2457d6">Черга метрик (metric_queue)</text>
  <text x="688" y="354" font-size="12" fill="#1a1a1a">Буфер метрик живлення (V, I, P)</text>
  <text x="688" y="370" font-size="12" fill="#6b7280">Передача даних для моніторингу</text>

  <!-- Connection: metric_queue -> TelemetryTask -->
  <line x1="800" y1="380" x2="800" y2="393" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>

  <!-- TelemetryTask -->
  <rect x="678" y="395" width="244" height="110" rx="6" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
  <text x="688" y="413" font-size="12" font-weight="bold" fill="#27ae60">TelemetryTask (Low Priority)</text>
  <text x="688" y="431" font-size="12" fill="#1a1a1a">1. Прийом даних з metric_queue</text>
  <text x="688" y="449" font-size="12" fill="#1a1a1a">2. Обчислення напруги і струму</text>
  <text x="688" y="467" font-size="12" fill="#1a1a1a">3. Передача в MQTT / Дашборд</text>
  <text x="688" y="492" font-size="12" fill="#6b7280">Виконується у фоновому режимі</text>

  <!-- SIGNAL LINES & ARROWS BETWEEN PANELS -->

  <!-- 1. ALERT Interrupt Signal (Red) -->
  <path d="M 268 434 H 302 V 160.5 H 340" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- 2. Fast Cutoff Signal (Green) -->
  <path d="M 350 268 H 312 V 178 H 230" fill="none" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>

  <!-- 3. I2C Bus Signals (Blue Dual Lines) -->
  <path d="M 268 476 H 340" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <path d="M 268 488 H 340" fill="none" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>

  <!-- 4. ISR to alert_queue Signal (Red) -->
  <path d="M 608 320 H 649 V 158 H 678" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- 5. I2C Master to metric_queue Signal (Blue) -->
  <path d="M 618 435 H 656 V 350 H 678" fill="none" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
</svg>
