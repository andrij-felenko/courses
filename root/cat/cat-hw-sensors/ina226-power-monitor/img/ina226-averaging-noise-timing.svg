<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="560" fill="white"/>

  <!-- Заголовок і підзаголовок -->
  <text x="480" y="35" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Компроміс усереднення INA226: Шум проти Часу відгуку</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Збільшення вибірок (AVG) знижує шум у √N разів, але пропорційно подовжує час конверсії T_conv</text>

  <!-- 1. Ліва панель: Часова діаграма вибірок -->
  <rect x="30" y="80" width="435" height="455" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="247" y="106" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">1. Часова діаграма накоплення вибірок</text>
  <text x="247" y="124" font-size="12" fill="#6b7280" text-anchor="middle">Накопичення даних АЦП та згладжування шуму сигналів</text>

  <!-- Рядок 1: AVG = 1 -->
  <rect x="45" y="140" width="405" height="110" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="60" y="162" font-size="13" font-weight="700" fill="#c0392b">AVG = 1 (1 вибірка, T_total = 1.1 ms)</text>
  <text x="435" y="162" font-size="12" font-weight="700" fill="#c0392b" text-anchor="end">909 Гц</text>

  <!-- Сигнал AVG=1 -->
  <path d="M 60,195 L 75,178 L 90,212 L 105,182 L 120,215 L 135,180 L 150,210 L 165,184 L 180,212 L 195,186 L 210,214 L 225,182 L 240,208 L 255,190" fill="none" stroke="#c0392b" stroke-width="1.8"/>
  <line x1="60" y1="195" x2="255" y2="195" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="275" y="185" font-size="12" fill="#1a1a1a">Шум: 100% (1x RMS)</text>
  <text x="275" y="205" font-size="12" fill="#6b7280">Оновлення: 1.1 ms</text>
  <text x="275" y="230" font-size="12" font-weight="700" fill="#c0392b">Високий шум</text>

  <!-- Рядок 2: AVG = 16 -->
  <rect x="45" y="260" width="405" height="110" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="60" y="282" font-size="13" font-weight="700" fill="#27ae60">AVG = 16 (16 вибірок, T_total = 17.6 ms)</text>
  <text x="435" y="282" font-size="12" font-weight="700" fill="#27ae60" text-anchor="end">57 Гц</text>

  <!-- Сигнал AVG=16 -->
  <path d="M 60,315 Q 90,309 120,318 T 180,312 T 240,317 T 255,315" fill="none" stroke="#27ae60" stroke-width="2"/>
  <line x1="60" y1="315" x2="255" y2="315" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="275" y="305" font-size="12" fill="#1a1a1a">Шум: 25% (0.25x RMS)</text>
  <text x="275" y="325" font-size="12" fill="#6b7280">Оновлення: 17.6 ms</text>
  <text x="275" y="350" font-size="12" font-weight="700" fill="#27ae60">Рекомендовано</text>

  <!-- Рядок 3: AVG = 128 -->
  <rect x="45" y="380" width="405" height="140" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="60" y="402" font-size="13" font-weight="700" fill="#2457d6">AVG = 128 (128 вибірок, T_total = 140.8 ms)</text>
  <text x="435" y="402" font-size="12" font-weight="700" fill="#2457d6" text-anchor="end">7 Гц</text>

  <!-- Сигнал AVG=128 -->
  <line x1="60" y1="435" x2="255" y2="435" stroke="#2457d6" stroke-width="2.5"/>
  <line x1="60" y1="435" x2="255" y2="435" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,3"/>

  <text x="275" y="425" font-size="12" fill="#1a1a1a">Шум: 8.8% (0.088x RMS)</text>
  <text x="275" y="445" font-size="12" fill="#6b7280">Оновлення: 140.8 ms</text>
  <text x="275" y="470" font-size="12" font-weight="700" fill="#2457d6">Прецизійний режим</text>

  <text x="60" y="502" font-size="12" fill="#6b7280">Час оновлення: T_total = AVG × T_CT (напр. 128 × 1.1 ms)</text>

  <!-- 2. Права панель: Графік залежності -->
  <rect x="495" y="80" width="435" height="455" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="712" y="106" font-size="14" font-weight="700" fill="#1a1a1a" text-anchor="middle">2. Залежність шуму та часу від AVG</text>
  <text x="712" y="124" font-size="12" fill="#6b7280" text-anchor="middle">Залежність похибки вимірювання та затримки від AVG</text>

  <!-- Зона компромісу (AVG 16 - 64) -->
  <rect x="650" y="160" width="110" height="240" fill="#e9f7ef" opacity="0.7" stroke="#27ae60" stroke-width="1" stroke-dasharray="4,4"/>
  <text x="705" y="152" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Зона компромісу</text>

  <!-- Вісі координат -->
  <line x1="550" y1="400" x2="875" y2="400" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="550" y1="400" x2="550" y2="165" stroke="#2457d6" stroke-width="1.5" marker-end="url(#arr-blue)"/>
  <line x1="875" y1="400" x2="875" y2="165" stroke="#c0392b" stroke-width="1.5" marker-end="url(#arr-red)"/>

  <!-- Заголовки осей -->
  <text x="540" y="152" font-size="12" font-weight="700" fill="#2457d6" text-anchor="end">Шум (%)</text>
  <text x="885" y="152" font-size="12" font-weight="700" fill="#c0392b" text-anchor="start">T_total (ms)</text>

  <!-- Сітка та засічки X -->
  <line x1="570" y1="170" x2="570" y2="400" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="620" y1="170" x2="620" y2="400" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="680" y1="170" x2="680" y2="400" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="740" y1="170" x2="740" y2="400" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="800" y1="170" x2="800" y2="400" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="855" y1="170" x2="855" y2="400" stroke="#d0d7de" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Підписи значень X (AVG) -->
  <text x="570" y="418" font-size="12" fill="#1a1a1a" text-anchor="middle">1</text>
  <text x="620" y="418" font-size="12" fill="#1a1a1a" text-anchor="middle">4</text>
  <text x="680" y="418" font-size="12" fill="#1a1a1a" text-anchor="middle">16</text>
  <text x="740" y="418" font-size="12" fill="#1a1a1a" text-anchor="middle">64</text>
  <text x="800" y="418" font-size="12" fill="#1a1a1a" text-anchor="middle">256</text>
  <text x="855" y="418" font-size="12" fill="#1a1a1a" text-anchor="middle">1024</text>
  <text x="712" y="438" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="middle">Кількість вибірок (AVG)</text>

  <!-- Засічки Left Y (Шум) -->
  <text x="542" y="185" font-size="12" fill="#2457d6" text-anchor="end">100%</text>
  <text x="542" y="235" font-size="12" fill="#2457d6" text-anchor="end">50%</text>
  <text x="542" y="295" font-size="12" fill="#2457d6" text-anchor="end">25%</text>
  <text x="542" y="385" font-size="12" fill="#2457d6" text-anchor="end">3%</text>

  <!-- Крива шуму (синя) -->
  <path d="M 570,180 Q 600,215 620,230 T 680,290 T 740,340 T 800,368 T 855,382" fill="none" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="570" cy="180" r="4" fill="#2457d6"/>
  <circle cx="620" cy="230" r="4" fill="#2457d6"/>
  <circle cx="680" cy="290" r="4" fill="#2457d6"/>
  <circle cx="740" cy="340" r="4" fill="#2457d6"/>
  <circle cx="800" cy="368" r="4" fill="#2457d6"/>
  <circle cx="855" cy="382" r="4" fill="#2457d6"/>

  <!-- Засічки Right Y (Час) -->
  <text x="883" y="385" font-size="12" fill="#c0392b" text-anchor="start">1.1 ms</text>
  <text x="883" y="335" font-size="12" fill="#c0392b" text-anchor="start">17.6 ms</text>
  <text x="883" y="275" font-size="12" fill="#c0392b" text-anchor="start">70.4 ms</text>
  <text x="883" y="185" font-size="12" fill="#c0392b" text-anchor="start">1.13 s</text>

  <!-- Крива часу (червона) -->
  <path d="M 570,382 Q 600,378 620,372 T 680,335 T 740,275 T 800,220 T 855,180" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="570" cy="382" r="4" fill="#c0392b"/>
  <circle cx="620" cy="372" r="4" fill="#c0392b"/>
  <circle cx="680" cy="335" r="4" fill="#c0392b"/>
  <circle cx="740" cy="275" r="4" fill="#c0392b"/>
  <circle cx="800" cy="220" r="4" fill="#c0392b"/>
  <circle cx="855" cy="180" r="4" fill="#c0392b"/>

  <!-- Легенда -->
  <rect x="515" y="460" width="395" height="55" rx="6" fill="white" stroke="#d0d7de" stroke-width="1"/>
  <line x1="530" y1="478" x2="555" y2="478" stroke="#2457d6" stroke-width="2.5"/>
  <circle cx="542.5" cy="478" r="3.5" fill="#2457d6"/>
  <text x="565" y="482" font-size="12" fill="#1a1a1a">Амплітуда шуму RMS (пропорційна 1 / √N)</text>

  <line x1="530" y1="500" x2="555" y2="500" stroke="#c0392b" stroke-width="2.5"/>
  <circle cx="542.5" cy="500" r="3.5" fill="#c0392b"/>
  <text x="565" y="504" font-size="12" fill="#1a1a1a">Загальний час конверсії T_total (зростає як N × T_CT)</text>
</svg>
