<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-main" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="32" font-size="18" font-weight="700" fill="#1a1a1a" text-anchor="middle">Обробка осцилограми згасаючих коливань п'єзодавача</text>
  <text x="480" y="54" font-size="13" fill="#6b7280" text-anchor="middle">Огинаюча енергії, порогове детектування та часове вікно (hold-off) для усунення хибних повторів</text>

  <!-- Main Container Panel -->
  <rect x="40" y="72" width="880" height="444" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="8"/>

  <!-- Upper Sub-panel (Analog Waveform V(t)) -->
  <rect x="120" y="92" width="770" height="280" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>

  <!-- Hold-off Window Shading in Upper Plot -->
  <rect x="230" y="98" width="390" height="268" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Impact Event Line (t0) -->
  <line x1="230" y1="98" x2="230" y2="366" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="230" y="86" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Момент поштовху t₀</text>

  <!-- Upper Plot Y-axis (Voltage V) -->
  <line x1="170" y1="360" x2="170" y2="108" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-main)"/>
  <text x="135" y="106" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">V (В)</text>
  <text x="160" y="284" font-size="12" fill="#6b7280" text-anchor="end">0 В</text>

  <!-- Upper Plot X-axis (Time t) -->
  <line x1="170" y1="280" x2="865" y2="280" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-main)"/>
  <text x="860" y="270" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">Час t</text>

  <!-- Threshold Level V_th -->
  <line x1="170" y1="215" x2="865" y2="215" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="160" y="219" font-size="12" font-weight="700" fill="#c0392b" text-anchor="end">V_th</text>
  <rect x="700" y="196" width="160" height="18" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="3"/>
  <text x="780" y="209" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Поріг спрацьовування V_th</text>

  <!-- Peak Amplitude Highlight (V_peak) -->
  <line x1="170" y1="125" x2="275" y2="125" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="160" y="129" font-size="12" font-weight="700" fill="#c0392b" text-anchor="end">V_peak</text>
  <circle cx="275" cy="125" r="5" fill="#c0392b"/>
  <rect x="235" y="102" width="150" height="18" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="3"/>
  <text x="310" y="115" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Амплітудний пік V_peak</text>

  <!-- Damped Oscillation Waveform V(t) -->
  <path d="M 170,280 L 230,280 C 240,280 260,125 275,125 C 290,125 315,345 325,345 C 335,345 360,185 375,185 C 390,185 415,325 425,325 C 435,325 460,225 475,225 C 490,225 515,310 525,310 C 535,310 560,252 575,252 C 590,252 615,298 625,298 C 635,298 660,267 675,267 C 690,267 715,285 725,285 C 735,285 760,278 775,278 L 840,280" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Energy Envelope Curve V_env(t) -->
  <path d="M 230,280 C 245,200 260,125 275,125 C 325,155 350,175 375,185 C 425,205 450,218 475,225 C 525,238 550,248 575,252 C 625,260 650,265 675,267 C 725,274 775,278 850,280" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="5,4"/>
  <rect x="375" y="132" width="165" height="18" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="3"/>
  <text x="457" y="145" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Огинаюча енергії V_env(t)</text>

  <!-- Secondary Oscillation Warning Callout -->
  <circle cx="375" cy="185" r="4.5" fill="#c0392b"/>
  <rect x="290" y="156" width="175" height="18" fill="#fdecea" stroke="#c0392b" stroke-width="1" rx="3"/>
  <text x="377" y="169" font-size="12" font-weight="700" fill="#c0392b" text-anchor="middle">Повторне V &gt; V_th (блокується)</text>

  <!-- Lower Sub-panel (Digital Trigger Output D_out) -->
  <rect x="120" y="385" width="770" height="115" fill="#ffffff" stroke="#d0d7de" stroke-width="1" rx="4"/>

  <!-- Lower Plot Y-axis (Digital Flag) -->
  <line x1="170" y1="485" x2="170" y2="398" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-main)"/>
  <text x="130" y="396" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">Прапор D_out</text>
  <text x="160" y="479" font-size="12" fill="#6b7280" text-anchor="end">0</text>
  <text x="160" y="419" font-size="12" font-weight="700" fill="#2457d6" text-anchor="end">1</text>

  <!-- Lower Plot X-axis (Time t) -->
  <line x1="170" y1="475" x2="865" y2="475" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-main)"/>
  <text x="860" y="465" font-size="12" font-weight="700" fill="#1a1a1a" text-anchor="end">Час t</text>

  <!-- Digital Signal D_out Trace -->
  <path d="M 170,475 L 230,475 L 230,415 L 620,415 L 620,475 L 850,475" fill="none" stroke="#2457d6" stroke-width="2.5"/>

  <!-- Hold-off Window Indicator in Lower Plot -->
  <line x1="230" y1="395" x2="230" y2="485" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="620" y1="395" x2="620" y2="485" stroke="#2457d6" stroke-width="1" stroke-dasharray="3,3"/>
  <rect x="340" y="432" width="170" height="22" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="4"/>
  <text x="425" y="447" font-size="12" font-weight="700" fill="#2457d6" text-anchor="middle">Вікно глушіння T_hold</text>

  <!-- Clean Detection Result Badge -->
  <rect x="660" y="423" width="160" height="38" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="4"/>
  <text x="740" y="438" font-size="12" font-weight="700" fill="#27ae60" text-anchor="middle">Один чистий імпульс</text>
  <text x="740" y="453" font-size="12" fill="#6b7280" text-anchor="middle">за один поштовх</text>
</svg>
