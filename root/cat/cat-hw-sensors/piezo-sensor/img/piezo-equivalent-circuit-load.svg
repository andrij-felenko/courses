<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
    <marker id="arr-gray" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#6b7280"/>
    </marker>
  </defs>

  <!-- Біла підкладка -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1a1a1a">Еквівалентна електрична схема п'єзодавача з навантаженням</text>
  <text x="480" y="54" text-anchor="middle" font-size="13" fill="#6b7280">Постійна часу &#964; = R_load &#183; (C_piezo + C_in) визначає швидкість спаду згенерованого заряду Q</text>

  <!-- Блок 1: П'єзоелемент -->
  <rect x="35" y="80" width="330" height="280" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="50" y="104" font-size="14" font-weight="700" fill="#1a1a1a">П'єзоелемент (еквівалентна модель)</text>
  <text x="50" y="122" font-size="12" fill="#6b7280">Власне джерело заряду, ємність та витік</text>

  <!-- Блок 2: Вимірювальна лінія -->
  <rect x="385" y="80" width="200" height="280" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="400" y="104" font-size="14" font-weight="700" fill="#1a1a1a">Вимірювальна лінія</text>
  <text x="400" y="122" font-size="12" fill="#6b7280">Кабель та вхідна ємність</text>

  <!-- Блок 3: Навантаження -->
  <rect x="605" y="80" width="320" height="280" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1" rx="8"/>
  <text x="620" y="104" font-size="14" font-weight="700" fill="#1a1a1a">Навантаження (прилад)</text>
  <text x="620" y="122" font-size="12" fill="#6b7280">Вхідний опір та вихідна напруга</text>

  <!-- Механічна сила F -->
  <line x1="95" y1="128" x2="95" y2="148" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="107" y="142" font-size="12" font-weight="700" fill="#c0392b">Сила F</text>

  <!-- Шини живлення / з'єднання -->
  <line x1="75" y1="160" x2="770" y2="160" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="75" y1="320" x2="770" y2="320" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Вузли на шинах -->
  <circle cx="95" cy="160" r="3" fill="#1a1a1a"/>
  <circle cx="195" cy="160" r="3" fill="#1a1a1a"/>
  <circle cx="295" cy="160" r="3" fill="#1a1a1a"/>
  <circle cx="485" cy="160" r="3" fill="#1a1a1a"/>
  <circle cx="675" cy="160" r="3" fill="#1a1a1a"/>

  <circle cx="95" cy="320" r="3" fill="#1a1a1a"/>
  <circle cx="195" cy="320" r="3" fill="#1a1a1a"/>
  <circle cx="295" cy="320" r="3" fill="#1a1a1a"/>
  <circle cx="485" cy="320" r="3" fill="#1a1a1a"/>
  <circle cx="675" cy="320" r="3" fill="#1a1a1a"/>

  <!-- Гілка 1: Джерело Q -->
  <line x1="95" y1="160" x2="95" y2="215" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="95" cy="240" r="25" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="95" y="246" text-anchor="middle" font-size="16" font-weight="700" fill="#2457d6">Q</text>
  <line x1="95" y1="265" x2="95" y2="320" stroke="#1a1a1a" stroke-width="2"/>
  <text x="95" y="342" text-anchor="middle" font-size="12" font-weight="700" fill="#2457d6">Джерело Q</text>
  <text x="95" y="355" text-anchor="middle" font-size="11" fill="#6b7280">Q = d_ij &#183; F</text>

  <!-- Гілка 2: C_piezo -->
  <line x1="195" y1="160" x2="195" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="175" y1="230" x2="215" y2="230" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="175" y1="250" x2="215" y2="250" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="195" y1="250" x2="195" y2="320" stroke="#1a1a1a" stroke-width="2"/>
  <text x="195" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">C_piezo</text>
  <text x="195" y="355" text-anchor="middle" font-size="11" fill="#6b7280">Власна ємність</text>

  <!-- Гілка 3: R_leak -->
  <line x1="295" y1="160" x2="295" y2="215" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="285" y="215" width="20" height="50" fill="white" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="295" y1="265" x2="295" y2="320" stroke="#1a1a1a" stroke-width="2"/>
  <text x="295" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">R_leak</text>
  <text x="295" y="355" text-anchor="middle" font-size="11" fill="#6b7280">Опір витоку</text>

  <!-- Гілка 4: C_in -->
  <line x1="485" y1="160" x2="485" y2="230" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="465" y1="230" x2="505" y2="230" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="465" y1="250" x2="505" y2="250" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="485" y1="250" x2="485" y2="320" stroke="#1a1a1a" stroke-width="2"/>
  <text x="485" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a1a">C_in</text>
  <text x="485" y="355" text-anchor="middle" font-size="11" fill="#6b7280">Ємність кабелю</text>

  <!-- Гілка 5: R_load -->
  <line x1="675" y1="160" x2="675" y2="215" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="665" y="215" width="20" height="50" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <line x1="675" y1="265" x2="675" y2="320" stroke="#1a1a1a" stroke-width="2"/>
  <text x="675" y="342" text-anchor="middle" font-size="13" font-weight="700" fill="#27ae60">R_load</text>
  <text x="675" y="355" text-anchor="middle" font-size="11" fill="#6b7280">Опір навантаження</text>

  <!-- Струми спаду заряду -->
  <path d="M 260 185 L 260 295" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arr-gray)"/>
  <text x="253" y="240" text-anchor="end" font-size="11" fill="#6b7280">i_leak</text>

  <path d="M 640 185 L 640 295" stroke="#27ae60" stroke-width="2" stroke-dasharray="4,3" marker-end="url(#arr-green)"/>
  <text x="633" y="240" text-anchor="end" font-size="11" font-weight="700" fill="#27ae60">i_load(t)</text>

  <!-- Вихідні клеми та напруга V_out -->
  <circle cx="770" cy="160" r="4" fill="#2457d6"/>
  <circle cx="770" cy="320" r="4" fill="#2457d6"/>
  <line x1="770" y1="290" x2="770" y2="190" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
  <text x="782" y="232" font-size="14" font-weight="700" fill="#2457d6">V_out(t)</text>
  <text x="782" y="250" font-size="12" font-weight="700" fill="#1a1a1a">V_max = Q / C_sum</text>
  <text x="782" y="266" font-size="11" fill="#6b7280">C_sum = C_piezo + C_in</text>

  <!-- Картки з формулами внизу -->
  <rect x="35" y="380" width="430" height="110" fill="#eaf0fd" stroke="#2457d6" stroke-width="1" rx="8"/>
  <text x="50" y="403" font-size="13" font-weight="700" fill="#2457d6">1. Амплітуда напруги та вплив ємностей</text>
  <text x="50" y="424" font-size="12" fill="#1a1a1a">&#8226; Згенерований заряд: Q = d_ij &#183; F (від сили F)</text>
  <text x="50" y="443" font-size="12" fill="#1a1a1a">&#8226; Сумарна ємність кола: C_sum = C_piezo + C_in</text>
  <text x="50" y="462" font-size="12" fill="#1a1a1a">&#8226; Пікова напруга: V_max = Q / (C_piezo + C_in)</text>
  <text x="50" y="480" font-size="11" fill="#6b7280">Ємність кабелю C_in зменшує вихідну амплітуду V_max</text>

  <rect x="495" y="380" width="430" height="110" fill="#e9f7ef" stroke="#27ae60" stroke-width="1" rx="8"/>
  <text x="510" y="403" font-size="13" font-weight="700" fill="#27ae60">2. Часовий спад сигналу (RC-фільтр низьких частот)</text>
  <text x="510" y="424" font-size="12" fill="#1a1a1a">&#8226; Постійна часу спаду: &#964; = R_load &#183; (C_piezo + C_in)</text>
  <text x="510" y="443" font-size="12" fill="#1a1a1a">&#8226; Закон розряду: V(t) = V_max &#183; e^(-t / &#964;)</text>
  <text x="510" y="462" font-size="12" fill="#1a1a1a">&#8226; Узгодження: R_load &gt;&gt; t_impact / C_sum запобігає спаду</text>
  <text x="510" y="480" font-size="11" fill="#6b7280">Для статичних вимірювань застосовують підсилювачі заряду</text>
</svg>
