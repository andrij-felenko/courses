<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-blue-start" markerWidth="9" markerHeight="9" refX="0.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M8,0 L0,4 L8,8 Z" fill="#2457d6"/>
    </marker>
  </defs>

  <!-- Підкладка -->
  <rect x="0" y="0" width="960" height="480" fill="white"/>

  <!-- Заголовок та підзаголовок -->
  <text x="480" y="34" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Еквівалентна схема п'єзодавача та RC-згасання сигналу</text>
  <text x="480" y="56" font-size="13" fill="#6b7280" text-anchor="middle">Опір навантаження R_L разом із ємністю C_p визначає постійну часу τ та швидкість спаду напруги</text>

  <!-- Панель 1: Еквівалентна схема -->
  <rect x="25" y="75" width="445" height="385" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="247" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Еквівалентна схема п'єзоелемента з навантаженням</text>

  <!-- Корпус п'єзодавача (пунктир) -->
  <rect x="45" y="115" width="265" height="295" rx="6" fill="#ffffff" stroke="#2457d6" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="177" y="135" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">П'єзодавач (еквівалент)</text>

  <!-- З'єднувальні лінії п'єзодавача -->
  <line x1="85" y1="185" x2="310" y2="185" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="85" y1="365" x2="310" y2="365" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Гілка 1: Джерело заряду -->
  <text x="85" y="158" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Джерело q(t)</text>
  <text x="85" y="172" font-size="12" fill="#6b7280" text-anchor="middle">(заряд)</text>
  <line x1="85" y1="185" x2="85" y2="248" stroke="#1a1a1a" stroke-width="2"/>
  <circle cx="85" cy="275" r="27" fill="#eaf0fd" stroke="#2457d6" stroke-width="2"/>
  <text x="85" y="280" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="middle">q(t)</text>
  <line x1="85" y1="302" x2="85" y2="365" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Гілка 2: Власна ємність C_p -->
  <text x="177" y="158" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">C_p</text>
  <text x="177" y="172" font-size="12" fill="#6b7280" text-anchor="middle">(ємність)</text>
  <line x1="177" y1="185" x2="177" y2="265" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="162" y1="265" x2="192" y2="265" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="162" y1="285" x2="192" y2="285" stroke="#1a1a1a" stroke-width="2.5"/>
  <line x1="177" y1="285" x2="177" y2="365" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Гілка 3: Опір витоку R_p -->
  <text x="265" y="158" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">R_p</text>
  <text x="265" y="172" font-size="12" fill="#6b7280" text-anchor="middle">(витік)</text>
  <line x1="265" y1="185" x2="265" y2="250" stroke="#1a1a1a" stroke-width="2"/>
  <rect x="256" y="250" width="18" height="50" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="265" y1="300" x2="265" y2="365" stroke="#1a1a1a" stroke-width="2"/>

  <!-- Виходи п'єзодавача -->
  <circle cx="310" cy="185" r="4" fill="#2457d6"/>
  <circle cx="310" cy="365" r="4" fill="#2457d6"/>

  <!-- Зовнішня лінія та шунт R_L -->
  <line x1="310" y1="185" x2="370" y2="185" stroke="#1a1a1a" stroke-width="2"/>
  <line x1="310" y1="365" x2="370" y2="365" stroke="#1a1a1a" stroke-width="2"/>

  <text x="370" y="158" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">R_L</text>
  <text x="370" y="172" font-size="12" fill="#27ae60" text-anchor="middle">(шунт)</text>
  <line x1="370" y1="185" x2="370" y2="250" stroke="#27ae60" stroke-width="2"/>
  <rect x="361" y="250" width="18" height="50" fill="#e9f7ef" stroke="#27ae60" stroke-width="2"/>
  <line x1="370" y1="300" x2="370" y2="365" stroke="#27ae60" stroke-width="2"/>

  <!-- Напруга u(t) -->
  <line x1="418" y1="195" x2="418" y2="355" stroke="#2457d6" stroke-width="1.5" marker-start="url(#arr-blue-start)" marker-end="url(#arr-blue)"/>
  <text x="428" y="280" font-size="14" font-weight="bold" fill="#2457d6" text-anchor="start">u(t)</text>

  <!-- Формула еквівалентного опору -->
  <text x="247" y="435" font-size="12" fill="#1a1a1a" text-anchor="middle">R_eq = R_p || R_L ≈ R_L  (оскільки R_p &gt;&gt; R_L)</text>


  <!-- Панель 2: Графік згасання -->
  <rect x="490" y="75" width="445" height="385" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>
  <text x="712" y="100" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Графік згасання напруги u(t)</text>

  <!-- Осі координат -->
  <line x1="550" y1="370" x2="900" y2="370" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <text x="905" y="374" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">t (час)</text>

  <line x1="550" y1="370" x2="550" y2="130" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <text x="550" y="120" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">u(t)</text>

  <!-- Рівень U_max -->
  <line x1="545" y1="160" x2="555" y2="160" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="540" y="164" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">U_max</text>
  <line x1="550" y1="160" x2="880" y2="160" stroke="#d0d7de" stroke-dasharray="3,3"/>

  <!-- Рівень 0,37 U_max -->
  <line x1="545" y1="293" x2="555" y2="293" stroke="#6b7280" stroke-width="1.5"/>
  <text x="540" y="297" font-size="12" fill="#6b7280" text-anchor="end">0,37 U_max</text>
  <line x1="550" y1="293" x2="760" y2="293" stroke="#d0d7de" stroke-dasharray="3,3"/>

  <!-- Крива 1: Малий R_L (швидкий спад, c0392b) -->
  <path d="M 550 160 C 565 220, 580 270, 600 293 C 620 316, 650 360, 720 368 L 880 370" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <line x1="600" y1="293" x2="600" y2="370" stroke="#c0392b" stroke-dasharray="4,4" stroke-width="1.5"/>
  <line x1="600" y1="367" x2="600" y2="373" stroke="#c0392b" stroke-width="1.5"/>
  <text x="600" y="390" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="middle">τ_1</text>
  <text x="600" y="410" font-size="12" fill="#c0392b" text-anchor="middle">τ_1 = R_L1 · C_p</text>
  <text x="600" y="426" font-size="12" fill="#c0392b" text-anchor="middle">(малий R_L)</text>
  <text x="605" y="210" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">Швидкий спад</text>

  <!-- Крива 2: Великий R_L (повільний спад, 27ae60) -->
  <path d="M 550 160 C 600 200, 660 250, 730 293 C 800 336, 840 355, 880 362" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <line x1="730" y1="293" x2="730" y2="370" stroke="#27ae60" stroke-dasharray="4,4" stroke-width="1.5"/>
  <line x1="730" y1="367" x2="730" y2="373" stroke="#27ae60" stroke-width="1.5"/>
  <text x="730" y="390" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="middle">τ_2</text>
  <text x="730" y="410" font-size="12" fill="#27ae60" text-anchor="middle">τ_2 = R_L2 · C_p</text>
  <text x="730" y="426" font-size="12" fill="#27ae60" text-anchor="middle">(великий R_L)</text>
  <text x="750" y="210" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">Повільний спад</text>
</svg>
