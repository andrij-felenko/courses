<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <rect x="25" y="25" width="800" height="430" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  
  <text x="425" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc">
    Температурно-вологісна матриця калібрування Figaro TGS
  </text>

  <!-- Схема 2D таблиці поправки -->
  <g transform="translate(60, 90)">
    <rect width="730" height="340" rx="8" fill="#0d1117" stroke="#30363d"/>

    <g transform="translate(30, 30)">
      <text x="0" y="20" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#58a6ff">
        Білінійна інтерполяція поправочного коефіцієнта alpha(T, RH)
      </text>
      <text x="0" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">
        Rs_compensated = Rs_measured / alpha(T, RH)
      </text>

      <!-- Сітка значень коефіцієнта alpha -->
      <g transform="translate(20, 60)">
        <!-- Шапка вологості -->
        <rect x="100" y="0" width="550" height="25" fill="#21262d"/>
        <text x="170" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e">RH = 35%</text>
        <text x="280" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e">RH = 50%</text>
        <text x="390" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e">RH = 65%</text>
        <text x="500" y="17" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#8b949e">RH = 85%</text>

        <!-- Рядок T = -10°C -->
        <rect x="0" y="30" width="650" height="24" fill="#161b22"/>
        <text x="50" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#58a6ff">-10 °C</text>
        <text x="170" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#c9d1d9">1.45</text>
        <text x="280" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#c9d1d9">1.40</text>
        <text x="390" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#c9d1d9">1.35</text>
        <text x="500" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#c9d1d9">1.30</text>

        <!-- Рядок T = 0°C -->
        <rect x="0" y="58" width="650" height="24" fill="#21262d"/>
        <text x="50" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#58a6ff">0 °C</text>
        <text x="170" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#c9d1d9">1.25</text>
        <text x="280" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#c9d1d9">1.20</text>
        <text x="390" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#c9d1d9">1.15</text>
        <text x="500" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#c9d1d9">1.10</text>

        <!-- Рядок T = 20°C (Базовий норматив) -->
        <rect x="0" y="86" width="650" height="24" fill="#1b4721"/>
        <text x="50" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#3fb950">20 °C (Norm)</text>
        <text x="170" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#c9d1d9">1.10</text>
        <text x="280" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#3fb950">1.00 (Еталон)</text>
        <text x="390" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#c9d1d9">0.92</text>
        <text x="500" y="102" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#c9d1d9">0.85</text>

        <!-- Рядок T = 40°C -->
        <rect x="0" y="114" width="650" height="24" fill="#21262d"/>
        <text x="50" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#f85149">40 °C</text>
        <text x="170" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#c9d1d9">0.88</text>
        <text x="280" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#c9d1d9">0.82</text>
        <text x="390" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#c9d1d9">0.76</text>
        <text x="500" y="130" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#c9d1d9">0.70</text>
      </g>
    </g>

    <!-- Пояснення внизу -->
    <g transform="translate(30, 245)">
      <text x="0" y="15" font-family="system-ui, sans-serif" font-size="11" fill="#3fb950">
        • Вбудована матриця дозволяє підтримувати точність вимірювання ±5% у діапазоні від -10 до +50 °C
      </text>
      <text x="0" y="35" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">
        • Рекомендується опитувати супутній мікрокліматичний сенсор (SHT30, BME280) для синхронної корекції
      </text>
    </g>
  </g>
</svg>