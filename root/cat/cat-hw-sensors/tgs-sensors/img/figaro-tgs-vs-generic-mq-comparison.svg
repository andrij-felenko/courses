<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <rect x="25" y="25" width="800" height="430" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  
  <text x="425" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc">
    Порівняння: Промисловий Figaro TGS проти аматорських модулів MQ
  </text>

  <!-- Таблиця порівняння характеристик -->
  <g transform="translate(60, 90)">
    <rect width="730" height="340" rx="8" fill="#0d1117" stroke="#30363d"/>

    <!-- Заголовки колонок -->
    <rect x="20" y="20" width="200" height="35" fill="#161b22"/>
    <text x="30" y="42" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#8b949e">Параметр</text>

    <rect x="220" y="20" width="240" height="35" fill="#1b4721"/>
    <text x="340" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#3fb950">Figaro TGS (Японія)</text>

    <rect x="460" y="20" width="250" height="35" fill="#3f1619"/>
    <text x="585" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#f85149">Типові китайські MQ</text>

    <!-- Рядок 1: Споживання -->
    <rect x="20" y="60" width="690" height="30" fill="#161b22"/>
    <text x="30" y="80" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">Потужність нагрівача</text>
    <text x="340" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#3fb950">280 мВт (15 мВт у MEMS)</text>
    <text x="585" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#f85149">750–900 мВт (гарячі)</text>

    <!-- Рядок 2: Дрейф нуля -->
    <rect x="20" y="95" width="690" height="30" fill="#21262d"/>
    <text x="30" y="115" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">Річний дрейф R0</text>
    <text x="340" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#3fb950">&lt; 2% на рік (висока стабільність)</text>
    <text x="585" y="115" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#f85149">15–30% на рік (постійний дрейф)</text>

    <!-- Рядок 3: Селективність -->
    <rect x="20" y="130" width="690" height="30" fill="#161b22"/>
    <text x="30" y="150" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">Селективність газу</text>
    <text x="340" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#3fb950">Вугільні фільтри спирту/VOC</text>
    <text x="585" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#f85149">Широка перехресна чутливість</text>

    <!-- Рядок 4: Термін служби -->
    <rect x="20" y="165" width="690" height="30" fill="#21262d"/>
    <text x="30" y="185" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">Робочий ресурс</text>
    <text x="340" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#3fb950">Понад 10 років</text>
    <text x="585" y="185" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#f85149">1–3 роки</text>

    <!-- Рядок 5: Сертифікація -->
    <rect x="20" y="200" width="690" height="30" fill="#161b22"/>
    <text x="30" y="220" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">Сертифікати безпеки</text>
    <text x="340" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#3fb950">UL1484, UL2034, EN50194, ATEX</text>
    <text x="585" y="220" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#f85149">Відсутні (тільки для хобі)</text>

    <!-- Рядок 6: Ціна -->
    <rect x="20" y="235" width="690" height="30" fill="#21262d"/>
    <text x="30" y="255" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">Ціновий діапазон</text>
    <text x="340" y="255" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">$15 – $40 (промисловий клас)</text>
    <text x="585" y="255" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">$1 – $3 (масовий ширвжиток)</text>
  </g>
</svg>