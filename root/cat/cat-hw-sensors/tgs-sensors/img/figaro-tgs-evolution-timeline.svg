<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <rect width="100%" height="100%" fill="#0d1117"/>
  <rect x="25" y="25" width="800" height="430" rx="12" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  
  <text x="425" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#f0f6fc">
    Технологічна еволюція давачів Figaro TGS (1968 — наш час)
  </text>

  <!-- 1. Спечений керамічний бісер (TGS 109 / TGS 8xx) -->
  <g transform="translate(50, 85)">
    <rect width="230" height="345" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="115" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#f0883e">
      1. Спечений бісер (1968)
    </text>
    <text x="115" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">
      TGS 109 / Серія 8xx
    </text>

    <!-- Рисунок бісеру -->
    <rect x="75" y="70" width="80" height="90" rx="40" fill="#21262d" stroke="#f0883e" stroke-width="2"/>
    <path d="M 95,85 L 95,145 M 135,85 L 135,145" stroke="#f2cc60" stroke-width="2" stroke-dasharray="3,2"/>
    <text x="115" y="120" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#f0f6fc">SnO2 бісер</text>

    <text x="20" y="195" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">• Керамічна кулька SnO2</text>
    <text x="20" y="217" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">• Внутрішня платинова спіраль</text>
    <text x="20" y="239" font-family="system-ui, sans-serif" font-size="11" fill="#f85149">• Споживання: 660–830 мВт</text>
    <text x="20" y="261" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">• Корпус TO-5 / Металева сітка</text>
    <text x="20" y="283" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">• Родоначальник родини MQ</text>
  </g>

  <!-- 2. Планарна товстоплівкова технологія (TGS 26xx) -->
  <g transform="translate(310, 85)">
    <rect width="230" height="345" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="115" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#58a6ff">
      2. Планарна плівка (1990-ті)
    </text>
    <text x="115" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">
      Серія TGS 26xx (2600, 2611)
    </text>

    <!-- Рисунок планарного чіпа -->
    <rect x="65" y="75" width="100" height="80" rx="4" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
    <rect x="75" y="85" width="80" height="30" fill="#388bfd" opacity="0.4"/>
    <text x="115" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#79c0ff">Al2O3 підкладка</text>
    <!-- Нагрівач зі зворотного боку -->
    <path d="M 80,135 L 150,135" stroke="#f0883e" stroke-width="3"/>
    <text x="115" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#f0883e">Pt нагрівач</text>

    <text x="20" y="195" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">• Кераміка оксиду алюмінію</text>
    <text x="20" y="217" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">• Золоті зустрічно-штирьові виводи</text>
    <text x="20" y="239" font-family="system-ui, sans-serif" font-size="11" fill="#3fb950">• Споживання: лише 280 мВт</text>
    <text x="20" y="261" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">• Вугільний фільтр парів спирту</text>
    <text x="20" y="283" font-family="system-ui, sans-serif" font-size="11" fill="#7ee787">• Ресурс роботи понад 10 років</text>
  </g>

  <!-- 3. КРЕМНІЄВИЙ МЕМС (TGS 8100) -->
  <g transform="translate(570, 85)">
    <rect width="230" height="345" rx="8" fill="#0d1117" stroke="#30363d"/>
    <text x="115" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#3fb950">
      3. Silicon MEMS (2010-ті)
    </text>
    <text x="115" y="46" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#8b949e">
      Мікронагрівач TGS 8100
    </text>

    <!-- Рисунок MEMS мікронагрівача -->
    <rect x="75" y="75" width="80" height="80" rx="6" fill="#1b4721" stroke="#3fb950" stroke-width="2"/>
    <rect x="95" y="95" width="40" height="40" rx="3" fill="#0d1117" stroke="#f2cc60"/>
    <circle cx="115" cy="115" r="8" fill="#da3633"/>
    <text x="115" y="119" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#ffffff">MEMS</text>

    <text x="20" y="195" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">• Мікронагрівальна мембрана Si</text>
    <text x="20" y="217" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">• Розмір корпусу: 3.2 x 2.5 мм</text>
    <text x="20" y="239" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#3fb950">• Споживання: лише 15 мВт!</text>
    <text x="20" y="261" font-family="system-ui, sans-serif" font-size="11" fill="#c9d1d9">• Імпульсний режим: &lt; 1 мВт</text>
    <text x="20" y="283" font-family="system-ui, sans-serif" font-size="11" fill="#7ee787">• Смартфони, IoT, акумулятори</text>
  </g>
</svg>