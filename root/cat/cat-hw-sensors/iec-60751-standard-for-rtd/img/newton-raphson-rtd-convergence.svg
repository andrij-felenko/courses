<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-black" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="520" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="38" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Збіжність методу Ньютона — Рафсона для рівняння Каллендара — Ван Дюзена</text>
  <text x="480" y="60" font-size="13" fill="#6b7280" text-anchor="middle">Квадратична збіжність дає точне значення температури t* за 2–3 ітерації в кріогенній зоні (t &lt; 0 °C)</text>

  <!-- Left Panel: Geometry plot -->
  <rect x="30" y="80" width="520" height="420" fill="#f4f6f8" rx="8" stroke="#d0d7de" stroke-width="1"/>
  <text x="50" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="start">Геометрична інтерпретація ітерацій</text>

  <!-- Axes & Grid -->
  <!-- Horizontal Axis f(t)=0 line -->
  <line x1="60" y1="340" x2="525" y2="340" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <text x="525" y="330" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="end">t (°C)</text>
  <text x="70" y="330" font-size="12" fill="#6b7280" text-anchor="start">f(t) = 0</text>

  <!-- Vertical Axis f(t) line -->
  <line x1="85" y1="420" x2="85" y2="120" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr-black)"/>
  <text x="95" y="132" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">f(t) = R(t) - R_m</text>

  <!-- Curve y = f(t) -->
  <path d="M 100,410 C 200,390 280,365 330,340 C 390,310 450,220 490,140" fill="none" stroke="#2457d6" stroke-width="3"/>
  <text x="495" y="135" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="start">y = f(t)</text>

  <!-- Initial guess t0 at x = 460 -->
  <line x1="460" y1="340" x2="460" y2="195" stroke="#c0392b" stroke-width="1" stroke-dasharray="4,4"/>
  <circle cx="460" cy="195" r="4" fill="#c0392b"/>
  <text x="470" y="190" font-size="12" fill="#c0392b" text-anchor="start">P₀(t₀, f(t₀))</text>

  <!-- Tangent line 1 at P0(460, 195) -->
  <line x1="480" y1="155" x2="365" y2="375" stroke="#c0392b" stroke-width="1.5"/>
  <text x="430" y="245" font-size="12" fill="#c0392b" text-anchor="start">дотична f'(t₀)</text>

  <!-- t0 tick & label on axis -->
  <circle cx="460" cy="340" r="4" fill="#c0392b"/>
  <text x="460" y="360" font-size="13" font-weight="bold" fill="#c0392b" text-anchor="middle">t₀</text>

  <!-- First iteration t1 at x = 382 -->
  <line x1="382" y1="340" x2="382" y2="310" stroke="#2457d6" stroke-width="1" stroke-dasharray="4,4"/>
  <circle cx="382" cy="310" r="4" fill="#2457d6"/>
  <text x="392" y="305" font-size="12" fill="#2457d6" text-anchor="start">P₁(t₁, f(t₁))</text>

  <!-- Tangent line 2 at P1(382, 310) -->
  <line x1="405" y1="290" x2="325" y2="355" stroke="#2457d6" stroke-width="1.5"/>
  <text x="315" y="300" font-size="12" fill="#2457d6" text-anchor="end">дотична f'(t₁)</text>

  <!-- t1 tick & label on axis -->
  <circle cx="382" cy="340" r="4" fill="#2457d6"/>
  <text x="382" y="360" font-size="13" font-weight="bold" fill="#2457d6" text-anchor="middle">t₁</text>

  <!-- True root t* at x = 330 -->
  <circle cx="330" cy="340" r="5" fill="#27ae60"/>
  <text x="330" y="380" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="middle">t* (точний корінь)</text>

  <!-- Second iteration t2 at x = 334 -->
  <circle cx="334" cy="340" r="3.5" fill="#27ae60"/>
  <text x="295" y="360" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">t₂ ≈ t*</text>

  <!-- Arrows on axis showing iteration progress -->
  <path d="M 450,348 Q 416,355 390,348" fill="none" stroke="#c0392b" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <path d="M 374,348 Q 354,354 340,348" fill="none" stroke="#2457d6" stroke-width="1.2" marker-end="url(#arr-blue)"/>

  <!-- Lower formula panel in Left Side -->
  <rect x="50" y="405" width="480" height="78" fill="#ffffff" rx="6" stroke="#d0d7de" stroke-width="1"/>
  <text x="65" y="426" font-size="12" font-weight="bold" fill="#1a1a1a" text-anchor="start">Формула ітерацій Ньютона — Рафсона:</text>
  <text x="65" y="446" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">tₖ₊₁ = tₖ - f(tₖ) / f'(tₖ)</text>
  <text x="65" y="466" font-size="12" fill="#6b7280" text-anchor="start">f(t) = R(t) - R_m,   f'(t) = R₀[A + 2Bt + C(4t³ - 300t²)]</text>

  <!-- Right Panel: Algorithm & Steps -->
  <rect x="570" y="80" width="360" height="420" fill="#f4f6f8" rx="8" stroke="#d0d7de" stroke-width="1"/>
  <text x="590" y="105" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="start">Алгоритм та обчислювальна збіжність</text>

  <!-- Step 1 Card -->
  <rect x="590" y="118" width="320" height="72" fill="#ffffff" rx="6" stroke="#d0d7de" stroke-width="1"/>
  <text x="605" y="138" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">1. Початкове наближення t₀</text>
  <text x="605" y="156" font-size="12" fill="#6b7280" text-anchor="start">Квадратичний розв'язок для розгону (t ≥ 0 °C):</text>
  <text x="605" y="174" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">t₀ = (-A + √(A² - 4B(1 - R_m/R₀))) / (2B)</text>

  <!-- Step 2 Card: Iteration Table -->
  <rect x="590" y="202" width="320" height="150" fill="#ffffff" rx="6" stroke="#d0d7de" stroke-width="1"/>
  <text x="605" y="222" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="start">2. Динаміка збіжності (при t = -100.00 °C)</text>

  <!-- Table Header -->
  <rect x="605" y="232" width="290" height="22" fill="#eaf0fd" rx="4"/>
  <text x="615" y="247" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">k</text>
  <text x="650" y="247" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">tₖ (°C)</text>
  <text x="740" y="247" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">Похибка |tₖ - t*|</text>

  <!-- Table Row 0 -->
  <text x="615" y="270" font-size="12" fill="#c0392b" text-anchor="start">0</text>
  <text x="650" y="270" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="start">-100.5432</text>
  <text x="740" y="270" font-size="12" fill="#c0392b" text-anchor="start">0.5432 °C  (543 mK)</text>

  <!-- Table Row 1 -->
  <text x="615" y="292" font-size="12" fill="#2457d6" text-anchor="start">1</text>
  <text x="650" y="292" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="start">-100.0008</text>
  <text x="740" y="292" font-size="12" fill="#2457d6" text-anchor="start">0.0008 °C  (0.8 mK)</text>

  <!-- Table Row 2 -->
  <rect x="605" y="304" width="290" height="38" fill="#e9f7ef" rx="4" stroke="#27ae60" stroke-width="1"/>
  <text x="615" y="320" font-size="12" fill="#27ae60" text-anchor="start">2</text>
  <text x="650" y="320" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">-100.0000</text>
  <text x="740" y="320" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">&lt; 0.0001 °C  (&lt; 0.1 mK)</text>
  <text x="615" y="336" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="start">✓ Збіжність досягнута всього за 2 ітерації</text>

  <!-- Step 3 Card: Practical MCU implementation -->
  <rect x="590" y="364" width="320" height="120" fill="#e9f7ef" rx="6" stroke="#27ae60" stroke-width="1.5"/>
  <text x="605" y="384" font-size="13" font-weight="bold" fill="#27ae60" text-anchor="start">3. Практична реалізація для MCU</text>
  <text x="605" y="404" font-size="12" fill="#1a1a1a" text-anchor="start">• Фіксована кількість ітерацій (N = 2)</text>
  <text x="605" y="424" font-size="12" fill="#1a1a1a" text-anchor="start">• Гарантований детермінований час виконання</text>
  <text x="605" y="444" font-size="12" fill="#1a1a1a" text-anchor="start">• Точність вища за вимоги класу AA (±0.1 °C)</text>
  <text x="605" y="464" font-size="12" fill="#6b7280" text-anchor="start">• Безпечно для RTOS (без нескінченних циклів)</text>
</svg>
