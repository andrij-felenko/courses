<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <!-- Arrow markers for current flow -->
    <marker id="arr-red" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#c0392b"/>
    </marker>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#2457d6"/>
    </marker>
    <marker id="arr-green" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#27ae60"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Title & Subtitle -->
  <text x="480" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#1a1a1a">Топології 2-, 3- та 4-провідного підключення RTD</text>
  <text x="480" y="62" text-anchor="middle" font-size="13" fill="#6b7280">Розділення струмових (I) та потенціальних (U) ліній усуває похибку від опору дротів R_L</text>

  <!-- ==================== CARD 1: 2-WIRE TOPOLOGY ==================== -->
  <g id="card-2wire">
    <!-- Card Outer Panel -->
    <rect x="25" y="78" width="290" height="440" rx="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

    <!-- Card Header Banner -->
    <path d="M 25,88 A 10,10 0 0 1 35,78 L 305,78 A 10,10 0 0 1 315,88 L 315,121 L 25,121 Z" fill="#fdecea"/>
    <line x1="25" y1="121" x2="315" y2="121" stroke="#c0392b" stroke-opacity="0.3" stroke-width="1"/>
    <text x="170" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#c0392b">2-провідна схема</text>
    <text x="170" y="115" text-anchor="middle" font-size="12" fill="#6b7280">Струм I та напруга U в одній лінії</text>

    <!-- Instrument Box -->
    <rect x="45" y="135" width="250" height="85" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="170" y="151" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Вимірювальний прилад</text>

    <!-- Internal Current Source & Voltmeter symbol -->
    <circle cx="130" cy="179" r="11" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="130" y="183" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">I</text>
    <circle cx="210" cy="179" r="11" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
    <text x="210" y="183" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">V</text>

    <!-- Internal Wiring -->
    <line x1="110" y1="220" x2="110" y2="160" stroke="#c0392b" stroke-width="1.5"/>
    <line x1="110" y1="160" x2="130" y2="160" stroke="#c0392b" stroke-width="1.5"/>
    <line x1="130" y1="160" x2="130" y2="168" stroke="#c0392b" stroke-width="1.5"/>
    <line x1="130" y1="160" x2="210" y2="160" stroke="#c0392b" stroke-width="1.5"/>
    <line x1="210" y1="160" x2="210" y2="168" stroke="#c0392b" stroke-width="1.5"/>

    <line x1="130" y1="190" x2="130" y2="200" stroke="#c0392b" stroke-width="1.5"/>
    <line x1="210" y1="190" x2="210" y2="200" stroke="#c0392b" stroke-width="1.5"/>
    <line x1="130" y1="200" x2="230" y2="200" stroke="#c0392b" stroke-width="1.5"/>
    <line x1="230" y1="200" x2="230" y2="220" stroke="#c0392b" stroke-width="1.5"/>

    <!-- Terminals -->
    <circle cx="110" cy="220" r="4" fill="#c0392b"/>
    <text x="96" y="224" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">T1</text>
    <circle cx="230" cy="220" r="4" fill="#c0392b"/>
    <text x="244" y="224" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">T2</text>

    <!-- Wire 1 (Left) -->
    <line x1="110" y1="220" x2="110" y2="268" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
    <line x1="110" y1="268" x2="110" y2="278" stroke="#c0392b" stroke-width="2"/>
    <rect x="98" y="278" width="24" height="30" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
    <path d="M 98,283 L 122,288 L 98,293 L 122,298 L 98,303" stroke="#c0392b" stroke-width="1" fill="none"/>
    <text x="130" y="297" text-anchor="start" font-size="12" font-weight="bold" fill="#c0392b">R_L1</text>
    <line x1="110" y1="308" x2="110" y2="403" stroke="#c0392b" stroke-width="2"/>
    <line x1="110" y1="403" x2="145" y2="403" stroke="#c0392b" stroke-width="2"/>

    <!-- Wire 2 (Right) -->
    <line x1="230" y1="220" x2="230" y2="278" stroke="#c0392b" stroke-width="2"/>
    <rect x="218" y="278" width="24" height="30" fill="#ffffff" stroke="#c0392b" stroke-width="1.5"/>
    <path d="M 218,283 L 242,288 L 218,293 L 242,298 L 218,303" stroke="#c0392b" stroke-width="1" fill="none"/>
    <text x="210" y="297" text-anchor="end" font-size="12" font-weight="bold" fill="#c0392b">R_L2</text>
    <line x1="230" y1="308" x2="230" y2="338" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
    <line x1="230" y1="338" x2="230" y2="403" stroke="#c0392b" stroke-width="2"/>
    <line x1="230" y1="403" x2="195" y2="403" stroke="#c0392b" stroke-width="2"/>

    <!-- Wire Zone Label -->
    <text x="170" y="247" text-anchor="middle" font-size="12" fill="#c0392b">I_ex та U</text>
    <text x="170" y="262" text-anchor="middle" font-size="12" fill="#c0392b">на R_L1, R_L2</text>

    <!-- Sensor Box -->
    <rect x="45" y="361" width="250" height="75" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="170" y="378" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">Датчик (RTD)</text>

    <!-- Sensor Resistor R_TD -->
    <rect x="145" y="393" width="50" height="20" fill="#fdecea" stroke="#c0392b" stroke-width="1.5"/>
    <text x="170" y="408" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">R_TD</text>

    <!-- Bottom Summary Box -->
    <rect x="32" y="448" width="276" height="58" rx="6" fill="#fdecea" stroke="#c0392b" stroke-opacity="0.4"/>
    <text x="170" y="467" text-anchor="middle" font-size="12" font-weight="bold" fill="#c0392b">R_вимір = R_TD + R_L1 + R_L2</text>
    <text x="170" y="484" text-anchor="middle" font-size="12" fill="#1a1a1a">Опір дротів повністю входить</text>
    <text x="170" y="499" text-anchor="middle" font-size="12" fill="#1a1a1a">у результат вимірювання</text>
  </g>

  <!-- ==================== CARD 2: 3-WIRE TOPOLOGY ==================== -->
  <g id="card-3wire">
    <!-- Card Outer Panel -->
    <rect x="335" y="78" width="290" height="440" rx="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

    <!-- Card Header Banner -->
    <path d="M 335,88 A 10,10 0 0 1 345,78 L 615,78 A 10,10 0 0 1 625,88 L 625,121 L 335,121 Z" fill="#eaf0fd"/>
    <line x1="335" y1="121" x2="625" y2="121" stroke="#2457d6" stroke-opacity="0.3" stroke-width="1"/>
    <text x="480" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#2457d6">3-провідна схема</text>
    <text x="480" y="115" text-anchor="middle" font-size="12" fill="#6b7280">Мостова компенсація опору R_L</text>

    <!-- Instrument Box -->
    <rect x="355" y="135" width="250" height="85" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="480" y="151" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Вимірювальний прилад</text>

    <!-- Internal Bridge / ADC Symbol -->
    <circle cx="435" cy="179" r="11" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="435" y="183" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">I</text>
    <circle cx="525" cy="179" r="11" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
    <text x="525" y="183" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">V</text>

    <!-- Internal Wiring -->
    <line x1="390" y1="220" x2="390" y2="160" stroke="#2457d6" stroke-width="1.5"/>
    <line x1="390" y1="160" x2="435" y2="160" stroke="#2457d6" stroke-width="1.5"/>
    <line x1="435" y1="160" x2="435" y2="168" stroke="#2457d6" stroke-width="1.5"/>
    <line x1="435" y1="160" x2="525" y2="160" stroke="#2457d6" stroke-width="1.5"/>
    <line x1="525" y1="160" x2="525" y2="168" stroke="#2457d6" stroke-width="1.5"/>

    <line x1="435" y1="190" x2="435" y2="200" stroke="#2457d6" stroke-width="1.5"/>
    <line x1="435" y1="200" x2="570" y2="200" stroke="#2457d6" stroke-width="1.5"/>
    <line x1="570" y1="200" x2="570" y2="220" stroke="#2457d6" stroke-width="1.5"/>

    <line x1="480" y1="220" x2="480" y2="200" stroke="#6b7280" stroke-width="1.5"/>
    <line x1="480" y1="200" x2="525" y2="200" stroke="#6b7280" stroke-width="1.5"/>
    <line x1="525" y1="200" x2="525" y2="190" stroke="#6b7280" stroke-width="1.5"/>

    <!-- Terminals -->
    <circle cx="390" cy="220" r="4" fill="#2457d6"/>
    <text x="376" y="224" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">T1</text>
    <circle cx="480" cy="220" r="4" fill="#6b7280"/>
    <text x="466" y="224" text-anchor="end" font-size="12" font-weight="bold" fill="#6b7280">T2</text>
    <circle cx="570" cy="220" r="4" fill="#2457d6"/>
    <text x="584" y="224" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">T3</text>

    <!-- Wire 1 (Left) -->
    <line x1="390" y1="220" x2="390" y2="268" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
    <line x1="390" y1="268" x2="390" y2="278" stroke="#2457d6" stroke-width="2"/>
    <rect x="378" y="278" width="24" height="30" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
    <path d="M 378,283 L 402,288 L 378,293 L 402,298 L 378,303" stroke="#2457d6" stroke-width="1" fill="none"/>
    <text x="368" y="297" text-anchor="end" font-size="12" font-weight="bold" fill="#2457d6">R_L1</text>
    <line x1="390" y1="308" x2="390" y2="403" stroke="#2457d6" stroke-width="2"/>
    <line x1="390" y1="403" x2="455" y2="403" stroke="#2457d6" stroke-width="2"/>

    <!-- Wire 2 (Middle - Sense line) -->
    <line x1="480" y1="220" x2="480" y2="278" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
    <rect x="468" y="278" width="24" height="30" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
    <path d="M 468,283 L 492,288 L 468,293 L 492,298 L 468,303" stroke="#6b7280" stroke-width="1" fill="none"/>
    <text x="498" y="287" text-anchor="start" font-size="12" font-weight="bold" fill="#6b7280">R_L2</text>
    <text x="498" y="301" text-anchor="start" font-size="12" fill="#6b7280">(I ≈ 0)</text>
    <line x1="480" y1="308" x2="480" y2="343" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="480" y1="343" x2="420" y2="343" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="420" y1="343" x2="420" y2="403" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
    <circle cx="420" cy="403" r="3.5" fill="#1a1a1a"/>

    <!-- Wire 3 (Right) -->
    <line x1="570" y1="220" x2="570" y2="278" stroke="#2457d6" stroke-width="2"/>
    <rect x="558" y="278" width="24" height="30" fill="#ffffff" stroke="#2457d6" stroke-width="1.5"/>
    <path d="M 558,283 L 582,288 L 558,293 L 582,298 L 558,303" stroke="#2457d6" stroke-width="1" fill="none"/>
    <text x="590" y="297" text-anchor="start" font-size="12" font-weight="bold" fill="#2457d6">R_L3</text>
    <line x1="570" y1="308" x2="570" y2="338" stroke="#2457d6" stroke-width="2" marker-end="url(#arr-blue)"/>
    <line x1="570" y1="338" x2="570" y2="403" stroke="#2457d6" stroke-width="2"/>
    <line x1="570" y1="403" x2="505" y2="403" stroke="#2457d6" stroke-width="2"/>

    <!-- Sensor Box -->
    <rect x="355" y="361" width="250" height="75" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="480" y="378" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">Датчик (RTD)</text>

    <!-- Sensor Resistor R_TD -->
    <rect x="455" y="393" width="50" height="20" fill="#eaf0fd" stroke="#2457d6" stroke-width="1.5"/>
    <text x="480" y="408" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a1a1a">R_TD</text>

    <!-- Bottom Summary Box -->
    <rect x="342" y="448" width="276" height="58" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-opacity="0.4"/>
    <text x="480" y="467" text-anchor="middle" font-size="12" font-weight="bold" fill="#2457d6">Компенсація за умови R_L1 = R_L3</text>
    <text x="480" y="484" text-anchor="middle" font-size="12" fill="#1a1a1a">R_L1 та R_L3 у різних плечах моста;</text>
    <text x="480" y="499" text-anchor="middle" font-size="12" fill="#1a1a1a">дисбаланс дротів дає похибку</text>
  </g>

  <!-- ==================== CARD 3: 4-WIRE TOPOLOGY ==================== -->
  <g id="card-4wire">
    <!-- Card Outer Panel -->
    <rect x="645" y="78" width="290" height="440" rx="10" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5"/>

    <!-- Card Header Banner -->
    <path d="M 645,88 A 10,10 0 0 1 655,78 L 925,78 A 10,10 0 0 1 935,88 L 935,121 L 645,121 Z" fill="#e9f7ef"/>
    <line x1="645" y1="121" x2="935" y2="121" stroke="#27ae60" stroke-opacity="0.3" stroke-width="1"/>
    <text x="790" y="99" text-anchor="middle" font-size="15" font-weight="bold" fill="#27ae60">4-провідна схема</text>
    <text x="790" y="115" text-anchor="middle" font-size="12" fill="#6b7280">Повне розділення ліній I та U</text>

    <!-- Instrument Box -->
    <rect x="665" y="135" width="250" height="85" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="790" y="151" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a1a1a">Вимірювальний прилад</text>

    <!-- Internal Current Source & Voltmeter separation -->
    <circle cx="720" cy="179" r="11" fill="#e9f7ef" stroke="#27ae60" stroke-width="1.5"/>
    <text x="720" y="183" text-anchor="middle" font-size="12" font-weight="bold" fill="#27ae60">I</text>
    <circle cx="790" cy="179" r="11" fill="#f4f6f8" stroke="#6b7280" stroke-width="1.5"/>
    <text x="790" y="183" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">V</text>

    <!-- Lines from internals to terminals -->
    <line x1="695" y1="220" x2="695" y2="158" stroke="#27ae60" stroke-width="1.5"/>
    <line x1="695" y1="158" x2="720" y2="158" stroke="#27ae60" stroke-width="1.5"/>
    <line x1="720" y1="158" x2="720" y2="168" stroke="#27ae60" stroke-width="1.5"/>

    <line x1="755" y1="220" x2="755" y2="168" stroke="#6b7280" stroke-width="1.5"/>
    <line x1="755" y1="168" x2="790" y2="168" stroke="#6b7280" stroke-width="1.5"/>

    <line x1="825" y1="220" x2="825" y2="190" stroke="#6b7280" stroke-width="1.5"/>
    <line x1="825" y1="190" x2="790" y2="190" stroke="#6b7280" stroke-width="1.5"/>

    <line x1="885" y1="220" x2="885" y2="200" stroke="#27ae60" stroke-width="1.5"/>
    <line x1="885" y1="200" x2="720" y2="200" stroke="#27ae60" stroke-width="1.5"/>
    <line x1="720" y1="200" x2="720" y2="190" stroke="#27ae60" stroke-width="1.5"/>

    <!-- Terminals -->
    <circle cx="695" cy="220" r="4" fill="#27ae60"/>
    <text x="681" y="224" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">I+</text>
    <circle cx="755" cy="220" r="4" fill="#6b7280"/>
    <text x="741" y="224" text-anchor="end" font-size="12" font-weight="bold" fill="#6b7280">U+</text>
    <circle cx="825" cy="220" r="4" fill="#6b7280"/>
    <text x="839" y="224" text-anchor="start" font-size="12" font-weight="bold" fill="#6b7280">U-</text>
    <circle cx="885" cy="220" r="4" fill="#27ae60"/>
    <text x="899" y="224" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">I-</text>

    <!-- Connecting Wires -->
    <!-- Wire 1 (Force I+) -->
    <line x1="695" y1="220" x2="695" y2="268" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
    <line x1="695" y1="268" x2="695" y2="278" stroke="#27ae60" stroke-width="2"/>
    <rect x="683" y="278" width="24" height="30" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
    <path d="M 683,283 L 707,288 L 683,293 L 707,298 L 683,303" stroke="#27ae60" stroke-width="1" fill="none"/>
    <text x="677" y="297" text-anchor="end" font-size="12" font-weight="bold" fill="#27ae60">R_L1</text>
    <line x1="695" y1="308" x2="695" y2="403" stroke="#27ae60" stroke-width="2"/>
    <line x1="695" y1="403" x2="765" y2="403" stroke="#27ae60" stroke-width="2"/>

    <!-- Wire 2 (Sense U+) -->
    <line x1="755" y1="220" x2="755" y2="278" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
    <rect x="743" y="278" width="24" height="30" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
    <path d="M 743,283 L 767,288 L 743,293 L 767,298 L 743,303" stroke="#6b7280" stroke-width="1" fill="none"/>
    <text x="712" y="297" text-anchor="start" font-size="12" font-weight="bold" fill="#6b7280">R_L2</text>
    <line x1="755" y1="308" x2="755" y2="343" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="755" y1="343" x2="735" y2="343" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="735" y1="343" x2="735" y2="403" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
    <circle cx="735" cy="403" r="3.5" fill="#1a1a1a"/>

    <!-- Wire 3 (Sense U-) -->
    <line x1="825" y1="220" x2="825" y2="278" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
    <rect x="813" y="278" width="24" height="30" fill="#ffffff" stroke="#6b7280" stroke-width="1.5"/>
    <path d="M 813,283 L 837,288 L 813,293 L 837,298 L 813,303" stroke="#6b7280" stroke-width="1" fill="none"/>
    <text x="845" y="297" text-anchor="start" font-size="12" font-weight="bold" fill="#6b7280">R_L3</text>
    <line x1="825" y1="308" x2="825" y2="343" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="845" y1="343" x2="825" y2="343" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
    <line x1="845" y1="343" x2="845" y2="403" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3"/>
    <circle cx="845" cy="403" r="3.5" fill="#1a1a1a"/>

    <!-- Wire 4 (Force I-) -->
    <line x1="885" y1="220" x2="885" y2="278" stroke="#27ae60" stroke-width="2"/>
    <rect x="873" y="278" width="24" height="30" fill="#ffffff" stroke="#27ae60" stroke-width="1.5"/>
    <path d="M 873,283 L 897,288 L 873,293 L 897,298 L 873,303" stroke="#27ae60" stroke-width="1" fill="none"/>
    <text x="903" y="297" text-anchor="start" font-size="12" font-weight="bold" fill="#27ae60">R_L4</text>
    <line x1="885" y1="308" x2="885" y2="338" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
    <line x1="885" y1="338" x2="885" y2="403" stroke="#27ae60" stroke-width="2"/>
    <line x1="885" y1="403" x2="815" y2="403" stroke="#27ae60" stroke-width="2"/>

    <!-- Sensor Box -->
    <rect x="665" y="361" width="250" height="75" rx="6" fill="#ffffff" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="790" y="378" text-anchor="middle" font-size="12" font-weight="bold" fill="#6b7280">Датчик (RTD)</text>

    <!-- Sensor Resistor R_TD -->
