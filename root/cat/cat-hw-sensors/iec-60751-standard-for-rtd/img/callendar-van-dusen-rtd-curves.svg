  <path d="M120,387.7 L186.7,359.8 L253.3,333.3 L320,307.7 L386.7,282.8 L453.3,258.6 L520,235.3 L586.7,212.7 L653.3,190.9 L720,169.8 L786.7,149.5 L820,139.7" stroke="#2457d6" stroke-width="2.5" fill="none" />

