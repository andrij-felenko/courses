  <path d="M280,253.3 L335,229.6 L390,206.2 L445,183.0 L500,160.0" stroke="#2457d6" stroke-width="2" fill="none" />

  <text x="315" y="265" font-size="12" fill="#1a1a1a">Вплив 4-го ступеня</text>
  <path d="M340,253 L305,237" stroke="#1a1a1a" marker-end="url(#arr)" fill="none"/>

  <text x="410" y="235" font-size="12" fill="#6b7280">Без 4-го ступеня</text>
