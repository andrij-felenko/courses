    <text x="386.7" y="425">200</text>
    <text x="520" y="425">400</text>
    <text x="653.3" y="425">600</text>
    <text x="820" y="425">850</text>
  </g>
  <g font-size="12" fill="#6b7280" text-anchor="end">
