  <text x="480" y="40" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Характеристика термоопору Pt100 (IEC 60751)</text>
  <text x="480" y="65" font-size="13" fill="#6b7280" text-anchor="middle">Лінійне наближення втрачає точність на краях діапазону, а у від'ємній зоні проявляється вплив 4-го ступеня</text>

  <path d="M120,333.3 L820,333.3 M120,266.7 L820,266.7 M120,200 L820,200 M120,133.3 L820,133.3" stroke="#f4f6f8" stroke-width="2" fill="none" />
  <path d="M186.7,400 L186.7,110 M253.3,400 L253.3,110 M386.7,400 L386.7,110 M520,400 L520,110 M653.3,400 L653.3,110 M820,400 L820,110" stroke="#f4f6f8" stroke-width="2" fill="none" />

