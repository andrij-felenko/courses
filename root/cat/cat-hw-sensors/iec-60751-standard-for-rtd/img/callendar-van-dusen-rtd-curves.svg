  <path d="M120,400 L120,110" stroke="#d0d7de" stroke-width="2" fill="none" />

  <path d="M120,400 L120,405 M186.7,400 L186.7,405 M253.3,400 L253.3,405 M386.7,400 L386.7,405 M520,400 L520,405 M653.3,400 L653.3,405 M820,400 L820,405" stroke="#1a1a1a" stroke-width="1" fill="none" />
  <path d="M115,400 L120,400 M115,333.3 L120,333.3 M115,266.7 L120,266.7 M115,200 L120,200 M115,133.3 L120,133.3" stroke="#1a1a1a" stroke-width="1" fill="none" />

