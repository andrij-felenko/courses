<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7.5" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 Z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="540" fill="white"/>
  
  <!-- Заголовок і підзаголовок -->
  <text x="480" y="32" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Залежність допустимої похибки RTD від температури (IEC 60751)</text>
  <text x="480" y="52" font-size="13" fill="#6b7280" text-anchor="middle">Граничне відхилення |ΔT| зростає з відхиленням від 0 °C та визначається класом точності</text>
  
  <!-- Права панель з формулами -->
  <rect x="745" y="80" width="195" height="410" rx="8" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>
  <text x="842" y="104" font-size="14" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Класи допуску</text>
  <text x="842" y="122" font-size="11" fill="#6b7280" text-anchor="middle">стандарт IEC 60751</text>
  <line x1="760" y1="132" x2="925" y2="132" stroke="#d0d7de" stroke-width="1"/>
  
  <!-- Картка AA -->
  <rect x="757" y="142" width="171" height="74" rx="6" fill="#e9f7ef" stroke="#27ae60" stroke-width="1"/>
  <text x="767" y="160" font-size="13" font-weight="bold" fill="#27ae60">Клас AA</text>
  <text x="767" y="178" font-size="11" font-weight="bold" fill="#1a1a1a">|ΔT| = ±(0.10 + 0.0017·|t|)</text>
  <text x="767" y="196" font-size="11" fill="#6b7280">Діапазон: -50…+250 °C</text>
  
  <!-- Картка A -->
  <rect x="757" y="226" width="171" height="74" rx="6" fill="#eaf0fd" stroke="#2457d6" stroke-width="1"/>
  <text x="767" y="244" font-size="13" font-weight="bold" fill="#2457d6">Клас A</text>
  <text x="767" y="262" font-size="11" font-weight="bold" fill="#1a1a1a">|ΔT| = ±(0.15 + 0.0020·|t|)</text>
  <text x="767" y="280" font-size="11" fill="#6b7280">Діапазон: -100…+450 °C</text>
  
  <!-- Картка B -->
  <rect x="757" y="310" width="171" height="74" rx="6" fill="#fffbe6" stroke="#d97706" stroke-width="1"/>
  <text x="767" y="328" font-size="13" font-weight="bold" fill="#d97706">Клас B (промисловий)</text>
  <text x="767" y="346" font-size="11" font-weight="bold" fill="#1a1a1a">|ΔT| = ±(0.30 + 0.0050·|t|)</text>
  <text x="767" y="364" font-size="11" fill="#6b7280">Діапазон: -196…+600 °C</text>
  
  <!-- Картка C -->
  <rect x="757" y="394" width="171" height="74" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
  <text x="767" y="412" font-size="13" font-weight="bold" fill="#c0392b">Клас C (базовий)</text>
  <text x="767" y="430" font-size="11" font-weight="bold" fill="#1a1a1a">|ΔT| = ±(0.60 + 0.0100·|t|)</text>
  <text x="767" y="448" font-size="11" fill="#6b7280">Діапазон: -196…+600 °C</text>

  <!-- Сітка за значеннями похибки (горизонтальні лінії) -->
  <line x1="110" y1="410" x2="710" y2="410" stroke="#e5e7eb" stroke-dasharray="3,3" stroke-width="1"/>
  <line x1="110" y1="370" x2="710" y2="370" stroke="#e5e7eb" stroke-dasharray="3,3" stroke-width="1"/>
  <line x1="110" y1="330" x2="710" y2="330" stroke="#e5e7eb" stroke-dasharray="3,3" stroke-width="1"/>
  <line x1="110" y1="290" x2="710" y2="290" stroke="#e5e7eb" stroke-dasharray="3,3" stroke-width="1"/>
  <line x1="110" y1="250" x2="710" y2="250" stroke="#e5e7eb" stroke-dasharray="3,3" stroke-width="1"/>
  <line x1="110" y1="210" x2="710" y2="210" stroke="#e5e7eb" stroke-dasharray="3,3" stroke-width="1"/>
  <line x1="110" y1="170" x2="710" y2="170" stroke="#e5e7eb" stroke-dasharray="3,3" stroke-width="1"/>
  <line x1="110" y1="130" x2="710" y2="130" stroke="#e5e7eb" stroke-dasharray="3,3" stroke-width="1"/>

  <!-- Сітка за температурою (вертикальні лінії) -->
  <line x1="185" y1="110" x2="185" y2="450" stroke="#e5e7eb" stroke-dasharray="3,3" stroke-width="1"/>
  <line x1="335" y1="110" x2="335" y2="450" stroke="#e5e7eb" stroke-dasharray="3,3" stroke-width="1"/>
  <line x1="410" y1="110" x2="410" y2="450" stroke="#e5e7eb" stroke-dasharray="3,3" stroke-width="1"/>
  <line x1="485" y1="110" x2="485" y2="450" stroke="#e5e7eb" stroke-dasharray="3,3" stroke-width="1"/>
  <line x1="560" y1="110" x2="560" y2="450" stroke="#e5e7eb" stroke-dasharray="3,3" stroke-width="1"/>
  <line x1="635" y1="110" x2="635" y2="450" stroke="#e5e7eb" stroke-dasharray="3,3" stroke-width="1"/>
  <line x1="710" y1="110" x2="710" y2="450" stroke="#e5e7eb" stroke-dasharray="3,3" stroke-width="1"/>

  <!-- Опорна лінія 0 °C -->
  <line x1="260" y1="110" x2="260" y2="450" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Осі координат -->
  <line x1="110" y1="450" x2="725" y2="450" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="110" y1="450" x2="110" y2="95" stroke="#1a1a1a" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Засічки X -->
  <line x1="110" y1="450" x2="110" y2="454" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="185" y1="450" x2="185" y2="454" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="260" y1="450" x2="260" y2="454" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="335" y1="450" x2="335" y2="454" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="410" y1="450" x2="410" y2="454" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="485" y1="450" x2="485" y2="454" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="560" y1="450" x2="560" y2="454" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="635" y1="450" x2="635" y2="454" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="710" y1="450" x2="710" y2="454" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Написи засічок X -->
  <text x="110" y="468" font-size="11" fill="#6b7280" text-anchor="middle">-200</text>
  <text x="185" y="468" font-size="11" fill="#6b7280" text-anchor="middle">-100</text>
  <text x="260" y="468" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0</text>
  <text x="335" y="468" font-size="11" fill="#6b7280" text-anchor="middle">100</text>
  <text x="410" y="468" font-size="11" fill="#6b7280" text-anchor="middle">200</text>
  <text x="485" y="468" font-size="11" fill="#6b7280" text-anchor="middle">300</text>
  <text x="560" y="468" font-size="11" fill="#6b7280" text-anchor="middle">400</text>
  <text x="635" y="468" font-size="11" fill="#6b7280" text-anchor="middle">500</text>
  <text x="710" y="468" font-size="11" fill="#6b7280" text-anchor="middle">600</text>

  <!-- Підпис осі X -->
  <text x="410" y="488" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Температура t (°C)</text>

  <!-- Засічки Y -->
  <line x1="106" y1="450" x2="110" y2="450" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="106" y1="410" x2="110" y2="410" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="106" y1="370" x2="110" y2="370" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="106" y1="330" x2="110" y2="330" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="106" y1="290" x2="110" y2="290" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="106" y1="250" x2="110" y2="250" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="106" y1="210" x2="110" y2="210" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="106" y1="170" x2="110" y2="170" stroke="#1a1a1a" stroke-width="1.5"/>
  <line x1="106" y1="130" x2="110" y2="130" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Написи засічок Y -->
  <text x="98" y="454" font-size="11" fill="#6b7280" text-anchor="end">0.0</text>
  <text x="98" y="414" font-size="11" fill="#6b7280" text-anchor="end">0.5</text>
  <text x="98" y="374" font-size="11" fill="#6b7280" text-anchor="end">1.0</text>
  <text x="98" y="334" font-size="11" fill="#6b7280" text-anchor="end">1.5</text>
  <text x="98" y="294" font-size="11" fill="#6b7280" text-anchor="end">2.0</text>
  <text x="98" y="254" font-size="11" fill="#6b7280" text-anchor="end">2.5</text>
  <text x="98" y="214" font-size="11" fill="#6b7280" text-anchor="end">3.0</text>
  <text x="98" y="174" font-size="11" fill="#6b7280" text-anchor="end">3.5</text>
  <text x="98" y="134" font-size="11" fill="#6b7280" text-anchor="end">4.0</text>

  <!-- Підпис осі Y -->
  <text x="110" y="82" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Допустима похибка |ΔT| (°C)</text>

  <!-- Криві класів -->
  <!-- Клас C -->
  <polyline points="110,242 260,402 515,130" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="110" cy="242" r="4" fill="#c0392b"/>
  <circle cx="515" cy="130" r="4" fill="#c0392b"/>
  <text x="445" y="155" font-size="12" font-weight="bold" fill="#c0392b">Клас C</text>

  <!-- Клас B -->
  <polyline points="110,346 260,426 710,186" fill="none" stroke="#d97706" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="110" cy="346" r="4" fill="#d97706"/>
  <circle cx="710" cy="186" r="4" fill="#d97706"/>
  <text x="640" y="205" font-size="12" font-weight="bold" fill="#d97706">Клас B</text>

  <!-- Клас A -->
  <polyline points="185,422 260,438 597.5,366" fill="none" stroke="#2457d6" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="185" cy="422" r="4" fill="#2457d6"/>
  <circle cx="597.5" cy="366" r="4" fill="#2457d6"/>
  <text x="535" y="350" font-size="12" font-weight="bold" fill="#2457d6">Клас A</text>

  <!-- Клас AA -->
  <polyline points="222.5,435.2 260,442 447.5,408" fill="none" stroke="#27ae60" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="222.5" cy="435.2" r="4" fill="#27ae60"/>
  <circle cx="447.5" cy="408" r="4" fill="#27ae60"/>
  <text x="400" y="396" font-size="12" font-weight="bold" fill="#27ae60">Клас AA</text>

  <!-- Примітка знизу -->
  <text x="110" y="515" font-size="11" fill="#6b7280">* При t = 0 °C похибки класів: AA = ±0.10 °C, A = ±0.15 °C, B = ±0.30 °C, C = ±0.60 °C</text>
</svg>
