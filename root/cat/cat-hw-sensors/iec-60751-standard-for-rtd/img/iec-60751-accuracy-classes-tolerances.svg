<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr-red" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M1,1 L7,4 L1,7 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="960" height="540" fill="white"/>

  <!-- Header -->
  <text x="480" y="28" font-size="18" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Допустимі відхилення температури за IEC 60751</text>
  <text x="480" y="48" font-size="13" fill="#6b7280" text-anchor="middle">Звуження допуску похибки Δt біля 0 °C та його розширення на краях діапазону</text>

  <!-- Plot Area Background -->
  <rect x="110" y="75" width="560" height="375" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1"/>

  <!-- Vertical Grid Lines -->
  <line x1="180" y1="75" x2="180" y2="450" stroke="#e1e4e8" stroke-dasharray="4,4"/>
  <line x1="250" y1="75" x2="250" y2="450" stroke="#a0aab5" stroke-dasharray="4,4" stroke-width="1.5"/>
  <line x1="320" y1="75" x2="320" y2="450" stroke="#e1e4e8" stroke-dasharray="4,4"/>
  <line x1="390" y1="75" x2="390" y2="450" stroke="#e1e4e8" stroke-dasharray="4,4"/>
  <line x1="460" y1="75" x2="460" y2="450" stroke="#e1e4e8" stroke-dasharray="4,4"/>
  <line x1="530" y1="75" x2="530" y2="450" stroke="#e1e4e8" stroke-dasharray="4,4"/>
  <line x1="600" y1="75" x2="600" y2="450" stroke="#e1e4e8" stroke-dasharray="4,4"/>
  <line x1="670" y1="75" x2="670" y2="450" stroke="#e1e4e8" stroke-dasharray="4,4"/>

  <!-- Horizontal Grid Lines -->
  <line x1="110" y1="400" x2="670" y2="400" stroke="#e1e4e8" stroke-dasharray="4,4"/>
  <line x1="110" y1="350" x2="670" y2="350" stroke="#e1e4e8" stroke-dasharray="4,4"/>
  <line x1="110" y1="300" x2="670" y2="300" stroke="#e1e4e8" stroke-dasharray="4,4"/>
  <line x1="110" y1="250" x2="670" y2="250" stroke="#e1e4e8" stroke-dasharray="4,4"/>
  <line x1="110" y1="200" x2="670" y2="200" stroke="#e1e4e8" stroke-dasharray="4,4"/>
  <line x1="110" y1="150" x2="670" y2="150" stroke="#e1e4e8" stroke-dasharray="4,4"/>
  <line x1="110" y1="100" x2="670" y2="100" stroke="#e1e4e8" stroke-dasharray="4,4"/>

  <!-- Baseline (0 °C tolerance line) -->
  <line x1="110" y1="450" x2="670" y2="450" stroke="#1a1a1a" stroke-width="1.5"/>

  <!-- Y-Axis Ticks -->
  <line x1="110" y1="450" x2="104" y2="450" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="110" y1="400" x2="104" y2="400" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="110" y1="350" x2="104" y2="350" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="110" y1="300" x2="104" y2="300" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="110" y1="250" x2="104" y2="250" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="110" y1="200" x2="104" y2="200" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="110" y1="150" x2="104" y2="150" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="110" y1="100" x2="104" y2="100" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Y-Axis Labels -->
  <text x="102" y="454" font-size="11" fill="#6b7280" text-anchor="end">0,0 °C</text>
  <text x="102" y="404" font-size="11" fill="#6b7280" text-anchor="end">1,0 °C</text>
  <text x="102" y="354" font-size="11" fill="#6b7280" text-anchor="end">2,0 °C</text>
  <text x="102" y="304" font-size="11" fill="#6b7280" text-anchor="end">3,0 °C</text>
  <text x="102" y="254" font-size="11" fill="#6b7280" text-anchor="end">4,0 °C</text>
  <text x="102" y="204" font-size="11" fill="#6b7280" text-anchor="end">5,0 °C</text>
  <text x="102" y="154" font-size="11" fill="#6b7280" text-anchor="end">6,0 °C</text>
  <text x="102" y="104" font-size="11" fill="#6b7280" text-anchor="end">7,0 °C</text>

  <!-- Y-Axis Title -->
  <text x="20" y="70" font-size="12" font-weight="bold" fill="#1a1a1a">Допуск Δt (°C)</text>

  <!-- X-Axis Ticks -->
  <line x1="110" y1="450" x2="110" y2="456" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="180" y1="450" x2="180" y2="456" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="250" y1="450" x2="250" y2="456" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="320" y1="450" x2="320" y2="456" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="390" y1="450" x2="390" y2="456" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="460" y1="450" x2="460" y2="456" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="530" y1="450" x2="530" y2="456" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="600" y1="450" x2="600" y2="456" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="670" y1="450" x2="670" y2="456" stroke="#1a1a1a" stroke-width="1"/>

  <!-- X-Axis Labels -->
  <text x="110" y="472" font-size="11" fill="#6b7280" text-anchor="middle">-200</text>
  <text x="180" y="472" font-size="11" fill="#6b7280" text-anchor="middle">-100</text>
  <text x="250" y="472" font-size="11" font-weight="bold" fill="#1a1a1a" text-anchor="middle">0</text>
  <text x="320" y="472" font-size="11" fill="#6b7280" text-anchor="middle">+100</text>
  <text x="390" y="472" font-size="11" fill="#6b7280" text-anchor="middle">+200</text>
  <text x="460" y="472" font-size="11" fill="#6b7280" text-anchor="middle">+300</text>
  <text x="530" y="472" font-size="11" fill="#6b7280" text-anchor="middle">+400</text>
  <text x="600" y="472" font-size="11" fill="#6b7280" text-anchor="middle">+500</text>
  <text x="670" y="472" font-size="11" fill="#6b7280" text-anchor="middle">+600</text>

  <!-- X-Axis Title -->
  <text x="390" y="500" font-size="13" font-weight="bold" fill="#1a1a1a" text-anchor="middle">Вимірювана температура t (°C)</text>

  <!-- Curves -->
  <!-- Class C curve -->
  <path d="M 110 320 L 180 370 L 250 420 L 320 370 L 390 320 L 530 220 L 670 120" fill="none" stroke="#c0392b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Class B curve -->
  <path d="M 110 385 L 180 410 L 250 435 L 320 410 L 390 385 L 530 335 L 670 285" fill="none" stroke="#2457d6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Class A curve -->
  <path d="M 180 432.5 L 250 442.5 L 320 432.5 L 390 422.5 L 460 412.5 L 565 397.5" fill="none" stroke="#27ae60" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Class AA curve -->
  <path d="M 215 440.75 L 250 445 L 320 436.5 L 390 428 L 425 423.75" fill="none" stroke="#8e44ad" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- End Points & Labels -->
  <!-- Class C -->
  <circle cx="110" cy="320" r="3.5" fill="#c0392b"/>
  <circle cx="670" cy="120" r="3.5" fill="#c0392b"/>
  <text x="660" y="112" font-size="12" font-weight="bold" fill="#c0392b" text-anchor="end">Class C</text>

  <!-- Class B -->
  <circle cx="110" cy="385" r="3.5" fill="#2457d6"/>
  <circle cx="670" cy="285" r="3.5" fill="#2457d6"/>
  <text x="660" y="276" font-size="12" font-weight="bold" fill="#2457d6" text-anchor="end">Class B</text>

  <!-- Class A -->
  <circle cx="180" cy="432.5" r="3.5" fill="#27ae60"/>
  <circle cx="565" cy="397.5" r="3.5" fill="#27ae60"/>
  <text x="555" y="388" font-size="12" font-weight="bold" fill="#27ae60" text-anchor="end">Class A</text>

  <!-- Class AA -->
  <circle cx="215" cy="440.75" r="3.5" fill="#8e44ad"/>
  <circle cx="425" cy="423.75" r="3.5" fill="#8e44ad"/>
  <text x="415" y="414" font-size="12" font-weight="bold" fill="#8e44ad" text-anchor="end">Class AA</text>

  <!-- Dots at 0 °C -->
  <circle cx="250" cy="420" r="4" fill="#c0392b"/>
  <circle cx="250" cy="435" r="4" fill="#2457d6"/>
  <circle cx="250" cy="442.5" r="4" fill="#27ae60"/>
  <circle cx="250" cy="445" r="4" fill="#8e44ad"/>

  <!-- In-Chart Info Box (upper left) -->
  <rect x="120" y="90" width="165" height="105" fill="white" stroke="#d0d7de" stroke-width="1" rx="6"/>
  <text x="130" y="108" font-size="12" font-weight="bold" fill="#1a1a1a">Особливості класів:</text>
  <text x="130" y="126" font-size="11" fill="#1a1a1a">• 0 °C — мінімум похибки</text>
  <text x="130" y="144" font-size="11" fill="#1a1a1a">• Δt зростає симетрично</text>
  <text x="130" y="162" font-size="11" fill="#8e44ad">• AA — найвища точність</text>
  <text x="130" y="180" font-size="11" fill="#c0392b">• C — для грубих вимірів</text>

  <!-- Divergence Annotation (High temperature region) -->
  <line x1="650" y1="195" x2="650" y2="135" stroke="#c0392b" stroke-dasharray="3,3" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <line x1="650" y1="245" x2="650" y2="275" stroke="#c0392b" stroke-dasharray="3,3" stroke-width="1.2" marker-end="url(#arr-red)"/>
  <text x="610" y="222" font-size="11" font-weight="bold" fill="#c0392b" text-anchor="middle">Різниця 3,3 °C</text>
  <text x="610" y="237" font-size="10" fill="#6b7280" text-anchor="middle">при +600 °C</text>

  <!-- Right Panel Card -->
  <rect x="695" y="75" width="245" height="390" fill="#f4f6f8" stroke="#d0d7de" stroke-width="1.5" rx="6"/>

  <text x="710" y="100" font-size="13" font-weight="bold" fill="#1a1a1a">Формули та класи (IEC 60751)</text>

  <!-- Class AA Item -->
  <rect x="710" y="118" width="20" height="4" fill="#8e44ad" rx="2"/>
  <text x="738" y="122" font-size="12" font-weight="bold" fill="#8e44ad">Class AA (1/3 DIN)</text>
  <text x="738" y="138" font-size="11" fill="#1a1a1a">Δt = ±(0,10 + 0,0017·|t|)</text>
  <text x="738" y="152" font-size="11" fill="#6b7280">Діапазон: -50 … +250 °C</text>

  <!-- Class A Item -->
  <rect x="710" y="173" width="20" height="4" fill="#27ae60" rx="2"/>
  <text x="738" y="177" font-size="12" font-weight="bold" fill="#27ae60">Class A</text>
  <text x="738" y="193" font-size="11" fill="#1a1a1a">Δt = ±(0,15 + 0,002·|t|)</text>
  <text x="738" y="207" font-size="11" fill="#6b7280">Діапазон: -100 … +450 °C</text>

  <!-- Class B Item -->
  <rect x="710" y="228" width="20" height="4" fill="#2457d6" rx="2"/>
  <text x="738" y="232" font-size="12" font-weight="bold" fill="#2457d6">Class B (Базовий)</text>
  <text x="738" y="248" font-size="11" fill="#1a1a1a">Δt = ±(0,30 + 0,005·|t|)</text>
  <text x="738" y="262" font-size="11" fill="#6b7280">Діапазон: -196 … +600 °C</text>

  <!-- Class C Item -->
  <rect x="710" y="283" width="20" height="4" fill="#c0392b" rx="2"/>
  <text x="738" y="287" font-size="12" font-weight="bold" fill="#c0392b">Class C</text>
  <text x="738" y="303" font-size="11" fill="#1a1a1a">Δt = ±(0,60 + 0,010·|t|)</text>
  <text x="738" y="317" font-size="11" fill="#6b7280">Діапазон: -196 … +600 °C</text>

  <!-- Divider -->
  <line x1="710" y1="330" x2="925" y2="330" stroke="#d0d7de" stroke-width="1"/>

  <!-- Summary at 0 °C -->
  <text x="710" y="348" font-size="12" font-weight="bold" fill="#1a1a1a">Допуск при t = 0 °C:</text>
  <text x="715" y="366" font-size="11" fill="#8e44ad">• Class AA: ±0,10 °C</text>
  <text x="715" y="382" font-size="11" fill="#27ae60">• Class A:  ±0,15 °C</text>
  <text x="715" y="398" font-size="11" fill="#2457d6">• Class B:  ±0,30 °C</text>
  <text x="715" y="414" font-size="11" fill="#c0392b">• Class C:  ±0,60 °C</text>

  <text x="710" y="437" font-size="11" fill="#6b7280">Плівкові (TF) й дротяні (WW)</text>
  <text x="710" y="451" font-size="11" fill="#6b7280">мають різні робочі межі</text>
</svg>
